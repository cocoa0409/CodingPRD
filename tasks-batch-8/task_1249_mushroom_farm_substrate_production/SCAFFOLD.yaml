# =============================================================================
# Task 1249 — Mushroom Farm & Substrate Production (Kennett Square)
# SCAFFOLD.yaml — §1.0–§1.7
# =============================================================================

scenario: |
  1249. Mushroom Farm & Substrate Production (Kennett Square mushroom farm):
  substrate batch & pasteurization cycle, spawn run & fruiting room scheduling,
  flush cycle yield tracking & room turnover, contamination event & room
  quarantine, harvest labor piece-rate & grading, packaging & shelf-life clock,
  spent substrate disposal/resale, variety mix & buyer commitment

domain_name: mushroom-farm
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing        # tunnel/room window scheduling with overlap+buffer rules
  secondary_archetype: posture_driven_gating   # room health posture (CLEAR/WATCH/QUARANTINED) gates child ops
  complexity_layers:
    - optimistic_concurrency                   # OCC on GrowingRoom.version (cycle create) and BuyerCommitment.version (activate)
    - cascading_side_effects                   # contamination confirm -> room quarantine -> cycle abort -> spent lot + commitment risk
    - dual_variant_calculation                 # piece pay provisional-vs-final; yield projection scheduled-vs-actualized
    - rate_threshold_triggers                  # pasteurization hours, shelf-life expiry, shortfall tiers, tonnage exhaustion
  entity_topology: flat                        # peer entities with FK references; sub-resources only for creation/listing
  state_machine_shape: parallel                # GrowingRoom carries occupancy x health as independent dimensions;
                                               # batch/piece/lot machines are cyclic (retry, dispute, deallocate, release loops)
  relationship_patterns:
    - one_to_many                              # commitment->lines, cycle->flushes, flush->pieces/lots
    - cross_aggregate                          # events reference room AND cycle; lots reference flush AND line
  role_model: segregation_of_duties            # crew lead logs pieces; payroll clerk approves; same user never does both
  consistency_model: immediate                 # every cascade and derived field is reconciled inside the request

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Variety
    parent: null
    common_fields: true
    fields:
      - { name: variety_code, type: string, source: input, description: "Unique variety code (e.g. WB1)" }
      - { name: display_name, type: string, source: input, description: "Display name (e.g. White Button)" }
      - { name: substrate_recipe, type: enum, source: input, description: "Required substrate recipe; constraints: PHASE_II_COMPOST | STRAW_SAWDUST" }
      - { name: target_bioefficiency_pct, type: number, source: input, description: "Expected fresh kg harvested per 100 kg of spawned substrate" }
      - { name: shelf_life_days, type: integer, source: input, description: "Shelf life in whole days added to packed_at to compute expires_at" }
      - { name: spawn_run_days, type: integer, source: input, description: "Minimum whole days from placement before CASING advance" }
      - { name: casing_days, type: integer, source: input, description: "Minimum whole days from casing before FRUITING advance" }
      - { name: max_flushes, type: integer, source: input, description: "Maximum flush harvests per room cycle (>= 1)" }
      - { name: flush_yield_distribution, type: array, source: input, description: "Array of fractions (length == max_flushes, sums to 1.0) of total expected yield per flush index" }
      - { name: active_committed_kg, type: number, source: computed, description: "Sum of committed_kg over CommitmentLines of this variety with status ACTIVE", default: 0.0 }
      - { name: planned_production_kg, type: number, source: computed, description: "Sum of scheduled_projection_kg over RoomCycles of this variety with status IN {SCHEDULED, SPAWN_RUN, CASING, FRUITING}", default: 0.0 }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer organization name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; toggled via PATCH /api/buyers/{id}", default: ACTIVE }
      - { name: lifetime_shortfall_penalty_cents, type: integer, source: computed, description: "Sum of penalty_cents over all SETTLED lines of this buyer's commitments", default: 0 }

  - name: BuyerCommitment
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; owning buyer" }
      - { name: reference, type: string, source: input, description: "Purchase-order reference string" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED | CANCELLED", default: DRAFT }
      - { name: total_committed_kg, type: number, source: computed, description: "Sum of committed_kg over child lines", default: 0.0 }
      - { name: total_delivered_kg, type: number, source: computed, description: "Sum of delivered_kg over child lines", default: 0.0 }
      - { name: total_shortfall_penalty_cents, type: integer, source: computed, description: "Sum of penalty_cents over child lines", default: 0 }

  - name: CommitmentLine
    parent: null
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "FK -> BuyerCommitment.id; set from path on creation" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; committed variety" }
      - { name: committed_kg, type: number, source: input, description: "Committed quantity in kg (> 0)" }
      - { name: week_start, type: datetime, source: input, description: "Delivery week window start (ISO8601 UTC)" }
      - { name: week_end, type: datetime, source: input, description: "Delivery week window end (must be > week_start)" }
      - { name: min_grade, type: enum, source: input, description: "Minimum acceptable grade; constraints: A | B; B accepts A or B lots", default: B }
      - { name: delivered_kg, type: number, source: computed, description: "Sum of lot_kg over SHIPPED PackagedLots allocated to this line", default: 0.0 }
      - { name: allocated_kg, type: number, source: computed, description: "Sum of lot_kg over ALLOCATED (not yet shipped/expired) PackagedLots of this line", default: 0.0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SETTLED | CANCELLED", default: DRAFT }
      - { name: settlement_outcome, type: enum, source: system, description: "Set at settlement; constraints: FULFILLED | SHORTFALL; null until SETTLED", default: null }
      - { name: shortfall_kg, type: number, source: computed, description: "committed_kg - delivered_kg at settlement (0.0 before settlement)", default: 0.0 }
      - { name: penalty_cents, type: integer, source: computed, description: "Tiered shortfall penalty computed at settlement (0 before)", default: 0 }
      - { name: supply_at_risk, type: boolean, source: computed, description: "True when variety planned_production_kg < (committed_kg - delivered_kg) while status == ACTIVE", default: false }

  - name: SubstrateBatch
    parent: null
    common_fields: true
    fields:
      - { name: recipe, type: enum, source: input, description: "Substrate recipe; constraints: PHASE_II_COMPOST | STRAW_SAWDUST" }
      - { name: tonnage, type: number, source: input, description: "Total batch tonnage (> 0)" }
      - { name: variety_id, type: string, source: system, description: "FK -> Variety.id; spawn variety assigned at spawn; null until SPAWNED", default: null }
      - { name: spawn_kg, type: number, source: system, description: "Kg of spawn mixed at spawning; null until SPAWNED", default: null }
      - { name: remaining_tonnage, type: number, source: computed, description: "tonnage minus sum of allocated_tonnage over RoomCycles with status NOT IN {CANCELLED}", default: 0.0 }
      - { name: status, type: enum, source: system, description: "MIXED -> PASTEURIZING -> CONDITIONED -> SPAWNED -> EXHAUSTED -> RETIRED; PASTEURIZING -> MIXED on pasteurization failure/abort", default: MIXED }
      - { name: spent_revenue_cents, type: integer, source: computed, description: "Sum of sale_price_cents over SOLD SpentSubstrateLots of this batch", default: 0 }
      - { name: disposal_cost_cents, type: integer, source: computed, description: "Sum of disposal_cost_cents over DISPOSED SpentSubstrateLots of this batch", default: 0 }

  - name: PasteurizationTunnel
    parent: null
    common_fields: true
    fields:
      - { name: tunnel_code, type: string, source: input, description: "Unique tunnel code" }
      - { name: capacity_tonnes, type: number, source: input, description: "Maximum batch tonnage per cycle (> 0)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE; forced OUT_OF_SERVICE on cycle failure, restored by sanitize", default: AVAILABLE }

  - name: PasteurizationCycle
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> SubstrateBatch.id; batch being pasteurized" }
      - { name: tunnel_id, type: string, source: input, description: "FK -> PasteurizationTunnel.id; tunnel resource booked" }
      - { name: planned_start, type: datetime, source: input, description: "Planned window start (ISO8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned window end (must be > planned_start)" }
      - { name: actual_start, type: datetime, source: system, description: "Clock timestamp when cycle entered RUNNING; null until started", default: null }
      - { name: hours_at_target_temp, type: number, source: system, description: "Hours held at target temperature, reported at completion", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RUNNING -> COMPLETED | FAILED; SCHEDULED -> ABORTED", default: SCHEDULED }

  - name: GrowingRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_code, type: string, source: input, description: "Unique room code" }
      - { name: capacity_tonnes, type: number, source: input, description: "Maximum substrate tonnage per room cycle (> 0)" }
      - { name: occupancy_status, type: enum, source: system, description: "Independent dimension 1: IDLE -> OCCUPIED -> TURNAROUND -> IDLE", default: IDLE }
      - { name: health_status, type: enum, source: system, description: "Independent dimension 2: CLEAR | WATCH | QUARANTINED, derived from open ContaminationEvents", default: CLEAR }

  - name: RoomCycle
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> GrowingRoom.id; room booked for this crop" }
      - { name: batch_id, type: string, source: input, description: "FK -> SubstrateBatch.id; spawned batch drawn down" }
      - { name: variety_id, type: string, source: system, description: "FK -> Variety.id; copied from batch.variety_id at creation" }
      - { name: allocated_tonnage, type: number, source: input, description: "Tonnage reserved from the batch (> 0, <= batch.remaining_tonnage, <= room.capacity_tonnes)" }
      - { name: planned_start, type: datetime, source: input, description: "Planned occupancy window start (ISO8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned occupancy window end (must be > planned_start)" }
      - { name: placed_at, type: datetime, source: system, description: "Clock timestamp of placement (SPAWN_RUN entry); null until placed", default: null }
      - { name: phase_entered_at, type: datetime, source: system, description: "Clock timestamp of last phase entry; null until placed", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> SPAWN_RUN -> CASING -> FRUITING -> TURNAROUND -> CLOSED; SCHEDULED -> CANCELLED; SPAWN_RUN|CASING|FRUITING -> ABORTED", default: SCHEDULED }
      - { name: flush_count, type: integer, source: computed, description: "Count of FlushHarvests with status IN {GRADED, SETTLED}", default: 0 }
      - { name: harvested_kg, type: number, source: computed, description: "Sum of total_kg over FlushHarvests with status IN {GRADED, SETTLED}", default: 0.0 }
      - { name: scheduled_projection_kg, type: number, source: computed, description: "Forward-looking yield projection: allocated_tonnage * 1000 * target_bioefficiency_pct / 100", default: 0.0 }
      - { name: actualized_projection_kg, type: number, source: computed, description: "Actualized yield projection: graded kg + per-remaining-flush expectation from flush_yield_distribution", default: 0.0 }

  - name: FlushHarvest
    parent: null
    common_fields: true
    fields:
      - { name: room_cycle_id, type: string, source: system, description: "FK -> RoomCycle.id; set from path on creation" }
      - { name: flush_number, type: integer, source: system, description: "1-based sequential index among flushes of this cycle" }
      - { name: recorded_at, type: datetime, source: system, description: "Clock timestamp when the flush was recorded" }
      - { name: total_kg, type: number, source: input, description: "Total picked kg for this flush (> 0)" }
      - { name: grade_a_kg, type: number, source: system, description: "Grade A kg assigned at grading; null until GRADED", default: null }
      - { name: grade_b_kg, type: number, source: system, description: "Grade B kg assigned at grading; null until GRADED", default: null }
      - { name: cull_kg, type: number, source: system, description: "Cull (unmarketable) kg assigned at grading; null until GRADED", default: null }
      - { name: graded_at, type: datetime, source: system, description: "Clock timestamp of grading; null until GRADED", default: null }
      - { name: status, type: enum, source: system, description: "RECORDED -> GRADED -> SETTLED; GRADED -> RECORDED via reopen", default: RECORDED }

  - name: HarvestPiece
    parent: null
    common_fields: true
    fields:
      - { name: flush_id, type: string, source: system, description: "FK -> FlushHarvest.id; set from path on creation" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; picker being credited" }
      - { name: logged_by_user_id, type: string, source: system, description: "X-User-ID of the HarvestCrewLead who logged the piece (segregation-of-duties anchor)" }
      - { name: kg_picked, type: number, source: input, description: "Kg picked by this worker for this flush (> 0)" }
      - { name: rate_cents_per_kg, type: integer, source: system, description: "Piece rate snapshot copied from worker.piece_rate_cents_per_kg at logging" }
      - { name: provisional_pay_cents, type: integer, source: computed, description: "Provisional flat pay: round_half_up(kg_picked * rate_cents_per_kg), computed at logging" }
      - { name: final_pay_cents, type: integer, source: computed, description: "Grade-weighted pay computed at approval; null while LOGGED/DISPUTED", default: null }
      - { name: status, type: enum, source: system, description: "LOGGED -> APPROVED -> PAID; APPROVED -> DISPUTED; DISPUTED -> APPROVED", default: LOGGED }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker full name" }
      - { name: crew_code, type: string, source: input, description: "Crew assignment code" }
      - { name: piece_rate_cents_per_kg, type: integer, source: input, description: "Contracted piece rate in cents per kg (> 0)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; toggled via PATCH /api/workers/{id}", default: ACTIVE }
      - { name: accrued_unpaid_cents, type: integer, source: computed, description: "Sum of final_pay_cents over APPROVED pieces of this worker", default: 0 }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of final_pay_cents over PAID pieces of this worker", default: 0 }

  - name: ContaminationEvent
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> GrowingRoom.id; affected room" }
      - { name: room_cycle_id, type: string, source: input, description: "FK -> RoomCycle.id; affected cycle (optional, must be a cycle of room_id when given)", default: null }
      - { name: pathogen, type: enum, source: input, description: "Detected pathogen; constraints: TRICHODERMA | COBWEB | BACTERIAL_BLOTCH | VIRUS" }
      - { name: severity, type: integer, source: input, description: "Severity 1-5; confirm with severity >= 4 forces quarantine cascade" }
      - { name: affected_zone_pct, type: number, source: input, description: "Estimated affected percentage of room area (0-100)" }
      - { name: status, type: enum, source: system, description: "REPORTED -> CONFIRMED -> REMEDIATING -> CLEARED; REPORTED -> DISMISSED", default: REPORTED }

  - name: PackagedLot
    parent: null
    common_fields: true
    fields:
      - { name: flush_id, type: string, source: system, description: "FK -> FlushHarvest.id; source flush, set from path on creation" }
      - { name: variety_id, type: string, source: system, description: "FK -> Variety.id; copied from the flush's cycle at creation" }
      - { name: grade, type: enum, source: input, description: "Packed grade; constraints: A | B (culls are not packable)" }
      - { name: units, type: integer, source: input, description: "Number of retail units (> 0)" }
      - { name: kg_per_unit, type: number, source: input, description: "Kg per unit (> 0); lot_kg = units * kg_per_unit" }
      - { name: lot_kg, type: number, source: computed, description: "units * kg_per_unit, rounded to 2 decimals half-up" }
      - { name: packed_at, type: datetime, source: system, description: "Clock timestamp of packaging" }
      - { name: expires_at, type: datetime, source: computed, description: "packed_at + variety.shelf_life_days" }
      - { name: allocated_line_id, type: string, source: system, description: "FK -> CommitmentLine.id; set while ALLOCATED, null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "IN_STOCK -> ALLOCATED -> SHIPPED; ALLOCATED -> IN_STOCK via deallocate; IN_STOCK|ALLOCATED -> EXPIRED via sweep", default: IN_STOCK }

  - name: SpentSubstrateLot
    parent: null
    common_fields: true
    fields:
      - { name: room_cycle_id, type: string, source: system, description: "FK -> RoomCycle.id; cycle whose turnover produced this lot" }
      - { name: batch_id, type: string, source: system, description: "FK -> SubstrateBatch.id; originating batch (copied from cycle)" }
      - { name: tonnage, type: number, source: computed, description: "round(cycle.allocated_tonnage * 0.75, 2) — post-crop mass after 25% loss" }
      - { name: disposal_only, type: boolean, source: system, description: "True when produced by a contamination abort; such lots may only be disposed", default: false }
      - { name: reserved_buyer_id, type: string, source: system, description: "FK -> Buyer.id; set while RESERVED, null otherwise", default: null }
      - { name: sale_price_cents, type: integer, source: system, description: "Agreed sale price recorded at sale; null until SOLD", default: null }
      - { name: disposal_cost_cents, type: integer, source: system, description: "round(tonnage * 2500) tipping fee recorded at disposal; null until DISPOSED", default: null }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> RESERVED -> SOLD; RESERVED -> AVAILABLE via release; AVAILABLE|RESERVED -> DISPOSED", default: AVAILABLE }

# =============================================================================
# §1.2 State Machine Table (11 entities, 12 machines — GrowingRoom has two
# independent parallel dimensions declared as separate machines with `field:`)
# =============================================================================
state_machines:
  - entity: SubstrateBatch
    initial_state: MIXED
    terminal_states: [RETIRED]
    transitions:
      - from: MIXED
        to: PASTEURIZING
        trigger: "POST /api/pasteurization-cycles (creation binds this batch)"
        actor: CompostSupervisor
        preconditions:
          - "Batch must be MIXED (ERR_BATCH_NOT_MIXED)"
        side_effects:
          - "increments SubstrateBatch.version by 1"
      - from: PASTEURIZING
        to: CONDITIONED
        trigger: "POST /api/pasteurization-cycles/{cycleId}/complete"
        actor: CompostSupervisor
        preconditions:
          - "Cycle must be RUNNING (ERR_CYCLE_INVALID_STATE)"
          - "hours_at_target_temp >= 6.0 (ERR_PASTEURIZATION_INCOMPLETE)"
        side_effects:
          - "increments SubstrateBatch.version by 1"
      - from: PASTEURIZING
        to: MIXED
        trigger: "POST /api/pasteurization-cycles/{cycleId}/fail or /abort"
        actor: CompostSupervisor
        preconditions: []
        side_effects:
          - "On fail: PasteurizationTunnel.status -> OUT_OF_SERVICE"
          - "increments SubstrateBatch.version by 1"
      - from: CONDITIONED
        to: SPAWNED
        trigger: "POST /api/substrate-batches/{batchId}/spawn"
        actor: CompostSupervisor
        preconditions:
          - "Batch must be CONDITIONED (ERR_BATCH_NOT_CONDITIONED)"
          - "variety.substrate_recipe must equal batch.recipe (ERR_RECIPE_MISMATCH)"
        side_effects:
          - "Sets variety_id and spawn_kg"
          - "increments SubstrateBatch.version by 1"
      - from: SPAWNED
        to: EXHAUSTED
        trigger: "system (automatic when remaining_tonnage reaches exactly 0 after a RoomCycle allocation)"
        actor: system
        preconditions:
          - "remaining_tonnage == 0 after the allocation that triggered it"
        side_effects:
          - "increments SubstrateBatch.version by 1"
      - from: EXHAUSTED
        to: RETIRED
        trigger: "POST /api/substrate-batches/{batchId}/retire"
        actor: CompostSupervisor
        preconditions:
          - "Batch must be EXHAUSTED (ERR_BATCH_NOT_EXHAUSTED)"
          - "All RoomCycles of this batch must be IN {CLOSED, CANCELLED, ABORTED} AND all SpentSubstrateLots of this batch must be IN {SOLD, DISPOSED} (ERR_UNRESOLVED_SPENT_LOTS)"
        side_effects:
          - "increments SubstrateBatch.version by 1"

  - entity: PasteurizationCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /api/pasteurization-cycles/{cycleId}/start"
        actor: CompostSupervisor
        preconditions:
          - "Cycle must be SCHEDULED (ERR_CYCLE_INVALID_STATE)"
          - "Tunnel must be AVAILABLE (ERR_TUNNEL_NOT_AVAILABLE)"
          - "planned_start <= clock now <= planned_end (ERR_CYCLE_WINDOW_NOT_OPEN)"
        side_effects:
          - "Sets actual_start to clock now"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /api/pasteurization-cycles/{cycleId}/complete"
        actor: CompostSupervisor
        preconditions:
          - "Cycle must be RUNNING (ERR_CYCLE_INVALID_STATE)"
          - "hours_at_target_temp >= 6.0 (ERR_PASTEURIZATION_INCOMPLETE)"
        side_effects:
          - "Sets hours_at_target_temp"
          - "SubstrateBatch PASTEURIZING -> CONDITIONED"
      - from: RUNNING
        to: FAILED
        trigger: "POST /api/pasteurization-cycles/{cycleId}/fail"
        actor: CompostSupervisor
        preconditions:
          - "Cycle must be RUNNING (ERR_CYCLE_INVALID_STATE)"
        side_effects:
          - "SubstrateBatch PASTEURIZING -> MIXED (hop 1)"
          - "PasteurizationTunnel AVAILABLE -> OUT_OF_SERVICE (hop 2, caused by the failure event on this cycle)"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /api/pasteurization-cycles/{cycleId}/abort"
        actor: CompostSupervisor
        preconditions:
          - "Cycle must be SCHEDULED (ERR_CYCLE_INVALID_STATE)"
        side_effects:
          - "SubstrateBatch PASTEURIZING -> MIXED"

  - entity: PasteurizationTunnel
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "system (automatic when a PasteurizationCycle in this tunnel is failed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /api/pasteurization-tunnels/{tunnelId}/sanitize"
        actor: CompostSupervisor
        preconditions:
          - "Tunnel must be OUT_OF_SERVICE (ERR_TUNNEL_NOT_AVAILABLE)"
        side_effects: []

  - entity: GrowingRoom
    field: occupancy_status
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: OCCUPIED
        trigger: "system (automatic when a RoomCycle is placed in this room)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: TURNAROUND
        trigger: "system (automatic when the occupying RoomCycle ends cropping or is aborted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TURNAROUND
        to: IDLE
        trigger: "system (automatic when the occupying RoomCycle is certified clean)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GrowingRoom
    field: health_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "system (automatic when a ContaminationEvent on this room is CONFIRMED with severity <= 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEAR
        to: QUARANTINED
        trigger: "system (automatic when a ContaminationEvent on this room is CONFIRMED with severity >= 4)"
        actor: system
        preconditions: []
        side_effects:
          - "RoomCycle in SPAWN_RUN|CASING|FRUITING on this room -> ABORTED (next hop of the quarantine cascade)"
      - from: WATCH
        to: QUARANTINED
        trigger: "system (automatic when a ContaminationEvent on this room is CONFIRMED with severity >= 4)"
        actor: system
        preconditions: []
        side_effects:
          - "RoomCycle in SPAWN_RUN|CASING|FRUITING on this room -> ABORTED"
      - from: QUARANTINED
        to: WATCH
        trigger: "system (automatic on event clear when no remaining open event has severity >= 4 but other open events exist)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: CLEAR
        trigger: "system (automatic on event clear when no open events remain for this room)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: CLEAR
        trigger: "system (automatic on event clear when no open events remain for this room)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RoomCycle
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: SPAWN_RUN
        trigger: "POST /api/room-cycles/{roomCycleId}/place"
        actor: FarmManager
        preconditions:
          - "Cycle must be SCHEDULED (ERR_ROOM_CYCLE_INVALID_PHASE)"
          - "Room occupancy_status must be IDLE (ERR_ROOM_NOT_IDLE)"
          - "Room health_status must not be QUARANTINED (ERR_ROOM_QUARANTINED)"
          - "planned_start <= clock now <= planned_end (ERR_CYCLE_WINDOW_NOT_OPEN)"
        side_effects:
          - "Sets placed_at and phase_entered_at to clock now"
          - "Computes scheduled_projection_kg = allocated_tonnage * 1000 * variety.target_bioefficiency_pct / 100"
          - "Sets actualized_projection_kg = scheduled_projection_kg"
          - "GrowingRoom occupancy_status IDLE -> OCCUPIED"
          - "Variety.planned_production_kg recomputed"
      - from: SPAWN_RUN
        to: CASING
        trigger: "POST /api/room-cycles/{roomCycleId}/advance"
        actor: FarmManager
        preconditions:
          - "Cycle must be SPAWN_RUN (ERR_ROOM_CYCLE_INVALID_PHASE)"
          - "clock now >= placed_at + variety.spawn_run_days days (ERR_COLONIZATION_INCOMPLETE)"
        side_effects:
          - "Sets phase_entered_at to clock now"
      - from: CASING
        to: FRUITING
        trigger: "POST /api/room-cycles/{roomCycleId}/advance"
        actor: FarmManager
        preconditions:
          - "Cycle must be CASING (ERR_ROOM_CYCLE_INVALID_PHASE)"
          - "clock now >= phase_entered_at + variety.casing_days days (ERR_COLONIZATION_INCOMPLETE)"
        side_effects:
          - "Sets phase_entered_at to clock now"
      - from: FRUITING
        to: TURNAROUND
        trigger: "POST /api/room-cycles/{roomCycleId}/end-cropping OR system (automatic when flush_count reaches variety.max_flushes after a grading)"
        actor: FarmManager
        preconditions:
          - "Cycle must be FRUITING (ERR_ROOM_CYCLE_INVALID_PHASE)"
        side_effects:
          - "Creates SpentSubstrateLot: tonnage = round(allocated_tonnage * 0.75, 2), disposal_only = false (hop caused by this turnover)"
          - "GrowingRoom occupancy_status OCCUPIED -> TURNAROUND"
          - "Variety.planned_production_kg recomputed (this cycle leaves the planning set)"
      - from: TURNAROUND
        to: CLOSED
        trigger: "POST /api/room-cycles/{roomCycleId}/certify-cleanout"
        actor: FarmManager
        preconditions:
          - "Cycle must be TURNAROUND (ERR_ROOM_CYCLE_INVALID_PHASE)"
        side_effects:
          - "GrowingRoom occupancy_status TURNAROUND -> IDLE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/room-cycles/{roomCycleId}/cancel"
        actor: FarmManager
        preconditions:
          - "Cycle must be SCHEDULED (ERR_ROOM_CYCLE_INVALID_PHASE)"
        side_effects:
          - "Releases the tonnage reservation: SubstrateBatch.remaining_tonnage += allocated_tonnage (compensating action of the creation reservation)"
          - "Variety.planned_production_kg recomputed"
      - from: SPAWN_RUN
        to: ABORTED
        trigger: "POST /api/room-cycles/{roomCycleId}/abort OR system (quarantine cascade from ContaminationEvent confirm)"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "Creates SpentSubstrateLot: tonnage = round(allocated_tonnage * 0.75, 2), disposal_only = true iff abort was caused by the quarantine cascade, else false"
          - "GrowingRoom occupancy_status OCCUPIED -> TURNAROUND"
          - "Variety.planned_production_kg recomputed; CommitmentLine.supply_at_risk recomputed for ACTIVE lines of this variety"
      - from: CASING
        to: ABORTED
        trigger: "POST /api/room-cycles/{roomCycleId}/abort OR system (quarantine cascade)"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "Same side effects as SPAWN_RUN -> ABORTED"
      - from: FRUITING
        to: ABORTED
        trigger: "POST /api/room-cycles/{roomCycleId}/abort OR system (quarantine cascade)"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "Same side effects as SPAWN_RUN -> ABORTED"

  - entity: FlushHarvest
    initial_state: RECORDED
    terminal_states: [SETTLED]
    transitions:
      - from: RECORDED
        to: GRADED
        trigger: "POST /api/flushes/{flushId}/grade"
        actor: GradingInspector
        preconditions:
          - "Flush must be RECORDED (ERR_FLUSH_NOT_RECORDED)"
          - "grade_a_kg + grade_b_kg + cull_kg must equal total_kg exactly at 2 decimals (ERR_GRADE_SPLIT_MISMATCH)"
        side_effects:
          - "Sets grade_a_kg, grade_b_kg, cull_kg, graded_at"
          - "RoomCycle.flush_count += 1 and RoomCycle.harvested_kg += total_kg (bubble up)"
          - "RoomCycle.actualized_projection_kg recomputed"
          - "If flush_count == variety.max_flushes: RoomCycle FRUITING -> TURNAROUND auto end-cropping, which creates the SpentSubstrateLot and moves the room to TURNAROUND (cascade hop)"
      - from: GRADED
        to: RECORDED
        trigger: "POST /api/flushes/{flushId}/reopen"
        actor: GradingInspector
        preconditions:
          - "Flush must be GRADED (ERR_FLUSH_NOT_GRADED)"
          - "Parent RoomCycle must still be FRUITING (ERR_ROOM_CYCLE_INVALID_PHASE)"
          - "No PackagedLots exist for this flush AND all HarvestPieces of this flush are LOGGED (ERR_FLUSH_HAS_COMMITTED_PIECES)"
        side_effects:
          - "Clears grade_a_kg, grade_b_kg, cull_kg, graded_at to null"
          - "RoomCycle.flush_count -= 1 and RoomCycle.harvested_kg -= total_kg (compensation)"
          - "RoomCycle.actualized_projection_kg recomputed"
      - from: GRADED
        to: SETTLED
        trigger: "system (automatic when the flush has >= 1 HarvestPiece and every piece is PAID; evaluated after each payout)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HarvestPiece
    initial_state: LOGGED
    terminal_states: [PAID]
    transitions:
      - from: LOGGED
        to: APPROVED
        trigger: "POST /api/pieces/{pieceId}/approve"
        actor: PayrollClerk
        preconditions:
          - "Piece must be LOGGED or DISPUTED (ERR_PIECE_INVALID_STATE)"
          - "Parent FlushHarvest must be GRADED (ERR_FLUSH_NOT_GRADED)"
          - "X-User-ID must differ from piece.logged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Computes final_pay_cents = round_half_up(kg_picked * rate_cents_per_kg * (1.20 * a_share + 1.00 * b_share + 0.0 * c_share)) using the flush grade shares"
          - "Worker.accrued_unpaid_cents += final_pay_cents"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /api/pieces/{pieceId}/approve"
        actor: PayrollClerk
        preconditions:
          - "Same as LOGGED -> APPROVED"
        side_effects:
          - "Same as LOGGED -> APPROVED"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /api/pieces/{pieceId}/dispute"
        actor: PayrollClerk
        preconditions:
          - "Piece must be APPROVED (ERR_PIECE_INVALID_STATE)"
          - "X-User-ID must differ from piece.logged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Worker.accrued_unpaid_cents -= final_pay_cents (compensating reversal of the approval)"
          - "final_pay_cents retained for audit"
      - from: APPROVED
        to: PAID
        trigger: "system (automatic during POST /api/workers/{workerId}/payout)"
        actor: system
        preconditions: []
        side_effects:
          - "Worker.accrued_unpaid_cents -= final_pay_cents; Worker.lifetime_paid_cents += final_pay_cents"
          - "If the piece's flush now has >= 1 piece and all pieces PAID: FlushHarvest GRADED -> SETTLED (bubble up)"

  - entity: BuyerCommitment
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/buyer-commitments/{commitmentId}/activate"
        actor: SalesManager
        preconditions:
          - "Commitment must be DRAFT (ERR_COMMITMENT_NOT_DRAFT)"
          - "Commitment must have >= 1 CommitmentLine (ERR_COMMITMENT_EMPTY)"
        side_effects:
          - "All child lines DRAFT -> ACTIVE"
          - "increments BuyerCommitment.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (automatic during daily sweep when every child line is SETTLED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/buyer-commitments/{commitmentId}/cancel"
        actor: SalesManager
        preconditions:
          - "Commitment must be ACTIVE (ERR_COMMITMENT_NOT_ACTIVE)"
          - "Every child line must have delivered_kg == 0 (ERR_COMMITMENT_HAS_DELIVERIES)"
          - "No PackagedLot may be ALLOCATED to any child line (ERR_COMMITMENT_HAS_ALLOCATIONS)"
        side_effects:
          - "All child lines -> CANCELLED"

  - entity: CommitmentLine
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (automatic when parent commitment is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Variety.active_committed_kg recomputed"
      - from: ACTIVE
        to: SETTLED
        trigger: "system (during POST /api/operations/run-daily-sweep when clock now > week_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Computes settlement_outcome, shortfall_kg, penalty_cents per the commitment_settlement calculation"
          - "Buyer.lifetime_shortfall_penalty_cents += penalty_cents; BuyerCommitment totals recomputed"
          - "If all sibling lines are now SETTLED or CANCELLED: BuyerCommitment ACTIVE -> CLOSED (bubble up)"
      - from: DRAFT
        to: CANCELLED
        trigger: "system (when parent commitment is cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (when parent commitment is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Variety.active_committed_kg recomputed"

  - entity: ContaminationEvent
    initial_state: REPORTED
    terminal_states: [CLEARED, DISMISSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /api/contamination-events/{eventId}/confirm"
        actor: QualityInspector
        preconditions:
          - "Event must be REPORTED (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "If severity >= 4: room health_status -> QUARANTINED (hop 1); the quarantine then aborts the room's SPAWN_RUN|CASING|FRUITING RoomCycle (hop 2); the abort creates a disposal_only SpentSubstrateLot and recomputes variety planned_production_kg and CommitmentLine.supply_at_risk (hop 3)"
          - "If severity <= 3 and room is CLEAR: room health_status -> WATCH"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /api/contamination-events/{eventId}/dismiss"
        actor: QualityInspector
        preconditions:
          - "Event must be REPORTED (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "Room health_status unchanged (REPORTED events never moved it)"
      - from: CONFIRMED
        to: REMEDIATING
        trigger: "POST /api/contamination-events/{eventId}/remediate"
        actor: QualityInspector
        preconditions:
          - "Event must be CONFIRMED (ERR_EVENT_INVALID_STATE)"
        side_effects: []
      - from: REMEDIATING
        to: CLEARED
        trigger: "POST /api/contamination-events/{eventId}/clear"
        actor: QualityInspector
        preconditions:
          - "Event must be REMEDIATING (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "Room health_status recomputed: QUARANTINED if any open (REPORTED|CONFIRMED|REMEDIATING) event on the room has severity >= 4 and status IN {CONFIRMED, REMEDIATING}; else WATCH if any open event remains; else CLEAR"

  - entity: PackagedLot
    initial_state: IN_STOCK
    terminal_states: [SHIPPED, EXPIRED]
    transitions:
      - from: IN_STOCK
        to: ALLOCATED
        trigger: "system (selected by POST /api/commitment-lines/{lineId}/allocate FEFO sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets allocated_line_id; CommitmentLine.allocated_kg += lot_kg"
      - from: ALLOCATED
        to: IN_STOCK
        trigger: "POST /api/packaged-lots/{lotId}/deallocate"
        actor: SalesManager
        preconditions:
          - "Lot must be ALLOCATED (ERR_LOT_NOT_ALLOCATED)"
        side_effects:
          - "CommitmentLine.allocated_kg -= lot_kg; allocated_line_id cleared to null"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/packaged-lots/{lotId}/ship"
        actor: SalesManager
        preconditions:
          - "Lot must be ALLOCATED (ERR_LOT_NOT_ALLOCATED)"
          - "expires_at > clock now (ERR_LOT_EXPIRED)"
        side_effects:
          - "CommitmentLine.allocated_kg -= lot_kg; CommitmentLine.delivered_kg += lot_kg"
          - "BuyerCommitment.total_delivered_kg recomputed"
      - from: IN_STOCK
        to: EXPIRED
        trigger: "system (during daily sweep when expires_at <= clock now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: EXPIRED
        trigger: "system (during daily sweep when expires_at <= clock now)"
        actor: system
        preconditions: []
        side_effects:
          - "CommitmentLine.allocated_kg -= lot_kg; allocated_line_id cleared to null"

  - entity: SpentSubstrateLot
    initial_state: AVAILABLE
    terminal_states: [SOLD, DISPOSED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /api/spent-substrate-lots/{lotId}/reserve"
        actor: SalesManager
        preconditions:
          - "Lot must be AVAILABLE (ERR_SPENT_LOT_INVALID_STATE)"
          - "Lot must not be disposal_only (ERR_SPENT_LOT_DISPOSAL_ONLY)"
          - "Buyer must exist and be ACTIVE (ERR_BUYER_NOT_FOUND / ERR_BUYER_NOT_ACTIVE)"
        side_effects:
          - "Sets reserved_buyer_id"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /api/spent-substrate-lots/{lotId}/release"
        actor: SalesManager
        preconditions:
          - "Lot must be RESERVED (ERR_SPENT_LOT_INVALID_STATE)"
        side_effects:
          - "Clears reserved_buyer_id to null"
      - from: RESERVED
        to: SOLD
        trigger: "POST /api/spent-substrate-lots/{lotId}/sell"
        actor: SalesManager
        preconditions:
          - "Lot must be RESERVED (ERR_SPENT_LOT_INVALID_STATE)"
          - "Lot must not be disposal_only (ERR_SPENT_LOT_DISPOSAL_ONLY)"
          - "sale_price_cents >= round(tonnage * 1500) (ERR_PRICE_BELOW_FLOOR)"
        side_effects:
          - "Sets sale_price_cents; SubstrateBatch.spent_revenue_cents += sale_price_cents"
      - from: AVAILABLE
        to: DISPOSED
        trigger: "POST /api/spent-substrate-lots/{lotId}/dispose"
        actor: FarmManager
        preconditions:
          - "Lot must be AVAILABLE or RESERVED (ERR_SPENT_LOT_INVALID_STATE)"
        side_effects:
          - "Sets disposal_cost_cents = round(tonnage * 2500); SubstrateBatch.disposal_cost_cents += disposal_cost_cents"
      - from: RESERVED
        to: DISPOSED
        trigger: "POST /api/spent-substrate-lots/{lotId}/dispose"
        actor: FarmManager
        preconditions:
          - "Lot must be AVAILABLE or RESERVED (ERR_SPENT_LOT_INVALID_STATE)"
        side_effects:
          - "Sets disposal_cost_cents = round(tonnage * 2500); SubstrateBatch.disposal_cost_cents += disposal_cost_cents; reserved_buyer_id cleared"

  - entity: Worker
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/workers/{workerId} with status SUSPENDED"
        actor: FarmManager
        preconditions:
          - "Worker must be ACTIVE (ERR_INVALID_REQUEST when no state change)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/workers/{workerId} with status ACTIVE"
        actor: FarmManager
        preconditions:
          - "Worker must be SUSPENDED (ERR_INVALID_REQUEST when no state change)"
        side_effects: []

  - entity: Buyer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/buyers/{buyerId} with status SUSPENDED"
        actor: SalesManager
        preconditions:
          - "Buyer must be ACTIVE (ERR_INVALID_REQUEST when no state change)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/buyers/{buyerId} with status ACTIVE"
        actor: SalesManager
        preconditions:
          - "Buyer must be SUSPENDED (ERR_INVALID_REQUEST when no state change)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned
# write-write mechanism; both reduce to a deterministic stale-version check)
# =============================================================================
concurrency_rules:
  - rule_id: room-cycle-create-stale-room
    parent_entity: GrowingRoom
    write_endpoint: "POST /api/room-cycles"
    occ_field: expected_room_version
    description: |
      Creating a RoomCycle against a GrowingRoom whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another planner has just booked a cycle in the same room (which
      legitimately bumps the room's version) and the current writer's view of
      the room's schedule is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: commitment-activate-stale-commitment
    parent_entity: BuyerCommitment
    write_endpoint: "POST /api/buyer-commitments/{commitmentId}/activate"
    occ_field: expected_commitment_version
    description: |
      Activating a BuyerCommitment whose version has advanced since the client
      last observed it is rejected. This captures the case where another sales
      writer has just amended or activated the same commitment and the current
      writer's view of the commitment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: substrate_tonnage_ledger
    trigger: "RoomCycle creation (reserve), RoomCycle cancel (release), batch read"
    algorithm: aggregation
    formula: |
      remaining_tonnage = batch.tonnage
        - SUM(room_cycle.allocated_tonnage)
          over RoomCycles with room_cycle.batch_id == batch.id
          AND room_cycle.status NOT IN {CANCELLED}
      Allocation rule at creation: allocated_tonnage <= remaining_tonnage (ERR_INSUFFICIENT_SUBSTRATE).
      If remaining_tonnage == 0 exactly after a reservation AND batch.status == SPAWNED:
        batch auto-transitions SPAWNED -> EXHAUSTED.
      Cancel of a SCHEDULED cycle releases the reservation (remaining_tonnage += allocated_tonnage).
      Abort does NOT release tonnage (substrate is physically consumed; a SpentSubstrateLot is produced instead).
    input_set: "RoomCycles of the batch with status NOT IN {CANCELLED}"
    constants:
      SPENT_YIELD_FACTOR: 0.75
    precision: "2 decimal places, round_half_up"

  - name: pasteurization_completion
    trigger: "POST /api/pasteurization-cycles/{cycleId}/complete"
    algorithm: threshold
    formula: |
      Accept completion iff hours_at_target_temp >= MIN_HOURS_AT_TARGET (boundary is INCLUSIVE:
      exactly 6.0 completes). Below 6.0 -> ERR_PASTEURIZATION_INCOMPLETE and the cycle stays RUNNING.
    input_set: "The single RUNNING PasteurizationCycle"
    constants:
      MIN_HOURS_AT_TARGET: 6.0
    precision: "1 decimal place comparison"

  - name: piece_pay
    trigger: "provisional at piece logging; final at piece approval"
    algorithm: aggregation
    formula: |
      Shares from the parent flush grading (flush must be GRADED for final):
        a_share = flush.grade_a_kg / flush.total_kg
        b_share = flush.grade_b_kg / flush.total_kg
        c_share = flush.cull_kg   / flush.total_kg
      provisional_pay_cents = round_half_up(kg_picked * rate_cents_per_kg)        # computed at LOGGING
      final_pay_cents       = round_half_up(kg_picked * rate_cents_per_kg *
                              (GRADE_A_FACTOR * a_share + GRADE_B_FACTOR * b_share + CULL_FACTOR * c_share))
      Rounding order is pinned PER PIECE: each piece's pay is rounded to whole cents at the moment
      it is computed (logging for provisional, approval for final); worker accruals and payroll
      payouts SUM the already-rounded per-piece cent values — never round after summation.
      Example: kg=40.0, rate=50, split 60/30/10 of 100 -> factor 1.02 -> provisional 2000, final 2040.
    input_set: "The HarvestPiece plus its parent GRADED FlushHarvest"
    constants:
      GRADE_A_FACTOR: 1.20
      GRADE_B_FACTOR: 1.00
      CULL_FACTOR: 0.0
    precision: "0 decimal places (whole cents), round_half_up per piece"
    variants:
      - name: provisional
        when: "At piece logging (status LOGGED); flush need not be graded yet"
        difference: "Flat rate with NO grade weighting: kg_picked * rate_cents_per_kg"
      - name: final
        when: "At piece approval (LOGGED|DISPUTED -> APPROVED); flush must be GRADED"
        difference: "Grade-weighted factor from the parent flush's grade split; produces a different value whenever the flush split is not 100% grade B"

  - name: flush_yield_projection
    trigger: "RoomCycle placement (scheduled); each flush grading or reopen (actualized)"
    algorithm: forward_looking
    formula: |
      total_expected_kg = allocated_tonnage * 1000 * variety.target_bioefficiency_pct / 100
      scheduled_projection_kg = total_expected_kg
        (computed once at placement; ignores actual harvests)
      actualized_projection_kg =
          SUM(total_kg over flushes with status IN {GRADED, SETTLED})
        + SUM over remaining flush indices n in (flush_count+1 .. variety.max_flushes) of
            total_expected_kg * variety.flush_yield_distribution[n-1]
      Example: allocated 40.0 t, bioefficiency 25.0 -> total_expected 10000.0 kg, distribution
      [0.5, 0.3, 0.2]. After flush 1 graded at 100.0 kg: actualized = 100.0 + 3000.0 + 2000.0 = 5100.0,
      while scheduled stays 10000.0.
    input_set: "The RoomCycle, its Variety, and its FlushHarvests with status IN {GRADED, SETTLED}"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: scheduled
        when: "Computed at cycle placement; static thereafter"
        difference: "Pure forward-looking estimate from tonnage and bioefficiency; never observes actual flushes"
      - name: actualized
        when: "Recomputed on every flush grading and reopen"
        difference: "Chronological replayer: substitutes graded actuals for expected shares of completed flushes; diverges from scheduled as soon as actual flush kg differs from the distribution expectation"

  - name: commitment_settlement
    trigger: "daily sweep settles each ACTIVE CommitmentLine whose week_end < clock now"
    algorithm: tiered_pricing
    formula: |
      shortfall_kg = committed_kg - delivered_kg                        (may be 0 or negative -> clamp at 0)
      if delivered_kg >= committed_kg * (1 - SHORTFALL_TOLERANCE_PCT): # boundary INCLUSIVE: exactly 95% is FULFILLED
        settlement_outcome = FULFILLED; penalty_cents = 0
      else:
        settlement_outcome = SHORTFALL
        ratio = shortfall_kg / committed_kg
        rate = 120 if ratio <= 0.15
               200 if ratio <= 0.40
               350 otherwise                                          # nested tier selection, 3 inputs
        penalty_cents = round_half_up(shortfall_kg * rate)
      Worked: committed 500, delivered 400 -> shortfall 100, ratio 0.20 -> tier 200 -> penalty 20000.
      Worked: committed 500, delivered 475 -> 475 >= 475.0 -> FULFILLED, penalty 0, shortfall_kg 25.0 recorded.
    input_set: "CommitmentLines with status ACTIVE and week_end strictly before clock now"
    constants:
      SHORTFALL_TOLERANCE_PCT: 0.05
      TIER1_MAX_RATIO: 0.15
      TIER1_RATE_CENTS_PER_KG: 120
      TIER2_MAX_RATIO: 0.40
      TIER2_RATE_CENTS_PER_KG: 200
      TIER3_RATE_CENTS_PER_KG: 350
    precision: "kg at 2 decimals; penalty in whole cents, round_half_up"

  - name: fefo_allocation
    trigger: "POST /api/commitment-lines/{lineId}/allocate"
    algorithm: waterfall_allocation
    formula: |
      Guard: target_kg <= committed_kg - delivered_kg - allocated_kg  (ERR_ALLOCATION_EXCEEDS_OPEN_COMMITMENT)
      Eligibility filter (candidate pool):
        PackagedLot.status == IN_STOCK
        AND lot.variety_id == line.variety_id
        AND (line.min_grade == B  ->  lot.grade IN {A, B};  line.min_grade == A  ->  lot.grade == A)
        AND lot.expires_at > clock now
      Ranking: expires_at ASC; tie-break: created_at ASC (never id).
      Greedy whole-lot walk in ranked order: take lot while allocated_so_far + lot.lot_kg <= target_kg;
      STOP at the first lot that would exceed target_kg (no skipping).
      If allocated_so_far == 0 -> ERR_NO_ELIGIBLE_LOTS.
      Taken lots: status IN_STOCK -> ALLOCATED, allocated_line_id = line.id, line.allocated_kg += lot_kg.
    input_set: "All PackagedLots of the line's variety (farm-wide pool), filtered as above"
    precision: "2 decimal places on lot_kg"

  - name: shelf_life_expiry
    trigger: "packaging (compute expires_at); daily sweep (expire); ship (guard)"
    algorithm: threshold
    formula: |
      At packaging: expires_at = packed_at + variety.shelf_life_days (whole days, exact instant).
      Sweep: lots with status IN {IN_STOCK, ALLOCATED} AND expires_at <= clock now -> EXPIRED
        (boundary INCLUSIVE: a lot whose expires_at equals the sweep instant expires).
      Ship guard: requires expires_at > clock now (strictly greater; equality rejects with ERR_LOT_EXPIRED).
    input_set: "PackagedLots with status IN {IN_STOCK, ALLOCATED}"
    precision: "instant comparison at second precision"

  - name: spent_substrate_accounting
    trigger: "RoomCycle end-cropping or abort (create lot); sell/dispose (roll up to batch)"
    algorithm: aggregation
    formula: |
      At lot creation: tonnage = round(allocated_tonnage * SPENT_YIELD_FACTOR, 2)
        (40.0 t allocated -> 30.00 t spent; the 25% mass loss is moisture/ammonia off-gassing).
      disposal_only = true iff the producing transition was the quarantine-cascade abort.
      Disposal: disposal_cost_cents = round(tonnage * TIPPING_FEE_CENTS_PER_TONNE).
      Sale floor: sale_price_cents >= round(tonnage * FLOOR_PRICE_CENTS_PER_TONNE) else ERR_PRICE_BELOW_FLOOR.
      Batch rollups: spent_revenue_cents = SUM(sale_price_cents over SOLD lots);
                     disposal_cost_cents  = SUM(disposal_cost_cents over DISPOSED lots).
    input_set: "SpentSubstrateLots of the batch"
    constants:
      SPENT_YIELD_FACTOR: 0.75
      TIPPING_FEE_CENTS_PER_TONNE: 2500
      FLOOR_PRICE_CENTS_PER_TONNE: 1500
    precision: "tonnage 2 decimals; money whole cents, round_half_up"

  - name: room_health_posture
    trigger: "contamination event confirm, clear, dismiss"
    algorithm: constraint_propagation
    formula: |
      open_events = ContaminationEvents of the room with status IN {REPORTED, CONFIRMED, REMEDIATING}
      severe_open = subset with status IN {CONFIRMED, REMEDIATING} AND severity >= 4
      health_status = QUARANTINED if |severe_open| > 0
                      WATCH       else if |open_events| > 0 AND any open event has status IN {CONFIRMED, REMEDIATING}
                                    (a merely REPORTED event does not move the posture)
                      CLEAR       otherwise
      Recomputed after every confirm / dismiss / clear on any event of the room.
    input_set: "ContaminationEvents of the room with status IN {REPORTED, CONFIRMED, REMEDIATING}"
    constants:
      QUARANTINE_SEVERITY: 4

  - name: payroll_accrual
    trigger: "piece approve, piece dispute, worker payout"
    algorithm: aggregation
    formula: |
      worker.accrued_unpaid_cents = SUM(final_pay_cents over pieces with status == APPROVED)
      Payout (POST /api/workers/{workerId}/payout): every APPROVED piece -> PAID;
        paid total = SUM of the rounded per-piece final_pay_cents (per-piece rounding already applied);
        accrued_unpaid_cents -> 0; lifetime_paid_cents += paid total.
      Approve-then-dispute is a compensating pair: accrued_unpaid_cents returns to its prior value exactly.
    input_set: "HarvestPieces of the worker"
    precision: "whole cents"

  - name: flush_grade_shares
    trigger: "referenced by piece_pay at approval"
    algorithm: aggregation
    formula: |
      a_share = grade_a_kg / total_kg; b_share = grade_b_kg / total_kg; c_share = cull_kg / total_kg.
      Grade validation at grading time: grade_a_kg + grade_b_kg + cull_kg == total_kg (2-decimal exact),
      else ERR_GRADE_SPLIT_MISMATCH. Packaging draws down per-grade remaining:
      remaining_grade_kg(g) = grade_g_kg - SUM(lot_kg over ALL PackagedLots of this flush with grade == g)
      (every created lot counts regardless of later status; packing consumes physical product).
    input_set: "The FlushHarvest and all its PackagedLots"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "For entity_backed roles (HarvestCrewLead -> Worker, BuyerPortal -> Buyer), X-User-ID must reference an existing entity of the backing type"
    error_id: ERR_IDENTITY_NOT_RESOLVED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Role must be permitted for the operation per §1.5 roles; additionally a BuyerPortal caller may only create commitments whose buyer_id equals its X-User-ID"
    error_id: "ERR_FORBIDDEN (role mismatch) | ERR_BUYER_MISMATCH (ownership mismatch)"
    http_status: 403
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_VARIETY_NOT_FOUND, ERR_BUYER_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_TUNNEL_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_ROOM_CYCLE_NOT_FOUND, ERR_FLUSH_NOT_FOUND, ERR_PIECE_NOT_FOUND, ERR_WORKER_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_SPENT_LOT_NOT_FOUND)"
    http_status: 404
    applies_to: "all parameterized endpoints"

  - priority: 5
    category: existence
    check: "Body foreign-key references must exist (batch_id, tunnel_id, room_id, variety_id, worker_id, buyer_id)"
    error_id: "same ERR_{RESOURCE}_NOT_FOUND family"
    http_status: 404
    applies_to: "creation endpoints with body references"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version (checked before state preconditions so a stale writer gets a deterministic 412 regardless of subsequent state)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/room-cycles, POST /api/buyer-commitments/{commitmentId}/activate"

  - priority: 7
    category: state
    check: "Target resource must be in the required state for the operation (per §1.2 preconditions)"
    error_id: "ERR_BATCH_NOT_MIXED, ERR_BATCH_NOT_CONDITIONED, ERR_BATCH_NOT_SPAWNED, ERR_BATCH_NOT_EXHAUSTED, ERR_CYCLE_INVALID_STATE, ERR_TUNNEL_NOT_AVAILABLE, ERR_ROOM_NOT_IDLE, ERR_ROOM_CYCLE_INVALID_PHASE, ERR_FLUSH_NOT_RECORDED, ERR_FLUSH_NOT_GRADED, ERR_FLUSH_HAS_COMMITTED_PIECES, ERR_PIECE_INVALID_STATE, ERR_COMMITMENT_NOT_DRAFT, ERR_COMMITMENT_NOT_ACTIVE, ERR_COMMITMENT_EMPTY, ERR_LINE_NOT_ACTIVE, ERR_EVENT_INVALID_STATE, ERR_LOT_NOT_ALLOCATED, ERR_SPENT_LOT_INVALID_STATE, ERR_UNRESOLVED_SPENT_LOTS, ERR_COMMITMENT_HAS_DELIVERIES, ERR_COMMITMENT_HAS_ALLOCATIONS"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 8
    category: business_safety
    check: "Quarantine gating: room health_status QUARANTINED blocks RoomCycle placement and packaging of that room's flushes; disposal_only spent lots may only be disposed"
    error_id: "ERR_ROOM_QUARANTINED | ERR_SPENT_LOT_DISPOSAL_ONLY"
    http_status: 409
    applies_to: "POST /api/room-cycles/{id}/place, POST /api/flushes/{id}/packaged-lots, POST /api/spent-substrate-lots/{id}/reserve, POST /api/spent-substrate-lots/{id}/sell"

  - priority: 9
    category: business_temporal
    check: "Window and clock rules: tunnel half-open overlap; room overlap with 2-day turnover buffer; placement/start inside planned window; colonization/casing minimum durations; clock monotonicity"
    error_id: "ERR_TUNNEL_WINDOW_OVERLAP | ERR_ROOM_WINDOW_OVERLAP | ERR_CYCLE_WINDOW_NOT_OPEN | ERR_COLONIZATION_INCOMPLETE | ERR_CLOCK_REGRESSION | ERR_LOT_EXPIRED"
    http_status: 409
    applies_to: "POST /api/pasteurization-cycles, POST /api/room-cycles, POST /api/room-cycles/{id}/place, POST /api/room-cycles/{id}/advance, POST /api/pasteurization-cycles/{id}/start, POST /api/_clock/set_current_utc, POST /api/packaged-lots/{id}/ship"

  - priority: 10
    category: business_constraint
    check: "Capacities, recipe match, substrate sufficiency, pasteurization hours, grade split sum, flush limit, per-grade packaging sufficiency, allocation guard, buyer/worker active, segregation of duties"
    error_id: "ERR_TUNNEL_CAPACITY_EXCEEDED, ERR_ROOM_CAPACITY_EXCEEDED, ERR_RECIPE_MISMATCH, ERR_INSUFFICIENT_SUBSTRATE, ERR_PASTEURIZATION_INCOMPLETE, ERR_GRADE_SPLIT_MISMATCH, ERR_FLUSH_LIMIT_REACHED, ERR_INSUFFICIENT_GRADE_KG, ERR_NO_ELIGIBLE_LOTS, ERR_ALLOCATION_EXCEEDS_OPEN_COMMITMENT, ERR_BUYER_NOT_ACTIVE, ERR_WORKER_NOT_ACTIVE, ERR_SEGREGATION_OF_DUTIES"
    http_status: "422 (403 for ERR_SEGREGATION_OF_DUTIES; 409 for ERR_BUYER_NOT_ACTIVE, ERR_WORKER_NOT_ACTIVE, ERR_FLUSH_LIMIT_REACHED)"
    applies_to: "creation and action endpoints as listed per error in §1.6"

  - priority: 11
    category: business_fiscal
    check: "Spent substrate sale price must meet the floor (tonnage * 1500 cents)"
    error_id: ERR_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /api/spent-substrate-lots/{lotId}/sell"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (77 endpoints)
# =============================================================================
endpoints:
  # --- Logical clock / ops-run checkpoint ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. The new value must be >= the current logical time (ERR_CLOCK_REGRESSION).", roles: [FarmManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["All time-gated rules (windows, colonization, shelf-life, settlement) evaluate against this clock"] }
  - { method: POST, path: "/api/operations/run-daily-sweep", description: "Ops-run checkpoint: expire PackagedLots with expires_at <= now (ALLOCATED lots free their line allocation), settle ACTIVE CommitmentLines whose week_end < now (outcome/shortfall/penalty per commitment_settlement), close commitments whose lines are all terminal", roles: [FarmManager], code: 200, input: [], output: "{ expired_lot_count: integer, settled_line_count: integer, closed_commitment_count: integer }", side_effects: ["PackagedLot -> EXPIRED", "CommitmentLine -> SETTLED", "BuyerCommitment -> CLOSED (bubble up)", "Buyer.lifetime_shortfall_penalty_cents updated"] }

  # --- Variety ---
  - { method: POST, path: "/api/varieties", description: "Register a mushroom variety", roles: [CompostSupervisor], code: 201, input: [variety_code, display_name, substrate_recipe, target_bioefficiency_pct, shelf_life_days, spawn_run_days, casing_days, max_flushes, flush_yield_distribution], output: Variety, side_effects: ["active_committed_kg and planned_production_kg initialized to 0.0", "flush_yield_distribution length must equal max_flushes (ERR_INVALID_REQUEST)"] }
  - { method: GET, path: "/api/varieties/{varietyId}", description: "Get a variety (includes computed supply/demand fields)", roles: [Any], code: 200, input: [], output: Variety, side_effects: [] }

  # --- Buyer ---
  - { method: POST, path: "/api/buyers", description: "Register a buyer", roles: [SalesManager], code: 201, input: [name], output: Buyer, side_effects: ["status initialized ACTIVE"] }
  - { method: GET, path: "/api/buyers/{buyerId}", description: "Get a buyer", roles: [Any], code: 200, input: [], output: Buyer, side_effects: [] }
  - { method: PATCH, path: "/api/buyers/{buyerId}", description: "Suspend or reactivate a buyer (status ACTIVE|SUSPENDED; no-op value -> ERR_INVALID_REQUEST)", roles: [SalesManager], code: 200, input: [status], output: Buyer, side_effects: ["Buyer state machine transition"] }

  # --- BuyerCommitment ---
  - { method: POST, path: "/api/buyer-commitments", description: "Create a commitment in DRAFT. BuyerPortal callers must pass buyer_id equal to their X-User-ID (ERR_BUYER_MISMATCH); buyer must be ACTIVE (ERR_BUYER_NOT_ACTIVE)", roles: [SalesManager, BuyerPortal], code: 201, input: [buyer_id, reference], output: BuyerCommitment, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/api/buyer-commitments", description: "List commitments, optionally filtered", roles: [Any], code: 200, input: ["buyer_id?", "status?", "limit?", "offset?"], output: "BuyerCommitment[]", side_effects: [] }
  - { method: GET, path: "/api/buyer-commitments/{commitmentId}", description: "Get a commitment", roles: [Any], code: 200, input: [], output: BuyerCommitment, side_effects: [] }
  - { method: POST, path: "/api/buyer-commitments/{commitmentId}/activate", description: "Activate a DRAFT commitment (OCC-guarded). Requires >= 1 line (ERR_COMMITMENT_EMPTY)", roles: [SalesManager], code: 200, input: [expected_commitment_version], output: BuyerCommitment, side_effects: ["Commitment DRAFT -> ACTIVE", "All child lines DRAFT -> ACTIVE", "increments BuyerCommitment.version by 1", "Variety.active_committed_kg recomputed"] }
  - { method: POST, path: "/api/buyer-commitments/{commitmentId}/cancel", description: "Cancel an ACTIVE commitment with no deliveries and no allocated lots", roles: [SalesManager], code: 200, input: [], output: BuyerCommitment, side_effects: ["Commitment ACTIVE -> CANCELLED", "All child lines -> CANCELLED"] }
  - { method: POST, path: "/api/buyer-commitments/{commitmentId}/lines", description: "Add a line to a DRAFT commitment (ERR_COMMITMENT_NOT_DRAFT otherwise)", roles: [SalesManager], code: 201, input: [variety_id, committed_kg, week_start, week_end, "min_grade?"], output: CommitmentLine, side_effects: ["BuyerCommitment.total_committed_kg recomputed", "Does NOT increment BuyerCommitment.version"] }

  # --- CommitmentLine ---
  - { method: GET, path: "/api/commitment-lines", description: "List commitment lines, optionally filtered (reverse reachability for commitment_id and variety_id FKs)", roles: [Any], code: 200, input: ["commitment_id?", "variety_id?", "status?", "limit?", "offset?"], output: "CommitmentLine[]", side_effects: [] }
  - { method: GET, path: "/api/commitment-lines/{lineId}", description: "Get a commitment line", roles: [Any], code: 200, input: [], output: CommitmentLine, side_effects: [] }
  - { method: POST, path: "/api/commitment-lines/{lineId}/allocate", description: "FEFO-allocate IN_STOCK packaged lots to an ACTIVE line (selector: expires_at ASC, created_at ASC; whole-lot, stop-at-first-overshoot)", roles: [SalesManager], code: 200, input: [target_kg], output: "{ allocated_lot_ids: array, allocated_kg: number }", side_effects: ["Selected PackagedLots IN_STOCK -> ALLOCATED with allocated_line_id set", "CommitmentLine.allocated_kg recomputed"] }

  # --- SubstrateBatch ---
  - { method: POST, path: "/api/substrate-batches", description: "Create a substrate batch in MIXED", roles: [CompostSupervisor], code: 201, input: [recipe, tonnage], output: SubstrateBatch, side_effects: ["remaining_tonnage initialized to tonnage"] }
  - { method: GET, path: "/api/substrate-batches", description: "List substrate batches (reverse reachability for variety_id FK)", roles: [Any], code: 200, input: ["variety_id?", "status?", "limit?", "offset?"], output: "SubstrateBatch[]", side_effects: [] }
  - { method: GET, path: "/api/substrate-batches/{batchId}", description: "Get a substrate batch", roles: [Any], code: 200, input: [], output: SubstrateBatch, side_effects: [] }
  - { method: POST, path: "/api/substrate-batches/{batchId}/spawn", description: "Spawn a CONDITIONED batch with a variety (recipe must match; ERR_RECIPE_MISMATCH)", roles: [CompostSupervisor], code: 200, input: [variety_id, spawn_kg], output: SubstrateBatch, side_effects: ["Batch CONDITIONED -> SPAWNED", "Sets variety_id, spawn_kg"] }
  - { method: POST, path: "/api/substrate-batches/{batchId}/retire", description: "Retire an EXHAUSTED batch once all its cycles are terminal and all its spent lots are SOLD|DISPOSED (ERR_UNRESOLVED_SPENT_LOTS)", roles: [CompostSupervisor], code: 200, input: [], output: SubstrateBatch, side_effects: ["Batch EXHAUSTED -> RETIRED"] }

  # --- PasteurizationTunnel ---
  - { method: POST, path: "/api/pasteurization-tunnels", description: "Register a pasteurization tunnel", roles: [CompostSupervisor], code: 201, input: [tunnel_code, capacity_tonnes], output: PasteurizationTunnel, side_effects: ["status AVAILABLE"] }
  - { method: GET, path: "/api/pasteurization-tunnels/{tunnelId}", description: "Get a tunnel", roles: [Any], code: 200, input: [], output: PasteurizationTunnel, side_effects: [] }
  - { method: POST, path: "/api/pasteurization-tunnels/{tunnelId}/sanitize", description: "Return an OUT_OF_SERVICE tunnel to AVAILABLE", roles: [CompostSupervisor], code: 200, input: [], output: PasteurizationTunnel, side_effects: ["Tunnel OUT_OF_SERVICE -> AVAILABLE"] }

  # --- PasteurizationCycle ---
  - { method: POST, path: "/api/pasteurization-cycles", description: "Schedule a pasteurization cycle. Batch must be MIXED (ERR_BATCH_NOT_MIXED) and becomes PASTEURIZING. Tunnel overlap uses half-open [planned_start, planned_end) semantics: adjacency (new start == existing end) is allowed; only cycles IN {SCHEDULED, RUNNING} block. batch.tonnage must be <= tunnel.capacity_tonnes (ERR_TUNNEL_CAPACITY_EXCEEDED)", roles: [CompostSupervisor], code: 201, input: [batch_id, tunnel_id, planned_start, planned_end], output: PasteurizationCycle, side_effects: ["SubstrateBatch MIXED -> PASTEURIZING"] }
  - { method: GET, path: "/api/pasteurization-cycles", description: "List pasteurization cycles (reverse reachability for batch_id and tunnel_id FKs)", roles: [Any], code: 200, input: ["batch_id?", "tunnel_id?", "status?", "limit?", "offset?"], output: "PasteurizationCycle[]", side_effects: [] }
  - { method: GET, path: "/api/pasteurization-cycles/{cycleId}", description: "Get a pasteurization cycle", roles: [Any], code: 200, input: [], output: PasteurizationCycle, side_effects: [] }
  - { method: POST, path: "/api/pasteurization-cycles/{cycleId}/start", description: "Start a SCHEDULED cycle; clock must be within [planned_start, planned_end] (ERR_CYCLE_WINDOW_NOT_OPEN); tunnel must be AVAILABLE", roles: [CompostSupervisor], code: 200, input: [], output: PasteurizationCycle, side_effects: ["Cycle SCHEDULED -> RUNNING", "Sets actual_start"] }
  - { method: POST, path: "/api/pasteurization-cycles/{cycleId}/complete", description: "Complete a RUNNING cycle; hours_at_target_temp >= 6.0 required (ERR_PASTEURIZATION_INCOMPLETE)", roles: [CompostSupervisor], code: 200, input: [hours_at_target_temp], output: PasteurizationCycle, side_effects: ["Cycle RUNNING -> COMPLETED", "SubstrateBatch PASTEURIZING -> CONDITIONED"] }
  - { method: POST, path: "/api/pasteurization-cycles/{cycleId}/fail", description: "Fail a RUNNING cycle (contamination or temperature excursion)", roles: [CompostSupervisor], code: 200, input: [], output: PasteurizationCycle, side_effects: ["Cycle RUNNING -> FAILED", "SubstrateBatch PASTEURIZING -> MIXED", "PasteurizationTunnel AVAILABLE -> OUT_OF_SERVICE"] }
  - { method: POST, path: "/api/pasteurization-cycles/{cycleId}/abort", description: "Abort a SCHEDULED cycle before it starts", roles: [CompostSupervisor], code: 200, input: [], output: PasteurizationCycle, side_effects: ["Cycle SCHEDULED -> ABORTED", "SubstrateBatch PASTEURIZING -> MIXED"] }

  # --- GrowingRoom ---
  - { method: POST, path: "/api/rooms", description: "Register a growing room", roles: [FarmManager], code: 201, input: [room_code, capacity_tonnes], output: GrowingRoom, side_effects: ["occupancy_status IDLE, health_status CLEAR"] }
  - { method: GET, path: "/api/rooms", description: "List growing rooms", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "GrowingRoom[]", side_effects: [] }
  - { method: GET, path: "/api/rooms/{roomId}", description: "Get a growing room", roles: [Any], code: 200, input: [], output: GrowingRoom, side_effects: [] }

  # --- RoomCycle ---
  - { method: POST, path: "/api/room-cycles", description: "Book a room cycle (OCC-guarded on expected_room_version). Batch must be SPAWNED (ERR_BATCH_NOT_SPAWNED); allocated_tonnage <= room.capacity_tonnes (ERR_ROOM_CAPACITY_EXCEEDED) and <= batch.remaining_tonnage (ERR_INSUFFICIENT_SUBSTRATE). Room window rule: blocking interval of each existing cycle IN {SCHEDULED, SPAWN_RUN, CASING, FRUITING, TURNAROUND} is [planned_start, planned_end + 2 days); a new cycle whose [planned_start, planned_end) intersects any blocking interval is rejected (ERR_ROOM_WINDOW_OVERLAP); a start exactly at planned_end + 2 days is allowed", roles: [FarmManager], code: 201, input: [room_id, batch_id, allocated_tonnage, planned_start, planned_end, expected_room_version], output: RoomCycle, side_effects: ["SubstrateBatch.remaining_tonnage debited by allocated_tonnage; auto EXHAUSTED at exactly 0", "variety_id copied from batch", "increments GrowingRoom.version by 1", "Variety.planned_production_kg recomputed"] }
  - { method: GET, path: "/api/room-cycles", description: "List room cycles (reverse reachability for room_id, batch_id, variety_id FKs)", roles: [Any], code: 200, input: ["room_id?", "batch_id?", "variety_id?", "status?", "limit?", "offset?"], output: "RoomCycle[]", side_effects: [] }
  - { method: GET, path: "/api/room-cycles/{roomCycleId}", description: "Get a room cycle (includes both yield projections)", roles: [Any], code: 200, input: [], output: RoomCycle, side_effects: [] }
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/place", description: "Place a SCHEDULED cycle into its room at window open; room must be IDLE and not QUARANTINED", roles: [FarmManager], code: 200, input: [], output: RoomCycle, side_effects: ["Cycle SCHEDULED -> SPAWN_RUN", "Room occupancy IDLE -> OCCUPIED", "Projections computed"] }
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/advance", description: "Advance SPAWN_RUN -> CASING -> FRUITING; each step enforces the variety's minimum day counts against the logical clock (ERR_COLONIZATION_INCOMPLETE)", roles: [FarmManager], code: 200, input: [], output: RoomCycle, side_effects: ["Phase advance", "phase_entered_at refreshed"] }
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/end-cropping", description: "End cropping on a FRUITING cycle (manual turnover; flushes may be zero)", roles: [FarmManager], code: 200, input: [], output: RoomCycle, side_effects: ["Cycle FRUITING -> TURNAROUND", "Creates SpentSubstrateLot (disposal_only=false)", "Room occupancy OCCUPIED -> TURNAROUND"] }
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/certify-cleanout", description: "Certify cleanout of a TURNAROUND cycle; frees the room regardless of health posture", roles: [FarmManager], code: 200, input: [], output: RoomCycle, side_effects: ["Cycle TURNAROUND -> CLOSED", "Room occupancy TURNAROUND -> IDLE"] }
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/cancel", description: "Cancel a SCHEDULED cycle; releases the batch tonnage reservation (compensating action)", roles: [FarmManager], code: 200, input: [], output: RoomCycle, side_effects: ["Cycle SCHEDULED -> CANCELLED", "SubstrateBatch.remaining_tonnage credited back"] }
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/abort", description: "Abort a placed cycle (SPAWN_RUN|CASING|FRUITING); consumes tonnage and produces a resellable spent lot", roles: [FarmManager], code: 200, input: [], output: RoomCycle, side_effects: ["Cycle -> ABORTED", "Creates SpentSubstrateLot (disposal_only=false)", "Room occupancy OCCUPIED -> TURNAROUND", "supply_at_risk recomputed"] }

  # --- FlushHarvest ---
  - { method: POST, path: "/api/room-cycles/{roomCycleId}/flushes", description: "Record a flush harvest on a FRUITING cycle. Room must not be QUARANTINED (ERR_ROOM_QUARANTINED). flush_number is auto-assigned (count of existing flushes + 1); creating beyond variety.max_flushes is rejected (ERR_FLUSH_LIMIT_REACHED)", roles: [FarmManager], code: 201, input: [total_kg], output: FlushHarvest, side_effects: ["Flush created RECORDED with next flush_number"] }
  - { method: GET, path: "/api/room-cycles/{roomCycleId}/flushes", description: "List flushes of a cycle (sub-resource convenience)", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "FlushHarvest[]", side_effects: [] }
  - { method: GET, path: "/api/flushes", description: "List flush harvests, optionally filtered (reverse reachability for FlushHarvest.room_cycle_id)", roles: [Any], code: 200, input: ["room_cycle_id?", "status?", "limit?", "offset?"], output: "FlushHarvest[]", side_effects: [] }
  - { method: GET, path: "/api/flushes/{flushId}", description: "Get a flush harvest", roles: [Any], code: 200, input: [], output: FlushHarvest, side_effects: [] }
  - { method: POST, path: "/api/flushes/{flushId}/grade", description: "Grade a RECORDED flush; split must sum to total_kg (ERR_GRADE_SPLIT_MISMATCH). Grading the max-flushes-th flush auto-ends cropping", roles: [GradingInspector], code: 200, input: [grade_a_kg, grade_b_kg, cull_kg], output: FlushHarvest, side_effects: ["Flush RECORDED -> GRADED", "RoomCycle flush_count/harvested_kg updated", "actualized_projection_kg recomputed", "Possible auto end-cropping cascade at max_flushes"] }
  - { method: POST, path: "/api/flushes/{flushId}/reopen", description: "Reopen a GRADED flush for correction (no packaged lots; all pieces still LOGGED; cycle still FRUITING)", roles: [GradingInspector], code: 200, input: [], output: FlushHarvest, side_effects: ["Flush GRADED -> RECORDED", "Grade fields cleared", "RoomCycle flush_count/harvested_kg reversed"] }

  # --- PackagedLot ---
  - { method: POST, path: "/api/flushes/{flushId}/packaged-lots", description: "Pack a GRADED flush into sellable lots. Room of the flush's cycle must not be QUARANTINED (ERR_ROOM_QUARANTINED). grade IN {A, B}; units * kg_per_unit must be <= remaining per-grade kg (ERR_INSUFFICIENT_GRADE_KG)", roles: [FarmManager], code: 201, input: [grade, units, kg_per_unit], output: PackagedLot, side_effects: ["Lot created IN_STOCK with packed_at = clock now and expires_at = packed_at + variety.shelf_life_days"] }
  - { method: GET, path: "/api/packaged-lots", description: "List packaged lots (reverse reachability for flush_id, variety_id, allocated_line_id FKs)", roles: [Any], code: 200, input: ["flush_id?", "variety_id?", "allocated_line_id?", "status?", "limit?", "offset?"], output: "PackagedLot[]", side_effects: [] }
  - { method: GET, path: "/api/packaged-lots/{lotId}", description: "Get a packaged lot", roles: [Any], code: 200, input: [], output: PackagedLot, side_effects: [] }
  - { method: POST, path: "/api/packaged-lots/{lotId}/deallocate", description: "Return an ALLOCATED lot to IN_STOCK; its line's allocated_kg is credited back", roles: [SalesManager], code: 200, input: [], output: PackagedLot, side_effects: ["Lot ALLOCATED -> IN_STOCK", "CommitmentLine.allocated_kg -= lot_kg"] }
  - { method: POST, path: "/api/packaged-lots/{lotId}/ship", description: "Ship an ALLOCATED lot against its commitment line; requires expires_at > clock now (ERR_LOT_EXPIRED)", roles: [SalesManager], code: 200, input: [], output: PackagedLot, side_effects: ["Lot ALLOCATED -> SHIPPED", "CommitmentLine.allocated_kg -= lot_kg, delivered_kg += lot_kg", "BuyerCommitment.total_delivered_kg recomputed"] }

  # --- HarvestPiece ---
  - { method: POST, path: "/api/flushes/{flushId}/pieces", description: "Log a piece-rate picking entry on a RECORDED flush (ERR_FLUSH_NOT_RECORDED otherwise). Worker must be ACTIVE (ERR_WORKER_NOT_ACTIVE). Caller (HarvestCrewLead) identity is stored as logged_by_user_id", roles: [HarvestCrewLead], code: 201, input: [worker_id, kg_picked], output: HarvestPiece, side_effects: ["Piece created LOGGED", "rate snapshot copied from worker", "provisional_pay_cents computed (flat rate)"] }
  - { method: GET, path: "/api/flushes/{flushId}/pieces", description: "List pieces of a flush (reverse reachability for HarvestPiece.flush_id)", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "HarvestPiece[]", side_effects: [] }
  - { method: GET, path: "/api/pieces", description: "List pieces (reverse reachability for HarvestPiece.worker_id and HarvestPiece.flush_id)", roles: [Any], code: 200, input: ["worker_id?", "flush_id?", "status?", "limit?", "offset?"], output: "HarvestPiece[]", side_effects: [] }
  - { method: GET, path: "/api/pieces/{pieceId}", description: "Get a piece", roles: [Any], code: 200, input: [], output: HarvestPiece, side_effects: [] }
  - { method: POST, path: "/api/pieces/{pieceId}/approve", description: "Approve a LOGGED or DISPUTED piece; flush must be GRADED (ERR_FLUSH_NOT_GRADED); caller must differ from logged_by_user_id (ERR_SEGREGATION_OF_DUTIES)", roles: [PayrollClerk], code: 200, input: [], output: HarvestPiece, side_effects: ["Piece -> APPROVED", "final_pay_cents computed (grade-weighted, per-piece rounding)", "Worker.accrued_unpaid_cents += final_pay_cents"] }
  - { method: POST, path: "/api/pieces/{pieceId}/dispute", description: "Dispute an APPROVED piece (compensating reversal of the accrual)", roles: [PayrollClerk], code: 200, input: [], output: HarvestPiece, side_effects: ["Piece APPROVED -> DISPUTED", "Worker.accrued_unpaid_cents -= final_pay_cents"] }

  # --- Worker ---
  - { method: POST, path: "/api/workers", description: "Register a harvest worker", roles: [FarmManager], code: 201, input: [full_name, crew_code, piece_rate_cents_per_kg], output: Worker, side_effects: ["status ACTIVE, accruals 0"] }
  - { method: GET, path: "/api/workers/{workerId}", description: "Get a worker", roles: [Any], code: 200, input: [], output: Worker, side_effects: [] }
  - { method: PATCH, path: "/api/workers/{workerId}", description: "Suspend or reactivate a worker (status ACTIVE|SUSPENDED; no-op value -> ERR_INVALID_REQUEST)", roles: [FarmManager], code: 200, input: [status], output: Worker, side_effects: ["Worker state machine transition"] }
  - { method: POST, path: "/api/workers/{workerId}/payout", description: "Pay out all APPROVED pieces of a worker (they become PAID); may settle the parent flush when all its pieces are PAID", roles: [PayrollClerk], code: 200, input: [], output: "{ paid_piece_count: integer, total_paid_cents: integer }", side_effects: ["Pieces APPROVED -> PAID", "accrued_unpaid_cents -> 0, lifetime_paid_cents += total", "FlushHarvest GRADED -> SETTLED when applicable"] }

  # --- ContaminationEvent ---
  - { method: POST, path: "/api/contamination-events", description: "Report a contamination event on a room (optionally pinning a cycle of that room; ERR_ROOM_CYCLE_NOT_FOUND if the cycle does not belong to the room)", roles: [QualityInspector], code: 201, input: [room_id, "room_cycle_id?", pathogen, severity, affected_zone_pct], output: ContaminationEvent, side_effects: ["Event created REPORTED (posture not yet affected)"] }
  - { method: GET, path: "/api/contamination-events", description: "List contamination events (reverse reachability for room_id and room_cycle_id FKs)", roles: [Any], code: 200, input: ["room_id?", "room_cycle_id?", "status?", "limit?", "offset?"], output: "ContaminationEvent[]", side_effects: [] }
  - { method: GET, path: "/api/contamination-events/{eventId}", description: "Get a contamination event", roles: [Any], code: 200, input: [], output: ContaminationEvent, side_effects: [] }
  - { method: POST, path: "/api/contamination-events/{eventId}/confirm", description: "Confirm a REPORTED event. severity >= 4 triggers the quarantine cascade (room -> QUARANTINED -> active cycle ABORTED -> disposal-only spent lot + supply_at_risk recompute); severity <= 3 moves room to WATCH", roles: [QualityInspector], code: 200, input: [], output: ContaminationEvent, side_effects: ["Event REPORTED -> CONFIRMED", "Room health cascade per room_health_posture", "Possible cycle abort cascade at severity >= 4"] }
  - { method: POST, path: "/api/contamination-events/{eventId}/dismiss", description: "Dismiss a REPORTED event as a false alarm (no posture change)", roles: [QualityInspector], code: 200, input: [], output: ContaminationEvent, side_effects: ["Event REPORTED -> DISMISSED"] }
  - { method: POST, path: "/api/contamination-events/{eventId}/remediate", description: "Begin remediation on a CONFIRMED event", roles: [QualityInspector], code: 200, input: [], output: ContaminationEvent, side_effects: ["Event CONFIRMED -> REMEDIATING"] }
  - { method: POST, path: "/api/contamination-events/{eventId}/clear", description: "Clear a REMEDIATING event; room health posture is recomputed from remaining open events", roles: [QualityInspector], code: 200, input: [], output: ContaminationEvent, side_effects: ["Event REMEDIATING -> CLEARED", "Room health_status recomputed"] }

  # --- SpentSubstrateLot ---
  - { method: GET, path: "/api/spent-substrate-lots", description: "List spent substrate lots (reverse reachability for room_cycle_id, batch_id, reserved_buyer_id FKs)", roles: [Any], code: 200, input: ["room_cycle_id?", "batch_id?", "reserved_buyer_id?", "status?", "limit?", "offset?"], output: "SpentSubstrateLot[]", side_effects: [] }
  - { method: GET, path: "/api/spent-substrate-lots/{lotId}", description: "Get a spent substrate lot", roles: [Any], code: 200, input: [], output: SpentSubstrateLot, side_effects: [] }
  - { method: POST, path: "/api/spent-substrate-lots/{lotId}/reserve", description: "Reserve an AVAILABLE lot for an ACTIVE buyer; disposal_only lots rejected (ERR_SPENT_LOT_DISPOSAL_ONLY)", roles: [SalesManager], code: 200, input: [buyer_id], output: SpentSubstrateLot, side_effects: ["Lot AVAILABLE -> RESERVED", "Sets reserved_buyer_id"] }
  - { method: POST, path: "/api/spent-substrate-lots/{lotId}/release", description: "Release a reservation back to AVAILABLE", roles: [SalesManager], code: 200, input: [], output: SpentSubstrateLot, side_effects: ["Lot RESERVED -> AVAILABLE", "reserved_buyer_id cleared"] }
  - { method: POST, path: "/api/spent-substrate-lots/{lotId}/sell", description: "Sell a RESERVED lot; price must be >= round(tonnage * 1500) (ERR_PRICE_BELOW_FLOOR)", roles: [SalesManager], code: 200, input: [sale_price_cents], output: SpentSubstrateLot, side_effects: ["Lot RESERVED -> SOLD", "SubstrateBatch.spent_revenue_cents += sale_price_cents"] }
  - { method: POST, path: "/api/spent-substrate-lots/{lotId}/dispose", description: "Dispose an AVAILABLE or RESERVED lot at the tipping-fee rate (the only terminal path for disposal_only lots)", roles: [FarmManager], code: 200, input: [], output: SpentSubstrateLot, side_effects: ["Lot -> DISPOSED", "disposal_cost_cents = round(tonnage * 2500)", "SubstrateBatch.disposal_cost_cents += disposal_cost_cents"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_IDENTITY_NOT_RESOLVED, http: 403, condition: "Entity-backed role's X-User-ID does not reference an existing entity of the backing type (HarvestCrewLead -> Worker, BuyerPortal -> Buyer)" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per §1.5" }
  - { id: ERR_BUYER_MISMATCH, http: 403, condition: "BuyerPortal caller's X-User-ID does not equal the buyer_id of the commitment being created" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Piece approve/dispute caller's X-User-ID equals the piece's logged_by_user_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum value outside constraints, non-positive quantity, week_end <= week_start, planned_end <= planned_start, no-op PATCH status, flush_yield_distribution length != max_flushes" }

  # --- Existence (404 family) ---
  - { id: ERR_VARIETY_NOT_FOUND, http: 404, condition: "Variety id does not exist" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer id does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "BuyerCommitment id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "CommitmentLine id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "SubstrateBatch id does not exist" }
  - { id: ERR_TUNNEL_NOT_FOUND, http: 404, condition: "PasteurizationTunnel id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "PasteurizationCycle id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "GrowingRoom id does not exist" }
  - { id: ERR_ROOM_CYCLE_NOT_FOUND, http: 404, condition: "RoomCycle id does not exist (or, on contamination create, does not belong to the given room)" }
  - { id: ERR_FLUSH_NOT_FOUND, http: 404, condition: "FlushHarvest id does not exist" }
  - { id: ERR_PIECE_NOT_FOUND, http: 404, condition: "HarvestPiece id does not exist" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "Worker id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "ContaminationEvent id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "PackagedLot id does not exist" }
  - { id: ERR_SPENT_LOT_NOT_FOUND, http: 404, condition: "SpentSubstrateLot id does not exist" }

  # --- State preconditions (409) ---
  - { id: ERR_BATCH_NOT_MIXED, http: 409, condition: "Pasteurization cycle creation requires the batch to be MIXED" }
  - { id: ERR_BATCH_NOT_CONDITIONED, http: 409, condition: "Spawning requires the batch to be CONDITIONED" }
  - { id: ERR_BATCH_NOT_SPAWNED, http: 409, condition: "RoomCycle creation requires the batch to be SPAWNED" }
  - { id: ERR_BATCH_NOT_EXHAUSTED, http: 409, condition: "Retire requires the batch to be EXHAUSTED" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "PasteurizationCycle not in the required state (start needs SCHEDULED; complete/fail need RUNNING; abort needs SCHEDULED)" }
  - { id: ERR_TUNNEL_NOT_AVAILABLE, http: 409, condition: "Tunnel must be AVAILABLE to start a cycle / must be OUT_OF_SERVICE to sanitize" }
  - { id: ERR_ROOM_NOT_IDLE, http: 409, condition: "RoomCycle placement requires room occupancy_status IDLE" }
  - { id: ERR_ROOM_CYCLE_INVALID_PHASE, http: 409, condition: "RoomCycle not in the required phase for the operation" }
  - { id: ERR_FLUSH_NOT_RECORDED, http: 409, condition: "Operation requires the flush to be RECORDED (grading, piece logging)" }
  - { id: ERR_FLUSH_NOT_GRADED, http: 409, condition: "Operation requires the flush to be GRADED (packaging, piece approval, reopen source state)" }
  - { id: ERR_FLUSH_HAS_COMMITTED_PIECES, http: 409, condition: "Reopen blocked: packaged lots exist for the flush or some pieces are no longer LOGGED" }
  - { id: ERR_PIECE_INVALID_STATE, http: 409, condition: "Piece not in the required state (approve needs LOGGED|DISPUTED; dispute needs APPROVED)" }
  - { id: ERR_COMMITMENT_NOT_DRAFT, http: 409, condition: "Operation requires commitment DRAFT (activate, add line)" }
  - { id: ERR_COMMITMENT_NOT_ACTIVE, http: 409, condition: "Operation requires commitment ACTIVE (cancel)" }
  - { id: ERR_COMMITMENT_EMPTY, http: 409, condition: "Activation requires at least one commitment line" }
  - { id: ERR_COMMITMENT_HAS_DELIVERIES, http: 409, condition: "Cancel blocked: at least one line has delivered_kg > 0" }
  - { id: ERR_COMMITMENT_HAS_ALLOCATIONS, http: 409, condition: "Cancel blocked: packaged lots are ALLOCATED to a line of this commitment" }
  - { id: ERR_LINE_NOT_ACTIVE, http: 409, condition: "Allocation requires the commitment line to be ACTIVE" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "ContaminationEvent not in the required state (confirm/dismiss need REPORTED; remediate needs CONFIRMED; clear needs REMEDIATING)" }
  - { id: ERR_LOT_NOT_ALLOCATED, http: 409, condition: "Ship/deallocate require the packaged lot to be ALLOCATED" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "Ship requires expires_at strictly greater than the logical clock now (equality rejects)" }
  - { id: ERR_SPENT_LOT_INVALID_STATE, http: 409, condition: "Spent lot not in the required state for the operation" }
  - { id: ERR_UNRESOLVED_SPENT_LOTS, http: 409, condition: "Batch retire blocked: some room cycles are not terminal or some spent lots are not SOLD|DISPOSED" }

  # --- Business: safety (409) ---
  - { id: ERR_ROOM_QUARANTINED, http: 409, condition: "Room health_status is QUARANTINED: blocks cycle placement and packaging of the room's flushes" }
  - { id: ERR_SPENT_LOT_DISPOSAL_ONLY, http: 409, condition: "Spent lot was produced by a contamination abort and may only be disposed" }

  # --- Business: temporal (409) ---
  - { id: ERR_TUNNEL_WINDOW_OVERLAP, http: 409, condition: "Tunnel window collides with another SCHEDULED|RUNNING cycle under half-open [start, end) semantics (adjacency allowed)" }
  - { id: ERR_ROOM_WINDOW_OVERLAP, http: 409, condition: "Room window collides with another cycle's blocking interval [planned_start, planned_end + 2 days) (start exactly at the buffer end allowed)" }
  - { id: ERR_CYCLE_WINDOW_NOT_OPEN, http: 409, condition: "Clock now is outside [planned_start, planned_end] for start/place" }
  - { id: ERR_COLONIZATION_INCOMPLETE, http: 409, condition: "Minimum phase days (spawn_run_days / casing_days) have not elapsed on the logical clock" }
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc target is before the current logical time" }

  # --- Business: constraint ---
  - { id: ERR_TUNNEL_CAPACITY_EXCEEDED, http: 422, condition: "batch.tonnage exceeds tunnel.capacity_tonnes" }
  - { id: ERR_ROOM_CAPACITY_EXCEEDED, http: 422, condition: "allocated_tonnage exceeds room.capacity_tonnes" }
  - { id: ERR_RECIPE_MISMATCH, http: 422, condition: "variety.substrate_recipe differs from batch.recipe at spawning" }
  - { id: ERR_INSUFFICIENT_SUBSTRATE, http: 422, condition: "allocated_tonnage exceeds batch.remaining_tonnage" }
  - { id: ERR_PASTEURIZATION_INCOMPLETE, http: 422, condition: "hours_at_target_temp < 6.0 at completion" }
  - { id: ERR_GRADE_SPLIT_MISMATCH, http: 422, condition: "grade_a_kg + grade_b_kg + cull_kg != total_kg at 2-decimal exactness" }
  - { id: ERR_FLUSH_LIMIT_REACHED, http: 409, condition: "Recording another flush would exceed variety.max_flushes for the cycle" }
  - { id: ERR_INSUFFICIENT_GRADE_KG, http: 422, condition: "units * kg_per_unit exceeds the flush's remaining unpackaged kg of the requested grade" }
  - { id: ERR_NO_ELIGIBLE_LOTS, http: 422, condition: "FEFO allocation found no eligible IN_STOCK lot (or none that fits target_kg as first candidate)" }
  - { id: ERR_ALLOCATION_EXCEEDS_OPEN_COMMITMENT, http: 422, condition: "target_kg exceeds committed_kg - delivered_kg - allocated_kg for the line" }
  - { id: ERR_BUYER_NOT_ACTIVE, http: 409, condition: "Buyer must be ACTIVE (commitment creation, spent-lot reservation)" }
  - { id: ERR_WORKER_NOT_ACTIVE, http: 409, condition: "Piece logging requires an ACTIVE worker" }

  # --- Business: fiscal (422) ---
  - { id: ERR_PRICE_BELOW_FLOOR, http: 422, condition: "sale_price_cents below round(tonnage * 1500) for the spent substrate lot" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Runs the growing side: rooms, room cycles, flushes, packaging, workers, clock, daily sweep, spent-substrate disposal"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/operations/run-daily-sweep"
      - "POST /api/rooms"
      - "POST /api/room-cycles and all /api/room-cycles/{id}/* actions"
      - "POST /api/room-cycles/{id}/flushes"
      - "POST /api/flushes/{id}/packaged-lots"
      - "POST /api/workers, PATCH /api/workers/{id}"
      - "POST /api/spent-substrate-lots/{id}/dispose"
    shared_operations: ["All GET endpoints (role Any)"]

  - name: CompostSupervisor
    description: "Runs substrate production: varieties, batches, tunnels, pasteurization cycles, spawning, batch retirement"
    identity: opaque
    exclusive_operations:
      - "POST /api/varieties"
      - "POST /api/substrate-batches and /spawn and /retire"
      - "POST /api/pasteurization-tunnels and /sanitize"
      - "POST /api/pasteurization-cycles and /start /complete /fail /abort"
    shared_operations: ["All GET endpoints (role Any)"]

  - name: GradingInspector
    description: "Grades flush harvests; segregated from piece logging and piece approval"
    identity: opaque
    exclusive_operations:
      - "POST /api/flushes/{id}/grade"
      - "POST /api/flushes/{id}/reopen"
    shared_operations: ["All GET endpoints (role Any)"]

  - name: HarvestCrewLead
    description: "Logs piece-rate picking entries for crew members; X-User-ID must be an existing Worker id"
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /api/flushes/{id}/pieces"
    shared_operations: ["All GET endpoints (role Any)"]

  - name: PayrollClerk
    description: "Approves/disputes pieces and runs payouts; may never approve a piece it logged (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/pieces/{id}/approve"
      - "POST /api/pieces/{id}/dispute"
      - "POST /api/workers/{id}/payout"
    shared_operations: ["All GET endpoints (role Any)"]

  - name: SalesManager
    description: "Runs the commercial side: buyers, commitments, lines, FEFO allocation, shipping, spent-substrate resale"
    identity: opaque
    exclusive_operations:
      - "POST /api/buyers, PATCH /api/buyers/{id}"
      - "POST /api/buyer-commitments/{id}/activate and /cancel"
      - "POST /api/buyer-commitments/{id}/lines"
      - "POST /api/commitment-lines/{id}/allocate"
      - "POST /api/packaged-lots/{id}/deallocate and /ship"
      - "POST /api/spent-substrate-lots/{id}/reserve /release /sell"
    shared_operations:
      - "POST /api/buyer-commitments (shared with BuyerPortal)"
      - "All GET endpoints (role Any)"

  - name: QualityInspector
    description: "Owns contamination reporting, confirmation, remediation, and clearance; drives room health posture"
    identity: opaque
    exclusive_operations:
      - "POST /api/contamination-events and /confirm /dismiss /remediate /clear"
    shared_operations: ["All GET endpoints (role Any)"]

  - name: BuyerPortal
    description: "Buyer self-service portal; X-User-ID must be an existing Buyer id; may only create commitments for itself"
    identity: "entity_backed:Buyer"
    exclusive_operations: []
    shared_operations:
      - "POST /api/buyer-commitments (buyer_id must equal X-User-ID)"
      - "All GET endpoints (role Any)"

  - name: Any
    description: "Marker role for read-only access shared by every authenticated role"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
