            - call: "POST /tenants"
              payload: { email: "tx@x.com", full_name: "T X" }
              as: HarborMaster
              captures: { tx_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${ta_id}", name: "VA", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PA", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${ta_id}"
              captures: { va_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tx_id}", name: "VX", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PX", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
