scaffold_corner_design:
  - section: entities
    instances:
      - name: application_creation_returns_declared_defaults_and_version_one
        claim_type: creation
        grounds:
          - entities.MerchantApplication
          - endpoints[POST /merchant-applications]
          - state_machines.MerchantApplication.initial_state
        distinguishing_aspect: "A create with every required field returns 201 and the server-owned surface exactly as §1.1 declares it: state DRAFT, mcc_disposition ALLOWED (no matching ProhibitedCategoryRule), outstanding_info_items [], verification_attempt_count 0, owner_ownership_pct_total 0.00, version 1."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01, no ProhibitedCategoryRule rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
          trigger:
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Harborline Goods", tax_id: "88-4000001", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a1: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "MerchantApplication.${app_a1}.state == DRAFT"
            - "MerchantApplication.${app_a1}.mcc_disposition == ALLOWED"
            - "MerchantApplication.${app_a1}.outstanding_info_items == []"
            - "MerchantApplication.${app_a1}.verification_attempt_count == 0"
            - "MerchantApplication.${app_a1}.owner_ownership_pct_total == 0.00"
            - "MerchantApplication.${app_a1}.decline_reason_code == null"
            - "MerchantApplication.${app_a1}.current_reserve_pct_bps == null"
            - "MerchantApplication.${app_a1}.version == 1"
            - "MerchantApplication.${app_a1}.requested_monthly_volume_cents == 30000000"
            - "response envelope is { meta, response_type: \"object\", data } with data holding the MerchantApplication"

      - name: application_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /merchant-applications/{id}]
          - entities.MerchantApplication.fields.tax_id
        distinguishing_aspect: "GET /merchant-applications/{id} returns the same field values the create response wrote - no field is dropped or re-derived on read."
        test_recipe:
          setup:
            - "one DRAFT application created at clock 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Ridgeway Parts", tax_id: "88-4000002", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a2: "$.data.id" }
          trigger:
            - call: "GET /merchant-applications/${app_a2}"
              payload: {}
              as: UnderwritingOfficer
          assert:
            - "HTTP status == 200"
            - "MerchantApplication.${app_a2}.legal_business_name == Ridgeway Parts"
            - "MerchantApplication.${app_a2}.tax_id == 88-4000002"
            - "MerchantApplication.${app_a2}.credit_score == 700"
            - "MerchantApplication.${app_a2}.avg_delivery_lag_days == 0"
            - "MerchantApplication.${app_a2}.state == DRAFT"
            - "MerchantApplication.${app_a2}.version == 1"

      - name: application_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /merchant-applications]
          - pagination_fields
          - pagination_defaults
        distinguishing_aspect: "With exactly three applications, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the third row with has_more false; row order is created_at ASC."
        test_recipe:
          setup:
            - "three DRAFT applications created in this order: Alpha Tools, Bravo Tools, Cedar Tools"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Alpha Tools", tax_id: "88-4000003", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a3: "$.data.id" }
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Bravo Tools", tax_id: "88-4000004", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_b3: "$.data.id" }
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Cedar Tools", tax_id: "88-4000005", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_c3: "$.data.id" }
          trigger:
            - call: "GET /merchant-applications"
              payload: { limit: 2, offset: 0 }
              as: RiskAnalyst
            - call: "GET /merchant-applications"
              payload: { limit: 2, offset: 2 }
              as: RiskAnalyst
          assert:
            - "first response meta.total_count == 3, meta.limit == 2, meta.offset == 0, meta.has_more == true"
            - "first response data length == 2 with data[0].id == ${app_a3} and data[1].id == ${app_b3} (created_at ASC)"
            - "second response meta.total_count == 3, meta.offset == 2, meta.has_more == false"
            - "second response data length == 1 with data[0].id == ${app_c3}"

      - name: unknown_uuid_not_found_across_all_ten_entity_lookups
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: "One unknown UUID probed against all ten referential families returns the family-specific 404 error_id, never a generic 404 or a 500."
        test_recipe:
          setup:
            - "empty database apart from the clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: RiskAnalyst
          trigger:
            - call: "GET /merchant-applications/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: UnderwritingOfficer
              captures: { err_a4_1: "$.data.error_id" }
            - call: "POST /beneficial-owners/00000000-0000-0000-0000-0000000000ff/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
              captures: { err_a4_2: "$.data.error_id" }
            - call: "GET /merchants/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_3: "$.data.error_id" }
            - call: "GET /reserve-accounts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_4: "$.data.error_id" }
            - call: "GET /settlement-batches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_5: "$.data.error_id" }
            - call: "POST /monitoring-alerts/00000000-0000-0000-0000-0000000000ff/review"
              payload: { disposition: "ACKNOWLEDGE" }
              as: RiskAnalyst
              captures: { err_a4_6: "$.data.error_id" }
            - call: "GET /remediation-programs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_7: "$.data.error_id" }
            - call: "GET /termination-decisions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_8: "$.data.error_id" }
            - call: "GET /appeals/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_9: "$.data.error_id" }
            - call: "GET /portfolio-forecasts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RiskAnalyst
              captures: { err_a4_10: "$.data.error_id" }
          assert:
            - "every one of the ten responses has HTTP status == 404"
            - "${err_a4_1} == ERR_APPLICATION_NOT_FOUND"
            - "${err_a4_2} == ERR_OWNER_NOT_FOUND"
            - "${err_a4_3} == ERR_MERCHANT_NOT_FOUND"
            - "${err_a4_4} == ERR_RESERVE_ACCOUNT_NOT_FOUND"
            - "${err_a4_5} == ERR_BATCH_NOT_FOUND"
            - "${err_a4_6} == ERR_ALERT_NOT_FOUND"
            - "${err_a4_7} == ERR_PROGRAM_NOT_FOUND"
            - "${err_a4_8} == ERR_TERMINATION_DECISION_NOT_FOUND"
            - "${err_a4_9} == ERR_APPEAL_NOT_FOUND"
            - "${err_a4_10} == ERR_FORECAST_NOT_FOUND"

      - name: missing_required_input_fields_rejected_with_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - endpoints[POST /merchant-applications]
          - endpoints[POST /beneficial-owners]
        distinguishing_aspect: "Omitting tax_id, omitting credit_score, and omitting ownership_pct each return 400 ERR_INVALID_REQUEST and persist nothing; the owner call fails on the missing field even though its application_id is valid."
        test_recipe:
          setup:
            - "one DRAFT application exists so the owner probe has a valid parent"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Delta Tools", tax_id: "88-4000006", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a5: "$.data.id" }
          trigger:
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "No Tax LLC", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { err_a5_1: "$.data.error_id" }
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "No Score LLC", tax_id: "88-4000007", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24 }
              as: Applicant
              captures: { err_a5_2: "$.data.error_id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_a5}", full_name: "Pat Vance", country_code: "US", date_of_birth: "1980-05-05", government_id_last4: "1234" }
              as: Applicant
              as_user_id: "${app_a5}"
              captures: { err_a5_3: "$.data.error_id" }
          assert:
            - "all three responses have HTTP status == 400"
            - "${err_a5_1} == ERR_INVALID_REQUEST"
            - "${err_a5_2} == ERR_INVALID_REQUEST"
            - "${err_a5_3} == ERR_INVALID_REQUEST"
            - "MerchantApplication.${app_a5}.owner_ownership_pct_total == 0.00 (no owner row was persisted)"
            - "GET /merchant-applications returns meta.total_count == 1 (neither rejected application was persisted)"

      - name: category_rule_omitted_reserve_uplift_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.ProhibitedCategoryRule.fields.reserve_uplift_bps
          - endpoints[POST /prohibited-category-rules]
        distinguishing_aspect: "Omitting reserve_uplift_bps stores 0, so a RESTRICTED_REVIEW rule with no uplift adds nothing to reserve_pct_bps, while an explicit 400 on a second rule is stored verbatim."
        test_recipe:
          setup:
            - "empty rule table"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
          trigger:
            - call: "POST /prohibited-category-rules"
              payload: { mcc_code: "7273", category: "DATING_SERVICES", disposition: "RESTRICTED_REVIEW" }
              as: UnderwritingOfficer
              captures: { rule_a6: "$.data.id" }
            - call: "POST /prohibited-category-rules"
              payload: { mcc_code: "7995", category: "GAMBLING", disposition: "RESTRICTED_REVIEW", reserve_uplift_bps: 400 }
              as: UnderwritingOfficer
              captures: { rule_b6: "$.data.id" }
          assert:
            - "HTTP status == 201 on both calls"
            - "ProhibitedCategoryRule.${rule_a6}.reserve_uplift_bps == 0"
            - "ProhibitedCategoryRule.${rule_a6}.disposition == RESTRICTED_REVIEW"
            - "ProhibitedCategoryRule.${rule_b6}.reserve_uplift_bps == 400"

      - name: forecast_omitted_stress_multiplier_defaults_to_25000
        claim_type: defaults
        grounds:
          - entities.PortfolioForecast.fields.stress_multiplier_bps
          - calculations.portfolio_loss_forecast
        distinguishing_aspect: "A STRESSED forecast with stress_multiplier_bps omitted stores exactly 25000, and on an empty portfolio the zero-denominator guard yields reserve_adequacy_ratio_bps 0 instead of an error."
        test_recipe:
          setup:
            - "no Merchant rows at all; logical clock 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioController
          trigger:
            - call: "POST /portfolio-forecasts"
              payload: { as_of_date: "2026-08-01", method: "STRESSED" }
              as: PortfolioController
              captures: { fc_a7: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "PortfolioForecast.${fc_a7}.stress_multiplier_bps == 25000"
            - "PortfolioForecast.${fc_a7}.merchant_count == 0"
            - "PortfolioForecast.${fc_a7}.unpaid_exposure_cents == 0"
            - "PortfolioForecast.${fc_a7}.gross_expected_loss_cents == 0"
            - "PortfolioForecast.${fc_a7}.reserve_adequacy_ratio_bps == 0"
            - "PortfolioForecast.${fc_a7}.required_additional_reserve_cents == 0"
            - "PortfolioForecast.${fc_a7}.projected_adequacy_ratio_bps == 0"

      - name: ownership_total_recomputed_on_every_owner_insert
        claim_type: computed_fields
        grounds:
          - entities.MerchantApplication.fields.owner_ownership_pct_total
          - endpoints[POST /beneficial-owners]
        distinguishing_aspect: "owner_ownership_pct_total is a computed field the client never supplies: after 40.00 it reads 40.00, after a second owner of 35.50 it reads 75.50 with two-decimal precision."
        test_recipe:
          setup:
            - "one DRAFT application with no owners"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Echo Foods", tax_id: "88-4000008", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a8: "$.data.id" }
          trigger:
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_a8}", full_name: "Mara Quill", ownership_pct: 40.00, country_code: "US", date_of_birth: "1975-01-09", government_id_last4: "9001" }
              as: Applicant
              as_user_id: "${app_a8}"
              captures: { own_a8: "$.data.id" }
            - call: "GET /merchant-applications/${app_a8}"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_a8}", full_name: "Ivo Trask", ownership_pct: 35.50, country_code: "CA", date_of_birth: "1969-11-30", government_id_last4: "9002" }
              as: Applicant
              as_user_id: "${app_a8}"
              captures: { own_b8: "$.data.id" }
          assert:
            - "after the first owner MerchantApplication.${app_a8}.owner_ownership_pct_total == 40.00"
            - "after the second owner MerchantApplication.${app_a8}.owner_ownership_pct_total == 75.50"
            - "BeneficialOwner.${own_a8}.status == PENDING"
            - "BeneficialOwner.${own_b8}.status == PENDING"
            - "BeneficialOwner.${own_a8}.sanctions_hit == false"
            - "BeneficialOwner.${own_a8}.screened_at == null"

      - name: system_fields_id_timestamps_and_version_are_server_owned
        claim_type: system_fields
        grounds:
          - entities.MerchantApplication
          - endpoints[POST /merchant-applications/{id}/submit]
        distinguishing_aspect: "id / created_at / updated_at / version are minted by the server: created_at and updated_at equal the logical clock at creation, version is 1, and the submit mutation bumps version to 2 and moves updated_at to the new clock while created_at stays frozen."
        test_recipe:
          setup:
            - "clock at 2026-08-01, application created, one owner attached, clock advanced to 2026-08-03 before submit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Foxglove Media", tax_id: "88-4000009", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a9: "$.data.id", app_a9_created: "$.data.created_at" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_a9}", full_name: "Nils Bergh", ownership_pct: 100.00, country_code: "US", date_of_birth: "1981-02-02", government_id_last4: "9003" }
              as: Applicant
              as_user_id: "${app_a9}"
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-03T09:30:00Z" }
              as: Applicant
          trigger:
            - call: "POST /merchant-applications/${app_a9}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_a9}"
          assert:
            - "${app_a9_created} == 2026-08-01T00:00:00Z"
            - "MerchantApplication.${app_a9}.created_at == 2026-08-01T00:00:00Z"
            - "MerchantApplication.${app_a9}.updated_at == 2026-08-03T09:30:00Z"
            - "MerchantApplication.${app_a9}.version == 2"
            - "MerchantApplication.${app_a9}.state == SUBMITTED"
            - "MerchantApplication.${app_a9}.id == ${app_a9} (unchanged by the mutation)"

      - name: enum_and_range_constraints_rejected_on_four_create_calls
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.BeneficialOwner.fields.ownership_pct
          - entities.MerchantApplication.fields.credit_score
          - entities.MerchantApplication.fields.country_code
          - entities.CreditAssessment.fields.method
        distinguishing_aspect: "Four distinct constraint classes each return 400 ERR_INVALID_REQUEST: ownership_pct 150.00 above its 0.01..100 range, credit_score 900 above its 300..850 range, country_code MX outside {US, CA}, and method GUESS outside the CreditAssessment enum."
        test_recipe:
          setup:
            - "one DRAFT application to hang the owner probe on"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Gale Hardware", tax_id: "88-4000010", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_a10: "$.data.id", av_a10: "$.data.version" }
          trigger:
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_a10}", full_name: "Over Owner", ownership_pct: 150.00, country_code: "US", date_of_birth: "1980-05-05", government_id_last4: "1234" }
              as: Applicant
              as_user_id: "${app_a10}"
              captures: { err_a10_1: "$.data.error_id" }
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "High Score LLC", tax_id: "88-4000011", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 900 }
              as: Applicant
              captures: { err_a10_2: "$.data.error_id" }
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Offshore LLC", tax_id: "88-4000012", mcc_code: "5732", country_code: "MX", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { err_a10_3: "$.data.error_id" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_a10}", method: "GUESS", expected_application_version: "${av_a10}" }
              as: UnderwritingOfficer
              captures: { err_a10_4: "$.data.error_id" }
          assert:
            - "all four responses have HTTP status == 400"
            - "${err_a10_1} == ERR_INVALID_REQUEST"
            - "${err_a10_2} == ERR_INVALID_REQUEST"
            - "${err_a10_3} == ERR_INVALID_REQUEST"
            - "${err_a10_4} == ERR_INVALID_REQUEST"
            - "the 400 on method GUESS is returned instead of the priority-17 ERR_APPLICATION_STATE_INVALID that the DRAFT application would otherwise raise"

      - name: append_only_entities_expose_no_version_and_no_mutation_endpoint
        claim_type: immutability
        grounds:
          - entities.ProhibitedCategoryRule
          - entities.MerchantDayActivity
          - entities.ReserveLedgerEntry
          - endpoints[GET /prohibited-category-rules]
        distinguishing_aspect: "The three common_fields:false entities (ProhibitedCategoryRule, MerchantDayActivity, ReserveLedgerEntry) carry id and created_at but no version and no updated_at, and §1.5 declares no PUT, PATCH or DELETE for any of them."
        test_recipe:
          setup:
            - "two category rules created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /prohibited-category-rules"
