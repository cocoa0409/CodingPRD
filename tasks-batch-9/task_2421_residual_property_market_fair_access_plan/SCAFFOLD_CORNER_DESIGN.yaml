        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /fair-plan/member-insurers/{id}]
          - state_machines.MemberInsurer
        distinguishing_aspect: "The only update endpoint in the surface applies a partial body: one PATCH carrying both status RUNOFF and a restated market_share_pct writes both fields and increments version exactly once (1 -> 2), and the omitted written_premium_share_pct keeps its stored 10.00."
        test_recipe:
          setup:
            - "One ACTIVE member insurer created with market_share_pct 30.00 and written_premium_share_pct 10.00 at version 1."
          setup_api_calls:
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id, m1_v: $.data.version }
          trigger:
            - call: "PATCH /fair-plan/member-insurers/${m1_id}"
              payload: { status: "RUNOFF", market_share_pct: 25.00 }
              as: PlanAdmin
          assert:
            - "response status == 200"
            - "the setup capture ${m1_v} was 1"
            - "MemberInsurer.${m1_id}.status == RUNOFF"
            - "MemberInsurer.${m1_id}.market_share_pct == 25.00"
            - "MemberInsurer.${m1_id}.written_premium_share_pct == 10.00"
            - "MemberInsurer.${m1_id}.version == 2"
            - "a follow-up GET /fair-plan/member-insurers/${m1_id} as PlanAdmin returns the same four values (immediate consistency)"

