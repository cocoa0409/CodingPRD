# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Juice & Beverage Bottling Plant
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_diverge
        grounds:
          - calculations.invoice_calculation
          - entities.ProductionRun.fields.provisional_invoice_cents
          - entities.ProductionRun.fields.final_invoice_cents
        distinguishing_aspect: |
          Entity domain: ProductionRun fiscal ledger. Two valid invoice variants
          over identical fill data: provisional (no giveaway deduction) = 149400
          cents, final (giveaway-deducted) = 148980 cents — a 420-cent delta.
        test_recipe:
          setup:
            - "ACTIVE customer (limit 1000000, min run 500, pallet deposit 1500)"
            - "APPROVED PASTEURIZATION formula AJ-473 (target 12.0, tol 0.3, fill 473 ml, conc 65.0, allergen NONE, shelf 120)"
            - "RELEASED 2000 L batch (processed_liters 1960.0 after 2% loss)"
            - "Line L-1 (PET_473), QC_PASSED container lot of 5000 PET_473, zone Z-AMB AMBIENT cap 50"
            - "Run planned 1000 @150c, SCHEDULED into 2026-08-11T08:00-12:00Z, clock inside window"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Acme Juice Co", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "AJ-473", name: "Apple Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-1", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-1", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-1" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-AMB", temperature_class: "AMBIENT", pallet_capacity: 50 }, as: PlantManager, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 476, warehouse_zone_id: "${zone_id}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /v1/production-runs/${run_id}/finalize-invoice", payload: {}, as: FinanceClerk }
          assert:
            - "ProductionRun.${run_id}.billable_units == 996"
            - "ProductionRun.${run_id}.giveaway_liters == 3.0"
            - "ProductionRun.${run_id}.provisional_invoice_cents == 149400"
            - "ProductionRun.${run_id}.final_invoice_cents == 148980"
            - "ProductionRun.${run_id}.invoice_status == FINAL and production_status == COMPLETED"
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == 148980 (149400 posted at complete, then -420 delta at finalize)"

      - name: shelf_life_label_vs_stability_export
        grounds:
          - calculations.shelf_life_expiry
          - calculations.fefo_allocation
          - entities.FinishedGoodLot.fields.expiry_stability_date
        distinguishing_aspect: |
          Entity domain: FinishedGoodLot shelf-life (different domain from the
          ProductionRun invoice instance). Same HPP lot, same delivery date
          2026-11-15: EXPORT reads expiry_stability_date (2027-02-01, 78 days
          remaining >= 60) and allocates; DIRECT_RETAIL reads expiry_label_date
          (2026-12-03, 18 days remaining < 30) and backorders.
        test_recipe:
          setup:
            - "ACTIVE customer; APPROVED HPP formula (fill 473, shelf 120, allergen NONE)"
            - "RELEASED 2000 L batch; line, QC_PASSED containers, CHILLED zone cap 50"
            - "Run completed with clock at 2026-08-05T09:00:00Z -> production_date 2026-08-05, lot of 1000 units"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Tropicane Ltd", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "HPP-473", name: "Cold Pressed Greens", target_brix: 8.0, brix_tolerance: 0.3, process_type: "HPP", container_fill_ml: 473, concentrate_brix: 60.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["COLD_PRESSED"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-9", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-04T08:00:00Z", planned_end_at: "2026-08-04T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 8.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_pressure_mpa: 600.0, setpoint_pressure_hold_seconds: 180 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_pressure_mpa: 600.0, pressure_hold_shortfall_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-2", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-9" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-05T08:00:00Z", scheduled_end_at: "2026-08-05T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-CHL", temperature_class: "CHILLED", pallet_capacity: 50 }, as: PlantManager, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_id}" }, as: ProductionPlanner, captures: { lot_probe: $.data.id } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "EXPORT", requested_delivery_date: "2026-11-15", units_requested: 100 }, as: CustomerServiceRep, captures: { ord_exp: $.data.id, ord_exp_v: $.data.version } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-11-15", units_requested: 100 }, as: CustomerServiceRep, captures: { ord_ret: $.data.id, ord_ret_v: $.data.version } }
          trigger:
            - { call: "POST /v1/shipment-orders/${ord_exp}/allocate", payload: { expected_shipment_order_version: "${ord_exp_v}" }, as: WarehouseLead }
            - { call: "POST /v1/shipment-orders/${ord_ret}/allocate", payload: { expected_shipment_order_version: "${ord_ret_v}" }, as: WarehouseLead }
            - { call: "GET /v1/production-runs/${run_id}/finished-good-lots", payload: {}, as: Any, captures: { lot_label_exp: "$.data[0].expiry_label_date", lot_stab_exp: "$.data[0].expiry_stability_date" } }
          assert:
            - "FinishedGoodLot.expiry_label_date == 2026-12-03 (production 2026-08-05 + 120 days)"
            - "FinishedGoodLot.expiry_stability_date == 2027-02-01 (HPP: + floor(120 * 1.5) = 180 days)"
            - "ShipmentOrder.${ord_exp}.status == ALLOCATED and allocated_units == 100 (stability variant: 78 days remaining >= 60)"
            - "ShipmentOrder.${ord_ret}.status == BACKORDERED and allocated_units == 0 (label variant: 18 days remaining < 30)"
            - "ShipmentOrder.${ord_exp}.min_shelf_life_days == 60 and ShipmentOrder.${ord_ret}.min_shelf_life_days == 30"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: brix_dilution_branch_with_capacity_gate
        grounds:
          - calculations.brix_adjustment
          - entities.Batch.fields.added_water_liters
        distinguishing_aspect: |
          Mode (a): >=3 inputs with conditional branches and a nested capacity
          min/max gate. Dilution branch divides by target_brix; concentration
          branch divides by (concentrate_brix - target_brix) — different
          divisors, exercised in one chain; capacity gate rejects overflow.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula (target 12.0, tol 0.3, conc 65.0); tank T-3 cap 5000"
            - "Batch 2000 L blended at measured_brix 12.8 (0.8 over target, outside the +/-0.3 band), QA failed"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Blend Corp", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "BL-1", name: "BlendTest", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-3", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.8 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { b_status: $.data.status } }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_water: $.data.added_water_liters, b_qty: $.data.quantity_liters, b_count: $.data.adjustment_count } }
          assert:
            - "Batch.${batch_id}.added_water_liters == 133.3 (2000 * 0.8 / 12.0, 0.1 L round_half_up)"
            - "Batch.${batch_id}.added_concentrate_liters == 0"
            - "Batch.${batch_id}.quantity_liters == 2133.3 (initial 2000 + 133.3 — mass balance)"
            - "Batch.${batch_id}.adjustment_count == 1 and status == BLENDING"

      - name: case_floor_before_invoice_rounding_order
        grounds:
          - calculations.yield_and_giveaway
          - entities.ProductionRun.fields.billable_units
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — case-floor per run FIRST
          ((1000 // 12) * 12 = 996 billable), then multiply by price. The
          alternative sum-then-round reading bills 1000 units = 150000 cents;
          the pinned order yields provisional_invoice_cents == 149400.
        test_recipe:
          setup:
            - "Same full pipeline as invoice_provisional_vs_final_diverge up to a SCHEDULED run (planned 1000 @150c, batch processed_liters 1960.0, theoretical_units 4143)"
            - "Clock inside the window"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "RoundTrip Inc", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "RT-473", name: "RoundTrip Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-4", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-4", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-4" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-4", temperature_class: "AMBIENT", pallet_capacity: 50 }, as: PlantManager, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_id}" }, as: ProductionPlanner, captures: { run_billable: $.data.billable_units, run_prov: $.data.provisional_invoice_cents } }
          assert:
            - "ProductionRun.${run_id}.theoretical_units == 4143 (floor(1960.0 * 1000 / 473))"
            - "ProductionRun.${run_id}.billable_units == 996 — case-floor FIRST ((1000 // 12) * 12), NOT 1000"
            - "ProductionRun.${run_id}.provisional_invoice_cents == 149400 (996 * 150), never 150000"
            - "ProductionRun.${run_id}.giveaway_liters == 0.0 (avg_fill 473 == nominal 473)"

      - name: invoice_evaluation_order_circular_pin
        grounds:
          - calculations.invoice_calculation
          - calculations.yield_and_giveaway
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to a strict evaluation
          order — billable_units (case-floor) feeds provisional invoice; giveaway
          deduction (from avg_fill) applies only at finalize; the customer ledger
          receives the DELTA (-420), so outstanding after finalize is 148980, not
          148980 + 149400 and not 149400.
        test_recipe:
          setup:
            - "Same pipeline as case_floor_before_invoice_rounding_order, completed with actual 1000, avg_fill 476"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "CircuMax", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
