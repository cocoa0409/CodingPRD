              payload: {}
              as: LicensingCoordinator
          assert:
            - "PermitApplication.${permit_f_id}.state == \"SUBMITTED\""
            - "PermitApplication.${permit_f_id}.resubmission_count == 1"
            - "PermitApplication.${permit_f_id}.deficiency_reason == null"
            - "Milestone.${m_f1_id}.state == \"IN_PROGRESS\""
            - "Milestone.${m_f1_id}.blocked_days_accrued == 21"
            - "Milestone.${m_f1_id}.actual_finish_date == \"2026-11-05\""
            - "PreOpeningProgram.${prog_f_id}.readiness_posture == \"MOBILIZING\""
            - "PreOpeningProgram.${prog_f_id}.projected_opening_date_committed == \"2026-12-10\""
            - "PreOpeningProgram.${prog_f_id}.projected_opening_date_optimistic == \"2026-11-19\""
            - "PreOpeningProgram.${prog_f_id}.schedule_state == \"LICENSING\""

      - name: program_schedule_and_commercial_dimensions_advance_independently
        grounds:
          - state_machines.PreOpeningProgram.CONSTRUCTION_COMPLETE_to_LICENSING
          - state_machines.PreOpeningProgram.BOOKING_CLOSED_to_BOOKING_OPEN
          - state_machines.PreOpeningProgram.BOOKING_OPEN_to_BOOKING_SUSPENDED
          - entities.PreOpeningProgram.fields.schedule_state
          - entities.PreOpeningProgram.fields.commercial_state
        distinguishing_aspect: |
          Parallel state dimensions on the PreOpeningProgram entity — a different entity from the
          PermitApplication cycle: a permit submission advances schedule_state CONSTRUCTION_COMPLETE
          -> LICENSING while commercial_state stays BOOKING_OPEN, and a manual suspension then moves
          commercial_state to BOOKING_SUSPENDED while schedule_state stays LICENSING.
        test_recipe:
          setup:
            - "Program with one 60-day CONSTRUCTION_COMPLETE milestone, baselined and run to COMPLETE over 2026-09-01..2026-11-05, so schedule_state is CONSTRUCTION_COMPLETE."
            - "Booking opened, so commercial_state is BOOKING_OPEN while schedule_state is still CONSTRUCTION_COMPLETE."
            - "A DRAFT mandatory FOOD_SERVICE permit gated on the completed milestone."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Union Yard Hotel", brand_code: "UYH", room_count: 170, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14, slip_tolerance_days: 10 }
