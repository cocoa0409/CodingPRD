scenario: >-
  Barrel Aging Inventory Planning & Warehouse Management (Brown-Forman): distillation volume decisions made years ahead of demand with inventory that cannot be accelerated, barrel production including cooperage operations with wood sourcing, seasoning and char levels, warehouse placement and rickhouse position affecting maturation profile with rotation and sampling programs, angel share evaporation loss accounting and its variation by location and season, age statement obligations constraining blending options once a label is set, tax and bonded warehouse compliance with barrel accounting and loss reporting, single barrel and private selection programs allowing customers to choose specific barrels, capacity expansion decisions with multi-year lag between construction and salable product

domain_name: barrel-aging-inventory-planning
api_prefix: /barrel-aging

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  # hybrid: ExpansionProject -> Rickhouse -> WarehouseSlot tree, with Barrel /
  # BlendBatch / PrivateSelectionProgram / BondedPeriodReport as cross-cutting
  # aggregates referencing the tree via flat FKs.
  state_machine_shape: parallel
  # parallel: Barrel carries two independent state dimensions
  # (maturation_status x custody_status) with a join gate at withdrawal;
  # BlendBatch and BondedPeriodReport additionally carry cyclic revision loops;
  # Rickhouse is posture_driven (compound aggregate of its slots' occupancy).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Global conventions (binding on every table below)
# - All month arithmetic uses 30-day months; all year arithmetic uses 365-day
#   years. No calendar-month or leap-year logic anywhere.
# - All timestamps are logical-clock instants (see POST /_clock/set_current_utc).
#   The server default clock at startup is 2026-09-01T00:00:00Z and is
#   monotonic non-decreasing.
# - "Lazy" auto-transitions (maturation eligibility, reservation expiry,
#   posture flips) are re-evaluated on every clock-set AND on every read of the
#   affected entity.
# - All money-free; volumes are liters as decimal numbers.
# =============================================================================

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CapacityExpansionProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Project label; also copied onto the cascaded Rickhouse."
      - name: region_code
        type: string
        source: input
        description: "Region tag (e.g. KY, TN) inherited by the rickhouse; documents the location axis of evaporation variation."
      - name: floors
        type: integer
        source: input
        description: "Rickhouse floors; floor_index 1 is ground."
        constraints: ">= 1"
      - name: rows_per_floor
        type: integer
        source: input
        description: "Rows per floor."
        constraints: ">= 1"
      - name: positions_per_row
        type: integer
        source: input
        description: "Barrel positions per row."
        constraints: ">= 1"
      - name: construction_lag_months
        type: integer
        source: input
        description: "Lag between approval and commissionability, in 30-day months."
        constraints: ">= 1"
      - name: planned_annual_distillation_liters
        type: integer
        source: input
        description: "Planned annual distillation volume decided years ahead of demand."
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: "Lifecycle state."
        constraints: "one of PROPOSED, APPROVED, COMMISSIONED"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical clock at approval; null until approved."
      - name: commissioned_at
        type: datetime
        source: system
        description: "Logical clock at commissioning; null until commissioned."

  - name: Rickhouse
    parent: CapacityExpansionProject
    common_fields: true
    fields:
      - name: expansion_project_id
        type: string
        source: system
        description: "FK -> CapacityExpansionProject.id; set by the approval cascade that creates this rickhouse."
      - name: name
        type: string
        source: system
        description: "Copied from the parent project's name at cascade time."
      - name: region_code
        type: string
        source: system
        description: "Copied from the parent project."
      - name: floors
        type: integer
        source: system
        description: "Copied from the parent project spec."
      - name: rows_per_floor
        type: integer
        source: system
        description: "Copied from the parent project spec."
      - name: positions_per_row
        type: integer
        source: system
        description: "Copied from the parent project spec."
      - name: total_slots
        type: integer
        source: computed
        description: "floors * rows_per_floor * positions_per_row."
      - name: occupied_slots
        type: integer
        source: computed
        description: "Count of WarehouseSlots of this rickhouse that have an OPEN SlotOccupancy."
      - name: posture
        type: enum
        source: computed
        description: "Derived posture gating placements."
        constraints: "one of PLANNED, OPERATING, FULL"

  - name: WarehouseSlot
    parent: Rickhouse
    common_fields: true
    fields:
      - name: rickhouse_id
        type: string
        source: system
        description: "FK -> Rickhouse.id; set at the commissioning cascade."
      - name: floor_index
        type: integer
        source: system
        description: "1-based floor; higher floors run hotter."
      - name: row_index
        type: integer
        source: system
        description: "1-based row within the floor."
      - name: position_index
        type: integer
        source: system
        description: "1-based position within the row."
      - name: heat_factor
        type: number
        source: computed
        description: "round(1.0 + 0.05 * (floor_index - 1), 2); multiplies statutory evaporation."

  - name: Barrel
    parent: null
    common_fields: true
    fields:
      - name: wood_origin
        type: enum
        source: input
        description: "Cooperage wood sourcing."
        constraints: "one of AMERICAN_WHITE_OAK, FRENCH_OAK, MIZUNARA"
      - name: seasoning_months
        type: integer
        source: input
        description: "Wood seasoning duration in 30-day months; >= 18 earns the statutory evaporation discount."
        constraints: ">= 0"
      - name: char_level
        type: integer
        source: input
        description: "Cooperage char level."
        constraints: "integer in [1, 4]"
      - name: spirit_type
        type: enum
        source: input
        description: "Spirit category."
        constraints: "one of BOURBON, RYE, TENNESSEE, SINGLE_MALT"
      - name: fill_proof
        type: number
        source: input
        description: "Proof at fill."
        constraints: "> 0"
      - name: fill_volume_liters
        type: number
        source: input
        description: "Volume filled, in liters."
        constraints: "> 0"
      - name: min_maturation_months
        type: integer
        source: input
        description: "Minimum maturation before MATURE_ELIGIBLE, in 30-day months."
        constraints: ">= 0"
      - name: fill_date
        type: datetime
        source: system
        description: "Logical clock at creation (filling)."
      - name: maturation_status
        type: enum
        source: computed
        description: "Maturation state dimension (independent of custody_status)."
        constraints: "one of FILLED, AGING, MATURE_ELIGIBLE, DUMPED"
      - name: custody_status
        type: enum
        source: computed
        description: "Bonded custody dimension (independent of maturation_status)."
        constraints: "one of BONDED, WITHDRAWN"
      - name: current_volume_ledger_liters
        type: number
        source: computed
        description: "Chronological ledger volume per calculations.barrel_volume_ledger."
      - name: current_volume_statutory_liters
        type: number
        source: computed
        description: "Statutory projection volume per calculations.barrel_volume_statutory at the current logical clock."
      - name: current_slot_id
        type: string
        source: computed
        description: "Computed: the slot_id of this barrel's OPEN SlotOccupancy, or null when no occupancy is open. Not a stored FK; SlotOccupancy is the source of truth."
      - name: withdrawn_at
        type: datetime
        source: system
        description: "Logical clock at withdrawal; null until withdrawn."
      - name: withdrawn_volume_liters
        type: number
        source: system
        description: "Ledger volume frozen at withdrawal; null until withdrawn."

  - name: SlotOccupancy
    parent: Barrel
    common_fields: false
    fields:
      - name: barrel_id
        type: string
        source: system
        description: "FK -> Barrel.id; the occupying barrel."
      - name: slot_id
        type: string
        source: system
        description: "FK -> WarehouseSlot.id; the occupied slot (creation input slot_id / rotation input to_slot_id)."
      - name: move_reason
        type: enum
        source: input
        description: "Why this occupancy exists."
        constraints: "one of INITIAL_FILL, ROTATION"
      - name: start_at
        type: datetime
        source: system
        description: "Logical clock when the occupancy opened."
      - name: end_at
        type: datetime
        source: system
        description: "Logical clock when the occupancy closed; null while OPEN. Intervals are half-open [start_at, end_at)."
      - name: status
        type: enum
        source: computed
        description: "OPEN while end_at is null, else CLOSED."
        constraints: "one of OPEN, CLOSED"

  - name: BarrelAssessment
    parent: Barrel
    common_fields: false
    fields:
      - name: barrel_id
        type: string
        source: system
        description: "FK -> Barrel.id; path barrel."
      - name: kind
        type: enum
        source: input
        description: "EVAPORATION_READING records a measured volume (angel-share accounting); QUALITY_SAMPLE draws a sample and may record a score."
        constraints: "one of EVAPORATION_READING, QUALITY_SAMPLE"
      - name: measured_volume_liters
        type: number
        source: input
        description: "Required iff kind == EVAPORATION_READING; authoritative volume reading. Must be <= the barrel's current ledger volume."
      - name: sample_draw_liters
        type: number
        source: input
        description: "Required iff kind == QUALITY_SAMPLE; volume drawn and consumed."
        constraints: "> 0"
      - name: quality_score
        type: integer
        source: input
        description: "Optional; only meaningful for QUALITY_SAMPLE. Null when omitted."
        constraints: "integer in [0, 100]"
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical clock at assessment creation."

  - name: Label
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Label name."
      - name: age_statement_years
        type: integer
        source: input
        description: "Declared age statement in 365-day years; immutable once created (no update endpoint exists). Constrains blending: every component barrel's age at the scheduled bottling date must be >= this value."
        constraints: ">= 0"
      - name: spirit_type
        type: enum
        source: input
        description: "Spirit category; blend components must match."
        constraints: "one of BOURBON, RYE, TENNESSEE, SINGLE_MALT"
      - name: state
        type: enum
        source: computed
        description: "Lifecycle state."
        constraints: "one of REGISTERED, ACTIVE"

  - name: BlendBatch
    parent: Label
    common_fields: true
    fields:
      - name: label_id
        type: string
        source: input
        description: "FK -> Label.id; the label this blend bottles under."
      - name: scheduled_bottling_date
        type: datetime
        source: input
        description: "Planned bottling instant; must be strictly after the current logical clock at batch creation."
      - name: state
        type: enum
        source: computed
        description: "Lifecycle state with a revision loop (VALIDATED -> PROPOSED)."
        constraints: "one of PROPOSED, VALIDATED, COMMITTED, ABORTED"
      - name: validated_at
        type: datetime
        source: system
        description: "Logical clock of the most recent validation; null until first validate."
      - name: committed_at
        type: datetime
        source: system
        description: "Logical clock at commit; null until committed."
      - name: final_blend_volume_liters
        type: number
        source: computed
        description: "Sum of component drawn_volume_liters, frozen at commit; null until committed."

  - name: BlendComponent
    parent: BlendBatch
    common_fields: true
    fields:
      - name: blend_batch_id
        type: string
        source: system
        description: "FK -> BlendBatch.id; path batch."
      - name: barrel_id
        type: string
        source: input
        description: "FK -> Barrel.id; component barrel. A barrel may appear at most once per batch."
      - name: drawn_volume_liters
        type: number
        source: input
        description: "Volume drawn from the barrel at commit."
        constraints: "> 0"

  - name: PrivateSelectionProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program name (single-barrel / private selection)."
      - name: spirit_type
        type: enum
        source: input
        description: "Only barrels of this spirit type are eligible."
        constraints: "one of BOURBON, RYE, TENNESSEE, SINGLE_MALT"
      - name: min_quality_score
        type: integer
        source: input
        description: "Eligibility floor on the barrel's latest QUALITY_SAMPLE quality_score; barrels with no QUALITY_SAMPLE are treated as score 0."
        constraints: "integer in [0, 100]"
      - name: required_barrel_count
        type: integer
        source: input
        description: "How many barrels the program must consume to lock."
        constraints: ">= 1"
      - name: reservation_window_days
        type: integer
        source: input
        description: "Reservation lifetime in days; expiry is a lazy auto-transition."
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: "SELECTION while consuming reservations; LOCKED when consumed count reaches required_barrel_count."
        constraints: "one of SELECTION, LOCKED"
      - name: available_slots
        type: integer
        source: computed
        description: "required_barrel_count - count(reservations in ACTIVE) - count(reservations in CONSUMED)."

  - name: BarrelReservation
    parent: PrivateSelectionProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: system
        description: "FK -> PrivateSelectionProgram.id; path program."
      - name: barrel_id
        type: string
        source: input
        description: "FK -> Barrel.id; the reserved barrel."
      - name: state
        type: enum
        source: computed
        description: "Reservation lifecycle."
        constraints: "one of ACTIVE, CONSUMED, RELEASED, EXPIRED"
      - name: expires_at
        type: datetime
        source: system
        description: "created_at + program.reservation_window_days; when the logical clock passes this, the reservation lazily becomes EXPIRED."

  - name: BondedPeriodReport
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: datetime
        source: input
        description: "Report period start (inclusive). Periods are half-open [period_start, period_end)."
      - name: period_end
        type: datetime
        source: input
        description: "Report period end (exclusive). Must be strictly after period_start and not overlap any other report whose state is not REJECTED."
      - name: opening_inventory_liters
        type: number
        source: computed
        description: "Sum over barrels with fill_date < period_start of ledger volume at period_start; per-barrel values rounded to 2dp half-up BEFORE summing."
      - name: period_fills_liters
        type: number
        source: computed
        description: "Sum of fill_volume_liters over barrels with fill_date in [period_start, period_end)."
      - name: period_withdrawals_liters
        type: number
        source: computed
        description: "Sum of withdrawn_volume_liters over barrels with withdrawn_at in [period_start, period_end)."
      - name: loss_actual_liters
        type: number
        source: computed
        description: "Angel-share loss per the actual (ledger) method; see calculations.report_period_loss_actual."
      - name: loss_statutory_liters
        type: number
        source: computed
        description: "Angel-share loss per the statutory (rate-table) method; see calculations.report_period_loss_statutory."
      - name: reported_loss_liters
        type: number
        source: computed
        description: "The loss figure reported to the tax authority; pinned equal to loss_actual_liters (the statutory figure is disclosed for comparison only)."
      - name: closing_inventory_liters
        type: number
        source: computed
        description: "opening_inventory_liters + period_fills_liters - period_withdrawals_liters - reported_loss_liters."
      - name: state
        type: enum
        source: computed
        description: "Report lifecycle with an amend loop (REJECTED -> AMENDED -> FILED)."
        constraints: "one of OPEN, RECONCILED, FILED, ACCEPTED, REJECTED, AMENDED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reconciler; recorded at reconcile."
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the filer; recorded at file. Segregation of duties: the accept/reject actor's X-User-ID must differ."
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the accepting/rejecting compliance officer."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CapacityExpansionProject
    initial_state: PROPOSED
    terminal_states: [COMMISSIONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /barrel-aging/expansion-projects/{id}/approve"
        actor: OperationsDirector
        preconditions:
          - "project.state == PROPOSED"
        side_effects:
          - "approved_at := current logical clock; project.version += 1"
          - "CASCADE link 1: create Rickhouse (posture=PLANNED) copying name, region_code, floors, rows_per_floor, positions_per_row; rickhouse.expansion_project_id := project.id"
      - from: APPROVED
        to: COMMISSIONED
        trigger: "POST /barrel-aging/expansion-projects/{id}/commission"
        actor: OperationsDirector
        preconditions:
          - "project.state == APPROVED"
          - "current logical clock >= approved_at + construction_lag_months * 30 days (else ERR_CONSTRUCTION_LAG_NOT_ELAPSED)"
        side_effects:
          - "commissioned_at := current logical clock; project.version += 1"
          - "CASCADE link 2: the project's Rickhouse transitions PLANNED -> OPERATING"
          - "CASCADE link 3: create floors * rows_per_floor * positions_per_row WarehouseSlots for that rickhouse, enumerated in (floor_index ASC, row_index ASC, position_index ASC) order, each with computed heat_factor"
          - "CASCADE link 4: rickhouse.occupied_slots := 0 and posture recomputed (remains OPERATING at 0 occupancy)"

  - entity: Rickhouse
    initial_state: PLANNED
    terminal_states: []
    note: "Posture-driven machine; all transitions are system-derived from project commissioning and slot occupancy. Posture gates barrel placement and rotation."
    transitions:
      - from: PLANNED
        to: OPERATING
        trigger: "system: parent CapacityExpansionProject commission cascade"
        actor: system
        preconditions:
          - "parent project transitioned APPROVED -> COMMISSIONED"
        side_effects:
          - "WarehouseSlots are materialized for this rickhouse (see project commission cascade)"
      - from: OPERATING
        to: FULL
        trigger: "system: posture recompute after a SlotOccupancy opens"
        actor: system
        preconditions:
          - "occupied_slots == total_slots (boundary: equality, i.e. >=, triggers FULL; total_slots - 1 remains OPERATING)"
        side_effects:
          - "posture := FULL; further placements/rotations into this rickhouse are rejected"
      - from: FULL
        to: OPERATING
        trigger: "system: posture recompute after a SlotOccupancy closes (rotation out or dump)"
        actor: system
        preconditions:
          - "occupied_slots < total_slots"
        side_effects:
          - "posture := OPERATING"

  - entity: Barrel
    dimension: maturation_status
    initial_state: FILLED
    terminal_states: [DUMPED]
    note: "Parallel state dimension 1 of 2; evolves independently of custody_status except for the withdrawal join gate."
    transitions:
      - from: FILLED
        to: AGING
        trigger: "system: same request as POST /barrel-aging/barrels (initial placement opens a SlotOccupancy)"
        actor: system
        preconditions:
          - "initial SlotOccupancy created OPEN on the requested slot"
        side_effects:
          - "maturation_status := AGING before the creation response is returned"
      - from: AGING
        to: MATURE_ELIGIBLE
        trigger: "system: lazy auto-transition when current logical clock >= fill_date + min_maturation_months * 30 days (evaluated on every clock-set and on every read of the barrel)"
        actor: system
        preconditions:
          - "current logical clock >= fill_date + min_maturation_months * 30 days"
        side_effects: []
      - from: AGING
        to: DUMPED
        trigger: "POST /barrel-aging/barrels/{id}/dump"
        actor: WarehouseManager
        preconditions:
          - "maturation_status in {AGING, MATURE_ELIGIBLE}"
          - "no BlendComponent of this barrel belongs to a COMMITTED BlendBatch (else ERR_BARREL_IN_COMMITTED_BLEND)"
        side_effects:
          - "CASCADE link 1: this barrel's OPEN SlotOccupancy (if any) closes: end_at := current clock, status := CLOSED; current_slot_id becomes null"
          - "CASCADE link 2: affected rickhouse.occupied_slots -= 1"
          - "CASCADE link 3: rickhouse posture recomputed (FULL -> OPERATING when occupancy drops below capacity)"
          - "barrel.version += 1"
      - from: MATURE_ELIGIBLE
        to: DUMPED
        trigger: "POST /barrel-aging/barrels/{id}/dump"
        actor: WarehouseManager
        preconditions:
          - "maturation_status in {AGING, MATURE_ELIGIBLE}"
          - "no BlendComponent of this barrel belongs to a COMMITTED BlendBatch (else ERR_BARREL_IN_COMMITTED_BLEND)"
        side_effects:
          - "CASCADE link 1: this barrel's OPEN SlotOccupancy (if any) closes: end_at := current clock, status := CLOSED; current_slot_id becomes null"
          - "CASCADE link 2: affected rickhouse.occupied_slots -= 1"
          - "CASCADE link 3: rickhouse posture recomputed (FULL -> OPERATING when occupancy drops below capacity)"
          - "barrel.version += 1"

  - entity: Barrel
    dimension: custody_status
    initial_state: BONDED
    terminal_states: [WITHDRAWN]
    note: "Parallel state dimension 2 of 2. The join gate: withdrawal requires maturation_status == DUMPED."
    transitions:
      - from: BONDED
        to: WITHDRAWN
        trigger: "POST /barrel-aging/barrels/{id}/withdraw"
        actor: WarehouseManager
        preconditions:
          - "maturation_status == DUMPED (join gate; else ERR_INVALID_STATE_TRANSITION)"
          - "custody_status == BONDED"
          - "EXISTS a BondedPeriodReport with state in {FILED, ACCEPTED} and period_start <= current clock <= period_end (else ERR_COVERING_REPORT_NOT_FILED)"
          - "no BarrelReservation on this barrel is in ACTIVE (else ERR_BARREL_RESERVED)"
        side_effects:
          - "withdrawn_at := current logical clock"
          - "withdrawn_volume_liters := current_volume_ledger_liters (frozen)"
          - "barrel.version += 1"

  - entity: SlotOccupancy
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: barrel rotation (a successor occupancy opens) or barrel dump"
        actor: system
        preconditions:
          - "occupancy.status == OPEN"
        side_effects:
          - "end_at := current logical clock; status := CLOSED"
          - "the slot's rickhouse.occupied_slots -= 1 and posture is recomputed"

  - entity: Label
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /barrel-aging/labels/{id}/activate"
        actor: MasterBlender
        preconditions:
          - "label.state == REGISTERED"
        side_effects:
          - "label.version += 1"

  - entity: BlendBatch
    initial_state: PROPOSED
    terminal_states: [COMMITTED, ABORTED]
    transitions:
      - from: PROPOSED
        to: VALIDATED
        trigger: "POST /barrel-aging/blend-batches/{id}/validate"
        actor: MasterBlender
        preconditions:
          - "batch.state == PROPOSED"
          - "at least one BlendComponent exists (else ERR_VALIDATION)"
          - "label.state == ACTIVE (cross-entity dependency; else ERR_LABEL_NOT_ACTIVE)"
          - "for every component: age_years(barrel, scheduled_bottling_date) >= label.age_statement_years (else ERR_AGE_STATEMENT_VIOLATION)"
          - "for every component: barrel.spirit_type == label.spirit_type (else ERR_VALIDATION)"
        side_effects:
          - "validated_at := current logical clock; batch.version += 1"
      - from: VALIDATED
        to: PROPOSED
        trigger: "POST /barrel-aging/blend-batches/{id}/revise"
        actor: MasterBlender
        preconditions:
          - "batch.state == VALIDATED"
        side_effects:
          - "batch.version += 1 (revision loop; components are retained and editable again)"
      - from: VALIDATED
        to: COMMITTED
        trigger: "POST /barrel-aging/blend-batches/{id}/commit"
        actor: MasterBlender
        preconditions:
          - "batch.state == VALIDATED"
          - "label.state == ACTIVE (re-checked at commit)"
          - "age statement re-checked for every component at scheduled_bottling_date (else ERR_AGE_STATEMENT_VIOLATION)"
          - "for every component: drawn_volume_liters <= barrel.current_volume_ledger_liters (else ERR_INSUFFICIENT_VOLUME)"
        side_effects:
          - "for every component: barrel.current_volume_ledger_liters -= drawn_volume_liters (a COMMIT_DRAW ledger event at committed_at) and barrel.version += 1"
          - "final_blend_volume_liters := sum(component drawn_volume_liters)"
          - "committed_at := current logical clock; batch.version += 1"
      - from: VALIDATED
        to: ABORTED
        trigger: "POST /barrel-aging/blend-batches/{id}/abort"
        actor: MasterBlender
        preconditions:
          - "batch.state in {VALIDATED, COMMITTED}"
        side_effects:
          - "batch.version += 1"
      - from: COMMITTED
        to: ABORTED
        trigger: "POST /barrel-aging/blend-batches/{id}/abort"
        actor: MasterBlender
        preconditions:
          - "batch.state in {VALIDATED, COMMITTED}"
        side_effects:
          - "COMPENSATION: for every component, barrel.current_volume_ledger_liters += drawn_volume_liters (an ABORT_RESTORE ledger event at the abort instant) and barrel.version += 1; compensating invariant: each barrel's ledger volume returns exactly to its pre-commit value"
          - "batch.version += 1"

  - entity: PrivateSelectionProgram
    initial_state: SELECTION
    terminal_states: [LOCKED]
    transitions:
      - from: SELECTION
        to: LOCKED
        trigger: "system: bubble-up when a reservation consume brings the CONSUMED count to required_barrel_count"
        actor: system
        preconditions:
          - "count(reservations in CONSUMED) == required_barrel_count"
        side_effects:
          - "program.state := LOCKED; program.version += 1; further reservations are rejected (state precondition)"

  - entity: BarrelReservation
    initial_state: ACTIVE
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /barrel-aging/reservations/{id}/consume"
        actor: ProgramDirector
        preconditions:
          - "reservation.state == ACTIVE (a reservation whose expires_at < current clock lazily transitions to EXPIRED first, so this precondition then fails with ERR_INVALID_STATE_TRANSITION)"
          - "barrel custody_status == BONDED and maturation_status == MATURE_ELIGIBLE and no COMMITTED blend component exists for the barrel (else ERR_BARREL_NOT_ELIGIBLE)"
        side_effects:
          - "program.available_slots recomputed"
          - "BUBBLE-UP: if count(CONSUMED reservations of program) == program.required_barrel_count, program transitions SELECTION -> LOCKED"
          - "reservation.version += 1; program.version += 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /barrel-aging/reservations/{id}/release"
        actor: ProgramDirector
        preconditions:
          - "reservation.state == ACTIVE"
        side_effects:
          - "COMPENSATION: program.available_slots increases by exactly 1 (compensating invariant: create-then-release leaves available_slots unchanged)"
          - "reservation.version += 1; program.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy auto-transition when current logical clock > expires_at (evaluated on every clock-set and on every read)"
        actor: system
        preconditions:
          - "reservation.state == ACTIVE and current clock > expires_at"
        side_effects:
          - "program.available_slots increases by exactly 1; program.version += 1"

  - entity: BondedPeriodReport
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /barrel-aging/bonded-reports/{id}/reconcile"
        actor: BondedPreparer
        preconditions:
          - "report.state == OPEN"
          - "current logical clock >= period_end (a period can only be reconciled after it closes; else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "compute opening_inventory_liters, period_fills_liters, period_withdrawals_liters, loss_actual_liters, loss_statutory_liters, reported_loss_liters, closing_inventory_liters per calculations"
          - "prepared_by_user_id := X-User-ID; report.version += 1"
      - from: RECONCILED
        to: FILED
        trigger: "POST /barrel-aging/bonded-reports/{id}/file"
        actor: BondedPreparer
        preconditions:
          - "report.state in {RECONCILED, AMENDED}"
        side_effects:
          - "filed_by_user_id := X-User-ID; report.version += 1"
      - from: AMENDED
        to: FILED
        trigger: "POST /barrel-aging/bonded-reports/{id}/file"
        actor: BondedPreparer
        preconditions:
          - "report.state in {RECONCILED, AMENDED}"
        side_effects:
          - "filed_by_user_id := X-User-ID; report.version += 1"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /barrel-aging/bonded-reports/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "report.state == FILED"
          - "X-User-ID != filed_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id := X-User-ID; report.version += 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /barrel-aging/bonded-reports/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "report.state == FILED"
          - "X-User-ID != filed_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id := X-User-ID; report.version += 1"
      - from: REJECTED
        to: AMENDED
        trigger: "POST /barrel-aging/bonded-reports/{id}/amend"
        actor: BondedPreparer
        preconditions:
          - "report.state == REJECTED"
        side_effects:
          - "report.version += 1 (amend loop; the report can then be re-filed)"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: blend-component-add-stale-batch
    parent_entity: BlendBatch
    write_endpoint: "POST /barrel-aging/blend-batches/{id}/components"
    occ_field: expected_blend_batch_version
    description: |
      Adding a BlendComponent to a BlendBatch whose version has advanced since
      the client last observed it is rejected. Each component add legitimately
      succeeds when re-read, so a stale expected_blend_batch_version is the only
      deterministic losing condition.
    error_id: ERR_STALE_BLEND_BATCH_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-program
    parent_entity: PrivateSelectionProgram
    write_endpoint: "POST /barrel-aging/private-selection-programs/{id}/reservations"
    occ_field: expected_program_version
    description: |
      Creating a BarrelReservation against a PrivateSelectionProgram whose
      version has advanced since the client last observed it is rejected, because
      available_slots may have changed under the client's view. Quota permitting,
      each creation legitimately succeeds when re-read.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: rotation-stale-barrel
    parent_entity: Barrel
    write_endpoint: "POST /barrel-aging/barrels/{id}/rotations"
    occ_field: expected_barrel_version
    description: |
      Rotating a Barrel whose version has advanced since the client last
      observed it is rejected. Sequential rotations each legitimately succeed
      when re-read, so the stale expected_barrel_version is the losing condition.
    error_id: ERR_STALE_BARREL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: barrel_volume_ledger
    trigger: "recomputed on every BarrelAssessment creation, every blend commit/abort touching the barrel, and on every read of the barrel"
    algorithm: chronological
    formula: |
      v = fill_volume_liters
      events = barrel's BarrelAssessments
               UNION (COMMIT_DRAW at batch.committed_at, magnitude drawn_volume_liters, for each BlendComponent of this barrel on a COMMITTED batch)
               UNION (ABORT_RESTORE at the abort instant, magnitude drawn_volume_liters, for each BlendComponent of this barrel on a batch that moved COMMITTED -> ABORTED)
      process events in order (event_time ASC, created_at ASC as tie-break):
        EVAPORATION_READING:  v = measured_volume_liters        (authoritative reset)
        QUALITY_SAMPLE:       v = v - sample_draw_liters
        COMMIT_DRAW:          v = v - drawn_volume_liters
        ABORT_RESTORE:        v = v + drawn_volume_liters
      after each event, v = max(v, 0) rounded to 2 decimal places, round_half_up
      current_volume_ledger_liters = v
    input_set: "all BarrelAssessments of the barrel (both kinds) plus commit/abort draw events of BlendComponents of this barrel on batches that are or were COMMITTED; barrels in any maturation/custody state are included"
    constants:
      DECIMAL_PLACES: 2
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up, applied after every event"
    variants:
      - name: ledger_variant
        when: "always; this is the volume of record for withdrawals, blends and loss reporting"
        difference: "replays actual recorded events; ignores rate tables entirely"

  - name: barrel_volume_statutory
    trigger: "recomputed on every read of the barrel at the current logical clock, and at BondedPeriodReport reconcile for statutory loss"
    algorithm: decay_function
    formula: |
      V = fill_volume_liters (full precision, no intermediate rounding)
      process fully elapsed 90-day blocks: block n covers [fill_date + 90n days, fill_date + 90(n+1) days);
      a block counts iff its END <= the evaluation instant t
      for each counted block, with block start s:
        season   = WINTER if month(s) in {12,1,2}; SPRING if {3,4,5}; SUMMER if {6,7,8}; AUTUMN if {9,10,11}
        age_y    = floor((s - fill_date).days / 365)
        age_mult = 1.2 if age_y < 2; 1.0 if 2 <= age_y < 6; 0.8 if age_y >= 6
        heat     = heat_factor of the barrel's CURRENT slot (the slot of the OPEN occupancy at evaluation time;
                   if the barrel has no OPEN occupancy, the heat_factor of the slot of its most recently CLOSED occupancy)
        r        = BASE_QUARTERLY_RATE * heat * SEASON_MULT[season] * age_mult
        if seasoning_months >= SEASONED_THRESHOLD: r = r * SEASONED_DISCOUNT
        r = min(r, RATE_CAP)
        V = V * (1 - r)
      current_volume_statutory_liters = round(max(V, 0), 2) half_up   (round ONCE at the end)
    input_set: "the single barrel; evaluation instant is the current logical clock (or a period boundary when used by report_period_loss_statutory)"
    constants:
      BASE_QUARTERLY_RATE: 0.01
      BLOCK_DAYS: 90
      YEAR_DAYS: 365
      HEAT_STEP: 0.05
      SEASON_MULT: { WINTER: 0.7, SPRING: 1.0, SUMMER: 1.5, AUTUMN: 1.0 }
      AGE_MULT_UNDER_2Y: 1.2
      AGE_MULT_2Y_TO_6Y: 1.0
      AGE_MULT_6Y_PLUS: 0.8
      SEASONED_THRESHOLD: 18
      SEASONED_DISCOUNT: 0.95
      RATE_CAP: 0.05
    precision: "full precision intermediate; final value rounded once to 2 decimal places, round_half_up"
    variants:
      - name: statutory_variant
        when: "bonded reporting comparison and what-if projection"
        difference: "rate-table projection by season/floor/age; ignores recorded assessments entirely, so it diverges from the ledger variant on identical data"

  - name: report_period_loss_actual
    trigger: "POST /barrel-aging/bonded-reports/{id}/reconcile"
    algorithm: aggregation
    formula: |
      ledger_at(b, t) = barrel_volume_ledger replay of barrel b using only events with event_time < t
      for each barrel b whose bonded presence overlaps [period_start, period_end)
      (i.e. fill_date < period_end AND (withdrawn_at is null OR withdrawn_at > period_start)):
        s = max(period_start, b.fill_date)
        e = min(period_end, b.withdrawn_at) if withdrawn else period_end
        draws_in_period = sum of sample_draw_liters of QUALITY_SAMPLEs with assessed_at in [s, e)
                          + sum of drawn_volume_liters of COMMIT_DRAW/ABORT_RESTORE net with event_time in [s, e)
        loss_b = max(0, ledger_at(b, s) - ledger_at(b, e) - draws_in_period)
        rounded_b = round(loss_b, 2) half_up          <-- ROUND PER BARREL FIRST (pinned order)
      loss_actual_liters = sum(rounded_b)
    input_set: "barrels bonded at any time overlapping the half-open period; events strictly ordered by (event_time, created_at)"
    constants:
      DECIMAL_PLACES: 2
      ROUNDING: round_half_up
      ROUNDING_ORDER: per_barrel_then_sum
    precision: "2 decimal places, round_half_up, applied per barrel BEFORE the final sum (round-then-sum); sum-then-round is a rejected alternative and yields different cents"

  - name: report_period_loss_statutory
    trigger: "POST /barrel-aging/bonded-reports/{id}/reconcile"
    algorithm: aggregation
    formula: |
      V_stat(b, t) = barrel_volume_statutory evaluated for barrel b at instant t
      for each barrel b in the same input set as report_period_loss_actual:
        s = max(period_start, b.fill_date)
        e = min(period_end, b.withdrawn_at) if withdrawn else period_end
        loss_b = max(0, V_stat(b, s) - V_stat(b, e))
        rounded_b = round(loss_b, 2) half_up          <-- same pinned round-then-sum order
      loss_statutory_liters = sum(rounded_b)
    input_set: "identical barrel set to report_period_loss_actual"
    constants:
      DECIMAL_PLACES: 2
      ROUNDING: round_half_up
      ROUNDING_ORDER: per_barrel_then_sum
    precision: "2 decimal places, round_half_up, per barrel before summing"
    variants:
      - name: statutory_report_variant
        when: "disclosed alongside the actual loss on every reconciled report"
        difference: "uses the rate-table projection instead of recorded readings; for identical barrels the two report loss figures differ"

  - name: age_years_at_date
    trigger: "blend validate and commit (per component), and anywhere an age statement must be checked"
    algorithm: threshold
    formula: |
      age_years(barrel, d) = floor((d - barrel.fill_date).days / 365)
      blend rule: min over components of age_years(component.barrel, scheduled_bottling_date) >= label.age_statement_years
      boundary: a component whose age at bottling is EXACTLY label.age_statement_years satisfies the obligation (>=, inclusive)
    input_set: "all BlendComponents of the batch"
    constants:
      YEAR_DAYS: 365
    precision: "integer years, floor"

  - name: rickhouse_posture
    trigger: "recomputed after any SlotOccupancy opens or closes, and on project commission"
    algorithm: aggregation
    formula: |
      occupied_slots = count of WarehouseSlots s with s.rickhouse_id == rickhouse.id
                       AND EXISTS SlotOccupancy o with o.slot_id == s.id AND o.status == OPEN
      if parent project not commissioned: posture = PLANNED
      elif occupied_slots == total_slots: posture = FULL      (boundary: equality, i.e. occupied >= total)
      else: posture = OPERATING                                (occupied == total - 1 stays OPERATING)
    input_set: "all WarehouseSlots of the rickhouse and their OPEN occupancies"
    constants: {}
    precision: "integer counts"

  - name: program_eligibility_ranking
    trigger: "GET /barrel-aging/private-selection-programs/{id}/eligible-barrels"
    algorithm: selector_ranking
    formula: |
      latest_quality_score(b) = quality_score of b's QUALITY_SAMPLE with the greatest assessed_at
                                (tie-break created_at ASC); 0 if the barrel has no QUALITY_SAMPLE
      candidates = barrels b where
        b.custody_status == BONDED
        AND b.maturation_status == MATURE_ELIGIBLE
        AND b.spirit_type == program.spirit_type
        AND NOT EXISTS BarrelReservation r with r.barrel_id == b.id AND r.state in {ACTIVE, CONSUMED}
        AND NOT EXISTS BlendComponent c with c.barrel_id == b.id on a BlendBatch in COMMITTED
        AND latest_quality_score(b) >= program.min_quality_score
      ranking: latest_quality_score DESC, then fill_date ASC, then created_at ASC
      empty candidate set: the endpoint returns 200 with an empty array (NOT an error)
    input_set: "all barrels; program fields spirit_type and min_quality_score"
    constants: {}
    precision: "integer scores; ordering total via the pinned tie-break chain"

  - name: program_available_slots
    trigger: "recomputed on reservation create/consume/release/expire and on every program read"
    algorithm: aggregation
    formula: |
      available_slots = required_barrel_count
                        - count(BarrelReservation of program with state == ACTIVE)
                        - count(BarrelReservation of program with state == CONSUMED)
    input_set: "all reservations of the program"
    constants: {}
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "payload shape: all required input fields present; no undeclared fields; types match; enum values valid; numeric ranges honored (char_level in [1,4], drawn_volume_liters > 0, period_start < period_end, scheduled_bottling_date strictly after current clock, limit in [1,100]); kind-conditional inputs present (EVAPORATION_READING requires measured_volume_liters, QUALITY_SAMPLE requires sample_draw_liters)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
    note: "Runs before resource-existence checks: a malformed body on a non-existent resource still returns ERR_VALIDATION."
  - priority: 4
    category: existence
    check: "every path id and every body-supplied id (slot_id, to_slot_id, label_id, barrel_id) resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version in the request body equals the parent entity's current version"
    error_id: ERR_STALE_BLEND_BATCH_VERSION | ERR_STALE_PROGRAM_VERSION | ERR_STALE_BARREL_VERSION
    http_status: 412
    applies_to: "POST /barrel-aging/blend-batches/{id}/components; POST /barrel-aging/private-selection-programs/{id}/reservations; POST /barrel-aging/barrels/{id}/rotations"
  - priority: 6
    category: state
    check: "state-machine preconditions: target entity is in a valid from-state for the requested transition (checked first); then cross-entity state gates phrased as readiness (rickhouse posture OPERATING for placement/rotation; construction lag elapsed for commission; period closed for reconcile; blend label ACTIVE for validate/commit)"
    error_id: ERR_INVALID_STATE_TRANSITION | ERR_RICKHOUSE_NOT_OPERATING | ERR_CONSTRUCTION_LAG_NOT_ELAPSED | ERR_LABEL_NOT_ACTIVE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "compliance: age-statement obligation holds for every component at scheduled_bottling_date; a covering BondedPeriodReport (state FILED or ACCEPTED, period covering now) exists before withdrawal; report periods do not overlap an existing non-REJECTED report; segregation of duties: accept/reject actor's X-User-ID differs from filed_by_user_id"
    error_id: ERR_AGE_STATEMENT_VIOLATION | ERR_COVERING_REPORT_NOT_FILED | ERR_REPORT_PERIOD_OVERLAP | ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "blend validate/commit; barrel withdraw; report create; report accept/reject"
    note: "ERR_AGE_STATEMENT_VIOLATION is 422; ERR_COVERING_REPORT_NOT_FILED and ERR_REPORT_PERIOD_OVERLAP are 409; ERR_SEGREGATION_OF_DUTIES is 403."
  - priority: 8
    category: business_constraint
    check: "capacity/conflict: slot has no overlapping OPEN occupancy (half-open intervals, adjacency allowed); QUALITY_SAMPLE respects the 30-day buffer after the previous QUALITY_SAMPLE on the same barrel; program available_slots > 0 before reservation (checked BEFORE barrel eligibility within this priority); barrel passes program eligibility; barrel not already a component of this batch; clock-set is non-decreasing"
    error_id: ERR_SLOT_OCCUPANCY_OVERLAP | ERR_SAMPLE_BUFFER_VIOLATION | ERR_RESERVATION_QUOTA_EXHAUSTED | ERR_BARREL_NOT_ELIGIBLE | ERR_DUPLICATE_BLEND_COMPONENT | ERR_CLOCK_REGRESSION
    http_status: 409
    applies_to: "barrel create; rotations; assessments; reservations; components; clock-set"
    note: "ERR_BARREL_NOT_ELIGIBLE and ERR_CLOCK_REGRESSION are 422; the rest are 409."
  - priority: 9
    category: business_referential
    check: "referential integrity on destructive/custody actions: no ACTIVE reservation on the barrel before withdrawal; no COMMITTED blend component on the barrel before dump"
    error_id: ERR_BARREL_RESERVED | ERR_BARREL_IN_COMMITTED_BLEND
    http_status: 409
    applies_to: "barrel withdraw; barrel dump"
  - priority: 10
    category: business_fiscal
    check: "volume sufficiency: drawn_volume_liters <= barrel.current_volume_ledger_liters at component add AND re-checked at commit; EVAPORATION_READING measured_volume_liters <= current ledger volume"
    error_id: ERR_INSUFFICIENT_VOLUME | ERR_ASSESSMENT_VOLUME_INCONSISTENT
    http_status: 422
    applies_to: "components add; blend commit; assessments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Capacity expansion ---------------------------------------------------
  - method: POST
    path: /barrel-aging/expansion-projects
    description: "Propose a capacity expansion project (multi-year lag before salable capacity)."
    roles: [DistilleryPlanner]
    code: 201
    input: [name, region_code, floors, rows_per_floor, positions_per_row, construction_lag_months, planned_annual_distillation_liters]
    output: CapacityExpansionProject
    side_effects: ["project created in PROPOSED"]
  - method: GET
    path: /barrel-aging/expansion-projects/{id}
    description: "Read one expansion project."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CapacityExpansionProject
    side_effects: []
  - method: POST
    path: /barrel-aging/expansion-projects/{id}/approve
    description: "Approve a proposed project; cascades creation of its PLANNED rickhouse."
    roles: [OperationsDirector]
    code: 200
    input: []
    output: CapacityExpansionProject
    side_effects: ["state PROPOSED -> APPROVED", "cascade creates Rickhouse (PLANNED)", "increments CapacityExpansionProject.version by 1"]
  - method: POST
    path: /barrel-aging/expansion-projects/{id}/commission
    description: "Commission an approved project once the construction lag has fully elapsed; cascades rickhouse activation and slot materialization."
    roles: [OperationsDirector]
    code: 200
    input: []
    output: CapacityExpansionProject
    side_effects: ["state APPROVED -> COMMISSIONED", "rickhouse PLANNED -> OPERATING", "creates floors*rows*positions WarehouseSlots", "increments CapacityExpansionProject.version by 1"]

  # --- Rickhouses / slots ---------------------------------------------------
  - method: GET
    path: /barrel-aging/rickhouses/{id}
    description: "Read one rickhouse including computed occupied_slots and posture."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Rickhouse
    side_effects: []
  - method: GET
    path: /barrel-aging/rickhouses
    description: "List rickhouses; optional filters."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["expansion_project_id?", "posture?", "limit?", "offset?"]
    output: Rickhouse[]
    side_effects: []
  - method: GET
    path: /barrel-aging/rickhouses/{id}/slots
    description: "List the rickhouse's slots in deterministic (floor_index ASC, row_index ASC, position_index ASC) order."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WarehouseSlot[]
    side_effects: []
  - method: GET
    path: /barrel-aging/warehouse-slots/{id}
    description: "Read one warehouse slot including computed heat_factor."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: WarehouseSlot
    side_effects: []
  - method: GET
    path: /barrel-aging/warehouse-slots/{id}/occupancies
    description: "List occupancies of a slot, ordered by start_at ASC."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SlotOccupancy[]
    side_effects: []

  # --- Barrels --------------------------------------------------------------
  - method: POST
    path: /barrel-aging/barrels
    description: "Fill a new barrel and place it into a slot (initial occupancy). Barrel starts BONDED; maturation FILLED -> AGING within the same request."
    roles: [WarehouseManager]
    code: 201
    input: [slot_id, wood_origin, seasoning_months, char_level, spirit_type, fill_proof, fill_volume_liters, min_maturation_months]
    output: Barrel
    side_effects: ["creates SlotOccupancy OPEN with move_reason INITIAL_FILL", "maturation FILLED -> AGING", "rickhouse.occupied_slots += 1 and posture recomputed (may flip to FULL)"]
  - method: GET
    path: /barrel-aging/barrels/{id}
    description: "Read one barrel including both computed volume variants."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Barrel
    side_effects: []
  - method: GET
    path: /barrel-aging/barrels
    description: "List barrels; optional filters."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["maturation_status?", "custody_status?", "spirit_type?", "limit?", "offset?"]
    output: Barrel[]
    side_effects: []
  - method: GET
    path: /barrel-aging/barrels/{id}/occupancies
    description: "List the barrel's occupancy history, ordered by start_at ASC."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SlotOccupancy[]
    side_effects: []
  - method: GET
    path: /barrel-aging/barrels/{id}/blend-components
    description: "List blend components referencing this barrel."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BlendComponent[]
    side_effects: []
  - method: GET
    path: /barrel-aging/barrels/{id}/reservations
    description: "List reservations referencing this barrel."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: BarrelReservation[]
    side_effects: []
  - method: GET
    path: /barrel-aging/barrels/{id}/assessments
    description: "List the barrel's assessments, ordered by assessed_at ASC."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: BarrelAssessment[]
    side_effects: []
  - method: POST
    path: /barrel-aging/barrels/{id}/assessments
    description: "Record an evaporation reading or a quality sample against a barrel."
    roles: [WarehouseManager]
    code: 201
    input: [kind, "measured_volume_liters?", "sample_draw_liters?", "quality_score?"]
    output: BarrelAssessment
    side_effects: ["EVAPORATION_READING: ledger volume set to measured_volume_liters", "QUALITY_SAMPLE: ledger volume reduced by sample_draw_liters; 30-day buffer enforced since the barrel's previous QUALITY_SAMPLE", "increments Barrel.version by 1"]
  - method: POST
    path: /barrel-aging/barrels/{id}/rotations
    description: "Rotate a barrel to a different slot (closes the current OPEN occupancy, opens a new one). OCC-guarded."
    roles: [WarehouseManager]
    code: 200
    input: [to_slot_id, expected_barrel_version]
    output: Barrel
    side_effects: ["closes current OPEN SlotOccupancy (end_at := now)", "opens new SlotOccupancy with move_reason ROTATION", "posture recompute on source and destination rickhouses", "increments Barrel.version by 1"]
  - method: POST
    path: /barrel-aging/barrels/{id}/dump
    description: "Dump a barrel (empty it for bottling); closes its occupancy and frees the slot."
    roles: [WarehouseManager]
    code: 200
    input: []
    output: Barrel
    side_effects: ["maturation -> DUMPED", "closes OPEN occupancy", "rickhouse.occupied_slots -= 1 and posture recomputed (FULL -> OPERATING when applicable)", "increments Barrel.version by 1"]
  - method: POST
    path: /barrel-aging/barrels/{id}/withdraw
    description: "Withdraw a dumped barrel from bond (tax determination at withdrawal)."
    roles: [WarehouseManager]
    code: 200
    input: []
    output: Barrel
    side_effects: ["custody BONDED -> WITHDRAWN", "withdrawn_at and withdrawn_volume_liters frozen", "increments Barrel.version by 1"]

  # --- Labels ---------------------------------------------------------------
  - method: POST
    path: /barrel-aging/labels
    description: "Register a label with its immutable age statement."
    roles: [MasterBlender]
    code: 201
    input: [name, age_statement_years, spirit_type]
    output: Label
    side_effects: ["label created in REGISTERED"]
  - method: GET
    path: /barrel-aging/labels/{id}
    description: "Read one label."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Label
    side_effects: []
  - method: POST
    path: /barrel-aging/labels/{id}/activate
    description: "Activate a registered label; only ACTIVE labels may be blended."
    roles: [MasterBlender]
    code: 200
    input: []
    output: Label
    side_effects: ["state REGISTERED -> ACTIVE", "increments Label.version by 1"]

  # --- Blend batches --------------------------------------------------------
  - method: POST
    path: /barrel-aging/blend-batches
    description: "Propose a blend batch under a label."
    roles: [MasterBlender]
    code: 201
    input: [label_id, scheduled_bottling_date]
    output: BlendBatch
    side_effects: ["batch created in PROPOSED"]
  - method: GET
    path: /barrel-aging/blend-batches/{id}
    description: "Read one blend batch."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BlendBatch
    side_effects: []
  - method: GET
    path: /barrel-aging/blend-batches
    description: "List blend batches; optional filters."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["label_id?", "state?", "limit?", "offset?"]
    output: BlendBatch[]
    side_effects: []
  - method: POST
    path: /barrel-aging/blend-batches/{id}/components
    description: "Add a component barrel draw to a PROPOSED batch. OCC-guarded."
    roles: [MasterBlender]
    code: 201
    input: [barrel_id, drawn_volume_liters, expected_blend_batch_version]
    output: BlendComponent
    side_effects: ["component created", "increments BlendBatch.version by 1"]
  - method: GET
    path: /barrel-aging/blend-batches/{id}/components
    description: "List a batch's components, ordered by created_at ASC."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BlendComponent[]
    side_effects: []
  - method: POST
    path: /barrel-aging/blend-batches/{id}/validate
    description: "Validate a proposed batch: label must be ACTIVE and every component must satisfy the age statement at the scheduled bottling date."
    roles: [MasterBlender]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["state PROPOSED -> VALIDATED", "increments BlendBatch.version by 1"]
  - method: POST
    path: /barrel-aging/blend-batches/{id}/revise
    description: "Send a validated batch back to PROPOSED for revision (revision loop)."
    roles: [MasterBlender]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["state VALIDATED -> PROPOSED", "increments BlendBatch.version by 1"]
  - method: POST
    path: /barrel-aging/blend-batches/{id}/commit
    description: "Commit a validated batch: re-checks label state, age statement, and per-barrel volume; deducts drawn volumes from component barrels."
    roles: [MasterBlender]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["state VALIDATED -> COMMITTED", "deducts drawn_volume_liters from each component barrel's ledger volume", "freezes final_blend_volume_liters", "increments BlendBatch.version by 1 and each component Barrel.version by 1"]
  - method: POST
    path: /barrel-aging/blend-batches/{id}/abort
    description: "Abort a validated or committed batch; aborting a COMMITTED batch restores every component's drawn volume exactly."
    roles: [MasterBlender]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["state -> ABORTED", "compensates drawn volumes when aborting from COMMITTED", "increments BlendBatch.version by 1"]

  # --- Private selection ----------------------------------------------------
  - method: POST
    path: /barrel-aging/private-selection-programs
    description: "Open a single-barrel / private selection program."
    roles: [ProgramDirector]
    code: 201
    input: [name, spirit_type, min_quality_score, required_barrel_count, reservation_window_days]
    output: PrivateSelectionProgram
    side_effects: ["program created in SELECTION"]
  - method: GET
    path: /barrel-aging/private-selection-programs/{id}
    description: "Read one program including computed available_slots."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PrivateSelectionProgram
    side_effects: []
  - method: GET
    path: /barrel-aging/private-selection-programs/{id}/eligible-barrels
    description: "Selector read: ranked eligible barrels per calculations.program_eligibility_ranking; empty pool returns 200 with []."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Barrel[]
    side_effects: []
  - method: POST
    path: /barrel-aging/private-selection-programs/{id}/reservations
    description: "Reserve a specific barrel into a program. OCC-guarded on the program version."
    roles: [ProgramDirector]
    code: 201
    input: [barrel_id, expected_program_version]
    output: BarrelReservation
    side_effects: ["reservation created ACTIVE with expires_at = now + reservation_window_days", "program.available_slots -= 1", "increments PrivateSelectionProgram.version by 1"]
  - method: GET
    path: /barrel-aging/private-selection-programs/{id}/reservations
    description: "List a program's reservations."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: BarrelReservation[]
    side_effects: []
  - method: POST
    path: /barrel-aging/reservations/{id}/consume
    description: "Consume an active reservation (customer commits to the barrel); may bubble-lock the program."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: BarrelReservation
    side_effects: ["state ACTIVE -> CONSUMED", "if consumed count == required_barrel_count, program SELECTION -> LOCKED", "increments BarrelReservation.version and PrivateSelectionProgram.version by 1"]
  - method: POST
    path: /barrel-aging/reservations/{id}/release
    description: "Release an active reservation; compensates the program's available_slots."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: BarrelReservation
    side_effects: ["state ACTIVE -> RELEASED", "program.available_slots += 1", "increments BarrelReservation.version and PrivateSelectionProgram.version by 1"]

  # --- Bonded period reports --------------------------------------------------
  - method: POST
    path: /barrel-aging/bonded-reports
    description: "Open a bonded-period report; periods are half-open and must not overlap any non-REJECTED report."
    roles: [BondedPreparer]
    code: 201
    input: [period_start, period_end]
    output: BondedPeriodReport
    side_effects: ["report created in OPEN"]
  - method: GET
    path: /barrel-aging/bonded-reports/{id}
    description: "Read one report."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BondedPeriodReport
    side_effects: []
  - method: GET
    path: /barrel-aging/bonded-reports
    description: "List reports; optional state filter."
    roles: [DistilleryPlanner, OperationsDirector, WarehouseManager, MasterBlender, ProgramDirector, BondedPreparer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: BondedPeriodReport[]
    side_effects: []
  - method: POST
    path: /barrel-aging/bonded-reports/{id}/reconcile
    description: "Reconcile an OPEN report: computes opening inventory, fills, withdrawals, and both loss variants."
    roles: [BondedPreparer]
    code: 200
    input: []
    output: BondedPeriodReport
    side_effects: ["runs calculations report_period_loss_actual and report_period_loss_statutory", "state OPEN -> RECONCILED", "records prepared_by_user_id", "increments BondedPeriodReport.version by 1"]
  - method: POST
    path: /barrel-aging/bonded-reports/{id}/file
    description: "File a reconciled (or amended) report with the tax authority."
    roles: [BondedPreparer]
    code: 200
    input: []
    output: BondedPeriodReport
    side_effects: ["state RECONCILED|AMENDED -> FILED", "records filed_by_user_id", "increments BondedPeriodReport.version by 1"]
  - method: POST
    path: /barrel-aging/bonded-reports/{id}/accept
    description: "Accept a filed report; the acceptor must not be the filer (segregation of duties)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BondedPeriodReport
    side_effects: ["state FILED -> ACCEPTED", "records decided_by_user_id", "increments BondedPeriodReport.version by 1"]
  - method: POST
    path: /barrel-aging/bonded-reports/{id}/reject
    description: "Reject a filed report; the rejector must not be the filer (segregation of duties)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BondedPeriodReport
    side_effects: ["state FILED -> REJECTED", "records decided_by_user_id", "increments BondedPeriodReport.version by 1"]
  - method: POST
    path: /barrel-aging/bonded-reports/{id}/amend
    description: "Amend a rejected report, returning it to a re-fileable state (amend loop)."
    roles: [BondedPreparer]
    code: 200
    input: []
    output: BondedPeriodReport
    side_effects: ["state REJECTED -> AMENDED", "increments BondedPeriodReport.version by 1"]

  # --- Test-driving logical clock --------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock (monotonic non-decreasing; setting it backwards returns ERR_CLOCK_REGRESSION). The server startup default before any call is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Every set re-evaluates lazy auto-transitions (maturation eligibility, reservation expiry, posture recompute)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["advances the logical clock", "re-evaluates lazy auto-transitions"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not in the endpoint's roles list."
  - id: ERR_VALIDATION
    http: 400
    condition: "Required field missing, undeclared field present, type/enum/range violation, period_start >= period_end, scheduled_bottling_date not in the future, or kind-conditional assessment input missing."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body-supplied id does not resolve to an existing entity."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target entity's current state does not permit the requested transition (includes terminal-state lockdown and the withdraw-before-dump join gate)."
  - id: ERR_RICKHOUSE_NOT_OPERATING
    http: 409
    condition: "Placement or rotation targets a slot whose rickhouse posture is not OPERATING (PLANNED or FULL)."
  - id: ERR_CONSTRUCTION_LAG_NOT_ELAPSED
    http: 409
    condition: "Commission attempted before approved_at + construction_lag_months * 30 days."
  - id: ERR_STALE_BLEND_BATCH_VERSION
    http: 412
    condition: "expected_blend_batch_version does not equal the batch's current version."
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the program's current version."
  - id: ERR_STALE_BARREL_VERSION
    http: 412
    condition: "expected_barrel_version does not equal the barrel's current version."
  - id: ERR_LABEL_NOT_ACTIVE
    http: 409
    condition: "Blend validate or commit attempted while the batch's label is not ACTIVE (cross-entity state gate; checked before the age-statement compliance rule)."
  - id: ERR_AGE_STATEMENT_VIOLATION
    http: 422
    condition: "A component barrel's age at scheduled_bottling_date is below the label's age_statement_years (checked at validate and re-checked at commit)."
  - id: ERR_COVERING_REPORT_NOT_FILED
    http: 409
    condition: "Withdrawal attempted while no BondedPeriodReport in state FILED or ACCEPTED covers the current logical clock (period_start <= now <= period_end)."
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "Report period [period_start, period_end) overlaps an existing report whose state is not REJECTED; adjacency (period_start == other period_end) is allowed."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Report accept/reject attempted by the same X-User-ID recorded as filed_by_user_id."
  - id: ERR_SLOT_OCCUPANCY_OVERLAP
    http: 409
    condition: "Placement or rotation would create an occupancy on a slot whose existing OPEN occupancy overlaps the half-open interval [start_at, end_at); adjacency (new start == old end) is allowed."
  - id: ERR_SAMPLE_BUFFER_VIOLATION
    http: 409
    condition: "A QUALITY_SAMPLE is recorded fewer than 30 days after the same barrel's previous QUALITY_SAMPLE (boundary: exactly 30 days is allowed)."
  - id: ERR_RESERVATION_QUOTA_EXHAUSTED
    http: 409
    condition: "Reservation attempted while program.available_slots == 0 (checked before barrel eligibility)."
  - id: ERR_BARREL_NOT_ELIGIBLE
    http: 422
    condition: "Reservation/consume names a barrel failing the eligibility predicate (custody, maturation, spirit type, quality score, no active reservation, no committed component)."
  - id: ERR_DUPLICATE_BLEND_COMPONENT
    http: 409
    condition: "The same barrel is added twice to one blend batch."
  - id: ERR_BARREL_RESERVED
    http: 409
    condition: "Withdrawal attempted while an ACTIVE BarrelReservation references the barrel."
  - id: ERR_BARREL_IN_COMMITTED_BLEND
    http: 409
    condition: "Dump attempted while a BlendComponent of the barrel belongs to a COMMITTED batch."
  - id: ERR_INSUFFICIENT_VOLUME
    http: 422
    condition: "drawn_volume_liters exceeds the barrel's current ledger volume at component add or at commit re-check."
  - id: ERR_ASSESSMENT_VOLUME_INCONSISTENT
    http: 422
    condition: "EVAPORATION_READING measured_volume_liters exceeds the barrel's current ledger volume."
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "Clock-set attempted with to_iso8601 earlier than the current logical clock."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistilleryPlanner
    description: "Plans distillation volume and proposes capacity expansion years ahead of demand."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/expansion-projects"]
    shared_operations: ["all GET endpoints"]
  - name: OperationsDirector
    description: "Approves and commissions capacity expansion projects."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/expansion-projects/{id}/approve", "POST /barrel-aging/expansion-projects/{id}/commission"]
    shared_operations: ["all GET endpoints"]
  - name: WarehouseManager
    description: "Runs cooperage output intake, barrel placement, rotation, sampling, dumping and withdrawal."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/barrels", "POST /barrel-aging/barrels/{id}/assessments", "POST /barrel-aging/barrels/{id}/rotations", "POST /barrel-aging/barrels/{id}/dump", "POST /barrel-aging/barrels/{id}/withdraw"]
    shared_operations: ["all GET endpoints"]
  - name: MasterBlender
    description: "Owns labels and blend batches."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/labels", "POST /barrel-aging/labels/{id}/activate", "POST /barrel-aging/blend-batches", "POST /barrel-aging/blend-batches/{id}/components", "POST /barrel-aging/blend-batches/{id}/validate", "POST /barrel-aging/blend-batches/{id}/revise", "POST /barrel-aging/blend-batches/{id}/commit", "POST /barrel-aging/blend-batches/{id}/abort"]
    shared_operations: ["all GET endpoints"]
  - name: ProgramDirector
    description: "Runs single-barrel and private selection programs on behalf of customers."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/private-selection-programs", "POST /barrel-aging/private-selection-programs/{id}/reservations", "POST /barrel-aging/reservations/{id}/consume", "POST /barrel-aging/reservations/{id}/release"]
    shared_operations: ["all GET endpoints"]
  - name: BondedPreparer
    description: "Prepares, reconciles, files and amends bonded-period reports. Segregated from acceptance."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/bonded-reports", "POST /barrel-aging/bonded-reports/{id}/reconcile", "POST /barrel-aging/bonded-reports/{id}/file", "POST /barrel-aging/bonded-reports/{id}/amend"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Accepts or rejects filed reports; must not be the filer (segregation of duties enforced via X-User-ID)."
    identity: opaque
    exclusive_operations: ["POST /barrel-aging/bonded-reports/{id}/accept", "POST /barrel-aging/bonded-reports/{id}/reject"]
    shared_operations: ["all GET endpoints"]
  - name: PlatformAdmin
    description: "Operates the logical clock and platform utilities."
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
