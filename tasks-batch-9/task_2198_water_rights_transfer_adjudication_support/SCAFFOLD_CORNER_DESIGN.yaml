          trigger:
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr2}", hcu_study_id: "${st1}", application_type: CHANGE_OF_USE, requested_af: 50.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr1}", hcu_study_id: "${st1}", application_type: CHANGE_OF_USE, requested_af: 50.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app_ok: "$.data.id"}}
          assert:
            - "Cross-wired body: HTTP 422 with error_id ERR_STUDY_RIGHT_MISMATCH."
