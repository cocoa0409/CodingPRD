scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: kinship_estimated_vs_confirmed_on_relative_match
        grounds:
          - calculations.relative_kinship_pct
          - state_machines.RelativeMatch.ESTIMATED_to_CONFIRMED
          - entities.RelativeMatch.fields.relationship_pct
        distinguishing_aspect: |
          On the RelativeMatch entity, the ESTIMATED variant uses raw shared_cm
          (600 -> 24.00%) while the CONFIRMED variant applies PHASE_FACTOR 0.98
          (600 -> 23.52%); identical shared_cm yields a strictly lower confirmed pct.
        test_recipe:
          setup:
            - "Account A with two opted-in pets, each having a FINALIZED report."
            - "A RelativeMatch (ESTIMATED) created between them with shared_cm=600 (relationship_pct=24.00)."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "a@x.com", full_name: "A", relative_finder_opt_in: true }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/marker-catalog"
              payload: { marker_code: "MDR1", category: "HEALTH", species: "DOG" }
              as: PlatformAdmin
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P1", species: "DOG", birth_year: 2022, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p1: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P2", species: "DOG", birth_year: 2021, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p2: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k1: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k2: $.data.id }
            - call: "POST /dna/kits/${k1}/activate"
              payload: { pet_id: "${p1}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/kits/${k2}/activate"
              payload: { pet_id: "${p2}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${k1}" }
              as: LabTechnician
              captures: { s1: $.data.id }
            - call: "POST /dna/samples"
              payload: { kit_id: "${k2}" }
              as: LabTechnician
              captures: { s2: $.data.id }
            - call: "POST /dna/samples/${s1}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "POST /dna/samples/${s2}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "POODLE", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${s1}"
              payload: {}
              as: LabTechnician
              captures: { r1: "$.data[0].id", r1v: "$.data[0].version" }
            - call: "GET /dna/reports?sample_id=${s2}"
              payload: {}
              as: LabTechnician
              captures: { r2: "$.data[0].id", r2v: "$.data[0].version" }
            - call: "POST /dna/reports/${r1}/finalize"
              payload: { expected_report_version: "${r1v}" }
              as: LabTechnician
            - call: "POST /dna/reports/${r2}/finalize"
              payload: { expected_report_version: "${r2v}" }
              as: LabTechnician
            - call: "POST /dna/relative-matches"
              payload: { pet_id: "${p1}", relative_pet_id: "${p2}", shared_cm: 600 }
              as: LabTechnician
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /dna/relative-matches/${m1}/confirm"
              payload: {}
              as: LabTechnician
              captures: { conf_pct: $.data.relationship_pct }
          assert:
            - "RelativeMatch.${m1}.relationship_pct == 24.00 before confirm (ESTIMATED variant)"
            - "RelativeMatch.${m1}.relationship_pct == 23.52 after confirm (CONFIRMED variant)"
            - "RelativeMatch.${m1}.status == CONFIRMED"

      - name: health_rollup_preliminary_vs_finalized_on_report
        grounds:
          - calculations.report_health_risk_rollup
          - state_machines.Report.PRELIMINARY_to_FINALIZED
          - entities.Report.fields.at_risk_marker_count
        distinguishing_aspect: |
          On the Report entity, the PRELIMINARY variant counts only AT_RISK markers
          with review_status PASS (1), while the FINALIZED variant additionally
          counts AT_RISK markers with review_status REVIEWED (2) — same marker data,
          different count after finalize.
        test_recipe:
          setup:
            - "A BREED_HEALTH kit's sample reached PASS, producing a PRELIMINARY report."
            - "Two AT_RISK markers attached: one review_status PASS, one REVIEWED."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "b@x.com", full_name: "B" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "H", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED_HEALTH" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "BEAGLE", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${samp}"
              payload: {}
              as: LabTechnician
              captures: { rep: "$.data[0].id" }
            - call: "POST /dna/reports/${rep}/markers"
              payload: { marker_code: "M_A", genotype: "AT_RISK", review_status: "PASS" }
              as: LabTechnician
            - call: "POST /dna/reports/${rep}/markers"
              payload: { marker_code: "M_B", genotype: "AT_RISK", review_status: "REVIEWED" }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${samp}"
              payload: {}
              as: LabTechnician
              captures: { repv: "$.data[0].version" }
          trigger:
            - call: "POST /dna/reports/${rep}/finalize"
              payload: { expected_report_version: "${repv}" }
              as: LabTechnician
              captures: { final_count: $.data.at_risk_marker_count }
          assert:
            - "Report.${rep}.at_risk_marker_count == 1 before finalize (PRELIMINARY excludes REVIEWED)"
            - "Report.${rep}.at_risk_marker_count == 2 after finalize (FINALIZED includes REVIEWED)"
            - "Report.${rep}.status == FINALIZED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: qc_score_three_input_nonlinear_mode_a
        grounds:
          - calculations.genotyping_qc_score
          - entities.GenotypingRun.fields.qc_score
          - state_machines.Sample.GENOTYPING_to_PASS
        distinguishing_aspect: |
          Mode (a): qc_score blends three inputs non-linearly — a clamped
          het_consistency term over abs(het_rate-0.35) plus weighted call_rate and
          (1-contamination); inputs 0.99/0.35/0.01 yield exactly 99.10.
        test_recipe:
          setup:
            - "An ACTIVATED BREED kit with a RECEIVED sample ready to genotype."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "c@x.com", full_name: "C" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Q", species: "DOG", birth_year: 2019 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 } ] }
              as: LabTechnician
              captures: { qc: $.data.qc_score, outc: $.data.outcome }
          assert:
            - "GenotypingRun.qc_score == 99.10"
            - "GenotypingRun.outcome == PASS"
            - "Sample.${samp}.status == PASS"

      - name: breed_composition_round_then_reallocate_mode_b
        grounds:
          - calculations.breed_ancestry_composition
          - entities.Report.fields.breed_composition
          - state_machines.Sample.GENOTYPING_to_PASS
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each breed pct first,
          then reallocate the 0.01 rounding remainder to the largest-match_cm
          segment (earliest array index on ties); three equal 1000-cM segments give
          [33.34, 33.33, 33.33] summing to exactly 100.00, not 99.99.
        test_recipe:
          setup:
            - "An ACTIVATED BREED kit with a RECEIVED sample."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "d@x.com", full_name: "D" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Mix", species: "DOG", birth_year: 2018 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 }, { breed: "POODLE", match_cm: 1000 }, { breed: "BEAGLE", match_cm: 1000 } ] }
              as: LabTechnician
          assert:
            - "GET /dna/reports?sample_id=${samp} returns breed_composition == [ {breed: LABRADOR, pct: 33.34}, {breed: POODLE, pct: 33.33}, {breed: BEAGLE, pct: 33.33} ]"
            - "sum of breed_composition pct == 100.00"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sample_genotyping_fork_qns_then_retest_cycle
        grounds:
          - state_machines.Sample.GENOTYPING_to_QNS
          - state_machines.Sample.QNS_to_RETESTED
          - state_machines.Sample.GENOTYPING_to_PASS
        distinguishing_aspect: |
          The Sample machine branches GENOTYPING -> {PASS, QNS, FAILED} and the
          QNS branch loops back: a re-test creates a fresh RECEIVED successor sample
          on the same kit (cycle), distinct from the linear PASS branch.
        test_recipe:
          setup:
            - "A sample reached QNS (call_rate 0.85, het 0.0, contamination 0.9 -> qc 54.00)."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "e@x.com", full_name: "E" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "R", species: "DOG", birth_year: 2017 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.85, het_rate: 0.0, contamination: 0.9 }
              as: LabTechnician
              captures: { qc: $.data.qc_score, outc: $.data.outcome }
          trigger:
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}", retest_of_sample_id: "${samp}" }
              as: LabTechnician
              captures: { samp2: $.data.id }
          assert:
            - "GenotypingRun.qc_score == 54.00 and outcome == QNS on first run"
            - "Sample.${samp}.status == RETESTED after re-test"
            - "Sample.${samp2}.status == RECEIVED and Sample.${samp2}.retest_of_sample_id == ${samp}"

      - name: data_request_download_vs_delete_branch_divergent_effects
        grounds:
          - state_machines.DataRequest.PENDING_to_READY
          - state_machines.DataRequest.PENDING_to_GRACE
          - state_machines.DataRequest.GRACE_to_CANCELLED
        distinguishing_aspect: |
          The DataRequest machine branches on kind: DOWNLOAD auto-advances
          PENDING -> READY assembling export_payload, while DELETE branches
          PENDING -> GRACE setting grace_until and Account.purge_pending=true, then
          GRACE -> CANCELLED restores purge_pending=false — divergent side-effect sets.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; an account with one pet."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "f@x.com", full_name: "F" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "G", species: "CAT", birth_year: 2016 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { account_id: "${acc}", kind: "DOWNLOAD" }
              as: Account
              as_user_id: "${acc}"
              captures: { dl: $.data.id, dlstat: $.data.status }
          trigger:
            - call: "POST /dna/data-requests"
              payload: { account_id: "${acc}", kind: "DELETE" }
              as: Account
              as_user_id: "${acc}"
              captures: { del: $.data.id, grace: $.data.grace_until }
            - call: "POST /dna/data-requests/${del}/cancel"
              payload: {}
              as: Account
              as_user_id: "${acc}"
          assert:
            - "DataRequest.${dl}.status == READY and DataRequest.${dl}.export_payload is non-null"
            - "DataRequest.${del}.grace_until == 2026-05-31T00:00:00.000Z when opened"
            - "Account.${acc}.purge_pending == true while DELETE in GRACE"
            - "DataRequest.${del}.status == CANCELLED and Account.${acc}.purge_pending == false after cancel"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: genotyping_pass_cascades_sample_then_kit_depth3
        grounds:
          - state_machines.Sample.GENOTYPING_to_PASS
          - state_machines.Kit.RECEIVED_to_CONSUMED
          - calculations.genotyping_qc_score
        distinguishing_aspect: |
          Depth-3 causal chain from a genotyping-run create: the run's PASS outcome
          causes Sample GENOTYPING->PASS, which itself causes the owning Kit
          RECEIVED->CONSUMED; each link is caused by the prior link, not the run.
        test_recipe:
          setup:
            - "An ACTIVATED BREED kit with a RECEIVED sample."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "g@x.com", full_name: "G" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "T", species: "DOG", birth_year: 2015 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 } ] }
              as: LabTechnician
          assert:
            - "Sample.${samp}.status == PASS (link 1: run -> sample)"
            - "Kit.${kit}.status == CONSUMED (link 2: sample PASS -> kit)"
            - "GET /dna/reports?sample_id=${samp} returns exactly 1 report with status PRELIMINARY"

      - name: report_revoke_cascades_sharelink_revocation_depth2
        grounds:
          - state_machines.Report.FINALIZED_to_REVOKED
          - state_machines.ShareLink.ACTIVE_to_REVOKED
          - entities.ShareLink.fields.status
        distinguishing_aspect: |
          Depth-2 causal chain from a different trigger (report revoke): revoking a
          FINALIZED report causes each ACTIVE ShareLink for that report to transition
          ACTIVE->REVOKED.
        test_recipe:
          setup:
            - "A FINALIZED report with one ACTIVE ShareLink issued to a vet."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "h@x.com", full_name: "H" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "U", species: "DOG", birth_year: 2014 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "POODLE", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${samp}"
              payload: {}
              as: LabTechnician
              captures: { rep: "$.data[0].id", repv: "$.data[0].version" }
            - call: "POST /dna/reports/${rep}/finalize"
              payload: { expected_report_version: "${repv}" }
              as: LabTechnician
            - call: "POST /dna/share-links"
              payload: { report_id: "${rep}", vet_email: "vet@x.com" }
              as: Account
              as_user_id: "${acc}"
              captures: { sl: $.data.id }
          trigger:
            - call: "POST /dna/reports/${rep}/revoke"
              payload: {}
              as: Account
              as_user_id: "${acc}"
          assert:
            - "Report.${rep}.status == REVOKED"
            - "ShareLink.${sl}.status == REVOKED (cascaded from report revoke)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: purge_in_progress_beats_invalid_state_on_kit_activate
        grounds:
          - validations[priority=8]
          - validations[priority=5]
          - state_machines.Kit.ORDERED_to_ACTIVATED
        distinguishing_aspect: |
          business_safety (ERR_PURGE_IN_PROGRESS, p8) outranks state
          (ERR_INVALID_STATE, p5): activating an already-ACTIVATED kit while the
          account has a DELETE DataRequest in GRACE returns ERR_PURGE_IN_PROGRESS,
          not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Clock 2026-05-01; account with an already-ACTIVATED kit and a DELETE DataRequest in GRACE (purge_pending=true)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "i@x.com", full_name: "I" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "V", species: "DOG", birth_year: 2013 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/data-requests"
              payload: { account_id: "${acc}", kind: "DELETE" }
              as: Account
              as_user_id: "${acc}"
          trigger:
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "error_id == ERR_PURGE_IN_PROGRESS (p8 business_safety beats p5 state)"

      - name: not_resource_owner_beats_invalid_state_on_report_revoke
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.Report.PRELIMINARY_to_REVOKED
        distinguishing_aspect: |
          business_referential ownership (ERR_NOT_RESOURCE_OWNER, p4) outranks
          state (ERR_INVALID_STATE, p5): a non-owner account revoking an already
          REVOKED report gets ERR_NOT_RESOURCE_OWNER, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Account A owns a PRELIMINARY report that A has already revoked; Account B is a different account."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "owner@x.com", full_name: "Owner" }
              as: PlatformAdmin
              captures: { accA: $.data.id }
            - call: "POST /dna/accounts"
              payload: { email: "other@x.com", full_name: "Other" }
              as: PlatformAdmin
              captures: { accB: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${accA}", name: "W", species: "DOG", birth_year: 2012 }
              as: Account
              as_user_id: "${accA}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${accA}", product_tier: "BREED" }
              as: Account
              as_user_id: "${accA}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${accA}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "BEAGLE", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${samp}"
              payload: {}
              as: LabTechnician
              captures: { rep: "$.data[0].id" }
            - call: "POST /dna/reports/${rep}/revoke"
              payload: {}
              as: Account
              as_user_id: "${accA}"
          trigger:
            - call: "POST /dna/reports/${rep}/revoke"
              payload: {}
              as: Account
              as_user_id: "${accB}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 403"
            - "error_id == ERR_NOT_RESOURCE_OWNER (p4 referential ownership beats p5 state)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: call_rate_gate_ge_085_boundary_on_genotyping_run
        grounds:
          - calculations.genotyping_qc_score
          - entities.GenotypingRun.fields.outcome
          - state_machines.Sample.GENOTYPING_to_FAILED
        distinguishing_aspect: |
          The CALL_GATE boundary is >= 0.85: call_rate exactly 0.85 is NOT a hard
          FAILED (outcome decided by qc floor), while 0.84 fails the gate ->
          outcome FAILED regardless of qc_score. Tested on POST genotyping-runs.
        test_recipe:
          setup:
            - "An ACTIVATED BREED kit with a RECEIVED sample, run with call_rate 0.84."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "j@x.com", full_name: "J" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "X", species: "DOG", birth_year: 2011 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.84, het_rate: 0.35, contamination: 0.01 }
              as: LabTechnician
              captures: { outc: $.data.outcome }
          assert:
            - "GenotypingRun.outcome == FAILED (call_rate 0.84 < 0.85 gate, decided before qc floor)"
            - "Sample.${samp}.status == FAILED"

      - name: grace_window_ge_boundary_on_data_request_purge
        grounds:
          - validations[priority=12]
          - state_machines.DataRequest.GRACE_to_PURGING
          - entities.DataRequest.fields.grace_until
        distinguishing_aspect: |
          Temporal boundary on a different endpoint/metric: purge requires current
          clock >= grace_until. At grace_until - 1 day purge is rejected
          (ERR_GRACE_NOT_ELAPSED); exactly at grace_until it is allowed.
        test_recipe:
          setup:
            - "DELETE DataRequest opened at clock 2026-05-01 (grace_until 2026-05-31); clock advanced to 2026-05-30 (one day before)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "k@x.com", full_name: "K" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { account_id: "${acc}", kind: "DELETE" }
              as: Account
              as_user_id: "${acc}"
              captures: { del: $.data.id }
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/data-requests/${del}/purge"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "error_id == ERR_GRACE_NOT_ELAPSED (2026-05-30 < grace_until 2026-05-31)"
            - "DataRequest.${del}.status == GRACE (unchanged)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: match_confirm_requires_both_pets_finalized_report
        grounds:
          - state_machines.RelativeMatch.ESTIMATED_to_CONFIRMED
          - validations[priority=6]
          - entities.Pet.fields.finalized_report_id
        distinguishing_aspect: |
          RelativeMatch->Pet dependency: confirm is rejected with
          ERR_REPORTS_NOT_FINALIZED unless BOTH referenced pets have a non-null
          finalized_report_id; one pet finalized, the other PRELIMINARY -> rejected.
        test_recipe:
          setup:
            - "Two opted-in pets; pet1's report FINALIZED, pet2's report still PRELIMINARY; an ESTIMATED match between them."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "l@x.com", full_name: "L", relative_finder_opt_in: true }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P1", species: "DOG", birth_year: 2010, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p1: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P2", species: "DOG", birth_year: 2009, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p2: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k1: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k2: $.data.id }
            - call: "POST /dna/kits/${k1}/activate"
              payload: { pet_id: "${p1}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/kits/${k2}/activate"
              payload: { pet_id: "${p2}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${k1}" }
              as: LabTechnician
              captures: { s1: $.data.id }
            - call: "POST /dna/samples"
              payload: { kit_id: "${k2}" }
              as: LabTechnician
              captures: { s2: $.data.id }
            - call: "POST /dna/samples/${s1}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "POST /dna/samples/${s2}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "POODLE", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${s1}"
              payload: {}
              as: LabTechnician
              captures: { r1: "$.data[0].id", r1v: "$.data[0].version" }
            - call: "POST /dna/reports/${r1}/finalize"
              payload: { expected_report_version: "${r1v}" }
              as: LabTechnician
            - call: "POST /dna/relative-matches"
              payload: { pet_id: "${p1}", relative_pet_id: "${p2}", shared_cm: 1250 }
              as: LabTechnician
              captures: { m: $.data.id }
          trigger:
            - call: "POST /dna/relative-matches/${m}/confirm"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "error_id == ERR_REPORTS_NOT_FINALIZED (pet2 finalized_report_id is null)"
            - "RelativeMatch.${m}.status == ESTIMATED (unchanged)"

      - name: sample_receipt_requires_kit_activated_state
        grounds:
          - state_machines.Sample.RECEIVED_to_GENOTYPING
          - state_machines.Kit.ORDERED_to_ACTIVATED
          - entities.Kit.fields.status
        distinguishing_aspect: |
          Sample->Kit dependency on a different entity pair (Sample-creation gated by
          Kit state): receiving a sample requires the owning Kit to be ACTIVATED; a
          receipt against a still-ORDERED kit is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A kit in ORDERED state (never activated) under an account with a pet."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "m@x.com", full_name: "M" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Z", species: "DOG", birth_year: 2008 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
          trigger:
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "error_id == ERR_INVALID_STATE (kit is ORDERED, not ACTIVATED; receipt transition undefined)"
            - "Kit.${kit}.status == ORDERED (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: account_single_active_subscription_term_overlap
        grounds:
          - validations[priority=11]
          - state_machines.Subscription.ACTIVE_to_GRACE
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Account resource, full-term-window semantics: an account may hold only one
          subscription whose [started_on, started_on+term_days) term window is live
          (status IN {ACTIVE, GRACE}); a second create overlapping that window is
          rejected with ERR_SUBSCRIPTION_EXISTS. A CANCELLED term frees the window.
        test_recipe:
          setup:
            - "An account with one ACTIVE BASIC subscription."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "n@x.com", full_name: "N" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { account_id: "${acc}", tier: "BASIC", annual_fee_cents: 9900 }
              as: Account
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /dna/subscriptions"
              payload: { account_id: "${acc}", tier: "PREMIUM", annual_fee_cents: 19900 }
              as: Account
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "error_id == ERR_SUBSCRIPTION_EXISTS (existing ACTIVE term still occupies the account window)"

      - name: kit_single_non_terminal_sample_slot_overlap
        grounds:
          - validations[priority=10]
          - state_machines.Sample.RECEIVED_to_GENOTYPING
          - entities.Sample.fields.status
        distinguishing_aspect: |
          Kit resource, point-slot semantics (capacity 1, not a date window): a kit
          may hold only one non-terminal sample (status NOT IN {PASS, RETESTED}) at a
          time; receiving a second sample on a kit that still has a RECEIVED sample
          collides on the kit's genotyping slot and is rejected ERR_SAMPLE_NOT_GENOTYPABLE.
        test_recipe:
          setup:
            - "A kit RECEIVED with one sample still in RECEIVED (not yet genotyped)."
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "o@x.com", full_name: "O" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Slot", species: "DOG", birth_year: 2007 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp1: $.data.id }
          trigger:
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409 or 422"
            - "error_id == ERR_INVALID_STATE or ERR_SAMPLE_NOT_GENOTYPABLE (kit no longer ACTIVATED; slot occupied by samp1)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: upgrade_proration_conserves_premium_fee_cents
        grounds:
          - calculations.subscription_upgrade_proration
          - state_machines.Subscription.ACTIVE_to_SUPERSEDED
          - entities.Subscription.fields.last_charge_cents
        distinguishing_aspect: |
          Conserved quantity = cents: on BASIC->PREMIUM upgrade, the prorated unused
          credit (7431) plus the successor charge (12469) MUST equal exactly
          PREMIUM_ANNUAL_FEE_CENTS (19900); the forward charge and its compensating
          credit leave the premium fee invariant.
        test_recipe:
          setup:
            - "Clock 2026-01-01; account with ACTIVE BASIC subscription (annual_fee 9900, term 365); clock advanced to 2026-04-02 (91 days elapsed)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "p@x.com", full_name: "P" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { account_id: "${acc}", tier: "BASIC", annual_fee_cents: 9900 }
              as: Account
              as_user_id: "${acc}"
              captures: { sub: $.data.id, subv: $.data.version }
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/subscriptions/${sub}/upgrade"
              payload: { expected_subscription_version: "${subv}" }
              as: Account
              as_user_id: "${acc}"
              captures: { newsub: $.data.id, charge: $.data.last_charge_cents }
          assert:
            - "successor Subscription.last_charge_cents == 12469"
            - "12469 + 7431 == 19900 (charge + unused credit == PREMIUM_ANNUAL_FEE_CENTS, conserved)"
            - "Subscription.${sub}.status == SUPERSEDED"

      - name: delete_then_cancel_conserves_account_pet_count
        grounds:
          - state_machines.DataRequest.PENDING_to_GRACE
          - state_machines.DataRequest.GRACE_to_CANCELLED
          - entities.Account.fields.pet_count
        distinguishing_aspect: |
          Conserved quantity = pet count: opening a DELETE request (forward) then
          cancelling it during cool-off (compensating) MUST leave Account.pet_count
          unchanged at 2 and purge_pending back to false — no pets archived because
          purge never finalized.
        test_recipe:
          setup:
            - "Clock 2026-05-01; account with 2 pets and a DELETE DataRequest in GRACE."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "q@x.com", full_name: "Q" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "A1", species: "DOG", birth_year: 2006 }
              as: Account
              as_user_id: "${acc}"
              captures: { p1: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "A2", species: "CAT", birth_year: 2005 }
              as: Account
              as_user_id: "${acc}"
              captures: { p2: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { account_id: "${acc}", kind: "DELETE" }
              as: Account
              as_user_id: "${acc}"
              captures: { del: $.data.id }
          trigger:
            - call: "POST /dna/data-requests/${del}/cancel"
              payload: {}
              as: Account
              as_user_id: "${acc}"
            - call: "GET /dna/accounts/${acc}"
              payload: {}
              as: Account
              as_user_id: "${acc}"
              captures: { pc: $.data.pet_count, pp: $.data.purge_pending }
          assert:
            - "Account.${acc}.pet_count == 2 (unchanged; no archival)"
            - "Account.${acc}.purge_pending == false after cancel"
            - "DataRequest.${del}.status == CANCELLED"
