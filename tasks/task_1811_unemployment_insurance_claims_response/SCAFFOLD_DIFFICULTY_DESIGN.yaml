              captures: { appeal_id: $.data.id }
            - call: "POST /ui/appeals/${appeal_id}/hearings"
              payload: { claim_id: "${claim_id}", scheduled_start: "2026-08-20T14:00:00Z", scheduled_end: "2026-08-20T15:00:00Z", referee_id: "ref-Z", location: "Room D" }
              as: ClaimsAnalyst
              captures: { hearing_id: $.data.id }
            - call: "POST /ui/hearings/${hearing_id}/witnesses"
              payload: { full_name: "Sup Sue", witness_role: "DIRECT_SUPERVISOR", availability_start: "2026-08-20T13:00:00Z", availability_end: "2026-08-20T16:00:00Z" }
