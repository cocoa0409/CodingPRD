# =============================================================================
# PRD Benchmark Seed Tables — Online Course Marketplace (Udemy/Coursera style)
# §1.0–§1.7 live here. §1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  389. Online Course Marketplace (Udemy/Coursera style): course catalog & curriculum,
  enrollment & progress tracking, quiz/assessment & certificate, instructor revenue share
  & payout, coupon/bundle pricing, rating/review & refund window, drip content,
  completion/CEU

domain_name: online-course-marketplace
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # All entities are top-level resources linked by foreign keys; no nesting in
  # URL paths beyond reverse-reach sub-resources. Course/Lesson, Enrollment/
  # LessonCompletion/Certificate are logical parent-child via FK only.

  state_machine_shape: branching
  # Enrollment forks: COMPLETED vs REFUNDED vs EXPIRED are divergent terminal
  # branches with different side-effect sets; Course has a revert (UNPUBLISH).

  relationship_patterns:
    - one_to_many        # Instructor -> Course -> Lesson; Enrollment -> LessonCompletion
    - many_to_many       # Bundle <-> Course via course_ids
    - cross_aggregate    # Enrollment references Course + Learner + Coupon + Bundle

  role_model: peer_roles
  # Instructor owns courses/coupons/bundles/payouts; Learner owns enrollments/
  # reviews; PlatformAdmin is an opaque operational role (moderation, payout
  # approval, clock).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: display_name, type: string, source: input, description: "Public instructor name" }
      - { name: email, type: string, source: input, description: "Login email; unique across instructors" }
      - { name: revenue_share_pct, type: number, source: input, default: 0.50, description: "Instructor's share of gross course price, 0.00–1.00 inclusive" }
      - { name: payout_balance_cents, type: integer, source: computed, description: "AVAILABLE ledger credits minus PAID payouts; never negative (calc instructor_balances)" }
      - { name: pending_balance_cents, type: integer, source: computed, description: "Sum of SALE ledger entries still PENDING inside refund windows (calc instructor_balances)" }
      - { name: lifetime_earned_cents, type: integer, source: computed, description: "Cumulative SALE credits net of REFUND clawbacks (calc instructor_balances)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Learner
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Learner name" }
      - { name: email, type: string, source: input, description: "Login email; unique across learners" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund credits returned to wallet; never negative" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; owning instructor" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog price in cents; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | UNPUBLISHED | RETIRED", default: DRAFT, constraints: "DRAFT|PUBLISHED|UNPUBLISHED|RETIRED" }
      - { name: lesson_count, type: integer, source: computed, description: "Count of Lesson children" }
      - { name: published_lesson_count, type: integer, source: computed, description: "Count of Lesson children with is_published=true; enrollment requires >=1" }
      - { name: passing_score_pct, type: number, source: input, default: 0.70, description: "Minimum weighted quiz score to pass the course, 0.00–1.00" }
      - { name: refund_window_days, type: integer, source: input, default: 30, description: "Days after enrollment a learner may self-refund; >= 0" }
      - { name: drip_enabled, type: boolean, source: input, default: false, description: "When true, lessons unlock per Lesson.drip_offset_days after enrollment" }
      - { name: ceu_credits, type: number, source: input, default: 0.0, description: "Continuing-education units granted on completion; >= 0, multiples of 0.1" }
      - { name: completion_threshold_pct, type: number, source: input, default: 1.00, description: "Fraction of published lessons that must be completed to finish the course, 0.01–1.00" }
      - { name: enrollment_count, type: integer, source: computed, description: "Count of Enrollment children not in REFUNDED" }
      - { name: average_rating, type: number, source: computed, description: "Mean Review.stars over PUBLISHED reviews, 2 dp, null when none" }
      - { name: rating_count, type: integer, source: computed, description: "Count of PUBLISHED reviews" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Lesson
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; owning course (must be DRAFT or UNPUBLISHED to add)" }
      - { name: title, type: string, source: input, description: "Lesson title" }
      - { name: order_index, type: integer, source: input, description: "1-based ordering within the course; unique per course" }
      - { name: is_graded, type: boolean, source: input, default: false, description: "When true the lesson carries a quiz and contributes to the weighted score" }
      - { name: quiz_weight, type: integer, source: input, default: 0, description: "Relative weight of this graded lesson in the course score; >= 0; ignored when is_graded=false" }
      - { name: question_count, type: integer, source: input, default: 0, description: "Number of quiz questions; required >=1 when is_graded=true" }
      - { name: drip_offset_days, type: integer, source: input, default: 0, description: "Days after enrollment this lesson unlocks when Course.drip_enabled; >= 0" }
      - { name: is_published, type: boolean, source: system, description: "True once the lesson is part of a PUBLISHED course", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; issuing instructor (must own the coupon's course)" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; course the coupon applies to (must belong to issuing instructor)" }
      - { name: code, type: string, source: input, description: "Redemption code; unique per instructor (case-insensitive)" }
      - { name: discount_type, type: enum, source: input, description: "PERCENT | FLAT", constraints: "PERCENT|FLAT" }
      - { name: discount_value, type: integer, source: input, description: "PERCENT: 1–100 (whole-percent off). FLAT: cents off (>=1)" }
      - { name: max_redemptions, type: integer, source: input, description: "Total times the coupon may be redeemed; >= 1" }
      - { name: redeemed_count, type: integer, source: computed, description: "Number of non-REFUNDED enrollments that redeemed this coupon" }
      - { name: valid_from, type: datetime, source: input, description: "Coupon redeemable at or after this instant (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Coupon redeemable strictly before this instant (exclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED | EXHAUSTED", default: ACTIVE, constraints: "ACTIVE|DISABLED|EXHAUSTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; owning instructor" }
      - { name: title, type: string, source: input, description: "Bundle title" }
      - { name: course_ids, type: array, source: input, description: "Ordered list of Course.id (>=2 distinct, all PUBLISHED and owned by issuing instructor)" }
      - { name: bundle_price_cents, type: integer, source: input, description: "Flat bundle price in cents; must be < sum of member list prices" }
      - { name: promo_starts_at, type: datetime, source: input, description: "Inclusive start of this bundle's promotional window" }
      - { name: promo_ends_at, type: datetime, source: input, description: "Exclusive end of this bundle's promotional window; must be > promo_starts_at" }
      - { name: sum_list_price_cents, type: integer, source: computed, description: "Sum of member Course.list_price_cents snapshot at creation" }
      - { name: savings_cents, type: integer, source: computed, description: "sum_list_price_cents - bundle_price_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "ACTIVE|RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; enrolled course" }
      - { name: learner_id, type: string, source: input, description: "FK -> Learner.id; enrolling learner" }
      - { name: bundle_id, type: string, source: input, description: "FK -> Bundle.id; set when this enrollment originated from a bundle purchase, else null" }
      - { name: coupon_id, type: string, source: input, description: "FK -> Coupon.id; redeemed coupon, else null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | REFUNDED | EXPIRED", default: ACTIVE, constraints: "ACTIVE|COMPLETED|REFUNDED|EXPIRED" }
      - { name: list_price_cents, type: integer, source: computed, description: "Course.list_price_cents snapshot at enrollment" }
      - { name: gross_price_cents, type: integer, source: computed, description: "Price the learner is charged after coupon/bundle allocation (calc enrollment_pricing)" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "gross_price_cents - instructor_share_cents" }
      - { name: instructor_share_cents, type: integer, source: computed, description: "round_half_up(gross_price_cents * Instructor.revenue_share_pct)" }
      - { name: enrolled_at, type: datetime, source: system, description: "Clock instant of enrollment; refund-window anchor" }
      - { name: refund_deadline, type: datetime, source: computed, description: "enrolled_at + Course.refund_window_days (exclusive); self-refund allowed strictly before" }
      - { name: completed_lesson_count, type: integer, source: computed, description: "Count of LessonCompletion children with passed=true" }
      - { name: progress_pct, type: number, source: computed, description: "completed_lesson_count / Course.published_lesson_count, 2 dp" }
      - { name: weighted_score_pct, type: number, source: computed, description: "Weighted quiz score across graded lessons, 4 dp (calc course_weighted_score, weighted_gate variant)" }
      - { name: ceu_awarded, type: number, source: computed, description: "Course.ceu_credits once COMPLETED, else 0.0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: LessonCompletion
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: lesson_id, type: string, source: input, description: "FK -> Lesson.id; lesson being completed; must belong to the enrolled course" }
      - { name: correct_answers, type: integer, source: input, default: 0, description: "Quiz correct answers for graded lessons; 0 for non-graded; <= Lesson.question_count" }
      - { name: score_pct, type: number, source: computed, description: "correct_answers / Lesson.question_count for graded lessons (4 dp); 1.0 for non-graded" }
      - { name: passed, type: boolean, source: computed, description: "Non-graded: always true. Graded: score_pct >= Course.passing_score_pct" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Certificate
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the completed enrollment" }
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; copied from the enrollment" }
      - { name: learner_id, type: string, source: system, description: "FK -> Learner.id; copied from the enrollment" }
      - { name: ceu_credits, type: number, source: system, description: "Course.ceu_credits snapshot at issuance" }
      - { name: final_score_pct, type: number, source: system, description: "Enrollment.weighted_score_pct snapshot at issuance, 4 dp" }
      - { name: issued_at, type: datetime, source: system, description: "Clock instant of issuance" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; review must reference the reviewer's own enrollment" }
      - { name: course_id, type: string, source: computed, description: "FK -> Course.id; copied from the referenced enrollment" }
      - { name: learner_id, type: string, source: computed, description: "FK -> Learner.id; copied from the referenced enrollment" }
      - { name: stars, type: integer, source: input, description: "Rating 1–5 inclusive" }
      - { name: body, type: string, source: input, description: "Review text" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | HIDDEN | RETRACTED", default: PUBLISHED, constraints: "PUBLISHED|HIDDEN|RETRACTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; paid instructor" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the instructor requests; >= 1" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "min(requested_amount_cents, Instructor.payout_balance_cents) at approval; 0 until PAID" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PAID | REJECTED", default: REQUESTED, constraints: "REQUESTED|PAID|REJECTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: RevenueLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: instructor_id, type: string, source: system, description: "FK -> Instructor.id; owning instructor" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; source enrollment for SALE/REFUND entries, null for PAYOUT" }
      - { name: payout_id, type: string, source: system, description: "FK -> Payout.id; set on PAYOUT entries, else null" }
      - { name: entry_type, type: enum, source: system, description: "SALE | REFUND | PAYOUT", constraints: "SALE|REFUND|PAYOUT" }
      - { name: amount_cents, type: integer, source: system, description: "SALE: +instructor_share. REFUND: -clawback. PAYOUT: -paid_amount" }
      - { name: status, type: enum, source: system, description: "PENDING | AVAILABLE | CLAWED_BACK | PAID", constraints: "PENDING|AVAILABLE|CLAWED_BACK|PAID" }
      - { name: created_at, type: datetime, source: system, description: "Clock instant the entry was written" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Course
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /courses/{course_id}/publish"
        actor: Instructor
        preconditions:
          - "Course.status == DRAFT"
          - "Course has >= 1 Lesson child"
          - "Every Lesson with is_graded=true has question_count >= 1"
          - "Sum of quiz_weight over graded lessons >= 1"
        side_effects:
          - "Set every Lesson child is_published=true"
          - "Recompute Course.lesson_count and Course.published_lesson_count"
      - from: PUBLISHED
        to: UNPUBLISHED
        trigger: "POST /courses/{course_id}/unpublish"
        actor: Instructor
        preconditions:
          - "Course.status == PUBLISHED"
        side_effects:
          - "Course becomes non-enrollable: blocks new enrollments; existing ACTIVE enrollments unaffected"
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /courses/{course_id}/publish"
        actor: Instructor
        preconditions:
          - "Course.status == UNPUBLISHED"
          - "Course still has >= 1 published Lesson"
        side_effects:
          - "Course becomes enrollable again"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /courses/{course_id}/retire"
        actor: Instructor
        preconditions:
          - "Course.status IN {PUBLISHED, UNPUBLISHED}"
          - "No Enrollment child of this course in status ACTIVE"
        side_effects:
          - "Cascade: every Bundle in status ACTIVE whose course_ids includes this course transitions to RETIRED (recomputes that Bundle.updated_at, version)"
      - from: UNPUBLISHED
        to: RETIRED
        trigger: "POST /courses/{course_id}/retire"
        actor: Instructor
        preconditions:
          - "Course.status IN {PUBLISHED, UNPUBLISHED}"
          - "No Enrollment child of this course in status ACTIVE"
        side_effects:
          - "Cascade: every Bundle in status ACTIVE whose course_ids includes this course transitions to RETIRED (recomputes that Bundle.updated_at, version)"

  - entity: Enrollment
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, REFUNDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /lesson-completions"
        actor: Learner
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "Target Lesson belongs to Enrollment.course_id and is_published=true"
          - "If Course.drip_enabled: current clock >= enrolled_at + Lesson.drip_offset_days (lesson unlocked)"
          - "No existing LessonCompletion for this (enrollment, lesson) pair"
        side_effects:
          - "Compute LessonCompletion.score_pct and passed (calc lesson_completion_score)"
          - "Recompute Enrollment.completed_lesson_count, progress_pct, weighted_score_pct (calc course_weighted_score)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (auto-transition checked at end of POST /lesson-completions)"
        actor: system
        preconditions:
          - "progress_pct >= Course.completion_threshold_pct"
          - "weighted_score_pct >= Course.passing_score_pct (non-graded courses auto-satisfy this)"
        side_effects:
          - "Set Enrollment.ceu_awarded = Course.ceu_credits"
          - "Issue exactly one Certificate child snapshotting ceu_credits and weighted_score_pct"
          - "Revenue is NOT altered by completion (SALE ledger entry untouched)"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /enrollments/{enrollment_id}/refund"
        actor: Learner
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "current clock strictly before Enrollment.refund_deadline"
        side_effects:
          - "Credit Learner.wallet_credit_cents by Enrollment.gross_price_cents"
          - "Cascade: the SALE RevenueLedgerEntry for this enrollment flips PENDING->CLAWED_BACK, then a REFUND entry of -instructor_share_cents is written; this recomputes Instructor.pending_balance_cents and lifetime_earned_cents (calc instructor_balances)"
          - "Cascade: if a coupon was redeemed, decrement Coupon.redeemed_count; if the coupon was EXHAUSTED it transitions back to ACTIVE (recomputes Coupon.status, version)"
          - "Decrement Course.enrollment_count"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (refund window passes; lazily on the next read/write touching the enrollment after refund_deadline)"
        actor: system
        preconditions:
          - "current clock >= Enrollment.refund_deadline"
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "Cascade: the SALE RevenueLedgerEntry flips PENDING->AVAILABLE; this recomputes Instructor.pending_balance_cents and payout_balance_cents (calc instructor_balances)"
        note: "EXPIRED means the refund window closed; the enrollment is still usable for learning and can still auto-COMPLETE, but is no longer self-refundable."

  - entity: Coupon
    field: status
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (an enrollment redeems the coupon and redeemed_count reaches max_redemptions)"
        actor: system
        preconditions:
          - "redeemed_count == max_redemptions after this redemption"
        side_effects:
          - "Coupon.status = EXHAUSTED; further redemptions rejected with ERR_COUPON_EXHAUSTED"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (a coupon-bearing enrollment is refunded, freeing a redemption)"
        actor: system
        preconditions:
          - "redeemed_count < max_redemptions after the refund decrement"
        side_effects:
          - "Coupon.status = ACTIVE; coupon redeemable again"
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /coupons/{coupon_id}/disable"
        actor: Instructor
        preconditions:
          - "Coupon.status == ACTIVE"
        side_effects:
          - "Coupon no longer redeemable"

  - entity: Payout
    field: status
    initial_state: REQUESTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /payouts/{payout_id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == REQUESTED"
          - "Instructor.payout_balance_cents >= 1"
          - "expected_instructor_version == Instructor.version (OCC)"
        side_effects:
          - "Set paid_amount_cents = min(requested_amount_cents, Instructor.payout_balance_cents)"
          - "Write a PAYOUT RevenueLedgerEntry of -paid_amount_cents with status=PAID"
          - "Recompute Instructor.payout_balance_cents (debited by paid_amount_cents) and increment Instructor.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /payouts/{payout_id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == REQUESTED"
        side_effects:
          - "No ledger movement; payout closed"

  - entity: Review
    field: status
    initial_state: PUBLISHED
    terminal_states: [RETRACTED]
    transitions:
      - from: PUBLISHED
        to: HIDDEN
        trigger: "POST /reviews/{review_id}/hide"
        actor: PlatformAdmin
        preconditions:
          - "Review.status == PUBLISHED"
        side_effects:
          - "Cascade: recompute Course.average_rating and Course.rating_count excluding this review (recomputes Course.version)"
      - from: HIDDEN
        to: PUBLISHED
        trigger: "POST /reviews/{review_id}/unhide"
        actor: PlatformAdmin
        preconditions:
          - "Review.status == HIDDEN"
        side_effects:
          - "Cascade: recompute Course.average_rating and Course.rating_count including this review (recomputes Course.version)"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /reviews/{review_id}/retract"
        actor: Learner
        preconditions:
          - "Review.status == PUBLISHED"
          - "Acting Learner owns the Enrollment the review references"
        side_effects:
          - "Cascade: recompute Course.average_rating and Course.rating_count excluding this review (recomputes Course.version)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: payout-approve-stale-instructor
    parent_entity: Instructor
    write_endpoint: "POST /payouts/{payout_id}/approve"
    occ_field: "expected_instructor_version"
    description: |
      Approving a Payout against an Instructor whose version has advanced since the
      client last observed it is rejected. A SALE-window-expiry flip or an earlier
      payout legitimately moves the instructor's balance and bumps its version; an
      approval carrying the stale version would draw against a balance the client no
      longer sees, so the system rejects it on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bundle-enroll-stale-bundle
    parent_entity: Bundle
    write_endpoint: "POST /bundles/{bundle_id}/enroll"
    occ_field: "expected_bundle_version"
    description: |
      Enrolling through a Bundle whose version has advanced since the client last
      observed it is rejected. A retire cascade (triggered when a member course is
      retired) legitimately moves the Bundle to RETIRED and bumps its version; a
      bundle enroll carrying the stale version would purchase a membership the client
      no longer sees, so it is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_pricing
    trigger: "POST /courses/{course_id}/enroll (single-course) and POST /bundles/{bundle_id}/enroll (bundle)"
    algorithm: tiered_pricing
    formula: |
      # ---- Single-course (POST /courses/{course_id}/enroll) ----
      base = Course.list_price_cents
      if coupon_code supplied (resolves to a Coupon on this course):
        if coupon.discount_type == PERCENT:
          discount = round_half_up(base * coupon.discount_value / 100)
        else:  # FLAT
          discount = min(coupon.discount_value, base)
        gross = max(base - discount, 0)
      else:
        gross = base
      instructor_share = round_half_up(gross * Instructor.revenue_share_pct)
      platform_fee = gross - instructor_share

      # ---- Bundle (POST /bundles/{bundle_id}/enroll) ----
      # The flat bundle_price_cents is allocated across member courses by
      # list-price weight using the LARGEST-REMAINDER method so per-course gross
      # sums EXACTLY to bundle_price_cents:
      #   raw_i     = bundle_price_cents * (course_i.list_price_cents / sum_list_price_cents)
      #   floor_i   = floor(raw_i)
      #   remainder = bundle_price_cents - sum(floor_i)           # >= 0 integer
      #   give the `remainder` extra cents one-by-one to the courses with the
      #   largest fractional part (raw_i - floor_i); ties broken by Course.created_at ASC.
      #   gross_i   = floor_i + (1 if course_i received a remainder cent else 0)
      # Each member Enrollment.instructor_share_cents uses ITS course instructor's
      # revenue_share_pct applied to gross_i (round_half_up).
    input_set: "Single: one Course + optional Coupon. Bundle: all member Courses (must be PUBLISHED), allocated by list-price weight."
    constants: {}
    precision: "cents are integers; PERCENT discount and instructor_share use round_half_up at the cent"
    variants:
      - name: single_course
        when: "POST /courses/{course_id}/enroll"
        difference: "gross = list_price minus coupon discount; no allocation; coupons allowed"
      - name: bundle_allocation
        when: "POST /bundles/{bundle_id}/enroll"
        difference: "flat bundle price split across members by list-price weight with largest-remainder rounding; coupons NOT allowed on bundles"

  - name: course_weighted_score
    trigger: "Enrollment side-effect of POST /lesson-completions; re-evaluated for the auto-COMPLETED gate"
    algorithm: weighted_scoring
    formula: |
      graded = [Lesson L of the course where L.is_graded and L.is_published]
      total_weight = sum(L.quiz_weight for L in graded)    # >= 1, fixed at publish

      # WEIGHTED variant (authoritative for the completion pass/fail gate and for
      # Enrollment.weighted_score_pct):
      #   numerator = sum( lc.score_pct * L.quiz_weight )
      #               over graded lessons L that HAVE a LessonCompletion lc on this enrollment
      #   weighted_score_pct = round_4dp( numerator / total_weight )
      #   (total_weight is the FIXED denominator: not-yet-completed graded lessons
      #    contribute 0 to numerator but their weight still counts in the denominator.)
    input_set: "Graded published lessons of the enrolled course and their LessonCompletion children for this enrollment."
    constants: {}
    precision: "weighted_score_pct rounded to 4 decimal places, round_half_up"
    variants:
      - name: weighted_gate
        when: "completion pass/fail gate and Enrollment.weighted_score_pct"
        difference: "divides by TOTAL graded quiz_weight fixed at publish (denominator includes not-yet-completed lessons)"
      - name: simple_average_transcript
        when: "Certificate transcript display only (NOT the gate)"
        difference: "unweighted mean of completed graded lessons' score_pct; denominator = COUNT of completed graded lessons (grows as the learner progresses) — diverges from weighted_gate for identical data"

  - name: lesson_completion_score
    trigger: "POST /lesson-completions"
    algorithm: threshold
    formula: |
      if Lesson.is_graded:
        score_pct = round_4dp(correct_answers / Lesson.question_count)
        passed    = (score_pct >= Course.passing_score_pct)   # inclusive >=, NOT >
      else:
        score_pct = 1.0
        passed    = true
    input_set: "One LessonCompletion against its Lesson and the owning Course.passing_score_pct"
    constants: {}
    precision: "score_pct 4 dp round_half_up; pass test is inclusive >="

  - name: instructor_balances
    trigger: "Recomputed on every RevenueLedgerEntry write or status flip (SALE write, refund clawback, window-expiry AVAILABLE flip, payout)"
    algorithm: aggregation
    formula: |
      pending_balance_cents  = sum(e.amount_cents for e in RevenueLedgerEntry
                                   where e.entry_type == SALE and e.status == PENDING)
      available_credits      = sum(e.amount_cents for e in RevenueLedgerEntry
                                   where e.entry_type == SALE and e.status == AVAILABLE)
      payouts_taken          = sum(-e.amount_cents for e in RevenueLedgerEntry
                                   where e.entry_type == PAYOUT and e.status == PAID)
      payout_balance_cents   = max(available_credits - payouts_taken, 0)
      lifetime_earned_cents  = sum(e.amount_cents for e in RevenueLedgerEntry
                                   where e.entry_type IN {SALE, REFUND}
                                   and e.status != CLAWED_BACK)
    input_set: "All RevenueLedgerEntry rows for the instructor, filtered by entry_type and status as shown."
    constants: {}
    precision: "integer cents; payout_balance_cents floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /instructors, POST /learners"

  - priority: 2
    category: auth
    check: "Acting role permitted for the operation per §1.7; entity-backed role's X-User-ID owns the targeted resource where ownership applies"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right (course, lesson, enrollment, coupon, bundle, payout, review, learner, instructor)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (course publishable, enrollment active, payout requested, coupon active, review published)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_constraint
    check: "Publish requires >=1 lesson; every graded lesson needs question_count>=1; a graded course needs total quiz_weight>=1"
    error_id: ERR_COURSE_NOT_PUBLISHABLE
    http_status: 422
    applies_to: "POST /courses/{course_id}/publish"

  - priority: 5
    category: business_constraint
    check: "LessonCompletion lesson must belong to the enrolled course and not already completed for this enrollment (also Lesson.order_index unique per course on create)"
    error_id: ERR_DUPLICATE_LESSON_COMPLETION
    http_status: 409
    applies_to: "POST /lesson-completions, POST /lessons"

  - priority: 6
    category: business_temporal
    check: "Drip gate: when Course.drip_enabled, the lesson is locked until current clock >= enrolled_at + Lesson.drip_offset_days"
    error_id: ERR_LESSON_LOCKED
    http_status: 409
    applies_to: "POST /lesson-completions"

  - priority: 6
    category: business_temporal
    check: "Coupon redeemable only when valid_from <= now < valid_until and status==ACTIVE"
    error_id: ERR_COUPON_NOT_REDEEMABLE
    http_status: 422
    applies_to: "POST /courses/{course_id}/enroll"

  - priority: 7
    category: business_referential
    check: "Resolved Coupon.course_id must equal the course being enrolled and coupon.instructor_id must own that course"
    error_id: ERR_COUPON_COURSE_MISMATCH
    http_status: 422
    applies_to: "POST /courses/{course_id}/enroll"

  - priority: 7
    category: business_constraint
    check: "Review requires a COMPLETED or EXPIRED enrollment owned by the acting learner; at most one non-RETRACTED review per enrollment"
    error_id: ERR_REVIEW_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /reviews"

  - priority: 7
    category: business_constraint
    check: "No duplicate enrollment: an Enrollment in {ACTIVE, COMPLETED, EXPIRED} already exists for this (learner, course)"
    error_id: ERR_ALREADY_ENROLLED
    http_status: 409
    applies_to: "POST /courses/{course_id}/enroll, POST /bundles/{bundle_id}/enroll"

  - priority: 8
    category: business_constraint
    check: "Coupon.redeemed_count < max_redemptions at redemption time"
    error_id: ERR_COUPON_EXHAUSTED
    http_status: 409
    applies_to: "POST /courses/{course_id}/enroll"

  - priority: 8
    category: business_temporal
    check: "Self-refund allowed only while current clock < Enrollment.refund_deadline"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /enrollments/{enrollment_id}/refund"

  - priority: 9
    category: business_fiscal
    check: "Payout request and approval require Instructor.payout_balance_cents >= 1; approval debits available balance"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /payouts, POST /payouts/{payout_id}/approve"

  - priority: 9
    category: business_fiscal
    check: "Bundle.bundle_price_cents must be strictly less than the sum of member list prices; >=2 distinct PUBLISHED member courses owned by the issuer"
    error_id: ERR_INVALID_BUNDLE
    http_status: 422
    applies_to: "POST /bundles"

  - priority: 9
    category: business_temporal
    check: "Coupon window overlap: a new coupon's half-open [valid_from, valid_until) window must NOT overlap any existing non-DISABLED coupon for the SAME (instructor_id, course_id). Half-open semantics: two windows touching at an endpoint (a.valid_until == b.valid_from) do NOT overlap and are allowed. Overlap iff (a.valid_from < b.valid_until) AND (b.valid_from < a.valid_until)."
    error_id: ERR_COUPON_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /coupons"

  - priority: 9
    category: business_temporal
    check: "Bundle promo overlap: a new bundle's promotional window must be separated from every existing ACTIVE bundle of the SAME instructor that SHARES at least one member course by a strict 1-day (86400s) buffer. CLOSED-with-buffer semantics: windows collide iff (a.promo_starts_at < b.promo_ends_at + 1 day) AND (b.promo_starts_at < a.promo_ends_at + 1 day) — i.e. touching or any gap < 1 day is rejected (NOT just strict overlap)."
    error_id: ERR_BUNDLE_PROMO_OVERLAP
    http_status: 409
    applies_to: "POST /bundles"

  - priority: 10
    category: state
    check: "OCC: expected_<parent>_version must equal the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payouts/{payout_id}/approve, POST /bundles/{bundle_id}/enroll"

  - priority: 11
    category: business_constraint
    check: "Field-level input validation: required fields present, enums valid, numeric ranges (stars 1-5, discount_value, revenue_share_pct 0.0-1.0, prices >= 0, correct_answers <= question_count)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Instructor ----
  - { method: POST, path: "/instructors", description: "Create instructor", roles: [Anonymous], code: 201,
      input: [display_name, email, "revenue_share_pct?"], output: Instructor, side_effects: ["version=1"] }
  - { method: GET, path: "/instructors/{instructor_id}", description: "Get instructor (balances)", roles: [Instructor, PlatformAdmin], code: 200,
      input: [], output: Instructor, side_effects: ["Recompute balances (calc instructor_balances)"] }

  # ---- Learner ----
  - { method: POST, path: "/learners", description: "Create learner", roles: [Anonymous], code: 201,
      input: [full_name, email], output: Learner, side_effects: ["version=1"] }
  - { method: GET, path: "/learners/{learner_id}", description: "Get learner (wallet)", roles: [Learner, PlatformAdmin], code: 200,
      input: [], output: Learner, side_effects: [] }

  # ---- Course ----
  - { method: POST, path: "/courses", description: "Create course (DRAFT)", roles: [Instructor], code: 201,
      input: [instructor_id, title, list_price_cents, "passing_score_pct?", "refund_window_days?", "drip_enabled?", "ceu_credits?", "completion_threshold_pct?"], output: Course, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/courses/{course_id}", description: "Get course", roles: [Instructor, Learner, PlatformAdmin], code: 200,
      input: [], output: Course, side_effects: ["Recompute derived counts/ratings"] }
  - { method: GET, path: "/courses", description: "List courses; filter by instructor_id (reverse-reach for Course.instructor_id)", roles: [Instructor, Learner, PlatformAdmin], code: 200,
      input: ["instructor_id?", "status?", "limit?", "offset?"], output: "Course[]", side_effects: [] }
  - { method: POST, path: "/courses/{course_id}/publish", description: "Publish (or re-publish) a course", roles: [Instructor], code: 200,
      input: [], output: Course, side_effects: ["DRAFT->PUBLISHED or UNPUBLISHED->PUBLISHED", "set lessons is_published=true", "recompute published_lesson_count"] }
  - { method: POST, path: "/courses/{course_id}/unpublish", description: "Unpublish a course", roles: [Instructor], code: 200,
      input: [], output: Course, side_effects: ["PUBLISHED->UNPUBLISHED; blocks new enrollments"] }
  - { method: POST, path: "/courses/{course_id}/retire", description: "Retire a course", roles: [Instructor], code: 200,
      input: [], output: Course, side_effects: ["->RETIRED", "cascade: retire member bundles"] }

  # ---- Lesson ----
  - { method: POST, path: "/lessons", description: "Add a lesson to a DRAFT/UNPUBLISHED course", roles: [Instructor], code: 201,
      input: [course_id, title, order_index, "is_graded?", "quiz_weight?", "question_count?", "drip_offset_days?"], output: Lesson, side_effects: ["recompute Course.lesson_count"] }
  - { method: GET, path: "/lessons/{lesson_id}", description: "Get lesson", roles: [Instructor, Learner, PlatformAdmin], code: 200,
      input: [], output: Lesson, side_effects: [] }
  - { method: GET, path: "/lessons", description: "List lessons; filter by course_id (reverse-reach for Lesson.course_id)", roles: [Instructor, Learner, PlatformAdmin], code: 200,
      input: ["course_id?", "limit?", "offset?"], output: "Lesson[]", side_effects: [] }

  # ---- Coupon ----
  - { method: POST, path: "/coupons", description: "Create a coupon", roles: [Instructor], code: 201,
      input: [instructor_id, course_id, code, discount_type, discount_value, max_redemptions, valid_from, valid_until], output: Coupon, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/coupons/{coupon_id}", description: "Get coupon", roles: [Instructor, PlatformAdmin], code: 200,
      input: [], output: Coupon, side_effects: [] }
  - { method: GET, path: "/coupons", description: "List coupons; filter by instructor_id and/or course_id (reverse-reach for Coupon.instructor_id and Coupon.course_id)", roles: [Instructor, PlatformAdmin], code: 200,
      input: ["instructor_id?", "course_id?", "status?", "limit?", "offset?"], output: "Coupon[]", side_effects: [] }
  - { method: POST, path: "/coupons/{coupon_id}/disable", description: "Disable a coupon", roles: [Instructor], code: 200,
      input: [], output: Coupon, side_effects: ["ACTIVE->DISABLED"] }

  # ---- Bundle ----
  - { method: POST, path: "/bundles", description: "Create a bundle", roles: [Instructor], code: 201,
      input: [instructor_id, title, course_ids, bundle_price_cents, promo_starts_at, promo_ends_at], output: Bundle, side_effects: ["snapshot sum_list_price_cents, savings_cents", "status=ACTIVE"] }
  - { method: GET, path: "/bundles/{bundle_id}", description: "Get bundle", roles: [Instructor, Learner, PlatformAdmin], code: 200,
      input: [], output: Bundle, side_effects: [] }
  - { method: GET, path: "/bundles", description: "List bundles; filter by instructor_id (reverse-reach for Bundle.instructor_id)", roles: [Instructor, Learner, PlatformAdmin], code: 200,
      input: ["instructor_id?", "status?", "limit?", "offset?"], output: "Bundle[]", side_effects: [] }
  - { method: POST, path: "/bundles/{bundle_id}/enroll", description: "Enroll a learner in all member courses of a bundle (OCC on bundle)", roles: [Learner], code: 201,
      input: [learner_id, expected_bundle_version], output: "Enrollment[]", side_effects: ["calc enrollment_pricing bundle_allocation", "write a SALE RevenueLedgerEntry per member", "increment each member Course.enrollment_count", "increments Bundle.version by 1"] }

  # ---- Enrollment ----
  - { method: POST, path: "/courses/{course_id}/enroll", description: "Enroll a learner in a single course (optional coupon)", roles: [Learner], code: 201,
      input: [learner_id, "coupon_code?"], output: Enrollment, side_effects: ["calc enrollment_pricing single_course", "write SALE RevenueLedgerEntry PENDING", "increment Coupon.redeemed_count + maybe EXHAUSTED", "increment Course.enrollment_count"] }
  - { method: GET, path: "/enrollments/{enrollment_id}", description: "Get enrollment (lazy auto-EXPIRE; progress/score)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: [], output: Enrollment, side_effects: ["lazy ACTIVE->EXPIRED if past refund_deadline; recompute progress"] }
  - { method: GET, path: "/enrollments", description: "List enrollments; filter by course_id/learner_id/coupon_id/bundle_id (reverse-reach for those FKs)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: ["course_id?", "learner_id?", "coupon_id?", "bundle_id?", "status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: POST, path: "/enrollments/{enrollment_id}/refund", description: "Self-refund within the refund window", roles: [Learner], code: 200,
      input: [], output: Enrollment, side_effects: ["ACTIVE->REFUNDED", "credit wallet", "clawback SALE entry + REFUND entry", "coupon redeemed_count-- + maybe ACTIVE", "Course.enrollment_count--"] }
  - { method: GET, path: "/enrollments/{enrollment_id}/lesson-completions", description: "List a learner's completions for an enrollment (reverse-reach for LessonCompletion.enrollment_id)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: ["limit?", "offset?"], output: "LessonCompletion[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{enrollment_id}/certificate", description: "Get the certificate for a completed enrollment (reverse-reach for Certificate.enrollment_id)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: [], output: "Certificate[]", side_effects: [] }

  # ---- LessonCompletion ----
  - { method: POST, path: "/lesson-completions", description: "Record a lesson completion / quiz attempt", roles: [Learner], code: 201,
      input: [enrollment_id, lesson_id, "correct_answers?"], output: LessonCompletion, side_effects: ["calc lesson_completion_score", "recompute enrollment progress + weighted score", "maybe auto-COMPLETED + Certificate + ceu_awarded"] }
  - { method: GET, path: "/lesson-completions/{completion_id}", description: "Get a lesson completion", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: [], output: LessonCompletion, side_effects: [] }
  - { method: GET, path: "/lesson-completions", description: "List completions; filter by enrollment_id and/or lesson_id (reverse-reach for LessonCompletion.lesson_id)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: ["enrollment_id?", "lesson_id?", "limit?", "offset?"], output: "LessonCompletion[]", side_effects: [] }

  # ---- Certificate ----
  - { method: GET, path: "/certificates/{certificate_id}", description: "Get a certificate", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: [], output: Certificate, side_effects: [] }
  - { method: GET, path: "/certificates", description: "List certificates; filter by course_id/learner_id/enrollment_id (reverse-reach for Certificate.course_id, .learner_id, .enrollment_id)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: ["course_id?", "learner_id?", "enrollment_id?", "limit?", "offset?"], output: "Certificate[]", side_effects: [] }

  # ---- Review ----
  - { method: POST, path: "/reviews", description: "Create a review for a completed/expired enrollment", roles: [Learner], code: 201,
      input: [enrollment_id, stars, body], output: Review, side_effects: ["recompute Course.average_rating, rating_count"] }
  - { method: GET, path: "/reviews/{review_id}", description: "Get a review", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: [], output: Review, side_effects: [] }
  - { method: GET, path: "/reviews", description: "List reviews; filter by course_id, enrollment_id and/or learner_id (reverse-reach for Review.course_id, Review.enrollment_id, Review.learner_id)", roles: [Learner, Instructor, PlatformAdmin], code: 200,
      input: ["course_id?", "enrollment_id?", "learner_id?", "status?", "limit?", "offset?"], output: "Review[]", side_effects: [] }
  - { method: POST, path: "/reviews/{review_id}/hide", description: "Hide a review (moderation)", roles: [PlatformAdmin], code: 200,
      input: [], output: Review, side_effects: ["PUBLISHED->HIDDEN", "recompute course rating"] }
  - { method: POST, path: "/reviews/{review_id}/unhide", description: "Unhide a review", roles: [PlatformAdmin], code: 200,
      input: [], output: Review, side_effects: ["HIDDEN->PUBLISHED", "recompute course rating"] }
  - { method: POST, path: "/reviews/{review_id}/retract", description: "Learner retracts own review", roles: [Learner], code: 200,
      input: [], output: Review, side_effects: ["PUBLISHED->RETRACTED", "recompute course rating"] }

  # ---- Payout & Ledger ----
  - { method: POST, path: "/payouts", description: "Instructor requests a payout", roles: [Instructor], code: 201,
      input: [instructor_id, requested_amount_cents], output: Payout, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/payouts/{payout_id}", description: "Get a payout", roles: [Instructor, PlatformAdmin], code: 200,
      input: [], output: Payout, side_effects: [] }
  - { method: GET, path: "/payouts", description: "List payouts; filter by instructor_id (reverse-reach for Payout.instructor_id)", roles: [Instructor, PlatformAdmin], code: 200,
      input: ["instructor_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: POST, path: "/payouts/{payout_id}/approve", description: "Admin approves & pays a payout (OCC on instructor)", roles: [PlatformAdmin], code: 200,
      input: [expected_instructor_version], output: Payout, side_effects: ["REQUESTED->PAID", "write PAYOUT ledger entry", "debit payout_balance", "increments Instructor.version by 1"] }
  - { method: POST, path: "/payouts/{payout_id}/reject", description: "Admin rejects a payout", roles: [PlatformAdmin], code: 200,
      input: [], output: Payout, side_effects: ["REQUESTED->REJECTED"] }
  - { method: GET, path: "/ledger-entries/{entry_id}", description: "Get a revenue ledger entry", roles: [Instructor, PlatformAdmin], code: 200,
      input: [], output: RevenueLedgerEntry, side_effects: [] }
  - { method: GET, path: "/ledger-entries", description: "List ledger entries; filter by instructor_id/enrollment_id/payout_id (reverse-reach for those FKs)", roles: [Instructor, PlatformAdmin], code: 200,
      input: ["instructor_id?", "enrollment_id?", "payout_id?", "entry_type?", "status?", "limit?", "offset?"], output: "RevenueLedgerEntry[]", side_effects: [] }

  # ---- Test-driving (clock) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the system clock (test-driving)", roles: [PlatformAdmin], code: 200,
      input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["advancing past a refund_deadline lazily EXPIRES the affected enrollment on its next read/write"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers on a protected endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity-backed user does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, out-of-range number (e.g. stars not 1-5, correct_answers > question_count)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition" }
  - { id: ERR_COURSE_NOT_PUBLISHABLE, http: 422, condition: "Publish attempted with no lessons, a graded lesson missing questions, or zero total quiz_weight" }
  - { id: ERR_DUPLICATE_LESSON_COMPLETION, http: 409, condition: "A LessonCompletion already exists for this (enrollment, lesson) pair, or Lesson.order_index collides on create" }
  - { id: ERR_LESSON_LOCKED, http: 409, condition: "Drip-gated lesson not yet unlocked for this enrollment" }
  - { id: ERR_COUPON_NOT_REDEEMABLE, http: 422, condition: "Coupon outside [valid_from, valid_until) or not ACTIVE" }
  - { id: ERR_COUPON_COURSE_MISMATCH, http: 422, condition: "Coupon.course_id != enrolled course, or coupon owner mismatch" }
  - { id: ERR_COUPON_EXHAUSTED, http: 409, condition: "Coupon redeemed_count already at max_redemptions" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "Learner already has an enrollment in {ACTIVE, COMPLETED, EXPIRED} for this course" }
  - { id: ERR_REVIEW_NOT_ELIGIBLE, http: 422, condition: "Review without a completed/expired owned enrollment, or a duplicate non-RETRACTED review" }
  - { id: ERR_INVALID_BUNDLE, http: 422, condition: "Bundle price not below member sum, or fewer than 2 distinct PUBLISHED member courses" }
  - { id: ERR_COUPON_WINDOW_OVERLAP, http: 409, condition: "New coupon's [valid_from, valid_until) overlaps an existing non-DISABLED coupon for the same (instructor, course) under half-open semantics (touching allowed)" }
  - { id: ERR_BUNDLE_PROMO_OVERLAP, http: 409, condition: "New bundle's promo window is within 1 day of an existing ACTIVE same-instructor bundle sharing a member course (buffer semantics, touching rejected)" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 422, condition: "Payout requested/approved with payout_balance_cents < 1" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 422, condition: "Refund attempted at/after refund_deadline" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register an Instructor or Learner"
    identity: "opaque"
    exclusive_operations: ["POST /instructors", "POST /learners"]
    shared_operations: []

  - name: Instructor
    description: "Owns courses, lessons, coupons, bundles, payouts; reads own ledger"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /courses"
      - "POST /lessons"
      - "POST /courses/{course_id}/publish"
      - "POST /courses/{course_id}/unpublish"
      - "POST /courses/{course_id}/retire"
      - "POST /coupons"
      - "POST /coupons/{coupon_id}/disable"
      - "POST /bundles"
      - "POST /payouts"
    shared_operations:
      - "GET courses/lessons/bundles/enrollments/ledger/payouts reads"

  - name: Learner
    description: "Owns enrollments, lesson-completions, refunds, reviews"
    identity: "entity_backed:Learner"
    exclusive_operations:
      - "POST /courses/{course_id}/enroll"
      - "POST /bundles/{bundle_id}/enroll"
      - "POST /lesson-completions"
      - "POST /enrollments/{enrollment_id}/refund"
      - "POST /reviews"
      - "POST /reviews/{review_id}/retract"
    shared_operations:
      - "GET own enrollments/courses/certificate reads"

  - name: PlatformAdmin
    description: "Operational role: payout approval/rejection, review moderation, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /payouts/{payout_id}/approve"
      - "POST /payouts/{payout_id}/reject"
      - "POST /reviews/{review_id}/hide"
      - "POST /reviews/{review_id}/unhide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET all reads"
