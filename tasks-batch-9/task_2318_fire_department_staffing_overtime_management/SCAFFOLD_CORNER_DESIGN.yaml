              as: StaffingOfficer
              captures: { ff125a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st125}", full_name: "G Gorman", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff125b: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st125}", full_name: "H Hobbs", rank: "CAPTAIN", platoon: "C", seniority_rank: 9, kelly_day_cycle_position: 3, certifications: [], hourly_rate_cents: 5000 }
              as: StaffingOfficer
              captures: { ff125o: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st125}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st125}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh125: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh125}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh125_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh125}", firefighter_id: "${ff125a}", apparatus_id: "${eng125}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh125_v}" }
              as: CompanyOfficer
              as_user_id: "${ff125o}"
              captures: { asg125a: "$.data.id" }
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh125}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac125: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac125}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off125: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/leave-requests"
              payload: { firefighter_id: "${ff125a}", duty_shift_id: "${sh125}", leave_type: "VACATION", requested_hours: 24 }
              as: Firefighter
              as_user_id: "${ff125b}"
              captures: { err125a: "$.data.error_id" }
            - call: "POST /fire-ops/overtime-offers/${off125}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
              as_user_id: "${ff125a}"
              captures: { err125b: "$.data.error_id" }
          assert:
            - "LEAVE PROBE: HTTP 403 and error_id == \"ERR_NOT_RESOURCE_OWNER\"; GET /fire-ops/leave-requests?duty_shift_id=${sh125} returns total_count == 0"
            - "OFFER PROBE: HTTP 403 and error_id == \"ERR_NOT_RESOURCE_OWNER\" — the offer belongs to ${ff125b}"
            - "OvertimeOffer.${off125}.status == \"OFFERED\" and Vacancy.${vac125}.status == \"OFFERING\""
            - "Firefighter.${ff125a}.voluntary_ot_hours_charged == 0 and Firefighter.${ff125b}.pending_offer_count == 1"
            - "ShiftAssignment.${asg125a}.status == \"SCHEDULED\" throughout"

      - name: unknown_ids_return_their_own_not_found_codes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUTY_SHIFT_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
