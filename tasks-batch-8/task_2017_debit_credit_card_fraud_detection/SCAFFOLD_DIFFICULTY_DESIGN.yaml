        distinguishing_aspect: |
          Entity = ChargebackCase (distinct from Card and FraudAlert). Branching fork with
          divergent side-effect sets: WON retains the posted credit (balance stays 15000 after
          the second posting) while LOST reverses it (balance drops back to 15000 from 30000) —
          identical prefixes, opposite ledger outcomes.
        test_recipe:
