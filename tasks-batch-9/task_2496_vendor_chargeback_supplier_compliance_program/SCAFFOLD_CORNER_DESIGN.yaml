              captures: { v_id: $.data.id }
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-A", title: "Domestic Routing Guide 2026-A", scope_code: "ALL", effective_from: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2055", legal_name: "Duplicode Dry Goods (second entry)", payment_terms_days: 45 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_vendor: $.data.error_id }
            - call: "POST /compliance/routing-guides/${g_id}/publish"
