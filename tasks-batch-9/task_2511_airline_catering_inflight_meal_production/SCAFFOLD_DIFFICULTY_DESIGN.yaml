# §1.8 Scaffold Difficulty Design — Airline Catering & Inflight Meal Production (task 2511)
#
# 9 rule_id blocks / 24 instances. Every numeric literal in an `assert:` line was produced by
# executing the referenced §1.3 formula with its declared `constants:` (Decimal, ROUND_HALF_UP).
#
# Reusable call objects are declared once with a YAML anchor (&c_...) at their first point of use
# and aliased (*c_...) afterwards; an alias re-executes the identical call and re-binds the same
# `captures:` names inside the aliasing instance.
#
# Shared reference data pinned by the anchors:
#   Airline AN "AeroNordic"      BONDED,   cost cap 6000, cutoff 720min, grace 10min,
#                                recovery 30.00%, deviation tolerance 5.00%
#   AN-F-STD FIRST/STANDARD/HOT    4200c  shelf 4h   load 0.00  portion 420  gross 900
#   AN-C-STD BUSINESS/STANDARD/HOT 3900c  shelf 4h   load 5.00  portion 380  gross 850
#   AN-Y-STD ECONOMY/STANDARD/CHILL 1450c shelf 72h  load 2.50  portion 320  gross 700
#   AN-Y-VGML ECONOMY/VGML/CHILL   1650c  shelf 72h  load 0.00  portion 310  gross 690
#   Truck HL-101 (OSL, buffer 20min); Stand A12 (OSL, max_concurrent_runs 2)
#   Flight AN411 std 2026-09-15T10:00:00Z -> revised_std 10:00, cutoff 2026-09-14T22:00:00Z,
#   plan at 04:00 -> CHILL release_deadline 08:30, HOT release_deadline 08:00

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: bonded_uplift_net_cost_cannot_diverge_from_gross_uplifted
        grounds:
          - calculations.uplift_cost_reconciliation
          - calculations.flight_billing_total
          - entities.UpliftRecord.fields.net_cost_cents
          - state_machines.UpliftRecord.DRAFT_to_DISPOSITIONED
          - validations[priority=85]
        distinguishing_aspect: |
          The GROSS_UPLIFTED and NET_CONSUMED variants of uplift_cost_reconciliation are evaluated on
          the same 180 ACTIVE cart units of a BONDED airline, and the regime forces credit_basis_units
          to 0, so net_cost_cents == gross_cost_cents == 292320 and the delta is exactly 0 — the
          variant that a DOMESTIC airline uses to reduce the bill is structurally unavailable here.
        test_recipe:
          setup:
            - "Airline AN is BONDED with unused_recovery_rate_pct 30.00 and cost_cap_per_pax_cents 6000."
            - "Flight AN411 carries 180 locked ECONOMY passengers and no special meal orders, so the FINAL requirement is 180 units of AN-Y-STD."
            - "One CHILL batch of 180 units is produced, released, loaded into cart CHL-01, sealed by lm_alice and manifested by lm_bob."
            - "The single delivery run is delivered at 2026-09-15T07:55:00Z, inside its 07:30-08:00 window, so late_penalty_cents is 0."
            - "The UpliftRecord already exists in DRAFT with 170 consumed and 10 returned units."
          setup_api_calls:
            - &c_clk_cfg   { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-12T09:00:00Z" }, as: PlatformAdmin }
            - &c_air_an    { call: "POST /airlines", payload: { name: "AeroNordic", iata_code: "AN", waste_regime: "BONDED", cost_cap_per_pax_cents: 6000 }, as: PlatformAdmin, captures: { an_id: $.data.id } }
            - &c_spec_f    { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-F-STD", cabin: "FIRST", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 420, gross_weight_grams: 900, unit_cost_cents: 4200, shelf_life_hours: 4, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_f_id: $.data.id } }
            - &c_spec_c    { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-C-STD", cabin: "BUSINESS", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 380, gross_weight_grams: 850, unit_cost_cents: 3900, shelf_life_hours: 4, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 5.00 }, as: PlatformAdmin, captures: { spec_c_id: $.data.id } }
            - &c_spec_y    { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-STD", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"], load_factor_pct: 2.50 }, as: PlatformAdmin, captures: { spec_y_id: $.data.id } }
            - &c_spec_v    { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-VGML", cabin: "ECONOMY", meal_code: "VGML", storage_class: "CHILL", portion_grams: 310, gross_weight_grams: 690, unit_cost_cents: 1650, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_v_id: $.data.id } }
            - &c_truck1    { call: "POST /trucks", payload: { station_code: "OSL", registration: "HL-101", buffer_minutes: 20 }, as: PlatformAdmin, captures: { truck1_id: $.data.id } }
            - &c_stand1    { call: "POST /stands", payload: { station_code: "OSL", stand_code: "A12", max_concurrent_runs: 2 }, as: PlatformAdmin, captures: { stand1_id: $.data.id } }
            - &c_flt_y180  { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN411", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-AAA", station_code: "OSL", pax_economy: 180 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
            - &c_clk_lock  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T03:00:00Z" }, as: PlatformAdmin }
            - &c_lock_y    { call: "POST /flights/${f_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - &c_clk_plan  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T04:00:00Z" }, as: PlatformAdmin }
            - &c_plan_y180 { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b_y_id: "$.data[0].id" } }
            - &c_clk_prod  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T04:30:00Z" }, as: PlatformAdmin }
            - &c_start_y   { call: "POST /production-batches/${b_y_id}/start", payload: {}, as: ProductionSupervisor }
            - &c_clk_qa    { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T05:00:00Z" }, as: PlatformAdmin }
            - &c_hc_y_ch   { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "CHILL_DOWN", measured_temp_c: 6.0 }, as: QaOfficer }
            - &c_hc_y_hd   { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer }
            - &c_clk_cmpl  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T05:30:00Z" }, as: PlatformAdmin }
            - &c_cmpl_y180 { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 180 }, as: ProductionSupervisor }
            - &c_rel_y     { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor }
            - &c_clk_cart  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T06:10:00Z" }, as: PlatformAdmin }
            - &c_cart_y    { call: "POST /carts", payload: { flight_id: "${f_id}", cart_code: "CHL-01", cart_type: "STD_FULL", storage_class: "CHILL", capacity_units: 200, galley_position: "G1" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_y_id: $.data.id } }
            - &c_item_y180 { call: "POST /carts/${cart_y_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 180 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item_y_id: $.data.id } }
            - &c_build_y   { call: "POST /carts/${cart_y_id}/build-completion", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - &c_getcart_y { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_y_v1: $.data.version } }
            - &c_seal_y    { call: "POST /carts/${cart_y_id}/seals", payload: { expected_cart_version: "${cart_y_v1}", seal_number: "SEAL-AN411-01" }, as: LoadMaster, as_user_id: "lm_alice" }
            - &c_clk_mfst  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:00:00Z" }, as: PlatformAdmin }
            - &c_getflt_1  { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob", captures: { f_v1: $.data.version } }
            - &c_mfst_y    { call: "POST /flights/${f_id}/loading-manifests", payload: { expected_flight_version: "${f_v1}" }, as: LoadMaster, as_user_id: "lm_bob", captures: { mf_id: $.data.id } }
            - &c_issue_y   { call: "POST /loading-manifests/${mf_id}/issue", payload: {}, as: LoadMaster, as_user_id: "lm_bob" }
            - &c_run1      { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T07:30:00Z", window_end_utc: "2026-09-15T08:00:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { run1_id: $.data.id } }
            - &c_clk_disp  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:25:00Z" }, as: PlatformAdmin }
            - &c_disp1     { call: "POST /delivery-runs/${run1_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob" }
            - &c_clk_arr   { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:50:00Z" }, as: PlatformAdmin }
            - &c_arr1      { call: "POST /delivery-runs/${run1_id}/events", payload: { event_type: "ARRIVE" }, as: LoadMaster, as_user_id: "lm_bob" }
            - &c_clk_del   { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:55:00Z" }, as: PlatformAdmin }
            - &c_del1      { call: "POST /delivery-runs/${run1_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob" }
            - &c_clk_upl   { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T13:00:00Z" }, as: PlatformAdmin }
            - &c_getflt_2  { call: "GET /flights/${f_id}", payload: {}, as: ComplianceOfficer, captures: { f_v2: $.data.version } }
            - &c_upl_y     { call: "POST /flights/${f_id}/uplift-records", payload: { expected_flight_version: "${f_v2}", lines: [{ meal_specification_id: "${spec_y_id}", consumed_units: 170, returned_units: 10 }] }, as: ComplianceOfficer, captures: { upl_id: $.data.id, upl_gross: $.data.gross_cost_cents, upl_net_pre: $.data.net_cost_cents, upl_hand_pre: $.data.handling_fee_cents } }
          trigger:
            - &c_disp_y    { call: "POST /uplift-records/${upl_id}/dispositions", payload: { dispositions: [{ meal_specification_id: "${spec_y_id}", reuse_units: 0, donate_units: 0, destroy_units: 10 }] }, as: ComplianceOfficer }
          assert:
            - "${upl_gross} == 292320 — GROSS_UPLIFTED over the single ACTIVE cart line: round_half_up(180 * 1450 * 1.12)"
            - "UpliftRecord.${upl_id}.uplifted_units == 180, consumed_units == 170, returned_units == 10"
            - "${upl_net_pre} == 292320 and ${upl_hand_pre} == 20462 — before dispositions the NET_CONSUMED variant has no credit basis at all"
            - "UpliftRecord.${upl_id}.net_cost_cents == 292320 after dispositions — the two variants differ by exactly 0 because credit_basis_units == 0 + 0 == 0"
            - "UpliftRecord.${upl_id}.handling_fee_cents == 20462 == round_half_up(292320 * 0.07) and billing_total_cents == 312782"
            - "UpliftRecord.${upl_id}.late_penalty_cents == 0 and spec_deviation_pct == 0.00 and seal_mismatch_count == 0"
            - "UpliftRecord.${upl_id}.status == DISPOSITIONED"
            - "ProductionBatch.${b_y_id}.production_status == DISPOSED — destroy_units 10 >= 1 moved the released batch"

      - name: domestic_uplift_net_cost_credits_reuse_and_donate_at_the_weighted_rate
        grounds:
          - calculations.uplift_cost_reconciliation
          - calculations.flight_billing_total
          - entities.Airline.fields.unused_recovery_rate_pct
          - state_machines.UpliftRecord.DRAFT_to_DISPOSITIONED
          - errors[ERR_BONDED_REUSE_FORBIDDEN]
        distinguishing_aspect: |
          On byte-identical uplift inputs (180 ACTIVE units of a 1450-cent ECONOMY specification, 170
          consumed and 10 returned) a DOMESTIC airline's NET_CONSUMED variant credits the 7 reused
          plus 3 donated units at the once-rounded weighted_rate_cents 1624 and 30.00% recovery,
          giving net_cost_cents 287448 against gross_cost_cents 292320 — a delta of exactly 4872 that
          also re-derives handling_fee_cents from 20462 down to 20121.
        test_recipe:
          setup:
            - "Airline SB is DOMESTIC with unused_recovery_rate_pct 30.00, so reuse and donate both earn credit."
            - "Flight SB222 carries 180 locked ECONOMY passengers and is produced, loaded, sealed, manifested and delivered on time exactly like AN411."
            - "The UpliftRecord exists in DRAFT with 170 consumed and 10 returned units of SB-Y-STD."
          setup_api_calls:
            - *c_clk_cfg
            - &c_air_sb    { call: "POST /airlines", payload: { name: "Sunbridge Airways", iata_code: "SB", waste_regime: "DOMESTIC", cost_cap_per_pax_cents: 6000 }, as: PlatformAdmin, captures: { sb_id: $.data.id } }
            - &c_spec_sb_y { call: "POST /meal-specifications", payload: { airline_id: "${sb_id}", spec_code: "SB-Y-STD", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"], load_factor_pct: 2.50 }, as: PlatformAdmin, captures: { spec_sb_y_id: $.data.id } }
            - *c_truck1
            - *c_stand1
            - { call: "POST /flights", payload: { airline_id: "${sb_id}", flight_number: "SB222", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "SE-BBB", station_code: "OSL", pax_economy: 180 }, as: ScheduleFeedOperator, captures: { f_sb_id: $.data.id } }
            - *c_clk_lock
            - { call: "POST /flights/${f_sb_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - *c_clk_plan
            - { call: "POST /flights/${f_sb_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b_sb_id: "$.data[0].id" } }
            - *c_clk_prod
            - { call: "POST /production-batches/${b_sb_id}/start", payload: {}, as: ProductionSupervisor }
            - *c_clk_qa
            - { call: "POST /production-batches/${b_sb_id}/haccp-checks", payload: { step_code: "CHILL_DOWN", measured_temp_c: 6.0 }, as: QaOfficer }
            - { call: "POST /production-batches/${b_sb_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer }
            - *c_clk_cmpl
            - { call: "POST /production-batches/${b_sb_id}/complete", payload: { produced_qty: 180 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${b_sb_id}/release", payload: {}, as: ProductionSupervisor }
            - *c_clk_cart
            - { call: "POST /carts", payload: { flight_id: "${f_sb_id}", cart_code: "CHL-01", cart_type: "STD_FULL", storage_class: "CHILL", capacity_units: 200, galley_position: "G1" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_sb_id: $.data.id } }
            - { call: "POST /carts/${cart_sb_id}/items", payload: { production_batch_id: "${b_sb_id}", qty_units: 180 }, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "POST /carts/${cart_sb_id}/build-completion", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /carts/${cart_sb_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_sb_v1: $.data.version } }
            - { call: "POST /carts/${cart_sb_id}/seals", payload: { expected_cart_version: "${cart_sb_v1}", seal_number: "SEAL-SB222-01" }, as: LoadMaster, as_user_id: "lm_alice" }
            - *c_clk_mfst
            - { call: "GET /flights/${f_sb_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob", captures: { f_sb_v1: $.data.version } }
            - { call: "POST /flights/${f_sb_id}/loading-manifests", payload: { expected_flight_version: "${f_sb_v1}" }, as: LoadMaster, as_user_id: "lm_bob", captures: { mf_sb_id: $.data.id } }
            - { call: "POST /loading-manifests/${mf_sb_id}/issue", payload: {}, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_sb_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T07:30:00Z", window_end_utc: "2026-09-15T08:00:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { run_sb_id: $.data.id } }
            - *c_clk_disp
            - { call: "POST /delivery-runs/${run_sb_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob" }
            - *c_clk_arr
            - { call: "POST /delivery-runs/${run_sb_id}/events", payload: { event_type: "ARRIVE" }, as: LoadMaster, as_user_id: "lm_bob" }
            - *c_clk_del
            - { call: "POST /delivery-runs/${run_sb_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob" }
            - *c_clk_upl
            - { call: "GET /flights/${f_sb_id}", payload: {}, as: ComplianceOfficer, captures: { f_sb_v2: $.data.version } }
            - { call: "POST /flights/${f_sb_id}/uplift-records", payload: { expected_flight_version: "${f_sb_v2}", lines: [{ meal_specification_id: "${spec_sb_y_id}", consumed_units: 170, returned_units: 10 }] }, as: ComplianceOfficer, captures: { upl_sb_id: $.data.id, sb_gross: $.data.gross_cost_cents, sb_net_pre: $.data.net_cost_cents, sb_hand_pre: $.data.handling_fee_cents } }
          trigger:
            - { call: "POST /uplift-records/${upl_sb_id}/dispositions", payload: { dispositions: [{ meal_specification_id: "${spec_sb_y_id}", reuse_units: 7, donate_units: 3, destroy_units: 0 }] }, as: ComplianceOfficer }
          assert:
            - "${sb_gross} == 292320 — identical GROSS_UPLIFTED input to the BONDED instance"
            - "${sb_net_pre} == 292320 and ${sb_hand_pre} == 20462 — the DRAFT record has not yet applied any credit"
            - "UpliftRecord.${upl_sb_id}.net_cost_cents == 287448 — weighted_rate_cents == round_half_up(292320/180) == 1624 rounded ONCE, credit_basis_units == 7 + 3 == 10, credit_cents == round_half_up(10 * 1624 * 30.00 / 100) == 4872"
            - "${sb_gross} - UpliftRecord.${upl_sb_id}.net_cost_cents == 4872 — the DOMESTIC delta the BONDED instance can never produce"
            - "UpliftRecord.${upl_sb_id}.handling_fee_cents == 20121 == round_half_up(287448 * 0.07), re-derived from the NET figure, not from 292320"
            - "UpliftRecord.${upl_sb_id}.billing_total_cents == 307569 == 287448 + 20121 + 0"
            - "UpliftRecord.${upl_sb_id}.status == DISPOSITIONED"
            - "ProductionBatch.${b_sb_id}.production_status == RELEASED — destroy_units 0 leaves the batch undisposed"

      - name: provisional_and_final_meal_requirement_diverge_on_load_factor_and_special_meals
        grounds:
          - calculations.flight_meal_requirement
          - calculations.production_plan_zone_allocation
          - entities.Flight.fields.units_planned_provisional
          - entities.Flight.fields.units_planned
          - state_machines.Flight.COUNTS_LOCKED_to_PLANNED
          - state_machines.SpecialMealOrder.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          On one passenger mix (7 FIRST / 23 BUSINESS / 181 ECONOMY plus three CONFIRMED ECONOMY VGML
          orders) the PROVISIONAL variant applies per-specification load factors and ignores special
          meal orders entirely, yielding units_planned_provisional 218, while the FINAL variant drops
          the load factors and substitutes one special tray per CONFIRMED order, yielding
          units_planned 211 — a divergence of exactly 7 units in opposite directions per cabin.
        test_recipe:
          setup:
            - "Airline AN has all four specifications ACTIVE with load factors 0.00 / 5.00 / 2.50 / 0.00."
            - "Flight AN412 carries 7 FIRST, 23 BUSINESS and 181 ECONOMY passengers."
            - "Three AN-Y-VGML special meal orders are captured at 2026-09-14T12:00:00Z, before the 2026-09-14T22:00:00Z cutoff, and become CONFIRMED when the counts lock."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_f
            - *c_spec_c
            - *c_spec_y
            - *c_spec_v
            - &c_flt_tierL { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN412", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-BBB", station_code: "OSL", pax_first: 7, pax_business: 23, pax_economy: 181 }, as: ScheduleFeedOperator, captures: { f_l_id: $.data.id } }
            - &c_getflt_L0 { call: "GET /flights/${f_l_id}", payload: {}, as: ProductionSupervisor, captures: { prov_l: $.data.units_planned_provisional, cutoff_l: $.data.special_meal_cutoff_utc } }
            - &c_clk_ord   { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-14T12:00:00Z" }, as: PlatformAdmin }
            - &c_smo_v1    { call: "POST /special-meal-orders", payload: { flight_id: "${f_l_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PAX-001", seat_number: "31A" }, as: AirlineRep, as_user_id: "${an_id}", captures: { smo1_id: $.data.id } }
            - &c_smo_v2    { call: "POST /special-meal-orders", payload: { flight_id: "${f_l_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PAX-002", seat_number: "31B" }, as: AirlineRep, as_user_id: "${an_id}", captures: { smo2_id: $.data.id } }
            - &c_smo_v3    { call: "POST /special-meal-orders", payload: { flight_id: "${f_l_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PAX-003", seat_number: "31C" }, as: AirlineRep, as_user_id: "${an_id}", captures: { smo3_id: $.data.id } }
            - *c_clk_lock
            - &c_lock_L    { call: "POST /flights/${f_l_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - *c_clk_plan
          trigger:
