      - name: withdraw_and_reinstate_guards_over_occupancy_and_substitution_fees
        claim_type: violation_to_error
        grounds:
          - validations.priority_12
          - validations.priority_31
          - validations.priority_42
          - validations.priority_47
          - errors[ERR_UNIT_OCCUPANCY_STATE_INVALID]
          - errors[ERR_NO_SUBSTITUTION_FEE]
          - errors[ERR_SUBSTITUTION_FEE_PAID]
          - errors[ERR_NO_REMAINING_OBLIGATION]
        distinguishing_aspect: |
          Reinstating a withdrawn unit has to un-do the substitution assessment the withdrawal
          created, and the two failure modes are opposite ends of that assessment's payment
          history: a PARTIALLY_PAID substitution assessment still exists but may not be
          rescinded (ERR_SUBSTITUTION_FEE_PAID at priority 47), while a fully PAID one is no
          longer an open assessment at all, so the selection step finds nothing and reports
          ERR_NO_SUBSTITUTION_FEE at priority 31. Once that payment has closed the project's
          obligation the fiscal guard also flips: a further FULL assessment is refused with
          ERR_NO_REMAINING_OBLIGATION even though the project has only one standing unit.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, approval 2026-01-15, dev-1) screened SUBJECT (2 units, 20000 bps), ONSITE elected, agreement recorded, with RENTAL 2br units WD-101 and WD-102."
            - "WD-101 is withdrawn, which cascades a SUBSTITUTION assessment pricing that unit's 10000 bps: base 24000000, surcharge 840000, pre-discount 24840000, 150 bps tier, assessed 24467400."
