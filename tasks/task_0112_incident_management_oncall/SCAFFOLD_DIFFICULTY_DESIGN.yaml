            - call: "GET /services/${s_id}"
              payload: {}
              as: IncidentCommander
              captures: { consumed: $.data.error_budget_consumed_minutes }
          assert:
            - "Incident.${inc_id}.lifecycle_status == 'SUPPRESSED'"
            - "Incident.${inc_id}.counts_against_budget == false"
            - "Service.${s_id}.error_budget_consumed_minutes == 0 (unchanged from pre-incident value; invariant: suppressed incidents never consume budget)"

      - name: action_item_cancel_conserves_open_count
        grounds:
          - state_machines.ActionItem.OPEN_to_CANCELLED
          - entities.Postmortem.fields.open_action_item_count
          - state_machines.ActionItem.OPEN_to_IN_PROGRESS
        distinguishing_aspect: |
          Conserved quantity #2 = Postmortem.open_action_item_count (a count, not minutes).
          Creating an action item bumps the count to 1; cancelling it (the compensating
          action) returns the count to 0, the exact pre-creation value.
        test_recipe:
          setup:
            - "Postmortem PM on a resolved incident with one OPEN action item (count=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550015" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /postmortems"
              payload: { incident_id: "${inc_id}", summary: "rca" }
              as: IncidentCommander
              captures: { pm_id: $.data.id }
            - call: "POST /action-items"
              payload: { postmortem_id: "${pm_id}", owner_responder_id: "${r_id}", description: "fix" }
              as: IncidentCommander
              captures: { ai_id: $.data.id }
          trigger:
            - call: "POST /action-items/${ai_id}/cancel"
              payload: {}
              as: IncidentCommander
            - call: "GET /postmortems/${pm_id}"
              payload: {}
              as: IncidentCommander
              captures: { open_count: $.data.open_action_item_count }
          assert:
            - "ActionItem.${ai_id}.status == 'CANCELLED'"
            - "Postmortem.${pm_id}.open_action_item_count == 0 (restored to pre-creation value)"
