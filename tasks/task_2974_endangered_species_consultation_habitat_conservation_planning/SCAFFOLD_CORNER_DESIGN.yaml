              as: Anonymous
              captures: {e_an1: "$.data.error_id"}
            - call: "GET /species/${species_e_id}"
              payload: {}
              as: Anonymous
              captures: {e_an2: "$.data.error_id"}
            - call: "POST /species"
              payload: {scientific_name: "Rana draytonii", common_name: "California red-legged frog", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.30, recovery_unit_population: 5000, survey_season_start_month: 4, survey_season_end_month: 7}
