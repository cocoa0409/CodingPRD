            - "Seller.${s_id}.enforcement_state == WATCHLIST"

      - name: validation_only_one_plan_may_be_open_per_action
        claim_type: violation_to_error
        grounds:
          - "validations.priority_120 (ERR_POA_ALREADY_OPEN)"
          - "endpoints[POST /plans-of-action].side_effects"
        distinguishing_aspect: |
          A second plan is refused while the first is still SUBMITTED — the resubmission path exists
          only from RETURNED_FOR_REVISION. The OCC token has to be refreshed first because the first
          plan bumped the action's version, so the 409 is reached only after priority 90 is
          satisfied; a stale token would have produced 412 instead and hidden this rule.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-POA-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa true); one violation carried to SUBSTANTIATED; action a1 (version 2 after issuance)."
            - "Plan p1 submitted, which raises the action's version to 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-POA-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-POA-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_v1: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our catalogue feed mapped the wrong attribute set onto refurbished units, so the condition field was wrong.", corrective_measures: ["Corrected the condition attribute on all 42 affected listings."], preventive_measures: ["Added a pre-publish check that blocks refurbished units without a condition note."], expected_enforcement_action_version: "${a1_v1}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p1: $.data.id, p1_state: $.data.state }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { a1_v2: $.data.version }
          trigger:
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "A second attempt at the same explanation, restating the catalogue mapping defect in more detail.", corrective_measures: ["Re-checked the remaining catalogue rows for the same defect."], preventive_measures: ["Scheduled a weekly attribute audit of refurbished inventory."], expected_enforcement_action_version: "${a1_v2}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "${a1_v1} == 2 and ${a1_v2} == 3   # plan creation bumped the action"
            - "${p1_state} == SUBMITTED"
            - "trigger: HTTP 409 and ${err_code} == ERR_POA_ALREADY_OPEN   # not 412 — the token was fresh"
            - "plan list for ${a1}: total_count == 1"
            - "EnforcementAction.${a1}.version == 3   # the refused write did not bump it again"
            - "PlanOfAction.${p1}.revision_count == 0"

      - name: validation_request_shape_is_checked_before_plan_completeness
        claim_type: cascading_validation
        grounds:
          - "validations.priority_70 (ERR_INVALID_REQUEST)"
          - "validations.priority_72 (ERR_POA_INCOMPLETE)"
          - "entities.PlanOfAction.fields.root_cause"
        distinguishing_aspect: |
          Two adjacent priorities on the same endpoint must be distinguished: an ABSENT root_cause is
          a shape failure (priority 70, ERR_INVALID_REQUEST) while a PRESENT-but-short root_cause and
          a too-short measure element are completeness failures (priority 72, ERR_POA_INCOMPLETE).
          Both 422 refusals sit just under their own floor — 36 characters against the 40-character
          root_cause minimum and a 9-character measure against the 10-character element minimum — and
          every refusal leaves the action's version untouched, which is why the same OCC token can be
          reused for all four attempts.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-INC-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa true); one violation carried to SUBSTANTIATED; action a1 at version 2."
            - "The short root_cause is 36 characters; the accepted one is 107 characters; the short measure element 'Fixed it.' is 9 characters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-INC-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-INC-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_v: $.data.version }
          trigger:
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", corrective_measures: ["Corrected the condition attribute on all 42 affected listings."], preventive_measures: ["Added a pre-publish check for refurbished units."], expected_enforcement_action_version: "${a1_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_missing: $.data.error_id }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our feed mapped the wrong attributes", corrective_measures: ["Corrected the condition attribute on all 42 affected listings."], preventive_measures: ["Added a pre-publish check for refurbished units."], expected_enforcement_action_version: "${a1_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_short: $.data.error_id }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our catalogue feed mapped the wrong attribute set onto refurbished units, so the condition field was wrong.", corrective_measures: ["Fixed it."], preventive_measures: ["Added a pre-publish check for refurbished units."], expected_enforcement_action_version: "${a1_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_element: $.data.error_id }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our catalogue feed mapped the wrong attribute set onto refurbished units, so the condition field was wrong.", corrective_measures: ["Corrected the condition attribute on all 42 affected listings."], preventive_measures: ["Added a pre-publish check for refurbished units."], expected_enforcement_action_version: "${a1_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p1: $.data.id, p1_deadline: $.data.deadline_at }
          assert:
            - "first call (root_cause absent): HTTP 400 and ${err_missing} == ERR_INVALID_REQUEST   # priority 70 runs before 72"
            - "second call (root_cause 36 chars, under the 40-character floor): HTTP 422 and ${err_short} == ERR_POA_INCOMPLETE"
            - "third call (a 10-character-minimum measure element violated by 'Fixed it.'): HTTP 422 and ${err_element} == ERR_POA_INCOMPLETE"
            - "fourth call: HTTP 201 and ${p1_deadline} == 2026-08-18T00:00:00.000Z   # issued_at + POA_DEADLINE_DAYS 17"
            - "PlanOfAction.${p1}.state == SUBMITTED and revision_count == 0"
            - "EnforcementAction.${a1}.version == 3   # exactly one successful write, so ${a1_v} stayed valid for all four attempts"

      - name: validation_banned_seller_is_write_frozen_except_for_money_in
        claim_type: conditional_validation
        grounds:
          - "validations.priority_80 (ERR_SELLER_BANNED)"
          - "errors[ERR_SELLER_BANNED].condition"
          - "state_machines.Seller.enforcement_state.transitions (FINAL_DENIED ban)"
        distinguishing_aspect: |
          Priority 80 freezes writes for a banned seller, but the exemption list is exact: proceeds
          credits still land (the marketplace owes money it already collected), while a listing
          creation and a metric snapshot are both refused with the SAME error even though they sit on
          different roles and different collections. The ban arrives through the escalation path —
          FINAL_DENIED against an ACCOUNT_SUSPENSION action — so ban_reason is ESCALATION_EXHAUSTED
          rather than RELATED_ACCOUNT_CONFIRMED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule SP-BAN-1 (SHIPPING_PERFORMANCE, base 8.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000 cents, then suspended through an ACCOUNT_SUSPENSION override: the FULL_HOLD cascade mints one hold of 100000 and leaves available_balance_cents 0."
            - "Appeal ap1 -> UNDER_REVIEW (ar-1) -> DENIED -> escalated by the seller -> FINAL_DENIED by co-1, which bans the account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "SP-BAN-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 8.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-BAN-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The shipping delays were caused by a regional carrier outage outside our control." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "EVIDENCE_UPHELD", rationale: "Carrier records show the delays predate the outage window the seller cites." }
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/escalate"
              payload: { escalation_grounds: "We are submitting the carrier's own incident report, which was issued after the decision." }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "EVIDENCE_UPHELD", rationale: "The incident report covers a different region than the affected orders." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ap1_state: $.data.state }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "HT-SKU-002", title: "Replacement vice jaws", category_code: "TOOLS-HAND" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_listing: $.data.error_id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 10, delivered_or_refunded_volume: 10, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 10, shipments_with_valid_tracking: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_snapshot: $.data.error_id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 5000, external_reference: "SETTLE-2026-08-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { avail: $.data.available_balance_cents, credited: $.data.lifetime_credited_cents }
          assert:
            - "${ap1_state} == FINAL_DENIED"
            - "Seller.${s_id}.enforcement_state == BANNED and ban_reason == ESCALATION_EXHAUSTED"
            - "Seller.${s_id}.disbursement_state == FULL_HOLD"
            - "first call: HTTP 409 and ${err_listing} == ERR_SELLER_BANNED"
            - "second call: HTTP 409 and ${err_snapshot} == ERR_SELLER_BANNED   # a ComplianceOfficer write is frozen too"
            - "third call: HTTP 201, ${avail} == 5000 and ${credited} == 105000   # credits are exempt"
            - "Seller.${s_id}.held_balance_cents == 100000 and available + held == lifetime_credited - lifetime_debited"
            - "listing list for ${s_id}: total_count == 0 and snapshot list: total_count == 0"

      - name: validation_forfeit_cannot_exceed_the_hold_amount
        claim_type: violation_to_error
        grounds:
          - "validations.priority_140 (ERR_FORFEIT_EXCEEDS_HOLD)"
          - "endpoints[POST /disbursement-holds/{id}/forfeit].side_effects"
        distinguishing_aspect: |
          The fiscal ceiling on a forfeit is the HOLD's held_amount_cents, not the seller's ledger:
          one cent over the 100000-cent cascade hold is refused even though the seller is banned and
          the officer is authorised. The forfeit endpoint is one of the three writes exempt from
          priority 80, so the refusal is 422 and not ERR_SELLER_BANNED, and the hold stays ACTIVE
          with forfeited_amount_cents 0.
        test_recipe:
          setup:
            - "Identical fixture to validation_banned_seller_is_write_frozen_except_for_money_in up to the FINAL_DENIED ban, with no extra credit afterwards."
            - "The cascade-minted FULL_HOLD row carries held_amount_cents 100000 and auto_created true."
            - "co-2 performs the forfeit so that the segregation rule against the hold's creator cannot interfere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "SP-FORF-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 8.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-FORF-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The shipping delays were caused by a regional carrier outage outside our control." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "EVIDENCE_UPHELD", rationale: "Carrier records show the delays predate the outage window the seller cites." }
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/escalate"
              payload: { escalation_grounds: "We are submitting the carrier's own incident report, which was issued after the decision." }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "EVIDENCE_UPHELD", rationale: "The incident report covers a different region than the affected orders." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { h_full: "$.data[0].id", h_amount: "$.data[0].held_amount_cents", h_type: "$.data[0].hold_type" }
          trigger:
            - call: "POST /disbursement-holds/${h_full}/forfeit"
              payload: { forfeited_amount_cents: 100001 }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err_code: $.data.error_id }
          assert:
            - "${h_type} == FULL_HOLD and ${h_amount} == 100000"
            - "trigger: HTTP 422 and ${err_code} == ERR_FORFEIT_EXCEEDS_HOLD   # one cent over"
            - "DisbursementHold.${h_full}.state == ACTIVE and forfeited_amount_cents == 0 and released_at == null"
            - "Seller.${s_id}.held_balance_cents == 100000, available_balance_cents == 0, lifetime_debited_cents == 0"
            - "Seller.${s_id}.enforcement_state == BANNED   # the refusal did not disturb the posture"

      - name: validation_role_check_precedes_path_existence
        claim_type: priority_ordering
        grounds:
          - "validations.priority_20 (ERR_UNAUTHORIZED)"
          - "validations.priority_30 (ERR_VIOLATION_NOT_FOUND)"
        distinguishing_aspect: |
          The same request differs only in the acting role. A Seller adjudicating an unknown
          violation id gets ERR_UNAUTHORIZED (priority 20) — the 404 is never reached, so an
          unauthorised caller cannot probe which ids exist. The investigator issuing the identical
          request gets ERR_VIOLATION_NOT_FOUND (priority 30).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one registered seller; no Violation rows at all."
            - "00000000-0000-4000-8000-00000000dead is a well-formed id that resolves to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /violations/00000000-0000-4000-8000-00000000dead/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_role: $.data.error_id }
            - call: "POST /violations/00000000-0000-4000-8000-00000000dead/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "first call: HTTP 403 and ${err_role} == ERR_UNAUTHORIZED   # priority 20 wins over priority 30"
            - "second call: HTTP 404 and ${err_missing} == ERR_VIOLATION_NOT_FOUND"
            - "no rows were created or modified by either call"

      - name: validation_reserve_exactly_at_the_available_balance_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - "validations.priority_140 (ERR_HOLD_EXCEEDS_AVAILABLE)"
          - "calculations.reserve_requirement_cents.variants.CLAIM_EXPOSURE"
        distinguishing_aspect: |
          The fiscal rule refuses an amount that EXCEEDS the available balance, so an exposure
          reserve of exactly 90000 against a balance of exactly 90000 must be accepted and drain the
          available balance to zero. This is the satisfied side of the same predicate that
          validation_reserve_holds_are_capped_by_the_collective_balance violates, on an amount the
          CLAIM_EXPOSURE basis computes without ever consulting the balance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-EXACT-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "Seller credited exactly 90000 cents; snapshot [2026-07-01, 2026-08-01) with defect_claims_pending 10 -> open_defect_claim_units 10."
            - "One violation moved to UNDER_INVESTIGATION -> RESERVE_HELD; risk_tier TIER_1 (balance 0.00, metric_tier null)."
            - "CLAIM_EXPOSURE amount = 10 x 9000 x 1.00 = 90000 == available_balance_cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-EXACT-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 90000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 100, delivered_or_refunded_volume: 100, defect_claims_pending: 10, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 100, shipments_with_valid_tracking: 100 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-EXACT-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "CLAIM_EXPOSURE", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents, h1_tier: $.data.risk_tier }
          assert:
            - "HTTP 201 — equality is not an excess"
            - "${h1_amount} == 90000 and ${h1_tier} == TIER_1"
            - "DisbursementHold.${h1}.state == ACTIVE, hold_type RESERVE, reserve_basis CLAIM_EXPOSURE, auto_created false"
            - "Seller.${s_id}.available_balance_cents == 0 and held_balance_cents == 90000"
            - "Seller.${s_id}.disbursement_state == RESERVE_HELD and enforcement_state == ACTIVE"
            - "a FUNDS_HELD Notification exists with amount_cents 90000"

      - name: validation_posture_state_check_precedes_fiscal_capacity
        claim_type: priority_conflict
        grounds:
          - "validations.priority_85 (ERR_SELLER_NOT_UNDER_HOLD_POSTURE)"
          - "validations.priority_140 (ERR_HOLD_EXCEEDS_AVAILABLE)"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / hold_posture_state_check_beats_fiscal_capacity_check
          rationale: "That §1.8 instance violates both rules with one request and asserts the priority-85 error, then repairs each violation in turn."

      - name: validation_temporal_window_precedes_referential_coherence
        claim_type: priority_conflict
        grounds:
          - "validations.priority_110 (ERR_APPEAL_WINDOW_CLOSED)"
          - "validations.priority_130 (ERR_POA_ACTION_MISMATCH)"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appeal_window_temporal_beats_poa_action_mismatch_referential
          rationale: "That §1.8 instance files one appeal that is both out of window and citing the wrong action's plan."

      - name: validation_ownership_precedes_state_eligibility
        claim_type: priority_conflict
        grounds:
          - "validations.priority_50 (ERR_NOT_RESOURCE_OWNER)"
          - "validations.priority_85 (ERR_ACTION_NOT_APPEALABLE_STATE)"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / acknowledge_ownership_auth_beats_action_not_appealable_state
          rationale: "That §1.8 instance has the wrong seller acknowledge an already-UPHELD action and asserts the priority-50 error."

      - name: validation_snapshot_windows_may_not_overlap_per_source
        claim_type: temporal_validation
        grounds:
          - "validations.priority_110 (ERR_SNAPSHOT_WINDOW_OVERLAP)"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / snapshot_half_open_windows_touch_legally_but_overlap_is_rejected_per_source
          rationale: "That §1.8 instance covers the touching-endpoint acceptance, the one-second intrusion and the per-source partition."

      - name: validation_hold_coverage_needs_more_than_the_buffer
        claim_type: temporal_validation
        grounds:
          - "validations.priority_110 (ERR_HOLD_COVERAGE_OVERLAP)"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_coverage_closed_intervals_require_buffer_separation
          rationale: "That §1.8 instance asserts the exactly-24-hour gap is rejected while a longer gap is accepted."

      - name: validation_plan_returns_are_capped_by_the_revision_limit
        claim_type: aggregate_validation
        grounds:
          - "validations.priority_120 (ERR_POA_REVISION_LIMIT)"
        excluded_because:
          difficulty_instance: non_linear_state_machine / poa_return_resubmit_cycle_hits_revision_limit
          rationale: "That §1.8 instance walks the whole return/resubmit cycle until POA_MAX_REVISIONS is exhausted."

      - name: validation_action_requires_a_substantiated_violation
        claim_type: cross_entity_validation
        grounds:
          - "validations.priority_85 (ERR_VIOLATION_NOT_SUBSTANTIATED)"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / action_issuance_requires_substantiated_violation
          rationale: "That §1.8 instance issues against REPORTED, UNDER_INVESTIGATION and DISMISSED violations before the SUBSTANTIATED one succeeds."

  # =========================================================================
  # SECTION 5 — Endpoints (§1.5)
  # =========================================================================
  - section: endpoints
    instances:

      - name: endpoint_policy_rule_create_and_filtered_list
        claim_type: standard_crud
        grounds:
          - "endpoints[POST /policy-rules]"
          - "endpoints[GET /policy-rules]"
          - "response_envelope.pagination"
        distinguishing_aspect: |
          The catalogue is append-only by design: §1.5 declares POST and GET for /policy-rules and no
          PUT, PATCH, DELETE or by-id read anywhere in the API, so "read" means the filtered list and
          the update/delete halves of CRUD must not exist. The category filter and the pagination
          envelope have to compose — total_count counts the FILTERED set, not the whole table.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Three rules are created: two LISTING_ACCURACY and one INTELLECTUAL_PROPERTY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /policy-rules"
              payload: { code: "LA-CRUD-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r1: $.data.id, r1_decay: $.data.decay_exempt }
            - call: "POST /policy-rules"
              payload: { code: "LA-CRUD-2", category: "LISTING_ACCURACY", base_severity_weight: 3.50, removal_scope: "LISTING" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r2: $.data.id, r2_poa: $.data.requires_poa }
            - call: "POST /policy-rules"
              payload: { code: "IP-CRUD-1", category: "INTELLECTUAL_PROPERTY", base_severity_weight: 4.00, removal_scope: "LISTING", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r3: $.data.id, r3_decay: $.data.decay_exempt }
            - call: "GET /policy-rules"
              payload: { category: "LISTING_ACCURACY", limit: 1, offset: 0 }
              as: Seller
              as_user_id: "seller-anon-read"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /policy-rules"
              payload: { limit: 100, offset: 0 }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          assert:
            - "three 201s; ${r1_decay} == false, ${r3_decay} == true, ${r2_poa} == true (default)"
            - "filtered page: HTTP 200, data length 1, total_count == 2, has_more == true   # total_count counts the filtered set"
            - "${page1_first} is one of ${r1} or ${r2}, never ${r3}"
            - "unfiltered page: total_count == 3 and has_more == false"
            - "no PUT, PATCH or DELETE route exists for /policy-rules, and there is no GET /policy-rules/{id}"

      - name: endpoint_dismissing_an_investigation_releases_the_reserve
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /violations/{id}/adjudicate].side_effects"
          - "state_machines.Violation.transitions.UNDER_INVESTIGATION_to_DISMISSED"
          - "state_machines.Seller.disbursement_state.transitions.RESERVE_HELD_to_NORMAL"
        distinguishing_aspect: |
          The DISMISSED branch of the adjudicate action carries a side-effect set the SUBSTANTIATED
          branch does not: with no investigation left open and the enforcement dimension still ACTIVE
          the posture returns to NORMAL, which sweeps the ACTIVE reserve hold to RELEASED with
          release_reason INVESTIGATION_CLOSED and moves the money back to available_balance_cents.
          One action endpoint therefore mutates three entities plus the ledger, and the dismissed
          violation can never be enforced afterwards.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-DIS-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000 cents; violation v1 moved to UNDER_INVESTIGATION -> RESERVE_HELD."
            - "A ROLLING reserve of 10000 (TIER_1) is created, leaving available 90000 / held 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-DIS-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-DIS-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1_state: $.data.state }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv: $.data.version, posture: $.data.disbursement_state }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents }
          trigger:
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "DISMISSED", decision_note: "The buyer photo shows a different item than the one listed." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1_final: $.data.state }
            - call: "GET /sellers/${s_id}/notifications"
              payload: { template_code: "FUNDS_RELEASED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { note_amount: "$.data[0].amount_cents", note_type: "$.data[0].related_entity_type" }
          assert:
            - "${v1_state} == UNDER_INVESTIGATION, ${posture} == RESERVE_HELD, ${h1_amount} == 10000"
            - "trigger: HTTP 200 and ${v1_final} == DISMISSED"
            - "Violation.${v1}.adjudicated_at == 2026-08-01T00:00:00.000Z and decision_note is stored"
            - "DisbursementHold.${h1}.state == RELEASED, release_reason == INVESTIGATION_CLOSED, released_at == 2026-08-01T00:00:00.000Z"
            - "Seller.${s_id}.available_balance_cents == 100000 and held_balance_cents == 0"
            - "Seller.${s_id}.disbursement_state == NORMAL and enforcement_state == ACTIVE"
            - "notification list: total_count == 1, ${note_amount} == 10000, ${note_type} == DISBURSEMENT_HOLD"
            - "issuing an enforcement action for ${v1} is now impossible — the violation is not SUBSTANTIATED"

      - name: endpoint_full_hold_is_cascade_only
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /disbursement-holds].side_effects"
          - "errors[ERR_INVALID_REQUEST].condition"
          - "state_machines.Seller.disbursement_state.transitions (FULL_HOLD entry)"
        distinguishing_aspect: |
          hold_type is a declared input, yet one of its enum members is refused at this endpoint:
          FULL_HOLD rows may only be minted by the suspension cascade, so an explicit FULL_HOLD is a
          priority-70 ERR_INVALID_REQUEST rather than a state or fiscal error. The identical request
          with hold_type RESERVE succeeds, which isolates the enum member as the only cause.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-FH-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000 cents with one violation UNDER_INVESTIGATION -> RESERVE_HELD, risk_tier TIER_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
