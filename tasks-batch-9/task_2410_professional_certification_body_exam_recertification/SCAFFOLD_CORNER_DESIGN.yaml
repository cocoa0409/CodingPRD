            - call: "POST /exam-registrations/${reg_id}/schedule"
              payload: {"session_id": "${sess_id}", "expected_session_version": "${sess_v}"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { e_closed: "$.data.error_id" }
          assert:
            - "trigger[0] responds 422 with ${e_mismatch} == ERR_ELIGIBILITY_PROGRAM_MISMATCH — ExamForm.${formb_id}.program_id is CPY while EligibilityApplication.${app_id}.program_id is CPX"
            - "${e_mismatch} is not ERR_FORM_NOT_PUBLISHED and not ERR_APPLICATION_NOT_APPROVED — the CPY form is PUBLISHED and the CPX application is APPROVED"
            - "trigger[1] responds 201 with ExamRegistration.${reg_id}.attempt_number == 1, seat_status == UNSCHEDULED and session_id == null"
            - "trigger[2] responds 201 with ExamSession.${sess_id}.status == OPEN and seats_reserved == 0 while the clock is still 2026-08-01T00:00:00Z"
            - "after trigger[3] ExamSession.${sess_id}.status == CLOSED — current_utc 2026-08-10T00:00:00Z is exactly starts_at, and the rule is non-strict"
            - "trigger[4] responds 409 with ${e_closed} == ERR_SESSION_CLOSED"
            - "${e_closed} is not ERR_STALE_VERSION — nothing has written the session since ${sess_v} was captured — and not ERR_SESSION_FULL, since seats_reserved 0 < seat_capacity 5"
            - "after trigger[4] ExamRegistration.${reg_id}.seat_status is still UNSCHEDULED and ExamSession.${sess_id}.seats_reserved is still 0"
  # =========================================================================
  - section: endpoints
    instances:
      - name: candidate_create_read_and_list_round_trip_with_a_duplicate_email_rejected
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/candidates
          - endpoints.GET_/candidates/{id}
          - endpoints.GET_/candidates
          - errors.ERR_CANDIDATE_EMAIL_TAKEN
          - response_envelope.pagination_fields
          - entities.Candidate.fields.status
        distinguishing_aspect: |
          Candidate exposes create, read-by-id and filtered list and deliberately no update or
          delete, so the round trip must be exact: the created row reads back byte-identical
          under GET, a second POST reusing the email is refused 409 ERR_CANDIDATE_EMAIL_TAKEN
          without creating a row, and the list endpoint pages two rows with total_count 2 while
          limit 1 returns one of them with has_more true.
        test_recipe:
          setup:
            - "Empty database. The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /candidates"
              payload: {"limit": 1, "offset": 0}
              as: ExamOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /candidates"
              payload: {"email": "cand.a@example.com", "full_name": "Cand A"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { candA_id: "$.data.id" }
            - call: "GET /candidates/${candA_id}"
              payload: {}
              as: EligibilityReviewer
              as_user_id: "elr-1"
            - call: "POST /candidates"
              payload: {"email": "cand.a@example.com", "full_name": "Cand A Duplicate"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { err_email: "$.data.error_id" }
            - call: "POST /candidates"
              payload: {"email": "cand.b@example.com", "full_name": "Cand B"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { candB_id: "$.data.id" }
            - call: "GET /candidates"
              payload: {"status": "ACTIVE", "limit": 1, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "GET /candidates"
              payload: {"status": "ACTIVE", "limit": 1, "offset": 1}
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "trigger[0] responds 201 with Candidate.${candA_id}.status == ACTIVE, barred_until == null, bar_reason == null and version == 1"
            - "trigger[1] responds 200 and returns the same email cand.a@example.com, full_name Cand A, created_at and version as trigger[0]"
            - "trigger[2] responds 409 with ${err_email} == ERR_CANDIDATE_EMAIL_TAKEN and Candidate.${candA_id}.full_name is still Cand A"
            - "after trigger[2] GET /candidates returns total_count == 1 — the duplicate created nothing"
            - "trigger[4] returns exactly 1 row with total_count == 2, limit == 1, offset == 0 and has_more == true"
            - "trigger[5] returns exactly 1 row with total_count == 2, offset == 1 and has_more == false, and the two pages together are {${candA_id}, ${candB_id}}"
      - name: item_review_requires_in_review_and_two_distinct_approvers_who_are_not_the_author
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/items/{id}/review
          - endpoints.POST_/items/{id}/submit-for-review
          - state_machines.Item.DRAFT_to_IN_REVIEW
          - state_machines.Item.IN_REVIEW_to_APPROVED
          - validations[priority=12]
          - validations[priority=19]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.Item.computed_fields.approver_user_ids
        distinguishing_aspect: |
          The action endpoint enforces three separate preconditions in one chain: reviewing a
          DRAFT item is refused 409 ERR_INVALID_STATE, reviewing as the author is refused 409
          ERR_SEGREGATION_OF_DUTIES, and a repeat approval by an existing approver is refused
          for the same reason, so the item only reaches APPROVED on the second DISTINCT non-
          author approval — approver_user_ids must hold exactly two entries at that point, never
          three and never the author.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX with domain D1 in domain_specs."
            - "One Item ${item_id} in status DRAFT authored by isp-author, with approver_user_ids == [] and no statistics."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX item under review"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
          trigger:
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
              captures: { err_state: "$.data.error_id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "first submission"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { err_author: "$.data.error_id" }
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
              captures: { err_repeat: "$.data.error_id" }
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
          assert:
            - "trigger[0] responds 409 with ${err_state} == ERR_INVALID_STATE while Item.${item_id}.status == DRAFT and approver_user_ids == []"
            - "after trigger[1] Item.${item_id}.status == IN_REVIEW and approver_user_ids == []"
            - "trigger[2] responds 409 with ${err_author} == ERR_SEGREGATION_OF_DUTIES because the acting user equals author_user_id isp-author"
            - "after trigger[2] Item.${item_id}.status stays IN_REVIEW and approver_user_ids stays []"
            - "after trigger[3] Item.${item_id}.status is still IN_REVIEW with approver_user_ids == [isp-rev-1] — one approval is not enough"
            - "trigger[4] responds 409 with ${err_repeat} == ERR_SEGREGATION_OF_DUTIES and approver_user_ids stays [isp-rev-1]"
            - "after trigger[5] Item.${item_id}.status == APPROVED with approver_user_ids == [isp-rev-1, isp-rev-2] and p_value == null"
            - "CertificationProgram.${prog_id}.operational_item_count == 0 — APPROVED is not yet OPERATIONAL"
      - name: recertification_run_sweeps_no_shows_and_expired_applications_then_reports_nothing_on_a_rerun
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/recertification-runs
          - state_machines.ExamRegistration.SCHEDULED_to_NO_SHOW
          - state_machines.EligibilityApplication.APPROVED_to_EXPIRED
          - calculations.session_seat_occupancy
          - entities.EligibilityApplication.computed_fields.attempts_consumed
        distinguishing_aspect: |
          The sweep is a multi-step bulk action whose steps run in a fixed order and whose
          second run is a no-op: one call moves the stale SCHEDULED seat to NO_SHOW (releasing
          the seat and consuming an attempt) AND expires the application whose
          eligibility_expires_on has passed, reporting both ids; the immediately repeated call
          reports empty id lists and mutates nothing. A dry_run first reports exactly the same
          ids while leaving every row untouched.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX with one OPERATIONAL item and one PUBLISHED form."
            - "One APPROVED application ${app_id} with eligibility_expires_on 2027-08-01 and attempts_consumed 0."
            - "One ExamRegistration ${reg_id} SCHEDULED into the session ending 2026-08-10T04:00:00Z, so ExamSession.${sess_id}.seats_reserved == 1."
            - "The clock is advanced to 2027-08-02T00:00:00Z, which is after the session end and after eligibility_expires_on."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX operational item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "first submission"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.6}
              as: Panelist
              as_user_id: "pan-1"
              captures: { form_v: "$.data.version" }
            - call: "POST /forms/${form_id}/adopt-cut-score"
              payload: {"expected_form_version": "${form_v}", "adoption_note": "single-panelist adoption"}
