        distinguishing_aspect: "Conserved quantity number 3: the patient's MME ledger equals the sum of mme_daily over ACTIVE orders only, so discontinuing the 20.0 order returns the ledger from 50.0 to exactly 30.0 and re-derives breakthrough_dose_mg from 7.5 back to 4.5."
