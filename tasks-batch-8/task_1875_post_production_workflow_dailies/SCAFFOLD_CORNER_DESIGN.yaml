  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_bay_version_on_booking_create
        claim_type: optimistic_concurrency_stale_write
        grounds:
          - "concurrency_rules[booking-create-stale-bay]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential booking creates: the first advances EditBay.version to N+1; the second carries expected_bay_version=N and is rejected with 412 ERR_STALE_VERSION even though its payload is otherwise valid."
        test_recipe:
          setup: ["Project P ACTIVE; Bay B AVAILABLE at version V0"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL800", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
