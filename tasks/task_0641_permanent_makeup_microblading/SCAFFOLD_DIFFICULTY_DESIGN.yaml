              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
          trigger:
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-03T02:00:00Z" }
