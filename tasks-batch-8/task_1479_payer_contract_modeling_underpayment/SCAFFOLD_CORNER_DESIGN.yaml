            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-SV1", patient_account_number: "PA-SV1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: "$.data.id" }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { case_id: "$.data[0].id", ov1: "$.data[0].original_variance_cents" }
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 10000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { ov2: "$.data[0].original_variance_cents" }
          assert:
            - "before: case ${case_id} original_variance_cents == 100000 (${ov1})"
            - "after second remittance: still exactly ONE case for ${claim_id}; its id is unchanged (${case_id})"
            - "case restated: original_variance_cents == 90000 (${ov2}) and status still QUEUED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_per_diem_counts_nights_not_days
        claim_type: correct_result
        grounds: [calculations.base_expected_amount]
        distinguishing_aspect: "PER_DIEM covered_days counts the half-open stay [admission, discharge): 2026-06-01..2026-06-04 is 3 nights, not 4, so expected == 300000."
        test_recipe:
          setup: ["payer P; contract C ACTIVE PER_DIEM INPATIENT_MEDICAL 100000; claim CL-ND1 2026-06-01..2026-06-04 with one line"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer ND", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "ND-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-ND1", patient_account_number: "PA-ND1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-04", total_billed_charges_cents: 600000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-02", charge_cents: 600000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents }
          assert:
            - "Claim.${claim_id}.expected_reimbursement_cents == 300000 (3 nights x 100000; discharge day excluded) (${exp})"

      - name: calc_drg_base_weight_rounding
        claim_type: precision
        grounds: [calculations.base_expected_amount, entities.Claim.fields.drg_weight]
        distinguishing_aspect: "DRG_BASE multiplies base by the 3-decimal weight with one round_half_up: round_half_up(100001 x 1.005) = round_half_up(100501.005) = 100501."
        test_recipe:
          setup: ["payer P; contract C ACTIVE DRG_BASE INPATIENT_SURGICAL base 100001; claim CL-DG1 with drg_weight 1.005 and one line"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer DG", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "DG-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_SURGICAL", rate_model: "DRG_BASE", base_rate_cents: 100001 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-DG1", patient_account_number: "PA-DG1", service_category: "INPATIENT_SURGICAL", admission_date: "2026-06-10", discharge_date: "2026-06-12", total_billed_charges_cents: 400000, drg_weight: 1.005 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0360", service_date: "2026-06-10", charge_cents: 400000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents }
          assert:
            - "Claim.${claim_id}.expected_reimbursement_cents == 100501 (${exp})"

      - name: calc_volume_tier_inclusive_boundary
        claim_type: constants_applied
        grounds: [calculations.volume_tier_adjustment, entities.PayerContract.fields.volume_tiers]
        distinguishing_aspect: "The tier boundary is INCLUSIVE and the priced claim is excluded from its own window: trailing U=0 then 1 price flat (100000); the third claim sees U=2 == min_annual_units and gets the +1000bp tier (110000)."
        test_recipe:
          setup: ["payer P; contract C ACTIVE CASE_RATE OUTPATIENT_SURGERY 100000 with volume_tiers [{OUTPATIENT_SURGERY, min 2, +1000bp}]; three claims A/B/C same category, discharges 2026-06-01/02/03"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer VT", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "VT-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31", volume_tiers: [ { service_category: "OUTPATIENT_SURGERY", min_annual_units: 2, rate_adjustment_bp: 1000 } ] }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-VTA", patient_account_number: "PA-VTA", service_category: "OUTPATIENT_SURGERY", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 150000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_a: $.data.id }
            - call: "POST /api/claims/${claim_a}/lines"
              payload: { revenue_code: "0360", service_date: "2026-06-01", charge_cents: 150000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-VTB", patient_account_number: "PA-VTB", service_category: "OUTPATIENT_SURGERY", admission_date: "2026-06-02", discharge_date: "2026-06-02", total_billed_charges_cents: 150000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_b: $.data.id }
            - call: "POST /api/claims/${claim_b}/lines"
              payload: { revenue_code: "0360", service_date: "2026-06-02", charge_cents: 150000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-VTC", patient_account_number: "PA-VTC", service_category: "OUTPATIENT_SURGERY", admission_date: "2026-06-03", discharge_date: "2026-06-03", total_billed_charges_cents: 150000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_c: $.data.id }
            - call: "POST /api/claims/${claim_c}/lines"
              payload: { revenue_code: "0360", service_date: "2026-06-03", charge_cents: 150000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_a}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp_a: $.data.expected_reimbursement_cents }
            - call: "POST /api/claims/${claim_b}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp_b: $.data.expected_reimbursement_cents }
            - call: "POST /api/claims/${claim_c}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp_c: $.data.expected_reimbursement_cents }
          assert:
            - "Claim.${claim_a}.expected_reimbursement_cents == 100000 (U=0 below tier) (${exp_a})"
            - "Claim.${claim_b}.expected_reimbursement_cents == 100000 (U=1 below tier) (${exp_b})"
            - "Claim.${claim_c}.expected_reimbursement_cents == 110000 (U=2 == min_annual_units selects the tier, round_half_up(100000 x 1.1)) (${exp_c})"
            - "Claim.${claim_c}.pricing_trace.volume_tier_bp == 1000"

      - name: calc_escalator_mid_stay_proration
        claim_type: correct_result
        grounds: [calculations.escalator_adjustment, entities.RateEscalator.fields.compounding]
        distinguishing_aspect: "PER_DIEM proration gives each stay day its own multiplier: with a 2000bp escalator effective 2026-06-03, the stay 06-01..06-04 prices 100000 + 100000 + 120000 = 320000 (only days with effective_date <= d escalate)."
        test_recipe:
          setup: ["payer P; contract C ACTIVE PER_DIEM INPATIENT_MEDICAL 100000 with escalator 2000bp compounding effective 2026-06-03 (APPLIED after sweep); claim CL-EP1 2026-06-01..2026-06-04"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer EP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "EP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${contract_id}", effective_date: "2026-06-03", escalator_bp: 2000, compounding: true }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-EP1", patient_account_number: "PA-EP1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-04", total_billed_charges_cents: 600000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 600000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents }
          assert:
            - "Claim.${claim_id}.expected_reimbursement_cents == 320000 (${exp})"

      - name: calc_compounding_vs_additive_escalators
        claim_type: correct_result
        grounds: [calculations.escalator_adjustment, entities.RateEscalator.fields.compounding]
        distinguishing_aspect: "Two 1000bp escalators compound to m = 1.1 x 1.1 = 1.21 (expected 121000) but add to m = 1 + 0.1 + 0.1 = 1.20 when compounding=false (expected 120000) — same bp, different accumulation rule."
        test_recipe:
          setup:
            - "payer P1 with contract CMP ACTIVE CASE_RATE OBSERVATION 100000 and two compounding 1000bp escalators (2026-06-01, 2026-06-02), both APPLIED"
            - "payer P2 with contract ADD ACTIVE CASE_RATE OBSERVATION 100000 and two additive 1000bp escalators (2026-06-01, 2026-06-02), both APPLIED"
            - "one claim per payer anchored 2026-06-05 (after both escalator dates)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer CMP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer1: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer1}", contract_code: "CMP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { c1: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${c1}", service_category: "OBSERVATION", rate_model: "CASE_RATE", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${c1}", effective_date: "2026-06-01", escalator_bp: 1000, compounding: true }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${c1}", effective_date: "2026-06-02", escalator_bp: 1000, compounding: true }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${c1}/activate"
              as: ContractManager
            - call: "POST /api/payers"
              payload: { name: "Payer ADD", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer2: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer2}", contract_code: "ADD-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { c2: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${c2}", service_category: "OBSERVATION", rate_model: "CASE_RATE", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${c2}", effective_date: "2026-06-01", escalator_bp: 1000, compounding: false }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${c2}", effective_date: "2026-06-02", escalator_bp: 1000, compounding: false }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${c2}/activate"
              as: ContractManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/claims"
              payload: { payer_id: "${payer1}", claim_number: "CL-CMP1", patient_account_number: "PA-CMP1", service_category: "OBSERVATION", admission_date: "2026-06-05", discharge_date: "2026-06-05", total_billed_charges_cents: 200000 }
              as: RevenueIntegrityAnalyst
              captures: { claim1: $.data.id }
            - call: "POST /api/claims/${claim1}/lines"
              payload: { revenue_code: "0760", service_date: "2026-06-05", charge_cents: 200000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer2}", claim_number: "CL-ADD1", patient_account_number: "PA-ADD1", service_category: "OBSERVATION", admission_date: "2026-06-05", discharge_date: "2026-06-05", total_billed_charges_cents: 200000 }
              as: RevenueIntegrityAnalyst
              captures: { claim2: $.data.id }
            - call: "POST /api/claims/${claim2}/lines"
              payload: { revenue_code: "0760", service_date: "2026-06-05", charge_cents: 200000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim1}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp1: $.data.expected_reimbursement_cents }
            - call: "POST /api/claims/${claim2}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp2: $.data.expected_reimbursement_cents }
          assert:
            - "compounding contract: Claim.${claim1}.expected_reimbursement_cents == 121000 (${exp1})"
            - "additive contract: Claim.${claim2}.expected_reimbursement_cents == 120000 (${exp2})"
            - "${exp1} != ${exp2} — identical bp totals, different accumulation"

      - name: calc_wrap_pricing_rounds_per_line
        claim_type: precision
        grounds: [calculations.wrap_network_pricing]
        distinguishing_aspect: "Wrap pricing uses the same round-per-line-then-sum pin: three 1-cent lines at 6666bp give 3 x round_half_up(0.6666) = 3 cents, not the sum-then-round result of 2."
        test_recipe:
          setup: ["payer P (no contract); agreement WR 6666bp VERIFIED covering 2026; claim CL-WR1 billed 3 with three 1-cent lines"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer WR", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "RoundNet", wrap_rate_bp: 6666, precedence_rank: 1, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { na_id: $.data.id }
            - call: "POST /api/network-agreements/${na_id}/verify"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-WR1", patient_account_number: "PA-WR1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 3 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0300", service_date: "2026-06-01", charge_cents: 1, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0301", service_date: "2026-06-01", charge_cents: 1, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0302", service_date: "2026-06-01", charge_cents: 1, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents, nf: $.data.network_flag }
          assert:
            - "Claim.${claim_id}.network_flag == WRAP_CONFIRMED (${nf})"
            - "Claim.${claim_id}.expected_reimbursement_cents == 3 (${exp}) — not 2 (sum-then-round is forbidden)"

      - name: calc_resolution_contract_beats_verified_wrap
        claim_type: input_set_filtering
        grounds: [calculations.pricing_contract_resolution, "calculations.pricing_contract_resolution.constants.SELECTION_RULE_CONTRACT"]
        distinguishing_aspect: "A direct contract ALWAYS beats every network agreement: claim anchored inside both an ACTIVE contract and a VERIFIED wrap resolves to the contract (network_flag NONE, network_agreement_id null, priced 200000 by PER_DIEM, not the 5000bp wrap rate)."
        test_recipe:
          setup: ["payer P with ACTIVE PER_DIEM contract (100000/day) AND VERIFIED wrap 5000bp, both covering 2026-06-01..2026-06-03; claim CL-CW1 2 nights billed 500000"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer CW", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "CW-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WrapX", wrap_rate_bp: 5000, precedence_rank: 1, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { na_id: $.data.id }
            - call: "POST /api/network-agreements/${na_id}/verify"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-CW1", patient_account_number: "PA-CW1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents, nf: $.data.network_flag, pc: $.data.priced_contract_id, na: $.data.network_agreement_id }
          assert:
            - "Claim.${claim_id}.network_flag == NONE (${nf})"
            - "Claim.${claim_id}.priced_contract_id == ${contract_id} (${pc}) and network_agreement_id is null (${na})"
            - "Claim.${claim_id}.expected_reimbursement_cents == 200000 (contract rate, not the 250000 wrap amount) (${exp})"

      - name: calc_wrap_selection_higher_rate_wins
        claim_type: constants_applied
        grounds: [calculations.pricing_contract_resolution, "calculations.pricing_contract_resolution.constants.SELECTION_RULE_WRAP"]
        distinguishing_aspect: "Wrap candidate ranking is wrap_rate_bp DESC before precedence_rank: the 6000bp agreement (rank 2) beats the 4000bp agreement (rank 1); expected 60000 on a 100000 charge."
        test_recipe:
          setup: ["payer P (no contract); agreements WR-A 4000bp rank 1 and WR-B 6000bp rank 2, both VERIFIED covering 2026; claim CL-WS1 billed 100000, one line"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer WS", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WR-A", wrap_rate_bp: 4000, precedence_rank: 1, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { na_a: $.data.id }
            - call: "POST /api/network-agreements/${na_a}/verify"
              as: ContractManager
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WR-B", wrap_rate_bp: 6000, precedence_rank: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { na_b: $.data.id }
            - call: "POST /api/network-agreements/${na_b}/verify"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-WS1", patient_account_number: "PA-WS1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0300", service_date: "2026-06-01", charge_cents: 100000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents, na: $.data.network_agreement_id }
          assert:
            - "Claim.${claim_id}.network_agreement_id == ${na_b} (${na}) — higher wrap_rate_bp wins over better precedence_rank"
            - "Claim.${claim_id}.expected_reimbursement_cents == 60000 (${exp})"

      - name: calc_suspect_agreement_pays_full_billed
        claim_type: correct_result
        grounds: [calculations.pricing_contract_resolution, entities.Claim.fields.network_flag]
        distinguishing_aspect: "With only a REGISTERED (never verified) agreement in window, resolution step 3 yields SILENT_PPO_SUSPECT and expected == total_billed_charges_cents (no discount entitled)."
        test_recipe:
          setup: ["payer P (no contract); agreement WrapS REGISTERED covering 2026; claim CL-SP1 billed 100000, one line"]
          setup_api_calls:
