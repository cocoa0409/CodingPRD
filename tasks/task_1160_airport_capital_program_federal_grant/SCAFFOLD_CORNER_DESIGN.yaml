  - section: calculations
    instances:
      - name: selection_ranking_budget_sweep_and_tiebreak
        claim_type: correct_result
        grounds: [calculations.cip_priority_score, entities.CIPProject.fields.selection_rank, state_machines.CIPProject.DEFERRED_to_SELECTED]
        distinguishing_aspect: "Equal sponsor scores tie-break by created_at ASC (never id); the greedy sweep selects in rank order while cumulative estimated_cost <= selection_budget, and re-apply with a larger budget promotes DEFERRED -> SELECTED."
        test_recipe:
          setup:
            - "Program ACCEPTED with two equal-score projects: P1 cost 600,000 created first, P2 cost 600,000 created second; scores 20/10/10/10/10 both (sponsor 13.00)"
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "First", project_type: "PRESERVATION", estimated_cost: 600000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Second", project_type: "CAPACITY", estimated_cost: 600000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p2: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 1100000, expected_program_version: "${prog_v}" }, as: SponsorStaff, captures: { prog_v2: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v2}" }, as: SponsorStaff }
          assert:
            - "After first apply: CIPProject.${p1}.selection_rank == 1 and status == SELECTED (created_at tie-break)"
            - "After first apply: CIPProject.${p2}.selection_rank == 2 and status == DEFERRED (600,000 + 600,000 > 1,100,000)"
            - "After first apply: CapitalProgram.${prog}.selected_total_cost == 600000.00"
