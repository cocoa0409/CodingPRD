              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Order Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e_v: "$.data.version" }
          trigger:
            - call: "POST /api/resolutions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/adopt"
              payload: { expected_entity_version: "${e_v}" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 403 and data.error_id == ERR_FORBIDDEN_ROLE (role checked before the resolution's existence)"

