            - { call: "POST /correspondent-banking/respondents/${j_id}/monitoring-profiles", payload: { effective_from: "2025-10-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z", tolerance_pct: 0.10, expected_respondent_version: "${jv1}", expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 4000000.00, expected_monthly_count: 150 } ] }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${j_id}/monitoring-profiles", payload: { effective_from: "2026-06-30T00:00:01Z", effective_to: "2026-09-30T00:00:00Z", tolerance_pct: 0.10, expected_respondent_version: "${jv1}", expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 4000000.00, expected_monthly_count: 150 } ] }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { j_right: $.data.id } }
            - { call: "GET /correspondent-banking/respondents/${j_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { jv2: $.data.version } }
