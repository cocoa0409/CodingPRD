# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3397_reemployment_rights_case_handling_employer_outreach
# Breadth probe over §1.1–§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; those corners appear as excluded_because
# stubs. Corner-local anchors &c_* are defined in the first instance below.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: member_create_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.ServiceMember
          - endpoints.POST_/reemployment/members
        distinguishing_aspect: "A member registered with the four input fields comes back 201 with all four echoed plus system id/created_at/updated_at and version == 1; no client-supplied status or version is honored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - &c_mem
              call: "POST /reemployment/members"
              payload: { full_name: "Rae Torres", email: "rae@example.com", branch: "ARMY", component: "ARMY_RESERVE" }
              as: Anonymous
              captures: { mem_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ServiceMember.${mem_id}.full_name == \"Rae Torres\", branch == ARMY, component == ARMY_RESERVE"
            - "the response carries non-null id, created_at == 2026-09-01T00:00:00Z, updated_at and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: employer_get_round_trips_all_fields
        claim_type: Retrieval
        grounds:
          - entities.Employer
          - endpoints.GET_/reemployment/employers/{id}
        distinguishing_aspect: "Every Employer field round-trips through GET exactly as posted, and the three derived counters initialize to 0/0/NONE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
            - &c_emp
              call: "POST /reemployment/employers"
              payload: { legal_name: "Cascade Outfitters Inc", sector: "RETAIL", size_tier: "MEDIUM" }
              as: ProgramCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /reemployment/employers/${emp_id}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "the response status is 200"
            - "Employer.${emp_id}.legal_name == \"Cascade Outfitters Inc\", sector == RETAIL, size_tier == MEDIUM"
            - "resolved_case_count == 0, open_case_count == 0, recognition_tier == NONE"

      - name: cases_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/reemployment/cases
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three cases on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; no params returns all 3 under the default limit 10."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One employer, one member, three cases."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Case A" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "BENEFITS", description: "Case B" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "PENSION", description: "Case C" }
              as: ServiceMember
              as_user_id: "${mem_id}"
          trigger:
            - call: "GET /reemployment/cases"
              payload: { member_id: "${mem_id}", limit: 2, offset: 0 }
              as: ProgramCoordinator
          assert:
            - "the response is an array of exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /reemployment/cases?member_id=${mem_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /reemployment/cases with no parameters returns all 3 rows under default limit 10 offset 0"
            - "GET /reemployment/cases?issue_type=PENSION returns exactly 1 row (Case C)"

      - name: case_get_unknown_id_returns_case_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/reemployment/cases/{id}
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated case id produces the entity-specific 404 ERR_CASE_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /reemployment/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CASE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: case_create_missing_employer_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ReemploymentCase.fields.employer_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "employer_id is required with no default; omitting it is a 400 ERR_INVALID_REQUEST from the request-shape check at priority 3 — never a 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One member."
          setup_api_calls:
            - *c_clock
            - *c_mem
          trigger:
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", issue_type: "REEMPLOYMENT", description: "Missing employer" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /reemployment/cases?member_id=${mem_id} returns 0 rows"

      - name: statement_create_defaults_term_months_to_24
        claim_type: Defaults
        grounds:
          - entities.StatementOfSupport.fields.term_months
        distinguishing_aspect: "Omitting term_months stores the default 24, and signing on 2026-09-01 stamps expires_on == 2028-09-01T00:00:00Z exactly 24 months later."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One employer."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - call: "POST /reemployment/statements-of-support"
              payload: { employer_id: "${emp_id}", signer_name: "J. Ho", signer_title: "CEO" }
              as: ProgramCoordinator
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /reemployment/statements-of-support/${st_id}/state"
              payload: { to_status: "SIGNED" }
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "the created StatementOfSupport.${st_id}.term_months == 24 (default applied)"
            - "after signing: status == SIGNED, signed_on == 2026-09-01T00:00:00Z, expires_on == 2028-09-01T00:00:00Z"

      - name: employer_open_case_count_is_computed_not_stored
        claim_type: Computed Fields
        grounds:
          - entities.Employer.fields.open_case_count
          - entities.Employer.fields.resolved_case_count
        distinguishing_aspect: "open_case_count derives from live case statuses: 0 at employer creation, 1 after a case is filed, back to 0 after the member withdraws — with no write ever touching the field directly."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "DISCRIMINATION", description: "Passed over for drill weekends" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { cc_id: $.data.id }
          trigger:
            - call: "GET /reemployment/employers/${emp_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { open1: $.data.open_case_count }
            - call: "POST /reemployment/cases/${cc_id}/state"
              payload: { to_status: "CLOSED_WITHDRAWN" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "GET /reemployment/employers/${emp_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { open0: $.data.open_case_count }
          assert:
            - "open1 == 1 after filing"
            - "open0 == 0 after withdrawal and resolved_case_count stays 0"

      - name: case_create_status_and_version_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ReemploymentCase.fields.status
          - state_machines.ReemploymentCase.initial_state
        distinguishing_aspect: "status is source: system with initial INTAKE; a client sending status RESOLVED_INFORMAL and version 99 (fields the endpoint does not declare as input) is ignored — the case is created INTAKE with version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
          trigger:
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Forged status attempt", status: "RESOLVED_INFORMAL", version: 99 }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { fc_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ReemploymentCase.${fc_id}.status == INTAKE and version == 1"
            - "assigned_ombudsman_id is null and open_round_count == 0"

      - name: case_create_with_unknown_enum_issue_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ReemploymentCase.fields.issue_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "issue_type is a closed enum of five values; HARASSMENT is rejected at priority 3 with 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
          trigger:
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "HARASSMENT", description: "Bad enum" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /reemployment/cases?member_id=${mem_id} returns 0 rows"

      - name: service_period_is_immutable_without_version_or_update
        claim_type: Immutability
        grounds:
          - entities.ServicePeriod
        distinguishing_aspect: "ServicePeriod declares common_fields: false — the create response carries id and created_at but NO version or updated_at, and no PATCH/state endpoint exists for it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
          trigger:
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-02-01T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { sp_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ServicePeriod.${sp_id}.duration_days == 31 and chargeable == true are computed at creation"
            - "the response data carries id and created_at but no version and no updated_at keys"
            - "GET /reemployment/members/${mem_id}/service-periods returns the same row, still without version"

      - name: case_create_body_foreign_keys_checked_in_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/reemployment/cases
          - errors.ERR_MEMBER_NOT_FOUND
          - errors.ERR_EMPLOYER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts both FKs in the body; priority 4 checks them in declared input order — member_id before employer_id — so both-unknown yields ERR_MEMBER_NOT_FOUND while only-employer-unknown yields ERR_EMPLOYER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One real member; no employer."
          setup_api_calls:
            - *c_clock
            - *c_mem
          trigger:
            - call: "POST /reemployment/cases"
              payload: { member_id: "00000000-0000-4000-8000-000000000001", employer_id: "00000000-0000-4000-8000-000000000002", issue_type: "REEMPLOYMENT", description: "Both FKs unknown" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "00000000-0000-4000-8000-000000000002", issue_type: "REEMPLOYMENT", description: "Employer unknown" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { err_emp: $.data.error_id }
          assert:
            - "the first request returns 404 and err_both == ERR_MEMBER_NOT_FOUND"
            - "err_both != ERR_EMPLOYER_NOT_FOUND"
            - "the second request returns 404 and err_emp == ERR_EMPLOYER_NOT_FOUND"
            - "GET /reemployment/cases returns 0 rows"

  - section: state_machines
    instances:
      - name: case_created_in_intake_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.ReemploymentCase.initial_state
        distinguishing_aspect: "Every new case starts at INTAKE regardless of issue_type, with open_round_count 0 and documentation_complete false."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
          trigger:
            - &c_case
              call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Refused reinstatement", application_submitted_at: "2026-04-20T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
          assert:
            - "ReemploymentCase.${case_id}.status == INTAKE"
            - "open_round_count == 0 and documentation_complete == false"
            - "version == 1 and escalated_at and closed_at are null"

      - name: case_triage_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.ReemploymentCase.INTAKE_to_TRIAGE
        distinguishing_aspect: "The coordinator triage edge moves INTAKE -> TRIAGE and increments version; the response returns the updated entity."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member, one INTAKE case."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - *c_case
          trigger:
            - &c_triage
              call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
          assert:
            - "the response status is 200 and ReemploymentCase.${case_id}.status == TRIAGE"
            - "version incremented from 1 to 2 (case_v == 2)"

      - name: escalate_requires_declined_or_expired_round
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ReemploymentCase.IN_MEDIATION_to_ESCALATION_PENDING
          - errors.ERR_NO_EXHAUSTED_ROUND
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Escalation from ASSIGNED (no rounds at all) fails the state check with ERR_INVALID_STATE; escalation from IN_MEDIATION whose only round was COUNTERED reaches the exhausted-round gate and fails with ERR_NO_EXHAUSTED_ROUND — the two failures are distinguishable."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned to the case; one round COUNTERED."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - &c_omb
              call: "POST /reemployment/ombudsmen"
              payload: { full_name: "Ada Weiss", email: "ada@example.com" }
              as: Anonymous
              captures: { omb_id: $.data.id }
            - &c_tra
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "CORE_LAW", hours: 8, exam_score: 90, completed_on: "2026-08-01T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &c_trb
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "MEDIATION_SKILLS", hours: 8, exam_score: 88, completed_on: "2026-08-05T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &c_trc
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "DOCUMENTATION", hours: 6, exam_score: 95, completed_on: "2026-08-10T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &c_cert
              call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: ProgramCoordinator
              as_user_id: "pc-lead"
            - *c_mem
            - *c_case
            - *c_triage
            - &c_assign
              call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { err_early_state: $.data.error_id }
            - &c_round
              call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate with back pay.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "COUNTER", counter_text: "90 percent pay." }
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { err_no_exhausted: $.data.error_id }
          assert:
            - "from ASSIGNED the escalation attempt returned 409 err_early_state == ERR_INVALID_STATE"
            - "from IN_MEDIATION with only a COUNTERED round the attempt returns 409 err_no_exhausted == ERR_NO_EXHAUSTED_ROUND"
            - "ReemploymentCase.${case_id}.status is still IN_MEDIATION and escalated_at is null"

      - name: accept_with_incomplete_documentation_returns_documentation_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ReemploymentCase.AWAITING_RESPONSE_to_RESOLVED_INFORMAL
          - calculations.documentation_completeness
          - errors.ERR_DOCUMENTATION_INCOMPLETE
        distinguishing_aspect: "An ACCEPT with only an INTAKE note on file (no CONTACT for the open round, no RESOLUTION) is rejected 409 ERR_DOCUMENTATION_INCOMPLETE; the round stays PROPOSED, the case stays AWAITING_RESPONSE, and no counters move."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned; one PROPOSED round addressed to EMPLOYER; a single INTAKE note."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "INTAKE", body: "Intake done." }
              as: ProgramCoordinator
            - *c_round
          trigger:
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "ACCEPT" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_docs: $.data.error_id }
          assert:
            - "the response status is 409 and err_docs == ERR_DOCUMENTATION_INCOMPLETE"
            - "MediationRound.${r1_id}.status is still PROPOSED and responded_at is null"
            - "ReemploymentCase.${case_id}.status is still AWAITING_RESPONSE"
            - "GET /reemployment/employers/${emp_id} still shows resolved_case_count == 0"

      - name: resolved_case_rejects_all_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ReemploymentCase.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once RESOLVED_INFORMAL, every further transition attempt — coordinator triage and member withdrawal alike — fails 409 ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A fully documented case resolved via ACCEPT."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - &c_note_intake
              call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "INTAKE", body: "Intake done." }
              as: ProgramCoordinator
            - &c_note_contact
              call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "CONTACT", body: "Employer contacted for round 1." }
              as: ProgramCoordinator
            - &c_note_resolution
              call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "RESOLUTION", body: "Terms memorialized." }
              as: ProgramCoordinator
            - *c_round
            - &c_accept
              call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "ACCEPT" }
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { err_term1: $.data.error_id }
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "CLOSED_WITHDRAWN" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { err_term2: $.data.error_id }
          assert:
            - "the case resolved: status == RESOLVED_INFORMAL before the negative probes"
            - "err_term1 == ERR_INVALID_STATE and err_term2 == ERR_INVALID_STATE (both 409)"
            - "ReemploymentCase.${case_id}.status remains RESOLVED_INFORMAL"

      - name: withdraw_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.ReemploymentCase.INTAKE_to_CLOSED_WITHDRAWN
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The first withdrawal from INTAKE succeeds; replaying the identical request hits a terminal state and fails 409 ERR_INVALID_STATE — no idempotent replay semantics for state endpoints."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member, one INTAKE case."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - *c_case
            - call: "POST /reemployment/cases/${case_id}/state"
