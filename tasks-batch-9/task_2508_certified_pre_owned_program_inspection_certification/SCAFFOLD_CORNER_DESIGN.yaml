            - "trigger call 4 returns exactly 1 row, ${cmpA}, with total_count 1: ${cmpB} belongs to ${cB} and must not leak into ${cA}'s collection"
            - "trigger call 5 returns an empty array with total_count 0 - the category filter is applied within the parent scope"
            - "trigger call 6 returns ${cmpA} again, and neither certification's status changed: filing a complaint leaves Certification.${cA}.status ACTIVE"

      - name: action_endpoint_preconditions_and_side_effects
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: certification_audit_cycle_and_branch
          rationale: |
            The action endpoints on the certification axis - approve, the audit run, the audit finding
            and the resulting ACTIVE/UNDER_AUDIT cycle - are driven there with their preconditions and
            every declared side effect asserted at each hop.

      - name: conditional_action_allowed_only_in_the_right_state
        claim_type: Conditional action
        excluded_because:
          difficulty_instance: listing_lifecycle_blocked_by_certification_state
          rationale: |
            Listing creation and syndication are exactly the conditional actions of this domain, and
            that instance walks them across the certifications states in which they are permitted and
            forbidden, including the forced-withdrawal path.

  # ===========================================================================
  # 6. From Table 1.6 (Errors)
  # ===========================================================================
  - section: errors
    instances:

      - name: error_envelope_carries_error_id_and_message
        claim_type: triggerability
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_VEHICLE_NOT_FOUND
        distinguishing_aspect: |
          Every failure, whatever its priority, uses the one error envelope: meta with api_request_id
          and api_request_timestamp, response_type "error", and a data object holding exactly error_id
          and message - never a bare string, never a top-level error_id, and never a partial data
          payload of the entity that failed to be created. The three sampled failures span priority 4,
          priority 5 and priority 25 so the shape cannot be special-cased per handler.
        test_recipe:
          setup:
            - "Dealer D1 exists so that the duplicate-franchise call has something to collide with."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /cpo/dealers"
              payload: { name: "Copycat Motors", franchise_code: "FR-1001", region_code: "SOUTH" }
              as: ProgramAdministrator
              captures: { e1: $.data.error_id, m1: $.data.message }
            - call: "GET /cpo/vehicles/00000000-0000-4000-8000-000000000041"
              payload: {}
              as: ProgramAdministrator
              captures: { e2: $.data.error_id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172" }
              as: ProgramAdministrator
              captures: { e3: $.data.error_id }
          assert:
            - "trigger call 1 returns 409 with ${e1} == ERR_DUPLICATE_RESOURCE and a non-empty ${m1}; data carries no id, no franchise_code and no partially built dealer"
            - "trigger call 2 returns 404 with ${e2} == ERR_VEHICLE_NOT_FOUND"
            - "trigger call 3 returns 422 with ${e3} == ERR_INVALID_REQUEST because the required effective_from is absent"
            - "all three responses carry response_type == error plus meta.api_request_id and meta.api_request_timestamp, and none of them carries the pagination fields"
            - "the whole 59-error catalog is reachable across 1.8 and 1.9: no error id in table 1.6 is left without a triggering instance"

  # ===========================================================================
  # 7. From Table 1.7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:

      - name: every_role_can_perform_its_own_exclusive_operations
        claim_type: can perform exclusive/shared ops
        grounds:
          - rbac.ProgramAdministrator.exclusive_operations
          - rbac.ProgramAuditor.exclusive_operations
          - rbac.DealerPrincipal.exclusive_operations
          - rbac.InspectionTechnician.exclusive_operations
          - rbac.CustomerAdvocate.exclusive_operations
        distinguishing_aspect: |
          One pipeline exercises the exclusive write of all five roles in the only order the state
          machines allow - the dealer opens, the technician records, the dealer submits, the
          administrator approves, the auditor samples, the advocate complains - proving that the
          positive half of the role model is intact and that no role's own operation is over-blocked
          by an eager permission check.
        test_recipe:
          setup:
            - "Dealer D1 with technician T1, published template MPI-172 holding the single item P1, and vehicle V1 in inventory."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000030", model_year: 2023, in_service_date: "2023-05-10", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /cpo/certifications/${c1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /cpo/audit-runs"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "POST /cpo/complaints"
              payload: { certification_id: "${c1}", customer_reference: "CUST-1", category: "INSPECTION_QUALITY", description: "brake noise two days after delivery" }
              as: CustomerAdvocate
              as_user_id: "advocate-1"
            - call: "PUT /cpo/program-config"
              payload: { audit_sample_min_per_run: 1 }
              as: ProgramAdministrator
          assert:
            - "every trigger call returns 2xx: the dealer's open/submit/certify, the technician's results write, the administrator's approve and config write, the auditor's run and the advocate's complaint are all permitted to their owning role"
            - "trigger call 3 leaves Inspection.${i1}.status PASSED and trigger call 6 leaves Certification.${c1}.status ACTIVE"
            - "trigger call 7 returns 201 with selected_count 1 - the single ACTIVE certification is the whole pool"
            - "trigger call 8 returns 201 with status OPEN and certification_id ${c1}"
            - "no call needs a role other than the one declared as its owner in 1.7, and the two entity_backed roles act under their own X-User-ID (${d1} and ${t1})"

      - name: no_role_can_perform_another_roles_exclusive_operation_forbidden
        claim_type: cannot perform other roles' exclusive ops
        grounds:
          - rbac.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
          - validations.priority_2
        distinguishing_aspect: |
          The negative half of the role model, and deliberately tested against ids that do not exist:
          because the role gate sits at priority 2 and existence at priority 5, every one of these must
          answer 403 ERR_ROLE_FORBIDDEN and never 404. An implementation that loads the row first leaks
          existence to roles that may not act at all.
        test_recipe:
          setup:
            - "Nothing at all: no dealer, inspection, certification, sample or claim is created."
          trigger:
            - call: "PUT /cpo/program-config"
              payload: { base_fee_cents: 1 }
              as: CustomerAdvocate
              as_user_id: "advocate-1"
            - call: "POST /cpo/audit-runs"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/certifications/00000000-0000-4000-8000-000000000051/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "00000000-0000-4000-8000-000000000052", technician_id: "00000000-0000-4000-8000-000000000053", template_id: "00000000-0000-4000-8000-000000000054", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 1000 }
              as: InspectionTechnician
              as_user_id: "00000000-0000-4000-8000-000000000053"
            - call: "PUT /cpo/inspections/00000000-0000-4000-8000-000000000055/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: ProgramAdministrator
            - call: "POST /cpo/complaints"
              payload: { certification_id: "00000000-0000-4000-8000-000000000056", customer_reference: "CUST-X", category: "WARRANTY_DENIAL", description: "denied" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "POST /cpo/warranty-claims/00000000-0000-4000-8000-000000000057/adjudicate"
              payload: { decision: "APPROVE" }
              as: DealerPrincipal
              as_user_id: "00000000-0000-4000-8000-000000000058"
            - call: "GET /cpo/program-config"
              payload: {}
              as: CustomerAdvocate
              as_user_id: "advocate-1"
          assert:
            - "trigger calls 1 through 7 all return 403 ERR_ROLE_FORBIDDEN"
            - "trigger call 3 does NOT return 404 ERR_CERTIFICATION_NOT_FOUND even though the id is fabricated: priority 2 outranks priority 5"
            - "trigger call 4 does NOT return 403 ERR_IDENTITY_NOT_RECOGNIZED even though the X-User-ID is fabricated too: priority 2 outranks priority 3"
            - "trigger call 5 does not create, mutate or void any inspection, and trigger call 1 leaves ProgramConfig.base_fee_cents at 89900 with version unchanged"
            - "trigger call 8 returns 200: the same CustomerAdvocate that cannot write the config can read it, so the refusals are operation-scoped and not blanket role bans"

      - name: variant_scoped_exclusive_resolution_on_reconditioning_close_forbidden
        claim_type: cannot perform other roles' exclusive ops
        grounds:
          - rbac.InspectionTechnician.exclusive_operations
          - rbac.ProgramAdministrator.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
        distinguishing_aspect: |
          POST /cpo/reconditioning-items/{id}/complete admits BOTH the technician and the administrator,
          so a role check on the endpoint alone passes every call - exclusivity here is scoped to the
          request variant. COMPLETED belongs to the technician, WAIVED to the administrator, and each
          role is refused the other's resolution even though it is on the endpoint's roles list.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1 and T2; published MPI-172 with P1, reconditioning-eligible B1 and T1I; inspection I1 by T1 with B1 and T1I failed on attempt 1."
