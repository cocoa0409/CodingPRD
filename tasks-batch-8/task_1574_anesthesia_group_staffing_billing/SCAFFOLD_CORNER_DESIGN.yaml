  # ===========================================================================
  # Section: validations (Table 4 claims)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with X-User-ID / X-User-Role headers absent is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check (priority 1), even on a read endpoint."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /anesthesia-ops/sites/00000000-0000-4000-8000-000000000000"
              as: GroupAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "With auth headers omitted, response is 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (NOT 404 — auth precedes existence)"

      - name: invalid_role_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "An X-User-Role value that is not a declared role ('SuperUser') is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, distinct from a declared-but-unauthorized role (which would be 403)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /anesthesia-ops/providers"
              as: SuperUser
              captures: { err: $.data.error_id }
          assert:
            - "400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (undeclared role value), not 403"

      - name: unknown_procedure_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_UNKNOWN_PROCEDURE_CODE]"]
        distinguishing_aspect: "Case creation with a procedure_code matching no ProcedureFeeSchedule row is rejected 404 ERR_UNKNOWN_PROCEDURE_CODE — the code lookup is an existence check, after the roster_id FK check."
        test_recipe:
          setup: ["Site S; roster 2026-08-10 PUBLISHED; NO fee schedule rows exist"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
