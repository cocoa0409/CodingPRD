          assert:
            - "CouncilEvent.${v_id}.status == PASSED"
            - "CouncilEvent.${v_id}.yes_share_pct == 60.00"
            - "AcquisitionTarget.${t_id}.council_approved == true"

      - name: severance_exactly_5_years_gets_4_weeks
        grounds:
          - calculations.severance_calc
        distinguishing_aspect: |
          Boundary metric: years_of_service with >= tier thresholds — exactly 5 years
          yields 4 weeks (not 2), exactly 10 yields 8; reached via the offer-response
          endpoint — a different metric (service years) and endpoint than the vote-share
          instance.
        test_recipe:
          setup:
            - "Target T in VALUATION; non-union employee E with years_of_service=5, weekly_salary_cents=120000"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
