              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
            - call: "POST /pharmacy/refill-authorizations"
              payload: { prescription_id: "${rx1}", requested_refills: 3 }
              as: PharmacyOperations
              captures: { rar: $.data.id }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/refill-authorizations/${rar}/chase"
              payload: {}
              as: PharmacyOperations
