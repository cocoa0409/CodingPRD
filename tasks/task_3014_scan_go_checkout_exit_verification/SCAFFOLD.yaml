    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["pricing_mode?", "restricted_class?", "status?", "limit?", "offset?"]
    output: "CatalogItem[]"
    side_effects: []

  - method: GET
    path: "/catalog-items/{id}/scan-lines"
    description: "Recall audit: list scan lines referencing this item"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScanLine[]"
    side_effects: []

  # --- Instant savings offers ---
  - method: POST
    path: "/clubs/{id}/instant-savings-offers"
