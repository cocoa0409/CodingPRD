    input: [expected_order_version]
    output: ScreeningKit
    side_effects: ["order.status -> KIT_ORDERED; order.active_kit_id set; increments ScreeningOrder.version by 1"]

  - method: GET
    path: "/screening/orders/{orderId}/kits"
    description: "List kits of an order"
    roles: [ProgramAdmin, Provider, LabTechnician, FulfillmentAgent]
    code: 200
    input: []
    output: "ScreeningKit[]"
    side_effects: []

  - method: GET
    path: "/screening/orders/{orderId}/reminders"
    description: "List reminder cadence rows for an order"
    roles: [ProgramAdmin, FulfillmentAgent]
    code: 200
    input: []
    output: "Reminder[]"
    side_effects: []

  - method: POST
    path: "/screening/orders/{orderId}/reminders/dispatch"
    description: "Dispatch all due reminders (scheduled_for <= today) for the order"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "Reminder[]"
    side_effects: ["due SCHEDULED reminders -> SENT"]

  - method: GET
    path: "/screening/orders/{orderId}/sla"
    description: "Computed SLA days (both provisional and return_logistics variants)"
    roles: [ProgramAdmin, Provider, FulfillmentAgent]
    code: 200
    input: []
    output: "{ provisional_days: integer, return_logistics_days: integer }"
    side_effects: []

  - method: GET
    path: "/screening/orders/{orderId}/results"
    description: "List results for an order"
    roles: [ProgramAdmin, Provider, LabTechnician, Navigator]
    code: 200
    input: []
    output: "ScreeningResult[]"
    side_effects: []

  # --- Kits ---
  - method: GET
    path: "/screening/kits/{kitId}"
    description: "Get one kit"
    roles: [ProgramAdmin, Provider, LabTechnician, FulfillmentAgent]
    code: 200
    input: []
    output: ScreeningKit
    side_effects: []

  - method: POST
    path: "/screening/kits/{kitId}/ship"
    description: "Mark kit shipped with collection instructions and stabilization requirements"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: ScreeningKit
    side_effects: ["order.status -> KIT_SHIPPED; reminder cadence rows created; abandonment_due_at computed; increments ScreeningOrder.version by 1"]

  - method: POST
    path: "/screening/kits/{kitId}/return"
    description: "Record return of the completed kit at the lab dock"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: ScreeningKit
    side_effects: ["order.status -> KIT_RETURNED; stabilization window opened; SCHEDULED reminders -> SKIPPED; increments ScreeningOrder.version by 1"]

  # --- Lab specimens ---
  - method: POST
    path: "/screening/orders/{orderId}/specimens"
    description: "Accession a specimen from the returned kit"
    roles: [LabTechnician]
    code: 201
    input: []
    output: LabSpecimen
    side_effects: ["order.status -> IN_LAB; increments ScreeningOrder.version by 1"]

  - method: GET
    path: "/screening/specimens/{specimenId}"
    description: "Get one specimen"
    roles: [ProgramAdmin, LabTechnician]
    code: 200
    input: []
    output: LabSpecimen
    side_effects: []

  - method: GET
    path: "/screening/kits/{kitId}/specimens"
    description: "List specimens accessioned from one kit"
    roles: [ProgramAdmin, LabTechnician]
    code: 200
    input: []
    output: "LabSpecimen[]"
    side_effects: []

  - method: POST
    path: "/screening/specimens/{specimenId}/process"
    description: "Begin laboratory processing (stabilization window enforced)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabSpecimen
    side_effects: ["specimen.status -> PROCESSING; kit.status -> IN_PROCESSING"]

  - method: POST
    path: "/screening/specimens/{specimenId}/adequacy"
    description: "Record specimen adequacy determination"
    roles: [LabTechnician]
    code: 200
    input: [adequacy]
    output: LabSpecimen
    side_effects:
      - "adequacy == ADEQUATE: specimen stays/enters ADEQUATE determination (status unchanged if PROCESSING)"
      - "adequacy == INADEQUATE: specimen.status -> INADEQUATE; kit -> CONSUMED; order -> RECOLLECTION_REQUESTED (or rejected when recollection_round >= MAX_RECOLLECTIONS); increments ScreeningOrder.version by 1"

  - method: POST
    path: "/screening/specimens/{specimenId}/result"
    description: "Finalize the screening result and deliver to the ordering provider"
    roles: [LabTechnician]
    code: 201
    input: [outcome]
    output: ScreeningResult
    side_effects: ["specimen -> RESULTED; kit -> CONSUMED; order -> RESULTED; quality_outcome recomputed; cohort -> SCREENED; program counters recomputed; increments ScreeningOrder.version by 1"]

  # --- Navigation ---
  - method: GET
    path: "/screening/results/{resultId}"
    description: "Get one result"
    roles: [ProgramAdmin, Provider, LabTechnician, Navigator]
    code: 200
    input: []
    output: ScreeningResult
    side_effects: []

  - method: POST
    path: "/screening/results/{resultId}/navigation/schedule"
    description: "Schedule follow-up colonoscopy navigation"
    roles: [Navigator]
    code: 200
    input: []
    output: ScreeningResult
    side_effects: ["navigation_status -> SCHEDULED"]

  - method: POST
    path: "/screening/results/{resultId}/navigation/complete"
    description: "Mark colonoscopy navigation completed"
    roles: [Navigator]
    code: 200
    input: []
    output: ScreeningResult
    side_effects: ["navigation_status -> COMPLETED; navigation_completed_at set; quality_outcome recomputed"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body; missing required field; wrong type; unknown enum value" }
  - { id: ERR_DUPLICATE_PATIENT, http: 409, condition: "A patient with the same external_ref already exists" }
  - { id: ERR_PATIENT_NOT_ACTIVE, http: 422, condition: "Patient is DECEASED or OPTED_OUT" }
  - { id: ERR_AGE_OUT_OF_RANGE, http: 422, condition: "Patient age outside [45, 75] at order creation" }
  - { id: ERR_RISK_CATEGORY_EXCLUDED, http: 422, condition: "risk_category == HIGH requires a different test modality" }
  - { id: ERR_CONTRAINDICATION_PRESENT, http: 422, condition: "contraindication_flags non-empty" }
  - { id: ERR_PROVIDER_INACTIVE, http: 422, condition: "Provider is_active == false at order capture" }
  - { id: ERR_COHORT_PROGRAM_MISMATCH, http: 422, condition: "cohort_id does not belong to program_id, or only one of the two supplied" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Order not in a state permitting the requested transition" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted from a state other than PENDING_ELIGIBILITY or ELIGIBLE" }
  - { id: ERR_KIT_INVALID_STATE, http: 409, condition: "Kit not in a state permitting ship/return" }
  - { id: ERR_SPECIMEN_INVALID_STATE, http: 409, condition: "Specimen not in a state permitting the requested lab action" }
  - { id: ERR_SPECIMEN_NOT_ADEQUATE, http: 422, condition: "Result attempted on a specimen whose adequacy != ADEQUATE" }
  - { id: ERR_STABILIZATION_EXPIRED, http: 422, condition: "Processing start at or after kit.stabilization_expires_at" }
  - { id: ERR_RECOLLECTION_LIMIT_REACHED, http: 422, condition: "INADEQUATE determination when recollection_round >= 2" }
  - { id: ERR_ACTIVE_ORDER_EXISTS, http: 409, condition: "Another in-flight order exists for the same patient" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current ScreeningOrder.version" }
  - { id: ERR_PROGRAM_INACTIVE, http: 422, condition: "Program is_active == false for outreach" }
  - { id: ERR_PROGRAM_MODE_VIOLATION, http: 422, condition: "Outreach attempted on a SELF_SERVE program" }
  - { id: ERR_COHORT_INVALID_STATE, http: 409, condition: "Cohort not in a state permitting outreach/exclude" }
  - { id: ERR_NAVIGATION_NOT_REQUIRED, http: 422, condition: "Navigation action attempted on a NEGATIVE result" }
  - { id: ERR_NAVIGATION_INVALID_STATE, http: 409, condition: "Navigation transition attempted from a non-matching navigation_status" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Payer/health-system program operator: manages programs, cohorts, outreach, eligibility determinations, and reporting"
    identity: opaque
    exclusive_operations:
      - "POST /screening/programs"
      - "POST /screening/programs/{id}/cohorts"
      - "POST /screening/programs/{id}/cohorts/{id}/outreach"
      - "POST /screening/programs/{id}/cohorts/{id}/exclude"
      - "POST /screening/programs/{id}/quality-measure-report"
      - "POST /screening/patients/{id}/opt-out"
      - "POST /screening/providers"
      - "POST /screening/orders/{id}/eligibility/confirm"
      - "POST /screening/orders/{id}/eligibility/reject"
      - "POST /screening/orders/{id}/reminders/dispatch"
      - "POST /screening/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (shared with operational roles)"
      - "POST /screening/patients (shared with Provider)"
      - "POST /screening/orders (shared with Provider)"
      - "POST /screening/orders/{id}/cancel (shared with Provider)"

  - name: Provider
    description: "Ordering physician or telehealth-network provider; identity is the Provider entity"
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /screening/patients"
      - "POST /screening/orders"
      - "POST /screening/orders/{id}/cancel"
      - "GET endpoints"

  - name: FulfillmentAgent
    description: "Kit logistics operator: creates kits, ships, and records returns"
    identity: opaque
    exclusive_operations:
      - "POST /screening/orders/{id}/kit"
      - "POST /screening/kits/{id}/ship"
      - "POST /screening/kits/{id}/return"
    shared_operations:
      - "GET endpoints (kits, orders, reminders, sla)"

  - name: LabTechnician
    description: "Laboratory operator: accessioning, processing, adequacy, resulting"
    identity: opaque
    exclusive_operations:
      - "POST /screening/orders/{id}/specimens"
      - "POST /screening/specimens/{id}/process"
      - "POST /screening/specimens/{id}/adequacy"
      - "POST /screening/specimens/{id}/result"
    shared_operations:
      - "GET endpoints (specimens, results, kits)"

  - name: Navigator
    description: "Care navigator for positive-result colonoscopy follow-up"
    identity: opaque
    exclusive_operations:
      - "POST /screening/results/{id}/navigation/schedule"
      - "POST /screening/results/{id}/navigation/complete"
    shared_operations:
      - "GET endpoints (results, orders)"

# =============================================================================
# Constants (referenced by calculations)
# =============================================================================
constants:
  MIN_AGE: 45
  MAX_AGE: 75
  KIT_ABANDON_DAYS: 45
  RECOLLECTION_ABANDON_DAYS: 30
  MAX_RECOLLECTIONS: 2
  STABILIZATION_HOURS: 72
  NAVIGATION_WINDOW_DAYS: 90
  ADHERENCE_WINDOW_DAYS: 365
