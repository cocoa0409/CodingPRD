    distinguishing_aspect: 'Entity pair (ProductionLot, DesignRevision): the lot''s own status is a perfectly valid OPEN, but production is gated on the PINNED revision still being APPROVED and not superseded
      — revision A went SUPERSEDED when revision B was approved, so start-production fails.'
