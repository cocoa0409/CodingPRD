      - name: milestone_complete_from_not_started_returns_invalid_milestone_state
        claim_type: invalid_transitions
        grounds:
          - "§1.2 Milestone declares COMPLETE only reachable from IN_PROGRESS; /complete is not a legal trigger out of NOT_STARTED, and §1.6 declares ERR_INVALID_MILESTONE_STATE (409)."
        distinguishing_aspect: "COMPLETE is declared only from IN_PROGRESS, so triggering it on a NOT_STARTED milestone returns ERR_INVALID_MILESTONE_STATE at 409 and writes no actual_finish_date."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One milestone CONSTRUCTION_COMPLETE (30 days) in its initial state NOT_STARTED; the program is still PLANNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
