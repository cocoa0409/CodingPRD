  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: device_login_blocked_by_vehicle_out_of_service
        grounds:
          - state_machines.ELDDevice.UNBOUND_to_BOUND
          - validations[priority=16]
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          ELDDevice -> Vehicle pair: a device's UNBOUND->BOUND login is rejected when the linked
          Vehicle.status == OUT_OF_SERVICE. The device transition depends on the Vehicle's state.
        test_recipe:
          setup:
            - "Vehicle V is OUT_OF_SERVICE; device installed in V is UNBOUND; Driver D is ACTIVE."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U13", vin: "VINMMM13" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /eld/devices"
              payload: { serial_number: "S13", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-M13", full_name: "Driver M", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
            - call: "PATCH /eld/vehicles/${veh_id}"
              payload: { status: "OUT_OF_SERVICE", expected_vehicle_version: "${veh_v0}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /eld/devices/${dev_id}/login"
