        grounds: ["errors[ERR_DUPLICATE_CODE]", "errors[ERR_DUPLICATE_QUALIFICATION]", "validations[priority=23]"]
        distinguishing_aspect: "Uniqueness is enforced per declared key: a second mold with mold_code M-1 returns 409 ERR_DUPLICATE_CODE, and a second PressQualification for the same (mold_id, press_id) pair returns 409 ERR_DUPLICATE_QUALIFICATION."
        test_recipe:
          setup: ["Customer ACME, press P-150, mold M-1 and one PressQualification for (M-1, P-150)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
