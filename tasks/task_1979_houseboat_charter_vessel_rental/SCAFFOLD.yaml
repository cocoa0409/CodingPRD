# =============================================================================
# Task 1979 — Houseboat & Charter Vessel Rental (Lake Powell) — Seed Tables
# =============================================================================

scenario: |
  1979. Houseboat & Charter Vessel Rental (Lake Powell houseboat rental): fleet
  inventory by size/berth & season pricing, renter qualification & boating-safety
  certificate, checkout orientation & damage deposit, fuel/pump-out policy & final
  settlement, itinerary/geographic limits & grounding liability, mechanical failure
  response & prorated refund, cleaning turn & maintenance window, cancellation &
  weather policy

domain_name: houseboat-charter-rental
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert band
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel        # Booking carries 4 parallel state dimensions; cyclic dimensions on Booking/Vessel/Renter/CleaningTurn
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_band: expert
  entity_count: 12
  endpoint_count: 32
  error_code_count: 24
  calculation_count: 7
  state_machine_count: 12

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vessel display name" }
      - { name: size_class, type: enum, source: input, description: "COMPACT_36 | STANDARD_44 | LUXE_56; drives SeasonRate lookup, BASE_DEPOSIT and orientation item set" }
      - { name: berth_count, type: integer, source: input, description: "Maximum overnight party size; booking party_size must be <= berth_count" }
      - { name: home_marina, type: string, source: input, description: "Home dock name (informational)" }
      - { name: fuel_tank_capacity_gallons, type: integer, source: input, description: "Fuel tank capacity used by settlement_total FUEL line; must be > 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_MAINTENANCE. Cyclic, clock-driven via MaintenanceWindow sweep and incident cascade" }

  - name: SeasonRate
    parent: null
    common_fields: true
    fields:
      - { name: size_class, type: enum, source: input, description: "COMPACT_36 | STANDARD_44 | LUXE_56 this rate applies to" }
      - { name: season, type: enum, source: input, description: "PEAK | SHOULDER | OFF_PEAK (informational label)" }
      - { name: start_date, type: string, source: input, description: "First covered night, ISO date, INCLUSIVE (closed interval)" }
      - { name: end_date, type: string, source: input, description: "Last covered night, ISO date, INCLUSIVE (closed interval)" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Per-night rate in cents; must be > 0" }
      - { name: weekly_discount_pct, type: integer, source: input, description: "Whole-percent discount 0..50 applied to each full 7-night run within this season window" }

  - name: GeoZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code, e.g. ZP-RAINBOW; unique among all GeoZones (ERR_INVALID_REQUEST on duplicate)" }
      - { name: name, type: string, source: input, description: "Zone display name" }
      - { name: max_vessels_per_night, type: integer, source: input, description: "Aggregate per-night occupancy cap used by zone_night_occupancy; must be >= 1" }
      - { name: allowed_size_classes, type: array, source: input, description: "Array of size_class enum members permitted to overnight in this zone" }

  - name: Renter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Renter full legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: qualification_status, type: enum, source: system, description: "UNVERIFIED | QUALIFIED | SUSPENDED. Cyclic; derived from SafetyCertificate states (renter_qualification_recompute)" }
      - { name: risk_score_lifetime, type: integer, source: computed, description: "renter_risk_score LIFETIME variant: sum of SEVERITY_WEIGHT over all RESOLVED incidents on this renter's bookings" }
      - { name: risk_score_rolling_24m, type: integer, source: computed, description: "renter_risk_score ROLLING_24M variant: same sum restricted to occurred_at >= current_date minus 24 months" }
      - { name: deposit_multiplier, type: number, source: computed, description: "Deposit tier from risk_score_rolling_24m: [0,20) -> 1.0, [20,50) -> 1.5, [50,+) -> 2.0" }

  - name: SafetyCertificate
    parent: null
    common_fields: true
    fields:
      - { name: renter_id, type: string, source: input, description: "FK -> Renter.id; owning renter" }
      - { name: cert_number, type: string, source: input, description: "Certificate serial number" }
      - { name: issuing_authority, type: enum, source: input, description: "NASBLA | USCG | STATE" }
      - { name: issued_on, type: string, source: input, description: "ISO issue date" }
      - { name: expires_on, type: string, source: input, description: "ISO expiry date; certificate covers a trip iff expires_on >= booking.end_date (inclusive)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED | REVOKED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; chartered vessel" }
      - { name: renter_id, type: string, source: input, description: "FK -> Renter.id; must equal X-User-ID for Renter role" }
      - { name: start_date, type: string, source: input, description: "First night, ISO date, INCLUSIVE (half-open stay interval [start_date, end_date))" }
      - { name: end_date, type: string, source: input, description: "Checkout day, ISO date, EXCLUSIVE; nights occupied = [start_date, end_date - 1 day]" }
      - { name: party_size, type: integer, source: input, description: "Overnight party size; must satisfy 1 <= party_size <= vessel.berth_count" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CHECKED_OUT | INTERRUPTED | RETURNED | CLOSED | CANCELLED | EXPIRED (lifecycle dimension)" }
      - { name: settlement_status, type: enum, source: system, description: "NONE | PROVISIONAL | FINALIZED (parallel settlement dimension)" }
      - { name: deposit_status, type: enum, source: system, description: "PENDING | HELD | RELEASED | PARTIALLY_APPLIED | FULLY_APPLIED (parallel deposit dimension)" }
      - { name: orientation_status, type: enum, source: system, description: "NOT_STARTED | IN_PROGRESS | COMPLETED | COUNTERSIGNED | CANCELLED (parallel orientation dimension)" }
      - { name: orientation_items, type: array, source: system, description: "Array of {item_code, signed}; item set pinned by vessel.size_class at confirm time: base [SAFETY_BRIEF, DOCKING, ANCHORING, GENERATOR_OPS]; LUXE_56 adds [THRUSTER_OPS, SEWAGE_PUMPOUT]" }
      - { name: total_nights, type: integer, source: computed, description: "end_date - start_date in days" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "rental_quote result; computed at create, recomputed at confirm and modify" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "deposit_requirement result snapshot at create; BASE_DEPOSIT[size_class] x deposit_multiplier" }
      - { name: deposit_held_cents, type: integer, source: system, description: "Amount captured at confirm; 0 while PENDING" }
      - { name: deposit_applied_cents, type: integer, source: system, description: "Portion of deposit consumed at settle" }
      - { name: deposit_released_cents, type: integer, source: system, description: "Portion of deposit returned at settle/cancel" }
      - { name: refund_issued_cents, type: integer, source: system, description: "Cumulative refunds paid to renter (cancellation, mechanical, settlement overage)" }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "settlement_total PROVISIONAL variant computed at checkout; null until checkout" }
      - { name: final_settlement_cents, type: integer, source: computed, description: "settlement_total FINAL variant (net incidentals) computed at settle; null until settle" }
      - { name: checkout_fuel_gauge_percent, type: integer, source: system, description: "Gauge 0..100 recorded at checkout" }
      - { name: checkout_pump_out_done, type: boolean, source: system, description: "Waste tanks pumped out at checkout" }
      - { name: return_fuel_gauge_percent, type: integer, source: system, description: "Gauge 0..100 recorded at return" }
      - { name: return_pump_out_done, type: boolean, source: system, description: "Waste tanks pumped out at return" }
      - { name: actual_return_at, type: string, source: system, description: "ISO datetime of physical return (return payload)" }
      - { name: hold_expires_at, type: string, source: system, description: "created_at + HOLD_TTL_HOURS (48); HELD booking auto-EXPIRED past this instant" }
      - { name: cancellation_reason, type: enum, source: system, description: "RENTER_REQUEST | WEATHER | RENTER_SUSPENDED | VESSEL_MECHANICAL; null unless CANCELLED" }

  - name: Itinerary
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; owning booking" }
      - { name: waypoints, type: array, source: input, description: "Array of {zone_id, night_date}; each night_date must be a night of the booking ([start_date, end_date))" }
      - { name: status, type: enum, source: system, description: "APPROVED | SUPERSEDED | VOID. PUT validates and immediately approves; replacement supersedes; booking cancel voids" }

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; owning booking" }
      - { name: line_type, type: enum, source: system, description: "RENTAL | RENTAL_ADJUSTMENT | FUEL | PUMP_OUT | CLEANING_FEE | LATE_RETURN | DAMAGE | GROUNDING_LIABILITY | MECHANICAL_REFUND | CANCELLATION_REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; refund lines negative; zero-amount lines are never posted" }
      - { name: status, type: enum, source: system, description: "POSTED | PAID | APPLIED_TO_DEPOSIT | REFUNDED" }
      - { name: note, type: string, source: system, description: "Human note, e.g. source incident id or cancel reason" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; vessel reached via booking.vessel_id" }
      - { name: incident_type, type: enum, source: input, description: "MECHANICAL_FAILURE | GROUNDING | DAMAGE" }
      - { name: occurred_at, type: string, source: input, description: "ISO datetime of occurrence; must be >= booking.start_date and <= current logical clock" }
      - { name: description, type: string, source: input, description: "Free-text description (optional)" }
      - { name: status, type: enum, source: system, description: "REPORTED | RESOLVED | REJECTED" }
      - { name: severity, type: enum, source: system, description: "MINOR | MAJOR | TOTAL_LOSS; set at resolve, null while REPORTED" }
      - { name: resolution, type: enum, source: system, description: "REPAIRED_RESUME | REPAIRED_TERMINATE | GROUNDING_CONFIRMED | DAMAGE_ASSESSED | REJECTED; null while REPORTED" }
      - { name: downtime_days, type: integer, source: system, description: "Repair downtime in whole days for REPAIRED_* resolutions; null otherwise" }
      - { name: assessed_damage_cents, type: integer, source: system, description: "Assessed damage amount for DAMAGE_ASSESSED; null otherwise" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel under maintenance" }
      - { name: start_date, type: string, source: input, description: "First blocked day, ISO date, INCLUSIVE (closed interval)" }
      - { name: end_date, type: string, source: input, description: "Last blocked day, ISO date, INCLUSIVE (closed interval); must be >= start_date" }
      - { name: reason, type: string, source: input, description: "Free-text reason (optional)" }
      - { name: source, type: enum, source: system, description: "SCHEDULED_PLANNED | INCIDENT_EMERGENCY; emergency windows are created by incident resolve cascade" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED; clock-driven" }

  - name: CleaningTurn
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; vessel reached via booking.vessel_id" }
      - { name: scheduled_date, type: string, source: system, description: "Turn day; equals booking.end_date at creation, rescheduled on modify" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED; IN_PROGRESS -> IN_PROGRESS self-loop on failed inspection" }
      - { name: re_clean_count, type: integer, source: system, description: "Number of failed inspections; increments on each inspect(passed=false)" }

  - name: WeatherAdvisory
    parent: null
    common_fields: true
    fields:
      - { name: severity, type: enum, source: input, description: "WATCH | WARNING | STORM" }
      - { name: zone_ids, type: array, source: input, description: "Array of GeoZone ids affected; every id must exist (ERR_NOT_FOUND); non-empty" }
      - { name: window_start, type: string, source: input, description: "ISO datetime advisory takes effect (inclusive)" }
      - { name: window_end, type: string, source: input, description: "ISO datetime advisory ends (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED; EXPIRED set by clock sweep when window_end < current clock" }

# =============================================================================
# §1.2 State Machine Table (12 machines; Booking = 4 parallel dimensions)
# =============================================================================
state_machines:
  - entity: Vessel
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Cyclic, clock-driven. No direct mutator endpoint; status is advanced by the /_clock/set_current_utc sweep and by the incident-resolve emergency cascade."
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "system (POST /_clock/set_current_utc sweep: a MaintenanceWindow of this vessel enters [start_date, end_date]); OR system cascade from POST /incidents/{id}/resolve REPAIRED_TERMINATE (emergency window covers current date)"
        actor: system
        preconditions:
          - "A MaintenanceWindow w with w.vessel_id == vessel.id, w.status IN {SCHEDULED, IN_PROGRESS}, and w.start_date <= current_date <= w.end_date exists"
        side_effects:
          - "Each such MaintenanceWindow w with status == SCHEDULED transitions to IN_PROGRESS"
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "system (POST /_clock/set_current_utc sweep: current_date passes end_date of every IN_PROGRESS window of this vessel)"
        actor: system
        preconditions:
          - "No MaintenanceWindow w with w.vessel_id == vessel.id and w.start_date <= current_date <= w.end_date remains"
        side_effects:
          - "Each IN_PROGRESS MaintenanceWindow of this vessel with end_date < current_date transitions to COMPLETED"

  - entity: Booking
    field: status
    initial_state: HELD
    terminal_states: [CLOSED, CANCELLED, EXPIRED]
    note: "Lifecycle dimension of the Booking aggregate. Coexists as an independent dimension alongside settlement_status, deposit_status and orientation_status on the same row; CHECKED_OUT <-> INTERRUPTED forms the mechanical-failure cycle."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Renter
        preconditions:
          - "booking.status == HELD"
          - "renter.qualification_status == QUALIFIED and renter holds >= 1 SafetyCertificate with status == VERIFIED and expires_on >= booking.end_date (ERR_RENTER_NOT_QUALIFIED)"
          - "Half-open [start_date, end_date) does not intersect any other booking of the same vessel with status IN {CONFIRMED, CHECKED_OUT, INTERRUPTED, RETURNED} (ERR_VESSEL_DATE_CONFLICT)"
          - "No MaintenanceWindow of the vessel (status IN {SCHEDULED, IN_PROGRESS}) satisfies window.start_date <= booking.end_date AND window.end_date >= booking.start_date under closed-interval comparison (ERR_MAINTENANCE_DATE_CONFLICT)"
          - "start_date >= current_date (ERR_BOOKING_DATES_INVALID)"
        side_effects:
          - "rental_quote recomputed and pinned into quoted_total_cents"
          - "Charge posted: line_type RENTAL, amount_cents = quoted_total_cents, status PAID"
          - "deposit_status PENDING -> HELD; deposit_held_cents = deposit_required_cents"
          - "orientation_status NOT_STARTED -> IN_PROGRESS; orientation_items created per orientation_item_set(vessel.size_class), all signed = false"
          - "CleaningTurn created: booking_id = booking.id, scheduled_date = booking.end_date, status SCHEDULED, re_clean_count = 0"
          - "increments Booking.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: hold_expires_at < current clock)"
        actor: system
        preconditions:
          - "booking.status == HELD AND booking.hold_expires_at < current clock"
        side_effects:
          - "deposit_status PENDING -> RELEASED (nothing was captured; deposit_held_cents stays 0, deposit_applied_cents = 0, deposit_released_cents = 0)"
          - "increments Booking.version by 1"
      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel (actor Renter, reason RENTER_REQUEST or WEATHER) OR system cascade (reason RENTER_SUSPENDED from certificate revoke / expiry sweep; reason VESSEL_MECHANICAL from incident-resolve emergency window)"
        actor: "Renter or system"
        preconditions:
          - "booking.status IN {HELD, CONFIRMED} (else ERR_BOOKING_NOT_CANCELLABLE)"
          - "Renter-initiated: expected_booking_version matches booking.version (ERR_STALE_VERSION)"
        side_effects:
          - "cancellation_refund computed (STANDARD tiers for RENTER_REQUEST; WEATHER variant 100%; system reasons always 100%)"
          - "If CONFIRMED and refund > 0: Charge posted line_type CANCELLATION_REFUND, amount_cents = -refund_cents, status REFUNDED; refund_issued_cents += refund_cents"
          - "cancellation_reason set (RENTER_REQUEST | WEATHER | RENTER_SUSPENDED | VESSEL_MECHANICAL); WEATHER set only when the weather variant actually applied"
          - "deposit_status -> RELEASED; deposit_released_cents = deposit_held_cents; deposit_applied_cents = 0"
          - "CleaningTurn of this booking with status IN {SCHEDULED, IN_PROGRESS} -> CANCELLED"
          - "orientation_status IN {IN_PROGRESS, COMPLETED, COUNTERSIGNED} -> CANCELLED"
          - "Itinerary of this booking with status == APPROVED -> VOID (frees zone_night_occupancy)"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CHECKED_OUT
        trigger: "POST /bookings/{id}/checkout"
        actor: DockStaff
        preconditions:
          - "booking.status == CONFIRMED"
          - "current_date >= booking.start_date AND current_date < booking.end_date"
          - "Itinerary of this booking with status == APPROVED exists (ERR_ITINERARY_REQUIRED)"
          - "No WeatherAdvisory with status == ACTIVE whose [window_start, window_end) contains the current clock AND whose zone_ids intersect the APPROVED itinerary's waypoint zone_ids (ERR_WEATHER_HOLD_ACTIVE)"
          - "orientation_status == COUNTERSIGNED (ERR_ORIENTATION_NOT_COUNTERSIGNED)"
          - "No CleaningTurn of any booking on the same vessel with status == IN_PROGRESS (ERR_CLEANING_TURN_INCOMPLETE)"
          - "note: a vessel-status checkout gate is intentionally absent — planned windows can never overlap a blocking booking (creation conflict), and emergency windows cascade-cancel overlapping bookings, so vessel IN_MAINTENANCE on a checkout day is unreachable by design"
          - "deposit_status == HELD (ERR_INVALID_STATE if deposit dimension out of order)"
        side_effects:
          - "checkout_fuel_gauge_percent / checkout_pump_out_done recorded from payload"
          - "settlement_status NONE -> PROVISIONAL; provisional_estimate_cents computed via settlement_total PROVISIONAL variant"
          - "increments Booking.version by 1"
      - from: CHECKED_OUT
        to: INTERRUPTED
        trigger: "system cascade from POST /incidents/{id}/resolve with resolution REPAIRED_RESUME or REPAIRED_TERMINATE (severity MAJOR or TOTAL_LOSS)"
        actor: system
        preconditions:
          - "booking.status == CHECKED_OUT"
        side_effects:
          - "mechanical_prorated_refund computed; Charge posted line_type MECHANICAL_REFUND, amount_cents = -refund_cents, status POSTED"
          - "If REPAIRED_TERMINATE: vessel -> IN_MAINTENANCE and emergency MaintenanceWindow [current_date, current_date + downtime_days] created (see Incident machine), which itself cascades to other bookings"
          - "increments Booking.version by 1"
      - from: INTERRUPTED
        to: CHECKED_OUT
        trigger: "system cascade from POST /incidents/{id}/resolve with resolution REPAIRED_RESUME (repair completed on the water)"
        actor: system
        preconditions:
          - "booking.status == INTERRUPTED"
        side_effects:
          - "settlement_status unchanged (stays PROVISIONAL through the cycle)"
          - "increments Booking.version by 1"
      - from: [CHECKED_OUT, INTERRUPTED]
        to: RETURNED
        trigger: "POST /bookings/{id}/return"
        actor: DockStaff
        preconditions:
          - "booking.status IN {CHECKED_OUT, INTERRUPTED}"
          - "payload fuel_gauge_percent IN [0, 100] (ERR_FUEL_GAUGE_INVALID)"
          - "payload actual_return_at >= booking start (ERR_INVALID_REQUEST)"
        side_effects:
          - "return_fuel_gauge_percent / return_pump_out_done / actual_return_at recorded"
          - "CleaningTurn of this booking with status == SCHEDULED -> IN_PROGRESS"
          - "increments Booking.version by 1"
      - from: RETURNED
        to: CLOSED
        trigger: "POST /bookings/{id}/settle"
        actor: DockStaff
        preconditions:
          - "booking.status == RETURNED"
          - "CleaningTurn of this booking has status == COMPLETED (ERR_CLEANING_TURN_INCOMPLETE)"
        side_effects:
          - "settlement_total FINAL variant computed (operational lines FUEL/PUMP_OUT/CLEANING_FEE/LATE_RETURN computed now; DAMAGE/GROUNDING_LIABILITY/MECHANICAL_REFUND lines already POSTED by incident resolves are summed in)"
          - "Non-zero operational Charge lines posted (status POSTED); CLEANING_FEE always posted"
          - "Deposit waterfall: net >= 0 -> deposit_applied_cents = min(net, deposit_held_cents), deposit_released_cents = deposit_held_cents - deposit_applied_cents; net < 0 -> refund_issued_cents += -net, deposit_applied_cents = 0, deposit_released_cents = deposit_held_cents"
          - "Positive incident/operational lines consumed by the deposit are marked APPLIED_TO_DEPOSIT; negative refund lines are marked REFUNDED"
          - "deposit_status -> RELEASED (applied 0) | PARTIALLY_APPLIED (0 < applied < held) | FULLY_APPLIED (applied == held)"
          - "settlement_status PROVISIONAL -> FINALIZED; final_settlement_cents = net"
          - "increments Booking.version by 1"
      - from: [HELD, CONFIRMED]
        to: CONFIRMED
        trigger: "POST /bookings/{id}/modify (dates change; self-transition on CONFIRMED, HELD stays HELD)"
        actor: Renter
        preconditions:
          - "booking.status IN {HELD, CONFIRMED}"
          - "expected_booking_version matches booking.version (ERR_STALE_VERSION)"
          - "1 <= (end_date - start_date) <= MAX_BOOKING_NIGHTS and start_date >= current_date (ERR_BOOKING_DATES_INVALID)"
          - "Half-open overlap recheck against blocking set excluding self (ERR_VESSEL_DATE_CONFLICT); closed-interval maintenance recheck (ERR_MAINTENANCE_DATE_CONFLICT); every new night covered by a SeasonRate (ERR_RATE_NOT_CONFIGURED)"
        side_effects:
          - "start_date / end_date updated; total_nights recomputed; rental_quote recomputed into quoted_total_cents"
          - "If status == CONFIRMED and new quote != old quote: Charge posted line_type RENTAL_ADJUSTMENT, amount_cents = new - old (positive -> status PAID, funds captured now; negative -> status REFUNDED, refund_issued_cents += -amount)"
          - "CleaningTurn of this booking with status == SCHEDULED has scheduled_date reset to new end_date"
          - "increments Booking.version by 1"

  - entity: Booking
    field: settlement_status
    initial_state: NONE
    terminal_states: [FINALIZED]
    note: "Parallel settlement dimension; advances independently of the CHECKED_OUT <-> INTERRUPTED cycle."
    transitions:
      - from: NONE
        to: PROVISIONAL
        trigger: "POST /bookings/{id}/checkout"
        actor: DockStaff
        preconditions: ["covered by checkout transition on Booking.status"]
        side_effects: ["provisional_estimate_cents computed via settlement_total PROVISIONAL variant"]
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /bookings/{id}/settle"
        actor: DockStaff
        preconditions: ["covered by settle transition on Booking.status"]
        side_effects: ["final_settlement_cents computed via settlement_total FINAL variant"]

  - entity: Booking
    field: deposit_status
    initial_state: PENDING
    terminal_states: [RELEASED, PARTIALLY_APPLIED, FULLY_APPLIED]
    note: "Parallel deposit dimension. Invariant: at any terminal state deposit_applied_cents + deposit_released_cents == deposit_held_cents."
    transitions:
      - from: PENDING
        to: HELD
        trigger: "POST /bookings/{id}/confirm"
        actor: Renter
        preconditions: ["covered by confirm transition on Booking.status"]
        side_effects: ["deposit_held_cents = deposit_required_cents"]
      - from: PENDING
        to: RELEASED
        trigger: "system (HELD booking expires or is cancelled before confirm)"
        actor: system
        preconditions: ["booking.status transitions HELD -> EXPIRED or HELD -> CANCELLED"]
        side_effects: ["no funds move; deposit_held_cents remains 0"]
      - from: HELD
        to: RELEASED
        trigger: "POST /bookings/{id}/settle (net incidentals <= 0) OR POST /bookings/{id}/cancel OR system cascade cancel"
        actor: "DockStaff or Renter or system"
        preconditions: ["covered by settle/cancel transitions"]
        side_effects: ["deposit_released_cents = deposit_held_cents; deposit_applied_cents = 0"]
      - from: HELD
        to: PARTIALLY_APPLIED
        trigger: "POST /bookings/{id}/settle when 0 < net < deposit_held_cents"
        actor: DockStaff
        preconditions: ["covered by settle transition"]
        side_effects: ["deposit_applied_cents = net; deposit_released_cents = held - net"]
      - from: HELD
        to: FULLY_APPLIED
        trigger: "POST /bookings/{id}/settle when net >= deposit_held_cents"
        actor: DockStaff
        preconditions: ["covered by settle transition"]
        side_effects: ["deposit_applied_cents = deposit_held_cents; deposit_released_cents = 0"]

  - entity: Booking
    field: orientation_status
    initial_state: NOT_STARTED
    terminal_states: [CANCELLED]
    note: "Parallel orientation dimension with the COMPLETED -> IN_PROGRESS reopen cycle driven by staff rejection."
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /bookings/{id}/confirm"
        actor: Renter
        preconditions: ["covered by confirm transition"]
        side_effects: ["orientation_items created per orientation_item_set(vessel.size_class), all signed = false"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (POST /bookings/{id}/orientation/sign-item sets signed = true on the last unsigned item)"
        actor: system
        preconditions: ["every orientation_items[].signed == true after this sign"]
        side_effects: []
      - from: COMPLETED
        to: COUNTERSIGNED
        trigger: "POST /bookings/{id}/orientation/countersign with approved = true"
        actor: DockStaff
        preconditions: ["orientation_status == COMPLETED"]
        side_effects: ["increments Booking.version by 1"]
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /bookings/{id}/orientation/countersign with approved = false and item_code given"
        actor: DockStaff
        preconditions: ["orientation_status == COMPLETED", "item_code exists in orientation_items (ERR_INVALID_REQUEST)"]
        side_effects: ["the named item's signed flag resets to false (reopen cycle)", "increments Booking.version by 1"]
      - from: [IN_PROGRESS, COMPLETED, COUNTERSIGNED]
        to: CANCELLED
        trigger: "system (booking CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Renter
    field: qualification_status
    initial_state: UNVERIFIED
    terminal_states: []
    note: "Cyclic UNVERIFIED -> QUALIFIED -> SUSPENDED -> QUALIFIED; derived from SafetyCertificate states via renter_qualification_recompute."
    transitions:
      - from: UNVERIFIED
        to: QUALIFIED
        trigger: "POST /certificates/{id}/decision VERIFY on one of the renter's certificates"
        actor: DockStaff
        preconditions: ["verified certificate has expires_on >= current_date"]
        side_effects: ["renter_qualification_recompute"]
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (POST /certificates/{id}/decision REVOKE removes the last covering certificate; OR POST /_clock/set_current_utc sweep expires the last covering certificate)"
        actor: system
        preconditions: ["no SafetyCertificate of this renter with status == VERIFIED and expires_on >= current_date remains"]
        side_effects:
          - "Cascade: every booking of this renter with status IN {HELD, CONFIRMED} and start_date > current_date transitions to CANCELLED with cancellation_reason RENTER_SUSPENDED, 100% rental refund (CANCELLATION_REFUND charge when CONFIRMED), deposit -> RELEASED, CleaningTurn -> CANCELLED, orientation -> CANCELLED, APPROVED itinerary -> VOID"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /certificates/{id}/decision VERIFY on a new certificate of this renter"
        actor: DockStaff
        preconditions: ["verified certificate has expires_on >= current_date"]
        side_effects: ["renter_qualification_recompute"]

  - entity: SafetyCertificate
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED, REVOKED]
    note: "Branching at SUBMITTED; renewal happens by submitting a new SafetyCertificate resource (resubmission), which drives the Renter-level cycle."
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /certificates/{id}/decision with decision = VERIFY"
        actor: DockStaff
        preconditions: ["certificate.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["renter_qualification_recompute on owning renter (may drive UNVERIFIED/SUSPENDED -> QUALIFIED)"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certificates/{id}/decision with decision = REJECT"
        actor: DockStaff
        preconditions: ["certificate.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["renter_qualification_recompute"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /certificates/{id}/decision with decision = REVOKE"
        actor: FleetManager
        preconditions: ["certificate.status == VERIFIED (ERR_INVALID_STATE)"]
        side_effects: ["renter_qualification_recompute; if renter becomes SUSPENDED the booking-cancellation cascade fires (see Renter machine)"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: expires_on < current_date)"
        actor: system
        preconditions: ["certificate.status == VERIFIED AND expires_on < current_date"]
        side_effects: ["renter_qualification_recompute; if renter becomes SUSPENDED the booking-cancellation cascade fires"]

  - entity: Itinerary
    field: status
    initial_state: APPROVED
    terminal_states: [SUPERSEDED, VOID]
    note: "PUT /bookings/{id}/itinerary validates atomically and creates the record already APPROVED; a later PUT supersedes it; booking cancellation voids it."
    transitions:
      - from: APPROVED
        to: SUPERSEDED
        trigger: "PUT /bookings/{id}/itinerary on the same booking (replacement record created APPROVED)"
        actor: Renter
        preconditions: ["booking.status IN {HELD, CONFIRMED}"]
        side_effects: ["zone_night_occupancy immediately reflects only the replacement's waypoints"]
      - from: APPROVED
        to: VOID
        trigger: "system (booking CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["zone_night_occupancy freed"]

  - entity: Incident
    field: status
    initial_state: REPORTED
    terminal_states: [RESOLVED, REJECTED]
    note: "Branching; resolution side effects depend on incident_type + resolution + severity."
    transitions:
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve with resolution != REJECTED"
        actor: Mechanic
        preconditions:
          - "incident.status == REPORTED (ERR_INVALID_STATE)"
          - "resolution is legal for incident_type: MECHANICAL_FAILURE -> {REPAIRED_RESUME, REPAIRED_TERMINATE}; GROUNDING -> {GROUNDING_CONFIRMED}; DAMAGE -> {DAMAGE_ASSESSED} (else ERR_INCIDENT_RESOLUTION_MISMATCH)"
          - "REPAIRED_* require severity IN {MAJOR, TOTAL_LOSS} and downtime_days >= 1 (else ERR_INCIDENT_RESOLUTION_MISMATCH); MINOR mechanical resolves are only possible via... (MINOR mechanical failure is rejected with ERR_INCIDENT_RESOLUTION_MISMATCH and must be reported-resolved as DAMAGE if chargeable)"
          - "DAMAGE_ASSESSED requires assessed_damage_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "severity / resolution / downtime_days / assessed_damage_cents recorded"
          - "REPAIRED_RESUME: booking CHECKED_OUT -> INTERRUPTED -> CHECKED_OUT; Charge MECHANICAL_REFUND -round_half_up(quoted_total_cents x downtime_days / total_nights) posted on booking"
          - "REPAIRED_TERMINATE: booking CHECKED_OUT -> INTERRUPTED; Charge MECHANICAL_REFUND -round_half_up(quoted_total_cents x (end_date - current_date) / total_nights) posted; vessel -> IN_MAINTENANCE; emergency MaintenanceWindow [current_date, current_date + downtime_days] (closed, source INCIDENT_EMERGENCY, status IN_PROGRESS) created; every other booking of the vessel with status IN {HELD, CONFIRMED} overlapping the window under closed-interval comparison -> CANCELLED with reason VESSEL_MECHANICAL and 100% refund cascade"
          - "GROUNDING_CONFIRMED: Charge GROUNDING_LIABILITY +GROUNDING_BASE[severity] posted on booking"
          - "DAMAGE_ASSESSED: Charge DAMAGE +assessed_damage_cents posted on booking"
          - "renter_risk_score recomputed for the booking's renter (LIFETIME and ROLLING_24M variants); deposit_multiplier re-derived for FUTURE bookings only"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /incidents/{id}/resolve with resolution = REJECTED"
        actor: Mechanic
        preconditions: ["incident.status == REPORTED (ERR_INVALID_STATE)"]
        side_effects: ["no charges, no state changes on booking or vessel"]

  - entity: MaintenanceWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    note: "Linear, fully clock-driven; emergency windows spawn already IN_PROGRESS."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (POST /_clock/set_current_utc sweep: start_date <= current_date <= end_date)"
        actor: system
        preconditions: []
        side_effects: ["vessel AVAILABLE -> IN_MAINTENANCE"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (POST /_clock/set_current_utc sweep: current_date > end_date)"
        actor: system
        preconditions: []
        side_effects: ["vessel IN_MAINTENANCE -> AVAILABLE when no other window of the vessel covers current_date"]

  - entity: CleaningTurn
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "IN_PROGRESS -> IN_PROGRESS self-loop on failed inspection (re-clean cycle)."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (POST /bookings/{id}/return on the owning booking)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cleaning-turns/{id}/inspect with passed = true"
        actor: DockStaff
        preconditions: ["turn.status == IN_PROGRESS (ERR_INVALID_STATE)"]
        side_effects: []
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /cleaning-turns/{id}/inspect with passed = false"
        actor: DockStaff
        preconditions: ["turn.status == IN_PROGRESS (ERR_INVALID_STATE)"]
        side_effects: ["re_clean_count += 1"]
      - from: [SCHEDULED, IN_PROGRESS]
        to: CANCELLED
        trigger: "system (owning booking CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WeatherAdvisory
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    note: "Linear, clock-driven expiry."
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: window_end < current clock)"
        actor: system
        preconditions: []
        side_effects: ["expired advisories no longer trigger the WEATHER cancellation variant or the checkout weather hold"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races, OCC on Booking.version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-modify-stale-version
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/modify"
    occ_field: "expected_booking_version"
    description: |
      Modifying a Booking whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just modified the same booking (new dates, new quote, version bumped) and
      the current writer's view of the booking is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: booking-cancel-stale-version
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/cancel"
    occ_field: "expected_booking_version"
    description: |
      Cancelling a Booking whose version has advanced since the client last
      observed it is rejected. The booking is still CONFIRMED and cancellable,
      but a prior modify changed the dates (and therefore the cancellation
      refund tier input), so the client's refund expectation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (7 calculations)
# =============================================================================
calculations:
  - name: rental_quote
    trigger: "booking create (pins initial quote), confirm (recomputes and pins), modify (recomputes; RENTAL_ADJUSTMENT delta if CONFIRMED)"
    algorithm: tiered_pricing
    formula: |
      nights = every date d with start_date <= d < end_date (half-open)
      for each night d: rate(d) = the SeasonRate with size_class == vessel.size_class
        and start_date <= d <= end_date (closed window); missing rate -> ERR_RATE_NOT_CONFIGURED
      subtotal = sum over nights of rate(d).nightly_rate_cents
      weekly discount, per season window independently:
        for each SeasonRate r touched by the stay:
          n_r = count of nights d with r.start_date <= d <= r.end_date
          discount_r = floor(n_r / 7) * 7 * r.nightly_rate_cents * r.weekly_discount_pct / 100
      quoted_total_cents = subtotal - sum(discount_r)
      (weekly runs never span a season boundary: a 15-night stay split 4+11 yields
      floor(4/7)=0 discounted nights in PEAK and floor(11/7)=1 run of 7 in SHOULDER)
    input_set: "booking nights [start_date, end_date); SeasonRate rows matching vessel.size_class"
    constants:
      MAX_BOOKING_NIGHTS: 21
    precision: "integer cents; weekly_discount_pct is a whole percent so discount_r is exact; no rounding step"
    variants: []

  - name: deposit_requirement
    trigger: "booking create (snapshot into deposit_required_cents; never recomputed afterwards even if risk changes)"
    algorithm: threshold
    formula: |
      multiplier = 1.0 if renter.risk_score_rolling_24m < 20
                   1.5 if 20 <= renter.risk_score_rolling_24m < 50
                   2.0 if renter.risk_score_rolling_24m >= 50
      deposit_required_cents = BASE_DEPOSIT[vessel.size_class] * multiplier
    input_set: "vessel.size_class; renter.risk_score_rolling_24m at create time"
    constants:
      BASE_DEPOSIT: { COMPACT_36: 150000, STANDARD_44: 200000, LUXE_56: 250000 }
      TIER_MED_MIN: 20
      TIER_HIGH_MIN: 50
    precision: "integer cents; multipliers 1.0/1.5/2.0 keep the product exact"
    variants: []

  - name: renter_risk_score
    trigger: "incident resolve (RESOLVED only) for the booking's renter; recompute both variants eagerly (derived_field_reconciliation)"
    algorithm: weighted_scoring
    formula: |
      base set I = incidents i where i.booking.renter_id == renter.id and i.status == RESOLVED
      score(S) = sum over i in S of SEVERITY_WEIGHT[i.severity]
      LIFETIME:        S = I (no time window)
      ROLLING_24M:     S = I filtered to i.occurred_at >= (current_date - 24 months), boundary INCLUSIVE
      deposit_multiplier uses the ROLLING_24M variant only (see deposit_requirement)
    input_set: "RESOLVED incidents across all bookings of the renter (REJECTED excluded)"
    constants:
      SEVERITY_WEIGHT: { MINOR: 10, MAJOR: 25, TOTAL_LOSS: 60 }
      WINDOW_MONTHS: 24
    precision: "integer score, exact"
    variants:
      - name: LIFETIME
        when: "renter profile reporting (risk_score_lifetime)"
        difference: "no time window; counts every RESOLVED incident ever"
      - name: ROLLING_24M
        when: "deposit_requirement at booking create (risk_score_rolling_24m)"
        difference: "drops incidents older than 24 months, so identical history yields a lower score once an incident ages out"

  - name: settlement_total
    trigger: "checkout (PROVISIONAL variant, into provisional_estimate_cents); settle (FINAL variant, into final_settlement_cents)"
    algorithm: chronological
    formula: |
      FINAL variant (at settle), net incidentals only (RENTAL is prepaid at confirm and excluded):
        FUEL: gallons_owed = round_half_up(max(0, checkout_fuel_gauge_percent - return_fuel_gauge_percent)
                                * vessel.fuel_tank_capacity_gallons / 100, to 1 decimal)
              fuel_cents = gallons_owed * FUEL_PRICE_CENTS_PER_GALLON
              (return gauge >= checkout gauge -> 0; no credit for over-fueling)
        PUMP_OUT: PUMP_OUT_FEE_CENTS if checkout_pump_out_done AND NOT return_pump_out_done else 0
        CLEANING_FEE: CLEANING_FEE_CENTS always
        LATE_RETURN: deadline = end_date T10:00:00Z; if actual_return_at > deadline:
                       late_hours = ceil((actual_return_at - deadline) / 1 hour); late_cents = late_hours * LATE_HOURLY_CENTS
                     else 0
        Plus every already-POSTED incident Charge of the booking: DAMAGE, GROUNDING_LIABILITY (positive),
          MECHANICAL_REFUND (negative)
      Rounding order (PINNED): each line is computed and rounded to whole cents FIRST
        (round_half_up); the settlement total is the plain sum of the rounded lines.
        Never sum unrounded components and round once at the end.
      net = FUEL + PUMP_OUT + CLEANING_FEE + LATE_RETURN + DAMAGE + GROUNDING_LIABILITY + MECHANICAL_REFUND
      deposit waterfall: net >= 0 -> applied = min(net, deposit_held_cents), renter_owes = net - applied,
        released = deposit_held_cents - applied
        net < 0 -> applied = 0, released = deposit_held_cents, refund_issued = -net
    input_set: "booking gauge/pump-out/return fields; RESOLVED-incident charges of the booking; deposit fields"
    constants:
      FUEL_PRICE_CENTS_PER_GALLON: 700
      PUMP_OUT_FEE_CENTS: 15000
      CLEANING_FEE_CENTS: 25000
      LATE_HOURLY_CENTS: 5000
      RETURN_DEADLINE_LOCAL: "10:00:00Z on end_date"
      GROUNDING_BASE: { MINOR: 50000, MAJOR: 250000, TOTAL_LOSS: 900000 }
    precision: "whole cents, round_half_up per line BEFORE summation (pinned order)"
    variants:
      - name: PROVISIONAL
        when: "computed at checkout, stored in provisional_estimate_cents"
        difference: "FUEL estimated as round_half_up(ESTIMATED_BURN_PCT * tank_capacity, 1 decimal) * price with ESTIMATED_BURN_PCT = 50%; PUMP_OUT assumed due (+15000); CLEANING_FEE included; LATE_RETURN/DAMAGE/GROUNDING_LIABILITY/MECHANICAL_REFUND all 0 — so the provisional estimate differs from the final settlement for the same booking"
      - name: FINAL
        when: "computed at settle from actual gauge readings, actual return time and posted incident charges"
        difference: "uses measured (checkout-return) gauge delta instead of the 50% burn estimate and real incident lines"
    constants_provisional:
      ESTIMATED_BURN_PCT: 50

  - name: cancellation_refund
    trigger: "POST /bookings/{id}/cancel; also system cascades (RENTER_SUSPENDED, VESSEL_MECHANICAL) which always take the 100% path"
    algorithm: threshold
    formula: |
      if booking.status == HELD: refund_cents = 0 (nothing was paid; deposit was never captured)
      else (CONFIRMED):
        days_before = start_date - current_date (whole days)
        STANDARD variant tiers on quoted_total_cents:
          days_before >= 30  -> 90%
          14 <= days_before < 30 -> 50%
          8 <= days_before < 14 -> 25%
          days_before < 8 -> 0%
        WEATHER variant (overrides tiers): if any WeatherAdvisory with status == ACTIVE has
          window_start < booking.end_date AND window_end > booking.start_date (interval overlap)
          AND advisory.zone_ids intersects the zone_ids of the booking's APPROVED itinerary waypoints
          -> 100%, and cancellation_reason = WEATHER
        SYSTEM variant: reasons RENTER_SUSPENDED / VESSEL_MECHANICAL -> 100%
      refund_cents = round_half_up(quoted_total_cents * pct / 100) to whole cents
    input_set: "booking dates, quoted_total_cents, current_date; ACTIVE WeatherAdvisory rows; APPROVED itinerary waypoints"
    constants:
      TIER_FULL_DAYS: 30
      TIER_HALF_DAYS: 14
      TIER_QUARTER_DAYS: 8
      PCT_FULL: 90
      PCT_HALF: 50
      PCT_QUARTER: 25
    precision: "whole cents, round_half_up"
    variants:
      - name: STANDARD
        when: "renter-initiated cancel with no covering advisory"
        difference: "tiered by days_before; can be 0"
      - name: WEATHER
        when: "renter-initiated cancel while an ACTIVE advisory covers the stay window and itinerary zones"
        difference: "always 100% regardless of days_before; same booking can yield 0% (STANDARD) or 100% (WEATHER) depending only on advisory coverage"

  - name: mechanical_prorated_refund
    trigger: "POST /incidents/{id}/resolve with REPAIRED_RESUME or REPAIRED_TERMINATE"
    algorithm: chronological
    formula: |
      total_nights = booking.end_date - booking.start_date (days)
      REPAIRED_TERMINATE: unused_nights = end_date - current_date
        (the interrupt day counts as USED; only full remaining nights are refunded)
      REPAIRED_RESUME: unused_nights = downtime_days
        with 1 <= downtime_days <= (end_date - current_date) (ERR_INCIDENT_RESOLUTION_MISMATCH)
      refund_cents = round_half_up(quoted_total_cents * unused_nights / total_nights) to whole cents
      posted as a single negative Charge line MECHANICAL_REFUND (per-line rounding, then settlement sums it)
    input_set: "booking dates and quoted_total_cents; current_date; downtime_days for RESUME"
    constants: {}
    precision: "whole cents, round_half_up"
    variants: []

  - name: zone_night_occupancy
    trigger: "PUT /bookings/{id}/itinerary (approval gate, evaluated per waypoint)"
    algorithm: aggregation
    formula: |
      for each waypoint (zone z, night d) of the submitted itinerary:
        occupancy(z, d) = count of itineraries I where
          I.status == APPROVED
          AND I.booking_id != this booking's id is NOT excluded — replacement PUT supersedes
              this booking's prior APPROVED itinerary BEFORE counting, so self never double-counts
          AND I.booking.status IN {CONFIRMED, CHECKED_OUT, INTERRUPTED, RETURNED}
          AND I has a waypoint (z, d)
        approve requires occupancy(z, d) < GeoZone(z).max_vessels_per_night for EVERY waypoint (strict <)
      violations -> ERR_ZONE_CAPACITY_EXCEEDED (capacity) evaluated AFTER ERR_ZONE_SIZE_CLASS_FORBIDDEN
      and ERR_ITINERARY_WAYPOINT_OUT_OF_RANGE per validation priority
    input_set: "APPROVED itineraries whose bookings are in {CONFIRMED, CHECKED_OUT, INTERRUPTED, RETURNED}; SUPERSEDED and VOID excluded"
    constants: {}
    precision: "integer counts, exact"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Renter role may only act on own resources: booking.renter_id == X-User-ID (bookings, itinerary, orientation, incidents) and renter id == X-User-ID on /renters/{id} subroutes"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "renter-scoped endpoints when called with role Renter"
  - priority: 4
    category: existence
    check: "Every path id exists (booking, vessel, renter, certificate, incident, cleaning-turn); zone_ids inside weather advisory and itinerary payloads exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-addressing endpoints"
  - priority: 5
    category: existence
    check: "Request body well-formed: required fields present, types match, enum members valid, orientation item_code exists on the booking, zone_ids non-empty, dates parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 6
    category: state
    check: "OCC: expected_booking_version == booking.version on modify/cancel (checked before other state preconditions)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/modify, POST /bookings/{id}/cancel"
  - priority: 7
    category: state
    check: "Resource in a valid state for the requested transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "confirm, modify, checkout, return, settle, certificate decision, cleaning-turn inspect, incident resolve, orientation sign-item/countersign, itinerary PUT"
  - priority: 8
    category: state
    check: "Cancel only from HELD or CONFIRMED"
    error_id: ERR_BOOKING_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/cancel"
  - priority: 9
    category: business_safety
    check: "Renter QUALIFIED and holds >= 1 VERIFIED certificate with expires_on >= booking.end_date (inclusive: expires_on == end_date passes)"
    error_id: ERR_RENTER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/confirm"
  - priority: 10
    category: business_safety
    check: "Checkout weather hold: no ACTIVE advisory covering current clock whose zone_ids intersect the APPROVED itinerary's zones"
    error_id: ERR_WEATHER_HOLD_ACTIVE
    http_status: 422
    applies_to: "POST /bookings/{id}/checkout"
  - priority: 11
    category: business_temporal
    check: "Booking date sanity: end_date > start_date, total_nights <= 21, start_date >= current_date (maintenance-window and advisory window sanity is priority 5 ERR_INVALID_REQUEST)"
    error_id: ERR_BOOKING_DATES_INVALID
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/modify"
  - priority: 12
    category: business_temporal
    check: "Half-open booking overlap: [start_date, end_date) vs any same-vessel booking in {CONFIRMED, CHECKED_OUT, INTERRUPTED, RETURNED}; touching (end == start) is ALLOWED"
    error_id: ERR_VESSEL_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/confirm, POST /bookings/{id}/modify"
  - priority: 13
    category: business_temporal
    check: "Closed-interval maintenance conflict: window.start_date <= booking.end_date AND window.end_date >= booking.start_date (touching endpoints CONFLICT); also window-vs-window conflicts on the same vessel"
    error_id: ERR_MAINTENANCE_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /vessels/{id}/maintenance-windows, POST /bookings, POST /bookings/{id}/confirm, POST /bookings/{id}/modify"
  - priority: 14
    category: business_temporal
    check: "Season rate windows for the same size_class must not overlap (closed-interval comparison)"
    error_id: ERR_SEASON_RATE_OVERLAP
    http_status: 409
    applies_to: "POST /season-rates"
  - priority: 15
    category: business_constraint
    check: "Every night of the stay covered by a SeasonRate of the vessel's size_class"
    error_id: ERR_RATE_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/modify, POST /bookings/{id}/confirm"
  - priority: 16
    category: business_constraint
    check: "party_size <= vessel.berth_count"
    error_id: ERR_PARTY_EXCEEDS_BERTH
    http_status: 422
    applies_to: "POST /bookings"
  - priority: 17
    category: business_constraint
    check: "Itinerary waypoint night_date must be a night of the booking (start_date <= night_date < end_date)"
    error_id: ERR_ITINERARY_WAYPOINT_OUT_OF_RANGE
    http_status: 422
    applies_to: "PUT /bookings/{id}/itinerary"
  - priority: 18
    category: business_constraint
    check: "Waypoint zone allows the vessel's size_class"
    error_id: ERR_ZONE_SIZE_CLASS_FORBIDDEN
    http_status: 422
    applies_to: "PUT /bookings/{id}/itinerary"
  - priority: 19
    category: business_constraint
    check: "zone_night_occupancy < max_vessels_per_night for every waypoint (strict)"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "PUT /bookings/{id}/itinerary"
  - priority: 20
    category: business_constraint
    check: "Checkout requires an APPROVED itinerary"
    error_id: ERR_ITINERARY_REQUIRED
    http_status: 422
    applies_to: "POST /bookings/{id}/checkout"
  - priority: 21
    category: business_constraint
    check: "Checkout requires orientation_status == COUNTERSIGNED"
    error_id: ERR_ORIENTATION_NOT_COUNTERSIGNED
    http_status: 409
    applies_to: "POST /bookings/{id}/checkout"
  - priority: 22
    category: business_constraint
    check: "No CleaningTurn IN_PROGRESS on the same vessel at checkout; settle requires this booking's turn COMPLETED"
    error_id: ERR_CLEANING_TURN_INCOMPLETE
    http_status: 409
    applies_to: "POST /bookings/{id}/checkout, POST /bookings/{id}/settle"
  - priority: 23
    category: business_constraint
    check: "fuel_gauge_percent within [0, 100]; return requires prior checkout readings present"
    error_id: ERR_FUEL_GAUGE_INVALID
    http_status: 422
    applies_to: "POST /bookings/{id}/checkout, POST /bookings/{id}/return"
  - priority: 24
    category: business_referential
    check: "Incident resolution legal for incident_type with required payload fields (severity, downtime_days, assessed_damage_cents) per Incident machine"
    error_id: ERR_INCIDENT_RESOLUTION_MISMATCH
    http_status: 422
    applies_to: "POST /incidents/{id}/resolve"

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/vessels"
    description: "Register a vessel in the fleet"
    roles: [FleetManager]
    code: 201
    input: [name, size_class, berth_count, home_marina, fuel_tank_capacity_gallons]
    output: Vessel
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/vessels/{id}"
    description: "Get vessel details including current status"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: Vessel
    side_effects: []
  - method: POST
    path: "/season-rates"
    description: "Create a season rate window for a size class"
    roles: [FleetManager]
    code: 201
    input: [size_class, season, start_date, end_date, nightly_rate_cents, weekly_discount_pct]
    output: SeasonRate
    side_effects: ["validates no closed-interval overlap with existing rates of the same size_class (ERR_SEASON_RATE_OVERLAP)"]
  - method: POST
    path: "/geo-zones"
    description: "Create a geographic zone with nightly capacity and allowed size classes"
    roles: [FleetManager]
    code: 201
    input: [zone_code, name, max_vessels_per_night, allowed_size_classes]
    output: GeoZone
    side_effects: []
  - method: POST
    path: "/vessels/{id}/maintenance-windows"
    description: "Schedule a maintenance window (closed interval); conflicts with blocking bookings and other windows"
    roles: [FleetManager]
    code: 201
    input: [start_date, end_date, "reason?"]
    output: MaintenanceWindow
    side_effects: ["status = SCHEDULED, source = SCHEDULED_PLANNED; if current_date already inside the window: status IN_PROGRESS and vessel AVAILABLE -> IN_MAINTENANCE"]
  - method: GET
    path: "/vessels/{id}/maintenance-windows"
    description: "List maintenance windows of a vessel"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: MaintenanceWindow[]
    side_effects: []
  - method: POST
    path: "/weather-advisories"
    description: "Issue a weather advisory over zones and a datetime window"
    roles: [FleetManager]
    code: 201
    input: [severity, zone_ids, window_start, window_end]
    output: WeatherAdvisory
    side_effects: ["status = ACTIVE"]
  - method: POST
    path: "/renters"
    description: "Register a renter (self-service)"
    roles: [Renter]
    code: 201
    input: [full_name, email, date_of_birth]
    output: Renter
    side_effects: ["qualification_status = UNVERIFIED; risk scores 0; deposit_multiplier 1.0"]
  - method: GET
    path: "/renters/{id}"
    description: "Get renter profile incl. qualification status and both risk-score variants"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: Renter
    side_effects: []
  - method: POST
    path: "/renters/{id}/certificates"
    description: "Submit a boating-safety certificate (also the resubmission path after EXPIRED/REJECTED/REVOKED)"
    roles: [Renter]
    code: 201
    input: [cert_number, issuing_authority, issued_on, expires_on]
    output: SafetyCertificate
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/renters/{id}/certificates"
    description: "List certificates of a renter"
    roles: [Renter, DockStaff, FleetManager]
    code: 200
    input: []
    output: SafetyCertificate[]
    side_effects: []
  - method: POST
    path: "/certificates/{id}/decision"
    description: "Verify or reject a SUBMITTED certificate (DockStaff), or revoke a VERIFIED one (FleetManager); drives renter qualification recompute and the suspension cascade"
    roles: [DockStaff, FleetManager]
    code: 200
    input: [decision]
    output: SafetyCertificate
    side_effects: ["SUBMITTED -> VERIFIED/REJECTED (decision VERIFY/REJECT, DockStaff or FleetManager); VERIFIED -> REVOKED (decision REVOKE, FleetManager or DockStaff); renter_qualification_recompute; suspension cascade on last covering certificate lost"]
  - method: POST
    path: "/bookings"
    description: "Create a booking in HELD with computed quote and deposit requirement"
    roles: [Renter]
    code: 201
    input: [vessel_id, renter_id, start_date, end_date, party_size]
    output: Booking
    side_effects: ["status = HELD, settlement_status = NONE, deposit_status = PENDING, orientation_status = NOT_STARTED; rental_quote and deposit_requirement computed; hold_expires_at = created_at + 48h"]
  - method: GET
    path: "/bookings/{id}"
    description: "Get booking with all four parallel state dimensions and ledger fields"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings with filters and pagination"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: ["vessel_id?", "renter_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: ["Renter role sees only own bookings (renter_id == X-User-ID)"]
  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Confirm a HELD booking: pins quote, captures rental + deposit, creates orientation and cleaning turn"
    roles: [Renter]
    code: 200
    input: []
    output: Booking
    side_effects: ["HELD -> CONFIRMED; RENTAL charge posted PAID; deposit PENDING -> HELD; orientation NOT_STARTED -> IN_PROGRESS with the size-class item set; CleaningTurn created SCHEDULED; increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/modify"
    description: "Change dates of a HELD or CONFIRMED booking (OCC-guarded); re-quotes and posts RENTAL_ADJUSTMENT when CONFIRMED"
    roles: [Renter]
    code: 200
    input: [expected_booking_version, start_date, end_date]
    output: Booking
    side_effects: ["dates + quote updated; RENTAL_ADJUSTMENT charge when CONFIRMED and quote changed; cleaning turn rescheduled; increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Renter-initiated cancel (OCC-guarded) with tiered or weather-variant refund"
    roles: [Renter]
    code: 200
    input: [expected_booking_version, "reason?"]
    output: Booking
    side_effects: ["-> CANCELLED; cancellation_refund; CANCELLATION_REFUND charge when CONFIRMED and refund > 0; deposit RELEASED; turn/orientation CANCELLED; itinerary VOID; increments Booking.version by 1"]
  - method: PUT
    path: "/bookings/{id}/itinerary"
    description: "Submit/replace the itinerary; validates waypoint range, size-class permission and zone capacity atomically, then creates it APPROVED (superseding any prior)"
    roles: [Renter]
    code: 201
    input: [waypoints]
    output: Itinerary
    side_effects: ["prior APPROVED itinerary of this booking -> SUPERSEDED before occupancy counting; new record status APPROVED"]
  - method: GET
    path: "/bookings/{id}/itinerary"
    description: "List itineraries of a booking (current APPROVED and historical SUPERSEDED/VOID)"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: Itinerary[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/orientation/sign-item"
    description: "Renter signs one orientation item; auto-completes orientation when the last item is signed"
    roles: [Renter]
    code: 200
    input: [item_code]
    output: Booking
    side_effects: ["item signed = true; orientation_status IN_PROGRESS -> COMPLETED when all signed; increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/orientation/countersign"
    description: "DockStaff countersigns a COMPLETED orientation, or rejects one item (reopens the cycle to IN_PROGRESS)"
    roles: [DockStaff]
    code: 200
    input: [approved, "item_code?"]
    output: Booking
    side_effects: ["COMPLETED -> COUNTERSIGNED (approved=true); COMPLETED -> IN_PROGRESS with named item unsigned (approved=false); increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/checkout"
    description: "Check out the vessel: records checkout gauge/pump-out, computes PROVISIONAL settlement estimate"
    roles: [DockStaff]
    code: 200
    input: [fuel_gauge_percent, pump_out_done]
    output: Booking
    side_effects: ["CONFIRMED -> CHECKED_OUT; settlement NONE -> PROVISIONAL with provisional_estimate_cents; increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/return"
    description: "Check the vessel back in: records return gauge/pump-out and actual return time; starts the cleaning turn"
    roles: [DockStaff]
    code: 200
    input: [fuel_gauge_percent, pump_out_done, actual_return_at]
    output: Booking
    side_effects: ["CHECKED_OUT/INTERRUPTED -> RETURNED; CleaningTurn SCHEDULED -> IN_PROGRESS; increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/settle"
    description: "Finalize settlement: FINAL settlement_total, charge lines, deposit waterfall, refunds"
    roles: [DockStaff]
    code: 200
    input: []
    output: Booking
    side_effects: ["RETURNED -> CLOSED; settlement PROVISIONAL -> FINALIZED; operational charge lines posted; deposit waterfall and deposit_status; increments Booking.version by 1"]
  - method: GET
    path: "/bookings/{id}/cleaning-turns"
    description: "List cleaning turns of a booking"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: CleaningTurn[]
    side_effects: []
  - method: POST
    path: "/cleaning-turns/{id}/inspect"
    description: "Inspect an in-progress turn: pass completes it, fail loops it back for re-clean"
    roles: [DockStaff]
    code: 200
    input: [passed]
    output: CleaningTurn
    side_effects: ["IN_PROGRESS -> COMPLETED (passed=true); IN_PROGRESS -> IN_PROGRESS with re_clean_count += 1 (passed=false)"]
  - method: POST
    path: "/bookings/{id}/incidents"
    description: "Renter reports an incident (mechanical failure, grounding, damage) on an active booking"
    roles: [Renter]
    code: 201
    input: [incident_type, occurred_at, "description?"]
    output: Incident
    side_effects: ["status = REPORTED; booking must be IN {CHECKED_OUT, INTERRUPTED, RETURNED, CLOSED} (ERR_INVALID_STATE)"]
  - method: GET
    path: "/bookings/{id}/incidents"
    description: "List incidents of a booking"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/incidents/{id}/resolve"
    description: "Mechanic resolves an incident; type-specific side effects incl. prorated refund, emergency maintenance cascade, liability/damage charges, renter risk recompute"
    roles: [Mechanic]
    code: 200
    input: [resolution, "severity?", "downtime_days?", "assessed_damage_cents?"]
    output: Incident
    side_effects: ["REPORTED -> RESOLVED/REJECTED; see Incident state machine for the full cascade set"]
  - method: GET
    path: "/bookings/{id}/charges"
    description: "List the itemized charge ledger of a booking"
    roles: [Renter, DockStaff, FleetManager, Mechanic]
    code: 200
    input: []
    output: Charge[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock. Setting the clock runs the deterministic sweep: certificate expiry, maintenance window/vessel transitions, advisory expiry, HELD booking expiry."
    roles: [FleetManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, sweep_summary: object }"
    side_effects: ["SafetyCertificate VERIFIED -> EXPIRED when expires_on < current_date (with renter recompute + suspension cascade)", "MaintenanceWindow SCHEDULED -> IN_PROGRESS / IN_PROGRESS -> COMPLETED with Vessel status sync", "WeatherAdvisory ACTIVE -> EXPIRED when window_end < current clock", "Booking HELD -> EXPIRED when hold_expires_at < current clock"]

# =============================================================================
# §1.6 Error Code Catalog (24 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Renter role acting on a resource whose renter_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or payload-referenced id (vessel, renter, booking, certificate, zone, incident, cleaning-turn) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, unknown enum member, unknown orientation item_code, empty zone_ids, window end before start, duplicate zone_code, occurred_at in the future or before booking start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition precondition failed (e.g. confirm non-HELD, settle non-RETURNED, checkout non-CONFIRMED, sign-item on COUNTERSIGNED orientation, inspect on non-IN_PROGRESS turn, decision on non-SUBMITTED certificate, resolve on non-REPORTED incident)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_booking_version != booking.version on modify or cancel (OCC)" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted from CHECKED_OUT, INTERRUPTED, RETURNED, CLOSED, CANCELLED or EXPIRED" }
  - { id: ERR_BOOKING_DATES_INVALID, http: 422, condition: "end_date <= start_date, total_nights > 21, or start_date < current_date on booking create/modify" }
  - { id: ERR_VESSEL_DATE_CONFLICT, http: 409, condition: "Half-open stay interval intersects a same-vessel booking in {CONFIRMED, CHECKED_OUT, INTERRUPTED, RETURNED}; adjacency (end == start) allowed" }
  - { id: ERR_MAINTENANCE_DATE_CONFLICT, http: 409, condition: "Closed-interval maintenance window conflicts with a blocking booking or another window on the same vessel; touching endpoints count as conflict" }
  - { id: ERR_SEASON_RATE_OVERLAP, http: 409, condition: "New rate window overlaps an existing rate of the same size_class (closed interval)" }
  - { id: ERR_RATE_NOT_CONFIGURED, http: 422, condition: "Some night of the stay has no SeasonRate for the vessel's size_class" }
  - { id: ERR_RENTER_NOT_QUALIFIED, http: 422, condition: "Renter not QUALIFIED or no VERIFIED certificate covering end_date (expires_on >= end_date) at booking create or confirm" }
  - { id: ERR_WEATHER_HOLD_ACTIVE, http: 422, condition: "Checkout blocked: ACTIVE advisory covers the current clock and its zones intersect the APPROVED itinerary's zones" }
  - { id: ERR_ITINERARY_REQUIRED, http: 422, condition: "Checkout requires an APPROVED itinerary" }
  - { id: ERR_ORIENTATION_NOT_COUNTERSIGNED, http: 409, condition: "Checkout requires orientation_status == COUNTERSIGNED" }
  - { id: ERR_CLEANING_TURN_INCOMPLETE, http: 409, condition: "Checkout while another turn is IN_PROGRESS on the vessel, or settle before this booking's turn is COMPLETED" }
  - { id: ERR_FUEL_GAUGE_INVALID, http: 422, condition: "fuel_gauge_percent outside [0, 100]" }
  - { id: ERR_ITINERARY_WAYPOINT_OUT_OF_RANGE, http: 422, condition: "Waypoint night_date not within [start_date, end_date) of the booking" }
  - { id: ERR_ZONE_SIZE_CLASS_FORBIDDEN, http: 422, condition: "Waypoint zone does not list the vessel's size_class in allowed_size_classes" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "zone_night_occupancy already == max_vessels_per_night for a waypoint (strict < required)" }
  - { id: ERR_PARTY_EXCEEDS_BERTH, http: 422, condition: "party_size > vessel.berth_count" }
  - { id: ERR_INCIDENT_RESOLUTION_MISMATCH, http: 422, condition: "Resolution not legal for incident_type, or required resolve fields missing/invalid (severity, downtime_days, assessed_damage_cents); MINOR mechanical cannot be REPAIRED_*" }

# =============================================================================
# §1.7 RBAC Matrix (4 roles)
# =============================================================================
roles:
  - name: Renter
    description: "Charter customer; registers, holds a safety certificate, books and operates a vessel"
    identity: "entity_backed:Renter"
    exclusive_operations:
      - "POST /renters — self-register"
      - "POST /renters/{id}/certificates — submit certificate (self only)"
      - "POST /bookings — create booking (renter_id must equal X-User-ID)"
      - "POST /bookings/{id}/confirm, /modify, /cancel — own bookings only"
      - "PUT /bookings/{id}/itinerary — own bookings only"
      - "POST /bookings/{id}/orientation/sign-item — own bookings only"
      - "POST /bookings/{id}/incidents — own bookings only"
    shared_operations:
      - "GET /vessels/{id}, GET /bookings, GET /bookings/{id} and booking sub-resource GETs (own bookings only for Renter)"
      - "GET /renters/{id}, GET /renters/{id}/certificates (self only)"
      - "GET /vessels/{id}/maintenance-windows"
  - name: DockStaff
    description: "Marina dock operator; runs orientation countersign, checkout/return, settlement, cleaning inspection, certificate verification"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/orientation/countersign"
      - "POST /bookings/{id}/checkout, /return, /settle"
      - "POST /cleaning-turns/{id}/inspect"
    shared_operations:
      - "POST /certificates/{id}/decision (VERIFY/REJECT; REVOKE shared with FleetManager)"
      - "All GET endpoints"
  - name: FleetManager
    description: "Fleet and policy administrator; owns vessels, rates, zones, maintenance windows, weather advisories and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /vessels, POST /season-rates, POST /geo-zones"
      - "POST /vessels/{id}/maintenance-windows"
      - "POST /weather-advisories"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /certificates/{id}/decision (REVOKE in particular)"
      - "All GET endpoints"
  - name: Mechanic
    description: "Certified marine mechanic; triages and resolves incidents, triggering refunds and the emergency maintenance cascade"
    identity: "opaque"
    exclusive_operations:
      - "POST /incidents/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
