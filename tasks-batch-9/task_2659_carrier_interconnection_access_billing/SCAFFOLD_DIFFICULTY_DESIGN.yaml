      setup:
      - A carrier with three EFFECTIVE rate elements and a 2026Q3 factor filing DISPUTED at PIU 50.00 / PLU 10.00.
      - A RATED batch of 73 billable minutes rated at 32.47 on the PRELIMINARY variant, invoiced and ISSUED for 32.47.
      - 'Carrier reserves after issue: open_receivable_usd 32.47, uncollectible_reserve_balance_usd 1.62.'
