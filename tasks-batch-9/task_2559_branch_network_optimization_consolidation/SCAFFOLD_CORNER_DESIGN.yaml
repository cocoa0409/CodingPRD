scaffold_corner_design:
  - section: entities
    instances:
      - name: market_area_creation_returns_computed_density_and_saturation_tier
        claim_type: creation
        grounds:
          - endpoints[POST /distribution/market-areas]
          - entities.MarketArea.fields.competitor_density_index
          - entities.MarketArea.fields.branch_density_per_100k
          - entities.MarketArea.fields.saturation_tier
          - calculations.competitor_density_index
          - calculations.market_saturation_tier
        distinguishing_aspect: "A MarketArea created with population 240000 and 60 competitor branches and zero own branches returns competitor_density_index == 25, branch_density_per_100k == 25 and saturation_tier == SATURATED in the 201 body, with every ledger counter at its declared zero default."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
            - "No Branch rows exist, so own_branch_count must be 0 and the density must be driven by competitor_branch_count alone."
          setup_api_calls: []
          trigger:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
          assert:
            - "HTTP 201 and MarketArea.${ma_id}.competitor_density_index == 25"
            - "MarketArea.${ma_id}.own_branch_count == 0"
            - "MarketArea.${ma_id}.branch_density_per_100k == 25"
            - "MarketArea.${ma_id}.saturation_tier == SATURATED"
            - "MarketArea.${ma_id}.absorbed_deposits_cents == 0 and MarketArea.${ma_id}.cumulative_runoff_deposits_cents == 0"
            - "MarketArea.${ma_id}.flagged_case_count == 0 and MarketArea.${ma_id}.remediation_case_count == 0"
            - "MarketArea.${ma_id}.de_novo_hold == false"
            - "MarketArea.${ma_id}.version == 1 and MarketArea.${ma_id}.id is a bare UUID with no type prefix"

      - name: branch_retrieval_returns_stored_inputs_and_unscored_band
        claim_type: retrieval
        grounds:
          - endpoints[GET /distribution/branches/{branchId}]
          - entities.Branch.fields.performance_band
          - entities.Branch.fields.snapshot_count
          - calculations.branch_performance_score
        distinguishing_aspect: "A GET on a freshly created Branch echoes every stored input field and reports performance_band == UNSCORED with performance_score_bps == null, because zero PerformanceSnapshots exist."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' exists."
            - "One Branch RB-101 exists in it with no PerformanceSnapshot rows."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id }
          trigger:
            - call: "GET /distribution/branches/${b101_id}"
              payload: {}
              as: NetworkOpsAdmin
              as_user_id: "u_ops_1"
          assert:
            - "HTTP 200 and Branch.${b101_id}.branch_code == RB-101"
            - "Branch.${b101_id}.market_area_id == ${ma_id}"
            - "Branch.${b101_id}.deposit_balance_cents == 4800000000 and Branch.${b101_id}.fte_count == 9"
            - "Branch.${b101_id}.status == ACTIVE and Branch.${b101_id}.absorbing_branch_id == null"
            - "Branch.${b101_id}.performance_band == UNSCORED and Branch.${b101_id}.performance_score_bps == null"
            - "Branch.${b101_id}.snapshot_count == 0 and Branch.${b101_id}.transferred_in_deposits_cents == 0"
            - "Branch.${b101_id}.pre_close_deposits_cents == null and Branch.${b101_id}.pre_close_fte_count == null"
            - "Branch.${b101_id}.version == 1"

      - name: branch_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /distribution/branches]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three branches in one market, limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true, and offset=2 returns the remaining 1 row with has_more == false."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' with exactly three Branches RB-101, RB-102, RB-103, created in that order."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 8100, digital_adoption_bps: 6100, annual_noninterest_expense_cents: 52000000, annual_revenue_cents: 96000000, fte_count: 14, atm_count: 3, opened_on: "1998-07-15" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b102_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-103", branch_type: "LIMITED_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 3200000000, monthly_transaction_count: 2700, digital_adoption_bps: 4900, annual_noninterest_expense_cents: 26000000, annual_revenue_cents: 30000000, fte_count: 6, atm_count: 1, opened_on: "2011-05-20" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b103_id: $.data.id }
          trigger:
            - call: "GET /distribution/branches"
              payload: { market_area_id: "${ma_id}", limit: 2, offset: 0 }
              as: NetworkOpsAdmin
              as_user_id: "u_ops_1"
            - call: "GET /distribution/branches"
              payload: { market_area_id: "${ma_id}", limit: 2, offset: 2 }
              as: NetworkOpsAdmin
              as_user_id: "u_ops_1"
          assert:
            - "trigger 1 returns HTTP 200 with exactly 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger 1 rows are RB-101 then RB-102 (created_at ASC ordering, never id ordering)"
            - "trigger 2 returns exactly 1 data row RB-103 with total_count == 3, has_more == false, offset == 2"

      - name: get_branch_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /distribution/branches/{branchId}]
          - validations.priority_7_ERR_RESOURCE_NOT_FOUND
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A GET against a syntactically valid UUID that names no Branch row returns ERR_RESOURCE_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no Branch rows exist at all."
          setup_api_calls: []
          trigger:
            - call: "GET /distribution/branches/6f1d2c3b-4a59-4e7d-8b0c-1f2e3d4c5b6a"
              payload: {}
              as: NetworkOpsAdmin
              as_user_id: "u_ops_1"
              captures: { err_nf: $.data.error_id }
          assert:
            - "${err_nf} == ERR_RESOURCE_NOT_FOUND with HTTP 404"
            - "the response carries $.data.message and no Branch payload"

      - name: branch_creation_missing_tenure_class_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /distribution/branches]
          - entities.Branch.fields.tenure_class
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "tenure_class has source input with no default, so omitting it from POST /distribution/branches returns ERR_INVALID_REQUEST with HTTP 400 and no Branch row is created."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' exists and has zero branches."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
          trigger:
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_req: $.data.error_id }
          assert:
            - "${err_req} == ERR_INVALID_REQUEST with HTTP 400"
            - "MarketArea.${ma_id}.own_branch_count == 0 and MarketArea.${ma_id}.branch_density_per_100k == 25 (no partial write)"

      - name: branch_creation_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Branch.fields.scoring_variant
          - entities.Branch.fields.onboarding_capacity_households_per_day
          - endpoints[POST /distribution/branches]
        distinguishing_aspect: "Omitting scoring_variant and onboarding_capacity_households_per_day yields TRAILING_BLEND and 40 respectively — the two declared defaults — rather than null."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' exists."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
          trigger:
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id }
          assert:
            - "HTTP 201 and Branch.${b101_id}.scoring_variant == TRAILING_BLEND"
            - "Branch.${b101_id}.onboarding_capacity_households_per_day == 40"
            - "Branch.${b101_id}.status == ACTIVE (system default)"

      - name: performance_snapshot_composite_score_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /distribution/branches/{branchId}/performance-snapshots]
          - entities.PerformanceSnapshot.fields.composite_score_bps
          - entities.PerformanceSnapshot.fields.band
          - calculations.branch_performance_score
        distinguishing_aspect: "A snapshot POST that smuggles composite_score_bps: 9900 into the body still stores the formula result 4535 with band STABLE, and the branch's persisted score becomes 4535 — the client-supplied computed field is ignored, not honoured."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' and one Branch RB-101 with the default TRAILING_BLEND variant exist."
            - "RB-101 has no snapshots yet, so the single new snapshot is the whole history (renormalized single-weight blend)."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id }
          trigger:
            - call: "POST /distribution/branches/${b101_id}/performance-snapshots"
              payload: { period_label: "2026-Q1", period_end_date: "2026-03-31", deposits_cents: 4800000000, transaction_count: 5400, digital_active_bps: 5400, revenue_cents: 40000000, noninterest_expense_cents: 30000000, composite_score_bps: 9900 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { snap_id: $.data.id }
          assert:
            - "HTTP 201 and PerformanceSnapshot.${snap_id}.composite_score_bps == 4535 (deposit_factor 4000, transaction_factor 6000, digital_factor 5400, profitability_factor 3750)"
            - "PerformanceSnapshot.${snap_id}.band == STABLE"
            - "the supplied composite_score_bps 9900 appears nowhere in the stored row"
            - "Branch.${b101_id}.performance_score_bps == 4535 and Branch.${b101_id}.performance_band == STABLE"
            - "Branch.${b101_id}.snapshot_count == 1"

      - name: case_creation_stamps_created_by_user_id_from_header
        claim_type: system_fields
        grounds:
          - endpoints[POST /distribution/consolidation-cases]
          - entities.ConsolidationCase.fields.created_by_user_id
          - entities.ConsolidationCase.fields.decided_by_user_id
          - entities.ConsolidationCase.fields.status
        distinguishing_aspect: "created_by_user_id is stamped from the X-User-ID header (u_strategist_1) and cannot be supplied by the client, decided_by_user_id stays null until a decision, and status is the system default DRAFT."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' with closing branch RB-101 and receiving branch RB-102, both ACTIVE."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id, b101_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 8100, digital_adoption_bps: 6100, annual_noninterest_expense_cents: 52000000, annual_revenue_cents: 96000000, fte_count: 14, atm_count: 3, opened_on: "1998-07-15" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b102_id: $.data.id }
          trigger:
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b101_id}", receiving_branch_id: "${b102_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b101_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id }
          assert:
            - "HTTP 201 and ConsolidationCase.${case_id}.created_by_user_id == u_strategist_1"
            - "ConsolidationCase.${case_id}.decided_by_user_id == null"
            - "ConsolidationCase.${case_id}.status == DRAFT and ConsolidationCase.${case_id}.version == 1"
            - "ConsolidationCase.${case_id}.retention_model_variant == DISTANCE_DECAY (declared default)"
            - "ConsolidationCase.${case_id}.governance_flag == NONE, impact_tier == UNASSESSED, monitoring_posture == NOT_STARTED"
            - "ConsolidationCase.${case_id}.notice_required_days == 0 and returned_count == 0"

      - name: market_area_region_code_pattern_violation_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.MarketArea.fields.region_code
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "region_code 'MD-1' fails the ^[A-Z]{2}-[0-9]{2}$ pattern (one digit instead of two) and returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-1", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_pattern: $.data.error_id }
          assert:
            - "${err_pattern} == ERR_INVALID_REQUEST with HTTP 400"
            - "no MarketArea row exists afterwards (GET /distribution/market-areas returns total_count == 0)"

      - name: case_creation_with_unknown_rationale_code_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.ConsolidationCase.fields.rationale_code
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "rationale_code 'PERFORMANCE' is not one of LOW_PERFORMANCE | LEASE_EXPIRY | MARKET_OVERLAP | DIGITAL_MIGRATION, so the create fails with ERR_INVALID_REQUEST 400 and the closing branch stays ACTIVE."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro' with ACTIVE branches RB-101 and RB-102."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id, b101_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 8100, digital_adoption_bps: 6100, annual_noninterest_expense_cents: 52000000, annual_revenue_cents: 96000000, fte_count: 14, atm_count: 3, opened_on: "1998-07-15" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b102_id: $.data.id }
          trigger:
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b101_id}", receiving_branch_id: "${b102_id}", rationale_code: "PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b101_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_enum: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "Branch.${b101_id}.status == ACTIVE and Branch.${b101_id}.version == ${b101_v} (the ACTIVE -> UNDER_REVIEW side effect never fired)"

      - name: performance_snapshot_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.PerformanceSnapshot.common_fields
          - endpoints[GET /distribution/branches/{branchId}/performance-snapshots]
        distinguishing_aspect: "PerformanceSnapshot declares common_fields: false, so its rows carry id and created_at but no version and no updated_at, and §1.5 exposes no PATCH, PUT or DELETE for them — the only way to change a branch's score is to append another snapshot."
        test_recipe:
          setup:
            - "One MarketArea 'Harbor Metro', one Branch RB-101 and exactly one PerformanceSnapshot 2026-Q1 on it."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id }
            - call: "POST /distribution/branches/${b101_id}/performance-snapshots"
              payload: { period_label: "2026-Q1", period_end_date: "2026-03-31", deposits_cents: 4800000000, transaction_count: 5400, digital_active_bps: 5400, revenue_cents: 40000000, noninterest_expense_cents: 30000000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { snap_id: $.data.id }
          trigger:
            - call: "GET /distribution/branches/${b101_id}/performance-snapshots"
              payload: { limit: 10, offset: 0 }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
          assert:
            - "HTTP 200 with total_count == 1 and has_more == false"
            - "the single row exposes id == ${snap_id} and created_at, and exposes no version field and no updated_at field"
            - "§1.5 declares no update or delete endpoint for PerformanceSnapshot: the only mutating route is the append-only POST /distribution/branches/{branchId}/performance-snapshots"

      - name: branch_creation_with_unknown_market_area_returns_referenced_not_found
