  - section: consistency_model
    instances:
      - name: receipt_response_already_carries_the_final_reimbursement_and_the_donor_ledger_credit
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[Shipment].transitions[IN_TRANSIT->ACCEPTED]
          - calculations[shipment_reimbursement]
          - endpoints[POST /milk-bank/shipments/{id}/receive]
        distinguishing_aspect: "Under an immediate consistency model no derived value may lag a request: the receive response itself already reports the recomputed final_reimbursement_cents 1913, credited_reimbursement_cents 1913 and status ACCEPTED, and the donor read taken right after it already shows reimbursement_balance_cents 1913 with version bumped by one - a later re-read returns exactly the same numbers, so nothing settled between the two calls."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 (zone Z2) is QUALIFIED with reimbursement_balance_cents 0."
            - "Cooler TRK-0001 (1 container, no dry ice, declared 1200 ml, shipped 2026-08-02) is IN_TRANSIT and its PROVISIONAL_AT_DISPATCH estimate is 1850 + 275 = 2125 cents."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 1200, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id", est: "$.data.estimated_reimbursement_cents" } }
          trigger:
            - { call: "GET /milk-bank/donors/${d1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { bal0: "$.data.reimbursement_balance_cents", dv0: "$.data.version" } }
            - { call: "POST /milk-bank/shipments/${s1}/receive", payload: { excursion_minutes: 5, arrival_max_temp_celsius: -18.0, verified_volume_ml: 1200 }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { fin_r: "$.data.final_reimbursement_cents", cred_r: "$.data.credited_reimbursement_cents", st_r: "$.data.status", recv_r: "$.data.received_at" } }
            - { call: "GET /milk-bank/donors/${d1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { bal1: "$.data.reimbursement_balance_cents", dv1: "$.data.version" } }
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { fin_g: "$.data.final_reimbursement_cents", cred_g: "$.data.credited_reimbursement_cents", st_g: "$.data.status", recv_g: "$.data.received_at" } }
            - { call: "GET /milk-bank/donors/${d1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { bal2: "$.data.reimbursement_balance_cents", dv2: "$.data.version" } }
          assert:
            - "${est} == 2125 and ${bal0} == 0"
            - "the receive response has http_status 200 and ${st_r} == ACCEPTED (-18.0 C is at or below -8.0 and 5 minutes is within the 30 minute allowance)"
            - "${fin_r} == 1913 and ${cred_r} == 1913 (penalty 0.02 * 5 = 0.10, 2125 * 0.90 = 1912.5, round_half_up per container -> 1913, x1 container)"
            - "${recv_r} == 2026-08-05T08:00:00Z (the logical clock, stamped inside the same request)"
            - "${bal1} == 1913 and ${dv1} == ${dv0} + 1: the donor ledger credit is already visible in the very next read, with no second request needed to settle it"
            - "${fin_g} == ${fin_r} and ${cred_g} == ${cred_r} and ${st_g} == ${st_r} and ${recv_g} == ${recv_r}"
            - "${bal2} == ${bal1} and ${dv2} == ${dv1}: re-reading changes nothing, so the first read was not a stale view being repaired"
            - "Shipment.${s1}.estimated_reimbursement_cents == 2125 is retained alongside final_reimbursement_cents 1913 (the provisional figure is not overwritten)"
            - "Shipment.${s1}.excursion_minutes == 5 and arrival_max_temp_celsius == -18.0 and verified_volume_ml == 1200 and received_by_user_id == u-intake-1"
