              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/vendors"
              payload: { vendor_name: "Lisbon Ground", vendor_type: "GROUND_SECURITY", country_code: "PT", max_concurrent_engagements: 2, sla_response_minutes: 30, hourly_rate_cents: 10000, retainer_cents: 50000 }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { vendor_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /exec-protection/vendors/${vendor_id}/suspend"
              payload: { suspension_reason: "licence lapsed" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { status1: $.data.activation_status, v1: $.data.version }
            - call: "POST /exec-protection/vendors/${vendor_id}/suspend"
              payload: { suspension_reason: "licence lapsed again" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the vendor was created AVAILABLE with committed_engagement_hours == 0, suspension_reason == null and version == ${v0} == 1"
            - "the first suspend returns HTTP 200 with ${status1} == SUSPENDED, suspension_reason == 'licence lapsed' and ${v1} == 2"
            - "the second suspend returns HTTP 409 with ${err} == ERR_VENDOR_SUSPENDED"
            - "the rejected call left no trace: a re-read shows suspension_reason still 'licence lapsed' (not 'licence lapsed again') and version still 2"

