      - name: risk_scoring_band_boundary_high_at_60
        claim_type: Correct Result
        grounds: ["calculations.risk_scoring", "entities.RiskAssessment.fields.risk_band"]
        distinguishing_aspect: "Factors g=5,p=4,pep=4,media=3 score exactly 61 (>=60) -> HIGH band; verifies the >= HIGH threshold boundary."
        test_recipe:
          setup: ["A NEW customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Bnd60", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1993-03-03" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 4, pep_factor: 4, adverse_media_factor: 3 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id, score: $.data.total_score, band: $.data.risk_band }
          assert:
            - "RiskAssessment.${ra_id}.total_score == 61.00"
            - "RiskAssessment.${ra_id}.risk_band == HIGH"

      - name: risk_scoring_band_boundary_medium_at_35
        claim_type: Constants Applied
        grounds: ["calculations.risk_scoring", "entities.RiskAssessment.fields.total_score"]
        distinguishing_aspect: "Factors g=2,p=3,pep=2,media=3 score 36 (>=35) -> MEDIUM, with no surcharge (max(pep,media)=3 != 5)."
        test_recipe:
          setup: ["A NEW customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Bnd35", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1994-04-04" }
              as: ComplianceOfficer
              as_user_id: "co-1"
