# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortalAdmin
    identity: opaque
    description: "Central open data programme office. Owns the shared registries (departments, licences, runners, credits), metadata acceptance, usage analytics ingestion, high-value commitments, showcase moderation, community request triage, the operational sweep and the logical clock. Cannot author or clear privacy assessments and cannot create or publish a department's datasets."
    exclusive_operations:
      - "POST /open-data/departments — register a department"
      - "POST /open-data/departments/{departmentId}/credit-grants — grant credits"
      - "POST /open-data/licenses — define a licence"
      - "POST /open-data/licenses/{licenseId}/retire — retire a licence"
      - "POST /open-data/ingest-runners — register a runner"
      - "PATCH /open-data/ingest-runners/{runnerId} — update a runner"
      - "POST /open-data/metadata-records/{metadataRecordId}/decide — accept or return metadata"
      - "POST /open-data/datasets/{datasetId}/usage-report — record a usage epoch"
      - "POST /open-data/datasets/{datasetId}/high-value-commitment — commit to the high-value SLA"
      - "POST /open-data/datasets/{datasetId}/showcase-apps/{showcaseLabel}/decide — moderate a showcase"
      - "POST /open-data/dataset-requests/{requestId}/review — take a request under review"
      - "POST /open-data/dataset-requests/{requestId}/decide — decide a request"
      - "POST /open-data/dataset-requests/{requestId}/fulfill — link a fulfilling dataset"
      - "POST /open-data/ops-run — run the portal sweep"
      - "POST /open-data/_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "POST /open-data/members/register — register a member (shared with Anonymous)"
      - "POST /open-data/publication-pipelines/{pipelineId}/suspend, /decommission — shared with DataCoordinator"
      - "POST /open-data/pipeline-runs, /{runId}/start, /report-success, /report-failure, /requeue — shared with DataCoordinator"
      - "POST /open-data/dataset-versions/{versionId}/retract — shared with DataCoordinator"
      - "POST /open-data/quality-issues/{issueId}/close — shared with DataCoordinator"
      - "All GET endpoints"
  - name: DataCoordinator
    identity: "entity_backed:Department"
    description: "Departmental data steward. X-User-ID is the Department id; every dataset-scoped write is checked against dataset.department_id. Owns inventory, screening, aggregation choice, metadata drafting, pipeline configuration and arming, version publication, and quality-issue triage and correction. Cannot grant credits, accept its own metadata, decide privacy clearance, or moderate community content."
    exclusive_operations:
      - "POST /open-data/datasets — inventory a dataset"
      - "POST /open-data/datasets/{datasetId}/screen — begin readiness review"
      - "POST /open-data/datasets/{datasetId}/aggregation — set aggregation geography"
      - "POST /open-data/datasets/{datasetId}/mark-ready — declare publication readiness"
      - "POST /open-data/datasets/{datasetId}/publish — publish to the portal"
      - "POST /open-data/datasets/{datasetId}/retire — retire the dataset"
      - "POST /open-data/metadata-records — draft a metadata record"
      - "PATCH /open-data/metadata-records/{metadataRecordId} — revise a draft"
      - "POST /open-data/metadata-records/{metadataRecordId}/submit — submit for review"
      - "POST /open-data/publication-pipelines — configure a pipeline"
      - "POST /open-data/publication-pipelines/{pipelineId}/arm — arm and escrow"
      - "POST /open-data/publication-pipelines/{pipelineId}/resume — resume service"
      - "POST /open-data/dataset-versions — publish a manual or corrective version"
      - "POST /open-data/quality-issues/{issueId}/triage — triage an issue"
      - "POST /open-data/quality-issues/{issueId}/decide — accept or reject an issue"
      - "POST /open-data/quality-issues/{issueId}/link-correction — attach a corrective version"
    shared_operations:
      - "POST /open-data/publication-pipelines/{pipelineId}/suspend, /decommission — shared with PortalAdmin"
      - "POST /open-data/pipeline-runs, /{runId}/start, /report-success, /report-failure, /requeue — shared with PortalAdmin"
      - "POST /open-data/dataset-versions/{versionId}/retract — shared with PortalAdmin"
      - "POST /open-data/quality-issues/{issueId}/close — shared with PortalAdmin"
      - "GET endpoints except the clock"
  - name: PrivacyReviewer
    identity: opaque
    description: "Privacy office analyst. Authors and decides reidentification assessments; segregation of duties forbids the author of an assessment from deciding it (assessor_user_id != X-User-ID). Has no publication, pipeline or credit authority."
    exclusive_operations:
      - "POST /open-data/privacy-assessments — open an assessment"
      - "PATCH /open-data/privacy-assessments/{assessmentId} — record measured cell sizes"
      - "POST /open-data/privacy-assessments/{assessmentId}/submit — submit for clearance"
      - "POST /open-data/privacy-assessments/{assessmentId}/decide — clear or block"
      - "POST /open-data/privacy-assessments/{assessmentId}/reopen — return a blocked assessment to draft"
    shared_operations:
      - "GET endpoints on datasets, metadata records, assessments, versions, issues and requests"
  - name: CommunityMember
    identity: "entity_backed:CommunityMember"
    description: "Registered data reuser. X-User-ID is the CommunityMember id and must match the member id in the body. Files quality issues, submits showcase applications, requests new datasets and casts reputation-weighted votes. THROTTLED members lose issue filing and voting."
    exclusive_operations:
      - "POST /open-data/quality-issues — report a data quality issue"
      - "POST /open-data/datasets/{datasetId}/showcase-apps — submit a showcase application"
      - "POST /open-data/dataset-requests — request a new dataset"
      - "POST /open-data/dataset-requests/{requestId}/votes — cast a weighted vote"
    shared_operations:
      - "Public GET endpoints (catalogue, analytics, versions, issues, requests, members)"
  - name: Anonymous
    identity: opaque
    description: "Unauthenticated public visitor. May browse the published catalogue and register as a community member; no write authority beyond registration."
    exclusive_operations: []
    shared_operations:
      - "POST /open-data/members/register — register a member (shared with PortalAdmin)"
      - "GET /open-data/departments, /licenses, /datasets, /datasets/{datasetId}, /datasets/{datasetId}/analytics, /metadata-records, /dataset-versions, /quality-issues, /dataset-requests"
