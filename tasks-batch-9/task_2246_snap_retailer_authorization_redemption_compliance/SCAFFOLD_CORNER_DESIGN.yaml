            - "SanctionCase.${case_id}.remand_count == 0 and cmp_outstanding_cents == 0"
            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION"

      - name: declined_pos_transaction_is_created_directly_in_its_terminal_state
        claim_type: Initial State
        grounds:
          - state_machines.PosTransaction.notes
          - state_machines.PosTransaction.terminal_states
          - calculations.pos_eligibility_split_tender
          - errors.ERR_SPLIT_TENDER_SHORTFALL
        distinguishing_aspect: "A basket short on other tender is persisted in the terminal DECLINED state on creation - never AUTHORIZED first - with decline_reason_code INSUFFICIENT_SPLIT_TENDER, both tender fields zeroed and the flagged SKUs still recorded."
        test_recipe:
          setup:
            - "An authorized CONVENIENCE store (tax 825 bps) with one ACTIVE deployment. The basket carries 1000c of staple food and 2000c of tobacco; tax on the ineligible bucket is round_half_up(2000 * 825 / 10000) == 165, so the required other tender is 2165 while only 2000 is offered."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - *k_deploy
            - &k_activate
              call: "POST /terminal-deployments/${dep_id}/activate"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /pos-transactions"
              payload:
                store_id: "${store_id}"
                terminal_deployment_id: "${dep_id}"
                household_ebt_card_last4: "4417"
                line_items:
                  - { sku: "MILK-1", item_class: "STAPLE_FOOD", unit_price_cents: 500, qty: 2 }
                  - { sku: "CIG-1", item_class: "TOBACCO", unit_price_cents: 1000, qty: 2 }
