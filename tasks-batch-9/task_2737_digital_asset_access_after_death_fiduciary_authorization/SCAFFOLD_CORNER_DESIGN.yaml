              captures: { e_finalize_superseded: $.data.error_id }
            - call: "POST /valuation-runs/${run2_id}/transitions"
              payload: { action: "FINALIZE", finalization_note: "estate tax position locked" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { run2_status1: $.data.status, run2_final_at: $.data.finalized_at }
            - call: "POST /valuation-runs/${run2_id}/transitions"
              payload: { action: "FINALIZE", finalization_note: "again" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_finalize_twice: $.data.error_id }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { est_v3: $.data.version }
            - call: "POST /estates/${est_id}/valuation-runs"
              payload: { basis: "ALTERNATE", expected_estate_version: "${est_v3}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_already_final: $.data.error_id }
          assert:
            - "${run2_status0} == COMPUTED and ValuationRun.${run1_id}.status == SUPERSEDED"
            - "${e_finalize_superseded} == ERR_INVALID_RUN_STATE with HTTP 409"
            - "${run2_status1} == FINALIZED and ${run2_final_at} == 2026-08-01T00:00:00Z"
            - "${e_finalize_twice} == ERR_INVALID_RUN_STATE with HTTP 409"
            - "${e_already_final} == ERR_VALUATION_ALREADY_FINALIZED with HTTP 409 and GET /valuation-runs filtered by estate_id ${est_id} still returns exactly 2 rows"
            - "ValuationRun.${run2_id}.gross_value_cents == 200000 and taxable_value_cents == 200000"
            - "Estate.${est_id}.valuation_basis == DATE_OF_DEATH"

      - name: a_clamped_content_request_names_the_court_order_not_the_missing_authority
        claim_type: Priority Ordering
        grounds:
          - validations[priority=44]
          - validations[priority=45]
          - calculations.platform_authority_precedence
        distinguishing_aspect: |
          When a will provision does grant CATALOG_AND_CONTENT but the provider sets
          requires_court_order_for_content, the pre-clamp scope was content, so SUBMIT of the
          CONTENT_ACCESS request returns ERR_COURT_ORDER_REQUIRED rather than priority 44's
          ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED — and verifying a COURT_ORDER document lifts the clamp
          so the identical SUBMIT succeeds and the approved grant discloses content.
        test_recipe:
          setup:
            - "one CLOUD_STORAGE platform with requires_court_order_for_content true"
            - "one Estate at AUTHORIZED with a catch-all WILL_PROVISION CATALOG_AND_CONTENT directive and one CLOUD_STORAGE asset"
            - "a PENDING COURT_ORDER document is NOT yet on file"
            - "one DRAFT CONTENT_ACCESS request"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: true, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C29" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C29" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C29", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C29", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "WILL_PROVISION", scope: "CATALOG_AND_CONTENT", instrument_reference: "Will article 9.1", executed_on: "2025-06-01" }
              as: CourtRegistrar
              captures: { dir_will_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-1", quoted_value_cents: 200000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_vault_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CONTENT_ACCESS", requested_scope: "CATALOG_AND_CONTENT", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_cloud_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { r1_scope: $.data.resolved_scope, r1_basis: $.data.resolved_basis, r1_clamp: $.data.clamp_reason, r1_dir: $.data.controlling_directive_id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_court_order: $.data.error_id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "COURT_ORDER", reference_number: "CO-C29", issued_on: "2026-07-20", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { court_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_court_order_pending: $.data.error_id }
            - call: "POST /documents/${court_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_cloud_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { r2_scope: $.data.resolved_scope, r2_clamp: $.data.clamp_reason }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_status: $.data.status }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED", decision_note: "court order accepted" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
              captures: { req_scope: $.data.resolved_scope, req_clamp: $.data.clamp_reason }
            - call: "GET /digital-assets/${a_vault_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_access: $.data.access_status, a_clamp: $.data.content_clamp_reason }
          assert:
            - "${r1_scope} == CATALOG_ONLY, ${r1_basis} == WILL_PROVISION, ${r1_clamp} == COURT_ORDER_REQUIRED, ${r1_dir} == ${dir_will_id}"
            - "${e_court_order} == ERR_COURT_ORDER_REQUIRED with HTTP 409, NOT ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED"
            - "${e_court_order_pending} == ERR_COURT_ORDER_REQUIRED with HTTP 409 (a PENDING court order does not count)"
            - "${r2_scope} == CATALOG_AND_CONTENT and ${r2_clamp} == NONE"
            - "${req_status} == SUBMITTED with review_window_start == 2026-08-01T00:00:00Z"
            - "${req_scope} == CATALOG_AND_CONTENT and ${req_clamp} == NONE"
            - "${a_access} == CONTENT_DISCLOSED and ${a_clamp} == NONE"
            - "with a CATALOG_ONLY will provision instead of CATALOG_AND_CONTENT the same SUBMIT returns HTTP 409 with error_id ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED (priority 44), because the pre-clamp scope was never content"

      - name: each_close_guard_fires_in_priority_order_as_blockers_are_cleared
