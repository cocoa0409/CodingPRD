            - { call: "POST /roadside/rate-cards", payload: { name: "H2-2026", labor_rate_standard_cents: 15000, labor_rate_master_cents: 18000, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 450, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rcC: $.data.id } }
          assert:
            - "err_touch == ERR_RATE_CARD_WINDOW_OVERLAP (2026-06-30T00:00:00Z falls inside A's closed window ending 2026-06-30T23:59:59Z)"
            - "card H2-2026 created (201): 2026-07-01T00:00:00Z is strictly after A.effective_to - no shared instant"

  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: part_post_then_return_restores_van_stock_and_invoice
        grounds:
          - state_machines.PartUsage.POSTED_to_RETURNED
          - calculations.parts_tax
          - entities.VanStockItem.fields.qty_on_hand
        distinguishing_aspect: |
          Conserved quantity: VanStockItem.qty_on_hand. Forward action (usage qty 4: 10 -> 6)
          paired with its compensation (return: 6 -> 10) leaves qty_on_hand unchanged, and the
          downstream invoice's parts_subtotal_cents is 0 as if the usage never happened.
        test_recipe:
          setup:
            - "Business-hours call in REPAIR_IN_PROGRESS; ALT-104 qty_on_hand 10 (reorder_point 2 - posting 4 then returning never crosses the threshold)."
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/technicians/${t2}/van-stock", payload: { part_number: "ALT-104", description: "Alternator", part_class: "ENGINE", qty_on_hand: 10, unit_cost_cents: 21000, unit_retail_cents: 34999, reorder_point: 2 }, as: OpsAdmin, captures: { vs: $.data.id, onhand0: $.data.qty_on_hand } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 20, symptom_category: "ENGINE_NO_START", symptom_description: "no start" }, as: Dispatcher, captures: { sc: $.data.id } }
