              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { adj_p2: $.data.id }
          assert:
            - "second create succeeds (201): HeightenedSupervisionPlan.${adj_p2}.status == \"DRAFT\""
            - "start equality with the prior end_date is not an intersection under half-open semantics"

      - name: meeting_uniqueness_per_year
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_MEETING_YEAR]"]
        distinguishing_aspect: "Aggregate uniqueness: the second meeting for an already-used calendar year is rejected."
        test_recipe:
          setup: ["Meeting for 2026 exists"]
          setup_api_calls:
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-06-15" }
