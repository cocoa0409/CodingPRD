    roles: [Auditor]
    code: 201
    input: [scheduled_start, scheduled_end, location_type, expected_work_order_version]
    output: AuditAppointment
    side_effects: ["work order -> APPOINTMENT_SCHEDULED", "prior {SCHEDULED, CONFIRMED} appointment -> CANCELLED", "AuditWorkOrder.version increments by 1"]
  - method: POST
    path: "/audit-work-orders/{id}/payroll-allocations"
    description: "Create a payroll allocation (OCC; closed-interval overlap check per class code). Precondition: work order status in {RECORDS_REQUESTED, APPOINTMENT_SCHEDULED, FIELD_WORK_DONE, RESULT_DRAFTED} else ERR_INVALID_STATE_TRANSITION; class code coverage_line must equal policy coverage_line else ERR_VALIDATION"
