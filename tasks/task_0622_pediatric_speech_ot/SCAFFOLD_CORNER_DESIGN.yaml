              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Authorization.${auth_id}.status == REAUTH_REQUESTED"

      - name: occ_request_reauth_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reauth-request-stale-authorization]", "errors[ERR_STALE_VERSION]", state_machines.Authorization.ACTIVE_to_REAUTH_REQUESTED]
        distinguishing_aspect: "request-reauth carrying a stale expected_authorization_version (current minus 1, gone stale because a booking bumped the version after the client read it) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE authorization with one booking already reserved against it (version advanced by the booking)."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T OCC2", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid MM", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
            - call: "GET /clinic/authorizations/${auth_id}"
              payload: {}
              as: ClinicAdmin
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /clinic/authorizations/${auth_id}/request-reauth"
              payload: { expected_authorization_version: "${v_now} - 1" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Authorization.${auth_id}.status == ACTIVE"

      - name: occ_grant_reauth_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reauth-grant-stale-authorization]", state_machines.Authorization.REAUTH_REQUESTED_to_ACTIVE, entities.Authorization.fields.version]
        distinguishing_aspect: "grant-reauth with the current expected_authorization_version succeeds, replenishes the cap, and increments Authorization.version by 1."
        test_recipe:
          setup: ["An ACTIVE authorization (authorized 2) moved to REAUTH_REQUESTED, version captured fresh."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/children"
              payload: { full_name: "Kid NN", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 2, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id, v0: $.data.version }
            - call: "POST /clinic/authorizations/${auth_id}/request-reauth"
              payload: { expected_authorization_version: "${v0}" }
              as: ClinicAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /clinic/authorizations/${auth_id}/grant-reauth"
              payload: { additional_visits: 3, new_valid_until: "2026-12-01T00:00:00Z", expected_authorization_version: "${v1}" }
              as: ClinicAdmin
              captures: { v2: $.data.version }
          assert:
            - "response.status == 200"
            - "Authorization.${auth_id}.status == ACTIVE"
            - "Authorization.${auth_id}.authorized_visits == 5"
            - "Authorization.${auth_id}.available_visits == 5"

