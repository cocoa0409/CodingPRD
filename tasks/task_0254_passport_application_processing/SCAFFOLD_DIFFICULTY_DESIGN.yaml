scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_forward_looking_vs_chronological_diverge_by_verification_delay
        grounds:
          - calculations.processing_sla_target
          - entities.Application.fields.target_completion_date
          - entities.Application.fields.verification_completed_at
          - state_machines.Application.SUBMITTED_to_IN_VERIFICATION
        distinguishing_aspect: |
          On Application (scheduling domain): FORWARD-LOOKING target counts 42 routine days from
          submitted_at (2026-06-01 -> 2026-07-13) while CHRONOLOGICAL counts 42 days from
          verification_completed_at (2026-06-08 -> 2026-07-20); identical application, two dates 7 days apart.
        test_recipe:
          setup:
            - "Adult applicant; NEW BOOK ROUTINE application submitted at 2026-06-01, fee paid, verification begun, all required docs accepted at 2026-06-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Adjudicator
            - call: "POST /acceptance-facilities"
              payload: { name: "Downtown", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent A", badge_number: "B-1", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_id: "$.data.id" }
            - call: "POST /adjudicators"
              payload: { name: "Adj Z", passport_office_code: "OZ-1" }
              as: Adjudicator
              captures: { adj_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { id_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { cit_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v1: "$.data.version" }
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id", fee_due: "$.data[0].total_due_cents" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/begin-verification"
              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T10:00:00Z" }
              as: Adjudicator
            - call: "POST /documents/${id_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "POST /documents/${cit_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "GET /applications/${app_id}/summary"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fwd: "$.data.forward_looking_target_date", chron: "$.data.chronological_target_date" }
          assert:
            - "summary.forward_looking_target_date == \"2026-07-13\""
            - "summary.chronological_target_date == \"2026-07-20\""
            - "Application.${app_id}.target_completion_date == \"2026-07-13\""

      - name: risk_score_provisional_vs_final_diverge_on_same_applicant
        grounds:
          - calculations.verification_risk_score
          - entities.Applicant.fields.verification_risk_score
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.SupportingDocument.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          On Applicant (identity-risk domain, NOT the scheduling domain of the SLA dual-variant):
          PROVISIONAL at submit scores 75.00 (docs PENDING -> quality 0, photo PASS 25) while FINAL
          after both docs ACCEPTED scores 0.00; same applicant, two algorithms, 75-point delta.
        test_recipe:
          setup:
            - "Adult applicant, NEW BOOK application with PASS photo and two quality-100 docs; observe risk at submission (PROVISIONAL) then after both docs accepted (FINAL)."
          setup_api_calls:
            - call: "POST /acceptance-facilities"
              payload: { name: "Downtown", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent A", badge_number: "B-2", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat2@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { id_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { cit_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applicants/${appl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { prov_risk: "$.data.verification_risk_score" }
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/begin-verification"
              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "POST /documents/${id_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /documents/${cit_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "GET /applicants/${appl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { final_risk: "$.data.verification_risk_score" }
          assert:
            - "Applicant.${appl_id}.verification_risk_score after submit (PROVISIONAL) == 75.00"
            - "Applicant.${appl_id}.verification_risk_score after both docs ACCEPTED (FINAL) == 0.00"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_bundle_minor_age_band_nonlinear_interaction
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.base_fee_cents
          - entities.FeeAssessment.fields.total_due_cents
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: base = book(minor) + card(minor)
          - bundle_discount only when product_type==BOOK_AND_CARD AND applicant_is_minor; for a MINOR
          BOOK_AND_CARD EXPEDITE the total is 10000+1500-1000 + 3500 exec + 6000 expedite = 20000, not a
          linear sum of independent line items.
        test_recipe:
          setup:
            - "Minor applicant (DOB makes is_minor true at clock 2026-06-01); MINOR BOOK_AND_CARD EXPEDITE application with guardian consent doc and PASS photo; submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Adjudicator
            - call: "POST /applicants"
              payload: { full_legal_name: "Guardian G", date_of_birth: "1985-01-01", email: "g@x.com" }
              as: Applicant
              captures: { guardian_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Minor M", date_of_birth: "2015-01-01", email: "m@x.com", guardian_applicant_id: "${guardian_id}" }
              as: Applicant
              captures: { minor_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${minor_id}", application_type: "MINOR", product_type: "BOOK_AND_CARD", service_level: "EXPEDITE" }
              as: Applicant
              as_user_id: "${minor_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${minor_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "GUARDIAN_CONSENT", doc_kind: "CONSENT_FORM", declared_quality: 100 }
              as: Applicant
              as_user_id: "${minor_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${minor_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${minor_id}"
              captures: { base: "$.data[0].base_fee_cents", total: "$.data[0].total_due_cents" }
          assert:
            - "FeeAssessment.base_fee_cents == 10500"
            - "FeeAssessment.execution_fee_cents == 3500"
            - "FeeAssessment.expedite_fee_cents == 6000"
            - "FeeAssessment.total_due_cents == 20000"

      - name: fee_evaluation_order_urgent_surcharge_pinned_after_book
        grounds:
          - calculations.fee_assessment
          - entities.Application.fields.urgent_travel
          - entities.FeeAssessment.fields.urgent_surcharge_cents
          - state_machines.Appointment.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: total_due_cents depends on
          Application.urgent_travel, which is itself a side-effect of booking an UrgentTravelCounter appointment
          that re-derives the still-UNPAID fee; the scaffold pins the order (book -> flip urgent_travel ->
          re-derive fee), so a NEW BOOK ROUTINE fee moves 16500 -> 22500 and back to 16500 on cancel.
        test_recipe:
          setup:
            - "Adult NEW BOOK ROUTINE application submitted (fee 16500, UNPAID); an urgent-travel counter exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Adjudicator
            - call: "POST /urgent-travel-counters"
              payload: { name: "Counter 1", cleanup_buffer_minutes: 15 }
              as: Adjudicator
              captures: { counter_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat3@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", resource_kind: "URGENT_TRAVEL_COUNTER", counter_id: "${counter_id}", start_utc: "2026-06-09T09:00:00Z", end_utc: "2026-06-09T09:30:00Z", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { total_after: "$.data[0].total_due_cents", urgent_after: "$.data[0].urgent_surcharge_cents" }
          assert:
            - "FeeAssessment.total_due_cents before booking == 16500"
            - "FeeAssessment.urgent_surcharge_cents after booking == 6000"
            - "FeeAssessment.total_due_cents after booking == 22500"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_review_loop_adjudicating_to_review_hold_and_back
        grounds:
          - state_machines.Application.ADJUDICATING_to_REVIEW_HOLD
          - state_machines.Application.REVIEW_HOLD_to_IN_VERIFICATION
          - state_machines.Application.IN_VERIFICATION_to_ADJUDICATING
        distinguishing_aspect: |
          On Application: cyclic shape — RETURN_FOR_REVIEW sends ADJUDICATING -> REVIEW_HOLD, clear-hold sends
          REVIEW_HOLD -> IN_VERIFICATION, and re-accepting the last required doc returns IN_VERIFICATION ->
          ADJUDICATING; the same application revisits ADJUDICATING twice (a loop, not a linear pipeline).
        test_recipe:
          setup:
            - "Adult NEW BOOK application in ADJUDICATING with both docs accepted, fee paid, separate agent and adjudicator."
          setup_api_calls:
            - call: "POST /acceptance-facilities"
              payload: { name: "Downtown", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent A", badge_number: "B-3", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_id: "$.data.id" }
            - call: "POST /adjudicators"
              payload: { name: "Adj Z", passport_office_code: "OZ-3" }
              as: Adjudicator
              captures: { adj_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat4@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { id_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { cit_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/begin-verification"
              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "POST /documents/${id_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "POST /documents/${cit_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /applications/${app_id}/adjudicate"
              payload: { decision: "RETURN_FOR_REVIEW", reason_code: "RECHECK" }
              as: Adjudicator
              as_user_id: "${adj_id}"
            - call: "POST /applications/${app_id}/clear-hold"
              payload: {}
              as: Adjudicator
              as_user_id: "${adj_id}"
              captures: { status_after_clear: "$.data.status" }
          assert:
            - "Application.${app_id}.status after RETURN_FOR_REVIEW == \"REVIEW_HOLD\""
            - "Application.${app_id}.status after clear-hold == \"IN_VERIFICATION\""

      - name: application_name_change_parallel_dimension_independent_of_main_status
        grounds:
          - state_machines.Application.name_change_status.NONE_to_PENDING_EVIDENCE
          - state_machines.Application.name_change_status.PENDING_EVIDENCE_to_EVIDENCE_VERIFIED
          - entities.Application.fields.name_change_status
          - entities.Application.fields.status
        distinguishing_aspect: |
          On Application (different entity than the cyclic instance — here the parallel name_change_status
          dimension): name_change_status evolves NONE->PENDING_EVIDENCE at creation and ->EVIDENCE_VERIFIED on
          doc accept while the main status independently moves DRAFT->SUBMITTED->IN_VERIFICATION; two
          independent axes on one row.
        test_recipe:
          setup:
            - "Adult RENEWAL BOOK application with name_change_requested=true; NAME_CHANGE_EVIDENCE doc attached; submitted, paid, verification begun."
          setup_api_calls:
            - call: "POST /acceptance-facilities"
              payload: { name: "Downtown", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent A", badge_number: "B-4", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Jane New", date_of_birth: "1988-01-01", email: "jane@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "RENEWAL", product_type: "BOOK", service_level: "ROUTINE", name_change_requested: true, prior_name: "Jane Old" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version", nc0: "$.data.name_change_status" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "NAME_CHANGE_EVIDENCE", doc_kind: "MARRIAGE_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { nc_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { status_submitted: "$.data.status", nc_after_submit: "$.data.name_change_status" }
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/begin-verification"
              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /documents/${nc_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
            - call: "GET /applications/${app_id}"
              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
              captures: { final_status: "$.data.status", final_nc: "$.data.name_change_status" }
          assert:
            - "Application.${app_id}.name_change_status at creation == \"PENDING_EVIDENCE\""
            - "Application.${app_id}.name_change_status after NAME_CHANGE_EVIDENCE accepted == \"EVIDENCE_VERIFIED\""
            - "Application.${app_id}.status after the same accept == \"ADJUDICATING\" (renewal: name-change doc is the only required doc)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: last_doc_accept_cascades_to_adjudicating_then_review_hold_depth3
        grounds:
