# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Subscription Box — Expert tier. Cross-references SCAFFOLD.yaml §1.1–§1.7
# against the nine Difficulty Rules in §0.5. 9 rule_ids x >=2 instances = 18.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancel_refund_prepaid_amortized_vs_period_proration
        grounds:
          - calculations.cancellation_refund
          - calculations.cancellation_refund.variants.prepaid_amortized
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - entities.Subscription.fields.prepaid_unit_value_cents
        distinguishing_aspect: |
          On identical nominal price (6000/period, 6 periods), the PREPAID subscription refunds
          the amortized 6*5400=32400 (discount forfeited), whereas a pay-as-you-go subscription
          would refund full per-period price for unshipped periods — same Subscription entity,
          different variant selected purely by billing_status.
        test_recipe:
          setup:
            - "Plan PLUS: 6000/period MONTHLY, box_item_count=1, prepaid_terms_offered=[6], discount 0.10."
            - "Subscriber S with a subscription that PREPAID 6 periods (total 32400, unit 5400), nothing shipped, billing_status=PREPAID, prepaid_periods_remaining=6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "PLUS", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1, prepaid_terms_offered: [6], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "s1@x.com", full_name: "S One" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /subscriptions/${s_id}/prepay"
              payload: { term_periods: 6, expected_subscription_version: "${s_ver}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_ver2: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_final_life: $.data.lifecycle_status }
          assert:
            - "Subscription.${s_id}.lifecycle_status == CANCELLED"
            - "Subscriber.${sub_acct_id}.wallet_balance_cents == 32400"
            - "the created WalletEntry has kind == REFUND_CREDIT and amount_cents == 32400"

      - name: winback_credit_standard_vs_cold_subscriber_tenure
        grounds:
          - calculations.winback_credit
          - calculations.winback_credit.variants.cold_winback
          - state_machines.Subscription.CANCELLED_to_ACTIVE
          - entities.Subscriber.fields.wallet_balance_cents
        distinguishing_aspect: |
          The win-back grant is loyalty scoring on the SUBSCRIBER (tenure over all their shipments),
          a different entity domain than cancellation_refund's cost accounting on the Subscription;
          a subscriber with 0 committed shipments gets the cold grant base*0.20 = 1200, not the
          tenure-boosted standard grant.
        test_recipe:
          setup:
            - "Plan PLUS 6000/period MONTHLY. Subscriber S cancelled immediately before any box shipped (0 committed shipments), still inside the 60-day win-back window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "PLUS", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1, prepaid_terms_offered: [6], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "cold@x.com", full_name: "Cold S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /subscriptions/${s_id}/winback"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_life: $.data.lifecycle_status }
          assert:
            - "Subscription.${s_id}.lifecycle_status == ACTIVE"
            - "the created WalletEntry has kind == WINBACK_CREDIT and amount_cents == 1200"
            - "Subscriber.${sub_acct_id}.wallet_balance_cents == 1200"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: prepaid_charge_discount_floored_once_on_aggregate_gross
        grounds:
          - calculations.prepaid_charge
          - state_machines.Subscription.CURRENT_to_PREPAID
          - entities.Subscription.fields.prepaid_unit_value_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding where order genuinely diverges: discount = floor(3335*3*0.10) =
          floor(1000.5) = 1000 applied ONCE on the summed gross 10005, yielding total 9005; the rejected
          per-period order (floor(333.5)=333 per period, *3 = 999 discount) would give 9006. The scaffold
          pins summed-gross-then-floor, so the correct total is 9005, not 9006.
        test_recipe:
          setup:
            - "Plan with period_price 3335, term 3, discount 0.10: gross=10005, 10005*0.10=1000.5, floor=1000, total=9005 (per-period floor-then-sum would wrongly give 9006)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "ODD", cadence: "MONTHLY", period_price_cents: 3335, box_item_count: 1, prepaid_terms_offered: [3], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "odd@x.com", full_name: "Odd S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id, s_ver: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_id}/prepay"
              payload: { term_periods: 3, expected_subscription_version: "${s_ver}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { bill_status: $.data.billing_status }
          assert:
            - "Subscription.${s_id}.billing_status == PREPAID"
            - "Subscription.${s_id}.prepaid_periods_remaining == 3"
            - "Subscription.${s_id}.prepaid_unit_value_cents == 3001"
            - "the created Invoice has kind == PREPAID_CHARGE and gross_amount_cents == 9005"

      - name: allocation_fill_all_or_nothing_multi_product_availability
        grounds:
          - calculations.allocation_fill
          - state_machines.Allocation.RESERVED_to_RELEASED
          - entities.Product.fields.allocated_qty
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (a) >=3 inputs with nonlinear all-or-nothing: a box of 3 units across 2 distinct
          products (P_A x2, P_B x1) reserves ONLY IF available(P_A)>=2 AND available(P_B)>=1 AND
          wave has capacity; a single short product rejects the whole box with ERR_INSUFFICIENT_INVENTORY,
          reserving nothing.
        test_recipe:
          setup:
            - "Plan box_item_count=3. Product A on_hand=1 (short), Product B on_hand=5. Box requests [A,A,B]. Wave OPEN capacity=10, clock before cutoff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "TRIO", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 3 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "Prod A", on_hand_qty: 1 }
              as: CurationAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "B", name: "Prod B", on_hand_qty: 5 }
              as: CurationAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "trio@x.com", full_name: "Trio S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${pa_id}", "${pa_id}", "${pb_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_INVENTORY (422)"
            - "Product.${pa_id}.allocated_qty == 0 (nothing reserved)"
            - "Product.${pb_id}.allocated_qty == 0 (all-or-nothing — B not reserved either)"
            - "ShippingWave.${wave_id}.reserved_count == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_lifecycle_and_billing_dimensions
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.CURRENT_to_PREPAID
          - entities.Subscription.fields.lifecycle_status
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: |
          Subscription carries two independent state axes: prepay moves billing_status CURRENT->PREPAID
          while lifecycle_status stays ACTIVE; a subsequent pause moves lifecycle_status ACTIVE->PAUSED
          while billing_status stays PREPAID — the two dimensions evolve on the same row independently.
        test_recipe:
          setup:
            - "Plan PLUS with prepaid term 6. Subscriber S with ACTIVE/CURRENT subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "PLUS", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1, prepaid_terms_offered: [6], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "par@x.com", full_name: "Par S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /subscriptions/${s_id}/prepay"
              payload: { term_periods: 6, expected_subscription_version: "${s_ver}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
          trigger:
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-08-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { life: $.data.lifecycle_status, bill: $.data.billing_status }
          assert:
            - "Subscription.${s_id}.lifecycle_status == PAUSED"
            - "Subscription.${s_id}.billing_status == PREPAID (billing dimension unchanged by pause)"
            - "Subscription.${s_id}.prepaid_periods_remaining == 6"

      - name: allocation_branching_reserved_to_released_vs_committed
        grounds:
          - state_machines.Allocation.RESERVED_to_RELEASED
          - state_machines.Allocation.RESERVED_to_COMMITTED
          - state_machines.ShippingWave.LOCKED_to_SHIPPED
          - entities.Allocation.fields.status
        distinguishing_aspect: |
          Allocation is a branching machine on a different entity than Subscription: from RESERVED it
          forks to RELEASED (manual release restocks, allocated_qty returns) OR to COMMITTED (wave ship
          deducts on_hand) with divergent side-effect sets — release returns units to the free pool while
          commit physically removes them.
        test_recipe:
          setup:
            - "Plan box_item_count=1. Product P on_hand=5. Subscriber S, box curated [P], reserved into wave W1 (RESERVED). Clock past W1 cutoff, W1 LOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "SOLO", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P1", name: "Prod P", on_hand_qty: 5 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "br@x.com", full_name: "Br S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { alloc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /waves/${wave_id}/lock"
              payload: {}
              as: CurationAdmin
          trigger:
            - call: "POST /waves/${wave_id}/ship"
              payload: {}
              as: CurationAdmin
              captures: { wave_status: $.data.status }
          assert:
            - "Allocation.${alloc_id}.status == COMMITTED (branch to commit, not release)"
            - "Product.${p_id}.on_hand_qty == 4 (one unit physically departed on commit)"
            - "Product.${p_id}.allocated_qty == 0"
            - "a Shipment with allocation_id == ${alloc_id} exists in status PACKED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: immediate_cancel_depth3_box_revert_release_restock
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.Allocation.RESERVED_to_RELEASED
          - entities.Product.fields.allocated_qty
          - entities.ShippingWave.fields.reserved_count
        distinguishing_aspect: |
          Depth-3 chain triggered by immediate cancel: cancel mutates the FINALIZED BoxSelection
          (FINALIZED->SKIPPED); that box mutation RELEASES its Allocation (RESERVED->RELEASED); the
          release mutation RESTOCKS the Product (allocated_qty-1) AND decrements ShippingWave.reserved_count.
          Each hop is caused by the prior hop, not by the cancel directly.
        test_recipe:
          setup:
            - "Plan box_item_count=1 pay-as-you-go. Product P on_hand=5. Subscriber S active; box [P] reserved into OPEN wave W (reserved_count=1, P.allocated_qty=1, box FINALIZED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "C3", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "C3P", name: "C3 Prod", on_hand_qty: 5 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c3@x.com", full_name: "C3 S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { life: $.data.lifecycle_status }
          assert:
            - "Subscription.${s_id}.lifecycle_status == CANCELLED"
            - "Allocation.${alloc_id}.status == RELEASED"
            - "Product.${p_id}.allocated_qty == 0 (restocked to free pool)"
            - "Product.${p_id}.on_hand_qty == 5 (units never left the warehouse)"
            - "ShippingWave.${wave_id}.reserved_count == 0"
            - "BoxSelection.${box_id}.decision == SKIPPED"

      - name: wave_cancel_depth2_release_restock_box_revert
        grounds:
          - state_machines.ShippingWave.OPEN_to_CANCELLED
          - state_machines.Allocation.RESERVED_to_RELEASED
          - entities.Product.fields.allocated_qty
          - entities.BoxSelection.fields.decision
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (wave cancel, not subscription cancel): wave cancel
          RELEASES each RESERVED Allocation; each release RESTOCKS its Product and reverts the BoxSelection
          (FINALIZED->CURATED). Originates from ShippingWave.OPEN_to_CANCELLED, a distinct propagation pattern.
        test_recipe:
          setup:
            - "Plan box_item_count=1. Product P on_hand=8. Two subscribers each with a box reserved into OPEN wave W (reserved_count=2, P.allocated_qty=2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "WC", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "WCP", name: "WC Prod", on_hand_qty: 8 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "wc1@x.com", full_name: "WC One" }
              as: Subscriber
              captures: { s1_acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${s1_acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${s1_acct}"
              captures: { sub1_id: $.data.id }
            - call: "POST /subscriptions/${sub1_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${s1_acct}"
              captures: { box1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "wc2@x.com", full_name: "WC Two" }
              as: Subscriber
              captures: { s2_acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${s2_acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${s2_acct}"
              captures: { sub2_id: $.data.id }
            - call: "POST /subscriptions/${sub2_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${s2_acct}"
              captures: { box2_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver0: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${sub1_id}", wave_id: "${wave_id}", box_selection_id: "${box1_id}", expected_wave_version: "${wave_ver0}" }
              as: CurationAdmin
              captures: { alloc1_id: $.data.id, wave_ver1: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${sub2_id}", wave_id: "${wave_id}", box_selection_id: "${box2_id}", expected_wave_version: "${wave_ver1}" }
              as: CurationAdmin
              captures: { alloc2_id: $.data.id }
          trigger:
            - call: "POST /waves/${wave_id}/cancel"
              payload: {}
              as: CurationAdmin
              captures: { wstatus: $.data.status }
          assert:
            - "ShippingWave.${wave_id}.status == CANCELLED"
            - "Allocation.${alloc1_id}.status == RELEASED"
            - "Allocation.${alloc2_id}.status == RELEASED"
            - "Product.${p_id}.allocated_qty == 0 (both reservations restocked)"
            - "Product.${p_id}.on_hand_qty == 8"
            - "BoxSelection.${box1_id}.decision == CURATED"
            - "BoxSelection.${box2_id}.decision == CURATED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocation_temporal_cutoff_beats_safety_inventory
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_CUTOFF_PASSED]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          On POST /allocations a request that both passes cutoff (business_temporal, prio 9) AND has a
          short product (business_safety, prio 10) returns ERR_CUTOFF_PASSED — the temporal check at the
          lower priority number wins over the safety check. Category pair: business_temporal vs business_safety.
        test_recipe:
          setup:
            - "Box [A,A] needs A x2 but A.on_hand=1 (short). Wave cutoff already passed (clock at-or-after cutoff)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "PP1", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 2 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PP1A", name: "PP1 A", on_hand_qty: 1 }
              as: CurationAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "pp1@x.com", full_name: "PP1 S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${pa_id}", "${pa_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-10T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUTOFF_PASSED (422), NOT ERR_INSUFFICIENT_INVENTORY"

      - name: winback_constraint_gift_beats_temporal_window
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_GIFT_NOT_REACTIVATABLE]
          - errors[ERR_WINBACK_WINDOW_CLOSED]
        distinguishing_aspect: |
          A win-back on a CANCELLED gift subscription that is ALSO past the 60-day window returns
          ERR_GIFT_NOT_REACTIVATABLE (business_constraint, prio 8) ahead of ERR_WINBACK_WINDOW_CLOSED
          (business_temporal, prio 9). Category pair: business_constraint vs business_temporal — a
          different pairing than the allocation conflict above.
        test_recipe:
          setup:
            - "Gift subscription (is_gift=true) that has been CANCELLED, and the clock is more than 60 days past cancellation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "GP", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "gifter@x.com", full_name: "Gifter" }
              as: Subscriber
              captures: { gifter_acct: $.data.id }
            - call: "POST /gift-grants"
              payload: { plan_id: "${plan_id}", gifter_subscriber_id: "${gifter_acct}", term_periods: 1, recipient_email: "rec@x.com" }
              as: Subscriber
              as_user_id: "${gifter_acct}"
              captures: { gift_id: $.data.id, code: $.data.redemption_code }
            - call: "POST /subscribers"
              payload: { email: "rec@x.com", full_name: "Recipient" }
              as: Subscriber
              captures: { rec_acct: $.data.id }
            - call: "POST /gift-grants/redeem"
              payload: { redemption_code: "${code}", subscriber_id: "${rec_acct}" }
              as: Subscriber
              as_user_id: "${rec_acct}"
              captures: { gsub_id: $.data.id }
            - call: "POST /subscriptions/${gsub_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${rec_acct}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /subscriptions/${gsub_id}/winback"
              payload: {}
              as: Subscriber
              as_user_id: "${rec_acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GIFT_NOT_REACTIVATABLE (422), NOT ERR_WINBACK_WINDOW_CLOSED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wave_cutoff_strict_less_than_at_exact_instant_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_CUTOFF_PASSED]
          - entities.ShippingWave.fields.cutoff_at
        distinguishing_aspect: |
          Allocation requires clock < cutoff_at (strict). At the EXACT cutoff instant
          (clock == cutoff_at) the allocation is rejected with ERR_CUTOFF_PASSED; one second
          earlier it would succeed. Metric: a datetime threshold crossing on POST /allocations.
        test_recipe:
          setup:
            - "Box [P] curated, P.on_hand sufficient, wave cutoff at 2026-06-10T00:00:00Z, clock set to exactly 2026-06-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "BP1", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "BP1P", name: "BP1 P", on_hand_qty: 5 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "bp1@x.com", full_name: "BP1 S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-10T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUTOFF_PASSED (422) at clock == cutoff_at exactly"
            - "ShippingWave.${wave_id}.reserved_count == 0"

      - name: ship_empty_wave_zero_reserved_allocations_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_EMPTY_WAVE]
          - state_machines.ShippingWave.LOCKED_to_SHIPPED
          - entities.ShippingWave.fields.reserved_count
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT metric and endpoint: shipping a LOCKED wave whose
          reserved_count == 0 is rejected with ERR_EMPTY_WAVE on POST /waves/{id}/ship — a zero-count
          edge, not a datetime crossing.
        test_recipe:
          setup:
            - "Wave W opened, no allocations ever attached, clock advanced past cutoff and W locked (reserved_count=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-10T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /waves/${wave_id}/lock"
              payload: {}
              as: CurationAdmin
          trigger:
            - call: "POST /waves/${wave_id}/ship"
              payload: {}
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_WAVE (422)"
            - "ShippingWave.${wave_id}.status == LOCKED (ship did not fire)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_requires_wave_open_not_locked
        grounds:
          - state_machines.Allocation.RESERVED_to_RELEASED
          - state_machines.ShippingWave.OPEN_to_LOCKED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Allocation creation depends on the referenced ShippingWave's state: once the wave is LOCKED,
          a new allocation is rejected with ERR_INVALID_STATE. Entity pair: Allocation -> ShippingWave.
        test_recipe:
          setup:
            - "Box [P] curated, P.on_hand sufficient, wave W locked (clock past cutoff, status LOCKED)."
          setup_api_calls:
