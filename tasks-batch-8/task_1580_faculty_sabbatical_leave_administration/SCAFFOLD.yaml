# =============================================================================
# SCAFFOLD — Faculty Sabbatical & Leave Administration
# University academic affairs: sabbatical eligibility accrual, committee
# ranking, coverage budgeting, return-service obligation & repayment,
# fellowship offsets, leave-type coordination.
# =============================================================================

scenario: |
  Faculty Sabbatical & Leave Administration (university academic affairs): eligibility accrual & application cycle, proposal review & committee ranking, salary percentage & duration options, replacement teaching cost & department coverage plan, return-service obligation & repayment on departure, report of accomplishments upon return, interaction with grants & external fellowship, leave types (medical/personal/professional) coordination

domain_name: faculty-sabbatical-leave
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation        # finite cycle award quota + finite department replacement budget, waterfall allocation by rank
  secondary_archetype: temporal_windowing    # leave/fellowship intervals with overlap, adjacency, and proportional-overlap semantics
  complexity_layers:
    - optimistic_concurrency                 # OCC on LeaveApplication.version (coverage-plan supersede) and RepaymentObligation.version (payments)
    - cascading_side_effects                 # complete/separate/decide trigger 3+-hop chains across grant -> plan -> department -> posture
    - dual_variant_calculation               # certified vs provisional eligibility; chronological vs proportional repayment; provisional vs final coverage cost
    - rate_threshold_triggers                # department posture OPEN/CONSTRAINED/FROZEN at exact utilization thresholds
  entity_topology: flat                      # all resources top-level, linked by foreign keys; filtered lists for reverse reachability
  state_machine_shape: cyclic                # revision loops on LeaveApplication/CoveragePlan/AccomplishmentReport; LeaveApplication also carries parallel dimensions (status x funding_status); LeaveGrant branches with divergent side effects
  relationship_patterns:
    - one_to_many                            # Department->FacultyMember, LeaveCycle->LeaveApplication, LeaveApplication->CommitteeReview/CoveragePlan
    - self_referential                       # CoveragePlan.supersedes_plan_id chains revisions
    - cross_aggregate                        # grants/obligations/repayments/reports/fellowships cross-reference across aggregates
  role_model: segregation_of_duties          # applicant != reviewer; reviewer not from applicant's department; chair cannot file coverage for own application; requester/approver split Faculty -> DepartmentChair -> ProvostOffice
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Department name" }
      - { name: chair_faculty_id, type: string, source: input, description: "FK -> FacultyMember.id; nullable at creation, set via PATCH once the chair's faculty record exists", constraints: "nullable; when set must reference an existing FacultyMember" }
      - { name: replacement_pool, type: number, source: input, description: "Total replacement-teaching budget in USD for the planning horizon", constraints: "> 0; PATCH rejected if below reserved + spent (ERR_POOL_BELOW_COMMITMENTS)" }
      - { name: reserved_amount, type: number, source: computed, default: 0, description: "Sum of provisional_cost over CoveragePlan with status IN {APPROVED, CONFIRMED} for this department" }
      - { name: spent_amount, type: number, source: computed, default: 0, description: "Sum of final_cost over CoveragePlan with status == SETTLED for this department" }
      - { name: available_amount, type: number, source: computed, description: "= replacement_pool - reserved_amount - spent_amount; invariant reserved + spent + available == replacement_pool" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONSTRAINED | FROZEN — derived from utilization thresholds (see calculations.department_posture); recomputed and persisted on every reserved/spent/pool mutation" }

  - name: FacultyMember
    parent: null
    common_fields: true
    fields:
      - { name: employee_number, type: string, source: input, description: "HR employee number; unique" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; home department" }
      - { name: academic_rank, type: enum, source: input, description: "ASSISTANT_PROFESSOR | ASSOCIATE_PROFESSOR | FULL_PROFESSOR" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date; accrual watermark initializes to the calendar month before hire month" }
      - { name: annual_base_salary, type: number, source: input, description: "Annual base salary in USD", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | SEPARATED" }
      - { name: lifetime_service_months, type: integer, source: computed, default: 0, description: "Sum of credits_delta over AccrualLedgerEntry with entry_type == EARN, plus ADJUST entries with affects_lifetime == true; never reduced by CONSUME/RESTORE" }
      - { name: credit_balance, type: integer, source: computed, default: 0, description: "Sum of credits_delta over ALL AccrualLedgerEntry rows for this faculty (EARN +1, CONSUME negative, RESTORE positive, ADJUST signed)" }
      - { name: last_accrued_month, type: string, source: system, description: "YYYY-MM watermark; accrual runs credit whole months strictly after it; initialized to the month before hire month" }

  - name: LeaveCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cycle display name" }
      - { name: academic_year, type: string, source: input, description: "e.g. 2027-2028" }
      - { name: award_quota, type: integer, source: input, description: "Maximum number of sabbatical applications this cycle may award", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | ALLOCATED | FINALIZED" }
      - { name: awarded_count, type: integer, source: computed, default: 0, description: "Applications moved to AWARDED by the allocation run" }

  - name: LeaveApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_faculty_id, type: string, source: system, description: "FK -> FacultyMember.id; set from X-User-ID of the creating Faculty caller" }
      - { name: cycle_id, type: string, source: input, description: "FK -> LeaveCycle.id; REQUIRED iff leave_type == SABBATICAL, FORBIDDEN otherwise (ERR_INVALID_REQUEST)" }
      - { name: leave_type, type: enum, source: input, description: "SABBATICAL | MEDICAL | PERSONAL | PROFESSIONAL" }
      - { name: requested_duration_semesters, type: integer, source: input, description: "1 or 2 semesters (1 semester = 6 calendar months)" }
      - { name: requested_salary_pct, type: integer, source: input, description: "SABBATICAL: 1 sem -> {100}, 2 sem -> {50, 75}; PROFESSIONAL: 100; MEDICAL/PERSONAL: 0 (ERR_INVALID_DURATION_SALARY_COMBO otherwise)" }
      - { name: proposed_start_date, type: datetime, source: input, description: "Leave window start (half-open, inclusive)" }
      - { name: proposed_end_date, type: datetime, source: input, description: "Leave window end (half-open, exclusive); must equal start + requested_duration_semesters*6 calendar months (ERR_INVALID_DATE_RANGE)" }
      - { name: proposal_text, type: string, source: input, description: "Free-text proposal / reason", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | AWARDED | NOT_AWARDED | APPROVED | DENIED | WITHDRAWN | RESCINDED" }
      - { name: funding_status, type: enum, source: system, description: "Independent coverage-money dimension: NONE | COVERAGE_SUBMITTED | COVERAGE_APPROVED | COVERAGE_CONFIRMED | COVERAGE_SETTLED | COVERAGE_RELEASED" }
      - { name: composite_score, type: number, source: computed, description: "Committee composite per calculations.committee_composite_score; null until first SUBMITTED review" }
      - { name: submitted_review_count, type: integer, source: computed, default: 0, description: "CommitteeReview with status == SUBMITTED for this application" }
      - { name: quorum_met, type: boolean, source: computed, default: false, description: "submitted_review_count >= 3" }
      - { name: final_rank, type: integer, source: computed, description: "1-based rank assigned at allocation among quorum-met sabbatical applications; null before allocation" }
      - { name: award_outcome, type: enum, source: computed, description: "Set at allocation: AWARDED | QUOTA_EXCEEDED | INCOMPLETE_REVIEWS | NO_APPROVED_COVERAGE | INSUFFICIENT_CREDITS; null before" }
      - { name: current_coverage_plan_id, type: string, source: computed, description: "Pointer to the current non-superseded CoveragePlan (canonical relation is CoveragePlan.application_id; reverse lookup via GET /coverage-plans?application_id=); null when none" }

  - name: CommitteeReview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> LeaveApplication.id" }
      - { name: reviewer_faculty_id, type: string, source: system, description: "FK -> FacultyMember.id; set from X-User-ID of the CommitteeMember caller" }
      - { name: scholarly_merit, type: number, source: input, description: "0..100, at most 1 decimal place" }
      - { name: curriculum_benefit, type: number, source: input, description: "0..100, at most 1 decimal place" }
      - { name: feasibility, type: number, source: input, description: "0..100, at most 1 decimal place" }
      - { name: comments, type: string, source: input, description: "optional review comments", constraints: "optional" }
      - { name: weighted_total, type: number, source: computed, description: "round(0.45*merit,2) + round(0.35*curriculum,2) + round(0.20*feasibility,2), per-product round_half_up to 2dp BEFORE summing" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED (terminal)" }

  - name: CoveragePlan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> LeaveApplication.id; application must be sabbatical and pre-award" }
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; copied from the applicant's home department" }
      - { name: supersedes_plan_id, type: string, source: input, description: "FK -> CoveragePlan.id; optional; when present that plan (must be DRAFT/SUBMITTED/REVISION_REQUESTED) becomes SUPERSEDED", constraints: "optional, nullable" }
      - { name: courses_to_cover, type: integer, source: input, description: "Number of courses needing replacement teaching", constraints: "1..40" }
      - { name: provisional_cost, type: number, source: computed, description: "= courses_to_cover * 8000.00; reserved from the department at APPROVED" }
      - { name: final_cost, type: number, source: computed, description: "Set at SETTLED: full provisional_cost on completion; pro-rated round(provisional * actual_months / planned_months, 2) on curtailment" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REVISION_REQUESTED | SUPERSEDED | CONFIRMED | SETTLED | RELEASED" }

  - name: LeaveGrant
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LeaveApplication.id" }
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id; denormalized from application for filtering" }
      - { name: leave_type, type: enum, source: system, description: "Copied from application: SABBATICAL | MEDICAL | PERSONAL | PROFESSIONAL" }
      - { name: start_date, type: datetime, source: system, description: "Copied from application proposed window" }
      - { name: end_date, type: datetime, source: system, description: "Copied from application; overwritten by actual_return_date on curtailment" }
      - { name: duration_semesters, type: integer, source: system, description: "Copied from application" }
      - { name: salary_pct, type: integer, source: system, description: "Copied from application" }
      - { name: gross_salary, type: number, source: computed, description: "Set at activation: round(annual_base_salary * salary_pct/100 * duration_semesters*6/12, 2)" }
      - { name: fellowship_offset_total, type: number, source: computed, default: 0, description: "Set at activation: stacked VERIFIED fellowship offsets capped at 50% of gross_salary" }
      - { name: net_salary, type: number, source: computed, description: "= gross_salary - fellowship_offset_total, set at activation" }
      - { name: actual_months, type: integer, source: computed, description: "Whole calendar months served, set at completion (full) or curtailment (floor)", constraints: "nullable until grant leaves ACTIVE" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | COMPLETED | CURTAILED | CANCELLED" }

  - name: ExternalFellowship
    parent: null
    common_fields: true
    fields:
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id; reporting faculty, set from X-User-ID" }
      - { name: application_id, type: string, source: input, description: "FK -> LeaveApplication.id; must reference a SABBATICAL application of the reporting faculty (ERR_INVALID_REQUEST otherwise)" }
      - { name: name, type: string, source: input, description: "Fellowship / grant program name" }
      - { name: amount, type: number, source: input, description: "Total fellowship stipend in USD", constraints: "> 0" }
      - { name: window_start_date, type: datetime, source: input, description: "Fellowship window start (inclusive)" }
      - { name: window_end_date, type: datetime, source: input, description: "Fellowship window end (exclusive); must be after start (ERR_INVALID_DATE_RANGE)" }
      - { name: applied_offset, type: number, source: computed, default: 0, description: "Offset actually applied to the grant at activation (0 until APPLIED)" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | APPLIED | DECLINED" }

  - name: ServiceObligation
    parent: null
    common_fields: true
    fields:
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id" }
      - { name: grant_id, type: string, source: system, description: "FK -> LeaveGrant.id; exactly one obligation per grant" }
      - { name: required_months, type: integer, source: system, description: "= actual leave months served (full duration on completion, floor months on curtailment)" }
      - { name: fulfilled_months, type: integer, source: computed, default: 0, description: "Whole months credited by accrual runs while faculty status == ACTIVE" }
      - { name: last_credited_month, type: string, source: system, description: "YYYY-MM watermark; initialized to the month before the grant end month" }
      - { name: projected_liability, type: number, source: computed, description: "Forward-looking estimate if employment ended today: round(base * (required - fulfilled) / required, 2) where base = grant.net_salary + plan final_cost; DIVERGES from the chronological breach formula by rounding" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | FULFILLED | BREACHED" }

  - name: RepaymentObligation
    parent: null
    common_fields: true
    fields:
      - { name: obligation_id, type: string, source: system, description: "FK -> ServiceObligation.id" }
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id; denormalized for filtering" }
      - { name: base_amount, type: number, source: system, description: "= grant.net_salary + coverage plan final_cost at breach" }
      - { name: fulfilled_months_at_breach, type: integer, source: system, description: "Snapshot of obligation.fulfilled_months at breach" }
      - { name: monthly_forgiveness, type: number, source: system, description: "= round(base_amount / required_months, 2) — chronological per-month amortization unit" }
      - { name: amount_owed, type: number, source: system, description: "= base_amount - monthly_forgiveness * fulfilled_months_at_breach (chronological amortization; canonical at breach)" }
      - { name: amount_outstanding, type: number, source: computed, description: "= amount_owed - sum of RepaymentPayment.amount; 0 after WAIVED" }
      - { name: due_date, type: datetime, source: system, description: "= created_at + 365 days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEFAULTED | SETTLED | WAIVED" }

  - name: RepaymentPayment
    parent: null
    common_fields: false
    fields:
      - { name: repayment_id, type: string, source: system, description: "FK -> RepaymentObligation.id" }
      - { name: amount, type: number, source: input, description: "Payment amount in USD", constraints: "> 0 and <= amount_outstanding (ERR_PAYMENT_EXCEEDS_OUTSTANDING)" }
      - { name: resulting_outstanding, type: number, source: computed, description: "amount_outstanding immediately after this payment" }

  - name: AccomplishmentReport
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> LeaveGrant.id" }
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id; denormalized for filtering" }
      - { name: due_date, type: datetime, source: system, description: "= grant end_date + 90 days" }
      - { name: report_text, type: string, source: input, description: "Accomplishments narrative; supplied at submit" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock time of latest submission; null until first submit" }
      - { name: submitted_late, type: boolean, source: computed, default: false, description: "true once any submission occurs while status == OVERDUE; sticky thereafter" }
      - { name: decision_comments, type: string, source: system, description: "ProvostOffice review comments; nullable" }
      - { name: status, type: enum, source: system, description: "DUE | OVERDUE | SUBMITTED | ACCEPTED | REVISION_REQUIRED" }

  - name: AccrualLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id" }
      - { name: entry_type, type: enum, source: system, description: "EARN (system, +1/month) | CONSUME (system, at award) | RESTORE (system, at cancel/curtail) | ADJUST (manual via POST /accrual-ledger-entries)" }
      - { name: credits_delta, type: integer, source: system, description: "Signed credit-month delta; EARN +1, CONSUME -(36*semesters), RESTORE +(unused months*6 or full), ADJUST signed input" }
      - { name: affects_lifetime, type: boolean, source: input, default: false, description: "ADJUST-only flag: when true the delta also counts into lifetime_service_months" }
      - { name: month, type: string, source: system, description: "YYYY-MM the entry pertains to; set for EARN, null otherwise", constraints: "nullable" }
      - { name: note, type: string, source: input, description: "optional note for ADJUST entries", constraints: "optional" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FacultyMember
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /leave-grants/{id}/activate (system side effect)"
        actor: system
        preconditions: ["grant SCHEDULED, clock >= grant.start_date"]
        side_effects: ["FacultyMember.status -> ON_LEAVE"]
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /leave-grants/{id}/complete or /curtail (system side effect)"
        actor: system
        preconditions: []
        side_effects: ["FacultyMember.status -> ACTIVE"]
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /faculty-members/{id}/separate"
        actor: LeaveAdministrator
        preconditions: ["faculty status != SEPARATED (ERR_INVALID_FACULTY_STATE)"]
        side_effects:
          - "Each SCHEDULED LeaveGrant of this faculty -> CANCELLED: RESTORE ledger entry of +(36 * duration_semesters) credits; its CONFIRMED CoveragePlan -> RELEASED (Department.reserved_amount -= provisional_cost, spent_amount unchanged, posture recomputed); its application -> RESCINDED (funding_status -> COVERAGE_RELEASED); its VERIFIED ExternalFellowships -> DECLINED"
          - "Each IN_PROGRESS ServiceObligation -> BREACHED; the breach itself creates a RepaymentObligation (ACTIVE) with base_amount = grant.net_salary + plan final_cost, monthly_forgiveness = round(base/required,2), amount_owed = base - monthly*fulfilled_months_at_breach"
      - from: ON_LEAVE
        to: SEPARATED
        trigger: "POST /faculty-members/{id}/separate"
        actor: LeaveAdministrator
        preconditions: ["faculty status != SEPARATED (ERR_INVALID_FACULTY_STATE)"]
        side_effects:
          - "The ACTIVE LeaveGrant -> CURTAILED with actual_return_date = separation_date (final_cost pro-rated, credits RESTORE (planned-actual)*6, plan SETTLED, department buckets + posture recomputed), which creates a ServiceObligation (required = actual_months, fulfilled 0); that obligation is immediately BREACHED, which creates a RepaymentObligation with amount_owed = base_amount"
          - "Each IN_PROGRESS ServiceObligation from prior leaves -> BREACHED, each breach creating a RepaymentObligation as in the ACTIVE->SEPARATED transition"

  - entity: LeaveCycle
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /leave-cycles/{id}/open"
        actor: ProvostOffice
        preconditions: ["cycle status == DRAFT (ERR_INVALID_CYCLE_STATE)"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /leave-cycles/{id}/close"
        actor: ProvostOffice
        preconditions: ["cycle status == OPEN (ERR_CYCLE_NOT_OPEN used for submit-gate; here ERR_INVALID_CYCLE_STATE)"]
        side_effects: []
      - from: CLOSED
        to: ALLOCATED
        trigger: "POST /leave-cycles/{id}/allocate"
        actor: ProvostOffice
        preconditions: ["cycle status == CLOSED (ERR_CYCLE_NOT_CLOSED)"]
        side_effects:
          - "Rank sabbatical applications with status == UNDER_REVIEW per calculations.allocation_ranking; assign final_rank to quorum-met applications"
          - "For each application in ranked order while awarded_count < award_quota: quorum_met AND current plan APPROVED AND applicant credit_balance >= 36*semesters -> application -> AWARDED (award_outcome AWARDED), create LeaveGrant SCHEDULED (window = proposed window), plan APPROVED -> CONFIRMED, funding_status -> COVERAGE_CONFIRMED, CONSUME ledger entry -(36*semesters) credits"
          - "Applications skipped/failing a gate -> NOT_AWARDED with award_outcome INCOMPLETE_REVIEWS | NO_APPROVED_COVERAGE | INSUFFICIENT_CREDITS | QUOTA_EXCEEDED (evaluated in that order per application: quorum, plan, credits, quota)"
          - "cycle.awarded_count set; cycle.version incremented"
      - from: ALLOCATED
        to: FINALIZED
        trigger: "POST /leave-cycles/{id}/finalize"
        actor: ProvostOffice
        preconditions: ["cycle status == ALLOCATED (ERR_CYCLE_NOT_ALLOCATED)"]
        side_effects: []

  - entity: LeaveApplication
    initial_state: DRAFT
    terminal_states: [NOT_AWARDED, APPROVED, DENIED, WITHDRAWN, RESCINDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /leave-applications/{id}/submit"
        actor: Faculty
        preconditions:
          - "caller owns the application (ERR_NOT_RESOURCE_OWNER)"
          - "status == DRAFT or REVISION_REQUESTED (ERR_INVALID_APPLICATION_STATE)"
          - "full validation chain §1.4 (cycle OPEN, no duplicate, referential gates, eligibility, window/overlap, credits)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /leave-applications/{id}/submit"
        actor: Faculty
        preconditions: ["same chain as DRAFT->UNDER_REVIEW"]
        side_effects: ["existing SUBMITTED CommitteeReviews persist; composite_score recomputed unchanged"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /leave-applications/{id}/request-revision"
        actor: ProvostOffice
        preconditions: ["status == UNDER_REVIEW (ERR_INVALID_APPLICATION_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /leave-applications/{id}/decide with decision=APPROVED (non-sabbatical only)"
        actor: ProvostOffice
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_APPLICATION_STATE)"
          - "leave_type != SABBATICAL (ERR_SABBATICAL_REQUIRES_ALLOCATION)"
          - "no overlapping ACTIVE LeaveGrant for this faculty (ERR_LEAVE_WINDOW_OVERLAP)"
        side_effects:
          - "Create LeaveGrant SCHEDULED with the proposed window (salary fields computed at activation)"
          - "MEDICAL-only cascade: any overlapping SCHEDULED sabbatical LeaveGrant of this faculty -> CANCELLED; that cancellation posts a RESTORE ledger entry of +(36*semesters) credits; the cancelled grant's CONFIRMED CoveragePlan -> RELEASED (Department.reserved_amount -= provisional_cost, posture recomputed); the cancelled grant's application -> RESCINDED with funding_status -> COVERAGE_RELEASED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /leave-applications/{id}/decide with decision=DENIED (non-sabbatical only)"
        actor: ProvostOffice
        preconditions: ["status == UNDER_REVIEW", "leave_type != SABBATICAL (ERR_SABBATICAL_REQUIRES_ALLOCATION)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /leave-cycles/{id}/allocate (system)"
        actor: system
        preconditions: ["quorum_met", "current CoveragePlan APPROVED", "credit_balance >= 36*semesters", "rank <= award_quota"]
        side_effects: ["LeaveGrant SCHEDULED created", "plan -> CONFIRMED", "funding_status -> COVERAGE_CONFIRMED", "CONSUME ledger entry"]
      - from: UNDER_REVIEW
        to: NOT_AWARDED
        trigger: "POST /leave-cycles/{id}/allocate (system)"
        actor: system
        preconditions: ["any allocation gate failed or quota exhausted"]
        side_effects: ["award_outcome set to the failing gate's reason"]
      - from: AWARDED
        to: RESCINDED
        trigger: "system (medical-approval cascade or faculty separation)"
        actor: system
        preconditions: []
        side_effects: ["funding_status -> COVERAGE_RELEASED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /leave-applications/{id}/withdraw"
        actor: Faculty
        preconditions: ["caller owns the application", "status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} (ERR_INVALID_APPLICATION_STATE)"]
        side_effects:
          - "CoveragePlans in DRAFT/SUBMITTED/REVISION_REQUESTED -> SUPERSEDED; an APPROVED plan -> RELEASED (Department.reserved_amount -= provisional_cost, posture recomputed)"
          - "funding_status -> NONE"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /leave-applications/{id}/withdraw"
        actor: Faculty
        preconditions: ["caller owns the application"]
        side_effects: ["same cascade as DRAFT->WITHDRAWN"]
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /leave-applications/{id}/withdraw"
        actor: Faculty
        preconditions: ["caller owns the application"]
        side_effects: ["same cascade as DRAFT->WITHDRAWN"]

  - entity: LeaveApplicationFunding
    initial_state: NONE
    terminal_states: [COVERAGE_SETTLED, COVERAGE_RELEASED]
    note: "Parallel (independent) state dimension carried on LeaveApplication.funding_status alongside status; all transitions are system side effects of CoveragePlan / cycle / grant events"
    transitions:
      - from: NONE
        to: COVERAGE_SUBMITTED
        trigger: "CoveragePlan DRAFT->SUBMITTED for this application (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_SUBMITTED
        to: COVERAGE_APPROVED
        trigger: "CoveragePlan SUBMITTED->APPROVED (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_SUBMITTED
        to: NONE
        trigger: "current plan SUPERSEDED or application WITHDRAWN (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_APPROVED
        to: COVERAGE_CONFIRMED
        trigger: "allocation award (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_APPROVED
        to: NONE
        trigger: "application WITHDRAWN releases the approved plan (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_CONFIRMED
        to: COVERAGE_SETTLED
        trigger: "grant COMPLETED or CURTAILED (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_CONFIRMED
        to: COVERAGE_RELEASED
        trigger: "grant CANCELLED (system)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CommitteeReview
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /committee-reviews/{id}/submit"
        actor: CommitteeMember
        preconditions:
          - "caller is the review's reviewer (ERR_NOT_RESOURCE_OWNER)"
          - "review status == DRAFT (ERR_INVALID_REVIEW_STATE)"
          - "application still UNDER_REVIEW (ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "recompute application.composite_score, submitted_review_count, quorum_met per calculations.committee_composite_score"

  - entity: CoveragePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, SETTLED, RELEASED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /coverage-plans/{id}/submit"
        actor: DepartmentChair
        preconditions:
          - "chair of the plan's department or ProvostOffice (ERR_CHAIR_DEPARTMENT_MISMATCH)"
          - "plan status == DRAFT (ERR_INVALID_PLAN_STATE)"
          - "application status IN {UNDER_REVIEW, REVISION_REQUESTED} (ERR_INVALID_APPLICATION_STATE)"
          - "department posture != FROZEN (ERR_DEPARTMENT_FROZEN)"
        side_effects: ["application.funding_status -> COVERAGE_SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /coverage-plans/{id}/approve"
        actor: ProvostOffice
        preconditions:
          - "plan status == SUBMITTED (ERR_INVALID_PLAN_STATE)"
          - "department posture != FROZEN (ERR_DEPARTMENT_FROZEN)"
          - "department available_amount >= plan.provisional_cost (ERR_INSUFFICIENT_COVERAGE_BUDGET)"
        side_effects:
          - "Department.reserved_amount += provisional_cost; available_amount and posture recomputed"
          - "application.funding_status -> COVERAGE_APPROVED"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /coverage-plans/{id}/request-revision"
        actor: ProvostOffice
        preconditions: ["plan status == SUBMITTED (ERR_INVALID_PLAN_STATE)"]
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /coverage-plans creating a successor (supersedes_plan_id or new current plan), or application withdraw (system)"
        actor: system
        preconditions: []
        side_effects: ["if it was the current plan, application.funding_status -> NONE when it had been COVERAGE_SUBMITTED"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /coverage-plans creating a successor, or application withdraw (system)"
        actor: system
        preconditions: []
        side_effects: ["application.funding_status -> NONE (was COVERAGE_SUBMITTED)"]
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /coverage-plans creating a successor, or application withdraw (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /leave-cycles/{id}/allocate awarding the application (system)"
        actor: system
        preconditions: []
        side_effects: ["application.funding_status -> COVERAGE_CONFIRMED"]
      - from: APPROVED
        to: RELEASED
        trigger: "application withdraw (system)"
        actor: system
        preconditions: []
        side_effects: ["Department.reserved_amount -= provisional_cost; available_amount and posture recomputed"]
      - from: CONFIRMED
        to: SETTLED
        trigger: "grant COMPLETED or CURTAILED (system)"
        actor: system
        preconditions: []
        side_effects:
          - "final_cost computed per calculations.coverage_cost (full or pro-rated)"
          - "Department.reserved_amount -= provisional_cost; Department.spent_amount += final_cost; available_amount and posture recomputed"
          - "application.funding_status -> COVERAGE_SETTLED"
      - from: CONFIRMED
        to: RELEASED
        trigger: "grant CANCELLED before activation (system)"
        actor: system
        preconditions: []
        side_effects: ["Department.reserved_amount -= provisional_cost; spent_amount unchanged; posture recomputed", "application.funding_status -> COVERAGE_RELEASED"]

  - entity: LeaveGrant
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CURTAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /leave-grants/{id}/activate"
        actor: LeaveAdministrator
        preconditions:
          - "grant status == SCHEDULED (ERR_INVALID_GRANT_STATE)"
          - "clock >= grant.start_date (ERR_GRANT_START_NOT_REACHED)"
          - "faculty status == ACTIVE (ERR_INVALID_FACULTY_STATE)"
          - "no overlapping ACTIVE grant for this faculty (ERR_LEAVE_WINDOW_OVERLAP)"
          - "department active-leave capacity per calculations.department_leave_capacity (ERR_DEPARTMENT_LEAVE_CAPACITY)"
        side_effects:
          - "gross_salary, fellowship_offset_total, net_salary computed per calculations.award_salary_cost"
          - "each VERIFIED fellowship passing the 50% overlap rule -> APPLIED with applied_offset (created_at ASC stacking, cap 50% of gross)"
          - "FacultyMember.status -> ON_LEAVE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /leave-grants/{id}/complete"
        actor: LeaveAdministrator
        preconditions:
          - "grant status == ACTIVE (ERR_INVALID_GRANT_STATE)"
          - "clock >= grant.end_date (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "actual_months = duration_semesters*6; FacultyMember.status -> ACTIVE"
          - "HOP 1: CONFIRMED CoveragePlan -> SETTLED with final_cost = provisional_cost"
          - "HOP 2 (caused by HOP 1): Department.reserved_amount -= provisional_cost, spent_amount += final_cost, available_amount recomputed"
          - "HOP 3 (caused by HOP 2): Department.posture recomputed and persisted (may flip FROZEN -> CONSTRAINED/OPEN, re-enabling plan submissions)"
          - "SABBATICAL and PROFESSIONAL only: create ServiceObligation IN_PROGRESS (required_months = actual_months, last_credited_month = month before end month); SABBATICAL and PROFESSIONAL only: create AccomplishmentReport DUE (due_date = end_date + 90 days)"
          - "application.funding_status -> COVERAGE_SETTLED"
      - from: ACTIVE
        to: CURTAILED
        trigger: "POST /leave-grants/{id}/curtail"
        actor: LeaveAdministrator
        preconditions:
          - "grant status == ACTIVE (ERR_INVALID_GRANT_STATE)"
          - "start_date < actual_return_date < end_date and clock >= actual_return_date (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "actual_months = whole calendar months between start_date and actual_return_date (floor, min 1); end_date := actual_return_date; FacultyMember.status -> ACTIVE"
          - "RESTORE ledger entry +(planned_months - actual_months)*6 credits"
          - "CoveragePlan (sabbatical) -> SETTLED with final_cost = round(provisional_cost * actual_months / planned_months, 2); department buckets + posture recomputed"
          - "SABBATICAL and PROFESSIONAL: create ServiceObligation IN_PROGRESS with required_months = actual_months; NO AccomplishmentReport on curtailment"
          - "application.funding_status -> COVERAGE_SETTLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (faculty separation, or MEDICAL-approval overlap cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "RESTORE ledger entry +(36 * duration_semesters) credits (sabbatical only)"
          - "CONFIRMED CoveragePlan -> RELEASED; department buckets + posture recomputed"
          - "application -> RESCINDED, funding_status -> COVERAGE_RELEASED; VERIFIED fellowships -> DECLINED"

  - entity: ExternalFellowship
    initial_state: REPORTED
    terminal_states: [APPLIED, DECLINED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /external-fellowships/{id}/verify"
        actor: LeaveAdministrator
        preconditions:
          - "fellowship status == REPORTED (ERR_INVALID_FELLOWSHIP_STATE)"
          - "overlap days with the application's proposed window >= 50% of the window's days, computed with half-open intervals (ERR_FELLOWSHIP_OVERLAP_INSUFFICIENT)"
        side_effects: []
      - from: REPORTED
        to: DECLINED
        trigger: "POST /external-fellowships/{id}/decline"
        actor: Faculty
        preconditions: ["caller owns the fellowship (ERR_NOT_RESOURCE_OWNER)", "status IN {REPORTED, VERIFIED} (ERR_INVALID_FELLOWSHIP_STATE)"]
        side_effects: []
      - from: VERIFIED
        to: DECLINED
        trigger: "POST /external-fellowships/{id}/decline, or system on grant cancellation"
        actor: Faculty
        preconditions: ["caller owns the fellowship"]
        side_effects: []
      - from: VERIFIED
        to: APPLIED
        trigger: "system at grant activation"
        actor: system
        preconditions: ["50% overlap rule re-evaluated against the grant window"]
        side_effects: ["applied_offset set per calculations.fellowship_offset"]

  - entity: ServiceObligation
    initial_state: IN_PROGRESS
    terminal_states: [FULFILLED, BREACHED]
    transitions:
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system during POST /accrual-runs"
        actor: system
        preconditions: ["fulfilled_months >= required_months after crediting"]
        side_effects: []
      - from: IN_PROGRESS
        to: BREACHED
        trigger: "system on faculty separation"
        actor: system
        preconditions: []
        side_effects: ["create RepaymentObligation ACTIVE with chronological amortized amount_owed"]

  - entity: RepaymentObligation
    initial_state: ACTIVE
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /repayment-obligations/{id}/payments bringing amount_outstanding to 0"
        actor: LeaveAdministrator
        preconditions: ["status IN {ACTIVE, DEFAULTED} (ERR_INVALID_REPAYMENT_STATE)", "OCC expected_repayment_version matches (ERR_STALE_VERSION)"]
        side_effects: ["RepaymentObligation.version += 1"]
      - from: DEFAULTED
        to: SETTLED
        trigger: "POST /repayment-obligations/{id}/payments bringing amount_outstanding to 0"
        actor: LeaveAdministrator
        preconditions: ["OCC expected_repayment_version matches (ERR_STALE_VERSION)"]
        side_effects: ["RepaymentObligation.version += 1"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system sweep on POST /_clock/set_current_utc and lazy evaluation on read"
        actor: system
        preconditions: ["clock > due_date and amount_outstanding > 0"]
        side_effects: []
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /repayment-obligations/{id}/waive"
        actor: ProvostOffice
        preconditions: ["status IN {ACTIVE, DEFAULTED} (ERR_INVALID_REPAYMENT_STATE)"]
        side_effects: ["amount_outstanding := 0", "RepaymentObligation.version += 1"]
      - from: DEFAULTED
        to: WAIVED
        trigger: "POST /repayment-obligations/{id}/waive"
        actor: ProvostOffice
        preconditions: []
        side_effects: ["amount_outstanding := 0", "RepaymentObligation.version += 1"]

  - entity: AccomplishmentReport
    initial_state: DUE
    terminal_states: [ACCEPTED]
    transitions:
      - from: DUE
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc and lazy evaluation on read"
        actor: system
        preconditions: ["clock > due_date"]
        side_effects: ["while any report of a faculty is OVERDUE, accrual runs skip that faculty and new application submissions are rejected (ERR_OVERDUE_REPORT_BLOCKS)"]
      - from: DUE
        to: SUBMITTED
        trigger: "POST /accomplishment-reports/{id}/submit"
        actor: Faculty
        preconditions: ["caller owns the report (ERR_NOT_RESOURCE_OWNER)", "status IN {DUE, OVERDUE, REVISION_REQUIRED} (ERR_INVALID_REPORT_STATE)"]
        side_effects: ["submitted_at := clock; submitted_late := false"]
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /accomplishment-reports/{id}/submit"
        actor: Faculty
        preconditions: ["caller owns the report"]
        side_effects: ["submitted_at := clock; submitted_late := true (sticky)"]
      - from: REVISION_REQUIRED
        to: SUBMITTED
        trigger: "POST /accomplishment-reports/{id}/submit"
        actor: Faculty
        preconditions: ["caller owns the report"]
        side_effects: ["submitted_at := clock; submitted_late unchanged"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accomplishment-reports/{id}/review with decision=ACCEPTED"
        actor: ProvostOffice
        preconditions: ["report status == SUBMITTED (ERR_INVALID_REPORT_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /accomplishment-reports/{id}/review with decision=REJECTED"
        actor: ProvostOffice
        preconditions: ["report status == SUBMITTED (ERR_INVALID_REPORT_STATE)"]
        side_effects: ["decision_comments recorded"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: coverage-plan-create-stale-application
    parent_entity: LeaveApplication
    write_endpoint: "POST /coverage-plans"
    occ_field: "expected_application_version"
    description: |
      Creating a CoveragePlan for a LeaveApplication whose version has advanced
      since the caller last observed it is rejected. Creating a plan mutates the
      application (supersedes the prior non-terminal plan and re-points
      current_coverage_plan_id, incrementing LeaveApplication.version), so a
      writer holding a stale version would otherwise supersede a plan it never
      saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: repayment-payment-stale-version
    parent_entity: RepaymentObligation
    write_endpoint: "POST /repayment-obligations/{id}/payments"
    occ_field: "expected_repayment_version"
    description: |
      Recording a payment against a RepaymentObligation whose version has
      advanced since the caller last observed it is rejected. A payment reduces
      amount_outstanding and increments RepaymentObligation.version; a second
      legitimate partial payment must be issued against the fresh version, so a
      stale expected version indicates the caller's view of the balance is out
      of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: service_credit_accrual
    trigger: "POST /accrual-runs; also read by GET /faculty-members/{id}/eligibility"
    algorithm: chronological
    formula: |
      through_month = calendar month before the clock's current month
      for each FacultyMember (created_at ASC processing order):
        for each whole month m in (last_accrued_month, through_month]:
          covered = exists a LeaveGrant of this faculty with status IN {ACTIVE, COMPLETED, CURTAILED}
                    whose half-open window [start_date, end_date) contains the first day of m
          blocked = any AccomplishmentReport of this faculty has status == OVERDUE (evaluated at run time)
          separated = faculty.status == SEPARATED (evaluated at run time)
          if NOT covered AND NOT blocked AND NOT separated:
            write AccrualLedgerEntry(EARN, +1, month=m)
          # months not earned (leave-covered, OVERDUE-blocked, or separated) are NEVER backfilled
        last_accrued_month := through_month
      lifetime_service_months = SUM(credits_delta where entry_type == EARN) + SUM(credits_delta where entry_type == ADJUST AND affects_lifetime)
      credit_balance = SUM(credits_delta over all entries)
    input_set: "All FacultyMember rows; per-faculty months strictly after last_accrued_month up to and including the month before the clock month"
    constants:
      MIN_CERTIFIED_SERVICE_MONTHS: 72
      SABBATICAL_CREDIT_COST_PER_SEMESTER: 36
      CREDIT_RESTORE_PER_UNUSED_MONTH: 6
    precision: "integer months"
    variants:
      - name: certified
        when: "authoritative gate at POST /leave-applications/{id}/submit"
        difference: "counts only ledger EARN months already accrued (chronological actuals)"
      - name: provisional
        when: "GET /faculty-members/{id}/eligibility preview"
        difference: "forward-looking: certified months + whole months from the month after last_accrued_month through the month before proposed_start_date, assuming continued ACTIVE status; identical data can yield eligible_provisional=true while eligible_certified=false"

  - name: award_salary_cost
    trigger: "POST /leave-grants/{id}/activate"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned, resolves the offset-cap circularity):
      1. gross_salary = round(annual_base_salary * (salary_pct / 100) * (duration_semesters * 6 / 12), 2)
      2. offset_cap = round(gross_salary * MAX_FELLOWSHIP_OFFSET_PCT, 2)
      3. fellowship_offset_total = calculations.fellowship_offset over VERIFIED fellowships, capped by offset_cap
      4. net_salary = gross_salary - fellowship_offset_total
      Allowed (duration, pct) tiers: SABBATICAL 1 sem -> {100}; 2 sem -> {50, 75}; PROFESSIONAL -> 100; MEDICAL/PERSONAL -> 0 (gross 0).
    input_set: "the activating LeaveGrant + applicant FacultyMember.annual_base_salary + fellowships with status == VERIFIED linked to the application"
    constants:
      SEMESTER_MONTHS: 6
      MAX_FELLOWSHIP_OFFSET_PCT: 0.50
    precision: "2 decimal places, round_half_up"

  - name: fellowship_offset
    trigger: "POST /leave-grants/{id}/activate (invoked by award_salary_cost); overlap re-check"
    algorithm: waterfall_allocation
    formula: |
      eligible = fellowships with status == VERIFIED AND overlap_days(fellowship window, grant window) * 2 >= grant_window_days   # >= 50%, half-open day counts
      remaining_cap = round(gross_salary * 0.50, 2)
      for f in eligible ORDER BY created_at ASC (ties impossible: timestamps unique at 3 fractional digits):
        f.applied_offset = min(f.amount, remaining_cap); remaining_cap -= f.applied_offset; f -> APPLIED
      fellowship_offset_total = SUM(applied_offset)
    input_set: "ExternalFellowship rows of the application with status == VERIFIED at activation"
    constants:
      FELLOWSHIP_MIN_OVERLAP_RATIO: 0.50
    precision: "2 decimal places, round_half_up"

  - name: committee_composite_score
    trigger: "POST /committee-reviews/{id}/submit (and read during allocation)"
    algorithm: weighted_scoring
    formula: |
      ROUNDING ORDER PINNED: per review, round each weighted product to 2dp BEFORE summing:
        weighted_total = round(0.45*scholarly_merit, 2) + round(0.35*curriculum_benefit, 2) + round(0.20*feasibility, 2)   (round_half_up per product)
      input_set = CommitteeReview of the application with status == SUBMITTED only
      if count >= DROP_LOWEST_MIN_REVIEWS: discard ONE review with the minimum weighted_total (equal minima are interchangeable; sum is identical)
      composite_score = round(SUM(weighted_total over kept reviews) / COUNT(kept), 2)
      quorum_met = (count >= REVIEW_QUORUM)
    input_set: "SUBMITTED CommitteeReviews of one LeaveApplication; DRAFT reviews excluded"
    constants:
      WEIGHT_MERIT: 0.45
      WEIGHT_CURRICULUM: 0.35
      WEIGHT_FEASIBILITY: 0.20
      REVIEW_QUORUM: 3
      DROP_LOWEST_MIN_REVIEWS: 4
    precision: "2 decimal places, round_half_up"

  - name: allocation_ranking
    trigger: "POST /leave-cycles/{id}/allocate"
    algorithm: threshold
    formula: |
      candidates = LeaveApplications of the cycle with leave_type == SABBATICAL AND status == UNDER_REVIEW
      ranked = candidates with quorum_met, ORDER BY composite_score DESC, applicant lifetime_service_months DESC, application created_at ASC
      final_rank assigned 1..N over ranked
      for each candidate in evaluation order (quorum gate first, then plan, then credits, then quota):
        1. NOT quorum_met                       -> NOT_AWARDED / INCOMPLETE_REVIEWS
        2. no current CoveragePlan with status == APPROVED -> NOT_AWARDED / NO_APPROVED_COVERAGE
        3. applicant credit_balance < 36 * requested_duration_semesters -> NOT_AWARDED / INSUFFICIENT_CREDITS
        4. awarded_count >= award_quota         -> NOT_AWARDED / QUOTA_EXCEEDED
        else -> AWARDED (grant created, plan CONFIRMED, CONSUME posted); awarded_count += 1
    input_set: "cycle's sabbatical applications with status == UNDER_REVIEW at allocate time"
    constants:
      SABBATICAL_CREDIT_COST_PER_SEMESTER: 36
    precision: "ranks are integers; boundary rule: final_rank <= award_quota is awardable (rank exactly == quota IS awarded)"

  - name: coverage_cost
    trigger: "CoveragePlan approval (provisional reservation); grant completion/curtailment (final settlement)"
    algorithm: forward_looking
    formula: |
      provisional_cost = courses_to_cover * REPLACEMENT_COST_PER_COURSE          # reserved at APPROVED
      final_cost (COMPLETED)  = provisional_cost
      final_cost (CURTAILED)  = round(provisional_cost * actual_months / planned_months, 2)   # planned = duration_semesters*6
    input_set: "the CoveragePlan attached to the completing/curtailing grant's application"
    constants:
      REPLACEMENT_COST_PER_COURSE: 8000.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "plan approval: reserves courses * 8000.00 from the department"
        difference: "forward-looking: assumes full duration"
      - name: final
        when: "grant settlement"
        difference: "chronological: pro-rated by actual months served; identical plan data yields final < provisional whenever the leave is curtailed, the difference released back to available_amount"

  - name: department_posture
    trigger: "any mutation of Department.reserved_amount / spent_amount / replacement_pool (approve, settle, release, PATCH pool)"
    algorithm: threshold
    formula: |
      compared with exact integer cross-multiplication (no floats):
      FROZEN     iff 100 * (reserved_amount + spent_amount) >= 95 * replacement_pool
      CONSTRAINED iff 100 * (reserved_amount + spent_amount) >= 70 * replacement_pool
      OPEN       otherwise
      Boundary pins: utilization exactly 0.70 IS CONSTRAINED; exactly 0.95 IS FROZEN.
      reserved_amount = SUM(provisional_cost) over plans of this department with status IN {APPROVED, CONFIRMED}
      spent_amount    = SUM(final_cost) over plans of this department with status == SETTLED
      available_amount = replacement_pool - reserved_amount - spent_amount   (invariant: pool == reserved + spent + available)
    input_set: "CoveragePlans of the department in the status sets above"
    constants:
      POSTURE_CONSTRAINED_THRESHOLD: 0.70
      POSTURE_FROZEN_THRESHOLD: 0.95
    precision: "exact rational comparison via cross-multiplication"

  - name: department_leave_capacity
    trigger: "POST /leave-grants/{id}/activate"
    algorithm: interval_merge
    formula: |
      for each calendar day d in the half-open grant window [start_date, end_date):
        active_on_d = count of OTHER LeaveGrants with status == ACTIVE whose departments match and whose [start, end) contains d
        if active_on_d >= DEPT_MAX_ACTIVE_LEAVES for any d: reject ERR_DEPARTMENT_LEAVE_CAPACITY
      Adjacent windows (end == another's start) do NOT overlap (half-open semantics).
    input_set: "ACTIVE LeaveGrants of faculty whose department_id == applicant's department_id"
    constants:
      DEPT_MAX_ACTIVE_LEAVES: 2
    precision: "whole-day half-open intervals"

  - name: obligation_fulfillment
    trigger: "POST /accrual-runs"
    algorithm: chronological
    formula: |
      through_month = month before the clock month
      for each ServiceObligation IN_PROGRESS whose faculty status == ACTIVE:
        credit +1 fulfilled_months per whole month in (last_credited_month, through_month]
        last_credited_month := through_month
        if fulfilled_months >= required_months: obligation -> FULFILLED
      months while faculty is ON_LEAVE or SEPARATED are skipped permanently (watermark advances)
      projected_liability (read-time, GET endpoints) = round(base * (required - fulfilled) / required, 2), base = grant.net_salary + plan final_cost
    input_set: "ServiceObligation rows with status == IN_PROGRESS"
    precision: "integer months; 2 decimal places for projected_liability"

  - name: repayment_amortization
    trigger: "ServiceObligation -> BREACHED (creates RepaymentObligation)"
    algorithm: chronological
    formula: |
      base_amount = grant.net_salary + plan.final_cost
      monthly_forgiveness = round(base_amount / required_months, 2)
      amount_owed = base_amount - monthly_forgiveness * fulfilled_months_at_breach     # chronological amortization, canonical
    input_set: "the breached ServiceObligation, its LeaveGrant, and the grant application's SETTLED CoveragePlan"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: chronological_actual
        when: "authoritative at breach (RepaymentObligation.amount_owed)"
        difference: "per-month rounded amortization unit multiplied by fulfilled months"
      - name: proportional_projected
        when: "ServiceObligation.projected_liability while IN_PROGRESS"
        difference: "round(base * unfulfilled / required, 2); differs from the chronological figure whenever base/required is not exact (e.g. 100000.00 over 6 months, 2 fulfilled: 66666.66 chronological vs 66666.67 proportional)"

  - name: credit_ledger_invariant
    trigger: "every AccrualLedgerEntry write"
    algorithm: aggregation
    formula: |
      credit_balance == SUM(credits_delta over ALL entries)
      lifetime_service_months == SUM(credits_delta where entry_type == EARN OR (entry_type == ADJUST AND affects_lifetime))
      CONSUME (-36*semesters at award) followed by RESTORE (+36*semesters at cancel, or +(unused*6) at curtail) MUST leave credit_balance exactly as before the CONSUME pair's net; lifetime_service_months is unchanged by CONSUME/RESTORE.
    input_set: "AccrualLedgerEntry rows of one faculty"
    precision: "integer credit-months"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: business_constraint
    check: "Request shape: required fields present, enums in range, numbers in domain (courses_to_cover 1..40, amounts > 0), pagination limit 1..100 / offset >= 0"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_PAGINATION"
    http_status: 400
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Role is listed in the endpoint's roles (RBAC)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right (department, faculty, cycle, application, review, plan, grant, fellowship, obligation, repayment, report)"
    error_id: "ERR_DEPARTMENT_NOT_FOUND / ERR_FACULTY_NOT_FOUND / ERR_CYCLE_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_REVIEW_NOT_FOUND / ERR_COVERAGE_PLAN_NOT_FOUND / ERR_GRANT_NOT_FOUND / ERR_FELLOWSHIP_NOT_FOUND / ERR_OBLIGATION_NOT_FOUND / ERR_REPAYMENT_NOT_FOUND / ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: auth
    check: "Ownership / segregation of duties: Faculty acts only on own applications, reports, fellowships; CommitteeMember acts only on own reviews; chair matches the plan's department; reviewer != applicant AND reviewer.department_id != applicant.department_id (ERR_REVIEWER_CONFLICT); plan creator != applicant (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_NOT_RESOURCE_OWNER / ERR_CHAIR_DEPARTMENT_MISMATCH / ERR_REVIEWER_CONFLICT / ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "mutating endpoints on owned resources; POST /committee-reviews; POST /coverage-plans"
  - priority: 6
    category: state
    check: "OCC: expected_application_version == LeaveApplication.version; expected_repayment_version == RepaymentObligation.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coverage-plans; POST /repayment-obligations/{id}/payments"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the transition (cycle DRAFT/OPEN/CLOSED/ALLOCATED gates incl. ERR_CYCLE_NOT_OPEN / ERR_CYCLE_NOT_CLOSED / ERR_CYCLE_NOT_ALLOCATED / ERR_INVALID_CYCLE_STATE; application/review/plan/grant/fellowship/obligation/repayment/report state gates; faculty not SEPARATED)"
    error_id: "ERR_INVALID_*_STATE family"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: business_referential
    check: "Related-entity gates: no AccomplishmentReport of the faculty with status == OVERDUE (ERR_OVERDUE_REPORT_BLOCKS); no RepaymentObligation of the faculty with status == DEFAULTED (ERR_DEFAULTED_REPAYMENT_BLOCKS)"
    error_id: "ERR_OVERDUE_REPORT_BLOCKS / ERR_DEFAULTED_REPAYMENT_BLOCKS"
    http_status: 409
    applies_to: "POST /leave-applications/{id}/submit"
  - priority: 9
    category: business_constraint
    check: "Uniqueness/eligibility constraints: no OTHER application of the same faculty has status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} (ERR_DUPLICATE_ACTIVE_APPLICATION; resubmission of the same application never counts as its own duplicate); one review per (reviewer, application) in any status (ERR_DUPLICATE_REVIEW); sabbatical lifetime_service_months >= 72 (ERR_INSUFFICIENT_SERVICE_MONTHS); (duration, salary_pct) combination allowed (ERR_INVALID_DURATION_SALARY_COMBO); cycle_id required iff SABBATICAL (ERR_INVALID_REQUEST)"
    error_id: "ERR_DUPLICATE_ACTIVE_APPLICATION / ERR_DUPLICATE_REVIEW / ERR_INSUFFICIENT_SERVICE_MONTHS / ERR_INVALID_DURATION_SALARY_COMBO / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /leave-applications, POST /leave-applications/{id}/submit, POST /committee-reviews"
  - priority: 10
    category: business_temporal
    check: "Window/temporal rules: end == start + semesters*6 months and end > start (ERR_INVALID_DATE_RANGE); no overlap with the faculty's ACTIVE grants using half-open [start, end) — adjacency allowed (ERR_LEAVE_WINDOW_OVERLAP); fellowship overlap days * 2 >= leave window days (ERR_FELLOWSHIP_OVERLAP_INSUFFICIENT); clock >= grant.start_date at activation (ERR_GRANT_START_NOT_REACHED); curtail date strictly inside the window; department active-leave day-count < 2 (ERR_DEPARTMENT_LEAVE_CAPACITY)"
    error_id: "ERR_INVALID_DATE_RANGE / ERR_LEAVE_WINDOW_OVERLAP / ERR_FELLOWSHIP_OVERLAP_INSUFFICIENT / ERR_GRANT_START_NOT_REACHED / ERR_DEPARTMENT_LEAVE_CAPACITY"
    http_status: 422
    applies_to: "POST /leave-applications, submit, decide, fellowship create/verify, grant activate/complete/curtail"
  - priority: 11
    category: business_fiscal
    check: "Money gates: credit_balance >= 36*semesters at sabbatical submit (ERR_INSUFFICIENT_SABBATICAL_CREDITS); department posture != FROZEN at plan submit/approve (ERR_DEPARTMENT_FROZEN); available_amount >= provisional_cost at approve (ERR_INSUFFICIENT_COVERAGE_BUDGET); payment amount <= amount_outstanding (ERR_PAYMENT_EXCEEDS_OUTSTANDING); PATCH pool >= reserved + spent (ERR_POOL_BELOW_COMMITMENTS)"
    error_id: "ERR_INSUFFICIENT_SABBATICAL_CREDITS / ERR_DEPARTMENT_FROZEN / ERR_INSUFFICIENT_COVERAGE_BUDGET / ERR_PAYMENT_EXCEEDS_OUTSTANDING / ERR_POOL_BELOW_COMMITMENTS"
    http_status: 402
    applies_to: "submit, POST /coverage-plans/{id}/submit, approve, payments, PATCH /departments/{id}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; the default sits at/before every fixture date. Setting the clock triggers the OVERDUE/DEFAULTED sweep."
    roles: [LeaveAdministrator]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["DUE reports past due_date -> OVERDUE; ACTIVE repayments past due_date with outstanding > 0 -> DEFAULTED"]

  # --- Department ---
  - method: POST
    path: "/departments"
    description: "Create a department with its replacement-teaching pool"
    roles: [LeaveAdministrator]
    code: 201
    input: ["name", "replacement_pool", "chair_faculty_id?"]
    output: Department
    side_effects: ["reserved_amount=0, spent_amount=0, posture=OPEN, version=1"]
  - method: GET
    path: "/departments"
    description: "List departments"
    roles: [Faculty, CommitteeMember, DepartmentChair, ProvostOffice, LeaveAdministrator]
    code: 200
    input: ["limit?", "offset?", "chair_faculty_id?"]
    output: "Department[]"
    side_effects: []
  - method: GET
    path: "/departments/{id}"
    description: "Get one department (posture, buckets)"
    roles: [Faculty, CommitteeMember, DepartmentChair, ProvostOffice, LeaveAdministrator]
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: PATCH
    path: "/departments/{id}"
    description: "Update name / chair / pool; pool rejected below reserved+spent"
    roles: [LeaveAdministrator]
    code: 200
    input: ["name?", "chair_faculty_id?", "replacement_pool?"]
    output: Department
    side_effects: ["posture recomputed on pool change", "increments Department.version by 1"]

  # --- FacultyMember ---
