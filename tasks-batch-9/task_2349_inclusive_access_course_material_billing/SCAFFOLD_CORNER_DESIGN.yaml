          - errors[ERR_AGREEMENT_NOT_ACTIVATABLE]
          - state_machines.CourseMaterialTitle.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          Activation readiness is a two-part precondition and each part is enforced separately: an
          agreement with no title at all is refused, an agreement whose only ACTIVE title has no
          PricingTier is refused, and an agreement whose only title was WITHDRAWN is refused again
          even though that title still owns a tier.
        test_recipe:
          setup:
            - "PUB-A exists in DRAFT with no titles at all. PUB-B exists in DRAFT with one title T3 that carries one PricingTier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
