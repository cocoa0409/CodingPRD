  - rule_id: transitive_cascade
    instances:
      - name: obligation_spike_cascades_posture_gate_authorization_and_delegate
        grounds:
          - calculations.licensee_obligation_aggregate
          - calculations.permissible_investment_coverage
          - calculations.licensee_coverage_posture
          - state_machines.DelegateAuthorization.PENDING_OVERSIGHT_to_SUSPENDED_BY_POSTURE
          - state_machines.Delegate.ONBOARDING_to_SUSPENDED
          - entities.StateLicense.fields.expansion_gate
        distinguishing_aspect: |
          Depth 5, each link caused strictly by the previous one and by nothing in the request:
          (1) the obligations delta raises Licensee.aggregate_outstanding_obligations_cents to
          85000000, (2) which drops coverage_ratio_bps to 1176, (3) which drops coverage_posture to
          DEFICIENT, (4) which flips StateLicense.expansion_gate to BLOCKED, (5) which moves the
          PENDING_OVERSIGHT authorization to SUSPENDED_BY_POSTURE and thereby the Delegate to
          SUSPENDED with oversight_hold true. The trigger payload names none of links 2-5.
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with one ACTIVE CA license and zero obligations, so coverage_posture is COMPLIANT."
            - "One HELD CASH holding of 10000000 cents."
            - "Delegate 'Sunrise Checks Inc' with one PENDING_OVERSIGHT authorization on the CA license (never activated)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100008", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 250000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 10000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "BankA", book_value_cents: 10000000, market_value_cents: 10000000 }
              as: ComplianceOfficer
            - call: "POST /delegates"
              payload: { licensee_id: "${lic_id}", legal_name: "Sunrise Checks Inc", delegate_type: "AUTHORIZED_DELEGATE" }
              as: LicensingManager
              captures: { del_id: "$.data.id" }
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_id}", state_license_id: "${lic_ca_id}", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-08-31T00:00:00Z", monthly_volume_cap_cents: 5000000 }
