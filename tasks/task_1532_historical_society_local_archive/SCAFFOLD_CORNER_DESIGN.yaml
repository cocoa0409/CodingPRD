            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "x", condition_grade: "GOOD", appraised_value_cents: 100, format: "MAP" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /volunteer-projects", payload: { name: "P1" }, as: VolunteerCoordinator, captures: { p: $.data.id } }
            - { call: "POST /volunteer-projects/${p}/activate", as: VolunteerCoordinator }
            - { call: "POST /volunteer-projects/${p}/tickets", payload: { item_id: "${i}" }, as: VolunteerCoordinator, captures: { t: $.data.id } }
            - { call: "POST /volunteer-projects/${p}/tickets/claim-next", as: Volunteer, as_user_id: "vol_1" }
            - { call: "POST /digitization-tickets/${t}/begin-capture", as: Volunteer, as_user_id: "vol_1" }
            - { call: "POST /digitization-tickets/${t}/submit-qc", as: Volunteer, as_user_id: "vol_1" }
          trigger:
            - { call: "POST /digitization-tickets/${t}/qc-pass", as: Volunteer, as_user_id: "vol_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (${err}) — not ERR_QC_SELF_REVIEW (role check at priority 2 precedes business safety)"

      - name: board_officer_cannot_manage_accessions
        claim_type: rbac_denial
        grounds:
          - roles[BoardOfficer]
        distinguishing_aspect: "BoardOfficer is limited to deaccession votes: creating an accession fails ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - { call: "POST /accessions", payload: { donor_name: "X", donor_contact: "x@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 100 }, as: BoardOfficer, as_user_id: "board_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (${err}), http 403"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_readback_after_create_and_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a created resource reads back identically via GET (same request's data == subsequent read), and cascade mutations from a reading POST are visible on dependent entities with no delay or retry."
        test_recipe:
          setup: ["zone Z, collection C created"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id, zv: $.data.version } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id, ct: $.data.title } }
          trigger:
            - { call: "GET /collections/${c}", as: Researcher, captures: { g1: $.data.title, gv: $.data.version } }
            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T01:00:00Z", temperature_c: 29.0, humidity_pct: 50.0 }, as: SystemAdmin, captures: { post: $.data.posture } }
            - { call: "GET /storage-zones/${z}", as: Registrar, captures: { gpost: $.data.posture, gk: $.data.breach_streak } }
          assert:
            - "GET after create returns the same title (${g1} == ${ct}) and version == 1 (${gv})"
            - "the severe reading (29.0 >= 24.0 + 4.0) flips posture to CLOSED inside the POST response (${post} == CLOSED) and the immediately following GET agrees (${gpost} == CLOSED, breach_streak == 1 ${gk})"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: finding_aid_not_published_gate
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_FINDING_AID_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: make_available_requires_published_finding_aid
          rationale: "Asserted as the failure leg of the named §1.8 instance."

  - section: validations
    instances:
      - name: embargo_gate_on_order_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMBARGO_ACTIVE]
        excluded_because:
          difficulty_instance: repro_order_blocked_by_deed_embargo
          rationale: "Asserted (including the exact-expiry boundary) by the named §1.8 instance."
      - name: capacity_and_double_booking_gates
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPOINTMENT_CAPACITY_EXCEEDED]
          - errors[ERR_ITEM_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: seat_capacity_full_and_half_open_adjacency
          rationale: "Capacity ceiling and half-open adjacency are asserted by the named §1.8 instance; whole-day item double-booking by reading_room_half_open_interval_semantics."
      - name: fragile_item_safety_gate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ITEM_TOO_FRAGILE]
        excluded_because:
          difficulty_instance: fragile_safety_beats_ownership_referential
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: studio_conflict_gate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RECORDING_ROOM_CONFLICT]
        excluded_because:
          difficulty_instance: studio_turnaround_buffer_gap_semantics
          rationale: "Gap 0 / 29 / exactly-30 cases asserted by the named §1.8 instance."
      - name: invoice_state_gate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: invoice_state_error_beats_quota_fiscal
          rationale: "ERR_INVALID_STATE on the invoice endpoint is the asserted winner of the named §1.8 priority-conflict instance."

  # ===========================================================================
  - section: errors
    instances:
      - name: sale_finalize_requires_complete_hammer_prices
        claim_type: violation_to_error
        grounds:
          - calculations.deaccession_proceeds
          - errors[ERR_HAMMER_PRICE_MISSING]
        distinguishing_aspect: "SALE finalize requires exactly one hammer price per proposed item: a partial list fails ERR_HAMMER_PRICE_MISSING and nothing finalizes; the complete list succeeds and proceeds_cents is computed."
        test_recipe:
          setup: ["SALE proposal P over items I1, I2 (both PENDING_CATALOG), approved and COOLED_OFF via clock sweep to 2026-08-31"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i1: $.data.id } }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I2" }, as: Archivist, captures: { i2: $.data.id } }
            - { call: "POST /deaccession-proposals", payload: { item_ids: ["${i1}", "${i2}"], justification: "duplicates", disposal_method: "SALE" }, as: Registrar, as_user_id: "reg_1", captures: { p: $.data.id } }
            - { call: "POST /deaccession-proposals/${p}/submit", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${p}/send-to-board", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${p}/approve", as: BoardOfficer, as_user_id: "board_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /deaccession-proposals/${p}/finalize", payload: { hammer_prices: [ { item_id: "${i1}", price_cents: 999 } ] }, as: Registrar, as_user_id: "reg_1", captures: { e1: $.data.error_id } }
            - { call: "POST /deaccession-proposals/${p}/finalize", payload: { hammer_prices: [ { item_id: "${i1}", price_cents: 999 }, { item_id: "${i2}", price_cents: 555 } ] }, as: Registrar, as_user_id: "reg_1", captures: { fin: $.data.status, proceeds: $.data.proceeds_cents } }
          assert:
            - "partial hammer prices: error_id == ERR_HAMMER_PRICE_MISSING (${e1}); proposal stays COOLED_OFF; items unchanged"
            - "complete prices: FINALIZED (${fin}); proceeds_cents == 1399 (899 + 500) (${proceeds})"
