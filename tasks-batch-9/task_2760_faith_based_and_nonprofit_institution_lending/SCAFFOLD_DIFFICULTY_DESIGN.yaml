              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
