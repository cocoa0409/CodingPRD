        grounds:
          - state_machines.Dependent.TERMINATED_to_REINSTATED
          - state_machines.TerminationNotice.FINAL_to_RESCINDED
          - state_machines.ClaimRecovery.PARTIALLY_RECOVERED_to_VOIDED
          - state_machines.AuditCase.ESCALATED_to_COMPLETE
          - entities.AuditProgram.fields.refund_due_total_cents
          - endpoints[POST /appeals/{id}/decision]
        distinguishing_aspect: |
          A compensating cascade of depth 5 originating from the appeal GRANT transition - a different
          triggering transition from the run-sweep S2 cascade: the dependent's TERMINATED -> REINSTATED move
          causes its notice to be RESCINDED, the rescission causes the PARTIALLY_RECOVERED ClaimRecovery to be
          VOIDED with refund_due_cents = recovered_cents, the void causes the program's recovery_ledger_cents
