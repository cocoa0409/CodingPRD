            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site DR", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset DR", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-01T01:00:00Z", work_order_id: "${wid}" }
              as: Technician
              captures: { did: $.data.id }
          trigger:
            - call: "GET /downtime-events?work_order_id=${wid}"
              as: Planner
              captures: { first_id: "$.data[0].id" }
          assert:
            - "list contains exactly downtime ${did}"
            - "total_count == 1"

      - name: warranty_claims_filtered_by_asset_reverse_reachability
        claim_type: reverse_reachability_get
        grounds: [entities.WarrantyClaim.fields.asset_id, endpoints]
        distinguishing_aspect: "GET /warranty-claims?asset_id={id} returns only claims for that asset (reverse-reachability for WarrantyClaim.asset_id)."
        test_recipe:
          setup: ["one SUBMITTED claim on a closed work order"]
          setup_api_calls:
