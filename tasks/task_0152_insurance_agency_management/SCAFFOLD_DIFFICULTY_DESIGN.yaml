              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LICENSE_NOT_ACTIVE (license EXPIRED at 2026-07-01, expiration_date 2026-06-15)"
            - "Appointment.${appt_id}.status == APPROVED (unchanged)"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (>= 2, different interval semantics + entities)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: license_halfopen_interval_overlap_rejected
        grounds:
          - validations[priority=22]
          - entities.License.fields.effective_date
          - entities.License.fields.expiration_date
          - errors[ERR_LICENSE_OVERLAP]
        distinguishing_aspect: |
          Interval-intersection semantics on the License resource: a new CA AUTO
          license [2025-12-15,2026-12-15) overlaps an existing [2025-01-01,
          2026-01-01) for the same producer/state/LOB -> ERR_LICENSE_OVERLAP. Uses
          half-open intersection arithmetic, distinct from the adjacency rule below.
        test_recipe:
          setup:
