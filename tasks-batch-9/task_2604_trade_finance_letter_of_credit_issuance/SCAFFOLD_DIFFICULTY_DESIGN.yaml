          assert:
            - "CreditFacility.${f1_id}.status == CLOSED"
            - "CreditFacility.${f1_id}.utilisation_posture == FROZEN"
            - "trigger call 1 returns HTTP 409 with error_id == ERR_FACILITY_NOT_ACTIVE"
            - "DocumentaryCredit.${c1_id}.status == APPROVED"
            - "DocumentaryCredit.${c1_id}.committed_allocation_cents == 0"
            - "CreditFacility.${f1_id}.allocated_cents == 0"
            - "trigger call 2 returns HTTP 200"
            - "DocumentaryCredit.${c2_id}.status == ISSUED"
            - "DocumentaryCredit.${c2_id}.chargeable_utilisation_cents == 10025000"
            - "CreditFacility.${f2_id}.status == ACTIVE"
            - "CreditFacility.${f2_id}.allocated_cents == 10025000"
            - "CreditFacility.${f2_id}.available_cents == 39975000"
            - "CreditFacility.${f2_id}.utilisation_posture == OPEN"

