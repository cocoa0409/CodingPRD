      - name: sublicense_create_with_a_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[sublicense-create-stale-agreement]
          - errors.ERR_STALE_AGREEMENT_VERSION
          - state_machines[PropagatorAgreement.status].transitions[PENDING_COUNTERSIGN->ACTIVE]
        distinguishing_aspect: "Here the version is advanced by a STATE TRANSITION rather than by a child write: the countersign moved the agreement from version 1 to 2, so a grant carrying the creation-time version is rejected with 412 ERR_STALE_AGREEMENT_VERSION - the officer must observe the countersignature before sublicensing under it."
