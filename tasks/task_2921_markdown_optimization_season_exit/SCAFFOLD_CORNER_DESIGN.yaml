              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "GET /price-zones/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_zone: $.data.error_id }
            - call: "GET /stores/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_store: $.data.error_id }
            - call: "GET /markdown-steps/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_step: $.data.error_id }
            - call: "GET /zone-executions/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_exec: $.data.error_id }
            - call: "GET /clearance-reservations/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_res: $.data.error_id }
            - call: "GET /allowance-agreements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_agr: $.data.error_id }
            - call: "GET /vendor-claims/00000000-0000-4000-8000-000000000001"
