        claim_type: Conditional validation
        grounds:
          - validations[priority=11]
          - errors[ERR_DUPLICATE_ALLOCATION]
        distinguishing_aspect: "A second create for the same (rider, period_month) when an ACTIVE allocation exists and the OCC version is current still supersedes; this corner asserts the duplicate guard fires only when supersede preconditions are NOT met (handled in §1.8 OCC); here a same-period create with a current version succeeds as a supersede (positive control)."
        excluded_because:
          difficulty_instance: compensating_invariant / reverse_conserves_benefit_consumed_quantity
          rationale: "Duplicate/supersede allocation semantics on (rider, period_month) are exercised by §1.8 OCC and benefit instances; the duplicate-vs-supersede path collapses to the OCC stale-version check asserted there."

      - name: insufficient_funds_alone_returns_402_stub
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_INSUFFICIENT_FUNDS]
        excluded_because:
