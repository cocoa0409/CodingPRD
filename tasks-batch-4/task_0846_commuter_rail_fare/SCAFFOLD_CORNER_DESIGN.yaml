            - "ServiceDisruption.${dis}.delay_minutes == 29"
            - "response data.error_id == ERR_DELAY_BELOW_THRESHOLD"
            - "HTTP status == 422"

      - name: purchase_unknown_fare_product_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FARE_PRODUCT_NOT_FOUND]"]
