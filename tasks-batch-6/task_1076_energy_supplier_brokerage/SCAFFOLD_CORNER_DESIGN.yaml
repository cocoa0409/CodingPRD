# =============================================================================
# task_1076 — §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# Walks references/claim-extraction-guide.md against §1.1–§1.7. Every real
# test_recipe drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_rfp_version_on_quote_submit
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-submit-stale-rfp]
          - endpoints.POST_/quotes
          - entities.Rfp.fields.version
        distinguishing_aspect: |
          Supplier reads Rfp.version, submits quote1 (which bumps Rfp.version),
          then submits quote2 still carrying the previously observed version ->
          ERR_STALE_RFP_VERSION (412). Two strictly-sequential requests, no parallelism.
        test_recipe:
          setup:
            - "RFP OPEN; supplier has captured the Rfp.version and used it once to submit quote1 (version now advanced)."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-20", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /rfps/${rfp_id}", payload: {}, as: Supplier, as_user_id: "${sup_id}", captures: { rfp_v: "$.data.version" } }
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 60, term_months: 12, broker_adder_mills: 5, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { quote1_id: "$.data.id" } }
          trigger:
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 59, term_months: 12, broker_adder_mills: 4, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_RFP_VERSION"
            - "response http_status == 412"

      - name: scheduled_loa_expiry_suspends_account
        claim_type: scheduled_actions
        grounds:
          - state_machines.Authorization.SIGNED_to_EXPIRED
          - state_machines.UtilityAccount.ANY_to_SUSPENDED
          - endpoints.POST_/operations/run-scheduled
        distinguishing_aspect: |
          A SIGNED LOA whose expires_at (2026-05-05) is before the clock (advanced
          to 2026-05-10) becomes EXPIRED on run-scheduled, and the previously
          VERIFIED account with no other SIGNED LOA becomes SUSPENDED.
        test_recipe:
          setup:
            - "VERIFIED account under a SIGNED LOA expiring 2026-05-05; clock advanced to 2026-05-10."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-21", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2026-05-05T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /operations/run-scheduled", payload: {}, as: OpsAdmin }
          assert:
            - "Authorization.${loa_id}.status == EXPIRED"
            - "UtilityAccount.${acct_id}.status == SUSPENDED"

      - name: cascade_loa_revocation_depth3
        claim_type: cascading_side_effects
        grounds: [state_machines.Authorization.SIGNED_to_REVOKED]
        excluded_because:
          difficulty_instance: transitive_cascade / loa_revoke_suspends_account_cancels_rfp_voids_quote
          rationale: "The depth-3 LOA-revoke cascade is fully asserted by that §1.8 instance."

      - name: dual_variant_commission_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.actual_commission_trueup]
        excluded_because:
          difficulty_instance: dual_variant_calc / commission_estimated_vs_actual_trueup
          rationale: "Estimated-vs-actual commission divergence is asserted by that §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sign_already_signed_loa_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Authorization.DRAFT_to_SIGNED]
        distinguishing_aspect: "Signing a LOA already in SIGNED returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A SIGNED LOA on an account."]
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-22", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Authorization.${loa_id}.status == SIGNED"

      - name: rfp_best_and_final_with_no_quotes
        claim_type: precondition_enforcement
        grounds: ["state_machines.Rfp.OPEN_to_BEST_AND_FINAL", "errors[ERR_NO_QUOTES]"]
        distinguishing_aspect: "Moving an OPEN RFP with zero quotes to BEST_AND_FINAL returns ERR_NO_QUOTES."
        test_recipe:
          setup: ["An OPEN RFP with no quotes."]
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-23", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
          trigger:
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "BEST_AND_FINAL" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NO_QUOTES"
            - "Rfp.${rfp_id}.status == OPEN"

      - name: rfp_open_loa_scope_usage_only_insufficient
        claim_type: precondition_enforcement
        grounds: ["state_machines.Rfp.DRAFT_to_OPEN", "errors[ERR_LOA_SCOPE_INSUFFICIENT]"]
        distinguishing_aspect: "Opening an RFP whose account has only a USAGE_ONLY signed LOA returns ERR_LOA_SCOPE_INSUFFICIENT (even though account is VERIFIED)."
        test_recipe:
          setup: ["VERIFIED account whose only SIGNED LOA has scope USAGE_ONLY."]
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-24", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_ONLY", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
          trigger:
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_LOA_SCOPE_INSUFFICIENT"
            - "Rfp.${rfp_id}.status == DRAFT"

      - name: dr_activate_requires_account_enrolled
        claim_type: precondition_enforcement
        grounds: ["state_machines.DemandResponseEnrollment.ENROLLED_to_ACTIVE", "errors[ERR_ACCOUNT_NOT_ENROLLED]"]
        distinguishing_aspect: "Activating a DR enrollment on a non-ENROLLED account returns ERR_ACCOUNT_NOT_ENROLLED."
        test_recipe:
          setup: ["An ENROLLED DR row on an account that has no ACTIVE supply contract (account still PENDING_LOA)."]
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-25", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /dr-enrollments", payload: { account_id: "${acct_id}", program_name: "Summer DR", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", committed_kw: 50, incentive_per_kw_cents: 4500 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { dr_id: "$.data.id" } }
          trigger:
            - { call: "POST /dr-enrollments/${dr_id}/activate", payload: {}, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ENROLLED"
            - "DemandResponseEnrollment.${dr_id}.status == ENROLLED"

      - name: rfp_cycle_reopen_covered
        claim_type: valid_transition
        grounds: [state_machines.Rfp.BEST_AND_FINAL_to_OPEN]
        excluded_because:
          difficulty_instance: non_linear_state_machine / rfp_cycle_best_and_final_then_reopen
          rationale: "The BEST_AND_FINAL->OPEN cycle is asserted by that §1.8 instance."

      - name: contract_branch_reject_covered
        claim_type: valid_transition
        grounds: [state_machines.Contract.PENDING_CUSTOMER_to_REJECTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / contract_branch_customer_reject
          rationale: "The reject branch and its side effects are asserted by that §1.8 instance."

      - name: contract_expiry_via_run_scheduled
        claim_type: side_effect_execution
        grounds: [state_machines.Contract.ACTIVE_to_EXPIRED, endpoints.POST_/operations/run-scheduled]
        distinguishing_aspect: "An ACTIVE contract whose end_date (2027-07-01) is at/before the clock (2027-07-02) becomes EXPIRED on run-scheduled."
        test_recipe:
          setup: ["ACTIVE contract start 2026-07-01 term 12 (end 2027-07-01); LOA expires 2028; clock at 2027-07-02."]
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr One", email: "m1@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr1_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-26", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /rfps/${rfp_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_v: "$.data.version" } }
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 60, term_months: 12, broker_adder_mills: 5, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/shortlist", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts", payload: { rfp_id: "${rfp_id}", account_id: "${acct_id}", estimated_annual_usage_kwh: 60000, start_date: "2026-07-01T00:00:00Z", requested_switch_date: "2026-07-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { contract_id: "$.data.id" } }
            - { call: "POST /contracts/${contract_id}/customer-decision", payload: { decision: "ACCEPT" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /contracts/${contract_id}/approve", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
            - { call: "POST /contracts/${contract_id}/submit-enrollment", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts/${contract_id}/enrollment-result", payload: { result: "CONFIRM" }, as: OpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-02T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /operations/run-scheduled", payload: {}, as: OpsAdmin }
          assert:
            - "Contract.${contract_id}.status == EXPIRED"

      - name: renew_active_contract_creates_successor
        claim_type: side_effect_execution
        grounds: [state_machines.Contract.ACTIVE_to_RENEWED, entities.Contract.fields.renewed_from_contract_id]
        distinguishing_aspect: "Renewing inside the window sets the original to RENEWED and creates a successor Contract whose renewed_from_contract_id points at the original (self-referential FK)."
        test_recipe:
          setup: ["ACTIVE contract with renewal_window_open true (clock 2027-05-02, run-scheduled opened it)."]
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr One", email: "m1@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr1_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-27", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
