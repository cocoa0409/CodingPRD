  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_disburse_stale_fund_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disburse-stale-fund]", "errors[ERR_STALE_FUND_VERSION]"]
        distinguishing_aspect: "After a first disbursement bumps ProjectFund.version, a second create still carrying the earlier expected_fund_version is rejected with ERR_STALE_FUND_VERSION (412)."
        test_recipe:
          setup: ["Certified funded district; a registered SENIOR bond; f_ver captured before the first disbursement."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "OccF TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
            - call: "POST /obligations/${ob_id}/disbursements"
              payload: { amount_cents: 1000000, disbursement_tax_year: 2026, expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
          trigger:
            - call: "POST /obligations/${ob_id}/disbursements"
              payload: { amount_cents: 1000000, disbursement_tax_year: 2026, expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_FUND_VERSION"
            - "response HTTP status == 412"

      - name: occ_register_stale_district_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[register-stale-district]", "errors[ERR_STALE_DISTRICT_VERSION]"]
        distinguishing_aspect: "After registering obligation A bumps TifDistrict.version, registering obligation B with the pre-A expected_district_version is rejected with ERR_STALE_DISTRICT_VERSION (412)."
        test_recipe:
          setup: ["Certified district; two submitted BOND obligations obA and obB; d_ver captured at certify (before any register)."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "OccD TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
