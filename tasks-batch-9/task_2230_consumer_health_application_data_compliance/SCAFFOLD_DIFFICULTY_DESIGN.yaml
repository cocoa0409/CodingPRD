              payload: { app_product_id: "${prod_id}", applicability_assessment_id: "${asmt_id}", version_label: "v1", specificity_mode: "ELEMENT_LEVEL", disclosed_category_count: 1, disclosed_purpose_count: 2, disclosed_third_party_count: 1, named_third_party_count: 1, effective_from: "2026-09-01", expected_app_product_version: "${prod_v}" }
              as: PrivacyOfficer
