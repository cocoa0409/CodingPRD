# =============================================================================
# task_2956 — Physician Practice Acquisition & Integration
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2956. Physician Practice Acquisition & Integration (health system practice
  acquisition team): target valuation with fair market value and commercial
  reasonableness opinions, physician compensation model design compliant with
  referral prohibitions, asset versus equity structure with liability assumption
  and malpractice tail coverage, payer contract novation and re-credentialing
  lead time planning, electronic health record migration and legacy record
  retention, staff transition offers, benefits harmonization and retention
  bonuses, provider-based billing conversion and patient notification, day-one
  operational readiness checklist and post-close performance tracking

domain_name: practice-acquisition-integration

# Flat topology: every collection is a root-level path, so the api_prefix is the
# root itself. Child entities carry foreign keys in the request body and are
# discovered through filtered list endpoints, never through nested URL segments.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer collections at the root. Acquisition is the aggregate anchor but
  # is referenced by FK (`acquisition_id`) rather than by URL nesting; several
  # children carry two or three FKs at once (CredentialingPackage,
  # PerformanceReport), which a strict hierarchy could not express.

  state_machine_shape: cyclic
  # Acquisition.deal_status cycles BOARD_REVIEW -> DILIGENCE -> BOARD_REVIEW;
  # CompensationPlan.status cycles SUBMITTED -> DRAFT -> SUBMITTED with a
  # bounded return counter; EhrMigrationBatch cycles LOADED -> FAILED -> STAGED
  # with a bounded retry counter and a branching evaluate-outcome transition.
  # Acquisition additionally carries a second, independent state dimension
  # (compliance_clearance) that evolves independently of deal_status, plus a
  # third derived dimension (readiness_posture) computed from ReadinessTask
  # children.

  relationship_patterns:
    - one_to_many          # Acquisition -> Physician / PayerContract / ...
    - many_to_many         # CredentialingPackage joins Physician x PayerContract
    - cross_aggregate      # PerformanceReport references Acquisition, Physician and CompensationPlan
    - polymorphic: false

  role_model: segregation_of_duties
  # ValuationAnalyst prepares opinions but cannot accept them; CompensationDesigner
  # designs compensation but cannot approve it; ComplianceOfficer accepts and
  # approves but can author neither; and the individual ComplianceOfficer user who
  # accepted the pinned FMV opinion is barred from approving compensation plans on
  # that same acquisition.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 48 endpoints / 46 error codes / 47 ordered validation rules /
  # 18 calculations (2 dual-variant, 3 distinct combinatorial modes) / 11 state machines.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Acquisition
    parent: null
    common_fields: true
    fields:
      - { name: target_practice_name, type: string, source: input, description: "Legal name of the target physician practice" }
      - { name: specialty, type: enum, source: input, description: "Dominant specialty of the practice; selects the compensation survey benchmark table", constraints: "PRIMARY_CARE | CARDIOLOGY | ORTHOPEDICS | ONCOLOGY" }
      - { name: structure, type: enum, source: input, description: "Deal structure decision; governs which LiabilityItem dispositions are legal", constraints: "ASSET | EQUITY" }
      - { name: malpractice_policy_form, type: enum, source: input, description: "Form of the target practice's professional liability policy", constraints: "CLAIMS_MADE | OCCURRENCE" }
      - { name: annual_malpractice_premium_cents, type: integer, source: input, description: "Target practice's current annual malpractice premium, in cents", constraints: ">= 0" }
      - { name: tail_coverage_months, type: integer, source: input, default: 0, description: "Months of prior-acts (tail) coverage the buyer will purchase", constraints: ">= 0 and <= 120" }
      - { name: tail_coverage_required, type: boolean, source: computed, description: "true when malpractice_policy_form == CLAIMS_MADE, false when OCCURRENCE" }
      - { name: tail_premium_cents, type: integer, source: computed, description: "Output of calculations.malpractice_tail_premium; 0 when tail_coverage_required is false" }
      - { name: trailing_annual_collections_cents, type: integer, source: input, description: "Trailing twelve month practice collections, in cents", constraints: ">= 0" }
      - { name: target_close_on, type: string, source: input, description: "Planned closing date; the deadline every CredentialingPackage lead-time check measures against", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: required_staff_headcount, type: integer, source: input, description: "Non-physician headcount the day-one plan requires", constraints: ">= 1" }
      - { name: retention_pool_total_cents, type: integer, source: input, description: "Total retention-bonus pool authorised for staff transition offers, in cents", constraints: ">= 0" }
      - { name: retention_pool_committed_cents, type: integer, source: computed, description: "Sum of retention_bonus_cents over StaffTransitionOffer rows with status IN {EXTENDED, ACCEPTED}" }
      - { name: retention_pool_available_cents, type: integer, source: computed, description: "= retention_pool_total_cents - retention_pool_committed_cents" }
      - { name: escrow_total_cents, type: integer, source: input, description: "Total indemnity escrow funded at signing, in cents", constraints: ">= 0" }
      - { name: escrow_committed_cents, type: integer, source: computed, description: "Sum of escrowed_amount_cents over LiabilityItem rows with disposition == ESCROWED" }
      - { name: escrow_available_cents, type: integer, source: computed, description: "= escrow_total_cents - escrow_committed_cents" }
      - { name: deal_status, type: enum, source: system, description: "Workflow dimension of the deal lifecycle", constraints: "SOURCING | DILIGENCE | BOARD_REVIEW | SIGNED | CLOSED | ABANDONED" }
      - { name: compliance_clearance, type: enum, source: system, description: "Second, independent state dimension tracking regulatory clearance; evolves independently of deal_status", constraints: "PENDING | CLEARED | FLAGGED | SUSPENDED" }
      - { name: readiness_posture, type: enum, source: computed, description: "Third dimension, derived from the acquisition's ReadinessTask children by calculations.acquisition_readiness_posture", constraints: "BLOCKED | AT_RISK | READY" }
      - { name: purchase_price_cents, type: integer, source: computed, default: null, description: "concluded_value_cents of the pinned FMV ValuationOpinion; null until the deal reaches BOARD_REVIEW, reset to null when BOARD_REVIEW returns to DILIGENCE" }
      - { name: integration_reserve_cents, type: integer, source: computed, default: null, description: "Step 2 of calculations.deal_net_consideration" }
      - { name: gross_consideration_cents, type: integer, source: computed, default: null, description: "Step 3 of calculations.deal_net_consideration" }
      - { name: synergy_credit_bps, type: integer, source: computed, default: null, description: "Step 4 tier of calculations.deal_net_consideration, keyed on gross_consideration_cents" }
      - { name: synergy_credit_cents, type: integer, source: computed, default: null, description: "Step 4 amount of calculations.deal_net_consideration" }
      - { name: net_consideration_cents, type: integer, source: computed, default: null, description: "Step 5 of calculations.deal_net_consideration" }
      - { name: hr_staffing_coverage_pct, type: number, source: computed, default: 0, description: "Output of calculations.hr_staffing_coverage; two decimal places" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which deal_status became CLOSED, ISO 8601 UTC with three fractional digits" }
      - { name: abandoned_reason, type: string, source: system, default: null, description: "Free text supplied on the transition into ABANDONED" }

  - name: Physician
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal this physician joins" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier", constraints: "exactly 10 decimal digits; unique across all Physician rows" }
      - { name: full_name, type: string, source: input, description: "Physician legal name" }
      - { name: specialty, type: enum, source: input, description: "Physician specialty; selects the compensation survey benchmark table for this physician's plans", constraints: "PRIMARY_CARE | CARDIOLOGY | ORTHOPEDICS | ONCOLOGY" }
      - { name: board_certified, type: boolean, source: input, default: false, description: "Board certification on file" }
      - { name: state_license_expires_on, type: string, source: input, description: "State medical license expiry date", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: employment_status, type: enum, source: computed, description: "Derived from this physician's CompensationPlan rows: EMPLOYED when one is EXECUTED, OFFERED when one is APPROVED, DECLINED when the most recently created plan is WITHDRAWN, otherwise PROSPECTIVE", constraints: "PROSPECTIVE | OFFERED | EMPLOYED | DECLINED" }

  - name: ValuationOpinion
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal this opinion values" }
      - { name: opinion_type, type: enum, source: input, description: "Which of the two independent opinions this row records", constraints: "FMV | COMMERCIAL_REASONABLENESS" }
      - { name: method, type: enum, source: input, description: "Valuation method; selects the variant of calculations.fmv_concluded_value", constraints: "INCOME_APPROACH | MARKET_APPROACH | NARRATIVE" }
      - { name: normalized_ebitda_cents, type: integer, source: input, default: null, description: "Normalized annual EBITDA of the practice, in cents; required for opinion_type FMV" }
      - { name: projection_years, type: integer, source: input, default: null, description: "Explicit forecast horizon in whole years; required for method INCOME_APPROACH", constraints: "1..5" }
      - { name: ebitda_growth_bps, type: integer, source: input, default: null, description: "Annual EBITDA growth rate in basis points; required for method INCOME_APPROACH" }
      - { name: discount_rate_bps, type: integer, source: input, default: null, description: "Discount rate in basis points; required for method INCOME_APPROACH", constraints: "must be strictly greater than terminal_growth_bps" }
      - { name: terminal_growth_bps, type: integer, source: input, default: null, description: "Terminal growth rate in basis points; required for method INCOME_APPROACH" }
      - { name: market_multiple_bps, type: integer, source: input, default: null, description: "EBITDA multiple in basis points (65000 == 6.5x); required for method MARKET_APPROACH" }
      - { name: cr_conclusion, type: enum, source: input, default: null, description: "Commercial reasonableness conclusion; required for opinion_type COMMERCIAL_REASONABLENESS", constraints: "REASONABLE | NOT_REASONABLE" }
      - { name: concluded_value_cents, type: integer, source: computed, description: "Output of calculations.fmv_concluded_value; exactly 0 for opinion_type COMMERCIAL_REASONABLENESS" }
      - { name: independence_attested, type: boolean, source: input, description: "Valuer has attested independence from the acquiring health system" }
      - { name: effective_on, type: string, source: input, description: "Valuation date of the opinion", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: expires_on, type: string, source: computed, description: "= effective_on plus OPINION_VALIDITY_MONTHS calendar months, same day-of-month" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the ValuationAnalyst who created the row" }
      - { name: accepted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who accepted the opinion; the segregation-of-duties check reads this field" }
      - { name: status, type: enum, source: system, description: "Opinion lifecycle", constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: is_pinned, type: boolean, source: computed, default: false, description: "true only for the single FMV opinion pinned when deal_status entered BOARD_REVIEW" }

  - name: CompensationPlan
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal this plan belongs to" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; the physician this plan compensates" }
      - { name: model_type, type: enum, source: input, description: "Compensation model; selects the benchmark_basis variant", constraints: "STRAIGHT_SALARY | WRVU_PRODUCTIVITY | BASE_PLUS_INCENTIVE" }
      - { name: base_salary_cents, type: integer, source: input, default: 0, description: "Annual guaranteed base salary, in cents", constraints: ">= 0" }
      - { name: conversion_factor_cents_per_wrvu, type: integer, source: input, default: 0, description: "Cents paid per work RVU", constraints: ">= 0" }
      - { name: threshold_wrvu, type: integer, source: input, default: 0, description: "Annual wRVU threshold above which the conversion factor applies (BASE_PLUS_INCENTIVE only)", constraints: ">= 0" }
      - { name: projected_annual_wrvu, type: integer, source: input, default: 0, description: "Projected annual work RVU volume", constraints: ">= 0" }
      - { name: includes_referral_credit, type: boolean, source: input, default: false, description: "Whether any component of the model varies with the volume or value of designated health service referrals; true is categorically prohibited" }
      - { name: stark_exception, type: enum, source: input, description: "Referral-prohibition exception relied upon", constraints: "BONA_FIDE_EMPLOYMENT | PERSONAL_SERVICE_ARRANGEMENT | NONE" }
      - { name: fmv_justification_on_file, type: boolean, source: input, default: false, description: "A written above-90th-percentile fair market value justification is on file" }
      - { name: projected_total_cash_comp_cents, type: integer, source: computed, description: "Output of calculations.projected_total_cash_comp" }
      - { name: comp_per_wrvu_cents, type: integer, source: computed, description: "= round_half_up(projected_total_cash_comp_cents / projected_annual_wrvu); 0 when projected_annual_wrvu == 0" }
      - { name: benchmark_basis, type: enum, source: computed, description: "Variant selector of calculations.compensation_benchmark_percentile: COMP_PER_WRVU when model_type == WRVU_PRODUCTIVITY, otherwise TOTAL_CASH_COMP", constraints: "TOTAL_CASH_COMP | COMP_PER_WRVU" }
      - { name: benchmark_percentile, type: number, source: computed, description: "Output of calculations.compensation_benchmark_percentile; two decimal places" }
      - { name: actual_ytd_wrvu, type: integer, source: computed, default: 0, description: "Running accumulator over this physician's PerformanceReport rows" }
      - { name: months_elapsed, type: integer, source: computed, default: 0, description: "Count of PerformanceReport rows folded into actual_ytd_wrvu" }
      - { name: comp_true_up_cents, type: integer, source: computed, default: 0, description: "Output of calculations.comp_true_up; negative values are clawbacks" }
      - { name: returned_count, type: integer, source: computed, default: 0, description: "Number of times this plan has been returned from SUBMITTED to DRAFT; bounds the revision cycle at MAX_PLAN_RETURNS" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle with a bounded revision cycle", constraints: "DRAFT | SUBMITTED | APPROVED | EXECUTED | COMPLIANCE_HOLD | SUPERSEDED | WITHDRAWN" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who approved the plan" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which the physician executed the plan, ISO 8601 UTC with three fractional digits" }

  - name: PayerContract
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal whose payer agreement this is" }
      - { name: payer_name, type: string, source: input, description: "Payer legal name; the overlap-interval grouping key together with acquisition_id" }
      - { name: payer_type, type: enum, source: input, description: "Payer category; selects PAYER_LEAD_DAYS and RETRO_BILLING_WINDOW_DAYS", constraints: "COMMERCIAL | MANAGED_MEDICARE | MEDICARE | MEDICAID" }
      - { name: contract_form, type: enum, source: input, description: "Whether the agreement is assignable by its own terms or requires a fresh paper", constraints: "ASSIGNABLE | CONSENT_REQUIRED | NON_ASSIGNABLE" }
      - { name: notice_days_required, type: integer, source: input, description: "Contractual notice period in days the payer must be given", constraints: ">= 0" }
      - { name: effective_on, type: string, source: input, description: "First day of the contract term; the closed overlap interval's lower endpoint", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: terminates_on, type: string, source: input, description: "Last day of the contract term; the closed overlap interval's upper endpoint", constraints: "ISO-8601 calendar date YYYY-MM-DD; must be >= effective_on" }
      - { name: annual_revenue_share_bps, type: integer, source: input, description: "Share of practice collections flowing through this payer, in basis points", constraints: "0..10000" }
      - { name: committee_slots_per_cycle, type: integer, source: input, default: 2, description: "How many credentialing packages this payer's committee will seat in one cycle", constraints: ">= 1" }
      - { name: notice_sent_on, type: string, source: system, default: null, description: "Logical-clock date on which novation notice was sent" }
      - { name: consent_received_on, type: string, source: system, default: null, description: "Logical-clock date on which payer consent was recorded" }
      - { name: novation_status, type: enum, source: system, description: "Novation workflow with a branching remediation path", constraints: "NOT_REQUESTED | NOTICE_SENT | CONSENT_RECEIVED | DENIED | NEW_AGREEMENT_PENDING | NOVATED | TERMINATED" }

  - name: CredentialingPackage
    parent: Physician
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; denormalised deal scope, must match both the physician's and the contract's acquisition_id" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; the provider being re-credentialed" }
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; the payer that must credential the provider" }
      - { name: submitted_on, type: string, source: input, description: "Date the package will be filed with the payer; drives every lead-time computation", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: lead_days, type: integer, source: computed, description: "PAYER_LEAD_DAYS lookup on the linked contract's payer_type" }
      - { name: committee_cycle_key, type: string, source: computed, description: "Output of calculations.credentialing_committee_cycle_key: the earliest committee meeting date on or after submitted_on, as YYYY-MM-DD" }
      - { name: projected_effective_on, type: string, source: computed, description: "Output of calculations.credentialing_projected_effective_date" }
      - { name: retro_billing_allowed, type: boolean, source: computed, description: "true when RETRO_BILLING_WINDOW_DAYS for the payer_type is greater than 0" }
      - { name: status, type: enum, source: system, description: "Credentialing lifecycle", constraints: "DRAFT | SUBMITTED | IN_REVIEW | APPROVED | DENIED | WITHDRAWN" }

  - name: EhrMigrationBatch
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal whose charts are migrating" }
      - { name: batch_label, type: string, source: input, description: "Human label for the batch", constraints: "unique within one acquisition_id" }
      - { name: source_system, type: enum, source: input, description: "Legacy system the charts are extracted from", constraints: "ATHENA | ECLINICALWORKS | PAPER_CHART" }
      - { name: chart_type, type: enum, source: input, description: "Kind of record in the batch; selects the statutory retention base", constraints: "STRUCTURED | IMAGING | SCANNED_DOCUMENT" }
      - { name: record_count, type: integer, source: input, description: "Number of records staged in the batch", constraints: ">= 0" }
      - { name: contains_minor_records, type: boolean, source: input, default: false, description: "Whether any record belongs to a patient who is still a minor" }
      - { name: youngest_patient_age_years, type: integer, source: input, default: null, description: "Age in whole years of the youngest patient in the batch; required when contains_minor_records is true", constraints: "0..17" }
      - { name: last_encounter_on, type: string, source: input, description: "Date of the most recent clinical encounter represented in the batch", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: validated_count, type: integer, source: computed, default: 0, description: "Records that reconciled against the legacy extract; reset to 0 when the batch is requeued" }
      - { name: defect_count, type: integer, source: computed, default: 0, description: "Records that failed reconciliation; reset to 0 when the batch is requeued" }
      - { name: unprocessed_count, type: integer, source: computed, description: "= record_count - validated_count - defect_count; the conserved remainder" }
      - { name: match_rate_bps, type: integer, source: computed, default: 0, description: "Output of calculations.ehr_reconciliation_match_rate" }
      - { name: retention_years, type: integer, source: computed, description: "Output of calculations.legacy_retention_years" }
      - { name: legacy_purge_eligible_on, type: string, source: computed, description: "= last_encounter_on plus retention_years calendar years, same month and day-of-month" }
      - { name: retry_count, type: integer, source: computed, default: 0, description: "Number of times this batch has been requeued after failing; bounds the cycle at MAX_MIGRATION_RETRIES" }
      - { name: status, type: enum, source: system, description: "Migration lifecycle with a bounded failure/requeue cycle and a branching outcome", constraints: "STAGED | EXTRACTED | LOADED | RECONCILED | FAILED | ABORTED" }

  - name: StaffTransitionOffer
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal this staff member transitions into" }
      - { name: staff_member_name, type: string, source: input, description: "Staff member legal name" }
      - { name: role_code, type: enum, source: input, description: "Non-physician job code; selects ROLE_UPLIFT_BPS, SYSTEM_PAY_SCALE_MIN_CENTS and criticality", constraints: "MA | RN | FRONT_DESK | BILLER | PRACTICE_MANAGER" }
      - { name: legacy_annual_wage_cents, type: integer, source: input, description: "Annual wage at the target practice, in cents", constraints: ">= 0" }
      - { name: legacy_pto_hours, type: integer, source: input, default: 0, description: "Accrued but unused paid-time-off hours carried from the target practice", constraints: ">= 0" }
      - { name: credited_service_months, type: integer, source: input, default: 0, description: "Months of prior service credited for benefits harmonisation; selects the retention_bonus_award service tier band (TIER_UNDER_1YR_BPS / TIER_1_TO_5YR_BPS / TIER_5_TO_10YR_BPS / TIER_OVER_10YR_BPS)", constraints: ">= 0" }
      - { name: uplift_component_cents, type: integer, source: computed, description: "Step 1 of calculations.staff_offer_wage_harmonization, rounded independently" }
      - { name: pto_component_cents, type: integer, source: computed, description: "Step 2 of calculations.staff_offer_wage_harmonization, rounded independently" }
      - { name: wage_floor_applied, type: boolean, source: computed, description: "true when the system pay-scale minimum displaced the harmonised sum" }
      - { name: offered_annual_wage_cents, type: integer, source: computed, description: "Step 4 of calculations.staff_offer_wage_harmonization" }
      - { name: retention_bonus_cents, type: integer, source: computed, description: "Output of calculations.retention_bonus_award" }
      - { name: offer_expires_on, type: string, source: input, description: "Last date the staff member may accept", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: extended_on, type: string, source: system, default: null, description: "Logical-clock date on which the offer was extended" }
      - { name: accepted_on, type: string, source: system, default: null, description: "Logical-clock date on which the offer was accepted" }
      - { name: status, type: enum, source: system, description: "Offer lifecycle", constraints: "DRAFT | EXTENDED | ACCEPTED | DECLINED | RESCINDED | EXPIRED" }

  - name: BillingConversion
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal whose site is converting" }
      - { name: site_name, type: string, source: input, description: "Practice site being converted" }
      - { name: conversion_type, type: enum, source: input, description: "Post-close billing status of the site", constraints: "PROVIDER_BASED_DEPARTMENT | FREESTANDING_CLINIC" }
      - { name: required_notice_count, type: integer, source: input, description: "Patients who must receive a written notice of the billing change", constraints: ">= 1" }
      - { name: notified_patient_count, type: integer, source: input, default: 0, description: "Patients actually notified" }
      - { name: notices_issued_on, type: string, source: input, default: null, description: "Date the notices went out; required to leave NOT_STARTED", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: effective_on, type: string, source: input, description: "Date the new billing status takes effect", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: notice_lead_days, type: integer, source: computed, description: "= effective_on - notices_issued_on in whole days; null while notices_issued_on is null" }
      - { name: notice_coverage_bps, type: integer, source: computed, default: 0, description: "Output of calculations.patient_notice_coverage" }
      - { name: provider_based_uplift_bps, type: integer, source: computed, description: "PROVIDER_BASED_UPLIFT_BPS when conversion_type == PROVIDER_BASED_DEPARTMENT, otherwise 0" }
      - { name: attested_on, type: string, source: system, default: null, description: "Logical-clock date on which provider-based criteria were attested" }
      - { name: status, type: enum, source: system, description: "Conversion lifecycle", constraints: "NOT_STARTED | ATTESTED | NOTICES_ISSUED | CONVERTED | WITHDRAWN" }

  - name: ReadinessTask
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal whose day-one checklist this row belongs to" }
      - { name: task_code, type: enum, source: input, description: "Which day-one checklist line this row is", constraints: "HR_STAFFING_PLAN | PAYER_CREDENTIALING | IT_DATA_MIGRATION | REVENUE_CYCLE_GO_LIVE | COMPLIANCE_TRAINING | PATIENT_NOTIFICATION; unique within one acquisition_id" }
      - { name: domain, type: enum, source: computed, description: "Functional owner derived from task_code: HR_STAFFING_PLAN -> HR, PAYER_CREDENTIALING -> REVENUE_CYCLE, IT_DATA_MIGRATION -> IT, REVENUE_CYCLE_GO_LIVE -> REVENUE_CYCLE, COMPLIANCE_TRAINING -> COMPLIANCE, PATIENT_NOTIFICATION -> CLINICAL", constraints: "HR | REVENUE_CYCLE | IT | COMPLIANCE | CLINICAL" }
      - { name: is_blocking, type: boolean, source: input, default: true, description: "Whether this task gates the close; only blocking tasks feed readiness_posture" }
      - { name: due_on, type: string, source: input, description: "Date the task must be complete by", constraints: "ISO-8601 calendar date YYYY-MM-DD" }
      - { name: waiver_justification, type: string, source: system, default: null, description: "Written justification captured when the task is waived" }
      - { name: failure_reason, type: string, source: system, default: null, description: "Reason captured when the task fails, whether by operator action or by cascade" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded the terminal outcome" }
      - { name: status, type: enum, source: system, description: "Checklist line lifecycle with a remediation cycle", constraints: "OPEN | IN_PROGRESS | COMPLETE | WAIVED | FAILED" }

  - name: LiabilityItem
    parent: Acquisition
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the deal whose liability schedule this row belongs to" }
      - { name: category, type: enum, source: input, description: "Nature of the exposure; together with Acquisition.structure it determines which dispositions are legal", constraints: "MALPRACTICE_TAIL | PAYER_REFUND_EXPOSURE | EQUIPMENT_LEASE | UNPAID_PTO | STARK_SELF_DISCLOSURE" }
      - { name: description, type: string, source: input, description: "Narrative description of the exposure" }
      - { name: estimated_amount_cents, type: integer, source: input, description: "Best estimate of the exposure, in cents", constraints: ">= 0" }
      - { name: indemnity_cap_cents, type: integer, source: input, default: null, description: "Seller indemnity cap; required to select disposition INDEMNIFIED", constraints: ">= 0" }
      - { name: disposition, type: enum, source: system, description: "How the exposure is allocated between buyer and seller", constraints: "UNASSIGNED | ASSUMED | EXCLUDED | INDEMNIFIED | ESCROWED" }
      - { name: escrowed_amount_cents, type: integer, source: computed, default: 0, description: "Amount held against Acquisition.escrow_total_cents while disposition == ESCROWED; exactly 0 in every other disposition" }
      - { name: disposition_note, type: string, source: system, default: null, description: "Note captured on the disposition decision" }

  - name: PerformanceReport
    parent: Acquisition
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-generated identifier" }
      - { name: created_at, type: datetime, source: system, description: "Logical-clock instant of insertion, ISO 8601 UTC with three fractional digits" }
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; the closed deal being tracked" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; the physician whose period is being reported" }
      - { name: applied_comp_plan_id, type: string, source: input, description: "FK -> CompensationPlan.id; the executed plan the period is measured against" }
      - { name: period_start_on, type: string, source: input, description: "First day of the reporting period", constraints: "ISO-8601 calendar date YYYY-MM-DD; must be the first day of a calendar month" }
      - { name: period_end_on, type: string, source: input, description: "Last day of the reporting period", constraints: "ISO-8601 calendar date YYYY-MM-DD; must be the last day of the same calendar month as period_start_on" }
      - { name: actual_wrvu, type: integer, source: input, description: "Work RVUs actually generated in the period", constraints: ">= 0" }
      - { name: actual_collections_cents, type: integer, source: input, description: "Collections actually posted in the period, in cents", constraints: ">= 0" }
      - { name: true_up_applied_cents, type: integer, source: computed, description: "Snapshot of the plan's comp_true_up_cents after this report was folded in" }
      - { name: benchmark_percentile_after, type: number, source: computed, description: "Snapshot of the plan's benchmark_percentile after this report was folded in; two decimal places" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Acquisition
    field: deal_status
    initial_state: SOURCING
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: SOURCING
        to: DILIGENCE
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status DILIGENCE"
        actor: DealLead
        preconditions:
          - "at least one Physician row exists for the acquisition"
        side_effects:
          - "recomputes Acquisition.readiness_posture"
      - from: DILIGENCE
        to: BOARD_REVIEW
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status BOARD_REVIEW"
        actor: DealLead
        preconditions:
          - "exactly one ValuationOpinion with opinion_type FMV is in status ACCEPTED"
          - "at least one ValuationOpinion with opinion_type COMMERCIAL_REASONABLENESS is in status ACCEPTED with cr_conclusion REASONABLE, else ERR_COMMERCIAL_REASONABLENESS_NOT_ESTABLISHED"
          - "the ACCEPTED FMV opinion's expires_on is not before the current logical date, else ERR_VALUATION_OPINION_EXPIRED"
          - "when Acquisition.tail_coverage_required is true, tail_coverage_months >= TAIL_MIN_MONTHS, else ERR_TAIL_COVERAGE_INSUFFICIENT"
        side_effects:
          - "sets is_pinned true on the ACCEPTED FMV opinion"
          - "sets Acquisition.purchase_price_cents from the pinned opinion's concluded_value_cents"
          - "runs calculations.malpractice_tail_premium and stores tail_premium_cents"
          - "runs calculations.deal_net_consideration and stores integration_reserve_cents, gross_consideration_cents, synergy_credit_bps, synergy_credit_cents and net_consideration_cents"
      - from: BOARD_REVIEW
        to: DILIGENCE
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status DILIGENCE"
        actor: DealLead
        preconditions:
          - "no CompensationPlan on the acquisition is in status EXECUTED"
        side_effects:
          - "sets is_pinned false on the pinned FMV opinion"
          - "clears purchase_price_cents, integration_reserve_cents, gross_consideration_cents, synergy_credit_bps, synergy_credit_cents and net_consideration_cents back to null"
          - "returns every CompensationPlan in status SUBMITTED to DRAFT and increments each one's returned_count by 1"
      - from: BOARD_REVIEW
        to: SIGNED
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status SIGNED"
        actor: DealLead
        preconditions:
          - "every Physician on the acquisition has a CompensationPlan in status APPROVED or EXECUTED, else ERR_COMP_PLAN_MISSING"
          - "no LiabilityItem on the acquisition is in disposition UNASSIGNED, else ERR_LIABILITY_UNASSIGNED"
          - "when Acquisition.tail_coverage_required is true, Acquisition.escrow_total_cents >= Acquisition.tail_premium_cents, else ERR_TAIL_RESERVE_INSUFFICIENT"
          - "Acquisition.compliance_clearance is CLEARED"
        side_effects:
          - "recomputes Acquisition.readiness_posture"
      - from: SIGNED
        to: CLOSED
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status CLOSED"
        actor: DealLead
        preconditions:
          - "Acquisition.readiness_posture is READY, else ERR_READINESS_NOT_READY"
          - "every PayerContract on the acquisition is in novation_status NOVATED or TERMINATED, else ERR_PAYER_NOVATION_INCOMPLETE"
          - "every EhrMigrationBatch on the acquisition is in status RECONCILED or ABORTED, else ERR_MIGRATION_INCOMPLETE"
          - "every CompensationPlan in status APPROVED has been executed, i.e. at least one plan per Physician is in status EXECUTED, else ERR_NO_EXECUTED_COMP_PLAN"
          - "Acquisition.compliance_clearance is CLEARED"
        side_effects:
          - "sets Acquisition.closed_at to the current logical instant"
          - "sets every ValuationOpinion in status DRAFT or SUBMITTED to SUPERSEDED"
      - from: SOURCING
        to: ABANDONED
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status ABANDONED"
        actor: DealLead
        preconditions: []
        side_effects:
          - "stores abandoned_reason from the request"
      - from: DILIGENCE
        to: ABANDONED
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status ABANDONED"
        actor: DealLead
        preconditions: []
        side_effects:
          - "stores abandoned_reason from the request"
          - "sets every ValuationOpinion in status DRAFT or SUBMITTED to SUPERSEDED"
          - "sets every StaffTransitionOffer in status EXTENDED to RESCINDED and releases its retention_bonus_cents from retention_pool_committed_cents"
      - from: BOARD_REVIEW
        to: ABANDONED
        trigger: "POST /acquisitions/{acquisitionId}/status with target_status ABANDONED"
        actor: DealLead
        preconditions:
          - "no CompensationPlan on the acquisition is in status EXECUTED"
        side_effects:
          - "stores abandoned_reason from the request"
          - "sets every ValuationOpinion in status DRAFT or SUBMITTED to SUPERSEDED"
          - "sets every StaffTransitionOffer in status EXTENDED to RESCINDED and releases its retention_bonus_cents from retention_pool_committed_cents"

  - entity: Acquisition
    field: compliance_clearance
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "no CompensationPlan on the acquisition is in status COMPLIANCE_HOLD"
          - "no CompensationPlan on the acquisition has includes_referral_credit true"
        side_effects: []
      - from: CLEARED
        to: FLAGGED
        trigger: "POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance FLAGGED, or the cascade from POST /performance-reports"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "returns every CompensationPlan in status SUBMITTED to DRAFT and increments each one's returned_count by 1"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "no CompensationPlan on the acquisition is in status COMPLIANCE_HOLD"
        side_effects: []
      - from: FLAGGED
        to: SUSPENDED
        trigger: "POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance SUSPENDED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets every StaffTransitionOffer in status DRAFT to RESCINDED"
      - from: SUSPENDED
        to: FLAGGED
        trigger: "POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance FLAGGED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: PENDING
        to: FLAGGED
        trigger: "POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance FLAGGED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: ValuationOpinion
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /valuation-opinions/{opinionId}/status with target_status SUBMITTED"
        actor: ValuationAnalyst
        preconditions:
          - "the caller's X-User-ID equals ValuationOpinion.prepared_by_user_id, else ERR_NOT_PLAN_OWNER"
          - "ValuationOpinion.independence_attested is true, else ERR_VALUER_INDEPENDENCE_NOT_ATTESTED"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /valuation-opinions/{opinionId}/status with target_status DRAFT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /valuation-opinions/{opinionId}/status with target_status ACCEPTED"
        actor: ComplianceOfficer
        preconditions:
          - "the caller's X-User-ID differs from ValuationOpinion.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "ValuationOpinion.expires_on is not before the current logical date, else ERR_VALUATION_OPINION_EXPIRED"
          - "no other ValuationOpinion on the same acquisition_id with the same opinion_type is already in status ACCEPTED"
        side_effects:
          - "stores the caller's X-User-ID in ValuationOpinion.accepted_by_user_id"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /valuation-opinions/{opinionId}/status with target_status REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "the caller's X-User-ID differs from ValuationOpinion.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "POST /valuation-opinions/{opinionId}/status with target_status SUPERSEDED"
        actor: ComplianceOfficer
        preconditions:
          - "ValuationOpinion.is_pinned is false"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "cascade from the Acquisition transitions into CLOSED or ABANDONED"
        actor: DealLead
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "cascade from the Acquisition transitions into CLOSED or ABANDONED"
        actor: DealLead
        preconditions: []
        side_effects: []

  - entity: CompensationPlan
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compensation-plans/{planId}/status with target_status SUBMITTED"
        actor: CompensationDesigner
        preconditions:
          - "CompensationPlan.includes_referral_credit is false, else ERR_REFERRAL_LINKED_COMPENSATION"
          - "CompensationPlan.stark_exception is not NONE, else ERR_STARK_EXCEPTION_REQUIRED"
          - "the linked Physician's state_license_expires_on is not before the current logical date, else ERR_PHYSICIAN_LICENSE_EXPIRED"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /compensation-plans/{planId}/status with target_status DRAFT, or the cascade from POST /performance-reports and from the Acquisition compliance_clearance CLEARED -> FLAGGED transition"
        actor: ComplianceOfficer
        preconditions:
          - "CompensationPlan.returned_count is less than MAX_PLAN_RETURNS"
        side_effects:
          - "increments CompensationPlan.returned_count by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /compensation-plans/{planId}/status with target_status DRAFT once returned_count has reached MAX_PLAN_RETURNS"
        actor: ComplianceOfficer
        preconditions:
          - "CompensationPlan.returned_count equals MAX_PLAN_RETURNS"
        side_effects:
          - "increments CompensationPlan.returned_count by 1"
          - "recomputes the linked Physician's employment_status"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /compensation-plans/{planId}/status with target_status APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "a ValuationOpinion with opinion_type FMV on the same acquisition is in status ACCEPTED with is_pinned true, else ERR_FMV_OPINION_NOT_ACCEPTED"
          - "the caller's X-User-ID differs from the pinned FMV opinion's accepted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "CompensationPlan.benchmark_percentile is not greater than FMV_SAFE_HARBOR_PERCENTILE unless fmv_justification_on_file is true, else ERR_COMP_EXCEEDS_FMV_SAFE_HARBOR"
          - "the pinned FMV opinion's expires_on is not before the current logical date, else ERR_VALUATION_OPINION_EXPIRED"
        side_effects:
          - "stores the caller's X-User-ID in CompensationPlan.approved_by_user_id"
          - "recomputes the linked Physician's employment_status to OFFERED"
          - "sets any other CompensationPlan for the same physician_id in status EXECUTED to SUPERSEDED"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /compensation-plans/{planId}/status with target_status EXECUTED"
        actor: PracticePhysician
        preconditions:
          - "the caller's resolved Physician id equals CompensationPlan.physician_id, else ERR_NOT_PLAN_OWNER"
          - "the parent Acquisition.deal_status is BOARD_REVIEW, SIGNED or CLOSED"
        side_effects:
          - "sets CompensationPlan.executed_at to the current logical instant"
          - "recomputes the linked Physician's employment_status to EMPLOYED"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /compensation-plans/{planId}/status with target_status WITHDRAWN"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes the linked Physician's employment_status"
      - from: EXECUTED
        to: COMPLIANCE_HOLD
        trigger: "POST /compensation-plans/{planId}/status with target_status COMPLIANCE_HOLD, or the cascade from POST /performance-reports when the recomputed benchmark_percentile exceeds FMV_SAFE_HARBOR_PERCENTILE without fmv_justification_on_file"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets the parent Acquisition.compliance_clearance to FLAGGED when it is currently CLEARED"
      - from: COMPLIANCE_HOLD
        to: EXECUTED
        trigger: "POST /compensation-plans/{planId}/status with target_status EXECUTED"
        actor: ComplianceOfficer
        preconditions:
          - "CompensationPlan.benchmark_percentile is not greater than FMV_SAFE_HARBOR_PERCENTILE, or fmv_justification_on_file is true, else ERR_COMP_EXCEEDS_FMV_SAFE_HARBOR"
        side_effects: []
      - from: COMPLIANCE_HOLD
        to: SUPERSEDED
        trigger: "POST /compensation-plans/{planId}/status with target_status SUPERSEDED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes the linked Physician's employment_status"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /compensation-plans/{planId}/status with target_status WITHDRAWN"
        actor: CompensationDesigner
        preconditions: []
        side_effects:
          - "recomputes the linked Physician's employment_status"

  - entity: PayerContract
    field: novation_status
    initial_state: NOT_REQUESTED
    terminal_states: [NOVATED, TERMINATED]
    transitions:
      - from: NOT_REQUESTED
        to: NOTICE_SENT
        trigger: "POST /payer-contracts/{contractId}/novation with action SEND_NOTICE"
        actor: IntegrationManager
        preconditions:
          - "the parent Acquisition.deal_status is BOARD_REVIEW or SIGNED"
        side_effects:
          - "sets PayerContract.notice_sent_on to the current logical date"
      - from: NOTICE_SENT
        to: CONSENT_RECEIVED
        trigger: "POST /payer-contracts/{contractId}/novation with action RECORD_CONSENT"
        actor: IntegrationManager
        preconditions:
          - "the current logical date is at least notice_days_required days after notice_sent_on"
        side_effects:
          - "sets PayerContract.consent_received_on to the current logical date"
      - from: NOTICE_SENT
        to: DENIED
        trigger: "POST /payer-contracts/{contractId}/novation with action DENY"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "sets every CredentialingPackage on this payer_contract_id in status DRAFT, SUBMITTED or IN_REVIEW to WITHDRAWN"
          - "sets the acquisition's ReadinessTask with task_code PAYER_CREDENTIALING to FAILED when it is in status IN_PROGRESS or COMPLETE, recording failure_reason"
          - "recomputes Acquisition.readiness_posture"
      - from: CONSENT_RECEIVED
        to: NOVATED
        trigger: "POST /payer-contracts/{contractId}/novation with action NOVATE"
        actor: IntegrationManager
        preconditions:
          - "at least one CredentialingPackage on this payer_contract_id is in status APPROVED"
        side_effects: []
      - from: DENIED
        to: NEW_AGREEMENT_PENDING
        trigger: "POST /payer-contracts/{contractId}/novation with action START_NEW_AGREEMENT"
        actor: IntegrationManager
        preconditions:
          - "PayerContract.contract_form is not NON_ASSIGNABLE"
        side_effects: []
      - from: NEW_AGREEMENT_PENDING
        to: NOVATED
        trigger: "POST /payer-contracts/{contractId}/novation with action NOVATE"
        actor: IntegrationManager
        preconditions:
          - "at least one CredentialingPackage on this payer_contract_id is in status APPROVED"
        side_effects: []
      - from: DENIED
        to: TERMINATED
        trigger: "POST /payer-contracts/{contractId}/novation with action TERMINATE"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: NEW_AGREEMENT_PENDING
        to: TERMINATED
        trigger: "POST /payer-contracts/{contractId}/novation with action TERMINATE"
        actor: IntegrationManager
        preconditions: []
        side_effects: []

  - entity: CredentialingPackage
    field: status
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /credentialing-packages/{packageId}/status with target_status SUBMITTED"
        actor: IntegrationManager
        preconditions:
          - "the linked PayerContract.novation_status is NOTICE_SENT, CONSENT_RECEIVED, NEW_AGREEMENT_PENDING or NOVATED"
          - "the linked Physician's state_license_expires_on is not before the current logical date, else ERR_PHYSICIAN_LICENSE_EXPIRED"
          - "CredentialingPackage.projected_effective_on is not after target_close_on plus the payer's retro-billing window, else ERR_CREDENTIALING_LEAD_TIME_MISSED"
          - "fewer than the linked PayerContract.committee_slots_per_cycle other packages on the same payer_contract_id share this committee_cycle_key in status SUBMITTED, IN_REVIEW or APPROVED, else ERR_COMMITTEE_CYCLE_CAPACITY_EXCEEDED"
        side_effects: []
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /credentialing-packages/{packageId}/status with target_status IN_REVIEW"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /credentialing-packages/{packageId}/status with target_status APPROVED"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "sets the acquisition's ReadinessTask with task_code PAYER_CREDENTIALING to COMPLETE when every CredentialingPackage on the acquisition is in status APPROVED, DENIED or WITHDRAWN and that task is in status IN_PROGRESS"
          - "recomputes Acquisition.readiness_posture"
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /credentialing-packages/{packageId}/status with target_status DENIED"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /credentialing-packages/{packageId}/status with target_status WITHDRAWN, or the cascade from the PayerContract NOTICE_SENT -> DENIED transition"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /credentialing-packages/{packageId}/status with target_status WITHDRAWN, or the cascade from the PayerContract NOTICE_SENT -> DENIED transition"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "frees the package's seat in its committee_cycle_key for the linked payer contract"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /credentialing-packages/{packageId}/status with target_status WITHDRAWN, or the cascade from the PayerContract NOTICE_SENT -> DENIED transition"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "frees the package's seat in its committee_cycle_key for the linked payer contract"

  - entity: EhrMigrationBatch
    field: status
    initial_state: STAGED
    terminal_states: [RECONCILED, ABORTED]
    transitions:
      - from: STAGED
        to: EXTRACTED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action EXTRACT"
        actor: IntegrationManager
        preconditions:
          - "EhrMigrationBatch.record_count is greater than 0, else ERR_EMPTY_MIGRATION_BATCH"
        side_effects: []
      - from: EXTRACTED
        to: LOADED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action LOAD"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: LOADED
        to: RECONCILED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action RECONCILE and the submitted counts yielding match_rate_bps at or above RECONCILE_MIN_BPS"
        actor: IntegrationManager
        preconditions:
          - "validated_count plus defect_count does not exceed record_count, else ERR_MIGRATION_COUNT_INVALID"
          - "the recomputed match_rate_bps is at least RECONCILE_MIN_BPS"
        side_effects:
          - "stores validated_count, defect_count, unprocessed_count and match_rate_bps"
          - "sets the acquisition's ReadinessTask with task_code IT_DATA_MIGRATION to COMPLETE when every EhrMigrationBatch on the acquisition is in status RECONCILED or ABORTED and that task is in status IN_PROGRESS"
          - "recomputes Acquisition.readiness_posture"
      - from: LOADED
        to: FAILED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action RECONCILE, the submitted counts yielding match_rate_bps below RECONCILE_MIN_BPS, and retry_count still below MAX_MIGRATION_RETRIES"
        actor: IntegrationManager
        preconditions:
          - "validated_count plus defect_count does not exceed record_count, else ERR_MIGRATION_COUNT_INVALID"
          - "EhrMigrationBatch.retry_count is less than MAX_MIGRATION_RETRIES"
        side_effects:
          - "stores validated_count, defect_count, unprocessed_count and match_rate_bps"
          - "increments EhrMigrationBatch.retry_count by 1"
      - from: FAILED
        to: STAGED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action REQUEUE"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "resets validated_count and defect_count to 0, restoring unprocessed_count to record_count"
          - "resets match_rate_bps to 0"
      - from: LOADED
        to: ABORTED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action RECONCILE, the submitted counts yielding match_rate_bps below RECONCILE_MIN_BPS, and retry_count already at MAX_MIGRATION_RETRIES"
        actor: IntegrationManager
        preconditions:
          - "validated_count plus defect_count does not exceed record_count, else ERR_MIGRATION_COUNT_INVALID"
          - "EhrMigrationBatch.retry_count equals MAX_MIGRATION_RETRIES"
        side_effects:
          - "stores validated_count, defect_count, unprocessed_count and match_rate_bps"
          - "increments EhrMigrationBatch.retry_count by 1"
          - "sets the acquisition's ReadinessTask with task_code IT_DATA_MIGRATION to FAILED when that task is in status IN_PROGRESS or COMPLETE, recording failure_reason"
          - "recomputes Acquisition.readiness_posture"
      - from: FAILED
        to: ABORTED
        trigger: "POST /ehr-migration-batches/{batchId}/progress with action ABORT"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "recomputes Acquisition.readiness_posture"

  - entity: StaffTransitionOffer
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, RESCINDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: EXTENDED
        trigger: "POST /staff-transition-offers/{offerId}/status with target_status EXTENDED"
        actor: IntegrationManager
        preconditions:
          - "the parent Acquisition.deal_status is DILIGENCE, BOARD_REVIEW or SIGNED"
          - "StaffTransitionOffer.offer_expires_on is not before the current logical date"
          - "StaffTransitionOffer.retention_bonus_cents does not exceed Acquisition.retention_pool_available_cents, else ERR_RETENTION_POOL_EXCEEDED"
        side_effects:
          - "adds retention_bonus_cents to Acquisition.retention_pool_committed_cents and subtracts it from retention_pool_available_cents"
          - "sets StaffTransitionOffer.extended_on to the current logical date"
          - "recomputes Acquisition.hr_staffing_coverage_pct"
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /staff-transition-offers/{offerId}/status with target_status ACCEPTED"
        actor: IntegrationManager
        preconditions:
          - "StaffTransitionOffer.offer_expires_on is not before the current logical date"
        side_effects:
          - "sets StaffTransitionOffer.accepted_on to the current logical date"
          - "recomputes Acquisition.hr_staffing_coverage_pct"
          - "sets the acquisition's ReadinessTask with task_code HR_STAFFING_PLAN to COMPLETE when hr_staffing_coverage_pct is at least HR_COVERAGE_MIN_PCT and that task is in status IN_PROGRESS"
          - "recomputes Acquisition.readiness_posture"
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /staff-transition-offers/{offerId}/status with target_status DECLINED"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "subtracts retention_bonus_cents from Acquisition.retention_pool_committed_cents and adds it back to retention_pool_available_cents"
          - "recomputes Acquisition.hr_staffing_coverage_pct"
      - from: EXTENDED
        to: RESCINDED
        trigger: "POST /staff-transition-offers/{offerId}/status with target_status RESCINDED"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "subtracts retention_bonus_cents from Acquisition.retention_pool_committed_cents and adds it back to retention_pool_available_cents"
          - "recomputes Acquisition.hr_staffing_coverage_pct"
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /staff-transition-offers/{offerId}/status with target_status EXPIRED"
        actor: IntegrationManager
        preconditions:
          - "StaffTransitionOffer.offer_expires_on is before the current logical date"
        side_effects:
          - "subtracts retention_bonus_cents from Acquisition.retention_pool_committed_cents and adds it back to retention_pool_available_cents"
          - "recomputes Acquisition.hr_staffing_coverage_pct"
      - from: DRAFT
        to: RESCINDED
        trigger: "POST /staff-transition-offers/{offerId}/status with target_status RESCINDED, or the cascade from the Acquisition compliance_clearance FLAGGED -> SUSPENDED transition"
        actor: IntegrationManager
        preconditions: []
        side_effects: []

  - entity: BillingConversion
    field: status
    initial_state: NOT_STARTED
    terminal_states: [CONVERTED, WITHDRAWN]
    transitions:
      - from: NOT_STARTED
        to: ATTESTED
        trigger: "POST /billing-conversions/{conversionId}/status with target_status ATTESTED"
        actor: IntegrationManager
        preconditions:
          - "the parent Acquisition.deal_status is BOARD_REVIEW, SIGNED or CLOSED"
        side_effects:
          - "sets BillingConversion.attested_on to the current logical date"
      - from: ATTESTED
        to: NOTICES_ISSUED
        trigger: "POST /billing-conversions/{conversionId}/status with target_status NOTICES_ISSUED"
        actor: IntegrationManager
        preconditions:
          - "BillingConversion.notices_issued_on is not null"
          - "BillingConversion.notice_lead_days is at least PATIENT_NOTICE_LEAD_DAYS, else ERR_PATIENT_NOTICE_LEAD_TIME_SHORT"
          - "BillingConversion.notice_coverage_bps is at least 10000, else ERR_PATIENT_NOTICE_COVERAGE_INCOMPLETE"
        side_effects:
          - "sets the acquisition's ReadinessTask with task_code PATIENT_NOTIFICATION to COMPLETE when every BillingConversion on the acquisition has left NOT_STARTED and ATTESTED and that task is in status IN_PROGRESS"
          - "recomputes Acquisition.readiness_posture"
      - from: NOTICES_ISSUED
        to: CONVERTED
        trigger: "POST /billing-conversions/{conversionId}/status with target_status CONVERTED"
        actor: IntegrationManager
        preconditions:
          - "when conversion_type is PROVIDER_BASED_DEPARTMENT, a PayerContract on the same acquisition with payer_type MEDICARE is in novation_status NOVATED, else ERR_PAYER_NOVATION_INCOMPLETE"
          - "the parent Acquisition.deal_status is SIGNED or CLOSED"
        side_effects: []
      - from: NOT_STARTED
        to: WITHDRAWN
        trigger: "POST /billing-conversions/{conversionId}/status with target_status WITHDRAWN"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: ATTESTED
        to: WITHDRAWN
        trigger: "POST /billing-conversions/{conversionId}/status with target_status WITHDRAWN"
        actor: IntegrationManager
        preconditions: []
        side_effects: []
      - from: NOTICES_ISSUED
        to: WITHDRAWN
        trigger: "POST /billing-conversions/{conversionId}/status with target_status WITHDRAWN"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "recomputes Acquisition.readiness_posture"

  - entity: ReadinessTask
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETE, WAIVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /readiness-tasks/{taskId}/status with target_status IN_PROGRESS"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "recomputes Acquisition.readiness_posture"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /readiness-tasks/{taskId}/status with target_status COMPLETE, or a cascade from the corresponding domain workstream reaching its terminal condition"
        actor: IntegrationManager
        preconditions:
          - "when task_code is HR_STAFFING_PLAN, Acquisition.hr_staffing_coverage_pct is at least HR_COVERAGE_MIN_PCT"
          - "when task_code is IT_DATA_MIGRATION, every EhrMigrationBatch on the acquisition is in status RECONCILED or ABORTED, else ERR_MIGRATION_INCOMPLETE"
        side_effects:
          - "stores the caller's X-User-ID in ReadinessTask.verified_by_user_id"
          - "recomputes Acquisition.readiness_posture"
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /readiness-tasks/{taskId}/status with target_status WAIVED"
        actor: ComplianceOfficer
        preconditions:
          - "the request supplies a non-empty waiver_justification, else ERR_WAIVER_JUSTIFICATION_REQUIRED"
        side_effects:
          - "stores waiver_justification and the caller's X-User-ID in verified_by_user_id"
          - "recomputes Acquisition.readiness_posture"
      - from: OPEN
        to: WAIVED
        trigger: "POST /readiness-tasks/{taskId}/status with target_status WAIVED"
        actor: ComplianceOfficer
        preconditions:
          - "the request supplies a non-empty waiver_justification, else ERR_WAIVER_JUSTIFICATION_REQUIRED"
        side_effects:
          - "stores waiver_justification and the caller's X-User-ID in verified_by_user_id"
          - "recomputes Acquisition.readiness_posture"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /readiness-tasks/{taskId}/status with target_status FAILED, or the cascade from the PayerContract NOTICE_SENT -> DENIED transition or the EhrMigrationBatch LOADED -> ABORTED transition"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "stores failure_reason"
          - "recomputes Acquisition.readiness_posture"
      - from: COMPLETE
        to: FAILED
        trigger: "the cascade from the PayerContract NOTICE_SENT -> DENIED transition or the EhrMigrationBatch LOADED -> ABORTED transition"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "stores failure_reason"
          - "clears verified_by_user_id back to null"
          - "recomputes Acquisition.readiness_posture"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /readiness-tasks/{taskId}/status with target_status IN_PROGRESS"
        actor: IntegrationManager
        preconditions: []
        side_effects:
          - "clears failure_reason back to null"
          - "recomputes Acquisition.readiness_posture"

  - entity: LiabilityItem
    field: disposition
    initial_state: UNASSIGNED
    terminal_states: [EXCLUDED, INDEMNIFIED]
    transitions:
      - from: UNASSIGNED
        to: ASSUMED
        trigger: "POST /liability-items/{itemId}/disposition with target_disposition ASSUMED"
        actor: DealLead
        preconditions:
          - "the combination of Acquisition.structure and LiabilityItem.category permits ASSUMED, else ERR_LIABILITY_DISPOSITION_NOT_PERMITTED"
        side_effects: []
      - from: UNASSIGNED
        to: EXCLUDED
        trigger: "POST /liability-items/{itemId}/disposition with target_disposition EXCLUDED"
        actor: DealLead
        preconditions:
          - "the combination of Acquisition.structure and LiabilityItem.category permits EXCLUDED, else ERR_LIABILITY_DISPOSITION_NOT_PERMITTED"
        side_effects: []
      - from: UNASSIGNED
        to: INDEMNIFIED
        trigger: "POST /liability-items/{itemId}/disposition with target_disposition INDEMNIFIED"
        actor: DealLead
        preconditions:
          - "LiabilityItem.indemnity_cap_cents is not null and is at least estimated_amount_cents, else ERR_INVALID_REQUEST"
        side_effects: []
      - from: UNASSIGNED
        to: ESCROWED
        trigger: "POST /liability-items/{itemId}/disposition with target_disposition ESCROWED"
        actor: DealLead
        preconditions:
          - "LiabilityItem.estimated_amount_cents does not exceed Acquisition.escrow_available_cents, else ERR_ESCROW_INSUFFICIENT"
        side_effects:
          - "sets escrowed_amount_cents to estimated_amount_cents"
          - "adds escrowed_amount_cents to Acquisition.escrow_committed_cents and subtracts it from escrow_available_cents"
      - from: ASSUMED
        to: ESCROWED
        trigger: "POST /liability-items/{itemId}/disposition with target_disposition ESCROWED"
        actor: DealLead
        preconditions:
          - "LiabilityItem.estimated_amount_cents does not exceed Acquisition.escrow_available_cents, else ERR_ESCROW_INSUFFICIENT"
        side_effects:
          - "sets escrowed_amount_cents to estimated_amount_cents"
          - "adds escrowed_amount_cents to Acquisition.escrow_committed_cents and subtracts it from escrow_available_cents"
      - from: ESCROWED
        to: EXCLUDED
        trigger: "POST /liability-items/{itemId}/disposition with target_disposition EXCLUDED"
        actor: DealLead
        preconditions:
          - "the combination of Acquisition.structure and LiabilityItem.category permits EXCLUDED, else ERR_LIABILITY_DISPOSITION_NOT_PERMITTED"
        side_effects:
          - "subtracts escrowed_amount_cents from Acquisition.escrow_committed_cents and adds it back to escrow_available_cents"
          - "resets escrowed_amount_cents to 0"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - name: valuation-opinion-create-stale-acquisition
    parent_entity: Acquisition
    child_entity: ValuationOpinion
    write_endpoint: "POST /valuation-opinions"
    occ_field: expected_acquisition_version
    guarantee: |
      A ValuationOpinion may only be created against the Acquisition version the caller
      read. The request must carry expected_acquisition_version; the server compares it
      against the stored Acquisition.version, rejects any mismatch, and on success bumps
      Acquisition.version by 1. A caller who read the acquisition before another opinion
      was filed therefore holds a stale version and is refused, which is what keeps an
      earlier ACCEPTED FMV opinion from being silently superseded by a later filing.
    error_id: ERR_STALE_ACQUISITION_VERSION
    http_status: 412
  - name: compensation-plan-create-stale-acquisition
    parent_entity: Acquisition
    child_entity: CompensationPlan
    write_endpoint: "POST /compensation-plans"
    occ_field: expected_acquisition_version
    guarantee: |
      A CompensationPlan may only be created against the Acquisition version the caller
      read. The request must carry expected_acquisition_version; the server compares it
      against the stored Acquisition.version, rejects any mismatch, and on success bumps
      Acquisition.version by 1. This forces every plan designer to re-read the acquisition
      after any preceding write, so a plan can never be built on a superseded valuation,
      a stale retention pool balance or a stale compliance_clearance.
    error_id: ERR_STALE_ACQUISITION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# All money is integer cents. All rates are basis points (10000 bps == 100%).
# `rhu(x)` means Decimal ROUND_HALF_UP to the stated precision (0 decimal
# places, i.e. whole cents, unless the rule says otherwise).
# =============================================================================
calculations:
  - name: fmv_concluded_value
    description: |
      Concluded fair market value of the target practice. Two structurally different
      valuation variants are selected by ValuationOpinion.method and produce materially
      different results from the very same normalized EBITDA. COMMERCIAL_REASONABLENESS
      opinions are narrative and conclude no value at all.
    trigger: "on POST /valuation-opinions, and never recomputed afterwards"
    inputs:
      - ValuationOpinion.opinion_type
      - ValuationOpinion.method
      - ValuationOpinion.normalized_ebitda_cents
      - ValuationOpinion.projection_years
      - ValuationOpinion.ebitda_growth_bps
      - ValuationOpinion.discount_rate_bps
      - ValuationOpinion.terminal_growth_bps
      - ValuationOpinion.market_multiple_bps
    algorithm: projection
    formula: |
      if opinion_type == COMMERCIAL_REASONABLENESS:
          concluded_value_cents = 0            # NARRATIVE method, no value conclusion
          return

      # ---- variant INCOME_APPROACH -------------------------------------------
      # Discounted cash flow over an explicit horizon plus a Gordon-growth terminal
      # value. Each yearly figure is rounded to whole cents BEFORE it is accumulated;
      # the terminal value is rounded before it is discounted and rounded again after.
      g  = ebitda_growth_bps   / 10000
      r  = discount_rate_bps   / 10000
      tg = terminal_growth_bps / 10000
      N  = projection_years
      E0 = normalized_ebitda_cents

      pv_explicit = 0
      for t in 1 .. N:
          E_t          = rhu(E0 * (1 + g) ** t)          # rounded projected EBITDA
          pv_explicit += rhu(E_t / (1 + r) ** t)         # rounded, then accumulated
      E_N     = rhu(E0 * (1 + g) ** N)
      TV      = rhu(E_N * (1 + tg) / (r - tg))
      pv_tv   = rhu(TV / (1 + r) ** N)
      concluded_value_cents = pv_explicit + pv_tv

      # ---- variant MARKET_APPROACH -------------------------------------------
      concluded_value_cents = rhu(normalized_ebitda_cents * market_multiple_bps / 10000)

      # ---- expires_on --------------------------------------------------------
      expires_on = effective_on + OPINION_VALIDITY_MONTHS calendar months
                   (same day-of-month; if that day does not exist in the target
                    month, the last day of the target month is used)
    constants:
      OPINION_VALIDITY_MONTHS: 12
    precision: "whole cents, round_half_up; each projected year and the terminal value are rounded independently before accumulation"
    variants:
      - name: INCOME_APPROACH
        when: "ValuationOpinion.method == INCOME_APPROACH"
        difference: "Multi-period discounted cash flow with a Gordon-growth terminal value; requires projection_years, ebitda_growth_bps, discount_rate_bps and terminal_growth_bps; rounds every year and the terminal value independently."
      - name: MARKET_APPROACH
        when: "ValuationOpinion.method == MARKET_APPROACH"
        difference: "Single-step EBITDA multiple; requires only market_multiple_bps; ignores growth, discount rate, terminal growth and projection_years entirely, so the same normalized EBITDA yields a different concluded value."

  - name: deal_net_consideration
    description: |
      Total consideration for the transaction. The synergy credit tier is keyed on the
      GROSS consideration, not on the net figure the credit produces, and the whole chain
      is evaluated in one pinned order. Re-deriving the tier from net_consideration_cents
      lands in a lower tier and yields a different answer.
    trigger: "on the Acquisition deal_status DILIGENCE -> BOARD_REVIEW transition, immediately after purchase_price_cents and tail_premium_cents are pinned"
    inputs:
      - Acquisition.purchase_price_cents
      - Acquisition.tail_premium_cents
      - Acquisition.escrow_committed_cents
    algorithm: tiered_pricing
    formula: |
      # Step 1 — base
      base = purchase_price_cents

      # Step 2 — integration reserve, a flat rate on the base alone
      integration_reserve_cents = rhu(base * INTEGRATION_RESERVE_BPS / 10000)

      # Step 3 — gross consideration
      gross_consideration_cents = base
                                + integration_reserve_cents
                                + tail_premium_cents
                                + escrow_committed_cents

      # Step 4 — synergy credit tier, selected from GROSS (this is the pinned order)
      if   gross_consideration_cents <  TIER_1_CEILING_CENTS: synergy_credit_bps = TIER_0_BPS
      elif gross_consideration_cents <  TIER_2_CEILING_CENTS: synergy_credit_bps = TIER_1_BPS
      elif gross_consideration_cents <  TIER_3_CEILING_CENTS: synergy_credit_bps = TIER_2_BPS
      else:                                                   synergy_credit_bps = TIER_3_BPS
      synergy_credit_cents = rhu(gross_consideration_cents * synergy_credit_bps / 10000)

      # Step 5 — net consideration
      net_consideration_cents = gross_consideration_cents - synergy_credit_cents

      # The tier is NEVER re-selected from net_consideration_cents. A deal whose gross
      # sits just above a tier ceiling can fall back below it once the credit is netted;
      # the credit still stands at the gross-derived rate.
    constants:
      INTEGRATION_RESERVE_BPS: 350
      TIER_1_CEILING_CENTS: 800000000
      TIER_2_CEILING_CENTS: 1500000000
      TIER_3_CEILING_CENTS: 2500000000
      TIER_0_BPS: 0
      TIER_1_BPS: 150
      TIER_2_BPS: 275
      TIER_3_BPS: 400
    precision: "whole cents, round_half_up at each step"

  - name: projected_total_cash_comp
    description: "Projected annual total cash compensation for a physician, by compensation model."
    trigger: "on POST /compensation-plans, and recomputed by calculations.comp_true_up when a PerformanceReport is folded in"
    inputs:
      - CompensationPlan.model_type
      - CompensationPlan.base_salary_cents
      - CompensationPlan.conversion_factor_cents_per_wrvu
      - CompensationPlan.threshold_wrvu
      - CompensationPlan.projected_annual_wrvu
    algorithm: threshold
    formula: |
      if model_type == STRAIGHT_SALARY:
          projected_total_cash_comp_cents = base_salary_cents
      elif model_type == WRVU_PRODUCTIVITY:
          projected_total_cash_comp_cents =
              rhu(conversion_factor_cents_per_wrvu * projected_annual_wrvu)
      elif model_type == BASE_PLUS_INCENTIVE:
          incentive_wrvu = max(0, projected_annual_wrvu - threshold_wrvu)
          projected_total_cash_comp_cents =
              base_salary_cents + rhu(conversion_factor_cents_per_wrvu * incentive_wrvu)

      if projected_annual_wrvu > 0:
          comp_per_wrvu_cents = rhu(projected_total_cash_comp_cents / projected_annual_wrvu)
      else:
          comp_per_wrvu_cents = 0
    constants: {}
    precision: "whole cents, round_half_up"

  - name: compensation_benchmark_percentile
    description: |
      Where the plan sits in the specialty compensation survey. Two different bases are
      used depending on the compensation model: total cash compensation for salary-based
      models, dollars per work RVU for productivity models. The same physician economics
      can therefore land at a compliant percentile under one model and above the safe
      harbour under the other.
    trigger: "on POST /compensation-plans, and recomputed by calculations.comp_true_up when a PerformanceReport is folded in"
    inputs:
      - CompensationPlan.model_type
      - CompensationPlan.projected_total_cash_comp_cents
      - CompensationPlan.comp_per_wrvu_cents
      - Physician.specialty
    algorithm: threshold
    formula: |
      # Variant selection
      if model_type == WRVU_PRODUCTIVITY:
          benchmark_basis = COMP_PER_WRVU
          v   = comp_per_wrvu_cents
          p25, p50, p75, p90 = BENCHMARKS[physician.specialty].comp_per_wrvu
      else:
          benchmark_basis = TOTAL_CASH_COMP
          v   = projected_total_cash_comp_cents
          p25, p50, p75, p90 = BENCHMARKS[physician.specialty].total_cash_comp

      # Piecewise-linear interpolation between the published survey quartiles.
      if   v <= p25: p = 25 * v / p25
      elif v <= p50: p = 25 + 25 * (v - p25) / (p50 - p25)
      elif v <= p75: p = 50 + 25 * (v - p50) / (p75 - p50)
      elif v <= p90: p = 75 + 15 * (v - p75) / (p90 - p75)
      else:          p = min(99, 90 + 9 * (v - p90) / p90)

      benchmark_percentile = rhu(p, 2)     # two decimal places

      # A value landing exactly on p90 yields exactly 90.00, which is NOT greater than
      # FMV_SAFE_HARBOR_PERCENTILE and therefore does not trip the safe-harbour gate.
    constants:
      BENCHMARKS:
        PRIMARY_CARE:
          total_cash_comp: [22000000, 26500000, 31000000, 36000000]
          comp_per_wrvu:   [4200, 5200, 6300, 7600]
        CARDIOLOGY:
          total_cash_comp: [45000000, 55000000, 68000000, 82000000]
          comp_per_wrvu:   [5600, 6900, 8300, 9800]
        ORTHOPEDICS:
          total_cash_comp: [50000000, 62000000, 76000000, 92000000]
          comp_per_wrvu:   [6100, 7400, 9000, 10800]
        ONCOLOGY:
          total_cash_comp: [40000000, 49000000, 60000000, 72000000]
          comp_per_wrvu:   [5200, 6400, 7800, 9300]
      PERCENTILE_CEILING: 99.00
      FMV_SAFE_HARBOR_PERCENTILE: 90.00
    precision: "2 decimal places, round_half_up; hard-capped at 99.00"
    variants:
      - name: TOTAL_CASH_COMP
        when: "CompensationPlan.model_type IN {STRAIGHT_SALARY, BASE_PLUS_INCENTIVE}"
        difference: "Interpolates projected_total_cash_comp_cents against the specialty's total-cash-compensation quartiles; productivity is irrelevant to the percentile."
      - name: COMP_PER_WRVU
        when: "CompensationPlan.model_type == WRVU_PRODUCTIVITY"
        difference: "Interpolates comp_per_wrvu_cents against the specialty's dollars-per-wRVU quartiles; two plans with identical total cash compensation land at different percentiles whenever their wRVU volumes differ."

  - name: staff_offer_wage_harmonization
    description: |
      Harmonised annual wage offered to a transitioning staff member. The market uplift and
      the paid-time-off buy-out are each rounded to whole cents INDEPENDENTLY and only then
      added to the legacy wage; rounding the sum instead of the components can differ by a
      cent. The system pay-scale minimum is applied last, as a floor on the harmonised sum.
    trigger: "on POST /staff-transition-offers"
    inputs:
      - StaffTransitionOffer.role_code
      - StaffTransitionOffer.legacy_annual_wage_cents
      - StaffTransitionOffer.legacy_pto_hours
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — market uplift on the legacy wage, rounded on its own
      uplift_component_cents = rhu(legacy_annual_wage_cents
                                   * ROLE_UPLIFT_BPS[role_code] / 10000)

      # Step 2 — PTO buy-out, valued at the legacy hourly rate, rounded on its own
      hourly_rate = legacy_annual_wage_cents / ANNUAL_HOURS          # kept unrounded here
      pto_component_cents = rhu(legacy_pto_hours * hourly_rate
                                 * PTO_BUYOUT_RATE_BPS / 10000)

      # Step 3 — harmonised sum of INDEPENDENTLY rounded components
      harmonized = legacy_annual_wage_cents
                 + uplift_component_cents
                 + pto_component_cents

      # Step 4 — system pay-scale floor
      floor_cents = SYSTEM_PAY_SCALE_MIN_CENTS[role_code]
      if harmonized < floor_cents:
          offered_annual_wage_cents = floor_cents
          wage_floor_applied        = true
      else:
          offered_annual_wage_cents = harmonized
          wage_floor_applied        = false

      # NOTE: rhu(uplift_raw) + rhu(pto_raw) is the pinned answer. The alternative
      # rhu(uplift_raw + pto_raw) is a different number whenever both raw components
      # carry a fractional part of half a cent or more.
    constants:
      ANNUAL_HOURS: 2080
      PTO_BUYOUT_RATE_BPS: 5000
      ROLE_UPLIFT_BPS:
        MA: 400
        RN: 600
        FRONT_DESK: 250
        BILLER: 300
        PRACTICE_MANAGER: 800
      SYSTEM_PAY_SCALE_MIN_CENTS:
        MA: 4200000
        RN: 7600000
        FRONT_DESK: 3600000
        BILLER: 4400000
        PRACTICE_MANAGER: 9500000
    precision: "whole cents, round_half_up, applied separately to each component before summation"

  - name: retention_bonus_award
    description: |
      Retention bonus attached to a staff transition offer. A nested computation: a service
      tier rate on the harmonised offered wage, then a criticality multiplier on that
      rounded result, then a floor and a cap clamped in a fixed order.
    trigger: "on POST /staff-transition-offers, immediately after calculations.staff_offer_wage_harmonization"
    inputs:
      - StaffTransitionOffer.offered_annual_wage_cents
      - StaffTransitionOffer.credited_service_months
      - StaffTransitionOffer.role_code
    algorithm: threshold
    formula: |
      # Step 1 — service tier band on credited service
      if   credited_service_months <  12: tier_bps = TIER_UNDER_1YR_BPS
      elif credited_service_months <  60: tier_bps = TIER_1_TO_5YR_BPS
      elif credited_service_months < 120: tier_bps = TIER_5_TO_10YR_BPS
      else:                               tier_bps = TIER_OVER_10YR_BPS

      # Step 2 — raw award on the offered wage, rounded
      raw_award = rhu(offered_annual_wage_cents * tier_bps / 10000)

      # Step 3 — criticality multiplier applied to the ROUNDED raw award, rounded again
      mult_bps  = CRITICAL_ROLE_MULTIPLIER_BPS if role_code in CRITICAL_ROLES else 10000
      adjusted  = rhu(raw_award * mult_bps / 10000)

      # Step 4 — clamp: floor first, then cap (min of cap and max of floor)
      retention_bonus_cents = min(BONUS_CAP_CENTS, max(BONUS_FLOOR_CENTS, adjusted))
    constants:
      TIER_UNDER_1YR_BPS: 200
      TIER_1_TO_5YR_BPS: 500
      TIER_5_TO_10YR_BPS: 800
      TIER_OVER_10YR_BPS: 1100
      CRITICAL_ROLES: [RN, BILLER, PRACTICE_MANAGER]
      CRITICAL_ROLE_MULTIPLIER_BPS: 12500
      BONUS_FLOOR_CENTS: 100000
      BONUS_CAP_CENTS: 1500000
    precision: "whole cents, round_half_up at Step 2 and again at Step 3"

  - name: retention_pool_ledger
    description: |
      Conservation of the acquisition's retention-bonus pool. Committing an offer moves money
      from available to committed; every non-acceptance path returns exactly the same amount,
      so total always equals committed plus available and the balance after a rescind is
      byte-identical to the balance before the offer was extended.
    trigger: "on every StaffTransitionOffer transition into or out of EXTENDED, and on the ACCEPTED, DECLINED, RESCINDED and EXPIRED transitions"
    inputs:
      - Acquisition.retention_pool_total_cents
      - "StaffTransitionOffer.retention_bonus_cents over offers with status IN {EXTENDED, ACCEPTED}"
    algorithm: aggregation
    formula: |
      retention_pool_committed_cents = sum(retention_bonus_cents
                                            for offers with status in {EXTENDED, ACCEPTED})
      retention_pool_available_cents = retention_pool_total_cents
                                     - retention_pool_committed_cents

      # Invariant, checked after every transition:
      #   retention_pool_total_cents == retention_pool_committed_cents
      #                               + retention_pool_available_cents
      # DRAFT offers reserve nothing. ACCEPTED offers stay committed. DECLINED,
      # RESCINDED and EXPIRED offers release their full commitment with no residue.
    constants: {}
    precision: "whole cents; no rounding occurs, the ledger only adds and subtracts already-rounded amounts"

  - name: liability_escrow_ledger
    description: |
      Conservation of the indemnity escrow. Only LiabilityItem rows in disposition ESCROWED
      hold escrow; releasing one to EXCLUDED returns the full escrowed amount and zeroes the
      item's own escrowed_amount_cents, so no drift can accumulate.
    trigger: "on every LiabilityItem transition into or out of disposition ESCROWED"
    inputs:
      - Acquisition.escrow_total_cents
      - "LiabilityItem.escrowed_amount_cents over items with disposition == ESCROWED"
    algorithm: aggregation
    formula: |
      escrow_committed_cents = sum(escrowed_amount_cents
                                    for items with disposition == ESCROWED)
      escrow_available_cents = escrow_total_cents - escrow_committed_cents

      # Invariant, checked after every disposition change:
      #   escrow_total_cents == escrow_committed_cents + escrow_available_cents
      # and, for every item, escrowed_amount_cents == 0 unless disposition == ESCROWED.
    constants: {}
    precision: "whole cents; no rounding occurs"

  - name: comp_true_up
    description: |
      Post-close reconciliation of a physician's compensation against actual productivity.
      Folding a monthly PerformanceReport into an EXECUTED plan pro-rates the plan's
      threshold and its paid-to-date compensation over the elapsed months, computes the
      earned amount from actual work RVUs, and then re-benchmarks the plan on the ANNUALISED
      run-rate. A plan whose annualised run-rate crosses the fair-market-value safe harbour
      is pushed onto compliance hold.
    trigger: "on POST /performance-reports, against the plan named by applied_comp_plan_id"
    inputs:
      - "the count of PerformanceReport rows for the plan"
      - "the sum of actual_wrvu over those rows"
      - CompensationPlan.model_type
      - CompensationPlan.base_salary_cents
      - CompensationPlan.conversion_factor_cents_per_wrvu
      - CompensationPlan.threshold_wrvu
      - CompensationPlan.projected_total_cash_comp_cents
      - Physician.specialty
    algorithm: forward_looking
    formula: |
      months_elapsed   = count of PerformanceReport rows for this applied_comp_plan_id
      actual_ytd_wrvu  = sum of actual_wrvu over those rows
      me               = months_elapsed

      # Step 1 — pro-rate the annual threshold over the elapsed months
      threshold_ytd = rhu(threshold_wrvu * me / 12)

      # Step 2 — earned compensation for the elapsed period
      if model_type == STRAIGHT_SALARY:
          earned = rhu(base_salary_cents * me / 12)
      elif model_type == WRVU_PRODUCTIVITY:
          earned = rhu(conversion_factor_cents_per_wrvu * actual_ytd_wrvu)
      elif model_type == BASE_PLUS_INCENTIVE:
          earned = rhu(base_salary_cents * me / 12)
                 + rhu(conversion_factor_cents_per_wrvu
                        * max(0, actual_ytd_wrvu - threshold_ytd))

      # Step 3 — what the plan has already paid on its projection
      paid_to_date = rhu(projected_total_cash_comp_cents * me / 12)

      # Step 4 — the true-up (negative values are clawbacks)
      comp_true_up_cents = earned - paid_to_date

      # Step 5 — re-benchmark on the ANNUALISED run-rate, never on the year-to-date figures
      annualized_wrvu = rhu(actual_ytd_wrvu * 12 / me)
      annualized_tcc  = calculations.projected_total_cash_comp evaluated with
                        projected_annual_wrvu replaced by annualized_wrvu
      annualized_cpw  = rhu(annualized_tcc / annualized_wrvu) if annualized_wrvu > 0 else 0
      benchmark_percentile = calculations.compensation_benchmark_percentile evaluated on
                        annualized_tcc (basis TOTAL_CASH_COMP) or annualized_cpw
                        (basis COMP_PER_WRVU), per the plan's benchmark_basis

      # CompensationPlan.projected_annual_wrvu, projected_total_cash_comp_cents and
      # comp_per_wrvu_cents are design inputs and are NEVER overwritten by this rule.

      # Step 6 — safe-harbour trip
      if benchmark_percentile > FMV_SAFE_HARBOR_PERCENTILE
         and fmv_justification_on_file is false
         and plan.status == EXECUTED:
             plan.status -> COMPLIANCE_HOLD    (which flags the acquisition in turn)
    constants:
      MONTHS_PER_YEAR: 12
      FMV_SAFE_HARBOR_PERCENTILE: 90.00
    precision: "whole cents and whole work RVUs, round_half_up; percentile to 2 decimal places"

  - name: compensation_plan_revision_limit
    description: |
      Bounds the compensation-plan negotiation loop. A plan may be returned from SUBMITTED
      back to DRAFT for redrafting only while it still has returns left; the request that
      arrives once the allowance is exhausted terminates the plan as WITHDRAWN instead of
      cycling it again. The counter is incremented on BOTH outcomes, so the terminal row
      carries MAX_PLAN_RETURNS + 1.
    trigger: "on the CompensationPlan SUBMITTED -> DRAFT and SUBMITTED -> WITHDRAWN transitions, including the cascaded returns from the Acquisition compliance_clearance CLEARED -> FLAGGED transition and from POST /performance-reports"
    inputs:
      - CompensationPlan.returned_count
    algorithm: threshold
    formula: |
      # Evaluated when a SUBMITTED plan is sent back with target_status DRAFT.
      if returned_count < MAX_PLAN_RETURNS:
          returned_count = returned_count + 1
          status         = DRAFT              # the revision cycle continues
      else:                                   # returned_count == MAX_PLAN_RETURNS
          returned_count = returned_count + 1
          status         = WITHDRAWN          # terminal; the cycle cannot continue

      # With MAX_PLAN_RETURNS == 2 the observable sequence for one plan is
      #   returned_count 0 -> 1 (DRAFT), 1 -> 2 (DRAFT), 2 -> 3 (WITHDRAWN).
      # returned_count is initialised to 0 by POST /compensation-plans and is never
      # reset thereafter; a fresh allowance requires designing a new plan row.
    constants:
      MAX_PLAN_RETURNS: 2
    precision: "whole counts; no rounding"

  - name: credentialing_committee_cycle_key
    description: |
      The payer credentialing committee seats packages in fixed cycles. A package belongs to
      the cycle whose meeting date is the earliest meeting on or after its submission date —
      a half-open, lower-inclusive assignment, so a package filed ON a meeting date belongs
      to that meeting rather than to the next one.
    trigger: "on POST /credentialing-packages"
    inputs:
      - CredentialingPackage.submitted_on
    algorithm: chronological
    formula: |
      # Committee meets on the 1st and the 15th of every month.
      candidates = every date d with day-of-month in COMMITTEE_MEETING_DAYS
      committee_cycle_key = min(d for d in candidates if d >= submitted_on)   # ISO YYYY-MM-DD

      # Lower-inclusive: submitted_on == 2026-09-15 -> cycle 2026-09-15
      #                  submitted_on == 2026-09-16 -> cycle 2026-10-01
    constants:
      COMMITTEE_MEETING_DAYS: [1, 15]
    precision: "whole calendar days; no time component"

  - name: credentialing_projected_effective_date
    description: |
      Earliest date a re-credentialed provider can bill under a payer. The payer's processing
      lead time is added to the submission date, and the result is then pushed forward to the
      next committee meeting date. The package is only viable if that effective date lands on
      or before the target close date extended by the payer's retro-billing window.
    trigger: "on POST /credentialing-packages, and re-checked on the DRAFT -> SUBMITTED transition"
    inputs:
      - CredentialingPackage.submitted_on
      - PayerContract.payer_type
      - Acquisition.target_close_on
    algorithm: chronological
    formula: |
      lead_days            = PAYER_LEAD_DAYS[payer_type]
      earliest             = submitted_on + lead_days days
      projected_effective_on = min(d for d in committee meeting dates if d >= earliest)

      retro_days           = RETRO_BILLING_WINDOW_DAYS[payer_type]
      retro_billing_allowed = (retro_days > 0)
      viability_limit      = target_close_on + retro_days days

      viable = (projected_effective_on <= viability_limit)
      # not viable -> ERR_CREDENTIALING_LEAD_TIME_MISSED on the SUBMITTED transition.
      # A projected effective date landing exactly ON the viability limit IS viable.
    constants:
      COMMITTEE_MEETING_DAYS: [1, 15]
      PAYER_LEAD_DAYS:
        COMMERCIAL: 90
        MANAGED_MEDICARE: 75
        MEDICARE: 60
        MEDICAID: 120
      RETRO_BILLING_WINDOW_DAYS:
        COMMERCIAL: 0
        MANAGED_MEDICARE: 0
        MEDICARE: 30
        MEDICAID: 0
    precision: "whole calendar days; no time component"

  - name: payer_contract_interval_overlap
    description: |
      Two agreements with the same payer on the same acquisition may not cover overlapping
      terms. The term is a CLOSED interval on both ends, so two contracts that merely touch —
      one terminating on the very day the next becomes effective — do collide; a single day of
      gap is required. Contracts the payer denied or that were terminated are excluded from
      the comparison because they cover nothing.
    trigger: "on POST /payer-contracts"
    inputs:
      - PayerContract.acquisition_id
      - PayerContract.payer_name
      - PayerContract.effective_on
      - PayerContract.terminates_on
      - PayerContract.novation_status
    algorithm: interval_merge
    formula: |
      peers = PayerContract rows with the same acquisition_id and the same payer_name
              whose novation_status is NOT in {DENIED, TERMINATED}

      for each peer:
          # closed [effective_on, terminates_on] on both ends
          if new.effective_on <= peer.terminates_on
             and peer.effective_on <= new.terminates_on:
                 -> ERR_PAYER_CONTRACT_INTERVAL_OVERLAP

      # new.effective_on == peer.terminates_on            -> OVERLAP (touching collides)
      # new.effective_on == peer.terminates_on + 1 day    -> accepted
    constants: {}
    precision: "whole calendar days; closed on both endpoints"

  - name: ehr_reconciliation_match_rate
    description: |
      Reconciliation quality of a migration batch, and the conservation of its record counts.
      The match rate truncates rather than rounds, so a batch cannot round its way up to the
      reconciliation floor. Records are conserved across every failure and requeue: validated
      plus defect plus unprocessed always equals the original record count.
    trigger: "on the EhrMigrationBatch RECONCILE action, and on the REQUEUE action which resets the counters"
    inputs:
      - EhrMigrationBatch.record_count
      - "validated_count supplied by the RECONCILE action"
      - "defect_count supplied by the RECONCILE action"
    algorithm: aggregation
    formula: |
      if record_count == 0:
          -> ERR_EMPTY_MIGRATION_BATCH
      if validated_count + defect_count > record_count:
          -> ERR_MIGRATION_COUNT_INVALID

      match_rate_bps    = floor(validated_count * 10000 / record_count)    # truncated
      unprocessed_count = record_count - validated_count - defect_count

      outcome = RECONCILED if match_rate_bps >= RECONCILE_MIN_BPS else FAILED

      # Invariant after every action:
      #   validated_count + defect_count + unprocessed_count == record_count
      # REQUEUE resets validated_count and defect_count to 0, so unprocessed_count
      # returns to exactly record_count.
    constants:
      RECONCILE_MIN_BPS: 9950
      MAX_MIGRATION_RETRIES: 2
    precision: "integer basis points, truncated toward zero (floor); never rounded up"

  - name: legacy_retention_years
    description: |
      How long the legacy chart must be retained before it becomes purge-eligible. Imaging
      studies carry a shorter statutory base than other records, but any batch containing a
      minor's record must be held until that patient would reach the age of majority plus the
      adult retention period, whichever is longer.
    trigger: "on POST /ehr-migration-batches"
    inputs:
      - EhrMigrationBatch.chart_type
      - EhrMigrationBatch.contains_minor_records
      - EhrMigrationBatch.youngest_patient_age_years
      - EhrMigrationBatch.last_encounter_on
    algorithm: threshold
    formula: |
      base_years = IMAGING_RETENTION_YEARS if chart_type == IMAGING
                                           else DEFAULT_RETENTION_YEARS

      if contains_minor_records:
          minor_years = MINOR_RETENTION_AGE_YEARS - youngest_patient_age_years
          retention_years = max(base_years, minor_years)
      else:
          retention_years = base_years

      legacy_purge_eligible_on = last_encounter_on + retention_years calendar years
                                 (same month and day-of-month; 29 February maps to
                                  28 February in a non-leap target year)
    constants:
      DEFAULT_RETENTION_YEARS: 10
      IMAGING_RETENTION_YEARS: 7
      MINOR_RETENTION_AGE_YEARS: 21
    precision: "whole years and whole calendar days"

  - name: patient_notice_coverage
    description: |
      Whether the patient notification for a billing conversion is adequate. Coverage is
      truncated, so notifying all but one patient never rounds up to complete coverage, and
      the notice must precede the effective date by the full statutory lead time.
    trigger: "on POST /billing-conversions, and re-checked on the ATTESTED -> NOTICES_ISSUED transition"
    inputs:
      - BillingConversion.required_notice_count
      - BillingConversion.notified_patient_count
      - BillingConversion.notices_issued_on
      - BillingConversion.effective_on
      - BillingConversion.conversion_type
    algorithm: threshold
    formula: |
      notice_coverage_bps = floor(notified_patient_count * 10000
                                  / required_notice_count)          # truncated
      notice_lead_days    = effective_on - notices_issued_on in whole days
                            (null while notices_issued_on is null)

      adequate = (notice_coverage_bps >= 10000)
                 and (notice_lead_days >= PATIENT_NOTICE_LEAD_DAYS)
      # exactly PATIENT_NOTICE_LEAD_DAYS days of lead time IS adequate

      provider_based_uplift_bps = PROVIDER_BASED_UPLIFT_BPS
                                  if conversion_type == PROVIDER_BASED_DEPARTMENT else 0
    constants:
      PATIENT_NOTICE_LEAD_DAYS: 30
      FULL_COVERAGE_BPS: 10000
      PROVIDER_BASED_UPLIFT_BPS: 4000
    precision: "integer basis points, truncated toward zero (floor); whole calendar days"

  - name: malpractice_tail_premium
    description: |
      Cost of prior-acts (tail) coverage. Only a claims-made policy leaves an uncovered tail;
      an occurrence policy needs none and prices at exactly zero. The premium scales with the
      specialty's tail rate and with the purchased months relative to the standard tail term.
    trigger: "on the Acquisition deal_status DILIGENCE -> BOARD_REVIEW transition"
    inputs:
      - Acquisition.malpractice_policy_form
      - Acquisition.specialty
      - Acquisition.annual_malpractice_premium_cents
      - Acquisition.tail_coverage_months
    algorithm: threshold
    formula: |
      tail_coverage_required = (malpractice_policy_form == CLAIMS_MADE)

      if not tail_coverage_required:
          tail_premium_cents = 0
      else:
          rate_bps = TAIL_PREMIUM_RATE_BPS[specialty]
          tail_premium_cents = rhu(annual_malpractice_premium_cents
                                    * rate_bps / 10000
                                    * tail_coverage_months / TAIL_MIN_MONTHS)

      # The DILIGENCE -> BOARD_REVIEW transition additionally requires
      # tail_coverage_months >= TAIL_MIN_MONTHS whenever tail_coverage_required is true.
    constants:
      TAIL_MIN_MONTHS: 60
      TAIL_PREMIUM_RATE_BPS:
        PRIMARY_CARE: 15000
        CARDIOLOGY: 22500
        ORTHOPEDICS: 30000
        ONCOLOGY: 20000
    precision: "whole cents, round_half_up, applied once at the end"

  - name: hr_staffing_coverage
    description: |
      Share of the required non-physician headcount that has been offered or filled. Offers
      still in DRAFT do not count; extended and accepted offers both do, because an extended
      offer holds a seat as well as pool money.
    trigger: "on every StaffTransitionOffer transition into or out of EXTENDED or ACCEPTED"
    inputs:
      - Acquisition.required_staff_headcount
      - "the count of StaffTransitionOffer rows with status IN {EXTENDED, ACCEPTED}"
    algorithm: aggregation
    formula: |
      covered = count of StaffTransitionOffer rows with status in {EXTENDED, ACCEPTED}
      hr_staffing_coverage_pct = rhu(covered * 100 / required_staff_headcount, 2)

      # HR_STAFFING_PLAN may only be completed when
      #   hr_staffing_coverage_pct >= HR_COVERAGE_MIN_PCT
      # and exactly HR_COVERAGE_MIN_PCT is sufficient.
    constants:
      HR_COVERAGE_MIN_PCT: 80.00
    precision: "2 decimal places, round_half_up"

  - name: acquisition_readiness_posture
    description: |
      Day-one readiness of the acquisition, derived from its blocking checklist tasks. Only
      tasks with is_blocking true participate. An acquisition with no blocking tasks at all is
      BLOCKED, not READY — an empty checklist is treated as an unbuilt checklist rather than a
      vacuously satisfied one.
    trigger: "on POST /readiness-tasks, on every ReadinessTask transition, on every cascade that changes a ReadinessTask, and on the Acquisition deal_status transitions into DILIGENCE and SIGNED"
    inputs:
      - "ReadinessTask rows for the acquisition with is_blocking == true"
    algorithm: aggregation
    formula: |
      blocking = ReadinessTask rows for this acquisition_id with is_blocking == true

      if count(blocking) == 0:
          readiness_posture = BLOCKED           # empty checklist is never READY
      elif any(t.status == FAILED for t in blocking):
          readiness_posture = BLOCKED
      elif any(t.status in {OPEN, IN_PROGRESS} for t in blocking):
          readiness_posture = AT_RISK
      else:                                     # every blocking task COMPLETE or WAIVED
          readiness_posture = READY

      # Non-blocking tasks never affect the posture, in any status.
    constants: {}
    precision: "not applicable; enumerated result"

# =============================================================================
# §1.4 Validation Rules Table (strictly ordered by priority)
#
# When a single request violates several rules, the lowest priority number wins
# and its error_id is the one returned. The ordering is total: no two rules share
# a priority.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "A missing header, an empty-string header or an unrecognised role value is rejected before anything else is looked at."

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "Role gate. Evaluated before the request body is parsed, so a forbidden role never learns whether its payload was well formed."

  - priority: 3
    category: validation
    check: "request body and query parameters satisfy the declared schema: required fields present, types correct, enum values recognised, dates in YYYY-MM-DD form, instants in ISO 8601 UTC form, money and count fields non-negative, limit within 1..100 and offset non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Schema gate, including the intra-body constraints terminates_on >= effective_on, discount_rate_bps > terminal_growth_bps, youngest_patient_age_years present when contains_minor_records is true, and indemnity_cap_cents present and at least estimated_amount_cents when disposition INDEMNIFIED is requested."

  - priority: 4
    category: existence
    check: "every identifier in the URL path resolves to a stored entity"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "One shared not-found code for every entity type; the message names the entity but the error_id does not."

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves to a stored entity: acquisition_id, physician_id, payer_contract_id, applied_comp_plan_id"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /physicians, POST /valuation-opinions, POST /compensation-plans, POST /payer-contracts, POST /credentialing-packages, POST /ehr-migration-batches, POST /staff-transition-offers, POST /billing-conversions, POST /readiness-tasks, POST /liability-items, POST /performance-reports"
    description: "Body references are resolved before any cross-reference consistency check, so an unknown id is never reported as a scope mismatch."

  - priority: 6
    category: business_referential
    check: "all foreign keys in one request body belong to the same acquisition"
    error_id: ERR_ACQUISITION_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /compensation-plans, POST /credentialing-packages, POST /performance-reports"
    description: "A CredentialingPackage's physician_id and payer_contract_id must both carry the request's acquisition_id; a PerformanceReport's physician_id and applied_comp_plan_id must both belong to the named acquisition and the plan must belong to that physician."

  - priority: 7
    category: constraint
    check: "npi is not already used by another Physician"
    error_id: ERR_DUPLICATE_NPI
    http_status: 409
    applies_to: "POST /physicians"
    description: "National Provider Identifiers are globally unique, across acquisitions, not merely within one deal."

  - priority: 8
    category: constraint
    check: "task_code is not already used by another ReadinessTask on the same acquisition"
    error_id: ERR_DUPLICATE_TASK_CODE
    http_status: 409
    applies_to: "POST /readiness-tasks"
    description: "The day-one checklist holds at most one row per checklist line per deal."

  - priority: 9
    category: constraint
    check: "batch_label is not already used by another EhrMigrationBatch on the same acquisition"
    error_id: ERR_DUPLICATE_BATCH_LABEL
    http_status: 409
    applies_to: "POST /ehr-migration-batches"
    description: "Batch labels are unique per acquisition and may be reused across acquisitions."

  - priority: 10
    category: constraint
    check: "no other CredentialingPackage for the same physician_id and payer_contract_id is in status DRAFT, SUBMITTED, IN_REVIEW or APPROVED"
    error_id: ERR_DUPLICATE_CREDENTIALING_PACKAGE
    http_status: 409
    applies_to: "POST /credentialing-packages"
    description: "One live package per provider per payer. A DENIED or WITHDRAWN package does not block a fresh filing."

  - priority: 11
    category: constraint
    check: "no other PerformanceReport exists for the same physician_id and period_start_on"
    error_id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: "POST /performance-reports"
    description: "Performance reports are append-only and one per physician per month; a period may never be restated."

  - priority: 12
    category: auth
    check: "the caller owns the record being acted on"
    error_id: ERR_NOT_PLAN_OWNER
    http_status: 403
    applies_to: "POST /valuation-opinions/{opinionId}/status, POST /compensation-plans/{planId}/status"
    description: "Submitting an opinion requires the caller's X-User-Id to equal prepared_by_user_id; executing a compensation plan requires the caller's resolved Physician id to equal the plan's physician_id."

  - priority: 13
    category: concurrency
    check: "expected_acquisition_version equals the stored Acquisition.version"
    error_id: ERR_STALE_ACQUISITION_VERSION
    http_status: 412
    applies_to: "POST /valuation-opinions, POST /compensation-plans"
    description: "Optimistic concurrency control on the acquisition aggregate, per §1.2.1. Checked after existence and scope but before any state or business rule, so a stale reader is told to re-read rather than being handed a business error derived from a version it never saw."

  - priority: 14
    category: state
    check: "the requested transition exists in the entity's state machine for its current state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
    description: "Includes every terminal-state lockdown and every repeat of an already-applied transition. Outranks every business rule, so an action that is both out of sequence and fiscally impossible reports the sequencing failure."

  - priority: 15
    category: state
    check: "the parent Acquisition.compliance_clearance is not FLAGGED or SUSPENDED"
    error_id: ERR_COMPLIANCE_CLEARANCE_BLOCKED
    http_status: 403
    applies_to: "POST /physicians, POST /valuation-opinions, POST /compensation-plans, POST /payer-contracts, POST /credentialing-packages, POST /credentialing-packages/{packageId}/status, POST /ehr-migration-batches, POST /ehr-migration-batches/{batchId}/progress, POST /staff-transition-offers, POST /staff-transition-offers/{offerId}/status, POST /billing-conversions, POST /billing-conversions/{conversionId}/status, POST /liability-items, POST /liability-items/{itemId}/disposition, POST /acquisitions/{acquisitionId}/status, POST /performance-reports"
    description: "A flagged or suspended deal is frozen for new work. Exempt: every GET, POST /acquisitions, POST /acquisitions/{acquisitionId}/compliance-clearance (the only way out), POST /compensation-plans/{planId}/status and POST /readiness-tasks plus POST /readiness-tasks/{taskId}/status (remediation must remain possible while flagged)."

  - priority: 16
    category: auth
    check: "the acting user is not the same individual who performed the incompatible prior step"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /valuation-opinions/{opinionId}/status, POST /compensation-plans/{planId}/status"
    description: "A ValuationAnalyst's own opinion may not be accepted or rejected by that same user id, and the ComplianceOfficer user id recorded in the pinned FMV opinion's accepted_by_user_id may not approve any CompensationPlan on that acquisition."

  - priority: 17
    category: business_safety
    check: "CompensationPlan.includes_referral_credit is false"
    error_id: ERR_REFERRAL_LINKED_COMPENSATION
    http_status: 422
    applies_to: "POST /compensation-plans/{planId}/status with target_status SUBMITTED, POST /acquisitions/{acquisitionId}/compliance-clearance with target_clearance CLEARED"
    description: "Compensation varying with the volume or value of referrals is categorically prohibited and is the highest-priority business rule in the domain."

  - priority: 18
    category: business_safety
    check: "CompensationPlan.stark_exception is not NONE"
    error_id: ERR_STARK_EXCEPTION_REQUIRED
    http_status: 422
    applies_to: "POST /compensation-plans/{planId}/status with target_status SUBMITTED"
    description: "Every physician arrangement must name the referral-prohibition exception it relies upon."

  - priority: 19
    category: business_safety
    check: "CompensationPlan.benchmark_percentile is not greater than FMV_SAFE_HARBOR_PERCENTILE, or fmv_justification_on_file is true"
    error_id: ERR_COMP_EXCEEDS_FMV_SAFE_HARBOR
    http_status: 422
    applies_to: "POST /compensation-plans/{planId}/status with target_status APPROVED or EXECUTED"
    description: "Exactly 90.00 is inside the safe harbour; only a percentile strictly above it requires a written justification on file."

  - priority: 20
    category: business_safety
    check: "the linked Physician's state_license_expires_on is not before the current logical date"
    error_id: ERR_PHYSICIAN_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /compensation-plans/{planId}/status with target_status SUBMITTED, POST /credentialing-packages/{packageId}/status with target_status SUBMITTED"
    description: "An unlicensed provider may neither be put forward for compensation nor filed with a payer. A licence expiring exactly today is still valid."

  - priority: 21
    category: business_safety
    check: "when Acquisition.tail_coverage_required is true, tail_coverage_months is at least TAIL_MIN_MONTHS"
    error_id: ERR_TAIL_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status BOARD_REVIEW"
    description: "A claims-made policy leaves an uncovered tail; the board may not review a deal that has not bought at least the standard tail term. An occurrence policy is exempt entirely."

  - priority: 22
    category: business_constraint
    check: "the valuation inputs required by the chosen method are all present"
    error_id: ERR_MISSING_VALUATION_INPUT
    http_status: 422
    applies_to: "POST /valuation-opinions"
    description: "INCOME_APPROACH requires normalized_ebitda_cents, projection_years, ebitda_growth_bps, discount_rate_bps and terminal_growth_bps; MARKET_APPROACH requires normalized_ebitda_cents and market_multiple_bps; NARRATIVE requires cr_conclusion."

  - priority: 23
    category: business_constraint
    check: "method is compatible with opinion_type"
    error_id: ERR_OPINION_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /valuation-opinions"
    description: "opinion_type FMV requires method INCOME_APPROACH or MARKET_APPROACH; opinion_type COMMERCIAL_REASONABLENESS requires method NARRATIVE."

  - priority: 24
    category: business_constraint
    check: "ValuationOpinion.independence_attested is true"
    error_id: ERR_VALUER_INDEPENDENCE_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /valuation-opinions/{opinionId}/status with target_status SUBMITTED"
    description: "An opinion may be drafted without an independence attestation but may never be submitted without one."

  - priority: 25
    category: business_constraint
    check: "the requested disposition is legal for the acquisition's structure and the item's category"
    error_id: ERR_LIABILITY_DISPOSITION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /liability-items/{itemId}/disposition"
    description: "When Acquisition.structure is EQUITY, disposition EXCLUDED is not permitted for categories MALPRACTICE_TAIL, STARK_SELF_DISCLOSURE or PAYER_REFUND_EXPOSURE, because an equity buyer takes the entity with its whole history. When Acquisition.structure is ASSET, disposition ASSUMED is not permitted for category STARK_SELF_DISCLOSURE. Every other combination is permitted."

  - priority: 26
    category: business_constraint
    check: "a non-empty waiver_justification accompanies a waiver"
    error_id: ERR_WAIVER_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /readiness-tasks/{taskId}/status with target_status WAIVED"
    description: "A blocking checklist line may only be waived on the record; whitespace alone is not a justification."

  - priority: 27
    category: business_constraint
    check: "EhrMigrationBatch.record_count is greater than 0"
    error_id: ERR_EMPTY_MIGRATION_BATCH
    http_status: 422
    applies_to: "POST /ehr-migration-batches/{batchId}/progress with action EXTRACT"
    description: "A batch may be staged empty as a placeholder but can never be extracted, because an empty batch has no defined match rate."

  - priority: 28
    category: business_constraint
    check: "validated_count plus defect_count does not exceed record_count"
    error_id: ERR_MIGRATION_COUNT_INVALID
    http_status: 422
    applies_to: "POST /ehr-migration-batches/{batchId}/progress with action RECONCILE"
    description: "Record conservation is enforced on input, so unprocessed_count can never go negative."

  - priority: 29
    category: business_constraint
    check: "the reporting period is a single whole calendar month that begins on or after the acquisition's close date"
    error_id: ERR_INVALID_REPORT_PERIOD
    http_status: 422
    applies_to: "POST /performance-reports"
    description: "period_start_on must be the first day of a month, period_end_on the last day of that same month, and period_start_on must not precede the calendar date of Acquisition.closed_at."

  - priority: 30
    category: business_temporal
    check: "the governing ValuationOpinion's expires_on is not before the current logical date"
    error_id: ERR_VALUATION_OPINION_EXPIRED
    http_status: 422
    applies_to: "POST /valuation-opinions/{opinionId}/status with target_status ACCEPTED, POST /compensation-plans/{planId}/status with target_status APPROVED, POST /acquisitions/{acquisitionId}/status with target_status BOARD_REVIEW"
    description: "A valuation goes stale twelve months after its effective date. An opinion expiring exactly today is still usable. Ranked below the safe-harbour rule, so an over-percentile plan approved against a stale opinion reports the compensation defect, not the staleness."

  - priority: 31
    category: business_temporal
    check: "the new contract term does not overlap a live term for the same payer on the same acquisition"
    error_id: ERR_PAYER_CONTRACT_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /payer-contracts"
    description: "Closed intervals on both endpoints, per calculations.payer_contract_interval_overlap; a contract effective on the day a peer terminates does overlap it. DENIED and TERMINATED peers are ignored."

  - priority: 32
    category: business_temporal
    check: "the payer's committee cycle still has a free slot"
    error_id: ERR_COMMITTEE_CYCLE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /credentialing-packages/{packageId}/status with target_status SUBMITTED"
    description: "An aggregate limit: each package is individually viable, but at most committee_slots_per_cycle of them may occupy one committee_cycle_key on a given payer contract in statuses SUBMITTED, IN_REVIEW or APPROVED. Withdrawing a package frees its slot."

  - priority: 33
    category: business_temporal
    check: "projected_effective_on is not after target_close_on plus the payer's retro-billing window"
    error_id: ERR_CREDENTIALING_LEAD_TIME_MISSED
    http_status: 422
    applies_to: "POST /credentialing-packages/{packageId}/status with target_status SUBMITTED"
    description: "Landing exactly on the limit is viable; one day past it is not. Only MEDICARE carries a non-zero retro-billing window, so an identical filing date can be viable for MEDICARE and fatal for COMMERCIAL."

  - priority: 34
    category: business_temporal
    check: "notice_lead_days is at least PATIENT_NOTICE_LEAD_DAYS"
    error_id: ERR_PATIENT_NOTICE_LEAD_TIME_SHORT
    http_status: 422
    applies_to: "POST /billing-conversions/{conversionId}/status with target_status NOTICES_ISSUED"
    description: "Exactly thirty days of lead time is adequate; twenty-nine is not."

  - priority: 35
    category: business_referential
    check: "notice_coverage_bps is at least FULL_COVERAGE_BPS"
    error_id: ERR_PATIENT_NOTICE_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /billing-conversions/{conversionId}/status with target_status NOTICES_ISSUED"
    description: "Every affected patient must be notified. Coverage is truncated, so one missed patient out of twelve hundred reports 9991 bps and fails."

  - priority: 36
    category: business_referential
    check: "a pinned ACCEPTED ValuationOpinion with opinion_type FMV exists on the acquisition"
    error_id: ERR_FMV_OPINION_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /compensation-plans/{planId}/status with target_status APPROVED"
    description: "Compensation may only be approved against the valuation the board actually pinned, which means the deal must already have reached BOARD_REVIEW."

  - priority: 37
    category: business_referential
    check: "an ACCEPTED COMMERCIAL_REASONABLENESS opinion with cr_conclusion REASONABLE exists on the acquisition"
    error_id: ERR_COMMERCIAL_REASONABLENESS_NOT_ESTABLISHED
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status BOARD_REVIEW"
    description: "Fair market value alone is not sufficient; the arrangement must also be commercially reasonable, and a NOT_REASONABLE conclusion blocks the board review as firmly as a missing opinion."

  - priority: 38
    category: business_referential
    check: "every Physician on the acquisition has a CompensationPlan in status APPROVED or EXECUTED"
    error_id: ERR_COMP_PLAN_MISSING
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status SIGNED"
    description: "No physician may be left without a signed-off arrangement at signing."

  - priority: 39
    category: business_referential
    check: "the compensation plan the operation depends on has actually been executed"
    error_id: ERR_NO_EXECUTED_COMP_PLAN
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status CLOSED, POST /performance-reports"
    description: "Closing requires at least one EXECUTED plan per physician; a performance report requires its applied_comp_plan_id to be in status EXECUTED or COMPLIANCE_HOLD."

  - priority: 40
    category: business_referential
    check: "no LiabilityItem on the acquisition is still in disposition UNASSIGNED"
    error_id: ERR_LIABILITY_UNASSIGNED
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status SIGNED"
    description: "Every scheduled exposure must be allocated before signature. An acquisition with no liability items at all satisfies this rule vacuously."

  - priority: 41
    category: business_referential
    check: "Acquisition.readiness_posture is READY"
    error_id: ERR_READINESS_NOT_READY
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status CLOSED"
    description: "Derived from the blocking checklist by calculations.acquisition_readiness_posture. An acquisition with no blocking tasks is BLOCKED and therefore fails here."

  - priority: 42
    category: business_referential
    check: "the payer novation the operation depends on is complete"
    error_id: ERR_PAYER_NOVATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status CLOSED, POST /billing-conversions/{conversionId}/status with target_status CONVERTED"
    description: "Closing requires every PayerContract to be NOVATED or TERMINATED; converting a provider-based department additionally requires a NOVATED MEDICARE contract on that acquisition."

  - priority: 43
    category: business_referential
    check: "every EhrMigrationBatch on the acquisition is in status RECONCILED or ABORTED"
    error_id: ERR_MIGRATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status CLOSED, POST /readiness-tasks/{taskId}/status with target_status COMPLETE"
    description: "A batch still in flight blocks both the IT_DATA_MIGRATION checklist line and the close itself."

  - priority: 44
    category: business_referential
    check: "Acquisition.deal_status is CLOSED"
    error_id: ERR_ACQUISITION_NOT_CLOSED
    http_status: 422
    applies_to: "POST /performance-reports"
    description: "Post-close performance tracking only exists after the deal has actually closed."

  - priority: 45
    category: business_fiscal
    check: "StaffTransitionOffer.retention_bonus_cents does not exceed Acquisition.retention_pool_available_cents"
    error_id: ERR_RETENTION_POOL_EXCEEDED
    http_status: 422
    applies_to: "POST /staff-transition-offers/{offerId}/status with target_status EXTENDED"
    description: "The pool is checked at commitment time, not at creation time, so an offer may be drafted for more than the pool can bear and only fail when it is extended. Ranked below the state rule, so re-extending an already-extended offer against a depleted pool reports the invalid transition."

  - priority: 46
    category: business_fiscal
    check: "LiabilityItem.estimated_amount_cents does not exceed Acquisition.escrow_available_cents"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /liability-items/{itemId}/disposition with target_disposition ESCROWED"
    description: "Escrow is committed item by item and is released in full when an escrowed item is later excluded."

  - priority: 47
    category: business_fiscal
    check: "when Acquisition.tail_coverage_required is true, escrow_total_cents is at least tail_premium_cents"
    error_id: ERR_TAIL_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /acquisitions/{acquisitionId}/status with target_status SIGNED"
    description: "The escrow must be able to fund the computed tail premium at signature. The last rule in the order: a deal that fails several rules at once never reports this one."

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat topology: every collection is a root-level path. Children are created by
# POSTing their foreign keys in the body and are discovered through the filtered
# list endpoints, each of which accepts every one of the child's FK fields as an
# optional query parameter. Every list endpoint is paginated with limit/offset.
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock to an arbitrary instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time. Every date-sensitive rule in this scaffold (opinion expiry, credentialing lead time, offer expiry, patient-notice lead time, licence expiry) is evaluated against this clock."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "sets the logical clock; all subsequent reads of the current date and instant use this value"

  - method: POST
    path: "/acquisitions"
    description: "Open a new practice acquisition in SOURCING with compliance_clearance PENDING."
    roles: [DealLead]
    code: 201
    input: ["target_practice_name", "specialty", "structure", "malpractice_policy_form", "annual_malpractice_premium_cents", "tail_coverage_months?", "trailing_annual_collections_cents", "target_close_on", "required_staff_headcount", "retention_pool_total_cents", "escrow_total_cents"]
    output: Acquisition
    side_effects:
      - "computes tail_coverage_required from malpractice_policy_form"
      - "initialises retention_pool_committed_cents and escrow_committed_cents to 0 and the available balances to their totals"
      - "sets deal_status to SOURCING, compliance_clearance to PENDING and readiness_posture to BLOCKED"
      - "sets hr_staffing_coverage_pct to 0.00"

  - method: GET
    path: "/acquisitions"
    description: "List acquisitions, optionally filtered by workflow dimension."
    roles: [DealLead, ValuationAnalyst, ComplianceOfficer, CompensationDesigner, IntegrationManager]
    code: 200
    input: ["deal_status?", "compliance_clearance?", "readiness_posture?", "specialty?", "structure?", "limit?", "offset?"]
    output: Acquisition[]
    side_effects: []

  - method: GET
    path: "/acquisitions/{acquisitionId}"
    description: "Read one acquisition, including its current version for optimistic concurrency control and all derived ledger balances."
    roles: [DealLead, ValuationAnalyst, ComplianceOfficer, CompensationDesigner, IntegrationManager]
    code: 200
    input: []
    output: Acquisition
    side_effects: []

  - method: POST
    path: "/acquisitions/{acquisitionId}/status"
    description: "Advance or revert the acquisition's deal_status dimension."
    roles: [DealLead]
    code: 200
    input: ["target_status", "abandoned_reason?"]
    output: Acquisition
    side_effects:
      - "applies the §1.2 Acquisition.deal_status transition and all of its side effects"
      - "on DILIGENCE -> BOARD_REVIEW pins the ACCEPTED FMV opinion, runs calculations.malpractice_tail_premium and calculations.deal_net_consideration"
      - "on BOARD_REVIEW -> DILIGENCE unpins the FMV opinion, clears the consideration fields and returns SUBMITTED compensation plans to DRAFT"
      - "on any transition into CLOSED or ABANDONED supersedes non-terminal valuation opinions"
      - "recomputes Acquisition.readiness_posture"

  - method: POST
    path: "/acquisitions/{acquisitionId}/compliance-clearance"
    description: "Move the acquisition's independent compliance_clearance dimension. The only endpoint exempt from the clearance gate itself, so a flagged or suspended deal can always be brought back."
    roles: [ComplianceOfficer]
    code: 200
    input: ["target_clearance", "clearance_note?"]
    output: Acquisition
    side_effects:
      - "applies the §1.2 Acquisition.compliance_clearance transition and all of its side effects"
      - "on CLEARED -> FLAGGED returns every SUBMITTED compensation plan to DRAFT and increments each returned_count by 1"
      - "on FLAGGED -> SUSPENDED rescinds every DRAFT staff transition offer"

  - method: POST
    path: "/physicians"
    description: "Register a physician joining the acquisition."
    roles: [DealLead]
    code: 201
    input: ["acquisition_id", "npi", "full_name", "specialty", "board_certified?", "state_license_expires_on"]
    output: Physician
    side_effects:
      - "sets employment_status to PROSPECTIVE"

  - method: GET
    path: "/physicians"
    description: "List physicians, filtered by acquisition or employment status. Reverse-reachability channel for Physician.acquisition_id."
    roles: [DealLead, ValuationAnalyst, ComplianceOfficer, CompensationDesigner, IntegrationManager, PracticePhysician]
    code: 200
    input: ["acquisition_id?", "employment_status?", "specialty?", "board_certified?", "limit?", "offset?"]
    output: Physician[]
    side_effects: []

  - method: GET
    path: "/physicians/{physicianId}"
    description: "Read one physician, including the derived employment_status."
    roles: [DealLead, ValuationAnalyst, ComplianceOfficer, CompensationDesigner, IntegrationManager, PracticePhysician]
    code: 200
    input: []
    output: Physician
    side_effects: []

  - method: POST
    path: "/valuation-opinions"
    description: "File a fair market value or commercial reasonableness opinion. Optimistically concurrent on the acquisition aggregate: expected_acquisition_version must equal the version the caller last read."
    roles: [ValuationAnalyst]
    code: 201
    input: ["acquisition_id", "expected_acquisition_version", "opinion_type", "method", "normalized_ebitda_cents?", "projection_years?", "ebitda_growth_bps?", "discount_rate_bps?", "terminal_growth_bps?", "market_multiple_bps?", "cr_conclusion?", "independence_attested", "effective_on"]
    output: ValuationOpinion
    side_effects:
      - "runs calculations.fmv_concluded_value and stores concluded_value_cents"
      - "computes expires_on as effective_on plus OPINION_VALIDITY_MONTHS months"
      - "stores the caller's X-User-Id in prepared_by_user_id"
      - "sets status to DRAFT and is_pinned to false"
      - "increments Acquisition.version by 1"

  - method: GET
    path: "/valuation-opinions"
    description: "List valuation opinions. Reverse-reachability channel for ValuationOpinion.acquisition_id."
    roles: [ValuationAnalyst, ComplianceOfficer, DealLead]
    code: 200
    input: ["acquisition_id?", "opinion_type?", "method?", "status?", "is_pinned?", "limit?", "offset?"]
    output: ValuationOpinion[]
    side_effects: []

  - method: GET
    path: "/valuation-opinions/{opinionId}"
    description: "Read one valuation opinion, including its concluded value, expiry and pinning flag."
    roles: [ValuationAnalyst, ComplianceOfficer, DealLead]
    code: 200
    input: []
    output: ValuationOpinion
    side_effects: []

  - method: POST
    path: "/valuation-opinions/{opinionId}/status"
    description: "Submit, return, accept, reject or supersede a valuation opinion. The analyst who prepared it may only submit it; acceptance and rejection belong to a different individual."
    roles: [ValuationAnalyst, ComplianceOfficer]
    code: 200
    input: ["target_status", "review_note?"]
    output: ValuationOpinion
    side_effects:
      - "applies the §1.2 ValuationOpinion.status transition"
      - "on acceptance stores the caller's X-User-Id in accepted_by_user_id"

  - method: POST
    path: "/compensation-plans"
    description: "Design a physician compensation plan. Optimistically concurrent on the acquisition aggregate: expected_acquisition_version must equal the version the caller last read."
    roles: [CompensationDesigner]
    code: 201
    input: ["acquisition_id", "expected_acquisition_version", "physician_id", "model_type", "base_salary_cents?", "conversion_factor_cents_per_wrvu?", "threshold_wrvu?", "projected_annual_wrvu?", "includes_referral_credit?", "stark_exception", "fmv_justification_on_file?"]
    output: CompensationPlan
    side_effects:
      - "runs calculations.projected_total_cash_comp and stores projected_total_cash_comp_cents and comp_per_wrvu_cents"
      - "runs calculations.compensation_benchmark_percentile and stores benchmark_basis and benchmark_percentile"
      - "sets status to DRAFT, returned_count to 0, actual_ytd_wrvu to 0, months_elapsed to 0 and comp_true_up_cents to 0"
      - "increments Acquisition.version by 1"

  - method: GET
    path: "/compensation-plans"
    description: "List compensation plans. Reverse-reachability channel for CompensationPlan.acquisition_id and CompensationPlan.physician_id."
    roles: [CompensationDesigner, ComplianceOfficer, DealLead, PracticePhysician]
    code: 200
    input: ["acquisition_id?", "physician_id?", "status?", "model_type?", "benchmark_basis?", "limit?", "offset?"]
    output: CompensationPlan[]
    side_effects: []

  - method: GET
    path: "/compensation-plans/{planId}"
    description: "Read one compensation plan, including its benchmark percentile, true-up and return count."
    roles: [CompensationDesigner, ComplianceOfficer, DealLead, PracticePhysician]
    code: 200
    input: []
    output: CompensationPlan
    side_effects: []

  - method: POST
    path: "/compensation-plans/{planId}/status"
    description: "Submit, return, approve, execute, hold, supersede or withdraw a compensation plan. Exempt from the compliance-clearance gate so a flagged deal can still remediate its compensation."
    roles: [CompensationDesigner, ComplianceOfficer, PracticePhysician]
    code: 200
    input: ["target_status", "review_note?"]
    output: CompensationPlan
    side_effects:
      - "applies the §1.2 CompensationPlan.status transition"
      - "on the SUBMITTED -> DRAFT return increments returned_count by 1, and once returned_count has reached MAX_PLAN_RETURNS the same request lands in WITHDRAWN instead"
      - "on approval stores the caller's X-User-Id in approved_by_user_id and supersedes any other EXECUTED plan for the same physician"
      - "on execution stores executed_at from the logical clock"
      - "on entry into COMPLIANCE_HOLD sets Acquisition.compliance_clearance to FLAGGED when it is CLEARED"
      - "recomputes the linked Physician.employment_status"

  - method: POST
    path: "/payer-contracts"
    description: "Record a payer agreement carried into the transaction. Rejects a term that overlaps a live term for the same payer on the same acquisition."
    roles: [IntegrationManager]
    code: 201
    input: [acquisition_id, payer_name, payer_type, contract_form, notice_days_required, effective_on, terminates_on, annual_revenue_share_bps, "committee_slots_per_cycle?"]
    output: PayerContract
    side_effects:
      - "runs calculations.payer_contract_interval_overlap against the acquisition's live contracts for the same payer_name"
      - "sets novation_status to NOT_REQUESTED"

  - method: GET
    path: "/payer-contracts"
    description: "List payer contracts. Reverse-reachability channel for PayerContract.acquisition_id."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: ["acquisition_id?", "payer_type?", "payer_name?", "novation_status?", "contract_form?", "limit?", "offset?"]
    output: PayerContract[]
    side_effects: []

  - method: GET
    path: "/payer-contracts/{contractId}"
    description: "Read one payer contract, including its novation dimension and notice dates."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: []
    output: PayerContract
    side_effects: []

  - method: POST
    path: "/payer-contracts/{contractId}/novation"
    description: "Drive the payer novation workflow: SEND_NOTICE, RECORD_CONSENT, DENY, START_NEW_AGREEMENT, NOVATE or TERMINATE."
    roles: [IntegrationManager]
    code: 200
    input: [action, "note?"]
    output: PayerContract
    side_effects:
      - "applies the §1.2 PayerContract.novation_status transition"
      - "on SEND_NOTICE stores notice_sent_on from the logical clock; on RECORD_CONSENT stores consent_received_on"
      - "on DENY withdraws every non-terminal CredentialingPackage on this contract, fails the acquisition's PAYER_CREDENTIALING readiness task and recomputes Acquisition.readiness_posture"

  - method: POST
    path: "/credentialing-packages"
    description: "Open a re-credentialing package for one provider with one payer. Computes the committee cycle, the projected effective date and the retro-billing eligibility at creation time."
    roles: [IntegrationManager]
    code: 201
    input: [acquisition_id, physician_id, payer_contract_id, submitted_on]
    output: CredentialingPackage
    side_effects:
      - "runs calculations.credentialing_committee_cycle_key and stores committee_cycle_key"
      - "runs calculations.credentialing_projected_effective_date and stores lead_days, projected_effective_on and retro_billing_allowed"
      - "sets status to DRAFT"

  - method: GET
    path: "/credentialing-packages"
    description: "List credentialing packages. Reverse-reachability channel for CredentialingPackage.acquisition_id, CredentialingPackage.physician_id and CredentialingPackage.payer_contract_id."
    roles: [IntegrationManager, DealLead, ComplianceOfficer, PracticePhysician]
    code: 200
    input: ["acquisition_id?", "physician_id?", "payer_contract_id?", "status?", "committee_cycle_key?", "retro_billing_allowed?", "limit?", "offset?"]
    output: CredentialingPackage[]
    side_effects: []

  - method: GET
    path: "/credentialing-packages/{packageId}"
    description: "Read one credentialing package, including its committee cycle and projected effective date."
    roles: [IntegrationManager, DealLead, ComplianceOfficer, PracticePhysician]
    code: 200
    input: []
    output: CredentialingPackage
    side_effects: []

  - method: POST
    path: "/credentialing-packages/{packageId}/status"
    description: "File, review, approve, deny or withdraw a credentialing package. Filing enforces the payer lead time and the committee cycle's aggregate slot capacity."
    roles: [IntegrationManager]
    code: 200
    input: [target_status, "note?"]
    output: CredentialingPackage
    side_effects:
      - "applies the §1.2 CredentialingPackage.status transition"
      - "on the DRAFT -> SUBMITTED transition re-checks the lead time and consumes one committee slot for the package's committee_cycle_key"
      - "on withdrawal frees the package's committee slot"
      - "on approval may complete the acquisition's PAYER_CREDENTIALING readiness task and recompute Acquisition.readiness_posture"

  - method: POST
    path: "/ehr-migration-batches"
    description: "Stage a batch of legacy charts for migration. Computes the statutory retention period and purge eligibility date at creation time."
    roles: [IntegrationManager]
    code: 201
    input: [acquisition_id, batch_label, source_system, chart_type, record_count, "contains_minor_records?", "youngest_patient_age_years?", last_encounter_on]
    output: EhrMigrationBatch
    side_effects:
      - "runs calculations.legacy_retention_years and stores retention_years and legacy_purge_eligible_on"
      - "sets validated_count and defect_count to 0, unprocessed_count to record_count, match_rate_bps to 0 and retry_count to 0"
      - "sets status to STAGED"

  - method: GET
    path: "/ehr-migration-batches"
    description: "List migration batches. Reverse-reachability channel for EhrMigrationBatch.acquisition_id."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: ["acquisition_id?", "status?", "chart_type?", "source_system?", "contains_minor_records?", "limit?", "offset?"]
    output: EhrMigrationBatch[]
    side_effects: []

  - method: GET
    path: "/ehr-migration-batches/{batchId}"
    description: "Read one migration batch, including its reconciliation counters, match rate, retry count and retention schedule."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: []
    output: EhrMigrationBatch
    side_effects: []

  - method: POST
    path: "/ehr-migration-batches/{batchId}/progress"
    description: "Drive the migration pipeline: EXTRACT, LOAD, RECONCILE, REQUEUE or ABORT. RECONCILE carries the validated and defect counts and branches on the resulting match rate."
    roles: [IntegrationManager]
    code: 200
    input: [action, "validated_count?", "defect_count?", "note?"]
    output: EhrMigrationBatch
    side_effects:
      - "applies the §1.2 EhrMigrationBatch.status transition"
      - "on RECONCILE runs calculations.ehr_reconciliation_match_rate, stores validated_count, defect_count, unprocessed_count and match_rate_bps, and branches to RECONCILED, FAILED or ABORTED"
      - "on a failing RECONCILE increments retry_count by 1"
      - "on REQUEUE resets validated_count and defect_count to 0 and match_rate_bps to 0, restoring unprocessed_count to record_count"
      - "on the transition into ABORTED fails the acquisition's IT_DATA_MIGRATION readiness task and recomputes Acquisition.readiness_posture"

  - method: POST
    path: "/staff-transition-offers"
    description: "Draft a transition offer for a non-physician staff member. Harmonises the wage and computes the retention bonus at creation time; neither figure is committed against the pool until the offer is extended."
    roles: [IntegrationManager]
    code: 201
    input: [acquisition_id, staff_member_name, role_code, legacy_annual_wage_cents, "legacy_pto_hours?", "credited_service_months?", offer_expires_on]
    output: StaffTransitionOffer
    side_effects:
      - "runs calculations.staff_offer_wage_harmonization and stores uplift_component_cents, pto_component_cents, wage_floor_applied and offered_annual_wage_cents"
      - "runs calculations.retention_bonus_award and stores retention_bonus_cents"
      - "sets status to DRAFT; the retention pool is untouched"

  - method: GET
    path: "/staff-transition-offers"
    description: "List staff transition offers. Reverse-reachability channel for StaffTransitionOffer.acquisition_id."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: ["acquisition_id?", "status?", "role_code?", "wage_floor_applied?", "limit?", "offset?"]
    output: StaffTransitionOffer[]
    side_effects: []

  - method: GET
    path: "/staff-transition-offers/{offerId}"
    description: "Read one staff transition offer, including both independently rounded wage components and the retention bonus."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: []
    output: StaffTransitionOffer
    side_effects: []

  - method: POST
    path: "/staff-transition-offers/{offerId}/status"
    description: "Extend, accept, decline, rescind or expire a staff transition offer. Extending commits the retention bonus against the pool; every non-acceptance exit releases it in full."
    roles: [IntegrationManager]
    code: 200
    input: [target_status, "note?"]
    output: StaffTransitionOffer
    side_effects:
      - "applies the §1.2 StaffTransitionOffer.status transition"
      - "on DRAFT -> EXTENDED commits retention_bonus_cents against Acquisition.retention_pool_available_cents and stores extended_on"
      - "on DECLINED, RESCINDED or EXPIRED releases retention_bonus_cents back to Acquisition.retention_pool_available_cents"
      - "recomputes Acquisition.hr_staffing_coverage_pct via calculations.hr_staffing_coverage"
      - "on acceptance may complete the acquisition's HR_STAFFING_PLAN readiness task and recompute Acquisition.readiness_posture"

  - method: POST
    path: "/billing-conversions"
    description: "Register a site whose billing status changes at close. Computes the notice coverage, the notice lead time and the provider-based uplift at creation time."
    roles: [IntegrationManager]
    code: 201
    input: [acquisition_id, site_name, conversion_type, required_notice_count, "notified_patient_count?", "notices_issued_on?", effective_on]
    output: BillingConversion
    side_effects:
      - "runs calculations.patient_notice_coverage and stores notice_coverage_bps, notice_lead_days and provider_based_uplift_bps"
      - "sets status to NOT_STARTED"

  - method: GET
    path: "/billing-conversions"
    description: "List billing conversions. Reverse-reachability channel for BillingConversion.acquisition_id."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: ["acquisition_id?", "status?", "conversion_type?", "limit?", "offset?"]
    output: BillingConversion[]
    side_effects: []

  - method: GET
    path: "/billing-conversions/{conversionId}"
    description: "Read one billing conversion, including its notice coverage and lead time."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: []
    output: BillingConversion
    side_effects: []

  - method: POST
    path: "/billing-conversions/{conversionId}/status"
    description: "Attest the provider-based criteria, record that notices went out, complete the conversion, or withdraw it. Issuing notices enforces both the coverage floor and the statutory lead time."
    roles: [IntegrationManager]
    code: 200
    input: [target_status, "note?"]
    output: BillingConversion
    side_effects:
      - "applies the §1.2 BillingConversion.status transition"
      - "on NOT_STARTED -> ATTESTED stores attested_on from the logical clock"
      - "on ATTESTED -> NOTICES_ISSUED re-checks notice_coverage_bps and notice_lead_days, may complete the acquisition's PATIENT_NOTIFICATION readiness task and recomputes Acquisition.readiness_posture"
      - "on NOTICES_ISSUED -> CONVERTED requires a NOVATED MEDICARE contract when the site is a provider-based department"

  - method: POST
    path: "/readiness-tasks"
    description: "Add a line to the acquisition's day-one readiness checklist. The functional domain is derived from the task code."
    roles: [IntegrationManager, DealLead]
    code: 201
    input: [acquisition_id, task_code, "is_blocking?", due_on]
    output: ReadinessTask
    side_effects:
      - "derives domain from task_code"
      - "sets status to OPEN"
      - "recomputes Acquisition.readiness_posture, which leaves BLOCKED only once every blocking line is COMPLETE or WAIVED"

  - method: GET
    path: "/readiness-tasks"
    description: "List readiness tasks. Reverse-reachability channel for ReadinessTask.acquisition_id."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: ["acquisition_id?", "status?", "task_code?", "domain?", "is_blocking?", "limit?", "offset?"]
    output: ReadinessTask[]
    side_effects: []

  - method: GET
    path: "/readiness-tasks/{taskId}"
    description: "Read one readiness task, including its derived domain, waiver justification and failure reason."
    roles: [IntegrationManager, DealLead, ComplianceOfficer]
    code: 200
    input: []
    output: ReadinessTask
    side_effects: []

  - method: POST
    path: "/readiness-tasks/{taskId}/status"
    description: "Start, complete, waive, fail or reopen a readiness checklist line. Exempt from the compliance-clearance gate so remediation remains possible while a deal is flagged."
    roles: [IntegrationManager, ComplianceOfficer]
    code: 200
    input: [target_status, "waiver_justification?", "failure_reason?"]
    output: ReadinessTask
    side_effects:
      - "applies the §1.2 ReadinessTask.status transition"
      - "stores verified_by_user_id, waiver_justification or failure_reason as the transition requires"
      - "recomputes Acquisition.readiness_posture via calculations.acquisition_readiness_posture"

  - method: POST
    path: "/liability-items"
    description: "Schedule a liability discovered in diligence. Created UNASSIGNED and holding no escrow."
    roles: [DealLead]
    code: 201
    input: [acquisition_id, category, description, estimated_amount_cents, "indemnity_cap_cents?"]
    output: LiabilityItem
    side_effects:
      - "sets disposition to UNASSIGNED and escrowed_amount_cents to 0"

  - method: GET
    path: "/liability-items"
    description: "List liability items. Reverse-reachability channel for LiabilityItem.acquisition_id."
    roles: [DealLead, ComplianceOfficer, IntegrationManager]
    code: 200
    input: ["acquisition_id?", "category?", "disposition?", "limit?", "offset?"]
    output: LiabilityItem[]
    side_effects: []

  - method: GET
    path: "/liability-items/{itemId}"
    description: "Read one liability item, including its disposition and escrowed amount."
    roles: [DealLead, ComplianceOfficer, IntegrationManager]
    code: 200
    input: []
    output: LiabilityItem
    side_effects: []

  - method: POST
    path: "/liability-items/{itemId}/disposition"
    description: "Allocate a scheduled liability: ASSUMED, EXCLUDED, INDEMNIFIED or ESCROWED, or release an escrowed item to EXCLUDED. Legality depends on the acquisition's asset-versus-equity structure."
    roles: [DealLead]
    code: 200
    input: [target_disposition, "disposition_note?"]
    output: LiabilityItem
    side_effects:
      - "applies the §1.2 LiabilityItem.disposition transition"
      - "on entry into ESCROWED sets escrowed_amount_cents to estimated_amount_cents and commits it against Acquisition.escrow_available_cents"
      - "on ESCROWED -> EXCLUDED releases the full escrowed_amount_cents back to Acquisition.escrow_available_cents and resets escrowed_amount_cents to 0"

  - method: POST
    path: "/performance-reports"
    description: "Append one month of post-close actuals for a physician and reconcile the executed compensation plan against them. Append-only: reports are immutable and carry no version."
    roles: [IntegrationManager]
    code: 201
    input: [acquisition_id, physician_id, applied_comp_plan_id, period_start_on, period_end_on, actual_wrvu, actual_collections_cents]
    output: PerformanceReport
    side_effects:
      - "folds actual_wrvu into CompensationPlan.actual_ytd_wrvu and increments CompensationPlan.months_elapsed"
      - "runs calculations.comp_true_up and stores CompensationPlan.comp_true_up_cents and the re-benchmarked CompensationPlan.benchmark_percentile"
      - "snapshots true_up_applied_cents and benchmark_percentile_after onto the report"
      - "when the re-benchmarked percentile exceeds FMV_SAFE_HARBOR_PERCENTILE without fmv_justification_on_file, moves the plan from EXECUTED to COMPLIANCE_HOLD, which sets Acquisition.compliance_clearance to FLAGGED, which in turn returns every SUBMITTED compensation plan on the acquisition to DRAFT and increments each returned_count by 1"

  - method: GET
    path: "/performance-reports"
    description: "List performance reports. Reverse-reachability channel for PerformanceReport.acquisition_id, PerformanceReport.physician_id and PerformanceReport.applied_comp_plan_id."
    roles: [IntegrationManager, ComplianceOfficer, DealLead, PracticePhysician]
    code: 200
    input: ["acquisition_id?", "physician_id?", "applied_comp_plan_id?", "period_start_on?", "limit?", "offset?"]
    output: PerformanceReport[]
    side_effects: []

  - method: GET
    path: "/performance-reports/{reportId}"
    description: "Read one performance report, including the true-up and percentile snapshots taken when it was folded in."
    roles: [IntegrationManager, ComplianceOfficer, DealLead, PracticePhysician]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role is absent, empty or holds an unrecognised role value"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_PLAN_OWNER
    http: 403
    condition: "the caller is not the preparer of the valuation opinion being submitted, or not the physician named on the compensation plan being executed"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same user id would perform two incompatible steps: accepting or rejecting an opinion it prepared, or approving a compensation plan on an acquisition whose pinned FMV opinion that same user accepted"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an identifier in the URL path or in the request body does not resolve to a stored entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, a type or enum value is wrong, a date or instant is malformed, a money or count field is negative, terminates_on precedes effective_on, discount_rate_bps is not strictly greater than terminal_growth_bps, youngest_patient_age_years is absent while contains_minor_records is true, indemnity_cap_cents is absent or below estimated_amount_cents for an INDEMNIFIED disposition, or limit/offset fall outside their bounds"
  - id: ERR_ACQUISITION_SCOPE_MISMATCH
    http: 409
    condition: "foreign keys in one request body belong to different acquisitions, or the referenced compensation plan does not belong to the referenced physician"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "the submitted npi is already registered to another physician"
  - id: ERR_DUPLICATE_TASK_CODE
    http: 409
    condition: "the acquisition already has a readiness task with the submitted task_code"
  - id: ERR_DUPLICATE_BATCH_LABEL
    http: 409
    condition: "the acquisition already has a migration batch with the submitted batch_label"
  - id: ERR_DUPLICATE_CREDENTIALING_PACKAGE
    http: 409
    condition: "a DRAFT, SUBMITTED, IN_REVIEW or APPROVED package already exists for the same physician and payer contract"
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http: 409
    condition: "a performance report already exists for the same physician and period_start_on"
  - id: ERR_STALE_ACQUISITION_VERSION
    http: 412
    condition: "expected_acquisition_version does not equal the stored Acquisition.version"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared for the entity's current state, including every terminal-state lockdown and every repeat of an already-applied transition"
  - id: ERR_COMPLIANCE_CLEARANCE_BLOCKED
    http: 403
    condition: "the parent acquisition's compliance_clearance is FLAGGED or SUSPENDED and the endpoint is not one of the exempt clearance, compensation-plan-status or readiness-task endpoints"
  - id: ERR_MISSING_VALUATION_INPUT
    http: 422
    condition: "the valuation inputs the chosen method requires are not all present"
  - id: ERR_OPINION_METHOD_MISMATCH
    http: 422
    condition: "opinion_type FMV is paired with method NARRATIVE, or opinion_type COMMERCIAL_REASONABLENESS is paired with an INCOME_APPROACH or MARKET_APPROACH method"
  - id: ERR_VALUER_INDEPENDENCE_NOT_ATTESTED
    http: 422
    condition: "a valuation opinion is submitted while independence_attested is false"
  - id: ERR_VALUATION_OPINION_EXPIRED
    http: 422
    condition: "the governing valuation opinion's expires_on is before the current logical date"
  - id: ERR_FMV_OPINION_NOT_ACCEPTED
    http: 422
    condition: "no pinned ACCEPTED fair market value opinion exists on the acquisition when a compensation plan is approved"
  - id: ERR_COMMERCIAL_REASONABLENESS_NOT_ESTABLISHED
    http: 422
    condition: "no ACCEPTED commercial reasonableness opinion with cr_conclusion REASONABLE exists when the deal enters BOARD_REVIEW"
  - id: ERR_REFERRAL_LINKED_COMPENSATION
    http: 422
    condition: "a compensation plan with includes_referral_credit true is submitted, or such a plan exists when the acquisition is cleared"
  - id: ERR_COMP_EXCEEDS_FMV_SAFE_HARBOR
    http: 422
    condition: "benchmark_percentile is strictly above 90.00 and fmv_justification_on_file is false"
  - id: ERR_STARK_EXCEPTION_REQUIRED
    http: 422
    condition: "a compensation plan is submitted with stark_exception NONE"
  - id: ERR_PHYSICIAN_LICENSE_EXPIRED
    http: 422
    condition: "the physician's state_license_expires_on is before the current logical date when a compensation plan or a credentialing package is submitted"
  - id: ERR_COMP_PLAN_MISSING
    http: 422
    condition: "a physician on the acquisition has no APPROVED or EXECUTED compensation plan when the deal is signed"
  - id: ERR_NO_EXECUTED_COMP_PLAN
    http: 422
    condition: "a physician has no EXECUTED plan at close, or a performance report names a plan that is not EXECUTED or COMPLIANCE_HOLD"
  - id: ERR_TAIL_COVERAGE_INSUFFICIENT
    http: 422
    condition: "the acquisition requires tail coverage but tail_coverage_months is below TAIL_MIN_MONTHS when the deal enters BOARD_REVIEW"
  - id: ERR_TAIL_RESERVE_INSUFFICIENT
    http: 422
    condition: "the acquisition requires tail coverage but escrow_total_cents is below the computed tail_premium_cents when the deal is signed"
  - id: ERR_LIABILITY_DISPOSITION_NOT_PERMITTED
    http: 422
    condition: "the requested disposition is illegal for the acquisition's structure and the item's category"
  - id: ERR_LIABILITY_UNASSIGNED
    http: 422
    condition: "a liability item is still UNASSIGNED when the deal is signed"
  - id: ERR_ESCROW_INSUFFICIENT
    http: 422
    condition: "the item's estimated_amount_cents exceeds the acquisition's escrow_available_cents"
  - id: ERR_PAYER_CONTRACT_INTERVAL_OVERLAP
    http: 409
    condition: "the new contract's closed term interval intersects a live term for the same payer on the same acquisition, including the touching case where one term's last day is the other's first day"
  - id: ERR_COMMITTEE_CYCLE_CAPACITY_EXCEEDED
    http: 409
    condition: "the payer's committee cycle already holds committee_slots_per_cycle packages in SUBMITTED, IN_REVIEW or APPROVED for this committee_cycle_key"
  - id: ERR_CREDENTIALING_LEAD_TIME_MISSED
    http: 422
    condition: "projected_effective_on falls after target_close_on extended by the payer's retro-billing window"
  - id: ERR_PAYER_NOVATION_INCOMPLETE
    http: 422
    condition: "a payer contract is neither NOVATED nor TERMINATED at close, or no NOVATED MEDICARE contract exists when a provider-based department is converted"
  - id: ERR_PATIENT_NOTICE_LEAD_TIME_SHORT
    http: 422
    condition: "notice_lead_days is below PATIENT_NOTICE_LEAD_DAYS when notices are recorded as issued"
  - id: ERR_PATIENT_NOTICE_COVERAGE_INCOMPLETE
    http: 422
    condition: "notice_coverage_bps is below 10000 when notices are recorded as issued"
  - id: ERR_EMPTY_MIGRATION_BATCH
    http: 422
    condition: "a batch with record_count 0 is extracted"
  - id: ERR_MIGRATION_COUNT_INVALID
    http: 422
    condition: "validated_count plus defect_count exceeds record_count on a reconcile"
  - id: ERR_MIGRATION_INCOMPLETE
    http: 422
    condition: "a migration batch is neither RECONCILED nor ABORTED when the IT_DATA_MIGRATION task is completed or the deal is closed"
  - id: ERR_RETENTION_POOL_EXCEEDED
    http: 422
    condition: "the offer's retention_bonus_cents exceeds the acquisition's retention_pool_available_cents when the offer is extended"
  - id: ERR_WAIVER_JUSTIFICATION_REQUIRED
    http: 422
    condition: "a readiness task is waived without a non-empty waiver_justification"
  - id: ERR_READINESS_NOT_READY
    http: 422
    condition: "Acquisition.readiness_posture is not READY when the deal is closed, including the case of an acquisition with no blocking readiness tasks at all"
  - id: ERR_ACQUISITION_NOT_CLOSED
    http: 422
    condition: "a performance report is filed against an acquisition whose deal_status is not CLOSED"
  - id: ERR_INVALID_REPORT_PERIOD
    http: 422
    condition: "the reporting period is not a single whole calendar month, or it begins before the acquisition's close date"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DealLead
    description: "Owns the transaction itself: opens the acquisition, registers physicians, schedules and allocates liabilities, and drives the deal_status dimension from sourcing through close or abandonment. Cannot author or accept valuations and cannot approve compensation."
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions"
      - "POST /acquisitions/{acquisitionId}/status"
      - "POST /physicians"
      - "POST /liability-items"
      - "POST /liability-items/{itemId}/disposition"
    shared_operations:
      - "POST /readiness-tasks"
      - "every GET endpoint except GET /staff-transition-offers is shared; GET /valuation-opinions, GET /compensation-plans, GET /payer-contracts, GET /credentialing-packages, GET /ehr-migration-batches, GET /billing-conversions, GET /readiness-tasks, GET /liability-items, GET /performance-reports and GET /physicians are all readable"
      - "POST /_clock/set_current_utc"
  - name: ValuationAnalyst
    description: "Prepares fair market value and commercial reasonableness opinions and submits them for review. Structurally barred from accepting its own work: acceptance and rejection belong to a ComplianceOfficer, and the analyst's own user id may not perform them."
    identity: opaque
    exclusive_operations:
      - "POST /valuation-opinions"
    shared_operations:
      - "POST /valuation-opinions/{opinionId}/status with target_status SUBMITTED"
      - "GET /acquisitions, GET /acquisitions/{acquisitionId}, GET /physicians, GET /physicians/{physicianId}, GET /valuation-opinions, GET /valuation-opinions/{opinionId}"
  - name: CompensationDesigner
    description: "Designs physician compensation plans and submits them for compliance review. Cannot approve its own designs and cannot execute them."
    identity: opaque
    exclusive_operations:
      - "POST /compensation-plans"
    shared_operations:
      - "POST /compensation-plans/{planId}/status with target_status SUBMITTED or WITHDRAWN"
      - "GET /acquisitions, GET /acquisitions/{acquisitionId}, GET /physicians, GET /physicians/{physicianId}, GET /compensation-plans, GET /compensation-plans/{planId}"
  - name: ComplianceOfficer
    description: "The regulatory gate. Accepts or rejects valuation opinions, approves compensation plans, moves the acquisition's compliance_clearance dimension, waives readiness tasks and places executed plans on compliance hold. Authors nothing, and the individual officer who accepted an acquisition's pinned FMV opinion may not approve compensation on that same acquisition."
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/{acquisitionId}/compliance-clearance"
      - "POST /valuation-opinions/{opinionId}/status with target_status ACCEPTED, REJECTED or DRAFT"
      - "POST /compensation-plans/{planId}/status with target_status APPROVED, DRAFT, COMPLIANCE_HOLD, EXECUTED from COMPLIANCE_HOLD, SUPERSEDED or WITHDRAWN"
      - "POST /readiness-tasks/{taskId}/status with target_status WAIVED"
    shared_operations:
      - "POST /readiness-tasks/{taskId}/status with target_status IN_PROGRESS, COMPLETE or FAILED"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: IntegrationManager
    description: "Runs the operational integration: payer contracts and their novation, re-credentialing packages, chart migration batches, staff transition offers, billing conversions, the day-one checklist and post-close performance reporting."
    identity: opaque
    exclusive_operations:
      - "POST /payer-contracts"
      - "POST /payer-contracts/{contractId}/novation"
      - "POST /credentialing-packages"
      - "POST /credentialing-packages/{packageId}/status"
      - "POST /ehr-migration-batches"
      - "POST /ehr-migration-batches/{batchId}/progress"
      - "POST /staff-transition-offers"
      - "POST /staff-transition-offers/{offerId}/status"
      - "POST /billing-conversions"
      - "POST /billing-conversions/{conversionId}/status"
      - "POST /performance-reports"
    shared_operations:
      - "POST /readiness-tasks"
      - "POST /readiness-tasks/{taskId}/status with target_status IN_PROGRESS, COMPLETE or FAILED"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: PracticePhysician
    description: "The acquired physician acting for themselves. X-User-Id is the id of a Physician row, so the ownership check on plan execution is a direct comparison against CompensationPlan.physician_id. Can execute an approved plan and read their own records, and can do nothing else."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /compensation-plans/{planId}/status with target_status EXECUTED"
    shared_operations:
      - "GET /physicians, GET /physicians/{physicianId}, GET /compensation-plans, GET /compensation-plans/{planId}, GET /credentialing-packages, GET /credentialing-packages/{packageId}, GET /performance-reports, GET /performance-reports/{reportId}"
