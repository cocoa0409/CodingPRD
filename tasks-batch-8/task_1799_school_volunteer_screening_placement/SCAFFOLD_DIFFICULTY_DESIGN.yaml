            - "Volunteer.${v_id}.recognition_tier == BRONZE"
            - "exactly one RecognitionAward exists for ${v_id}: tier == BRONZE and source == AUTO"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_error_beats_safety_error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_safety (p5): confirming a
          CANCELLED placement that would also fail the restriction gate returns
          ERR_PLACEMENT_INVALID_STATE, never ERR_RESTRICTED_ROLE.
        test_recipe:
          setup:
            - "UNSUPERVISED volunteer ACTIVE with restriction_flags [NO_ONE_ON_ONE, NO_TRANSPORT] (MINOR findings on ENHANCED check)"
            - "OPEN opportunity restricted_category ONE_ON_ONE required_contact_type UNSUPERVISED cap 2 window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z"
            - "placement REQUESTED then CANCELLED by the volunteer"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Flag Fred", email: "fred@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "MINOR" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Reading Mentor", required_contact_type: "UNSUPERVISED", restricted_category: "ONE_ON_ONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/cancel", payload: {}, as: Volunteer, as_user_id: "${v_id}" }
          trigger:
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin, captures: { err: $.data.error_id } }
          assert:
            - "confirm response error_id == ERR_PLACEMENT_INVALID_STATE (state p4 wins over safety p5)"
            - "Placement.${pl_id}.status remains CANCELLED"

      - name: hour_entry_referential_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair business_referential (p6) vs business_temporal
          (p7): an hour entry that references another volunteer's placement AND
          declares a worked_date outside the placement window returns
          ERR_PLACEMENT_VOLUNTEER_MISMATCH, never ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW.
        test_recipe:
          setup:
            - "volunteers A and B both ACTIVE; A holds CONFIRMED placement pA on opp window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 3, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Owner Olive", email: "olive@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { va_id: $.data.id, va_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${va_id}", level: "BASIC", expected_volunteer_version: "${va_ver}" }, as: DistrictCoordinator, captures: { cha_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${va_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${cha_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${va_id}", captures: { pa_id: $.data.id } }
            - { call: "POST /placements/${pa_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Intruder Ivan", email: "ivan@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { vb_id: $.data.id, vb_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${vb_id}", level: "BASIC", expected_volunteer_version: "${vb_ver}" }, as: DistrictCoordinator, captures: { chb_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${vb_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chb_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /hour-entries", payload: { placement_id: "${pa_id}", worked_date: "2026-08-20", hours: 2.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${vb_id}", captures: { err: $.data.error_id } }
          assert:
            - "create response error_id == ERR_PLACEMENT_VOLUNTEER_MISMATCH (referential p6 wins over temporal p7)"
            - "no HourEntry is created for placement ${pa_id} (GET /hour-entries?placement_id=${pa_id} total_count == 0)"

