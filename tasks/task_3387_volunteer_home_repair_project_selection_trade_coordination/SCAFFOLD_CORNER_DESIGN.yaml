  # ===========================================================================
  - section: rbac
    instances:
      - name: homeowner_cannot_verify_own_application
        claim_type: RBAC Denial
        grounds:
          - roles.Homeowner
          - endpoints.PATCH_/rebuild/applications/{applicationId}
        distinguishing_aspect: "The entity-backed Homeowner role may drive only the WITHDRAWN transition on its own record; even a self-consistent verify attempt is ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "One cycle; one SUBMITTED application."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Self Verify", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "34 Self St" }
              as: Anonymous
              captures: { app: $.data.id }
          trigger:
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: Homeowner
              as_user_id: "${app}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (Homeowner may only set status=WITHDRAWN)"
            - "HomeownerApplication.${app}.status == SUBMITTED"

      - name: homeowner_can_withdraw_own_application_but_not_others
        claim_type: RBAC Denial
        grounds:
          - roles.Homeowner
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "The same WITHDRAWN call succeeds on the caller's own application (X-User-ID == application id) and fails with ERR_NOT_RESOURCE_OWNER on a neighbour's — the ownership check, not the role list, decides."
        test_recipe:
          setup:
            - "One cycle; two SUBMITTED applications."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Own A", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "35 Own St" }
              as: Anonymous
              captures: { app_a: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Own B", date_of_birth: "1991-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "36 Own St" }
              as: Anonymous
              captures: { app_b: $.data.id }
          trigger:
            - call: "PATCH /rebuild/applications/${app_a}"
              payload: { status: "WITHDRAWN" }
              as: Homeowner
              as_user_id: "${app_a}"
              captures: { st_a: $.data.status }
            - call: "PATCH /rebuild/applications/${app_b}"
              payload: { status: "WITHDRAWN" }
              as: Homeowner
              as_user_id: "${app_a}"
              captures: { err: $.data.error_id }
          assert:
            - "st_a == WITHDRAWN (own record, permitted transition)"
            - "err == ERR_NOT_RESOURCE_OWNER and HomeownerApplication.${app_b}.status == SUBMITTED"

