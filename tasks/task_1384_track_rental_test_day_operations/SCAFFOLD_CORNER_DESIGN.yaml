  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]

        distinguishing_aspect: "Missing X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /tracks/any-id"
              payload: {}
              as: ""  # intentionally empty role header
              captures: { err_v1: $.data.error_id }
          assert:
            - "http_status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: forbidden_role_returns_403
