            - "GET /resilience/jurisdictions with disadvantaged_flag true returns meta.total_count == 3"

      - name: asset_cascade_factor_caps_at_three_counted_hops
        claim_type: Constants Applied
        grounds:
          - calculations.asset_consequence_score.constants.MAX_DEPTH_COUNTED
          - entities.LifelineAsset.fields.dependency_depth
        distinguishing_aspect: "Along a five-asset upstream chain the root scores 14.17 at depth 0, the depth-3 asset scores 20.55, and the depth-4 asset scores 20.55 as well — dependency_depth is still reported as 4, so the cap lives in the cascade factor (1.45) and not in the depth field."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction (svi_score 0.62), one PUBLISHED FLOOD/RCP85/2060 HazardProfile at exposure_index 0.80, and a chain of five identical shared LifelineAssets (replacement 1200000000, redundancy 0.25, service_population 150000) where each links upstream to the previous one. ASSESSED vulnerability 0.82 exists for the root, the depth-3 asset and the depth-4 asset."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Chain Depth 0", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a_d0_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Chain Depth 1", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true, upstream_asset_id: "${a_d0_id}" }
              as: RegionalAdministrator
              captures: { a_d1_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Chain Depth 2", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true, upstream_asset_id: "${a_d1_id}" }
              as: RegionalAdministrator
              captures: { a_d2_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Chain Depth 3", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true, upstream_asset_id: "${a_d2_id}" }
              as: RegionalAdministrator
              captures: { a_d3_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Chain Depth 4", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true, upstream_asset_id: "${a_d3_id}" }
              as: RegionalAdministrator
              captures: { a_d4_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a_d0_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
