# =============================================================================
# task_1047 — Business Brokerage & Main-Street M&A — SCAFFOLD (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  1047. Business Brokerage & Main-Street M&A: listing & valuation/CIM, buyer NDA
  & qualification, deal pipeline & LOI, due-diligence data-room, SBA-financing
  coordination, escrow/closing, commission, earnout/transition

domain_name: business-brokerage
api_prefix: /brokerage

complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: workflow-orchestration
  complexity_layers:
    - optimistic_concurrency        # LOI-create-supersede OCC on Deal.version
    - cascading_side_effects        # LOI-accept and Deal-withdraw fan through 3+ entities
    - dual_variant_calculation      # valuation (SDE vs asset), commission (provisional vs final)
    - rate_threshold_triggers       # Lehman marginal commission tiers, qualification floors

  entity_topology: flat
  # Peer entities linked by foreign keys (Broker/Seller/Buyer/Listing/Deal are
  # top-level collections under a single mount prefix; children reached by FK).

  state_machine_shape: cyclic
  # LOI negotiation is a SUBMITTED<->COUNTERED loop (cyclic); SBALoanApplication
  # is a branching fork; Listing/Deal carry compound cross-entity guards.

  relationship_patterns:
    - one_to_many          # Listing -> Deals, Deal -> LOIs
    - cross_aggregate      # Deal references Listing + Buyer + Broker across aggregates

  role_model: peer_roles
  # Broker owns listings/deals; Seller owns their listing side; Buyer pursues
  # deals; Lender decides financing; EscrowAgent runs closing; PlatformAdmin onboards.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Brokerage firm name" }
      - { name: license_number, type: string, source: input, description: "M&A advisor license number" }
      - { name: accrued_commission_cents, type: integer, source: computed, default: 0, description: "Running ledger: sum of final_commission_cents across this broker's CLOSED deals; increments on escrow close, never decremented on the happy path" }

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Seller full name" }
      - { name: email, type: string, source: input, description: "Seller contact email" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Buyer full name" }
      - { name: email, type: string, source: input, description: "Buyer contact email" }
      - { name: proof_of_funds_cents, type: integer, source: input, description: "Verified liquid funds available to this buyer, in cents" }
      - { name: net_worth_cents, type: integer, source: input, description: "Declared net worth in cents (used in qualification capacity)" }
      - { name: committed_capital_cents, type: integer, source: computed, default: 0, description: "Conserved quantity: sum of earnest_deposit_cents over this buyer's non-terminal LOIs (status IN {SUBMITTED, COUNTERED, ACCEPTED}); rises on LOI submit, falls on LOI withdraw/reject" }
      - { name: escrowed_cents, type: integer, source: computed, default: 0, description: "Conserved quantity: sum of balance_cents over this buyer's EscrowAccounts in status IN {OPENED, FUNDED}; rises on deposit, falls to 0 on escrow cancel/refund" }
      - { name: available_capital_cents, type: integer, source: computed, description: "Read-only = proof_of_funds_cents - committed_capital_cents - escrowed_cents" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the listing broker (taken from X-User-ID on create)" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the selling owner" }
      - { name: business_name, type: string, source: input, description: "Name of the business for sale" }
      - { name: industry_code, type: string, source: input, description: "Industry / NAICS-style code" }
      - { name: annual_sde_cents, type: integer, source: input, description: "Seller's Discretionary Earnings per year, in cents" }
      - { name: annual_revenue_cents, type: integer, source: input, description: "Annual revenue in cents" }
      - { name: ffe_value_cents, type: integer, source: input, description: "Furniture, fixtures & equipment value in cents" }
      - { name: inventory_value_cents, type: integer, source: input, description: "Sellable inventory value in cents" }
      - { name: industry_multiple, type: number, source: input, description: "SDE multiple for this industry (e.g. 3.0)" }
      - { name: asking_price_cents, type: integer, source: input, description: "List/asking price in cents" }
      - { name: exclusive_start_date, type: datetime, source: input, description: "Exclusive engagement window start (ISO date). Half-open interval [start, end)" }
      - { name: exclusive_end_date, type: datetime, source: input, description: "Exclusive engagement window end (ISO date), exclusive bound" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> UNDER_LOI -> IN_ESCROW -> SOLD; or WITHDRAWN", constraints: "one of DRAFT, ACTIVE, UNDER_LOI, IN_ESCROW, SOLD, WITHDRAWN" }

  - name: CIM
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; the listing this Confidential Information Memorandum values" }
      - { name: valuation_method, type: enum, source: input, description: "Which valuation approach this CIM pins", constraints: "one of SDE_MULTIPLE, ASSET_BASED" }
      - { name: recommended_price_cents, type: integer, source: computed, description: "Read-only recommended price computed at publish from valuation_method (see calc cim_recommended_price)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED", constraints: "one of DRAFT, PUBLISHED" }

  - name: NDA
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; listing whose confidential materials this NDA unlocks" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; the signing buyer (taken from X-User-ID)" }
      - { name: status, type: enum, source: system, default: SIGNED, description: "SIGNED (terminal on creation)", constraints: "one of SIGNED" }

  - name: DataRoomDocument
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; the listing whose data room holds this document" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: doc_type, type: enum, source: input, description: "Category of due-diligence document", constraints: "one of FINANCIALS, LEASE, TAX_RETURN, LICENSES, OTHER" }

  - name: ManagementMeeting
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; resource whose seller-time slots are contended" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; buyer attending the management meeting" }
      - { name: start_at, type: datetime, source: input, description: "Meeting start (ISO 8601). Closed interval; buffer-separated (see overlap rule meeting_slot_buffer)" }
      - { name: end_at, type: datetime, source: input, description: "Meeting end (ISO 8601), must be > start_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED (terminal on creation)", constraints: "one of SCHEDULED" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; the business being pursued" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the pursuing buyer" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; broker managing this deal (from X-User-ID on create)" }
      - { name: status, type: enum, source: system, default: PROSPECT, description: "PROSPECT -> QUALIFIED -> UNDER_LOI -> DUE_DILIGENCE -> FINANCING -> IN_ESCROW -> CLOSED; or WITHDRAWN", constraints: "one of PROSPECT, QUALIFIED, UNDER_LOI, DUE_DILIGENCE, FINANCING, IN_ESCROW, CLOSED, WITHDRAWN" }
      - { name: accepted_loi_id, type: string, source: computed, description: "Set to the LOI.id accepted on this deal; null until an LOI is accepted" }
      - { name: accepted_price_cents, type: integer, source: computed, description: "offer_price_cents of the accepted LOI; basis of provisional commission" }
      - { name: earnout_total_cents, type: integer, source: computed, default: 0, description: "earnout_amount_cents copied from the accepted LOI at acceptance" }
      - { name: earnout_periods, type: integer, source: computed, default: 0, description: "earnout_periods copied from the accepted LOI at acceptance" }
      - { name: earnout_baseline_sde_cents, type: integer, source: computed, default: 0, description: "Listing.annual_sde_cents snapshot at acceptance; denominator of earnout performance" }
      - { name: earnout_paid_cents, type: integer, source: computed, default: 0, description: "Accumulated earnout disbursed, sum of per-period rounded payments (see calc earnout_period_payment)" }
      - { name: provisional_commission_cents, type: integer, source: computed, description: "Lehman commission on accepted_price_cents, set at LOI acceptance" }
      - { name: final_commission_cents, type: integer, source: computed, description: "Lehman commission on escrow closing_price_cents, set at escrow close" }
      - { name: seller_net_proceeds_cents, type: integer, source: computed, description: "Net to seller at close = closing_price - final_commission - escrow_fee - earnout_total (holdback)" }

  - name: LOI
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; the deal this Letter of Intent belongs to" }
      - { name: offer_price_cents, type: integer, source: input, description: "Buyer's offered purchase price in cents" }
      - { name: earnest_deposit_cents, type: integer, source: input, description: "Earnest money the buyer encumbers while this LOI is live, in cents" }
      - { name: earnout_amount_cents, type: integer, source: input, description: "Total earnout consideration proposed, in cents" }
      - { name: earnout_periods, type: integer, source: input, description: "Number of earnout measurement periods (>= 1)" }
      - { name: financing_contingency, type: boolean, source: input, default: true, description: "Whether the offer is contingent on SBA financing" }
      - { name: counter_price_cents, type: integer, source: computed, description: "Latest seller counter price; set on counter, cleared on revise" }
      - { name: round_number, type: integer, source: computed, default: 1, description: "Negotiation round; increments on each counter and each revise" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED <-> COUNTERED -> ACCEPTED / REJECTED; or WITHDRAWN", constraints: "one of DRAFT, SUBMITTED, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN" }

  - name: SBALoanApplication
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; the deal being financed" }
      - { name: requested_amount_cents, type: integer, source: input, description: "SBA 7(a) loan amount requested, in cents" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Amount the lender approved; set on APPROVED/CONDITIONALLY_APPROVED" }
      - { name: decision_reason, type: string, source: input, description: "Lender's free-text reason recorded with the decision" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> {APPROVED | CONDITIONALLY_APPROVED | DECLINED}; CONDITIONALLY_APPROVED -> {APPROVED | DECLINED}", constraints: "one of SUBMITTED, APPROVED, CONDITIONALLY_APPROVED, DECLINED" }

  - name: EscrowAccount
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; the deal in closing" }
      - { name: closing_price_cents, type: integer, source: input, description: "Final agreed closing price at escrow open (may re-trade off the accepted LOI price), in cents" }
      - { name: required_deposit_cents, type: integer, source: input, description: "Buyer earnest deposit required to fund escrow, in cents" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Trust balance currently held; rises on deposit, released to 0 on cancel" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED -> FUNDED -> CLOSED; or CANCELLED", constraints: "one of OPENED, FUNDED, CLOSED, CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: DRAFT
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /brokerage/listings/{id}/activate"
        actor: Broker
        preconditions:
          - "Listing has at least one CIM with status == PUBLISHED (else ERR_CIM_NOT_PUBLISHED) [cross-entity: Listing depends on CIM]"
        side_effects:
          - "status -> ACTIVE (listing becomes markable / NDA-signable)"
      - from: ACTIVE
        to: UNDER_LOI
        trigger: "system (bubble-up when a Deal on this Listing reaches UNDER_LOI via LOI accept)"
        actor: system
        preconditions:
          - "Listing.status == ACTIVE (else the accept is rejected upstream, ERR_LISTING_NOT_ACTIVE)"
        side_effects:
          - "status -> UNDER_LOI"
          - "CASCADE (link 3): every OTHER Deal on this Listing whose status IN {PROSPECT, QUALIFIED} -> WITHDRAWN"
      - from: UNDER_LOI
        to: ACTIVE
        trigger: "system (when the sole UNDER_LOI/DUE_DILIGENCE/FINANCING Deal on this Listing is WITHDRAWN before escrow)"
        actor: system
        preconditions:
          - "No Deal on this Listing is IN_ESCROW or CLOSED"
        side_effects:
          - "status -> ACTIVE (listing re-opened; availability restored)"
      - from: UNDER_LOI
        to: IN_ESCROW
        trigger: "system (when the winning Deal opens escrow)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> IN_ESCROW"
      - from: IN_ESCROW
        to: SOLD
        trigger: "system (when the winning Deal's escrow closes)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SOLD (terminal)"
      - from: IN_ESCROW
        to: ACTIVE
        trigger: "system (when the winning Deal is WITHDRAWN from IN_ESCROW)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ACTIVE (re-listed after a fallen-through escrow)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /brokerage/listings/{id}/withdraw"
        actor: Broker
        preconditions: []
        side_effects: ["status -> WITHDRAWN"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /brokerage/listings/{id}/withdraw"
        actor: Broker
        preconditions:
          - "No Deal on this Listing is IN_ESCROW (else ERR_LISTING_HAS_ACTIVE_ESCROW)"
        side_effects: ["status -> WITHDRAWN"]

  - entity: CIM
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /brokerage/cims/{id}/publish"
        actor: Broker
        preconditions:
          - "CIM.status == DRAFT (else ERR_CIM_INVALID_STATE)"
        side_effects:
          - "recommended_price_cents computed from valuation_method (calc cim_recommended_price)"
          - "status -> PUBLISHED"

  - entity: Deal
    initial_state: PROSPECT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: PROSPECT
        to: QUALIFIED
        trigger: "POST /brokerage/deals/{id}/qualify"
        actor: Broker
        preconditions:
          - "A NDA exists with listing_id == deal.listing_id AND buyer_id == deal.buyer_id AND status == SIGNED (else ERR_NDA_REQUIRED) [cross-entity: Deal depends on NDA]"
          - "Buyer.proof_of_funds_cents >= required_down_payment (calc qualification_capacity; else ERR_INSUFFICIENT_FUNDS) [boundary >=]"
          - "qualification_capacity(buyer) >= Listing.asking_price_cents (else ERR_INSUFFICIENT_FUNDS)"
        side_effects: ["status -> QUALIFIED"]
      - from: QUALIFIED
        to: UNDER_LOI
        trigger: "system (on POST /brokerage/lois/{id}/accept for this deal's LOI)"
        actor: system
        preconditions:
          - "Listing.status == ACTIVE (else ERR_LISTING_NOT_ACTIVE) [cross-entity: Deal accept depends on Listing]"
        side_effects:
          - "status -> UNDER_LOI"
          - "accepted_loi_id, accepted_price_cents, earnout_total_cents, earnout_periods, earnout_baseline_sde_cents populated from LOI + Listing"
          - "provisional_commission_cents = Lehman(accepted_price_cents) (calc broker_commission)"
          - "CASCADE (link 2): Listing ACTIVE -> UNDER_LOI (which itself fans to sibling deals, link 3)"
      - from: UNDER_LOI
        to: DUE_DILIGENCE
        trigger: "POST /brokerage/deals/{id}/open-diligence"
        actor: Broker
        preconditions:
          - "Listing has >= 1 DataRoomDocument (else ERR_DATA_ROOM_EMPTY) [boundary: zero-count set]"
        side_effects: ["status -> DUE_DILIGENCE"]
      - from: DUE_DILIGENCE
        to: FINANCING
        trigger: "POST /brokerage/deals/{id}/enter-financing"
        actor: Broker
        preconditions: []
        side_effects: ["status -> FINANCING"]
      - from: FINANCING
        to: IN_ESCROW
        trigger: "system (on POST /brokerage/deals/{id}/escrow)"
        actor: system
        preconditions:
          - "This deal has a SBALoanApplication with status == APPROVED (else ERR_FINANCING_NOT_APPROVED) [cross-entity: Escrow depends on SBALoanApplication]"
        side_effects:
          - "status -> IN_ESCROW"
          - "CASCADE: Listing UNDER_LOI -> IN_ESCROW"
      - from: IN_ESCROW
        to: CLOSED
        trigger: "system (on POST /brokerage/escrow-accounts/{id}/close)"
        actor: system
        preconditions:
          - "EscrowAccount.status == FUNDED (else ERR_ESCROW_NOT_FUNDED)"
        side_effects:
          - "final_commission_cents = Lehman(escrow.closing_price_cents) (calc broker_commission, final variant)"
          - "seller_net_proceeds_cents computed (calc seller_net_proceeds)"
          - "Broker.accrued_commission_cents += final_commission_cents"
          - "status -> CLOSED; CASCADE: Listing IN_ESCROW -> SOLD"
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /brokerage/deals/{id}/withdraw or system (sibling cascade on rival LOI accept)"
        actor: Broker
        preconditions: []
        side_effects:
          - "CASCADE (link 4): any non-terminal LOI on this deal -> WITHDRAWN (which releases buyer capital, link 5)"
          - "status -> WITHDRAWN"
      - from: PROSPECT
        to: WITHDRAWN
        trigger: "POST /brokerage/deals/{id}/withdraw or system (sibling cascade)"
        actor: Broker
        preconditions: []
        side_effects: ["status -> WITHDRAWN"]
      - from: UNDER_LOI
        to: WITHDRAWN
        trigger: "POST /brokerage/deals/{id}/withdraw"
        actor: Broker
        preconditions: []
        side_effects:
          - "CASCADE: accepted LOI -> WITHDRAWN (releases buyer committed_capital)"
          - "CASCADE: Listing UNDER_LOI -> ACTIVE (availability restored)"
          - "status -> WITHDRAWN"
      - from: DUE_DILIGENCE
        to: WITHDRAWN
        trigger: "POST /brokerage/deals/{id}/withdraw"
        actor: Broker
        preconditions: []
        side_effects:
          - "CASCADE: accepted LOI -> WITHDRAWN; Listing -> ACTIVE"
          - "status -> WITHDRAWN"
      - from: FINANCING
        to: WITHDRAWN
        trigger: "POST /brokerage/deals/{id}/withdraw"
        actor: Broker
        preconditions: []
        side_effects:
          - "CASCADE: accepted LOI -> WITHDRAWN; Listing -> ACTIVE"
          - "status -> WITHDRAWN"
      - from: IN_ESCROW
        to: WITHDRAWN
        trigger: "POST /brokerage/deals/{id}/withdraw"
        actor: Broker
        preconditions:
          - "EscrowAccount.status != CLOSED (else ERR_ESCROW_ALREADY_CLOSED)"
        side_effects:
          - "CASCADE (link 1): EscrowAccount OPENED/FUNDED -> CANCELLED"
          - "CASCADE (link 2, caused by escrow cancel): balance released, Buyer.escrowed_cents -= balance (refund; invariant escrow_cash_conservation)"
          - "CASCADE: accepted LOI -> WITHDRAWN (releases committed_capital); Listing IN_ESCROW -> ACTIVE"
          - "status -> WITHDRAWN"

  - entity: LOI
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /brokerage/deals/{id}/lois (created directly in SUBMITTED)"
        actor: Buyer
        preconditions:
          - "Deal.status == QUALIFIED (else ERR_DEAL_NOT_QUALIFIED) [state check]"
          - "expected_deal_version matches Deal.version (else ERR_STALE_VERSION 412) [OCC]"
          - "Buyer.available_capital_cents >= earnest_deposit_cents (else ERR_INSUFFICIENT_FUNDS) [fiscal]"
        side_effects:
          - "status = SUBMITTED; round_number = 1"
          - "any existing non-terminal LOI on this deal -> WITHDRAWN (superseded), releasing its earnest"
          - "Buyer.committed_capital_cents += earnest_deposit_cents (invariant buyer_capital_conservation)"
          - "increments Deal.version by 1"
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /brokerage/lois/{id}/counter"
        actor: Seller
        preconditions:
          - "LOI.status == SUBMITTED (else ERR_LOI_INVALID_STATE)"
        side_effects:
          - "counter_price_cents = counter_price_cents (input); round_number += 1; status -> COUNTERED"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /brokerage/lois/{id}/revise"
        actor: Buyer
        preconditions:
          - "LOI.status == COUNTERED (else ERR_LOI_INVALID_STATE)"
          - "Buyer.available_capital_cents >= (new earnest_deposit_cents - old earnest_deposit_cents) (else ERR_INSUFFICIENT_FUNDS)"
        side_effects:
          - "offer_price_cents / earnest_deposit_cents updated; counter_price_cents cleared; round_number += 1; status -> SUBMITTED"
          - "Buyer.committed_capital_cents adjusted by (new earnest - old earnest)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /brokerage/lois/{id}/accept"
        actor: Seller
        preconditions:
          - "LOI.status == SUBMITTED (else ERR_LOI_INVALID_STATE)"
          - "Deal.status == QUALIFIED AND Listing.status == ACTIVE (else ERR_LISTING_NOT_ACTIVE)"
        side_effects:
          - "status -> ACCEPTED (terminal)"
          - "drives Deal QUALIFIED -> UNDER_LOI (which drives the Listing + sibling-deal cascade)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /brokerage/lois/{id}/reject"
        actor: Seller
        preconditions:
          - "LOI.status == SUBMITTED (else ERR_LOI_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED (terminal)"
          - "Buyer.committed_capital_cents -= earnest_deposit_cents (release; invariant buyer_capital_conservation)"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /brokerage/lois/{id}/reject"
        actor: Seller
        preconditions:
          - "LOI.status == COUNTERED (else ERR_LOI_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED; Buyer.committed_capital_cents -= earnest_deposit_cents"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /brokerage/lois/{id}/withdraw"
        actor: Buyer
        preconditions:
          - "LOI.status IN {SUBMITTED, COUNTERED} (else ERR_LOI_INVALID_STATE)"
        side_effects:
          - "status -> WITHDRAWN (terminal)"
          - "Buyer.committed_capital_cents -= earnest_deposit_cents (release; invariant buyer_capital_conservation)"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /brokerage/lois/{id}/withdraw"
        actor: Buyer
        preconditions:
          - "LOI.status IN {SUBMITTED, COUNTERED}"
        side_effects:
          - "status -> WITHDRAWN; Buyer.committed_capital_cents -= earnest_deposit_cents"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system (when the owning Deal is WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> WITHDRAWN; Buyer.committed_capital_cents -= earnest_deposit_cents"

  - entity: SBALoanApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /brokerage/loan-applications/{id}/decision (outcome=APPROVED)"
        actor: Lender
        preconditions:
          - "status == SUBMITTED (else ERR_LOAN_INVALID_STATE)"
        side_effects:
          - "approved_amount_cents = requested_amount_cents; status -> APPROVED (unlocks escrow open)"
      - from: SUBMITTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /brokerage/loan-applications/{id}/decision (outcome=CONDITIONALLY_APPROVED)"
        actor: Lender
        preconditions:
          - "status == SUBMITTED"
          - "approved_amount_cents provided in body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "approved_amount_cents = body value; status -> CONDITIONALLY_APPROVED (does NOT unlock escrow)"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /brokerage/loan-applications/{id}/decision (outcome=DECLINED)"
        actor: Lender
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status -> DECLINED (terminal)"
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /brokerage/loan-applications/{id}/finalize-conditions (outcome=APPROVED)"
        actor: Lender
        preconditions:
          - "status == CONDITIONALLY_APPROVED (else ERR_LOAN_INVALID_STATE)"
        side_effects:
          - "status -> APPROVED (unlocks escrow open)"
      - from: CONDITIONALLY_APPROVED
        to: DECLINED
        trigger: "POST /brokerage/loan-applications/{id}/finalize-conditions (outcome=DECLINED)"
        actor: Lender
        preconditions:
          - "status == CONDITIONALLY_APPROVED"
        side_effects:
          - "status -> DECLINED (terminal)"

  - entity: EscrowAccount
    initial_state: OPENED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPENED
        to: FUNDED
        trigger: "POST /brokerage/escrow-accounts/{id}/deposit"
        actor: Buyer
        preconditions:
          - "status == OPENED (else ERR_ESCROW_INVALID_STATE)"
          - "amount_cents >= required_deposit_cents (else ERR_DEPOSIT_TOO_LOW) [boundary >=]"
        side_effects:
          - "balance_cents += amount_cents; Buyer.escrowed_cents += amount_cents (invariant escrow_cash_conservation)"
          - "status -> FUNDED"
      - from: FUNDED
        to: CLOSED
        trigger: "POST /brokerage/escrow-accounts/{id}/close"
        actor: EscrowAgent
        preconditions:
          - "status == FUNDED (else ERR_ESCROW_NOT_FUNDED)"
        side_effects:
          - "status -> CLOSED; drives Deal IN_ESCROW -> CLOSED (final commission, net proceeds, listing SOLD)"
      - from: OPENED
        to: CANCELLED
        trigger: "system (when owning Deal is WITHDRAWN from IN_ESCROW)"
        actor: system
        preconditions: []
        side_effects:
          - "balance released; Buyer.escrowed_cents -= balance_cents; balance_cents -> 0; status -> CANCELLED"
      - from: FUNDED
        to: CANCELLED
        trigger: "system (when owning Deal is WITHDRAWN from IN_ESCROW)"
        actor: system
        preconditions: []
        side_effects:
          - "balance released to buyer; Buyer.escrowed_cents -= balance_cents; balance_cents -> 0; status -> CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: loi-create-supersede-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /brokerage/deals/{id}/lois"
    occ_field: "expected_deal_version"
    description: |
      Submitting a new LOI against a Deal whose version has advanced since the
      buyer last observed it is rejected. A fresh LOI legitimately supersedes any
      live LOI on the deal (product allows re-offer), so a second create carrying
      a now-stale expected_deal_version is rejected on the stale-version check
      rather than silently superseding an LOI the buyer never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cim_recommended_price
    trigger: "POST /brokerage/cims/{id}/publish"
    algorithm: forward_looking
    formula: |
      if valuation_method == SDE_MULTIPLE:
          recommended_price_cents = round_half_up(annual_sde_cents * industry_multiple)
      elif valuation_method == ASSET_BASED:
          recommended_price_cents = ffe_value_cents + inventory_value_cents   # tangible net asset value, goodwill excluded
    input_set: "The parent Listing's annual_sde_cents, industry_multiple, ffe_value_cents, inventory_value_cents"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: sde_multiple
        when: "valuation_method == SDE_MULTIPLE"
        difference: "= annual_sde_cents * industry_multiple (earnings capitalization)"
      - name: asset_based
        when: "valuation_method == ASSET_BASED"
        difference: "= ffe_value_cents + inventory_value_cents (tangible assets only, no goodwill) — diverges from sde_multiple for identical Listing inputs"

  - name: broker_commission
    trigger: "LOI accept (provisional) and escrow close (final)"
    algorithm: tiered_pricing
    formula: |
      # Marginal Lehman ladder on a price base, in cents. TIER_WIDTH = 100_000_000 (== $1,000,000).
      remaining = base_price_cents
      commission = 0
      for (width, rate) in [(TIER_WIDTH,0.05),(TIER_WIDTH,0.04),(TIER_WIDTH,0.03),(TIER_WIDTH,0.02)]:
          take = min(remaining, width)          # boundary: a base of exactly TIER_WIDTH consumes tier 1 only
          commission += take * rate
          remaining -= take
          if remaining <= 0: break
      if remaining > 0:
          commission += remaining * 0.01         # 5th+ tier flat 1%
      commission = round_half_up(commission)
      commission = max(commission, MIN_COMMISSION_CENTS)
    input_set: "base_price_cents = accepted_price_cents (provisional) or escrow.closing_price_cents (final)"
    constants:
      TIER_WIDTH: 100000000
      MIN_COMMISSION_CENTS: 1500000
    precision: "integer cents, round_half_up, floor at MIN_COMMISSION_CENTS"
    variants:
      - name: provisional
        when: "at LOI accept"
        difference: "base_price_cents = accepted LOI offer_price_cents -> Deal.provisional_commission_cents"
      - name: final
        when: "at escrow close"
        difference: "base_price_cents = EscrowAccount.closing_price_cents (may re-trade) -> Deal.final_commission_cents; differs from provisional whenever closing price moved"

  - name: qualification_capacity
    trigger: "POST /brokerage/deals/{id}/qualify"
    algorithm: threshold
    formula: |
      required_down_payment_cents = round_half_up(DOWN_PAYMENT_PCT * Listing.asking_price_cents)
      capacity_cents = min(
          round_half_up(Buyer.proof_of_funds_cents / DOWN_PAYMENT_PCT),   # leverage on cash
          round_half_up(Buyer.net_worth_cents * NET_WORTH_MULTIPLE),      # net-worth ceiling
          SBA_MAX_CENTS )                                                 # program cap
      qualifies := (Buyer.proof_of_funds_cents >= required_down_payment_cents)
                   AND (capacity_cents >= Listing.asking_price_cents)
    input_set: "Buyer.proof_of_funds_cents, Buyer.net_worth_cents; Listing.asking_price_cents"
    constants:
      DOWN_PAYMENT_PCT: 0.10
      NET_WORTH_MULTIPLE: 2.0
      SBA_MAX_CENTS: 500000000
    precision: "integer cents, round_half_up; comparisons are inclusive (>=)"

  - name: seller_net_proceeds
    trigger: "escrow close (Deal IN_ESCROW -> CLOSED)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned: commission first (off closing price tier), then
      # escrow fee (off closing price), then earnout holdback, then the remainder.
      final_commission = broker_commission(final, base = closing_price_cents)
      escrow_fee_cents = round_half_up(ESCROW_FEE_PCT * closing_price_cents)
      earnout_holdback_cents = Deal.earnout_total_cents
      seller_net_proceeds_cents = closing_price_cents
                                  - final_commission
                                  - escrow_fee_cents
                                  - earnout_holdback_cents
    input_set: "EscrowAccount.closing_price_cents; Deal.earnout_total_cents"
    constants:
      ESCROW_FEE_PCT: 0.01
    precision: "integer cents, round_half_up on the fee before subtraction"

  - name: earnout_period_payment
    trigger: "POST /brokerage/deals/{id}/record-earnout-period"
    algorithm: aggregation
    formula: |
      # Nested rounding — order is pinned as "round each period, then accumulate".
      performance_ratio = clamp(actual_sde_cents / earnout_baseline_sde_cents, 0, CAP_RATIO)
      period_payment_cents = round_half_up(earnout_total_cents * performance_ratio / earnout_periods)
      earnout_paid_cents += period_payment_cents      # accumulate the ALREADY-ROUNDED per-period figures
    input_set: "actual_sde_cents (input per period); Deal.earnout_total_cents, earnout_baseline_sde_cents, earnout_periods"
    constants:
      CAP_RATIO: 1.5
    precision: "integer cents, round_half_up PER PERIOD before summing (not sum-then-round)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: auth
    check: "For entity_backed actors, X-User-ID must own the target (broker owns listing/deal; seller owns listing behind LOI; buyer owns deal / signs own NDA)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-guarded writes"
  - priority: 5
    category: state
    check: "Target resource is in a state that admits this transition"
    error_id: "varies (ERR_DEAL_NOT_QUALIFIED, ERR_LOI_INVALID_STATE, ERR_CIM_INVALID_STATE, ERR_ESCROW_INVALID_STATE, ERR_LOAN_INVALID_STATE, ERR_ESCROW_NOT_FUNDED)"
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "Required related entity exists and is in the right state (NDA SIGNED before qualify/meeting; CIM PUBLISHED before activate; SBALoanApplication APPROVED before escrow open)"
    error_id: "varies (ERR_NDA_REQUIRED, ERR_CIM_NOT_PUBLISHED, ERR_FINANCING_NOT_APPROVED)"
    http_status: 409
    applies_to: "activate, qualify, schedule meeting, escrow open"
  - priority: 7
    category: business_constraint
    check: "Uniqueness / structural validity (end_at > start_at; exclusive_end_date > exclusive_start_date; data room non-empty before diligence)"
    error_id: "varies (ERR_INVALID_INTERVAL, ERR_DATA_ROOM_EMPTY)"
    http_status: 409
    applies_to: "listing create, meeting schedule, open-diligence"
  - priority: 8
    category: business_temporal
    check: "Interval-occupation conflicts. (i) Listing exclusivity: a new listing for the same seller whose [exclusive_start_date, exclusive_end_date) half-open window overlaps another non-WITHDRAWN listing's window is rejected; touching windows (end == next start) do NOT overlap. (ii) Management meetings: a new SCHEDULED meeting on a listing is rejected when the gap to any existing SCHEDULED meeting is strictly less than MEETING_BUFFER_MINUTES = 30 (a gap of exactly 30 minutes is allowed); meeting intervals are closed [start_at, end_at]."
    error_id: "varies (ERR_LISTING_PERIOD_OVERLAP, ERR_MEETING_SLOT_CONFLICT)"
    http_status: 409
    applies_to: "listing create, meeting schedule"
    constants: { MEETING_BUFFER_MINUTES: 30 }
  - priority: 9
    category: business_fiscal
    check: "Capital / capacity / deposit sufficiency (buyer available capital vs earnest; proof-of-funds vs required down; deposit vs required)"
    error_id: "varies (ERR_INSUFFICIENT_FUNDS, ERR_DEPOSIT_TOO_LOW)"
    http_status: 402
    applies_to: "qualify, LOI submit/revise, escrow deposit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Actors ----
  - { method: POST, path: "/brokerage/brokers", description: "Onboard a broker", roles: [PlatformAdmin], code: 201, input: [firm_name, license_number], output: Broker, side_effects: ["accrued_commission_cents = 0"] }
  - { method: POST, path: "/brokerage/sellers", description: "Onboard a seller", roles: [PlatformAdmin], code: 201, input: [full_name, email], output: Seller, side_effects: [] }
  - { method: POST, path: "/brokerage/buyers", description: "Onboard a buyer", roles: [PlatformAdmin], code: 201, input: [full_name, email, proof_of_funds_cents, net_worth_cents], output: Buyer, side_effects: ["committed_capital_cents=0, escrowed_cents=0, available_capital_cents=proof_of_funds_cents"] }
  - { method: GET, path: "/brokerage/brokers/{id}", description: "Get a broker (incl. accrued_commission_cents)", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: [], output: Broker, side_effects: [] }
  - { method: GET, path: "/brokerage/buyers/{id}", description: "Get a buyer (incl. capital ledger)", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: [], output: Buyer, side_effects: [] }

  # ---- Listing ----
  - { method: POST, path: "/brokerage/listings", description: "Create a listing", roles: [Broker], code: 201, input: [seller_id, business_name, industry_code, annual_sde_cents, annual_revenue_cents, ffe_value_cents, inventory_value_cents, industry_multiple, asking_price_cents, exclusive_start_date, exclusive_end_date], output: Listing, side_effects: ["broker_id set from X-User-ID", "status=DRAFT", "rejects overlapping exclusive window for same seller (ERR_LISTING_PERIOD_OVERLAP)"] }
  - { method: GET, path: "/brokerage/listings", description: "List/filter listings", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["broker_id?", "seller_id?", "status?", "limit?", "offset?"], output: "Listing[]", side_effects: [] }
  - { method: GET, path: "/brokerage/listings/{id}", description: "Get a listing", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: [], output: Listing, side_effects: [] }
  - { method: POST, path: "/brokerage/listings/{id}/activate", description: "Activate a listing (requires PUBLISHED CIM)", roles: [Broker], code: 200, input: [], output: Listing, side_effects: ["status DRAFT->ACTIVE"] }
  - { method: POST, path: "/brokerage/listings/{id}/withdraw", description: "Withdraw a listing", roles: [Broker], code: 200, input: [], output: Listing, side_effects: ["status->WITHDRAWN (blocked if a deal is IN_ESCROW)"] }

  # ---- CIM ----
  - { method: POST, path: "/brokerage/listings/{id}/cims", description: "Create a CIM (valuation) draft", roles: [Broker], code: 201, input: [valuation_method], output: CIM, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/brokerage/listings/{id}/cims", description: "List CIMs for a listing", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["limit?", "offset?"], output: "CIM[]", side_effects: [] }
  - { method: POST, path: "/brokerage/cims/{id}/publish", description: "Publish a CIM; computes recommended_price_cents", roles: [Broker], code: 200, input: [], output: CIM, side_effects: ["recommended_price_cents computed", "status DRAFT->PUBLISHED"] }

  # ---- NDA ----
  - { method: POST, path: "/brokerage/listings/{id}/ndas", description: "Buyer signs NDA on a listing", roles: [Buyer], code: 201, input: [], output: NDA, side_effects: ["buyer_id set from X-User-ID", "status=SIGNED"] }
  - { method: GET, path: "/brokerage/listings/{id}/ndas", description: "List NDAs on a listing", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["buyer_id?", "limit?", "offset?"], output: "NDA[]", side_effects: [] }
  - { method: GET, path: "/brokerage/buyers/{id}/ndas", description: "List NDAs a buyer has signed", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["limit?", "offset?"], output: "NDA[]", side_effects: [] }

  # ---- Data room documents ----
  - { method: POST, path: "/brokerage/listings/{id}/documents", description: "Upload a data-room document", roles: [Broker, Seller], code: 201, input: [title, doc_type], output: DataRoomDocument, side_effects: [] }
  - { method: GET, path: "/brokerage/listings/{id}/documents", description: "List data-room documents (buyer must hold a SIGNED NDA)", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["limit?", "offset?"], output: "DataRoomDocument[]", side_effects: ["Buyer without SIGNED NDA -> ERR_NDA_REQUIRED"] }

  # ---- Management meetings ----
  - { method: POST, path: "/brokerage/listings/{id}/meetings", description: "Schedule a buyer/seller management meeting", roles: [Broker], code: 201, input: [buyer_id, start_at, end_at], output: ManagementMeeting, side_effects: ["status=SCHEDULED", "rejects if buyer lacks SIGNED NDA (ERR_NDA_REQUIRED) or slot conflicts within buffer (ERR_MEETING_SLOT_CONFLICT)"] }
  - { method: GET, path: "/brokerage/listings/{id}/meetings", description: "List meetings on a listing", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["buyer_id?", "limit?", "offset?"], output: "ManagementMeeting[]", side_effects: [] }
  - { method: GET, path: "/brokerage/buyers/{id}/meetings", description: "List meetings a buyer is attending", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["limit?", "offset?"], output: "ManagementMeeting[]", side_effects: [] }

  # ---- Deal ----
  - { method: POST, path: "/brokerage/deals", description: "Open a deal (buyer pursuing a listing)", roles: [Broker], code: 201, input: [listing_id, buyer_id], output: Deal, side_effects: ["broker_id from X-User-ID", "status=PROSPECT"] }
  - { method: GET, path: "/brokerage/deals", description: "List/filter deals", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["listing_id?", "buyer_id?", "broker_id?", "status?", "limit?", "offset?"], output: "Deal[]", side_effects: [] }
  - { method: GET, path: "/brokerage/deals/{id}", description: "Get a deal", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: [], output: Deal, side_effects: [] }
  - { method: POST, path: "/brokerage/deals/{id}/qualify", description: "Qualify the buyer on a deal", roles: [Broker], code: 200, input: [], output: Deal, side_effects: ["status PROSPECT->QUALIFIED (NDA + funds + capacity checks)"] }
  - { method: POST, path: "/brokerage/deals/{id}/open-diligence", description: "Open due diligence", roles: [Broker], code: 200, input: [], output: Deal, side_effects: ["status UNDER_LOI->DUE_DILIGENCE (needs >=1 doc)"] }
  - { method: POST, path: "/brokerage/deals/{id}/enter-financing", description: "Move to financing", roles: [Broker], code: 200, input: [], output: Deal, side_effects: ["status DUE_DILIGENCE->FINANCING"] }
  - { method: POST, path: "/brokerage/deals/{id}/withdraw", description: "Withdraw a deal (cascades)", roles: [Broker], code: 200, input: ["reason?"], output: Deal, side_effects: ["status->WITHDRAWN; cascades to LOI/escrow/listing per §1.2"] }
  - { method: POST, path: "/brokerage/deals/{id}/record-earnout-period", description: "Record one earnout measurement period and pay it", roles: [Broker], code: 200, input: [actual_sde_cents], output: Deal, side_effects: ["earnout_paid_cents += rounded period payment (calc earnout_period_payment)"] }

  # ---- LOI ----
  - { method: POST, path: "/brokerage/deals/{id}/lois", description: "Submit an LOI (OCC on deal version; supersedes prior)", roles: [Buyer], code: 201, input: [offer_price_cents, earnest_deposit_cents, earnout_amount_cents, earnout_periods, financing_contingency, expected_deal_version], output: LOI, side_effects: ["status=SUBMITTED", "committed_capital_cents += earnest_deposit_cents", "supersedes any prior non-terminal LOI", "increments Deal.version by 1"] }
  - { method: GET, path: "/brokerage/deals/{id}/lois", description: "List LOIs on a deal", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["status?", "limit?", "offset?"], output: "LOI[]", side_effects: [] }
  - { method: POST, path: "/brokerage/lois/{id}/counter", description: "Seller counters an LOI", roles: [Seller], code: 200, input: [counter_price_cents], output: LOI, side_effects: ["status SUBMITTED->COUNTERED; round_number += 1"] }
  - { method: POST, path: "/brokerage/lois/{id}/revise", description: "Buyer revises after a counter", roles: [Buyer], code: 200, input: [offer_price_cents, earnest_deposit_cents], output: LOI, side_effects: ["status COUNTERED->SUBMITTED; round_number += 1; committed_capital delta re-applied"] }
  - { method: POST, path: "/brokerage/lois/{id}/accept", description: "Seller accepts an LOI (drives deal + cascade)", roles: [Seller], code: 200, input: [], output: LOI, side_effects: ["status->ACCEPTED; Deal QUALIFIED->UNDER_LOI; provisional commission; listing + sibling-deal cascade"] }
  - { method: POST, path: "/brokerage/lois/{id}/reject", description: "Seller rejects an LOI", roles: [Seller], code: 200, input: [], output: LOI, side_effects: ["status->REJECTED; releases buyer committed_capital"] }
  - { method: POST, path: "/brokerage/lois/{id}/withdraw", description: "Buyer withdraws an LOI", roles: [Buyer], code: 200, input: [], output: LOI, side_effects: ["status->WITHDRAWN; releases buyer committed_capital"] }

  # ---- SBA financing ----
  - { method: POST, path: "/brokerage/deals/{id}/loan-applications", description: "Buyer submits an SBA loan application", roles: [Buyer], code: 201, input: [requested_amount_cents], output: SBALoanApplication, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/brokerage/deals/{id}/loan-applications", description: "List loan applications on a deal", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["status?", "limit?", "offset?"], output: "SBALoanApplication[]", side_effects: [] }
  - { method: POST, path: "/brokerage/loan-applications/{id}/decision", description: "Lender decides (branch)", roles: [Lender], code: 200, input: [outcome, "approved_amount_cents?", "decision_reason?"], output: SBALoanApplication, side_effects: ["SUBMITTED -> APPROVED | CONDITIONALLY_APPROVED | DECLINED"] }
  - { method: POST, path: "/brokerage/loan-applications/{id}/finalize-conditions", description: "Lender resolves a conditional approval", roles: [Lender], code: 200, input: [outcome], output: SBALoanApplication, side_effects: ["CONDITIONALLY_APPROVED -> APPROVED | DECLINED"] }

  # ---- Escrow / closing ----
  - { method: POST, path: "/brokerage/deals/{id}/escrow", description: "Open escrow (requires APPROVED loan)", roles: [EscrowAgent], code: 201, input: [closing_price_cents, required_deposit_cents], output: EscrowAccount, side_effects: ["status=OPENED; Deal FINANCING->IN_ESCROW; Listing->IN_ESCROW"] }
  - { method: GET, path: "/brokerage/deals/{id}/escrow", description: "List escrow accounts on a deal", roles: [PlatformAdmin, Broker, Seller, Buyer, Lender, EscrowAgent], code: 200, input: ["limit?", "offset?"], output: "EscrowAccount[]", side_effects: [] }
  - { method: POST, path: "/brokerage/escrow-accounts/{id}/deposit", description: "Buyer funds escrow", roles: [Buyer], code: 200, input: [amount_cents], output: EscrowAccount, side_effects: ["status OPENED->FUNDED; balance += amount; buyer.escrowed_cents += amount"] }
  - { method: POST, path: "/brokerage/escrow-accounts/{id}/close", description: "Close escrow (drives close cascade)", roles: [EscrowAgent], code: 200, input: [], output: EscrowAccount, side_effects: ["status FUNDED->CLOSED; final commission; seller net proceeds; broker ledger; Deal CLOSED; Listing SOLD"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting entity_backed user does not own the target resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body / missing required field / bad enum" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Semantically invalid input (e.g. CONDITIONALLY_APPROVED without approved_amount_cents)" }
  - { id: ERR_INVALID_INTERVAL, http: 409, condition: "end bound not strictly after start bound (meeting or exclusivity window)" }
  - { id: ERR_BROKER_NOT_FOUND, http: 404, condition: "Broker id not found" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "Seller id not found" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer id not found" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "Listing id not found" }
  - { id: ERR_CIM_NOT_FOUND, http: 404, condition: "CIM id not found" }
  - { id: ERR_DEAL_NOT_FOUND, http: 404, condition: "Deal id not found" }
  - { id: ERR_LOI_NOT_FOUND, http: 404, condition: "LOI id not found" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "SBALoanApplication id not found" }
  - { id: ERR_ESCROW_NOT_FOUND, http: 404, condition: "EscrowAccount id not found" }
  - { id: ERR_CIM_INVALID_STATE, http: 409, condition: "Publish attempted on a non-DRAFT CIM" }
  - { id: ERR_CIM_NOT_PUBLISHED, http: 409, condition: "Listing activate requires a PUBLISHED CIM" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "Operation requires the listing in ACTIVE state (NDA sign, LOI accept)" }
  - { id: ERR_LISTING_HAS_ACTIVE_ESCROW, http: 409, condition: "Cannot withdraw a listing with a deal IN_ESCROW" }
  - { id: ERR_LISTING_PERIOD_OVERLAP, http: 409, condition: "Exclusive engagement window overlaps another active listing for the same seller [half-open [start,end)]" }
  - { id: ERR_MEETING_SLOT_CONFLICT, http: 409, condition: "Management meeting collides with another SCHEDULED meeting within MEETING_BUFFER_MINUTES on the same listing" }
  - { id: ERR_NDA_REQUIRED, http: 409, condition: "Buyer lacks a SIGNED NDA on this listing (data-room, qualify, meeting)" }
  - { id: ERR_DEAL_NOT_QUALIFIED, http: 409, condition: "LOI submit requires the deal in QUALIFIED state" }
  - { id: ERR_DATA_ROOM_EMPTY, http: 409, condition: "open-diligence requires >= 1 data-room document" }
  - { id: ERR_LOI_INVALID_STATE, http: 409, condition: "LOI transition attempted from an incompatible status" }
  - { id: ERR_LOAN_INVALID_STATE, http: 409, condition: "Loan decision/finalize attempted from an incompatible status" }
  - { id: ERR_FINANCING_NOT_APPROVED, http: 409, condition: "Escrow open requires an APPROVED SBALoanApplication on the deal" }
  - { id: ERR_ESCROW_INVALID_STATE, http: 409, condition: "Escrow deposit attempted on a non-OPENED escrow" }
  - { id: ERR_ESCROW_NOT_FUNDED, http: 409, condition: "Escrow close requires FUNDED status" }
  - { id: ERR_ESCROW_ALREADY_CLOSED, http: 409, condition: "Deal withdraw blocked because escrow already CLOSED" }
  - { id: ERR_DEAL_INVALID_STATE, http: 409, condition: "Deal pipeline transition attempted from an incompatible status" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_deal_version does not match current Deal.version (LOI create OCC)" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Buyer proof-of-funds / available capital / capacity below the required threshold" }
  - { id: ERR_DEPOSIT_TOO_LOW, http: 402, condition: "Escrow deposit below required_deposit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Onboards brokers, sellers, buyers; no deal-flow authority"
    identity: opaque
    exclusive_operations:
      - "POST /brokerage/brokers"
      - "POST /brokerage/sellers"
      - "POST /brokerage/buyers"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Broker
    description: "Manages listings, CIMs, data room, meetings, deal pipeline, earnout recording"
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /brokerage/listings and /activate /withdraw"
      - "POST /brokerage/listings/{id}/cims and POST /brokerage/cims/{id}/publish"
      - "POST /brokerage/listings/{id}/meetings"
      - "POST /brokerage/deals and /qualify /open-diligence /enter-financing /withdraw /record-earnout-period"
    shared_operations:
      - "POST /brokerage/listings/{id}/documents (with Seller)"
      - "GET (all read endpoints)"
  - name: Seller
    description: "The selling owner; counters/accepts/rejects LOIs, uploads documents"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /brokerage/lois/{id}/counter /accept /reject"
    shared_operations:
      - "POST /brokerage/listings/{id}/documents (with Broker)"
      - "GET (all read endpoints)"
  - name: Buyer
    description: "Pursues deals; signs NDA, submits/revises/withdraws LOIs, applies for financing, funds escrow"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /brokerage/listings/{id}/ndas"
      - "POST /brokerage/deals/{id}/lois and POST /brokerage/lois/{id}/revise /withdraw"
      - "POST /brokerage/deals/{id}/loan-applications"
      - "POST /brokerage/escrow-accounts/{id}/deposit"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Lender
    description: "SBA lender; decides and finalizes loan applications"
    identity: opaque
    exclusive_operations:
      - "POST /brokerage/loan-applications/{id}/decision /finalize-conditions"
    shared_operations:
      - "GET (all read endpoints)"
  - name: EscrowAgent
    description: "Runs escrow and closing"
    identity: opaque
    exclusive_operations:
      - "POST /brokerage/deals/{id}/escrow"
      - "POST /brokerage/escrow-accounts/{id}/close"
    shared_operations:
      - "GET (all read endpoints)"
