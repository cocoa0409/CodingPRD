# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0171
# Procurement & 3-Way Match — breadth probe.
# section: / claim_type: values come verbatim from references/claim-extraction-guide.md.
# Every setup_api_calls / trigger chain replays from empty-DB using only §1.5 endpoints.
# excluded_because: stubs cite a §1.8 instance by exact name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_vendor_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Vendor
          - endpoints[POST /procurement/vendors]
        distinguishing_aspect: "POST /vendors with name+tax_id returns 201 and a Vendor with status=APPROVED, exception_count=0, grace_days=0 (default), version=1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /procurement/vendors"
              payload: { name: "Acme", tax_id: "TAX-ACME" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Vendor.${v_id}.status == APPROVED"
            - "Vendor.${v_id}.exception_count == 0"
            - "Vendor.${v_id}.grace_days == 0"
            - "Vendor.${v_id}.version == 1"

      - name: get_vendor_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Vendor
          - errors[ERR_NOT_FOUND]
          - endpoints[GET /procurement/vendors/{id}]
        distinguishing_aspect: "GET /vendors/{id} with a syntactically valid but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /procurement/vendors/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ProcurementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_spend_category_missing_required_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SpendCategory
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /procurement/spend-categories]
        distinguishing_aspect: "POST /spend-categories omitting required field `code` returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /procurement/spend-categories"
              payload: { name: "NoCode", approval_threshold_cents: 1000, director_threshold_cents: 2000 }
              as: ProcurementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_spend_category_director_below_approval_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.SpendCategory.fields.director_threshold_cents
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /procurement/spend-categories]
        distinguishing_aspect: "director_threshold_cents < approval_threshold_cents violates the declared >= constraint and returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /procurement/spend-categories"
              payload: { name: "Bad", code: "BAD", approval_threshold_cents: 5000, director_threshold_cents: 4000 }
              as: ProcurementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_vendor_duplicate_tax_id_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Vendor.fields.tax_id
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /procurement/vendors]
        distinguishing_aspect: "A second vendor reusing an existing non-terminal vendor's tax_id returns 400 ERR_INVALID_REQUEST (uniqueness)."
        test_recipe:
          setup:
            - "Vendor V1 already registered with tax_id TAX-DUP."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V1", tax_id: "TAX-DUP" }
              as: ProcurementAdmin
          trigger:
            - call: "POST /procurement/vendors"
              payload: { name: "V2", tax_id: "TAX-DUP" }
              as: ProcurementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_requisition_non_positive_quantity_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Requisition.fields.lines
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
          - endpoints[POST /procurement/requisitions]
        distinguishing_aspect: "A requisition line with quantity=0 violates quantity>0 and returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A SpendCategory exists."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-RQ" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "RQCAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Bad", lines: [ { sku: "A", description: "A", quantity: 0, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: requisition_estimated_total_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Requisition.fields.estimated_total_cents
          - calculations.estimated_total
          - endpoints[POST /procurement/requisitions/{id}/submit]
        distinguishing_aspect: "estimated_total_cents is server-computed at submit as sum(qty*est_price); for one line qty=4 est=1000 it equals 4000 regardless of any client-supplied value."
        test_recipe:
          setup:
            - "A draft requisition with one line sku=A qty=4 estimated_unit_price_cents=1000."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-EST" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "ESTCAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Est", lines: [ { sku: "A", description: "A", quantity: 4, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
          assert:
            - "Requisition.${req_id}.estimated_total_cents == 4000"
            - "Requisition.${req_id}.required_levels == 1 (4000 below both thresholds)"

      - name: quote_quoted_total_computed_from_unit_prices_and_req_qty
        claim_type: Computed Fields
        grounds:
          - entities.Quote.fields.quoted_total_cents
          - endpoints[POST /procurement/quotes]
        distinguishing_aspect: "quoted_total_cents = sum(unit_price_cents * requisition line quantity); for unit_price=1000 against req qty=4 it equals 4000."
        test_recipe:
          setup:
            - "A PENDING_APPROVAL requisition (qty=4) with an OPEN RFQ exists."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-QT" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "QTCAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Q", lines: [ { sku: "A", description: "A", quantity: 4, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-10T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
          trigger:
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-02T00:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.quoted_total_cents == 4000"
            - "Quote.${q_id}.status == SUBMITTED"

      - name: release_order_fk_must_reference_existing_blanket_po
        claim_type: Parent Relationships
        grounds:
          - entities.ReleaseOrder.fields.blanket_po_id
          - errors[ERR_NOT_FOUND]
          - endpoints[POST /procurement/release-orders]
        distinguishing_aspect: "POST /release-orders with a blanket_po_id that resolves to no PurchaseOrder returns 404 ERR_NOT_FOUND — the FK existence check (priority 3) fires before the OCC version check (priority 15), so an otherwise-valid captured version is irrelevant."
        test_recipe:
          setup:
            - "A real BLANKET PO exists (so a real version ${po_v0} can be captured), but the release targets a different, non-existent blanket_po_id."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-FKNF" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "FKNFCAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "BLANKET", ceiling_amount_cents: 1000000, valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-03-31T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id, po_v0: $.data.version }
          trigger:
            - call: "POST /procurement/release-orders"
              payload: { blanket_po_id: "00000000-0000-4000-8000-0000000000bb", amount_cents: 1000, lines: [ { sku: "A", quantity: 1, unit_price_cents: 1000 } ], expected_purchase_order_version: "${po_v0}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

  # ===========================================================================
  # SECTION: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_requisition_from_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Requisition.transitions.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /procurement/requisitions/{id}/cancel]
        distinguishing_aspect: "A CANCELLED requisition (terminal) cannot be cancelled again — the second cancel returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DRAFT requisition is cancelled (status CANCELLED)."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-SM1" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "SM1CAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "C", lines: [ { sku: "A", description: "A", quantity: 1, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
          trigger:
            - call: "POST /procurement/requisitions/${req_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Requisition.${req_id}.status == CANCELLED (unchanged)"

      - name: approve_requisition_while_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Requisition.transitions.PENDING_APPROVAL_to_APPROVED
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /procurement/requisitions/{id}/approve]
        distinguishing_aspect: "Approving a DRAFT (never-submitted) requisition with an approver who is not the requester returns 409 ERR_INVALID_STATE (no PENDING ApprovalStep exists)."
        test_recipe:
          setup:
            - "A DRAFT requisition exists (requester buyer-b1), never submitted."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-SM2" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "SM2CAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "D", lines: [ { sku: "A", description: "A", quantity: 1, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: requisition_initial_state_is_draft_on_create
        claim_type: Initial State
        grounds:
          - state_machines.Requisition.initial_state
          - endpoints[POST /procurement/requisitions]
        distinguishing_aspect: "A newly created requisition starts in status=DRAFT with revision_count=0 and committed_total_cents=null."
        test_recipe:
          setup:
            - "A SpendCategory exists."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-SM3" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "SM3CAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Init", lines: [ { sku: "A", description: "A", quantity: 1, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
          assert:
            - "Requisition.${req_id}.status == DRAFT"
            - "Requisition.${req_id}.revision_count == 0"
            - "Requisition.${req_id}.committed_total_cents == null"

      - name: pay_invoice_before_approval_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Invoice.transitions.APPROVED_FOR_PAY_to_PAID
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /procurement/invoices/{id}/pay]
        distinguishing_aspect: "Paying an invoice whose payment_status is PENDING (not APPROVED_FOR_PAY) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "An Invoice exists with payment_status=PENDING (recorded, never approved for pay)."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-SM4" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "SM4CAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Pay", lines: [ { sku: "A", description: "A", quantity: 2, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 2 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po_id}", goods_receipt_id: "${gr_id}", invoice_number: "INV-PAY", lines: [ { sku: "A", billed_qty: 2, billed_unit_price_cents: 1000 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /procurement/invoices/${inv_id}/pay"
              payload: {}
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Invoice.${inv_id}.payment_status == PENDING (unchanged)"

      - name: cancel_blanket_po_cascades_open_releases_cancelled_and_restores_ceiling
        claim_type: Cascade down
        grounds:
          - state_machines.PurchaseOrder.transitions.ISSUED_to_CANCELLED
          - state_machines.ReleaseOrder.transitions.OPEN_to_CANCELLED
          - entities.PurchaseOrder.fields.remaining_amount_cents
          - endpoints[POST /procurement/purchase-orders/{id}/cancel]
        distinguishing_aspect: "Cancelling a BLANKET PO with one OPEN release cascades the release to CANCELLED and restores remaining_amount_cents to the full ceiling (1000000)."
        test_recipe:
          setup:
            - "An ISSUED BLANKET PO ceiling 1000000 with one OPEN release of 300000 (remaining 700000); no receipts."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-SM5" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "SM5CAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "BLANKET", ceiling_amount_cents: 1000000, valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-03-31T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id, po_v0: $.data.version }
            - call: "POST /procurement/release-orders"
              payload: { blanket_po_id: "${po_id}", amount_cents: 300000, lines: [ { sku: "A", quantity: 3, unit_price_cents: 100000 } ], expected_purchase_order_version: "${po_v0}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /procurement/purchase-orders/${po_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "GET /procurement/release-orders/${rel_id}"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rel_status: $.data.status }
          assert:
            - "PurchaseOrder.${po_id}.status == CANCELLED"
            - "ReleaseOrder.${rel_id}.status == CANCELLED"
            - "PurchaseOrder.${po_id}.remaining_amount_cents == 1000000"

      - name: resolve_last_open_exception_bubbles_invoice_back_to_matched
        claim_type: Bubble up
        grounds:
          - state_machines.MatchException.transitions.OPEN_to_RESOLVED
          - state_machines.Invoice.transitions.EXCEPTION_to_MATCHED
          - endpoints[POST /procurement/match-exceptions/{id}/resolve]
        distinguishing_aspect: "Resolving the only OPEN MatchException on an EXCEPTION invoice flips Invoice.match_status EXCEPTION->MATCHED (bubble-up) and lowers Vendor.exception_count by 1."
