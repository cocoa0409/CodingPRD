      - name: nested_chain_computed_read_expands_through_a_known_respondent
        claim_type: computed_read
        grounds:
          - endpoints[GET /correspondent-banking/respondents/{respondentId}/nested-chain]
          - calculations.nested_chain_depth
        distinguishing_aspect: "This read is the only place the chain is expanded recursively: querying respondent A's chain must also surface the row that belongs to downstream respondent B, ordered depth ASC then created_at ASC, and the endpoint's own limit/offset and state filter apply to the expanded result rather than to A's directly owned rows."
        test_recipe:
          setup: ["Respondent A owns one nested edge whose downstream_respondent_bank_id is respondent B; B owns one leaf edge to a French institution created before A's edge."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "FR", name: "France", basel_aml_index: 5.00, corridor_risk_weight: 1.20 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
