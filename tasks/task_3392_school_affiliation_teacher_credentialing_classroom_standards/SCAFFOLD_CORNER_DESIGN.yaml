        distinguishing_aspect: "observed_uninterrupted_minutes 180 == the EARLY_CHILDHOOD minimum passes (>=), while 179 fails with failed_checks == [WORK_PERIOD]; both audits are otherwise identical."
        test_recipe:
          setup:
