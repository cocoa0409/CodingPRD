        - name: auto_remediation_sweep_cascade_reaches_the_commitment
          claim_type: cascading_side_effects
          grounds: "§1.5 POST /finops/scans/remediation-window-sweep declares the four-level cascade task -> resource -> cost records -> commitment; complexity layer cascading_side_effects."
          excluded_because:
            difficulty_instance: auto_remediation_sweep_cascades_task_to_resource_to_records_to_commitment
            rationale: "The §1.8 multi_hop_cascade instance already drives the full four-level chain end-to-end and pins every intermediate field, including the commitment's move to UNDER_UTILIZED."

        - name: provisional_and_final_variants_diverge_on_the_same_run
          claim_type: dual_variant_calculation
          grounds: "§1.3 allocation_run_totals declares PROVISIONAL and FINAL variants; complexity layer dual_variant_calculation."
          excluded_because:
            difficulty_instance: allocation_run_provisional_vs_final_total_divergence
            rationale: "The §1.8 dual_variant_divergence instance already computes the same run under both variants and pins the two totals plus their delta."

    - section: consistency model
      instances:
        - name: publish_cascade_is_fully_visible_in_the_publishing_response
          claim_type: immediate
          grounds: "§1.6 consistency_model immediate — all changes are visible in the same request's response; §1.5 publish declares the invoice creation, record allocation and balance recomputation as side effects of one call."
          distinguishing_aspect: "Nothing is re-read before asserting the derived figures: the publish response itself must already carry the run's totals, and the invoice, cost record and business-unit reads that follow in the same test must agree with it without any settling step."
          test_recipe:
            setup:
              - "One chargeback-enabled unit with a sealed pool holding a 7000-cent untagged record on a COMPUTED_FINAL chargeback run."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 7000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/publish"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/chargeback-invoices?allocation_run_id=${run_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/cost-records/${cr_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/business-units/${bu_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "Publish response already reports data.status == \"PUBLISHED\", data.total_allocated_cents == 7000, data.line_count == 1 and data.published_by_user_id == \"controller-1\" — no follow-up read is needed to see the cascade."
              - "Invoice list: meta.total_count == 1 with gross_amount_cents 7000, credited_amount_cents 0, net_due_cents 7000, settlement_status \"UNBILLED\" and dispute_status \"NONE\"."
              - "Record read: allocation_state == \"ALLOCATED\" with allocated_by_run_id == ${run_id} and shared_cost_pool_id == ${pool_id}."
              - "Unit read: chargeback_balance_cents == 7000 and showback_total_cents == 0 — the chargeback dimension moved and the showback dimension did not."


