                total_purse_cents: 3000000
                bonus_pool_cap_cents: 0
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /pacer-assignments
              payload: { race_edition_id: "${ed_id}", pacer_license_code: "PC-1", pacer_name: "Pace One", target_pace_seconds_per_km: 175, start_km: 0.0, end_km: 21.0 }
              as: ElitesDirector
              captures: { pace1_id: "$.data.id" }
          trigger:
            - call: POST /pacer-assignments
              payload: { race_edition_id: "${ed_id}", pacer_license_code: "PC-1", pacer_name: "Pace One", target_pace_seconds_per_km: 178, start_km: 20.9, end_km: 32.0 }
              as: ElitesDirector
              captures: { err1: "$.data.error_id" }
            - call: POST /pacer-assignments
              payload: { race_edition_id: "${ed_id}", pacer_license_code: "PC-1", pacer_name: "Pace One", target_pace_seconds_per_km: 178, start_km: 21.0, end_km: 32.0 }
              as: ElitesDirector
              captures: { pace2_id: "$.data.id" }
            - call: POST /pacer-assignments
              payload: { race_edition_id: "${ed_id}", pacer_license_code: "PC-1", pacer_name: "Pace One", target_pace_seconds_per_km: 180, start_km: 32.0, end_km: 33.0 }
              as: ElitesDirector
              captures: { err2: "$.data.error_id" }
            - call: POST /pacer-assignments
              payload: { race_edition_id: "${ed_id}", pacer_license_code: "PC-2", pacer_name: "Pace Two", target_pace_seconds_per_km: 175, start_km: 0.0, end_km: 21.0 }
              as: ElitesDirector
              captures: { pace3_id: "$.data.id" }
            - call: GET /race-editions/${ed_id}/pacer-assignments
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_PACING_RANGE_CONFLICT — [20.9, 32.0) overlaps [0.0, 21.0) on the 0.1 km stretch 20.9..21.0"
            - "trigger call 2 returns 201 — [21.0, 32.0) touches but does not overlap the existing half-open range, so adjacency is LEGAL here (unlike the fluid table)"
            - "trigger call 3 returns HTTP 422 with error_id == ERR_PACING_BEYOND_LIMIT because end_km 33.0 > MAX_PACING_KM 32.0, and this limit check precedes the overlap check even though [32.0, 33.0) would not have conflicted anyway"
            - "trigger call 4 returns 201 — occupancy is scoped per pacer_license_code, so PC-2 may pace the same kilometres as PC-1"
            - "trigger call 5 returns total_count == 3 (PC-1 [0.0,21.0), PC-1 [21.0,32.0), PC-2 [0.0,21.0)) — exactly the three accepted assignments and no others"

      - name: overlap_doping_test_closed_datetime_window_and_frequency_cap
        grounds:
          - calculations.testing_window_occupancy
          - errors.ERR_TESTING_WINDOW_OVERLAP
          - errors.ERR_TESTING_FREQUENCY_EXCEEDED
          - entities.DopingTest.fields.window_start_at
          - entities.DopingTest.fields.window_end_at
        distinguishing_aspect: >-
          A THIRD resource entity (DopingTest) on a THIRD interval semantics: availability windows are
          CLOSED DATETIME intervals, so a window starting at exactly 18:00:00Z touches the previous
          window's end and DOES overlap, while 18:00:01Z is clear by one second; layered on top is a
          frequency cap counting ALL statuses within plus or minus 7 days, which rejects an otherwise
          non-overlapping third window on 2026-10-12 but permits one on 2026-10-25. Falsifiable in one
          sentence: an implementation using half-open datetime comparison accepts the 18:00:00Z window,
          and one omitting the frequency cap accepts the 2026-10-12 window.
        test_recipe:
          setup: >-
            Edition FIELD_OPEN with one ELITE MALE athlete (whereabouts_filed true) who has a single
            scheduled OUT_OF_COMPETITION test with window 2026-10-10T08:00:00Z .. 2026-10-10T18:00:00Z.
