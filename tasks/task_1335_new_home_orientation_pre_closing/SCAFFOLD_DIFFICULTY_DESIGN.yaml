          assert:
            - "submitted_survey_count == 3 and homes_surveyed_count == 2"
            - "response_weighted_avg_score == 3.67   # round_half_up((5.00 + 2.00 + 4.00) / 3, 2) = round_half_up(3.6666...) = 3.67"
            - "home_weighted_avg_score == 3.75       # round_half_up(((5.00 + 2.00) / 2 + 4.00) / 2, 2) = (3.50 + 4.00) / 2 = 3.75"
            - "response_weighted (${rw}) != home_weighted (${hw}) for identical submitted data"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: escrow_per_line_rounding_order_pinned
        grounds:
          - calculations.escrow_holdback_amount
          - entities.Community.fields.holdback_cost_multiplier
        distinguishing_aspect: |
          Mode (b) nested rounding: with multiplier 1.5 and two items estimated
          at 33333 cents each, the PINNED order (round_half_up per line ->
          50000 + 50000) yields 100000, while the forbidden aggregate order
          (sum 99999.0 then round once) would yield 99999 — a 1-cent
          divergence proving rounding-order sensitivity.
        test_recipe:
          setup:
            - "Default-policy community (multiplier 1.5, min 50000, max 1000000)"
            - "Home h1 orientation IN_PROGRESS with two WARRANTABLE items of 33333 cents each, both decided COMPLETE_AFTER_CLOSING"
            - "Appointment then completed so the escrow is provisioned and activated"
          setup_api_calls:
