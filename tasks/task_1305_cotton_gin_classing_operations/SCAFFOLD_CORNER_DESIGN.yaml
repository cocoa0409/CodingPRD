            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-S21", net_weight_lbs: 500}, {bale_tag: "B-S22", net_weight_lbs: 500} ] }
