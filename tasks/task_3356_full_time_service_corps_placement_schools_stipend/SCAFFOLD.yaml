# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role is not in the endpoint's roles list" }
  - { id: ERR_NOT_ENTITY_OWNER, http: 403, condition: "Entity-backed role acts on a resource it does not own (member != X-User-ID; liaison school != X-User-ID)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Stipend approver equals the payment's created_by" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum, malformed date, hours not a positive multiple of 0.25 or > 12, negative cents, period_end before period_start, end_date before start_date" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current state does not permit the requested transition (incl. terminal-state calls, site not ACTIVE where required, site close with live members/teams, deploy-forming violations not covered by staffing rule)" }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "Applicant age at site.service_year_start is < 17 or > 25" }
  - { id: ERR_EDUCATION_INELIGIBLE, http: 422, condition: "education_level is LESS_THAN_HS" }
  - { id: ERR_SERVICE_INELIGIBLE, http: 422, condition: "citizenship_status OTHER, prior_service_terms >= 4, or prior_full_awards_received >= 2" }
  - { id: ERR_SERVICE_DATE_INVALID, http: 422, condition: "service_date after the logical-clock date or before site.service_year_start" }
  - { id: ERR_VERIFICATION_WINDOW_EXPIRED, http: 422, condition: "Entry verified more than 30 days after service_date" }
  - { id: ERR_BACKFILL_WINDOW_CLOSED, http: 422, condition: "Backfill assignment created after team.backfill_deadline" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 422, condition: "Report submitted more than 45 days after period_end" }
  - { id: ERR_DAILY_HOUR_CAP_EXCEEDED, http: 422, condition: "Verification would push the member's same-day PENDING+VERIFIED hours over 12.0" }
  - { id: ERR_FUNDRAISING_CAP_EXCEEDED, http: 422, condition: "Verification of a FUNDRAISING entry would exceed the 10% quarter-hour-floored cap" }
  - { id: ERR_CASELOAD_FULL, http: 422, condition: "Member already holds 12 ASSIGNED students" }
  - { id: ERR_STUDENT_CASELOAD_CONFLICT, http: 409, condition: "Student already has caseload_status ASSIGNED" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "New assignment interval overlaps an existing non-ENDED assignment of the same member (half-open intervals; end_date == start_date is allowed)" }
  - { id: ERR_TEAM_CAPACITY_EXCEEDED, http: 422, condition: "New assignment would push same-date team coverage above team_size_snapshot" }
  - { id: ERR_BACKFILL_LIMIT_REACHED, http: 422, condition: "team.backfill_count == team.backfill_limit when a backfill assignment is attempted" }
  - { id: ERR_TEAM_STAFFING_BELOW_MINIMUM, http: 422, condition: "Deploy attempted with active_assignment_count < team_size_snapshot - 2" }
  - { id: ERR_DUPLICATE_PAYMENT_PERIOD, http: 409, condition: "A StipendPayment for this member with the same period_start already exists" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "School agreement is not ACTIVE (team create/deploy, student create, report create) or not in {ACTIVE, COMPLETED} for report create" }
  - { id: ERR_DATA_SHARING_NOT_SIGNED, http: 409, condition: "data_sharing_status is not SIGNED where required (agreement activation, amendment confirmation, report submission)" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member service_status (or stipend_status for stipend operations) is not ACTIVE" }
  - { id: ERR_MEMBER_NOT_PLACED, http: 422, condition: "Caseload ASSIGN target member holds no ACTIVE TeamAssignment to a DEPLOYED/UNDERSTAFFED team at the student's school" }
  - { id: ERR_AWARD_NOT_EARNED, http: 409, condition: "Award disburse attempted while award_status not in {EARNED_FULL, EARNED_PARTIAL}" }
  - { id: ERR_COMPLETION_HOURS_NOT_MET, http: 422, condition: "exit_type=COMPLETED_TERM with verified_hours_total < 120" }
  - { id: ERR_SITE_FUNDING_DEFICIT, http: 422, condition: "Paying the stipend would exceed site funding headroom" }

# =============================================================================
# §1.7 RBAC Matrix (role model: segregation_of_duties)
# =============================================================================
roles:
  - name: SiteDirector
    description: "Site executive; owns site configuration, funding receipts, school agreements, team lifecycle, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /corps/_clock/set_current_utc"
      - "POST /corps/sites; POST /corps/sites/{id}/state; POST /corps/sites/{id}/funding/receive"
      - "POST /corps/schools; POST /corps/schools/{id}/amend"
      - "School agreement transitions SIGNED->ACTIVE, SUSPENDED->ACTIVE, ACTIVE->SUSPENDED, ACTIVE->COMPLETED, ACTIVE/SUSPENDED->TERMINATED (AMENDMENT_REVIEW->ACTIVE confirmation is SchoolLiaison)"
      - "POST /corps/teams; POST /corps/teams/{id}/state"
    shared_operations:
      - "GET reads of sites, schools, teams, assignments, members, students, hour entries, stipend payments, evaluation reports"
  - name: ProgramManager
    description: "Runs recruitment, placement, coaching and hour verification; must NOT approve or pay stipends (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /corps/applications/{id}/state (SCREEN, INTERVIEWED, OFFERED, REJECTED, ENROLLED, WITHDRAWN)"
      - "POST /corps/members/{id}/state with dimension=SERVICE; POST /corps/members/{id}/exit"
      - "POST /corps/teams/{id}/assignments; POST /corps/team-assignments/{id}/end"
      - "POST /corps/students; POST /corps/students/{id}/state; POST /corps/students/{id}/caseload; POST /corps/students/{id}/metrics"
      - "POST /corps/hour-entries/{id}/review"
      - "POST /corps/evaluation-reports; POST /corps/evaluation-reports/{id}/state with to_status=SUBMITTED"
    shared_operations:
      - "GET reads of sites, schools, teams, assignments, members, students, hour entries, stipend payments, evaluation reports"
  - name: StipendAdministrator
    description: "Administers living stipends and education awards; must NOT verify service hours (segregation of duties); approver must differ from payment creator"
    identity: opaque
    exclusive_operations:
      - "POST /corps/members/{id}/stipend-payments; POST /corps/stipend-payments/{id}/state"
      - "POST /corps/members/{id}/state with dimension=STIPEND or dimension=AWARD"
    shared_operations:
      - "GET reads of sites, members, hour entries, stipend payments"
  - name: SchoolLiaison
    description: "District-side signatory for one school; signs agreements and data-sharing, confirms amendments, reviews evaluation reports for own school only"
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /corps/schools/{id}/state: agreement DRAFT->SIGNED, AMENDMENT_REVIEW->ACTIVE (amendment confirmation), data-sharing SIGNED/EXPIRED re-sign"
      - "POST /corps/evaluation-reports/{id}/state with to_status=ACCEPTED or RETURNED (own school only)"
    shared_operations:
      - "GET reads of schools, teams, students, evaluation reports"
  - name: CorpsMember
    description: "Enrolled corps member; logs own service hours and reads own record"
    identity: "entity_backed:CorpsMember"
    exclusive_operations:
      - "POST /corps/hour-entries (corps_member_id must equal X-User-ID)"
    shared_operations:
      - "GET reads of own member record, own assignments, own students, own hour entries, own stipend payments"
  - name: Applicant
    description: "Prospective corps member; submits an application and responds to an offer"
    identity: opaque
    exclusive_operations:
      - "POST /corps/applications"
      - "POST /corps/applications/{id}/state with to_status in {ACCEPTED, DECLINED, WITHDRAWN}"
    shared_operations: []
