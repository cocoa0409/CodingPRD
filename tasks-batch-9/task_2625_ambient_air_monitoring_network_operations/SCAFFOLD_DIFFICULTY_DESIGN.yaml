          DataBatch carries two parallel state dimensions on one row: reopening a quarter after its annual package was
          submitted moves validation_status VALIDATED -> REOPENED while submission_status stays SUBMITTED, and the package
          itself stays SUBMITTED - proving the dimensions are independent rather than a single linear pipeline. The second
          non-linear machine in this rule sits on a different entity (ExceptionalEventDemonstration).
