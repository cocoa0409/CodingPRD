              as: SalesRep
              captures: { pr_id: $.data.id }
            - call: "POST /pallet-ops/pool-returns/${pr_id}/grade"
              payload: { grade_on_return: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/pool-returns/${pr_id}/credit"
              payload: {}
              as: SalesRep
            - call: "GET /pallet-ops/customers/${cust_id}"
              payload: {}
              as: SalesRep
              captures: { bal_before: $.data.pool_credit_balance_cents }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 3, quality_grade_requested: "NEW" }
              as: SalesRep
