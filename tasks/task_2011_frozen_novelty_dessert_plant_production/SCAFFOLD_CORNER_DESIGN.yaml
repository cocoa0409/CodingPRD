- section: state_machines
  instances:
  - name: run_complete_from_scheduled_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ProductionRun
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: complete is only valid from IN_PRODUCTION; from SCHEDULED it fails with ERR_INVALID_STATE and no lot is created.
    test_recipe:
      setup:
      - product + line + run R-I in SCHEDULED (never assigned mix)
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: BAR-VAN-70
          product_name: Vanilla Bar
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p_bar: $.data.id
      - call: POST /lines
        payload:
          line_code: L-1
          format: NOVELTY
          rate_units_per_hour: 12000
        as: PlantManager
        captures:
          l1: $.data.id
      - call: POST /freezer-zones
        payload:
          zone_code: Z-A
          pallet_capacity: 400
        as: PlantManager
        captures:
          z_a: $.data.id
      - call: POST /production-runs
        payload:
          run_code: R-I
          product_id: ${p_bar}
          line_id: ${l1}
          planned_units: 100
          scheduled_start: '2026-08-10T14:00:00Z'
        as: ProductionPlanner
        captures:
          r1: $.data.id
      trigger:
      - call: POST /production-runs/${r1}/complete
        payload:
          actual_units: 100
          mix_metered_litres: 10.0
          zone_id: ${z_a}
        as: LineOperator
        as_user_id: op_1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (409)
      - GET /production-runs/${r1} still shows status SCHEDULED
  - name: mix_release_after_reject_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.MixBatch
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'REJECTED is terminal: releasing a rejected batch fails ERR_INVALID_STATE; nothing can leave a terminal state.'
    test_recipe:
      setup:
      - batch MB-X pasteurized then rejected by QA
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: BAR-VAN-70
          product_name: Vanilla Bar
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p_bar: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T08:00:00Z'
        as: PlantManager
      - call: POST /mix-batches
        payload:
          batch_code: MB-X
          product_id: ${p_bar}
          litres_produced: 500
        as: ProductionPlanner
        captures:
          m1: $.data.id
      - call: POST /mix-batches/${m1}/pasteurize
        as: LineOperator
        as_user_id: op_1
      - call: POST /mix-batches/${m1}/reject
        as: QAManager
        as_user_id: qa_1
      trigger:
      - call: POST /mix-batches/${m1}/release
        as: QAManager
        as_user_id: qa_2
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (REJECTED is terminal)
      - batch status remains REJECTED
  - name: claim_appeal_after_paid_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.TempAbuseClaim
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'PAID is terminal: appeal from PAID fails ERR_INVALID_STATE even inside the 14-day window.'
    test_recipe:
      setup:
      - delivered shipment with 2 readings; claim CL-P reviewed, approved, and paid
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: BAR-VAN-70
          product_name: Vanilla Bar
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p_bar: $.data.id
      - call: POST /lines
        payload:
          line_code: L-1
          format: NOVELTY
          rate_units_per_hour: 12000
        as: PlantManager
        captures:
          l1: $.data.id
      - call: POST /tunnels
        payload:
          tunnel_code: T-1
          max_units_per_hour: 20000
        as: PlantManager
        captures:
          t1: $.data.id
      - call: POST /freezer-zones
        payload:
          zone_code: Z-A
          pallet_capacity: 400
        as: PlantManager
        captures:
          z_a: $.data.id
      - call: POST /customers
        payload:
          customer_code: C-DIST
          display_name: Distributor Co
          kind: DISTRIBUTOR
        as: PlantManager
        captures:
          c_dist: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T08:00:00Z'
        as: PlantManager
      - call: POST /mix-batches
        payload:
          batch_code: MB-1
          product_id: ${p_bar}
          litres_produced: 500
        as: ProductionPlanner
        captures:
          m1: $.data.id
      - call: POST /mix-batches/${m1}/pasteurize
        as: LineOperator
        as_user_id: op_1
      - call: POST /mix-batches/${m1}/release
        as: QAManager
        as_user_id: qa_1
      - call: POST /production-runs
        payload:
          run_code: R-P
          product_id: ${p_bar}
          line_id: ${l1}
          planned_units: 2000
          scheduled_start: '2026-08-10T14:00:00Z'
        as: ProductionPlanner
        captures:
          r1: $.data.id
      - call: POST /changeovers
        payload:
          line_id: ${l1}
          to_product_id: ${p_bar}
        as: ProductionPlanner
        captures:
