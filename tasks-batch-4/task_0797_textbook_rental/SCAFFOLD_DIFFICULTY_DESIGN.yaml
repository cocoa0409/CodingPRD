              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "GOOD", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
          assert:
            - "InventoryUnit.${unit_id}.status == AVAILABLE"
            - "InventoryUnit.${unit_id}.times_rented == 1"
            - "Rental.${rental_id}.status == CLOSED_RETURNED"
