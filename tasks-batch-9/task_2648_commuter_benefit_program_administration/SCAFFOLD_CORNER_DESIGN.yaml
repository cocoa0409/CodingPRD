            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-LL-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}", opening_rollover_cents: 2000 }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /benefits/transit-media"
              payload: { sku: "AUS-LL", media_type: "PAPER_PASS", region_code: "US-TX-AUS", eligible_category_type: "TRANSIT_PASS", unit_price_cents: 6000 }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_id: $.data.id }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 6000, posttax_amount_cents: 0, transit_media_id: "${med_id}", media_quantity: 1, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { el_id: $.data.id, el_v: $.data.version }
            - call: "POST /benefits/order-batches"
