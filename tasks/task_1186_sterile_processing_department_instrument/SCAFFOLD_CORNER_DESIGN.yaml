          trigger:
            - { call: "POST /spd/technicians/${ta}/reinstate", as: SpdSupervisor, as_user_id: "${ts}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/technicians/${ta}/suspend", as: SpdSupervisor, as_user_id: "${ts}", captures: { s1: "$.data.status" } }
            - { call: "POST /spd/technicians/${ta}/suspend", as: SpdSupervisor, as_user_id: "${ts}", captures: { e2: "$.data.error_id" } }
            - { call: "POST /spd/technicians/${ta}/reinstate", as: SpdSupervisor, as_user_id: "${ts}", captures: { s2: "$.data.status" } }
          assert:
