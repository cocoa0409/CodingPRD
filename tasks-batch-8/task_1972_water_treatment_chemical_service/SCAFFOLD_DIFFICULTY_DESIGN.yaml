            - "WaterTestResult.${c6a_wtr_lo}.classification == BALANCED"

      - name: coupon_exposure_exactly_30_days_is_reliable
        grounds:
          - calculations.coupon_corrosion_rate
          - entities.CorrosionCoupon.fields.rating
        distinguishing_aspect: |
          Zero-count/integer-day boundary: exposure_days exactly 30 rates
          RELIABLE (>= 30) while 29 rates UNRELIABLE — exercised via
          POST /wt/coupons/{couponId}/remove, a different metric and endpoint
          than the LSI boundary. mpy literals: 3.148 (30d) vs 3.257 (29d).
        test_recipe:
          setup:
            - "Commissioned asset with INSTALLED rack RK (position_count 4); coupon C30 installed at 2026-08-01T00:00:00Z position 1; coupon C29 installed at 2026-08-01T00:00:00Z position 2; both pre_weight 50.0g, MILD_STEEL density 7.87, area 5.4 in2"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Coupon Co" }
              as: AccountManager
              captures: { c6b_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c6b_acct}", asset_tag: "CT-CP", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c6b_asset: $.data.id }
            - call: "POST /wt/racks"
              payload: { asset_id: "${c6b_asset}", rack_code: "RK-1", position_count: 4 }
              as: WaterChemist
              captures: { c6b_rack: $.data.id }
            - call: "POST /wt/racks/${c6b_rack}/coupons"
              payload: { position_index: 1, alloy: "MILD_STEEL", density_g_cm3: 7.87, area_in2: 5.4, pre_weight_g: 50.0, installed_at: "2026-08-01T00:00:00Z" }
              as: WaterChemist
              captures: { c6b_c30: $.data.id }
            - call: "POST /wt/racks/${c6b_rack}/coupons"
              payload: { position_index: 2, alloy: "MILD_STEEL", density_g_cm3: 7.87, area_in2: 5.4, pre_weight_g: 50.0, installed_at: "2026-08-01T00:00:00Z" }
              as: WaterChemist
              captures: { c6b_c29: $.data.id }
          trigger:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/coupons/${c6b_c30}/remove", payload: { post_weight_g: 49.82 }, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/coupons/${c6b_c29}/remove", payload: { post_weight_g: 49.82 }, as: WaterChemist }
          assert:
            - "CorrosionCoupon.${c6b_c30}.exposure_days == 30"
            - "CorrosionCoupon.${c6b_c30}.rating == RELIABLE"
            - "CorrosionCoupon.${c6b_c30}.corrosion_rate_mpy == 3.148"
            - "CorrosionCoupon.${c6b_c29}.exposure_days == 29"
            - "CorrosionCoupon.${c6b_c29}.rating == UNRELIABLE"
            - "CorrosionCoupon.${c6b_c29}.corrosion_rate_mpy == 3.257"

  # ---------------------------------------------------------------------------
