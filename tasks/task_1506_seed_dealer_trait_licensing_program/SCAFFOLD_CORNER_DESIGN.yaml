  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Any call without X-User-ID / X-User-Role headers returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /dealer/programs"
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the test client omits both X-User-ID and X-User-Role headers for this call"
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: agronomist_cannot_create_order_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", roles]
        distinguishing_aspect: "Agronomist is not in POST /dealer/orders roles; the call is rejected 403 before existence checks run."
        test_recipe:
          setup: ["program OPEN; grower G"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
          trigger:
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"

      - name: grower_cannot_confirm_another_growers_order_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_GROWER_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Grower role with X-User-ID of grower G2 confirming an order owned by G1 is rejected 403 ERR_GROWER_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["program OPEN; growers G1 and G2; SOY-V2 + lot; DRAFT order for G1 with a 10-unit line"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g1: $.data.id }
            - call: "POST /dealer/growers"
              payload: { account_name: "Jones Ag", external_ref: "EXT-002", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g2: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g1}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
          trigger:
            - call: "POST /dealer/orders/${o}/confirm"
              as: Grower
              as_user_id: "${g2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GROWER_OWNERSHIP_MISMATCH, http 403"
            - "order remains DRAFT"

      - name: confirm_exceeding_credit_limit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Order projected net 1692000 (100 units x 16920 after the 600bps tier) against a 1000000 credit limit with zero outstanding is rejected; the order stays DRAFT and no inventory is reserved."
        test_recipe:
          setup: ["program OPEN; grower with credit_limit_cents 1000000; SOY-V2 @18000; lot 500; DRAFT order with one 100-unit line"]
