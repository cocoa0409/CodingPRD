          assert:
            - "First swap succeeds (201): BoxItem.${it_2} created, swap_count == 1"
            - "Second swap rejected: err == ERR_SWAP_ALLOWANCE_EXCEEDED (HTTP 422) because swap_count 1 == allowance 1 (boundary: count < allowance required)"
            - "BoxItem.${it_2}.loan_status remains PENDING_RETURN; ToyCopy.${c3} remains AVAILABLE"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: box_create_requires_active_subscription
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - calculations.rotation_cadence_schedule
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair RotationBox -> Subscription: RotationBox creation is gated on
          the PARENT Subscription being ACTIVE; a PAUSED subscription rejects
          box creation with ERR_SUBSCRIPTION_NOT_ACTIVE even though the OCC
          version matches.
        test_recipe:
          setup:
            - "Plan STD; member M; subscription paused at the default clock (immediate window 2026-05-01 + 7 days)"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.xdep1@x.com", full_name: "XDep Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-01", duration_days: 7 }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/subscriptions/${s_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { s_v_now: $.data.version }
          trigger:
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v_now}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUBSCRIPTION_NOT_ACTIVE (HTTP 409): RotationBox create is gated by the parent Subscription's state, not by any RotationBox field"
            - "No RotationBox created: GET /toy-rental/subscriptions/${s_id}/rotation-boxes returns an empty array"

      - name: sweep_promotion_requires_available_copy
        grounds:
          - state_machines.WishlistEntry.WAITING_to_HELD
          - calculations.wishlist_allocation_selector
          - state_machines.ToyCopy.AVAILABLE_to_RESERVED
        distinguishing_aspect: |
          Pair WishlistEntry -> ToyCopy (different pair from
          RotationBox -> Subscription): the allocation sweep may only promote a
          WAITING entry when a ToyCopy of that catalog item is AVAILABLE; with
          the sole copy RESERVED to another member's box, a global ops run
          promotes nothing.
        test_recipe:
          setup:
            - "Plan STD (max_holds 2); catalog item X age [12,36] with exactly one NEW copy C1"
            - "Member A holds C1 in a PLANNED box (C1 RESERVED to A); member B (child born 2025-01-15) has a WAITING wishlist entry on item X"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-XDEP-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.xa@x.com", full_name: "Member XA", password: "pw" }
              as: Anonymous
              captures: { m_a: $.data.id }
            - call: "POST /toy-rental/members/${m_a}/children"
              payload: { name: "KidA", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /toy-rental/members/${m_a}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { s_a: $.data.id, s_a_v: $.data.version }
            - call: "POST /toy-rental/subscriptions/${s_a}/rotation-boxes"
              payload: { expected_subscription_version: "${s_a_v}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { b_a: $.data.id, b_a_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_a}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_a_v}" }
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.xb@x.com", full_name: "Member XB", password: "pw" }
              as: Anonymous
              captures: { m_b: $.data.id }
            - call: "POST /toy-rental/members/${m_b}/children"
              payload: { name: "KidB", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /toy-rental/members/${m_b}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /toy-rental/members/${m_b}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_b}"
              captures: { e_b: $.data.id }
          trigger:
            - call: "POST /toy-rental/ops/allocation-runs"
              as: OperationsManager
              captures: { promoted: $.data.promoted_count }
          assert:
            - "promoted == 0: the sweep found no AVAILABLE copy of item X (C1 is RESERVED to member A)"
            - "WishlistEntry.${e_b}.status remains WAITING with held_copy_id null"
            - "ToyCopy.${c1}.status remains RESERVED with reserved_member_id == ${m_a} (the copy's state gates the entry's transition)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pause_windows_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.Subscription.fields.pause_windows
          - errors[ERR_PAUSE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource Subscription with HALF-OPEN interval semantics
          ([start_date, end_date)): pure adjacency (new start == prior end) is
          legal while true overlap is rejected ERR_PAUSE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Plan STD; member M; subscription ACTIVE at default clock 2026-05-01"
            - "First pause window consumed early: [2026-05-01, 2026-05-06) after resume at clock 2026-05-06"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.ovl@x.com", full_name: "Ovl Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-01", duration_days: 14 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/subscriptions/${s_id}/resume"
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-06", duration_days: 7 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/subscriptions/${s_id}/resume"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-13", duration_days: 7 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-15", duration_days: 7 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacency legal: pause starting 2026-05-06 (exactly the prior window's end) succeeds; subscription went PAUSED then ACTIVE again on resume (consumed 0)"
            - "Scheduled future window [2026-05-13, 2026-05-20) accepted; subscription remains ACTIVE"
            - "Overlapping window [2026-05-15, 2026-05-22) rejected: err == ERR_PAUSE_WINDOW_OVERLAP (HTTP 409)"
            - "Subscription.${s_id}.pause_windows holds exactly 3 entries after the rejection"

      - name: sanitization_buffer_gap
        grounds:
          - state_machines.ToyCopy.SANITIZING_to_AVAILABLE
          - validations[priority=7]
          - errors[ERR_SANITIZATION_BUFFER_ACTIVE]
        distinguishing_aspect: |
          Resource ToyCopy with MANDATORY-BUFFER semantics (different resource
          and different geometry from half-open pause windows): consecutive
          loan occupations must be separated by >= 24h of sanitization; at
          +12h the completion is rejected ERR_SANITIZATION_BUFFER_ACTIVE, at
          exactly +24h it succeeds (>=, not >).
        test_recipe:
          setup:
            - "Plan STD; member M with child born 2025-01-15; catalog item age [12,36] replacement 3000; NEW copy"
            - "Full rental loop done: delivered 2026-05-03, return received 2026-05-08 (on time); clock set to 2026-05-10T00:00:00Z; inspection (clean, RESTOCK) moves the copy to SANITIZING with sanitization_started_at == 2026-05-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.san@x.com", full_name: "San Member", password: "pw" }
