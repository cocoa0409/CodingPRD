            - "${tons} == 21.60, ${base} == 54432, ${sur} == 2449 and ${total} == 56881 - the base 54432 sits in the middle surcharge tier at 4.5 percent and 2449.44 rounds half up to 2449"
            - "P-NEAR would have quoted 10 * 300 * 21.60 = 64800 base plus 2916 surcharge = 67716, which is why it loses despite being six times closer"
            - "P-EQUIP is at the same 60 miles and the same rate 42 as the winner, so it would quote exactly 56881 and win the created_at ASC tie-break if the unloading-equipment filter were skipped; the winner being P-FAR is what proves the filter ran"
            - "P-DRAFT is excluded for having no QUALIFIED RED formulation even though its rate 20 would have quoted the cheapest haul of all"
            - "P-MW is excluded because DURABILITY_RANK[MW] of 2 is below DURABILITY_RANK[SW] of 3 - the comparison is a floor, and an SW body serving an MW order is asserted separately in the validations section"
            - "P-IDLED sits exactly on the jobsite at distance 0 with the cheapest rate and is still excluded; its formulation was also RETIRED by the idle cascade, so the exclusion is doubly determined"
            - "${lead} == 17 and ${promised} == 2026-08-18T00:00:00Z - the ceil(9600 / 4000) = 3 production term comes from the WINNER's daily capacity of 4000, not from P-NEAR's 40000, which would have given 15 days"
            - "${fs} == ASSIGNED and ${frs} == ESTIMATED"

  # =======================================================================
  # SECTION 9 - CONSISTENCY MODEL
  # complexity_profile.consistency_model is `immediate`, so every derived
  # field must be correct in the response of the request that caused it and
  # in the very next read by any role - no settling, no polling, no
  # per-role caching.
  # =======================================================================
  - section: consistency_model
    instances:
      - name: grading_returns_every_derived_value_in_its_own_response_and_the_next_read_agrees
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /kiln-runs/{id}/grade]
          - calculations[firing_color_development]
        distinguishing_aspect: "One request writes across five entities - KilnRun, ProductionRun, KilnCar, a freshly minted FiredLot and the Plant scrap counter - and every one of those values is read back immediately with no intervening write, so an implementation that defers any of them to a later recompute is caught."
        test_recipe:
          setup:
            - "Plant P1 with QUALIFIED formulation F1, kiln K1 (5 positions, setpoint 1050), car C1"
            - "ProductionRun R1 set at 10000 green units, closed at 400 loss, loaded at position 3"
            - "KilnRun KR1 FIRING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["TRUCK_MOUNTED_FORKLIFT"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { k1: "$.data.id" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /production-runs/${r1}/close-green"
              payload: { green_loss_units: 400 }
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR1", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1: "$.data.id", kr1v1: "$.data.version" }
            - call: "POST /kiln-runs/${kr1}/load"
              payload: { production_run_id: "${r1}", kiln_position: 3, expected_kiln_run_version: "${kr1v1}" }
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "POST /kiln-runs/${kr1}/start"
              payload: {}
              as: PlantOperator
              as_user_id: "${p1}"
          trigger:
            - call: "POST /kiln-runs/${kr1}/grade"
              payload: { actual_peak_temp_c: 1040, actual_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr_status: "$.data.status", kr_base_cdi: "$.data.base_cdi", kr_dev: "$.data.firing_curve_deviation", kr_loaded: "$.data.loaded_units", kr_grader: "$.data.graded_by_user_id" }
            - call: "GET /fired-lots"
              payload: { production_run_id: "${r1}" }
              as: QualityManager
              as_user_id: "qual-001"
              captures: { lot_code: "$.data[0].lot_code", lot_dye: "$.data[0].dye_lot_code", lot_units: "$.data[0].fired_units", lot_grade: "$.data[0].grade", lot_pcdi: "$.data[0].position_cdi", lot_ci: "$.data[0].color_index", lot_family: "$.data[0].color_family", lot_texture: "$.data[0].texture", lot_dur: "$.data[0].durability_grade", lot_status: "$.data[0].status", lot_avail: "$.data[0].available_units" }
            - call: "GET /production-runs/${r1}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logi-001"
              captures: { run_status: "$.data.status", run_net: "$.data.net_green_units", run_pos: "$.data.kiln_position", run_scrap: "$.data.scrap_units" }
            - call: "GET /plants/${p1}/kiln-cars"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { car_status: "$.data[0].status", car_run: "$.data[0].current_production_run_id" }
            - call: "GET /plants/${p1}"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { plant_scrap: "$.data.fired_scrap_units", plant_status: "$.data.status" }
          assert:
            - "${kr_status} == GRADED, ${kr_base_cdi} == 20.68, ${kr_dev} == 1.00 and ${kr_loaded} == 9600 - all four are in the grade response itself, not only in a later read"
            - "${kr_grader} == the acting X-User-ID, stamped in the same request"
            - "${lot_code} == R1-P3 and ${lot_dye} == F1-KR1-P3 - both codes are minted server-side during grading"
            - "${lot_units} == 9600, ${lot_avail} == 9600, ${lot_grade} == ON_COLOR, ${lot_status} == AVAILABLE"
            - "${lot_pcdi} == 20.68 and ${lot_ci} == 52.18 - position 3 of 5 is the centerline, so the position delta is exactly 0.00 and position_cdi equals base_cdi"
            - "${lot_family} == RED, ${lot_texture} == WIRE_CUT and ${lot_dur} == SW - the lot pins the attributes it inherited, and a QualityManager sees them on the first read"
            - "${run_status} == FIRED, ${run_net} == 9600, ${run_pos} == 3 and ${run_scrap} == 0"
            - "${car_status} == IDLE and ${car_run} is null - the car is free for reuse in the same request that graded the run"
            - "${plant_scrap} == 0 and ${plant_status} == ACTIVE - the scrap counter is present and zero, not null or absent, immediately after an ON_COLOR firing"
            - "No read is repeated or delayed anywhere in this recipe: each derived value is asserted on its first observation"

      - name: every_downstream_reservation_and_release_is_visible_to_the_next_reader_of_any_role
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities[FiredLot].fields[reserved_units]
          - entities[FiredLot].fields[consumed_units]
          - entities[ShippedBlend].fields[allocated_units]
        distinguishing_aspect: "The allocation ledger is walked forward through reservation, composition, certification, packaging and delivery, and after every single write a DIFFERENT role reads the affected rows once. Reserved units, consumed units and available units must reconcile to the conserved 9600 at every one of those five observation points."
