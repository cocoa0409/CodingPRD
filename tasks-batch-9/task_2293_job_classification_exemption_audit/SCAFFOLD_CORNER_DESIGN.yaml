            - "GET /audit-projects/${proj_a_id}/job-families returns exactly 1 row and GET /audit-projects/${proj_b_id}/job-families returns exactly 1 row"

      - name: duty_percentages_are_rejected_only_once_the_running_sum_passes_one_hundred
        claim_type: aggregate_validation
        grounds: ["validations[priority=13]", "errors[ERR_DUTY_TIME_OVERALLOCATED]", "entities.DutyStatement.fields.claimed_time_pct"]
        distinguishing_aspect: "Each individual claimed_time_pct is inside its own 0..100 constraint; only the collective sum can break the rule. 60.0 then 45.0 must be refused at 105.0, while 60.0 then 40.0 must be accepted at exactly 100.0 - the limit is inclusive, so the check is > 100 and not >= 100."
