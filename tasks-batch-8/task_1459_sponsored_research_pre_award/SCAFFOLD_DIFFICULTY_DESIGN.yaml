# =============================================================================
# §1.8 Scaffold Difficulty Design — Sponsored Research Pre-Award
# Test Targeting Index: 9 Difficulty Rules x >= 2 instances (26 instances total)
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: indirect_cost_mtdc_vs_tdc
        grounds:
          - calculations.indirect_cost
          - entities.Proposal.fields.fa_base_type
          - entities.BudgetLine.fields.counts_toward_mtdc
        distinguishing_aspect: |
          Same five budget lines, same 54% rate: fa_base_type MTDC yields
          total_indirect_cents 7020000 on a 13000000 base (EQUIPMENT excluded,
          subaward capped at the first 2500000 per commitment), while TDC yields
          9990000 on a 18500000 base — the dual variant lives on the Proposal
          budget domain.
        test_recipe:
          setup:
            - "Opportunity O1 without caps or cost-share; PI eligible; PROVISIONAL rate 54.00% ON_CAMPUS_RESEARCH covering [2026-01-01, 2029-01-01)"
            - "Subrecipient org (score 10, LOW); proposal A (MTDC, window 2026-09-01..2027-08-31) with commitment A and 5 lines; proposal B (TDC, window 2027-09-01..2028-08-31) with commitment B and the same 5 lines"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P One", department_code: "BIO", rank: "ASSOCIATE", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Sub U", uei: "UEI-AAA1", single_audit_status: "CURRENT", audit_finding_count: 0 }
              as: SubrecipientManager
              captures: { org_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "A", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_a: $.data.id }
            - call: "POST /pre-award/proposals/${prop_a}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 4000000, statement_of_work_received: true, budget_received: true }
              as: PreAwardAnalyst
              captures: { comm_a: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-lines", payload: { category: "EQUIPMENT", description: "scope", fiscal_year: 2027, amount_cents: 4000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-lines", payload: { category: "SUBAWARD", description: "sub yr1", fiscal_year: 2027, amount_cents: 3000000, is_cost_share: false, subrecipient_commitment_id: "${comm_a}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-lines", payload: { category: "SUBAWARD", description: "sub yr2", fiscal_year: 2028, amount_cents: 1000000, is_cost_share: false, subrecipient_commitment_id: "${comm_a}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-lines", payload: { category: "TRAVEL", description: "travel", fiscal_year: 2027, amount_cents: 500000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_a}", payload: {}, as: OSPDirector, captures: { pv_a: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_a}/budget-finalizations"
              payload: { expected_proposal_version: "${pv_a}" }
              as: PreAwardAnalyst
              captures: { snap_a_indirect: $.data.total_indirect_cents, snap_a_direct: $.data.total_direct_cents, snap_a_base: $.data.mtdc_base_cents, snap_a_request: $.data.total_request_cents }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "B", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2027-09-01", project_end_on: "2028-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_b: $.data.id }
            - call: "POST /pre-award/proposals/${prop_b}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 4000000, statement_of_work_received: true, budget_received: true }
              as: PreAwardAnalyst
              captures: { comm_b: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2028, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-lines", payload: { category: "EQUIPMENT", description: "scope", fiscal_year: 2028, amount_cents: 4000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-lines", payload: { category: "SUBAWARD", description: "sub yr1", fiscal_year: 2028, amount_cents: 3000000, is_cost_share: false, subrecipient_commitment_id: "${comm_b}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-lines", payload: { category: "SUBAWARD", description: "sub yr2", fiscal_year: 2028, amount_cents: 1000000, is_cost_share: false, subrecipient_commitment_id: "${comm_b}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-lines", payload: { category: "TRAVEL", description: "travel", fiscal_year: 2028, amount_cents: 500000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_b}", payload: {}, as: OSPDirector, captures: { pv_b: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_b}/budget-finalizations"
              payload: { expected_proposal_version: "${pv_b}" }
              as: PreAwardAnalyst
              captures: { snap_b_indirect: $.data.total_indirect_cents, snap_b_base: $.data.mtdc_base_cents, snap_b_request: $.data.total_request_cents }
          trigger: []
          assert:
            - "snap_a_base == 13000000 and snap_a_indirect == 7020000 and snap_a_direct == 18500000 and snap_a_request == 25520000"
            - "snap_b_base == 18500000 and snap_b_indirect == 9990000 and snap_b_request == 28490000"
            - "snap_a_indirect != snap_b_indirect (identical line amounts, different variant)"

      - name: subrecipient_risk_standard_vs_enhanced
        grounds:
          - calculations.subrecipient_risk_score
          - entities.SubrecipientOrg.fields.risk_score
          - entities.SubrecipientCommitment.fields.verified_risk_snapshot_score
        distinguishing_aspect: |
          Same org data (NOT_REQUIRED + 4 findings = standard score 40, MEDIUM):
          verify with subaward_amount_cents 30000000 (>= 25000000) applies the
          enhanced variant (55, HIGH), so the org read shows 40/MEDIUM while the
          commitment pins 55/ENHANCED — the dual variant lives on the
          SubrecipientOrg risk domain, a different entity domain than
          indirect_cost_mtdc_vs_tdc's Proposal budget domain.
        test_recipe:
          setup:
            - "Opportunity, eligible PI, 54% PROVISIONAL rate as in baseline"
            - "Org D: single_audit_status NOT_REQUIRED, audit_finding_count 4, not foreign, not first-time -> standard score 40 (MEDIUM)"
            - "Proposal P (DRAFT) with a commitment of 30000000 cents on org D, docs received, enhanced_monitoring_acknowledged true"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P One", department_code: "BIO", rank: "ASSOCIATE", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Org D", uei: "UEI-DDD4", single_audit_status: "NOT_REQUIRED", audit_finding_count: 4, is_foreign: false, first_time_subrecipient: false }
              as: SubrecipientManager
              captures: { org_id: $.data.id, org_score: $.data.risk_score, org_tier: $.data.risk_tier }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "P", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 30000000, statement_of_work_received: true, budget_received: true, enhanced_monitoring_acknowledged: true }
              as: PreAwardAnalyst
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /pre-award/subrecipient-commitments/${comm_id}/verify"
              payload: {}
              as: SubrecipientManager
              captures: { snap_score: $.data.verified_risk_snapshot_score, mon_level: $.data.monitoring_level }
          assert:
            - "org_score == 40 and org_tier == MEDIUM (standard variant on SubrecipientOrg)"
            - "snap_score == 55 and mon_level == ENHANCED (enhanced variant at verify: 40 + 15 surcharge, tiered HIGH)"
            - "org_score != snap_score — same org attributes, two valid algorithm variants"

      - name: provisional_vs_final_rate_at_handoff
        grounds:
          - calculations.indirect_cost
          - state_machines.AwardHandoff.DRAFT_to_READY
          - entities.AwardHandoff.fields.final_indirect_cents
        distinguishing_aspect: |
          Same budget, two rate-selection bases: at finalize only a PROVISIONAL
          54.00% agreement exists (snapshot indirect 5400000, rate_source
          PROVISIONAL_RATE); after a FINAL 56.50% agreement is published, the
          mark-ready FINAL_BASIS recomputation yields final_indirect_cents
          5650000 — provisional-vs-final divergence on identical line data.
        test_recipe:
          setup:
            - "Opportunity without caps/cost-share; eligible PI; PROVISIONAL rate 54.00% [2026-01-01, 2029-01-01)"
            - "Proposal P (TDC, start 2026-09-01) with one PERSONNEL line 10000000; finalized -> BUDGET_LOCKED; routed; institutionally approved (snapshot pinned); submitted"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P One", department_code: "BIO", rank: "ASSOCIATE", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "P", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_id}/budget-finalizations"
              payload: { expected_proposal_version: "${pv1}" }
              as: PreAwardAnalyst
              captures: { snap_indirect: $.data.total_indirect_cents, snap_source: $.data.rate_source, snap_rate: $.data.applied_rate_pct }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "sub-pvf-1" }, as: OSPDirector }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_id}/negotiation-offers"
              payload: { expected_proposal_version: "${pv2}", origin: "SPONSOR", offered_total_cents: 15000000 }
              as: OSPDirector
              captures: { offer_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 56.50, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01", initial_status: "FINAL" }, as: OSPDirector }
            - { call: "POST /pre-award/negotiation-offers/${offer_id}/accept", payload: {}, as: OSPDirector }
            - { call: "GET /pre-award/proposals/${prop_id}/award-handoffs", payload: {}, as: OSPDirector, captures: { handoff_id: "$.data[0].id" } }
          trigger:
            - call: "POST /pre-award/award-handoffs/${handoff_id}/mark-ready"
              payload: {}
              as: OSPDirector
              captures: { final_indirect: $.data.final_indirect_cents, final_total: $.data.final_total_cents, h_status: $.data.status }
          assert:
            - "snap_indirect == 5400000 and snap_source == PROVISIONAL_RATE and snap_rate == 54.0"
            - "h_status == READY and final_indirect == 5650000 and final_total == 15650000"
            - "final_indirect != snap_indirect — FINAL_BASIS (56.50%) diverges from PROVISIONAL_BASIS (54.00%) on identical budget lines"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: indirect_cost_per_line_rounding
        grounds:
          - calculations.indirect_cost
          - entities.BudgetSnapshot.fields.per_line_indirect
        distinguishing_aspect: |
          Mode (b) nested rounding: two 1-cent TDC lines at 50.00% — the pinned
          round-per-line-then-sum order yields total_indirect_cents 2
          (round_half_up(0.5)=1 per line); the sum-then-round order would yield 1.
        test_recipe:
          setup:
            - "Opportunity allowing OTHER_SPONSORED without caps; eligible PI; PROVISIONAL rate 50.00% OTHER_SPONSORED [2026-01-01, 2029-01-01)"
            - "Proposal (TDC, activity OTHER_SPONSORED, start 2026-09-01) with two OTHER_DIRECT lines of 1 cent each"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "DOE", title: "OR", activity_codes_allowed: ["OTHER_SPONSORED"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Two", department_code: "PHY", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "OTHER_SPONSORED", rate_pct: 50.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "R", activity_code: "OTHER_SPONSORED", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "OTHER_DIRECT", description: "a", fiscal_year: 2027, amount_cents: 1, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "OTHER_DIRECT", description: "b", fiscal_year: 2027, amount_cents: 1, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
          trigger:
            - call: "POST /pre-award/proposals/${prop_id}/budget-finalizations"
              payload: { expected_proposal_version: "${pv}" }
              as: PreAwardAnalyst
              captures: { s_indirect: $.data.total_indirect_cents, s_direct: $.data.total_direct_cents, s_request: $.data.total_request_cents }
          assert:
            - "s_direct == 2"
            - "s_indirect == 2 (per-line round_half_up(0.5)=1 twice; sum-then-round would give 1)"
            - "s_request == 4"

      - name: cost_share_requirement_evaluation_order
        grounds:
          - calculations.cost_share_requirement
          - entities.Proposal.fields.total_effective_cost_share_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: the
          third-party cap is keyed on required_min (itself derived from budget
          totals). required = 25% x 15400000 = 3850000; third-party pledge of
          5000000 credits only min(2500000, 25% x 3850000 = 962500) = 962500, so
          cash 2000000 + 962500 = 2962500 < 3850000 fails routing until a further
          1000000 cash commitment is approved.
        test_recipe:
          setup:
            - "Opportunity requires_cost_share true, min_cost_share_pct_of_request 25.00; eligible PI; PROVISIONAL 54% rate"
            - "Proposal (TDC) with one PERSONNEL line 10000000 -> total_request 15400000; commitments: DEPARTMENT 2000000 APPROVED, THIRD_PARTY_IN_KIND 5000000 APPROVED"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "CS", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: true, min_cost_share_pct_of_request: 25.00 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Three", department_code: "CHEM", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "CS", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "DEPARTMENT", amount_cents: 2000000 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs1: $.data.id }
            - { call: "POST /pre-award/cost-share-commitments/${cs1}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "THIRD_PARTY_IN_KIND", amount_cents: 5000000 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs2: $.data.id }
            - { call: "POST /pre-award/cost-share-commitments/${cs2}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { eff_before: $.data.total_effective_cost_share_cents } }
          trigger:
            - call: "POST /pre-award/proposals/${prop_id}/route"
              payload: {}
              as: PreAwardAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "COLLEGE", amount_cents: 1000000 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs3: $.data.id }
            - { call: "POST /pre-award/cost-share-commitments/${cs3}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - call: "POST /pre-award/proposals/${prop_id}/route"
              payload: {}
              as: PreAwardAnalyst
              captures: { final_status: $.data.status }
          assert:
            - "eff_before == 2962500 (cash 2000000 + min(2500000, 962500) third-party credit)"
            - "err1 == ERR_COST_SHARE_INADEQUATE (2962500 < required 3850000)"
            - "final_status == ROUTED after COLLEGE 1000000 approval lifts effective to 3962500 >= 3850000"

      - name: subrecipient_risk_tiered_scoring
        grounds:
          - calculations.subrecipient_risk_score
          - entities.SubrecipientOrg.fields.risk_tier
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: base-by-status branch,
          nested min on findings (min(5*n, 25) caps at 5 findings), plus
          conditional foreign/first-time penalties — DELINQUENT(60) +
          min(25,25) + foreign(10) = 95 -> HIGH, while the same org with 4
          findings would be 60 + 20 + 10 = 90 -> HIGH but 60 + 20 + 0 = 80 stays
          HIGH and NOT_REQUIRED(20) + 4 findings(20) = 40 is MEDIUM.
        test_recipe:
          setup: ["No proposals needed; org registry only"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Risky Foreign", uei: "UEI-RF95", single_audit_status: "DELINQUENT", audit_finding_count: 9, is_foreign: true, first_time_subrecipient: false }
              as: SubrecipientManager
              captures: { score_a: $.data.risk_score, tier_a: $.data.risk_tier }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Borderline", uei: "UEI-B040", single_audit_status: "NOT_REQUIRED", audit_finding_count: 4, is_foreign: false, first_time_subrecipient: false }
              as: SubrecipientManager
              captures: { score_b: $.data.risk_score, tier_b: $.data.risk_tier }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Edge Low", uei: "UEI-E024", single_audit_status: "CURRENT", audit_finding_count: 2, is_foreign: false, first_time_subrecipient: false }
              as: SubrecipientManager
              captures: { score_c: $.data.risk_score, tier_c: $.data.risk_tier }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Edge Medium", uei: "UEI-E025", single_audit_status: "CURRENT", audit_finding_count: 3, is_foreign: false, first_time_subrecipient: false }
              as: SubrecipientManager
              captures: { score_d: $.data.risk_score, tier_d: $.data.risk_tier }
          trigger: []
          assert:
            - "score_a == 95 and tier_a == HIGH (60 + min(45,25)=25 findings cap + 10 foreign)"
            - "score_b == 40 and tier_b == MEDIUM (20 + 20)"
            - "score_c == 20 and tier_c == LOW (10 + 10; boundary 24 max LOW)"
            - "score_d == 25 and tier_d == MEDIUM (10 + 15; boundary 25 enters MEDIUM)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: compliance_review_info_request_cycle
        grounds:
          - state_machines.ComplianceReview.PENDING_to_INFO_REQUESTED
          - state_machines.ComplianceReview.INFO_REQUESTED_to_PENDING
          - state_machines.ComplianceReview.PENDING_to_APPROVED
        distinguishing_aspect: |
          ComplianceReview cycles PENDING -> INFO_REQUESTED -> PENDING twice
          before approval (a revision loop, not a pipeline); approval stamps
          approved_until_at = clock + 365 days (IRB default) = 2027-08-01T00:00:00Z.
        test_recipe:
          setup:
            - "Opportunity, eligible PI, 54% rate; proposal in DRAFT (reviews need no budget)"
            - "IRB review created (PENDING)"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NIH", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Four", department_code: "MED", rank: "ASSISTANT", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Cyc", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/compliance-reviews"
              payload: { review_type: "IRB" }
              as: ComplianceOfficer
              captures: { rev_id: $.data.id }
          trigger:
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/request-info", payload: { question: "consent form?" }, as: ComplianceOfficer, captures: { st1: $.data.status } }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/respond", payload: { response_note: "attached" }, as: PI, as_user_id: "${pi_id}", captures: { st2: $.data.status } }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/request-info", payload: { question: "recruitment?" }, as: ComplianceOfficer, captures: { st3: $.data.status } }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/respond", payload: { response_note: "attached v2" }, as: PI, as_user_id: "${pi_id}", captures: { st4: $.data.status } }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/approve", payload: {}, as: ComplianceOfficer, captures: { st5: $.data.status, until: $.data.approved_until_at, vdays: $.data.validity_days } }
          assert:
            - "st1 == INFO_REQUESTED and st2 == PENDING and st3 == INFO_REQUESTED and st4 == PENDING (cycle traversed twice)"
            - "st5 == APPROVED and vdays == 365 and until == 2027-08-01T00:00:00Z"

      - name: proposal_revision_loop
        grounds:
          - state_machines.Proposal.ROUTED_to_RETURNED_FOR_REVISION
          - state_machines.Proposal.RETURNED_FOR_REVISION_to_DRAFT
          - entities.Proposal.fields.revision_count
        distinguishing_aspect: |
          Proposal loops ROUTED -> RETURNED_FOR_REVISION -> DRAFT ->
          BUDGET_LOCKED -> ROUTED (a revision cycle on Proposal, a different
          entity than ComplianceReview); revision_count pins the loop traversal.
        test_recipe:
          setup:
            - "Opportunity (no cost-share), eligible PI, 54% rate; proposal with one PERSONNEL line 10000000, finalized and routed"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Five", department_code: "ENG", rank: "ASSOCIATE", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Loop", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/return-for-revision", payload: { reason: "budget justification incomplete" }, as: OSPDirector, captures: { st1: $.data.status, rc1: $.data.revision_count } }
            - { call: "PATCH /pre-award/proposals/${prop_id}", payload: { title: "Loop v2" }, as: PI, as_user_id: "${pi_id}", captures: { st2: $.data.status } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv2}" }, as: PreAwardAnalyst, captures: { st3: $.data.status } }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1", captures: { st4: $.data.status } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { rc_final: $.data.revision_count } }
          assert:
            - "st1 == RETURNED_FOR_REVISION and rc1 == 1"
            - "st2 == DRAFT (PATCH resumes drafting)"
            - "st3 == CURRENT snapshot response; proposal re-finalized"
            - "st4 == ROUTED and rc_final == 1 (loop completed; count stable)"
            - "finalize trigger output is a BudgetSnapshot with status CURRENT"

      - name: negotiation_round_supersede_cycle
        grounds:
          - state_machines.NegotiationOffer.PROPOSED_to_VOIDED
          - state_machines.Proposal.NEGOTIATING_to_NEGOTIATING
          - entities.NegotiationOffer.fields.round_index
        distinguishing_aspect: |
          NegotiationOffer runs a cyclic supersede loop (round 1 PROPOSED is
          VOIDED by round 2, round 2 by round 3) while the proposal stays
          NEGOTIATING — a cycle on NegotiationOffer, distinct from the Proposal
          and ComplianceReview loops.
        test_recipe:
          setup:
            - "Opportunity, eligible PI, 54% rate; proposal carried to SUBMITTED (finalize, route, approve, submit)"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Six", department_code: "ENG", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Neg", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "sub-neg-1" }, as: OSPDirector }
          trigger:
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/negotiation-offers", payload: { expected_proposal_version: "${pv2}", origin: "SPONSOR", offered_total_cents: 14000000 }, as: OSPDirector, captures: { o1: $.data.id, r1: $.data.round_index } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv3: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/negotiation-offers", payload: { expected_proposal_version: "${pv3}", origin: "INSTITUTION", offered_total_cents: 14800000 }, as: OSPDirector, captures: { o2: $.data.id, r2: $.data.round_index } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv4: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/negotiation-offers", payload: { expected_proposal_version: "${pv4}", origin: "SPONSOR", offered_total_cents: 14600000 }, as: OSPDirector, captures: { o3: $.data.id, r3: $.data.round_index } }
            - { call: "GET /pre-award/proposals/${prop_id}/negotiation-offers", payload: {}, as: OSPDirector, captures: { s1: "$.data[0].status", s2: "$.data[1].status", s3: "$.data[2].status" } }
          assert:
            - "r1 == 1 and r2 == 2 and r3 == 3"
            - "s1 == VOIDED and s2 == VOIDED and s3 == PROPOSED (each round supersedes the open offer; proposal stayed NEGOTIATING)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disapprove_cascade_releases_cost_share
        grounds:
          - state_machines.ComplianceReview.PENDING_to_DISAPPROVED
          - state_machines.Proposal.ROUTED_to_RETURNED_FOR_REVISION
          - state_machines.CostShareCommitment.APPROVED_to_RELEASED
          - state_machines.SubrecipientCommitment.VERIFIED_to_STALE
        distinguishing_aspect: |
          Depth-3 chain from the disapprove trigger: review DISAPPROVED forces
          proposal -> RETURNED_FOR_REVISION (link 1); that status change releases
          APPROVED cost-share and stales VERIFIED sub commitments (link 2); the
          releases force recomputation of total_approved_cost_share_cents and
          is_cost_share_adequate on the proposal (link 3).
        test_recipe:
          setup:
            - "Opportunity without cost-share requirement; eligible PI; 54% rate; LOW-risk org"
            - "Proposal ROUTED: one PERSONNEL line 10000000, finalized, routed by analyst-1"
            - "Cost-share commitment 1000000 (DEPARTMENT) APPROVED by chair-1; sub commitment VERIFIED; IRB review PENDING"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NIH", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Seven", department_code: "MED", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Calm Sub", uei: "UEI-CALM", single_audit_status: "CURRENT", audit_finding_count: 0 }
              as: SubrecipientManager
              captures: { org_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Casc", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 1000000, statement_of_work_received: true, budget_received: true }
              as: PreAwardAnalyst
              captures: { comm_id: $.data.id }
            - { call: "POST /pre-award/subrecipient-commitments/${comm_id}/verify", payload: {}, as: SubrecipientManager }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "DEPARTMENT", amount_cents: 1000000 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs_id: $.data.id }
            - { call: "POST /pre-award/cost-share-commitments/${cs_id}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - call: "POST /pre-award/proposals/${prop_id}/compliance-reviews"
              payload: { review_type: "IRB" }
              as: ComplianceOfficer
              captures: { rev_id: $.data.id }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { approved_before: $.data.total_approved_cost_share_cents } }
          trigger:
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/disapprove", payload: { reason: "protocol risk" }, as: ComplianceOfficer }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { p_status: $.data.status, p_rev: $.data.revision_count, p_approved: $.data.total_approved_cost_share_cents, p_adequate: $.data.is_cost_share_adequate, p_posture: $.data.compliance_posture } }
            - { call: "GET /pre-award/proposals/${prop_id}/cost-share-commitments", payload: {}, as: OSPDirector, captures: { cs_status: "$.data[0].status" } }
            - { call: "GET /pre-award/proposals/${prop_id}/subrecipient-commitments", payload: {}, as: OSPDirector, captures: { sub_status: "$.data[0].status" } }
          assert:
            - "approved_before == 1000000"
            - "p_status == RETURNED_FOR_REVISION and p_rev == 1 and p_posture == BLOCKED (link 1)"
            - "cs_status == RELEASED and sub_status == STALE (link 2, caused by the proposal's return)"
            - "p_approved == 0 and p_adequate == false (link 3, recomputation caused by the releases)"

      - name: award_accept_cascade_creates_handoff
        grounds:
          - state_machines.Proposal.NEGOTIATING_to_AWARDED
          - state_machines.NegotiationOffer.PROPOSED_to_ACCEPTED
          - entities.AwardHandoff.fields.status
        distinguishing_aspect: |
          Depth-2 chain from the accept trigger (different trigger than
          disapprove_cascade_releases_cost_share): offer accept -> proposal
          AWARDED with awarded_total_cents (link 1); the award auto-creates the
          AwardHandoff in DRAFT with all checklist flags false (link 2).
        test_recipe:
          setup:
            - "Opportunity, eligible PI, 54% rate; proposal carried to SUBMITTED; open SPONSOR offer 14000000"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Eight", department_code: "ENG", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Aw", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
