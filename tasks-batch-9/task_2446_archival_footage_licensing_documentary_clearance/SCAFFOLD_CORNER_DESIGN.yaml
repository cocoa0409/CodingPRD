              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Harbour pan", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
