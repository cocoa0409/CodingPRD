  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_sale_blocked_by_active_litigation_stay
        grounds:
          - validations[priority=19]
          - state_machines.StayOrder.ACTIVE_to_RELEASED
          - entities.ForeclosureCase.fields.hold_status
