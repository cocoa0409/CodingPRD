      - name: offer_acceptance_links_the_seat_to_both_the_offer_and_the_vacancy
        claim_type: Cross-reference link
        grounds:
          - state_machines.Vacancy.OFFERING_to_FILLED
          - endpoints["POST /fire-ops/overtime-offers/{overtime_offer_id}/response"]
          - endpoints["GET /fire-ops/shift-assignments"]
        distinguishing_aspect: "Acceptance creates a seat that carries source_offer_id back to the offer while the vacancy carries filled_by_assignment_id forward to the seat, and both directions are queryable — GET /fire-ops/shift-assignments?source_offer_id=<offer> resolves the same row."
        test_recipe:
          setup:
            - "Station 120 with floor 1, a 900,000-cent budget, one company ENGINE-120 (crew 1, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Member ff120 (platoon D, Kelly 1, rate 4000) is the only candidate; the 2026-08-11 shift (platoon C) is published with one OPEN vacancy, and a VOLUNTARY 24-hour offer has been dispatched to him."
          setup_api_calls:
