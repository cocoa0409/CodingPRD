          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED with market_codes [US, CA] and language_codes [en, fr]; Brief SKU-2002 APPROVED with market_codes [DE] and language_codes [de]."
