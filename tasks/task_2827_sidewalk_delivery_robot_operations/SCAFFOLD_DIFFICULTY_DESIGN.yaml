          POST /route-plans: with the narrowest segment of [S1, S2, S3, S5] at 92.0 cm and
          CLEARANCE_BUFFER_CM 12, an 80.0 cm robot lands on clearance_margin_cm exactly 0.0 and is
          accepted because the gate is >= 0, while an 81.0 cm robot lands on -1.0 and is rejected.
