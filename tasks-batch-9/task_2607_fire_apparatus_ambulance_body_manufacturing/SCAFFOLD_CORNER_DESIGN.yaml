              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { e_empty: $.data.error_id }
            - call: "POST /specifications/${spec1_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /specifications/${spec1_id}/clauses"
              payload: { clause_code: "C1", category: "AERIAL", requirement_text: "Duplicate code, different content", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { e_dup: $.data.error_id }
            - call: "POST /specifications/${spec2_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1b_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec1_id}", clause_id: "${c1_id}", response: "COMPLY" }
