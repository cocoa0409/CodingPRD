# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Window Cleaning & Pressure Washing — Expert tier
# Breadth probe across claim-extraction-guide sections; §1.8 covers depth.
# Same 7-point per-instance contract + §1.5 priority ladder as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_derived_zero_balances
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with all required fields -> 201; balance_cents=0, deposit_held_cents=0, status=ACTIVE, version=1 on the response."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "c1@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id, bal: $.data.balance_cents, held: $.data.deposit_held_cents, st: $.data.status, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Account.${acct}.balance_cents == 0"
            - "Account.${acct}.deposit_held_cents == 0"
            - "Account.${acct}.status == ACTIVE"
            - "Account.${acct}.version == 1"

      - name: create_quote_missing_pricing_basis_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Quote.fields.pricing_basis, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pricing_basis is a required input with no default; omitting it -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One account, one property."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "c2@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "P", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: create_property_invalid_region_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Account.fields.region_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "region_code restricted to {NORTH,SOUTH,EAST,WEST}; value MIDWEST -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "c3@x.com", region_code: "MIDWEST" }
              as: Billing
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a well-formed but non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Billing
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: property_soft_wash_sqft_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Property.fields.soft_wash_sqft]
        distinguishing_aspect: "Omitting soft_wash_sqft on POST /properties -> stored value 0 (declared default)."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "c4@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "P", pane_count: 60, glass_sqft: 100.0, stories: 2 }
              as: Billing
              captures: { prop: $.data.id, sw: $.data.soft_wash_sqft }
          assert:
            - "Property.${prop}.soft_wash_sqft == 0"

      - name: visit_photo_immutable_entity_has_no_version_field
        claim_type: Immutability
        grounds: [entities.VisitPhoto]
        distinguishing_aspect: "VisitPhoto is common_fields:false (append-only); its create response carries id and created_at but no version field."
        test_recipe:
          setup: ["A DISPATCHED visit ready for photo upload."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "c5@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "P", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "ONE_TIME" }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
            - call: "GET /service-agreements/${agr}/visits"
              payload: {}
              as: Billing
              captures: { vis: "$.data[0].id" }
            - call: "POST /crews"
              payload: { crew_name: "Crew A", region_code: "NORTH", skill_codes: [], daily_capacity_minutes: 600 }
              as: Dispatcher
              captures: { crew: $.data.id }
            - call: "POST /routes"
              payload: { crew_id: "${crew}", region_code: "NORTH", service_date: "2026-07-01" }
              as: Dispatcher
              captures: { rt: $.data.id }
            - call: "GET /routes/${rt}"
              payload: {}
              as: Dispatcher
              captures: { rt_v: $.data.version }
            - call: "POST /routes/${rt}/visits"
              payload: { visit_id: "${vis}", expected_route_version: "${rt_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "BEFORE", image_uri: "s3://b.jpg" }
              as: FieldCrew
              captures: { ph: $.data.id, phase: $.data.phase }
          assert:
            - "response.status == 201"
            - "VisitPhoto.${ph}.phase == BEFORE"

