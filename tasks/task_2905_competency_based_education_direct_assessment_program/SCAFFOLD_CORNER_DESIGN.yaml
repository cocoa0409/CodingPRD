# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2905 — Competency-Based Education & Direct Assessment Program
#
# Breadth probe: a row-by-row walk of references/claim-extraction-guide.md
# against SCAFFOLD.yaml §1.1-§1.7. `section:` values are the guide's nine
# sections; `claim_type:` values are the rows of each section's table.
# Corners already asserted by a §1.8 instance are emitted as `excluded_because:`
# stubs naming that instance; every other corner carries a full test_recipe
# whose chain is reachable from an empty database through §1.5 alone.
# All instants are ISO-8601 UTC with three fractional digits.
# Recurring base chain (referred to as "the base chain" in `setup:` prose):
#   clock 2026-09-01 -> POST /programs -> POST /competencies -> publish program
#   -> POST /students -> activate -> POST /subscription-terms -> activate
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_create_returns_201_with_system_fields
        claim_type: creation
        grounds:
          - endpoints.POST_programs
          - entities.Program.fields.code
          - entities.Program.fields.status
          - response_envelope.success
        distinguishing_aspect: "POST /programs with only the two required inputs returns 201, the success envelope with response_type object, a server-minted id, created_at/updated_at, version 1, status DRAFT and competency_count 0."
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id, prog_status: $.data.status, prog_version: $.data.version, prog_count: $.data.competency_count }
          assert:
            - "the response status code is 201"
            - "the envelope carries meta.api_request_id and response_type object"
            - "${prog_status} == DRAFT"
            - "${prog_version} == 1"
            - "${prog_count} == 0"
            - "Program.${prog_id}.code == CBE-BSIT"
            - "Program.${prog_id}.title == BS Information Technology"
            - "Program.${prog_id}.published_at_utc == null"

      - name: program_create_omitted_policy_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Program.fields.mastery_threshold_pct
          - entities.Program.fields.units_per_credit_hour
          - entities.Program.fields.attempt_cooloff_hours
          - entities.Program.fields.aid_earned_pct_full_threshold
        distinguishing_aspect: "All fourteen optional policy inputs are omitted, so every one must materialise at its §1.1 default (80.00, 3.0, 12, 120, 5.00, 3, 70.00, 48, 3, 0.70, 7, 14, 0.6000, 1) rather than null."
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs"
              payload: { code: "CBE-DEF", title: "Defaults Program" }
              as: Registrar
              captures: { prog_id: $.data.id }
          assert:
            - "Program.${prog_id}.mastery_threshold_pct == 80.00"
            - "Program.${prog_id}.units_per_credit_hour == 3.0"
            - "Program.${prog_id}.sap_min_units_per_term == 12"
            - "Program.${prog_id}.required_unit_total == 120"
            - "Program.${prog_id}.irr_tolerance_pct == 5.00"
            - "Program.${prog_id}.irr_min_paired_reviews == 3"
            - "Program.${prog_id}.irr_suspend_rate_pct == 70.00"
            - "Program.${prog_id}.attempt_cooloff_hours == 48"
            - "Program.${prog_id}.attempts_before_endorsement == 3"
            - "Program.${prog_id}.critical_dimension_min_ratio == 0.70"
            - "Program.${prog_id}.cadence_gate_overdue_days == 7"
            - "Program.${prog_id}.blueprint_notice_days == 14"
            - "Program.${prog_id}.aid_earned_pct_full_threshold == 0.6000"
            - "Program.${prog_id}.aid_min_credit_equivalency == 1"

      - name: competency_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_competencies_id
          - entities.Competency.fields.unit_value
          - entities.Competency.fields.effective_mastery_threshold_pct
        distinguishing_aspect: "GET /competencies/{id} returns exactly what POST stored, including the inherited effective_mastery_threshold_pct 80.00 taken from the program because the competency supplied no override, and effective_blueprint_id null while no blueprint exists."
        test_recipe:
          setup:
            - "a DRAFT program CBE-BSIT with default policy values and one competency IT-101 worth 4 units and no blueprint yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /competencies/${c1_id}"
              payload: {}
              as: Registrar
              captures: { got_code: $.data.code, got_units: $.data.unit_value, got_level: $.data.level, got_status: $.data.status, got_thr: $.data.effective_mastery_threshold_pct, got_bp: $.data.effective_blueprint_id, got_version: $.data.version }
          assert:
            - "the response status code is 200"
            - "${got_code} == IT-101"
            - "${got_units} == 4"
            - "${got_level} == FOUNDATION"
            - "${got_status} == ACTIVE"
            - "${got_thr} == 80.00"
            - "${got_bp} == null"
            - "${got_version} == 1"

      - name: competencies_list_filtered_by_program_and_status
        claim_type: listing
        grounds:
          - endpoints.GET_competencies
          - response_envelope.pagination_fields
          - state_machines.Competency.ACTIVE_to_RETIRED
        distinguishing_aspect: "Three competencies exist, one of them RETIRED; the filtered list status=ACTIVE returns exactly the two ACTIVE rows in created_at ASC order with total_count 2 and has_more false, while limit=1 returns one row with has_more true."
        test_recipe:
          setup:
            - "a DRAFT program with competencies L-1, L-2 and L-3, and L-3 retired again before any attempt exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-LIST", title: "Listing Program" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "L-1", title: "List One", unit_value: 2, level: "FOUNDATION" }
              as: Registrar
              captures: { l1_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "L-2", title: "List Two", unit_value: 2, level: "CORE" }
              as: Registrar
              captures: { l2_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "L-3", title: "List Three", unit_value: 2, level: "CAPSTONE" }
              as: Registrar
              captures: { l3_id: $.data.id }
            - call: "POST /competencies/${l3_id}/retire"
              payload: {}
              as: Registrar
          trigger:
            - call: "GET /competencies"
              payload: { program_id: "${prog_id}", status: "ACTIVE" }
              as: Registrar
            - call: "GET /competencies"
              payload: { program_id: "${prog_id}", status: "ACTIVE", limit: 1, offset: 0 }
              as: Registrar
          assert:
            - "the unfiltered-by-limit call returned exactly 2 rows, total_count 2 and has_more false"
            - "the two rows are L-1 then L-2, ordered by created_at ASC"
            - "the retired competency L-3 is absent from both responses"
            - "the limit=1 call returned exactly 1 row (L-1), total_count 2 and has_more true"
            - "response_type is array on both calls"

      - name: student_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STUDENT_NOT_FOUND]
          - endpoints.GET_students_id
          - validations.priority_4_path_404_family
        distinguishing_aspect: "A syntactically valid but unknown path id yields ERR_STUDENT_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { nf_error: $.data.error_id }
          assert:
            - "${nf_error} == ERR_STUDENT_NOT_FOUND"
            - "the response status code is 404"
            - "response_type is error and data.message is a non-empty string"

      - name: student_create_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_students
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "email is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST and no Student row is created — it is not defaulted to null."
        test_recipe:
          setup:
            - "a PUBLISHED program with one ACTIVE competency (so enrolment is otherwise legal)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner" }
              as: Registrar
              captures: { req_error: $.data.error_id }
          assert:
            - "${req_error} == ERR_INVALID_REQUEST"
            - "the response status code is 400"
            - "GET /students filtered by that program returns 0 rows"

      - name: term_create_computed_fields_start_null_and_zero
        claim_type: computed_fields
        grounds:
          - entities.SubscriptionTerm.fields.units_mastered_in_term
          - entities.SubscriptionTerm.fields.credit_equivalency_earned
          - entities.SubscriptionTerm.fields.attended_days
          - entities.SubscriptionTerm.fields.earned_pct
        distinguishing_aspect: "On creation the four computed close-out fields are not derivable yet: units_mastered_in_term 0 and credit_equivalency_earned 0, while attended_days, earned_pct, institutional_refund_cents and net_institutional_charge_cents are null until the term closes — a zero in place of a null would falsely claim the term was closed with nothing attended."
        test_recipe:
          setup:
            - "the base chain up to and including student activation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id, t_units: $.data.units_mastered_in_term, t_credits: $.data.credit_equivalency_earned, t_attended: $.data.attended_days, t_earned: $.data.earned_pct, t_refund: $.data.institutional_refund_cents, t_net: $.data.net_institutional_charge_cents, t_status: $.data.status }
          assert:
            - "the response status code is 201"
            - "${t_status} == PENDING"
            - "${t_units} == 0"
            - "${t_credits} == 0"
            - "${t_attended} == null"
            - "${t_earned} == null"
            - "${t_refund} == null"
            - "${t_net} == null"
            - "SubscriptionTerm.${term_id}.tuition_cents == 375000"

      - name: evaluator_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Evaluator.fields.status
          - entities.Evaluator.fields.submitted_score_count
          - entities.Evaluator.fields.irr_agreement_rate_pct
          - endpoints.POST_evaluators
        distinguishing_aspect: "The client supplies only full_name, email and certification_level; status CERTIFIED, submitted_score_count 0, paired_review_count 0, agreeing_review_count 0, irr_agreement_rate_pct 100.00 (the empty-denominator convention), demoted_at_utc null, id, created_at, updated_at and version 1 are all server-minted."
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev_id: $.data.id, ev_status: $.data.status, ev_scores: $.data.submitted_score_count, ev_paired: $.data.paired_review_count, ev_rate: $.data.irr_agreement_rate_pct, ev_version: $.data.version }
          assert:
            - "the response status code is 201"
            - "${ev_status} == CERTIFIED"
            - "${ev_scores} == 0"
            - "${ev_paired} == 0"
            - "${ev_rate} == 100.00"
            - "${ev_version} == 1"
            - "Evaluator.${ev_id}.demoted_at_utc == null"
            - "Evaluator.${ev_id}.mentor_id == null"

      - name: competency_invalid_level_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Competency.fields.level
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "level is constrained to FOUNDATION | CORE | CAPSTONE, so MASTER is a 400 ERR_INVALID_REQUEST rather than a stored free-text value."
        test_recipe:
          setup:
            - "a DRAFT program CBE-BSIT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-999", title: "Bogus Level", unit_value: 4, level: "MASTER" }
              as: Registrar
              captures: { enum_error: $.data.error_id }
          assert:
            - "${enum_error} == ERR_INVALID_REQUEST"
            - "the response status code is 400"
            - "GET /competencies filtered by that program returns 0 rows"

      - name: term_window_end_not_after_start_rejected
        claim_type: type_constraints
        grounds:
          - entities.SubscriptionTerm.fields.term_end_utc
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_subscription_terms
        distinguishing_aspect: "term_end_utc must be strictly after term_start_utc, so an equal pair (a zero-length window, which would make term_days 0 and divide by zero in calculations.term_close_aid_return) is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "the base chain up to and including student activation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-09-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { win_error: $.data.error_id }
          assert:
            - "${win_error} == ERR_INVALID_REQUEST"
            - "the response status code is 400"
            - "GET /subscription-terms filtered by that student returns 0 rows"

      - name: sap_review_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.SapReview.common_fields
          - endpoints.GET_sap_reviews_id
          - calculations.sap_pace_and_outcome
        distinguishing_aspect: "SapReview is declared common_fields false: the row is an immutable audit record, so §1.5 exposes create/read/list only, the read carries no version field, and a second review of the same student writes a NEW row rather than mutating the first (previous_sap_status GOOD_STANDING then WARNING)."
        test_recipe:
          setup:
            - "the base chain with sap_min_units_per_term 12 and an ACTIVE term, nothing mastered"
            - "one SapReview already recorded, so the student sits at pace 0.00 and sap_status DISMISSED is NOT yet reached (the first review lands WARNING only if pace is in band; here pace 0.00 is FAIL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /sap-reviews"
              payload: { student_id: "${stu_id}", term_id: "${term_id}" }
              as: Registrar
              captures: { rev_id: $.data.id, rev_pace: $.data.pace_pct, rev_band: $.data.pace_band, rev_new: $.data.new_sap_status }
            - call: "GET /sap-reviews/${rev_id}"
              payload: {}
              as: Registrar
              captures: { got_pace: $.data.pace_pct, got_new: $.data.new_sap_status }
          assert:
            - "${rev_pace} == 0.00"
            - "${rev_band} == FAIL"
            - "${rev_new} == DISMISSED"
            - "${got_pace} == 0.00"
            - "${got_new} == DISMISSED"
            - "the SapReview payload carries no version field and §1.5 declares no update or delete endpoint for /sap-reviews"
            - "a second POST /sap-reviews for the same student now returns ERR_SAP_ALREADY_DISMISSED (409) instead of editing the stored row"

      - name: subscription_term_requires_existing_student_fk
        claim_type: parent_relationships
        grounds:
          - entities.SubscriptionTerm.fields.student_id
          - errors[ERR_STUDENT_NOT_FOUND]
          - validations.priority_5_body_FK_404_family
        distinguishing_aspect: "student_id is a body FK; an unknown value is rejected 404 ERR_STUDENT_NOT_FOUND before any window-overlap or state check runs, so no orphan term can exist."
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscription-terms"
              payload: { student_id: "00000000-0000-4000-8000-000000000000", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { fk_error: $.data.error_id }
          assert:
            - "${fk_error} == ERR_STUDENT_NOT_FOUND"
            - "the response status code is 404"
            - "GET /subscription-terms returns 0 rows"

      - name: blueprint_rejects_unknown_competency_reference
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.AssessmentBlueprint.fields.competency_id
          - errors[ERR_COMPETENCY_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so cross-reference integrity is enforced by FK validation rather than by URL nesting: POST /assessment-blueprints with an unknown competency_id is 404 ERR_COMPETENCY_NOT_FOUND, checked ahead of the rubric-weight and OCC rules."
        test_recipe:
          setup:
            - "one real DRAFT program with one real competency IT-101 read at version 1, logical clock 2026-09-01T00:00:00.000Z; the blueprint request quotes IT-101's genuine OCC token but a competency id that does not exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
