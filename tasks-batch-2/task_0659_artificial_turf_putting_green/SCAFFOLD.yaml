# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Project: workflow_status dimension (PARALLEL dim #1) -----------------
  - entity: Project
    field: workflow_status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Pipeline dimension; evolves independently from finance_status (parallel dimensions on one entity)."
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /site-measures (first RECORDED measure)"
        actor: SalesRep
        preconditions:
          - "Project.workflow_status == DRAFT"
        side_effects:
          - "SiteMeasure created with status=RECORDED"
          - "increments Project.version by 1"

      - from: MEASURED
        to: DESIGNED
        trigger: "POST /design-layouts/{id}/accept"
        actor: SalesRep
        preconditions:
          - "Project.workflow_status == MEASURED"
          - "DesignLayout.status == DRAFT"
          - "No other DesignLayout on this project is ACCEPTED"
        side_effects:
          - "DesignLayout.status -> ACCEPTED"
          - "Project.variant := DesignLayout.variant (cross-entity copy)"
          - "Project.billable_area_sqft recomputed from accepted design net_area_sqft"
          - "increments Project.version by 1"

      - from: DESIGNED
        to: QUOTED
        trigger: "POST /quotes/{id}/send"
        actor: SalesRep
        preconditions:
          - "Project.workflow_status == DESIGNED"
          - "Quote.status == DRAFT"
          - "Quote.base_prep_scope_id references a FINALIZED BasePrepScope"
        side_effects:
          - "Quote.status -> SENT"
          - "increments Project.version by 1"

      - from: QUOTED
        to: DEPOSIT_PAID
        trigger: "system (deposit Payment settles; see Payment.PENDING_to_SETTLED)"
        actor: system
        preconditions:
          - "Project.workflow_status == QUOTED"
          - "An ACCEPTED Quote exists on the project"
          - "deposit_paid_cents (after this settle) >= ACCEPTED Quote.deposit_amount_cents"
        side_effects:
          - "Project.contract_total_cents := ACCEPTED Quote.total_cents (cross-entity copy)"
          - "increments Project.version by 1"

      - from: DEPOSIT_PAID
        to: SCHEDULED
        trigger: "POST /install-jobs"
        actor: Scheduler
        preconditions:
          - "Project.workflow_status == DEPOSIT_PAID"
          - "Assigned Crew is certified for Project.variant (PUTTING_GREEN->certified_putting, PLAYGROUND->certified_playground)"
          - "Crew.daily_capacity_sqft >= Project.billable_area_sqft"
          - "No overlapping InstallJob on the same Crew (half-open interval)"
        side_effects:
          - "InstallJob created with status=SCHEDULED"
          - "InstallJob.install_area_sqft := Project.billable_area_sqft"
          - "increments Project.version by 1"

      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /install-jobs/{id}/complete"
        actor: Scheduler
        preconditions:
          - "Project.workflow_status == SCHEDULED"
          - "InstallJob.status == IN_PROGRESS"
        side_effects:
          - "InstallJob.status -> COMPLETED (cascade hop 1)"
          - "WarrantyPlan (if PENDING) -> ACTIVE; start_at := InstallJob.scheduled_end; expires_at computed (cascade hop 2)"
          - "Project.finance_status -> BALANCE_DUE (ledger dimension nudged)"
          - "increments Project.version by 1"

      - from: INSTALLED
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: OpsAdmin
        preconditions:
          - "Project.workflow_status == INSTALLED"
          - "Project.finance_status == PAID_IN_FULL"
          - "Project.open_callback_count == 0"
        side_effects:
          - "Project.workflow_status -> CLOSED"
          - "increments Project.version by 1"

      - from: [DRAFT, MEASURED, DESIGNED, QUOTED, DEPOSIT_PAID, SCHEDULED]
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: OpsAdmin
        preconditions:
          - "Project.workflow_status NOT IN {INSTALLED, CLOSED, CANCELLED}"
        side_effects:
          - "All SCHEDULED/IN_PROGRESS InstallJob rows -> ABORTED (cascade hop 1; releases crew window)"
          - "All DRAFT/SENT Quote rows -> VOID (cascade)"
          - "PENDING WarrantyPlan -> VOID (cascade)"
          - "If deposit_paid_cents > 0: a REFUND Payment of kind=REFUND amount_cents=deposit_paid_cents is created PENDING (cascade hop 2 -> when SETTLED, hop 3 sets finance_status=REFUNDED)"
          - "increments Project.version by 1"

  # ---- Project: finance_status dimension (PARALLEL dim #2) ------------------
  - entity: Project
    field: finance_status
    initial_state: UNBILLED
    terminal_states: [REFUNDED]
    note: "Ledger dimension; advances on Quote acceptance and Payment settlement, independent of workflow_status."
    transitions:
      - from: UNBILLED
        to: DEPOSIT_DUE
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Project.finance_status == UNBILLED"
          - "Quote.status == SENT"
          - "expected_project_version matches Project.version (OCC)"
        side_effects:
          - "Quote.status -> ACCEPTED"
          - "All other SENT/DRAFT/REVISED Quote rows on project -> VOID (cross-quote cascade)"
          - "Project.finance_status -> DEPOSIT_DUE"
          - "increments Project.version by 1"

      - from: DEPOSIT_DUE
        to: DEPOSIT_SETTLED
        trigger: "system (deposit Payment settles and covers deposit_amount_cents)"
        actor: system
        preconditions:
          - "Project.finance_status == DEPOSIT_DUE"
          - "deposit_paid_cents >= ACCEPTED Quote.deposit_amount_cents"
        side_effects:
          - "Project.finance_status -> DEPOSIT_SETTLED"
          - "increments Project.version by 1"

      - from: BALANCE_DUE
        to: PAID_IN_FULL
        trigger: "system (balance Payment settles)"
        actor: system
        preconditions:
          - "Project.finance_status == BALANCE_DUE"
          - "deposit_paid_cents + balance_paid_cents >= contract_total_cents"
        side_effects:
          - "Project.finance_status -> PAID_IN_FULL"
          - "increments Project.version by 1"

      - from: [DEPOSIT_DUE, DEPOSIT_SETTLED, BALANCE_DUE]
        to: REFUNDED
        trigger: "system (REFUND Payment settles after project cancel)"
        actor: system
        preconditions:
          - "A REFUND Payment for this project has SETTLED"
        side_effects:
          - "Project.finance_status -> REFUNDED"
          - "increments Project.version by 1"

  # ---- DesignLayout: branching accept/reject --------------------------------
  - entity: DesignLayout
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    note: "Branching fork: DRAFT -> {ACCEPTED, REJECTED} with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /design-layouts/{id}/accept"
        actor: SalesRep
        preconditions:
          - "DesignLayout.status == DRAFT"
          - "No other DesignLayout on this project is ACCEPTED"
          - "Selected TurfProduct.active == true and matches variant rating (see §1.4 P50)"
          - "Selected InfillProduct.active == true and matches variant requirement (see §1.4 P51)"
        side_effects:
          - "DesignLayout.status -> ACCEPTED"
          - "Project.workflow_status DRAFT-path advances MEASURED->DESIGNED (guarded cross-dimension)"
          - "Project.variant and Project.billable_area_sqft recomputed"
          - "increments DesignLayout.version and Project.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /design-layouts/{id}/reject"
        actor: SalesRep
        preconditions:
          - "DesignLayout.status == DRAFT"
        side_effects:
          - "DesignLayout.status -> REJECTED (no project-level change; pure branch divergence)"
          - "increments DesignLayout.version by 1"

  # ---- Quote: cyclic revise loop --------------------------------------------
  - entity: Quote
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, VOID]
    note: "Cyclic: SENT -> REVISED -> (new DRAFT child) ; revision spawns a successor quote, original moves to REVISED then VOID-equivalent terminal via supersede."
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: SalesRep
        preconditions:
          - "Quote.status == DRAFT"
          - "Quote.base_prep_scope_id references a FINALIZED BasePrepScope"
        side_effects:
          - "Quote.status -> SENT"
          - "increments Quote.version by 1"

      - from: SENT
        to: REVISED
        trigger: "POST /quotes/{id}/revise"
        actor: SalesRep
        preconditions:
          - "Quote.status == SENT"
          - "Project has no ACCEPTED Quote"
        side_effects:
          - "Quote.status -> REVISED"
          - "A new successor Quote is created in DRAFT cloning design_layout_id/base_prep_scope_id (cycle back to DRAFT on a new row)"
          - "Quote.superseded_by_quote_id := new successor Quote.id"
          - "increments Quote.version by 1"

      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Quote.status == SENT"
          - "Project.finance_status == UNBILLED"
          - "expected_project_version matches Project.version (OCC)"
        side_effects:
          - "Quote.status -> ACCEPTED"
          - "All other non-terminal Quote rows on project -> VOID"
          - "Project.finance_status -> DEPOSIT_DUE"
          - "increments Quote.version and Project.version by 1"

      - from: SENT
        to: EXPIRED
        trigger: "system (clock now >= created_at + QUOTE_TTL_DAYS and not accepted)"
        actor: system
        preconditions:
          - "Quote.status == SENT"
          - "Clock now >= Quote.created_at + QUOTE_TTL_DAYS days"
        side_effects:
          - "Quote.status -> EXPIRED"
          - "increments Quote.version by 1"

      - from: [DRAFT, SENT, REVISED]
        to: VOID
        trigger: "system (another Quote on project ACCEPTED, or project cancelled)"
        actor: system
        preconditions:
          - "Quote.status IN {DRAFT, SENT, REVISED}"
        side_effects:
          - "Quote.status -> VOID"
          - "increments Quote.version by 1"

  # ---- BasePrepScope: finalize gate -----------------------------------------
  - entity: BasePrepScope
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /base-prep-scopes/{id}/finalize"
        actor: SalesRep
        preconditions:
          - "BasePrepScope.status == DRAFT"
          - "Referenced DesignLayout.status == ACCEPTED"
        side_effects:
          - "BasePrepScope.status -> FINALIZED"
          - "excavation_cost_cents and drainage_cost_cents frozen at finalize time"
          - "increments BasePrepScope.version by 1"

  # ---- InstallJob: branching start -> {complete, abort} ---------------------
  - entity: InstallJob
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    note: "Branch: IN_PROGRESS -> {COMPLETED, ABORTED} with divergent side effects (complete activates warranty; abort releases crew window only)."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: Scheduler
        preconditions:
          - "InstallJob.status == SCHEDULED"
          - "Clock now >= InstallJob.scheduled_start"
        side_effects:
          - "InstallJob.status -> IN_PROGRESS"
          - "increments InstallJob.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /install-jobs/{id}/complete"
        actor: Scheduler
        preconditions:
          - "InstallJob.status == IN_PROGRESS"
        side_effects:
          - "InstallJob.status -> COMPLETED"
          - "Project.workflow_status SCHEDULED -> INSTALLED (bubble up)"
          - "PENDING WarrantyPlan -> ACTIVE; start_at := scheduled_end (cross-entity cascade)"
          - "Project.finance_status -> BALANCE_DUE"
          - "increments InstallJob.version and Project.version by 1"

      - from: [SCHEDULED, IN_PROGRESS]
        to: ABORTED
        trigger: "POST /install-jobs/{id}/abort or system (project cancel)"
        actor: "Scheduler or system"
        preconditions:
          - "InstallJob.status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "InstallJob.status -> ABORTED"
          - "Crew interval released (frees overlap window)"
          - "increments InstallJob.version by 1"

  # ---- WarrantyPlan: pending -> active -> expired ---------------------------
  - entity: WarrantyPlan
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, VOID]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (InstallJob complete)"
        actor: system
        preconditions:
          - "WarrantyPlan.status == PENDING"
          - "Associated InstallJob COMPLETED"
        side_effects:
          - "start_at := COMPLETED InstallJob.scheduled_end"
          - "expires_at := start_at + coverage_months"
          - "increments WarrantyPlan.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock now >= expires_at)"
        actor: system
        preconditions:
          - "WarrantyPlan.status == ACTIVE"
          - "Clock now >= expires_at"
        side_effects:
          - "WarrantyPlan.status -> EXPIRED"
          - "increments WarrantyPlan.version by 1"

      - from: PENDING
        to: VOID
        trigger: "system (project cancelled before install)"
        actor: system
        preconditions:
          - "WarrantyPlan.status == PENDING"
        side_effects:
          - "WarrantyPlan.status -> VOID"
          - "increments WarrantyPlan.version by 1"

  # ---- Callback: open -> in_progress -> resolved ----------------------------
  - entity: Callback
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /callbacks/{id}/start"
        actor: Scheduler
        preconditions:
          - "Callback.status == OPEN"
        side_effects:
          - "Callback.status -> IN_PROGRESS"
          - "increments Callback.version by 1"

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /callbacks/{id}/resolve"
        actor: Scheduler
        preconditions:
          - "Callback.status == IN_PROGRESS"
        side_effects:
          - "Callback.status -> RESOLVED"
          - "Project.open_callback_count recomputed (bubble up)"
          - "If billable: a BALANCE Payment of charge_cents is created PENDING"
          - "increments Callback.version by 1"

      - from: [OPEN, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /callbacks/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "Callback.status IN {OPEN, IN_PROGRESS}"
        side_effects:
          - "Callback.status -> CANCELLED"
          - "Project.open_callback_count recomputed (bubble up)"
          - "increments Callback.version by 1"

  # ---- Payment: pending -> settled / failed ---------------------------------
  - entity: Payment
    field: status
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED]
    note: "Settlement drives Project ledger + finance_status; chronological replay by created_at."
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /_payments/settle"
        actor: OpsAdmin
        preconditions:
          - "Payment.status == PENDING"
        side_effects:
          - "Payment.status -> SETTLED"
          - "Project ledger recomputed (deposit/balance/refund totals)"
          - "DEPOSIT settle may advance finance_status DEPOSIT_DUE->DEPOSIT_SETTLED and workflow_status QUOTED->DEPOSIT_PAID"
          - "BALANCE settle may advance finance_status BALANCE_DUE->PAID_IN_FULL"
          - "REFUND settle advances finance_status -> REFUNDED"

      - from: PENDING
        to: FAILED
        trigger: "POST /_payments/fail"
        actor: OpsAdmin
        preconditions:
          - "Payment.status == PENDING"
        side_effects:
          - "Payment.status -> FAILED (no ledger effect)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-project
    parent_entity: Project
    write_endpoint: "POST /quotes/{id}/accept"
    occ_field: "expected_project_version"
    description: |
      Accepting a Quote against a Project whose version has advanced since the
      client last observed it is rejected with a stale-version error. This captures
      the legitimate-supersede case: a different SENT quote on the same project may
      have been accepted (which VOIDs all sibling quotes and advances
      Project.finance_status), so the current client's view of the project is stale.
      Accepting a quote is a true CREATE-with-supersede style write — under the
      product spec two distinct SENT quotes can each independently be valid accept
      targets, so a second sequential accept cannot be rejected purely by a state
      precondition that the first happened to change; the OCC check on the project
      version is the deterministic guard.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- combinatorial (b): nested rounding order pinned ----------------------
  - name: quote_total
    trigger: "Quote create (POST /quotes) and on quote revise clone"
    algorithm: tiered_pricing
    formula: |
      Inputs come from the priced DesignLayout (net_area_sqft, variant, turf_product,
      infill_product) and the FINALIZED BasePrepScope (excavation_cost_cents,
      drainage_cost_cents).

      # ROUNDING ORDER IS PINNED: round EACH per-component line to whole cents
      # FIRST, then sum. (round-per-line-item then sum, NOT sum-then-round.)
      turf_line_cents  = round_half_up(net_area_sqft * turf.price_per_sqft_cents)
      infill_line_cents = round_half_up(net_area_sqft * infill.price_per_sqft_cents)
      material_subtotal_cents = turf_line_cents + infill_line_cents

      base_prep_subtotal_cents = scope.excavation_cost_cents + scope.drainage_cost_cents

      # variant surcharge: percentage of material_subtotal, tiered by variant
      variant_pct = {STANDARD:0.00, PET:0.12, PLAYGROUND:0.18, PUTTING_GREEN:0.25}[variant]
      variant_surcharge_cents = round_half_up(material_subtotal_cents * variant_pct)

      pre_discount_cents = material_subtotal_cents + base_prep_subtotal_cents + variant_surcharge_cents

      # EVALUATION ORDER (combinatorial mode c) is resolved in deposit_amount/quote_total split:
      #   volume discount is keyed on net_area_sqft tier; promo is a flat code.
      #   discount = volume_discount_cents + promo_discount_cents, each rounded then summed.
      volume_pct = (net_area_sqft >= 2000 ? 0.10 : net_area_sqft >= 1000 ? 0.05 : 0.00)
      volume_discount_cents = round_half_up(pre_discount_cents * volume_pct)
      promo_discount_cents  = (promo_code == "SPRING50" ? round_half_up(pre_discount_cents * 0.05)
                               : promo_code == "FLAT20000" ? 20000 : 0)
      discount_cents = volume_discount_cents + promo_discount_cents

      subtotal_cents = pre_discount_cents - discount_cents
      total_cents = max(subtotal_cents, MIN_JOB_CENTS)
    input_set: "Priced DesignLayout (ACCEPTED at accept time, but a DRAFT design may be priced for a DRAFT quote) + its FINALIZED BasePrepScope."
    constants:
      MIN_JOB_CENTS: 150000          # $1,500 minimum job floor
      VARIANT_PCT_STANDARD: 0.00
      VARIANT_PCT_PET: 0.12
      VARIANT_PCT_PLAYGROUND: 0.18
      VARIANT_PCT_PUTTING_GREEN: 0.25
      VOLUME_TIER1_SQFT: 1000
      VOLUME_TIER1_PCT: 0.05
      VOLUME_TIER2_SQFT: 2000
      VOLUME_TIER2_PCT: 0.10
    precision: "All money in integer cents; round_half_up per line BEFORE summing."
    variants:
      - name: estimate
        when: "Quote.status == DRAFT (not yet sent); design may still be DRAFT."
        difference: "Computed from the design's net_area_sqft as currently drafted; recomputed if the design is edited before send. NOT frozen."
      - name: final
        when: "Quote.status == SENT or ACCEPTED."
        difference: "total_cents is FROZEN at send time from the then-current FINALIZED scope and ACCEPTED design; later design edits do NOT change a SENT quote's total."

  # --- dual-variant calc #1 (different entity domain: Project ledger) -------
  - name: project_ledger
    trigger: "Payment PENDING_to_SETTLED; project cancel REFUND creation"
    algorithm: chronological
    formula: |
      Replay SETTLED Payment rows for the project in created_at ASC order
      (tie-break: created_at then id is FORBIDDEN as decision input — use created_at
      ASC; if two share created_at, the earlier-inserted is processed first via a
      monotonically increasing internal sequence captured at create, NOT id):
        deposit_paid_cents  = sum(amount_cents where kind==DEPOSIT and status==SETTLED)
        balance_paid_cents  = sum(amount_cents where kind==BALANCE and status==SETTLED)
        amount_refunded_cents = sum(amount_cents where kind==REFUND and status==SETTLED)
      signed_outstanding_cents = contract_total_cents
                                 - deposit_paid_cents - balance_paid_cents
                                 + amount_refunded_cents
      outstanding_balance_cents = max(signed_outstanding_cents, 0)   # display floor
    input_set: "SETTLED Payment rows only (PENDING/FAILED excluded)."
    constants: {}
    precision: "Integer cents; no rounding (sums of integers)."
    variants:
      - name: chronological_settled
        when: "Default ledger view."
        difference: "Processes settlements in created_at ASC; the conserved invariant (see §1.3 conservation note) holds regardless of order because addition is commutative, but the finance_status transition that fires is decided by the FIRST settle that crosses each threshold."
      - name: forward_projected
        when: "GET /projects/{id}/ledger?include_pending=true"
        difference: "Includes PENDING Payment rows as projected; produces a DIFFERENT outstanding figure than chronological_settled when pending payments exist (projected vs realized) — same Payment data, two algorithms, divergent outstanding."

  # --- combinatorial (a): >=3 inputs, non-linear branch ---------------------
  - name: drainage_tier
    trigger: "BasePrepScope create (POST /base-prep-scopes)"
    algorithm: threshold
    formula: |
      Inputs: latest RECORDED SiteMeasure.slope_pct, soil_drains_freely,
              and DesignLayout.variant (3 inputs, non-linear interaction).
      if variant == PUTTING_GREEN:                 # putting greens always panel-drained
          drainage_tier = DRAINAGE_PANEL
      elif (not soil_drains_freely) and slope_pct < 2.0:   # flat + poor soil -> panel
          drainage_tier = DRAINAGE_PANEL
      elif slope_pct >= 5.0 or (not soil_drains_freely):    # steep OR poor soil -> french
          drainage_tier = FRENCH_DRAIN
      else:
          drainage_tier = NONE
    input_set: "Latest RECORDED SiteMeasure on the project + the design's variant."
    constants:
      SLOPE_FLAT_MAX: 2.0
      SLOPE_STEEP_MIN: 5.0
    precision: "n/a (categorical output)."

  - name: base_prep_cost
    trigger: "BasePrepScope create and on /finalize freeze"
    algorithm: tiered_pricing
    formula: |
      net = priced DesignLayout.net_area_sqft
      excavation_cost_cents = round_half_up(net * base_depth_in * EXCAVATION_CENTS_PER_SQFT_INCH)
      drainage_cost_cents = {
        NONE: 0,
        FRENCH_DRAIN: round_half_up(net * FRENCH_DRAIN_CENTS_PER_SQFT),
        DRAINAGE_PANEL: round_half_up(net * PANEL_CENTS_PER_SQFT)
      }[drainage_tier]
    input_set: "drainage_tier (from §1.3 drainage_tier) + net_area_sqft + base_depth_in."
    constants:
      EXCAVATION_CENTS_PER_SQFT_INCH: 22
      FRENCH_DRAIN_CENTS_PER_SQFT: 180
      PANEL_CENTS_PER_SQFT: 320
    precision: "Integer cents, round_half_up."

  - name: waste_factor
    trigger: "DesignLayout create (POST /design-layouts)"
    algorithm: threshold
    formula: |
      runs = ceil(longest_run_ft / turf.roll_width_ft)   # number of roll runs needed
      if runs <= 1:   waste_factor_pct = 5.0
      elif runs == 2: waste_factor_pct = 8.0
      elif runs <= 4: waste_factor_pct = 12.0
      else:           waste_factor_pct = 15.0
      net_area_sqft = round_half_up_2dp(
          (gross_area_sqft - obstruction_area_sqft) * (1 + waste_factor_pct/100))
    input_set: "Latest RECORDED SiteMeasure (gross, obstruction, longest_run) + selected TurfProduct.roll_width_ft."
    constants:
      WASTE_1RUN_PCT: 5.0
      WASTE_2RUN_PCT: 8.0
      WASTE_3_4RUN_PCT: 12.0
      WASTE_5PLUS_PCT: 15.0
    precision: "net_area_sqft to 2 decimals, round_half_up."

  - name: deposit_amount
    trigger: "Quote create / send (deposit figure frozen at send)"
    algorithm: threshold
    formula: |
      # combinatorial mode (c): deposit depends on total_cents which depends on
      # discount which is keyed on the area tier — evaluation order pinned:
      #   1) compute total_cents (§1.3 quote_total)
      #   2) clamp deposit_pct into [DEPOSIT_MIN_PCT, DEPOSIT_MAX_PCT]
      #   3) deposit_amount_cents = round_half_up(total_cents * clamped_deposit_pct)
      clamped_pct = min(DEPOSIT_MAX_PCT, max(DEPOSIT_MIN_PCT, deposit_pct))
      deposit_amount_cents = round_half_up(total_cents * clamped_pct)
    input_set: "Quote.total_cents + Quote.deposit_pct."
    constants:
      DEPOSIT_MIN_PCT: 0.10
      DEPOSIT_MAX_PCT: 0.50
    precision: "Integer cents, round_half_up."

  - name: warranty_terms
    trigger: "WarrantyPlan create"
    algorithm: threshold
    formula: |
      coverage_months = {BASIC:12, PLUS:36, PREMIUM:96}[tier]
      maintenance_visits_per_year = {BASIC:0, PLUS:1, PREMIUM:2}[tier]
    input_set: "WarrantyPlan.tier."
    constants:
      BASIC_MONTHS: 12
      PLUS_MONTHS: 36
      PREMIUM_MONTHS: 96

  # --- dual-variant calc #2 lives in quote_total estimate/final; callback ----
  - name: callback_billing
    trigger: "Callback create (POST /callbacks)"
    algorithm: weighted_scoring
    formula: |
      covered_reasons = {SEAM_LIFT, WRINKLE, DRAINAGE}   # workmanship reasons
      pet_reasons = {PET_ODOR, INFILL_MIGRATION}
      is_covered =
        (warranty_plan_id is not null
         AND referenced WarrantyPlan.status == ACTIVE
         AND clock now < WarrantyPlan.expires_at
         AND ( reason IN covered_reasons
               OR (reason IN pet_reasons AND Project.variant == PET
                   AND WarrantyPlan.tier IN {PLUS, PREMIUM}) ))
      billable = not is_covered
      if billable:
        charge_cents = CALLBACK_FLAT_CENTS
                       + round_half_up(Project.billable_area_sqft * REWORK_CENTS_PER_SQFT)
      else:
        charge_cents = 0
    input_set: "Callback.reason + referenced WarrantyPlan status/tier/expiry + Project.variant + Project.billable_area_sqft."
    constants:
      CALLBACK_FLAT_CENTS: 12500
      REWORK_CENTS_PER_SQFT: 35
    precision: "Integer cents, round_half_up."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Customer acting on a project must own it (X-User-ID == Project.customer_id)"
    error_id: ERR_NOT_PROJECT_OWNER
    http_status: 403
    applies_to: "Customer-role endpoints (quote accept, GET own project)"

  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (project then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Referenced FK targets in body exist (turf_product_id, infill_product_id, site_measure_id, crew_id, design_layout_id, base_prep_scope_id, warranty_plan_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "design-layouts create, base-prep-scopes create, quotes create, install-jobs create, callbacks create"

  - priority: 6
    category: business_constraint
    check: "Required body fields present and well-typed; enum values within declared domain; numeric ranges (areas > 0, deposit_pct in 0.10..0.50)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "email uniqueness on Customer create; TurfProduct/InfillProduct sku uniqueness"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /customers, POST /turf-products, POST /infill-products"

  - priority: 8
    category: state
    check: "Target resource in a valid state for the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "OCC: expected_project_version matches Project.version on quote accept"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/accept"

  - priority: 10
    category: business_safety
    check: "Variant/product compatibility: PET design requires turf.pet_approved; PLAYGROUND requires turf.playground_rated AND infill.nonabrasive; PUTTING_GREEN requires turf.putting_rated; PET requires infill.antimicrobial"
    error_id: ERR_VARIANT_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /design-layouts"

  - priority: 11
    category: business_safety
    check: "Selected TurfProduct.active == true and InfillProduct.active == true"
    error_id: ERR_PRODUCT_RETIRED
    http_status: 422
    applies_to: "POST /design-layouts"

  - priority: 12
    category: business_constraint
    check: "At most one ACCEPTED DesignLayout per project (accept rejected if one already ACCEPTED)"
    error_id: ERR_DESIGN_ALREADY_ACCEPTED
    http_status: 409
    applies_to: "POST /design-layouts/{id}/accept"

  - priority: 13
    category: business_safety
    check: "Assigned Crew certified for variant: PUTTING_GREEN->certified_putting, PLAYGROUND->certified_playground; Crew.active == true"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /install-jobs"

  - priority: 14
    category: business_constraint
    check: "Crew.daily_capacity_sqft >= Project.billable_area_sqft for the install"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /install-jobs"

  - priority: 15
    category: business_temporal
    check: "InstallJob window [scheduled_start, scheduled_end) must not overlap another non-terminal (SCHEDULED/IN_PROGRESS) InstallJob on the same Crew. Half-open: adjacent (end == next start) is allowed."
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /install-jobs"

  - priority: 16
    category: business_temporal
    check: "scheduled_end must be strictly after scheduled_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /install-jobs"

  - priority: 17
    category: business_referential
    check: "Quote.base_prep_scope_id must reference a FINALIZED BasePrepScope before the quote can be SENT"
    error_id: ERR_SCOPE_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /quotes/{id}/send"

  - priority: 18
    category: business_fiscal
    check: "Deposit Payment amount + prior settled deposits must be >= ACCEPTED Quote.deposit_amount_cents to advance to DEPOSIT_PAID (under-deposit leaves project DEPOSIT_DUE)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /_payments/settle (kind=DEPOSIT under-payment when total deposit still < required)"

  - priority: 19
    category: business_fiscal
    check: "A BALANCE Payment cannot be recorded before finance_status == BALANCE_DUE (install complete)"
    error_id: ERR_BALANCE_NOT_DUE
    http_status: 409
    applies_to: "POST /payments (kind=BALANCE)"

  - priority: 20
    category: business_constraint
    check: "Project close requires finance_status==PAID_IN_FULL and open_callback_count==0"
    error_id: ERR_PROJECT_NOT_CLOSEABLE
    http_status: 409
    applies_to: "POST /projects/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [OpsAdmin, SalesRep]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["Customer created; email uniqueness enforced"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [OpsAdmin, SalesRep]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Catalog: TurfProduct ---
  - method: POST
    path: "/turf-products"
    description: "Create a turf product (catalog)"
    roles: [OpsAdmin]
    code: 201
    input: [sku, name, pile_height_mm, price_per_sqft_cents, roll_width_ft, "pet_approved?", "playground_rated?", "putting_rated?", "active?"]
    output: TurfProduct
    side_effects: ["sku uniqueness enforced"]

  - method: GET
    path: "/turf-products"
    description: "List turf products (paginated; filter by active)"
    roles: [OpsAdmin, SalesRep]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: TurfProduct[]
    side_effects: []

  - method: GET
    path: "/turf-products/{id}"
    description: "Get a turf product"
    roles: [OpsAdmin, SalesRep]
    code: 200
    input: []
    output: TurfProduct
    side_effects: []

  # --- Catalog: InfillProduct ---
  - method: POST
    path: "/infill-products"
    description: "Create an infill product (catalog)"
    roles: [OpsAdmin]
    code: 201
    input: [sku, name, material, price_per_sqft_cents, coverage_lbs_per_sqft, "antimicrobial?", "nonabrasive?", "active?"]
    output: InfillProduct
    side_effects: ["sku uniqueness enforced"]

  - method: GET
    path: "/infill-products"
    description: "List infill products (paginated; filter by active)"
    roles: [OpsAdmin, SalesRep]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: InfillProduct[]
    side_effects: []

  - method: GET
    path: "/infill-products/{id}"
    description: "Get an infill product"
    roles: [OpsAdmin, SalesRep]
    code: 200
    input: []
    output: InfillProduct
    side_effects: []

  # --- Crews ---
  - method: POST
    path: "/crews"
    description: "Create an install crew"
    roles: [OpsAdmin, Scheduler]
    code: 201
    input: [name, daily_capacity_sqft, "certified_putting?", "certified_playground?", "active?"]
    output: Crew
    side_effects: []

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew"
    roles: [OpsAdmin, Scheduler]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --- Projects ---
  - method: POST
    path: "/projects"
    description: "Create a project (DRAFT/UNBILLED)"
    roles: [OpsAdmin, SalesRep]
    code: 201
    input: [customer_id, site_address]
    output: Project
    side_effects: ["workflow_status=DRAFT, finance_status=UNBILLED, all computed totals 0"]

  - method: GET
    path: "/projects/{id}"
    description: "Get a project (computed rollups included)"
    roles: [OpsAdmin, SalesRep, Scheduler, Customer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects (paginated; filter by customer_id / workflow_status). Filtered list backs the Project.customer_id FK reverse lookup."
    roles: [OpsAdmin, SalesRep, Scheduler]
    code: 200
    input: ["customer_id?", "workflow_status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/projects/{id}/ledger"
    description: "Computed read: project ledger (settled by default; include_pending=true uses forward_projected variant)"
    roles: [OpsAdmin, SalesRep, Customer]
    code: 200
    input: ["include_pending?"]
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{id}/close"
    description: "Close an INSTALLED, PAID_IN_FULL project with no open callbacks"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["workflow_status -> CLOSED"]

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a non-installed project (cascade aborts jobs, voids quotes/warranty, refunds deposit)"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Project
    side_effects:
      - "workflow_status -> CANCELLED"
      - "SCHEDULED/IN_PROGRESS InstallJob -> ABORTED (releases crew window)"
      - "non-terminal Quote -> VOID; PENDING WarrantyPlan -> VOID"
      - "if deposit_paid_cents > 0: REFUND Payment created PENDING"
      - "increments Project.version by 1"

  # --- Site Measures ---
  - method: POST
    path: "/site-measures"
    description: "Record a site measurement (project_id in body; first one advances DRAFT->MEASURED)"
    roles: [SalesRep, OpsAdmin]
    code: 201
    input: [project_id, gross_area_sqft, "obstruction_area_sqft?", longest_run_ft, slope_pct, "soil_drains_freely?"]
    output: SiteMeasure
    side_effects:
      - "SiteMeasure created status=RECORDED; any prior RECORDED measure on the project -> SUPERSEDED"
      - "first measure advances Project.workflow_status DRAFT->MEASURED"
      - "increments Project.version by 1"

  - method: GET
    path: "/site-measures"
    description: "List site measures (filter by project_id / status). Backs SiteMeasure.project_id FK reverse lookup."
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: SiteMeasure[]
    side_effects: []

  - method: GET
    path: "/site-measures/{id}"
    description: "Get a site measure"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: SiteMeasure
    side_effects: []

  # --- Design Layouts ---
  - method: POST
    path: "/design-layouts"
    description: "Create a design layout (project_id in body; computes waste_factor + net_area_sqft); requires MEASURED project"
    roles: [SalesRep, OpsAdmin]
    code: 201
    input: [project_id, site_measure_id, turf_product_id, infill_product_id, variant]
    output: DesignLayout
    side_effects:
      - "waste_factor_pct + net_area_sqft computed (§1.3 waste_factor)"
      - "status=DRAFT"

  - method: GET
    path: "/design-layouts"
    description: "List design layouts (filter by project_id / site_measure_id / turf_product_id / infill_product_id / status). Backs DesignLayout FK reverse lookups."
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: ["project_id?", "site_measure_id?", "turf_product_id?", "infill_product_id?", "status?", "limit?", "offset?"]
    output: DesignLayout[]
    side_effects: []

  - method: GET
    path: "/design-layouts/{id}"
    description: "Get a design layout"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: DesignLayout
    side_effects: []

  - method: POST
    path: "/design-layouts/{id}/accept"
    description: "Accept a design (DRAFT->ACCEPTED); advances project MEASURED->DESIGNED"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: DesignLayout
    side_effects:
      - "DesignLayout.status -> ACCEPTED"
      - "Project.variant := design.variant; Project.billable_area_sqft recomputed"
      - "Project.workflow_status MEASURED->DESIGNED"
      - "increments Project.version by 1"

  - method: POST
    path: "/design-layouts/{id}/reject"
    description: "Reject a design (DRAFT->REJECTED)"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: DesignLayout
    side_effects: ["DesignLayout.status -> REJECTED"]

  # --- Base Prep Scopes ---
  - method: POST
    path: "/base-prep-scopes"
    description: "Create base prep & drainage scope (project_id + design_layout_id in body; computes drainage_tier + costs)"
    roles: [SalesRep, OpsAdmin]
    code: 201
    input: [project_id, design_layout_id, base_depth_in]
    output: BasePrepScope
    side_effects:
      - "drainage_tier computed (§1.3 drainage_tier)"
      - "excavation_cost_cents + drainage_cost_cents computed (§1.3 base_prep_cost)"
      - "status=DRAFT"

  - method: GET
    path: "/base-prep-scopes"
    description: "List base prep scopes (filter by project_id / design_layout_id / status). Backs BasePrepScope FK reverse lookups."
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: ["project_id?", "design_layout_id?", "status?", "limit?", "offset?"]
    output: BasePrepScope[]
    side_effects: []

  - method: GET
    path: "/base-prep-scopes/{id}"
    description: "Get a base prep scope"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: BasePrepScope
    side_effects: []

  - method: POST
    path: "/base-prep-scopes/{id}/finalize"
    description: "Finalize a base prep scope (DRAFT->FINALIZED; freezes costs)"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: BasePrepScope
    side_effects: ["status -> FINALIZED; costs frozen"]

  # --- Quotes ---
  - method: POST
    path: "/quotes"
    description: "Create a quote (project_id + design/scope FKs in body; computes totals + deposit; estimate variant while DRAFT)"
    roles: [SalesRep, OpsAdmin]
    code: 201
    input: [project_id, design_layout_id, base_prep_scope_id, "promo_code?", "deposit_pct?"]
    output: Quote
    side_effects:
      - "material/base_prep/variant_surcharge/discount/subtotal/total computed (§1.3 quote_total)"
      - "deposit_amount_cents computed (§1.3 deposit_amount)"
      - "status=DRAFT"

  - method: GET
    path: "/quotes"
    description: "List quotes (filter by project_id / design_layout_id / base_prep_scope_id / superseded_by_quote_id / status). Backs Quote FK reverse lookups incl. self-referential supersede."
    roles: [SalesRep, OpsAdmin, Customer]
    code: 200
    input: ["project_id?", "design_layout_id?", "base_prep_scope_id?", "superseded_by_quote_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Get a quote"
    roles: [SalesRep, OpsAdmin, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a quote (DRAFT->SENT; freezes total; advances project DESIGNED->QUOTED)"
    roles: [SalesRep, OpsAdmin]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "Quote.status -> SENT; total frozen (final variant)"
      - "Project.workflow_status DESIGNED->QUOTED"
      - "increments Project.version by 1"

  - method: POST
    path: "/quotes/{id}/revise"
    description: "Revise a SENT quote (SENT->REVISED; spawns successor DRAFT quote — cyclic loop)"
    roles: [SalesRep, OpsAdmin]
    code: 201
    input: ["promo_code?", "deposit_pct?"]
    output: Quote
    side_effects:
      - "Quote.status -> REVISED; superseded_by_quote_id set"
      - "successor Quote created DRAFT cloning design/scope"

  - method: POST
    path: "/quotes/{id}/accept"
    description: "Customer accepts a SENT quote (OCC on project version); advances finance UNBILLED->DEPOSIT_DUE"
    roles: [Customer, OpsAdmin]
    code: 200
    input: [expected_project_version]
    output: Quote
    side_effects:
      - "Quote.status -> ACCEPTED; sibling non-terminal quotes -> VOID"
      - "Project.finance_status UNBILLED->DEPOSIT_DUE"
      - "increments Project.version by 1"

  # --- Payments ---
  - method: POST
    path: "/payments"
    description: "Record a payment (project_id in body; DEPOSIT/BALANCE/REFUND) in PENDING"
    roles: [OpsAdmin, Customer]
    code: 201
    input: [project_id, kind, amount_cents]
    output: Payment
    side_effects: ["Payment created status=PENDING"]

  - method: GET
    path: "/payments"
    description: "List payments (filter by project_id / kind / status). Backs Payment.project_id FK reverse lookup."
    roles: [OpsAdmin, SalesRep, Customer]
    code: 200
    input: ["project_id?", "kind?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [OpsAdmin, SalesRep, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/_payments/settle"
    description: "Test/ops driver: settle a PENDING payment (PENDING->SETTLED); drives ledger + finance/workflow advances"
    roles: [OpsAdmin]
    code: 200
    input: [payment_id]
    output: Payment
    side_effects:
      - "Payment.status -> SETTLED"
      - "Project ledger recomputed; finance_status / workflow_status advance per §1.2"
      - "increments Project.version by 1"

  - method: POST
    path: "/_payments/fail"
    description: "Test/ops driver: fail a PENDING payment (PENDING->FAILED; no ledger effect)"
    roles: [OpsAdmin]
    code: 200
    input: [payment_id]
    output: Payment
    side_effects: ["Payment.status -> FAILED"]

  # --- Install Jobs ---
  - method: POST
    path: "/install-jobs"
    description: "Schedule an install job (project_id + crew_id in body; DEPOSIT_PAID->SCHEDULED); overlap + capacity + certification checks"
    roles: [Scheduler, OpsAdmin]
    code: 201
    input: [project_id, crew_id, scheduled_start, scheduled_end]
    output: InstallJob
    side_effects:
      - "InstallJob created SCHEDULED; install_area_sqft := Project.billable_area_sqft"
      - "Project.workflow_status DEPOSIT_PAID->SCHEDULED"
      - "increments Project.version by 1"

  - method: GET
    path: "/install-jobs"
    description: "List install jobs (filter by project_id / crew_id / status). Backs InstallJob FK reverse lookups (project + crew)."
    roles: [Scheduler, OpsAdmin, Customer]
    code: 200
    input: ["project_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []

  - method: GET
    path: "/install-jobs/{id}"
    description: "Get an install job"
    roles: [Scheduler, OpsAdmin, Customer]
    code: 200
    input: []
    output: InstallJob
    side_effects: []

  - method: POST
    path: "/install-jobs/{id}/start"
    description: "Start an install (SCHEDULED->IN_PROGRESS); requires clock >= scheduled_start"
    roles: [Scheduler, OpsAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob.status -> IN_PROGRESS"]

  - method: POST
    path: "/install-jobs/{id}/complete"
    description: "Complete an install (IN_PROGRESS->COMPLETED); cascade: project INSTALLED, warranty ACTIVE, finance BALANCE_DUE"
    roles: [Scheduler, OpsAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects:
      - "InstallJob.status -> COMPLETED"
      - "Project.workflow_status SCHEDULED->INSTALLED"
      - "PENDING WarrantyPlan -> ACTIVE (start_at/expires_at set)"
      - "Project.finance_status -> BALANCE_DUE"
      - "increments Project.version by 1"

  - method: POST
    path: "/install-jobs/{id}/abort"
    description: "Abort an install (SCHEDULED/IN_PROGRESS->ABORTED); releases crew window"
    roles: [Scheduler, OpsAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob.status -> ABORTED; crew interval released"]

  # --- Warranty Plans ---
  - method: POST
    path: "/warranty-plans"
    description: "Create a warranty & maintenance plan (project_id in body; PENDING; coverage computed from tier)"
    roles: [SalesRep, OpsAdmin]
    code: 201
    input: [project_id, tier]
    output: WarrantyPlan
    side_effects: ["coverage_months + maintenance_visits_per_year computed (§1.3 warranty_terms); status=PENDING"]

  - method: GET
    path: "/warranty-plans"
    description: "List warranty plans (filter by project_id / status). Backs WarrantyPlan.project_id FK reverse lookup."
    roles: [SalesRep, OpsAdmin, Customer]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: WarrantyPlan[]
    side_effects: []

  - method: GET
    path: "/warranty-plans/{id}"
    description: "Get a warranty plan"
    roles: [SalesRep, OpsAdmin, Customer]
    code: 200
    input: []
    output: WarrantyPlan
    side_effects: []

  # --- Callbacks ---
  - method: POST
    path: "/callbacks"
    description: "Open a callback (project_id in body; computes billable + charge_cents); requires INSTALLED project"
    roles: [OpsAdmin, SalesRep, Customer]
    code: 201
    input: [project_id, reason, "warranty_plan_id?"]
    output: Callback
    side_effects:
      - "billable + charge_cents computed (§1.3 callback_billing)"
      - "status=OPEN; Project.open_callback_count recomputed"
      - "increments Project.version by 1"

  - method: GET
    path: "/callbacks"
    description: "List callbacks (filter by project_id / warranty_plan_id / status). Backs Callback FK reverse lookups (project + warranty)."
    roles: [OpsAdmin, SalesRep, Customer]
    code: 200
    input: ["project_id?", "warranty_plan_id?", "status?", "limit?", "offset?"]
    output: Callback[]
    side_effects: []

  - method: GET
    path: "/callbacks/{id}"
    description: "Get a callback"
    roles: [OpsAdmin, SalesRep, Customer]
    code: 200
    input: []
    output: Callback
    side_effects: []

  - method: POST
    path: "/callbacks/{id}/start"
    description: "Start working a callback (OPEN->IN_PROGRESS)"
    roles: [Scheduler, OpsAdmin]
    code: 200
    input: []
    output: Callback
    side_effects: ["Callback.status -> IN_PROGRESS"]

  - method: POST
    path: "/callbacks/{id}/resolve"
    description: "Resolve a callback (IN_PROGRESS->RESOLVED); billable -> PENDING BALANCE Payment"
    roles: [Scheduler, OpsAdmin]
    code: 200
    input: []
    output: Callback
    side_effects:
      - "Callback.status -> RESOLVED; Project.open_callback_count recomputed"
      - "if billable: BALANCE Payment of charge_cents created PENDING"
      - "increments Project.version by 1"

  - method: POST
    path: "/callbacks/{id}/cancel"
    description: "Cancel a callback (OPEN/IN_PROGRESS->CANCELLED)"
    roles: [Scheduler, OpsAdmin, Customer]
    code: 200
    input: []
    output: Callback
    side_effects: ["Callback.status -> CANCELLED; Project.open_callback_count recomputed"]

  # --- Clock (test driver, mandatory default time) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test driver: set the logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock set; may trigger Quote SENT->EXPIRED and WarrantyPlan ACTIVE->EXPIRED on next read of affected rows"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_PROJECT_OWNER, http: 403, condition: "Customer acting on a project they do not own (X-User-ID != Project.customer_id)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK target (turf/infill/measure/crew/design/scope/warranty) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, enum out of domain, or numeric range violation (e.g. area <= 0, deposit_pct outside 0.10..0.50)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Customer email or product sku already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match Project.version on quote accept (OCC)" }
  - { id: ERR_VARIANT_PRODUCT_MISMATCH, http: 422, condition: "Selected turf/infill not rated for the design variant (PET/PLAYGROUND/PUTTING_GREEN requirements)" }
  - { id: ERR_PRODUCT_RETIRED, http: 422, condition: "Selected TurfProduct or InfillProduct has active == false" }
  - { id: ERR_DESIGN_ALREADY_ACCEPTED, http: 409, condition: "Project already has an ACCEPTED DesignLayout" }
  - { id: ERR_CREW_NOT_CERTIFIED, http: 422, condition: "Crew lacks certification for project variant, or crew inactive" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 422, condition: "Crew.daily_capacity_sqft < Project.billable_area_sqft" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Requested install window overlaps another non-terminal InstallJob on the same crew (half-open)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "scheduled_end not strictly after scheduled_start" }
  - { id: ERR_SCOPE_NOT_FINALIZED, http: 409, condition: "Quote send requires its BasePrepScope to be FINALIZED" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "Settled deposit total still below ACCEPTED Quote.deposit_amount_cents" }
  - { id: ERR_BALANCE_NOT_DUE, http: 409, condition: "BALANCE payment recorded before finance_status == BALANCE_DUE" }
  - { id: ERR_PROJECT_NOT_CLOSEABLE, http: 409, condition: "Project close attempted while not PAID_IN_FULL or with open callbacks" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Operational superuser: catalog, project lifecycle overrides, payments, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /turf-products / POST /infill-products — catalog management"
      - "POST /projects/{id}/close — close project"
      - "POST /projects/{id}/cancel — cancel project"
      - "POST /_payments/settle, POST /_payments/fail — payment settlement"
      - "POST /_clock/set_current_utc — clock control"
    shared_operations:
      - "All SalesRep, Scheduler, and Customer read/write operations (operational override)"

  - name: SalesRep
    description: "Owns the pre-sale pipeline: customers, measures, designs, base prep scope, quotes (draft/send/revise), warranty plans."
    identity: "opaque"
    exclusive_operations:
      - "POST /site-measures — record measure"
      - "POST /design-layouts (+ /design-layouts/{id}/accept, /design-layouts/{id}/reject) — design lifecycle"
      - "POST /base-prep-scopes (+ /base-prep-scopes/{id}/finalize) — scope lifecycle"
      - "POST /quotes (+ /quotes/{id}/send, /quotes/{id}/revise) — quote authoring"
      - "POST /warranty-plans — warranty authoring"
    shared_operations:
      - "POST /customers, POST /projects — creation (with OpsAdmin)"
      - "GET reads on projects, quotes, designs, scopes, measures, payments, callbacks"

  - name: Scheduler
    description: "Owns crews and install scheduling, and callback servicing."
    identity: "opaque"
    exclusive_operations:
      - "POST /install-jobs (+ /install-jobs/{id}/start, /complete, /abort) — install scheduling"
      - "POST /callbacks/{id}/start, /callbacks/{id}/resolve — callback servicing"
    shared_operations:
      - "POST /crews — crew creation (with OpsAdmin)"
      - "POST /callbacks/{id}/cancel (with OpsAdmin, Customer)"
      - "GET reads on projects, crews, install-jobs, callbacks"

  - name: Customer
    description: "End customer; acts only on own projects. Accepts quotes, records own payments, opens/cancels callbacks, reads own project."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /quotes/{id}/accept — accept own project's quote (with OpsAdmin)"
      - "POST /payments — record own payment (with OpsAdmin)"
      - "POST /callbacks — open callback on own project (with OpsAdmin, SalesRep)"
      - "POST /callbacks/{id}/cancel (with Scheduler, OpsAdmin)"
      - "GET reads scoped to own project (project, ledger, quotes, payments, install-jobs, warranty-plans, callbacks)"
