      - name: pin_forbidden_for_fieldops
        claim_type: rbac_exclusive_denied
        grounds: ["roles[MethodologyLead]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "MethodologyLead's exclusive pin operation rejects FieldOps with 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Study DRAFT with a DRAFT methodology version"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
          trigger:
            - call: "POST /research/methodology-versions/${mv}/pin"
              payload: { expected_study_version: "${sv}" }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403); the methodology stays DRAFT and the study stays DRAFT at version 1"

      - name: subscription_ownership_forbidden
        claim_type: rbac_ownership_denied
        grounds: ["roles[ClientUser]", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ClientUser acting as Client A cannot create a subscription with client_id of Client B — entity-backed ownership is enforced on writes."
        test_recipe:
          setup: ["Two clients A and B; one bare study"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US" }
              as: StudyAdmin
              captures: { cla: $.data.id }
            - call: "POST /research/clients"
              payload: { name: "ClientB", client_type: "AGENCY", country: "US" }
              as: StudyAdmin
              captures: { clb: $.data.id }
          trigger:
            - call: "POST /research/subscriptions"
              payload: { client_id: "${clb}", study_id: "${sid}", tier: "DIAGNOSTIC", starts_at: "2026-09-01T00:00:00Z", ends_at: "2027-08-31T00:00:00Z" }
              as: ClientUser
              as_user_id: "${cla}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403); no subscription is created for ClientB"

      - name: press_kit_forbidden_for_client_user
        claim_type: rbac_exclusive_denied
        grounds: ["roles[PressUser]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The press-kit endpoint admits only PressUser and StudyAdmin; a ClientUser is denied with 403 even for a published study."
        test_recipe:
          setup: ["one bare study; one client"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US" }
              as: StudyAdmin
              captures: { cl: $.data.id }
          trigger:
            - call: "GET /research/studies/${sid}/press-kit"
              payload: {}
              as: ClientUser
              as_user_id: "${cl}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403)"

