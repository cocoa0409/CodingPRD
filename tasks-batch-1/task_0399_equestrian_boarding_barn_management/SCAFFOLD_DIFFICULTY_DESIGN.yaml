      - name: stall_occupancy_conserved_across_activate_then_end
        grounds:
          - state_machines.BoardingAgreement.DRAFT_to_ACTIVE
          - state_machines.BoardingAgreement.ACTIVE_to_ENDED
          - entities.Stall.fields.occupied_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Stall.occupied_count: activation increments it by 1 and the
          paired end decrements it by 1, so the stall returns to occupied_count 0 with no drift —
          conservation of slot occupancy rather than money.
        test_recipe:
          setup:
            - "Owner with SIGNED waiver; STALL cap 1; agreement activated (occupied_count 1) then ended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
