      - name: corner_expense_factor_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.bank_statement_income.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / bank_statement_expense_factor_variant_divergence
          rationale: "The named 1.8 instance runs both expense-factor variants over byte-identical statement months and asserts the 534722-cent delta."

      - name: corner_bank_statement_per_month_rounding_order
        claim_type: precision
        grounds:
          - calculations.bank_statement_income
        excluded_because:
          difficulty_instance: combinatorial_formula / bank_statement_per_month_rounding_before_summation
          rationale: "The named 1.8 instance distinguishes the pinned per-month-then-average rounding from the rounded-once-at-the-end shortcut on deposits chosen to diverge."

