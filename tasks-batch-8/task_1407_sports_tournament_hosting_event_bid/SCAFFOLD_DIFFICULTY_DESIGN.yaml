            - { call: "POST /api/v1/matches/${m2}/schedule", payload: { field_id: "${f1}", scheduled_start: "2026-10-10T15:30:00Z" }, as: CommissionAdmin, captures: { st: $.data.status, se: $.data.scheduled_end } }
          assert:
