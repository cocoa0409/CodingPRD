# =============================================================================
# task_0323_garage_door_install_repair — SCAFFOLD (§1.0–§1.7)
# Garage Door Install & Repair
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  Garage Door Install & Repair: door/opener catalog & measure, service call vs
  install quote, spring/cable/panel parts, technician dispatch & ETA,
  emergency/after-hours, warranty & tune-up plan, financing, callback

domain_name: garage-door-install-repair
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  difficulty_tier: expert

  entity_topology: flat
  # Peer entities linked by foreign keys; URLs are flat collections
  # (/jobs, /quotes, /technicians, /parts, ...), not nested ownership trees.

  state_machine_shape: parallel
  # Job carries two independent dimensions (dispatch_status × billing_status);
  # Quote is cyclic (revision loop); Callback is cyclic; Financing/Warranty branch.

  relationship_patterns:
    - one_to_many        # Quote 1—* QuoteLine; Job 1—* PartReservation
    - cross_aggregate    # Job references Technician, EquipmentUnit, Quote, Customer
    - polymorphic        # QuoteLine.item_ref_id references DoorModel|OpenerModel|Part by item_kind

  role_model: segregation_of_duties
  # The Technician who runs a job cannot approve its own final invoice;
  # the Dispatcher who schedules cannot execute on-site transitions.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email, unique among customers" }
      - { name: service_address, type: string, source: input, description: "Street address where work is performed" }
      - { name: time_zone, type: string, source: input, description: "IANA zone used to classify dispatch hours into business vs after-hours bands", default: "America/Los_Angeles" }
      - { name: financing_standing, type: enum, source: computed, description: "GOOD | BLOCKED — BLOCKED while the customer has any FinancingApplication in DEFAULTED. Constraint: GOOD,BLOCKED" }
      - { name: active_warranty_count, type: integer, source: computed, description: "Count of WarrantyPlan rows for this customer in ACTIVE status", default: 0 }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Technician name" }
      - { name: skill_level, type: enum, source: input, description: "APPRENTICE | CERTIFIED | MASTER. Constraint: APPRENTICE,CERTIFIED,MASTER" }
      - { name: certified_for_install, type: boolean, source: input, description: "Whether the technician may run INSTALL jobs (vs SERVICE only)", default: false }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_LEAVE — only AVAILABLE technicians may be dispatched. Constraint: AVAILABLE,ON_LEAVE" }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of (scheduled_end - scheduled_start) in minutes over this technician's Jobs whose dispatch_status NOT IN {CANCELLED}. Conserved quantity for invariant tech_booked_minutes_conservation", default: 0 }
      - { name: jobs_completed_count, type: integer, source: computed, description: "Count of this technician's Jobs whose dispatch_status == COMPLETED or CLOSED", default: 0 }
      - { name: callback_rate_provisional, type: number, source: computed, description: "Rolling callback rate including OPEN callbacks as faults; see calculation technician_callback_rate variant provisional", default: 0 }
      - { name: callback_rate_settled, type: number, source: computed, description: "Confirmed callback rate counting only RESOLVED callbacks with fault_confirmed=true; see technician_callback_rate variant settled", default: 0 }

  - name: DoorModel
    parent: null
    common_fields: false
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU, unique among door models" }
      - { name: name, type: string, source: input, description: "Door product name" }
      - { name: width_in, type: integer, source: input, description: "Nominal door width in inches" }
      - { name: height_in, type: integer, source: input, description: "Nominal door height in inches" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price in cents" }
      - { name: install_labor_minutes, type: integer, source: input, description: "Standard install labor budget in minutes for this door" }
      - { name: requires_lift, type: boolean, source: input, description: "Install needs a powered lift EquipmentUnit", default: false }

  - name: OpenerModel
    parent: null
    common_fields: false
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU, unique among opener models" }
      - { name: name, type: string, source: input, description: "Opener product name" }
      - { name: horsepower, type: number, source: input, description: "Motor rating" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price in cents" }
      - { name: install_labor_minutes, type: integer, source: input, description: "Standard install labor budget in minutes for this opener" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Part SKU, unique among parts" }
      - { name: category, type: enum, source: input, description: "SPRING | CABLE | PANEL | ROLLER | SENSOR. Constraint: SPRING,CABLE,PANEL,ROLLER,SENSOR" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit catalog price in cents" }
      - { name: markup_pct, type: number, source: input, description: "Per-line markup fraction applied to part price on quote lines, e.g. 0.35 means +35%", default: 0.35 }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical units in stock. Conserved quantity for invariant part_inventory_conservation" }
      - { name: reserved_qty, type: integer, source: computed, description: "Sum of qty over PartReservation rows for this part whose status == HELD", default: 0 }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty; never negative", default: 0 }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lift/crane unit label" }
      - { name: concurrent_capacity, type: integer, source: input, description: "Max number of overlapping Jobs that may book this unit at once (aggregate-capacity overlap semantics)", default: 1 }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer the quote is for" }
      - { name: quote_type, type: enum, source: input, description: "SERVICE_CALL | INSTALL — pricing model differs by type. Constraint: SERVICE_CALL,INSTALL" }
      - { name: door_model_id, type: string, source: input, description: "FK -> DoorModel.id; set only when quote_type==INSTALL, else null" }
      - { name: opener_model_id, type: string, source: input, description: "FK -> OpenerModel.id; optional add-on opener on INSTALL quotes, else null" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | DECLINED | EXPIRED. Constraint: DRAFT,SENT,ACCEPTED,DECLINED,EXPIRED" }
      - { name: revision, type: integer, source: system, description: "Revision counter; starts at 1, increments on each /revise", default: 1 }
      - { name: service_call_fee_cents, type: integer, source: input, description: "Flat trip/diagnostic fee for SERVICE_CALL quotes; 0 for INSTALL", default: 0 }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Forward-looking quote total; see calculation quote_estimate_total. Diverges from Job.final_total_cents" }
      - { name: expires_at, type: datetime, source: system, description: "SENT quotes expire 14 days after the SENT transition; EXPIRED is set on next read/transition past this instant" }

  - name: QuoteLine
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; owning quote" }
      - { name: item_kind, type: enum, source: input, description: "PART | DOOR | OPENER | LABOR. Constraint: PART,DOOR,OPENER,LABOR" }
      - { name: item_ref_id, type: string, source: input, description: "Polymorphic reference to Part.id when item_kind==PART, else null (DOOR/OPENER/LABOR derive from the Quote header)" }
      - { name: qty, type: integer, source: input, description: "Units for PART lines; minutes for LABOR lines; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Snapshot price per unit captured at line creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-line marked-up, rounded subtotal; see quote_estimate_total mode (b)" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the accepted quote that spawned this job" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; denormalized from the quote at job creation" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned at dispatch, null while UNSCHEDULED" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; booked when the door requires a lift, else null" }
      - { name: dispatch_status, type: enum, source: system, description: "UNSCHEDULED | SCHEDULED | EN_ROUTE | ON_SITE | COMPLETED | CLOSED | CANCELLED. Constraint: UNSCHEDULED,SCHEDULED,EN_ROUTE,ON_SITE,COMPLETED,CLOSED,CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "PENDING | INVOICED | PAID — independent dimension from dispatch_status. Constraint: PENDING,INVOICED,PAID" }
      - { name: scheduled_start, type: datetime, source: input, description: "Dispatch window start (UTC); set at SCHEDULED" }
      - { name: scheduled_end, type: datetime, source: input, description: "Dispatch window end (UTC, half-open); set at SCHEDULED" }
      - { name: is_emergency, type: boolean, source: input, description: "Customer requested emergency/after-hours service", default: false }
      - { name: safety_inspection_passed, type: boolean, source: system, description: "Set true via the safety-check endpoint; required before COMPLETED", default: false }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID (Technician id) of whoever ran /complete; used by the invoice segregation-of-duties check" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final invoice total computed at COMPLETED; see job_final_total. Diverges from Quote.estimate_total_cents" }
      - { name: emergency_surcharge_cents, type: integer, source: computed, description: "After-hours surcharge component of the final total; see job_emergency_surcharge", default: 0 }

  - name: PartReservation
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job consuming the parts" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the reserved part" }
      - { name: qty, type: integer, source: input, description: "Units reserved; must be >= 1" }
      - { name: status, type: enum, source: system, description: "HELD | CONSUMED | RELEASED. Constraint: HELD,CONSUMED,RELEASED" }

  - name: WarrantyPlan
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job this plan covers" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; denormalized owner" }
      - { name: tune_ups_included, type: integer, source: input, description: "Number of free tune-up visits included over the plan term", default: 2 }
      - { name: tune_ups_used, type: integer, source: computed, description: "Number of tune-ups already redeemed", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | CANCELLED. Constraint: PENDING,ACTIVE,EXPIRED,CANCELLED" }

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; applicant" }
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote being financed" }
      - { name: principal_cents, type: integer, source: input, description: "Amount financed; must equal the quote estimate_total_cents at submission" }
      - { name: term_months, type: integer, source: input, description: "Repayment term; one of 6, 12, 24. Constraint: 6,12,24" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DECLINED | ACTIVE | DEFAULTED. Constraint: SUBMITTED,APPROVED,DECLINED,ACTIVE,DEFAULTED" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Computed at APPROVED; see financing_monthly_payment" }

  - name: Callback
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the original job a customer called back about" }
      - { name: reason, type: string, source: input, description: "Free-text complaint" }
      - { name: status, type: enum, source: system, description: "OPEN | SCHEDULED | ON_SITE | RESOLVED. Constraint: OPEN,SCHEDULED,ON_SITE,RESOLVED" }
      - { name: fault_confirmed, type: boolean, source: input, description: "Set at RESOLVED: whether the original work was at fault (counts against technician settled rate)", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Quote: cyclic revision loop + branching accept/decline ----
  - entity: Quote
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: ServiceManager
        preconditions:
          - "Quote has at least one QuoteLine"
        side_effects:
          - "Sets expires_at = send instant + 14 days"
          - "Recomputes estimate_total_cents via quote_estimate_total"

      - from: SENT
        to: SENT
        trigger: "POST /quotes/{id}/revise"
        actor: ServiceManager
        preconditions:
          - "Quote.status == SENT (not yet ACCEPTED/DECLINED/EXPIRED)"
        side_effects:
          - "Increments revision by 1"
          - "Resets expires_at = revise instant + 14 days"
          - "Recomputes estimate_total_cents over the current QuoteLine set"
          - "Increments Quote.version by 1"
        note: "Cyclic self-loop: a SENT quote may be revised repeatedly before the customer decides."

      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Quote.status == SENT"
          - "now < expires_at (else the read/transition flips it to EXPIRED first)"
          - "Customer.financing_standing == GOOD (cross-entity: Quote depends on Customer)"
        side_effects:
          - "Creates a Job in dispatch_status=UNSCHEDULED, billing_status=PENDING (cascade hop 1)"
          - "For each PART QuoteLine, creates a PartReservation(status=HELD) on the new Job (cascade hop 2)"
          - "Each PartReservation creation increments Part.reserved_qty and recomputes Part.available_qty (cascade hop 3)"
          - "Increments Quote.version by 1"

      - from: SENT
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: Customer
        preconditions:
          - "Quote.status == SENT"
        side_effects:
          - "No Job is created"

      - from: [DRAFT, SENT]
        to: EXPIRED
        trigger: "system (now >= expires_at on next read or transition attempt)"
        actor: system
        preconditions:
          - "expires_at is set and now >= expires_at"
        side_effects:
          - "Quote becomes terminal; accept/decline/revise all rejected with ERR_QUOTE_EXPIRED"

  # ---- Job dispatch dimension (parallel with billing) ----
  - entity: Job
    field: dispatch_status
    initial_state: UNSCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /jobs/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Technician.status == AVAILABLE (cross-entity: Job depends on Technician)"
          - "If Quote.quote_type==INSTALL then Technician.certified_for_install == true"
          - "scheduled_start < scheduled_end (half-open window)"
          - "No overlap with this technician's other non-CANCELLED Jobs incl. 30-min travel buffer (resource overlap: Technician, buffered half-open)"
          - "If the door requires a lift, equipment_unit_id booked; overlapping bookings on that unit < concurrent_capacity (resource overlap: EquipmentUnit, closed aggregate-capacity)"
        side_effects:
          - "Assigns technician_id (and equipment_unit_id if required)"
          - "Increments Technician.booked_minutes by window length in minutes (invariant tech_booked_minutes_conservation)"

      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /jobs/{id}/depart"
        actor: Technician
        preconditions:
          - "Acting Technician.id == Job.technician_id"
        side_effects:
          - "Records ETA window start"

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /jobs/{id}/arrive"
        actor: Technician
        preconditions:
          - "Acting Technician.id == Job.technician_id"
        side_effects: []

      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /jobs/{id}/complete"
        actor: Technician
        preconditions:
          - "safety_inspection_passed == true (business_safety)"
          - "Every PartReservation on the job is in status CONSUMED (business_referential)"
        side_effects:
          - "Records completed_by_user_id = acting Technician's X-User-ID"
          - "Computes final_total_cents via job_final_total and emergency_surcharge_cents via job_emergency_surcharge"
          - "Increments Technician.jobs_completed_count by 1"
          - "Recomputes Technician.callback_rate_provisional and callback_rate_settled"

      - from: COMPLETED
        to: CLOSED
        trigger: "POST /jobs/{id}/close"
        actor: ServiceManager
        preconditions:
          - "billing_status == PAID"
        side_effects:
          - "If a WarrantyPlan exists for this job in PENDING, transitions it to ACTIVE (cascade hop 1)"
          - "WarrantyPlan activation increments Customer.active_warranty_count (cascade hop 2)"

      - from: [UNSCHEDULED, SCHEDULED, EN_ROUTE]
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "dispatch_status NOT IN {ON_SITE, COMPLETED, CLOSED}"
        side_effects:
          - "All HELD PartReservations -> RELEASED; each decrements Part.reserved_qty and recomputes Part.available_qty (compensating: part_inventory_conservation)"
          - "If technician was assigned, decrements Technician.booked_minutes by the window length (compensating: tech_booked_minutes_conservation)"

  # ---- Job billing dimension (parallel) ----
  - entity: Job
    field: billing_status
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /jobs/{id}/invoice"
        actor: ServiceManager
        preconditions:
          - "dispatch_status == COMPLETED (cross-dimension guard within Job)"
          - "Acting ServiceManager X-User-ID != Job.completed_by_user_id (segregation of duties)"
        side_effects:
          - "Freezes final_total_cents on the invoice"

      - from: INVOICED
        to: PAID
        trigger: "POST /jobs/{id}/pay"
        actor: ServiceManager
        preconditions:
          - "billing_status == INVOICED"
        side_effects: []

  # ---- PartReservation lifecycle ----
  - entity: PartReservation
    field: status
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /part-reservations/{id}/consume"
        actor: Technician
        preconditions:
          - "Parent Job.dispatch_status == ON_SITE"
        side_effects:
          - "Decrements Part.on_hand_qty by qty and Part.reserved_qty by qty; recomputes available_qty (consumed stock leaves both pools, conserving part_inventory_conservation)"

      - from: HELD
        to: RELEASED
        trigger: "system (parent Job cancelled) or POST /part-reservations/{id}/release"
        actor: "Dispatcher or system"
        preconditions:
          - "status == HELD"
        side_effects:
          - "Decrements Part.reserved_qty by qty; recomputes available_qty (compensating: part_inventory_conservation)"

  # ---- WarrantyPlan ----
  - entity: WarrantyPlan
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (parent Job CLOSED)"
        actor: system
        preconditions:
          - "Parent Job.dispatch_status == CLOSED (cross-entity: WarrantyPlan depends on Job)"
        side_effects:
          - "Increments Customer.active_warranty_count by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /warranty-plans/{id}/cancel"
        actor: ServiceManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Decrements Customer.active_warranty_count by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /warranty-plans/{id}/expire"
        actor: ServiceManager
        preconditions:
          - "status == ACTIVE"
          - "tune_ups_used >= tune_ups_included (boundary: plan exhausted)"
        side_effects:
          - "Decrements Customer.active_warranty_count by 1"

  # ---- FinancingApplication: branching ----
  - entity: FinancingApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [DECLINED, DEFAULTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{id}/approve"
        actor: ServiceManager
        preconditions:
          - "principal_cents <= 1500000 (approval ceiling $15,000)"
        side_effects:
          - "Computes monthly_payment_cents via financing_monthly_payment"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /financing-applications/{id}/decline"
        actor: ServiceManager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /financing-applications/{id}/activate"
        actor: ServiceManager
        preconditions:
          - "Parent Quote.status == ACCEPTED (cross-entity guard)"
        side_effects: []

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /financing-applications/{id}/default"
        actor: ServiceManager
        preconditions: []
        side_effects:
          - "Customer.financing_standing recomputes to BLOCKED"

  # ---- Callback: cyclic (reopen) ----
  - entity: Callback
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /callbacks/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Parent Job.dispatch_status IN {COMPLETED, CLOSED}"
        side_effects: []

      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /callbacks/{id}/arrive"
        actor: Technician
        preconditions: []
        side_effects: []

      - from: ON_SITE
        to: RESOLVED
        trigger: "POST /callbacks/{id}/resolve"
        actor: Technician
        preconditions: []
        side_effects:
          - "Sets fault_confirmed from request body"
          - "Recomputes the original Job technician's callback_rate_provisional and callback_rate_settled"

      - from: ON_SITE
        to: OPEN
        trigger: "POST /callbacks/{id}/reopen"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Cyclic: an unresolved on-site visit can be sent back to OPEN for re-triage"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /part-reservations"
    occ_field: "expected_job_version"
    description: |
      Adding a PartReservation against a Job whose version has advanced since
      the client last observed it is rejected. Each reservation create legitimately
      supersedes the prior inventory view of the job, so a client holding a stale
      job version must re-read before adding more parts.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: quote-revise-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /quotes/{id}/revise"
    occ_field: "expected_quote_version"
    description: |
      Revising a Quote whose version has advanced since the client last observed
      it is rejected. A revision legitimately supersedes the prior revision; a
      client carrying a stale quote version is rejected so it cannot overwrite a
      revision it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ----- dual_variant #1 (Quote domain) + combinatorial mode (b) rounding order -----
  - name: quote_estimate_total
    trigger: "Quote /send and /revise; also on QuoteLine create/delete while DRAFT/SENT"
    algorithm: aggregation
    formula: |
      # MODE (b): per-line rounding BEFORE summation. Pinned order:
      # 1. For each QuoteLine, compute raw_line:
      #      PART  : qty * unit_price_cents * (1 + Part.markup_pct)
      #      DOOR  : DoorModel.list_price_cents
      #      OPENER: OpenerModel.list_price_cents
      #      LABOR : qty(minutes) * LABOR_RATE_CENTS_PER_MIN
      # 2. line_total_cents = round_half_up(raw_line) to whole cents (PER LINE, FIRST).
      # 3. parts_and_goods = sum(line_total_cents over all lines).
      # 4. estimate_total_cents = parts_and_goods
      #        + (service_call_fee_cents if quote_type==SERVICE_CALL else 0).
      # Pinned: round each line first, THEN sum. Summing raw then rounding once is WRONG.
    input_set: "All QuoteLine rows of the quote, regardless of order; DOOR/OPENER lines only on INSTALL quotes."
    constants:
      LABOR_RATE_CENTS_PER_MIN: 250
    precision: "whole cents, round_half_up, applied per line before summation"
    variants:
      - name: estimate
        when: "Computed on the Quote at /send and /revise (forward-looking, catalog prices)."
        difference: "Uses QuoteLine snapshot unit_price_cents and catalog list prices; no emergency surcharge, no actual-consumption adjustment."

  - name: job_final_total
    trigger: "Job dispatch /complete"
    algorithm: chronological
    formula: |
      # FINAL variant — different entity domain (Job, not Quote).
      # Sums ACTUAL consumed parts and actual labor at completion, plus surcharge.
      # 1. consumed_parts = sum over PartReservation(status==CONSUMED) of
      #      qty * Part.unit_price_cents * (1 + Part.markup_pct), round_half_up PER reservation, then sum.
      # 2. labor_cents = Quote door/opener install_labor_minutes (INSTALL) OR
      #      Quote.service_call_fee_cents (SERVICE_CALL), times nothing further.
      #      For INSTALL: labor_cents = (DoorModel.install_labor_minutes
      #          + OpenerModel.install_labor_minutes if opener present) * LABOR_RATE_CENTS_PER_MIN.
      # 3. final_total_cents = consumed_parts + labor_cents + emergency_surcharge_cents.
    input_set: "Only PartReservation rows in status CONSUMED count toward consumed_parts; HELD/RELEASED excluded."
    constants:
      LABOR_RATE_CENTS_PER_MIN: 250
    precision: "whole cents, round_half_up per consumed reservation then sum"
    variants:
      - name: final
        when: "Computed once at /complete from actuals."
        difference: "Counts only CONSUMED parts and adds emergency_surcharge_cents — diverges from Quote.estimate_total_cents, which is forward-looking over all PART lines and carries no surcharge."

  # ----- combinatorial mode (a): non-linear formula >=3 inputs + tier + cap -----
  - name: job_emergency_surcharge
    trigger: "Job dispatch /complete (component of job_final_total)"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs with non-linear interaction (band selection + min/max cap).
      # Inputs: Job.is_emergency, scheduled_start (in Customer.time_zone), pre-surcharge base.
      # band = local hour-of-day of scheduled_start in the Customer's time_zone:
      #   BUSINESS    : 08:00:00 <= local_time <  18:00:00  -> rate = 0.00
      #   AFTER_HOURS : 18:00:00 <= local_time <  22:00:00  -> rate = 0.25
      #   OVERNIGHT   : local_time >= 22:00:00 OR local_time < 08:00:00 -> rate = 0.50
      # base = consumed_parts + labor_cents (from job_final_total steps 1-2).
      # raw = (is_emergency ? base * rate : 0).
      # emergency_surcharge_cents = clamp(round_half_up(raw), SURCHARGE_MIN_CENTS, SURCHARGE_MAX_CENTS)
      #   BUT the clamp applies only when raw > 0; if raw == 0 the surcharge is exactly 0 (cap floor does not lift a zero).
      # Boundary: local hour exactly 18:00:00 IS AFTER_HOURS (>=, not >).
    input_set: "scheduled_start converted to Customer.time_zone local wall-clock; base from job_final_total."
    constants:
      AFTER_HOURS_RATE: 0.25
      OVERNIGHT_RATE: 0.50
      SURCHARGE_MIN_CENTS: 5000
      SURCHARGE_MAX_CENTS: 40000
    precision: "round_half_up before clamp"

  # ----- dual_variant #2 (Technician domain) -----
  - name: technician_callback_rate
    trigger: "Job /complete; Callback /resolve"
    algorithm: aggregation
    formula: |
      denom = Technician.jobs_completed_count (Jobs in COMPLETED or CLOSED)
      # provisional numerator: callbacks NOT yet RESOLVED count as faults too
      prov_num = count(Callback where original Job.technician_id == tech.id AND
                       (status != RESOLVED OR (status==RESOLVED AND fault_confirmed==true)))
      # settled numerator: only RESOLVED callbacks with fault_confirmed==true
      settled_num = count(Callback where original Job.technician_id == tech.id AND
                          status==RESOLVED AND fault_confirmed==true)
      callback_rate_provisional = (denom == 0) ? 0 : round_half_up(prov_num / denom, 4)
      callback_rate_settled     = (denom == 0) ? 0 : round_half_up(settled_num / denom, 4)
    input_set: "Callbacks linked through Callback.job_id -> Job.technician_id; denom over that technician's completed jobs."
    constants: {}
    precision: "4 decimal places, round_half_up; denom==0 yields 0 (empty-set boundary)"
    variants:
      - name: provisional
        when: "Rolling estimate read at any time."
        difference: "Counts OPEN/SCHEDULED/ON_SITE callbacks as faults — pessimistic; diverges from settled when unresolved callbacks exist."
      - name: settled
        when: "Confirmed rate."
        difference: "Counts only RESOLVED + fault_confirmed callbacks — equals provisional only once every callback is resolved."

  - name: financing_monthly_payment
    trigger: "FinancingApplication /approve"
    algorithm: tiered_pricing
    formula: |
      # APR tiered by term, simple amortization rounded to whole cents.
      apr = (term_months <= 6) ? 0.00 : (term_months <= 12) ? 0.099 : 0.149
      monthly_rate = apr / 12
      if monthly_rate == 0:
        monthly_payment_cents = ceil(principal_cents / term_months)
      else:
        f = (1 + monthly_rate) ** term_months
        monthly_payment_cents = round_half_up(principal_cents * monthly_rate * f / (f - 1))
    input_set: "principal_cents and term_months on the application."
    constants:
      APR_TIER_0_6: 0.00
      APR_TIER_7_12: 0.099
      APR_TIER_13_24: 0.149
    precision: "whole cents, round_half_up (ceil for the 0% tier)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All referenced resources (path ids and body FKs) exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Required body fields present and well-typed; enum values in declared set; qty >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/transition endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "SENT quote past expires_at is treated as EXPIRED; accept/decline/revise rejected"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{id}/accept, /decline, /revise"

  - priority: 7
    category: business_safety
    check: "Job cannot be COMPLETED unless safety_inspection_passed == true"
    error_id: ERR_SAFETY_NOT_PASSED
    http_status: 409
    applies_to: "POST /jobs/{id}/complete"

  - priority: 8
    category: business_referential
    check: "Job cannot be COMPLETED while any PartReservation is still HELD (must be CONSUMED)"
    error_id: ERR_PARTS_NOT_CONSUMED
    http_status: 409
    applies_to: "POST /jobs/{id}/complete"

  - priority: 9
    category: business_constraint
    check: "Dispatcher cannot schedule a job to a technician not AVAILABLE, or INSTALL job to a non-install-certified technician"
    error_id: ERR_TECH_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /jobs/{id}/schedule"

  - priority: 10
    category: business_temporal
    check: "Scheduled window must not overlap the technician's other non-CANCELLED jobs including the 30-minute travel buffer (half-open)"
    error_id: ERR_TECH_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /jobs/{id}/schedule"

  - priority: 11
    category: business_temporal
    check: "If the job requires a lift, the number of EquipmentUnit bookings overlapping the window (closed intervals) must be below concurrent_capacity"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /jobs/{id}/schedule"

  - priority: 12
    category: business_constraint
    check: "PartReservation create qty must not exceed Part.available_qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /part-reservations, POST /quotes/{id}/accept"

  - priority: 13
    category: business_constraint
    check: "A Customer whose financing_standing == BLOCKED cannot accept a quote"
    error_id: ERR_CUSTOMER_BLOCKED
    http_status: 409
    applies_to: "POST /quotes/{id}/accept"

  - priority: 14
    category: business_constraint
    check: "Tune-up redemption rejected when tune_ups_used >= tune_ups_included"
    error_id: ERR_TUNEUPS_EXHAUSTED
    http_status: 409
    applies_to: "POST /warranty-plans/{id}/tune-up"

  - priority: 15
    category: business_constraint
    check: "FinancingApplication principal above the $15,000 ceiling cannot be approved"
    error_id: ERR_FINANCING_CEILING
    http_status: 409
    applies_to: "POST /financing-applications/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "The ServiceManager who invoices a job must not be the technician who completed it (segregation of duties)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /jobs/{id}/invoice"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_<parent>_version must match current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /part-reservations, POST /quotes/{id}/revise"

  - priority: 18
    category: business_constraint
    check: "Uniqueness: Customer.email, Part.sku, DoorModel.sku, OpenerModel.sku unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /customers, /parts, /door-models, /opener-models"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ----- Catalog / configuration -----
  - { method: POST, path: "/door-models", description: "Create door catalog model", roles: [ServiceManager], code: 201,
      input: [sku, name, width_in, height_in, list_price_cents, install_labor_minutes, "requires_lift?"], output: DoorModel, side_effects: [] }
  - { method: GET, path: "/door-models/{id}", description: "Get door model", roles: [ServiceManager, Customer, Dispatcher, Technician], code: 200, input: [], output: DoorModel, side_effects: [] }

  - { method: POST, path: "/opener-models", description: "Create opener catalog model", roles: [ServiceManager], code: 201,
      input: [sku, name, horsepower, list_price_cents, install_labor_minutes], output: OpenerModel, side_effects: [] }
  - { method: GET, path: "/opener-models/{id}", description: "Get opener model", roles: [ServiceManager, Customer, Dispatcher, Technician], code: 200, input: [], output: OpenerModel, side_effects: [] }

  - { method: POST, path: "/parts", description: "Create part / stock item", roles: [ServiceManager], code: 201,
      input: [sku, category, unit_price_cents, "markup_pct?", on_hand_qty], output: Part, side_effects: ["reserved_qty=0, available_qty=on_hand_qty"] }
  - { method: GET, path: "/parts/{id}", description: "Get part incl. inventory pools", roles: [ServiceManager, Customer, Dispatcher, Technician], code: 200, input: [], output: Part, side_effects: [] }

  - { method: POST, path: "/equipment-units", description: "Create lift/crane unit", roles: [ServiceManager], code: 201,
      input: [name, "concurrent_capacity?"], output: EquipmentUnit, side_effects: [] }

  # ----- Customers -----
  - { method: POST, path: "/customers", description: "Register a customer", roles: [ServiceManager], code: 201,
      input: [full_name, email, service_address, "time_zone?"], output: Customer, side_effects: ["financing_standing=GOOD, active_warranty_count=0"] }
  - { method: GET, path: "/customers/{id}", description: "Get customer", roles: [ServiceManager, Customer, Dispatcher], code: 200, input: [], output: Customer, side_effects: [] }

  # ----- Technicians -----
  - { method: POST, path: "/technicians", description: "Create a technician", roles: [ServiceManager], code: 201,
      input: [display_name, skill_level, "certified_for_install?"], output: Technician, side_effects: ["status=AVAILABLE, booked_minutes=0, callback rates=0"] }
  - { method: GET, path: "/technicians/{id}", description: "Get technician incl. computed rates", roles: [ServiceManager, Dispatcher, Technician], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: POST, path: "/technicians/{id}/set-leave", description: "Toggle technician status AVAILABLE<->ON_LEAVE", roles: [ServiceManager], code: 200,
      input: [status], output: Technician, side_effects: ["sets status"] }

  # ----- Quotes -----
  - { method: POST, path: "/quotes", description: "Create a DRAFT quote", roles: [ServiceManager], code: 201,
      input: [customer_id, quote_type, "door_model_id?", "opener_model_id?", "service_call_fee_cents?"], output: Quote, side_effects: ["status=DRAFT, revision=1"] }
  - { method: GET, path: "/quotes/{id}", description: "Get quote (lazily flips to EXPIRED if past expires_at)", roles: [ServiceManager, Customer], code: 200, input: [], output: Quote, side_effects: ["may set status=EXPIRED"] }
  - { method: GET, path: "/quotes", description: "List quotes; filtered-list reverse-reachability for customer_id / door_model_id / opener_model_id", roles: [ServiceManager, Customer], code: 200, input: ["customer_id?", "door_model_id?", "opener_model_id?", "status?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }
  - { method: POST, path: "/quotes/{id}/lines", description: "Add a quote line", roles: [ServiceManager], code: 201,
      input: [item_kind, "item_ref_id?", qty, "unit_price_cents?"], output: QuoteLine, side_effects: ["recomputes line_total_cents; recomputes Quote.estimate_total_cents when SENT", "increments Quote.version"] }
  - { method: GET, path: "/quotes/{id}/lines", description: "List a quote's lines (FK reverse-reachability for QuoteLine.quote_id)", roles: [ServiceManager, Customer], code: 200, input: [], output: "QuoteLine[]", side_effects: [] }
  - { method: POST, path: "/quotes/{id}/send", description: "Send quote to customer", roles: [ServiceManager], code: 200,
      input: [], output: Quote, side_effects: ["DRAFT->SENT", "sets expires_at", "recomputes estimate_total_cents", "increments Quote.version"] }
  - { method: POST, path: "/quotes/{id}/revise", description: "Revise a SENT quote (cyclic; OCC-guarded)", roles: [ServiceManager], code: 200,
      input: [expected_quote_version], output: Quote, side_effects: ["SENT->SENT", "increments revision", "resets expires_at", "recomputes estimate_total_cents", "increments Quote.version"] }
  - { method: POST, path: "/quotes/{id}/accept", description: "Customer accepts; spawns Job + reservations", roles: [Customer], code: 200,
      input: [], output: Quote, side_effects: ["SENT->ACCEPTED", "creates Job(UNSCHEDULED/PENDING)", "creates HELD PartReservations per PART line", "increments Part.reserved_qty", "increments Quote.version"] }
  - { method: POST, path: "/quotes/{id}/decline", description: "Customer declines", roles: [Customer], code: 200,
      input: [], output: Quote, side_effects: ["SENT->DECLINED"] }

  # ----- Jobs -----
  - { method: GET, path: "/jobs/{id}", description: "Get job (both status dimensions + computed totals)", roles: [ServiceManager, Dispatcher, Technician, Customer], code: 200, input: [], output: Job, side_effects: [] }
  - { method: GET, path: "/jobs", description: "List jobs; filtered-list reverse-reachability for Job.quote_id / customer_id / technician_id / equipment_unit_id",
      roles: [ServiceManager, Dispatcher, Technician], code: 200, input: ["quote_id?", "customer_id?", "technician_id?", "equipment_unit_id?", "dispatch_status?", "limit?", "offset?"], output: "Job[]", side_effects: [] }
  - { method: POST, path: "/jobs/{id}/schedule", description: "Dispatch: assign technician + window (+ equipment if lift)", roles: [Dispatcher], code: 200,
      input: [technician_id, scheduled_start, scheduled_end, "equipment_unit_id?", "is_emergency?"], output: Job, side_effects: ["UNSCHEDULED->SCHEDULED", "assigns technician_id/equipment_unit_id", "increments Technician.booked_minutes"] }
  - { method: POST, path: "/jobs/{id}/depart", description: "Technician en route", roles: [Technician], code: 200, input: [], output: Job, side_effects: ["SCHEDULED->EN_ROUTE"] }
  - { method: POST, path: "/jobs/{id}/arrive", description: "Technician on site", roles: [Technician], code: 200, input: [], output: Job, side_effects: ["EN_ROUTE->ON_SITE"] }
  - { method: POST, path: "/jobs/{id}/safety-check", description: "Record passing safety inspection", roles: [Technician], code: 200, input: [], output: Job, side_effects: ["sets safety_inspection_passed=true"] }
  - { method: POST, path: "/jobs/{id}/complete", description: "Complete job; compute final total", roles: [Technician], code: 200, input: [], output: Job, side_effects: ["ON_SITE->COMPLETED", "computes final_total_cents + emergency_surcharge_cents", "increments Technician.jobs_completed_count", "recomputes technician callback rates"] }
  - { method: POST, path: "/jobs/{id}/invoice", description: "Invoice (segregation: invoicer X-User-ID must differ from Job.completed_by_user_id)", roles: [ServiceManager], code: 200, input: [], output: Job, side_effects: ["billing PENDING->INVOICED"] }
  - { method: POST, path: "/jobs/{id}/pay", description: "Record payment", roles: [ServiceManager], code: 200, input: [], output: Job, side_effects: ["billing INVOICED->PAID"] }
  - { method: POST, path: "/jobs/{id}/close", description: "Close completed+paid job; activates warranty", roles: [ServiceManager], code: 200, input: [], output: Job, side_effects: ["COMPLETED->CLOSED", "activates PENDING WarrantyPlan -> ACTIVE", "increments Customer.active_warranty_count"] }
  - { method: POST, path: "/jobs/{id}/cancel", description: "Cancel pre-on-site job; releases holds + frees minutes", roles: [Dispatcher], code: 200, input: [], output: Job, side_effects: ["dispatch->CANCELLED", "HELD reservations->RELEASED", "decrements Part.reserved_qty", "decrements Technician.booked_minutes"] }

  # ----- Part reservations -----
  - { method: POST, path: "/part-reservations", description: "Manually reserve more parts for a job (OCC on job version)", roles: [Dispatcher, ServiceManager], code: 201,
      input: [job_id, part_id, qty, expected_job_version], output: PartReservation, side_effects: ["status=HELD", "increments Part.reserved_qty", "recomputes Part.available_qty", "increments Job.version"] }
  - { method: GET, path: "/part-reservations", description: "List reservations; filtered-list reverse-reachability for job_id / part_id",
      roles: [ServiceManager, Dispatcher, Technician], code: 200, input: ["job_id?", "part_id?", "status?", "limit?", "offset?"], output: "PartReservation[]", side_effects: [] }
  - { method: GET, path: "/part-reservations/{id}", description: "Get a single part reservation", roles: [ServiceManager, Dispatcher, Technician], code: 200, input: [], output: PartReservation, side_effects: [] }
  - { method: POST, path: "/part-reservations/{id}/consume", description: "Consume a held reservation on site", roles: [Technician], code: 200, input: [], output: PartReservation, side_effects: ["HELD->CONSUMED", "decrements Part.on_hand_qty + reserved_qty"] }
  - { method: POST, path: "/part-reservations/{id}/release", description: "Release a held reservation", roles: [Dispatcher, ServiceManager], code: 200, input: [], output: PartReservation, side_effects: ["HELD->RELEASED", "decrements Part.reserved_qty"] }

  # ----- Warranty plans -----
  - { method: POST, path: "/warranty-plans", description: "Create a PENDING warranty plan tied to a job", roles: [ServiceManager], code: 201,
      input: [job_id, customer_id, "tune_ups_included?"], output: WarrantyPlan, side_effects: ["status=PENDING, tune_ups_used=0"] }
  - { method: GET, path: "/warranty-plans/{id}", description: "Get warranty plan", roles: [ServiceManager, Customer], code: 200, input: [], output: WarrantyPlan, side_effects: [] }
  - { method: GET, path: "/warranty-plans", description: "List warranty plans; filtered-list reverse-reachability for job_id / customer_id",
      roles: [ServiceManager, Customer], code: 200, input: ["job_id?", "customer_id?", "status?", "limit?", "offset?"], output: "WarrantyPlan[]", side_effects: [] }
  - { method: POST, path: "/warranty-plans/{id}/tune-up", description: "Redeem a tune-up visit", roles: [ServiceManager, Customer], code: 200, input: [], output: WarrantyPlan, side_effects: ["increments tune_ups_used when below limit"] }
  - { method: POST, path: "/warranty-plans/{id}/cancel", description: "Cancel an active plan", roles: [ServiceManager], code: 200, input: [], output: WarrantyPlan, side_effects: ["ACTIVE->CANCELLED", "decrements Customer.active_warranty_count"] }
  - { method: POST, path: "/warranty-plans/{id}/expire", description: "Expire an exhausted plan", roles: [ServiceManager], code: 200, input: [], output: WarrantyPlan, side_effects: ["ACTIVE->EXPIRED", "decrements Customer.active_warranty_count"] }

  # ----- Financing -----
  - { method: POST, path: "/financing-applications", description: "Submit a financing application against a quote", roles: [Customer, ServiceManager], code: 201,
      input: [customer_id, quote_id, principal_cents, term_months], output: FinancingApplication, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/financing-applications/{id}", description: "Get financing application", roles: [ServiceManager, Customer], code: 200, input: [], output: FinancingApplication, side_effects: [] }
  - { method: GET, path: "/financing-applications", description: "List applications; filtered-list reverse-reachability for customer_id / quote_id",
      roles: [ServiceManager, Customer], code: 200, input: ["customer_id?", "quote_id?", "status?", "limit?", "offset?"], output: "FinancingApplication[]", side_effects: [] }
  - { method: POST, path: "/financing-applications/{id}/approve", description: "Approve (computes monthly payment)", roles: [ServiceManager], code: 200, input: [], output: FinancingApplication, side_effects: ["SUBMITTED->APPROVED", "computes monthly_payment_cents"] }
  - { method: POST, path: "/financing-applications/{id}/decline", description: "Decline an application", roles: [ServiceManager], code: 200, input: [], output: FinancingApplication, side_effects: ["SUBMITTED->DECLINED"] }
  - { method: POST, path: "/financing-applications/{id}/activate", description: "Activate an approved application", roles: [ServiceManager], code: 200, input: [], output: FinancingApplication, side_effects: ["APPROVED->ACTIVE"] }
  - { method: POST, path: "/financing-applications/{id}/default", description: "Mark defaulted; blocks customer", roles: [ServiceManager], code: 200, input: [], output: FinancingApplication, side_effects: ["ACTIVE->DEFAULTED", "Customer.financing_standing->BLOCKED"] }

  # ----- Callbacks -----
  - { method: POST, path: "/callbacks", description: "Open a callback on a completed/closed job", roles: [Customer, ServiceManager], code: 201,
      input: [job_id, reason], output: Callback, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/callbacks/{id}", description: "Get callback", roles: [ServiceManager, Dispatcher, Technician, Customer], code: 200, input: [], output: Callback, side_effects: [] }
  - { method: GET, path: "/callbacks", description: "List callbacks; filtered-list reverse-reachability for job_id",
      roles: [ServiceManager, Dispatcher, Technician], code: 200, input: ["job_id?", "status?", "limit?", "offset?"], output: "Callback[]", side_effects: [] }
  - { method: POST, path: "/callbacks/{id}/schedule", description: "Schedule a callback visit", roles: [Dispatcher], code: 200, input: [], output: Callback, side_effects: ["OPEN->SCHEDULED"] }
  - { method: POST, path: "/callbacks/{id}/arrive", description: "Technician arrives for callback", roles: [Technician], code: 200, input: [], output: Callback, side_effects: ["SCHEDULED->ON_SITE"] }
  - { method: POST, path: "/callbacks/{id}/resolve", description: "Resolve callback; sets fault + rescore tech", roles: [Technician], code: 200, input: [fault_confirmed], output: Callback, side_effects: ["ON_SITE->RESOLVED", "recomputes technician callback rates"] }
  - { method: POST, path: "/callbacks/{id}/reopen", description: "Reopen an on-site callback (cyclic)", roles: [Dispatcher], code: 200, input: [], output: Callback, side_effects: ["ON_SITE->OPEN"] }

  # ----- Test-driving clock endpoint -----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's notion of current UTC time (test harness)", roles: [ServiceManager], code: 200,
      input: [to_iso8601], output: null, side_effects: ["server clock advanced; SENT quotes past expires_at lazily expire on next read"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for the operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced path id or body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed body field, bad enum value, or qty < 1" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique field collision (Customer.email, *.sku)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition attempted from a state where it is not allowed" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept/decline/revise on a quote past expires_at" }
  - { id: ERR_SAFETY_NOT_PASSED, http: 409, condition: "Job /complete before safety_inspection_passed is true" }
  - { id: ERR_PARTS_NOT_CONSUMED, http: 409, condition: "Job /complete while any PartReservation is still HELD" }
  - { id: ERR_TECH_NOT_ELIGIBLE, http: 409, condition: "Schedule to ON_LEAVE technician, or INSTALL job to non-install-certified technician" }
  - { id: ERR_TECH_SCHEDULE_CONFLICT, http: 409, condition: "Window overlaps technician's other non-CANCELLED jobs incl. 30-min travel buffer" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "EquipmentUnit overlapping bookings reach concurrent_capacity, or lift required but no unit supplied" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Reservation qty exceeds Part.available_qty" }
  - { id: ERR_CUSTOMER_BLOCKED, http: 409, condition: "Quote accept by a customer whose financing_standing is BLOCKED" }
  - { id: ERR_TUNEUPS_EXHAUSTED, http: 409, condition: "Tune-up redemption when tune_ups_used >= tune_ups_included" }
  - { id: ERR_FINANCING_CEILING, http: 409, condition: "Approve a financing application above the $15,000 principal ceiling" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 409, condition: "Invoicing ServiceManager is the technician who completed the job" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer; requests/accepts quotes, applies for financing, opens callbacks, redeems tune-ups."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /quotes/{id}/decline"
    shared_operations:
      - "POST /financing-applications (with ServiceManager)"
      - "POST /callbacks (with ServiceManager)"
      - "POST /warranty-plans/{id}/tune-up (with ServiceManager)"
      - "GET reads on own quotes, jobs, warranty plans, financing, door/opener models"

  - name: Dispatcher
    description: "Schedules jobs, assigns technicians and equipment, manages callbacks queue. Cannot run on-site transitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /jobs/{id}/schedule"
      - "POST /jobs/{id}/cancel"
      - "POST /callbacks/{id}/schedule"
      - "POST /callbacks/{id}/reopen"
    shared_operations:
      - "POST /part-reservations (with ServiceManager)"
      - "POST /part-reservations/{id}/release (with ServiceManager)"
      - "GET reads on jobs, parts, technicians, callbacks, equipment"

  - name: Technician
    description: "Executes on-site job lifecycle and callback visits; consumes parts; records safety check and completion."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /jobs/{id}/depart"
      - "POST /jobs/{id}/arrive"
      - "POST /jobs/{id}/safety-check"
      - "POST /jobs/{id}/complete"
      - "POST /part-reservations/{id}/consume"
      - "POST /callbacks/{id}/arrive"
      - "POST /callbacks/{id}/resolve"
    shared_operations:
      - "GET reads on assigned jobs, reservations, callbacks, parts, technicians"

  - name: ServiceManager
    description: "Back-office operator; owns catalog/inventory, quotes, billing, warranty, financing decisions. Cannot perform Customer accept/decline nor Technician on-site transitions; cannot invoice a job they completed (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /door-models, /opener-models, /parts, /equipment-units, /customers, /technicians"
      - "POST /technicians/{id}/set-leave"
      - "POST /quotes, /quotes/{id}/lines, /quotes/{id}/send, /quotes/{id}/revise"
      - "POST /jobs/{id}/invoice, /pay, /close"
      - "POST /warranty-plans, /warranty-plans/{id}/cancel, /warranty-plans/{id}/expire"
      - "POST /financing-applications/{id}/approve, /decline, /activate, /default"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /financing-applications (with Customer)"
      - "POST /callbacks (with Customer)"
      - "POST /warranty-plans/{id}/tune-up (with Customer)"
      - "POST /part-reservations, /part-reservations/{id}/release (with Dispatcher)"
      - "GET reads across resources"
