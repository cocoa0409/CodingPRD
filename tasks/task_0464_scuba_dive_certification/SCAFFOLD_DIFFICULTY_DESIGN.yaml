          trigger:
            - call: "POST /trip-bookings"
              payload: { trip_id: "${trip_id}", diver_id: "${diver_id}", tanks: 0, party_size: 1, expected_trip_version: "${trip_v}" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_WAIVER_REQUIRED"
            - "response.http_status == 422"

