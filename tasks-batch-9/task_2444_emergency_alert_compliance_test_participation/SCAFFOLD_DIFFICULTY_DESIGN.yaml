            - "Plan KS 2026-R1 requiring only PEP, activated; station KWEA."
            - "Three devices: dev1 and dev2 will fail, dev3 carries the ACTIVE PEP assignment so missing_source_count stays 0 and d1 is 0."
            - "Clock 2026-08-03T08:00:00Z; both outages are filed with detected_at exactly at the obligation-window open 08:00Z and both are put into REPAIR_IN_PROGRESS."
            - "Neither outage touches dev3, so its assignment is never suspended."
