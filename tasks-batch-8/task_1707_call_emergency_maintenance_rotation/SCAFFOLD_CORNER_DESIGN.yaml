            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/complete", as: PropertyAdmin, captures: { p1: $.data.provisional_shift_pay_cents } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-02T00:00:00Z", end_at: "2026-08-02T18:20:00Z" }, as: PropertyAdmin, captures: { s2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s2}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T18:30:00Z" }, as: PropertyAdmin }
