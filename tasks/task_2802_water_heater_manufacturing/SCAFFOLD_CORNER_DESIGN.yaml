      - name: lining_inspections_sub_resource_ordering_and_filters
        claim_type: standard_crud
        grounds:
          - endpoints[GET /mfg/tank-lots/{id}/lining-inspections]
          - entities.LiningInspection.fields.record_status
          - entities.LiningInspection
          - calculations.lot_holiday_density
          - validations[priority 3]
          - errors[ERR_TANK_LOT_NOT_FOUND]
        distinguishing_aspect: >
          The sub-resource is the ONLY discovery channel for superseded records, so it must return history rather
          than just the current pair: three rows in created_at ASC order, with the first ADHESION record SUPERSEDED
          by the second. Filter and pagination compose (type + status + limit/offset over the same ordering), and
          the rows themselves are immutable - no version field, and holidays_per_tank is null on ADHESION records
          and computed only for HOLIDAY.
        test_recipe:
          setup:
            - "TankLot TL-001 is LINING_VERIFIED after three inspection filings."
            - "Filing order was ADHESION class 1 (sample 6), then ADHESION class 2 (sample 8), then HOLIDAY 3 holidays over sample 6."
            - "The second ADHESION filing superseded the first; class 2 is still a PASS because MAX_ADHESION_CLASS is 2."
            - "The clock is 2026-08-01T00:00:00Z throughout, so created_at ties are broken by insertion order."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
