          assert:
            - "the SuperUser call is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (undeclared role)"
            - "the ImmigrationJudge call with an unallocated judge id is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (entity-backed identity cannot resolve)"

      - name: hearing_clock_position_rejections
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_HEARING_IN_PAST
          - errors.ERR_HEARING_NOT_YET_DUE
        distinguishing_aspect: "The clock gates both directions: a hearing cannot be created in the past, and it cannot be completed before its start — same metric (clock vs scheduled_start) on two endpoints."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Docketed case. Clock moved to 2026-09-02T00:00:00Z so that a 2026-09-01 hearing start is in the past and a 2026-09-03 start is still in the future."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-01T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err1: $.data.error_id }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_fut: $.data.id }
            - call: "POST /eoir/hearings/${h_fut}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "the past-dated creation fails with 409 ERR_HEARING_IN_PAST (start 2026-09-01T10:00 < clock 2026-09-02T00:00)"
            - "the future hearing is created with 201"
            - "completing it at clock 2026-09-02T00:00 (before its 2026-09-03T10:00 start) fails with 409 ERR_HEARING_NOT_YET_DUE"

      - name: no_show_guard_family
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_NOTICE_NOT_SERVED
          - errors.ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW
          - errors.ERR_NOTICE_ALREADY_RECORDED
        distinguishing_aspect: "Three independent guards on the no-show path fire in one scenario: missing notice (safety), then once notice exists a PENDING continuance (constraint), plus the one-notice-per-hearing uniqueness rule."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Docketed case with master hearing 2026-09-05T10:00 and a PENDING EVIDENCE_GATHERING continuance filed early (lead time satisfied). Clock moved to 2026-09-05T11:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_hearing_ns
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h_n}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont_id: $.data.id }
            - *c_clock_ns
          trigger:
            - call: "POST /eoir/hearings/${h_n}/record-no-show"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err1: $.data.error_id }
            - *c_notice
            - call: "POST /eoir/hearings/${h_n}/record-no-show"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /eoir/notices"
              payload: { hearing_id: "${h_n}", service_method: "PERSONAL_SERVICE", served_at: "2026-08-21T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err3: $.data.error_id }
          assert:
            - "first no-show fails 409 ERR_NOTICE_NOT_SERVED (no notice recorded yet)"
            - "after the SERVED notice is recorded, the second no-show fails 409 ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW (safety passes; the pending-continuance constraint blocks)"
            - "a second notice for the same hearing fails 409 ERR_NOTICE_ALREADY_RECORDED (one notice per hearing)"
            - "Hearing.${h_n}.status remains SCHEDULED throughout — rejected no-shows fire no cascade"

      - name: assign_judge_guard_family
        claim_type: Violation → Error
        grounds:
          - state_machines.Case.FILED_to_CALENDAR
          - errors.ERR_JUDGE_WRONG_COURT
          - errors.ERR_JUDGE_CASELOAD_FULL
          - errors.ERR_CASE_NOT_AWAITING_DOCKET
        distinguishing_aspect: "Docketing has three distinct rejections: a judge at the wrong court (referential), a judge at caseload cap (constraint, strict <), and a case no longer FILED (state)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Courts A and B; judge A at court A with max_pending_cases 1; judge B at court B. Two cases filed at court A."
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-JB", name: "Judge B Court", city: "Reno", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Tiny", max_pending_cases: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_a: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_b}", full_name: "Judge Far", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_b: $.data.id }
            - *c_case_eng
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "E-2", respondent_full_name: "R Two", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case2: $.data.id }
          trigger:
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_b}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
