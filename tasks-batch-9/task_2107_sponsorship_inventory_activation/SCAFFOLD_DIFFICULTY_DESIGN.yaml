  - rule_id: compensating_invariant
    instances:
      - name: booking_then_cancel_conserves_asset_reserved_units
        grounds:
          - state_machines.AssetBooking.SCHEDULED_to_CANCELLED
          - entities.InventoryAsset.fields.reserved_units_total
          - endpoints[POST /asset-bookings]
          - endpoints[POST /asset-bookings/{id}/cancel]
        distinguishing_aspect: |
          Conserved quantity is inventory units — the invariant
          InventoryAsset.reserved_units_total == sum(units_booked over its SCHEDULED bookings)
          must hold before, between and after the pair, so the value returns to exactly 0 after the
          cancel even though InventoryAsset.version has advanced twice.
        test_recipe:
          setup:
            - "Property IN_SEASON, contract ACTIVE with one entitlement of 10 DIGITAL_BOARD units"
            - "Asset 'North LED Ribbon' with capacity_units 6 and reserved_units_total 0"
