            - { call: "POST /shipping-waves/${tc1_wv}/manifest", as: WarehouseOps }
            - { call: "POST /shipping-waves/${tc1_wv}/tender", as: WarehouseOps }
            - { call: "POST /shipments/${tc1_sh1}/scan", payload: { scan_type: "DELIVERED" }, as: WarehouseOps }
            - call: "GET /components/${tc1_cp}"
              as: WarehouseOps
              captures: { tc1_pre_onhand: $.data.on_hand_units, tc1_pre_stock: $.data.stock_status }
            - call: "POST /return-cases"
              payload: { shipment_id: "${tc1_sh1}", reason: "DAMAGED", requested_resolution: "REPLACE" }
              as: CustomerService
              captures: { tc1_rc: $.data.id }
            - { call: "POST /return-cases/${tc1_rc}/approve", as: CustomerService }
            - { call: "POST /return-cases/${tc1_rc}/receive", as: WarehouseOps }
