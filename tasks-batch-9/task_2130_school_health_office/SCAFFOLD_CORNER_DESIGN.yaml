      - name: coverage_posture_uncovered_when_only_an_undelegated_aide_covers
        claim_type: input_set_filtering
        grounds:
          - calculations.school_nurse_coverage_ratio
          - calculations.school_coverage_posture
          - entities.Nurse.fields.delegation_authorized
          - endpoints[PATCH /health-office/nurses/{id}]
        distinguishing_aspect: "credential_weight for an undelegated HEALTH_AIDE is 0.00, so 480 contracted minutes deliver 0 weighted minutes: the DELIVERED ratio is null and coverage_posture is UNCOVERED even though contracted_students_per_nurse_fte reads 4.38. Flipping delegation_authorized to true via PATCH raises delivered minutes to 144.0 and the ratio to 14.58."
        test_recipe:
          setup:
            - "School ROWAN46 with exactly one ENROLLED student and no stock lots."
            - "The building's only coverage comes from a HEALTH_AIDE with delegation_authorized false on an ACTIVE Monday block of 480 minutes."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Rowan Elementary", building_code: "ROW46", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rae Osei", credential: "HEALTH_AIDE", weekly_contracted_minutes: 1200, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { aide_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${aide_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Rory Ives", grade_level: 1, date_of_birth: "2019-09-09T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { posture_undelegated: $.data.coverage_posture, delivered_undelegated: $.data.delivered_weekly_minutes }
            - call: "PATCH /health-office/nurses/${aide_id}"
              payload: { delegation_authorized: true }
              as: DistrictHealthAdmin
              captures: { deleg_after: $.data.delegation_authorized }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { posture_delegated: $.data.coverage_posture, delivered_delegated: $.data.delivered_weekly_minutes }
          assert:
            - "Undelegated: School.${sch_id}.contracted_weekly_minutes == 480"
            - "Undelegated: School.${sch_id}.contracted_students_per_nurse_fte == 4.38"
            - "Undelegated: School.${sch_id}.delivered_weekly_minutes == 0.0"
            - "Undelegated: School.${sch_id}.delivered_students_per_nurse_fte == null"
            - "Undelegated: School.${sch_id}.coverage_posture == UNCOVERED"
            - "Delegated: School.${sch_id}.delivered_weekly_minutes == 144.0"
            - "Delegated: School.${sch_id}.delivered_students_per_nurse_fte == 14.58"
            - "Delegated: School.${sch_id}.coverage_posture == LIMITED (base FULL, downgraded by stock_protocol_status DEPLETED)"
            - "Delegated: School.${sch_id}.contracted_students_per_nurse_fte == 4.38 (the CONTRACTED variant never reads credential)"

      - name: disclosure_partial_redaction_withholds_mental_health_and_controlled_rows
