              captures: { inv_ps: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_ps}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { psv1: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_ps}", code: "SUMMERGA", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-08-10T00:00:00Z", max_redemptions: 20, expected_sailing_version: "${psv1}" }
              as: RevenueManager
              captures: { promo_ps: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cy Dara", email: "cy@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g3: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Di Eno", email: "di@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g4: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ed Fane", email: "ed@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g5: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Fi Gold", email: "fi@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g6: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", guest_id: "${g1}", occupancy_adults: 2 }
              as: ReservationAgent
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", guest_id: "${g2}", occupancy_adults: 2 }
              as: ReservationAgent
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", guest_id: "${g3}", occupancy_adults: 2 }
              as: ReservationAgent
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", guest_id: "${g4}", occupancy_adults: 2 }
              as: ReservationAgent
          trigger:
            - call: "POST /promotions/${promo_ps}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", guest_id: "${g5}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk5: $.data.id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 1, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e1: $.data.error_id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", guest_id: "${g6}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk6: $.data.id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_ps}", cabin_category_id: "${cat_ia}", agency_name: "Harbour Tours", cabins_held: 1, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e2: $.data.error_id }
          assert:
            - "at 8 berths sold Sailing.${sail_ps}.occupancy_pct == 80.00 and inventory_posture == OPEN, so activating SUMMERGA returns HTTP 200 with status ACTIVE"
            - "the single-adult booking ${bk5} is accepted at 80.00 and takes lower_berths_sold to 9, occupancy_pct to 90.00 and inventory_posture to RESTRICTED - the floor is inclusive"
            - "Booking.${bk5}.lower_berth_subtotal_cents == 87500 (round_half_up(50000 * 1.75)) with berth_discount_pct == 0.00 and deposit_due_cents == 25000 (the 25000 per-guest floor beats 17500)"
            - "the first group hold returns HTTP 422 with data.error_id == ERR_POSTURE_RESTRICTED although available_cabins is 5 - the gate is occupancy, not cabins"
            - "the second single-adult booking ${bk6} is still accepted while RESTRICTED, proving the band blocks holds and activations but not sales"
            - "after ${bk6} Sailing.${sail_ps}.lower_berths_sold == 10, occupancy_pct == 100.00 and inventory_posture == FROZEN"
            - "the second group hold returns HTTP 422 with the same data.error_id == ERR_POSTURE_RESTRICTED - one code serves both restricted bands for group creation"
            - "SailingInventory.${inv_ps}.booked_cabins == 6, group_held_cabins == 0, available_cabins == 4 and waitlisted_bookings_count == 0"
            - "Sailing.${sail_ps}.gross_ticket_revenue_cents == 575000 (4 * 100000 + 2 * 87500) and projected_onboard_revenue_cents == 360000 (4 * 72000 + 2 * 36000)"
            - "Sailing.${sail_ps}.available_lower_berth_days_gross == 40, available_lower_berth_days_net == 40, ralbd_gross_cents == 23375, ralbd_net_cents == 23375 and revenue_alert == false"
            - "Sailing.${sail_ps}.confirmed_bookings_count == 0 and final_payment_risk_flag == false"

      - name: an_itinerary_publication_reaches_every_downstream_aggregate
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.ItineraryChange[DRAFT -> PUBLISHED]
          - calculations.itinerary_compensation
        excluded_because:
          difficulty_instance: itinerary_publish_cascades_to_sailing_revenue_alert
          rationale: |
            That §1.8 instance already walks the whole chain - publish writes per-booking
            compensation and refund figures, those roll into Sailing.compensation_liability_cents,
            which lowers total_revenue_cents and flips revenue_alert - and it also asserts that a
            second publish is refused so the cascade is not applied twice. Restating it here would
            add no ordering or partial-failure aspect it does not already pin down.

      - name: the_two_cancellation_variants_are_both_exercised
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.cancellation_settlement
        excluded_because:
          difficulty_instance: cancellation_penalty_provisional_quote_versus_final_settlement
          rationale: |
            That §1.8 instance quotes the PROVISIONAL variant at cancel time, moves the clock into a
            harsher penalty band, settles with the FINAL variant, and asserts the delta between the
            two figures along with the cash that is retained - the exact claim this row would make,
            including the switch-over reconciliation.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /bookings]
          - endpoints[POST /bookings/{id}/cancel]
          - calculations.sailing_ralbd
          - calculations.oversell_availability
        distinguishing_aspect: |
          The consistency model is immediate, so there is no lag anywhere: the booking's own create
          response already carries every computed money field rather than a placeholder, and the
          parents - the allotment counters and the sailing aggregates - are correct on the very next
          read with no refresh call in between. The claim is proved in both directions, because a
          cancellation must retract the same numbers just as promptly as the sale published them.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing CST-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment of 10 physical cabins / allowance 0 and a 730..0 fare window at base 50000."
            - "The sailing starts empty: occupancy_pct 0.00, ralbd 0 on both variants and available_cabins 10."
            - "booked_days_to_sail will be 162, comfortably inside the penalty-free window of 120 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, lower_berths: 2, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "CST-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_cs: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_cs}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_cs: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_cs}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_cs}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_cs}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_ada: $.data.id }
            - call: "GET /sailings/${sail_cs}"
              payload: {}
              as: ReservationAgent
            - call: "GET /sailing-inventories/${inv_cs}"
              payload: {}
              as: ReservationAgent
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 50000 }
              as: ReservationAgent
            - call: "POST /bookings/${bk_ada}/cancel"
              payload: { reason: "GUEST_CHANGED_PLANS" }
              as: ReservationAgent
            - call: "GET /sailings/${sail_cs}"
              payload: {}
              as: ReservationAgent
            - call: "GET /sailing-inventories/${inv_cs}"
              payload: {}
              as: ReservationAgent
          assert:
            - "the booking create response itself already contains booked_days_to_sail == 162, lower_berth_subtotal_cents == 100000, berth_discount_pct == 0.00, net_ticket_cents == 100000, deposit_due_cents == 50000, balance_due_cents == 100000, projected_onboard_gross_cents == 72000, payment_terms == STANDARD, deposit_due_date == 2026-08-08T00:00:00Z and final_payment_due_date == 2026-10-27T17:00:00Z - no field is null pending a later pass"
            - "the immediately following GET /sailings/${sail_cs} reports lower_berths_sold == 2, occupancy_pct == 5.00, gross_ticket_revenue_cents == 100000, projected_onboard_revenue_cents == 72000, ralbd_gross_cents == 1075, ralbd_net_cents == 1075 and revenue_alert == true, with no revenue-summary call in between"
            - "the immediately following GET /sailing-inventories/${inv_cs} reports booked_cabins == 1, available_cabins == 9 and effective_oversell_cabins == 0"
            - "the deposit response is a PaymentEvent carrying resulting_payment_status == DEPOSIT_PAID, and the booking's amount_paid_cents == 50000 / balance_due_cents == 50000 are already updated"
            - "the cancel response itself reports booking_status == CANCELLED, payment_status == PENALTY_ASSESSED, cancel_reason == GUEST_CHANGED_PLANS, a non-null cancelled_at and provisional_penalty_cents == 0 (162 days out is inside the penalty-free window)"
            - "the GET /sailings after the cancel reports lower_berths_sold == 0, occupancy_pct == 0.00, gross_ticket_revenue_cents == 0, projected_onboard_revenue_cents == 0, ralbd_gross_cents == 0, ralbd_net_cents == 0 and revenue_alert == true"
            - "the GET /sailing-inventories after the cancel reports booked_cabins == 0 and available_cabins == 10 - the cabin is back without any sweep"
            - "Sailing.${sail_cs}.paid_in_full_bookings_count == 0 and confirmed_bookings_count == 0 throughout, and Guest.${g_ada}.bookings_count == 1 - a cancelled booking still counts as one the guest made"
            - "no assertion in this recipe required a second read of the same resource to see a settled value"
