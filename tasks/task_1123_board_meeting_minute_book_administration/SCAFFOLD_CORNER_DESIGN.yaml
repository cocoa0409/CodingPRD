        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: values mutated by a write are observable in the very next read — the committee created in this request sequence shows active_member_count 1 right after the membership POST, with no checkpoint or delay."
        test_recipe:
          setup: ["Corporation, 1 ACTIVE director, committee ACTIVE"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp IC1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "C", committee_type: "SPECIAL", charter_text: "c", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /committees/${cm}/activate"
              as: CorporateSecretary
          trigger:
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "CHAIR", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "GET /committees/${cm}"
              as: ExternalAuditor
              captures: { cnt: $.data.active_member_count }
          assert:
            - "cnt == 1   # same-request visibility, no reconciliation lag"
            - "Committee.${cm}.chair_vacant == false"
