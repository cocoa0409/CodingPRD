  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: order_tax_rounded_per_line_then_summed_beats_aggregate_basis
        grounds:
          - calculations.order_financials
          - entities.ProductOrder.fields.tax_total_cents
          - entities.ProductOrder.fields.srp_basis_cents
          - entities.TaxJurisdiction.fields.tax_basis_mode
        distinguishing_aspect: |
          Mode (b) nested rounding order: two 5-unit lines of identically priced products
          (SRP basis 1000 each) round to 83 cents of tax per line and sum to 166, while the
          arithmetically identical single line of 10 units has one 2000-cent basis and
          rounds once to 165 — the same merchandise, srp basis and rate produce a 1-cent
          divergence decided solely by whether rounding precedes or follows summation.
        test_recipe:
          setup:
            - "PLAN-A at defaults, TX 825 bp facilitator jurisdiction (tax_basis_mode SRP)."
            - "Products SAMPLE and SACHET both 100 wholesale / 200 srp / 1 volume point; KIT-STD as the starter kit."
            - "Consultant M enrolled as a root; period 2026-08 OPEN and the clock inside it."
