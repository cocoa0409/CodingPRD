          identity_status cycles UNVERIFIED -> FAILED -> VERIFIED (a retry loop) while status stays DRAFT,
          then status advances DRAFT -> SUBMITTED while identity_status stays VERIFIED — each dimension's
          transitions leave the other dimension untouched.
        test_recipe:
          setup:
