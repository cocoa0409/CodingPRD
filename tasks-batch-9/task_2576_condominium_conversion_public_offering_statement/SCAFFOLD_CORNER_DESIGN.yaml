          trigger:
            - call: "POST /conversion-projects/${proj_id}/reserve-studies"
              payload: { engineering_report_id: "${er_id}", method: "COMPONENT_METHOD", opening_reserve_balance_cents: 1750000 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
