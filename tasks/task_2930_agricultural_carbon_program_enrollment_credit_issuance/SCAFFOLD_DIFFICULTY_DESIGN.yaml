              as: ProgramAdmin
              captures: { std_rt_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Interval Ridge Farms", operator_type: "PARTNERSHIP", tax_id: "91-1414141", mailing_state: "OH" }
              as: ProgramAdmin
              captures: { g14_id: $.data.id }
            - call: "POST /growers/${g14_id}/fields"
              payload: { field_name: "Interval Quarter", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "OH-041" }
              as: ProgramAdmin
