      - name: complaint_close_and_field_action_gates_at_priorities_95_and_96_and_the_state_gate_ahead_of_them
        claim_type: Violation → Error
        grounds:
          - validations.priority_95_ERR_MALFUNCTION_REPORT_PENDING
          - validations.priority_96_ERR_FIELD_ACTION_NOT_JUSTIFIED
          - errors.ERR_MALFUNCTION_REPORT_PENDING
          - errors.ERR_FIELD_ACTION_NOT_JUSTIFIED
        distinguishing_aspect: "Both gates are CONDITIONAL: the report-pending gate only bites when the triage made the complaint reportable, and the removal gate only bites when severity is below HIGH. The instance runs each rule in both directions on sibling complaints, and adds the ordering claim that an untriaged complaint answers the priority 60 state error rather than the priority 96 justification error."
        test_recipe:
          setup:
            - "Clock at 2026-09-06T00:00:00Z. One PLANNED ReagentLot CA-LOT-16 of the uncleared product IVD-CA-16, and three NEW Complaints against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CA-16", reference_material_code: "REF-CA16", required_material_codes: ["AB-CA-16"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 30 }
              as: RegulatoryAffairs
