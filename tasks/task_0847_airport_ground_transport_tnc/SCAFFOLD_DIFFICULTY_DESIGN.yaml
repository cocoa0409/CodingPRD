              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-BV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
