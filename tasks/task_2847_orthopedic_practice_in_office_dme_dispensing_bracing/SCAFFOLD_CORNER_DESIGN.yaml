            - "${err_nested_list} == ERR_CLINIC_NOT_FOUND: a nested LIST under a missing parent is a 404, not an empty page"
            - "${err_summary} == ERR_CLINIC_NOT_FOUND: the computed read resolves its parent before computing anything"
            - "every response body carries the error envelope shape { error_id, message } under data with response_type error"

      - name: corner_unknown_body_references_and_action_ids_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_PHYSICIAN_NOT_FOUND]
          - errors[ERR_PRIOR_AUTH_NOT_FOUND]
          - errors[ERR_ABN_NOTICE_NOT_FOUND]
          - errors[ERR_RETURN_NOT_FOUND]
          - errors[ERR_FITTER_NOT_FOUND]
          - errors[ERR_ACTOR_NOT_FOUND]
          - validations[priority=4]
          - validations[priority=11]
        distinguishing_aspect: |
          Existence has three different sources on this API and all three must
          resolve: ids in the path, ids in the request BODY, and the actor id in
          the X-User-Id header. The body-reference cases prove that a create is
          rejected on the first unresolvable foreign key rather than writing a
          dangling row, and the two actor cases prove the priority-4 carve-out:
          an unknown OrthoPhysician actor is a 403 ERR_ACTOR_NOT_FOUND, while an
          unknown DmeFitter actor on the two fitter-attributing endpoints is
          reported more specifically as a 404 ERR_FITTER_NOT_FOUND.
