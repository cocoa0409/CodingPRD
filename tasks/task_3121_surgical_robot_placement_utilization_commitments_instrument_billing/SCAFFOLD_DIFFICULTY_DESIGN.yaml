            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 200000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 6000000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: RegionalSalesDirector
              captures: { agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, sys_v: $.data.synthesized_system_version }
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
