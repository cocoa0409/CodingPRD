              as: Underwriter
              as_user_id: "uw-1"
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Crawler Crane C1", equipment_type: "CRANE", model_year: 2024, original_cost_cents: 60000000, ownership: "OWNED", stated_value_cents: 60000000, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /inland-marine/policies/${pol}/refer"
              payload: { referral_note: "TIV above the 50000000 threshold" }
              as: Underwriter
              as_user_id: "uw-1"
          trigger:
            - call: "POST /inland-marine/policies/${pol}/referral-decision"
              payload: { decision: "APPROVE" }
              as: UnderwritingManager
              as_user_id: "uw-1"
            - call: "POST /inland-marine/policies/${pol}/referral-decision"
              payload: { decision: "APPROVE" }
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
