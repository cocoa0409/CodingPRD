              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
