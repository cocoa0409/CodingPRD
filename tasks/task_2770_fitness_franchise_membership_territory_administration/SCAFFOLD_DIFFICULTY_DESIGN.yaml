  - rule_id: non_linear_state_machine
    instances:
      - name: relocation_request_cycles_through_changes_requested_until_revision_limit
        grounds:
          - state_machines.RelocationRequest.DRAFT_to_SUBMITTED
          - state_machines.RelocationRequest.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.RelocationRequest.CHANGES_REQUESTED_to_SUBMITTED
          - entities.RelocationRequest.fields.revision_count
          - validations[priority=12]
          - errors[ERR_RELOCATION_REVISION_LIMIT]
        distinguishing_aspect: |
          A true cycle on RelocationRequest: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED can be traversed
          repeatedly, and only the revision_count guard terminates it. The DRAFT -> SUBMITTED edge does NOT
          increment revision_count while the CHANGES_REQUESTED -> SUBMITTED edge does, so the fourth submit
          (revision_count would become 3) is the first one rejected with ERR_RELOCATION_REVISION_LIMIT while
          the request stays parked in CHANGES_REQUESTED.
        test_recipe:
          setup:
            - "A single franchisee owning one territory at (34.0, -118.0) with a 5.0 km protected radius and one OPEN club inside it."
            - "No other franchisee holds a territory, so every encroachment recomputation finds no candidate and leaves encroachment_km null."
            - "A DRAFT relocation request for that club that has already been submitted, bounced back, resubmitted, bounced back, resubmitted and bounced back a third time (revision_count 2, status CHANGES_REQUESTED)."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Northline Fitness LLC", contact_email: "ops@northlinefit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
