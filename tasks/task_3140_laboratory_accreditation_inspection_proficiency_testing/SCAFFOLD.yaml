# =============================================================================
# SCAFFOLD — Laboratory Accreditation Inspection & Proficiency Testing (CAP-style)
# §1.0–§1.7. Difficulty/corner designs live in sibling files.
# =============================================================================

scenario: |
  Laboratory Accreditation Inspection & Proficiency Testing (College of American Pathologists):
  laboratory enrollment by discipline with checklist assignment for each testing section,
  proficiency testing subscription with challenge shipments, result submission deadlines and
  graded performance, unsuccessful proficiency performance triggering investigation, corrective
  action and possible testing cessation, peer inspection model where accredited laboratories
  inspect one another with team assembly and conflict screening, inspection findings with
  deficiency citation levels and response timelines, personnel qualification and competency
  assessment verification for each testing person, method validation and instrument correlation
  documentation, accreditation decision, appeal and interim self-inspection requirements

domain_name: laboratory-accreditation
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Laboratory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Laboratory legal name" }
      - { name: clia_number, type: string, source: input, description: "CLIA certificate number; globally unique", constraints: "unique across all laboratories" }
      - { name: accreditation_status, type: enum, source: system, default: APPLIED, description: "APPLIED | ENROLLED | ACCREDITED | PROBATION | ACCREDITATION_REVOKED" }
      - { name: active_discipline_count, type: integer, source: computed, default: 0, description: "Count of DisciplineEnrollment rows for this lab with status ACTIVE; recomputed on every enrollment status change" }

  - name: InspectorProfile
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector full name" }
      - { name: affiliated_laboratory_id, type: string, source: input, description: "FK -> Laboratory.id; laboratory this inspector is employed by (drives conflict screening)" }
      - { name: specialties, type: array, source: input, description: "Non-empty array of discipline enums: CHEMISTRY | HEMATOLOGY | MICROBIOLOGY | IMMUNOLOGY | MOLECULAR | TRANSFUSION" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED only via laboratory PROBATION cascade, restored via reinstate" }

  - name: DisciplineEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: laboratory_id, type: string, source: input, description: "FK -> Laboratory.id" }
      - { name: discipline, type: enum, source: input, description: "CHEMISTRY | HEMATOLOGY | MICROBIOLOGY | IMMUNOLOGY | MOLECULAR | TRANSFUSION", constraints: "unique per laboratory: one enrollment per (laboratory_id, discipline)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CEASED" }
      - { name: standing_per_event, type: enum, source: computed, default: SATISFACTORY, description: "SATISFACTORY | UNSATISFACTORY; UNSATISFACTORY iff the most recently graded non-void PT event for this enrollment was unsuccessful" }
      - { name: standing_rolling, type: enum, source: computed, default: SATISFACTORY, description: "SATISFACTORY | UNSATISFACTORY; UNSATISFACTORY iff at least 2 of the last min(3,N) graded non-void events are unsuccessful AND N >= 2" }
      - { name: unsuccessful_event_streak, type: integer, source: computed, default: 0, description: "Count of consecutive most-recent graded non-void events that were unsuccessful; reset to 0 on satisfactory event or investigation RESOLVED" }

  - name: TestingSection
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> DisciplineEnrollment.id" }
      - { name: section_name, type: string, source: input, description: "Testing section name (e.g. 'Core Chemistry Bench')" }
      - { name: critical_testing, type: boolean, source: input, default: false, description: "True for critical-care / stat testing sections; doubles deficiency burden weight" }
      - { name: checklist_code, type: string, source: system, description: "Assigned checklist code, null until assigned", default: null }
      - { name: checklist_version, type: string, source: system, description: "Pinned checklist edition at assignment time, null until assigned", default: null }
      - { name: checklist_status, type: enum, source: system, default: UNASSIGNED, description: "UNASSIGNED | ASSIGNED | CHECKLIST_INVALIDATED" }

  - name: PTSubscription
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> DisciplineEnrollment.id" }
      - { name: analytes, type: array, source: input, description: "Non-empty array of objects { name: string, critical: boolean }; at least one analyte must have critical == true" }

  - name: PTShipment
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> PTSubscription.id" }
      - { name: event_code, type: string, source: input, description: "Challenge event code (e.g. 'C-2026-A')" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: due_at, type: datetime, source: computed, description: "= shipped_at + 10 calendar days" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }
      - { name: closure_reason, type: enum, source: system, default: null, description: "null | ADMIN_CLOSED | DEADLINE_ELAPSED; set when status -> CLOSED" }

  - name: PTResult
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> PTShipment.id" }
      - { name: collected_at, type: datetime, source: input, description: "When the laboratory ran the challenge sample; must fall inside [shipped_at, shipped_at + 5 days]" }
      - { name: analyte_scores, type: array, source: input, description: "Array of objects { name: string, score: number 0..100 }; must cover exactly the subscription's analyte names" }
      - { name: event_score, type: number, source: computed, default: null, description: "round_half_up(100 * passed_analytes / total_analytes, 1); null until GRADED" }
      - { name: event_evaluation, type: enum, source: computed, default: null, description: "null | SATISFACTORY | UNSATISFACTORY" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | GRADED | VOID" }

  - name: PTInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> DisciplineEnrollment.id; set by the automatic investigation trigger" }
      - { name: trigger_variant, type: enum, source: system, description: "PER_EVENT | ROLLING | BOTH; which standing variant(s) fired when the investigation was created" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | CORRECTIVE_ACTION_REQUIRED | RESOLVED | TESTING_CEASED" }
      - { name: corrective_action_notes, type: string, source: input, default: null, description: "Required corrective-action plan text supplied at require-corrective-action" }
      - { name: linked_result_ids, type: array, source: system, default: [], description: "PTResult ids whose unsuccessful grading contributed to this investigation" }

  - name: InspectionCycle
    parent: null
    common_fields: true
    fields:
      - { name: laboratory_id, type: string, source: input, description: "FK -> Laboratory.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Inspection window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Inspection window end (exclusive); must be > scheduled_start" }
      - { name: status, type: enum, source: system, default: TEAM_ASSEMBLY, description: "TEAM_ASSEMBLY | SCREENED | CONDUCTED | FINDINGS_ISSUED | DECIDED | APPEALED | INTERIM_SELF_INSPECTION | RE_DECIDED" }
      - { name: posture_ready, type: boolean, source: computed, default: false, description: "Derived readiness posture; see calculations.cycle_readiness_posture" }
      - { name: deficiency_burden_score, type: integer, source: computed, default: 0, description: "Live burden over unresolved findings; see calculations.deficiency_burden_score" }
      - { name: provisional_decision, type: enum, source: computed, default: null, description: "null | ACCREDITED | CONDITIONAL | DENIED; computed at issue-findings treating every currently unresolved finding as unresolved" }
      - { name: final_decision, type: enum, source: system, default: null, description: "null | ACCREDITED | CONDITIONAL | DENIED; set at decide / re-decide" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; incremented on each appeal" }

  - name: TeamAssignment
    parent: null
    common_fields: true
    fields:
      - { name: inspection_cycle_id, type: string, source: input, description: "FK -> InspectionCycle.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> InspectorProfile.id" }
      - { name: role_in_team, type: enum, source: input, description: "LEAD | MEMBER" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CLEARED | CONFLICTED | REPLACED" }

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - { name: inspection_cycle_id, type: string, source: input, description: "FK -> InspectionCycle.id" }
      - { name: section_id, type: string, source: input, description: "FK -> TestingSection.id; section the deficiency was observed in" }
      - { name: checklist_item_code, type: string, source: input, description: "Checklist requirement code cited (e.g. 'CHM.10230')" }
      - { name: deficiency_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2" }
      - { name: cited_by_inspector_id, type: string, source: system, description: "FK -> InspectorProfile.id; set from X-User-ID of the citing Inspector" }
      - { name: response_due_at, type: datetime, source: computed, default: null, description: "Set at issue-findings: LEVEL_2 -> end of 5th business day after issue; LEVEL_1 -> issue + 14 calendar days, 23:59:59Z" }
      - { name: response_text, type: string, source: input, default: null, description: "Laboratory response narrative" }
      - { name: status, type: enum, source: system, default: CITED, description: "CITED | RESPONSE_SUBMITTED | ACCEPTED | ESCALATED | WITHDRAWN" }

  - name: PersonnelRecord
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> DisciplineEnrollment.id" }
      - { name: person_name, type: string, source: input, description: "Testing person full name" }
      - { name: personnel_role, type: enum, source: input, description: "DIRECTOR | TECHNICAL_SUPERVISOR | TESTING_PERSONNEL" }
      - { name: qualification_status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | QUALIFIED | COMPETENCY_REVIEW | DISQUALIFIED" }
      - { name: consecutive_failed_assessments, type: integer, source: system, default: 0, description: "Incremented on each failed CompetencyAssessment; reset to 0 on pass" }

  - name: CompetencyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: personnel_id, type: string, source: input, description: "FK -> PersonnelRecord.id" }
      - { name: assessed_at, type: datetime, source: input, description: "Assessment date; must be strictly after the assessed_at of any prior assessment for the same personnel (monotonic chronology, no backdating)" }
      - { name: element_scores, type: array, source: input, description: "Exactly 6 numbers 0..100, one per competency element, in fixed element order" }
      - { name: composite_score, type: number, source: computed, description: "See calculations.competency_composite (per-element rounding order is pinned)" }
      - { name: passed, type: boolean, source: computed, description: "true iff composite_score >= 85.0 AND every element score >= 70" }
      - { name: valid_until, type: datetime, source: computed, description: "= assessed_at + 365 days (closed interval end)" }

  - name: MethodValidation
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> DisciplineEnrollment.id" }
      - { name: method_name, type: string, source: input, description: "Analytical method name" }
      - { name: instrument_name, type: string, source: input, description: "Instrument the method runs on" }
      - { name: correlation_r_squared, type: number, source: input, description: "Instrument correlation study r^2; approval requires >= 0.95" }
      - { name: precision_cv_pct, type: number, source: input, description: "Precision study CV percent; approval requires <= 10.0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

  - name: ChecklistEditionSummary
    parent: null
    common_fields: true
    fields:
      - { name: checklist_code, type: string, source: input, description: "Checklist family code (e.g. CHM)" }
      - { name: checklist_version, type: string, source: input, description: "Edition string (e.g. 2026); unique per checklist_code" }
      - { name: retires_checklist_version, type: string, source: input, default: null, description: "Edition this edition supersedes; on registration, sections pinned to the retired edition are invalidated" }
      - { name: retired_count, type: integer, source: computed, default: 0, description: "Number of TestingSections flipped to CHECKLIST_INVALIDATED by this edition's registration" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Laboratory
    initial_state: APPLIED
    terminal_states: [ACCREDITATION_REVOKED]
    transitions:
      - from: APPLIED
        to: ENROLLED
        trigger: "system (automatic cascade when the laboratory's FIRST DisciplineEnrollment transitions WAITING->ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: ACCREDITED
        trigger: "system (automatic when InspectionCycle.final_decision is set to ACCREDITED at decide or re-decide)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: PROBATION
        trigger: "system (automatic when InspectionCycle.final_decision is set to DENIED at decide or re-decide while laboratory is ENROLLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every DisciplineEnrollment of this laboratory in status ACTIVE -> SUSPENDED"
          - "Every InspectorProfile with affiliated_laboratory_id == laboratory.id and status ACTIVE -> SUSPENDED"
      - from: ACCREDITED
        to: PROBATION
        trigger: "system (automatic when InspectionCycle.final_decision is set to DENIED at decide or re-decide while laboratory is ACCREDITED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every DisciplineEnrollment of this laboratory in status ACTIVE -> SUSPENDED"
          - "Every InspectorProfile with affiliated_laboratory_id == laboratory.id and status ACTIVE -> SUSPENDED"
      - from: PROBATION
        to: ENROLLED
        trigger: "POST /laboratories/{labId}/reinstate"
        actor: AccreditationOfficer
        preconditions:
          - "Laboratory.accreditation_status == PROBATION (ERR_INVALID_STATE)"
          - "No PTInvestigation for any of this laboratory's enrollments is in a non-terminal status (OPEN | UNDER_REVIEW | CORRECTIVE_ACTION_REQUIRED) (ERR_OPEN_INVESTIGATION_EXISTS)"
        side_effects:
          - "Every DisciplineEnrollment of this laboratory in status SUSPENDED -> ACTIVE"
          - "Every InspectorProfile with affiliated_laboratory_id == laboratory.id and status SUSPENDED -> ACTIVE"
      - from: PROBATION
        to: ACCREDITATION_REVOKED
        trigger: "POST /laboratories/{labId}/revoke"
        actor: AccreditationOfficer
        preconditions:
          - "Laboratory.accreditation_status == PROBATION (ERR_INVALID_STATE)"
          - "Current logical time >= 180 days after the most recent DENIED final_decision was issued for this laboratory (ERR_REVOKE_TOO_EARLY)"
        side_effects: []
        note: "Revocation after a sustained probation period."

  - entity: DisciplineEnrollment
    initial_state: WAITING
    terminal_states: [CEASED]
    transitions:
      - from: WAITING
        to: ACTIVE
        trigger: "system (automatic cascade when the enrollment's FIRST TestingSection checklist is assigned — i.e. an assign-checklist call leaves zero sections with checklist_status == UNASSIGNED and the enrollment was WAITING)"
        actor: system
        preconditions: []
        side_effects:
          - "If parent Laboratory.accreditation_status == APPLIED: Laboratory -> ENROLLED"
          - "Recompute Laboratory.active_discipline_count"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from Laboratory PROBATION, or from PTInvestigation cease-testing on an enrollment in SUSPENDED, or from REVOKE-style cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Laboratory.active_discipline_count"
      - from: ACTIVE
        to: CEASED
        trigger: "system (cascade from PTInvestigation cease-testing when enrollment is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Laboratory.active_discipline_count"
      - from: SUSPENDED
        to: CEASED
        trigger: "system (cascade from PTInvestigation cease-testing when enrollment is SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Laboratory.active_discipline_count"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade from Laboratory reinstate)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Laboratory.active_discipline_count"
        note: "Cyclic SUSPENDED -> ACTIVE restores testing but does NOT clear standing_per_event / standing_rolling."

  - entity: TestingSection
    initial_state: UNASSIGNED
    terminal_states: []
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /sections/{sectionId}/assign-checklist"
        actor: AccreditationOfficer
        preconditions:
          - "TestingSection.checklist_status == UNASSIGNED (ERR_CHECKLIST_ALREADY_ASSIGNED)"
          - "Parent DisciplineEnrollment.status == ACTIVE | WAITING (ERR_ENROLLMENT_INACTIVE)"
          - "If parent enrollment.status == WAITING: request payload must carry expected_enrollment_version equal to the enrollment's current version (ERR_STALE_VERSION)"
          - "Checklist edition exists (ERR_CHECKLIST_UNKNOWN)"
        side_effects:
          - "checklist_code / checklist_version pinned from request"
          - "Parent enrollment.version incremented by 1 (when WAITING->ACTIVE cascade occurs this is part of the same write)"
          - "If parent enrollment was WAITING and this was its first assigned section: enrollment -> ACTIVE (cascade)"
      - from: ASSIGNED
        to: CHECKLIST_INVALIDATED
        trigger: "system (automatic when POST /checklist-editions retires the edition pinned on this section)"
        actor: system
        preconditions: []
        side_effects: []
        note: "CHECKLIST_INVALIDATED sections may be re-assigned via assign-checklist (acts from CHECKLIST_INVALIDATED as well, pinning the new edition); re-assignment from CHECKLIST_INVALIDATED does not cascade enrollment state."
      - from: CHECKLIST_INVALIDATED
        to: ASSIGNED
        trigger: "POST /sections/{sectionId}/assign-checklist"
        actor: AccreditationOfficer
        preconditions:
          - "TestingSection.checklist_status == CHECKLIST_INVALIDATED (ERR_CHECKLIST_ALREADY_ASSIGNED when ASSIGNED)"
          - "Parent DisciplineEnrollment.status != CEASED (ERR_ENROLLMENT_INACTIVE)"
        side_effects:
          - "checklist_code / checklist_version pinned from request"

  - entity: PTShipment
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic when POST /_clock/set_current_utc advances the clock to a value > due_at; closure_reason = DEADLINE_ELAPSED)"
        actor: system
        preconditions: []
        side_effects:
          - "No grading cascade: an ungraded missed shipment is a scored absence, not an unsuccessful event"
      - from: OPEN
        to: CLOSED
        trigger: "POST /shipments/{shipmentId}/close"
        actor: PTCoordinator
        preconditions:
          - "PTShipment.status == OPEN (ERR_SHIPMENT_CLOSED)"
        side_effects:
          - "closure_reason = ADMIN_CLOSED"

  - entity: PTResult
    initial_state: SUBMITTED
    terminal_states: [GRADED, VOID]
    transitions:
      - from: SUBMITTED
        to: GRADED
        trigger: "system (automatic inside POST /results — grading is atomic with submission)"
        actor: system
        preconditions: []
        side_effects:
          - "event_score / event_evaluation computed (calculations.pt_event_score)"
          - "Recompute enrollment standing_per_event, standing_rolling, unsuccessful_event_streak (chronological over graded non-void events)"
          - "If either standing variant is UNSATISFACTORY after this grading AND no PTInvestigation for this enrollment is in a non-terminal status: create PTInvestigation(OPEN, trigger_variant = PER_EVENT | ROLLING | BOTH) and append this result id to linked_result_ids"
          - "If the enrollment is ACTIVE and the new unsuccessful_event_streak >= 1: no state change on enrollment (cessation requires investigation action, not raw grading)"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /results/{resultId}/void"
        actor: PTCoordinator
        preconditions:
          - "PTResult.status == SUBMITTED (ERR_RESULT_ALREADY_GRADED if GRADED)"
        side_effects: []

  - entity: PTInvestigation
    initial_state: OPEN
    terminal_states: [RESOLVED, TESTING_CEASED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /investigations/{investigationId}/begin-review"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == OPEN (ERR_INVALID_INVESTIGATION_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CORRECTIVE_ACTION_REQUIRED
        trigger: "POST /investigations/{investigationId}/require-corrective-action"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == UNDER_REVIEW (ERR_INVALID_INVESTIGATION_STATE)"
          - "corrective_action_notes present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Parent enrollment -> SUSPENDED (cross-entity cascade; recompute Laboratory.active_discipline_count)"
      - from: CORRECTIVE_ACTION_REQUIRED
        to: RESOLVED
        trigger: "POST /investigations/{investigationId}/resolve"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == CORRECTIVE_ACTION_REQUIRED (ERR_INVALID_INVESTIGATION_STATE)"
        side_effects:
          - "Parent enrollment -> ACTIVE (cross-entity cascade; recompute Laboratory.active_discipline_count)"
          - "Enrollment.unsuccessful_event_streak reset to 0"
          - "NOTE: standing_per_event / standing_rolling are NOT reset — they are functions of graded history"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /investigations/{investigationId}/resolve"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == OPEN (ERR_INVALID_INVESTIGATION_STATE)"
        side_effects:
          - "Enrollment.unsuccessful_event_streak reset to 0"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /investigations/{investigationId}/resolve"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == UNDER_REVIEW (ERR_INVALID_INVESTIGATION_STATE)"
        side_effects:
          - "Enrollment.unsuccessful_event_streak reset to 0"
      - from: OPEN
        to: TESTING_CEASED
        trigger: "POST /investigations/{investigationId}/cease-testing"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == OPEN (ERR_INVALID_INVESTIGATION_STATE)"
          - "Enrollment.standing_rolling == UNSATISFACTORY (ERR_CESSATION_REQUIRES_ROLLING_UNSATISFACTORY)"
        side_effects:
          - "Parent enrollment -> CEASED (cross-entity cascade; recompute Laboratory.active_discipline_count)"
      - from: UNDER_REVIEW
        to: TESTING_CEASED
        trigger: "POST /investigations/{investigationId}/cease-testing"
        actor: AccreditationOfficer
        preconditions:
          - "PTInvestigation.status == UNDER_REVIEW (ERR_INVALID_INVESTIGATION_STATE)"
          - "Enrollment.standing_rolling == UNSATISFACTORY (ERR_CESSATION_REQUIRES_ROLLING_UNSATISFACTORY)"
        side_effects:
          - "Parent enrollment -> CEASED"

  - entity: InspectionCycle
    initial_state: TEAM_ASSEMBLY
    terminal_states: []
    transitions:
      - from: TEAM_ASSEMBLY
        to: SCREENED
        trigger: "POST /inspection-cycles/{cycleId}/screen-team"
        actor: AccreditationOfficer
        preconditions:
          - "InspectionCycle.status == TEAM_ASSEMBLY (ERR_INVALID_STATE)"
          - "At least one TeamAssignment with role_in_team == LEAD and status == CLEARED on this cycle (ERR_TEAM_INCOMPLETE)"
          - "No TeamAssignment on this cycle with status == CONFLICTED (ERR_CONFLICTED_INSPECTOR)"
          - "Every TeamAssignment on this cycle is status CLEARED or REPLACED (ERR_TEAM_INCOMPLETE for lingering PENDING)"
        side_effects: []
      - from: SCREENED
        to: CONDUCTED
        trigger: "POST /inspection-cycles/{cycleId}/conduct"
        actor: AccreditationOfficer
        preconditions:
          - "InspectionCycle.status == SCREENED (ERR_INVALID_STATE)"
          - "posture_ready == true (ERR_CYCLE_NOT_READY)"
          - "Current logical time inside [scheduled_start, scheduled_end) (ERR_INSPECTION_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: CONDUCTED
        to: FINDINGS_ISSUED
        trigger: "POST /inspection-cycles/{cycleId}/issue-findings"
        actor: AccreditationOfficer
        preconditions:
          - "InspectionCycle.status == CONDUCTED (ERR_INVALID_STATE)"
          - "At least one InspectionFinding on this cycle is in status CITED or RESPONSE_SUBMITTED or ACCEPTED (ERR_NO_FINDINGS)"
        side_effects:
          - "For every finding on this cycle still in CITED or RESPONSE_SUBMITTED: set response_due_at per calculations.finding_response_deadline (issued_at = current logical time)"
          - "provisional_decision computed per calculations.provisional_decision"
      - from: FINDINGS_ISSUED
        to: DECIDED
        trigger: "POST /inspection-cycles/{cycleId}/decide"
        actor: AccreditationOfficer
        preconditions:
          - "InspectionCycle.status == FINDINGS_ISSUED (ERR_INVALID_STATE)"
          - "decision field present, in {ACCREDITED, CONDITIONAL, DENIED} (ERR_INVALID_REQUEST)"
          - "If deficiency_burden_score > 0: decision must be DENIED (ERR_DECISION_BLOCKED_BY_BURDEN)"
          - "If any finding on this cycle is in RESPONSE_SUBMITTED (awaiting acceptance): decision blocked (ERR_DECISION_BLOCKED_BY_BURDEN — pending responses count toward burden via weight 1 or 2)"
        side_effects:
          - "final_decision = decision; status -> DECIDED"
          - "If decision == ACCREDITED: Laboratory ENROLLED -> ACCREDITED (no-op if already ACCREDITED)"
          - "If decision == DENIED: Laboratory -> PROBATION cascade (suspends all ACTIVE enrollments and ACTIVE affiliated inspectors)"
      - from: DECIDED
        to: APPEALED
        trigger: "POST /inspection-cycles/{cycleId}/appeal"
        actor: LaboratoryDirector
        preconditions:
          - "InspectionCycle.status == DECIDED (ERR_INVALID_STATE)"
          - "Current logical time <= decided_at + 30 days (ERR_APPEAL_WINDOW_CLOSED; decided_at is the updated_at stamp of the DECIDED transition)"
          - "appeal_count < 2 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "appeal_count += 1"
      - from: APPEALED
        to: INTERIM_SELF_INSPECTION
        trigger: "POST /inspection-cycles/{cycleId}/self-inspect"
        actor: LaboratoryDirector
        preconditions:
          - "InspectionCycle.status == APPEALED (ERR_INVALID_STATE)"
        side_effects: []
      - from: INTERIM_SELF_INSPECTION
        to: RE_DECIDED
        trigger: "POST /inspection-cycles/{cycleId}/re-decide"
        actor: AccreditationOfficer
        preconditions:
          - "InspectionCycle.status == INTERIM_SELF_INSPECTION (ERR_INVALID_STATE)"
          - "decision field present, in {ACCREDITED, CONDITIONAL, DENIED} (ERR_INVALID_REQUEST)"
          - "If deficiency_burden_score > 0: decision must be DENIED (ERR_DECISION_BLOCKED_BY_BURDEN)"
        side_effects:
          - "final_decision = decision (overwrites prior final_decision); status -> RE_DECIDED"
          - "Laboratory cascade identical to decide (ACCREDITED -> laboratory ACCREDITED; DENIED -> laboratory PROBATION cascade)"
      - from: RE_DECIDED
        to: APPEALED
        trigger: "POST /inspection-cycles/{cycleId}/appeal"
        actor: LaboratoryDirector
        preconditions:
          - "InspectionCycle.status == RE_DECIDED (ERR_INVALID_STATE)"
          - "Current logical time <= re-decided_at + 30 days (ERR_APPEAL_WINDOW_CLOSED)"
          - "appeal_count < 2 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "appeal_count += 1"
        note: "Cyclic: DECIDED -> APPEALED -> INTERIM_SELF_INSPECTION -> RE_DECIDED -> APPEALED is allowed while appeal_count < 2."

  - entity: TeamAssignment
    initial_state: PENDING
    terminal_states: [CLEARED, CONFLICTED, REPLACED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /team-assignments/{assignmentId}/clear"
        actor: AccreditationOfficer
        preconditions:
          - "TeamAssignment.status == PENDING (ERR_INVALID_STATE)"
          - "InspectorProfile.status == ACTIVE (ERR_INSPECTOR_SUSPENDED)"
          - "InspectorProfile.specialties contains parent InspectionCycle's laboratory's at-least-one ACTIVE/WAITING enrollment discipline — i.e. specialty match against the set of disciplines the cycle's laboratory is enrolled in with status in {WAITING, ACTIVE} (ERR_SPECIALTY_MISMATCH)"
          - "InspectorProfile.affiliated_laboratory_id != parent cycle's laboratory_id (ERR_SELF_INSPECTION)"
          - "InspectorProfile.affiliated_laboratory_id has NOT inspected parent cycle's laboratory_id within the trailing 365 days before cycle.scheduled_start — i.e. no other InspectionCycle C2 exists with C2.laboratory_id == this cycle's laboratory_id, C2.id != this cycle's id, C2.status in {CONDUCTED, FINDINGS_ISSUED, DECIDED, APPEALED, INTERIM_SELF_INSPECTION, RE_DECIDED}, C2.scheduled_start >= this cycle.scheduled_start - 365 days, and C2 has any TeamAssignment (CLEARED | PENDING | REPLACED) whose inspector's affiliated_laboratory_id == this inspector's affiliated_laboratory_id (ERR_RECIPROCAL_CONFLICT)"
        side_effects: []
      - from: PENDING
        to: CONFLICTED
        trigger: "POST /team-assignments/{assignmentId}/flag-conflict"
        actor: AccreditationOfficer
        preconditions:
          - "TeamAssignment.status == PENDING (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFLICTED
        to: REPLACED
        trigger: "POST /team-assignments/{assignmentId}/replace"
        actor: AccreditationOfficer
        preconditions:
          - "TeamAssignment.status == CONFLICTED (ERR_INVALID_STATE)"
          - "replacement_inspector_id present, references an existing InspectorProfile (ERR_INSPECTOR_NOT_FOUND)"
        side_effects:
          - "Create new TeamAssignment(PENDING, role_in_team copied) on the same cycle for replacement_inspector_id"

  - entity: InspectionFinding
    initial_state: CITED
    terminal_states: [ACCEPTED, ESCALATED, WITHDRAWN]
    transitions:
      - from: CITED
        to: RESPONSE_SUBMITTED
        trigger: "POST /findings/{findingId}/respond"
        actor: LaboratoryDirector
        preconditions:
          - "InspectionFinding.status == CITED (ERR_INVALID_STATE)"
          - "Parent cycle.status == FINDINGS_ISSUED (ERR_FINDING_NOT_RESPONDABLE)"
          - "Current logical time <= finding.response_due_at (ERR_RESPONSE_DEADLINE_PASSED)"
        side_effects: []
      - from: RESPONSE_SUBMITTED
        to: ACCEPTED
        trigger: "POST /findings/{findingId}/accept"
        actor: Inspector
        preconditions:
          - "InspectionFinding.status == RESPONSE_SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != finding.cited_by_inspector_id (ERR_SEGREGATION_OF_DUTIES — the citing inspector may not accept the response to their own citation)"
        side_effects:
          - "Recompute parent cycle deficiency_burden_score"
      - from: CITED
        to: WITHDRAWN
        trigger: "POST /findings/{findingId}/withdraw"
        actor: Inspector
        preconditions:
          - "InspectionFinding.status == CITED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute parent cycle deficiency_burden_score"
      - from: CITED
        to: ESCALATED
        trigger: "system (automatic when POST /_clock/set_current_utc advances the clock beyond response_due_at while finding is still CITED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute parent cycle deficiency_burden_score (escalated findings remain in burden)"
        note: "ESCALATED findings permanently block accreditation decisions (burden weight persists)."

  - entity: PersonnelRecord
    initial_state: PROVISIONAL
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PROVISIONAL
        to: QUALIFIED
        trigger: "POST /personnel/{personnelId}/verify-qualification"
        actor: AccreditationOfficer
        preconditions:
          - "PersonnelRecord.qualification_status == PROVISIONAL (ERR_INVALID_STATE)"
        side_effects: []
      - from: QUALIFIED
        to: COMPETENCY_REVIEW
        trigger: "system (automatic when POST /_clock/set_current_utc advances the clock beyond the valid_until of the personnel's latest CompetencyAssessment, or when a new CompetencyAssessment for this personnel has passed == false and consecutive_failed_assessments < 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPETENCY_REVIEW
        to: QUALIFIED
        trigger: "system (automatic when a new CompetencyAssessment for this personnel has passed == true)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_failed_assessments reset to 0"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system (automatic when a new CompetencyAssessment for this personnel has passed == false AND consecutive_failed_assessments reaches 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPETENCY_REVIEW
        to: DISQUALIFIED
        trigger: "system (automatic when a new CompetencyAssessment for this personnel has passed == false AND consecutive_failed_assessments reaches 2)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MethodValidation
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /method-validations/{mvId}/submit"
        actor: LaboratoryDirector
        preconditions:
          - "MethodValidation.status == DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /method-validations/{mvId}/approve"
        actor: AccreditationOfficer
        preconditions:
          - "MethodValidation.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Parent DisciplineEnrollment.status == ACTIVE (ERR_ENROLLMENT_INACTIVE)"
          - "correlation_r_squared >= 0.95 AND precision_cv_pct <= 10.0 (ERR_VALIDATION_STUDY_INADEQUATE)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /method-validations/{mvId}/reject"
        actor: AccreditationOfficer
        preconditions:
          - "MethodValidation.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: section-assign-stale-enrollment
    parent_entity: DisciplineEnrollment
    write_endpoint: "POST /sections/{sectionId}/assign-checklist"
    occ_field: "expected_enrollment_version"
    description: |
      Assigning the first checklist to a section of a WAITING enrollment is a
      mutating read of the enrollment's posture (it flips the enrollment to
      ACTIVE and its laboratory to ENROLLED). A client acting on a stale
      enrollment version — e.g. another checklist assignment has already
      activated the enrollment since the client last read it — is rejected as
      stale rather than re-applying the activation cascade. Required in the
      payload only when the enrollment is still WAITING; ignored otherwise.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pt_event_score
    trigger: "PTResult creation (grading is atomic with submission)"
    algorithm: threshold
    formula: |
      total_analytes = len(subscription.analytes)
      passed_analytes = count of analyte_scores entries with score >= 80
      event_score = round_half_up(100 * passed_analytes / total_analytes, 1)
      critical_failed = exists analyte in subscription.analytes where critical == true
                        and matching analyte_scores entry has score < 80
      event_evaluation = UNSATISFACTORY if (event_score < 80.0 OR critical_failed) else SATISFACTORY
    input_set: "The submitted PTResult's analyte_scores array, matched by name against the parent PTSubscription.analytes"
    constants:
      ANALYTE_PASS_SCORE: 80
      EVENT_PASS_SCORE: 80.0
    precision: "1 decimal place, round_half_up"
    note: "Dual-threshold: both the aggregate percentage AND the per-critical-analyte rule must pass. A 2-analyte subscription (1 critical) with scores [100, 79] yields event_score 100*1/2 = 50.0 -> UNSATISFACTORY on both rules; scores [79, 100] with the 79 on a non-critical analyte also yields 50.0. Boundary: event_score == 80.0 exactly AND no critical failure -> SATISFACTORY (>= not >)."

  - name: pt_standing_per_event
    trigger: "Every PTResult grading (event SUBMITTED -> GRADED)"
    algorithm: projection
    formula: |
      Let E = sequence of this enrollment's PTResults with status == GRADED,
      ordered by (shipment.shipped_at ASC, result.created_at ASC).
      standing_per_event = UNSATISFACTORY iff the LAST element of E has
      event_evaluation == UNSATISFACTORY, else SATISFACTORY.
      Empty E -> SATISFACTORY (initial).
    input_set: "GRADED PTResults of this enrollment only; VOID results excluded entirely"
    note: "Variant 1 of the dual-variant standing rule: reacts to every event, self-heals on the next satisfactory grading."

  - name: pt_standing_rolling
    trigger: "Every PTResult grading (event SUBMITTED -> GRADED)"
    algorithm: projection
    formula: |
      Let E = same ordered GRADED sequence as pt_standing_per_event.
      Let W = last min(3, len(E)) elements of E.
      unsuccessful_in_W = count of elements in W with event_evaluation == UNSATISFACTORY
      standing_rolling = UNSATISFACTORY iff (len(E) >= 2 AND unsuccessful_in_W >= 2),
      else SATISFACTORY.
    input_set: "GRADED PTResults of this enrollment only; VOID excluded"
    note: "Variant 2: sticky — a single new satisfactory grading cannot clear it if the window still holds 2 unsuccessful. Diverges from per-event on sequences like U,U,S (per-event heals, rolling stays UNSATISFACTORY)."

  - name: deficiency_burden_score
    trigger: "finding accept / withdraw / escalate; evaluated live at decide and re-decide"
    algorithm: aggregation
    formula: |
      unresolved = findings of this cycle with status in {CITED, RESPONSE_SUBMITTED, ESCALATED}
      burden = sum over unresolved of (4 if deficiency_level == LEVEL_2 else 2)
               * (2 if section.critical_testing == true else 1)
      ACCEPTED and WITHDRAWN findings contribute 0.
    input_set: "InspectionFindings of this cycle joined to their TestingSection"
    note: "decide/re-decide require burden == 0 for any decision other than DENIED."

  - name: provisional_decision
    trigger: "POST /inspection-cycles/{cycleId}/issue-findings"
    algorithm: threshold
    formula: |
      b = deficiency_burden_score (computed over CURRENT finding states, treating every
          unresolved finding as remaining unresolved)
      if b == 0: provisional_decision = ACCREDITED
      elif b <= 6: provisional_decision = CONDITIONAL
      else: provisional_decision = DENIED
    input_set: "Findings of this cycle at issue-findings time"
    constants:
      CONDITIONAL_MAX_BURDEN: 6
    note: "Dual-variant decision (with final_decision): provisional is forward-looking/pessimistic (assumes nothing gets resolved); final is decided by the officer later after responses. Same cycle, two different values."

  - name: competency_composite
    trigger: "CompetencyAssessment creation"
    algorithm: aggregation
    formula: |
      EIGHT-element competency model uses 6 element scores s1..s6 (fixed order).
      Per-element: w_i = s_i / 600.0 rounded HALF_UP to 4 decimal places.
      composite_score = round_half_up(100 * (w_1 + w_2 + w_3 + w_4 + w_5 + w_6), 2)
      passed = (composite_score >= 85.0) AND (min(s1..s6) >= 70)
    input_set: "The assessment's element_scores array (exactly 6 elements)"
    precision: "per-element ratio rounded to 4 dp BEFORE summation; composite rounded to 2 dp after summation — rounding order is pinned: round-then-sum, NOT sum-then-round"
    constants:
      COMPOSITE_PASS: 85.0
      ELEMENT_MIN: 70
    note: "Rounding-order trap: sum-then-round can differ from round-then-sum in the second decimal."

  - name: finding_response_deadline
    trigger: "POST /inspection-cycles/{cycleId}/issue-findings (per unresolved finding)"
    algorithm: chronological
    formula: |
      issued_at = current logical time at issue-findings
      LEVEL_1: response_due_at = issued_at + 14 calendar days (wall-clock arithmetic)
      LEVEL_2: response_due_at = end (23:59:59Z) of the 5th business day strictly after
               date(issued_at); business days = Mon..Fri (no holiday calendar).
    input_set: "Findings of this cycle in CITED or RESPONSE_SUBMITTED at issue time"
    note: "Two interval semantics on one metric: LEVEL_1 is pure calendar; LEVEL_2 skips weekends. A Friday issue gives LEVEL_2 a 7-calendar-day effective window, LEVEL_1 a 14-day window."

  - name: cycle_readiness_posture
    trigger: "evaluated (and stored) on every mutation touching cycle posture inputs: checklist assignment, enrollment status change, personnel qualification change, method-validation approval"
    algorithm: threshold
    formula: |
      posture_ready == true iff ALL of:
        (a) every TestingSection belonging to an enrollment of the cycle's laboratory
            with enrollment.status == ACTIVE has checklist_status == ASSIGNED
        (b) every PersonnelRecord belonging to an ACTIVE enrollment of the laboratory
            has qualification_status == QUALIFIED
        (c) for every ACTIVE enrollment of the laboratory: count of
            MethodValidation(status == APPROVED) >= 1
        (d) the laboratory has at least one ACTIVE enrollment
      posture is computed over the laboratory's CURRENT state, not the state at
      cycle creation.
    input_set: "Laboratory-scoped sections, personnel, method validations; CEASED/SUSPENDED enrollments excluded from all three requirements"
    note: "Posture-driven gating: conduct is blocked until the derived posture is true."

  - name: business_day_shift
    trigger: "helper for finding_response_deadline (LEVEL_2) — exposed for reuse"
    algorithm: chronological
    formula: |
      add_business_days(d, n): advance d by one calendar day at a time, counting only
      Mon-Fri, until n business days have been counted; return that date at 23:59:59Z.
      Saturday/Sunday never count and are never returned as the landing day.
    note: "Deterministic; no holidays."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint (§1.5 roles, §1.7 RBAC)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id referenced in the path and body exists (validated left-to-right, path first)"
    error_id: "ERR_NOT_FOUND / ERR_LABORATORY_NOT_FOUND / ERR_INSPECTOR_NOT_FOUND / ERR_ENROLLMENT_NOT_FOUND / ERR_SECTION_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_SHIPMENT_NOT_FOUND / ERR_RESULT_NOT_FOUND / ERR_INVESTIGATION_NOT_FOUND / ERR_CYCLE_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND / ERR_FINDING_NOT_FOUND / ERR_PERSONNEL_NOT_FOUND / ERR_METHOD_VALIDATION_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "Target resource is in a state that admits this transition (per §1.2); also terminal-state lockdown"
    error_id: "ERR_INVALID_STATE (with domain variants: ERR_SHIPMENT_CLOSED, ERR_RESULT_ALREADY_GRADED, ERR_INVALID_INVESTIGATION_STATE, ERR_FINDING_NOT_RESPONDABLE, ERR_CHECKLIST_ALREADY_ASSIGNED)"
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 5
    category: business_safety
    check: "Regulatory safety: reciprocal-inspection conflict, self-inspection, inspector suspension, specialty match, segregation of duties on finding acceptance, PT collection window (5-day viability), enrollment must be ACTIVE for PT subscription/result/method-approval, cessation requires rolling-unsatisfactory standing"
    error_id: "ERR_SELF_INSPECTION / ERR_RECIPROCAL_CONFLICT / ERR_INSPECTOR_SUSPENDED / ERR_SPECIALTY_MISMATCH / ERR_SEGREGATION_OF_DUTIES / ERR_PT_COLLECTION_WINDOW / ERR_ENROLLMENT_INACTIVE / ERR_CESSATION_REQUIRES_ROLLING_UNSATISFACTORY"
    http_status: 409
    applies_to: "team clear, finding accept, PT results, subscriptions, method approval, cease-testing"
  - priority: 6
    category: business_constraint
    check: "Structural constraints: unique clia_number, unique (laboratory_id, discipline) enrollment, analytes non-empty with at least one critical, element_scores exactly 6 in 0..100, scheduled_end > scheduled_start, conflicted team blocks screening, no open investigation blocks reinstatement, revoke requires 180-day probation age, inspection-cycle window overlap (half-open [scheduled_start, scheduled_end): a new cycle for the same laboratory is rejected if its window intersects any existing cycle of that laboratory whose status is in {TEAM_ASSEMBLY, SCREENED, CONDUCTED, FINDINGS_ISSUED}; touching boundaries where existing.scheduled_end == new.scheduled_start are NOT an overlap), PT shipment event-window overlap (CLOSED intervals [shipped_at, due_at] inclusive on BOTH ends: a new shipment for the same subscription is rejected if its interval intersects any existing shipment of that subscription with status OPEN; a new shipment whose shipped_at == the open shipment's due_at IS an overlap), competency assessment chronology (assessed_at must be strictly after the assessed_at of any prior assessment for the same personnel)"
    error_id: "ERR_DUPLICATE_CLIA / ERR_DUPLICATE_ENROLLMENT / ERR_INVALID_REQUEST / ERR_TEAM_INCOMPLETE / ERR_CONFLICTED_INSPECTOR / ERR_OPEN_INVESTIGATION_EXISTS / ERR_REVOKE_TOO_EARLY / ERR_CYCLE_WINDOW_OVERLAP / ERR_ASSESSMENT_OVERLAP"
    http_status: 409
    applies_to: "creation endpoints, screen-team, reinstate, revoke, POST /inspection-cycles, POST /competency-assessments"
  - priority: 7
    category: business_temporal
    check: "Temporal windows: shipment due_at (10 days), finding response due_at (LEVEL_1 14 calendar days / LEVEL_2 5 business days), appeal window (30 days), inspection window [scheduled_start, scheduled_end)"
    error_id: "ERR_SUBMISSION_DEADLINE_PASSED / ERR_RESPONSE_DEADLINE_PASSED / ERR_APPEAL_WINDOW_CLOSED / ERR_INSPECTION_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST /results, respond, appeal, conduct"
  - priority: 8
    category: business_fiscal
    check: "Gate checks: cycle posture (checklists, personnel, method validations) for conduct; deficiency burden for decide/re-decide; validation-study adequacy thresholds for method approval; no-findings floor for issue-findings"
    error_id: "ERR_CYCLE_NOT_READY / ERR_DECISION_BLOCKED_BY_BURDEN / ERR_VALIDATION_STUDY_INADEQUATE / ERR_NO_FINDINGS"
    http_status: 409
    applies_to: "conduct, decide, re-decide, approve, issue-findings"
  - priority: 9
    category: business_referential
    check: "Cross-entity referential integrity beyond raw existence: finding.section_id must belong to an enrollment of the cycle's laboratory; result analyte names must exactly cover subscription analytes; assessment personnel must exist under a non-CEASED enrollment"
    error_id: "ERR_SECTION_NOT_IN_LABORATORY / ERR_INVALID_REQUEST / ERR_ENROLLMENT_INACTIVE"
    http_status: 409
    applies_to: "create-finding, POST /results, POST /assessments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock. Advancing the clock fires automatic transitions: shipments past due_at close (DEADLINE_ELAPSED), CITED findings past response_due_at escalate, QUALIFIED personnel past their latest assessment's valid_until move to COMPETENCY_REVIEW."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: "string" }
    side_effects: ["fire time-based automatic transitions"]

  # --- Laboratories ---
  - method: POST
    path: "/laboratories"
    description: "Create a laboratory"
    roles: [AccreditationOfficer]
    code: 201
    input: [name, clia_number]
    output: Laboratory
    side_effects: []
  - method: GET
    path: "/laboratories"
    description: "List laboratories"
    roles: [PlatformAdmin, AccreditationOfficer, LaboratoryDirector, PTCoordinator, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Laboratory[]"
    side_effects: []
  - method: GET
    path: "/laboratories/{labId}"
    description: "Get a laboratory"
    roles: [PlatformAdmin, AccreditationOfficer, LaboratoryDirector, PTCoordinator, Inspector]
    code: 200
    input: []
    output: Laboratory
    side_effects: []
  - method: POST
    path: "/laboratories/{labId}/reinstate"
    description: "Reinstate a PROBATION laboratory to ENROLLED"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: Laboratory
    side_effects: ["SUSPENDED enrollments -> ACTIVE; SUSPENDED affiliated inspectors -> ACTIVE"]
  - method: POST
    path: "/laboratories/{labId}/revoke"
    description: "Revoke accreditation after sustained probation"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: Laboratory
    side_effects: []

  # --- Inspector profiles ---
  - method: POST
    path: "/inspector-profiles"
    description: "Register an inspector"
    roles: [AccreditationOfficer]
    code: 201
    input: [full_name, affiliated_laboratory_id, specialties]
    output: InspectorProfile
    side_effects: []
  - method: GET
    path: "/inspector-profiles"
    description: "List inspector profiles; filterable by affiliation"
    roles: [PlatformAdmin, AccreditationOfficer, LaboratoryDirector, PTCoordinator, Inspector]
    code: 200
    input: ["affiliated_laboratory_id?", "limit?", "offset?"]
    output: "InspectorProfile[]"
