  - { error_id: ERR_CONTRACT_NOT_ACTIVE,        http_status: 409, message: "The deal contract is not ACTIVE.", raised_by: "validation priority 17" }
  - { error_id: ERR_CONTRACT_TERMINAL,          http_status: 409, message: "The deal contract is in a terminal lifecycle state.", raised_by: "validation priority 17" }
