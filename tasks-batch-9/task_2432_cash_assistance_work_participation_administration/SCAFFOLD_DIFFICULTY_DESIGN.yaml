      - name: diversion_ineligibility_window_blocks_the_last_covered_month_but_not_the_next
        grounds:
          - calculations.diversion_lump_sum
          - validations[priority=40]
          - errors.ERR_DIVERSION_INELIGIBILITY_ACTIVE
          - entities.Household.fields.diversion_ineligible_through_month
        distinguishing_aspect: |
          A basis of 17000 yields a 51000 lump sum and exactly 3 ineligible months
          whose window ends at 2026-10, computed as application_month advanced by
          (months - 1), not by months. A determination for 2026-10 is therefore
          refused (the comparison is <=, inclusive of the end month) while 2026-11 is
          admitted, so the window covers 3 months rather than 4.
        test_recipe:
          setup:
            - "Household D (size 3, one adult, youngest child 84 months) has a DETERMINED 2026-08 application with countable_income_cents 29000 and determined_benefit_cents 17000."
            - "A DiversionGrant has been offered on that application with monthly_benefit_basis_cents 17000, lump_sum_cents 51000, ineligibility_months 3 and ineligibility_end_month 2026-10, and the applicant has ACCEPTED it, so Household.diversion_ineligible_through_month is 2026-10."
            - "Two further ONGOING_ASSISTANCE applications exist for the same household in RECEIVED: one for 2026-10 and one for 2026-11."
