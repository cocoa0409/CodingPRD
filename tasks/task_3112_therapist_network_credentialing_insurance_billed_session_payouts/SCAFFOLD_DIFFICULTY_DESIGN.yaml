            - "Logical clock at 2026-03-01T00:00:00Z, then 2026-06-20T00:00:00Z."
            - "Clinician Dana Reyes is BILLABLE in CA with a Tuesday 08:00-18:00 UTC availability block and one EFFECTIVE PAX enrollment."
            - "One patient with a VERIFIED benefit snapshot."
