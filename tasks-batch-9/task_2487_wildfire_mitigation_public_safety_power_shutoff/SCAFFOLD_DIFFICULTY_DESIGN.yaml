              as: MeteorologyAnalyst
              captures: { ws_h1_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_h1_id}", observed_at: "2026-08-19T12:00:00Z", wind_gust_mph: 52.0, relative_humidity_pct: 62.0, temperature_f: 94.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${hotel_id}", forecast_date: "2026-08-20", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_h_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-H1", circuit_id: "${hotel_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: false, preferred_language: "EN", notification_channels: ["VOICE"], accessibility_needs: [], address_zone_code: "ZH" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-H2", circuit_id: "${hotel_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "ZH" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-H", trigger_fire_potential_index_id: "${fpi_h_id}", forecast_onset_at: "2026-08-20T06:00:00Z", forecast_all_clear_at: "2026-08-20T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { evh_id: $.data.id, evh_v0: $.data.version }
            - call: "POST /psps-events/${evh_id}/scope"
              payload: { expected_psps_event_version: "${evh_v0}" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${evh_id}", stage: "ADVANCE_48H", scheduled_send_at: "2026-08-18T06:00:00Z" }
              as: CommunityLiaison
              captures: { h_adv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T06:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches/${h_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
            - call: "POST /psps-events/${evh_id}/arm"
              payload: {}
              as: PSPSDutyOfficer
            - call: "POST /community-resource-centers"
              payload: { resource_center_code: "CRC-S1", district_code: "D-SOUTH", site_capacity: 150, accessibility_certified: true }
              as: CommunityLiaison
              captures: { crc_s1_id: $.data.id }
            - call: "POST /psps-events/${evh_id}/activate-resource-centers"
              payload: { requested_resource_center_ids: ["${crc_s1_id}"] }
              as: PSPSDutyOfficer
            - call: "POST /psps-events/${evh_id}/cancel"
              payload: { cancellation_reason: "forecast improved before onset" }
              as: PSPSDutyOfficer
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_h1_id}", observed_at: "2026-08-20T12:00:00Z", wind_gust_mph: 52.0, relative_humidity_pct: 62.0, temperature_f: 94.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${hotel_id}", forecast_date: "2026-08-21", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_h21_id: $.data.id }
            - call: "POST /psps-events"
              payload: { event_code: "EV-EARLY", trigger_fire_potential_index_id: "${fpi_h21_id}", forecast_onset_at: "2026-08-20T21:59:00Z", forecast_all_clear_at: "2026-08-21T09:59:00Z" }
              as: PSPSDutyOfficer
              captures: { ev_early_id: $.data.id, ev_early_v0: $.data.version }
            - call: "POST /psps-events/${ev_early_id}/scope"
              payload: { expected_psps_event_version: "${ev_early_v0}" }
