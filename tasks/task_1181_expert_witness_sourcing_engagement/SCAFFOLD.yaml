scenario: |
  1181. Expert Witness Sourcing & Engagement (litigation support firm): expertise search & conflict screening, credential/Daubert history review, engagement letter & rate/retainer terms, document production to expert & privilege boundaries, report deadline & draft review protocol, deposition/trial scheduling & travel, invoice review against budget, post-case evaluation & roster maintenance
domain_name: expert-witness-sourcing
api_prefix: /litigation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Expert
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Expert full legal name" }
      - { name: specialty_area, type: string, source: input, description: "Expertise area used by sourcing search" }
      - { name: roster_status, type: enum, source: system, description: "Roster standing; constraints: ACTIVE|PROBATION|REMOVED", default: ACTIVE }
      - { name: daubert_challenge_count, type: integer, source: input, description: "Historical Daubert challenges faced", default: 0, constraints: ">= 0" }
      - { name: daubert_exclusion_count, type: integer, source: input, description: "Historical Daubert exclusions; >= 3 bars new engagements", default: 0, constraints: ">= 0" }
      - { name: max_concurrent_engagements, type: integer, source: input, description: "Capacity cap on engagements in SIGNED|ACTIVE", default: 5, constraints: ">= 1" }
      - { name: active_engagement_count, type: integer, source: computed, description: "Count of this expert's Engagements with status in {SIGNED, ACTIVE}" }
      - { name: evaluation_count, type: integer, source: computed, description: "Count of Evaluation records for this expert" }
      - { name: rating_simple, type: number, source: computed, description: "Simple average of Evaluation.overall_score; 0.0 when none; 2dp HALF_UP" }
      - { name: rating_decayed, type: number, source: computed, description: "Recency-decay weighted average of Evaluation.overall_score; 0.0 when none; 2dp HALF_UP" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Court docket number; unique per firm", constraints: "unique" }
      - { name: court, type: string, source: input, description: "Court of venue" }
      - { name: title, type: string, source: input, description: "Matter title" }
      - { name: budget_cents, type: integer, source: input, description: "Total expert-spend budget", constraints: "> 0" }
      - { name: trial_date, type: datetime, source: input, description: "Trial start; must be > report_deadline" }
      - { name: report_deadline, type: datetime, source: input, description: "Expert report due; must be < trial_date" }
      - { name: status, type: enum, source: system, description: "Matter posture; constraints: INTAKE|SOURCING|ENGAGED|DISCOVERY|TRIAL_PREP|CLOSED", default: INTAKE }
      - { name: actuals_paid_cents, type: integer, source: computed, description: "Sum of computed_total_cents over PAID invoices on this case's engagements (chronological variant)" }
      - { name: committed_cents, type: integer, source: computed, description: "Forward-looking projection: PAID + APPROVED unpaid + SUBMITTED/DISPUTED billed + retainer_remaining of ACTIVE engagements + CONFIRMED schedule estimates" }
      - { name: approved_outstanding_cents, type: integer, source: computed, description: "Sum of computed_total_cents over APPROVED (not yet PAID) invoices on this case's engagements" }

  - name: EngagementRequest
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; matter needing an expert" }
      - { name: specialty_area, type: string, source: input, description: "Required expertise area" }
      - { name: notes, type: string, source: input, description: "Sourcing notes", default: "" }
      - { name: status, type: enum, source: system, description: "Sourcing posture; constraints: OPEN|SCREENING|READY|FILLED", default: OPEN }

  - name: ConflictCheck
    parent: EngagementRequest
    common_fields: true
    fields:
      - { name: engagement_request_id, type: string, source: input, description: "FK -> EngagementRequest.id; screening context" }
      - { name: expert_id, type: string, source: input, description: "FK -> Expert.id; screened expert" }
      - { name: adverse_parties, type: array, source: input, description: "Adverse party names screened against expert history" }
      - { name: status, type: enum, source: system, description: "Screening outcome; constraints: PENDING|CLEARED|FLAGGED|WAIVED", default: PENDING }
      - { name: resolution_rationale, type: string, source: system, description: "Rationale recorded at resolve; auto-flag uses ROSTER_PROBATION", default: "" }

  - name: CredentialReview
    parent: EngagementRequest
    common_fields: true
    fields:
      - { name: engagement_request_id, type: string, source: input, description: "FK -> EngagementRequest.id; review context" }
      - { name: expert_id, type: string, source: input, description: "FK -> Expert.id; reviewed expert" }
      - { name: status, type: enum, source: system, description: "Credential/Daubert outcome; constraints: PENDING|PASSED|FAILED|PASSED_WITH_CONDITIONS", default: PENDING }
      - { name: daubert_notes, type: string, source: input, description: "Daubert history notes recorded at resolve", default: "" }

  - name: Engagement
    parent: Case
    common_fields: true
    fields:
      - { name: engagement_request_id, type: string, source: input, description: "FK -> EngagementRequest.id; originating request" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; denormalized from request at creation" }
      - { name: expert_id, type: string, source: input, description: "FK -> Expert.id; engaged expert" }
      - { name: status, type: enum, source: system, description: "Engagement posture; constraints: DRAFT|PROPOSED|NEGOTIATING|SIGNED|ACTIVE|CLOSED|TERMINATED", default: DRAFT }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Current offered/agreed hourly rate", constraints: "> 0" }
      - { name: retainer_cents, type: integer, source: input, description: "Required retainer amount", constraints: ">= 0" }
      - { name: expense_cap_cents, type: integer, source: input, description: "Lifetime cap on reimbursable travel expenses", constraints: ">= 0" }
      - { name: negotiation_round_count, type: integer, source: system, description: "Increments on each expert counter", default: 0 }
      - { name: nda_executed, type: boolean, source: system, description: "Set true when expert signs engagement letter", default: false }
      - { name: retainer_funded_cents, type: integer, source: system, description: "Total retainer funded by client", default: 0 }
      - { name: retainer_drawn_cents, type: integer, source: system, description: "Total retainer applied to approved invoices / cancellation fees", default: 0 }
      - { name: retainer_refunded_cents, type: integer, source: system, description: "Retainer refunded on termination", default: 0 }
      - { name: retainer_remaining_cents, type: integer, source: computed, description: "retainer_funded_cents - retainer_drawn_cents - retainer_refunded_cents; invariant: always == funded - drawn - refunded >= 0" }
      - { name: expenses_approved_cents, type: integer, source: system, description: "Sum of allowed travel-expense portions on APPROVED|PAID invoices", default: 0 }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the CaseManager who created the engagement; used for segregation-of-duties on invoice approval" }

  - name: DocumentProduction
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; producing engagement" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: privilege_tier, type: enum, source: input, description: "Privilege boundary tier; constraints: DISCOVERABLE|WORK_PRODUCT|PRIVILEGED" }
      - { name: content_ref, type: string, source: input, description: "Opaque content reference" }
      - { name: status, type: enum, source: system, description: "Production posture; constraints: REQUESTED|DELIVERED|ACKNOWLEDGED|RECALLED", default: REQUESTED }

  - name: Report
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; authoring engagement" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: report_type, type: enum, source: input, description: "Report kind; constraints: LIABILITY|DAMAGES|REBUTTAL" }
      - { name: deadline_at, type: datetime, source: system, description: "Pinned copy of Case.report_deadline at report creation (version-pinned at creation)" }
      - { name: status, type: enum, source: system, description: "Review protocol posture; constraints: DRAFT|IN_REVIEW|REVISION_REQUESTED|FINALIZED|DISCLOSED|WITHDRAWN", default: DRAFT }
      - { name: revision_count, type: integer, source: system, description: "Number of REVISION_REQUESTED -> DRAFT loops", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Clock time of last DRAFT -> IN_REVIEW submit; null until first submit" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Deposition suite name" }
      - { name: location, type: string, source: input, description: "Venue city/address" }
      - { name: capacity, type: integer, source: input, description: "Room capacity", default: 20, constraints: ">= 1" }

  - name: TestimonySchedule
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; scheduling engagement" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; booked room; null for remote", default: null }
      - { name: kind, type: enum, source: input, description: "Session kind; constraints: DEPOSITION|TRIAL" }
      - { name: start_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (UTC); must be > start_at" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated testimony hours for cost projection", constraints: "> 0" }
      - { name: travel_required, type: boolean, source: input, description: "Whether expert travel is required", default: false }
      - { name: actual_hours, type: number, source: system, description: "Actual hours recorded at completion", default: 0 }
      - { name: cancellation_fee_cents, type: integer, source: system, description: "Fee drawn from retainer when a CONFIRMED session is cancelled within 72h of start", default: 0 }
      - { name: status, type: enum, source: system, description: "Scheduling posture; constraints: PROPOSED|CONFIRMED|COMPLETED|CANCELLED", default: PROPOSED }

  - name: Invoice
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; billing engagement" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end; must be >= period_start" }
      - { name: line_items, type: array, source: input, description: "Service lines: [{kind: PREP|TESTIMONY|TRAVEL_TIME, hours: number>0}]; may be empty when travel_expense_cents > 0" }
      - { name: travel_expense_cents, type: integer, source: input, description: "Claimed travel expenses", default: 0, constraints: ">= 0" }
      - { name: total_cents, type: integer, source: input, description: "Client-declared total; must equal server recomputation or ERR_INVOICE_AMOUNT_MISMATCH" }
      - { name: computed_total_cents, type: integer, source: computed, description: "Server total: per-line round_half_up then sum, plus capped expense allowance" }
      - { name: status, type: enum, source: system, description: "Review posture; constraints: SUBMITTED|APPROVED|DISPUTED|PAID|REJECTED", default: SUBMITTED }
      - { name: dispute_count, type: integer, source: system, description: "Number of DISPUTED episodes", default: 0 }
      - { name: retainer_draw_cents, type: integer, source: system, description: "Portion of computed_total_cents drawn from retainer at approval", default: 0 }
      - { name: billed_to_client_cents, type: integer, source: system, description: "Portion billed directly to client at approval", default: 0 }

  - name: Evaluation
    parent: Engagement
    common_fields: false
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; evaluated engagement" }
      - { name: expert_id, type: string, source: system, description: "FK -> Expert.id; denormalized from engagement at creation" }
      - { name: overall_score, type: number, source: input, description: "Overall performance score", constraints: "0.0 .. 5.0 inclusive" }
      - { name: quality_score, type: number, source: input, description: "Report quality score", default: null, constraints: "0.0 .. 5.0 or null" }
      - { name: timeliness_score, type: number, source: input, description: "Deadline adherence score", default: null, constraints: "0.0 .. 5.0 or null" }
      - { name: testimony_score, type: number, source: input, description: "Testimony effectiveness score", default: null, constraints: "0.0 .. 5.0 or null" }
      - { name: comments, type: string, source: input, description: "Free-text evaluation", default: "" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical clock time at creation; drives decay weights" }

state_machines:
  - entity: Case
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: SOURCING
        trigger: "system: first EngagementRequest created for the case"
        actor: system
        preconditions: ["EngagementRequest.case_id == Case.id", "Case.status == INTAKE"]
        side_effects: ["Case.status := SOURCING", "increments Case.version by 1"]
      - from: SOURCING
        to: ENGAGED
        trigger: "system: first Engagement for the case reaches SIGNED"
        actor: system
        preconditions: ["Case.status == SOURCING"]
        side_effects: ["Case.status := ENGAGED", "increments Case.version by 1"]
      - from: ENGAGED
        to: DISCOVERY
        trigger: "system: first Report created on any engagement of the case"
        actor: system
        preconditions: ["Case.status == ENGAGED"]
        side_effects: ["Case.status := DISCOVERY", "increments Case.version by 1"]
      - from: DISCOVERY
        to: TRIAL_PREP
        trigger: "system: first Report of the case reaches DISCLOSED"
        actor: system
        preconditions: ["Case.status == DISCOVERY"]
        side_effects: ["Case.status := TRIAL_PREP", "increments Case.version by 1"]
      - from: TRIAL_PREP
        to: DISCOVERY
        trigger: "system: the case's only DISCLOSED Report is WITHDRAWN via engagement termination cascade"
        actor: system
        preconditions: ["Case.status == TRIAL_PREP", "count of DISCLOSED Reports across case engagements == 0 after the withdrawal"]
        side_effects: ["Case.status := DISCOVERY", "increments Case.version by 1"]
      - from: ENGAGED
        to: CLOSED
        trigger: "POST /litigation/cases/{id}/close"
        actor: CaseManager
        preconditions: ["every Engagement with case_id == Case.id has status in {CLOSED, TERMINATED}", "every Invoice on those engagements has status in {PAID, REJECTED}"]
        side_effects: ["Case.status := CLOSED", "increments Case.version by 1"]
        note: "Same transition also applies from DISCOVERY and TRIAL_PREP with identical preconditions."
      - from: DISCOVERY
        to: CLOSED
        trigger: "POST /litigation/cases/{id}/close"
        actor: CaseManager
        preconditions: ["every Engagement with case_id == Case.id has status in {CLOSED, TERMINATED}", "every Invoice on those engagements has status in {PAID, REJECTED}"]
        side_effects: ["Case.status := CLOSED", "increments Case.version by 1"]
      - from: TRIAL_PREP
        to: CLOSED
        trigger: "POST /litigation/cases/{id}/close"
        actor: CaseManager
        preconditions: ["every Engagement with case_id == Case.id has status in {CLOSED, TERMINATED}", "every Invoice on those engagements has status in {PAID, REJECTED}"]
        side_effects: ["Case.status := CLOSED", "increments Case.version by 1"]

  - entity: Expert
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: evaluation cascade (expert_composite_rating DECAYED variant < 3.0 with >= 2 evaluations) OR POST /litigation/experts/{id}/roster-status {to_status: PROBATION}"
        actor: system
        preconditions: ["for the automatic path: Expert.evaluation_count >= 2 AND Expert.rating_decayed < 3.0", "for the manual path: actor is PlatformAdmin"]
        side_effects:
          - "Expert.roster_status := PROBATION; increments Expert.version by 1"
          - "cascade: every ConflictCheck with expert_id == Expert.id and status == PENDING becomes FLAGGED with resolution_rationale 'ROSTER_PROBATION'"
          - "cascade: every EngagementRequest in SCREENING whose conflict/credential checks are now all resolved with no candidate holding (check in {CLEARED, WAIVED}) AND (review in {PASSED, PASSED_WITH_CONDITIONS}) reverts to OPEN"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /litigation/experts/{id}/roster-status"
        actor: PlatformAdmin
        preconditions: ["Expert.roster_status == PROBATION", "payload to_status == ACTIVE"]
        side_effects: ["Expert.roster_status := ACTIVE", "increments Expert.version by 1"]
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /litigation/experts/{id}/roster-status"
        actor: PlatformAdmin
        preconditions: ["payload to_status == REMOVED", "Expert.active_engagement_count == 0 (else ERR_EXPERT_HAS_ACTIVE_ENGAGEMENTS)"]
        side_effects: ["Expert.roster_status := REMOVED", "increments Expert.version by 1"]
      - from: PROBATION
        to: REMOVED
        trigger: "POST /litigation/experts/{id}/roster-status"
        actor: PlatformAdmin
        preconditions: ["payload to_status == REMOVED", "Expert.active_engagement_count == 0 (else ERR_EXPERT_HAS_ACTIVE_ENGAGEMENTS)"]
        side_effects: ["Expert.roster_status := REMOVED", "increments Expert.version by 1"]

  - entity: EngagementRequest
    initial_state: OPEN
    terminal_states: [FILLED]
    transitions:
      - from: OPEN
        to: SCREENING
        trigger: "system: first ConflictCheck or CredentialReview created under the request"
        actor: system
        preconditions: ["EngagementRequest.status == OPEN"]
        side_effects: ["EngagementRequest.status := SCREENING", "increments EngagementRequest.version by 1"]
      - from: SCREENING
        to: READY
        trigger: "system: a candidate becomes fully qualified"
        actor: system
        preconditions: ["exists expert E with a ConflictCheck(expert_id=E) in {CLEARED, WAIVED} and a CredentialReview(expert_id=E) in {PASSED, PASSED_WITH_CONDITIONS} under this request"]
        side_effects: ["EngagementRequest.status := READY", "increments EngagementRequest.version by 1"]
      - from: READY
        to: SCREENING
        trigger: "system: the last fully-qualified candidate loses qualification (waiver revoked not supported; reserved) "
        actor: system
        preconditions: ["no remaining expert satisfies the READY predicate"]
        side_effects: ["EngagementRequest.status := SCREENING", "increments EngagementRequest.version by 1"]
      - from: SCREENING
        to: OPEN
        trigger: "system: roster-probation cascade flags the last PENDING check and no candidate qualifies"
        actor: system
        preconditions: ["all ConflictChecks are in {FLAGGED} and no expert satisfies the READY predicate"]
        side_effects: ["EngagementRequest.status := OPEN", "increments EngagementRequest.version by 1"]
      - from: READY
        to: FILLED
        trigger: "system: an Engagement is created referencing this request"
        actor: system
        preconditions: ["EngagementRequest.status == READY"]
        side_effects: ["EngagementRequest.status := FILLED", "increments EngagementRequest.version by 1"]
      - from: OPEN
        to: FILLED
        trigger: "not allowed — request must pass through screening"
        actor: system
        preconditions: ["never satisfied; OPEN -> FILLED direct is impossible"]
        side_effects: []
        note: "Declared to pin that direct OPEN->FILLED is forbidden; attempts yield ERR_INVALID_STATE via engagement-creation preconditions."

  - entity: ConflictCheck
    initial_state: PENDING
    terminal_states: [CLEARED, FLAGGED, WAIVED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /litigation/conflict-checks/{id}/resolve {outcome: CLEARED}"
        actor: ConflictAnalyst
        preconditions: ["ConflictCheck.status == PENDING"]
        side_effects: ["resolution_rationale := payload.rationale", "evaluate EngagementRequest READY predicate", "increments ConflictCheck.version by 1"]
      - from: PENDING
        to: FLAGGED
        trigger: "POST /litigation/conflict-checks/{id}/resolve {outcome: FLAGGED} or system roster-probation cascade"
        actor: ConflictAnalyst
        preconditions: ["ConflictCheck.status == PENDING"]
        side_effects: ["resolution_rationale := payload.rationale or 'ROSTER_PROBATION'", "evaluate EngagementRequest reversion", "increments ConflictCheck.version by 1"]
      - from: FLAGGED
        to: WAIVED
        trigger: "POST /litigation/conflict-checks/{id}/resolve {outcome: WAIVED}"
        actor: PlatformAdmin
        preconditions: ["ConflictCheck.status == FLAGGED", "actor role == PlatformAdmin (ConflictAnalyst attempting WAIVED gets ERR_FORBIDDEN)"]
        side_effects: ["resolution_rationale := payload.rationale", "evaluate EngagementRequest READY predicate", "increments ConflictCheck.version by 1"]

  - entity: CredentialReview
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, PASSED_WITH_CONDITIONS]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /litigation/credential-reviews/{id}/resolve {outcome: PASSED}"
        actor: CredentialAnalyst
        preconditions: ["CredentialReview.status == PENDING"]
        side_effects: ["evaluate EngagementRequest READY predicate", "increments CredentialReview.version by 1"]
      - from: PENDING
        to: FAILED
        trigger: "POST /litigation/credential-reviews/{id}/resolve {outcome: FAILED}"
        actor: CredentialAnalyst
        preconditions: ["CredentialReview.status == PENDING"]
        side_effects: ["increments CredentialReview.version by 1"]
      - from: PENDING
        to: PASSED_WITH_CONDITIONS
        trigger: "POST /litigation/credential-reviews/{id}/resolve {outcome: PASSED_WITH_CONDITIONS}"
        actor: CredentialAnalyst
        preconditions: ["CredentialReview.status == PENDING"]
        side_effects: ["evaluate EngagementRequest READY predicate", "increments CredentialReview.version by 1"]

  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /litigation/engagements/{id}/propose"
        actor: CaseManager
        preconditions: ["Engagement.status == DRAFT"]
        side_effects: ["increments Engagement.version by 1"]
      - from: NEGOTIATING
        to: PROPOSED
        trigger: "POST /litigation/engagements/{id}/propose"
        actor: CaseManager
        preconditions: ["Engagement.status == NEGOTIATING"]
        side_effects: ["if payload.hourly_rate_cents present, hourly_rate_cents := payload value (counter-offer acceptance loop)", "increments Engagement.version by 1"]
      - from: PROPOSED
        to: NEGOTIATING
        trigger: "POST /litigation/engagements/{id}/counter"
        actor: Expert
        preconditions: ["Engagement.status == PROPOSED", "X-User-ID == Engagement.expert_id", "payload.counter_rate_cents > 0"]
        side_effects: ["negotiation_round_count += 1", "increments Engagement.version by 1"]
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /litigation/engagements/{id}/sign"
        actor: Expert
        preconditions: ["Engagement.status == PROPOSED", "X-User-ID == Engagement.expert_id"]
        side_effects:
          - "nda_executed := true"
          - "Expert.active_engagement_count recomputed (now includes this engagement)"
          - "if Case.status == SOURCING then Case auto-transitions SOURCING -> ENGAGED"
          - "increments Engagement.version by 1"
      - from: SIGNED
        to: ACTIVE
        trigger: "system: POST /litigation/engagements/{id}/fund-retainer brings retainer_funded_cents to exactly retainer_cents"
        actor: system
        preconditions: ["Engagement.status == SIGNED", "retainer_funded_cents == retainer_cents after this funding"]
        side_effects: ["Engagement.status := ACTIVE", "Expert.active_engagement_count unchanged (SIGNED and ACTIVE both count)", "increments Engagement.version by 1"]
      - from: SIGNED
        to: TERMINATED
        trigger: "POST /litigation/engagements/{id}/terminate"
        actor: CaseManager
        preconditions: ["Engagement.status == SIGNED"]
        side_effects:
          - "retainer_refunded_cents := retainer_funded_cents - retainer_drawn_cents; retainer invariant holds"
          - "Expert.active_engagement_count recomputed (drops this engagement)"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /litigation/engagements/{id}/terminate"
        actor: CaseManager
        preconditions: ["Engagement.status == ACTIVE"]
        side_effects:
          - "cascade link 1: every TestimonySchedule in {PROPOSED, CONFIRMED} -> CANCELLED (no cancellation fee on firm-initiated termination)"
          - "cascade link 1: every Report in {DRAFT, IN_REVIEW, REVISION_REQUESTED, FINALIZED, DISCLOSED} -> WITHDRAWN"
          - "cascade link 2: withdrawing the case's only DISCLOSED Report reverts Case TRIAL_PREP -> DISCOVERY (only when no other DISCLOSED report remains)"
          - "cascade link 1: every DocumentProduction in {REQUESTED, DELIVERED} -> RECALLED"
          - "cascade link 1: every Invoice in {SUBMITTED, DISPUTED} -> REJECTED"
          - "retainer_refunded_cents := retainer_funded_cents - retainer_drawn_cents - retainer_refunded_cents (refund remaining)"
          - "Case.committed_cents recomputed (drops this engagement's retainer_remaining and schedule estimates)"
          - "Expert.active_engagement_count recomputed"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /litigation/engagements/{id}/close"
        actor: CaseManager
        preconditions: ["Engagement.status == ACTIVE", "no Report in {DRAFT, IN_REVIEW, REVISION_REQUESTED, FINALIZED}", "no TestimonySchedule in {PROPOSED, CONFIRMED}", "every Invoice in {PAID, REJECTED} (else ERR_ENGAGEMENT_NOT_CLOSABLE)"]
        side_effects: ["Expert.active_engagement_count recomputed (drops this engagement)", "increments Engagement.version by 1"]

  - entity: DocumentProduction
    initial_state: REQUESTED
    terminal_states: [ACKNOWLEDGED, RECALLED]
    transitions:
      - from: REQUESTED
        to: DELIVERED
        trigger: "POST /litigation/document-productions/{id}/advance {action: DELIVER}"
        actor: CaseManager
        preconditions:
          - "DocumentProduction.status == REQUESTED"
          - "privilege gate: tier DISCOVERABLE requires Engagement.status in {SIGNED, ACTIVE}; tier WORK_PRODUCT requires Engagement.status == ACTIVE; tier PRIVILEGED requires Engagement.status == ACTIVE AND Engagement.nda_executed == true (violations -> ERR_PRIVILEGE_TIER_BLOCKED)"
        side_effects: ["increments DocumentProduction.version by 1"]
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /litigation/document-productions/{id}/advance {action: ACKNOWLEDGE}"
        actor: Expert
        preconditions: ["DocumentProduction.status == DELIVERED", "X-User-ID == Engagement.expert_id"]
        side_effects: ["increments DocumentProduction.version by 1"]
      - from: DELIVERED
        to: RECALLED
        trigger: "POST /litigation/document-productions/{id}/advance {action: RECALL}"
        actor: CaseManager
        preconditions: ["DocumentProduction.status == DELIVERED"]
        side_effects: ["increments DocumentProduction.version by 1"]
      - from: REQUESTED
        to: RECALLED
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["increments DocumentProduction.version by 1"]
      - from: DELIVERED
        to: RECALLED
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["increments DocumentProduction.version by 1"]

  - entity: Report
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "DISCLOSED is the success end-state for firm-initiated flow but is still withdrawn by the engagement termination cascade, so it is not a terminal state."
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /litigation/reports/{id}/submit"
        actor: Expert
        preconditions: ["Report.status == DRAFT", "Engagement.status == ACTIVE", "X-User-ID == Engagement.expert_id", "logical clock now <= Report.deadline_at (now == deadline_at passes; strictly later fails with ERR_REPORT_DEADLINE_PASSED)"]
        side_effects: ["submitted_at := now", "increments Report.version by 1"]
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /litigation/reports/{id}/review {decision: REQUEST_REVISION}"
        actor: CaseManager
        preconditions: ["Report.status == IN_REVIEW"]
        side_effects: ["increments Report.version by 1"]
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /litigation/reports/{id}/revise"
        actor: Expert
        preconditions: ["Report.status == REVISION_REQUESTED", "X-User-ID == Engagement.expert_id"]
        side_effects: ["revision_count += 1", "increments Report.version by 1"]
      - from: IN_REVIEW
        to: FINALIZED
        trigger: "POST /litigation/reports/{id}/review {decision: FINALIZE}"
        actor: CaseManager
        preconditions: ["Report.status == IN_REVIEW"]
        side_effects: ["increments Report.version by 1"]
      - from: FINALIZED
        to: DISCLOSED
        trigger: "POST /litigation/reports/{id}/disclose"
        actor: CaseManager
        preconditions: ["Report.status == FINALIZED", "logical clock now < Case.trial_date (else ERR_TRIAL_DATE_PASSED)"]
        side_effects: ["if Case.status == DISCOVERY then Case auto-transitions DISCOVERY -> TRIAL_PREP", "increments Report.version by 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["increments Report.version by 1"]
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["increments Report.version by 1"]
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["increments Report.version by 1"]
      - from: FINALIZED
        to: WITHDRAWN
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["increments Report.version by 1"]
      - from: DISCLOSED
        to: WITHDRAWN
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["if no other DISCLOSED report remains on the case, Case TRIAL_PREP -> DISCOVERY", "increments Report.version by 1"]

  - entity: TestimonySchedule
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /litigation/testimony-schedules/{id}/confirm"
        actor: CaseManager
        preconditions:
          - "TestimonySchedule.status == PROPOSED"
          - "Engagement.status == ACTIVE"
          - "kind == TRIAL requires a Report of the same engagement in {FINALIZED, DISCLOSED} (else ERR_REPORT_NOT_FINALIZED)"
          - "re-run expert half-open overlap check and venue closed+buffer check against current clock state"
          - "start_at > logical clock now (else ERR_SCHEDULE_IN_PAST)"
        side_effects: ["Case.committed_cents recomputed (estimate now committed)", "increments TestimonySchedule.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /litigation/testimony-schedules/{id}/cancel"
        actor: CaseManager
        preconditions: ["TestimonySchedule.status == PROPOSED"]
        side_effects: ["increments TestimonySchedule.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /litigation/testimony-schedules/{id}/cancel"
        actor: CaseManager
        preconditions: ["TestimonySchedule.status == CONFIRMED"]
        side_effects:
          - "if now > start_at - 72h: cancellation_fee_cents := round_half_up(0.50 * estimated_hours * Engagement.hourly_rate_cents * 1.25); fee drawn from retainer: draw = min(fee, retainer_remaining); retainer_drawn_cents += draw"
          - "Case.committed_cents recomputed (estimate removed, fee retained in drawn)"
          - "increments TestimonySchedule.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /litigation/testimony-schedules/{id}/complete"
        actor: CaseManager
        preconditions: ["TestimonySchedule.status == CONFIRMED", "logical clock now >= end_at"]
        side_effects: ["actual_hours := payload.actual_hours", "Case.committed_cents recomputed (estimate removed)", "increments TestimonySchedule.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["no cancellation fee on this path", "increments TestimonySchedule.version by 1"]
        note: "System cascade cancellation; distinct from firm-initiated cancel."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["no cancellation fee on this path", "Case.committed_cents recomputed", "increments TestimonySchedule.version by 1"]

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /litigation/invoices/{id}/approve"
        actor: BillingReviewer
        preconditions:
          - "Invoice.status == SUBMITTED"
          - "Engagement.status == ACTIVE"
          - "Case.status != CLOSED"
          - "segregation of duties: X-User-ID != Engagement.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "fiscal boundary: computed_total_cents <= Case.budget_cents - Case.actuals_paid_cents - Case.approved_outstanding_cents (equality passes; exceeding fails with ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "retainer drawdown (evaluation order pinned): draw := min(computed_total_cents, retainer_remaining_cents); retainer_draw_cents := draw; billed_to_client_cents := computed_total_cents - draw"
          - "Engagement.retainer_drawn_cents += draw; Engagement.expenses_approved_cents += allowed expense portion"
          - "Case.approved_outstanding_cents recomputed; Case.committed_cents recomputed"
          - "increments Invoice.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /litigation/invoices/{id}/dispute"
        actor: BillingReviewer
        preconditions: ["Invoice.status == SUBMITTED"]
        side_effects: ["dispute_count += 1", "increments Invoice.version by 1"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /litigation/invoices/{id}/resubmit"
        actor: Expert
        preconditions: ["Invoice.status == DISPUTED", "X-User-ID == Engagement.expert_id", "payload.total_cents == server recomputation of new line_items + expense (else ERR_INVOICE_AMOUNT_MISMATCH)"]
        side_effects: ["line_items, travel_expense_cents, total_cents, computed_total_cents replaced", "dispute_count unchanged", "increments Invoice.version by 1"]
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /litigation/invoices/{id}/settle {outcome: REJECTED}"
        actor: BillingReviewer
        preconditions: ["Invoice.status == DISPUTED", "payload.outcome == REJECTED"]
        side_effects: ["Case.committed_cents recomputed (billed amount removed)", "increments Invoice.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /litigation/invoices/{id}/settle {outcome: PAID}"
        actor: BillingReviewer
        preconditions: ["Invoice.status == APPROVED", "payload.outcome == PAID"]
        side_effects: ["Case.actuals_paid_cents += computed_total_cents; Case.approved_outstanding_cents -= computed_total_cents; Case.committed_cents recomputed", "increments Invoice.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["Case.committed_cents recomputed", "increments Invoice.version by 1"]
      - from: DISPUTED
        to: REJECTED
        trigger: "system: engagement termination cascade"
        actor: system
        preconditions: ["Engagement.status became TERMINATED"]
        side_effects: ["Case.committed_cents recomputed", "increments Invoice.version by 1"]

concurrency_rules:
  - rule_id: engagement-amend-stale-version
    parent_entity: Engagement
    write_endpoint: "POST /litigation/engagements/{id}/amend"
    occ_field: expected_engagement_version
    description: |
      Amending an Engagement whose version has advanced past the caller's
      expected_engagement_version is rejected. A newer amendment legitimately
      supersedes prior terms, so a second sequential amend carrying a stale
      version observes no state-field rejection and must be stopped by OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-budget-revision-stale-version
    parent_entity: Case
    write_endpoint: "POST /litigation/cases/{id}/budget-revisions"
    occ_field: expected_case_version
    description: |
      Revising a Case budget whose version has advanced past the caller's
      expected_case_version is rejected. Each revision legitimately supersedes
      the prior budget, so only the OCC check distinguishes a stale writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: invoice_total_with_per_line_rounding
    trigger: "POST /litigation/engagements/{id}/invoices and POST /litigation/invoices/{id}/resubmit (server recomputation before persistence)"
    algorithm: aggregation
    formula: |
      MULT = { PREP: 1.00, TESTIMONY: 1.25, TRAVEL_TIME: 0.50 }
      for each line in payload.line_items, in payload order:
        raw_cents   = line.hours * Engagement.hourly_rate_cents * MULT[line.kind]
        line_cents  = round_half_up(raw_cents, 2)          # ROUND PER LINE FIRST (pinned order)
      service_total = sum(line_cents)
      expense_room  = max(0, Engagement.expense_cap_cents - Engagement.expenses_approved_cents)
      expense_allow = min(payload.travel_expense_cents, expense_room)
      computed_total_cents = service_total + expense_allow
      reject if payload.total_cents != computed_total_cents (ERR_INVOICE_AMOUNT_MISMATCH)
    input_set: "payload line_items; Engagement.hourly_rate_cents; Engagement.expense_cap_cents; Engagement.expenses_approved_cents over invoices in {APPROVED, PAID} only"
    constants: { PREP_MULT: 1.00, TESTIMONY_MULT: 1.25, TRAVEL_TIME_MULT: 0.50 }
    precision: "2 decimal places, round_half_up; per-line rounding THEN sum — the alternative sum-then-round order is explicitly NOT used and produces different cents"
    variants:
      - name: per_line_then_sum
        when: "always (pinned)"
        difference: "round each line to cents before summing"
      - name: sum_then_round
        when: "never — documented counterfactual"
        difference: "sum raw line values then round once; differs from pinned order (e.g. rate 10001, two TRAVEL_TIME 1h lines: 10002 vs 10001)"

  - name: invoice_approval_amount
    trigger: "POST /litigation/invoices/{id}/approve (fiscal gate + drawdown)"
    algorithm: tiered_pricing
    formula: |
      allowed = Invoice.computed_total_cents                # already tier-adjusted by multipliers + expense cap
      remaining_budget = Case.budget_cents - Case.actuals_paid_cents - Case.approved_outstanding_cents
      if allowed > remaining_budget: reject ERR_BUDGET_EXCEEDED   # equality PASSES
      draw = min(allowed, Engagement.retainer_remaining_cents)
      billed_to_client = allowed - draw
    input_set: "Invoice in SUBMITTED; Case budget fields; Engagement retainer fields"
    constants: {}
    precision: "integer cents; >= vs > boundary pinned: allowed == remaining_budget approves"

  - name: retainer_drawdown
    trigger: "invoice approval and cancellation-fee debit; refund at termination"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER (pinned, resolves the circular-looking dependency):
      1. compute Invoice.computed_total_cents from current rate card   (before any balance mutation)
      2. budget gate uses Case.actuals_paid_cents and Case.approved_outstanding_cents as of pre-approval state
      3. draw := min(allowed, retainer_remaining_cents)                # uses pre-draw remaining
      4. retainer_drawn_cents += draw                                  # mutation happens last
      5. Case aggregates recomputed from post-mutation invoice set
      INVARIANT: retainer_funded_cents == retainer_drawn_cents + retainer_refunded_cents + retainer_remaining_cents
    input_set: "Engagement retainer fields; Invoice being approved"
    constants: {}
    precision: "integer cents"

  - name: case_budget_projection
    trigger: "GET /litigation/cases/{id} read (computed fields); recomputed on every invoice/schedule/engagement mutation"
    algorithm: forward_looking
    formula: |
      ACTUAL variant (chronological):
        actuals_paid_cents = sum(Invoice.computed_total_cents where status == PAID), order-independent
      COMMITTED variant (forward-looking):
        committed_cents = actuals_paid_cents
                        + sum(Invoice.computed_total_cents where status == APPROVED)
                        + sum(Invoice.computed_total_cents where status in {SUBMITTED, DISPUTED})
                        + sum(Engagement.retainer_remaining_cents where status == ACTIVE)
                        + sum(estimate of TestimonySchedule where status == CONFIRMED)
      schedule estimate = round_half_up(estimated_hours * Engagement.hourly_rate_cents * 1.25, 2)
      REJECTED/PAID-terminal items and CANCELLED/COMPLETED schedules are EXCLUDED from the forward part.
    input_set: "Invoices of the case's engagements by status; ACTIVE engagements' retainers; CONFIRMED schedules"
    constants: { TESTIMONY_MULT: 1.25 }
    precision: "integer cents"
    variants:
      - name: committed_forward_looking
        when: "Case.committed_cents"
        difference: "includes pending invoices, unspent retainer, and scheduled testimony estimates"
      - name: actual_chronological
        when: "Case.actuals_paid_cents"
        difference: "only PAID invoices; the two variants diverge whenever any spend is pending"

  - name: expert_composite_rating
    trigger: "recomputed on Evaluation creation; read via GET /litigation/experts/{id}"
    algorithm: weighted_scoring
    formula: |
      SIMPLE variant: rating_simple = round_half_up(mean(Evaluation.overall_score), 2); 0.0 when count == 0
      DECAYED variant:
        age_days = floor((now - Evaluation.evaluated_at) / 86400s)
        periods  = floor(age_days / 180)
        weight   = 0.5 ^ periods
        rating_decayed = round_half_up(sum(weight * overall_score) / sum(weight), 2); 0.0 when count == 0
      PROBATION TRIGGER: if evaluation_count >= 2 AND rating_decayed < 3.0 AND roster_status == ACTIVE: auto-transition ACTIVE -> PROBATION (cascade fires)
    input_set: "all Evaluation rows with expert_id == Expert.id (no status filter; evaluations are terminal records)"
    constants: { DECAY_BASE: 0.5, DECAY_PERIOD_DAYS: 180, PROBATION_THRESHOLD: 3.0, MIN_EVALUATIONS: 2 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: simple_average
        when: "Expert.rating_simple"
        difference: "unweighted mean"
      - name: recency_decayed
        when: "Expert.rating_decayed and the probation trigger"
        difference: "0.5^floor(age_days/180) weights; same evaluations yield a lower score when a recent poor evaluation dominates"

  - name: schedule_overlap_detection
    trigger: "POST /litigation/engagements/{id}/testimony-schedules (create) and POST /litigation/testimony-schedules/{id}/confirm (re-check)"
    algorithm: interval_merge
    formula: |
      EXPERT CALENDAR (resource = Engagement.expert_id), HALF-OPEN intervals [start_at, end_at):
        conflict iff existing.start_at < new.end_at AND new.start_at < existing.end_at
        over existing schedules with status in {PROPOSED, CONFIRMED} for the same expert
        ADJACENCY IS ALLOWED: new.start_at == existing.end_at does NOT conflict
      VENUE (resource = venue_id, only when venue_id present), CLOSED intervals with turnover buffer:
        effective = [start_at - 30min, end_at + 30min], both endpoints inclusive
        conflict iff eff_existing.start <= eff_new.end AND eff_new.start <= eff_existing.end
        over existing schedules with status in {PROPOSED, CONFIRMED} for the same venue
        TOUCHING CONFLICTS: new.start_at == existing.end_at + 30min still conflicts
    input_set: "TestimonySchedule rows in {PROPOSED, CONFIRMED}; same expert (calendar) or same venue (room)"
    constants: { TURNOVER_BUFFER_MINUTES: 30 }
    precision: "second-resolution timestamps; strictness differs per resource as pinned above"

  - name: cancellation_fee
    trigger: "POST /litigation/testimony-schedules/{id}/cancel on a CONFIRMED schedule"
    algorithm: threshold
    formula: |
      if now > start_at - 72h: fee = round_half_up(0.50 * estimated_hours * Engagement.hourly_rate_cents * 1.25, 2)
      else: fee = 0
      draw = min(fee, retainer_remaining_cents); retainer_drawn_cents += draw
      BOUNDARY: now == start_at - 72h exactly -> fee = 0 (condition is strict >)
    input_set: "the cancelled CONFIRMED schedule; engagement rate card; logical clock"
    constants: { CANCEL_FEE_PCT: 0.50, LATE_WINDOW_HOURS: 72, TESTIMONY_MULT: 1.25 }
    precision: "2 decimal places, round_half_up"

  - name: daubert_eligibility_bar
    trigger: "POST /litigation/engagements (creation gate)"
    algorithm: threshold
    formula: |
      if Expert.daubert_exclusion_count >= 3: reject ERR_EXPERT_DAUBERT_BARRED
      BOUNDARY: exclusion_count == 3 bars; == 2 passes
    input_set: "Expert.daubert_exclusion_count"
    constants: { MAX_DAUBERT_EXCLUSIONS: 3 }
    precision: "integer count; >= boundary"

validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Request body shape: required fields present, types correct, enum members valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role permitted for this endpoint per §1.5 roles; action-level role rules (e.g. only PlatformAdmin may WAIVE; only Expert owner may sign/counter)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path identifiers exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target entity in a state permitting the transition (all state-machine preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Conflict check for (request, expert) in {CLEARED, WAIVED} before engagement creation", error_id: ERR_CONFLICT_NOT_CLEARED, http_status: 409, applies_to: ["POST /litigation/engagements"] }
  - { priority: 7, category: business_safety, check: "Credential review for (request, expert) in {PASSED, PASSED_WITH_CONDITIONS} before engagement creation", error_id: ERR_CREDENTIAL_NOT_PASSED, http_status: 409, applies_to: ["POST /litigation/engagements"] }
  - { priority: 8, category: business_safety, check: "Expert roster_status == ACTIVE for new engagement (PROBATION/REMOVED barred)", error_id: ERR_EXPERT_ROSTER_INELIGIBLE, http_status: 422, applies_to: ["POST /litigation/engagements"] }
  - { priority: 9, category: business_safety, check: "Expert daubert_exclusion_count < 3 for new engagement", error_id: ERR_EXPERT_DAUBERT_BARRED, http_status: 422, applies_to: ["POST /litigation/engagements"] }
  - { priority: 10, category: business_safety, check: "Privilege tier gate on document delivery per DocumentProduction transition table", error_id: ERR_PRIVILEGE_TIER_BLOCKED, http_status: 422, applies_to: ["POST /litigation/document-productions/{id}/advance"] }
  - { priority: 11, category: business_safety, check: "Segregation of duties: invoice approver X-User-ID != Engagement.created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /litigation/invoices/{id}/approve"] }
  - { priority: 12, category: business_constraint, check: "EngagementRequest.status == READY for engagement creation", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /litigation/engagements"] }
  - { priority: 13, category: business_constraint, check: "No second Engagement with same (case_id, expert_id) in non-terminal status {DRAFT, PROPOSED, NEGOTIATING, SIGNED, ACTIVE}", error_id: ERR_DUPLICATE_CASE_ENGAGEMENT, http_status: 409, applies_to: ["POST /litigation/engagements"] }
  - { priority: 14, category: business_constraint, check: "Expert.active_engagement_count < Expert.max_concurrent_engagements for new engagement (== cap fails)", error_id: ERR_EXPERT_CAPACITY_FULL, http_status: 422, applies_to: ["POST /litigation/engagements"] }
  - { priority: 15, category: business_constraint, check: "No duplicate ConflictCheck or CredentialReview for the same (engagement_request_id, expert_id)", error_id: ERR_DUPLICATE_SCREENING, http_status: 409, applies_to: ["POST /litigation/engagement-requests/{id}/conflict-checks", "POST /litigation/engagement-requests/{id}/credential-reviews"] }
  - { priority: 16, category: business_constraint, check: "At most one Report per engagement in {DRAFT, IN_REVIEW, REVISION_REQUESTED, FINALIZED}", error_id: ERR_REPORT_ALREADY_ACTIVE, http_status: 409, applies_to: ["POST /litigation/engagements/{id}/reports"] }
  - { priority: 17, category: business_temporal, check: "end_at > start_at strictly (schedules); period_end >= period_start (invoices)", error_id: ERR_INVALID_INTERVAL, http_status: 422, applies_to: ["POST /litigation/engagements/{id}/testimony-schedules", "POST /litigation/engagements/{id}/invoices", "POST /litigation/invoices/{id}/resubmit"] }
  - { priority: 30, category: state, check: "Evaluation creation requires Engagement.status == CLOSED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /litigation/engagements/{id}/evaluations"] }
  - { priority: 18, category: business_temporal, check: "schedule start_at strictly > logical clock now", error_id: ERR_SCHEDULE_IN_PAST, http_status: 422, applies_to: ["POST /litigation/engagements/{id}/testimony-schedules", "POST /litigation/testimony-schedules/{id}/confirm"] }
  - { priority: 19, category: business_temporal, check: "Expert calendar half-open overlap (schedule_overlap_detection)", error_id: ERR_SCHEDULE_CONFLICT, http_status: 409, applies_to: ["POST /litigation/engagements/{id}/testimony-schedules", "POST /litigation/testimony-schedules/{id}/confirm"] }
  - { priority: 20, category: business_temporal, check: "Venue closed-interval + 30min turnover buffer overlap", error_id: ERR_VENUE_CONFLICT, http_status: 409, applies_to: ["POST /litigation/engagements/{id}/testimony-schedules", "POST /litigation/testimony-schedules/{id}/confirm"] }
  - { priority: 21, category: business_temporal, check: "report submit at logical now <= deadline_at", error_id: ERR_REPORT_DEADLINE_PASSED, http_status: 409, applies_to: ["POST /litigation/reports/{id}/submit"] }
  - { priority: 22, category: business_temporal, check: "report disclose at logical now < Case.trial_date", error_id: ERR_TRIAL_DATE_PASSED, http_status: 409, applies_to: ["POST /litigation/reports/{id}/disclose"] }
  - { priority: 23, category: business_constraint, check: "TRIAL-kind schedule confirm requires a report in {FINALIZED, DISCLOSED} on the engagement", error_id: ERR_REPORT_NOT_FINALIZED, http_status: 409, applies_to: ["POST /litigation/testimony-schedules/{id}/confirm"] }
  - { priority: 24, category: business_fiscal, check: "Invoice payload.total_cents == server recomputation (per-line rounding then sum + capped expense)", error_id: ERR_INVOICE_AMOUNT_MISMATCH, http_status: 422, applies_to: ["POST /litigation/engagements/{id}/invoices", "POST /litigation/invoices/{id}/resubmit"] }
  - { priority: 25, category: business_fiscal, check: "fund-retainer: retainer_funded_cents + amount_cents <= retainer_cents (equality completes funding)", error_id: ERR_RETAINER_OVERFUND, http_status: 422, applies_to: ["POST /litigation/engagements/{id}/fund-retainer"] }
  - { priority: 26, category: business_fiscal, check: "invoice approve: computed_total_cents <= budget remaining (equality passes)", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /litigation/invoices/{id}/approve"] }
  - { priority: 27, category: business_constraint, check: "engagement close blocked while non-terminal reports/schedules/invoices exist", error_id: ERR_ENGAGEMENT_NOT_CLOSABLE, http_status: 409, applies_to: ["POST /litigation/engagements/{id}/close"] }
  - { priority: 28, category: business_constraint, check: "case close blocked while any engagement non-terminal or any invoice non-terminal", error_id: ERR_CASE_NOT_CLOSABLE, http_status: 409, applies_to: ["POST /litigation/cases/{id}/close"] }
  - { priority: 29, category: business_constraint, check: "expert removal blocked while active_engagement_count > 0", error_id: ERR_EXPERT_HAS_ACTIVE_ENGAGEMENTS, http_status: 409, applies_to: ["POST /litigation/experts/{id}/roster-status"] }

endpoints:
  - { method: POST, path: "/litigation/experts", description: "Create roster expert", roles: [PlatformAdmin], code: 201, input: [full_name, specialty_area, "daubert_challenge_count?", "daubert_exclusion_count?", "max_concurrent_engagements?"], output: Expert, side_effects: [rating fields initialized to 0.0] }
  - { method: GET, path: "/litigation/experts", description: "Expertise search with filters and pagination", roles: [PlatformAdmin, CaseManager, ConflictAnalyst, CredentialAnalyst, BillingReviewer], code: 200, input: ["specialty_area?", "roster_status?", "limit?", "offset?"], output: "Expert[]", side_effects: [] }
  - { method: GET, path: "/litigation/experts/{id}", description: "Expert detail incl. computed ratings and active_engagement_count", roles: [PlatformAdmin, CaseManager, ConflictAnalyst, CredentialAnalyst, BillingReviewer, Expert], code: 200, input: [], output: Expert, side_effects: [] }
  - { method: POST, path: "/litigation/experts/{id}/roster-status", description: "Roster maintenance transition", roles: [PlatformAdmin], code: 200, input: [to_status, rationale], output: Expert, side_effects: [probation cascade per state machine] }
  - { method: GET, path: "/litigation/experts/{id}/conflict-checks", description: "Conflict checks for an expert", roles: [PlatformAdmin, CaseManager, ConflictAnalyst], code: 200, input: [], output: "ConflictCheck[]", side_effects: [] }
  - { method: GET, path: "/litigation/experts/{id}/credential-reviews", description: "Credential reviews for an expert", roles: [PlatformAdmin, CaseManager, CredentialAnalyst], code: 200, input: [], output: "CredentialReview[]", side_effects: [] }
  - { method: GET, path: "/litigation/experts/{id}/evaluations", description: "Evaluations for an expert", roles: [PlatformAdmin, CaseManager, BillingReviewer], code: 200, input: [], output: "Evaluation[]", side_effects: [] }
  - { method: POST, path: "/litigation/cases", description: "Open a litigation matter", roles: [CaseManager], code: 201, input: [case_number, court, title, budget_cents, trial_date, report_deadline], output: Case, side_effects: [status INTAKE] }
  - { method: GET, path: "/litigation/cases/{id}", description: "Case detail incl. actuals_paid_cents / committed_cents dual-variant fields", roles: [PlatformAdmin, CaseManager, BillingReviewer, Expert], code: 200, input: [], output: Case, side_effects: [] }
  - { method: POST, path: "/litigation/cases/{id}/budget-revisions", description: "Revise case budget (OCC; supersedes prior budget); increments Case.version by 1", roles: [CaseManager], code: 200, input: [new_budget_cents, reason, expected_case_version], output: Case, side_effects: [budget_cents := new_budget_cents, "increments Case.version by 1"] }
  - { method: POST, path: "/litigation/cases/{id}/close", description: "Close matter when all engagements and invoices are terminal", roles: [CaseManager], code: 200, input: [], output: Case, side_effects: [Case.status := CLOSED] }
  - { method: GET, path: "/litigation/cases/{id}/engagement-requests", description: "Sourcing requests for a case", roles: [PlatformAdmin, CaseManager, ConflictAnalyst, CredentialAnalyst], code: 200, input: [], output: "EngagementRequest[]", side_effects: [] }
  - { method: POST, path: "/litigation/engagement-requests", description: "Open an expert sourcing request on a case", roles: [CaseManager], code: 201, input: [case_id, specialty_area, "notes?"], output: EngagementRequest, side_effects: [Case INTAKE -> SOURCING auto-transition] }
  - { method: GET, path: "/litigation/engagement-requests/{id}", description: "Request detail", roles: [PlatformAdmin, CaseManager, ConflictAnalyst, CredentialAnalyst], code: 200, input: [], output: EngagementRequest, side_effects: [] }
  - { method: POST, path: "/litigation/engagement-requests/{id}/conflict-checks", description: "Open conflict screening for an expert under this request", roles: [ConflictAnalyst], code: 201, input: [expert_id, adverse_parties], output: ConflictCheck, side_effects: [request OPEN -> SCREENING] }
  - { method: GET, path: "/litigation/engagement-requests/{id}/conflict-checks", description: "Checks under a request", roles: [PlatformAdmin, CaseManager, ConflictAnalyst], code: 200, input: [], output: "ConflictCheck[]", side_effects: [] }
  - { method: POST, path: "/litigation/conflict-checks/{id}/resolve", description: "Resolve screening; WAIVED requires PlatformAdmin", roles: [ConflictAnalyst, PlatformAdmin], code: 200, input: [outcome, rationale], output: ConflictCheck, side_effects: [request READY predicate evaluation] }
  - { method: POST, path: "/litigation/engagement-requests/{id}/credential-reviews", description: "Open credential/Daubert review for an expert", roles: [CredentialAnalyst], code: 201, input: [expert_id], output: CredentialReview, side_effects: [request OPEN -> SCREENING] }
  - { method: GET, path: "/litigation/engagement-requests/{id}/credential-reviews", description: "Reviews under a request", roles: [PlatformAdmin, CaseManager, CredentialAnalyst], code: 200, input: [], output: "CredentialReview[]", side_effects: [] }
  - { method: POST, path: "/litigation/credential-reviews/{id}/resolve", description: "Record Daubert/credential outcome", roles: [CredentialAnalyst], code: 200, input: [outcome, "daubert_notes?"], output: CredentialReview, side_effects: [request READY predicate evaluation] }
  - { method: POST, path: "/litigation/engagements", description: "Create engagement letter terms for a screened expert", roles: [CaseManager], code: 201, input: [engagement_request_id, expert_id, hourly_rate_cents, retainer_cents, expense_cap_cents], output: Engagement, side_effects: [request READY -> FILLED, case_id denormalized from request, created_by_user_id recorded] }
  - { method: GET, path: "/litigation/engagements", description: "Engagement list with FK filters", roles: [PlatformAdmin, CaseManager, BillingReviewer, Expert], code: 200, input: ["case_id?", "expert_id?", "engagement_request_id?", "status?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/litigation/engagements/{id}", description: "Engagement detail incl. retainer ledger fields", roles: [PlatformAdmin, CaseManager, BillingReviewer, Expert], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/litigation/engagements/{id}/propose", description: "Propose terms (DRAFT->PROPOSED; NEGOTIATING->PROPOSED with optional new rate)", roles: [CaseManager], code: 200, input: ["hourly_rate_cents?"], output: Engagement, side_effects: [rate update when provided from NEGOTIATING] }
  - { method: POST, path: "/litigation/engagements/{id}/counter", description: "Expert counters the proposed rate", roles: [Expert], code: 200, input: [counter_rate_cents], output: Engagement, side_effects: [negotiation_round_count += 1] }
  - { method: POST, path: "/litigation/engagements/{id}/sign", description: "Expert signs engagement letter; executes NDA", roles: [Expert], code: 200, input: [], output: Engagement, side_effects: [nda_executed := true, Case SOURCING -> ENGAGED, expert active count recompute] }
  - { method: POST, path: "/litigation/engagements/{id}/fund-retainer", description: "Fund retainer; reaching exactly retainer_cents activates", roles: [CaseManager], code: 200, input: [amount_cents], output: Engagement, side_effects: [retainer_funded_cents += amount, SIGNED -> ACTIVE when fully funded] }
  - { method: POST, path: "/litigation/engagements/{id}/amend", description: "Amend rate/retainer/expense-cap terms (OCC; supersedes prior terms); increments Engagement.version by 1", roles: [CaseManager], code: 200, input: [expected_engagement_version, "hourly_rate_cents?", "retainer_cents?", "expense_cap_cents?", reason], output: Engagement, side_effects: [terms replaced, "increments Engagement.version by 1"] }
  - { method: POST, path: "/litigation/engagements/{id}/terminate", description: "Terminate engagement; cascades to schedules/reports/documents/invoices and refunds retainer", roles: [CaseManager], code: 200, input: [reason], output: Engagement, side_effects: [full termination cascade per state machine] }
  - { method: POST, path: "/litigation/engagements/{id}/close", description: "Close engagement after all deliverables terminal", roles: [CaseManager], code: 200, input: [], output: Engagement, side_effects: [expert active count recompute] }
  - { method: POST, path: "/litigation/engagements/{id}/document-productions", description: "Register document production to the expert", roles: [CaseManager], code: 201, input: [title, privilege_tier, content_ref], output: DocumentProduction, side_effects: [status REQUESTED] }
  - { method: GET, path: "/litigation/engagements/{id}/document-productions", description: "Productions for an engagement", roles: [PlatformAdmin, CaseManager, Expert], code: 200, input: [], output: "DocumentProduction[]", side_effects: [] }
  - { method: POST, path: "/litigation/document-productions/{id}/advance", description: "Advance production: DELIVER (CaseManager), ACKNOWLEDGE (Expert owner), RECALL (CaseManager)", roles: [CaseManager, Expert], code: 200, input: [action], output: DocumentProduction, side_effects: [privilege gate on DELIVER] }
  - { method: POST, path: "/litigation/engagements/{id}/reports", description: "Open expert report; deadline pinned from case", roles: [CaseManager], code: 201, input: [title, report_type], output: Report, side_effects: [deadline_at := Case.report_deadline, Case ENGAGED -> DISCOVERY] }
  - { method: GET, path: "/litigation/engagements/{id}/reports", description: "Reports for an engagement", roles: [PlatformAdmin, CaseManager, Expert], code: 200, input: [], output: "Report[]", side_effects: [] }
  - { method: POST, path: "/litigation/reports/{id}/submit", description: "Expert submits draft for review (deadline-gated)", roles: [Expert], code: 200, input: [], output: Report, side_effects: [submitted_at := now] }
  - { method: POST, path: "/litigation/reports/{id}/review", description: "Case manager review decision: FINALIZE or REQUEST_REVISION", roles: [CaseManager], code: 200, input: [decision, "notes?"], output: Report, side_effects: [branch per decision] }
  - { method: POST, path: "/litigation/reports/{id}/revise", description: "Expert returns revised draft (REVISION_REQUESTED -> DRAFT)", roles: [Expert], code: 200, input: [revision_notes], output: Report, side_effects: [revision_count += 1] }
  - { method: POST, path: "/litigation/reports/{id}/disclose", description: "Disclose finalized report (before trial date)", roles: [CaseManager], code: 200, input: [], output: Report, side_effects: [Case DISCOVERY -> TRIAL_PREP] }
  - { method: POST, path: "/litigation/engagements/{id}/testimony-schedules", description: "Propose deposition/trial session; overlap-checked", roles: [CaseManager], code: 201, input: [kind, start_at, end_at, estimated_hours, "venue_id?", "travel_required?"], output: TestimonySchedule, side_effects: [expert + venue overlap checks] }
  - { method: GET, path: "/litigation/engagements/{id}/testimony-schedules", description: "Schedules for an engagement", roles: [PlatformAdmin, CaseManager, Expert], code: 200, input: [], output: "TestimonySchedule[]", side_effects: [] }
  - { method: GET, path: "/litigation/venues/{id}/testimony-schedules", description: "Schedules occupying a venue", roles: [PlatformAdmin, CaseManager], code: 200, input: [], output: "TestimonySchedule[]", side_effects: [] }
  - { method: POST, path: "/litigation/testimony-schedules/{id}/confirm", description: "Confirm session (re-checks overlaps, TRIAL requires finalized report)", roles: [CaseManager], code: 200, input: [], output: TestimonySchedule, side_effects: [Case.committed_cents recompute] }
  - { method: POST, path: "/litigation/testimony-schedules/{id}/cancel", description: "Cancel session; late cancel draws fee from retainer", roles: [CaseManager], code: 200, input: ["reason?"], output: TestimonySchedule, side_effects: [cancellation_fee per calculation] }
  - { method: POST, path: "/litigation/testimony-schedules/{id}/complete", description: "Mark session completed with actual hours", roles: [CaseManager], code: 200, input: [actual_hours], output: TestimonySchedule, side_effects: [actual_hours recorded] }
  - { method: POST, path: "/litigation/venues", description: "Register a deposition venue", roles: [PlatformAdmin], code: 201, input: [name, location, "capacity?"], output: Venue, side_effects: [] }
  - { method: GET, path: "/litigation/venues/{id}", description: "Venue detail", roles: [PlatformAdmin, CaseManager], code: 200, input: [], output: Venue, side_effects: [] }
  - { method: POST, path: "/litigation/engagements/{id}/invoices", description: "Expert submits invoice; server recomputes total", roles: [Expert], code: 201, input: [period_start, period_end, line_items, "travel_expense_cents?", total_cents], output: Invoice, side_effects: [computed_total_cents; ERR_INVOICE_AMOUNT_MISMATCH on divergence] }
  - { method: GET, path: "/litigation/engagements/{id}/invoices", description: "Invoices for an engagement", roles: [PlatformAdmin, CaseManager, BillingReviewer, Expert], code: 200, input: ["status?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/litigation/invoices/{id}/approve", description: "Approve invoice against budget; draws retainer", roles: [BillingReviewer], code: 200, input: [], output: Invoice, side_effects: [retainer drawdown, case aggregates recompute] }
  - { method: POST, path: "/litigation/invoices/{id}/dispute", description: "Dispute invoice", roles: [BillingReviewer], code: 200, input: [reason], output: Invoice, side_effects: [dispute_count += 1] }
  - { method: POST, path: "/litigation/invoices/{id}/resubmit", description: "Expert resubmits adjusted invoice (cycle)", roles: [Expert], code: 200, input: [line_items, "travel_expense_cents?", total_cents], output: Invoice, side_effects: [recompute totals] }
  - { method: POST, path: "/litigation/invoices/{id}/settle", description: "Settle: PAID from APPROVED; REJECTED from DISPUTED", roles: [BillingReviewer], code: 200, input: [outcome], output: Invoice, side_effects: [case actuals/committed recompute] }
  - { method: POST, path: "/litigation/engagements/{id}/evaluations", description: "Post-case evaluation of the expert", roles: [CaseManager], code: 201, input: [overall_score, "quality_score?", "timeliness_score?", "testimony_score?", "comments?"], output: Evaluation, side_effects: [rating recompute; probation cascade when decayed < 3.0 with >= 2 evaluations] }
  - { method: GET, path: "/litigation/engagements/{id}/evaluations", description: "Evaluations recorded on an engagement", roles: [PlatformAdmin, CaseManager, BillingReviewer], code: 200, input: [], output: "Evaluation[]", side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: [logical clock advanced] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum member" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint or action (e.g. ConflictAnalyst attempting WAIVED; Expert countering another expert's engagement)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity state does not permit the requested transition" }
  - { id: ERR_CONFLICT_NOT_CLEARED, http: 409, condition: "Engagement creation with conflict check not in {CLEARED, WAIVED}" }
  - { id: ERR_CREDENTIAL_NOT_PASSED, http: 409, condition: "Engagement creation with credential review not in {PASSED, PASSED_WITH_CONDITIONS}" }
  - { id: ERR_EXPERT_ROSTER_INELIGIBLE, http: 422, condition: "Engagement creation for expert in PROBATION or REMOVED" }
  - { id: ERR_EXPERT_DAUBERT_BARRED, http: 422, condition: "Engagement creation for expert with daubert_exclusion_count >= 3" }
  - { id: ERR_PRIVILEGE_TIER_BLOCKED, http: 422, condition: "Delivery violates privilege-tier gate for the engagement's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Invoice approver is the CaseManager who created the engagement" }
  - { id: ERR_DUPLICATE_CASE_ENGAGEMENT, http: 409, condition: "Non-terminal engagement already exists for (case_id, expert_id)" }
  - { id: ERR_EXPERT_CAPACITY_FULL, http: 422, condition: "active_engagement_count == max_concurrent_engagements at engagement creation" }
  - { id: ERR_DUPLICATE_SCREENING, http: 409, condition: "Second ConflictCheck/CredentialReview for same (request, expert)" }
  - { id: ERR_REPORT_ALREADY_ACTIVE, http: 409, condition: "Non-terminal report already exists on the engagement" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "Schedule end_at <= start_at" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "Schedule start_at <= logical clock now at create/confirm" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Expert calendar half-open overlap with existing PROPOSED/CONFIRMED session" }
  - { id: ERR_VENUE_CONFLICT, http: 409, condition: "Venue closed-interval + 30min turnover buffer overlap" }
  - { id: ERR_REPORT_DEADLINE_PASSED, http: 409, condition: "Report submit with logical now > deadline_at" }
  - { id: ERR_TRIAL_DATE_PASSED, http: 409, condition: "Report disclose with logical now >= Case.trial_date" }
  - { id: ERR_REPORT_NOT_FINALIZED, http: 409, condition: "TRIAL schedule confirm without a FINALIZED/DISCLOSED report" }
  - { id: ERR_INVOICE_AMOUNT_MISMATCH, http: 422, condition: "Declared total_cents != server recomputation" }
  - { id: ERR_RETAINER_OVERFUND, http: 422, condition: "Funding would push retainer_funded_cents above retainer_cents" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Approval would push approved+paid totals above Case.budget_cents" }
  - { id: ERR_ENGAGEMENT_NOT_CLOSABLE, http: 409, condition: "Close blocked by non-terminal reports/schedules/invoices" }
  - { id: ERR_CASE_NOT_CLOSABLE, http: 409, condition: "Close blocked by non-terminal engagements or invoices" }
  - { id: ERR_EXPERT_HAS_ACTIVE_ENGAGEMENTS, http: 409, condition: "Removal blocked while active_engagement_count > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }

roles:
  - name: PlatformAdmin
    description: "Litigation support firm administrator; venues, roster maintenance, conflict waivers, clock"
    identity: opaque
    exclusive_operations: [create venue, roster-status transitions, WAIVE conflict check, set clock]
    shared_operations: [read access to all resources]
  - name: CaseManager
    description: "Firm staff managing matters, engagements, productions, reports, schedules, evaluations"
    identity: opaque
    exclusive_operations: [create case, budget revisions, engagement lifecycle propose/terminate/close, document production, report review/disclose, schedule management, evaluations]
    shared_operations: [read access to all resources]
  - name: ConflictAnalyst
    description: "Runs conflict screening; cannot waive flags (segregation of duties)"
    identity: opaque
    exclusive_operations: [create conflict check, resolve to CLEARED/FLAGGED]
    shared_operations: [read experts, requests, checks]
  - name: CredentialAnalyst
    description: "Runs credential/Daubert review"
    identity: opaque
    exclusive_operations: [create credential review, resolve review]
    shared_operations: [read experts, requests, reviews]
  - name: BillingReviewer
    description: "Reviews invoices against budget; cannot approve invoices on engagements created by the same user (segregation of duties)"
    identity: opaque
    exclusive_operations: [approve, dispute, settle invoices]
    shared_operations: [read cases, engagements, invoices]
  - name: Expert
    description: "Roster expert witness acting on own engagements"
    identity: entity_backed:Expert
    exclusive_operations: [counter, sign, submit/revise reports, acknowledge productions, submit/resubmit invoices]
    shared_operations: [read own expert record, own engagements]
