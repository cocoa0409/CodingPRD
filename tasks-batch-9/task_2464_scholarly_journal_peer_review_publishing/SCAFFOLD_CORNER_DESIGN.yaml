        excluded_because:
          difficulty_instance: cross_entity_state_dependency / decision_blocked_by_open_high_severity_ethics_case
          rationale: "The cross-entity guard (decision allowed only when no HIGH unresolved EthicsCase exists) is the whole subject of that §1.8 instance, including the post-resolution success path."
  - section: calculations
    instances:
      - name: plagiarism_similarity_at_twenty_flags_but_still_advances
        claim_type: constants_applied
        grounds:
          - calculations.integrity_verdict_rollup
          - entities.IntegrityScreening.fields.verdict
          - entities.Manuscript.fields.integrity_status
        distinguishing_aspect: |
          The FLAG band is closed at its lower edge and the BLOCK band starts above 40.0: a
          similarity_pct of exactly 20.0 yields verdict FLAG (not PASS, not BLOCK), sets the
          manuscript integrity_status to FLAG, and a FLAG does not stop ADVANCE_TO_REVIEW.
        test_recipe:
          setup:
            - "One journal, one chief editor, one handling editor with max_concurrent_assignments 3, one author and one submitted ONCOLOGY manuscript."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Thresholds", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "chief@soc.org", full_name: "Chief Editor", affiliation: "Univ Alpha", subject_areas: ["ONCOLOGY"], role_level: "CHIEF" }
              as: SystemAdmin
              captures: { ed_chief_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "he1@soc.org", full_name: "Handling One", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING", max_concurrent_assignments: 3 }
              as: SystemAdmin
              captures: { ed_h1_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Boundary Similarity Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 16, figure_count: 2, data_availability_statement: "Data at repository DOI 10.9999/bs" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 20.0 }
              as: SystemAdmin
              captures: { scr_id: $.data.id }
            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /editor-assignments/${ea_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
          assert:
            - "HTTP 201 on the screening and HTTP 200 on the screening-decision"
            - "IntegrityScreening.${scr_id}.verdict == FLAG"
            - "IntegrityScreening.${scr_id}.manipulated_figure_count == 0"
            - "Manuscript.${m_id}.integrity_status == FLAG"
            - "Manuscript.${m_id}.status == UNDER_REVIEW"

      - name: image_forensics_block_opens_high_severity_integrity_case
        claim_type: aggregation
        grounds:
          - calculations.integrity_verdict_rollup
          - state_machines.EthicsCase.initial_state
          - entities.EthicsCase.fields.opened_by
        distinguishing_aspect: |
          For IMAGE_FORENSICS the verdict is driven by manipulated_figure_count rather than
          similarity_pct: two manipulated figures give BLOCK and auto-open exactly one
          IMAGE_INTEGRITY EthicsCase at HIGH severity with opened_by SCREENING_CASCADE,
          even though similarity_pct is 0.0 (a PASS band on the plagiarism scale).
        test_recipe:
          setup:
            - "One journal, one chief editor, one handling editor and one submitted ONCOLOGY manuscript with no screenings yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Image Integrity", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
