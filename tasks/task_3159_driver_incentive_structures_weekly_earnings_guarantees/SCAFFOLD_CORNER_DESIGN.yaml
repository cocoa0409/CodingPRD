        distinguishing_aspect: "PUT /markets/{id} with expected_market_version one behind returns 412; a retry with the current version succeeds and increments version by exactly 1."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market HHH budget 1000000."
          setup_api_calls:
