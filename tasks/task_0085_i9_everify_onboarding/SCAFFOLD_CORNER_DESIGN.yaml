              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "IM", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
              captures: { st: $.data.status }
          assert:
            - "Onboarding.${ob}.status == SECTION2_COMPLETE (in the same response body)"
