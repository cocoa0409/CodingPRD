      - name: point_submission_legs_fork_and_join_at_recorded
        claim_type: branching
        grounds:
          - state_machines.PointSubmission
          - endpoints.POST_/point-submissions/{id}/acknowledgement
          - calculations.rider_standing_points.variants.national_scale
          - calculations.rider_standing_points.variants.regional_scale
        distinguishing_aspect: |
          PointSubmission forks into two independent standings legs and only joins at
          RECORDED. Acknowledging the REGIONAL leg alone must credit regional points
