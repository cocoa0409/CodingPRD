  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_policy_and_notice_at_period_end_returns_state_error
        grounds:
          - validations[priority=44]
          - validations[priority=62]
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - state_machines.Claim.null_to_NOTICED
          - calculations.cancellation_return_premium
        distinguishing_aspect: |
          A claim notice on a CANCELLED policy at an instant that is also outside the claims-made
          window violates priority 44 (category state) and priority 62 (category business_temporal)
          in the same request. The lower priority number wins, so the response is 409
          ERR_INVALID_POLICY_STATE and never the 422 ERR_NOTICE_OUTSIDE_PERIOD that the same clock
          produces on a policy whose coverage_status is still acceptable.
