          trigger:
            - call: POST /cell-designs/${draft_design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
              captures: { err_design_state: "$.data.error_id" }
            - call: POST /production-lots
              as: ProductionSupervisor
