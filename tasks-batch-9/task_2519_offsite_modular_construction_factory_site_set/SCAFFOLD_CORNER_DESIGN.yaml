  # ===========================================================================
  - section: endpoints
    instances:
      - name: factory_crud_create_read_list_and_line_state_update_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /modular/factories]
          - endpoints[GET /modular/factories/{factoryId}]
          - endpoints[GET /modular/factories]
          - endpoints[PATCH /modular/factories/{factoryId}/line-state]
        distinguishing_aspect: |
          Factory is the only entity with all four CRUD-shaped surfaces, and the update surface is a
          narrow PATCH that accepts one field. The round trip must show the filter isolating one of
          two rows and the PATCH bumping only the target's version — and no DELETE surface exists
          anywhere in §1.5, so nothing may be removable.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; no fixtures required"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id", v1: "$.data.version" }
            - call: "POST /modular/factories"
              payload: { name: "Columbia Modular Plant 2", code: "PMP2", takt_minutes: 120, station_count: 4, parallel_station_capacity: 1, wip_unit_value_cents: 6000000, shift_start_minute_of_day: 300, shift_minutes_per_day: 600, line_state: "PAUSED" }
              as: ProgramAdmin
              captures: { fac2: "$.data.id", ls2: "$.data.line_state", sm2: "$.data.shift_minutes_per_day" }
            - call: "GET /modular/factories/${fac}"
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { code1: "$.data.code", takt1: "$.data.takt_minutes" }
            - call: "GET /modular/factories"
              payload: { code: "PMP2", limit: 10, offset: 0 }
              as: ProgramAdmin
              captures: { f0: "$.data[0].code", f0id: "$.data[0].id" }
            - call: "PATCH /modular/factories/${fac}/line-state"
              payload: { line_state: "PAUSED" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { ls1: "$.data.line_state", v2: "$.data.version" }
          assert:
            - "${code1} == 'PMP1' and ${takt1} == 90 — the read returns what the create stored"
            - "${ls2} == 'PAUSED' and ${sm2} == 600 — declared optional inputs override their defaults"
            - "${f0} == 'PMP2' with ${f0id} == ${fac2} and total_count == 1 — the code filter excludes PMP1"
            - "${v1} == 1 and ${v2} == 2 with ${ls1} == 'PAUSED' — PATCH bumps the version of PMP1 only; GET /modular/factories/${fac2} still reports version 1"
            - "§1.5 declares no DELETE endpoint for any entity, so neither factory can be removed"

