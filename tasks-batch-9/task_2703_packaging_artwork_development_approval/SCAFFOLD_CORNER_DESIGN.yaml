      - name: priority_conflict_between_two_simultaneously_violated_rules
        claim_type: priority_conflict
        grounds:
          - validations[priority=24]
          - validations[priority=36]
          - validations[priority=46]
          - validations[priority=55]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_invalid_outranks_mandatory_element_failed_on_submit
          rationale: "§1.8 rule 5 is this pattern by construction: both of its instances violate exactly two rules and assert that only the lower priority number surfaces, with the second pairing (46 over 55) carried by the sibling instance."

      - name: temporal_validation_of_overlapping_windows
        claim_type: temporal_validation
        grounds:
          - validations[priority=52]
          - validations[priority=53]
          - errors[ERR_PRESS_CHECK_OVERLAP]
          - errors[ERR_CLAIM_CLEARANCE_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / press_check_buffer_blocks_a_three_hour_gap_but_admits_a_four_hour_one
          rationale: "Both temporal rules are §1.8 rule 8's subject: the buffered press-check comparison and the unbuffered clearance-interval comparison, each probed on both sides of the boundary."

  # ==========================================================================
  # §1.9 breadth walk, section 6 of 9: endpoints.
  # Rows covered: standard_crud (twice - the two PATCH endpoints, whose partial-
  # update and no-recompute contracts are different), action_endpoint (the four
  # ErrorEscape actions), bulk_action (the depletion batch), cross_reference_link
  # (the three-parent plate order plus the four dangling-id 404s), computed_read
  # (asset_count and the per-row constant lookup). conditional_action is excluded
  # to a §1.8 instance.
  # ==========================================================================
  - section: endpoints
    instances:

      - name: patch_brief_overwrites_only_the_supplied_fields_and_rejects_unknown_keys_once_approved
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /briefs/{id}]
          - entities.Brief.fields.product_name
          - entities.Brief.fields.market_codes
          - entities.Brief.fields.language_codes
          - entities.Brief.fields.net_contents_declaration
          - entities.Brief.fields.status
          - validations[priority=17]
          - validations[priority=23]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_BRIEF_STATE_INVALID]
          - state_machines.Brief.DRAFT_to_APPROVED
        distinguishing_aspect: |
          A partial update is only correct if the fields NOT supplied survive
          untouched, so the recipe patches exactly two of the six editable fields and
          then reads back the four it never mentioned - an implementation that
          rebuilds the row from the request body nulls language_codes,
          required_element_codes and net_contents_declaration. Two further
          falsifiers ride along on the same row: an unknown field must be a 400
          rather than a silently ignored key (and must leave the version where it
          was, proving the write never started), and the DRAFT gate must close the
          endpoint after the regulatory approval with 409 ERR_BRIEF_STATE_INVALID -
          not 403 (the coordinator role is still authorised) and not 200.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One Brief SKU-1001 created and deliberately LEFT in DRAFT so the PATCH gate is open."
            - "The brief covers market_codes [US], language_codes [en], seven required element codes and net contents 340 g / 12 oz."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
          trigger:
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "PATCH /briefs/${brief_id}"
              payload: {product_name: "Northgate Cocoa Carton 340g Relaunch", market_codes: ["US", "CA"]}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "PATCH /briefs/${brief_id}"
              payload: {product_name: "Northgate Cocoa Carton 340g Relaunch", promo_flag: true}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "PATCH /briefs/${brief_id}"
              payload: {product_name: "Northgate Cocoa Carton 340g Relaunch v2"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
          assert:
            - "the baseline GET returns 200 with product_name == Northgate Cocoa Carton 340g, market_codes == [US], status == DRAFT and version == 1"
            - "the first PATCH returns 200 with product_name == Northgate Cocoa Carton 340g Relaunch and market_codes == [US, CA] - both supplied fields overwritten"
            - "the same PATCH response still carries language_codes == [en], required_element_codes with exactly 7 entries in the order NET_CONTENTS, INGREDIENT_STATEMENT, ALLERGEN_STATEMENT, DATE_CODE_ZONE, BARCODE, RECYCLING_MARK, ADDRESS_BLOCK, structural_spec.component_type == CARTON and net_contents_declaration.metric_value == 340 - the four unsupplied fields are neither nulled nor emptied"
            - "the PATCH response reports version == 2 (exactly one increment) and updated_at == 2026-08-01T00:00:00Z"
            - "the follow-up GET returns byte-identical field values to the PATCH response (read-your-writes)"
            - "the PATCH carrying the unknown field promo_flag returns 400 ERR_INVALID_REQUEST per validations[priority=17]"
            - "a GET after that rejected PATCH still reports version == 2 and product_name == Northgate Cocoa Carton 340g Relaunch - the rejected request wrote nothing"
            - "the regulatory decision returns 200 with status == APPROVED, approved_by_user_id == u_reg, approved_at == 2026-08-01T00:00:00Z and version == 3"
            - "the final PATCH returns 409 ERR_BRIEF_STATE_INVALID per validations[priority=23] - and NOT 403, because PackagingCoordinator is a permitted role on this endpoint"
            - "a closing GET still reports version == 3 and product_name == Northgate Cocoa Carton 340g Relaunch"

      - name: patch_of_a_revision_requested_version_rewrites_the_payload_without_rescoring_it
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /artwork-versions/{id}]
          - entities.ArtworkVersion.fields.mandatory_elements
          - entities.ArtworkVersion.fields.reason_for_change_code
          - entities.ArtworkVersion.fields.change_description
          - entities.ArtworkVersion.fields.compliance_score
          - entities.ArtworkVersion.fields.check_run_no
          - entities.ArtworkVersion.fields.failed_element_count
          - calculations.mandatory_element_compliance_score.trigger
          - state_machines.ArtworkVersion.REVISION_REQUESTED_to_REVISION_REQUESTED
        distinguishing_aspect: |
          The edit endpoint and the scoring endpoint are deliberately separate, and
          this pins the seam: the PATCH repairs the very element that failed
          verification, yet compliance_score, failed_element_count and check_run_no
          must all stay frozen at the pre-fix figures (75.0 / 1 / 1) until
          verify-elements is called again, at which point they move to 100.0 / 0 / 2.
          An implementation that recomputes inside PATCH shows 100.0 one call too
          early; one that also advances the state shows DRAFT or ELEMENTS_VERIFIED
          instead of REVISION_REQUESTED. The PATCH is exercised from
          REVISION_REQUESTED (not DRAFT) because that is the state where an
          implementation is most tempted to fold the edit and the re-score together.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; brief SKU-1001 APPROVED under FDA_FOOD."
            - "One US CARTON asset with a single language [en], so the market and language penalties are both 0."
            - "Version v1 authored with allergen_emphasis false - the ALLERGEN_STATEMENT element is CRITICAL, weight 25, so the verified score is 100.0 - 25 == 75.0 and the version is submittable (75.0 >= the 70.0 floor)."
            - "v1 was submitted and then REJECTED by the stage-1 BRAND reviewer, so it sits in REVISION_REQUESTED with revision_cycle_count 1 and check_run_no 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork for the US carton."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: false }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Mandatory element verification run."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
              payload: {submit_note: "Route through brand, regulatory, legal and quality."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes"
              payload: {artwork_version_id: "${v1_id}", status: "IN_PROGRESS"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { r_1: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "BRAND"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_brand: "$.data[0].id" }
            - call: "POST /review-tasks/${t_1_brand}/decision"
              payload: {decision: "REJECTED", comment: "Logo lock-up clears the allergen panel; revise."}
              as: BrandReviewer
              as_user_id: "u_brand"
          trigger:
            - call: "GET /artwork-versions/${v1_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "PATCH /artwork-versions/${v1_id}"
              payload:
                reason_for_change_code: "ERROR_CORRECTION"
                change_description: "Allergen statement re-set with emphasis after the brand rejection."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Re-verification after the allergen fix."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-versions/${v1_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
          assert:
            - "the baseline GET returns 200 with state == REVISION_REQUESTED, compliance_score == 75.0, failed_element_count == 1, waived_element_count == 0, check_run_no == 1 and revision_cycle_count == 1"
            - "the PATCH returns 200 with mandatory_elements.allergen_statement.allergen_emphasis == true, reason_for_change_code == ERROR_CORRECTION and change_description == Allergen statement re-set with emphasis after the brand rejection."
            - "that same PATCH response still reports compliance_score == 75.0, failed_element_count == 1 and check_run_no == 1 - the edit does not re-run verification"
            - "the PATCH response reports state == REVISION_REQUESTED (unchanged) and version exactly 1 greater than the version in the baseline GET"
            - "the verify-elements call returns 200 with compliance_score == 100.0, failed_element_count == 0, waived_element_count == 0 and check_run_no == 2 - the score moves only when verification re-runs"
            - "the verify-elements response reports state == REVISION_REQUESTED, i.e. re-verifying a rejected version is a self-loop and does not re-open it for edit"
            - "the closing GET agrees with the verify-elements response on all five recomputed fields"

      - name: escape_action_endpoints_walk_dispute_revision_and_writeoff_without_touching_the_printer
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /error-escapes/{id}/dispute]
          - endpoints[POST /error-escapes/{id}/root-cause]
          - endpoints[POST /error-escapes/{id}/recovery-claim]
          - endpoints[POST /error-escapes/{id}/settle]
          - state_machines.ErrorEscape.RECOVERY_CLAIMED_to_DISPUTED
          - state_machines.ErrorEscape.DISPUTED_to_ROOT_CAUSE_ASSIGNED
          - state_machines.ErrorEscape.RECOVERY_CLAIMED_to_WRITTEN_OFF
          - calculations.cost_recovery_amount.variants.PROVISIONAL
          - entities.ErrorEscape.fields.dispute_count
          - entities.ErrorEscape.fields.recovery_variance_cents
          - entities.ErrorEscape.fields.liability_cap_applied
          - entities.Printer.fields.performance_score
          - entities.Printer.fields.recovery_balance_cents
          - entities.Printer.fields.certification_status
        distinguishing_aspect: |
          Four action endpoints in a row, each with a declared side effect that a
          thin CRUD implementation omits: dispute must increment dispute_count (0 ->
          1) as well as flip the state; the revised root-cause must CLEAR
          provisional_recovery_cents and liability_cap_applied, so the second claim
          is computed from scratch rather than patched; the re-raised claim must be
          348500, not the 697000 of the first pass, proving the 0.50 share is applied
          per line; and the WRITTEN_OFF settlement must write
          recovery_variance_cents == 0 - 348500 == -348500 while leaving the printer
          scorecard at 100.0 and the recovery ledger at 0 - the single most likely
          bug is treating a write-off like a settlement and posting the money or the
          penalty anyway.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Version v1 of a US CARTON asset (standard_unit_cost_cents 42) approved, proofed (delta-E 1.2 against a 2.0 COATED_PAPER tolerance, substrate approved) and RELEASED_TO_PRINT."
            - "Printer Cascade Print Co created CERTIFIED with performance_score 100.0, recovery_balance_cents 0 and recovery_liability_cap_cents 5000000."
            - "An escape is opened at discovered_stage PACKING (an EARLY stage, investigation fee 60000) over 13000 units."
            - "First apportionment PRINTER / 1.00 and a first recovery claim: 13000*42 == 546000 reprint + 13000*7 == 91000 scrap + 0 freight + 60000 investigation == 697000, below the 5000000 cap, so the escape sits in RECOVERY_CLAIMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Mandatory element verification run."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
              payload: {submit_note: "Route through brand, regulatory, legal and quality."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes"
              payload: {artwork_version_id: "${v1_id}", status: "IN_PROGRESS"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { r_1: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "BRAND"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_brand: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "REGULATORY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_reg: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "LEGAL"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_legal: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "QUALITY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
