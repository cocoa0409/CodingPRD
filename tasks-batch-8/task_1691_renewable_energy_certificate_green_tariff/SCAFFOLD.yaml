scenario: |
  Renewable Energy Certificate & Green Tariff Administration (green power program administrator): generator registration & meter attestation, REC minting & serial tracking, retirement vs transfer & double-counting prevention, customer subscription & bill credit calculation, compliance vs voluntary market classification, vintage & geographic eligibility rules, broker transaction settlement, annual claim reporting

domain_name: renewable-rec-green-tariff
api_prefix: /greenpower

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Generator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the generation facility owner" }
      - { name: facility_code, type: string, source: input, description: "Unique facility code used in certificate serial prefix", constraints: "unique across all generators" }
      - { name: technology, type: enum, source: input, description: "Generation technology", constraints: "one of SOLAR, WIND, HYDRO, BIOMASS, GEOTHERMAL" }
      - { name: nameplate_capacity_kw, type: integer, source: input, description: "Nameplate capacity in kW", constraints: "> 0" }
      - { name: region_code, type: string, source: input, description: "Balancing authority / grid region code, e.g. CAISO, ERCOT, PJM" }
      - { name: commissioning_date, type: string, source: input, description: "Date facility was commissioned (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: REGISTERED, constraints: "one of REGISTERED, VERIFICATION, ACTIVE, REJECTED, SUSPENDED, DECOMMISSIONED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason set when verification is rejected", default: null }
      - { name: cumulative_accepted_kwh, type: integer, source: computed, description: "Sum of metered_kwh over MeterReadings currently in ACCEPTED status for this generator (voided readings removed)", default: 0 }
      - { name: carryover_kwh, type: integer, source: computed, description: "Un-minted kWh remainder carried toward the next mint run; resets to 0 at calendar-year boundaries inside a mint run", default: 0 }
      - { name: lifetime_minted_mwh, type: integer, source: computed, description: "Total whole MWh minted as certificates minus any revoked quantity", default: 0 }
      - { name: next_serial, type: integer, source: computed, description: "Next unissued serial number in this generator's serial space; starts at 1", default: 1 }

  - name: MeterReading
    parent: null
    common_fields: true
    fields:
      - { name: generator_id, type: string, source: input, description: "FK -> Generator.id; generator this reading belongs to" }
      - { name: period_start, type: datetime, source: input, description: "Start of metered period (inclusive), ISO 8601 UTC" }
      - { name: period_end, type: datetime, source: input, description: "End of metered period (exclusive), ISO 8601 UTC; must be strictly after period_start and not after the logical clock" }
      - { name: metered_kwh, type: integer, source: input, description: "Metered energy in whole kWh", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Attestation lifecycle", default: SUBMITTED, constraints: "one of SUBMITTED, ATTESTED, REJECTED, ACCEPTED, VOIDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the GeneratorOperator who submitted the reading" }
      - { name: attested_by_user_id, type: string, source: system, description: "X-User-ID of the MeterAttester who attested the reading", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on rejection", default: null }
      - { name: minted, type: boolean, source: computed, description: "True once a mint run has consumed this reading", default: false }
      - { name: minted_vintage_month, type: string, source: system, description: "YYYY-MM vintage bucket this reading's kWh were minted under (period_start's month)", default: null }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_type, type: enum, source: input, description: "Registry account kind", constraints: "one of GENERATOR, BROKER, PROGRAM" }
      - { name: owner_name, type: string, source: input, description: "Display name of the account holder" }
      - { name: generator_id, type: string, source: input, description: "FK -> Generator.id; required iff account_type == GENERATOR", default: null }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; required iff account_type == PROGRAM", default: null }
      - { name: status, type: enum, source: system, description: "Account standing", default: ACTIVE, constraints: "one of ACTIVE, SUSPENDED" }
      - { name: failure_strikes, type: integer, source: computed, description: "Count of settlement failures attributed to this account; reaching STRIKE_LIMIT (3) auto-suspends the account; reset to 0 on reinstate", default: 0 }
      - { name: active_holdings_mwh, type: integer, source: computed, description: "Sum of quantity_mwh over Certificates with account_id == this account and status == ACTIVE", default: 0 }
      - { name: locked_holdings_mwh, type: integer, source: computed, description: "Sum of quantity_mwh over Certificates with account_id == this account and status == LOCKED", default: 0 }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: generator_id, type: string, source: system, description: "FK -> Generator.id; minting generator" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; current holder account" }
      - { name: vintage_month, type: string, source: computed, description: "YYYY-MM generation month of the underlying kWh" }
      - { name: region_code, type: string, source: computed, description: "Snapshot of Generator.region_code at mint time; later generator region changes never alter it" }
      - { name: technology, type: enum, source: computed, description: "Snapshot of Generator.technology at mint time" }
      - { name: serial_prefix, type: string, source: computed, description: "Serial namespace '<facility_code>-<vintage_month>'" }
      - { name: serial_start, type: integer, source: computed, description: "First serial in this batch's contiguous range (inclusive)" }
      - { name: serial_end, type: integer, source: computed, description: "Last serial in this batch's contiguous range (inclusive); serial_end == serial_start + quantity_mwh - 1" }
      - { name: quantity_mwh, type: integer, source: computed, description: "Whole REC units in this batch", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Disposition lifecycle", default: ACTIVE, constraints: "one of ACTIVE, LOCKED, RETIRED, REVOKED" }

  - name: Trade
    parent: null
    common_fields: true
    fields:
      - { name: from_account_id, type: string, source: input, description: "FK -> Account.id; seller account (must be BROKER type, owned by the proposing BrokerTrader)" }
      - { name: to_account_id, type: string, source: input, description: "FK -> Account.id; buyer account (must be BROKER type)" }
      - { name: items, type: array, source: input, description: "Array of trade item objects {certificate_id, quantity_mwh}; each certificate_id references a Certificate that must be ACTIVE and held by from_account_id; 1 <= quantity_mwh <= that certificate's quantity_mwh" }
      - { name: unit_price_cents_per_mwh, type: integer, source: input, description: "Single unit price applied to every item line", constraints: "> 0" }
      - { name: settlement_mode, type: enum, source: input, description: "GROSS = buyer pays lines + broker fee on top, seller receives full line total; NET = buyer pays line total only, broker fee deducted from seller proceeds", constraints: "one of GROSS, NET" }
      - { name: status, type: enum, source: system, description: "Settlement lifecycle", default: PROPOSED, constraints: "one of PROPOSED, ACCEPTED, SETTLED, FAILED, CANCELLED, EXPIRED" }
      - { name: proposed_at, type: datetime, source: system, description: "Logical-clock timestamp of proposal" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance", default: null }
      - { name: settlement_deadline, type: datetime, source: system, description: "accepted_at + SETTLEMENT_WINDOW_DAYS (5); settle allowed while now <= deadline", default: null }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp of settlement", default: null }
      - { name: total_line_cents, type: integer, source: computed, description: "Sum over items of quantity_mwh * unit_price_cents_per_mwh (exact integer arithmetic)", default: null }
      - { name: broker_fee_cents, type: integer, source: computed, description: "Sum of per-line fees; each line fee = round_half_up(line_cents * fee_bps(line quantity) / 10000)", default: null }
      - { name: buyer_total_cents, type: integer, source: computed, description: "GROSS: total_line_cents + broker_fee_cents; NET: total_line_cents", default: null }
      - { name: seller_proceeds_cents, type: integer, source: computed, description: "GROSS: total_line_cents; NET: total_line_cents - broker_fee_cents", default: null }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: market_class, type: enum, source: input, description: "Market classification; subscriptions and voluntary retirements are only permitted into VOLUNTARY programs", constraints: "one of VOLUNTARY, COMPLIANCE" }
      - { name: eligible_region_codes, type: array, source: input, description: "Certificate region_code must be a member for voluntary retirement" }
      - { name: eligible_technologies, type: array, source: input, description: "Certificate technology must be a member for voluntary retirement" }
      - { name: vintage_window_months, type: integer, source: input, description: "Voluntary retirement requires 0 <= months_between(retirement clock month, certificate vintage_month) <= vintage_window_months - 1", default: 12 }
      - { name: capacity_cap_kw, type: integer, source: input, description: "Maximum sum of allocation_kw over ACTIVE subscriptions", constraints: "> 0" }
      - { name: kwh_per_kw_monthly, type: integer, source: input, description: "Deemed monthly generation per allocated kW used in bill credit calculation", default: 100 }
      - { name: rate_tiers, type: array, source: input, description: "Marginal rate tiers [{up_to_kwh (null = unbounded), rate_cents_per_kwh}], ascending by up_to_kwh" }
      - { name: annual_claim_cap_mwh, type: integer, source: input, description: "Maximum total_mwh a claim report for this program may submit", constraints: "> 0" }
      - { name: holding_account_id, type: string, source: input, description: "FK -> Account.id; the PROGRAM account holding this program's certificates; required before opening", default: null }
      - { name: status, type: enum, source: system, description: "Program lifecycle", default: DRAFT, constraints: "one of DRAFT, OPEN, ARCHIVED" }
      - { name: committed_capacity_kw, type: integer, source: computed, description: "Sum of allocation_kw over subscriptions with status == ACTIVE", default: 0 }
      - { name: retired_mwh_current_year, type: integer, source: computed, description: "Sum of quantity_mwh over Retirements with purpose == VOLUNTARY_PROGRAM for this program whose retired-at year equals the logical clock year", default: 0 }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program subscribed to" }
      - { name: customer_name, type: string, source: input, description: "Customer display name" }
      - { name: utility_account_no, type: string, source: input, description: "Utility account number; unique among non-TERMINATED subscriptions of the same program" }
      - { name: allocation_kw, type: integer, source: input, description: "Subscribed capacity share in kW", constraints: "> 0 and <= program capacity_cap_kw" }
      - { name: estimated_usage_kwh, type: integer, source: input, description: "Customer-declared monthly usage estimate used by the PROVISIONAL bill credit variant", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle", default: PENDING, constraints: "one of PENDING, ACTIVE, WAITLISTED, SUSPENDED, TERMINATED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent PENDING/WAITLISTED -> ACTIVE transition", default: null }
      - { name: waitlisted_at, type: datetime, source: system, description: "Logical-clock timestamp when the subscription entered WAITLISTED", default: null }
      - { name: terminated_at, type: datetime, source: system, description: "Logical-clock timestamp of termination", default: null }

  - name: Bill
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; billed subscription" }
      - { name: period_month, type: string, source: input, description: "Billing month 'YYYY-MM'; must not be after the logical clock month" }
      - { name: usage_kwh, type: integer, source: input, description: "Actual metered customer usage for the period (used by FINAL variant)", constraints: ">= 0" }
      - { name: charges_cents, type: integer, source: input, description: "Customer's gross charges for the period in cents (credit cap)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Bill lifecycle", default: DRAFT, constraints: "one of DRAFT, ISSUED, DISPUTED, VOID" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "PROVISIONAL variant credit computed at creation from estimated_usage_kwh" }
      - { name: issued_credit_cents, type: integer, source: computed, description: "FINAL variant credit computed at issue (and recomputed at reissue)", default: null }
      - { name: proration_active_days, type: integer, source: computed, description: "Days of the period during which the subscription was ACTIVE or SUSPENDED", default: null }
      - { name: proration_days_in_period, type: integer, source: computed, description: "Calendar days in period_month", default: null }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent ISSUED transition", default: null }

  - name: Retirement
    parent: null
    common_fields: false
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id; retired certificate (whole batch)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; holder account at retirement time" }
      - { name: purpose, type: enum, source: input, description: "Retirement purpose", constraints: "one of VOLUNTARY_PROGRAM, COMPLIANCE, WHOLESALE_CLAIM" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; required iff purpose == VOLUNTARY_PROGRAM", default: null }
      - { name: obligation_id, type: string, source: input, description: "FK -> ComplianceObligation.id; required iff purpose == COMPLIANCE", default: null }
      - { name: external_claim_reference, type: string, source: input, description: "External claim reference; required iff purpose == WHOLESALE_CLAIM; unique across all retirements", default: null }
      - { name: quantity_mwh, type: integer, source: computed, description: "Snapshot of the certificate's quantity_mwh at retirement" }
      - { name: vintage_month, type: string, source: computed, description: "Snapshot of certificate vintage_month" }
      - { name: region_code, type: string, source: computed, description: "Snapshot of certificate region_code" }
      - { name: technology, type: enum, source: computed, description: "Snapshot of certificate technology" }
      - { name: claimed_in_report_id, type: string, source: system, description: "ClaimReport.id that claimed this retirement; set when a report is ACCEPTED; null while unclaimed", default: null }

  - name: ComplianceObligation
    parent: null
    common_fields: true
    fields:
      - { name: lse_name, type: string, source: input, description: "Load-serving entity subject to the obligation" }
      - { name: year, type: integer, source: input, description: "Compliance year" }
      - { name: region_code, type: string, source: input, description: "Certificates retired against this obligation must carry this region_code" }
      - { name: required_mwh, type: integer, source: input, description: "Required compliance MWh", constraints: "> 0" }
      - { name: penalty_rate_cents_per_mwh, type: integer, source: input, description: "Shortfall penalty rate", default: 5000 }
      - { name: covered_mwh, type: integer, source: computed, description: "Sum of quantity_mwh over Retirements with purpose == COMPLIANCE and obligation_id == this obligation", default: 0 }
      - { name: status, type: enum, source: system, description: "Obligation lifecycle", default: OPEN, constraints: "one of OPEN, MET, CLOSED_MET, CLOSED_SHORTFALL" }
      - { name: penalty_cents, type: integer, source: computed, description: "Shortfall penalty computed at close: max(0, required_mwh - covered_mwh) * penalty_rate_cents_per_mwh", default: null }

  - name: ClaimReport
    parent: null
    common_fields: true
    fields:
      - { name: scope, type: enum, source: input, description: "VOLUNTARY_PROGRAM (program_id required) or COMPLIANCE_OBLIGATION (obligation_id required)", constraints: "one of VOLUNTARY_PROGRAM, COMPLIANCE_OBLIGATION" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; required iff scope == VOLUNTARY_PROGRAM", default: null }
      - { name: obligation_id, type: string, source: input, description: "FK -> ComplianceObligation.id; required iff scope == COMPLIANCE_OBLIGATION", default: null }
      - { name: report_year, type: integer, source: input, description: "Calendar year whose retirements the report aggregates" }
      - { name: status, type: enum, source: system, description: "Report lifecycle", default: DRAFT, constraints: "one of DRAFT, SUBMITTED, ACCEPTED, REJECTED" }
      - { name: retirement_ids, type: array, source: computed, description: "Pinned set of Retirement ids included in this report; computed at creation and re-computed on revise: all retirements matching scope whose retired-at year == report_year and claimed_in_report_id is null at pin time" }
      - { name: total_mwh, type: integer, source: computed, description: "Sum of quantity_mwh over pinned retirements", default: 0 }
      - { name: totals_by_technology, type: object, source: computed, description: "Map technology -> summed quantity_mwh over pinned retirements; bucket sum MUST equal total_mwh" }
      - { name: totals_by_region, type: object, source: computed, description: "Map region_code -> summed quantity_mwh over pinned retirements; bucket sum MUST equal total_mwh" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted the report", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on rejection", default: null }

state_machines:
  - entity: Generator
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: VERIFICATION
        trigger: "POST /greenpower/generators/{id}/submit-verification"
        actor: GeneratorOperator
        preconditions: ["Generator.status == REGISTERED or REJECTED", "caller X-User-ID == generator.id"]
        side_effects: ["increments Generator.version by 1"]
      - from: VERIFICATION
        to: ACTIVE
        trigger: "POST /greenpower/generators/{id}/verify"
        actor: RegistryAdmin
        preconditions: ["Generator.status == VERIFICATION"]
        side_effects:
          - "auto-create Account {account_type: GENERATOR, generator_id: this generator, owner_name: generator legal_name, status: ACTIVE}"
          - "increments Generator.version by 1"
      - from: VERIFICATION
        to: REJECTED
        trigger: "POST /greenpower/generators/{id}/reject-verification"
        actor: RegistryAdmin
        preconditions: ["Generator.status == VERIFICATION"]
        side_effects: ["sets rejection_reason from request", "increments Generator.version by 1"]
      - from: REJECTED
        to: VERIFICATION
        trigger: "POST /greenpower/generators/{id}/submit-verification"
        actor: GeneratorOperator
        preconditions: ["Generator.status == REGISTERED or REJECTED", "caller X-User-ID == generator.id"]
        side_effects: ["clears rejection_reason to null", "increments Generator.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /greenpower/generators/{id}/suspend"
        actor: RegistryAdmin
        preconditions: ["Generator.status == ACTIVE"]
        side_effects: ["increments Generator.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /greenpower/generators/{id}/reinstate"
        actor: RegistryAdmin
        preconditions: ["Generator.status == SUSPENDED"]
        side_effects: ["increments Generator.version by 1"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /greenpower/generators/{id}/decommission"
        actor: RegistryAdmin
        preconditions: ["Generator.status == ACTIVE or SUSPENDED"]
        side_effects: ["increments Generator.version by 1", "no new MeterReadings may be created for a DECOMMISSIONED generator (state precondition on POST /meter-readings)"]
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /greenpower/generators/{id}/decommission"
        actor: RegistryAdmin
        preconditions: ["Generator.status == ACTIVE or SUSPENDED"]
        side_effects: ["increments Generator.version by 1"]

  - entity: MeterReading
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: ATTESTED
        trigger: "POST /greenpower/meter-readings/{id}/attest"
        actor: MeterAttester
        preconditions:
          - "MeterReading.status == SUBMITTED"
          - "caller X-User-ID != MeterReading.submitted_by_user_id (segregation of duties)"
          - "logical clock now <= period_end + ATTESTATION_WINDOW_DAYS (30)"
        side_effects: ["sets attested_by_user_id to caller X-User-ID", "increments MeterReading.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /greenpower/meter-readings/{id}/reject"
        actor: MeterAttester
        preconditions: ["MeterReading.status in {SUBMITTED, ATTESTED}", "caller X-User-ID != MeterReading.submitted_by_user_id"]
        side_effects: ["sets rejection_reason from request", "increments MeterReading.version by 1"]
      - from: ATTESTED
        to: REJECTED
        trigger: "POST /greenpower/meter-readings/{id}/reject"
        actor: MeterAttester
        preconditions: ["MeterReading.status in {SUBMITTED, ATTESTED}", "caller X-User-ID != MeterReading.submitted_by_user_id"]
        side_effects: ["sets rejection_reason from request", "clears attested_by_user_id to null", "increments MeterReading.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /greenpower/meter-readings/{id}/resubmit"
        actor: GeneratorOperator
        preconditions: ["MeterReading.status == REJECTED", "caller X-User-ID == MeterReading.submitted_by_user_id"]
        side_effects: ["clears rejection_reason to null", "increments MeterReading.version by 1"]
      - from: ATTESTED
        to: ACCEPTED
        trigger: "POST /greenpower/meter-readings/{id}/accept"
        actor: RegistryAdmin
        preconditions: ["MeterReading.status == ATTESTED", "Generator.status == ACTIVE"]
        side_effects: ["Generator.cumulative_accepted_kwh += metered_kwh", "increments Generator.version by 1", "increments MeterReading.version by 1"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /greenpower/meter-readings/{id}/void"
        actor: RegistryAdmin
        preconditions: ["MeterReading.status == ACCEPTED", "MeterReading.minted == false"]
        side_effects: ["Generator.cumulative_accepted_kwh -= metered_kwh", "increments Generator.version by 1", "increments MeterReading.version by 1"]

  - entity: Account
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /greenpower/accounts/{id}/suspend (manual) OR system strike-threshold: failure_strikes increments to >= 3"
        actor: RegistryAdmin
        preconditions: ["Account.status == ACTIVE"]
        side_effects:
          - "on suspension (either path): every PROPOSED Trade with from_account_id == this account transitions to CANCELLED (no strike changes, no certificate locks were taken at PROPOSED)"
          - "increments Account.version by 1"
        note: "Strike-triggered suspension cascades: see Trade ACCEPTED->FAILED / EXPIRED transitions which increment failure_strikes."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /greenpower/accounts/{id}/reinstate"
        actor: RegistryAdmin
        preconditions: ["Account.status == SUSPENDED"]
        side_effects: ["resets failure_strikes to 0", "increments Account.version by 1"]

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [RETIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: LOCKED
        trigger: "system via POST /greenpower/trades/{id}/accept (every certificate referenced in Trade.items)"
        actor: BrokerTrader
        preconditions: ["Certificate.status == ACTIVE for every item certificate (atomic: all lock or none)"]
        side_effects: ["Account.locked_holdings_mwh += quantity_mwh and Account.active_holdings_mwh -= quantity_mwh on the holder account", "increments Certificate.version by 1"]
      - from: LOCKED
        to: ACTIVE
        trigger: "system via POST /greenpower/trades/{id}/settle (ownership moves to buyer; quantity possibly reduced by split) OR POST /greenpower/trades/{id}/expire (ownership unchanged)"
        actor: BrokerTrader
        preconditions: ["Certificate.status == LOCKED"]
        side_effects: ["Account holdings recomputed on both seller and buyer accounts", "increments Certificate.version by 1"]
        note: "On settle with item quantity < certificate quantity: the original Certificate row remains with the seller as the REMAINDER (serial_start += item quantity, quantity_mwh reduced); a new Certificate row is created for the transferred slice with serial range [old serial_start, old serial_start + item quantity - 1], account_id = buyer, status ACTIVE. On full-quantity settle the original row itself moves account_id to the buyer."
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /greenpower/retirements"
        actor: ProgramManager
        preconditions: ["Certificate.status == ACTIVE", "purpose-specific eligibility (role match, program/obligation linkage, region/technology/vintage rules, obligation OPEN for COMPLIANCE)"]
        side_effects:
          - "creates Retirement row (immutable) with quantity/vintage/region/technology snapshots"
          - "holder Account.active_holdings_mwh -= quantity_mwh"
          - "if purpose == VOLUNTARY_PROGRAM: Program.retired_mwh_current_year += quantity_mwh when retirement clock-year == current logical year (recompute)"
          - "if purpose == COMPLIANCE: ComplianceObligation.covered_mwh += quantity_mwh; then if covered_mwh >= required_mwh the obligation auto-transitions OPEN -> MET"
          - "increments Certificate.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /greenpower/certificates/{id}/revoke"
        actor: RegistryAdmin
        preconditions: ["Certificate.status in {ACTIVE, LOCKED}"]
        side_effects:
          - "holder Account.active_holdings_mwh -= quantity_mwh (if was ACTIVE)"
          - "Generator.lifetime_minted_mwh -= quantity_mwh"
          - "increments Certificate.version by 1"
      - from: LOCKED
        to: REVOKED
        trigger: "POST /greenpower/certificates/{id}/revoke"
        actor: RegistryAdmin
        preconditions: ["Certificate.status in {ACTIVE, LOCKED}"]
        side_effects:
          - "holder Account.locked_holdings_mwh -= quantity_mwh"
          - "Generator.lifetime_minted_mwh -= quantity_mwh"
          - "every ACCEPTED Trade whose items reference this certificate transitions to FAILED (see Trade FAILED transition for its own cascade: seller strike -> possible suspension -> PROPOSED trade cancellations)"
          - "increments Certificate.version by 1"

  - entity: Trade
    initial_state: PROPOSED
    terminal_states: [SETTLED, FAILED, CANCELLED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /greenpower/trades/{id}/accept"
        actor: BrokerTrader
        preconditions:
          - "Trade.status == PROPOSED"
          - "caller X-User-ID == Trade.to_account_id (buyer accepts)"
          - "buyer Account.status == ACTIVE"
          - "every item certificate still ACTIVE and still held by from_account_id"
        side_effects: ["locks every item certificate ACTIVE -> LOCKED (atomic)", "sets accepted_at and settlement_deadline = accepted_at + 5 days", "increments Trade.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /greenpower/trades/{id}/cancel (seller) OR system cascade: seller account suspended"
        actor: BrokerTrader
        preconditions: ["Trade.status == PROPOSED", "manual path: caller X-User-ID == Trade.from_account_id"]
        side_effects: ["increments Trade.version by 1"]
        note: "No certificates were locked at PROPOSED, so cancellation touches no certificates."
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /greenpower/trades/{id}/settle"
        actor: BrokerTrader
        preconditions:
          - "Trade.status == ACCEPTED"
          - "caller X-User-ID == Trade.to_account_id"
          - "logical clock now <= settlement_deadline"
          - "buyer Account.status == ACTIVE and seller Account.status == ACTIVE"
        side_effects:
          - "for each item: full-quantity transfer moves certificate to buyer account (LOCKED -> ACTIVE); partial quantity splits per Certificate LOCKED -> ACTIVE note (seller remainder row + new buyer slice row)"
          - "computes total_line_cents, broker_fee_cents, buyer_total_cents, seller_proceeds_cents per trade_settlement calculation (rounding order pinned there)"
          - "sets settled_at"
          - "increments Trade.version by 1"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "POST /greenpower/trades/{id}/expire"
        actor: RegistryAdmin
        preconditions: ["Trade.status == ACCEPTED", "logical clock now > settlement_deadline"]
        side_effects:
          - "unlocks every item certificate LOCKED -> ACTIVE (ownership unchanged)"
          - "buyer Account.failure_strikes += 1; if failure_strikes reaches 3 the buyer account auto-transitions ACTIVE -> SUSPENDED, which cancels its PROPOSED trades"
          - "increments Trade.version by 1"
      - from: ACCEPTED
        to: FAILED
        trigger: "system cascade: a certificate referenced in Trade.items is revoked (POST /greenpower/certificates/{id}/revoke)"
        actor: system
        preconditions: ["Trade.status == ACCEPTED"]
        side_effects:
          - "other item certificates of this trade (not themselves revoked) unlock LOCKED -> ACTIVE"
          - "seller Account.failure_strikes += 1; if failure_strikes reaches 3 the seller account auto-transitions ACTIVE -> SUSPENDED, which cancels its PROPOSED trades"
          - "increments Trade.version by 1"

  - entity: Program
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /greenpower/programs/{id}/open"
        actor: RegistryAdmin
        preconditions: ["Program.status == DRAFT", "Program.holding_account_id references an existing Account with account_type == PROGRAM and program_id == this program"]
        side_effects: ["increments Program.version by 1"]
      - from: OPEN
        to: ARCHIVED
        trigger: "POST /greenpower/programs/{id}/archive"
        actor: RegistryAdmin
        preconditions: ["Program.status == OPEN", "no Subscription of this program in {PENDING, ACTIVE, WAITLISTED, SUSPENDED}"]
        side_effects: ["increments Program.version by 1"]

  - entity: Subscription
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /greenpower/subscriptions/{id}/activate"
        actor: ProgramManager
        preconditions: ["Subscription.status == PENDING", "Program.status == OPEN", "Program.committed_capacity_kw + allocation_kw <= Program.capacity_cap_kw"]
        side_effects: ["sets activated_at", "Program.committed_capacity_kw += allocation_kw (recompute)", "increments Subscription.version by 1", "increments Program.version by 1"]
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /greenpower/subscriptions/{id}/activate when capacity check fails"
        actor: ProgramManager
        preconditions: ["Subscription.status == PENDING", "Program.status == OPEN", "Program.committed_capacity_kw + allocation_kw > Program.capacity_cap_kw"]
        side_effects: ["sets waitlisted_at", "increments Subscription.version by 1"]
        note: "Capacity-insufficient activation is NOT an error: the subscription parks in WAITLISTED."
      - from: WAITLISTED
        to: ACTIVE
        trigger: "system: waitlist promotion scan (runs after any capacity release: subscription termination, or capacity_cap_kw increase via PATCH /greenpower/programs/{id})"
        actor: system
        preconditions: ["Subscription.status == WAITLISTED", "Program.status == OPEN", "remaining capacity (capacity_cap_kw - sum of ACTIVE allocation_kw) >= allocation_kw at its turn in the scan"]
        side_effects: ["sets activated_at, clears waitlisted_at", "Program.committed_capacity_kw recompute", "increments Subscription.version by 1", "increments Program.version by 1"]
        note: "Scan order: waitlisted_at ASC, tie-break created_at ASC. Skip-and-continue: a waitlisted subscription that does not fit stays WAITLISTED and does NOT block later entries that fit."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /greenpower/subscriptions/{id}/suspend"
        actor: ProgramManager
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects: ["increments Subscription.version by 1"]
        note: "SUSPENDED retains its capacity allocation (committed_capacity_kw unchanged); bills still accrue prorated days."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /greenpower/subscriptions/{id}/reinstate"
        actor: ProgramManager
        preconditions: ["Subscription.status == SUSPENDED", "Program.status == OPEN"]
        side_effects: ["increments Subscription.version by 1"]
      - from: PENDING
        to: TERMINATED
        trigger: "POST /greenpower/subscriptions/{id}/terminate"
        actor: ProgramManager
        preconditions: ["Subscription.status in {PENDING, WAITLISTED, ACTIVE, SUSPENDED}"]
        side_effects: ["sets terminated_at", "increments Subscription.version by 1"]
      - from: WAITLISTED
        to: TERMINATED
        trigger: "POST /greenpower/subscriptions/{id}/terminate"
        actor: ProgramManager
        preconditions: ["Subscription.status in {PENDING, WAITLISTED, ACTIVE, SUSPENDED}"]
        side_effects: ["sets terminated_at", "clears waitlisted_at", "increments Subscription.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /greenpower/subscriptions/{id}/terminate"
        actor: ProgramManager
        preconditions: ["Subscription.status in {PENDING, WAITLISTED, ACTIVE, SUSPENDED}"]
        side_effects:
          - "sets terminated_at"
          - "Program.committed_capacity_kw -= allocation_kw (recompute) — capacity release"
          - "capacity release triggers the waitlist promotion scan on the program (cascade link 2 -> 3)"
          - "increments Subscription.version by 1"
          - "increments Program.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /greenpower/subscriptions/{id}/terminate"
        actor: ProgramManager
        preconditions: ["Subscription.status in {PENDING, WAITLISTED, ACTIVE, SUSPENDED}"]
        side_effects:
          - "sets terminated_at"
          - "Program.committed_capacity_kw -= allocation_kw (SUSPENDED still held its allocation) — capacity release"
          - "capacity release triggers the waitlist promotion scan"
          - "increments Subscription.version by 1"
          - "increments Program.version by 1"

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /greenpower/bills/{id}/issue"
        actor: ProgramManager
        preconditions: ["Bill.status == DRAFT"]
        side_effects: ["computes issued_credit_cents via bill_credit_calculation FINAL variant (actual usage, proration, charges cap)", "sets proration_active_days and proration_days_in_period", "sets issued_at", "increments Bill.version by 1"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /greenpower/bills/{id}/dispute"
        actor: ProgramManager
        preconditions: ["Bill.status == ISSUED"]
        side_effects: ["increments Bill.version by 1"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /greenpower/bills/{id}/reissue"
        actor: ProgramManager
        preconditions: ["Bill.status == DISPUTED"]
        side_effects: ["applies optional corrected usage_kwh / charges_cents from the request before recomputing", "recomputes issued_credit_cents via FINAL variant", "sets issued_at to logical clock now", "increments Bill.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /greenpower/bills/{id}/void"
        actor: ProgramManager
        preconditions: ["Bill.status in {DRAFT, DISPUTED}"]
        side_effects: ["increments Bill.version by 1"]
      - from: DISPUTED
        to: VOID
        trigger: "POST /greenpower/bills/{id}/void"
        actor: ProgramManager
        preconditions: ["Bill.status in {DRAFT, DISPUTED}"]
        side_effects: ["increments Bill.version by 1"]

  - entity: ComplianceObligation
    initial_state: OPEN
    terminal_states: [CLOSED_MET, CLOSED_SHORTFALL]
    transitions:
      - from: OPEN
        to: MET
        trigger: "system: POST /greenpower/retirements with purpose COMPLIANCE raises covered_mwh to >= required_mwh"
        actor: system
        preconditions: ["ComplianceObligation.status == OPEN", "covered_mwh >= required_mwh after applying the retirement"]
        side_effects: ["increments ComplianceObligation.version by 1"]
        note: "The coverage mutation and this auto-transition are one atomic mutation of the obligation: version increments exactly once for the whole triggering retirement request (no double bump)."
      - from: MET
        to: OPEN
        trigger: "system: PATCH /greenpower/compliance-obligations/{id} raises required_mwh above covered_mwh (true-up amendment)"
        actor: system
        preconditions: ["ComplianceObligation.status == MET", "new required_mwh > covered_mwh"]
        side_effects: ["increments ComplianceObligation.version by 1 (in addition to the PATCH increment — single combined bump of 1 for the whole request)"]
        note: "The PATCH itself applies the amendment and the MET->OPEN re-derivation atomically; version increments once."
      - from: OPEN
        to: CLOSED_MET
        trigger: "POST /greenpower/compliance-obligations/{id}/close"
        actor: ComplianceOfficer
        preconditions: ["ComplianceObligation.status in {OPEN, MET}", "at close time covered_mwh >= required_mwh -> CLOSED_MET else CLOSED_SHORTFALL"]
        side_effects: ["sets penalty_cents = 0", "increments ComplianceObligation.version by 1"]
      - from: MET
        to: CLOSED_MET
        trigger: "POST /greenpower/compliance-obligations/{id}/close"
        actor: ComplianceOfficer
        preconditions: ["ComplianceObligation.status in {OPEN, MET}"]
        side_effects: ["sets penalty_cents = 0", "increments ComplianceObligation.version by 1"]
      - from: OPEN
        to: CLOSED_SHORTFALL
        trigger: "POST /greenpower/compliance-obligations/{id}/close"
        actor: ComplianceOfficer
        preconditions: ["ComplianceObligation.status == OPEN", "covered_mwh < required_mwh"]
        side_effects: ["sets penalty_cents per shortfall_penalty calculation", "increments ComplianceObligation.version by 1"]

  - entity: ClaimReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /greenpower/claim-reports/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "ClaimReport.status == DRAFT"
          - "role match: scope VOLUNTARY_PROGRAM requires ProgramManager; scope COMPLIANCE_OBLIGATION requires ComplianceOfficer"
          - "retirement_ids non-empty"
          - "no pinned retirement has claimed_in_report_id set by another ACCEPTED report (double-count guard)"
          - "no ACCEPTED report already exists for the same scope target + report_year"
          - "for VOLUNTARY_PROGRAM scope: total_mwh <= Program.annual_claim_cap_mwh"
        side_effects: ["sets submitted_by_user_id", "recomputes total_mwh and bucket totals from the pinned set", "increments ClaimReport.version by 1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /greenpower/claim-reports/{id}/accept"
        actor: Auditor
        preconditions: ["ClaimReport.status == SUBMITTED", "caller X-User-ID != submitted_by_user_id (segregation of duties)"]
        side_effects: ["sets claimed_in_report_id = this report id on every pinned Retirement", "increments ClaimReport.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /greenpower/claim-reports/{id}/reject"
        actor: Auditor
        preconditions: ["ClaimReport.status == SUBMITTED", "caller X-User-ID != submitted_by_user_id"]
        side_effects: ["sets rejection_reason from request", "increments ClaimReport.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /greenpower/claim-reports/{id}/revise"
        actor: ProgramManager
        preconditions: ["ClaimReport.status == REJECTED", "role match as in submit"]
        side_effects: ["recomputes retirement_ids pin set from scratch (drops retirements claimed elsewhere since; picks up newly eligible retirements)", "recomputes totals", "clears rejection_reason and submitted_by_user_id", "increments ClaimReport.version by 1"]

concurrency_rules:
  - rule_id: subscription-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /greenpower/subscriptions"
    occ_field: "expected_program_version"
    description: |
      Creating a Subscription against a Program whose version has advanced since the
      client last observed it is rejected with a stale-version precondition. This
      captures the case where another writer has just created or activated a
      subscription (each of which advances Program.version) and the current writer's
      capacity view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: generator-config-stale-generator
    parent_entity: Generator
    write_endpoint: "PATCH /greenpower/generators/{id}"
    occ_field: "expected_generator_version"
    description: |
      Updating a Generator whose version has advanced since the client last observed
      it is rejected with a stale-version precondition, so a config update never
      silently overwrites another writer's committed update.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: program-config-stale-program
    parent_entity: Program
    write_endpoint: "PATCH /greenpower/programs/{id}"
    occ_field: "expected_program_version"
    description: |
      Updating a Program whose version has advanced since the client last observed
      it is rejected with a stale-version precondition; interim subscription activity
      or config amendments advance Program.version and invalidate the writer's view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: obligation-amend-stale-obligation
    parent_entity: ComplianceObligation
    write_endpoint: "PATCH /greenpower/compliance-obligations/{id}"
    occ_field: "expected_obligation_version"
    description: |
      Amending a ComplianceObligation whose version has advanced since the client
      last observed it (e.g. a retirement has just bumped covered_mwh and version)
      is rejected with a stale-version precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: rec_minting_carryover
    trigger: "POST /greenpower/generators/{id}/mint-run"
    algorithm: chronological
    formula: |
      readings = MeterReadings of this generator with status == ACCEPTED and minted == false,
                 ordered by period_start ASC, tie-break created_at ASC
      group readings by vintage bucket = month(period_start) as 'YYYY-MM', preserving chronological order of buckets
      carry = Generator.carryover_kwh (unless the first bucket's year differs from the year that produced the
              carryover: carryover never crosses a calendar-year boundary, so a carry produced in year Y is
              discarded to 0 when the next bucket belongs to year Y+1)
      for each bucket in chronological order:
          bucket_kwh = sum(metered_kwh of bucket readings)
          if bucket is the first bucket of the run AND bucket year == year that produced carry: pool = carry + bucket_kwh
          else: pool = bucket_kwh   (carry either already applied or discarded at the year boundary)
          whole = floor(pool / 1000)
          if whole > 0:
              mint one Certificate: quantity_mwh = whole, vintage_month = bucket,
                region_code/technology snapshotted from generator NOW,
                serial_prefix = '<facility_code>-<bucket>',
                serial_start = Generator.next_serial, serial_end = serial_start + whole - 1,
                account_id = the GENERATOR Account of this generator,
                Generator.next_serial += whole, Generator.lifetime_minted_mwh += whole,
                account.active_holdings_mwh += whole
          carry = pool - whole * 1000   (carries into the next bucket only if same calendar year)
          mark every reading in the bucket: minted = true, minted_vintage_month = bucket
      Generator.carryover_kwh = carry
      response: { minted_count, total_minted_mwh, carryover_kwh, certificate_ids } in mint order
    input_set: "MeterReadings status == ACCEPTED and minted == false for this generator only; REJECTED/VOIDED/SUBMITTED/ATTESTED excluded"
    constants:
      KWH_PER_REC: 1000
      CARRYOVER_YEAR_RESET: true
    precision: "integer arithmetic only (whole kWh, whole MWh)"
    variants: []

  - name: bill_credit_calculation
    trigger: "POST /greenpower/bills (PROVISIONAL) and POST /greenpower/bills/{id}/issue or /reissue (FINAL)"
    algorithm: tiered_pricing
    formula: |
      deemed_kwh = Subscription.allocation_kw * Program.kwh_per_kw_monthly
      PROVISIONAL (at bill creation, stored to provisional_credit_cents):
          eligible = min(Subscription.estimated_usage_kwh, deemed_kwh)
          credit = marginal_tier_sum(eligible, Program.rate_tiers)   # integer cents; kwh * rate exact
          # provisional is NOT prorated and NOT capped against charges
      FINAL (at issue/reissue, stored to issued_credit_cents):
          eligible = min(Bill.usage_kwh, deemed_kwh)
          base = marginal_tier_sum(eligible, Program.rate_tiers)
          days_in_period = calendar days of period_month
          active_days = count of days d in period_month such that the subscription was ACTIVE or SUSPENDED
                        for any part of d, derived from activated_at / terminated_at vs period bounds
                        (a subscription active the whole period scores days_in_period)
          prorated = round_half_up(base * active_days / days_in_period)
          credit = min(prorated, Bill.charges_cents)
      marginal_tier_sum(kwh, tiers): walk tiers ascending by up_to_kwh; each tier contributes
          (min(remaining, tier_width) * rate_cents_per_kwh); tier_width = up_to_kwh - previous up_to_kwh
          (first tier's previous = 0); null up_to_kwh = unbounded.
    input_set: "the target Bill, its Subscription, and the Subscription's Program; no other subscriptions or bills participate"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; the only division (proration) rounds half-up to the cent"
    variants:
      - name: PROVISIONAL
        when: "bill creation (DRAFT)"
        difference: "uses estimated_usage_kwh, no proration, no charges cap — stored to provisional_credit_cents"
      - name: FINAL
        when: "issue / reissue (ISSUED)"
        difference: "uses actual usage_kwh, calendar-day proration, capped at charges_cents — stored to issued_credit_cents"

  - name: trade_settlement
    trigger: "POST /greenpower/trades/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      for each item line (in Trade.items array order):
          line_cents = quantity_mwh * unit_price_cents_per_mwh          # exact integer
          bps = 50 if quantity_mwh < 100; 35 if 100 <= quantity_mwh < 1000; 20 if quantity_mwh >= 1000
          fee_line_cents = round_half_up(line_cents * bps / 10000)      # round EACH line first
      total_line_cents = sum(line_cents)
      broker_fee_cents = sum(fee_line_cents)                            # THEN sum the rounded lines
      GROSS: buyer_total_cents = total_line_cents + broker_fee_cents; seller_proceeds_cents = total_line_cents
      NET:   buyer_total_cents = total_line_cents;                      seller_proceeds_cents = total_line_cents - broker_fee_cents
      (pinned rounding order: per-line fee rounding BEFORE summation; computing the fee on the
       aggregate total is a different, non-conformant algorithm and yields different cents)
    input_set: "the Trade being settled and its items; certificate quantities as settled (after any split)"
    constants:
      FEE_BPS_TIER_1_THRESHOLD: 100
      FEE_BPS_TIER_1: 50
      FEE_BPS_TIER_2_THRESHOLD: 1000
      FEE_BPS_TIER_2: 35
      FEE_BPS_TIER_3: 20
    precision: "integer cents, round_half_up per fee line before summing"
    variants:
      - name: GROSS
        when: "Trade.settlement_mode == GROSS"
        difference: "buyer pays total_line_cents + broker_fee_cents; seller receives total_line_cents"
      - name: NET
        when: "Trade.settlement_mode == NET"
        difference: "buyer pays total_line_cents; seller receives total_line_cents - broker_fee_cents"

  - name: waitlist_promotion_scan
    trigger: "capacity release: Subscription ACTIVE/SUSPENDED -> TERMINATED, or PATCH /greenpower/programs/{id} raising capacity_cap_kw"
    algorithm: waterfall_allocation
    formula: |
      remaining = Program.capacity_cap_kw - sum(allocation_kw of Subscriptions with status == ACTIVE)
      candidates = Subscriptions of this program with status == WAITLISTED,
                   ordered waitlisted_at ASC, tie-break created_at ASC
      for each candidate in order:
          if candidate.allocation_kw <= remaining:
              candidate -> ACTIVE (activated_at = now, waitlisted_at = null)
              remaining -= candidate.allocation_kw
          else:
              leave WAITLISTED and CONTINUE scanning (skip-and-continue; no head-of-line blocking)
    input_set: "WAITLISTED subscriptions of this program only; PENDING subscriptions never auto-promote"
    constants: {}
    precision: "integer kW arithmetic"
    variants: []

  - name: compliance_coverage
    trigger: "POST /greenpower/retirements with purpose == COMPLIANCE; PATCH /greenpower/compliance-obligations/{id}"
    algorithm: threshold
    formula: |
      covered_mwh = sum(quantity_mwh of Retirements with purpose == COMPLIANCE and obligation_id == this obligation)
      obligation is MET iff covered_mwh >= required_mwh   (inclusive: exact equality counts as MET)
      evaluation order on PATCH amendment: (1) freeze covered_mwh from retirements; (2) apply required_mwh /
      penalty_rate amendments; (3) re-derive MET iff covered_mwh >= new required_mwh else OPEN; (4) persist.
    input_set: "Retirements with purpose == COMPLIANCE and obligation_id == this obligation (all, unfiltered by year)"
    constants: {}
    precision: "integer MWh"
    variants: []

  - name: vintage_eligibility
    trigger: "POST /greenpower/retirements (VOLUNTARY_PROGRAM and COMPLIANCE purposes)"
    algorithm: interval_merge
    formula: |
      VOLUNTARY_PROGRAM: let now_m = logical clock month 'YYYY-MM', v = certificate vintage_month;
          months_between = (now_m.year - v.year) * 12 + (now_m.month - v.month);
          eligible iff 0 <= months_between <= Program.vintage_window_months - 1   (closed month window)
      COMPLIANCE: let y = certificate vintage year; eligible iff Obligation.year - 2 <= y <= Obligation.year (closed year window)
      geographic rule (both purposes where a target applies): VOLUNTARY requires certificate.region_code IN
      Program.eligible_region_codes and certificate.technology IN Program.eligible_technologies;
      COMPLIANCE requires certificate.region_code == ComplianceObligation.region_code.
    input_set: "the single Certificate being retired plus its retirement target (Program or ComplianceObligation)"
    constants: {}
    precision: "month granularity for voluntary; year granularity for compliance"
    variants: []

  - name: claim_totalization
    trigger: "POST /greenpower/claim-reports (pin), POST /greenpower/claim-reports/{id}/revise (re-pin), POST /greenpower/claim-reports/{id}/submit (recompute from pinned set)"
    algorithm: waterfall_allocation
    formula: |
      pin set S = Retirements where claimed_in_report_id IS NULL AND retired-at year == report_year AND
          (scope == VOLUNTARY_PROGRAM  -> purpose == VOLUNTARY_PROGRAM  AND program_id == report.program_id) OR
          (scope == COMPLIANCE_OBLIGATION -> purpose == COMPLIANCE AND obligation_id == report.obligation_id)
      total_mwh = sum(quantity_mwh over S)
      totals_by_technology[t] = sum(quantity_mwh over S where technology == t)
      totals_by_region[r]     = sum(quantity_mwh over S where region_code == r)
      reconciliation invariant: sum(totals_by_technology.values) == sum(totals_by_region.values) == total_mwh
    input_set: "Retirements as filtered above; ordering irrelevant (pure summation)"
    constants: {}
    precision: "integer MWh"
    variants: []

  - name: shortfall_penalty
    trigger: "POST /greenpower/compliance-obligations/{id}/close when covered_mwh < required_mwh"
    algorithm: threshold
    formula: |
      deficit_mwh = required_mwh - covered_mwh      # > 0 on this path
      penalty_cents = deficit_mwh * penalty_rate_cents_per_mwh
      status = CLOSED_SHORTFALL; (on the covered path instead: penalty_cents = 0, status = CLOSED_MET)
    input_set: "the ComplianceObligation being closed"
    constants: {}
    precision: "integer cents (exact multiplication)"
    variants: []

  - name: serial_split_partition
    trigger: "POST /greenpower/trades/{id}/settle for each item with quantity_mwh < certificate quantity_mwh"
    algorithm: constraint_propagation
    formula: |
      let the locked certificate C have [serial_start = s, serial_end = e], quantity q = e - s + 1, and item quantity t (1 <= t < q)
      transferred slice (NEW Certificate): serial_start = s, serial_end = s + t - 1, quantity_mwh = t,
          account_id = Trade.to_account_id, status = ACTIVE; copies generator_id, vintage_month, region_code,
          technology, serial_prefix from C
      remainder (C itself): serial_start = s + t, serial_end = e, quantity_mwh = q - t,
          account_id unchanged (seller), status LOCKED -> ACTIVE
      conservation invariant: t + (q - t) == q  AND  the two serial ranges partition [s, e] without gap or overlap
      full-quantity item (t == q): NO new row; C.account_id = buyer, status LOCKED -> ACTIVE
    input_set: "the certificates locked by the settling Trade"
    constants: {}
    precision: "integer serial arithmetic"
    variants: []

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles; additionally purpose/scope-role match: POST /retirements purpose VOLUNTARY_PROGRAM requires ProgramManager, COMPLIANCE requires ComplianceOfficer, WHOLESALE_CLAIM requires BrokerTrader (whose X-User-ID == certificate holder account); claim-report create/submit/revise requires ProgramManager for VOLUNTARY_PROGRAM scope and ComplianceOfficer for COMPLIANCE_OBLIGATION scope; BrokerTrader trade propose requires X-User-ID == from_account_id, accept/settle require X-User-ID == to_account_id, cancel requires X-User-ID == from_account_id; BrokerTrader certificate transfer requires X-User-ID == certificate.account_id (RegistryAdmin may transfer any); GeneratorOperator endpoints require X-User-ID == target generator id", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request body schema: all required fields present, types and enum values valid", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path {id} resources exist (left-to-right), then body FK references exist (generator_id, program_id, subscription_id, certificate_id, from_account_id, to_account_id, items[].certificate_id, obligation_id, holding_account_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC precondition on the four OCC-guarded writes: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /greenpower/subscriptions", "PATCH /greenpower/generators/{id}", "PATCH /greenpower/programs/{id}", "PATCH /greenpower/compliance-obligations/{id}"] }
  - { priority: 6, category: state, check: "Generator.status == ACTIVE for meter-reading creation and mint-run", error_id: ERR_GENERATOR_NOT_ACTIVE, http_status: 409, applies_to: ["POST /greenpower/meter-readings", "POST /greenpower/generators/{id}/mint-run"] }
  - { priority: 6, category: state, check: "Generator is in the transition's required from-state for lifecycle actions (submit-verification: REGISTERED/REJECTED; verify/reject-verification: VERIFICATION; suspend: ACTIVE; reinstate: SUSPENDED; decommission: ACTIVE/SUSPENDED)", error_id: ERR_INVALID_GENERATOR_STATE, http_status: 409, applies_to: ["POST /greenpower/generators/{id}/submit-verification", "POST /greenpower/generators/{id}/verify", "POST /greenpower/generators/{id}/reject-verification", "POST /greenpower/generators/{id}/suspend", "POST /greenpower/generators/{id}/reinstate", "POST /greenpower/generators/{id}/decommission"] }
  - { priority: 7, category: state, check: "MeterReading is in the transition's required from-state", error_id: ERR_INVALID_READING_STATE, http_status: 409, applies_to: ["POST /greenpower/meter-readings/{id}/attest", "POST /greenpower/meter-readings/{id}/reject", "POST /greenpower/meter-readings/{id}/resubmit", "POST /greenpower/meter-readings/{id}/accept", "POST /greenpower/meter-readings/{id}/void"] }
  - { priority: 8, category: state, check: "Every Account participating in a trade write (seller/buyer), a retirement (holder), or a transfer (target) has status == ACTIVE; account lifecycle actions require the matching from-state (suspend: ACTIVE; reinstate: SUSPENDED)", error_id: ERR_ACCOUNT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /greenpower/trades", "POST /greenpower/trades/{id}/accept", "POST /greenpower/trades/{id}/settle", "POST /greenpower/retirements", "POST /greenpower/certificates/{id}/transfer", "POST /greenpower/accounts/{id}/suspend", "POST /greenpower/accounts/{id}/reinstate"] }
  - { priority: 9, category: state, check: "Certificate.status == ACTIVE (retire, trade items) or in {ACTIVE, LOCKED} (revoke)", error_id: ERR_CERTIFICATE_NOT_ACTIVE, http_status: 409, applies_to: ["POST /greenpower/trades", "POST /greenpower/trades/{id}/accept", "POST /greenpower/retirements", "POST /greenpower/certificates/{id}/revoke", "POST /greenpower/certificates/{id}/transfer"] }
  - { priority: 10, category: state, check: "Trade is in the transition's required from-state (accept/cancel: PROPOSED; settle/expire: ACCEPTED)", error_id: ERR_TRADE_STATE_INVALID, http_status: 409, applies_to: ["POST /greenpower/trades/{id}/accept", "POST /greenpower/trades/{id}/settle", "POST /greenpower/trades/{id}/cancel", "POST /greenpower/trades/{id}/expire"] }
  - { priority: 11, category: state, check: "Program.status == OPEN for subscription create/activate/reinstate", error_id: ERR_PROGRAM_NOT_OPEN, http_status: 409, applies_to: ["POST /greenpower/subscriptions", "POST /greenpower/subscriptions/{id}/activate", "POST /greenpower/subscriptions/{id}/reinstate"] }
  - { priority: 12, category: state, check: "Subscription in required from-state; bill creation requires Subscription.status in {ACTIVE, SUSPENDED}", error_id: ERR_SUBSCRIPTION_STATE_INVALID, http_status: 409, applies_to: ["POST /greenpower/subscriptions/{id}/activate", "POST /greenpower/subscriptions/{id}/suspend", "POST /greenpower/subscriptions/{id}/reinstate", "POST /greenpower/subscriptions/{id}/terminate", "POST /greenpower/bills"] }
  - { priority: 13, category: state, check: "Bill is in the transition's required from-state", error_id: ERR_BILL_STATE_INVALID, http_status: 409, applies_to: ["POST /greenpower/bills/{id}/issue", "POST /greenpower/bills/{id}/dispute", "POST /greenpower/bills/{id}/reissue", "POST /greenpower/bills/{id}/void"] }
  - { priority: 14, category: state, check: "ComplianceObligation.status == OPEN for compliance retirements and for PATCH amendment; close requires OPEN or MET", error_id: ERR_OBLIGATION_NOT_OPEN, http_status: 409, applies_to: ["POST /greenpower/retirements", "PATCH /greenpower/compliance-obligations/{id}", "POST /greenpower/compliance-obligations/{id}/close"] }
  - { priority: 15, category: state, check: "ClaimReport is in the transition's required from-state", error_id: ERR_REPORT_STATE_INVALID, http_status: 409, applies_to: ["POST /greenpower/claim-reports/{id}/submit", "POST /greenpower/claim-reports/{id}/accept", "POST /greenpower/claim-reports/{id}/reject", "POST /greenpower/claim-reports/{id}/revise"] }
  - { priority: 16, category: business_safety, check: "Segregation of duties: attester/rejecter X-User-ID != MeterReading.submitted_by_user_id", error_id: ERR_SELF_ATTESTATION, http_status: 403, applies_to: ["POST /greenpower/meter-readings/{id}/attest", "POST /greenpower/meter-readings/{id}/reject"] }
  - { priority: 17, category: business_safety, check: "Segregation of duties: report accept/reject caller X-User-ID != ClaimReport.submitted_by_user_id", error_id: ERR_SELF_APPROVAL, http_status: 403, applies_to: ["POST /greenpower/claim-reports/{id}/accept", "POST /greenpower/claim-reports/{id}/reject"] }
  - { priority: 18, category: business_safety, check: "Double-count guard: no pinned retirement of a submitting report has claimed_in_report_id set by another ACCEPTED report", error_id: ERR_DOUBLE_COUNT, http_status: 422, applies_to: ["POST /greenpower/claim-reports/{id}/submit"] }
  - { priority: 19, category: business_temporal, check: "period_end strictly after period_start", error_id: ERR_PERIOD_INVERTED, http_status: 400, applies_to: ["POST /greenpower/meter-readings"] }
  - { priority: 20, category: business_temporal, check: "Reading period_end <= logical clock now; bill period_month not after the clock month", error_id: ERR_FUTURE_PERIOD, http_status: 422, applies_to: ["POST /greenpower/meter-readings", "POST /greenpower/bills"] }
  - { priority: 21, category: business_temporal, check: "No half-open interval overlap: for the same generator, no existing reading with status in {SUBMITTED, ATTESTED, ACCEPTED} may satisfy new.period_start < existing.period_end AND existing.period_start < new.period_end (adjacency period_end == period_start is allowed)", error_id: ERR_READING_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /greenpower/meter-readings"] }
  - { priority: 22, category: business_temporal, check: "Attestation window: logical clock now <= period_end + 30 days at attest time", error_id: ERR_ATTESTATION_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /greenpower/meter-readings/{id}/attest"] }
  - { priority: 23, category: business_temporal, check: "Settlement window: settle requires logical clock now <= settlement_deadline", error_id: ERR_SETTLEMENT_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /greenpower/trades/{id}/settle"] }
  - { priority: 24, category: business_temporal, check: "Expire requires logical clock now > settlement_deadline", error_id: ERR_TRADE_NOT_EXPIRED, http_status: 409, applies_to: ["POST /greenpower/trades/{id}/expire"] }
  - { priority: 25, category: business_temporal, check: "Vintage eligibility per vintage_eligibility calculation (voluntary month window, compliance year window)", error_id: ERR_VINTAGE_INELIGIBLE, http_status: 422, applies_to: ["POST /greenpower/retirements"] }
  - { priority: 26, category: business_constraint, check: "Geographic eligibility: voluntary retirement requires certificate.region_code in Program.eligible_region_codes; compliance retirement requires region_code == ComplianceObligation.region_code", error_id: ERR_REGION_INELIGIBLE, http_status: 422, applies_to: ["POST /greenpower/retirements"] }
  - { priority: 27, category: business_constraint, check: "Technology eligibility: voluntary retirement requires certificate.technology in Program.eligible_technologies", error_id: ERR_TECHNOLOGY_INELIGIBLE, http_status: 422, applies_to: ["POST /greenpower/retirements"] }
  - { priority: 28, category: business_constraint, check: "external_claim_reference unique across all retirements (WHOLESALE_CLAIM)", error_id: ERR_DUPLICATE_CLAIM_REFERENCE, http_status: 409, applies_to: ["POST /greenpower/retirements"] }
  - { priority: 29, category: business_constraint, check: "No second non-VOID Bill for the same subscription_id + period_month", error_id: ERR_DUPLICATE_BILL, http_status: 409, applies_to: ["POST /greenpower/bills"] }
  - { priority: 30, category: business_constraint, check: "utility_account_no unique among non-TERMINATED subscriptions of the same program", error_id: ERR_DUPLICATE_UTILITY_ACCOUNT, http_status: 409, applies_to: ["POST /greenpower/subscriptions"] }
  - { priority: 31, category: business_constraint, check: "No second ClaimReport for the same scope target + report_year when one is already ACCEPTED", error_id: ERR_DUPLICATE_REPORT, http_status: 409, applies_to: ["POST /greenpower/claim-reports"] }
  - { priority: 32, category: business_constraint, check: "Quantities: metered_kwh > 0; trade item 1 <= quantity_mwh <= certificate quantity_mwh; allocation_kw > 0; usage_kwh >= 0; charges_cents >= 0", error_id: ERR_QUANTITY_INVALID, http_status: 400, applies_to: ["POST /greenpower/meter-readings", "POST /greenpower/trades", "POST /greenpower/subscriptions", "POST /greenpower/bills"] }
  - { priority: 33, category: business_constraint, check: "Market class: subscriptions and VOLUNTARY_PROGRAM retirements only into programs with market_class == VOLUNTARY", error_id: ERR_MARKET_CLASS_MISMATCH, http_status: 422, applies_to: ["POST /greenpower/subscriptions", "POST /greenpower/retirements"] }
  - { priority: 34, category: business_constraint, check: "Submitting report must pin at least one retirement", error_id: ERR_REPORT_EMPTY, http_status: 422, applies_to: ["POST /greenpower/claim-reports/{id}/submit"] }
  - { priority: 35, category: business_fiscal, check: "allocation_kw <= Program.capacity_cap_kw at subscription creation", error_id: ERR_ALLOCATION_EXCEEDS_CAP, http_status: 422, applies_to: ["POST /greenpower/subscriptions"] }
  - { priority: 36, category: business_fiscal, check: "Submitting VOLUNTARY_PROGRAM report: total_mwh <= Program.annual_claim_cap_mwh", error_id: ERR_CLAIM_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /greenpower/claim-reports/{id}/submit"] }
  - { priority: 37, category: business_referential, check: "Void requires MeterReading.minted == false", error_id: ERR_READING_ALREADY_MINTED, http_status: 409, applies_to: ["POST /greenpower/meter-readings/{id}/void"] }
  - { priority: 38, category: business_referential, check: "Program archive requires no subscriptions in {PENDING, ACTIVE, WAITLISTED, SUSPENDED}", error_id: ERR_PROGRAM_HAS_ACTIVE_SUBSCRIPTIONS, http_status: 409, applies_to: ["POST /greenpower/programs/{id}/archive"] }
  - { priority: 39, category: business_referential, check: "Program open requires holding_account_id referencing an existing PROGRAM account wired to this program", error_id: ERR_PROGRAM_HOLDING_ACCOUNT_MISSING, http_status: 422, applies_to: ["POST /greenpower/programs/{id}/open"] }

endpoints:
  # --- Generators ---
  - { method: POST, path: "/greenpower/generators", description: "Register a new generator (status REGISTERED)", roles: [RegistryAdmin], code: 201, input: [legal_name, facility_code, technology, nameplate_capacity_kw, region_code, commissioning_date], output: Generator, side_effects: [] }
  - { method: GET, path: "/greenpower/generators", description: "List generators with filters and pagination", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "status?", "technology?", "region_code?"], output: "Generator[]", side_effects: [] }
  - { method: GET, path: "/greenpower/generators/{id}", description: "Fetch one generator", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Generator, side_effects: [] }
  - { method: PATCH, path: "/greenpower/generators/{id}", description: "Update generator config (OCC-guarded); region_code changes never retro-alter minted Certificate snapshots", roles: [RegistryAdmin], code: 200, input: [expected_generator_version, "legal_name?", "nameplate_capacity_kw?", "region_code?"], output: Generator, side_effects: ["increments Generator.version by 1"] }
  - { method: POST, path: "/greenpower/generators/{id}/submit-verification", description: "REGISTERED or REJECTED -> VERIFICATION", roles: [GeneratorOperator], code: 200, input: [], output: Generator, side_effects: ["Generator state transition"] }
  - { method: POST, path: "/greenpower/generators/{id}/verify", description: "VERIFICATION -> ACTIVE; auto-creates the generator's GENERATOR Account", roles: [RegistryAdmin], code: 200, input: [], output: Generator, side_effects: ["creates Account {account_type: GENERATOR, generator_id: id}", "Generator state transition"] }
  - { method: POST, path: "/greenpower/generators/{id}/reject-verification", description: "VERIFICATION -> REJECTED with reason", roles: [RegistryAdmin], code: 200, input: ["reason?"], output: Generator, side_effects: ["Generator state transition"] }
  - { method: POST, path: "/greenpower/generators/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [RegistryAdmin], code: 200, input: [], output: Generator, side_effects: ["Generator state transition"] }
  - { method: POST, path: "/greenpower/generators/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [RegistryAdmin], code: 200, input: [], output: Generator, side_effects: ["Generator state transition"] }
  - { method: POST, path: "/greenpower/generators/{id}/decommission", description: "ACTIVE or SUSPENDED -> DECOMMISSIONED (terminal)", roles: [RegistryAdmin], code: 200, input: [], output: Generator, side_effects: ["Generator state transition"] }
  - { method: POST, path: "/greenpower/generators/{id}/mint-run", description: "Consume all ACCEPTED, unminted readings chronologically per rec_minting_carryover; mint Certificates into the generator's GENERATOR account", roles: [RegistryAdmin], code: 200, input: [], output: "{ minted_count: integer, total_minted_mwh: integer, carryover_kwh: integer, certificate_ids: array }", side_effects: ["runs rec_minting_carryover", "creates Certificate rows", "marks readings minted", "updates Generator carryover/next_serial/lifetime_minted_mwh and Account holdings"] }

  # --- Meter readings ---
  - { method: POST, path: "/greenpower/meter-readings", description: "Submit a meter reading for a generator (caller must be that generator)", roles: [GeneratorOperator], code: 201, input: [generator_id, period_start, period_end, metered_kwh], output: MeterReading, side_effects: [] }
  - { method: GET, path: "/greenpower/meter-readings", description: "List readings with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "generator_id?", "status?"], output: "MeterReading[]", side_effects: [] }
  - { method: GET, path: "/greenpower/meter-readings/{id}", description: "Fetch one reading", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: MeterReading, side_effects: [] }
  - { method: POST, path: "/greenpower/meter-readings/{id}/attest", description: "SUBMITTED -> ATTESTED (segregation of duties; 30-day window)", roles: [MeterAttester], code: 200, input: [], output: MeterReading, side_effects: ["MeterReading state transition"] }
  - { method: POST, path: "/greenpower/meter-readings/{id}/reject", description: "SUBMITTED or ATTESTED -> REJECTED", roles: [MeterAttester], code: 200, input: ["reason?"], output: MeterReading, side_effects: ["MeterReading state transition"] }
  - { method: POST, path: "/greenpower/meter-readings/{id}/resubmit", description: "REJECTED -> SUBMITTED (revision cycle)", roles: [GeneratorOperator], code: 200, input: [], output: MeterReading, side_effects: ["MeterReading state transition"] }
  - { method: POST, path: "/greenpower/meter-readings/{id}/accept", description: "ATTESTED -> ACCEPTED; credits generator cumulative_accepted_kwh", roles: [RegistryAdmin], code: 200, input: [], output: MeterReading, side_effects: ["MeterReading state transition", "Generator.cumulative_accepted_kwh += metered_kwh"] }
  - { method: POST, path: "/greenpower/meter-readings/{id}/void", description: "ACCEPTED -> VOIDED (only while unminted); debits cumulative_accepted_kwh", roles: [RegistryAdmin], code: 200, input: ["reason?"], output: MeterReading, side_effects: ["MeterReading state transition", "Generator.cumulative_accepted_kwh -= metered_kwh"] }

  # --- Accounts ---
  - { method: POST, path: "/greenpower/accounts", description: "Create a BROKER or PROGRAM account (GENERATOR accounts are auto-created at generator verify)", roles: [RegistryAdmin], code: 201, input: [account_type, owner_name, "generator_id?", "program_id?"], output: Account, side_effects: [] }
  - { method: GET, path: "/greenpower/accounts", description: "List accounts with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "account_type?", "generator_id?", "program_id?", "status?"], output: "Account[]", side_effects: [] }
  - { method: GET, path: "/greenpower/accounts/{id}", description: "Fetch one account (includes derived holdings)", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Account, side_effects: [] }
  - { method: POST, path: "/greenpower/accounts/{id}/suspend", description: "ACTIVE -> SUSPENDED; cancels its PROPOSED trades", roles: [RegistryAdmin], code: 200, input: [], output: Account, side_effects: ["Account state transition", "cancels PROPOSED trades of this account as seller"] }
  - { method: POST, path: "/greenpower/accounts/{id}/reinstate", description: "SUSPENDED -> ACTIVE; resets failure_strikes to 0", roles: [RegistryAdmin], code: 200, input: [], output: Account, side_effects: ["Account state transition", "failure_strikes reset"] }

  # --- Certificates ---
  - { method: GET, path: "/greenpower/certificates", description: "List certificates with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "generator_id?", "account_id?", "status?", "vintage_month?", "region_code?"], output: "Certificate[]", side_effects: [] }
  - { method: GET, path: "/greenpower/certificates/{id}", description: "Fetch one certificate", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Certificate, side_effects: [] }
  - { method: POST, path: "/greenpower/certificates/{id}/revoke", description: "ACTIVE or LOCKED -> REVOKED; cascades to fail ACCEPTED trades and strike the seller", roles: [RegistryAdmin], code: 200, input: ["reason?"], output: Certificate, side_effects: ["Certificate state transition", "cascade: ACCEPTED trades referencing it -> FAILED", "seller strike / suspension cascade", "Generator.lifetime_minted_mwh decrement", "Account holdings recompute"] }

  - { method: POST, path: "/greenpower/certificates/{id}/transfer", description: "Bilateral whole-batch transfer of an ACTIVE certificate to another account (no settlement, no split)", roles: [RegistryAdmin, BrokerTrader], code: 200, input: [to_account_id], output: Certificate, side_effects: ["Certificate.account_id reassigned", "holdings recompute on both accounts", "increments Certificate.version by 1"] }

  # --- Trades ---
  - { method: POST, path: "/greenpower/trades", description: "Propose a broker trade over whole or partial certificate quantities (PROPOSED; no locks yet)", roles: [BrokerTrader], code: 201, input: [from_account_id, to_account_id, items, unit_price_cents_per_mwh, settlement_mode], output: Trade, side_effects: [] }
  - { method: GET, path: "/greenpower/trades", description: "List trades with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "from_account_id?", "to_account_id?", "status?"], output: "Trade[]", side_effects: [] }
  - { method: GET, path: "/greenpower/trades/{id}", description: "Fetch one trade", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Trade, side_effects: [] }
  - { method: POST, path: "/greenpower/trades/{id}/accept", description: "Buyer accepts: PROPOSED -> ACCEPTED; locks all item certificates atomically; sets 5-day settlement deadline", roles: [BrokerTrader], code: 200, input: [], output: Trade, side_effects: ["Trade state transition", "Certificate ACTIVE -> LOCKED per item"] }
  - { method: POST, path: "/greenpower/trades/{id}/settle", description: "Buyer settles before deadline: transfers/splits certificates, computes proceeds per trade_settlement", roles: [BrokerTrader], code: 200, input: [], output: Trade, side_effects: ["Trade state transition", "serial_split_partition per partial item", "holdings recompute on both accounts"] }
  - { method: POST, path: "/greenpower/trades/{id}/cancel", description: "Seller cancels a PROPOSED trade (no locks engaged)", roles: [BrokerTrader], code: 200, input: [], output: Trade, side_effects: ["Trade state transition"] }
  - { method: POST, path: "/greenpower/trades/{id}/expire", description: "Registry expires an ACCEPTED trade past its deadline: unlocks certificates, strikes the buyer", roles: [RegistryAdmin], code: 200, input: [], output: Trade, side_effects: ["Trade state transition", "certificates unlock", "buyer failure_strikes += 1 -> possible suspension cascade"] }

  # --- Programs ---
  - { method: POST, path: "/greenpower/programs", description: "Create a green tariff program (DRAFT)", roles: [RegistryAdmin], code: 201, input: [name, market_class, eligible_region_codes, eligible_technologies, capacity_cap_kw, rate_tiers, annual_claim_cap_mwh, "vintage_window_months?", "kwh_per_kw_monthly?", "holding_account_id?"], output: Program, side_effects: [] }
  - { method: GET, path: "/greenpower/programs", description: "List programs with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "status?", "market_class?", "holding_account_id?"], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/greenpower/programs/{id}", description: "Fetch one program (includes committed_capacity_kw)", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Program, side_effects: [] }
  - { method: PATCH, path: "/greenpower/programs/{id}", description: "Amend program config (OCC-guarded); raising capacity_cap_kw triggers the waitlist promotion scan", roles: [RegistryAdmin], code: 200, input: [expected_program_version, "name?", "capacity_cap_kw?", "rate_tiers?", "eligible_region_codes?", "eligible_technologies?", "vintage_window_months?", "annual_claim_cap_mwh?", "holding_account_id?"], output: Program, side_effects: ["increments Program.version by 1", "capacity increase -> waitlist_promotion_scan"] }
  - { method: POST, path: "/greenpower/programs/{id}/open", description: "DRAFT -> OPEN (requires wired holding account)", roles: [RegistryAdmin], code: 200, input: [], output: Program, side_effects: ["Program state transition"] }
  - { method: POST, path: "/greenpower/programs/{id}/archive", description: "OPEN -> ARCHIVED (requires no live subscriptions)", roles: [RegistryAdmin], code: 200, input: [], output: Program, side_effects: ["Program state transition"] }

  # --- Subscriptions ---
  - { method: POST, path: "/greenpower/subscriptions", description: "Enroll a customer (PENDING); OCC-guarded on Program.version", roles: [ProgramManager], code: 201, input: [program_id, customer_name, utility_account_no, allocation_kw, estimated_usage_kwh, expected_program_version], output: Subscription, side_effects: ["increments Program.version by 1"] }
  - { method: GET, path: "/greenpower/subscriptions", description: "List subscriptions with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "program_id?", "status?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/greenpower/subscriptions/{id}", description: "Fetch one subscription", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/greenpower/subscriptions/{id}/activate", description: "PENDING -> ACTIVE if capacity fits, else PENDING -> WAITLISTED (not an error)", roles: [ProgramManager], code: 200, input: [], output: Subscription, side_effects: ["Subscription state transition", "Program.committed_capacity_kw recompute"] }
  - { method: POST, path: "/greenpower/subscriptions/{id}/suspend", description: "ACTIVE -> SUSPENDED (retains capacity allocation)", roles: [ProgramManager], code: 200, input: [], output: Subscription, side_effects: ["Subscription state transition"] }
  - { method: POST, path: "/greenpower/subscriptions/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [ProgramManager], code: 200, input: [], output: Subscription, side_effects: ["Subscription state transition"] }
  - { method: POST, path: "/greenpower/subscriptions/{id}/terminate", description: "PENDING/WAITLISTED/ACTIVE/SUSPENDED -> TERMINATED; releases capacity and triggers waitlist promotion scan", roles: [ProgramManager], code: 200, input: [], output: Subscription, side_effects: ["Subscription state transition", "capacity release", "waitlist_promotion_scan cascade"] }

  # --- Bills ---
  - { method: POST, path: "/greenpower/bills", description: "Create a monthly bill (DRAFT) with PROVISIONAL credit from estimated usage", roles: [ProgramManager], code: 201, input: [subscription_id, period_month, usage_kwh, charges_cents], output: Bill, side_effects: ["computes provisional_credit_cents (PROVISIONAL variant)"] }
  - { method: GET, path: "/greenpower/bills", description: "List bills with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "subscription_id?", "status?", "period_month?"], output: "Bill[]", side_effects: [] }
  - { method: GET, path: "/greenpower/bills/{id}", description: "Fetch one bill", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Bill, side_effects: [] }
  - { method: POST, path: "/greenpower/bills/{id}/issue", description: "DRAFT -> ISSUED; computes FINAL credit (actual usage, proration, charges cap)", roles: [ProgramManager], code: 200, input: [], output: Bill, side_effects: ["Bill state transition", "computes issued_credit_cents (FINAL variant)"] }
  - { method: POST, path: "/greenpower/bills/{id}/dispute", description: "ISSUED -> DISPUTED", roles: [ProgramManager], code: 200, input: ["reason?"], output: Bill, side_effects: ["Bill state transition"] }
  - { method: POST, path: "/greenpower/bills/{id}/reissue", description: "DISPUTED -> ISSUED with optional corrected usage/charges; recomputes FINAL credit", roles: [ProgramManager], code: 200, input: ["usage_kwh?", "charges_cents?"], output: Bill, side_effects: ["Bill state transition", "recomputes issued_credit_cents"] }
  - { method: POST, path: "/greenpower/bills/{id}/void", description: "DRAFT or DISPUTED -> VOID (terminal)", roles: [ProgramManager], code: 200, input: [], output: Bill, side_effects: ["Bill state transition"] }

  # --- Retirements ---
  - { method: POST, path: "/greenpower/retirements", description: "Retire a whole ACTIVE certificate for a purpose; double-count prevention via terminal RETIRED status, unique wholesale claim references, and claimed_in_report_id", roles: [ProgramManager, ComplianceOfficer, BrokerTrader], code: 201, input: [certificate_id, purpose, "program_id?", "obligation_id?", "external_claim_reference?"], output: Retirement, side_effects: ["Certificate ACTIVE -> RETIRED", "compliance: obligation coverage recompute (increments ComplianceObligation.version by 1) -> possible OPEN -> MET", "voluntary: Program.retired_mwh_current_year recompute"] }
  - { method: GET, path: "/greenpower/retirements", description: "List retirements with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "certificate_id?", "account_id?", "program_id?", "obligation_id?", "purpose?"], output: "Retirement[]", side_effects: [] }
  - { method: GET, path: "/greenpower/retirements/{id}", description: "Fetch one retirement", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: Retirement, side_effects: [] }

  # --- Compliance obligations ---
  - { method: POST, path: "/greenpower/compliance-obligations", description: "Create an annual RPS-style obligation (OPEN)", roles: [ComplianceOfficer], code: 201, input: [lse_name, year, region_code, required_mwh, "penalty_rate_cents_per_mwh?"], output: ComplianceObligation, side_effects: [] }
  - { method: GET, path: "/greenpower/compliance-obligations", description: "List obligations with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "year?", "status?", "region_code?"], output: "ComplianceObligation[]", side_effects: [] }
  - { method: GET, path: "/greenpower/compliance-obligations/{id}", description: "Fetch one obligation", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: ComplianceObligation, side_effects: [] }
  - { method: PATCH, path: "/greenpower/compliance-obligations/{id}", description: "True-up amendment of required_mwh / penalty rate (OCC-guarded); may auto-flip MET -> OPEN", roles: [ComplianceOfficer], code: 200, input: [expected_obligation_version, "required_mwh?", "penalty_rate_cents_per_mwh?"], output: ComplianceObligation, side_effects: ["increments ComplianceObligation.version by 1", "compliance_coverage re-derivation"] }
  - { method: POST, path: "/greenpower/compliance-obligations/{id}/close", description: "Annual close: covered -> CLOSED_MET (penalty 0); deficit -> CLOSED_SHORTFALL with penalty", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceObligation, side_effects: ["ComplianceObligation state transition", "shortfall_penalty computation"] }

  # --- Claim reports ---
  - { method: POST, path: "/greenpower/claim-reports", description: "Create a DRAFT annual claim report; pins the current unclaimed retirement set for its scope + year", roles: [ProgramManager, ComplianceOfficer], code: 201, input: [scope, report_year, "program_id?", "obligation_id?"], output: ClaimReport, side_effects: ["pins retirement_ids per claim_totalization"] }
  - { method: GET, path: "/greenpower/claim-reports", description: "List claim reports with filters", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?", "program_id?", "obligation_id?", "status?", "report_year?"], output: "ClaimReport[]", side_effects: [] }
  - { method: GET, path: "/greenpower/claim-reports/{id}", description: "Fetch one claim report", roles: [RegistryAdmin, GeneratorOperator, MeterAttester, BrokerTrader, ProgramManager, ComplianceOfficer, Auditor], code: 200, input: [], output: ClaimReport, side_effects: [] }
  - { method: POST, path: "/greenpower/claim-reports/{id}/submit", description: "DRAFT -> SUBMITTED; enforces double-count guard before claim cap (safety before fiscal)", roles: [ProgramManager, ComplianceOfficer], code: 200, input: [], output: ClaimReport, side_effects: ["ClaimReport state transition"] }
  - { method: POST, path: "/greenpower/claim-reports/{id}/accept", description: "SUBMITTED -> ACCEPTED by Auditor (segregation of duties); marks pinned retirements claimed", roles: [Auditor], code: 200, input: [], output: ClaimReport, side_effects: ["ClaimReport state transition", "sets claimed_in_report_id on pinned Retirements"] }
  - { method: POST, path: "/greenpower/claim-reports/{id}/reject", description: "SUBMITTED -> REJECTED by Auditor with reason", roles: [Auditor], code: 200, input: ["reason?"], output: ClaimReport, side_effects: ["ClaimReport state transition"] }
  - { method: POST, path: "/greenpower/claim-reports/{id}/revise", description: "REJECTED -> DRAFT; recomputes the pinned retirement set from scratch", roles: [ProgramManager, ComplianceOfficer], code: 200, input: [], output: ClaimReport, side_effects: ["ClaimReport state transition", "re-pins retirement_ids"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/greenpower/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; this endpoint moves the logical clock to any ISO 8601 UTC instant", roles: [RegistryAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets logical clock"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint, or ownership/purpose/scope mismatch (wrong broker account, wrong generator, purpose-role mismatch on retirements, scope-role mismatch on reports)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK target does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }
  - { id: ERR_GENERATOR_NOT_ACTIVE, http: 409, condition: "Meter-reading creation or mint-run while generator is not ACTIVE" }
  - { id: ERR_INVALID_GENERATOR_STATE, http: 409, condition: "Generator lifecycle action attempted from a wrong state (including terminal DECOMMISSIONED)" }
  - { id: ERR_INVALID_READING_STATE, http: 409, condition: "Reading transition attempted from a wrong state" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Trade or retirement involves a SUSPENDED account" }
  - { id: ERR_CERTIFICATE_NOT_ACTIVE, http: 409, condition: "Retire/trade-item requires ACTIVE certificate; revoke requires ACTIVE or LOCKED (RETIRED/REVOKED rejected)" }
  - { id: ERR_TRADE_STATE_INVALID, http: 409, condition: "Trade transition attempted from a wrong state" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Subscription create/activate/reinstate while program is not OPEN" }
  - { id: ERR_SUBSCRIPTION_STATE_INVALID, http: 409, condition: "Subscription transition attempted from a wrong state; bill creation on a non-ACTIVE/non-SUSPENDED subscription" }
  - { id: ERR_BILL_STATE_INVALID, http: 409, condition: "Bill transition attempted from a wrong state (e.g. issue an ISSUED bill, dispute a DRAFT bill)" }
  - { id: ERR_OBLIGATION_NOT_OPEN, http: 409, condition: "Compliance retirement or amendment against a non-OPEN obligation; close of a CLOSED_* obligation" }
  - { id: ERR_REPORT_STATE_INVALID, http: 409, condition: "ClaimReport transition attempted from a wrong state" }
  - { id: ERR_SELF_ATTESTATION, http: 403, condition: "MeterAttester attesting/rejecting a reading they themselves submitted (segregation of duties)" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "Auditor accepting/rejecting a report they themselves submitted (segregation of duties)" }
  - { id: ERR_DOUBLE_COUNT, http: 422, condition: "Submitting report pins a retirement already claimed by another ACCEPTED report" }
  - { id: ERR_PERIOD_INVERTED, http: 400, condition: "period_end <= period_start" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "Reading period_end after logical clock now, or bill period_month after clock month" }
  - { id: ERR_READING_PERIOD_OVERLAP, http: 409, condition: "Half-open interval overlap with an existing non-terminal reading of the same generator" }
  - { id: ERR_ATTESTATION_WINDOW_EXPIRED, http: 422, condition: "Attestation attempted more than 30 days after period_end" }
  - { id: ERR_SETTLEMENT_WINDOW_EXPIRED, http: 422, condition: "Settle attempted after settlement_deadline" }
  - { id: ERR_TRADE_NOT_EXPIRED, http: 409, condition: "Expire attempted while logical clock now <= settlement_deadline" }
  - { id: ERR_VINTAGE_INELIGIBLE, http: 422, condition: "Certificate vintage outside the program's month window or the obligation's year window" }
  - { id: ERR_REGION_INELIGIBLE, http: 422, condition: "Certificate region_code not eligible for the retirement target" }
  - { id: ERR_TECHNOLOGY_INELIGIBLE, http: 422, condition: "Certificate technology not in the program's eligible_technologies" }
  - { id: ERR_DUPLICATE_CLAIM_REFERENCE, http: 409, condition: "external_claim_reference already used by another retirement" }
  - { id: ERR_DUPLICATE_BILL, http: 409, condition: "Non-VOID bill already exists for subscription_id + period_month" }
  - { id: ERR_DUPLICATE_UTILITY_ACCOUNT, http: 409, condition: "utility_account_no already enrolled non-TERMINATED in this program" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "An ACCEPTED report already exists for this scope target + report_year" }
  - { id: ERR_QUANTITY_INVALID, http: 400, condition: "Non-positive or out-of-range quantity (kwh, allocation_kw, trade item quantity, usage, charges)" }
  - { id: ERR_MARKET_CLASS_MISMATCH, http: 422, condition: "Subscription or voluntary retirement into a COMPLIANCE-class program" }
  - { id: ERR_REPORT_EMPTY, http: 422, condition: "Submitting a report whose pinned retirement set is empty" }
  - { id: ERR_ALLOCATION_EXCEEDS_CAP, http: 422, condition: "allocation_kw greater than the program capacity_cap_kw (can never fit)" }
  - { id: ERR_CLAIM_CAP_EXCEEDED, http: 422, condition: "Submitting report total_mwh exceeds Program.annual_claim_cap_mwh" }
  - { id: ERR_READING_ALREADY_MINTED, http: 409, condition: "Voiding a reading already consumed by a mint run" }
  - { id: ERR_PROGRAM_HAS_ACTIVE_SUBSCRIPTIONS, http: 409, condition: "Archiving a program with live subscriptions" }
  - { id: ERR_PROGRAM_HOLDING_ACCOUNT_MISSING, http: 422, condition: "Opening a program without a wired PROGRAM holding account" }

roles:
  - name: RegistryAdmin
    description: "Registry/platform operator: verifies generators, administers programs and accounts, runs mint runs, revokes certificates, expires trades, drives the logical clock"
    identity: opaque
    exclusive_operations: ["generator verify/reject-verification/suspend/reinstate/decommission", "generator PATCH", "mint-run", "account create/suspend/reinstate", "certificate revoke", "trade expire", "program create/PATCH/open/archive", "meter-reading accept/void", "_clock/set_current_utc"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: GeneratorOperator
    description: "Operates one generator; X-User-ID equals the Generator.id they operate"
    identity: "entity_backed:Generator"
    exclusive_operations: ["submit-verification for own generator", "create meter readings for own generator", "resubmit own rejected readings"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: MeterAttester
    description: "Independent meter data attester; may never attest or reject a reading they submitted"
    identity: opaque
    exclusive_operations: ["attest readings", "reject readings"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: BrokerTrader
    description: "Broker desk trader; X-User-ID equals the BROKER Account.id they trade for"
    identity: "entity_backed:Account"
    exclusive_operations: ["propose trades from own account", "accept/settle trades into own account", "cancel own proposed trades", "WHOLESALE_CLAIM retirements from own account"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: ProgramManager
    description: "Green tariff program operations: subscriptions, billing, voluntary retirements, voluntary claim reports"
    identity: opaque
    exclusive_operations: ["subscription create/activate/suspend/reinstate/terminate", "bill create/issue/dispute/reissue/void", "VOLUNTARY_PROGRAM retirements", "VOLUNTARY_PROGRAM claim-report create/submit/revise"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: ComplianceOfficer
    description: "Compliance desk: obligations, compliance retirements, compliance claim reports"
    identity: opaque
    exclusive_operations: ["compliance-obligation create/PATCH/close", "COMPLIANCE retirements", "COMPLIANCE_OBLIGATION claim-report create/submit/revise"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: Auditor
    description: "Independent claims auditor; may never decide a report submitted by the same X-User-ID"
    identity: opaque
    exclusive_operations: ["claim-report accept/reject"]
    shared_operations: ["all GET list/detail endpoints"]
