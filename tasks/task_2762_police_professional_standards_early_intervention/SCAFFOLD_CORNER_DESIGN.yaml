              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /investigations/${inv_id}/assignments"
              payload: { expected_investigation_version: "${inv_v}", investigator_officer_id: "${inv_a_id}", assignment_note: "Ahn carries the file." }
              as: IACommander
