scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: inspection_score_provisional_vs_final
        grounds:
          - calculations.inspection_result_score
          - entities.Inspection.fields.result_score
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
        distinguishing_aspect: "Same recorded items (one LIFE_SAFETY MINOR FAIL) give a provisional score of 2.0 (read while IN_PROGRESS) but a final score of 12.0 with status FAILED once the synthetic CRITICAL for the missing mandatory HABITABILITY category is charged; dual variant on the Inspection domain."
        test_recipe:
          setup:
            - "A REGISTERED property with a PERIODIC inspection IN_PROGRESS having exactly one recorded ChecklistItem: LIFE_SAFETY / SMOKE_DETECTOR / FAIL / MINOR."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L1", email: "l1@x.com", phone: "555", mailing_address: "1 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I1", badge_number: "B1", email: "i1@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "10 Maple", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "FAIL", severity: "MINOR" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "GET /inspections/${ins_id}"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { prov_score: "$.data.result_score" }
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { final_score: "$.data.result_score", final_status: "$.data.status" }
          assert:
            - "provisional Inspection.${ins_id}.result_score == 2.0"
            - "final Inspection.${ins_id}.result_score == 12.0"
            - "Inspection.${ins_id}.status == FAILED"

      - name: license_fee_on_time_vs_late
        grounds:
          - calculations.license_fee
          - entities.RentalLicense.fields.fee_cents
          - state_machines.RentalLicense.EXPIRED_to_ACTIVE
        distinguishing_aspect: "Identical property inputs (unit_count 3, year_built 1980, term 1) yield an on_time fee of 30000 at issuance but a late renewal fee of 55000 = round(30000*1.5)+10000; dual variant on the License domain."
        test_recipe:
          setup:
            - "A property with a PASSED periodic inspection and an ACTIVE license issued on_time (fee 30000), then the clock advanced past expires_at so the license is EXPIRED and ready for a late renewal."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L2", email: "l2@x.com", phone: "555", mailing_address: "2 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I2", badge_number: "B2", email: "i2@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "20 Oak", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { prop_v: "$.data.version" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_id: "$.data.id", issue_fee: "$.data.fee_cents" }
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: Registrar
            - call: "GET /properties/${prop_id}/rental-licenses"
              payload: {}
              as: Registrar
              captures: { lic_v: "$.data[0].version", lic_status_before: "$.data[0].status" }
          trigger:
            - call: "POST /rental-licenses/${lic_id}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { renew_fee: "$.data.fee_cents", renew_status: "$.data.status" }
          assert:
            - "issue-time RentalLicense.${lic_id}.fee_cents == 30000"
            - "RentalLicense.${lic_id}.status was EXPIRED before renew (lic_status_before == EXPIRED)"
            - "late renewal RentalLicense.${lic_id}.fee_cents == 55000"
            - "RentalLicense.${lic_id}.status == ACTIVE"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: license_fee_tiered_lead_nonlinear
        grounds:
          - calculations.license_fee
          - entities.Property.fields.unit_count
          - entities.Property.fields.year_built
          - entities.RentalLicense.fields.lead_surcharge_applied
        distinguishing_aspect: "Mode (a): fee = tier_base(selected by unit_count) + lead_surcharge(year_built<1978) then * term_years — 3+ inputs with non-linear tier selection; unit_count 1 + year_built 1950 + term 1 gives (15000+5000)*1 = 20000 with lead_surcharge_applied true."
        test_recipe:
          setup:
            - "A property with unit_count 1 and year_built 1950 (lead-risk)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L3", email: "l3@x.com", phone: "555", mailing_address: "3 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "30 Pine", unit_count: 1, year_built: 1950 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id", prop_v: "$.data.version" }
          trigger:
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_fee: "$.data.fee_cents", lead_applied: "$.data.lead_surcharge_applied" }
          assert:
            - "RentalLicense.fee_cents == 20000"
            - "RentalLicense.lead_surcharge_applied == true"

      - name: property_penalty_total_rounding_order
        grounds:
          - calculations.property_penalty_total
          - calculations.violation_penalty
          - entities.Property.fields.total_penalty_cents
        distinguishing_aspect: "Mode (b): pinned rounding order — round each violation penalty (raw 2500*1.075 = 2687.5 -> 2688) THEN sum the two MAJOR violations = 5376, NOT sum-then-round (round(5375.0) = 5375)."
        test_recipe:
          setup:
            - "A property with two OPEN MAJOR violations (codes PLUMBING and HEAT) from one FAILED periodic inspection, the clock one day past their 14-day cure_deadline."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L4", email: "l4@x.com", phone: "555", mailing_address: "4 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I4", badge_number: "B4", email: "i4@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "40 Elm", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "PLUMBING", result: "FAIL", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "FAIL", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { total: "$.data.total_penalty_cents" }
            - call: "GET /violations?property_id=${prop_id}"
              payload: {}
              as: Registrar
              captures: { v0_pen: "$.data[0].penalty_cents" }
          assert:
            - "Property.${prop_id}.total_penalty_cents == 5376"
            - "each Violation.penalty_cents == 2688 (round_half_up(2500*1.075) == round(2687.5) == 2688)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: violation_remediation_revision_cycle
        grounds:
          - state_machines.Violation.OPEN_to_REMEDIATION_SUBMITTED
          - state_machines.Violation.REMEDIATION_SUBMITTED_to_OPEN
          - entities.Violation.fields.status
        distinguishing_aspect: "Cyclic OPEN->REMEDIATION_SUBMITTED->OPEN on Violation: landlord remediation moves it forward, then a reinspection that re-records the code as FAIL reverts it to OPEN; revision loop on the Violation entity (distinct from the RentalLicense cycle)."
        test_recipe:
          setup:
            - "A property with two OPEN MAJOR violations (PLUMBING, HEAT) from a FAILED periodic inspection; the PLUMBING violation then moved to REMEDIATION_SUBMITTED by the landlord."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L5", email: "l5@x.com", phone: "555", mailing_address: "5 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I5", badge_number: "B5", email: "i5@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "50 Ash", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/checklist-items"
              payload: { category: "HABITABILITY", code: "PLUMBING", result: "FAIL", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "FAIL", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /violations?inspection_id=${ins1}"
              payload: {}
              as: Registrar
              captures: { v_plumb: "$.data[0].id" }
            - call: "POST /violations/${v_plumb}/submit-remediation"
              payload: { remediation_notes: "fixed the pipe" }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T09:00:00Z" }
              as: Registrar
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "REINSPECTION", prior_inspection_id: "${ins1}", scheduled_date: "2026-06-03T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins2: "$.data.id" }
            - call: "POST /inspections/${ins2}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/checklist-items"
              payload: { category: "HABITABILITY", code: "PLUMBING", result: "FAIL", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /violations/${v_plumb}"
              payload: {}
              as: Registrar
              captures: { v_status: "$.data.status" }
          assert:
            - "Violation.${v_plumb}.status == OPEN (reverted from REMEDIATION_SUBMITTED because the reinspection re-recorded PLUMBING as FAIL)"

      - name: license_renewal_expiry_cycle
        grounds:
          - state_machines.RentalLicense.ACTIVE_to_EXPIRED
          - state_machines.RentalLicense.EXPIRED_to_ACTIVE
          - entities.RentalLicense.fields.renewal_count
        distinguishing_aspect: "Cyclic ACTIVE->EXPIRED->ACTIVE on RentalLicense: after the clock passes expires_at the license is EXPIRED, and renewal returns it to ACTIVE with renewal_count incremented to 1; loop on the RentalLicense entity (distinct from the Violation cycle)."
        test_recipe:
          setup:
            - "A property with a PASSED periodic inspection and an ACTIVE license, the clock then advanced past expires_at so the license reads EXPIRED."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L6", email: "l6@x.com", phone: "555", mailing_address: "6 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I6", badge_number: "B6", email: "i6@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "60 Birch", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { prop_v: "$.data.version" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_id: "$.data.id" }
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: Registrar
            - call: "GET /properties/${prop_id}/rental-licenses"
              payload: {}
              as: Registrar
              captures: { lic_v: "$.data[0].version", status_before: "$.data[0].status" }
          trigger:
            - call: "POST /rental-licenses/${lic_id}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { after_status: "$.data.status", after_count: "$.data.renewal_count" }
          assert:
            - "status_before == EXPIRED (the ACTIVE license expired when the clock passed expires_at)"
            - "RentalLicense.${lic_id}.status == ACTIVE after renewal"
            - "RentalLicense.${lic_id}.renewal_count == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: condemnation_issue_depth3_cascade
        grounds:
          - state_machines.CondemnationOrder.DRAFT_to_ISSUED
          - state_machines.Property.SUSPENDED_to_CONDEMNED
          - state_machines.RentalLicense.SUSPENDED_to_REVOKED
          - state_machines.Violation.ESCALATED_to_CONDEMNED_BASIS
        distinguishing_aspect: "Depth-3 chain: issuing the order transitions Property->CONDEMNED (hop 1); that Property change itself revokes the RentalLicense (hop 2, SUSPENDED->REVOKED); the license revocation itself flips the property's non-terminal Violations to CONDEMNED_BASIS (hop 3) — each hop caused by the previous, all originating from the issue trigger."
        test_recipe:
          setup:
            - "A property with an ACTIVE (then cascaded-SUSPENDED) license, two OPEN CRITICAL violations one of which is ESCALATED, and a DRAFT condemnation order citing it."
