scaffold_difficulty_design:

  # ============================================================
  # Rule 1: Dual-variant calculations across DIFFERENT entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: late_fee_per_cycle_vs_continuous_daily
        grounds:
          - calculations.late_fee_assessment
          - state_machines.AssessmentCharge.OPEN_to_OVERDUE
          - entities.AssessmentCharge.fields.late_fee_cents
          - endpoints.POST_/hoa/_clock/advance
        distinguishing_aspect: |
          Operates on the AssessmentCharge entity (a fiscal billing domain). The pinned variant
          accrues late fees in discrete per-cycle-period steps (90 days for REGULAR cycles),
          whereas a naive continuous-daily-prorate would yield a different cents value for the
          same elapsed time — the scaffold pins per_cycle_accrual.
        test_recipe:
          setup:
            - "Seed 1 Unit with share_factor=1.0000 owned by member M1; clock at 2026-01-01T00:00:00Z"
            - "Create REGULAR AssessmentCycle with total_levy_cents=100000, due_date=2026-01-31T23:59:59Z; issue it"
          trigger:
            - "POST /hoa/_clock/advance { target_timestamp: 2026-05-11T00:00:00Z }   # 100 days past due"
            - "GET /hoa/assessment-charges/{charge_id}"
          assert:
            - "AssessmentCharge.status == 'OVERDUE'"
            - "AssessmentCharge.late_fee_cents == 5000   # per_cycle: 2 periods * max(2500, round(100000*0.015)=1500) = 2 * 2500"
            - "AssessmentCharge.late_fee_cents != 2778   # continuous_daily would yield round(2500/90 * 100) = 2778"

      - name: reserve_funding_per_component_then_sum_vs_sum_then_round
        grounds:
          - calculations.reserve_funded_ratio
          - entities.ReserveStudy.fields.full_funding_target_cents
          - entities.ReserveStudy.fields.posture
          - endpoints.POST_/hoa/reserve-studies
        distinguishing_aspect: |
          Operates on the ReserveStudy entity (a capital-planning domain, structurally
          unrelated to AssessmentCharge fiscal accounting). The pinned variant rounds each
          component's accrued depreciation BEFORE summation; the rejected variant sums in
          floats and rounds once at the end. They produce different cents at half-cent
          boundaries, which in turn flip posture across thresholds.
        test_recipe:
          setup:
            - "No prior reserve studies"
          trigger:
            - "POST /hoa/reserve-studies with components=[{replacement_cost_cents:100000, useful_life_years:10, remaining_life_years:5}, {replacement_cost_cents:33333, useful_life_years:10, remaining_life_years:7}] and current_reserve_balance_cents=15000"
          assert:
            - "ReserveStudy.full_funding_target_cents == 60000   # round_half_up(100000*5/10)=50000 + round_half_up(33333*3/10=9999.9)=10000"
            - "ReserveStudy.funded_ratio == 0.25   # 15000/60000 rounded to 4dp"
            - "ReserveStudy.posture == 'SPECIAL_ASSESSMENT_REQUIRED'   # 0.25 < 0.30"

  # ============================================================
  # Rule 2: Combinatorial formulas across DIFFERENT modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessment_allocation_with_remainder_distribution
        # MODE (b): nested rounding where the order matters — round per unit, then distribute remainder
        grounds:
          - calculations.assessment_charge_allocation
          - state_machines.AssessmentCycle.DRAFT_to_ISSUED
          - entities.AssessmentCharge.fields.principal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Each unit's share is rounded to
          whole cents first; the leftover/excess from rounding is then distributed
          deterministically (largest share_factor DESC, then Unit.id ASC). A naive
          implementation that sums first then rounds, or that distributes remainder by
          arbitrary order, lands different cents on different units.
        test_recipe:
          setup:
            - "Seed 3 Units U1(share_factor=0.3334), U2(0.3333), U3(0.3333) — sum=1.0000"
            - "Create REGULAR AssessmentCycle with total_levy_cents=10001"
          trigger:
            - "POST /hoa/assessment-cycles/{id}/issue"
          assert:
            - "AssessmentCharge(U1).principal_cents == 3335   # round(10001*0.3334)=3334; +1 cent of remainder (U1 has highest share_factor)"
            - "AssessmentCharge(U2).principal_cents == 3333   # round(10001*0.3333)=3333"
            - "AssessmentCharge(U3).principal_cents == 3333   # round(10001*0.3333)=3333"
            - "sum(principal_cents) == 10001   # invariant: equals total_levy_cents exactly"

      - name: payment_waterfall_with_tiered_violation_fine_interaction
        # MODE (a): formula with >=3 inputs and non-linear interaction
        grounds:
          - calculations.violation_fine_amount
          - calculations.member_total_overdue_recompute
          - endpoints.POST_/hoa/payments
          - state_machines.Violation.OPEN_to_FINED
        distinguishing_aspect: |
          Mode (a): non-linear interaction across >=3 inputs. The owed amount depends on
          (i) occurrence_index over prior FINED/CURED/WAIVED Violations (tiered ladder
          0/5000/10000/20000), (ii) AssessmentCharge late_fee accrual periods, and
          (iii) Payment waterfall allocation order (oldest due_date first, late_fee
          before principal within a charge, then FINED violations). Reorder any of the
          three inputs and the final paid_cents-per-charge split changes.
        test_recipe:
          setup:
            - "Unit U1 owned by M1; M1 has 1 prior CURED violation (so next is occurrence_index=2)"
            - "Open a new violation V2 on U1; advance clock past cure_deadline so V2.fine_cents==5000"
            - "Issue 1 REGULAR AssessmentCycle producing 1 OVERDUE charge with principal_cents=10000 and late_fee_cents=2500 (1 period overdue)"
          trigger:
            - "POST /hoa/payments { member_id: M1, amount_cents: 10000 }"
          assert:
            - "After allocation: charge.late_fee_cents debited first (2500), then charge.principal_cents (7500). charge.paid_cents == 10000, charge.principal_cents - 7500 still owed = 2500"
            - "Violation V2.fine_cents still 5000 (not paid — waterfall consumed by charge first)"
            - "Member.total_overdue_amount_cents == (10000 - 10000) + 5000 (V2 fine unpaid) + remaining unpaid principal logic = 2500 + 5000 = 7500"

  # ============================================================
  # Rule 3: Non-linear state-machine shape on DIFFERENT entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: acc_request_branching_with_auto_resolution
        grounds:
          - state_machines.ACCRequest
          - state_machines.ACCRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.ACCRequest.UNDER_REVIEW_to_DENIED
          - state_machines.ACCRequest.UNDER_REVIEW_to_AUTO_APPROVED
          - state_machines.ACCRequest.UNDER_REVIEW_to_AUTO_DENIED
          - state_machines.ACCRequest.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          ACCRequest is a branching fork-join: from UNDER_REVIEW the entity forks into
          four divergent terminal states (APPROVED, DENIED, AUTO_APPROVED, AUTO_DENIED)
          with side-effect sets that differ by category (silent-approval for LANDSCAPING,
          silent-denial for APPEARANCE). This is not a linear pipeline.
        test_recipe:
          setup:
            - "Seed Member M1 with eligible_to_vote=true; Unit U1 owned by M1"
            - "Submit two ACCRequests R1 (category=LANDSCAPING) and R2 (category=APPEARANCE); promote both to UNDER_REVIEW"
          trigger:
            - "POST /hoa/_clock/advance { target_timestamp: submitted_at+31d }"
          assert:
            - "ACCRequest R1.status == 'AUTO_APPROVED'   # LANDSCAPING branch"
            - "ACCRequest R2.status == 'AUTO_DENIED'    # APPEARANCE branch"

      - name: violation_branching_with_waiver_reversal
        grounds:
          - state_machines.Violation
          - state_machines.Violation.OPEN_to_CURED
          - state_machines.Violation.OPEN_to_FINED
          - state_machines.Violation.FINED_to_WAIVED
          - state_machines.Violation.OPEN_to_WAIVED
        distinguishing_aspect: |
          Violation (different entity from ACCRequest) is a branching machine: OPEN forks
          to {CURED, FINED, WAIVED} with divergent side effects (CURED leaves fine_cents=0
          and does not touch Member.total_overdue; FINED posts fine_cents and recomputes
          owner overdue; WAIVED from FINED REVERSES the fine_cents to 0 and recomputes
          owner overdue — distinct side-effect set per branch).
        test_recipe:
          setup:
            - "Seed Unit U1 owned by M1, no prior violations"
            - "Open 3 violations V1, V2, V3 on U1; advance clock past all cure_deadlines so they auto-FINE"
            - "V1 fine_cents=0 (occurrence 1), V2=5000 (occurrence 2), V3=10000 (occurrence 3)"
            - "Create+pass BoardResolution(subject=FINE_WAIVER, target_id=V3)"
          trigger:
            - "POST /hoa/violations/V3/waive { resolution_id: <resolution> }"
          assert:
            - "Violation V3.status == 'WAIVED'"
            - "Violation V3.fine_cents == 0   # reset by waiver branch"
            - "Member M1.total_overdue_amount_cents reflects only V2's 5000 (V1=0, V3 waived)"

  # ============================================================
  # Rule 4: Transitive cascade chains from DIFFERENT triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: violation_fine_to_overdue_to_lien_eligible
        # depth 3: Violation.OPEN→FINED  =>  Member.total_overdue_amount_cents recomputed (crosses 180000)
        #                                =>  Lien eligibility opens; Secretary can POST /hoa/liens
        grounds:
          - state_machines.Violation.OPEN_to_FINED
          - calculations.member_total_overdue_recompute
          - state_machines.AssessmentCharge.OPEN_to_OVERDUE
          - endpoints.POST_/hoa/liens
        distinguishing_aspect: |
          Trigger: time-based auto-FINE on Violation. Hop 1: Violation.OPEN→FINED writes
          fine_cents. Hop 2: that write causes Member.total_overdue_amount_cents to
          recompute and cross 180000. Hop 3: that crossing — together with existing
          AssessmentCharge.OVERDUE>=60d — unlocks Lien.NOTICE creation (previously
          rejected with ERR_INVALID_STATE). Each hop is caused by the previous hop, not
          by the original action.
        test_recipe:
          setup:
            - "Unit U1 owned by M1; issue REGULAR cycle generating charge C1 with principal_cents=175000"
            - "Advance clock 60 days past due_date — C1 becomes OVERDUE; M1.total_overdue=175000 (below 180000 threshold)"
            - "Attempting POST /hoa/liens at this point would fail with ERR_INVALID_STATE (overdue < 180000)"
            - "Open Violation V2 on U1 (occurrence_index=2 because of any prior CURED/FINED/WAIVED; or just opens as 1 — adjust setup so it becomes index 2 by seeding one prior CURED)"
          trigger:
            - "POST /hoa/_clock/advance past V2.cure_deadline — V2 auto-FINES with fine_cents=5000"
            - "POST /hoa/liens { unit_id: U1 }"
          assert:
            - "After advance: Violation V2.status == 'FINED', V2.fine_cents == 5000"
            - "After advance: Member M1.total_overdue_amount_cents == 175000 + 5000 == 180000 (threshold crossed)"
            - "POST /hoa/liens succeeds with 201 (Lien created in NOTICE_SENT) — would have returned ERR_INVALID_STATE before the cascade"

      - name: election_certification_demotes_then_blocks_acc_votes
        # depth 3: ElectionCycle.TALLIED→CERTIFIED  =>  prior holder Member.board_role := NONE
        #                                           =>  prior holder loses ACCVote eligibility (future votes 403)
        grounds:
          - state_machines.ElectionCycle.TALLIED_to_CERTIFIED
          - entities.Member.fields.board_role
          - validations[priority=7]
          - endpoints.POST_/hoa/acc-requests/{id}/votes
        distinguishing_aspect: |
          Trigger: SecretaryRole POSTs /elections/{id}/certify (a board-governance event,
          structurally unrelated to the time-based fine cascade above). Hop 1: election
          CERTIFIED sets winner Member.board_role = seat. Hop 2: the prior seat-holder's
          Member.board_role is demoted to NONE as a consequence of the same certification.
          Hop 3: the demoted member can no longer cast ACCVote (subsequent attempts
          return ERR_NOT_ON_ACC), even on requests already UNDER_REVIEW.
        test_recipe:
          setup:
            - "Members M_old (SECRETARY), M_new (eligible, ran for SECRETARY), and 4 other voters"
            - "Open ElectionCycle for seat=SECRETARY; nominate M_new; advance clock to voting period; cast ballots so M_new wins; advance past voting_close_at (status=TALLIED, winner=M_new)"
            - "An ACCRequest R1 is UNDER_REVIEW; M_old has not yet voted on R1"
          trigger:
            - "POST /hoa/elections/{id}/certify"
            - "POST /hoa/acc-requests/R1/votes { vote: YES }  with X-User-ID = M_old"
          assert:
            - "After certify: Member M_new.board_role == 'SECRETARY'"
            - "After certify: Member M_old.board_role == 'NONE' (demoted as cascade hop)"
            - "Subsequent ACCVote by M_old returns 403 with error_id ERR_NOT_ON_ACC"

  # ============================================================
  # Rule 5: Validation priority conflicts across DIFFERENT error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_lien_record
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - state_machines.Lien.NOTICE_SENT_to_RECORDED
          - endpoints.POST_/hoa/liens/{id}/record
        distinguishing_aspect: |
          Error-category pair: state (priority 4) vs business_safety (priority 6).
          When a caller attempts to RECORD a Lien already in RECORDED status (state
          failure) WHILE also missing the 30-day cooling-off (business_safety failure),
          the higher-priority state check must win — server returns ERR_INVALID_STATE,
          not ERR_LIEN_COOLING_OFF.
        test_recipe:
          setup:
            - "Set up an already-RECORDED Lien L1 (manipulate via the full happy path)"
            - "Construct a SECOND scenario reachable in test where created_at is < 30 days ago AND status==RECORDED (test re-records after manipulating; or use a second lien that we record then attempt to re-record while still inside the cooling-off of its own creation)"
          trigger:
            - "POST /hoa/liens/{L1}/record { resolution_id: <any>, version: <current> }"
          assert:
            - "HTTP 409"
            - "data.error_id == 'ERR_INVALID_STATE'   # state check fires first; cooling-off is never reached"

      - name: business_constraint_vs_business_temporal_on_ballot_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - endpoints.POST_/hoa/elections/{id}/ballots
        distinguishing_aspect: |
          Error-category pair: business_constraint (priority 8, voter eligibility) vs
          business_temporal (priority 9, voting window). A ballot from an ineligible
          voter cast AFTER voting_close_at fails BOTH; the priority-8 check must win,
          returning ERR_VOTER_INELIGIBLE, not ERR_VOTING_CLOSED — a different pair from
          the (state, business_safety) instance above.
        test_recipe:
          setup:
            - "ElectionCycle with voting_close_at in the past (status=TALLIED or FAILED_QUORUM after clock advance)"
            - "Member M_ineligible has eligible_to_vote==false (e.g., has total_overdue > 0)"
          trigger:
            - "POST /hoa/elections/{id}/ballots { voter_member_id: M_ineligible, candidate_id: C1 }"
          assert:
            - "HTTP 403"
            - "data.error_id == 'ERR_VOTER_INELIGIBLE'   # priority 8 fires before priority 9 (ERR_VOTING_CLOSED)"

  # ============================================================
  # Rule 6: Boundary-precision checks on DIFFERENT metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: total_overdue_at_exactly_180000_unlocks_lien
        grounds:
          - validations[priority=4]
          - state_machines.Lien
          - entities.Member.fields.total_overdue_amount_cents
          - endpoints.POST_/hoa/liens
        distinguishing_aspect: |
          Numeric threshold on a monetary metric: the eligibility test uses >= 180000
          (not > 180000). At exactly 180000 cents, POST /hoa/liens succeeds; at 179999
          cents it fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Two parallel scenarios. Scenario A: Member M_A.total_overdue_amount_cents == 179999. Scenario B: Member M_B.total_overdue_amount_cents == 180000. Both have at least one charge OVERDUE >= 60 days."
          trigger:
            - "POST /hoa/liens { unit_id: U_A }"
            - "POST /hoa/liens { unit_id: U_B }"
          assert:
            - "Scenario A: HTTP 409, data.error_id == 'ERR_INVALID_STATE'"
            - "Scenario B: HTTP 201, Lien created with status='NOTICE_SENT'"

      - name: election_with_zero_candidates_auto_voids
        grounds:
          - state_machines.ElectionCycle.NOMINATION_to_VOIDED
          - endpoints.POST_/hoa/_clock/advance
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (count of Candidate rows) and
          a different endpoint (clock-advance, not POST /hoa/liens). With zero candidates
          at voting_open_at, ElectionCycle transitions NOMINATION→VOIDED (not VOTING).
          With >=1 candidate it transitions to VOTING.
        test_recipe:
          setup:
            - "Two elections E_empty and E_one. Register zero Candidates for E_empty; register exactly one Candidate for E_one. Both have the same voting_open_at."
          trigger:
            - "POST /hoa/_clock/advance { target_timestamp: voting_open_at }"
          assert:
            - "ElectionCycle E_empty.status == 'VOIDED'"
            - "ElectionCycle E_one.status == 'VOTING'   # the 1-candidate boundary still admits the election"

  # ============================================================
  # Rule 7: Cross-entity state dependencies across DIFFERENT entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: acc_begin_review_depends_on_member_total_overdue
        grounds:
          - validations[priority=13]
          - state_machines.ACCRequest.SUBMITTED_to_UNDER_REVIEW
          - entities.Member.fields.total_overdue_amount_cents
        distinguishing_aspect: |
          Entity pair: ACCRequest → Member. ACCRequest's SUBMITTED→UNDER_REVIEW transition
          is gated by the state of a Member (specifically total_overdue_amount_cents == 0
          on the unit owner). A delinquent owner blocks the transition with
          ERR_OWNER_DELINQUENT.
        test_recipe:
          setup:
            - "Unit U1 owned by M1; M1.total_overdue_amount_cents == 0; submit ACC request R1"
            - "Issue an AssessmentCycle making M1.total_overdue_amount_cents > 0 (e.g., advance clock past due_date)"
          trigger:
            - "POST /hoa/acc-requests/R1/begin-review"
          assert:
            - "HTTP 409, data.error_id == 'ERR_OWNER_DELINQUENT'"
            - "ACCRequest R1.status still == 'SUBMITTED'"

      - name: acc_begin_review_depends_on_reserve_study_posture
        grounds:
          - validations[priority=14]
          - state_machines.ReserveStudy.DRAFT_to_ADOPTED
          - entities.ReserveStudy.fields.posture
        distinguishing_aspect: |
          Entity pair: ACCRequest → ReserveStudy (a different pair from ACCRequest → Member
          above). ACCRequest's SUBMITTED→UNDER_REVIEW is also gated by the latest ADOPTED
          ReserveStudy's posture: when posture==SPECIAL_ASSESSMENT_REQUIRED the transition
          fails with ERR_RESERVE_POSTURE_BLOCKS_ACC.
        test_recipe:
          setup:
            - "Unit U1 owned by M1; M1.total_overdue == 0; submit ACC request R1"
            - "Create ReserveStudy with posture=SPECIAL_ASSESSMENT_REQUIRED (e.g., balance=15000, target=60000); pass an adoption BoardResolution; adopt the study"
          trigger:
            - "POST /hoa/acc-requests/R1/begin-review"
          assert:
            - "HTTP 409, data.error_id == 'ERR_RESERVE_POSTURE_BLOCKS_ACC'"

  # ============================================================
  # Rule 8: Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ballot_window_half_open_election_interval
        grounds:
          - validations[priority=9]
          - entities.ElectionCycle.fields.voting_open_at
          - entities.ElectionCycle.fields.voting_close_at
          - endpoints.POST_/hoa/elections/{id}/ballots
        distinguishing_aspect: |
          Interval semantics: half-open [voting_open_at, voting_close_at) on the
          ElectionCycle resource. A ballot cast at exactly voting_open_at is accepted;
          a ballot cast at exactly voting_close_at is rejected (close is exclusive).
          Adjacency between two elections with the same close-instant does not double-book.
        test_recipe:
          setup:
            - "ElectionCycle E1 with voting_open_at=T, voting_close_at=T+24h"
            - "Two eligible voters M_a and M_b; one Candidate C1"
          trigger:
            - "Advance clock to exactly T; POST ballot { voter: M_a, candidate: C1 }"
            - "Advance clock to exactly T+24h; POST ballot { voter: M_b, candidate: C1 }"
          assert:
            - "First ballot succeeds (HTTP 201)   # open boundary inclusive"
            - "Second ballot returns HTTP 409 with error_id == 'ERR_VOTING_CLOSED'   # close boundary exclusive"

      - name: nomination_window_with_adjacency_to_voting
        grounds:
          - validations[priority=16]
          - entities.ElectionCycle.fields.nomination_open_at
          - entities.ElectionCycle.fields.voting_open_at
          - endpoints.POST_/hoa/elections/{id}/candidates
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT temporal boundary of the same
          resource type: nomination window is [nomination_open_at, voting_open_at) AND
          MUST be adjacent (no gap, no overlap) with voting window — registering a
          candidate at exactly voting_open_at falls into the voting window and is
          rejected with ERR_NOMINATION_CLOSED, even though no ballot has been cast yet.
        test_recipe:
          setup:
            - "ElectionCycle E2 with nomination_open_at=T0, voting_open_at=T1, voting_close_at=T1+24h"
            - "Two candidate-hopefuls M_x and M_y"
          trigger:
            - "Advance clock to exactly T0; POST candidate { member_id: M_x }"
            - "Advance clock to exactly T1; POST candidate { member_id: M_y }"
          assert:
            - "First candidate registered (HTTP 201)   # nomination_open_at inclusive"
            - "Second candidate returns HTTP 409 with error_id == 'ERR_NOMINATION_CLOSED'   # voting_open_at is exclusive end of nomination interval"

  # ============================================================
  # Rule 9: Compensating-action invariants across DIFFERENT conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: violation_waiver_reverses_member_total_overdue
        grounds:
          - state_machines.Violation.OPEN_to_FINED
          - state_machines.Violation.FINED_to_WAIVED
          - calculations.member_total_overdue_recompute
          - entities.Member.fields.total_overdue_amount_cents
        distinguishing_aspect: |
          Conserved quantity: Member.total_overdue_amount_cents (an aggregate monetary
          measure over a member's unpaid obligations). Forward action: Violation.OPEN→FINED
          raises total_overdue by fine_cents. Compensating action: Violation.FINED→WAIVED
          via PASSED FINE_WAIVER resolution sets fine_cents back to 0 and recomputes
          total_overdue. The invariant: total_overdue BEFORE the fine == total_overdue
          AFTER the waiver (no drift).
        test_recipe:
          setup:
            - "Unit U1 owned by M1; seed M1.total_overdue_amount_cents == 0; one prior CURED violation on U1"
            - "Snapshot before = M1.total_overdue_amount_cents (==0)"
            - "Open Violation V2 on U1; advance clock past cure_deadline → V2 auto-FINED with fine_cents=5000; M1.total_overdue==5000"
            - "Create and pass BoardResolution(subject=FINE_WAIVER, target_id=V2)"
          trigger:
            - "POST /hoa/violations/V2/waive { resolution_id: <res> }"
          assert:
            - "Violation V2.status == 'WAIVED' and V2.fine_cents == 0"
            - "Member M1.total_overdue_amount_cents == 0   # exactly equals the pre-fine snapshot — no drift"

      - name: lien_release_restores_unit_lien_status_to_pre_recordation_view
        grounds:
          - state_machines.Lien.NOTICE_SENT_to_RECORDED
          - state_machines.Lien.RECORDED_to_RELEASED
          - entities.Unit.fields.lien_status
        distinguishing_aspect: |
          DIFFERENT conserved quantity: a Boolean encumbrance posture on the Unit
          (Unit.lien_status reflecting RECORDED vs RELEASED). Forward action: Lien
          RECORD sets Unit.lien_status='RECORDED' (encumbered). Compensating action:
          Lien RELEASE sets Unit.lien_status='RELEASED' AND the unit's marketable-title
          quality returns — invariant: after RELEASE, no active RECORDED Lien exists on
          the unit, and the most recent terminal lien_status == 'RELEASED' (not
          'NOTICE_SENT' drift). The conserved quantity is structural (presence/absence
          of an active encumbrance), not monetary.
        test_recipe:
          setup:
            - "Drive Unit U1 through full lien lifecycle to status=RECORDED with cumulative overdue triggering eligibility"
            - "Member M1 pays off all overdue obligations so total_overdue_amount_cents == 0"
            - "Snapshot of (count of Lien rows on U1 with status==RECORDED) before release = 1"
            - "Create and pass BoardResolution(subject=LIEN_RELEASE, target_id=L1)"
          trigger:
            - "POST /hoa/liens/L1/release { resolution_id: <res> }"
          assert:
            - "Lien L1.status == 'RELEASED'"
            - "Unit U1.lien_status == 'RELEASED'   # no drift back to NOTICE_SENT"
            - "count of Lien rows on U1 with status=='RECORDED' == 0   # encumbrance invariant: forward+compensate leaves zero active recorded liens"
