            - "NOT CONSERVED: Brewer.${b1_id}.upheld_loss_count is still 1 and LossAssessment.${la1_id}.assessment_status is still UPHELD"
            - "NOT CONSERVED: Keg.${k1_id}.custody_state is still LOST and KegPool.${p1_id}.kegs_written_off is still 1 with kegs_circulating 6 and available_pct 30.00"
            - "NOT CONSERVED: FloatAgreement.${fa1_id}.billed_amount_cents is still 15136 and billed_fills_count is still 7 (fill revenue is untouched by a chargeback reversal)"
            - "the REVERSE is AssetRecoveryAnalyst-exclusive: the same call issued as PoolOperator would return ERR_FORBIDDEN_ROLE (403), and a SETTLE by an analyst is likewise refused"
