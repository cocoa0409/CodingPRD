      - name: missing_or_unknown_role_header_is_unauthenticated
        claim_type: peer_roles
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - roles[Shipper].identity
          - roles[TerminalOperator].identity
        distinguishing_aspect: "Authentication is checked before authorization and before payload validation: an omitted X-Role, an X-Role naming a role that does not exist, and an entity-backed role with no X-User-ID all return 401 ERR_UNAUTHENTICATED rather than 403 or 400 -- even when the body is deliberately malformed."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; terminal TRM1; customer ACME exists; nothing else is required because no call is expected to reach domain logic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
