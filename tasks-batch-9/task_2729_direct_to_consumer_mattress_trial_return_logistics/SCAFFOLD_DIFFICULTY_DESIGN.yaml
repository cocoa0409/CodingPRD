  - rule_id: priority_pair_validation_conflict
    instances:
      - name: abuse_block_p15_outranks_break_in_not_elapsed_p17_on_exchange_request
        grounds:
          - validations[priority=15]
          - validations[priority=17]
          - calculations.abuse_score
          - errors.ERR_TRIAL_ABUSE_BLOCK
          - errors.ERR_BREAK_IN_NOT_ELAPSED
        distinguishing_aspect: |
          Cross-category pair on POST /comfort-exchanges: a fraud gate (business_safety, 403) and a
          clock gate (business_temporal, 422) are violated by the same request, and the lower
          priority number must win. The control call proves the loser is genuinely violated:
          an identical request from a clean customer at the same clock returns
          ERR_BREAK_IN_NOT_ELAPSED, so a naive implementation that checks the clock first is caught.
        test_recipe:
          setup:
            - "Two QUEEN MattressModels: MEDIUM at 120000 cents and FIRM at 139000 cents, break_in_nights 21, trial_nights 100."
            - "Customer A: DTC order delivered 2026-08-01, then four fresh TrialAbuseSignals (HOUSEHOLD_MATCH 30 + REPEAT_RETURN 25 + MULTI_CHANNEL 10 + SHORT_TRIAL 15 = 80) so status is BLOCKED."
            - "Customer B: identical DTC order delivered 2026-08-01 and no signals at all, so status is ACTIVE."
            - "Clock advanced to 2026-08-10, i.e. 12 days before either order's break_in_ends_at of 2026-08-22."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-P", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_med_id: $.data.id }
            - call: "POST /mattress-models"
