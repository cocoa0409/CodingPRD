            - { call: "GET /stations/${st_hkg}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01", captures: { st_v2: $.data.version } }
            - { call: "POST /kennel-allocations", payload: { station_id: "${st_hkg}", animal_record_id: "${an1}", bay_count: 1, occupancy_start_utc: "2026-08-05T14:00:00Z", occupancy_end_utc: "2026-08-05T16:00:00Z", feeding_interval_minutes: 240, expected_station_version: "${st_v2}" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { ka2: $.data.id } }
            - { call: "POST /kennel-allocations/${ka1}/release", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          trigger:
            - { call: "POST /kennel-allocations/${ka2}/release", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "KennelAllocation.${ka1}.status == RELEASED and KennelAllocation.${ka2}.status == RELEASED"
            - "Station.${st_hkg}.reserved_bay_count == 0"
            - "the reserved_bay_count observed after A1's release was 1, not 0 and not 2"
            - "invariant: Station.reserved_bay_count equals the sum of bay_count over allocations in status RESERVED or OCCUPIED, which is 0"
