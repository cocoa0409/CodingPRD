              as: PartnerRepresentative
              as_user_id: ${renter}
              captures: { err: $.data.error_id }
          assert:
            - "RentalOffer.${offer}.negotiation_rounds == 5 after five revise rounds"
            - "sixth counter rejected with error_id == ERR_NEGOTIATION_ROUND_LIMIT, HTTP 422"

