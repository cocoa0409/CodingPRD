      - name: error_model_state_invalid_on_a_decision_without_a_review
        claim_type: Error Triggerable
        grounds:
          - validations[priority=52]
          - errors.ERR_MODEL_STATE_INVALID
        excluded_because:
          difficulty_instance: non_linear_state_machine / model_certification_cycle_with_revision_round
          rationale: "That instance attempts a certification-decision on a DRAFT model inside the revision cycle and pins the 409."
      - name: error_order_state_invalid_on_a_second_allocation
        claim_type: Error Triggerable
        grounds:
          - validations[priority=53]
          - errors.ERR_ORDER_STATE_INVALID
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_state_check_beats_floor_plan_limit_check
          rationale: "That instance re-allocates an ALLOCATED order that would also breach the floor plan, expecting this error by priority."
      - name: error_floor_plan_limit_exceeded_on_an_underfunded_draw
        claim_type: Error Triggerable
        grounds:
          - validations[priority=90]
          - errors.ERR_FLOOR_PLAN_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_state_check_beats_floor_plan_limit_check
          rationale: "That instance isolates the 402 on a PENDING order first, then shows priority 53 masking it, so both branches are exercised there."
      - name: error_stale_jig_version_on_a_superseded_calendar
        claim_type: Error Triggerable
        grounds:
          - validations[priority=46]
          - errors.ERR_STALE_JIG_VERSION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_jig_version_beats_jig_window_conflict
          rationale: "That instance replays a version the previous reservation bumped and pins the 412 ahead of the window conflict."
      - name: error_jig_window_conflict_inside_the_changeover_buffer
        claim_type: Error Triggerable
        grounds:
          - validations[priority=80]
          - errors.ERR_JIG_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / jig_half_open_window_with_trailing_changeover_buffer
          rationale: "That instance rejects a window that starts one minute inside the trailing buffer and accepts one that starts exactly at its end."
      - name: error_brake_requirement_unmet_without_a_breakaway_kit
        claim_type: Error Triggerable
        grounds:
          - validations[priority=63]
          - errors.ERR_BRAKE_REQUIREMENT_UNMET
        excluded_because:
          difficulty_instance: boundary_precision_check / brake_requirement_inclusive_at_gvwr_exactly_3000
          rationale: "That instance omits the breakaway kit on a unit whose pinned GVWR is exactly 3000 and pins the 422 at the boundary."
      - name: error_model_not_certified_when_a_unit_enters_the_jig_too_early
        claim_type: Error Triggerable
        grounds:
          - validations[priority=59]
          - errors.ERR_MODEL_NOT_CERTIFIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / jig_reservation_blocked_until_model_reaches_certified
          rationale: "That instance books the identical window before and after certification, so the 409 and the 201 share one request body."
      - name: error_unit_not_delivered_when_a_claim_is_filed_too_early
        claim_type: Error Triggerable
        grounds:
          - validations[priority=78]
          - errors.ERR_UNIT_NOT_DELIVERED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / warranty_claim_blocked_until_unit_reaches_shipped
          rationale: "That instance files the claim against an ALLOCATED unit, then re-files it after delivery."
      - name: error_lane_capacity_exceeded_on_the_third_overlapping_test
        claim_type: Error Triggerable
        grounds:
          - validations[priority=81]
          - errors.ERR_LANE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lane_closed_intervals_with_aggregate_capacity_of_two
          rationale: "That instance fills LANE-01 with two SCHEDULED tests and pins the 409 on a third that merely touches them."
  - section: RBAC
    instances:
      - name: rbac_plant_engineer_performs_all_four_of_its_exclusive_operations
        claim_type: Exclusive Operations
        grounds:
          - roles.PlantEngineer.exclusive_operations
          - endpoints[POST /trailer-models]
          - endpoints[POST /weld-jigs]
          - endpoints[POST /test-lanes]
        distinguishing_aspect: |
          PlantEngineer owns the asset and configuration registry and nothing else: all four of its exclusive
          writes succeed back to back, and the certification SUBMISSION is among them while the certification
          DECISION deliberately is not - the engineer can put a model up for review but can never sign it off.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /test-lanes"
              payload: { lane_code: "LANE-01", surface_type: "ASPHALT", max_concurrent_tests: 2 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { lane_id: $.data.id }
          assert:
            - "All four responses succeed: 201, 200, 201, 201"
            - "TrailerModel.${model_id}.certification_status == IN_ENGINEERING_REVIEW"
            - "TrailerModel.${model_id}.provisional_gvwr_lbs == 7000 and certified_gvwr_lbs is null"
            - "WeldJig.${jig_id}.changeover_buffer_min == 45 and reserved_minutes_total == 0"
            - "TestLane.${lane_id}.max_concurrent_tests == 2 and surface_type == ASPHALT"
            - "A certification-decision attempted by pe-1 on the same model returns 403 ERR_ROLE_NOT_PERMITTED"
      - name: rbac_every_one_of_the_seven_roles_may_move_the_logical_clock
        claim_type: Shared Operations
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - roles
        distinguishing_aspect: |
          The clock is the one endpoint whose roles list is the complete set of seven, including Dealer, and
          priority 25 does not apply to it because it touches no dealer-owned record. Every call must be a 200
          and the last write wins, so the final logical now is the seventh value.
        test_recipe:
          setup:
            - "Empty database; the logical clock still at its documented startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T01:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T02:00:00Z" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T03:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T04:00:00Z" }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T05:00:00Z" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T07:00:00Z" }
              as: Dealer
              as_user_id: "dlr-1"
          assert:
            - "All seven responses are 200"
            - "The final current_utc == 2026-08-02T07:00:00Z"
            - "The Dealer call succeeds even though dlr-1 is not an enrolled Dealer row  # no scope check applies"
      - name: rbac_dealer_scoped_list_returns_only_its_own_orders
        claim_type: peer_roles
        grounds:
          - validations[priority=25]
          - roles.Dealer.notes
          - roles.SalesAdmin.notes
          - endpoints[GET /dealer-orders]
        distinguishing_aspect: |
          The same list endpoint answers differently for the two peer roles: SalesAdmin is unscoped and sees
          both dealers' orders, while the Dealer role is confined by priority 25 to its own dealer_id, which it
          must supply as the filter. Neither dealer can observe the other's PO reference through this channel.
        test_recipe:
          setup:
