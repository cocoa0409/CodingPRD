          - validations.priority_45.ERR_CITATION_NOT_CONTESTED
        distinguishing_aspect: "Both refusals are about the citation's own status rather than about the payload: a hearing cannot be scheduled while the citation is merely ISSUED (409 ERR_CITATION_NOT_CONTESTED), and once the exact balance is paid the same payment endpoint that just succeeded now refuses with 409 ERR_CITATION_ALREADY_SETTLED rather than ERR_PAYMENT_EXCEEDS_OUTSTANDING."
