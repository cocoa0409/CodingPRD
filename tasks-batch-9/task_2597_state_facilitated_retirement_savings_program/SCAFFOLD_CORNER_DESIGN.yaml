          - errors.ERR_EMPLOYER_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Priority 3 must run before priority 5: a request that both addresses a non-existent employer AND omits the required hire_date returns ERR_EMPLOYER_NOT_FOUND (404), never ERR_INVALID_REQUEST (422). Body-shape validation cannot be hoisted above path resolution as a cheap early exit, because doing so leaks the shape of a resource the caller may not address."
