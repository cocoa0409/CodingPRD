        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-create-stale-grant]
        distinguishing_aspect: "After a first amendment create advances DistrictGrant.version, a second create replaying the previously observed version is rejected 412 ERR_STALE_GRANT_VERSION; with the fresh version it succeeds."
        test_recipe:
          setup: ["ALLOCATED grant with two schools (S1 5400000, S2 3600000)"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "OCC A", nces_id: "100632", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: "$.data.id" } }
            - { call: "POST /title-i/schools", payload: { name: "OCC B", nces_id: "100633", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2103, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 60, total_student_count: 100 }, { school_id: "${s2}", low_income_student_count: 40, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
