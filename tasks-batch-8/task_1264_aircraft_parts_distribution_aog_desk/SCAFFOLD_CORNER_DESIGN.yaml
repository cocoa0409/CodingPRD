        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-accept-stale-version]", "errors[ERR_STALE_QUOTE_VERSION]"]
        distinguishing_aspect: "OCC on accept: the customer observed the quote at version 2, but a reject/revise/issue cycle advanced it to 5; the accept with the stale view is 412 while a fresh read's version succeeds — the customer can never accept terms they never saw."
