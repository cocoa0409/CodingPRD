  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_cancel_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-cancel-stale-order]", "errors[ERR_STALE_VERSION]", state_machines.AggregatorOrder.ROUTED_to_CANCELLED]
        distinguishing_aspect: "After routing (version advances to 2), a cancel carrying expected_order_version one below current returns ERR_STALE_VERSION (412); the correct version succeeds."
        test_recipe:
          setup: ["Brand BCC ACTIVE+LISTED Wings chicken100g; Stall SCC FRYER chicken1000g; clock set; order routed (version observed at ingestion is stale)."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SCC", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { scc_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "BCC", owner_email: "bcc@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bcc_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${scc_id}", brand_id: "${bcc_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { lcc_id: $.data.id }
            - call: "POST /leases/${lcc_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${scc_id}"
            - call: "POST /brands/${bcc_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${bcc_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${bcc_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${bcc_id}"
              captures: { wcc_id: $.data.id }
            - call: "POST /menu-items/${wcc_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 100 }
              as: BrandOwner
              as_user_id: "${bcc_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${scc_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${scc_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${scc_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 1000 }
              as: StallOperator
              as_user_id: "${scc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${bcc_id}", aggregator: "DOORDASH", external_ref: "DD-CC", line_items: [ { menu_item_id: "${wcc_id}", qty: 1 } ] }
              as: AggregatorGateway
              captures: { occ_id: $.data.id, occ_ver_ingest: $.data.version }
            - call: "POST /orders/${occ_id}/route"
              payload: {}
              as: PlatformOps
              captures: { occ_ver_routed: $.data.version }
          trigger:
            - call: "POST /orders/${occ_id}/cancel"
              payload: { expected_order_version: "${occ_ver_ingest}" }
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "AggregatorOrder.${occ_id}.status == ROUTED"

      - name: version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: [entities.AggregatorOrder.fields.status, state_machines.AggregatorOrder.INGESTED_to_ROUTED]
        distinguishing_aspect: "AggregatorOrder.version is 1 at ingestion and 2 after a successful route — version increments by one per mutation."
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_restores_inventory_grams_conserved
          rationale: "The conservation instance captures o17_ver from the routed order (version after route), implicitly relying on the per-write increment."

      - name: cascade_route_three_levels_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.AggregatorOrder.INGESTED_to_ROUTED, calculations.fifo_inventory_consumption, state_machines.MenuItem.AVAILABLE_to_SOLD_OUT]
        distinguishing_aspect: "Route triggers the full 3-level chain route->deduct->SOLD_OUT verified end to end."
        excluded_because:
          difficulty_instance: transitive_cascade / route_consume_soldout_depth3
          rationale: "The depth-3 routing cascade is the named §1.8 instance."

      - name: derived_equipment_count_reconciled_create_then_retire
        claim_type: derived_field_reconciliation
        grounds: [entities.Stall.fields.equipment_count, state_machines.Equipment.AVAILABLE_to_RETIRED]
        distinguishing_aspect: "Adding two units sets Stall.equipment_count==2, then retiring one reconciles it down to 1 (counts only non-RETIRED units)."
        test_recipe:
          setup: ["Stall SDC with two AVAILABLE FRYER units (equipment_count==2)."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SDC", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sdc_id: $.data.id }
            - call: "POST /equipment"
              payload: { stall_id: "${sdc_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sdc_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /equipment"
              payload: { stall_id: "${sdc_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sdc_id}"
          trigger:
            - call: "POST /equipment/${e1_id}/retire"
              payload: {}
              as: StallOperator
              as_user_id: "${sdc_id}"
          assert:
            - "Equipment.${e1_id}.status == RETIRED"
            - "Stall.${sdc_id}.equipment_count == 1"

