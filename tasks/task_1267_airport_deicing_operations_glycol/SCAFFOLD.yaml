scenario: |
  generate task hard than expert level! 1267. Airport Deicing Operations & Glycol Compliance (airport deicing pad operator): deicing pad assignment & queue sequencing, fluid inventory, type & holdover time calculation, glycol collection percentage & discharge permit monitoring, aircraft acceptance & post-treatment inspection, weather event staffing & fluid supply escalation, cost recovery/billing to airlines, spill reporting, glycol recycling contract

domain_name: airport-deicing-ops
api_prefix: /deice-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat            # peer entities with FK references; filtered-list GETs, no URL nesting (except two read-only sub-resource lists)
  state_machine_shape: cyclic      # request defer/requeue loop, weather re-intensification loop, permit suspend/reinstate loop, pad occupy/release loop
  relationship_patterns:
    - one_to_many
    - self_referential             # DeiceOperation.parent_operation_id (rework lineage)
    - cross_aggregate              # DeiceOperation spans Request/Pad/Tank; Invoice spans Airline/Operation
  role_model: segregation_of_duties  # acceptance inspector != post-treatment inspector; spill reporter != spill closer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DeiceStation
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Station code, unique across all stations" }
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: min_collection_pct, type: number, source: input, default: 50.0, description: "Minimum glycol collection percentage per operation; at-or-above passes" }
      - { name: fluid_ops_minimum_liters, type: integer, source: input, default: 2000, description: "Station posture flips to FLUID_CONSTRAINED when total available fluid falls strictly below this" }
      - { name: storm_surcharge_pct, type: number, source: input, default: 25, description: "Invoice surcharge percent applied when an ACTIVE weather event of severity LEVEL_2 or LEVEL_3 exists at operation completion" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | FLUID_CONSTRAINED | PERMIT_SUSPENDED — derived per calculation station_posture" }
      - { name: active_supply_alert, type: boolean, source: computed, default: false, description: "True when any FluidTank of this station has status REORDER_PENDING or EMPTY" }
      - { name: collected_pool_liters, type: number, source: computed, default: 0, description: "Sum of collected_liters over DeiceOperations of this station in status CLEARED or REWORK_REQUIRED minus sum of recorded recycling shipment volumes" }
      - { name: ops_epoch_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops_checkpoint" }

  - name: DeicePad
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; owning station" }
      - { name: code, type: string, source: input, description: "Pad code, unique within station" }
      - { name: max_size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — largest aircraft size class the pad can serve (SMALL<MEDIUM<LARGE)" }
      - { name: rated_collection_pct, type: number, source: input, description: "Design collection efficiency of the pad collection system, informational" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | OUT_OF_SERVICE" }

  - name: WeatherEvent
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; station the event affects" }
      - { name: precip_type, type: enum, source: input, description: "SNOW | FREEZING_FOG | FREEZING_RAIN | MIXED" }
      - { name: precip_rate, type: enum, source: input, description: "LIGHT | MODERATE | HEAVY" }
      - { name: severity, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: started_at, type: datetime, source: input, description: "Event start (ISO8601 UTC)" }
      - { name: ended_at, type: datetime, source: system, description: "Set when event ends; cleared on re-intensification" }
      - { name: required_crew_count, type: integer, source: computed, description: "LEVEL_1→4, LEVEL_2→8, LEVEL_3→14" }
      - { name: assigned_crew_count, type: integer, source: input, default: 0, description: "Crew currently assigned; updated by escalate" }
      - { name: staffing_status, type: enum, source: computed, description: "ADEQUATE if assigned_crew_count >= required_crew_count else SHORT" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "Incremented by each escalate action" }
      - { name: status, type: enum, source: system, description: "FORECASTED | ACTIVE | ENDED | CANCELLED" }

  - name: FluidTank
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; owning station" }
      - { name: fluid_type, type: enum, source: input, description: "TYPE_I | TYPE_IV" }
      - { name: concentration_pct, type: integer, source: input, description: "Fluid concentration: 100, 75, or 50" }
      - { name: capacity_liters, type: integer, source: input, description: "Tank capacity" }
      - { name: on_hand_liters, type: number, source: input, description: "Physical liters in tank at creation; thereafter system-adjusted only (spray deduct, spill deduct, void restore, replenish add)" }
      - { name: reserved_liters, type: number, source: computed, default: 0, description: "Sum of estimated_liters of DeiceRequests with assigned_tank_id=this tank in status QUEUED/ASSIGNED/IN_PROGRESS/DEFERRED plus estimated_liters of rework DeiceOperations (parent_operation_id non-null) with tank_id=this tank in status PLANNED/SPRAYING/AWAITING_INSPECTION" }
      - { name: available_liters, type: number, source: computed, description: "= on_hand_liters - reserved_liters" }
      - { name: reorder_threshold_liters, type: integer, source: input, description: "Tank status becomes REORDER_PENDING when available_liters falls strictly below this" }
      - { name: status, type: enum, source: computed, description: "EMPTY (on_hand_liters == 0) | REORDER_PENDING (available_liters < reorder_threshold_liters) | OK" }

  - name: Airline
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Airline code, unique" }
      - { name: name, type: string, source: input, description: "Airline name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding exposure including estimated charge of a new request" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents of this airline's Invoices in status ISSUED" }
      - { name: monthly_billed_liters, type: integer, source: computed, default: 0, description: "Sum of actual_liters of operations whose invoices were ISSUED in the current calendar month (month_key); lazily resets on first billing touch of a new month" }
      - { name: month_key, type: string, source: system, description: "YYYY-MM of monthly_billed_liters basis" }

  - name: DeiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id; must equal caller's X-User-ID when role is AirlineRep" }
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; station where treatment is requested" }
      - { name: flight_number, type: string, source: input, description: "Flight identifier" }
      - { name: aircraft_type, type: string, source: input, description: "Aircraft type code, e.g. B737" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE" }
      - { name: scheduled_departure, type: datetime, source: input, description: "Scheduled departure (ISO8601 UTC); queue ranking input" }
      - { name: fluid_type, type: enum, source: input, description: "TYPE_I | TYPE_IV requested" }
      - { name: priority, type: enum, source: input, default: SCHEDULED, description: "EMERGENCY | SCHEDULED | FLEXIBLE" }
      - { name: estimated_liters, type: integer, source: computed, description: "SMALL→200, MEDIUM→500, LARGE→1200" }
      - { name: assigned_tank_id, type: string, source: system, description: "FK -> FluidTank.id; chosen by tank_selector at creation or reservation retry; null when UNRESERVED" }
      - { name: fluid_reservation_status, type: enum, source: system, description: "RESERVED | UNRESERVED" }
      - { name: assigned_pad_id, type: string, source: system, description: "FK -> DeicePad.id; set on assign, null before" }
      - { name: epochs_in_queue, type: integer, source: system, default: 0, description: "Ops epochs survived in QUEUED or DEFERRED; >= 2 at a checkpoint → EXPIRED" }
      - { name: defer_count, type: integer, source: system, default: 0, description: "Number of defer actions taken" }
      - { name: status, type: enum, source: system, description: "QUEUED | ASSIGNED | IN_PROGRESS | DEFERRED | COMPLETED | ABORTED | EXPIRED" }

  - name: DeiceOperation
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> DeiceRequest.id; originating request" }
      - { name: station_id, type: string, source: system, description: "FK -> DeiceStation.id; copied from request" }
      - { name: pad_id, type: string, source: system, description: "FK -> DeicePad.id; assigned pad" }
      - { name: tank_id, type: string, source: system, description: "FK -> FluidTank.id; copied from request.assigned_tank_id at assign" }
      - { name: parent_operation_id, type: string, source: system, description: "FK -> DeiceOperation.id; set on auto-created rework operations, null otherwise" }
      - { name: window_start, type: datetime, source: input, description: "Planned pad occupancy start (ISO8601 UTC), half-open interval start" }
      - { name: window_end, type: datetime, source: input, description: "Planned pad occupancy end (ISO8601 UTC), exclusive; must be > window_start" }
      - { name: oat_celsius, type: number, source: input, description: "Outside air temperature at spray start; holdover input" }
      - { name: estimated_liters, type: integer, source: system, description: "Copied from request, or ceil(parent.actual_liters * 0.5) for rework operations" }
      - { name: actual_liters, type: number, source: input, description: "Fluid actually sprayed; set at complete" }
      - { name: collected_liters, type: number, source: input, description: "Glycol runoff collected; set at complete" }
      - { name: collection_pct, type: number, source: computed, description: "= round_half_up(collected_liters / actual_liters * 100, 2)" }
      - { name: collection_flag, type: enum, source: computed, description: "OK if collection_pct >= station.min_collection_pct else BELOW_MINIMUM" }
      - { name: holdover_minutes, type: integer, source: computed, description: "Per holdover_time calculation at spray start" }
      - { name: holdover_variant, type: enum, source: computed, description: "TABLE | RATE_ADJUSTED — variant applied at spray start" }
      - { name: status, type: enum, source: system, description: "PLANNED | SPRAYING | AWAITING_INSPECTION | CLEARED | REWORK_REQUIRED | CANCELLED | VOIDED" }

  - name: Inspection
    parent: null
    common_fields: false
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> DeiceOperation.id; operation under inspection" }
      - { name: kind, type: enum, source: input, description: "ACCEPTANCE | POST_TREATMENT" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: findings, type: string, source: input, description: "Free-text findings", default: "" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the recording Inspector; drives segregation-of-duties checks" }

  - name: DischargePermit
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; permitted station" }
      - { name: permit_number, type: string, source: input, description: "Regulatory permit number" }
      - { name: effective_from, type: datetime, source: input, description: "Permit effective start (ISO8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Permit effective end (ISO8601 UTC); > effective_from" }
      - { name: max_single_reading_mg_l, type: number, source: input, description: "Instantaneous concentration limit; breach only when a reading is strictly greater" }
      - { name: rolling_window_days, type: integer, source: input, description: "Discharge volume window length in days" }
      - { name: rolling_window_max_liters, type: integer, source: input, description: "Maximum total discharge volume within any trailing rolling_window_days window" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | SUPERSEDED | EXPIRED" }

  - name: EffluentReading
    parent: null
    common_fields: false
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> DischargePermit.id; taken from path" }
      - { name: measured_at, type: datetime, source: input, description: "Measurement timestamp (ISO8601 UTC); drives rolling-window membership" }
      - { name: concentration_mg_l, type: number, source: input, description: "Measured glycol concentration" }
      - { name: volume_liters, type: integer, source: input, description: "Discharged volume in this event" }
      - { name: violation, type: boolean, source: computed, description: "True when concentration_mg_l > permit.max_single_reading_mg_l (strictly)" }

  - name: SpillReport
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; station where spill occurred" }
      - { name: tank_id, type: string, source: input, description: "FK -> FluidTank.id; source tank losing the spilled fluid" }
      - { name: quantity_liters, type: number, source: input, description: "Spilled quantity" }
      - { name: occurred_at, type: datetime, source: input, description: "Spill occurrence time (ISO8601 UTC); confirm deadline = occurred_at + 120 minutes" }
      - { name: classification, type: enum, source: computed, description: "REPORTABLE if quantity_liters >= 100 else MINOR" }
      - { name: reporter_id, type: string, source: system, description: "X-User-ID of creating EnvironmentalOfficer" }
      - { name: confirmed_by, type: string, source: system, description: "X-User-ID of confirming officer" }
      - { name: closed_by, type: string, source: system, description: "X-User-ID of closing officer; must differ from reporter_id (SoD)" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | CLOSED" }

  - name: RecyclingContract
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DeiceStation.id; station supplying collected glycol" }
      - { name: vendor_name, type: string, source: input, description: "Recycling vendor" }
      - { name: min_concentration_pct, type: number, source: input, description: "Minimum concentration for an accepted shipment" }
      - { name: price_per_liter_cents, type: integer, source: input, description: "Price the vendor pays per liter" }
      - { name: contracted_min_liters, type: integer, source: input, description: "Contract minimum volume; reaching it auto-fulfills the contract" }
      - { name: delivered_liters, type: number, source: computed, default: 0, description: "Sum of recorded shipment volumes" }
      - { name: total_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of round_half_up(volume_liters * price_per_liter_cents) per shipment" }
      - { name: last_shipment_revenue_cents, type: integer, source: computed, description: "Revenue of the most recent recorded shipment" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FULFILLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: airline_id, type: string, source: system, description: "FK -> Airline.id; copied from the billed operation's request" }
      - { name: station_id, type: string, source: system, description: "FK -> DeiceStation.id; copied from operation" }
      - { name: operation_id, type: string, source: input, description: "FK -> DeiceOperation.id; billed operation (must be CLEARED)" }
      - { name: supersedes_invoice_id, type: string, source: system, description: "FK -> Invoice.id; prior DRAFT invoice for the same operation superseded by this creation, null otherwise" }
      - { name: pad_fee_cents, type: integer, source: computed, description: "Flat pad fee by pad max_size_class: SMALL 20000, MEDIUM 35000, LARGE 60000" }
      - { name: fluid_charge_cents, type: integer, source: computed, description: "Tiered marginal charge per invoice_charges calculation" }
      - { name: storm_surcharge_cents, type: integer, source: computed, description: "round_half_up((pad_fee_cents + fluid_charge_cents) * station.storm_surcharge_pct / 100) when an ACTIVE severity LEVEL_2/LEVEL_3 event exists at completion, else 0" }
      - { name: total_cents, type: integer, source: computed, description: "= pad_fee_cents + fluid_charge_cents + storm_surcharge_cents (sum of already-rounded lines)" }
      - { name: pricing_variant, type: enum, source: computed, description: "Always MARGINAL_TIER; the FLAT_TIER variant is documented but never applied" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | VOID | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DeiceRequest
    initial_state: QUEUED
    terminal_states: [COMPLETED, ABORTED, EXPIRED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /deice-ops/deice-requests/{id}/assign"
        actor: PadOperator
        preconditions:
          - "station posture != PERMIT_SUSPENDED (ERR_PERMIT_SUSPENDED) and != FLUID_CONSTRAINED (ERR_FLUID_CONSTRAINED)"
          - "pad exists at same station, pad.status == AVAILABLE (ERR_PAD_NOT_AVAILABLE)"
          - "pad.max_size_class >= request.size_class (ERR_PAD_INCOMPATIBLE)"
          - "request.fluid_reservation_status == RESERVED (ERR_FLUID_CONSTRAINED)"
          - "window_end > window_start (ERR_INVALID_REQUEST)"
          - "no half-open overlap with any non-terminal DeiceOperation window on this pad: NOT (new.window_start < existing.window_end AND existing.window_start < new.window_end) (ERR_PAD_WINDOW_OVERLAP)"
        side_effects:
          - "assigned_pad_id set (pad remains AVAILABLE until spray start; future bookings on the same pad are regulated by the half-open window-overlap check)"
          - "create DeiceOperation PLANNED with request_id, station_id, pad_id, tank_id=request.assigned_tank_id, estimated_liters=request.estimated_liters, window from payload"
          - "increments DeiceRequest.version by 1"
      - from: QUEUED
        to: DEFERRED
        trigger: "POST /deice-ops/deice-requests/{id}/defer"
        actor: PadOperator
        preconditions: []
        side_effects:
          - "defer_count += 1"
          - "increments DeiceRequest.version by 1"
      - from: DEFERRED
        to: QUEUED
        trigger: "POST /deice-ops/deice-requests/{id}/requeue"
        actor: PadOperator
        preconditions: []
        side_effects:
          - "increments DeiceRequest.version by 1"
        note: "defer/requeue forms an intentional A→B→A cycle"
      - from: QUEUED
        to: ABORTED
        trigger: "POST /deice-ops/deice-requests/{id}/abort"
        actor: PadOperator | AirlineRep
        preconditions:
          - "AirlineRep caller: request.airline_id must equal caller X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "release fluid reservation (request leaves reserved_liters input set); tank reserved_liters/available_liters/status recomputed; station posture and active_supply_alert recomputed"
          - "increments DeiceRequest.version by 1"
      - from: ASSIGNED
        to: ABORTED
        trigger: "POST /deice-ops/deice-requests/{id}/abort"
        actor: PadOperator | AirlineRep
        preconditions:
          - "AirlineRep caller: request.airline_id must equal caller X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "PLANNED DeiceOperation of this request → CANCELLED (pad was not yet OCCUPIED; nothing to release)"
          - "release fluid reservation; tank and station derived fields recomputed"
          - "increments DeiceRequest.version by 1"
      - from: DEFERRED
        to: ABORTED
        trigger: "POST /deice-ops/deice-requests/{id}/abort"
        actor: PadOperator | AirlineRep
        preconditions:
          - "AirlineRep caller: request.airline_id must equal caller X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "release fluid reservation; tank and station derived fields recomputed"
          - "increments DeiceRequest.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /deice-ops/deice-operations/{id}/start (on this request's operation)"
        actor: PadOperator
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (when this request's DeiceOperation reaches CLEARED via POST_TREATMENT PASS inspection; for rework lineages, when the rework child operation is CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "release fluid reservation; tank reserved_liters/available_liters/status recomputed; station posture recomputed"
      - from: QUEUED
        to: EXPIRED
        trigger: "system (run_ops_checkpoint when epochs_in_queue >= 2 after increment)"
        actor: system
        preconditions: []
        side_effects:
          - "release fluid reservation; tank and station derived fields recomputed"
      - from: DEFERRED
        to: EXPIRED
        trigger: "system (run_ops_checkpoint when epochs_in_queue >= 2 after increment)"
        actor: system
        preconditions: []
        side_effects:
          - "release fluid reservation; tank and station derived fields recomputed"

  - entity: DeiceOperation
    initial_state: PLANNED
    terminal_states: [REWORK_REQUIRED, CANCELLED, VOIDED]
    transitions:
      - from: PLANNED
        to: SPRAYING
        trigger: "POST /deice-ops/deice-operations/{id}/start"
        actor: PadOperator
        preconditions:
          - "an Inspection with operation_id == this operation, kind == ACCEPTANCE, result == PASS exists (ERR_ACCEPTANCE_REQUIRED)"
          - "request.status == ASSIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "holdover_minutes and holdover_variant computed per holdover_time calculation using oat_celsius from payload and the station's ACTIVE weather event (if any)"
          - "request.status → IN_PROGRESS"
          - "pad.status → OCCUPIED (physical occupancy begins at spray start)"
          - "increments DeiceOperation.version by 1"
      - from: SPRAYING
        to: AWAITING_INSPECTION
        trigger: "POST /deice-ops/deice-operations/{id}/complete"
        actor: PadOperator
        preconditions:
          - "actual_liters > 0 and collected_liters >= 0 and collected_liters <= actual_liters (ERR_INVALID_REQUEST)"
          - "actual_liters <= tank.on_hand_liters (ERR_INSUFFICIENT_FLUID)"
        side_effects:
          - "tank.on_hand_liters -= actual_liters"
          - "request reservation released at spray accounting: request leaves reserved_liters input set only on COMPLETED/CANCELLED/EXPIRED, so no reserved change here"
          - "collection_pct and collection_flag computed"
          - "tank status recomputed; if tank crosses below reorder_threshold_liters → tank.status REORDER_PENDING → station.active_supply_alert recomputed"
          - "increments DeiceOperation.version by 1"
      - from: AWAITING_INSPECTION
        to: CLEARED
        trigger: "system (POST /deice-ops/inspections with kind=POST_TREATMENT, result=PASS)"
        actor: Inspector
        preconditions: []
        side_effects:
          - "if parent_operation_id is null: request.status → COMPLETED, reservation released"
          - "if parent_operation_id is non-null (rework child): the lineage request.status → COMPLETED, its reservation released; this operation leaves the rework reserved input set"
          - "pad.status → AVAILABLE"
          - "station.collected_pool_liters += collected_liters (via pool recomputation)"
          - "tank and station derived fields recomputed"
      - from: AWAITING_INSPECTION
        to: REWORK_REQUIRED
        trigger: "system (POST /deice-ops/inspections with kind=POST_TREATMENT, result=FAIL)"
        actor: Inspector
        preconditions: []
        side_effects:
          - "cascade link 1: this operation → REWORK_REQUIRED (terminal for this operation)"
          - "cascade link 2 (caused by link 1): auto-create rework DeiceOperation with parent_operation_id = this operation, status PLANNED, same request_id/station_id/pad_id/tank_id, window copied from this operation, estimated_liters = ceil(this.actual_liters * 0.5)"
          - "cascade link 3 (caused by link 2): tank.reserved_liters += rework estimated_liters; tank available_liters/status recomputed"
          - "cascade link 4 (caused by link 3): station posture recomputed; if total available_liters across station tanks < station.fluid_ops_minimum_liters → posture FLUID_CONSTRAINED, blocking subsequent assign calls"
      - from: CLEARED
        to: VOIDED
        trigger: "POST /deice-ops/deice-operations/{id}/void"
        actor: PadOperator
        preconditions:
          - "no Invoice for this operation in status DRAFT or ISSUED (ERR_OPERATION_INVOICED)"
        side_effects:
          - "compensation: tank.on_hand_liters += actual_liters (restores pre-complete volume exactly)"
          - "station.collected_pool_liters -= collected_liters (pool restored)"
          - "tank status and station posture/alert recomputed (pad already AVAILABLE since CLEARED)"
          - "increments DeiceOperation.version by 1"
        note: "request.status remains COMPLETED; void is a data correction, not an operational undo"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (request aborted while ASSIGNED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeicePad
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (operation on this pad transitions PLANNED → SPRAYING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system (operation on this pad reaches CLEARED or VOIDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /deice-ops/pads/{id}/take_out_of_service"
        actor: StationAdmin
        preconditions: []
        side_effects:
          - "increments DeicePad.version by 1"

  - entity: WeatherEvent
    initial_state: FORECASTED
    terminal_states: [CANCELLED]
    transitions:
      - from: FORECASTED
        to: ACTIVE
        trigger: "POST /deice-ops/weather-events/{id}/activate"
        actor: StationAdmin
        preconditions: []
        side_effects:
          - "increments WeatherEvent.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /deice-ops/weather-events/{id}/end"
        actor: StationAdmin
        preconditions: []
        side_effects:
          - "ended_at set to current logical clock"
          - "increments WeatherEvent.version by 1"
      - from: ENDED
        to: ACTIVE
        trigger: "POST /deice-ops/weather-events/{id}/activate"
        actor: StationAdmin
        preconditions: []
        side_effects:
          - "ended_at cleared to null (re-intensification)"
          - "increments WeatherEvent.version by 1"
        note: "re-intensification forms an intentional ACTIVE→ENDED→ACTIVE cycle"
      - from: FORECASTED
        to: CANCELLED
        trigger: "POST /deice-ops/weather-events/{id}/end"
        actor: StationAdmin
        preconditions: []
        side_effects:
          - "ended_at set to current logical clock"
          - "increments WeatherEvent.version by 1"

  - entity: DischargePermit
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /deice-ops/discharge-permits/{id}/suspend OR system (an EffluentReading with concentration_mg_l > 2 * max_single_reading_mg_l)"
        actor: EnvironmentalOfficer | system
        preconditions: []
        side_effects:
          - "station posture recomputed → PERMIT_SUSPENDED while this station has no ACTIVE permit with status ACTIVE"
          - "increments DischargePermit.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /deice-ops/discharge-permits/{id}/reinstate"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "station posture recomputed"
          - "increments DischargePermit.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new DischargePermit is created for the same station)"
        actor: system
        preconditions: []
        side_effects:
          - "increments DischargePermit.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_ops_checkpoint when current logical clock > effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "station posture recomputed → PERMIT_SUSPENDED (no ACTIVE permit remains)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (run_ops_checkpoint when current logical clock > effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "station posture recomputed"

  - entity: SpillReport
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /deice-ops/spill-reports/{id}/confirm"
        actor: EnvironmentalOfficer
        preconditions:
          - "current logical clock <= occurred_at + 120 minutes (ERR_SPILL_DEADLINE_PASSED)"
        side_effects:
          - "confirmed_by set from X-User-ID"
          - "cascade link 1: tank.on_hand_liters -= quantity_liters (floor at 0)"
          - "cascade link 2 (caused by link 1): tank.status recomputed; crossing below reorder_threshold_liters → REORDER_PENDING"
          - "cascade link 3 (caused by link 2): station.active_supply_alert recomputed (true when any tank REORDER_PENDING or EMPTY)"
          - "increments SpillReport.version by 1"
      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /deice-ops/spill-reports/{id}/close"
        actor: EnvironmentalOfficer
        preconditions:
          - "caller X-User-ID != reporter_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "closed_by set from X-User-ID"
          - "increments SpillReport.version by 1"

  - entity: RecyclingContract
    initial_state: ACTIVE
    terminal_states: [FULFILLED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (delivered_liters >= contracted_min_liters after a recorded shipment)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RecyclingContract.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOID, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /deice-ops/invoices/{id}/issue"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "airline.outstanding_balance_cents += total_cents"
          - "airline.monthly_billed_liters += billed operation.actual_liters (after lazy month reset)"
          - "increments Invoice.version by 1 and Airline.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /deice-ops/invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "compensation: airline.outstanding_balance_cents -= total_cents (restores pre-issue balance exactly)"
          - "airline.monthly_billed_liters -= billed operation.actual_liters"
          - "increments Invoice.version by 1 and Airline.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new Invoice is created for the same operation)"
        actor: system
        preconditions: []
        side_effects:
          - "supersedes_invoice_id on the new invoice references this one"
          - "increments Invoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-airline
    parent_entity: Airline
    write_endpoint: "POST /deice-ops/invoices"
    occ_field: expected_airline_version
    description: |
      Creating an Invoice against an Airline whose version has advanced since
      the client last observed it is rejected. Creating an invoice legitimately
      supersedes any existing DRAFT invoice for the same operation and bumps
      the airline version, so a writer holding a stale airline version view is
      refused instead of silently superseding on stale data.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: permit-create-stale-station
    parent_entity: DeiceStation
    write_endpoint: "POST /deice-ops/discharge-permits"
    occ_field: expected_station_version
    description: |
      Creating a DischargePermit against a DeiceStation whose version has
      advanced since the client last observed it is rejected. Permit creation
      legitimately supersedes the station's prior ACTIVE permit, so a stale
      station view must not drive a supersede.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: holdover_time
    trigger: "DeiceOperation start (PLANNED → SPRAYING)"
    algorithm: threshold
    formula: |
      Inputs: tank.fluid_type, tank.concentration_pct, active_event.precip_type (or NONE when no ACTIVE event),
              active_event.precip_rate, operation.oat_celsius.
      base = HOLDOVER_TABLE[fluid_type][concentration_key][precip_key]
        where concentration_key: TYPE_I → "ANY"; TYPE_IV → concentration_pct must be one of 100/75/50
        and precip_key: NONE | SNOW | FREEZING_FOG | FREEZING_RAIN | MIXED.
      temp_factor = 0.8 if oat_celsius <= -10 else 1.0
      Variant selection (pinned): variant = RATE_ADJUSTED when an ACTIVE weather event exists at the station
        with precip_rate in {MODERATE, HEAVY}; otherwise variant = TABLE.
      TABLE: result = base * temp_factor
      RATE_ADJUSTED: result = base * temp_factor * RATE_FACTOR[precip_rate]
      result = max(HOLDOVER_MIN_FLOOR, round_half_up(result, 0)) — integer minutes.
    input_set: "The single ACTIVE WeatherEvent at the operation's station (at most one may be ACTIVE; if more than one exists, the one with the latest started_at wins, tie-break created_at ASC); operation's tank for fluid_type/concentration"
    constants:
      HOLDOVER_MIN_FLOOR: 5
      TEMP_FACTOR_COLD: 0.8
      TEMP_CUTOFF_CELSIUS: -10
      RATE_FACTOR: { LIGHT: 1.0, MODERATE: 0.75, HEAVY: 0.5 }
      HOLDOVER_TABLE: |
        TYPE_I/ANY:    NONE 45, SNOW 25, FREEZING_FOG 15, FREEZING_RAIN 9,  MIXED 12
        TYPE_IV/100:   NONE 120, SNOW 60, FREEZING_FOG 40, FREEZING_RAIN 25, MIXED 30
        TYPE_IV/75:    NONE 80, SNOW 35, FREEZING_FOG 25, FREEZING_RAIN 15, MIXED 18
        TYPE_IV/50:    NONE 45, SNOW 20, FREEZING_FOG 12, FREEZING_RAIN 7,  MIXED 9
    precision: "integer minutes, round_half_up after all multipliers"
    variants:
      - name: TABLE
        when: "no ACTIVE weather event, or ACTIVE event with precip_rate == LIGHT"
        difference: "base * temp_factor only"
      - name: RATE_ADJUSTED
        when: "ACTIVE weather event with precip_rate MODERATE or HEAVY"
        difference: "additionally multiplied by RATE_FACTOR[precip_rate]; same inputs therefore yield fewer minutes (e.g. TYPE_IV/100 SNOW at oat -5: TABLE 60 vs RATE_ADJUSTED HEAVY 30)"

  - name: invoice_charges
    trigger: "Invoice creation (POST /deice-ops/invoices)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order (pinned, removes any circularity):
        1. month_liters_base = airline.monthly_billed_liters AFTER lazy month reset for the
           calendar month of the logical clock, EXCLUDING this invoice and this operation.
        2. pad_fee_cents = PAD_FEE[pad.max_size_class].
        3. fluid_charge_cents: distribute operation.actual_liters across monthly tiers starting at
           month_liters_base. Tier k covers monthly-liter positions [TIER_START_k, TIER_END_k).
           The liter with cumulative index i (0-based, i = month_liters_base + j for the j-th
           operation liter) is billed at RATE[fluid_type] * TIER_MULT_k where k is the tier
           containing i. Per segment: segment_cents = segment_liters * rate * mult, each segment
           rounded half-up to integer cents; fluid_charge_cents = sum of rounded segments.
        4. storm_surcharge_cents = round_half_up((pad_fee_cents + fluid_charge_cents)
           * station.storm_surcharge_pct / 100) when an ACTIVE WeatherEvent with severity in
           {LEVEL_2, LEVEL_3} exists at the station at operation completion time (the operation is
           already CLEARED, so this evaluates at invoice creation against the completion-time
           snapshot: surcharge applies iff an event with severity LEVEL_2/LEVEL_3 was ACTIVE at the
           moment the operation transitioned to AWAITING_INSPECTION); else 0.
        5. total_cents = pad_fee_cents + fluid_charge_cents + storm_surcharge_cents
           (sum of already-rounded lines — rounding order pinned: round per line, then sum;
           summing raw amounts then rounding once is a different, non-conformant result).
    input_set: "Billed DeiceOperation (must be CLEARED), its pad, its tank's fluid_type, its airline, its station"
    constants:
      PAD_FEE: { SMALL: 20000, MEDIUM: 35000, LARGE: 60000 }
      RATE: { TYPE_I: 90, TYPE_IV: 140 }
      TIER_1_END: 5000
      TIER_2_END: 20000
      TIER_MULT: { TIER_1: 1.0, TIER_2: 0.92, TIER_3: 0.85 }
    precision: "integer cents; per-tier-segment round_half_up, per-line round_half_up, then sum"
    variants:
      - name: MARGINAL_TIER
        when: "always applied — this is the conformant base algorithm"
        difference: "each operation liter priced at the multiplier of the tier its cumulative monthly index lands in"
      - name: FLAT_TIER
        when: "documented alternative interpretation; NEVER applied"
        difference: "all operation liters priced at the multiplier of the highest tier touched; same data yields a different total (e.g. base 4900 L + 300 L TYPE_I: MARGINAL 25560 c vs FLAT 24840 c fluid charge)"

  - name: collection_percentage
    trigger: "DeiceOperation complete"
    algorithm: threshold
    formula: |
      collection_pct = round_half_up(collected_liters / actual_liters * 100, 2)
      collection_flag = OK if collection_pct >= station.min_collection_pct else BELOW_MINIMUM
      Boundary: exactly equal to min_collection_pct passes (>=).
    input_set: "the completing operation and its station"
    precision: "2 decimal places, round_half_up"

  - name: tank_selector
    trigger: "DeiceRequest creation; automatic reservation retry on FluidTank replenish"
    algorithm: aggregation
    formula: |
      Eligibility: tanks with station_id == request.station_id, fluid_type == request.fluid_type,
        status != EMPTY, available_liters >= request.estimated_liters.
      Ranking: available_liters DESC; tie-break created_at ASC (never id).
      Empty pool: request created/left with assigned_tank_id = null and fluid_reservation_status =
        UNRESERVED (deferred behavior, no error).
      On replenish, retry all UNRESERVED requests of that station whose fluid_type matches the
        replenished tank, in queue order (priority EMERGENCY > SCHEDULED > FLEXIBLE, then
        scheduled_departure ASC, then created_at ASC); reserve each while eligibility holds.
    input_set: "FluidTanks of the station; UNRESERVED DeiceRequests of the station"

  - name: reserved_liters_calc
    trigger: "any change to DeiceRequest status/assignment or rework DeiceOperation status"
    algorithm: aggregation
    formula: |
      reserved_liters(tank) =
        sum(estimated_liters of DeiceRequests with assigned_tank_id == tank.id
            AND status IN {QUEUED, ASSIGNED, IN_PROGRESS, DEFERRED})
        + sum(estimated_liters of DeiceOperations with tank_id == tank.id,
            parent_operation_id non-null, AND status IN {PLANNED, SPRAYING, AWAITING_INSPECTION})
      available_liters(tank) = on_hand_liters - reserved_liters
    input_set: "requests and rework operations in the exact status sets listed; terminal statuses excluded"

  - name: tank_status
    trigger: "any change to on_hand_liters or reserved_liters"
    algorithm: threshold
    formula: |
      if on_hand_liters == 0: EMPTY
      else if available_liters < reorder_threshold_liters: REORDER_PENDING   (strictly below; at threshold stays OK)
      else: OK
    input_set: "single tank"

  - name: station_posture
    trigger: "any change to station permits, tank availability, or fluid_ops_minimum_liters"
    algorithm: threshold
    formula: |
      if the station has at least one DischargePermit AND none of them is in status ACTIVE: PERMIT_SUSPENDED
      else if sum(available_liters over all FluidTanks of this station) < fluid_ops_minimum_liters: FLUID_CONSTRAINED
      else: NORMAL
      Note: a freshly created station has no permit rows at all, so it is NORMAL (matches the
      create side effect posture=NORMAL); request creation never checks posture — only assign does.
    input_set: "station's permits (status ACTIVE only) and tanks"

  - name: staffing_requirement
    trigger: "WeatherEvent creation and escalate"
    algorithm: threshold
    formula: |
      required_crew_count = REQUIRED_CREW[severity]   # LEVEL_1 4, LEVEL_2 8, LEVEL_3 14
      staffing_status = ADEQUATE if assigned_crew_count >= required_crew_count else SHORT
    input_set: "single weather event"
    constants:
      REQUIRED_CREW: { LEVEL_1: 4, LEVEL_2: 8, LEVEL_3: 14 }

  - name: rolling_discharge_window
    trigger: "EffluentReading creation"
    algorithm: interval_merge
    formula: |
      window = [new.measured_at - rolling_window_days days, new.measured_at]  (closed both ends)
      window_sum = sum(volume_liters of EffluentReadings on the same permit with measured_at in window)
      if window_sum + new.volume_liters > rolling_window_max_liters: reject ERR_PERMIT_VOLUME_EXCEEDED
      Aggregate-capacity semantics: pairwise overlap is irrelevant; only the window sum matters.
      Readings on SUPERSEDED or EXPIRED permits are rejected with ERR_INVALID_STATE.
    input_set: "readings of the same permit within the closed trailing window"

  - name: spill_classification
    trigger: "SpillReport creation"
    algorithm: threshold
    formula: |
      classification = REPORTABLE if quantity_liters >= REPORTABLE_SPILL_L else MINOR
      Boundary: exactly 100.0 L is REPORTABLE (>=).
    input_set: "single spill report"
    constants:
      REPORTABLE_SPILL_L: 100

  - name: collected_pool
    trigger: "operation CLEARED, operation VOIDED, or recycling shipment recorded"
    algorithm: aggregation
    formula: |
      collected_pool_liters(station) =
        sum(collected_liters of DeiceOperations at this station in status CLEARED or REWORK_REQUIRED)
        - sum(volume of shipments recorded against RecyclingContracts of this station)
    input_set: "non-voided cleared/reworked operations; all recorded shipments"

  - name: ops_checkpoint
    trigger: "POST /deice-ops/stations/{id}/run_ops_checkpoint"
    algorithm: chronological
    formula: |
      1. ops_epoch_index += 1.
      2. For each DeiceRequest of the station in status QUEUED or DEFERRED, processed in queue order
         (priority EMERGENCY > SCHEDULED > FLEXIBLE, then scheduled_departure ASC, then created_at ASC):
         epochs_in_queue += 1; if epochs_in_queue >= EXPIRE_EPOCHS: status → EXPIRED, release reservation.
      3. For each DischargePermit of the station in status ACTIVE or SUSPENDED with
         effective_to < current logical clock: status → EXPIRED.
      4. Recompute all tank statuses, station posture, active_supply_alert.
    input_set: "station's queued/deferred requests and non-terminal permits"
    constants:
      EXPIRE_EPOCHS: 2

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted on the endpoint; ownership rules (AirlineRep may only touch own airline's resources; Inspector/PadOperator/EnvironmentalOfficer/BillingClerk act as opaque operator ids)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist (validated left-to-right: station/parent scope first)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition (includes OCC expected_*_version match → ERR_STALE_VERSION 412, terminal-state lockdown, wrong-from-state, duplicate-unique-child such as a second ACCEPTANCE inspection)"
    error_id: "ERR_INVALID_STATE | ERR_STALE_VERSION | ERR_INSPECTION_EXISTS"
    http_status: 409
    applies_to: "all state-transition and OCC-guarded endpoints"

  - priority: 5
    category: business_safety
    check: "Regulatory/safety gates: station posture PERMIT_SUSPENDED blocks assign (ERR_PERMIT_SUSPENDED); spray start requires acceptance PASS (ERR_ACCEPTANCE_REQUIRED); segregation of duties (ERR_SOD_VIOLATION)"
    error_id: "ERR_PERMIT_SUSPENDED | ERR_ACCEPTANCE_REQUIRED | ERR_SOD_VIOLATION"
    http_status: 409
    applies_to: "assign, operation start, inspection creation, spill close"

  - priority: 6
    category: business_constraint
    check: "Constraint satisfaction: pad size compatibility (ERR_PAD_INCOMPATIBLE), pad availability (ERR_PAD_NOT_AVAILABLE), pad window half-open overlap (ERR_PAD_WINDOW_OVERLAP), operation-invoiced void block (ERR_OPERATION_INVOICED), recycling quality (ERR_RECYCLE_QUALITY), collected pool sufficiency (ERR_INSUFFICIENT_COLLECTED_GLYCOL), FLUID_CONSTRAINED posture and UNRESERVED reservation on assign (ERR_FLUID_CONSTRAINED)"
    error_id: "ERR_PAD_INCOMPATIBLE | ERR_PAD_NOT_AVAILABLE | ERR_PAD_WINDOW_OVERLAP | ERR_OPERATION_INVOICED | ERR_RECYCLE_QUALITY | ERR_INSUFFICIENT_COLLECTED_GLYCOL | ERR_FLUID_CONSTRAINED"
    http_status: 409
    applies_to: "assign, void, shipment recording"

  - priority: 7
    category: business_temporal
    check: "Temporal rules: spill confirm within occurred_at + 120 minutes (ERR_SPILL_DEADLINE_PASSED); discharge rolling-window aggregate capacity (ERR_PERMIT_VOLUME_EXCEEDED)"
    error_id: "ERR_SPILL_DEADLINE_PASSED | ERR_PERMIT_VOLUME_EXCEEDED"
    http_status: 409
    applies_to: "spill confirm, effluent reading creation"

  - priority: 8
    category: business_fiscal
    check: "Capacity/budget last: airline credit (outstanding_balance_cents + estimated charge of the new request > credit_limit_cents → ERR_CREDIT_LIMIT_EXCEEDED); fluid sufficiency at complete (ERR_INSUFFICIENT_FLUID); tank capacity on replenish (ERR_TANK_CAPACITY_EXCEEDED)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_INSUFFICIENT_FLUID | ERR_TANK_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "request creation, operation complete, tank replenish"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- DeiceStation ---
  - method: POST
    path: "/deice-ops/stations"
    description: "Create a deice station"
    roles: [StationAdmin]
    code: 201
    input: [code, name, "min_collection_pct?", "fluid_ops_minimum_liters?", "storm_surcharge_pct?"]
    output: DeiceStation
    side_effects: ["posture=NORMAL, active_supply_alert=false, ops_epoch_index=0"]

  - method: GET
    path: "/deice-ops/stations/{id}"
    description: "Get a station (posture, alert, pool, epoch)"
    roles: [StationAdmin, PadOperator, EnvironmentalOfficer, BillingClerk, AirlineRep, Inspector]
    code: 200
    input: []
    output: DeiceStation
    side_effects: []

  - method: POST
    path: "/deice-ops/stations/{id}/run_ops_checkpoint"
    description: "Advance ops epoch: expire stale queued requests, expire permits past effective_to, recompute derived state"
    roles: [StationAdmin]
    code: 200
    input: []
    output: DeiceStation
    side_effects:
      - "ops_epoch_index += 1"
      - "QUEUED/DEFERRED requests reaching epochs_in_queue >= 2 → EXPIRED (reservations released)"
      - "permits past effective_to → EXPIRED"
      - "tank statuses, posture, active_supply_alert recomputed"
      - "increments DeiceStation.version by 1"

  # --- DeicePad ---
  - method: POST
    path: "/deice-ops/pads"
    description: "Create a pad"
    roles: [StationAdmin]
    code: 201
    input: [station_id, code, max_size_class, rated_collection_pct]
    output: DeicePad
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/deice-ops/pads/{id}"
    description: "Get a pad"
    roles: [StationAdmin, PadOperator]
    code: 200
    input: []
    output: DeicePad
    side_effects: []

  - method: GET
    path: "/deice-ops/pads"
    description: "List pads (filtered)"
    roles: [StationAdmin, PadOperator]
    code: 200
    input: ["station_id?", "status?"]
    output: DeicePad[]
    side_effects: []

  - method: POST
    path: "/deice-ops/pads/{id}/take_out_of_service"
    description: "Take an AVAILABLE pad out of service (terminal)"
    roles: [StationAdmin]
    code: 200
    input: []
    output: DeicePad
    side_effects: ["status → OUT_OF_SERVICE", "increments DeicePad.version by 1"]

  # --- WeatherEvent ---
  - method: POST
    path: "/deice-ops/weather-events"
    description: "Create a weather event (FORECASTED)"
    roles: [StationAdmin]
    code: 201
    input: [station_id, precip_type, precip_rate, severity, started_at]
    output: WeatherEvent
    side_effects: ["status=FORECASTED, escalation_level=0, required_crew_count computed"]

  - method: GET
    path: "/deice-ops/weather-events/{id}"
    description: "Get a weather event"
    roles: [StationAdmin, PadOperator, EnvironmentalOfficer]
    code: 200
    input: []
    output: WeatherEvent
    side_effects: []

  - method: GET
    path: "/deice-ops/weather-events"
    description: "List weather events (filtered)"
    roles: [StationAdmin, PadOperator, EnvironmentalOfficer]
    code: 200
    input: ["station_id?", "status?"]
    output: WeatherEvent[]
    side_effects: []

  - method: POST
    path: "/deice-ops/weather-events/{id}/activate"
    description: "Activate a FORECASTED event, or re-activate an ENDED event (re-intensification; clears ended_at)"
    roles: [StationAdmin]
    code: 200
    input: []
    output: WeatherEvent
    side_effects: ["status → ACTIVE", "ended_at cleared on re-intensification", "increments WeatherEvent.version by 1"]

  - method: POST
    path: "/deice-ops/weather-events/{id}/end"
    description: "End an ACTIVE event (→ ENDED) or cancel a FORECASTED one (→ CANCELLED)"
    roles: [StationAdmin]
    code: 200
    input: []
    output: WeatherEvent
    side_effects: ["ended_at set to current logical clock", "increments WeatherEvent.version by 1"]

  - method: POST
    path: "/deice-ops/weather-events/{id}/escalate"
    description: "Escalate staffing: set assigned_crew_count, bump escalation_level"
    roles: [StationAdmin]
    code: 200
    input: [assigned_crew_count]
    output: WeatherEvent
    side_effects: ["escalation_level += 1", "staffing_status recomputed", "increments WeatherEvent.version by 1"]

  # --- FluidTank ---
  - method: POST
    path: "/deice-ops/fluid-tanks"
    description: "Create a fluid tank"
    roles: [StationAdmin]
    code: 201
    input: [station_id, fluid_type, concentration_pct, capacity_liters, on_hand_liters, reorder_threshold_liters]
    output: FluidTank
    side_effects: ["status computed (OK/REORDER_PENDING/EMPTY)"]

  - method: GET
    path: "/deice-ops/fluid-tanks/{id}"
    description: "Get a tank"
    roles: [StationAdmin, PadOperator, EnvironmentalOfficer]
    code: 200
    input: []
    output: FluidTank
    side_effects: []

  - method: GET
    path: "/deice-ops/fluid-tanks"
    description: "List tanks (filtered)"
    roles: [StationAdmin, PadOperator, EnvironmentalOfficer]
    code: 200
    input: ["station_id?", "fluid_type?", "status?"]
    output: FluidTank[]
    side_effects: []

  - method: POST
    path: "/deice-ops/fluid-tanks/{id}/replenish"
    description: "Add delivered fluid; retries reservations for UNRESERVED matching requests in queue order"
    roles: [StationAdmin]
    code: 200
    input: [liters]
    output: FluidTank
    side_effects:
      - "on_hand_liters += liters; rejects when on_hand + liters > capacity_liters (ERR_TANK_CAPACITY_EXCEEDED)"
      - "tank status recomputed; station posture and active_supply_alert recomputed"
      - "UNRESERVED requests with matching fluid_type reserved in queue order while eligibility holds (tank_selector)"
      - "increments FluidTank.version by 1"

  # --- Airline ---
  - method: POST
    path: "/deice-ops/airlines"
    description: "Create an airline"
    roles: [StationAdmin]
    code: 201
    input: [code, name, credit_limit_cents]
    output: Airline
    side_effects: ["outstanding_balance_cents=0, monthly_billed_liters=0"]

  - method: GET
    path: "/deice-ops/airlines/{id}"
    description: "Get an airline (balance, monthly liters); AirlineRep limited to own id"
    roles: [StationAdmin, AirlineRep, BillingClerk]
    code: 200
    input: []
    output: Airline
    side_effects: []

  # --- DeiceRequest ---
  - method: POST
    path: "/deice-ops/deice-requests"
    description: "Create a deice request (QUEUED); runs tank_selector reservation and fiscal gate"
    roles: [AirlineRep, StationAdmin]
    code: 201
    input: [airline_id, station_id, flight_number, aircraft_type, size_class, scheduled_departure, fluid_type, "priority?"]
    output: DeiceRequest
    side_effects:
      - "estimated_liters computed from size_class"
      - "tank_selector runs: RESERVED with assigned_tank_id, or UNRESERVED with null tank"
      - "fiscal gate: outstanding_balance_cents + estimated charge (estimated_liters * base RATE, no tier/surcharge) > credit_limit_cents → ERR_CREDIT_LIMIT_EXCEEDED"
      - "station active_supply_alert/posture recomputed after reservation"

  - method: GET
    path: "/deice-ops/deice-requests/{id}"
    description: "Get a request"
    roles: [StationAdmin, PadOperator, AirlineRep]
    code: 200
    input: []
    output: DeiceRequest
    side_effects: []

  - method: GET
    path: "/deice-ops/deice-requests"
    description: "List requests (filtered); AirlineRep results restricted to own airline"
    roles: [StationAdmin, PadOperator, AirlineRep]
    code: 200
    input: ["airline_id?", "station_id?", "assigned_tank_id?", "assigned_pad_id?", "status?"]
    output: DeiceRequest[]
    side_effects: []

  - method: POST
    path: "/deice-ops/deice-requests/{id}/assign"
    description: "Assign a QUEUED request to a pad with a planned occupancy window; creates the PLANNED operation"
    roles: [PadOperator]
    code: 200
    input: [pad_id, window_start, window_end]
    output: DeiceRequest
    side_effects:
      - "status QUEUED → ASSIGNED; assigned_pad_id set (pad flips to OCCUPIED only at spray start)"
      - "DeiceOperation created PLANNED (tank_id copied from request.assigned_tank_id)"
      - "increments DeiceRequest.version by 1"

  - method: POST
    path: "/deice-ops/deice-requests/{id}/defer"
    description: "Defer a QUEUED request"
    roles: [PadOperator]
    code: 200
    input: []
    output: DeiceRequest
    side_effects: ["status → DEFERRED", "defer_count += 1", "increments DeiceRequest.version by 1"]

  - method: POST
    path: "/deice-ops/deice-requests/{id}/requeue"
    description: "Requeue a DEFERRED request"
    roles: [PadOperator]
    code: 200
    input: []
    output: DeiceRequest
    side_effects: ["status → QUEUED", "increments DeiceRequest.version by 1"]

  - method: POST
    path: "/deice-ops/deice-requests/{id}/abort"
    description: "Abort a QUEUED/ASSIGNED/DEFERRED request; releases pad and reservation"
    roles: [PadOperator, AirlineRep]
    code: 200
    input: []
    output: DeiceRequest
    side_effects:
      - "status → ABORTED"
      - "from ASSIGNED: pad → AVAILABLE, PLANNED operation → CANCELLED"
      - "reservation released; tank and station derived fields recomputed"
      - "increments DeiceRequest.version by 1"

  # --- DeiceOperation ---
  - method: GET
    path: "/deice-ops/deice-operations/{id}"
    description: "Get an operation"
    roles: [StationAdmin, PadOperator, Inspector, EnvironmentalOfficer, BillingClerk]
    code: 200
    input: []
    output: DeiceOperation
    side_effects: []

  - method: GET
    path: "/deice-ops/deice-operations"
    description: "List operations (filtered)"
    roles: [StationAdmin, PadOperator, Inspector, EnvironmentalOfficer, BillingClerk]
    code: 200
    input: ["request_id?", "station_id?", "pad_id?", "tank_id?", "parent_operation_id?", "status?"]
    output: DeiceOperation[]
    side_effects: []

  - method: POST
    path: "/deice-ops/deice-operations/{id}/start"
    description: "Start spraying (PLANNED → SPRAYING); computes holdover_minutes/holdover_variant"
    roles: [PadOperator]
    code: 200
    input: [oat_celsius]
    output: DeiceOperation
    side_effects:
      - "holdover_minutes and holdover_variant computed per holdover_time"
      - "request.status ASSIGNED → IN_PROGRESS"
      - "pad.status AVAILABLE → OCCUPIED"
      - "increments DeiceOperation.version by 1"

  - method: POST
    path: "/deice-ops/deice-operations/{id}/complete"
    description: "Finish spraying (SPRAYING → AWAITING_INSPECTION); records actual/collected liters"
    roles: [PadOperator]
    code: 200
    input: [actual_liters, collected_liters]
    output: DeiceOperation
    side_effects:
      - "tank.on_hand_liters -= actual_liters"
      - "collection_pct and collection_flag computed"
      - "tank status, station posture/alert recomputed"
      - "increments DeiceOperation.version by 1"

  - method: POST
    path: "/deice-ops/deice-operations/{id}/void"
    description: "Void a CLEARED operation (data correction); exactly restores tank volume and collected pool"
    roles: [PadOperator]
    code: 200
    input: []
    output: DeiceOperation
    side_effects:
      - "status CLEARED → VOIDED"
      - "tank.on_hand_liters += actual_liters; station.collected_pool_liters -= collected_liters"
      - "tank status, station posture/alert recomputed"
      - "increments DeiceOperation.version by 1"

  # --- Inspection ---
  - method: POST
    path: "/deice-ops/inspections"
    description: "Record an inspection; POST_TREATMENT result drives operation CLEARED or the REWORK cascade"
    roles: [Inspector]
    code: 201
    input: [operation_id, kind, result, "findings?"]
    output: Inspection
    side_effects:
      - "ACCEPTANCE: at most one ACCEPTANCE inspection per operation (ERR_INSPECTION_EXISTS); operation must be PLANNED (ERR_INVALID_STATE); enables start"
      - "POST_TREATMENT: inspector_id must differ from the ACCEPTANCE inspection's inspector_id (ERR_SOD_VIOLATION); operation must be AWAITING_INSPECTION (ERR_INVALID_STATE); at most one POST_TREATMENT per operation (ERR_INSPECTION_EXISTS)"
      - "POST_TREATMENT PASS → operation CLEARED (+request COMPLETED, pad AVAILABLE, pool credit)"
      - "POST_TREATMENT FAIL → operation REWORK_REQUIRED + rework cascade (auto child operation, tank reservation, station posture recompute)"

  - method: GET
    path: "/deice-ops/deice-operations/{id}/inspections"
    description: "List inspections of an operation"
    roles: [StationAdmin, PadOperator, Inspector]
    code: 200
    input: ["kind?"]
    output: Inspection[]
    side_effects: []

  # --- DischargePermit ---
  - method: POST
    path: "/deice-ops/discharge-permits"
    description: "Create a discharge permit (OCC-guarded); supersedes the station's prior ACTIVE permit"
    roles: [StationAdmin]
    code: 201
    input: [station_id, permit_number, effective_from, effective_to, max_single_reading_mg_l, rolling_window_days, rolling_window_max_liters, expected_station_version]
    output: DischargePermit
    side_effects:
      - "prior ACTIVE permit of the station → SUPERSEDED"
      - "station posture recomputed"
      - "increments DeiceStation.version by 1"

  - method: GET
    path: "/deice-ops/discharge-permits/{id}"
    description: "Get a permit"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: []
    output: DischargePermit
    side_effects: []

  - method: GET
    path: "/deice-ops/discharge-permits"
    description: "List permits (filtered)"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: ["station_id?", "status?"]
    output: DischargePermit[]
    side_effects: []

  - method: POST
    path: "/deice-ops/discharge-permits/{id}/suspend"
    description: "Suspend an ACTIVE permit; station posture → PERMIT_SUSPENDED"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: DischargePermit
    side_effects: ["status → SUSPENDED", "station posture recomputed", "increments DischargePermit.version by 1"]

  - method: POST
    path: "/deice-ops/discharge-permits/{id}/reinstate"
    description: "Reinstate a SUSPENDED permit"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: DischargePermit
    side_effects: ["status → ACTIVE", "station posture recomputed", "increments DischargePermit.version by 1"]

  # --- EffluentReading ---
  - method: POST
    path: "/deice-ops/discharge-permits/{id}/effluent-readings"
    description: "Record a discharge reading; rolling-window volume overflow rejects; concentration breach flags and may auto-suspend"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [measured_at, concentration_mg_l, volume_liters]
    output: EffluentReading
    side_effects:
      - "violation = concentration_mg_l > permit.max_single_reading_mg_l"
      - "concentration_mg_l > 2 * max_single_reading_mg_l → permit auto-SUSPENDED → station posture PERMIT_SUSPENDED"
      - "rolling-window volume check per rolling_discharge_window (ERR_PERMIT_VOLUME_EXCEEDED)"

  - method: GET
    path: "/deice-ops/discharge-permits/{id}/effluent-readings"
    description: "List readings of a permit"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: []
    output: EffluentReading[]
    side_effects: []

  # --- SpillReport ---
  - method: POST
    path: "/deice-ops/spill-reports"
    description: "Report a spill; classification computed (REPORTABLE at >= 100 L)"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [station_id, tank_id, quantity_liters, occurred_at]
    output: SpillReport
    side_effects: ["status=REPORTED, classification computed", "reporter_id set from X-User-ID"]

  - method: GET
    path: "/deice-ops/spill-reports/{id}"
    description: "Get a spill report"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: []
    output: SpillReport
    side_effects: []

  - method: GET
    path: "/deice-ops/spill-reports"
    description: "List spill reports (filtered)"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: ["station_id?", "tank_id?", "status?"]
    output: SpillReport[]
    side_effects: []

  - method: POST
    path: "/deice-ops/spill-reports/{id}/confirm"
    description: "Confirm a spill within the 120-minute regulatory window; deducts spilled volume from the source tank"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: SpillReport
    side_effects:
      - "status → CONFIRMED, confirmed_by set"
      - "tank.on_hand_liters -= quantity_liters (floor 0); tank status recomputed"
      - "station.active_supply_alert recomputed"
      - "increments SpillReport.version by 1"

  - method: POST
    path: "/deice-ops/spill-reports/{id}/close"
    description: "Close a CONFIRMED spill; closer must differ from reporter (SoD)"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: SpillReport
    side_effects: ["status → CLOSED, closed_by set", "increments SpillReport.version by 1"]

  # --- RecyclingContract ---
  - method: POST
    path: "/deice-ops/recycling-contracts"
    description: "Create a glycol recycling contract"
    roles: [StationAdmin]
    code: 201
    input: [station_id, vendor_name, min_concentration_pct, price_per_liter_cents, contracted_min_liters]
    output: RecyclingContract
    side_effects: ["status=ACTIVE, delivered_liters=0, total_revenue_cents=0"]

  - method: GET
    path: "/deice-ops/recycling-contracts/{id}"
    description: "Get a recycling contract"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: []
    output: RecyclingContract
    side_effects: []

  - method: GET
    path: "/deice-ops/recycling-contracts"
    description: "List recycling contracts (filtered)"
    roles: [StationAdmin, EnvironmentalOfficer]
    code: 200
    input: ["station_id?", "status?"]
    output: RecyclingContract[]
    side_effects: []

  - method: POST
    path: "/deice-ops/recycling-contracts/{id}/record_shipment"
    description: "Record a collected-glycol shipment to the vendor; quality and pool checks; auto-fulfills at contract minimum"
    roles: [StationAdmin]
    code: 200
    input: [volume_liters, concentration_pct]
    output: RecyclingContract
    side_effects:
      - "contract must be ACTIVE (ERR_INVALID_STATE); concentration_pct >= min_concentration_pct (ERR_RECYCLE_QUALITY); volume_liters <= station.collected_pool_liters (ERR_INSUFFICIENT_COLLECTED_GLYCOL)"
      - "delivered_liters += volume_liters; revenue = round_half_up(volume_liters * price_per_liter_cents); total_revenue_cents += revenue; last_shipment_revenue_cents = revenue"
      - "station.collected_pool_liters -= volume_liters"
      - "delivered_liters >= contracted_min_liters → status FULFILLED"
      - "increments RecyclingContract.version by 1"

  # --- Invoice ---
  - method: POST
    path: "/deice-ops/invoices"
    description: "Create a DRAFT invoice for a CLEARED operation (OCC-guarded on airline version); supersedes prior DRAFT for the same operation"
    roles: [BillingClerk]
    code: 201
    input: [operation_id, expected_airline_version]
    output: Invoice
    side_effects:
      - "invoice lines computed per invoice_charges (MARGINAL_TIER)"
      - "existing DRAFT invoice for the same operation → SUPERSEDED (supersedes_invoice_id recorded); an existing ISSUED invoice → ERR_INVALID_STATE"
      - "increments Airline.version by 1"

  - method: GET
    path: "/deice-ops/invoices/{id}"
    description: "Get an invoice; AirlineRep limited to own airline's invoices"
    roles: [StationAdmin, BillingClerk, AirlineRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/deice-ops/invoices"
    description: "List invoices (filtered); AirlineRep restricted to own airline"
    roles: [StationAdmin, BillingClerk, AirlineRep]
    code: 200
    input: ["airline_id?", "station_id?", "operation_id?", "status?", "supersedes_invoice_id?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/deice-ops/invoices/{id}/issue"
    description: "Issue a DRAFT invoice; debits airline outstanding balance and monthly liters"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status → ISSUED"
      - "airline.outstanding_balance_cents += total_cents; airline.monthly_billed_liters += operation.actual_liters"
      - "increments Invoice.version by 1 and Airline.version by 1"

  - method: POST
    path: "/deice-ops/invoices/{id}/void"
    description: "Void an ISSUED invoice; exactly restores airline outstanding balance and monthly liters"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status → VOID"
      - "airline.outstanding_balance_cents -= total_cents; airline.monthly_billed_liters -= operation.actual_liters"
      - "increments Invoice.version by 1 and Airline.version by 1"

  # --- Test-driving clock ---
  - method: POST
    path: "/deice-ops/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default (before any set call) is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [StationAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or AirlineRep touching another airline's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum value, malformed datetime, window_end <= window_start, non-positive quantities" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal lockdown, duplicate active invoice ISSUED, readings on SUPERSEDED/EXPIRED permit)" }
  - { id: ERR_INSPECTION_EXISTS, http: 409, condition: "An inspection of the same kind already exists for the operation" }
  - { id: ERR_PERMIT_SUSPENDED, http: 409, condition: "Station posture is PERMIT_SUSPENDED; assign blocked" }
  - { id: ERR_ACCEPTANCE_REQUIRED, http: 409, condition: "Spray start without an ACCEPTANCE PASS inspection on the operation" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties breached (same inspector for acceptance and post-treatment, or spill closed by its reporter)" }
  - { id: ERR_PAD_INCOMPATIBLE, http: 409, condition: "Pad max_size_class smaller than request size_class" }
  - { id: ERR_PAD_NOT_AVAILABLE, http: 409, condition: "Pad not in AVAILABLE status (OCCUPIED or OUT_OF_SERVICE)" }
  - { id: ERR_PAD_WINDOW_OVERLAP, http: 409, condition: "Planned window overlaps a non-terminal operation window on the pad (half-open; adjacency allowed)" }
  - { id: ERR_FLUID_CONSTRAINED, http: 409, condition: "Station posture FLUID_CONSTRAINED, or request is UNRESERVED, at assign time" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Airline outstanding balance plus the new request's estimated charge would exceed credit_limit_cents" }
  - { id: ERR_INSUFFICIENT_FLUID, http: 409, condition: "actual_liters exceeds tank.on_hand_liters at complete" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 409, condition: "Replenish would push on_hand_liters above capacity_liters" }
  - { id: ERR_PERMIT_VOLUME_EXCEEDED, http: 409, condition: "Rolling-window discharge volume would exceed rolling_window_max_liters" }
  - { id: ERR_SPILL_DEADLINE_PASSED, http: 409, condition: "Confirm attempted after occurred_at + 120 minutes" }
  - { id: ERR_RECYCLE_QUALITY, http: 409, condition: "Shipment concentration below contract min_concentration_pct" }
  - { id: ERR_INSUFFICIENT_COLLECTED_GLYCOL, http: 409, condition: "Shipment volume exceeds station collected_pool_liters" }
  - { id: ERR_OPERATION_INVOICED, http: 409, condition: "Void blocked: a DRAFT or ISSUED invoice exists for the operation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StationAdmin
    description: "Airport operations administrator; owns configuration, weather, tanks, pads, permits creation, recycling contracts, ops checkpoint, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /deice-ops/stations, POST /deice-ops/stations/{id}/run_ops_checkpoint"
      - "POST /deice-ops/pads, POST /deice-ops/pads/{id}/take_out_of_service"
      - "POST /deice-ops/weather-events*, POST /deice-ops/fluid-tanks*"
      - "POST /deice-ops/discharge-permits (create/supersede)"
      - "POST /deice-ops/recycling-contracts*"
      - "POST /deice-ops/_clock/set_current_utc"
    shared_operations:
      - "GET reads across station resources"
      - "POST /deice-ops/airlines, POST /deice-ops/deice-requests"

  - name: AirlineRep
    description: "Airline representative requesting deicing for own airline's flights; sees own invoices"
    identity: "entity_backed:Airline"
    exclusive_operations: []
    shared_operations:
      - "POST /deice-ops/deice-requests (airline_id must equal X-User-ID)"
      - "POST /deice-ops/deice-requests/{id}/abort (own airline's requests only)"
      - "GET /deice-ops/airlines/{id} (own id only), GET /deice-ops/deice-requests*, GET /deice-ops/invoices* (own airline only)"

  - name: PadOperator
    description: "Deicing pad operator; assigns pads, sequences the queue, runs spray operations"
    identity: opaque
    exclusive_operations:
      - "POST /deice-ops/deice-requests/{id}/assign, /defer, /requeue"
      - "POST /deice-ops/deice-operations/{id}/start, /complete, /void"
    shared_operations:
      - "POST /deice-ops/deice-requests/{id}/abort"
      - "GET reads on stations, pads, weather, tanks, requests, operations, inspections"

  - name: Inspector
    description: "Airworthiness inspector; records acceptance and post-treatment inspections (SoD: never both kinds on the same operation)"
    identity: opaque
    exclusive_operations:
      - "POST /deice-ops/inspections"
    shared_operations:
      - "GET /deice-ops/deice-operations*"

  - name: EnvironmentalOfficer
    description: "Glycol compliance officer; discharge readings, permit suspend/reinstate, spill reports (SoD: cannot close own reported spill)"
    identity: opaque
    exclusive_operations:
      - "POST /deice-ops/discharge-permits/{id}/effluent-readings"
      - "POST /deice-ops/discharge-permits/{id}/suspend, /reinstate"
      - "POST /deice-ops/spill-reports*, confirm, close"
    shared_operations:
      - "GET reads on stations, weather, tanks, operations, permits, spills, contracts"

  - name: BillingClerk
    description: "Cost-recovery clerk; creates, issues, and voids airline invoices"
    identity: opaque
    exclusive_operations:
      - "POST /deice-ops/invoices, POST /deice-ops/invoices/{id}/issue, POST /deice-ops/invoices/{id}/void"
    shared_operations:
      - "GET /deice-ops/airlines/{id}, GET /deice-ops/invoices*, GET /deice-ops/deice-operations*"
