        distinguishing_aspect: "Check-in is bounded by [start-15m, end]: at 09:44 for a 10:00-12:00 shift it fails ERR_CHECKIN_WINDOW_CLOSED, at 09:45 it succeeds, and completion credits exactly 120 minutes to the volunteer."
