            - { call: "POST /contract-sites", payload: { contract_id: "${kN}", site_id: "${sN}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher }
            - { call: "POST /contracts/${kN}/activate", as: OpsDispatcher }
            - { call: "POST /contracts", payload: { client_id: "${clB}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 52000, require_photo_verification: false }, as: OpsDispatcher, captures: { kL: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kL}", site_id: "${sL}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher }
            - { call: "POST /contracts/${kL}/activate", as: OpsDispatcher }
            - { call: "POST /subcontractors", payload: { legal_name: "NoLoader Inc", contact_email: "ops@noloader.example", has_loader: false, has_brine_truck: true }, as: OpsDispatcher, captures: { subC: $.data.id } }
            - { call: "POST /subcontractors/${subC}/approve", as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-10T00:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-10T08:00:00Z", reported_accumulation_inches: 3.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eC: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${eC}", contract_id: "${kN}", subcontractor_id: "${subC}", coverage_start: "2027-01-10T06:00:00Z", coverage_end: "2027-01-10T14:00:00Z" }, as: OpsDispatcher, captures: { caC: $.data.id } }
            - { call: "POST /coverage-assignments/${caC}/activate", as: Subcontractor, as_user_id: "${subC}" }
          trigger:
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${eC}", contract_id: "${kL}", subcontractor_id: "${subC}", coverage_start: "2027-01-10T10:00:00Z", coverage_end: "2027-01-10T18:00:00Z" }, as: OpsDispatcher, captures: { dual_err2: $.data.error_id } }
          assert:
            - "Dual failure (capability mismatch on loader-requiring contract kL AND half-open overlap with caC's [06:00,14:00)): error_id == ERR_CAPABILITY_MISMATCH — constraint (priority 11) outranks temporal (priority 16)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: trigger_depth_equality_boundary
        grounds:
          - calculations.visit_billing_evaluation
          - calculations.verified_accumulation_inches
          - entities.Contract.fields.trigger_depth_inches
        distinguishing_aspect: |
          Boundary on the ACCUMULATION-INCHES metric reached through POST
          /storm-events/{id}/verify: the >= comparison is inclusive, so a verified
          1.99 in leaves the visit NON_BILLABLE while exactly 2.00 in confirms
          billing on a 2.00-in trigger.
        test_recipe:
          setup:
            - "PER_PUSH contract (trigger 2.0, rate 45000, no photo gate) ACTIVE"
            - "Event eLo verifies at 1.99 with completed visit vLo; event eEq verifies at exactly 2.00 with completed visit vEq"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Boundary Estates", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { clD: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clD}", name: "Edge Lot", address: "4 Margin Ln", region_code: "NE", pavement_area_sqft: 15000, requires_loader: false }, as: OpsDispatcher, captures: { sD: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clD}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 2.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { kD: $.data.id } }
