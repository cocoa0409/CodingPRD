    input: ["gear_model_id", "owner_customer_id", "serial_number", "purchase_date", "purchase_price_cents", "proof_of_purchase_type?", "proof_of_purchase_ref?", "condition_grade?"]
    output: GearItem
    side_effects: ["age_months, warranty_state, replacement_value_depreciated_cents and replacement_value_successor_cents derived (calculations.replacement_value)", "disposition_status = WITH_CUSTOMER"]
  - method: GET
    path: "/gear-service/gear-items/{id}"
    description: "read a unit with its derived age, warranty state and both valuation variants"
    roles: [Customer, ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: GearItem
    side_effects: []
  - method: GET
    path: "/gear-service/gear-items"
    description: "list units; gear_model_id and owner_customer_id filters are the reverse-reachability channels for both FKs"
    roles: [Customer, ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["gear_model_id?", "owner_customer_id?", "disposition_status?", "warranty_state?", "limit?", "offset?"]
    output: GearItem[]
    side_effects: []
  - method: POST
    path: "/gear-service/gear-items/{id}/trade-in"
    description: "accept an irreparable unit as a trade-in and price its refurbished listing"
    roles: [Customer, ServiceAgent]
    code: 200
    input: [condition_grade]
    output: GearItem
    side_effects:
      - "calculations.trade_in_credit computes trade_in_credit_cents and refurb_list_price_cents"
