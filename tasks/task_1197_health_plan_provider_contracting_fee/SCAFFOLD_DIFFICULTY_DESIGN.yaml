            - { call: "POST /contracts/${ct_id}/paid-claims", payload: { claim_number: "CLM-2", hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-08-20", billed_cents: 20000, paid_cents: 15000 }, as: PaymentIntegrityAnalyst, captures: { pc2_id: $.data.id } }
