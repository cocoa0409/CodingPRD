# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds only in SCAFFOLD.yaml §1.1-§1.7.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: fill_projection_provisional_vs_final_diverge_on_distribution_event
        grounds:
          - calculations.distribution_fill_projection
          - entities.DistributionEvent.fields.provisional_fill_pct
          - entities.DistributionEvent.fields.final_fill_pct
          - entities.InventoryPosition.fields.in_transit_qty
          - state_machines.DistributionEvent.PUBLISHED_to_LOCKED
        distinguishing_aspect: |
          This dual-variant pair lives on the DistributionEvent domain: the PROVISIONAL
          variant counts in-transit purchase-order units and all four non-terminal
          registration statuses, the FINAL variant counts only on-hand units and only
          {VERIFIED, CONFIRMED} registrations, so the identical database yields
          provisional_fill_pct 100.00 and final_fill_pct 50.00.
        test_recipe:
          setup:
            - "Lincoln Elementary is an ACTIVE partner with a PUBLISHED K_2 needs list of 4 pencils, 2 notebooks and 1 backpack per student."
            - "Drive cycle 'Back-to-School 2026' (BACK_TO_SCHOOL) is COLLECTING; on-hand is 6 pencils, 20 notebooks, 5 backpacks."
            - "A SUBMITTED purchase order adds 24 pencils of in-transit expectation."
            - "A PUBLISHED distribution event for K_2 with seat_capacity 20 holds four registrations: two VERIFIED, one PENDING, one WAITLISTED."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
            - call: "POST /supply-items"
              payload: { sku: "NBK-01", name: "Composition notebook", category: "PAPER", unit_cost_cents: 180, bulk_pack_size: 10 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { notebook_id: $.data.id }
            - call: "POST /supply-items"
              payload: { sku: "BPK-01", name: "Standard backpack", category: "BACKPACK", unit_cost_cents: 1450, bulk_pack_size: 6 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { backpack_id: $.data.id }
            - call: "POST /grade-kit-specs"
              payload: { school_id: "${school_id}", grade_band: "K_2", student_target_count: 100 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${pencil_id}", qty_per_student: 4 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${notebook_id}", qty_per_student: 2 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${backpack_id}", qty_per_student: 1 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "PATCH /grade-kit-specs/${spec_id}/status"
              payload: { target_status: "PUBLISHED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", delta_on_hand_qty: 6, reason: "opening count" }
              as: WarehouseLead
              as_user_id: "wl-1"
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${notebook_id}", delta_on_hand_qty: 20, reason: "opening count" }
              as: WarehouseLead
              as_user_id: "wl-1"
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${backpack_id}", delta_on_hand_qty: 5, reason: "opening count" }
              as: WarehouseLead
              as_user_id: "wl-1"
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Acme Corp", amount_cents: 20000, restriction_type: "UNRESTRICTED" }
              as: DonorRelations
              as_user_id: "dr-1"
            - call: "POST /purchase-orders"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", requested_unit_gap: 24 }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po_id: $.data.id }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { cyc_v1: $.data.version }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { target_status: "SUBMITTED", expected_drive_cycle_version: "${cyc_v1}" }
              as: WarehouseLead
              as_user_id: "wl-1"
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "K_2", window_start: "2026-08-20T15:00:00Z", window_end: "2026-08-20T19:00:00Z", seat_capacity: 20 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-001", grade_band: "K_2", guardian_name: "G One", free_lunch_eligible: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-002", grade_band: "K_2", guardian_name: "G Two", free_lunch_eligible: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-003", grade_band: "K_2", guardian_name: "G Three", free_lunch_eligible: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-004", grade_band: "K_2", guardian_name: "G Four", income_verified: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r4_id: $.data.id }
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /student-registrations/${r1_id}/transitions"
              payload: { target_status: "VERIFIED", expected_distribution_event_version: "${ev_v1}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v2: $.data.version }
            - call: "POST /student-registrations/${r2_id}/transitions"
              payload: { target_status: "VERIFIED", expected_distribution_event_version: "${ev_v2}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v3: $.data.version }
            - call: "POST /student-registrations/${r4_id}/transitions"
              payload: { target_status: "VERIFIED", expected_distribution_event_version: "${ev_v3}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v4: $.data.version }
            - call: "POST /student-registrations/${r4_id}/transitions"
              payload: { target_status: "WAITLISTED", expected_distribution_event_version: "${ev_v4}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
          trigger:
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { prov_before_lock: $.data.provisional_fill_pct }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "SORTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "DISTRIBUTION" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /distribution-events/${ev_id}/transitions"
              payload: { target_status: "LOCKED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { final_pct: $.data.final_fill_pct, prov_pct: $.data.provisional_fill_pct }
          assert:
            - "DistributionEvent.${ev_id}.provisional_fill_pct == 100.00"
            - "DistributionEvent.${ev_id}.final_fill_pct == 50.00"
            - "DistributionEvent.${ev_id}.status == LOCKED"
            - "DistributionEvent.${ev_id}.provisional_fill_pct != DistributionEvent.${ev_id}.final_fill_pct"

      - name: impact_index_interim_vs_audited_diverge_on_school
        grounds:
          - calculations.school_impact_index
          - entities.School.fields.impact_index_interim
          - entities.School.fields.impact_index_audited
          - entities.School.fields.no_show_count
          - state_machines.DistributionEvent.LOCKED_to_CLOSED
        distinguishing_aspect: |
          This second dual-variant pair lives on a different entity domain, the School:
          INTERIM counts {CONFIRMED, FULFILLED} students against provisional_fill_pct of
          {PUBLISHED, LOCKED, CLOSED} events with no penalty, AUDITED counts only
          FULFILLED students against final_fill_pct of CLOSED events and applies the
          no-show penalty, so the same closed event yields 43.10 versus 35.92.
        test_recipe:
