          assert:
            - "${req_pro} == false — professional_use_only == true removes the ingredient from the required set regardless of concentration"
            - "${req_consumer} == true — the identical 0.5000 concentration is disclosure-required on the consumer listing"
            - "ProductListing ${lst_pro_id}: undisclosed_allergen_count == 0 and allergen_disclosure_complete == true (a vacuous required set is COMPLETE)"
            - "ProductListing ${lst_consumer_id}: undisclosed_allergen_count == 1 and allergen_disclosure_complete == false"
            - "both listings still have safety_status \"UNSUBSTANTIATED\" and marketable false — the allergen test is independent of the safety dimension"

      - name: unreachable_credit_tier_stays_pinned_to_the_provisional_rate
        claim_type: aggregation
        grounds:
          - calculations.withdrawal_recovery_rate
          - entities.MarketWithdrawal.fields.unreachable_credit_pct
          - state_machines.MarketWithdrawal.RECORDS_PRODUCED_to_CLOSED_EFFECTIVE
        distinguishing_aspect: |
          The mode-(c) trap in its sharpest form: 880 verified of 1000 shipped gives
          provisional_verified_rate 88.00, which selects the 3% MID tier, floor(30) credit, denominator
          970 and a final verified_recovery_rate of 90.72 — EFFECTIVE. Re-selecting the tier from the
          FINAL 90.72 (the 0% HIGH tier) would restore the 1000 denominator and report 88.00 —
          NOT_EFFECTIVE. One clean pass therefore closes the recall while a fixed-point implementation
          leaves it open, and the intermediate fields are all stored for inspection.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing with a single 1000-unit distribution record, a recall accepted by OFF-1, one withdrawal with that record produced, and a VERIFIED_RETURN of 880 units"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-C", consignee_name: "Gulf Coast Retail Group", consignee_class: "RETAIL", ship_date: "2026-08-05T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 1000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "VOLUNTARY_NOTICE", hazard_class: "CLASS_II" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Retail-level retrieval of lot LOT-C", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${ra_v}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd_id: $.data.id }
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${rec_id}"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { shipped_total: $.data.shipped_units_total }
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${rec_id}", units: 880 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec_outstanding: $.data.units_outstanding }
          trigger:
            - call: "POST /cosmetics/withdrawals/${wd_id}/effectiveness-check"
              payload: { basis: "VERIFIED_BASIS" }
              as: EnforcementOfficer
              as_user_id: "OFF-2"
              captures: { prov: $.data.provisional_verified_rate, credit: $.data.unreachable_credit_pct, denom: $.data.adjusted_denominator_units, final_rate: $.data.verified_recovery_rate, verdict: $.data.effectiveness_verdict, wd_status: $.data.status }
          assert:
            - "${shipped_total} == 1000 and ${rec_outstanding} == 120 (1000 - 880 verified)"
            - "${prov} == 88.00 (100 x 880 / 1000)"
            - "${credit} == 3 — the MID tier selected from the PROVISIONAL rate (88.00 >= 80.00, < 90.00)"
            - "${denom} == 970 (1000 - floor(1000 x 3 / 100))"
            - "${final_rate} == 90.72 (100 x 880 / 970, ROUND_HALF_UP) — NOT 88.00"
            - "${verdict} == \"EFFECTIVE\" and ${wd_status} == \"CLOSED_EFFECTIVE\" (90.72 >= 90.00)"
            - "MarketWithdrawal.outstanding_units_total == 120 and verified_recovered_units == 880"
            - "RecallAction ${ra_id}.status == \"CLOSED_EFFECTIVE\" with effectiveness_rate_final == 90.72"
            - "ProductListing ${lst_id}.open_recall_count == 0"
            - "GET /cosmetics/facilities/${fac_id}/ledger-entries?entry_type=WITHDRAWAL_CLOSURE returns exactly one row"

      - name: reported_and_verified_bases_disagree_on_the_same_linked_records
        claim_type: variant_divergence
        grounds:
          - calculations.withdrawal_recovery_rate
          - entities.MarketWithdrawal.fields.reported_recovery_rate
        excluded_because:
          difficulty_instance: withdrawal_reported_basis_versus_verified_basis_recovery_divergence
          rationale: |
            That §1.8 instance runs both bases over the same three linked records and pins 55.33 against
            49.65 with the full set of intermediate fields, which is exactly the divergence claim; the
            corner instance above (unreachable_credit_tier_stays_pinned_to_the_provisional_rate) probes
            the orthogonal mode-(c) tier-pinning trap instead.

      - name: basis_parameter_selects_the_recovery_variant_and_the_reachable_verdicts
        claim_type: variant_selection
        grounds:
          - calculations.withdrawal_recovery_rate
          - endpoints[POST /cosmetics/withdrawals/{id}/effectiveness-check]
        excluded_because:
          difficulty_instance: withdrawal_reported_basis_versus_verified_basis_recovery_divergence
          rationale: |
            The same §1.8 instance already shows the REPORTED_BASIS call leaving verified_recovery_rate
            and unreachable_credit_pct null with verdict INTERIM (no closure) and only the VERIFIED_BASIS
            call moving the withdrawal and its RecallAction — i.e. context-correct variant selection.

      - name: switching_from_reported_to_verified_units_reconciles_the_ledger_deltas
        claim_type: reconciliation
        grounds:
          - calculations.distribution_unit_conservation
          - entities.ComplianceLedgerEntry.fields.signed_units_delta
        excluded_because:
          difficulty_instance: correction_reversal_preserves_shipped_unit_conservation_and_ledger_sum
          rationale: |
            The provisional-to-verified reconciliation is precisely the invariant that §1.8 instance
            pins: signed UNIT_MOVEMENT deltas must still sum to the verified buckets after a
            CORRECTION_REVERSAL, and the per-record conservation identity must hold at every step.

      - name: gmp_rounding_boundary_sits_between_the_weighted_terms_and_their_sum
        claim_type: precision
        grounds:
          - calculations.gmp_readiness_score
          - entities.InspectionEngagement.fields.category_subscores
        excluded_because:
          difficulty_instance: gmp_readiness_rounded_weighted_terms_then_summed
          rationale: |
            That §1.8 instance is built on the 80.66-versus-80.67 discrimination and the stored
            per-category subscores, which is the whole precision claim for this calculation; the corner
            instances above reuse the same formula only at its NAI boundary and its deduction cap.

      - name: serious_event_points_are_rounded_per_event_before_summation
        claim_type: weighted_scoring
        grounds:
          - calculations.facility_serious_event_points
          - constants.PROFESSIONAL_RELIEF_FACTOR
        excluded_because:
          difficulty_instance: facility_points_three_events_lateness_cap_and_professional_relief
          rationale: |
            The per-event rounding discipline, the min() lateness cap at its knee and the
            professional-relief branch are pinned together in that §1.8 combinatorial-formula instance
            (10.00 + 5.00 + 2.00 = 17.00); a corner instance would restate the same summation rule.

      - name: posture_thresholds_are_inclusive_at_ten_and_twenty_five_points
        claim_type: threshold
        grounds:
          - calculations.facility_compliance_posture
          - constants.POSTURE_RESTRICTED_POINTS
          - constants.POSTURE_FROZEN_POINTS
        excluded_because:
          difficulty_instance: serious_event_points_inclusive_at_restricted_threshold_across_two_facilities
          rationale: |
            Both inclusive posture boundaries are already probed at exactly the threshold and one step
            below in that §1.8 boundary-precision instance, across two facilities so the per-facility
            scoping is visible at the same time.

      - name: allergen_thresholds_are_inclusive_and_form_specific
        claim_type: threshold
        grounds:
          - calculations.allergen_disclosure_completeness
          - constants.ALLERGEN_THRESHOLD_LEAVE_ON
          - constants.ALLERGEN_THRESHOLD_RINSE_OFF
        excluded_because:
          difficulty_instance: fragrance_allergen_thresholds_inclusive_per_product_form_and_vacuous_set
          rationale: |
            The 0.001 and 0.01 endpoints, the one-step-below cases and the vacuous empty-set case are
            the entire subject of that §1.8 instance; the corner instance above adds only the
            professional-use exemption, which that instance does not touch.

  - section: validations
