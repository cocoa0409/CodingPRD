      - name: corner_offer_expired_temporal
        claim_type: Temporal validation
        grounds: ["validations[priority=55]", "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Owner redeeming their own OFFERED offer after expires_at (clock 2026-04-15 > 2026-03-31) returns ERR_OFFER_EXPIRED."
