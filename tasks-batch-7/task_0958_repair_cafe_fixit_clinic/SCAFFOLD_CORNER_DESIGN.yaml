# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Repair Café & Fix-It Clinic
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: event_creation_required_fields_and_computed_defaults
        claim_type: creation
        grounds: [entities.RepairEvent]
        distinguishing_aspect: "Creating an event with all required fields returns 201 with status DRAFT, posture RESTRICTED (computed), active_item_count 0, version 1; omitting required field name returns ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
          trigger:
            - { call: "POST /api/repair-events", payload: { starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Tau", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id, evv: $.data.version } }
          assert:
            - "Missing name: error_id == ERR_VALIDATION"
            - "RepairEvent.${ev}.status == DRAFT AND posture == RESTRICTED AND active_item_count == 0 AND version == 1"
      - name: station_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Station.fields.category]
        distinguishing_aspect: "category PLUMBING is outside the declared enum and MUST be rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["one event exists"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Upsilon", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "PLUMBING", label: "X", capacity: 1 }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION"
      - name: repair_item_not_found_returns_404
        claim_type: not_found
        grounds: [entities.RepairItem, "errors[ERR_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_ITEM_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/repair-items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_NOT_FOUND with http 404"
      - name: item_intake_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.RepairItem.fields.hazard_flag]
        distinguishing_aspect: "Omitting hazard_flag applies default false; server-minted id/created_at/version present; priority_score 0 and required_skill_level 0 before triage."
        test_recipe:
          setup: ["Event INTAKE_OPEN with posture ACCEPTING; visitor with waiver"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Phi", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
          trigger:
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "TEXTILE", description: "Torn coat", weight_kg_estimated: 0.8 }, as: IntakeVolunteer, captures: { it: $.data.id, hz: $.data.hazard_flag } }
          assert:
            - "RepairItem.${it}.hazard_flag == false (default applied)"
            - "RepairItem.${it}.status == REGISTERED AND priority_score == 0 AND required_skill_level == 0 AND version == 1"
      - name: donation_monetary_missing_required_amount_rejected
        claim_type: required_fields
        grounds: [entities.Donation.fields.amount_cents]
        distinguishing_aspect: "MONETARY donation without amount_cents is a conditional-required violation -> ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/donations", payload: { donation_type: "MONETARY" }, as: IntakeVolunteer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION"
      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds: [entities.FixerSkill.fields.fixer_id, entities.RepairItem.fields.event_id]
        distinguishing_aspect: "Children are discoverable from parent ids via filtered list GETs (fixer-skills?fixer_id=, repair-items?event_id=), returning arrays."
        test_recipe:
          setup: ["one event, one fixer with one skill"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Chi", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "BIKE", level: 2 }, as: Coordinator, captures: { sk: $.data.id } }
          trigger:
            - { call: "GET /api/fixer-skills?fixer_id=${fx}", as: Coordinator }
            - { call: "GET /api/repair-items?event_id=${ev}", as: Coordinator }
          assert:
            - "GET fixer-skills?fixer_id returns array containing exactly FixerSkill.${sk}"
            - "GET repair-items?event_id returns an empty array (total_count == 0)"

  - section: state_machines
    instances:
      - name: start_repair_from_queued_returns_invalid_item_state
        claim_type: invalid_transition
        grounds: [state_machines.RepairItem.ASSIGNED_to_IN_REPAIR, "errors[ERR_INVALID_ITEM_STATE]"]
        distinguishing_aspect: "start-repair is only declared from ASSIGNED; from QUEUED it MUST fail with ERR_INVALID_ITEM_STATE and no side effects."
        test_recipe:
          setup: ["Event INTAKE_OPEN; item QUEUED; fixer F checked in"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Psi", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Fan", weight_kg_estimated: 1.1 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 2, estimated_difficulty: 1, diagnosis: "switch", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
          trigger:
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ITEM_STATE; RepairItem.${it}.status stays QUEUED"
      - name: outcome_verify_twice_returns_invalid_outcome_state
        claim_type: idempotency
        grounds: [state_machines.RepairOutcome.RECORDED_to_VERIFIED, "errors[ERR_INVALID_OUTCOME_STATE]"]
        distinguishing_aspect: "Second verify of an already-VERIFIED outcome fails with ERR_INVALID_OUTCOME_STATE; verified_by_user_id unchanged."
        test_recipe:
          setup: ["Full repair flow: item VERIFIED via coordinator"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Omega", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Kettle", weight_kg_estimated: 1.5 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 2, estimated_difficulty: 1, diagnosis: "element", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/outcomes", payload: { outcome: "FIXED", weight_kg_actual: 1.4 }, as: Fixer, as_user_id: "${fx}", captures: { oc: $.data.id } }
            - { call: "POST /api/repair-outcomes/${oc}/verify", as: Coordinator }
          trigger:
            - { call: "POST /api/repair-outcomes/${oc}/verify", as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_OUTCOME_STATE; RepairOutcome.${oc}.verification_status stays VERIFIED"
      - name: withdraw_verified_item_returns_invalid_item_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RepairItem]
        distinguishing_aspect: "VERIFIED is terminal: withdraw (and any other action) MUST fail with ERR_INVALID_ITEM_STATE."
        test_recipe:
          setup: ["Item fully VERIFIED (same chain as outcome_verify_twice)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Alef", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Lamp", weight_kg_estimated: 0.9 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 2, estimated_difficulty: 1, diagnosis: "plug", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/outcomes", payload: { outcome: "FIXED" }, as: Fixer, as_user_id: "${fx}", captures: { oc: $.data.id } }
            - { call: "POST /api/repair-outcomes/${oc}/verify", as: Coordinator }
          trigger:
            - { call: "POST /api/repair-items/${it}/withdraw", as: IntakeVolunteer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ITEM_STATE; RepairItem.${it}.status stays VERIFIED"
      - name: event_close_with_nonterminal_items_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RepairEvent.REPAIR_ACTIVE_to_CLOSED, "errors[ERR_EVENT_NOT_CLOSABLE]"]
        distinguishing_aspect: "Close requires every item terminal; one QUEUED item blocks it with ERR_EVENT_NOT_CLOSABLE."
        test_recipe:
          setup: ["Event REPAIR_ACTIVE; one item QUEUED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Bet", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Mixer", weight_kg_estimated: 2.2 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 2, estimated_difficulty: 1, diagnosis: "gear", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/begin-repairs", as: Coordinator }
          trigger:
            - { call: "POST /api/repair-events/${ev}/close", as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_CLOSABLE; RepairEvent.${ev}.status stays REPAIR_ACTIVE"
      - name: waiver_revoke_non_active_returns_invalid_waiver_state
        claim_type: invalid_transition
        grounds: [state_machines.Waiver.ACTIVE_to_REVOKED, "errors[ERR_INVALID_WAIVER_STATE]"]
        distinguishing_aspect: "Second revoke of a REVOKED waiver fails with ERR_INVALID_WAIVER_STATE."
        test_recipe:
          setup: ["visitor with an ACTIVE waiver, then revoked once"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer, captures: { wv: $.data.id } }
            - { call: "POST /api/waivers/${wv}/revoke", as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /api/waivers/${wv}/revoke", as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_WAIVER_STATE; Waiver.${wv}.status stays REVOKED"
      - name: incident_resolve_segregation_of_duties
        claim_type: precondition_enforcement
        grounds: [state_machines.SafetyIncident.REPORTED_to_RESOLVED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The reporting SafetyOfficer (X-User-ID so-1) cannot resolve their own incident; a different SafetyOfficer (so-2) can."
        test_recipe:
          setup: ["event exists; incident reported by SafetyOfficer so-1"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Gimel", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
