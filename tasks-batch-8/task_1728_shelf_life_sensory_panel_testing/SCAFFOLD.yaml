# =============================================================================
# Scaffold: Shelf-Life & Sensory Panel Testing (sensory testing lab)
# =============================================================================

scenario: |
  Shelf-Life & Sensory Panel Testing (sensory testing lab): study design
  (real-time vs accelerated) & sampling schedule, panel recruitment/screening
  & training, attribute scoring & statistical significance, microbial/chemical
  endpoint correlation, date-code assignment recommendation, packaging variable
  comparison, client report & claim support, retain sample storage

domain_name: shelf-life-sensory-testing
api_prefix: /sensory-lab

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer entities joined by FK references; no nested URL paths
  state_machine_shape: cyclic    # Study ANALYSIS->IN_PROGRESS reopen loop; SampleUnit STORED->CHECKED_OUT->STORED; StudyReport revision loop; Panelist QUALIFIED<->INACTIVE
  relationship_patterns:
    - one_to_many                # Study -> StudyArm / SamplingTimePoint / EvaluationSession ...
    - many_to_many               # Panelist x EvaluationSession via PanelAssignment
    - self_referential           # EvaluationSession.makeup_of_id -> EvaluationSession.id
    - cross_aggregate            # StudyReport pins DateCodeRecommendation; LabTestResult spans Study/Arm/TimePoint
  role_model: segregation_of_duties   # report author may not QA-approve or verify claims on own report
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client company name" }
      - { name: contact_email, type: string, source: input, description: "Client contact email; unique across clients", constraints: "unique; valid email shape else ERR_INVALID_REQUEST" }
      - { name: tier, type: enum, source: input, description: "Service tier", constraints: "STANDARD | PREMIUM", default: STANDARD }
      - { name: retainer_hours_balance, type: number, source: computed, default: 0, description: "Prepaid lab hours available; debited at study activation, refunded/settled at abort or release" }
      - { name: active_study_count, type: integer, source: computed, default: 0, description: "Count of Studies with status in {SCHEDULED, IN_PROGRESS, ANALYSIS, REPORTING}" }

  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> ClientAccount.id; owning client" }
      - { name: product_name, type: string, source: input, description: "Product under test" }
      - { name: study_type, type: enum, source: input, description: "REAL_TIME | ACCELERATED" }
      - { name: storage_temp_c, type: number, source: input, description: "Storage temperature Celsius of the test chambers" }
      - { name: reference_temp_c, type: number, source: input, default: 20, description: "Reference (ambient control) temperature used by Q10 projection" }
      - { name: q10_factor, type: number, source: input, default: 2.0, description: "Q10 acceleration factor; required > 1.0 when study_type=ACCELERATED" }
      - { name: target_shelf_life_days, type: integer, source: input, description: "Claimed/target shelf life used as fallback when no endpoint trips" }
      - { name: sensory_fail_threshold, type: number, source: input, description: "OVERALL attribute mean at or below which the sensory endpoint trips (direction AT_OR_BELOW, inclusive)" }
      - { name: min_detectable_difference, type: number, source: input, description: "delta used by session power sizing and significance screening" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned start date" }
      - { name: actual_start_utc, type: datetime, source: system, description: "Logical-clock timestamp captured at activation; null until IN_PROGRESS" }
      - { name: reserved_hours_escrow, type: number, source: computed, default: 0, description: "Lab hours held in escrow from client retainer while study is active" }
      - { name: consumed_hours, type: number, source: computed, default: 0, description: "Final settled lab hours at completion (per retainer_hours_settlement)" }
      - { name: earliest_failure_day_equiv, type: number, source: computed, description: "min over arms of StudyArm.computed_failure_day_equiv; null when no arm has tripped" }
      - { name: status, type: enum, source: system, description: "DRAFT | DESIGN_REVIEW | SCHEDULED | IN_PROGRESS | ANALYSIS | REPORTING | COMPLETED | ABORTED" }

  - name: StudyArm
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: packaging_variant, type: enum, source: input, description: "STANDARD_FILM | HIGH_BARRIER | MAP | VACUUM" }
      - { name: is_control, type: boolean, source: input, default: false, description: "Exactly one control arm per study" }
      - { name: computed_failure_day_equiv, type: number, source: computed, description: "Earliest tripped endpoint day for this arm in real-time-equivalent days; null when nothing tripped" }

  - name: SamplingTimePoint
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: day_index, type: integer, source: input, description: "Study day of the pull (>= 0); unique within study" }
      - { name: status, type: enum, source: system, description: "PENDING | PULLED | EVALUATED | CLOSED | SKIPPED" }

  - name: StorageChamber
    parent: null
    common_fields: true
    fields:
      - { name: chamber_code, type: string, source: input, description: "Unique chamber code" }
      - { name: temp_c, type: number, source: input, description: "Chamber temperature Celsius" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum concurrently stored sample units (> 0)" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Count of SampleUnits with this chamber_id and status in {STORED, CHECKED_OUT}" }

  - name: SampleUnit
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; copied from the pulled time point" }
      - { name: arm_id, type: string, source: system, description: "FK -> StudyArm.id; copied from pull input" }
      - { name: chamber_id, type: string, source: system, description: "FK -> StorageChamber.id; copied from pull input" }
      - { name: time_point_id, type: string, source: system, description: "FK -> SamplingTimePoint.id; the pull's time point" }
      - { name: unit_purpose, type: enum, source: system, description: "EVALUATION | RETAIN; copied from pull input" }
      - { name: session_id, type: string, source: system, description: "EvaluationSession.id this unit was checked out for; null while STORED", constraints: "nullable; set at checkout, cleared at return/consume/discard" }
      - { name: retention_until_utc, type: datetime, source: system, description: "Set on RETAIN units when the study completes: completed_utc + 90 days; null before", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "STORED | CHECKED_OUT | CONSUMED | DISCARDED | EXPIRED" }

  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Panelist name" }
      - { name: email, type: string, source: input, description: "Unique email", constraints: "unique; else ERR_EMAIL_NOT_UNIQUE" }
      - { name: qualified_attributes, type: array, source: input, description: "Attribute enums the panelist is qualified to score; subset of [APPEARANCE, AROMA, FLAVOR, TEXTURE, OFF_FLAVOR, OVERALL]" }
      - { name: screening_acuity_score, type: number, source: system, description: "Recorded at screening; null until record-screening" }
      - { name: training_sessions_completed, type: integer, source: system, default: 0, description: "Training counter; QUALIFIED requires >= 3" }
      - { name: consecutive_no_shows, type: integer, source: system, default: 0, description: "Reset to 0 on any SUBMITTED assignment; >= 3 triggers auto-suspension" }
      - { name: consistency_index_provisional, type: number, source: computed, description: "Provisional variant of panelist_consistency_index (LOCKED+ANALYZED sessions, own-score-inclusive mean); null until first scored session locks" }
      - { name: consistency_index_final, type: number, source: computed, description: "Final variant (ANALYZED sessions only, leave-one-out panel mean); null until first ANALYZED session" }
      - { name: status, type: enum, source: system, description: "APPLIED | TRAINING | QUALIFIED | INACTIVE | SUSPENDED | SCREENED_OUT" }

  - name: EvaluationSession
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: time_point_id, type: string, source: input, description: "FK -> SamplingTimePoint.id" }
      - { name: arm_id, type: string, source: input, description: "FK -> StudyArm.id" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Session window start (half-open interval start)" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Session window end (half-open interval end); must be > start" }
      - { name: makeup_of_id, type: string, source: system, description: "FK -> EvaluationSession.id; set only on sessions created by schedule-makeup", constraints: "nullable" }
      - { name: required_panelist_count, type: integer, source: computed, description: "Quorum sized by required_panelist_count calculation at creation" }
      - { name: overall_mean, type: number, source: computed, description: "Mean of OVERALL scores over SUBMITTED assignments; set at lock" }
      - { name: significance_delta, type: number, source: computed, description: "1.96 * 1.5 * sqrt(1/n_arm + 1/n_ctrl) at lock when the control session for the same time point is LOCKED/ANALYZED; null otherwise" }
      - { name: sensory_failed, type: boolean, source: computed, default: false, description: "True when overall_mean <= study.sensory_fail_threshold AND |mean - control_mean| >= significance_delta" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | LOCKED | ANALYZED | CANCELLED" }

  - name: PanelAssignment
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> EvaluationSession.id" }
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | SUBMITTED | NO_SHOW | EXCUSED" }

  - name: AttributeScore
    parent: null
    common_fields: false   # immutable event: id + created_at only
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> PanelAssignment.id" }
      - { name: attribute, type: enum, source: input, description: "APPEARANCE | AROMA | FLAVOR | TEXTURE | OFF_FLAVOR | OVERALL" }
      - { name: score, type: integer, source: input, description: "1..15 inclusive on the 15-point attribute scale" }

  - name: LabTestResult
    parent: null
    common_fields: false   # immutable event: id + created_at only
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: arm_id, type: string, source: input, description: "FK -> StudyArm.id" }
      - { name: time_point_id, type: string, source: input, description: "FK -> SamplingTimePoint.id" }
      - { name: test_type, type: enum, source: input, description: "APC | YEAST_MOLD | LACTIC | PEROXIDE_VALUE | PH | WATER_ACTIVITY" }
      - { name: measured_value, type: number, source: input, description: "Measured value in the test type's canonical unit" }
      - { name: tripped, type: boolean, source: computed, default: false, description: "True when the value violates the global MICRO_LIMITS/CHEM_LIMITS entry for test_type (inclusive boundary)" }

  - name: DateCodeRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: arm_id, type: string, source: input, description: "FK -> StudyArm.id" }
      - { name: basis, type: enum, source: computed, description: "ENDPOINT_MIN when the arm has a computed failure day, TARGET_FALLBACK otherwise" }
      - { name: computed_days, type: integer, source: computed, description: "Recommended shelf-life days per date_code_recommendation calculation" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: StudyReport
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating SensoryScientist (opaque id); used by segregation-of-duties checks" }
      - { name: pinned_recommendation_id, type: string, source: system, description: "FK -> DateCodeRecommendation.id; attached while DRAFT; null until attach-recommendation", constraints: "nullable" }
      - { name: snapshot_days, type: integer, source: computed, description: "Pinned recommendation's computed_days captured at submit; null until INTERNAL_REVIEW", constraints: "nullable" }
      - { name: requires_revision, type: boolean, source: computed, default: false, description: "Set true when the pinned recommendation is superseded while report is non-terminal" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on every return/request-changes/auto-revert into DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | INTERNAL_REVIEW | CLIENT_REVIEW | RELEASED | REJECTED" }

  - name: ClaimSubstantiation
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> StudyReport.id" }
      - { name: claim_type, type: enum, source: input, description: "SHELF_LIFE_DAYS | PACKAGING_SUPERIORITY" }
      - { name: claim_text, type: string, source: input, description: "Free-text marketing claim" }
      - { name: claimed_value, type: number, source: input, description: "Days for SHELF_LIFE_DAYS; percent (e.g. 25 means 25%) for PACKAGING_SUPERIORITY" }
      - { name: verdict, type: enum, source: system, description: "PENDING | SUPPORTED | NOT_SUPPORTED | INSUFFICIENT_DATA" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the verifying QAOfficer; null while PENDING", constraints: "nullable" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Study
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: DRAFT
        to: DESIGN_REVIEW
        trigger: "POST /sensory-lab/studies/{id}/submit-design"
        actor: SensoryScientist
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STUDY_STATE)"
          - "at least one StudyArm exists for the study (else ERR_NO_ARMS_DEFINED)"
          - "exactly one StudyArm with is_control == true (else ERR_NO_CONTROL_ARM)"
          - "at least one SamplingTimePoint exists for the study (else ERR_NO_TIME_POINTS)"
        side_effects: []

      - from: DESIGN_REVIEW
        to: SCHEDULED
        trigger: "POST /sensory-lab/studies/{id}/approve-design"
        actor: LabDirector
        preconditions:
          - "status == DESIGN_REVIEW (else ERR_INVALID_STUDY_STATE)"
        side_effects: []

      - from: DESIGN_REVIEW
        to: DRAFT
        trigger: "POST /sensory-lab/studies/{id}/reject-design"
        actor: LabDirector
        preconditions:
          - "status == DESIGN_REVIEW (else ERR_INVALID_STUDY_STATE)"
        side_effects: []

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sensory-lab/studies/{id}/activate"
        actor: SensoryScientist
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STUDY_STATE)"
          - "client.retainer_hours_balance >= reserved_hours_required = 10 + 2*(count of SamplingTimePoints) + 4*(count of StudyArms) (else ERR_INSUFFICIENT_RETAINER_HOURS, business_fiscal, checked LAST after state)"
        side_effects:
          - "actual_start_utc = current logical clock"
          - "ClientAccount.retainer_hours_balance -= reserved_hours_required"
          - "Study.reserved_hours_escrow = reserved_hours_required"
          - "ClientAccount.active_study_count += 1"

      - from: IN_PROGRESS
        to: ANALYSIS
        trigger: "POST /sensory-lab/studies/{id}/close-fieldwork"
        actor: SensoryScientist
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_STUDY_STATE)"
          - "every SamplingTimePoint of the study is in {EVALUATED, CLOSED, SKIPPED} (else ERR_OPEN_TIME_POINTS_REMAIN)"
          - "every EvaluationSession of the study is in {ANALYZED, CANCELLED} (else ERR_SESSIONS_STILL_OPEN)"
        side_effects: []

      - from: ANALYSIS
        to: IN_PROGRESS
        trigger: "POST /sensory-lab/studies/{id}/reopen-fieldwork"
        actor: SensoryScientist
        preconditions:
          - "status == ANALYSIS (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "allows new SamplingTimePoints with day_index greater than the current study day"
        note: "cyclic re-entry: IN_PROGRESS -> ANALYSIS -> IN_PROGRESS is legal; each re-entry permits extending the sampling schedule"

      - from: ANALYSIS
        to: REPORTING
        trigger: "system (automatic when a DateCodeRecommendation is accepted and every StudyArm of the study then has at least one ACCEPTED recommendation)"
        actor: system
        preconditions:
          - "status == ANALYSIS"
          - "every StudyArm of the study has at least one ACCEPTED DateCodeRecommendation"
        side_effects: []

      - from: REPORTING
        to: COMPLETED
        trigger: "system (automatic when a StudyReport for this study transitions to RELEASED)"
        actor: system
        preconditions:
          - "status == REPORTING"
        side_effects:
          - "every SampleUnit of the study with unit_purpose == RETAIN and status in {STORED, CHECKED_OUT} gets retention_until_utc = current logical clock + 90 days"
          - "retainer_hours_settlement runs: consumed_hours finalized; ClientAccount.retainer_hours_balance += (reserved_hours_escrow - consumed_hours); reserved_hours_escrow = 0"
          - "ClientAccount.active_study_count -= 1"

      - from: DRAFT
        to: ABORTED
        trigger: "POST /sensory-lab/studies/{id}/abort"
        actor: LabDirector
        preconditions:
          - "status in {DRAFT, DESIGN_REVIEW, SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "ClientAccount.retainer_hours_balance += reserved_hours_escrow; reserved_hours_escrow = 0"
          - "if status was in {SCHEDULED, IN_PROGRESS}: ClientAccount.active_study_count -= 1"
          - "all EvaluationSessions of the study in {PLANNED, OPEN} -> CANCELLED; their PanelAssignments in ASSIGNED -> EXCUSED"
          - "all SampleUnits of the study in {STORED, CHECKED_OUT} -> DISCARDED (chamber reserved_units recomputed)"
          - "all DateCodeRecommendations of the study in {PROPOSED, ACCEPTED} -> SUPERSEDED"

      - from: DESIGN_REVIEW
        to: ABORTED
        trigger: "POST /sensory-lab/studies/{id}/abort"
        actor: LabDirector
        preconditions:
          - "status in {DRAFT, DESIGN_REVIEW, SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "all DateCodeRecommendations of the study in {PROPOSED, ACCEPTED} -> SUPERSEDED"

      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /sensory-lab/studies/{id}/abort"
        actor: LabDirector
        preconditions:
          - "status in {DRAFT, DESIGN_REVIEW, SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "ClientAccount.retainer_hours_balance += reserved_hours_escrow; reserved_hours_escrow = 0"
          - "ClientAccount.active_study_count -= 1"
          - "all EvaluationSessions in {PLANNED, OPEN} -> CANCELLED; their ASSIGNED PanelAssignments -> EXCUSED"
          - "all SampleUnits in {STORED, CHECKED_OUT} -> DISCARDED"
          - "all DateCodeRecommendations in {PROPOSED, ACCEPTED} -> SUPERSEDED"

      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /sensory-lab/studies/{id}/abort"
        actor: LabDirector
        preconditions:
          - "status in {DRAFT, DESIGN_REVIEW, SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "ClientAccount.retainer_hours_balance += reserved_hours_escrow; reserved_hours_escrow = 0"
          - "ClientAccount.active_study_count -= 1"
          - "all EvaluationSessions in {PLANNED, OPEN} -> CANCELLED; their ASSIGNED PanelAssignments -> EXCUSED"
          - "all SampleUnits in {STORED, CHECKED_OUT} -> DISCARDED"
          - "all DateCodeRecommendations in {PROPOSED, ACCEPTED} -> SUPERSEDED"

  - entity: StudyArm
    initial_state: null
    terminal_states: []
    transitions: []
    note: "StudyArm is stateless; its computed_failure_day_equiv mutates via cascades from EvaluationSession.lock and LabTestResult creation. Arms may only be created while the study is DRAFT."

  - entity: SamplingTimePoint
    initial_state: PENDING
    terminal_states: [CLOSED, SKIPPED]
    transitions:
      - from: PENDING
        to: PULLED
        trigger: "POST /sensory-lab/sampling-time-points/{id}/pull"
        actor: SensoryScientist
        preconditions:
          - "status in {PENDING, PULLED} (else ERR_INVALID_TIME_POINT_STATE)"
          - "study status == IN_PROGRESS (else ERR_INVALID_STUDY_STATE)"
          - "current study day d = floor((clock - study.actual_start_utc)/86400) satisfies day_index <= d <= day_index + 2 (else ERR_PULL_WINDOW_VIOLATION, business_temporal)"
          - "chamber.temp_c == study.storage_temp_c (else ERR_CHAMBER_TEMP_MISMATCH, business_referential)"
          - "chamber.reserved_units + quantity <= chamber.capacity_units (else ERR_CHAMBER_CAPACITY_EXCEEDED; equality is allowed)"
          - "arm belongs to the same study (else ERR_ARM_STUDY_MISMATCH)"
        side_effects:
          - "create `quantity` SampleUnits with unit_purpose from input, status STORED, chamber/arm/time-point/study from context"
          - "chamber.reserved_units += quantity"
          - "time point status -> PULLED (no-op when already PULLED; further pulls for other arms stay legal)"

      - from: PULLED
        to: EVALUATED
        trigger: "system (automatic on EvaluationSession ANALYZED when every non-CANCELLED session of this time point is ANALYZED and at least one is ANALYZED)"
        actor: system
        preconditions:
          - "status == PULLED"
          - "every EvaluationSession with this time_point_id is in {ANALYZED, CANCELLED} and at least one is ANALYZED"
        side_effects: []

      - from: EVALUATED
        to: CLOSED
        trigger: "POST /sensory-lab/sampling-time-points/{id}/close"
        actor: SensoryScientist
        preconditions:
          - "status == EVALUATED (else ERR_INVALID_TIME_POINT_STATE)"
        side_effects: []

      - from: PENDING
        to: SKIPPED
        trigger: "POST /sensory-lab/sampling-time-points/{id}/skip"
        actor: SensoryScientist
        preconditions:
          - "status in {PENDING, PULLED} (else ERR_INVALID_TIME_POINT_STATE)"
          - "study status == IN_PROGRESS (else ERR_INVALID_STUDY_STATE)"
        side_effects: []

      - from: PULLED
        to: SKIPPED
        trigger: "POST /sensory-lab/sampling-time-points/{id}/skip"
        actor: SensoryScientist
        preconditions:
          - "status in {PENDING, PULLED} (else ERR_INVALID_TIME_POINT_STATE)"
          - "study status == IN_PROGRESS (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "SampleUnits of this time point with unit_purpose == EVALUATION and status in {STORED, CHECKED_OUT} -> DISCARDED (chamber reserved_units recomputed); RETAIN units are preserved for the retention window"
        note: "PULLED -> SKIPPED abandons an already-pulled point; EVALUATED points are closed, not skipped"

  - entity: SampleUnit
    initial_state: STORED
    terminal_states: [CONSUMED, DISCARDED, EXPIRED]
    transitions:
      - from: STORED
        to: CHECKED_OUT
        trigger: "POST /sensory-lab/sample-units/{id}/checkout"
        actor: PanelCoordinator
        preconditions:
          - "status == STORED (else ERR_INVALID_SAMPLE_STATE)"
          - "when unit_purpose == EVALUATION, input session_id is required and must reference an EvaluationSession of the same study in {PLANNED, OPEN} (else ERR_INVALID_SESSION_STATE)"
        side_effects:
          - "session_id set from input (RETAIN units may omit it)"

      - from: CHECKED_OUT
        to: STORED
        trigger: "POST /sensory-lab/sample-units/{id}/return"
        actor: PanelCoordinator
        preconditions:
          - "status == CHECKED_OUT (else ERR_INVALID_SAMPLE_STATE)"
        side_effects:
          - "session_id cleared"
        note: "cyclic: STORED -> CHECKED_OUT -> STORED may repeat; reserved_units counts {STORED, CHECKED_OUT} so the loop is occupancy-neutral"

      - from: CHECKED_OUT
        to: CONSUMED
        trigger: "POST /sensory-lab/sample-units/{id}/consume"
        actor: PanelCoordinator
        preconditions:
          - "status == CHECKED_OUT (else ERR_INVALID_SAMPLE_STATE)"
        side_effects:
          - "session_id cleared"
          - "chamber.reserved_units -= 1"

      - from: STORED
        to: DISCARDED
        trigger: "POST /sensory-lab/sample-units/{id}/discard"
        actor: LabDirector
        preconditions:
          - "status in {STORED, CHECKED_OUT} (else ERR_INVALID_SAMPLE_STATE)"
        side_effects:
          - "session_id cleared; chamber.reserved_units -= 1"

      - from: CHECKED_OUT
        to: DISCARDED
        trigger: "POST /sensory-lab/sample-units/{id}/discard"
        actor: LabDirector
        preconditions:
          - "status in {STORED, CHECKED_OUT} (else ERR_INVALID_SAMPLE_STATE)"
        side_effects:
          - "session_id cleared; chamber.reserved_units -= 1"

      - from: STORED
        to: EXPIRED
        trigger: "system via POST /sensory-lab/retain-sweeps (expires every RETAIN unit with retention_until_utc set and retention_until_utc < current logical clock)"
        actor: LabDirector
        preconditions:
          - "unit_purpose == RETAIN and retention_until_utc != null and retention_until_utc < clock"
          - "status == STORED"
        side_effects:
          - "chamber.reserved_units -= 1 per expired unit"

  - entity: Panelist
    initial_state: APPLIED
    terminal_states: [SCREENED_OUT]
    transitions:
      - from: APPLIED
        to: TRAINING
        trigger: "POST /sensory-lab/panelists/{id}/record-screening"
        actor: PanelCoordinator
        preconditions:
          - "status == APPLIED (else ERR_INVALID_PANELIST_STATE)"
        side_effects:
          - "screening_acuity_score set from input"
        note: "branching on score: acuity_score >= 80 -> TRAINING; < 80 -> SCREENED_OUT (inclusive threshold)"

      - from: APPLIED
        to: SCREENED_OUT
        trigger: "POST /sensory-lab/panelists/{id}/record-screening"
        actor: PanelCoordinator
        preconditions:
          - "status == APPLIED (else ERR_INVALID_PANELIST_STATE)"
          - "acuity_score < 80"
        side_effects:
          - "screening_acuity_score set from input"

      - from: TRAINING
        to: QUALIFIED
        trigger: "POST /sensory-lab/panelists/{id}/record-training (auto when training_sessions_completed reaches 3)"
        actor: PanelCoordinator
        preconditions:
          - "status == TRAINING (else ERR_INVALID_PANELIST_STATE)"
        side_effects:
          - "training_sessions_completed += 1; when the new value >= 3 the status flips to QUALIFIED in the same request"

      - from: QUALIFIED
        to: INACTIVE
        trigger: "POST /sensory-lab/panelists/{id}/deactivate"
        actor: PanelCoordinator
        preconditions:
          - "status == QUALIFIED (else ERR_INVALID_PANELIST_STATE)"
        side_effects: []

      - from: INACTIVE
        to: QUALIFIED
        trigger: "POST /sensory-lab/panelists/{id}/reactivate"
        actor: PanelCoordinator
        preconditions:
          - "status == INACTIVE (else ERR_INVALID_PANELIST_STATE)"
          - "consistency_index_final == null OR consistency_index_final >= 60 (else the transition targets TRAINING instead)"
        side_effects: []
        note: "branching on computed field: index < 60 routes to TRAINING (remedial), >= 60 or null routes to QUALIFIED"

      - from: INACTIVE
        to: TRAINING
        trigger: "POST /sensory-lab/panelists/{id}/reactivate"
        actor: PanelCoordinator
        preconditions:
          - "status == INACTIVE"
          - "consistency_index_final != null and consistency_index_final < 60"
        side_effects:
          - "training_sessions_completed reset to 0"

      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (automatic when consecutive_no_shows reaches 3)"
        actor: system
        preconditions:
          - "status == QUALIFIED"
        side_effects:
          - "all other PanelAssignments of this panelist in ASSIGNED whose session is in {PLANNED, OPEN} -> EXCUSED"

      - from: SUSPENDED
        to: TRAINING
        trigger: "POST /sensory-lab/panelists/{id}/assign-remedial"
        actor: PanelCoordinator
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_PANELIST_STATE)"
        side_effects:
          - "training_sessions_completed reset to 0; consecutive_no_shows reset to 0"

  - entity: EvaluationSession
    initial_state: PLANNED
    terminal_states: [ANALYZED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /sensory-lab/evaluation-sessions/{id}/open"
        actor: PanelCoordinator
        preconditions:
          - "status == PLANNED (else ERR_INVALID_SESSION_STATE)"
          - "study status == IN_PROGRESS (else ERR_INVALID_STUDY_STATE)"
          - "at least one SampleUnit exists with this time_point_id and arm_id (else ERR_NO_PULLED_SAMPLES)"
          - "clock within [scheduled_start_utc - 30 minutes, scheduled_end_utc] (else ERR_OUTSIDE_SESSION_WINDOW, business_temporal)"
        side_effects: []

      - from: OPEN
        to: LOCKED
        trigger: "POST /sensory-lab/evaluation-sessions/{id}/lock"
        actor: PanelCoordinator
        preconditions:
          - "status == OPEN (else ERR_INVALID_SESSION_STATE)"
          - "count of SUBMITTED assignments >= required_panelist_count (else ERR_SESSION_UNDER_QUORUM; equality passes)"
        side_effects:
          - "overall_mean = mean of OVERALL scores over SUBMITTED assignments (attribute_mean_score, 2dp round_half_up)"
          - "significance_delta computed when the control-arm session for the same time point is LOCKED or ANALYZED (else null)"
          - "sensory_failed evaluated per sensory_criterion_evaluation"
          - "consistency_index_provisional recomputed for every panelist with a SUBMITTED assignment in this session (panelist_consistency_index PROVISIONAL variant)"
          - "when sensory_failed flips the arm's earliest endpoint earlier: StudyArm.computed_failure_day_equiv recomputed (shelf_life_equivalent_days), Study.earliest_failure_day_equiv recomputed"
          - "any DateCodeRecommendation for this arm in {PROPOSED, ACCEPTED} -> SUPERSEDED when the arm failure day changed"
          - "StudyReports pinned to a superseded recommendation: DRAFT/INTERNAL_REVIEW get requires_revision = true; CLIENT_REVIEW -> DRAFT with requires_revision = true and revision_count += 1"

      - from: LOCKED
        to: ANALYZED
        trigger: "POST /sensory-lab/evaluation-sessions/{id}/analyze"
        actor: SensoryScientist
        preconditions:
          - "status == LOCKED (else ERR_INVALID_SESSION_STATE)"
        side_effects:
          - "consistency_index_final recomputed for every panelist with a SUBMITTED assignment in this session"
          - "time point bubble-up check for PULLED -> EVALUATED"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sensory-lab/evaluation-sessions/{id}/cancel"
        actor: PanelCoordinator
        preconditions:
          - "status in {PLANNED, OPEN} (else ERR_INVALID_SESSION_STATE)"
        side_effects:
          - "PanelAssignments of this session in ASSIGNED -> EXCUSED (SUBMITTED assignments are preserved as records)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /sensory-lab/evaluation-sessions/{id}/cancel"
        actor: PanelCoordinator
        preconditions:
          - "status in {PLANNED, OPEN} (else ERR_INVALID_SESSION_STATE)"
        side_effects:
          - "PanelAssignments of this session in ASSIGNED -> EXCUSED"

      - from: CANCELLED
        to: PLANNED
        trigger: "POST /sensory-lab/evaluation-sessions/{id}/schedule-makeup (creates a NEW session; the source stays CANCELLED)"
        actor: PanelCoordinator
        preconditions:
          - "source session status == CANCELLED (else ERR_INVALID_SESSION_STATE)"
        side_effects:
          - "new EvaluationSession created in PLANNED copying study_id/time_point_id/arm_id, makeup_of_id = source id, fresh required_panelist_count"
        note: "self-referential lineage; not a state revert on the source row"

  - entity: PanelAssignment
    initial_state: ASSIGNED
    terminal_states: [SUBMITTED, NO_SHOW, EXCUSED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "system (automatic when the 6th distinct attribute score is recorded for the assignment)"
        actor: system
        preconditions:
          - "status == ASSIGNED"
          - "assignment now holds scores for all 6 attributes"
        side_effects:
          - "panelist.consecutive_no_shows = 0"

      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /sensory-lab/panel-assignments/{id}/mark-no-show"
        actor: PanelCoordinator
        preconditions:
          - "status == ASSIGNED (else ERR_INVALID_ASSIGNMENT_STATE)"
          - "session status == OPEN (else ERR_INVALID_SESSION_STATE)"
        side_effects:
          - "panelist.consecutive_no_shows += 1"
          - "when consecutive_no_shows >= 3 and panelist status == QUALIFIED: panelist -> SUSPENDED, then this panelist's other ASSIGNED assignments on sessions in {PLANNED, OPEN} -> EXCUSED"

      - from: ASSIGNED
        to: EXCUSED
        trigger: "POST /sensory-lab/panel-assignments/{id}/excuse (or cascade: session cancel / study abort / panelist suspension)"
        actor: PanelCoordinator
        preconditions:
          - "status == ASSIGNED (else ERR_INVALID_ASSIGNMENT_STATE)"
        side_effects: []

  - entity: DateCodeRecommendation
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /sensory-lab/date-code-recommendations/{id}/accept"
        actor: SensoryScientist
        preconditions:
          - "status == PROPOSED (else ERR_RECO_NOT_PROPOSED)"
          - "study status in {ANALYSIS, REPORTING} (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "when every StudyArm of the study then has >= 1 ACCEPTED recommendation and study status == ANALYSIS: study -> REPORTING"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /sensory-lab/date-code-recommendations/{id}/reject"
        actor: SensoryScientist
        preconditions:
          - "status == PROPOSED (else ERR_RECO_NOT_PROPOSED)"
        side_effects: []

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a new PROPOSED recommendation is created for the same arm; or the arm's computed_failure_day_equiv changed; or the study aborted)"
        actor: system
        preconditions: []
        side_effects:
          - "StudyReports pinned to this recommendation: DRAFT/INTERNAL_REVIEW -> requires_revision = true; CLIENT_REVIEW -> DRAFT with requires_revision = true and revision_count += 1"

      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (the arm's computed_failure_day_equiv changed after a later endpoint trip; or the study aborted)"
        actor: system
        preconditions: []
        side_effects:
          - "StudyReports pinned to this recommendation: DRAFT/INTERNAL_REVIEW -> requires_revision = true; CLIENT_REVIEW -> DRAFT with requires_revision = true and revision_count += 1"

  - entity: StudyReport
    initial_state: DRAFT
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: DRAFT
        to: INTERNAL_REVIEW
        trigger: "POST /sensory-lab/study-reports/{id}/submit"
        actor: SensoryScientist
        preconditions:
          - "status == DRAFT (else ERR_INVALID_REPORT_STATE)"
          - "acting user == author_user_id (else ERR_FORBIDDEN_ROLE)"
          - "pinned_recommendation_id != null and that recommendation is ACCEPTED (else ERR_NO_ACCEPTED_RECOMMENDATION)"
          - "requires_revision == false (else ERR_REPORT_REQUIRES_REVISION)"
        side_effects:
          - "snapshot_days = pinned recommendation's computed_days (version-pinned at submit)"

      - from: INTERNAL_REVIEW
        to: CLIENT_REVIEW
        trigger: "POST /sensory-lab/study-reports/{id}/qa-approve"
        actor: QAOfficer
        preconditions:
          - "status == INTERNAL_REVIEW (else ERR_INVALID_REPORT_STATE)"
          - "acting QAOfficer X-User-ID != author_user_id (else ERR_SEGREGATION_OF_DUTIES, business_safety)"
          - "requires_revision == false (else ERR_REPORT_REQUIRES_REVISION)"
        side_effects: []

      - from: INTERNAL_REVIEW
        to: DRAFT
        trigger: "POST /sensory-lab/study-reports/{id}/qa-return"
        actor: QAOfficer
        preconditions:
          - "status == INTERNAL_REVIEW (else ERR_INVALID_REPORT_STATE)"
        side_effects:
          - "revision_count += 1"

      - from: CLIENT_REVIEW
        to: DRAFT
        trigger: "POST /sensory-lab/study-reports/{id}/request-changes"
        actor: Client
        preconditions:
          - "status == CLIENT_REVIEW (else ERR_INVALID_REPORT_STATE)"
          - "acting Client X-User-ID == the study's client_id (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "requires_revision = false; revision_count += 1"

      - from: CLIENT_REVIEW
        to: RELEASED
        trigger: "POST /sensory-lab/study-reports/{id}/release"
        actor: LabDirector
        preconditions:
          - "status == CLIENT_REVIEW (else ERR_INVALID_REPORT_STATE)"
          - "requires_revision == false (else ERR_REPORT_REQUIRES_REVISION)"
          - "every ClaimSubstantiation of this report has verdict == SUPPORTED (else ERR_UNVERIFIED_CLAIMS)"
          - "study status == REPORTING (else ERR_INVALID_STUDY_STATE)"
        side_effects:
          - "study -> COMPLETED (see Study REPORTING->COMPLETED side effects: retention window, retainer settlement, active_study_count)"

      - from: INTERNAL_REVIEW
        to: REJECTED
        trigger: "POST /sensory-lab/study-reports/{id}/qa-reject"
        actor: QAOfficer
        preconditions:
          - "status == INTERNAL_REVIEW (else ERR_INVALID_REPORT_STATE)"
          - "acting QAOfficer X-User-ID != author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: ClaimSubstantiation
    initial_state: PENDING
    terminal_states: [SUPPORTED, NOT_SUPPORTED, INSUFFICIENT_DATA]
    transitions:
      - from: PENDING
        to: SUPPORTED
        trigger: "POST /sensory-lab/claims/{id}/verify with verdict SUPPORTED"
        actor: QAOfficer
        preconditions:
          - "verdict == PENDING (else ERR_CLAIM_ALREADY_VERIFIED)"
          - "acting QAOfficer X-User-ID != report.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "evidence rule for claim_type evaluates to SUPPORTED (else ERR_CLAIM_EVIDENCE_MISMATCH)"
        side_effects:
          - "verified_by = acting X-User-ID"

      - from: PENDING
        to: NOT_SUPPORTED
        trigger: "POST /sensory-lab/claims/{id}/verify with verdict NOT_SUPPORTED"
        actor: QAOfficer
        preconditions:
          - "verdict == PENDING (else ERR_CLAIM_ALREADY_VERIFIED)"
          - "acting QAOfficer X-User-ID != report.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "evidence rule for claim_type evaluates to NOT_SUPPORTED (else ERR_CLAIM_EVIDENCE_MISMATCH)"
        side_effects:
          - "verified_by = acting X-User-ID"

      - from: PENDING
        to: INSUFFICIENT_DATA
        trigger: "POST /sensory-lab/claims/{id}/verify with verdict INSUFFICIENT_DATA"
        actor: QAOfficer
        preconditions:
          - "verdict == PENDING (else ERR_CLAIM_ALREADY_VERIFIED)"
          - "acting QAOfficer X-User-ID != report.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "evidence rule for claim_type evaluates to INSUFFICIENT_DATA (else ERR_CLAIM_EVIDENCE_MISMATCH)"
        side_effects:
          - "verified_by = acting X-User-ID"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: study-design-update-occ
    parent_entity: Study
    write_endpoint: "PUT /sensory-lab/studies/{id}"
    occ_field: expected_study_version
    description: |
      Updating a Study's design fields with an expected_study_version that no
      longer matches the Study's current version is rejected. This captures the
      case where another writer has mutated the study (any mutation bumps
      Study.version) since the client last observed it, making the client's
      design view stale.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

  - rule_id: recommendation-create-occ
    parent_entity: Study
    write_endpoint: "POST /sensory-lab/date-code-recommendations"
    occ_field: expected_study_version
    description: |
      Creating a DateCodeRecommendation against a Study whose version has
      advanced since the client last observed it is rejected. Recommendation
      creation legitimately supersedes the arm's prior PROPOSED recommendation,
      so a second creator holding a stale study version must be refused rather
      than silently superseding on old data.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: shelf_life_equivalent_days
    trigger: "EvaluationSession lock with sensory_failed == true; LabTestResult creation with tripped == true; (re)computation of StudyArm.computed_failure_day_equiv"
    algorithm: threshold
    formula: |
      factor = q10_factor ** ((storage_temp_c - reference_temp_c) / 10)
      For a tripped observation at SamplingTimePoint.day_index:
        equivalent_days = day_index * factor          (round_half_up to 3 decimals)
      StudyArm.computed_failure_day_equiv = min of equivalent_days over all tripped
        observations (sessions with sensory_failed == true, lab results with tripped == true)
        referencing this arm; null when the set is empty.
      Study.earliest_failure_day_equiv = min over arms of computed_failure_day_equiv
        (null when every arm is null).
    input_set: "EvaluationSessions of the arm with status in {LOCKED, ANALYZED} and sensory_failed == true; LabTestResults of the arm with tripped == true; mapped through their SamplingTimePoint.day_index"
    constants:
      DEFAULT_Q10: 2.0
      DEFAULT_REFERENCE_TEMP_C: 20
    precision: "3 decimal places, round_half_up"
    variants:
      - name: REAL_TIME
        when: "study_type == REAL_TIME (storage_temp_c == reference_temp_c makes factor == 1)"
        difference: "equivalent_days == day_index: the observed chronological failure day is used as-is"
      - name: ACCELERATED_Q10
        when: "study_type == ACCELERATED (storage_temp_c > reference_temp_c, q10_factor > 1)"
        difference: "equivalent_days = day_index * q10^((T_storage - T_ref)/10): the same observed day_index projects to a larger real-time-equivalent day, so identical raw schedules yield different failure days and different date codes"

  - name: attribute_mean_score
    trigger: "EvaluationSession lock"
    algorithm: aggregation
    formula: |
      For attribute A (A == OVERALL for endpoint evaluation):
        scores = [AttributeScore.score for assignments of this session
                  with status == SUBMITTED and attribute == A]
        mean_A = sum(scores) / count(scores), round_half_up to 2 decimals
      Input set EXCLUDES assignments in {ASSIGNED, NO_SHOW, EXCUSED}.
    input_set: "AttributeScore rows whose PanelAssignment.session_id == this session and PanelAssignment.status == SUBMITTED"
    precision: "2 decimal places, round_half_up"

  - name: sensory_criterion_evaluation
    trigger: "EvaluationSession lock (after attribute_mean_score)"
    algorithm: threshold
    formula: |
      Let mean_arm = this session's overall_mean, n_arm = count of SUBMITTED assignments.
      Let the control session = the non-CANCELLED EvaluationSession with the same
        time_point_id whose arm has is_control == true.
      If the control session is LOCKED or ANALYZED:
        n_ctrl = its SUBMITTED count; mean_ctrl = its overall_mean
        significance_delta = 1.96 * PANEL_SD * sqrt(1/n_arm + 1/n_ctrl)
        significant = abs(mean_arm - mean_ctrl) >= significance_delta
      Else: significant = false, significance_delta = null.
      sensory_failed = (mean_arm <= study.sensory_fail_threshold) AND significant
      Boundary: the threshold comparison is INCLUSIVE (mean exactly equal to
      sensory_fail_threshold satisfies the at-or-below leg).
    input_set: "this session plus the control-arm session for the same time point"
    constants:
      Z_975: 1.96
      PANEL_SD: 1.5
    precision: "delta computed at full precision; overall_mean rounded 2dp round_half_up before comparison"

  - name: date_code_recommendation
    trigger: "POST /sensory-lab/date-code-recommendations"
    algorithm: aggregation
    formula: |
      base = arm.computed_failure_day_equiv if not null else study.target_shelf_life_days
      safety_days = floor(base * (1 - SAFETY_FACTOR))
      increment = 7 if safety_days < 90 else 30
      computed_days = floor(safety_days / increment) * increment
      basis = ENDPOINT_MIN if arm.computed_failure_day_equiv != null else TARGET_FALLBACK
    input_set: "single StudyArm + its Study"
    constants:
      SAFETY_FACTOR: 0.2
      INCREMENT_SMALL: 7
      INCREMENT_LARGE: 30
      INCREMENT_TIER_BOUNDARY: 90
    precision: "integer days; floor at each step"
    note: "combinatorial mode (a): >= 3 inputs (failure day, target, safety factor, tiered increment) with nested floor and a conditional tier boundary"

  - name: retainer_hours_settlement
    trigger: "Study activation (reserve); Study abort (full refund); Study completion via report release (settle)"
    algorithm: aggregation
    formula: |
      reserve_hours_required = 10 + 2 * (count of SamplingTimePoints) + 4 * (count of StudyArms)
      At completion:
        per EvaluationSession with status == ANALYZED:
          room_hours = ceil(duration_minutes / 15) * 0.25      # ROUND PER SESSION FIRST
          charge_s = room_hours + 0.5 * (count of its SUBMITTED assignments)
        per LabTestResult: charge_t = TEST_HOURS[test_type]
        consumed_hours = round_half_up( sum(charge_s) + sum(charge_t), 2 )
      Rounding order is PINNED: per-session room_hours is rounded up to the 0.25
      quantum BEFORE summing across sessions; sum-first-then-round is WRONG and
      yields a different total (e.g. 25-min and 35-min sessions with 4 submitted
      each: pinned order 0.50+2.00 + 0.75+2.00 = 5.25 vs sum-first 1.00+4.00 = 5.00).
      Settlement: balance += (reserved_hours_escrow - consumed_hours); a negative
      difference debits the balance (balance may go negative).
      Abort: balance += reserved_hours_escrow (full refund, no consumption).
    input_set: "Sessions of the study in ANALYZED; all LabTestResults of the study"
    constants:
      BASE_RESERVE_HOURS: 10
      PER_TIME_POINT_HOURS: 2
      PER_ARM_HOURS: 4
      ASSIGNMENT_FEE_HOURS: 0.5
      TEST_HOURS: { APC: 1.5, YEAST_MOLD: 2.0, LACTIC: 2.0, PEROXIDE_VALUE: 1.0, PH: 0.5, WATER_ACTIVITY: 0.5 }
    precision: "0.25-hour quantum per session (ceil); grand total 2 decimals round_half_up"

  - name: required_panelist_count
    trigger: "EvaluationSession creation (including schedule-makeup)"
    algorithm: weighted_scoring
    formula: |
      Evaluation order is PINNED (the dependency only looks circular):
      (1) sigma2 = sample variance (denominator n-1) of ALL OVERALL AttributeScores
          belonging to this study's sessions in status ANALYZED;
          when the study has no ANALYZED session, sigma2 = DEFAULT_VARIANCE.
      (2) delta = study.min_detectable_difference.
      (3) n_raw = 2 * (Z_ALPHA + Z_BETA)^2 * sigma2 / delta^2
      (4) required_panelist_count = clamp( ceil(n_raw), MIN_PANELISTS, MAX_PANELISTS )
      The count is frozen on the session at creation; later ANALYZED sessions do
      not retroactively resize existing sessions.
    input_set: "AttributeScores with attribute == OVERALL whose session belongs to this study and has status == ANALYZED"
    constants:
      Z_ALPHA: 1.96
      Z_BETA: 0.84
      DEFAULT_VARIANCE: 2.25
      MIN_PANELISTS: 4
      MAX_PANELISTS: 12
    precision: "ceil to integer after clamp bounds are applied last... note: clamp applies AFTER ceil"
    note: "combinatorial mode (c): panelist count depends on panel performance which depends on panelists; the pinned (1)-(4) order makes it well-defined"

  - name: panelist_consistency_index
    trigger: "provisional: recomputed when a session containing the panelist's scores locks; final: recomputed when such a session is ANALYZED (both surfaced on GET /sensory-lab/panelists/{id})"
    algorithm: aggregation
    formula: |
      penalty = mean over in-scope (session, attribute) cells of
                |panelist_score - reference_mean(cell)|
      consistency_index = max(0, 100 - 20 * penalty)   (2 decimals, round_half_up)
    input_set: "attribute cells the panelist scored; scope and reference mean differ per variant"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "sessions in {LOCKED, ANALYZED}"
        difference: "reference_mean INCLUDES the panelist's own score (plain session cell mean)"
      - name: FINAL
        when: "sessions in {ANALYZED} only"
        difference: "reference_mean EXCLUDES the panelist's own score (leave-one-out); same raw scores therefore yield a different index (e.g. scores [8, 6, 6, 6, 6] give PROVISIONAL 68.00 vs FINAL 60.00)"

  - name: micro_sensory_correlation
    trigger: "GET /sensory-lab/studies/{id}/correlation"
    algorithm: aggregation
    formula: |
      Pairs are formed per SamplingTimePoint where BOTH exist for the arm:
        x = LabTestResult.measured_value of the requested test_type at that time point
        y = the ANALYZED session's overall_mean at that time point
      Require pair_count >= 3 else ERR_INSUFFICIENT_CORRELATION_PAIRS.
      r = sum(dx*dy) / sqrt( sum(dx^2) * sum(dy^2) )  over paired deviations
    input_set: "time points of the arm having both a matching LabTestResult and an ANALYZED session"
    precision: "4 decimal places, round_half_up"

  - name: claim_evidence_evaluation
    trigger: "POST /sensory-lab/claims/{id}/verify"
    algorithm: threshold
    formula: |
      SHELF_LIFE_DAYS (claimed_value = days):
        rec = the report's pinned recommendation (must exist and be ACCEPTED)
        SUPPORTED iff claimed_value <= rec.computed_days, else NOT_SUPPORTED.
        INSUFFICIENT_DATA is never the evidence outcome for this type.
      PACKAGING_SUPERIORITY (claimed_value = percent, claim.arm_id required):
        control_rec = ACCEPTED recommendation of the control arm of the same study
        variant_rec = ACCEPTED recommendation of claim.arm_id (must be a non-control
          arm of the same study, else ERR_REPORT_STUDY_MISMATCH)
        when either is missing: evidence outcome is INSUFFICIENT_DATA
        else actual_pct = (variant_rec.computed_days - control_rec.computed_days)
                          / control_rec.computed_days * 100   (2dp round_half_up)
        SUPPORTED iff actual_pct >= claimed_value, else NOT_SUPPORTED.
      The QAOfficer's chosen verdict must equal the evidence outcome exactly,
      else ERR_CLAIM_EVIDENCE_MISMATCH.
    input_set: "the claim, its report's pinned recommendation, and the study arms' ACCEPTED recommendations"
    precision: "actual_pct 2 decimal places, round_half_up"

  - name: chamber_occupancy
    trigger: "pull, checkout (no change), return (no change), consume, discard, retain sweep, abort"
    algorithm: aggregation
    formula: |
      chamber.reserved_units = count of SampleUnits with chamber_id == chamber.id
                               and status in {STORED, CHECKED_OUT}
      Pull legality: reserved_units + quantity <= capacity_units (equality allowed).
      Invariant: reserved_units tracks the set exactly at all times.
    input_set: "SampleUnits of the chamber in {STORED, CHECKED_OUT}"
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; entity_backed ownership rules (Panelist scores own assignment; Client requests changes on own study's report; author-only submit)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: concurrency
    check: "expected_study_version matches Study.version on OCC-guarded writes (PUT study, POST date-code-recommendations)"
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
    applies_to: "PUT /sensory-lab/studies/{id}; POST /sensory-lab/date-code-recommendations"

  - priority: 4
    category: state
    check: "Target entity state machine precondition for the requested transition (study/session/time-point/panelist/assignment/sample/report/recommendation/claim state gates, including quorum at lock)"
    error_id: "ERR_INVALID_STUDY_STATE | ERR_INVALID_SESSION_STATE | ERR_INVALID_TIME_POINT_STATE | ERR_INVALID_PANELIST_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_SAMPLE_STATE | ERR_INVALID_REPORT_STATE | ERR_RECO_NOT_PROPOSED | ERR_SESSION_UNDER_QUORUM | ERR_CLAIM_ALREADY_VERIFIED"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 5
    category: business_safety
    check: "Data-integrity and segregation-of-duties: measured_value within the method's valid measurement range (ERR_MEASUREMENT_OUT_OF_RANGE); score within 1..15 (ERR_SCORE_OUT_OF_RANGE); QAOfficer/LabDirector acting on a report is not its author (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_MEASUREMENT_OUT_OF_RANGE | ERR_SCORE_OUT_OF_RANGE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST lab-test-results; POST attribute-scores; qa-approve / qa-reject / claims verify"
    note: "ERR_SEGREGATION_OF_DUTIES returns 403; the two range errors return 422"

  - priority: 6
    category: business_constraint
    check: "Uniqueness and cardinality: client email unique (ERR_EMAIL_NOT_UNIQUE); panelist email unique (ERR_EMAIL_NOT_UNIQUE); one control arm per study (ERR_CONTROL_ARM_EXISTS); (study_id, packaging_variant) unique (ERR_DUPLICATE_ARM_VARIANT); (study_id, day_index) unique (ERR_DUPLICATE_TIME_POINT_DAY); one non-CANCELLED session per (time_point_id, arm_id) (ERR_SESSION_EXISTS); one score per (assignment_id, attribute) (ERR_SCORE_ALREADY_SUBMITTED); session active-assignment count < required_panelist_count + 2 (ERR_SESSION_FULL)"
    error_id: "ERR_EMAIL_NOT_UNIQUE | ERR_CONTROL_ARM_EXISTS | ERR_DUPLICATE_ARM_VARIANT | ERR_DUPLICATE_TIME_POINT_DAY | ERR_SESSION_EXISTS | ERR_SCORE_ALREADY_SUBMITTED | ERR_SESSION_FULL"
    http_status: 409
    applies_to: "create endpoints and score submission"

  - priority: 7
    category: business_temporal
    check: "Clock-relative windows: pull only when day_index <= current study day <= day_index + 2 (ERR_PULL_WINDOW_VIOLATION); session open only within [start - 30min, end] (ERR_OUTSIDE_SESSION_WINDOW); session scheduled_end_utc > scheduled_start_utc (ERR_INVALID_REQUEST)"
    error_id: "ERR_PULL_WINDOW_VIOLATION | ERR_OUTSIDE_SESSION_WINDOW"
    http_status: 409
    applies_to: "pull; session open; session creation"

  - priority: 8
    category: business_referential
    check: "Cross-entity coherence: arm/time_point belong to the path/body study (ERR_ARM_STUDY_MISMATCH, ERR_TIME_POINT_STUDY_MISMATCH); chamber.temp_c == study.storage_temp_c on pull (ERR_CHAMBER_TEMP_MISMATCH); panelist has no overlapping session assignment in {ASSIGNED, SUBMITTED} — half-open interval intersection, back-to-back allowed (ERR_PANELIST_DOUBLE_BOOKED); makeup source session is CANCELLED; claim/report/recommendation belong to the same study chain (ERR_REPORT_STUDY_MISMATCH)"
    error_id: "ERR_ARM_STUDY_MISMATCH | ERR_TIME_POINT_STUDY_MISMATCH | ERR_CHAMBER_TEMP_MISMATCH | ERR_PANELIST_DOUBLE_BOOKED | ERR_REPORT_STUDY_MISMATCH"
    http_status: 422
    applies_to: "pull; lab-test-results; panel-assignments; schedule-makeup; claims; attach-recommendation"
    note: "ERR_PANELIST_DOUBLE_BOOKED returns 409"

  - priority: 9
    category: business_fiscal
    check: "client.retainer_hours_balance >= reserved_hours_required at activation"
    error_id: ERR_INSUFFICIENT_RETAINER_HOURS
    http_status: 402
    applies_to: "POST /sensory-lab/studies/{id}/activate"

# =============================================================================
# 1.5 API Endpoint Table (flat topology; all business resources under /sensory-lab)
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [LabDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- ClientAccount ---
  - method: POST
    path: "/sensory-lab/clients"
    description: "Create a client account"
    roles: [LabDirector]
    code: 201
    input: [name, contact_email, "tier?"]
    output: ClientAccount
    side_effects: ["retainer_hours_balance = 0, active_study_count = 0"]

  - method: GET
    path: "/sensory-lab/clients"
    description: "List clients; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: "ClientAccount[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/clients/{id}"
    description: "Get a client"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  - method: POST
    path: "/sensory-lab/clients/{id}/retainer-topups"
    description: "Add prepaid lab hours to the client's retainer balance"
    roles: [LabDirector]
    code: 201
    input: [hours]
    output: ClientAccount
    side_effects: ["retainer_hours_balance += hours (hours must be > 0 else ERR_INVALID_REQUEST)"]

  # --- Study ---
  - method: POST
    path: "/sensory-lab/studies"
    description: "Create a shelf-life study in DRAFT"
    roles: [SensoryScientist]
    code: 201
    input: [client_id, product_name, study_type, storage_temp_c, target_shelf_life_days, sensory_fail_threshold, min_detectable_difference, planned_start_utc, "reference_temp_c?", "q10_factor?"]
    output: Study
    side_effects:
      - "status = DRAFT; reserved_hours_escrow = 0; consumed_hours = 0; earliest_failure_day_equiv = null"
      - "ACCELERATED requires q10_factor > 1.0 and storage_temp_c > reference_temp_c (else ERR_INVALID_REQUEST)"

  - method: GET
    path: "/sensory-lab/studies"
    description: "List studies; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "Study[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/studies/{id}"
    description: "Get a study"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: Study
    side_effects: []

  - method: PUT
    path: "/sensory-lab/studies/{id}"
    description: "Update study design fields (DRAFT only), OCC-guarded"
    roles: [SensoryScientist]
    code: 200
    input: [expected_study_version, "product_name?", "storage_temp_c?", "reference_temp_c?", "q10_factor?", "target_shelf_life_days?", "sensory_fail_threshold?", "min_detectable_difference?", "planned_start_utc?"]
    output: Study
    side_effects: ["increments Study.version by 1", "precondition: status == DRAFT (else ERR_INVALID_STUDY_STATE)"]

  - method: POST
    path: "/sensory-lab/studies/{id}/submit-design"
    description: "DRAFT -> DESIGN_REVIEW"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: Study
    side_effects: ["increments Study.version by 1"]

  - method: POST
    path: "/sensory-lab/studies/{id}/approve-design"
    description: "DESIGN_REVIEW -> SCHEDULED"
    roles: [LabDirector]
    code: 200
    input: []
    output: Study
    side_effects: ["increments Study.version by 1"]

  - method: POST
    path: "/sensory-lab/studies/{id}/reject-design"
    description: "DESIGN_REVIEW -> DRAFT"
    roles: [LabDirector]
    code: 200
    input: []
    output: Study
    side_effects: ["increments Study.version by 1"]

  - method: POST
    path: "/sensory-lab/studies/{id}/activate"
    description: "SCHEDULED -> IN_PROGRESS; reserves retainer hours per retainer_hours_settlement"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: Study
    side_effects: ["actual_start_utc = logical clock", "escrow debit per state machine", "increments Study.version by 1"]

  - method: POST
    path: "/sensory-lab/studies/{id}/close-fieldwork"
    description: "IN_PROGRESS -> ANALYSIS"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: Study
    side_effects: ["increments Study.version by 1"]

  - method: POST
    path: "/sensory-lab/studies/{id}/reopen-fieldwork"
    description: "ANALYSIS -> IN_PROGRESS (cyclic re-entry)"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: Study
    side_effects: ["increments Study.version by 1"]

  - method: POST
    path: "/sensory-lab/studies/{id}/abort"
    description: "-> ABORTED from DRAFT/DESIGN_REVIEW/SCHEDULED/IN_PROGRESS with full compensation"
    roles: [LabDirector]
    code: 200
    input: []
    output: Study
    side_effects: ["escrow refund", "sessions CANCELLED", "assignments EXCUSED", "units DISCARDED", "recommendations SUPERSEDED", "increments Study.version by 1"]

  - method: GET
    path: "/sensory-lab/studies/{id}/correlation"
    description: "Computed read: Pearson correlation between a lab test type and OVERALL sensory means across paired time points (micro_sensory_correlation)"
    roles: [SensoryScientist, LabDirector, QAOfficer]
    code: 200
    input: [arm_id, test_type, attribute]
    output: { coefficient: number, pair_count: integer, arm_id: string, test_type: string, attribute: string }
    side_effects: ["ERR_INSUFFICIENT_CORRELATION_PAIRS when pair_count < 3"]

  # --- StudyArm ---
  - method: POST
    path: "/sensory-lab/study-arms"
    description: "Add a packaging arm to a DRAFT study"
    roles: [SensoryScientist]
    code: 201
    input: [study_id, packaging_variant, "is_control?"]
    output: StudyArm
    side_effects: ["precondition: study status == DRAFT (else ERR_INVALID_STUDY_STATE)", "unique (study_id, packaging_variant)", "at most one is_control == true per study"]

  - method: GET
    path: "/sensory-lab/study-arms"
    description: "List study arms; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "limit?", "offset?"]
    output: "StudyArm[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/study-arms/{id}"
    description: "Get a study arm"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: StudyArm
    side_effects: []

  # --- SamplingTimePoint ---
  - method: POST
    path: "/sensory-lab/sampling-time-points"
    description: "Add a sampling day to the schedule"
    roles: [SensoryScientist]
    code: 201
    input: [study_id, day_index]
    output: SamplingTimePoint
    side_effects: ["precondition: study DRAFT, or IN_PROGRESS with day_index > current study day (else ERR_INVALID_STUDY_STATE)", "unique (study_id, day_index)"]

  - method: GET
    path: "/sensory-lab/sampling-time-points"
    description: "List sampling time points; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: "SamplingTimePoint[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/sampling-time-points/{id}"
    description: "Get a sampling time point"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: SamplingTimePoint
    side_effects: []

  - method: POST
    path: "/sensory-lab/sampling-time-points/{id}/pull"
    description: "Pull `quantity` sample units for one arm from a chamber (creates SampleUnits, PENDING -> PULLED)"
    roles: [SensoryScientist]
    code: 201
    input: [chamber_id, arm_id, quantity, unit_purpose]
    output: SamplingTimePoint
    side_effects: ["creates quantity SampleUnits in STORED", "chamber.reserved_units += quantity", "time point -> PULLED"]

  - method: POST
    path: "/sensory-lab/sampling-time-points/{id}/close"
    description: "EVALUATED -> CLOSED"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: SamplingTimePoint
    side_effects: []

  - method: POST
    path: "/sensory-lab/sampling-time-points/{id}/skip"
    description: "PENDING -> SKIPPED"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: SamplingTimePoint
    side_effects: []

  # --- StorageChamber ---
  - method: POST
    path: "/sensory-lab/chambers"
    description: "Register a storage chamber"
    roles: [LabDirector]
    code: 201
    input: [chamber_code, temp_c, capacity_units]
    output: StorageChamber
    side_effects: ["reserved_units = 0", "unique chamber_code (else ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/sensory-lab/chambers"
    description: "List chambers; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "StorageChamber[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/chambers/{id}"
    description: "Get a chamber (includes computed reserved_units)"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: StorageChamber
    side_effects: []

  # --- SampleUnit ---
  - method: GET
    path: "/sensory-lab/sample-units"
    description: "List/filter sample units; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "arm_id?", "chamber_id?", "time_point_id?", "session_id?", "status?", "unit_purpose?", "limit?", "offset?"]
    output: "SampleUnit[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/sample-units/{id}"
    description: "Get a sample unit"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: SampleUnit
    side_effects: []

  - method: POST
    path: "/sensory-lab/sample-units/{id}/checkout"
    description: "STORED -> CHECKED_OUT"
    roles: [PanelCoordinator]
    code: 200
    input: ["session_id?"]
    output: SampleUnit
    side_effects: ["session_id set when provided (required for EVALUATION units)"]

  - method: POST
    path: "/sensory-lab/sample-units/{id}/return"
    description: "CHECKED_OUT -> STORED"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: SampleUnit
    side_effects: ["session_id cleared; reserved_units unchanged"]

  - method: POST
    path: "/sensory-lab/sample-units/{id}/consume"
    description: "CHECKED_OUT -> CONSUMED"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: SampleUnit
    side_effects: ["session_id cleared; chamber.reserved_units -= 1"]

  - method: POST
    path: "/sensory-lab/sample-units/{id}/discard"
    description: "STORED|CHECKED_OUT -> DISCARDED"
    roles: [LabDirector]
    code: 200
    input: []
    output: SampleUnit
    side_effects: ["session_id cleared; chamber.reserved_units -= 1"]

  - method: POST
    path: "/sensory-lab/retain-sweeps"
    description: "Expire every RETAIN SampleUnit whose retention_until_utc is set and strictly before the logical clock"
    roles: [LabDirector]
    code: 200
    input: []
    output: { expired_count: integer, expired_unit_ids: array }
    side_effects: ["matching units STORED -> EXPIRED; chamber.reserved_units decremented per unit"]

  # --- Panelist ---
  - method: POST
    path: "/sensory-lab/panelists"
    description: "Register a panelist (APPLIED)"
    roles: [PanelCoordinator]
    code: 201
    input: [full_name, email, qualified_attributes]
    output: Panelist
    side_effects: ["status = APPLIED; training_sessions_completed = 0; consecutive_no_shows = 0"]

  - method: GET
    path: "/sensory-lab/panelists"
    description: "List panelists; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Panelist[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/panelists/{id}"
    description: "Get a panelist (includes both consistency index variants)"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: Panelist
    side_effects: []

  - method: POST
    path: "/sensory-lab/panelists/{id}/record-screening"
    description: "APPLIED -> TRAINING when acuity_score >= 80 else -> SCREENED_OUT"
    roles: [PanelCoordinator]
    code: 200
    input: [acuity_score]
    output: Panelist
    side_effects: ["screening_acuity_score = acuity_score (0..100 else ERR_INVALID_REQUEST)"]

  - method: POST
    path: "/sensory-lab/panelists/{id}/record-training"
    description: "TRAINING: training_sessions_completed += 1; at 3 -> QUALIFIED"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: Panelist
    side_effects: ["status flips to QUALIFIED when counter reaches 3"]

  - method: POST
    path: "/sensory-lab/panelists/{id}/deactivate"
    description: "QUALIFIED -> INACTIVE"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: Panelist
    side_effects: []

  - method: POST
    path: "/sensory-lab/panelists/{id}/reactivate"
    description: "INACTIVE -> QUALIFIED when consistency_index_final is null or >= 60, else -> TRAINING (remedial)"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: Panelist
    side_effects: ["remedial branch resets training_sessions_completed to 0"]

  - method: POST
    path: "/sensory-lab/panelists/{id}/assign-remedial"
    description: "SUSPENDED -> TRAINING"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: Panelist
    side_effects: ["training_sessions_completed = 0; consecutive_no_shows = 0"]

  # --- EvaluationSession ---
  - method: POST
    path: "/sensory-lab/evaluation-sessions"
    description: "Plan a sensory session for one arm at one time point"
    roles: [PanelCoordinator]
    code: 201
    input: [study_id, time_point_id, arm_id, scheduled_start_utc, scheduled_end_utc]
    output: EvaluationSession
    side_effects:
      - "precondition: study status in {SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STUDY_STATE)"
      - "arm_id and time_point_id must belong to study_id (else ERR_ARM_STUDY_MISMATCH / ERR_TIME_POINT_STUDY_MISMATCH)"
      - "scheduled_end_utc > scheduled_start_utc (else ERR_INVALID_REQUEST)"
      - "no other non-CANCELLED session for (time_point_id, arm_id) (else ERR_SESSION_EXISTS)"
      - "required_panelist_count computed per required_panelist_count calculation"

  - method: GET
    path: "/sensory-lab/evaluation-sessions"
    description: "List evaluation sessions; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "time_point_id?", "arm_id?", "status?", "makeup_of_id?", "limit?", "offset?"]
    output: "EvaluationSession[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/evaluation-sessions/{id}"
    description: "Get an evaluation session"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: EvaluationSession
    side_effects: []

  - method: POST
    path: "/sensory-lab/evaluation-sessions/{id}/open"
    description: "PLANNED -> OPEN"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: EvaluationSession
    side_effects: []

  - method: POST
    path: "/sensory-lab/evaluation-sessions/{id}/lock"
    description: "OPEN -> LOCKED; computes means, significance, sensory_failed and runs the failure-day cascade"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: EvaluationSession
    side_effects: ["attribute_mean_score + sensory_criterion_evaluation + failure-day recompute cascade (see state machine)"]

  - method: POST
    path: "/sensory-lab/evaluation-sessions/{id}/analyze"
    description: "LOCKED -> ANALYZED; recomputes FINAL consistency indexes and time-point bubble-up"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: EvaluationSession
    side_effects: ["panelist_consistency_index FINAL recompute", "time point PULLED -> EVALUATED when applicable"]

  - method: POST
    path: "/sensory-lab/evaluation-sessions/{id}/cancel"
    description: "PLANNED|OPEN -> CANCELLED; ASSIGNED assignments -> EXCUSED"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: EvaluationSession
    side_effects: ["assignments in ASSIGNED -> EXCUSED"]

  - method: POST
    path: "/sensory-lab/evaluation-sessions/{id}/schedule-makeup"
    description: "Create a successor PLANNED session for a CANCELLED one (makeup_of_id linkage)"
    roles: [PanelCoordinator]
    code: 201
    input: [scheduled_start_utc, scheduled_end_utc]
    output: EvaluationSession
    side_effects: ["new session copies study_id/time_point_id/arm_id; fresh required_panelist_count", "ERR_SESSION_EXISTS still applies for the same (time_point_id, arm_id) among non-CANCELLED sessions — the CANCELLED source does not block"]

  # --- PanelAssignment ---
  - method: POST
    path: "/sensory-lab/panel-assignments"
    description: "Assign a panelist to a session"
    roles: [PanelCoordinator]
    code: 201
    input: [session_id, panelist_id]
    output: PanelAssignment
    side_effects:
      - "precondition: session status in {PLANNED, OPEN} (else ERR_INVALID_SESSION_STATE)"
      - "panelist status == QUALIFIED (else ERR_PANELIST_NOT_QUALIFIED)"
      - "no overlapping session for this panelist with assignment in {ASSIGNED, SUBMITTED}; half-open [start, end) intersection, back-to-back allowed (else ERR_PANELIST_DOUBLE_BOOKED)"
      - "session's active (ASSIGNED + SUBMITTED) count < required_panelist_count + 2 (else ERR_SESSION_FULL)"
      - "same panelist may not hold two assignments on the same session (else ERR_INVALID_REQUEST)"

  - method: GET
    path: "/sensory-lab/panel-assignments"
    description: "List panel assignments; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["session_id?", "panelist_id?", "status?", "limit?", "offset?"]
    output: "PanelAssignment[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/panel-assignments/{id}"
    description: "Get a panel assignment"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: []

  - method: POST
    path: "/sensory-lab/panel-assignments/{id}/mark-no-show"
    description: "ASSIGNED -> NO_SHOW (session must be OPEN); drives the suspension cascade"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: ["consecutive_no_shows += 1; at 3 with status QUALIFIED: panelist -> SUSPENDED and other ASSIGNED assignments on PLANNED/OPEN sessions -> EXCUSED"]

  - method: POST
    path: "/sensory-lab/panel-assignments/{id}/excuse"
    description: "ASSIGNED -> EXCUSED without penalty"
    roles: [PanelCoordinator]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: []

  # --- AttributeScore ---
  - method: POST
    path: "/sensory-lab/attribute-scores"
    description: "Submit one attribute score; the 6th distinct attribute flips the assignment to SUBMITTED"
    roles: [Panelist]
    code: 201
    input: [assignment_id, attribute, score]
    output: AttributeScore
    side_effects:
      - "ownership: assignment.panelist_id must equal X-User-ID (else ERR_FORBIDDEN_ROLE)"
      - "session status == OPEN (else ERR_INVALID_SESSION_STATE)"
      - "1 <= score <= 15 integer (else ERR_SCORE_OUT_OF_RANGE)"
      - "unique (assignment_id, attribute) (else ERR_SCORE_ALREADY_SUBMITTED)"
      - "attribute must be in the panelist's qualified_attributes (else ERR_PANELIST_NOT_QUALIFIED)"
      - "on the 6th distinct attribute: assignment -> SUBMITTED and panelist.consecutive_no_shows = 0"

  - method: GET
    path: "/sensory-lab/attribute-scores"
    description: "List attribute scores; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["assignment_id?", "limit?", "offset?"]
    output: "AttributeScore[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/attribute-scores/{id}"
    description: "Get an attribute score"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: AttributeScore
    side_effects: []

  # --- LabTestResult ---
  - method: POST
    path: "/sensory-lab/lab-test-results"
    description: "Record a microbial/chemical result; runs endpoint trip evaluation and the failure-day cascade"
    roles: [LabAnalyst]
    code: 201
    input: [study_id, arm_id, time_point_id, test_type, measured_value]
    output: LabTestResult
    side_effects:
      - "precondition: study status in {IN_PROGRESS, ANALYSIS, REPORTING} (else ERR_INVALID_STUDY_STATE)"
      - "measured_value within method range (else ERR_MEASUREMENT_OUT_OF_RANGE, checked BEFORE referential checks): APC [0,12], YEAST_MOLD [0,10], LACTIC [0,10], PEROXIDE_VALUE [0,500], PH [0,14], WATER_ACTIVITY [0,1]"
      - "arm_id and time_point_id must belong to study_id (else ERR_ARM_STUDY_MISMATCH / ERR_TIME_POINT_STUDY_MISMATCH)"
      - "tripped evaluated against MICRO/CHEM limits (inclusive): APC >= 6.0, YEAST_MOLD >= 5.0, LACTIC >= 7.0, PEROXIDE_VALUE >= 20.0, PH >= 8.0, WATER_ACTIVITY >= 0.95"
      - "when tripped: StudyArm.computed_failure_day_equiv recomputed (shelf_life_equivalent_days); Study.earliest_failure_day_equiv recomputed; arm's {PROPOSED, ACCEPTED} recommendations -> SUPERSEDED when the failure day changed; pinned reports flagged/reverted per state machine"

  - method: GET
    path: "/sensory-lab/lab-test-results"
    description: "List lab test results; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "arm_id?", "time_point_id?", "test_type?", "limit?", "offset?"]
    output: "LabTestResult[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/lab-test-results/{id}"
    description: "Get a lab test result"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: LabTestResult
    side_effects: []

  # --- DateCodeRecommendation ---
  - method: POST
    path: "/sensory-lab/date-code-recommendations"
    description: "Propose a date-code recommendation for one arm (OCC on Study.version); supersedes the arm's existing PROPOSED"
    roles: [SensoryScientist]
    code: 201
    input: [study_id, arm_id, expected_study_version]
    output: DateCodeRecommendation
    side_effects:
      - "precondition: study status in {ANALYSIS, REPORTING} (else ERR_INVALID_STUDY_STATE); arm must belong to study (ERR_ARM_STUDY_MISMATCH)"
      - "computed_days and basis per date_code_recommendation calculation"
      - "existing PROPOSED recommendation for the same arm -> SUPERSEDED (with report flag cascade)"
      - "increments Study.version by 1"

  - method: GET
    path: "/sensory-lab/date-code-recommendations"
    description: "List date-code recommendations; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "arm_id?", "status?", "limit?", "offset?"]
    output: "DateCodeRecommendation[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/date-code-recommendations/{id}"
    description: "Get a date-code recommendation"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: DateCodeRecommendation
    side_effects: []

  - method: POST
    path: "/sensory-lab/date-code-recommendations/{id}/accept"
    description: "PROPOSED -> ACCEPTED; may auto-advance study ANALYSIS -> REPORTING"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: DateCodeRecommendation
    side_effects: ["study -> REPORTING when every arm then has an ACCEPTED recommendation"]

  - method: POST
    path: "/sensory-lab/date-code-recommendations/{id}/reject"
    description: "PROPOSED -> REJECTED"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: DateCodeRecommendation
    side_effects: []

  # --- StudyReport ---
  - method: POST
    path: "/sensory-lab/study-reports"
    description: "Draft a report for a study in ANALYSIS or REPORTING; author_user_id = X-User-ID"
    roles: [SensoryScientist]
    code: 201
    input: [study_id, title]
    output: StudyReport
    side_effects: ["status = DRAFT; requires_revision = false; revision_count = 0"]

  - method: GET
    path: "/sensory-lab/study-reports"
    description: "List study reports; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["study_id?", "status?", "pinned_recommendation_id?", "limit?", "offset?"]
    output: "StudyReport[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/study-reports/{id}"
    description: "Get a study report"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: StudyReport
    side_effects: []

  - method: POST
    path: "/sensory-lab/study-reports/{id}/attach-recommendation"
    description: "Pin an ACCEPTED recommendation to a DRAFT report (author only)"
    roles: [SensoryScientist]
    code: 200
    input: [recommendation_id]
    output: StudyReport
    side_effects:
      - "precondition: report DRAFT (else ERR_INVALID_REPORT_STATE); acting user == author_user_id (else ERR_FORBIDDEN_ROLE)"
      - "recommendation status == ACCEPTED (else ERR_RECO_NOT_PROPOSED) and recommendation.study_id == report.study_id (else ERR_REPORT_STUDY_MISMATCH)"
      - "clears requires_revision to false"

  - method: POST
    path: "/sensory-lab/study-reports/{id}/submit"
    description: "DRAFT -> INTERNAL_REVIEW (author only); snapshots pinned computed_days"
    roles: [SensoryScientist]
    code: 200
    input: []
    output: StudyReport
    side_effects: ["snapshot_days = pinned recommendation computed_days"]

  - method: POST
    path: "/sensory-lab/study-reports/{id}/qa-approve"
    description: "INTERNAL_REVIEW -> CLIENT_REVIEW (QAOfficer other than the author)"
    roles: [QAOfficer]
    code: 200
    input: []
    output: StudyReport
    side_effects: []

  - method: POST
    path: "/sensory-lab/study-reports/{id}/qa-return"
    description: "INTERNAL_REVIEW -> DRAFT"
    roles: [QAOfficer]
    code: 200
    input: []
    output: StudyReport
    side_effects: ["revision_count += 1"]

  - method: POST
    path: "/sensory-lab/study-reports/{id}/qa-reject"
    description: "INTERNAL_REVIEW -> REJECTED (QAOfficer other than the author)"
    roles: [QAOfficer]
    code: 200
    input: []
    output: StudyReport
    side_effects: []

  - method: POST
    path: "/sensory-lab/study-reports/{id}/request-changes"
    description: "CLIENT_REVIEW -> DRAFT by the owning client"
    roles: [Client]
    code: 200
    input: []
    output: StudyReport
    side_effects: ["requires_revision = false; revision_count += 1"]

  - method: POST
    path: "/sensory-lab/study-reports/{id}/release"
    description: "CLIENT_REVIEW -> RELEASED; completes the study and settles the retainer"
    roles: [LabDirector]
    code: 200
    input: []
    output: StudyReport
    side_effects: ["study -> COMPLETED with retention window + retainer settlement side effects"]

  # --- ClaimSubstantiation ---
  - method: POST
    path: "/sensory-lab/claims"
    description: "Attach a marketing claim to a DRAFT report (author only)"
    roles: [SensoryScientist]
    code: 201
    input: [report_id, claim_type, claim_text, claimed_value, "arm_id?"]
    output: ClaimSubstantiation
    side_effects:
      - "precondition: report DRAFT (else ERR_INVALID_REPORT_STATE); acting user == report.author_user_id (else ERR_FORBIDDEN_ROLE)"
      - "PACKAGING_SUPERIORITY requires arm_id (else ERR_INVALID_REQUEST)"
      - "verdict = PENDING"

  - method: GET
    path: "/sensory-lab/claims"
    description: "List claims; default sort created_at ASC"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: ["report_id?", "verdict?", "limit?", "offset?"]
    output: "ClaimSubstantiation[]"
    side_effects: []

  - method: GET
    path: "/sensory-lab/claims/{id}"
    description: "Get a claim"
    roles: [LabDirector, SensoryScientist, PanelCoordinator, Panelist, LabAnalyst, QAOfficer, Client]
    code: 200
    input: []
    output: ClaimSubstantiation
    side_effects: []

  - method: POST
    path: "/sensory-lab/claims/{id}/verify"
    description: "Verify a PENDING claim (QAOfficer other than the report author); the chosen verdict must match the computed evidence"
    roles: [QAOfficer]
    code: 200
    input: [verdict]
    output: ClaimSubstantiation
    side_effects:
      - "evidence per claim_evidence_evaluation: SHELF_LIFE_DAYS supported iff claimed_value <= pinned recommendation computed_days; PACKAGING_SUPERIORITY supported iff the named arm's ACCEPTED computed_days >= control ACCEPTED computed_days * (1 + claimed_value/100), INSUFFICIENT_DATA when either side lacks an ACCEPTED recommendation"
      - "mismatched verdict -> ERR_CLAIM_EVIDENCE_MISMATCH; verified_by = acting X-User-ID"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on this endpoint, or entity-backed ownership rule violated (Panelist scoring another's assignment, Client acting on another client's report, author-only operations)" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id or body FK reference does not exist" }
  # --- concurrency ---
  - { id: ERR_STALE_STUDY_VERSION, http: 412, condition: "expected_study_version does not match the Study's current version on an OCC-guarded write" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, malformed email, end <= start, ACCELERATED study without q10_factor > 1 and storage_temp_c > reference_temp_c, non-positive hours/quantity, acuity_score outside 0..100" }
  # --- study state ---
  - { id: ERR_INVALID_STUDY_STATE, http: 409, condition: "Study status does not allow the operation (update/arm/time-point creation outside DRAFT rules, transition from wrong state, lab result outside IN_PROGRESS/ANALYSIS, release outside REPORTING)" }
  - { id: ERR_NO_ARMS_DEFINED, http: 409, condition: "submit-design with zero arms" }
  - { id: ERR_NO_CONTROL_ARM, http: 409, condition: "submit-design without exactly one control arm" }
  - { id: ERR_NO_TIME_POINTS, http: 409, condition: "submit-design with zero sampling time points" }
  - { id: ERR_OPEN_TIME_POINTS_REMAIN, http: 409, condition: "close-fieldwork while a time point is in {PENDING, PULLED, EVALUATED}" }
  - { id: ERR_SESSIONS_STILL_OPEN, http: 409, condition: "close-fieldwork while a session is in {PLANNED, OPEN, LOCKED}" }
  # --- fiscal ---
  - { id: ERR_INSUFFICIENT_RETAINER_HOURS, http: 402, condition: "client.retainer_hours_balance < reserved_hours_required at activation" }
  # --- arms / time points / chambers ---
  - { id: ERR_CONTROL_ARM_EXISTS, http: 409, condition: "Creating a second control arm for a study" }
  - { id: ERR_DUPLICATE_ARM_VARIANT, http: 409, condition: "Same packaging_variant twice within one study" }
  - { id: ERR_DUPLICATE_TIME_POINT_DAY, http: 409, condition: "Same day_index twice within one study" }
  - { id: ERR_INVALID_TIME_POINT_STATE, http: 409, condition: "Time point status does not allow pull/close/skip" }
  - { id: ERR_PULL_WINDOW_VIOLATION, http: 409, condition: "Current study day outside [day_index, day_index + 2] at pull" }
  - { id: ERR_CHAMBER_TEMP_MISMATCH, http: 422, condition: "chamber.temp_c != study.storage_temp_c at pull" }
  - { id: ERR_CHAMBER_CAPACITY_EXCEEDED, http: 409, condition: "reserved_units + quantity > capacity_units at pull (equality is legal)" }
  # --- samples ---
  - { id: ERR_INVALID_SAMPLE_STATE, http: 409, condition: "SampleUnit status does not allow checkout/return/consume/discard" }
  # --- panelists ---
  - { id: ERR_INVALID_PANELIST_STATE, http: 409, condition: "Panelist status does not allow the requested lifecycle action" }
  - { id: ERR_EMAIL_NOT_UNIQUE, http: 409, condition: "Client contact_email or panelist email already registered" }
  - { id: ERR_PANELIST_NOT_QUALIFIED, http: 409, condition: "Panelist not QUALIFIED at assignment, or attribute not in qualified_attributes at scoring" }
  # --- sessions / assignments / scores ---
  - { id: ERR_INVALID_SESSION_STATE, http: 409, condition: "Session status does not allow the operation (also: checkout of an EVALUATION unit without a PLANNED/OPEN session)" }
  - { id: ERR_NO_PULLED_SAMPLES, http: 409, condition: "Opening a session whose (time_point_id, arm_id) has no pulled SampleUnits" }
  - { id: ERR_OUTSIDE_SESSION_WINDOW, http: 409, condition: "Session open outside [scheduled_start_utc - 30min, scheduled_end_utc]" }
  - { id: ERR_SESSION_UNDER_QUORUM, http: 409, condition: "Lock with SUBMITTED count < required_panelist_count" }
  - { id: ERR_SESSION_EXISTS, http: 409, condition: "A non-CANCELLED session already exists for (time_point_id, arm_id)" }
  - { id: ERR_PANELIST_DOUBLE_BOOKED, http: 409, condition: "Panelist holds an assignment in {ASSIGNED, SUBMITTED} on another session whose [start, end) strictly intersects (half-open; back-to-back is legal)" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Session active assignment count already == required_panelist_count + 2" }
  - { id: ERR_INVALID_ASSIGNMENT_STATE, http: 409, condition: "Assignment not ASSIGNED for mark-no-show/excuse" }
  - { id: ERR_SCORE_ALREADY_SUBMITTED, http: 409, condition: "Duplicate (assignment_id, attribute) score" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "score outside integer 1..15" }
  # --- lab results ---
  - { id: ERR_MEASUREMENT_OUT_OF_RANGE, http: 422, condition: "measured_value outside the test type's valid measurement range" }
  - { id: ERR_ARM_STUDY_MISMATCH, http: 422, condition: "arm_id does not belong to the referenced study" }
  - { id: ERR_TIME_POINT_STUDY_MISMATCH, http: 422, condition: "time_point_id does not belong to the referenced study" }
  - { id: ERR_INSUFFICIENT_CORRELATION_PAIRS, http: 422, condition: "Fewer than 3 paired time points for the requested correlation" }
  # --- recommendations ---
  - { id: ERR_RECO_NOT_PROPOSED, http: 409, condition: "Recommendation not PROPOSED for accept/reject; or recommendation not ACCEPTED at attach-recommendation" }
  # --- reports / claims ---
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "Report status does not allow the operation" }
  - { id: ERR_NO_ACCEPTED_RECOMMENDATION, http: 409, condition: "submit without a pinned ACCEPTED recommendation" }
  - { id: ERR_REPORT_REQUIRES_REVISION, http: 409, condition: "submit/qa-approve/release while requires_revision is true" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "QAOfficer acting on a report (or its claims) they authored" }
  - { id: ERR_UNVERIFIED_CLAIMS, http: 409, condition: "release while any claim verdict != SUPPORTED" }
  - { id: ERR_CLAIM_ALREADY_VERIFIED, http: 409, condition: "verify on a claim whose verdict is not PENDING" }
  - { id: ERR_CLAIM_EVIDENCE_MISMATCH, http: 422, condition: "Chosen verdict contradicts the computed evidence for the claim type" }
  - { id: ERR_REPORT_STUDY_MISMATCH, http: 422, condition: "Recommendation or arm referenced by a report/claim belongs to a different study" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LabDirector
    description: "Laboratory director: client accounts, chambers, design approval, aborts, report release, retain sweeps, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sensory-lab/clients, POST /sensory-lab/clients/{id}/retainer-topups"
      - "POST /sensory-lab/chambers"
      - "POST /sensory-lab/studies/{id}/approve-design, reject-design, abort"
      - "POST /sensory-lab/sample-units/{id}/discard"
      - "POST /sensory-lab/retain-sweeps"
      - "POST /sensory-lab/study-reports/{id}/release"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "GET /sensory-lab/studies/{id}/correlation"

  - name: SensoryScientist
    description: "Study designer and analyst: study lifecycle, arms, time points, pulls, session analysis, recommendations, report authoring, claim drafting"
    identity: opaque
    exclusive_operations:
      - "POST /sensory-lab/studies, PUT /sensory-lab/studies/{id}"
      - "POST /sensory-lab/studies/{id}/submit-design, activate, close-fieldwork, reopen-fieldwork"
      - "POST /sensory-lab/study-arms, POST /sensory-lab/sampling-time-points (+ pull/close/skip)"
      - "POST /sensory-lab/evaluation-sessions/{id}/analyze"
      - "POST /sensory-lab/date-code-recommendations (+ accept/reject)"
      - "POST /sensory-lab/study-reports (+ attach-recommendation, submit), POST /sensory-lab/claims"
    shared_operations:
      - "all GET endpoints"
      - "GET /sensory-lab/studies/{id}/correlation"

  - name: PanelCoordinator
    description: "Panel and session operations: panelist lifecycle, session scheduling/open/lock/cancel, assignments, sample checkout"
    identity: opaque
    exclusive_operations:
      - "POST /sensory-lab/panelists (+ record-screening, record-training, deactivate, reactivate, assign-remedial)"
      - "POST /sensory-lab/evaluation-sessions (+ open, lock, cancel, schedule-makeup)"
      - "POST /sensory-lab/panel-assignments (+ mark-no-show, excuse)"
      - "POST /sensory-lab/sample-units/{id}/checkout, return, consume"
    shared_operations:
      - "all GET endpoints"

  - name: Panelist
    description: "Qualified sensory panelist; may only score own assignments"
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /sensory-lab/attribute-scores"
    shared_operations:
      - "all GET endpoints"

  - name: LabAnalyst
    description: "Micro/chemical lab analyst recording instrumental results"
    identity: opaque
    exclusive_operations:
      - "POST /sensory-lab/lab-test-results"
    shared_operations:
      - "all GET endpoints"

  - name: QAOfficer
    description: "Quality assurance: report QA review and claim verification; barred by segregation-of-duties from acting on own-authored reports"
    identity: opaque
    exclusive_operations:
      - "POST /sensory-lab/study-reports/{id}/qa-approve, qa-return, qa-reject"
      - "POST /sensory-lab/claims/{id}/verify"
    shared_operations:
      - "all GET endpoints"
      - "GET /sensory-lab/studies/{id}/correlation"

  - name: Client
    description: "Sponsoring client; reviews reports and requests changes on own studies"
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /sensory-lab/study-reports/{id}/request-changes"
    shared_operations:
      - "all GET endpoints"
