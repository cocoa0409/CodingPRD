      - name: instructor_rest_gap_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_INSTRUCTOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: Instructor; interval semantics: BUFFER — one full rest day required, so
          an offering starting 2026-09-11 after one ending 2026-09-10 CONFLICTS (zero rest
