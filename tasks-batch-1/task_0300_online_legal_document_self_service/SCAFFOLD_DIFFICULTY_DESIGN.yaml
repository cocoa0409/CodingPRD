        grounds:
          - validations[priority=14]
          - state_machines.AttorneyReview.REQUESTED_to_ASSIGNED
          - entities.AttorneyReview.fields.window_start
          - entities.AttorneyReview.fields.window_end
        distinguishing_aspect: |
          Resource = Attorney. Half-open [window_start, window_end) interval semantics:
          [10:00,12:00) then [11:00,13:00) overlaps -> rejected; a [12:00,14:00) back-to-back
          request would be allowed (touching boundary does not overlap).
