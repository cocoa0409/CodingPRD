    code: 200
    input: ["appointment_id?", "route_day_id?", "limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []
  - method: GET
    path: "/route-stops/{id}"
    description: "Get a RouteStop"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: POST
    path: "/route-days/{id}/lock"
    description: "Lock the route day (OPEN -> LOCKED); deploys vehicle"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["posture -> LOCKED; RollingClinic -> DEPLOYED; Clinician -> ON_ROUTE"]
  - method: POST
    path: "/route-days/{id}/reconcile"
    description: "Reconcile controlled stock and close the route (LOCKED -> RECONCILED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["controlled_reconciled_ml recompute; RollingClinic -> IN_DEPOT; Clinician -> AVAILABLE"]

  # ---- Estimate / Payment ----
  - method: POST
    path: "/estimates"
    description: "Create a DRAFT Estimate for an appointment"
    roles: [Clinician]
    code: 201
    input: [appointment_id, line_items]
    output: Estimate
    side_effects: ["status=DRAFT; subtotal_cents, travel_surcharge_cents, estimate_total_cents computed (estimate_total)"]
  - method: GET
    path: "/estimates/{id}"
    description: "Get an Estimate"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: GET
    path: "/estimates"
    description: "List Estimates; filter by appointment_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []
  - method: PUT
    path: "/estimates/{id}"
    description: "Revise DRAFT estimate line items"
    roles: [Clinician]
    code: 200
    input: [line_items]
    output: Estimate
    side_effects: ["recompute subtotal_cents, estimate_total_cents (estimate_total); increments Estimate.version by 1"]
  - method: POST
    path: "/estimates/{id}/approve"
    description: "Approve a DRAFT estimate (DRAFT -> APPROVED)"
    roles: [Clinician]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status -> APPROVED; line_items locked"]
  - method: POST
    path: "/payments"
    description: "Capture on-site payment for an INVOICED estimate (Appointment AWAITING_PAYMENT -> COMPLETED)"
    roles: [Clinician]
    code: 201
    input: [estimate_id, amount_cents, method]
    output: Payment
    side_effects: ["Payment CAPTURED; Appointment -> COMPLETED; Clinician -> AVAILABLE"]
  - method: GET
    path: "/payments"
    description: "List Payments; filter by estimate_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["estimate_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []
  - method: GET
    path: "/payments/{id}"
    description: "Get a Payment"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---- SpecimenPickup ----
  - method: POST
    path: "/specimen-pickups"
    description: "Record a collected specimen"
    roles: [Clinician]
    code: 201
    input: [appointment_id, specimen_type]
    output: SpecimenPickup
    side_effects: ["status=COLLECTED"]
  - method: GET
    path: "/specimen-pickups"
    description: "List SpecimenPickups; filter by appointment_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "SpecimenPickup[]"
    side_effects: []
  - method: GET
    path: "/specimen-pickups/{id}"
    description: "Get a SpecimenPickup"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: SpecimenPickup
    side_effects: []
  - method: POST
    path: "/specimen-pickups/{id}/transit"
    description: "Mark specimen IN_TRANSIT (COLLECTED -> IN_TRANSIT)"
    roles: [Clinician]
    code: 200
    input: []
    output: SpecimenPickup
    side_effects: ["status -> IN_TRANSIT"]
  - method: POST
    path: "/specimen-pickups/{id}/deliver"
    description: "Mark specimen DELIVERED (IN_TRANSIT -> DELIVERED)"
    roles: [Clinician]
    code: 200
    input: []
    output: SpecimenPickup
    side_effects: ["status -> DELIVERED"]

  # ---- WellnessPlan ----
  - method: POST
    path: "/wellness-plans"
    description: "Enroll a patient in a recurring wellness plan"
    roles: [Dispatcher]
    code: 201
    input: [patient_id, interval_days, anchor_date]
    output: WellnessPlan
    side_effects: ["status=ACTIVE; next_reminder_date computed (next_reminder)"]
  - method: GET
    path: "/wellness-plans"
    description: "List WellnessPlans; filter by patient_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "WellnessPlan[]"
    side_effects: []
  - method: GET
    path: "/wellness-plans/{id}"
    description: "Get a WellnessPlan"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: WellnessPlan
    side_effects: []
  - method: POST
    path: "/wellness-plans/{id}/pause"
    description: "Pause a wellness plan (ACTIVE -> PAUSED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WellnessPlan
    side_effects: ["status -> PAUSED"]
  - method: POST
    path: "/wellness-plans/{id}/resume"
    description: "Resume a paused plan (PAUSED -> ACTIVE); recompute reminder"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WellnessPlan
    side_effects: ["status -> ACTIVE; next_reminder_date recompute (next_reminder)"]
  - method: POST
    path: "/wellness-plans/{id}/end"
    description: "End a wellness plan (-> ENDED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WellnessPlan
    side_effects: ["status -> ENDED"]

  # ---- Referral ----
  - method: GET
    path: "/referrals"
    description: "List Referrals; filter by appointment_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Get a Referral"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/referrals/{id}/acknowledge"
    description: "Hospital acknowledges the referral (OPEN -> ACKNOWLEDGED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> ACKNOWLEDGED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Dispatcher, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced path or body FK id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, or numeric range violation (weight_kg<=0, amount_ml<=0, end<=start)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a legal state for the requested transition" }
  - { id: ERR_ROUTE_NOT_OPEN, http: 409, condition: "RouteDay posture does not permit the operation (stop create needs OPEN; reconcile needs LOCKED)" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Cannot lock a RouteDay with stop_count < 1" }
  - { id: ERR_STOPS_OPEN, http: 409, condition: "Cannot reconcile while any RouteStop is not in {SERVICED, SKIPPED}" }
  - { id: ERR_AREA_NOT_COVERED, http: 409, condition: "patient.home_zip does not resolve to an ACTIVE ServiceArea" }
  - { id: ERR_EUTHANASIA_NOT_PERMITTED, http: 403, condition: "Euthanasia booked in a ServiceArea with euthanasia_allowed == false" }
  - { id: ERR_EUTHANASIA_NOT_REFERABLE, http: 409, condition: "Refer attempted on an EUTHANASIA appointment" }
  - { id: ERR_VET_REQUIRED, http: 403, condition: "Euthanasia route requires the route day clinician to be a VET" }
  - { id: ERR_DEA_INVALID, http: 403, condition: "Controlled-med entry by a non-VET, or a VET whose DEA number is absent or expired against the current clock" }
  - { id: ERR_WITNESS_CONFLICT, http: 403, condition: "WASTE entry witness_vet_id equals administering_vet_id (segregation of duties)" }
  - { id: ERR_DOSE_BELOW_MINIMUM, http: 422, condition: "DISPENSE amount_ml below the euthanasia_dose required_ml floor for the patient weight" }
  - { id: ERR_EUTHANASIA_LOG_INCOMPLETE, http: 409, condition: "complete-visit on a EUTHANASIA appointment lacking both a DISPENSE and a WASTE log entry" }
  - { id: ERR_NO_APPROVED_ESTIMATE, http: 409, condition: "complete-visit with no APPROVED Estimate for the appointment" }
  - { id: ERR_APPT_NOT_IN_VISIT_PHASE, http: 409, condition: "Estimate approve while the linked appointment is not in {SCHEDULED, IN_VISIT}" }
  - { id: ERR_STOP_WINDOW_CONFLICT, http: 409, condition: "RouteStop window overlaps another non-SKIPPED stop on the same RouteDay within the travel buffer" }
  - { id: ERR_VEHICLE_DOUBLE_BOOKED, http: 409, condition: "RouteStop window overlaps a non-SKIPPED stop on another RouteDay sharing the vehicle on the same service_date" }
  - { id: ERR_VEHICLE_UNAVAILABLE, http: 409, condition: "Lock attempted while the assigned RollingClinic is in MAINTENANCE" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "RollingClinic lacks controlled or vaccine stock for the operation" }
  - { id: ERR_CONTROLLED_COUNT_MISMATCH, http: 409, condition: "Reconcile recount (controlled_reconciled_ml) disagrees with the running controlled_stock_ml balance" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment.amount_cents != INVOICED Estimate.invoice_total_cents" }
  - { id: ERR_STALE_ROUTE_DAY_VERSION, http: 412, condition: "expected_route_day_version != current RouteDay.version on stop creation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Books appointments, builds route days, manages patients/vehicles/areas and wellness plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-areas / suspend — manage coverage"
      - "POST /clinicians, POST /rolling-clinics, PATCH /rolling-clinics/{id} — manage staff & fleet"
      - "POST /patients — register patients"
      - "POST /appointments — create visit requests"
      - "POST /route-days, POST /route-days/{id}/stops, POST /route-days/{id}/lock — build & lock routes"
      - "POST /appointments/{id}/cancel — cancel appointments"
      - "POST /wellness-plans (+ pause/resume/end) — manage wellness plans"
    shared_operations:
      - "GET reads across all collections"
  - name: Clinician
    description: "On-site VET or TECH; runs visits, estimates, controlled-med log, payments, specimens, referrals"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /appointments/{id}/arrive, complete-visit, refer — drive the visit lifecycle"
      - "POST /appointments/{id}/euthanasia-log — DEA controlled-med entries"
      - "POST /estimates, PUT /estimates/{id}, POST /estimates/{id}/approve — pricing"
      - "POST /payments — on-site payment capture"
      - "POST /specimen-pickups (+ transit/deliver) — specimen handling"
    shared_operations:
      - "GET reads across all collections"
  - name: ComplianceOfficer
    description: "DEA/controlled-substance oversight; reconciles routes, acknowledges referrals, audits logs"
    identity: "opaque"
    exclusive_operations:
      - "POST /route-days/{id}/reconcile — close & reconcile controlled stock"
      - "POST /referrals/{id}/acknowledge — close referrals"
    shared_operations:
      - "GET reads across all collections (including controlled-logs audit trail)"
