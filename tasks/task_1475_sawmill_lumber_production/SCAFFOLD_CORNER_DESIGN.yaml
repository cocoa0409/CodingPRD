            - "LumberPackage.${pkg}.status stays STAMPED with sales_order_id null"

      - name: byproduct_oversale_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "calculations.byproduct_on_hand", "errors[ERR_INSUFFICIENT_BYPRODUCT]"]
        distinguishing_aspect: "Selling 11 tons of SAWDUST against 10 on-hand is rejected; inventory is unchanged."
