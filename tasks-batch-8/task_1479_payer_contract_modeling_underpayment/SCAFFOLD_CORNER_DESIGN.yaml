      - name: sm_second_variance_event_restates_existing_case
        claim_type: side_effect_execution
        grounds: ["state_machines.Claim.REMITTANCE_POSTED_to_VARIANCE_FLAGGED", "errors[ERR_CASE_ALREADY_ACTIVE]", "entities.UnderpaymentCase.fields.original_variance_cents"]
        distinguishing_aspect: "At-most-one-active-case invariant (ERR_CASE_ALREADY_ACTIVE is enforced on system creation paths, not via a public endpoint): a second remittance that changes variance restates the SAME case (id stable, original_variance 100000 -> 90000) instead of creating a second one."
        test_recipe:
          setup: ["claim priced 200000; remittance 100000 -> case QUEUED original 100000"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SV", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
