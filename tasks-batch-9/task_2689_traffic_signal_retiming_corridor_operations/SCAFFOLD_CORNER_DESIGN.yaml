      - name: duplicate_requester_email_is_matched_case_insensitively
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_REQUESTER_EMAIL
          - entities.Requester.fields.email
          - endpoints[POST /signal-ops/requesters]
        distinguishing_aspect: "Uniqueness on Requester.email folds case: an address differing only in capitalisation is a duplicate, while a genuinely different local part is not. A case-sensitive unique index would admit the second row and silently split one citizen's complaint history across two requesters."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "No requesters exist yet."
          setup_api_calls:
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Citizen", email: "ada@example.org", contact_pref: "EMAIL" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id, r1_email: $.data.email, r1_open: $.data.open_complaint_count, r1_v: $.data.version }
          trigger:
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada C.", email: "ADA@Example.ORG", contact_pref: "PHONE" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { e_dupe: $.data.error_id }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada C.", email: "ada@example.org", contact_pref: "PHONE" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { e_dupe_exact: $.data.error_id }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Bob Citizen", email: "ada.citizen@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r2_id: $.data.id, r2_open: $.data.open_complaint_count }
            - call: "GET /signal-ops/requesters/${r1_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_email_after: $.data.email, r1_name_after: $.data.display_name, r1_v_after: $.data.version }
          assert:
            - "${r1_email} == ada@example.org, ${r1_open} == 0 and ${r1_v} == 1 on creation"
            - "${e_dupe} == ERR_DUPLICATE_REQUESTER_EMAIL with HTTP 409 — ADA@Example.ORG collides case-insensitively"
            - "${e_dupe_exact} == ERR_DUPLICATE_REQUESTER_EMAIL — the exact-match case, for completeness"
            - "${r2_id} is a new id with ${r2_open} == 0 — ada.citizen@example.org is a different address"
            - "${r1_email_after} == ada@example.org, ${r1_name_after} == Ada Citizen and ${r1_v_after} == 1 — the two refused creates neither overwrote nor versioned the existing row"

      - name: priority_config_gates_rank_reuse_budget_exhaustion_and_posture
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CONFIG_NOT_APPROVED
          - errors.ERR_CONFIG_NOT_DEPLOYED
          - errors.ERR_CONFIG_NOT_PROPOSED
          - errors.ERR_DUPLICATE_PRIORITY_RANK
          - errors.ERR_PRIORITY_BUDGET_EXHAUSTED
          - errors.ERR_POSTURE_BLOCKS_DEPLOYMENT
        distinguishing_aspect: "PriorityConfig's two independent axes each produce their own refusal: deploy before approval is ERR_CONFIG_NOT_APPROVED and suspend before deployment is ERR_CONFIG_NOT_DEPLOYED, while a second approval is ERR_CONFIG_NOT_PROPOSED. Rank uniqueness is scoped per (intersection_id, priority_type) so rank 1 is refused for a second EVP config but accepted for a TSP one, and the budget gate is evaluated against unallocated_priority_budget_sec AT THE MOMENT OF THE DEPLOY — an EVP config that swallowed all 21 seconds leaves the TSP deploy with ERR_PRIORITY_BUDGET_EXHAUSTED even though it was approved first."
