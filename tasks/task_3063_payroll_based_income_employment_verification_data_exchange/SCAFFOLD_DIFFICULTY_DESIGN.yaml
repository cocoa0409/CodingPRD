              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verification-products"
              payload: { product_code: "MORTGAGE-I12", tier: "EMPLOYMENT_INCOME", requesting_class: "MORTGAGE", base_fee_cents: 1500, history_months_included: 12, includes_employment_status: true }
              as: PlatformAdmin
              captures: { prd_id: $.data.id }
            - call: "POST /work-number/verifiers"
              payload: { legal_name: "Meridian Home Lending", verifier_class: "MORTGAGE_LENDER", permitted_purpose: "MORTGAGE_CREDIT_DECISION", escrow_balance_cents: 6000 }
              as: PlatformAdmin
              captures: { vfr_id: $.data.id }
            - call: "POST /work-number/verifiers/${vfr_id}/accredit"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/verifiers/${vfr_id}/authorize"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/record-layouts"
