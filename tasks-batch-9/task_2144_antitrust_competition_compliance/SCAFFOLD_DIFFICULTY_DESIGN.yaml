              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_id: $.data.id }
            - call: "POST /compliance/leniency-applications"
              payload: { business_unit_id: "${bu_id}", cartel_code: "EU-ADHES-2022", affected_years: [{ year: 2023, affected_commerce_cents: 1000000010 }, { year: 2024, affected_commerce_cents: 2000000030 }, { year: 2025, affected_commerce_cents: 3000000050 }] }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { la_id: $.data.id }
            - call: "POST /compliance/leniency-applications/${la_id}/marker-request"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /compliance/leniency-applications/${la_id}/disclosure-submission"
              payload: { gravity_pct: 12 }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/leniency-applications/${la_id}/marker-decisions"
              payload: { decision: "GRANTED" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/leniency-applications/${la_id}/disclosure-decision"
              payload: { decision: "ACCEPTED" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          assert:
            - "immediately after the disclosure-submission call: LeniencyApplication.${la_id}.disclosure_status == SUBMITTED while LeniencyApplication.${la_id}.marker_status == MARKER_REQUESTED"
            - "immediately after the disclosure-submission call: LeniencyApplication.${la_id}.priority_rank == null and LeniencyApplication.${la_id}.estimated_penalty_cents == 864000013"
            - "immediately after the marker-decisions call: LeniencyApplication.${la_id}.priority_rank == 1 and LeniencyApplication.${la_id}.estimated_penalty_cents == 0"
            - "final LeniencyApplication.${la_id}.marker_status == PERFECTED"
            - "final LeniencyApplication.${la_id}.disclosure_status == ACCEPTED"
            - "final LeniencyApplication.${la_id}.estimated_penalty_cents == 0"
            - "BusinessUnit.${bu_id}.posture == FROZEN"

