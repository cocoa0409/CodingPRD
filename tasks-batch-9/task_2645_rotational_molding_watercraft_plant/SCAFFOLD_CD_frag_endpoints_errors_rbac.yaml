            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po5}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T13:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po5_v1}" }
