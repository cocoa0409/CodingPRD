              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { st1: "$.data.status", rec1: "$.data.received_at", ver2: "$.data.version" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
