              payload: { to_rep_id: "${v_id}", lot_id: "${lot_id}", quantity: 6, reason_code: "REBALANCE", documentation_note: "Action endpoint probe transfer ok", expected_lot_version: "${lot_v} + 1" }
              as: FieldRep
              as_user_id: "${s_id}"
              captures: { tr_id: $.data.id }
          trigger:
