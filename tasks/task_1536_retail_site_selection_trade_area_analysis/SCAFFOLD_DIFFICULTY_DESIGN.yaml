  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OCCUPANCY_RATIO_RED]
        distinguishing_aspect: |
          Error-category pair state(5) vs business_fiscal(10): the request
          violates both — site A is MODELED (not FORECAST_LOCKED) and the
          referenced forecast (of site B) has band RED — and the state error
          ERR_INVALID_STATE must win because priority 5 precedes priority 10.
