  # ===========================================================================
  # R6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: service_year_threshold_at_679_versus_680_pension_days
        grounds:
          - calculations.player_service_time
          - entities.Player.fields.pension_credit_days
          - entities.Player.fields.service_years
          - entities.Player.fields.contract_rights_class
        distinguishing_aspect: |
          The boundary metric is an integer day count against SERVICE_DAYS_PER_SEASON 170 on
          POST /players: 680 pension days is exactly 4 * 170 and yields service_years 4 with
          UNRESTRICTED rights, while 679 days yields service_years 3 with ARBITRATION_ELIGIBLE
          — a one-day difference flips the player's future contract rights.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; no clubs or contracts are required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /players"
              payload: { full_name: "Boundary High", position: "DL", accrued_active_days: 500, accrued_reserve_days: 100, accrued_ir_days: 80 }
              as: LeagueOfficer
              captures: { p_hi_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Boundary Low", position: "DL", accrued_active_days: 500, accrued_reserve_days: 100, accrued_ir_days: 79 }
              as: LeagueOfficer
              captures: { p_lo_id: $.data.id }
          assert:
            - "Player.${p_hi_id}.pension_credit_days == 680 and service_years == 4"
            - "Player.${p_hi_id}.contract_rights_class == UNRESTRICTED"
            - "Player.${p_hi_id}.roster_service_days == 640"
            - "Player.${p_lo_id}.pension_credit_days == 679 and service_years == 3"
            - "Player.${p_lo_id}.contract_rights_class == ARBITRATION_ELIGIBLE"
            - "Player.${p_lo_id}.roster_service_days == 639 (floor(79 * 0.5) == 39, not 39.5)"
            - "the single accrued_ir_days difference of 1 changes contract_rights_class"

      - name: waiver_survivor_set_empties_only_after_elimination_and_clears
        grounds:
          - calculations.waiver_award_cap_resolution
          - state_machines.WaiverRequest.PENDING_to_CLEARED
          - state_machines.WaiverClaim.SUBMITTED_to_INVALIDATED
          - entities.WaiverRequest.fields.claim_count
          - entities.WaiverRequest.fields.awarded_to_team_id
        distinguishing_aspect: |
          A different boundary metric on a different endpoint than the first instance — the
          cardinality of the survivor collection at POST /waiver-requests/{id}/process: exactly
          one claim was submitted (claim_count 1, so the candidate set is non-empty) yet the
          survivor set is empty after the cap stage, and the empty-set branch CLEARED must be
          taken rather than awarding the only claim.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Releasing club Harbor Kings (rank 5, cap 500000000) with Ray Alder on an ACTIVE 3-year contract (base 80000000, signing bonus 10000000)."
            - "Claiming club Basin Otters (rank 1) with salary_cap_limit_cents 50000000 and no contracts, so its live cap_space_cents 50000000 is below the 80000000 base salary it would assume."
