            - call: "POST /correspondent/financial-statements/${fs_stale}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s_stale}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q_stale: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q_stale}/complete"
              payload: { findings_count: 1, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Willow Creek Mortgage Co", tin: "662317249", seller_type: "BANK" }
