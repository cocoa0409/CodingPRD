# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3183_dealer_satisfaction_survey_administration_incentive_qualification
#
# Breadth probe. Enumerates every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: region_create_returns_declared_fields
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/survey/regions
        distinguishing_aspect: "POST /survey/regions with code+name returns 201 with system-generated id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; empty DB."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          assert:
            - "HTTP status == 201 and response_type == object"
            - "Region.${rid}.code == NE and name == Northeast"
            - "Region.${rid}.version == 1"
            - "meta.api_request_id present"

      - name: dealer_create_returns_default_posture_and_counters
        claim_type: Defaults
        grounds:
          - entities.Dealer
          - endpoints.POST_/survey/dealers
        distinguishing_aspect: "A Dealer created with no posture/flag inputs defaults posture=GOOD_STANDING, confirmed_flag_count=0, current_score_adjusted=null, current_response_rate=null."
        test_recipe:
          setup: ["Region R exists."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "Acme", dealer_code: "ACME" }
              as: PlatformAdmin
              captures: { did: $.data.id }
          assert:
            - "Dealer.${did}.posture == GOOD_STANDING"
            - "Dealer.${did}.confirmed_flag_count == 0"
            - "Dealer.${did}.current_score_adjusted is null"
            - "Dealer.${did}.current_response_rate is null"

      - name: dealer_create_duplicate_dealer_code_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Dealer.fields.dealer_code
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Second POST /survey/dealers with the same dealer_code returns ERR_VALIDATION (400); uniqueness is global, not per region."
        test_recipe:
          setup: ["Region R; one dealer with dealer_code=DUP."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "DUP" }
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "B", dealer_code: "DUP" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: question_set_create_invalid_comparability_factor_rejected
        claim_type: Type Constraints
        grounds:
          - entities.QuestionSet.fields.comparability_factor
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "comparability_factor must lie in (0.5, 1.5]; 0.5 is rejected (exclusive lower bound), 1.5 is accepted (inclusive upper bound)."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/question-sets"
              payload: { code: "QS-X", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 0.5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: dealer_get_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Dealer
          - endpoints.GET_/survey/dealers/{id}
        distinguishing_aspect: "GET /survey/dealers/{id} round-trips name, dealer_code, region_id exactly as posted."
        test_recipe:
          setup: ["Region and Dealer created."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "Acme", dealer_code: "ACME" }
              as: PlatformAdmin
              captures: { did: $.data.id }
          trigger:
            - call: "GET /survey/dealers/${did}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 200; name == Acme; dealer_code == ACME; region_id == ${rid}"

      - name: dealer_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/survey/dealers/{id}
        distinguishing_aspect: "GET /survey/dealers/{random_uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /survey/dealers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: dealers_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/survey/dealers
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three dealers, limit=2 returns 2 rows, total_count=3, has_more=true; offset=2 returns 1 row, has_more=false."
        test_recipe:
          setup: ["Region R; three dealers D_A, D_B, D_C."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "A" }
              as: PlatformAdmin
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "B", dealer_code: "B" }
              as: PlatformAdmin
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "C", dealer_code: "C" }
              as: PlatformAdmin
          trigger:
            - call: "GET /survey/dealers"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "HTTP 200; response_type == array"
            - "page data length == 2; meta contains limit/offset/total_count/has_more"
            - "total_count == 3 and has_more == true"

      - name: transaction_create_required_margin_missing
        claim_type: Required Fields
        grounds:
          - entities.Transaction.fields.margin_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /survey/transactions missing required margin_cents -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Region, dealer, dept, customer exist."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "A" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${did}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${did}", department_id: "${dep}", customer_id: "${cid}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: transaction_common_fields_false_immutability
        claim_type: Immutability
        grounds:
          - entities.Transaction
        distinguishing_aspect: "Transaction has common_fields:false; response includes id and created_at but NOT updated_at or version."
        test_recipe:
          setup: ["Region, dealer, dept, customer exist."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "A" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${did}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${did}", department_id: "${dep}", customer_id: "${cid}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
          assert:
            - "Transaction.${tid} has id and created_at"
            - "Transaction.${tid} does NOT have updated_at field (common_fields: false)"
            - "Transaction.${tid} does NOT have version field"

      - name: customer_create_do_not_contact_default_false
        claim_type: Defaults
        grounds:
          - entities.Customer.fields.do_not_contact
        distinguishing_aspect: "Omitting do_not_contact on POST /survey/customers defaults it to false."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          assert:
            - "Customer.${cid}.do_not_contact == false"

      - name: advisor_create_employee_ref_unique_per_department
        claim_type: Type Constraints
        grounds:
          - entities.Advisor.fields.employee_ref
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Two advisors in the same department with the same employee_ref rejected; same employee_ref in a different department allowed."
        test_recipe:
          setup: ["Region, dealer, two departments SALES and SERVICE."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "A" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${did}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dep_s: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${did}", kind: "SERVICE", name: "Service" }
              as: PlatformAdmin
              captures: { dep_v: $.data.id }
            - call: "POST /survey/advisors"
              payload: { department_id: "${dep_s}", name: "Joe", employee_ref: "E1" }
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/advisors"
              payload: { department_id: "${dep_s}", name: "Jane", employee_ref: "E1" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 400"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: question_set_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.QuestionSet
          - entities.QuestionSet.fields.status
        distinguishing_aspect: "Freshly created QuestionSet has status=DRAFT."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/question-sets"
              payload: { code: "QS-Z", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs: $.data.id }
          assert:
            - "QuestionSet.${qs}.status == DRAFT"

      - name: question_set_retire_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.QuestionSet
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once a QuestionSet is RETIRED, POST activate is rejected with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["QS created, activated, retired."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/question-sets"
              payload: { code: "QS-Z", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs: $.data.id }
            - call: "POST /survey/question-sets/${qs}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/question-sets/${qs}/retire"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /survey/question-sets/${qs}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: invitation_opt_out_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.SurveyInvitation
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After OPTED_OUT, attempting to send the invitation returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Region, dealer, dept, customer, QS ACTIVE, wave opened, invitation I in QUEUED; customer opts out."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "A" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${did}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-Z", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs: $.data.id }
            - call: "POST /survey/question-sets/${qs}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs}" }
              as: PlatformAdmin
              captures: { wid: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${did}", department_id: "${dep}", customer_id: "${cid}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 100 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wid}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wid}/invitations"
              payload: {}
              as: PlatformAdmin
              captures: { inv: "$.data[0].id" }
            - call: "POST /survey/invitations/${inv}/opt-out"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /survey/invitations/${inv}/send"
              payload: {}
              as: SurveyVendor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: appeal_invalid_from_filed_decide_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Appeal
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /survey/appeals/{id}/decide while appeal is FILED (not UNDER_REVIEW) rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Region, dealer, dept, customer, QS, wave opened; invitation sent; response R; appeal A FILED (not assigned)."]
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "A", dealer_code: "A" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${did}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-Z", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs: $.data.id }
            - call: "POST /survey/question-sets/${qs}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs}" }
              as: PlatformAdmin
              captures: { wid: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${did}", department_id: "${dep}", customer_id: "${cid}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 100 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wid}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wid}/invitations"
              payload: {}
              as: PlatformAdmin
              captures: { inv: "$.data[0].id" }
            - call: "POST /survey/invitations/${inv}/send"
              payload: {}
              as: SurveyVendor
            - call: "POST /survey/invitations/${inv}/responses"
              payload: { answers: [{question_code: "q1", score: 5}] }
              as: Customer
              as_user_id: "${cid}"
              captures: { resp: $.data.id, resp_v: $.data.version }
            - call: "POST /survey/appeals"
              payload: { response_id: "${resp}", reason: "test", expected_response_version: "${resp_v}" }
              as: DealerPrincipal
              as_user_id: "${did}"
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /survey/appeals/${ap}/decide"
              payload: { outcome: "UPHELD", decision_rationale: "x" }
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: appeal_decide_upheld_side_effect_excludes_response
        claim_type: side_effect_execution
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
          - state_machines.SurveyResponse.FLAGGED_to_EXCLUDED
        distinguishing_aspect: "After UPHELD decide, the linked response becomes EXCLUDED with excluded_reason=APPEAL_UPHELD."
        excluded_because:
          difficulty_instance: appeal_response_fork_join_per_response_guard
          rationale: "Asserted as the UPHELD branch of the named §1.8 instance."

      - name: wave_close_expires_queued_and_sent_invitations
        claim_type: side_effect_execution
        grounds:
          - state_machines.SurveyWave.OPEN_to_CLOSED
          - state_machines.SurveyInvitation
        distinguishing_aspect: "Wave close transitions QUEUED and SENT invitations to EXPIRED and updates wave counters."
        excluded_because:
          difficulty_instance: wave_close_cascade_to_dealer_posture_and_invitations
          rationale: "Cascade side-effect asserted in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: regional_benchmark_tied_dealers_share_rank
        claim_type: Correct Result
        grounds:
          - calculations.regional_benchmark
        distinguishing_aspect: "Two dealers with equal adjusted score in the same region share the same rank; percentile uses rank = 1 + count(strictly greater)."
        test_recipe:
          setup:
            - "Region NE; Dealers DA, DB, DC."
            - "QS ACTIVE; Wave W [2026-09-01, 2026-10-01)."
            - "Each dealer has 1 transaction + 1 response: DA score=10 (1000), DB score=9 (900), DC score=9 (900)."
            - "Wave closed."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "NE", name: "Northeast" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${rid}", name: "DA", dealer_code: "DA" }
              as: PlatformAdmin
              captures: { da: $.data.id }
            - call: "POST /survey/dealers"
