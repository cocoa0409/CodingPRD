        excluded_because:
          difficulty_instance: cross_entity_state_dependency / fund_requires_community_operator_agreement_executed
          rationale: "That §1.8 instance funds the same loan before and after the operator agreement is executed, covering both the valid and invalid sides of this cross-entity dependency."
