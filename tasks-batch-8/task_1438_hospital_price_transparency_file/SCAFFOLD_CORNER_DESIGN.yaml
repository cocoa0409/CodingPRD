            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer }
            - { call: "GET /transparency/publication-cycles/${cy}/machine-readable-files", as: TransparencyOfficer, captures: { rc2: "$.data[0].record_count", tot2: "$.data[0].summary_total_discounted_cents" } }
          assert:
