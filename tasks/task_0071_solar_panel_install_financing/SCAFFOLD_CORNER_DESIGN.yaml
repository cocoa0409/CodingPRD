              payload: { project_id: "${p}", utility_id: "${u}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/interconnection-applications/${ia}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /solar/srecs/${s1}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /solar/srecs/${s2}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "GET /solar/projects/${p}"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
              captures: { p_vnow: $.data.version }
          trigger:
            - call: "POST /solar/srec-sales"
              payload: { project_id: "${p}", broker_id: "${br}", vintage_year: 2026, price_cents_per_srec: 30000, expected_project_version: "${p_vnow} - 1" }
              as: SrecBroker
              as_user_id: "${br}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_PROJECT_VERSION"

      - name: version_increments_on_each_project_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Project.fields.version]
        distinguishing_aspect: "Project.version starts at 1 on create and increments by 1 on each mutating transition (assess -> 2, design -> 3)."
        test_recipe:
          setup: ["A REQUESTED project."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "vi@x.com", full_name: "Vi One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { v: $.data.version }
          assert:
            - "Project.${p}.version == 3"

      - name: cascade_lifetime_srec_count_reconciled
        claim_type: derived_field_reconciliation
        grounds: [entities.Project.fields.lifetime_srec_count]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settle_period_requires_project_operational
          rationale: "lifetime_srec_count reconciliation is asserted in the srecs_reverse_reachable_by_project_id endpoint corner (== 2); not duplicated here."

  # ===================================================================
  - section: consistency_model
    instances:
      - name: design_changes_visible_in_same_response
        claim_type: immediate
        grounds: [calculations.size_system, calculations.itc_credit]
        distinguishing_aspect: "The design POST response immediately reflects computed system_size_kw, estimated_annual_production_kwh, and itc_credit_cents (no read-after-write lag)."
        test_recipe:
          setup: ["An ASSESSED project (roof 700, psh 5.0, shade 0.10)."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "cm@x.com", full_name: "Cm One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { sz: $.data.system_size_kw, itc: $.data.itc_credit_cents }
          assert:
            - "the design response data.system_size_kw == 7.3"
            - "the design response data.itc_credit_cents == 900000"
