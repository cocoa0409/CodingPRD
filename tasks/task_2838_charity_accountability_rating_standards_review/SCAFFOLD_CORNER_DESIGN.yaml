  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_rule_filing_create_stale_organization
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.filing-create-stale-organization
          - validations[priority=9]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/filing-records
          - endpoints.POST_/organizations
          - entities.Organization
        distinguishing_aspect: |
          The §1.2.1 rule filing-create-stale-organization exists because a second
          submission for the same (organization_id, fiscal_year, source_kind) triple
          is allowed to displace the first once validated, so the write is only safe
          if the submitter has seen the state it is overwriting. The instance walks
          the full loop - read version, write, observe the increment, retry with the
          version that is now one behind, then re-read and succeed - and adds the
          case a naive implementation gets wrong: a version from the FUTURE is just
          as stale as one from the past, because the test is equality, not
          monotonicity. It also pins that a rejected write is a complete no-op, since
          a 412 that still bumped the parent version would poison every client's
          cached version.
        test_recipe:
          setup:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { v_read: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "FORM_990", total_expense_cents: 4000000, program_expense_cents: 3000000, fundraising_expense_cents: 600000, admin_expense_cents: 400000, contributions_cents: 3500000, total_revenue_cents: 4200000, net_assets_cents: 2400000, total_liabilities_cents: 400000, expected_organization_version: "${v_read}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f_first: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
