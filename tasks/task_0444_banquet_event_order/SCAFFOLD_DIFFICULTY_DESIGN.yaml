              payload: { account_name: "Lambda Mtg", event_date: "2027-06-01", setup_style: "THEATER", expected_attendance: 50 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-06-01T18:00:00Z", end_utc: "2027-06-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
              captures: { rental: $.data.rental_charge_cents }
          assert:
            - "FunctionRoomBooking.${booking_id}.rental_charge_cents == 200000"
            - "FunctionRoomBooking.${booking_id}.hold_status == DEFINITE"

      - name: confirm_space_empty_bookings_set_boundary
        grounds:
          - validations[priority=5]
          - errors[ERR_NO_BOOKINGS]
          - state_machines.Event.INQUIRY_to_TENTATIVE
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT metric and endpoint: calling hold on an
          event with zero FunctionRoomBooking rows returns ERR_NO_BOOKINGS rather than
          advancing to TENTATIVE — the count-zero edge, not a numeric threshold.
        test_recipe:
          setup:
            - "Fresh INQUIRY event with no bookings."
          setup_api_calls:
