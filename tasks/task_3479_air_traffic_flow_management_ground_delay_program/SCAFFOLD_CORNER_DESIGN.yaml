          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:20:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f2: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
          trigger:
            - call: "POST /atfm/tmis/${tmi}/substitutions"
              payload: { flight_id_1: "${f1}", flight_id_2: "${f2}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { tx_to: $.data.to_slot_time }
            - call: "GET /atfm/flights/${f1}"
              as: FlowManager
              captures: { f1_cta: $.data.controlled_arrival }
          assert:
            - "tx_to == 2026-09-15T13:10:00Z (the swap is visible in the mutation response itself)"
            - "f1_cta == 2026-09-15T13:10:00Z on the immediately following read"
