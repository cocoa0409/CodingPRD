      - name: dietary_note_prep_rejection_amend_loop
        grounds:
          - state_machines.DietaryNote.ack_status
          - entities.DietaryNote.fields.amend_count
          - validations.priority_31_ERR_DIETARY_NOTE_PREP_REJECTED
          - validations.priority_30_ERR_DIETARY_ACK_REQUIRED
        distinguishing_aspect: |
          The note leaves and re-enters PENDING through PREP_REJECTED, and the
          two visits to PENDING are not equivalent: the first has amend_count 0
          and reject_reason_code null, the second has amend_count 1 and a
          cleared reject_reason_code, and only the second can be accepted
          without another rejection being possible under the amend ceiling. The
          gate this loop controls sits on a DIFFERENT entity (the Reservation's
          assign-table edge), so the same table assignment is refused for two
          different reasons before it succeeds. This is the re-entrant loop
          shape.
