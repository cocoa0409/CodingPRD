              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_POSTURE (state priority 8 beats fiscal priority 14)"
            - "http status == 409, not 422"
            - "no OverdraftAdvance created; account outstanding_cushion_cents unchanged at 0"

      - name: safety_vs_temporal_conflict_on_post_early
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_ABUSE_LOCK]
