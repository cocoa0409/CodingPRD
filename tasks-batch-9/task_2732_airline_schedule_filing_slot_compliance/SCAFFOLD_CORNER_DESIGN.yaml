            - "a second POST /schedule-versions/${sv_id}/validate returns HTTP 409 with data.error_id == \"ERR_SCHEDULE_VERSION_STATE_INVALID\" because validate requires DRAFT"

      - name: carrier_suspension_cascades_down_to_its_draft_schedule_versions
        claim_type: cascade_down
        grounds:
          - state_machines.Carrier.ACTIVE_to_SUSPENDED
          - "validations.priority_30_ERR_CARRIER_SUSPENDED"
        distinguishing_aspect: |
          Suspending a carrier moves every one of its ScheduleVersions with filing_status in
          {DRAFT, VALIDATED} to WITHDRAWN in a single call, and afterwards the carrier can create
          nothing new: POST /schedule-versions returns ERR_CARRIER_SUSPENDED (409). Two versions are
          present so the cascade is proven to be a set operation, not a single-row update.
        test_recipe:
          setup:
            - "Home carrier HX ACTIVE; Season W26 OPEN; two ScheduleVersions W26-S1 and W26-S2, both DRAFT."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-S1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv1_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-S2" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv2_id: "$.data.id" }
          trigger:
            - call: "POST /carriers/${home_carrier_id}/suspend"
              payload: { reason: "AOC_SUSPENDED_BY_REGULATOR" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-S3" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 -> HTTP 200; Carrier.${home_carrier_id}.status == \"SUSPENDED\""
            - "ScheduleVersion.${sv1_id}.filing_status == \"WITHDRAWN\" AND ScheduleVersion.${sv2_id}.filing_status == \"WITHDRAWN\" — both, from one call"
            - "trigger call 2 -> HTTP 409 with data.error_id == \"ERR_CARRIER_SUSPENDED\""
            - "GET /schedule-versions?carrier_id=${home_carrier_id} returns total_count == 2"

      - name: slot_audit_lets_the_eighty_percent_series_live_and_takes_the_sixty_percent_one
        claim_type: cross_entity
        grounds:
          - state_machines.SlotHolding.HELD_to_LOST
          - calculations.slot_utilization_credit
          - "validations.priority_28_ERR_SLOT_AUDIT_ALREADY_RUN"
          - endpoints.POST_seasons_season_id_slot_audit
        distinguishing_aspect: |
          One coordinator call reads eight SlotUtilizationRecords across two holdings and writes both
          the holdings and the Season: the 4-of-5 series (80.00, NOT strictly below the threshold) stays
          HELD while the 3-of-5 series (60.00, credited from OPERATED + OPERATED + CANCELLED_ATC, with
          CANCELLED_CARRIER excluded) moves to LOST. A second audit must be refused with
          ERR_SLOT_AUDIT_ALREADY_RUN so the season cannot be re-swept.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; Season W26 driven OPEN then CLOSED (slot-audit requires CLOSED at priority 27)."
            - "Holding A at 2026-11-02T08:00:00Z days_of_week \"1\" series_weeks 5, historic_precedence true, with four records: OPERATED, OPERATED, CANCELLED_ATC, CANCELLED_CARRIER -> credited_operations 3 -> utilization_pct 60.00."
            - "Holding B at 2026-11-02T09:00:00Z days_of_week \"1\" series_weeks 5, historic_precedence true, with four OPERATED records -> credited_operations 4 -> utilization_pct 80.00."
            - "No legs are attached to either holding, so attached_operations is 0 and at_risk_of_loss is false on both — the audit must act on the as_operated variant alone."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: true }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { shA_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T09:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: true }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { shB_id: "$.data.id" }
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shA_id}", operation_date: "2026-11-02T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shA_id}", operation_date: "2026-11-09T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shA_id}", operation_date: "2026-11-16T00:00:00Z", outcome: "CANCELLED_ATC" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shA_id}", operation_date: "2026-11-23T00:00:00Z", outcome: "CANCELLED_CARRIER" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shB_id}", operation_date: "2026-11-02T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shB_id}", operation_date: "2026-11-09T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shB_id}", operation_date: "2026-11-16T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${shB_id}", operation_date: "2026-11-23T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "CLOSED" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
