scenario: 'Professional Development Catalog & Credit Management (district PD office): course catalog & registration with seat limits, clock hours vs credit conversion & salary-lane advancement, attendance
  verification & evaluation survey, external workshop pre-approval & reimbursement, individual growth plan alignment, required compliance training assignment & deadline, transcript of PD & audit, budget
  allocation by building

  '
domain_name: pd-catalog-credit
api_prefix: /pd
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - self_referential
  - polymorphic
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Building
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Building display name
  - name: building_code
    type: string
    source: input
    description: Unique building code
    constraints: unique across all buildings
  - name: status
    type: enum
    source: input
    description: ACTIVE | CLOSED
    default: ACTIVE
- name: Employee
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Employee full name
  - name: email
    type: string
    source: input
    description: Employee email
    constraints: unique across all employees
  - name: employee_kind
    type: enum
    source: input
    description: TEACHER | ADMIN | SPECIALIST
  - name: primary_building_id
    type: string
    source: input
    description: FK -> Building.id; home building whose budget pays for this employee's PD
  - name: base_lane
    type: enum
    source: input
    description: BA | BA15 | MA | MA15 | MA30 | DOC; lane at hire
  - name: current_lane
    type: enum
    source: computed
    description: BA | BA15 | MA | MA15 | MA30 | DOC; starts == base_lane, bumped by advance-lane
  - name: status
    type: enum
    source: system
    description: ACTIVE | ON_LEAVE | SEPARATED
    default: ACTIVE
  - name: lane_credit_balance
    type: number
    source: computed
    description: Sum of district_credit over AWARDED TranscriptEntry (counts_toward_lane=true) minus 12.0 per completed lane advancement
  - name: last_advancement_fiscal_year
    type: integer
    source: system
    description: Fiscal year of most recent lane advancement; null if none
    default: null
  - name: compliance_standing
    type: enum
    source: computed
    description: COMPLIANT | NON_COMPLIANT; NON_COMPLIANT iff any ComplianceAssignment ESCALATED
    default: COMPLIANT
- name: BuildingBudget
  parent: null
  common_fields: true
  fields:
  - name: building_id
    type: string
    source: input
    description: FK -> Building.id; owning building
  - name: fiscal_year
    type: integer
    source: input
    description: 'Fiscal year label: fiscal_year(d) = d.year if d.month >= 7 else d.year-1'
  - name: allocated_cents
    type: integer
    source: input
    description: Annual PD allocation
    constraints: '>= 0'
  - name: status
    type: enum
    source: system
    description: DRAFT | OPEN | CLOSED
    default: DRAFT
  - name: encumbered_cents
    type: integer
    source: computed
    description: Sum of outstanding encumbrances (registrations + approved workshops)
  - name: spent_cents
    type: integer
    source: computed
    description: Sum of settled charges (completed registrations + reimbursed workshops)
  - name: available_cents
    type: integer
    source: computed
    description: allocated_cents - encumbered_cents - spent_cents (encumbrance basis; the blocking variant)
  constraints_note: (building_id, fiscal_year) unique
- name: Course
  parent: null
  common_fields: true
  fields:
  - name: course_code
    type: string
    source: input
    description: Unique catalog code
    constraints: unique
  - name: title
    type: string
    source: input
    description: Course title
  - name: delivery_mode
    type: enum
    source: input
    description: IN_PERSON | VIRTUAL | HYBRID
  - name: clock_hours
    type: number
    source: input
    description: Total contact hours
    constraints: '> 0'
  - name: fee_cents
    type: integer
    source: input
    description: Per-registrant fee charged to the registrant's building budget
    default: 0
    constraints: '>= 0'
  - name: compliance_tag
    type: string
    source: input
    description: Compliance program tag (e.g. SAFETY_101); null = elective
    default: null
  - name: recurrence_months
    type: integer
    source: input
    description: If set, satisfying a compliance assignment spawns the next assignment due completed_at + recurrence_months
    default: null
  - name: prerequisite_course_id
    type: string
    source: input
    description: FK -> Course.id; self-referential prerequisite; null = none
    default: null
  - name: status
    type: enum
    source: system
    description: ACTIVE | RETIRED
    default: ACTIVE
- name: Section
  parent: null
  common_fields: true
  fields:
  - name: course_id
    type: string
    source: input
    description: FK -> Course.id
  - name: term
    type: string
    source: input
    description: Term label, e.g. 2026-FALL
  - name: instructor_id
    type: string
    source: input
    description: FK -> Employee.id; assigned instructor (attendance authority)
  - name: building_id
    type: string
    source: input
    description: FK -> Building.id; hosting building (NOT the billing building)
  - name: room
    type: string
    source: input
    description: Room label used for room-conflict checks on meetings
  - name: seat_capacity
    type: integer
    source: input
    description: Maximum REGISTERED registrations
    constraints: '>= 1'
  - name: fee_cents
    type: integer
    source: input
    description: Section fee override; defaults to course.fee_cents at creation
    constraints: '>= 0'
  - name: starts_at
    type: datetime
    source: input
    description: Session start (UTC)
  - name: ends_at
    type: datetime
    source: input
    description: Session end (UTC); must be > starts_at
  - name: registration_opens_at
    type: datetime
    source: input
    description: Registration window open (UTC)
  - name: registration_closes_at
    type: datetime
    source: input
    description: Registration window close (UTC); must be >= opens and <= starts_at
  - name: status
    type: enum
    source: system
    description: DRAFT | PUBLISHED | REGISTRATION_CLOSED | IN_SESSION | COMPLETED | CANCELED
    default: DRAFT
  - name: seats_registered
    type: integer
    source: computed
    description: Count of registrations in REGISTERED
  - name: seats_open
    type: integer
    source: computed
    description: seat_capacity - seats_registered
- name: SectionMeeting
  parent: null
  common_fields: true
  fields:
  - name: section_id
    type: string
    source: input
    description: FK -> Section.id
  - name: starts_at
    type: datetime
    source: input
    description: Meeting start; must be within section [starts_at, ends_at]
  - name: ends_at
    type: datetime
    source: input
    description: Meeting end; > starts_at and within section window
  - name: room
    type: string
    source: input
    description: Room label; same-room meetings need a 30-minute turnover gap
- name: Registration
  parent: null
  common_fields: true
  fields:
  - name: teacher_id
    type: string
    source: input
    description: FK -> Employee.id; the registrant
  - name: section_id
    type: string
    source: input
    description: FK -> Section.id
  - name: growth_plan_id
    type: string
    source: input
    description: FK -> GrowthPlan.id; optional alignment target
    default: null
  - name: aligned_focus_area
    type: string
    source: input
    description: Focus area string from the plan; required iff growth_plan_id present
    default: null
  - name: status
    type: enum
    source: system
    description: REGISTERED | WAITLISTED | DROPPED | WITHDRAWN | EXPIRED | NO_SHOW | COMPLETED
    default: REGISTERED or WAITLISTED per seat availability
  - name: attendance_status
    type: enum
    source: system
    description: PENDING | VERIFIED | ABSENT (parallel dimension)
    default: PENDING
  - name: survey_status
    type: enum
    source: system
    description: PENDING | SUBMITTED | WAIVED (parallel dimension)
    default: PENDING
  - name: waitlist_seq
    type: integer
    source: system
    description: Per-section monotonic waitlist order; set when first WAITLISTED, null while REGISTERED
    default: null
  - name: encumbered_cents
    type: integer
    source: system
    description: Fee currently encumbered against the teacher's building budget (0 while WAITLISTED)
    default: 0
  - name: completed_at
    type: datetime
    source: system
    description: Logical timestamp of completion; null until COMPLETED
    default: null
- name: AttendanceRecord
  parent: null
  common_fields: true
  fields:
  - name: registration_id
    type: string
    source: input
    description: FK -> Registration.id
  - name: meeting_id
    type: string
    source: input
    description: FK -> SectionMeeting.id
  - name: mark
    type: enum
    source: input
    description: PRESENT | ABSENT | EXCUSED (EXCUSED counts as attended)
  - name: recorded_by_user_id
    type: string
    source: system
    description: X-User-ID that recorded/updated the mark
  constraints_note: (registration_id, meeting_id) unique; re-recording overwrites mark
- name: SurveyResponse
  parent: null
  common_fields: false
  fields:
  - name: registration_id
    type: string
    source: input
    description: FK -> Registration.id; one survey per registration
    constraints: unique
  - name: overall_rating
    type: integer
    source: input
    description: Overall rating
    constraints: 1..5
  - name: would_recommend
    type: boolean
    source: input
    description: Would recommend the course
  - name: comments
    type: string
    source: input
    description: Free-text comments
    default: null
  - name: submitted_at
    type: datetime
    source: system
    description: Logical timestamp of submission
- name: TranscriptEntry
  parent: null
  common_fields: true
  fields:
  - name: employee_id
    type: string
    source: system
    description: FK -> Employee.id; transcript owner
  - name: source_type
    type: enum
    source: system
    description: COURSE_COMPLETION | EXTERNAL_WORKSHOP | AUDIT_REVERSAL
  - name: source_id
    type: string
    source: system
    description: 'Polymorphic source id: Registration.id for COURSE_COMPLETION, ExternalWorkshopRequest.id for EXTERNAL_WORKSHOP, reversed TranscriptEntry.id for AUDIT_REVERSAL; not a constrained FK'
  - name: growth_plan_id
    type: string
    source: system
    description: FK -> GrowthPlan.id; copied from the source's alignment, null if unaligned
    default: null
  - name: fiscal_year
    type: integer
    source: computed
    description: 'Fiscal year of awarded_at: year if month >= 7 else year-1'
  - name: clock_hours
    type: number
    source: system
    description: Hours awarded; negative on AUDIT_REVERSAL entries
  - name: district_credit
    type: number
    source: computed
    description: floor(clock_hours * 2 / 3) / 10 (per-entry, round down to 0.1); negative of original on reversal
  - name: state_ceu
    type: number
    source: computed
    description: round(clock_hours / 10, 2) round_half_up; negated on reversal
  - name: counts_toward_lane
    type: boolean
    source: computed
    description: false for compliance-tagged course completions; true otherwise; mirrored on reversal
  - name: status
    type: enum
    source: system
    description: AWARDED | REVERSED
    default: AWARDED
  - name: awarded_at
    type: datetime
    source: system
    description: Logical award timestamp
  - name: reversed_by_entry_id
    type: string
    source: system
    description: TranscriptEntry.id of the AUDIT_REVERSAL entry, once reversed
    default: null
- name: ExternalWorkshopRequest
  parent: null
  common_fields: true
  fields:
  - name: teacher_id
    type: string
    source: input
    description: FK -> Employee.id; requesting teacher
  - name: building_id
    type: string
    source: input
    description: FK -> Building.id; budget charged; defaults to teacher.primary_building_id
  - name: title
    type: string
    source: input
    description: Workshop title
  - name: provider
    type: string
    source: input
    description: External provider name
  - name: starts_at
    type: datetime
    source: input
    description: Workshop start (UTC)
  - name: ends_at
    type: datetime
    source: input
    description: Workshop end (UTC); > starts_at
  - name: est_cost_cents
    type: integer
    source: input
    description: Estimated cost; encumbered at approval
    constraints: '> 0'
  - name: clock_hours_claimed
    type: number
    source: input
    description: Hours the teacher expects to earn
    constraints: '> 0'
  - name: growth_plan_id
    type: string
    source: input
    description: FK -> GrowthPlan.id; optional alignment
    default: null
  - name: status
    type: enum
    source: system
    description: DRAFT | SUBMITTED | APPROVED | REJECTED | ATTENDED | REIMBURSED | REIMBURSEMENT_DENIED | EXPIRED
    default: DRAFT
  - name: revision_count
    type: integer
    source: system
    description: Number of REJECTED -> DRAFT revisions; max 3
    default: 0
  - name: reject_reason
    type: string
    source: system
    description: Reason recorded at last rejection
    default: null
  - name: approved_by_user_id
    type: string
    source: system
    description: X-User-ID of approving BuildingAdmin (segregation-of-duties anchor)
    default: null
  - name: actual_hours
    type: number
    source: system
    description: Hours evidenced at completion
    default: null
  - name: receipt_cents
    type: integer
    source: system
    description: Receipt total evidenced at completion
    default: null
  - name: reimbursed_cents
    type: integer
    source: system
    description: Amount actually reimbursed
    default: null
- name: GrowthPlan
  parent: null
  common_fields: true
  fields:
  - name: teacher_id
    type: string
    source: input
    description: FK -> Employee.id; plan owner
  - name: school_year
    type: string
    source: input
    description: Format YYYY-YYYY with consecutive years, e.g. 2026-2027 = 2026-07-01..2027-06-30
  - name: focus_areas
    type: array
    source: input
    description: Array of focus-area strings; non-empty
  - name: target_credits
    type: number
    source: input
    description: District credits targeted for the year
    constraints: '> 0'
  - name: status
    type: enum
    source: system
    description: DRAFT | SUBMITTED | APPROVED | FULFILLED | CLOSED | SUPERSEDED
    default: DRAFT
  - name: aligned_credits
    type: number
    source: computed
    description: Sum of district_credit over AWARDED TranscriptEntry with growth_plan_id == this plan
- name: ComplianceAssignment
  parent: null
  common_fields: true
  fields:
  - name: employee_id
    type: string
    source: input
    description: FK -> Employee.id; assignee
  - name: course_id
    type: string
    source: input
    description: FK -> Course.id; must be compliance-tagged
  - name: due_date
    type: datetime
    source: input
    description: Deadline (UTC)
  - name: status
    type: enum
    source: system
    description: ASSIGNED | IN_PROGRESS | SATISFIED | OVERDUE | ESCALATED | WAIVED
    default: ASSIGNED
  - name: assigned_by_user_id
    type: string
    source: system
    description: X-User-ID of creating PDCoordinator
  - name: satisfied_at
    type: datetime
    source: system
    description: Logical timestamp of satisfaction
    default: null
  - name: extension_count
    type: integer
    source: system
    description: Number of due-date extensions applied
    default: 0
- name: AuditCase
  parent: null
  common_fields: true
  fields:
  - name: employee_id
    type: string
    source: input
    description: FK -> Employee.id; auditee
  - name: fiscal_year
    type: integer
    source: input
    description: Fiscal year under audit
  - name: status
    type: enum
    source: system
    description: OPEN | FINDINGS_RAISED | RESOLVED | CLOSED_CLEAN
    default: OPEN
  - name: findings_count
    type: integer
    source: computed
    description: Number of findings raised / reversals posted
    default: 0
  - name: opened_by_user_id
    type: string
    source: system
    description: X-User-ID of opening Auditor
state_machines:
- entity: Employee
  field: status
  initial_state: ACTIVE
  terminal_states:
  - SEPARATED
  transitions:
  - from: ACTIVE
    to: ON_LEAVE
    trigger: 'POST /pd/employees/{id}/set-status {status: ON_LEAVE}'
    actor: PDCoordinator
    preconditions:
    - employee.status == ACTIVE
    side_effects:
    - employee.version += 1
  - from: ON_LEAVE
    to: ACTIVE
    trigger: 'POST /pd/employees/{id}/set-status {status: ACTIVE}'
    actor: PDCoordinator
    preconditions:
    - employee.status == ON_LEAVE
    side_effects:
    - employee.version += 1
  - from:
    - ACTIVE
    - ON_LEAVE
    to: SEPARATED
    trigger: 'POST /pd/employees/{id}/set-status {status: SEPARATED}'
    actor: PDCoordinator
    preconditions: []
    side_effects:
    - employee.version += 1
    - WAITLISTED registrations of this employee -> WITHDRAWN (system)
    - REGISTERED registrations whose section is PUBLISHED or REGISTRATION_CLOSED -> DROPPED (system), encumbrance released, waitlist promotion sweep runs per freed seat
- entity: Course
  field: status
  initial_state: ACTIVE
  terminal_states:
  - RETIRED
  transitions:
  - from: ACTIVE
    to: RETIRED
    trigger: POST /pd/courses/{id}/retire
    actor: PDCoordinator
    preconditions:
    - No section of this course in PUBLISHED, REGISTRATION_CLOSED, or IN_SESSION
    side_effects:
    - course.version += 1
- entity: BuildingBudget
  field: status
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  transitions:
  - from: DRAFT
    to: OPEN
    trigger: POST /pd/budgets/{id}/open
    actor: BusinessOfficer
    preconditions:
    - budget.status == DRAFT
    side_effects:
    - budget.version += 1
  - from: OPEN
    to: CLOSED
    trigger: POST /pd/budgets/{id}/close
    actor: BusinessOfficer
    preconditions:
    - budget.encumbered_cents == 0
    side_effects:
    - budget.version += 1
- entity: Section
  field: status
  initial_state: DRAFT
  terminal_states:
  - COMPLETED
  - CANCELED
  transitions:
  - from: DRAFT
    to: PUBLISHED
    trigger: POST /pd/sections/{id}/publish
    actor: PDCoordinator
    preconditions:
    - course.status == ACTIVE
    - section has at least one SectionMeeting
    - registration_opens_at <= registration_closes_at <= starts_at < ends_at
    side_effects:
    - section.version += 1
  - from: PUBLISHED
    to: REGISTRATION_CLOSED
    trigger: 'system (POST /pd/ops-runs: now > registration_closes_at)'
    actor: system
    preconditions: []
    side_effects:
    - section.version += 1
  - from: REGISTRATION_CLOSED
    to: IN_SESSION
    trigger: 'system (POST /pd/ops-runs: now >= starts_at)'
    actor: system
    preconditions: []
    side_effects:
    - section.version += 1
  - from: IN_SESSION
    to: COMPLETED
    trigger: 'system (POST /pd/ops-runs: now > ends_at)'
    actor: system
    preconditions: []
    side_effects:
    - section.version += 1
  - from:
    - DRAFT
    - PUBLISHED
    - REGISTRATION_CLOSED
    to: CANCELED
    trigger: POST /pd/sections/{id}/cancel
    actor: PDCoordinator
    preconditions: []
    side_effects:
    - section.version += 1
    - REGISTERED registrations -> DROPPED (system); each releases its encumbered_cents from the registrant's building budget (budget.version += 1)
    - WAITLISTED registrations -> EXPIRED (system)
    - No waitlist promotion runs (section is terminal)
  - from: PUBLISHED
    to: PUBLISHED
    trigger: PATCH /pd/sections/{id} (capacity/room/schedule change)
    actor: PDCoordinator
    preconditions:
    - section.status == PUBLISHED
    - new seat_capacity >= seats_registered
    side_effects:
    - section.version += 1
    - 'If seat_capacity increased: synchronous waitlist promotion sweep for this section (see seat_and_waitlist_allocation)'
- entity: Registration
  field: status
  initial_state: REGISTERED (seat available) or WAITLISTED (full)
  terminal_states:
  - DROPPED
  - WITHDRAWN
  - EXPIRED
  - NO_SHOW
  - COMPLETED
  transitions:
  - from: WAITLISTED
    to: REGISTERED
    trigger: 'system (promotion: drop/capacity-increase/ops-run frees a seat)'
    actor: system
    preconditions:
    - section.status == PUBLISHED
    - seats_open >= 1 after the freeing event
    - candidate's teacher building budget for the section's fiscal year is OPEN with available_cents >= section.fee_cents
    side_effects:
    - registration.waitlist_seq -> null; registration.status -> REGISTERED
    - 'If section.fee_cents > 0: encumber fee on the teacher''s building budget (encumbered_cents += fee; budget.version += 1; registration.encumbered_cents = fee)'
    - Teacher's ASSIGNED ComplianceAssignments for this course -> IN_PROGRESS
  - from: REGISTERED
    to: DROPPED
    trigger: POST /pd/registrations/{id}/drop or section cancel or employee separation
    actor: Teacher (self) or PDCoordinator or system
    preconditions:
    - 'For explicit drop: section.status in {PUBLISHED, REGISTRATION_CLOSED}'
    side_effects:
    - registration.version += 1
    - 'Release encumbrance: teacher''s building budget.encumbered_cents -= registration.encumbered_cents; registration.encumbered_cents = 0 (budget.version += 1)'
    - 'Seat release triggers promotion sweep on the section (depth-3 cascade: drop -> release -> promotion -> new encumbrance)'
  - from: WAITLISTED
    to: WITHDRAWN
    trigger: POST /pd/registrations/{id}/withdraw or employee separation
    actor: Teacher (self) or PDCoordinator or system
    preconditions: []
    side_effects:
    - registration.version += 1
  - from: WAITLISTED
    to: EXPIRED
    trigger: 'system (ops-run: section IN_SESSION/COMPLETED/CANCELED; or section cancel)'
    actor: system
    preconditions: []
    side_effects:
    - registration.version += 1
  - from: REGISTERED
    to: NO_SHOW
    trigger: 'system (ops-run: section COMPLETED and attendance_status != VERIFIED)'
    actor: system
    preconditions: []
    side_effects:
    - registration.version += 1
    - attendance_status -> ABSENT if still PENDING
    - Release encumbrance to the teacher's building budget (budget.version += 1)
  - from: REGISTERED
    to: COMPLETED
    trigger: POST /pd/registrations/{id}/complete
    actor: PDCoordinator
    preconditions:
    - section.status in {IN_SESSION, COMPLETED}
    - attendance_status == VERIFIED
    - survey_status in {SUBMITTED, WAIVED}
    side_effects:
    - registration.version += 1; completed_at = logical now
    - Create TranscriptEntry (source_type COURSE_COMPLETION, clock_hours = course.clock_hours, growth_plan_id copied); awarded_at = now
    - 'If registration.encumbered_cents > 0: budget.encumbered_cents -= fee; budget.spent_cents += fee (budget.version += 1)'
    - employee.lane_credit_balance recomputed (calc credit_conversion + transcript_rollup)
    - 'If growth_plan_id set and plan.status in {APPROVED, FULFILLED}: plan.aligned_credits recomputed; if APPROVED and aligned_credits >= target_credits -> FULFILLED (plan.version += 1)'
    - 'If course.compliance_tag set: teacher''s ComplianceAssignments for this course in {ASSIGNED, IN_PROGRESS, OVERDUE, ESCALATED} -> SATISFIED (satisfied_at = now); if course.recurrence_months set, spawn
      next ComplianceAssignment (ASSIGNED, due_date = completed_at + recurrence_months); employee.compliance_standing recomputed'
- entity: Registration
  field: attendance_status
  initial_state: PENDING
  terminal_states:
  - VERIFIED
  - ABSENT
  transitions:
  - from: PENDING
    to: VERIFIED
    trigger: POST /pd/registrations/{id}/verify-attendance (attended*5 >= total*4)
    actor: Instructor (assigned) or PDCoordinator
    preconditions:
    - registration.status == REGISTERED
    - Every SectionMeeting of the section has an AttendanceRecord for this registration
    - 'Integer rate check passes: attended_count * 5 >= meeting_count * 4 (PRESENT or EXCUSED count as attended)'
    side_effects:
    - registration.version += 1
  - from: PENDING
    to: ABSENT
    trigger: POST /pd/registrations/{id}/verify-attendance (rate below threshold) or ops-run NO_SHOW sweep
    actor: Instructor (assigned) or PDCoordinator or system
    preconditions:
    - registration.status == REGISTERED
    side_effects:
    - registration.version += 1
- entity: Registration
  field: survey_status
  initial_state: PENDING
  terminal_states:
  - SUBMITTED
  - WAIVED
  transitions:
  - from: PENDING
    to: SUBMITTED
    trigger: POST /pd/registrations/{id}/survey
    actor: Teacher (self)
    preconditions:
    - registration.status in {REGISTERED, COMPLETED}
    - No SurveyResponse exists for this registration
    side_effects:
    - Create SurveyResponse; survey_status -> SUBMITTED; registration.version += 1
  - from: PENDING
    to: WAIVED
    trigger: POST /pd/registrations/{id}/waive-survey
    actor: PDCoordinator
    preconditions:
    - registration.status == REGISTERED
    side_effects:
    - registration.version += 1
- entity: TranscriptEntry
  field: status
  initial_state: AWARDED
  terminal_states:
  - REVERSED
  transitions:
  - from: AWARDED
    to: REVERSED
    trigger: POST /pd/audit-cases/{id}/reverse-entry
    actor: Auditor
    preconditions:
    - audit_case.status in {OPEN, FINDINGS_RAISED}
    - entry.employee_id == audit_case.employee_id and entry.fiscal_year == audit_case.fiscal_year
    - entry.status == AWARDED
    side_effects:
    - entry.status -> REVERSED; entry.reversed_by_entry_id = new entry id (entry.version += 1)
    - 'Create AUDIT_REVERSAL TranscriptEntry: clock_hours/district_credit/state_ceu = negated originals, counts_toward_lane mirrored, growth_plan_id mirrored, fiscal_year from now'
    - employee.lane_credit_balance recomputed (lane is NOT rolled back)
    - 'If entry.growth_plan_id set: plan.aligned_credits recomputed; if plan.status == FULFILLED and aligned_credits < target_credits -> APPROVED (un-fulfill; plan.version += 1)'
    - audit_case.findings_count += 1; audit_case OPEN -> FINDINGS_RAISED (audit_case.version += 1)
- entity: ExternalWorkshopRequest
  field: status
  initial_state: DRAFT
  terminal_states:
  - REIMBURSED
  - REIMBURSEMENT_DENIED
  - EXPIRED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /pd/workshop-requests/{id}/submit
    actor: Teacher (self) or PDCoordinator
    preconditions:
    - starts_at >= logical now + 14 days (pre-approval lead time)
    side_effects:
    - workshop.version += 1
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /pd/workshop-requests/{id}/approve
    actor: BuildingAdmin (scoped to workshop.building_id)
    preconditions:
    - logical now < starts_at (pre-approval must precede the workshop)
    - BuildingBudget for (building_id, fiscal_year(starts_at)) is OPEN
    - budget.available_cents >= est_cost_cents
    side_effects:
    - workshop.version += 1; approved_by_user_id = X-User-ID
    - budget.encumbered_cents += est_cost_cents (budget.version += 1)
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /pd/workshop-requests/{id}/reject
    actor: BuildingAdmin (scoped)
    preconditions: []
    side_effects:
    - workshop.version += 1; reject_reason = payload reason
  - from: REJECTED
    to: DRAFT
    trigger: POST /pd/workshop-requests/{id}/revise
    actor: Teacher (self) or PDCoordinator
    preconditions:
    - revision_count < 3
    side_effects:
    - workshop.version += 1; revision_count += 1; editable fields overwritten by payload values where present
  - from: APPROVED
    to: ATTENDED
    trigger: POST /pd/workshop-requests/{id}/complete
    actor: Teacher (self) or PDCoordinator
    preconditions:
    - logical now >= starts_at
    side_effects:
    - workshop.version += 1; actual_hours, receipt_cents recorded
    - Create TranscriptEntry (source_type EXTERNAL_WORKSHOP, clock_hours = actual_hours, counts_toward_lane = true, growth_plan_id copied)
    - employee.lane_credit_balance recomputed
    - 'If growth_plan_id set and plan APPROVED: plan.aligned_credits recomputed; auto-fulfill at >= target_credits'
  - from: ATTENDED
    to: REIMBURSED
    trigger: POST /pd/workshop-requests/{id}/reimburse
    actor: BusinessOfficer
    preconditions:
    - X-User-ID != workshop.approved_by_user_id (segregation of duties)
    side_effects:
    - workshop.version += 1; reimbursed_cents = min(receipt_cents, est_cost_cents, remaining annual cap) (calc reimbursement_amount)
    - budget.encumbered_cents -= est_cost_cents; budget.spent_cents += reimbursed_cents (budget.version += 1)
  - from: ATTENDED
    to: REIMBURSEMENT_DENIED
    trigger: POST /pd/workshop-requests/{id}/deny-reimbursement
    actor: BusinessOfficer
    preconditions:
    - X-User-ID != workshop.approved_by_user_id
    side_effects:
    - workshop.version += 1
    - budget.encumbered_cents -= est_cost_cents (budget.version += 1)
  - from: APPROVED
    to: EXPIRED
    trigger: 'system (ops-run: now > ends_at + 30 days without completion)'
    actor: system
    preconditions: []
    side_effects:
    - workshop.version += 1
    - budget.encumbered_cents -= est_cost_cents (budget.version += 1)
- entity: GrowthPlan
  field: status
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /pd/growth-plans/{id}/submit
    actor: Teacher (self) or PDCoordinator
    preconditions: []
    side_effects:
    - plan.version += 1
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /pd/growth-plans/{id}/approve
    actor: BuildingAdmin (scoped to plan teacher's building)
    preconditions: []
    side_effects:
    - plan.version += 1
  - from: SUBMITTED
    to: DRAFT
    trigger: POST /pd/growth-plans/{id}/return
    actor: BuildingAdmin (scoped)
    preconditions: []
    side_effects:
    - plan.version += 1
  - from: APPROVED
    to: FULFILLED
    trigger: system (aligned_credits recomputed and >= target_credits)
    actor: system
    preconditions: []
    side_effects:
    - plan.version += 1
  - from: FULFILLED
    to: APPROVED
    trigger: system (audit reversal drops aligned_credits below target_credits)
    actor: system
    preconditions: []
    side_effects:
    - plan.version += 1
  - from:
    - DRAFT
    - SUBMITTED
    - APPROVED
    - FULFILLED
    to: SUPERSEDED
    trigger: system (POST /pd/growth-plans creates a new plan for the same (teacher_id, school_year))
    actor: system
    preconditions: []
    side_effects:
    - old plan.version += 1
  - from:
    - APPROVED
    - FULFILLED
    to: CLOSED
    trigger: POST /pd/growth-plans/{id}/close
    actor: PDCoordinator
    preconditions: []
    side_effects:
    - plan.version += 1
- entity: ComplianceAssignment
  field: status
  initial_state: ASSIGNED
  terminal_states:
  - SATISFIED
  - WAIVED
  transitions:
  - from: ASSIGNED
    to: IN_PROGRESS
    trigger: system (assignee becomes REGISTERED in a section of the assigned course)
    actor: system
    preconditions: []
    side_effects:
    - assignment.version += 1
  - from:
    - ASSIGNED
    - IN_PROGRESS
    to: OVERDUE
    trigger: 'system (ops-run: now > due_date)'
    actor: system
    preconditions: []
    side_effects:
    - assignment.version += 1
  - from: OVERDUE
    to: ESCALATED
    trigger: 'system (ops-run: now > due_date + 30 days)'
    actor: system
    preconditions: []
    side_effects:
    - assignment.version += 1
    - employee.compliance_standing recomputed -> NON_COMPLIANT (employee.version += 1)
  - from:
    - ASSIGNED
    - IN_PROGRESS
    - OVERDUE
    - ESCALATED
    to: SATISFIED
    trigger: system (assignee completes a registration for the assigned course)
    actor: system
    preconditions: []
    side_effects:
    - assignment.version += 1; satisfied_at = registration.completed_at
    - 'If course.recurrence_months set: spawn successor ComplianceAssignment (ASSIGNED, due_date = completed_at + recurrence_months, same employee/course)'
    - employee.compliance_standing recomputed
  - from:
    - ASSIGNED
    - IN_PROGRESS
    - OVERDUE
    - ESCALATED
    to: WAIVED
    trigger: POST /pd/compliance-assignments/{id}/waive
    actor: PDCoordinator
    preconditions:
    - X-User-ID != assignment.assigned_by_user_id (segregation of duties)
    side_effects:
    - assignment.version += 1
    - employee.compliance_standing recomputed
  - from:
    - ASSIGNED
    - IN_PROGRESS
    - OVERDUE
    to: ASSIGNED
    trigger: POST /pd/compliance-assignments/{id}/extend (due_date moved later)
    actor: PDCoordinator
    preconditions:
    - new_due_date > logical now
    side_effects:
    - assignment.version += 1 (OCC field); extension_count += 1; due_date = new_due_date; status reset to ASSIGNED
    - employee.compliance_standing recomputed
- entity: AuditCase
  field: status
  initial_state: OPEN
  terminal_states:
  - RESOLVED
  - CLOSED_CLEAN
  transitions:
  - from: OPEN
    to: FINDINGS_RAISED
    trigger: POST /pd/audit-cases/{id}/raise-finding or first reverse-entry
    actor: Auditor
    preconditions: []
    side_effects:
    - audit_case.version += 1; findings_count += 1 (raise-finding)
  - from: FINDINGS_RAISED
    to: RESOLVED
    trigger: POST /pd/audit-cases/{id}/resolve
    actor: Auditor
    preconditions:
    - findings_count >= 1
    side_effects:
    - audit_case.version += 1
  - from: OPEN
    to: CLOSED_CLEAN
    trigger: POST /pd/audit-cases/{id}/close-clean
    actor: Auditor
    preconditions:
    - findings_count == 0
    side_effects:
    - audit_case.version += 1
concurrency_rules:
- rule_id: growth-plan-create-stale-employee
  parent_entity: Employee
  write_endpoint: POST /pd/growth-plans
  occ_field: expected_employee_version
  description: 'Creating a GrowthPlan supersedes the teacher''s existing non-terminal plan

    for the same school year and bumps the teacher''s Employee.version. A create

    carrying an expected_employee_version that no longer matches the employee''s

    current version is rejected: the client''s view of the teacher''s plan state

    is stale.

    '
  error_id: ERR_STALE_EMPLOYEE_VERSION
  http_status: 412
- rule_id: assignment-extend-stale-version
  parent_entity: ComplianceAssignment
  write_endpoint: POST /pd/compliance-assignments/{id}/extend
  occ_field: expected_assignment_version
  description: 'Extending a ComplianceAssignment whose version has advanced since the

    client last observed it (e.g., an ops-run moved it ASSIGNED -> OVERDUE, or

    an earlier extension was applied) is rejected as a stale write.

    '
  error_id: ERR_STALE_ASSIGNMENT_VERSION
  http_status: 412
calculations:
- name: credit_conversion
  trigger: TranscriptEntry creation (course completion, workshop completion, audit reversal)
  algorithm: threshold
  formula: 'district_credit = floor(clock_hours * 2 / 3) / 10        # 15 h per credit, truncated to 0.1 per entry

    state_ceu       = round(clock_hours / 10, 2) HALF_UP     # 10 h per CEU, 2 decimals

    AUDIT_REVERSAL: district_credit/state_ceu = negation of the reversed entry''s values

    counts_toward_lane = false when source course has compliance_tag set, else true

    '
  input_set: The single TranscriptEntry being created
  constants:
    HOURS_PER_DISTRICT_CREDIT: 15
    HOURS_PER_CEU: 10
  precision: district_credit 1 decimal (floor); state_ceu 2 decimals round_half_up
  variants:
  - name: district_lane_credit
    when: Salary-lane accumulation and growth-plan progress
    difference: "Truncates to 0.1 per entry (15 h/credit) \u2014 24 h yields 1.6"
  - name: state_ceu_credit
    when: State licensure reporting
    difference: "Rounds half-up to 0.01 per entry (10 h/CEU) \u2014 24 h yields 2.40"
- name: transcript_rollup
  trigger: Read of employee transcript totals / lane_credit_balance recompute
  algorithm: aggregation
  formula: "total_district_credits = SUM(entry.district_credit) over AWARDED entries   # per-entry-rounded THEN summed\ntotal_state_ceu        = SUM(entry.state_ceu) over AWARDED entries\nFORBIDDEN alternative:\
    \ floor(SUM(clock_hours) * 2/3)/10  \u2014 different result, not used\nlane_credit_balance = SUM(district_credit where counts_toward_lane) - 12.0 * advancements\n"
  input_set: TranscriptEntry rows for the employee with status AWARDED only (REVERSED excluded; AUDIT_REVERSAL rows included as negatives while AWARDED)
  precision: 1 decimal for district totals; no re-rounding after the per-entry step
  variants:
  - name: per_entry_then_sum
    when: Always (pinned rounding order)
    difference: 7 h + 8 h -> 0.4 + 0.5 = 0.9, whereas aggregate-convert would give 1.0
- name: seat_and_waitlist_allocation
  trigger: registration create, drop, section capacity increase, ops-run
  algorithm: waterfall_allocation
  formula: "seats_open = seat_capacity - count(registrations where status == REGISTERED)\nCreate: seats_open >= 1 -> REGISTERED (encumber fee) else WAITLISTED (waitlist_seq = next per-section integer)\n\
    Promotion sweep (on any freeing event): candidates = WAITLISTED registrations of the section,\n  eligibility = teacher's building budget for fiscal_year(section.starts_at) OPEN\n                with\
    \ available_cents >= fee (only when fee > 0),\n  order = waitlist_seq ASC; iterate: budget-failing candidates are SKIPPED (stay WAITLISTED),\n  promote until seats_open == 0; empty candidate set ->\
    \ nothing happens.\n"
  input_set: Registrations of the section in {REGISTERED, WAITLISTED}
  precision: integer seats
- name: attendance_rate_check
  trigger: POST /pd/registrations/{id}/verify-attendance
  algorithm: threshold
  formula: 'attended = count(records where mark in {PRESENT, EXCUSED})

    total    = count(all SectionMeetings of the section)

    VERIFIED iff attended * 5 >= total * 4    # integer cross-multiplication; 4/5 passes, 3/5 fails

    else ABSENT

    '
  input_set: AttendanceRecord rows for (registration, each meeting of the section); every meeting must have a record
  constants:
    ATTENDANCE_NUMERATOR: 4
    ATTENDANCE_DENOMINATOR: 5
  precision: "integer arithmetic only \u2014 no floats"
- name: budget_availability
  trigger: Any encumbering operation (registration seat, workshop approval, promotion) and GET /pd/budgets/{id}/summary
  algorithm: aggregation
  formula: 'encumbrance_basis_available = allocated_cents - encumbered_cents - spent_cents   # BLOCKING variant

    cash_basis_available        = allocated_cents - spent_cents                      # reporting variant

    Invariant: allocated_cents == encumbered_cents + spent_cents + available_cents at all times

    '
  input_set: The BuildingBudget row (encumbered/spent are denormalized ledgers updated by every encumber/release/settle)
  precision: integer cents
  variants:
  - name: encumbrance_basis
    when: Blocking checks (approve workshop, seat with fee, promotion)
    difference: "Subtracts outstanding encumbrances \u2014 100000 allocated with 10000 encumbered yields 90000"
  - name: cash_basis
    when: Summary reporting only
    difference: "Ignores encumbrances \u2014 same ledger yields 100000"
- name: reimbursement_amount
  trigger: POST /pd/workshop-requests/{id}/reimburse
  algorithm: tiered_pricing
  formula: "prior_reimbursed = SUM(reimbursed_cents) over this teacher's workshops with status REIMBURSED\n                   and fiscal_year(starts_at) == fiscal_year(this.starts_at)\nremaining_cap = max(0,\
    \ ANNUAL_CAP_CENTS - prior_reimbursed)\nreimbursed_cents = min(receipt_cents, est_cost_cents, remaining_cap)\nEvaluation order pinned: prior_reimbursed is computed BEFORE this reimbursement is applied.\n"
  input_set: This workshop (receipt, est) + teacher's REIMBURSED workshops in the same fiscal year
  constants:
    ANNUAL_CAP_CENTS: 250000
  precision: integer cents
- name: lane_advancement
  trigger: POST /pd/employees/{id}/advance-lane
  algorithm: waterfall_allocation
  formula: "Gates (in order): employee ACTIVE; compliance_standing == COMPLIANT;\n  current_lane != DOC; logical month in {8, 9};\n  last_advancement_fiscal_year != current fiscal year; lane_credit_balance\
    \ >= 12.0\nOn success: current_lane = next lane in [BA, BA15, MA, MA15, MA30, DOC];\n  lane_credit_balance -= 12.0 (remainder carries over);\n  last_advancement_fiscal_year = current fiscal year.\n"
  input_set: Employee + logical clock
  constants:
    CREDITS_PER_LANE_STEP: 12.0
    LANE_ORDER:
    - BA
    - BA15
    - MA
    - MA15
    - MA30
    - DOC
    ADVANCEMENT_MONTHS:
    - 8
    - 9
  precision: 0.1 credit steps
- name: growth_plan_progress
  trigger: TranscriptEntry creation or reversal carrying growth_plan_id
  algorithm: aggregation
  formula: 'aligned_credits = SUM(district_credit) over AWARDED TranscriptEntry where growth_plan_id == plan.id

    plan APPROVED and aligned_credits >= target_credits -> FULFILLED (>= is inclusive)

    plan FULFILLED and aligned_credits < target_credits (after reversal) -> APPROVED

    '
  input_set: AWARDED entries aligned to the plan
  precision: 0.1 credit steps
- name: ops_run_sweep
  trigger: POST /pd/ops-runs
  algorithm: chronological
  formula: "Execute in this pinned order (each step sees the results of the previous):\n1. Section windows: PUBLISHED & now > registration_closes_at -> REGISTRATION_CLOSED;\n   then REGISTRATION_CLOSED\
    \ & now >= starts_at -> IN_SESSION;\n   then IN_SESSION & now > ends_at -> COMPLETED (a section can advance multiple steps in one run)\n2. Waitlist promotion for sections still PUBLISHED (see seat_and_waitlist_allocation)\n\
    3. Waitlist expiry: WAITLISTED in sections IN_SESSION/COMPLETED/CANCELED -> EXPIRED\n4. NO_SHOW sweep: REGISTERED in COMPLETED sections with attendance_status != VERIFIED -> NO_SHOW (release encumbrance)\n\
    5. Workshop expiry: APPROVED & now > ends_at + 30d -> EXPIRED (release encumbrance)\n6. Compliance: ASSIGNED/IN_PROGRESS & now > due_date -> OVERDUE; OVERDUE & now > due_date + 30d -> ESCALATED\n7.\
    \ Recompute compliance_standing for every employee touched by step 6 (and any with lingering ESCALATED rows)\n"
  input_set: All sections, registrations, workshops, assignments (district-wide batch)
  constants:
    WORKSHOP_GRACE_DAYS: 30
    COMPLIANCE_ESCALATION_DAYS: 30
  precision: logical clock comparisons are strict per the operators above
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present; role is a declared role
  error_id: ERR_MISSING_CONTEXT
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: "Role is permitted on this endpoint per \xA71.5 roles (kind check for entity-backed roles: Teacher needs employee_kind TEACHER, BuildingAdmin needs ADMIN)"
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Path resource ids exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all resource endpoints
- priority: 4
  category: business_constraint
  check: 'Request shape: required fields present, types/enum membership/ranges valid, datetime formats valid, ends_at > starts_at, school_year format YYYY-YYYY consecutive'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all mutating endpoints
- priority: 5
  category: existence
  check: Body-referenced FK ids exist (teacher_id, section_id, course_id, growth_plan_id, building_id, transcript_entry_id...)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: endpoints with body FKs
- priority: 6
  category: state
  check: Target resource lifecycle permits the operation (section PUBLISHED for registration, budget OPEN/CLOSED transitions, employee ACTIVE for employee-targeted writes, invalid-from rejection on every
    state machine)
  error_id: ERR_INVALID_STATE / ERR_SECTION_NOT_OPEN / ERR_EMPLOYEE_NOT_ACTIVE / ERR_BUDGET_NOT_OPEN / ERR_BUDGET_HAS_ENCUMBRANCES / ERR_ENTRY_ALREADY_REVERSED
  http_status: 400
  applies_to: state-transition and state-gated endpoints
- priority: 7
  category: business_safety
  check: "Safety/standing: prerequisite course completed (ERR_PREREQUISITE_NOT_COMPLETED); compliance hold blocks lane advancement (ERR_COMPLIANCE_HOLD); segregation of duties \u2014 workshop approver cannot\
    \ reimburse/deny (ERR_SEGREGATION_OF_DUTIES), assignment creator cannot waive"
  error_id: ERR_PREREQUISITE_NOT_COMPLETED / ERR_COMPLIANCE_HOLD / ERR_SEGREGATION_OF_DUTIES
  http_status: 400
  applies_to: registrations, advance-lane, reimburse/deny, waive
- priority: 8
  category: business_referential
  check: 'Ownership/scope/alignment: Teacher acts only on own resources (ERR_NOT_RESOURCE_OWNER); BuildingAdmin scoped to own building (ERR_BUILDING_SCOPE_VIOLATION); growth_plan_id belongs to same teacher,
    is APPROVED or FULFILLED (ERR_PLAN_NOT_APPROVED), and its school year contains section.starts_at (ERR_PLAN_YEAR_MISMATCH); audit entry matches case employee+year (ERR_AUDIT_ENTRY_MISMATCH)'
  error_id: ERR_NOT_RESOURCE_OWNER / ERR_BUILDING_SCOPE_VIOLATION / ERR_PLAN_NOT_APPROVED / ERR_PLAN_YEAR_MISMATCH / ERR_AUDIT_ENTRY_MISMATCH
  http_status: 403
  applies_to: role-scoped and alignment-carrying endpoints
- priority: 9
  category: business_temporal
  check: 'Windows/deadlines: registration window (ERR_REGISTRATION_NOT_YET_OPEN / ERR_REGISTRATION_WINDOW_CLOSED); workshop submit lead 14d (ERR_PREAPPROVAL_LEAD_TIME); approve strictly before starts_at
    (ERR_APPROVAL_AFTER_START); complete not before starts_at (ERR_WORKSHOP_NOT_STARTED); lane advancement months {8,9} (ERR_ADVANCEMENT_WINDOW_CLOSED); meeting within section dates (ERR_MEETING_OUTSIDE_SECTION);
    extend requires future due date'
  error_id: ERR_REGISTRATION_NOT_YET_OPEN / ERR_REGISTRATION_WINDOW_CLOSED / ERR_PREAPPROVAL_LEAD_TIME / ERR_APPROVAL_AFTER_START / ERR_WORKSHOP_NOT_STARTED / ERR_ADVANCEMENT_WINDOW_CLOSED / ERR_MEETING_OUTSIDE_SECTION
  http_status: 400
  applies_to: time-gated endpoints
- priority: 10
  category: business_constraint
  check: 'Domain constraints: no duplicate non-terminal registration per (teacher, section) (ERR_DUPLICATE_REGISTRATION); teacher schedule overlap (ERR_SCHEDULE_CONFLICT); room turnover buffer (ERR_ROOM_CONFLICT);
    uniqueness of (building, fiscal_year) budget (ERR_BUDGET_ALREADY_EXISTS); one survey per registration (ERR_SURVEY_ALREADY_SUBMITTED); revision_count < 3 (ERR_REVISION_LIMIT_EXCEEDED); capacity >= seats_registered
    on shrink (ERR_CAPACITY_BELOW_REGISTERED); all meetings recorded before verify (ERR_ATTENDANCE_INCOMPLETE); lane gates (ERR_LANE_MAX_REACHED / ERR_ADVANCEMENT_ALREADY_THIS_FY / ERR_LANE_CREDITS_INSUFFICIENT);
    completion gates (ERR_ATTENDANCE_NOT_VERIFIED before ERR_SURVEY_NOT_SUBMITTED)'
  error_id: ERR_DUPLICATE_REGISTRATION / ERR_SCHEDULE_CONFLICT / ERR_ROOM_CONFLICT / ERR_BUDGET_ALREADY_EXISTS / ERR_SURVEY_ALREADY_SUBMITTED / ERR_REVISION_LIMIT_EXCEEDED / ERR_CAPACITY_BELOW_REGISTERED
    / ERR_ATTENDANCE_INCOMPLETE / ERR_LANE_MAX_REACHED / ERR_ADVANCEMENT_ALREADY_THIS_FY / ERR_LANE_CREDITS_INSUFFICIENT / ERR_ATTENDANCE_NOT_VERIFIED / ERR_SURVEY_NOT_SUBMITTED
  http_status: 400
  applies_to: domain endpoints
- priority: 11
  category: business_fiscal
  check: 'Fiscal last: budget exists and OPEN for the charge (ERR_BUDGET_NOT_OPEN), available_cents >= amount (ERR_BUDGET_INSUFFICIENT)'
  error_id: ERR_BUDGET_NOT_OPEN / ERR_BUDGET_INSUFFICIENT
  http_status: 400
  applies_to: encumbering operations
- priority: 12
  category: business_constraint
  check: 'OCC: expected_employee_version on POST /growth-plans and expected_assignment_version on extend match current versions'
  error_id: ERR_STALE_EMPLOYEE_VERSION / ERR_STALE_ASSIGNMENT_VERSION
  http_status: 412
  applies_to: OCC-guarded endpoints
endpoints:
- method: POST
  path: /pd/_clock/set_current_utc
  description: Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; never falls back to wall-clock.
  roles:
