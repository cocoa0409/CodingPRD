            - "StoreAgreement.${agr}: cumulative_shrink_units == 20, cumulative_shrink_ratio == 0.02 (link 2: ratio recomputed from the posting)"
            - "StoreAgreement.${agr}.status == SUSPENDED (link 3: 0.02 >= 0.02 threshold breach)"
