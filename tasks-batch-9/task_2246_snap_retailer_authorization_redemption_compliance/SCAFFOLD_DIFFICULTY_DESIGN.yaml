            - "RedemptionPeriod.${pj_id}.size_expectation_cents == 1250000"
            - "GET /investigations?store_id=${store_id} returns 0 rows"
            - "Store.${store_id}.sanction_status == NONE and redemption_flag_level == FLAG_L0"

  - rule_id: resource_temporal_overlap
    instances:

      - name: inspector_half_open_window_with_travel_buffer_boundary_one_minute_apart
        grounds:
          - calculations.interval_overlap_rules
          - validations.priority_13_interval_conflicts
          - errors.ERR_INSPECTOR_WINDOW_CONFLICT
          - calculations.inspector_committed_minutes
          - entities.StoreVisit.fields.window_minutes
        distinguishing_aspect: |
          Inspector windows are HALF-OPEN with a 60-minute travel buffer on both ends, so
          against an existing 09:00-11:00 visit the refusal boundary sits at 12:00: a
          11:59 start is rejected and a 12:00 start is accepted. One minute of difference
          flips the answer, and the same inspector is booked across two DIFFERENT stores so
          nothing but the interval algebra can be doing the work.
        test_recipe:
          setup:
            - "One owner with two submitted CRITERION_A applications on two different stores."
            - "One inspector with a 480-minute daily ceiling and an existing SCHEDULED 09:00-11:00 visit on 2026-08-01 for the first application."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Corner Market", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 1, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 24000000, annual_staple_sales_cents: 14000000, max_terminal_slots: 1 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_b_id: $.data.id, store_b_v: $.data.version }
            - call: "POST /applications"
              payload: { store_id: "${store_b_id}", expected_store_version: "${store_b_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /applications/${app_b_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - *a_insp
            - call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_am_id: $.data.id }
          trigger:
            - call: "POST /store-visits"
              payload: { application_id: "${app_b_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T11:59:00Z", window_end: "2026-08-01T12:59:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { window_conflict_error_id: $.data.error_id }
            - call: "POST /store-visits"
              payload: { application_id: "${app_b_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T13:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_pm_id: $.data.id }
          assert:
            - "the 11:59-12:59 request returns 409 and ${window_conflict_error_id} == ERR_INSPECTOR_WINDOW_CONFLICT"
            - "the 12:00-13:00 request returns 201"
            - "StoreVisit.${visit_pm_id}.window_minutes == 60"
            - "StoreVisit.${visit_am_id}.window_minutes == 120"
            - "Inspector.${insp_id}.committed_minutes == 180 (only the accepted pair counts, and 180 <= 480)"
            - "Application.${app_b_id}.status == PENDING_VISIT"
            - "GET /store-visits?inspector_id=${insp_id} returns exactly 2 rows"

      - name: terminal_deployment_closed_interval_touching_endpoint_collides
        grounds:
          - calculations.interval_overlap_rules
          - validations.priority_13_interval_conflicts
          - errors.ERR_TERMINAL_ALREADY_COMMITTED
          - state_machines.TerminalDeployment.initial_state
          - entities.EbtTerminal.fields.status
        distinguishing_aspect: |
          The SAME resource family with the OPPOSITE endpoint convention: deployment
          windows are CLOSED on both ends, so a new booking that starts exactly on the day
          the previous one ends is REJECTED, while starting one day later is accepted.
          Reusing the half-open rule from the inspector instance here would wrongly accept
          the touching interval, and the accepted second booking must not double-count the
          unit in the depot ledger.
        test_recipe:
          setup:
            - "The shared authorized store with a 5-unit TX depot and one terminal EBT-0001."
            - "An existing RESERVED deployment of that terminal covering 2026-08-01 to 2026-09-30 inclusive."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-08-01T00:00:00Z", deploy_end: "2026-09-30T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_first_id: $.data.id }
          trigger:
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-09-30T00:00:00Z", deploy_end: "2026-10-31T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { touching_error_id: $.data.error_id }
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-10-01T00:00:00Z", deploy_end: "2026-10-31T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_next_id: $.data.id }
          assert:
            - "the 2026-09-30 start returns 409 and ${touching_error_id} == ERR_TERMINAL_ALREADY_COMMITTED"
            - "the 2026-10-01 start returns 201 with status RESERVED"
            - "EbtTerminal.${term_id}.status == RESERVED (one unit, two non-overlapping commitments)"
            - "EquipmentDepot.${depot_id}.units_reserved == 1"
            - "EquipmentDepot.${depot_id}.units_in_stock == 4"
            - "EquipmentDepot.${depot_id}.units_in_stock + units_reserved + units_deployed + units_pending_return + units_retired == 5"
            - "GET /terminal-deployments?terminal_id=${term_id} returns exactly 2 rows"

      - name: store_terminal_slot_aggregate_capacity_allows_equality_refuses_third
        grounds:
          - calculations.interval_overlap_rules
          - validations.priority_15_aggregate_ceilings
          - errors.ERR_STORE_TERMINAL_SLOTS_EXCEEDED
          - entities.Store.fields.max_terminal_slots
        distinguishing_aspect: |
          Aggregate rather than pairwise capacity: three DIFFERENT terminals are booked at
          the same store, and each new interval is individually conflict-free on its own
          unit. The second booking is accepted at exact equality (peak 2 == the store's 2
          slots) and only the third, whose window sits inside the overlap of the first two,
          pushes the peak concurrency to 3 and is refused.
        test_recipe:
          setup:
            - "The shared authorized store with max_terminal_slots 2 and a 5-unit TX depot holding three terminals EBT-0001, EBT-0002 and EBT-0003."
            - "A RESERVED deployment of EBT-0001 for 2026-08-01 to 2026-12-31."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - call: "POST /ebt-terminals"
              payload: { depot_id: "${depot_id}", serial_number: "EBT-0002", model: "EBT_ONLY_DIAL" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { term2_id: $.data.id }
            - call: "POST /ebt-terminals"
              payload: { depot_id: "${depot_id}", serial_number: "EBT-0003", model: "EBT_ONLY_WIRELESS" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { term3_id: $.data.id }
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-08-01T00:00:00Z", deploy_end: "2026-12-31T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { slot1_id: $.data.id }
          trigger:
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term2_id}", deploy_start: "2026-09-01T00:00:00Z", deploy_end: "2027-01-31T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { slot2_id: $.data.id }
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term3_id}", deploy_start: "2026-10-01T00:00:00Z", deploy_end: "2026-11-01T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { slots_error_id: $.data.error_id }
          assert:
            - "the second booking returns 201 (peak concurrency 2 equals max_terminal_slots 2, and equality is allowed)"
            - "TerminalDeployment.${slot2_id}.status == RESERVED"
            - "the third booking returns 409 and ${slots_error_id} == ERR_STORE_TERMINAL_SLOTS_EXCEEDED"
            - "EbtTerminal.${term3_id}.status == IN_STOCK (the refused booking reserved nothing)"
            - "EquipmentDepot.${depot_id}.units_reserved == 2"
            - "EquipmentDepot.${depot_id}.units_in_stock == 3"
            - "GET /terminal-deployments?store_id=${store_id} returns exactly 2 rows"
            - "Store.${store_id}.active_terminal_count == 0 (nothing has been activated)"

  - rule_id: compensating_invariant
    instances:

      - name: penalty_ledger_money_conservation_assess_then_abate_on_review_reversal
        grounds:
          - calculations.penalty_ledger_balance
          - calculations.owner_sanction_rollup
          - state_machines.SanctionCase.ADMIN_REVIEW_REQUESTED_to_SANCTION_REVERSED
          - entities.PenaltyLedgerEntry
          - entities.SanctionCase.fields.cmp_outstanding_cents
          - entities.Owner.fields.sanction_flag
        distinguishing_aspect: |
          Money conservation on an APPEND-ONLY ledger: the determination writes
          +423,456c and the review reversal writes a compensating -423,456c, so the
          entry count grows to 2 while the signed sum returns to exactly 0 and
          balance_after_cents walks 423456 -> 0. The assessment entry is never mutated
          or deleted, and the roll-up onto Owner.sanction_flag must swing back to CLEAR
          on its own.
        test_recipe:
          setup:
            - "The shared authorized store with four CLOSED periods and a hardship case charged at 2026-08-01T00:00:00Z, elected and replied to."
            - "A CMP_IN_LIEU determination assessing 423,456c (peak-3 variant, since the store was authorized the same day)."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *p1_create
            - *p1_import
            - *p1_close
            - *p2_create
            - *p2_import
            - *p2_close
            - *p3_create
            - *p3_import
            - *p3_close
            - *p4_create
            - *p4_import
            - *p4_close
            - *inv_open_tip
            - *ev_household
            - *conclude_ineligible
            - *case_hardship
            - *charge_letter
            - *cmp_election
            - *case_reply
            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "CMP_IN_LIEU" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /sanction-cases/${case_id}/administrative-review"
              payload: { grounds_text: "The household interview was recanted before the determination issued." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "POST /sanction-cases/${case_id}/administrative-review-decision"
              payload: { outcome: "REVERSED", reason_code: "EVIDENCE_INSUFFICIENT" }
              as: AdminReviewOfficer
              as_user_id: "review-officer-1"
          assert:
            - "immediately after the determination: GET /sanction-cases/${case_id}/penalty-ledger returns 1 entry (CMP_ASSESSED, amount_cents 423456, reason_code DETERMINATION, balance_after_cents 423456)"
            - "after the reversal: GET /sanction-cases/${case_id}/penalty-ledger returns exactly 2 entries and the first entry is byte-identical to before (append-only, no version field)"
            - "the second entry has entry_type == CMP_ABATEMENT, amount_cents == -423456, reason_code == REVIEW_REVERSAL and balance_after_cents == 0"
            - "the signed sum of amount_cents over the ledger == 0"
            - "SanctionCase.${case_id}.cmp_outstanding_cents == 0"
            - "SanctionCase.${case_id}.status == SANCTION_REVERSED"
            - "SanctionCase.${case_id}.admin_review_outcome == REVERSED and admin_review_decided_by_user_id == review-officer-1"
            - "Owner.${owner_id}.cmp_outstanding_cents == 0"
            - "Owner.${owner_id}.sanction_flag == CLEAR"
            - "Store.${store_id}.sanction_status == SANCTION_REVERSED"
            - "Store.${store_id}.authorization_status == AUTHORIZED (a CMP determination never suspended it)"

      - name: depot_unit_conservation_reserve_activate_return_round_trip
        grounds:
          - calculations.depot_unit_ledger
          - state_machines.TerminalDeployment.RESERVED_to_ACTIVE
          - state_machines.TerminalDeployment.ACTIVE_to_RETURNED
          - entities.EquipmentDepot.fields.units_in_stock
          - entities.EbtTerminal.fields.status
          - entities.Store.fields.active_terminal_count
        distinguishing_aspect: |
          Physical-unit conservation rather than money: the five-counter identity
          (in_stock + reserved + deployed + pending_return + retired == total_units_owned)
          holds after every single write, each transition moves exactly one unit between
          two counters, and the reserve -> activate -> return round trip restores
          units_in_stock to 5 with all four other counters back at 0. Store.active_terminal_count
          rises and falls with it, so the store-side derived field cannot drift either.
        test_recipe:
          setup:
            - "The shared authorized store, a TX depot owning 5 units, and one terminal EBT-0001 in stock."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
          trigger:
            - *b_deploy
            - *b_activate
            - call: "POST /terminal-deployments/${dep_id}/return"
              payload: { close_reason_code: "END_OF_TERM" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "before any deployment: EquipmentDepot.${depot_id} has units_in_stock 5, units_reserved 0, units_deployed 0, units_pending_return 0, units_retired 0"
            - "after the booking: units_in_stock 4, units_reserved 1, units_deployed 0 and EbtTerminal.${term_id}.status == RESERVED"
            - "after activation: units_in_stock 4, units_reserved 0, units_deployed 1 and EbtTerminal.${term_id}.status == DEPLOYED"
            - "after activation: Store.${store_id}.active_terminal_count == 1"
            - "after the return: units_in_stock 5, units_reserved 0, units_deployed 0, units_pending_return 0 and EbtTerminal.${term_id}.status == IN_STOCK"
            - "after the return: Store.${store_id}.active_terminal_count == 0"
            - "TerminalDeployment.${dep_id}.status == RETURNED with close_reason_code == END_OF_TERM and closed_at == 2026-08-01T00:00:00Z"
            - "at every one of the four observation points: units_in_stock + units_reserved + units_deployed + units_pending_return + units_retired == 5"

      - name: inspector_committed_minutes_conservation_schedule_then_cancel_round_trip
        grounds:
          - calculations.inspector_committed_minutes
          - state_machines.StoreVisit.SCHEDULED_to_CANCELLED
          - entities.Inspector.fields.committed_minutes
          - entities.StoreVisit.fields.window_minutes
          - validations.priority_15_aggregate_ceilings
        distinguishing_aspect: |
          Time-capacity conservation on a third resource: committed_minutes climbs
          120 -> 180 as two visits of different lengths are booked for the same inspector
          across two stores, then unwinds 180 -> 120 -> 0 as each is cancelled, landing
          back on exactly the starting value. Because the two windows have different
          lengths, a release that refunded a fixed or averaged amount would leave a
          non-zero residue.
        test_recipe:
          setup:
            - "One owner with two submitted CRITERION_A applications on two different stores."
            - "One inspector with a 480-minute daily ceiling and no visits."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Corner Market", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 1, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 24000000, annual_staple_sales_cents: 14000000, max_terminal_slots: 1 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_c_id: $.data.id, store_c_v: $.data.version }
            - call: "POST /applications"
              payload: { store_id: "${store_c_id}", expected_store_version: "${store_c_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_c_id: $.data.id }
            - call: "POST /applications/${app_c_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - *a_insp
          trigger:
            - *a_visit
            - call: "POST /store-visits"
              payload: { application_id: "${app_c_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T05:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_c_id: $.data.id }
            - call: "POST /store-visits/${visit_c_id}/cancel"
              payload: { note: "Inspector reassigned to a compliance sweep." }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - call: "POST /store-visits/${visit_id}/cancel"
              payload: { note: "Applicant asked to reschedule." }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          assert:
            - "before any booking: Inspector.${insp_id}.committed_minutes == 0"
            - "after the 120-minute booking: Inspector.${insp_id}.committed_minutes == 120 and StoreVisit.${visit_id}.window_minutes == 120"
            - "after the 60-minute booking: Inspector.${insp_id}.committed_minutes == 180 and StoreVisit.${visit_c_id}.window_minutes == 60"
            - "after cancelling the 60-minute visit: Inspector.${insp_id}.committed_minutes == 120"
            - "after cancelling the 120-minute visit: Inspector.${insp_id}.committed_minutes == 0"
            - "StoreVisit.${visit_id}.status == CANCELLED and StoreVisit.${visit_c_id}.status == CANCELLED"
            - "Application.${app_id}.status == PENDING_VISIT and Application.${app_c_id}.status == PENDING_VISIT (cancellation frees capacity without rewinding the application)"
            - "Inspector.${insp_id}.max_daily_minutes == 480 (unchanged by any booking)"

