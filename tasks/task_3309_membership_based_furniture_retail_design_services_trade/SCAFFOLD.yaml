# =============================================================================
# Task 3309 — Membership-Based Furniture Retail, Design Services & Trade Program
# =============================================================================

scenario: |
  Membership-Based Furniture Retail, Design Services & Trade Program (RH): annual
  membership granting discounted pricing across product lines with renewal and
  cancellation mechanics, gallery-based retail with limited inventory where product
  is ordered rather than carried, interior design services provided at no additional
  fee with design consultation attached to purchase, custom upholstery and special
  order lead times with production scheduling and non-cancelable deposits,
  white-glove delivery through owned hubs with room placement, assembly and
  packaging removal, trade program pricing for designers with credential
  verification and separate terms, source book publishing as a marketing channel
  with print production timing, returns and restocking policy differences between
  stock and custom items

domain_name: membership-furniture-retail
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, scheduled_actions]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique member email" , constraints: "unique across Member"}
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: auto_renew, type: boolean, source: input, description: "Renew automatically at period end" }
      - { name: status, type: enum, source: system, description: "ACTIVE | GRACE | LAPSED | CANCELLED | CANCELLED_REFUNDED" }
      - { name: current_period_start, type: datetime, source: system, description: "Start of current annual period (enrollment or last renewal time)" }
      - { name: current_period_end, type: datetime, source: system, description: "= current_period_start + 365 days" }
      - { name: grace_end, type: datetime, source: system, description: "= current_period_end + 30 days; set on entry to GRACE; null otherwise", default: null }
      - { name: fee_paid_total_cents, type: integer, source: computed, default: 0, description: "Sum of membership fees charged (17500 at enrollment + 17500 per successful renewal)" }
      - { name: lifetime_gross_savings_cents, type: integer, source: computed, default: 0, description: "Sum over DELIVERED member orders of (undiscounted list total - line_charged_cents total)" }
      - { name: lifetime_net_savings_cents, type: integer, source: computed, default: 0, description: "= lifetime_gross_savings_cents - fee_paid_total_cents" }
      - { name: pricing_tier, type: enum, source: computed, description: "MEMBER if status IN {ACTIVE, GRACE} else RETAIL" }

  - name: TradeAccount
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique trade account email", constraints: "unique across TradeAccount" }
      - { name: business_name, type: string, source: input, description: "Design firm name" }
      - { name: credential_document_id, type: string, source: input, description: "Credential evidence reference" }
      - { name: license_number, type: string, source: input, description: "Professional license number" }
      - { name: status, type: enum, source: system, description: "APPLIED | VERIFIED | REJECTED" }
      - { name: tier, type: enum, source: system, description: "TIER_1 (30%) | TIER_2 (40%); null until VERIFIED", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Clock time of verify decision", default: null }

  - name: Gallery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Gallery name" }
      - { name: region, type: string, source: input, description: "Region code" }
      - { name: daily_route_minutes_capacity, type: integer, source: input, description: "White-glove route budget per calendar date (minutes)" }
      - { name: booked_route_minutes, type: object, source: computed, default: {}, description: "Map ISO date -> sum of (duration_minutes + 30 buffer) over appointments on this gallery+date with status IN {SCHEDULED, OUT_FOR_DELIVERY}" }
      - { name: reserved_production_minutes, type: integer, source: computed, default: 0, description: "Sum of (ends_at - starts_at) in minutes over ProductionSlots of this gallery with status IN {COMMITTED, IN_PROGRESS}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU", constraints: "unique across Product" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: list_price_cents, type: integer, source: input, description: "List price per unit (cents)" }
      - { name: line_kind, type: enum, source: input, description: "STOCK | CUSTOM (custom upholstery / special order)" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | DISCONTINUED" }
      - { name: promo_active, type: boolean, source: computed, default: false, description: "True while a RELEASED SourceBook's product_ids contains this product" }

  - name: SourceBook
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Source book title" }
      - { name: product_ids, type: array, source: input, description: "Product ids promoted by this edition" }
      - { name: print_ready_date, type: datetime, source: input, description: "Date files went to print; release allowed at print_ready_date + 21 days" }
      - { name: status, type: enum, source: system, description: "IN_PRINT | RELEASED | ARCHIVED" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Clock time of release" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id; selling gallery" }
      - { name: member_id, type: string, source: input, default: null, description: "FK -> Member.id; set for member orders, null otherwise" }
      - { name: trade_account_id, type: string, source: input, default: null, description: "FK -> TradeAccount.id; set for trade orders, null otherwise" }
      - { name: pricing_tier, type: enum, source: computed, description: "TRADE if trade_account_id set | MEMBER if member pricing_tier==MEMBER at price time | RETAIL otherwise" }
      - { name: status, type: enum, source: system, description: "QUOTE | CONFIRMED | READY_FOR_DELIVERY | DELIVERED | CANCELLED" }
      - { name: quote_expires_at, type: datetime, source: system, description: "= created_at + 14 days, +14 days per completed attached consultation" }
      - { name: consultation_extensions_used, type: integer, source: system, default: 0, description: "Count of completed consultations that extended this quote" }
      - { name: quote_total_cents, type: integer, source: computed, default: 0, description: "Provisional total snapshot frozen at the first line addition (quote-time pricing)" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line_charged_cents over current lines (per-line rounded then summed)" }
      - { name: white_glove_fee_cents, type: integer, source: computed, default: 0, description: "19900 member/retail (0 if subtotal >= 1000000) | 14900 trade (never waived); 0 in QUOTE with no lines" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "= subtotal_cents + white_glove_fee_cents, recomputed on every line mutation and re-priced at confirm" }
      - { name: deposit_due_cents, type: integer, source: computed, default: 0, description: "Sum of per-custom-line deposits (see custom_deposit calc)" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Deposit captured at confirm" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Clock time of confirm" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Clock time of first COMPLETED appointment" }
      - { name: cancel_refund_cents, type: integer, source: computed, default: 0, description: "On cancel from CONFIRMED: sum of STOCK line_charged_cents; custom deposits forfeited" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; parent order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; ordered product" }
      - { name: qty, type: integer, source: input, description: "Quantity (>= 1)" }
      - { name: fabric_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | PREMIUM; PREMIUM only valid for CUSTOM products (x1.25 on list)" }
      - { name: unit_list_price_cents, type: integer, source: computed, description: "Snapshot: list_price_cents (x1.25 if CUSTOM PREMIUM) at line creation" }
      - { name: line_charged_cents, type: integer, source: computed, description: "Per-line discounted charge, round_half_up to integer cents (see order_line_pricing)" }
      - { name: production_status, type: enum, source: system, default: "NONE", description: "NONE (stock) | PENDING_DEPOSIT | DEPOSIT_PAID | COMMITTED | IN_PRODUCTION | COMPLETE | RELEASED" }
      - { name: production_slot_id, type: string, source: system, default: null, description: "Plain reference: ProductionSlot id committed to this line (see schedule-production)" }
      - { name: deposit_cents, type: integer, source: computed, default: 0, description: "Per-line non-cancelable deposit (0 for STOCK)" }

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id; workroom hosting the slot" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (half-open interval start)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (half-open interval end); must be > starts_at" }
      - { name: status, type: enum, source: system, description: "OPEN | COMMITTED | IN_PROGRESS | CONSUMED" }
      - { name: committed_order_line_id, type: string, source: system, default: null, description: "Plain reference: OrderLine id holding this slot" }

  - name: DesignConsultation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; consultation recipient" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; attached purchase" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled consultation time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: design_plan_notes, type: string, source: system, default: null, description: "Notes recorded at completion" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock time of completion" }

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being delivered" }
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id; owned hub dispatching the route" }
      - { name: delivery_date, type: string, source: input, description: "ISO calendar date (YYYY-MM-DD) of the route" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned on-site minutes (room placement + assembly)" }
      - { name: room_placement, type: boolean, source: input, description: "Room-of-choice placement included" }
      - { name: assembly_required, type: boolean, source: input, description: "Assembly included" }
      - { name: packaging_removed, type: boolean, source: system, default: false, description: "Packaging removal performed (set at COMPLETED)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OUT_FOR_DELIVERY | COMPLETED | FAILED | RESCHEDULED" }
      - { name: failure_reason, type: string, source: system, default: null, description: "Reason recorded on FAILED" }
      - { name: replaced_by_id, type: string, source: system, default: null, description: "Plain reference: replacement appointment id when RESCHEDULED" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being returned against" }
      - { name: order_line_ids, type: array, source: input, description: "OrderLine ids being returned (must be STOCK lines of the order)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SETTLED | REJECTED" }
      - { name: restocking_fee_cents, type: integer, source: computed, default: 0, description: "Per-line round_half_up(0.15 x line_charged_cents), then summed" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "= sum(line_charged_cents) - restocking_fee_cents; 0 when REJECTED" }
      - { name: reason, type: string, source: system, default: null, description: "Rejection reason" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Clock time of settle decision" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [CANCELLED, CANCELLED_REFUNDED, LAPSED]
    transitions:
      - from: ACTIVE
        to: GRACE
        trigger: "POST /_ops/run_daily_cycle (system: current_period_end < clock AND auto_renew == false)"
        actor: system
        preconditions: ["clock time > current_period_end", "auto_renew == false"]
        side_effects: ["grace_end = current_period_end + 30 days"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /_ops/run_daily_cycle (system renewal: current_period_end < clock AND auto_renew == true)"
        actor: system
        preconditions: ["clock time > current_period_end", "auto_renew == true"]
        side_effects:
          - "fee_paid_total_cents += 17500"
          - "current_period_start = old current_period_end; current_period_end = current_period_start + 365 days"
          - "lifetime_net_savings_cents recomputed (= gross - fee_paid_total)"
      - from: GRACE
        to: ACTIVE
        trigger: "POST /members/{id}/renew"
        actor: Member
        preconditions: ["Member role X-User-ID == member id (or PlatformAdmin)", "status == GRACE"]
        side_effects:
          - "fee_paid_total_cents += 17500"
          - "current_period_start = clock; current_period_end = clock + 365 days; grace_end = null"
          - "lifetime_net_savings_cents recomputed"
      - from: GRACE
        to: LAPSED
        trigger: "POST /_ops/run_daily_cycle (system: grace_end < clock)"
        actor: system
        preconditions: ["clock time > grace_end"]
        side_effects:
          - "Cascade A hop 2: every DesignConsultation with member_id == this member and status == SCHEDULED transitions to CANCELLED"
          - "Cascade A hop 3: each consultation cancelled in hop 2 clears its attached Order's link: if that Order.status == QUOTE, quote_expires_at is recomputed as created_at + 14 days + 14 days * (consultation_extensions_used over remaining COMPLETED consultations) and consultation_extensions_used is recomputed"
          - "Cascade A hop 2b: every Order with member_id == this member and status == QUOTE is re-priced with pricing_tier RETAIL (order_line_pricing + order_total; quote_total_cents unchanged)"
      - from: ACTIVE
        to: CANCELLED_REFUNDED
        trigger: "POST /members/{id}/cancel"
        actor: Member
        preconditions: ["Member role X-User-ID == member id", "status == ACTIVE", "clock <= current_period_start + 30 days (day-30 inclusive)"]
        side_effects: ["membership fee for current period refunded 17500", "fee_paid_total_cents -= 17500", "lifetime_net_savings_cents recomputed"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /members/{id}/cancel"
        actor: Member
        preconditions: ["Member role X-User-ID == member id", "status == ACTIVE", "clock > current_period_start + 30 days"]
        side_effects: ["no refund"]
      - from: GRACE
        to: CANCELLED
        trigger: "POST /members/{id}/cancel"
        actor: Member
        preconditions: ["Member role X-User-ID == member id", "status == GRACE"]
        side_effects: ["no refund"]

  - entity: TradeAccount
    initial_state: APPLIED
    terminal_states: [REJECTED]
    transitions:
      - from: APPLIED
        to: VERIFIED
        trigger: "POST /trade-accounts/{id}/verify"
        actor: TradeReviewer
        preconditions: ["decision == APPROVE", "tier IN {TIER_1, TIER_2}"]
        side_effects: ["tier set", "decided_at = clock"]
      - from: APPLIED
        to: REJECTED
        trigger: "POST /trade-accounts/{id}/verify"
        actor: TradeReviewer
        preconditions: ["decision == REJECT"]
        side_effects: ["decided_at = clock"]

  - entity: Order
    initial_state: QUOTE
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTE
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: Member
        preconditions:
          - "order has >= 1 line (else ERR_ORDER_EMPTY)"
          - "clock <= quote_expires_at (else ERR_QUOTE_EXPIRED)"
          - "member order: Member.status IN {ACTIVE, GRACE} (else ERR_MEMBERSHIP_NOT_ACTIVE)"
          - "trade order: TradeAccount.status == VERIFIED (else ERR_TRADE_NOT_VERIFIED)"
          - "if deposit_due_cents > 0: deposit_payment_cents present (else ERR_DEPOSIT_REQUIRED) and == deposit_due_cents (else ERR_DEPOSIT_AMOUNT_MISMATCH)"
        side_effects:
          - "final settlement re-price: order_line_pricing re-run with current member standing and current promo set; total_cents recomputed (quote_total_cents frozen)"
          - "deposit_paid_cents = deposit_due_cents; every CUSTOM line: production_status PENDING_DEPOSIT -> DEPOSIT_PAID"
          - "confirmed_at = clock"
          - "if order has no CUSTOM lines: status becomes READY_FOR_DELIVERY instead of CONFIRMED"
        note: "zero-custom orders pass straight to READY_FOR_DELIVERY on confirm"
      - from: QUOTE
        to: QUOTE
        trigger: "POST /orders/{id}/lines or DELETE /orders/{id}/lines/{lineId} (line mutation re-prices)"
        actor: Member
        preconditions: ["clock <= quote_expires_at"]
        side_effects: ["order_line_pricing + order_total recomputed", "quote_total_cents frozen at first line addition"]
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /orders/{id}/lines or DELETE /orders/{id}/lines/{lineId} (amendment; requires expected_order_version OCC)"
        actor: Member
        preconditions:
          - "expected_order_version == order.version (else ERR_STALE_VERSION)"
          - "removed line: not a CUSTOM line with production_status IN {IN_PRODUCTION, COMPLETE} (else ERR_LINE_NON_CANCELABLE)"
        side_effects:
          - "order.version += 1"
          - "removed CUSTOM line in {DEPOSIT_PAID, COMMITTED}: deposit forfeited; its ProductionSlot COMMITTED -> OPEN (reserved_production_minutes released); line production_status -> RELEASED"
          - "order_line_pricing + order_total recomputed; deposit_due_cents recomputed"
      - from: CONFIRMED
        to: READY_FOR_DELIVERY
        trigger: "system (bubble-up: every CUSTOM line reaches production_status == COMPLETE)"
        actor: system
        preconditions: ["all CUSTOM lines COMPLETE"]
        side_effects: []
      - from: READY_FOR_DELIVERY
        to: DELIVERED
        trigger: "system (first attached DeliveryAppointment reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "delivered_at = clock"
          - "member order: Member.lifetime_gross_savings_cents += (sum of unit_list_price_cents*qty - sum of line_charged_cents); lifetime_net_savings_cents recomputed"
      - from: QUOTE
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects: ["nothing paid; no refund"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "cancel_refund_cents = sum of STOCK line_charged_cents (custom deposits forfeited, non-cancelable)"
          - "every CUSTOM line with production_status COMMITTED: its ProductionSlot COMMITTED -> OPEN"

  - entity: ProductionSlot
    initial_state: OPEN
    terminal_states: [CONSUMED]
    transitions:
      - from: OPEN
        to: COMMITTED
        trigger: "POST /orders/{id}/lines/{lineId}/schedule-production"
        actor: ProductionPlanner
        preconditions:
          - "line is CUSTOM with production_status == DEPOSIT_PAID (else ERR_CUSTOM_LINE_NOT_DEPOSIT_PAID)"
          - "slot.status == OPEN (else ERR_SLOT_NOT_OPEN)"
          - "slot.gallery_id == order.gallery_id"
        side_effects:
          - "slot.committed_order_line_id = line id; line.production_slot_id = slot id"
          - "line.production_status -> COMMITTED"
          - "Gallery.reserved_production_minutes recomputed (+slot minutes)"
      - from: COMMITTED
        to: OPEN
        trigger: "system (side effect of order line removal or order cancel)"
        actor: system
        preconditions: []
        side_effects: ["committed_order_line_id = null", "Gallery.reserved_production_minutes recomputed (-slot minutes)"]
      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "POST /production-slots/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["to_state == IN_PROGRESS"]
        side_effects: ["committed line production_status -> IN_PRODUCTION", "Gallery.reserved_production_minutes unchanged (IN_PROGRESS still reserved)"]
      - from: IN_PROGRESS
        to: CONSUMED
        trigger: "POST /production-slots/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["to_state == CONSUMED"]
        side_effects:
          - "committed line production_status -> COMPLETE"
          - "Gallery.reserved_production_minutes recomputed (-slot minutes)"
          - "Order bubble-up: if all CUSTOM lines COMPLETE, Order CONFIRMED -> READY_FOR_DELIVERY"

  - entity: DesignConsultation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /design-consultations/{id}/complete"
        actor: GalleryAssociate
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "design_plan_notes set; completed_at = clock"
          - "attached Order: if Order.status == QUOTE, quote_expires_at += 14 days and consultation_extensions_used += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (Cascade A: owning Member transitions GRACE -> LAPSED)"
        actor: system
        preconditions: []
        side_effects: ["Cascade A hop 3: attached QUOTE order quote_expires_at recomputed without this consultation's extension"]

  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RESCHEDULED]
    transitions:
      - from: SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "POST /_ops/run_daily_cycle (system: delivery_date <= clock date)"
        actor: system
        preconditions: ["clock date >= delivery_date"]
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: COMPLETED
        trigger: "POST /delivery-appointments/{id}/record-outcome"
        actor: HubOperator
        preconditions: ["outcome == COMPLETED"]
        side_effects:
          - "packaging_removed = input packaging_removed"
          - "Gallery.booked_route_minutes[date] -= (duration_minutes + 30)"
          - "Order READY_FOR_DELIVERY -> DELIVERED (first completion); Member savings recognized"
      - from: OUT_FOR_DELIVERY
        to: FAILED
        trigger: "POST /delivery-appointments/{id}/record-outcome"
        actor: HubOperator
        preconditions: ["outcome == FAILED", "failure_reason present"]
        side_effects: ["failure_reason set", "Gallery.booked_route_minutes[date] -= (duration_minutes + 30) (route capacity released)"]
      - from: FAILED
        to: RESCHEDULED
        trigger: "system (a new DeliveryAppointment is created for the same order)"
        actor: system
        preconditions: []
        side_effects: ["replaced_by_id = new appointment id"]

  - entity: SourceBook
    initial_state: IN_PRINT
    terminal_states: [ARCHIVED]
    transitions:
      - from: IN_PRINT
        to: RELEASED
        trigger: "POST /_ops/run_daily_cycle (system: clock >= print_ready_date + 21 days)"
        actor: system
        preconditions: ["clock >= print_ready_date + 21 days"]
        side_effects:
          - "released_at = clock"
          - "any other SourceBook in RELEASED -> ARCHIVED (its promo deactivates; affected QUOTE orders re-priced)"
          - "Cascade B hop 2: every Product in product_ids gets promo_active = true"
          - "Cascade B hop 3: every Order in QUOTE containing a product whose promo_active just changed is re-priced (order_line_pricing + order_total)"
      - from: RELEASED
        to: ARCHIVED
        trigger: "system (a newer SourceBook is released)"
        actor: system
        preconditions: []
        side_effects: ["products in this book not in the new book get promo_active = false; affected QUOTE orders re-priced"]

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: SETTLED
        trigger: "POST /returns/{id}/settle"
        actor: GalleryAssociate
        preconditions: ["decision == APPROVE"]
        side_effects: ["restocking_fee_cents and refund_cents computed (restocking_refund calc)", "decided_at = clock"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/settle"
        actor: GalleryAssociate
        preconditions: ["decision == REJECT", "reason present"]
        side_effects: ["refund_cents = 0", "decided_at = clock"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-line-add-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/lines"
    occ_field: "expected_order_version"
    description: |
      Adding a line to a CONFIRMED order whose version has advanced since the
      client last observed it is rejected. expected_order_version encodes the
      client's last-observed Order.version; a mismatch means another amendment
      has landed and this client's view of the order is stale. In QUOTE the
      field is optional and ignored.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-line-remove-stale-order
    parent_entity: Order
    write_endpoint: "DELETE /orders/{id}/lines/{lineId}"
    occ_field: "expected_order_version"
    description: |
      Removing a line from a CONFIRMED order whose version has advanced since
      the client last observed it is rejected on the same stale-version basis
      as line addition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_pricing
    trigger: "line creation, line removal, order confirm (final settlement), member lapse re-price, sourcebook release re-price"
    algorithm: tiered_pricing
    formula: |
      Per line (evaluation order pinned):
        base = unit_list_price_cents            # snapshot at creation; CUSTOM PREMIUM already x1.25
        promo_price = round_half_up(base * 0.90) if product.promo_active else base
        if order.pricing_tier == TRADE: line_unit = round_half_up(base * (1 - trade_pct))   # promo IGNORED for trade
        elif tier == MEMBER: line_unit = round_half_up(promo_price * 0.75)
        else (RETAIL): line_unit = promo_price
        line_charged_cents = line_unit * qty    # per-line rounding happens at unit level, then multiply
      order.subtotal_cents = sum(line_charged_cents)   # sum AFTER per-line rounding
    input_set: "All current lines of the order; product.promo_active at calculation time; member standing at calculation time"
    constants:
      MEMBER_DISCOUNT_PCT: 0.25
      TRADE_TIER_1_PCT: 0.30
      TRADE_TIER_2_PCT: 0.40
      PROMO_PCT: 0.10
      PREMIUM_FABRIC_MULT: 1.25
    precision: "integer cents, round_half_up at the per-unit step"
    variants:
      - name: provisional_quote
        when: "order in QUOTE: priced with membership standing and promo set at calculation time; quote_total_cents frozen at first line addition"
        difference: "quote_total_cents never changes after first line; total_cents keeps tracking current inputs"
      - name: final_settlement
        when: "POST /orders/{id}/confirm: full re-price with standing and promo set at confirm time"
        difference: "total_cents may diverge from quote_total_cents (e.g., promo released between quote and confirm); quote_total_cents is not rewritten"

  - name: order_total
    trigger: "after every order_line_pricing run"
    algorithm: threshold
    formula: |
      Evaluation order pinned (circular-looking dependency resolved):
        1. subtotal_cents = sum of line_charged_cents (per-line rounded first)
        2. fee waiver check: white_glove_fee_cents = 0 if pricing_tier == TRADE ? never waived : (subtotal_cents >= 1000000 ? 0 : 19900)
           TRADE fee is always 14900 (no waiver).
        3. total_cents = subtotal_cents + white_glove_fee_cents
      deposit_due_cents = sum over CUSTOM lines of custom_deposit(line)
    input_set: "current lines only"
    constants:
      WHITE_GLOVE_FEE_CENTS: 19900
      TRADE_WHITE_GLOVE_FEE_CENTS: 14900
      FEE_WAIVER_THRESHOLD_CENTS: 1000000
    precision: "integer cents"

  - name: custom_deposit
    trigger: "line creation and re-price for CUSTOM lines"
    algorithm: constraint_propagation
    formula: |
      rate = 0.25 if pricing_tier == TRADE else 0.50
      floor = 25000 if pricing_tier == TRADE else 50000
      deposit_cents = max(round_half_up(line_charged_cents * rate), floor)
    input_set: "CUSTOM lines of the order"
    constants:
      DEPOSIT_RATE_STANDARD: 0.50
      DEPOSIT_FLOOR_STANDARD: 50000
      DEPOSIT_RATE_TRADE: 0.25
      DEPOSIT_FLOOR_TRADE: 25000
    precision: "integer cents, round_half_up"

  - name: restocking_refund
    trigger: "POST /returns/{id}/settle with decision == APPROVE"
    algorithm: aggregation
    formula: |
      Rounding order pinned: per-line first, then sum.
      restocking_fee_cents = sum over returned lines of round_half_up(0.15 * line_charged_cents)
      refund_cents = sum over returned lines of line_charged_cents - restocking_fee_cents
      (Sum-then-round is a rejected alternative: for two lines charged 1003 each,
       per-line-then-sum gives 150+150 = 300; sum-then-round would give round(0.15*2006)=301.)
    input_set: "OrderLines named in ReturnRequest.order_line_ids (STOCK only)"
    constants:
      RESTOCK_PCT: 0.15
    precision: "integer cents, round_half_up per line"

  - name: membership_savings
    trigger: "Order transitions to DELIVERED (member orders only); membership fee events"
    algorithm: aggregation
    formula: |
      On DELIVERED: lifetime_gross_savings_cents += (sum of unit_list_price_cents * qty) - (sum of line_charged_cents)
      lifetime_net_savings_cents = lifetime_gross_savings_cents - fee_paid_total_cents
      Recognition timing pinned: savings are recognized at DELIVERED, never at CONFIRMED.
    input_set: "member's own DELIVERED orders only"
    precision: "integer cents"
    variants:
      - name: gross
        when: "lifetime_gross_savings_cents: raw discount granted"
        difference: "ignores membership fees paid"
      - name: net
        when: "lifetime_net_savings_cents"
        difference: "subtracts fee_paid_total_cents; same deliveries, different figure"

  - name: route_capacity_check
    trigger: "POST /delivery-appointments"
    algorithm: threshold
    formula: |
      consumed = sum of (duration_minutes + 30) over appointments with same gallery_id and
                 delivery_date and status IN {SCHEDULED, OUT_FOR_DELIVERY}
      reject if consumed + (new duration_minutes + 30) > gallery.daily_route_minutes_capacity   # strictly greater
      Gallery.booked_route_minutes[date] mirrors this sum.
    input_set: "appointments of the gallery on the date, statuses {SCHEDULED, OUT_FOR_DELIVERY}"
    constants:
      ROUTE_BUFFER_MINUTES: 30
    precision: "integer minutes"

  - name: slot_overlap_check
    trigger: "POST /production-slots"
    algorithm: interval_merge
    formula: |
      Half-open intervals [starts_at, ends_at). A new slot on gallery G conflicts with an
      existing slot S on G with S.status != CONSUMED iff new.starts_at < S.ends_at AND
      S.starts_at < new.ends_at. Adjacency (new.starts_at == S.ends_at) does NOT conflict.
    input_set: "ProductionSlots of the same gallery with status != CONSUMED"
    precision: "datetime comparison"

  - name: membership_period_math
    trigger: "enrollment, renewal, run_daily_cycle, cancel"
    algorithm: chronological
    formula: |
      current_period_end = current_period_start + 365 days
      grace_end = current_period_end + 30 days
      cancel full-refund window: clock <= current_period_start + 30 days (day 30 inclusive)
      run_daily_cycle ordering pinned: (1) auto-renew ACTIVE members past period end,
      (2) move non-auto-renew ACTIVE members past period end to GRACE,
      (3) move GRACE members past grace_end to LAPSED (Cascade A),
      (4) release eligible source books (Cascade B),
      (5) dispatch due appointments.
    input_set: "all Members; all SourceBooks IN_PRINT; all DeliveryAppointments SCHEDULED"
    constants:
      MEMBERSHIP_PERIOD_DAYS: 365
      GRACE_DAYS: 30
      CANCEL_REFUND_WINDOW_DAYS: 30
      MEMBERSHIP_FEE_CENTS: 17500
      PRINT_LEAD_DAYS: 21
    precision: "datetime arithmetic on the logical clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed on the endpoint; entity-backed ownership: Member role X-User-ID must equal the target member_id / order.member_id / consultation.member_id / return order's member_id; TradeDesigner X-User-ID must equal trade_account_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all (specialized: ERR_MEMBER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_GALLERY_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_CONSULTATION_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_TRADE_ACCOUNT_NOT_FOUND)" }
  - { priority: 4, category: state, check: "State preconditions of the transition (e.g., confirm from QUOTE; member standing for confirm/consultation/trade-order-create; slot OPEN; line deposit paid; custom line removable)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (specialized: ERR_MEMBERSHIP_NOT_ACTIVE, ERR_TRADE_NOT_VERIFIED, ERR_ORDER_EMPTY 422, ERR_LINE_NON_CANCELABLE, ERR_SLOT_NOT_OPEN, ERR_CUSTOM_LINE_NOT_DEPOSIT_PAID)" }
  - { priority: 5, category: business_referential, check: "Referenced product exists, status == ACTIVE (else ERR_PRODUCT_UNAVAILABLE); fabric_tier only on CUSTOM products and PREMIUM requires CUSTOM (else ERR_PRODUCT_KIND_MISMATCH); order create: exactly one of member_id/trade_account_id or neither; trade account must exist", error_id: ERR_PRODUCT_UNAVAILABLE, http_status: 422, applies_to: ["POST /orders/{id}/lines", "POST /orders"] }
  - { priority: 6, category: business_temporal, check: "Quote not expired for line mutations and confirm (ERR_QUOTE_EXPIRED); production slot overlap (ERR_SLOT_OVERLAP); route daily capacity (ERR_ROUTE_CAPACITY_EXCEEDED); return within 30 days of delivered_at (ERR_RETURN_WINDOW_CLOSED)", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: ["POST /orders/{id}/lines", "DELETE /orders/{id}/lines/{lineId}", "POST /orders/{id}/confirm", "POST /production-slots", "POST /delivery-appointments", "POST /returns"] }
  - { priority: 7, category: business_constraint, check: "Unique email/SKU (ERR_DUPLICATE_EMAIL); order has no active appointment in {SCHEDULED, OUT_FOR_DELIVERY} when creating one (ERR_APPOINTMENT_EXISTS); return lines all STOCK (ERR_CUSTOM_NON_RETURNABLE); malformed/missing fields (ERR_INVALID_REQUEST 400); bad enum (ERR_INVALID_ENUM 400)", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: ["POST /members", "POST /trade-accounts", "POST /delivery-appointments", "POST /returns", "all"] }
  - { priority: 8, category: business_fiscal, check: "Confirm with deposit_due_cents > 0 requires deposit_payment_cents present (ERR_DEPOSIT_REQUIRED) and exactly equal (ERR_DEPOSIT_AMOUNT_MISMATCH)", error_id: ERR_DEPOSIT_REQUIRED, http_status: 422, applies_to: ["POST /orders/{id}/confirm"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/members", description: "Enroll a member: charges the 17500 annual fee (payment_token assumed valid), starts period at the logical clock, status ACTIVE", roles: [Anonymous], code: 201, input: [email, full_name, auto_renew, payment_token], output: Member, side_effects: ["fee_paid_total_cents=17500", "current_period_start=clock, current_period_end=clock+365d"] }
  - { method: GET, path: "/members/{id}", description: "Read a member (ownership: Member role may read only itself)", roles: [Member, GalleryAssociate, PlatformAdmin], code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/members/{id}/renew", description: "Renew from GRACE: charges 17500, new period starts at clock, back to ACTIVE", roles: [Member, PlatformAdmin], code: 200, input: [payment_token], output: Member, side_effects: ["GRACE->ACTIVE per state machine"] }
  - { method: POST, path: "/members/{id}/cancel", description: "Cancel membership: full fee refund if clock <= period_start+30d (CANCELLED_REFUNDED), else CANCELLED without refund", roles: [Member], code: 200, input: [], output: Member, side_effects: ["per state machine"] }
  - { method: POST, path: "/trade-accounts", description: "Apply for the trade program with credentials; status APPLIED", roles: [Anonymous], code: 201, input: [email, business_name, credential_document_id, license_number], output: TradeAccount, side_effects: [] }
  - { method: POST, path: "/trade-accounts/{id}/verify", description: "Credential decision: APPROVE requires tier; REJECT terminal", roles: [TradeReviewer], code: 200, input: [decision, "tier?"], output: TradeAccount, side_effects: ["APPLIED->VERIFIED|REJECTED"] }
  - { method: POST, path: "/galleries", description: "Create a gallery with its white-glove route capacity", roles: [PlatformAdmin], code: 201, input: [name, region, daily_route_minutes_capacity], output: Gallery, side_effects: [] }
  - { method: GET, path: "/galleries/{id}", description: "Read a gallery including booked_route_minutes and reserved_production_minutes", roles: [PlatformAdmin, GalleryAssociate, HubOperator, ProductionPlanner], code: 200, input: [], output: Gallery, side_effects: [] }
  - { method: GET, path: "/galleries/{id}/production-slots", description: "List production slots hosted by this gallery", roles: [ProductionPlanner, PlatformAdmin], code: 200, input: [], output: "ProductionSlot[]", side_effects: [] }
  - { method: POST, path: "/products", description: "Create a product; status defaults to ACTIVE, may be created DISCONTINUED", roles: [PlatformAdmin], code: 201, input: [sku, name, list_price_cents, line_kind, "status?"], output: Product, side_effects: ["promo_active=false"] }
  - { method: GET, path: "/products/{id}", description: "Read a product including promo_active", roles: [Anonymous, Member, TradeDesigner, GalleryAssociate, PlatformAdmin, ProductionPlanner], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/products/{id}/order-lines", description: "List order lines referencing this product", roles: [ProductionPlanner, PlatformAdmin, GalleryAssociate], code: 200, input: [], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/source-books", description: "Create a source book edition; enters IN_PRINT immediately; system releases it at print_ready_date + 21 days during run_daily_cycle", roles: [PlatformAdmin], code: 201, input: [title, product_ids, print_ready_date], output: SourceBook, side_effects: ["status=IN_PRINT"] }
  - { method: POST, path: "/orders", description: "Create a QUOTE order: member order (Member role, member_id must equal caller), trade order (TradeDesigner role, trade_account_id must equal caller and be VERIFIED), or retail guest order (GalleryAssociate, neither id)", roles: [Member, TradeDesigner, GalleryAssociate], code: 201, input: [gallery_id, "member_id?", "trade_account_id?"], output: Order, side_effects: ["pricing_tier snapshot", "quote_expires_at = clock + 14 days"] }
  - { method: GET, path: "/orders/{id}", description: "Read an order (ownership: Member/TradeDesigner may read only own orders)", roles: [Member, TradeDesigner, GalleryAssociate, HubOperator, PlatformAdmin, ProductionPlanner], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/orders", description: "List orders with filters and envelope pagination", roles: [GalleryAssociate, PlatformAdmin], code: 200, input: ["member_id?", "trade_account_id?", "gallery_id?", "status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/lines", description: "Add a line in QUOTE or CONFIRMED (CONFIRMED requires expected_order_version OCC); re-prices the order", roles: [Member, TradeDesigner, GalleryAssociate], code: 201, input: [product_id, qty, "fabric_tier?", "expected_order_version?"], output: OrderLine, side_effects: ["order_line_pricing + order_total recompute", "increments Order.version by 1", "CUSTOM line production_status=PENDING_DEPOSIT"] }
  - { method: DELETE, path: "/orders/{id}/lines/{lineId}", description: "Remove a line in QUOTE or CONFIRMED (CONFIRMED requires expected_order_version OCC); custom lines IN_PRODUCTION/COMPLETE are non-cancelable", roles: [Member, TradeDesigner, GalleryAssociate], code: 200, input: ["expected_order_version?"], output: Order, side_effects: ["increments Order.version by 1", "CUSTOM line in {DEPOSIT_PAID, COMMITTED}: deposit forfeited, slot COMMITTED->OPEN, line RELEASED", "re-price"] }
  - { method: GET, path: "/orders/{id}/lines", description: "List lines of an order", roles: [Member, TradeDesigner, GalleryAssociate, ProductionPlanner, PlatformAdmin], code: 200, input: [], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/lines/{lineId}/schedule-production", description: "Commit an OPEN production slot to a DEPOSIT_PAID custom line", roles: [ProductionPlanner], code: 200, input: [production_slot_id], output: ProductionSlot, side_effects: ["slot OPEN->COMMITTED", "line DEPOSIT_PAID->COMMITTED", "Gallery.reserved_production_minutes recomputed"] }
  - { method: POST, path: "/orders/{id}/confirm", description: "Confirm a quote: final settlement re-price; exact deposit payment required when custom lines exist; zero-custom orders go straight to READY_FOR_DELIVERY", roles: [Member, TradeDesigner, GalleryAssociate], code: 200, input: ["deposit_payment_cents?"], output: Order, side_effects: ["final_settlement pricing variant", "custom lines -> DEPOSIT_PAID", "confirmed_at=clock"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel from QUOTE (no refund) or CONFIRMED (stock lines refunded, custom deposits forfeited, committed slots released)", roles: [Member, TradeDesigner, GalleryAssociate], code: 200, input: [], output: Order, side_effects: ["cancel_refund_cents computed", "slots COMMITTED->OPEN"] }
  - { method: POST, path: "/production-slots", description: "Open a production slot on a gallery workroom; half-open overlap check against non-CONSUMED slots of the same gallery", roles: [ProductionPlanner], code: 201, input: [gallery_id, starts_at, ends_at], output: ProductionSlot, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/production-slots/{id}", description: "Read a production slot", roles: [ProductionPlanner, PlatformAdmin], code: 200, input: [], output: ProductionSlot, side_effects: [] }
  - { method: POST, path: "/production-slots/{id}/advance", description: "Advance COMMITTED->IN_PROGRESS (to_state=IN_PROGRESS) or IN_PROGRESS->CONSUMED (to_state=CONSUMED, completes the line and may bubble the order to READY_FOR_DELIVERY)", roles: [ProductionPlanner], code: 200, input: [to_state], output: ProductionSlot, side_effects: ["line production_status advances", "reserved_production_minutes recomputed", "order bubble-up"] }
  - { method: POST, path: "/design-consultations", description: "Book a free design consultation attached to a purchase; member must be ACTIVE/GRACE and own the order (Member role) or GalleryAssociate on member's behalf; order must be QUOTE or CONFIRMED", roles: [Member, GalleryAssociate], code: 201, input: [member_id, order_id, scheduled_at], output: DesignConsultation, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/design-consultations/{id}", description: "Read a consultation", roles: [Member, GalleryAssociate, PlatformAdmin], code: 200, input: [], output: DesignConsultation, side_effects: [] }
  - { method: GET, path: "/design-consultations", description: "List consultations with filters", roles: [GalleryAssociate, PlatformAdmin], code: 200, input: ["member_id?", "order_id?", "status?", "limit?", "offset?"], output: "DesignConsultation[]", side_effects: [] }
  - { method: POST, path: "/design-consultations/{id}/complete", description: "Complete a consultation; extends the attached QUOTE's expiry by 14 days", roles: [GalleryAssociate], code: 200, input: [design_plan_notes], output: DesignConsultation, side_effects: ["SCHEDULED->COMPLETED", "order quote extension"] }
  - { method: POST, path: "/delivery-appointments", description: "Schedule white-glove delivery: order must be READY_FOR_DELIVERY, no active appointment for the order, gallery daily route capacity check (duration + 30 min buffer)", roles: [GalleryAssociate, HubOperator], code: 201, input: [order_id, gallery_id, delivery_date, duration_minutes, room_placement, assembly_required], output: DeliveryAppointment, side_effects: ["status=SCHEDULED", "Gallery.booked_route_minutes[date] += duration+30", "prior FAILED appointment of same order -> RESCHEDULED"] }
  - { method: GET, path: "/delivery-appointments/{id}", description: "Read an appointment", roles: [GalleryAssociate, HubOperator, Member, PlatformAdmin], code: 200, input: [], output: DeliveryAppointment, side_effects: [] }
  - { method: GET, path: "/delivery-appointments", description: "List appointments with filters", roles: [GalleryAssociate, HubOperator, PlatformAdmin], code: 200, input: ["gallery_id?", "order_id?", "delivery_date?", "limit?", "offset?"], output: "DeliveryAppointment[]", side_effects: [] }
  - { method: POST, path: "/delivery-appointments/{id}/record-outcome", description: "Hub operator records COMPLETED (packaging_removed captured) or FAILED (failure_reason required); both release the booked route minutes; first COMPLETED delivers the order", roles: [HubOperator], code: 200, input: [outcome, "packaging_removed?", "failure_reason?"], output: DeliveryAppointment, side_effects: ["per state machine", "order DELIVERED on first completion", "member savings recognized"] }
  - { method: POST, path: "/returns", description: "Request return of STOCK lines of a DELIVERED order within 30 days of delivered_at", roles: [Member, TradeDesigner, GalleryAssociate], code: 201, input: [order_id, order_line_ids], output: ReturnRequest, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/returns/{id}", description: "Read a return request", roles: [Member, TradeDesigner, GalleryAssociate, PlatformAdmin], code: 200, input: [], output: ReturnRequest, side_effects: [] }
  - { method: GET, path: "/returns", description: "List return requests with filters", roles: [GalleryAssociate, PlatformAdmin], code: 200, input: ["order_id?", "status?", "limit?", "offset?"], output: "ReturnRequest[]", side_effects: [] }
  - { method: POST, path: "/returns/{id}/settle", description: "Settle: APPROVE computes per-line-rounded restocking fee and refund; REJECT requires reason and refunds 0", roles: [GalleryAssociate], code: 200, input: [decision, "reason?"], output: ReturnRequest, side_effects: ["restocking_refund calc on APPROVE"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/_ops/run_daily_cycle", description: "Ops-run checkpoint (test-driving): ordered steps (1) auto-renew, (2) ACTIVE->GRACE, (3) GRACE->LAPSED with Cascade A, (4) source book release with Cascade B, (5) dispatch due appointments", roles: [PlatformAdmin], code: 200, input: [], output: null, side_effects: ["membership cycle", "source book release", "appointment dispatch"] }

