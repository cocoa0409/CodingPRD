            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${l1_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep1_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${l1_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
            - { call: "POST /union-compliance/contribution-reports/${rep1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
