# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-scoped id does not resolve within the parent scope"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state that does not permit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version in the request does not match the parent entity's current version"
  - id: ERR_AGENT_NOT_CERTIFIED
    http: 422
    condition: "Acting agent's cert_status is not CERTIFIED"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 422
    condition: "Acting agent does not own the resource (proposed_by / primary_agent mismatch)"
  - id: ERR_WINDOW_CLOSED
    http: 422
    condition: "TenderOption exercise outside [window_open_at, window_close_at), or EndorsementDeal end_date <= start_date"
  - id: ERR_CAP_WOULD_EXCEED
    http: 422
    condition: "Submission would push committed + reserved + proposed_aav above luxury_threshold_cents"
  - id: ERR_CAP_HARD_LIMIT
    http: 422
    condition: "Acceptance would push committed + proposed_aav above cap_limit_cents"
  - id: ERR_RESOURCE_LOCKED
    http: 409
    condition: "CapSeason is LOCKED/CLOSED, or Agency is SUSPENDED"
  - id: ERR_DUPLICATE_ACTIVE_CONTRACT
    http: 409
    condition: "Client already has a NEGOTIATING or SIGNED Contract with the same team"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Field constraint violation (years range, guaranteed <= base*years, escalator bound, missing required field)"
  - id: ERR_CLIENT_HAS_ACTIVE_OBLIGATIONS
    http: 409
    condition: "Release attempted while a NEGOTIATING/SIGNED contract or ACTIVE endorsement exists"
  - id: ERR_OPEN_GRIEVANCE
    http: 409
    condition: "Contract void attempted while a FILED/UNDER_REVIEW/ARBITRATION grievance is open"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueOfficer
    description: "League operations role. Owns Team/CapSeason lifecycle, grievance review, agency creation."
    identity: opaque
    exclusive_operations:
      - "POST /agencies — create agency"
      - "POST /teams — create team"
      - "POST /teams/{id}/cap_seasons — create cap season"
      - "POST /teams/{id}/cap_seasons/{id}/lock|unlock|close — cap season lifecycle"
      - "POST .../grievances/{id}/start_review|return_for_cure|escalate|resolve — grievance adjudication"
    shared_operations:
      - "GET on any resource"
      - "POST /_clock/set_current_utc — set logical clock"

  - name: AgencyManager
    description: "Manager within an agency (an Agent with is_manager=true). Certifies agents, drives client transitions, approves endorsements, marks fees paid."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /agencies/{aid}/agents — register new agent"
      - "POST /agencies/{aid}/agents/{id}/certify|suspend|reinstate|revoke — cert lifecycle"
      - "POST /agencies/{aid}/clients/{id}/initiate_transition|complete_transition|release — roster lifecycle"
      - "POST .../endorsements/{id}/approve|terminate — endorsement lifecycle"
      - "POST /agencies/{aid}/fee_ledger_entries/{id}/mark_paid"
      - "POST .../contracts/{id}/void — void a contract"
    shared_operations:
      - "GET on agency-scoped resources"
      - "POST /agencies/{aid}/clients — register a client"
      - "POST /_clock/set_current_utc"

  - name: Agent
    description: "Certified player agent. Files proposals, signs contracts, exercises options, files grievances, creates endorsements."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST .../contracts — create contract"
      - "POST .../contracts/{id}/sign — sign contract"
      - "POST .../proposals — create proposal"
      - "POST .../proposals/{id}/submit|resubmit|withdraw — agent-side negotiation"
      - "POST .../tender_options/{id}/exercise"
      - "POST .../grievances — file grievance"
      - "POST .../grievances/{id}/withdraw"
      - "POST .../endorsements — create endorsement deal"
    shared_operations:
      - "GET on agency-scoped resources"
      - "POST /agencies/{aid}/clients — register a client"

  - name: Team
    description: "Team front-office role. Counters/accepts/rejects proposals."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST .../proposals/{id}/counter|accept|reject — team-side negotiation"
    shared_operations:
      - "GET on teams, cap seasons, contracts, proposals, tender options"

  - name: Player
    description: "Read-only role for the athlete."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "GET on own agency, client record, contracts, endorsements, grievances, tender options"
