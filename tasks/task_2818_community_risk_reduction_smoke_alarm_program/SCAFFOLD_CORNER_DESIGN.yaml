            - "DeviceLot.${lot_id}.reserved_qty == 0"
            - "DeviceLot.${lot_id}.consumed_qty == 0"
            - "DeviceLot.${lot_id}.status == AVAILABLE"
            - "DeviceLot.${lot_id}.version == 1 (versions start at 1; receipt is the create)"
            - "GET /crr/device-lots/${lot_id} returns 200 with the identical field set (sku SKU-SM10-A, unit_cost_cents 1850, expiry_date 2027-06-30)"
            - "GET /crr/device-lots?funding_grant_id=${g_id} returns total_count 1 and has_more false"
            - "GET /crr/device-lots?status=DEPLETED returns total_count 0"
            - "the grant's money counters are untouched by receipt: PartnerGrant.${g_id}.reserved_cents == 0 and PartnerGrant.${g_id}.available_cents == 500000"

