            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 1.0, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/temperature-excursions/${exc}/assess", payload: { outcome: "ACCEPTABLE", resolution_rationale: "QA release" }, as: SponsorAdmin }
            - { call: "GET /api/lots/${lot}", as: SponsorAdmin, captures: { consumed_after_assess: $.data.stability_minutes_consumed } }
