            - "Enrolled student: HTTP status == 201 and Screening.${scr_ok_id}.status == SCHEDULED"
            - "Screening.${scr_ok_id}.cycle_number == 1 and Screening.${scr_ok_id}.outcome == null"
            - "GET /health-office/screenings?student_id=${stu_out_id} returns total_count == 0"
            - "School.${sch_id}.enrolled_student_count == 1"

  - section: endpoints
    instances:

      - name: nurse_patch_flips_employment_status_and_recomputes_every_school
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /health-office/nurses/{id}]
          - entities.Nurse.fields.employment_status
          - calculations.school_nurse_coverage_ratio
        distinguishing_aspect: "PATCH /health-office/nurses/{id} with employment_status INACTIVE bumps Nurse.version and recomputes both ratio variants at every school the nurse covers: delivered_weekly_minutes falls 480.0 -> 0.0 and coverage_posture drops LIMITED -> UNCOVERED, while contracted_weekly_minutes stays 480."
        test_recipe:
          setup:
            - "School BRACE56 with one ENROLLED student and one RN on an ACTIVE Monday block of 480 minutes; no stock lots, so posture starts LIMITED."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Bracewell Elementary", building_code: "BRC56", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Bea Ortega", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id, rn_v0: $.data.version }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Bram Kell", grade_level: 2, date_of_birth: "2018-05-05T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
