          Consumption is walked to one call short of the allowance (ratio 499999/500000, still
          SOFT_THROTTLED) and then to exactly the allowance, where the inclusive >= 1.00 bound
          makes it HARD_THROTTLED with overage_calls exactly 0 — the boundary a > comparison
          would miss and a subtract-after-clamp implementation would report as 1. The first
          window also breaches the instantaneous rate check (499999 / 60 > 6750) while sitting
          below the monthly hard bound, proving the two thresholds are independent.
