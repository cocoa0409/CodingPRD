# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Sports Facility Scheduling & Field Allocation
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: organization_creation_system_field_input_ignored_and_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.Organization"
        distinguishing_aspect: "Create returns standing GOOD, no_show_strikes_active 0, version 1, server id/created_at; an injected standing='SUSPENDED' input is ignored (unknown input fields are tolerated, never honored)."
        test_recipe:
          setup: ["Empty DB; clock default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3, standing: "SUSPENDED" }, as: AthleticsAdmin, captures: { o_id: $.data.id, o_st: $.data.standing, o_sc: $.data.no_show_strikes_active, o_v: $.data.version } }
          assert:
            - "response 201; standing == GOOD (injected SUSPENDED ignored)"
            - "no_show_strikes_active == 0; version == 1; id is a server-minted UUID; created_at == logical clock instant"
      - name: facility_creation_defaults_open_condition
        claim_type: defaults
        grounds:
          - "entities.Facility"
          - "state_machines.Facility"
        distinguishing_aspect: "New facility starts OPEN with weekly_prime_hours_used == 0 — the machine's initial_state is observable on the creation response."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_cond: $.data.condition_status, f_load: $.data.weekly_prime_hours_used } }
          assert:
            - "condition_status == OPEN; weekly_prime_hours_used == 0; version == 1"
      - name: application_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required facility_id from POST /permit-applications yields 400 ERR_INVALID_REQUEST before any state/business check runs."
        test_recipe:
          setup: ["Org + facility exist; window OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http 400; no PermitApplication persisted"
      - name: application_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "validations[priority=2]"
          - "entities.PermitApplication.fields.event_type"
        distinguishing_aspect: "event_type 'SCRIMMAGE' is outside the declared enum -> 400 ERR_INVALID_REQUEST (enum closure at the shape layer, priority 2)."
        test_recipe:
          setup: ["Org + facility exist; window OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "SCRIMMAGE", headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: get_organization_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_ORGANIZATION_NOT_FOUND]"
          - "validations[priority=5]"
        distinguishing_aspect: "GET with a well-formed but absent UUID returns the domain-specific 404, not a generic error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /organizations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: AthleticsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORGANIZATION_NOT_FOUND; http 404"
      - name: fee_schedule_publish_supersedes_previous
        claim_type: side_effect_execution
        grounds:
          - "state_machines.FeeSchedule.PUBLISHED_to_SUPERSEDED"
        distinguishing_aspect: "Publishing schedule 2 atomically moves schedule 1 PUBLISHED -> SUPERSEDED; exactly one PUBLISHED schedule exists afterwards."
        test_recipe:
          setup: ["Two DRAFT schedules"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs1: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Revised", effective_from: "2026-08-15T00:00:00Z", hourly_resident_cents: 2200, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 750, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs2: $.data.id } }
            - { call: "POST /fee-schedules/${fs1}/publish", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "POST /fee-schedules/${fs2}/publish", payload: {}, as: AthleticsAdmin, captures: { fs2_st: $.data.status } }
            - { call: "GET /fee-schedules/${fs1}", payload: {}, as: AthleticsAdmin, captures: { fs1_st: $.data.status } }
          assert:
            - "FS2 status == PUBLISHED; FS1 status == SUPERSEDED"
      - name: usage_ledger_row_created_on_first_award_with_prime_split
        claim_type: computed_fields
        grounds:
          - "entities.UsageLedger"
          - "calculations.allocation_run"
        distinguishing_aspect: "The (org, season) ledger row does not exist until the first award; a 14:00-16:00 non-prime award lands in awarded_nonprime_hours == 2 with awarded_prime_hours == 0 (prime boundary at start_minute 1020)."
        test_recipe:
          setup: ["Org/facility/schedule; window with one 14:00-16:00 application; window allocated"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 840, end_minute: 960, event_type: "LEAGUE_PRACTICE", wants_lights: false, headcount: 30 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "GET /usage-ledgers", payload: { organization_id: "${o_id}", season_code: "2026-FALL" }, as: AthleticsAdmin, captures: { ul_prime: "$.data[0].awarded_prime_hours", ul_non: "$.data[0].awarded_nonprime_hours", ul_season: "$.data[0].season_code" } }
          assert:
            - "Exactly one UsageLedger row; season_code == 2026-FALL"
            - "awarded_prime_hours == 0 and awarded_nonprime_hours == 2 (start 840 < 1020 is non-prime)"
      - name: permit_self_referential_lineage_visible_after_reschedule
        claim_type: parent_relationships
        grounds:
          - "entities.Permit.fields.original_permit_id"
        distinguishing_aspect: "After a rain reschedule, original_permit_id is set (self-referential lineage root) and reverse-reachable via GET /permits?original_permit_id."
        test_recipe:
          setup: ["CONFIRMED permit 2026-08-10; full-day RAIN closure on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_id: "$.data[0].id", p_orig0: "$.data[0].original_permit_id" } }
            - { call: "POST /field-closures", payload: { facility_id: "${f_id}", closure_date: "2026-08-10", reason: "RAIN" }, as: FieldSupervisor }
            - { call: "GET /permits/${p_id}", payload: {}, as: AthleticsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /permits/${p_id}/reschedule", payload: { new_date: "2026-08-12", new_start_minute: 1080, new_end_minute: 1200, expected_permit_version: "${pv}" }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { p_orig1: $.data.original_permit_id } }
            - { call: "GET /permits", payload: { original_permit_id: "${p_id}" }, as: AthleticsAdmin, captures: { lin_id: "$.data[0].id" } }
          assert:
            - "Before reschedule: original_permit_id is null"
            - "After reschedule: original_permit_id == ${p_id} (lineage root = first award's id)"
            - "GET /permits?original_permit_id=${p_id} returns exactly the rescheduled permit"

  - section: state_machines
    instances:
      - name: window_open_before_opens_at_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AllocationWindow.SCHEDULED_to_OPEN"
          - "errors[ERR_WINDOW_NOT_YET_OPEN]"
        distinguishing_aspect: "Opening a window while the logical clock (2026-08-01T09:00 default zone) is before opens_at (2026-08-05) fails with ERR_WINDOW_NOT_YET_OPEN; window stays SCHEDULED."
        test_recipe:
          setup: ["Window with opens_at 2026-08-05T00:00:00Z; clock at 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_NOT_YET_OPEN; window status remains SCHEDULED"
      - name: withdraw_awarded_application_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PermitApplication"
          - "errors[ERR_INVALID_APPLICATION_STATE]"
        distinguishing_aspect: "AWARDED is terminal for PermitApplication; withdraw from AWARDED fails with ERR_INVALID_APPLICATION_STATE and the permit survives."
        test_recipe:
          setup: ["Application awarded via full run"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "POST /permit-applications/${a_id}/withdraw", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_APPLICATION_STATE; application remains AWARDED"
      - name: mark_no_show_before_slot_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Permit.CONFIRMED_to_NO_SHOW"
          - "errors[ERR_NO_SHOW_NOT_YET]"
        distinguishing_aspect: "Clock inside the slot (2026-08-10T19:00, end 20:00) blocks no-show marking with ERR_NO_SHOW_NOT_YET — the temporal gate, not the state gate, fires."
        test_recipe:
          setup: ["CONFIRMED permit 2026-08-10 18:00-20:00; clock mid-slot"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_id: "$.data[0].id" } }
            - { call: "GET /invoices", payload: { permit_id: "${p_id}" }, as: FinanceClerk, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "POST /invoices/${i_id}/payments", payload: { amount_cents: 4000, method: "CHECK" }, as: FinanceClerk }
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: AthleticsAdmin }
          trigger:
            - { call: "POST /permits/${p_id}/mark-no-show", payload: {}, as: FieldSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_SHOW_NOT_YET; permit remains CONFIRMED; no StrikeRecord created"
      - name: settle_without_checkin_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Permit.CONFIRMED_to_COMPLETED"
          - "errors[ERR_CHECKIN_REQUIRED]"
        distinguishing_aspect: "Clock past end but attendance_minutes null -> ERR_CHECKIN_REQUIRED (distinct from the no-show path; settle never fabricates attendance)."
        test_recipe:
          setup: ["CONFIRMED permit 2026-08-10 18:00-20:00; clock 2026-08-10T20:01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
