            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 5, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
