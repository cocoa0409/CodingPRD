          assert:
            - "The run starting 2026-05-15 (exactly run 1's period_end) returns HTTP 409 with error_id ERR_PAY_PERIOD_OVERLAP"
            - "The run starting 2026-05-16 is CREATED: HTTP 201, PayrollRun.${run2}.processing_status == DRAFT, funding_status == UNFUNDED"
            - "GET /payroll-runs?client_id=${client_q} returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_conserves_client_outstanding_balance
        grounds:
          - state_machines.ClientInvoice.ISSUED_to_VOID
          - calculations.client_outstanding_balance
          - entities.ClientCompany.fields.outstanding_balance_cents
          - state_machines.PayrollRun.CALCULATED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity #1 — MONEY. The invariant
          ClientCompany.outstanding_balance_cents == SUM(ClientInvoice.total_cents -
          amount_paid_cents) over invoices with status IN {ISSUED, PARTIALLY_PAID}
          must hold before and after the forward action (approve -> issue 246510) and its
          compensating action (void). The balance returns to exactly 0 — zero drift — while the
          PayrollRun keeps its APPROVED processing_status.
        test_recipe:
          setup:
            - "ACTIVE client, outstanding_balance_cents == 0, two ACTIVE employees (annual_salary_cents 2400120 each)."
            - "One CALCULATED payroll run 2026-05-01..2026-05-15 (check 2026-05-20)."
