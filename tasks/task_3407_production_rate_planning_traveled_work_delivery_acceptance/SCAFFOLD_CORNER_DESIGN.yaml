            - "escape remains OPEN and conformance_documented stays false"
      - name: disposition_by_reporting_inspector_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "With the state gate satisfied (ROOT_CAUSE), disposition by the same X-User-ID that reported the escape fails with ERR_SEGREGATION_OF_DUTIES (403) — the isolated segregation rule."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1020 with escape in ROOT_CAUSE reported by insp-1"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1020, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Dent" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
