            - "An EXECUTED HostCommunityAgreement and an APPROVED SpecialWasteApproval (INDUSTRIAL_SPECIAL, cap 500) that no load references."
            - "OperatingDay D1 on 2026-08-05 against C-2 (ALTERNATIVE_TARP, working_face_area_sf 5000) with one MSW load L1 of manifest_tons 166.60 cleared and certified at 166.60, then closed."
