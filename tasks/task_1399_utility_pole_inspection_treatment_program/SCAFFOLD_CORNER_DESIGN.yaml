  # ============================================================= rbac
  - section: rbac
    instances:
      - name: contractor_cannot_qa_review_forbidden
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Contractor is excluded from the qa-review roles list -> 403 ERR_FORBIDDEN (peer-role separation of execution vs audit)."
        test_recipe:
          setup: ["cycle OPEN; pole; SUBMITTED task"]
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-RB", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-RB", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.25
                sound_wood_pct: 100
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: ACCEPT }
              as: Contractor
              as_user_id: "${cr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response == 403 ERR_FORBIDDEN; task stays SUBMITTED"

      - name: attacher_cannot_adjudicate_audit_forbidden
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "AttacherRep may only mark-cured; adjudicate is ProgramManager-exclusive -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["joint-use pole; cycle OPEN; task submitted with found 2 vs declared 1 -> audit exists SUBMITTED"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-AT", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40, joint_use: true, attachment_count_declared: 1 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.50
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                found_attachment_count: 2
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /pole-program/attachment-audits"
              payload: { inspection_task_id: "${t_id}" }
              as: ProgramManager
              captures: { a_id: "$.data[0].id" }
          trigger:
            - call: "POST /pole-program/attachment-audits/${a_id}/adjudicate"
              payload: {}
              as: AttacherRep
              as_user_id: "att-9"
              captures: { err: $.data.error_id }
          assert:
            - "response == 403 ERR_FORBIDDEN; audit stays SUBMITTED"

      - name: contractor_apply_other_crews_order_forbidden
        claim_type: role_denial
        grounds: [roles, state_machines.TreatmentWorkOrder.SCHEDULED_to_APPLIED]
        distinguishing_aspect: "Ownership check: a Contractor whose X-User-ID is a different crew id than order.crew_id gets 403 ERR_FORBIDDEN on apply (entity_backed identity)."
        test_recipe:
          setup: ["crews CR-A and CR-B; pole; order scheduled to CR-A"]
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-A", region: "NW" }
              as: ProgramManager
              captures: { cra: $.data.id }
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-B", region: "NW" }
              as: ProgramManager
              captures: { crb: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-OC", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o_id}/schedule"
              payload: { crew_id: "${cra}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/treatment-work-orders/${o_id}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${crb}"
              captures: { err: $.data.error_id }
          assert:
            - "response == 403 ERR_FORBIDDEN; order stays SCHEDULED with applied_at null"

  # ============================================================= complexity layers
  - section: complexity_layers
    instances:
      - name: occ_stale_budget_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[budget-fund-stale-version]", "errors[ERR_STALE_BUDGET_VERSION]"]
        distinguishing_aspect: "OCC on ProgramBudget.version: after funding O1 bumps the budget to version 2, funding O2 with the stale observed version 1 is rejected 412 ERR_STALE_BUDGET_VERSION even though funds suffice."
        test_recipe:
          setup: ["budget 500000 (version 1 observed); two poles; two QUEUED orders of 100000 each"]
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 500000 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-O1", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p1: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-O2", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.1, gis_lon: -121.1, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p2: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p1}", estimated_cost_cents: 100000 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p2}", estimated_cost_cents: 100000 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /pole-program/replacement-work-orders/${o1}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o2}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 412 ERR_STALE_BUDGET_VERSION (budget.version is now 2; the client held 1)"
            - "O2 stays QUEUED; budget.committed_cents == 100000 unchanged by the rejected call"

      - name: occ_stale_pole_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pole-gis-stale-version]", "errors[ERR_STALE_POLE_VERSION]"]
        distinguishing_aspect: "OCC on Pole.version: a gis-attributes patch carrying the version observed before a prior successful patch is rejected 412 ERR_STALE_POLE_VERSION."
        test_recipe:
          setup: ["pole P-OCC at version 1"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-OCC", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "PATCH /pole-program/poles/${p_id}/gis-attributes"
              payload: { gis_lat: 46.5, gis_lon: -121.5, gis_tag: "URBAN", expected_pole_version: "${p_v}" }
              as: ProgramManager
              captures: { v2: $.data.version }
          trigger:
            - call: "PATCH /pole-program/poles/${p_id}/gis-attributes"
              payload: { gis_lat: 47.0, gis_lon: -122.0, gis_tag: "COASTAL", expected_pole_version: "${p_v}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "first patch succeeded with version 1 -> 2 and stored URBAN"
            - "second patch with the stale version 1 == 412 ERR_STALE_POLE_VERSION; gis_tag stays URBAN"

      - name: gis_patch_success_updates_attributes
        claim_type: derived_field_reconciliation
        grounds: ["concurrency_rules[pole-gis-stale-version]", entities.Pole.fields.gis_tag]
        distinguishing_aspect: "Positive OCC path: correct expected_pole_version applies the new attributes, bumps version to 2, and refreshes updated_at; response echoes the new values."
        test_recipe:
          setup: ["pole P-GIS at version 1, gis_tag RURAL"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-GIS", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "PATCH /pole-program/poles/${p_id}/gis-attributes"
              payload: { gis_lat: 46.9, gis_lon: -121.9, gis_tag: "COASTAL", expected_pole_version: "${p_v}" }
              as: ProgramManager
              captures: { tag: $.data.gis_tag, v: $.data.version }
          assert:
            - "gis_tag == COASTAL, gis_lat == 46.9, version == 2"

  # ============================================================= consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_fund_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ReplacementWorkOrder.QUEUED_to_FUNDED]
        distinguishing_aspect: "Immediate consistency: the fund response itself carries status FUNDED and budget_id, and a subsequent GET of the budget in the same session shows committed_cents 100000 without any delay or replay."
        test_recipe:
          setup: ["budget 500000; pole; QUEUED order 100000"]
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 500000 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-IC", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 100000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o_id}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
              captures: { st: $.data.status, bid: $.data.budget_id }
            - call: "GET /pole-program/budgets/${b_id}"
              payload: {}
              as: ProgramManager
              captures: { comm: $.data.committed_cents }
          assert:
            - "fund response: status == FUNDED and budget_id == ${b_id}"
            - "immediate GET: ProgramBudget.committed_cents == 100000 and available_cents == 400000"

  # ============================================================= excluded stubs
  - section: state_machines
    instances:
      - name: error_budget_exceeded_on_fund
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: fund_exact_available_equality
          rationale: "Asserted as the failure branch (O2 over a zeroed remainder) of the named boundary instance."

      - name: error_warranty_expired_on_late_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_WARRANTY_EXPIRED]"]
        excluded_because:
          difficulty_instance: claim_requires_verified_order_and_live_warranty
          rationale: "Warranty-window temporal gate is exercised there; the expired side is additionally covered by corner warranty_expired_after_end_date in validations."

      - name: error_crew_schedule_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREW_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: crew_halfopen_window_adjacency
          rationale: "The overlap half of that Rule 8 instance asserts this error."

      - name: error_task_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_TASK_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: pole_closed_window_touch_conflicts
          rationale: "The touching-window half of that Rule 8 instance asserts this error."

      - name: error_order_not_queued_on_deferred_fund
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_NOT_QUEUED]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_fund
          rationale: "That Rule 5 instance asserts ERR_ORDER_NOT_QUEUED as the winning error."

      - name: error_hazard_flag_required_on_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_HAZARD_FLAG_REQUIRED]"]
        excluded_because:
          difficulty_instance: safety_beats_referential_on_submit
          rationale: "That Rule 5 instance asserts ERR_HAZARD_FLAG_REQUIRED as the winning error."

      - name: error_sod_violation_pairing
        claim_type: violation_to_error
        grounds: ["errors[ERR_SOD_VIOLATION]"]
        excluded_because:
          difficulty_instance: task_rework_cycle_then_accept
          rationale: "SoD is directly asserted in corner sod_same_user_qa_rejected; the difficulty instance exercises the happy-path different-user pairing."

      - name: error_crew_suspended_on_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREW_SUSPENDED]"]
        excluded_because:
          difficulty_instance: schedule_blocked_when_crew_suspended
          rationale: "That Rule 7 instance asserts this error as its primary outcome."

      - name: error_pole_replaced_on_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_POLE_REPLACED]"]
        excluded_because:
          difficulty_instance: submit_blocked_when_pole_replaced
          rationale: "That Rule 7 instance asserts this error as its primary outcome."

      - name: error_cycle_tasks_open_on_reconcile
        claim_type: violation_to_error
        grounds: ["errors[ERR_CYCLE_TASKS_OPEN]"]
        excluded_because:
          difficulty_instance: replacement_defer_requeue_cycle
          rationale: "Directly asserted by corner reconcile_with_open_tasks_rejected; cited here to keep the error catalog coverage auditable against §1.8."

      - name: error_stale_versions_on_occ_endpoints
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_BUDGET_VERSION]", "errors[ERR_STALE_POLE_VERSION]"]
        excluded_because:
          difficulty_instance: fund_defund_restores_available_cents
          rationale: "Both stale-version errors are asserted by corner instances occ_stale_budget_version_rejected and occ_stale_pole_version_rejected; the invariant instance drives the OCC happy path."



