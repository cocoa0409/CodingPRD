          ERR_PLAN_NOT_LOCKED, not ERR_MTOW_EXCEEDED.
        test_recipe:
          setup:
            - "Stations/aircraft/dispatcher/captain; leg L1; plan created (COMPUTED, never locked)"
            - "cargo 40000 kg would push takeoff weight far past MTOW 73500 if evaluated"
          setup_api_calls:
