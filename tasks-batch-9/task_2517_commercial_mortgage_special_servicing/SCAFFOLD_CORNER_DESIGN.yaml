            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "FORECLOSURE", projected_cash_flows: [{ period_index: 1, amount_usd: 0 }, { period_index: 2, amount_usd: 5800000 }], upfront_cost_usd: 650000 }
              as: SpecialServicerAssetManager
