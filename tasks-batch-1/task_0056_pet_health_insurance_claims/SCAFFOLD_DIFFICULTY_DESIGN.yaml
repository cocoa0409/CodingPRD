              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
