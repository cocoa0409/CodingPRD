            - call: "POST /v1/estimates"
              payload: { job_id: "${jobA_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${jobA_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { estA_id: $.data.id }
            - call: "POST /v1/estimates/${estA_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${estA_id}/accept"
