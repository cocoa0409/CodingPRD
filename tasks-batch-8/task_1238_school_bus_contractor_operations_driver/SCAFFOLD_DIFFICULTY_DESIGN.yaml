  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: Driver vs Invoice)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: driver_retest_loop_cycle
        grounds:
          - state_machines.Driver.TESTING_to_TRAINING
          - state_machines.Driver.TRAINING_to_TESTING
          - state_machines.Driver.TESTING_to_CERTIFIED
        distinguishing_aspect: |
          Driver machine is cyclic: TESTING -> TRAINING on TEST_FAIL, then back
          TRAINING -> TESTING on a second SCHEDULE_TEST (hours still qualify),
          reaching CERTIFIED only after TEST_PASS. A linear pipeline could not
          express the retest; test_fail_count records the loop iteration.
        test_recipe:
          setup: ["District exists; driver pipeline progressed to TESTING with 2400 behind-wheel and 1200 classroom minutes"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-LOOP", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Loop", license_number: "L500", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
          trigger:
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_FAIL", reason: "Failed pretrip" }, as: HRRecruiter, captures: { st_after_fail: $.data.status } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter, captures: { st_retest: $.data.status } }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter, captures: { st_final: $.data.status } }
          assert:
            - "${st_after_fail} == TRAINING (cycle back, not terminal)"
            - "Driver.${dr_id}.test_fail_count == 1"
            - "${st_retest} == TESTING (re-entered the loop)"
            - "${st_final} == CERTIFIED"
      - name: invoice_dispute_reissue_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          Invoice machine cycles ISSUED -> DISPUTED -> ISSUED via reissue with
          an adjustment delta; totals move (50000 -> 45000) and dispute_count
          records one loop iteration. Entity: Invoice — different from Driver.
        test_recipe:
          setup:
            - "Contract ACTIVE, one route; day 2026-06-01 completed and RECONCILED; June fuel entry 400 (no escalation)"
            - "Invoice generated and issued at clock 2026-06-05 (within 30-day dispute window)"
