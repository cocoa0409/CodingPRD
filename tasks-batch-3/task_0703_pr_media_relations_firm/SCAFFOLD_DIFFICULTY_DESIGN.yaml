              payload: {}
              as: MediaSpecialist
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: forbidden_vs_state_pitch_send_forbidden_wins
        grounds:
          - validations[priority=2]
          - validations[priority=7]
          - errors[ERR_FORBIDDEN]
          - errors[ERR_INVALID_STATE]
