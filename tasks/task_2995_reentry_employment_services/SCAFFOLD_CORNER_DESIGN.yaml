- section: cross_cutting_complexity_layers
  instances:
  - name: a_stale_participant_version_on_a_release_plan_write_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[release-plan-write-stale-participant]
    - errors[ERR_STALE_PARTICIPANT_VERSION]
    distinguishing_aspect: The captured version 1 is invalidated by an unrelated write (the assessment) on the same
      participant, so the plan write must be 412 and the retry with the refreshed version 2 must succeed — proving
      the guard compares the stored version, not merely 'a number was supplied'.
    test_recipe:
      setup:
      - Participant p1 created with version 1; the version is captured
      - an assessment is then posted, taking version to 2 and leaving release_plan_status NONE
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_stale: $.data.version
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 3
            transportation_score: 2
            health_score: 1
            work_history_score: 4
            documentation_score: 2
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_stale}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: TRANSIT_PASS
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
        captures:
          err: $.data.error_id
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_fresh: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_fresh}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: TRANSIT_PASS
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      assert:
      - 'first call: HTTP 412 with data.error_id == "ERR_STALE_PARTICIPANT_VERSION"'
      - after the 412, GET /participants/${p1_id} returns version == 2, release_plan_status == "NONE", housing_plan_type
        == null
      - p1_v_fresh == 2 (the failed write did not bump the version)
      - 'third call: HTTP 200 with release_plan_status == "DRAFT" and version == 3'
