            - "the ContractorAdmin submit http_status == 200 and ProOrder.${order_id}.fulfillment_status == SUBMITTED"

      - name: contractor_admin_identity_is_scoped_to_its_own_pro_account
        claim_type: entity_backed_identity_scoping
        grounds:
          - validations[priority=7]
          - roles.ContractorAdmin.identity
          - errors[ERR_ACCOUNT_SCOPE_VIOLATION]
        distinguishing_aspect: "ContractorAdmin is entity-backed, so the same endpoint and the same role split on X-User-ID: account B's admin reading or submitting account A's order is ERR_ACCOUNT_SCOPE_VIOLATION 403 (scope at priority 7 beats the state ladder), and it cannot bind its own new order to A's quote either — while A's own admin submits the identical order successfully."
