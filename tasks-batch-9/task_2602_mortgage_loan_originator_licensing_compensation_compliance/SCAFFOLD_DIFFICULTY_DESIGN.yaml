              captures: { c_el1: $.data.id }
            - call: "POST /ce-courses"
              payload: { course_code: "CE-ELEC-2H-C", credit_hours: 2, category: "ELECTIVE", approved_state_codes: ["CA"], successive_year_blocked: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { c_el2: $.data.id }
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${c_fed}", completion_date: "2026-06-10T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${c_eth}", completion_date: "2026-06-11T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${c_nt}", completion_date: "2026-06-12T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${c_el1}", completion_date: "2026-06-13T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { hours_base: $.data.ce_hours_applied, sat_base: $.data.ce_satisfied }
          trigger:
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${c_el2}", completion_date: "2026-07-20T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { surplus_id: $.data.id, surplus_hours: $.data.credit_hours, surplus_status: $.data.credit_status }
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { hours_up: $.data.ce_hours_applied, sat_up: $.data.ce_satisfied }
            - call: "POST /ce-credits/${surplus_id}/void"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { voided_status: $.data.credit_status, voided_reason: $.data.void_reason }
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { hours_back: $.data.ce_hours_applied, sat_back: $.data.ce_satisfied }
            - call: "GET /ce-credits"
              payload: { originator_id: "${orig_id}", credit_status: "APPLIED", limit: 10, offset: 0 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { applied_first: "$.data[0].credit_status" }
          assert:
            - "${hours_base} == 8 and ${sat_base} == true (the pre-mutation baseline)"
            - "${surplus_hours} == 2 and ${surplus_status} == APPLIED"
            - "${hours_up} == 10 and ${sat_up} == true"
            - "${voided_status} == VOIDED and ${voided_reason} == ANALYST_VOID"
            - "${hours_back} == 8 == ${hours_base} - the void returns the integer total to exactly
               its pre-mutation value, not to 9 and not to 0"
            - "${sat_back} == true (the four original credits still meet every category minimum:
               FEDERAL_LAW 3, ETHICS 2, NONTRADITIONAL 2)"
            - "${applied_first} == APPLIED and
               GET /ce-credits?originator_id=${orig_id}&credit_status=APPLIED returns exactly 4 rows"
            - "GET /ce-credits/${surplus_id} still returns the row (soft state change, not a
               delete), and GET /ce-credits?originator_id=${orig_id} returns 5 rows in total"
            - "Voiding the same credit twice is rejected with ERR_ALREADY_TERMINAL, so
               ce_hours_applied cannot be driven below 8 by a repeated reversal"
