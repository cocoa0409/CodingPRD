    side_effects: []

  - method: GET
    path: "/child-find/domain-assessments"
    description: "List domain assessments; evaluation_case_id, evaluator_provider_id and assessment_site_id each resolve one FK."
    roles: [ChildFindCoordinator, EvaluationChair, Evaluator, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: ["evaluation_case_id?", "evaluator_provider_id?", "assessment_site_id?", "domain?", "method?", "status?", "limit?", "offset?"]
    output: DomainAssessment[]
    side_effects: []

  - method: GET
    path: "/child-find/service-plans"
    description: "List service plans; evaluation_case_id, child_id and community_site_id each resolve one FK."
    roles: [ChildFindCoordinator, EvaluationChair, PlacementAdministrator, Parent, DistrictAdmin]
    code: 200
    input: ["evaluation_case_id?", "child_id?", "community_site_id?", "setting?", "eligibility_decision?", "kindergarten_transition_status?", "status?", "limit?", "offset?"]
    output: ServicePlan[]
    side_effects: []

  - method: GET
    path: "/child-find/service-lines"
    description: "List service lines; service_plan_id, provider_id and delivery_site_id each resolve one FK."
    roles: [ChildFindCoordinator, EvaluationChair, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: ["service_plan_id?", "provider_id?", "delivery_site_id?", "discipline?", "delivery_model?", "status?", "limit?", "offset?"]
    output: ServiceLine[]
    side_effects: []

  # ----------------------------------------------------- reads: computed views
  - method: GET
    path: "/child-find/referrals/{id}/timeline"
    description: "Compliance view of one referral exposing BOTH due-date variants side by side plus the Part C third-birthday cap."
    roles: [ChildFindCoordinator, EvaluationChair, PlacementAdministrator, Parent, DistrictAdmin]
    code: 200
    input: []
    output: "{ referral_id: string, eligibility_pathway: string, received_date: string, consent_granted_date: string, receipt_anchored_due_date: string, consent_anchored_due_date: string, third_birthday_cap_date: string, evaluation_due_date: string, days_remaining: integer, timeline_compliance: string }"
    side_effects: []

  - method: GET
    path: "/child-find/evaluation-cases/{id}/eligibility-profile"
    description: "Derived eligibility view exposing BOTH composite variants and BOTH minute-rounding orders for one case."
    roles: [ChildFindCoordinator, EvaluationChair, Evaluator, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: []
    output: "{ evaluation_case_id: string, pinned_variant: string, completed_domain_count: integer, standardized_strict_qualifying_domain_count: integer, standardized_strict_max_weighted_percent_delay: number, standardized_strict_recommendation: string, play_based_inclusive_qualifying_domain_count: integer, play_based_inclusive_max_weighted_percent_delay: number, play_based_inclusive_recommendation: string, composite_eligibility_recommendation: string, recommended_weekly_minutes: integer, per_line_rounded_minutes: integer, sum_then_rounded_minutes: integer }"
    side_effects: []

  - method: GET
    path: "/child-find/providers/{id}/caseload"
    description: "Caseload view of one provider exposing BOTH assigned-minute variants, the travel breakdown and both capacity postures."
    roles: [ChildFindCoordinator, EvaluationChair, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: []
    output: "{ provider_id: string, direct_weekly_service_minutes: integer, distinct_site_count: integer, travel_tier_pct: number, travel_overhead_minutes: integer, assigned_weekly_service_minutes: integer, committed_weekly_minutes: integer, max_weekly_service_minutes: integer, utilization: number, service_capacity_posture: string, active_evaluation_count: integer, max_evaluation_caseload: integer, evaluation_intake_posture: string, assigned_interpreter_assignment_count: integer }"
    side_effects: []

  # ------------------------------------------------------ writes: registry
  - method: POST
    path: "/child-find/children"
    description: "Register a child in the child find roster."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["first_name", "last_name", "date_of_birth", "guardian_full_name", "district_of_residence", "primary_language_code?", "part_c_enrolled?", "part_c_exit_date?"]
    output: Child
    side_effects:
      - "interpreter_required derived from primary_language_code"
      - "third_birthday and kindergarten_eligibility_date computed (child_kindergarten_eligibility_date)"
      - "status initialised to NO_ACTIVE_REFERRAL (child_status_precedence)"

  - method: POST
    path: "/child-find/community-sites"
    description: "Register a community preschool site as a placement destination and possible screening host."
    roles: [PlacementAdministrator, DistrictAdmin]
    code: 201
    input: ["name", "region_code", "licensed_capacity", "iep_seat_capacity", "languages_supported?", "screening_host_approved?", "status?"]
    output: CommunityPreschoolSite
    side_effects:
      - "reserved_iep_seat_count initialised to 0"

  - method: POST
    path: "/child-find/providers"
    description: "Register an itinerant provider, evaluator, chair-eligible specialist or interpreter."
    roles: [DistrictAdmin]
    code: 201
    input: ["full_name", "discipline", "home_region_code", "languages?", "max_weekly_service_minutes?", "max_evaluation_caseload?", "max_weekly_interpreter_assignments?", "status?"]
    output: Provider
    side_effects:
      - "is_evaluation_chair_eligible derived from discipline"
      - "both capacity dimensions initialised to 0 with posture OPEN (provider_assigned_weekly_minutes, provider_evaluation_caseload)"

  - method: PATCH
    path: "/child-find/providers/{id}"
    description: "Update a provider's availability, languages or capacity ceilings; used to place a provider ON_LEAVE."
    roles: [DistrictAdmin]
    code: 200
    input: ["status?", "languages?", "max_weekly_service_minutes?", "max_evaluation_caseload?", "max_weekly_interpreter_assignments?"]
    output: Provider
    side_effects:
      - "both capacity postures re-derived against the new ceilings (provider_service_capacity_posture, provider_evaluation_caseload)"
      - "version incremented"

  # ------------------------------------------------- writes: outreach/screening
  - method: POST
    path: "/child-find/screening-events"
    description: "Schedule a community-wide child find screening event at an approved host site."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["site_id", "event_label", "window_start_utc", "window_end_utc", "slot_capacity", "slot_length_minutes?", "interpreter_languages?"]
    output: ScreeningEvent
    side_effects:
      - "effective_slot_capacity computed as min(slot_capacity, floor(window_minutes / slot_length_minutes)) (screening_event_effective_capacity)"
      - "site window overlap checked against non-CANCELLED events at the same site"
      - "status initialised to SCHEDULED"

  - method: POST
    path: "/child-find/screening-events/{id}/status"
    description: "Advance a screening event through SCHEDULED -> OPEN -> CLOSED -> COMPLETED, or cancel it."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 200
    input: ["target_status"]
    output: ScreeningEvent
    side_effects:
      - "on CANCELLED: every BOOKED slot of the event is cancelled (conditional cascade; ATTENDED and NO_SHOW slots are left untouched)"
      - "on COMPLETED: refused while any slot is still BOOKED (ERR_SCREENING_SLOTS_UNRESOLVED)"
      - "version incremented"

  - method: POST
    path: "/child-find/screening-events/{id}/slots"
    description: "Book a screening slot for a child against a live capacity check on the parent event."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["child_id", "slot_start_utc", "expected_screening_event_version", "requested_language_code?"]
    output: ScreeningSlot
    side_effects:
      - "slot_end_utc derived from the event's slot_length_minutes"
      - "parent event booked_slot_count recomputed (screening_event_effective_capacity)"
      - "parent event version incremented"

  - method: POST
    path: "/child-find/screening-slots/{id}/outcome"
    description: "Record attendance and, for an attended slot, the screening result; a REFER result opens a referral automatically."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 200
    input: ["attendance", "screening_result?"]
    output: ScreeningSlot
    side_effects:
      - "on attendance ATTENDED with screening_result REFER: a Referral is created with source SCREENING, originating_screening_slot_id set to this slot, intake_status RECEIVED and consent_status NOT_REQUESTED (referral_age_and_pathway runs on it; discoverable only via GET /child-find/referrals?originating_screening_slot_id=)"
      - "on attendance CANCELLED: parent event booked_slot_count recomputed"
      - "child status re-derived (child_status_precedence)"

  # --------------------------------------------------- writes: referral/consent
  - method: POST
    path: "/child-find/referrals"
    description: "Intake a referral from a pediatrician, a Part C transition, a parent or a school."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["child_id", "source", "referring_provider_npi?", "originating_screening_slot_id?"]
    output: Referral
    side_effects:
      - "received_at stamped from the logical clock"
      - "age_months_at_referral and eligibility_pathway computed (referral_age_and_pathway); an AGE_INELIGIBLE outcome is rejected with ERR_AGE_INELIGIBLE rather than stored"
      - "any prior referral of the same child in RECEIVED, CONSENT_PENDING or EVALUATION_AUTHORIZED is moved to SUPERSEDED with superseded_by_referral_id set to the new referral, cancelling that referral's non-terminal EvaluationCase"
      - "child status re-derived to REFERRED (child_status_precedence)"

  - method: POST
    path: "/child-find/referrals/{id}/consent-requests"
    description: "Issue the prior-written-notice and consent-for-evaluation packet to the family, in the family's language, with an interpreter when required."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["notice_language_code", "notice_delivery_method", "interpreter_provider_id?", "interpreter_modality?"]
    output: ConsentRecord
    side_effects:
      - "ConsentRecord created with kind EVALUATION_CONSENT, decision PENDING and requested_at from the logical clock"
      - "referral consent_status NOT_REQUESTED -> REQUESTED"
      - "referral intake_status RECEIVED -> CONSENT_PENDING"
      - "named interpreter's assigned_interpreter_assignment_count recomputed (provider_evaluation_caseload)"

  - method: POST
    path: "/child-find/consent-records/{id}/decision"
    description: "Record the family's decision on a consent record: GRANTED, REFUSED, or a revocation of an earlier grant."
    roles: [ChildFindCoordinator, Parent, DistrictAdmin]
    code: 200
    input: ["decision"]
    output: ConsentRecord
    side_effects:
      - "decided_at stamped from the logical clock"
      - "on GRANTED of an EVALUATION_CONSENT: referral consent_status -> GRANTED, consent_granted_at set, intake_status CONSENT_PENDING -> EVALUATION_AUTHORIZED, evaluation_due_date computed (referral_evaluation_due_date)"
      - "on REFUSED of an EVALUATION_CONSENT: referral consent_status -> REFUSED and intake_status -> DECLINED"
      - "on REVOKED of an EVALUATION_CONSENT: referral consent_status -> REVOKED and intake_status -> WITHDRAWN, evaluation_due_date cleared, the referral's non-terminal EvaluationCase -> CANCELLED, that case's SCHEDULED and COMPLETED DomainAssessments -> INVALIDATED, the chair's active_evaluation_count and evaluation_intake_posture recomputed, child status re-derived (depth-5 cascade)"
      - "on GRANTED or REFUSED of a SERVICE_CONSENT: the linked ServicePlan leaves PENDING_PARENT_CONSENT for ACTIVE or DECLINED, its lines and the site's reserved_iep_seat_count follow"
      - "named interpreter's assigned_interpreter_assignment_count recomputed"

  # ------------------------------------------------ writes: multidisciplinary eval
  - method: POST
    path: "/child-find/referrals/{id}/evaluation-cases"
    description: "Open the multidisciplinary evaluation for an authorized referral under a chair-eligible provider."
    roles: [ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["chair_provider_id", "assessment_protocol?"]
    output: EvaluationCase
    side_effects:
      - "child_id and due_date denormalised from the referral"
      - "required_domain_count set to 5, status PLANNED, revision_round 0"
      - "chair's active_evaluation_count and evaluation_intake_posture recomputed (provider_evaluation_caseload)"
      - "timeline_compliance computed against the logical clock (evaluation_timeline_compliance)"
      - "child status re-derived to IN_EVALUATION (child_status_precedence)"

  - method: POST
    path: "/child-find/evaluation-cases/{id}/domain-assessments"
    description: "Schedule a developmental-domain assessment, standardized or play-based, for one evaluator in a time window."
    roles: [ChildFindCoordinator, EvaluationChair, DistrictAdmin]
    code: 201
    input: ["evaluator_provider_id", "domain", "method", "window_start_utc", "window_end_utc", "assessment_site_id?"]
    output: DomainAssessment
    side_effects:
      - "evaluator window conflict checked with a travel buffer that applies only across different sites"
      - "chronological_age_months computed from the child's date_of_birth and window_start_utc"
      - "parent case PLANNED -> IN_PROGRESS on the first assessment"
      - "status initialised to SCHEDULED"

  - method: POST
    path: "/child-find/domain-assessments/{id}/completion"
    description: "Record a domain assessment's age-equivalent result and derive its delay figures."
    roles: [EvaluationChair, Evaluator, DistrictAdmin]
    code: 200
    input: ["age_equivalent_months", "standard_score?"]
    output: DomainAssessment
    side_effects:
      - "percent_delay, weighted_percent_delay and qualifies_delay computed (domain_percent_delay)"
      - "completed_at stamped from the logical clock"
      - "parent case completed_domain_count, qualifying_domain_count, max_weighted_percent_delay, composite_eligibility_recommendation and recommended_weekly_minutes recomputed (evaluation_composite_delay_profile, service_minutes_recommendation)"
      - "parent case IN_PROGRESS -> DOMAINS_COMPLETE once all five distinct domains are COMPLETED"

  - method: POST
    path: "/child-find/domain-assessments/{id}/invalidation"
    description: "Invalidate an assessment whose administration was compromised, releasing its domain for re-assessment."
    roles: [EvaluationChair, Evaluator, DistrictAdmin]
    code: 200
    input: ["invalidation_reason"]
    output: DomainAssessment
    side_effects:
      - "assessment status -> INVALIDATED and it leaves every case aggregate"
      - "parent case delay profile recomputed (evaluation_composite_delay_profile, service_minutes_recommendation)"
      - "parent case DOMAINS_COMPLETE -> IN_PROGRESS when the invalidation drops completed_domain_count below required_domain_count"

  - method: POST
    path: "/child-find/evaluation-cases/{id}/report"
    description: "Draft the multidisciplinary evaluation report once every required domain is complete."
    roles: [EvaluationChair, DistrictAdmin]
    code: 200
    input: ["report_narrative_summary"]
    output: EvaluationCase
    side_effects:
      - "case DOMAINS_COMPLETE -> REPORT_DRAFTED, or REVISIONS_REQUESTED -> REPORT_DRAFTED on a re-draft"
      - "report_drafted_at stamped from the logical clock"

  - method: POST
    path: "/child-find/evaluation-cases/{id}/revision-requests"
    description: "Send a drafted report back to the chair for revision, up to MAX_REVISION_ROUNDS times."
    roles: [ChildFindCoordinator, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: ["revision_note"]
    output: EvaluationCase
    side_effects:
      - "case REPORT_DRAFTED -> REVISIONS_REQUESTED"
      - "revision_round incremented and last_revision_note stored"
      - "refused with ERR_REVISION_LIMIT_REACHED once revision_round has reached MAX_REVISION_ROUNDS"

  # --------------------------------------------- writes: eligibility & placement
  - method: POST
    path: "/child-find/evaluation-cases/{id}/service-plans"
    description: "Determine eligibility and draft the service plan, choosing the service setting including community preschool placement."
    roles: [PlacementAdministrator, EvaluationChair, DistrictAdmin]
    code: 201
    input: ["eligibility_decision", "expected_evaluation_case_version", "disability_category?", "setting?", "community_site_id?", "override_justification?"]
    output: ServicePlan
    side_effects:
      - "case -> ELIGIBILITY_DETERMINED and determined_by_user_id stamped from X-User-ID"
      - "recommended_weekly_minutes copied from the case (service_minutes_recommendation)"
      - "on eligibility_decision NOT_ELIGIBLE: plan is created DRAFT and immediately moved to CLOSED_NOT_ELIGIBLE, setting and disability_category must be null, child status -> NOT_ELIGIBLE"
      - "on eligibility_decision ELIGIBLE: plan stays DRAFT awaiting service lines, setting and disability_category required"
      - "any earlier DRAFT plan on the same case is moved to SUPERSEDED"
      - "parent case version incremented"

  - method: POST
    path: "/child-find/service-plans/{id}/service-lines"
    description: "Add a service line - discipline, weekly minutes and delivery model - to a draft plan."
    roles: [PlacementAdministrator, EvaluationChair, DistrictAdmin]
    code: 201
    input: ["discipline", "weekly_minutes", "delivery_model"]
    output: ServiceLine
    side_effects:
      - "delivery_site_id left null until the line is staffed"
      - "status initialised to PROPOSED with provider_id null"
      - "plan assigned_weekly_minutes recomputed"

  - method: POST
    path: "/child-find/service-lines/{id}/staff"
    description: "Assign an itinerant provider to a service line against the provider's live minute capacity."
    roles: [PlacementAdministrator, DistrictAdmin]
    code: 200
    input: ["provider_id", "expected_provider_version", "delivery_site_id?"]
    output: ServiceLine
    side_effects:
      - "line PROPOSED -> STAFFED, or UNSTAFFED -> STAFFED on a re-staff"
      - "delivery_site_id set from the request, or defaulted to the parent plan's community_site_id when omitted; it feeds the provider's distinct-site travel count"
      - "provider direct_weekly_service_minutes, travel_overhead_minutes, assigned_weekly_service_minutes and service_capacity_posture recomputed (provider_assigned_weekly_minutes, provider_service_capacity_posture)"
      - "provider version incremented"

  - method: POST
    path: "/child-find/service-lines/{id}/unstaff"
    description: "Release the provider from a staffed service line, returning the provider's capacity exactly to its prior value."
    roles: [PlacementAdministrator, DistrictAdmin]
    code: 200
    input: ["unstaff_reason?"]
    output: ServiceLine
    side_effects:
      - "line STAFFED -> UNSTAFFED and provider_id cleared"
      - "former provider's minutes and posture recomputed, restoring the exact pre-staffing values (compensating invariant)"
      - "plan assigned_weekly_minutes unchanged, since UNSTAFFED lines still count toward the plan total"
      - "provider version incremented"

  - method: POST
    path: "/child-find/service-plans/{id}/consent-submission"
    description: "Send the drafted plan to the family for consent to services, reserving an IEP seat when the setting is a community preschool."
    roles: [PlacementAdministrator, ChildFindCoordinator, DistrictAdmin]
    code: 201
    input: ["notice_language_code", "notice_delivery_method", "interpreter_provider_id?", "interpreter_modality?"]
    output: ConsentRecord
    side_effects:
      - "ConsentRecord created with kind SERVICE_CONSENT, decision PENDING and service_plan_id set to this plan"
      - "plan DRAFT -> PENDING_PARENT_CONSENT"
      - "on setting COMMUNITY_PRESCHOOL: the named site's reserved_iep_seat_count recomputed against iep_seat_capacity (site_reserved_iep_seat_count)"
      - "named interpreter's assigned_interpreter_assignment_count recomputed"

  - method: POST
    path: "/child-find/service-plans/{id}/kindergarten-transition"
    description: "Drive kindergarten transition planning for an active plan: SCHEDULE_CONFERENCE, SEND_PACKET, then EXIT."
    roles: [PlacementAdministrator, ChildFindCoordinator, DistrictAdmin]
    code: 200
    input: ["action", "transition_conference_date?", "receiving_school_code?"]
    output: ServicePlan
    side_effects:
      - "on SCHEDULE_CONFERENCE: transition_conference_date stored, kindergarten_transition_status NOT_STARTED -> CONFERENCE_SCHEDULED"
      - "on SEND_PACKET: receiving_school_code stored, status CONFERENCE_SCHEDULED -> PACKET_SENT"
      - "on EXIT: kindergarten_transition_status -> COMPLETE, plan ACTIVE -> EXITED_TO_KINDERGARTEN with exit_date from the logical clock, every non-DISCONTINUED ServiceLine -> DISCONTINUED, each affected provider's minutes and posture recomputed, the site's reserved_iep_seat_count released, child status -> EXITED_TO_KINDERGARTEN (depth-4 cascade)"

  # ------------------------------------------------------- test-driving surface
  - method: POST
    path: "/child-find/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, age and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [DistrictAdmin]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: string }"
    side_effects:
      - "every evaluation case's timeline_compliance is re-derived on next read (evaluation_timeline_compliance)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header missing or empty"
    applies_to: [all]
  - id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: "X-User-Role missing, unrecognised, or not listed in the endpoint's roles"
    applies_to: [all]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Malformed body, missing required input field, bad enum, out-of-range number, unparseable timestamp, weekly_minutes not a multiple of 5, window_end_utc not after window_start_utc, or pagination outside limit 1..100 / offset >= 0"
    applies_to: [all]

  - id: ERR_CHILD_NOT_FOUND
    http_status: 404
    condition: "No Child with the given id (path or body child_id)"
    applies_to: ["GET /child-find/children/{id}", "POST /child-find/screening-events/{id}/slots", "POST /child-find/referrals"]
  - id: ERR_COMMUNITY_SITE_NOT_FOUND
    http_status: 404
    condition: "No CommunityPreschoolSite with the given id (path, site_id, community_site_id or assessment_site_id)"
    applies_to: ["GET /child-find/community-sites/{id}", "POST /child-find/screening-events", "POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/evaluation-cases/{id}/service-plans"]
  - id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    condition: "No Provider with the given id (path, chair_provider_id, evaluator_provider_id, provider_id or interpreter_provider_id)"
    applies_to: ["GET /child-find/providers/{id}", "PATCH /child-find/providers/{id}", "GET /child-find/providers/{id}/caseload", "POST /child-find/referrals/{id}/consent-requests", "POST /child-find/referrals/{id}/evaluation-cases", "POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/service-lines/{id}/staff", "POST /child-find/service-plans/{id}/consent-submission"]
  - id: ERR_SCREENING_EVENT_NOT_FOUND
    http_status: 404
    condition: "No ScreeningEvent with the given id"
    applies_to: ["GET /child-find/screening-events/{id}", "POST /child-find/screening-events/{id}/status", "POST /child-find/screening-events/{id}/slots"]
  - id: ERR_SCREENING_SLOT_NOT_FOUND
    http_status: 404
    condition: "No ScreeningSlot with the given id (path or originating_screening_slot_id)"
    applies_to: ["GET /child-find/screening-slots/{id}", "POST /child-find/screening-slots/{id}/outcome", "POST /child-find/referrals"]
  - id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    condition: "No Referral with the given id"
    applies_to: ["GET /child-find/referrals/{id}", "GET /child-find/referrals/{id}/timeline", "POST /child-find/referrals/{id}/consent-requests", "POST /child-find/referrals/{id}/evaluation-cases"]
  - id: ERR_CONSENT_RECORD_NOT_FOUND
    http_status: 404
    condition: "No ConsentRecord with the given id"
    applies_to: ["GET /child-find/consent-records/{id}", "POST /child-find/consent-records/{id}/decision"]
  - id: ERR_EVALUATION_CASE_NOT_FOUND
    http_status: 404
    condition: "No EvaluationCase with the given id"
    applies_to: ["GET /child-find/evaluation-cases/{id}", "GET /child-find/evaluation-cases/{id}/eligibility-profile", "POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/evaluation-cases/{id}/report", "POST /child-find/evaluation-cases/{id}/revision-requests", "POST /child-find/evaluation-cases/{id}/service-plans"]
  - id: ERR_DOMAIN_ASSESSMENT_NOT_FOUND
    http_status: 404
    condition: "No DomainAssessment with the given id"
    applies_to: ["GET /child-find/domain-assessments/{id}", "POST /child-find/domain-assessments/{id}/completion", "POST /child-find/domain-assessments/{id}/invalidation"]
  - id: ERR_SERVICE_PLAN_NOT_FOUND
    http_status: 404
    condition: "No ServicePlan with the given id"
    applies_to: ["GET /child-find/service-plans/{id}", "POST /child-find/service-plans/{id}/service-lines", "POST /child-find/service-plans/{id}/consent-submission", "POST /child-find/service-plans/{id}/kindergarten-transition"]
  - id: ERR_SERVICE_LINE_NOT_FOUND
    http_status: 404
    condition: "No ServiceLine with the given id"
    applies_to: ["GET /child-find/service-lines/{id}", "POST /child-find/service-lines/{id}/staff", "POST /child-find/service-lines/{id}/unstaff"]

  - id: ERR_NOT_CHILD_GUARDIAN
    http_status: 403
    condition: "Caller role Parent whose X-User-ID is not the Child.id owning the target row"
    applies_to: ["GET /child-find/children/{id}", "GET /child-find/referrals/{id}", "GET /child-find/referrals/{id}/timeline", "GET /child-find/service-plans/{id}", "POST /child-find/consent-records/{id}/decision"]
  - id: ERR_NOT_ASSIGNED_EVALUATOR
    http_status: 403
    condition: "Caller role Evaluator whose X-User-ID is not the assessment's evaluator_provider_id"
    applies_to: ["POST /child-find/domain-assessments/{id}/completion", "POST /child-find/domain-assessments/{id}/invalidation"]
  - id: ERR_NOT_CASE_CHAIR
    http_status: 403
    condition: "Caller role EvaluationChair whose X-User-ID is not the case's chair_provider_id"
    applies_to: ["POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/evaluation-cases/{id}/report", "POST /child-find/evaluation-cases/{id}/service-plans", "POST /child-find/domain-assessments/{id}/completion", "POST /child-find/domain-assessments/{id}/invalidation"]
  - id: ERR_CHAIR_NOT_ELIGIBLE
    http_status: 422
    condition: "chair_provider_id names a provider whose discipline is not SCHOOL_PSYCHOLOGIST or ECSE_TEACHER"
    applies_to: ["POST /child-find/referrals/{id}/evaluation-cases"]

  - id: ERR_STALE_SCREENING_EVENT_VERSION
    http_status: 412
    condition: "expected_screening_event_version does not equal the parent event's current version"
    applies_to: ["POST /child-find/screening-events/{id}/slots"]
  - id: ERR_STALE_EVALUATION_CASE_VERSION
    http_status: 412
    condition: "expected_evaluation_case_version does not equal the parent case's current version"
    applies_to: ["POST /child-find/evaluation-cases/{id}/service-plans"]
  - id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    condition: "expected_provider_version does not equal the named provider's current version"
    applies_to: ["POST /child-find/service-lines/{id}/staff"]

  - id: ERR_INVALID_EVENT_STATE
    http_status: 409
    condition: "Screening event is not in a state permitting the requested status change, or a slot booking targets an event that is not OPEN"
    applies_to: ["POST /child-find/screening-events/{id}/status", "POST /child-find/screening-events/{id}/slots"]
  - id: ERR_INVALID_SLOT_STATE
    http_status: 409
    condition: "Slot outcome recorded on a slot that is not BOOKED"
    applies_to: ["POST /child-find/screening-slots/{id}/outcome"]
  - id: ERR_INVALID_REFERRAL_STATE
    http_status: 409
    condition: "Consent request on a referral whose intake_status is not RECEIVED and which holds no PENDING or GRANTED EVALUATION_CONSENT record (i.e. intake DECLINED, WITHDRAWN or SUPERSEDED; a PENDING or GRANTED record is ERR_CONSENT_ALREADY_REQUESTED instead), or evaluation case creation on a referral whose consent_status IS GRANTED but whose intake_status is not EVALUATION_AUTHORIZED (reachable only as GRANTED + SUPERSEDED); when consent_status is not GRANTED the case-creation refusal is ERR_CONSENT_NOT_GRANTED instead"
    applies_to: ["POST /child-find/referrals/{id}/consent-requests", "POST /child-find/referrals/{id}/evaluation-cases"]
  - id: ERR_INVALID_CONSENT_STATE
    http_status: 409
    condition: "Decision recorded on a consent record whose current decision does not permit it (e.g. GRANTED -> GRANTED, or any decision on a REFUSED/REVOKED record)"
    applies_to: ["POST /child-find/consent-records/{id}/decision"]
  - id: ERR_INVALID_CASE_STATE
    http_status: 409
    condition: "Evaluation case is not in a state permitting the requested operation (scheduling an assessment on a CANCELLED or ELIGIBILITY_DETERMINED case, drafting a report outside DOMAINS_COMPLETE/REVISIONS_REQUESTED, requesting a revision outside REPORT_DRAFTED, determining eligibility outside REPORT_DRAFTED)"
    applies_to: ["POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/evaluation-cases/{id}/report", "POST /child-find/evaluation-cases/{id}/revision-requests", "POST /child-find/evaluation-cases/{id}/service-plans"]
  - id: ERR_INVALID_ASSESSMENT_STATE
    http_status: 409
    condition: "Completion or invalidation of an assessment that is not in a permitting state (completing a COMPLETED or INVALIDATED assessment, invalidating an INVALIDATED one)"
    applies_to: ["POST /child-find/domain-assessments/{id}/completion", "POST /child-find/domain-assessments/{id}/invalidation"]
  - id: ERR_INVALID_PLAN_STATE
    http_status: 409
    condition: "Service plan is not in a state permitting the operation (adding a line outside DRAFT, submitting consent outside DRAFT, a transition action outside ACTIVE)"
    applies_to: ["POST /child-find/service-plans/{id}/service-lines", "POST /child-find/service-plans/{id}/consent-submission", "POST /child-find/service-plans/{id}/kindergarten-transition"]
  - id: ERR_INVALID_LINE_STATE
    http_status: 409
    condition: "Staffing a line that is not PROPOSED or UNSTAFFED, or unstaffing a line that is not STAFFED"
    applies_to: ["POST /child-find/service-lines/{id}/staff", "POST /child-find/service-lines/{id}/unstaff"]

  - id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    condition: "Evaluation activity attempted on a referral whose consent_status is not GRANTED"
    applies_to: ["POST /child-find/referrals/{id}/evaluation-cases"]
  - id: ERR_INTERPRETER_NOT_PROVIDED
    http_status: 422
    condition: "A parent notice is issued in a language the family cannot read without an interpreter of record, or a screening slot requests a language the event's interpreter_languages does not cover"
    applies_to: ["POST /child-find/referrals/{id}/consent-requests", "POST /child-find/service-plans/{id}/consent-submission", "POST /child-find/screening-events/{id}/slots"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    condition: "The evaluator of a domain assessment is the same provider as the case chair, or the case chair is named as interpreter of record on the same case's notices"
    applies_to: ["POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/referrals/{id}/consent-requests"]
  - id: ERR_AGE_INELIGIBLE
    http_status: 422
    condition: "Child's whole-month age at referral receipt is below 33 or above 71"
    applies_to: ["POST /child-find/referrals"]
  - id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 422
    condition: "A named provider's status is ON_LEAVE or INACTIVE"
    applies_to: ["POST /child-find/referrals/{id}/evaluation-cases", "POST /child-find/evaluation-cases/{id}/domain-assessments", "POST /child-find/service-lines/{id}/staff", "POST /child-find/referrals/{id}/consent-requests"]
  - id: ERR_DISCIPLINE_MISMATCH
    http_status: 422
    condition: "Staffed provider's discipline does not equal the service line's discipline, an INTERPRETER is staffed to a service line, or an evaluator's discipline cannot assess the requested developmental domain"
    applies_to: ["POST /child-find/service-lines/{id}/staff", "POST /child-find/evaluation-cases/{id}/domain-assessments"]
  - id: ERR_SITE_NOT_ELIGIBLE
    http_status: 422
    condition: "Site is INACTIVE, not screening_host_approved when hosting an event, or does not support the child's primary language when receiving a community preschool placement"
    applies_to: ["POST /child-find/screening-events", "POST /child-find/evaluation-cases/{id}/service-plans", "POST /child-find/service-plans/{id}/service-lines"]
  - id: ERR_SITE_EVENT_OVERLAP
    http_status: 409
    condition: "New screening event window overlaps a non-CANCELLED event at the same site under half-open comparison with no buffer"
    applies_to: ["POST /child-find/screening-events"]
  - id: ERR_EVALUATOR_WINDOW_CONFLICT
    http_status: 409
    condition: "New assessment window conflicts with a SCHEDULED or COMPLETED assessment of the same evaluator, with a 30-minute travel buffer applied only across different sites"
    applies_to: ["POST /child-find/evaluation-cases/{id}/domain-assessments"]
  - id: ERR_SLOT_OUTSIDE_EVENT_WINDOW
    http_status: 422
    condition: "Slot start is before the event window start, or slot start plus slot_length_minutes runs past the event window end"
    applies_to: ["POST /child-find/screening-events/{id}/slots"]
  - id: ERR_TRANSITION_CONFERENCE_TOO_LATE
    http_status: 422
    condition: "Transition conference date is within 90 days of the child's kindergarten_eligibility_date or is not strictly after the logical clock date"
    applies_to: ["POST /child-find/service-plans/{id}/kindergarten-transition"]
  - id: ERR_DOMAINS_INCOMPLETE
    http_status: 409
    condition: "Fewer than five distinct developmental domains have a COMPLETED assessment on the case"
    applies_to: ["POST /child-find/evaluation-cases/{id}/report", "POST /child-find/evaluation-cases/{id}/service-plans"]
  - id: ERR_DUPLICATE_DOMAIN_ASSESSMENT
    http_status: 409
    condition: "The case already has a SCHEDULED or COMPLETED assessment for the requested domain"
    applies_to: ["POST /child-find/evaluation-cases/{id}/domain-assessments"]
  - id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    condition: "The case's revision_round has already reached MAX_REVISION_ROUNDS (2)"
    applies_to: ["POST /child-find/evaluation-cases/{id}/revision-requests"]
  - id: ERR_CONSENT_ALREADY_REQUESTED
    http_status: 409
    condition: "The referral already has an EVALUATION_CONSENT record whose decision is PENDING or GRANTED"
    applies_to: ["POST /child-find/referrals/{id}/consent-requests"]
  - id: ERR_CONSENT_NOT_REVOCABLE
    http_status: 409
    condition: "Revocation requested on a record that is not a GRANTED EVALUATION_CONSENT"
    applies_to: ["POST /child-find/consent-records/{id}/decision"]
  - id: ERR_PLAN_SETTING_REQUIREMENTS_UNMET
    http_status: 422
    condition: "Setting-specific requirements violated: COMMUNITY_PRESCHOOL without a community_site_id, DISTRICT_ECSE_CLASSROOM or HOME_BASED with one, ITINERANT_ONLY with a PUSH_IN line or a line above 300 weekly minutes, or a plan submitted for consent with no service line"
    applies_to: ["POST /child-find/evaluation-cases/{id}/service-plans", "POST /child-find/service-plans/{id}/service-lines", "POST /child-find/service-plans/{id}/consent-submission"]
  - id: ERR_ELIGIBILITY_OVERRIDE_JUSTIFICATION_REQUIRED
    http_status: 422
    condition: "eligibility_decision contradicts composite_eligibility_recommendation and override_justification is absent or empty"
    applies_to: ["POST /child-find/evaluation-cases/{id}/service-plans"]
  - id: ERR_TRANSITION_SEQUENCE_VIOLATION
    http_status: 409
    condition: "Kindergarten transition action taken out of order relative to kindergarten_transition_status"
    applies_to: ["POST /child-find/service-plans/{id}/kindergarten-transition"]
  - id: ERR_SCREENING_SLOTS_UNRESOLVED
    http_status: 409
    condition: "Screening event completion attempted while at least one slot is still BOOKED"
    applies_to: ["POST /child-find/screening-events/{id}/status"]

  - id: ERR_SCREENING_CAPACITY_EXCEEDED
    http_status: 422
    condition: "booked_slot_count has already reached effective_slot_capacity"
    applies_to: ["POST /child-find/screening-events/{id}/slots"]
  - id: ERR_IEP_SEAT_CAPACITY_EXCEEDED
    http_status: 422
    condition: "The named community site's reserved_iep_seat_count has already reached iep_seat_capacity"
    applies_to: ["POST /child-find/service-plans/{id}/consent-submission"]
  - id: ERR_EVALUATION_CASELOAD_EXCEEDED
    http_status: 422
    condition: "The chair's active_evaluation_count has already reached max_evaluation_caseload"
    applies_to: ["POST /child-find/referrals/{id}/evaluation-cases"]
  - id: ERR_PROVIDER_CASELOAD_EXCEEDED
    http_status: 422
    condition: "The provider's projected assigned_weekly_service_minutes after staffing, travel overhead included, would exceed max_weekly_service_minutes"
    applies_to: ["POST /child-find/service-lines/{id}/staff"]
  - id: ERR_INTERPRETER_UNAVAILABLE
    http_status: 422
    condition: "The named interpreter's assigned_interpreter_assignment_count has already reached max_weekly_interpreter_assignments"
    applies_to: ["POST /child-find/referrals/{id}/consent-requests", "POST /child-find/service-plans/{id}/consent-submission"]

# =============================================================================
# 1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: ChildFindCoordinator
    description: "Runs community outreach, screening events, referral intake and the parent-notice/consent process."
    identity: opaque
    exclusive_operations:
      - "POST /child-find/children"
      - "POST /child-find/screening-events"
      - "POST /child-find/screening-events/{id}/status"
      - "POST /child-find/screening-events/{id}/slots"
      - "POST /child-find/screening-slots/{id}/outcome"
      - "POST /child-find/referrals"
      - "POST /child-find/referrals/{id}/consent-requests"
      - "POST /child-find/referrals/{id}/evaluation-cases"
    shared_operations:
      - "POST /child-find/consent-records/{id}/decision (with Parent)"
      - "POST /child-find/evaluation-cases/{id}/domain-assessments (with EvaluationChair)"
      - "POST /child-find/evaluation-cases/{id}/revision-requests (with PlacementAdministrator)"
      - "POST /child-find/service-plans/{id}/consent-submission (with PlacementAdministrator)"
      - "POST /child-find/service-plans/{id}/kindergarten-transition (with PlacementAdministrator)"
      - "all GET reads except GET /child-find/service-lines/{id} listings restricted to Parent"
  - name: EvaluationChair
    description: "The chair-eligible specialist who owns one evaluation case: schedules the team, drafts the report, and may determine eligibility."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /child-find/evaluation-cases/{id}/report"
    shared_operations:
      - "POST /child-find/evaluation-cases/{id}/domain-assessments (with ChildFindCoordinator)"
      - "POST /child-find/domain-assessments/{id}/completion (with Evaluator)"
      - "POST /child-find/domain-assessments/{id}/invalidation (with Evaluator)"
      - "POST /child-find/evaluation-cases/{id}/service-plans (with PlacementAdministrator)"
      - "POST /child-find/service-plans/{id}/service-lines (with PlacementAdministrator)"
      - "evaluation, referral, plan and provider GET reads"
    notes: "X-User-ID must equal EvaluationCase.chair_provider_id or the request fails ERR_NOT_CASE_CHAIR. Segregation of duties: a chair may not also be an evaluator on their own case, and may not be the interpreter of record on its notices."
  - name: Evaluator
    description: "A discipline specialist who administers and records one developmental-domain assessment."
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /child-find/domain-assessments/{id}/completion (with EvaluationChair)"
      - "POST /child-find/domain-assessments/{id}/invalidation (with EvaluationChair)"
      - "child, provider, evaluation-case and domain-assessment GET reads"
    notes: "X-User-ID must equal DomainAssessment.evaluator_provider_id or the request fails ERR_NOT_ASSIGNED_EVALUATOR. An Evaluator cannot schedule assessments, draft reports or determine eligibility."
  - name: PlacementAdministrator
    description: "Owns eligibility determination, setting and site decisions, service minutes, itinerant staffing and kindergarten transition."
    identity: opaque
    exclusive_operations:
      - "POST /child-find/community-sites"
      - "POST /child-find/service-lines/{id}/staff"
      - "POST /child-find/service-lines/{id}/unstaff"
    shared_operations:
      - "POST /child-find/evaluation-cases/{id}/service-plans (with EvaluationChair)"
      - "POST /child-find/service-plans/{id}/service-lines (with EvaluationChair)"
      - "POST /child-find/evaluation-cases/{id}/revision-requests (with ChildFindCoordinator)"
      - "POST /child-find/service-plans/{id}/consent-submission (with ChildFindCoordinator)"
      - "POST /child-find/service-plans/{id}/kindergarten-transition (with ChildFindCoordinator)"
      - "all non-Parent GET reads"
    notes: "Cannot open evaluation cases, schedule assessments, draft reports or record screening outcomes."
  - name: Parent
    description: "The parent/guardian holding educational rights for exactly one child; may read that child's record and act on consent."
    identity: "entity_backed:Child"
    exclusive_operations: []
    shared_operations:
      - "POST /child-find/consent-records/{id}/decision (with ChildFindCoordinator)"
      - "GET /child-find/children/{id}, GET /child-find/referrals/{id}, GET /child-find/referrals/{id}/timeline, GET /child-find/consent-records/{id}, GET /child-find/service-plans/{id}, GET /child-find/screening-slots/{id} and the corresponding filtered lists"
    notes: "X-User-ID is the Child.id. Any read or write touching another family's row fails ERR_NOT_CHILD_GUARDIAN. A Parent can never create a referral, schedule anything, or see provider capacity."
  - name: DistrictAdmin
    description: "District-level superuser for staff registry, data correction and test-driving the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /child-find/providers"
      - "PATCH /child-find/providers/{id}"
      - "POST /child-find/_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5"
    notes: "DistrictAdmin bypasses the Parent-guardian, case-chair and assigned-evaluator identity checks but NOT the chair-eligibility, segregation-of-duties, state, temporal, constraint or capacity rules."
