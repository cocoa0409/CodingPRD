              as: TestEngineer
              as_user_id: "eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Sample.${samp1}.status == ACCEPTED (unchanged) and triaged_by == eng-1"

      - name: reinstate_blocked_while_critical_finding_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Certification.SUSPENDED_to_ACTIVE
          - errors[ERR_OPEN_CRITICAL_FINDINGS]
        distinguishing_aspect: "Manual reinstatement is gated on the absence of open CRITICAL findings naming the certification: the endpoint fails with ERR_OPEN_CRITICAL_FINDINGS until the finding's inspection is voided, after which the cascade reinstates the certification without any endpoint call."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup; a completed inspection recorded a CRITICAL finding naming the certification -> SUSPENDED with cause CRITICAL_FINDING:FD-7."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [{ finding_ref: "FD-7", certification_id: "${cert_id}", severity: "CRITICAL", description: "Line-built units omit listed fuse" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /certification/certifications/${cert_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/inspections/${insp_id}/void"
              payload: { reason: "Finding recorded against wrong line" }
              as: ComplianceOfficer
          assert:
            - "the manual reinstate -> error_id == ERR_OPEN_CRITICAL_FINDINGS and the certification stays SUSPENDED"
            - "after the inspection void: Certification.${cert_id}.status == ACTIVE (compensation cascade, no endpoint reinstate)"

  # ===========================================================================
  - section: validations
    instances:
      - name: construction_record_duplicate_slot_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_COMPONENT_SLOT]
        distinguishing_aspect: "Listing the same required slot twice (even with full coverage of the other slots) is rejected with ERR_DUPLICATE_COMPONENT_SLOT."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical standard/manufacturer/factory/project."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
          trigger:
            - call: "POST /certification/projects/${proj_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-25", material: "n/a", part_number: "MW-RS-25", rating: "100-240VAC" }, { slot: "power_supply", component_name: "MeanWell RS-35", material: "n/a", part_number: "MW-RS-35", rating: "100-240VAC" }], expected_project_version: "${proj_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_DUPLICATE_COMPONENT_SLOT"
            - "no construction record is created (list empty)"

      - name: mandatory_protocol_failing_returned_when_safety_passes
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_MANDATORY_PROTOCOL_FAILING]
        distinguishing_aspect: "With the safety-critical protocol at PASS and an ordinary mandatory protocol at FAIL, approval fails with ERR_MANDATORY_PROTOCOL_FAILING — isolating the priority-10 error that the safety conflict instance masks."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project in EVALUATION: P-SAFE 60 (PASS), P-TEMP 90 (FAIL)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 90 }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_MANDATORY_PROTOCOL_FAILING (safety gate passed, constraint gate fires)"
            - "CertificationProject.${proj_id}.status == EVALUATION (unchanged)"

      - name: label_batch_zero_quantity_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_LABEL_QUANTITY]
        distinguishing_aspect: "A batch with quantity 0 violates the >= 1 floor: 400 ERR_INVALID_LABEL_QUANTITY, and no serial range is consumed."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup with an ACTIVE license (quota 11000)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 0 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_LABEL_QUANTITY"
            - "MarkLicense.${lic_id}.used_quantity == 0 and next_serial == 1 (nothing consumed)"
