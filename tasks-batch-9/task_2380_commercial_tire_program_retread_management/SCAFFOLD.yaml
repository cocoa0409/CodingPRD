  # ---------------- RetreadJob ----------------
  - method: POST
    path: "/retread-jobs"
    description: "Schedules a retread of an INSPECTED casing into a half-open slot on a production line, snapshotting the casing's grade and retread count."
    roles: [PlantScheduler]
    code: 201
    input: [casing_id, retread_line_id, tread_design_code, scheduled_start_at, scheduled_end_at]
    output: RetreadJob
    side_effects:
      - "runs calculations.retread_slot_feasibility against every SCHEDULED/IN_PRODUCTION slot on the line extended by cure_cooldown_minutes"
      - "sets grade_at_scheduling and retread_count_at_scheduling from the casing"
      - "cascades Casing INSPECTED -> RETREAD_QUEUED"
      - "adds slot_minutes + cure_cooldown_minutes to RetreadLine.booked_minutes"

  - method: POST
    path: "/retread-jobs/{job_id}/start"
    description: "Puts a scheduled job into production; the line must be AVAILABLE and started_at may not precede the booked slot."
    roles: [PlantScheduler]
    code: 200
    input: [started_at]
    output: RetreadJob
    side_effects: ["RetreadJob SCHEDULED -> IN_PRODUCTION", "cascades Casing RETREAD_QUEUED -> IN_RETREAD", "RetreadLine.booked_minutes unchanged"]

  - method: POST
    path: "/retread-jobs/{job_id}/complete"
    description: "Completes production: mints the retreaded TireAsset, sets the warranty term on the retreaded product, and posts the production-verified casing credit ADJUSTMENT delta, which propagates to the fleet balance and every OPEN invoice."
    roles: [PlantScheduler]
    code: 200
    input: [completed_at, cost_basis_cents]
    output: RetreadJob
    side_effects:
      - "hop 1: status = COMPLETED, warranty_months and warranty_expires_on per calculations.retread_warranty, mints a TireAsset in IN_INVENTORY and stores produced_tire_asset_id"
      - "hop 2: Casing IN_RETREAD -> RETREADED, retread_count += 1, inspection_grade = null"
      - "hop 3: posts a CasingCreditEntry ADJUSTMENT of PRODUCTION_VERIFIED minus GRADE_PROVISIONAL and recomputes Casing.provisional_credit_cents"
      - "hop 4: recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
      - "hop 5: every OPEN CrossLocationInvoice of that fleet recomputes credit_applied_cents and total_cents and increments its version by 1"
      - "releases the slot from RetreadLine.booked_minutes"

  - method: POST
    path: "/retread-jobs/{job_id}/fail-cure"
    description: "Records a cure failure. The failure_reason forks three different side-effect sets: CURE_DEFECT returns the casing to INSPECTED, LINE_FAULT also takes the line DOWN, CASING_FAILURE condemns the casing."
    roles: [PlantScheduler]
    code: 200
    input: [failure_reason, "note?"]
    output: RetreadJob
    side_effects:
      - "RetreadJob IN_PRODUCTION -> FAILED_CURE with failure_reason"
      - "CURE_DEFECT: Casing IN_RETREAD -> INSPECTED; line untouched"
      - "LINE_FAULT: Casing IN_RETREAD -> INSPECTED and RetreadLine AVAILABLE -> DOWN"
      - "CASING_FAILURE: Casing IN_RETREAD -> REJECTED with no ledger entry"
      - "releases the slot from RetreadLine.booked_minutes in all three branches"

  - method: POST
    path: "/retread-jobs/{job_id}/reschedule"
    description: "Re-books a FAILED_CURE job into a new slot, optionally on a different line. A job whose casing was condemned by CASING_FAILURE can never be rescheduled."
    roles: [PlantScheduler]
    code: 200
    input: [scheduled_start_at, scheduled_end_at, "retread_line_id?"]
    output: RetreadJob
    side_effects:
      - "RetreadJob FAILED_CURE -> SCHEDULED, reschedule_count += 1"
      - "re-runs calculations.retread_slot_feasibility on the target line, excluding this job from the occupying set"
      - "cascades Casing INSPECTED -> RETREAD_QUEUED"
      - "adds the new slot to RetreadLine.booked_minutes"

  - method: POST
    path: "/retread-jobs/{job_id}/cancel"
    description: "Cancels a SCHEDULED or FAILED_CURE job, restoring the line's booked_minutes to its pre-scheduling value with zero drift."
    roles: [PlantScheduler]
    code: 200
    input: [reason]
    output: RetreadJob
    side_effects:
      - "RetreadJob SCHEDULED|FAILED_CURE -> CANCELLED"
      - "from SCHEDULED: cascades Casing RETREAD_QUEUED -> INSPECTED and releases the slot from RetreadLine.booked_minutes"
      - "from FAILED_CURE: the casing keeps its current state and the slot is already released"

  - method: GET
    path: "/retread-jobs/{job_id}"
    description: "Reads one retread job including snapshotted grade, warranty term and reschedule_count."
    roles: [DealerAdmin, PlantScheduler, FleetManager]
    code: 200
    input: []
    output: RetreadJob
    side_effects: []

  - method: GET
    path: "/retread-jobs"
    description: "Lists retread jobs. casing_id, retread_line_id and produced_tire_asset_id are the reverse-reachability paths from Casing, RetreadLine and the minted TireAsset (which appears in no creation response)."
    roles: [DealerAdmin, PlantScheduler, FleetManager]
    code: 200
    input: ["casing_id?", "retread_line_id?", "produced_tire_asset_id?", "status?", "limit?", "offset?"]
    output: RetreadJob[]
    side_effects: []

