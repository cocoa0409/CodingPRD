  - section: state_machines
    instances:
      - name: zone_activate_permit_is_the_declared_valid_transition
        claim_type: valid_transition
        grounds:
          - "state_machines.ServiceZone.PROVISIONED_to_PERMITTED"
          - "endpoints[POST /service-zones/{zone_id}/permit-transitions]"
          - "entities.ServiceZone.fields.permit_state"
          - "common_fields_contract.version_semantics"
        distinguishing_aspect: >-
          The happy-path transition of the permit machine: with one APPROVED segment in the zone,
          ACTIVATE_PERMIT moves permit_state PROVISIONED -> PERMITTED, leaves restriction_reason null and
          increments the zone version by exactly 1, and it is that single transition - not the segment
          approval - that unlocks merchant activation and robot staging.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with version 1 and restriction_reason null"
            - "SidewalkSegment S1 APPROVED in Z1, satisfying the one precondition of the transition"
            - "no merchants or robots exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
