  # =================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=17]
        distinguishing_aspect: |
          Pair = state (priority 8, ERR_INVALID_STATE) vs business_fiscal (priority 17,
          ERR_DEPOSIT_NOT_SETTLED). Confirm on an INQUIRY booking with no deposit violates BOTH;
          the lower-priority-number state check wins -> ERR_INVALID_STATE, not ERR_DEPOSIT_NOT_SETTLED.
        test_recipe:
          setup:
            - "Booking still in INQUIRY (never placed on hold) and deposit unpaid; confirm attempted"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vp5a", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", email: "c8@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 8 beats fiscal priority 17)"
            - "HTTP status == 409, not 402"

      - name: existence_beats_temporal_on_create_booking
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair = existence (priority 5, ERR_REFERENCE_NOT_FOUND) vs business_temporal (priority 7,
          ERR_INVALID_TIME_WINDOW). A create-booking with a non-existent package_id AND a malformed
          block window (ceremony_end before ceremony_start) violates both; existence wins ->
          ERR_REFERENCE_NOT_FOUND.
        test_recipe:
          setup:
            - "Venue and client exist; package_id is a random non-existent UUID; ceremony window is inverted"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vp5b", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", email: "c9@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "00000000-0000-4000-8000-000000000000", event_date: "2026-09-12", ceremony_start: "2026-09-12T21:00:00Z", ceremony_end: "2026-09-12T20:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND (existence priority 5 beats temporal priority 7)"
            - "HTTP status == 404, not 422"

