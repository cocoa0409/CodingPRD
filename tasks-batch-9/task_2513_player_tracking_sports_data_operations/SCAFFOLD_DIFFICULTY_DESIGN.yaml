            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { gv1: $.data.version }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "SHOT", clock_ms: 120000, confidence: 0.95, biometric_payload_present: false, expected_game_version: "${gv1}" }
              as: Statistician
              as_user_id: "stat-01"
              captures: { t1: $.data.id }
            - call: "POST /event-tags/${t1}/submit"
              as: Statistician
              as_user_id: "stat-01"
            - call: "POST /event-tags/${t1}/accept"
              as: QualityReviewer
              as_user_id: "qa-01"
          trigger:
            - call: "GET /games/${g_id}"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { mid_collection: $.data.collection_status, mid_cert: $.data.certification_status }
            - call: "POST /games/${g_id}/close-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /games/${g_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
          assert:
            - "${mid_collection} == LIVE while ${mid_cert} == PROVISIONAL (certification advanced with collection untouched)"
            - "after close-collection Game.${g_id}.collection_status == COLLECTED and Game.${g_id}.certification_status == PROVISIONAL (collection advanced with certification untouched)"
            - "Game.${g_id}.quality_index == 0.8250"
            - "after certify Game.${g_id}.certification_status == OFFICIAL"
            - "after certify Game.${g_id}.collection_status == ARCHIVED"
            - "Game.${g_id}.certified_at_utc == 2026-08-01T12:00:00Z"
            - "Game.${g_id}.accepted_tag_count == 1 and Game.${g_id}.total_tag_count == 1"

      - name: installation_recalibration_cycle_returns_to_certified
        grounds:
          - state_machines.TrackingInstallation.CERTIFIED_to_RECALIBRATION_REQUIRED
          - state_machines.TrackingInstallation.RECALIBRATION_REQUIRED_to_CALIBRATING
          - state_machines.TrackingInstallation.CALIBRATING_to_VALIDATED
          - state_machines.TrackingInstallation.VALIDATED_to_CERTIFIED
          - entities.TrackingInstallation.fields.drift_flag_count
          - calculations.venue_data_posture
        distinguishing_aspect: |
          Non-linearity by CYCLE: the rig re-enters a state it already left - CERTIFIED ->
          RECALIBRATION_REQUIRED -> CALIBRATING -> VALIDATED -> CERTIFIED - and the second arrival
          is distinguishable from the first only by the monotone counters (drift_flag_count 1,
          calibration_run_count 2) and by the refreshed latest_run mirrors, while Venue.data_posture
          walks CERTIFIED -> UNCERTIFIED -> CERTIFIED with it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with required_certified_installations 1"
            - "one installation certified after a PASS run recorded by eng-01, data_posture CERTIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
          trigger:
            - call: "POST /installations/${i_id}/flag-drift"
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { after_drift: $.data.status, drift_count: $.data.drift_flag_count }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 75.0, axis_rms_y_mm: 75.0, axis_rms_z_mm: 75.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-02"
              captures: { run2: $.data.id, run2_result: $.data.result }
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { final_status: $.data.status }
          assert:
            - "${after_drift} == RECALIBRATION_REQUIRED and ${drift_count} == 1"
            - "Venue.${v_id}.data_posture == UNCERTIFIED immediately after flag-drift (certified_installation_count 0, recalibrating_installation_count 1)"
            - "${run2_result} == PASS and CalibrationRun.${run2}.composite_rms_mm == 75.00"
            - "${final_status} == CERTIFIED (second arrival in the same state)"
            - "TrackingInstallation.${i_id}.calibration_run_count == 2"
            - "TrackingInstallation.${i_id}.drift_flag_count == 1"
            - "TrackingInstallation.${i_id}.latest_run_engineer_user_id == 'eng-02'"
            - "TrackingInstallation.${i_id}.latest_run_composite_rms_mm == 75.00"
            - "TrackingInstallation.${i_id}.certified_by_user_id == 'ops-01'"
            - "Venue.${v_id}.data_posture == CERTIFIED and Venue.${v_id}.certified_installation_count == 1 and Venue.${v_id}.recalibrating_installation_count == 0"

  # =========================================================================
  # RULE 4 — transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: drift_flag_cascades_to_venue_posture_game_suspension_and_feed_session
        grounds:
          - state_machines.TrackingInstallation.CERTIFIED_to_RECALIBRATION_REQUIRED
          - state_machines.Game.collection_status_LIVE_to_SUSPENDED_COLLECTION
          - state_machines.FeedSession.ACTIVE_to_SUSPENDED
          - state_machines.Game.collection_status_SUSPENDED_COLLECTION_to_LIVE
          - calculations.venue_data_posture
          - entities.FeedSession.fields.halt_reason
        distinguishing_aspect: |
          Depth-3 cascade triggered by an ENGINEERING event on infrastructure: one
          POST /installations/{id}/flag-drift moves the rig (level 1), recomputes
          Venue.data_posture out of CERTIFIED (level 2), suspends every LIVE game at that venue
          with data_quality_flag DEGRADED (level 3) and suspends those games' ACTIVE feed sessions
          with halt_reason VENUE_DEGRADED (level 4) - and the reverse walk restores all four
          levels while leaving the licensee quota ledger untouched throughout.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue, required_certified_installations 1, one CERTIFIED rig, data_posture CERTIFIED"
            - "Game LIVE at that venue"
            - "GOLD licensee with granted_units 5000, an ACTIVE COMMERCIAL_LICENSE rights window, and an ACTIVE REALTIME feed session reserving 900 units (available_units 4100)"
          setup_api_calls:
