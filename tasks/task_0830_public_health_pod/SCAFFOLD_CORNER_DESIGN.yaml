            - "e4 == 'ERR_SHIFT_ASSIGNMENT_NOT_FOUND'"
            - "e5 == 'ERR_COUNTERMEASURE_NOT_FOUND'"
            - "e6 == 'ERR_INVENTORY_LOT_NOT_FOUND'"
            - "e7 == 'ERR_ALLOCATION_REQUEST_NOT_FOUND'"
            - "e8 == 'ERR_DISPENSING_EVENT_NOT_FOUND'"
            - "e9 == 'ERR_DRILL_NOT_FOUND'"
            - "e10 == 'ERR_SITUATION_REPORT_NOT_FOUND'"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: forbidden_role_cannot_create_hazard_plan
        claim_type: exclusive_operation_denial
        grounds: [roles.PublicHealthAdmin, roles.LogisticsCoordinator]
        distinguishing_aspect: "POST /hazard-plans is PublicHealthAdmin-exclusive; LogisticsCoordinator attempting it is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Forbidden Plan", jurisdiction_code: "CTY38", target_population: 400 }
              as: LogisticsCoordinator
              captures: { create_error: $.data.error_id }
          assert:
            - "create_error == 'ERR_FORBIDDEN'  (POST /hazard-plans roles == [PublicHealthAdmin] only)"

      - name: volunteer_ownership_mismatch_on_shift_cancel
        claim_type: exclusive_operation_denial
        grounds: ["validations[priority=3]", roles.Volunteer]
        distinguishing_aspect: "A Volunteer whose X-User-ID does not equal the ShiftAssignment's staff_member_id cannot cancel it, even though Volunteer is a shared role for that operation — ERR_OWNERSHIP_MISMATCH, distinct from a plain ERR_FORBIDDEN role-mismatch."
        test_recipe:
          setup: ["Two StaffMembers (volunteer A owns the assignment, volunteer B does not); one PENDING ShiftAssignment for volunteer A"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Ownership Plan", jurisdiction_code: "CTY39", target_population: 350 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Ownership POD", site_type: FIXED_POD, address: "40 Own St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Volunteer A", email: "volunteera@example.org", primary_role: GREETER, mrc_unit: "UnitU", credential_type: PODS_TRAINING, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { vol_a_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Volunteer B", email: "volunteerb@example.org", primary_role: GREETER, mrc_unit: "UnitU", credential_type: PODS_TRAINING, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { vol_b_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${vol_a_id}", assigned_role: GREETER, start_time: "2026-03-12T08:00:00Z", end_time: "2026-03-12T16:00:00Z" }
              as: Volunteer
              as_user_id: "${vol_a_id}"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${sa_id}/cancel"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_b_id}"
              captures: { cancel_error: $.data.error_id }
          assert:
            - "cancel_error == 'ERR_OWNERSHIP_MISMATCH'  (X-User-ID vol_b_id does not equal ShiftAssignment.staff_member_id vol_a_id)"

      - name: unauthenticated_missing_headers_rejected
        claim_type: authentication
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers at all is rejected with ERR_UNAUTHENTICATED before any RBAC or business check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hazard-plans"
              payload: {}
              as: Anonymous
              captures: { list_error: $.data.error_id }
          assert:
            - "list_error == 'ERR_UNAUTHENTICATED'  (no X-User-Role/X-User-ID headers supplied; 'Anonymous' here denotes the absence of auth headers, not a declared role)"

  # ===========================================================================
  # Section: complexity_layers (optimistic_concurrency, derived_field_reconciliation)
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: allocation_request_create_stale_pod_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-request-create-stale-pod]"]
        distinguishing_aspect: "Creating an AllocationRequest with an expected_pod_version that no longer matches POD.version (because an intervening /restrict bumped it) is rejected with ERR_STALE_VERSION at 412; the same call with the fresh version succeeds."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; POD OPERATIONAL; POD.version captured, then bumped again by a /restrict call before the create is attempted"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Stale POD Plan", jurisdiction_code: "CTY40", target_population: 300 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Stale POD", site_type: FIXED_POD, address: "41 Stale St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id, pod_v_stale: $.data.version }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v_fresh: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Stale Version Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 10, expected_pod_version: "${pod_v_stale}" }
              as: LogisticsCoordinator
              captures: { stale_error: $.data.error_id }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 10, expected_pod_version: "${pod_v_fresh}" }
              as: LogisticsCoordinator
              captures: { fresh_status: $.data.status }
          assert:
            - "stale_error == 'ERR_STALE_VERSION'  (pod_v_stale was POD.version before /open bumped it; /open advanced POD.version, making the stale read invalid)"
            - "fresh_status == 'REQUESTED'  (the same create succeeds when expected_pod_version matches the current POD.version)"

      - name: allocation_request_reserve_stale_lot_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-request-reserve-stale-lot]"]
        distinguishing_aspect: "Reserving with an expected_inventory_lot_version that no longer matches the source InventoryLot's version (because another AllocationRequest's reserve already bumped it) is rejected with ERR_STALE_VERSION at 412."
        test_recipe:
          setup: ["Central SNS-cache InventoryLot on_hand_quantity=100; two AllocationRequests created against it; the first reserve bumps InventoryLot.version, making the lot version captured before that reserve stale for the second"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Stale Lot Plan", jurisdiction_code: "CTY41", target_population: 280 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Stale Lot POD", site_type: FIXED_POD, address: "42 Stale Lot St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id, pod_v1: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Stale Lot Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-N1", on_hand_quantity: 100, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_id: $.data.id, lot_v_stale: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 10, expected_pod_version: "${pod_v1}" }
              as: LogisticsCoordinator
              captures: { ar1_id: $.data.id }
            - call: "POST /allocation-requests/${ar1_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v_stale}" }
              as: LogisticsCoordinator
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v2: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 5, expected_pod_version: "${pod_v2}" }
              as: LogisticsCoordinator
              captures: { ar2_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests/${ar2_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v_stale}" }
              as: LogisticsCoordinator
              captures: { stale_reserve_error: $.data.error_id }
          assert:
            - "stale_reserve_error == 'ERR_STALE_VERSION'  (lot_v_stale was InventoryLot.version before ar1's reserve bumped it; ar2's reserve carries the now-stale value)"

      - name: pod_queue_backlog_count_increments_and_decrements
        claim_type: derived_field_reconciliation
        grounds: [entities.POD.queue_backlog_count]
        distinguishing_aspect: "POD.queue_backlog_count increments on DispensingEvent creation and decrements on both refuse and dispense, staying in sync with the count of non-terminal DispensingEvent rows without a separate recomputation step."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; POD OPERATIONAL; Countermeasure and POD-scoped InventoryLot in place"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Backlog Plan", jurisdiction_code: "CTY42", target_population: 260 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Backlog POD", site_type: FIXED_POD, address: "43 Backlog St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Backlog Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-O1", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Backlog Staffer", email: "backlogstaffer@example.org", primary_role: SCREENER, mrc_unit: "UnitV", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Backlog 1", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de1_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Backlog 2", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de2_id: $.data.id }
          trigger:
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { backlog_after_two_creates: $.data.queue_backlog_count }
            - call: "POST /dispensing-events/${de1_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events/${de1_id}/refuse"
              payload: {}
              as: ClinicalLead
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { backlog_after_one_refuse: $.data.queue_backlog_count }
          assert:
            - "backlog_after_two_creates == 2  (two DispensingEvent rows created, both REGISTERED)"
            - "backlog_after_one_refuse == 1  (de1 moved to REFUSED, a terminal state, decrementing the backlog; de2 remains REGISTERED)"
