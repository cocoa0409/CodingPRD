              payload: { unit_tag: "UNIT-307", class_id: "${c307_id}", ownership: "OWNED", acquisition_cost_cents: 1000000, acquisition_date: "2025-01-01", useful_life_months: 12 }
              as: FleetAdmin
              captures: { e307_id: $.data.id }
          trigger:
            - call: "POST /fleet/equipment/${e307_id}/dispose"
              payload: { disposal_method: "SALE" }
              as: FleetAdmin
              captures: { e307_res: $.data.residual_value_cents }
          assert:
            - "residual_value_cents == 900000 == salvage floor (depreciation = (1000000-900000)*min(19,12)/12 = 100000 saturates; raw residual 900000 hits the floor exactly)"

      - name: rental_allocation_stacking_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.rental_allocation]
        distinguishing_aspect: "Per-day weekend-then-idle stacking with pinned rounding order."
        excluded_because:
          difficulty_instance: rental_allocation_weekend_then_idle_multiplier_stacking
          rationale: "Exact per-day arithmetic and stacking order asserted there (allocated_cents == 26664)."

      - name: service_threshold_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.service_threshold]
        distinguishing_aspect: "Inclusive >= crossing at exactly service_interval_hours*1000."
        excluded_because:
          difficulty_instance: service_threshold_inclusive_at_exact_interval
          rationale: "Threshold-1 / threshold / threshold+1 asserted there."

      - name: transport_overlap_both_semantics_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.transport_overlap]
        distinguishing_aspect: "Half-open assignment windows and buffered closed lowboy intervals."
        excluded_because:
          difficulty_instance: assignment_half_open_adjacency_allowed_overlap_rejected
          rationale: "Adjacency-allowed / overlap-rejected for both interval semantics asserted by the two §1.8 resource_temporal_overlap instances."

      - name: budget_guard_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.budget_guard]
        distinguishing_aspect: "Inclusive <= at the cap."
        excluded_because:
          difficulty_instance: budget_cap_inclusive_at_exact_equality
          rationale: "Equality-allowed / one-cent-over-rejected asserted there."

