            - "publish with 4 assignments succeeds; provisional_deficit_score == 0"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: order_create_increments_stand_version_and_assigns_lane_seq
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/orders
          - concurrency_rules[order-create-stale-stand]
        distinguishing_aspect: "Each successful POST /orders bumps Stand.version by 1 and assigns the next per-lane lane_seq — observable via GET /stands before/after."
        test_recipe:
          setup: ["Stand OPEN with recipe; two window orders placed in lane A."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { o1: $.data.id, seq1: $.data.lane_seq }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v2: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v2}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { o2: $.data.id, seq2: $.data.lane_seq }
          assert:
            - "Stand.version advanced from ${stand_v} by exactly 1 after the first order"
            - "lane_seq values are 1 then 2 within lane A (per-lane monotone)"

      - name: royalty_statement_is_computed_read_with_no_writes
        claim_type: Computed read
        grounds:
          - endpoints.GET_/stands/{standId}/royalty-statement
        distinguishing_aspect: "The royalty statement endpoint is read-only: two identical GETs return identical bodies and do not bump Stand.version."
        test_recipe:
          setup: ["Stand OPEN, no payments yet."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { v_before: $.data.version }
          trigger:
            - call: "GET /stands/${stand_id}/royalty-statement"
              payload: { month: "2026-09" }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { stmt1: "$.data" }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { v_after: $.data.version }
          assert:
            - "empty month: gross_cents == 0, brand_fund_cents == 0, net_cents == 0, royalty_rate == 0.04, royalty_cents == 0"
            - "Stand.version unchanged by the reads (${v_before} == ${v_after})"

  # ===========================================================================
  - section: errors
    instances:

      - name: missing_auth_headers_rejected_on_any_endpoint
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before existence checks — even against a non-existent resource id."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stands/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth outranks 404)"

      - name: unknown_modifier_name_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_MODIFIER_UNKNOWN]
        distinguishing_aspect: "modifier_names containing a name not on the recipe fails ERR_MODIFIER_UNKNOWN — distinct from ERR_INVALID_QUANTITY and ERR_EMPTY_ORDER in the same constraint group."
        test_recipe:
          setup: ["Stand OPEN with Carmelizer (only modifier EXTRA_SHOT)."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: ["OAT_MILK"] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MODIFIER_UNKNOWN (422)"

      - name: retire_blocked_while_distribution_live
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS]
          - state_machines.Recipe.ACTIVE_to_RETIRED
        distinguishing_aspect: "Retire fails with ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS while the recipe's distribution is WITHDRAWN-able but still ACTIVATED; after withdraw, retire succeeds."
        test_recipe:
          setup: ["Stand OPEN; recipe with ACTIVATED distribution."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
          trigger:
            - call: "POST /recipes/${recipe_id}/retire"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /recipe-distributions/${dist_id}/withdraw"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /recipes/${recipe_id}/retire"
              payload: {}
              as: PlatformAdmin
              captures: { retired: $.data.status }
          assert:
            - "retire while ACTIVATED -> ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS (409)"
            - "after withdraw, retire succeeds and Recipe.status == RETIRED"

      - name: operator_nomination_requires_tenure
        claim_type: Violation → Error
        grounds:
          - errors[ERR_TENURE_INSUFFICIENT]
        distinguishing_aspect: "Nomination of a crew member hired 2026-01-01 with the clock at 2026-09-01 (243 days < 365) fails ERR_TENURE_INSUFFICIENT; a 2024-01-01 hire passes."
        test_recipe:
          setup: ["Stand APPROVED; one rookie crew member and one veteran."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - call: "POST /crew-members"
              payload: { full_name: "Rookie Ray", home_stand_id: "${stand_id}", hired_on: "2026-01-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { rookie_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Veteran Val", home_stand_id: "${stand_id}", hired_on: "2024-01-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /operator-agreements"
              payload: { stand_id: "${stand_id}", crew_member_id: "${rookie_id}", revenue_share_pct: 0.30 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
            - call: "POST /operator-agreements"
              payload: { stand_id: "${stand_id}", crew_member_id: "${vet_id}", revenue_share_pct: 0.30 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { ok_agr: $.data.id }
          assert:
            - "rookie nomination -> ERR_TENURE_INSUFFICIENT (422)"
            - "veteran nomination -> 201 NOMINATED"

      - name: window_close_before_end_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_WINDOW_NOT_CLOSABLE]
        distinguishing_aspect: "Closing an OPEN window before the logical clock reaches ends_at fails ERR_WINDOW_NOT_CLOSABLE; at exactly ends_at it succeeds (boundary inclusive)."
        test_recipe:
          setup: ["Stand created; window 07:00-08:00 open; clock at 07:30."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *k_region
            - *k_stand
            - call: "POST /throughput-windows"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T08:00:00Z", target_cars: 0 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { window_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /throughput-windows/${window_id}/close"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /throughput-windows/${window_id}/close"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { final_status: $.data.status }
          assert:
            - "close at 07:30 -> ERR_WINDOW_NOT_CLOSABLE (409)"
            - "close at exactly 08:00 succeeds; target_cars 0 with 0 served -> CLOSED_PASS (0 >= 0)"

      - name: shift_created_in_past_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SHIFT_IN_PAST]
        distinguishing_aspect: "Shift starts_at earlier than the logical clock fails ERR_SHIFT_IN_PAST at creation."
        test_recipe:
          setup: ["Stand booted; clock at 2026-09-01T06:00:00Z."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
          trigger:
            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T05:00:00Z", ends_at: "2026-09-01T07:00:00Z", is_peak: false }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIFT_IN_PAST (422)"

  # ===========================================================================
  - section: rbac
