      - name: hold_on_a_sector_at_hold_posture_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_SECTOR_CAPACITY_HOLD
          - calculations.sector_capacity_posture
        distinguishing_aspect: |
          Posture is evaluated at reservation time, not at qualification time: SR_EARLY was qualified
          while the sector was OPEN, and a single 150 Mbps hold then lifts the ratio to 6.000 (exactly
          0.75 * 8.0), so the older request can no longer be reserved. The refusal is
          ERR_SECTOR_CAPACITY_HOLD and not ERR_INSUFFICIENT_SECTOR_CAPACITY even though 50 Mbps of
          allowance is still free - posture outranks headroom inside the same priority band.
        test_recipe:
          setup:
            - "ACTIVE Tower / ACTIVE Sector (capacity_mbps 25, max_oversubscription_ratio 8.0, allowance 200) with plans STD50 (50 Mbps) and GIG150 (150 Mbps)."
            - "SR_EARLY on STD50 is created first and qualifies while the sector is OPEN; SR_GIG on GIG150 is created next and also qualifies; a hold is then placed for SR_GIG, taking committed_mbps to 150 and capacity_posture to HOLD."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
