            - { call: "POST /notices", payload: { termination_case_id: "${c_re}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_re_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_re}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "GET /participants/${p_re}", payload: {}, as: PlanAdministrator, captures: { p_re_v: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_re}", election_method: LUMP_SUM_CHECK, expected_participant_version: "${p_re_v}" }, as: PlanAdministrator, captures: { e_re1: "$.data.id" } }
          trigger:
            - { call: "POST /distribution-elections/${e_re1}/reject", payload: { reason: "Illegible rollover instructions." }, as: PlanAdministrator }
            - { call: "GET /participants/${p_re}", payload: {}, as: PlanAdministrator, captures: { p_re_v2: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_re}", election_method: DIRECT_ROLLOVER_IRA, expected_participant_version: "${p_re_v2}" }, as: PlanAdministrator, captures: { e_re2: "$.data.id" } }
