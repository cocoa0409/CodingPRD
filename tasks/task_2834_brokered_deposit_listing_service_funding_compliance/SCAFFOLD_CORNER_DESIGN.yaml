            - "SUBMIT returns 200 with status == ACKNOWLEDGED (filing_type == NOTICE, test_outcome == QUALIFIED) and reporting_due_date re-based to \"2026-10-30\""
            - "third trigger: HTTP 200 with status == REVOKED and reporting_due_date == null"
            - "no program cascade fires: reliant_program_count was already 0, so hops 2-4 of the REVOKE cascade have an empty working set"

  - section: errors
    instances:
      - name: corner_missing_or_undeclared_headers_return_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1 ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 outranks every other rule, so a request with no X-User-ID / X-User-Role headers - or with a role string outside the six declared roles - is a 401 even when the addressed id does not exist and would otherwise be a 404."
        test_recipe:
          setup:
            - "One institution exists. The first and third trigger calls are sent with BOTH auth headers omitted; the second carries X-User-ID: op_x and the undeclared X-User-Role: Auditor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Auth Bank NA", cert_id: "CERT-9064", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "GET /institutions/${inst_id}"
              captures: { e1: $.data.error_id }
            - call: "GET /institutions/${inst_id}"
              as: Auditor
              captures: { e2: $.data.error_id }
            - call: "GET /institutions/00000000-0000-0000-0000-0000000000ee"
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 - both headers were omitted"
            - "${e2} == ERR_UNAUTHENTICATED with HTTP 401 - Auditor is not one of the six declared roles, so it fails authentication before any authorization check"
            - "${e3} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_INSTITUTION_NOT_FOUND - priority 1 beats priority 4"
            - "every error body carries data.error_id and data.message plus the standard meta.api_request_id / meta.api_request_timestamp envelope"

      - name: corner_remaining_typed_not_found_codes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_EXCEPTION_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_CLASSIFICATION_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: "Each aggregate root owns its own 404 code, so five unknown ids on five different routes must return five distinct error_ids rather than a shared generic not-found."
        test_recipe:
          setup:
            - "Empty system with the clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /broker-agreements/00000000-0000-0000-0000-000000000101"
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { e1: $.data.error_id }
            - call: "GET /primary-purpose-exceptions/00000000-0000-0000-0000-000000000102"
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { e2: $.data.error_id }
            - call: "GET /deposit-programs/00000000-0000-0000-0000-000000000103"
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { e3: $.data.error_id }
            - call: "GET /deposit-classifications/00000000-0000-0000-0000-000000000104"
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { e4: $.data.error_id }
            - call: "GET /contingency-plans/00000000-0000-0000-0000-000000000105"
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { e5: $.data.error_id }
          assert:
            - "${e1} == ERR_AGREEMENT_NOT_FOUND, ${e2} == ERR_EXCEPTION_NOT_FOUND, ${e3} == ERR_PROGRAM_NOT_FOUND, ${e4} == ERR_CLASSIFICATION_NOT_FOUND, ${e5} == ERR_PLAN_NOT_FOUND"
            - "all five are HTTP 404 with a non-empty data.message"

      - name: corner_malformed_write_payloads_return_invalid_request
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 3 ERR_INVALID_REQUEST]
        distinguishing_aspect: "Shape violations are 400s regardless of business plausibility: an undeclared action member, a report_period outside ^[0-9]{4}Q[1-4]$, a negative *_cents amount and a score above 100 all fail before any state or fiscal rule is consulted."
        test_recipe:
          setup:
            - "One institution, one broker and one PENDING_CLASSIFICATION program so each malformed call addresses a real resource."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Shape Bank NA", cert_id: "CERT-9065", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Shape Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 10000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: null, program_name: "Shape Core Program", funding_channel_claim: "CORE", product_type: "SAVINGS", tenor_days: 0, offered_rate_bps: 100, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
