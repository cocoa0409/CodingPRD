            - "the same verify call as AccountAdmin of the owning account returns HTTP 403 ERR_ROLE_NOT_PERMITTED"

      - name: only_the_security_analyst_may_apply_a_calling_restriction_returns_403
        claim_type: peer_roles
        grounds:
          - rbac.SecurityAnalyst.exclusive_operations
          - endpoints[POST /voip/devices/{id}/calling-restrictions]
        distinguishing_aspect: "The account's own administrator - who may place calls from the device - cannot restrict it: BLOCK_INTL as AccountAdmin is ERR_ROLE_NOT_PERMITTED (403) while the identical body as SecurityAnalyst moves calling_status UNRESTRICTED -> INTL_BLOCKED."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; a device holding number 4501 with a VERIFIED registration"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1045", billing_name: "VETCH SA", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
