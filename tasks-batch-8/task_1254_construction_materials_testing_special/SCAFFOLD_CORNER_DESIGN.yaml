              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-04-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${t1}"
              captures: {s1: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
