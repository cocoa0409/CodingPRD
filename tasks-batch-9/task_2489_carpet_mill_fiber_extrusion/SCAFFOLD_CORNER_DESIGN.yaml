        grounds:
          - validations[priority 20]
          - errors[ERR_SHADE_BAND_MISMATCH]
          - entities.CutOrder.fields.shade_tolerance
        distinguishing_aspect: |
          Both approved lots land in band A, so a BAND_MATCH order would take either; under
          SINGLE_LOT the comparison is on dye_lot_id, so the second line is refused while a further
