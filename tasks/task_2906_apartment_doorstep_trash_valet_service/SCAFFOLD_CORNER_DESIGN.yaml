          rationale: "That §1.8 instance pins coverage_bps exactly on the threshold and asserts VERIFIED rather than PARTIAL."

  - section: validations
    instances:

      - name: resident_unit_number_above_the_property_range_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_UNIT_RANGE_OUT_OF_BOUNDS]
          - entities.Property.fields.unit_count
        distinguishing_aspect: "unit_count 4 means the closed unit range is [101, 104], so unit 105 is rejected with HTTP 422 ERR_UNIT_RANGE_OUT_OF_BOUNDS — the range is derived from unit_count, not stored."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' with unit_count 4 and no residents"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 105, full_name: "Rue Five", move_in_date: "2026-08-01" }
              as: PlatformAdmin
          assert:
            - "HTTP 422 with error_id == 'ERR_UNIT_RANGE_OUT_OF_BOUNDS'"
            - "no Resident row exists for Property ${prop_id}: GET /valet/residents?property_id=${prop_id} returns total_count 0"

      - name: resident_unit_number_at_the_upper_bound_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=19]
          - entities.Property.fields.unit_count
        distinguishing_aspect: "unit 104 with unit_count 4 is the inclusive upper bound and must be accepted with HTTP 201 — the same rule that rejects 105 must not reject 104."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' with unit_count 4 and no residents"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 104, full_name: "Rio Four", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { r4_id: $.data.id }
          assert:
            - "HTTP 201 with Resident.${r4_id}.unit_number == 104, status == 'ACTIVE', collections_status == 'CURRENT'"
            - "Resident.${r4_id}.fines_outstanding_cents == 0 and fines_assessed_this_period_cents == 0"

      - name: route_range_overlapping_a_live_route_returns_range_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_UNIT_RANGE_OVERLAP]
          - entities.RouteAssignment.fields.unit_from
        distinguishing_aspect: "Ranges are closed, so a second route over [102, 104] intersects the existing ASSIGNED [101, 102] at unit 102 and returns HTTP 409 ERR_UNIT_RANGE_OVERLAP; the second route is given to a different contractor so the lower-priority window-conflict rule cannot mask this one."
