      - name: logical_clock_default_is_2026_05_01_on_a_fresh_server
        claim_type: conditional_action
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.SOW.DRAFT_to_COUNTERSIGNED
          - state_machines.SOW.COUNTERSIGNED_to_EXPIRED
        distinguishing_aspect: |
          On a fresh server the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to
          wall-clock time: with NO set_current_utc call, countersigning a SOW whose effective_end is
          2026-05-01 fails with ERR_SOW_EXPIRED (now >= effective_end) while a SOW ending 2026-05-02
          countersigns successfully — bracketing the default to that exact instant.
        test_recipe:
          setup:
            - "Fresh server; the clock endpoint is never called."
            - "SOW_A: effective_start 2026-04-01, effective_end 2026-05-01, DRAFT."
            - "SOW_B: effective_start 2026-04-01, effective_end 2026-05-02, DRAFT."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
