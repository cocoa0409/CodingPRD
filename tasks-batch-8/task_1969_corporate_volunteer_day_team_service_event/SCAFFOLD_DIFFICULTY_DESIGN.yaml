  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_approve_cancel_conservation
        grounds:
          - calculations.event_spend_position
          - state_machines.ProcurementOrder.SUBMITTED_to_APPROVED
          - state_machines.ProcurementOrder.APPROVED_to_CANCELLED
          - entities.ServiceEvent.fields.available_budget_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY: the forward action (approve order of 4393) paired with its
          compensating action (cancel) must restore available_budget_cents to exactly
          budget_cents (100000) with projected_spend_cents == committed_spend_cents == 0 —
          pinned by available_budget_cents = budget_cents - projected_spend_cents.
        test_recipe:
          setup:
            - "Project MATCHED to event (budget 100000); order total 4393 in DRAFT"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Park Build", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day Q", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 100000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Lumber", quantity: 3, unit_cost_cents: 999 }, { item_name: "Screws", quantity: 7, unit_cost_cents: 149 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
          trigger:
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { proj_after_submit: $.data.projected_spend_cents, avail_after_submit: $.data.available_budget_cents } }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { comm_after_approve: $.data.committed_spend_cents } }
            - { call: "POST /procurement-orders/${ord1}/cancel", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { proj_final: $.data.projected_spend_cents, comm_final: $.data.committed_spend_cents, avail_final: $.data.available_budget_cents, budget_final: $.data.budget_cents } }
          assert:
            - "after submit: projected_spend_cents == 4393 and available_budget_cents == 95607 (100000 - 4393), committed still 0"
            - "after approve: committed_spend_cents == 4393"
            - "after cancel (compensating action): projected_spend_cents == 0, committed_spend_cents == 0, available_budget_cents == 100000 == budget_cents"
            - "invariant budget_cents - projected_spend_cents - available_budget_cents == 0 holds at every step"

      - name: headcount_confirm_cancel_conservation
        grounds:
          - calculations.supervision_requirement
          - state_machines.Registration.REGISTERED_to_CONFIRMED
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - entities.ServiceProject.fields.confirmed_volunteer_count
        distinguishing_aspect: |
          Conserved quantity = PEOPLE (a different quantity from money): confirm then cancel of
          the same registration must return project.confirmed_volunteer_count,
          project.required_staff_leads, and event.confirmed_headcount to their pre-confirm
          values (0, 0, 0) with no drift.
        test_recipe:
          setup:
            - "Project (min 1, max 10) MATCHED to OPEN event; one adult REGISTERED with SIGNED waiver"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day R", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
          trigger:
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /service-projects/${proj1}", payload: {}, as: Any, captures: { count_mid: $.data.confirmed_volunteer_count, req_mid: $.data.required_staff_leads } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_conf_mid: $.data.confirmed_headcount } }
            - { call: "POST /registrations/${reg1}/cancel", payload: {}, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "GET /service-projects/${proj1}", payload: {}, as: Any, captures: { count_end: $.data.confirmed_volunteer_count, req_end: $.data.required_staff_leads } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_conf_end: $.data.confirmed_headcount } }
          assert:
            - "after confirm: confirmed_volunteer_count == 1, required_staff_leads == 1 (ceil(1/8)), event.confirmed_headcount == 1"
            - "after cancel (compensation): confirmed_volunteer_count == 0, required_staff_leads == 0, event.confirmed_headcount == 0"
            - "no drift: all three counters exactly equal their pre-confirm values"

