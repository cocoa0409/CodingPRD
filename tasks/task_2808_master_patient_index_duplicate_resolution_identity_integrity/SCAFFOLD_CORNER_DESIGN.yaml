          - state_machines.MergeOperation
        distinguishing_aspect: "The same merge action produces two different lifecycles depending only on the consumer's ack_required flag: with false the task is minted ACKED and the merge is COMPLETED in-request with a reversal deadline, with true the task is QUEUED and the merge stays PENDING_PROPAGATION with completed_at null."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite CD-SITE and one MatchRuleSet RS-BASE."
            - "One ACTIVE DownstreamSystem CD-FIRE (BATCH, ack_required false, max_concurrent_dispatch 1)."
            - "Four PatientRecord rows forming two independent duplicate couples that share no attribute across couples: CD-1000/CD-2000 and CD-3000/CD-4000, each couple identical on all seven scored attributes."
            - "Couple A is paired and merged while CD-FIRE is the only ACTIVE system."
            - "CD-FIRE is then PAUSED and a second system CD-ACK (BATCH, ack_required true, max_concurrent_dispatch 1) is created, so couple B's merge sees exactly one ACTIVE, ack-requiring consumer."
