        distinguishing_aspect: "Scheduling a window for a vessel whose draft_m=18.0 exceeds the berth's draft_m=16.0 (but fits length) -> ERR_BERTH_DRAFT_EXCEEDED (409); draft safety precedes length and clash."
        test_recipe:
          setup: ["A berth with draft_m=16.0, length_m=400; a vessel with draft_m=18.0, loa_m=300."]
          setup_api_calls:
