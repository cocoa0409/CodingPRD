            - *PRODA1
            - *EXCADJ1
            - call: "POST /pricing-exceptions/${e1}/decision"
              payload: { decision: "APPROVE", decision_reason: "First promo leg approved" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - *EXCADJ2
            - call: "POST /pricing-exceptions/${e2}/decision"
              payload: { decision: "REJECT", decision_reason: "Second leg not funded" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 13500, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { e3: $.data.id }
          assert:
            - "HTTP 201"
            - "PricingException.${e1}.status == APPROVED"
            - "PricingException.${e2}.status == REJECTED"
            - "PricingException.${e3}.status == REQUESTED"
            - "Product.${prod}.open_exception_count == 1"

  # ===========================================================================
  # SECTION 4 — validations  (§1.4, 13 ordered priorities)
  # ===========================================================================
  - section: validations
    instances:

      # --- priority 1: auth -------------------------------------------------
      - name: policy_create_without_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "Priority 1 fires before anything else: an otherwise perfectly formed policy creation with no X-User-Role / X-User-ID headers is 401 ERR_UNAUTHENTICATED, not 403 and not 400."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01; the request carries a valid body but omits both authentication headers."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "${err} == 'ERR_UNAUTHENTICATED'"
            - "GET /pricing-policies returns 0 rows"

      - name: unknown_role_value_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "Priority 1 also guards the header VALUE: a role string outside the six declared roles is 401 ERR_UNAUTHENTICATED rather than 403 ERR_ROLE_NOT_PERMITTED, which is reserved for real roles on the wrong endpoint."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01; the caller presents X-User-Role BrandAuditor, which is not one of the six declared roles."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandAuditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "${err} == 'ERR_UNAUTHENTICATED'"

      # --- priority 2: role -------------------------------------------------
      - name: monitoring_analyst_creating_a_policy_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]"]
        distinguishing_aspect: "POST /pricing-policies lists only BrandChannelManager, so an authenticated MonitoringAnalyst is 403 ERR_ROLE_NOT_PERMITTED and no DRAFT row is created."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /pricing-policies returns 0 rows"

      - name: role_check_precedes_path_existence_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "A forbidden role acting on a non-existent policy id yields 403 ERR_ROLE_NOT_PERMITTED, proving priority 2 is evaluated before the priority 4 existence sweep leaks resource information."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01; no PricingPolicy rows exist."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies/00000000-0000-0000-0000-0000000000ff/submit-review"
              payload: {}
              as: Reseller
              as_user_id: "res-ghost"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_ROLE_NOT_PERMITTED'"

      # --- priority 3: request schema --------------------------------------
      - name: product_create_missing_standard_floor_rejected

        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "standard_map_floor_cents carries no `?` in the §1.5 input list, so omitting it is 400 ERR_VALIDATION rather than a silent default."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED at clock 2026-08-01."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "GET /products returns 0 rows"

      - name: observation_with_unknown_channel_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "Enum membership is a priority 3 schema concern: TELEVISION is not a declared channel, so the observation is 400 ERR_VALIDATION before any policy lookup or floor computation."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 created; clock 2026-08-20."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "TELEVISION", seller_display_name: "GreyBox Deals", listing_url: "https://tv.example/l/1", listed_price_cents: 14000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "GET /price-observations returns 0 rows"

      - name: observation_with_uppercase_evidence_hash_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "evidence_hash must be 64 LOWERCASE hex characters: a correctly-sized but uppercase digest is 400 ERR_VALIDATION, so case is part of the format rule and not merely cosmetic."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 created; clock 2026-08-20."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/l/1", listed_price_cents: 14000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1A2B3C4D5E6F7A8B9C0D1E2F3A4B5C6D7E8F9A0B1C2D3E4F5A6B7C8D9E0F1A2B" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"

      - name: agreement_with_repeated_permitted_channel_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "permitted_channels members must be distinct: ['MARKETPLACE', 'MARKETPLACE'] is 400 ERR_VALIDATION even though every member is individually a legal enum value."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; reseller Acme in APPLIED / HOLD."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
          trigger:
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${res}", policy_id: "${pol}", permitted_channels: ["MARKETPLACE", "MARKETPLACE"], quality_obligations: ["AUTHENTICITY_LABELING"], term_ends_at: "2027-06-30T00:00:00Z" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "GET /reseller-agreements returns 0 rows"

      - name: bundle_observation_with_one_component_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "bundle_components must hold at least two members when is_bundle is true, so a single-member bundle is 400 ERR_VALIDATION and the waterfall allocation is never attempted."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 created; clock 2026-08-20."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/b/1", listed_price_cents: 10000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", is_bundle: true, bundle_total_price_cents: 10000, bundle_components: [{ sku: "SKU-AUDIO-1", msrp_cents: 20000 }] }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"

      - name: policy_with_cure_window_zero_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "cure_window_days is constrained to 1..60, so an explicit 0 is 400 ERR_VALIDATION rather than falling back to the declared default of 10."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A", cure_window_days: 0 }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "GET /pricing-policies returns 0 rows"

      - name: chargeback_with_zero_diverted_units_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "diverted_units >= 1 is enforced at priority 3, so 0 units is 400 ERR_VALIDATION and never reaches the priority 13 cap arithmetic that would trivially pass with a 0 amount."
        test_recipe:
          setup: ["Distributor Northwind with cap 500000; one CONFIRMED_UNAUTHORIZED test purchase."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - *TPCAP1
            - *TPCONF1
            - *GETDISTV
          trigger:
            - call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${dist}", test_purchase_id: "${tp}", diverted_units: 0, expected_distributor_version: "${dv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "Distributor.${dist}.chargeback_balance_cents == 0"

      - name: suspension_window_longer_than_ninety_days_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "The 90-day suspension duration ceiling lives at priority 3, not among the temporal rules: a window of [2026-09-01, 2026-12-15] is 400 ERR_VALIDATION rather than 409/422."
        test_recipe:
          setup: ["Reseller Acme at 3 assessed points behind a WARNING notice; violation V2 DETECTED at 11 points; the requested SUSPENSION window spans 105 days."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio2}", delivery_channel: "EMAIL", rung: "SUSPENSION", suspension_starts_at: "2026-09-01T00:00:00Z", suspension_ends_at: "2026-12-15T00:00:00Z", expected_reseller_version: "${rv2}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "Reseller.${res}.authorization_status == AUTHORIZED"

      - name: suspension_window_of_exactly_ninety_days_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "The ceiling is inclusive: [2026-09-01, 2026-11-30] is exactly 90 days and issues cleanly, so the boundary sits between 90 and 91 rather than at 89."
        test_recipe:
          setup: ["Reseller Acme at 3 assessed points behind a WARNING notice; violation V2 DETECTED at 11 points; the requested SUSPENSION window is exactly 90 days."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio2}", delivery_channel: "EMAIL", rung: "SUSPENSION", suspension_starts_at: "2026-09-01T00:00:00Z", suspension_ends_at: "2026-11-30T00:00:00Z", expected_reseller_version: "${rv2}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { n90: $.data.id }
          assert:
            - "HTTP 201"
            - "EnforcementNotice.${n90}.rung == SUSPENSION"
            - "EnforcementNotice.${n90}.suspension_ends_at == '2026-11-30T00:00:00Z'"
            - "Reseller.${res}.authorization_status == SUSPENDED"
            - "Reseller.${res}.suspension_ends_at == '2026-11-30T00:00:00Z'"

      - name: schema_check_precedes_path_existence_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "A cure submission missing evidence_hash against a non-existent violation id returns 400 ERR_VALIDATION, so the priority 3 body schema check runs before the priority 4 path lookup."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED; no Violation rows exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
          trigger:
            - call: "POST /violations/00000000-0000-0000-0000-0000000000ff/cure-submission"
              payload: { cure_evidence_url: "https://acme.example/proof/x", corrected_price_cents: 15000 }
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"

      # --- priority 4: path existence ---------------------------------------
      - name: submit_review_on_unknown_policy_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "A well-formed transition call against an absent policy id is 404 ERR_POLICY_NOT_FOUND, the PricingPolicy member of the twelve declared existence errors."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01; no PricingPolicy rows exist."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies/00000000-0000-0000-0000-0000000000ff/submit-review"
              payload: {}
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_POLICY_NOT_FOUND'"

      - name: acknowledge_unknown_notice_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "ERR_NOTICE_NOT_FOUND is raised at priority 4 before the priority 6 ownership check, so an unrelated reseller sees 404 rather than 403 for a notice that does not exist."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED; no EnforcementNotice rows exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
          trigger:
            - call: "POST /enforcement-notices/00000000-0000-0000-0000-0000000000ff/acknowledge"
              payload: {}
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_NOTICE_NOT_FOUND'"

      - name: path_existence_precedes_body_fk_existence_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "Both the path serial unit and the body downstream_reseller_id are bogus, and the answer is ERR_SERIAL_UNIT_NOT_FOUND: priority 4 path resolution strictly precedes the priority 5 body FK sweep."
        test_recipe:
          setup: ["Distributor Northwind exists; no SerialUnit and no Reseller rows exist."]
          setup_api_calls:
            - *CLK0801
            - *DISTNW
          trigger:
            - call: "POST /serial-units/00000000-0000-0000-0000-0000000000ff/ship-downstream"
              payload: { downstream_reseller_id: "00000000-0000-0000-0000-0000000000ee" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_SERIAL_UNIT_NOT_FOUND'"

      # --- priority 5: body foreign keys ------------------------------------
      - name: observation_for_unknown_product_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]"]
        distinguishing_aspect: "product_id is the first FK in the §1.5 input list for POST /price-observations, so an unknown product yields 404 ERR_PRODUCT_NOT_FOUND before matched_reseller_id is even examined."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; clock 2026-08-20; no Product rows exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "00000000-0000-0000-0000-0000000000ff", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/l/1", listed_price_cents: 14000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "00000000-0000-0000-0000-0000000000ee" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_PRODUCT_NOT_FOUND'"

      - name: serial_capture_of_unregistered_serial_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]"]
        distinguishing_aspect: "serial_number is a body FK expressed as a natural key, so a digit-string that was never registered is 404 ERR_SERIAL_NOT_REGISTERED — distinct from ERR_SERIAL_UNIT_NOT_FOUND, which covers opaque path ids."
        test_recipe:
          setup: ["Distributor Northwind; serial SN-0001 registered; a test purchase in ORDERED against a grey listing; the captured serial reads SN-9999."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
            - *CLK0820
            - *OBSGREY
            - *TPNEW
          trigger:
            - call: "POST /test-purchases/${tp}/serial-capture"
              payload: { serial_number: "SN-9999" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_SERIAL_NOT_REGISTERED'"
            - "TestPurchase.${tp}.status == ORDERED"
            - "TestPurchase.${tp}.traced_serial_unit_id == null"

      - name: notice_body_fks_are_checked_in_input_order_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=5]"]
        distinguishing_aspect: "With BOTH reseller_id and violation_id unknown the response is ERR_RESELLER_NOT_FOUND, because reseller_id precedes violation_id in the §1.5 input list for POST /enforcement-notices."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; reseller Acme exists only as a source of a fresh version token; no Violation rows exist; both FKs in the request body are unknown ids."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *GETRESV
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "00000000-0000-0000-0000-0000000000ff", violation_id: "00000000-0000-0000-0000-0000000000ee", delivery_channel: "EMAIL", expected_reseller_version: "${rv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_RESELLER_NOT_FOUND'"

      # --- priority 6: ownership -------------------------------------------
      - name: reseller_acknowledging_another_resellers_notice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]"]
        distinguishing_aspect: "Reseller is an entity-backed role: Bravo presents a legal Reseller role on an existing notice and still gets 403 ERR_NOT_RESOURCE_OWNER because the notice's reseller_id is Acme."
        test_recipe:
          setup: ["Acme holds an ISSUED WARNING notice; a second reseller Bravo is separately AUTHORIZED."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *RESBRAVO
            - *AGRBRAVO
            - *AGRBRAVOSEND
            - *AGRBRAVOSIGN
            - *AGRBRAVOACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
            - call: "POST /enforcement-notices/${not1}/acknowledge"
              payload: {}
              as: Reseller
              as_user_id: "${res2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_NOT_RESOURCE_OWNER'"
            - "EnforcementNotice.${not1}.status == ISSUED"
            - "EnforcementNotice.${not1}.acknowledged_at == null"

      - name: owning_reseller_acknowledging_its_own_notice_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=6]"]
        distinguishing_aspect: "The same call from the owning reseller passes priority 6 and completes the ISSUED -> ACKNOWLEDGED transition, showing the check compares X-User-ID to the row's owning FK rather than rejecting the role outright."
        test_recipe:
          setup: ["Acme holds an ISSUED WARNING notice."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
            - *ACK1
          assert:
            - "HTTP 200"
            - "EnforcementNotice.${not1}.status == ACKNOWLEDGED"
            - "EnforcementNotice.${not1}.acknowledged_at == '2026-08-20T00:00:00Z'"

      - name: distributor_shipping_another_distributors_unit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]"]
        distinguishing_aspect: "Distributor ownership is enforced on serial units too: Southpaw cannot ship a unit whose shipped_distributor_id is Northwind, giving 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Northwind shipped SN-0002; Southpaw exists; reseller Acme is AUTHORIZED with supply_status OPEN."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *DISTNW
            - *DIST2
            - *SU0002
          trigger:
            - call: "POST /serial-units/${su2}/ship-downstream"
              payload: { downstream_reseller_id: "${res}" }
              as: Distributor
              as_user_id: "${dist2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_NOT_RESOURCE_OWNER'"
            - "SerialUnit.${su2}.status == SHIPPED_TO_DISTRIBUTOR"
            - "SerialUnit.${su2}.downstream_reseller_id == null"

      # --- priority 7: state -----------------------------------------------
      - name: submit_review_twice_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "ERR_INVALID_STATE is the generic priority 7 code: IN_LEGAL_REVIEW has no declared submit-review transition, so the second call is 409 and revision_number is untouched."
        test_recipe:
          setup: ["Policy MAP-2026-A in IN_LEGAL_REVIEW."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
          trigger:
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_INVALID_STATE'"
            - "PricingPolicy.${pol}.status == IN_LEGAL_REVIEW"
            - "PricingPolicy.${pol}.revision_number == 1"

      - name: evaluating_an_observation_twice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "The specialised code ERR_ALREADY_EVALUATED — not ERR_INVALID_STATE — is returned when evaluation_status has already left CAPTURED, and no second Violation row is minted."
        test_recipe:
          setup: ["A 14000 MARKETPLACE observation matched to Acme has already been evaluated into a DETECTED violation."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
          trigger:
            - call: "POST /price-observations/${obs}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_ALREADY_EVALUATED'"
            - "PriceObservation.${obs}.status == EVALUATED_BREACH"
            - "GET /violations?reseller_id=${res} returns 1 row"

      - name: issuing_a_second_notice_for_a_noticed_violation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "Notice issuance requires violation.status == DETECTED, so a violation already NOTICED yields ERR_VIOLATION_NOTICEABLE's negative form ERR_VIOLATION_NOT_NOTICEABLE at 409 and the points ledger stays at 3."
        test_recipe:
          setup: ["Violation V1 is NOTICED behind an ISSUED WARNING notice; Acme's version has been re-read."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *GETRESV3
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", expected_reseller_version: "${rv3}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_VIOLATION_NOT_NOTICEABLE'"
            - "Violation.${vio}.status == NOTICED"
            - "Reseller.${res}.violation_points_total == 3"

      - name: issuing_a_notice_against_a_terminated_reseller_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "ERR_RESELLER_TERMINATED is a dedicated priority 7 code keyed on the notice's SUBJECT rather than on the violation: the reseller is in the terminal TERMINATED / CUT_OFF state, so no further rung exists."
        test_recipe:
          setup: ["Acme is TERMINATED after the three-rung ladder; a fresh RETAILER_SITE observation for the same reseller has been evaluated into a violation."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
            - *NOTICE3TERM
            - *OBS12000D
            - *OBSEVAL4
            - *GETRESVX
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio4}", delivery_channel: "EMAIL", expected_reseller_version: "${rvx}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_RESELLER_TERMINATED'"
            - "Reseller.${res}.authorization_status == TERMINATED"
            - "GET /enforcement-notices?reseller_id=${res} returns 3 rows"

      - name: rescinding_a_termination_notice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "The {ISSUED, ACKNOWLEDGED} -> RESCINDED transition carries the precondition rung != TERMINATION, and the violation is ERR_TERMINATION_NOT_RESCINDABLE rather than the generic ERR_INVALID_STATE, since the notice IS in a rescindable status."
        test_recipe:
          setup: ["Acme holds an ISSUED TERMINATION notice at the top of the ladder."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
            - *NOTICE3TERM
          trigger:
            - call: "POST /enforcement-notices/${not3}/rescind"
              payload: { rescinded_reason: "Reconsidered after counsel review" }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_TERMINATION_NOT_RESCINDABLE'"
            - "EnforcementNotice.${not3}.status == ISSUED"
            - "Reseller.${res}.authorization_status == TERMINATED"

      - name: reopening_supply_for_a_suspended_reseller_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "HOLD -> OPEN is declared, but only for QUALITY_OBLIGATION and AGREEMENT_EXPIRED holds: a SUSPENSION hold gives ERR_SUPPLY_BLOCKED_BY_AUTHORIZATION, keeping the two parallel tracks from being unlocked independently."
        test_recipe:
          setup: ["Acme is SUSPENDED with supply_status HOLD and hold_reason SUSPENSION after a SUSPENSION notice."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
          trigger:
            - call: "POST /resellers/${res}/supply-status"
              payload: { supply_status: "OPEN", note: "Buyer requests restock" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_SUPPLY_BLOCKED_BY_AUTHORIZATION'"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == SUSPENSION"

      # --- priority 8: optimistic concurrency -------------------------------
      - name: notice_with_stale_reseller_version_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "concurrency_rules.notice-issue-stale-reseller"]
        distinguishing_aspect: "expected_reseller_version is read once and then invalidated by an intervening supply-status change, so issuance is 412 ERR_STALE_RESELLER_VERSION and the violation stays DETECTED."
        test_recipe:
          setup: ["Violation V1 DETECTED at 3 points; Acme's version captured; a supply-status HOLD then bumps Acme's version."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *SUPPLYHOLD
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", expected_reseller_version: "${rv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "${err} == 'ERR_STALE_RESELLER_VERSION'"
            - "Violation.${vio}.status == DETECTED"
            - "Violation.${vio}.assessed_points == null"
            - "Reseller.${res}.violation_points_total == 0"

      - name: chargeback_with_stale_distributor_version_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "concurrency_rules.chargeback-create-stale-distributor"]
        distinguishing_aspect: "The second chargeback replays the version captured before the first one landed, so it is 412 ERR_STALE_DISTRIBUTOR_VERSION and the balance stays at the single 10000 assessment."
        test_recipe:
          setup: ["Distributor Northwind with cap 500000; two CONFIRMED_UNAUTHORIZED test purchases; the distributor version was captured once, before the first chargeback."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
            - *SU0003
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - *TPCAP1
            - *TPCONF1
            - *OBSGREY2
            - *TP2NEW
            - *TP2CAP
            - *TP2CONF
            - *GETDISTV
            - *CB4U
          trigger:
            - call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${dist}", test_purchase_id: "${tp2}", diverted_units: 2, expected_distributor_version: "${dv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "${err} == 'ERR_STALE_DISTRIBUTOR_VERSION'"
            - "Distributor.${dist}.chargeback_balance_cents == 10000"
            - "Distributor.${dist}.diversion_score == 10.0"
            - "GET /distributor-chargebacks?distributor_id=${dist} returns 1 row"

      - name: state_check_precedes_occ_check_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=8]"]
        distinguishing_aspect: "A notice for an already-NOTICED violation carrying a deliberately stale version returns 409 ERR_VIOLATION_NOT_NOTICEABLE, so priority 7 wins over priority 8 when both are violated."
        test_recipe:
          setup: ["Violation V1 already NOTICED; expected_reseller_version deliberately replays the pre-notice value."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", expected_reseller_version: "${rv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_VIOLATION_NOT_NOTICEABLE'"
            - "GET /enforcement-notices?reseller_id=${res} returns 1 row"

      - name: occ_check_precedes_antitrust_check_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=9]"]
        distinguishing_aspect: "A stale version combined with contains_pricing_discussion true returns 412 ERR_STALE_RESELLER_VERSION, placing the OCC gate ahead of the antitrust guardrail that would otherwise be 422."
        test_recipe:
          setup: ["Violation V1 DETECTED; Acme's version captured and then invalidated by a supply-status HOLD; the request also carries contains_pricing_discussion true."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *SUPPLYHOLD
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", contains_pricing_discussion: true, expected_reseller_version: "${rv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "${err} == 'ERR_STALE_RESELLER_VERSION'"
            - "Violation.${vio}.status == DETECTED"

      # --- priority 9: antitrust safety ------------------------------------
      - name: agreement_carrying_price_terms_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "price_terms_included true is refused at agreement creation with 422 ERR_ANTITRUST_PRICE_TERM_IN_AGREEMENT, so no DRAFT agreement is ever persisted with a resale price term."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; reseller Acme in APPLIED / HOLD."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
          trigger:
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${res}", policy_id: "${pol}", permitted_channels: ["MARKETPLACE"], quality_obligations: ["AUTHENTICITY_LABELING"], term_ends_at: "2027-06-30T00:00:00Z", price_terms_included: true }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_ANTITRUST_PRICE_TERM_IN_AGREEMENT'"
            - "GET /reseller-agreements returns 0 rows"
            - "Reseller.${res}.authorization_status == APPLIED"

      - name: countersignature_with_a_counter_price_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "A COUNTERSIGN decision may not carry counter_price_proposal_cents: 422 ERR_ANTITRUST_NEGOTIATION_PROHIBITED, and the agreement stays SENT rather than moving to DECLINED."
        test_recipe:
          setup: ["Agreement for Acme in SENT; Acme replies COUNTERSIGN while proposing a 14000 resale price."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
          trigger:
            - call: "POST /reseller-agreements/${agr}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true, counter_price_proposal_cents: 14000 }
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_ANTITRUST_NEGOTIATION_PROHIBITED'"
            - "ResellerAgreement.${agr}.status == SENT"
            - "Reseller.${res}.authorization_status == PENDING_AGREEMENT"

      - name: exception_sourced_from_a_reseller_price_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "dealer_input_source == RESELLER_PRICING_REQUEST is refused at exception creation with 422 ERR_ANTITRUST_DEALER_PRICE_INPUT, keeping reseller-originated price input out of the exception record entirely."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 created."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 13000, dealer_input_source: "RESELLER_PRICING_REQUEST" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_ANTITRUST_DEALER_PRICE_INPUT'"
            - "GET /pricing-exceptions returns 0 rows"
            - "Product.${prod}.open_exception_count == 0"

      - name: antitrust_check_precedes_referential_check_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=10]"]
        distinguishing_aspect: "A countersignature that both proposes a price AND omits the required non-negotiation acknowledgement returns ERR_ANTITRUST_NEGOTIATION_PROHIBITED, confirming the guardrail is 'checked before every other business rule'."
        test_recipe:
          setup: ["Agreement for Acme in SENT under a policy with non_negotiation_ack_required true; the reply omits non_negotiation_acknowledged and carries a counter price."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
          trigger:
            - call: "POST /reseller-agreements/${agr}/respond"
              payload: { decision: "COUNTERSIGN", counter_price_proposal_cents: 14000 }
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_ANTITRUST_NEGOTIATION_PROHIBITED'"
            - "ResellerAgreement.${agr}.status == SENT"

      # --- priority 10: referential preconditions ---------------------------
      - name: product_under_a_draft_policy_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "A product's governing policy must be PUBLISHED at creation time, so pointing at a DRAFT policy is ERR_POLICY_NOT_PUBLISHED rather than ERR_POLICY_NOT_FOUND."
        test_recipe:
          setup: ["Policy MAP-2026-A exists but is still in DRAFT."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_POLICY_NOT_PUBLISHED'"
            - "PricingPolicy.${pol}.status == DRAFT"
            - "GET /products returns 0 rows"

      - name: notice_citing_a_superseded_policy_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "The cited policy must still be PUBLISHED at ISSUANCE time even though it was published when the listing was seen: republishing under the same policy_code between evaluation and issuance turns the notice into ERR_POLICY_NOT_PUBLISHED."
        test_recipe:
          setup: ["Violation V1 DETECTED citing P1; a second policy sharing policy_code MAP-2026-A is then published effective 2026-08-21, leaving P1 SUPERSEDED."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *POL2NEW
            - *POL2SUB
            - *POL2DEC
            - &POL2PUBLATE
              call: "POST /pricing-policies/${pol2}/publish"
              payload: { effective_from: "2026-08-21T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - *GETRESV3
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", expected_reseller_version: "${rv3}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_POLICY_NOT_PUBLISHED'"
            - "Violation.${vio}.cited_policy_id == ${pol}"
