          The assessment endpoint's branch is chosen by impact_level and NOT by the decision:
          an ACCEPT carrying impact_level HIGH lands in REJECTED_REQUIRES_RECERT exactly as a
          REJECT would. Every declared side effect of that transition must be observable in the
