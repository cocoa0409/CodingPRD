scenario: |
  2765. Medical Professional Liability Underwriting & Claims (medical malpractice insurer):
  physician and facility risk classification by specialty, procedure mix and claim history,
  claims-made versus occurrence policy structure with step factors and tail coverage,
  credentialing, peer review and risk management program participation discounts, claim
  intake, reserve setting and defense counsel assignment from a panel, consent-to-settle
  provisions and physician veto rights, national practitioner data bank reporting
  obligations on payments, verdict, settlement and severity trend analysis by specialty and
  venue, rate filings and reserve adequacy actuarial review

domain_name: medical-professional-liability
api_prefix: "/mpl"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # SpecialtyClass, Insured, Policy, PolicyTerm, Claim, DefenseCounselFirm are peer nodes
  # linked by foreign keys; PolicyTerm.predecessor_term_id is self-referential (claims-made
  # step chain); CounselAssignment is a Claim x DefenseCounselFirm junction; NPDBReport
  # points at three different parents (Claim, SettlementNegotiation, Insured).

  state_machine_shape: cyclic
  # SettlementNegotiation is cyclic (VETOED -> AUTHORITY_REQUESTED via revision);
  # Claim carries two independent dimensions (claim_status x coverage_status);
  # PeerReviewCase is a fork-join (two review tracks converge on the committee vote);
  # PolicyTerm branches IN_FORCE -> {EXPIRED, CANCELLED_FLAT, CANCELLED_PRO_RATA} with
  # divergent side-effect sets; Policy.status is compound (derived from its terms).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The X-User-ID that prepared a SettlementNegotiation may not decide its authority; the
  # X-User-ID that prepared a RateFiling may not APPROVE or REJECT it (WITHDRAW is exempt).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 65 endpoints / 60 error codes / 11 state machines / 15 calculation rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: SpecialtyClass
    parent: null
    common_fields: true
    fields:
      - name: specialty_code
        type: enum
        source: input
        description: rating specialty; unique across SpecialtyClass rows
        constraints: "one of NEUROSURGERY, OBSTETRICS_GYNECOLOGY, ORTHOPEDIC_SURGERY, EMERGENCY_MEDICINE, FAMILY_MEDICINE; unique"
      - name: base_class_code
        type: enum
        source: input
        description: ISO-style hazard class band published in the rate manual
        constraints: "one of CLASS_1, CLASS_2, CLASS_3, CLASS_4, CLASS_5, CLASS_6, CLASS_7, CLASS_8"
      - name: base_rate_per_million
        type: number
        source: input
        description: manual base rate for USD 1,000,000 per-claim limit; mutated by the approved-RateFiling cascade
        constraints: "> 0; 2 decimal places"
      - name: hazard_index
        type: number
        source: input
        description: specialty hazard component fed into insured_risk_classification
        constraints: "1.0 <= hazard_index <= 10.0"
      - name: benchmark_severity
        type: number
        source: input
        description: industry benchmark average paid indemnity for this specialty, denominator of severity_trend_index
        constraints: "> 0; 2 decimal places"
      - name: rate_revision_index
        type: integer
        source: system
        description: increments by 1 each time an approved RateFiling rewrites base_rate_per_million
        default: 0
      - name: last_approved_rate_change_pct
        type: number
        source: computed
        description: approved_rate_change_pct of the most recent APPROVED RateFiling on this class; null before the first approval
        default: null

  - name: Insured
    parent: null
    common_fields: true
    fields:
      - name: entity_type
        type: enum
        source: input
        description: practitioner or institutional insured; drives NPDB reportability
        constraints: "one of PHYSICIAN, FACILITY"
      - name: legal_name
        type: string
        source: input
        description: named insured on the policy
      - name: specialty_class_id
        type: string
        source: input
        description: "FK -> SpecialtyClass.id; rating specialty of this insured"
      - name: venue_code
        type: enum
        source: input
        description: primary litigation venue of the insured
        constraints: "one of COOK_IL, MIAMI_DADE_FL, KINGS_NY, TRAVIS_TX, MARICOPA_AZ"
      - name: high_severity_procedure_pct
        type: number
        source: input
        description: share of the annual procedure mix falling in the high-severity band
        constraints: "0 <= high_severity_procedure_pct <= 100"
      - name: years_in_practice
        type: integer
        source: input
        description: completed years in practice; gates death/disability/retirement tail eligibility
        default: 0
        constraints: ">= 0"
      - name: board_certified
        type: boolean
        source: input
        description: board certification flag captured at underwriting
        default: false
      - name: status
        type: enum
        source: system
        description: underwriting lifecycle state
        default: PROSPECT
        constraints: "one of PROSPECT, ACTIVE, SUSPENDED"
      - name: credentialing_status
        type: enum
        source: system
        description: current credentialing verdict
        default: PENDING
        constraints: "one of PENDING, PROVISIONAL, CREDENTIALED, LAPSED, DENIED"
      - name: credentialing_expires_on
        type: datetime
        source: system
        description: date (YYYY-MM-DD) the current credentialing verdict expires; null while PENDING
        default: null
      - name: risk_class_score
        type: number
        source: computed
        description: insured_risk_classification output under the UNDERWRITING_SNAPSHOT variant, 2 decimal places
        default: 0
      - name: risk_class_code
        type: enum
        source: computed
        description: risk band derived from risk_class_score
        constraints: "one of R1, R2, R3, R4"
      - name: risk_class_factor
        type: number
        source: computed
        description: multiplicative rating factor for risk_class_code
        default: 1.00
      - name: surcharge_pct
        type: number
        source: computed
        description: peer_review_surcharge_pct output; max surcharge over CLOSED PeerReviewCase rows inside the 36-month window
        default: 0
      - name: closed_paid_claim_count
        type: integer
        source: computed
        description: count of Claim rows for this insured with claim_status IN {RESOLVED, CLOSED} AND paid_indemnity > 0
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: count of Claim rows for this insured with claim_status IN {INTAKE, INVESTIGATION, LITIGATION} AND coverage_status != DENIED
        default: 0
      - name: npdb_reported_payment_total
        type: number
        source: computed
        description: sum of payment_amount over NPDBReport rows for this insured with report_status == SUBMITTED
        default: 0

  - name: RiskProgramEnrollment
    parent: Insured
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        description: "FK -> Insured.id; enrolled insured"
      - name: program_code
        type: enum
        source: input
        description: risk-management program the insured enrolled in
        constraints: "one of CME_RISK_101, SIM_LAB, CHART_AUDIT, TEAMSTEPPS, EHR_SAFETY"
      - name: enrolled_on
        type: datetime
        source: input
        description: enrollment date (YYYY-MM-DD)
      - name: completed_on
        type: datetime
        source: system
        description: completion date (YYYY-MM-DD); null while ENROLLED
        default: null
      - name: attestation_reference
        type: string
        source: system
        description: attestation document reference supplied at completion
        default: null
      - name: credit_pct_snapshot
        type: number
        source: computed
        description: PROGRAM_CREDIT_PCT[program_code] frozen at completion; 0 while ENROLLED
        default: 0
      - name: expires_on
        type: datetime
        source: computed
        description: completed_on + 730 days (YYYY-MM-DD); null while ENROLLED
        default: null
      - name: status
        type: enum
        source: system
        description: enrollment lifecycle state
        default: ENROLLED
        constraints: "one of ENROLLED, COMPLETED, EXPIRED"

  - name: PeerReviewCase
    parent: Insured
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        description: "FK -> Insured.id; practitioner or facility under review"
      - name: trigger_source
        type: enum
        source: input
        description: what referred the case to peer review
        constraints: "one of CLAIM_INTAKE, CREDENTIALING_REVIEW, SENTINEL_EVENT, COMPLAINT"
      - name: referral_note
        type: string
        source: input
        description: free-text referral narrative
      - name: status
        type: enum
        source: system
        description: fork-join review lifecycle
        default: REFERRED
        constraints: "one of REFERRED, IN_REVIEW, REVIEWS_COMPLETE, CLOSED"
      - name: chart_review_outcome
        type: enum
        source: system
        description: internal chart-review track verdict; null until the CHART track is recorded
        default: null
        constraints: "one of NO_CONCERN, CONCERN, INDETERMINATE"
      - name: external_review_outcome
        type: enum
        source: system
        description: external specialty-reviewer track verdict; null until the EXTERNAL track is recorded
        default: null
        constraints: "one of NO_CONCERN, CONCERN, INDETERMINATE"
      - name: committee_vote_result
        type: enum
        source: system
        description: peer review committee verdict recorded at the join
        default: null
        constraints: "one of NO_DEVIATION, DEVIATION_MINOR, DEVIATION_MAJOR"
      - name: votes_for
        type: integer
        source: system
        description: committee votes supporting the recorded verdict
        default: null
      - name: votes_against
        type: integer
        source: system
        description: committee votes opposing the recorded verdict
        default: null
      - name: surcharge_pct_assigned
        type: number
        source: computed
        description: PEER_REVIEW_SURCHARGE_PCT[committee_vote_result] frozen when the case closes
        default: 0
      - name: closed_on
        type: datetime
        source: system
        description: date (YYYY-MM-DD) the committee vote closed the case
        default: null
      - name: chair_user_id
        type: string
        source: system
        description: opaque X-User-ID of the PeerReviewChair who recorded the committee vote
        default: null

  - name: Policy
    parent: Insured
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        description: "FK -> Insured.id; named insured on this policy"
      - name: policy_number
        type: string
        source: system
        description: "'MPL-' followed by a 6-digit zero-padded creation sequence, assigned in created_at ASC order starting at MPL-000001"
      - name: coverage_form
        type: enum
        source: input
        description: coverage trigger of the policy
        constraints: "one of CLAIMS_MADE, OCCURRENCE"
      - name: limit_per_claim
        type: number
        source: input
        description: per-claim indemnity limit; keys the increased-limits factor
        constraints: "one of 1000000.00, 2000000.00, 3000000.00, 5000000.00"
      - name: limit_aggregate
        type: number
        source: input
        description: annual aggregate indemnity limit
        constraints: ">= limit_per_claim is NOT required; > 0; 2 decimal places"
      - name: retroactive_date
        type: datetime
        source: input
        description: prior-acts retroactive date (YYYY-MM-DD); required when coverage_form == CLAIMS_MADE, must be omitted or null when OCCURRENCE
        default: null
      - name: prior_acts_step_credit
        type: integer
        source: input
        description: number of prior-acts step years credited from the expiring carrier, added to term_index when deriving claims_made_step_year
        default: 0
        constraints: "0 <= prior_acts_step_credit <= 4"
      - name: consent_to_settle_clause
        type: enum
        source: input
        description: consent-to-settle provision governing physician veto rights
        constraints: "one of ABSOLUTE, HAMMER, NONE"
      - name: status
        type: enum
        source: computed
        description: compound state derived from the statuses of this policy's PolicyTerm rows
        default: QUOTED
        constraints: "one of QUOTED, ACTIVE, CANCELLED, EXPIRED"
      - name: current_term_id
        type: string
        source: computed
        description: id of the PolicyTerm with the latest effective_date among terms with status IN {ISSUED, IN_FORCE}; ties broken by created_at ASC; null when none
        default: null
      - name: quoted_premium_total
        type: number
        source: computed
        description: sum of term_total over this policy's PolicyTerm rows with status == DRAFT, 2 decimal places
        default: 0
      - name: written_premium_net_total
        type: number
        source: computed
        description: sum of (premium_net - return_premium) over this policy's PolicyTerm rows with status IN {ISSUED, IN_FORCE, EXPIRED, CANCELLED_FLAT, CANCELLED_PRO_RATA}, 2 decimal places
        default: 0

  - name: PolicyTerm
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy this term belongs to"
      - name: predecessor_term_id
        type: string
        source: input
        description: "FK -> PolicyTerm.id; self-referential link to the immediately preceding term in the claims-made step chain; null on the first term"
        default: null
      - name: term_index
        type: integer
        source: computed
        description: 1 when predecessor_term_id is null, otherwise predecessor.term_index + 1
      - name: effective_date
        type: datetime
        source: input
        description: inclusive term start date (YYYY-MM-DD)
      - name: expiration_date
        type: datetime
        source: input
        description: exclusive term end date (YYYY-MM-DD); the term period is the half-open interval [effective_date, expiration_date)
      - name: claims_made_step_year
        type: integer
        source: computed
        description: min(5, term_index + policy.prior_acts_step_credit) when coverage_form == CLAIMS_MADE; 5 when OCCURRENCE
      - name: step_factor
        type: number
        source: computed
        description: STEP_FACTOR[claims_made_step_year] when CLAIMS_MADE; always 1.00 when OCCURRENCE
      - name: rating_variant
        type: enum
        source: computed
        description: UNDERWRITING_SNAPSHOT when predecessor_term_id is null, RENEWAL_PROSPECTIVE otherwise
        constraints: "one of UNDERWRITING_SNAPSHOT, RENEWAL_PROSPECTIVE"
      - name: rated_risk_class_code
        type: enum
        source: computed
        description: insured_risk_classification band under this term's rating_variant, frozen on this term
        constraints: "one of R1, R2, R3, R4"
      - name: rated_risk_class_factor
        type: number
        source: computed
        description: RISK_CLASS_FACTOR[rated_risk_class_code]
      - name: venue_severity_factor
        type: number
        source: computed
        description: VENUE_SEVERITY_FACTOR[insured.venue_code]
      - name: increased_limits_factor
        type: number
        source: computed
        description: INCREASED_LIMITS_FACTOR[policy.limit_per_claim]
      - name: credit_pct_applied
        type: number
        source: computed
        description: program_credit_pct output for the insured as of effective_date, capped at MAX_STACKED_CREDIT_PCT
        default: 0
      - name: surcharge_pct_applied
        type: number
        source: computed
        description: peer_review_surcharge_pct output for the insured as of effective_date
        default: 0
      - name: premium_manual
        type: number
        source: computed
        description: manual premium before credits and surcharges, stage S4 of claims_made_step_premium
      - name: premium_net
        type: number
        source: computed
        description: manual premium after credit and surcharge, before fees and assessments
      - name: administrative_fee
        type: number
        source: computed
        description: flat policy fee selected from ADMIN_FEE_TIERS keyed on premium_net
      - name: guaranty_fund_assessment
        type: number
        source: computed
        description: round(GUARANTY_FUND_RATE * (premium_net + administrative_fee), 2)
      - name: term_total
        type: number
        source: computed
        description: round(premium_net + administrative_fee + guaranty_fund_assessment, 2)
      - name: return_premium
        type: number
        source: computed
        description: unearned premium returned on cancellation; 0 while the term has not been cancelled
        default: 0
      - name: aggregate_limit_remaining
        type: number
        source: computed
        description: policy.limit_aggregate at issuance, debited by every indemnity payment charged to this term
        default: 0
      - name: rate_revision_index_used
        type: integer
        source: computed
        description: SpecialtyClass.rate_revision_index in force when this term was last rated
        default: 0
      - name: status
        type: enum
        source: system
        description: term lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, IN_FORCE, EXPIRED, CANCELLED_FLAT, CANCELLED_PRO_RATA"
      - name: cancel_effective_date
        type: datetime
        source: system
        description: cancellation effective date (YYYY-MM-DD); null unless cancelled
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: logical clock timestamp at issuance; null while DRAFT
        default: null

  - name: TailEndorsement
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy the tail attaches to"
      - name: triggering_term_id
        type: string
        source: input
        description: "FK -> PolicyTerm.id; expired or pro-rata-cancelled term whose reporting obligation the tail extends"
      - name: tail_type
        type: enum
        source: input
        description: extended reporting period form purchased
        constraints: "one of ERP_5YR, ERP_UNLIMITED, DEATH_DISABILITY_RETIREMENT"
      - name: trigger_reason
        type: enum
        source: input
        description: circumstance triggering the tail
        constraints: "one of RETIREMENT, DISABILITY, DEATH, CARRIER_CHANGE, PRACTICE_CLOSURE"
      - name: effective_date
        type: datetime
        source: input
        description: inclusive first date of the extended reporting window (YYYY-MM-DD)
      - name: reporting_window_end
        type: datetime
        source: computed
        description: inclusive last date of the extended reporting window; the window is the CLOSED interval [effective_date, reporting_window_end]
      - name: mature_premium_basis
        type: number
        source: computed
        description: round(triggering_term.premium_manual / triggering_term.step_factor, 2), the mature claims-made premium
      - name: tail_factor
        type: number
        source: computed
        description: TAIL_FACTOR[tail_type]
      - name: tail_premium
        type: number
        source: computed
        description: round(mature_premium_basis * tail_factor, 2)
      - name: status
        type: enum
        source: system
        description: endorsement lifecycle state
        default: QUOTED
        constraints: "one of QUOTED, ISSUED, VOID"
      - name: issued_at
        type: datetime
        source: system
        description: logical clock timestamp at issuance; null while QUOTED
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason recorded when a flat cancellation on this endorsement's Policy voids it; POLICY_RESCINDED_BY_FLAT_CANCELLATION
        default: null

  - name: Claim
    parent: Insured
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        description: "FK -> Insured.id; insured against whom the claim is asserted"
      - name: policy_term_id
        type: string
        source: computed
        description: "FK -> PolicyTerm.id; responding term resolved by the coverage-trigger rule at intake; null when no term responds"
        default: null
      - name: tail_endorsement_id
        type: string
        source: computed
        description: "FK -> TailEndorsement.id; responding tail resolved at intake when no term responds; null otherwise"
        default: null
      - name: incident_date
        type: datetime
        source: input
        description: date of the alleged act, error or omission (YYYY-MM-DD)
      - name: report_date
        type: datetime
        source: input
        description: date the claim was first reported to the carrier (YYYY-MM-DD)
      - name: venue_code
        type: enum
        source: input
        description: venue in which the claim is or would be litigated
        constraints: "one of COOK_IL, MIAMI_DADE_FL, KINGS_NY, TRAVIS_TX, MARICOPA_AZ"
      - name: allegation_category
        type: enum
        source: input
        description: primary allegation asserted
        constraints: "one of DIAGNOSIS_FAILURE, SURGICAL_ERROR, MEDICATION_ERROR, OBSTETRIC_INJURY, INFORMED_CONSENT"
      - name: demand_amount
        type: number
        source: input
        description: plaintiff demand, drives the severity band
        constraints: ">= 0; 2 decimal places"
      - name: claim_status
        type: enum
        source: system
        description: handling lifecycle dimension, independent of coverage_status
        default: INTAKE
        constraints: "one of INTAKE, INVESTIGATION, LITIGATION, RESOLVED, CLOSED"
      - name: coverage_status
        type: enum
        source: system
        description: coverage lifecycle dimension, independent of claim_status
        default: UNDER_REVIEW
        constraints: "one of UNDER_REVIEW, COVERED, RESERVED_RIGHTS, DENIED"
      - name: denial_reason
        type: enum
        source: system
        description: why coverage was denied; null unless coverage_status == DENIED
        default: null
        constraints: "one of PRIOR_ACTS_EXCLUDED, NO_RESPONDING_COVERAGE, TERM_VOIDED, ADJUSTER_DENIAL"
      - name: reserved_rights_reason
        type: string
        source: system
        description: narrative recorded when coverage is accepted under a reservation of rights
        default: null
      - name: severity_band
        type: enum
        source: computed
        description: SEVERITY_BAND assignment derived from demand_amount
        constraints: "one of BAND_1, BAND_2, BAND_3, BAND_4"
      - name: severity_band_factor
        type: number
        source: computed
        description: SEVERITY_BAND_FACTOR[severity_band]
      - name: indemnity_reserve
        type: number
        source: computed
        description: case_reserve_projection indemnity output of the effective ReserveEntry; 0 when none
        default: 0
      - name: expense_reserve
        type: number
        source: computed
        description: case_reserve_projection expense output of the effective ReserveEntry; 0 when none
        default: 0
      - name: reserve_method_current
        type: enum
        source: computed
        description: method of the effective ReserveEntry; null when none
        default: null
        constraints: "one of CASE_BASIS, FORMULA_BASIS"
      - name: paid_indemnity
        type: number
        source: computed
        description: cumulative indemnity paid on this claim
        default: 0
      - name: paid_expense
        type: number
        source: computed
        description: cumulative allocated loss adjustment expense paid on this claim
        default: 0
      - name: case_incurred
        type: number
        source: computed
        description: claim_incurred_loss output under the CASE_INCURRED variant
        default: 0
      - name: actuarial_incurred
        type: number
        source: computed
        description: claim_incurred_loss output under the ACTUARIAL_INCURRED variant
        default: 0
      - name: insured_share_receivable
        type: number
        source: computed
        description: cumulative insured_share_amount charged back to the insured under invoked hammer clauses
        default: 0
      - name: disposition
        type: enum
        source: system
        description: final disposition of the claim; null until resolved
        default: null
        constraints: "one of DEFENSE_VERDICT, PLAINTIFF_VERDICT, SETTLED, DISMISSED, WITHDRAWN"
      - name: verdict_amount
        type: number
        source: system
        description: gross verdict rendered; null unless disposition == PLAINTIFF_VERDICT
        default: null
      - name: suit_filed_on
        type: datetime
        source: system
        description: date suit was filed (YYYY-MM-DD); null until the claim enters LITIGATION
        default: null
      - name: resolved_on
        type: datetime
        source: system
        description: date (YYYY-MM-DD) the claim reached RESOLVED
        default: null
      - name: closed_on
        type: datetime
        source: system
        description: date (YYYY-MM-DD) the claim reached CLOSED
        default: null
      - name: counsel_reassignment_required
        type: boolean
        source: computed
        description: true when this claim has no ASSIGNED CounselAssignment after a decline or panel-removal replacement
        default: false
      - name: excluded_counsel_firm_ids
        type: array
        source: computed
        description: ids of DefenseCounselFirm rows that declined or were replaced on this claim; excluded from the counsel_panel_selection pool
        default: []

  - name: ReserveEntry
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; claim this reserve posting belongs to"
      - name: method
        type: enum
        source: input
        description: reserve-setting basis selected by the adjuster
        constraints: "one of CASE_BASIS, FORMULA_BASIS"
      - name: indemnity_amount
        type: number
        source: input
        description: adjuster-supplied indemnity reserve; required when method == CASE_BASIS, must be omitted or null when method == FORMULA_BASIS
        default: null
      - name: expense_amount
        type: number
        source: input
        description: adjuster-supplied expense reserve; required when method == CASE_BASIS, must be omitted or null when method == FORMULA_BASIS
        default: null
      - name: computed_indemnity_amount
        type: number
        source: computed
        description: case_reserve_projection indemnity result for this posting
      - name: computed_expense_amount
        type: number
        source: computed
        description: case_reserve_projection expense result for this posting
      - name: effective_at
        type: datetime
        source: input
        description: ISO8601 timestamp from which this posting is the reserve of record
      - name: rationale
        type: string
        source: input
        description: adjuster narrative supporting the posting
      - name: set_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ClaimsAdjuster who posted this entry
      - name: id
        type: string
        source: system
        description: server-minted UUID; ReserveEntry rows are append-only and never updated
      - name: created_at
        type: datetime
        source: system
        description: creation timestamp; secondary ordering key when two postings share effective_at

  - name: DefenseCounselFirm
    parent: null
    common_fields: true
    fields:
      - name: firm_name
        type: string
        source: input
        description: panel defence firm name
      - name: admitted_venue_codes
        type: array
        source: input
        description: venue codes in which the firm is admitted to practise
        constraints: "non-empty array of COOK_IL, MIAMI_DADE_FL, KINGS_NY, TRAVIS_TX, MARICOPA_AZ"
      - name: allegation_specialties
        type: array
        source: input
        description: allegation categories the firm is panel-qualified to defend
        constraints: "non-empty array of DIAGNOSIS_FAILURE, SURGICAL_ERROR, MEDICATION_ERROR, OBSTETRIC_INJURY, INFORMED_CONSENT"
      - name: blended_hourly_rate
        type: number
        source: input
        description: negotiated blended hourly rate; second selection ranking key, ascending
        constraints: "> 0; 2 decimal places"
      - name: quality_score
        type: integer
        source: input
        description: panel quality score; first selection ranking key, descending
        constraints: "0 <= quality_score <= 100"
      - name: max_concurrent_assignments
        type: integer
        source: input
        description: capacity ceiling on simultaneously ASSIGNED matters
        default: 5
        constraints: ">= 1"
      - name: conflict_insured_ids
        type: array
        source: input
        description: Insured ids the firm is conflicted out of representing
        default: []
      - name: panel_status
        type: enum
        source: system
        description: panel standing; only ACTIVE firms are eligible for selection
        default: ACTIVE
        constraints: "one of ACTIVE, PROBATION, REMOVED"
      - name: open_assignment_count
        type: integer
        source: computed
        description: count of CounselAssignment rows for this firm with assignment_status == ASSIGNED
        default: 0
      - name: billed_expense_total
        type: number
        source: computed
        description: cumulative defence expense paid to this firm across all claims
        default: 0
      - name: panel_status_reason
        type: string
        source: system
        description: reason recorded on the most recent panel_status change
        default: null

  - name: CounselAssignment
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; claim the firm is assigned to defend"
      - name: counsel_firm_id
        type: string
        source: computed
        description: "FK -> DefenseCounselFirm.id; firm chosen by counsel_panel_selection; not client-supplied"
      - name: assignment_status
        type: enum
        source: system
        description: assignment lifecycle state
        default: ASSIGNED
        constraints: "one of ASSIGNED, DECLINED, REPLACED, CLOSED"
      - name: assigned_at
        type: datetime
        source: system
        description: logical clock timestamp at assignment
      - name: selection_rank_snapshot
        type: integer
        source: computed
        description: 1-based rank of the selected firm within the ranked candidate list at assignment time
      - name: candidate_pool_size
        type: integer
        source: computed
        description: number of firms that passed the eligibility filter at assignment time
      - name: decline_reason
        type: enum
        source: system
        description: reason the firm declined; null unless assignment_status == DECLINED
        default: null
        constraints: "one of CONFLICT_OF_INTEREST, CAPACITY, RATE_DISPUTE, EXPERTISE_MISMATCH"
      - name: billed_expense_amount
        type: number
        source: computed
        description: cumulative defence expense paid to the firm under this assignment
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: logical clock timestamp at which the assignment left ASSIGNED
        default: null

  - name: SettlementNegotiation
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; claim being negotiated"
      - name: round_index
        type: integer
        source: computed
        description: 1 on creation; incremented by 1 on every revision that re-opens the negotiation
        default: 1
      - name: proposed_amount
        type: number
        source: input
        description: indemnity amount proposed to the claimant
        constraints: ">= 0; 2 decimal places"
      - name: authority_requested
        type: number
        source: input
        description: settlement authority requested from the claims committee
        constraints: ">= 0; 2 decimal places"
      - name: authority_granted
        type: number
        source: system
        description: authority actually granted; may be below proposed_amount (a partial grant), null until an authority decision is recorded, reset to null on revision
        default: null
      - name: status
        type: enum
        source: system
        description: negotiation lifecycle state; cyclic through revision
        default: AUTHORITY_REQUESTED
        constraints: "one of AUTHORITY_REQUESTED, AUTHORITY_GRANTED, AUTHORITY_DENIED, CONSENT_REQUESTED, CONSENT_GRANTED, VETOED, HAMMER_INVOKED, PAID, ABANDONED"
      - name: physician_response
        type: enum
        source: system
        description: insured's consent-to-settle response; reset to null on revision
        default: null
        constraints: "one of CONSENTED, VETOED"
      - name: veto_reason
        type: string
        source: system
        description: narrative supplied by the insured when exercising a veto
        default: null
      - name: consent_requested_at
        type: datetime
        source: system
        description: logical clock timestamp at which consent was tendered to the insured
        default: null
      - name: consent_clause_applied
        type: enum
        source: computed
        description: consent_to_settle_clause of the parent Policy frozen on this negotiation at creation
        constraints: "one of ABSOLUTE, HAMMER, NONE"
      - name: hammer_invoked
        type: boolean
        source: system
        description: true once the carrier has invoked the hammer clause over a veto
        default: false
      - name: hammer_exposure_estimate
        type: number
        source: computed
        description: settlement_insured_share exposure output; 0 until the hammer is invoked
        default: 0
      - name: insured_share_amount
        type: number
        source: computed
        description: settlement_insured_share insured portion; 0 until the hammer is invoked
        default: 0
      - name: carrier_share_amount
        type: number
        source: computed
        description: settlement_insured_share carrier portion; 0 until the hammer is invoked
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the actor who created or last revised this negotiation
      - name: approved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ClaimsCommitteeApprover who decided authority; must differ from prepared_by_user_id
        default: null
      - name: paid_amount
        type: number
        source: system
        description: indemnity actually disbursed; null until PAID
        default: null
      - name: payment_date
        type: datetime
        source: system
        description: disbursement date (YYYY-MM-DD); null until PAID
        default: null
      - name: notice_sent_on
        type: datetime
        source: system
        description: date (YYYY-MM-DD) the hammer-clause notice was sent to the insured
        default: null

  - name: NPDBReport
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: computed
        description: "FK -> Claim.id; claim whose payment triggered the reporting obligation"
      - name: settlement_negotiation_id
        type: string
        source: computed
        description: "FK -> SettlementNegotiation.id; negotiation that produced the payment; null for verdict payments"
        default: null
      - name: insured_id
        type: string
        source: computed
        description: "FK -> Insured.id; practitioner or entity the payment was made on behalf of"
      - name: payment_amount
        type: number
        source: computed
        description: indemnity amount disbursed on behalf of the insured
      - name: payment_date
        type: datetime
        source: computed
        description: date (YYYY-MM-DD) the payment was made
      - name: reportable
        type: boolean
        source: computed
        description: npdb_reportability verdict for this payment
      - name: non_reportable_reason
        type: enum
        source: computed
        description: why the payment is not reportable; null when reportable is true
        default: null
        constraints: "one of NON_PRACTITIONER_PAYMENT, ZERO_DOLLAR_RESOLUTION"
      - name: due_date
        type: datetime
        source: computed
        description: payment_date + 30 days (YYYY-MM-DD); the statutory submission deadline
      - name: report_status
        type: enum
        source: system
        description: filing lifecycle state
        default: PENDING
        constraints: "one of PENDING, SUBMITTED, VOID"
      - name: submitted_on
        type: datetime
        source: system
        description: date (YYYY-MM-DD) the report was transmitted; null until SUBMITTED
        default: null
      - name: submitted_late
        type: boolean
        source: computed
        description: true when submitted_on > due_date
        default: false
      - name: days_late
        type: integer
        source: computed
        description: max(0, submitted_on - due_date) in whole days
        default: 0
      - name: submitter_note
        type: string
        source: system
        description: narrative recorded at submission
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason the obligation was voided; set for non-reportable payments and explicit voids
        default: null

  - name: RateFiling
    parent: SpecialtyClass
    common_fields: true
    fields:
      - name: specialty_class_id
        type: string
        source: input
        description: "FK -> SpecialtyClass.id; class whose manual rate the filing revises"
      - name: filing_number
        type: string
        source: system
        description: "'RF-' followed by a 6-digit zero-padded creation sequence, assigned in created_at ASC order starting at RF-000001"
      - name: indication_method
        type: enum
        source: input
        description: actuarial method used to derive the indicated rate change
        constraints: "one of LOSS_RATIO_METHOD, PURE_PREMIUM_METHOD"
      - name: proposed_rate_change_pct
        type: number
        source: input
        description: rate change the filing proposes, in percent
        constraints: "-50.00 <= proposed_rate_change_pct <= 100.00; 2 decimal places"
      - name: experience_period_start
        type: datetime
        source: input
        description: inclusive first date of the experience period (YYYY-MM-DD)
      - name: experience_period_end
        type: datetime
        source: input
        description: inclusive last date of the experience period (YYYY-MM-DD)
      - name: effective_date
        type: datetime
        source: input
        description: date (YYYY-MM-DD) the revised rate would take effect
      - name: claim_count_in_scope
        type: integer
        source: computed
        description: count of Claim rows in the experience set; keys the credibility weight
        default: 0
      - name: in_scope_premium_total
        type: number
        source: computed
        description: sum of premium_net over PolicyTerm rows in the experience set
        default: 0
      - name: actuarial_incurred_total
        type: number
        source: computed
        description: sum of actuarial_incurred over Claim rows in the experience set
        default: 0
      - name: experience_loss_ratio
        type: number
        source: computed
        description: round(actuarial_incurred_total / in_scope_premium_total, 4); null when in_scope_premium_total == 0
        default: null
      - name: indicated_change_pct
        type: number
        source: computed
        description: rate_indication output in percent; null when experience_loss_ratio is null
        default: null
      - name: credibility_weight
        type: number
        source: computed
        description: CREDIBILITY_WEIGHT selected from claim_count_in_scope
        default: 0
      - name: credibility_weighted_indication_pct
        type: number
        source: computed
        description: credibility-blended indication in percent; null when indicated_change_pct is null
        default: null
      - name: carried_reserve_total
        type: number
        source: computed
        description: reserve_adequacy_ratio numerator; sum of carried reserves over the experience set
        default: 0
      - name: required_reserve_total
        type: number
        source: computed
        description: reserve_adequacy_ratio denominator; sum of per-claim required reserves over the experience set
        default: 0
      - name: reserve_adequacy_ratio
        type: number
        source: computed
        description: round(carried_reserve_total / required_reserve_total, 4); null when required_reserve_total == 0
        default: null
      - name: adequacy_flag
        type: enum
        source: computed
        description: reserve adequacy verdict derived from reserve_adequacy_ratio
        default: NOT_EVALUABLE
        constraints: "one of DEFICIENT, ADEQUATE, REDUNDANT, NOT_EVALUABLE"
      - name: status
        type: enum
        source: system
        description: filing lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, WITHDRAWN"
      - name: prepared_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the actuary who created the filing
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ChiefActuary who approved or rejected the filing; must differ from prepared_by_user_id
        default: null
      - name: approved_rate_change_pct
        type: number
        source: system
        description: rate change actually approved; null unless status == APPROVED
        default: null
      - name: decision_note
        type: string
        source: system
        description: narrative recorded with the decision
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Insured
    initial_state: PROSPECT
    terminal_states: []
    note: |
      Parallel dimensions. `status` (PROSPECT -> ACTIVE <-> SUSPENDED) and
      `credentialing_status` (PENDING -> {PROVISIONAL, CREDENTIALED, DENIED},
      {PROVISIONAL, CREDENTIALED} -> LAPSED, LAPSED -> CREDENTIALED) advance on
      independent axes; the ACTIVE <-> SUSPENDED cycle is driven by the
      credentialing axis. No state is terminal: a DENIED insured may later be
      credentialed.
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /mpl/policy-terms/{id}/issuance"
        actor: UnderwritingOfficer
        preconditions:
          - "Insured.status == PROSPECT"
          - "the issued PolicyTerm belongs to a Policy whose insured_id is this Insured"
        side_effects:
          - "Insured.status set to ACTIVE"
          - "Insured.version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mpl/insureds/{id}/credentialing-decision with credentialing_status IN {LAPSED, DENIED}"
        actor: UnderwritingOfficer
        preconditions:
          - "Insured.status == ACTIVE"
        side_effects:
          - "Insured.status set to SUSPENDED"
          - "Insured.credentialing_status set to the submitted value"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mpl/_clock/set_current_utc advancing the clock past Insured.credentialing_expires_on"
        actor: system
        preconditions:
          - "Insured.status == ACTIVE"
          - "Insured.credentialing_status IN {CREDENTIALED, PROVISIONAL}"
          - "Insured.credentialing_expires_on < the new current date"
        side_effects:
          - "Insured.credentialing_status set to LAPSED"
          - "Insured.status set to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mpl/insureds/{id}/credentialing-decision with credentialing_status IN {CREDENTIALED, PROVISIONAL}"
        actor: UnderwritingOfficer
        preconditions:
          - "Insured.status == SUSPENDED"
          - "submitted credentialing_expires_on is on or after the current logical date"
        side_effects:
          - "Insured.status set to ACTIVE"
          - "Insured.credentialing_status set to the submitted value"
        note: "Cycle: the same Insured re-enters ACTIVE, a state it already left."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mpl/peer-review-cases/{id}/committee-vote with vote_result == DEVIATION_MAJOR"
        actor: PeerReviewChair
        preconditions:
          - "Insured.status == ACTIVE"
        side_effects:
          - "Insured.status set to SUSPENDED"
        note: "Conditional cascade: applied only when the insured is ACTIVE; a PROSPECT insured is untouched."

  - entity: RiskProgramEnrollment
    initial_state: ENROLLED
    terminal_states: [EXPIRED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /mpl/enrollments/{id}/completion"
        actor: UnderwritingOfficer
        preconditions:
          - "RiskProgramEnrollment.status == ENROLLED"
          - "completed_on is on or after enrolled_on"
        side_effects:
          - "completed_on and attestation_reference recorded"
          - "credit_pct_snapshot set to PROGRAM_CREDIT_PCT[program_code]"
          - "expires_on set to completed_on + 730 days"
          - "program_credit_pct recomputed for the Insured"
          - "every PolicyTerm with status == DRAFT on the Insured's policies is re-rated"
          - "Policy.quoted_premium_total recomputed for each affected Policy"
      - from: COMPLETED
        to: EXPIRED
        trigger: "POST /mpl/_clock/set_current_utc advancing the clock to or past expires_on"
        actor: system
        preconditions:
          - "RiskProgramEnrollment.status == COMPLETED"
          - "expires_on <= the new current date"
        side_effects:
          - "status set to EXPIRED"
          - "program_credit_pct recomputed for the Insured"
          - "every PolicyTerm with status == DRAFT on the Insured's policies is re-rated"

  - entity: PeerReviewCase
    initial_state: REFERRED
    terminal_states: [CLOSED]
    note: |
      Fork-join. Two independent review tracks (CHART and EXTERNAL) are recorded
      in either order; the case only reaches REVIEWS_COMPLETE when both have
      landed, and only then may the committee vote close it.
    transitions:
      - from: REFERRED
        to: IN_REVIEW
        trigger: "POST /mpl/peer-review-cases/{id}/reviews recording the first of the two tracks"
        actor: PeerReviewChair
        preconditions:
          - "PeerReviewCase.status == REFERRED"
          - "the submitted review_track has not already been recorded on this case"
        side_effects:
          - "chart_review_outcome or external_review_outcome set from the submitted outcome"
      - from: IN_REVIEW
        to: REVIEWS_COMPLETE
        trigger: "POST /mpl/peer-review-cases/{id}/reviews recording the second of the two tracks"
        actor: PeerReviewChair
        preconditions:
          - "PeerReviewCase.status == IN_REVIEW"
          - "the submitted review_track has not already been recorded on this case"
        side_effects:
          - "the remaining outcome field set from the submitted outcome"
          - "status set to REVIEWS_COMPLETE because both tracks have now landed (join)"
      - from: REVIEWS_COMPLETE
        to: CLOSED
        trigger: "POST /mpl/peer-review-cases/{id}/committee-vote"
        actor: PeerReviewChair
        preconditions:
          - "PeerReviewCase.status == REVIEWS_COMPLETE"
          - "votes_for > votes_against"
        side_effects:
          - "committee_vote_result, votes_for, votes_against and chair_user_id recorded"
          - "surcharge_pct_assigned set to PEER_REVIEW_SURCHARGE_PCT[committee_vote_result]"
          - "closed_on set to the current logical date"
          - "Insured.surcharge_pct recomputed via peer_review_surcharge_pct"
          - "every PolicyTerm with status == DRAFT on the Insured's policies is re-rated"
          - "Policy.quoted_premium_total recomputed for each affected Policy"
          - "Insured.status set to SUSPENDED when committee_vote_result == DEVIATION_MAJOR AND Insured.status == ACTIVE"

  - entity: PolicyTerm
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED_FLAT, CANCELLED_PRO_RATA]
    note: |
      Branching with divergent side effects. IN_FORCE reaches three different
      terminal states; the two cancellation branches differ in the return-premium
      formula, in whether the aggregate limit is surrendered, and in whether the
      term's claims and tail endorsements are voided.
    transitions:
      - from: DRAFT
        to: IN_FORCE
        trigger: "POST /mpl/policy-terms/{id}/issuance when effective_date <= current logical date"
        actor: UnderwritingOfficer
        preconditions:
          - "PolicyTerm.status == DRAFT"
          - "Insured.credentialing_status IN {CREDENTIALED, PROVISIONAL}"
          - "Insured.credentialing_expires_on >= PolicyTerm.effective_date"
        side_effects:
          - "status set to IN_FORCE and issued_at set to the current logical timestamp"
          - "aggregate_limit_remaining set to Policy.limit_aggregate"
          - "Policy.written_premium_net_total recomputed (ledger sync)"
          - "Policy.quoted_premium_total recomputed"
          - "Policy.current_term_id recomputed"
          - "Policy.status set to ACTIVE"
          - "Insured.status set to ACTIVE when it was PROSPECT"
      - from: DRAFT
        to: ISSUED
        trigger: "POST /mpl/policy-terms/{id}/issuance when effective_date > current logical date"
        actor: UnderwritingOfficer
        preconditions:
          - "PolicyTerm.status == DRAFT"
          - "Insured.credentialing_status IN {CREDENTIALED, PROVISIONAL}"
          - "Insured.credentialing_expires_on >= PolicyTerm.effective_date"
        side_effects:
          - "status set to ISSUED and issued_at set to the current logical timestamp"
          - "aggregate_limit_remaining set to Policy.limit_aggregate"
          - "Policy.written_premium_net_total recomputed (ledger sync)"
          - "Policy.quoted_premium_total recomputed"
          - "Policy.current_term_id recomputed"
          - "Policy.status set to ACTIVE"
          - "Insured.status set to ACTIVE when it was PROSPECT"
      - from: ISSUED
        to: IN_FORCE
        trigger: "POST /mpl/_clock/set_current_utc advancing the clock to or past effective_date"
        actor: system
        preconditions:
          - "PolicyTerm.status == ISSUED"
          - "effective_date <= the new current date"
        side_effects:
          - "status set to IN_FORCE"
          - "Policy.current_term_id recomputed"
        note: "Promotion runs before expiry inside the same clock call, ordered by effective_date ASC then created_at ASC."
      - from: IN_FORCE
        to: EXPIRED
        trigger: "POST /mpl/_clock/set_current_utc advancing the clock to or past expiration_date"
        actor: system
        preconditions:
          - "PolicyTerm.status == IN_FORCE"
          - "expiration_date <= the new current date"
        side_effects:
          - "status set to EXPIRED"
          - "Policy.current_term_id recomputed"
          - "Policy.status set to EXPIRED when every PolicyTerm on the Policy is terminal (bubble up)"
      - from: IN_FORCE
        to: CANCELLED_FLAT
        trigger: "POST /mpl/policy-terms/{id}/cancellation with cancel_type == FLAT"
        actor: UnderwritingOfficer
        preconditions:
          - "PolicyTerm.status IN {ISSUED, IN_FORCE}"
          - "cancel_effective_date == PolicyTerm.effective_date"
        side_effects:
          - "status set to CANCELLED_FLAT and cancel_effective_date recorded"
          - "return_premium set to premium_net (the full net premium is returned)"
          - "aggregate_limit_remaining set to 0.00"
          - "Policy.written_premium_net_total recomputed (ledger sync)"
          - "every Claim with policy_term_id == this term and coverage_status != DENIED has coverage_status set to DENIED and denial_reason set to TERM_VOIDED (conditional cascade)"
          - "every SettlementNegotiation on those claims whose status is not in {PAID, ABANDONED} has status set to ABANDONED"
          - "every TailEndorsement on this Policy with status == ISSUED has status set to VOID and void_reason set to POLICY_RESCINDED_BY_FLAT_CANCELLATION, because a flat cancellation rescinds the coverage relationship ab initio (cross-entity cascade)"
          - "Policy.status recomputed: CANCELLED once no PolicyTerm on the Policy remains in {DRAFT, ISSUED, IN_FORCE}"
          - "Policy.current_term_id recomputed"
      - from: IN_FORCE
        to: CANCELLED_PRO_RATA
        trigger: "POST /mpl/policy-terms/{id}/cancellation with cancel_type == PRO_RATA"
        actor: UnderwritingOfficer
        preconditions:
          - "PolicyTerm.status IN {ISSUED, IN_FORCE}"
          - "effective_date < cancel_effective_date < expiration_date"
        side_effects:
          - "status set to CANCELLED_PRO_RATA and cancel_effective_date recorded"
          - "return_premium set to the pro_rata_return_premium result"
          - "aggregate_limit_remaining left unchanged"
          - "Policy.written_premium_net_total recomputed (ledger sync)"
          - "claims already reported under the term keep their coverage_status"
          - "Policy.status set to CANCELLED"
          - "Policy.current_term_id recomputed"

  - entity: Policy
    initial_state: QUOTED
    terminal_states: []
    note: "Compound state: Policy.status is re-derived from its PolicyTerm rows on every term transition."
    transitions:
      - from: QUOTED
        to: ACTIVE
        trigger: "system re-derivation when any PolicyTerm on the Policy reaches ISSUED or IN_FORCE"
        actor: system
        preconditions:
          - "at least one PolicyTerm has status IN {ISSUED, IN_FORCE}"
        side_effects:
          - "status set to ACTIVE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system re-derivation when every PolicyTerm on the Policy is terminal and at least one is EXPIRED"
        actor: system
        preconditions:
          - "no PolicyTerm has status IN {DRAFT, ISSUED, IN_FORCE}"
          - "at least one PolicyTerm has status == EXPIRED"
        side_effects:
          - "status set to EXPIRED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system re-derivation when a PolicyTerm reaches CANCELLED_FLAT or CANCELLED_PRO_RATA and no term remains in {DRAFT, ISSUED, IN_FORCE}"
        actor: system
        preconditions:
          - "no PolicyTerm has status IN {DRAFT, ISSUED, IN_FORCE}"
          - "at least one PolicyTerm has status IN {CANCELLED_FLAT, CANCELLED_PRO_RATA}"
        side_effects:
          - "status set to CANCELLED"

  - entity: TailEndorsement
    initial_state: QUOTED
    terminal_states: [ISSUED, VOID]
    transitions:
      - from: QUOTED
        to: ISSUED
        trigger: "POST /mpl/tail-endorsements/{id}/issuance"
        actor: UnderwritingOfficer
        preconditions:
          - "TailEndorsement.status == QUOTED"
          - "no other TailEndorsement with the same triggering_term_id has status == ISSUED"
        side_effects:
          - "status set to ISSUED and issued_at set to the current logical timestamp"
          - "the extended reporting window becomes available as a coverage trigger at claim intake"
      - from: ISSUED
        to: VOID
        trigger: "POST /mpl/policy-terms/{id}/cancellation with cancel_type == FLAT on any term of this endorsement's Policy"
        actor: system
        preconditions:
          - "TailEndorsement.status == ISSUED"
          - "the flat-cancelled PolicyTerm belongs to TailEndorsement.policy_id"
        side_effects:
          - "status set to VOID and void_reason set to POLICY_RESCINDED_BY_FLAT_CANCELLATION"

  - entity: Claim
    initial_state: INTAKE
    terminal_states: [CLOSED]
    note: |
      Parallel dimensions. `claim_status` (INTAKE -> INVESTIGATION -> LITIGATION ->
      RESOLVED -> CLOSED) and `coverage_status` (UNDER_REVIEW -> {COVERED,
      RESERVED_RIGHTS, DENIED}, RESERVED_RIGHTS -> {COVERED, DENIED}) advance on
      independent axes. A coverage decision may fire while the handling axis is
      frozen at LITIGATION, and the handling axis may advance while coverage stays
      at RESERVED_RIGHTS.
    transitions:
      - from: INTAKE
        to: INVESTIGATION
        trigger: "POST /mpl/claims/{id}/coverage-decision"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == INTAKE"
          - "Claim.coverage_status IN {UNDER_REVIEW, RESERVED_RIGHTS}"
        side_effects:
          - "coverage_status set to the submitted value on the coverage axis"
          - "denial_reason set to ADJUSTER_DENIAL when the submitted value is DENIED"
          - "reserved_rights_reason recorded when the submitted value is RESERVED_RIGHTS"
          - "claim_status advanced to INVESTIGATION on the handling axis"
          - "Insured.open_claim_count recomputed when coverage_status became DENIED"
        note: "The handling axis advances for all three coverage outcomes, including DENIED."
      - from: INVESTIGATION
        to: LITIGATION
        trigger: "POST /mpl/claims/{id}/litigation"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == INVESTIGATION"
          - "suit_filed_on is on or after Claim.report_date"
        side_effects:
          - "claim_status set to LITIGATION and suit_filed_on recorded"
          - "coverage_status left unchanged (independent axis)"
      - from: INVESTIGATION
        to: RESOLVED
        trigger: "POST /mpl/claims/{id}/disposition"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status IN {INVESTIGATION, LITIGATION}"
          - "resolved_on is on or after Claim.report_date"
        side_effects:
          - "claim_status set to RESOLVED; disposition, verdict_amount and resolved_on recorded"
          - "paid_indemnity increased by min(verdict_amount, Policy.limit_per_claim) when disposition == PLAINTIFF_VERDICT"
          - "PolicyTerm.aggregate_limit_remaining debited by the same amount when disposition == PLAINTIFF_VERDICT"
          - "indemnity_reserve and expense_reserve set to 0.00"
          - "case_incurred and actuarial_incurred recomputed"
          - "an NPDBReport is created when disposition == PLAINTIFF_VERDICT"
          - "every CounselAssignment on the claim with assignment_status == ASSIGNED set to CLOSED and DefenseCounselFirm.open_assignment_count decremented"
          - "Insured.open_claim_count and Insured.closed_paid_claim_count recomputed, then Insured.risk_class_* recomputed"
      - from: LITIGATION
        to: RESOLVED
        trigger: "POST /mpl/settlement-negotiations/{id}/payment"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status IN {INVESTIGATION, LITIGATION}"
          - "the negotiation reached a payable status"
        side_effects:
          - "claim_status set to RESOLVED, disposition set to SETTLED, resolved_on set to the payment_date"
          - "paid_indemnity increased by the negotiation's paid_amount"
          - "PolicyTerm.aggregate_limit_remaining debited by the paid_amount"
          - "indemnity_reserve and expense_reserve set to 0.00"
          - "case_incurred and actuarial_incurred recomputed"
          - "an NPDBReport is created"
          - "every CounselAssignment on the claim with assignment_status == ASSIGNED set to CLOSED and DefenseCounselFirm.open_assignment_count decremented"
          - "Insured.open_claim_count and Insured.closed_paid_claim_count recomputed, then Insured.risk_class_* recomputed"
          - "every PolicyTerm with status == DRAFT and rating_variant == RENEWAL_PROSPECTIVE on the Insured's policies is re-rated"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /mpl/_clock/set_current_utc advancing the clock to or past resolved_on + 30 days"
        actor: system
        preconditions:
          - "Claim.claim_status == RESOLVED"
          - "resolved_on + 30 days <= the new current date"
        side_effects:
          - "claim_status set to CLOSED and closed_on set to the new current date"

  - entity: CounselAssignment
    initial_state: ASSIGNED
    terminal_states: [DECLINED, REPLACED, CLOSED]
    transitions:
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /mpl/counsel-assignments/{id}/decline"
        actor: ClaimsAdjuster
        preconditions:
          - "CounselAssignment.assignment_status == ASSIGNED"
        side_effects:
          - "assignment_status set to DECLINED, decline_reason recorded, closed_at set"
          - "DefenseCounselFirm.open_assignment_count decremented by 1 (compensation)"
          - "the firm's id appended to Claim.excluded_counsel_firm_ids"
          - "Claim.counsel_reassignment_required set to true"
      - from: ASSIGNED
        to: REPLACED
        trigger: "POST /mpl/counsel-firms/{id}/panel-status with panel_status == REMOVED"
        actor: system
        preconditions:
          - "CounselAssignment.assignment_status == ASSIGNED"
          - "the assignment's counsel_firm_id is the removed firm"
        side_effects:
          - "assignment_status set to REPLACED and closed_at set"
          - "DefenseCounselFirm.open_assignment_count decremented by 1"
          - "the firm's id appended to Claim.excluded_counsel_firm_ids"
          - "Claim.counsel_reassignment_required set to true"
      - from: ASSIGNED
        to: CLOSED
        trigger: "the claim reaching RESOLVED via POST /mpl/claims/{id}/disposition or POST /mpl/settlement-negotiations/{id}/payment"
        actor: system
        preconditions:
          - "CounselAssignment.assignment_status == ASSIGNED"
        side_effects:
          - "assignment_status set to CLOSED and closed_at set"
          - "DefenseCounselFirm.open_assignment_count decremented by 1"

  - entity: SettlementNegotiation
    initial_state: AUTHORITY_REQUESTED
    terminal_states: [PAID, ABANDONED]
    note: |
      Cyclic. A vetoed or authority-denied negotiation returns to
      AUTHORITY_REQUESTED through a revision, incrementing round_index and
      clearing authority_granted and physician_response, so the same row can
      traverse the consent loop repeatedly until it is PAID or ABANDONED.
    transitions:
      - from: AUTHORITY_REQUESTED
        to: AUTHORITY_GRANTED
        trigger: "POST /mpl/settlement-negotiations/{id}/authority-decision with decision == GRANT"
        actor: ClaimsCommitteeApprover
        preconditions:
          - "SettlementNegotiation.status == AUTHORITY_REQUESTED"
          - "X-User-ID differs from prepared_by_user_id"
          - "granted_amount <= authority_requested"
          - "granted_amount > 0"
        side_effects:
          - "status set to AUTHORITY_GRANTED; authority_granted and approved_by_user_id recorded"
      - from: AUTHORITY_REQUESTED
        to: AUTHORITY_DENIED
        trigger: "POST /mpl/settlement-negotiations/{id}/authority-decision with decision == DENY"
        actor: ClaimsCommitteeApprover
        preconditions:
          - "SettlementNegotiation.status == AUTHORITY_REQUESTED"
          - "X-User-ID differs from prepared_by_user_id"
        side_effects:
          - "status set to AUTHORITY_DENIED; approved_by_user_id recorded; authority_granted left null"
      - from: AUTHORITY_GRANTED
        to: CONSENT_REQUESTED
        trigger: "POST /mpl/settlement-negotiations/{id}/consent-request"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementNegotiation.status == AUTHORITY_GRANTED"
          - "consent_clause_applied IN {ABSOLUTE, HAMMER}"
        side_effects:
          - "status set to CONSENT_REQUESTED and consent_requested_at set to the current logical timestamp"
      - from: CONSENT_REQUESTED
        to: CONSENT_GRANTED
        trigger: "POST /mpl/settlement-negotiations/{id}/consent-response with response == CONSENTED"
        actor: Insured
        preconditions:
          - "SettlementNegotiation.status == CONSENT_REQUESTED"
          - "X-User-ID equals the Claim's insured_id"
        side_effects:
          - "status set to CONSENT_GRANTED and physician_response set to CONSENTED"
      - from: CONSENT_REQUESTED
        to: VETOED
        trigger: "POST /mpl/settlement-negotiations/{id}/consent-response with response == VETOED"
        actor: Insured
        preconditions:
          - "SettlementNegotiation.status == CONSENT_REQUESTED"
          - "X-User-ID equals the Claim's insured_id"
        side_effects:
          - "status set to VETOED; physician_response set to VETOED and veto_reason recorded"
      - from: VETOED
        to: AUTHORITY_REQUESTED
        trigger: "POST /mpl/settlement-negotiations/{id}/revision"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementNegotiation.status IN {VETOED, AUTHORITY_DENIED}"
          - "Claim.claim_status IN {INVESTIGATION, LITIGATION}"
        side_effects:
          - "status set back to AUTHORITY_REQUESTED (loop back)"
          - "round_index incremented by 1"
          - "proposed_amount and authority_requested overwritten with the submitted values"
          - "authority_granted, approved_by_user_id, physician_response and veto_reason reset to null"
          - "prepared_by_user_id set to the revising X-User-ID"
      - from: AUTHORITY_DENIED
        to: AUTHORITY_REQUESTED
        trigger: "POST /mpl/settlement-negotiations/{id}/revision"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementNegotiation.status IN {VETOED, AUTHORITY_DENIED}"
          - "Claim.claim_status IN {INVESTIGATION, LITIGATION}"
        side_effects:
          - "status set back to AUTHORITY_REQUESTED (loop back)"
          - "round_index incremented by 1"
          - "authority_granted and approved_by_user_id reset to null"
      - from: VETOED
        to: HAMMER_INVOKED
        trigger: "POST /mpl/settlement-negotiations/{id}/hammer-invocation"
        actor: ClaimsCommitteeApprover
        preconditions:
          - "SettlementNegotiation.status == VETOED"
          - "consent_clause_applied == HAMMER"
        side_effects:
          - "status set to HAMMER_INVOKED, hammer_invoked set to true, notice_sent_on recorded"
          - "hammer_exposure_estimate, insured_share_amount and carrier_share_amount set from settlement_insured_share"
          - "Claim.insured_share_receivable increased by insured_share_amount"
      - from: AUTHORITY_GRANTED
        to: PAID
        trigger: "POST /mpl/settlement-negotiations/{id}/payment when consent_clause_applied == NONE"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementNegotiation.status IN {AUTHORITY_GRANTED, CONSENT_GRANTED, HAMMER_INVOKED}"
          - "consent_clause_applied == NONE"
          - "proposed_amount <= authority_granted"
          - "proposed_amount <= Policy.limit_per_claim"
          - "proposed_amount <= PolicyTerm.aggregate_limit_remaining"
        side_effects:
          - "status set to PAID; paid_amount set to proposed_amount and payment_date recorded"
          - "the full Claim resolution cascade described on the Claim state machine is applied"
      - from: CONSENT_GRANTED
        to: PAID
        trigger: "POST /mpl/settlement-negotiations/{id}/payment"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementNegotiation.status IN {AUTHORITY_GRANTED, CONSENT_GRANTED, HAMMER_INVOKED}"
          - "proposed_amount <= authority_granted"
          - "proposed_amount <= Policy.limit_per_claim"
          - "proposed_amount <= PolicyTerm.aggregate_limit_remaining"
        side_effects:
          - "status set to PAID; paid_amount set to proposed_amount and payment_date recorded"
          - "the full Claim resolution cascade described on the Claim state machine is applied"
      - from: HAMMER_INVOKED
        to: PAID
        trigger: "POST /mpl/settlement-negotiations/{id}/payment"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementNegotiation.status IN {AUTHORITY_GRANTED, CONSENT_GRANTED, HAMMER_INVOKED}"
          - "proposed_amount <= authority_granted"
          - "proposed_amount <= PolicyTerm.aggregate_limit_remaining"
        side_effects:
          - "status set to PAID; paid_amount set to carrier_share_amount, payment_date recorded"
          - "the full Claim resolution cascade described on the Claim state machine is applied"
        note: "Under an invoked hammer the carrier disburses only carrier_share_amount; the balance stays on Claim.insured_share_receivable."
      - from: AUTHORITY_REQUESTED
        to: ABANDONED
        trigger: "POST /mpl/claims/{id}/settlement-negotiations creating a newer negotiation on the same claim"
        actor: system
        preconditions:
          - "SettlementNegotiation.status NOT IN {PAID, ABANDONED}"
        side_effects:
          - "status set to ABANDONED"
        note: "CREATE-with-supersede: the newer negotiation legitimately supersedes the prior open one, which is why this write is guarded by OCC on Claim.version (§1.2.1)."
      - from: VETOED
        to: ABANDONED
        trigger: "POST /mpl/policy-terms/{id}/cancellation with cancel_type == FLAT voiding the claim's coverage"
        actor: system
        preconditions:
          - "SettlementNegotiation.status NOT IN {PAID, ABANDONED}"
        side_effects:
          - "status set to ABANDONED"

  - entity: NPDBReport
    initial_state: PENDING
    terminal_states: [SUBMITTED, VOID]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /mpl/npdb-reports/{id}/submission"
        actor: ComplianceOfficer
        preconditions:
          - "NPDBReport.report_status == PENDING"
          - "submitted_on is on or after payment_date"
        side_effects:
          - "report_status set to SUBMITTED; submitted_on and submitter_note recorded"
          - "submitted_late set to (submitted_on > due_date) and days_late set to max(0, submitted_on - due_date) in whole days"
          - "Insured.npdb_reported_payment_total increased by payment_amount"
      - from: PENDING
        to: VOID
        trigger: "POST /mpl/npdb-reports/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "NPDBReport.report_status == PENDING"
        side_effects:
          - "report_status set to VOID and void_reason recorded"
      - from: PENDING
        to: VOID
        trigger: "system creation for a non-reportable payment"
        actor: system
        preconditions:
          - "npdb_reportability returned reportable == false"
        side_effects:
          - "report_status set to VOID at creation with non_reportable_reason and void_reason populated"

  - entity: RateFiling
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mpl/rate-filings/{id}/submission"
        actor: ActuarialAnalyst
        preconditions:
          - "RateFiling.status == DRAFT"
        side_effects:
          - "status set to SUBMITTED"
          - "the full actuarial block is recomputed: claim_count_in_scope, in_scope_premium_total, actuarial_incurred_total, experience_loss_ratio, indicated_change_pct, credibility_weight, credibility_weighted_indication_pct, carried_reserve_total, required_reserve_total, reserve_adequacy_ratio, adequacy_flag"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mpl/rate-filings/{id}/decision with decision == APPROVE"
        actor: ChiefActuary
        preconditions:
          - "RateFiling.status == SUBMITTED"
          - "X-User-ID differs from prepared_by_user_id"
          - "adequacy_flag != DEFICIENT"
        side_effects:
          - "status set to APPROVED; approved_rate_change_pct set to proposed_rate_change_pct; decided_by_user_id and decision_note recorded"
          - "SpecialtyClass.base_rate_per_million set to round(old_base_rate * (1 + approved_rate_change_pct / 100), 2)"
          - "SpecialtyClass.rate_revision_index incremented by 1 and last_approved_rate_change_pct recorded"
          - "every PolicyTerm with status == DRAFT on policies whose insured belongs to this SpecialtyClass is re-rated against the new base rate"
          - "Policy.quoted_premium_total recomputed for each affected Policy"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mpl/rate-filings/{id}/decision with decision == REJECT"
        actor: ChiefActuary
        preconditions:
          - "RateFiling.status == SUBMITTED"
          - "X-User-ID differs from prepared_by_user_id"
        side_effects:
          - "status set to REJECTED; decided_by_user_id and decision_note recorded"
          - "SpecialtyClass.base_rate_per_million left unchanged"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /mpl/rate-filings/{id}/decision with decision == WITHDRAW"
        actor: ChiefActuary
        preconditions:
          - "RateFiling.status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "status set to WITHDRAWN and decision_note recorded"
        note: "WITHDRAW is exempt from the segregation-of-duties check: the preparer may withdraw their own filing."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /mpl/rate-filings/{id}/decision with decision == WITHDRAW"
        actor: ChiefActuary
        preconditions:
          - "RateFiling.status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "status set to WITHDRAWN and decision_note recorded"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reserve-entry-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /mpl/claims/{id}/reserve-entries"
    occ_field: "expected_claim_version"
    description: |
      Posting a ReserveEntry against a Claim whose version has advanced since
      the client last observed it is rejected. A newly posted entry legitimately
      supersedes the previous reserve of record, so a writer holding a stale view
      of the claim would silently overwrite a reserve movement it never saw; the
      stale-version check rejects it instead.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: negotiation-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /mpl/claims/{id}/settlement-negotiations"
    occ_field: "expected_claim_version"
    description: |
      Creating a SettlementNegotiation against a Claim whose version has advanced
      since the client last observed it is rejected. A new negotiation legitimately
      supersedes the prior open one (which is moved to ABANDONED), so a writer
      working from a stale claim view would abandon an offer it never read.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-insured
    parent_entity: Insured
    write_endpoint: "POST /mpl/insureds/{id}/enrollments"
    occ_field: "expected_insured_version"
    description: |
      Enrolling an Insured in a risk-management program when the Insured's version
      has advanced since the client last observed it is rejected. A new enrollment
      legitimately supersedes the insured's prior participation profile and moves
      the stacked-credit total, so a writer holding a stale insured view would
      compute the credit from a superseded profile.
    error_id: ERR_STALE_INSURED_VERSION
    http_status: 412

  - rule_id: term-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /mpl/policies/{id}/terms"
    occ_field: "expected_policy_version"
    description: |
      Creating a PolicyTerm against a Policy whose version has advanced since the
      client last observed it is rejected. A new term legitimately supersedes the
      policy's prior quoted premium picture and step progression, so a writer
      holding a stale policy view would build a step chain on a superseded base.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: insured_risk_classification
    trigger: "On Insured creation, whenever Insured.closed_paid_claim_count or open_claim_count changes, and on every PolicyTerm rating pass"
    algorithm: weighted_scoring
    formula: |
      specialty_component   = SpecialtyClass.hazard_index
      procedure_component   = round(Insured.high_severity_procedure_pct / 10, 4)

      # variant-dependent claim-history component
      if variant == UNDERWRITING_SNAPSHOT:
          history_raw = CLOSED_PAID_WEIGHT * Insured.closed_paid_claim_count
      else:  # RENEWAL_PROSPECTIVE
          history_raw = CLOSED_PAID_WEIGHT * Insured.closed_paid_claim_count
                        + OPEN_CLAIM_WEIGHT * Insured.open_claim_count
      history_component = min(HISTORY_COMPONENT_CAP, history_raw)

      risk_class_score = round(  W_SPECIALTY * specialty_component
                               + W_PROCEDURE * procedure_component
                               + W_HISTORY   * history_component, 2)

      # band assignment (lower bound inclusive, upper bound exclusive)
      if risk_class_score <  3.00: risk_class_code = R1
      elif risk_class_score <  5.00: risk_class_code = R2
      elif risk_class_score <  7.50: risk_class_code = R3
      else:                          risk_class_code = R4

      risk_class_factor = RISK_CLASS_FACTOR[risk_class_code]
    input_set: "The Insured's SpecialtyClass plus the Insured's own claim counters. Claim rows are never re-scanned here; only the two maintained counters are read."
    constants:
      W_SPECIALTY: 0.40
      W_PROCEDURE: 0.35
      W_HISTORY: 0.25
      CLOSED_PAID_WEIGHT: 2.0
      OPEN_CLAIM_WEIGHT: 1.0
      HISTORY_COMPONENT_CAP: 10.0
      RISK_CLASS_BAND_R2_MIN: 3.00
      RISK_CLASS_BAND_R3_MIN: 5.00
      RISK_CLASS_BAND_R4_MIN: 7.50
      RISK_CLASS_FACTOR: { R1: 0.85, R2: 1.00, R3: 1.30, R4: 1.75 }
    precision: "risk_class_score 2 decimal places, procedure_component 4 decimal places, round_half_up"
    variants:
      - name: UNDERWRITING_SNAPSHOT
        when: "Insured.risk_class_* fields, and any PolicyTerm whose predecessor_term_id is null (first term of a step chain)"
        difference: "Open claims are excluded entirely from the history component; only closed paid claims count."
      - name: RENEWAL_PROSPECTIVE
        when: "Any PolicyTerm whose predecessor_term_id is non-null (a renewal in the step chain)"
        difference: "Open claims are added to the history component at OPEN_CLAIM_WEIGHT, so the same underlying data can land the renewal in a higher band than the insured's own snapshot band."

  - name: claims_made_step_premium
    trigger: "On PolicyTerm creation and on every re-rating of a DRAFT PolicyTerm"
    algorithm: tiered_pricing
    formula: |
      # step year
      if Policy.coverage_form == CLAIMS_MADE:
          claims_made_step_year = min(5, PolicyTerm.term_index + Policy.prior_acts_step_credit)
          step_factor = STEP_FACTOR[claims_made_step_year]
      else:  # OCCURRENCE
          claims_made_step_year = 5
          step_factor = 1.00

      increased_limits_factor = INCREASED_LIMITS_FACTOR[Policy.limit_per_claim]
      venue_severity_factor   = VENUE_SEVERITY_FACTOR[Insured.venue_code]
      rated_risk_class_factor = insured_risk_classification(variant = PolicyTerm.rating_variant).risk_class_factor

      # PINNED four-stage rounding ladder: each stage rounds to 2 dp before the next
      S1 = round(SpecialtyClass.base_rate_per_million * increased_limits_factor, 2)
      S2 = round(S1 * rated_risk_class_factor, 2)
      S3 = round(S2 * venue_severity_factor, 2)
      S4 = round(S3 * step_factor, 2)
      premium_manual = S4

      credit_pct_applied    = program_credit_pct(Insured, as_of = PolicyTerm.effective_date)
      surcharge_pct_applied = peer_review_surcharge_pct(Insured, as_of = PolicyTerm.effective_date)
      premium_net = round(premium_manual * (1 - credit_pct_applied + surcharge_pct_applied), 2)

      # PINNED fee evaluation order: the admin-fee tier is keyed on premium_net,
      # NOT on term_total; the guaranty-fund assessment is keyed on
      # (premium_net + administrative_fee), NOT on term_total.
      if   premium_net <  ADMIN_FEE_TIER_1_MAX: administrative_fee = 250.00
      elif premium_net <  ADMIN_FEE_TIER_2_MAX: administrative_fee = 500.00
      else:                                     administrative_fee = 900.00

      guaranty_fund_assessment = round(GUARANTY_FUND_RATE * (premium_net + administrative_fee), 2)
      term_total = round(premium_net + administrative_fee + guaranty_fund_assessment, 2)
    input_set: "The PolicyTerm's Policy, that Policy's Insured, and that Insured's SpecialtyClass at its current rate_revision_index. Only PolicyTerm rows with status == DRAFT are ever re-rated; ISSUED, IN_FORCE and terminal terms keep their frozen premium."
    constants:
      STEP_FACTOR: { 1: 0.35, 2: 0.60, 3: 0.80, 4: 0.92, 5: 1.00 }
      MAX_STEP_YEAR: 5
      INCREASED_LIMITS_FACTOR: { 1000000.00: 1.00, 2000000.00: 1.45, 3000000.00: 1.75, 5000000.00: 2.10 }
      VENUE_SEVERITY_FACTOR: { COOK_IL: 1.45, MIAMI_DADE_FL: 1.60, KINGS_NY: 1.35, TRAVIS_TX: 1.05, MARICOPA_AZ: 1.00 }
      ADMIN_FEE_TIER_1_MAX: 25000.00
      ADMIN_FEE_TIER_2_MAX: 100000.00
      ADMIN_FEE_TIERS: { TIER_1: 250.00, TIER_2: 500.00, TIER_3: 900.00 }
      GUARANTY_FUND_RATE: 0.0125
    precision: "every stage 2 decimal places, round_half_up; intermediate values are NOT carried at full precision"

  - name: pro_rata_return_premium
    trigger: "On POST /mpl/policy-terms/{id}/cancellation"
    algorithm: proration
    formula: |
      if cancel_type == FLAT:
          return_premium = PolicyTerm.premium_net
      else:  # PRO_RATA
          term_days     = (expiration_date - effective_date) in whole days
          unearned_days = (expiration_date - cancel_effective_date) in whole days
          return_premium = round(PolicyTerm.premium_net * unearned_days / term_days, 2)
    input_set: "The single PolicyTerm being cancelled. Day counts are calendar days over the half-open term interval [effective_date, expiration_date)."
    constants: {}
    precision: "2 decimal places, round_half_up; the ratio is applied to premium_net at full precision then rounded once"

  - name: program_credit_pct
    trigger: "On PolicyTerm rating, on RiskProgramEnrollment completion, and when an enrollment expires"
    algorithm: aggregation
    formula: |
      window_start = as_of_date - CREDIT_LOOKBACK_DAYS
      eligible = RiskProgramEnrollment rows where
                   insured_id == Insured.id
                   AND status == COMPLETED
                   AND completed_on <= as_of_date
                   AND completed_on >= window_start
      # de-duplicate: at most one credit per program_code, taking the row with the
      # latest completed_on; ties broken by created_at ASC
      per_program = for each distinct program_code in eligible,
                      the row with max completed_on (tie-break created_at ASC)
      raw_credit = sum over per_program of PROGRAM_CREDIT_PCT[program_code]
      credit_pct_applied = min(MAX_STACKED_CREDIT_PCT, round(raw_credit, 4))
    input_set: "Only RiskProgramEnrollment rows in status COMPLETED are counted; ENROLLED and EXPIRED rows contribute nothing."
    constants:
      PROGRAM_CREDIT_PCT: { CME_RISK_101: 0.03, SIM_LAB: 0.05, CHART_AUDIT: 0.04, TEAMSTEPPS: 0.02, EHR_SAFETY: 0.025 }
      MAX_STACKED_CREDIT_PCT: 0.10
      CREDIT_LOOKBACK_DAYS: 730
    precision: "4 decimal places, round_half_up"

  - name: peer_review_surcharge_pct
    trigger: "On PolicyTerm rating and on PeerReviewCase closure"
    algorithm: aggregation
    formula: |
      window_start = as_of_date - SURCHARGE_LOOKBACK_DAYS
      eligible = PeerReviewCase rows where
                   insured_id == Insured.id
                   AND status == CLOSED
                   AND closed_on <= as_of_date
                   AND closed_on >= window_start
      if eligible is empty:
          surcharge_pct_applied = 0.00
      else:
          surcharge_pct_applied = max over eligible of
                                    PEER_REVIEW_SURCHARGE_PCT[committee_vote_result]
    input_set: "Only CLOSED PeerReviewCase rows inside the lookback window; REFERRED, IN_REVIEW and REVIEWS_COMPLETE cases contribute nothing. Surcharges are NOT additive - the worst verdict governs."
    constants:
      PEER_REVIEW_SURCHARGE_PCT: { NO_DEVIATION: 0.00, DEVIATION_MINOR: 0.10, DEVIATION_MAJOR: 0.25 }
      SURCHARGE_LOOKBACK_DAYS: 1095
    precision: "4 decimal places, round_half_up"

  - name: coverage_trigger_resolution
    trigger: "On POST /mpl/claims (claim intake)"
    algorithm: interval_merge
    formula: |
      candidate_terms = PolicyTerm rows where
                          Policy.insured_id == Claim.insured_id
                          AND status IN {IN_FORCE, EXPIRED, CANCELLED_PRO_RATA}
      if Policy.coverage_form == CLAIMS_MADE:
          # half-open term window on report_date, plus the prior-acts test
          responding = candidate_terms where
                         effective_date <= report_date < expiration_date
          if responding is non-empty AND Claim.incident_date < Policy.retroactive_date:
              coverage_status = DENIED; denial_reason = PRIOR_ACTS_EXCLUDED
              policy_term_id = null
          elif responding is non-empty:
              policy_term_id = the responding term with the latest effective_date
                               (tie-break created_at ASC)
              coverage_status = UNDER_REVIEW
          else:
              # closed extended-reporting window on report_date
              tails = TailEndorsement rows where policy_id in the insured's policies
                        AND status == ISSUED
                        AND effective_date <= report_date <= reporting_window_end
                        AND the triggering term's period contains incident_date
              if tails is non-empty:
                  tail_endorsement_id = the tail with the latest effective_date
                                        (tie-break created_at ASC)
                  policy_term_id      = that tail's triggering_term_id
                  coverage_status     = UNDER_REVIEW
              else:
                  coverage_status = DENIED; denial_reason = NO_RESPONDING_COVERAGE
      else:  # OCCURRENCE - the incident date triggers, the report date is irrelevant
          responding = candidate_terms where
                         effective_date <= incident_date < expiration_date
          if responding is non-empty:
              policy_term_id  = the responding term with the latest effective_date
              coverage_status = UNDER_REVIEW
          else:
              coverage_status = DENIED; denial_reason = NO_RESPONDING_COVERAGE

      # severity band, independent of the coverage outcome
      if   demand_amount <  SEVERITY_BAND_2_MIN: severity_band = BAND_1
      elif demand_amount <  SEVERITY_BAND_3_MIN: severity_band = BAND_2
      elif demand_amount <  SEVERITY_BAND_4_MIN: severity_band = BAND_3
      else:                                      severity_band = BAND_4
      severity_band_factor = SEVERITY_BAND_FACTOR[severity_band]
    input_set: "PolicyTerm rows with status IN {IN_FORCE, EXPIRED, CANCELLED_PRO_RATA} are candidates; DRAFT, ISSUED and CANCELLED_FLAT terms never respond. TailEndorsement rows must be ISSUED; QUOTED and VOID tails never respond. Term windows are half-open [effective_date, expiration_date); tail windows are CLOSED [effective_date, reporting_window_end]."
    constants:
      SEVERITY_BAND_2_MIN: 250000.00
      SEVERITY_BAND_3_MIN: 750000.00
      SEVERITY_BAND_4_MIN: 2000000.00
      SEVERITY_BAND_FACTOR: { BAND_1: 0.20, BAND_2: 0.32, BAND_3: 0.45, BAND_4: 0.60 }
    precision: "severity_band_factor exact from the table; demand comparisons at 2 decimal places"

  - name: case_reserve_projection
    trigger: "On POST /mpl/claims/{id}/reserve-entries and whenever the effective ReserveEntry of a Claim changes"
    algorithm: threshold
    formula: |
      if method == CASE_BASIS:
          computed_indemnity_amount = round(indemnity_amount, 2)
          computed_expense_amount   = round(expense_amount, 2)
      else:  # FORMULA_BASIS
          raw_indemnity = round(  Claim.demand_amount
                                * Claim.severity_band_factor
                                * VENUE_SEVERITY_FACTOR[Claim.venue_code], 2)
          computed_indemnity_amount = min(raw_indemnity, Policy.limit_per_claim)
          computed_expense_amount   = max(round(computed_indemnity_amount * EXPENSE_RATIO, 2),
                                          EXPENSE_RESERVE_FLOOR)

      # the reserve of record on the Claim
      effective_entry = ReserveEntry rows for the claim
                          ORDER BY effective_at DESC, created_at DESC
                          LIMIT 1
      Claim.indemnity_reserve      = effective_entry.computed_indemnity_amount (0.00 when none)
      Claim.expense_reserve        = effective_entry.computed_expense_amount   (0.00 when none)
      Claim.reserve_method_current = effective_entry.method                    (null when none)
    input_set: "All ReserveEntry rows for the claim, regardless of who posted them. The entry with the greatest effective_at wins even when a later-created entry carries an earlier effective_at; created_at DESC only breaks exact effective_at ties."
    constants:
      EXPENSE_RATIO: 0.28
      EXPENSE_RESERVE_FLOOR: 15000.00
    precision: "2 decimal places, round_half_up; the per-claim limit cap is applied after rounding, the expense floor after rounding"
    variants:
      - name: CASE_BASIS
        when: "The adjuster supplies indemnity_amount and expense_amount explicitly"
        difference: "Both amounts are taken verbatim; neither the per-claim limit cap nor the expense floor is applied."
      - name: FORMULA_BASIS
        when: "The adjuster supplies neither amount and asks the system to project the reserve"
        difference: "Both amounts are derived from demand, severity band and venue; the indemnity is capped at the per-claim limit and the expense is floored at EXPENSE_RESERVE_FLOOR."

  - name: claim_incurred_loss
    trigger: "On every ReserveEntry posting, expense payment, indemnity payment and claim disposition"
    algorithm: aggregation
    formula: |
      if variant == CASE_INCURRED:
          # paid amounts are treated as having consumed the reserve
          incurred = round(  Claim.paid_indemnity
                           + Claim.paid_expense
                           + max(0.00, Claim.indemnity_reserve - Claim.paid_indemnity)
                           + max(0.00, Claim.expense_reserve   - Claim.paid_expense), 2)
      else:  # ACTUARIAL_INCURRED
          # paid amounts sit on top of the full carried reserve
          incurred = round(  Claim.paid_indemnity
                           + Claim.paid_expense
                           + Claim.indemnity_reserve
                           + Claim.expense_reserve, 2)
    input_set: "The single Claim's four money fields. Both variants are always maintained on the Claim row; nothing is recomputed from ReserveEntry history."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CASE_INCURRED
        when: "Claim.case_incurred - the field the claims department reports"
        difference: "Payments erode the carried reserve, so paid dollars are not double-counted; the two clamps make the result flat once payments exceed the reserve."
      - name: ACTUARIAL_INCURRED
        when: "Claim.actuarial_incurred - the field feeding rate filings and reserve adequacy"
        difference: "The carried reserve is added in full on top of payments, so identical claim data yields a strictly greater or equal figure; the delta equals min(paid_indemnity, indemnity_reserve) + min(paid_expense, expense_reserve)."

  - name: counsel_panel_selection
    trigger: "On POST /mpl/claims/{id}/counsel-assignments"
    algorithm: ranked_selection
    formula: |
      candidates = DefenseCounselFirm rows where
                     panel_status == ACTIVE
                     AND Claim.venue_code IN admitted_venue_codes
                     AND Claim.allegation_category IN allegation_specialties
                     AND Claim.insured_id NOT IN conflict_insured_ids
                     AND open_assignment_count < max_concurrent_assignments
                     AND id NOT IN Claim.excluded_counsel_firm_ids
      candidate_pool_size = count(candidates)
      if candidate_pool_size == 0: raise ERR_NO_ELIGIBLE_COUNSEL
      ranked = candidates ORDER BY quality_score DESC,
                                   blended_hourly_rate ASC,
                                   created_at ASC
      selected = ranked[0]
      selection_rank_snapshot = 1
    input_set: "Only ACTIVE panel firms. PROBATION and REMOVED firms are excluded even when otherwise qualified. Firms at capacity are excluded rather than queued."
    constants: {}
    precision: "N/A - selection only; ties are broken deterministically by created_at ASC and never by id"

  - name: settlement_insured_share
    trigger: "On POST /mpl/settlement-negotiations/{id}/hammer-invocation"
    algorithm: threshold
    formula: |
      hammer_exposure_estimate = round(min(  SettlementNegotiation.proposed_amount
                                           * HAMMER_EXPOSURE_MULTIPLIER,
                                           Policy.limit_per_claim), 2)
      excess_over_offer = max(0.00, hammer_exposure_estimate
                                    - SettlementNegotiation.proposed_amount)
      insured_share_amount = round(excess_over_offer * HAMMER_INSURED_SHARE_PCT, 2)
      carrier_share_amount = round(hammer_exposure_estimate - insured_share_amount, 2)
    input_set: "The single SettlementNegotiation and its Claim's responding Policy. The per-claim limit caps the projected verdict exposure before the split, so a very large offer produces a smaller insured share than the uncapped formula would."
    constants:
      HAMMER_EXPOSURE_MULTIPLIER: 1.60
      HAMMER_INSURED_SHARE_PCT: 0.50
    precision: "2 decimal places, round_half_up; the min() cap is applied before the max() excess, which is applied before the share split"

  - name: npdb_reportability
    trigger: "Whenever an indemnity payment is disbursed (settlement payment or plaintiff verdict)"
    algorithm: threshold
    formula: |
      reportable = (payment_amount > 0.00)
                   AND (Insured.entity_type == PHYSICIAN)
                   AND (Claim.disposition IN {SETTLED, PLAINTIFF_VERDICT})
      if not reportable:
          if Insured.entity_type != PHYSICIAN:
              non_reportable_reason = NON_PRACTITIONER_PAYMENT
          else:
              non_reportable_reason = ZERO_DOLLAR_RESOLUTION
          report_status = VOID
      else:
          non_reportable_reason = null
          report_status = PENDING
      due_date = payment_date + NPDB_REPORTING_DAYS days
    input_set: "One NPDBReport is created per disbursement event. Dispositions DEFENSE_VERDICT, DISMISSED and WITHDRAWN disburse nothing and create no report at all."
    constants:
      NPDB_REPORTING_DAYS: 30
      ZERO_PAYMENT_THRESHOLD: 0.00
    precision: "payment_amount 2 decimal places; due_date and days_late in whole calendar days"

  - name: tail_premium
    trigger: "On POST /mpl/policies/{id}/tail-endorsements"
    algorithm: threshold
    formula: |
      mature_premium_basis = round(triggering_term.premium_manual
                                   / triggering_term.step_factor, 2)
      tail_factor  = TAIL_FACTOR[tail_type]
      tail_premium = round(mature_premium_basis * tail_factor, 2)

      if tail_type == ERP_5YR:
          reporting_window_end = effective_date + 5 years - 1 day
      else:  # ERP_UNLIMITED and DEATH_DISABILITY_RETIREMENT
          reporting_window_end = UNLIMITED_WINDOW_END

      # DEATH_DISABILITY_RETIREMENT is free but gated
      ddr_eligible = (Insured.years_in_practice >= DDR_MIN_YEARS_IN_PRACTICE)
                     AND (triggering_term.claims_made_step_year >= DDR_MIN_STEP_YEAR)
    input_set: "The triggering PolicyTerm only. The step factor is divided out so that the tail is always priced off the mature (step-5) premium, never off the discounted step premium actually charged."
    constants:
      TAIL_FACTOR: { ERP_5YR: 1.55, ERP_UNLIMITED: 2.00, DEATH_DISABILITY_RETIREMENT: 0.00 }
      DDR_MIN_YEARS_IN_PRACTICE: 5
      DDR_MIN_STEP_YEAR: 5
      ERP_5YR_WINDOW_YEARS: 5
      UNLIMITED_WINDOW_END: "9999-12-31"
    precision: "2 decimal places, round_half_up; the ERP_5YR window end is inclusive, computed as effective_date + 5 years - 1 day"

  - name: reserve_adequacy_ratio
    trigger: "On POST /mpl/rate-filings and on POST /mpl/rate-filings/{id}/submission"
    algorithm: aggregation
    formula: |
      scope = Claim rows where
                Insured.specialty_class_id == RateFiling.specialty_class_id
                AND coverage_status IN {COVERED, RESERVED_RIGHTS}
                AND experience_period_start <= report_date <= experience_period_end
      claim_count_in_scope = count(scope)

      # PINNED order: round each claim's required reserve to 2 dp FIRST, then sum
      required_reserve_total = sum over scope of
          round(  Claim.demand_amount
                * Claim.severity_band_factor
                * VENUE_SEVERITY_FACTOR[Claim.venue_code]
                * (1 + EXPENSE_RATIO), 2)
      carried_reserve_total  = sum over scope of
          round(Claim.indemnity_reserve + Claim.expense_reserve, 2)

      if required_reserve_total == 0.00:
          reserve_adequacy_ratio = null
          adequacy_flag = NOT_EVALUABLE
      else:
          reserve_adequacy_ratio = round(carried_reserve_total
                                         / required_reserve_total, 4)
          if   reserve_adequacy_ratio <  ADEQUACY_DEFICIENT_MAX: adequacy_flag = DEFICIENT
          elif reserve_adequacy_ratio <= ADEQUACY_REDUNDANT_MIN: adequacy_flag = ADEQUATE
          else:                                                  adequacy_flag = REDUNDANT
    input_set: "Only Claim rows whose coverage_status is COVERED or RESERVED_RIGHTS enter the scope; UNDER_REVIEW and DENIED claims are excluded regardless of their reserves. Claims are selected on report_date, inclusive at both ends."
    constants:
      EXPENSE_RATIO: 0.28
      ADEQUACY_DEFICIENT_MAX: 0.90
      ADEQUACY_REDUNDANT_MIN: 1.10
    precision: "per-claim amounts 2 decimal places then summed; the ratio 4 decimal places, round_half_up. The flag boundaries are inclusive at 0.9000 (ADEQUATE) and at 1.1000 (ADEQUATE)."

  - name: rate_indication
    trigger: "On POST /mpl/rate-filings and on POST /mpl/rate-filings/{id}/submission"
    algorithm: weighted_scoring
    formula: |
      scope_terms = PolicyTerm rows where
                      Policy.insured.specialty_class_id == RateFiling.specialty_class_id
                      AND status IN {IN_FORCE, EXPIRED, CANCELLED_PRO_RATA}
                      AND effective_date <= experience_period_end
                      AND expiration_date >  experience_period_start
      in_scope_premium_total   = sum over scope_terms of premium_net
      actuarial_incurred_total = sum over the reserve_adequacy_ratio claim scope
                                 of actuarial_incurred

      if in_scope_premium_total == 0.00:
          experience_loss_ratio = null
          indicated_change_pct  = null
      else:
          experience_loss_ratio = round(actuarial_incurred_total
                                        / in_scope_premium_total, 4)
          if indication_method == LOSS_RATIO_METHOD:
              indicated_change_pct = round((experience_loss_ratio
                                            / PERMISSIBLE_LOSS_RATIO - 1) * 100, 2)
          else:  # PURE_PREMIUM_METHOD
              pure_premium     = round(actuarial_incurred_total
                                       / claim_count_in_scope, 2)
              target_premium   = round(in_scope_premium_total
                                       / claim_count_in_scope, 2)
              indicated_change_pct = round((pure_premium
                                            / (target_premium * PERMISSIBLE_LOSS_RATIO)
                                            - 1) * 100, 2)

      if   claim_count_in_scope >= CREDIBILITY_FULL_CLAIMS:    credibility_weight = 1.00
      elif claim_count_in_scope >= CREDIBILITY_PARTIAL_CLAIMS: credibility_weight = 0.60
      else:                                                    credibility_weight = 0.30

      if indicated_change_pct is null:
          credibility_weighted_indication_pct = null
      else:
          credibility_weighted_indication_pct =
              round(  credibility_weight * indicated_change_pct
                    + (1 - credibility_weight) * TREND_COMPLEMENT_PCT, 2)
    input_set: "Premium comes only from PolicyTerm rows in status IN_FORCE, EXPIRED or CANCELLED_PRO_RATA whose half-open period overlaps the experience period; DRAFT, ISSUED and CANCELLED_FLAT terms contribute no premium. Losses come from the same claim scope the reserve adequacy review uses."
    constants:
      PERMISSIBLE_LOSS_RATIO: 0.6500
      CREDIBILITY_FULL_CLAIMS: 30
      CREDIBILITY_PARTIAL_CLAIMS: 10
      TREND_COMPLEMENT_PCT: 4.50
    precision: "ratios 4 decimal places, percentages 2 decimal places, round_half_up; the credibility blend is computed from the already-rounded indicated_change_pct"

  - name: severity_trend_index
    trigger: "On GET /mpl/analytics/severity-trend"
    algorithm: aggregation
    formula: |
      scope = Claim rows where
                Insured.specialty_class_id == specialty_class_id
                AND claim_status IN {RESOLVED, CLOSED}
                AND disposition IN {SETTLED, PLAINTIFF_VERDICT}
                AND (venue_code == venue_code filter, when supplied)
                AND (report_date >= from_report_date, when supplied)
                AND (report_date <= to_report_date,   when supplied)
      closed_severity_claim_count = count(scope)
      paid_indemnity_total        = round(sum over scope of paid_indemnity, 2)

      if closed_severity_claim_count == 0:
          paid_severity_avg = null
          trend_index       = null
      else:
          paid_severity_avg = round(paid_indemnity_total
                                    / closed_severity_claim_count, 2)
          trend_index       = round(paid_severity_avg
                                    / SpecialtyClass.benchmark_severity, 4)

      # verdict statistics use a SEPARATE, wider scope: the same specialty, venue
      # and report-date filters, but tried dispositions instead of paying ones
      verdict_scope = Claim rows matching the same specialty / venue / report-date
                      filters AND claim_status IN {RESOLVED, CLOSED}
                      AND disposition IN {DEFENSE_VERDICT, PLAINTIFF_VERDICT}
      defense_verdict_count   = count(verdict_scope where disposition == DEFENSE_VERDICT)
      plaintiff_verdict_count = count(verdict_scope where disposition == PLAINTIFF_VERDICT)
      verdict_total = defense_verdict_count + plaintiff_verdict_count
      defense_win_rate = null when verdict_total == 0,
                         else round(defense_verdict_count / verdict_total, 4)
      top_allegation_category = the allegation_category with the greatest count in
                                scope; ties broken by the earliest created_at among
                                the tied claims; null when scope is empty
    input_set: "The severity scope holds only claims that both reached RESOLVED or CLOSED and carry a paying disposition (SETTLED or PLAINTIFF_VERDICT); DISMISSED, WITHDRAWN and DEFENSE_VERDICT claims are excluded from the severity averages. The verdict scope is deliberately different: it holds tried claims (DEFENSE_VERDICT or PLAINTIFF_VERDICT), so a specialty whose only resolution is a settlement reports a severity average but a null defense_win_rate."
    constants: {}
    precision: "money 2 decimal places, indices and rates 4 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for Insured-facing endpoints, X-User-ID equals the insured_id of the resource's Claim or Policy"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /mpl/settlement-negotiations/{id}/consent-response; GET /mpl/insureds/{id}; GET /mpl/policies/{id}; GET /mpl/policy-terms/{id}; GET /mpl/tail-endorsements/{id}; GET /mpl/claims/{id}; GET /mpl/settlement-negotiations/{id} when acting as Insured"

  - priority: 4
    category: auth
    check: "the acting X-User-ID differs from the X-User-ID recorded as preparer: authority-decision requires X-User-ID != SettlementNegotiation.prepared_by_user_id, and rate-filing decision APPROVE or REJECT requires X-User-ID != RateFiling.prepared_by_user_id (WITHDRAW is exempt)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mpl/settlement-negotiations/{id}/authority-decision; POST /mpl/rate-filings/{id}/decision"

  - priority: 10
    category: business_constraint
    check: "request body carries every required field, every enum value is a declared member, every money field has at most 2 decimal places and is non-negative, and every declared numeric range holds"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 11
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 12
    category: business_constraint
    check: "specialty_code is not already used by another SpecialtyClass"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /mpl/specialty-classes"

  - priority: 13
    category: business_constraint
    check: "retroactive_date is present when coverage_form == CLAIMS_MADE and is absent or null when coverage_form == OCCURRENCE"
    error_id: ERR_RETRO_DATE_INVALID
    http_status: 422
    applies_to: "POST /mpl/policies"

  - priority: 14
    category: business_constraint
    check: "method == CASE_BASIS supplies both indemnity_amount and expense_amount; method == FORMULA_BASIS supplies neither"
    error_id: ERR_RESERVE_METHOD_INPUT_MISMATCH
    http_status: 422
    applies_to: "POST /mpl/claims/{id}/reserve-entries"

  - priority: 20
    category: existence
    check: "the SpecialtyClass named by a path segment or specialty_class_id exists"
    error_id: ERR_SPECIALTY_CLASS_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/specialty-classes/{id}; POST /mpl/insureds; POST /mpl/rate-filings"

  - priority: 21
    category: existence
    check: "the Insured named by a path segment or insured_id exists"
    error_id: ERR_INSURED_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/insureds/{id}; POST /mpl/insureds/{id}/credentialing-decision; POST /mpl/insureds/{id}/enrollments; POST /mpl/peer-review-cases; POST /mpl/policies; POST /mpl/claims"

  - priority: 22
    category: existence
    check: "the RiskProgramEnrollment named by a path segment exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/enrollments/{id}; POST /mpl/enrollments/{id}/completion"

  - priority: 23
    category: existence
    check: "the PeerReviewCase named by a path segment exists"
    error_id: ERR_PEER_REVIEW_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/peer-review-cases/{id}; POST /mpl/peer-review-cases/{id}/reviews; POST /mpl/peer-review-cases/{id}/committee-vote"

  - priority: 24
    category: existence
    check: "the Policy named by a path segment exists"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/policies/{id}; POST /mpl/policies/{id}/terms; POST /mpl/policies/{id}/tail-endorsements"

  - priority: 25
    category: existence
    check: "the PolicyTerm named by a path segment, by predecessor_term_id, or by triggering_term_id exists and belongs to the addressed Policy where the payload supplies it"
    error_id: ERR_POLICY_TERM_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/policy-terms/{id}; POST /mpl/policy-terms/{id}/issuance; POST /mpl/policy-terms/{id}/cancellation; POST /mpl/policies/{id}/terms; POST /mpl/policies/{id}/tail-endorsements"

  - priority: 26
    category: existence
    check: "the TailEndorsement named by a path segment exists"
    error_id: ERR_TAIL_ENDORSEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/tail-endorsements/{id}; POST /mpl/tail-endorsements/{id}/issuance"

  - priority: 27
    category: existence
    check: "the Claim named by a path segment exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/claims/{id}; GET /mpl/claims/{id}/reserve-entries; POST /mpl/claims/{id}/coverage-decision; POST /mpl/claims/{id}/reserve-entries; POST /mpl/claims/{id}/litigation; POST /mpl/claims/{id}/expense-payments; POST /mpl/claims/{id}/disposition; POST /mpl/claims/{id}/counsel-assignments; POST /mpl/claims/{id}/settlement-negotiations"

  - priority: 28
    category: existence
    check: "the DefenseCounselFirm named by a path segment exists"
    error_id: ERR_COUNSEL_FIRM_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/counsel-firms/{id}; POST /mpl/counsel-firms/{id}/panel-status"

  - priority: 29
    category: existence
    check: "the CounselAssignment named by a path segment or by counsel_assignment_id exists"
    error_id: ERR_COUNSEL_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/counsel-assignments/{id}; POST /mpl/counsel-assignments/{id}/decline; POST /mpl/claims/{id}/expense-payments"

  - priority: 30
    category: state
    check: "the OCC field required by the §1.2.1 rule guarding this endpoint equals the parent entity's current version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /mpl/claims/{id}/reserve-entries and POST /mpl/claims/{id}/settlement-negotiations use expected_claim_version -> ERR_STALE_CLAIM_VERSION; POST /mpl/insureds/{id}/enrollments uses expected_insured_version -> ERR_STALE_INSURED_VERSION; POST /mpl/policies/{id}/terms uses expected_policy_version -> ERR_STALE_POLICY_VERSION"

  - priority: 31
    category: existence
    check: "the SettlementNegotiation named by a path segment exists"
    error_id: ERR_NEGOTIATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/settlement-negotiations/{id}; POST /mpl/settlement-negotiations/{id}/authority-decision; POST /mpl/settlement-negotiations/{id}/consent-request; POST /mpl/settlement-negotiations/{id}/consent-response; POST /mpl/settlement-negotiations/{id}/revision; POST /mpl/settlement-negotiations/{id}/hammer-invocation; POST /mpl/settlement-negotiations/{id}/payment"

  - priority: 32
    category: existence
    check: "the NPDBReport named by a path segment exists"
    error_id: ERR_NPDB_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/npdb-reports/{id}; POST /mpl/npdb-reports/{id}/submission; POST /mpl/npdb-reports/{id}/void"

  - priority: 33
    category: existence
    check: "the RateFiling named by a path segment exists"
    error_id: ERR_RATE_FILING_NOT_FOUND
    http_status: 404
    applies_to: "GET /mpl/rate-filings/{id}; POST /mpl/rate-filings/{id}/submission; POST /mpl/rate-filings/{id}/decision"

  - priority: 40
    category: state
    check: "the addressed Insured is not SUSPENDED when a new Policy is being written for it"
    error_id: ERR_INSURED_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/policies"

  - priority: 41
    category: state
    check: "the addressed SettlementNegotiation is in a state from which the requested transition is declared: authority-decision requires AUTHORITY_REQUESTED; consent-request requires AUTHORITY_GRANTED; consent-response requires CONSENT_REQUESTED; revision requires VETOED or AUTHORITY_DENIED; hammer-invocation requires VETOED; payment requires AUTHORITY_GRANTED, CONSENT_GRANTED or HAMMER_INVOKED"
    error_id: ERR_NEGOTIATION_STATE_INVALID
    http_status: 409
    applies_to: "all POST /mpl/settlement-negotiations/{id}/* endpoints"

  - priority: 42
    category: state
    check: "the addressed Claim's claim_status permits the operation: coverage-decision requires INTAKE; litigation requires INVESTIGATION; reserve-entries requires INTAKE, INVESTIGATION or LITIGATION; counsel-assignments, settlement-negotiations, expense-payments and disposition require INVESTIGATION or LITIGATION"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/claims/{id}/coverage-decision; POST /mpl/claims/{id}/litigation; POST /mpl/claims/{id}/reserve-entries; POST /mpl/claims/{id}/counsel-assignments; POST /mpl/claims/{id}/settlement-negotiations; POST /mpl/claims/{id}/expense-payments; POST /mpl/claims/{id}/disposition"

  - priority: 43
    category: state
    check: "the addressed Claim's coverage_status is UNDER_REVIEW or RESERVED_RIGHTS; a claim already COVERED or DENIED cannot have its coverage re-decided"
    error_id: ERR_COVERAGE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /mpl/claims/{id}/coverage-decision"

  - priority: 44
    category: state
    check: "the addressed PolicyTerm's status permits the operation: issuance requires DRAFT; cancellation requires ISSUED or IN_FORCE; being named as triggering_term_id requires EXPIRED or CANCELLED_PRO_RATA; being named as predecessor_term_id requires any non-CANCELLED_FLAT status"
    error_id: ERR_TERM_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/policy-terms/{id}/issuance; POST /mpl/policy-terms/{id}/cancellation; POST /mpl/policies/{id}/terms; POST /mpl/policies/{id}/tail-endorsements"

  - priority: 45
    category: state
    check: "the addressed TailEndorsement is QUOTED"
    error_id: ERR_TAIL_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/tail-endorsements/{id}/issuance"

  - priority: 46
    category: state
    check: "the addressed RiskProgramEnrollment is ENROLLED"
    error_id: ERR_ENROLLMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/enrollments/{id}/completion"

  - priority: 47
    category: state
    check: "the addressed PeerReviewCase's status permits the operation: reviews requires REFERRED or IN_REVIEW; committee-vote requires REVIEWS_COMPLETE"
    error_id: ERR_PEER_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/peer-review-cases/{id}/reviews; POST /mpl/peer-review-cases/{id}/committee-vote"

  - priority: 48
    category: state
    check: "the addressed CounselAssignment is ASSIGNED"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/counsel-assignments/{id}/decline; POST /mpl/claims/{id}/expense-payments"

  - priority: 49
    category: state
    check: "the addressed NPDBReport is PENDING"
    error_id: ERR_NPDB_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/npdb-reports/{id}/submission; POST /mpl/npdb-reports/{id}/void"

  - priority: 50
    category: state
    check: "the addressed RateFiling's status permits the operation: submission requires DRAFT; decision APPROVE or REJECT requires SUBMITTED; decision WITHDRAW requires DRAFT or SUBMITTED"
    error_id: ERR_FILING_STATE_INVALID
    http_status: 409
    applies_to: "POST /mpl/rate-filings/{id}/submission; POST /mpl/rate-filings/{id}/decision"

  - priority: 51
    category: business_safety
    check: "at issuance the Insured's credentialing_status is CREDENTIALED or PROVISIONAL AND credentialing_expires_on is on or after the term's effective_date"
    error_id: ERR_CREDENTIALING_NOT_VALID_FOR_TERM
    http_status: 409
    applies_to: "POST /mpl/policy-terms/{id}/issuance"

  - priority: 52
    category: business_safety
    check: "defence counsel is only assigned to a claim whose coverage_status is UNDER_REVIEW, COVERED or RESERVED_RIGHTS; a DENIED claim carries no duty to defend"
    error_id: ERR_COVERAGE_DENIED_NO_DEFENSE
    http_status: 409
    applies_to: "POST /mpl/claims/{id}/counsel-assignments"

  - priority: 53
    category: business_safety
    check: "the committee vote carries a majority: votes_for > votes_against"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /mpl/peer-review-cases/{id}/committee-vote"

  - priority: 54
    category: business_safety
    check: "the hammer clause may only be invoked when the negotiation's consent_clause_applied is HAMMER; an ABSOLUTE consent clause gives the insured an unqualified veto and NONE gives no veto to override"
    error_id: ERR_HAMMER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /mpl/settlement-negotiations/{id}/hammer-invocation"

  - priority: 55
    category: business_safety
    check: "consent may only be requested when the negotiation's consent_clause_applied is ABSOLUTE or HAMMER; under NONE there is no consent-to-settle provision to exercise"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /mpl/settlement-negotiations/{id}/consent-request"

  - priority: 56
    category: business_safety
    check: "payment from AUTHORITY_GRANTED is only permitted when consent_clause_applied == NONE; under ABSOLUTE or HAMMER the insured's consent must first have been obtained or the hammer invoked"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /mpl/settlement-negotiations/{id}/payment"

  - priority: 57
    category: business_safety
    check: "a rate filing whose adequacy_flag is DEFICIENT may not be approved; the reserve deficiency must be cured and the filing resubmitted"
    error_id: ERR_RESERVE_DEFICIENCY_BLOCKS_FILING
    http_status: 409
    applies_to: "POST /mpl/rate-filings/{id}/decision with decision == APPROVE"

  - priority: 58
    category: business_safety
    check: "submitted_on is on or after the report's payment_date"
    error_id: ERR_NPDB_SUBMISSION_DATE_INVALID
    http_status: 422
    applies_to: "POST /mpl/npdb-reports/{id}/submission"

  - priority: 60
    category: business_temporal
    check: "report_date is on or after incident_date"
    error_id: ERR_REPORT_DATE_BEFORE_INCIDENT
    http_status: 422
    applies_to: "POST /mpl/claims"

  - priority: 61
    category: business_temporal
    check: "suit_filed_on is on or after the Claim's report_date, and resolved_on is on or after the Claim's report_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /mpl/claims/{id}/litigation; POST /mpl/claims/{id}/disposition"

  - priority: 62
    category: business_temporal
    check: "expiration_date is strictly after effective_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /mpl/policies/{id}/terms"

  - priority: 63
    category: business_temporal
    check: "experience_period_end is strictly after experience_period_start and effective_date is on or after experience_period_end"
    error_id: ERR_EXPERIENCE_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /mpl/rate-filings"

  - priority: 64
    category: business_temporal
    check: "when predecessor_term_id is supplied, the new term's effective_date equals the predecessor's expiration_date exactly; the claims-made step chain admits no gap and no back-dating"
    error_id: ERR_TERM_PERIOD_GAP
    http_status: 422
    applies_to: "POST /mpl/policies/{id}/terms"

  - priority: 65
    category: business_temporal
    check: "the new term's half-open period [effective_date, expiration_date) does not intersect the period of any existing PolicyTerm on the same Policy whose status is not CANCELLED_FLAT; a shared endpoint is legal adjacency, not an overlap"
    error_id: ERR_TERM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /mpl/policies/{id}/terms"

  - priority: 66
    category: business_temporal
    check: "cancel_effective_date equals effective_date when cancel_type == FLAT, and lies strictly between effective_date and expiration_date when cancel_type == PRO_RATA"
    error_id: ERR_CANCEL_DATE_INVALID
    http_status: 422
    applies_to: "POST /mpl/policy-terms/{id}/cancellation"

  - priority: 67
    category: business_temporal
    check: "the tail's effective_date is on or after the triggering term's expiration_date (or cancel_effective_date when the term was cancelled pro rata)"
    error_id: ERR_TAIL_EFFECTIVE_DATE_INVALID
    http_status: 422
    applies_to: "POST /mpl/policies/{id}/tail-endorsements"

  - priority: 68
    category: business_temporal
    check: "the tail's CLOSED reporting window [effective_date, reporting_window_end] does not intersect the closed window of any ISSUED TailEndorsement on the same Policy; because both endpoints are inclusive, two windows that merely touch at a single date DO overlap"
    error_id: ERR_TAIL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /mpl/policies/{id}/tail-endorsements"

  - priority: 70
    category: business_constraint
    check: "tail coverage is only available on a CLAIMS_MADE policy; an occurrence policy already covers incidents reported after expiry"
    error_id: ERR_TAIL_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /mpl/policies/{id}/tail-endorsements"

  - priority: 71
    category: business_constraint
    check: "tail_type == DEATH_DISABILITY_RETIREMENT requires Insured.years_in_practice >= 5 AND triggering_term.claims_made_step_year >= 5; both bounds are inclusive"
    error_id: ERR_DDR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /mpl/policies/{id}/tail-endorsements"

  - priority: 72
    category: business_constraint
    check: "no other TailEndorsement on the same triggering_term_id already has status == ISSUED"
    error_id: ERR_TAIL_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /mpl/tail-endorsements/{id}/issuance"

  - priority: 73
    category: business_constraint
    check: "the Insured has no existing RiskProgramEnrollment for the same program_code with status == ENROLLED"
    error_id: ERR_DUPLICATE_PROGRAM_ENROLLMENT
    http_status: 409
    applies_to: "POST /mpl/insureds/{id}/enrollments"

  - priority: 74
    category: business_constraint
    check: "the submitted review_track has not already been recorded on this PeerReviewCase"
    error_id: ERR_REVIEW_TRACK_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /mpl/peer-review-cases/{id}/reviews"

  - priority: 75
    category: business_constraint
    check: "the Claim has no CounselAssignment with assignment_status == ASSIGNED"
    error_id: ERR_COUNSEL_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /mpl/claims/{id}/counsel-assignments"

  - priority: 76
    category: business_constraint
    check: "granted_amount is present and lies in (0, authority_requested] when decision == GRANT, and is absent when decision == DENY; a partial grant BELOW proposed_amount is legal here and is instead refused at payment time by priority 85"
    error_id: ERR_AUTHORITY_GRANT_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /mpl/settlement-negotiations/{id}/authority-decision"

  - priority: 77
    category: business_referential
    check: "the supplied counsel_assignment_id belongs to the addressed Claim"
    error_id: ERR_ASSIGNMENT_CLAIM_MISMATCH
    http_status: 422
    applies_to: "POST /mpl/claims/{id}/expense-payments"

  - priority: 78
    category: business_referential
    check: "counsel_panel_selection produced a non-empty eligible candidate pool for this claim's venue, allegation category, conflicts, capacity and exclusion list"
    error_id: ERR_NO_ELIGIBLE_COUNSEL
    http_status: 409
    applies_to: "POST /mpl/claims/{id}/counsel-assignments"

  - priority: 79
    category: business_referential
    check: "the Claim resolved to a responding PolicyTerm or TailEndorsement, so a settlement or payment can be charged against a limit"
    error_id: ERR_COVERAGE_DENIED_NO_DEFENSE
    http_status: 409
    applies_to: "POST /mpl/claims/{id}/settlement-negotiations"

  - priority: 85
    category: business_fiscal
    check: "the negotiation's proposed_amount does not exceed authority_granted"
    error_id: ERR_AUTHORITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /mpl/settlement-negotiations/{id}/payment"

  - priority: 86
    category: business_fiscal
    check: "the amount being disbursed does not exceed the responding PolicyTerm's aggregate_limit_remaining"
    error_id: ERR_AGGREGATE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /mpl/settlement-negotiations/{id}/payment"

  - priority: 87
    category: business_fiscal
    check: "the amount being disbursed does not exceed the Policy's limit_per_claim less the Claim's paid_indemnity"
    error_id: ERR_PER_CLAIM_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /mpl/settlement-negotiations/{id}/payment; POST /mpl/claims/{id}/settlement-negotiations"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- SpecialtyClass -------------------------------------------------------
  - method: POST
    path: "/mpl/specialty-classes"
    description: "Publish a rating specialty class with its manual base rate, hazard index and benchmark severity"
    roles: [ActuarialAnalyst, ChiefActuary]
    code: 201
    input: [specialty_code, base_class_code, base_rate_per_million, hazard_index, benchmark_severity]
    output: SpecialtyClass
    side_effects: ["rate_revision_index initialised to 0"]

  - method: GET
    path: "/mpl/specialty-classes/{id}"
    description: "Read one rating specialty class"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: []
    output: SpecialtyClass
    side_effects: []

  - method: GET
    path: "/mpl/specialty-classes"
    description: "List rating specialty classes"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["specialty_code?", "base_class_code?", "limit?", "offset?"]
    output: SpecialtyClass[]
    side_effects: []

  # --- Insured --------------------------------------------------------------
  - method: POST
    path: "/mpl/insureds"
    description: "Register a physician or facility insured and score its initial risk classification"
    roles: [UnderwritingOfficer]
    code: 201
    input: ["entity_type", "legal_name", "specialty_class_id", "venue_code", "high_severity_procedure_pct", "years_in_practice?", "board_certified?"]
    output: Insured
    side_effects:
      - "insured_risk_classification runs under the UNDERWRITING_SNAPSHOT variant, setting risk_class_score, risk_class_code and risk_class_factor"
      - "status initialised to PROSPECT and credentialing_status to PENDING"

  - method: GET
    path: "/mpl/insureds/{id}"
    description: "Read one insured"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer, Insured]
    code: 200
    input: []
    output: Insured
    side_effects: []

  - method: GET
    path: "/mpl/insureds"
    description: "List insureds, filterable by rating specialty and lifecycle state"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["specialty_class_id?", "entity_type?", "status?", "credentialing_status?", "risk_class_code?", "limit?", "offset?"]
    output: Insured[]
    side_effects: []

  - method: POST
    path: "/mpl/insureds/{id}/credentialing-decision"
    description: "Record a credentialing verdict for the insured and reconcile its underwriting status"
    roles: [UnderwritingOfficer]
    code: 200
    input: ["credentialing_status", "credentialing_expires_on?"]
    output: Insured
    side_effects:
      - "credentialing_status and credentialing_expires_on updated on the credentialing axis"
      - "status set to SUSPENDED when the new verdict is LAPSED or DENIED and status was ACTIVE"
      - "status set to ACTIVE when the new verdict is CREDENTIALED or PROVISIONAL and status was SUSPENDED"

  # --- RiskProgramEnrollment ------------------------------------------------
  - method: POST
    path: "/mpl/insureds/{id}/enrollments"
    description: "Enrol the insured in a risk-management program; guarded by optimistic concurrency on the insured"
    roles: [UnderwritingOfficer]
    code: 201
    input: [program_code, enrolled_on, expected_insured_version]
    output: RiskProgramEnrollment
    side_effects:
      - "increments Insured.version by 1"
      - "status initialised to ENROLLED with credit_pct_snapshot 0"

  - method: GET
    path: "/mpl/enrollments/{id}"
    description: "Read one risk-management program enrollment"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: []
    output: RiskProgramEnrollment
    side_effects: []

  - method: GET
    path: "/mpl/enrollments"
    description: "List risk-management program enrollments"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["insured_id?", "program_code?", "status?", "limit?", "offset?"]
    output: RiskProgramEnrollment[]
    side_effects: []

  - method: POST
    path: "/mpl/enrollments/{id}/completion"
    description: "Record completion of a risk-management program and restack the insured's premium credit"
    roles: [UnderwritingOfficer]
    code: 200
    input: [completed_on, attestation_reference]
    output: RiskProgramEnrollment
    side_effects:
      - "status set to COMPLETED; completed_on and attestation_reference recorded"
      - "credit_pct_snapshot set from PROGRAM_CREDIT_PCT and expires_on set to completed_on + 730 days"
      - "program_credit_pct recomputed and every DRAFT PolicyTerm on the insured's policies re-rated"
      - "Policy.quoted_premium_total recomputed for each affected Policy"

  # --- PeerReviewCase -------------------------------------------------------
  - method: POST
    path: "/mpl/peer-review-cases"
    description: "Refer an insured to peer review"
    roles: [PeerReviewChair, ClaimsAdjuster]
    code: 201
    input: [insured_id, trigger_source, referral_note]
    output: PeerReviewCase
    side_effects: ["status initialised to REFERRED with both review tracks unrecorded"]

  - method: GET
    path: "/mpl/peer-review-cases/{id}"
    description: "Read one peer review case"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: []
    output: PeerReviewCase
    side_effects: []

  - method: GET
    path: "/mpl/peer-review-cases"
    description: "List peer review cases"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["insured_id?", "status?", "trigger_source?", "limit?", "offset?"]
    output: PeerReviewCase[]
    side_effects: []

  - method: POST
    path: "/mpl/peer-review-cases/{id}/reviews"
    description: "Record one of the two independent review tracks on a peer review case"
    roles: [PeerReviewChair]
    code: 200
    input: [review_track, outcome]
    output: PeerReviewCase
    side_effects:
      - "chart_review_outcome set when review_track == CHART, external_review_outcome set when review_track == EXTERNAL"
      - "status set to IN_REVIEW when this is the first track recorded"
      - "status set to REVIEWS_COMPLETE when this is the second track recorded (fork-join)"

  - method: POST
    path: "/mpl/peer-review-cases/{id}/committee-vote"
    description: "Record the peer review committee verdict, closing the case and restacking the insured's surcharge"
    roles: [PeerReviewChair]
    code: 200
    input: [vote_result, votes_for, votes_against]
    output: PeerReviewCase
    side_effects:
      - "status set to CLOSED; committee_vote_result, votes_for, votes_against, chair_user_id and closed_on recorded"
      - "surcharge_pct_assigned set from PEER_REVIEW_SURCHARGE_PCT"
      - "Insured.surcharge_pct recomputed via peer_review_surcharge_pct"
      - "every DRAFT PolicyTerm on the insured's policies re-rated and Policy.quoted_premium_total recomputed"
      - "Insured.status set to SUSPENDED when vote_result == DEVIATION_MAJOR and the insured was ACTIVE"

  # --- Policy ---------------------------------------------------------------
  - method: POST
    path: "/mpl/policies"
    description: "Quote a medical professional liability policy for an insured"
    roles: [UnderwritingOfficer]
    code: 201
    input: ["insured_id", "coverage_form", "limit_per_claim", "limit_aggregate", "retroactive_date?", "prior_acts_step_credit?", "consent_to_settle_clause"]
    output: Policy
    side_effects:
      - "policy_number assigned as MPL- plus the next 6-digit zero-padded creation sequence"
      - "status initialised to QUOTED with quoted_premium_total and written_premium_net_total 0.00"

  - method: GET
    path: "/mpl/policies/{id}"
    description: "Read one policy"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer, Insured]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/mpl/policies"
    description: "List policies"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["insured_id?", "status?", "coverage_form?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  # --- PolicyTerm -----------------------------------------------------------
  - method: POST
    path: "/mpl/policies/{id}/terms"
    description: "Add a rated term to a policy; guarded by optimistic concurrency on the policy"
    roles: [UnderwritingOfficer]
    code: 201
    input: ["effective_date", "expiration_date", "predecessor_term_id?", "expected_policy_version"]
    output: PolicyTerm
    side_effects:
      - "increments Policy.version by 1"
      - "term_index and rating_variant derived from predecessor_term_id"
      - "claims_made_step_premium runs, setting the full rating block through term_total"
      - "rate_revision_index_used snapshotted from the SpecialtyClass"
      - "Policy.quoted_premium_total recomputed"

  - method: GET
    path: "/mpl/policy-terms/{id}"
    description: "Read one policy term with its full rating block"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer, Insured]
    code: 200
    input: []
    output: PolicyTerm
    side_effects: []

  - method: GET
    path: "/mpl/policy-terms"
    description: "List policy terms, filterable by policy and by predecessor term in the step chain"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["policy_id?", "predecessor_term_id?", "status?", "rating_variant?", "limit?", "offset?"]
    output: PolicyTerm[]
    side_effects: []

  - method: POST
    path: "/mpl/policy-terms/{id}/issuance"
    description: "Issue a drafted term, binding coverage and writing the premium to the policy ledger"
    roles: [UnderwritingOfficer]
    code: 200
    input: []
    output: PolicyTerm
    side_effects:
      - "status set to IN_FORCE when effective_date <= the current logical date, otherwise ISSUED"
      - "issued_at recorded and aggregate_limit_remaining set to Policy.limit_aggregate"
      - "Policy.written_premium_net_total, quoted_premium_total, current_term_id and status recomputed"
      - "Insured.status set to ACTIVE when it was PROSPECT"

  - method: POST
    path: "/mpl/policy-terms/{id}/cancellation"
    description: "Cancel an in-force term flat or pro rata, with divergent return-premium and coverage consequences"
    roles: [UnderwritingOfficer]
    code: 200
    input: [cancel_type, cancel_effective_date]
    output: PolicyTerm
    side_effects:
      - "status set to CANCELLED_FLAT or CANCELLED_PRO_RATA and cancel_effective_date recorded"
      - "return_premium set from pro_rata_return_premium"
      - "aggregate_limit_remaining set to 0.00 on a flat cancellation and left unchanged on a pro-rata cancellation"
      - "on a flat cancellation only: every non-DENIED Claim on the term is DENIED with denial_reason TERM_VOIDED, every non-terminal SettlementNegotiation on those claims is ABANDONED, and every ISSUED TailEndorsement on the same Policy is VOIDed"
      - "Policy.written_premium_net_total, current_term_id and status recomputed"

