            - call: "POST /water-treatment/process-technologies"
              payload: { code: "TECH-FILT-A", name: "Submerged MF membrane rack", role: "FILTRATION", max_feed_turbidity_ntu: 50.0, max_feed_tds_mg_l: 3000.0, min_design_flow_mgd: 0.500, max_design_flow_mgd: 20.000, unit_capex_cents_per_mgd: 40000000, energy_kwh_per_mg: 250.0, footprint_sf_per_mgd: 900.0, requires_code_stamp: "AWWA", chemical_service_class: "NEUTRAL", consumable_item_code: "MF-ELEM-8", status: "ACTIVE" }
