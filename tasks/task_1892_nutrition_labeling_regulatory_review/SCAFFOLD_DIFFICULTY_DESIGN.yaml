            - { call: "POST /api/label-versions/${lv3}/market-variants", payload: { market_code: "CA_CFIA", effective_start: "2027-02-01T00:00:00Z", effective_end: "2027-06-01T00:00:00Z" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "mv2_status == DRAFT (201: start exactly equal to MV1's end is adjacency, allowed under half-open [start, end))"
            - "err == ERR_MARKET_WINDOW_OVERLAP ([2027-02-01, 2027-06-01) intersects MV1's window and MV2's open window)"

      - name: audit_facility_buffer_boundary
        grounds:
          - validations[priority=6]
          - entities.ArtworkAudit.fields.facility_code
          - entities.ArtworkAudit.fields.scheduled_start
          - errors[ERR_FACILITY_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Resource = facility schedule; interval semantics = CLOSED windows plus a mandatory
          1-day buffer: a new audit starting 12h after another's end conflicts, while
          starting exactly end + 86400s is permitted. Different resource and different
          geometric treatment (buffered closed vs half-open adjacency-allowed) from
          mv_window_halfopen_adjacency.
        test_recipe:
          setup:
            - "Client with RELEASED label LV for product Cookie; audit A1 at facility F1 window [2026-09-10T00:00, 2026-09-12T00:00]"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", allergen_tags: [], kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/label-versions/${lv}/release", payload: { expected_product_version: "${pver2}" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F1", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z", scoring_method: "WEIGHTED" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F1", scheduled_start: "2026-09-12T12:00:00Z", scheduled_end: "2026-09-14T00:00:00Z", scoring_method: "WEIGHTED" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F1", scheduled_start: "2026-09-13T00:00:00Z", scheduled_end: "2026-09-14T00:00:00Z", scoring_method: "BINARY" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a3: $.data.id, a3_status: $.data.status } }
          assert:
            - "err == ERR_FACILITY_SCHEDULE_OVERLAP (start 12h after A1's end is inside the 1-day buffer)"
            - "a3_status == SCHEDULED (start exactly A1.end + 86400s satisfies the buffer with equality permitted)"

  # ===================================================================
  # Rule 9 — compensating_invariant (2 instances, different quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_release_withdraw_conserves_released_set
        grounds:
          - state_machines.LabelVersion.release_status=NOT_RELEASED (with review_status=APPROVED)_to_release_status=RELEASED
          - state_machines.LabelVersion.release_status=RELEASED_to_release_status=WITHDRAWN
          - state_machines.LabelVersion.release_status=RELEASED_to_release_status=SUPERSEDED
          - entities.LabelVersion.fields.superseded_by_id
        distinguishing_aspect: |
          Conserved quantity = the released-set per (product, market): at every step exactly
          one LabelVersion of the product+market has release_status == RELEASED, and the
          forward action (release LV2, superseding LV1) paired with its compensation
          (withdraw LV2) restores the IDENTICAL set {LV1} — count and membership conserved.
        test_recipe:
          setup:
            - "Client, product Cookie, LOCKED recipe, DATABASE panel, US_FDA RACC; LV1 fully RELEASED; LV2 APPROVED"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", allergen_tags: ["WHEAT"], kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id } }
