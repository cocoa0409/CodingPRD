            - "InventoryPull.${pull_id}.state == COMMITTED"

      - name: rental_order_cancelled_late_after_cutoff_charges_full_rate
        claim_type: Side Effect Execution
        grounds: ["state_machines.RentalOrder.CONFIRMED_to_CANCELLED_LATE", "calculations.vendor_cancellation_fee", "entities.RentalOrder.fields.cancellation_fee"]
        distinguishing_aspect: "Cancelling on 2026-06-06, after the 2026-06-04 cutoff, routes to CANCELLED_LATE and charges 100 percent of monthly_rate_total (459.00), not the 25 percent early rate of 114.75, and drops the vendor line."
        test_recipe:
          setup: ["A VACANT project at PULL_OPEN with a CONFIRMED 4-unit vendor order placed on 2026-06-01, cutoff 2026-06-04."]
          setup_api_calls: *v_committed_c
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/rental-orders/${ro_id}/cancel"
              payload: {}
              as: WarehouseManager
          assert:
            - "RentalOrder.${ro_id}.state == CANCELLED_LATE"
            - "RentalOrder.${ro_id}.monthly_rate_total == 459.00"
            - "RentalOrder.${ro_id}.cancel_cutoff_date == 2026-06-04T00:00:00.000Z"
            - "RentalOrder.${ro_id}.cancellation_fee == 459.00"
            - "PullLine.${line_v}.state == DROPPED"

      - name: vendor_suspended_status_is_reachable_via_patch
        claim_type: Valid Transition
        grounds: ["entities.VendorPartner.fields.status", "endpoints.PATCH./staging/vendors/{vendor_id}"]
        distinguishing_aspect: "The declared SUSPENDED enum member is produced by PATCH /staging/vendors/{vendor_id}; a SUSPENDED vendor's order can no longer be placed, so the enum value is not a dead end."
        test_recipe:
          setup: ["One ACTIVE vendor with a DRAFT order is not required; only the vendor row is needed."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/vendors"
              payload: { name: "Metro Rentals", lead_time_days: 7, min_lease_cycles: 6, cancel_cutoff_days: 4, rate_multiplier: 1.35 }
              as: WarehouseManager
              captures: { vendor_id: "$.data.id" }
          trigger:
            - call: "PATCH /staging/vendors/${vendor_id}"
              payload: { status: "SUSPENDED" }
              as: WarehouseManager
          assert:
            - "VendorPartner.${vendor_id}.status == SUSPENDED"
            - "VendorPartner.${vendor_id}.version == 2"

      - name: unfilled_lines_are_dropped_by_the_commit
        claim_type: Cascade down
        grounds: ["state_machines.PullLine.UNFILLED_to_DROPPED", "state_machines.InventoryPull.PARTIAL_to_COMMITTED", "entities.PullLine.fields.state"]
        distinguishing_aspect: "A committed pull leaves every satisfied line in ALLOCATED with its monthly_rate already derived, and reports fill_rate 1.0000; the DROPPED arc belongs to the commit, not to the allocation pass."
        test_recipe:
          setup: ["A VACANT project at PULL_OPEN whose pull holds a single four-unit VENDOR line."]
          setup_api_calls: *v_committed_c
