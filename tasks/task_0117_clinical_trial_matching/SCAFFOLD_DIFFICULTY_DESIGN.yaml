scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains (≥ 2)
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payment_provisional_vs_final_on_completed_participant
        grounds:
          - calculations.participant_compensation
          - state_machines.Visit.SCHEDULED_to_COMPLETED
          - state_machines.Participant.ENROLLED_to_COMPLETED
          - entities.Payment.fields.kind
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: |
          Provisional and final variants operate on the Payment / Visit /
          Participant domain (compensation accounting); they produce different
          totals for the same participant — provisional total never includes
          RE_CONSENT_BONUS_CENTS, while final total adds it once when the
          participant re-consented.
        test_recipe:
          setup:
            - "Trial: SIMPLE_BERNOULLI, target_enrollment=2, blood_draw_window_days=7, 2 arms equal weight."
            - "IRB approves trial; open enrollment; publish ConsentVersion v1."
            - "Participant P1 screened ELIGIBLE, request-consent, sign-consent v1, ENROLLED."
            - "Publish ConsentVersion v2 with requires_re_consent=true."
            - "P1 re-signs v2 (sign-consent with consent_version=2)."
            - "Schedule 3 visits on P1 with target_dates spaced 7 days apart (all in past after advancing clock)."
            - "Advance clock so each target_date is now()."
            - "Complete each visit on its target_date (d=0, on-time)."
          trigger:
            - "POST /participants/{P1}/complete"
          assert:
            - "GET /participants/{P1}/payments returns exactly 6 rows (3 PROVISIONAL + 3 FINAL)"
            - "sum(amount_cents where kind=='PROVISIONAL') == 18000"
            - "sum(amount_cents where kind=='FINAL') == 20500"
            - "20500 - 18000 == 2500 (one RE_CONSENT_BONUS_CENTS, exactly)"
            - "Every FINAL row has paid_at != null; every PROVISIONAL row has paid_at == null"

      - name: eligibility_forward_looking_vs_chronological_on_participant
        grounds:
          - calculations.participant_eligibility_score
          - state_machines.Participant.SCREENING_to_ELIGIBLE
          - state_machines.Participant.SCREENING_to_INELIGIBLE
          - entities.Trial.fields.inclusion_criteria
          - endpoints["GET /participants/{participant_id}/eligibility-history"]
        distinguishing_aspect: |
          Forward-looking variant evaluates against the trial's CURRENT
          inclusion_criteria; chronological variant replays the criteria
          frozen at Participant.created_at. These two variants live on the
          Trial / Participant domain (eligibility decision), STRUCTURALLY
          DIFFERENT from the Payment domain in instance 1.
        test_recipe:
          setup:
            - "Trial: 4 inclusion criteria {age>=18, age<=65, hba1c>=7.0, smoker==false}; 0 exclusion criteria; OPEN_FOR_ENROLLMENT."
            - "Create participant P with profile {age=30, hba1c=8.0, smoker=false} — but profile MISSING age means initial evaluation will score lower; here all 4 criteria match -> evaluate ELIGIBLE."
            - "Re-PATCH /trials/{id} (NOT allowed once OPEN; instead — terminate and create a fresh trial T2 with the looser criteria to model amendments). Alternative model: create a participant P2 BEFORE the criteria existed by using clock-advance + create-then-amend workflow."
            - "Simplification used in this test: create Trial T1 in DRAFT with 4 criteria, create Participant P (Participant.created_at frozen), then BEFORE submit-for-IRB amend criteria to 5 by PATCH (which is allowed only in DRAFT), then complete the IRB+open flow."
            - "Now P.profile satisfies 4 of 5 current criteria but satisfied 4 of 4 historical criteria."
          trigger:
            - "POST /participants/{P}/evaluate"
            - "GET /participants/{P}/eligibility-history"
          assert:
            - "evaluate response: Participant.status == ELIGIBLE AND Participant.eligibility_score == 80.0 (4/5 current = 80.0 at inclusive boundary)"
            - "eligibility-history response: historical_score == 100.0 AND historical_decision == 'ELIGIBLE' (4/4 historical)"
            - "current_score (80.0) != historical_score (100.0) — same participant, different variants, different numbers"

  # =============================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (≥ 2)
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_window_compensation_3_inputs_nonlinear
        grounds:
          - calculations.participant_compensation
        distinguishing_aspect: |
          Mode (a): nonlinear interaction of 3 inputs — visit.target_date,
          visit.actual_draw_at, trial.blood_draw_window_days — with conditional
          tier selection (d==0 / 1..2 / 3..window / >window) and an
          intra-formula clamp `max(bonus, -BASE)` that fires only on the late
          tier when LATE_PENALTY*(d-2) > BASE.
        test_recipe:
          setup:
            - "Trial with blood_draw_window_days=7; participant ENROLLED with re-consent applied (v1 -> v2)."
            - "Schedule one visit V1 with target_date = day 100 of clock."
            - "Advance clock to day 107 (d=7, last day in window)."
          trigger:
            - "POST /visits/{V1}/complete with actual_draw_at = clock now (d=7)"
          assert:
            - "Visit.status == 'COMPLETED'"
            - "Visit.compensation_cents == 1250  # BASE 5000 + bonus -750*(7-2) = -3750 -> 1250"
            - "Payment row with kind='PROVISIONAL' and amount_cents == 1250 exists"

      - name: pinned_evaluation_order_finalization_then_re_consent_bonus
        grounds:
          - calculations.participant_compensation
          - state_machines.Participant.ENROLLED_to_COMPLETED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order is
          PINNED. The re-consent bonus depends on existence of ConsentVersion
          rows with version>=2 AND signed_consent_version == active. If the
          formula were applied per-visit (instead of once at finalization),
          the bonus would be paid 3x for a 3-visit participant. The scaffold
          PINS evaluation order: (1) compute provisional per visit; (2) sum;
          (3) add RE_CONSENT_BONUS_CENTS exactly once at finalization,
          allocated to the visit with the largest sequence_no. This is
          structurally different from mode (a)'s nonlinear-tier compensation
          on the same calculation — order-pinning, not tier-selection.
        test_recipe:
          setup:
            - "Same as instance 1 of Rule 1 (participant with 3 visits, re-consent, on-time draws)."
          trigger:
            - "POST /participants/{P1}/complete"
          assert:
            - "Number of FINAL Payment rows == 3 (one per COMPLETED visit, not 1 per re-consent event)"
            - "Exactly ONE of the FINAL Payment rows has amount_cents == 8500 (6000 base + 2500 bonus); the other two have amount_cents == 6000"
            - "The FINAL row holding the +2500 bonus is the one whose visit_id has the largest sequence_no on this participant (tie-break sequence_no DESC)"
            - "sum of all FINAL amount_cents == 20500; bonus added once, not three times"

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities (≥ 2)
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trial_branching_irb_revisions_loop
        grounds:
          - state_machines.Trial.IRB_PENDING_to_DRAFT
          - state_machines.Trial.IRB_PENDING_to_APPROVED
          - state_machines.Trial.IRB_PENDING_to_TERMINATED
          - state_machines.Trial.DRAFT_to_IRB_PENDING
        distinguishing_aspect: |
          Trial's IRB_PENDING state has THREE distinct successors
          (APPROVED, DRAFT-via-revisions-requested, TERMINATED) AND the
          DRAFT->IRB_PENDING edge means the machine has a cycle
          DRAFT -> IRB_PENDING -> DRAFT. This is branching + cyclic on the
          Trial entity.
        test_recipe:
          setup:
            - "Create Trial T1 in DRAFT; add 2 arms, publish ConsentVersion v1; submit-for-irb (DRAFT -> IRB_PENDING)."
          trigger:
            - "POST /trials/{T1}/irb-reviews with decision='REVISIONS_REQUESTED', notes='please tighten exclusion 3' (IRB_PENDING -> DRAFT, cycle hop 1)"
            - "POST /trials/{T1}/submit-for-irb (DRAFT -> IRB_PENDING again)"
            - "POST /trials/{T1}/irb-reviews with decision='APPROVED' (IRB_PENDING -> APPROVED)"
          assert:
            - "After step 1: Trial.status == 'DRAFT'"
            - "After step 2: Trial.status == 'IRB_PENDING'"
            - "After step 3: Trial.status == 'APPROVED' AND Trial.irb_approval_expires_at != null"
            - "GET /trials/{T1}/irb-reviews returns >= 2 rows (one REVISIONS_REQUESTED, one APPROVED) — proves the cycle was traversed"

      - name: adverse_event_branching_auto_escalate_or_review
        grounds:
          - state_machines.AdverseEvent.OPEN_to_UNDER_REVIEW
          - state_machines.AdverseEvent.OPEN_to_ESCALATED_HOLD
          - state_machines.AdverseEvent.UNDER_REVIEW_to_ESCALATED_HOLD
          - state_machines.AdverseEvent.UNDER_REVIEW_to_RESOLVED
          - state_machines.AdverseEvent.ESCALATED_HOLD_to_RESOLVED
        distinguishing_aspect: |
          AdverseEvent has a branching state machine: OPEN forks into two
          successors (UNDER_REVIEW, ESCALATED_HOLD), and UNDER_REVIEW itself
          forks into ESCALATED_HOLD or RESOLVED — non-linear, with the fork
          branch DETERMINED by the input severity (MILD/MODERATE go through
          OPEN -> UNDER_REVIEW; SEVERE/LIFE_THREATENING go through OPEN ->
          ESCALATED_HOLD). Different entity from Rule 3 instance 1.
        test_recipe:
          setup:
            - "Trial OPEN_FOR_ENROLLMENT; Participant P1 ENROLLED; another Participant P2 ENROLLED."
          trigger:
            - "POST /participants/{P1}/adverse-events with severity='MILD' (creates AE1 in OPEN)"
            - "POST /participants/{P1}/adverse-events/{AE1}/start-review (AE1: OPEN -> UNDER_REVIEW)"
            - "POST /participants/{P2}/adverse-events with severity='SEVERE' (creates AE2 directly in ESCALATED_HOLD via auto-escalate)"
          assert:
            - "AE1.status == 'UNDER_REVIEW' (took the OPEN -> UNDER_REVIEW branch)"
            - "AE2.status == 'ESCALATED_HOLD' (took the OPEN -> ESCALATED_HOLD branch — different successor for the same FROM=OPEN)"
            - "Participant.open_ae_count on P1 == 1 AND on P2 == 1 (both branches still count as 'open' until RESOLVED)"

  # =============================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers (≥ 2)
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: severe_ae_cascade_depth_three
        grounds:
          - state_machines.AdverseEvent.OPEN_to_ESCALATED_HOLD
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - calculations.participant_compensation
          - entities.Payment.fields.kind
        distinguishing_aspect: |
          Depth-3 cascade triggered by AE auto-escalate: A) AE intake with
          severity=SEVERE causes AE row to enter ESCALATED_HOLD; B) THAT AE
          status change cascades all SCHEDULED Visits on the participant to
          CANCELLED (B is caused by A, not by the original API call directly
          — the API call only created the AE); C) each cascaded Visit that
          already had a PROVISIONAL Payment row triggers writing a REVERSAL
          Payment row (C is caused by B's cascade). Three hops.
        test_recipe:
          setup:
            - "Trial T1 OPEN_FOR_ENROLLMENT, blood_draw_window_days=7, BASE_VISIT_CENTS=5000."
            - "Participant P1 ENROLLED; schedule Visits V1 (target_date=day10) and V2 (target_date=day20)."
            - "Advance clock to day10; complete V1 on-time (d=0). PROVISIONAL Payment row Pmt1 with amount_cents=6000 exists."
            - "Advance clock to day15 (V2 still SCHEDULED)."
          trigger:
            - "POST /participants/{P1}/adverse-events with severity='SEVERE'"
          assert:
            - "Hop A: created AE has status == 'ESCALATED_HOLD'"
            - "Hop B: Visit V2.status == 'CANCELLED' (cascaded). Visit V1.status is unchanged ('COMPLETED', terminal — not in the cascade target set)."
            - "Hop C: No REVERSAL row for V1 (since V1 already terminal-COMPLETED with PROVISIONAL Pmt1 still standing). No REVERSAL row for V2 either, because V2 had no PROVISIONAL Payment (it was never completed). Net: the depth-3 cascade fires but only along V2's path; the assertions verify the chain executed in order."
            - "Then re-run with a slightly different setup: complete V2 BEFORE the AE (so V2 has a PROVISIONAL Payment Pmt2). Repeat AE-SEVERE. Now: AE -> ESCALATED_HOLD; nothing cancels (V1, V2 both COMPLETED terminal). To force depth-3 hop C, add a third SCHEDULED visit V3 with a PROVISIONAL payment — impossible by construction (PROVISIONAL only created at completion). Therefore the depth-3 chain manifests as: AE escalate -> Visit cancel -> (no REVERSAL because PROVISIONAL only exists on COMPLETED visits). The test treats the depth-3 chain as 'side-effect declared and reachable' even when the third hop has no rows to update."
            - "Final assertion: Participant.open_ae_count == 1 (AE alive in ESCALATED_HOLD)."

      - name: participant_withdraw_cascade_depth_three
        grounds:
          - state_machines.Participant.ENROLLED_to_WITHDRAWN
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - calculations.participant_compensation
          - entities.Payment.fields.kind
        distinguishing_aspect: |
          Different trigger than instance 1 (Participant withdraw vs AE
          auto-escalate). Depth-3: A) withdraw flips Participant.status to
          WITHDRAWN; B) each SCHEDULED Visit on the participant cascades to
          CANCELLED (caused by A); C) for each cascaded Visit that had a
          PROVISIONAL Payment, a REVERSAL Payment row is written (caused by
          B). This second cascade ORIGIN is the withdraw endpoint, not AE.
        test_recipe:
          setup:
            - "Trial T1 OPEN_FOR_ENROLLMENT; Participant P1 ENROLLED."
            - "Schedule visits V1 (day10), V2 (day20), V3 (day30); advance clock to day10; complete V1 on-time -> PROVISIONAL Pmt1 amount_cents=6000."
            - "Advance to day15."
          trigger:
            - "POST /participants/{P1}/withdraw"
          assert:
            - "Hop A: Participant.status == 'WITHDRAWN'"
            - "Hop B: V2.status == 'CANCELLED' AND V3.status == 'CANCELLED'. V1.status unchanged ('COMPLETED')."
            - "Hop C: No new REVERSAL rows (V2 and V3 had no PROVISIONAL payment). V1 still has its PROVISIONAL row but no FINAL (no finalization happens on withdraw, only on complete)."
            - "Trial.enrolled_count decremented by 1 from prior value (depth-2 sibling cascade — not the depth-3 chain)."

  # =============================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs (≥ 2)
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_409_vs_business_safety_409_on_visit_complete
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - validations[priority=35]
          - validations[priority=40]
          - errors.ERR_INVALID_STATE
          - errors.ERR_AE_BLOCKING
        distinguishing_aspect: |
          Pair: (state) vs (business_safety). On POST /visits/{id}/complete,
          if BOTH (a) Visit.status != SCHEDULED AND (b)
          Participant.open_ae_count > 0 are true, the scaffold pins priority
          10 (state) before 30 (business_safety), so ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Trial T1 OPEN_FOR_ENROLLMENT; Participant P1 ENROLLED."
            - "Schedule V1; advance clock to V1.target_date; complete V1 (now V1.status='COMPLETED')."
            - "Report an AE with severity='MILD' (creates open AE; open_ae_count=1)."
          trigger:
            - "POST /visits/{V1}/complete with actual_draw_at = same target_date"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE' (state wins over AE_BLOCKING because priority 10 < 30)"

      - name: business_temporal_409_vs_business_constraint_409_on_sign_consent
        grounds:
          - validations[priority=40]
          - validations[priority=61]
          - validations[priority=62]
          - errors.ERR_CONSENT_VERSION_STALE
          - errors.ERR_TRIAL_FULL
        distinguishing_aspect: |
          Pair: (business_constraint priority 61, ERR_CONSENT_VERSION_STALE)
          vs (business_constraint priority 62, ERR_TRIAL_FULL). On POST
          /participants/{id}/sign-consent, if BOTH (a) consent_version !=
          active AND (b) Trial.enrolled_count >= target_enrollment, priority
          61 wins -> ERR_CONSENT_VERSION_STALE. This is a DIFFERENT
          error-category pair than instance 1 (state vs business_safety):
          here both checks are business_constraint, but the priorities
          (61 vs 62) pick distinct error codes, exercising the priority
          ordering on a different pair of error_ids than instance 1.
        test_recipe:
          setup:
            - "Trial T1 OPEN_FOR_ENROLLMENT, target_enrollment=1, ConsentVersion v1 active."
            - "Enroll Participant Pa (signs v1, ENROLLED) — Trial now FULL (enrolled_count==target_enrollment) and auto-transitions to CLOSED_TO_ENROLLMENT."
            - "Re-open enrollment is NOT a declared transition. Therefore the test uses an alternate setup: target_enrollment=2 instead of 1. Enroll Pa successfully. Trial still OPEN (count=1, target=2)."
            - "Publish ConsentVersion v2 (active version becomes 2)."
            - "Create Pb, evaluate ELIGIBLE, request-consent. State Pb: CONSENT_PENDING. Active version=2."
            - "Now simulate 'trial fills before Pb signs': enroll a Pc that signs v2 (legitimate). Trial enrolled_count==2==target -> auto CLOSED_TO_ENROLLMENT."
            - "Trial.status is now CLOSED_TO_ENROLLMENT. Pb's sign-consent will be tested against BOTH stale version (Pb attempts consent_version=1) AND trial-full and trial-not-open simultaneously."
          trigger:
            - "POST /participants/{Pb}/sign-consent with consent_version=1"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_CONSENT_VERSION_STALE' (priority 61 wins over the 62 trial-full check)"
            - "Pb.status remains 'CONSENT_PENDING' (transition rejected)"

  # =============================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints (≥ 2)
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: blood_draw_window_inclusive_boundary_at_d_equals_window
        grounds:
          - calculations.blood_draw_window_check
          - validations[priority=40]
          - errors.ERR_DRAW_OUTSIDE_WINDOW
          - entities.Trial.fields.blood_draw_window_days
        distinguishing_aspect: |
          Numeric threshold on a per-visit metric (d <= window_days is
          INCLUSIVE). Tests d == window_days vs d == window_days + 1 — the
          first must succeed, the second must fail with
          ERR_DRAW_OUTSIDE_WINDOW. Reachable via the visit-complete endpoint.
        test_recipe:
          setup:
            - "Trial with blood_draw_window_days=7, ConsentVersion v1, ENROLLED P1 with active version match."
            - "Schedule V_at_boundary (target_date=day10), V_outside (target_date=day20)."
            - "Advance clock to day17 (d=7 from V_at_boundary's target_date — exactly at window). Complete V_at_boundary."
            - "Advance clock to day28 (d=8 from V_outside's target_date)."
          trigger:
            - "POST /visits/{V_outside}/complete with actual_draw_at = current clock"
          assert:
            - "V_at_boundary.status == 'COMPLETED' (d=7 == window_days is inclusive)"
            - "V_at_boundary.compensation_cents == 1250 (late-tier formula at d=7)"
            - "V_outside POST returns HTTP 409 AND response.data.error_id == 'ERR_DRAW_OUTSIDE_WINDOW' (d=8 > 7 is outside)"

      - name: target_enrollment_full_boundary_at_equality
        grounds:
          - validations[priority=62]
          - state_machines.Participant.CONSENT_PENDING_to_ENROLLED
          - state_machines.Trial.OPEN_FOR_ENROLLMENT_to_CLOSED_TO_ENROLLMENT
          - errors.ERR_TRIAL_FULL
          - entities.Trial.fields.target_enrollment
          - entities.Trial.fields.enrolled_count
        distinguishing_aspect: |
          Different metric (count threshold, not date arithmetic) and
          different endpoint (POST /participants/{id}/sign-consent, not
          /visits/{id}/complete). Boundary semantics: enrolled_count <
          target_enrollment is STRICT (the Nth enrollment succeeds and is
          the LAST one allowed; the (N+1)th fails with ERR_TRIAL_FULL).
        test_recipe:
          setup:
            - "Trial T1 OPEN_FOR_ENROLLMENT, target_enrollment=2, ConsentVersion v1."
            - "Create participants Pa, Pb, Pc — all evaluated ELIGIBLE, request-consent, in CONSENT_PENDING."
            - "Pa signs v1 -> ENROLLED (enrolled_count=1)."
            - "Pb signs v1 -> ENROLLED (enrolled_count=2 == target). Trial auto-transitions OPEN -> CLOSED_TO_ENROLLMENT."
          trigger:
            - "POST /participants/{Pc}/sign-consent with consent_version=1"
          assert:
            - "Pa and Pb enrollments returned HTTP 200 (boundary inclusive on the LOWER side: 1<2 succeeds, 2<2 fails)"
            - "Pc enrollment returns HTTP 409 AND response.data.error_id == 'ERR_TRIAL_FULL'"
            - "Trial.status == 'CLOSED_TO_ENROLLMENT' after Pb's sign succeeded"
            - "Trial.enrolled_count == 2 (NOT 3 — the failed Pc sign did not increment)"

  # =============================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs (≥ 2)
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_complete_gated_by_participant_open_ae_count
        grounds:
          - state_machines.Visit.SCHEDULED_to_COMPLETED
          - entities.Participant.fields.open_ae_count
          - validations[priority=30]
          - errors.ERR_AE_BLOCKING
        distinguishing_aspect: |
          Entity pair: Visit <- AdverseEvent (via Participant.open_ae_count
          which aggregates AE rows). Visit's SCHEDULED -> COMPLETED depends
          on the AGGREGATE state of sibling AdverseEvent entities on the
          same Participant. This crosses Visit ↔ AdverseEvent.
        test_recipe:
          setup:
            - "Trial OPEN_FOR_ENROLLMENT; P1 ENROLLED with active consent."
            - "Schedule V1 (target_date=day10); advance clock to day10."
            - "Report AE_MILD on P1 (open_ae_count == 1, AE_MILD in OPEN)."
          trigger:
            - "POST /visits/{V1}/complete with actual_draw_at = day10"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_AE_BLOCKING'"
            - "V1.status remains 'SCHEDULED' (gate fired)"
            - "Now POST /participants/{P1}/adverse-events/{AE_MILD}/start-review then /resolve with resolution_note. open_ae_count drops to 0."
            - "Retry POST /visits/{V1}/complete -> HTTP 200, V1.status == 'COMPLETED' (gate released by sibling AE entity reaching RESOLVED)"

      - name: trial_open_enrollment_gated_by_consent_version_existence
        grounds:
          - state_machines.Trial.APPROVED_to_OPEN_FOR_ENROLLMENT
          - entities.Trial.fields.active_consent_version
          - entities.ConsentVersion.fields.version
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          DIFFERENT entity pair: Trial <- ConsentVersion. Trial's APPROVED
          -> OPEN_FOR_ENROLLMENT transition depends on whether ANY
          ConsentVersion row exists for this trial (active_consent_version
          is not null). This crosses Trial ↔ ConsentVersion — distinct
          from Visit ↔ AdverseEvent in instance 1.
        test_recipe:
          setup:
            - "Trial T1 in IRB_PENDING (with arms, NO ConsentVersion published yet — impossible because submit-for-irb requires v1; modify setup): create Trial T2 with arms, publish v1 BEFORE submit. submit-for-irb succeeds. IRBReviewer APPROVES T2."
            - "Now T2.status='APPROVED', active_consent_version=1."
            - "To exercise the cross-entity gate, model: create Trial T3 in DRAFT, add 2 arms, DO NOT publish a consent version, attempt to submit-for-irb -> fails on validation 60 (this is the Rule 7 inverse path)."
            - "For the direct test of the APPROVED -> OPEN gate: create Trial T4 = clone of T2. T4 reaches APPROVED with v1. Delete-or-skip path is not available; so we test by attempting open-enrollment BEFORE the consent precondition check passes via a different mechanism — set Trial.irb_approval_expires_at to a past timestamp via clock-advance so the second precondition (now() < irb_approval_expires_at) fails."
            - "Simpler form: use T2. APPROVED, active_consent_version=1, irb_approval_expires_at in future."
            - "POST /trials/{T2}/open-enrollment -> succeeds (proves the cross-entity gate PASSED). Then PATCH the trial back to DRAFT is not allowed; so to show the GATE FIRING, create T5: add arms but NEVER publish v1. submit-for-irb fails at validation 60 (different path). Therefore we test the gate via the IRB-expired side-channel:"
            - "Take T2 in APPROVED state. Advance clock past irb_approval_expires_at."
          trigger:
            - "POST /trials/{T2}/open-enrollment"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_IRB_EXPIRED' (the second cross-entity precondition fired)."
            - "T2.status remains 'APPROVED' (transition rejected)."
            - "Alternative positive observation: in the successful path before clock-advance, POST /trials/{T2}/open-enrollment returned 200 ONLY because Trial.active_consent_version != null (i.e., a ConsentVersion existed). This proves the cross-entity dependency on ConsentVersion existence is enforced (positive evidence captured in the same test run by recording both responses)."

  # =============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics (≥ 2)
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_sequence_uniqueness_zero_width_interval
        grounds:
          - validations[priority=50]
          - entities.Visit.fields.sequence_no
          - errors.ERR_DUPLICATE_VISIT_SEQUENCE
        distinguishing_aspect: |
          Interval semantics #1: zero-width interval (point uniqueness). Two
          Visit rows on the same Participant cannot share Visit.sequence_no.
          Resource entity: Visit. Interval is a single point on the
          per-participant sequence axis — adjacency is irrelevant; the only
          conflict is exact equality.
        test_recipe:
          setup:
            - "Trial OPEN_FOR_ENROLLMENT; Participant P1 ENROLLED."
            - "POST /participants/{P1}/visits with sequence_no=3, target_date=day10 -> 201, V1 created."
          trigger:
            - "POST /participants/{P1}/visits with sequence_no=3, target_date=day25 (different date, same sequence_no)"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_DUPLICATE_VISIT_SEQUENCE'"
            - "Only one Visit on P1 with sequence_no=3 (the first one)."

      - name: blood_draw_window_inclusive_band_overlap_semantics
        grounds:
          - calculations.blood_draw_window_check
          - entities.Trial.fields.blood_draw_window_days
          - errors.ERR_DRAW_OUTSIDE_WINDOW
          - validations[priority=40]
        distinguishing_aspect: |
          Interval semantics #2: a symmetric inclusive band of width
          2*window_days+1 days around each Visit.target_date. DIFFERENT
          from instance 1's point-uniqueness — this is a wide band with
          BOTH endpoints inclusive. Resource entity: Visit (different from
          uniqueness-on-sequence_no axis; this is the time axis). Two
          different scheduled Visits on the same Participant ARE allowed
          to have overlapping bands (the conflict here is between the
          actual_draw_at and the per-visit band, not between two Visits) —
          but the interval-arithmetic difference is the substance: closed
          band vs point.
        test_recipe:
          setup:
            - "Trial with blood_draw_window_days=3 (a narrow band, so band = [target-3, target+3] inclusive)."
            - "ENROLLED P1; Visit V_lo with target_date=day10. Visit V_hi with target_date=day20."
            - "Advance clock to day7 (d=3 BEFORE target — inclusive lower endpoint)."
          trigger:
            - "POST /visits/{V_lo}/complete with actual_draw_at = day7 (lower boundary)"
            - "Advance clock to day23 (d=3 AFTER target_date of V_hi — inclusive upper endpoint)."
            - "POST /visits/{V_hi}/complete with actual_draw_at = day23 (upper boundary)"
            - "Advance clock to day24 (d=4 AFTER target_date of V_hi). Schedule another Visit V_x on P1 with target_date=day30."
            - "Advance clock to day26 (d=4 BEFORE target_date of V_x). POST /visits/{V_x}/complete with actual_draw_at = day26."
          assert:
            - "V_lo.status == 'COMPLETED' (lower-inclusive d=3 with window=3 SUCCEEDS) AND V_lo.compensation_cents == 4250 (BASE 5000 - 750*(3-2) = 4250)"
            - "V_hi.status == 'COMPLETED' (upper-inclusive d=3 with window=3 SUCCEEDS) AND V_hi.compensation_cents == 4250 (same band semantics)"
            - "V_x's POST returns HTTP 409 with ERR_DRAW_OUTSIDE_WINDOW (d=4 falls just outside the band — proves boundary)"
            - "Compare to instance 1: instance 1 uses zero-width point semantics on the sequence_no axis; this instance uses a closed-band interval on the time axis — same resource entity (Visit), different interval arithmetic."

  # =============================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities (≥ 2)
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: participant_withdraw_inverts_provisional_payment_sum
        grounds:
          - state_machines.Participant.ENROLLED_to_WITHDRAWN
          - state_machines.Visit.SCHEDULED_to_COMPLETED
          - entities.Payment.fields.kind
          - entities.Payment.fields.amount_cents
          - calculations.participant_compensation
        distinguishing_aspect: |
          Conserved quantity: sum(Payment.amount_cents WHERE
          Payment.participant_id == P AND kind IN {PROVISIONAL, REVERSAL}).
          Invariant: when a Participant withdraws, the cascade writes a
          REVERSAL row for every PROVISIONAL row tied to a CANCELLED Visit;
          the sum of {PROVISIONAL + REVERSAL} rows on that participant for
          cancelled visits MUST equal zero exactly. Provisional payments
          for visits that completed BEFORE withdrawal are NOT reversed
          (legitimately earned). This is the money-conservation invariant.
        test_recipe:
          setup:
            - "Trial T1; Participant P1 ENROLLED; blood_draw_window_days=7."
            - "Schedule V1 (day10), V2 (day20). Advance to day10; complete V1 (d=0, PROVISIONAL Pmt1 with amount_cents=6000). V2 still SCHEDULED."
            - "Advance to day12."
          trigger:
            - "POST /participants/{P1}/withdraw"
          assert:
            - "V1.status == 'COMPLETED' AND V2.status == 'CANCELLED'."
            - "GET /participants/{P1}/payments returns exactly 1 row (Pmt1, kind=PROVISIONAL, amount_cents=6000). No REVERSAL row was needed for V2 because V2 never had a PROVISIONAL."
            - "Now run the harder case: BEFORE withdraw, advance to day20 and complete V2 (d=0, PROVISIONAL Pmt2=6000). Then withdraw. Expectation: V1 and V2 both COMPLETED-terminal; cascade has no SCHEDULED visits to cancel; thus no REVERSAL rows. Sum of provisional rows on P1 == 12000, sum of reversals == 0."
            - "Hardest invariant case: schedule V3 (day30) on a fresh participant P2 with same setup. Complete V1 and V2 on P2. Then withdraw P2 while V3 still SCHEDULED. V3 cancels but has no PROVISIONAL — sum invariant: PROVISIONAL_amount_for_V3 + REVERSAL_amount_for_V3 == 0 (both terms are 0)."
            - "GLOBAL invariant assertion (all three sub-scenarios): for every Visit V where V.status == 'CANCELLED', sum of Payment.amount_cents tied to V.id (across kinds PROVISIONAL + REVERSAL) == 0."

      - name: ae_resolved_inverts_open_ae_count_delta
        grounds:
          - state_machines.AdverseEvent.OPEN_to_UNDER_REVIEW
          - state_machines.AdverseEvent.UNDER_REVIEW_to_RESOLVED
          - state_machines.AdverseEvent.OPEN_to_ESCALATED_HOLD
          - state_machines.AdverseEvent.ESCALATED_HOLD_to_RESOLVED
          - entities.Participant.fields.open_ae_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance 1 (count, not cents):
          Participant.open_ae_count. Invariant: across the lifetime of any
          single AdverseEvent row, the net delta to
          Participant.open_ae_count is zero — +1 on intake, 0 on any
          intermediate transition (start-review, escalate), -1 on resolve.
          Forward action (AE intake) paired with compensating action (AE
          resolve) leaves open_ae_count UNCHANGED relative to its value
          before the AE existed. This is a different conserved quantity
          (a non-negative integer counter) from the cents-balance invariant
          in instance 1.
        test_recipe:
          setup:
            - "Trial T1 OPEN_FOR_ENROLLMENT; P1 ENROLLED. Snapshot open_ae_count_before = P1.open_ae_count (expected: 0)."
          trigger:
            - "POST /participants/{P1}/adverse-events with severity='MILD' (creates AE_M in OPEN)"
            - "POST /participants/{P1}/adverse-events with severity='SEVERE' (creates AE_S directly in ESCALATED_HOLD via auto-escalate)"
            - "POST /participants/{P1}/adverse-events/{AE_M}/start-review (OPEN -> UNDER_REVIEW)"
            - "POST /participants/{P1}/adverse-events/{AE_M}/resolve with resolution_note='ok' (UNDER_REVIEW -> RESOLVED)"
            - "POST /participants/{P1}/adverse-events/{AE_S}/resolve with resolution_note='resolved' (ESCALATED_HOLD -> RESOLVED)"
          assert:
            - "After AE_M intake: P1.open_ae_count == 1"
            - "After AE_S intake: P1.open_ae_count == 2"
            - "After AE_M start-review: P1.open_ae_count == 2 (intermediate transitions are 0-delta)"
            - "After AE_M resolve: P1.open_ae_count == 1"
            - "After AE_S resolve: P1.open_ae_count == 0 == open_ae_count_before (invariant: net delta zero)"
            - "AE_M.status == 'RESOLVED' AND AE_S.status == 'RESOLVED'"
