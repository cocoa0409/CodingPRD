  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_half_open_overlap_rejected_back_to_back_allowed
        grounds:
          - validations[priority=12]
          - errors[ERR_PROVIDER_DOUBLE_BOOKED]
          - entities.Encounter.fields.scheduled_start
          - entities.Encounter.fields.scheduled_end
        distinguishing_aspect: |
          Provider scheduling uses half-open [start,end) semantics: an encounter [10:15,10:45) overlapping an
          existing [10:00,10:30) on the same provider is rejected ERR_PROVIDER_DOUBLE_BOOKED, while a back-to-back
          [10:30,11:00) touching at the boundary is allowed — plain interval intersection, no buffer.
        test_recipe:
          setup:
            - "A provider with one existing non-VOIDED encounter [10:00,10:30) on 2026-06-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat A", date_of_birth: "1965-03-15", has_diabetes_mellitus: false }
              as: FrontDesk
              captures: { pat1_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat B", date_of_birth: "1966-04-16", has_diabetes_mellitus: false }
              as: FrontDesk
              captures: { pat2_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat1_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T10:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
          trigger:
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat2_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-02T10:15:00Z", scheduled_end: "2026-06-02T10:45:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PROVIDER_DOUBLE_BOOKED"

      - name: modality_buffered_overlap_rejected_within_cleanup
        grounds:
          - validations[priority=13]
          - errors[ERR_MODALITY_DOUBLE_BOOKED]
          - entities.Modality.fields.cleanup_buffer_minutes
          - entities.ImagingOrder.fields.study_start
        distinguishing_aspect: |
          Modality scheduling expands each study by a 15-minute cleanup buffer after its end: an existing study
          [10:00,10:30) blocks the window up to 10:45, so a new study [10:40,11:00) is rejected
          ERR_MODALITY_DOUBLE_BOOKED even though the raw intervals do not overlap — buffered/adjacency semantics,
          a different interval geometry on a different resource than the provider rule.
        test_recipe:
          setup:
            - "A modality with cleanup_buffer_minutes=15 holding one SCHEDULED study [10:00,10:30) on 2026-06-02"
            - "Two encounters to attach imaging orders to"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/modalities"
              payload: { practice_id: "${prac_id}", name: "X-Ray 1", modality_type: "XRAY", cleanup_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { mod_id: $.data.id, mod_v0: $.data.version }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat I1", date_of_birth: "1967-05-17", has_diabetes_mellitus: false }
              as: FrontDesk
              captures: { pat1_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat I2", date_of_birth: "1968-06-18", has_diabetes_mellitus: false }
              as: FrontDesk
              captures: { pat2_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat1_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc1_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat2_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-02T09:35:00Z", scheduled_end: "2026-06-02T09:55:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc2_id: $.data.id }
            - call: "POST /podiatry/imaging-orders"
              payload: { encounter_id: "${enc1_id}", modality_id: "${mod_id}", study_start: "2026-06-02T10:00:00Z", study_end: "2026-06-02T10:30:00Z", expected_modality_version: "${mod_v0}" }
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "GET /podiatry/modalities/${mod_id}"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { mod_v_now: $.data.version }
          trigger:
            - call: "POST /podiatry/imaging-orders"
              payload: { encounter_id: "${enc2_id}", modality_id: "${mod_id}", study_start: "2026-06-02T10:40:00Z", study_end: "2026-06-02T11:00:00Z", expected_modality_version: "${mod_v_now}" }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MODALITY_DOUBLE_BOOKED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: dme_dispense_then_return_conserves_pa_units
        grounds:
          - state_machines.DmeDispense.DISPENSED_to_RETURNED
          - calculations.pa_units_drawdown
          - entities.PriorAuthorization.fields.units_consumed
          - entities.PriorAuthorization.fields.remaining_units
        distinguishing_aspect: |
          Conserved quantity = PA authorized units. After dispense (units 2, consumed->2, remaining->0, EXHAUSTED)
          followed by its compensating return, the invariant remaining_units == authorized_units - units_consumed
          holds and the totals return to consumed 0 / remaining 2 / status APPROVED — zero drift in the units pool.
        test_recipe:
          setup:
            - "Diabetic patient with a DME PA authorized_units=2 APPROVED; an OPEN encounter; a dispense of 2 units already made (PA EXHAUSTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Cons", date_of_birth: "1952-07-19", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations"
              payload: { patient_id: "${pat_id}", service_category: "DME", hcpcs_code: "L4360", authorized_units: 2, valid_from_date: "2026-01-01", valid_through_date: "2026-12-31" }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
              captures: { pa_v0: $.data.version }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T20:00:00Z", scheduled_end: "2026-06-01T20:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "PURCHASE", units: 2, purchase_price_cents: 15000, expected_prior_authorization_version: "${pa_v0}" }
              as: FrontDesk
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /podiatry/dme-dispenses/${disp_id}/return"
              payload: {}
              as: FrontDesk
            - call: "GET /podiatry/prior-authorizations/${pa_id}"
              payload: {}
              as: FrontDesk
              captures: { rem: $.data.remaining_units, cons: $.data.units_consumed, st: $.data.status }
          assert:
            - "PriorAuthorization.${pa_id}.units_consumed == 0"
            - "PriorAuthorization.${pa_id}.remaining_units == 2"
            - "PriorAuthorization.${pa_id}.status == APPROVED"

      - name: encounter_code_then_recode_conserves_charge_zero
        grounds:
          - state_machines.Encounter.CODED_to_EXAM_DONE
          - state_machines.Encounter.EXAM_DONE_to_CODED
          - calculations.encounter_charge_split
          - entities.Encounter.fields.total_patient_resp_cents
          - entities.Encounter.fields.total_medicare_pays_cents
        distinguishing_aspect: |
          Conserved quantity = the encounter monetary ledger. Coding sets nonzero totals (medicare 13600, patient
          3400 for a covered exam+routine); the compensating recode restores total_medicare_pays_cents and
          total_patient_resp_cents to exactly 0 — a different conserved quantity (money) than the PA units pool.
        test_recipe:
          setup:
            - "Diabetic patient (last_covered null) with one encounter holding a COVERED exam and a COVERED routine line, coded (totals medicare 13600, patient 3400)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Money", date_of_birth: "1949-08-20", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T21:00:00Z", scheduled_end: "2026-06-01T21:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/procedures"
              payload: { encounter_id: "${enc_id}", procedure_kind: "ROUTINE_NAIL_DEBRIDEMENT", service_date: "2026-06-01", billed_cents: 8000, fee_cap_cents: 7000 }
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters/${enc_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters/${enc_id}/code"
              payload: {}
              as: BillingSpecialist
              captures: { med_after_code: $.data.total_medicare_pays_cents, pat_after_code: $.data.total_patient_resp_cents }
          trigger:
            - call: "POST /podiatry/encounters/${enc_id}/recode"
              payload: {}
              as: BillingSpecialist
              captures: { med_after_recode: $.data.total_medicare_pays_cents, pat_after_recode: $.data.total_patient_resp_cents }
          assert:
            - "Encounter.${enc_id}.total_medicare_pays_cents == 0"
            - "Encounter.${enc_id}.total_patient_resp_cents == 0"
            - "Encounter.${enc_id}.status == EXAM_DONE"
