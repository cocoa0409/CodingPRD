        grounds:
          - validations[priority=15]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
          - entities.Inspection.fields.scheduled_start
          - entities.Inspection.fields.scheduled_end
        distinguishing_aspect: |
          INTERVAL SEMANTICS = pairwise half-open overlap on the Inspector resource: an inspection
          [09:00,10:00) already booked for the inspector rejects a second [09:30,10:30) (overlap)
          but would accept [10:00,11:00) (adjacency, touching endpoints, do NOT overlap). This
          instance triggers the overlapping case -> ERR_INSPECTOR_DOUBLE_BOOKED.
