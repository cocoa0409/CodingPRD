# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2991_academic_integrity_case_adjudication
#
# Breadth probe. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7, is reachable from an
# empty database using only §1.5 endpoints, and asserts pre-computed literals. Corners that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) already exercises appear as `excluded_because:`
# stubs naming the covering §1.8 instance.
#
# Shared literals reused below (identical to the §1.8 fixture vocabulary):
#   clock default              2026-08-01T00:00:00Z
#   UNKNOWN_ID                 00000000-0000-4000-8000-000000000000
#   ENGL department            enrolled_student_count 2000, faculty_headcount 5
#   ENGL-201 / 2026FA          ESSAY 200/40, MIDTERM 70/30, PROJECT 90/20, FINAL 180/10
#   canonical component_scores ESSAY 156, MIDTERM 68, PROJECT 56, FINAL 113
#   SEED-A evidence            SIMILARITY_REPORT similarity_pct 45.00 page_count 4
#                              -> evidence_strength_score 60.00, severity_index 44.00, rank 3
#
# Error-catalog coverage map (§1.6 -> covering instance) is at the foot of this file.

scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:

      - name: department_creation_returns_201_with_the_full_success_envelope
        claim_type: Creation
        grounds:
          - entities.Department
          - endpoints[POST /integrity/departments]
          - response_envelope.success
        distinguishing_aspect: |
          A create must echo every declared field, not only the ones the client sent: the four
          computed fields (open_case_count, training_completion_pct, reporting_rate_per_1k_submitted,
          monitoring_flag) and the four common fields must all be present on the 201 body, and
          monitoring_flag must already be UNDER_REPORTING because a first department reports at
          rate 0.00 against its own median of 0.00 with a training_completion_pct of 0.00.
        test_recipe:
          setup:
            - "empty database, clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
          trigger:
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
          assert:
            - "HTTP 201 and the body has exactly the keys meta, response_type and data"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty"
            - "response_type == object"
            - "data.code == ENGL, data.name == English, data.enrolled_student_count == 2000, data.faculty_headcount == 5"
            - "data.open_case_count == 0, data.training_completion_pct == 0.00, data.reporting_rate_per_1k_submitted == 0.00"
            - "data.monitoring_flag == UNDER_REPORTING - a department with zero submitted reports sits at or below its own peer median with a training deficit"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at == data.updated_at"

      - name: reading_back_each_entity_by_id_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /integrity/departments/{id}]
          - endpoints[GET /integrity/students/{id}]
          - endpoints[GET /integrity/evidence-items/{id}]
        distinguishing_aspect: |
          The read path must return the persisted row, including the immutable EvidenceItem which
          carries only id and created_at (common_fields false) and must NOT grow a version or an
          updated_at on read.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL department, a reporter, a student, ENGL-201 and one DRAFT report carrying one SEED-A evidence item"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { evidence_id: $.data.id }
          trigger:
            - call: "GET /integrity/departments/${dept_engl_id}"
              as: RegistrarOfficer
            - call: "GET /integrity/students/${student_id}"
              as: RegistrarOfficer
            - call: "GET /integrity/evidence-items/${evidence_id}"
              as: IntegrityOfficer
          assert:
            - "GET /integrity/departments/${dept_engl_id} returns HTTP 200 with data.id == ${dept_engl_id} and data.code == ENGL"
            - "GET /integrity/students/${student_id} returns data.full_name == Sam Student, data.class_year == 3, data.standing == GOOD_STANDING, data.transcript_notation == NONE, data.prior_upheld_count == 0, data.active_sanction_points == 0"
            - "GET /integrity/evidence-items/${evidence_id} returns data.sha256 == 1111111111111111111111111111111111111111111111111111111111111111, data.page_count == 4, data.similarity_pct == 45.00"
            - "the EvidenceItem body carries id and created_at but NO version and NO updated_at key at all (entities.EvidenceItem.common_fields is false)"
            - "the Department body carries all four common fields id, created_at, updated_at and version"

      - name: student_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /integrity/students]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: |
          Three students exist, so limit 2 offset 0 must report total_count 3 with has_more true
          while limit 2 offset 2 reports has_more false with a single row - total_count counts the
          whole filtered set, not the page. The default limit of 10 must apply when limit is absent,
          and limit 0, limit 101 and offset -1 must all be rejected before any row is read.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; exactly three students, created in the order Sam, Lee, Ida"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_a_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Lee Learner", email: "lee@u.edu", program_code: "BA-ENG", class_year: 2 }
              as: IntegrityOfficer
              captures: { student_b_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Ida Iota", email: "ida@u.edu", program_code: "BA-HIS", class_year: 4 }
              as: IntegrityOfficer
              captures: { student_c_id: $.data.id }
          trigger:
            - call: "GET /integrity/students?limit=2&offset=0"
              as: RegistrarOfficer
            - call: "GET /integrity/students?limit=2&offset=2"
              as: RegistrarOfficer
            - call: "GET /integrity/students"
              as: RegistrarOfficer
            - call: "GET /integrity/students?email=lee@u.edu"
              as: RegistrarOfficer
            - call: "GET /integrity/students?limit=0"
              as: RegistrarOfficer
              captures: { pagination_error_low: $.data.error_id }
            - call: "GET /integrity/students?limit=101"
              as: RegistrarOfficer
              captures: { pagination_error_high: $.data.error_id }
            - call: "GET /integrity/students?offset=-1"
              as: RegistrarOfficer
              captures: { pagination_error_offset: $.data.error_id }
          assert:
            - "limit=2&offset=0 returns HTTP 200, response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "limit=2&offset=2 returns exactly 1 row, total_count == 3, has_more == false"
            - "the unparameterised list returns 3 rows with limit == 10 and offset == 0 - the declared pagination defaults"
            - "email=lee@u.edu returns exactly 1 row with data[0].id == ${student_b_id} and total_count == 1: total_count reflects the filter"
            - "limit=0 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit=101 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION (100 is the declared maximum and is accepted)"
            - "offset=-1 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"

      - name: every_entity_lookup_by_unknown_uuid_returns_its_own_not_found_error_id
        claim_type: Not Found
        grounds:
          - errors.ERR_DEPARTMENT_NOT_FOUND
          - errors.ERR_FACULTY_MEMBER_NOT_FOUND
          - errors.ERR_STUDENT_NOT_FOUND
          - errors.ERR_OFFERING_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_EVIDENCE_ITEM_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_NOTIFICATION_NOT_FOUND
          - errors.ERR_ADVISOR_ENGAGEMENT_NOT_FOUND
          - errors.ERR_MEETING_NOT_FOUND
          - errors.ERR_ROOM_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_PANEL_VOTE_NOT_FOUND
          - errors.ERR_SANCTION_NOT_FOUND
          - errors.ERR_APPEAL_NOT_FOUND
        distinguishing_aspect: |
          Fifteen collections, fifteen distinct error_id values, one shared syntactically valid but
          absent UUID. An implementation that funnels every miss through a single generic 404 fails
          on fourteen of the fifteen assertions, and one that treats an unknown id as a shape problem
          fails all fifteen by returning 400.
        test_recipe:
          setup:
            - "empty database except the clock; UNKNOWN_ID is 00000000-0000-4000-8000-000000000000 and is never minted by any create"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
          trigger:
            - call: "GET /integrity/departments/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_department: $.data.error_id }
            - call: "GET /integrity/faculty-members/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_faculty: $.data.error_id }
            - call: "GET /integrity/students/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_student: $.data.error_id }
            - call: "GET /integrity/course-offerings/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_offering: $.data.error_id }
            - call: "GET /integrity/reports/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_report: $.data.error_id }
            - call: "GET /integrity/evidence-items/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_evidence: $.data.error_id }
            - call: "GET /integrity/cases/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_case: $.data.error_id }
            - call: "GET /integrity/notifications/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_notification: $.data.error_id }
            - call: "GET /integrity/advisor-engagements/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_advisor: $.data.error_id }
            - call: "GET /integrity/case-meetings/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_meeting: $.data.error_id }
            - call: "GET /integrity/hearing-rooms/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_room: $.data.error_id }
            - call: "GET /integrity/hearing-sessions/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_session: $.data.error_id }
            - call: "GET /integrity/panel-votes/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_vote: $.data.error_id }
            - call: "GET /integrity/sanctions/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_sanction: $.data.error_id }
            - call: "GET /integrity/appeals/00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_appeal: $.data.error_id }
          assert:
            - "every one of the fifteen calls returns HTTP 404 with response_type == error and a non-empty data.message"
            - "data.error_id is ERR_DEPARTMENT_NOT_FOUND, ERR_FACULTY_MEMBER_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_OFFERING_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_EVIDENCE_ITEM_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_ADVISOR_ENGAGEMENT_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_PANEL_VOTE_NOT_FOUND, ERR_SANCTION_NOT_FOUND and ERR_APPEAL_NOT_FOUND respectively - fifteen different values"
            - "no response body contains a data.id key: a 404 envelope carries only error_id and message under data"

      - name: omitting_any_required_input_field_returns_invalid_request_before_any_row_is_written
        claim_type: Required Fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations[priority=5]
          - endpoints[POST /integrity/departments]
          - endpoints[POST /integrity/students]
          - endpoints[POST /integrity/course-offerings]
        distinguishing_aspect: |
          Shape validation must run before referential and business checks, so a create that omits a
          required field is refused with ERR_INVALID_REQUEST (400) even when the omitted field would
          have failed a 404 or 409 check anyway - and nothing is persisted, which the follow-up list
          call proves by still reporting total_count 0.
        test_recipe:
          setup:
            - "empty database, clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
          trigger:
            - call: "POST /integrity/departments"
              payload: { name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { err_missing_code: $.data.error_id }
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { err_missing_count: $.data.error_id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG" }
              as: IntegrityOfficer
              captures: { err_missing_class_year: $.data.error_id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: null }
              as: IntegrityOfficer
              captures: { err_null_class_year: $.data.error_id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "00000000-0000-4000-8000-000000000000", instructor_id: "00000000-0000-4000-8000-000000000000", course_code: "ENGL-201", term_code: "2026FA" }
              as: IntegrityOfficer
              captures: { err_missing_components: $.data.error_id }
          assert:
            - "all five calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "an explicit null in class_year is rejected exactly like an absent key - validations priority 5 treats missing and null identically"
            - "the offering create returns ERR_INVALID_REQUEST and NOT ERR_DEPARTMENT_NOT_FOUND, even though department_id names no row: shape precedes referential"
            - "GET /integrity/departments returns total_count 0 and GET /integrity/students returns total_count 0 - no partial row was written"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.HearingRoom.fields.buffer_minutes
          - entities.HearingRoom.fields.sessions_per_day_cap
          - entities.Notification.fields.response_window_days
          - entities.AdvisorEngagement.fields.advisor_bar_licensed
          - entities.CaseMeeting.fields.advisor_present
        distinguishing_aspect: |
          Five fields declare defaults on five different entities; omitting each must yield exactly
          the declared value, and the default response_window_days of 7 must flow through the
          response_deadline_at computation, giving 2026-08-08T00:00:00Z rather than the 2026-08-06
          that the §1.8 fixtures' explicit 5-day window produces.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL department, reporter with current training, student, ENGL-201, one accepted report and its Case in INTAKE_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /integrity/hearing-rooms"
              payload: { code: "ROOM-D", seat_capacity: 12 }
              as: IntegrityOfficer
              captures: { room_d_id: $.data.id }
            - call: "POST /integrity/cases/${case_id}/notifications"
              payload: { kind: "ALLEGATION_NOTICE" }
              as: IntegrityOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /integrity/advisor-engagements"
              payload: { case_id: "${case_id}", advisor_full_name: "Fay Faculty", advisor_kind: "FACULTY_ADVISOR" }
              as: Student
              as_user_id: "${student_id}"
              captures: { advisor_id: $.data.id }
            - call: "POST /integrity/case-meetings"
              payload: { case_id: "${case_id}", instructor_id: "${reporter_id}", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T10:00:00Z" }
              as: IntegrityOfficer
              captures: { meeting_id: $.data.id }
          assert:
            - "HearingRoom.${room_d_id}.buffer_minutes == 30 and sessions_per_day_cap == 2, the declared defaults, with booked_minutes_total == 0"
            - "Notification.${notice_id}.response_window_days == 7, the declared default"
            - "Notification.${notice_id}.sent_at == 2026-08-01T00:00:00Z and response_deadline_at == 2026-08-08T00:00:00Z - seven days, not the five the §1.8 fixtures use"
            - "AdvisorEngagement.${advisor_id}.advisor_bar_licensed == false and status == REQUESTED"
            - "CaseMeeting.${meeting_id}.advisor_present == false and duration_minutes == 60"

      - name: client_supplied_values_for_computed_and_system_fields_are_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Department.fields.open_case_count
          - entities.FacultyMember.fields.training_status
          - entities.Student.fields.prior_upheld_count
          - entities.IntegrityReport.fields.status
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Every computed and system field is server-owned. Because ERR_INVALID_REQUEST's trigger
          includes "unknown field", a create that tries to seed open_case_count, training_status or
          report status must be refused outright with 400 rather than silently accepted-and-ignored -
          the stricter of the two plausible readings, and the one the error catalog declares.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL department exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
          trigger:
            - call: "POST /integrity/departments"
              payload: { code: "HIST", name: "History", enrolled_student_count: 1000, faculty_headcount: 4, open_case_count: 99 }
              as: IntegrityOfficer
              captures: { err_seed_open_cases: $.data.error_id }
            - call: "POST /integrity/faculty-members"
