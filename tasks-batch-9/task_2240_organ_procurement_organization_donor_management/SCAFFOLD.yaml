scenario: "2240. Organ Procurement Organization Donor Management (organ procurement organization): hospital death referral intake against clinical triggers and timeliness metrics, donor eligibility screening, serology and behavioral risk assessment, authorization from first-person registry or legal next of kin with documentation, donor physiologic management and organ viability optimization, organ allocation offer sequencing through the national match run with acceptance clocks, recovery surgery team and transport logistics with cold ischemic time, research and tissue referral for non-transplantable organs, performance metrics reporting and recertification thresholds"
domain_name: organ-procurement-donor-management
api_prefix: /opo

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is addressable at its own top-level collection under /opo
  # (/opo/organs/{id}, /opo/authorizations/{id}, ...). Parents are
  # named by FK fields in request bodies, never by URL nesting depth; the few nested
  # POST/GET paths are creation and reverse-lookup conveniences, not ownership chains.

  state_machine_shape: parallel
  # DonorCase carries two independent dimensions (physiologic_status x allocation_status)
  # plus a derived case_posture gate. EligibilityScreening is cyclic
  # (PENDING -> INFO_REQUESTED -> PENDING), Authorization is branching with a
  # documentation revision cycle, OrganOffer is cyclic (BYPASSED -> QUEUED restore).

  relationship_patterns:
    - one_to_many          # HospitalPartner -> DeathReferral, DonorCase -> Organ, MatchRun -> OrganOffer
    - cross_aggregate      # Organ -> TransportAsset, RecoveryOperation -> RecoveryTeam

  role_model: segregation_of_duties
  # The coordinator who submits a behavioral risk assessment may not be the medical
  # director who rules on it; the specialist who records next-of-kin consent may not be
  # the specialist who finalizes the authorization documentation packet.

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities / 48 endpoints / 56 error codes / 43 ordered validation rows / 8 calculation
# rules (3 with divergent variants) / 8 state machines (3 cyclic, 1 parallel x 2 dimensions,
# 1 branching) / 2 optimistic-concurrency rules / 2 cascade chains of depth 4 and 5.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: HospitalPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the referring hospital.
      - name: hospital_code
        type: string
        source: input
        description: Short operating code; unique across all HospitalPartner rows.
        constraints: "unique; 2..12 chars"
      - name: referral_trigger_policy
        type: enum
        source: input
        description: Which clinical trigger obliges the hospital to call the OPO.
        default: VENTILATED_NEURO_INJURY
        constraints: "VENTILATED_NEURO_INJURY | ALL_VENTILATED_DEATHS | ALL_DEATHS"
      - name: timely_referral_window_minutes
        type: integer
        source: input
        description: Minutes allowed between clinical trigger and referral call; the timeliness threshold is inclusive.
        default: 60
        constraints: "1..1440"
      - name: referral_count
        type: integer
        source: computed
        description: Lifetime count of DeathReferral rows created for this hospital.
        default: 0
      - name: timely_referral_count
        type: integer
        source: computed
        description: Lifetime count of this hospital's referrals with timeliness_flag == TIMELY.
        default: 0
      - name: untimely_referral_count
        type: integer
        source: computed
        description: Lifetime count of this hospital's referrals with timeliness_flag == UNTIMELY.
        default: 0
      - name: timely_referral_rate
        type: number
        source: computed
        description: "Lifetime timeliness percentage per calculations.hospital_timeliness_posture (incremental_lifetime variant); null while referral_count == 0."
        default: null
        constraints: "0.00..100.00, 2dp, or null"
      - name: partner_posture
        type: enum
        source: computed
        description: Threshold-derived standing recomputed after every referral intake.
        default: GOOD_STANDING
        constraints: "GOOD_STANDING | WATCH | PROBATION"
      - name: converted_donor_count
        type: integer
        source: computed
        description: Lifetime count of this hospital's referrals that reached DeathReferral.status == CONVERTED.
        default: 0

  - name: DeathReferral
    parent: null
    common_fields: true
    fields:
      - name: hospital_partner_id
        type: string
        source: input
        description: "FK -> HospitalPartner.id; the hospital that placed the referral call."
      - name: patient_mrn
        type: string
        source: input
        description: Referring hospital's medical record number for the decedent.
      - name: age_years
        type: integer
        source: input
        description: Age of the decedent in whole years.
        constraints: "0..100"
      - name: ventilated
        type: boolean
        source: input
        description: Whether the patient was on mechanical ventilation at the trigger event; drives the imminent-death denominator in performance reporting.
      - name: gcs_score
        type: integer
        source: input
        description: Glasgow Coma Scale total at the trigger event.
        constraints: "3..15"
      - name: cause_of_death_category
        type: enum
        source: input
        description: Coded cause of death used by screening criteria.
        constraints: "ANOXIA | CVA_STROKE | HEAD_TRAUMA | CNS_TUMOR | OTHER"
      - name: trigger_event_at
        type: datetime
        source: input
        description: Instant the hospital's configured clinical trigger was first met.
      - name: death_pronounced_at
        type: datetime
        source: input
        description: Instant death was pronounced; nullable, and the basis of the death_note_basis timeliness variant.
        default: null
      - name: referred_at
        type: datetime
        source: system
        description: Logical clock instant at which the referral call was recorded.
      - name: referral_lag_minutes
        type: integer
        source: computed
        description: "Minutes from trigger_event_at to referred_at per calculations.referral_timeliness_lag (clinical_trigger_basis)."
      - name: timeliness_flag
        type: enum
        source: computed
        description: TIMELY when referral_lag_minutes <= hospital's timely_referral_window_minutes, else UNTIMELY.
        constraints: "TIMELY | UNTIMELY"
      - name: audit_lag_minutes
        type: integer
        source: computed
        description: "Minutes from death_pronounced_at to referred_at per the death_note_basis variant; null when death_pronounced_at is null."
        default: null
      - name: status
        type: enum
        source: system
        description: Referral lifecycle state.
        default: RECEIVED
        constraints: "RECEIVED | SCREENING | SCREEN_CLEARED | RULED_OUT | AUTH_PENDING | CONVERTED | NOT_CONVERTED"

  - name: EligibilityScreening
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> DeathReferral.id; the referral being screened."
      - name: status
        type: enum
        source: system
        description: Screening review state; cycles between PENDING and INFO_REQUESTED.
        default: PENDING
        constraints: "PENDING | INFO_REQUESTED | CLEARED | RULED_OUT"
      - name: info_request_count
        type: integer
        source: computed
        description: Number of times the medical director has bounced this screening back for more information.
        default: 0
      - name: risk_factors
        type: array
        source: input
        description: Behavioral risk factor enum members explicitly reported by the informant.
        default: []
        constraints: "members of FACTOR_WEIGHTS keys; duplicates de-duplicated"
      - name: unresolved_factors
        type: array
        source: input
        description: Behavioral risk factors the informant could neither confirm nor exclude; only scored under the records_only variant.
        default: []
        constraints: "members of FACTOR_WEIGHTS keys; disjoint from risk_factors"
      - name: informant_reliability
        type: enum
        source: input
        description: Quality of the behavioral history source; selects the risk-score variant and the reliability multiplier.
        default: null
        constraints: "PRIMARY_NEXT_OF_KIN | SECONDARY_CONTACT | MEDICAL_RECORD_ONLY | null"
      - name: risk_score
        type: number
        source: computed
        description: "Behavioral risk score per calculations.behavioral_risk_score; null until a risk assessment is submitted."
        default: null
        constraints: "0.00..25.00, 2dp"
      - name: risk_tier
        type: enum
        source: computed
        description: INCREASED_RISK when risk_score >= RISK_TIER_THRESHOLD (12.00), else STANDARD; null until scored.
        default: null
        constraints: "STANDARD | INCREASED_RISK | null"
      - name: risk_variant_applied
        type: enum
        source: computed
        description: Which behavioral_risk_score variant produced risk_score.
        default: null
        constraints: "INTERVIEW_BASED | RECORDS_ONLY | null"
      - name: risk_assessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ReferralCoordinator who last submitted the risk assessment; segregation-of-duties counterparty for the screening decision.
        default: null
      - name: absolute_contraindication
        type: boolean
        source: computed
        description: True once any SerologyResult on this screening has absolute_contraindication_marker == true.
        default: false
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalDirector who issued the CLEARED/RULED_OUT decision.
        default: null
      - name: ruled_out_reason
        type: enum
        source: system
        description: Why the screening ended in RULED_OUT.
        default: null
        constraints: "SEROLOGY_CONTRAINDICATION | MEDICAL_UNSUITABILITY | AGE_CRITERIA | DIRECTOR_DECISION | null"

  - name: SerologyResult
    parent: null
    common_fields: false
    fields:
      - name: screening_id
        type: string
        source: input
        description: "FK -> EligibilityScreening.id; the screening this laboratory result belongs to."
      - name: marker
        type: enum
        source: input
        description: Serologic marker assayed.
        constraints: "HIV_AB | HIV_NAT | HBV_SAG | HCV_AB | HCV_NAT | CMV_IGG | EBV_IGG | SYPHILIS_RPR"
      - name: result
        type: enum
        source: input
        description: Assay outcome.
        constraints: "NEGATIVE | POSITIVE | INDETERMINATE"
      - name: nat_confirmed
        type: boolean
        source: input
        description: Whether a nucleic-acid test confirmed the positive result.
        default: false
      - name: resulted_at
        type: datetime
        source: input
        description: Instant the laboratory released the result.
      - name: absolute_contraindication_marker
        type: boolean
        source: computed
        description: "True when marker is in ABSOLUTE_MARKERS {HIV_AB, HIV_NAT, HBV_SAG, HCV_NAT} AND result == POSITIVE AND nat_confirmed == true."
        default: false

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> DeathReferral.id; the referral this authorization packet covers."
      - name: status
        type: enum
        source: system
        description: Authorization workflow state; branches on registry hit and cycles between NOK_CONSENTED and DOCUMENT_DEFICIENT.
        default: PENDING_REGISTRY
        constraints: "PENDING_REGISTRY | REGISTRY_CONFIRMED | NOK_REQUIRED | NOK_CONSENTED | DOCUMENT_DEFICIENT | AUTHORIZED | DECLINED | UNABLE_TO_LOCATE | RESCINDED"
      - name: registry_hit
        type: boolean
        source: input
        description: Whether the first-person donor registry returned a match for the decedent.
      - name: registry_document_ref
        type: string
        source: input
        description: Reference string for the registry match printout; required when registry_hit is true.
        default: null
      - name: authorization_basis
        type: enum
        source: computed
        description: FIRST_PERSON_REGISTRY when the registry branch was taken, LEGAL_NEXT_OF_KIN when consent came from a ranked relative.
        default: null
        constraints: "FIRST_PERSON_REGISTRY | LEGAL_NEXT_OF_KIN | null"
      - name: consenting_rank
        type: integer
        source: computed
        description: NOK_RANK of the relative whose CONSENT moved this authorization to NOK_CONSENTED.
        default: null
        constraints: "1..6 or null"
      - name: highest_rank_attempted
        type: integer
        source: computed
        description: Numerically lowest (highest-priority) NOK_RANK for which a NextOfKinContact row exists on this authorization.
        default: null
      - name: document_types_present
        type: array
        source: computed
        description: Distinct document_type values uploaded so far.
        default: []
        constraints: "members of REGISTRY_SCREENSHOT | RECORDED_CONSENT_AUDIO | SIGNED_CONSENT_FORM | WITNESS_ATTESTATION"
      - name: required_document_types
        type: array
        source: computed
        description: Documents the basis demands per calculations.authorization_documentation_completeness.
        default: []
      - name: documentation_complete
        type: boolean
        source: computed
        description: True when required_document_types is a subset of document_types_present and, for the LEGAL_NEXT_OF_KIN basis, witness_name is non-null.
        default: false
      - name: witness_name
        type: string
        source: input
        description: Name of the witness attesting the telephonic consent; supplied with the WITNESS_ATTESTATION document upload.
        default: null
      - name: consent_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorizationSpecialist who recorded the CONSENT contact; segregation-of-duties counterparty for finalize.
        default: null
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorizationSpecialist who finalized the packet.
        default: null
      - name: rescinded_reason
        type: enum
        source: system
        description: Why an AUTHORIZED packet was rescinded.
        default: null
        constraints: "HIGHER_RANK_OBJECTION | DOCUMENT_FRAUD | null"

  - name: NextOfKinContact
    parent: null
    common_fields: false
    fields:
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the authorization this contact attempt belongs to."
      - name: relationship
        type: enum
        source: input
        description: Relationship of the contacted person to the decedent.
        constraints: "SPOUSE | ADULT_CHILD | PARENT | SIBLING | GRANDPARENT | LEGAL_GUARDIAN"
      - name: rank
        type: integer
        source: computed
        description: "NOK_RANK[relationship]; 1 is the highest-priority class."
        constraints: "1..6"
      - name: contacted_at
        type: datetime
        source: system
        description: Logical clock instant at which the contact attempt was recorded.
      - name: response
        type: enum
        source: input
        description: Outcome of the contact attempt.
        constraints: "CONSENT | DECLINE | UNREACHABLE | OBJECTION"
      - name: contact_note
        type: string
        source: input
        description: Free-text note recorded by the specialist.
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorizationSpecialist who recorded this contact.

  - name: DonorCase
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> DeathReferral.id; the converted referral."
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the AUTHORIZED packet that legally permits recovery."
      - name: donor_code
        type: string
        source: input
        description: OPO-assigned donor identifier printed on labels; unique across DonorCase rows.
        constraints: "unique; 3..16 chars"
      - name: physiologic_status
        type: enum
        source: system
        description: Physiologic dimension, re-derived from the latest PhysiologicObservation. Independent of allocation_status.
        default: STABILIZING
        constraints: "STABILIZING | OPTIMIZED | DECOMPENSATING | LOST"
      - name: allocation_status
        type: enum
        source: system
        description: Allocation dimension, advanced by match-run and recovery events. Independent of physiologic_status.
        default: NOT_STARTED
        constraints: "NOT_STARTED | MATCH_RUN_OPEN | OFFERS_IN_FLIGHT | ALLOCATED | RECOVERED | CLOSED"
      - name: case_posture
        type: enum
        source: computed
        description: "Derived gate over both dimensions per calculations.donor_case_posture; FROZEN blocks every child mutation."
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: viability_index
        type: integer
        source: computed
        description: "0..100 index from the latest observation per calculations.donor_viability_index."
        default: 0
      - name: dmg_bundle_met_count
        type: integer
        source: computed
        description: Count of this case's PhysiologicObservation rows with dmg_bundle_met == true.
        default: 0
      - name: observation_count
        type: integer
        source: computed
        description: Count of PhysiologicObservation rows on this case.
        default: 0
      - name: organ_count
        type: integer
        source: computed
        description: Count of Organ rows on this case.
        default: 0
      - name: organs_accepted_count
        type: integer
        source: computed
        description: Count of this case's organs with status == ACCEPTED.
        default: 0
      - name: organs_recovered_count
        type: integer
        source: computed
        description: Count of this case's organs whose status is RECOVERED, TRANSPLANTED or DISCARDED.
        default: 0
      - name: organs_nontransplantable_count
        type: integer
        source: computed
        description: Count of this case's organs whose status is NON_TRANSPLANTABLE, RESEARCH_REFERRED or TISSUE_REFERRED.
        default: 0
      - name: risk_tier_snapshot
        type: enum
        source: system
        description: EligibilityScreening.risk_tier pinned at case creation; offers on an INCREASED_RISK donor require an acknowledgement.
        constraints: "STANDARD | INCREASED_RISK"
      - name: closed_reason
        type: enum
        source: system
        description: Why allocation_status reached CLOSED.
        default: null
        constraints: "AUTHORIZATION_RESCINDED | DONOR_LOST | RECOVERY_COMPLETE | null"

  - name: PhysiologicObservation
    parent: null
    common_fields: false
    fields:
      - name: donor_case_id
        type: string
        source: input
        description: "FK -> DonorCase.id; the case being managed."
      - name: recorded_at
        type: datetime
        source: input
        description: Instant the vitals were charted; must not be after the logical clock.
      - name: map_mmhg
        type: number
        source: input
        description: Mean arterial pressure in mmHg.
        constraints: "0..200"
      - name: pao2_fio2_ratio
        type: number
        source: input
        description: PaO2/FiO2 oxygenation ratio.
        constraints: "0..600"
      - name: sodium
        type: number
        source: input
        description: Serum sodium in mmol/L.
        constraints: "100..200"
      - name: urine_output_ml_per_kg_hr
        type: number
        source: input
        description: Urine output in mL/kg/hr.
        constraints: "0..20"
      - name: pressor_count
        type: integer
        source: input
        description: Number of vasopressor agents infusing.
        constraints: "0..5"
      - name: cardiac_arrest
        type: boolean
        source: input
        description: Whether the donor arrested at this observation; forces physiologic_status LOST.
        default: false
      - name: dmg_bundle_met
        type: boolean
        source: computed
        description: "True when this observation satisfies every donor-management-goal bound per calculations.donor_viability_index."
        default: false
      - name: viability_index_snapshot
        type: integer
        source: computed
        description: viability_index computed from this observation alone.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the DonorCoordinator who charted the observation.

  - name: Organ
    parent: null
    common_fields: true
    fields:
      - name: donor_case_id
        type: string
        source: input
        description: "FK -> DonorCase.id; the donor this organ belongs to."
      - name: organ_type
        type: enum
        source: input
        description: Anatomic organ; unique per donor case.
        constraints: "HEART | LUNG_LEFT | LUNG_RIGHT | LIVER | KIDNEY_LEFT | KIDNEY_RIGHT | PANCREAS | INTESTINE"
      - name: status
        type: enum
        source: system
        description: Organ lifecycle state.
        default: PENDING_EVAL
        constraints: "PENDING_EVAL | ALLOCATABLE | OFFERING | ACCEPTED | RECOVERED | TRANSPLANTED | DISCARDED | NON_TRANSPLANTABLE | RESEARCH_REFERRED | TISSUE_REFERRED"
      - name: cit_limit_minutes
        type: integer
        source: computed
        description: "CIT_LIMIT_MINUTES[organ_type] cold ischemic ceiling for this organ type."
      - name: viability_hold
        type: boolean
        source: computed
        description: True while a RESTRICTED case posture has pulled a thoracic organ back for re-evaluation.
        default: false
      - name: accepted_offer_id
        type: string
        source: system
        description: "FK -> OrganOffer.id; the offer currently holding this organ's acceptance, null when none."
        default: null
      - name: cross_clamp_at
        type: datetime
        source: computed
        description: Cross-clamp instant copied from the RecoveryOperation that recovered this organ.
        default: null
      - name: transport_asset_id
        type: string
        source: input
        description: "FK -> TransportAsset.id; the asset carrying this organ, null before dispatch."
        default: null
      - name: transport_mode
        type: enum
        source: input
        description: Carriage mode for the leg.
        default: null
        constraints: "GROUND | FIXED_WING | HELICOPTER | null"
      - name: transport_depart_at
        type: datetime
        source: input
        description: Scheduled departure instant of the transport leg.
        default: null
      - name: transport_arrive_at
        type: datetime
        source: input
        description: Scheduled arrival instant of the transport leg at the accepting centre.
        default: null
      - name: transit_minutes
        type: integer
        source: computed
        description: Whole minutes from transport_depart_at to transport_arrive_at.
        default: null
      - name: implant_prep_minutes
        type: integer
        source: computed
        description: "Prep allowance selected in step 2 of calculations.cold_ischemic_projection."
        default: null
      - name: projected_cold_ischemic_minutes
        type: integer
        source: computed
        description: "Projected total cold ischemic minutes per calculations.cold_ischemic_projection."
        default: null
      - name: projected_cit_margin_minutes
        type: integer
        source: computed
        description: cit_limit_minutes minus projected_cold_ischemic_minutes.
        default: null
      - name: nontransplantable_reason
        type: enum
        source: system
        description: Why the organ became NON_TRANSPLANTABLE.
        default: null
        constraints: "AUTHORIZATION_RESCINDED | VIABILITY_FAILURE | NO_ACCEPTING_CENTER | ANATOMIC_ANOMALY | null"
      - name: research_protocol_code
        type: string
        source: input
        description: Research protocol the organ was referred under.
        default: null
      - name: tissue_processor_code
        type: string
        source: input
        description: Tissue processor the organ was referred to.
        default: null

  - name: MatchRun
    parent: null
    common_fields: true
    fields:
      - name: organ_id
        type: string
        source: input
        description: "FK -> Organ.id; the organ being allocated by this run."
      - name: run_number
        type: integer
        source: computed
        description: 1-based ordinal of this run within its organ, assigned in creation order.
      - name: status
        type: enum
        source: system
        description: Match-run state.
        default: OPEN
        constraints: "OPEN | EXHAUSTED | CLOSED | SUPERSEDED"
      - name: primary_offer_slots
        type: integer
        source: input
        description: How many offers may sit in PENDING at once (primary plus backups).
        default: 2
        constraints: "1..3"
      - name: candidate_count
        type: integer
        source: computed
        description: Number of OrganOffer rows created from the candidate list.
      - name: pending_offer_count
        type: integer
        source: computed
        description: Count of this run's offers with status == PENDING.
        default: 0
      - name: slots_free
        type: integer
        source: computed
        description: primary_offer_slots minus pending_offer_count; the conserved half of the allocation-slot invariant.
        default: 0
      - name: generated_at
        type: datetime
        source: system
        description: Logical clock instant at which the run was generated.
      - name: closed_reason
        type: enum
        source: system
        description: Why the run left OPEN.
        default: null
        constraints: "ACCEPTED | SUPERSEDED_BY_NEW_RUN | CASE_CLOSED | VIABILITY_HOLD | CANDIDATES_EXHAUSTED | null"

  - name: OrganOffer
    parent: null
    common_fields: true
    fields:
      - name: match_run_id
        type: string
        source: input
        description: "FK -> MatchRun.id; the run that sequenced this offer."
      - name: sequence_position
        type: integer
        source: input
        description: Position of the candidate in the national match sequence; unique within the run and contiguous from 1.
        constraints: ">= 1"
      - name: center_code
        type: string
        source: input
        description: Transplant centre code holding the candidate.
      - name: candidate_code
        type: string
        source: input
        description: Candidate identifier at the centre.
      - name: acceptance_clock_minutes
        type: integer
        source: input
        description: Minutes the centre gets to answer once the offer is promoted to PENDING.
        default: 60
        constraints: "5..240"
      - name: status
        type: enum
        source: system
        description: Offer state; BYPASSED offers can be restored to QUEUED when an acceptance is withdrawn.
        default: QUEUED
        constraints: "QUEUED | PENDING | ACCEPTED | DECLINED | EXPIRED | BYPASSED | WITHDRAWN"
      - name: offered_at
        type: datetime
        source: system
        description: Logical clock instant at which the offer was promoted to PENDING.
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: offered_at plus acceptance_clock_minutes; the acceptance clock deadline.
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: Logical clock instant of the centre's response.
        default: null
      - name: decline_reason
        type: enum
        source: input
        description: Why the centre declined.
        default: null
        constraints: "DONOR_QUALITY | RECIPIENT_UNAVAILABLE | LOGISTICS | SIZE_MISMATCH | null"
      - name: increased_risk_ack
        type: boolean
        source: input
        description: Whether the centre acknowledged an INCREASED_RISK donor; required to accept such an organ.
        default: false
      - name: bypass_reason
        type: enum
        source: system
        description: Why the offer was bypassed; PEER_ACCEPTED bypasses are the ones restored when an acceptance is withdrawn.
        default: null
        constraints: "PEER_ACCEPTED | CASE_CLOSED | VIABILITY_HOLD | null"
      - name: responded_by_user_id
        type: string
        source: system
        description: X-User-ID of the AllocationSpecialist who recorded the response.
        default: null

  - name: RecoveryTeam
    parent: null
    common_fields: true
    fields:
      - name: team_code
        type: string
        source: input
        description: Surgical recovery team code; unique across RecoveryTeam rows.
        constraints: "unique; 2..12 chars"
      - name: specialty
        type: enum
        source: input
        description: Which organ families the team may recover.
        constraints: "THORACIC | ABDOMINAL | MULTIORGAN"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: Buffer applied symmetrically around every booked OR window when testing team availability.
        default: 90
        constraints: "0..480"
      - name: booked_or_minutes
        type: integer
        source: computed
        description: Sum of or_minutes over this team's RecoveryOperation rows with status in {SCHEDULED, COMPLETED}; the conserved quantity of the OR-minutes ledger invariant.
        default: 0
      - name: scheduled_operation_count
        type: integer
        source: computed
        description: Count of this team's RecoveryOperation rows with status == SCHEDULED.
        default: 0

  - name: RecoveryOperation
    parent: null
    common_fields: true
    fields:
      - name: donor_case_id
        type: string
        source: input
        description: "FK -> DonorCase.id; the donor whose organs are recovered in this operation."
      - name: recovery_team_id
        type: string
        source: input
        description: "FK -> RecoveryTeam.id; the surgical team booked for the window."
      - name: or_start_at
        type: datetime
        source: input
        description: Start of the operating-room window.
      - name: or_end_at
        type: datetime
        source: input
        description: End of the operating-room window; must be strictly after or_start_at.
      - name: or_minutes
        type: integer
        source: computed
        description: Whole minutes from or_start_at to or_end_at.
      - name: status
        type: enum
        source: system
        description: Operation state.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | CANCELLED"
      - name: cross_clamp_at
        type: datetime
        source: system
        description: Logical clock instant of aortic cross-clamp; set when the operation completes.
        default: null
      - name: organ_types_covered
        type: array
        source: computed
        description: organ_type values of the case's ACCEPTED organs pinned at scheduling time.
        default: []
      - name: cancelled_reason
        type: enum
        source: system
        description: Why the operation was cancelled.
        default: null
        constraints: "CASE_CLOSED | LOGISTICS_WITHDRAWN | null"

  - name: TransportAsset
    parent: null
    common_fields: true
    fields:
      - name: asset_code
        type: string
        source: input
        description: Vehicle or aircraft code; unique across TransportAsset rows.
        constraints: "unique; 2..12 chars"
      - name: mode
        type: enum
        source: input
        description: Carriage mode this asset provides.
        constraints: "GROUND | FIXED_WING | HELICOPTER"
      - name: concurrent_leg_capacity
        type: integer
        source: input
        description: How many organ legs this asset may carry over an overlapping window.
        default: 1
        constraints: "1..5"
      - name: active_leg_count
        type: integer
        source: computed
        description: Count of organs assigned to this asset with status == RECOVERED (in transit).
        default: 0

state_machines:
  - entity: DeathReferral
    initial_state: RECEIVED
    terminal_states: [RULED_OUT, NOT_CONVERTED]
    transitions:
      - from: RECEIVED
        to: SCREENING
        trigger: "POST /opo/death-referrals/{id}/screenings"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == RECEIVED"
          - "no EligibilityScreening row exists with referral_id == referral.id"
        side_effects:
          - "creates EligibilityScreening in status PENDING with info_request_count 0"
      - from: SCREENING
        to: SCREEN_CLEARED
        trigger: "POST /opo/eligibility-screenings/{id}/decision with decision CLEARED (system-propagated)"
        actor: system
        preconditions:
          - "screening.referral_id == referral.id AND screening.status transitions PENDING -> CLEARED"
        side_effects:
          - "referral.status = SCREEN_CLEARED"
      - from: SCREENING
        to: RULED_OUT
        trigger: "POST /opo/eligibility-screenings/{id}/decision with decision RULED_OUT, or an absolute-contraindication serology result (system-propagated)"
        actor: system
        preconditions:
          - "screening.referral_id == referral.id AND screening.status transitions to RULED_OUT"
        side_effects:
          - "referral.status = RULED_OUT (terminal)"
      - from: SCREEN_CLEARED
        to: AUTH_PENDING
        trigger: "POST /opo/death-referrals/{id}/authorizations"
        actor: AuthorizationSpecialist
        preconditions:
          - "referral.status == SCREEN_CLEARED"
          - "no Authorization row exists with referral_id == referral.id whose status is not in {DECLINED, UNABLE_TO_LOCATE, RESCINDED}"
        side_effects:
          - "creates Authorization; referral.status = AUTH_PENDING"
      - from: AUTH_PENDING
        to: CONVERTED
        trigger: "POST /opo/donor-cases"
        actor: DonorCoordinator
        preconditions:
          - "referral.status == AUTH_PENDING"
          - "authorization.status == AUTHORIZED AND authorization.referral_id == referral.id"
          - "screening.status == CLEARED AND screening.absolute_contraindication == false"
        side_effects:
          - "referral.status = CONVERTED"
          - "HospitalPartner.converted_donor_count += 1"
      - from: AUTH_PENDING
        to: NOT_CONVERTED
        trigger: "Authorization reaches DECLINED or UNABLE_TO_LOCATE (system-propagated)"
        actor: system
        preconditions:
          - "authorization.referral_id == referral.id"
        side_effects:
          - "referral.status = NOT_CONVERTED (terminal)"
      - from: CONVERTED
        to: NOT_CONVERTED
        trigger: "Authorization AUTHORIZED -> RESCINDED (system-propagated, cascade hop 2)"
        actor: system
        preconditions:
          - "authorization.referral_id == referral.id AND authorization.status becomes RESCINDED"
        side_effects:
          - "referral.status = NOT_CONVERTED (terminal)"
          - "HospitalPartner.converted_donor_count -= 1"

  - entity: EligibilityScreening
    initial_state: PENDING
    terminal_states: [CLEARED, RULED_OUT]
    transitions:
      - from: PENDING
        to: INFO_REQUESTED
        trigger: "POST /opo/eligibility-screenings/{id}/request-info"
        actor: MedicalDirector
        preconditions:
          - "screening.status == PENDING"
          - "screening.info_request_count < MAX_INFO_REQUESTS (2)"
        side_effects:
          - "screening.info_request_count += 1"
        note: "First half of the revision cycle; the third request is rejected with ERR_INFO_REQUEST_LIMIT_REACHED."
      - from: INFO_REQUESTED
        to: PENDING
        trigger: "POST /opo/eligibility-screenings/{id}/risk-assessment"
        actor: ReferralCoordinator
        preconditions:
          - "screening.status in {PENDING, INFO_REQUESTED}"
          - "payload.expected_screening_version == screening.version"
        side_effects:
          - "recomputes risk_score / risk_tier / risk_variant_applied per calculations.behavioral_risk_score"
          - "screening.risk_assessed_by_user_id = X-User-ID"
          - "increments EligibilityScreening.version by 1"
        note: "Closes the cycle back to PENDING; resubmission from PENDING supersedes the prior assessment and leaves status PENDING."
      - from: PENDING
        to: CLEARED
        trigger: "POST /opo/eligibility-screenings/{id}/decision with decision CLEARED"
        actor: MedicalDirector
        preconditions:
          - "screening.status == PENDING"
          - "screening.risk_score is not null"
          - "screening.absolute_contraindication == false"
          - "X-User-ID != screening.risk_assessed_by_user_id"
        side_effects:
          - "screening.decided_by_user_id = X-User-ID"
          - "DeathReferral.status SCREENING -> SCREEN_CLEARED"
      - from: PENDING
        to: RULED_OUT
        trigger: "POST /opo/eligibility-screenings/{id}/decision with decision RULED_OUT"
        actor: MedicalDirector
        preconditions:
          - "screening.status == PENDING"
          - "X-User-ID != screening.risk_assessed_by_user_id"
        side_effects:
          - "screening.ruled_out_reason = payload.ruled_out_reason (default DIRECTOR_DECISION)"
          - "DeathReferral.status SCREENING -> RULED_OUT"
      - from: PENDING
        to: RULED_OUT
        trigger: "POST /opo/eligibility-screenings/{id}/serology-results whose absolute_contraindication_marker is true (system auto-transition)"
        actor: system
        preconditions:
          - "screening.status in {PENDING, INFO_REQUESTED}"
        side_effects:
          - "screening.absolute_contraindication = true"
          - "screening.ruled_out_reason = SEROLOGY_CONTRAINDICATION"
          - "DeathReferral.status SCREENING -> RULED_OUT"
      - from: INFO_REQUESTED
        to: RULED_OUT
        trigger: "POST /opo/eligibility-screenings/{id}/serology-results whose absolute_contraindication_marker is true (system auto-transition)"
        actor: system
        preconditions:
          - "screening.status == INFO_REQUESTED"
        side_effects:
          - "screening.absolute_contraindication = true; ruled_out_reason = SEROLOGY_CONTRAINDICATION"
          - "DeathReferral.status SCREENING -> RULED_OUT"

  - entity: Authorization
    initial_state: PENDING_REGISTRY
    terminal_states: [DECLINED, UNABLE_TO_LOCATE, RESCINDED]
    transitions:
      - from: PENDING_REGISTRY
        to: REGISTRY_CONFIRMED
        trigger: "POST /opo/death-referrals/{id}/authorizations with registry_hit true (branch A, evaluated at creation)"
        actor: AuthorizationSpecialist
        preconditions:
          - "payload.registry_hit == true"
          - "payload.registry_document_ref is non-null"
        side_effects:
          - "authorization.authorization_basis = FIRST_PERSON_REGISTRY"
          - "authorization.required_document_types = [REGISTRY_SCREENSHOT]"
          - "document_types_present gains REGISTRY_SCREENSHOT (the supplied registry_document_ref is filed automatically)"
          - "documentation_complete = true"
      - from: PENDING_REGISTRY
        to: NOK_REQUIRED
        trigger: "POST /opo/death-referrals/{id}/authorizations with registry_hit false (branch B, evaluated at creation)"
        actor: AuthorizationSpecialist
        preconditions:
          - "payload.registry_hit == false"
        side_effects:
          - "authorization.authorization_basis = LEGAL_NEXT_OF_KIN"
          - "authorization.required_document_types = [SIGNED_CONSENT_FORM, WITNESS_ATTESTATION]"
          - "documentation_complete = false"
        note: "The two branches carry disjoint side-effect sets: branch A is documentation-complete on arrival, branch B must walk the next-of-kin hierarchy and upload two documents."
      - from: NOK_REQUIRED
        to: NOK_CONSENTED
        trigger: "POST /opo/authorizations/{id}/nok-contacts with response CONSENT"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == NOK_REQUIRED"
          - "no NextOfKinContact on this authorization has response OBJECTION with rank < NOK_RANK[payload.relationship]"
          - "hierarchy admissibility (identical to validations priority 66): every rank r strictly better than NOK_RANK[payload.relationship] already has a NextOfKinContact row on this authorization with response in {DECLINE, UNREACHABLE}. The condition is vacuously true at rank 1, so a SPOUSE consent needs no predecessor; a consent at rank 2 with no rank-1 row is rejected with ERR_NOK_HIERARCHY_VIOLATION. highest_rank_attempted is a reporting field only and never relaxes this check."
        side_effects:
          - "creates NextOfKinContact with rank = NOK_RANK[relationship]"
          - "authorization.consenting_rank = rank; consent_recorded_by_user_id = X-User-ID"
          - "authorization.highest_rank_attempted = min(existing highest_rank_attempted, rank)"
      - from: NOK_REQUIRED
        to: DECLINED
        trigger: "POST /opo/authorizations/{id}/nok-contacts with response DECLINE from rank 1"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == NOK_REQUIRED"
          - "NOK_RANK[payload.relationship] == 1"
        side_effects:
          - "creates NextOfKinContact"
          - "authorization.status = DECLINED (terminal)"
          - "DeathReferral.status AUTH_PENDING -> NOT_CONVERTED"
        note: "A DECLINE from rank > 1 does not end the packet; it only records the attempt and updates highest_rank_attempted."
      - from: NOK_REQUIRED
        to: UNABLE_TO_LOCATE
        trigger: "POST /opo/authorizations/{id}/nok-contacts with response UNREACHABLE once every relationship class has been attempted"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == NOK_REQUIRED"
          - "after inserting this contact, every relationship in NOK_RANK has a NextOfKinContact row on this authorization and none has response CONSENT"
        side_effects:
          - "authorization.status = UNABLE_TO_LOCATE (terminal)"
          - "DeathReferral.status AUTH_PENDING -> NOT_CONVERTED"
      - from: NOK_CONSENTED
        to: DOCUMENT_DEFICIENT
        trigger: "POST /opo/authorizations/{id}/finalize while documentation_complete == false"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == NOK_CONSENTED"
          - "documentation_complete == false"
        side_effects:
          - "authorization.status = DOCUMENT_DEFICIENT"
        note: "Opens the documentation revision cycle; the caller still receives ERR_AUTHORIZATION_DOCUMENTATION_INCOMPLETE (422) and the state move is recorded."
      - from: DOCUMENT_DEFICIENT
        to: NOK_CONSENTED
        trigger: "POST /opo/authorizations/{id}/documents"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == DOCUMENT_DEFICIENT"
        side_effects:
          - "document_types_present gains payload.document_type; witness_name set when payload.witness_name present"
          - "documentation_complete recomputed per calculations.authorization_documentation_completeness"
          - "authorization.status = NOK_CONSENTED"
        note: "Closes the documentation cycle; uploads while already NOK_CONSENTED leave status unchanged."
      - from: NOK_CONSENTED
        to: AUTHORIZED
        trigger: "POST /opo/authorizations/{id}/finalize"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == NOK_CONSENTED"
          - "documentation_complete == true"
          - "X-User-ID != authorization.consent_recorded_by_user_id"
        side_effects:
          - "authorization.finalized_by_user_id = X-User-ID"
      - from: REGISTRY_CONFIRMED
        to: AUTHORIZED
        trigger: "POST /opo/authorizations/{id}/finalize"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == REGISTRY_CONFIRMED"
          - "documentation_complete == true"
        side_effects:
          - "authorization.finalized_by_user_id = X-User-ID"
        note: "The registry branch has no consent_recorded_by_user_id, so the segregation-of-duties check is vacuous here."
      - from: AUTHORIZED
        to: RESCINDED
        trigger: "POST /opo/authorizations/{id}/nok-contacts with response OBJECTION from a rank strictly better than consenting_rank (cascade hop 1)"
        actor: AuthorizationSpecialist
        preconditions:
          - "authorization.status == AUTHORIZED"
          - "authorization.authorization_basis == LEGAL_NEXT_OF_KIN"
          - "NOK_RANK[payload.relationship] < authorization.consenting_rank"
        side_effects:
          - "authorization.status = RESCINDED; rescinded_reason = HIGHER_RANK_OBJECTION"
          - "hop 2: DeathReferral.status CONVERTED -> NOT_CONVERTED and DonorCase.allocation_status -> CLOSED (closed_reason AUTHORIZATION_RESCINDED), case_posture -> FROZEN"
        note: "Origin of the depth-5 rescission cascade; hops 3-5 are declared on DonorCase, Organ/MatchRun and RecoveryOperation."

  - entity: DonorCase
    initial_state: "physiologic_status STABILIZING x allocation_status NOT_STARTED"
    terminal_states: ["physiologic_status LOST", "allocation_status CLOSED"]
    transitions:
      - from: "physiologic_status STABILIZING"
        to: "physiologic_status OPTIMIZED"
        trigger: "POST /opo/donor-cases/{id}/observations whose viability_index_snapshot >= OPTIMIZED_FLOOR (70)"
        actor: DonorCoordinator
        preconditions:
          - "case_posture != FROZEN"
          - "observation.cardiac_arrest == false"
        side_effects:
          - "DonorCase.viability_index = observation.viability_index_snapshot"
          - "dmg_bundle_met_count and observation_count refreshed"
          - "case_posture recomputed per calculations.donor_case_posture"
      - from: "physiologic_status OPTIMIZED"
        to: "physiologic_status DECOMPENSATING"
        trigger: "POST /opo/donor-cases/{id}/observations whose viability_index_snapshot < DECOMPENSATING_CEILING (40) (cascade B hop 1)"
        actor: DonorCoordinator
        preconditions:
          - "case_posture != FROZEN"
          - "observation.cardiac_arrest == false"
        side_effects:
          - "DonorCase.viability_index = observation.viability_index_snapshot; physiologic_status = DECOMPENSATING"
          - "hop 2: case_posture OPEN -> RESTRICTED (derived from the new physiologic_status)"
          - "hop 3: because posture became RESTRICTED, every Organ on this case with organ_type in THORACIC_TYPES {HEART, LUNG_LEFT, LUNG_RIGHT} and status in {ALLOCATABLE, OFFERING} gets viability_hold = true and status -> PENDING_EVAL; abdominal organs are untouched"
          - "hop 4: because those organs left OFFERING, each of their MatchRun rows with status == OPEN -> CLOSED (closed_reason VIABILITY_HOLD) and every offer on those runs with status in {QUEUED, PENDING} -> BYPASSED (bypass_reason VIABILITY_HOLD), pending_offer_count -> 0, slots_free -> primary_offer_slots"
      - from: "physiologic_status DECOMPENSATING"
        to: "physiologic_status OPTIMIZED"
        trigger: "POST /opo/donor-cases/{id}/observations whose viability_index_snapshot >= OPTIMIZED_FLOOR (70)"
        actor: DonorCoordinator
        preconditions:
          - "case_posture != FROZEN"
          - "observation.cardiac_arrest == false"
        side_effects:
          - "physiologic_status = OPTIMIZED; case_posture RESTRICTED -> OPEN"
          - "every Organ on this case with viability_hold == true has viability_hold reset to false; status stays PENDING_EVAL until an explicit re-evaluation"
        note: "Recovery leg of the physiologic cycle; organ status is deliberately NOT auto-restored."
      - from: "physiologic_status STABILIZING | OPTIMIZED | DECOMPENSATING"
        to: "physiologic_status LOST"
        trigger: "POST /opo/donor-cases/{id}/observations with cardiac_arrest true"
        actor: DonorCoordinator
        preconditions:
          - "case_posture != FROZEN"
        side_effects:
          - "physiologic_status = LOST (terminal dimension); viability_index = 0"
          - "allocation_status -> CLOSED (closed_reason DONOR_LOST) unless already RECOVERED"
          - "case_posture -> FROZEN"
          - "every Organ with status in {PENDING_EVAL, ALLOCATABLE, OFFERING, ACCEPTED} -> NON_TRANSPLANTABLE (nontransplantable_reason VIABILITY_FAILURE), accepted_offer_id -> null"
          - "each OPEN MatchRun of those organs -> CLOSED (closed_reason CASE_CLOSED) with QUEUED/PENDING offers -> BYPASSED (bypass_reason CASE_CLOSED)"
      - from: "allocation_status NOT_STARTED"
        to: "allocation_status MATCH_RUN_OPEN"
        trigger: "POST /opo/organs/{id}/match-runs (first run on any organ of the case)"
        actor: AllocationSpecialist
        preconditions:
          - "case_posture == OPEN"
          - "organ.status in {ALLOCATABLE, OFFERING}"
        side_effects:
          - "allocation_status = MATCH_RUN_OPEN"
      - from: "allocation_status MATCH_RUN_OPEN"
        to: "allocation_status OFFERS_IN_FLIGHT"
        trigger: "match-run creation or POST /opo/match-runs/{id}/advance promoting at least one offer to PENDING"
        actor: AllocationSpecialist
        preconditions:
          - "pending_offer_count of the run becomes >= 1"
        side_effects:
          - "allocation_status = OFFERS_IN_FLIGHT; organ.status ALLOCATABLE -> OFFERING"
      - from: "allocation_status OFFERS_IN_FLIGHT"
        to: "allocation_status ALLOCATED"
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision ACCEPT"
        actor: AllocationSpecialist
        preconditions:
          - "offer.status == PENDING AND offer.expires_at > clock_now"
          - "risk_tier_snapshot == STANDARD OR payload.increased_risk_ack == true"
        side_effects:
          - "allocation_status = ALLOCATED; organs_accepted_count += 1"
      - from: "allocation_status ALLOCATED"
        to: "allocation_status OFFERS_IN_FLIGHT"
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision WITHDRAW_ACCEPTANCE"
        actor: AllocationSpecialist
        preconditions:
          - "offer.status == ACCEPTED AND organ.accepted_offer_id == offer.id"
          - "organ.status == ACCEPTED (not yet recovered)"
        side_effects:
          - "allocation_status = OFFERS_IN_FLIGHT; organs_accepted_count -= 1"
          - "compensating chain declared on OrganOffer.ACCEPTED_to_WITHDRAWN"
      - from: "allocation_status ALLOCATED"
        to: "allocation_status RECOVERED"
        trigger: "POST /opo/recovery-operations/{id}/cross-clamp"
        actor: RecoveryLogistics
        preconditions:
          - "operation.status == SCHEDULED AND operation.donor_case_id == case.id"
          - "case_posture != FROZEN"
        side_effects:
          - "allocation_status = RECOVERED; organs_recovered_count refreshed"
      - from: "allocation_status RECOVERED"
        to: "allocation_status CLOSED"
        trigger: "POST /opo/organs/{id}/disposition for the last organ of the case"
        actor: MedicalDirector
        preconditions:
          - "every Organ of the case is in a terminal organ state after this disposition"
        side_effects:
          - "allocation_status = CLOSED; closed_reason = RECOVERY_COMPLETE; case_posture -> FROZEN"
      - from: "allocation_status NOT_STARTED | MATCH_RUN_OPEN | OFFERS_IN_FLIGHT | ALLOCATED"
        to: "allocation_status CLOSED"
        trigger: "Authorization AUTHORIZED -> RESCINDED (system-propagated, cascade hop 2)"
        actor: system
        preconditions:
          - "case.authorization_id == the rescinded authorization's id"
        side_effects:
          - "allocation_status = CLOSED; closed_reason = AUTHORIZATION_RESCINDED; case_posture = FROZEN"
          - "hop 3: because the case closed, every Organ with status in {PENDING_EVAL, ALLOCATABLE, OFFERING, ACCEPTED} -> NON_TRANSPLANTABLE (nontransplantable_reason AUTHORIZATION_RESCINDED) and accepted_offer_id -> null"
          - "hop 4: because those organs left OFFERING/ACCEPTED, each OPEN MatchRun of theirs -> CLOSED (closed_reason CASE_CLOSED) and every offer in {QUEUED, PENDING, ACCEPTED} -> BYPASSED (bypass_reason CASE_CLOSED), pending_offer_count -> 0, slots_free -> primary_offer_slots"
          - "hop 5: because the case closed, every RecoveryOperation of the case with status == SCHEDULED -> CANCELLED (cancelled_reason CASE_CLOSED), which decrements RecoveryTeam.booked_or_minutes by that operation's or_minutes and RecoveryTeam.scheduled_operation_count by 1"

  - entity: Organ
    initial_state: PENDING_EVAL
    terminal_states: [TRANSPLANTED, DISCARDED, RESEARCH_REFERRED, TISSUE_REFERRED]
    transitions:
      - from: PENDING_EVAL
        to: ALLOCATABLE
        trigger: "POST /opo/organs/{id}/evaluation with decision ALLOCATABLE"
        actor: MedicalDirector
        preconditions:
          - "organ.status == PENDING_EVAL"
          - "organ.viability_hold == false"
          - "case_posture == OPEN"
        side_effects:
          - "organ.status = ALLOCATABLE"
      - from: PENDING_EVAL
        to: NON_TRANSPLANTABLE
        trigger: "POST /opo/organs/{id}/evaluation with decision NON_TRANSPLANTABLE"
        actor: MedicalDirector
        preconditions:
          - "organ.status == PENDING_EVAL"
          - "case_posture != FROZEN"
        side_effects:
          - "organ.nontransplantable_reason = payload.nontransplantable_reason (default ANATOMIC_ANOMALY)"
          - "DonorCase.organs_nontransplantable_count += 1"
      - from: ALLOCATABLE
        to: OFFERING
        trigger: "POST /opo/organs/{id}/match-runs or POST /opo/match-runs/{id}/advance promoting an offer"
        actor: AllocationSpecialist
        preconditions:
          - "at least one offer on the organ's OPEN run is promoted to PENDING"
        side_effects:
          - "organ.status = OFFERING; DonorCase.allocation_status -> OFFERS_IN_FLIGHT"
      - from: OFFERING
        to: ALLOCATABLE
        trigger: "POST /opo/match-runs/{id}/advance that finds no promotable candidate (empty-candidate fallback)"
        actor: AllocationSpecialist
        preconditions:
          - "no offer on the run has status QUEUED and pending_offer_count == 0 after expiry sweep"
        side_effects:
          - "MatchRun.status OPEN -> EXHAUSTED (closed_reason CANDIDATES_EXHAUSTED)"
          - "organ.status = ALLOCATABLE; DonorCase.allocation_status OFFERS_IN_FLIGHT -> MATCH_RUN_OPEN"
      - from: OFFERING
        to: ACCEPTED
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision ACCEPT"
        actor: AllocationSpecialist
        preconditions:
          - "offer.status == PENDING AND offer.match_run_id belongs to this organ"
          - "case_posture != FROZEN"
        side_effects:
          - "organ.accepted_offer_id = offer.id"
          - "MatchRun.status OPEN -> CLOSED (closed_reason ACCEPTED)"
      - from: ACCEPTED
        to: OFFERING
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision WITHDRAW_ACCEPTANCE (compensating action)"
        actor: AllocationSpecialist
        preconditions:
          - "organ.status == ACCEPTED AND organ.accepted_offer_id == offer.id"
        side_effects:
          - "organ.accepted_offer_id = null; MatchRun.status CLOSED -> OPEN (closed_reason null)"
          - "offers bypassed by this acceptance (bypass_reason PEER_ACCEPTED) are restored to QUEUED with bypass_reason null, then the promotion selector re-runs"
      - from: ACCEPTED
        to: RECOVERED
        trigger: "POST /opo/recovery-operations/{id}/cross-clamp"
        actor: RecoveryLogistics
        preconditions:
          - "organ.donor_case_id == operation.donor_case_id AND organ.status == ACCEPTED"
        side_effects:
          - "organ.cross_clamp_at = operation.cross_clamp_at (logical clock)"
          - "DonorCase.organs_recovered_count += 1"
      - from: RECOVERED
        to: TRANSPLANTED
        trigger: "POST /opo/organs/{id}/disposition with disposition TRANSPLANTED"
        actor: MedicalDirector
        preconditions:
          - "organ.status == RECOVERED"
        side_effects:
          - "DonorCase.allocation_status may advance RECOVERED -> CLOSED when this was the last non-terminal organ"
      - from: RECOVERED
        to: DISCARDED
        trigger: "POST /opo/organs/{id}/disposition with disposition DISCARDED"
        actor: MedicalDirector
        preconditions:
          - "organ.status == RECOVERED"
        side_effects:
          - "DonorCase.allocation_status may advance RECOVERED -> CLOSED when this was the last non-terminal organ"
      - from: NON_TRANSPLANTABLE
        to: RESEARCH_REFERRED
        trigger: "POST /opo/organs/{id}/disposition with disposition RESEARCH_REFERRED"
        actor: MedicalDirector
        preconditions:
          - "organ.status == NON_TRANSPLANTABLE"
          - "organ.nontransplantable_reason != AUTHORIZATION_RESCINDED"
          - "payload.research_protocol_code is non-null"
        side_effects:
          - "organ.research_protocol_code = payload.research_protocol_code"
      - from: NON_TRANSPLANTABLE
        to: TISSUE_REFERRED
        trigger: "POST /opo/organs/{id}/disposition with disposition TISSUE_REFERRED"
        actor: MedicalDirector
        preconditions:
          - "organ.status == NON_TRANSPLANTABLE"
          - "organ.nontransplantable_reason != AUTHORIZATION_RESCINDED"
          - "payload.tissue_processor_code is non-null"
        side_effects:
          - "organ.tissue_processor_code = payload.tissue_processor_code"
      - from: "PENDING_EVAL | ALLOCATABLE | OFFERING | ACCEPTED"
        to: NON_TRANSPLANTABLE
        trigger: "DonorCase.allocation_status -> CLOSED via authorization rescission or donor loss (system-propagated, cascade hop 3)"
        actor: system
        preconditions:
          - "organ.donor_case_id == the closing case's id"
        side_effects:
          - "organ.nontransplantable_reason = AUTHORIZATION_RESCINDED or VIABILITY_FAILURE; accepted_offer_id = null; viability_hold = false"
          - "DonorCase.organs_nontransplantable_count refreshed"

  - entity: MatchRun
    initial_state: OPEN
    terminal_states: [EXHAUSTED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /opo/organs/{id}/match-runs creating a later run on the same organ"
        actor: AllocationSpecialist
        preconditions:
          - "payload.expected_organ_version == organ.version"
          - "organ.status in {ALLOCATABLE, OFFERING}"
        side_effects:
          - "prior run.status = SUPERSEDED (closed_reason SUPERSEDED_BY_NEW_RUN); its QUEUED/PENDING offers -> BYPASSED (bypass_reason PEER_ACCEPTED is NOT used here; bypass_reason CASE_CLOSED is NOT used here; bypass_reason VIABILITY_HOLD is NOT used here - the superseded run's offers take bypass_reason null and status BYPASSED)"
          - "new run.run_number = prior max run_number + 1; increments Organ.version by 1"
        note: "Legitimate supersede is why match-run creation is OCC-guarded rather than state-guarded."
      - from: OPEN
        to: CLOSED
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision ACCEPT"
        actor: AllocationSpecialist
        preconditions:
          - "offer.match_run_id == run.id AND offer.status == PENDING"
        side_effects:
          - "run.closed_reason = ACCEPTED; every other offer with status in {QUEUED, PENDING} -> BYPASSED (bypass_reason PEER_ACCEPTED)"
          - "pending_offer_count = 0; slots_free = primary_offer_slots"
      - from: CLOSED
        to: OPEN
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision WITHDRAW_ACCEPTANCE (compensating action)"
        actor: AllocationSpecialist
        preconditions:
          - "run.closed_reason == ACCEPTED AND offer.status == ACCEPTED"
        side_effects:
          - "run.closed_reason = null; PEER_ACCEPTED bypasses restored to QUEUED; promotion selector re-runs"
        note: "The CLOSED -> OPEN edge makes MatchRun cyclic and is the vehicle of the allocation-slot conservation invariant."
      - from: OPEN
        to: EXHAUSTED
        trigger: "POST /opo/match-runs/{id}/advance with no promotable candidate"
        actor: AllocationSpecialist
        preconditions:
          - "after the expiry sweep, no offer on the run has status QUEUED and pending_offer_count == 0"
        side_effects:
          - "run.closed_reason = CANDIDATES_EXHAUSTED; organ.status OFFERING -> ALLOCATABLE"
      - from: OPEN
        to: CLOSED
        trigger: "DonorCase closure or thoracic viability hold (system-propagated, cascade hop 4)"
        actor: system
        preconditions:
          - "run.organ_id belongs to an organ leaving OFFERING/ACCEPTED by cascade"
        side_effects:
          - "run.closed_reason = CASE_CLOSED or VIABILITY_HOLD; QUEUED/PENDING/ACCEPTED offers -> BYPASSED with the matching bypass_reason"

  - entity: OrganOffer
    initial_state: QUEUED
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN]
    transitions:
      - from: QUEUED
        to: PENDING
        trigger: "match-run creation or POST /opo/match-runs/{id}/advance (promotion selector, calculations.offer_promotion_selector)"
        actor: AllocationSpecialist
        preconditions:
          - "run.status == OPEN AND run.pending_offer_count < run.primary_offer_slots"
          - "this offer is the lowest sequence_position among QUEUED offers of the run"
        side_effects:
          - "offered_at = clock_now; expires_at = clock_now + acceptance_clock_minutes"
          - "run.pending_offer_count += 1; run.slots_free -= 1"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision ACCEPT"
        actor: AllocationSpecialist
        preconditions:
          - "offer.status == PENDING AND clock_now < offer.expires_at"
          - "DonorCase.risk_tier_snapshot == STANDARD OR payload.increased_risk_ack == true"
          - "case_posture != FROZEN"
        side_effects:
          - "responded_at = clock_now; responded_by_user_id = X-User-ID"
          - "run.pending_offer_count -= 1; organ.status OFFERING -> ACCEPTED; run.status OPEN -> CLOSED"
      - from: PENDING
        to: DECLINED
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision DECLINE"
        actor: AllocationSpecialist
        preconditions:
          - "offer.status == PENDING"
          - "payload.decline_reason is non-null"
        side_effects:
          - "responded_at = clock_now; run.pending_offer_count -= 1; run.slots_free += 1"
          - "the promotion selector immediately re-runs on this run, promoting the next QUEUED offer if any"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /opo/match-runs/{id}/advance expiry sweep when clock_now >= expires_at"
        actor: system
        preconditions:
          - "offer.status == PENDING AND clock_now >= offer.expires_at"
        side_effects:
          - "run.pending_offer_count -= 1; run.slots_free += 1"
        note: "Boundary is inclusive: an offer whose expires_at equals clock_now is swept."
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /opo/match-runs/{id}/offers/{offerId}/respond with decision WITHDRAW_ACCEPTANCE"
        actor: AllocationSpecialist
        preconditions:
          - "offer.status == ACCEPTED AND organ.status == ACCEPTED"
        side_effects:
          - "organ.status ACCEPTED -> OFFERING; organ.accepted_offer_id = null; run.status CLOSED -> OPEN"
          - "every offer of this run with status BYPASSED and bypass_reason PEER_ACCEPTED -> QUEUED with bypass_reason null"
          - "promotion selector re-runs, restoring pending_offer_count to min(primary_offer_slots, count of QUEUED offers)"
      - from: "QUEUED | PENDING | ACCEPTED"
        to: BYPASSED
        trigger: "peer acceptance, run supersede, case closure or viability hold (system-propagated)"
        actor: system
        preconditions:
          - "the offer's run leaves OPEN for a reason other than this offer's own response"
        side_effects:
          - "bypass_reason set to PEER_ACCEPTED, CASE_CLOSED or VIABILITY_HOLD (null for a superseded run)"
          - "run.pending_offer_count decremented for each bypassed PENDING offer"
      - from: BYPASSED
        to: QUEUED
        trigger: "acceptance withdrawal on the same run (compensating restore)"
        actor: system
        preconditions:
          - "offer.bypass_reason == PEER_ACCEPTED AND the run returns to OPEN"
        side_effects:
          - "bypass_reason = null; offer re-enters the promotion selector's candidate set"

  - entity: RecoveryOperation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /opo/recovery-operations/{id}/cross-clamp"
        actor: RecoveryLogistics
        preconditions:
          - "operation.status == SCHEDULED"
          - "case_posture != FROZEN"
          - "at least one Organ of the case has status ACCEPTED"
        side_effects:
          - "cross_clamp_at = clock_now; RecoveryTeam.scheduled_operation_count -= 1 (booked_or_minutes unchanged: COMPLETED windows stay on the ledger)"
          - "every ACCEPTED Organ of the case -> RECOVERED with cross_clamp_at copied"
          - "DonorCase.allocation_status ALLOCATED -> RECOVERED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /opo/recovery-operations/{id}/cancel (compensating action)"
        actor: RecoveryLogistics
        preconditions:
          - "operation.status == SCHEDULED"
        side_effects:
          - "cancelled_reason = LOGISTICS_WITHDRAWN"
          - "RecoveryTeam.booked_or_minutes -= operation.or_minutes; scheduled_operation_count -= 1"
        note: "Forward/compensating pair for the OR-minutes ledger invariant."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "DonorCase.allocation_status -> CLOSED (system-propagated, cascade hop 5)"
        actor: system
        preconditions:
          - "operation.donor_case_id == the closing case's id"
        side_effects:
          - "cancelled_reason = CASE_CLOSED"
          - "RecoveryTeam.booked_or_minutes -= operation.or_minutes; scheduled_operation_count -= 1"

concurrency_rules:
  - rule_id: match-run-create-stale-organ
    parent_entity: Organ
    write_endpoint: "POST /opo/organs/{id}/match-runs"
    occ_field: "expected_organ_version"
    description: |
      Generating a match run for an Organ whose version has advanced since the
      client last read it is rejected as a stale-version write. A later run
      legitimately supersedes the earlier OPEN run (the organ is re-listed after
      new donor data), so the operation is not blocked by any state precondition;
      the only guard is that the requester's view of the organ is current.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: risk-assessment-stale-screening
    parent_entity: EligibilityScreening
    write_endpoint: "POST /opo/eligibility-screenings/{id}/risk-assessment"
    occ_field: "expected_screening_version"
    description: |
      Submitting a behavioral risk assessment against an EligibilityScreening
      whose version has advanced since the client last read it is rejected as a
      stale-version write. A resubmission legitimately supersedes the previous
      assessment (a better informant is reached), so the operation itself remains
      valid from status PENDING; the guard is only that the submitted assessment
      was composed against the screening the client actually observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: referral_timeliness_lag
    trigger: "POST /opo/death-referrals (intake), recomputed for reporting by GET /opo/hospital-partners/{id}/performance"
    algorithm: threshold
    formula: |
      # basis_at is selected by the variant; referred_at is the logical clock at intake.
      lag_minutes = floor((referred_at - basis_at).total_seconds() / 60)      # truncate toward zero; referred_at >= basis_at is enforced by validation
      timeliness_flag = TIMELY if lag_minutes <= hospital.timely_referral_window_minutes else UNTIMELY
      # Persisted at intake:
      #   referral_lag_minutes = lag_minutes under clinical_trigger_basis
      #   audit_lag_minutes    = lag_minutes under death_note_basis, or null when death_pronounced_at is null
    input_set: "The single DeathReferral being created; the window comes from the HospitalPartner row named by hospital_partner_id at intake time (later edits to the hospital's window do not restate a stored referral)."
    constants:
      DEFAULT_WINDOW_MINUTES: 60
    precision: "Whole minutes, floor; comparison against the window is inclusive (lag == window is TIMELY)."
    variants:
      - name: clinical_trigger_basis
        when: "Always, at intake; this is the value stored in referral_lag_minutes and the only basis that sets timeliness_flag."
        difference: "basis_at = trigger_event_at (the instant the hospital's clinical trigger was first met)."
      - name: death_note_basis
        when: "Stored in audit_lag_minutes at intake and used as the reporting basis when GET /opo/hospital-partners/{id}/performance is called with basis DEATH_NOTE."
        difference: "basis_at = death_pronounced_at, which is later than trigger_event_at, so the same referral yields a strictly smaller lag and can be TIMELY on this basis while UNTIMELY on clinical_trigger_basis."

  - name: behavioral_risk_score
    trigger: "POST /opo/eligibility-screenings/{id}/risk-assessment"
    algorithm: weighted_scoring
    formula: |
      mult = RELIABILITY_MULTIPLIER[informant_reliability]
      scored = de-duplicated payload.risk_factors, iterated in the fixed order of the FACTOR_WEIGHTS
               keys as listed below (canonical enum order, NOT input order, NOT id order)
      contributions = []
      for f in scored:
          contributions.append( round_half_up(Decimal(FACTOR_WEIGHTS[f]) * Decimal(mult), 2) )
      # RECORDS_ONLY variant only: unresolved factors are imputed at half weight
      if informant_reliability == MEDICAL_RECORD_ONLY:
          for f in de-duplicated payload.unresolved_factors (same canonical order):
              contributions.append( round_half_up(Decimal(FACTOR_WEIGHTS[f]) * Decimal("0.5") * Decimal(mult), 2) )
      raw_score = sum(contributions)          # PINNED ORDER: round EACH contribution to 2dp, THEN sum.
                                              # Summing raw products and rounding once at the end is WRONG
                                              # and differs by cents (e.g. 9.21 vs 9.20).
      risk_score = round_half_up(min(raw_score, Decimal("25.00")), 2)
      risk_tier  = INCREASED_RISK if risk_score >= RISK_TIER_THRESHOLD else STANDARD
    input_set: "Only the factors supplied in this request body; the prior assessment on the screening is fully replaced (superseded), never merged."
    constants:
      FACTOR_WEIGHTS:
        IV_DRUG_USE_12MO: 6.50
        UNKNOWN_MEDICAL_SOCIAL_HISTORY: 5.00
        INCARCERATION_72H_12MO: 4.25
        NEW_SEX_PARTNER_HIGH_RISK_12MO: 3.75
        HEMODIALYSIS_12MO: 2.50
        BLOOD_TRANSFUSION_12MO: 2.00
        TATTOO_UNREGULATED_12MO: 1.50
      RELIABILITY_MULTIPLIER:
        PRIMARY_NEXT_OF_KIN: 1.00
        SECONDARY_CONTACT: 1.15
        MEDICAL_RECORD_ONLY: 1.30
      IMPUTATION_FRACTION: 0.5
      RISK_TIER_THRESHOLD: 12.00
      SCORE_CAP: 25.00
    precision: "Decimal arithmetic, ROUND_HALF_UP, 2 decimal places applied per contribution and once more after the cap."
    variants:
      - name: interview_based
        when: "informant_reliability in {PRIMARY_NEXT_OF_KIN, SECONDARY_CONTACT}"
        difference: "unresolved_factors are ignored entirely; risk_variant_applied = INTERVIEW_BASED."
        note: "Reported factors only."
      - name: records_only
        when: "informant_reliability == MEDICAL_RECORD_ONLY"
        difference: "Every unresolved factor adds round_half_up(weight * 0.5 * 1.30, 2); risk_variant_applied = RECORDS_ONLY. The same reported factor list therefore scores strictly higher whenever unresolved_factors is non-empty."

  - name: donor_viability_index
    trigger: "POST /opo/donor-cases/{id}/observations"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 - oxygenation (tiered selection on one input)
      if pao2_fio2_ratio >= 300:      oxy = 40
      elif pao2_fio2_ratio >= 200:    oxy = 30
      elif pao2_fio2_ratio >= 100:    oxy = 15
      else:                           oxy = 0
      # STEP 2 - haemodynamics (two inputs, nested max/min)
      if map_mmhg >= 70:              hemo_base = 35
      elif map_mmhg >= 60:            hemo_base = 25
      elif map_mmhg >= 50:            hemo_base = 10
      else:                           hemo_base = 0
      pressor_penalty = min(15, 5 * pressor_count)
      hemo = max(0, hemo_base - pressor_penalty)
      # STEP 3 - metabolic (two inputs)
      sodium_pts = 15 if 135 <= sodium <= 155 else 5
      if urine_output_ml_per_kg_hr >= 1.0:   urine_pts = 10
      elif urine_output_ml_per_kg_hr >= 0.5: urine_pts = 5
      else:                                  urine_pts = 0
      metab = sodium_pts + urine_pts
      # STEP 4 - clamp
      viability_index_snapshot = min(100, max(0, oxy + hemo + metab))
      if observation.cardiac_arrest: viability_index_snapshot = 0
      # STEP 5 - donor management goal bundle for THIS observation
      dmg_bundle_met = (map_mmhg >= 60) and (pao2_fio2_ratio >= 300) and (135 <= sodium <= 155)
                       and (urine_output_ml_per_kg_hr >= 0.5) and (pressor_count <= 1)
      # STEP 6 - case-level projection: the case takes the index of its LATEST observation,
      # ordered by recorded_at DESC, tie-break created_at DESC.
      DonorCase.viability_index = latest_observation.viability_index_snapshot
      if latest_observation.cardiac_arrest:        physiologic_status = LOST
      elif DonorCase.viability_index >= 70:        physiologic_status = OPTIMIZED
      elif DonorCase.viability_index >= 40:        physiologic_status = STABILIZING
      else:                                        physiologic_status = DECOMPENSATING
      DonorCase.dmg_bundle_met_count = count of this case's observations with dmg_bundle_met == true
    input_set: "All PhysiologicObservation rows of the case for dmg_bundle_met_count and observation_count; exactly the latest row (recorded_at DESC, then created_at DESC) for viability_index and physiologic_status."
    constants:
      OPTIMIZED_FLOOR: 70
      DECOMPENSATING_CEILING: 40
      PRESSOR_PENALTY_PER_AGENT: 5
      PRESSOR_PENALTY_CAP: 15
      THORACIC_TYPES: [HEART, LUNG_LEFT, LUNG_RIGHT]
    precision: "Integer points throughout; no rounding needed. Tier comparisons are all >= (inclusive at the tier floor)."

  - name: cold_ischemic_projection
    trigger: "POST /opo/organs/{id}/transport"
    algorithm: constraint_propagation
    formula: |
      elapsed_minutes = floor((transport_depart_at - organ.cross_clamp_at).total_seconds() / 60)
      transit_minutes = floor((transport_arrive_at - transport_depart_at).total_seconds() / 60)
      limit = CIT_LIMIT_MINUTES[organ.organ_type]
      # The prep allowance depends on the remaining margin, and the remaining margin depends on
      # the prep allowance. The dependency is resolved in a PINNED SINGLE PASS:
      # STEP 1 - provisional margin at the BASE prep allowance
      provisional_remaining = limit - elapsed_minutes - transit_minutes - BASE_PREP_MINUTES
      # STEP 2 - select the prep tier from the PROVISIONAL margin
      if provisional_remaining >= 120:    implant_prep_minutes = 45   # standard prep
      elif provisional_remaining >= 60:   implant_prep_minutes = 30   # expedited prep
      else:                               implant_prep_minutes = 20   # crash prep
      # STEP 3 - final projection with the SELECTED prep. DO NOT re-select the tier from the
      # final margin; exactly one pass is performed and the fixed point is not sought.
      projected_cold_ischemic_minutes = elapsed_minutes + transit_minutes + implant_prep_minutes
      projected_cit_margin_minutes    = limit - projected_cold_ischemic_minutes
      # STEP 4 - the validation gate (business_temporal, priority 69) rejects only when the
      # projection strictly exceeds the limit; equality is accepted.
      reject if projected_cold_ischemic_minutes > limit
    input_set: "The single Organ being dispatched; cross_clamp_at must already be set by its RecoveryOperation."
    constants:
      BASE_PREP_MINUTES: 45
      STANDARD_PREP_MINUTES: 45
      EXPEDITED_PREP_MINUTES: 30
      CRASH_PREP_MINUTES: 20
      STANDARD_TIER_FLOOR: 120
      EXPEDITED_TIER_FLOOR: 60
      CIT_LIMIT_MINUTES:
        HEART: 240
        LUNG_LEFT: 360
        LUNG_RIGHT: 360
        LIVER: 720
        PANCREAS: 720
        INTESTINE: 480
        KIDNEY_LEFT: 1080
        KIDNEY_RIGHT: 1080
    precision: "Whole minutes, floor on both interval conversions."

  - name: offer_promotion_selector
    trigger: "POST /opo/organs/{id}/match-runs (initial fill), POST /opo/match-runs/{id}/advance, and after any DECLINE / EXPIRED / WITHDRAW_ACCEPTANCE on the run"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - expiry sweep (advance only): every offer of this run with status == PENDING and
      #          clock_now >= expires_at becomes EXPIRED (inclusive boundary).
      # STEP 2 - eligibility filter: candidate_set = offers of this run with status == QUEUED.
      #          No other status is eligible; BYPASSED offers only re-enter after being restored
      #          to QUEUED by an acceptance withdrawal.
      # STEP 3 - ranking expression: sequence_position ASC. Tie-break (unreachable while
      #          sequence_position is unique per run): created_at ASC. `id` is never consulted.
      # STEP 4 - fill: while pending_offer_count < primary_offer_slots and candidate_set non-empty,
      #          pop the ranked head, set status = PENDING, offered_at = clock_now,
      #          expires_at = clock_now + acceptance_clock_minutes, pending_offer_count += 1.
      # STEP 5 - empty-pool fallback: if candidate_set was empty AND pending_offer_count == 0 after
      #          STEP 1, the run transitions OPEN -> EXHAUSTED (closed_reason CANDIDATES_EXHAUSTED),
      #          the organ returns OFFERING -> ALLOCATABLE, the case returns
      #          OFFERS_IN_FLIGHT -> MATCH_RUN_OPEN, and the response reports promoted_count 0.
      #          If candidate_set is empty but some offer is still PENDING, the run stays OPEN.
      # INVARIANT (allocation-slot conservation), asserted after every step:
      #          MatchRun.pending_offer_count + MatchRun.slots_free == MatchRun.primary_offer_slots
    input_set: "Offers of exactly one MatchRun; offers on superseded or closed runs are never considered."
    constants:
      DEFAULT_PRIMARY_OFFER_SLOTS: 2
      DEFAULT_ACCEPTANCE_CLOCK_MINUTES: 60
    precision: "Integer counts; expiry comparison uses clock_now >= expires_at."

  - name: hospital_timeliness_posture
    trigger: "POST /opo/death-referrals (incremental_lifetime variant, persisted on HospitalPartner); GET /opo/hospital-partners/{id}/performance (windowed_recert variant, read-only)"
    algorithm: aggregation
    formula: |
      # --- incremental_lifetime (persisted on every intake) ---
      referral_count           += 1
      timely_referral_count    += 1 if new referral timeliness_flag == TIMELY else 0
      untimely_referral_count  += 1 if new referral timeliness_flag == UNTIMELY else 0
      timely_referral_rate = null if referral_count == 0 else
                             round_half_up(Decimal(100) * timely_referral_count / referral_count, 2)
      if referral_count < MIN_POSTURE_SAMPLE:      partner_posture = GOOD_STANDING   # insufficient sample
      elif timely_referral_rate >= 75.00:         partner_posture = GOOD_STANDING
      elif timely_referral_rate >= 60.00:         partner_posture = WATCH
      else:                                        partner_posture = PROBATION
      # --- windowed_recert (computed on read, never persisted) ---
      window_end   = clock_now                                            # exclusive
      window_start = clock_now - window_days days                         # inclusive
      W = DeathReferral rows with hospital_partner_id == H
          AND referred_at >= window_start AND referred_at < window_end     # half-open [start, end)
      eligible_referral_count  = count(r in W where r.ventilated == true)  # imminent-death denominator
      timely_referral_count_w  = count(r in W where r.ventilated == true and r.timeliness_flag == TIMELY)
                                 # when basis == DEATH_NOTE, TIMELY is re-derived from audit_lag_minutes
                                 # (rows with audit_lag_minutes == null are excluded from BOTH counts)
      cleared_referral_count   = count(r in W where r.status in {AUTH_PENDING, CONVERTED, NOT_CONVERTED})
      converted_referral_count = count(r in W where r.status == CONVERTED)
      transplanted_organ_count = count(Organ o where o.status == TRANSPLANTED and o's DonorCase's
                                 referral_id is in W)
      timely_referral_rate_w = null if eligible_referral_count == 0 else
                               round_half_up(100 * timely_referral_count_w / eligible_referral_count, 2)
      conversion_rate        = null if cleared_referral_count == 0 else
                               round_half_up(100 * converted_referral_count / cleared_referral_count, 2)
      organs_per_donor       = null if converted_referral_count == 0 else
                               round_half_up(Decimal(transplanted_organ_count) / converted_referral_count, 2)
      if eligible_referral_count == 0:                  recertification_tier = INSUFFICIENT_DATA
      elif timely_referral_rate_w >= 75.00 and (conversion_rate or 0) >= 65.00
           and (organs_per_donor or 0) >= 3.00:         recertification_tier = PASS
      elif timely_referral_rate_w >= 60.00:             recertification_tier = PROBATION
      else:                                             recertification_tier = FAIL
    input_set: "incremental_lifetime spans every referral ever created for the hospital, with no status or ventilation filter. windowed_recert spans only referrals whose referred_at falls in the half-open window and, for the timeliness ratio, only those with ventilated == true."
    constants:
      MIN_POSTURE_SAMPLE: 4
      DEFAULT_WINDOW_DAYS: 365
      RECERT_TIMELY_PASS: 75.00
      RECERT_TIMELY_PROBATION: 60.00
      RECERT_CONVERSION_PASS: 65.00
      RECERT_OPD_PASS: 3.00
    precision: "2 decimal places, ROUND_HALF_UP; all tier comparisons are >= (inclusive)."
    variants:
      - name: incremental_lifetime
        when: "Persisted on HospitalPartner at each referral intake."
        difference: "Denominator is every referral ever received (ventilated or not, ruled out or not); numerator uses the stored timeliness_flag."
      - name: windowed_recert
        when: "Computed on GET /opo/hospital-partners/{id}/performance."
        difference: "Denominator is restricted to ventilated referrals inside the half-open [now - window_days, now) window, so the same hospital can be GOOD_STANDING on the persisted lifetime rate while its windowed recertification_tier is FAIL."

  - name: authorization_documentation_completeness
    trigger: "POST /opo/death-referrals/{id}/authorizations, POST /opo/authorizations/{id}/documents, POST /opo/authorizations/{id}/finalize"
    algorithm: aggregation
    formula: |
      if authorization_basis == FIRST_PERSON_REGISTRY:
          required_document_types = [REGISTRY_SCREENSHOT]
          documentation_complete  = REGISTRY_SCREENSHOT in document_types_present
      else:  # LEGAL_NEXT_OF_KIN
          required_document_types = [SIGNED_CONSENT_FORM, WITNESS_ATTESTATION]
          documentation_complete  = set(required_document_types) is a subset of set(document_types_present)
                                    and witness_name is not null
      NOK_RANK = { SPOUSE: 1, ADULT_CHILD: 2, PARENT: 3, SIBLING: 4, GRANDPARENT: 5, LEGAL_GUARDIAN: 6 }
      # Hierarchy admissibility for a CONSENT or DECLINE contact at rank R:
      #   admissible iff for every rank r < R there exists a NextOfKinContact on this authorization
      #   with rank r and response in {DECLINE, UNREACHABLE}; otherwise ERR_NOK_HIERARCHY_VIOLATION.
      # An OBJECTION recorded at rank R < consenting_rank on an AUTHORIZED packet rescinds it.
    input_set: "All document uploads and NextOfKinContact rows on the one authorization; uploads of the same document_type twice are idempotent on document_types_present."
    constants:
      NOK_RANK: { SPOUSE: 1, ADULT_CHILD: 2, PARENT: 3, SIBLING: 4, GRANDPARENT: 5, LEGAL_GUARDIAN: 6 }
      REGISTRY_REQUIRED: [REGISTRY_SCREENSHOT]
      NOK_REQUIRED: [SIGNED_CONSENT_FORM, WITNESS_ATTESTATION]
    precision: "Set membership; no numeric rounding."

  - name: donor_case_posture
    trigger: "Any mutation of DonorCase.physiologic_status or DonorCase.allocation_status, and Authorization rescission"
    algorithm: threshold
    formula: |
      # Precedence is strict and pinned: FROZEN wins over RESTRICTED, which wins over OPEN.
      if allocation_status == CLOSED or physiologic_status == LOST
         or authorization.status == RESCINDED:      case_posture = FROZEN
      elif physiologic_status == DECOMPENSATING:     case_posture = RESTRICTED
      else:                                          case_posture = OPEN
      # Gate semantics:
      #   FROZEN     -> every child mutation of the case is rejected with ERR_CASE_FROZEN (409)
      #   RESTRICTED -> match-run creation and organ evaluation are rejected for organ_type in
      #                 THORACIC_TYPES with ERR_POSTURE_RESTRICTED (409); abdominal organs proceed
      #   OPEN       -> no posture gate
    input_set: "The one DonorCase plus the Authorization named by its authorization_id."
    constants:
      THORACIC_TYPES: [HEART, LUNG_LEFT, LUNG_RIGHT]
    precision: "Enum derivation; no arithmetic."

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role name."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API table."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 25
    category: auth
    check: "When X-User-Role is HospitalReferralClerk, X-User-ID must equal the hospital_partner_id of the referral being created or the hospital being read."
    error_id: ERR_HOSPITAL_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /opo/death-referrals, GET /opo/hospital-partners/{id}"
  - priority: 30
    category: existence
    check: "Every path-templated resource exists, validated left to right."
    error_id: "ERR_HOSPITAL_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_DONOR_CASE_NOT_FOUND | ERR_ORGAN_NOT_FOUND | ERR_MATCH_RUN_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_OPERATION_NOT_FOUND"
    http_status: 404
    applies_to: "all path-templated endpoints"
  - priority: 32
    category: existence
    check: "Every foreign key supplied in a request body resolves to an existing row (hospital_partner_id, referral_id, authorization_id, recovery_team_id, transport_asset_id)."
    error_id: "ERR_HOSPITAL_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_ASSET_NOT_FOUND"
    http_status: 404
    applies_to: "POST /opo/death-referrals, POST /opo/donor-cases, POST /opo/donor-cases/{id}/recovery-operations, POST /opo/organs/{id}/transport"
  - priority: 34
    category: business_constraint
    check: "Required body fields are present with the declared type and enum membership; unknown enum members and out-of-range numbers are rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 36
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /opo/death-referrals, GET /opo/donor-cases, GET /opo/organs, GET /opo/recovery-operations"
  - priority: 38
    category: business_constraint
    check: "Unique keys are free: hospital_code, team_code, asset_code, donor_code, and (donor_case_id, organ_type)."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /opo/hospital-partners, POST /opo/recovery-teams, POST /opo/transport-assets, POST /opo/donor-cases, POST /opo/donor-cases/{id}/organs"
  - priority: 40
    category: state
    check: "A referral may be screened only from status RECEIVED and only once."
    error_id: ERR_REFERRAL_NOT_SCREENABLE
    http_status: 409
    applies_to: "POST /opo/death-referrals/{id}/screenings"
  - priority: 41
    category: state
    check: "A screening accepts a risk assessment only from status PENDING or INFO_REQUESTED, and a decision or info request only from status PENDING."
    error_id: ERR_SCREENING_NOT_PENDING
    http_status: 409
    applies_to: "POST /opo/eligibility-screenings/{id}/risk-assessment, POST /opo/eligibility-screenings/{id}/request-info, POST /opo/eligibility-screenings/{id}/decision"
  - priority: 42
    category: state
    check: "A screening decision requires risk_score to be non-null (a risk assessment has been submitted)."
    error_id: ERR_RISK_ASSESSMENT_MISSING
    http_status: 409
    applies_to: "POST /opo/eligibility-screenings/{id}/decision"
  - priority: 43
    category: state
    check: "An authorization may be created only while the referral is in status SCREEN_CLEARED, and only when no non-terminal authorization already exists for it."
    error_id: ERR_AUTHORIZATION_NOT_OPENABLE
    http_status: 409
    applies_to: "POST /opo/death-referrals/{id}/authorizations"
  - priority: 44
    category: state
    check: "Next-of-kin contacts are accepted only while the authorization is NOK_REQUIRED, except an OBJECTION which is also accepted while AUTHORIZED."
    error_id: ERR_AUTHORIZATION_NOT_CONTACTABLE
    http_status: 409
    applies_to: "POST /opo/authorizations/{id}/nok-contacts"
  - priority: 45
    category: state
    check: "Finalize is accepted only from status REGISTRY_CONFIRMED, NOK_CONSENTED or DOCUMENT_DEFICIENT; document uploads only from NOK_CONSENTED or DOCUMENT_DEFICIENT."
    error_id: ERR_AUTHORIZATION_NOT_FINALIZABLE
    http_status: 409
    applies_to: "POST /opo/authorizations/{id}/finalize, POST /opo/authorizations/{id}/documents"
  - priority: 46
    category: state
    check: "A donor case requires its referral in status AUTH_PENDING and its screening in status CLEARED."
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 409
    applies_to: "POST /opo/donor-cases"
  - priority: 47
    category: state
    check: "A donor case requires the named authorization in status AUTHORIZED."
    error_id: ERR_AUTHORIZATION_NOT_GRANTED
    http_status: 409
    applies_to: "POST /opo/donor-cases"
  - priority: 48
    category: state
    check: "Organ evaluation is accepted only from status PENDING_EVAL; a match run only from status ALLOCATABLE or OFFERING; transport only from status RECOVERED."
    error_id: "ERR_ORGAN_NOT_EVALUABLE | ERR_ORGAN_NOT_ALLOCATABLE | ERR_ORGAN_NOT_RECOVERED"
    http_status: 409
    applies_to: "POST /opo/organs/{id}/evaluation, POST /opo/organs/{id}/match-runs, POST /opo/organs/{id}/transport"
  - priority: 49
    category: state
    check: "An offer response requires the offer in status PENDING (ACCEPT/DECLINE) or ACCEPTED (WITHDRAW_ACCEPTANCE), on a run that is OPEN or CLOSED-by-acceptance respectively."
    error_id: ERR_OFFER_NOT_PENDING
    http_status: 409
    applies_to: "POST /opo/match-runs/{id}/offers/{offerId}/respond"
  - priority: 50
    category: state
    check: "The acceptance clock has not elapsed: clock_now < offer.expires_at when accepting."
    error_id: ERR_ACCEPTANCE_CLOCK_ELAPSED
    http_status: 409
    applies_to: "POST /opo/match-runs/{id}/offers/{offerId}/respond"
  - priority: 51
    category: state
    check: "Cross-clamp and cancel require the operation in status SCHEDULED; advance requires the run in status OPEN; disposition requires the organ in RECOVERED (TRANSPLANTED/DISCARDED) or NON_TRANSPLANTABLE (RESEARCH_REFERRED/TISSUE_REFERRED)."
    error_id: "ERR_OPERATION_NOT_SCHEDULED | ERR_MATCH_RUN_NOT_OPEN | ERR_DISPOSITION_NOT_ALLOWED"
    http_status: 409
    applies_to: "POST /opo/recovery-operations/{id}/cross-clamp, POST /opo/recovery-operations/{id}/cancel, POST /opo/match-runs/{id}/advance, POST /opo/organs/{id}/disposition"
  - priority: 52
    category: state
    check: "The resource named in the path, when its own lifecycle already sits in one of its declared terminal states, rejects every further transition trigger. Scope is pinned: the check reads only the path resource's own state machine, and it is NOT evaluated for DonorCase dimensions - a case whose physiologic_status is LOST or whose allocation_status is CLOSED is gated by the posture rule at priority 61 (ERR_CASE_FROZEN), which is the declared vehicle for that family."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all POST action endpoints"
  - priority: 55
    category: state
    check: "expected_organ_version / expected_screening_version equals the current version of the named parent row."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /opo/organs/{id}/match-runs, POST /opo/eligibility-screenings/{id}/risk-assessment"
  - priority: 58
    category: business_safety
    check: "Segregation of duties: the MedicalDirector issuing a screening decision must not be the user recorded in risk_assessed_by_user_id, and the AuthorizationSpecialist finalizing a packet must not be the user recorded in consent_recorded_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /opo/eligibility-screenings/{id}/decision, POST /opo/authorizations/{id}/finalize"
  - priority: 60
    category: business_safety
    check: "A screening carrying absolute_contraindication == true can neither be CLEARED nor back a donor case."
    error_id: ERR_ABSOLUTE_CONTRAINDICATION
    http_status: 422
    applies_to: "POST /opo/eligibility-screenings/{id}/decision, POST /opo/donor-cases"
  - priority: 61
    category: business_safety
    check: "A DonorCase whose case_posture is FROZEN rejects every child mutation (observations, organs, evaluation, match runs, offer responses, recovery operations, cross-clamp, transport). POST /opo/organs/{id}/disposition is deliberately exempt: research and tissue book-keeping for organs stranded by a closure must remain recordable after the case freezes."
    error_id: ERR_CASE_FROZEN
    http_status: 409
    applies_to: "POST /opo/donor-cases/{id}/observations, POST /opo/donor-cases/{id}/organs, POST /opo/organs/{id}/evaluation, POST /opo/organs/{id}/match-runs, POST /opo/match-runs/{id}/offers/{offerId}/respond, POST /opo/donor-cases/{id}/recovery-operations, POST /opo/recovery-operations/{id}/cross-clamp, POST /opo/organs/{id}/transport"
  - priority: 62
    category: business_safety
    check: "An organ under viability_hold == true cannot be evaluated back to ALLOCATABLE until the hold is cleared by a recovering observation. This check is deliberately ordered BEFORE the posture gate below, because the hold is the more specific fact: a held organ always sits on a RESTRICTED case, so the coarser posture error would otherwise mask it."
    error_id: ERR_VIABILITY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /opo/organs/{id}/evaluation"
  - priority: 63
    category: business_safety
    check: "A DonorCase whose case_posture is RESTRICTED rejects organ evaluation and match-run creation for organ_type in THORACIC_TYPES; abdominal organs are unaffected."
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /opo/organs/{id}/evaluation, POST /opo/organs/{id}/match-runs"
  - priority: 64
    category: business_safety
    check: "Accepting an offer on a donor whose risk_tier_snapshot is INCREASED_RISK requires increased_risk_ack == true."
    error_id: ERR_INCREASED_RISK_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /opo/match-runs/{id}/offers/{offerId}/respond"
  - priority: 65
    category: business_safety
    check: "Finalizing requires documentation_complete == true for the packet's basis."
    error_id: ERR_AUTHORIZATION_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /opo/authorizations/{id}/finalize"
  - priority: 66
    category: business_safety
    check: "A CONSENT or DECLINE contact at rank R is admissible only when every rank better than R already has a contact with response DECLINE or UNREACHABLE; an OBJECTION already recorded at a better rank blocks consent outright."
    error_id: ERR_NOK_HIERARCHY_VIOLATION
    http_status: 409
    applies_to: "POST /opo/authorizations/{id}/nok-contacts"
  - priority: 67
    category: business_temporal
    check: "referred_at (the logical clock at intake) must not precede trigger_event_at, and death_pronounced_at, when supplied, must not precede trigger_event_at."
    error_id: ERR_REFERRAL_BEFORE_TRIGGER
    http_status: 422
    applies_to: "POST /opo/death-referrals"
  - priority: 68
    category: business_temporal
    check: "recorded_at must not be after the logical clock."
    error_id: ERR_OBSERVATION_IN_FUTURE
    http_status: 422
    applies_to: "POST /opo/donor-cases/{id}/observations"
  - priority: 69
    category: business_temporal
    check: "or_end_at must be strictly after or_start_at; transport_arrive_at strictly after transport_depart_at; transport_depart_at not before the organ's cross_clamp_at."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /opo/donor-cases/{id}/recovery-operations, POST /opo/organs/{id}/transport"
  - priority: 70
    category: business_temporal
    check: "projected_cold_ischemic_minutes must not exceed CIT_LIMIT_MINUTES[organ_type]; equality is accepted."
    error_id: ERR_COLD_ISCHEMIC_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /opo/organs/{id}/transport"
  - priority: 72
    category: business_referential
    check: "The recovery team's specialty must cover every organ_type in the case's ACCEPTED organ set (THORACIC covers THORACIC_TYPES, ABDOMINAL covers the rest, MULTIORGAN covers all)."
    error_id: ERR_TEAM_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /opo/donor-cases/{id}/recovery-operations"
  - priority: 73
    category: business_referential
    check: "The authorization named by a donor case must reference the same referral_id as the case, and the screening used must belong to that referral."
    error_id: ERR_AUTHORIZATION_REFERRAL_MISMATCH
    http_status: 422
    applies_to: "POST /opo/donor-cases"
  - priority: 74
    category: business_referential
    check: "An offer response must address an offer whose match_run_id equals the run in the path."
    error_id: ERR_OFFER_RUN_MISMATCH
    http_status: 422
    applies_to: "POST /opo/match-runs/{id}/offers/{offerId}/respond"
  - priority: 75
    category: business_constraint
    check: "A recovery operation requires at least one Organ of the case in status ACCEPTED."
    error_id: ERR_NO_ACCEPTED_ORGANS
    http_status: 409
    applies_to: "POST /opo/donor-cases/{id}/recovery-operations"
  - priority: 76
    category: business_constraint
    check: "The candidate list of a match run is non-empty and its sequence_position values are unique and contiguous starting at 1."
    error_id: "ERR_EMPTY_MATCH_RUN | ERR_INVALID_SEQUENCE"
    http_status: 422
    applies_to: "POST /opo/organs/{id}/match-runs"
  - priority: 77
    category: business_constraint
    check: "A screening may be bounced back for more information at most MAX_INFO_REQUESTS (2) times."
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /opo/eligibility-screenings/{id}/request-info"
  - priority: 78
    category: business_temporal
    check: "Recovery-team OR availability: the requested window conflicts with an existing SCHEDULED or COMPLETED operation of the same team when new.or_start_at < existing.or_end_at + buffer AND existing.or_start_at < new.or_end_at + buffer, where buffer = team.turnaround_buffer_minutes. Comparisons are strict (half-open), so a window starting exactly buffer minutes after an existing end is accepted. CANCELLED operations are excluded."
    error_id: ERR_TEAM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /opo/donor-cases/{id}/recovery-operations"
  - priority: 80
    category: business_constraint
    check: "Transport-asset capacity: count the organs already assigned to this asset with status in {RECOVERED, TRANSPLANTED} whose leg overlaps the requested leg on CLOSED intervals (new.transport_depart_at <= existing.transport_arrive_at AND existing.transport_depart_at <= new.transport_arrive_at, so touching endpoints collide); reject when that count is >= asset.concurrent_leg_capacity."
    error_id: ERR_ASSET_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /opo/organs/{id}/transport"
  - priority: 82
    category: business_constraint
    check: "RESEARCH_REFERRED requires research_protocol_code, TISSUE_REFERRED requires tissue_processor_code, and neither is permitted when nontransplantable_reason == AUTHORIZATION_RESCINDED (no research authorization exists)."
    error_id: ERR_DISPOSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /opo/organs/{id}/disposition"

endpoints:
  - method: POST
    path: "/opo/hospital-partners"
    description: "Register a referring hospital with its clinical trigger policy and timely-referral window."
    roles: [OpoAdmin]
    code: 201
    input: ["name", "hospital_code", "referral_trigger_policy?", "timely_referral_window_minutes?"]
    output: HospitalPartner
    side_effects: ["initialises referral_count 0, timely_referral_count 0, untimely_referral_count 0, converted_donor_count 0, timely_referral_rate null, partner_posture GOOD_STANDING"]
  - method: GET
    path: "/opo/hospital-partners/{id}"
    description: "Read one hospital partner including its lifetime timeliness counters and posture."
    roles: [OpoAdmin, ReferralCoordinator, MedicalDirector, HospitalReferralClerk]
    code: 200
    input: []
    output: HospitalPartner
    side_effects: []
  - method: GET
    path: "/opo/hospital-partners/{id}/performance"
    description: "Computed read: windowed recertification metrics for the hospital (windowed_recert variant of calculations.hospital_timeliness_posture). Nothing is persisted."
    roles: [OpoAdmin, MedicalDirector]
    code: 200
    input: ["window_days?", "basis?"]
    output: "{ hospital_partner_id: string, window_days: integer, basis: enum, window_start: datetime, window_end: datetime, eligible_referral_count: integer, timely_referral_count: integer, timely_referral_rate: number, cleared_referral_count: integer, converted_referral_count: integer, conversion_rate: number, transplanted_organ_count: integer, organs_per_donor: number, recertification_tier: enum }"
    side_effects: ["evaluates calculations.hospital_timeliness_posture (windowed_recert); basis defaults to CLINICAL_TRIGGER and window_days to 365"]
  - method: POST
    path: "/opo/recovery-teams"
    description: "Register a surgical recovery team with its specialty and turnaround buffer."
    roles: [OpoAdmin]
    code: 201
    input: ["team_code", "specialty", "turnaround_buffer_minutes?"]
    output: RecoveryTeam
    side_effects: ["initialises booked_or_minutes 0 and scheduled_operation_count 0"]
  - method: GET
    path: "/opo/recovery-teams/{id}"
    description: "Read one recovery team including its OR-minutes ledger."
    roles: [OpoAdmin, RecoveryLogistics, MedicalDirector]
    code: 200
    input: []
    output: RecoveryTeam
    side_effects: []
  - method: POST
    path: "/opo/transport-assets"
    description: "Register a transport asset with its carriage mode and concurrent leg capacity."
    roles: [OpoAdmin]
    code: 201
    input: ["asset_code", "mode", "concurrent_leg_capacity?"]
    output: TransportAsset
    side_effects: ["initialises active_leg_count 0"]
  - method: GET
    path: "/opo/transport-assets/{id}"
    description: "Read one transport asset including its active leg count."
    roles: [OpoAdmin, RecoveryLogistics]
    code: 200
    input: []
    output: TransportAsset
    side_effects: []
  - method: POST
    path: "/opo/death-referrals"
    description: "Record a hospital death referral call; stamps referred_at from the logical clock and scores timeliness on both bases."
    roles: [HospitalReferralClerk, ReferralCoordinator]
    code: 201
    input: ["hospital_partner_id", "patient_mrn", "age_years", "ventilated", "gcs_score", "cause_of_death_category", "trigger_event_at", "death_pronounced_at?"]
    output: DeathReferral
    side_effects:
      - "evaluates calculations.referral_timeliness_lag: sets referral_lag_minutes, timeliness_flag, audit_lag_minutes"
      - "evaluates calculations.hospital_timeliness_posture (incremental_lifetime): refreshes HospitalPartner.referral_count, timely_referral_count, untimely_referral_count, timely_referral_rate, partner_posture"
  - method: GET
    path: "/opo/death-referrals/{id}"
    description: "Read one death referral with its lag minutes and timeliness flag."
    roles: [OpoAdmin, ReferralCoordinator, MedicalDirector, AuthorizationSpecialist, DonorCoordinator, HospitalReferralClerk]
    code: 200
    input: []
    output: DeathReferral
    side_effects: []
  - method: GET
    path: "/opo/death-referrals"
    description: "List death referrals, filterable by hospital (reverse lookup for DeathReferral.hospital_partner_id), status and timeliness flag."
    roles: [OpoAdmin, ReferralCoordinator, MedicalDirector]
    code: 200
    input: ["hospital_partner_id?", "status?", "timeliness_flag?", "limit?", "offset?"]
    output: DeathReferral[]
    side_effects: []
  - method: POST
    path: "/opo/death-referrals/{id}/screenings"
    description: "Open the eligibility screening for a received referral."
    roles: [ReferralCoordinator]
    code: 201
    input: []
    output: EligibilityScreening
    side_effects: ["DeathReferral.status RECEIVED -> SCREENING", "creates EligibilityScreening in PENDING with info_request_count 0"]
  - method: GET
    path: "/opo/death-referrals/{id}/screenings"
    description: "Reverse lookup for EligibilityScreening.referral_id; array of length 0 or 1."
    roles: [OpoAdmin, ReferralCoordinator, MedicalDirector, SerologyLab, DonorCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityScreening[]
    side_effects: []
  - method: GET
    path: "/opo/eligibility-screenings/{id}"
    description: "Read one eligibility screening including risk score, tier, variant applied and version."
    roles: [OpoAdmin, ReferralCoordinator, MedicalDirector, SerologyLab, DonorCoordinator]
    code: 200
    input: []
    output: EligibilityScreening
    side_effects: []
  - method: POST
    path: "/opo/eligibility-screenings/{id}/risk-assessment"
    description: "Submit or resubmit the behavioral risk assessment; OCC-guarded on the screening version."
    roles: [ReferralCoordinator]
    code: 200
    input: ["risk_factors", "informant_reliability", "expected_screening_version", "unresolved_factors?"]
    output: EligibilityScreening
    side_effects:
      - "evaluates calculations.behavioral_risk_score: sets risk_score, risk_tier, risk_variant_applied"
      - "sets risk_assessed_by_user_id = X-User-ID; status INFO_REQUESTED -> PENDING; increments version by 1"
  - method: POST
    path: "/opo/eligibility-screenings/{id}/serology-results"
    description: "File a serologic laboratory result against the screening; an absolute-contraindication marker auto-rules-out the screening and its referral."
    roles: [SerologyLab]
    code: 201
    input: ["marker", "result", "resulted_at", "nat_confirmed?"]
    output: SerologyResult
    side_effects:
      - "computes absolute_contraindication_marker"
      - "when true: EligibilityScreening.absolute_contraindication = true, status -> RULED_OUT (ruled_out_reason SEROLOGY_CONTRAINDICATION), DeathReferral.status -> RULED_OUT"
      - "filing a result on a screening already in CLEARED is accepted (201) and is NOT a state transition: absolute_contraindication flips to true, status stays CLEARED, the referral is untouched, and the priority-60 gate then blocks donor-case creation. Validation priority 52 (ERR_ALREADY_TERMINAL) is not evaluated when the screening is CLEARED. A screening in RULED_OUT is the one terminal state that does reject further results with ERR_ALREADY_TERMINAL, since no further clinical decision can turn on them."
  - method: GET
    path: "/opo/eligibility-screenings/{id}/serology-results"
    description: "Reverse lookup for SerologyResult.screening_id."
    roles: [OpoAdmin, ReferralCoordinator, MedicalDirector, SerologyLab]
    code: 200
    input: ["limit?", "offset?"]
    output: SerologyResult[]
    side_effects: []
  - method: POST
    path: "/opo/eligibility-screenings/{id}/request-info"
    description: "Bounce the screening back to the coordinator for more behavioral history (at most MAX_INFO_REQUESTS times)."
    roles: [MedicalDirector]
    code: 200
    input: ["info_request_note?"]
    output: EligibilityScreening
    side_effects: ["status PENDING -> INFO_REQUESTED", "info_request_count += 1"]
  - method: POST
    path: "/opo/eligibility-screenings/{id}/decision"
    description: "Medical director rules the screening CLEARED or RULED_OUT; segregation of duties against the risk assessor."
    roles: [MedicalDirector]
    code: 200
    input: ["decision", "ruled_out_reason?"]
    output: EligibilityScreening
    side_effects: ["status PENDING -> CLEARED | RULED_OUT", "sets decided_by_user_id", "DeathReferral.status SCREENING -> SCREEN_CLEARED | RULED_OUT"]
  - method: POST
    path: "/opo/death-referrals/{id}/authorizations"
    description: "Open the authorization packet; registry_hit selects the FIRST_PERSON_REGISTRY branch or the LEGAL_NEXT_OF_KIN branch at creation."
    roles: [AuthorizationSpecialist]
    code: 201
    input: ["registry_hit", "registry_document_ref?"]
    output: Authorization
    side_effects:
      - "status PENDING_REGISTRY -> REGISTRY_CONFIRMED (registry_hit true) or -> NOK_REQUIRED (registry_hit false)"
      - "evaluates calculations.authorization_documentation_completeness: sets authorization_basis, required_document_types, document_types_present, documentation_complete"
      - "DeathReferral.status SCREEN_CLEARED -> AUTH_PENDING"
  - method: GET
    path: "/opo/death-referrals/{id}/authorizations"
    description: "Reverse lookup for Authorization.referral_id."
    roles: [OpoAdmin, AuthorizationSpecialist, MedicalDirector, DonorCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Authorization[]
    side_effects: []
  - method: GET
    path: "/opo/authorizations/{id}"
    description: "Read one authorization packet including basis, consenting rank, documentation completeness and version."
    roles: [OpoAdmin, AuthorizationSpecialist, MedicalDirector, DonorCoordinator]
    code: 200
    input: []
    output: Authorization
    side_effects: []
  - method: POST
    path: "/opo/authorizations/{id}/nok-contacts"
    description: "Record a next-of-kin contact attempt (CONSENT, DECLINE, UNREACHABLE or OBJECTION) against the statutory hierarchy."
    roles: [AuthorizationSpecialist]
    code: 201
    input: ["relationship", "response", "contact_note?"]
    output: NextOfKinContact
    side_effects:
      - "sets rank = NOK_RANK[relationship], contacted_at = clock_now, recorded_by_user_id = X-User-ID"
      - "CONSENT: Authorization.status NOK_REQUIRED -> NOK_CONSENTED, consenting_rank and consent_recorded_by_user_id set"
      - "DECLINE from rank 1: Authorization -> DECLINED and DeathReferral -> NOT_CONVERTED"
      - "UNREACHABLE completing every relationship class: Authorization -> UNABLE_TO_LOCATE and DeathReferral -> NOT_CONVERTED"
      - "OBJECTION from a rank better than consenting_rank on an AUTHORIZED packet: Authorization -> RESCINDED, driving the rescission cascade"
  - method: GET
    path: "/opo/authorizations/{id}/nok-contacts"
    description: "Reverse lookup for NextOfKinContact.authorization_id."
    roles: [OpoAdmin, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: NextOfKinContact[]
    side_effects: []
  - method: POST
    path: "/opo/authorizations/{id}/documents"
    description: "File a document into the authorization packet and recompute documentation completeness."
    roles: [AuthorizationSpecialist]
    code: 200
    input: ["document_type", "witness_name?"]
    output: Authorization
    side_effects: ["document_types_present gains document_type; witness_name stored when supplied", "recomputes documentation_complete", "status DOCUMENT_DEFICIENT -> NOK_CONSENTED"]
  - method: POST
    path: "/opo/authorizations/{id}/finalize"
    description: "Finalize the authorization packet; segregation of duties against the consent recorder."
    roles: [AuthorizationSpecialist]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status REGISTRY_CONFIRMED | NOK_CONSENTED -> AUTHORIZED with finalized_by_user_id set", "status NOK_CONSENTED -> DOCUMENT_DEFICIENT when documentation_complete is false"]
  - method: POST
    path: "/opo/donor-cases"
    description: "Convert a referral into a donor case once screening is CLEARED and the authorization is AUTHORIZED."
    roles: [DonorCoordinator]
    code: 201
    input: ["referral_id", "authorization_id", "donor_code"]
    output: DonorCase
    side_effects:
      - "DeathReferral.status AUTH_PENDING -> CONVERTED; HospitalPartner.converted_donor_count += 1"
      - "pins risk_tier_snapshot from EligibilityScreening.risk_tier; physiologic_status STABILIZING, allocation_status NOT_STARTED, case_posture OPEN"
  - method: GET
    path: "/opo/donor-cases/{id}"
    description: "Read one donor case with both status dimensions, derived posture, viability index and organ counters."
    roles: [OpoAdmin, DonorCoordinator, MedicalDirector, AllocationSpecialist, RecoveryLogistics]
    code: 200
    input: []
    output: DonorCase
    side_effects: []
  - method: GET
    path: "/opo/donor-cases"
    description: "List donor cases; reverse lookup for DonorCase.referral_id and DonorCase.authorization_id."
    roles: [OpoAdmin, DonorCoordinator, MedicalDirector, AllocationSpecialist]
    code: 200
    input: ["referral_id?", "authorization_id?", "case_posture?", "limit?", "offset?"]
    output: DonorCase[]
    side_effects: []
  - method: POST
    path: "/opo/donor-cases/{id}/observations"
    description: "Chart a physiologic observation; recomputes the viability index and the physiologic dimension."
    roles: [DonorCoordinator]
    code: 201
    input: ["recorded_at", "map_mmhg", "pao2_fio2_ratio", "sodium", "urine_output_ml_per_kg_hr", "pressor_count", "cardiac_arrest?"]
    output: PhysiologicObservation
    side_effects:
      - "evaluates calculations.donor_viability_index: sets viability_index_snapshot and dmg_bundle_met on the observation"
      - "refreshes DonorCase.viability_index, physiologic_status, dmg_bundle_met_count, observation_count"
      - "evaluates calculations.donor_case_posture and runs the decompensation or donor-loss cascade"
  - method: GET
    path: "/opo/donor-cases/{id}/observations"
    description: "Reverse lookup for PhysiologicObservation.donor_case_id."
    roles: [OpoAdmin, DonorCoordinator, MedicalDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: PhysiologicObservation[]
    side_effects: []
  - method: POST
    path: "/opo/donor-cases/{id}/organs"
    description: "Register a recoverable organ on the donor case; organ_type is unique per case."
    roles: [DonorCoordinator]
    code: 201
    input: ["organ_type"]
    output: Organ
    side_effects: ["sets cit_limit_minutes from CIT_LIMIT_MINUTES[organ_type]; status PENDING_EVAL", "DonorCase.organ_count += 1"]
  - method: GET
    path: "/opo/organs/{id}"
    description: "Read one organ including its cold-ischemic projection fields and version."
    roles: [OpoAdmin, DonorCoordinator, MedicalDirector, AllocationSpecialist, RecoveryLogistics]
    code: 200
    input: []
    output: Organ
    side_effects: []
  - method: GET
    path: "/opo/organs"
    description: "List organs; reverse lookup for Organ.donor_case_id, Organ.accepted_offer_id and Organ.transport_asset_id."
    roles: [OpoAdmin, DonorCoordinator, MedicalDirector, AllocationSpecialist, RecoveryLogistics]
    code: 200
    input: ["donor_case_id?", "accepted_offer_id?", "transport_asset_id?", "status?", "limit?", "offset?"]
    output: Organ[]
    side_effects: []
  - method: POST
    path: "/opo/organs/{id}/evaluation"
    description: "Medical director declares the organ ALLOCATABLE or NON_TRANSPLANTABLE."
    roles: [MedicalDirector]
    code: 200
    input: ["decision", "nontransplantable_reason?"]
    output: Organ
    side_effects: ["status PENDING_EVAL -> ALLOCATABLE | NON_TRANSPLANTABLE", "DonorCase.organs_nontransplantable_count refreshed"]
  - method: POST
    path: "/opo/organs/{id}/match-runs"
    description: "Generate a national match run with its sequenced candidate list; OCC-guarded on the organ version. A later run supersedes the organ's earlier OPEN run."
    roles: [AllocationSpecialist]
    code: 201
    input: ["expected_organ_version", "candidates", "primary_offer_slots?"]
    output: MatchRun
    side_effects:
      - "creates one OrganOffer per candidate in status QUEUED; candidate_count set; increments Organ.version by 1"
      - "evaluates calculations.offer_promotion_selector: promotes up to primary_offer_slots offers to PENDING with offered_at and expires_at"
      - "organ.status ALLOCATABLE -> OFFERING; DonorCase.allocation_status -> MATCH_RUN_OPEN then OFFERS_IN_FLIGHT"
      - "prior OPEN run of the same organ -> SUPERSEDED with its QUEUED/PENDING offers -> BYPASSED"
  - method: GET
    path: "/opo/organs/{id}/match-runs"
    description: "Reverse lookup for MatchRun.organ_id."
    roles: [OpoAdmin, AllocationSpecialist, MedicalDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: MatchRun[]
    side_effects: []
  - method: GET
    path: "/opo/match-runs/{id}"
    description: "Read one match run including pending_offer_count and slots_free."
    roles: [OpoAdmin, AllocationSpecialist, MedicalDirector]
    code: 200
    input: []
    output: MatchRun
    side_effects: []
  - method: GET
    path: "/opo/match-runs/{id}/offers"
    description: "Reverse lookup for OrganOffer.match_run_id, ordered by sequence_position ASC."
    roles: [OpoAdmin, AllocationSpecialist, MedicalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrganOffer[]
    side_effects: []
  - method: POST
    path: "/opo/match-runs/{id}/offers/{offerId}/respond"
    description: "Record a transplant centre's ACCEPT or DECLINE on a pending offer, or WITHDRAW_ACCEPTANCE on an accepted one."
    roles: [AllocationSpecialist]
    code: 200
    input: ["decision", "decline_reason?", "increased_risk_ack?"]
    output: OrganOffer
    side_effects:
      - "ACCEPT: offer PENDING -> ACCEPTED, organ OFFERING -> ACCEPTED with accepted_offer_id set, run OPEN -> CLOSED (ACCEPTED), peer QUEUED/PENDING offers -> BYPASSED (PEER_ACCEPTED), DonorCase.allocation_status -> ALLOCATED"
      - "DECLINE: offer -> DECLINED and calculations.offer_promotion_selector promotes the next QUEUED offer"
      - "WITHDRAW_ACCEPTANCE: offer -> WITHDRAWN, organ ACCEPTED -> OFFERING, run CLOSED -> OPEN, PEER_ACCEPTED bypasses restored to QUEUED, promotion selector re-runs, DonorCase.allocation_status ALLOCATED -> OFFERS_IN_FLIGHT"
  - method: POST
    path: "/opo/match-runs/{id}/advance"
    description: "Sweep elapsed acceptance clocks and refill the pending offer slots from the queued candidates."
    roles: [AllocationSpecialist]
    code: 200
    input: []
    output: MatchRun
    side_effects:
      - "PENDING offers with expires_at <= clock_now -> EXPIRED"
      - "evaluates calculations.offer_promotion_selector; empty candidate pool -> run OPEN -> EXHAUSTED (CANDIDATES_EXHAUSTED), organ OFFERING -> ALLOCATABLE, DonorCase.allocation_status -> MATCH_RUN_OPEN"
  - method: POST
    path: "/opo/donor-cases/{id}/recovery-operations"
    description: "Book an operating-room window for a recovery team; enforces buffered team availability and specialty coverage."
    roles: [RecoveryLogistics]
    code: 201
    input: ["recovery_team_id", "or_start_at", "or_end_at"]
    output: RecoveryOperation
    side_effects: ["computes or_minutes and organ_types_covered", "RecoveryTeam.booked_or_minutes += or_minutes; scheduled_operation_count += 1"]
  - method: GET
    path: "/opo/recovery-operations/{id}"
    description: "Read one recovery operation including or_minutes and cross_clamp_at."
    roles: [OpoAdmin, RecoveryLogistics, MedicalDirector, DonorCoordinator]
    code: 200
    input: []
    output: RecoveryOperation
    side_effects: []
  - method: GET
    path: "/opo/recovery-operations"
    description: "List recovery operations; reverse lookup for RecoveryOperation.donor_case_id and RecoveryOperation.recovery_team_id."
    roles: [OpoAdmin, RecoveryLogistics, MedicalDirector]
    code: 200
    input: ["donor_case_id?", "recovery_team_id?", "status?", "limit?", "offset?"]
    output: RecoveryOperation[]
    side_effects: []
  - method: POST
    path: "/opo/recovery-operations/{id}/cross-clamp"
    description: "Record aortic cross-clamp, completing the operation and recovering every accepted organ of the case."
    roles: [RecoveryLogistics]
    code: 200
    input: []
    output: RecoveryOperation
    side_effects:
      - "status SCHEDULED -> COMPLETED with cross_clamp_at = clock_now; RecoveryTeam.scheduled_operation_count -= 1 and booked_or_minutes unchanged"
      - "every ACCEPTED Organ of the case -> RECOVERED with cross_clamp_at copied; DonorCase.allocation_status ALLOCATED -> RECOVERED"
  - method: POST
    path: "/opo/recovery-operations/{id}/cancel"
    description: "Cancel a scheduled operation, releasing the team's booked OR minutes."
    roles: [RecoveryLogistics]
    code: 200
    input: []
    output: RecoveryOperation
    side_effects: ["status SCHEDULED -> CANCELLED (cancelled_reason LOGISTICS_WITHDRAWN)", "RecoveryTeam.booked_or_minutes -= or_minutes; scheduled_operation_count -= 1"]
  - method: POST
    path: "/opo/organs/{id}/transport"
    description: "Dispatch a recovered organ on a transport asset; projects cold ischemic time and enforces the organ-type ceiling and asset capacity."
    roles: [RecoveryLogistics]
    code: 200
    input: ["transport_asset_id", "transport_mode", "transport_depart_at", "transport_arrive_at"]
    output: Organ
    side_effects:
      - "evaluates calculations.cold_ischemic_projection: sets transit_minutes, implant_prep_minutes, projected_cold_ischemic_minutes, projected_cit_margin_minutes"
      - "TransportAsset.active_leg_count refreshed"
  - method: POST
    path: "/opo/organs/{id}/disposition"
    description: "Record the final disposition of an organ: TRANSPLANTED, DISCARDED, RESEARCH_REFERRED or TISSUE_REFERRED."
    roles: [MedicalDirector]
    code: 200
    input: ["disposition", "research_protocol_code?", "tissue_processor_code?"]
    output: Organ
    side_effects:
      - "status RECOVERED -> TRANSPLANTED | DISCARDED, or NON_TRANSPLANTABLE -> RESEARCH_REFERRED | TISSUE_REFERRED"
      - "DonorCase.allocation_status RECOVERED -> CLOSED (closed_reason RECOVERY_COMPLETE, case_posture FROZEN) when this was the last non-terminal organ"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [OpoAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects: ["every subsequent referred_at, contacted_at, offered_at, expires_at, responded_at, cross_clamp_at and generated_at stamp reads from this clock"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role name is not declared in §1.7."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_HOSPITAL_SCOPE_VIOLATION
    http: 403
    condition: "A HospitalReferralClerk acts on a hospital_partner_id other than its own X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same X-User-ID both submitted the risk assessment and issued the screening decision, or both recorded next-of-kin consent and finalized the packet."
  - id: ERR_HOSPITAL_NOT_FOUND
    http: 404
    condition: "No HospitalPartner exists for the given id."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "No DeathReferral exists for the given id."
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "No EligibilityScreening exists for the given id."
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "No Authorization exists for the given id."
  - id: ERR_DONOR_CASE_NOT_FOUND
    http: 404
    condition: "No DonorCase exists for the given id."
  - id: ERR_ORGAN_NOT_FOUND
    http: 404
    condition: "No Organ exists for the given id."
  - id: ERR_MATCH_RUN_NOT_FOUND
    http: 404
    condition: "No MatchRun exists for the given id."
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "No OrganOffer exists for the given id."
  - id: ERR_OPERATION_NOT_FOUND
    http: 404
    condition: "No RecoveryOperation exists for the given id."
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "No RecoveryTeam exists for the recovery_team_id supplied in the body."
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "No TransportAsset exists for the transport_asset_id supplied in the body."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, or a value violates its declared type, enum membership or numeric range."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "hospital_code, team_code, asset_code or donor_code already exists, or the donor case already carries this organ_type."
  - id: ERR_REFERRAL_NOT_SCREENABLE
    http: 409
    condition: "The referral is not in status RECEIVED, or a screening already exists for it."
  - id: ERR_SCREENING_NOT_PENDING
    http: 409
    condition: "The screening is not in a status that accepts this action (risk assessment needs PENDING or INFO_REQUESTED; request-info and decision need PENDING)."
  - id: ERR_RISK_ASSESSMENT_MISSING
    http: 409
    condition: "A screening decision was attempted while risk_score is null."
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "A third information request was attempted on a screening whose info_request_count is already MAX_INFO_REQUESTS (2)."
  - id: ERR_AUTHORIZATION_NOT_OPENABLE
    http: 409
    condition: "The referral is not in status SCREEN_CLEARED, or a non-terminal authorization already exists for it."
  - id: ERR_AUTHORIZATION_NOT_CONTACTABLE
    http: 409
    condition: "A next-of-kin contact was attempted while the authorization is not NOK_REQUIRED (or not AUTHORIZED for an OBJECTION)."
  - id: ERR_AUTHORIZATION_NOT_FINALIZABLE
    http: 409
    condition: "Finalize or a document upload was attempted from a status that does not admit it."
  - id: ERR_NOK_HIERARCHY_VIOLATION
    http: 409
    condition: "A CONSENT or DECLINE was recorded at a rank while a better rank has no DECLINE/UNREACHABLE contact, or a better-ranked OBJECTION already stands."
  - id: ERR_AUTHORIZATION_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "Finalize was attempted while documentation_complete is false; the packet moves to DOCUMENT_DEFICIENT."
  - id: ERR_SCREENING_NOT_CLEARED
    http: 409
    condition: "Donor-case creation was attempted while the referral is not AUTH_PENDING or its screening is not CLEARED."
  - id: ERR_AUTHORIZATION_NOT_GRANTED
    http: 409
    condition: "Donor-case creation named an authorization whose status is not AUTHORIZED."
  - id: ERR_AUTHORIZATION_REFERRAL_MISMATCH
    http: 422
    condition: "The named authorization's referral_id differs from the donor case's referral_id."
  - id: ERR_ABSOLUTE_CONTRAINDICATION
    http: 422
    condition: "A clearance or conversion was attempted on a screening whose absolute_contraindication is true."
  - id: ERR_CASE_FROZEN
    http: 409
    condition: "A child mutation was attempted on a DonorCase whose case_posture is FROZEN."
  - id: ERR_POSTURE_RESTRICTED
    http: 409
    condition: "Evaluation or match-run creation was attempted for a thoracic organ while case_posture is RESTRICTED."
  - id: ERR_VIABILITY_HOLD_ACTIVE
    http: 409
    condition: "Re-evaluation to ALLOCATABLE was attempted while the organ carries viability_hold true."
  - id: ERR_OBSERVATION_IN_FUTURE
    http: 422
    condition: "recorded_at is after the logical clock."
  - id: ERR_REFERRAL_BEFORE_TRIGGER
    http: 422
    condition: "referred_at precedes trigger_event_at, or death_pronounced_at precedes trigger_event_at."
  - id: ERR_ORGAN_NOT_EVALUABLE
    http: 409
    condition: "Evaluation was attempted on an organ whose status is not PENDING_EVAL."
  - id: ERR_ORGAN_NOT_ALLOCATABLE
    http: 409
    condition: "Match-run creation was attempted on an organ whose status is neither ALLOCATABLE nor OFFERING."
  - id: ERR_ORGAN_NOT_RECOVERED
    http: 409
    condition: "Transport dispatch was attempted on an organ whose status is not RECOVERED."
  - id: ERR_EMPTY_MATCH_RUN
    http: 422
    condition: "The candidates array is empty."
  - id: ERR_INVALID_SEQUENCE
    http: 422
    condition: "The candidates' sequence_position values are duplicated or not contiguous from 1."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_organ_version or expected_screening_version does not equal the current version of the named parent row."
  - id: ERR_MATCH_RUN_NOT_OPEN
    http: 409
    condition: "Advance was attempted on a match run whose status is not OPEN."
  - id: ERR_OFFER_NOT_PENDING
    http: 409
    condition: "ACCEPT or DECLINE was attempted on an offer that is not PENDING, or WITHDRAW_ACCEPTANCE on an offer that is not ACCEPTED."
  - id: ERR_OFFER_RUN_MISMATCH
    http: 422
    condition: "The offer's match_run_id differs from the match run in the path."
  - id: ERR_ACCEPTANCE_CLOCK_ELAPSED
    http: 409
    condition: "ACCEPT was attempted when the logical clock has reached the offer's expires_at."
  - id: ERR_INCREASED_RISK_ACK_REQUIRED
    http: 422
    condition: "ACCEPT on an INCREASED_RISK donor omitted increased_risk_ack true."
  - id: ERR_NO_ACCEPTED_ORGANS
    http: 409
    condition: "A recovery operation was booked for a case with no organ in status ACCEPTED."
  - id: ERR_TEAM_SPECIALTY_MISMATCH
    http: 422
    condition: "The recovery team's specialty does not cover every accepted organ type of the case."
  - id: ERR_TEAM_WINDOW_CONFLICT
    http: 409
    condition: "The requested OR window overlaps an existing SCHEDULED or COMPLETED window of the same team once the turnaround buffer is applied."
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "or_end_at is not after or_start_at, transport_arrive_at is not after transport_depart_at, or transport_depart_at precedes the organ's cross_clamp_at."
  - id: ERR_COLD_ISCHEMIC_LIMIT_EXCEEDED
    http: 422
    condition: "projected_cold_ischemic_minutes exceeds the organ type's CIT_LIMIT_MINUTES."
  - id: ERR_ASSET_CAPACITY_EXCEEDED
    http: 409
    condition: "The transport asset already carries concurrent_leg_capacity overlapping legs."
  - id: ERR_OPERATION_NOT_SCHEDULED
    http: 409
    condition: "Cross-clamp or cancel was attempted on an operation whose status is not SCHEDULED."
  - id: ERR_DISPOSITION_NOT_ALLOWED
    http: 409
    condition: "The requested disposition does not match the organ's status, its required code is missing, or the organ became non-transplantable through authorization rescission."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "A transition trigger was applied to a resource already in one of its terminal states."

roles:
  - name: OpoAdmin
    description: "Operations administrator: registers hospitals, teams and assets, reads performance reports, and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /opo/hospital-partners"
      - "POST /opo/recovery-teams"
      - "POST /opo/transport-assets"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /opo/hospital-partners/{id}/performance"
      - "all GET reads across the domain"
  - name: HospitalReferralClerk
    description: "Clerk at a partner hospital who places death referral calls; may only act for its own hospital."
    identity: "entity_backed:HospitalPartner"
    exclusive_operations: []
    shared_operations:
      - "POST /opo/death-referrals"
      - "GET /opo/hospital-partners/{id}"
      - "GET /opo/death-referrals/{id}"
  - name: ReferralCoordinator
    description: "OPO coordinator who takes the referral, opens the screening and submits the behavioral risk assessment."
    identity: opaque
    exclusive_operations:
      - "POST /opo/death-referrals/{id}/screenings"
      - "POST /opo/eligibility-screenings/{id}/risk-assessment"
    shared_operations:
      - "POST /opo/death-referrals"
      - "GET /opo/death-referrals"
      - "GET /opo/eligibility-screenings/{id}"
  - name: SerologyLab
    description: "Laboratory role that files serologic marker results against a screening."
    identity: opaque
    exclusive_operations:
      - "POST /opo/eligibility-screenings/{id}/serology-results"
    shared_operations:
      - "GET /opo/eligibility-screenings/{id}/serology-results"
      - "GET /opo/eligibility-screenings/{id}"
  - name: MedicalDirector
    description: "Physician who rules on eligibility, evaluates organs and records final dispositions."
    identity: opaque
    exclusive_operations:
      - "POST /opo/eligibility-screenings/{id}/request-info"
      - "POST /opo/eligibility-screenings/{id}/decision"
      - "POST /opo/organs/{id}/evaluation"
      - "POST /opo/organs/{id}/disposition"
    shared_operations:
      - "GET /opo/hospital-partners/{id}/performance"
      - "GET /opo/donor-cases/{id}"
      - "GET /opo/organs/{id}"
  - name: AuthorizationSpecialist
    description: "Specialist who runs the registry search, walks the next-of-kin hierarchy, files documents and finalizes the packet."
    identity: opaque
    exclusive_operations:
      - "POST /opo/death-referrals/{id}/authorizations"
      - "POST /opo/authorizations/{id}/nok-contacts"
      - "POST /opo/authorizations/{id}/documents"
      - "POST /opo/authorizations/{id}/finalize"
    shared_operations:
      - "GET /opo/authorizations/{id}"
      - "GET /opo/death-referrals/{id}"
  - name: DonorCoordinator
    description: "Coordinator who converts the referral into a donor case, charts physiologic observations and registers organs."
    identity: opaque
    exclusive_operations:
      - "POST /opo/donor-cases"
      - "POST /opo/donor-cases/{id}/observations"
      - "POST /opo/donor-cases/{id}/organs"
    shared_operations:
      - "GET /opo/donor-cases/{id}"
      - "GET /opo/organs"
      - "GET /opo/donor-cases/{id}/observations"
  - name: AllocationSpecialist
    description: "Specialist who generates match runs, advances the acceptance clocks and records centre responses."
    identity: opaque
    exclusive_operations:
      - "POST /opo/organs/{id}/match-runs"
      - "POST /opo/match-runs/{id}/advance"
      - "POST /opo/match-runs/{id}/offers/{offerId}/respond"
    shared_operations:
      - "GET /opo/match-runs/{id}"
      - "GET /opo/match-runs/{id}/offers"
      - "GET /opo/organs/{id}"
  - name: RecoveryLogistics
    description: "Logistics role that books operating-room windows, records cross-clamp and dispatches organ transport."
    identity: opaque
    exclusive_operations:
      - "POST /opo/donor-cases/{id}/recovery-operations"
      - "POST /opo/recovery-operations/{id}/cross-clamp"
      - "POST /opo/recovery-operations/{id}/cancel"
      - "POST /opo/organs/{id}/transport"
    shared_operations:
      - "GET /opo/recovery-operations"
      - "GET /opo/recovery-teams/{id}"
      - "GET /opo/transport-assets/{id}"
