        grounds:
          - concurrency_rules.deployment-create-stale-serving-endpoint
          - validations.priority_13
          - errors.ERR_STALE_SERVING_ENDPOINT_VERSION
          - endpoints.POST_deployments
          - endpoints.POST_serving_endpoints_operational_state
        distinguishing_aspect: |
          The full OCC triple for §1.2.1 rule one — stale token rejected with the rule's own error_id at
          412, correct token accepted, and the parent version advancing on EVERY write to the endpoint row
          (deployment create, posture change, ramp) while advancing on NO rejected write. The sharp edge is
          the priority-13 placement: a stale token against a FROZEN cluster returns 412, not the
          cross-entity posture error, so an implementation that checks business state first is caught.
        setup_note: |
          Every deployment created here has a distinct `pattern`, so the shared serve window on one cluster
          never trips ERR_SERVE_WINDOW_CONFLICT (validations priority 61) and the only defect under test is
          the staleness of the OCC token.
