              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_planner: $.data.error_id }
          assert:
            - "Both creates return 201: ${hours_a} == 14 for ${block_a} and ${hours_b} == 9 for ${block_b}, with identical field shapes"
            - "${err_planner} == \"ERR_UNAUTHORIZED\" at 403 — the refused window 2026-10-01..2026-10-31 is buffer-legal against ${block_a}, so it is not ERR_CAPACITY_BLOCK_OVERLAP"
            - "GET /sop/capacity-blocks?family_id=${fam_a} returns total_count == 1 and GET /sop/capacity-blocks?family_id=${fam_b} returns total_count == 1"

  - section: cross_cutting_complexity_layers
    instances:
      - name: adjustment_create_with_a_stale_forecast_version_returns_412_then_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adjustment-create-stale-forecast]
          - errors.ERR_STALE_FORECAST_VERSION
          - validations[priority=90]
          - state_machines.DemandForecast.BASELINE_to_UNDER_CONSENSUS
        distinguishing_aspect: |
          The declared OCC field expected_demand_forecast_version guards a write whose business
          preconditions are all satisfied — the supersede semantics mean nothing else would have
          refused it. A forecast transition bumps the version by exactly 1, after which the
          client's one-behind token yields 412 ERR_STALE_FORECAST_VERSION and the refreshed token
          yields 201 on the identical payload.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; a cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one BASELINE forecast of 1000 units."
            - "The forecast is then transitioned BASELINE -> UNDER_CONSENSUS, which is the write that invalidates the client's original version token."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-OCC-FC", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { fc_v1: $.data.version }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "written against a one-behind view", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "written against a one-behind view", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id, adj_status: $.data.status }
          assert:
            - "${fc_v1} == ${fc_v0} + 1 — the BASELINE -> UNDER_CONSENSUS transition increments DemandForecast.version by exactly 1"
            - "The first create returns 412 with ${err} == \"ERR_STALE_FORECAST_VERSION\" and leaves DemandForecast.${fc_id}.version at ${fc_v1}"
            - "It is NOT 409 or 422: the cycle is in DEMAND_REVIEW, the item is MATURE, the swing of 100 is within the 250 limit, so nothing but the token was wrong"
            - "GET /sop/consensus-adjustments?demand_forecast_id=${fc_id} returns total_count == 0 immediately after the refusal"
            - "The second create — byte-identical except for the refreshed token — returns 201 with ${adj_status} == \"PROPOSED\" and applied_delta_units == 100"

      - name: cycle_version_increments_on_every_transition_and_a_one_behind_token_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scenario-select-stale-cycle]
          - entities.PlanningCycle.fields.version
          - state_machines.PlanningCycle
        distinguishing_aspect: |
          Every PlanningCycle transition increments version by exactly 1, so the token a client
          captured one hop earlier is exactly one behind — a single missed transition is enough to
          fail the select. Scenario writes in between do NOT advance the cycle, which is what
          makes the increment attributable to the transitions alone.
        test_recipe:
          setup:
            - "The base family, one MATURE item (95.0 / 0.20 / 30, safety_stock 330) and one customer; a 9 h block inside 2026-09 (900 units)."
            - "A cycle over 2026-09..2026-09 with financial_commitment_cents 2000000, one locked 1000-unit forecast and one PLANNED plan (constrained 900)."
            - "One CAPACITY_INVESTMENT scenario for 5 hours authored by supply-1 and evaluated while the cycle sits in SCENARIO_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
