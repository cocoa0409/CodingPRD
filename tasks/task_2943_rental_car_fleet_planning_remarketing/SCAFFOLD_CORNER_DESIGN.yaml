  - section: calculations
    instances:

      - name: policy_schedule_net_book_value_clamped_at_floor_residual_pct
        claim_type: decay_function
        grounds:
          - calculations[vehicle_residual_valuation]
          - entities.DepreciationPolicy.fields.floor_residual_pct
        distinguishing_aspect: "The decay claim here is the LOWER CLAMP, which the §1.8 divergence instance never reaches: at 15 holding months and 100000 km the raw straight-line result 970000 falls BELOW round_half_up(2800000 * 0.35) = 980000, so the reported net book value is the floor and further decay is impossible."
        test_recipe:
          setup:
            - "One ATL market, MIDSIZE segment (soft 40000 / hard 60000 km), ACTIVE MID-2026 policy (monthly 0.0150, 12 c/km, floor 0.35)."
            - "One RISK program so POLICY_SCHEDULE is the applied variant; one LOCKED ATL plan with a 4-unit allocation at 2800000 per unit."
            - "The vehicle reaches IN_SERVICE at 2026-01-15T00:00:00Z; the valuation is read at 2027-04-15T00:00:00Z, which is exactly 455 days later, so holding_months == floor(455 / 30) == 15."
            - "Time component = round_half_up(2800000 * 0.0150 * 15) = 630000; mileage component = 100000 * 12 = 1200000; raw = 2800000 - 1830000 = 970000; floor = round_half_up(2800000 * 0.35) = 980000."
