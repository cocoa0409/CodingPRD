            - call: "GET /batching-cycles/${cycle_id}/need-analysis"
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { pd: $.data.projected_patient_days, prov: $.data.provisional_required_beds, rate: $.data.selected_target_occupancy_rate, final_beds: $.data.required_beds_final, inv: $.data.inventory_beds, unmet: $.data.unmet_bed_need, unalloc: $.data.unallocated_bed_need, pinned: $.data.pinned_formula_version, current: $.data.formula_current_version, stale: $.data.formula_pin_stale }
          assert:
            - "HTTP status == 200"
            - "${pd} == 27375.0000 (54.750 * 100.0 * 5.0, 4 decimals round_half_up)"
            - "${prov} == 100.0000 (27375.0000 / (365 * 0.75), 4 decimals)"
            - "${rate} == 0.85 (100.0000 >= high_volume_bed_threshold 100)"
            - "${final_beds} == 89 (ceil(27375.0000 / (365 * 0.85)) = ceil(88.2246...))"
            - "${inv} == 70 and ${unmet} == 19 and ${unalloc} == 19"
            - "${pinned} == 1 and ${current} == 1 and ${stale} == false"

      - name: formula_amendment_marks_the_pin_stale_and_recompute_need_moves_the_pool
        claim_type: Input Set Filtering
        grounds:
          - calculations.cycle_need_methodology.input_set
          - endpoints[PATCH /state-plan-formulas/{id}]
          - endpoints[POST /batching-cycles/{id}/recompute-need]
        distinguishing_aspect: "Amending the formula does NOT retroactively change the cycle's stored need figures — the read reports formula_pin_stale true with unmet_bed_need still 19; only recompute-need re-pins to version 2 and rewrites the pool to 28."
        test_recipe:
          setup:
            - "Cycle 1 was created against formula version 1 (unmet_bed_need_at_open 19)."
            - "ProgramAdmin then amended the formula's use_rate_per_1000 from 100.0 to 110.0, bumping it to version 2."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
