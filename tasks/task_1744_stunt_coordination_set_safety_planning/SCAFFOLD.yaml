# =============================================================================
# Task 1744 — Stunt Coordination & On-Set Safety Planning
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Stunt Coordination & On-Set Safety Planning (stunt coordinator team): stunt design
  & risk assessment documentation, performer qualification & rehearsal scheduling,
  safety meeting & department sign-off, equipment/rigging inspection & medic standby,
  insurance notification & special-equipment permits, adjustment pay & hazard bump
  negotiation, incident reporting & production stoppage, post-stunt review

domain_name: stunt-coordination-set-safety
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - dual_variant_calculation
  entity_topology: flat            # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic      # revision loops, negotiation rounds, hold/reverify cycles; Production additionally carries parallel dimensions (posture x insurance_status)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # RiskAssessment.supersedes_assessment_id
  role_model: segregation_of_duties  # assessor != approver; designer != signoff signer; equipment registrar != inspector
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 14
  calculation_count: 10
  endpoint_count: 85
  error_code_count: 65
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; relationships via FK fields)
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Production display name" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total stunt budget in cents; > 0" }
      - { name: posture, type: enum, source: system, description: "SETUP | ACTIVE | STOPPED | WRAPPED — parallel dimension 1", default: SETUP }
      - { name: insurance_status, type: enum, source: system, description: "UNFILED | FILED | ACKNOWLEDGED — parallel dimension 2, independent of posture", default: UNFILED }
      - { name: declared_exposure_cents, type: integer, source: input, description: "Hazard exposure declared to the insurance carrier at filing" }
      - { name: endorsement_premium_cents, type: integer, source: computed, description: "Tiered insurance premium computed at file-insurance (see insurance_endorsement_premium)" }
      - { name: committed_pay_cents, type: integer, source: computed, description: "Sum of final_amount_cents over this production's PayAdjustments in AGREED status; invariant I1", default: 0 }
      - { name: stopped_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent transition into STOPPED; null when never stopped" }
      - { name: stop_reason, type: string, source: system, description: "Reason recorded on the most recent stoppage; null otherwise" }

  - name: StuntSequence
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: name, type: string, source: input, description: "Sequence display name" }
      - { name: hazard_class, type: enum, source: input, description: "FIRE | HEIGHT | VEHICLE | WATER | PYRO | AERIAL | FIGHT" }
      - { name: risk_category, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL; must match the screening band of the pinned assessment at lock" }
      - { name: status, type: enum, source: system, description: "DRAFT | DESIGN_LOCKED | READY | SAFETY_HOLD | EXECUTED | REVIEWED | CANCELLED", default: DRAFT }
      - { name: coordinator_user_id, type: string, source: system, description: "X-User-ID of the StuntCoordinator who created the sequence; SoD anchor" }
      - { name: scheduled_execution_start, type: datetime, source: input, description: "Planned execution window start (ISO 8601)" }
      - { name: scheduled_execution_end, type: datetime, source: input, description: "Planned execution window end; must be after start" }
      - { name: required_equipment_ids, type: array, source: input, description: "FK -> EquipmentItem.id; each array element references a required equipment item of the same production; may be empty" }
      - { name: required_rehearsal_count, type: integer, source: computed, description: "Rehearsal quota computed at lock-design (see required_rehearsal_count); null until locked" }
      - { name: completed_rehearsal_count, type: integer, source: computed, description: "Count of this sequence's Rehearsals in COMPLETED status; invariant I2", default: 0 }
      - { name: completed_rehearsal_minutes, type: integer, source: computed, description: "Sum of duration_minutes over this sequence's COMPLETED Rehearsals; invariant I2", default: 0 }
      - { name: current_assessment_id, type: string, source: system, description: "References RiskAssessment.id of the pinned APPROVED assessment; set at lock-design, cleared on SAFETY_DEFICIENCY review outcome; null otherwise" }
      - { name: board_score, type: integer, source: computed, description: "Board-variant risk score of the pinned assessment, computed at lock-design; null until locked" }
      - { name: design_revision, type: integer, source: system, description: "Starts at 1; increments on EXECUTED -> DESIGN_LOCKED reshoot/deficiency loops; SafetyMeetings pin the revision at creation", default: 1 }
      - { name: medic_standby_required, type: boolean, source: computed, description: "true iff risk_category in {HIGH, CRITICAL} or hazard_class in {FIRE, PYRO, VEHICLE, WATER}; computed at lock-design" }

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; must equal the sequence's production" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id" }
      - { name: assessor_user_id, type: string, source: system, description: "X-User-ID of the creating StuntCoordinator; SoD anchor" }
      - { name: severity_rating, type: integer, source: input, description: "1..5 severity" }
      - { name: likelihood_rating, type: integer, source: input, description: "1..5 likelihood" }
      - { name: mitigation_notes, type: string, source: input, description: "Mitigation narrative; non-empty earns the board-score mitigation credit", default: "" }
      - { name: screening_score, type: integer, source: computed, description: "severity_rating x likelihood_rating (1..25), computed at create/revise" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", default: DRAFT }
      - { name: supersedes_assessment_id, type: string, source: system, description: "FK -> RiskAssessment.id; set on the newly APPROVED assessment pointing at the previously APPROVED one it replaces; null otherwise" }
      - { name: rejection_reason, type: string, source: system, description: "Recorded on reject; null otherwise" }

  - name: StuntPerformer
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: first_name, type: string, source: input, description: "Performer first name" }
      - { name: last_name, type: string, source: input, description: "Performer last name" }
      - { name: base_day_rate_cents, type: integer, source: input, description: "Base daily rate in cents; > 0" }
      - { name: union_status, type: enum, source: input, description: "SAG_AFTRA | NON_UNION" }
      - { name: status, type: enum, source: system, description: "REGISTERED | QUALIFIED | SUSPENDED; clock-driven downgrade QUALIFIED -> REGISTERED applies when the last valid certification expires", default: REGISTERED }
      - { name: completed_rehearsal_minutes, type: integer, source: computed, description: "Sum of duration_minutes over this performer's COMPLETED Rehearsals; invariant I2", default: 0 }

  - name: Certification
    parent: null
    common_fields: false
    fields:
      - { name: performer_id, type: string, source: input, description: "FK -> StuntPerformer.id" }
      - { name: discipline, type: enum, source: input, description: "FIRE | HEIGHT | VEHICLE | WATER | PYRO | AERIAL | FIGHT (same set as hazard_class)" }
      - { name: level, type: enum, source: input, description: "BASIC | ADVANCED | MASTER" }
      - { name: issued_at, type: datetime, source: input, description: "Issue timestamp" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry timestamp; cert valid iff revoked == false AND expires_at strictly greater than the comparison instant" }
      - { name: revoked, type: boolean, source: system, description: "Set true by revoke; immutable record otherwise", default: false }

  - name: Rehearsal
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id" }
      - { name: performer_id, type: string, source: input, description: "FK -> StuntPerformer.id" }
      - { name: facility, type: string, source: input, description: "Facility/stage name" }
      - { name: scheduled_start, type: datetime, source: input, description: "Rehearsal window start; must be strictly after current logical time" }
      - { name: scheduled_end, type: datetime, source: input, description: "Rehearsal window end; must be after scheduled_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "(scheduled_end - scheduled_start) in whole minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED | CANCELLED | VOIDED", default: SCHEDULED }
      - { name: void_reason, type: string, source: system, description: "Recorded on void-completion; null otherwise" }

  - name: SafetyMeeting
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id" }
      - { name: facility, type: string, source: input, description: "Meeting facility; buffered-overlap resource" }
      - { name: scheduled_start, type: datetime, source: input, description: "Meeting window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Meeting window end; must be after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_SESSION | COMPLETED | ADJOURNED", default: SCHEDULED }
      - { name: design_revision, type: integer, source: system, description: "StuntSequence.design_revision pinned at meeting creation; readiness requires a COMPLETED meeting whose design_revision equals the sequence's current design_revision" }
      - { name: chair_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who started the meeting; null until started" }

  - name: DepartmentSignoff
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> SafetyMeeting.id; rows fan out from meeting creation" }
      - { name: department, type: enum, source: system, description: "CAMERA | ELECTRIC | GRIP | STUNTS | MEDIC | FIRE_SAFETY; required set derived from sequence medic_standby_required and hazard_class" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | SIGNED_WITH_CONDITIONS | REFUSED", default: PENDING }
      - { name: signer_user_id, type: string, source: system, description: "X-User-ID of the signing DepartmentHead; null until decided" }
      - { name: conditions, type: string, source: system, description: "Non-empty conditions recorded when SIGNED_WITH_CONDITIONS; null otherwise" }
      - { name: refusal_reason, type: string, source: system, description: "Recorded on refuse; null otherwise" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision; null while PENDING" }

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: name, type: string, source: input, description: "Equipment name" }
      - { name: equipment_type, type: enum, source: input, description: "RIGGING | PYRO_DEVICE | VEHICLE | HARNESS | AIRBAG | CRANE" }
      - { name: serial_number, type: string, source: input, description: "Serial identifier" }
      - { name: inspection_interval_hours, type: integer, source: input, description: "Required re-inspection interval in hours; > 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | QUARANTINED | RETIRED", default: IN_SERVICE }
      - { name: registered_by_user_id, type: string, source: system, description: "X-User-ID of the registering StuntCoordinator; SoD anchor for inspections" }
      - { name: last_passed_inspection_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest Inspection with outcome PASSED or CONDITIONAL; null until first pass" }
      - { name: inspection_current, type: boolean, source: computed, description: "true iff last_passed_inspection_at is not null AND last_passed_inspection_at + inspection_interval_hours x 3600s is strictly greater than current logical time (see inspection_currency)" }

  - name: Inspection
    parent: null
    common_fields: false
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> EquipmentItem.id" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the EquipmentInspector; SoD anchor" }
      - { name: outcome, type: enum, source: input, description: "PASSED | CONDITIONAL | FAILED" }
      - { name: notes, type: string, source: input, description: "Inspector notes", default: "" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: permit_type, type: enum, source: input, description: "PYROTECHNICS | CRANE_OPERATION | AERIAL_WORK | FIRE_EFFECTS | WATER_WORK" }
      - { name: jurisdiction, type: string, source: input, description: "Issuing jurisdiction" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (inclusive); must be after valid_from" }
      - { name: status, type: enum, source: system, description: "APPLIED | GRANTED | DENIED | REVOKED", default: APPLIED }

  - name: PayAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id" }
      - { name: performer_id, type: string, source: input, description: "FK -> StuntPerformer.id; when X-User-Role is Performer it must equal X-User-ID" }
      - { name: adjustment_type, type: enum, source: input, description: "HAZARD_BUMP | STUNT_DOUBLE" }
      - { name: base_amount_cents, type: integer, source: input, description: "Base amount the bump applies to; > 0" }
      - { name: requested_pct, type: number, source: input, description: "Initial offered bump as a decimal fraction (e.g. 0.40)" }
      - { name: current_pct, type: number, source: system, description: "Pct of the most recent offer; equals requested_pct until first counter" }
      - { name: proposer_by, type: enum, source: system, description: "PERFORMER | COORDINATOR — which side created the adjustment" }
      - { name: last_offer_by, type: enum, source: system, description: "PERFORMER | COORDINATOR — which side made the most recent offer" }
      - { name: round_count, type: integer, source: system, description: "0 at creation; +1 per successful counter; a counter that would exceed MAX_ROUNDS (6) is rejected", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | AGREED | WITHDRAWN | EXPIRED | VOIDED", default: PROPOSED }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "base_amount_cents + round_half_up(base_amount_cents x requested_pct) + TAKE_BONUS_CENTS x 1 planned take (see adjustment_payout, provisional variant)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "base_amount_cents + round_half_up(base_amount_cents x current_pct), computed at agree; null until AGREED" }
      - { name: payable_amount_cents, type: integer, source: computed, description: "final_amount_cents + TAKE_BONUS_CENTS x completed take count of the sequence; null until AGREED, then updated on each execution completion (see adjustment_payout, final variant)" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id; optional — null for production-level incidents" }
      - { name: severity, type: enum, source: input, description: "NEAR_MISS | MINOR | SERIOUS | CRITICAL" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident occurred" }
      - { name: description, type: string, source: input, description: "Incident narrative" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the reporter" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_INVESTIGATION | CLOSED", default: REPORTED }
      - { name: corrective_action, type: string, source: system, description: "Required at close; null until CLOSED" }

  - name: StuntExecution
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id" }
      - { name: take_number, type: integer, source: input, description: "Take number; >= 1; unique per sequence across ALL executions regardless of status" }
      - { name: status, type: enum, source: system, description: "ATTEMPTED | COMPLETED | ABORTED", default: ATTEMPTED }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: abort_reason, type: string, source: system, description: "Recorded on abort; null otherwise" }
      - { name: safety_related, type: boolean, source: system, description: "Recorded on abort; when true an Incident is auto-created", default: false }

  - name: PostStuntReview
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: sequence_id, type: string, source: input, description: "FK -> StuntSequence.id" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who opened the review" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }
      - { name: outcome, type: enum, source: input, description: "ACCEPTED_AS_SHOT | RESHOOT_REQUIRED | SAFETY_DEFICIENCY — supplied at close" }
      - { name: findings, type: string, source: input, description: "Review findings — supplied at close" }

# =============================================================================
# §1.2 State Machine Table (13 machines)
# =============================================================================
state_machines:
  - entity: Production
    field: posture
    initial_state: SETUP
    terminal_states: [WRAPPED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /api/productions/{id}/activate"
        actor: ProductionExecutive
        preconditions:
          - "posture == SETUP (ERR_PRODUCTION_NOT_ACTIVE otherwise)"
          - "insurance_status in {FILED, ACKNOWLEDGED} (ERR_INSURANCE_NOT_FILED)"
        side_effects:
          - "Production.version +1"
      - from: ACTIVE
        to: STOPPED
        trigger: "POST /api/productions/{id}/stop, or system (Incident created with severity SERIOUS | CRITICAL)"
        actor: "SafetyOfficer | ProductionExecutive | system"
        preconditions:
          - "posture == ACTIVE (ERR_PRODUCTION_NOT_ACTIVE)"
        side_effects:
          - "stopped_at = current logical time; stop_reason = request reason or incident id"
          - "CASCADE link 1->2: every StuntSequence of this production in READY -> SAFETY_HOLD"
          - "CASCADE link 2->3: every StuntSequence that entered SAFETY_HOLD: its Rehearsals in SCHEDULED -> CANCELLED"
          - "CASCADE link 2->3: every SafetyMeeting of an affected sequence in SCHEDULED or IN_SESSION -> ADJOURNED"
          - "Production.version +1"
      - from: STOPPED
        to: ACTIVE
        trigger: "POST /api/productions/{id}/lift-stoppage"
        actor: ProductionExecutive
        preconditions:
          - "posture == STOPPED (ERR_PRODUCTION_NOT_STOPPED)"
          - "No Incident of this production with severity in {SERIOUS, CRITICAL} and status in {REPORTED, UNDER_INVESTIGATION} (ERR_SERIOUS_INCIDENTS_OPEN)"
          - "current logical time >= stopped_at + 86400 seconds (ERR_STOPPAGE_COOLDOWN); equality passes"
        side_effects:
          - "Sequences in SAFETY_HOLD remain SAFETY_HOLD; each must pass reverify-readiness individually"
          - "Production.version +1"
      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /api/productions/{id}/wrap"
        actor: ProductionExecutive
        preconditions:
          - "posture == ACTIVE (ERR_PRODUCTION_NOT_ACTIVE)"
          - "Every StuntSequence of this production in {REVIEWED, CANCELLED} (ERR_SEQUENCES_NOT_TERMINAL)"
        side_effects:
          - "Production.version +1"

  - entity: Production
    field: insurance_status
    initial_state: UNFILED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: UNFILED
        to: FILED
        trigger: "POST /api/productions/{id}/file-insurance"
        actor: ProductionExecutive
        preconditions:
          - "insurance_status == UNFILED (ERR_INSURANCE_INVALID_STATE)"
        side_effects:
          - "endorsement_premium_cents computed per insurance_endorsement_premium"
          - "Production.version +1"
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /api/productions/{id}/acknowledge-insurance"
        actor: ProductionExecutive
        preconditions:
          - "insurance_status == FILED (ERR_INSURANCE_INVALID_STATE)"
        side_effects:
          - "Production.version +1"
    note: "Parallel dimension: insurance_status evolves independently of posture (posture x insurance_status parallel state dimensions on one entity)."

  - entity: StuntSequence
    field: status
    initial_state: DRAFT
    terminal_states: [REVIEWED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DESIGN_LOCKED
        trigger: "POST /api/stunt-sequences/{id}/lock-design"
        actor: "StuntCoordinator (owner: X-User-ID == coordinator_user_id)"
        preconditions:
          - "status == DRAFT (ERR_SEQUENCE_INVALID_STATE)"
          - "Production.posture in {SETUP, ACTIVE} (ERR_PRODUCTION_NOT_ACTIVE)"
          - "At least one RiskAssessment of this sequence in APPROVED (ERR_SEQUENCE_INVALID_STATE)"
          - "board variant score of the latest APPROVED assessment < 26 (ERR_RISK_SCORE_ABOVE_THRESHOLD at >= 26)"
          - "Declared risk_category matches the screening band of that assessment (ERR_CATEGORY_SCORE_MISMATCH)"
        side_effects:
          - "current_assessment_id pinned to the latest APPROVED RiskAssessment (by created_at ASC tie-break: the most recently created APPROVED assessment)"
          - "board_score stored; required_rehearsal_count computed and stored; medic_standby_required computed"
          - "StuntSequence.version +1"
      - from: DESIGN_LOCKED
        to: READY
        trigger: "POST /api/stunt-sequences/{id}/mark-ready"
        actor: "StuntCoordinator (owner)"
        preconditions:
          - "status == DESIGN_LOCKED (ERR_SEQUENCE_INVALID_STATE)"
          - "Production.posture == ACTIVE (ERR_PRODUCTION_NOT_ACTIVE; ERR_PRODUCTION_STOPPED when STOPPED)"
          - "completed_rehearsal_count >= required_rehearsal_count (ERR_REHEARSAL_QUOTA_NOT_MET); exact equality passes"
          - "If medic_standby_required: the qualifying COMPLETED meeting (next check) must have its MEDIC signoff in {SIGNED, SIGNED_WITH_CONDITIONS} (ERR_MEDIC_STANDBY_NOT_CONFIRMED); evaluated before the meeting-satisfaction check"
          - "Exists a SafetyMeeting of this sequence with status COMPLETED and design_revision == current design_revision, all of whose DepartmentSignoffs are in {SIGNED, SIGNED_WITH_CONDITIONS} (ERR_MEETING_REQUIREMENT_UNSATISFIED)"
          - "Every id in required_equipment_ids: EquipmentItem.status == IN_SERVICE AND inspection_current == true (ERR_EQUIPMENT_NOT_READY)"
          - "For each required permit type (hazard mapping plus equipment mapping): exists a Permit of this production with status GRANTED, valid_from <= scheduled_execution_start AND valid_until >= scheduled_execution_end (ERR_PERMIT_MISSING_OR_WINDOW_MISMATCH)"
          - "If risk_category in {HIGH, CRITICAL}: Production.insurance_status == ACKNOWLEDGED (ERR_INSURANCE_NOT_ACKNOWLEDGED)"
        side_effects:
          - "StuntSequence.version +1"
      - from: READY
        to: SAFETY_HOLD
        trigger: "system (production stoppage; a required EquipmentItem -> QUARANTINED or RETIRED; a required Permit -> REVOKED; a new RiskAssessment APPROVED for this sequence)"
        actor: system
        preconditions: []
        side_effects:
          - "On production stoppage: this sequence's SCHEDULED Rehearsals -> CANCELLED; its SCHEDULED/IN_SESSION SafetyMeetings -> ADJOURNED"
          - "StuntSequence.version +1"
      - from: SAFETY_HOLD
        to: READY
        trigger: "POST /api/stunt-sequences/{id}/reverify-readiness"
        actor: "StuntCoordinator (owner)"
        preconditions:
          - "status == SAFETY_HOLD (ERR_SEQUENCE_INVALID_STATE)"
          - "Production.posture == ACTIVE (ERR_PRODUCTION_STOPPED when STOPPED)"
          - "All mark-ready gates re-evaluated against current state and current design_revision (same error ids as mark-ready)"
        side_effects:
          - "StuntSequence.version +1"
      - from: READY
        to: EXECUTED
        trigger: "system (first StuntExecution of this sequence -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "StuntSequence.version +1"
      - from: EXECUTED
        to: REVIEWED
        trigger: "system (PostStuntReview closed with outcome ACCEPTED_AS_SHOT)"
        actor: system
        preconditions: []
        side_effects:
          - "StuntSequence.version +1"
      - from: EXECUTED
        to: DESIGN_LOCKED
        trigger: "system (PostStuntReview closed with outcome RESHOOT_REQUIRED or SAFETY_DEFICIENCY)"
        actor: system
        preconditions: []
        side_effects:
          - "design_revision +1 (meetings/signoffs pinned to the old revision no longer satisfy readiness)"
          - "RESHOOT_REQUIRED: current_assessment_id retained"
          - "SAFETY_DEFICIENCY: current_assessment_id cleared and the previously pinned APPROVED RiskAssessment -> SUPERSEDED; a new RiskAssessment must be APPROVED and lock-design re-run before mark-ready"
          - "StuntSequence.version +1"
      - from: [DRAFT, DESIGN_LOCKED, READY, SAFETY_HOLD, EXECUTED]
        to: CANCELLED
        trigger: "POST /api/stunt-sequences/{id}/cancel"
        actor: "StuntCoordinator (owner) | ProductionExecutive"
        preconditions:
          - "status not in {REVIEWED, CANCELLED} (ERR_SEQUENCE_INVALID_STATE)"
        side_effects:
          - "Rehearsals of this sequence in SCHEDULED -> CANCELLED"
          - "SafetyMeetings of this sequence in SCHEDULED or IN_SESSION -> ADJOURNED"
          - "PayAdjustments of this sequence in {PROPOSED, COUNTERED} -> WITHDRAWN; in AGREED -> VOIDED (compensates committed_pay_cents; invariant I1)"
          - "StuntSequence.version +1"

  - entity: RiskAssessment
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/risk-assessments/{id}/submit"
        actor: "StuntCoordinator (owner: X-User-ID == assessor_user_id)"
        preconditions:
          - "status == DRAFT (ERR_ASSESSMENT_INVALID_STATE)"
          - "StuntSequence.status not in {EXECUTED, REVIEWED, CANCELLED} (ERR_SEQUENCE_INVALID_STATE)"
          - "Declared StuntSequence.risk_category matches the screening band of screening_score: LOW 1..5, MEDIUM 6..11, HIGH 12..19, CRITICAL 20..25 (ERR_CATEGORY_SCORE_MISMATCH)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/risk-assessments/{id}/approve"
        actor: SafetyOfficer
        preconditions:
          - "status == SUBMITTED (ERR_ASSESSMENT_INVALID_STATE)"
          - "SoD: approver X-User-ID != assessor_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "If another RiskAssessment of the same sequence is APPROVED: that assessment -> SUPERSEDED and this assessment's supersedes_assessment_id is set to it"
          - "StuntSequence.version +1 (drives OCC staleness for assessment-create and execution-create)"
          - "current_assessment_id re-pinned to the newly APPROVED assessment; board_score recomputed"
          - "If StuntSequence.status in {READY, SAFETY_HOLD}: readiness invalidated — StuntSequence -> SAFETY_HOLD"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/risk-assessments/{id}/reject"
        actor: SafetyOfficer
        preconditions:
          - "status == SUBMITTED (ERR_ASSESSMENT_INVALID_STATE)"
        side_effects:
          - "rejection_reason recorded"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/risk-assessments/{id}/revise"
        actor: "StuntCoordinator (owner)"
        preconditions:
          - "status == REJECTED (ERR_ASSESSMENT_INVALID_STATE)"
        side_effects:
          - "severity_rating / likelihood_rating / mitigation_notes replaced by payload values; screening_score recomputed; rejection_reason cleared"
    note: "Cyclic revision loop DRAFT -> SUBMITTED -> REJECTED -> DRAFT permits unlimited revision rounds; APPROVED -> SUPERSEDED is system-driven by the next approval."

  - entity: StuntPerformer
    field: status
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: QUALIFIED
        trigger: "system (first Certification with revoked == false and expires_at > current logical time is added)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: REGISTERED
        trigger: "system (last valid Certification expires per logical clock, or is revoked)"
        actor: system
        preconditions:
          - "Evaluated lazily: at read time and at every gated transition"
        side_effects: []
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /api/performers/{id}/suspend"
        actor: SafetyOfficer
        preconditions:
          - "status == QUALIFIED (ERR_PERFORMER_NOT_QUALIFIED)"
        side_effects: []
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /api/performers/{id}/reinstate"
        actor: SafetyOfficer
        preconditions:
          - "status == SUSPENDED (ERR_PERFORMER_NOT_QUALIFIED)"
          - "At least one Certification with revoked == false and expires_at > current logical time (ERR_NO_VALID_CERTIFICATION)"
        side_effects: []

  - entity: Rehearsal
    field: status
    initial_state: SCHEDULED
    terminal_states: [MISSED, CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/rehearsals/{id}/complete"
        actor: "StuntCoordinator (owner of the sequence)"
        preconditions:
          - "status == SCHEDULED (ERR_REHEARSAL_INVALID_STATE)"
          - "current logical time >= scheduled_start (ERR_REHEARSAL_TIME_GATE)"
          - "StuntPerformer.status == QUALIFIED at completion time (ERR_PERFORMER_NOT_QUALIFIED)"
        side_effects:
          - "StuntSequence.completed_rehearsal_count +1; StuntSequence.completed_rehearsal_minutes += duration_minutes"
          - "StuntPerformer.completed_rehearsal_minutes += duration_minutes"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /api/rehearsals/{id}/mark-missed"
        actor: "StuntCoordinator (owner of the sequence)"
        preconditions:
          - "status == SCHEDULED (ERR_REHEARSAL_INVALID_STATE)"
          - "current logical time > scheduled_end (ERR_REHEARSAL_TIME_GATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/rehearsals/{id}/cancel, or system (sequence cancelled; sequence READY -> SAFETY_HOLD cascade)"
        actor: "StuntCoordinator (owner) | system"
        preconditions:
          - "status == SCHEDULED (ERR_REHEARSAL_INVALID_STATE)"
        side_effects: []
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /api/rehearsals/{id}/void-completion"
        actor: SafetyOfficer
        preconditions:
          - "status == COMPLETED (ERR_REHEARSAL_INVALID_STATE)"
        side_effects:
          - "void_reason recorded"
          - "StuntSequence.completed_rehearsal_count -1; StuntSequence.completed_rehearsal_minutes -= duration_minutes"
          - "StuntPerformer.completed_rehearsal_minutes -= duration_minutes (compensating action; invariant I2)"

  - entity: SafetyMeeting
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ADJOURNED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /api/safety-meetings/{id}/start"
        actor: SafetyOfficer
        preconditions:
          - "status == SCHEDULED (ERR_MEETING_INVALID_STATE)"
          - "Production.posture == ACTIVE (ERR_PRODUCTION_STOPPED when STOPPED; ERR_PRODUCTION_NOT_ACTIVE when SETUP)"
        side_effects:
          - "chair_user_id recorded"
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /api/safety-meetings/{id}/complete"
        actor: SafetyOfficer
        preconditions:
          - "status == IN_SESSION (ERR_MEETING_INVALID_STATE)"
          - "Every DepartmentSignoff of this meeting in {SIGNED, SIGNED_WITH_CONDITIONS, REFUSED} — no PENDING (ERR_SIGNOFFS_PENDING)"
        side_effects: []
        note: "A meeting with any REFUSED signoff still completes, but does not satisfy the mark-ready meeting gate."
      - from: [SCHEDULED, IN_SESSION]
        to: ADJOURNED
        trigger: "POST /api/safety-meetings/{id}/adjourn, or system (production stoppage; sequence cancelled)"
        actor: "SafetyOfficer | system"
        preconditions:
          - "status in {SCHEDULED, IN_SESSION} (ERR_MEETING_INVALID_STATE)"
        side_effects: []

  - entity: DepartmentSignoff
    field: status
    initial_state: PENDING
    terminal_states: [SIGNED, SIGNED_WITH_CONDITIONS, REFUSED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /api/department-signoffs/{id}/sign (no conditions in payload)"
        actor: DepartmentHead
        preconditions:
          - "status == PENDING (ERR_SIGNOFF_ALREADY_DECIDED)"
          - "SafetyMeeting.status == IN_SESSION (ERR_MEETING_INVALID_STATE)"
          - "SoD: signer X-User-ID != StuntSequence.coordinator_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "signer_user_id and decided_at recorded"
      - from: PENDING
        to: SIGNED_WITH_CONDITIONS
        trigger: "POST /api/department-signoffs/{id}/sign (non-empty conditions in payload)"
        actor: DepartmentHead
        preconditions:
          - "Same as PENDING -> SIGNED"
        side_effects:
          - "conditions, signer_user_id and decided_at recorded"
      - from: PENDING
        to: REFUSED
        trigger: "POST /api/department-signoffs/{id}/refuse"
        actor: DepartmentHead
        preconditions:
          - "status == PENDING (ERR_SIGNOFF_ALREADY_DECIDED)"
          - "SafetyMeeting.status == IN_SESSION (ERR_MEETING_INVALID_STATE)"
          - "SoD: signer X-User-ID != StuntSequence.coordinator_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "refusal_reason, signer_user_id and decided_at recorded"

  - entity: EquipmentItem
    field: status
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "system (Inspection created with outcome FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 1->2: every StuntSequence in READY whose required_equipment_ids contains this equipment -> SAFETY_HOLD"
          - "CASCADE link 2->3: each such sequence's SCHEDULED Rehearsals -> CANCELLED"
      - from: QUARANTINED
        to: IN_SERVICE
        trigger: "system (Inspection created with outcome PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "last_passed_inspection_at updated (inspection_currency recomputed)"
      - from: [IN_SERVICE, QUARANTINED]
        to: RETIRED
        trigger: "POST /api/equipment/{id}/retire"
        actor: StuntCoordinator
        preconditions:
          - "status != RETIRED (ERR_EQUIPMENT_INVALID_STATE)"
        side_effects:
          - "Same READY -> SAFETY_HOLD cascade as quarantine for sequences requiring this equipment"

  - entity: Permit
    field: status
    initial_state: APPLIED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: APPLIED
        to: GRANTED
        trigger: "POST /api/permits/{id}/grant"
        actor: ProductionExecutive
        preconditions:
          - "status == APPLIED (ERR_PERMIT_INVALID_STATE)"
        side_effects: []
      - from: APPLIED
        to: DENIED
        trigger: "POST /api/permits/{id}/deny"
        actor: ProductionExecutive
        preconditions:
          - "status == APPLIED (ERR_PERMIT_INVALID_STATE)"
        side_effects: []
      - from: GRANTED
        to: REVOKED
        trigger: "POST /api/permits/{id}/revoke"
        actor: SafetyOfficer
        preconditions:
          - "status == GRANTED (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "CASCADE: every READY StuntSequence requiring this permit_type -> SAFETY_HOLD (with the rehearsal/meeting sub-cascade)"

  - entity: PayAdjustment
    field: status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, EXPIRED, VOIDED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/pay-adjustments/{id}/counter"
        actor: "Performer (self) | StuntCoordinator — the side that did NOT make the last offer"
        preconditions:
          - "status in {PROPOSED, COUNTERED} (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Caller side != last_offer_by (ERR_NOT_YOUR_TURN)"
          - "round_count < 6 (at 6 the counter is rejected with ERR_NEGOTIATION_EXHAUSTED AND the adjustment transitions to EXPIRED — the failed counter attempt exhausts the negotiation)"
          - "counter_pct passes hazard_bump_bounds (ERR_BUMP_OUT_OF_RANGE)"
        side_effects:
          - "current_pct = counter_pct; round_count +1; last_offer_by flips to caller side"
      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /api/pay-adjustments/{id}/counter"
        actor: "Performer (self) | StuntCoordinator — the side that did NOT make the last offer"
        preconditions:
          - "Same as PROPOSED -> COUNTERED (cyclic negotiation rounds)"
        side_effects:
          - "Same as PROPOSED -> COUNTERED"
      - from: [PROPOSED, COUNTERED]
        to: AGREED
        trigger: "POST /api/pay-adjustments/{id}/agree"
        actor: "Performer (self) | StuntCoordinator — the side that did NOT make the last offer"
        preconditions:
          - "status in {PROPOSED, COUNTERED} (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Caller side != last_offer_by (ERR_NOT_YOUR_TURN)"
          - "StuntPerformer.status == QUALIFIED (ERR_PERFORMER_NOT_QUALIFIED)"
          - "StuntSequence.status not in {EXECUTED, REVIEWED, CANCELLED} (ERR_SEQUENCE_INVALID_STATE)"
          - "budget_authority_check passes (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "final_amount_cents = base_amount_cents + round_half_up(base_amount_cents x current_pct)"
          - "payable_amount_cents = final_amount_cents (zero completed takes so far)"
          - "Production.committed_pay_cents += final_amount_cents (invariant I1)"
      - from: [PROPOSED, COUNTERED]
        to: WITHDRAWN
        trigger: "POST /api/pay-adjustments/{id}/withdraw, or system (sequence cancelled)"
        actor: "The proposer_by side (Performer self | StuntCoordinator) | system"
        preconditions:
          - "status in {PROPOSED, COUNTERED} (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Caller side == proposer_by (ERR_NOT_YOUR_TURN)"
        side_effects: []
      - from: COUNTERED
        to: EXPIRED
        trigger: "system (a counter attempted while round_count == 6)"
        actor: system
        preconditions: []
        side_effects:
          - "Negotiation terminated; no pay committed"
      - from: AGREED
        to: VOIDED
        trigger: "system (StuntSequence cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Production.committed_pay_cents -= final_amount_cents (compensating action; invariant I1)"

  - entity: Incident
    field: status
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/incidents/{id}/open-investigation"
        actor: SafetyOfficer
        preconditions:
          - "status == REPORTED (ERR_INCIDENT_INVALID_STATE)"
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: CLOSED
        trigger: "POST /api/incidents/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "status == UNDER_INVESTIGATION (ERR_INCIDENT_INVALID_STATE)"
          - "corrective_action non-empty (ERR_VALIDATION)"
        side_effects: []

  - entity: StuntExecution
    field: status
    initial_state: ATTEMPTED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: ATTEMPTED
        to: COMPLETED
        trigger: "POST /api/stunt-executions/{id}/complete"
        actor: "StuntCoordinator (owner of the sequence)"
        preconditions:
          - "status == ATTEMPTED (ERR_EXECUTION_INVALID_STATE)"
        side_effects:
          - "If this is the sequence's first COMPLETED execution: StuntSequence READY -> EXECUTED"
          - "For every PayAdjustment of this sequence in AGREED: payable_amount_cents = final_amount_cents + TAKE_BONUS_CENTS x (count of this sequence's COMPLETED executions)"
      - from: ATTEMPTED
        to: ABORTED
        trigger: "POST /api/stunt-executions/{id}/abort"
        actor: "StuntCoordinator (owner of the sequence)"
        preconditions:
          - "status == ATTEMPTED (ERR_EXECUTION_INVALID_STATE)"
          - "If safety_related == true: incident_severity must be present (ERR_VALIDATION)"
        side_effects:
          - "abort_reason and safety_related recorded"
          - "If safety_related: an Incident is auto-created (REPORTED, severity = incident_severity, sequence_id = this sequence); if severity in {SERIOUS, CRITICAL} the production-stoppage cascade fires (chain: abort -> Incident -> STOPPED -> SAFETY_HOLD)"

  - entity: PostStuntReview
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/post-stunt-reviews/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "status == OPEN (ERR_REVIEW_INVALID_STATE)"
        side_effects:
          - "outcome and findings recorded"
          - "ACCEPTED_AS_SHOT: StuntSequence EXECUTED -> REVIEWED"
          - "RESHOOT_REQUIRED: StuntSequence EXECUTED -> DESIGN_LOCKED, design_revision +1"
          - "SAFETY_DEFICIENCY: StuntSequence EXECUTED -> DESIGN_LOCKED, design_revision +1, current_assessment_id cleared, and the previously pinned APPROVED RiskAssessment -> SUPERSEDED (a new assessment must be approved before re-lock)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: risk-assessment-create-stale-sequence
    parent_entity: StuntSequence
    write_endpoint: "POST /api/risk-assessments"
    occ_field: "expected_sequence_version"
    description: |
      Creating a RiskAssessment against a StuntSequence whose version has advanced
      since the client last observed it is rejected. A new assessment, once approved,
      supersedes the currently pinned one, so creating from a stale sequence view
      risks superseding an assessment the client never saw. Rejection is purely on
      the stale version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: execution-create-stale-sequence
    parent_entity: StuntSequence
    write_endpoint: "POST /api/stunt-executions"
    occ_field: "expected_sequence_version"
    description: |
      Attempting a take against a StuntSequence whose version has advanced since the
      coordinator last observed it is rejected. Between the coordinator's readiness
      read and the take attempt, another writer may have created a superseding risk
      assessment (which bumps sequence.version) while the sequence legitimately
      remains READY; the stale version check rejects the take.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: production-budget-amend-stale-version
    parent_entity: Production
    write_endpoint: "PATCH /api/productions/{id}/budget"
    occ_field: "expected_production_version"
    description: |
      Amending a Production's budget against a version older than the current one is
      rejected. Budget amendments legitimately supersede one another while posture
      stays unchanged, so only the version check distinguishes a stale amendment.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (9 rules)
# =============================================================================
calculations:
  - name: risk_score
    trigger: "screening variant at RiskAssessment create/revise; board variant at StuntSequence lock-design"
    algorithm: weighted_scoring
    formula: |
      screening_score = severity_rating * likelihood_rating            # integer 1..25
      board_score     = severity_rating * likelihood_rating
                        + HAZARD_WEIGHT[hazard_class]
                        + (mitigation_notes non-empty ? MITIGATION_CREDIT : 0)
      Screening bands (category consistency at submit/lock):
        LOW 1..5 | MEDIUM 6..11 | HIGH 12..19 | CRITICAL 20..25
      Lock threshold: board_score >= 26 -> ERR_RISK_SCORE_ABOVE_THRESHOLD; <= 25 locks.
    input_set: "The latest APPROVED RiskAssessment of the sequence (board variant); the assessment being created/revised (screening variant)"
    constants:
      HAZARD_WEIGHT: { PYRO: 6, FIRE: 5, HEIGHT: 4, VEHICLE: 4, AERIAL: 4, WATER: 3, FIGHT: 2 }
      MITIGATION_CREDIT: -3
      LOCK_THRESHOLD: 26
    precision: "integer arithmetic, no rounding"
    variants:
      - name: screening
        when: "RiskAssessment create/revise; category-band consistency check"
        difference: "Pure severity x likelihood with no hazard weight or mitigation credit"
      - name: board
        when: "StuntSequence lock-design gate and stored board_score"
        difference: "Adds hazard-class weight and mitigation credit; identical severity/likelihood can pass screening yet fail the lock threshold (e.g. 3x4 VEHICLE: screening 12 vs board 16)"

  - name: adjustment_payout
    trigger: "provisional variant at PayAdjustment creation; final variant at agree and on each execution COMPLETED"
    algorithm: aggregation
    formula: |
      provisional_estimate_cents = base_amount_cents
                                   + round_half_up(base_amount_cents * requested_pct)
                                   + TAKE_BONUS_CENTS * 1            # exactly one planned take
      final_amount_cents         = base_amount_cents
                                   + round_half_up(base_amount_cents * current_pct)
      payable_amount_cents       = final_amount_cents
                                   + TAKE_BONUS_CENTS * completed_take_count
      where completed_take_count = count of the sequence's StuntExecutions in COMPLETED status
      Evaluation order: bump is rounded first (round_half_up to whole cents), then added to base.
    input_set: "The PayAdjustment itself; the sequence's COMPLETED StuntExecutions for the payable variant"
    constants:
      TAKE_BONUS_CENTS: 50000
    precision: "whole cents, round_half_up per line before summation"
    variants:
      - name: provisional_estimate
        when: "At creation; assumes exactly one planned take and the requested_pct"
        difference: "Uses requested_pct and a fixed single planned take"
      - name: final_settlement
        when: "At agree (final_amount_cents) and on each execution completion (payable_amount_cents)"
        difference: "Uses negotiated current_pct and the ACTUAL completed take count; identical base/pct data yields a different amount once more than one take completes (e.g. base 200000, pct 0.40: provisional 330000 vs payable 380000 after 2 takes)"

  - name: hazard_bump_bounds
    trigger: "PayAdjustment create (requested_pct) and counter (counter_pct)"
    algorithm: tiered_pricing
    formula: |
      bump_cents  = round_half_up(base_amount_cents * pct)
      floor_cents = union_status == SAG_AFTRA
                    ? max(round_half_up(0.10 * base_amount_cents), UNION_FLOOR_CENTS)
                    : 0
      cap_cents   = round_half_up(base_amount_cents * CATEGORY_CAP_PCT[risk_category])
                    + (requires_special_equipment ? SPECIAL_EQUIPMENT_CAP_SURCHARGE_CENTS : 0)
      requires_special_equipment = any required_equipment_ids element whose
                                   equipment_type in {PYRO_DEVICE, CRANE}
      Valid iff floor_cents <= bump_cents <= cap_cents, else ERR_BUMP_OUT_OF_RANGE.
    input_set: "The PayAdjustment payload, the sequence's risk_category, the performer's union_status, the sequence's required equipment types"
    constants:
      CATEGORY_CAP_PCT: { LOW: 0.15, MEDIUM: 0.35, HIGH: 0.60, CRITICAL: 1.00 }
      UNION_FLOOR_CENTS: 15000
      SPECIAL_EQUIPMENT_CAP_SURCHARGE_CENTS: 25000
    precision: "whole cents, round_half_up"

  - name: production_cost_rollup
    trigger: "Production.committed_pay_cents maintenance (agree / void) and GET /api/productions/{id}/summary"
    algorithm: aggregation
    formula: |
      Per adjustment line: line_cents = round_half_up(base_amount_cents * (1 + current_pct))
      ROUNDING ORDER IS PINNED: round each line to whole cents FIRST (round_half_up),
      THEN sum the rounded lines. Never sum unrounded values and round once.
      committed_pay_cents = SUM(line_cents) over this production's PayAdjustments in AGREED
      open_negotiation_exposure_cents = SUM(line_cents) over PROPOSED/COUNTERED adjustments
      estimated_total_cost_cents = committed_pay_cents
                                   + open_negotiation_exposure_cents
                                   + endorsement_premium_cents
    input_set: "All PayAdjustments of the Production in the stated status sets; Production.endorsement_premium_cents"
    precision: "whole cents, round_half_up per line THEN sum (per-line rounding is observable: two lines of 133507 sum to 267014 where sum-then-round would yield 267013)"

  - name: budget_authority_check
    trigger: "PayAdjustment agree"
    algorithm: constraint_propagation
    formula: |
      The reserve depends on committed pay, which the agreement itself changes — the
      evaluation order is pinned to break the apparent circle:
        1. committed_pre = Production.committed_pay_cents BEFORE this agreement
        2. reserve_cents = round_half_up((total_budget_cents - committed_pre) * RESERVE_PCT)
        3. available_cents = total_budget_cents - committed_pre - reserve_cents
        4. new_line_cents = round_half_up(base_amount_cents * (1 + current_pct))
        5. Require new_line_cents <= available_cents (equality passes), else ERR_BUDGET_EXCEEDED
    input_set: "The Production, the PayAdjustment being agreed"
    constants:
      RESERVE_PCT: 0.10
    precision: "whole cents, round_half_up"

  - name: required_rehearsal_count
    trigger: "StuntSequence lock-design"
    algorithm: threshold
    formula: |
      base_quota = QUOTA_BY_CATEGORY[risk_category]      # LOW 1, MEDIUM 2, HIGH 3, CRITICAL 4
      required_rehearsal_count = base_quota
                                 + (1 if any required_equipment_ids element with
                                    equipment_type in {PYRO_DEVICE, CRANE} else 0)
      mark-ready gate: completed_rehearsal_count >= required_rehearsal_count (equality passes)
    input_set: "The StuntSequence (risk_category, required equipment types)"
    constants:
      QUOTA_BY_CATEGORY: { LOW: 1, MEDIUM: 2, HIGH: 3, CRITICAL: 4 }

  - name: inspection_currency
    trigger: "EquipmentItem read, mark-ready, reverify-readiness, execution create"
    algorithm: chronological
    formula: |
      last_passed_inspection_at = inspected_at of the most recent Inspection with
                                  outcome in {PASSED, CONDITIONAL} (chronological by
                                  inspected_at, tie-break created_at ASC), null if none
      inspection_current = last_passed_inspection_at is not null
                           AND last_passed_inspection_at + inspection_interval_hours*3600s
                               > current logical time
      At exact equality (now == last_passed + interval) the inspection is STALE (strict >).
      A FAILED inspection does not update last_passed_inspection_at; it quarantines instead.
    input_set: "All Inspections of the EquipmentItem"

  - name: performer_certification_validity
    trigger: "Performer reads, rehearsal create/complete, reinstate, pay-adjustment create/agree"
    algorithm: threshold
    formula: |
      A Certification is VALID iff revoked == false AND expires_at > comparison instant
      (strict; equality means expired).
      Comparison instant: current logical time for status derivation and agree;
      the rehearsal's scheduled_start for rehearsal scheduling (discipline must equal
      the sequence's hazard_class); current logical time for rehearsal completion.
      Performer effective status: SUSPENDED if stored SUSPENDED; else QUALIFIED if at
      least one VALID Certification exists; else REGISTERED.
    input_set: "All Certifications of the StuntPerformer"

  - name: overlap_checks
    trigger: "Rehearsal create; SafetyMeeting create"
    algorithm: interval_merge
    formula: |
      Rehearsal (resource = performer_id; half-open intervals, zero buffer):
        conflict iff existing.status in {SCHEDULED, COMPLETED}
          AND new.scheduled_start < existing.scheduled_end
          AND existing.scheduled_start < new.scheduled_end
        Adjacency (new.start == existing.end) is ALLOWED. -> ERR_REHEARSAL_CONFLICT
      SafetyMeeting (resource = facility; symmetric 30-minute buffer):
        conflict iff existing.status in {SCHEDULED, IN_SESSION}
          AND new.scheduled_start < existing.scheduled_end + 1800s
          AND existing.scheduled_start < new.scheduled_end + 1800s
        A gap of exactly 1800 seconds is ALLOWED (strict <). -> ERR_FACILITY_BUFFER_CONFLICT
    input_set: "Rehearsals of the same performer (all sequences of the production); SafetyMeetings of the same facility (all sequences of the production)"
    constants:
      MEETING_FACILITY_BUFFER_SECONDS: 1800

  - name: insurance_endorsement_premium
    trigger: "POST /api/productions/{id}/file-insurance"
    algorithm: tiered_pricing
    formula: |
      endorsement_premium_cents = round_half_up(declared_exposure_cents * rate)
      rate = 0.02 if declared_exposure_cents <= TIER1_MAX
             0.03 if TIER1_MAX < declared_exposure_cents <= TIER2_MAX
             0.04 otherwise
      Tier boundaries are inclusive downward: exactly TIER1_MAX prices at 2%.
    input_set: "The Production's declared_exposure_cents at filing"
    constants:
      TIER1_MAX: 100000000
      TIER2_MAX: 500000000
    precision: "whole cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.7; for Performer-role writes, body performer_id must equal X-User-ID (ownership)"
    error_id: "ERR_FORBIDDEN_ROLE | ERR_NOT_RESOURCE_OWNER"
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id in the path and every entity id in the body exists; ids validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PRODUCTION_NOT_FOUND, ERR_SEQUENCE_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_PERFORMER_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_REHEARSAL_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_SIGNOFF_NOT_FOUND, ERR_EQUIPMENT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_ADJUSTMENT_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_EXECUTION_NOT_FOUND, ERR_REVIEW_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with entity ids
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version (only on endpoints declaring the field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/risk-assessments, POST /api/stunt-executions, PATCH /api/productions/{id}/budget"
  - priority: 5
    category: state
    check: "Production posture gate. Allowed in SETUP or ACTIVE: sequence create/lock-design/cancel, risk-assessment create/submit/approve/reject/revise, performer create, certification create/revoke, equipment create/retire, permit apply/grant/deny, pay-adjustment create/counter/agree/withdraw, budget amend, insurance file/acknowledge, incident report (ACTIVE or STOPPED only). Require ACTIVE and not STOPPED: rehearsal create/complete/mark-missed/cancel/void-completion, safety-meeting create/start/complete/adjourn, signoff sign/refuse, inspection create, execution create/complete/abort, mark-ready/reverify-readiness, review create/close. lift-stoppage requires STOPPED."
    error_id: "ERR_PRODUCTION_NOT_ACTIVE | ERR_PRODUCTION_STOPPED | ERR_PRODUCTION_NOT_STOPPED | ERR_INSURANCE_NOT_FILED"
    http_status: 409
    applies_to: posture-gated endpoints
  - priority: 6
    category: state
    check: "Entity transition preconditions (per §1.2), including negotiation turn state (caller side must differ from last_offer_by) and round cap"
    error_id: "ERR_SEQUENCE_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE | ERR_PERFORMER_NOT_QUALIFIED | ERR_NO_VALID_CERTIFICATION | ERR_REHEARSAL_INVALID_STATE | ERR_MEETING_INVALID_STATE | ERR_SIGNOFF_ALREADY_DECIDED | ERR_PERMIT_INVALID_STATE | ERR_ADJUSTMENT_INVALID_STATE | ERR_NOT_YOUR_TURN | ERR_NEGOTIATION_EXHAUSTED | ERR_INCIDENT_INVALID_STATE | ERR_EXECUTION_INVALID_STATE | ERR_REVIEW_INVALID_STATE | ERR_EQUIPMENT_INVALID_STATE | ERR_INSURANCE_INVALID_STATE"
    http_status: 409
    applies_to: state transition endpoints
  - priority: 7
    category: business_safety
    check: "Certification: rehearsal scheduling requires the performer to hold a VALID certification whose discipline equals the sequence's hazard_class (validity vs scheduled_start); completion re-checks performer QUALIFIED"
    error_id: ERR_CERTIFICATION_MISSING_OR_EXPIRED
    http_status: 422
    applies_to: "POST /api/rehearsals, POST /api/rehearsals/{id}/complete"
  - priority: 8
    category: business_safety
    check: "Risk gates: screening band must equal declared risk_category at submit/lock; board_score must be < 26 at lock-design"
    error_id: "ERR_CATEGORY_SCORE_MISMATCH | ERR_RISK_SCORE_ABOVE_THRESHOLD"
    http_status: 422
    applies_to: "POST /api/risk-assessments/{id}/submit, POST /api/stunt-sequences/{id}/lock-design"
  - priority: 9
    category: business_safety
    check: "Readiness gates at mark-ready / reverify-readiness (evaluated in this order): rehearsal quota, medic standby, meeting+signoff satisfaction, equipment readiness, permit coverage, insurance acknowledgement"
    error_id: "ERR_REHEARSAL_QUOTA_NOT_MET | ERR_MEETING_REQUIREMENT_UNSATISFIED | ERR_MEDIC_STANDBY_NOT_CONFIRMED | ERR_EQUIPMENT_NOT_READY | ERR_PERMIT_MISSING_OR_WINDOW_MISMATCH | ERR_INSURANCE_NOT_ACKNOWLEDGED"
    http_status: 422
    applies_to: "POST /api/stunt-sequences/{id}/mark-ready, POST /api/stunt-sequences/{id}/reverify-readiness"
  - priority: 10
    category: business_constraint
    check: "Overlap and uniqueness: performer rehearsal overlap (half-open), facility buffered overlap (30 min), take_number unique per sequence, one OPEN review per sequence, one open negotiation per (sequence, performer), time ranges well-formed"
    error_id: "ERR_REHEARSAL_CONFLICT | ERR_FACILITY_BUFFER_CONFLICT | ERR_DUPLICATE_TAKE_NUMBER | ERR_REVIEW_ALREADY_OPEN | ERR_NEGOTIATION_ALREADY_OPEN | ERR_INVALID_TIME_RANGE"
    http_status: 409
    applies_to: "POST /api/rehearsals, POST /api/safety-meetings, POST /api/stunt-executions, POST /api/post-stunt-reviews, POST /api/pay-adjustments, create endpoints with time windows"
  - priority: 11
    category: business_referential
    check: "Cross-production integrity: every body FK must belong to the same Production as the primary reference (sequence, equipment elements, performer); segregation of duties: approver != assessor, signoff signer != sequence coordinator, inspector != equipment registrar"
    error_id: "ERR_CROSS_PRODUCTION_REFERENCE | ERR_SEGREGATION_OF_DUTIES_VIOLATION"
    http_status: 422
    applies_to: "create endpoints with multiple FKs; POST /api/risk-assessments/{id}/approve; POST /api/department-signoffs/{id}/sign|refuse; POST /api/inspections"
  - priority: 12
    category: business_temporal
    check: "Clock-relative rules: rehearsal scheduled_start strictly in the future at create; completion not before start, missed not before end; execution within permit validity window (inclusive); stoppage lift cooldown 86400s (>= passes); clock set strictly forward"
    error_id: "ERR_REHEARSAL_IN_PAST | ERR_REHEARSAL_TIME_GATE | ERR_PERMIT_MISSING_OR_WINDOW_MISMATCH | ERR_STOPPAGE_COOLDOWN | ERR_CLOCK_NOT_FORWARD"
    http_status: 422
    applies_to: "POST /api/rehearsals, POST /api/rehearsals/{id}/complete, POST /api/rehearsals/{id}/mark-missed, POST /api/stunt-executions, POST /api/productions/{id}/lift-stoppage, POST /api/_clock/set_current_utc"
  - priority: 13
    category: business_fiscal
    check: "Pay discipline: requested/counter pct within hazard_bump_bounds"
    error_id: ERR_BUMP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /api/pay-adjustments, POST /api/pay-adjustments/{id}/counter"
  - priority: 14
    category: business_fiscal
    check: "budget_authority_check at agree (reserve computed on pre-request committed pay; new line must be <= available)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /api/pay-adjustments/{id}/agree"

# =============================================================================
# §1.5 API Endpoint Table (85 endpoints; flat topology, /api prefix)
# =============================================================================
endpoints:
  # --- Clock (test-driving; logical clock default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; to_iso8601 must be strictly greater than the current logical time (ERR_CLOCK_NOT_FORWARD)."
    roles: [ProductionExecutive]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy clock-driven derivations re-evaluate (performer qualification, inspection currency, permit windows)"]

  # --- Production ---
  - method: POST
    path: "/api/productions"
    description: "Create a production"
    roles: [ProductionExecutive]
    code: 201
    input: [name, total_budget_cents]
    output: Production
    side_effects: ["posture=SETUP, insurance_status=UNFILED, committed_pay_cents=0, version=1"]
  - method: GET
    path: "/api/productions"
    description: "List productions (paginated)"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Production[]"
    side_effects: []
  - method: GET
    path: "/api/productions/{id}"
    description: "Get a production"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: Production
    side_effects: []
  - method: GET
    path: "/api/productions/{id}/summary"
    description: "Computed read: committed pay, open negotiation exposure, endorsement premium, estimated total cost (production_cost_rollup)"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: { committed_pay_cents: integer, open_negotiation_exposure_cents: integer, endorsement_premium_cents: integer, estimated_total_cost_cents: integer }
    side_effects: []
  - method: PATCH
    path: "/api/productions/{id}/budget"
    description: "Amend total budget (OCC-guarded; amendments legitimately supersede one another)"
    roles: [ProductionExecutive]
    code: 200
    input: [total_budget_cents, expected_production_version]
    output: Production
    side_effects: ["increments Production.version by 1"]
  - method: POST
    path: "/api/productions/{id}/file-insurance"
    description: "File insurance notification with the carrier; computes endorsement premium"
    roles: [ProductionExecutive]
    code: 200
    input: [declared_exposure_cents]
    output: Production
    side_effects: ["insurance_status UNFILED -> FILED", "endorsement_premium_cents per insurance_endorsement_premium", "increments Production.version by 1"]
  - method: POST
    path: "/api/productions/{id}/acknowledge-insurance"
    description: "Record carrier acknowledgement"
    roles: [ProductionExecutive]
    code: 200
    input: []
    output: Production
    side_effects: ["insurance_status FILED -> ACKNOWLEDGED", "increments Production.version by 1"]
  - method: POST
    path: "/api/productions/{id}/activate"
    description: "Activate production (requires insurance FILED or ACKNOWLEDGED)"
    roles: [ProductionExecutive]
    code: 200
    input: []
    output: Production
    side_effects: ["posture SETUP -> ACTIVE", "increments Production.version by 1"]
  - method: POST
    path: "/api/productions/{id}/stop"
    description: "Manual production stoppage (same cascade as serious-incident stoppage)"
    roles: [SafetyOfficer, ProductionExecutive]
    code: 200
    input: [reason]
    output: Production
    side_effects: ["posture ACTIVE -> STOPPED", "stopped_at/stop_reason recorded", "READY sequences -> SAFETY_HOLD", "their SCHEDULED rehearsals -> CANCELLED", "their SCHEDULED/IN_SESSION meetings -> ADJOURNED", "increments Production.version by 1"]
  - method: POST
    path: "/api/productions/{id}/lift-stoppage"
    description: "Lift stoppage (requires no open SERIOUS/CRITICAL incidents and 86400s cooldown)"
    roles: [ProductionExecutive]
    code: 200
    input: []
    output: Production
    side_effects: ["posture STOPPED -> ACTIVE", "increments Production.version by 1"]
  - method: POST
    path: "/api/productions/{id}/wrap"
    description: "Wrap production (terminal; all sequences must be REVIEWED or CANCELLED)"
    roles: [ProductionExecutive]
    code: 200
    input: []
    output: Production
    side_effects: ["posture ACTIVE -> WRAPPED", "increments Production.version by 1"]

  # --- StuntSequence ---
  - method: POST
    path: "/api/stunt-sequences"
    description: "Create a stunt sequence (DRAFT)"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, name, hazard_class, risk_category, scheduled_execution_start, scheduled_execution_end, required_equipment_ids]
    output: StuntSequence
    side_effects: ["status=DRAFT, design_revision=1, coordinator_user_id=X-User-ID, counters=0"]
  - method: GET
    path: "/api/stunt-sequences"
    description: "List sequences; filterable by production_id, status, hazard_class, required_equipment_ids (membership)"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "status?", "hazard_class?", "required_equipment_ids?", "limit?", "offset?"]
    output: "StuntSequence[]"
    side_effects: []
  - method: GET
    path: "/api/stunt-sequences/{id}"
    description: "Get a sequence"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: StuntSequence
    side_effects: []
  - method: POST
    path: "/api/stunt-sequences/{id}/lock-design"
    description: "Lock design: pins latest APPROVED assessment, computes board_score, quota, medic requirement"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: StuntSequence
    side_effects: ["status DRAFT -> DESIGN_LOCKED", "current_assessment_id pinned", "required_rehearsal_count stored", "increments StuntSequence.version by 1"]
  - method: POST
    path: "/api/stunt-sequences/{id}/mark-ready"
    description: "Run the full readiness gate and move DESIGN_LOCKED -> READY"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: StuntSequence
    side_effects: ["status DESIGN_LOCKED -> READY", "increments StuntSequence.version by 1"]
  - method: POST
    path: "/api/stunt-sequences/{id}/reverify-readiness"
    description: "Re-run readiness gates from SAFETY_HOLD -> READY"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: StuntSequence
    side_effects: ["status SAFETY_HOLD -> READY", "increments StuntSequence.version by 1"]
  - method: POST
    path: "/api/stunt-sequences/{id}/cancel"
    description: "Cancel a non-terminal sequence (cascades to rehearsals, meetings, pay adjustments)"
    roles: [StuntCoordinator, ProductionExecutive]
    code: 200
    input: ["reason?"]
    output: StuntSequence
    side_effects: ["status -> CANCELLED", "SCHEDULED rehearsals -> CANCELLED", "SCHEDULED/IN_SESSION meetings -> ADJOURNED", "open adjustments -> WITHDRAWN, AGREED -> VOIDED with committed_pay_cents compensation", "increments StuntSequence.version by 1"]

  # --- RiskAssessment ---
  - method: POST
    path: "/api/risk-assessments"
    description: "Create a risk assessment (DRAFT) for a sequence; OCC-guarded because approval supersedes the pinned assessment"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, sequence_id, severity_rating, likelihood_rating, "mitigation_notes?", expected_sequence_version]
    output: RiskAssessment
    side_effects: ["status=DRAFT, screening_score computed", "increments StuntSequence.version by 1"]
  - method: GET
    path: "/api/risk-assessments"
    description: "List risk assessments; filterable by production_id, sequence_id, status, supersedes_assessment_id"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "status?", "supersedes_assessment_id?", "limit?", "offset?"]
    output: "RiskAssessment[]"
    side_effects: []
  - method: GET
    path: "/api/risk-assessments/{id}"
    description: "Get a risk assessment"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []
  - method: POST
    path: "/api/risk-assessments/{id}/submit"
    description: "Submit for review (screening band must match declared risk_category)"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: ["status DRAFT -> SUBMITTED"]
  - method: POST
    path: "/api/risk-assessments/{id}/approve"
    description: "Approve (SafetyOfficer; SoD: approver != assessor; supersedes prior APPROVED; may invalidate readiness)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: ["status SUBMITTED -> APPROVED", "prior APPROVED -> SUPERSEDED with supersedes_assessment_id set", "increments StuntSequence.version by 1", "READY/SAFETY_HOLD sequence -> SAFETY_HOLD"]
  - method: POST
    path: "/api/risk-assessments/{id}/reject"
    description: "Reject with reason"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: RiskAssessment
    side_effects: ["status SUBMITTED -> REJECTED", "rejection_reason recorded"]
  - method: POST
    path: "/api/risk-assessments/{id}/revise"
    description: "Revise a rejected assessment back to DRAFT with new ratings (revision loop)"
    roles: [StuntCoordinator]
    code: 200
    input: [severity_rating, likelihood_rating, "mitigation_notes?"]
    output: RiskAssessment
    side_effects: ["status REJECTED -> DRAFT", "screening_score recomputed", "rejection_reason cleared"]

  # --- StuntPerformer ---
  - method: POST
    path: "/api/performers"
    description: "Register a stunt performer (REGISTERED)"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, first_name, last_name, base_day_rate_cents, union_status]
    output: StuntPerformer
    side_effects: ["status=REGISTERED, completed_rehearsal_minutes=0"]
  - method: GET
    path: "/api/performers"
    description: "List performers; filterable by production_id, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: "StuntPerformer[]"
    side_effects: []
  - method: GET
    path: "/api/performers/{id}"
    description: "Get a performer"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: StuntPerformer
    side_effects: []
  - method: POST
    path: "/api/performers/{id}/suspend"
    description: "Suspend a QUALIFIED performer"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: StuntPerformer
    side_effects: ["status QUALIFIED -> SUSPENDED"]
  - method: POST
    path: "/api/performers/{id}/reinstate"
    description: "Reinstate a SUSPENDED performer (requires a valid certification)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: StuntPerformer
    side_effects: ["status SUSPENDED -> QUALIFIED"]

  # --- Certification ---
  - method: POST
    path: "/api/certifications"
    description: "Add a certification to a performer (immutable record)"
    roles: [StuntCoordinator]
    code: 201
    input: [performer_id, discipline, level, issued_at, expires_at]
    output: Certification
    side_effects: ["If first valid certification and performer REGISTERED: performer -> QUALIFIED"]
  - method: GET
    path: "/api/certifications"
    description: "List certifications; filterable by performer_id, discipline"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["performer_id?", "discipline?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []
  - method: GET
    path: "/api/certifications/{id}"
    description: "Get a certification"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: POST
    path: "/api/certifications/{id}/revoke"
    description: "Revoke a certification (performer may lose QUALIFIED)"
    roles: [SafetyOfficer]
    code: 200
    input: ["reason?"]
    output: Certification
    side_effects: ["revoked=true", "If no valid certification remains and performer QUALIFIED: performer -> REGISTERED"]

  # --- Rehearsal ---
  - method: POST
    path: "/api/rehearsals"
    description: "Schedule a rehearsal (performer overlap check, certification discipline check, future-start check)"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, sequence_id, performer_id, facility, scheduled_start, scheduled_end]
    output: Rehearsal
    side_effects: ["status=SCHEDULED, duration_minutes computed"]
  - method: GET
    path: "/api/rehearsals"
    description: "List rehearsals; filterable by production_id, sequence_id, performer_id, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "performer_id?", "status?", "limit?", "offset?"]
    output: "Rehearsal[]"
    side_effects: []
  - method: GET
    path: "/api/rehearsals/{id}"
    description: "Get a rehearsal"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: Rehearsal
    side_effects: []
  - method: POST
    path: "/api/rehearsals/{id}/complete"
    description: "Mark rehearsal completed (not before scheduled_start; performer must be QUALIFIED)"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: Rehearsal
    side_effects: ["status SCHEDULED -> COMPLETED", "sequence and performer completed counters +duration"]
  - method: POST
    path: "/api/rehearsals/{id}/mark-missed"
    description: "Mark rehearsal missed (only after scheduled_end has passed)"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: Rehearsal
    side_effects: ["status SCHEDULED -> MISSED"]
  - method: POST
    path: "/api/rehearsals/{id}/cancel"
    description: "Cancel a scheduled rehearsal"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: Rehearsal
    side_effects: ["status SCHEDULED -> CANCELLED"]
  - method: POST
    path: "/api/rehearsals/{id}/void-completion"
    description: "Void a COMPLETED rehearsal (compensating correction; decrements counters)"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: Rehearsal
    side_effects: ["status COMPLETED -> VOIDED", "sequence and performer completed counters -duration (invariant I2)"]

  # --- SafetyMeeting ---
  - method: POST
    path: "/api/safety-meetings"
    description: "Schedule a safety meeting; fans out PENDING DepartmentSignoffs for the required department set; pins design_revision"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, sequence_id, facility, scheduled_start, scheduled_end]
    output: SafetyMeeting
    side_effects: ["status=SCHEDULED", "design_revision = sequence.design_revision", "PENDING DepartmentSignoff rows created: base {CAMERA, ELECTRIC, GRIP, STUNTS} + MEDIC if medic_standby_required + FIRE_SAFETY if hazard_class in {FIRE, PYRO}"]
  - method: GET
    path: "/api/safety-meetings"
    description: "List safety meetings; filterable by production_id, sequence_id, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "status?", "limit?", "offset?"]
    output: "SafetyMeeting[]"
    side_effects: []
  - method: GET
    path: "/api/safety-meetings/{id}"
    description: "Get a safety meeting"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: SafetyMeeting
    side_effects: []
  - method: POST
    path: "/api/safety-meetings/{id}/start"
    description: "Start the meeting (SafetyOfficer chairs)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyMeeting
    side_effects: ["status SCHEDULED -> IN_SESSION", "chair_user_id recorded"]
  - method: POST
    path: "/api/safety-meetings/{id}/complete"
    description: "Complete the meeting (no signoff may remain PENDING)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyMeeting
    side_effects: ["status IN_SESSION -> COMPLETED"]
  - method: POST
    path: "/api/safety-meetings/{id}/adjourn"
    description: "Adjourn a scheduled or in-session meeting"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyMeeting
    side_effects: ["status -> ADJOURNED"]

  # --- DepartmentSignoff ---
  - method: GET
    path: "/api/department-signoffs"
    description: "List signoffs; filterable by meeting_id, department, status; sorted created_at ASC then department ASC"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["meeting_id?", "department?", "status?", "limit?", "offset?"]
    output: "DepartmentSignoff[]"
    side_effects: []
  - method: GET
    path: "/api/department-signoffs/{id}"
    description: "Get a signoff"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: DepartmentSignoff
    side_effects: []
  - method: POST
    path: "/api/department-signoffs/{id}/sign"
    description: "Sign a PENDING signoff during an IN_SESSION meeting; non-empty conditions yields SIGNED_WITH_CONDITIONS"
    roles: [DepartmentHead]
    code: 200
    input: ["conditions?"]
    output: DepartmentSignoff
    side_effects: ["status PENDING -> SIGNED | SIGNED_WITH_CONDITIONS", "signer_user_id/decided_at recorded"]
  - method: POST
    path: "/api/department-signoffs/{id}/refuse"
    description: "Refuse a PENDING signoff during an IN_SESSION meeting"
    roles: [DepartmentHead]
    code: 200
    input: [reason]
    output: DepartmentSignoff
    side_effects: ["status PENDING -> REFUSED", "refusal_reason/signer_user_id/decided_at recorded"]

  # --- EquipmentItem ---
  - method: POST
    path: "/api/equipment"
    description: "Register an equipment item (IN_SERVICE; inspection_current false until first passing inspection)"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, name, equipment_type, serial_number, inspection_interval_hours]
    output: EquipmentItem
    side_effects: ["status=IN_SERVICE", "registered_by_user_id=X-User-ID"]
  - method: GET
    path: "/api/equipment"
    description: "List equipment; filterable by production_id, status, equipment_type"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "status?", "equipment_type?", "limit?", "offset?"]
    output: "EquipmentItem[]"
    side_effects: []
  - method: GET
    path: "/api/equipment/{id}"
    description: "Get an equipment item (inspection_current recomputed against the logical clock)"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []
  - method: POST
    path: "/api/equipment/{id}/retire"
    description: "Retire equipment (terminal); READY sequences requiring it drop to SAFETY_HOLD"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: ["status -> RETIRED", "READY sequences requiring it -> SAFETY_HOLD with rehearsal/meeting sub-cascade"]

  # --- Inspection ---
  - method: POST
    path: "/api/inspections"
    description: "Record an equipment inspection; SoD: inspector != registrar; FAILED quarantines, PASSED un-quarantines"
    roles: [EquipmentInspector]
    code: 201
    input: [equipment_id, outcome, "notes?"]
    output: Inspection
    side_effects: ["inspected_at = current logical time", "outcome FAILED: equipment IN_SERVICE -> QUARANTINED + cascade", "outcome PASSED: last_passed_inspection_at updated; QUARANTINED -> IN_SERVICE", "outcome CONDITIONAL: last_passed_inspection_at updated; status unchanged"]
  - method: GET
    path: "/api/inspections"
    description: "List inspections; filterable by equipment_id, outcome"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["equipment_id?", "outcome?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/api/inspections/{id}"
    description: "Get an inspection"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  # --- Permit ---
  - method: POST
    path: "/api/permits"
    description: "Apply for a special-equipment permit"
    roles: [ProductionExecutive]
    code: 201
    input: [production_id, permit_type, jurisdiction, valid_from, valid_until]
    output: Permit
    side_effects: ["status=APPLIED"]
  - method: GET
    path: "/api/permits"
    description: "List permits; filterable by production_id, permit_type, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []
  - method: GET
    path: "/api/permits/{id}"
    description: "Get a permit"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/api/permits/{id}/grant"
    description: "Grant an applied permit"
    roles: [ProductionExecutive]
    code: 200
    input: []
    output: Permit
    side_effects: ["status APPLIED -> GRANTED"]
  - method: POST
    path: "/api/permits/{id}/deny"
    description: "Deny an applied permit"
    roles: [ProductionExecutive]
    code: 200
    input: []
    output: Permit
    side_effects: ["status APPLIED -> DENIED"]
  - method: POST
    path: "/api/permits/{id}/revoke"
    description: "Revoke a granted permit; READY sequences requiring it drop to SAFETY_HOLD"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: Permit
    side_effects: ["status GRANTED -> REVOKED", "READY sequences requiring this permit_type -> SAFETY_HOLD with sub-cascade"]

  # --- PayAdjustment ---
  - method: POST
    path: "/api/pay-adjustments"
    description: "Open a hazard-bump negotiation; Performer role must be the performer themself; bounds-checked; one open negotiation per (sequence, performer)"
    roles: [Performer, StuntCoordinator]
    code: 201
    input: [production_id, sequence_id, performer_id, adjustment_type, base_amount_cents, requested_pct]
    output: PayAdjustment
    side_effects: ["status=PROPOSED, round_count=0", "current_pct=requested_pct, proposer_by/last_offer_by = caller side", "provisional_estimate_cents computed"]
  - method: GET
    path: "/api/pay-adjustments"
    description: "List pay adjustments; filterable by production_id, sequence_id, performer_id, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "performer_id?", "status?", "limit?", "offset?"]
    output: "PayAdjustment[]"
    side_effects: []
  - method: GET
    path: "/api/pay-adjustments/{id}"
    description: "Get a pay adjustment"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: PayAdjustment
    side_effects: []
  - method: POST
    path: "/api/pay-adjustments/{id}/counter"
    description: "Counter-offer by the side that did not make the last offer (round cap 6)"
    roles: [Performer, StuntCoordinator]
    code: 200
    input: [counter_pct]
    output: PayAdjustment
    side_effects: ["status -> COUNTERED", "current_pct=counter_pct", "round_count +1", "last_offer_by flips"]
  - method: POST
    path: "/api/pay-adjustments/{id}/agree"
    description: "Accept the standing offer (the side that did not make it); budget authority check; commits pay"
    roles: [Performer, StuntCoordinator]
    code: 200
    input: []
    output: PayAdjustment
    side_effects: ["status -> AGREED", "final_amount_cents computed", "payable_amount_cents initialized", "Production.committed_pay_cents += final_amount_cents (invariant I1)"]
  - method: POST
    path: "/api/pay-adjustments/{id}/withdraw"
    description: "Withdraw an open negotiation (proposer side only)"
    roles: [Performer, StuntCoordinator]
    code: 200
    input: []
    output: PayAdjustment
    side_effects: ["status -> WITHDRAWN"]

  # --- Incident ---
  - method: POST
    path: "/api/incidents"
    description: "Report an incident; SERIOUS/CRITICAL triggers the production-stoppage cascade"
    roles: [SafetyOfficer, StuntCoordinator, DepartmentHead, ProductionExecutive]
    code: 201
    input: [production_id, "sequence_id?", severity, occurred_at, description]
    output: Incident
    side_effects: ["status=REPORTED", "severity in {SERIOUS, CRITICAL} and posture ACTIVE: production -> STOPPED with full cascade (stop transition)"]
  - method: GET
    path: "/api/incidents"
    description: "List incidents; filterable by production_id, sequence_id, severity, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "severity?", "status?", "limit?", "offset?"]
    output: "Incident[]"
    side_effects: []
  - method: GET
    path: "/api/incidents/{id}"
    description: "Get an incident"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/api/incidents/{id}/open-investigation"
    description: "Open investigation on a reported incident"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Incident
    side_effects: ["status REPORTED -> UNDER_INVESTIGATION"]
  - method: POST
    path: "/api/incidents/{id}/close"
    description: "Close an investigated incident (requires corrective_action)"
    roles: [SafetyOfficer]
    code: 200
    input: [corrective_action]
    output: Incident
    side_effects: ["status UNDER_INVESTIGATION -> CLOSED"]

  # --- StuntExecution ---
  - method: POST
    path: "/api/stunt-executions"
    description: "Attempt a take (OCC-guarded; sequence must be READY; permit window and equipment currency re-checked at current logical time)"
    roles: [StuntCoordinator]
    code: 201
    input: [production_id, sequence_id, take_number, expected_sequence_version]
    output: StuntExecution
    side_effects: ["status=ATTEMPTED", "executed_at = current logical time", "increments StuntSequence.version by 1"]
  - method: GET
    path: "/api/stunt-executions"
    description: "List executions; filterable by production_id, sequence_id, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "status?", "limit?", "offset?"]
    output: "StuntExecution[]"
    side_effects: []
  - method: GET
    path: "/api/stunt-executions/{id}"
    description: "Get an execution"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: StuntExecution
    side_effects: []
  - method: POST
    path: "/api/stunt-executions/{id}/complete"
    description: "Complete a take (first completion moves sequence READY -> EXECUTED; AGREED adjustments accrue take bonuses)"
    roles: [StuntCoordinator]
    code: 200
    input: []
    output: StuntExecution
    side_effects: ["status ATTEMPTED -> COMPLETED", "first completion: sequence -> EXECUTED", "AGREED adjustments: payable_amount_cents recomputed"]
  - method: POST
    path: "/api/stunt-executions/{id}/abort"
    description: "Abort a take; safety_related aborts auto-create an Incident (which may stop production)"
    roles: [StuntCoordinator]
    code: 200
    input: [abort_reason, safety_related, "incident_severity?"]
    output: StuntExecution
    side_effects: ["status ATTEMPTED -> ABORTED", "safety_related: Incident created (REPORTED, severity=incident_severity)", "SERIOUS/CRITICAL: production-stoppage cascade"]

  # --- PostStuntReview ---
  - method: POST
    path: "/api/post-stunt-reviews"
    description: "Open a post-stunt review (sequence must be EXECUTED; at most one OPEN review per sequence)"
    roles: [SafetyOfficer]
    code: 201
    input: [production_id, sequence_id]
    output: PostStuntReview
    side_effects: ["status=OPEN", "reviewer_user_id recorded"]
  - method: GET
    path: "/api/post-stunt-reviews"
    description: "List reviews; filterable by production_id, sequence_id, status"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: ["production_id?", "sequence_id?", "status?", "limit?", "offset?"]
    output: "PostStuntReview[]"
    side_effects: []
  - method: GET
    path: "/api/post-stunt-reviews/{id}"
    description: "Get a review"
    roles: [ProductionExecutive, StuntCoordinator, SafetyOfficer, DepartmentHead, Performer, EquipmentInspector]
    code: 200
    input: []
    output: PostStuntReview
    side_effects: []
  - method: POST
    path: "/api/post-stunt-reviews/{id}/close"
    description: "Close the review with an outcome (drives sequence REVIEWED or DESIGN_LOCKED reshoot/deficiency loop)"
    roles: [SafetyOfficer]
    code: 200
    input: [outcome, findings]
    output: PostStuntReview
    side_effects: ["status OPEN -> CLOSED", "sequence transition per outcome (see PostStuntReview state machine)"]

# =============================================================================
# §1.6 Error Code Catalog (62 codes)
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Performer-role write where body performer_id != X-User-ID; or owner-restricted coordinator action by a non-owner coordinator" }
  # --- generic request ---
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, unknown field (including client-supplied computed/system fields), invalid enum, non-positive amount, empty corrective_action, missing incident_severity on safety abort" }
  # --- existence ---
  - { id: ERR_PRODUCTION_NOT_FOUND, http: 404, condition: "No Production with the given id" }
  - { id: ERR_SEQUENCE_NOT_FOUND, http: 404, condition: "No StuntSequence with the given id" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "No RiskAssessment with the given id" }
  - { id: ERR_PERFORMER_NOT_FOUND, http: 404, condition: "No StuntPerformer with the given id" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "No Certification with the given id" }
  - { id: ERR_REHEARSAL_NOT_FOUND, http: 404, condition: "No Rehearsal with the given id" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "No SafetyMeeting with the given id" }
  - { id: ERR_SIGNOFF_NOT_FOUND, http: 404, condition: "No DepartmentSignoff with the given id" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "No EquipmentItem with the given id" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "No Inspection with the given id" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "No Permit with the given id" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND, http: 404, condition: "No PayAdjustment with the given id" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "No Incident with the given id" }
  - { id: ERR_EXECUTION_NOT_FOUND, http: 404, condition: "No StuntExecution with the given id" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "No PostStuntReview with the given id" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version" }
  # --- state ---
  - { id: ERR_PRODUCTION_NOT_ACTIVE, http: 409, condition: "Operation requires posture ACTIVE (or SETUP for design operations); also used for activate from non-SETUP, stop from non-ACTIVE, wrap from non-ACTIVE, incident report in SETUP/WRAPPED" }
  - { id: ERR_PRODUCTION_STOPPED, http: 409, condition: "Operation blocked while posture is STOPPED (rehearsals, meetings, executions, inspections, readiness)" }
  - { id: ERR_PRODUCTION_NOT_STOPPED, http: 409, condition: "lift-stoppage requires posture STOPPED" }
  - { id: ERR_INSURANCE_NOT_FILED, http: 409, condition: "activate requires insurance_status in {FILED, ACKNOWLEDGED}" }
  - { id: ERR_INSURANCE_INVALID_STATE, http: 409, condition: "file-insurance requires UNFILED; acknowledge-insurance requires FILED" }
  - { id: ERR_SEQUENCE_INVALID_STATE, http: 409, condition: "Sequence not in a state permitting the operation: assessment submit/create against EXECUTED/REVIEWED/CANCELLED; rehearsal or safety-meeting create outside DESIGN_LOCKED/READY; execution create outside READY; review create outside EXECUTED; pay-adjustment create/counter/agree/withdraw against EXECUTED/REVIEWED/CANCELLED" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "Assessment not in the required state (submit requires DRAFT, approve/reject require SUBMITTED, revise requires REJECTED)" }
  - { id: ERR_PERFORMER_NOT_QUALIFIED, http: 409, condition: "Operation requires performer status QUALIFIED (rehearsal schedule/complete, pay create/agree, suspend, reinstate)" }
  - { id: ERR_NO_VALID_CERTIFICATION, http: 409, condition: "reinstate requires at least one valid (unrevoked, unexpired) certification" }
  - { id: ERR_REHEARSAL_INVALID_STATE, http: 409, condition: "Rehearsal not in the required state (complete/mark-missed/cancel require SCHEDULED; void-completion requires COMPLETED)" }
  - { id: ERR_MEETING_INVALID_STATE, http: 409, condition: "Meeting not in the required state (start requires SCHEDULED, complete requires IN_SESSION, signoff sign/refuse requires IN_SESSION, adjourn requires SCHEDULED or IN_SESSION)" }
  - { id: ERR_SIGNOFF_ALREADY_DECIDED, http: 409, condition: "Signoff already SIGNED, SIGNED_WITH_CONDITIONS, or REFUSED" }
  - { id: ERR_SIGNOFFS_PENDING, http: 409, condition: "Meeting complete blocked: at least one signoff still PENDING" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "grant/deny require APPLIED; revoke requires GRANTED" }
  - { id: ERR_ADJUSTMENT_INVALID_STATE, http: 409, condition: "Adjustment not in the required state for counter/agree/withdraw" }
  - { id: ERR_NOT_YOUR_TURN, http: 409, condition: "Counter/agree by the side that made the last offer; withdraw by the non-proposer side" }
  - { id: ERR_NEGOTIATION_EXHAUSTED, http: 409, condition: "Counter attempted while round_count == MAX_ROUNDS (6); the attempt is rejected and the adjustment transitions to EXPIRED" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "open-investigation requires REPORTED; close requires UNDER_INVESTIGATION" }
  - { id: ERR_EXECUTION_INVALID_STATE, http: 409, condition: "complete/abort require ATTEMPTED" }
  - { id: ERR_REVIEW_INVALID_STATE, http: 409, condition: "close requires OPEN" }
  - { id: ERR_EQUIPMENT_INVALID_STATE, http: 409, condition: "retire requires non-RETIRED" }
  # --- business safety ---
  - { id: ERR_CERTIFICATION_MISSING_OR_EXPIRED, http: 422, condition: "Performer lacks a valid certification matching the sequence hazard_class (checked against rehearsal scheduled_start at scheduling)" }
  - { id: ERR_CATEGORY_SCORE_MISMATCH, http: 422, condition: "Screening band of the assessment does not equal the sequence's declared risk_category" }
  - { id: ERR_RISK_SCORE_ABOVE_THRESHOLD, http: 422, condition: "board_score >= 16 at lock-design" }
  - { id: ERR_REHEARSAL_QUOTA_NOT_MET, http: 422, condition: "completed_rehearsal_count < required_rehearsal_count at mark-ready/reverify" }
  - { id: ERR_MEETING_REQUIREMENT_UNSATISFIED, http: 422, condition: "No COMPLETED safety meeting at the current design_revision with all signoffs decided favorably" }
  - { id: ERR_MEDIC_STANDBY_NOT_CONFIRMED, http: 422, condition: "medic_standby_required and the qualifying meeting's MEDIC signoff is not SIGNED/SIGNED_WITH_CONDITIONS" }
  - { id: ERR_EQUIPMENT_NOT_READY, http: 422, condition: "A required equipment item is not IN_SERVICE or its inspection is stale (incl. never inspected)" }
  - { id: ERR_PERMIT_MISSING_OR_WINDOW_MISMATCH, http: 422, condition: "A required permit type has no GRANTED permit covering the scheduled execution window (mark-ready) or the current instant (execution create)" }
  - { id: ERR_INSURANCE_NOT_ACKNOWLEDGED, http: 422, condition: "HIGH/CRITICAL sequence readiness requires insurance_status == ACKNOWLEDGED" }
  # --- business constraint ---
  - { id: ERR_REHEARSAL_CONFLICT, http: 409, condition: "Performer already has a SCHEDULED/COMPLETED rehearsal overlapping (half-open) the requested window" }
  - { id: ERR_FACILITY_BUFFER_CONFLICT, http: 409, condition: "Facility has a SCHEDULED/IN_SESSION meeting within the 30-minute buffered exclusion window" }
  - { id: ERR_DUPLICATE_TAKE_NUMBER, http: 409, condition: "take_number already used by any execution of the sequence regardless of status" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "An OPEN PostStuntReview already exists for the sequence" }
  - { id: ERR_NEGOTIATION_ALREADY_OPEN, http: 409, condition: "A PROPOSED/COUNTERED PayAdjustment already exists for the (sequence, performer) pair" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end not after start (rehearsal, meeting, execution window, permit validity)" }
  # --- referential ---
  - { id: ERR_CROSS_PRODUCTION_REFERENCE, http: 422, condition: "A body FK references an entity belonging to a different Production than the primary reference (incl. required_equipment_ids elements)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver == assessor, signoff signer == sequence coordinator, or inspector == equipment registrar" }
  # --- temporal ---
  - { id: ERR_REHEARSAL_IN_PAST, http: 422, condition: "Rehearsal scheduled_start is not strictly in the future at creation" }
  - { id: ERR_REHEARSAL_TIME_GATE, http: 422, condition: "complete before scheduled_start, or mark-missed at or before scheduled_end" }
  - { id: ERR_STOPPAGE_COOLDOWN, http: 409, condition: "lift-stoppage before stopped_at + 86400s" }
  - { id: ERR_CLOCK_NOT_FORWARD, http: 422, condition: "set_current_utc with to_iso8601 not strictly greater than current logical time" }
  # --- fiscal ---
  - { id: ERR_BUMP_OUT_OF_RANGE, http: 422, condition: "bump_cents outside [floor, cap] per hazard_bump_bounds" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Agreed line would exceed available budget after reserve" }
  # --- wrap ---
  - { id: ERR_SEQUENCES_NOT_TERMINAL, http: 409, condition: "wrap blocked: at least one sequence not in {REVIEWED, CANCELLED}" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProductionExecutive
    description: "Production-side executive: owns production lifecycle, budget, insurance filing, and permits; the only role that can lift a stoppage or wrap"
    identity: opaque
    exclusive_operations:
      - "POST /api/productions — create production"
      - "PATCH /api/productions/{id}/budget — amend budget (OCC)"
      - "POST /api/productions/{id}/file-insurance, /acknowledge-insurance, /activate, /lift-stoppage, /wrap"
      - "POST /api/permits, POST /api/permits/{id}/grant, POST /api/permits/{id}/deny"
      - "POST /api/_clock/set_current_utc — advance logical clock"
    shared_operations:
      - "POST /api/productions/{id}/stop (with SafetyOfficer)"
      - "POST /api/stunt-sequences/{id}/cancel (with owner StuntCoordinator)"
      - "POST /api/incidents (with SafetyOfficer, StuntCoordinator, DepartmentHead)"
      - "All GET endpoints"
  - name: StuntCoordinator
    description: "Stunt coordinator: designs sequences, authors risk assessments, schedules rehearsals and meetings, registers equipment, calls takes, negotiates pay on the coordinator side"
    identity: opaque
    exclusive_operations:
      - "POST /api/stunt-sequences (+ lock-design, mark-ready, reverify-readiness)"
      - "POST /api/risk-assessments (+ submit, revise)"
      - "POST /api/performers, POST /api/certifications"
      - "POST /api/rehearsals (+ complete, mark-missed, cancel)"
      - "POST /api/safety-meetings"
      - "POST /api/equipment, POST /api/equipment/{id}/retire"
      - "POST /api/stunt-executions (+ complete, abort)"
    shared_operations:
      - "POST /api/pay-adjustments, /counter, /agree, /withdraw (coordinator side)"
      - "POST /api/stunt-sequences/{id}/cancel (owner) and POST /api/incidents"
      - "All GET endpoints"
  - name: SafetyOfficer
    description: "Set safety officer: approves/rejects risk assessments, chairs meetings, suspends performers, revokes permits and certifications, investigates incidents, opens/closes reviews, may stop production"
    identity: opaque
    exclusive_operations:
      - "POST /api/risk-assessments/{id}/approve, /reject"
      - "POST /api/safety-meetings/{id}/start, /complete, /adjourn"
      - "POST /api/performers/{id}/suspend, /reinstate"
      - "POST /api/certifications/{id}/revoke"
      - "POST /api/rehearsals/{id}/void-completion"
      - "POST /api/permits/{id}/revoke"
      - "POST /api/incidents/{id}/open-investigation, /close"
      - "POST /api/post-stunt-reviews, POST /api/post-stunt-reviews/{id}/close"
    shared_operations:
      - "POST /api/productions/{id}/stop (with ProductionExecutive)"
      - "POST /api/incidents"
      - "All GET endpoints"
  - name: DepartmentHead
    description: "Department head (camera, electric, grip, stunts, medic, fire safety): signs or refuses signoffs; may report incidents. SoD: cannot sign a sequence they coordinated"
    identity: opaque
    exclusive_operations:
      - "POST /api/department-signoffs/{id}/sign, /refuse"
    shared_operations:
      - "POST /api/incidents"
      - "All GET endpoints"
  - name: Performer
    description: "Stunt performer (entity-backed): negotiates own hazard-bump adjustments (propose, counter, agree, withdraw); reads"
    identity: "entity_backed:StuntPerformer"
    exclusive_operations:
      - "POST /api/pay-adjustments as the negotiating performer (performer_id == X-User-ID)"
    shared_operations:
      - "POST /api/pay-adjustments/{id}/counter, /agree, /withdraw (performer side, own adjustments only)"
      - "All GET endpoints"
  - name: EquipmentInspector
    description: "Independent equipment inspector: records inspections. SoD: cannot inspect equipment they registered"
    identity: opaque
    exclusive_operations:
      - "POST /api/inspections"
    shared_operations:
      - "All GET endpoints"
