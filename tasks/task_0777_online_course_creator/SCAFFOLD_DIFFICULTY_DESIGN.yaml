# =============================================================================
# task_0777 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: course_revenue_gross_vs_net_settled
        grounds:
          - calculations.course_revenue
          - entities.Course.fields.gross_revenue_cents
          - entities.Course.fields.net_settled_revenue_cents
        distinguishing_aspect: |
          On the SAME single PAID invoice, Course.gross_revenue_cents (pre-fee, ignores window)
          and Course.net_settled_revenue_cents (creator_net, excludes in-window invoices) diverge:
          20000 vs 0 while the invoice is still inside its refund window. Domain: Course (money).
        test_recipe:
          setup:
            - "Clock at startup default 2026-03-01T00:00:00Z"
            - "Published course with refund_window_days=14, one ONE_TIME plan amount 20000, one paid enrollment; invoice paid at 2026-03-01 (still inside window)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A", refund_window_days: 14 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "GET /courses/${course_id}"
              as: Creator
              as_user_id: "${creator_id}"
          assert:
            - "Course.${course_id}.gross_revenue_cents == 20000"
            - "Course.${course_id}.net_settled_revenue_cents == 0"

      - name: enrollment_progress_vs_mastery
        grounds:
          - calculations.enrollment_completion
          - entities.Enrollment.fields.raw_progress_pct
          - entities.Enrollment.fields.is_mastery_complete
        distinguishing_aspect: |
          With one published required-quiz lesson completed but the quiz unpassed, raw_progress_pct==100
          yet is_mastery_complete==false and access_status stays ACTIVE (not COMPLETED). Two valid
          readings of 'done' diverge on identical data. Domain: Enrollment (learning), distinct from
          the Course-money dual variant above.
        test_recipe:
          setup:
            - "Published course with one published lesson is_quiz_required=true (passing 70); student paid & ACTIVE; lesson completed but no passing quiz attempt"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A", refund_window_days: 14 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1, is_quiz_required: true, quiz_passing_score: 70 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/complete-lesson"
              payload: { lesson_id: "${lesson_id}" }
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "Enrollment.${enrollment_id}.raw_progress_pct == 100"
            - "Enrollment.${enrollment_id}.is_mastery_complete == false"
            - "Enrollment.${enrollment_id}.access_status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: checkout_charge_percent_coupon_mode_a
        grounds:
          - calculations.checkout_charge
          - entities.Enrollment.fields.discount_cents
          - entities.Enrollment.fields.initial_charge_cents
          - entities.Enrollment.fields.list_price_cents
        distinguishing_aspect: |
          Mode (a): checkout_charge takes >=3 inputs (plan_type branch, coupon discount_type branch,
          min/max clamp on FIXED, eligibility predicate) with non-linear interaction. ONE_TIME 20000
          with PERCENT 25 coupon (min 10000) yields discount floor(20000*0.25)=5000, initial 15000.
        test_recipe:
          setup:
            - "Published course, ONE_TIME plan 20000, ACTIVE PERCENT-25 coupon P25 (min_purchase 10000, wide window)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "P25", discount_type: "PERCENT", discount_value: 25, max_redemptions: 5, min_purchase_cents: 10000, starts_at: "2026-01-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { coupon_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}", coupon_code: "P25" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
          assert:
            - "Enrollment.${enrollment_id}.list_price_cents == 20000"
            - "Enrollment.${enrollment_id}.discount_cents == 5000"
            - "Enrollment.${enrollment_id}.initial_charge_cents == 15000"

      - name: affiliate_commission_per_invoice_sum_mode_b
        grounds:
          - calculations.affiliate_commission
          - calculations.installment_split
          - entities.Affiliate.fields.commission_pending_cents
        distinguishing_aspect: |
          Mode (b): round-per-line-item-then-sum vs sum-then-round. PAYMENT_PLAN total 10000 split into
          [3334,3334,3332], affiliate 15%. Per-invoice floors 500+500+499=1499, pinned; floor(10000*0.15)=1500.
          Different mode from checkout_charge (a).
        test_recipe:
          setup:
            - "Published course, PAYMENT_PLAN plan total 10000 num_installments 3, ACTIVE affiliate AF15 (15%); enrollment via affiliate; all 3 invoices created"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "PAYMENT_PLAN", amount_cents: 10000, num_installments: 3 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /affiliates"
              payload: { creator_id: "${creator_id}", code: "AF15", commission_pct: 15 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { affiliate_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}", affiliate_code: "AF15" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv0: "$.data[0].id", inv1: "$.data[1].id", inv2: "$.data[2].id" }
          trigger:
            - call: "POST /invoices/${inv0}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /invoices/${inv1}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /invoices/${inv2}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "Affiliate.${affiliate_id}.commission_pending_cents == 1499"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_parallel_access_and_billing_axes
        grounds:
          - state_machines.Enrollment.access_status.ACTIVE_to_COMPLETED
          - state_machines.Enrollment.billing_status.PENDING_to_CURRENT
          - entities.Enrollment.fields.access_status
          - entities.Enrollment.fields.billing_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: access_status advances ACTIVE->COMPLETED (learning) while
          billing_status stays CURRENT (money) — the two axes evolve independently. Non-linear via
          parallel dimensions on Enrollment.
        test_recipe:
          setup:
            - "Paid ACTIVE enrollment; single published required-quiz lesson (passing 70); lesson completed"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1, is_quiz_required: true, quiz_passing_score: 70 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /enrollments/${enrollment_id}/complete-lesson"
              payload: { lesson_id: "${lesson_id}" }
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/quiz-attempts"
              payload: { lesson_id: "${lesson_id}", score: 80 }
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "Enrollment.${enrollment_id}.access_status == COMPLETED"
            - "Enrollment.${enrollment_id}.billing_status == CURRENT"

      - name: course_cyclic_republish_loop
        grounds:
          - state_machines.Course.status.PUBLISHED_to_UNPUBLISHED
          - state_machines.Course.status.UNPUBLISHED_to_PUBLISHED
          - entities.Course.fields.status
        distinguishing_aspect: |
          Course status forms a cycle PUBLISHED->UNPUBLISHED->PUBLISHED (republish loop) — non-linear on
          a different entity than the Enrollment parallel machine. After republish, status==PUBLISHED again.
        test_recipe:
          setup:
            - "Course with a published lesson and an ACTIVE plan; published then unpublished"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "UNPUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_status: $.data.status }
          assert:
            - "Course.${course_id}.status == PUBLISHED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: refund_initial_invoice_depth3_cascade
        grounds:
          - state_machines.Invoice.status.PAID_to_REFUNDED
          - state_machines.Enrollment.access_status.ACTIVE_to_REVOKED
          - state_machines.Enrollment.billing_status.PENDING_to_REFUNDED
          - calculations.creator_net_ledger_invariant
          - entities.Affiliate.fields.commission_clawed_back_cents
        distinguishing_aspect: |
          Depth-4 chain from refund: Invoice PAID->REFUNDED -> Enrollment REVOKED/REFUNDED ->
          Creator ledger reversal (lifetime_creator_net_cents to 0) -> Affiliate clawback
          (commission_pending 4000->0, clawed_back 4000). Each hop caused by the prior. Trigger: refund.
        test_recipe:
          setup:
            - "Clock 2026-03-01; published course refund_window 14, ONE_TIME 20000, affiliate AF20 (20%); enrollment via affiliate, initial invoice paid 2026-03-01 (fee 2000, commission 4000, net 14000)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A", refund_window_days: 14 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /affiliates"
              payload: { creator_id: "${creator_id}", code: "AF20", commission_pct: 20 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { affiliate_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}", affiliate_code: "AF20" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /invoices/${inv_id}/refund"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
          assert:
            - "Invoice.${inv_id}.status == REFUNDED"
            - "Enrollment.${enrollment_id}.access_status == REVOKED"
            - "Enrollment.${enrollment_id}.billing_status == REFUNDED"
            - "Creator.${creator_id}.lifetime_creator_net_cents == 0"
            - "Affiliate.${affiliate_id}.commission_pending_cents == 0"
            - "Affiliate.${affiliate_id}.commission_clawed_back_cents == 4000"

      - name: complete_lesson_depth2_certificate_cascade
        grounds:
          - state_machines.Enrollment.access_status.ACTIVE_to_COMPLETED
          - entities.Enrollment.fields.certificate_serial
          - entities.Course.fields.completion_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (complete-lesson): completing the last lesson ->
          Enrollment ACTIVE->COMPLETED -> certificate minted AND Course.completion_count bubbled to 1.
          Distinct origin transition from the refund cascade.
        test_recipe:
          setup:
            - "Paid ACTIVE enrollment; single published lesson with is_quiz_required=false (mastery = lesson completion only)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1, is_quiz_required: false }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/complete-lesson"
              payload: { lesson_id: "${lesson_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { cert: $.data.certificate_serial }
          assert:
            - "Enrollment.${enrollment_id}.access_status == COMPLETED"
            - "Enrollment.${enrollment_id}.certificate_serial != null"
            - "Course.${course_id}.completion_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: coupon_referential_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_COUPON_COURSE_MISMATCH]
          - errors[ERR_COUPON_REDEMPTION_LIMIT]
        distinguishing_aspect: |
          business_referential (coupon.course_id != course, pri 7) vs business_fiscal (redeemed_count >=
          max_redemptions, pri 11). A coupon on course B, already at its limit, applied to course A returns
          ERR_COUPON_COURSE_MISMATCH (referential wins). Pair: referential vs fiscal.
        test_recipe:
          setup:
            - "Course A published; Course B published with coupon LIMIT1 (max_redemptions 1) already redeemed once on B (at limit)"
          setup_api_calls:
