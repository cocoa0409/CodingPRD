  # ===========================================================================

  - rule_id: compensating_invariant
    instances:

      - name: void_delivery_restores_class_credited_topic_hours_total_exactly
        grounds:
          - state_machines[CourseSession].transitions[DELIVERED -> VOIDED]
          - state_machines[AttendanceRecord].transitions[CREDITED -> VOIDED]
          - state_machines[AcademyClass].transitions[IN_SESSION -> AT_RISK]
          - entities.AcademyClass.fields.credited_topic_hours_total
          - entities.TrainingRecordEntry.fields.hours_delta
          - calculations.topic_hours_ledger
          - endpoints[POST /course-sessions/{courseSessionId}/void-delivery]
        distinguishing_aspect: |
          AcademyClass.credited_topic_hours_total is a conserved quantity defined as the SUM of
          TrainingRecordEntry.hours_delta over HOURS_CREDIT and HOURS_REVERSAL entries, so voiding a
          delivery must compensate rather than recompute: a HOURS_REVERSAL entry of exactly
          -2.00 is appended, the ledger returns to precisely its pre-delivery 2.00, and the
          immutable HOURS_CREDIT entry from the original delivery is NOT deleted or edited. Every
          per-row derived value unwinds with it (credited_hours 0.00, counted_absence_hours 0.00,
          enrolled_count 0) while the OTHER delivered session's CREDITED row is untouched, and the
          class posture drops IN_SESSION -> AT_RISK because the voided session no longer counts
          toward projected_topic_hours. Deleting the credit entry, or re-deriving the total from
          scratch, leaves either the audit trail or the arithmetic wrong.
        test_recipe:
          setup:
            - "One CertificationStandard requiring 6.00 PATROL hours; one Recruit cleared through all four screenings and in pipeline_stage ACADEMY."
            - "Two 2.00-hour PATROL CourseSessions, each DELIVERED with one CREDITED PRESENT AttendanceRecord (credited_hours 2.00 each)."
            - "Before the trigger: AcademyClass.credited_topic_hours_total 4.00 and status IN_SESSION, Recruit.credited_hours_total 4.00, two HOURS_CREDIT TrainingRecordEntry rows of +2.00 each."
            - "Logical clock at 2026-08-11T12:00:00Z."
