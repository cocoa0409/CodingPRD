# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or payload FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required input field missing or wrong type" }
  - { id: ERR_INVALID_MEASUREMENT, http: 422, condition: "Measurement out of range, or geometric safety rule (CURVED requires stair_run_mm >= 2 * stair_rise_mm) violated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in the required state for this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match current parent version" }
  - { id: ERR_STAIR_TOO_NARROW, http: 422, condition: "stair_width_mm < ProductModel.min_stair_width_mm on approval" }
  - { id: ERR_NO_POWER_SOURCE, http: 422, condition: "No electrical outlet within 2m AND staircase_kind != OUTDOOR" }
  - { id: ERR_LANDING_CLEARANCE_TOO_SMALL, http: 422, condition: "landing_clearance_mm < 500" }
  - { id: ERR_ASSESSMENT_NOT_APPROVED, http: 409, condition: "Quote issue requires parent HomeAssessment in APPROVED state" }
  - { id: ERR_MODEL_INCOMPATIBLE, http: 422, condition: "ProductModel does not support assessment's staircase_kind or outdoor exposure" }
  - { id: ERR_ACTIVE_QUOTE_EXISTS, http: 409, condition: "Another Quote on this Customer is already ISSUED" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Quote.expires_at <= now at accept or revise" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "EquipmentUnit not in expected status (IN_STOCK for accept; RESERVED for install scheduling) or model mismatch" }
  - { id: ERR_PENDING_FUNDING_APPS, http: 402, condition: "Cannot skip funding while FundingApplications in PENDING and waiver not signed" }
  - { id: ERR_RENTAL_BALANCE_OUTSTANDING, http: 402, condition: "RENTAL Agreement paid_to_date_cents < list_price_cents at RemovalJob create" }
  - { id: ERR_REMOVAL_COOLING_OFF, http: 409, condition: "PURCHASE Agreement < 30 days since INSTALLED at RemovalJob create" }
  - { id: ERR_INSTALL_ALREADY_SCHEDULED, http: 409, condition: "An InstallJob already exists on this Agreement in {SCHEDULED, IN_PROGRESS}" }
  - { id: ERR_CREW_OVERLAP, http: 409, condition: "Temporal conflict on technician crew (buffer rule for installs, daily-capacity for removals)" }
  - { id: ERR_TOO_EARLY, http: 409, condition: "Logical clock < scheduled_start_utc at InstallJob start" }
  - { id: ERR_SERVICE_PLAN_REQUIRED, http: 402, condition: "Agreement activation requires an ACTIVE ServicePlan" }
  - { id: ERR_SERVICE_PLAN_INACTIVE, http: 402, condition: "WarrantyClaim adjudicate requires ServicePlan.status == ACTIVE" }
  - { id: ERR_WAIVER_BLOCKS_CLAIM, http: 422, condition: "liability_waiver_signed blocks WEAR_AND_TEAR claims" }
  - { id: ERR_CLAIM_KIND_NOT_COVERED, http: 402, condition: "claim_kind not covered by ServicePlan.tier (BASIC excludes STRUCTURAL/WEAR_AND_TEAR; STANDARD excludes STRUCTURAL)" }
  - { id: ERR_COVERAGE_CAP_EXCEEDED, http: 402, condition: "coverage_used_cents + claimed_cents > coverage_cap_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; superset of reads, catalog management, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /stairlift-ops/_clock/set_current_utc"
      - "POST /stairlift-ops/product-models"
      - "GET /stairlift-ops/audit-events"
    shared_operations:
      - "POST /stairlift-ops/customers"
      - "POST /stairlift-ops/equipment-units"
      - "POST /stairlift-ops/quotes/{id}/accept (on behalf of Customer)"
      - "POST /stairlift-ops/agreements/{id}/payments"
      - "POST /stairlift-ops/quotes/{id}/funding-applications"
      - "POST /stairlift-ops/agreements/{id}/warranty-claims"
      - "GET (all resources)"

  - name: Customer
    description: "End customer; owns their resources via X-User-ID == Customer.id"
    identity: entity_backed:Customer
    exclusive_operations: []
    shared_operations:
      - "GET /stairlift-ops/customers/{id} (self only)"
      - "GET /stairlift-ops/customers/{id}/quotes"
      - "POST /stairlift-ops/quotes/{id}/accept (own quotes only)"
      - "POST /stairlift-ops/quotes/{id}/funding-applications (own quotes)"
      - "POST /stairlift-ops/agreements/{id}/payments (own agreements)"
      - "POST /stairlift-ops/agreements/{id}/warranty-claims (own agreements)"

  - name: SalesRep
    description: "Sales representative; manages assessments scheduling, quotes, customers"
    identity: opaque
    exclusive_operations:
      - "POST /stairlift-ops/customers/{id}/quotes"
      - "POST /stairlift-ops/quotes/{id}/issue"
      - "POST /stairlift-ops/quotes/{id}/revise"
    shared_operations:
      - "POST /stairlift-ops/customers"
      - "POST /stairlift-ops/customers/{id}/home-assessments"
      - "POST /stairlift-ops/agreements/{id}/service-plans"
      - "GET (most resources)"

  - name: Assessor
    description: "Field assessor; performs measurement"
    identity: opaque
    exclusive_operations:
      - "POST /stairlift-ops/home-assessments/{id}/measure"
    shared_operations:
      - "POST /stairlift-ops/customers/{id}/home-assessments"
      - "GET (assessments, product models, customers)"

  - name: AssessmentReviewer
