            - "Referral.${ref_long_id}.selector_window_days == 300 and Referral.${ref_immuno_id}.selector_window_days == 245"
            - "the two Class B candidates tie on capability, suitability and free beds, so the earliest created_at decides and the facility_code rung is never reached"
            - "ClinicalProtocol.${protocol_id}.reserved_cents == 2500000"

      - name: selector_empty_candidate_pool_declines_the_referral
        grounds:
          - calculations.housing_tier_selector
          - errors.ERR_NO_HOUSING_AVAILABLE
          - entities.Referral.fields.status
          - state_machines.Referral.SUBMITTED_to_DECLINED
        distinguishing_aspect: "When the only candidate at the required tier is removed from the pool by a facility-status flip, the selector's empty-set branch fires and the referral is DECLINED rather than accepted at a lower tier."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001; campus residence beds 4 and one Class B residence."
            - "The Class B residence is suspended before the screen, leaving no candidate for a 300-day immune-competent family."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id }
            - call: "POST /programs/clinical-protocols/${protocol_id}/open"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v0: $.data.version }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_on_id: $.data.id }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "PTB-01", name: "Partner Class B", tier: "PARTNER_CLASS_B", total_beds: 6, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_b_id: $.data.id }
            - call: "POST /programs/housing-facilities/${fac_b_id}/suspend"
              payload: { suspension_reason: "FIRE_SAFETY_REMEDIATION" }
              as: HousingCoordinator
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Noah Patel", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 300, is_immunosuppressed: false, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_long_id: $.data.id }
          trigger:
            - call: "POST /programs/referrals/${ref_long_id}/screen"
              payload: { expected_protocol_version: "${protocol_v0}" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id, ref_status: $.data.status, ref_reason: $.data.decline_reason }
          assert:
            - "the screen returns 409 and err_id == ERR_NO_HOUSING_AVAILABLE"
            - "Referral.${ref_long_id}.status == DECLINED and decline_reason == CAPACITY_FULL"
            - "Referral.${ref_long_id}.applied_tier == DECLINED"
            - "Referral.${ref_long_id}.reservation_basis_cents == 0, so no reservation was booked"
            - "ClinicalProtocol.${protocol_id}.reserved_cents == 0 and available_cents == 10000000"
            - "the family was not silently housed at a lower tier, because the campus residence is not on the duration path for a 300-day immune-competent referral"

  # ===========================================================================
  - rule_id: rate_threshold_trigger
    instances:

      - name: threshold_checkpoint_freezes_only_strictly_over_cap_ledgers
        grounds:
          - calculations.family_stimulation_markup
          - endpoints.POST_/_ops/run-checkpoint
          - entities.FamilyServiceLedger.fields.status
          - entities.FamilySupportService.fields.stimulation_cap_cents
        distinguishing_aspect: "The ops-run checkpoint freezes a ledger only when its accumulated cents strictly exceeds the service cap: a ledger whose markup sits exactly on the cap survives the run, and a ledger whose accumulated cents are one cent past its cap is frozen."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; fund SJ-FY26; three eligible MEALS service lines with base 20000, rate 0.3 and caps 5000, 6000 and 5500."
            - "Accruals bring their ledgers to 20000, 40000 and 20000 accumulated cents with markups 5000, 6000 and 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/family-support-services"
              payload: { fund_id: "${fund_id}", service_code: "MEALS-A", display_name: "Meals A", base_allowance_cents: 20000, is_stimulation_eligible: true, stimulation_rate: 0.3, stimulation_cap_cents: 5000 }
              as: PatientSupportOfficer
              captures: { svc_a_id: $.data.id }
            - call: "POST /programs/family-support-services"
              payload: { fund_id: "${fund_id}", service_code: "MEALS-B", display_name: "Meals B", base_allowance_cents: 20000, is_stimulation_eligible: true, stimulation_rate: 0.3, stimulation_cap_cents: 6000 }
              as: PatientSupportOfficer
              captures: { svc_b_id: $.data.id }
            - call: "POST /programs/family-support-services"
              payload: { fund_id: "${fund_id}", service_code: "MEALS-C", display_name: "Meals C", base_allowance_cents: 20000, is_stimulation_eligible: true, stimulation_rate: 0.3, stimulation_cap_cents: 5500 }
              as: PatientSupportOfficer
              captures: { svc_c_id: $.data.id }
            - call: "POST /programs/family-support-services/${svc_a_id}/allowances"
              payload: { family_count: 1 }
              as: PatientSupportOfficer
              captures: { ledger_a_id: $.data.family_service_ledger_id }
            - call: "POST /programs/family-support-services/${svc_b_id}/allowances"
              payload: { family_count: 1 }
              as: PatientSupportOfficer
              captures: { ledger_b_id: $.data.family_service_ledger_id }
            - call: "POST /programs/family-support-services/${svc_b_id}/allowances"
              payload: { family_count: 1 }
              as: PatientSupportOfficer
            - call: "POST /programs/family-support-services/${svc_c_id}/allowances"
              payload: { family_count: 1 }
              as: PatientSupportOfficer
              captures: { ledger_c_id: $.data.family_service_ledger_id }
          trigger:
            - call: "POST /_ops/run-checkpoint"
              payload: { advance_to_epoch: 1 }
              as: PlatformAdmin
              captures: { ledger_epoch: $.data.ledger_epoch, frozen_count: $.data.frozen_ledger_count }
            - call: "GET /programs/family-service-ledgers/${ledger_a_id}"
              payload: {}
              as: Any
              captures: { ledger_a_status: $.data.status }
            - call: "GET /programs/family-service-ledgers/${ledger_b_id}"
              payload: {}
              as: Any
              captures: { ledger_b_status: $.data.status, ledger_b_epoch: $.data.ledger_epoch }
            - call: "GET /programs/family-service-ledgers/${ledger_c_id}"
              payload: {}
              as: Any
              captures: { ledger_c_status: $.data.status }
          assert:
            - "the checkpoint reports ledger_epoch == 1"
            - "FamilyServiceLedger.${ledger_a_id}.status == ACTIVE with accumulated_cents == 20000, its markup exactly at the 5000 cap rather than above it"
            - "FamilyServiceLedger.${ledger_b_id}.status == ACTIVE with accumulated_cents == 40000 and a 6000 markup exactly at its cap"
            - "exactly one ledger is frozen by the run, so frozen_ledger_count == 1"
            - "FamilyServiceLedger.${ledger_c_id}.status == FROZEN, the strict-excess ledger"
            - "FamilyServiceLedger.${ledger_b_id}.ledger_epoch == 1 after the run"

      - name: threshold_freeze_blocks_markup_but_not_base_allowances
        grounds:
          - calculations.family_stimulation_markup
          - endpoints.POST_/programs/family-service-ledgers/{id}/freeze
          - entities.FamilyServiceLedger.fields.accumulated_cents
          - validations[priority=6]
        distinguishing_aspect: "Freezing a ledger is a threshold at the accrual boundary, not at the ledger record: a frozen ledger keeps accepting base allowances and keeps incrementing accumulated_cents, while the stimulation markup that tops research_balance_cents drops to exactly 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; fund SJ-FY26; one eligible MEALS service with base 20000, rate 0.3 and cap 5000."
            - "One allowance already accrued, so the ledger holds 20000 accumulated cents and a 5000 markup, exactly at the cap."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/family-support-services"
              payload: { fund_id: "${fund_id}", service_code: "MEALS-A", display_name: "Meals A", base_allowance_cents: 20000, is_stimulation_eligible: true, stimulation_rate: 0.3, stimulation_cap_cents: 5000 }
              as: PatientSupportOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /programs/family-support-services/${svc_id}/allowances"
              payload: { family_count: 1 }
              as: PatientSupportOfficer
              captures: { ledger_id: $.data.family_service_ledger_id, markup_first: $.data.markup_cents }
          trigger:
            - call: "POST /programs/family-service-ledgers/${ledger_id}/freeze"
              payload: {}
              as: PatientSupportOfficer
              captures: { frozen_status: $.data.status }
            - call: "POST /programs/family-support-services/${svc_id}/allowances"
              payload: { family_count: 2 }
              as: PatientSupportOfficer
              captures: { markup_after_freeze: $.data.markup_cents, allowance_after_freeze: $.data.allowance_cents }
          assert:
            - "the first accrual reported markup_cents == 5000, exactly at the cap"
            - "FamilyServiceLedger.${ledger_id}.status == FROZEN after the freeze"
            - "the post-freeze accrual reports markup_cents == 0"
            - "the post-freeze accrual still reports allowance_after_freeze == 40000, so the base allowance is unaffected by the freeze"
            - "FamilyServiceLedger.${ledger_id}.accumulated_cents == 60000 after the post-freeze accrual"
            - "ResearchFund.${fund_id}.research_balance_cents is unchanged between the two accruals"
            - "ResearchFund.${fund_id}.patient_support_balance_cents fell by 40000 on the post-freeze accrual and not by 45000"

