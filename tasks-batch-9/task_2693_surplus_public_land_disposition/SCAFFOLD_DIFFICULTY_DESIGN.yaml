      - name: conveyance_revert_reverses_fund_credits_leaving_zero_balance
        grounds:
          - state_machines.Conveyance.VIOLATION_NOTICED_to_REVERTED
          - calculations.proceeds_waterfall_allocation
          - entities.Fund.fields.balance_cents
          - entities.Fund.fields.lifetime_credits_cents
          - entities.Fund.fields.lifetime_debits_cents
          - entities.ProceedsAllocation.fields.status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity - the designated-fund ledger across
          FOUR funds, not one bidder's cash. Recording credits 105000001 in four
          ProceedsAllocation rows (one FIXED_RESERVE row of 5000000 plus
          PERCENTAGE rows of 30000000 / 30000000 / 40000001, the last absorbing
          the +1 rounding residual). Reverter enforcement must debit every one
          of those rows symmetrically, so each balance_cents returns to 0 while
          lifetime_credits_cents and lifetime_debits_cents both retain the
          amount posted - the history is preserved, only the balance is undone,
          and the residual-bearing row must be debited by 40000001 rather than
          the un-residualised 40000000. The invariant checked is
          balance_cents == lifetime_credits_cents - lifetime_debits_cents per
          fund, and sum(lifetime_debits_cents) == 105000001 overall.
        test_recipe:
