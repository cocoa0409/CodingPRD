            - "Plan.${plan_a_id}.enrolled_member_count == 0 while ScopeOfAppointment.${soa_id}.status is still CONSUMED"

      - name: ledger_entry_finalized_cannot_be_finalized_again
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CommissionLedgerEntry.transitions.PROVISIONAL_to_FINALIZED
          - errors.ERR_LEDGER_ENTRY_NOT_PROVISIONAL
          - entities.CommissionLedgerEntry.fields.status
        distinguishing_aspect: "Finalization is declared only from PROVISIONAL, so a second finalize on an already FINALIZED entry answers ERR_LEDGER_ENTRY_NOT_PROVISIONAL rather than re-deriving the amount, which keeps the FINAL variant idempotent only in value, not in state."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through effectuation, so an INITIAL entry of 3600.00 sits PROVISIONAL."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
