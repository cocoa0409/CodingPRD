              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /hei/agreements?offer_id=${offer_id}"
              payload: {}
              as: InvestmentAnalyst
              captures: { agr_id: "$.data[0].id" }
            - call: "GET /hei/liens?agreement_id=${agr_id}"
              payload: {}
              as: ClosingAgent
              captures: { lien_id: "$.data[0].id" }
            - call: "POST /hei/liens/${lien_id}/record"
              payload: { title_status: "CLEAR", lien_position: 2 }
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/activate"
              payload: {}
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/initiate-exit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /hei/agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /hei/agreements/${agr_id}/settlements"
              payload: { settlement_type: "SALE", sale_price_cents: 12345650, mortgage_payoff_cents: 1000000, expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              captures: { s_id: $.data.id }
          assert:
            - "Settlement.${s_id}.settlement_fee_cents == 203459"

  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_represent_cycle
        grounds:
          - state_machines.Offer.PRESENTED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_PRESENTED
          - entities.Offer.fields.counter_notes
        distinguishing_aspect: |
          Cyclic shape on the Offer entity: PRESENTED -> COUNTERED -> PRESENTED returns to a prior
          state (negotiation loop), distinct from the Agreement DISPUTED cycle on a different entity.
        test_recipe:
          setup:
            - "Application APPROVED with AVM valuation 80000000; one Offer PRESENTED (investment 10000000)"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F5", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "ho5@x.com", full_name: "Ho Five" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "5 Main St", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /hei/offers/${offer_id}/counter"
              payload: { counter_notes: "offer too low" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/offers/${offer_id}/represent"
              payload: { investment_amount_cents: 9000000 }
              as: InvestmentAnalyst
          assert:
            - "after trigger[0]: Offer.${offer_id}.status == COUNTERED and Offer.${offer_id}.counter_notes == 'offer too low'"
            - "after trigger[1]: Offer.${offer_id}.status == PRESENTED"
            - "Offer.${offer_id}.investment_amount_cents == 9000000"

      - name: agreement_dispute_reproposal_cycle
        grounds:
          - state_machines.Agreement.SETTLEMENT_PROPOSED_to_DISPUTED
          - state_machines.Agreement.DISPUTED_to_SETTLEMENT_PROPOSED
          - state_machines.Dispute.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Cyclic shape on the Agreement entity: SETTLEMENT_PROPOSED -> DISPUTED -> SETTLEMENT_PROPOSED
          loops back after a dispute resolution, distinct from the Offer counter cycle on a different entity.
        test_recipe:
          setup:
            - "AGR-A at EXIT_INITIATED; ComplianceOfficer co-1 proposes SALE settlement (PROPOSED); Homeowner disputes -> Agreement DISPUTED"
            - "Clock at 2028-07-01"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F6", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "ho6@x.com", full_name: "Ho Six" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "6 Main St", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /hei/agreements?offer_id=${offer_id}"
              payload: {}
              as: InvestmentAnalyst
              captures: { agr_id: "$.data[0].id" }
            - call: "GET /hei/liens?agreement_id=${agr_id}"
              payload: {}
              as: ClosingAgent
              captures: { lien_id: "$.data[0].id" }
            - call: "POST /hei/liens/${lien_id}/record"
              payload: { title_status: "CLEAR", lien_position: 2 }
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/activate"
              payload: {}
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/initiate-exit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /hei/agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
            - call: "POST /hei/agreements/${agr_id}/settlements"
              payload: { settlement_type: "SALE", sale_price_cents: 120000000, mortgage_payoff_cents: 40000000, expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { s_id: $.data.id }
            - call: "POST /hei/settlements/${s_id}/dispute"
              payload: { reason: "value too low", disputed_value_cents: 130000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /hei/disputes/${disp_id}/resolve"
              payload: { resolved_value_cents: 125000000 }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
