  # 7. RBAC
  # ==========================================================================
  - section: rbac
    instances:
      - name: corner_each_role_is_denied_the_other_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.HostOperations.exclusive_operations
          - roles.HostController.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.Advisor.exclusive_operations
          - roles.SupplierPortal.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Five cross-role attempts, one per role, each aimed at another role's exclusive operation, all return 403 ERR_UNAUTHORIZED — including HostOperations being locked out of the settlement math and HostController being locked out of advisor activation, which is what makes the segregation of duties structural rather than advisory."
        test_recipe:
          setup:
            - "One split schedule, one supplier, one DRAFT advisor with one PENDING_REVIEW credential and one OPEN settlement run — enough state for each denied call to have a real target."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/suppliers"
              payload: { name: "Meridian Air", accreditation_scheme: "ARC", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 9000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-08" }
              as: HostOperations
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /host-agency/settlement-runs/${run_id}/calculate"
              payload: {}
              as: HostOperations
              captures: { err_ops_calculates: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { err_ctrl_activates: $.data.error_id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Unwanted Advisor", email: "unwanted@example.com", seller_of_travel_state: "NY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_co_onboards: $.data.error_id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { err_advisor_verifies: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/suspend"
              payload: { reason: "Supplier dispute" }
              as: SupplierPortal
              as_user_id: "${sup_id}"
              captures: { err_supplier_suspends: $.data.error_id }
          assert:
            - "all five calls return HTTP 403 with error_id ERR_UNAUTHORIZED: err_ops_calculates, err_ctrl_activates, err_co_onboards, err_advisor_verifies and err_supplier_suspends"
            - "SettlementRun.${run_id}.status is still OPEN and calculated_by_user_id is still null"
            - "Advisor.${adv_id}.status is still DRAFT — neither the HostController activation nor the SupplierPortal suspension took effect"
            - "GET /host-agency/advisors reports total_count == 1: the ComplianceOfficer onboarding attempt created nothing"
            - "ComplianceCredential.${cr_sot_id}.status is still PENDING_REVIEW and decided_by_user_id is still null"
            - "each role's own exclusive operations remain reachable: the setup proves HostOperations can onboard, sign and open a run, and the credential is later verified by ComplianceOfficer in every other instance"

      - name: corner_clock_is_shared_by_the_three_opaque_roles_only
        claim_type: shared_operations
        grounds:
          - roles.HostOperations.shared_operations
          - roles.HostController.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - endpoints["POST /host-agency/_clock/set_current_utc"]
        distinguishing_aspect: "The clock is the one write shared by all three opaque roles and by none of the entity-backed roles: HostOperations, HostController and ComplianceOfficer each advance it successfully in turn, while Advisor and SupplierPortal are refused with 403 ERR_UNAUTHORIZED and the clock does not move."
        test_recipe:
          setup:
            - "One supplier (for the SupplierPortal identity) and one DRAFT advisor (for the Advisor identity)."
          setup_api_calls:
            - call: "POST /host-agency/suppliers"
              payload: { name: "Meridian Air", accreditation_scheme: "ARC", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 9000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: HostOperations
              captures: { clock_ops: $.data.current_utc }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: HostController
              as_user_id: "ctrl-1"
              captures: { clock_ctrl: $.data.current_utc }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { clock_co: $.data.current_utc, expired_count: $.data.expired_credential_count }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { err_advisor_clock: $.data.error_id }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplierPortal
              as_user_id: "${sup_id}"
              captures: { err_supplier_clock: $.data.error_id }
          assert:
            - "SHARED WRITE: clock_ops == \"2026-08-02T00:00:00Z\", clock_ctrl == \"2026-08-03T00:00:00Z\" and clock_co == \"2026-08-04T00:00:00Z\""
            - "expired_count == 0 and refreshed_claim_count == 0 because no credential or claim exists yet"
            - "ENTITY-BACKED ROLES REFUSED: err_advisor_clock == ERR_UNAUTHORIZED and err_supplier_clock == ERR_UNAUTHORIZED, both HTTP 403"
            - "the clock is still 2026-08-04T00:00:00Z after both refusals, so a denied call cannot move time"
            - "all five roles can still read: GET /host-agency/advisors/${adv_id} succeeds for Advisor and SupplierPortal as well"

