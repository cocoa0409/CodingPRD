      - name: claim_by_non_offered_agent_returns_403
        claim_type: rbac_denial
        grounds: ["errors[ERR_NOT_OFFERED_TO_AGENT]", state_machines.Lead.OFFERED_to_CLAIMED]
        distinguishing_aspect: "Ownership-scoped identity check: an ACTIVE agent who is not the offered agent on the current assignment gets ERR_NOT_OFFERED_TO_AGENT (403), not a state error — the lead is validly OFFERED."
