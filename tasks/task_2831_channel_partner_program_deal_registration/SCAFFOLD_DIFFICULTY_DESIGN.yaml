            - "immediately after that refusal DealRegistration.${rw1_id}.status == APPROVED (the sweep did not fire one millisecond early)"
            - "the submit at 2026-05-01T00:00:00.000Z succeeds and sets DealRegistration.${rl1_id}.status == SUBMITTED with submitted_at == 2026-05-01T00:00:00.000Z"
            - "DealRegistration.${rw1_id}.status == EXPIRED, closure_reason == WINDOW_ELAPSED, registration_margin_uplift_pct == 0.02"
            - "Account.${acc1_id}.coverage_state == OPEN_CHANNEL with protected_until == null, protected_partner_id == null and protected_product_line == null"
            - "DealRegistration.${rl1_id}.revision_round == 0 (a first submit from DRAFT never touches the revision counter)"

      - name: zero_verified_proofs_blocks_claim_validation
        grounds:
          - validations[priority=42]
          - calculations.mdf_claim_approval
          - state_machines.MdfClaim.validation_state_SUBMITTED_to_VALIDATED
          - errors[ERR_NO_VERIFIED_PROOF]
          - entities.ProofOfPerformance.fields.verified
        distinguishing_aspect: |
          A different metric on a different endpoint: an EMPTY-SET boundary (zero verified proof
          rows) probed through POST /mdf-claims/{id}/validate, where two attached but unverified
          proofs still count as an empty input set and yield ERR_NO_VERIFIED_PROOF; verifying one
