              payload: { slot_start: "2026-09-02T11:00:00Z", slot_end: "2026-09-02T12:00:00Z" }
              as: Buyer
              as_user_id: "${m5}"
              captures: { gp5: $.data.id }
          assert:
            - "GatePass.${gp5} created with status ISSUED — slot 11:00-12:00 touches the occupied 10:00-11:00 window at the boundary and half-open [start, end) semantics mean zero overlap"
            - "GET /sales/${sale5}/gate-passes returns exactly 1 row"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: on_approval_reject_restores_full_pre_listing_state
        grounds:
          - state_machines.Vehicle.LIVE_to_ON_APPROVAL_PENDING
          - state_machines.Vehicle.ON_APPROVAL_PENDING_to_SALE_READY
          - entities.Bid.fields.is_winning
        distinguishing_aspect: |
          Conserved quantity: the vehicle's availability identity
          (status == SALE_READY AND zero non-CANCELLED sales AND zero
          is_winning bids AND zero QUEUED/LIVE items). The forward chain
          list -> open -> bid -> close (ON_APPROVAL) paired with its
          compensating reject-offer MUST restore all four conjuncts exactly;
          any drift (lingering is_winning, lingering PENDING_APPROVAL sale)
          violates the invariant.
        test_recipe:
          setup:
            - "CA yard; STANDARD seller; ON_APPROVAL vehicle (reserve 500000) SALE_READY — invariant holds."
            - "Listed into A1, opened, one live bid 300000, closed to ON_APPROVAL_PENDING."
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/members"
              payload: { email: "b1@x.com", full_name: "Buyer One", home_state: "CA", tier: "BASIC" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 500000, sale_type: "ON_APPROVAL", odometer_reading: 50000, damage_codes: ["FRONT"] }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/title"
              payload: { title_type: "SALVAGE" }
              as: TitleClerk
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/condition"
              payload: { primary_damage: "FRONT", run_and_drive_status: "RUN_AND_DRIVE" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/1" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/2" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/3" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/4" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/5" }
              as: YardOperator
            - call: "GET /salvage-auction/vehicles/${vehicle_id}"
              payload: {}
              as: YardOperator
              captures: { vehicle_v: $.data.version }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/mark-ready"
              payload: { expected_vehicle_version: "${vehicle_v}" }
              as: YardOperator
            - call: "POST /salvage-auction/auctions"
              payload: { name: "A1", scheduled_start: "2026-09-01T00:00:00Z" }
              as: Auctioneer
              captures: { auc1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/items"
              payload: { vehicle_id: "${vehicle_id}" }
              as: Auctioneer
              captures: { item1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/start"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/auctions/${auc1}/items/${item1}/open-lot"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/bids"
              payload: { auction_item_id: "${item1}", amount_cents: 300000 }
              as: Buyer
              as_user_id: "${member_id}"
              captures: { bid1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/items/${item1}/close-lot"
              payload: {}
              as: Auctioneer
              captures: { sale1: $.data.id }
          trigger:
            - call: "POST /salvage-auction/sales/${sale1}/reject-offer"
              payload: {}
              as: SellerAgent
