            - "One ACTIVE COORDINATOR StaffMember with min_rest_minutes 0 and max_daily_minutes 480; shift A1 on E1 08:00Z..12:00Z already CONFIRMED (240 minutes)."
            - "Shift A2 on E2 12:01Z..17:00Z created and still PROPOSED (299 minutes)."
