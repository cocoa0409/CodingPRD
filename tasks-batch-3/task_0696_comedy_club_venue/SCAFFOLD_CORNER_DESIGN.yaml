# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Comedy Club & Live-Show Venue — breadth probe over §1.1-§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Venue.fields.posture", "entities.Venue.fields.house_fee_pct"]
        distinguishing_aspect: "POST /venues with name+settlement_currency returns 201, posture==OPEN, house_fee_pct default 0.20, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Solo Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id, posture: $.data.posture, hf: $.data.house_fee_pct, v: $.data.version }
          assert:
            - "response code == 201"
            - "Venue.posture == OPEN"
            - "Venue.house_fee_pct == 0.20"
            - "Venue.version == 1"

      - name: get_show_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Show", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shows/{non-existent uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shows/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_reservation_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.Reservation.fields.party_size", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /reservations omitting party_size returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["GA show ON_SALE with a GA tier."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Req Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Req Night", starts_at: "2026-05-01T03:00:00Z", ends_at: "2026-05-01T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
          trigger:
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-rq" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: section_kind_requires_ga_capacity_when_ga
        claim_type: Type Constraints
        grounds: ["entities.SeatingSection.fields.ga_capacity", "entities.SeatingSection.fields.kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Creating a GA section without ga_capacity returns ERR_INVALID_REQUEST 422 (ga_capacity required iff kind==GA)."
        test_recipe:
          setup: ["A DRAFT show exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Kind Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Kind Night", starts_at: "2026-05-02T03:00:00Z", ends_at: "2026-05-02T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "No Cap" }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: ticket_charge_computed_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.Reservation.fields.ticket_charge_cents", "calculations.compute_ticket_charge"]
        distinguishing_aspect: "ticket_charge_cents is server-computed (tier.price_cents * party_size == 9000 for price 4500 x party 2); a client cannot set it (not in POST /reservations input)."
        test_recipe:
          setup: ["GA show ON_SALE, tier price 4500."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Comp Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Comp Night", starts_at: "2026-05-03T03:00:00Z", ends_at: "2026-05-03T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
          trigger:
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-cc", party_size: 2 }
              as: BoxOffice
              captures: { charge: $.data.ticket_charge_cents }
          assert:
            - "Reservation.ticket_charge_cents == 9000"

      - name: comp_reservation_zero_ticket_charge
        claim_type: Computed Fields
        grounds: ["entities.Reservation.fields.is_comp", "entities.Reservation.fields.ticket_charge_cents"]
        distinguishing_aspect: "is_comp==true reservation has ticket_charge_cents==0 regardless of tier price."
        test_recipe:
          setup: ["GA show ON_SALE, tier price 4500."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Comp2 Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Comp2 Night", starts_at: "2026-05-04T03:00:00Z", ends_at: "2026-05-04T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
          trigger:
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-cz", party_size: 2, is_comp: true }
              as: BoxOffice
              captures: { charge: $.data.ticket_charge_cents }
          assert:
            - "Reservation.ticket_charge_cents == 0"

      - name: list_shows_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints", "entities.Show"]
        distinguishing_aspect: "GET /shows?venue_id=... returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["One venue with one show."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "List Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "List Night", starts_at: "2026-05-05T03:00:00Z", ends_at: "2026-05-05T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
          trigger:
            - call: "GET /shows?venue_id=${venue_id}"
              payload: {}
              as: Booker
          assert:
            - "response_type == array"
            - "meta.total_count == 1 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_voids_issued_tickets
        claim_type: Side Effect Execution
        grounds: ["state_machines.Reservation.BOOKED_to_CANCELLED", "entities.Ticket.fields.scan_state"]
        distinguishing_aspect: "Cancelling a TICKET_PAID reservation (party 2 -> 2 ISSUED tickets) cascades all its tickets to scan_state==VOID."
        test_recipe:
          setup: ["GA show ON_SALE; reservation party_size 2 collected to TICKET_PAID (2 ISSUED tickets)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Void Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Void Night", starts_at: "2026-06-05T03:00:00Z", ends_at: "2026-06-05T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-vd", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/collect-ticket"
              payload: {}
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: BoxOffice
            - call: "GET /tickets?reservation_id=${res_id}"
              payload: {}
              as: BoxOffice
          assert:
            - "GET /tickets?reservation_id=${res_id} returns 2 tickets, every ticket scan_state == VOID"
            - "Reservation.${res_id}.booking_status == CANCELLED"

      - name: cancel_already_cancelled_reservation_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.BOOKED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a Reservation already CANCELLED returns ERR_INVALID_STATE 409; no second refund fires."
        test_recipe:
          setup: ["GA show ON_SALE; a reservation booked then cancelled."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dbl Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Dbl Night", starts_at: "2026-05-06T03:00:00Z", ends_at: "2026-05-06T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-dx", party_size: 1 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: initial_state_show_is_draft
        claim_type: Initial State
        grounds: ["state_machines.Show.initial_state", "entities.Show.fields.status"]
        distinguishing_aspect: "A freshly created Show has status==DRAFT and is_private==false."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Init Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Init Night", starts_at: "2026-05-07T03:00:00Z", ends_at: "2026-05-07T05:00:00Z" }
              as: Booker
              captures: { st: $.data.status, ip: $.data.is_private }
          assert:
            - "Show.status == DRAFT"
            - "Show.is_private == false"

      - name: publish_requires_section_and_tier
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Show.DRAFT_to_ON_SALE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a DRAFT show with zero sections is rejected with ERR_INVALID_STATE 409 (publish precondition: at least one section and one tier)."
        test_recipe:
          setup: ["A DRAFT show with no sections/tiers."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Pub Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Pub Night", starts_at: "2026-05-08T03:00:00Z", ends_at: "2026-05-08T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: terminal_settled_show_rejects_cancel
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Show.terminal_states", "state_machines.Show.ON_SALE_to_CANCELLED"]
        distinguishing_aspect: "A SETTLED show (terminal) rejects cancel with ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A GA show ended, settlement opened and finalized -> show SETTLED."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Term Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Term Night", starts_at: "2026-05-09T03:00:00Z", ends_at: "2026-05-09T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T06:00:00Z" }
              as: FloorManager
            - call: "POST /settlements"
              payload: { show_id: "${show_id}" }
              as: FloorManager
              captures: { settle_id: $.data.id }
            - call: "POST /settlements/${settle_id}/finalize"
              payload: {}
              as: FloorManager
          trigger:
            - call: "POST /venues/${venue_id}/shows/${show_id}/cancel"
              payload: {}
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: ga_sold_out_auto_transition_already_in_18
        claim_type: Valid Transition
        grounds: ["state_machines.Show.ON_SALE_to_SOLD_OUT"]
        excluded_because:
          difficulty_instance: boundary_precision_check / ga_capacity_exact_vs_over_by_one
          rationale: "The ON_SALE->SOLD_OUT auto-transition at exact GA capacity is asserted by the named §1.8 boundary instance."

      - name: private_event_held_moves_show_to_private_held
        claim_type: Side Effect Execution
        grounds: ["state_machines.Show.DRAFT_to_PRIVATE_HELD", "entities.Show.fields.is_private"]
        distinguishing_aspect: "Creating a HELD PrivateEvent on a DRAFT show moves Show.status to PRIVATE_HELD and is_private to true."
        test_recipe:
          setup: ["A DRAFT show with no reservations."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Priv Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Priv Night", starts_at: "2026-05-10T03:00:00Z", ends_at: "2026-05-10T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /private-events"
              payload: { show_id: "${show_id}", client_name: "Gamma", buyout_fee_cents: 300000 }
              as: Booker
              captures: { pe_id: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: Booker
              captures: { st: $.data.status, ip: $.data.is_private }
          assert:
            - "Show.${show_id}.status == PRIVATE_HELD"
            - "Show.${show_id}.is_private == true"

      - name: buyout_cancel_reverts_show_to_on_sale
        claim_type: Side Effect Execution
        grounds: ["state_machines.PrivateEvent.HELD_to_CANCELLED", "state_machines.Show.PRIVATE_HELD_to_ON_SALE"]
        distinguishing_aspect: "Cancelling the only HELD buyout reverts the underlying Show from PRIVATE_HELD to ON_SALE and is_private back to false; deposit_cents retained."
        test_recipe:
          setup: ["A DRAFT show with a HELD PrivateEvent (deposit 0.25 of 400000 == 100000)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Revert Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Revert Night", starts_at: "2026-05-11T03:00:00Z", ends_at: "2026-05-11T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /private-events"
              payload: { show_id: "${show_id}", client_name: "Delta", buyout_fee_cents: 400000, deposit_pct: 0.25 }
              as: Booker
              captures: { pe_id: $.data.id, dep: $.data.deposit_cents }
          trigger:
            - call: "POST /private-events/${pe_id}/cancel"
              payload: {}
              as: Booker
              captures: { pst: $.data.status, dep2: $.data.deposit_cents }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: Booker
              captures: { st: $.data.status }
          assert:
            - "PrivateEvent.${pe_id}.status == CANCELLED"
            - "PrivateEvent.${pe_id}.deposit_cents == 100000 (retained)"
            - "Show.${show_id}.status == ON_SALE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: buyout_deposit_round_half_up
        claim_type: Correct Result
        grounds: ["calculations.compute_buyout_deposit", "entities.PrivateEvent.fields.deposit_cents"]
        distinguishing_aspect: "compute_buyout_deposit applies round_half_up: deposit_pct 0.25 * buyout 333333 == 83333.25 -> 83333."
        test_recipe:
          setup: ["A DRAFT show; a buyout with deposit_pct 0.25 and buyout_fee_cents 333333."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dep Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Dep Night", starts_at: "2026-05-12T03:00:00Z", ends_at: "2026-05-12T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /private-events"
              payload: { show_id: "${show_id}", client_name: "Epsilon", buyout_fee_cents: 333333, deposit_pct: 0.25 }
              as: Booker
              captures: { dep: $.data.deposit_cents }
          assert:
            - "PrivateEvent.deposit_cents == 83333"

      - name: minimum_due_tier_override_precedence
        claim_type: Constants Applied
        grounds: ["calculations.compute_minimum_due", "entities.TicketTier.fields.min_items_override"]
        distinguishing_aspect: "tier.min_items_override=5 wins over the venue default 2: minimum_due_cents == 5 * 1000 * party 2 == 10000 at creation."
        test_recipe:
          setup: ["GA show ON_SALE, tier with min_items_override=5, party_size 2."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Ovr Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Ovr Night", starts_at: "2026-05-13T03:00:00Z", ends_at: "2026-05-13T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA Premium", price_cents: 6000, min_items_override: 5 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
          trigger:
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-ov", party_size: 2 }
              as: BoxOffice
              captures: { mind: $.data.minimum_due_cents }
          assert:
            - "Reservation.minimum_due_cents == 10000"

      - name: exchange_downsell_credits_difference
        claim_type: Variant Divergence
        grounds: ["calculations.compute_refund", "state_machines.Reservation.BOOKED_to_EXCHANGED", "entities.Reservation.fields.refunded_cents"]
        distinguishing_aspect: "Exchange from a paid VIP tier (price 9000, party 2 -> charge 18000) down to a GA tier (price 4500, party 2 -> charge 9000) credits max(0, 18000-9000)==9000 on the old EXCHANGED row; new row created BOOKED."
        test_recipe:
          setup: ["A show with two GA sections+tiers: VIP price 9000 and GA price 4500; a BOOKED party_size=2 on VIP collected to TICKET_PAID (charge 18000)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Exch Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Exch Night", starts_at: "2026-05-14T03:00:00Z", ends_at: "2026-05-14T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "VIP Standing", ga_capacity: 50 }
              as: Booker
              captures: { vip_section: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Reg Standing", ga_capacity: 50 }
              as: Booker
              captures: { ga_section: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${vip_section}", name: "VIP", price_cents: 9000 }
              as: Booker
              captures: { vip_tier: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${ga_section}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { ga_tier: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${vip_section}", tier_id: "${vip_tier}", patron_id: "patron-ex", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/collect-ticket"
              payload: {}
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${res_id}/exchange"
              payload: { target_section_id: "${ga_section}", target_tier_id: "${ga_tier}" }
              as: BoxOffice
              captures: { bk: $.data.booking_status, ref: $.data.refunded_cents }
          assert:
            - "Reservation.${res_id}.booking_status == EXCHANGED"
            - "Reservation.${res_id}.refunded_cents == 9000"
            - "Reservation.${res_id}.settlement_status == REFUNDED"

