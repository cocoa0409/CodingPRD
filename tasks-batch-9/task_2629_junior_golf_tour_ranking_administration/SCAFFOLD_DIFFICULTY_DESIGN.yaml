  - rule_id: compensating_invariant
    instances:

      - name: assistance_ledger_restored_exactly_by_predeadline_withdrawal
        grounds:
          - calculations.season_assistance_ledger
          - state_machines.Entry.APPLIED_to_WITHDRAWN
          - entities.Season.fields.assistance_available_cents
          - entities.Season.fields.assistance_committed_cents
          - entities.AidApplication.fields.consumed_cents
        distinguishing_aspect: |
          The settle/withdraw compensating PAIR. Filing the entry moves 28800 cents
          available -> committed and adds 28800 to AidApplication.consumed_cents; withdrawing before
          the field is set must reverse all three legs exactly, returning available to its
          byte-for-byte pre-settlement value of 500000 with committed 0, disbursed 0 and
          consumed_cents 0, so invariant L1 (budget == available + committed + disbursed) holds on
          both sides. The pre-deadline branch must NOT touch disbursed and must NOT increment
          Member.late_withdrawal_count - an implementation that reuses the forfeit branch leaves
          28800 stranded in disbursed and the ledger reads 500000 = 471200 + 0 + 28800, which still
          satisfies L1 while being wrong, so the per-bucket assertions are what catch it.
        test_recipe:
          setup:
            - "One season funded at exactly 500000 cents."
            - "m1 VERIFIED, holding an APPROVED AidApplication at covered_pct 0.90 (household_income_cents 6000000 over 3 dependents)."
            - "One REGIONAL tournament in ENTRY_OPEN with entry_fee_cents 32000 and withdrawal_deadline_at 2026-09-05T00:00:00Z."
            - "m1 files an assisted entry at 2026-08-10T00:00:00Z - outside the 72-hour late window, so no surcharge - producing aid_award_cents 28800 and net_fee_due_cents 3200, which is left unpaid."
            - "The clock advances to 2026-08-20T00:00:00Z, still far inside the withdrawal window and still with the tournament in ENTRY_OPEN."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id, avail0: $.data.assistance_available_cents } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin, captures: { m1_v: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 6000000, dependents: 3, expected_member_version: "${m1_v}" }, as: Member, as_user_id: "${m1_id}", captures: { app_id: $.data.id } }
            - { call: "POST /aid-applications/${app_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { pct: $.data.covered_pct } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 32000, round_count: 2, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}", aid_application_id: "${app_id}", request_assistance: true }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id, award: $.data.aid_award_cents, net0: $.data.net_fee_due_cents } }
            - { call: "GET /seasons/${season_id}", payload: {}, as: TourAdmin, captures: { avail1: $.data.assistance_available_cents, comm1: $.data.assistance_committed_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00Z" }, as: Anonymous }
          trigger:
            - { call: "POST /entries/${e1_id}/withdraw", payload: { reason: "family travel conflict" }, as: Member, as_user_id: "${m1_id}", captures: { st: $.data.entry_status, fs: $.data.fee_status, refund: $.data.refunded_cents } }
          assert:
            - "${avail0} == 500000"
            - "${pct} == 0.90"
            - "${award} == 28800"
            - "${net0} == 3200"
            - "${avail1} == 471200"
            - "${comm1} == 28800"
            - "${st} == WITHDRAWN"
            - "${fs} == REFUNDED"
            - "${refund} == 0"
            - "Season.${season_id}.assistance_available_cents == 500000"
            - "Season.${season_id}.assistance_committed_cents == 0"
            - "Season.${season_id}.assistance_disbursed_cents == 0"
            - "AidApplication.${app_id}.consumed_cents == 0"
            - "Member.${m1_id}.late_withdrawal_count == 0"
            - "Tournament.${t1_id}.entry_count == 1"
            - "Tournament.${t1_id}.applied_count == 0"
            - "Tournament.${t1_id}.closed_count == 1"

      - name: slot_census_conserved_by_withdrawal_answered_with_promotion
        grounds:
          - calculations.tournament_slot_census
          - state_machines.Entry.ACCEPTED_to_WITHDRAWN
          - state_machines.Entry.WAITLISTED_to_ACCEPTED
          - entities.Tournament.fields.open_slot_count
          - entities.Entry.fields.waitlist_position
        distinguishing_aspect: |
          Invariant S3 - a DIFFERENT conserved quantity from the money ledger: the three-bucket
          census. A single withdraw call performs two compensating row moves (accepted -> closed and
          waitlist -> accepted), so accepted_count returns to 1 and open_slot_count returns to 0,
          exactly their pre-withdrawal values, while accepted + waitlist + closed stays 3 and S2
          still reconciles against entry_count 3. Waitlist positions must also renumber, so the third
          entry moves from position 2 to position 1 with no gap. An implementation that frees the slot
          without promoting leaves open_slot_count at 1; one that promotes without renumbering leaves
          a hole at position 1.
        test_recipe:
          setup:
            - "One season; m1, m2 and m3 all VERIFIED U17, none of them assisted, so the money ledger stays flat and only the census moves."
            - "One REGIONAL tournament with field_size_limit 1 and withdrawal_deadline_at 2026-09-05T00:00:00Z."
            - "The three entries are filed one hour apart, so the unranked priority tie breaks on submitted_at ascending: m1 is seated, m2 takes waitlist_position 1, m3 waitlist_position 2."
            - "The field is set at 2026-09-01T00:00:00Z, then the clock moves to 2026-09-02T00:00:00Z - still strictly before the withdrawal deadline, so the withdrawal is compensated rather than forfeited."
          setup_api_calls:
