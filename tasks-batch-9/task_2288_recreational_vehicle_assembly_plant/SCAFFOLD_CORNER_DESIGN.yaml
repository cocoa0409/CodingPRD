          assert:
            - "iw_1 == true at exactly 365 days (the comparison is <= WARRANTY_DAYS)"
            - "tier_1 == TIER_A and both claims carry labor_reimbursement_cents 27300 and parts_reimbursement_cents 78200, so schedule_subtotal_cents is 105500 on both"
            - "gw_1 == 21100 (the 20 percent pct_cap beats the 60000 request and the 75000 tier cap) and tot_1 == 126600"
            - "iw_2 == false at 366 days"
            - "tier_2 == TIER_A — the tier is derived from the unpaid subtotal, so variant selection does not move it"
            - "gw_2 == 21100 (the 50000 out-of-warranty cap is not the binding ceiling here) and tot_2 == 21100: the schedule is recorded but not paid"
            - "supplier_chargeback_cents == 0 on both claims because component_lot_id is null"
            - "Dealer.${dlr_id}.goodwill_used_cents == 42200 after both approvals"

      - name: dealer_exposure_reconciles_with_the_sum_of_its_funded_orders
        claim_type: reconciliation
        grounds:
