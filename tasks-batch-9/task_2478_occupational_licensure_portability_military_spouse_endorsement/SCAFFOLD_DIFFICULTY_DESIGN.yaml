              as: Evaluator
              as_user_id: "${evr1}"
          assert:
            - "The first trigger call returns HTTP 422 with data.error_id == ERR_NO_OPEN_REVIEW_ASSIGNMENT"
            - "The second trigger call returns HTTP 200"
