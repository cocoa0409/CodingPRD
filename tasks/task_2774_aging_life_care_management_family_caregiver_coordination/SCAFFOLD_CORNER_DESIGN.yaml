  - section: endpoints
    instances:
      - name: narrative_correction_on_accepted_assessment_stales_the_pinned_plan
        claim_type: conditional_action
        grounds:
          - endpoints[PATCH /care/assessments/{assessmentId}]
          - validations[priority 43].ERR_PINNED_ASSESSMENT_STALE
          - entities.CarePlan.fields.pinned_assessment_version
        distinguishing_aspect: "A narrative-only correction is accepted on an ACCEPTED assessment and bumps its version, which permanently stales an existing plan's pinned_assessment_version (ERR_PINNED_ASSESSMENT_STALE on family approval), while a domain_scores edit on the same row is refused."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, Client Bea, surrogate Cai; one ACCEPTED assessment and one DRAFT care plan created from it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Bea Lindgren", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Cai Lindgren", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 }, narrative: "Initial narrative." }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { asm_v_accepted: $.data.version, asm_status: $.data.status }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Weekly medication oversight"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id, pinned: $.data.pinned_assessment_version }
          trigger:
            - call: "PATCH /care/assessments/${asm}"
              payload: { domain_scores: { adl: 5, cognition: 5, medical_complexity: 5, social_support: 5, safety: 5, finances: 5 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_scores: $.data.error_id }
            - call: "PATCH /care/assessments/${asm}"
              payload: { narrative: "Corrected narrative: PCP name misspelled in the accepted version." }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm_v_after: $.data.version, status_after: $.data.status, acuity_after: $.data.comprehensive_acuity }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_pinned: $.data.error_id }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v2: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v2}", goals: ["Weekly medication oversight (re-authored)"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp2: $.data.id, pinned2: $.data.pinned_assessment_version }
            - call: "PATCH /care/care-plans/${cp2}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp2_status: $.data.status }
          assert:
            - "The plan pins the assessment at creation: CarePlan.${cp}.pinned_assessment_version == ${asm_v_accepted}"
            - "The domain_scores edit returns HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\" — scores are editable only while the assessment is DRAFT — and Assessment.${asm}.version is unchanged"
            - "The narrative correction returns HTTP 200 with data.status still \"ACCEPTED\", data.version == ${asm_v_accepted} + 1, and data.comprehensive_acuity unchanged at 40"
            - "Sending the old plan for family approval returns HTTP 409 with data.error_id == \"ERR_PINNED_ASSESSMENT_STALE\" and CarePlan.${cp}.status is still \"DRAFT\""
            - "A plan re-authored after the correction pins the new version (pinned_assessment_version == ${asm_v_after}) and reaches \"PENDING_FAMILY_APPROVAL\""
            - "Priority 42 does not fire on either plan: the source assessment is still ACCEPTED throughout"

      - name: invoice_payments_partial_then_exact_and_overpayment_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /care/invoices/{invoiceId}/payments]
          - state_machines.Invoice.ISSUED_to_PAID
          - validations[priority 74].ERR_PAYMENT_EXCEEDS_BALANCE
        distinguishing_aspect: "A payment smaller than balance_due_cents accumulates into amount_paid_cents and leaves the invoice ISSUED, a payment that would exceed the balance is refused with ERR_PAYMENT_EXCEEDS_BALANCE, only the exact remainder moves the invoice to PAID, and PAID is terminal."
        test_recipe:
          setup:
            - "CareManager Dana (hourly_rate_cents 22500), supervisor Iris, billing admin, Client Dov (billing_increment_min 15, retainer_floor_cents 0, zero retainer)."
            - "One APPROVED 60-minute CARE_COORDINATION entry on 2026-08-10; an invoice over 2026-08-01..2026-08-31 taken to ISSUED (total_due_cents 24075, retainer_applied_cents 0, balance_due_cents 24075)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Dov Halvorsen", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingAdministrator
              captures: { inv: $.data.id }
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { bal: $.data.balance_due_cents, paid0: $.data.amount_paid_cents }
          trigger:
            - call: "POST /care/invoices/${inv}/payments"
              payload: { amount_cents: 10000, received_at: "2026-08-11T10:00:00Z", method: "ACH" }
              as: BillingAdministrator
              captures: { paid1: $.data.amount_paid_cents, status1: $.data.status }
            - call: "POST /care/invoices/${inv}/payments"
              payload: { amount_cents: 20000, received_at: "2026-08-11T10:05:00Z", method: "ACH" }
              as: BillingAdministrator
              captures: { err_over: $.data.error_id }
            - call: "POST /care/invoices/${inv}/payments"
              payload: { amount_cents: 14075, received_at: "2026-08-11T10:10:00Z", method: "CHECK" }
              as: BillingAdministrator
              captures: { paid2: $.data.amount_paid_cents, status2: $.data.status }
            - call: "POST /care/invoices/${inv}/payments"
              payload: { amount_cents: 1, received_at: "2026-08-11T10:15:00Z", method: "CHECK" }
              as: BillingAdministrator
              captures: { err_terminal: $.data.error_id }
          assert:
            - "At issue: balance_due_cents == 24075, retainer_applied_cents == 0, amount_paid_cents == 0, status == \"ISSUED\""
            - "The 10000 payment returns HTTP 200 with amount_paid_cents == 10000 and status still \"ISSUED\" — a partial payment is not a transition"
            - "The 20000 payment returns HTTP 422 with data.error_id == \"ERR_PAYMENT_EXCEEDS_BALANCE\" (10000 + 20000 > 24075) and amount_paid_cents stays 10000"
            - "The exact remainder 14075 returns HTTP 200 with amount_paid_cents == 24075 and status == \"PAID\""
            - "A further 1-cent payment returns HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\" — PAID is terminal"
            - "Client.${cli}.retainer_balance_cents is still 0 throughout: payments settle the family balance, they are not retainer deposits"

