              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac2_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /facilities/${fac2_id}/custodians"
              payload: { custodian_name: "Second Doc Custody NA", wet_receipt_deadline_hours: 48 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cust2_id: "$.data.id" }
            - *c_get_fac_v1
          trigger:
            - call: "GET /custodians/${cust2_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust2_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 2000000000
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "GET /custodians/${cust2_id} returns HTTP 200 — the row exists and is readable"
            - "the cross-facility advance returns HTTP 404 with data.error_id == ERR_CUSTODIAN_NOT_FOUND"
            - "GET /advances with facility_id=${fac_id} returns total_count == 0"
            - "WarehouseFacility.${fac_id}.version is unchanged — a rejected booking does not bump the OCC token"

      - name: corner_entity_entity_backed_role_cross_aggregate_read_mismatch
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_RESOURCE_MISMATCH
          - roles.Borrower
          - endpoints["GET /facilities/{id}"]
          - endpoints["GET /facilities/{id}/exposure-summary"]
        distinguishing_aspect: |
          The Borrower role's identity is entity_backed:WarehouseFacility, so a Borrower
          whose X-User-ID is F2 reading F1 gets 404 ERR_RESOURCE_MISMATCH — not 403, because
          the role itself is authorised for the endpoint and only the aggregate ownership
          check fails at priority 4.
        test_recipe:
          setup:
            - "Two ACTIVE facilities F1 and F2, each with a CONFORMING rate row."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Keystone Home Loans Inc"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "8802"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac2_id: "$.data.id" }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Borrower
              as_user_id: "${fac2_id}"
            - call: "GET /facilities/${fac_id}/exposure-summary"
              payload: {}
              as: Borrower
              as_user_id: "${fac2_id}"
            - call: "GET /facilities/${fac2_id}"
              payload: {}
              as: Borrower
              as_user_id: "${fac2_id}"
          assert:
            - "the cross-aggregate facility read returns HTTP 404 with data.error_id == ERR_RESOURCE_MISMATCH"
            - "the cross-aggregate exposure-summary read returns HTTP 404 with data.error_id == ERR_RESOURCE_MISMATCH"
            - "the own-aggregate read returns HTTP 200 with data.id == ${fac2_id}"
            - "the 404 is ERR_RESOURCE_MISMATCH, never ERR_FACILITY_NOT_FOUND, because the row does exist"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_sm_investor_pending_to_approved_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.TakeoutInvestor.status.PENDING_APPROVAL_to_APPROVED
          - endpoints["POST /investors/{id}/approve"]
        distinguishing_aspect: |
          The approval stamps approved_at from the logical clock and bumps only the
          investor's own version — the facility, its commitments and its advances are all
          untouched, because investor approval is a counterparty-list event and not a
          credit event.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility with one PENDING_APPROVAL TakeoutInvestor and no commitments."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_ver_before: "$.data.version" }
          trigger:
            - call: "POST /investors/${inv_a_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_ver_after: "$.data.version" }
          assert:
            - "HTTP 200 and TakeoutInvestor.${inv_a_id}.status == APPROVED"
            - "TakeoutInvestor.${inv_a_id}.approved_at == 2026-08-01T00:00:00Z"
            - "inv_ver_after == 2 — the create left version 1"
            - "TakeoutInvestor.${inv_a_id}.exposure_cents == 0 and concentration_limit_pct == 0.60"
            - "WarehouseFacility.${fac_id}.version == fac_ver_before — approving a counterparty is not a facility write"
            - "WarehouseFacility.${fac_id}.status == ACTIVE"
            - "GET /facilities/${fac_id}/investors with status=APPROVED returns total_count == 1"

      - name: corner_sm_fund_requires_verified_wire_precondition
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=19]
          - errors.ERR_WIRE_NOT_VERIFIED
          - state_machines.Advance.funding_status.REQUESTED_to_FUNDED
          - endpoints["POST /advances/{id}/fund"]
        distinguishing_aspect: |
          Every other precondition of REQUESTED -> FUNDED is satisfied — ACTIVE facility,
          APPROVED custodian, CLEAR receipt, live commitment, ample headroom — and the
          single unmet one is the wire still sitting in PENDING_VERIFICATION, so the call
          fails 409 ERR_WIRE_NOT_VERIFIED and writes no LedgerEntry at all.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one REQUESTED DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, wire left in PENDING_VERIFICATION."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
          trigger:
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - *c_wire_a1
            - *c_verify_w1
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "the first fund returns HTTP 409 with data.error_id == ERR_WIRE_NOT_VERIFIED"
            - "after the rejection: Advance.${a1_id}.funding_status == REQUESTED and advance_amount_cents == 0"
            - "after the rejection: GET /advances/${a1_id}/ledger-entries returns total_count == 0"
            - "after the rejection: WarehouseFacility.${fac_id}.outstanding_principal_cents == 0 and availability_cents == 20000000000"
            - "the second fund returns HTTP 200 with funding_status == FUNDED and advance_amount_cents == 1960000000"
            - "WireInstruction.${w1_id}.status == RELEASED after the successful fund"

      - name: corner_sm_purchase_from_funded_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - validations[priority=11]
          - validations[priority=23]
          - errors.ERR_ADVANCE_INVALID_STATE
          - state_machines.Advance.funding_status.SHIPPED_to_PURCHASED
        distinguishing_aspect: |
          purchase is only defined from SHIPPED. From FUNDED there is both a state defect
          (priority 11) and a missing-bailee defect (priority 23); the ordering is
          observable because the response must be ERR_ADVANCE_INVALID_STATE and never
          ERR_BAILEE_LETTER_REQUIRED.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one DRY CONFORMING advance funded to 1,960,000,000, custody RECEIVED_CLEAR, never shipped, so it has zero BaileeLetters."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
          trigger:
            - call: "GET /advances/${a1_id}/bailee-letters"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${a1_id}/purchase"
              payload: { proceeds_reference: "WIRE-IN-20260801-01" }
              as: Investor
              as_user_id: "${inv_a_id}"
            - call: "POST /receipts/${rcpt_a1_id}/cure"
              payload: { cured_exception_codes: ["MISSING_ASSIGNMENT"] }
              as: Custodian
              as_user_id: "${cust_id}"
          assert:
            - "the bailee-letter list returns total_count == 0 — both priority 11 and priority 23 are genuinely violated"
            - "the purchase returns HTTP 409 with data.error_id == ERR_ADVANCE_INVALID_STATE, NOT ERR_BAILEE_LETTER_REQUIRED"
            - "Advance.${a1_id}.funding_status is still FUNDED and purchased_at is null"
            - "Advance.${a1_id}.outstanding_balance_cents == 1960000000 — no INVESTOR_PROCEEDS entry was written"
            - "the cure of a CLEAR receipt returns HTTP 409 with data.error_id == ERR_CUSTODY_INVALID_STATE — the custody axis has its own invalid-transition family"
            - "CustodianReceipt.${rcpt_a1_id}.status is still CLEAR"

      - name: corner_sm_initial_states_across_every_machine
        claim_type: initial_state
        grounds:
          - state_machines.WarehouseFacility.status.initial_state
          - state_machines.Advance.funding_status.initial_state
          - state_machines.Advance.custody_status.initial_state
          - state_machines.WireInstruction.status.initial_state
          - state_machines.TakeoutInvestor.status.initial_state
          - state_machines.DocumentCustodian.status.initial_state
          - state_machines.InvestorCommitment.status.initial_state
        distinguishing_aspect: |
          Two of the seven initial states are counter-intuitive and must be asserted
          explicitly: DocumentCustodian is born APPROVED (there is no custodian approval
          trigger at all, only a suspend), and an Advance is born into TWO states at once —
          REQUESTED on the funding axis and PENDING_RECEIPT on the custody axis.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-08-01T00:00:00Z; one facility, one rate row, approval, one custodian, one investor, one commitment and one advance, all freshly created."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
          trigger:
            - call: "GET /custodians/${cust_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cust_status: "$.data.status" }
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a1_funding: "$.data.funding_status", a1_custody: "$.data.custody_status" }
