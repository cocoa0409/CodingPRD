      - name: soft_ceiling_suspension_blocks_reactivation_until_a_unit_is_cancelled
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=51]
          - validations[priority=50]
          - validations[priority=9]
          - errors.ERR_SOFT_CEILING_STILL_BREACHED
          - errors.ERR_UNITS_NOT_TERMINAL
        distinguishing_aspect: |
          With contract_ceiling_cents 140000000 the soft ceiling is 126000000, so the
          second 68276000 award (committed 136552000) auto-suspends the program;
          reactivation is refused with 409 ERR_SOFT_CEILING_STILL_BREACHED until a
          unit is cancelled back to 68276000, and closing then still needs every
          remaining unit terminal.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with contract_ceiling_cents 140000000 and one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Ceiling program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 140000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
