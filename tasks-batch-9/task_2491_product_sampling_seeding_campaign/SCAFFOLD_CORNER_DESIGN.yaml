            - "Retailer.${rt1_id}.max_reviews_per_panelist_per_month == 1"
            - "Retailer.${rt1_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"
            - "the read response is field-for-field identical to the create response"

      - name: syndication_record_links_an_existing_review_to_an_existing_retailer
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /syndication-records]
          - endpoints[GET /syndication-records]
          - entities.SyndicationRecord.fields
        distinguishing_aspect: "The junction row carries no state of its own beyond QUEUED: creation demands that both sides already exist, and the association must be visible from either direction through the review_submission_id and retailer_id filters of the list endpoint."
        test_recipe:
          setup:
            - "One retailer listed in the campaign's syndication_retailer_ids."
