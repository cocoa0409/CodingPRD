# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims from SCAFFOLD.yaml §1.1–§1.7 not covered by §1.8.
# Sections/claim_types from references/claim-extraction-guide.md.
# Shared clock default 2026-01-01T00:00:00Z; instances set 2026-06-01 where age
# matters (DOB 2000-01-01 => age 26 >= 21; IDs expiring 2030-01-01 valid).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: register_customer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers/register with all required fields returns 201; compliance_status defaults CLEAR, age_verified false, lifetime_spend 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers/register"
              payload: { email: "e1@x.com", full_name: "E One", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust}.compliance_status == CLEAR"
            - "Customer.${cust}.age_verified == false"
            - "Customer.${cust}.lifetime_spend_cents == 0"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              as: Admin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_returns_missing_field
        claim_type: Required Fields
        grounds: [entities.Product, "errors[ERR_MISSING_FIELD]", "validations[priority=14]"]
        distinguishing_aspect: "POST /products without category returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X-1", name: "X", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_MISSING_FIELD"

      - name: create_product_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.category, "errors[ERR_INVALID_REQUEST]", "validations[priority=13]"]
        distinguishing_aspect: "POST /products with category not in {WINE,SPIRITS,BEER,GROWLER,KEG} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X-2", name: "X", category: "CIDER", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: product_is_allocated_default_false_applied
        claim_type: Defaults
        grounds: [entities.Product.fields.is_allocated]
        distinguishing_aspect: "Omitting is_allocated on POST /products yields is_allocated == false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X-3", name: "X3", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
          assert:
            - "response.status == 201"
            - "Product.${prod}.is_allocated == false"
            - "Product.${prod}.status == ACTIVE"

      - name: product_min_purchase_age_computed_is_21_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Product.fields.min_purchase_age, calculations.minimum_purchase_age]
        distinguishing_aspect: "min_purchase_age is computed (always 21) and any client-supplied value is ignored; field is read-only and equals 21 on read."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X-4", name: "X4", category: "SPIRITS", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 40.00 }
              as: Admin
              captures: { prod: $.data.id }
          assert:
            - "Product.${prod}.min_purchase_age == 21"

      - name: idscan_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.IdScan]
        distinguishing_aspect: "IdScan has common_fields:false — its read carries id and created_at but no version field."
        test_recipe:
          setup: ["Customer registered."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "im1@x.com", full_name: "IM", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
          assert:
            - "response.status == 201"
            - "IdScan.${scan}.status == PENDING"

      - name: list_customers_pagination_envelope_fields_present
        claim_type: Listing
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "GET /customers returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two customers registered."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "lp1@x.com", full_name: "LP1", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
            - call: "POST /customers/register"
              payload: { email: "lp2@x.com", full_name: "LP2", date_of_birth: "2000-01-01", ship_state_code: "TX" }
              as: Anonymous
          trigger:
            - call: "GET /customers"
              payload: { limit: 1, offset: 0 }
              as: Admin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.meta.total_count >= 2"
            - "response.meta.has_more == true"

      - name: list_customers_invalid_pagination_returns_error
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /customers with limit 0 (outside [1,100]) returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers"
              payload: { limit: 0 }
              as: Admin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_PAGINATION"

      - name: duplicate_sku_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.sku, "errors[ERR_INVALID_REQUEST]", "validations[priority=13]"]
        distinguishing_aspect: "Creating a second ACTIVE Product with an existing sku returns ERR_INVALID_REQUEST (uniqueness)."
        test_recipe:
          setup: ["One product with sku DUP-1 exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "DUP-1", name: "A", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
          trigger:
            - call: "POST /products"
              payload: { sku: "DUP-1", name: "B", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 12.00 }
              as: Admin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_vintage_year_per_product_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Vintage.fields.vintage_year, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Two vintages with same vintage_year under one product violate (product_id, vintage_year) uniqueness -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Product with a 2020 vintage exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "VY-1", name: "VY", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 3000, case_pack_size: 6 }
              as: Admin
          trigger:
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 3500, case_pack_size: 6 }
              as: Admin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_initial_states_cart_and_unpaid
        claim_type: Initial State
        grounds: [state_machines.Order, entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "A freshly created Order starts fulfillment_status=CART, payment_status=UNPAID, version=1."
        test_recipe:
          setup: ["Customer registered."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "is1@x.com", full_name: "IS", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "Order.${ord}.fulfillment_status == CART"
            - "Order.${ord}.payment_status == UNPAID"
            - "Order.${ord}.version == 1"

      - name: cancel_already_cancelled_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.CART_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a CART order then cancelling again: second cancel finds fulfillment_status==CANCELLED (terminal) and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A cart order already cancelled."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "ic1@x.com", full_name: "IC", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: capture_before_authorize_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.AUTHORIZED_to_CAPTURED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "capture-payment on an order whose payment_status is UNPAID (not AUTHORIZED) returns ERR_INVALID_STATE — payment dimension precondition."
        test_recipe:
          setup: ["Clock 2026-06-01. Age-verified customer, submitted order, payment still UNPAID."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "cb1@x.com", full_name: "CB", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "CB-1", name: "CB", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 3000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 5, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/capture-payment"
              payload: {}
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: idscan_verify_sets_customer_age_verified_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.IdScan.PENDING_to_VERIFIED, entities.Customer.fields.age_verified]
        distinguishing_aspect: "id-scans/{id}/verify flips the owning Customer.age_verified to true (cross-entity side effect)."
        test_recipe:
          setup: ["Clock 2026-06-01. Customer with a PENDING valid scan."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "av1@x.com", full_name: "AV", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
          trigger:
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
          assert:
            - "IdScan.${scan}.status == VERIFIED"
            - "Customer.${cust}.age_verified == true"

      - name: idscan_verify_underage_rejected_precondition
        claim_type: Precondition Enforcement
        grounds: [state_machines.IdScan.PENDING_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying a scan whose scanned_dob proves the holder is under 21 at the clock fails (age precondition) — DOB 2010-01-01 at clock 2026-06-01 is age 16."
        test_recipe:
          setup: ["Clock 2026-06-01. Customer DOB 2010-01-01, scan dob matches but underage."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "ua1@x.com", full_name: "UA", date_of_birth: "2010-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2010-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
          trigger:
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: special_order_negotiation_rounds_exceeded
        claim_type: Precondition Enforcement
        grounds: [state_machines.SpecialOrder.QUOTED_to_COUNTERED, "errors[ERR_NEGOTIATION_ROUNDS_EXCEEDED]"]
        distinguishing_aspect: "A 4th counter after round_count reaches 3 (QUOTED->COUNTERED 3 times) returns ERR_NEGOTIATION_ROUNDS_EXCEEDED."
        test_recipe:
          setup: ["Special order quoted/countered until round_count == 3, currently QUOTED."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "nr1@x.com", full_name: "NR", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust}", description: "rare", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust}"
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 9000 }
              as: StoreAssociate
            - call: "POST /special-orders/${so}/counter"
              payload: { customer_counter_price_cents: 8000 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 8800 }
              as: StoreAssociate
            - call: "POST /special-orders/${so}/counter"
              payload: { customer_counter_price_cents: 8200 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 8600 }
              as: StoreAssociate
            - call: "POST /special-orders/${so}/counter"
              payload: { customer_counter_price_cents: 8400 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 8500 }
              as: StoreAssociate
          trigger:
            - call: "POST /special-orders/${so}/counter"
              payload: { customer_counter_price_cents: 8450 }
              as: Customer
              as_user_id: "${cust}"
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NEGOTIATION_ROUNDS_EXCEEDED"

      - name: special_order_convert_creates_pickup_order
        claim_type: Side Effect Execution
        grounds: [state_machines.SpecialOrder.ACCEPTED_to_CONVERTED, entities.SpecialOrder.fields.converted_order_id]
        distinguishing_aspect: "Converting an ACCEPTED special order sets status CONVERTED and populates converted_order_id with a new Order id."
        test_recipe:
          setup: ["Clock 2026-06-01. Age-verified customer; special order quoted then accepted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "sc1@x.com", full_name: "SC", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /special-orders"
              payload: { customer_id: "${cust}", description: "rare", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust}"
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 9000 }
              as: StoreAssociate
            - call: "POST /special-orders/${so}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /special-orders/${so}/convert"
              payload: {}
              as: StoreAssociate
          assert:
            - "SpecialOrder.${so}.status == CONVERTED"
            - "SpecialOrder.${so}.converted_order_id != null"

      - name: vintage_auto_sold_out_then_back_to_released_compound
        claim_type: Side Effect Execution
        grounds: [state_machines.Vintage.RELEASED_to_SOLD_OUT, state_machines.Vintage.SOLD_OUT_to_RELEASED, entities.Vintage.fields.status]
        distinguishing_aspect: "Submitting the last available unit auto-transitions Vintage RELEASED->SOLD_OUT; cancelling that order returns availability and auto-transitions SOLD_OUT->RELEASED."
        test_recipe:
          setup: ["Clock 2026-06-01. Age-verified customer. Vintage released, single lot qty 2. Order line qty 2 (depletes)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "so2@x.com", full_name: "SO2", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "SO-2", name: "SO2", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 3000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 2, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 2 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/cancel"
