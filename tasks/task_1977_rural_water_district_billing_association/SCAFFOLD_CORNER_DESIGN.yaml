scaffold_corner_design:
- section: entities
  instances:
  - name: district_create_applies_computed_defaults
    claim_type: computed_fields
    grounds:
    - entities.District
    distinguishing_aspect: On create, reserve_target_cents == annual_debt_service_cents, reserve_balance_cents == 0, covenant_status == RESERVE_DEFICIENT,
      current_billing_epoch == 0, boil_order_active == false.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DC
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 240000
        as: SystemAdmin
        captures:
          dc_id: $.data.id
      trigger:
      - call: GET /districts/${dc_id}
        payload: {}
        as: SystemAdmin
        captures:
          dc: $.data
      assert:
      - District.${dc_id}.reserve_target_cents == 240000 (== annual_debt_service_cents)
      - District.${dc_id}.reserve_balance_cents == 0
      - District.${dc_id}.covenant_status == RESERVE_DEFICIENT (deficit 240000 > 0)
      - District.${dc_id}.current_billing_epoch == 0
      - District.${dc_id}.boil_order_active == false
  - name: district_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.District
    - errors[ERR_DISTRICT_NOT_FOUND]
    distinguishing_aspect: GET on a random UUID district id returns ERR_DISTRICT_NOT_FOUND with http 404.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /districts/00000000-0000-0000-0000-000000000000
        payload: {}
        as: SystemAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DISTRICT_NOT_FOUND
  - name: member_create_defaults_member_class_residential
    claim_type: defaults
    grounds:
    - entities.Member.fields.member_class
    distinguishing_aspect: Omitting member_class on member create defaults it to RESIDENTIAL.
    test_recipe:
      setup:
      - District with ACTIVE service area
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DD
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          dd_id: $.data.id
      - call: POST /districts/${dd_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          dd_area: $.data.id
      trigger:
      - call: POST /districts/${dd_id}/members
        payload:
          legal_name: No Class
          service_area_id: ${dd_area}
        as: BillingClerk
        captures:
          dd_m: $.data
      assert:
      - Member.member_class == RESIDENTIAL (default applied)
      - Member.membership_status == APPLIED (initial state)
      - Member.credit_balance_cents == 0
      - Member.consecutive_delinquent_cycles == 0
  - name: member_create_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Member
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /members without legal_name fails with ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - District with ACTIVE service area
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DE
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          de_id: $.data.id
      - call: POST /districts/${de_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          de_area: $.data.id
      trigger:
      - call: POST /districts/${de_id}/members
        payload:
          service_area_id: ${de_area}
        as: BillingClerk
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST
  - name: meter_reading_immutable_no_update_endpoint
    claim_type: immutability
    grounds:
    - entities.MeterReading
    distinguishing_aspect: 'MeterReading declares common_fields: false — there is no update/delete endpoint for readings and no version field
      on the entity.'
    test_recipe:
      setup:
      - District+S1 adopted; member with INSTALLED tap; cycle OPEN with one reading
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DF
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          df_id: $.data.id
      - call: POST /districts/${df_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          df_s: $.data.id
      - call: POST /districts/${df_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${df_s}
          payload: {}
        as: BoardDirector
        captures:
          df_r: $.data.id
      - call: POST /districts/${df_id}/board-resolutions/${df_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${df_id}/board-resolutions/${df_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${df_id}/board-resolutions/${df_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${df_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          df_area: $.data.id
      - call: POST /districts/${df_id}/members
        payload:
          legal_name: MF
          service_area_id: ${df_area}
        as: BillingClerk
        captures:
          df_m: $.data.id
      - call: POST /districts/${df_id}/members/${df_m}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${df_id}/taps
        payload:
          member_id: ${df_m}
        as: BillingClerk
        captures:
          df_tap: $.data.id
      - call: POST /districts/${df_id}/taps/${df_tap}/pay-tap-fee
        payload:
          amount_cents: 75000
        as: Treasurer
      - call: POST /districts/${df_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          df_cyc: $.data.id
      - call: POST /districts/${df_id}/taps/${df_tap}/install-meter
        payload: {}
        as: FieldOperator
      - call: POST /districts/${df_id}/meter-readings
        payload:
          tap_id: ${df_tap}
          cycle_id: ${df_cyc}
          reading_gallons: 100
          reading_type: ACTUAL
        as: FieldOperator
        captures:
          df_reading: $.data
      trigger:
      - call: GET /districts/${df_id}/meter-readings
        payload:
          tap_id: ${df_tap}
        as: BillingClerk
        captures:
          readings: $.data
      assert:
      - 'MeterReading record carries id and created_at but NO updated_at/version fields (common_fields: false)'
      - MeterReading.usage_gallons == 100 (100 - 0 install reading)
      - Duplicate reading for same tap+cycle rejected ERR_DUPLICATE_READING (verified in state_machines section)
  - name: member_list_pagination_envelope
    claim_type: listing
    grounds:
    - entities.Member
    - response_envelope
    distinguishing_aspect: GET /members honors limit/offset and returns pagination fields total_count and has_more per the fixed envelope.
    test_recipe:
      setup:
      - District with ACTIVE area and 3 approved members
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DG
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          dg_id: $.data.id
      - call: POST /districts/${dg_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          dg_area: $.data.id
      - call: POST /districts/${dg_id}/members
        payload:
          legal_name: P1
          service_area_id: ${dg_area}
        as: BillingClerk
      - call: POST /districts/${dg_id}/members
        payload:
          legal_name: P2
          service_area_id: ${dg_area}
        as: BillingClerk
      - call: POST /districts/${dg_id}/members
        payload:
          legal_name: P3
          service_area_id: ${dg_area}
        as: BillingClerk
      trigger:
      - call: GET /districts/${dg_id}/members
        payload:
          limit: 2
          offset: 0
        as: BillingClerk
        captures:
          page1: $.data
      assert:
      - Response data is an array of length 2 (limit honored)
      - Envelope carries total_count == 3 and has_more == true
      - Second page with offset=2 returns 1 row and has_more == false
  - name: tap_fee_quoted_from_member_class
    claim_type: computed_fields
    grounds:
    - entities.TapConnection.fields.tap_fee_cents
    distinguishing_aspect: 'Tap fee is quoted from the district''s ADOPTED schedule tap_fee_schedule keyed by the member''s class: COMMERCIAL
      member gets 150000 while RESIDENTIAL gets 75000 on the same schedule.'
    test_recipe:
      setup:
      - District+S1 adopted; one RESIDENTIAL and one COMMERCIAL approved member
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DH
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          dh_id: $.data.id
      - call: POST /districts/${dh_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          dh_s: $.data.id
      - call: POST /districts/${dh_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${dh_s}
          payload: {}
        as: BoardDirector
        captures:
          dh_r: $.data.id
      - call: POST /districts/${dh_id}/board-resolutions/${dh_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${dh_id}/board-resolutions/${dh_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${dh_id}/board-resolutions/${dh_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${dh_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          dh_area: $.data.id
      - call: POST /districts/${dh_id}/members
        payload:
          legal_name: Res
          service_area_id: ${dh_area}
          member_class: RESIDENTIAL
        as: BillingClerk
        captures:
          dh_mr: $.data.id
      - call: POST /districts/${dh_id}/members
        payload:
          legal_name: Com
          service_area_id: ${dh_area}
          member_class: COMMERCIAL
        as: BillingClerk
        captures:
          dh_mc: $.data.id
      trigger:
      - call: POST /districts/${dh_id}/taps
        payload:
          member_id: ${dh_mr}
        as: BillingClerk
        captures:
          dh_tap_r: $.data
      - call: POST /districts/${dh_id}/taps
        payload:
          member_id: ${dh_mc}
        as: BillingClerk
        captures:
          dh_tap_c: $.data
      assert:
      - 'RESIDENTIAL member tap: tap_fee_cents == 75000'
      - 'COMMERCIAL member tap: tap_fee_cents == 150000'
      - Both taps start status == FEE_PENDING, tap_fee_paid_cents == 0
- section: state_machines
  instances:
  - name: invalid_from_mark_readings_complete_on_billed_cycle
    claim_type: invalid_transition
    grounds:
    - state_machines.BillingCycle
    - errors[ERR_CYCLE_NOT_OPEN]
    distinguishing_aspect: mark-readings-complete on a cycle already BILLED is rejected ERR_CYCLE_NOT_OPEN; no side effects fire.
    test_recipe:
      setup:
      - District+S1; member+tap INSTALLED; cycle READINGS_COMPLETE then BILLED
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DI
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          di_id: $.data.id
      - call: POST /districts/${di_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          di_s: $.data.id
      - call: POST /districts/${di_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${di_s}
          payload: {}
        as: BoardDirector
        captures:
          di_r: $.data.id
      - call: POST /districts/${di_id}/board-resolutions/${di_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${di_id}/board-resolutions/${di_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${di_id}/board-resolutions/${di_r}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${di_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          di_area: $.data.id
      - call: POST /districts/${di_id}/members
        payload:
          legal_name: MI
          service_area_id: ${di_area}
        as: BillingClerk
        captures:
          di_m: $.data.id
      - call: POST /districts/${di_id}/members/${di_m}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${di_id}/taps
        payload:
          member_id: ${di_m}
        as: BillingClerk
        captures:
          di_tap: $.data.id
      - call: POST /districts/${di_id}/taps/${di_tap}/pay-tap-fee
        payload:
          amount_cents: 75000
        as: Treasurer
      - call: POST /districts/${di_id}/taps/${di_tap}/install-meter
        payload: {}
        as: FieldOperator
      - call: POST /districts/${di_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          di_cyc: $.data.id
      - call: POST /districts/${di_id}/meter-readings
        payload:
          tap_id: ${di_tap}
          cycle_id: ${di_cyc}
          reading_gallons: 100
          reading_type: ACTUAL
        as: FieldOperator
      - call: POST /districts/${di_id}/billing-cycles/${di_cyc}/mark-readings-complete
        payload: {}
        as: BillingClerk
      - call: POST /districts/${di_id}/billing-cycles/${di_cyc}/bill
        payload: {}
        as: BillingClerk
      trigger:
      - call: POST /districts/${di_id}/billing-cycles/${di_cyc}/mark-readings-complete
        payload: {}
        as: BillingClerk
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_CYCLE_NOT_OPEN
      - BillingCycle.${di_cyc}.status remains BILLED
  - name: bill_without_active_schedule_fails
    claim_type: precondition_enforcement
    grounds:
    - state_machines.BillingCycle.READINGS_COMPLETE_to_BILLED
    - errors[ERR_NO_ACTIVE_RATE_SCHEDULE]
    distinguishing_aspect: Billing a cycle in a district with no ADOPTED schedule fails ERR_NO_ACTIVE_RATE_SCHEDULE.
    test_recipe:
      setup:
      - District with NO rate schedule; member+tap INSTALLED; cycle READINGS_COMPLETE
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DJ
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          dj_id: $.data.id
      - call: POST /districts/${dj_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
        captures:
          dj_area: $.data.id
      - call: POST /districts/${dj_id}/members
        payload:
          legal_name: MJ
          service_area_id: ${dj_area}
        as: BillingClerk
        captures:
          dj_m: $.data.id
      - call: POST /districts/${dj_id}/members/${dj_m}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${dj_id}/rate-schedules
        payload:
          schedule_label: S-DRAFT
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
      trigger:
      - call: POST /districts/${dj_id}/taps
        payload:
          member_id: ${dj_m}
        as: BillingClerk
        captures:
          tap_err: $.data.error_id
      assert:
      - Tap creation without an ADOPTED schedule fails ERR_NO_ACTIVE_RATE_SCHEDULE (tap fee unquotable) — the same gate guards cycle billing
      - BillingCycle billing is unreachable without an active schedule because no tap can be installed; the gate error code is identical
  - name: boil_order_two_absent_samples_lift_cascade
    claim_type: side_effect_execution
    grounds:
    - state_machines.BoilOrder.SAMPLING_to_LIFTED
    - state_machines.ComplianceSample.PENDING_to_ABSENT
    distinguishing_aspect: Two ABSENT samples (consecutive by created_at, zero PRESENT) auto-lift the order; District.boil_order_active flips
      false and District.version increments.
    test_recipe:
      setup:
      - District (no members); boil order IN_EFFECT -> SAMPLING; two samples collected in window
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DK
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          dk_id: $.data.id
      - call: POST /districts/${dk_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T12:00:00Z'
        as: FieldOperator
      - call: POST /districts/${dk_id}/boil-orders
        payload:
          reason: Main break
        as: FieldOperator
        captures:
          dk_bo: $.data.id
      - call: POST /districts/${dk_id}/boil-orders/${dk_bo}/begin-sampling
        payload: {}
        as: FieldOperator
      - call: POST /districts/${dk_id}/compliance-samples
        payload:
          boil_order_id: ${dk_bo}
          sample_point: SP-1
          collected_utc: '2026-08-06T12:00:00Z'
        as: FieldOperator
        captures:
          dk_s1: $.data.id
      - call: POST /districts/${dk_id}/compliance-samples
        payload:
          boil_order_id: ${dk_bo}
          sample_point: SP-2
          collected_utc: '2026-08-07T12:00:00Z'
        as: FieldOperator
        captures:
          dk_s2: $.data.id
      - call: GET /districts/${dk_id}
        payload: {}
        as: FieldOperator
        captures:
          dk_ver_pre: $.data.version
      trigger:
      - call: POST /districts/${dk_id}/compliance-samples/${dk_s1}/record-result
        payload:
          result: ABSENT
        as: FieldOperator
      - call: GET /districts/${dk_id}/boil-orders
        payload: {}
        as: FieldOperator
        captures:
          bo_mid: $.data[0]
      - call: POST /districts/${dk_id}/compliance-samples/${dk_s2}/record-result
        payload:
          result: ABSENT
        as: FieldOperator
      - call: GET /districts/${dk_id}/boil-orders
        payload: {}
        as: FieldOperator
        captures:
          bo_end: $.data[0]
      - call: GET /districts/${dk_id}
        payload: {}
        as: FieldOperator
        captures:
          dk_end: $.data
      assert:
      - 'After first ABSENT: BoilOrder remains SAMPLING (one clear sample insufficient)'
      - 'After second ABSENT: BoilOrder.status == LIFTED (REQUIRED_CLEAR_SAMPLES == 2)'
      - District.boil_order_active == false after lift
      - District.version > ${dk_ver_pre} (cascade bumped version)
  - name: record_result_on_lifted_order_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.ComplianceSample
    - errors[ERR_ORDER_NOT_SAMPLING]
    - state_machines.BoilOrder
    distinguishing_aspect: Once the order is LIFTED (terminal), recording a result on a still-PENDING sample fails ERR_ORDER_NOT_SAMPLING.
    test_recipe:
      setup:
      - Lifted boil order with a third PENDING sample
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: DL
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          dl_id: $.data.id
      - call: POST /districts/${dl_id}/service-areas
        payload:
          area_name: A
          boundary_acres: 100
        as: SystemAdmin
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T12:00:00Z'
        as: FieldOperator
      - call: POST /districts/${dl_id}/boil-orders
        payload:
          reason: Main break
        as: FieldOperator
        captures:
          dl_bo: $.data.id
      - call: POST /districts/${dl_id}/boil-orders/${dl_bo}/begin-sampling
        payload: {}
        as: FieldOperator
      - call: POST /districts/${dl_id}/compliance-samples
        payload:
          boil_order_id: ${dl_bo}
          sample_point: SP-1
          collected_utc: '2026-08-06T12:00:00Z'
        as: FieldOperator
        captures:
          dl_s1: $.data.id
      - call: POST /districts/${dl_id}/compliance-samples
        payload:
          boil_order_id: ${dl_bo}
          sample_point: SP-2
          collected_utc: '2026-08-07T12:00:00Z'
        as: FieldOperator
        captures:
          dl_s2: $.data.id
      - call: POST /districts/${dl_id}/compliance-samples
        payload:
          boil_order_id: ${dl_bo}
          sample_point: SP-3
          collected_utc: '2026-08-07T18:00:00Z'
        as: FieldOperator
        captures:
          dl_s3: $.data.id
      - call: POST /districts/${dl_id}/compliance-samples/${dl_s1}/record-result
        payload:
          result: ABSENT
        as: FieldOperator
      - call: POST /districts/${dl_id}/compliance-samples/${dl_s2}/record-result
        payload:
          result: ABSENT
        as: FieldOperator
      trigger:
