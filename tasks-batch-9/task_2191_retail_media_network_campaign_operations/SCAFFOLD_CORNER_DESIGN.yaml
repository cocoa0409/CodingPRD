        grounds:
          - validations[priority=32]
          - errors[ERR_LINE_ITEM_INVALID_STATE]
          - state_machines.LineItem.MANUAL_PAUSED_to_SERVING
        distinguishing_aspect: "resume is declared only from MANUAL_PAUSED, so calling it on an ELIGIBLE line item of a DELIVERING campaign passes the priority-31 campaign check and fails at priority 32 with ERR_LINE_ITEM_INVALID_STATE — not ERR_CAMPAIGN_NOT_DELIVERING."
        test_recipe:
          setup:
            - "Baseline chain through campaign activation, with the line item left ELIGIBLE (never activated) while the campaign is DELIVERING and the plan is ACTIVE."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
