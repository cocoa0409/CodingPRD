              as_user_id: "${s15}"
            - call: "POST /service-tickets/${t15a}/schedule"
              payload: { technician_id: "${tt10}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: ServiceManager
            - call: "POST /service-tickets"
              payload: { site_id: "${s15}", vessel_id: "${vu}", job_type: "CLEANOUT", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { t15b: $.data.id }
            - call: "POST /service-tickets/${t15b}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t15b}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s15}"
          trigger:
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vu}", ticket_id: "${t15b}", entrant_technician_id: "${tt10}", window_start: "2026-08-10T10:30:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
