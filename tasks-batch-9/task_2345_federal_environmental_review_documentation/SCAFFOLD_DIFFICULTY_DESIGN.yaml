scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: resource_significance_unmitigated_vs_mitigated_divergence
        grounds:
          - calculations.resource_significance_score
          - calculations.cumulative_effect_score
          - entities.ResourceAnalysis.fields.unmitigated_score
          - entities.ResourceAnalysis.fields.mitigated_score
          - entities.ResourceAnalysis.fields.variant_applied
          - state_machines.ResourceAnalysis.DRAFT_to_FINAL
          - state_machines.ResourceAnalysis.FINAL_to_DRAFT
        distinguishing_aspect: |
          This dual-variant calculation lives on the ResourceAnalysis entity domain (environmental
          effects scoring); the same stored inputs yield unmitigated_score 70.21 (SIGNIFICANT) and
          mitigated_score 58.21 (NOT_SIGNIFICANT), a 12.00-point divergence that flips the
          significance determination without changing any input field.
        test_recipe:
          setup:
            - "ReviewOffice ERO-1 exists with all §1.1 policy defaults (significance_threshold 60.0, intensity_weight 0.6, context_weight 0.4, cumulative_radius_km 25.0)."
            - "ProposedAction 'Ridgeline Fuels Treatment' is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT, has an ADOPTED PurposeNeedStatement, a CLOSED PUBLIC scoping period, and review_stage ANALYSIS."
            - "Four BIOLOGICAL CumulativeAction entries are INCLUDED (distance 10.0, 5.0, 20.0, 24.0 km) and one is EXCLUDED at 60.0 km."
            - "A DRAFT BIOLOGICAL ResourceAnalysis exists with intensity_score 72.0, context_sensitivity_score 55.0, affected_area_hectares 4.0, mitigation_reduction_points 12.0."
          setup_api_calls:
            - &c_clk_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PolicyAdmin
            - &c_office
              call: "POST /review-offices"
              payload: { office_code: "ERO-1", name: "Region 1 Environmental Review Office" }
              as: PolicyAdmin
              captures: { off_id: $.data.id }
            - &c_action
              call: "POST /proposed-actions"
              payload: { office_id: "${off_id}", title: "Ridgeline Fuels Treatment", disturbance_hectares: 40.0, reference_cost_cents: 10000000, in_critical_habitat: true, affects_historic_property: false, tribal_interest: false, floodplain_or_wetland: false }
              as: NepaCoordinator
              captures: { act_id: $.data.id }
            - &c_screen1
              call: "POST /proposed-actions/${act_id}/ec-screens"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "No historic properties in the action area" }
                  - { code: "EC_ENDANGERED_SPECIES", present: true, severity: 2, narrative: "Lynx transit habitat, discountable effects" }
                  - { code: "EC_WETLAND", present: false, severity: 0, narrative: "No wetlands mapped" }
              as: NepaCoordinator
              captures: { scr1_id: $.data.id }
            - &c_adj_cleared
              call: "POST /ec-screens/${scr1_id}/adjudicate"
              payload: { disposition: "CLEARED", adjudicator_note: "No extraordinary circumstance reaches the severity trigger" }
              as: ReviewingOfficial
            - &c_classify
              call: "POST /proposed-actions/${act_id}/classify"
              payload: {}
              as: NepaCoordinator
            - &c_pn1
              call: "POST /proposed-actions/${act_id}/purpose-need-statements"
              payload: { purpose_text: "Reduce hazardous fuel loading on the Ridgeline unit", need_text: "Modelled fire behaviour exceeds the wildland-urban interface standard", goal_codes: ["ACCESS", "SAFETY", "HABITAT", "COST"], constraint_codes: ["NO_NEW_ROADS"] }
              as: NepaCoordinator
              captures: { pn1_id: $.data.id }
            - &c_scope1
              call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "PUBLIC", start_at: "2026-08-03T00:00:00Z", end_at: "2026-09-02T00:00:00Z" }
              as: NepaCoordinator
              captures: { sp1_id: $.data.id }
            - &c_get_act_v
              call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
              captures: { act_v: $.data.version }
            - &c_adopt_pn1
              call: "POST /purpose-need-statements/${pn1_id}/adopt"
              payload: { expected_action_version: "${act_v}" }
              as: ReviewingOfficial
            - &c_issue_bio
              call: "POST /proposed-actions/${act_id}/issues"
              payload: { scoping_period_id: "${sp1_id}", resource_area: "BIOLOGICAL", origin: "PUBLIC", significance: "SIGNIFICANT", summary: "Effects on lynx winter range" }
              as: NepaCoordinator
              captures: { iss_bio_id: $.data.id }
            - &c_alt_a
              call: "POST /alternatives"
              payload: { action_id: "${act_id}", label: "A - No Action", alternative_kind: "NO_ACTION", goal_alignment_codes: [], estimated_cost_cents: 0 }
              as: NepaCoordinator
              captures: { altA_id: $.data.id }
            - &c_alt_b
              call: "POST /alternatives"
              payload: { action_id: "${act_id}", label: "B - Proposed Treatment", alternative_kind: "PROPOSED_ACTION", goal_alignment_codes: ["ACCESS", "SAFETY", "HABITAT"], estimated_cost_cents: 12000000 }
              as: NepaCoordinator
              captures: { altB_id: $.data.id }
            - &c_screen_alt_a
              call: "POST /alternatives/${altA_id}/screen"
              payload: { decision: "SCREENED_IN" }
              as: ReviewingOfficial
            - &c_screen_alt_b
              call: "POST /alternatives/${altB_id}/screen"
              payload: { decision: "SCREENED_IN" }
              as: ReviewingOfficial
            - &c_agency_fws
              call: "POST /agencies"
              payload: { agency_code: "USFWS", name: "US Fish and Wildlife Service", agency_role: "CONSULTING", max_concurrent_consultations: 2, handoff_buffer_days: 3, statutory_response_days: 135, status: "ACTIVE" }
              as: PolicyAdmin
              captures: { fws_id: $.data.id }
            - &c_con_esa
              call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${fws_id}", consultation_type: "ESA_SECTION_7", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { con_esa_id: $.data.id }
            - &c_con_esa_concur
              call: "POST /consultations/${con_esa_id}/respond"
              payload: { outcome: "CONCURRED" }
              as: AgencyLiaison
              as_user_id: "${fws_id}"
            - &c_close_scope1
              call: "POST /scoping-periods/${sp1_id}/close"
              payload: {}
              as: NepaCoordinator
            - &c_cum1
              call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Legacy grazing allotment", intensity_contribution: 20.0, footprint_hectares: 100.0, distance_km: 10.0, temporal_scope: "PAST" }
              as: ResourceSpecialist
            - &c_cum2
              call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Adjacent solar array", intensity_contribution: 12.0, footprint_hectares: 40.0, distance_km: 5.0, temporal_scope: "PRESENT" }
              as: ResourceSpecialist
            - &c_cum3
              call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Planned access road", intensity_contribution: 10.0, footprint_hectares: 300.0, distance_km: 20.0, temporal_scope: "REASONABLY_FORESEEABLE" }
              as: ResourceSpecialist
            - &c_cum4
              call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Fire salvage harvest", intensity_contribution: 7.0, footprint_hectares: 15.0, distance_km: 24.0, temporal_scope: "PRESENT" }
              as: ResourceSpecialist
            - &c_cum5_excluded
              call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Distant hardrock mine", intensity_contribution: 90.0, footprint_hectares: 500.0, distance_km: 60.0, temporal_scope: "PAST" }
              as: ResourceSpecialist
            - &c_ra_bio
              call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "BIOLOGICAL", intensity_score: 72.0, context_sensitivity_score: 55.0, affected_area_hectares: 4.0, mitigation_reduction_points: 12.0 }
              as: ResourceSpecialist
              captures: { ra_bio_id: $.data.id }
          trigger:
            - &c_final_unmit
              call: "POST /resource-analyses/${ra_bio_id}/finalize"
              payload: { basis: "UNMITIGATED" }
              as: ResourceSpecialist
            - &c_reopen_bio
              call: "POST /resource-analyses/${ra_bio_id}/reopen"
              payload: {}
              as: ResourceSpecialist
            - &c_final_mit
              call: "POST /resource-analyses/${ra_bio_id}/finalize"
              payload: { basis: "MITIGATED" }
              as: ResourceSpecialist
          assert:
            - "After the first finalize: ResourceAnalysis.${ra_bio_id}.cumulative_effect_score == 60.04"
            - "After the first finalize: ResourceAnalysis.${ra_bio_id}.unmitigated_score == 70.21"
            - "After the first finalize: ResourceAnalysis.${ra_bio_id}.mitigated_score == 58.21"
            - "After the first finalize: ResourceAnalysis.${ra_bio_id}.variant_applied == UNMITIGATED"
            - "After the first finalize: ResourceAnalysis.${ra_bio_id}.significance_score == 70.21"
            - "After the first finalize: ResourceAnalysis.${ra_bio_id}.significance_determination == SIGNIFICANT"
            - "After the reopen: ResourceAnalysis.${ra_bio_id}.significance_score == null and variant_applied == null and status == DRAFT"
            - "After the second finalize: ResourceAnalysis.${ra_bio_id}.variant_applied == MITIGATED"
            - "After the second finalize: ResourceAnalysis.${ra_bio_id}.significance_score == 58.21"
            - "After the second finalize: ResourceAnalysis.${ra_bio_id}.significance_determination == NOT_SIGNIFICANT"
            - "unmitigated_score - mitigated_score == 12.00 on identical stored input fields"

      - name: decision_obligation_commitment_only_vs_lifecycle_divergence
        grounds:
          - calculations.decision_binding_obligation_cents
          - calculations.commitment_lifecycle_obligation_cents
          - entities.DecisionDocument.fields.committed_obligation_cents
          - entities.DecisionDocument.fields.base_obligation_cents
          - entities.DecisionDocument.fields.binding_obligation_cents
          - state_machines.DecisionDocument.DRAFT_to_SIGNED
        distinguishing_aspect: |
          This dual-variant calculation lives on the DecisionDocument entity domain (fiscal obligation
          accounting), not on ResourceAnalysis: the COMMITMENT_ONLY variant reports 3300000 cents while
          the LIFECYCLE variant reports 3487823 cents from the same two MitigationCommitment rows, a
          187823-cent divergence produced by the escalated monitoring stream plus the contingency fee.
        test_recipe:
          setup:
            - "The ERO-1 / Ridgeline chain of resource_significance_unmitigated_vs_mitigated_divergence is complete with the BIOLOGICAL analysis FINAL on the UNMITIGATED basis."
            - "The ENVIRONMENTAL_ASSESSMENT document is PUBLISHED, its comment period is CLOSED, its single substantive comment is RESPONDED, and publication_status is FINAL."
            - "A DRAFT MITIGATED_FONSI decision prepared by user coord-1 carries two PROPOSED commitments: 1200000 cents with 3 years x 4500 cents monitoring and 9.0 reduction points, and 2100000 cents with 3 years x 2500 cents monitoring and 5.0 reduction points."
            - "The logical clock reads 2026-11-01T12:00:00Z."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_alt_a
            - *c_alt_b
            - *c_screen_alt_a
            - *c_screen_alt_b
            - *c_agency_fws
            - *c_con_esa
            - *c_con_esa_concur
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
            - *c_final_unmit
            - &c_doc_ea
              call: "POST /proposed-actions/${act_id}/documents"
              payload: { document_type: "ENVIRONMENTAL_ASSESSMENT", title: "Ridgeline Fuels Treatment Environmental Assessment" }
              as: NepaCoordinator
              captures: { doc_id: $.data.id }
            - &c_clk_sep5
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PolicyAdmin
            - &c_publish_ea
              call: "POST /documents/${doc_id}/publish"
              payload: { comment_period_end_at: "2026-10-05T00:00:00Z" }
              as: NepaCoordinator
            - &c_comment1
              call: "POST /comments"
              payload: { document_id: "${doc_id}", assigned_issue_id: "${iss_bio_id}", commenter_name: "J. Rivera", resource_area: "BIOLOGICAL", is_substantive: true, body: "The habitat analysis omits winter range connectivity" }
              as: PublicCommenter
              captures: { cm1_id: $.data.id }
            - &c_clk_oct5
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PolicyAdmin
            - &c_close_comments
              call: "POST /documents/${doc_id}/close-comment-period"
              payload: {}
              as: NepaCoordinator
            - &c_respond_comment1
              call: "POST /comments/${cm1_id}/respond"
              payload: { response_text: "Winter range connectivity added to section 3.2", response_category: "ANALYSIS_REVISED" }
              as: NepaCoordinator
            - &c_finalize_doc
              call: "POST /documents/${doc_id}/finalize"
              payload: {}
              as: NepaCoordinator
            - &c_decision
              call: "POST /decisions"
              payload: { action_id: "${act_id}", selected_alternative_id: "${altB_id}", decision_type: "MITIGATED_FONSI" }
              as: NepaCoordinator
              as_user_id: "coord-1"
              captures: { dec_id: $.data.id, dec_v1: $.data.version }
            - &c_mit1
              call: "POST /decisions/${dec_id}/mitigations"
              payload: { source_analysis_id: "${ra_bio_id}", measure_text: "Seasonal closure of the winter range unit", cost_estimate_cents: 1200000, monitoring_years: 3, annual_monitoring_cost_cents: 4500, reduction_points: 9.0, expected_decision_version: "${dec_v1}" }
              as: NepaCoordinator
              as_user_id: "coord-1"
              captures: { mit1_id: $.data.id }
            - &c_get_dec_v2
              call: "GET /decisions/${dec_id}"
              payload: {}
              as: NepaCoordinator
              captures: { dec_v2: $.data.version }
            - &c_mit2
              call: "POST /decisions/${dec_id}/mitigations"
              payload: { source_analysis_id: "${ra_bio_id}", measure_text: "Culvert retrofit with effectiveness monitoring", cost_estimate_cents: 2100000, monitoring_years: 3, annual_monitoring_cost_cents: 2500, reduction_points: 5.0, expected_decision_version: "${dec_v2}" }
              as: NepaCoordinator
              as_user_id: "coord-1"
              captures: { mit2_id: $.data.id }
            - &c_clk_nov1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T12:00:00Z" }
              as: PolicyAdmin
          trigger:
            - &c_sign
              call: "POST /decisions/${dec_id}/sign"
              payload: {}
              as: DecidingOfficial
              as_user_id: "official-9"
          assert:
            - "DecisionDocument.${dec_id}.committed_obligation_cents == 3300000"
            - "MitigationCommitment.${mit1_id}.lifecycle_obligation_cents == 1213973"
            - "MitigationCommitment.${mit2_id}.lifecycle_obligation_cents == 2107763"
            - "DecisionDocument.${dec_id}.base_obligation_cents == 3321736"
            - "DecisionDocument.${dec_id}.contingency_fee_cents == 166087"
            - "DecisionDocument.${dec_id}.binding_obligation_cents == 3487823"
            - "DecisionDocument.${dec_id}.binding_obligation_cents - DecisionDocument.${dec_id}.committed_obligation_cents == 187823"
            - "ReviewOffice.${off_id}.binding_obligation_cents == 3487823"

  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_significance_score_ceiling_binds_before_mitigation_subtraction
        grounds:
          - calculations.resource_significance_score
          - entities.ReviewOffice.fields.intensity_weight
          - entities.ReviewOffice.fields.context_weight
          - entities.ResourceAnalysis.fields.affected_area_hectares
          - entities.ResourceAnalysis.fields.mitigation_reduction_points
        distinguishing_aspect: |
          Mode (a): a five-input non-linear formula whose nested min/max and tiered area adder interact —
          base 97.20 plus the 11.0 tier adder overflows the 100.0 ceiling, so min() clamps direct_term to
          100.00 BEFORE the 25.0 mitigation points are subtracted, giving mitigated_score 75.00 rather
          than the 83.20 an implementation that subtracts inside the min() would produce.
        test_recipe:
          setup:
            - "The ERO-1 / Ridgeline chain is complete through review_stage ANALYSIS (scoping CLOSED, PurposeNeedStatement ADOPTED)."
            - "No CumulativeAction entry exists for the AIR resource area, so its cumulative_effect_score is 0.00 and the cumulative uplift term is exactly 0."
            - "A DRAFT AIR ResourceAnalysis exists with intensity_score 98.0, context_sensitivity_score 96.0, affected_area_hectares 150.0 and mitigation_reduction_points 25.0."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_close_scope1
            - &c_ra_air
              call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "AIR", intensity_score: 98.0, context_sensitivity_score: 96.0, affected_area_hectares: 150.0, mitigation_reduction_points: 25.0 }
              as: ResourceSpecialist
              captures: { ra_air_id: $.data.id }
          trigger:
            - call: "POST /resource-analyses/${ra_air_id}/finalize"
              payload: { basis: "MITIGATED" }
              as: ResourceSpecialist
          assert:
            - "ResourceAnalysis.${ra_air_id}.cumulative_effect_score == 0.00"
            - "ResourceAnalysis.${ra_air_id}.unmitigated_score == 100.00"
            - "ResourceAnalysis.${ra_air_id}.mitigated_score == 75.00"
            - "ResourceAnalysis.${ra_air_id}.mitigated_score != 83.20"
            - "ResourceAnalysis.${ra_air_id}.significance_score == 75.00"
            - "ResourceAnalysis.${ra_air_id}.significance_determination == SIGNIFICANT"

      - name: mode_b_monitoring_stream_rounded_per_commitment_then_summed
        grounds:
          - calculations.commitment_lifecycle_obligation_cents
          - entities.MitigationCommitment.fields.lifecycle_obligation_cents
          - entities.DecisionDocument.fields.base_obligation_cents
          - entities.ReviewOffice.fields.monitoring_escalation_factor
        distinguishing_aspect: |
          Mode (b): nested rounding whose order changes the cent total — both monitoring streams land
          exactly on a half cent (13972.5 and 7762.5), so rounding per commitment then summing yields
          base_obligation_cents 3321736 while summing the raw streams and rounding once yields 3321735.
        test_recipe:
          setup:
            - "The full ERO-1 / Ridgeline chain of decision_obligation_commitment_only_vs_lifecycle_divergence is complete, with the MITIGATED_FONSI decision SIGNED at 2026-11-01T12:00:00Z."
            - "monitoring_escalation_factor is the office default 1.035; commitment 1 has 3 x 4500 cents (raw 13972.5) and commitment 2 has 3 x 2500 cents (raw 7762.5)."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_alt_a
            - *c_alt_b
            - *c_screen_alt_a
            - *c_screen_alt_b
            - *c_agency_fws
            - *c_con_esa
            - *c_con_esa_concur
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
            - *c_final_unmit
            - *c_doc_ea
            - *c_clk_sep5
            - *c_publish_ea
            - *c_comment1
            - *c_clk_oct5
            - *c_close_comments
            - *c_respond_comment1
            - *c_finalize_doc
            - *c_decision
            - *c_mit1
            - *c_get_dec_v2
            - *c_mit2
            - *c_clk_nov1
          trigger:
            - *c_sign
          assert:
            - "MitigationCommitment.${mit1_id}.lifecycle_obligation_cents == 1213973"
            - "MitigationCommitment.${mit2_id}.lifecycle_obligation_cents == 2107763"
            - "DecisionDocument.${dec_id}.base_obligation_cents == 3321736"
            - "DecisionDocument.${dec_id}.base_obligation_cents != 3321735"

      - name: mode_c_credit_points_pinned_before_contingency_fee
        grounds:
          - calculations.decision_binding_obligation_cents
          - entities.DecisionDocument.fields.credit_points
          - entities.DecisionDocument.fields.contingency_fee_cents
          - entities.DecisionDocument.fields.mitigated_max_score
          - entities.ReviewOffice.fields.cost_per_reduction_point_cents
          - entities.ReviewOffice.fields.max_mitigated_reduction_points
        distinguishing_aspect: |
          Mode (c): a circular-looking chain (fee is keyed on a credit tier, credit is keyed on an
          obligation, the obligation includes the fee) whose pinned order forces credit_points 13.29,
          computed from base_obligation_cents 3321736 only; recomputing capacity from the post-fee
          binding total 3487823 would yield 13.95 and a different mitigated_max_score.
        test_recipe:
          setup:
            - "The full ERO-1 / Ridgeline chain of decision_obligation_commitment_only_vs_lifecycle_divergence is complete and the MITIGATED_FONSI decision is about to be signed."
            - "Declared reduction points total 14.0 (9.0 + 5.0), the office tier cap is 18.0, and cost_per_reduction_point_cents is 250000 so capacity_points is 13.286944 — the binding constraint."
            - "action.max_unmitigated_score is 70.21 from the FINAL BIOLOGICAL analysis."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_alt_a
            - *c_alt_b
            - *c_screen_alt_a
            - *c_screen_alt_b
            - *c_agency_fws
            - *c_con_esa
            - *c_con_esa_concur
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
            - *c_final_unmit
            - *c_doc_ea
            - *c_clk_sep5
            - *c_publish_ea
            - *c_comment1
            - *c_clk_oct5
            - *c_close_comments
            - *c_respond_comment1
            - *c_finalize_doc
            - *c_decision
            - *c_mit1
            - *c_get_dec_v2
            - *c_mit2
            - *c_clk_nov1
          trigger:
            - *c_sign
          assert:
            - "DecisionDocument.${dec_id}.credit_points == 13.29"
            - "DecisionDocument.${dec_id}.credit_points != 13.95"
            - "DecisionDocument.${dec_id}.contingency_fee_cents == 166087"
            - "DecisionDocument.${dec_id}.binding_obligation_cents == 3487823"
            - "ProposedAction.${act_id}.max_unmitigated_score == 70.21"
            - "DecisionDocument.${dec_id}.mitigated_max_score == 56.92"

  - rule_id: non_linear_state_machine
    instances:
      - name: ec_screen_returned_resubmit_cycle_tracks_round_count
        grounds:
          - state_machines.ExtraordinaryCircumstanceScreen.SUBMITTED_to_RETURNED
          - state_machines.ExtraordinaryCircumstanceScreen.RETURNED_to_SUBMITTED
          - state_machines.ExtraordinaryCircumstanceScreen.SUBMITTED_to_CLEARED
          - entities.ExtraordinaryCircumstanceScreen.fields.screen_round
          - entities.ProposedAction.fields.ec_screen_outcome
        distinguishing_aspect: |
          Non-linear shape on the ExtraordinaryCircumstanceScreen entity: a true cycle
          SUBMITTED -> RETURNED -> SUBMITTED traversed twice, with screen_round reaching 3 and
          action.ec_screen_outcome staying null across both RETURNED rounds because a return is not
          an adjudicated outcome.
        test_recipe:
          setup:
            - "ReviewOffice ERO-1 exists with default policy fields."
            - "ProposedAction 'Ridgeline Fuels Treatment' is at review_stage INTAKE with a SUBMITTED screen whose findings include no code at or above the severity trigger."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
          trigger:
            - call: "POST /ec-screens/${scr1_id}/adjudicate"
              payload: { disposition: "RETURNED", adjudicator_note: "Narrative for the wetland code is missing supporting survey data" }
              as: ReviewingOfficial
            - call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
              captures: { stage_after_first_return: $.data.review_stage }
            - call: "POST /ec-screens/${scr1_id}/resubmit"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "No historic properties in the action area" }
                  - { code: "EC_ENDANGERED_SPECIES", present: true, severity: 2, narrative: "Lynx transit habitat, discountable effects" }
                  - { code: "EC_WETLAND", present: true, severity: 1, narrative: "0.2 ha incidental wetland, avoided by design" }
              as: NepaCoordinator
            - call: "POST /ec-screens/${scr1_id}/adjudicate"
              payload: { disposition: "RETURNED", adjudicator_note: "Wetland avoidance design still not described" }
              as: ReviewingOfficial
            - call: "POST /ec-screens/${scr1_id}/resubmit"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "No historic properties in the action area" }
                  - { code: "EC_ENDANGERED_SPECIES", present: true, severity: 2, narrative: "Lynx transit habitat, discountable effects" }
                  - { code: "EC_WETLAND", present: true, severity: 1, narrative: "0.2 ha wetland avoided by a 30 m equipment exclusion buffer" }
              as: NepaCoordinator
            - call: "POST /ec-screens/${scr1_id}/adjudicate"
              payload: { disposition: "CLEARED", adjudicator_note: "Avoidance design accepted; no extraordinary circumstance triggered" }
              as: ReviewingOfficial
          assert:
            - "After the first RETURNED: ExtraordinaryCircumstanceScreen.${scr1_id}.status == RETURNED and screen_round == 1"
            - "After the first RETURNED: ProposedAction.${act_id}.ec_screen_outcome == null and ${stage_after_first_return} == INTAKE"
            - "After the first resubmit: ExtraordinaryCircumstanceScreen.${scr1_id}.status == SUBMITTED, screen_round == 2, adjudicator_note == null"
            - "After the second resubmit: ExtraordinaryCircumstanceScreen.${scr1_id}.screen_round == 3"
            - "After the second resubmit: ExtraordinaryCircumstanceScreen.${scr1_id}.max_severity == 2 and triggered_codes == []"
            - "After the final CLEARED: ExtraordinaryCircumstanceScreen.${scr1_id}.status == CLEARED and screen_round == 3"
            - "After the final CLEARED: ProposedAction.${act_id}.ec_screen_outcome == CLEARED and review_stage == SCREENED"
            - "ProposedAction.${act_id}.extraordinary_circumstance_flag == false"

      - name: document_publication_and_comment_axes_advance_independently
        grounds:
          - state_machines.NepaDocument.publication_status_DRAFT_to_PUBLISHED
          - state_machines.NepaDocument.comment_status_OPEN_to_CLOSED
          - state_machines.NepaDocument.publication_status_PUBLISHED_to_FINAL
          - entities.NepaDocument.fields.publication_status
          - entities.NepaDocument.fields.comment_status
        distinguishing_aspect: |
          Non-linear shape on the NepaDocument entity — two parallel state dimensions on one row:
          close-comment-period advances comment_status OPEN -> CLOSED while publication_status stays
          PUBLISHED, and finalize advances publication_status PUBLISHED -> FINAL while comment_status
          stays CLOSED, so the combined state is a product of two independent axes.
