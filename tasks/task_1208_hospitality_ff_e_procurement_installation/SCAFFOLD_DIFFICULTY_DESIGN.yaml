            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent, captures: { err2: $.data.error_id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent, captures: { attached_status: $.data.fulfillment_status, attached_ship: $.data.shipment_id } }
          assert:
            - "First attach (shipment PLANNED) rejected 409 ERR_SHIPMENT_NOT_CONSOLIDATING — shipment gate evaluated on the path resource first"
            - "Second attach (shipment CONSOLIDATING, PO ISSUED) rejected 409 ERR_PO_NOT_READY_TO_SHIP — PO gate"
            - "Third attach succeeds: PurchaseOrder.${po_id}.fulfillment_status == CONSOLIDATED and shipment_id == ${sh_id}"
            - "Shipment.${sh_id}.total_cube_m3 == 10 after attach"

      - name: window_start_requires_line_stock
        grounds:
          - state_machines.InstallationWindow.RELEASED_to_IN_PROGRESS
          - errors[ERR_INSUFFICIENT_INSTALLABLE_STOCK]
        distinguishing_aspect: |
          Entity pair InstallationWindow x POLine: the window's IN_PROGRESS transition is gated by the
          quantity pools of a different aggregate (every task's POLine must hold qty_installable >=
          task.quantity); two tasks totalling 11 units against a 10-unit pool force the rejection.
          Sibling instance crosses Shipment x PurchaseOrder — a different pair.
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 10 x 10000c cube 5 awarded and ordered; shipment fully received (10 good units, qty_installable == 10)"
            - "Room R-301; window W [2026-07-01, 2026-07-05) crew 2 RELEASED with task T1 qty 10 on the line and task T2 qty 1 on the same line (creation-time soft checks pass: 10 >= 10 and 10 >= 1)"
