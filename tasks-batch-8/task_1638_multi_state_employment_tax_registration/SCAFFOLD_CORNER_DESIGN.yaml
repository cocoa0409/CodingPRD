      - name: err_agreement_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGREEMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: agreement_closed_interval_boundary_overlap
          rationale: "Asserted at the closed-interval boundary in the Rule-8 instance."

      - name: err_election_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ELECTION_OVERLAP]"]
        excluded_because:
          difficulty_instance: election_half_open_adjacency_vs_overlap
