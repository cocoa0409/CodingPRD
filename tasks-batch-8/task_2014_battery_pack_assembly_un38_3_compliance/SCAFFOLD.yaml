# =============================================================================
# Task 2014 — Battery Pack Assembly & UN38.3 Compliance
# Contract battery pack integrator: cell lots, BOM/welding, BMS firmware,
# UN38.3 dossiers, storage fire-code segregation, transport, returns, recalls.
# =============================================================================

scenario: |
  2014. Battery Pack Assembly & UN38.3 Compliance (contract battery pack integrator): cell lot & state-of-charge receiving, pack BOM & welding parameter record, BMS programming & serialized firmware, safety test dossier & shipping classification, storage SOC & fire-code segregation, transport paperwork & carrier acceptance, warranty/return & safe discharge, recall & serial trace

domain_name: battery-pack-un38-3
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hierarchical
  state_machine_shape: parallel   # BatteryPack has two parallel state axes (assembly_status, logistics_status); dossier/recall cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # AssemblyLead ≠ QualityEngineer ≠ SafetyOfficer; SoD enforced between record-weld and certify-weld
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1 — Entity-Relationship Table
# =============================================================================
entities:
  - name: IntegrationProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code (e.g. PRG-2014-A)" }
      - { name: compliance_risk_index, type: number, source: computed, default: 100, description: "Aggregate risk index, starts at 100, lower is worse; decremented by safety/recall events" }
      - { name: storage_capacity_wh, type: integer, source: input, description: "Total watt-hour capacity permitted across all storage slots of this program" }
      - { name: wh_committed, type: number, source: computed, default: 0, description: "Read-only watt-hours currently committed by packs in STAGED or STORED logistics_status" }
      - { name: wh_available, type: number, source: computed, description: "Read-only = storage_capacity_wh - wh_committed" }
      - { name: recall_count, type: integer, source: computed, default: 0, description: "Count of RecallCampaign rows whose status is ACTIVE" }
      - { name: status, type: enum, source: system, description: "OPEN → SUSPENDED → CLOSED; SUSPENDED gates child mutations" }

  - name: CellLot
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; owning program" }
      - { name: lot_code, type: string, source: input, description: "Vendor lot code (must be unique within program)" }
      - { name: cell_count, type: integer, source: input, description: "Number of cells in the lot (> 0)" }
      - { name: rated_capacity_mah, type: integer, source: input, description: "Per-cell rated capacity in mAh" }
      - { name: receiving_soc_percent, type: number, source: input, description: "State-of-charge at receiving, 0..100 inclusive, one decimal place" }
      - { name: measured_soc_percent, type: number, source: computed, description: "Read-only measured SOC from the latest accepted CellInspectionRecord; null until first inspection" }
      - { name: quarantine_cycle_count, type: integer, source: computed, default: 0, description: "Number of times this lot has re-entered QUARANTINE (retest loop bound)" }
      - { name: status, type: enum, source: system, description: "RECEIVED → QUARANTINE → ACCEPTED / REJECTED → (retest) QUARANTINE; ACCEPTED → DEPLETED" }

  - name: CellInspectionRecord
    parent: CellLot
    common_fields: false   # immutable event
    fields:
      - { name: cell_lot_id, type: string, source: system, description: "FK -> CellLot.id; lot under inspection" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized for trace" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of recording QualityEngineer" }
      - { name: measured_soc_percent, type: number, source: input, description: "SOC measured by the inspector, 0..100, one decimal" }
      - { name: measured_voltage_v, type: number, source: input, description: "Open-circuit voltage (V), two decimals" }
      - { name: visual_defect_count, type: integer, source: input, description: "Number of visual defects (>=0)" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL_SOFT | FAIL_HARD" }

  - name: PackBOM
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; owning program" }
      - { name: bom_code, type: string, source: input, description: "Unique BOM code within program" }
      - { name: cell_lot_id, type: string, source: input, description: "FK -> CellLot.id; the lot this BOM draws cells from" }
      - { name: cells_required, type: integer, source: input, description: "Cells consumed per pack built from this BOM" }
      - { name: series_count, type: integer, source: input, description: "Number of cells in series (>=1)" }
      - { name: parallel_count, type: integer, source: input, description: "Number of cells in parallel (>=1)" }
      - { name: nominal_energy_wh, type: number, source: computed, description: "Read-only = cells_required * rated_capacity_mah * 3.6 / 1000 (nominal 3.6 V per cell), 2 decimals" }
      - { name: welding_profile, type: enum, source: input, description: "WELD_PROFILE_A | WELD_PROFILE_B | WELD_PROFILE_C; selects base heat dose" }
      - { name: is_locked, type: boolean, source: computed, default: false, description: "True once a BatteryPack has consumed this BOM; thereafter welding_profile and cells_required are immutable" }
      - { name: version_note, type: string, source: input, required: false, description: "Optional note" }

  - name: BatteryPack
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; owning program" }
      - { name: serial_number, type: string, source: system, description: "Server-minted serial in form SN-<program_code>-<zero-padded 6-digit counter>" }
      - { name: bom_id, type: string, source: input, description: "FK -> PackBOM.id; BOM this pack was built from" }
      - { name: cell_lot_id, type: string, source: system, description: "FK -> CellLot.id; denormalized from PackBOM at assembly time" }
      - { name: pack_energy_wh, type: number, source: computed, description: "Read-only = PackBOM.nominal_energy_wh at assembly" }
      - { name: assembly_status, type: enum, source: system, description: "ASSEMBLY axis: BUILT → WELD_RECORDED → WELD_CERTIFIED → BMS_FLASHED → TEST_QUEUED → CLASSIFIED → READY_TO_STORE → RECALLED" }
      - { name: logistics_status, type: enum, source: system, description: "LOGISTICS axis (parallel): NOT_STORED → STAGED → STORED → PICKED → PACKED_FOR_SHIP → SHIPPED → DELIVERED → RETURNED" }
      - { name: soc_percent, type: number, source: computed, description: "Read-only current SOC; initialized from CellLot.measured_soc_percent at BUILT; updated by safe-discharge" }
      - { name: soc_band, type: enum, source: computed, description: "Derived: SOC_LOW (<30), SOC_MID (>=30 and <=60), SOC_HIGH (>60); hysteresis variant applies when leaving STORAGE" }
      - { name: shipping_classification, type: enum, source: computed, description: "NONE | UN3480 | UN3481 | UN3090 | UN3091; computed from dossier outcome + chemistry flag" }
      - { name: welding_heat_dose_j, type: number, source: computed, description: "Read-only total weld heat in joules (see welding_heat_dose calculation)" }
      - { name: bms_firmware_id, type: string, source: computed, description: "FK -> BMSFirmware.id; the firmware flashed onto this pack; null until BMS_FLASHED" }
      - { name: dossier_id, type: string, source: computed, description: "FK -> SafetyTestDossier.id; null until dossier is opened" }
      - { name: storage_location_id, type: string, source: computed, description: "FK -> StorageLocation.id; null until STAGED" }
      - { name: active_recall_id, type: string, source: computed, description: "FK -> RecallCampaign.id; non-null iff this pack is captured by an ACTIVE recall" }
      - { name: is_safe_discharged, type: boolean, source: computed, default: false, description: "True iff pack SOC has been driven to <= SAFE_DISCHARGE_MAX_PERCENT under an approved ReturnAuthorization" }
      - { name: disposition, type: enum, source: computed, description: "IN_SERVICE | RETURN_PENDING | DISCHARGED | SCRAPPED | RECALLED_HOLD" }

  - name: WeldingParameterRecord
    parent: BatteryPack
    common_fields: false  # immutable
    fields:
      - { name: battery_pack_id, type: string, source: system, description: "FK -> BatteryPack.id; pack this record applies to" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized" }
      - { name: operator_id, type: string, source: system, description: "X-User-ID of the AssemblyLead recording the weld" }
      - { name: certified_by_id, type: string, source: computed, description: "X-User-ID of the QualityEngineer who certified; null until certified" }
      - { name: weld_count, type: integer, source: input, description: "Number of welds performed (>=1)" }
      - { name: current_amps, type: number, source: input, description: "Weld current in amps (one decimal)" }
      - { name: pulse_ms, type: integer, source: input, description: "Pulse duration in milliseconds (>=1)" }
      - { name: electrode_force_n, type: number, source: input, description: "Electrode force in newtons (one decimal)" }
      - { name: weld_profile_used, type: enum, source: input, description: "WELD_PROFILE_A | B | C — must equal PackBOM.welding_profile at certification time" }
      - { name: heat_dose_j, type: number, source: computed, description: "Read-only computed heat dose (see welding_heat_dose calc)" }
      - { name: is_certified, type: boolean, source: computed, default: false, description: "True once a QualityEngineer has certified" }

  - name: BMSFirmware
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; owning program" }
      - { name: firmware_version, type: string, source: input, description: "Semantic version string, e.g. 2.4.1" }
      - { name: binary_sha256, type: string, source: input, description: "SHA-256 of the firmware image (64 lowercase hex chars)" }
      - { name: supports_soc_hysteresis, type: boolean, source: input, default: false, description: "Whether this firmware supports the hysteresis SOC band variant" }
      - { name: approval_record_id, type: string, source: computed, description: "FK -> FirmwareApproval.id of the active approval; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT → PENDING_REVIEW → APPROVED → DEPRECATED → APPROVED (re-cert cycle)" }

  - name: FirmwareApproval
    parent: BMSFirmware
    common_fields: false  # immutable event
    fields:
      - { name: bms_firmware_id, type: string, source: system, description: "FK -> BMSFirmware.id; firmware under review" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized" }
      - { name: approver_id, type: string, source: system, description: "X-User-ID of deciding SafetyOfficer" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT | REVOKE" }
      - { name: rationale, type: string, source: input, description: "Free-text rationale (>= 20 chars)" }

  - name: BMSFlashRecord
    parent: BatteryPack
    common_fields: false  # immutable
    fields:
      - { name: battery_pack_id, type: string, source: system, description: "FK -> BatteryPack.id" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized" }
      - { name: bms_firmware_id, type: string, source: input, description: "FK -> BMSFirmware.id; firmware flashed" }
      - { name: flashed_by_id, type: string, source: system, description: "X-User-ID of AssemblyLead who performed flash" }
      - { name: flash_cycle_index, type: integer, source: computed, description: "1-indexed counter of flash attempts on this pack" }

  - name: SafetyTestDossier
    parent: BatteryPack
    common_fields: true
    fields:
      - { name: battery_pack_id, type: string, source: system, description: "FK -> BatteryPack.id" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized" }
      - { name: dossier_cycle_index, type: integer, source: computed, default: 1, description: "1 for the initial dossier; increments each retest loop" }
      - { name: altitude_sim_kpa, type: number, source: input, required: false, description: "T1 altitude simulation pressure (kPa)" }
      - { name: thermal_cycles, type: integer, source: input, required: false, description: "T2 thermal cycle count" }
      - { name: vibration_minutes, type: integer, source: input, required: false, description: "T3 vibration duration" }
      - { name: shock_g_peak, type: number, source: input, required: false, description: "T4 shock peak G" }
      - { name: external_short_circuit_ok, type: boolean, source: input, required: false, description: "T5 external short circuit result" }
      - { name: impact_crush_ok, type: boolean, source: input, required: false, description: "T6 impact/crush result" }
      - { name: overcharge_ok, type: boolean, source: input, required: false, description: "T7 overcharge result" }
      - { name: forced_discharge_ok, type: boolean, source: input, required: false, description: "T8 forced discharge result" }
      - { name: provisional_un_score, type: number, source: computed, description: "Read-only provisional score per provisional variant of un38_3_composite_score" }
      - { name: final_un_score, type: number, source: computed, description: "Read-only final score once dossier is SUBMITTED; null until then" }
      - { name: outcome, type: enum, source: computed, description: "PENDING | PASS | FAIL; derived from final_un_score on SUBMIT" }
      - { name: status, type: enum, source: system, description: "OPEN → TESTS_RECORDED → SUBMITTED → APPROVED | FAILED → OPEN (retest cycle)" }

  - name: StorageLocation
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id" }
      - { name: location_code, type: string, source: input, description: "Warehouse slot code" }
      - { name: fire_zone, type: enum, source: input, description: "ZONE_A | ZONE_B | ZONE_C | ZONE_ISOLATION" }
      - { name: capacity_wh, type: integer, source: input, description: "Maximum watt-hours this slot may hold (>0)" }
      - { name: wh_occupied, type: number, source: computed, default: 0, description: "Read-only sum of pack_energy_wh of packs currently STAGED or STORED here" }
      - { name: wh_headroom, type: number, source: computed, description: "Read-only = capacity_wh - wh_occupied" }
      - { name: accepts_soc_band, type: array, source: input, description: "Subset of [SOC_LOW, SOC_MID, SOC_HIGH] this slot is fire-rated to hold" }

  - name: StoragePlacement
    parent: StorageLocation
    common_fields: true
    fields:
      - { name: storage_location_id, type: string, source: system, description: "FK -> StorageLocation.id" }
      - { name: battery_pack_id, type: string, source: input, description: "FK -> BatteryPack.id" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized" }
      - { name: staged_at_utc, type: datetime, source: system, description: "When pack entered STAGED at this slot" }
      - { name: stored_at_utc, type: datetime, source: computed, description: "When pack transitioned STAGED → STORED; null until then" }
      - { name: released_at_utc, type: datetime, source: computed, description: "When placement was released (PICKED); null until then" }
      - { name: status, type: enum, source: system, description: "STAGED → STORED → RELEASED" }

  - name: TransportShipment
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id" }
      - { name: carrier_code, type: string, source: input, description: "Carrier identifier (e.g. DHL-DG, FEDEX-DG)" }
      - { name: un_class_code, type: enum, source: input, description: "UN3480 | UN3481 | UN3090 | UN3091 — must match every contained pack's shipping_classification at tender" }
      - { name: declared_weight_kg, type: number, source: input, description: "Declared gross weight (kg, two decimals)" }
      - { name: total_pack_count, type: integer, source: computed, default: 0, description: "Read-only count of packs currently attached" }
      - { name: total_wh, type: number, source: computed, default: 0, description: "Read-only sum of pack_energy_wh attached" }
      - { name: carrier_charge_cents, type: integer, source: computed, description: "Read-only computed carrier charge (carrier_acceptance_charge calc)" }
      - { name: status, type: enum, source: system, description: "DRAFT → TENDERED → CARRIER_ACCEPTED → IN_TRANSIT → DELIVERED | CARRIER_REJECTED → DRAFT (re-tender cycle)" }

  - name: ShipmentPackLink
    parent: TransportShipment
    common_fields: false  # immutable
    fields:
      - { name: transport_shipment_id, type: string, source: system, description: "FK -> TransportShipment.id" }
      - { name: battery_pack_id, type: string, source: input, description: "FK -> BatteryPack.id" }
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id; denormalized" }
      - { name: attached_at_utc, type: datetime, source: system, description: "Attach timestamp" }

  - name: ReturnAuthorization
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id" }
      - { name: battery_pack_id, type: string, source: input, description: "FK -> BatteryPack.id; the pack being returned" }
      - { name: reason_code, type: enum, source: input, description: "DEFECT | WARRANTY | OVERSTOCK | RECALL_RETURN" }
      - { name: requested_by_id, type: string, source: system, description: "X-User-ID of CustomerService opener" }
      - { name: approved_by_id, type: string, source: computed, description: "X-User-ID of SafetyOfficer approver; null until APPROVED" }
      - { name: target_soc_percent, type: number, source: input, description: "SOC the pack must be discharged to (0..SAFE_DISCHARGE_MAX_PERCENT)" }
      - { name: actual_soc_after_discharge, type: number, source: computed, description: "Read-only SOC recorded at safe-discharge completion; null until then" }
      - { name: status, type: enum, source: system, description: "REQUESTED → APPROVED → DISCHARGE_PENDING → DISCHARGED → RECEIVED → CLOSED | DENIED" }

  - name: RecallCampaign
    parent: IntegrationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IntegrationProgram.id" }
      - { name: recall_code, type: string, source: input, description: "Unique recall code within program" }
      - { name: scope_lot_id, type: string, source: input, required: false, description: "FK -> CellLot.id; if set, all packs built from this lot are in scope" }
      - { name: scope_bom_id, type: string, source: input, required: false, description: "FK -> PackBOM.id; if set, all packs built from this BOM are in scope" }
      - { name: scope_serial_prefix, type: string, source: input, required: false, description: "Serial prefix match (e.g. SN-PRG-2014-A-0001) — at least one of the three scope_* fields must be set" }
      - { name: packs_in_scope, type: integer, source: computed, default: 0, description: "Read-only count of BatteryPack rows currently captured by this recall" }
      - { name: packs_contained, type: integer, source: computed, default: 0, description: "Read-only count whose assembly_status has reached RECALLED" }
      - { name: severity, type: enum, source: input, description: "CLASS_I | CLASS_II | CLASS_III" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → CONTAINED → CLOSED" }

# =============================================================================
# Table 1.2 — State Machine Table
# =============================================================================
state_machines:
  - entity: IntegrationProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: POST /api/integration-programs/{programId}/suspend
        actor: SafetyOfficer
        preconditions:
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects:
          - "All non-terminal CellLot transitions blocked while SUSPENDED"
          - "All non-terminal BatteryPack assembly transitions blocked while SUSPENDED"
          - "StoragePlacement STAGED→STORED transitions blocked while SUSPENDED"

      - from: SUSPENDED
        to: OPEN
        trigger: POST /api/integration-programs/{programId}/resume
        actor: SafetyOfficer
        preconditions:
          - "Program must be SUSPENDED (ERR_PROGRAM_NOT_SUSPENDED)"
        side_effects:
          - "Re-evaluate every BatteryPack.active_recall_id (drop links to recalls no longer ACTIVE)"

      - from: OPEN
        to: CLOSED
        trigger: POST /api/integration-programs/{programId}/close
        actor: SafetyOfficer
        preconditions:
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "No BatteryPack exists with assembly_status NOT IN {RECALLED} AND logistics_status NOT IN {DELIVERED, RETURNED} (ERR_UNRESOLVED_PACKS_REMAIN)"
          - "No TransportShipment in TENDERED / CARRIER_ACCEPTED / IN_TRANSIT (ERR_OPEN_SHIPMENTS_REMAIN)"
          - "No RecallCampaign in ACTIVE (ERR_ACTIVE_RECALL_EXISTS)"
        side_effects: []

  - entity: CellLot
    initial_state: RECEIVED
    terminal_states: [DEPLETED]
    transitions:
      - from: RECEIVED
        to: QUARANTINE
        trigger: POST /api/integration-programs/{programId}/cell-lots/{lotId}/quarantine
        actor: QualityEngineer
        preconditions:
          - "Lot must be RECEIVED (ERR_LOT_NOT_RECEIVED)"
          - "Owning program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects: []

      - from: QUARANTINE
        to: ACCEPTED
        trigger: POST /api/integration-programs/{programId}/cell-lots/{lotId}/inspections with outcome=PASS
        actor: QualityEngineer
        preconditions:
          - "Lot must be QUARANTINE (ERR_LOT_NOT_IN_QUARANTINE)"
          - "Inspection outcome must be PASS (ERR_INSPECTION_NOT_PASS)"
          - "measured_soc_percent must be within ±2.0 of receiving_soc_percent (ERR_SOC_OUT_OF_TOLERANCE)"
        side_effects:
          - "CellLot.measured_soc_percent := inspection.measured_soc_percent"
          - "CellLot.quarantine_cycle_count unchanged on first acceptance"

      - from: QUARANTINE
        to: REJECTED
        trigger: POST /api/integration-programs/{programId}/cell-lots/{lotId}/inspections with outcome=FAIL_HARD
        actor: QualityEngineer
        preconditions:
          - "Lot must be QUARANTINE (ERR_LOT_NOT_IN_QUARANTINE)"
        side_effects:
          - "Program.compliance_risk_index -= 3 (floor 0)"

      - from: REJECTED
        to: QUARANTINE
        trigger: POST /api/integration-programs/{programId}/cell-lots/{lotId}/retest
        actor: QualityEngineer
        preconditions:
          - "Lot must be REJECTED (ERR_LOT_NOT_REJECTED)"
          - "quarantine_cycle_count < 2 (ERR_RETEST_LIMIT_EXCEEDED)"
        side_effects:
          - "CellLot.quarantine_cycle_count += 1"

      - from: ACCEPTED
        to: DEPLETED
        trigger: "system (automatic when the sum of cells_required across all is_locked PackBOMs referencing this lot equals CellLot.cell_count)"
        actor: system
        preconditions: []
        side_effects:
          - "No new PackBOM may reference this lot (ERR_LOT_DEPLETED on attempt)"

      - from: QUARANTINE
        to: QUARANTINE
        trigger: POST /api/integration-programs/{programId}/cell-lots/{lotId}/inspections with outcome=FAIL_SOFT
        actor: QualityEngineer
        preconditions:
          - "Lot must be QUARANTINE (ERR_LOT_NOT_IN_QUARANTINE)"
        side_effects:
          - "CellLot.quarantine_cycle_count += 1"
          - "Lot remains QUARANTINE (self-loop on soft-fail)"

  - entity: BatteryPack
    # Parallel axes: assembly_status and logistics_status evolve independently
    # with guards at join points (CLASSIFIED required before STAGED, etc.)
    initial_state: BUILT / NOT_STORED
    terminal_states: [RECALLED / RETURNED, RECALLED / DELIVERED, RECALLED / NOT_STORED]
    transitions:
      # ------- assembly axis -------
      - from: BUILT
        to: WELD_RECORDED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/welding-records
        actor: AssemblyLead
        preconditions:
          - "Pack must be BUILT (ERR_PACK_NOT_BUILT)"
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "PackBOM.is_locked must be true (auto-set at pack creation; informational)"
        side_effects:
          - "WeldingParameterRecord persisted (immutable)"
          - "BatteryPack.welding_heat_dose_j := computed heat dose"

      - from: WELD_RECORDED
        to: WELD_CERTIFIED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/welding-records/{recordId}/certify
        actor: QualityEngineer
        preconditions:
          - "Pack must be WELD_RECORDED (ERR_PACK_NOT_WELD_RECORDED)"
          - "Record.is_certified must be false (ERR_WELD_ALREADY_CERTIFIED)"
          - "certifier (X-User-ID) MUST NOT equal record.operator_id (segregation of duties, ERR_SOD_WELD_CERTIFY)"
          - "record.weld_profile_used must equal PackBOM.welding_profile (ERR_WELD_PROFILE_MISMATCH)"
          - "record.heat_dose_j must not exceed PackBOM-profile ceiling (ERR_HEAT_DOSE_EXCEEDED)"
        side_effects:
          - "WeldingParameterRecord.is_certified := true"
          - "WeldingParameterRecord.certified_by_id := X-User-ID"

      - from: WELD_CERTIFIED
        to: BMS_FLASHED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/bms-flash-records
        actor: AssemblyLead
        preconditions:
          - "Pack must be WELD_CERTIFIED (ERR_PACK_NOT_WELD_CERTIFIED)"
          - "Firmware must exist AND be APPROVED (ERR_FIRMWARE_NOT_APPROVED)"
          - "Firmware.binary_sha256 must match the active approval row's recorded hash (implied via approval_record_id linkage)"
        side_effects:
          - "BMSFlashRecord persisted (immutable); flash_cycle_index := prior count + 1"
          - "BatteryPack.bms_firmware_id := firmware.id"

      - from: BMS_FLASHED
        to: TEST_QUEUED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers
        actor: QualityEngineer
        preconditions:
          - "Pack must be BMS_FLASHED (ERR_PACK_NOT_BMS_FLASHED)"
          - "No other SafetyTestDossier for this pack exists in non-terminal status {OPEN, TESTS_RECORDED, SUBMITTED} (ERR_DOSSIER_ALREADY_OPEN)"
        side_effects:
          - "SafetyTestDossier persisted with dossier_cycle_index := prior count + 1"
          - "BatteryPack.dossier_id := new dossier.id"

      - from: TEST_QUEUED
        to: CLASSIFIED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}/submit (when outcome=PASS)
        actor: SafetyOfficer
        preconditions:
          - "Dossier must be TESTS_RECORDED (ERR_DOSSIER_NOT_TESTS_RECORDED)"
          - "Pack must be TEST_QUEUED (ERR_PACK_NOT_TEST_QUEUED)"
          - "final_un_score >= PASS_THRESHOLD (else outcome=FAIL and pack stays TEST_QUEUED; dossier → FAILED)"
        side_effects:
          - "Dossier.outcome := PASS; dossier.status := SUBMITTED"
          - "BatteryPack.shipping_classification := derived per shipping_classification calc"
          - "BatteryPack.assembly_status := CLASSIFIED"

      - from: CLASSIFIED
        to: READY_TO_STORE
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}/approve
        actor: SafetyOfficer
        preconditions:
          - "Dossier must be SUBMITTED with outcome=PASS (ERR_DOSSIER_NOT_PASS)"
          - "Pack must be CLASSIFIED (ERR_PACK_NOT_CLASSIFIED)"
        side_effects:
          - "Dossier.status := APPROVED"
          - "BatteryPack.assembly_status := READY_TO_STORE"

      - from: READY_TO_STORE
        to: RECALLED
        trigger: "system (automatic when an ACTIVE RecallCampaign scope captures this pack)"
        actor: system
        preconditions: []
        side_effects:
          - "BatteryPack.active_recall_id := recall.id"
          - "BatteryPack.disposition := RECALLED_HOLD"
          - "RecallCampaign.packs_in_scope += 1 (and packs_contained += 1 when transition completes)"
          - "If pack currently STAGED or STORED: linked StoragePlacement is force-released and slot wh_occupied decremented"
          - "Program.compliance_risk_index -= severity_weight (CLASS_I=15, CLASS_II=8, CLASS_III=3)"

      # ------- logistics axis -------
      - from: NOT_STORED
        to: STAGED
        trigger: POST /api/integration-programs/{programId}/storage-placements
        actor: LogisticsCoordinator
        preconditions:
          - "Pack.assembly_status must be READY_TO_STORE (ERR_PACK_NOT_READY_TO_STORE)"
          - "Pack.logistics_status must be NOT_STORED (ERR_PACK_ALREADY_STORED)"
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "StorageLocation must exist and be in same program (ERR_LOCATION_NOT_FOUND)"
          - "Pack.soc_band must be in location.accepts_soc_band (ERR_SOC_BAND_NOT_ACCEPTED)"
          - "location.wh_headroom >= pack.pack_energy_wh (ERR_LOCATION_CAPACITY_EXCEEDED)"
          - "program.wh_available >= pack.pack_energy_wh (ERR_PROGRAM_CAPACITY_EXCEEDED)"
        side_effects:
          - "StoragePlacement persisted (status=STAGED)"
          - "StorageLocation.wh_occupied += pack.pack_energy_wh"
          - "Program.wh_committed += pack.pack_energy_wh"
          - "BatteryPack.storage_location_id := location.id"
          - "BatteryPack.logistics_status := STAGED"

      - from: STAGED
        to: STORED
        trigger: POST /api/integration-programs/{programId}/storage-placements/{placementId}/store
        actor: LogisticsCoordinator
        preconditions:
          - "Placement must be STAGED (ERR_PLACEMENT_NOT_STAGED)"
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects:
          - "Placement.status := STORED; stored_at_utc := now"
          - "BatteryPack.logistics_status := STORED"

      - from: STORED
        to: PICKED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/pick
        actor: LogisticsCoordinator
        preconditions:
          - "Pack.logistics_status must be STORED (ERR_PACK_NOT_STORED)"
          - "No ACTIVE RecallCampaign captures this pack (ERR_PACK_UNDER_RECALL)"
        side_effects:
          - "Placement.status := RELEASED; released_at_utc := now"
          - "StorageLocation.wh_occupied -= pack.pack_energy_wh"
          - "Program.wh_committed -= pack.pack_energy_wh"
          - "BatteryPack.storage_location_id := null"
          - "BatteryPack.logistics_status := PICKED"

      - from: PICKED
        to: PACKED_FOR_SHIP
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/attach (with this pack)
        actor: LogisticsCoordinator
        preconditions:
          - "Pack.logistics_status must be PICKED (ERR_PACK_NOT_PICKED)"
          - "Shipment must be DRAFT (ERR_SHIPMENT_NOT_DRAFT)"
          - "Pack.shipping_classification must equal shipment.un_class_code (ERR_UN_CLASS_MISMATCH)"
          - "Pack must not already be attached to a non-terminal shipment (ERR_PACK_ALREADY_ATTACHED)"
        side_effects:
          - "ShipmentPackLink persisted (immutable)"
          - "TransportShipment.total_pack_count += 1; total_wh += pack.pack_energy_wh"
          - "BatteryPack.logistics_status := PACKED_FOR_SHIP"

      - from: PACKED_FOR_SHIP
        to: SHIPPED
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/mark-in-transit (cascades to each attached pack)
        actor: CarrierAgent
        preconditions:
          - "Shipment must be CARRIER_ACCEPTED (ERR_SHIPMENT_NOT_CARRIER_ACCEPTED)"
        side_effects:
          - "BatteryPack.logistics_status := SHIPPED"

      - from: SHIPPED
        to: DELIVERED
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/mark-delivered (cascades)
        actor: CarrierAgent
        preconditions:
          - "Shipment must be IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"
        side_effects:
          - "BatteryPack.logistics_status := DELIVERED"
          - "BatteryPack.disposition := IN_SERVICE"

      - from: DELIVERED
        to: RETURNED
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/receive (cascades when RMA reaches RECEIVED)
        actor: CustomerService
        preconditions:
          - "RMA must be DISCHARGED (ERR_RMA_NOT_DISCHARGED)"
          - "RMA.battery_pack_id must equal this pack (ERR_RMA_PACK_MISMATCH)"
        side_effects:
          - "BatteryPack.logistics_status := RETURNED"
          - "BatteryPack.disposition := SCRAPPED"

  - entity: BMSFirmware
    initial_state: DRAFT
    terminal_states: []   # cyclic; DEPRECATED can return to APPROVED via re-cert
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: POST /api/integration-programs/{programId}/bms-firmwares/{fwId}/submit-review
        actor: AssemblyLead
        preconditions:
          - "Firmware must be DRAFT (ERR_FIRMWARE_NOT_DRAFT)"
        side_effects: []

      - from: PENDING_REVIEW
        to: APPROVED
        trigger: POST /api/integration-programs/{programId}/bms-firmwares/{fwId}/approvals with decision=APPROVE
        actor: SafetyOfficer
        preconditions:
          - "Firmware must be PENDING_REVIEW (ERR_FIRMWARE_NOT_PENDING_REVIEW)"
          - "approver must not equal the AssemblyLead who submitted (segregation of duties, ERR_SOD_FIRMWARE_APPROVE)"
        side_effects:
          - "FirmwareApproval persisted (immutable)"
          - "BMSFirmware.approval_record_id := approval.id"

      - from: PENDING_REVIEW
        to: DRAFT
        trigger: POST /api/integration-programs/{programId}/bms-firmwares/{fwId}/approvals with decision=REJECT
        actor: SafetyOfficer
        preconditions:
          - "Firmware must be PENDING_REVIEW (ERR_FIRMWARE_NOT_PENDING_REVIEW)"
        side_effects:
          - "FirmwareApproval persisted with decision=REJECT"
          - "BMSFirmware returns to DRAFT"

      - from: APPROVED
        to: DEPRECATED
        trigger: POST /api/integration-programs/{programId}/bms-firmwares/{fwId}/deprecate
        actor: SafetyOfficer
        preconditions:
          - "Firmware must be APPROVED (ERR_FIRMWARE_NOT_APPROVED)"
          - "No BatteryPack in non-terminal assembly_status currently references this firmware AND is in TEST_QUEUED or later (ERR_FIRMWARE_IN_USE)"
        side_effects:
          - "FirmwareApproval persisted with decision=REVOKE"
          - "BMSFirmware.approval_record_id := null"

      - from: DEPRECATED
        to: PENDING_REVIEW
        trigger: POST /api/integration-programs/{programId}/bms-firmwares/{fwId}/submit-review
        actor: AssemblyLead
        preconditions:
          - "Firmware must be DEPRECATED (ERR_FIRMWARE_NOT_DEPRECATED)"
        side_effects: []

  - entity: SafetyTestDossier
    initial_state: OPEN
    terminal_states: []   # FAILED → OPEN retest cycle permitted; APPROVED is stable-success but pack can re-enter via recall
    transitions:
      - from: OPEN
        to: TESTS_RECORDED
        trigger: PUT /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}
        actor: QualityEngineer
        preconditions:
          - "Dossier must be OPEN (ERR_DOSSIER_NOT_OPEN)"
          - "All eight T1..T8 test fields must be non-null on the dossier (ERR_INCOMPLETE_TEST_MATRIX)"
        side_effects:
          - "Dossier.provisional_un_score := computed per provisional variant"

      - from: TESTS_RECORDED
        to: SUBMITTED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}/submit
        actor: SafetyOfficer
        preconditions:
          - "Dossier must be TESTS_RECORDED (ERR_DOSSIER_NOT_TESTS_RECORDED)"
        side_effects:
          - "Dossier.final_un_score := computed per final variant"
          - "If final_un_score >= PASS_THRESHOLD: outcome=PASS and BatteryPack transitions to CLASSIFIED (see BatteryPack TEST_QUEUED→CLASSIFIED)"
          - "Else: outcome=FAIL and dossier transitions to FAILED"

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}/approve
        actor: SafetyOfficer
        preconditions:
          - "Dossier must be SUBMITTED (ERR_DOSSIER_NOT_SUBMITTED)"
          - "outcome must be PASS (ERR_DOSSIER_NOT_PASS)"
        side_effects:
          - "BatteryPack CLASSIFIED → READY_TO_STORE"

      - from: SUBMITTED
        to: FAILED
        trigger: "system (automatic on submit when final_un_score < PASS_THRESHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Program.compliance_risk_index -= 5"

      - from: FAILED
        to: OPEN
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers
        actor: QualityEngineer
        preconditions:
          - "Pack must be in TEST_QUEUED (ERR_PACK_NOT_TEST_QUEUED)"
          - "No other non-terminal dossier exists for this pack"
        side_effects:
          - "New SafetyTestDossier persisted with dossier_cycle_index incremented"
          - "BatteryPack.dossier_id := new dossier.id"
          - "BatteryPack.assembly_status remains TEST_QUEUED"

  - entity: StoragePlacement
    initial_state: STAGED
    terminal_states: [RELEASED]
    transitions:
      - from: STAGED
        to: STORED
        trigger: POST /api/integration-programs/{programId}/storage-placements/{placementId}/store
        actor: LogisticsCoordinator
        preconditions:
          - "Placement must be STAGED (ERR_PLACEMENT_NOT_STAGED)"
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects:
          - "stored_at_utc := now"

      - from: STAGED
        to: RELEASED
        trigger: "system (automatic when linked pack enters RECALLED, or POST .../release)"
        actor: system | LogisticsCoordinator
        preconditions: []
        side_effects:
          - "StorageLocation.wh_occupied -= pack.pack_energy_wh"
          - "Program.wh_committed -= pack.pack_energy_wh"

      - from: STORED
        to: RELEASED
        trigger: POST /api/integration-programs/{programId}/battery-packs/{packId}/pick  (or recall force-release)
        actor: LogisticsCoordinator | system
        preconditions:
          - "Pack.logistics_status must be STORED (ERR_PACK_NOT_STORED)"
          - "No ACTIVE RecallCampaign captures this pack (ERR_PACK_UNDER_RECALL) unless caller is system under recall force-release"
        side_effects:
          - "released_at_utc := now"
          - "StorageLocation.wh_occupied -= pack.pack_energy_wh"
          - "Program.wh_committed -= pack.pack_energy_wh"

  - entity: TransportShipment
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: TENDERED
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/tender
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment must be DRAFT (ERR_SHIPMENT_NOT_DRAFT)"
          - "Shipment.total_pack_count > 0 (ERR_SHIPMENT_EMPTY)"
        side_effects:
          - "carrier_charge_cents := computed (carrier_acceptance_charge, provisional variant)"

      - from: TENDERED
        to: CARRIER_ACCEPTED
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/carrier-accept
        actor: CarrierAgent
        preconditions:
          - "Shipment must be TENDERED (ERR_SHIPMENT_NOT_TENDERED)"
        side_effects:
          - "carrier_charge_cents recomputed (final variant, replaces provisional)"

      - from: TENDERED
        to: CARRIER_REJECTED
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/carrier-reject
        actor: CarrierAgent
        preconditions:
          - "Shipment must be TENDERED (ERR_SHIPMENT_NOT_TENDERED)"
        side_effects:
          - "Shipment returns to DRAFT (re-tender cycle allowed)"
          - "Attached packs remain PACKED_FOR_SHIP"

      - from: CARRIER_REJECTED
        to: DRAFT
        trigger: "system (automatic after rejection recorded)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CARRIER_ACCEPTED
        to: IN_TRANSIT
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/mark-in-transit
        actor: CarrierAgent
        preconditions:
          - "Shipment must be CARRIER_ACCEPTED (ERR_SHIPMENT_NOT_CARRIER_ACCEPTED)"
        side_effects:
          - "Each attached pack logistics_status PACKED_FOR_SHIP → SHIPPED"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /api/integration-programs/{programId}/transport-shipments/{shipmentId}/mark-delivered
        actor: CarrierAgent
        preconditions:
          - "Shipment must be IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"
        side_effects:
          - "Each attached pack logistics_status SHIPPED → DELIVERED"
          - "Each attached pack disposition := IN_SERVICE"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/approve
        actor: SafetyOfficer
        preconditions:
          - "RMA must be REQUESTED (ERR_RMA_NOT_REQUESTED)"
          - "Pack.logistics_status must be DELIVERED (ERR_PACK_NOT_DELIVERED)"
          - "approver must differ from requested_by_id (segregation of duties, ERR_SOD_RMA_APPROVE)"
          - "target_soc_percent must be <= SAFE_DISCHARGE_MAX_PERCENT (ERR_TARGET_SOC_TOO_HIGH)"
        side_effects:
          - "approved_by_id := X-User-ID"
          - "BatteryPack.disposition := RETURN_PENDING"

      - from: REQUESTED
        to: DENIED
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/deny
        actor: SafetyOfficer
        preconditions:
          - "RMA must be REQUESTED (ERR_RMA_NOT_REQUESTED)"
        side_effects: []

      - from: APPROVED
        to: DISCHARGE_PENDING
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/begin-discharge
        actor: QualityEngineer
        preconditions:
          - "RMA must be APPROVED (ERR_RMA_NOT_APPROVED)"
          - "Pack must not be currently RECALLED_HOLD (ERR_PACK_UNDER_RECALL)"
        side_effects: []

      - from: DISCHARGE_PENDING
        to: DISCHARGED
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/complete-discharge
        actor: QualityEngineer
        preconditions:
          - "RMA must be DISCHARGE_PENDING (ERR_RMA_NOT_DISCHARGE_PENDING)"
          - "measured final_soc <= RMA.target_soc_percent (ERR_DISCHARGE_TARGET_NOT_MET)"
        side_effects:
          - "RMA.actual_soc_after_discharge := final_soc"
          - "BatteryPack.soc_percent := final_soc"
          - "BatteryPack.is_safe_discharged := true"
          - "BatteryPack.disposition := DISCHARGED"
          - "BatteryPack.soc_band recomputed under hysteresis variant"

      - from: DISCHARGED
        to: RECEIVED
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/receive
        actor: CustomerService
        preconditions:
          - "RMA must be DISCHARGED (ERR_RMA_NOT_DISCHARGED)"
        side_effects:
          - "BatteryPack.logistics_status DELIVERED → RETURNED"
          - "BatteryPack.disposition := SCRAPPED"

      - from: RECEIVED
        to: CLOSED
        trigger: POST /api/integration-programs/{programId}/return-authorizations/{rmaId}/close
        actor: CustomerService
        preconditions:
          - "RMA must be RECEIVED (ERR_RMA_NOT_RECEIVED)"
        side_effects: []

  - entity: RecallCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /api/integration-programs/{programId}/recall-campaigns/{recallId}/activate
        actor: SafetyOfficer
        preconditions:
          - "Recall must be DRAFT (ERR_RECALL_NOT_DRAFT)"
          - "At least one scope selector must be set (ERR_RECALL_SCOPE_EMPTY)"
        side_effects:
          - "Compute pack capture set per scope selectors (union of lot/bom/serial-prefix matches)"
          - "For each captured pack: BatteryPack READY_TO_STORE → RECALLED transition fires (cascade)"
          - "For each captured pack currently STAGED/STORED: force-release placement (deeper cascade)"
          - "Program.recall_count += 1"
          - "Program.compliance_risk_index -= severity_weight * capture_count"

      - from: ACTIVE
        to: CONTAINED
        trigger: POST /api/integration-programs/{programId}/recall-campaigns/{recallId}/mark-contained
        actor: SafetyOfficer
        preconditions:
          - "Recall must be ACTIVE (ERR_RECALL_NOT_ACTIVE)"
          - "packs_contained == packs_in_scope (ERR_RECALL_NOT_FULLY_CONTAINED)"
        side_effects: []

      - from: CONTAINED
        to: CLOSED
        trigger: POST /api/integration-programs/{programId}/recall-campaigns/{recallId}/close
        actor: SafetyOfficer
        preconditions:
          - "Recall must be CONTAINED (ERR_RECALL_NOT_CONTAINED)"
        side_effects:
          - "Program.recall_count -= 1"
          - "BatteryPack.active_recall_id cleared for all linked packs (disposition stays RECALLED_HOLD)"

# =============================================================================
# 1.2.1 — Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pack-create-stale-bom
    parent_entity: PackBOM
    write_endpoint: "POST /integration-programs/{programId}/battery-packs"
    occ_field: "expected_bom_version"
    description: |
      Creating a BatteryPack against a PackBOM whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      writer has just updated the BOM (e.g. welding_profile or cells_required
      changed) and the current writer's view of the BOM is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dossier-update-stale-pack
    parent_entity: BatteryPack
    write_endpoint: "PUT /integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}"
    occ_field: "expected_pack_version"
    description: |
      Recording test results onto a dossier attached to a BatteryPack whose
      version has advanced since the client last observed it is rejected.
      Captures the case where a parallel operator has updated the pack (e.g.
      SOC changed via discharge) rendering the recorded matrix stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3 — Calculation Rules Table
# =============================================================================
calculations:
  - name: welding_heat_dose
    trigger: "POST welding-records (at record creation, before certification)"
    algorithm: constraint_propagation
    formula: |
      # Non-linear interaction of 4 inputs; profile base dose modulates the product.
      base_dose_per_profile = {
        WELD_PROFILE_A: 12.0,    # J per weld per amp*ms unit
        WELD_PROFILE_B: 18.0,
        WELD_PROFILE_C: 25.0
      }
      profile_ceiling_j = {
        WELD_PROFILE_A: 450.0,
        WELD_PROFILE_B: 700.0,
        WELD_PROFILE_C: 1050.0
      }
      force_factor = 1.0 + (electrode_force_n - 30.0) / 100.0      # +/- around 30N nominal
      force_factor = max(0.7, min(1.4, force_factor))               # clamp
      raw_joules = weld_count * current_amps * (pulse_ms / 1000.0) * base_dose_per_profile[weld_profile_used]
      heat_dose_j = raw_joules * force_factor
      # Order: per-weld dose first, multiply by count, then apply force_factor; round HALF_UP to 2 decimals LAST.
      heat_dose_j = round_half_up(heat_dose_j, 2)
      if heat_dose_j > profile_ceiling_j[weld_profile_used]:
        # certification rejects; record itself persists but certification will refuse
        pass
    input_set: "WeldingParameterRecord being created (weld_count, current_amps, pulse_ms, electrode_force_n, weld_profile_used)"
    constants:
      NOMINAL_FORCE_N: 30.0
      FORCE_FACTOR_MIN: 0.7
      FORCE_FACTOR_MAX: 1.4
      PRECISION: 2
    precision: "2 decimal places, round_half_up"

  - name: un38_3_composite_score
    trigger: "Dossier transitions: PUT (provisional) and POST submit (final)"
    algorithm: weighted_scoring
    formula: |
      # Weights sum to 100 across the eight T-tests. Two variants differ ONLY
      # in the penalty applied to a missing / failed boolean test.
      w = { T1: 10, T2: 15, T3: 12, T4: 13, T5: 15, T6: 15, T7: 10, T8: 10 }
      # Numeric sub-scores normalized to [0,1] via clamp against test-specific ceilings:
      s_T1 = clamp(altitude_sim_kpa / 11.6, 0, 1)         # lower pressure better; 11.6 kPa reference
      s_T2 = clamp(thermal_cycles / 10.0, 0, 1)           # 10 cycles reference
      s_T3 = clamp(vibration_minutes / 180.0, 0, 1)
      s_T4 = clamp(shock_g_peak / 150.0, 0, 1)
      s_T5 = 1 if external_short_circuit_ok else 0
      s_T6 = 1 if impact_crush_ok else 0
      s_T7 = 1 if overcharge_ok else 0
      s_T8 = 1 if forced_discharge_ok else 0
      base = w.T1*s_T1 + w.T2*s_T2 + w.T3*s_T3 + w.T4*s_T4 + w.T5*s_T5 + w.T6*s_T6 + w.T7*s_T7 + w.T8*s_T8
      # provisional variant: NULL boolean treated as 0.5 (optimistic placeholder)
      # final variant:      NULL boolean treated as 0.0 AND any false boolean zeroes the whole score
      score = round_half_up(base, 2)
    input_set: "SafetyTestDossier's eight T1..T8 test fields"
    constants:
      PASS_THRESHOLD: 85.0
      REF_ALT_KPA: 11.6
      REF_THERMAL_CYCLES: 10
      REF_VIBRATION_MIN: 180
      REF_SHOCK_G: 150
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Computed when dossier moves OPEN → TESTS_RECORDED (PUT)"
        difference: "NULL boolean sub-scores are treated as 0.5 (optimistic); false booleans still 0"
      - name: final
        when: "Computed when dossier moves TESTS_RECORDED → SUBMITTED (POST submit)"
        difference: "NULL boolean sub-scores treated as 0.0; any false boolean sets the entire final score to 0.0 (fail-fast); penalty_mode=STRICT"

  - name: soc_band_assignment
    trigger: "BatteryPack creation; safe-discharge completion; StoragePlacement creation"
    algorithm: threshold
    formula: |
      # Base variant — pure threshold:
      #   soc < 30            → SOC_LOW
      #   30 <= soc <= 60     → SOC_MID
      #   soc > 60            → SOC_HIGH
      # Hysteresis variant — applies only when soc_band is recomputed after a
      # discharge event AND pack's BMS firmware supports_soc_hysteresis == true.
      # The band boundary shifts by ±HYSTERESIS_PERCENT in the direction of travel
      # to avoid band oscillation.
      if hysteresis_applies:
        # leaving SOC_MID downwards requires soc < 30 - HYS; upwards requires soc > 60 + HYS
        pass
      else:
        # plain thresholds
        pass
    input_set: "BatteryPack.soc_percent; BMSFirmware.supports_soc_hysteresis; direction of SOC change (if any)"
    constants:
      LOW_MAX_EXCLUSIVE: 30
      MID_MAX_INCLUSIVE: 60
      HYSTERESIS_PERCENT: 2.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: plain
        when: "Initial assignment at pack creation OR firmware does not support hysteresis"
        difference: "Pure threshold on current soc_percent"
      - name: hysteresis
        when: "Recompute after safe-discharge AND firmware supports hysteresis"
        difference: "Bands widen by ±2.0 percent against direction of travel"

  - name: carrier_acceptance_charge
    trigger: "TransportShipment tender (provisional) and carrier-accept (final)"
    algorithm: tiered_pricing
    formula: |
      # Tiered on total_wh, surcharge on declared_weight_kg, DG class multiplier.
      # Order: compute per-tier watt-hour component, add weight surcharge, apply
      # DG multiplier LAST; round HALF_UP to integer cents LAST.
      tiers = [ (0,    500,  0.12),     # first 500 Wh at $0.12/Wh
                (500,  2000, 0.09),     # next 1500 Wh
                (2000, 5000, 0.06),
                (5000, null, 0.04) ]
      dg_multiplier = { UN3480: 1.25, UN3481: 1.15, UN3090: 1.35, UN3091: 1.20 }
      weight_surcharge_cents_per_kg = 40     # $0.40/kg
      wh_component = sum_over_tiers( in_tier_wh * rate )
      weight_component = declared_weight_kg * weight_surcharge_cents_per_kg / 100.0
      pre_multiplier_total = wh_component + weight_component
      final_total_dollars = pre_multiplier_total * dg_multiplier[un_class_code]
      carrier_charge_cents = round_half_up(final_total_dollars * 100, 0)
    input_set: "TransportShipment.total_wh, declared_weight_kg, un_class_code"
    constants:
      WEIGHT_SURCHARGE_CENTS_PER_KG: 40
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Shipment DRAFT → TENDERED"
        difference: "Uses declared_weight_kg as tendered; charge is advisory"
      - name: final
        when: "Shipment TENDERED → CARRIER_ACCEPTED"
        difference: "Recomputes from same stored fields (idempotent), but overrides provisional if the carrier patches declared_weight_kg via accept call"

  - name: recall_capture_set
    trigger: "RecallCampaign DRAFT → ACTIVE"
    algorithm: aggregation
    formula: |
      # Union across three scope selectors; order-insensitive; dedupe by pack id.
      capture_set = {}
      if scope_lot_id set:
        capture_set |= { p in BatteryPack : p.cell_lot_id == scope_lot_id }
      if scope_bom_id set:
        capture_set |= { p in BatteryPack : p.bom_id == scope_bom_id }
      if scope_serial_prefix set:
        capture_set |= { p in BatteryPack : p.serial_number STARTS_WITH scope_serial_prefix }
      # Exclusion: packs already in assembly_status == RECALLED are NOT re-captured
      capture_set = { p in capture_set : p.assembly_status != RECALLED }
      packs_in_scope = |capture_set|
    input_set: "BatteryPack rows in this program matching any of the three scope selectors, excluding those already RECALLED"
    constants:
      SEVERITY_WEIGHT_CLASS_I: 15
      SEVERITY_WEIGHT_CLASS_II: 8
      SEVERITY_WEIGHT_CLASS_III: 3

# =============================================================================
# Table 1.4 — Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters must resolve (program, lot, pack, dossier, shipment, placement, RMA, recall, firmware, location)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints; resolved left-to-right"

  - priority: 4
    category: state
    check: "Program must be OPEN for any child-creating or child-mutating call"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: "all POST/PUT/PATCH under /integration-programs/{id}/..."

  - priority: 5
    category: state
    check: "Target resource must be in the state required by the transition (see state_machines)"
    error_id: "ERR_{RESOURCE}_NOT_{EXPECTED_STATE}"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties — actor must differ from the prior-step actor on the same resource (weld record vs weld certify; firmware submit vs firmware approve; RMA request vs RMA approve)"
    error_id: "ERR_SOD_WELD_CERTIFY | ERR_SOD_FIRMWARE_APPROVE | ERR_SOD_RMA_APPROVE"
    http_status: 403
    applies_to: "weld certify, firmware approve, RMA approve"

  - priority: 7
    category: business_safety
    check: "Storage SOC band must be accepted by the location's fire zone"
    error_id: ERR_SOC_BAND_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /storage-placements"

  - priority: 8
    category: business_safety
    check: "Receiving inspection SOC must be within ±2.0 of declared receiving_soc_percent when outcome=PASS"
    error_id: ERR_SOC_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /cell-lots/{id}/inspections"

  - priority: 9
    category: business_safety
    check: "Weld profile on record must match PackBOM.welding_profile; heat dose must not exceed profile ceiling"
    error_id: "ERR_WELD_PROFILE_MISMATCH | ERR_HEAT_DOSE_EXCEEDED"
    http_status: 422
    applies_to: "POST /welding-records/{id}/certify"

  - priority: 10
    category: business_safety
    check: "Dossier test matrix must be complete (all 8 fields non-null) before TESTS_RECORDED"
    error_id: ERR_INCOMPLETE_TEST_MATRIX
    http_status: 422
    applies_to: "PUT /safety-test-dossiers/{id}"

  - priority: 11
    category: business_safety
    check: "RMA target_soc_percent must be <= SAFE_DISCHARGE_MAX_PERCENT (30.0)"
    error_id: ERR_TARGET_SOC_TOO_HIGH
    http_status: 422
    applies_to: "POST /return-authorizations/{id}/approve"

  - priority: 12
    category: business_referential
    check: "Referenced lot/BOM/firmware/location/shipment must belong to the same program as the parent path"
    error_id: "ERR_CROSS_PROGRAM_REFERENCE"
    http_status: 422
    applies_to: "all child-creation endpoints"

  - priority: 13
    category: business_referential
    check: "CellLot referenced by PackBOM must be in ACCEPTED status; lot must have capacity for the BOM"
    error_id: "ERR_LOT_NOT_ACCEPTED | ERR_LOT_DEPLETED"
    http_status: 409
    applies_to: "POST /pack-boms"

  - priority: 14
    category: business_referential
    check: "Firmware referenced by BMSFlashRecord must be APPROVED and not DEPRECATED"
    error_id: ERR_FIRMWARE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /bms-flash-records"

  - priority: 15
    category: business_referential
    check: "Pack must not already be attached to a non-terminal TransportShipment"
    error_id: ERR_PACK_ALREADY_ATTACHED
    http_status: 409
    applies_to: "POST /transport-shipments/{id}/attach"

  - priority: 16
    category: business_constraint
    check: "StorageLocation capacity must not be exceeded by new placement"
    error_id: ERR_LOCATION_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /storage-placements"

  - priority: 17
    category: business_constraint
    check: "Program-level watt-hour commitment must not exceed storage_capacity_wh"
    error_id: ERR_PROGRAM_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /storage-placements"

  - priority: 18
    category: business_constraint
    check: "Shipment UN class must match every attached pack's shipping_classification"
    error_id: ERR_UN_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /transport-shipments/{id}/attach, POST /transport-shipments/{id}/tender"

  - priority: 19
    category: business_temporal
    check: "Retest of REJECTED lot allowed only when quarantine_cycle_count < 2"
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cell-lots/{id}/retest"

  - priority: 20
    category: business_temporal
    check: "Placement release / pick blocked while pack is captured by an ACTIVE recall"
    error_id: ERR_PACK_UNDER_RECALL
    http_status: 409
    applies_to: "POST /battery-packs/{id}/pick, POST /storage-placements/{id}/release"

  - priority: 21
    category: business_fiscal
    check: "Carrier charge must be computable at tender time (total_wh > 0)"
    error_id: ERR_SHIPMENT_EMPTY
    http_status: 422
    applies_to: "POST /transport-shipments/{id}/tender"

  - priority: 22
    category: state
    check: "OCC — expected_<parent>_version in request body must equal current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /battery-packs (PackBOM OCC), PUT /safety-test-dossiers/{id} (BatteryPack OCC)"

# =============================================================================
# Table 1.5 — API Endpoint Table
# =============================================================================
endpoints:
  # ----- IntegrationProgram -----
  - method: POST
    path: "/api/integration-programs"
    description: "Create a new IntegrationProgram"
    roles: [SafetyOfficer]
    code: 201
    input: [program_code, storage_capacity_wh]
    output: IntegrationProgram
    side_effects:
      - "status=OPEN, compliance_risk_index=100, wh_committed=0, recall_count=0, version=1"

  - method: GET
    path: "/api/integration-programs"
    description: "List IntegrationPrograms"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "IntegrationProgram[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}"
    description: "Get a specific IntegrationProgram"
    roles: [Any]
    code: 200
    input: []
    output: IntegrationProgram
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/suspend"
    description: "Suspend a program (gates child mutations)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IntegrationProgram
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/api/integration-programs/{programId}/resume"
    description: "Resume a suspended program"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IntegrationProgram
    side_effects: ["status → OPEN; re-evaluate BatteryPack.active_recall_id"]

  - method: POST
    path: "/api/integration-programs/{programId}/close"
    description: "Close a program"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IntegrationProgram
    side_effects: ["status → CLOSED"]

  # ----- CellLot -----
  - method: POST
    path: "/api/integration-programs/{programId}/cell-lots"
    description: "Receive a new CellLot"
    roles: [QualityEngineer]
    code: 201
    input: [lot_code, cell_count, rated_capacity_mah, receiving_soc_percent]
    output: CellLot
    side_effects: ["status=RECEIVED, quarantine_cycle_count=0"]

  - method: GET
    path: "/api/integration-programs/{programId}/cell-lots"
    description: "List CellLots for a program"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CellLot[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/cell-lots/{lotId}"
    description: "Get a specific CellLot"
    roles: [Any]
    code: 200
    input: []
    output: CellLot
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/cell-lots/{lotId}/quarantine"
    description: "Move lot to QUARANTINE for inspection"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: CellLot
    side_effects: ["status → QUARANTINE"]

  - method: POST
    path: "/api/integration-programs/{programId}/cell-lots/{lotId}/inspections"
    description: "Record a CellInspectionRecord (immutable); PASS accepts, FAIL_HARD rejects, FAIL_SOFT self-loops"
    roles: [QualityEngineer]
    code: 201
    input: [measured_soc_percent, measured_voltage_v, visual_defect_count, outcome]
    output: CellInspectionRecord
    side_effects:
      - "outcome=PASS → lot ACCEPTED and measured_soc_percent persisted on lot"
      - "outcome=FAIL_HARD → lot REJECTED; program.compliance_risk_index -= 3"
      - "outcome=FAIL_SOFT → lot stays QUARANTINE, quarantine_cycle_count += 1"

  - method: GET
    path: "/api/integration-programs/{programId}/cell-lots/{lotId}/inspections"
    description: "List inspection records for a lot"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CellInspectionRecord[]"
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/cell-lots/{lotId}/retest"
    description: "Re-enter QUARANTINE from REJECTED (cycle, bounded by quarantine_cycle_count<2)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: CellLot
    side_effects: ["status REJECTED → QUARANTINE; quarantine_cycle_count += 1"]

  # ----- PackBOM -----
  - method: POST
    path: "/api/integration-programs/{programId}/pack-boms"
    description: "Define a PackBOM drawing cells from a lot"
    roles: [AssemblyLead]
    code: 201
    input: [bom_code, cell_lot_id, cells_required, series_count, parallel_count, welding_profile, "version_note?"]
    output: PackBOM
    side_effects:
      - "nominal_energy_wh computed"
      - "is_locked=false until first BatteryPack consumed"

  - method: GET
    path: "/api/integration-programs/{programId}/pack-boms"
    description: "List PackBOMs"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "cell_lot_id?"]
    output: "PackBOM[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/pack-boms/{bomId}"
    description: "Get a specific PackBOM"
    roles: [Any]
    code: 200
    input: []
    output: PackBOM
    side_effects: []

  # ----- BatteryPack -----
  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs"
    description: "Assemble a new BatteryPack from a BOM (OCC on PackBOM.version)"
    roles: [AssemblyLead]
    code: 201
    input: [bom_id, expected_bom_version]
    output: BatteryPack
    side_effects:
      - "serial_number minted"
      - "cell_lot_id copied from PackBOM"
      - "pack_energy_wh := PackBOM.nominal_energy_wh"
      - "soc_percent := CellLot.measured_soc_percent"
      - "soc_band computed (plain variant)"
      - "assembly_status=BUILT, logistics_status=NOT_STORED, disposition=IN_SERVICE"
      - "PackBOM.is_locked := true; increments PackBOM.version by 1"

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs"
    description: "List BatteryPacks"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "bom_id?", "cell_lot_id?", "storage_location_id?", "active_recall_id?"]
    output: "BatteryPack[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs/{packId}"
    description: "Get a specific BatteryPack"
    roles: [Any]
    code: 200
    input: []
    output: BatteryPack
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/pick"
    description: "Pick a STORED pack (releases placement)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: BatteryPack
    side_effects:
      - "logistics_status STORED → PICKED"
      - "StoragePlacement → RELEASED; slot wh_occupied decremented; program.wh_committed decremented"

  # ----- WeldingParameterRecord -----
  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/welding-records"
    description: "Record a weld (immutable)"
    roles: [AssemblyLead]
    code: 201
    input: [weld_count, current_amps, pulse_ms, electrode_force_n, weld_profile_used]
    output: WeldingParameterRecord
    side_effects:
      - "heat_dose_j computed per welding_heat_dose calc"
      - "BatteryPack.assembly_status BUILT → WELD_RECORDED"

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/welding-records"
    description: "List weld records for a pack"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "WeldingParameterRecord[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/welding-records/{recordId}"
    description: "Get a specific weld record"
    roles: [Any]
    code: 200
    input: []
    output: WeldingParameterRecord
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/welding-records/{recordId}/certify"
    description: "Certify a weld (SoD: certifier != operator)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: WeldingParameterRecord
    side_effects:
      - "is_certified=true, certified_by_id set"
      - "BatteryPack.assembly_status WELD_RECORDED → WELD_CERTIFIED"

  # ----- BMSFirmware -----
  - method: POST
    path: "/api/integration-programs/{programId}/bms-firmwares"
    description: "Register a new BMS firmware binary"
    roles: [AssemblyLead]
    code: 201
    input: [firmware_version, binary_sha256, "supports_soc_hysteresis?"]
    output: BMSFirmware
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/integration-programs/{programId}/bms-firmwares"
    description: "List firmware rows"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BMSFirmware[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/bms-firmwares/{fwId}"
    description: "Get a specific firmware"
    roles: [Any]
    code: 200
    input: []
    output: BMSFirmware
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/bms-firmwares/{fwId}/submit-review"
    description: "Move DRAFT or DEPRECATED firmware to PENDING_REVIEW"
    roles: [AssemblyLead]
    code: 200
    input: []
    output: BMSFirmware
    side_effects: ["status → PENDING_REVIEW"]

  - method: POST
    path: "/api/integration-programs/{programId}/bms-firmwares/{fwId}/approvals"
    description: "Record a firmware approval decision (immutable)"
    roles: [SafetyOfficer]
    code: 201
    input: [decision, rationale]
    output: FirmwareApproval
    side_effects:
      - "decision=APPROVE → firmware APPROVED, approval_record_id set"
      - "decision=REJECT → firmware → DRAFT"
      - "decision=REVOKE → only valid via deprecate endpoint; here decision must be APPROVE or REJECT"

  - method: GET
    path: "/api/integration-programs/{programId}/bms-firmwares/{fwId}/approvals"
    description: "List approval events for a firmware"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FirmwareApproval[]"
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/bms-firmwares/{fwId}/deprecate"
    description: "Deprecate an APPROVED firmware"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: BMSFirmware
    side_effects: ["status APPROVED → DEPRECATED; approval_record_id := null"]

  # ----- BMSFlashRecord -----
  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/bms-flash-records"
    description: "Flash firmware onto a pack"
    roles: [AssemblyLead]
    code: 201
    input: [bms_firmware_id]
    output: BMSFlashRecord
    side_effects:
      - "flash_cycle_index incremented"
      - "BatteryPack.bms_firmware_id set"
      - "BatteryPack.assembly_status WELD_CERTIFIED → BMS_FLASHED"

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/bms-flash-records"
    description: "List flash records for a pack"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BMSFlashRecord[]"
    side_effects: []

  # ----- SafetyTestDossier -----
  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers"
    description: "Open a new dossier for a pack (initial or retest)"
    roles: [QualityEngineer]
    code: 201
    input: []
    output: SafetyTestDossier
    side_effects:
      - "dossier_cycle_index incremented; status=OPEN"
      - "BatteryPack.dossier_id set; assembly_status BMS_FLASHED → TEST_QUEUED on first dossier"

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers"
    description: "List dossiers for a pack"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "SafetyTestDossier[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}"
    description: "Get a specific dossier"
    roles: [Any]
    code: 200
    input: []
    output: SafetyTestDossier
    side_effects: []

  - method: PUT
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}"
    description: "Record the 8-field test matrix (OCC on BatteryPack.version)"
    roles: [QualityEngineer]
    code: 200
    input: [expected_pack_version, altitude_sim_kpa, thermal_cycles, vibration_minutes, shock_g_peak, external_short_circuit_ok, impact_crush_ok, overcharge_ok, forced_discharge_ok]
    output: SafetyTestDossier
    side_effects:
      - "provisional_un_score computed (provisional variant)"
      - "status OPEN → TESTS_RECORDED"
      - "increments BatteryPack.version by 1"

  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}/submit"
    description: "Submit dossier; computes final score and assigns outcome"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyTestDossier
    side_effects:
      - "final_un_score computed (final variant)"
      - "outcome=PASS → dossier SUBMITTED, pack → CLASSIFIED, shipping_classification derived"
      - "outcome=FAIL → dossier FAILED; program.compliance_risk_index -= 5"

  - method: POST
    path: "/api/integration-programs/{programId}/battery-packs/{packId}/safety-test-dossiers/{dossierId}/approve"
    description: "Approve a SUBMITTED PASS dossier (moves pack to READY_TO_STORE)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyTestDossier
    side_effects:
      - "dossier SUBMITTED → APPROVED"
      - "BatteryPack CLASSIFIED → READY_TO_STORE"

  # ----- StorageLocation -----
  - method: POST
    path: "/api/integration-programs/{programId}/storage-locations"
    description: "Create a storage slot"
    roles: [LogisticsCoordinator]
    code: 201
    input: [location_code, fire_zone, capacity_wh, accepts_soc_band]
    output: StorageLocation
    side_effects: ["wh_occupied=0"]

  - method: GET
    path: "/api/integration-programs/{programId}/storage-locations"
    description: "List storage slots"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "StorageLocation[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/storage-locations/{locationId}"
    description: "Get a storage slot"
    roles: [Any]
    code: 200
    input: []
    output: StorageLocation
    side_effects: []

  # ----- StoragePlacement -----
  - method: POST
    path: "/api/integration-programs/{programId}/storage-placements"
    description: "Stage a pack at a slot"
    roles: [LogisticsCoordinator]
    code: 201
    input: [storage_location_id, battery_pack_id]
    output: StoragePlacement
    side_effects:
      - "status=STAGED, staged_at_utc set"
      - "StorageLocation.wh_occupied += pack.pack_energy_wh"
      - "Program.wh_committed += pack.pack_energy_wh"
      - "BatteryPack.storage_location_id set; logistics_status NOT_STORED → STAGED"

  - method: GET
    path: "/api/integration-programs/{programId}/storage-placements"
    description: "List placements (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "storage_location_id?", "battery_pack_id?"]
    output: "StoragePlacement[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/storage-placements/{placementId}"
    description: "Get a specific placement"
    roles: [Any]
    code: 200
    input: []
    output: StoragePlacement
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/storage-placements/{placementId}/store"
    description: "Mark a placement as STORED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: StoragePlacement
    side_effects: ["status STAGED → STORED; stored_at_utc set; BatteryPack.logistics_status → STORED"]

  - method: POST
    path: "/api/integration-programs/{programId}/storage-placements/{placementId}/release"
    description: "Release a placement (manual; blocked under recall)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: StoragePlacement
    side_effects:
      - "status → RELEASED; released_at_utc set"
      - "slot wh_occupied and program wh_committed decremented"
      - "BatteryPack.logistics_status → NOT_STORED; storage_location_id cleared"

  # ----- TransportShipment -----
  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments"
    description: "Create a DRAFT shipment"
    roles: [LogisticsCoordinator]
    code: 201
    input: [carrier_code, un_class_code, declared_weight_kg]
    output: TransportShipment
    side_effects: ["status=DRAFT, total_pack_count=0, total_wh=0"]

  - method: GET
    path: "/api/integration-programs/{programId}/transport-shipments"
    description: "List shipments"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransportShipment[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [Any]
    code: 200
    input: []
    output: TransportShipment
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/attach"
    description: "Attach a PICKED pack to a DRAFT shipment"
    roles: [LogisticsCoordinator]
    code: 201
    input: [battery_pack_id]
    output: ShipmentPackLink
    side_effects:
      - "ShipmentPackLink persisted"
      - "shipment.total_pack_count += 1; total_wh += pack.pack_energy_wh"
      - "BatteryPack.logistics_status PICKED → PACKED_FOR_SHIP"

  - method: GET
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/packs"
    description: "List packs attached to a shipment"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShipmentPackLink[]"
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/tender"
    description: "Tender a DRAFT shipment (computes provisional charge)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TransportShipment
    side_effects:
      - "status DRAFT → TENDERED"
      - "carrier_charge_cents := provisional carrier_acceptance_charge"

  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/carrier-accept"
    description: "Carrier accepts a tendered shipment (computes final charge)"
    roles: [CarrierAgent]
    code: 200
    input: ["declared_weight_kg?"]
    output: TransportShipment
    side_effects:
      - "If declared_weight_kg supplied: overrides field"
      - "carrier_charge_cents recomputed (final variant)"
      - "status TENDERED → CARRIER_ACCEPTED"

  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/carrier-reject"
    description: "Carrier rejects a tendered shipment"
    roles: [CarrierAgent]
    code: 200
    input: []
    output: TransportShipment
    side_effects: ["status TENDERED → CARRIER_REJECTED → DRAFT (auto)"]

  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/mark-in-transit"
    description: "Mark shipment IN_TRANSIT; cascades packs to SHIPPED"
    roles: [CarrierAgent]
    code: 200
    input: []
    output: TransportShipment
    side_effects: ["status → IN_TRANSIT; each attached pack PACKED_FOR_SHIP → SHIPPED"]

  - method: POST
    path: "/api/integration-programs/{programId}/transport-shipments/{shipmentId}/mark-delivered"
    description: "Mark shipment DELIVERED; cascades packs to DELIVERED"
    roles: [CarrierAgent]
    code: 200
    input: []
    output: TransportShipment
    side_effects: ["status → DELIVERED; each attached pack SHIPPED → DELIVERED; disposition=IN_SERVICE"]

  # ----- ReturnAuthorization -----
  - method: POST
