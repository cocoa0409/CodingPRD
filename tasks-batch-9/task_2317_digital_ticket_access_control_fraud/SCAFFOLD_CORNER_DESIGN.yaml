      - name: resale_cap_composition_across_regime_and_verification
        claim_type: correct_result
        grounds:
          - calculations.resale_price_cap
          - calculations.resale_price_cap.constants.MAX_ABS_MARKUP_CENTS
        excluded_because:
          difficulty_instance: resale_price_cap_nested_min_across_regime_and_seller_verification
          rationale: |
            Every branch of the cap formula — the per-regime percentage, the absolute
            markup clamp at 2,500 cents and the unverified-seller reduction to face value —
            is already evaluated there against pinned literals, so a separate
            correct-result test would restate the same arithmetic.

      - name: settlement_split_rounds_each_component_before_summing
        claim_type: precision
        grounds:
          - calculations.resale_settlement_split
        excluded_because:
          difficulty_instance: resale_settlement_split_round_per_component_before_sum
          rationale: |
            The rounding order (round each of the four components with round_half_up, then
            subtract from the sale price) is the single claim that instance exists to pin,
            including the exact payout literal that a sum-then-round implementation misses.

      - name: credential_forgone_revenue_rounds_per_ticket
        claim_type: precision
        grounds:
          - calculations.credential_forgone_revenue
        excluded_because:
          difficulty_instance: credential_forgone_revenue_per_ticket_rounding_before_batch_multiply
          rationale: |
            That instance already contrasts per-ticket rounding followed by multiplication
            against rounding the batch total, over two approved requests of different
            quantities, which covers this row's precision claim.

      - name: remediation_credit_tier_selection
        claim_type: threshold
        grounds:
          - calculations.denied_entry_remediation_credit
          - calculations.denied_entry_remediation_credit.constants.GOODWILL_TIER2_CENTS
        excluded_because:
          difficulty_instance: remediation_credit_tier_keyed_on_base_before_goodwill
          rationale: |
            The tier boundaries and the strike-penalty cap are walked there across four
            incidents whose bases straddle GOODWILL_TIER1_CENTS and GOODWILL_TIER2_CENTS,
            which is exactly the threshold-boundary sweep this row asks for.

      - name: occupancy_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.live_occupancy.variants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: occupancy_gate_live_vs_reconciled_variant_divergence
          rationale: |
            Both variants are read off one fixture there — an offline batch that
            GATE_LIVE ignores but RECONCILED counts — and the delta between them is
            asserted, which is the variant-divergence claim in full.

      - name: fraud_score_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.patron_fraud_risk_score.variants
          - calculations.patron_fraud_risk_score.constants.REMEDIATED_DISCOUNT
        excluded_because:
          difficulty_instance: patron_fraud_score_provisional_vs_adjudicated_variant_divergence
          rationale: |
            The PROVISIONAL-to-ADJUDICATED switch, its round_half_up halving and the
            resulting change in blocking behaviour are all measured there on the same
            incident set.

      - name: reentry_lockout_constant_is_applied
        claim_type: constants_applied
        grounds:
          - calculations.reentry_lockout_window
          - calculations.reentry_lockout_window.constants.RE_ENTRY_LOCKOUT_SECONDS
        excluded_because:
          difficulty_instance: reentry_lockout_upper_bound_is_inclusive_and_next_second_admits
          rationale: |
            RE_ENTRY_LOCKOUT_SECONDS 120 is exercised there at both edges of the window,
            which demonstrates the constant is applied and not hard-coded to some other
            interval.
  # ===========================================================================
  # Table 4 — Validations
  # 41 priority-ordered rules. The priority-pair conflicts, the aggregate
  # temporal rule and the cross-entity rules are owned by §1.8; what remains
  # here is uniqueness, segregation of duties, channel/type guards and the
  # cascading order inside the scan adjudication ladder.
  # ===========================================================================
  - section: validations
    instances:
      - name: zone_and_gate_codes_are_unique_per_event_but_reusable_across_events
        claim_type: violation_error
        grounds:
          - validations[priority=38]
          - errors.ERR_DUPLICATE_CODE
          - entities.AccessZone.fields.zone_code
          - entities.Gate.fields.gate_code
        distinguishing_aspect: |
          Uniqueness is scoped to the Event, not global: GA1 twice inside one Event is
          ERR_DUPLICATE_CODE (409), G1 twice inside one Event likewise, yet GA1 in a second
          Event is a clean 201 — a globally unique index would wrongly reject the last call.
        test_recipe:
          setup:
            - "Two Events, both left in DRAFT so that zone and gate creation is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
