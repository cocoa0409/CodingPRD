  # --- GasFreeCertificate ---
  - method: POST
    path: "/ops/gas-free-certificates"
    description: "Issue a gas-free certificate for a job in GAS_FREE_PENDING"
    roles: [MarineChemist]
    code: 201
    input: [job_id, lel_pct, o2_pct, h2s_ppm, benzene_ppm]
    output: GasFreeCertificate
    side_effects:
      - "issued_at = logical clock; expires_at = issued_at + 12h; issued_by_user_id = acting X-User-ID"
      - "prior VALID cert for the job -> SUPERSEDED"
      - "job GAS_FREE_PENDING -> GAS_FREE_CERTIFIED"
  - method: GET
    path: "/ops/gas-free-certificates/{certId}"
    description: "Get a gas-free certificate"
    roles: *all_roles
    code: 200
    input: []
    output: GasFreeCertificate
    side_effects: []
  - method: GET
    path: "/ops/gas-free-certificates"
    description: "List gas-free certificates, filterable by job (paginated)"
    roles: *all_roles
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: GasFreeCertificate[]
    side_effects: []
  - method: POST
    path: "/ops/gas-free-certificates/{certId}/revalidate"
    description: "Extend a valid certificate once by 6h"
    roles: [MarineChemist]
    code: 200
    input: []
    output: GasFreeCertificate
    side_effects: ["expires_at += 6h; revalidated = true"]
  - method: POST
    path: "/ops/gas-free-certificates/{certId}/revoke"
    description: "Revoke a certificate (cascades: permits suspend, job pauses or reverts, inspections cancel)"
    roles: [MarineChemist]
    code: 200
    input: []
    output: GasFreeCertificate
    side_effects: ["status VALID -> REVOKED; permit suspension cascade; job PAUSED or -> GAS_FREE_PENDING; SCHEDULED inspections of PAUSED job -> CANCELLED"]

