              payload: {}
              as: Host
            - call: "POST /service-floor/sushi-tickets"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_e}", item_code: "SPICY-TUNA-ROLL", quantity: 2, requested_at: "2026-09-03T19:05:00Z", unit_price_cents: 1800 }
              as: SushiChef
              captures: { ticket_e: $.data.id }
            - call: "POST /service-floor/sushi-tickets/${ticket_e}/events"
              payload: { event_type: "ADVANCE" }
              as: SushiChef
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T19:11:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/sushi-tickets/${ticket_e}/events"
              payload: { event_type: "ADVANCE" }
