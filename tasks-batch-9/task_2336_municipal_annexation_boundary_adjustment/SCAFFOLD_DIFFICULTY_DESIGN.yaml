  # =====================================================================================
  # RULE 3 — non_linear_state_machine
  # Two instances on DIFFERENT entities: AnnexationCase (cyclic cure loop through
  # PETITION_CIRCULATING) and PlanOfServices (two independent state dimensions).
  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: petition_cure_cycle_revisits_sufficiency_review_after_insufficient
        grounds:
          - state_machines.AnnexationCase.SUFFICIENCY_REVIEW_to_PETITION_CIRCULATING
          - state_machines.AnnexationCase.PETITION_CIRCULATING_to_SUFFICIENCY_REVIEW
          - state_machines.Petition.CIRCULATING_to_SUFFICIENT
          - state_machines.Petition.SUFFICIENT_to_INSUFFICIENT
          - state_machines.Petition.INSUFFICIENT_to_SUFFICIENT
          - calculations.petition_sufficiency
        distinguishing_aspect: |
          The non-linearity is on AnnexationCase / Petition: the case leaves SUFFICIENCY_REVIEW
          backwards to PETITION_CIRCULATING when a signature is withdrawn (40.00% < 50.00) and then
          re-enters SUFFICIENCY_REVIEW through the INSUFFICIENT -> SUFFICIENT edge after a
          replacement consent (60.00% >= 50.00), so the same state is occupied twice with a
          different signature_value_pct each time.
        test_recipe:
          setup:
            - "One StatuteProfile authorizing PETITION_MAJORITY with signature_basis ASSESSED_VALUE and signature_threshold_pct 50.00."
            - "One certified AnnexationCase (method PETITION_MAJORITY) with four parcels 40,000,000 / 30,000,000 / 20,000,000 / 10,000,000 cents owned by three different owners."
            - "A CIRCULATING petition that reached SUFFICIENT at 70.00% (owners of the 40,000,000 and 30,000,000 parcels), then fell to INSUFFICIENT at 40.00% when the 30,000,000 signature was withdrawn, moving the case back to PETITION_CIRCULATING."
            - "A replacement consent from the owner of the 20,000,000-cent parcel has since been signed, restoring 60,000,000 cents of qualified value."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z, well inside the 180-day circulation window."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"], signature_basis: "ASSESSED_VALUE", signature_threshold_pct: 50.00 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_cy: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_cy}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_cy: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { cy_ow1: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ben Ortiz", contact_email: "ben@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { cy_ow2: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Cara Diaz", contact_email: "cara@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { cy_ow3: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_cy}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_cy}"
              captures: { case_cy: $.data.id }
            - call: "POST /annexation-cases/${case_cy}/parcels"
              payload: { primary_owner_id: "${cy_ow1}", parcel_apn: "CY-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cy}"
              captures: { cy_p1: $.data.id }
            - call: "POST /annexation-cases/${case_cy}/parcels"
              payload: { primary_owner_id: "${cy_ow2}", parcel_apn: "CY-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cy}"
              captures: { cy_p2: $.data.id }
            - call: "POST /annexation-cases/${case_cy}/parcels"
              payload: { primary_owner_id: "${cy_ow3}", parcel_apn: "CY-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cy}"
              captures: { cy_p3: $.data.id }
            - call: "POST /annexation-cases/${case_cy}/parcels"
              payload: { primary_owner_id: "${cy_ow1}", parcel_apn: "CY-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cy}"
            - call: "POST /annexation-cases/${case_cy}/certify-territory"
              payload: {}
