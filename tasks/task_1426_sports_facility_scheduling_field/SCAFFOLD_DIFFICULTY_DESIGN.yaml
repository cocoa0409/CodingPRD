            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_id: "$.data[0].id", p_tot: "$.data[0].quoted_total_cents", p_dep: "$.data[0].deposit_required_cents" } }
            - { call: "GET /invoices", payload: { permit_id: "${p_id}" }, as: FinanceClerk, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i_id}/issue", payload: {}, as: FinanceClerk }
