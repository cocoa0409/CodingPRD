        distinguishing_aspect: "Rush order with 10 total labor-hours: base_band=3+ceil(10/8)=5, rush=max(2, ceil(5*0.5))=3 → promised_turnaround_days 3."
        test_recipe:
          setup: ["ESTIMATING rush order, one LineItem 10 labor-hours, 4 yd fabric @ 2000; v1 estimate authored (total 85000)."]
          setup_api_calls:
            - call: "POST /customers"
