          setup:
            - "FX-A policy IN_FORCE with an IN_TRANSIT part of 200000000 and an acknowledged OWNER interest that can receive payment."
            - "One claim adjusted on ACTUAL_LOSS for a single IN_TRANSIT line of 12345670, so indemnity_cents is 2345670 after the 10000000 occurrence deductible is applied to that one line."
            - "The claim settled by a different user than the adjuster, satisfying segregation of duties."
