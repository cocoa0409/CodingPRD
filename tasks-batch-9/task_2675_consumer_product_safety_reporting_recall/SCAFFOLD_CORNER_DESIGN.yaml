            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pmB_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pmB_v1}" }
              as: ComplianceOfficer
