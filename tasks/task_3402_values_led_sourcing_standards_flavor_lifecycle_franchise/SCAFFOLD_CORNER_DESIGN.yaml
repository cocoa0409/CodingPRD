      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Supplier, "endpoints: POST /creamery/suppliers/{id}/suspend"]
        distinguishing_aspect: "common_fields version increments by exactly 1 per mutation: create -> 1, suspend -> 2, reinstate -> 3."
        test_recipe:
          setup: ["Supplier APPROVED via PASS audit"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Versioned Supplier", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id, v0: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
              captures: { }
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/suspend"
              as: SourcingManager
              captures: { v2: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/reinstate"
              as: SourcingManager
              captures: { v3: $.data.version }
          assert:
            - "v0 == 1"
            - "v2 == v1 + 1 (suspend bumped exactly once)"
            - "v3 == v2 + 1 (reinstate bumped exactly once)"

      - name: cert_revoke_challenges_citing_claim
        claim_type: cascading_side_effects
        grounds: [state_machines.Certification.VERIFIED_to_REVOKED, "state_machines.Flavor.claim_status.PUBLISHED_to_CHALLENGED"]
        distinguishing_aspect: "Manual revocation of a VERIFIED cert challenges every PUBLISHED claim citing it — the trust-failure path (CHALLENGED), distinct from the expiry path (RETRACTED)."
        test_recipe:
          setup: ["Supplier APPROVED; VERIFIED DAIRY cert 95/95; flavor LIMITED_RUN with claim PUBLISHED citing it"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Revoke Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-RV", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 95 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/certifications/${c_id}/verify"
              payload: { verified_coverage_pct: 95 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Revoked Ripple", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/publish-claim"
              as: FlavorManager
          trigger:
            - call: "POST /creamery/certifications/${c_id}/revoke"
              as: AuditVerifier
              captures: { cert_st: $.data.status }
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_claim: $.data.claim_status }
          assert:
            - "cert_st == REVOKED"
            - "f_claim == CHALLENGED (revocation challenges; only clock expiry retracts)"

      - name: retire_cancels_open_orders_and_slots
        claim_type: cascading_side_effects
        grounds: [state_machines.Flavor.LIMITED_RUN_to_RETIRED, state_machines.ShopSupplyOrder.CONFIRMED_to_CANCELLED, state_machines.ProductionSlot.PLANNED_to_CANCELLED]
        distinguishing_aspect: "Retiring a flavor fans out: the CONFIRMED order for it is CANCELLED (plant-day capacity released) and its PLANNED production slot is CANCELLED (shift units released)."
        test_recipe:
          setup: ["Flavor LIMITED_RUN; OPERATING shop with a CONFIRMED order for it; PLANNED slot for it"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Cascade Shop", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 10000000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
            - call: "POST /creamery/flavors"
              payload: { name: "Retire Me", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 100 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 10 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { o_id: $.data.id }
            - call: "POST /creamery/supply-orders/${o_id}/confirm"
              as: FranchiseAdmin
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_WATERBURY", flavor_id: "${f_id}", production_date: "2026-10-05", shift: "DAY", planned_pints: 500 }
              as: PlantScheduler
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "GET /creamery/supply-orders/${o_id}"
              as: FranchiseAdmin
              captures: { o_st: $.data.status }
            - call: "GET /creamery/production-slots/${slot_id}"
              as: PlantScheduler
              captures: { slot_st: $.data.status }
          assert:
            - "o_st == CANCELLED (retire cascade reached the order)"
            - "slot_st == CANCELLED (retire cascade reached the slot)"
            - "Flavor.${f_id}.status == RETIRED and retired_at set to the logical time"

  - section: consistency_model
    instances:
      - name: payment_void_restores_enrollment_total
        claim_type: compensation_consistency
        grounds: [state_machines.PremiumPayment.APPROVED_to_VOIDED, entities.FarmProgramEnrollment.fields.total_approved_cents]
        distinguishing_aspect: "Immediate consistency with compensation: approve adds gross (16000) to total_approved_cents; voiding the APPROVED payment subtracts it back to 0 — no drift after the forward+compensating pair."
        test_recipe:
          setup: ["Enrollment ASSESSED blended 75; payment FINAL gross 16000 approved"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Void Farm", region: "VT", herd_size: 60, season_year: 2026, baseline_volume_liters: 5000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 80, welfare_practice_score: 70 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 5000, commodity_price_cents_per_liter: 40 }
              as: DairyProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /creamery/premium-payments/${p_id}/finalize"
              payload: { metered_volume_liters: 5000, non_conformance_count: 0 }
              as: DairyProgramManager
              captures: { gross: $.data.gross_amount_cents }
            - call: "POST /creamery/premium-payments/${p_id}/approve"
              as: DairyProgramManager
            - call: "GET /creamery/enrollments/${e_id}"
              as: DairyProgramManager
              captures: { tot_mid: $.data.total_approved_cents }
          trigger:
            - call: "POST /creamery/premium-payments/${p_id}/void"
              as: DairyProgramManager
            - call: "GET /creamery/enrollments/${e_id}"
              as: DairyProgramManager
              captures: { tot_end: $.data.total_approved_cents }
          assert:
            - "gross == 16000 (5000*40*0.08: blended 75 -> tier 8, no deduction, no excess)"
            - "tot_mid == 16000 after approve"
            - "tot_end == 0 after void (compensation exact)"

      - name: read_after_write_immediate_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency model: a mutation is fully visible in the very next read of the same resource — no lag, no stale reads."
        test_recipe:
          setup: ["Flavor created"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Immediate Iris", base_type: "NON_DAIRY", chunk_load_pct: 0, swirl_load_pct: 10, pint_price_cents: 149 }
              as: FlavorManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "st == TEST_BATCH in the immediately following read"
            - "v == 2 (create 1 + promote 1)"

  - section: state_machines
    instances:
      - name: audit_fail_cascade_suspends_supplier
        claim_type: side_effect_execution
        grounds: [state_machines.Supplier.APPROVED_to_SUSPENDED]
        excluded_because:
          difficulty_instance: audit_fail_depth3_cascade
          rationale: "Supplier suspension is asserted as link 1 of the depth-3 cascade in the named §1.8 instance."

      - name: retire_retracts_published_claim
        claim_type: side_effect_execution
        grounds: ["state_machines.Flavor.claim_status.PUBLISHED_to_RETRACTED"]
        excluded_because:
          difficulty_instance: flavor_cycle_with_parallel_claim_dimension
          rationale: "Retire -> claim RETRACTED is asserted in the named §1.8 instance's retired_claim capture."

  - section: calculations
    instances:
      - name: revival_threshold_below_500_stays_open
        claim_type: violation_to_error
        grounds: [calculations.revival_qualification]
        excluded_because:
          difficulty_instance: revival_threshold_exact_500
          rationale: "The 499-signature OPEN intermediate state is asserted inside the named §1.8 boundary instance."
