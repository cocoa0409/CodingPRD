            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id, ag_v1: $.data.version }
          trigger:
            - call: "POST /cold-chain/placement-agreements/${ag_id}/revise"
              payload: { expected_agreement_version: "${ag_v1}", max_capex_cents: 450000 }
              as: PlacementManager
              captures: { ag_v2: $.data.version, ag_capex: $.data.max_capex_cents }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/revise"
              payload: { expected_agreement_version: "${ag_v1}", term_months: 48 }
              as: PlacementManager
              captures: { err: $.data.error_id }
          assert:
            - "first revise with version 1 succeeds: version == 2, max_capex_cents == 450000, status still PROPOSED (cyclic self-loop)"
            - "second revise still carrying version 1: http 412, error_id == ERR_STALE_VERSION; terms unchanged (term_months still 60)"
