          setup:
            - "CAP-CASH, CUSTOMER_CASH, per_unit_amount_cents 150000, stack_cap_cents 0 (no own ceiling), priority_rank 91, window [2026-08-01, 2026-09-01), SUV7/EAST/LEASE eligibility."
