    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: 'Both headers are mandatory on every endpoint: sending X-User-Role HubAdmin with an empty X-User-ID must return HTTP 401 ERR_UNAUTHENTICATED and create no Producer.'
