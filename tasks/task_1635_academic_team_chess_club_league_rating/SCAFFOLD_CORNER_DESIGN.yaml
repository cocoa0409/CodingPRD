            - { call: "POST /api/sections/${s2}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { e2: $.data.id } }
            - { call: "POST /api/sections/${s3}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { e3: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/close-registration", payload: {}, as: FederationAdmin }
