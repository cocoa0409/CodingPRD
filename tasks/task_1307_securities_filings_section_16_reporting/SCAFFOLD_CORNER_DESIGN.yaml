            - "CONFIRMED: buy 100 @ 10.00 on 2026-02-05 (P1), buy 100 @ 10.00 on 2026-02-05 (P2), sell 100 @ 14.00 on 2026-08-04 (S1), sell 100 @ 14.00 on 2026-08-05 (S2)"
