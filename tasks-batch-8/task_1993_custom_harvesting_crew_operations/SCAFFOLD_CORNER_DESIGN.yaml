# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered
# by §1.8. Uses claim-extraction-guide taxonomy for section/claim_type.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: harvest_season_creation_returns_defaults
        claim_type: creation_defaults
        grounds:
          - entities.HarvestSeason
        distinguishing_aspect: "Newly created season has status=DRAFT, committed_acres_total=0, harvested_acres_total=0, version=1, id present, created_at present."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 320 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
          assert:
            - "HarvestSeason.${season_id}.status == DRAFT"
            - "HarvestSeason.${season_id}.committed_acres_total == 0"
            - "HarvestSeason.${season_id}.harvested_acres_total == 0"
            - "HarvestSeason.${season_id}.version == 1"

      - name: harvest_season_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.HarvestSeason
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting season_year (a required input field) yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /harvest/seasons"
              payload: { diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 320 }
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured ${err})"
            - "http status == 400"

      - name: contract_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.CustomerContract
          - errors[ERR_CONTRACT_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID yields ERR_CONTRACT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /harvest/contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRACT_NOT_FOUND (captured ${err})"

      - name: machine_creation_defaults_to_available
        claim_type: creation_defaults
        grounds:
          - entities.Machine
          - state_machines.Machine
        distinguishing_aspect: "New Machine starts in AVAILABLE per state machine initial_state."
        test_recipe:
          setup: ["Season exists in DRAFT"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
          assert:
            - "Machine.${machine_id}.status == AVAILABLE"

      - name: crew_member_default_requires_housing_true
        claim_type: defaults
        grounds:
          - entities.CrewMember.fields.requires_housing
        distinguishing_aspect: "Omitting requires_housing on crew creation defaults the field to true."
        test_recipe:
          setup: ["Season exists"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /harvest/seasons/${season_id}/crew-members"
              payload: { full_name: "X", visa_type: "US_CITIZEN", visa_expiry_date: "2099-01-01", hourly_rate_cents: 2000 }
              as: HarvestOperator
              captures: { crew_id: $.data.id }
          assert:
            - "CrewMember.${crew_id}.requires_housing == true"

      - name: route_stop_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List endpoint response has pagination fields limit/offset/total_count/has_more; default limit=10."
        test_recipe:
          setup: ["Season with a contract"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /harvest/contracts/${contract_id}/route-stops?limit=10&offset=0"
              payload: {}
              as: HarvestOperator
          assert:
            - "response envelope contains meta.api_request_id"
            - "response envelope contains limit, offset, total_count, has_more"
            - "response_type == array"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_commit_from_committed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CustomerContract.transitions.DRAFT_to_COMMITTED
          - errors[ERR_CONTRACT_NOT_DRAFT]
        distinguishing_aspect: "Second commit on an already-COMMITTED contract is rejected with ERR_CONTRACT_NOT_DRAFT."
        test_recipe:
          setup: ["Contract in COMMITTED"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
          trigger:
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRACT_NOT_DRAFT (captured ${err})"

      - name: route_stop_resume_from_cutting_returns_not_paused
        claim_type: invalid_transition
        grounds:
          - state_machines.RouteStop.transitions.PAUSED_WEATHER_to_CUTTING
          - errors[ERR_STOP_NOT_PAUSED]
        distinguishing_aspect: "resume requires PAUSED_WEATHER; calling it from CUTTING yields ERR_STOP_NOT_PAUSED."
        test_recipe:
          setup: ["Stop in CUTTING"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
          trigger:
            - call: "POST /harvest/route-stops/${stop_id}/resume"
              payload: {}
              as: CrewBoss
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STOP_NOT_PAUSED (captured ${err})"

      - name: terminal_settlement_paid_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Settlement
          - errors[ERR_SETTLEMENT_NOT_ISSUED]
        distinguishing_aspect: "After Settlement reaches PAID (terminal), further mark-paid is rejected with ERR_SETTLEMENT_NOT_ISSUED."
        test_recipe:
          setup: ["Settlement in PAID state (issued, then paid)"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v}" }
              as: BillingClerk
            - call: "POST /harvest/settlements/${settlement_id}/mark-paid"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /harvest/settlements/${settlement_id}/mark-paid"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SETTLEMENT_NOT_ISSUED (captured ${err})"

      - name: crew_release_with_active_lodging_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CrewMember.transitions.ACTIVE_to_RELEASED
          - errors[ERR_ACTIVE_LODGING_EXISTS]
        distinguishing_aspect: "CrewMember.release with a future BOOKED LodgingReservation is rejected with ERR_ACTIVE_LODGING_EXISTS."
        test_recipe:
          setup: ["CrewMember ACTIVE with a BOOKED lodging reservation in the future"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/lodging-sites"
              payload: { site_name: "Motel-6", state_code: "KS", total_beds: 4 }
              as: HarvestOperator
              captures: { site_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/crew-members"
              payload: { full_name: "A", visa_type: "US_CITIZEN", visa_expiry_date: "2099-01-01", hourly_rate_cents: 2000 }
              as: HarvestOperator
              captures: { crew_id: $.data.id }
            - call: "POST /harvest/crew-members/${crew_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-08", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/route-stops/${stop_id}/lodging-reservations"
              payload: { crew_member_id: "${crew_id}", lodging_site_id: "${site_id}", stay_start_date: "2026-08-05", stay_end_date: "2026-08-08", bed_count: 1 }
              as: CrewBoss
          trigger:
            - call: "POST /harvest/crew-members/${crew_id}/release"
              payload: {}
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACTIVE_LODGING_EXISTS (captured ${err})"

      - name: season_close_blocked_by_unresolved_settlements
        claim_type: precondition_enforcement
        grounds:
          - state_machines.HarvestSeason.transitions.SETTLING_to_CLOSED
          - errors[ERR_UNRESOLVED_SETTLEMENTS_EXIST]
        distinguishing_aspect: "Closing a season with any settlement still in ISSUED or DISPUTED yields ERR_UNRESOLVED_SETTLEMENTS_EXIST."
        test_recipe:
          setup: ["Season in SETTLING with one settlement still in ISSUED"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v}" }
              as: BillingClerk
            - call: "GET /harvest/seasons/${season_id}"
              payload: {}
              as: HarvestOperator
              captures: { season_v: $.data.version }
          trigger:
            - call: "POST /harvest/seasons/${season_id}/close"
              payload: { expected_season_version: "${season_v}" }
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNRESOLVED_SETTLEMENTS_EXIST (captured ${err})"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: hauling_add_on_only_when_used_our_trucks
        claim_type: correct_result
        grounds:
          - calculations.hauling_add_on_per_ticket
        distinguishing_aspect: "Tickets with used_our_trucks=false yield hauling_add_on_cents=0; with true yield round_half_up(gross_bushels*12)."
        test_recipe:
          setup: ["Stop in CUTTING"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
          trigger:
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-05T10:00:00Z", gross_bushels: 500, moisture_pct: 14.0, used_our_trucks: true }
              as: CrewBoss
              captures: { ticket_haul: $.data.id }
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-05T11:00:00Z", gross_bushels: 500, moisture_pct: 14.0, used_our_trucks: false }
              as: CrewBoss
              captures: { ticket_self: $.data.id }
          assert:
            - "DeliveryTicket.${ticket_haul}.hauling_add_on_cents == 6000"
            - "DeliveryTicket.${ticket_self}.hauling_add_on_cents == 0"

      - name: moisture_shrink_at_max_shrink_cap
        claim_type: boundary
        grounds:
          - calculations.moisture_shrink_factor
        distinguishing_aspect: "moisture_pct = 40.0 yields excess_tenths = 250 → 1 - 250*0.001 = 0.75, but cap is 1 - MAX_SHRINK = 0.80. Factor must be 0.80 (cap applied)."
        test_recipe:
          setup: ["Stop in CUTTING"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
