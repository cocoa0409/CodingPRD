            - call: "POST /parity/classifications/${cls_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "CLAIMS_COUNT" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { pt_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00.000Z" }
              as: Administrator
