  - rule_id: compensating_invariant
    instances:
      - name: purge_releases_exactly_the_tcns_the_transmission_consumed
        grounds:
          - calculations.tcn_conservation
          - calculations.tcn_allocation
          - entities.Ori.fields.tcn_consumed_count
          - entities.Ori.fields.tcn_released_count
          - state_machines.Submission.retention_status.PURGE_REQUESTED_to_PURGED
        distinguishing_aspect: |
          The conserved quantity is the ORI's transaction-control-number allocation ledger (a count of
          issued identifiers): transmit consumes one TCN per destination and the compensating purge
          releases exactly that many, so consumed minus released returns to the sum over non-purged root
          submissions, which is 0 here. The other invariant conserves physical prints, not identifiers.
        test_recipe:
          setup:
            - "A CRIMINAL_JUSTICE ORI with no prior submissions, so tcn_consumed_count and tcn_released_count are both 0"
            - "One card transmitted with retention_requested true to two destinations, consuming 2 TCNs"
            - "No destination result, no determination and no rap-back subscription exist, so the purge's conditional hops 3, 4 and 5 have nothing to fire on"
            - "The applicant has requested a purge"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
