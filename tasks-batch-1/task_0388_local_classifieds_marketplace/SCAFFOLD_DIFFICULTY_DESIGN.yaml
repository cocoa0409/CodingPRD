              as: Buyer
              as_user_id: "${b2_id}"
              captures: { mtB_id: $.data.id }
          trigger:
            - call: "POST /meetups/${mtB_id}/confirm"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "response error_id == ERR_SPOT_TIME_CONFLICT (overlap_minutes 30 with MT_A)"
            - "http status == 409"
            - "Meetup.${mtB_id}.status == PROPOSED (confirm rejected, not advanced)"

      - name: spot_operating_hours_window_containment
        grounds:
          - calculations.compute_meetup_overlap_minutes
          - validations[priority=10]
          - entities.SafeTradeSpot.fields.close_minute_of_day
        distinguishing_aspect: |
          Different interval semantics than overlap-vs-other-meetups: this is containment of the
          candidate window inside the spot's daily [open, close) window (end_minute_of_day <= close),
          a single-interval-vs-window check at meetup CREATE on the SafeTradeSpot's hours, not a
          meetup-vs-meetup collision.
        test_recipe:
          setup:
            - "Clock 08:00; spot open 480 (08:00) close 1020 (17:00); accepted offer ready."
            - "Propose a window 16:30-17:30 whose end (1050) exceeds close (1020)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
