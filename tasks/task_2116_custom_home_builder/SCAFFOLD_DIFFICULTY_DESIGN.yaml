scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contract_position_fixed_price_vs_cost_plus_diverge
        grounds:
          - calculations.project_contract_position
          - entities.Project.fields.contract_type
          - entities.Project.fields.builder_fee_pct
          - entities.Project.fields.cost_to_date
          - entities.Project.fields.contract_sum_current
        distinguishing_aspect: |
          This dual-variant instance lives in the Project cost-accounting domain: two projects
          carrying byte-identical ledger inputs (base 900000.00, zero change orders, zero allowance
          variance, cost_to_date 45000.30) report owner_billable_amount 900000.00 under the
          FIXED_PRICE variant and 53100.35 under the COST_PLUS variant.
        test_recipe:
          setup:
            - "One client, one lender, one PM, one estimator, two controllers and two subcontractors exist."
            - "Project FP is FIXED_PRICE with base_contract_amount 900000.00 and gmp_cap 1000000.00, in UNDER_CONSTRUCTION."
            - "Project CP is COST_PLUS with the same base_contract_amount 900000.00, gmp_cap 1000000.00 and builder_fee_pct 0.18, in UNDER_CONSTRUCTION."
            - "Each project carries exactly one APPROVED CostEntry of 45000.30, so cost_to_date is 45000.30 on both and contract_sum_current is 900000.00 on both."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /lenders"
              payload: { name: "Cornerstone Construction Bank", retainage_pct: 0.05, max_cumulative_draw_pct: 0.90, review_window_days: 10 }
              as: PlatformAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Casey Nolan", staff_function: "CONTROLLER" }
              as: PlatformAdmin
              captures: { ctl_a_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", lender_id: "${lender_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, gmp_cap: 1000000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_fp_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", lender_id: "${lender_id}", address: "22 Kestrel Ridge", contract_type: "COST_PLUS", base_contract_amount: 900000.00, builder_fee_pct: 0.18, gmp_cap: 1000000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_cp_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_fp_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_cp_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_fp_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell FP", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_cp_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell CP", planned_start: "2026-10-15T00:00:00.000Z", planned_finish: "2026-11-30T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_fp_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_cp_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /cost-entries"
              payload: { project_id: "${proj_fp_id}", entry_type: "SUBCONTRACT_INVOICE", cost_code: "06-100", amount: 45000.30, incurred_at: "2026-08-10T00:00:00.000Z", subcontractor_id: "${sub_frame_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ce_fp_id: $.data.id }
            - call: "POST /cost-entries"
              payload: { project_id: "${proj_cp_id}", entry_type: "SUBCONTRACT_INVOICE", cost_code: "06-100", amount: 45000.30, incurred_at: "2026-08-10T00:00:00.000Z", subcontractor_id: "${sub_frame_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ce_cp_id: $.data.id }
            - call: "POST /cost-entries/${ce_fp_id}/review"
              payload: { decision: "APPROVE" }
              as: Controller
              as_user_id: "${ctl_a_id}"
            - call: "POST /cost-entries/${ce_cp_id}/review"
              payload: { decision: "APPROVE" }
              as: Controller
              as_user_id: "${ctl_a_id}"
          trigger:
            - call: "GET /projects/${proj_fp_id}/contract-position"
              as: PlatformAdmin
            - call: "GET /projects/${proj_cp_id}/contract-position"
              as: PlatformAdmin
          assert:
            - "GET /projects/${proj_fp_id}/contract-position returns variant_applied == \"FIXED_PRICE\""
            - "GET /projects/${proj_fp_id}/contract-position returns owner_billable_amount == 900000.00"
            - "GET /projects/${proj_fp_id}/contract-position returns builder_margin_amount == 854999.70"
            - "GET /projects/${proj_cp_id}/contract-position returns variant_applied == \"COST_PLUS\""
            - "GET /projects/${proj_cp_id}/contract-position returns owner_billable_amount == 53100.35"
            - "GET /projects/${proj_cp_id}/contract-position returns builder_margin_amount == 8100.05"
            - "Both responses report cost_to_date == 45000.30 and contract_sum_current == 900000.00"
            - "Both responses report gmp_headroom == 100000.00"

      - name: warranty_coverage_whole_house_vs_trade_anchor_diverge
        grounds:
          - calculations.warranty_coverage_determination
          - entities.DefectTicket.fields.coverage_anchor
          - entities.DefectTicket.fields.coverage_end_at
          - entities.DefectTicket.fields.coverage_result
          - entities.DefectTicket.fields.source_schedule_task_id
        distinguishing_aspect: |
          This dual-variant instance lives in the DefectTicket warranty domain, not the Project
          cost ledger: one callback reported at 2028-06-01T00:00:00.000Z resolves to
          OUT_OF_COVERAGE under the whole-house anchor (window ends 2028-02-29T00:00:00.000Z)
          and to COVERED under the trade anchor on the same build (window ends
          2029-01-14T00:00:00.000Z).
        test_recipe:
          setup:
            - "Project is FINAL_ACCEPTED with substantial_completion_at 2027-03-01T00:00:00.000Z, so warranty_expires_at is 2028-02-29T00:00:00.000Z."
            - "A PLUMBING ScheduleTask on that project is COMPLETE with actual_finish 2027-01-15T00:00:00.000Z."
            - "The logical clock reads 2028-06-01T00:00:00.000Z when the two callbacks are filed."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /lenders"
              payload: { name: "Cornerstone Construction Bank", retainage_pct: 0.05, max_cumulative_draw_pct: 0.90, review_window_days: 10 }
              as: PlatformAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Blue Valve Plumbing", trade: "PLUMBING", lead_time_days: 10, crew_capacity: 2, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_plumb_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", lender_id: "${lender_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_frame_id: $.data.id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_plumb_id}", task_name: "Rough plumbing", planned_start: "2026-10-16T00:00:00.000Z", planned_finish: "2026-11-30T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_plumb_id: $.data.id }
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks/${task_frame_id}/release"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks/${task_frame_id}/progress"
              payload: { action: "START" }
              as: Subcontractor
              as_user_id: "${sub_frame_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /schedule-tasks/${task_frame_id}/progress"
              payload: { action: "COMPLETE" }
              as: Subcontractor
              as_user_id: "${sub_frame_id}"
            - call: "POST /schedule-tasks/${task_plumb_id}/release"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks/${task_plumb_id}/progress"
              payload: { action: "START" }
              as: Subcontractor
              as_user_id: "${sub_plumb_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /schedule-tasks/${task_plumb_id}/progress"
              payload: { action: "COMPLETE" }
              as: Subcontractor
              as_user_id: "${sub_plumb_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "DECLARE_SUBSTANTIAL_COMPLETION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/final-walkthrough"
              payload: { acknowledged_open_cosmetic_count: 0 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-06-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /defect-tickets"
              payload: { project_id: "${proj_id}", phase: "WARRANTY", room: "Kitchen", description: "Slow drain at island sink", severity: "FUNCTIONAL", category: "SYSTEMS" }
              as: Client
              as_user_id: "${client_id}"
              captures: { tk_whole_id: $.data.id }
            - call: "POST /defect-tickets"
              payload: { project_id: "${proj_id}", phase: "WARRANTY", room: "Kitchen", description: "Slow drain at island sink", severity: "FUNCTIONAL", category: "SYSTEMS", source_schedule_task_id: "${task_plumb_id}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { tk_trade_id: $.data.id }
          assert:
            - "DefectTicket.${tk_whole_id}.coverage_anchor == WHOLE_HOUSE"
            - "DefectTicket.${tk_whole_id}.coverage_end_at == 2028-02-29T00:00:00.000Z"
            - "DefectTicket.${tk_whole_id}.coverage_result == OUT_OF_COVERAGE"
            - "DefectTicket.${tk_trade_id}.coverage_anchor == TRADE"
            - "DefectTicket.${tk_trade_id}.coverage_end_at == 2029-01-14T00:00:00.000Z"
            - "DefectTicket.${tk_trade_id}.coverage_result == COVERED"
            - "Both tickets have reported_at == 2028-06-01T00:00:00.000Z and status == OPEN"

  # ===========================================================================
  # Rule 2 - Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: change_order_contingency_tier_keyed_on_presubtotal
        grounds:
          - calculations.change_order_priced_amount
          - entities.ChangeOrder.fields.markup_rate_applied
          - entities.ChangeOrder.fields.contingency_rate_applied
          - entities.ChangeOrder.fields.priced_amount
          - state_machines.ChangeOrder.DRAFT_to_PRICED
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency with a pinned evaluation order: the contingency
          tier is selected from the pre-contingency subtotal 48850.00 (0.03), so priced_amount is
          50315.50; solving the fixed point priced_amount = subtotal + rate(priced_amount)*subtotal
          would pick 0.05 and produce 51292.50.
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with contract_type FIXED_PRICE and base_contract_amount 900000.00."
            - "A ChangeOrder exists in DRAFT with origin CLIENT_REQUEST, direct_cost 40000.00 and schedule_impact_days 10."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Elle Sato", staff_function: "ESTIMATOR" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CLIENT_REQUEST", scope_description: "Add a screened porch", direct_cost: 40000.00, schedule_impact_days: 10 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/price"
              payload: {}
              as: Estimator
              as_user_id: "${est_id}"
          assert:
            - "ChangeOrder.${co_id}.status == PRICED"
            - "ChangeOrder.${co_id}.markup_rate_applied == 0.10"
            - "ChangeOrder.${co_id}.contingency_rate_applied == 0.03"
            - "ChangeOrder.${co_id}.priced_amount == 50315.50"
            - "ChangeOrder.${co_id}.priced_amount != 51292.50"
            - "ChangeOrder.${co_id}.priced_by_staff_id == ${est_id}"

      - name: draw_retainage_rounded_per_line_then_summed
        grounds:
          - calculations.draw_funding_amounts
          - entities.DrawRequest.fields.requested_amount
          - entities.DrawRequest.fields.retainage_amount
          - entities.DrawRequest.fields.net_funding_amount
          - state_machines.DrawRequest.DRAFT_to_LENDER_REVIEW
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the cents: with retainage_pct 0.05 and
          line amounts 10000.10 / 15000.10 / 20000.10 the pinned per-line-then-sum order yields
          retainage_amount 2250.03 and net_funding_amount 42750.27, whereas sum-then-round would
          yield 2250.02 and 42750.28.
        test_recipe:
          setup:
            - "Lender retainage_pct is 0.05 and max_cumulative_draw_pct is 0.90."
            - "Project is UNDER_CONSTRUCTION with base_contract_amount 900000.00, so the draw cap is 810000.00."
            - "Three CostEntry rows of 10000.10, 15000.10 and 20000.10 are APPROVED by controller A with incurred_at inside 2026-08-01..2026-08-31."
            - "A DRAFT DrawRequest for period 2026-08-01..2026-08-31 exists, created by controller B."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /lenders"
              payload: { name: "Cornerstone Construction Bank", retainage_pct: 0.05, max_cumulative_draw_pct: 0.90, review_window_days: 10 }
              as: PlatformAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Casey Nolan", staff_function: "CONTROLLER" }
              as: PlatformAdmin
              captures: { ctl_a_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Robin Vega", staff_function: "CONTROLLER" }
              as: PlatformAdmin
              captures: { ctl_b_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", lender_id: "${lender_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /cost-entries"
              payload: { project_id: "${proj_id}", entry_type: "SUBCONTRACT_INVOICE", cost_code: "06-100", amount: 10000.10, incurred_at: "2026-08-10T00:00:00.000Z", subcontractor_id: "${sub_frame_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ce1_id: $.data.id }
            - call: "POST /cost-entries"
              payload: { project_id: "${proj_id}", entry_type: "SUBCONTRACT_INVOICE", cost_code: "06-110", amount: 15000.10, incurred_at: "2026-08-15T00:00:00.000Z", subcontractor_id: "${sub_frame_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ce2_id: $.data.id }
            - call: "POST /cost-entries"
              payload: { project_id: "${proj_id}", entry_type: "SUBCONTRACT_INVOICE", cost_code: "06-120", amount: 20000.10, incurred_at: "2026-08-20T00:00:00.000Z", subcontractor_id: "${sub_frame_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ce3_id: $.data.id }
            - call: "POST /cost-entries/${ce1_id}/review"
              payload: { decision: "APPROVE" }
              as: Controller
              as_user_id: "${ctl_a_id}"
            - call: "POST /cost-entries/${ce2_id}/review"
              payload: { decision: "APPROVE" }
              as: Controller
              as_user_id: "${ctl_a_id}"
            - call: "POST /cost-entries/${ce3_id}/review"
              payload: { decision: "APPROVE" }
              as: Controller
              as_user_id: "${ctl_a_id}"
            - call: "GET /projects/${proj_id}"
              as: PlatformAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /draw-requests"
              payload: { project_id: "${proj_id}", period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-31T00:00:00.000Z", expected_project_version: "${proj_v}" }
              as: Controller
              as_user_id: "${ctl_b_id}"
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /draw-requests/${draw_id}/submit"
              payload: {}
              as: Controller
              as_user_id: "${ctl_b_id}"
          assert:
            - "DrawRequest.${draw_id}.status == LENDER_REVIEW"
            - "DrawRequest.${draw_id}.included_cost_entry_count == 3"
            - "DrawRequest.${draw_id}.requested_amount == 45000.30"
            - "DrawRequest.${draw_id}.retainage_amount == 2250.03"
            - "DrawRequest.${draw_id}.retainage_amount != 2250.02"
            - "DrawRequest.${draw_id}.net_funding_amount == 42750.27"
            - "Project.${proj_id}.pending_draw_amount == 45000.30"

  # ===========================================================================
  # Rule 3 - Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_order_revision_cycle_returns_to_priced
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ChangeOrder.REVISION_REQUESTED_to_PRICED
          - state_machines.ChangeOrder.PRICED_to_SUBMITTED
          - entities.ChangeOrder.fields.revision_count
        distinguishing_aspect: |
          Non-linearity type = cycle, on entity ChangeOrder: the row leaves PRICED, reaches
          SUBMITTED and REVISION_REQUESTED, and re-enters PRICED with revision_count incremented
          to 1 and a different priced_amount (15213.10 instead of 50315.50).
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION."
            - "A ChangeOrder has been priced at 50315.50 by the estimator and submitted by the PM, so it sits in SUBMITTED with revision_count 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Elle Sato", staff_function: "ESTIMATOR" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CLIENT_REQUEST", scope_description: "Add a screened porch", direct_cost: 40000.00, schedule_impact_days: 10 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/price"
              payload: {}
              as: Estimator
              as_user_id: "${est_id}"
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /change-orders/${co_id}/client-decision"
              payload: { decision: "REQUEST_REVISION", revision_note: "Shrink the porch to 12 feet" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /change-orders/${co_id}/price"
              payload: { direct_cost: 12000.00, schedule_impact_days: 2 }
              as: Estimator
              as_user_id: "${est_id}"
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
          assert:
            - "ChangeOrder.${co_id}.status == SUBMITTED"
            - "ChangeOrder.${co_id}.revision_count == 1"
            - "ChangeOrder.${co_id}.direct_cost == 12000.00"
            - "ChangeOrder.${co_id}.markup_rate_applied == 0.15"
            - "ChangeOrder.${co_id}.contingency_rate_applied == 0.03"
            - "ChangeOrder.${co_id}.priced_amount == 15213.10"
            - "Project.${proj_id}.approved_change_order_total == 0.00"

      - name: draw_status_and_waiver_compliance_advance_independently
        grounds:
          - state_machines.DrawRequest.LENDER_REVIEW_to_CONDITIONALLY_APPROVED
          - state_machines.DrawRequest.PENDING_to_PARTIAL
          - entities.DrawRequest.fields.waiver_compliance
          - entities.DrawRequest.fields.verified_waiver_count
          - entities.DrawRequest.fields.required_waiver_count
        distinguishing_aspect: |
          Non-linearity type = parallel state dimensions, on entity DrawRequest: after the lender
          conditionally approves and exactly one of two required waivers is verified, status reads
          CONDITIONALLY_APPROVED while waiver_compliance reads PARTIAL - the two axes hold
          different values on the same row at the same instant.
        test_recipe:
          setup:
            - "Two subcontractors with waiver_required true each have APPROVED cost entries inside the draw period: framing 10000.10, plumbing 15000.10 and 20000.10."
            - "The draw has been submitted by controller B, so it sits in LENDER_REVIEW with required_waiver_count 2 and waiver_compliance PENDING."
