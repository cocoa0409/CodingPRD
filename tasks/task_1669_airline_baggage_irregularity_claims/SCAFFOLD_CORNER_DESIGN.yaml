            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00161", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt}", courier_service_id: "${crr}", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: BaggageServiceAgent, captures: { dsp: $.data.id } }
          trigger:
            - { call: "POST /baggage/dispatches/${dsp}/reschedule", payload: { new_pickup_at: "2026-08-03T10:00:00Z" }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISPATCH_NOT_RESCHEDULABLE"
            - "DeliveryDispatch.${dsp}.pickup_at == 2026-08-02T10:00:00Z"
            - "DeliveryDispatch.${dsp}.attempt_count == 1"

      - name: pay_submitted_claim_rejected
        claim_type: violation_to_error
        grounds: ['state_machines.ExpenseClaim.APPROVED_to_PAID', 'errors[ERR_CLAIM_NOT_PAYABLE]']
        distinguishing_aspect: "pay on a claim still SUBMITTED (never adjudicated) is rejected with ERR_CLAIM_NOT_PAYABLE; report expense totals stay 0."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; DELAYED report TRACING; one claim SUBMITTED (4000 on 2026-08-02)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234662", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00162", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "meals", amount_minor: 4000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm}/pay", payload: {}, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_PAYABLE"
            - "ExpenseClaim.${clm}.status == SUBMITTED"
            - "IrregularityReport.${rpt}.expenses_paid_cents == 0"

      - name: payment_before_acceptance_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=6]', 'errors[ERR_SETTLEMENT_NOT_PAYABLE]']
        distinguishing_aspect: "Creating a settlement payment while the report is merely SETTLEMENT_OFFERED (passenger has not accepted) is rejected with ERR_SETTLEMENT_NOT_PAYABLE even with a fresh OCC version."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; international bag; DELAYED report swept DECLARED_LOST; assess-loss 100000; offer made (SETTLEMENT_OFFERED)"]
          setup_api_calls:
