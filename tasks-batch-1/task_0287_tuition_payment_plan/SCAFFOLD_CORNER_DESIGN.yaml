            - "Enrollment.${aa_enr}.scheduled_balance_cents == 270000"

      - name: charge_delta_spreads_over_scheduled_only
        claim_type: Input Set Filtering
        grounds: [calculations.balance_recalc_on_charge, entities.Installment.fields.status]
        distinguishing_aspect: "After installment 1 is PAID, posting a 60000 charge spreads only over the 3 remaining SCHEDULED installments (+20000 each); the PAID installment 1 stays frozen at 80000."
        test_recipe:
          setup: ["Enrollment ACTIVE [80000 x4]; down 80000 SETTLED; installment 1 paid (80000 SETTLED); then post 60000 FEE charge."]
