            - call: "POST /palliative/advance-care-documents/${doc_n_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents/${doc_n_id}/signatures"
