  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: study_period_closed_interval_boundary_conflicts
        grounds:
          - validations[priority=6]
          - errors[ERR_STUDY_PERIOD_OVERLAP]
          - entities.PayEquityStudy.fields.analysis_period_start
        distinguishing_aspect: |
          Resource = PayEquityStudy, CLOSED interval semantics: a new study
          whose period shares even one boundary date (2025-12-31) with an
          existing study conflicts, while a period starting the very next day
          is accepted.
        test_recipe:
          setup:
            - "Study L1 occupies CLOSED period [2025-01-01, 2025-12-31]"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyL1", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"] }, as: CompAnalyst, captures: { sl1: "$.data.id" } }
          trigger:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyL2", analysis_period_start: "2025-12-31", analysis_period_end: "2026-06-30", protected_classes: ["GENDER"] }, as: CompAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyL3", analysis_period_start: "2026-01-01", analysis_period_end: "2026-12-31", protected_classes: ["GENDER"] }, as: CompAnalyst, captures: { sl3: "$.data.id" } }
          assert:
            - "StudyL2 rejected: err == ERR_STUDY_PERIOD_OVERLAP (http 409) — 2025-12-31 belongs to both CLOSED periods"
            - "StudyL3 created (201) — first non-overlapping day after the occupied period is fine"

      - name: monitor_window_half_open_touching_allowed
        grounds:
          - validations[priority=6]
          - errors[ERR_MONITOR_WINDOW_OVERLAP]
          - entities.MonitoringCycle.fields.window_end
        distinguishing_aspect: |
          Resource = MonitoringCycle, HALF-OPEN [window_start, window_end)
          semantics — the opposite adjacency rule than the CLOSED study periods:
          a window starting exactly at another's window_end is allowed, while a
          window starting one day earlier genuinely overlaps and is rejected.
        test_recipe:
          setup:
            - "Study M (period 2024-01-01..2024-12-31, [GENDER], min_group_size 6) reached MONITORING via the full remediation cascade: 6-member group MEDIAN gap 10.0000, finding TARGETED, plan 2700000 with three APPROVED adjustments 950000/900000/850000 effective 2026-09-01, clock set to 2026-09-01T00:00:00Z"
