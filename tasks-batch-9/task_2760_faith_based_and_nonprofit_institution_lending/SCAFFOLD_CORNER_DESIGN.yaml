  - section: rbac
    instances:
      - name: roles_cannot_perform_other_roles_exclusive_operations
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.PlatformAdmin.exclusive_operations
          - roles.InstitutionRepresentative.exclusive_operations
          - roles.GovernanceOfficer
          - roles.LoanServicer
        distinguishing_aspect: "Eight calls that are each well-formed and would succeed for their owning role return 403 ERR_UNAUTHORIZED purely on the role header, and the denial is symmetric across reads too: GovernanceOfficer is refused GET /institutions while LoanServicer is refused GET /governance-authorizations."
        test_recipe:
          setup:
            - "One institution created by the PlatformAdmin; nothing else exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Second Baptist", institution_type: "CONGREGATION", denomination_code: "SBC", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 100000000, bylaws_quorum_pct: 0.5000, community_program_count: 1 }
              as: CreditAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: CreditAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Sanctuary 2026", goal_cents: 200000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9000 }
              as: CreditAnalyst
              captures: { e3: $.data.error_id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: GovernanceOfficer
              captures: { e4: $.data.error_id }
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: LoanServicer
              captures: { e5: $.data.error_id }
            - call: "GET /institutions"
              payload: {}
              as: GovernanceOfficer
              captures: { e6: $.data.error_id }
            - call: "GET /governance-authorizations"
              payload: {}
              as: LoanServicer
              captures: { e7: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: LoanServicer
              captures: { e8: $.data.error_id }
          assert:
            - "Every one of the eight responses is HTTP 403 with error_id \"ERR_UNAUTHORIZED\": ${e1}, ${e2}, ${e3}, ${e4}, ${e5}, ${e6}, ${e7} and ${e8} are all equal to \"ERR_UNAUTHORIZED\""
            - "GET /institutions as PlatformAdmin still reports total_count == 1 — the refused create wrote nothing"
            - "GET /giving-periods as PlatformAdmin reports total_count == 0 and GET /collateral-assets as PlatformAdmin reports total_count == 0"
            - "GET /institutions/${inst} as PlatformAdmin reports period_count == 0 — the clock never moved, so a follow-up POST /collateral-assets as CreditAnalyst with appraisal_date 2025-06-01 still computes appraisal_age_days == 426"

      - name: requests_carrying_an_undeclared_role_header_are_unauthenticated
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A header naming a role outside the six declared ones is 401 ERR_UNAUTHENTICATED from priority 1, which outranks priority 2's 403 — the same call with a declared but unlisted role is 403 ERR_UNAUTHORIZED, so the two auth layers are distinguishable."
        test_recipe:
          setup:
            - "One institution created by the PlatformAdmin."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "GET /institutions/${inst}"
              payload: {}
              as: UnknownRole
              captures: { e_read: $.data.error_id }
            - call: "POST /institutions"
              payload: { legal_name: "Second Baptist", institution_type: "CONGREGATION", denomination_code: "SBC", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 100000000, bylaws_quorum_pct: 0.5000, community_program_count: 1 }
              as: UnknownRole
              captures: { e_write: $.data.error_id }
            - call: "GET /institutions"
              payload: {}
              as: GovernanceOfficer
              captures: { e_declared: $.data.error_id }
          assert:
            - "First response: HTTP 401 with ${e_read} == \"ERR_UNAUTHENTICATED\""
            - "Second response: HTTP 401 with ${e_write} == \"ERR_UNAUTHENTICATED\" — priority 1 answers before priority 2 could produce a 403"
            - "Third response: HTTP 403 with ${e_declared} == \"ERR_UNAUTHORIZED\" — a declared role that the endpoint does not list is a different failure"
            - "GET /institutions as PlatformAdmin still reports total_count == 1"

      - name: institution_representative_cannot_touch_another_institutions_rows
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - validations[priority=3]
          - errors[ERR_INSTITUTION_SCOPE_VIOLATION]
          - roles.InstitutionRepresentative.identity
        distinguishing_aspect: "With two institutions on file, the representative of the first is 403 ERR_INSTITUTION_SCOPE_VIOLATION on the second institution's row and on that institution's giving period, while the identical read of its own rows is 200 — scope is resolved through the owning institution_id, not through the endpoint's role list."
        test_recipe:
          setup:
            - "Two institutions, each with one audited 2025Q1 giving period."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /institutions"
              payload: { legal_name: "Second Baptist", institution_type: "CONGREGATION", denomination_code: "SBC", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 100000000, bylaws_quorum_pct: 0.5000, community_program_count: 1 }
              as: PlatformAdmin
              captures: { inst_b: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_a}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
              captures: { gp_a: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_b}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 30000000, restricted_contributions_cents: 1000000, donor_restricted_endowment_draw_cents: 0, operating_expense_cents: 20000000, member_household_count: 200 }
              as: CreditAnalyst
              captures: { gp_b: $.data.id }
          trigger:
            - call: "GET /institutions/${inst_b}"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst_a}"
              captures: { e_inst: $.data.error_id }
            - call: "GET /giving-periods/${gp_b}"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst_a}"
              captures: { e_gp: $.data.error_id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst_b}", campaign_name: "Sanctuary 2026", goal_cents: 200000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9000 }
              as: InstitutionRepresentative
              as_user_id: "${inst_a}"
              captures: { e_camp: $.data.error_id }
            - call: "GET /giving-periods/${gp_a}"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst_a}"
          assert:
            - "First response: HTTP 403 with ${e_inst} == \"ERR_INSTITUTION_SCOPE_VIOLATION\""
            - "Second response: HTTP 403 with ${e_gp} == \"ERR_INSTITUTION_SCOPE_VIOLATION\" — scope is resolved through GivingPeriod.institution_id"
            - "Third response: HTTP 403 with ${e_camp} == \"ERR_INSTITUTION_SCOPE_VIOLATION\" and GET /pledge-campaigns as PlatformAdmin reports total_count == 0"
