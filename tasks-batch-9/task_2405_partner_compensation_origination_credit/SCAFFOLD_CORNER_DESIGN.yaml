              captures: { py: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rev One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rev Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rev Three", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2006, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c3: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "One reviewer will recuse.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${py}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${py}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c2}" }
              as: CycleAdmin
              captures: { r2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "No concerns." }
              as: Partner
              as_user_id: "${c1}"
            - call: "POST /comp/peer-reviews/${r2}/decide"
              payload: { outcome: "RECUSE", recusal_reason: "Longstanding co-counsel relationship with the subject." }
              as: Partner
              as_user_id: "${c2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
          trigger:
            - call: "GET /comp/self-assessments/${sa}"
              payload: {}
              as: CycleAdmin
              captures: { cnt1: "$.data.scored_review_count", mean1: "$.data.mean_peer_score" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c3}" }
              as: CycleAdmin
              captures: { r3: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r3}/decide"
              payload: { outcome: "SCORE", technical_score: 3, collaboration_score: 3, client_service_score: 3, comment: "Solid." }
              as: Partner
              as_user_id: "${c3}"
              captures: { cs3: "$.data.composite_score" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { st: "$.data.state" }
          assert:
            - "${cnt1} == 1 and ${mean1} == 4.0000 - the RECUSED review contributed nothing"
            - "${err} == ERR_PEER_REVIEWS_INCOMPLETE with HTTP 409, even though three reviews exist in total"
            - "PeerReview.${r2}.state == RECUSED with composite_score null and recusal_reason set"
            - "${cs3} == 3.0000"
            - "SelfAssessment.${sa}.scored_review_count == 2 and mean_peer_score == 3.5000 after ${r3}"
            - "${st} == DELIBERATION"

      - name: path_existence_is_checked_before_entity_state
        claim_type: Cascading validation
        grounds:
          - validations[priority=50]
          - validations[priority=70]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_MATTER_NOT_FOUND]
        distinguishing_aspect: |
          The state check cannot run until the path check has produced an entity, so a
          submit against an unknown claim id returns ERR_CLAIM_NOT_FOUND 404 rather than
          ERR_CLAIM_NOT_IN_DRAFT, and a status change against an unknown matter id returns
          ERR_MATTER_NOT_FOUND 404 rather than ERR_MATTER_NOT_OPEN - priority 50 strictly
          precedes priority 70.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE and partner P exists, but no claim and no matter carries the ids used in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cas Cade", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
          trigger:
            - call: "POST /comp/credit-claims/22222222-2222-4222-8222-222222222222/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/matters/33333333-3333-4333-8333-333333333333/status"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { e2: "$.data.error_id" }
          assert:
            - "${e1} == ERR_CLAIM_NOT_FOUND with HTTP 404, not ERR_CLAIM_NOT_IN_DRAFT"
            - "${e2} == ERR_MATTER_NOT_FOUND with HTTP 404, not ERR_MATTER_NOT_OPEN"
            - "GET /comp/credit-claims returns an empty list and GET /comp/matters returns an empty list"

      - name: origination_interval_sum_landing_exactly_on_one_hundred_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=120]
          - errors[ERR_CREDIT_INTERVAL_OVERSUBSCRIBED]
          - entities.Matter.fields.origination_pct_assigned
          - state_machines[CreditClaim].transitions[SUBMITTED->ALLOCATED]
        distinguishing_aspect: |
          The interval cap is an inclusive <= 100.00, so two separately adjudicated
          origination claims on the same matter at 60.00 and 40.00 both succeed and drive
          origination_pct_assigned to exactly 100.00 - the boundary itself is a pass, not a
          violation, and the second adjudication is not refused with
          ERR_CREDIT_INTERVAL_OVERSUBSCRIBED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partners P1 and P2 have each filed a NEW_CLIENT claim on the same OPEN Matter M for the previously unseen client CLI-EX; ARB is the credit arbiter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Exact One", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Exact Two", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Arb Exact", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true, evaluation_required: false }
              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-EX", client_display_name: "Exactly Hundred Ltd", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${p1}", responsible_attorney_id: "${p1}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv1: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 60.00, narrative: "I brought the relationship in." }
              as: Partner
              as_user_id: "${p1}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 40.00, narrative: "I co-sourced the same engagement." }
              as: Partner
              as_user_id: "${p2}"
              captures: { cl2: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p1}"
            - call: "POST /comp/credit-claims/${cl2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p2}"
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 60.00, expected_matter_version: "${mv1}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { s1: "$.data.state" }
            - call: "GET /comp/matters/${m}"
