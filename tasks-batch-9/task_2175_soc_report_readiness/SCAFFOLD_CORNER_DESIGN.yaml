              captures: { sd: $.data.id }
          trigger:
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "INFRASTRUCTURE", name: "Third-party racks", scope_status: "CARVED_OUT" }
