      - name: r7b_shift_activation_requires_staff_credentialed
        grounds:
          - state_machines.StaffingShift.SCHEDULED_to_ACTIVE
          - state_machines.Staff.PROFICIENCY_VERIFIED_to_CREDENTIALED
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/staffing-shifts/{id}/activate
        distinguishing_aspect: "StaffingShift -> Staff pair: activating a shift requires the assigned Staff.status == CREDENTIALED; the same activation is rejected while the staffer is only PROFICIENCY_VERIFIED and succeeds after issue-credential, a different entity pair from facility-vs-department."
