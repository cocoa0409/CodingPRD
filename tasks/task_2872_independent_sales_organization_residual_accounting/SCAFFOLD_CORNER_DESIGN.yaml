          - endpoints[POST /residual-batches/{id}/lines].side_effects
          - endpoints[POST /residual-batches/{id}/recall].side_effects
        distinguishing_aspect: "Every line carries sales_volume_cents 1000, whose buy-rate product is exactly 4.5 cents — so round-then-sum charges 5 cents per line while sum-then-round charges 9 cents for two lines and 14 for three. The running total is therefore 11978 (not 11979) at two lines and 17967 (not 17968) at three. line_count increments on each add while the money totals stay 0 until the normalize, a recall zeroes the money totals but NOT line_count, and an empty batch normalizes to 0 / 0 / 0 rather than erroring."
