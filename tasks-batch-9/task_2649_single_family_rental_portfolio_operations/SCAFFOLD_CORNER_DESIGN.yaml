          difficulty_instance: scope_benchmark_per_line_rounding_beats_index_the_sum_by_one_cent
          rationale: |
            The per-line-versus-index-the-sum question only becomes falsifiable on the exact
            three-line fixture that difficulty instance builds (1479843 versus 1479844); on any
            simpler fixture both orders agree, so a corner-level precision test would assert a number
