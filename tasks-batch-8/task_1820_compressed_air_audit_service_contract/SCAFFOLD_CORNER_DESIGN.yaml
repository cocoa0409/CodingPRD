          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-LNA", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
          trigger:
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FACILITY_NOT_ACTIVE (409)"
            - "DemandProfile.${prof0}.status == COLLECTING (unchanged)"

      - name: corner_sequence_compressor_invalid_at_create_and_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEQUENCE_COMPRESSOR_INVALID]", state_machines.RetrofitProject.PROPOSED_to_APPROVED]
        distinguishing_aspect: "Sequence referential integrity is enforced twice: at creation (foreign facility's compressor -> 422) and again at approve time (own compressor marked DOWN in between -> 422)."
        test_recipe:
          setup: ["FA ACTIVE with compressor CA; FB ACTIVE with compressor CB; project P1 created on FA referencing CB (create-time), project P2 on FA referencing CA which is then marked DOWN (approve-time)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "FA-SQ", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { facA: "$.data.id" } }
            - { call: "POST /facilities/${facA}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${facA}", asset_tag: "CA", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { cA: "$.data.id" } }
            - { call: "POST /facilities", payload: { name: "FB-SQ", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { facB: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${facB}", asset_tag: "CB", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { cB: "$.data.id" } }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${facA}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${cA}"], project_cost_cents: 1000000 }, as: EnergyEngineer, captures: { proj2: "$.data.id" } }
            - { call: "POST /compressors/${cA}/mark-down", as: ServiceTech }
          trigger:
            - { call: "POST /retrofit-projects", payload: { facility_id: "${facA}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${cB}"], project_cost_cents: 1000000 }, as: EnergyEngineer, captures: { err1: "$.data.error_id" } }
            - { call: "POST /retrofit-projects/${proj2}/approve", as: FacilityManager, as_user_id: "${facA}", captures: { err2: "$.data.error_id" } }
          assert:
            - "create referencing foreign compressor: error_id == ERR_SEQUENCE_COMPRESSOR_INVALID (422)"
            - "approve with sequenced compressor now DOWN: error_id == ERR_SEQUENCE_COMPRESSOR_INVALID (422)"
            - "RetrofitProject.${proj2}.status == PROPOSED (unchanged)"

      - name: corner_retrofit_stale_blocks_model
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_RETROFIT_STALE]", entities.SavingsCase.fields.retrofit_stale]
        distinguishing_aspect: "A case whose project was cascade-cancelled before ever being modeled keeps savings_status DRAFT with retrofit_stale true; model is rejected with ERR_RETROFIT_STALE."
        test_recipe:
          setup: ["Facility ACTIVE; baseline LOCKED; project APPROVED sequencing C1; case created (DRAFT, never modeled); then C1 decommissioned"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RTS", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /compressors/${c1}/decommission", as: ContractManager }
          trigger:
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_RETROFIT_STALE (409)"
            - "SavingsCase.${case}.savings_status == DRAFT and retrofit_stale == true"

  # ---------------------------------------------------------------
  - section: endpoints
    instances:
      - name: corner_invoice_locks_final_bill
        claim_type: side_effect_execution
        grounds: [state_machines.RentalReservation.RETURNED_to_INVOICED, entities.RentalReservation.fields.final_bill_cents]
        distinguishing_aspect: "invoice copies actual_bill_cents into immutable final_bill_cents and moves RETURNED -> INVOICED (terminal)."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN; A1 reserved 2026-09-01..09-10, delivered, returned 2026-09-04 (actual bill 140000c)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-INV3", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-10", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res: "$.data.id" } }
            - { call: "POST /rental-reservations/${res}/deliver", as: ServiceTech }
            - { call: "POST /rental-reservations/${res}/return", payload: { actual_return_date: "2026-09-04" }, as: ServiceTech }
          trigger:
            - { call: "POST /rental-reservations/${res}/invoice", as: ContractManager, captures: { st: "$.data.status", fb: "$.data.final_bill_cents" } }
          assert:
            - "RentalReservation.${res}.status == INVOICED"
            - "RentalReservation.${res}.final_bill_cents == 140000 (locked copy of actual_bill_cents)"

      - name: corner_offboard_blocked_then_succeeds
        claim_type: conditional_action
        grounds: [state_machines.Facility.ACTIVE_to_OFFBOARDED, "errors[ERR_FACILITY_HAS_OPEN_OBLIGATIONS]"]
        distinguishing_aspect: "Offboard is gated on open obligations: rejected while an ACTIVE contract exists, allowed after that contract is terminated."
        test_recipe:
          setup: ["Facility ACTIVE; one STANDARD contract ACTIVE"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-OFF", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
          trigger:
            - { call: "POST /facilities/${fac}/offboard", as: DealerAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /service-contracts/${sc}/terminate", as: ContractManager, captures: { fee: "$.data.termination_fee_cents" } }
            - { call: "POST /facilities/${fac}/offboard", as: DealerAdmin, captures: { st: "$.data.status" } }
          assert:
            - "first offboard: error_id == ERR_FACILITY_HAS_OPEN_OBLIGATIONS (409)"
            - "terminate: termination_fee_cents == 800000 (2 x 400000; not waived with 0 breaches)"
            - "second offboard: status == OFFBOARDED"

      - name: corner_filtered_list_fk_reverse_reachability
        claim_type: computed_read
        grounds: [entities.RentalReservation.fields.rental_asset_id, entities.LeakTag.fields.survey_id]
        distinguishing_aspect: "Every FK is queryable from the parent side via filtered list: GET /rental-reservations?rental_asset_id= returns exactly the reservations on that asset; GET /leak-tags?survey_id= returns exactly the survey's tags."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN; A1 with one reservation; survey with two tags"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-FK", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A2", rated_cfm: 800, daily_rate_cents: 60000, deposit_cents: 150000 }, as: DealerAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res: "$.data.id" } }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "a", cfm_loss: 3.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { t1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "b", cfm_loss: 4.0, repair_quote_cents: 120000 }, as: EnergyEngineer, captures: { t2: "$.data.id" } }
          trigger:
            - { call: "GET /rental-reservations?rental_asset_id=${a1}", as: ContractManager }
            - { call: "GET /rental-reservations?rental_asset_id=${a2}", as: ContractManager }
            - { call: "GET /leak-tags?survey_id=${surv}", as: EnergyEngineer }
          assert:
            - "GET /rental-reservations?rental_asset_id=${a1}: total_count == 1, row id == ${res}"
            - "GET /rental-reservations?rental_asset_id=${a2}: total_count == 0 (empty array, not 404)"
            - "GET /leak-tags?survey_id=${surv}: total_count == 2 containing ${t1} and ${t2}"

      - name: corner_list_pagination_envelope
        claim_type: satisfaction_to_pass
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with envelope pagination fields: 3 facilities, limit=2 -> 2 rows + has_more true; offset=2 -> 1 row + has_more false; total_count == 3 in both."
        test_recipe:
          setup: ["Three facilities created"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-PG1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin }
            - { call: "POST /facilities", payload: { name: "F-PG2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin }
            - { call: "POST /facilities", payload: { name: "F-PG3", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin }
          trigger:
            - { call: "GET /facilities?limit=2&offset=0", as: DealerAdmin }
            - { call: "GET /facilities?limit=2&offset=2", as: DealerAdmin }
          assert:
            - "page 1: len(data) == 2, total_count == 3, has_more == true, response_type == array"
            - "page 2: len(data) == 1, total_count == 3, has_more == false"

  # ---------------------------------------------------------------
  - section: errors
    instances:
      # Errors whose only trigger paths are exercised as failure branches of §1.8 instances:
      - name: corner_err_compressor_not_down
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPRESSOR_NOT_DOWN]"]
        excluded_because:
          difficulty_instance: rental_gated_by_compressor_state_and_contract_tier
          rationale: "Asserted as the F1 trigger outcome of the named §1.8 instance."
      - name: corner_err_contract_tier_ineligible_rental
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_TIER_INELIGIBLE]"]
        excluded_because:
          difficulty_instance: rental_gated_by_compressor_state_and_contract_tier
          rationale: "Rental-side tier gate asserted as the F2 trigger outcome of the named §1.8 instance; the certificate side of the same error is covered by corner_certificate_tier_gate_and_uniqueness."
      - name: corner_err_measurement_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEASUREMENT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: demand_profile_closed_window_overlap
          rationale: "Asserted as the first trigger outcome of the named §1.8 instance."
      - name: corner_err_rental_asset_unavailable_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENTAL_ASSET_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: rental_asset_turnaround_buffer_overlap
          rationale: "Asserted as the turnaround-adjacency trigger outcome of the named §1.8 instance; the undersized-explicit-asset flavor is covered by corner_selector_empty_pool_and_undersized."
      - name: corner_err_measurement_incomplete
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEASUREMENT_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: certificate_settle_gated_by_measured_case
          rationale: "Asserted as the first settle attempt of the named §1.8 instance."
      - name: corner_err_posture_not_normal
        claim_type: violation_to_error
        grounds: ["errors[ERR_POSTURE_NOT_NORMAL]"]
        excluded_because:
          difficulty_instance: run_hours_cascade_to_certificate_gate
          rationale: "Asserted as the settle rejection at the end of the named §1.8 cascade instance."
      - name: corner_err_retrofit_not_accepted
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETROFIT_NOT_ACCEPTED]"]
        excluded_because:
          difficulty_instance: decommission_cascade_to_savings_stale
          rationale: "Asserted as the open-measurement rejection of the named §1.8 instance."
      - name: corner_err_dispute_open_payout_frozen
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISPUTE_OPEN_PAYOUT_FROZEN]"]
        excluded_because:
          difficulty_instance: certificate_dispute_recompute_loop
          rationale: "The freeze gate is on the same transition exercised by the named §1.8 instance; the explicit pay-while-OPEN rejection is additionally asserted in corner_guarantee_payout_fee_cap_and_dispute_freeze."

  # ---------------------------------------------------------------
  - section: rbac
    instances:
      - name: corner_rbac_engineer_cannot_manage_contracts
        claim_type: rbac_denial
        grounds: ["roles[EnergyEngineer]", "roles[ContractManager]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "EnergyEngineer is not in the roles of POST /service-contracts: denial is 403 ERR_FORBIDDEN_FOR_ROLE even with a well-formed body."
        test_recipe:
          setup: ["Facility ACTIVE"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RB1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
          trigger:
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: EnergyEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"

      - name: corner_rbac_tech_cannot_set_clock
        claim_type: rbac_denial
        grounds: ["roles[ServiceTech]", "roles[DealerAdmin]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "The test-driving clock endpoint is DealerAdmin-only: ServiceTech gets 403."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ServiceTech, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"

      - name: corner_rbac_facility_manager_ownership_enforced
        claim_type: rbac_denial
        grounds: ["roles[FacilityManager]", "validations[priority=5]", "errors[ERR_FACILITY_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "FacilityManager identity is entity-backed: authorize-repair on a tag owned by facility A while presenting X-User-ID of facility B yields 403 ERR_FACILITY_OWNERSHIP_MISMATCH, not a business error."
        test_recipe:
          setup: ["FA ACTIVE with VERIFIED survey and QUOTED tag; FB ACTIVE (a different facility whose id the caller presents)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "FA-OWN", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { facA: "$.data.id" } }
            - { call: "POST /facilities/${facA}/activate", as: DealerAdmin }
            - { call: "POST /leak-surveys", payload: { facility_id: "${facA}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "a", cfm_loss: 5.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { tag: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /facilities", payload: { name: "FB-OWN", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { facB: "$.data.id" } }
          trigger:
            - { call: "POST /leak-tags/${tag}/authorize-repair", as: FacilityManager, as_user_id: "${facB}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FACILITY_OWNERSHIP_MISMATCH, http 403"
            - "LeakTag.${tag}.status == QUOTED (unchanged)"

      - name: corner_sod_survey_verify_and_measurement_close
        claim_type: segregation_of_duties
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.LeakSurvey.fields.submitted_by_user_id, entities.DemandProfile.fields.locked_by_user_id]
        distinguishing_aspect: "Two segregation-of-duties checks: the survey submitter cannot verify the same survey (eng-1 rejected, eng-2 accepted), and the engineer who locked the baseline cannot close the measurement against it (eng-1 rejected, eng-2 accepted)."
        test_recipe:
          setup: ["Facility ACTIVE; survey SUBMITTED by eng-1; full savings pipeline to MEASUREMENT_OPEN with baseline LOCKED by eng-1; post profile LOCKED"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-SOD", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "a", cfm_loss: 5.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { tag: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-3 }
          trigger:
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-1, captures: { err1: "$.data.error_id" } }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-1, captures: { err2: "$.data.error_id" } }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2, captures: { sst: "$.data.status" } }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2, captures: { cst: "$.data.savings_status" } }
          assert:
            - "verify by submitter eng-1: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "close-measurement by baseline locker eng-1: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "verify by eng-2: survey status == VERIFIED"
            - "close-measurement by eng-2: savings_status == MEASURED"

  # ---------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_lock_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[demand-profile-lock-stale-facility]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After locking P1 advances Facility.version, a second lock (P2) carrying the previously observed version is rejected 412 ERR_STALE_VERSION; P2 stays COLLECTING and P1 stays LOCKED."
        test_recipe:
          setup: ["Facility ACTIVE; profiles P1 (2026-03-01..03-31) and P2 (2026-04-01..04-30) both COLLECTING; client holds facility version observed before either lock"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-OCC1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { p1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-04-01", window_end_date: "2026-04-30", measured_kwh: 240000, measured_avg_cfm: 345.0, measured_peak_cfm: 510.0 }, as: EnergyEngineer, captures: { p2: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: EnergyEngineer, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${p1}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
          trigger:
            - { call: "POST /demand-profiles/${p2}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-2, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412 (version advanced by the P1 lock)"
            - "DemandProfile.${p2}.status == COLLECTING (unchanged); DemandProfile.${p1}.status == LOCKED"

      - name: corner_occ_stale_activate_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[contract-activate-stale-facility]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After activating SC1 advances Facility.version, activating SC2 with the stale version is rejected 412; SC2 stays DRAFT and SC1 stays ACTIVE (no supersede by a stale caller)."
        test_recipe:
          setup: ["Facility ACTIVE; contracts SC1 and SC2 both DRAFT; client holds pre-activation facility version"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-OCC2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "PREMIUM", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 900000 }, as: ContractManager, captures: { sc2: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc1}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
          trigger:
            - { call: "POST /service-contracts/${sc2}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412"
            - "ServiceContract.${sc2}.status == DRAFT (unchanged); ServiceContract.${sc1}.status == ACTIVE"

      - name: corner_rebase_clears_stale_baseline
        claim_type: version_pinning
        grounds: [entities.SavingsCase.fields.baseline_stale, entities.SavingsCase.fields.baseline_profile_version, state_machines.SavingsCase]
        distinguishing_aspect: "Version-pinning lifecycle: locking P2 supersedes P1 and flags the case baseline_stale (model -> ERR_BASELINE_SUPERSEDED); rebase re-pins to P2 (baseline_profile_version matches P2's current version), clears the flag, and returns savings to DRAFT so model succeeds."
        test_recipe:
          setup: ["Facility ACTIVE; P1 LOCKED; project APPROVED (125->100); case created against P1; P2 (2026-04-01..04-30, 240000 kWh) then LOCKED, superseding P1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RBS", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { p1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${p1}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${p1}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id", pin1: "$.data.baseline_profile_version" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-04-01", window_end_date: "2026-04-30", measured_kwh: 240000, measured_avg_cfm: 345.0, measured_peak_cfm: 510.0 }, as: EnergyEngineer, captures: { p2: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${p2}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1, captures: { p2_v: "$.data.version" } }
          trigger:
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer, captures: { err: "$.data.error_id" } }
            - { call: "POST /savings-cases/${case}/rebase", payload: {}, as: EnergyEngineer, captures: { pin2: "$.data.baseline_profile_id", stale2: "$.data.baseline_stale", ss2: "$.data.savings_status" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer, captures: { deemed: "$.data.deemed_annual_savings_kwh" } }
          assert:
            - "after P2 lock: DemandProfile.${p1}.status == SUPERSEDED and superseded_by_id == ${p2}"
            - "model while stale: error_id == ERR_BASELINE_SUPERSEDED"
            - "rebase: baseline_profile_id == ${p2}, baseline_stale == false, savings_status == DRAFT"
            - "model after rebase succeeds: deemed_annual_savings_kwh == 496400 (P2 annualizes to 2920000, sequencing 0.17)"

      - name: corner_selector_smallest_sufficient_and_tiebreak
        claim_type: selector_policy
        grounds: [calculations.rental_asset_selector]
        distinguishing_aspect: "Auto-select ranks by rated_cfm ASC with created_at ASC tie-break: 400-CFM demand picks the 500-CFM asset over the 800s; with the 500 in maintenance, the earlier-created 800 wins the tie."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 (400 CFM) DOWN; fleet A1 500 CFM (created first), A2 800 CFM (second), A3 800 CFM (third)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-SEL", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A2", rated_cfm: 800, daily_rate_cents: 60000, deposit_cents: 150000 }, as: DealerAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A3", rated_cfm: 800, daily_rate_cents: 60000, deposit_cents: 150000 }, as: DealerAdmin, captures: { a3: "$.data.id" } }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05" }, as: FacilityManager, as_user_id: "${fac}", captures: { res1: "$.data.id", pick1: "$.data.rental_asset_id" } }
            - { call: "POST /rental-reservations/${res1}/cancel", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /rental-assets/${a1}/set-maintenance", payload: { in_maintenance: true }, as: ServiceTech }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05" }, as: FacilityManager, as_user_id: "${fac}", captures: { res2: "$.data.id", pick2: "$.data.rental_asset_id" } }
          assert:
            - "first auto-select picks ${a1} (500 CFM: smallest sufficient)"
            - "after A1 enters maintenance, auto-select picks ${a2} (800 CFM tie with A3 broken by earlier created_at)"
            - "RentalReservation.${res2}.deposit_cents == 150000 (snapshot from A2)"

      - name: corner_selector_empty_pool_and_undersized
        claim_type: selector_policy
        grounds: [calculations.rental_asset_selector, "errors[ERR_NO_RENTAL_ASSET_AVAILABLE]", "errors[ERR_RENTAL_ASSET_UNAVAILABLE]"]
        distinguishing_aspect: "Empty-pool fallback: with only a 300-CFM asset against a 400-CFM demand, auto-select fails ERR_NO_RENTAL_ASSET_AVAILABLE; explicitly naming the undersized asset fails ERR_RENTAL_ASSET_UNAVAILABLE instead."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 (400 CFM) DOWN; fleet has only A3 300 CFM"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-EMP", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A3", rated_cfm: 300, daily_rate_cents: 20000, deposit_cents: 60000 }, as: DealerAdmin, captures: { a3: "$.data.id" } }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05" }, as: FacilityManager, as_user_id: "${fac}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05", rental_asset_id: "${a3}" }, as: FacilityManager, as_user_id: "${fac}", captures: { err2: "$.data.error_id" } }
          assert:
            - "auto-select: error_id == ERR_NO_RENTAL_ASSET_AVAILABLE (empty eligible pool)"
            - "explicit undersized asset: error_id == ERR_RENTAL_ASSET_UNAVAILABLE"
            - "GET /rental-reservations?facility_id=${fac} returns empty array"

      - name: corner_posture_recovers_after_service
        claim_type: derived_field_reconciliation
        grounds: [calculations.facility_posture, calculations.maintenance_delinquency]
        distinguishing_aspect: "Derived fields reconcile on the write path: delinquency appears at exactly next_due and disappears after record-service lifts the anchor — posture returns to NORMAL without any manual edit."
        test_recipe:
          setup: ["Facility ACTIVE; C1 at 6000 run-hours; DRYER schedule anchor 4000 interval 2000 (due 6000) — delinquent; then record-service at 6000"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-REC", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 4000 }, as: ServiceTech }
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "DRYER", interval_hours: 2000 }, as: ContractManager, captures: { sched: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 6000 }, as: ServiceTech }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { post1: "$.data.posture" } }
          trigger:
            - { call: "POST /maintenance-schedules/${sched}/record-service", payload: { service_date: "2026-08-05", run_hours_reading: 6000 }, as: ServiceTech, captures: { anchor: "$.data.anchor_run_hours", due: "$.data.next_due_run_hours", del: "$.data.is_delinquent" } }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { post2: "$.data.posture" } }
          assert:
            - "before service: posture == MAINTENANCE_DELINQUENT"
            - "after service: anchor_run_hours == 6000, next_due_run_hours == 8000, is_delinquent == false"
            - "after service: posture == NORMAL (reconciled in the same request)"

  # ---------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: corner_immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.RentalReservation.fields.quoted_cents]
        distinguishing_aspect: "Immediate consistency: the create response already carries computed planned_days (10) and quoted_cents (350000), and an immediate re-read returns identical values with version == 1."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN; A1 AVAILABLE"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-CON", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-10", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res: "$.data.id", q: "$.data.quoted_cents", pd: "$.data.planned_days" } }
            - { call: "GET /rental-reservations/${res}", as: ContractManager, captures: { q2: "$.data.quoted_cents", v2: "$.data.version" } }
          assert:
            - "create response: planned_days == 10, quoted_cents == 350000"
            - "immediate GET: quoted_cents == 350000 (identical), version == 1"
