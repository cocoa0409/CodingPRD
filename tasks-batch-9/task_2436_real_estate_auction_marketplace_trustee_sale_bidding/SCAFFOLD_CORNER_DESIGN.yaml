              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Audit Read Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id, deposit: $.data.required_deposit_cents }
            - call: "POST /bidders"
              payload: { legal_name: "Audit Read Bidder LLC", email: "b@auditread.example", mailing_address: "2 Auditread Rd, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-AUDT-1" }
