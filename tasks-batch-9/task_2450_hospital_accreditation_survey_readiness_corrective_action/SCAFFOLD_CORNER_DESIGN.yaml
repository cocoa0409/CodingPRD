          - errors[ERR_COMMAND_CENTER_NOT_ACTIVATED]
          - state_machines.SurveyWindow.ELIGIBLE_to_ACTIVE_SURVEY
        distinguishing_aspect: "The window_state guard passes (ELIGIBLE) but the parallel command-center guard fails, so OPEN_SURVEY returns ERR_COMMAND_CENTER_NOT_ACTIVATED and no unit is locked."
        test_recipe:
          setup:
            - "Survey CYCLE-2026 with window_state ELIGIBLE at clock 2026-09-20T00:00:00Z and command_center_state still STANDBY."
            - "One unit MED-7 with posture OPEN."
