          assert:
            - "FalseAlarmIncident.${inc_k1}.occurrence_index == 1 and assessed_fee_cents == 15000"
            - "FalseAlarmIncident.${inc_k1}.fee_basis == {tier_base_cents: 12000, occupancy_multiplier: 1.25, non_ecv_surcharge_applied: false, unpermitted_multiplier_applied: false, cap_applied: false, aggravation_cents: 0} - raw 15000 is NOT strictly greater than the 15000 cap"
            - "FalseAlarmIncident.${inc_k2}.occurrence_index == 2 and assessed_fee_cents == 15000"
            - "FalseAlarmIncident.${inc_k2}.fee_basis.tier_base_cents == 12800 and fee_basis.cap_applied == true (raw 16000 > 15000)"
            - "both FALSE_ALARM_FEE invoices have subtotal_cents == 15000, admin_fee_cents == 750, assessed_cents == 15750 (the capped line is written at the cap, not at 16000)"
            - "AlarmSite.${site_cap}.outstanding_balance_cents == 42500 (2 x 15750 fee invoices + 2 x 5500 permit-issue invoices)"

