        distinguishing_aspect: "CLOSED accepts uploads as the remedy path: a period that closed DELINQUENT (standing NON_COMPLIANT) flips its outcome DELINQUENT -> LATE when a file is certified after the due date, and the standing recomputes to WATCH."
