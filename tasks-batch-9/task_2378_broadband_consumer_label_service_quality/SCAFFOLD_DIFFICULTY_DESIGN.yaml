          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "PUBLISHED MethodologyDocument MTH-2026-A with peak hours [19,23)."
            - "ServicePlan OFFPEAK300 (advertised 300/140) with MeasurementProbe PRB-OFF."
            - "One INCLUDED TestRun of 3 samples, all observed at 14:00 UTC: downloads 150 / 120 / 180, uploads 50 / 40 / 60, latencies 40 / 30 / 50."
          setup_api_calls:
