        distinguishing_aspect: "The clock endpoint is the single exception to the X-User-ID rule and is shared by all six roles, so it is the one write no role can be refused. Contrasting it with an ordinary GET (shared by all six) and with the leakage report (shared by three) shows that 'shared_operations' has three distinct widths in this domain."
