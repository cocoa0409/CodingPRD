              as_user_id: "admin-legal-1"
              captures: { pI1_ver: $.data.version }
            - call: "POST /hie/participants/${pI1_id}/data-feeds"
              payload: { feed_type: "CCDA", expected_participant_version: "${pI1_ver}" }
              as: HieAdmin
              captures: { feedI1_id: $.data.id, feedI1_status0: $.data.status }
          trigger:
            - call: "POST /hie/data-feeds/${feedI1_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 8000, messages_rejected: 100, required_fields_missing_count: 200, duplicate_count: 50, timeliness_p95_seconds: 250 }
              as: HieAdmin
              captures: { sampI1_id: $.data.id, sampI1_rate: $.data.reject_rate }
            - call: "GET /hie/data-feeds/${feedI1_id}"
              payload: {}
              as: HieAdmin
              captures: { feedI1_status1: $.data.status, feedI1_rate1: $.data.latest_reject_rate, feedI1_samples: $.data.sample_count }
            - call: "GET /hie/participants/${pI1_id}"
