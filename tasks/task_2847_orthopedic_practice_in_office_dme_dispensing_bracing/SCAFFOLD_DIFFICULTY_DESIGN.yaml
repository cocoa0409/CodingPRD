              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_b_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_attest_id}"
            - call: "POST /dme/encounters/${enc_b_id}/coverage-verifications"
              payload: { covered: true, deductible_remaining_cents: 0, coinsurance_pct: 0.5, valid_for_days: 30 }
              as: InsuranceCoordinator
            - call: "GET /dme/par-levels/${par_id}"
              payload: {}
              as: InventoryManager
              captures: { par_v2: $.data.version }
            - call: "POST /dme/encounters/${enc_b_id}/reservations"
              payload: { expected_par_level_version: "${par_v2}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
            - call: "POST /dme/encounters/${enc_b_id}/fitting-records"
              payload: { fitting_start_at: "2026-08-01T10:00:00Z", fitting_end_at: "2026-08-01T10:30:00Z", measurement_set: { waist_cm: 104 }, fit_outcome: "ACCEPTABLE" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
            - call: "POST /dme/encounters/${enc_b_id}/dispense"
              payload: { delivery_signature_role: "PATIENT" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { enc_b_pr: $.data.patient_responsibility_cents }
            - call: "GET /dme/clinics/${clinic_id}/dispensing-summary"
              payload: {}
              as: PracticeAdmin
              captures: { c1_gross: $.data.gross_charged_cents, c1_refunded: $.data.refunded_cents, c1_fee: $.data.restock_fee_retained_cents, c1_net: $.data.net_cash_position_cents }
          trigger:
            - call: "POST /dme/encounters/${enc_a_id}/returns"
              payload: { reason: "DEFECT", return_note: "hinge cracked" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { ret_a_id: $.data.id }
            - call: "POST /dme/returns/${ret_a_id}/inspection"
              payload: { condition: "SELLABLE" }
              as: InventoryManager
              captures: { ret_a_dev: $.data.device_component_cents, ret_a_fit: $.data.fitting_component_cents, ret_a_dev_ref: $.data.device_refund_cents, ret_a_fit_ref: $.data.fitting_refund_cents, ret_a_refund: $.data.refund_cents, ret_a_fee: $.data.restock_fee_cents }
            - call: "POST /dme/encounters/${enc_b_id}/returns"
              payload: { reason: "POOR_FIT", return_note: "patient cannot tolerate the pad" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { ret_b_id: $.data.id }
            - call: "POST /dme/returns/${ret_b_id}/inspection"
              payload: { condition: "SELLABLE" }
              as: InventoryManager
              captures: { ret_b_dev: $.data.device_component_cents, ret_b_fit: $.data.fitting_component_cents, ret_b_dev_ref: $.data.device_refund_cents, ret_b_fit_ref: $.data.fitting_refund_cents, ret_b_refund: $.data.refund_cents, ret_b_fee: $.data.restock_fee_cents }
            - call: "GET /dme/clinics/${clinic_id}/dispensing-summary"
              payload: {}
              as: PracticeAdmin
              captures: { c2_gross: $.data.gross_charged_cents, c2_refunded: $.data.refunded_cents, c2_fee: $.data.restock_fee_retained_cents, c2_net: $.data.net_cash_position_cents }
          assert:
            - "${enc_a_pr} == 10300 and ${enc_a_billable} == 10300 and ${enc_b_pr} == 10300"
            - "${c1_gross} == 20600 and ${c1_refunded} == 0 and ${c1_fee} == 0 and ${c1_net} == 20600"
            - "${ret_a_dev} == 8755 and ${ret_a_fit} == 1545 (the two buckets re-sum to 10300 with no drift)"
            - "${ret_a_dev_ref} == 8755 and ${ret_a_fit_ref} == 1545 and ${ret_a_refund} == 10300 and ${ret_a_fee} == 0"
            - "${ret_a_refund} + ${ret_a_fee} == 10300 == ${enc_a_pr}"
            - "${ret_b_dev} == 8755 and ${ret_b_fit} == 1545"
            - "${ret_b_dev_ref} == 7880 and ${ret_b_fit_ref} == 1468 and ${ret_b_refund} == 9348 and ${ret_b_fee} == 952"
            - "${ret_b_refund} + ${ret_b_fee} == 10300 == ${enc_b_pr}"
            - "${c2_gross} == 20600 (patient_responsibility_cents is not zeroed by the refund, only billable_amount_cents is)"
            - "${c2_refunded} == 19648 and ${c2_fee} == 952"
            - "${c2_net} == 952 == ${c2_fee} (every billed encounter has been returned, so the net position is exactly the retained restocking fees)"
            - "DispenseEncounter.${enc_a_id}.billable_amount_cents == 0 and DispenseEncounter.${enc_b_id}.billable_amount_cents == 0"
            - "DispenseEncounter.${enc_a_id}.financial_status == REFUNDED and DispenseEncounter.${enc_b_id}.financial_status == REFUNDED"
