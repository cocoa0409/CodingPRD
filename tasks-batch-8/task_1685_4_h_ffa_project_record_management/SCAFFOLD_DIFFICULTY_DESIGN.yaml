  # =========================================================================
  # RULE 9 — compensating_invariant across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: treasury_net_invariant
        grounds:
          - entities.Club.fields.treasury_balance_cents
          - state_machines.Member.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Conserved quantity = club treasury balance in cents. Forward action (approve an
          EXPENSE_REIMBURSEMENT) debits the treasury; the invariant is
          sum(DUES_PAYMENT amounts) - sum(APPROVED EXPENSE_REIMBURSEMENT amounts) ==
          club.treasury_balance_cents. After a 1000-cent dues payment and a 400-cent approved
          reimbursement, the balance must equal exactly 600.
        test_recipe:
          setup:
            - "Club with one POSTED DUES_PAYMENT of 1000 cents and one EXPENSE_REIMBURSEMENT of 400 cents"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Juniper 4-H", county_code: "JU" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Tr", email: "vtr@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/treasury-transactions"
              payload: { club_id: "${club_id}", txn_kind: "DUES_PAYMENT", amount_cents: 1000 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/treasury-transactions"
              payload: { club_id: "${club_id}", txn_kind: "EXPENSE_REIMBURSEMENT", amount_cents: 400 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /api/treasury-transactions/${txn_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { bal: $.data.treasury_balance_cents }
          assert:
            - "Club.${club_id}.treasury_balance_cents == 600  # 1000 dues - 400 approved reimbursement"

      - name: star_quota_nominate_withdraw_invariant
        grounds:
          - entities.Club.fields.star_nomination_count
          - state_machines.AwardApplication.NOMINATED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = club STAR nomination count (an integer quota, a different conserved
          quantity than treasury cents). Forward action (nominate STAR) increments the count;
          compensating action (withdraw) decrements it. After nominate then withdraw, the count
          returns to its original value 0, so the invariant count == (nominations - withdrawals)
          holds with zero drift.
        test_recipe:
          setup:
            - "Club with star_nomination_count == 0 and a member with APPROVED record book and DRAFT STAR application"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Magnolia FFA", county_code: "MG" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol I", email: "vi@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Inv", birth_date: "2008-04-01", club_id: "${club_id}", is_club_officer: true }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "INCOME", amount_cents: 10000, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 80, accuracy: 90, financial: 70, reflection: 85 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications"
              payload: { member_id: "${mem_id}", award_track: "STAR", record_book_id: "${rb_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { aa_id: $.data.id }
            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { club_v: $.data.version }
          trigger:
            - call: "POST /api/award-applications/${aa_id}/nominate"
              payload: { expected_club_version: "${club_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications/${aa_id}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { cnt: $.data.star_nomination_count }
          assert:
            - "Club.${club_id}.star_nomination_count == 0  # nominate(+1) then withdraw(-1) conserves the quota"
