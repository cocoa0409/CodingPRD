scenario: |
  Builders Risk & Course of Construction Insurance (builders risk underwriting unit): project
  underwriting on construction type, value, duration and natural catastrophe exposure, coverage for
  materials on site, in transit and at temporary storage with sublimits, soft cost and
  delay-in-completion coverage tied to a projected completion date, existing structure versus new
  construction distinctions on renovation projects, project extension endorsements and premium
  adjustment for schedule slip, water damage, testing and commissioning coverage conditions, named
  insured structure across owner, contractor and lenders with loss payee interests, claim adjustment
  with reconstruction cost and continuing project management.
domain_name: builders-risk-course-of-construction
api_prefix: /builders-risk

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under `api_prefix`
  # (`/builders-risk/policies`, `/builders-risk/claims`, `/builders-risk/loss-payments`, ...).
  # Parentage is expressed exclusively through FK body fields (`policy_id`, `claim_id`,
  # `facility_id`, `payee_interest_id`); no create/mutate path nests one entity inside another.
  # Read-side discovery uses sub-resource projections (`GET /policies/{id}/coverage-parts`) purely
  # as FK reverse-reachability channels — they return `<Child>[]` and own no write semantics.

  state_machine_shape: parallel
  # Claim carries two independent state axes on one row (`adjustment_status` x `payment_status`)
  # plus a REOPENED loop; BuildersRiskPolicy branches DRAFT -> {QUOTED, REFERRED} and cycles
  # QUOTED -> DRAFT; ExtensionEndorsement cycles REQUESTED <-> RETURNED_FOR_INFO; StorageFacility
  # cycles ACTIVE <-> SUSPENDED.

  relationship_patterns:
    - one_to_many          # BuildersRiskPolicy -> CoveragePart / NamedInsuredInterest / Claim
    - many_to_many         # TemporaryStorageAssignment junctions BuildersRiskPolicy x StorageFacility
    - cross_aggregate      # StorageFacility capacity is shared across policies of different projects
    - self_referential     # PremiumTransaction.reverses_sequence_no points at a sibling row of the same policy

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ConstructionProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Project name as submitted by the broker.
      - name: site_address
        type: string
        source: input
        description: Street address of the construction site.
      - name: construction_type
        type: enum
        source: input
        description: ISO construction class driving the base rate per $1,000 of insured value.
        constraints: "one of {FRAME, JOISTED_MASONRY, NON_COMBUSTIBLE, FIRE_RESISTIVE}"
      - name: project_kind
        type: enum
        source: input
        description: New construction versus renovation of an existing structure.
        constraints: "one of {NEW_CONSTRUCTION, RENOVATION}"
      - name: hard_cost_value_cents
        type: integer
        source: input
        description: Completed value of the new work (hard costs) in cents.
        constraints: "> 0"
      - name: existing_structure_value_cents
        type: integer
        source: input
        default: 0
        description: Actual cash value of the pre-existing structure in cents; MUST be 0 when project_kind == NEW_CONSTRUCTION.
        constraints: ">= 0"
      - name: cat_zone
        type: enum
        source: input
        description: Natural catastrophe exposure band of the site, selects the CAT load percentage.
        constraints: "one of {INLAND, WIND_TIER_1, WIND_TIER_2, SEISMIC, FLOOD_A}"
      - name: planned_start_date
        type: datetime
        source: input
        description: Scheduled first day of construction (ISO 8601 UTC).
      - name: projected_completion_date
        type: datetime
        source: input
        description: Projected substantial completion date as submitted; baseline for delay-in-completion coverage.
        constraints: "> planned_start_date"
      - name: actual_substantial_completion_date
        type: datetime
        source: system
        default: null
        description: Actual substantial completion date stamped by POST /projects/{id}/substantial-completion.
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Project lifecycle state.
        constraints: "one of {SUBMITTED, ELIGIBLE, INELIGIBLE, UNDER_CONSTRUCTION, SUBSTANTIALLY_COMPLETE}"
      - name: engineering_grade
        type: enum
        source: system
        default: null
        description: Loss-control grade stamped by POST /projects/{id}/screen.
        constraints: "one of {A, B, C, D} or null before screening"
      - name: loss_control_report_ref
        type: string
        source: system
        default: null
        description: Reference of the loss-control report supplied at screening.
      - name: screened_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the RiskEngineer who screened the project.
      - name: submission_risk_score
        type: integer
        source: computed
        default: null
        description: "Result of calculations.project_risk_score variant SUBMISSION_BASIS; null until screened."
        constraints: "0..100"
      - name: audit_risk_score
        type: integer
        source: computed
        default: null
        description: "Result of calculations.project_risk_score variant AUDIT_BASIS; null until the first extension approval or claim adjustment."
        constraints: "0..100"
      - name: in_force_policy_count
        type: integer
        source: computed
        default: 0
        description: Count of BuildersRiskPolicy rows with policy.project_id == this id and status == IN_FORCE.

  - name: BuildersRiskPolicy
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ConstructionProject.id; the insured project. Immutable after creation."
      - name: term_start_date
        type: datetime
        source: input
        description: Policy inception date; term interval is half-open [term_start_date, term_end_date).
      - name: term_end_date
        type: datetime
        source: input
        description: Policy expiry date, exclusive.
        constraints: "> term_start_date"
      - name: original_term_days
        type: integer
        source: computed
        description: "Whole days in [term_start_date, term_end_date) as submitted at creation; never changed by endorsements."
      - name: cumulative_extension_days
        type: integer
        source: computed
        default: 0
        description: Sum of requested_extension_days over ExtensionEndorsement rows of this policy with status == APPROVED.
      - name: adjusted_completion_date
        type: datetime
        source: computed
        description: ConstructionProject.projected_completion_date plus cumulative_extension_days; baseline date for delay-in-completion indemnity.
      - name: includes_existing_structure
        type: boolean
        source: input
        default: false
        description: Whether the pre-existing structure value is insured under this policy.
      - name: deductible_tier
        type: enum
        source: input
        description: Occurrence deductible tier; also selects the deductible premium credit.
        constraints: "one of {STANDARD_25K, ELEVATED_100K, HIGH_250K}"
      - name: occurrence_deductible_cents
        type: integer
        source: computed
        description: "Deductible amount in cents from deductible_tier: STANDARD_25K -> 2500000, ELEVATED_100K -> 10000000, HIGH_250K -> 25000000."
      - name: limit_cents
        type: integer
        source: input
        description: Policy aggregate limit in cents; caps the sum of all indemnity allocations.
        constraints: "> 0"
      - name: daily_delay_rate_cents
        type: integer
        source: input
        description: "Agreed daily indemnity rate in cents for delay-in-completion soft costs; 0 means the policy buys no delay coverage, in which case a DELAY_IN_COMPLETION CoveragePart may not be scheduled."
        constraints: ">= 0"
      - name: insured_tiv_cents
        type: integer
        source: computed
        description: "hard_cost_value_cents + (includes_existing_structure ? existing_structure_value_cents : 0) of the FK project, frozen at creation."
      - name: quoted_premium_cents
        type: integer
        source: computed
        default: null
        description: "Result of calculations.quote_premium; null until POST /policies/{id}/quote."
      - name: referral_load_pct
        type: number
        source: system
        default: 0
        description: Manager premium load applied when a REFERRED policy is approved.
        constraints: "one of {0, 0.10, 0.20}"
      - name: written_premium_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PremiumTransaction.amount_cents over rows with this policy_id (signed ledger total).
      - name: eroded_total_cents
        type: integer
        source: computed
        default: 0
        description: Sum of CoveragePart.eroded_cents over coverage parts of this policy.
      - name: return_premium_cents
        type: integer
        source: computed
        default: null
        description: "Result of calculations.cancellation_return_premium; null unless status == CANCELLED."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Policy lifecycle state.
        constraints: "one of {DRAFT, REFERRED, QUOTED, BOUND, IN_FORCE, EXPIRED, CANCELLED, DECLINED, SUPERSEDED}"
      - name: quoted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the Underwriter who ran the quote; the segregation-of-duties counterparty for referral decisions.
      - name: bound_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp at which the policy was bound.
      - name: cancel_reason
        type: enum
        source: system
        default: null
        description: Reason recorded by POST /policies/{id}/cancel; selects the return-premium basis.
        constraints: "one of {INSURED_REQUEST, CARRIER_INITIATED, PROJECT_ABANDONED} or null"
      - name: cancel_effective_date
        type: datetime
        source: system
        default: null
        description: Effective date of cancellation; earned/unearned split point.

  - name: CoveragePart
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> BuildersRiskPolicy.id; the policy this sublimit belongs to."
      - name: part_type
        type: enum
        source: input
        description: Coverage bucket; unique per policy_id.
        constraints: "one of {MATERIALS_ON_SITE, IN_TRANSIT, TEMPORARY_STORAGE, EXISTING_STRUCTURE, SOFT_COST, DELAY_IN_COMPLETION, WATER_DAMAGE, TESTING_COMMISSIONING}"
      - name: sublimit_cents
        type: integer
        source: input
        description: Maximum indemnity payable from this bucket in cents.
        constraints: "> 0 and <= BuildersRiskPolicy.limit_cents"
      - name: condition_code
        type: enum
        source: input
        default: NONE
        description: Coverage condition that must be satisfied before this bucket may indemnify a loss.
        constraints: "one of {NONE, APPROVED_NOTICE_REQUIRED, MITIGATION_PLAN_REQUIRED}"
      - name: eroded_cents
        type: integer
        source: computed
        default: 0
        description: Sum of LossPayment.amount_cents over payments with status == ISSUED whose part_type equals this part_type on claims of this policy.
      - name: available_cents
        type: integer
        source: computed
        description: sublimit_cents - eroded_cents.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: ACTIVE while the policy can indemnify from this bucket; CLOSED once the policy leaves IN_FORCE.
        constraints: "one of {ACTIVE, CLOSED}"

  - name: NamedInsuredInterest
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> BuildersRiskPolicy.id; the policy on which this party is named."
      - name: party_name
        type: string
        source: input
        description: Legal name of the named insured or loss payee.
      - name: party_role
        type: enum
        source: input
        description: Capacity in which the party is named.
        constraints: "one of {OWNER, GENERAL_CONTRACTOR, LENDER, SUBCONTRACTOR}"
      - name: insurable_interest_pct
        type: number
        source: input
        description: Share of the insurable interest in the completed work; MUST be 0 for party_role == LENDER.
        constraints: "0 <= value <= 100, at most 2 decimal places"
      - name: loss_payee_priority
        type: integer
        source: input
        default: null
        description: "Payment priority of a mortgagee/loss payee: REQUIRED when party_role == LENDER, optional for OWNER, GENERAL_CONTRACTOR and SUBCONTRACTOR (any named party may also be a loss payee), and unique within the policy whenever it is present."
        constraints: ">= 1 when present, otherwise null"
      - name: acknowledgment_status
        type: enum
        source: system
        default: PENDING
        description: Whether the party has acknowledged its interest through POST /named-insured-interests/{id}/acknowledge.
        constraints: "one of {PENDING, ACKNOWLEDGED}"
      - name: acknowledged_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp of acknowledgment.

  - name: ExtensionEndorsement
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> BuildersRiskPolicy.id; the policy whose term and completion baseline are extended."
      - name: requested_extension_days
        type: integer
        source: input
        description: Whole days of schedule slip requested.
        constraints: "1 <= value <= 180"
      - name: slip_reason
        type: enum
        source: input
        description: Cause of the schedule slip, recorded for underwriting audit.
        constraints: "one of {WEATHER, LABOR_SHORTAGE, MATERIAL_DELAY, DESIGN_CHANGE, PERMIT_DELAY}"
      - name: revised_completion_date
        type: datetime
        source: input
        description: Claimed new completion date; MUST equal BuildersRiskPolicy.adjusted_completion_date + requested_extension_days at request time.
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Endorsement lifecycle state.
        constraints: "one of {REQUESTED, RETURNED_FOR_INFO, APPROVED, DECLINED, LAPSED, SUPERSEDED, RESCINDED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the Underwriter who filed the request; segregation-of-duties counterparty for the decision.
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the approver/decliner.
      - name: info_request_note
        type: string
        source: system
        default: null
        description: Note recorded when the endorsement is returned for more information.
      - name: resubmission_count
        type: integer
        source: computed
        default: 0
        description: Number of times this endorsement has gone RETURNED_FOR_INFO -> REQUESTED.
      - name: slip_factor
        type: number
        source: computed
        default: null
        description: "Slip tier factor selected by calculations.extension_premium_adjustment; one of {1.00, 1.15, 1.40}."
      - name: additional_premium_cents
        type: integer
        source: computed
        default: null
        description: "Result of calculations.extension_premium_adjustment; recomputed on every resubmission and frozen at approval."

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> BuildersRiskPolicy.id; the policy under which the loss is claimed."
      - name: peril
        type: enum
        source: input
        description: Cause of loss; TESTING_FAILURE and WATER_DAMAGE are the condition-gated perils, DELAY drives the delay-in-completion calculation.
        constraints: "one of {WIND, FLOOD, FIRE, THEFT, WATER_DAMAGE, TESTING_FAILURE, DELAY}"
      - name: loss_date
        type: datetime
        source: input
        description: Date of loss; MUST fall inside the half-open policy term [term_start_date, term_end_date).
      - name: description
        type: string
        source: input
        description: Free-text loss description recorded at first notice.
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which the claim was reported.
      - name: adjustment_status
        type: enum
        source: system
        default: REPORTED
        description: Adjustment axis of the claim state (independent of payment_status).
        constraints: "one of {REPORTED, ADJUSTED, DENIED, SETTLED, CLOSED, REOPENED}"
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: Payment axis of the claim state (independent of adjustment_status).
        constraints: "one of {UNPAID, PARTIALLY_PAID, PAID}"
      - name: adjustment_basis
        type: enum
        source: system
        default: null
        description: Valuation basis chosen at the most recent adjustment.
        constraints: "one of {RECONSTRUCTION_COST, ACTUAL_LOSS} or null"
      - name: continuing_pm_weeks
        type: integer
        source: system
        default: 0
        description: Weeks of continuing project management supervision indemnified under the RECONSTRUCTION_COST basis.
        constraints: "0 <= value <= 12"
      - name: allocation_lines
        type: array
        source: computed
        default: []
        description: "Per-bucket allocation objects produced by calculations.claim_indemnity_allocation: { part_type, coverage_part_id, gross_loss_cents, covered_basis_cents, deductible_applied_cents, allocated_cents, uncovered_cents }, ordered by the pinned ALLOCATION_ORDER."
      - name: indemnity_cents
        type: integer
        source: computed
        default: 0
        description: Sum of allocation_lines[].allocated_cents.
      - name: uncovered_cents
        type: integer
        source: computed
        default: 0
        description: Sum of allocation_lines[].uncovered_cents plus the deductible retained by the insured.
      - name: delay_days_indemnified
        type: integer
        source: computed
        default: 0
        description: "Indemnified delay days from calculations.delay_in_completion_indemnity; 0 for non-DELAY perils."
      - name: paid_cents
        type: integer
        source: computed
        default: 0
        description: Sum of LossPayment.amount_cents over payments of this claim with status == ISSUED.
      - name: outstanding_reserve_cents
        type: integer
        source: computed
        default: 0
        description: indemnity_cents - paid_cents.
      - name: total_incurred_cents
        type: integer
        source: computed
        default: 0
        description: paid_cents + outstanding_reserve_cents; MUST always equal indemnity_cents.
      - name: adjusted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ClaimAdjuster who ran the most recent adjustment.
      - name: reopen_count
        type: integer
        source: computed
        default: 0
        description: Number of times the claim has been reopened.

  - name: LossPayment
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim being indemnified."
      - name: payee_interest_id
        type: string
        source: input
        description: "FK -> NamedInsuredInterest.id; the loss payee receiving the funds. MUST belong to the same policy as the claim."
      - name: part_type
        type: enum
        source: input
        description: Coverage bucket the payment draws down; MUST match an allocation line on the claim.
        constraints: "one of {MATERIALS_ON_SITE, IN_TRANSIT, TEMPORARY_STORAGE, EXISTING_STRUCTURE, SOFT_COST, DELAY_IN_COMPLETION, WATER_DAMAGE, TESTING_COMMISSIONING}"
      - name: amount_cents
        type: integer
        source: input
        description: Payment amount in cents.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: ISSUED payments erode the coverage bucket; VOIDED payments are fully reversed.
        constraints: "one of {ISSUED, VOIDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimAdjuster who issued the payment; segregation-of-duties counterparty for the void.
      - name: voided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ClaimAdjuster who voided the payment.

  - name: PremiumTransaction
    parent: null
    common_fields: false
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> BuildersRiskPolicy.id; the policy whose premium ledger this row belongs to."
      - name: sequence_no
        type: integer
        source: system
        description: 1-based position of this row within its policy's ledger, assigned in created_at ASC order.
      - name: txn_type
        type: enum
        source: system
        description: Ledger entry kind.
        constraints: "one of {INITIAL, EXTENSION_AP, EXTENSION_AP_REVERSAL, RETURN_PREMIUM}"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount in cents; positive for premium charged, negative for premium returned or reversed.
      - name: effective_date
        type: datetime
        source: system
        description: Logical-clock timestamp at which the entry became effective.
      - name: reverses_sequence_no
        type: integer
        source: system
        default: null
        description: PremiumTransaction.sequence_no of the earlier row of the SAME policy_id that this row reverses; null for original entries.
      - name: memo
        type: string
        source: system
        description: Human-readable origin of the entry (e.g. "bind", "extension approval", "extension rescission", "cancellation return").

  - name: TestingCommissioningNotice
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ConstructionProject.id; the site where testing occurs."
      - name: system_type
        type: enum
        source: input
        description: Building system being tested or commissioned.
        constraints: "one of {SPRINKLER_HYDROSTATIC, HVAC, ELECTRICAL_ENERGIZATION, BOILER_STARTUP, ELEVATOR}"
      - name: window_start
        type: datetime
        source: input
        description: Start of the testing window; window interval is half-open [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: End of the testing window, exclusive.
        constraints: "> window_start"
      - name: hot_work
        type: boolean
        source: input
        default: false
        description: Whether the activity involves welding/cutting/torch work; triggers the 24-hour separation buffer.
      - name: water_charged
        type: boolean
        source: input
        default: false
        description: Whether piping will be charged with water during the window; triggers the mitigation-plan condition.
      - name: mitigation_plan_ref
        type: string
        source: input
        default: null
        description: Reference of the water-damage mitigation plan; required before approval when water_charged is true and the policy's WATER_DAMAGE part carries condition_code == MITIGATION_PLAN_REQUIRED.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Notice lifecycle state; only APPROVED notices satisfy the testing coverage condition.
        constraints: "one of {SCHEDULED, APPROVED, REJECTED}"
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the RiskEngineer who decided the notice.
      - name: rejection_reason
        type: string
        source: system
        default: null
        description: Reason recorded when the notice is rejected.

  - name: StorageFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Facility name.
      - name: site_code
        type: string
        source: input
        description: Short unique code of the facility; unique across all StorageFacility rows.
      - name: distance_from_site_miles
        type: number
        source: input
        description: Road distance from the insured site in miles.
        constraints: "> 0"
      - name: aggregate_capacity_cents
        type: integer
        source: input
        description: Maximum insured value the facility may hold across all overlapping storage assignments.
        constraints: "> 0"
      - name: protection_class
        type: enum
        source: input
        description: Fire protection class of the facility.
        constraints: "one of {SPRINKLERED, NON_SPRINKLERED}"
      - name: committed_value_cents
        type: integer
        source: computed
        default: 0
        description: Sum of TemporaryStorageAssignment.stored_value_cents over assignments at this facility with status == APPROVED.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: SUSPENDED facilities accept no new storage assignments.
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: TemporaryStorageAssignment
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> BuildersRiskPolicy.id; the policy whose TEMPORARY_STORAGE sublimit covers the stored materials."
      - name: facility_id
        type: string
        source: input
        description: "FK -> StorageFacility.id; the off-site facility holding the materials."
      - name: stored_value_cents
        type: integer
        source: input
        description: Insured value of materials held at the facility during the window.
        constraints: "> 0"
      - name: window_start
        type: datetime
        source: input
        description: Start of the storage occupancy; interval is half-open [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: End of the storage occupancy, exclusive.
        constraints: "> window_start"
      - name: status
        type: enum
        source: system
        default: APPROVED
        description: APPROVED assignments consume facility capacity; RELEASED assignments do not.
        constraints: "one of {APPROVED, RELEASED}"
      - name: released_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp of release.
      - name: release_reason
        type: enum
        source: system
        default: null
        description: Why the assignment was released.
        constraints: "one of {MANUAL, POLICY_EXPIRY, POLICY_CANCELLATION} or null"

state_machines:
  - entity: ConstructionProject
    initial_state: SUBMITTED
    terminal_states: [INELIGIBLE, SUBSTANTIALLY_COMPLETE]
    transitions:
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /projects/{id}/screen"
        actor: RiskEngineer
        preconditions:
          - "project.status == SUBMITTED"
          - "engineering_grade != D"
          - "calculations.project_risk_score variant SUBMISSION_BASIS < 90"
        side_effects:
          - "sets engineering_grade, loss_control_report_ref, screened_by_user_id from the request and header"
          - "computes and stores submission_risk_score (calculations.project_risk_score / SUBMISSION_BASIS)"
      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /projects/{id}/screen"
        actor: RiskEngineer
        preconditions:
          - "project.status == SUBMITTED"
          - "engineering_grade == D OR calculations.project_risk_score variant SUBMISSION_BASIS >= 90"
        side_effects:
          - "computes and stores submission_risk_score even though the project is declined"
          - "sets engineering_grade, loss_control_report_ref, screened_by_user_id"
        note: "Terminal. No re-screen path exists; a second POST /projects/{id}/screen is rejected with ERR_INVALID_PROJECT_STATE."
      - from: ELIGIBLE
        to: UNDER_CONSTRUCTION
        trigger: "system: side effect of POST /policies/{id}/incept on any policy of this project"
        actor: system
        preconditions:
          - "project.status == ELIGIBLE"
        side_effects:
          - "increments in_force_policy_count by 1"
      - from: UNDER_CONSTRUCTION
        to: SUBSTANTIALLY_COMPLETE
        trigger: "POST /projects/{id}/substantial-completion"
        actor: ProjectContact
        preconditions:
          - "project.status == UNDER_CONSTRUCTION"
          - "X-User-ID == project.id (entity_backed ownership)"
          - "actual_substantial_completion_date <= current logical clock"
          - "actual_substantial_completion_date > planned_start_date"
        side_effects:
          - "stores actual_substantial_completion_date"
          - "makes the DELAY peril adjustable: calculations.delay_in_completion_indemnity can now run for claims of this project's policies"

  - entity: BuildersRiskPolicy
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: side effect of POST /policies creating a newer DRAFT for the same project_id"
        actor: system
        preconditions:
          - "the existing policy of that project_id has status == DRAFT"
        side_effects:
          - "clears nothing; quoted_premium_cents (if any) is retained for audit"
        note: "Only DRAFT policies are superseded. A QUOTED/BOUND/IN_FORCE policy blocks a new submission with ERR_ACTIVE_POLICY_EXISTS."
      - from: DRAFT
        to: QUOTED
        trigger: "POST /policies/{id}/quote"
        actor: Underwriter
        preconditions:
          - "policy.status == DRAFT"
          - "project.status IN {ELIGIBLE, UNDER_CONSTRUCTION} and project.submission_risk_score != null"
          - "a CoveragePart with part_type == MATERIALS_ON_SITE exists for this policy"
          - "project.submission_risk_score < 75"
        side_effects:
          - "computes and stores quoted_premium_cents (calculations.quote_premium)"
          - "stamps quoted_by_user_id from X-User-ID"
      - from: DRAFT
        to: REFERRED
        trigger: "POST /policies/{id}/quote"
        actor: Underwriter
        preconditions:
          - "same preconditions as DRAFT -> QUOTED except project.submission_risk_score >= 75"
        side_effects:
          - "computes and stores quoted_premium_cents (calculations.quote_premium) but holds it as non-offerable"
          - "stamps quoted_by_user_id from X-User-ID"
        note: "Branch point: the same trigger produces QUOTED or REFERRED purely from the 75-point boundary."
      - from: REFERRED
        to: QUOTED
        trigger: "POST /policies/{id}/referral-decision with decision == APPROVE"
        actor: UnderwritingManager
        preconditions:
          - "policy.status == REFERRED"
          - "X-User-ID != policy.quoted_by_user_id (segregation of duties)"
        side_effects:
          - "stores referral_load_pct from the request"
          - "recomputes quoted_premium_cents = round_half_up(quoted_premium_cents * (1 + referral_load_pct))"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /policies/{id}/referral-decision with decision == DECLINE"
        actor: UnderwritingManager
        preconditions:
          - "policy.status == REFERRED"
          - "X-User-ID != policy.quoted_by_user_id (segregation of duties)"
        side_effects:
          - "leaves quoted_premium_cents untouched for audit"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /policies/{id}/reopen"
        actor: Underwriter
        preconditions:
          - "policy.status == QUOTED"
        side_effects:
          - "clears quoted_premium_cents to null, quoted_by_user_id to null and referral_load_pct to 0"
        note: "Revision cycle: coverage parts and interests can be edited, then the policy is re-quoted from scratch."
      - from: QUOTED
        to: BOUND
        trigger: "POST /policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "policy.status == QUOTED"
          - "sum of insurable_interest_pct over interests with party_role IN {OWNER, GENERAL_CONTRACTOR} == 100"
          - "every interest with party_role == LENDER has acknowledgment_status == ACKNOWLEDGED"
          - "sum of sublimit_cents over parts with part_type IN {MATERIALS_ON_SITE, EXISTING_STRUCTURE} <= policy.insured_tiv_cents"
        side_effects:
          - "stamps bound_at from the logical clock"
          - "appends PremiumTransaction { txn_type: INITIAL, amount_cents: +quoted_premium_cents, sequence_no: 1, memo: 'bind' }"
          - "because that ledger row was appended, recomputes written_premium_cents (calculations.premium_ledger_balance)"
      - from: BOUND
        to: IN_FORCE
        trigger: "POST /policies/{id}/incept"
        actor: Underwriter
        preconditions:
          - "policy.status == BOUND"
          - "current logical clock >= policy.term_start_date"
        side_effects:
          - "cascade: project ELIGIBLE -> UNDER_CONSTRUCTION and project.in_force_policy_count += 1"
      - from: IN_FORCE
        to: EXPIRED
        trigger: "system: side effect of POST /_clock/set_current_utc advancing the clock to >= policy.term_end_date"
        actor: system
        preconditions:
          - "policy.status == IN_FORCE"
          - "new clock value >= policy.term_end_date"
        side_effects:
          - "hop 1: policy.status IN_FORCE -> EXPIRED (version += 1)"
          - "hop 2: because the policy left IN_FORCE, every CoveragePart of this policy with status == ACTIVE becomes CLOSED"
          - "hop 3: because the TEMPORARY_STORAGE part closed, every TemporaryStorageAssignment of this policy with status == APPROVED becomes RELEASED with release_reason == POLICY_EXPIRY and released_at == the new clock value"
          - "hop 4: because those assignments were released, StorageFacility.committed_value_cents is recomputed for each facility they referenced"
          - "independent branch: every ExtensionEndorsement of this policy with status IN {REQUESTED, RETURNED_FOR_INFO} becomes LAPSED, and project.in_force_policy_count is recomputed"
      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: UnderwritingManager
        preconditions:
          - "policy.status == IN_FORCE"
          - "policy.term_start_date < cancel_effective_date <= policy.term_end_date"
          - "cancel_effective_date >= current logical clock (a cancellation is effective now or in the future; back-dating is rejected with ERR_CANCEL_DATE_INVALID)"
        side_effects:
          - "stores cancel_reason and cancel_effective_date"
          - "computes return_premium_cents (calculations.cancellation_return_premium) and appends PremiumTransaction { txn_type: RETURN_PREMIUM, amount_cents: -return_premium_cents, memo: 'cancellation return' }"
          - "because that ledger row was appended, recomputes written_premium_cents"
          - "cascade: every ACTIVE CoveragePart -> CLOSED; then every APPROVED TemporaryStorageAssignment -> RELEASED with release_reason == POLICY_CANCELLATION; then each affected StorageFacility.committed_value_cents is recomputed"
          - "every ExtensionEndorsement with status IN {REQUESTED, RETURNED_FOR_INFO} -> LAPSED"
          - "project.in_force_policy_count is recomputed"

  - entity: ExtensionEndorsement
    initial_state: REQUESTED
    terminal_states: [APPROVED, DECLINED, LAPSED, SUPERSEDED, RESCINDED]
    transitions:
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system: side effect of POST /extension-endorsements creating a newer request for the same policy_id"
        actor: system
        preconditions:
          - "the existing endorsement of that policy_id has status IN {REQUESTED, RETURNED_FOR_INFO}"
        side_effects:
          - "the superseded row keeps its computed additional_premium_cents for audit but never posts a ledger entry"
      - from: REQUESTED
        to: RETURNED_FOR_INFO
        trigger: "POST /extension-endorsements/{id}/return-for-info"
        actor: UnderwritingManager
        preconditions:
          - "endorsement.status == REQUESTED"
          - "X-User-ID != endorsement.requested_by_user_id (segregation of duties)"
        side_effects:
          - "stores info_request_note"
      - from: RETURNED_FOR_INFO
        to: REQUESTED
        trigger: "POST /extension-endorsements/{id}/resubmit"
        actor: Underwriter
        preconditions:
          - "endorsement.status == RETURNED_FOR_INFO"
          - "resubmission_count < 3"
        side_effects:
          - "increments resubmission_count by 1"
          - "overwrites requested_extension_days, slip_reason and revised_completion_date from the request"
          - "recomputes slip_factor and additional_premium_cents (calculations.extension_premium_adjustment) against the policy's state as of this request"
        note: "Revision cycle REQUESTED -> RETURNED_FOR_INFO -> REQUESTED; the fourth resubmission is rejected with ERR_RESUBMISSION_LIMIT_REACHED."
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /extension-endorsements/{id}/decision with decision == APPROVE"
        actor: Underwriter | UnderwritingManager
        preconditions:
          - "endorsement.status == REQUESTED"
          - "policy.status == IN_FORCE"
          - "X-User-ID != endorsement.requested_by_user_id (segregation of duties)"
          - "if additional_premium_cents > 500000 the actor role MUST be UnderwritingManager"
          - "(policy.cumulative_extension_days + requested_extension_days) <= 0.50 * policy.original_term_days"
        side_effects:
          - "hop 1: endorsement.status -> APPROVED, decided_by_user_id stamped, additional_premium_cents frozen"
          - "hop 2: because the endorsement was approved, policy.cumulative_extension_days += requested_extension_days, policy.term_end_date += requested_extension_days days, and policy.adjusted_completion_date is recomputed as project.projected_completion_date + cumulative_extension_days"
          - "hop 3: because policy.cumulative_extension_days changed, project.audit_risk_score is recomputed (calculations.project_risk_score / AUDIT_BASIS)"
          - "hop 4: appends PremiumTransaction { txn_type: EXTENSION_AP, amount_cents: +additional_premium_cents, memo: 'extension approval' } and, because that row was appended, recomputes policy.written_premium_cents"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /extension-endorsements/{id}/decision with decision == DECLINE"
        actor: Underwriter | UnderwritingManager
        preconditions:
          - "endorsement.status == REQUESTED"
          - "X-User-ID != endorsement.requested_by_user_id (segregation of duties)"
        side_effects:
          - "stamps decided_by_user_id; no ledger entry is appended and the policy term is untouched"
      - from: REQUESTED
        to: LAPSED
        trigger: "system: side effect of the policy leaving IN_FORCE (expiry or cancellation)"
        actor: system
        preconditions:
          - "endorsement.status IN {REQUESTED, RETURNED_FOR_INFO}"
        side_effects:
          - "no ledger entry is appended"
      - from: RETURNED_FOR_INFO
        to: LAPSED
        trigger: "system: side effect of the policy leaving IN_FORCE (expiry or cancellation)"
        actor: system
        preconditions:
          - "endorsement.status IN {REQUESTED, RETURNED_FOR_INFO}"
        side_effects:
          - "no ledger entry is appended"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /extension-endorsements/{id}/rescind"
        actor: UnderwritingManager
        preconditions:
          - "endorsement.status == APPROVED"
          - "policy.status == IN_FORCE"
          - "current logical clock < policy.term_end_date"
        side_effects:
          - "appends PremiumTransaction { txn_type: EXTENSION_AP_REVERSAL, amount_cents: -additional_premium_cents, reverses_sequence_no: sequence_no of this endorsement's EXTENSION_AP row, memo: 'extension rescission' }"
          - "because that row was appended, recomputes policy.written_premium_cents"
          - "restores policy.cumulative_extension_days -= requested_extension_days, policy.term_end_date -= requested_extension_days days and policy.adjusted_completion_date"
          - "recomputes project.audit_risk_score"
        note: "Compensating action for the APPROVE transition; see calculations.premium_ledger_balance for the conserved-quantity invariant."

  - entity: Claim
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: ADJUSTED
        axis: adjustment_status
        trigger: "POST /claims/{id}/adjust"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status IN {REPORTED, REOPENED}"
          - "policy.status == IN_FORCE"
          - "coverage conditions of every touched CoveragePart are satisfied"
          - "resulting indemnity_cents > 0"
        side_effects:
          - "computes allocation_lines, indemnity_cents and uncovered_cents (calculations.claim_indemnity_allocation)"
          - "for peril == DELAY, computes delay_days_indemnified (calculations.delay_in_completion_indemnity) instead of using request loss items"
          - "sets adjustment_basis, continuing_pm_weeks, adjusted_by_user_id"
          - "recomputes outstanding_reserve_cents = indemnity_cents - paid_cents and total_incurred_cents"
          - "recomputes project.audit_risk_score (the claim now counts toward the claim-history component)"
      - from: REPORTED
        to: DENIED
        axis: adjustment_status
        trigger: "POST /claims/{id}/adjust"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status IN {REPORTED, REOPENED}"
          - "policy.status == IN_FORCE"
          - "resulting indemnity_cents == 0"
        side_effects:
          - "stores the zero-value allocation_lines and uncovered_cents so the denial is auditable"
          - "recomputes project.audit_risk_score"
        note: "Branch point of the same trigger: a zero indemnity (e.g. delay inside the waiting period) denies rather than adjusts."
      - from: ADJUSTED
        to: ADJUSTED
        axis: adjustment_status
        trigger: "POST /claims/{id}/adjust (re-adjustment with a different basis or loss items)"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == ADJUSTED"
          - "claim.payment_status == UNPAID"
          - "policy.status == IN_FORCE"
        side_effects:
          - "fully replaces allocation_lines, indemnity_cents, uncovered_cents, adjustment_basis and continuing_pm_weeks"
        note: "Self-loop: an unpaid adjustment may be recomputed under the other valuation basis; once any payment is issued the loop is closed. A re-adjustment that recomputes to indemnity_cents == 0 stays ADJUSTED - the DENIED branch is reachable only from REPORTED or REOPENED."
      - from: ADJUSTED
        to: SETTLED
        axis: adjustment_status
        trigger: "POST /claims/{id}/settle"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == ADJUSTED"
          - "claim.indemnity_cents > 0"
        side_effects:
          - "freezes allocation_lines against further re-adjustment; payment_status is untouched by this transition"
      - from: SETTLED
        to: CLOSED
        axis: adjustment_status
        trigger: "system: side effect of a LossPayment that brings paid_cents == indemnity_cents"
        actor: system
        preconditions:
          - "claim.adjustment_status == SETTLED"
          - "claim.payment_status becomes PAID"
        side_effects:
          - "no ledger or coverage change beyond the payment's own side effects"
      - from: CLOSED
        to: SETTLED
        axis: adjustment_status
        trigger: "system: side effect of POST /loss-payments/{id}/void leaving paid_cents < indemnity_cents"
        actor: system
        preconditions:
          - "claim.adjustment_status == CLOSED"
        side_effects:
          - "compensation of the SETTLED -> CLOSED transition"
      - from: CLOSED
        to: REOPENED
        axis: adjustment_status
        trigger: "POST /claims/{id}/reopen"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status IN {CLOSED, DENIED}"
          - "policy.status IN {IN_FORCE, EXPIRED}"
          - "claim.reopen_count < 2"
        side_effects:
          - "increments reopen_count by 1"
      - from: DENIED
        to: REOPENED
        axis: adjustment_status
        trigger: "POST /claims/{id}/reopen"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status IN {CLOSED, DENIED}"
          - "claim.reopen_count < 2"
        side_effects:
          - "increments reopen_count by 1"
      - from: REOPENED
        to: ADJUSTED
        axis: adjustment_status
        trigger: "POST /claims/{id}/adjust"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == REOPENED"
          - "policy.status == IN_FORCE"
        side_effects:
          - "same as REPORTED -> ADJUSTED"
        note: "Closes the reopen cycle: CLOSED/DENIED -> REOPENED -> ADJUSTED."
      - from: UNPAID
        to: PARTIALLY_PAID
        axis: payment_status
        trigger: "POST /loss-payments"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status IN {ADJUSTED, SETTLED}"
          - "0 < resulting paid_cents < claim.indemnity_cents"
        side_effects:
          - "recomputes paid_cents, outstanding_reserve_cents; erodes the CoveragePart matching part_type"
      - from: UNPAID
        to: PAID
        axis: payment_status
        trigger: "POST /loss-payments"
        actor: ClaimAdjuster
        preconditions:
          - "resulting paid_cents == claim.indemnity_cents"
        side_effects:
          - "if adjustment_status == SETTLED, the adjustment axis moves SETTLED -> CLOSED"
      - from: PARTIALLY_PAID
        to: PAID
        axis: payment_status
        trigger: "POST /loss-payments"
        actor: ClaimAdjuster
        preconditions:
          - "resulting paid_cents == claim.indemnity_cents"
        side_effects:
          - "if adjustment_status == SETTLED, the adjustment axis moves SETTLED -> CLOSED"
      - from: PAID
        to: PARTIALLY_PAID
        axis: payment_status
        trigger: "POST /loss-payments/{id}/void"
        actor: UnderwritingManager
        preconditions:
          - "0 < resulting paid_cents < claim.indemnity_cents"
        side_effects:
          - "de-erodes the CoveragePart; if adjustment_status == CLOSED it returns to SETTLED"
      - from: PARTIALLY_PAID
        to: UNPAID
        axis: payment_status
        trigger: "POST /loss-payments/{id}/void"
        actor: UnderwritingManager
        preconditions:
          - "resulting paid_cents == 0"
        side_effects:
          - "de-erodes the CoveragePart"
      - from: PAID
        to: UNPAID
        axis: payment_status
        trigger: "POST /loss-payments/{id}/void"
        actor: UnderwritingManager
        preconditions:
          - "resulting paid_cents == 0"
        side_effects:
          - "hop 1: LossPayment.status ISSUED -> VOIDED, voided_by_user_id stamped"
          - "hop 2: because the payment was voided, claim.paid_cents drops to 0, payment_status PAID -> UNPAID and (if CLOSED) adjustment_status returns to SETTLED"
          - "hop 3: because claim.paid_cents dropped, the CoveragePart matching part_type has eroded_cents reduced by amount_cents and available_cents restored"
          - "hop 4: because that part's erosion changed, policy.eroded_total_cents is recomputed"
        note: "Parallel axes: the payment axis moves without any adjustment-axis trigger, and vice versa."

  - entity: TestingCommissioningNotice
    initial_state: SCHEDULED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /testing-notices/{id}/decision with decision == APPROVE"
        actor: RiskEngineer
        preconditions:
          - "notice.status == SCHEDULED"
          - "if notice.water_charged == true AND the project's IN_FORCE policy has a CoveragePart with part_type == WATER_DAMAGE and condition_code == MITIGATION_PLAN_REQUIRED, then notice.mitigation_plan_ref != null"
        side_effects:
          - "stamps decided_by_user_id"
          - "unlocks the testing/commissioning coverage condition for claims whose loss_date falls in [window_start, window_end)"
      - from: SCHEDULED
        to: REJECTED
        trigger: "POST /testing-notices/{id}/decision with decision == REJECT"
        actor: RiskEngineer
        preconditions:
          - "notice.status == SCHEDULED"
        side_effects:
          - "stores rejection_reason; the coverage condition stays locked"

  - entity: TemporaryStorageAssignment
    initial_state: APPROVED
    terminal_states: [RELEASED]
    transitions:
      - from: APPROVED
        to: RELEASED
        trigger: "POST /storage-assignments/{id}/release"
        actor: Underwriter
        preconditions:
          - "assignment.status == APPROVED"
        side_effects:
          - "stamps released_at from the logical clock and release_reason == MANUAL"
          - "because the assignment stopped occupying the facility, StorageFacility.committed_value_cents is recomputed"
      - from: APPROVED
        to: RELEASED
        trigger: "system: side effect of the policy's CoveragePart rows closing on policy expiry or cancellation"
        actor: system
        preconditions:
          - "assignment.status == APPROVED"
        side_effects:
          - "release_reason == POLICY_EXPIRY or POLICY_CANCELLATION"
          - "StorageFacility.committed_value_cents is recomputed"

  - entity: StorageFacility
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /facilities/{id} with status == SUSPENDED"
        actor: RiskEngineer
        preconditions:
          - "facility.status == ACTIVE"
        side_effects:
          - "existing APPROVED assignments are untouched; new assignments are rejected with ERR_FACILITY_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /facilities/{id} with status == ACTIVE"
        actor: RiskEngineer
        preconditions:
          - "facility.status == SUSPENDED"
        side_effects:
          - "new assignments are accepted again"
        note: "Cycle ACTIVE <-> SUSPENDED; no terminal state."

  - entity: CoveragePart
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system: side effect of the policy leaving IN_FORCE (expiry or cancellation)"
        actor: system
        preconditions:
          - "part.status == ACTIVE"
        side_effects:
          - "eroded_cents and available_cents are frozen at their current values"
          - "because the TEMPORARY_STORAGE part closed, the policy's APPROVED TemporaryStorageAssignment rows are released"

  - entity: NamedInsuredInterest
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /named-insured-interests/{id}/acknowledge"
        actor: LossPayee
        preconditions:
          - "interest.acknowledgment_status == PENDING"
          - "X-User-ID == interest.id (entity_backed ownership)"
          - "policy.status IN {DRAFT, REFERRED, QUOTED}"
        side_effects:
          - "stamps acknowledged_at from the logical clock; unblocks the LENDER acknowledgment precondition of QUOTED -> BOUND"

concurrency_rules:
  - rule_id: policy-create-stale-project
    parent_entity: ConstructionProject
    write_endpoint: "POST /policies"
    occ_field: "expected_project_version"
    description: |
      Creating a BuildersRiskPolicy against a ConstructionProject whose version has advanced since
      the client last observed it is rejected. A new DRAFT submission legitimately supersedes the
      prior DRAFT policy of the same project, so the write cannot be resolved by a state
      precondition: the second writer's project view is simply stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: extension-request-stale-policy
    parent_entity: BuildersRiskPolicy
    write_endpoint: "POST /extension-endorsements"
    occ_field: "expected_policy_version"
    description: |
      Filing an ExtensionEndorsement against a BuildersRiskPolicy whose version has advanced since
      the client last observed it is rejected. A newer request legitimately supersedes an open
      request on the same policy, and approvals silently move term_end_date and
      cumulative_extension_days, so a stale policy view would compute the slip factor and the
      additional premium off obsolete inputs.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
  - rule_id: loss-payment-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /loss-payments"
    occ_field: "expected_claim_version"
    description: |
      Issuing a LossPayment against a Claim whose version has advanced since the client last
      observed it is rejected. Successive partial payments on one claim are legitimate, so nothing
      in the state machine blocks the second writer; the OCC check is what forces the payer to
      re-read paid_cents, outstanding_reserve_cents and the eroded sublimits before drawing again.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

calculations:
  - name: quote_premium
    trigger: "POST /policies/{id}/quote (DRAFT -> QUOTED and DRAFT -> REFERRED); re-applied by POST /policies/{id}/referral-decision APPROVE via the referral load"
    algorithm: tiered_pricing
    formula: |
      # All money is integer cents. Every component is rounded to whole cents INDEPENDENTLY,
      # half-up, and only then summed. Summing unrounded components and rounding once is NOT
      # the rule.
      tiv_cents      = policy.insured_tiv_cents
                     = project.hard_cost_value_cents
                       + (policy.includes_existing_structure ? project.existing_structure_value_cents : 0)
      units          = tiv_cents / 100000                      # exact rational count of $1,000 units
      base_cents     = round_half_up(units * CONSTRUCTION_RATE_PER_1000_CENTS[project.construction_type])
      cat_cents      = round_half_up(base_cents * CAT_LOAD_PCT[project.cat_zone])
      term_months    = ceil(policy.original_term_days / 30)
      duration_cents = round_half_up(base_cents * DURATION_LOAD_PCT_PER_MONTH * max(0, term_months - 12))
      soft_units     = (sum of CoveragePart.sublimit_cents over parts of this policy with
                        part_type IN {SOFT_COST, DELAY_IN_COMPLETION}) / 100000
      soft_cents     = round_half_up(soft_units * SOFT_COST_RATE_PER_1000_CENTS)
      reno_cents     = project.project_kind == RENOVATION
                       ? round_half_up(base_cents * RENOVATION_LOAD_PCT) : 0
      subtotal_cents = base_cents + cat_cents + duration_cents + soft_cents + reno_cents
      credit_cents   = round_half_up(subtotal_cents * DEDUCTIBLE_CREDIT_PCT[policy.deductible_tier])
      before_floor   = subtotal_cents - credit_cents
      quoted_premium_cents = max(MIN_PREMIUM_CENTS, before_floor)      # >= boundary: equality keeps before_floor
      # Referral load, applied only by REFERRED -> QUOTED, to the stored quoted_premium_cents:
      quoted_premium_cents = round_half_up(quoted_premium_cents * (1 + policy.referral_load_pct))
    input_set: "The FK project's submitted values plus every CoveragePart row of this policy regardless of status (at quote time all parts are ACTIVE); no claim or endorsement data participates."
    constants:
      CONSTRUCTION_RATE_PER_1000_CENTS: { FRAME: 210, JOISTED_MASONRY: 150, NON_COMBUSTIBLE: 110, FIRE_RESISTIVE: 80 }
      CAT_LOAD_PCT: { INLAND: 0.00, WIND_TIER_2: 0.18, SEISMIC: 0.25, WIND_TIER_1: 0.35, FLOOD_A: 0.40 }
      DURATION_LOAD_PCT_PER_MONTH: 0.02
      SOFT_COST_RATE_PER_1000_CENTS: 60
      RENOVATION_LOAD_PCT: 0.12
      DEDUCTIBLE_CREDIT_PCT: { STANDARD_25K: 0.00, ELEVATED_100K: 0.06, HIGH_250K: 0.11 }
      MIN_PREMIUM_CENTS: 250000
    precision: "Integer cents throughout; every round_half_up is to 0 decimal places (whole cents)."
    variants:
      - name: NEW_CONSTRUCTION_BASIS
        when: "project.project_kind == NEW_CONSTRUCTION"
        difference: "reno_cents is 0 and includes_existing_structure MUST be false, so tiv_cents ignores existing_structure_value_cents entirely."
      - name: RENOVATION_BASIS
        when: "project.project_kind == RENOVATION"
        difference: "reno_cents adds 12% of base_cents, and when includes_existing_structure is true the pre-existing structure value enters tiv_cents, which raises base_cents, cat_cents, duration_cents and reno_cents together."

  - name: project_risk_score
    trigger: "POST /projects/{id}/screen (SUBMISSION_BASIS); side effect of ExtensionEndorsement REQUESTED -> APPROVED and of Claim adjust transitions (AUDIT_BASIS)"
    algorithm: weighted_scoring
    formula: |
      construction_pts = CONSTRUCTION_PTS[project.construction_type]
      cat_pts          = CAT_PTS[project.cat_zone]
      value_pts        = min(20, floor(tiv_cents / VALUE_PTS_STEP_CENTS))
      duration_pts     = min(15, 2 * max(0, ceil(duration_days / 30) - 12))
      renovation_pts   = project.project_kind == RENOVATION ? 10 : 0
      claim_pts        = min(15, 5 * claim_count)
      score            = min(100, construction_pts + cat_pts + value_pts + duration_pts
                                  + renovation_pts + claim_pts)
      # tiv_cents, duration_days and claim_count are variant-dependent (see variants).
    input_set: "SUBMISSION_BASIS reads only ConstructionProject input fields. AUDIT_BASIS reads the project's single non-terminal policy (status IN {BOUND, IN_FORCE}) plus its Claim rows with adjustment_status IN {ADJUSTED, SETTLED, CLOSED}; claims with adjustment_status IN {REPORTED, DENIED, REOPENED} are excluded, and claims of CANCELLED/EXPIRED policies are excluded."
    constants:
      CONSTRUCTION_PTS: { FRAME: 30, JOISTED_MASONRY: 20, NON_COMBUSTIBLE: 12, FIRE_RESISTIVE: 6 }
      CAT_PTS: { INLAND: 0, WIND_TIER_2: 12, SEISMIC: 18, WIND_TIER_1: 25, FLOOD_A: 30 }
      VALUE_PTS_STEP_CENTS: 500000000
      REFERRAL_THRESHOLD: 75
      INELIGIBLE_THRESHOLD: 90
    precision: "Integer points, 0 decimal places; every intermediate is an integer (floor/ceil as written)."
    variants:
      - name: SUBMISSION_BASIS
        when: "Computed at screening and read by the quote branch (>= 75 refers, >= 90 makes the project INELIGIBLE)."
        difference: "tiv_cents = hard_cost_value_cents + existing_structure_value_cents (the existing structure ALWAYS counts at screening, regardless of what any policy later insures); duration_days = whole days(projected_completion_date - planned_start_date); claim_count = 0 by definition."
      - name: AUDIT_BASIS
        when: "Recomputed after every approved extension and every claim adjustment; read by calculations.extension_premium_adjustment step 5."
        difference: "tiv_cents = policy.insured_tiv_cents (so an uninsured existing structure drops out); duration_days = whole days(policy.adjusted_completion_date - planned_start_date), i.e. realized slip is included; claim_count = number of qualifying Claim rows. Identical project inputs therefore yield a different score from SUBMISSION_BASIS."

  - name: claim_indemnity_allocation
    trigger: "POST /claims/{id}/adjust (REPORTED|REOPENED -> ADJUSTED, ADJUSTED -> ADJUSTED, REPORTED -> DENIED)"
    algorithm: waterfall_allocation
    formula: |
      ALLOCATION_ORDER = [EXISTING_STRUCTURE, MATERIALS_ON_SITE, IN_TRANSIT, TEMPORARY_STORAGE,
                          TESTING_COMMISSIONING, WATER_DAMAGE, SOFT_COST, DELAY_IN_COMPLETION]

      step 1  lines = request loss_items sorted by index_of(part_type) in ALLOCATION_ORDER ASC.
              For peril == DELAY the request carries no loss_items; a single synthetic line
              { part_type: DELAY_IN_COMPLETION,
                gross_loss_cents: calculations.delay_in_completion_indemnity.gross_cents } is used.
      step 2  per line, ROUNDED IMMEDIATELY (round-per-line-then-sum is pinned; sum-then-round is NOT
              the rule and can differ by 1 cent):
                RECONSTRUCTION_COST -> covered_basis_cents = round_half_up(gross_loss_cents * RECONSTRUCTION_UPLIFT)
                ACTUAL_LOSS         -> covered_basis_cents = gross_loss_cents
              DELAY_IN_COMPLETION lines never take the uplift under either basis.
      step 3  continuing project management (RECONSTRUCTION_COST only):
                pm_cents = round_half_up(sum(covered_basis_cents over all lines)
                                         * PM_WEEKLY_PCT * min(continuing_pm_weeks, PM_MAX_WEEKS))
              pm_cents is added to the SOFT_COST line's covered_basis_cents; if the request has no
              SOFT_COST line AND pm_cents > 0, a line { part_type: SOFT_COST, gross_loss_cents: 0,
              covered_basis_cents: pm_cents } is appended at its ALLOCATION_ORDER position. When
              pm_cents == 0 no synthetic line is created, so a RECONSTRUCTION_COST adjustment with
              continuing_pm_weeks == 0 has exactly as many allocation_lines as it had loss_items.
              ACTUAL_LOSS -> pm_cents = 0.
      step 4  occurrence deductible, applied exactly ONCE per adjustment:
                target = line with the greatest covered_basis_cents among lines with
                         part_type != DELAY_IN_COMPLETION;
                tie-break: earliest index_of(part_type) in ALLOCATION_ORDER.
                target.deductible_applied_cents = min(target.covered_basis_cents,
                                                      policy.occurrence_deductible_cents)
                every other line has deductible_applied_cents = 0.
                net_cents(line) = covered_basis_cents - deductible_applied_cents
      step 5  sublimit cap, per line, against the matching CoveragePart of the policy:
                allocated_cents = min(net_cents, part.sublimit_cents - part.eroded_cents)
      step 6  policy aggregate cap, walked in ALLOCATION_ORDER:
                remaining = policy.limit_cents - policy.eroded_total_cents
                            - sum(allocated_cents of lines already walked)
                allocated_cents = min(allocated_cents, max(0, remaining))
      step 7  claim.indemnity_cents = sum(allocated_cents)
              line.uncovered_cents  = net_cents - allocated_cents
              claim.uncovered_cents = sum(line.uncovered_cents) + target.deductible_applied_cents
              claim.outstanding_reserve_cents = indemnity_cents - paid_cents
              claim.total_incurred_cents      = paid_cents + outstanding_reserve_cents
    input_set: "Only CoveragePart rows of the claim's policy with status == ACTIVE participate; a line whose part_type has no ACTIVE part is rejected with ERR_COVERAGE_PART_MISSING. eroded_cents reflects LossPayment rows with status == ISSUED only (VOIDED payments do not erode)."
    constants:
      RECONSTRUCTION_UPLIFT: 1.08
      PM_WEEKLY_PCT: 0.0015
      PM_MAX_WEEKS: 12
    precision: "Integer cents; round_half_up per line in steps 2 and 3, no rounding after step 3."
    variants:
      - name: RECONSTRUCTION_COST
        when: "adjust request basis == RECONSTRUCTION_COST (rebuild-to-code valuation)."
        difference: "Applies the 1.08 reconstruction uplift per line AND indemnifies continuing project management weeks, so the same loss items produce a strictly larger indemnity than ACTUAL_LOSS."
      - name: ACTUAL_LOSS
        when: "adjust request basis == ACTUAL_LOSS (documented invoices only)."
        difference: "No uplift and pm_cents forced to 0; continuing_pm_weeks in the request is stored but ignored, so the indemnity is lower for identical loss items."

  - name: delay_in_completion_indemnity
    trigger: "POST /claims/{id}/adjust when claim.peril == DELAY"
    algorithm: threshold
    formula: |
      baseline_date  = policy.adjusted_completion_date
      actual_date    = project.actual_substantial_completion_date        # null -> ERR_PROJECT_NOT_COMPLETE
      raw_delay_days = max(0, whole_days(actual_date - baseline_date))
      indemnified_days = max(0, raw_delay_days - WAITING_PERIOD_DAYS)    # strict: raw == 5 yields 0
      gross_cents    = indemnified_days * policy.daily_delay_rate_cents
      # gross_cents becomes the single DELAY_IN_COMPLETION line handed to
      # calculations.claim_indemnity_allocation, which caps it at the DELAY_IN_COMPLETION sublimit
      # (and never applies the money deductible to it).
      claim.delay_days_indemnified = indemnified_days
    input_set: "The claim's policy (for adjusted_completion_date and daily_delay_rate_cents) and its FK project (for actual_substantial_completion_date). Approved extensions move baseline_date forward and therefore shrink raw_delay_days; RESCINDED and DECLINED endorsements do not."
    constants:
      WAITING_PERIOD_DAYS: 5
    precision: "Whole days and integer cents; no fractional days (dates are compared as UTC calendar days)."
    variants:
      - name: PRE_EXTENSION_BASELINE
        when: "policy.cumulative_extension_days == 0"
        difference: "baseline_date equals project.projected_completion_date as submitted."
      - name: POST_EXTENSION_BASELINE
        when: "policy.cumulative_extension_days > 0"
        difference: "baseline_date is pushed out by exactly cumulative_extension_days, so an identical actual_substantial_completion_date yields fewer indemnified days."

  - name: extension_premium_adjustment
    trigger: "POST /extension-endorsements (creation) and POST /extension-endorsements/{id}/resubmit; the value is frozen by REQUESTED -> APPROVED"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned because the tier depends on a cumulative figure that already
      # includes the request being priced, and because the daily rate is rounded BEFORE it is
      # multiplied out.
      step 1  cumulative_after = policy.cumulative_extension_days + requested_extension_days
      step 2  ratio  = cumulative_after / policy.original_term_days      # exact rational
              slip_factor = ratio <= 0.10 ? 1.00
                          : ratio <= 0.25 ? 1.15
                          :                 1.40
      step 3  daily_base_cents = round_half_up(policy.quoted_premium_cents / policy.original_term_days)
      step 4  additional_premium_cents = round_half_up(daily_base_cents
                                                       * requested_extension_days * slip_factor)
      step 5  audit = coalesce(project.audit_risk_score, project.submission_risk_score)
              # audit is read as of the START of this request, i.e. it excludes the days being
              # requested here even though step 1 already counted them.
              if audit >= CAT_RESLIP_SCORE_THRESHOLD:
                  additional_premium_cents = round_half_up(additional_premium_cents * CAT_RESLIP_LOAD)
    input_set: "The endorsement's own requested_extension_days plus the policy's cumulative_extension_days over APPROVED endorsements only (SUPERSEDED, DECLINED, LAPSED and RESCINDED endorsements contribute 0), the policy's original_term_days (never re-derived from the extended term_end_date) and quoted_premium_cents (including any referral load)."
    constants:
      SLIP_TIER_1_RATIO: 0.10
      SLIP_TIER_2_RATIO: 0.25
      MAX_CUMULATIVE_EXTENSION_RATIO: 0.50
      SOD_AP_THRESHOLD_CENTS: 500000
      CAT_RESLIP_SCORE_THRESHOLD: 85
      CAT_RESLIP_LOAD: 1.25
    precision: "Integer cents; round_half_up in step 3 and step 4 (and step 5 when it applies). Multiplying an unrounded daily rate would drift from the pinned result."
    variants:
      - name: FIRST_SLIP
        when: "policy.cumulative_extension_days == 0"
        difference: "ratio is driven purely by the requested days, so a request of <= 10% of the original term prices at factor 1.00."
      - name: REPEAT_SLIP
        when: "policy.cumulative_extension_days > 0"
        difference: "ratio includes prior approved days, so an identical requested_extension_days can price at a higher tier than the first request did."

  - name: premium_ledger_balance
    trigger: "Every PremiumTransaction append: bind (INITIAL), extension approval (EXTENSION_AP), extension rescission (EXTENSION_AP_REVERSAL), cancellation (RETURN_PREMIUM)"
    algorithm: aggregation
    formula: |
      policy.written_premium_cents = sum(PremiumTransaction.amount_cents
                                         for rows with policy_id == policy.id)
      # Conserved-quantity invariant (compensating action):
      #   after ExtensionEndorsement APPROVED -> RESCINDED, the ledger holds an EXTENSION_AP row and
      #   an EXTENSION_AP_REVERSAL row whose amounts sum to exactly 0, so
      #   policy.written_premium_cents equals its pre-approval value, and
      #   sum(amount_cents) == policy.written_premium_cents still holds row-for-row.
      # Ordering: sequence_no is assigned 1-based in created_at ASC order per policy_id; the sum is
      # order-independent, but reverses_sequence_no MUST point at a strictly smaller sequence_no.
    input_set: "All PremiumTransaction rows of the policy, no status filter (the ledger is append-only and immutable: rows are never edited or deleted, so reversal rows are the only correction mechanism)."
    constants: {}
    precision: "Integer cents, signed; no rounding (amounts are copied from the calculation that produced them)."

  - name: coverage_erosion_reconciliation
    trigger: "POST /loss-payments (issue) and POST /loss-payments/{id}/void"
    algorithm: aggregation
    formula: |
      for each CoveragePart cp of the policy:
        cp.eroded_cents    = sum(LossPayment.amount_cents
                                 for payments with status == ISSUED, part_type == cp.part_type,
                                 whose claim_id belongs to a Claim with policy_id == cp.policy_id)
        cp.available_cents = cp.sublimit_cents - cp.eroded_cents
      policy.eroded_total_cents = sum(cp.eroded_cents over the policy's CoveragePart rows)
      claim.paid_cents          = sum(LossPayment.amount_cents for ISSUED payments of this claim)
      claim.outstanding_reserve_cents = claim.indemnity_cents - claim.paid_cents
      # Conserved-quantity invariant (compensating action):
      #   issuing then voiding the same payment leaves cp.eroded_cents, cp.available_cents,
      #   policy.eroded_total_cents, claim.paid_cents and claim.outstanding_reserve_cents at exactly
      #   their pre-payment values, and claim.total_incurred_cents == claim.indemnity_cents holds at
      #   every intermediate step.
    input_set: "LossPayment rows with status == ISSUED only; VOIDED rows are retained for audit and contribute 0. Claims in every adjustment_status participate (payments are only reachable from ADJUSTED/SETTLED, but a later reopen does not un-erode)."
    constants: {}
    precision: "Integer cents; no rounding."

  - name: cancellation_return_premium
    trigger: "POST /policies/{id}/cancel (IN_FORCE -> CANCELLED)"
    algorithm: chronological
    formula: |
      total_days    = policy.original_term_days + policy.cumulative_extension_days
      earned_days   = whole_days(cancel_effective_date - policy.term_start_date)   # half-open
      unearned_days = max(0, total_days - earned_days)
      pro_rata_cents = round_half_up(policy.written_premium_cents * unearned_days / total_days)
      # Pinned order: the pro-rata figure is rounded FIRST, then retention and fee apply to it.
      short_rate_cents = max(0, round_half_up(pro_rata_cents * SHORT_RATE_RETENTION_PCT)
                                - SHORT_RATE_FEE_CENTS)
      return_premium_cents = cancel_reason == INSURED_REQUEST ? short_rate_cents : pro_rata_cents
    input_set: "policy.written_premium_cents as of the cancellation request (i.e. including every approved extension AP and every rescission reversal already posted); no claim payments reduce it."
    constants:
      SHORT_RATE_RETENTION_PCT: 0.90
      SHORT_RATE_FEE_CENTS: 25000
    precision: "Integer cents; two round_half_up steps in the pinned order above."
    variants:
      - name: PRO_RATA
        when: "cancel_reason IN {CARRIER_INITIATED, PROJECT_ABANDONED}"
        difference: "The insured gets the full unearned share with no retention and no fee."
      - name: SHORT_RATE
        when: "cancel_reason == INSURED_REQUEST"
        difference: "The carrier keeps 10% of the unearned premium plus a 25000-cent expense fee, so the same term and premium return strictly less."

  - name: facility_overlap_exposure
    trigger: "POST /storage-assignments (before the assignment is created)"
    algorithm: interval_merge
    formula: |
      # Closed-open intervals: two windows overlap iff
      #   existing.window_start < new.window_end AND new.window_start < existing.window_end
      # Touching endpoints (new.window_start == existing.window_end) do NOT overlap, so an
      # adjacent hand-off is always admissible no matter how large the two values are.
      overlapping = TemporaryStorageAssignment rows with facility_id == new.facility_id
                    AND status == APPROVED AND the overlap test above true
      peak_exposure_cents = new.stored_value_cents + sum(overlapping.stored_value_cents)
      reject with ERR_FACILITY_CAPACITY_EXCEEDED when
        peak_exposure_cents > facility.aggregate_capacity_cents            # ">" only: equality passes
      facility.committed_value_cents = sum(stored_value_cents over APPROVED assignments of the facility)
    input_set: "Only TemporaryStorageAssignment rows with status == APPROVED at the same facility_id; RELEASED rows are ignored regardless of their window. Assignments of other policies and other projects count in full (the facility is a shared, cross-aggregate resource)."
    constants:
      MAX_STORAGE_DISTANCE_MILES: 100
    precision: "Integer cents; whole-second datetime comparison, no rounding."

  - name: testing_window_separation
    trigger: "POST /testing-notices (before the notice is created)"
    algorithm: interval_merge
    formula: |
      # Symmetric buffer geometry, which is deliberately NOT the same arithmetic as
      # calculations.facility_overlap_exposure: the buffer inflates both intervals and there is no
      # capacity dimension at all.
      buffer_hours = (new.hot_work OR existing.hot_work) ? HOT_WORK_BUFFER_HOURS : 0
      conflict iff new.window_start < existing.window_end + buffer_hours
              AND existing.window_start < new.window_end + buffer_hours
      candidate_set = TestingCommissioningNotice rows with project_id == new.project_id
                      AND status IN {SCHEDULED, APPROVED}       # REJECTED rows never conflict
      reject the create with ERR_TESTING_WINDOW_CONFLICT when any candidate conflicts.
      # With buffer_hours == 0 the test degenerates to plain half-open overlap, so back-to-back
      # non-hot-work windows (new.window_start == existing.window_end) are admissible.
    input_set: "TestingCommissioningNotice rows of the same project_id with status IN {SCHEDULED, APPROVED}; the notice's own row is excluded because the check runs before creation."
    constants:
      HOT_WORK_BUFFER_HOURS: 24
    precision: "Whole seconds on datetime comparison; buffer added as an exact 24-hour offset."

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the roles declared in §1.7; an unknown role string is treated as unauthenticated, not as a forbidden role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The acting role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 24
    category: auth
    check: "POST /extension-endorsements/{id}/decision with decision == APPROVE requires role UnderwritingManager whenever the endorsement's stored additional_premium_cents exceeds SOD_AP_THRESHOLD_CENTS (500000). This check reads the value frozen at request time, so it runs before any state check: an Underwriter approving a large-AP endorsement fails here even if the endorsement is no longer REQUESTED."
    error_id: ERR_MANAGER_APPROVAL_REQUIRED
    http_status: 403
    applies_to: "POST /extension-endorsements/{id}/decision"
  - priority: 30
    category: existence
    check: "Every id in the request path exists, validated left-to-right; the entity-specific not-found error is returned."
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "all paths carrying an {id} segment (the sibling errors ERR_PROJECT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_ENDORSEMENT_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_FACILITY_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_INTEREST_NOT_FOUND, ERR_COVERAGE_PART_NOT_FOUND, ERR_PAYMENT_NOT_FOUND cover the other collections)"
  - priority: 32
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row: project_id on POST /policies, policy_id on POST /coverage-parts, POST /named-insured-interests, POST /extension-endorsements, POST /storage-assignments and POST /claims, facility_id on POST /storage-assignments, project_id on POST /testing-notices, claim_id and payee_interest_id on POST /loss-payments."
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying an FK in the body"
  - priority: 35
    category: auth
    check: "For entity_backed roles the acting X-User-ID must own the target: ProjectContact may only act on a ConstructionProject whose id equals X-User-ID (and on notices of that project); LossPayee may only acknowledge the NamedInsuredInterest whose id equals X-User-ID and may only read loss payments whose payee_interest_id equals X-User-ID."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /projects/{id}/substantial-completion, POST /testing-notices, POST /named-insured-interests/{id}/acknowledge, GET /loss-payments"
  - priority: 38
    category: auth
    check: "Segregation of duties on X-User-ID: the user recorded as the maker may not be the user who checks the work. POST /policies/{id}/referral-decision rejects an acting user equal to policy.quoted_by_user_id; POST /extension-endorsements/{id}/decision rejects an acting user equal to endorsement.requested_by_user_id; POST /loss-payments/{id}/void rejects an acting user equal to payment.created_by_user_id; POST /claims/{id}/settle rejects an acting user equal to claim.adjusted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /policies/{id}/referral-decision, POST /extension-endorsements/{id}/decision, POST /claims/{id}/settle, POST /loss-payments/{id}/void"
  - priority: 40
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all non-optional fields present, enums within their declared value sets, integers non-negative where declared, requested_extension_days in 1..180, continuing_pm_weeks in 0..12, insurable_interest_pct in 0..100, loss_payee_priority >= 1, loss_items non-empty for every peril except DELAY, and no unknown field values."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 42
    category: business_constraint
    check: "StorageFacility.site_code is unique across all facilities."
    error_id: ERR_DUPLICATE_SITE_CODE
    http_status: 409
    applies_to: "POST /facilities"
  - priority: 45
    category: business_temporal
    check: "Every date pair in the body is coherent before anything is derived from it: planned_start_date < projected_completion_date on POST /projects; term_start_date < term_end_date on POST /policies; window_start < window_end on POST /testing-notices and POST /storage-assignments."
    error_id: ERR_DATE_RANGE_INVALID
    http_status: 422
    applies_to: "POST /projects, POST /policies, POST /testing-notices, POST /storage-assignments"
  - priority: 50
    category: state
    check: "expected_project_version on POST /policies equals the current ConstructionProject.version (see §1.2.1 policy-create-stale-project)."
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /policies"
  - priority: 50
    category: state
    check: "expected_policy_version on POST /extension-endorsements equals the current BuildersRiskPolicy.version (see §1.2.1 extension-request-stale-policy)."
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /extension-endorsements"
  - priority: 50
    category: state
    check: "expected_claim_version on POST /loss-payments equals the current Claim.version (see §1.2.1 loss-payment-stale-claim)."
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /loss-payments"
  - priority: 55
    category: state
    check: "The target BuildersRiskPolicy is in a status from which this trigger is declared in §1.2: quote requires DRAFT; referral-decision requires REFERRED; reopen and bind require QUOTED; incept requires BOUND; cancel requires IN_FORCE. EXPIRED, CANCELLED, DECLINED and SUPERSEDED are terminal and reject every trigger."
    error_id: ERR_INVALID_POLICY_STATE
    http_status: 409
    applies_to: "POST /policies/{id}/quote, POST /policies/{id}/referral-decision, POST /policies/{id}/reopen, POST /policies/{id}/bind, POST /policies/{id}/incept, POST /policies/{id}/cancel"
  - priority: 55
    category: state
    check: "The target ConstructionProject is in a status from which this trigger is declared: screen requires SUBMITTED; substantial-completion requires UNDER_CONSTRUCTION. INELIGIBLE and SUBSTANTIALLY_COMPLETE are terminal."
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /projects/{id}/screen, POST /projects/{id}/substantial-completion"
  - priority: 55
    category: state
    check: "The target Claim is in an adjustment_status from which this trigger is declared: adjust requires REPORTED, REOPENED or ADJUSTED; settle requires ADJUSTED; reopen requires CLOSED or DENIED. The payment_status axis moves only as a side effect and is never a trigger target."
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /claims/{id}/adjust, POST /claims/{id}/settle, POST /claims/{id}/reopen"
  - priority: 55
    category: state
    check: "The target ExtensionEndorsement is in a status from which this trigger is declared: return-for-info and decision require REQUESTED; resubmit requires RETURNED_FOR_INFO; rescind requires APPROVED. DECLINED, LAPSED, SUPERSEDED and RESCINDED are terminal."
    error_id: ERR_INVALID_ENDORSEMENT_STATE
    http_status: 409
    applies_to: "POST /extension-endorsements/{id}/return-for-info, POST /extension-endorsements/{id}/resubmit, POST /extension-endorsements/{id}/decision, POST /extension-endorsements/{id}/rescind"
  - priority: 55
    category: state
    check: "The target TestingCommissioningNotice is SCHEDULED (APPROVED and REJECTED are terminal), the target TemporaryStorageAssignment is APPROVED (RELEASED is terminal), and the target LossPayment is ISSUED (VOIDED is terminal)."
    error_id: ERR_INVALID_NOTICE_STATE
    http_status: 409
    applies_to: "POST /testing-notices/{id}/decision, POST /storage-assignments/{id}/release, POST /loss-payments/{id}/void (the sibling errors ERR_INVALID_ASSIGNMENT_STATE and ERR_INVALID_PAYMENT_STATE carry the latter two)"
  - priority: 55
    category: state
    check: "The target NamedInsuredInterest is PENDING; acknowledging an already ACKNOWLEDGED interest is rejected rather than treated as a no-op."
    error_id: ERR_INVALID_INTEREST_STATE
    http_status: 409
    applies_to: "POST /named-insured-interests/{id}/acknowledge"
  - priority: 60
    category: state
    check: "Loop counters are checked after the state precondition passes: POST /extension-endorsements/{id}/resubmit requires resubmission_count < 3."
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /extension-endorsements/{id}/resubmit"
  - priority: 60
    category: state
    check: "POST /claims/{id}/reopen requires reopen_count < 2."
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /claims/{id}/reopen"
  - priority: 65
    category: state
    check: "Cross-entity state: POST /policies requires the FK project to be ELIGIBLE (a SUBMITTED, INELIGIBLE, UNDER_CONSTRUCTION or SUBSTANTIALLY_COMPLETE project cannot receive a new DRAFT policy); POST /projects/{id}/substantial-completion requires the project to be UNDER_CONSTRUCTION, which only an inception produces."
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /policies, POST /projects/{id}/substantial-completion"
  - priority: 65
    category: state
    check: "Cross-entity state: POST /coverage-parts, PATCH /coverage-parts/{id} and POST /named-insured-interests require the FK policy to be in DRAFT or REFERRED (the coverage schedule and the insured schedule freeze at quote); POST /extension-endorsements and POST /claims require the FK policy to be IN_FORCE; POST /storage-assignments requires the FK policy to be BOUND or IN_FORCE; POST /extension-endorsements/{id}/decision with decision == APPROVE and POST /extension-endorsements/{id}/rescind both require the endorsement's policy to be IN_FORCE (an expired or cancelled policy can neither take on nor give back endorsed days), and rescind additionally requires the current logical clock to be < policy.term_end_date."
    error_id: ERR_INVALID_POLICY_STATE
    http_status: 409
    applies_to: "POST /coverage-parts, PATCH /coverage-parts/{id}, POST /named-insured-interests, POST /extension-endorsements, POST /storage-assignments, POST /claims, POST /extension-endorsements/{id}/decision, POST /extension-endorsements/{id}/rescind"
  - priority: 65
    category: state
    check: "Cross-entity state: POST /storage-assignments requires the FK StorageFacility to be ACTIVE; a SUSPENDED facility accepts no new stored value even when it has spare capacity."
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /storage-assignments"
  - priority: 65
    category: state
    check: "Cross-entity state: POST /loss-payments requires the FK claim to be ADJUSTED or SETTLED (a REPORTED, DENIED, REOPENED or CLOSED claim pays nothing) and requires the claim's policy to be IN_FORCE, EXPIRED or CANCELLED (never DRAFT/QUOTED/BOUND)."
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /loss-payments"
  - priority: 70
    category: business_safety
    check: "A project may carry at most one policy in a live status: POST /policies/{id}/bind is rejected when another policy of the same project_id is already BOUND or IN_FORCE. The DRAFT -> SUPERSEDED cascade prevents duplicate drafts, so this check exists for the bind step only."
    error_id: ERR_ACTIVE_POLICY_EXISTS
    http_status: 409
    applies_to: "POST /policies/{id}/bind"
  - priority: 70
    category: business_safety
    check: "POST /policies with includes_existing_structure == true requires project.project_kind == RENOVATION and project.existing_structure_value_cents > 0; a NEW_CONSTRUCTION project has no existing structure to insure."
    error_id: ERR_EXISTING_STRUCTURE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /policies"
  - priority: 70
    category: business_safety
    check: "POST /coverage-parts with part_type == EXISTING_STRUCTURE requires policy.includes_existing_structure == true; POST /coverage-parts with part_type == DELAY_IN_COMPLETION requires policy.daily_delay_rate_cents > 0."
    error_id: ERR_COVERAGE_PART_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /coverage-parts"
  - priority: 75
    category: business_safety
    check: "POST /testing-notices with water_charged == true or hot_work == true requires mitigation_plan_ref to be present when project.engineering_grade is C or D; grades A and B may schedule without one."
    error_id: ERR_MITIGATION_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /testing-notices"
  - priority: 75
    category: business_safety
    check: "POST /policies/{id}/bind requires the insured schedule to be complete and agreed: every NamedInsuredInterest of the policy is ACKNOWLEDGED, at least one interest has party_role == OWNER, and the sum of insurable_interest_pct over the interests with party_role IN {OWNER, GENERAL_CONTRACTOR} equals exactly 100. An unacknowledged loss payee, a missing owner and a schedule that does not add up to 100 all return this error."
    error_id: ERR_INTERESTS_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /policies/{id}/bind"
  - priority: 80
    category: business_temporal
    check: "POST /testing-notices is rejected when its window conflicts with any SCHEDULED or APPROVED notice of the same project under calculations.testing_window_separation (a symmetric 24-hour buffer whenever either notice has hot_work == true; plain half-open overlap otherwise, so exactly-adjacent non-hot-work windows are admissible)."
    error_id: ERR_TESTING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /testing-notices"
  - priority: 80
    category: business_temporal
    check: "POST /storage-assignments requires window_start >= policy.term_start_date and window_end <= policy.adjusted_completion_date; material may not sit in temporary storage outside the period the policy actually covers."
    error_id: ERR_WINDOW_OUTSIDE_POLICY_TERM
    http_status: 422
    applies_to: "POST /storage-assignments"
  - priority: 82
    category: business_temporal
    check: "POST /claims requires loss_date >= policy.term_start_date and loss_date <= policy.term_end_date (both bounds inclusive, evaluated against the term_end_date as extended by approved endorsements)."
    error_id: ERR_LOSS_DATE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /claims"
  - priority: 84
    category: business_temporal
    check: "POST /policies/{id}/cancel requires cancel_effective_date > policy.term_start_date and <= policy.term_end_date, and requires it to be >= the current logical clock date; a back-dated cancellation before inception is rejected."
    error_id: ERR_CANCEL_DATE_INVALID
    http_status: 422
    applies_to: "POST /policies/{id}/cancel"
  - priority: 86
    category: business_temporal
    check: "POST /extension-endorsements requires revised_completion_date to equal policy.adjusted_completion_date plus requested_extension_days exactly; the client-supplied date must reconcile with the day count it is priced from."
    error_id: ERR_REVISED_DATE_MISMATCH
    http_status: 422
    applies_to: "POST /extension-endorsements, POST /extension-endorsements/{id}/resubmit"
  - priority: 90
    category: business_constraint
    check: "POST /coverage-parts is rejected when the policy already has a CoveragePart with the same part_type in any status."
    error_id: ERR_DUPLICATE_COVERAGE_PART
    http_status: 409
    applies_to: "POST /coverage-parts"
  - priority: 90
    category: business_constraint
    check: "The sum of CoveragePart.sublimit_cents over the policy's ACTIVE parts, including the row being created or the new value being patched, must not exceed policy.limit_cents. Each sublimit is individually admissible; only the collective total trips this rule."
    error_id: ERR_SUBLIMIT_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /coverage-parts, PATCH /coverage-parts/{id}"
  - priority: 90
    category: business_constraint
    check: "POST /named-insured-interests: the sum of insurable_interest_pct over the policy's interests including the new row must not exceed 100, and loss_payee_priority must be unique within the policy (ERR_DUPLICATE_PAYEE_PRIORITY, 409)."
    error_id: ERR_INTEREST_PCT_EXCEEDED
    http_status: 422
    applies_to: "POST /named-insured-interests"
  - priority: 90
    category: business_constraint
    check: "POST /storage-assignments requires facility.distance_from_site_miles <= MAX_STORAGE_DISTANCE_MILES (100)."
    error_id: ERR_FACILITY_TOO_DISTANT
    http_status: 422
    applies_to: "POST /storage-assignments"
  - priority: 92
    category: business_constraint
    check: "POST /extension-endorsements and POST /extension-endorsements/{id}/resubmit are rejected when (policy.cumulative_extension_days + requested_extension_days) / policy.original_term_days > MAX_CUMULATIVE_EXTENSION_RATIO (0.50); a project that has slipped more than half its original term must be re-underwritten, not endorsed."
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /extension-endorsements, POST /extension-endorsements/{id}/resubmit"
  - priority: 95
    category: business_constraint
    check: "POST /claims/{id}/adjust rejects two loss_items with the same part_type in one request."
    error_id: ERR_DUPLICATE_LOSS_ITEM
    http_status: 422
    applies_to: "POST /claims/{id}/adjust"
  - priority: 95
    category: business_referential
    check: "Every loss_items[].part_type on POST /claims/{id}/adjust must match an ACTIVE CoveragePart of the claim's policy; a part that was never scheduled, or that closed when the policy left IN_FORCE, cannot absorb an allocation."
    error_id: ERR_COVERAGE_PART_MISSING
    http_status: 422
    applies_to: "POST /claims/{id}/adjust"
  - priority: 96
    category: business_referential
    check: "POST /claims/{id}/adjust with claim.peril == DELAY requires project.actual_substantial_completion_date to be set (the project must be SUBSTANTIALLY_COMPLETE) and requires the policy to have an ACTIVE DELAY_IN_COMPLETION part."
    error_id: ERR_PROJECT_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /claims/{id}/adjust"
  - priority: 97
    category: business_referential
    check: "POST /claims/{id}/adjust with a TESTING_COMMISSIONING loss item, or with claim.peril == TESTING_FAILURE, requires an APPROVED TestingCommissioningNotice of the same project whose window contains claim.loss_date; a SCHEDULED or REJECTED notice does not satisfy the coverage condition."
    error_id: ERR_TESTING_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{id}/adjust"
  - priority: 97
    category: business_referential
    check: "POST /claims/{id}/adjust with a TEMPORARY_STORAGE loss item requires a TemporaryStorageAssignment of the same policy whose window contains claim.loss_date and whose status was APPROVED at that date; goods released before the loss are not covered at the storage location."
    error_id: ERR_STORAGE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /claims/{id}/adjust"
  - priority: 100
    category: business_referential
    check: "POST /loss-payments requires payee_interest_id to reference a NamedInsuredInterest whose policy_id equals the claim's policy_id; paying a loss payee attached to a different policy is rejected before any money check runs."
    error_id: ERR_PAYEE_NOT_ON_POLICY
    http_status: 422
    applies_to: "POST /loss-payments"
  - priority: 102
    category: business_referential
    check: "POST /loss-payments requires part_type to appear in claim.allocation_lines with allocated_cents > 0; a part that received no allocation cannot be paid."
    error_id: ERR_PAYMENT_PART_NOT_ALLOCATED
    http_status: 422
    applies_to: "POST /loss-payments"
  - priority: 110
    category: business_fiscal
    check: "POST /storage-assignments is rejected when the facility's peak overlapping exposure including the new assignment exceeds facility.aggregate_capacity_cents per calculations.facility_overlap_exposure; equality with the capacity passes."
    error_id: ERR_FACILITY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /storage-assignments"
  - priority: 112
    category: business_fiscal
    check: "POST /loss-payments: amount_cents must not exceed the allocated_cents of the matching claim.allocation_lines entry minus what ISSUED payments have already paid against that part_type on this claim."
    error_id: ERR_PAYMENT_EXCEEDS_ALLOCATION
    http_status: 422
    applies_to: "POST /loss-payments"
  - priority: 114
    category: business_fiscal
    check: "POST /loss-payments: amount_cents must not exceed claim.indemnity_cents - claim.paid_cents (the outstanding reserve), and must not exceed the target CoveragePart's available_cents."
    error_id: ERR_PAYMENT_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "POST /loss-payments"

endpoints:
  # ---- ConstructionProject -------------------------------------------------
  - method: POST
    path: "/builders-risk/projects"
    description: "Submit a construction project for builders risk underwriting. Lands in SUBMITTED with no risk score."
    roles: [Underwriter, UnderwritingManager]
    code: 201
    input: [name, site_address, construction_type, project_kind, hard_cost_value_cents, "existing_structure_value_cents?", cat_zone, planned_start_date, projected_completion_date]
    output: ConstructionProject
    side_effects:
      - "sets status = SUBMITTED, version = 1, submission_risk_score = null, audit_risk_score = null, in_force_policy_count = 0"
      - "existing_structure_value_cents defaults to 0 when omitted"
  - method: POST
    path: "/builders-risk/projects/{id}/screen"
    description: "Risk-engineering screening: records the engineering grade and computes the SUBMISSION_BASIS risk score, which decides eligibility."
    roles: [RiskEngineer]
    code: 200
    input: [engineering_grade, "loss_control_report_ref?"]
    output: ConstructionProject
    side_effects:
      - "computes calculations.project_risk_score variant SUBMISSION_BASIS into submission_risk_score"
      - "sets status = INELIGIBLE when submission_risk_score >= 90, else ELIGIBLE"
      - "sets screened_by_user_id = X-User-ID; increments version by 1"
  - method: POST
    path: "/builders-risk/projects/{id}/substantial-completion"
    description: "Declare substantial completion; required before any DELAY claim can be adjusted."
    roles: [ProjectContact, Underwriter]
    code: 200
    input: [actual_substantial_completion_date]
    output: ConstructionProject
    side_effects:
      - "sets actual_substantial_completion_date and status = SUBSTANTIALLY_COMPLETE; increments version by 1"
  - method: GET
    path: "/builders-risk/projects/{id}"
    description: "Read one construction project including both risk scores."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster, ProjectContact]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: []
  - method: GET
    path: "/builders-risk/projects"
    description: "List construction projects with optional filters and offset pagination."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: ["status?", "cat_zone?", "project_kind?", "limit?", "offset?"]
    output: ConstructionProject[]
    side_effects: []
  - method: GET
    path: "/builders-risk/projects/{id}/policies"
    description: "Reverse lookup for BuildersRiskPolicy.project_id: every policy ever written on this project, including SUPERSEDED drafts."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BuildersRiskPolicy[]
    side_effects: []
  - method: GET
    path: "/builders-risk/projects/{id}/testing-notices"
    description: "Reverse lookup for TestingCommissioningNotice.project_id."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ProjectContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TestingCommissioningNotice[]
    side_effects: []
  # ---- BuildersRiskPolicy --------------------------------------------------
  - method: POST
    path: "/builders-risk/policies"
    description: "Create a DRAFT policy on an ELIGIBLE project. OCC-guarded on the parent project's version; creating a newer draft supersedes any existing DRAFT of the same project."
    roles: [Underwriter]
    code: 201
    input: [project_id, expected_project_version, term_start_date, term_end_date, "includes_existing_structure?", deductible_tier, limit_cents, daily_delay_rate_cents]
    output: BuildersRiskPolicy
    side_effects:
      - "rejects with ERR_STALE_PROJECT_VERSION (412) when expected_project_version != ConstructionProject.version"
      - "computes original_term_days = whole days(term_end_date - term_start_date), adjusted_completion_date = project.projected_completion_date, cumulative_extension_days = 0"
      - "computes insured_tiv_cents and occurrence_deductible_cents from deductible_tier (STANDARD_25K -> 2500000, ELEVATED_100K -> 10000000, HIGH_250K -> 25000000)"
      - "transitions any existing DRAFT policy of the same project_id to SUPERSEDED"
      - "increments ConstructionProject.version by 1"
  - method: POST
    path: "/builders-risk/policies/{id}/quote"
    description: "Rate the draft: computes the premium and branches to QUOTED or REFERRED on the project's submission risk score."
    roles: [Underwriter]
    code: 200
    input: []
    output: BuildersRiskPolicy
    side_effects:
      - "computes calculations.quote_premium into quoted_premium_cents"
      - "sets status = REFERRED when project.submission_risk_score >= 75, else QUOTED"
      - "sets quoted_by_user_id = X-User-ID; increments version by 1"
  - method: POST
    path: "/builders-risk/policies/{id}/referral-decision"
    description: "Underwriting-manager disposition of a REFERRED policy; APPROVE may attach a referral load that re-prices the stored premium."
    roles: [UnderwritingManager]
    code: 200
    input: [decision, "referral_load_pct?"]
    output: BuildersRiskPolicy
    side_effects:
      - "APPROVE: sets referral_load_pct (default 0), re-applies the referral-load step of calculations.quote_premium to quoted_premium_cents, status = QUOTED"
      - "DECLINE: status = DECLINED (terminal), quoted_premium_cents left as rated"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == quoted_by_user_id; increments version by 1"
  - method: POST
    path: "/builders-risk/policies/{id}/reopen"
    description: "Return a QUOTED policy to DRAFT so the coverage schedule can be edited and re-rated."
    roles: [Underwriter]
    code: 200
    input: []
    output: BuildersRiskPolicy
    side_effects:
      - "sets status = DRAFT, quoted_premium_cents = null, quoted_by_user_id = null; referral_load_pct is preserved; increments version by 1"
  - method: POST
    path: "/builders-risk/policies/{id}/bind"
    description: "Bind the quoted policy: writes the premium and opens the append-only premium ledger."
    roles: [Underwriter]
    code: 200
    input: []
    output: BuildersRiskPolicy
    side_effects:
      - "sets status = BOUND, bound_at = current logical clock, written_premium_cents = quoted_premium_cents"
      - "appends PremiumTransaction { sequence_no: 1, txn_type: INITIAL, amount_cents: quoted_premium_cents, effective_date: term_start_date }"
      - "increments version by 1"
  - method: POST
    path: "/builders-risk/policies/{id}/incept"
    description: "Incept coverage; the project starts construction as a bubble-up side effect."
    roles: [Underwriter]
    code: 200
    input: []
    output: BuildersRiskPolicy
    side_effects:
      - "sets status = IN_FORCE; increments version by 1"
      - "transitions the FK ConstructionProject from ELIGIBLE to UNDER_CONSTRUCTION and sets in_force_policy_count = 1; increments ConstructionProject.version by 1"
  - method: POST
    path: "/builders-risk/policies/{id}/cancel"
    description: "Cancel an in-force policy mid-term, returning unearned premium on a pro-rata or short-rate basis, and cascading closure to every dependent record."
    roles: [UnderwritingManager]
    code: 200
    input: [cancel_reason, cancel_effective_date]
    output: BuildersRiskPolicy
    side_effects:
      - "computes calculations.cancellation_return_premium into return_premium_cents"
      - "appends PremiumTransaction { txn_type: RETURN_PREMIUM, amount_cents: -return_premium_cents, effective_date: cancel_effective_date } and reduces written_premium_cents by the same amount"
      - "sets status = CANCELLED, cancel_reason, cancel_effective_date; increments version by 1"
      - "cascade: every ACTIVE CoveragePart of the policy -> CLOSED; every APPROVED TemporaryStorageAssignment -> RELEASED with release_reason = POLICY_CANCELLATION; every REQUESTED or RETURNED_FOR_INFO ExtensionEndorsement -> LAPSED"
      - "sets ConstructionProject.in_force_policy_count = 0"
  - method: GET
    path: "/builders-risk/policies/{id}"
    description: "Read one policy including derived premium and erosion totals."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster]
    code: 200
    input: []
    output: BuildersRiskPolicy
    side_effects: []
  - method: GET
    path: "/builders-risk/policies"
    description: "List policies with optional project and status filters."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: BuildersRiskPolicy[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/coverage-parts"
    description: "Reverse lookup for CoveragePart.policy_id: the coverage schedule with live erosion figures."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster]
    code: 200
    input: ["status?", "part_type?", "limit?", "offset?"]
    output: CoveragePart[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/named-insured-interests"
    description: "Reverse lookup for NamedInsuredInterest.policy_id: owner, contractor and lender interests with loss-payee ordering."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster]
    code: 200
    input: ["party_role?", "acknowledgment_status?", "limit?", "offset?"]
    output: NamedInsuredInterest[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/extension-endorsements"
    description: "Reverse lookup for ExtensionEndorsement.policy_id."
    roles: [Underwriter, UnderwritingManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExtensionEndorsement[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/claims"
    description: "Reverse lookup for Claim.policy_id."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster]
    code: 200
    input: ["adjustment_status?", "peril?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/premium-transactions"
    description: "Reverse lookup for PremiumTransaction.policy_id: the immutable premium ledger in sequence_no order."
    roles: [Underwriter, UnderwritingManager]
    code: 200
    input: ["txn_type?", "limit?", "offset?"]
    output: PremiumTransaction[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/storage-assignments"
    description: "Reverse lookup for TemporaryStorageAssignment.policy_id."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TemporaryStorageAssignment[]
    side_effects: []
  - method: GET
    path: "/builders-risk/policies/{id}/premium-summary"
    description: "Computed read reconciling the policy's premium ledger against its derived fields. ledger_sum_cents is the signed sum of every PremiumTransaction row of the policy, transaction_count is the number of those rows, extension_ap_total_cents is the signed sum of the EXTENSION_AP and EXTENSION_AP_REVERSAL rows only, return_premium_cents mirrors policy.return_premium_cents and reads 0 while the policy is not CANCELLED, and balanced is (ledger_sum_cents == written_premium_cents)."
    roles: [Underwriter, UnderwritingManager]
    code: 200
    input: []
    output: { quoted_premium_cents: integer, written_premium_cents: integer, ledger_sum_cents: integer, transaction_count: integer, extension_ap_total_cents: integer, return_premium_cents: integer, balanced: boolean }
    side_effects: []
  # ---- CoveragePart --------------------------------------------------------
  - method: POST
    path: "/builders-risk/coverage-parts"
    description: "Schedule one coverage part with its sublimit and any coverage condition. Only editable while the policy is DRAFT or REFERRED."
    roles: [Underwriter]
    code: 201
    input: [policy_id, part_type, sublimit_cents, "condition_code?"]
    output: CoveragePart
    side_effects:
      - "condition_code defaults to NONE; status = ACTIVE; eroded_cents = 0; available_cents = sublimit_cents"
      - "increments BuildersRiskPolicy.version by 1"
  - method: PATCH
    path: "/builders-risk/coverage-parts/{id}"
    description: "Adjust a scheduled sublimit or condition before the policy is quoted."
    roles: [Underwriter]
    code: 200
    input: ["sublimit_cents?", "condition_code?"]
    output: CoveragePart
    side_effects:
      - "recomputes available_cents = sublimit_cents - eroded_cents; increments version by 1"
  - method: GET
    path: "/builders-risk/coverage-parts/{id}"
    description: "Read one coverage part with its erosion and remaining availability."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster]
    code: 200
    input: []
    output: CoveragePart
    side_effects: []
  # ---- NamedInsuredInterest ------------------------------------------------
  - method: POST
    path: "/builders-risk/named-insured-interests"
    description: "Add an owner, general contractor, subcontractor or lender to the named insured schedule, optionally with a loss-payee priority."
    roles: [Underwriter]
    code: 201
    input: [policy_id, party_name, party_role, insurable_interest_pct, "loss_payee_priority?"]
    output: NamedInsuredInterest
    side_effects:
      - "sets acknowledgment_status = PENDING; increments BuildersRiskPolicy.version by 1"
  - method: POST
    path: "/builders-risk/named-insured-interests/{id}/acknowledge"
    description: "The named party acknowledges its interest. X-User-ID must equal the interest id (identity entity_backed:NamedInsuredInterest)."
    roles: [LossPayee]
    code: 200
    input: []
    output: NamedInsuredInterest
    side_effects:
      - "sets acknowledgment_status = ACKNOWLEDGED and acknowledged_at = current logical clock; increments version by 1"
  - method: GET
    path: "/builders-risk/named-insured-interests/{id}"
    description: "Read one named insured interest."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster, LossPayee]
    code: 200
    input: []
    output: NamedInsuredInterest
    side_effects: []
  # ---- ExtensionEndorsement ------------------------------------------------
  - method: POST
    path: "/builders-risk/extension-endorsements"
    description: "Request a project-extension endorsement for schedule slip. OCC-guarded on the parent policy's version; a newer request supersedes any open one."
    roles: [Underwriter]
    code: 201
    input: [policy_id, expected_policy_version, requested_extension_days, slip_reason, revised_completion_date]
    output: ExtensionEndorsement
    side_effects:
      - "rejects with ERR_STALE_POLICY_VERSION (412) when expected_policy_version != BuildersRiskPolicy.version"
      - "computes calculations.extension_premium_adjustment into slip_factor and additional_premium_cents (quoted, not yet posted)"
      - "sets status = REQUESTED, requested_by_user_id = X-User-ID, resubmission_count = 0"
      - "transitions any REQUESTED or RETURNED_FOR_INFO endorsement of the same policy_id to SUPERSEDED"
      - "increments BuildersRiskPolicy.version by 1"
  - method: POST
    path: "/builders-risk/extension-endorsements/{id}/return-for-info"
    description: "Send a request back to the underwriter for more schedule evidence."
    roles: [UnderwritingManager]
    code: 200
    input: [info_request_note]
    output: ExtensionEndorsement
    side_effects:
      - "sets status = RETURNED_FOR_INFO and info_request_note; increments version by 1"
  - method: POST
    path: "/builders-risk/extension-endorsements/{id}/resubmit"
    description: "Resubmit a returned request with revised days; the premium adjustment is recomputed from scratch."
    roles: [Underwriter]
    code: 200
    input: [requested_extension_days, revised_completion_date, "slip_reason?"]
    output: ExtensionEndorsement
    side_effects:
      - "increments resubmission_count by 1 (rejected with ERR_RESUBMISSION_LIMIT_REACHED once it reaches 3)"
      - "recomputes calculations.extension_premium_adjustment into slip_factor and additional_premium_cents"
      - "sets status = REQUESTED; increments version by 1"
  - method: POST
    path: "/builders-risk/extension-endorsements/{id}/decision"
    description: "Approve or decline an extension request. APPROVE posts the additional premium and pushes every downstream date. UnderwritingManager is mandatory once additional_premium_cents exceeds 500000."
    roles: [Underwriter, UnderwritingManager]
    code: 200
    input: [decision]
    output: ExtensionEndorsement
    side_effects:
      - "APPROVE: status = APPROVED, decided_by_user_id = X-User-ID"
      - "APPROVE cascade hop 1: policy.cumulative_extension_days += requested_extension_days; policy.term_end_date += requested_extension_days; policy.adjusted_completion_date = revised_completion_date"
      - "APPROVE cascade hop 2: appends PremiumTransaction { txn_type: EXTENSION_AP, amount_cents: additional_premium_cents, effective_date: the pre-extension term_end_date } and adds it to policy.written_premium_cents"
      - "APPROVE cascade hop 3: recomputes calculations.project_risk_score variant AUDIT_BASIS into project.audit_risk_score"
      - "APPROVE cascade hop 4: increments BuildersRiskPolicy.version and ConstructionProject.version by 1 each"
      - "DECLINE: status = DECLINED with no ledger row and no date movement"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == requested_by_user_id"
  - method: POST
    path: "/builders-risk/extension-endorsements/{id}/rescind"
    description: "Compensating action: unwind an approved extension, reversing every side effect including the ledger entry."
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: ExtensionEndorsement
    side_effects:
      - "sets status = RESCINDED"
      - "reverses hop 1: policy.cumulative_extension_days -= requested_extension_days; policy.term_end_date -= requested_extension_days; policy.adjusted_completion_date -= requested_extension_days"
      - "reverses hop 2: appends PremiumTransaction { txn_type: EXTENSION_AP_REVERSAL, amount_cents: -additional_premium_cents, reverses_sequence_no: the EXTENSION_AP row's sequence_no } and subtracts it from policy.written_premium_cents"
      - "reverses hop 3: recomputes project.audit_risk_score on the restored dates"
      - "increments BuildersRiskPolicy.version and ConstructionProject.version by 1 each"
  - method: GET
    path: "/builders-risk/extension-endorsements/{id}"
    description: "Read one extension endorsement with its priced slip factor and additional premium."
    roles: [Underwriter, UnderwritingManager]
    code: 200
    input: []
    output: ExtensionEndorsement
    side_effects: []
  # ---- Claim ---------------------------------------------------------------
  - method: POST
    path: "/builders-risk/claims"
    description: "First notice of loss against an in-force policy."
    roles: [ClaimAdjuster]
    code: 201
    input: [policy_id, peril, loss_date, description]
    output: Claim
    side_effects:
      - "sets adjustment_status = REPORTED, payment_status = UNPAID, reported_at = current logical clock, all money fields 0, reopen_count = 0"
  - method: POST
    path: "/builders-risk/claims/{id}/adjust"
    description: "Adjust the claim: choose the valuation basis, supply the loss items, and let the waterfall allocate indemnity across sublimits. outcome = DENY produces a zero-indemnity denial."
    roles: [ClaimAdjuster]
    code: 200
    input: [outcome, "adjustment_basis?", "continuing_pm_weeks?", "loss_items?"]
    output: Claim
    side_effects:
      - "outcome = ADJUST: runs calculations.claim_indemnity_allocation (and calculations.delay_in_completion_indemnity first when peril == DELAY), writing allocation_lines, indemnity_cents, uncovered_cents, delay_days_indemnified, outstanding_reserve_cents, total_incurred_cents, adjustment_basis, continuing_pm_weeks (default 0), adjustment_status = ADJUSTED, adjusted_by_user_id = X-User-ID"
      - "outcome = DENY: adjustment_status = DENIED with indemnity_cents = 0 and allocation_lines = []"
      - "recomputes calculations.project_risk_score variant AUDIT_BASIS into project.audit_risk_score and increments ConstructionProject.version by 1"
      - "increments version by 1"
  - method: POST
    path: "/builders-risk/claims/{id}/settle"
    description: "Agree the adjusted indemnity so payments may be issued."
    roles: [ClaimAdjuster, UnderwritingManager]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "sets adjustment_status = SETTLED; rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == adjusted_by_user_id; increments version by 1"
  - method: POST
    path: "/builders-risk/claims/{id}/reopen"
    description: "Reopen a closed or denied claim for re-adjustment; capped at 2 reopenings."
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "sets adjustment_status = REOPENED and increments reopen_count by 1 (rejected with ERR_REOPEN_LIMIT_REACHED once it reaches 2); paid_cents and part erosion are untouched; increments version by 1"
  - method: GET
    path: "/builders-risk/claims/{id}"
    description: "Read one claim with its allocation lines and incurred figures."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/builders-risk/claims"
    description: "List claims with optional policy, peril and status filters."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster]
    code: 200
    input: ["policy_id?", "peril?", "adjustment_status?", "payment_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  # ---- LossPayment ---------------------------------------------------------
  - method: POST
    path: "/builders-risk/loss-payments"
    description: "Issue an indemnity payment to a named loss payee against one coverage part. OCC-guarded on the parent claim's version."
    roles: [ClaimAdjuster]
    code: 201
    input: [claim_id, expected_claim_version, payee_interest_id, part_type, amount_cents]
    output: LossPayment
    side_effects:
      - "rejects with ERR_STALE_CLAIM_VERSION (412) when expected_claim_version != Claim.version"
      - "sets status = ISSUED, created_by_user_id = X-User-ID"
      - "cascade hop 1: recomputes calculations.coverage_erosion_reconciliation, raising CoveragePart.eroded_cents and lowering available_cents for the matching part_type"
      - "cascade hop 2: raises policy.eroded_total_cents and claim.paid_cents, lowering claim.outstanding_reserve_cents"
      - "cascade hop 3: moves claim.payment_status UNPAID -> PARTIALLY_PAID, or straight to PAID when paid_cents == indemnity_cents"
      - "cascade hop 4: when payment_status becomes PAID, moves claim.adjustment_status SETTLED -> CLOSED"
      - "increments Claim.version and BuildersRiskPolicy.version by 1 each"
  - method: POST
    path: "/builders-risk/loss-payments/{id}/void"
    description: "Compensating action: void an issued payment, un-eroding every sublimit and reopening the settlement if the claim had closed."
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: LossPayment
    side_effects:
      - "sets status = VOIDED, voided_by_user_id = X-User-ID"
      - "reverses the erosion: CoveragePart.eroded_cents, available_cents, policy.eroded_total_cents, claim.paid_cents and claim.outstanding_reserve_cents all return to their pre-payment values"
      - "moves claim.payment_status PAID -> PARTIALLY_PAID or PARTIALLY_PAID -> UNPAID as the remaining ISSUED payments dictate"
      - "moves claim.adjustment_status CLOSED -> SETTLED when paid_cents falls below indemnity_cents"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == created_by_user_id"
      - "increments Claim.version and BuildersRiskPolicy.version by 1 each"
  - method: GET
    path: "/builders-risk/loss-payments"
    description: "Reverse lookup for both LossPayment.claim_id and LossPayment.payee_interest_id; a LossPayee may only filter on its own payee_interest_id."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster, LossPayee]
    code: 200
    input: ["claim_id?", "payee_interest_id?", "status?", "limit?", "offset?"]
    output: LossPayment[]
    side_effects: []
  - method: GET
    path: "/builders-risk/loss-payments/{id}"
    description: "Read one loss payment."
    roles: [Underwriter, UnderwritingManager, ClaimAdjuster, LossPayee]
    code: 200
    input: []
    output: LossPayment
    side_effects: []
  # ---- TestingCommissioningNotice ------------------------------------------
  - method: POST
    path: "/builders-risk/testing-notices"
    description: "Schedule a testing or commissioning window; the coverage condition for testing perils depends on this notice being approved."
    roles: [ProjectContact, RiskEngineer]
    code: 201
    input: [project_id, system_type, window_start, window_end, "hot_work?", "water_charged?", "mitigation_plan_ref?"]
    output: TestingCommissioningNotice
    side_effects:
      - "hot_work and water_charged default to false; status = SCHEDULED"
      - "rejects with ERR_TESTING_WINDOW_CONFLICT (409) per calculations.testing_window_separation"
  - method: POST
    path: "/builders-risk/testing-notices/{id}/decision"
    description: "Risk engineering approves or rejects the scheduled window."
    roles: [RiskEngineer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: TestingCommissioningNotice
    side_effects:
      - "APPROVE: status = APPROVED; REJECT: status = REJECTED with rejection_reason"
      - "sets decided_by_user_id = X-User-ID; increments version by 1"
  - method: GET
    path: "/builders-risk/testing-notices/{id}"
    description: "Read one testing and commissioning notice."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster, ProjectContact]
    code: 200
    input: []
    output: TestingCommissioningNotice
    side_effects: []
  # ---- StorageFacility -----------------------------------------------------
  - method: POST
    path: "/builders-risk/facilities"
    description: "Register an off-site temporary storage facility with its aggregate capacity."
    roles: [RiskEngineer]
    code: 201
    input: [name, site_code, distance_from_site_miles, aggregate_capacity_cents, protection_class]
    output: StorageFacility
    side_effects:
      - "sets status = ACTIVE and committed_value_cents = 0; rejects a duplicate site_code with ERR_DUPLICATE_SITE_CODE (409)"
  - method: PATCH
    path: "/builders-risk/facilities/{id}"
    description: "Suspend or reinstate a storage facility; a SUSPENDED facility accepts no new assignments but keeps its existing ones."
    roles: [RiskEngineer]
    code: 200
    input: [status]
    output: StorageFacility
    side_effects:
      - "sets status to SUSPENDED or ACTIVE; existing APPROVED assignments are untouched; increments version by 1"
  - method: GET
    path: "/builders-risk/facilities/{id}"
    description: "Read one storage facility with its committed value."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: []
    output: StorageFacility
    side_effects: []
  - method: GET
    path: "/builders-risk/facilities"
    description: "List storage facilities."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: ["status?", "protection_class?", "limit?", "offset?"]
    output: StorageFacility[]
    side_effects: []
  - method: GET
    path: "/builders-risk/facilities/{id}/storage-assignments"
    description: "Reverse lookup for TemporaryStorageAssignment.facility_id: every policy's stored value at this shared facility."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TemporaryStorageAssignment[]
    side_effects: []
  # ---- TemporaryStorageAssignment ------------------------------------------
  - method: POST
    path: "/builders-risk/storage-assignments"
    description: "Commit insured materials to an off-site facility for a window; the facility's aggregate capacity is tested against overlapping commitments from every policy."
    roles: [Underwriter, RiskEngineer]
    code: 201
    input: [policy_id, facility_id, stored_value_cents, window_start, window_end]
    output: TemporaryStorageAssignment
    side_effects:
      - "sets status = APPROVED; raises facility.committed_value_cents by stored_value_cents and increments StorageFacility.version by 1"
      - "rejects with ERR_FACILITY_CAPACITY_EXCEEDED (422) per calculations.facility_overlap_exposure"
  - method: POST
    path: "/builders-risk/storage-assignments/{id}/release"
    description: "Release stored materials early, freeing the facility's committed value."
    roles: [Underwriter, RiskEngineer]
    code: 200
    input: []
    output: TemporaryStorageAssignment
    side_effects:
      - "sets status = RELEASED, released_at = current logical clock, release_reason = MANUAL"
      - "lowers facility.committed_value_cents by stored_value_cents and increments StorageFacility.version by 1; increments version by 1"
  - method: GET
    path: "/builders-risk/storage-assignments/{id}"
    description: "Read one temporary storage assignment."
    roles: [Underwriter, UnderwritingManager, RiskEngineer]
    code: 200
    input: []
    output: TemporaryStorageAssignment
    side_effects: []
  # ---- Test-driving endpoint -----------------------------------------------
  - method: POST
    path: "/builders-risk/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Advancing the clock is the only way to expire an in-force policy."
    roles: [Underwriter, UnderwritingManager, RiskEngineer, ClaimAdjuster]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, expired_policy_count: integer, closed_coverage_part_count: integer, released_assignment_count: integer, lapsed_endorsement_count: integer }
    side_effects:
      - "expiry cascade hop 1: every IN_FORCE policy whose term_end_date <= current_utc becomes EXPIRED"
      - "expiry cascade hop 2: every ACTIVE CoveragePart of those policies becomes CLOSED"
      - "expiry cascade hop 3: every APPROVED TemporaryStorageAssignment of those policies becomes RELEASED with release_reason = POLICY_EXPIRY, lowering each facility's committed_value_cents"
      - "expiry cascade hop 4: every REQUESTED or RETURNED_FOR_INFO ExtensionEndorsement of those policies becomes LAPSED"
      - "increments the version of every entity it touches by 1"

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own (ProjectContact whose X-User-ID is not the project id; LossPayee whose X-User-ID is not the interest id)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same user who performed the maker step: quoting then deciding a referral, requesting then approving an extension, adjusting then settling a claim, or issuing then voiding a payment."
  - id: ERR_MANAGER_APPROVAL_REQUIRED
    http: 403
    condition: "An Underwriter approves an extension endorsement whose additional_premium_cents exceeds 500000; only UnderwritingManager holds that authority."
  # --- not found ---
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No ConstructionProject with the given id (path segment or project_id in the body)."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "No BuildersRiskPolicy with the given id (path segment or policy_id in the body)."
  - id: ERR_COVERAGE_PART_NOT_FOUND
    http: 404
    condition: "No CoveragePart with the given id."
  - id: ERR_INTEREST_NOT_FOUND
    http: 404
    condition: "No NamedInsuredInterest with the given id (path segment or payee_interest_id in the body)."
  - id: ERR_ENDORSEMENT_NOT_FOUND
    http: 404
    condition: "No ExtensionEndorsement with the given id."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No Claim with the given id (path segment or claim_id in the body)."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No LossPayment with the given id."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "No TestingCommissioningNotice with the given id."
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "No StorageFacility with the given id (path segment or facility_id in the body)."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No TemporaryStorageAssignment with the given id."
  # --- schema ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, negative money amount, requested_extension_days outside 1..180, continuing_pm_weeks outside 0..12, insurable_interest_pct outside 0..100, or empty loss_items on a non-DELAY adjustment."
  # --- optimistic concurrency ---
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version on POST /policies does not match the current ConstructionProject.version."
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version on POST /extension-endorsements does not match the current BuildersRiskPolicy.version."
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version on POST /loss-payments does not match the current Claim.version."
  # --- state ---
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "The project's status does not admit this trigger, or a policy is created on a project that is not ELIGIBLE."
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "The policy's status does not admit this trigger, or a dependent record is created against a policy in the wrong status (coverage schedule after quote, endorsement or claim when not IN_FORCE, storage assignment before bind)."
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "The claim's adjustment_status does not admit this trigger, or a payment targets a claim that is neither ADJUSTED nor SETTLED."
  - id: ERR_INVALID_ENDORSEMENT_STATE
    http: 409
    condition: "The endorsement's status does not admit this trigger (return-for-info or decision when not REQUESTED, resubmit when not RETURNED_FOR_INFO, rescind when not APPROVED)."
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "A decision is taken on a TestingCommissioningNotice that is no longer SCHEDULED."
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "A release is requested on a TemporaryStorageAssignment that is already RELEASED."
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "A void is requested on a LossPayment that is already VOIDED."
  - id: ERR_INVALID_INTEREST_STATE
    http: 409
    condition: "An acknowledgment is submitted for a NamedInsuredInterest that is already ACKNOWLEDGED."
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "A returned endorsement is resubmitted when resubmission_count has already reached 3."
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "A claim is reopened when reopen_count has already reached 2."
  - id: ERR_FACILITY_SUSPENDED
    http: 409
    condition: "A storage assignment targets a SUSPENDED facility."
  # --- safety / compliance ---
  - id: ERR_ACTIVE_POLICY_EXISTS
    http: 409
    condition: "A second policy on the same project is bound while another is BOUND or IN_FORCE."
  - id: ERR_EXISTING_STRUCTURE_NOT_APPLICABLE
    http: 422
    condition: "includes_existing_structure is true on a NEW_CONSTRUCTION project, or on a RENOVATION project whose existing_structure_value_cents is 0."
  - id: ERR_COVERAGE_PART_NOT_PERMITTED
    http: 422
    condition: "An EXISTING_STRUCTURE part is scheduled on a policy that does not include the existing structure, or a DELAY_IN_COMPLETION part is scheduled with daily_delay_rate_cents == 0."
  - id: ERR_MITIGATION_PLAN_REQUIRED
    http: 422
    condition: "A hot-work or water-charged testing notice is scheduled without mitigation_plan_ref on a project whose engineering_grade is C or D."
  - id: ERR_INTERESTS_NOT_ACKNOWLEDGED
    http: 409
    condition: "A bind is attempted while any NamedInsuredInterest is PENDING, with no OWNER interest on the schedule, or with an OWNER + GENERAL_CONTRACTOR insurable_interest_pct sum that is not exactly 100."
  # --- temporal ---
  - id: ERR_DATE_RANGE_INVALID
    http: 422
    condition: "A start date is not strictly before its paired end date in the request body."
  - id: ERR_TESTING_WINDOW_CONFLICT
    http: 409
    condition: "A testing window overlaps a SCHEDULED or APPROVED notice of the same project, including the symmetric 24-hour hot-work buffer."
  - id: ERR_WINDOW_OUTSIDE_POLICY_TERM
    http: 422
    condition: "A storage window starts before term_start_date or ends after adjusted_completion_date."
  - id: ERR_LOSS_DATE_OUTSIDE_TERM
    http: 422
    condition: "A claim's loss_date falls outside the policy term as currently extended."
  - id: ERR_CANCEL_DATE_INVALID
    http: 422
    condition: "cancel_effective_date is not after term_start_date, is after term_end_date, or is before the current logical clock date."
  - id: ERR_REVISED_DATE_MISMATCH
    http: 422
    condition: "revised_completion_date does not equal adjusted_completion_date plus requested_extension_days."
  # --- constraint ---
  - id: ERR_DUPLICATE_SITE_CODE
    http: 409
    condition: "A facility is registered with a site_code that already exists."
  - id: ERR_DUPLICATE_COVERAGE_PART
    http: 409
    condition: "A second CoveragePart with the same part_type is scheduled on one policy."
  - id: ERR_SUBLIMIT_EXCEEDS_LIMIT
    http: 422
    condition: "The sum of the policy's ACTIVE sublimits, including the row being created or patched, exceeds limit_cents."
  - id: ERR_INTEREST_PCT_EXCEEDED
    http: 422
    condition: "The sum of insurable_interest_pct across the policy's interests would exceed 100."
  - id: ERR_DUPLICATE_PAYEE_PRIORITY
    http: 409
    condition: "A second interest on the same policy reuses an existing loss_payee_priority."
  - id: ERR_FACILITY_TOO_DISTANT
    http: 422
    condition: "The chosen facility is more than 100 miles from the site."
  - id: ERR_EXTENSION_LIMIT_EXCEEDED
    http: 422
    condition: "Cumulative extension days including this request would exceed 50% of the original term."
  - id: ERR_DUPLICATE_LOSS_ITEM
    http: 422
    condition: "Two loss_items in one adjustment share a part_type."
  # --- referential ---
  - id: ERR_COVERAGE_PART_MISSING
    http: 422
    condition: "A loss item names a part_type that the policy has no ACTIVE CoveragePart for."
  - id: ERR_PROJECT_NOT_COMPLETE
    http: 422
    condition: "A DELAY claim is adjusted before the project reports actual_substantial_completion_date, or the policy has no ACTIVE DELAY_IN_COMPLETION part."
  - id: ERR_TESTING_NOTICE_REQUIRED
    http: 422
    condition: "A TESTING_COMMISSIONING loss item or TESTING_FAILURE peril has no APPROVED notice covering the loss date."
  - id: ERR_STORAGE_NOT_APPROVED
    http: 422
    condition: "A TEMPORARY_STORAGE loss item has no APPROVED storage assignment covering the loss date."
  - id: ERR_PAYEE_NOT_ON_POLICY
    http: 422
    condition: "payee_interest_id references an interest attached to a different policy than the claim's."
  - id: ERR_PAYMENT_PART_NOT_ALLOCATED
    http: 422
    condition: "The payment's part_type has no allocation line with allocated_cents > 0 on the claim."
  # --- fiscal ---
  - id: ERR_FACILITY_CAPACITY_EXCEEDED
    http: 422
    condition: "Peak overlapping stored value at the facility, including the new assignment, exceeds aggregate_capacity_cents."
  - id: ERR_PAYMENT_EXCEEDS_ALLOCATION
    http: 422
    condition: "The payment would exceed the allocated_cents of its part_type on this claim, net of prior ISSUED payments to that part."
  - id: ERR_PAYMENT_EXCEEDS_RESERVE
    http: 422
    condition: "The payment would exceed the claim's outstanding reserve (indemnity_cents - paid_cents) or the target part's available_cents."

roles:
  - name: Underwriter
    description: "Builders risk underwriter: submits projects, builds the coverage schedule, rates and binds policies, incepts coverage, and requests extension endorsements."
    identity: "opaque"
    exclusive_operations:
      - "POST /builders-risk/policies"
      - "POST /builders-risk/policies/{id}/quote"
      - "POST /builders-risk/policies/{id}/reopen"
      - "POST /builders-risk/policies/{id}/bind"
      - "POST /builders-risk/policies/{id}/incept"
      - "POST /builders-risk/coverage-parts"
      - "PATCH /builders-risk/coverage-parts/{id}"
      - "POST /builders-risk/named-insured-interests"
      - "POST /builders-risk/extension-endorsements"
      - "POST /builders-risk/extension-endorsements/{id}/resubmit"
    shared_operations:
      - "POST /builders-risk/projects (with UnderwritingManager)"
      - "POST /builders-risk/projects/{id}/substantial-completion (with ProjectContact)"
      - "POST /builders-risk/extension-endorsements/{id}/decision (with UnderwritingManager, only while additional_premium_cents <= 500000)"
      - "POST /builders-risk/storage-assignments and POST /builders-risk/storage-assignments/{id}/release (with RiskEngineer)"
      - "POST /builders-risk/_clock/set_current_utc (with every operator role)"
      - "all GET reads except GET /builders-risk/projects/{id}/testing-notices ownership scoping"
  - name: UnderwritingManager
    description: "Referral and authority-limit authority: dispositions referred submissions, approves large-premium extensions, cancels policies, settles claims and voids payments. Never the same physical user as the maker step."
    identity: "opaque"
    exclusive_operations:
      - "POST /builders-risk/policies/{id}/referral-decision"
      - "POST /builders-risk/policies/{id}/cancel"
      - "POST /builders-risk/extension-endorsements/{id}/return-for-info"
      - "POST /builders-risk/extension-endorsements/{id}/rescind"
      - "POST /builders-risk/loss-payments/{id}/void"
      - "POST /builders-risk/extension-endorsements/{id}/decision when additional_premium_cents > 500000"
    shared_operations:
      - "POST /builders-risk/projects (with Underwriter)"
      - "POST /builders-risk/extension-endorsements/{id}/decision (with Underwriter below the authority limit)"
      - "POST /builders-risk/claims/{id}/settle (with ClaimAdjuster)"
      - "POST /builders-risk/_clock/set_current_utc (with every operator role)"
      - "all GET reads"
  - name: RiskEngineer
    description: "Loss-control engineering: screens projects, registers and suspends storage facilities, and dispositions testing and commissioning notices."
    identity: "opaque"
    exclusive_operations:
      - "POST /builders-risk/projects/{id}/screen"
      - "POST /builders-risk/facilities"
      - "PATCH /builders-risk/facilities/{id}"
      - "POST /builders-risk/testing-notices/{id}/decision"
    shared_operations:
      - "POST /builders-risk/testing-notices (with ProjectContact)"
      - "POST /builders-risk/storage-assignments and POST /builders-risk/storage-assignments/{id}/release (with Underwriter)"
      - "POST /builders-risk/_clock/set_current_utc (with every operator role)"
      - "GET reads on projects, policies, coverage parts, facilities, storage assignments and testing notices"
  - name: ClaimAdjuster
    description: "Loss adjustment: takes first notice of loss, applies the valuation basis and the allocation waterfall, reopens claims, and issues indemnity payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /builders-risk/claims"
      - "POST /builders-risk/claims/{id}/adjust"
      - "POST /builders-risk/claims/{id}/reopen"
      - "POST /builders-risk/loss-payments"
    shared_operations:
      - "POST /builders-risk/claims/{id}/settle (with UnderwritingManager, never as the adjusting user)"
      - "POST /builders-risk/_clock/set_current_utc (with every operator role)"
      - "GET reads on projects, policies, coverage parts, interests, claims, loss payments and testing notices"
  - name: ProjectContact
    description: "The insured project's own site contact. X-User-ID is the ConstructionProject id: may only schedule testing windows for, and declare substantial completion of, its own project."
    identity: "entity_backed:ConstructionProject"
    exclusive_operations: []
    shared_operations:
      - "POST /builders-risk/testing-notices for its own project_id (with RiskEngineer)"
      - "POST /builders-risk/projects/{id}/substantial-completion for its own project (with Underwriter)"
      - "GET /builders-risk/projects/{id}, GET /builders-risk/projects/{id}/testing-notices and GET /builders-risk/testing-notices/{id} for its own project"
  - name: LossPayee
    description: "A named insured or lender on the policy. X-User-ID is the NamedInsuredInterest id: may only acknowledge its own interest and read payments made to it."
    identity: "entity_backed:NamedInsuredInterest"
    exclusive_operations:
      - "POST /builders-risk/named-insured-interests/{id}/acknowledge"
    shared_operations:
      - "GET /builders-risk/named-insured-interests/{id} for its own interest"
      - "GET /builders-risk/loss-payments filtered to its own payee_interest_id, and GET /builders-risk/loss-payments/{id} for its own payments"
