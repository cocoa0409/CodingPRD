              payload: {}
          assert:
            - "insp1.requested_at == '2026-08-01T00:00:00Z' and response_due_at == '2026-08-08T00:00:00Z' (requested_at + 7 days)"
            - "submit-response returns 200 (2026-08-10T00:00:00Z <= the cutoff 2026-08-15T00:00:00Z, so ERR_INSPECTION_RESPONSE_WINDOW_CLOSED does not fire) with responded_at == '2026-08-10T00:00:00Z'"
            - "completeness_score == 30.00 == round(max(0.00, 50.00 - 20.00), 2); PLAN_COPY contributed nothing because it is not a requested kind"
            - "status after submit-response == 'RESPONDED'; after close == 'CLOSED_DEFICIENT' (30.00 < 100.00)"
            - "provided_document_kinds is still ['STATION_LOG', 'PLAN_COPY'] on the closed row — the score is stored, the inputs are retained"

  # ===========================================================================
  # SECTION 4 — Validations (claim-extraction-guide "From Table 4")
  # ===========================================================================
  - section: validations
    instances:

      - name: role_denial_precedes_the_missing_row_lookup
        claim_type: priority_conflict
        grounds:
          - "§1.4 priority 2 (auth): 'the acting role appears in the called endpoint's roles list' -> ERR_UNAUTHORIZED (403), applies_to all"
          - "§1.4 priority 4 (existence): 'every id in the path and then every id in the body resolves to a stored row, validated left-to-right' -> ERR_STATION_NOT_FOUND / ERR_TEST_EVENT_NOT_FOUND (404)"
          - "§1.7 roles: POST /test-events/{id}/evaluate-readiness is StationEngineer-only; POST /test-events is ComplianceAdmin-only"
        distinguishing_aspect: "A wrong-role call against an id that does not exist returns 403 ERR_UNAUTHORIZED, never 404 — and the same path with the correct role does return the 404, so the two checks are ordered rather than merged."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated; station KWEA exists (so only the probe ids are unresolvable)."
            - "Probe id 00000000-0000-4000-8000-000000000000 is never created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            - call: "POST /test-events/00000000-0000-4000-8000-000000000000/evaluate-readiness"
              as: FieldInspector
              as_user_id: insp-1
              payload: {}
              captures: { err_role_over_path: "$.data.error_id" }
            - call: "POST /test-events"
              as: FieldInspector
              as_user_id: insp-1
              payload: { station_id: "00000000-0000-4000-8000-000000000000", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { err_role_over_body: "$.data.error_id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "00000000-0000-4000-8000-000000000000", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { err_body_fk: "$.data.error_id" }
            - call: "POST /test-events/00000000-0000-4000-8000-000000000000/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
              captures: { err_path_id: "$.data.error_id" }
          assert:
            - "${err_role_over_path} == 'ERR_UNAUTHORIZED' with HTTP 403 — priority 2 fires before the path id is resolved"
            - "${err_role_over_body} == 'ERR_UNAUTHORIZED' with HTTP 403 — the unresolvable body FK is never reached"
            - "${err_body_fk} == 'ERR_STATION_NOT_FOUND' with HTTP 404 once the role passes"
            - "${err_path_id} == 'ERR_TEST_EVENT_NOT_FOUND' with HTTP 404 — the same path that produced 403 for the wrong role"
            - "no TestEvent row was created by any of the four calls"

      - name: schema_rejection_precedes_the_fk_lookup
        claim_type: priority_conflict
        grounds:
          - "§1.4 priority 3 (request_schema): 'every required body field is present, every enum value is a declared member, numeric ranges and array shapes hold, window_start_at < window_end_at ...' -> ERR_INVALID_REQUEST (400)"
          - "§1.4 priority 4 (existence) -> ERR_STATION_NOT_FOUND (404)"
          - "§1.1 TestEvent.test_type constraints 'one of {WEEKLY, MONTHLY, NATIONAL}'"
        distinguishing_aspect: "The same unresolvable station_id yields 400 when the body also carries a bad enum or a non-increasing window and 404 when the body is otherwise well-formed — so the schema pass runs to completion before any lookup, including the window_start_at < window_end_at comparison."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated; station KWEA exists."
            - "All probes use ComplianceAdmin so priority 1 and 2 pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "00000000-0000-4000-8000-000000000000", test_type: "DAILY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "00000000-0000-4000-8000-000000000000", test_type: "WEEKLY", window_start_at: "2026-08-12T01:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { err_window_order: "$.data.error_id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "DAILY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { err_enum_real_station: "$.data.error_id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
          assert:
            - "${err_enum} == 'ERR_INVALID_REQUEST' with HTTP 400 — priority 3 beats the unresolvable station_id"
            - "${err_window_order} == 'ERR_INVALID_REQUEST' with HTTP 400 — window_start_at == window_end_at violates the strict ordering rule"
            - "${err_enum_real_station} == 'ERR_INVALID_REQUEST' with HTTP 400 — the enum check does not depend on the FK resolving"
            - "the well-formed call returns 201 with status == 'SCHEDULED' and filing_deadline_at == '2026-08-17T01:00:00Z' (window_end_at + 5 days)"
            - "exactly one TestEvent row exists for the station after all four calls"

      - name: existence_precedes_occ_then_stale_version_then_success
        claim_type: priority_conflict
        grounds:
          - "§1.4 priority 4 (existence) -> ERR_STATION_NOT_FOUND (404); priority 6 (concurrency): 'expected_station_version equals Station.version' -> ERR_STALE_STATION_VERSION (412), applies_to 'POST /monitoring-assignments, POST /filing-records'"
          - "§1.2.1 concurrency_rules: the Station OCC rule guarding POST /monitoring-assignments via expected_station_version"
          - "§1.5 POST /monitoring-assignments side effect 'increments Station.version by 1'"
        distinguishing_aspect: "One captured version drives all three outcomes: with a bad station_id it is 404 (the stale version is never inspected), with the real station_id the same value is 412, and a freshly read version succeeds — proving the existence check precedes the concurrency check and that every assignment create bumps Station.version."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP', 'SATELLITE'] activated; station KWEA; dev1 READY."
            - "sv1 is read, then ma_pep is created with it (Station.version increments), so sv1 is now stale by exactly one."
