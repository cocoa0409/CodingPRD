  - rule_id: compensating_invariant
    instances:
      - name: cinv_file_then_withdraw_preserves_assessed_base
        grounds:
          - state_machines.Appeal.FILED_to_WITHDRAWN
          - state_machines.Assessment.UNDER_APPEAL_to_NOTICED
          - entities.Assessment.fields.assessed_value_cents
        distinguishing_aspect: |
          Conserved quantity = the assessed valuation base. Filing (Assessment NOTICED->UNDER_APPEAL)
          then withdrawing (UNDER_APPEAL->NOTICED) leaves Assessment.assessed_value_cents unchanged at
          the original 30000000; the forward+compensating pair nets zero drift in the assessed base.
        test_recipe:
          setup:
            - "Assessment original 30000000. Appeal filed then withdrawn."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "a17@f.test", license_number: "L27" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "C17", email: "c17@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "County Q", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "APN-R", address: "26 R St", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 27000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
          trigger:
            - call: "POST /api/appeals/${ap_id}/withdraw"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
          assert:
            - "Appeal.${ap_id}.status == WITHDRAWN"
            - "Assessment.${as_id}.status == NOTICED"
            - "Assessment.${as_id}.assessed_value_cents == 30000000"

      - name: cinv_issue_then_void_preserves_fee_ledger
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Client.fields.lifetime_fees_billed_cents
          - entities.Client.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = the client fee/money ledger. Issuing an invoice (fee 28250 debits
          Client.lifetime_fees_billed_cents 0->28250 and outstanding 0->28250) then voiding it
          returns both to 0; the forward+compensating pair nets zero drift in the billing ledger,
          a different conserved quantity from the assessed base.
        test_recipe:
          setup:
            - "Appeal decided (decision 27000000, realized 75000, fee 28250); fee agreement ACTIVE; invoice issued then voided."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "a18@f.test", license_number: "L28" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
              payload: { full_name: "B", email: "b18@f.test", license_number: "L29" }
              as: FirmAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "C18", email: "c18@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "County R", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/fee-agreements/${fa_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "APN-S", address: "27 S St", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/hearings"
              payload: { representative_id: "${an2_id}", docket_room: "R1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: {}
              as: Analyst
              as_user_id: "${an2_id}"
            - call: "POST /api/appeals/${ap_id}/record-decision"
              payload: { decision_value_cents: 27000000 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "GET /api/invoices?appeal_id=${ap_id}"
              as: Billing
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          trigger:
            - call: "POST /api/invoices/${inv_id}/void"
              payload: {}
              as: FirmAdmin
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Client.${cl_id}.lifetime_fees_billed_cents == 0"
            - "Client.${cl_id}.outstanding_balance_cents == 0"
