            - call: "GET /fof/programs/${prog}"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { pv: $.data.version }
            - call: "POST /fof/programs/${prog}/commitments/${com}/execute"
