              payload: { line_label: "Operating expenses", reported_value: 2008000, source_record_value: 2000000, tolerance_bp: 60, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v2}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { item2_id: $.data.id, item2_raw: $.data.raw_variance_bp, item2_eff: $.data.effective_tolerance_bp, item2_status: $.data.status }
            - call: "GET /disclosure/tie-out-items/${item1_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { item1_eff_b: $.data.effective_tolerance_bp, item1_status_b: $.data.status }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { gate_b: $.data.tie_out_status, total_b: $.data.tie_out_total_variance_bp, tier_b: $.data.tie_out_tier_multiplier }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "APPROVE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 409, error_id: ERR_TIE_OUT_NOT_PASSED }
            - call: "POST /disclosure/tie-out-items/${item1_id}/review"
              payload: { reviewer_member_id: "${fin2_id}", decision: "WAIVE" }
              as: Controller
              as_user_id: "${fin2_id}"
              captures: { item1_status_c: $.data.status, item1_decision: $.data.review_decision }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { gate_c: $.data.tie_out_status, total_c: $.data.tie_out_total_variance_bp, tier_c: $.data.tie_out_tier_multiplier }
            - call: "GET /disclosure/tie-out-items/${item2_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { item2_eff_c: $.data.effective_tolerance_bp, item2_status_c: $.data.status }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "APPROVE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { doc_status_final: $.data.status }
          assert:
            - "${item1_raw} == 24 and ${item1_eff_a} == 25 and ${item1_status_a} == MATCHED"
            - "${gate_a} == PASSED and ${total_a} == 24 and ${tier_a} == 1.00"
            - "${item2_raw} == 40 and ${item2_eff} == 45 and ${item2_status} == MATCHED"
            - "${item1_eff_b} == 18 and ${item1_status_b} == VARIANCE"
            - "${gate_b} == FAILED and ${total_b} == 64 and ${tier_b} == 0.75"
            - "the first APPROVE returns 409 ERR_TIE_OUT_NOT_PASSED"
            - "${item1_status_c} == WAIVED and ${item1_decision} == WAIVE"
            - "${gate_c} == PASSED and ${total_c} == 40 and ${tier_c} == 1.00"
            - "${item2_eff_c} == 60 and ${item2_status_c} == MATCHED"
            - "${doc_status_final} == APPROVED"
          notes: |
            Arithmetic: item 1 is 12000/5000000*10000 = 24 bp, item 2 is 8000/2000000*10000 = 40 bp.
            Tier bounds are TIGHT <= 50 and MEDIUM <= 200, so 24 is 1.00 and 64 is 0.75. Effective
            tolerances are FLOORED, not rounded: floor(25*0.75) = 18 and floor(60*0.75) = 45. After the
            WAIVE, item 1 is out of the STEP-2 snapshot entirely, so the total is item 2 alone at 40 bp,
            back inside the TIGHT tier.

      - name: cycle_transition_reads_its_pinned_charter_so_superseding_that_charter_blocks_the_next_step
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_CHARTER_NOT_ADOPTED]
          - state_machines.DisclosureCommitteeCharter.ADOPTED_to_SUPERSEDED
          - state_machines.ReportingCycle.CLOSE_OPEN_to_REVIEW_OPEN
        distinguishing_aspect: |
          Validity depends entirely on the state of a DIFFERENT entity, and both directions are probed on
          the same charter: while it is DRAFT no cycle may be created against it, while it is ADOPTED both
          the creation and the OPEN_CLOSE transition succeed, and once it is SUPERSEDED the very next
          cycle transition is refused even though the cycle itself is untouched and its CLOSE milestone is
          COMPLETE. The refusal is the consequence of the pinning side effect declared in §1.2: SUPERSEDE
          does NOT re-point ReportingCycle.charter_id, so the live cycle keeps pointing at a superseded
          charter. An implementation that checks the charter only at creation time lets OPEN_REVIEW
          through; one that re-points cycles to the successor also lets it through.
        test_recipe:
          setup:
            - "Charter A created but NOT yet adopted, with a FINANCE and a LEGAL voting seat."
            - "Charter B created and adopted separately, so it can serve as a valid successor."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_a: $.data.id }
            - call: "POST /disclosure/charters/${charter_a}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters"
              payload: { name: "Q3 Disclosure Committee Charter", version_label: "2026.2", min_quorum_count: 2, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_b: $.data.id }
            - call: "POST /disclosure/charters/${charter_b}/members"
              payload: { full_name: "Tess Successor", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_b1: $.data.id }
            - call: "POST /disclosure/charters/${charter_b}/members"
              payload: { full_name: "Uri Successor", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_b2: $.data.id }
            - call: "POST /disclosure/charters/${charter_b}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_b1}"
              captures: { b_status: $.data.status }
          trigger:
            # ---- charter A is DRAFT: no cycle may be created against it ----
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_a}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              expect_error: { http: 409, error_id: ERR_CHARTER_NOT_ADOPTED }
            # ---- charter A adopted: creation and the first transition both succeed ----
            - call: "POST /disclosure/charters/${charter_a}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { a_status: $.data.status }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_a}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id, cycle_charter: $.data.charter_id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { cycle_status_a: $.data.status }
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_status: $.data.status }
            # ---- charter A superseded: the cycle stays pinned to it and its next step is refused ----
            - call: "POST /disclosure/charters/${charter_a}/transitions"
              payload: { action: "SUPERSEDE", successor_charter_id: "${charter_b}" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { a_status_2: $.data.status, a_successor: $.data.superseded_by_charter_id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_charter_after: $.data.charter_id, cycle_status_after: $.data.status }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 409, error_id: ERR_CHARTER_NOT_ADOPTED }
          assert:
            - "${b_status} == ADOPTED"
            - "the DRAFT-charter creation returns 409 ERR_CHARTER_NOT_ADOPTED"
            - "${a_status} == ADOPTED and ${cycle_charter} == \"${charter_a}\""
            - "${cycle_status_a} == CLOSE_OPEN and ${close_status} == COMPLETE"
            - "${a_status_2} == SUPERSEDED and ${a_successor} == \"${charter_b}\""
            - "${cycle_charter_after} == \"${charter_a}\" and ${cycle_status_after} == CLOSE_OPEN"
            - "the OPEN_REVIEW returns 409 ERR_CHARTER_NOT_ADOPTED, not ERR_MILESTONE_INCOMPLETE"

      - name: priority_ordering_between_the_two_milestone_window_rules
        claim_type: priority_ordering
        grounds: ["validations[priority=31]", "validations[priority=39]"]
        excluded_because:
          difficulty_instance: overlapping_and_past_deadline_milestone_reports_overlap_not_deadline
          rationale: |
            The generic "two rules violated, the lower priority number wins" claim is covered three times
            over in §1.8 by dedicated error_precedence_ordering instances: priority 31 beating 39 on a
            milestone that both overlaps a sibling and ends past the statutory deadline,
            blocked_certification_signature_reports_invalid_state_not_coverage_shortfall (13 beating 43),
            and recused_self_reviewer_reports_seat_invalid_not_self_review (17 beating 18).
      - name: priority_conflict_between_an_empty_set_boundary_and_the_scope_rule
        claim_type: priority_conflict
        grounds: ["validations[priority=42]", calculations.certification_coverage_pct]
        excluded_because:
          difficulty_instance: empty_subcertification_scope_reads_zero_coverage_and_trips_the_scope_rule
          rationale: |
            That §1.8 instance is exactly the priority_conflict pattern at the hardest adjacent pair in
            the table: an empty sub-certification scope violates priority 42 AND priority 43 at once
            (coverage of the empty set reads 0.00, not 100.00), and the instance pins ERR_CERT_SCOPE_EMPTY
            as the reported code while asserting the 0.00 reading that would otherwise raise
            ERR_CERT_COVERAGE_INSUFFICIENT.
      - name: aggregate_validation_of_the_member_preparation_window_capacity
        claim_type: aggregate_validation
        grounds: ["validations[priority=41]", calculations.member_concurrent_subcert_load]
        excluded_because:
          difficulty_instance: subcertification_prep_windows_are_closed_intervals_with_an_aggregate_capacity_of_two
          rationale: |
            member_concurrent_subcert_load is the scaffold's only aggregate-capacity rule, and that §1.8
            instance is precisely the "each individual valid, collective exceeds the limit" claim: two
            individually admissible sub-certifications with intersecting closed 72-hour windows are both
            accepted and the third, equally admissible on its own, is refused with
            ERR_MEMBER_PREP_WINDOW_CAPACITY.

  # ===================================================================
  # SECTION 5 — ENDPOINTS (§1.5)
  # Guide patterns: standard CRUD / action endpoint / bulk action /
  # cross-reference link / computed read / conditional action.
  #
  # `standard_crud` is skipped as a pattern row: §1.5 declares no PUT, PATCH or DELETE
  # verb anywhere — every mutation is either a create or a named action — so the
  # "Create/Read/Update/Delete each work" claim collapses onto the create/retrieve/list
  # instances already written in the `entities` section above
  # (crud_create_returns_every_declared_field_of_the_reporting_cycle and its siblings).
  #
  # `bulk_action` is skipped: no endpoint in §1.5 accepts a collection of targets, so
  # there is no partial-success or rollback-or-skip semantics to probe.
  # ===================================================================
  - section: endpoints
    instances:

      - name: question_clearance_endpoint_gates_only_on_high_risk_questions_and_refuses_a_replayed_clear
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /disclosure/qa-items/{id}/clear]
          - endpoints[POST /disclosure/documents/{id}/qa-items]
          - entities.DraftDocument.qa_gate_status
          - state_machines.QandAItem.DRAFT_to_BLOCKED
          - state_machines.QandAItem.BLOCKED_to_CLEARED
          - validations[priority=24]
          - validations[priority=13]
          - errors[ERR_QA_ITEM_UNCLEARED]
        distinguishing_aspect: |
          The action endpoint's transition fires and its preconditions are enforced, but the sharp part is
          the gap between an item's STATUS and the document's GATE. Three questions are created on one
          call script: a LOW/no-safe-harbor question lands in DRAFT, a LOW question carrying
          requires_safe_harbor == true lands in BLOCKED, and a HIGH-risk question lands in BLOCKED. Only
          the HIGH one moves qa_gate_status to BLOCKED, so clearing THAT one alone lets the script be
          APPROVED while a DRAFT question and a BLOCKED question are still attached to it. Replaying the
          clear on the already-CLEARED item reports ERR_INVALID_STATE and not ERR_ENTITY_TERMINAL, because
          §1.2 gives QandAItem an empty terminal_states list and §1.4 priority 12 therefore skips it.
        test_recipe:
          setup:
            - "An adopted charter with FINANCE, LEGAL and INVESTOR_RELATIONS seats, and a FY2026-Q2 cycle in CLOSE_OPEN."
            - "A CALL_SCRIPT document authored by the investor-relations member with safe_harbor_present true (required both by §1.4 priority 23 at APPROVE and by the BLOCKED -> CLEARED precondition), carrying one MATCHED tie-out line so tie_out_status is PASSED."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Ida Relations", function: "INVESTOR_RELATIONS", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { ir_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "CALL_SCRIPT", title: "Q2 2026 Earnings Call Script", author_member_id: "${ir_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v}" }
              as: InvestorRelations
