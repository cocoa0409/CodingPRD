  # =================================================================
  # Rule 8 — resource temporal-overlap conflicts (different semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_half_open_overlap_adjacency_ok
        grounds:
          - state_machines.Shipment.SOURCED_to_SHIPPED
          - errors[ERR_ROUTE_WINDOW_CONFLICT]
          - entities.CarrierRoute.fields.service_date
        distinguishing_aspect: |
          CarrierRoute uses half-open [start,end) windows: a [10:00,12:00) booking overlapping an existing
          [09:00,11:00) is rejected, but an adjacent [11:00,12:00) (start == prior end) is accepted.
        test_recipe:
          setup:
            - "Three cycle-1 shipments confirmed SOURCED; one CarrierRoute R1 on 2026-03-10."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
