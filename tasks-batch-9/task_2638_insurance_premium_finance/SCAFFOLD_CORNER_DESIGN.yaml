      - name: waterfall_allocation_whole_only_fee_bucket_and_payoff_surplus_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.payment_waterfall_allocation.formula
          - calculations.payment_waterfall_allocation.input_set
          - validations.priority_39_ERR_PAYMENT_EXCEEDS_PAYOFF
        distinguishing_aspect: |
          Two structural properties of the four-bucket waterfall that no other instance pins. First,
          bucket 1 has a WHOLE-ONLY rule: a tender that cannot cover an outstanding fee in full does
          not chip away at it, it flows past to bucket 2, so the fee survives untouched while
          finance charge is retired ahead of it. Second, the remainder rule: a tender that exceeds the
          obligation parks the surplus in unapplied_credit_cents rather than rejecting or refunding,
          and stays legal as long as the excess is inside MAX_OVERPAYMENT_CENTS. Ordinary
          implementations get the first wrong by applying partial payments to fees.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License and two ACTIVE 600k notes"
            - "note W1 is swept at clock 2026-10-12 so installment 1 is PAST_DUE with a single OUTSTANDING 4497 fee"
            - "note W2 is left untouched and CURRENT at clock 2026-10-12, its first installment falling due 2026-10-14, where its net payoff is 502000"
