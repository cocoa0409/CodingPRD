          two sibling encounters makes the asymmetry visible in one shot, and the CATEGORY_III row also
          propagates through encounter_required_coverage_units to TIER_IV with one_to_one_required, so
          its encounter demands the flat ONE_TO_ONE_REQUIRED_UNITS 4.0 rather than a phase-scaled figure
          while its CATEGORY_I sibling stays at TIER_I and 0.5. An implementation that defaults the
          missing CATEGORY_I constant to zero would stamp escalation_due_at equal to assessed_at and
          hand the sweep an instantly-overdue chain.
