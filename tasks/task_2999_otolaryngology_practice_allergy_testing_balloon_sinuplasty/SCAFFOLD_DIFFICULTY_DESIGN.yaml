              captures: { pat_2: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10163", full_name: "Block Child Three", date_of_birth: "2020-01-01" }
              as: PracticeAdmin
              captures: { pat_3: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10164", full_name: "Block Child Four", date_of_birth: "2020-01-01" }
              as: PracticeAdmin
              captures: { pat_4: $.data.id }
            - call: "POST /surgery-center-blocks"
              payload: { center_name: "Northside Surgery Center", block_start_at: "2026-08-10T08:00:00Z", block_end_at: "2026-08-10T12:00:00Z", max_concurrent_cases: 2 }
              as: PracticeAdmin
              captures: { block_id: $.data.id, capacity: $.data.capacity_minutes, block_status_0: $.data.status }
          trigger:
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_1}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T10:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
              captures: { c1: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_2}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T11:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
              captures: { c2: $.data.id }
            - call: "GET /surgery-center-blocks/${block_id}"
              payload: {}
              as: PracticeAdmin
              captures: { booked_2: $.data.booked_minutes, util_2: $.data.utilization_bps }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_3}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T09:30:00Z", end_at: "2026-08-10T10:30:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_4}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T13:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_3}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T12:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
              captures: { c5: $.data.id }
            - call: "GET /surgery-center-blocks/${block_id}"
              payload: {}
              as: PracticeAdmin
              captures: { booked_5: $.data.booked_minutes, util_5: $.data.utilization_bps, block_status_5: $.data.status }
          assert:
            - "Each patient's age_months == 79 at the default clock, so ERR_PEDIATRIC_VENUE_REQUIRED is never in play"
            - "SurgeryCenterBlock.${block_id} at creation: duration 240 minutes, capacity_minutes 480 (240 * 2), booked_minutes 0, utilization_bps 0, status \"OPEN\""
            - "Candidates 1 (08:00-10:00) and 2 (09:00-11:00) are both accepted; they are 2 concurrent cases during [09:00, 10:00), exactly at max_concurrent_cases"
            - "After candidate 2: booked_minutes == 240 and utilization_bps == 5000 (round_half_up(240 * 10000 / 480))"
            - "Candidate 3 (09:30-10:30) returns HTTP 409 with error.id == \"ERR_BLOCK_CAPACITY_EXCEEDED\" — it would make 3 concurrent cases during [09:30, 10:00), even though booked_minutes 300 would still be under capacity_minutes 480, so the concurrency limb of the rule is what fires"
            - "Candidate 4 (11:00-13:00) returns HTTP 409 with error.id == \"ERR_BLOCK_WINDOW_EXCEEDED\" — its end_at 13:00 falls outside the block's half-open window [08:00, 12:00), and it is NOT reported as a capacity problem"
            - "Candidate 5 (10:00-12:00) is accepted: under half-open semantics its start_at equals candidate 1's end_at and that is an adjacency rather than an overlap, so the concurrent count during [10:00, 11:00) is 2, not 3 — the exact shape that candidate 2 of the sibling scope instance was rejected for"
            - "Candidate 5 also proves the containment boundary is inclusive at the top: end_at == block_end_at 12:00 is admissible"
            - "After candidate 5: booked_minutes == 360, utilization_bps == 7500, booked_case_count == 3 and status is still \"OPEN\" (7500 < BLOCK_FULL_BPS 10000)"
            - "The two rejected candidates left no rows: GET /procedure-bookings?surgery_center_block_id=${block_id} returns total_count 3"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Two different conserved quantities under two different compensating actions.
  # Instance 1 conserves millilitres of extract across a dose void. Instance 2
  # conserves discrete implant units across a booking completion and a booking
  # cancellation. Each instance checks the identity after every mutation, not
  # only at the end, and each checks that the compensation leaves no drift in the
  # derived scheduling state.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: vial_millilitre_ledger_conserved_across_dose_void
        grounds:
          - calculations.immunotherapy_vial_volume_ledger
          - calculations.immunotherapy_next_dose_volume
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_VOIDED
          - entities.ImmunotherapyVial.fields.volume_ml_remaining
          - endpoints[POST /immunotherapy-doses/{doseId}/void]
        distinguishing_aspect: |
          Conserved quantity: millilitres of allergen extract, across the four buckets
          volume_ml_initial / remaining / dispensed_total / wasted. The compensating action is
          a dose void inside the 15-minute window, which must return the drawn volume to
          remaining, remove it from dispensed_total, add nothing to wasted, and roll
          Patient.last_dose_administered_at back to the previous surviving dose. The identity
          is checked after all four mutations, and the re-draw proves the compensation left no
          drift in the schedule: the replacement dose is issued at the same step and the same
          volume as the voided one. Different conserved quantity and different compensating
          action from the sibling instance.
        test_recipe:
          setup:
            - "PayerPolicy LEDG-2999 with observation_floor_minutes 20, so every immunotherapy observation window is 30 minutes (base 30 for IMMUNO_DOSE, risk below 45, STANDARD tier, floor 20)."
            - "One adult Patient with prior_systemic_reaction_count 0 and epinephrine_on_file true, so risk_score is 5, immunotherapy_escalation_step opens at 1 and no supervision flag applies."
            - "One ALLERGEN_CONCENTRATE SupplyLot and one BLUE_1_100 ImmunotherapyVial with volume_ml_initial 5.00, mixed by u_nurse_1 and label-verified by u_nurse_2, so the vial is LABEL_VERIFIED with remaining 5.00, dispensed_total 0.00 and wasted 0.00."
            - "Clock set to 2026-08-01T09:00:00Z before the first draw."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Ledger Mutual", plan_code: "LEDG-2999", requires_prior_auth: true, observation_floor_minutes: 20 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10171", full_name: "Ledger Patient", date_of_birth: "1971-06-16", epinephrine_on_file: true, prior_systemic_reaction_count: 0 }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v1: $.data.version, step_0: $.data.immunotherapy_escalation_step }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1008", quantity_received: 20, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "BLUE 1-100 MRN-10171", expires_at: "2027-06-30T00:00:00Z", volume_ml_initial: 5.00, expected_patient_version: "${pat_v1}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_id: $.data.id, rem_0: $.data.volume_ml_remaining }
            - call: "POST /immunotherapy-vials/${vial_id}/label-verification"
              payload: { label_text_confirmation: "BLUE 1-100 MRN-10171" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose1: $.data.id, vol_1: $.data.volume_ml, step_1: $.data.escalation_step_at_dose }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:30:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose1}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose2: $.data.id, vol_2: $.data.volume_ml, step_2: $.data.escalation_step_at_dose }
            - call: "GET /immunotherapy-vials/${vial_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { rem_2: $.data.volume_ml_remaining, disp_2: $.data.volume_ml_dispensed_total }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:40:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose2}/void"
              payload: { void_reason: "DRAWN_IN_ERROR" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose2_status: $.data.status }
            - call: "GET /immunotherapy-vials/${vial_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { rem_v: $.data.volume_ml_remaining, disp_v: $.data.volume_ml_dispensed_total, wasted_v: $.data.volume_ml_wasted }
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose3: $.data.id, vol_3: $.data.volume_ml, step_3: $.data.escalation_step_at_dose, gap_3: $.data.gap_days_at_dose }
          assert:
            - "After dose 1 (step 1, SCHEDULE_ML[1]): volume_ml 0.05, vial remaining 4.95, dispensed_total 0.05, wasted 0.00 — identity 5.00 == 4.95 + 0.05 + 0.00"
            - "Vial status moved LABEL_VERIFIED -> IN_USE on the first draw and stays IN_USE for the whole chain"
            - "After clearing dose 1 at 09:30: Patient.immunotherapy_escalation_step == 2 (min(12, 1 + 1)) and dose 1 is \"CLEARED\""
            - "After dose 2 (step 2, SCHEDULE_ML[2]): volume_ml 0.10, vial remaining 4.85, dispensed_total 0.15 — identity 5.00 == 4.85 + 0.15 + 0.00"
            - "The void at 09:40 is inside the 15-minute window (10 minutes after 09:30) so it succeeds: dose 2 status == \"VOIDED\""
            - "Compensation is exact: vial remaining 4.95, dispensed_total 0.05, wasted 0.00 — identity 5.00 == 4.95 + 0.05 + 0.00, byte-identical to the post-dose-1 ledger. The voided millilitres are NOT parked in wasted"
            - "Patient.last_dose_administered_at rolled back to \"2026-08-01T09:00:00Z\" (dose 1), because VOIDED doses are excluded from that derivation"
            - "Patient.immunotherapy_escalation_step is still 2 — a void compensates volume, not the schedule advance that clearing dose 1 already earned"
            - "No drift on the re-draw: dose 3 has escalation_step_at_dose 2, volume_ml 0.10 and gap_days_at_dose 0 (09:40 minus 09:00 is under 24 hours), exactly matching the voided dose"
            - "Final ledger: vial remaining 4.85, dispensed_total 0.15, wasted 0.00 — identity 5.00 == 4.85 + 0.15 + 0.00"
            - "dispensed_total counts only doses in {ADMINISTERED, CLEARED, REACTION_HELD}: doses 1 and 3 contribute 0.05 + 0.10 while VOIDED dose 2 contributes nothing"

      - name: supply_lot_unit_ledger_conserved_across_completion_and_cancel
        grounds:
          - calculations.supply_lot_availability
          - state_machines.ProcedureBooking.IN_PROGRESS_to_COMPLETED
          - state_machines.ProcedureBooking.SCHEDULED_to_CANCELLED
          - entities.SupplyLot.fields.quantity_reserved
          - endpoints[POST /procedure-bookings/{bookingId}/cancel]
        distinguishing_aspect: |
          Conserved quantity: discrete implant units across quantity_received / on_hand /
          consumed / wasted, with quantity_reserved as a soft claim that must never appear in
          the identity. Two different compensating actions are exercised on one lot: a
          completion that partially consumes a reservation (2 reserved, 1 used) and a
          cancellation that releases a reservation outright. available_quantity must rise on
          both and never fall, and the identity must hold after each. Different conserved
          quantity and different compensating action from the sibling instance's millilitre
          void.
        test_recipe:
          setup:
            - "PayerPolicy LEDGB-2999; one Patient with date_of_birth 2020-01-01, so age_months is 79 at the default clock and TYMPANOSTOMY_TUBES in the IN_OFFICE_SUITE is permitted."
            - "One TYMPANOSTOMY_TUBE SupplyLot with quantity_received 4, so on_hand 4, reserved 0, consumed 0, wasted 0, available_quantity 4, status ACTIVE."
            - "Clock stays at its default 2026-08-01T00:00:00Z; both bookings sit in the future, which no rule constrains."
            - "Both bookings name physician_user_id u_ent_1 and every start call is issued as u_ent_1."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Unit Ledger Health", plan_code: "LEDGB-2999", requires_prior_auth: true }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10181", full_name: "Unit Ledger Child", date_of_birth: "2020-01-01" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, age_m: $.data.age_months }
            - call: "POST /supply-lots"
              payload: { item_type: "TYMPANOSTOMY_TUBE", lot_number: "LOT-1009", quantity_received: 4, expires_at: "2027-12-31T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id, avail_0: $.data.available_quantity }
          trigger:
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "IN_OFFICE_SUITE", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z", physician_user_id: "u_ent_1", supply_lot_id: "${lot_id}", planned_device_count: 2 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_a: $.data.id }
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
              captures: { res_a: $.data.quantity_reserved, avail_a: $.data.available_quantity }
            - call: "POST /procedure-bookings/${book_a}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings/${book_a}/complete"
              payload: { devices_used_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_a_status: $.data.status, used_a: $.data.devices_used_count }
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
              captures: { on_hand_c: $.data.quantity_on_hand, cons_c: $.data.quantity_consumed, res_c: $.data.quantity_reserved, avail_c: $.data.available_quantity }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "IN_OFFICE_SUITE", start_at: "2026-08-06T09:00:00Z", end_at: "2026-08-06T10:00:00Z", physician_user_id: "u_ent_1", supply_lot_id: "${lot_id}", planned_device_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_b: $.data.id }
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
              captures: { res_b: $.data.quantity_reserved, avail_b: $.data.available_quantity }
            - call: "POST /procedure-bookings/${book_b}/cancel"
              payload: { cancel_reason: "PATIENT_REQUEST" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_b_status: $.data.status }
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
              captures: { on_hand_f: $.data.quantity_on_hand, cons_f: $.data.quantity_consumed, wasted_f: $.data.quantity_wasted, res_f: $.data.quantity_reserved, avail_f: $.data.available_quantity }
          assert:
            - "At creation: identity 4 == 4 + 0 + 0 and available_quantity 4"
            - "After booking A reserves 2: on_hand 4, reserved 2, consumed 0, wasted 0, available_quantity 2, status \"ACTIVE\" — identity 4 == 4 + 0 + 0 is untouched, because a reservation moves nothing between the three conserved buckets"
            - "After completing booking A with devices_used_count 1: reserved 0, on_hand 3, consumed 1, wasted 0 — identity 4 == 3 + 1 + 0"
            - "available_quantity ROSE from 2 to 3 on that completion and never fell — the unused reserved unit went back to availability rather than to wasted"
            - "ProcedureBooking.${book_a}.status == \"COMPLETED\" with devices_used_count 1, and SupplyLot.${lot_id}.status is still \"ACTIVE\""
            - "After booking B reserves 1: reserved 1, available_quantity 2 — identity 4 == 3 + 1 + 0 still holds, unchanged"
            - "After cancelling booking B: status \"CANCELLED\", cancel_reason \"PATIENT_REQUEST\", reserved 0, available_quantity back to 3 — identity 4 == 3 + 1 + 0 for the third time"
            - "quantity_reserved never appears in the identity at any point: it moved 0 -> 2 -> 0 -> 1 -> 0 while on_hand + consumed + wasted stayed exactly 4 throughout"
            - "supply_shortfall_flag is false on both bookings for the whole chain — available_quantity never reached 0, so the lot never went EXHAUSTED"
