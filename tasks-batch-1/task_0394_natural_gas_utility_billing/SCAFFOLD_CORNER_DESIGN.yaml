  # ===========================================================================
  # SECTION 5 — Endpoints (per-endpoint side-effect coverage, action endpoints,
  #   computed reads, FK reverse-reachability filtered lists / sub-resources).
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_set_updates_current_utc_and_heating_flag
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /_clock/set"]
          - entities.Clock
        distinguishing_aspect: "POST /_clock/set with current_utc and heating_season_active updates the Clock; GET /_clock reflects both values."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-10T00:00:00.000Z", heating_season_active: true }
              as: BillingAdmin
          trigger:
            - call: "GET /_clock"
              payload: {}
              as: BillingAdmin
          assert:
            - "Clock.current_utc == 2026-01-10T00:00:00.000Z"
            - "Clock.heating_season_active == true"

      - name: void_meter_read_excludes_it_from_consumption
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /meters/{id}/reads/{read_id}/void"]
          - entities.MeterRead.fields.status
          - calculations.consumption_conversion
        distinguishing_aspect: "Voiding a read sets status=VOID; a subsequent read computes its delta against the prior NON-VOID read (the voided one is skipped)."
        test_recipe:
          setup:
            - "RES account, SET meter install 1000; first read 1100 then voided; a second read 1150 should compute delta against install 1000 (=150) since the 1100 read is VOID."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-EP2", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.0, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "EP2" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "ME-201", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-10T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd1_id: $.data.id }
            - call: "POST /meters/${m_id}/reads/${rd1_id}/void"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1150, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd2_id: $.data.id }
          assert:
            - "MeterRead.${rd1_id}.status == VOID"
            - "MeterRead.${rd2_id}.ccf_consumed == 150"

      - name: list_meters_by_account_fk_reverse_reachability
        claim_type: Computed read
        grounds:
          - entities.PremiseMeter.fields.account_id
          - endpoints["GET /accounts/{id}/meters"]
        distinguishing_aspect: "GET /accounts/{id}/meters returns the account's meters as PremiseMeter[] (FK reverse-reachability for PremiseMeter.account_id)."
        test_recipe:
          setup:
            - "A RES account with two registered meters."
