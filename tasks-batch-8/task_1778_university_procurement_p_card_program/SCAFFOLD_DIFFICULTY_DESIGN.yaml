          trigger:
            - call: "PATCH /requisitions/${r_id}"
              payload: { expected_requisition_version: "${r_ver_returned}", lines: [{ commodity_code: "MUS", description: "mixer-compact", quantity: 1, unit_price_cents: 400000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { chain_v2: $.data.required_chain }
            - call: "POST /requisitions/${r_id}/approve-step"
