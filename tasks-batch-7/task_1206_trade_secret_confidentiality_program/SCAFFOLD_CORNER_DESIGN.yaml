            - "Counterparty.${cp_id}.risk_tier == MEDIUM (>= 30 boundary inclusive)"

      - name: nda_expiry_boundary_exactly_at_expiry_stays_active
        claim_type: boundary_edge
        grounds: [state_machines.NdaAgreement.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "Strict-greater expiry: at clock == expiry_date the sweep does NOT expire the NDA; one second past it does."
        test_recipe:
          setup: ["ACTIVE NDA with expiry_date 2026-12-31T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Tau Movers", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t17", governing_law: "UT", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z", survival_months: 3, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: IPCounsel
          trigger:
            - call: "POST /api/program/sweep"
              as: IPCounsel
              captures: { sw1: $.data.ndas_expired }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:01Z" }
              as: IPCounsel
            - call: "POST /api/program/sweep"
              as: IPCounsel
              captures: { sw2: $.data.ndas_expired }
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
          assert:
            - "sw1 == 0 and NDA still ACTIVE at exactly expiry_date (strict > semantics)"
            - "sw2 == 1 and NdaAgreement.${nda_id}.status == EXPIRED one second later"

