# =============================================================================
# Scaffold: On-Demand Acute Home Visit Dispatch & Emergency Diversion
# (DispatchHealth) — task_3134
#
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml. Neither key appears here.
# =============================================================================

scenario: |
  On-Demand Acute Home Visit Dispatch & Emergency Diversion (DispatchHealth):
  request intake from patients, payers, providers and facilities with clinical
  triage to determine home-visit appropriateness, acuity screening that
  redirects true emergencies to emergency medical services, market coverage
  areas with response window commitments and vehicle routing, care team
  pairing of an advanced practice provider with a technician and remote
  physician oversight, on-site diagnostics including point-of-care testing,
  imaging and intravenous treatment with formulary limits, disposition
  decisions including transport to a facility when the home visit escalates,
  payer contracting and claim submission at a lower site-of-service rate,
  follow-up communication to the patient's primary care and post-visit
  monitoring.

domain_name: dispatch-health
api_prefix: /dh

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MarketCoverageArea
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Unique market identifier (e.g. 'DFW-NORTH')" }
      - { name: display_name, type: string, source: input, description: "Human-readable market name" }
      - { name: polygon_geojson, type: string, source: input, description: "GeoJSON polygon; coverage area boundary" }
      - { name: response_window_minutes_urgent, type: integer, source: input, description: "Promised minutes from dispatch acceptance to on-scene arrival for URGENT acuity" }
      - { name: response_window_minutes_standard, type: integer, source: input, description: "Promised minutes for STANDARD acuity" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether market accepts new visit requests" }
      - { name: open_visit_count, type: integer, source: computed, default: 0, description: "Count of VisitRequests in this market in a non-terminal state (INTAKE..DISPOSITIONED, CLAIM_DRAFT, CLAIM_SUBMITTED, CLAIM_APPEALED)" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: payer_code, type: string, source: input, description: "Payer identifier (e.g. 'AETNA', 'BCBS-TX')" }
      - { name: market_id, type: string, source: input, description: "FK -> MarketCoverageArea.id; contract applies to this market only" }
      - { name: urgent_base_rate_cents, type: integer, source: input, description: "Site-of-service contracted rate for URGENT home visit (lower than ED site rate)" }
      - { name: standard_base_rate_cents, type: integer, source: input, description: "Site-of-service contracted rate for STANDARD home visit" }
      - { name: place_of_service_modifier_pct, type: number, source: input, description: "Multiplier applied to base rate for home place-of-service (e.g. 0.85 = 15% discount vs office)" }
      - { name: max_claim_cents, type: integer, source: input, description: "Hard cap on a single claim total under this contract" }
      - { name: effective_from, type: datetime, source: input, description: "Contract effective start (UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Contract effective end (UTC, exclusive)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: FormularyEntry
    parent: null
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; the formulary is per-contract" }
      - { name: drug_code, type: string, source: input, description: "Drug identifier (e.g. 'IVF-NS-1L', 'IV-ABX-CEFTRIAXONE-1G')" }
      - { name: max_units_per_visit, type: integer, source: input, description: "Maximum units of this drug billable on a single visit" }
      - { name: requires_physician_preauth, type: boolean, source: input, description: "Whether this drug requires supervising-physician pre-authorization before administration" }
      - { name: unit_price_cents, type: integer, source: input, description: "Contracted unit price under this payer" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: payer_code, type: string, source: input, description: "Payer code on the patient's insurance card" }
      - { name: member_id, type: string, source: input, description: "Member ID under the payer" }
      - { name: pcp_name, type: string, source: input, description: "Primary care physician name for follow-up routing" }
      - { name: pcp_npi, type: string, source: input, description: "PCP NPI (10 digits) — used by FollowUpNotice" }
      - { name: comorbidity_count, type: integer, source: input, default: 0, description: "Number of documented chronic conditions; feeds acuity scoring" }
      - { name: home_address_geo, type: string, source: input, description: "WGS84 lon/lat point; coverage containment is tested against this" }

  - name: CareTeam
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> MarketCoverageArea.id; team's home market" }
      - { name: app_user_id, type: string, source: input, description: "User-ID of the advanced practice provider on this team" }
      - { name: tech_user_id, type: string, source: input, description: "User-ID of the field technician on this team" }
      - { name: supervising_physician_user_id, type: string, source: input, description: "User-ID of the remote supervising physician" }
      - { name: skill_tags, type: array, source: input, description: "Capabilities, subset of {POCT, IMAGING, IV_INFUSION, PEDIATRIC}" }
      - { name: status, type: enum, source: system, default: ROSTERED, description: "ROSTERED | AVAILABLE | ON_DISPATCH | OFF_DUTY" }
      - { name: active_dispatch_count, type: integer, source: computed, default: 0, description: "Number of DispatchAssignments in OFFERED/ACCEPTED/EN_ROUTE/ARRIVED for this team" }

  - name: VehicleShift
    parent: null
    common_fields: true
    fields:
      - { name: care_team_id, type: string, source: input, description: "FK -> CareTeam.id; team operating this vehicle for the shift" }
      - { name: market_id, type: string, source: input, description: "FK -> MarketCoverageArea.id; shift's market" }
      - { name: vehicle_plate, type: string, source: input, description: "Vehicle identifier" }
      - { name: window_start, type: datetime, source: input, description: "Shift window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Shift window end (UTC, exclusive); must be after window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ACTIVE | EXTENDED | CLOSED | CANCELLED" }
      - { name: overtime_minutes, type: integer, source: computed, default: 0, description: "Computed at shift close: max(0, actual_end - window_end) in whole minutes" }

  - name: VisitRequest
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: market_id, type: string, source: input, description: "FK -> MarketCoverageArea.id; resolved from patient's home_address_geo at intake" }
      - { name: requestor_role, type: enum, source: input, description: "PATIENT | PAYER | PROVIDER | FACILITY — which intake channel created the request" }
      - { name: chief_complaint, type: string, source: input, description: "Free-text chief complaint" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock timestamp at intake" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | TRIAGE_PENDING | TRIAGED | EMS_DIVERTED | DECLINED | DISPATCH_PENDING | EN_ROUTE | ON_SCENE | DISPOSITIONED | ESCALATED_TRANSPORT | CLAIM_DRAFT | CLAIM_SUBMITTED | CLAIM_ADJUDICATED_PAID | CLAIM_ADJUDICATED_DENIED | CLAIM_APPEALED | CLOSED" }
      - { name: acuity_band, type: enum, source: computed, description: "EMERGENT | URGENT | STANDARD | NON_ACUTE — derived from latest TriageAssessment" }
      - { name: assigned_care_team_id, type: string, source: computed, description: "FK -> CareTeam.id; set when a DispatchAssignment is ACCEPTED, cleared when all dispatch assignments for the visit are CANCELLED or REJECTED" }
      - { name: sla_deadline_at, type: datetime, source: computed, description: "Dispatch-acceptance timestamp + market response window for the acuity band; null until a dispatch is accepted" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "True when OnSiteEncounter.started_at > sla_deadline_at; latched on first arrival" }
      - { name: claim_id, type: string, source: computed, description: "FK -> Claim.id once a claim exists; null otherwise" }

  - name: TriageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: heart_rate, type: integer, source: input, description: "bpm, 20..250" }
      - { name: systolic_bp, type: integer, source: input, description: "mmHg, 40..300" }
      - { name: spo2_pct, type: integer, source: input, description: "O2 saturation percent, 50..100" }
      - { name: is_chest_pain, type: boolean, source: input, description: "Red-flag symptom" }
      - { name: is_stroke_signs, type: boolean, source: input, description: "Red-flag symptom" }
      - { name: is_severe_trauma, type: boolean, source: input, description: "Red-flag symptom" }
      - { name: is_altered_mental_status, type: boolean, source: input, description: "Red-flag symptom" }
      - { name: acuity_score, type: integer, source: computed, description: "0..100; see acuity_score calculation" }
      - { name: outcome, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROPRIATE | EMERGENCY_DIVERTED | INAPPROPRIATE" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp when triage was submitted" }

  - name: EmsHandoff
    parent: null
    common_fields: true
    fields:
      - { name: triage_assessment_id, type: string, source: input, description: "FK -> TriageAssessment.id (1:1 with a diverted triage)" }
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: ems_agency_code, type: string, source: input, description: "Receiving EMS agency" }
      - { name: handoff_reason, type: string, source: input, description: "Clinical reason for the diversion" }
      - { name: handed_off_at, type: datetime, source: system, description: "Logical-clock timestamp of the handoff" }

  - name: DispatchAssignment
    parent: null
    common_fields: true
    fields:
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: care_team_id, type: string, source: input, description: "FK -> CareTeam.id; the selected team (selector policy output)" }
      - { name: vehicle_shift_id, type: string, source: input, description: "FK -> VehicleShift.id; shift the team is operating under" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock timestamp when offer was created" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp when team accepted; null until ACCEPTED" }
      - { name: selection_score, type: number, source: computed, description: "Selector-policy score of the chosen team at offer time (see dispatch_selection_score)" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | REJECTED | EN_ROUTE | ARRIVED | COMPLETED | CANCELLED" }

  - name: OnSiteEncounter
    parent: null
    common_fields: true
    fields:
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id (1:1)" }
      - { name: dispatch_assignment_id, type: string, source: input, description: "FK -> DispatchAssignment.id; the ARRIVED dispatch that produced this encounter" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp of arrival (= dispatch ARRIVED time)" }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock timestamp when disposition recorded; null until then" }
      - { name: status, type: enum, source: system, default: STARTED, description: "STARTED | DIAGNOSTICS | DISPOSITION_REVIEW | DISCHARGED_HOME | ESCALATED_TRANSPORT | ABORTED" }

  - name: DiagnosticOrder
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> OnSiteEncounter.id" }
      - { name: order_kind, type: enum, source: input, description: "POCT | IMAGING | IV_INFUSION" }
      - { name: code, type: string, source: input, description: "Test/imaging/drug code (e.g. 'POCT-STREP-A', 'XR-CHEST-2V', 'IVF-NS-1L')" }
      - { name: units, type: integer, source: input, description: "Units ordered (>=1); for IV_INFUSION, counts against FormularyEntry.max_units_per_visit" }
      - { name: result_value, type: string, source: input, description: "Free-text result payload (required when transitioned to RESULTED)" }
      - { name: physician_preauth_obtained, type: boolean, source: input, default: false, description: "Recorded when the order is for a formulary drug flagged requires_physician_preauth" }
      - { name: physician_preauth_by, type: string, source: input, description: "Supervising physician user-id who authorized; required iff physician_preauth_obtained == true" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Resolved at RESULTED from FormularyEntry.unit_price_cents for IV_INFUSION; otherwise from a fixed price list keyed by code" }
      - { name: line_amount_cents, type: integer, source: computed, description: "= round_half_up(units * unit_price_cents); computed at RESULTED" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED | COLLECTED | RESULTED | VERIFIED | AMENDED | CANCELLED" }

  - name: DispositionDecision
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> OnSiteEncounter.id (1:1)" }
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: disposition, type: enum, source: input, description: "DISCHARGE_HOME | ESCALATE_TO_FACILITY" }
      - { name: rationale, type: string, source: input, description: "Clinical rationale, >= 20 chars" }
      - { name: receiving_facility_id, type: string, source: input, description: "Required iff disposition == ESCALATE_TO_FACILITY; free-form facility identifier" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of disposition" }

  - name: FacilityTransport
    parent: null
    common_fields: true
    fields:
      - { name: disposition_decision_id, type: string, source: input, description: "FK -> DispositionDecision.id (1:1 with an ESCALATE_TO_FACILITY decision)" }
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: transport_mode, type: enum, source: input, description: "GROUND_AMBULANCE | PRIVATE_VEHICLE | WHEELCHAIR_VAN" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp when transport was dispatched" }
      - { name: arrived_at_facility_at, type: datetime, source: system, description: "Logical-clock timestamp when transport arrived at facility; null until arrived" }
      - { name: status, type: enum, source: system, default: DISPATCHED, description: "DISPATCHED | ARRIVED_AT_FACILITY | CANCELLED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id (1:1)" }
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; resolved at draft time from patient's payer_code + visit's market" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Optimistic total assuming every ORDERED-or-later DiagnosticOrder will result; see site_of_service_claim_total (provisional variant)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final total over RESULTED/VERIFIED/AMENDED DiagnosticOrders only; see site_of_service_claim_total (final variant)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last submission" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of last adjudication; null until adjudicated" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ADJUDICATED_PAID | ADJUDICATED_DENIED | APPEALED" }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: line_kind, type: enum, source: input, description: "BASE_VISIT | DIAGNOSTIC | IV_DRUG" }
      - { name: ref_diagnostic_order_id, type: string, source: input, description: "FK -> DiagnosticOrder.id; null for BASE_VISIT lines" }
      - { name: description, type: string, source: input, description: "Line description" }
      - { name: amount_cents, type: integer, source: computed, description: "Per-line amount after rounding; base visit uses the contracted site-of-service rate; diagnostic lines use DiagnosticOrder.line_amount_cents" }

  - name: FollowUpNotice
    parent: null
    common_fields: true
    fields:
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: pcp_npi, type: string, source: input, description: "PCP NPI the notice is routed to (must match Patient.pcp_npi)" }
      - { name: payload_summary, type: string, source: input, description: "Free-text clinical summary (>= 40 chars)" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of send" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | SENT | FAILED" }

  - name: MonitoringCheckIn
    parent: null
    common_fields: true
    fields:
      - { name: visit_request_id, type: string, source: input, description: "FK -> VisitRequest.id" }
      - { name: scheduled_at, type: datetime, source: input, description: "Logical-clock timestamp the check-in is due" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until completed" }
      - { name: outcome, type: enum, source: input, description: "STABLE | WORSENING | EMERGENT — required on completion" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | MISSED | ESCALATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VisitRequest
    initial_state: INTAKE
    terminal_states: [EMS_DIVERTED, DECLINED, CLOSED]
    transitions:
      - from: INTAKE
        to: TRIAGE_PENDING
        trigger: "POST /dh/visit-requests/{id}/triage-assessments (creates TriageAssessment in DRAFT)"
        actor: TriageNurse
        preconditions:
          - "VisitRequest.status == INTAKE (ERR_VR_INVALID_STATE)"
          - "No prior TriageAssessment exists for this VisitRequest (ERR_TRIAGE_ALREADY_EXISTS)"
        side_effects:
          - "VisitRequest.status → TRIAGE_PENDING"
          - "MarketCoverageArea.open_visit_count unchanged (visit already counted at INTAKE)"
      - from: TRIAGE_PENDING
        to: TRIAGED
        trigger: "POST /dh/triage-assessments/{id}/submit with outcome APPROPRIATE"
        actor: TriageNurse
        preconditions:
          - "TriageAssessment.outcome == DRAFT (ERR_TRIAGE_NOT_DRAFT)"
          - "acuity_score computed; NO red-flag symptom true (else must divert)"
        side_effects:
          - "TriageAssessment.outcome → APPROPRIATE"
          - "VisitRequest.acuity_band := derived band (URGENT if acuity_score >= 50 else STANDARD; EMERGENT impossible here)"
          - "VisitRequest.status → TRIAGED"
      - from: TRIAGE_PENDING
        to: EMS_DIVERTED
        trigger: "POST /dh/triage-assessments/{id}/submit with outcome EMERGENCY_DIVERTED"
        actor: TriageNurse
        preconditions:
          - "TriageAssessment.outcome == DRAFT"
          - "acuity_score >= 80 OR any red-flag symptom true"
        side_effects:
          - "TriageAssessment.outcome → EMERGENCY_DIVERTED"
          - "VisitRequest.acuity_band := EMERGENT"
          - "VisitRequest.status → EMS_DIVERTED (terminal)"
          - "EmsHandoff row created (handed_off_at = logical clock)"
          - "MarketCoverageArea.open_visit_count -= 1"
      - from: TRIAGE_PENDING
        to: DECLINED
        trigger: "POST /dh/triage-assessments/{id}/submit with outcome INAPPROPRIATE"
        actor: TriageNurse
        preconditions:
          - "TriageAssessment.outcome == DRAFT"
          - "acuity_score < 30 AND no red-flag symptom true"
        side_effects:
          - "TriageAssessment.outcome → INAPPROPRIATE"
          - "VisitRequest.acuity_band := NON_ACUTE"
          - "VisitRequest.status → DECLINED (terminal)"
          - "MarketCoverageArea.open_visit_count -= 1"
      - from: TRIAGED
        to: DISPATCH_PENDING
        trigger: "POST /dh/visit-requests/{id}/dispatch-offers (selector policy picks a CareTeam)"
        actor: Dispatcher
        preconditions:
          - "VisitRequest.status == TRIAGED (ERR_VR_INVALID_STATE)"
          - "MarketCoverageArea.is_active == true (ERR_MARKET_INACTIVE)"
          - "expected_visit_request_version == current VisitRequest.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "DispatchAssignment created (status=OFFERED) for the selector-policy winner"
          - "CareTeam.active_dispatch_count += 1"
          - "CareTeam.status: AVAILABLE → ON_DISPATCH if active_dispatch_count becomes > 0"
          - "VisitRequest.status → DISPATCH_PENDING"
          - "VisitRequest.version += 1"
      - from: DISPATCH_PENDING
        to: EN_ROUTE
        trigger: "POST /dh/dispatch-assignments/{id}/accept"
        actor: CareTeamMember
        preconditions:
          - "DispatchAssignment.status == OFFERED (ERR_DISPATCH_INVALID_STATE)"
          - "Acting user's id == DispatchAssignment.care_team.app_user_id OR .tech_user_id (ERR_NOT_ASSIGNED_TEAM_MEMBER)"
          - "VehicleShift.status ∈ {SCHEDULED, ACTIVE} AND logical clock < window_end (ERR_SHIFT_NOT_OPERATIONAL)"
        side_effects:
          - "DispatchAssignment.status → ACCEPTED, accepted_at = logical clock"
          - "DispatchAssignment.status → EN_ROUTE (composite)"
          - "VisitRequest.assigned_care_team_id := DispatchAssignment.care_team_id"
          - "VisitRequest.sla_deadline_at := accepted_at + market.response_window_minutes_<band>"
          - "VisitRequest.status → EN_ROUTE"
      - from: DISPATCH_PENDING
        to: TRIAGED
        trigger: "POST /dh/dispatch-assignments/{id}/reject"
        actor: CareTeamMember
        preconditions:
          - "DispatchAssignment.status == OFFERED"
        side_effects:
          - "DispatchAssignment.status → REJECTED"
          - "CareTeam.active_dispatch_count -= 1"
          - "If CareTeam.active_dispatch_count becomes 0: CareTeam.status → AVAILABLE"
          - "VisitRequest.status → TRIAGED (returns to TRIAGED for a fresh offer; cyclic loop DISPATCH_PENDING ↔ TRIAGED)"
      - from: EN_ROUTE
        to: ON_SCENE
        trigger: "POST /dh/dispatch-assignments/{id}/arrive"
        actor: CareTeamMember
        preconditions:
          - "DispatchAssignment.status == EN_ROUTE (ERR_DISPATCH_INVALID_STATE)"
        side_effects:
          - "DispatchAssignment.status → ARRIVED"
          - "OnSiteEncounter created (status=STARTED, started_at = logical clock)"
          - "VisitRequest.status → ON_SCENE"
          - "If OnSiteEncounter.started_at > VisitRequest.sla_deadline_at: VisitRequest.sla_breached := true (latched)"
      - from: ON_SCENE
        to: DISPOSITIONED
        trigger: "POST /dh/encounters/{id}/disposition-decisions with disposition=DISCHARGE_HOME"
        actor: AdvancedPracticeProvider
        preconditions:
          - "OnSiteEncounter.status == DISPOSITION_REVIEW (ERR_ENCOUNTER_INVALID_STATE)"
          - "Every DiagnosticOrder for the encounter is in {RESULTED, VERIFIED, AMENDED, CANCELLED} (ERR_UNRESOLVED_DIAGNOSTICS)"
        side_effects:
          - "DispositionDecision created (decided_at = logical clock)"
          - "OnSiteEncounter.status → DISCHARGED_HOME; ended_at = logical clock"
          - "VisitRequest.status → DISPOSITIONED"
          - "DispatchAssignment.status → COMPLETED; CareTeam.active_dispatch_count -= 1; if 0 → CareTeam.status = AVAILABLE"
          - "Claim row auto-created (status=DRAFT) with provisional_total_cents + final_total_cents computed"
          - "VisitRequest.claim_id := new Claim.id"
          - "MonitoringCheckIn schedule initialized (two check-ins at +24h and +72h from ended_at)"
      - from: ON_SCENE
        to: ESCALATED_TRANSPORT
        trigger: "POST /dh/encounters/{id}/disposition-decisions with disposition=ESCALATE_TO_FACILITY"
        actor: AdvancedPracticeProvider
        preconditions:
          - "OnSiteEncounter.status == DISPOSITION_REVIEW"
          - "receiving_facility_id present in request body (ERR_FACILITY_REQUIRED)"
        side_effects:
          - "DispositionDecision created with disposition=ESCALATE_TO_FACILITY"
          - "FacilityTransport row auto-created (status=DISPATCHED)"
          - "OnSiteEncounter.status → ESCALATED_TRANSPORT; ended_at = logical clock"
          - "VisitRequest.status → ESCALATED_TRANSPORT"
          - "DispatchAssignment.status → COMPLETED; CareTeam.active_dispatch_count -= 1; if 0 → CareTeam.status = AVAILABLE"
          - "Claim row auto-created (status=DRAFT) — partial services rendered ARE billable"
          - "No MonitoringCheckIn schedule created (patient's follow-up belongs to facility)"
      - from: ESCALATED_TRANSPORT
        to: CLAIM_DRAFT
        trigger: "POST /dh/facility-transports/{id}/mark-arrived"
        actor: Dispatcher
        preconditions:
          - "FacilityTransport.status == DISPATCHED"
        side_effects:
          - "FacilityTransport.status → ARRIVED_AT_FACILITY; arrived_at_facility_at = logical clock"
          - "VisitRequest.status → CLAIM_DRAFT (claim now ready for submission)"
      - from: DISPOSITIONED
        to: CLAIM_DRAFT
        trigger: "system (automatic when Claim DRAFT exists and FollowUpNotice has been QUEUED)"
        actor: system
        preconditions:
          - "Claim.status == DRAFT"
          - "FollowUpNotice for the visit exists in status QUEUED"
        side_effects:
          - "VisitRequest.status → CLAIM_DRAFT"
      - from: CLAIM_DRAFT
        to: CLAIM_SUBMITTED
        trigger: "POST /dh/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status == DRAFT (ERR_CLAIM_INVALID_STATE)"
          - "Claim.final_total_cents <= PayerContract.max_claim_cents (ERR_CLAIM_CAP_EXCEEDED)"
          - "expected_visit_request_version == current VisitRequest.version (OCC)"
        side_effects:
          - "Claim.status → SUBMITTED; submitted_at = logical clock"
          - "VisitRequest.status → CLAIM_SUBMITTED"
          - "VisitRequest.version += 1"
      - from: CLAIM_SUBMITTED
        to: CLAIM_ADJUDICATED_PAID
        trigger: "POST /dh/claims/{id}/adjudicate with outcome=PAID"
        actor: PayerAdjudicator
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "Claim.status → ADJUDICATED_PAID; adjudicated_at = logical clock"
          - "VisitRequest.status → CLAIM_ADJUDICATED_PAID"
      - from: CLAIM_SUBMITTED
        to: CLAIM_ADJUDICATED_DENIED
        trigger: "POST /dh/claims/{id}/adjudicate with outcome=DENIED"
        actor: PayerAdjudicator
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "Claim.status → ADJUDICATED_DENIED; adjudicated_at = logical clock"
          - "VisitRequest.status → CLAIM_ADJUDICATED_DENIED"
      - from: CLAIM_ADJUDICATED_DENIED
        to: CLAIM_APPEALED
        trigger: "POST /dh/claims/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status == ADJUDICATED_DENIED"
        side_effects:
          - "Claim.status → APPEALED"
          - "VisitRequest.status → CLAIM_APPEALED"
      - from: CLAIM_APPEALED
        to: CLAIM_SUBMITTED
        trigger: "POST /dh/claims/{id}/resubmit"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status == APPEALED"
          - "appeal round <= 2 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "Claim.status → SUBMITTED; submitted_at = logical clock (cycle SUBMITTED → DENIED → APPEALED → SUBMITTED)"
          - "VisitRequest.status → CLAIM_SUBMITTED"
      - from: CLAIM_ADJUDICATED_PAID
        to: CLOSED
        trigger: "system (automatic when no SCHEDULED or MISSED MonitoringCheckIn remains for the visit)"
        actor: system
        preconditions:
          - "Claim.status == ADJUDICATED_PAID"
          - "∀ MonitoringCheckIn for visit: status ∈ {COMPLETED, ESCALATED}"
        side_effects:
          - "VisitRequest.status → CLOSED (terminal)"
          - "MarketCoverageArea.open_visit_count -= 1"

  - entity: TriageAssessment
    initial_state: DRAFT
    terminal_states: [APPROPRIATE, EMERGENCY_DIVERTED, INAPPROPRIATE]
    transitions:
      - from: DRAFT
        to: APPROPRIATE
        trigger: "POST /dh/triage-assessments/{id}/submit"
        actor: TriageNurse
        preconditions:
          - "acuity_score >= 30 AND acuity_score < 80"
          - "No red-flag symptom true (ERR_RED_FLAG_REQUIRES_EMS)"
        side_effects: ["see VisitRequest TRIAGE_PENDING→TRIAGED"]
      - from: DRAFT
        to: EMERGENCY_DIVERTED
        trigger: "POST /dh/triage-assessments/{id}/submit"
        actor: TriageNurse
        preconditions:
          - "acuity_score >= 80 OR any red-flag symptom true"
        side_effects: ["see VisitRequest TRIAGE_PENDING→EMS_DIVERTED"]
      - from: DRAFT
        to: INAPPROPRIATE
        trigger: "POST /dh/triage-assessments/{id}/submit"
        actor: TriageNurse
        preconditions:
          - "acuity_score < 30 AND no red-flag symptom true"
        side_effects: ["see VisitRequest TRIAGE_PENDING→DECLINED"]

  - entity: DispatchAssignment
    initial_state: OFFERED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /dh/dispatch-assignments/{id}/accept"
        actor: CareTeamMember
        preconditions: ["DispatchAssignment.status == OFFERED"]
        side_effects: ["status → ACCEPTED, accepted_at = now"]
      - from: ACCEPTED
        to: EN_ROUTE
        trigger: "system (composite with parent VisitRequest transition)"
        actor: system
        preconditions: []
        side_effects: ["status → EN_ROUTE"]
      - from: OFFERED
        to: REJECTED
        trigger: "POST /dh/dispatch-assignments/{id}/reject"
        actor: CareTeamMember
        preconditions: ["DispatchAssignment.status == OFFERED"]
        side_effects: ["CareTeam.active_dispatch_count -= 1"]
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /dh/dispatch-assignments/{id}/cancel"
        actor: Dispatcher
        preconditions: ["DispatchAssignment.status == OFFERED"]
        side_effects: ["CareTeam.active_dispatch_count -= 1", "VisitRequest.status → TRIAGED"]
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /dh/dispatch-assignments/{id}/arrive"
        actor: CareTeamMember
        preconditions: ["DispatchAssignment.status == EN_ROUTE"]
        side_effects: ["OnSiteEncounter created"]
      - from: ARRIVED
        to: COMPLETED
        trigger: "system (when OnSiteEncounter ends in DISCHARGED_HOME or ESCALATED_TRANSPORT)"
        actor: system
        preconditions: []
        side_effects: ["CareTeam.active_dispatch_count -= 1"]

  - entity: CareTeam
    initial_state: ROSTERED
    terminal_states: [OFF_DUTY]
    transitions:
      - from: ROSTERED
        to: AVAILABLE
        trigger: "POST /dh/care-teams/{id}/go-available"
        actor: Dispatcher
        preconditions: ["CareTeam.status == ROSTERED"]
        side_effects: []
      - from: AVAILABLE
        to: ON_DISPATCH
        trigger: "system (when first DispatchAssignment created for this team)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_DISPATCH
        to: AVAILABLE
        trigger: "system (when active_dispatch_count drops to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "POST /dh/care-teams/{id}/go-off-duty"
        actor: Dispatcher
        preconditions:
          - "CareTeam.status == AVAILABLE"
          - "active_dispatch_count == 0 (ERR_TEAM_HAS_ACTIVE_DISPATCH)"
        side_effects: []

  - entity: VehicleShift
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /dh/vehicle-shifts/{id}/start"
        actor: Dispatcher
        preconditions:
          - "VehicleShift.status == SCHEDULED"
          - "logical clock >= window_start AND < window_end (ERR_SHIFT_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /dh/vehicle-shifts/{id}/extend"
        actor: Dispatcher
        preconditions:
          - "VehicleShift.status == ACTIVE"
          - "new_window_end > current window_end"
        side_effects: ["window_end := new_window_end"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /dh/vehicle-shifts/{id}/close"
        actor: Dispatcher
        preconditions:
          - "VehicleShift.status ∈ {ACTIVE, EXTENDED}"
          - "care_team.active_dispatch_count == 0 (ERR_TEAM_HAS_ACTIVE_DISPATCH)"
        side_effects:
          - "overtime_minutes := max(0, logical_clock - window_end) in whole minutes"
      - from: EXTENDED
        to: CLOSED
        trigger: "POST /dh/vehicle-shifts/{id}/close"
        actor: Dispatcher
        preconditions: ["same as ACTIVE→CLOSED"]
        side_effects: ["overtime_minutes computed against the extended window_end"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dh/vehicle-shifts/{id}/cancel"
        actor: Dispatcher
        preconditions: ["VehicleShift.status == SCHEDULED"]
        side_effects: []

  - entity: OnSiteEncounter
    initial_state: STARTED
    terminal_states: [DISCHARGED_HOME, ESCALATED_TRANSPORT, ABORTED]
    transitions:
      - from: STARTED
        to: DIAGNOSTICS
        trigger: "POST /dh/encounters/{id}/diagnostic-orders (first order created)"
        actor: AdvancedPracticeProvider
        preconditions: ["OnSiteEncounter.status == STARTED"]
        side_effects: []
      - from: DIAGNOSTICS
        to: DISPOSITION_REVIEW
        trigger: "POST /dh/encounters/{id}/begin-disposition-review"
        actor: AdvancedPracticeProvider
        preconditions:
          - "OnSiteEncounter.status ∈ {STARTED, DIAGNOSTICS}"
          - "Every DiagnosticOrder for this encounter is in {RESULTED, VERIFIED, AMENDED, CANCELLED} (ERR_UNRESOLVED_DIAGNOSTICS)"
        side_effects: []
      - from: STARTED
        to: DISPOSITION_REVIEW
        trigger: "POST /dh/encounters/{id}/begin-disposition-review (with zero orders)"
        actor: AdvancedPracticeProvider
        preconditions: ["OnSiteEncounter.status == STARTED AND zero DiagnosticOrders"]
        side_effects: []
      - from: DISPOSITION_REVIEW
        to: DISCHARGED_HOME
        trigger: "POST /dh/encounters/{id}/disposition-decisions with disposition=DISCHARGE_HOME"
        actor: AdvancedPracticeProvider
        preconditions: ["OnSiteEncounter.status == DISPOSITION_REVIEW"]
        side_effects: ["ended_at = now", "Claim auto-created", "MonitoringCheckIn schedule created"]
      - from: DISPOSITION_REVIEW
        to: ESCALATED_TRANSPORT
        trigger: "POST /dh/encounters/{id}/disposition-decisions with disposition=ESCALATE_TO_FACILITY"
        actor: AdvancedPracticeProvider
        preconditions: ["OnSiteEncounter.status == DISPOSITION_REVIEW", "receiving_facility_id present"]
        side_effects: ["ended_at = now", "FacilityTransport auto-created", "Claim auto-created"]
      - from: STARTED
        to: ABORTED
        trigger: "POST /dh/encounters/{id}/abort"
        actor: AdvancedPracticeProvider
        preconditions:
          - "OnSiteEncounter.status == STARTED"
          - "Zero DiagnosticOrders exist (ERR_ENCOUNTER_HAS_ORDERS)"
        side_effects:
          - "ended_at = now"
          - "DispatchAssignment.status → COMPLETED"
          - "VisitRequest.status → TRIAGED (eligible for a fresh dispatch offer)"

  - entity: DiagnosticOrder
    initial_state: ORDERED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /dh/diagnostic-orders/{id}/collect"
        actor: FieldTechnician
        preconditions: ["DiagnosticOrder.status == ORDERED"]
        side_effects: []
      - from: COLLECTED
        to: RESULTED
        trigger: "POST /dh/diagnostic-orders/{id}/result"
        actor: FieldTechnician
        preconditions:
          - "DiagnosticOrder.status == COLLECTED"
          - "result_value present in request (ERR_RESULT_REQUIRED)"
        side_effects:
          - "line_amount_cents := round_half_up(units * unit_price_cents)"
          - "Claim (if exists) recomputes provisional_total_cents + final_total_cents"
      - from: RESULTED
        to: VERIFIED
        trigger: "POST /dh/diagnostic-orders/{id}/verify"
        actor: SupervisingPhysician
        preconditions:
          - "DiagnosticOrder.status == RESULTED"
          - "Segregation of duties: acting user id != the FieldTechnician who resulted the order (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: RESULTED
        to: AMENDED
        trigger: "POST /dh/diagnostic-orders/{id}/amend"
        actor: FieldTechnician
        preconditions:
          - "DiagnosticOrder.status == RESULTED"
          - "new result_value differs from current (ERR_AMEND_NO_CHANGE)"
        side_effects:
          - "result_value := new value; status → AMENDED (cycle RESULTED → AMENDED → RESULTED via re-result)"
      - from: AMENDED
        to: RESULTED
        trigger: "POST /dh/diagnostic-orders/{id}/result (re-result after amend)"
        actor: FieldTechnician
        preconditions: ["DiagnosticOrder.status == AMENDED", "result_value present"]
        side_effects: ["line_amount_cents recomputed"]
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /dh/diagnostic-orders/{id}/cancel"
        actor: AdvancedPracticeProvider
        preconditions: ["DiagnosticOrder.status == ORDERED"]
        side_effects: ["If Claim exists: provisional_total_cents recomputed (drops the cancelled line)"]

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [ADJUDICATED_PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dh/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions: ["Claim.status == DRAFT", "final_total_cents <= max_claim_cents"]
        side_effects: ["submitted_at = now"]
      - from: SUBMITTED
        to: ADJUDICATED_PAID
        trigger: "POST /dh/claims/{id}/adjudicate (PAID)"
        actor: PayerAdjudicator
        preconditions: ["Claim.status == SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: ADJUDICATED_DENIED
        trigger: "POST /dh/claims/{id}/adjudicate (DENIED)"
        actor: PayerAdjudicator
        preconditions: ["Claim.status == SUBMITTED"]
        side_effects: []
      - from: ADJUDICATED_DENIED
        to: APPEALED
        trigger: "POST /dh/claims/{id}/appeal"
        actor: BillingSpecialist
        preconditions: ["Claim.status == ADJUDICATED_DENIED"]
        side_effects: []
      - from: APPEALED
        to: SUBMITTED
        trigger: "POST /dh/claims/{id}/resubmit"
        actor: BillingSpecialist
        preconditions: ["Claim.status == APPEALED", "appeal round <= 2"]
        side_effects: ["submitted_at = now (cycle)"]

  - entity: MonitoringCheckIn
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ESCALATED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /dh/monitoring-checkins/{id}/complete"
        actor: TriageNurse
        preconditions:
          - "MonitoringCheckIn.status == SCHEDULED"
          - "logical clock >= scheduled_at (ERR_CHECKIN_NOT_DUE)"
          - "outcome present"
        side_effects:
          - "completed_at = now"
          - "If outcome == EMERGENT: a NEW VisitRequest is auto-created (requestor_role=PROVIDER) in INTAKE for the same patient — transitive cascade"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (when logical clock > scheduled_at + 6 hours and still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "VisitRequest.sla_breached NOT touched (separate metric)"
          - "monitoring_adherence_ratio recomputed for the visit"
      - from: MISSED
        to: ESCALATED
        trigger: "POST /dh/monitoring-checkins/{id}/escalate"
        actor: TriageNurse
        preconditions: ["MonitoringCheckIn.status == MISSED"]
        side_effects: ["A NEW VisitRequest is auto-created (requestor_role=PROVIDER) in INTAKE for the same patient"]

  - entity: FacilityTransport
    initial_state: DISPATCHED
    terminal_states: [ARRIVED_AT_FACILITY, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: ARRIVED_AT_FACILITY
        trigger: "POST /dh/facility-transports/{id}/mark-arrived"
        actor: Dispatcher
        preconditions: ["FacilityTransport.status == DISPATCHED"]
        side_effects: ["arrived_at_facility_at = now", "VisitRequest.status → CLAIM_DRAFT"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /dh/facility-transports/{id}/cancel"
        actor: Dispatcher
        preconditions: ["FacilityTransport.status == DISPATCHED"]
        side_effects: ["VisitRequest.status → ON_SCENE (escalation reversed; encounter stays ESCALATED_TRANSPORT for audit)"]

  - entity: FollowUpNotice
    initial_state: QUEUED
    terminal_states: [SENT, FAILED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /dh/follow-up-notices/{id}/mark-sent"
        actor: TriageNurse
        preconditions: ["FollowUpNotice.status == QUEUED"]
        side_effects: ["sent_at = now"]
      - from: QUEUED
        to: FAILED
        trigger: "POST /dh/follow-up-notices/{id}/mark-failed"
        actor: TriageNurse
        preconditions: ["FollowUpNotice.status == QUEUED"]
        side_effects: []

  - entity: PayerContract
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dh/payer-contracts/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "PayerContract.status == DRAFT"
          - "effective_from < effective_to (ERR_CONTRACT_WINDOW_INVALID)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (when logical clock >= effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dh/payer-contracts/{id}/terminate"
        actor: PlatformAdmin
        preconditions: ["PayerContract.status == ACTIVE"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: dispatch-offer-stale-visit-version
    parent_entity: VisitRequest
    write_endpoint: "POST /dh/visit-requests/{id}/dispatch-offers"
    occ_field: expected_visit_request_version
    description: |
      Creating a DispatchAssignment against a VisitRequest whose version has
      advanced since the dispatcher last read it is rejected. This captures
      the case where another writer has just mutated the visit (e.g. a new
      triage submission that reclassified acuity) and the dispatcher's view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-submit-stale-visit-version
    parent_entity: VisitRequest
    write_endpoint: "POST /dh/claims/{id}/submit"
    occ_field: expected_visit_request_version
    description: |
      Submitting a Claim against a VisitRequest whose version has advanced
      since the billing specialist last read it is rejected. A new
      DiagnosticOrder resulted in the interim would silently change
      final_total_cents, so the specialist's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: acuity_score
    trigger: "TriageAssessment submission (POST /dh/triage-assessments/{id}/submit)"
    algorithm: weighted_scoring
    formula: |
      Inputs (all from the TriageAssessment being submitted + the linked Patient):
        hr_score      = clamp(0, 25, abs(heart_rate - 80) // 4)          # 0..25
        bp_score      = 25 if systolic_bp < 90 or systolic_bp > 180
                        else clamp(0, 15, abs(systolic_bp - 120) // 5)   # 0..25
        spo2_score    = clamp(0, 25, (95 - spo2_pct) * 2) if spo2_pct < 95 else 0   # 0..25
        red_flag_pts  = 20 * count_true(is_chest_pain, is_stroke_signs, is_severe_trauma, is_altered_mental_status)
        age           = floor((logical_clock_date - patient.date_of_birth) / 365.25)
        age_pts       = 10 if age >= 75 else (5 if age >= 65 else 0)
        comorb_pts    = min(15, patient.comorbidity_count * 3)
      Raw score = hr_score + bp_score + spo2_score + red_flag_pts + age_pts + comorb_pts
      acuity_score = clamp(0, 100, raw_score)                            # integer
      Band mapping (decided by score AND red-flag presence, NOT by score alone):
        if any red-flag symptom true                -> EMERGENT (mandatory EMS diversion)
        elif acuity_score >= 80                     -> EMERGENT
        elif acuity_score >= 50                     -> URGENT
        elif acuity_score >= 30                     -> STANDARD
        else                                        -> NON_ACUTE
      Evaluation order is fixed: red_flag check FIRST, then score thresholds.
    constants:
      EMERGENT_SCORE_THRESHOLD: 80
      URGENT_SCORE_THRESHOLD: 50
      STANDARD_SCORE_THRESHOLD: 30
      RED_FLAG_WEIGHT: 20
      AGE_GERIATRIC_THRESHOLD: 75
      AGE_SENIOR_THRESHOLD: 65
    precision: "integer score; all intermediate divisions are integer floor"
    variants:
      - name: red_flag_override
        when: "any red-flag symptom is true"
        difference: "band is EMERGENT regardless of numeric score (even if acuity_score < 80)"
      - name: numeric_only
        when: "no red-flag symptom"
        difference: "band is decided purely by acuity_score thresholds"

  - name: sla_deadline
    trigger: "DispatchAssignment acceptance (POST /dh/dispatch-assignments/{id}/accept)"
    algorithm: forward_looking
    formula: |
      sla_deadline_at = accepted_at + market.response_window_minutes_<band>
      where <band> is 'urgent' if VisitRequest.acuity_band == URGENT else 'standard'.
      EMERGENT-band visits never reach dispatch (diverted), so no EMERGENT window exists.
      sla_breached is latched at encounter arrival:
        sla_breached := (OnSiteEncounter.started_at > sla_deadline_at)   # strict >
      Boundary: arrival exactly AT sla_deadline_at is NOT a breach (> not >=).
    constants:
      COMPARATOR: ">"
    precision: "second-precision UTC timestamps"

  - name: dispatch_selection_score
    trigger: "POST /dh/visit-requests/{id}/dispatch-offers (selector policy)"
    algorithm: weighted_scoring
    formula: |
      Candidate set: CareTeams where
        market_id == VisitRequest.market_id
        AND status == AVAILABLE
        AND active_dispatch_count == 0
        AND there exists a VehicleShift for the team in the same market with
            status ∈ {SCHEDULED, ACTIVE} AND window_start <= logical_clock < window_end
        AND skill_tags covers the visit's required skills:
            required_skills = {POCT} ∪ {IMAGING if chief_complaint contains 'injury' or 'fall'}
                                  ∪ {IV_INFUSION if chief_complaint contains 'dehydrat'}
      Score (higher is better):
        score = 1000 - (active_dispatch_count * 100) - (minutes_since_available)
      where minutes_since_available is whole minutes between CareTeam.updated_at
      (last transition to AVAILABLE) and the logical clock.
      Tie-break order (in order):
        1. Higher score
        2. Earlier CareTeam.created_at (deterministic; never id)
      Empty-pool fallback: refuse with ERR_NO_AVAILABLE_CARE_TEAM.
    constants:
      DISPATCH_PENALTY_PER_ACTIVE: 100
    precision: "score is integer minutes; ties broken on created_at ASC"
    variants:
      - name: strict_skill_match
        when: "visit requires any of {IMAGING, IV_INFUSION}"
        difference: "teams missing any required skill are excluded from the candidate set entirely"
      - name: default_pool
        when: "visit requires only POCT"
        difference: "all teams in the market with status AVAILABLE are candidates (every rostered team has POCT)"

  - name: site_of_service_claim_total
    trigger: "Claim creation, DiagnosticOrder result/cancel/amend, Claim submission"
    algorithm: tiered_pricing
    formula: |
      base_rate_cents  = (URGENT ? payer_contract.urgent_base_rate_cents
                                 : payer_contract.standard_base_rate_cents)
      base_line_cents  = round_half_up(base_rate_cents * payer_contract.place_of_service_modifier_pct)
      # Per-line rounding THEN sum (rounding order is pinned; do NOT sum then round):
      diagnostic_total = Σ round_half_up(order.units * order.unit_price_cents)
                         over the variant-specific inclusion set
      total_cents      = base_line_cents + diagnostic_total
    constants:
      ROUNDING: "round_half_up at integer cents per line, THEN sum"
    precision: "integer cents; rounding is per-line then summed"
    variants:
      - name: provisional
        when: "Claim.status == DRAFT and DiagnosticOrder.status ∈ {ORDERED, COLLECTED, RESULTED, AMENDED}"
        difference: "includes lines whose orders have not yet RESULTED; uses each order's CURRENT unit_price_cents estimate (formulary price for IV_INFUSION, list price otherwise); VERIFIED and CANCELLED orders excluded"
      - name: final
        when: "Claim.status != DRAFT, or any read of final_total_cents"
        difference: "includes only DiagnosticOrders in {RESULTED, VERIFIED, AMENDED}; CANCELLED excluded; result is what is submitted to the payer"

  - name: claim_cap_check
    trigger: "Claim submission (POST /dh/claims/{id}/submit)"
    algorithm: threshold
    formula: |
      if claim.final_total_cents > payer_contract.max_claim_cents:
        reject ERR_CLAIM_CAP_EXCEEDED (HTTP 422)
      Boundary: final_total_cents == max_claim_cents is ALLOWED (strict >).
    constants:
      COMPARATOR: ">"
    precision: "integer cents"

  - name: overtime_shift_premium
    trigger: "VehicleShift close (POST /dh/vehicle-shifts/{id}/close)"
    algorithm: aggregation
    formula: |
      overtime_minutes = max(0, floor((logical_clock - window_end) / 60 seconds))
      If overtime_minutes > 0:
        shift_premium_cents = overtime_minutes * 75    # 75 cents per overtime minute
      else:
        shift_premium_cents = 0
      shift_premium_cents is reported on the VehicleShift row (computed field).
    constants:
      OVERTIME_CENTS_PER_MINUTE: 75
    precision: "integer minutes, integer cents"

  - name: monitoring_adherence_ratio
    trigger: "MonitoringCheckIn completion / miss / escalation"
    algorithm: aggregation
    formula: |
      For a given VisitRequest, over the check-ins created at disposition:
        scheduled = count of MonitoringCheckIn rows (any status)
        completed = count of MonitoringCheckIn with status == COMPLETED
        adherence_ratio = completed / scheduled  if scheduled > 0 else null
      Precision: ratio is exposed as a percentage rounded_half_up to whole percent.
    constants: {}
    precision: "whole-percent, round_half_up"

  - name: readmission_risk_score
    trigger: "OnSiteEncounter ends (DISCHARGED_HOME or ESCALATED_TRANSPORT)"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if acuity_band == URGENT:                       score += 30
      if patient.comorbidity_count >= 3:              score += 25
      if any DiagnosticOrder of kind IV_INFUSION was RESULTED/VERIFIED: score += 20
      if disposition == ESCALATE_TO_FACILITY:         score += 25
      if age >= 75:                                    score += 15
      if any MonitoringCheckIn was MISSED:             score += 10
      score = clamp(0, 100, score)
      Tier mapping:
        score >= 60  -> HIGH     (FollowUpNotice payload_summary must mention 'high-risk')
        30 <= score < 60 -> MEDIUM
        else -> LOW
    constants:
      HIGH_THRESHOLD: 60
      MEDIUM_THRESHOLD: 30
    precision: "integer score"
    variants:
      - name: with_transport
        when: "disposition == ESCALATE_TO_FACILITY"
        difference: "includes the +25 escalation bump"
      - name: home_discharge
        when: "disposition == DISCHARGE_HOME"
        difference: "no escalation bump; tier typically MEDIUM or LOW"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and parseable"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted on the endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path id must resolve to an existing entity (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Every FK in request body (patient_id, market_id, care_team_id, etc.) must resolve"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK payload fields"
  - priority: 5
    category: business_referential
    check: "OCC: expected_visit_request_version must equal VisitRequest.version when supplied on dispatch-offer / claim-submit"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dh/visit-requests/{id}/dispatch-offers, POST /dh/claims/{id}/submit"
  - priority: 6
    category: state
    check: "Target entity must be in a state from which the requested transition is defined"
    error_id: ERR_VR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "MarketCoverageArea.is_active must be true to accept new VisitRequests or dispatch offers in that market"
    error_id: ERR_MARKET_INACTIVE
    http_status: 409
    applies_to: "POST /dh/visit-requests, POST /dh/visit-requests/{id}/dispatch-offers"
  - priority: 8
    category: business_safety
    check: "Patient.home_address_geo must lie inside MarketCoverageArea.polygon_geojson for the chosen market_id"
    error_id: ERR_OUT_OF_COVERAGE
    http_status: 422
    applies_to: "POST /dh/visit-requests"
  - priority: 9
    category: business_safety
    check: "TriageAssessment submit: red-flag symptoms force outcome=EMERGENCY_DIVERTED; submitting APPROPRIATE with any red-flag is rejected"
    error_id: ERR_RED_FLAG_REQUIRES_EMS
    http_status: 422
    applies_to: "POST /dh/triage-assessments/{id}/submit"
  - priority: 10
    category: business_safety
    check: "TriageAssessment submit: outcome=INAPPROPRIATE requires acuity_score < 30"
    error_id: ERR_ACUITY_TOO_HIGH_FOR_DECLINE
    http_status: 422
    applies_to: "POST /dh/triage-assessments/{id}/submit"
  - priority: 11
    category: business_safety
    check: "TriageAssessment submit: outcome=EMERGENCY_DIVERTED requires acuity_score >= 80 OR a red-flag symptom"
    error_id: ERR_ACUITY_TOO_LOW_FOR_DIVERSION
    http_status: 422
    applies_to: "POST /dh/triage-assessments/{id}/submit"
  - priority: 12
    category: business_referential
    check: "A second TriageAssessment for the same VisitRequest is forbidden"
    error_id: ERR_TRIAGE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /dh/visit-requests/{id}/triage-assessments"
  - priority: 13
    category: business_constraint
    check: "Dispatch offer selector must find at least one eligible CareTeam (per dispatch_selection_score candidate filter)"
    error_id: ERR_NO_AVAILABLE_CARE_TEAM
    http_status: 409
    applies_to: "POST /dh/visit-requests/{id}/dispatch-offers"
  - priority: 14
    category: business_temporal
    check: "VehicleShift referenced by a dispatch offer must satisfy window_start <= logical_clock < window_end AND status ∈ {SCHEDULED, ACTIVE}"
    error_id: ERR_SHIFT_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /dh/dispatch-assignments/{id}/accept"
  - priority: 15
    category: business_referential
    check: "Acting user on dispatch accept/reject/arrive must be a member of the assigned CareTeam (app_user_id or tech_user_id)"
    error_id: ERR_NOT_ASSIGNED_TEAM_MEMBER
    http_status: 403
    applies_to: "POST /dh/dispatch-assignments/{id}/{accept,reject,arrive}"
  - priority: 16
    category: business_referential
    check: "DiagnosticOrder create: encounter must be in {STARTED, DIAGNOSTICS}; creates on terminal encounters rejected"
    error_id: ERR_ENCOUNTER_INVALID_STATE
    http_status: 409
    applies_to: "POST /dh/encounters/{id}/diagnostic-orders"
  - priority: 17
    category: business_safety
    check: "IV_INFUSION DiagnosticOrder: total units across all RESULTED/VERIFIED/AMENDED/ORDERED IV orders for the encounter of the same drug_code must not exceed FormularyEntry.max_units_per_visit (per-visit cap)"
    error_id: ERR_FORMULARY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /dh/encounters/{id}/diagnostic-orders"
  - priority: 18
    category: business_safety
    check: "IV_INFUSION DiagnosticOrder: when FormularyEntry.requires_physician_preauth is true, physician_preauth_obtained must be true AND physician_preauth_by must equal the team's supervising_physician_user_id"
    error_id: ERR_PREAUTH_REQUIRED
    http_status: 422
    applies_to: "POST /dh/encounters/{id}/diagnostic-orders"
  - priority: 19
    category: business_referential
    check: "Disposition begin-review: every DiagnosticOrder for the encounter must be in {RESULTED, VERIFIED, AMENDED, CANCELLED}"
    error_id: ERR_UNRESOLVED_DIAGNOSTICS
    http_status: 409
    applies_to: "POST /dh/encounters/{id}/begin-disposition-review"
  - priority: 20
    category: business_safety
    check: "Segregation of duties: DiagnosticOrder verify actor id must differ from the result actor id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /dh/diagnostic-orders/{id}/verify"
  - priority: 21
    category: business_fiscal
    check: "Claim submission: final_total_cents <= PayerContract.max_claim_cents"
    error_id: ERR_CLAIM_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /dh/claims/{id}/submit"
  - priority: 22
    category: business_temporal
    check: "PayerContract effective window must contain the encounter's ended_at (i.e. effective_from <= ended_at < effective_to) AND status == ACTIVE at claim submission"
    error_id: ERR_CONTRACT_NOT_IN_FORCE
    http_status: 422
    applies_to: "POST /dh/claims/{id}/submit"
  - priority: 23
    category: business_temporal
    check: "MonitoringCheckIn complete: logical clock must be >= scheduled_at"
    error_id: ERR_CHECKIN_NOT_DUE
    http_status: 409
    applies_to: "POST /dh/monitoring-checkins/{id}/complete"
  - priority: 24
    category: business_fiscal
    check: "Claim appeal: appeal round must be < 2 (i.e. at most 2 appeals)"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /dh/claims/{id}/resubmit"
  - priority: 25
    category: business_constraint
    check: "FollowUpNotice create: pcp_npi must match the Patient.pcp_npi on the visit"
    error_id: ERR_PCP_MISMATCH
    http_status: 422
    applies_to: "POST /dh/visit-requests/{id}/follow-up-notices"
  - priority: 26
    category: business_constraint
    check: "Payload field-shape checks (rationale length, summary length, enum membership, datetime ordering on shift window)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; mandatory default) ---
  - method: POST
    path: "/dh/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

  # --- MarketCoverageArea ---
  - method: POST
    path: "/dh/markets"
    description: "Create a MarketCoverageArea"
    roles: [PlatformAdmin]
    code: 201
    input: [market_code, display_name, polygon_geojson, response_window_minutes_urgent, response_window_minutes_standard, "is_active?"]
    output: MarketCoverageArea
    side_effects: []
  - method: GET
    path: "/dh/markets"
    description: "List markets"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: "MarketCoverageArea[]"
    side_effects: []
  - method: GET
    path: "/dh/markets/{id}"
    description: "Get one market"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: []
    output: MarketCoverageArea
    side_effects: []

  # --- PayerContract ---
  - method: POST
    path: "/dh/payer-contracts"
    description: "Create a payer contract (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [payer_code, market_id, urgent_base_rate_cents, standard_base_rate_cents, place_of_service_modifier_pct, max_claim_cents, effective_from, effective_to]
    output: PayerContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/dh/payer-contracts"
    description: "List payer contracts"
    roles: [PlatformAdmin, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: ["payer_code?", "market_id?", "status?", "limit?", "offset?"]
    output: "PayerContract[]"
    side_effects: []
  - method: GET
    path: "/dh/payer-contracts/{id}"
    description: "Get one payer contract"
    roles: [PlatformAdmin, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: []
    output: PayerContract
    side_effects: []
  - method: POST
    path: "/dh/payer-contracts/{id}/activate"
    description: "Activate a DRAFT payer contract"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/dh/payer-contracts/{id}/terminate"
    description: "Terminate an ACTIVE payer contract"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status → TERMINATED"]
  - method: GET
    path: "/dh/payer-contracts/{id}/formulary-entries"
    description: "List formulary entries under a contract (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, BillingSpecialist, AdvancedPracticeProvider]
    code: 200
    input: []
    output: "FormularyEntry[]"
    side_effects: []

  # --- FormularyEntry ---
  - method: POST
    path: "/dh/payer-contracts/{id}/formulary-entries"
    description: "Create a formulary entry under a contract"
    roles: [PlatformAdmin]
    code: 201
    input: [drug_code, max_units_per_visit, requires_physician_preauth, unit_price_cents]
    output: FormularyEntry
    side_effects: []

  # --- Patient ---
  - method: POST
    path: "/dh/patients"
    description: "Register a Patient"
    roles: [PlatformAdmin, TriageNurse]
    code: 201
    input: [full_name, date_of_birth, payer_code, member_id, pcp_name, pcp_npi, "comorbidity_count?", home_address_geo]
    output: Patient
    side_effects: []
  - method: GET
    path: "/dh/patients"
    description: "List patients"
    roles: [PlatformAdmin, TriageNurse, Dispatcher, BillingSpecialist]
    code: 200
    input: ["payer_code?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/dh/patients/{id}"
    description: "Get one patient"
    roles: [PlatformAdmin, TriageNurse, Dispatcher, BillingSpecialist, AdvancedPracticeProvider]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/dh/patients/{id}/visit-requests"
    description: "List visit requests for a patient (sub-resource)"
    roles: [PlatformAdmin, TriageNurse, Dispatcher, BillingSpecialist]
    code: 200
    input: []
    output: "VisitRequest[]"
    side_effects: []

  # --- CareTeam ---
  - method: POST
    path: "/dh/care-teams"
    description: "Roster a care team"
    roles: [Dispatcher]
    code: 201
    input: [market_id, app_user_id, tech_user_id, supervising_physician_user_id, skill_tags]
    output: CareTeam
    side_effects: ["status = ROSTERED"]
  - method: GET
    path: "/dh/care-teams"
    description: "List care teams"
    roles: [PlatformAdmin, Dispatcher, TriageNurse]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: "CareTeam[]"
    side_effects: []
  - method: GET
    path: "/dh/care-teams/{id}"
    description: "Get one care team"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, AdvancedPracticeProvider]
    code: 200
    input: []
    output: CareTeam
    side_effects: []
  - method: POST
    path: "/dh/care-teams/{id}/go-available"
    description: "Mark team AVAILABLE"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CareTeam
    side_effects: ["status → AVAILABLE"]
  - method: POST
    path: "/dh/care-teams/{id}/go-off-duty"
    description: "Mark team OFF_DUTY"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CareTeam
    side_effects: ["status → OFF_DUTY"]

  # --- VehicleShift ---
  - method: POST
    path: "/dh/vehicle-shifts"
    description: "Schedule a vehicle shift"
    roles: [Dispatcher]
    code: 201
    input: [care_team_id, market_id, vehicle_plate, window_start, window_end]
    output: VehicleShift
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/dh/vehicle-shifts"
    description: "List vehicle shifts"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: ["care_team_id?", "market_id?", "status?", "limit?", "offset?"]
    output: "VehicleShift[]"
    side_effects: []
  - method: GET
    path: "/dh/vehicle-shifts/{id}"
    description: "Get one vehicle shift"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: []
    output: VehicleShift
    side_effects: []
  - method: POST
    path: "/dh/vehicle-shifts/{id}/start"
    description: "Start the shift"
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleShift
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/dh/vehicle-shifts/{id}/extend"
    description: "Extend window_end"
    roles: [Dispatcher]
    code: 200
    input: [new_window_end]
    output: VehicleShift
    side_effects: ["window_end updated, status → EXTENDED"]
  - method: POST
    path: "/dh/vehicle-shifts/{id}/close"
    description: "Close the shift; computes overtime_minutes"
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleShift
    side_effects: ["status → CLOSED; overtime_minutes computed"]
  - method: POST
    path: "/dh/vehicle-shifts/{id}/cancel"
    description: "Cancel a SCHEDULED shift"
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleShift
    side_effects: ["status → CANCELLED"]

  # --- VisitRequest ---
  - method: POST
    path: "/dh/visit-requests"
    description: "Create a VisitRequest (intake)"
    roles: [TriageNurse, Dispatcher]
    code: 201
    input: [patient_id, market_id, requestor_role, chief_complaint]
    output: VisitRequest
    side_effects: ["status = INTAKE", "requested_at = logical clock", "market.open_visit_count += 1"]
  - method: GET
    path: "/dh/visit-requests"
    description: "List visit requests"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: ["patient_id?", "market_id?", "status?", "acuity_band?", "assigned_care_team_id?", "claim_id?", "limit?", "offset?"]
    output: "VisitRequest[]"
    side_effects: []
  - method: GET
    path: "/dh/visit-requests/{id}"
    description: "Get one visit request"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, BillingSpecialist, PayerAdjudicator, AdvancedPracticeProvider]
    code: 200
    input: []
    output: VisitRequest
    side_effects: []
  - method: GET
    path: "/dh/visit-requests/{id}/triage-assessments"
    description: "List triage assessments for a visit (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, TriageNurse, Dispatcher]
    code: 200
    input: []
    output: "TriageAssessment[]"
    side_effects: []
  - method: GET
    path: "/dh/visit-requests/{id}/dispatch-assignments"
    description: "List dispatch assignments for a visit"
    roles: [PlatformAdmin, Dispatcher, TriageNurse]
    code: 200
    input: []
    output: "DispatchAssignment[]"
    side_effects: []
  - method: GET
    path: "/dh/visit-requests/{id}/follow-up-notices"
    description: "List follow-up notices for a visit"
    roles: [PlatformAdmin, TriageNurse]
