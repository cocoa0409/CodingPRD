      - call: GET /press-lines/${line}/backlog
        as: Any
        captures:
          booked2: $.data.booked_hours
      - call: GET /press-orders/${ord}/slots
        as: Any
        captures:
          freed_flag: $.data[0].freed
      - call: GET /invoices?press_order_id=${ord}
        as: Any
        captures:
          fee_net: $.data[0].net_cents
          fee_kind: $.data[0].kind
      assert:
      - booked_hours before commit == 0, after commit == 8, after cancel == 0 (round-trip leaves the line untouched)
      - cancelled order's slot row has freed == true (audit retained, excluded from capacity math)
      - cancel_fee_cents == 224210 and the CANCELLATION_FEE invoice net_cents == 224210
  - name: inventory_units_roundtrip_conservation
    grounds:
    - calculations.shipment_allocation
    - state_machines.Shipment
    - entities.InventoryLot.fields.received_units_cum
    distinguishing_aspect: 'Conserved quantity: physical units. received_units_cum ==

      on_hand + allocated + shipped + damaged holds after every mutation:

      allocate 300 (700/300), cancel deallocates (1000/0), ship 200

      (800/0/200), damage 50 (750/0/200/50) — the four-term sum never

      leaves 1000.

      '
    test_recipe:
      setup:
      - lot with 1000 units; distributor customer ACTIVE
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: CI2 Label
          contact_email: ci2@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /customers
        payload:
          name: CI2 Dist
          contact_email: ci2d@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          dist: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: CI2-001
          title: TC2
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /inventory-lots
        payload:
          release_id: ${rel}
          zone: A
        as: WarehouseManager
        captures:
          lot: $.data.id
      - call: POST /inventory-lots/${lot}/stock-events
        payload:
          event: RECEIVE
          quantity: 1000
          event_date: '2026-08-01'
        as: WarehouseManager
        captures:
          r0: $.data.received_units_cum
      - call: POST /shipments
        payload:
          release_id: ${rel}
          distributor_customer_id: ${dist}
          quantity: 300
          requested_ship_date: '2026-08-15'
        as: CustomerServiceRep
        captures:
          s1: $.data.id
          s1_st: $.data.status
      - call: GET /inventory-lots/${lot}
        as: Any
        captures:
          on1: $.data.on_hand_units
          al1: $.data.allocated_units
      trigger:
      - call: POST /shipments/${s1}/cancel
        payload:
          reason: distributor changed mind
        as: CustomerServiceRep
      - call: GET /inventory-lots/${lot}
        as: Any
        captures:
          on2: $.data.on_hand_units
          al2: $.data.allocated_units
      - call: POST /shipments
        payload:
          release_id: ${rel}
          distributor_customer_id: ${dist}
          quantity: 200
          requested_ship_date: '2026-08-15'
        as: CustomerServiceRep
        captures:
          s2: $.data.id
      - call: POST /shipments/${s2}/advance
        payload: {}
        as: WarehouseManager
        captures:
          s2_st1: $.data.status
      - call: POST /shipments/${s2}/advance
        payload: {}
        as: WarehouseManager
        captures:
          s2_st2: $.data.status
      - call: POST /inventory-lots/${lot}/stock-events
        payload:
          event: DAMAGE_WRITE_OFF
          quantity: 50
          event_date: '2026-08-02'
        as: WarehouseManager
      - call: GET /inventory-lots/${lot}
        as: Any
        captures:
          on3: $.data.on_hand_units
          al3: $.data.allocated_units
          sh3: $.data.shipped_units_cum
          dm3: $.data.damaged_units_cum
          rc3: $.data.received_units_cum
      assert:
      - 'after allocate 300: on_hand 700, allocated 300 (sum with received 1000)'
      - 'after cancel (compensation): on_hand 1000, allocated 0 — allocation fully reversed'
      - 'final: received_units_cum == 1000 == on_hand 750 + allocated 0 + shipped 200 + damaged 50'
      - shipment2 walked ALLOCATED -> PICKED -> SHIPPED
  - name: invoice_money_conservation_pay_and_credit
    grounds:
    - state_machines.Invoice
    - entities.Invoice.fields.credited_cents
    - calculations.credit_availability
    distinguishing_aspect: 'Conserved quantity: billed cents. An invoice''s net_cents (439455) is

      exactly covered by paid_cents + credited_cents at every step —

      partial payment 100000, credit memo 39455, final payment 300000 ->

      PAID with 439455 == 400000 + 39455; the customer''s outstanding

      contribution returns to zero.

      '
    test_recipe:
      setup:
      - COMPLETED order (accepted 970, STANDARD) with STANDARD invoice net 439455
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: CI3
          contact_email: ci3@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: CI3-001
          title: TC3
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-lines
        payload:
          line_code: L1
          tonnage_class: STANDARD
          hours_per_day: 16
          daily_unit_capacity: 5000
        as: ProductionPlanner
        captures:
          line: $.data.id
      - call: POST /plating-baths
        payload:
          bath_code: B1
          rinse_gap_minutes: 2
        as: ProductionPlanner
        captures:
          bath: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_CUT
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_PLATING
          plating_bath_id: ${bath}
          plating_start: 2
          plating_end: 6
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
      - call: POST /press-orders/${ord}/test-pressings
        payload:
          quantity: 5
        as: PressOperator
        captures:
          tp: $.data.id
      - call: POST /test-pressings/${tp}/ship
        payload: {}
        as: ProductionPlanner
      - call: POST /test-pressings/${tp}/review
        payload:
          decision: APPROVE
        as: Customer
        as_user_id: ${cust}
      - call: GET /press-orders/${ord}
        as: Any
        captures:
          ord_vq: $.data.version
      - call: POST /press-orders/${ord}/schedule-commits
        payload:
          expected_press_order_version: ${ord_vq}
          slots:
          - press_line_id: ${line}
            date: '2026-08-10'
            start_hour: 0
            end_hour: 8
            planned_units: 1000
        as: ProductionPlanner
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: START_PRESSING
        as: PressOperator
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: COMPLETE_PRESSING
        as: PressOperator
      - call: POST /press-orders/${ord}/qc-reports
        payload:
          units_pressed: 1000
          units_rejected: 30
        as: QaInspector
        as_user_id: qa-1
        captures:
          qc: $.data.id
      - call: POST /qc-reports/${qc}/decision
        payload:
          decision: ACCEPT
          fault: NONE
        as: ProductionManager
        as_user_id: pm-1
      - call: POST /press-orders/${ord}/invoices
        payload: {}
        as: BillingClerk
        captures:
          inv: $.data.id
          inv_net: $.data.net_cents
      trigger:
      - call: POST /invoices/${inv}/payments
        payload:
          amount_cents: 100000
        as: BillingClerk
        captures:
          st1: $.data.status
          paid1: $.data.paid_cents
      - call: POST /invoices/${inv}/credit-memos
        payload:
          amount_cents: 39455
          reason: scratch goodwill
        as: BillingClerk
        captures:
          memo_parent: $.data.parent_invoice_id
          memo_kind: $.data.kind
      - call: POST /invoices/${inv}/payments
        payload:
          amount_cents: 300000
        as: BillingClerk
        captures:
          st2: $.data.status
          paid2: $.data.paid_cents
          cred2: $.data.credited_cents
      - call: GET /press-orders/${ord}
        as: Any
        captures:
          bill_st: $.data.billing_status
      assert:
      - 'after partial payment: status == PARTIALLY_PAID, paid_cents == 100000'
      - 'credit memo row: kind == CREDIT_MEMO, parent_invoice_id == ${inv}'
      - 'final: paid_cents == 400000, credited_cents == 39455, status == PAID; 439455 == 400000 + 39455 exactly'
      - PressOrder billing_status == PAID (parallel dimension moved independently of production_status)
