      - name: missing_auth_headers_and_unknown_roles_are_rejected_before_any_lookup
        claim_type: authentication_gate
        grounds:
          - "§1.6 ERR_MISSING_AUTH_HEADERS (401) 'X-User-Role or X-User-ID absent, or X-User-Role is not one of the four declared roles'"
          - "§1.4 priority 1 'authentication headers present and well-formed' — ahead of priority 2 (ERR_UNAUTHORIZED), priority 3 (schema) and priority 4 (existence)"
          - "§1.7 the four declared roles ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector"
        distinguishing_aspect: "The 401 gate is evaluated before role membership, schema validation and id resolution, so an unauthenticated request to a nonexistent station with a malformed body still returns 401 — never 403, 400 or 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated; station KWEA exists so that resolvable and unresolvable ids can both be probed."
            - "Header shapes probed: both headers omitted; X-User-Role present but X-User-ID omitted; X-User-Role set to 'StateBroadcaster' (not one of the four)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            # both X-User-Role and X-User-ID omitted entirely
            - call: "GET /stations/${station_id}"
              as: "<no X-User-Role header>"
              as_user_id: "<no X-User-ID header>"
              captures: { e_no_headers: "$.data.error_id" }
            # X-User-Role present, X-User-ID omitted
            - call: "GET /stations/${station_id}"
              as: ComplianceAdmin
              as_user_id: "<no X-User-ID header>"
              captures: { e_no_user_id: "$.data.error_id" }
            # X-User-Role carries a value outside the four declared roles
            - call: "POST /state-plans"
              as: "StateBroadcaster"
              as_user_id: bc-1
              payload: { state_code: "NE", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { e_unknown_role: "$.data.error_id" }
            # unauthenticated + unresolvable id + missing required body field at once
            - call: "POST /stations/dddddddd-dddd-4ddd-8ddd-dddddddddddd/public-file-documents"
              as: "<no X-User-Role header>"
              as_user_id: "<no X-User-ID header>"
              payload: { document_kind: "STATION_LOG" }
              captures: { e_stacked: "$.data.error_id" }
            # unknown role on an endpoint that role would not be allowed on anyway
            - call: "POST /stations/${station_id}/run-log-review"
              as: "StateBroadcaster"
              as_user_id: bc-1
              payload: {}
              captures: { e_unknown_role_on_admin_op: "$.data.error_id" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "${e_no_headers} == 'ERR_MISSING_AUTH_HEADERS' with HTTP 401 — even a read that every role may perform requires both headers"
            - "${e_no_user_id} == 'ERR_MISSING_AUTH_HEADERS' with HTTP 401: a valid role alone is not enough, X-User-ID is mandatory because §1.7 identities are checked per station"
            - "${e_unknown_role} == 'ERR_MISSING_AUTH_HEADERS' with HTTP 401, not 403 — an undeclared role value fails authentication, it does not merely fail authorisation"
            - "${e_stacked} == 'ERR_MISSING_AUTH_HEADERS' with HTTP 401 even though the station id is unresolvable (404 candidate) and reference_label is missing (400 candidate): priority 1 wins over priorities 3 and 4"
            - "${e_unknown_role_on_admin_op} == 'ERR_MISSING_AUTH_HEADERS' with HTTP 401 rather than 'ERR_UNAUTHORIZED' — priority 1 wins over priority 2"
            - "compliance-summary still reports compliance_score null, public_file_document_count == 0 and last_log_review_at null: no 401 request had any effect"

