    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-Role is rejected at priority 1 before role/existence checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ct/employers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: "__NO_ROLE_HEADER__"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), NOT ERR_NOT_FOUND — auth precedes existence"

      - name: state_before_request_shape_priority
