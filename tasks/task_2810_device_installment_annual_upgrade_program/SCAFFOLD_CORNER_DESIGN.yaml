      - name: overpaid_down_payment_and_duplicate_target_model_are_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_107_ERR_DOWN_PAYMENT_EXCEEDS_PRICE
          - validations.priority_93_ERR_DUPLICATE_MODEL_ON_CUSTOMER
          - errors.ERR_DOWN_PAYMENT_EXCEEDS_PRICE
          - errors.ERR_DUPLICATE_MODEL_ON_CUSTOMER
        distinguishing_aspect: |
          A declared down payment equal to the retail price leaves nothing to finance and is
          refused (the rule is strict <, so 89900 against 89900 fails while 89899 passes), and a
          customer who already holds an ACTIVE loan on MDL-C cannot aim an upgrade at MDL-C —
          yet the very same request aimed at a model they do not hold is accepted, so the
          refusal is about the duplicate holding, not the request.
