              as_user_id: "${inst}"
              captures: { gov_low: $.data.id }
            - call: "POST /governance-authorizations/${gov_ok}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov_low}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
          trigger:
            - call: "POST /governance-authorizations/${gov_ok}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
