            - "A CompetitiveException documented by u-rep-1 and ACCEPTED by u-desk-1 (200000 consumed), which let the quote pass the margin gate and be submitted."
            - "The CFO then revoked that exception while the quote was PENDING_APPROVAL, so the account allowance is back to 0, required_approval_level is back to 0 and the margin gate would now fail."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
