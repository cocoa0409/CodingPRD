  # ===========================================================================
  - section: rbac
    instances:
      - name: competition_create_missing_auth_headers_returns_unauthenticated
        claim_type: Violation -> Error
        grounds: ["validations[priority=1]", "errors.ERR_UNAUTHENTICATED"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID header is 401 ERR_UNAUTHENTICATED — checked before role permission (403) and before existence."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /competitions"
              payload: { title: "No Auth", fiscal_year: 2026, application_open_at: "2026-09-01T00:00:00Z", application_close_at: "2026-10-01T00:00:00Z" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "status 401 and error_id == ERR_UNAUTHENTICATED (headers omitted entirely, per the instance name)"

      - name: member_cannot_create_competition_returns_unauthorized
        claim_type: Violation -> Error
        grounds: ["validations[priority=2]", "errors.ERR_UNAUTHORIZED", "roles.Member"]
        distinguishing_aspect: "A Member (entity-backed, self) hitting a CNCSProgramOfficer-exclusive endpoint is 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Clock set; member registered."]
          setup_api_calls:
            - *k_clock
            - *k_mem
          trigger:
            - call: "POST /competitions"
              payload: { title: "Member Attempt", fiscal_year: 2026, application_open_at: "2026-09-01T00:00:00Z", application_close_at: "2026-10-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_a}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_UNAUTHORIZED"

      - name: grantee_staff_cannot_touch_another_orgs_enrollment
        claim_type: Violation -> Error
        grounds: ["validations[priority=3]", "errors.ERR_UNAUTHORIZED", "roles.GranteeStaff"]
        distinguishing_aspect: "Entity-backed ownership: GranteeStaff of org B certifying an hour entry on org A's enrollment is 403 ERR_UNAUTHORIZED — the caller's org id must equal the resource's organization_id."
        test_recipe:
          setup: ["Org A's award with member A enrolled ACTIVE and one PENDING entry; org B registered separately."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
            - *k_ent480
            - call: "POST /organizations"
              payload: { legal_name: "Other Valley Corps", ein: "98-7654321", org_type: "PUBLIC_AGENCY" }
              as: CNCSProgramOfficer
              captures: { org_b: $.data.id }
          trigger:
            - call: "POST /hour-entries/${ent_a}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_b}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_UNAUTHORIZED"
            - "ServiceHourEntry.${ent_a}.status == PENDING (unchanged)"

      - name: program_officer_cannot_decide_finding_returns_unauthorized
        claim_type: Violation -> Error
        grounds: ["validations[priority=2]", "errors.ERR_UNAUTHORIZED", "roles.ComplianceOfficer"]
        distinguishing_aspect: "Finding decide is exclusive to ComplianceOfficer; a CNCSProgramOfficer (who can resolve grievances and close awards) is still 403 here."
        test_recipe:
          setup: ["Visit conducted by co-one; finding assigned; evidence submitted."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_visit
            - *k_conduct
            - *k_find
            - *k_assign
            - *k_evidence
          trigger:
            - call: "POST /findings/${find_1}/decide"
              payload: { decision: "APPROVE" }
              as: CNCSProgramOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_UNAUTHORIZED"
            - "Finding.${find_1}.status == EVIDENCE_SUBMITTED"

      - name: trust_administrator_cannot_schedule_visit
        claim_type: Violation -> Error
        grounds: ["validations[priority=2]", "errors.ERR_UNAUTHORIZED", "roles.TrustAdministrator"]
        distinguishing_aspect: "TrustAdministrator (education-award trust) has no compliance surface: scheduling a visit is 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Award ACTIVE."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
          trigger:
            - call: "POST /awards/${award_id}/compliance-visits"
              payload: { visit_type: "SITE_VISIT", scheduled_date: "2026-11-02" }
              as: TrustAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_UNAUTHORIZED"

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: stale_award_version_on_enrollment_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-create-stale-award]", "errors.ERR_STALE_VERSION"]
        distinguishing_aspect: "Two strictly sequential enrollment creates: the first carries expected_award_version == 1 and succeeds (award.version -> 2); the second carries the same stale version 1 and is rejected 412 ERR_STALE_VERSION — no wall-clock reasoning involved."
        test_recipe:
          setup: ["Award ACTIVE (version 1) with 2 FULL_TIME slots; members A and B both cleared."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_mem_b
            - *k_chk_b
            - *k_clr_b1
            - *k_clr_b2
            - *k_clr_b3
          trigger:
            - *k_enr
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_b}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v1}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "member A's enrollment succeeds with expected_award_version == 1; award.version becomes 2"
            - "member B's create with the stale expected_award_version == 1: 412 and error_id == ERR_STALE_VERSION"
            - "GET /enrollments?member_id=${m_b} returns 0 rows and the second slot stays OPEN"

      - name: stale_education_award_version_on_use_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[award-use-stale-education-award]", "errors.ERR_STALE_VERSION"]
        distinguishing_aspect: "Use creation bumps the award version: a second create carrying the pre-first-create version is 412 ERR_STALE_VERSION, protecting the trust ledger from stale-balance clients."
        test_recipe:
          setup: ["Member A has an education award of 261000, version 1."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 36000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a: $.data.id }
            - call: "POST /hour-entries/${ent_a}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - *k_exit_compelling
            - call: "GET /education-awards/${edu_a}"
              payload: {}
              as: TrustAdministrator
              captures: { edu_v1: $.data.version }
          trigger:
            - call: "POST /education-awards/${edu_a}/uses"
              payload: { use_type: "QUALIFIED_LOAN", amount_cents: 10000, expected_education_award_version: "${edu_v1}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { use_1: $.data.id }
            - call: "POST /education-awards/${edu_a}/uses"
              payload: { use_type: "QUALIFIED_LOAN", amount_cents: 20000, expected_education_award_version: "${edu_v1}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { error_id: $.data.error_id }
          assert:
            - "first use with expected version 1: 201 (award.version -> 2)"
            - "second use with the same stale version 1: 412 and error_id == ERR_STALE_VERSION"
            - "EducationAward.${edu_a}.remaining_balance_cents == 261000 (no debits — both uses only PENDING, and only the first exists)"

      - name: slot_selector_picks_lowest_slot_index_deterministically
        claim_type: selector_determinism
        grounds: ["calculations.slot_selector"]
        distinguishing_aspect: "With two OPEN FULL_TIME slots, enrollment 1 gets slot_index 1 and enrollment 2 gets slot_index 2 — the selector ranks by slot_index ASC with no randomness and no id-based tie-break."
        test_recipe:
          setup: ["Award ACTIVE with 2 FULL_TIME slots; members A and B cleared."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - call: "GET /awards/${award_id}/slots"
              payload: {}
              as: CNCSProgramOfficer
              captures: { slot_first: "$.data[0].id", slot_second: "$.data[1].id" }
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_mem_b
            - *k_chk_b
            - *k_clr_b1
            - *k_clr_b2
            - *k_clr_b3
          trigger:
            - *k_enr
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v2: $.data.version }
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_b}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v2}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_b: $.data.id, slot_b: $.data.slot_id }
          assert:
            - "slot list is ordered by slot_index ASC: data[0].slot_index == 1, data[1].slot_index == 2"
            - "MemberEnrollment.${enr_a}.slot_id == ${slot_first} (lowest slot_index wins)"
            - "MemberEnrollment.${enr_b}.slot_id == ${slot_second}"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.Finding.ACTION_ASSIGNED_to_ESCALATED", "state_machines.GrantAward.ACTIVE_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / overdue_corrective_action_suspends_award_and_enrollments"
          rationale: "The 3-hop sweep cascade (finding -> award -> enrollment, with a depth-4 observable) is asserted end-to-end there."

