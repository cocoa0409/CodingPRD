scenario: "Catering Order & Event Management: menu/package per headcount, lead-time/order cutoff, dietary & allergen counts, delivery/setup/staffing add-on, deposit & final-count guarantee, tax/gratuity/service fee, change/cancellation window, multi-stop"
domain_name: "catering-event-management"
api_prefix: "/catering"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - dual_variant_calculation        # provisional (booked headcount) vs final (guaranteed-count) invoice; deposit-credited cancellation refund vs forfeit
    - cascading_side_effects          # confirm order -> lock package version + reserve staffing pool + create delivery legs + debit client deposit ledger
    - rate_threshold_triggers         # lead-time/cutoff breakpoints, gratuity-included tiers, final-count guarantee floor, cancellation-window refund tiers
    - optimistic_concurrency          # CREATE-with-supersede of a change-request quote against a stale Order.version

  entity_topology: flat
  # Peer entities linked by foreign keys (Order, EventPackage, AddOnLine, DeliveryLeg,
  # ChangeRequest, DepositLedgerEntry, StaffingReservation, Client, Venue, ServiceRoute).
  # No nesting of business resources inside URL paths beyond the standard
  # /<collection>/{id}/<action> action segments. Cross-entity references are FK fields,
  # not parent/child URL trees.

  state_machine_shape: parallel
  # An Order carries TWO independent state dimensions that evolve on the same row:
  #   lifecycle_status  (DRAFT -> CONFIRMED -> GUARANTEED -> FULFILLED, plus CANCELLED)
  #   settlement_status (UNBILLED -> DEPOSIT_HELD -> INVOICED -> SETTLED, plus REFUNDED/FORFEITED)
  # ChangeRequest is cyclic (PROPOSED -> COUNTERED -> PROPOSED revision loop -> ACCEPTED/REJECTED).
  # ServiceRoute is compound (route posture derived from its DeliveryLeg children).

  relationship_patterns:
    - one_to_many        # Order has many AddOnLine, DeliveryLeg, ChangeRequest, DepositLedgerEntry
    - cross_aggregate    # Order references Client, EventPackage, Venue, ServiceRoute across aggregate boundaries
    - self_referential   # DeliveryLeg.preceding_leg_id chains the legs of a multi-stop route into an ordered linked list

  role_model: peer_roles
  # CateringAdmin owns packages/venues/routes/clock (operator surface);
  # Client owns its own Orders and ChangeRequests (entity_backed);
  # SalesCoordinator confirms/guarantees/invoices orders and reviews change requests;
  # EventCaptain marks fulfillment and dispatches delivery legs.

  consistency_model: immediate
  # Every mutation is atomic within its request. Derived fields (order totals,
  # deposit balance, route posture, package-version lock) are recomputed inside the
  # same request that triggers them; no asynchronous reconciliation.

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
