            - "${paid_amount} == 2987000, ${total_before} == 2987000, ${ps_before} == PAID, ${credit_before} == 0 - BUYER_NET_OUTLAY starts at 2987000 - 0 == 2987000"
            - "${refund} == 950400 and ${wallet_mid} == 950400"
            - "${ps_mid} == REFUND_ISSUED, ${credit_mid} == 950400, ${total_mid} == 2036600, ${paid_mid} == 2987000 - the refund never reduced amount_paid_cents, so BUYER_NET_OUTLAY fell to 2036600"
            - "Claim.${cl1}.claim_status == REVERSED and reversed_by_user_id == ts-2 (a different user from decided_by_user_id ops-claims-9)"
            - "Claim.${cl1}.refund_cents == 950400 is retained on the reversed claim as the audit trail, while its ledger effect is gone"
            - "BuyerAccount.${ba}.wallet_credit_cents == 0"
            - "SaleOrder.${so1}.claim_credit_cents == 0, payment_status == PAID, total_due_cents == 2987000, amount_paid_cents == 2987000, balance_due_cents == 0"
            - "BUYER_NET_OUTLAY == 2987000 - 0 == 2987000, bit-for-bit its pre-claim value - no drift in either direction"
            - "Lot.${lot1}.manifest_accuracy_score == 1.000 (the REVERSED claim leaves the accuracy input set) and ManifestLine.${ml1}.verified_unit_count == 0"
            - "SellerAccount.${s1}.manifest_accuracy_avg == 1.000, scored_lot_count == 1, account_status == ACTIVE"
            - "SellerAccount.${s1}.commission_tier == TIER_PREFERRED and commission_rate_bps == 1500, re-derived from gross_recovery_rate 0.2700 now that the probation override is gone"
            - "SaleOrder.${so1}.seller_commission_cents == 405000 and seller_net_proceeds_cents == 2295000 - the seller-side settlement was frozen at pickup and is untouched by both the claim and its reversal"

      - name: declared_unit_total_restored_by_voiding_the_added_line
        grounds:
          - entities.Lot.fields.declared_unit_count
          - entities.Lot.fields.declared_retail_value_cents
          - entities.Lot.fields.manifest_line_count
          - entities.ManifestLine.fields.line_status
          - endpoints[POST /liquidation/lots/{id}/manifest-lines]
          - endpoints[POST /liquidation/manifest-lines/{id}/voids]
        distinguishing_aspect: |
          A different conserved quantity in a different unit system: DECLARED_UNIT_TOTAL, the identity
          Lot.declared_unit_count == sum of unit_count over ACTIVE lines (with its money twin
          declared_retail_value_cents). Adding a 60-unit line inflates the aggregates to 460 /
          10900000 / 3 lines, and voiding that same line must restore them to exactly 400 / 10000000
          / 2 lines while the VOIDED row itself is retained. An implementation that decrements by a
          recomputed guess, or that deletes rows, or that leaves the retail total behind, breaks the
          identity even though declared_unit_count alone may look right.
        test_recipe:
          setup:
            - "One seller and one warehouse; the clock stays at 2026-08-01T00:00:00Z."
            - "Lot S1 is created in DRAFT (CUSTOMER_RETURNS) with two ACTIVE lines, 100 x 40000 and 300 x 20000, so the invariant holds at declared_unit_count 400, declared_retail_value_cents 10000000 and manifest_line_count 2."
            - "A third line of 60 x 15000 is then added, taking the aggregates to 460 / 10900000 / 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-200", unit_count: 300, unit_retail_cents: 20000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml2: "$.data.id" }
            - call: "GET /liquidation/lots/${lot1}"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { units_base: "$.data.declared_unit_count", retail_base: "$.data.declared_retail_value_cents", lines_base: "$.data.manifest_line_count", ver_base: "$.data.version" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-400", unit_count: 60, unit_retail_cents: 15000, declared_condition: "DAMAGED" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml3: "$.data.id" }
            - call: "GET /liquidation/lots/${lot1}"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { units_after_add: "$.data.declared_unit_count", retail_after_add: "$.data.declared_retail_value_cents", lines_after_add: "$.data.manifest_line_count" }
          trigger:
            - call: "POST /liquidation/manifest-lines/${ml3}/voids"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { voided_status: "$.data.line_status" }
          assert:
            - "${units_base} == 400, ${retail_base} == 10000000, ${lines_base} == 2 - the invariant before the perturbation"
            - "${units_after_add} == 460, ${retail_after_add} == 10900000, ${lines_after_add} == 3 (60 units, 900000 cents added)"
            - "${voided_status} == VOIDED"
            - "Lot.${lot1}.declared_unit_count == 400 == 100 + 300, exactly the sum over ACTIVE lines - DECLARED_UNIT_TOTAL is restored with no drift"
            - "Lot.${lot1}.declared_retail_value_cents == 10000000 - the money twin of the invariant is restored too"
            - "Lot.${lot1}.manifest_line_count == 2"
            - "ManifestLine.${ml3}.line_status == VOIDED with unit_count still 60 and unit_retail_cents still 15000 - the row is retained for audit, it simply left the aggregate"
            - "ManifestLine.${ml1}.line_status == ACTIVE and ManifestLine.${ml2}.line_status == ACTIVE"
            - "Lot.${lot1}.lot_status == DRAFT and Lot.${lot1}.version > ${ver_base} (both the add and the void are writes on the parent aggregate)"
            - "GET /liquidation/lots/${lot1}/manifest-lines returns total_count 3 while GET /liquidation/lots/${lot1}/manifest-lines?line_status=ACTIVE returns total_count 2"
