  - method: GET
    path: "/fitness/class-enrollments"
    description: "List class enrollments filtered by session, device, enroller or status"
    roles: [MembershipOwner, Instructor, PlatformAdmin]
    code: 200
    input: ["class_session_id?", "device_id?", "enroller_user_id?", "status?", "limit?", "offset?"]
