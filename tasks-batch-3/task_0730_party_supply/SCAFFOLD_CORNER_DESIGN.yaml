            - "t2_rem == 40"

      - name: rental_deposit_ignores_clearance_discount
        claim_type: correct_result
        grounds:
          - calculations.rental_deposit
          - entities.RentalContract.fields.deposit_cents
        distinguishing_aspect: "For a TABLEWARE SKU at unit_price=500 with clearance 0.5 applied, RentalContract.deposit_cents uses UNDISCOUNTED price: 2*500*4 = 4000 cents (NOT 2*250*4 = 2000)."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + TABLEWARE SKU priced 500 with clearance pct=0.5. Order DRAFT."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
