  - rule_id: compensating_invariant
    instances:

      - name: growout_void_restores_lease_gear_and_seed_lot_counters
        grounds:
          - state_machines.GrowoutUnit.DEPLOYED_to_VOIDED
          - state_machines.SeedLot.PLANTED_to_READY_FOR_PLANTING
          - calculations.seed_lot_allocation_and_survival
          - calculations.lease_gear_utilisation
          - calculations.plot_fallow_window
          - entities.Lease.fields.deployed_gear_units
          - entities.SeedLot.fields.unallocated_seed_count
        distinguishing_aspect: |
          A COUNTER-AND-BUBBLE-UP reversal: the void subtracts exactly what the deployment added on two
          different parents (Lease.deployed_gear_units 40 -> 0 and SeedLot allocated 60000 -> 0 /
          unallocated 0 -> 60000), drags the seed lot back PLANTED -> READY_FOR_PLANTING, and releases the
          plot occupation interval so an identical redeployment on the same plot and dates succeeds with no drift.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z; GrowingArea GA-114 APPROVED."
            - "APPROVED Lease L-2988-01 held by op-1 with plots P1..P3 and authorized_gear_units 200."
            - "SeedLot with surviving_seed_count 60000, fully planted into one GrowoutUnit on plot P1 (gear_units 40, seed_count_planted 60000), so SeedLot.status == PLANTED, unallocated_seed_count == 0 and Lease.deployed_gear_units == 40."
            - "The unit has no HarvestAuthorization and no HarvestLot, so the void precondition holds."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/hatcheries"
              payload: { name: "Sound Hatchery", state_code: "NC", ncsp_certificate_no: "NCSP-77", certificate_expires_on: "2027-03-31", pathogen_free_species: ["CRASSOSTREA_VIRGINICA"] }
              as: ShellfishControlAuthority
              captures: { hatchery: $.data.id }
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "CLEARED", review_note: "outside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/environmental-review"
              payload: { decision: "CLEARED", review_note: "no SAV impact" }
              as: SitingReviewer
              as_user_id: "rev-env-1"
            - call: "POST /shellfish/leases/${lease}/decision"
              payload: { decision: "APPROVE", rent_paid_through_date: "2026-12-31", decision_note: "granted" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots"
              payload: { hatchery_id: "${hatchery}", lease_id: "${lease}", species: "CRASSOSTREA_VIRGINICA", received_seed_count: 100000, disease_certificate_no: "DC-9001", disease_cert_issued_on: "2026-03-15", shipped_on: "2026-04-01" }
              as: HatcheryOperator
              as_user_id: "${hatchery}"
              captures: { seed: $.data.id }
            - call: "POST /shellfish/seed-lots/${seed}/screening"
              payload: { result: "NEGATIVE", screened_on: "2026-04-03" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots/${seed}/nursery-start"
              payload: { nursery_started_on: "2026-04-05", nursery_system: "UPWELLER" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/seed-lots/${seed}/nursery-complete"
              payload: { nursery_completed_on: "2026-05-01", surviving_seed_count: 60000 }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/growout-units"
              payload: { lease_id: "${lease}", seed_lot_id: "${seed}", plot_code: "P1", gear_type: "BOTTOM", gear_units: 40, seed_count_planted: 60000, deployed_on: "2026-05-05", planned_retrieval_on: "2026-10-15" }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /shellfish/growout-units/${unit}/void"
              payload: { void_note: "wrong plot recorded" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/growout-units"
              payload: { lease_id: "${lease}", seed_lot_id: "${seed}", plot_code: "P1", gear_type: "BOTTOM", gear_units: 40, seed_count_planted: 60000, deployed_on: "2026-05-05", planned_retrieval_on: "2026-10-15" }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { unit_redeploy: $.data.id }
          assert:
            - "GrowoutUnit.${unit}.status == VOIDED with void_reason == OPERATOR_CORRECTION"
            - "Lease.${lease}.deployed_gear_units == 0 immediately after the void (exactly the pre-deployment value)"
            - "SeedLot.${seed}.allocated_seed_count == 0 and unallocated_seed_count == 60000 immediately after the void"
            - "SeedLot.${seed}.status == READY_FOR_PLANTING immediately after the void (bubble-up reversal of PLANTED)"
            - "SeedLot.${seed}.surviving_seed_count == 60000 and survival_rate_pct == 60.00 are unchanged by the void"
            - "The identical redeployment on plot P1 with deployed_on 2026-05-05 returns HTTP 201 (the voided unit is excluded from the fallow input set, so neither ERR_PLOT_OCCUPIED nor ERR_PLOT_FALLOW_CONFLICT fires)"
            - "After the redeployment Lease.${lease}.deployed_gear_units == 40 and SeedLot.${seed}.status == PLANTED and unallocated_seed_count == 0"
            - "GrowoutUnit.${unit_redeploy}.status == DEPLOYED"

      - name: harvest_lot_void_restores_lease_royalty_accrued_cents
        grounds:
          - state_machines.HarvestLot.TAGGED_to_VOIDED
          - state_machines.HarvestLot.HARVESTED_to_VOIDED
          - calculations.lease_harvest_settlement
          - entities.Lease.fields.royalty_accrued_cents
          - entities.HarvestAuthorization.fields.harvested_bushels
          - entities.HarvestLot.fields.lot_settlement_cents
        distinguishing_aspect: |
          A MONETARY LEDGER reversal with an explicit no-recompute invariant on siblings: voiding the
          1-bushel lot subtracts exactly its 2673-cent settlement to restore Lease.royalty_accrued_cents
          to 59225 and rolls harvested_bushels back to 500, while the surviving 500-bushel lot keeps its
          stamped royalty_rate_cents_per_bushel 115 rather than being re-tiered.
        test_recipe:
          setup:
            - "Full production chain from empty DB with HarvestAuthorization ACTIVE and projected_bushels 600."
            - "HarvestLot LOT-BIG of 500 bushels landed first: rate 115, royalty 57500, fee 0 (waived), surcharge 1725, lot_settlement_cents 59225."
            - "HarvestLot LOT-EDGE of 1 bushel landed second: season_total_bushels_at_creation 501, rate 95, royalty 95, fee 2500, surcharge 78, lot_settlement_cents 2673."
            - "Lease.royalty_accrued_cents == 61898 and HarvestAuthorization.harvested_bushels == 501 before the trigger; neither lot is attached to a shipment."
            - "Logical clock 2026-08-10T11:00:00Z."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/vibrio-control-plans"
              payload: { season_month: 8, max_time_to_temperature_minutes: 300, high_water_temp_c: 23.0, high_temp_reduction_minutes: 60 }
              as: ShellfishControlAuthority
              captures: { plan: $.data.id }
            - call: "POST /shellfish/hatcheries"
              payload: { name: "Sound Hatchery", state_code: "NC", ncsp_certificate_no: "NCSP-77", certificate_expires_on: "2027-03-31", pathogen_free_species: ["CRASSOSTREA_VIRGINICA"] }
              as: ShellfishControlAuthority
              captures: { hatchery: $.data.id }
            - call: "POST /shellfish/dealers"
              payload: { name: "Coastal Shellstock", state_code: "NC", certification_category: "SHELLSTOCK_SHIPPER", certification_no: "NC-1234-SS", certified_through: "2027-06-30" }
              as: ShellfishControlAuthority
              captures: { dealer: $.data.id, dealer_v: $.data.version }
            - call: "POST /shellfish/dealers/${dealer}/certification-renewals"
              payload: { expected_dealer_version: "${dealer_v}", certified_through: "2027-06-30", icssl_listed_through: "2027-06-30" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/harvest-vessels"
              payload: { name: "Miss Pamlico", registration_no: "NC-4410", refrigeration_type: "MECHANICAL", concurrent_authorization_capacity: 2 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { vessel: $.data.id }
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "CLEARED", review_note: "outside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/environmental-review"
              payload: { decision: "CLEARED", review_note: "no SAV impact" }
              as: SitingReviewer
              as_user_id: "rev-env-1"
            - call: "POST /shellfish/leases/${lease}/decision"
              payload: { decision: "APPROVE", rent_paid_through_date: "2026-12-31", decision_note: "granted" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots"
              payload: { hatchery_id: "${hatchery}", lease_id: "${lease}", species: "CRASSOSTREA_VIRGINICA", received_seed_count: 100000, disease_certificate_no: "DC-9001", disease_cert_issued_on: "2026-03-15", shipped_on: "2026-04-01" }
              as: HatcheryOperator
              as_user_id: "${hatchery}"
              captures: { seed: $.data.id }
            - call: "POST /shellfish/seed-lots/${seed}/screening"
              payload: { result: "NEGATIVE", screened_on: "2026-04-03" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots/${seed}/nursery-start"
              payload: { nursery_started_on: "2026-04-05", nursery_system: "UPWELLER" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/seed-lots/${seed}/nursery-complete"
              payload: { nursery_completed_on: "2026-05-01", surviving_seed_count: 60000 }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/growout-units"
              payload: { lease_id: "${lease}", seed_lot_id: "${seed}", plot_code: "P1", gear_type: "BOTTOM", gear_units: 40, seed_count_planted: 25000, deployed_on: "2026-05-05", planned_retrieval_on: "2026-10-15" }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { unit: $.data.id }
            - call: "POST /shellfish/growout-units/${unit}/husbandry-logs"
              payload: { log_type: "INSPECTION", performed_at: "2026-07-20T12:00:00Z", mortality_count: 0, notes: "routine" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/growout-units/${unit}/husbandry-logs"
              payload: { log_type: "PREDATOR_CONTROL", performed_at: "2026-07-20T13:00:00Z", predator_species: "OYSTER_DRILL", control_method: "NETTING", mortality_count: 0 }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/harvest-authorizations"
              payload: { lease_id: "${lease}", growout_unit_id: "${unit}", vessel_id: "${vessel}", dealer_id: "${dealer}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T18:00:00Z", projected_bushels: 600 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { auth: $.data.id }
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/harvest-authorizations/${auth}/activate"
              payload: {}
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/harvest-authorizations/${auth}/harvest-lots"
              payload: { lot_code: "LOT-BIG", bushels: 500, first_out_of_water_at: "2026-08-10T06:00:00Z", last_out_of_water_at: "2026-08-10T08:00:00Z", placed_in_temperature_control_at: "2026-08-10T10:30:00Z", water_temp_c: 24.0 }
              as: FarmOperator
              as_user_id: "op-1"
