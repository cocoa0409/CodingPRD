  - rule_id: transitive_cascade
    instances:
      - name: equipment_remove_cascades_four_hops_to_slot_reopen
        grounds:
          - endpoints.POST_/upfit/equipment-installations/{equipment_installation_id}/remove
          - state_machines.WeightCertification.status.APPROVED_to_VOIDED
          - state_machines.UpfitOrder.compliance_status.LABELED_to_DESIGN_CERTIFIED
          - state_machines.UpfitOrder.build_status.BUILD_COMPLETE_to_IN_BUILD
          - state_machines.BuildSlot.status.CLOSED_to_IN_BUILD
          - entities.ComplianceLabel.fields.voided_at
        distinguishing_aspect: |
          Pulling one crane off a finished truck walks four hops that no single-hop implementation
          reaches: (1) the installation goes REMOVED with allocated_flow_gpm 0 and the order's
          committed flow / amp draws are restamped, (2) the APPROVED AS_MEASURED certification is
          VOIDED with voided_reason COMPONENT_SET_CHANGED, (3) the ComplianceLabel citing it gets
          voided_at stamped and compliance_status drops LABELED -> DESIGN_CERTIFIED, (4) build_status
          reverts BUILD_COMPLETE -> IN_BUILD and the most recently CLOSED FINAL_QC slot reopens to
          IN_BUILD. The AS_DESIGNED certification survives, which is exactly why hop 3 lands on
          DESIGN_CERTIFIED rather than NOT_STARTED.
