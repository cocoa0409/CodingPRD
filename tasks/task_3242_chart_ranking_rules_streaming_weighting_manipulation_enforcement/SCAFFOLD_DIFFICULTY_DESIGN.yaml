  - rule_id: non_linear_state_machine
    instances:
      - name: chart_week_branching_invalidation_loop
        grounds:
          - state_machines.ChartWeek
          - state_machines.ChartWeek.COMPUTED_to_LOCKED
        distinguishing_aspect: |
          ChartWeek has a branching non-linear shape: OPEN→LOCKED→COMPUTED→PUBLISHED forward, plus COMPUTED→LOCKED backward (system invalidation on methodology change) and OPEN→OPEN self-loop (holiday adjustment) — on the ChartWeek entity, distinct from MethodologyVersion's diamond.
        test_recipe:
          setup:
