# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Statutory Digital Performance Royalty Collection & Split
# Nine Difficulty Rules x 2 instances each = 18 instances.
# Shared fixture constants used across instances:
#   Schedule NS-1: category=NONSUBSCRIPTION_AD_SUPPORTED,
#     window [2026-01-01, 2026-12-31], rate=2600 microcents/perf, min_fee=100000c
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_liability_per_period_vs_ytd_minimum_fee
        grounds:
          - calculations.calc_royalty_liability
          - entities.RoyaltyLiability.fields.amount_due_cents
          - entities.RoyaltyLiability.fields.minimum_fee_cents
        distinguishing_aspect: |
          The same report inputs yield amount_due_cents == 100000 under the
          PER_PERIOD_MINIMUM variant but 13 under the YTD_MINIMUM_FEE variant
          (ytd paid = 100000, so floor = max(0, 100000 - 100000) = 0, gross = 13
          binds) — two valid variants of the same statutory minimum-fee rule on
          the RoyaltyLiability domain produce different amounts due.
        test_recipe:
          setup:
            - "Licensee L (ACTIVE, NONSUBSCRIPTION_AD_SUPPORTED) with EFFECTIVE Schedule NS-1 (rate 2600 microcents, min_fee 100000c, window 2026-01-01..2026-12-31)"
            - "Report A (period 2026-01-01..2026-01-31) ACCEPTED with one play line of 10000 performances; liability A computed, billed, paid (amount_due 100000, min fee binds since gross=26)"
            - "Report B (period 2026-02-01..2026-02-28) ACCEPTED with one play line of 5000 performances"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "StreamCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_a: $.data.id }
            - call: "POST /usage-reports/${rep_a}/play-lines"
              payload: { isrc: "NO-SUCH-ISRC-1", track_title: "T1", artist_name: "A1", performance_count: 10000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_a}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_a}/accept"
              payload: {}
              as: RoyaltyOps
              captures: { rep_a_v: $.data.version }
            - call: "POST /usage-reports/${rep_a}/compute-liability"
              payload: { expected_usage_report_version: "${rep_a_v}" }
              as: RoyaltyOps
              captures: { liab_a: $.data.id }
            - call: "POST /royalty-liabilities/${liab_a}/bill"
              payload: {}
              as: RoyaltyOps
            - call: "POST /royalty-liabilities/${liab_a}/record_payment"
              payload: {}
              as: RoyaltyOps
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_b: $.data.id, rep_b_v: $.data.version }
            - call: "POST /usage-reports/${rep_b}/play-lines"
              payload: { isrc: "NO-SUCH-ISRC-2", track_title: "T2", artist_name: "A2", performance_count: 5000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_b}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_b_v2: $.data.version }
            - call: "POST /usage-reports/${rep_b}/accept"
              payload: {}
              as: RoyaltyOps
              captures: { rep_b_v3: $.data.version }
          trigger:
            - call: "POST /usage-reports/${rep_b}/compute-liability"
              payload: { expected_usage_report_version: "${rep_b_v3}" }
              as: RoyaltyOps
              captures: { liab_b: $.data.id }
          assert:
            - "RoyaltyLiability.${liab_a}.minimum_fee_cents == 100000"
            - "RoyaltyLiability.${liab_a}.amount_due_cents == 100000"
            - "RoyaltyLiability.${liab_b}.gross_performance_royalty_cents == 13"
            - "RoyaltyLiability.${liab_b}.minimum_fee_cents == 0"
            - "RoyaltyLiability.${liab_b}.amount_due_cents == 13"
            - "RoyaltyLiability.${liab_b}.admin_fee_cents == 1"
            - "RoyaltyLiability.${liab_b}.distributable_pool_cents == 12"

      - name: audit_assessment_declared_only_vs_penalty_cost_loading
        grounds:
          - calculations.calc_audit_underpayment
          - entities.AuditCase.fields.assessed_underpayment_cents
        distinguishing_aspect: |
          Two valid readings of the audit-recovery rule on the AuditCase domain:
          a declared-only variant (sum of positive recomputation deltas) versus
          the pinned full assessment (declared + 15% underreport penalty +
          50000c cost recovery). Identical licensee data yields 30000c vs 84500c.
        test_recipe:
          setup:
            - "Licensee L2 (ACTIVE, NONSUBSCRIPTION_AD_SUPPORTED) under Schedule NS-1"
            - "Report C (period 2026-03-01..2026-03-31) ACCEPTED, one play line of 40000000 performances; liability computed (gross 104000, due 104000), billed, paid"
            - "AuditCase opened over 2026-03-01..2026-03-31 by auditor A-one"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "BigStream", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_c: $.data.id }
            - call: "POST /usage-reports/${rep_c}/play-lines"
              payload: { isrc: "NO-SUCH-ISRC-3", track_title: "T3", artist_name: "A3", performance_count: 40000000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_c}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_c_v: $.data.version }
            - call: "POST /usage-reports/${rep_c}/accept"
              payload: {}
              as: RoyaltyOps
            - call: "POST /usage-reports/${rep_c}/compute-liability"
              payload: { expected_usage_report_version: "${rep_c_v}" }
              as: RoyaltyOps
              captures: { liab_c: $.data.id }
            - call: "POST /royalty-liabilities/${liab_c}/bill"
              payload: {}
              as: RoyaltyOps
            - call: "POST /royalty-liabilities/${liab_c}/record_payment"
              payload: {}
              as: RoyaltyOps
            - call: "POST /licensees/${lic_id}/audit-cases"
              payload: { auditor_ref: "AUD-1", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: RoyaltyAuditor
              as_user_id: "auditor-one"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audit-cases/${audit_id}/issue_findings"
              payload: { declared_true_performances: 50000000 }
              as: RoyaltyAuditor
              as_user_id: "auditor-two"
          assert:
            - "AuditCase.${audit_id}.audit_status == FINDINGS_ISSUED"
            - "AuditCase.${audit_id}.assessed_underpayment_cents == 84500"
            - "84500 != 30000 (the declared-only variant: recomputed due 130000 - original due 100000)"

  - rule_id: combinatorial_formula
    instances:
      - name: distribution_split_multifactor_waterfall
        grounds:
          - calculations.calc_distribution_split
          - calculations.calc_featured_split_weighting
          - entities.DistributionLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (a): the split has 4 interacting inputs (distributable pool,
          matched/total performance ratio, per-recording performance weights,
          fixed 50/45/5 statutory shares) with non-linear nested floor() and
          remainder routing — rec A (60000 perfs) yields RO=28571 / FA=25714 /
          AFM=1429 / SAG=1429 while rec B (40000 perfs) yields RO=19047 /
          FA=17142 / AFM=953 / SAG=953 off the same pool.
        test_recipe:
          setup:
            - "Licensee L (ACTIVE, NONSUBSCRIPTION_AD_SUPPORTED) under Schedule NS-1 (2600 microcents, min_fee 100000c)"
            - "VERIFIED RightsOwner RO and two VERIFIED Artists FA-A, FA-B; Recordings recA (ISRC-AA, 60000 perfs) and recB (ISRC-BB, 40000 perfs) ACTIVE"
            - "Report R2 (2026-01-01..2026-01-31) ACCEPTED: recA line 60000, recB line 40000, unmatched line (ISRC-ZZ) 5000; liability computed (gross 273, min binds, due 100000, admin 0, pool 100000) and PAID"
            - "DistributionBatch planned with scheduled_for in the past relative to the logical clock"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "SplitCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /rights-owners"
              payload: { legal_name: "Label One", contact_email: "ro@x.com" }
              as: PayeeAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /rights-owners/${ro_id}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /artists"
              payload: { stage_name: "Artist A", contact_email: "aa@x.com" }
              as: PayeeAdmin
              captures: { fa_a: $.data.id }
            - call: "POST /artists/${fa_a}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /artists"
              payload: { stage_name: "Artist B", contact_email: "ab@x.com" }
              as: PayeeAdmin
              captures: { fa_b: $.data.id }
            - call: "POST /artists/${fa_b}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /recordings"
              payload: { isrc: "ISRC-AA", track_title: "Song A", rights_owner_id: "${ro_id}", featured_artist_id: "${fa_a}" }
              as: Admin
            - call: "POST /recordings"
              payload: { isrc: "ISRC-BB", track_title: "Song B", rights_owner_id: "${ro_id}", featured_artist_id: "${fa_b}" }
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "ISRC-AA", track_title: "Song A", artist_name: "Artist A", performance_count: 60000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "ISRC-BB", track_title: "Song B", artist_name: "Artist B", performance_count: 40000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "ISRC-ZZ", track_title: "Song Z", artist_name: "Artist Z", performance_count: 5000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_v: $.data.version }
            - call: "POST /usage-reports/${rep_id}/accept"
              payload: {}
              as: RoyaltyOps
            - call: "POST /usage-reports/${rep_id}/compute-liability"
              payload: { expected_usage_report_version: "${rep_v}" }
              as: RoyaltyOps
              captures: { liab_id: $.data.id }
            - call: "POST /royalty-liabilities/${liab_id}/bill"
              payload: {}
              as: RoyaltyOps
            - call: "POST /royalty-liabilities/${liab_id}/record_payment"
              payload: {}
              as: RoyaltyOps
            - call: "POST /unclaimed-pools"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: Admin
              captures: { pool_id: $.data.id }
            - call: "POST /usage-reports/${rep_id}/distribution-batches"
              payload: { scheduled_for: "2026-08-01T00:00:00Z" }
              as: RoyaltyOps
              captures: { batch_id: $.data.id, batch_v: $.data.version }
          trigger:
            - call: "POST /distribution-batches/${batch_id}/execute"
              payload: { expected_distribution_batch_version: "${batch_v}" }
              as: RoyaltyOps
          assert:
            - "RoyaltyLiability.${liab_id}.liability_status == SETTLED"
            - "DistributionLine(recA, RIGHTS_OWNER).amount_cents == 28571"
            - "DistributionLine(recA, FEATURED_ARTIST).amount_cents == 25714"
            - "DistributionLine(recA, NONFEATURED_FUND, AFM).amount_cents == 1429"
            - "DistributionLine(recA, NONFEATURED_FUND, SAG_AFTRA).amount_cents == 1429"
            - "DistributionLine(recB, RIGHTS_OWNER).amount_cents == 19047"
            - "DistributionLine(recB, FEATURED_ARTIST).amount_cents == 17142"
            - "DistributionLine(recB, NONFEATURED_FUND, AFM).amount_cents == 953"
            - "DistributionLine(recB, NONFEATURED_FUND, SAG_AFTRA).amount_cents == 953"
            - "UnclaimedPool.${pool_id}.accrued_unmatched_cents == 4762"

      - name: per_line_then_sum_rounding_order
        grounds:
          - calculations.calc_per_performance_royalty
          - entities.RoyaltyLiability.fields.gross_performance_royalty_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum. Two lines of 250 performances at 2600
          microcents each round to 1c per line and sum to gross == 2; the
          alternative sum-then-round order would give round(500 x 2600 / 1e6) == 1.
        test_recipe:
          setup:
            - "Licensee L (ACTIVE, NONSUBSCRIPTION_AD_SUPPORTED) under Schedule NS-1"
            - "Report R (2026-04-01..2026-04-30) ACCEPTED with two play lines of 250 performances each"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "RoundCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "NO-MATCH-1", track_title: "P", artist_name: "Q", performance_count: 250 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "NO-MATCH-2", track_title: "R", artist_name: "S", performance_count: 250 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_v: $.data.version }
            - call: "POST /usage-reports/${rep_id}/accept"
              payload: {}
              as: RoyaltyOps
          trigger:
            - call: "POST /usage-reports/${rep_id}/compute-liability"
              payload: { expected_usage_report_version: "${rep_v}" }
              as: RoyaltyOps
              captures: { liab_id: $.data.id }
          assert:
            - "RoyaltyLiability.${liab_id}.gross_performance_royalty_cents == 2"
            - "2 != 1 (the sum-then-round order the scaffold forbids)"

  - rule_id: non_linear_state_machine
    instances:
      - name: usage_report_amendment_cycle
        grounds:
          - state_machines.UsageReport.ACCEPTED_to_AMENDED
          - state_machines.UsageReport.AMENDED_to_SUBMITTED
          - state_machines.UsageReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Cyclic machine on UsageReport: ACCEPTED -> AMENDED -> SUBMITTED ->
          ACCEPTED is a genuine loop (not a pipeline), and the second compute
          after the loop reflects the amended play lines while preserving the
          original snapshot rate.
        test_recipe:
          setup:
            - "Licensee L (ACTIVE) under Schedule NS-1; VERIFIED rights owner RO + artist FA; recording REC (ISRC-CC) ACTIVE"
            - "Report R (2026-05-01..2026-05-31) has run one full cycle: submitted with a 10000-perf matched line, accepted, computed (due 100000), then amended"
            - "While AMENDED, the licensee deletes nothing and adds a second matched line of 40000 performances on the same recording"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "CycleCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /rights-owners"
              payload: { legal_name: "Label C", contact_email: "c@x.com" }
              as: PayeeAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /rights-owners/${ro_id}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /artists"
              payload: { stage_name: "Art C", contact_email: "ac@x.com" }
              as: PayeeAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /artists/${fa_id}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /recordings"
              payload: { isrc: "ISRC-CC", track_title: "Song C", rights_owner_id: "${ro_id}", featured_artist_id: "${fa_id}" }
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "ISRC-CC", track_title: "Song C", artist_name: "Art C", performance_count: 10000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_v1: $.data.version }
            - call: "POST /usage-reports/${rep_id}/accept"
              payload: {}
              as: RoyaltyOps
            - call: "POST /usage-reports/${rep_id}/compute-liability"
              payload: { expected_usage_report_version: "${rep_v1}" }
              as: RoyaltyOps
              captures: { liab_v1: $.data.id }
            - call: "POST /usage-reports/${rep_id}/amend"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/play-lines"
              payload: { isrc: "ISRC-CC", track_title: "Song C", artist_name: "Art C", performance_count: 40000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_id}/accept"
              payload: {}
              as: RoyaltyOps
              captures: { rep_v2: $.data.version }
          trigger:
            - call: "POST /usage-reports/${rep_id}/compute-liability"
              payload: { expected_usage_report_version: "${rep_v2}" }
              as: RoyaltyOps
          assert:
            - "UsageReport.${rep_id}.report_status == ACCEPTED (second pass through the loop)"
            - "UsageReport.${rep_id}.total_performances == 50000"
            - "UsageReport.${rep_id}.matched_performances == 50000"
            - "RoyaltyLiability.${liab_v1}.gross_performance_royalty_cents == 130 after recompute (50000 x 2600 / 1e6)"

      - name: ownership_claim_review_loop
        grounds:
          - state_machines.OwnershipClaim.OPEN_to_UNDER_REVIEW
          - state_machines.OwnershipClaim.UNDER_REVIEW_to_OPEN
          - state_machines.OwnershipClaim.UNDER_REVIEW_to_UPHELD
        distinguishing_aspect: |
          Cyclic machine on OwnershipClaim (different entity than UsageReport):
          OPEN -> UNDER_REVIEW -> OPEN -> UNDER_REVIEW -> UPHELD loops through
          review twice before resolution, and the UPHELD resolution reassigns
          Recording.rights_owner_id to the claimant.
        test_recipe:
          setup:
            - "VERIFIED RightsOwners RO1 (current owner) and RO2 (claimant); VERIFIED artist FA; Recording REC (ISRC-DD) ACTIVE with rights_owner_id = RO1"
            - "OwnershipClaim opened by PayeeAdmin naming RO2 as claimant, then driven OPEN -> UNDER_REVIEW -> OPEN -> UNDER_REVIEW"
