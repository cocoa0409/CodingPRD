            - "the 2026-07-31 request returns HTTP 422 with data.error_id == \"ERR_SERVICE_DATE_OUT_OF_RANGE\" (before visit_start_date)"
            - "the 2026-10-31 request returns HTTP 422 with data.error_id == \"ERR_SERVICE_DATE_OUT_OF_RANGE\" (clock + 90 days == 2026-10-30)"
            - "the 2026-10-30 request returns HTTP 200 with ${edge_used} == 3 (the upper bound is inclusive) and status \"ACTIVE\""

      - name: suspension_ladder_second_upheld_decision_is_fourteen_days
        claim_type: tiered_pricing
        grounds:
