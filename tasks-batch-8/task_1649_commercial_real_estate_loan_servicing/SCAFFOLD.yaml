  - { method: POST, path: "/extension-options/{id}/exercise", description: "Borrower exercises an option inside its window", roles: [Borrower], code: 200, input: [], output: ExtensionOption, side_effects: ["exercised_fee_cents computed", "loan.maturity_date extended", "loan.version += 1"] }
  - { method: GET, path: "/loans/{id}/watchlist-entries", description: "List watchlist entries of a loan", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: ["status?", "criterion?", "limit?", "offset?"], output: "WatchlistEntry[]", side_effects: [] }
  - { method: POST, path: "/watchlist-entries/{id}/resolve", description: "Resolve an ACTIVE entry (criterion-gated for REPORTING_DELINQUENCY)", roles: [MasterServicer, SpecialServicer], code: 200, input: [], output: WatchlistEntry, side_effects: ["servicing re-eval"] }
  - { method: POST, path: "/watchlist-entries/{id}/escalate", description: "Escalate entry -> loan to SPECIAL_SERVICING (cascade)", roles: [MasterServicer], code: 200, input: [], output: WatchlistEntry, side_effects: ["freeze reserves", "reject SUBMITTED draws", "cancel APPROVED draws", "suspend AVAILABLE options"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall time. Advancing runs the full deterministic sweep of calculations.collection_cadence in pinned order.", roles: [MasterServicer, SpecialServicer], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sweep steps 1-7 in order"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or entity_backed id not found" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not in endpoint's roles list (e.g. Borrower reviewing a statement, MasterServicer waiving)" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed role touches another owner's resource on a write (borrower loan-chain, inspector assignment)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path/FK id does not exist; also used for out-of-scope reads by entity-backed roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/field validation: missing required, bad enum, bad range, end < start, empty line_items" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version != parent.version on OCC-guarded creates" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure for the requested transition" }
  - { id: ERR_STATEMENT_ALREADY_REVIEWED, http: 409, condition: "Reviewing an ACCEPTED or REJECTED statement" }
  - { id: ERR_OPEN_COVENANT_BREACH, http: 409, condition: "OPEN CovenantAssessment blocks extension exercise / assumption approve-execute / reinstate" }
  - { id: ERR_LOAN_NOT_CURRENT, http: 409, condition: "loan.payment_status != CURRENT where required" }
  - { id: ERR_RESERVE_DISBURSEMENTS_FROZEN, http: 409, condition: "Review/fund draw while reserve.disbursement_frozen (SPECIAL_SERVICING)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Waiving user equals the statement reviewer (DSCR) or appraiser (LTV) of record" }
  - { id: ERR_ACTIVE_WATCHLIST_ENTRIES, http: 409, condition: "Reinstate attempted with ACTIVE WatchlistEntry remaining" }
  - { id: ERR_ESTOPPEL_REQUIRED, http: 409, condition: "Major lease approval / assumption approval lacks EXECUTED unexpired estoppel" }
  - { id: ERR_RETAINAGE_RELEASE_BLOCKED, http: 409, condition: "No COMPLETED inspection with completed_at >= funded_at on the loan's properties" }
  - { id: ERR_RESOLUTION_BLOCKED, http: 409, condition: "Resolving REPORTING_DELINQUENCY before an ACCEPTED statement exists for the period+type" }
  - { id: ERR_DUPLICATE_STATEMENT_PERIOD, http: 409, condition: "Statement for (loan, type, quarter) already SUBMITTED/ACCEPTED" }
  - { id: ERR_STATEMENT_PERIOD_MISALIGNED, http: 422, condition: "Period is not a full calendar quarter" }
  - { id: ERR_LEASE_SUITE_OVERLAP, http: 409, condition: "Closed-interval suite occupancy collision with a live lease" }
  - { id: ERR_COVERAGE_WINDOW_OVERLAP, http: 409, condition: "Closed-interval coverage collision per (property, coverage_type); touching dates overlap" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "Half-open window collision on inspector's SCHEDULED inspections" }
  - { id: ERR_DUPLICATE_RESERVE_ACCOUNT, http: 409, condition: "Second account of same type on one loan" }
  - { id: ERR_EXTENSION_WINDOW_OVERLAP, http: 409, condition: "Option windows (closed) overlap on same loan, or duplicate option_seq" }
  - { id: ERR_MAX_OPTIONS_REACHED, http: 422, condition: "Third extension option on one loan" }
  - { id: ERR_ASSUMPTION_IN_PROGRESS, http: 409, condition: "Non-terminal AssumptionRequest already exists for the loan" }
  - { id: ERR_DUPLICATE_ACTIVE_ESTOPPEL, http: 409, condition: "Unexpired PENDING/EXECUTED estoppel already exists for the lease" }
  - { id: ERR_EXTENSION_SEQUENCE_VIOLATION, http: 409, condition: "Exercising seq 2 while seq 1 not EXERCISED" }
  - { id: ERR_FORCE_PLACEMENT_NOT_NEEDED, http: 409, condition: "ACTIVE non-force-placed coverage of that type already exists" }
  - { id: ERR_FORCE_PLACED_CANCEL_BLOCKED, http: 409, condition: "Cancelling force-placed policy without replacement coverage from its start_date" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 409, condition: "Exercise outside [window_start, window_end] inclusive" }
  - { id: ERR_DELINQUENCY_THRESHOLD, http: 422, condition: "DEFAULT before 60 days delinquent" }
  - { id: ERR_INSPECTION_STALE, http: 409, condition: "Assumption approval lacks recent (<12mo) non-CRITICAL COMPLETED inspection on any property" }
  - { id: ERR_ASSUMPTION_APPROVAL_EXPIRED, http: 409, condition: "Execute after approval_expires_at" }
  - { id: ERR_INSUFFICIENT_RESERVE_FUNDS, http: 422, condition: "amount_cents > available_cents on approve/fund" }
  - { id: ERR_COVERAGE_BELOW_MINIMUM, http: 422, condition: "PROPERTY coverage_amount_cents < loan.current_balance_cents" }
  - { id: ERR_RESERVE_TARGET_SHORTFALL, http: 422, condition: "Reinstate with a reserve balance below target" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MasterServicer
    description: "Servicing operations staff of the master servicer"
    identity: opaque
    exclusive_operations:
      - "onboard borrowers/loans/properties/reserves/inspectors/extension options"
      - "review financial statements"
      - "schedule inspections; cancel inspections"
      - "appraise properties"
      - "release retainage"
      - "escalate watchlist entries (transfer to special servicing)"
      - "request estoppels"
    shared_operations:
      - "decide leases (with SpecialServicer)"
      - "review/fund disbursement requests (with SpecialServicer)"
      - "payment-status transitions (with SpecialServicer)"
      - "start-review/decide/execute assumption requests (with SpecialServicer)"
      - "resolve watchlist entries (with SpecialServicer)"
      - "deposits (with Borrower)"
      - "set logical clock (with SpecialServicer)"
      - "all reads"
  - name: SpecialServicer
    description: "Special servicer taking over WATCHLIST-escalated loans"
    identity: opaque
    exclusive_operations:
      - "waive covenant assessments (SoD-enforced)"
      - "reinstate loans to PERFORMING"
      - "force-place insurance"
    shared_operations:
      - "cancel insurance policies (with Borrower)"
      - "decide leases, review/fund disbursements, payment-status, assumption review/execute, resolve entries, clock, reads (with MasterServicer)"
  - name: Borrower
    description: "Borrowing entity acting on its own loans (loan-chain ownership)"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "submit financial statements"
      - "create/submit/revise leases"
      - "execute estoppels"
      - "create/cancel disbursement requests"
      - "submit assumption requests; withdraw them"
      - "exercise extension options"
      - "post insurance policies"
    shared_operations:
      - "deposits (with MasterServicer)"
      - "cancel insurance policies (with SpecialServicer)"
      - "reads scoped to own loan chain"
  - name: Inspector
    description: "Third-party property inspector"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "complete own assigned inspections (outcome COMPLETED with rating)"
    shared_operations:
      - "read own profile and own schedule"
