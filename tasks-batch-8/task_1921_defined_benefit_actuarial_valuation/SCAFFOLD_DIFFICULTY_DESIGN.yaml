              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_b}/approve"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_b}/lock"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/plans/${plan_b}/asset-statements"
              payload: { plan_year: 2028, market_value_begin: 64000, contributions_received: 0, benefits_paid: 3200, investment_return: 3200 }
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_b}/asset-valuations"
              payload: { plan_year: 2028 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { ava_b: "$.data.id" }
            - call: "POST /v1/plans/${plan_b}/valuation-runs"
              payload: { plan_year: 2028, census_batch_id: "${batch_b}", assumption_set_id: "${aset_b}", asset_valuation_id: "${ava_b}" }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { run_b: "$.data.id" }
            - call: "POST /v1/valuation-runs/${run_b}/compute"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "GET /v1/plans/${plan_b}"
              payload: {}
              as: PlanAdmin
              captures: { plan_b_v: "$.data.version" }
            - call: "POST /v1/valuation-runs/${run_b}/certify"
              payload: { expected_plan_version: "${plan_b_v}" }
              as: SeniorActuary
              as_user_id: "${act_rev}"
          trigger:
            - call: "POST /v1/plans/${plan_a}/pbgc-filings"
              payload: { valuation_run_id: "${run_a}", premium_method: "STANDARD" }
              as: PlanAdmin
              captures: { filing_a: "$.data.id" }
            - call: "POST /v1/plans/${plan_b}/pbgc-filings"
              payload: { valuation_run_id: "${run_b}", premium_method: "STANDARD" }
              as: PlanAdmin
              captures: { filing_b: "$.data.id" }
          assert:
            - "PBGCFiling.${filing_a}.flat_rate_premium == 300.00 (3 participants x 100)"
            - "PBGCFiling.${filing_a}.variable_rate_premium == 308.61 (6172.20 UVB x 50/1000, below the 1800 cap)"
            - "PBGCFiling.${filing_a}.cap_applied == false"
            - "PBGCFiling.${filing_a}.total_premium == 608.61"
            - "PBGCFiling.${filing_b}.uvb == 36000.00"
            - "PBGCFiling.${filing_b}.variable_rate_premium == 1800.00 (uncapped 1800.00 vs cap 3 x 600 = 1800; min selects the cap branch)"
            - "PBGCFiling.${filing_b}.cap_applied == true"
            - "PBGCFiling.${filing_b}.total_premium == 2100.00"

      - name: per_participant_round_then_sum_order
        grounds:
          - calculations.participant_accrual_liability
          - calculations.funding_target_aggregation
          - entities.ParticipantAccrual.fields.accrued_liability
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — per-participant liabilities are
          cent-rounded BEFORE aggregation. Crafted participants yield raw
          liabilities 147.62501908 and 492.06661746: round-then-sum gives
          639.70, sum-then-round gives 639.69; the scaffold pins 639.70.
        test_recipe:
          setup:
            - "Plan 2028; census with ACTIVE P1 (age 62, yos 1, comp 10000.34) and ACTIVE P2 (age 62, yos 3, comp 11111.11)"
            - "Raw liabilities: 100.0034 x 1.4762 = 147.62501908 -> 147.63; 333.3333 x 1.4762 = 492.06661746 -> 492.07"
