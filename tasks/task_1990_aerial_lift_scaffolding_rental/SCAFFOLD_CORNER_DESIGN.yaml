              as: RentalCoordinator
              captures: { acc: $.data.accrued_charge_cents }
          assert:
            - "25 elapsed hours -> billable_days == 2 -> accrued_charge_cents == 29000 (min(14500*2, 43500, 99000))"

      - name: standby_under_free_window
        claim_type: constants_applied
        grounds: [calculations.standby_charge]
        distinguishing_aspect: "The FREE_STANDBY_MINUTES=30 constant makes a 10-minute standby free (charge 0), distinct from the 30/31 boundary probe in §1.8."
        test_recipe:
          setup: ["contract ACTIVE; RESERVED line; DELIVERY trip EN_ROUTE at 2026-08-10T09:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
