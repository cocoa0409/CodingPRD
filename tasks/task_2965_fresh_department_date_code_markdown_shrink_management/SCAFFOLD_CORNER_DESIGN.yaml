            - "second response: HTTP 201 with data.status == 'ASSIGNED' and data.unit_price_cents_snapshot == 599"
            - "second response: data.line_value_cents == 5990 and data.line_credit_cents == 0 (credits wait for the seal)"
            - "DateCodeLot.${lot_id}.status == 'DONATION_PENDING' with quantity_on_hand == 24 (assignment reserves, it does not move units)"
            - "DonationPickup.${pickup_chilled}.assignment_count == 1 and provisional_value_cents == 5990"

      - name: donation_window_opens_exactly_fortyeight_hours_before_sell_by
        claim_type: temporal_validation
        grounds:
          - validations[priority 27]
          - errors[ERR_DONATION_WINDOW_CLOSED]
          - calculations.donation_eligibility
        distinguishing_aspect: |
          The eligibility interval is half-open at the open edge: one millisecond before
          2026-08-13T00:00:00.000Z the assignment is ERR_DONATION_WINDOW_CLOSED (422), and at that
          instant exactly it is accepted, because the window opens at sell_by_at minus
          DONATION_WINDOW_HOURS.
        test_recipe:
          setup:
            - "A PRODUCE department on donation-enabled store 0412 with a MID-ATL partner accepting PRODUCE."
            - "One 10-unit lot produced 2026-08-10 with a 5-day shelf life, so sell_by_at is 2026-08-15T00:00:00.000Z and the window opens 2026-08-13T00:00:00.000Z."
            - "One SCHEDULED pickup on dock D1 for 2026-08-13T14:00:00.000Z to 15:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
