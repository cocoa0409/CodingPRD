# =============================================================================
# SCAFFOLD.yaml — task_3012_white_label_delivery_as_service_fulfillment
# White-Label Delivery-as-a-Service Fulfillment (DoorDash Drive-style)
# Difficulty posture: beyond Expert — dense coupling, dual-variant pricing,
# transitive financial cascades, two OCC-guarded supersede races.
# =============================================================================

scenario: |
  White-Label Delivery-as-a-Service Fulfillment (DoorDash Drive): merchant-owned
  order intake through the merchant's own channel with delivery outsourced by API,
  per-delivery pricing by distance band, order value and time of day with surge
  pass-through, courier assignment respecting merchant pickup readiness and
  batching restrictions on white-label orders, delivery radius configuration and
  address-level serviceability, branded tracking experience and support routing
  back to the merchant, undeliverable order disposition with return-to-store
  versus disposal rules, refund liability allocation between merchant and
  platform, service-level reporting and credits for late deliveries

domain_name: white-label-delivery
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - pagination_with_filtering
    - idempotency

  entity_topology: flat            # all peers, FK references in bodies/sub-resources
  state_machine_shape: compound    # DeliveryOrder = parallel dims; batch & claim non-linear

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: peer_roles           # Merchant / Courier / SupportAgent / PlatformAdmin
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Merchant brand name" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED", default: ONBOARDING }
      - { name: billing_balance_cents, type: integer, source: input, description: "Prepaid delivery-fee balance debited at accept/settle/refund" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum of ServiceCredit.amount_cents in APPLIED minus VOIDED for this merchant; starts 0" }
      - { name: default_refund_split_merchant_pct, type: integer, source: input, description: "Merchant share percent applied to CUSTOMER_UNAVAILABLE and ADDRESS_ISSUE refund faults", default: 50, constraints: "0..100 inclusive" }
      - { name: late_credit_enabled, type: boolean, source: input, description: "When true, SLA report finalization auto-applies accrued late-delivery credits", default: true }

  - name: MerchantStore
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; owning merchant" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: address_text, type: string, source: input, description: "Pickup address; origin of every delivery from this store" }
      - { name: lat, type: number, source: input, description: "Pickup latitude (degrees)" }
      - { name: lng, type: number, source: input, description: "Pickup longitude (degrees)" }
      - { name: delivery_radius_m, type: integer, source: input, description: "Max serviceable straight-line distance in meters; boundary inclusive" }
      - { name: timezone, type: string, source: input, description: "IANA timezone used to resolve peak windows against pickup_ready_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", default: ACTIVE }

  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; owning merchant" }
      - { name: distance_bands, type: array, source: input, description: "Ordered array of {max_m, base_cents, per_100m_cents}; first band covers 0..max_m, later bands cover (prev.max_m, max_m]" }
      - { name: value_tiers, type: array, source: input, description: "Ordered array of {min_order_value_cents, surcharge_cents}; highest matching tier applies" }
      - { name: peak_windows, type: array, source: input, description: "Array of {start_local_hhmm, end_local_hhmm} half-open windows in store timezone" }
      - { name: peak_uplift_pct, type: number, source: input, description: "Fractional uplift (e.g. 0.25) applied to (band_fee + value_surcharge) during peak windows" }
      - { name: surge_passthrough_pct, type: number, source: input, description: "Fraction of (dispatch surge component minus quoted surge component) passed through to the merchant invoice" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start [effective_from, effective_until)" }
      - { name: effective_until, type: datetime, source: input, description: "Half-open window end; must be > effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | ARCHIVED", default: DRAFT, constraints: "at most one ACTIVE per merchant" }

  - name: ServiceabilityOverride
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> MerchantStore.id; store this override applies to" }
      - { name: address_pattern, type: string, source: input, description: "Case-insensitive substring pattern matched against the delivery address_text" }
      - { name: effect, type: enum, source: input, description: "ALLOW | DENY" }

  - name: DeliveryQuote
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; quoting merchant" }
      - { name: store_id, type: string, source: input, description: "FK -> MerchantStore.id; pickup store" }
      - { name: dropoff_lat, type: number, source: input, description: "Dropoff latitude" }
      - { name: dropoff_lng, type: number, source: input, description: "Dropoff longitude" }
      - { name: address_text, type: string, source: input, description: "Dropoff address used for serviceability override matching" }
      - { name: order_value_cents, type: integer, source: input, description: "Merchandise value; drives value-tier surcharge" }
      - { name: pickup_ready_at, type: datetime, source: input, description: "Merchant-declared pickup readiness time; drives peak-window lookup" }
      - { name: distance_m, type: integer, source: computed, description: "Manhattan-planar distance per calculations.delivery_distance" }
      - { name: band_fee_cents, type: integer, source: computed, description: "Distance-band component of quoted fee" }
      - { name: value_surcharge_cents, type: integer, source: computed, description: "Order-value-tier component of quoted fee" }
      - { name: peak_uplift_cents, type: integer, source: computed, description: "Time-of-day component of quoted fee (0 off-peak)" }
      - { name: surge_component_cents, type: integer, source: computed, description: "Surge component at quote time (current platform surge multiplier)" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Sum of the four components; quoted variant of the delivery fee" }
      - { name: pricing_policy_id, type: string, source: system, description: "FK -> PricingPolicy.id; ACTIVE policy pinned at quote time" }
      - { name: quoted_surge_multiplier, type: number, source: system, description: "Platform surge multiplier in force at quote time" }
      - { name: valid_until, type: datetime, source: system, description: "created_at + 15 minutes; quote unusable afterwards" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONSUMED | EXPIRED", default: ACTIVE }

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> DeliveryQuote.id; consumed on creation" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from quote" }
      - { name: store_id, type: string, source: system, description: "FK -> MerchantStore.id; copied from quote" }
      - { name: batch_id, type: string, source: system, description: "FK -> DeliveryBatch.id; null until batched", default: null }
      - { name: customer_reference, type: string, source: input, description: "Merchant's own order reference (white-label: platform never sees end-customer identity)" }
      - { name: idempotency_key, type: string, source: input, description: "Merchant-scoped idempotency key; duplicate POST returns the original order" }
      - { name: promised_at, type: datetime, source: input, description: "Promised delivery time set at accept; lateness measured against this" }
      - { name: fulfillment_status, type: enum, source: system, description: "QUOTED | ACCEPTED | READY_FOR_PICKUP | PICKED_UP | IN_TRANSIT | DELIVERED | UNDELIVERABLE | RETURN_IN_PROGRESS | RETURNED_TO_STORE | DISPOSAL_PENDING | DISPOSED | CANCELLED", default: QUOTED }
      - { name: billing_status, type: enum, source: system, description: "PENDING | AUTHORIZED | SETTLED | REFUNDED | VOIDED", default: PENDING }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Copied from quote at creation; never changes" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final variant: base components + dispatch-surge component; null until batch dispatch", default: null }
      - { name: merchant_invoice_cents, type: integer, source: computed, description: "Amount the merchant is actually charged: base + quoted surge + passthrough delta; null until dispatch", default: null }
      - { name: batch_fee_share_cents, type: integer, source: computed, description: "This order's share of batch courier cost per calculations.batch_fee_allocation; null until dispatch", default: null }
      - { name: late_credit_cents, type: integer, source: computed, description: "Late-delivery credit earned at delivery completion per calculations.late_delivery_credit; 0 when on time", default: 0 }
      - { name: delivered_at, type: datetime, source: system, description: "Clock time at complete-delivery; null until DELIVERED", default: null }
      - { name: undeliverable_reason, type: enum, source: input, description: "CUSTOMER_UNAVAILABLE | ADDRESS_ISSUE | DAMAGED_IN_TRANSIT; set by report-undeliverable", default: null }

  - name: Courier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Courier display name (internal only; never shown to merchant customers)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: max_active_deliveries, type: integer, source: input, description: "Capacity cap on orders across the courier's DISPATCHED batches", default: 4 }

  - name: DeliveryBatch
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> MerchantStore.id; all batched orders must belong to this store (white-label batching restriction)" }
      - { name: courier_id, type: string, source: input, description: "FK -> Courier.id; assigned courier" }
      - { name: order_ids, type: array, source: input, description: "DeliveryOrder ids to batch; 1..3 entries, all from store_id, all READY_FOR_PICKUP" }
      - { name: dispatch_window_start, type: datetime, source: input, description: "Closed-interval dispatch window start" }
      - { name: dispatch_window_end, type: datetime, source: input, description: "Closed-interval dispatch window end; must be > start" }
      - { name: courier_cost_cents, type: integer, source: computed, description: "BATCH_BASE_COST_CENTS + BATCH_PER_ORDER_CENTS * len(order_ids)" }
      - { name: status, type: enum, source: system, description: "COURIER_ASSIGNED | DISPATCHED | COMPLETED | FAILED", default: COURIER_ASSIGNED }

  - name: TrackingEvent
    parent: null
    common_fields: false
    fields:
      - { name: delivery_order_id, type: string, source: input, description: "FK -> DeliveryOrder.id; order this event belongs to" }
      - { name: event_type, type: enum, source: input, description: "ORDER_ACCEPTED | COURIER_ASSIGNED | PICKED_UP | IN_TRANSIT | DELIVERED | UNDELIVERABLE | RETURN_IN_PROGRESS | RETURNED_TO_STORE | DISPOSED | CANCELLED | NOTE" }
      - { name: note, type: string, source: input, description: "Optional free-text note", default: "" }
      - { name: visibility, type: enum, source: input, description: "MERCHANT_VISIBLE | INTERNAL_ONLY; branded tracking feed shows MERCHANT_VISIBLE only", default: MERCHANT_VISIBLE }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock time at emission" }

  - name: Disposition
    parent: null
    common_fields: true
    fields:
      - { name: delivery_order_id, type: string, source: input, description: "FK -> DeliveryOrder.id; the UNDELIVERABLE order being disposed" }
      - { name: resolution, type: enum, source: input, description: "RETURN_TO_STORE | DISPOSE" }
      - { name: return_fee_cents, type: integer, source: computed, description: "RETURN_FEE_CENTS when resolution is RETURN_TO_STORE, else 0" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED", default: PENDING }

  - name: RefundClaim
    parent: null
    common_fields: true
    fields:
      - { name: delivery_order_id, type: string, source: input, description: "FK -> DeliveryOrder.id; order being claimed against (billing must be SETTLED)" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from order" }
      - { name: fault_code, type: enum, source: input, description: "COURIER_DELAY | PLATFORM_OUTAGE | MERCHANT_FULFILLMENT | CUSTOMER_UNAVAILABLE | ADDRESS_ISSUE" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed; must be <= order.merchant_invoice_cents" }
      - { name: merchant_share_cents, type: integer, source: computed, description: "Merchant liability share per calculations.refund_liability_split; null until decide-APPROVE", default: null }
      - { name: platform_share_cents, type: integer, source: computed, description: "Platform liability share; merchant_share + platform_share == claimed_amount invariant", default: null }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed; max 1", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | APPEALED | SETTLED | REVERSED", default: FILED }

  - name: SlaReport
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; merchant under review" }
      - { name: period_start, type: datetime, source: input, description: "Half-open report window start [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Half-open report window end; must be > period_start" }
      - { name: total_deliveries, type: integer, source: computed, description: "Orders delivered_at in window (GROSS variant population); computed at finalize" , default: null }
      - { name: late_deliveries_gross, type: integer, source: computed, description: "Delivered orders with delivered_at > promised_at + LATE_GRACE_SECONDS", default: null }
      - { name: attainment_rate_gross, type: number, source: computed, description: "1 - late/total (GROSS variant); 1.0 when total == 0", default: null }
      - { name: attainment_rate_fault_adjusted, type: number, source: computed, description: "FAULT_ADJUSTED variant: late orders whose linked SETTLED claim fault_code is MERCHANT_FULFILLMENT are excluded from both numerator and denominator", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED", default: OPEN }

  - name: ServiceCredit
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from report" }
      - { name: sla_report_id, type: string, source: system, description: "FK -> SlaReport.id; report that accrued this credit" }
      - { name: delivery_order_id, type: string, source: system, description: "FK -> DeliveryOrder.id; the late order" }
      - { name: amount_cents, type: integer, source: computed, description: "Copied from order.late_credit_cents at accrual" }
      - { name: reason, type: enum, source: system, description: "LATE_DELIVERY", default: LATE_DELIVERY }
      - { name: status, type: enum, source: system, description: "ACCRUED | APPLIED | VOIDED", default: ACCRUED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Merchant
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /merchants/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["merchant.status == ONBOARDING (ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /merchants/{id}/suspend, or system cascade when refund settlement drives billing_balance_cents < 0"
        actor: PlatformAdmin | system
        preconditions: ["merchant.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "All merchant DeliveryOrders in QUOTED, ACCEPTED or READY_FOR_PICKUP -> CANCELLED with billing_status -> VOIDED and billing hold released (billing_balance_cents += quoted_fee_cents for AUTHORIZED orders)"
          - "increments Merchant.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /merchants/{id}/resume"
        actor: PlatformAdmin
        preconditions: ["merchant.status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]

  - entity: PricingPolicy
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /merchants/{id}/pricing-policies/{pid}/activate (OCC: expected_merchant_version)"
        actor: Merchant
        preconditions:
          - "policy.status == DRAFT (ERR_INVALID_STATE)"
          - "policy.effective window does not overlap any other ACTIVE policy's half-open [effective_from, effective_until) window for this merchant (ERR_POLICY_WINDOW_OVERLAP)"
          - "expected_merchant_version == merchant.version (ERR_STALE_MERCHANT_VERSION, 412)"
        side_effects:
          - "The merchant's currently ACTIVE policy (if any) -> ARCHIVED"
          - "increments Merchant.version by 1"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (automatic when another policy of the same merchant is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeliveryQuote
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /delivery-orders with quote_id"
        actor: Merchant
        preconditions: ["quote.status == ACTIVE and clock < quote.valid_until (ERR_QUOTE_EXPIRED when past valid_until)"]
        side_effects: ["DeliveryOrder created in fulfillment QUOTED / billing PENDING"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (on any read/use once clock >= valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeliveryOrder
    initial_state: "fulfillment QUOTED / billing PENDING (parallel dimensions)"
    terminal_states: ["fulfillment: DELIVERED, RETURNED_TO_STORE, DISPOSED, CANCELLED; billing: SETTLED (after delivery-family), REFUNDED, VOIDED"]
    transitions:
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /delivery-orders/{id}/accept"
        actor: Merchant
        preconditions:
          - "fulfillment_status == QUOTED (ERR_INVALID_STATE)"
          - "merchant.status == ACTIVE (ERR_MERCHANT_SUSPENDED)"
          - "store.status == ACTIVE (ERR_STORE_NOT_ACTIVE)"
          - "merchant.billing_balance_cents >= quoted_fee_cents (ERR_INSUFFICIENT_BILLING_BALANCE)"
        side_effects:
          - "billing_status -> AUTHORIZED; merchant.billing_balance_cents -= quoted_fee_cents"
          - "TrackingEvent ORDER_ACCEPTED (MERCHANT_VISIBLE) emitted"
      - from: ACCEPTED
        to: READY_FOR_PICKUP
        trigger: "POST /delivery-orders/{id}/mark-ready"
        actor: Merchant
        preconditions: ["fulfillment_status == ACCEPTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel"
        actor: Merchant
        preconditions: ["fulfillment_status == QUOTED (ERR_INVALID_STATE)"]
        side_effects: ["billing_status -> VOIDED (no hold existed)"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel"
        actor: Merchant
        preconditions: ["fulfillment_status == ACCEPTED (ERR_INVALID_STATE)"]
        side_effects:
          - "billing_status -> VOIDED; merchant.billing_balance_cents += quoted_fee_cents (hold released)"
          - "TrackingEvent CANCELLED emitted"
      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /delivery-orders/{id}/confirm-pickup"
        actor: Courier
        preconditions:
          - "fulfillment_status == READY_FOR_PICKUP (ERR_INVALID_STATE)"
          - "order.batch_id references a DISPATCHED batch whose courier_id == X-User-ID (ERR_INVALID_STATE)"
        side_effects: ["TrackingEvent PICKED_UP (MERCHANT_VISIBLE) emitted"]
      - from: PICKED_UP
        to: IN_TRANSIT
        trigger: "POST /delivery-orders/{id}/start-transit"
        actor: Courier
        preconditions: ["fulfillment_status == PICKED_UP (ERR_INVALID_STATE)"]
        side_effects: ["TrackingEvent IN_TRANSIT (MERCHANT_VISIBLE) emitted"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/complete-delivery"
        actor: Courier
        preconditions: ["fulfillment_status == IN_TRANSIT (ERR_INVALID_STATE)"]
        side_effects:
          - "delivered_at := clock; billing_status AUTHORIZED -> SETTLED"
          - "Invoice reconciliation: merchant.billing_balance_cents adjusted by (merchant_invoice_cents - quoted_fee_cents); negative delta refunds the merchant"
          - "late_credit_cents computed per calculations.late_delivery_credit"
          - "If every order in the parent batch is in a terminal fulfillment state, batch -> COMPLETED"
          - "TrackingEvent DELIVERED (MERCHANT_VISIBLE) emitted"
      - from: PICKED_UP
        to: UNDELIVERABLE
        trigger: "POST /delivery-orders/{id}/report-undeliverable"
        actor: Courier
        preconditions: ["fulfillment_status IN (PICKED_UP, IN_TRANSIT) (ERR_INVALID_STATE)"]
        side_effects:
          - "undeliverable_reason recorded"
          - "billing_status AUTHORIZED -> SETTLED and invoice reconciled exactly as DELIVERED (merchant still pays)"
          - "late_credit_cents computed against clock at report time"
          - "TrackingEvent UNDELIVERABLE (MERCHANT_VISIBLE) emitted"
      - from: IN_TRANSIT
        to: UNDELIVERABLE
        trigger: "POST /delivery-orders/{id}/report-undeliverable"
        actor: Courier
        preconditions: ["fulfillment_status IN (PICKED_UP, IN_TRANSIT) (ERR_INVALID_STATE)"]
        side_effects: ["same as PICKED_UP -> UNDELIVERABLE"]
      - from: UNDELIVERABLE
        to: RETURN_IN_PROGRESS
        trigger: "POST /delivery-orders/{id}/disposition with resolution RETURN_TO_STORE"
        actor: Merchant
        preconditions: ["fulfillment_status == UNDELIVERABLE (ERR_DISPOSITION_NOT_REQUIRED)"]
        side_effects:
          - "Disposition PENDING created with return_fee_cents = RETURN_FEE_CENTS"
          - "merchant.billing_balance_cents -= RETURN_FEE_CENTS"
          - "TrackingEvent RETURN_IN_PROGRESS (MERCHANT_VISIBLE) emitted"
      - from: UNDELIVERABLE
        to: DISPOSAL_PENDING
        trigger: "POST /delivery-orders/{id}/disposition with resolution DISPOSE"
        actor: Merchant
        preconditions: ["fulfillment_status == UNDELIVERABLE (ERR_DISPOSITION_NOT_REQUIRED)"]
        side_effects: ["Disposition PENDING created with return_fee_cents = 0"]
      - from: RETURN_IN_PROGRESS
        to: RETURNED_TO_STORE
        trigger: "POST /dispositions/{id}/complete with outcome RETURNED"
        actor: Courier
        preconditions: ["disposition.status == PENDING and resolution == RETURN_TO_STORE (ERR_INVALID_STATE)"]
        side_effects:
          - "Disposition -> COMPLETED"
          - "If every order in the parent batch is in a terminal fulfillment state, batch -> COMPLETED"
          - "TrackingEvent RETURNED_TO_STORE (MERCHANT_VISIBLE) emitted"
      - from: DISPOSAL_PENDING
        to: DISPOSED
        trigger: "POST /dispositions/{id}/complete with outcome DISPOSED"
        actor: Courier
        preconditions: ["disposition.status == PENDING and resolution == DISPOSE (ERR_INVALID_STATE)"]
        side_effects:
          - "Disposition -> COMPLETED"
          - "If every order in the parent batch is in a terminal fulfillment state, batch -> COMPLETED"
          - "TrackingEvent DISPOSED (MERCHANT_VISIBLE) emitted"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /refund-claims/{id}/settle on a claim against this order (billing dimension)"
        actor: PlatformAdmin
        preconditions: ["billing_status == SETTLED (ERR_INVALID_STATE)"]
        side_effects: ["merchant.billing_balance_cents -= claim.merchant_share_cents (merchant pays its share)"]

  - entity: Courier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /couriers/{id} with status SUSPENDED"
        actor: PlatformAdmin
        preconditions: ["courier.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["increments Courier.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /couriers/{id} with status ACTIVE"
        actor: PlatformAdmin
        preconditions: ["courier.status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["increments Courier.version by 1"]

  - entity: DeliveryBatch
    initial_state: COURIER_ASSIGNED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: COURIER_ASSIGNED
        to: DISPATCHED
        trigger: "POST /delivery-batches/{id}/dispatch"
        actor: Courier
        preconditions:
          - "batch.status == COURIER_ASSIGNED (ERR_INVALID_STATE)"
          - "courier.status == ACTIVE (ERR_INVALID_STATE)"
          - "closed dispatch window [dispatch_window_start, dispatch_window_end] must not overlap any other DISPATCHED batch of the same courier; touching endpoints count as overlap (ERR_COURIER_WINDOW_CONFLICT)"
          - "orders in courier's other DISPATCHED batches + len(order_ids) <= courier.max_active_deliveries (ERR_COURIER_CAPACITY_EXCEEDED)"
          - "every order in batch READY_FOR_PICKUP (ERR_INVALID_STATE)"
        side_effects:
          - "delivery fee final variant computed per order: final_fee_cents, merchant_invoice_cents using current surge; batch_fee_share_cents per calculations.batch_fee_allocation"
          - "increments Courier.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (automatic when every order in the batch reaches a terminal fulfillment state)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COURIER_ASSIGNED
        to: FAILED
        trigger: "POST /delivery-batches/{id}/fail"
        actor: Courier
        preconditions: ["batch.status IN (COURIER_ASSIGNED, DISPATCHED) (ERR_INVALID_STATE)"]
        side_effects: ["all non-terminal orders in batch keep their fulfillment state and are released (batch_id := null) for a later batch"]
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /delivery-batches/{id}/fail"
        actor: Courier
        preconditions: ["batch.status IN (COURIER_ASSIGNED, DISPATCHED) (ERR_INVALID_STATE)"]
        side_effects:
          - "all non-terminal orders in batch released (batch_id := null)"
          - "orders never PICKED_UP revert to READY_FOR_PICKUP; invoiced amounts stay computed (re-dispatch recomputes)"

  - entity: Disposition
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /dispositions/{id}/complete"
        actor: Courier
        preconditions: ["disposition.status == PENDING (ERR_INVALID_STATE)"]
        side_effects: ["drives parent DeliveryOrder to RETURNED_TO_STORE or DISPOSED per resolution"]

  - entity: RefundClaim
    initial_state: FILED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /refund-claims/{id}/start-review"
        actor: SupportAgent
        preconditions: ["claim.status == FILED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /refund-claims/{id}/decide with decision APPROVE"
        actor: SupportAgent
        preconditions: ["claim.status == UNDER_REVIEW (ERR_INVALID_STATE)"]
        side_effects: ["merchant_share_cents and platform_share_cents computed per calculations.refund_liability_split"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /refund-claims/{id}/decide with decision DENY"
        actor: SupportAgent
        preconditions: ["claim.status == UNDER_REVIEW (ERR_INVALID_STATE)"]
        side_effects: []
      - from: DENIED
        to: APPEALED
        trigger: "POST /refund-claims/{id}/appeal"
        actor: Merchant
        preconditions:
          - "claim.status == DENIED (ERR_INVALID_STATE)"
          - "appeal_count < MAX_APPEALS (ERR_APPEAL_LIMIT_EXCEEDED)"
        side_effects: ["appeal_count += 1"]
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /refund-claims/{id}/start-review (second pass of the appeal loop)"
        actor: SupportAgent
        preconditions: ["claim.status == APPEALED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "POST /refund-claims/{id}/settle"
        actor: PlatformAdmin
        preconditions: ["claim.status == APPROVED (ERR_INVALID_STATE)"]
        side_effects:
          - "DeliveryOrder.billing_status SETTLED -> REFUNDED"
          - "Merchant.billing_balance_cents -= merchant_share_cents"
          - "If Merchant.billing_balance_cents < 0: Merchant -> SUSPENDED and its non-terminal orders cancelled per Merchant suspension cascade"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /refund-claims/{id}/reverse (compensating action)"
        actor: PlatformAdmin
        preconditions: ["claim.status == SETTLED (ERR_INVALID_STATE)"]
        side_effects:
          - "Merchant.billing_balance_cents += merchant_share_cents (exact undo)"
          - "DeliveryOrder.billing_status REFUNDED -> SETTLED"

  - entity: SlaReport
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /sla-reports/{id}/finalize"
        actor: PlatformAdmin
        preconditions: ["report.status == OPEN (ERR_INVALID_STATE)"]
        side_effects:
          - "total_deliveries, late_deliveries_gross, attainment_rate_gross, attainment_rate_fault_adjusted computed per calculations.sla_attainment"
          - "For each late delivered order in window: ServiceCredit ACCRUED created with amount_cents := order.late_credit_cents"
          - "When merchant.late_credit_enabled: each new credit immediately -> APPLIED and Merchant.credit_balance_cents += amount_cents"

  - entity: ServiceCredit
    initial_state: ACCRUED
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: ACCRUED
        to: APPLIED
        trigger: "POST /service-credits/{id}/apply, or system auto-apply during report finalize when merchant.late_credit_enabled"
        actor: PlatformAdmin | system
        preconditions: ["credit.status == ACCRUED (ERR_INVALID_STATE)"]
        side_effects: ["Merchant.credit_balance_cents += amount_cents"]
      - from: ACCRUED
        to: VOIDED
        trigger: "POST /service-credits/{id}/void"
        actor: PlatformAdmin
        preconditions: ["credit.status == ACCRUED (ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-only, per mandatory filter)
# =============================================================================
concurrency_rules:
  - rule_id: policy-activate-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /merchants/{id}/pricing-policies/{pid}/activate"
    occ_field: "expected_merchant_version"
    description: |
      Activating a pricing policy archives the merchant's current ACTIVE policy
      and bumps Merchant.version. A client that read the merchant before another
      activation completed holds a stale view of which policy is ACTIVE; the
      activate carrying the old expected_merchant_version is rejected so the
      superseding activation is never silently clobbered.
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412

  - rule_id: batch-create-stale-courier
    parent_entity: Courier
    write_endpoint: "POST /delivery-batches"
    occ_field: "expected_courier_version"
    description: |
      Creating a batch assigns work against a courier and bumps Courier.version
      (dispatch also bumps it). A client that read the courier before another
      batch was created or dispatched holds a stale view of the courier's
      committed workload; the create carrying the old expected_courier_version
      is rejected.
    error_id: ERR_STALE_COURIER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: delivery_distance
    trigger: "POST /stores/{id}/check-serviceability and POST /delivery-quotes"
    algorithm: projection
    formula: |
      mean_lat_rad = radians((store.lat + dropoff_lat) / 2)
      distance_m = round_half_up(111320 * |dropoff_lat - store.lat|
                                 + 111320 * |dropoff_lng - store.lng| * cos(mean_lat_rad))
      (Manhattan-planar approximation; integer meters.)
    input_set: "store coordinates and dropoff coordinates"
    precision: "0 decimal places (integer meters), round_half_up"

  - name: serviceability_check
    trigger: "POST /stores/{id}/check-serviceability and POST /delivery-quotes"
    algorithm: threshold
    formula: |
      d = delivery_distance(...)
      matching = overrides of store whose address_pattern is a case-insensitive
                 substring of address_text
      if matching non-empty:
        winner = the matching override whose address_pattern is longest;
                 tie-break: created_at ASC
        if winner.effect == DENY: serviceable = false
        else: serviceable = (d <= store.delivery_radius_m)
      else:
        serviceable = (d <= store.delivery_radius_m)   # boundary INCLUSIVE
    input_set: "ServiceabilityOverrides of the store (any effect)"
    precision: "exact integer comparison, <= is inclusive"

  - name: delivery_fee
    trigger: "quote (quoted variant) and batch dispatch (final variant)"
    algorithm: tiered_pricing
    formula: |
      Let d = distance_m, v = order_value_cents.
      band = first band in policy.distance_bands (array order) with d <= band.max_m
      if d exceeds the last band's max_m: quote rejected ERR_OUTSIDE_DELIVERY_RADIUS
      if band is the first: band_fee = band.base_cents
      else: band_fee = band.base_cents + ceil((d - prev_band.max_m) / 100) * band.per_100m_cents
      value_surcharge = surcharge_cents of the highest value tier with
                        v >= tier.min_order_value_cents (0 if none)
      peak = pickup_ready_at (quoted variant) converted to store.timezone falls in
             any half-open [start_local_hhmm, end_local_hhmm) peak window
      peak_uplift = peak ? round_half_up((band_fee + value_surcharge) * peak_uplift_pct) : 0
      base_total = band_fee + value_surcharge + peak_uplift
      surge_component = round_half_up(base_total * (surge_multiplier - 1))
      total = base_total + surge_component
      VARIANT quoted: surge_multiplier = platform surge at quote time
      VARIANT final (at dispatch): surge_multiplier = platform surge at dispatch time
      merchant_invoice = base_total + quoted_surge_component
                         + round_half_up(surge_passthrough_pct * (final_surge_component - quoted_surge_component))
      merchant_invoice floored at base_total (negative passthrough delta cannot reduce below base_total)
    input_set: "quote fields + merchant's ACTIVE PricingPolicy pinned at quote + platform surge"
    constants:
      SURGE_DEFAULT: 1.0
    precision: "integer cents; round_half_up applied per component BEFORE summing (component-then-sum order pinned)"
    variants:
      - name: quoted
        when: "POST /delivery-quotes"
        difference: "uses quote-time surge multiplier; stored as quoted_fee_cents"
      - name: final
        when: "batch dispatch"
        difference: "surge component recomputed with dispatch-time surge; merchant_invoice adds only surge_passthrough_pct of the surge delta, so identical inputs can produce merchant_invoice != quoted_fee_cents"

  - name: late_delivery_credit
    trigger: "delivery completion or undeliverable report (clock compared to promised_at)"
    algorithm: threshold
    formula: |
      lateness_seconds = event_clock_time - promised_at
      if lateness_seconds <= LATE_GRACE_SECONDS: credit = 0          # exactly 600s -> 0
      elif lateness_seconds <= LATE_FULL_SECONDS: credit = round_half_up(merchant_invoice_cents * LATE_PARTIAL_PCT)   # (600, 1800] -> 25%
      else: credit = merchant_invoice_cents                          # > 1800s -> 100%
    input_set: "the single order being completed"
    constants:
      LATE_GRACE_SECONDS: 600
      LATE_FULL_SECONDS: 1800
      LATE_PARTIAL_PCT: 0.25
    precision: "integer cents, round_half_up"

  - name: refund_liability_split
    trigger: "POST /refund-claims/{id}/decide with decision APPROVE"
    algorithm: weighted_scoring
    formula: |
      Evaluation order pinned (circular-looking otherwise):
      (1) merchant_invoice_cents of the order is already fixed at dispatch; use as-is
      (2) cap = none for MERCHANT_FULFILLMENT / CUSTOMER_UNAVAILABLE / ADDRESS_ISSUE;
          for COURIER_DELAY and PLATFORM_OUTAGE, platform_cap = round_half_up(merchant_invoice_cents * PLATFORM_DELAY_CAP_MULTIPLIER)
      (3) fault pct: COURIER_DELAY or PLATFORM_OUTAGE -> merchant_pct = 0
          MERCHANT_FULFILLMENT -> merchant_pct = 100
          CUSTOMER_UNAVAILABLE or ADDRESS_ISSUE -> merchant_pct = merchant.default_refund_split_merchant_pct
      (4) merchant_share = round_half_up(claimed_amount_cents * merchant_pct / 100)
          platform_share = claimed_amount_cents - merchant_share
      (5) cap enforcement (delay/outage faults only): if platform_share > platform_cap:
          platform_share = platform_cap; merchant_share = claimed_amount_cents - platform_share
      Invariant: merchant_share + platform_share == claimed_amount_cents always.
    input_set: "the claim, its order, the merchant config"
    constants:
      PLATFORM_DELAY_CAP_MULTIPLIER: 2.0
    precision: "integer cents, round_half_up; remainder allocated to platform_share"

  - name: batch_fee_allocation
    trigger: "batch dispatch"
    algorithm: waterfall_allocation
    formula: |
      courier_cost = BATCH_BASE_COST_CENTS + BATCH_PER_ORDER_CENTS * n
      For each order i (any order): raw_i = courier_cost * merchant_invoice_i / sum(merchant_invoice over batch)
      alloc_i = floor(raw_i)                                        # round DOWN per order
      remainder = courier_cost - sum(alloc_i)
      remainder granted to the order with earliest created_at (tie-break: created_at ASC)
      sum(alloc_i) + remainder == courier_cost  (conservation)
      Rounding order pinned: per-order floor first, then remainder; never round the total.
    input_set: "orders of the batch with merchant_invoice_cents computed at this dispatch"
    constants:
      BATCH_BASE_COST_CENTS: 400
      BATCH_PER_ORDER_CENTS: 150
    precision: "integer cents, floor per order"

  - name: sla_attainment
    trigger: "POST /sla-reports/{id}/finalize"
    algorithm: aggregation
    formula: |
      population = orders of merchant with delivered_at in [period_start, period_end)
      late(o) = o.delivered_at > o.promised_at + LATE_GRACE_SECONDS
      total = |population|
      GROSS: late_gross = |{o in population : late(o)}|
             attainment_gross = total == 0 ? 1.0 : 1 - late_gross/total
      FAULT_ADJUSTED: exclude from BOTH numerator and denominator any late order that has
             a SETTLED RefundClaim with fault_code == MERCHANT_FULFILLMENT
             attainment_fault_adjusted = adjusted_total == 0 ? 1.0 : 1 - adjusted_late/adjusted_total
      Credits accrue when attainment_gross < CREDIT_TRIGGER_ATTAINMENT:
      one ServiceCredit per late order in the GROSS population, amount = order.late_credit_cents.
    input_set: "merchant's delivered orders in the report window; their SETTLED claims"
    constants:
      CREDIT_TRIGGER_ATTAINMENT: 0.97
      LATE_GRACE_SECONDS: 600
    precision: "attainment stored as decimal rounded to 4 places, round_half_up"
    variants:
      - name: gross
        when: "credit trigger and late_deliveries_gross field"
        difference: "counts every late delivered order regardless of fault"
      - name: fault_adjusted
        when: "merchant-facing quality score"
        difference: "excludes late orders whose settled claim assigns fault to the merchant; identical data can yield a different (higher) rate than gross"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (ERR_MERCHANT_NOT_FOUND, ERR_STORE_NOT_FOUND, ERR_PRICING_POLICY_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_DELIVERY_ORDER_NOT_FOUND, ERR_COURIER_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_DISPOSITION_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_CREDIT_NOT_FOUND)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 4
    category: existence
    check: "Body foreign-key ids exist, validated in the endpoint's declared input order (e.g. POST /delivery-batches: store_id before courier_id before order_ids)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "POST /merchants/{id}/stores, POST /merchants/{id}/pricing-policies (parent), POST /stores/{id}/serviceability-overrides, POST /delivery-quotes, POST /delivery-orders, POST /delivery-batches, POST /refund-claims, POST /merchants/{id}/sla-reports, POST /delivery-orders/{id}/tracking-events"
  - priority: 5
    category: state
    check: "OCC expected_*_version matches current parent version (where declared)"
    error_id: "ERR_STALE_MERCHANT_VERSION | ERR_STALE_COURIER_VERSION"
    http_status: 412
    applies_to: "POST /merchants/{id}/pricing-policies/{pid}/activate, POST /delivery-batches"
  - priority: 6
    category: state
    check: "Target entity in the required state for the transition (ERR_INVALID_STATE, ERR_MERCHANT_SUSPENDED, ERR_STORE_NOT_ACTIVE, ERR_QUOTE_EXPIRED, ERR_DISPOSITION_NOT_REQUIRED)"
    error_id: "ERR_INVALID_STATE | ERR_MERCHANT_SUSPENDED | ERR_STORE_NOT_ACTIVE | ERR_QUOTE_EXPIRED | ERR_DISPOSITION_NOT_REQUIRED"
    http_status: 409
    applies_to: state-transition endpoints
  - priority: 7
    category: business_temporal
    check: "Courier dispatch-window overlap; policy effective-window overlap; pickup_ready_at within store operating context"
    error_id: "ERR_COURIER_WINDOW_CONFLICT | ERR_POLICY_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /delivery-batches/{id}/dispatch, POST /merchants/{id}/pricing-policies/{pid}/activate"
  - priority: 8
    category: business_constraint
    check: "Batching restriction (all orders same store, white-label never co-batched), courier capacity, batch size 1..3, address serviceability, band coverage, appeal limit, claim amount <= merchant_invoice, disposition resolution matches outcome"
    error_id: "ERR_BATCHING_RESTRICTION_VIOLATION | ERR_COURIER_CAPACITY_EXCEEDED | ERR_INVALID_BATCH_SIZE | ERR_ADDRESS_NOT_SERVICEABLE | ERR_OUTSIDE_DELIVERY_RADIUS | ERR_APPEAL_LIMIT_EXCEEDED | ERR_CLAIM_EXCEEDS_INVOICE | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /delivery-batches, POST /delivery-batches/{id}/dispatch, POST /delivery-quotes, POST /refund-claims, POST /refund-claims/{id}/appeal, POST /dispositions/{id}/complete"
  - priority: 9
    category: business_fiscal
    check: "merchant.billing_balance_cents sufficient for the funds being committed (quoted fee at accept)"
    error_id: ERR_INSUFFICIENT_BILLING_BALANCE
    http_status: 402
    applies_to: "POST /delivery-orders/{id}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / platform ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Quotes whose valid_until is reached read EXPIRED thereafter"]

  - method: POST
    path: "/_surge/set_current"
    description: "Set the platform surge multiplier used by the delivery_fee calculation (default 1.0)"
    roles: [PlatformAdmin]
    code: 200
    input: [multiplier]
    output: { multiplier: number }
    side_effects: []

  # --- Merchant ---
  - method: POST
    path: "/merchants"
    description: "Create merchant (ONBOARDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, billing_balance_cents, "default_refund_split_merchant_pct?", "late_credit_enabled?"]
    output: Merchant
    side_effects: ["credit_balance_cents := 0"]

  - method: GET
    path: "/merchants"
    description: "List merchants"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Merchant[]"
    side_effects: []

  - method: GET
    path: "/merchants/{id}"
    description: "Get merchant"
    roles: [PlatformAdmin, SupportAgent, Merchant]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: PATCH
    path: "/merchants/{id}"
    description: "Update merchant config (refund split pct, late_credit_enabled)"
    roles: [PlatformAdmin, Merchant]
    code: 200
    input: ["default_refund_split_merchant_pct?", "late_credit_enabled?"]
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/activate"
    description: "ONBOARDING -> ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/suspend"
    description: "ACTIVE -> SUSPENDED with order-cancellation cascade"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["non-terminal orders cancelled and holds released", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/resume"
    description: "SUSPENDED -> ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]

  # --- MerchantStore ---
  - method: POST
    path: "/merchants/{id}/stores"
    description: "Create store for merchant"
    roles: [Merchant, PlatformAdmin]
    code: 201
    input: [name, address_text, lat, lng, delivery_radius_m, timezone]
    output: MerchantStore
    side_effects: []

  - method: GET
    path: "/merchants/{id}/stores"
    description: "List stores of merchant"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "MerchantStore[]"
    side_effects: []

  - method: GET
    path: "/stores/{id}"
    description: "Get store"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: MerchantStore
    side_effects: []

  - method: PATCH
    path: "/stores/{id}"
    description: "Update store (delivery_radius_m, status ACTIVE|CLOSED, timezone)"
    roles: [Merchant, PlatformAdmin]
    code: 200
    input: ["delivery_radius_m?", "status?", "timezone?"]
    output: MerchantStore
    side_effects: ["increments MerchantStore.version by 1"]

  # --- ServiceabilityOverride ---
  - method: POST
    path: "/stores/{id}/serviceability-overrides"
    description: "Create address-level ALLOW/DENY override"
    roles: [Merchant, PlatformAdmin]
    code: 201
    input: [address_pattern, effect]
    output: ServiceabilityOverride
    side_effects: []

  - method: GET
    path: "/stores/{id}/serviceability-overrides"
    description: "List overrides of store"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceabilityOverride[]"
    side_effects: []

  - method: POST
    path: "/stores/{id}/check-serviceability"
    description: "Compute distance and serviceability verdict for a dropoff address"
    roles: [Merchant, PlatformAdmin]
    code: 200
    input: [dropoff_lat, dropoff_lng, address_text]
    output: { serviceable: boolean, distance_m: integer, matched_override_effect: string }
    side_effects: []

  # --- PricingPolicy ---
  - method: POST
    path: "/merchants/{id}/pricing-policies"
    description: "Create pricing policy (DRAFT)"
    roles: [Merchant, PlatformAdmin]
    code: 201
    input: [distance_bands, value_tiers, peak_windows, peak_uplift_pct, surge_passthrough_pct, effective_from, effective_until]
    output: PricingPolicy
    side_effects: []

  - method: GET
    path: "/merchants/{id}/pricing-policies"
    description: "List policies of merchant"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PricingPolicy[]"
    side_effects: []

  - method: GET
    path: "/pricing-policies/{id}"
    description: "Get policy"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: PricingPolicy
    side_effects: []

  - method: POST
    path: "/merchants/{id}/pricing-policies/{pid}/activate"
    description: "DRAFT -> ACTIVE; archives the merchant's current ACTIVE policy. OCC-guarded."
    roles: [Merchant]
    code: 200
    input: [expected_merchant_version]
    output: PricingPolicy
    side_effects: ["previous ACTIVE policy -> ARCHIVED", "increments Merchant.version by 1"]

  # --- DeliveryQuote ---
  - method: POST
    path: "/delivery-quotes"
    description: "Quote a delivery: serviceability + quoted fee; pins ACTIVE policy and current surge"
    roles: [Merchant]
    code: 201
    input: [store_id, dropoff_lat, dropoff_lng, address_text, order_value_cents, pickup_ready_at]
    output: DeliveryQuote
    side_effects: ["valid_until := clock + 15 minutes"]

  - method: GET
    path: "/delivery-quotes"
    description: "List quotes"
    roles: [Merchant, PlatformAdmin]
    code: 200
    input: ["merchant_id?", "store_id?", "pricing_policy_id?", "limit?", "offset?"]
    output: "DeliveryQuote[]"
    side_effects: []

  - method: GET
    path: "/delivery-quotes/{id}"
    description: "Get quote (EXPIRED applied on read when past valid_until)"
    roles: [Merchant, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryQuote
    side_effects: []

  # --- DeliveryOrder ---
  - method: POST
    path: "/delivery-orders"
    description: "Create order from quote (consumes quote). Idempotent on idempotency_key: a repeat returns the original order."
    roles: [Merchant]
    code: 201
    input: [quote_id, customer_reference, idempotency_key]
    output: DeliveryOrder
    side_effects: ["quote -> CONSUMED", "order created QUOTED / PENDING"]

  - method: GET
    path: "/delivery-orders"
    description: "List orders with filters"
    roles: [Merchant, PlatformAdmin, SupportAgent, Courier]
    code: 200
    input: ["merchant_id?", "store_id?", "quote_id?", "batch_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: "DeliveryOrder[]"
    side_effects: []

  - method: GET
    path: "/delivery-orders/{id}"
    description: "Get order"
    roles: [Merchant, PlatformAdmin, SupportAgent, Courier]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/delivery-orders/{id}/accept"
    description: "QUOTED -> ACCEPTED; authorizes quoted fee against billing balance"
    roles: [Merchant]
    code: 200
    input: [promised_at]
    output: DeliveryOrder
    side_effects: ["billing PENDING -> AUTHORIZED", "merchant.billing_balance_cents -= quoted_fee_cents", "TrackingEvent ORDER_ACCEPTED"]

  - method: POST
    path: "/delivery-orders/{id}/cancel"
    description: "QUOTED|ACCEPTED -> CANCELLED; releases any billing hold"
    roles: [Merchant]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["billing -> VOIDED", "hold released when AUTHORIZED", "TrackingEvent CANCELLED"]

  - method: POST
    path: "/delivery-orders/{id}/mark-ready"
    description: "ACCEPTED -> READY_FOR_PICKUP (merchant pickup readiness signal for courier assignment)"
    roles: [Merchant]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/delivery-orders/{id}/confirm-pickup"
    description: "READY_FOR_PICKUP -> PICKED_UP (courier must hold the dispatched batch)"
    roles: [Courier]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["TrackingEvent PICKED_UP"]

  - method: POST
    path: "/delivery-orders/{id}/start-transit"
    description: "PICKED_UP -> IN_TRANSIT"
    roles: [Courier]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["TrackingEvent IN_TRANSIT"]

  - method: POST
    path: "/delivery-orders/{id}/complete-delivery"
    description: "IN_TRANSIT -> DELIVERED; settles billing, reconciles invoice delta, computes late credit"
    roles: [Courier]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["billing -> SETTLED", "merchant.billing_balance_cents adjusted by (merchant_invoice_cents - quoted_fee_cents)", "late_credit_cents computed", "batch auto-COMPLETED when all orders terminal", "TrackingEvent DELIVERED"]

  - method: POST
    path: "/delivery-orders/{id}/report-undeliverable"
    description: "PICKED_UP|IN_TRANSIT -> UNDELIVERABLE; billing settles as delivered; awaits merchant disposition"
    roles: [Courier]
    code: 200
    input: [reason_code]
    output: DeliveryOrder
    side_effects: ["billing -> SETTLED with invoice reconciliation", "late_credit_cents computed", "TrackingEvent UNDELIVERABLE"]

  - method: POST
    path: "/delivery-orders/{id}/disposition"
    description: "Merchant decides RETURN_TO_STORE (adds return fee) or DISPOSE for an UNDELIVERABLE order"
    roles: [Merchant]
    code: 201
    input: [resolution]
    output: Disposition
    side_effects: ["order -> RETURN_IN_PROGRESS or DISPOSAL_PENDING", "return fee debited when RETURN_TO_STORE"]

  - method: GET
    path: "/delivery-orders/{id}/disposition"
    description: "Get dispositions of order (0-1 rows)"
    roles: [Merchant, PlatformAdmin, SupportAgent, Courier]
    code: 200
    input: []
    output: "Disposition[]"
    side_effects: []

  - method: POST
    path: "/dispositions/{id}/complete"
    description: "Courier confirms RETURNED or DISPOSED; outcome must match disposition resolution"
    roles: [Courier]
    code: 200
    input: [outcome]
    output: Disposition
    side_effects: ["order -> RETURNED_TO_STORE or DISPOSED", "batch auto-COMPLETED when all orders terminal", "TrackingEvent RETURNED_TO_STORE | DISPOSED"]

  - method: POST
    path: "/delivery-orders/{id}/tracking-events"
    description: "Emit a tracking event (branded feed item)"
    roles: [Courier, PlatformAdmin]
    code: 201
    input: [event_type, "note?", "visibility?"]
    output: TrackingEvent
    side_effects: []

  - method: GET
    path: "/delivery-orders/{id}/tracking-events"
    description: "Branded tracking feed. Merchant sees MERCHANT_VISIBLE events only; Courier/SupportAgent/PlatformAdmin see all."
    roles: [Merchant, Courier, SupportAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrackingEvent[]"
    side_effects: []

  # --- Courier ---
  - method: POST
    path: "/couriers"
    description: "Create courier"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "max_active_deliveries?"]
    output: Courier
    side_effects: []

  - method: GET
    path: "/couriers"
    description: "List couriers"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Courier[]"
    side_effects: []

  - method: GET
    path: "/couriers/{id}"
    description: "Get courier"
    roles: [PlatformAdmin, SupportAgent, Courier]
    code: 200
    input: []
    output: Courier
    side_effects: []

  - method: PATCH
    path: "/couriers/{id}"
    description: "Update courier status or capacity"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "max_active_deliveries?"]
    output: Courier
    side_effects: ["increments Courier.version by 1"]

  # --- DeliveryBatch ---
  - method: POST
    path: "/delivery-batches"
    description: "Create batch assigning 1..3 READY_FOR_PICKUP orders of one store to a courier. OCC-guarded."
    roles: [PlatformAdmin]
    code: 201
    input: [store_id, courier_id, order_ids, dispatch_window_start, dispatch_window_end, expected_courier_version]
    output: DeliveryBatch
    side_effects: ["order.batch_id set for each order", "courier_cost_cents computed", "increments Courier.version by 1"]

  - method: GET
    path: "/delivery-batches"
    description: "List batches"
    roles: [PlatformAdmin, Courier, SupportAgent]
    code: 200
    input: ["courier_id?", "store_id?", "status?", "limit?", "offset?"]
    output: "DeliveryBatch[]"
    side_effects: []

  - method: GET
    path: "/delivery-batches/{id}"
    description: "Get batch"
    roles: [PlatformAdmin, Courier, SupportAgent, Merchant]
    code: 200
    input: []
    output: DeliveryBatch
    side_effects: []

  - method: POST
    path: "/delivery-batches/{id}/dispatch"
    description: "COURIER_ASSIGNED -> DISPATCHED; computes final fee variant and batch fee allocation"
    roles: [Courier]
    code: 200
    input: []
    output: DeliveryBatch
    side_effects: ["final_fee_cents, merchant_invoice_cents, batch_fee_share_cents computed per order", "increments Courier.version by 1", "TrackingEvent COURIER_ASSIGNED per order"]

  - method: POST
    path: "/delivery-batches/{id}/fail"
    description: "COURIER_ASSIGNED|DISPATCHED -> FAILED; releases orders for re-batching"
    roles: [Courier]
    code: 200
    input: []
    output: DeliveryBatch
    side_effects: ["orders released (batch_id null); never-picked orders revert to READY_FOR_PICKUP"]

  # --- RefundClaim ---
  - method: POST
    path: "/refund-claims"
    description: "File refund claim against a SETTLED-billing order"
    roles: [Merchant]
    code: 201
    input: [delivery_order_id, fault_code, claimed_amount_cents]
    output: RefundClaim
    side_effects: []

  - method: GET
    path: "/refund-claims"
    description: "List claims"
    roles: [Merchant, SupportAgent, PlatformAdmin]
    code: 200
    input: ["delivery_order_id?", "merchant_id?", "status?", "limit?", "offset?"]
    output: "RefundClaim[]"
    side_effects: []

  - method: GET
    path: "/refund-claims/{id}"
    description: "Get claim"
    roles: [Merchant, SupportAgent, PlatformAdmin]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []

  - method: POST
    path: "/refund-claims/{id}/start-review"
    description: "FILED|APPEALED -> UNDER_REVIEW (support routing: merchant files, platform support reviews)"
    roles: [SupportAgent]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []

  - method: POST
    path: "/refund-claims/{id}/decide"
    description: "UNDER_REVIEW -> APPROVED (computes liability split) or DENIED"
    roles: [SupportAgent]
    code: 200
    input: [decision]
    output: RefundClaim
    side_effects: ["on APPROVE: merchant_share_cents and platform_share_cents computed"]

  - method: POST
    path: "/refund-claims/{id}/appeal"
    description: "DENIED -> APPEALED (max 1 appeal)"
    roles: [Merchant]
    code: 200
    input: []
    output: RefundClaim
    side_effects: ["appeal_count += 1"]

  - method: POST
    path: "/refund-claims/{id}/settle"
    description: "APPROVED -> SETTLED; debits merchant share, cascades order billing and possible merchant suspension"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RefundClaim
    side_effects: ["order billing SETTLED -> REFUNDED", "merchant.billing_balance_cents -= merchant_share_cents", "suspension cascade when balance < 0"]

  - method: POST
    path: "/refund-claims/{id}/reverse"
    description: "SETTLED -> REVERSED; exact compensation restoring merchant balance and order billing"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RefundClaim
    side_effects: ["merchant.billing_balance_cents += merchant_share_cents", "order billing REFUNDED -> SETTLED"]

  # --- SlaReport / ServiceCredit ---
  - method: POST
    path: "/merchants/{id}/sla-reports"
    description: "Open an SLA report for a half-open period"
    roles: [PlatformAdmin]
    code: 201
    input: [period_start, period_end]
    output: SlaReport
    side_effects: []

  - method: GET
    path: "/merchants/{id}/sla-reports"
    description: "List SLA reports of merchant"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "SlaReport[]"
    side_effects: []

  - method: GET
    path: "/sla-reports/{id}"
    description: "Get SLA report"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: SlaReport
    side_effects: []

  - method: POST
    path: "/sla-reports/{id}/finalize"
    description: "OPEN -> FINALIZED; computes attainment variants and accrues late-delivery credits (auto-applies when enabled)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SlaReport
    side_effects: ["ServiceCredit ACCRUED per late order", "when merchant.late_credit_enabled: credit -> APPLIED and Merchant.credit_balance_cents += amount_cents"]

  - method: GET
    path: "/sla-reports/{id}/service-credits"
    description: "List credits accrued by a report"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceCredit[]"
    side_effects: []

  - method: GET
    path: "/service-credits/{id}"
    description: "Get service credit"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []

  - method: GET
    path: "/service-credits"
    description: "List service credits (cross-merchant admin view; filterable by order)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["delivery_order_id?", "status?", "limit?", "offset?"]
    output: "ServiceCredit[]"
    side_effects: []

  - method: GET
    path: "/merchants/{id}/service-credits"
    description: "List service credits of merchant"
    roles: [Merchant, PlatformAdmin, SupportAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ServiceCredit[]"
    side_effects: []

  - method: POST
    path: "/service-credits/{id}/apply"
    description: "ACCRUED -> APPLIED; credits merchant credit balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["Merchant.credit_balance_cents += amount_cents"]

  - method: POST
    path: "/service-credits/{id}/void"
    description: "ACCRUED -> VOIDED; no balance effect"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, or structural payload error (e.g. batch order_ids size outside 1..3, disposition outcome mismatched to resolution)" }
  - { id: ERR_MERCHANT_NOT_FOUND, http: 404, condition: "Merchant id does not exist" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "MerchantStore id does not exist" }
  - { id: ERR_PRICING_POLICY_NOT_FOUND, http: 404, condition: "PricingPolicy id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "DeliveryQuote id does not exist" }
  - { id: ERR_DELIVERY_ORDER_NOT_FOUND, http: 404, condition: "DeliveryOrder id does not exist" }
  - { id: ERR_COURIER_NOT_FOUND, http: 404, condition: "Courier id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "DeliveryBatch id does not exist" }
  - { id: ERR_DISPOSITION_NOT_FOUND, http: 404, condition: "Disposition id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "RefundClaim id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "SlaReport id does not exist" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "ServiceCredit id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in the state required for the requested transition" }
  - { id: ERR_MERCHANT_SUSPENDED, http: 409, condition: "Merchant not ACTIVE for an operation requiring an active merchant" }
  - { id: ERR_STORE_NOT_ACTIVE, http: 409, condition: "Store not ACTIVE for an operation requiring an active store" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Quote used at or after valid_until (status EXPIRED)" }
  - { id: ERR_DISPOSITION_NOT_REQUIRED, http: 409, condition: "Disposition requested for an order not in UNDELIVERABLE, or a second disposition for an order already disposed" }
  - { id: ERR_STALE_MERCHANT_VERSION, http: 412, condition: "expected_merchant_version does not match Merchant.version (OCC)" }
  - { id: ERR_STALE_COURIER_VERSION, http: 412, condition: "expected_courier_version does not match Courier.version (OCC)" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "Half-open effective window overlaps another ACTIVE policy of the same merchant" }
  - { id: ERR_COURIER_WINDOW_CONFLICT, http: 409, condition: "Closed dispatch window overlaps another DISPATCHED batch of the same courier (touching endpoints count as overlap)" }
  - { id: ERR_COURIER_CAPACITY_EXCEEDED, http: 409, condition: "Batch would push courier's DISPATCHED order count above max_active_deliveries" }
  - { id: ERR_INVALID_BATCH_SIZE, http: 409, condition: "Batch order_ids outside 1..3" }
  - { id: ERR_BATCHING_RESTRICTION_VIOLATION, http: 409, condition: "White-label batching restriction violated: batched orders not all from the batch's store, or not all READY_FOR_PICKUP at create" }
  - { id: ERR_ADDRESS_NOT_SERVICEABLE, http: 409, condition: "Delivery address denied by a matching DENY override or beyond the store delivery radius" }
  - { id: ERR_OUTSIDE_DELIVERY_RADIUS, http: 409, condition: "Distance exceeds the last pricing band's max_m" }
  - { id: ERR_APPEAL_LIMIT_EXCEEDED, http: 409, condition: "Appeal attempted when appeal_count already == MAX_APPEALS (1)" }
  - { id: ERR_CLAIM_EXCEEDS_INVOICE, http: 409, condition: "claimed_amount_cents > order.merchant_invoice_cents" }
  - { id: ERR_CLAIM_ORDER_NOT_SETTLED, http: 409, condition: "Claim filed against an order whose billing_status is not SETTLED" }
  - { id: ERR_INSUFFICIENT_BILLING_BALANCE, http: 402, condition: "merchant.billing_balance_cents < quoted_fee_cents at accept" }
  - { id: ERR_NO_ACTIVE_PRICING_POLICY, http: 409, condition: "Quote requested but merchant has no ACTIVE pricing policy whose window contains the current clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns couriers, merchant lifecycle, surge/clock, settlement and SLA finalization"
    identity: opaque
    exclusive_operations:
      - "POST /merchants, POST /merchants/{id}/activate|suspend|resume"
      - "POST /couriers, PATCH /couriers/{id}"
      - "POST /delivery-batches"
      - "POST /refund-claims/{id}/settle|reverse"
      - "POST /merchants/{id}/sla-reports, POST /sla-reports/{id}/finalize"
      - "POST /service-credits/{id}/apply|void"
      - "POST /_clock/set_current_utc, POST /_surge/set_current"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /delivery-orders/{id}/tracking-events"
      - "POST /merchants/{id}/stores, PATCH /stores/{id}, POST /stores/{id}/serviceability-overrides, POST /stores/{id}/check-serviceability"
      - "POST /merchants/{id}/pricing-policies, PATCH /merchants/{id}"

  - name: Merchant
    description: "Merchant operator acting for its own merchant account (X-User-ID == Merchant.id); owns stores, pricing, quotes, order lifecycle up to readiness, dispositions, refund claims and appeals"
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /delivery-quotes, POST /delivery-orders"
      - "POST /delivery-orders/{id}/accept|cancel|mark-ready"
      - "POST /delivery-orders/{id}/disposition"
      - "POST /refund-claims, POST /refund-claims/{id}/appeal"
      - "POST /merchants/{id}/pricing-policies/{pid}/activate"
    shared_operations:
      - "GET endpoints for own merchant, stores, policies, quotes, orders, tracking feed (MERCHANT_VISIBLE only), claims, SLA reports, credits"
      - "POST /merchants/{id}/stores, PATCH /stores/{id}, POST /stores/{id}/serviceability-overrides, POST /stores/{id}/check-serviceability"
      - "POST /merchants/{id}/pricing-policies, PATCH /merchants/{id}"

  - name: Courier
    description: "Delivery courier executing batches; drives pickup/transit/delivery/undeliverable and disposition completion"
    identity: "entity_backed:Courier"
    exclusive_operations:
      - "POST /delivery-batches/{id}/dispatch|fail"
      - "POST /delivery-orders/{id}/confirm-pickup|start-transit|complete-delivery|report-undeliverable"
      - "POST /dispositions/{id}/complete"
    shared_operations:
      - "GET /delivery-orders*, GET /delivery-batches*, GET /couriers/{id} (self), GET /delivery-orders/{id}/tracking-events (all visibilities), GET /delivery-orders/{id}/disposition"
      - "POST /delivery-orders/{id}/tracking-events"

  - name: SupportAgent
    description: "Platform support; triages refund claims filed by merchants (support routing back to the merchant is by claim, not by direct customer contact)"
    identity: opaque
    exclusive_operations:
      - "POST /refund-claims/{id}/start-review"
      - "POST /refund-claims/{id}/decide"
    shared_operations:
      - "GET endpoints across merchants, couriers, orders, tracking, claims, batches, reports, credits"
