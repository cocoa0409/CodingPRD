  - { method: POST, path: "/daily-reports/{id}/request-revision", description: "UNDER_REVIEW -> REVISION_REQUESTED; revision_count += 1", roles: [ProjectManager], code: 200, input: [reason], output: DailyReport, side_effects: ["increments DailyReport.version by 1"] }
