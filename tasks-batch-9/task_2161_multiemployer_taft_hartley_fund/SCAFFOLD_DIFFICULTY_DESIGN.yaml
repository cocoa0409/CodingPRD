  - rule_id: compensating_invariant
    instances:
      - name: amendment_supersede_conserves_credited_hours
        grounds:
          - calculations.participant_eligibility_replay
          - state_machines.ContributionReport.POSTED_to_SUPERSEDED
          - entities.Participant.fields.credited_hours_total
          - entities.CoverageMonth.fields.status
          - entities.ContributionReport.fields.amends_report_id
        distinguishing_aspect: |
          The conserved quantity is CREDITED HOURS, not money: after the amendment is posted the
          invariant Participant.credited_hours_total == SUM(ContributionLine.hours over lines
          whose report.filing_status == POSTED) must hold exactly at 100.00, with zero residue
          from the superseded 151.30-hour filing and with every CoverageMonth it had granted
          returned to REVOKED.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "A POSTED 2026-03 report R1 of a single 151.30-hour JOURNEYMAN line, which credited the participant 151.30 hours, granted the CoverageMonth 2026-05 and left hour_bank_hours 31.30."
            - "A SUBMITTED amendment R2 for the same employer and work_period naming R1 in amends_report_id and carrying 100.00 hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Hours Conservation Fund", ein: "36-2500001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Ada Kowalski", ssn_last4: "4417" }
              as: FundAdministrator
              captures: { p1_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v1: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v1}", lines: [ { participant_id: "${p1_id}", hours: 151.30, gross_wages_cents: 600000, work_classification: "JOURNEYMAN" } ] }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /contribution-reports/${r1_id}/post"
              payload: {}
              as: FundAdministrator
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v2: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v2}", amends_report_id: "${r1_id}", lines: [ { participant_id: "${p1_id}", hours: 100.00, gross_wages_cents: 400000, work_classification: "JOURNEYMAN" } ] }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${r2_id}/post"
              payload: {}
              as: FundAdministrator
          assert:
            - "before the trigger, Participant.${p1_id}.credited_hours_total == 151.30 and hour_bank_hours == 31.30 and coverage_through_month == '2026-05'"
            - "ContributionReport.${r1_id}.filing_status == SUPERSEDED and ContributionReport.${r2_id}.filing_status == POSTED"
            - "INVARIANT: Participant.${p1_id}.credited_hours_total == 100.00, exactly the sum of ContributionLine.hours over POSTED reports"
            - "Participant.${p1_id}.hour_bank_hours == 100.00 and forfeited_hours_total == 0.00"
            - "Participant.${p1_id}.coverage_through_month == null and eligibility_status == NOT_ELIGIBLE"
            - "GET /coverage-months?participant_id=${p1_id}&status=GRANTED returns 0 rows"
            - "GET /coverage-months?participant_id=${p1_id}&status=REVOKED returns exactly 1 row with coverage_month 2026-05 and granting_report_id == ${r1_id}"
            - "PensionAccrual(participant=${p1_id}, plan_year=2026).hours_credited == 100.00 and pension_credit == 0.00"
            - "Employer.${emp_id}.cumulative_delinquent_cents == 82550, the amendment's amount alone"

      - name: ld_waiver_conserves_employer_delinquency_ledger
        grounds:
          - calculations.employer_delinquency_ledger
          - state_machines.BoardMotion.OPEN_to_CARRIED
          - state_machines.Employer.SUSPENDED_to_ACTIVE
          - entities.DelinquencyAssessment.fields.waived_cents
          - entities.Employer.fields.cumulative_delinquent_cents
        distinguishing_aspect: |
          The conserved quantity here is MONEY, a different kind from the hours invariant: the
          carried LD_WAIVER must move Employer.cumulative_delinquent_cents down by exactly
          waived_cents (100281 -> 0) with zero drift, so the ledger identity
