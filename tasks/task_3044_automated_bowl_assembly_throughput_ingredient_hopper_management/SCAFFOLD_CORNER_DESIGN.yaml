              payload: { to_iso8601: "2026-09-01T00:45:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /api/refill-tasks/${t1}/start"
              payload: {}
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PREP_BATCH_EXPIRED (422); task remains READY"
      - name: daily_refill_budget_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_REFILL_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Manual refill that would push today's allocated refill grams over 50000 is rejected (402); a refill landing exactly at 50000 passes (<= semantics); auto-created sensor refills are exempt."
        test_recipe:
          setup:
            - "Restaurant R1; line L1; ingredient ING; 101 hoppers? — simplified: hoppers H1..H2 with capacity 30000 each, both DEPLETED via sensor 0 with no READY batches (tasks stay SCHEDULED and count toward the budget once allocated? — budget counts allocated grams of tasks created today; with no batches, allocated is 0). Pinned simpler fixture: manual requests with mode STANDARD on hoppers of capacity 30000: requested 30000 each; first passes (30000 <= 50000), second would reach 60000 > 50000 and is rejected."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
