      - name: hydraulic_circuit_check_outranks_the_pool_standardization_check
        claim_type: Priority conflict
        grounds:
          - validations.priority_75_ERR_HYDRAULIC_CIRCUIT_REQUIRED
          - validations.priority_81_ERR_NON_STANDARD_POOL_EQUIPMENT
        distinguishing_aspect: |
          One request violates two rules six priority levels apart: a PTO crane is being planned with
          hydraulic_circuit NONE (priority 75) onto a POOL_STOCK order whose configuration lists no
          standard equipment at all (priority 81). The lower priority number must win, and the
          instance separates the two by re-issuing the request with a correct circuit so that the
          standardization error surfaces on its own.
        test_recipe:
          setup:
            - "A TIER_B configuration on F550-DRW-84CA with an EMPTY standard_equipment_spec_ids list, and a POOL_STOCK order on it with no chassis bound yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
