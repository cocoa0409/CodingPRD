              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
