          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.RetailItem.fields.item_code
          - entities.CasePlan.fields.service_date
        distinguishing_aspect: "Uniqueness is scoped, not global: re-using item_code RIB01 inside the same department is refused with ERR_DUPLICATE_RESOURCE (409) while the same code in a second department is accepted, and a second CasePlan for a service_date the department already plans is refused."
        test_recipe:
          setup:
            - "Departments 'Meat 41' (S041) and 'Meat 42' (S042) exist."
            - "Meat 41 already has RetailItem RIB01 and a CasePlan for service_date 2026-08-05."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { d1_id: $.data.id }
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 42", store_code: "S042" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { d2_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${d1_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${d1_id}", service_date: "2026-08-05" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cp1_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${d1_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK_THIN", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_dup_item: $.data.error_id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${d2_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${d1_id}", service_date: "2026-08-05" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_dup_plan: $.data.error_id }
          assert:
            - "${err_dup_item} == ERR_DUPLICATE_RESOURCE with HTTP 409 and RetailItem.${ri1_id}.subprimal_code stays RIBEYE_STEAK"
            - "The second department's RIB01 is created: RetailItem.${ri2_id}.department_id == ${d2_id} with price_status UNPRICED"
            - "${err_dup_plan} == ERR_DUPLICATE_RESOURCE with HTTP 409 and Meat 41 still has exactly one CasePlan"

