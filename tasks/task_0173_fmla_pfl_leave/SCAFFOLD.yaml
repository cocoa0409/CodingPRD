scenario: |
  173. FMLA/PFL Leave Management: eligibility threshold (12 months/1250 hours),
  intermittent leave, medical certification, FMLA quota, state PFL concurrent,
  benefit continuation, Job Restoration protection

domain_name: fmla-pfl-leave-management
api_prefix: /employees

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # rolling-12-month vs fixed leave-year quota accounting
    - cascading_side_effects          # cert denial -> instances void -> quota re-credit -> benefit drop
    - rate_threshold_triggers         # 1250 hours, 12 months service, 50/75 mile worksite, $0 vs eligible
    - temporal_windowing              # intermittent leave instances aggregate to entitlement
    - scheduled_deferred_actions      # certification 15-day deadline, recertification, return-by-date
    - derived_field_reconciliation    # remaining_hours, job_restoration_status recomputed on each event

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many                     # Employee -> LeaveCase -> LeaveInstance
    - cross_aggregate                 # LeaveCase references PfLClaim (state PFL benefit) for concurrent crediting

  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the employing organization
      - name: leave_year_basis
        type: enum
        source: input
        description: How the 12-month FMLA leave year is reckoned for all this employer's employees
        constraints: "ENUM: CALENDAR (Jan 1 - Dec 31), ROLLING_BACKWARD (12 months look-back from each requested leave date)"
      - name: state_pfl_program
        type: enum
        source: input
        description: Whether a concurrent state PFL benefit program applies to this employer
        constraints: "ENUM: NONE, STATE_PFL_8WEEK (max 8 calendar weeks paid PFL, 60% wage replacement, runs concurrently with FMLA family-care leave)"
      - name: benefit_premium_share_cents
        type: integer
        source: input
        description: Monthly cents the employee normally pays for group health coverage (for benefit-continuation invoicing during leave)
        constraints: ">= 0"

  - name: Worksite
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: Owning Employer.id
      - name: address_line
        type: string
        source: input
        description: Worksite street address
      - name: employee_count_within_75_miles
        type: integer
        source: input
        description: Number of employees on the employer's payroll at this worksite plus all worksites within 75 surface miles of it (counted at the moment the eligibility check runs)
        constraints: ">= 0"

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: Owning Employer.id
      - name: worksite_id
        type: string
        source: input
        description: Worksite at which the employee is based
      - name: full_name
        type: string
        source: input
        description: Employee legal name
      - name: hire_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the employee began continuous employment (used for the 12-month service check)
      - name: hours_worked_trailing_12mo
        type: integer
        source: input
        description: Integer count of hours actually worked by this employee in the 12 calendar months ending at the most recent server-clock day (refreshed by POST /employees/{id}/hours-snapshot)
        constraints: ">= 0"
      - name: monthly_wage_cents
        type: integer
        source: input
        description: Employee's current gross monthly wage in cents (used for PFL wage-replacement calculation)
        constraints: ">= 0"
      - name: employment_status
        type: enum
        source: computed
        description: Current employment status, updated by termination/restoration transitions
        default: ACTIVE
        constraints: "ENUM: ACTIVE, ON_LEAVE, TERMINATED, RESTORED"

  - name: LeaveCase
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: Subject Employee.id
      - name: reason
        type: enum
        source: input
        description: FMLA-qualifying reason
        constraints: "ENUM: OWN_SERIOUS_HEALTH, FAMILY_SERIOUS_HEALTH, BABY_BONDING, MILITARY_EXIGENCY"
      - name: leave_pattern
        type: enum
        source: input
        description: How the leave is taken
        constraints: "ENUM: CONTINUOUS, INTERMITTENT, REDUCED_SCHEDULE"
      - name: case_status
        type: enum
        source: computed
        description: Overall case lifecycle
        default: DRAFT
        constraints: "ENUM: DRAFT, PENDING_CERTIFICATION, APPROVED, DENIED, ACTIVE, COMPLETED, JOB_RESTORED, CANCELLED"
      - name: certification_status
        type: enum
        source: computed
        description: Independent certification dimension (parallel to case_status for medical-certification reasons)
        default: NOT_REQUIRED
        constraints: "ENUM: NOT_REQUIRED, AWAITING_DOC, RECEIVED, INSUFFICIENT, COMPLETE, RECERTIFICATION_DUE"
      - name: requested_start_date
        type: datetime
        source: input
        description: Requested first day of leave (ISO 8601 UTC date)
      - name: expected_end_date
        type: datetime
        source: input
        description: Expected last day of continuous leave or end of intermittent window
      - name: leave_year_anchor
        type: datetime
        source: computed
        description: For ROLLING_BACKWARD employers, the as-of date used to compute the look-back window (the requested_start_date pinned at case creation); for CALENDAR employers, the January 1 of requested_start_date's year
      - name: pfl_claim_id
        type: string
        source: input
        description: Optional PfLClaim.id when the case is paired with a concurrent state PFL benefit
        default: null
      - name: cert_deadline
        type: datetime
        source: computed
        description: Server-pinned deadline for the employee to submit certification = case creation timestamp + 15 calendar days (used by §1.3 cert_deadline_check)
      - name: hours_charged
        type: integer
        source: computed
        description: Cumulative hours from all APPROVED LeaveInstance records on this case (whole-hour units)
        default: 0
      - name: job_restoration_status
        type: enum
        source: computed
        description: Whether the employee is currently protected against termination/demotion by this case
        default: PROTECTED
        constraints: "ENUM: PROTECTED, FORFEITED, NOT_APPLICABLE"

  - name: LeaveInstance
    parent: null
    common_fields: false
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: Owning LeaveCase.id
      - name: instance_date
        type: datetime
        source: input
        description: Calendar day of this absence (ISO 8601 UTC date; whole day)
      - name: hours_used
        type: integer
        source: input
        description: Whole hours of leave taken on instance_date (0 < hours_used <= 24)
        constraints: "1 <= hours_used <= 24"
      - name: instance_status
        type: enum
        source: computed
        description: Whether this instance counts against the FMLA bucket
        default: PROPOSED
        constraints: "ENUM: PROPOSED, APPROVED, VOIDED"

  - name: MedicalCertification
    parent: null
    common_fields: false
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: LeaveCase.id this certification documents
      - name: submitted_at
        type: datetime
        source: system
        description: Server timestamp when the certification was posted
      - name: serious_health_condition
        type: boolean
        source: input
        description: Whether the provider attested a serious health condition exists
      - name: estimated_frequency_per_month
        type: integer
        source: input
        description: For intermittent cases, anticipated number of episodes per month
        default: 0
        constraints: ">= 0"
      - name: estimated_duration_hours
        type: integer
        source: input
        description: For intermittent cases, anticipated hours per episode
        default: 0
        constraints: ">= 0"
      - name: review_outcome
        type: enum
        source: computed
        description: HRSpecialist decision on this certification packet
        default: PENDING
        constraints: "ENUM: PENDING, ACCEPTED, INSUFFICIENT, REJECTED"

  - name: PfLClaim
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: Subject Employee.id
      - name: claim_type
        type: enum
        source: input
        description: State PFL claim category
        constraints: "ENUM: FAMILY_CARE, BABY_BONDING"
      - name: claim_status
        type: enum
        source: computed
        description: State PFL claim lifecycle
        default: SUBMITTED
        constraints: "ENUM: SUBMITTED, APPROVED, PAYING, EXHAUSTED, DENIED"
      - name: weeks_authorized
        type: integer
        source: input
        description: Calendar weeks of state PFL authorized for this claim (1..8)
        constraints: "1 <= weeks_authorized <= 8"
      - name: weeks_paid
        type: integer
        source: computed
        description: Calendar weeks already paid against this claim
        default: 0
      - name: weekly_benefit_cents
        type: integer
        source: computed
        description: Server-computed weekly PFL benefit = round_half_up(monthly_wage_cents * 12 / 52 * 0.60); pinned at claim creation and frozen thereafter

  - name: BenefitInvoice
    parent: null
    common_fields: false
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: LeaveCase.id this invoice belongs to
      - name: period_month
        type: string
        source: input
        description: Calendar month covered, formatted YYYY-MM
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: amount_due_cents
        type: integer
        source: computed
        description: Premium share owed by the employee for this month while on leave (see §1.3 benefit_invoice_calc)
      - name: invoice_status
        type: enum
        source: computed
        description: Invoice lifecycle
        default: ISSUED
        constraints: "ENUM: ISSUED, PAID, GRACE, FORFEITED"

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: LeaveCase.id this event records
      - name: event_kind
        type: enum
        source: system
        description: What happened
        constraints: "ENUM: ELIGIBILITY_CHECKED, CASE_CREATED, CERTIFICATION_SUBMITTED, CERTIFICATION_REVIEWED, INSTANCE_LOGGED, INSTANCE_VOIDED, QUOTA_RECOMPUTED, PFL_LINKED, JOB_RESTORATION_REQUESTED, JOB_RESTORATION_FORFEITED, BENEFIT_INVOICE_ISSUED, BENEFIT_INVOICE_FORFEITED"
      - name: actor_role
        type: string
        source: system
        description: Role header value of the actor or "system" for auto-events
      - name: detail_json
        type: object
        source: system
        description: Free-form event payload captured at the time of the event

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: LeaveCase
    initial_state: DRAFT
    terminal_states: [DENIED, COMPLETED, JOB_RESTORED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_CERTIFICATION
        trigger: "POST /employees/{id}/leave-cases  (submission)"
        actor: Employee
        preconditions:
          - "Employee.employment_status == ACTIVE"
          - "eligibility check passes (see §1.3 eligibility_calc): hire_date <= now() - 365 days AND hours_worked_trailing_12mo >= 1250 AND Worksite.employee_count_within_75_miles >= 50"
          - "requested_start_date >= now() (whole-day comparison)"
          - "expected_end_date >= requested_start_date"
        side_effects:
          - "case_status := PENDING_CERTIFICATION"
          - "If reason IN {OWN_SERIOUS_HEALTH, FAMILY_SERIOUS_HEALTH}, certification_status := AWAITING_DOC, else NOT_REQUIRED"
          - "cert_deadline := created_at + 15 days"
          - "leave_year_anchor := (employer.leave_year_basis == CALENDAR ? Jan 1 of requested_start_date's year : requested_start_date)"
          - "Employee.employment_status := ON_LEAVE on requested_start_date arrival (handled by /_clock/advance sweep)"
          - "Emit AuditEvent{ELIGIBILITY_CHECKED} then AuditEvent{CASE_CREATED}"

      - from: PENDING_CERTIFICATION
        to: APPROVED
        trigger: "POST /leave-cases/{id}/review  body { decision: 'APPROVE' }"
        actor: HRSpecialist
        preconditions:
          - "certification_status IN {COMPLETE, NOT_REQUIRED}"
          - "Available remaining hours for this leave year (see §1.3 quota_balance_calc) >= sum of PROPOSED LeaveInstance.hours_used on this case"
        side_effects:
          - "case_status := APPROVED"
          - "Every PROPOSED LeaveInstance on this case becomes APPROVED (instance.instance_status := APPROVED)"
          - "hours_charged := sum(LeaveInstance.hours_used WHERE instance_status==APPROVED) (link 1)"
          - "If pfl_claim_id is set AND reason IN {FAMILY_SERIOUS_HEALTH, BABY_BONDING} AND Employer.state_pfl_program == STATE_PFL_8WEEK: PfLClaim.claim_status := APPROVED then PfLClaim.claim_status := PAYING (link 2)"
          - "BenefitInvoice is created for the requested_start_date's calendar month (link 3 — see calculation benefit_invoice_calc)"
          - "Emit AuditEvent{CERTIFICATION_REVIEWED}"

      - from: PENDING_CERTIFICATION
        to: DENIED
        trigger: "POST /leave-cases/{id}/review  body { decision: 'DENY' }"
        actor: HRSpecialist
        preconditions:
          - "certification_status == INSUFFICIENT (provider attestation rejected) OR cert_deadline < now() with certification_status == AWAITING_DOC"
        side_effects:
          - "case_status := DENIED"
          - "Every LeaveInstance on this case transitions to VOIDED (instance.instance_status := VOIDED) (link 1)"
          - "hours_charged := 0 — quota re-credited (link 2 — see calculation quota_balance_calc)"
          - "job_restoration_status := NOT_APPLICABLE"
          - "If pfl_claim_id is set: PfLClaim.claim_status := DENIED (link 3)"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /_clock/advance  (server clock crosses requested_start_date)"
        actor: system
        preconditions:
          - "now() >= requested_start_date"
          - "case_status == APPROVED"
        side_effects:
          - "case_status := ACTIVE"
          - "Employee.employment_status := ON_LEAVE"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /leave-cases/{id}/return  (or POST /_clock/advance crossing expected_end_date)"
        actor: Employee | system
        preconditions:
          - "now() >= requested_start_date"
          - "leave_pattern == CONTINUOUS OR hours_charged == sum of APPROVED LeaveInstance.hours_used on this case AND no PROPOSED instances exist"
        side_effects:
          - "case_status := COMPLETED"

      - from: COMPLETED
        to: JOB_RESTORED
        trigger: "POST /leave-cases/{id}/restore-job"
        actor: HRSpecialist
        preconditions:
          - "case_status == COMPLETED"
          - "Employee.employment_status IN {ON_LEAVE, ACTIVE}"
          - "job_restoration_status == PROTECTED"
          - "No outstanding BenefitInvoice in FORFEITED state on this case"
        side_effects:
          - "case_status := JOB_RESTORED"
          - "Employee.employment_status := RESTORED"

      - from: DRAFT
        to: CANCELLED
        trigger: "DELETE /leave-cases/{id}"
        actor: Employee
        preconditions:
          - "case_status == DRAFT"
        side_effects:
          - "case_status := CANCELLED"

      - from: PENDING_CERTIFICATION
        to: CANCELLED
        trigger: "DELETE /leave-cases/{id}"
        actor: Employee
        preconditions:
          - "case_status == PENDING_CERTIFICATION"
        side_effects:
          - "case_status := CANCELLED"
          - "Every LeaveInstance on this case becomes VOIDED"
          - "hours_charged := 0"

  - entity: MedicalCertification
    initial_state: PENDING
    terminal_states: [ACCEPTED, INSUFFICIENT, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /leave-cases/{id}/certifications/{cert_id}/review  body { decision: 'ACCEPT' }"
        actor: HRSpecialist
        preconditions:
          - "MedicalCertification.serious_health_condition == true"
          - "LeaveCase.certification_status == RECEIVED"
        side_effects:
          - "review_outcome := ACCEPTED"
          - "LeaveCase.certification_status := COMPLETE (cross-entity: see §1.4 priority 38)"

      - from: PENDING
        to: INSUFFICIENT
        trigger: "POST /leave-cases/{id}/certifications/{cert_id}/review  body { decision: 'INSUFFICIENT' }"
        actor: HRSpecialist
        preconditions:
          - "LeaveCase.certification_status == RECEIVED"
        side_effects:
          - "review_outcome := INSUFFICIENT"
          - "LeaveCase.certification_status := INSUFFICIENT"
          - "Employee has 7 calendar days to cure (cure deadline = now() + 7 days); cure is a re-POST to /leave-cases/{id}/certifications which resets certification_status to RECEIVED and review_outcome cycles back to PENDING (cyclic loop)"

      - from: INSUFFICIENT
        to: PENDING
        trigger: "POST /leave-cases/{id}/certifications  (cure submission)"
        actor: Employee
        preconditions:
          - "now() <= cert_deadline + 7 days"
          - "LeaveCase.case_status == PENDING_CERTIFICATION"
        side_effects:
          - "A new MedicalCertification row is created with review_outcome := PENDING; the previous INSUFFICIENT row remains for audit"
          - "LeaveCase.certification_status := RECEIVED"

      - from: PENDING
        to: REJECTED
        trigger: "POST /leave-cases/{id}/certifications/{cert_id}/review  body { decision: 'REJECT' }"
        actor: HRSpecialist
        preconditions:
          - "MedicalCertification.serious_health_condition == false"
        side_effects:
          - "review_outcome := REJECTED"
          - "LeaveCase.certification_status := INSUFFICIENT"

  - entity: BenefitInvoice
    initial_state: ISSUED
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /benefit-invoices/{id}/pay"
        actor: Employee
        preconditions:
          - "invoice_status IN {ISSUED, GRACE}"
        side_effects:
          - "invoice_status := PAID"

      - from: ISSUED
        to: GRACE
        trigger: "POST /_clock/advance  (server clock crosses invoice issued_at + 30 days)"
        actor: system
        preconditions:
          - "invoice_status == ISSUED"
          - "now() >= created_at + 30 days"
        side_effects:
          - "invoice_status := GRACE"
          - "Employee notified (logged as AuditEvent)"

      - from: GRACE
        to: FORFEITED
        trigger: "POST /_clock/advance  (server clock crosses invoice issued_at + 45 days)"
        actor: system
        preconditions:
          - "invoice_status == GRACE"
          - "now() >= created_at + 45 days"
        side_effects:
          - "invoice_status := FORFEITED"
          - "LeaveCase.job_restoration_status := FORFEITED (cross-entity link)"
          - "Emit AuditEvent{BENEFIT_INVOICE_FORFEITED} then AuditEvent{JOB_RESTORATION_FORFEITED}"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two LeaveInstance POSTs on the same employee for the same calendar day"
    guarantee: "At most one LeaveInstance per (leave_case_id, instance_date) — second is rejected"
    error_id: ERR_DUPLICATE_INSTANCE_DAY
    http_status: 409
    serialization: "First-writer-wins on (leave_case_id, instance_date) uniqueness"

  - scenario: "HRSpecialist approves the case while the employee posts a cancellation"
    guarantee: "Exactly one operation succeeds; the loser sees ERR_INVALID_STATE because case_status already advanced"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on LeaveCase.case_status"

  - scenario: "Two HRSpecialists post APPROVE concurrently on the same case"
    guarantee: "Exactly one APPROVE wins; second is rejected via OCC version mismatch"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on LeaveCase.version"

  - scenario: "Two LeaveCase submissions race when only enough remaining-quota hours exist for one"
    guarantee: "The second is rejected because available hours after the first commit is below the requested instances' aggregate"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    serialization: "First-writer-wins on the quota debit; quota balance is recomputed inside the same transaction that flips case_status to APPROVED"

  - scenario: "Restore-job runs while the unpaid invoice is being marked FORFEITED by a clock-advance sweep"
    guarantee: "Restore-job is rejected because job_restoration_status flipped to FORFEITED first"
    error_id: ERR_JOB_RESTORATION_FORFEITED
    http_status: 409
    serialization: "First-writer-wins on LeaveCase.job_restoration_status (set by the clock sweep before /restore-job reads it)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: eligibility_calc
    trigger: "Evaluated at LeaveCase DRAFT -> PENDING_CERTIFICATION transition (POST /employees/{id}/leave-cases) and idempotently re-evaluated by GET /employees/{id}/eligibility-snapshot"
    algorithm: threshold
    formula: |
      months_of_service = (now() - Employee.hire_date) / (30 * 86400 * 1000)  // floor to whole months at calendar-month boundaries
      eligible := (months_of_service >= 12)
               AND (Employee.hours_worked_trailing_12mo >= 1250)
               AND (Worksite.employee_count_within_75_miles >= 50)
      // BOUNDARY: 12 months is INCLUSIVE (>= 12), 1250 hours is INCLUSIVE (>= 1250), 50 employees is INCLUSIVE (>= 50)
    input_set: "One specific Employee, its Worksite, evaluated against now() (server clock)"
    constants:
      MIN_MONTHS_SERVICE: 12
      MIN_HOURS_TRAILING: 1250
      MIN_HEADCOUNT_75MI: 50
    precision: "Months evaluated to whole-month boundaries; comparisons inclusive"
    variants:
      - name: standard
        when: "Default for any /employees/{id}/leave-cases POST"
        difference: "Returns true/false based on the three thresholds simultaneously; failing any one yields a specific error_id (ERR_NOT_ELIGIBLE_TENURE / ERR_NOT_ELIGIBLE_HOURS / ERR_NOT_ELIGIBLE_WORKSITE)"

  - name: quota_balance_calc
    trigger: "Evaluated at LeaveCase DRAFT->PENDING_CERTIFICATION (precondition), PENDING_CERTIFICATION->APPROVED (decrement), PENDING_CERTIFICATION->DENIED (re-credit), and on GET /employees/{id}/quota-balance"
    algorithm: aggregation
    formula: |
      // PINNED VARIANT IS SELECTED BY Employer.leave_year_basis (see variants below).
      // Both variants share the same shape but DIFFER in the window definition.
      window = window_for_variant(employee.employer.leave_year_basis, anchor_date)
      consumed_hours = sum(LeaveInstance.hours_used
                           WHERE LeaveInstance.leave_case_id IN (LeaveCase ids for this Employee
                                                                 with case_status IN {APPROVED, ACTIVE, COMPLETED, JOB_RESTORED})
                             AND LeaveInstance.instance_status == APPROVED
                             AND LeaveInstance.instance_date >= window.start
                             AND LeaveInstance.instance_date <= window.end)
      remaining_hours = max(0, FMLA_ENTITLEMENT_HOURS - consumed_hours)
      // FMLA bucket: 12 workweeks * 40 hours = 480 hours base entitlement per employee per leave year.
      // STATE PFL CONCURRENT RULE: if any LeaveCase in the consumed set has pfl_claim_id IS NOT NULL AND
      //   reason IN {FAMILY_SERIOUS_HEALTH, BABY_BONDING} AND Employer.state_pfl_program == STATE_PFL_8WEEK,
      //   the PFL weeks_authorized * 40 hours are NOT double-counted: they are already included in the same
      //   bucket because the FMLA and PFL run concurrently. No separate addition.
    input_set: "All APPROVED LeaveInstance records for the Employee whose owning LeaveCase has case_status IN {APPROVED, ACTIVE, COMPLETED, JOB_RESTORED}, with instance_date inside the leave-year window."
    constants:
      FMLA_ENTITLEMENT_HOURS: 480
      WORKWEEK_HOURS: 40
    precision: "Whole hours; remaining_hours floored at 0"
    variants:
      - name: calendar_year
        when: "Employer.leave_year_basis == CALENDAR"
        difference: |
          window.start = January 1 of LeaveCase.requested_start_date's calendar year (inclusive)
          window.end   = December 31 of LeaveCase.requested_start_date's calendar year (inclusive)
          A leave begun in late November carries no hours into the new year — Jan 1 resets the bucket completely.
      - name: rolling_backward
        when: "Employer.leave_year_basis == ROLLING_BACKWARD"
        difference: |
          window.start = LeaveCase.requested_start_date - 365 days (inclusive)
          window.end   = LeaveCase.requested_start_date (inclusive)
          Each day's available hours depend on what was used in the 365 days preceding it, so the same employee
          with identical usage history can have different remaining_hours under the two variants on the same date.

  - name: pfl_weekly_benefit_calc
    trigger: "Evaluated at PfLClaim creation (POST /pfl-claims) and pinned thereafter; re-read on PfLClaim payment events"
    algorithm: tiered_pricing
    formula: |
      // Step 1 (compute weekly wage):       weekly_wage_cents       = round_half_up(Employee.monthly_wage_cents * 12 / 52)
      // Step 2 (apply replacement ratio):   raw_weekly_benefit      = round_half_up(weekly_wage_cents * 0.60)
      // Step 3 (apply cap):                 weekly_benefit_cents    = min(raw_weekly_benefit, PFL_WEEKLY_CAP_CENTS)
      // ROUNDING ORDER IS PINNED: Step 1 rounds BEFORE Step 2 (per-step rounding, NOT sum-then-round).
      // Inputs must be the Employee's monthly_wage_cents AT THE TIME the PfLClaim row is created.
    input_set: "One Employee, one PfLClaim being created; cap PFL_WEEKLY_CAP_CENTS applied last"
    constants:
      WEEKS_PER_YEAR: 52
      MONTHS_PER_YEAR: 12
      REPLACEMENT_RATIO: 0.60
      PFL_WEEKLY_CAP_CENTS: 162900   # $1,629.00 cap
    precision: "Integer cents; round_half_up at each named step"
    variants:
      - name: under_cap
        when: "raw_weekly_benefit <= PFL_WEEKLY_CAP_CENTS"
        difference: "weekly_benefit_cents = raw_weekly_benefit"
      - name: at_cap
        when: "raw_weekly_benefit > PFL_WEEKLY_CAP_CENTS"
        difference: "weekly_benefit_cents = PFL_WEEKLY_CAP_CENTS"

  - name: benefit_invoice_calc
    trigger: "Evaluated when LeaveCase enters APPROVED (creates first invoice) and on every /_clock/advance that crosses a new calendar-month boundary while case_status IN {APPROVED, ACTIVE}"
    algorithm: chronological
    formula: |
      // Per-month invoice amount equals the employer's benefit_premium_share_cents prorated by the
      // fraction of the month the employee is on leave.
      days_in_month = number of calendar days in period_month (28/29/30/31)
      days_on_leave_in_month = count of LeaveInstance.instance_date IN [first_day_of_month, last_day_of_month]
                                with instance_status IN {APPROVED, PROPOSED}
                                for this LeaveCase
                              + (continuous-leave bridge days: if case.leave_pattern==CONTINUOUS,
                                                              every calendar day from max(requested_start_date, first_of_month)
                                                              through min(expected_end_date, last_of_month) inclusive)
      // The chronological algorithm processes calendar months in order so each month sees that month's actual on-leave days.
      amount_due_cents = round_half_up(Employer.benefit_premium_share_cents * days_on_leave_in_month / days_in_month)
    input_set: "One LeaveCase + its LeaveInstance records + Employer.benefit_premium_share_cents, processed month by month."
    constants: {}
    precision: "Integer cents, round_half_up"
    variants: []

  - name: job_restoration_score
    trigger: "Evaluated at every POST /leave-cases/{id}/return, every BenefitInvoice transition, and every /_clock/advance that crosses cert_deadline; also on GET /leave-cases/{id}"
    algorithm: weighted_scoring
    formula: |
      // The score is computed by stacking THREE multiplicative penalty signals; the order matters because
      // each step's input is the previous step's output. ROUNDING ORDER IS PINNED: per-step rounding.
      // Step 1: base_score = 100
      // Step 2: cert_penalty:   if certification_status == INSUFFICIENT at time of evaluation, score := round_half_up(base_score * 0.50); else score := base_score
      // Step 3: invoice_penalty: if any BenefitInvoice on this case has invoice_status == FORFEITED, score := round_half_up(score * 0.00) = 0; else if any in GRACE, score := round_half_up(score * 0.75); else score := score
      // Step 4: tenure_bonus:   if Employee.hours_worked_trailing_12mo >= 2000, score := round_half_up(score * 1.10); else score := score (cap at 100 — round_half_up(score) and clamp to <=100)
      // job_restoration_status := (final score >= JOB_RESTORATION_FLOOR ? PROTECTED : FORFEITED)
    input_set: "One LeaveCase, its MedicalCertifications, its BenefitInvoices, the owning Employee."
    constants:
      JOB_RESTORATION_FLOOR: 50
      INSUFF_MULTIPLIER: 0.50
      FORFEIT_MULTIPLIER: 0.00
      GRACE_MULTIPLIER: 0.75
      TENURE_BONUS_MULTIPLIER: 1.10
      MAX_SCORE: 100
    precision: "Integer score 0..100, round_half_up after every step"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all except GET /_health"

  - priority: 2
    category: auth
    check: "X-User-Role is a known role (Employee, HRSpecialist, ComplianceOfficer)"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all except GET /_health"

  - priority: 3
    category: auth
    check: "X-User-ID for entity-backed roles resolves to an existing row in the backing entity (Employee/HRSpecialist tables)"
    error_id: ERR_UNKNOWN_IDENTITY
    http_status: 401
    applies_to: "all except opaque ComplianceOfficer operations"

  - priority: 4
    category: auth
    check: "Role is permitted for the endpoint (per §1.7 RBAC)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Path :employee_id, :leave_case_id, :cert_id, :invoice_id, :pfl_claim_id exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "Ownership: when role is Employee, X-User-ID equals the Employee.id that owns the target resource"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "all employee-scoped endpoints"

  - priority: 7
    category: state
    check: "Target LeaveCase.case_status is in the allowed-from set for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all LeaveCase mutation endpoints"

  - priority: 8
    category: state
    check: "OCC: request.version (if supplied) equals current resource.version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH/PUT/DELETE endpoints"

  - priority: 9
    category: state
    check: "Employee.employment_status != TERMINATED for any case mutation"
    error_id: ERR_EMPLOYEE_TERMINATED
    http_status: 409
    applies_to: "all LeaveCase mutation endpoints"

  - priority: 10
    category: business_safety
    check: "Eligibility (12-month service): months_of_service >= 12 at submission time"
    error_id: ERR_NOT_ELIGIBLE_TENURE
    http_status: 422
    applies_to: "POST /employees/{id}/leave-cases"

  - priority: 11
    category: business_safety
    check: "Eligibility (1250 hours): Employee.hours_worked_trailing_12mo >= 1250"
    error_id: ERR_NOT_ELIGIBLE_HOURS
    http_status: 422
    applies_to: "POST /employees/{id}/leave-cases"

  - priority: 12
    category: business_safety
    check: "Eligibility (worksite headcount): Worksite.employee_count_within_75_miles >= 50"
    error_id: ERR_NOT_ELIGIBLE_WORKSITE
    http_status: 422
    applies_to: "POST /employees/{id}/leave-cases"

  - priority: 13
    category: business_temporal
    check: "Certification deadline: AT review time, if certification_status == AWAITING_DOC AND now() > cert_deadline, the case must be DENIED rather than APPROVED"
    error_id: ERR_CERT_DEADLINE_MISSED
    http_status: 422
    applies_to: "POST /leave-cases/{id}/review with decision=APPROVE"

  - priority: 14
    category: business_constraint
    check: "Certification consistency: cannot APPROVE a case whose certification_status is INSUFFICIENT or AWAITING_DOC"
    error_id: ERR_CERT_INCOMPLETE
    http_status: 422
    applies_to: "POST /leave-cases/{id}/review"

  - priority: 15
    category: business_fiscal
    check: "Quota: sum of all PROPOSED+APPROVED LeaveInstance.hours_used on this case + already-consumed hours in the leave year <= 480 (FMLA_ENTITLEMENT_HOURS)"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /leave-cases/{id}/review; POST /leave-cases/{id}/instances"

  - priority: 16
    category: business_temporal
    check: "Intermittent boundary: hours_used per instance must satisfy 1 <= hours_used <= 24, and only LeaveCase.leave_pattern IN {INTERMITTENT, REDUCED_SCHEDULE} may post multiple distinct-day instances; CONTINUOUS cases may not post manual instances"
    error_id: ERR_INSTANCE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /leave-cases/{id}/instances"

  - priority: 17
    category: business_temporal
    check: "Instance overlap: no two LeaveInstance rows on the same employee (across all of that employee's LeaveCases) may share the same instance_date if BOTH would consume hours in the same leave-year window"
    error_id: ERR_INSTANCE_OVERLAP
    http_status: 422
    applies_to: "POST /leave-cases/{id}/instances"

  - priority: 18
    category: business_temporal
    check: "PFL claim window: PfLClaim.weeks_authorized must be 1..8; if state_pfl_program == NONE, PfLClaim creation is rejected"
    error_id: ERR_PFL_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /pfl-claims; POST /employees/{id}/leave-cases when pfl_claim_id is supplied"

  - priority: 19
    category: business_referential
    check: "PFL linkage: if LeaveCase.pfl_claim_id is set, the PfLClaim must belong to the same Employee AND PfLClaim.claim_type aligns with LeaveCase.reason (FAMILY_CARE↔FAMILY_SERIOUS_HEALTH, BABY_BONDING↔BABY_BONDING)"
    error_id: ERR_PFL_MISMATCH
    http_status: 422
    applies_to: "POST /employees/{id}/leave-cases"

  - priority: 20
    category: business_safety
    check: "Job restoration: case_status must be COMPLETED AND job_restoration_status == PROTECTED"
    error_id: ERR_JOB_RESTORATION_FORFEITED
    http_status: 409
    applies_to: "POST /leave-cases/{id}/restore-job"

  - priority: 21
    category: business_fiscal
    check: "Benefit invoice payment: invoice_status must be IN {ISSUED, GRACE}"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /benefit-invoices/{id}/pay"

  - priority: 22
    category: business_constraint
    check: "Duplicate-day uniqueness: LeaveInstance (leave_case_id, instance_date) must be unique"
    error_id: ERR_DUPLICATE_INSTANCE_DAY
    http_status: 409
    applies_to: "POST /leave-cases/{id}/instances"

  - priority: 23
    category: business_constraint
    check: "Body schema: required fields present and of declared types"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH/PUT endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Employer/Worksite/Employee admin ---
  - method: POST
    path: "/employers"
    description: "Create an employer (admin)"
    roles: [ComplianceOfficer]
    code: 201
    input: [legal_name, leave_year_basis, state_pfl_program, benefit_premium_share_cents]
    output: Employer
    side_effects: []

  - method: GET
    path: "/employers/{employer_id}"
    description: "Read an employer"
    roles: [ComplianceOfficer, HRSpecialist]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: POST
    path: "/employers/{employer_id}/worksites"
    description: "Create a worksite under an employer"
    roles: [ComplianceOfficer]
    code: 201
    input: [address_line, employee_count_within_75_miles]
    output: Worksite
    side_effects: []

  - method: PATCH
    path: "/worksites/{worksite_id}"
    description: "Update worksite headcount (drives eligibility)"
    roles: [ComplianceOfficer]
    code: 200
    input: [employee_count_within_75_miles, version]
    output: Worksite
    side_effects: ["No retroactive effect on existing LeaveCases; future eligibility checks read the new value"]

  - method: POST
    path: "/employers/{employer_id}/employees"
    description: "Create an employee"
    roles: [ComplianceOfficer, HRSpecialist]
    code: 201
    input: [worksite_id, full_name, hire_date, hours_worked_trailing_12mo, monthly_wage_cents]
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees/{employee_id}"
    description: "Read employee"
    roles: [ComplianceOfficer, HRSpecialist, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: POST
    path: "/employees/{employee_id}/hours-snapshot"
    description: "Refresh Employee.hours_worked_trailing_12mo from a payroll feed"
    roles: [HRSpecialist]
    code: 200
    input: [hours_worked_trailing_12mo]
    output: Employee
    side_effects: ["Employee.hours_worked_trailing_12mo updated; no retro recompute"]

  - method: GET
    path: "/employees/{employee_id}/eligibility-snapshot"
    description: "Returns a synchronous eligibility result for the employee at now()"
    roles: [HRSpecialist, Employee]
    code: 200
    input: []
    output: "{ eligible: boolean, reason_code: string|null, months_of_service: integer, hours_trailing: integer, worksite_headcount: integer }"
    side_effects: []

  - method: GET
    path: "/employees/{employee_id}/quota-balance"
    description: "Returns FMLA quota balance under the employer's leave_year_basis; the as_of_date query param defaults to now()"
    roles: [HRSpecialist, Employee]
    code: 200
    input: ["as_of_date?"]
    output: "{ basis: enum, window_start: date, window_end: date, consumed_hours: integer, remaining_hours: integer }"
    side_effects: []

  # --- LeaveCase lifecycle ---
  - method: POST
    path: "/employees/{employee_id}/leave-cases"
    description: "Submit a new FMLA/PFL case"
    roles: [Employee, HRSpecialist]
    code: 201
    input: ["reason", "leave_pattern", "requested_start_date", "expected_end_date", "pfl_claim_id?"]
    output: LeaveCase
    side_effects:
      - "Runs eligibility_calc"
      - "case_status := PENDING_CERTIFICATION (if eligible)"
      - "cert_deadline set"
      - "leave_year_anchor pinned"
      - "AuditEvent rows written"

  - method: GET
    path: "/leave-cases/{leave_case_id}"
    description: "Read a leave case (includes computed job_restoration_score and hours_charged)"
    roles: [Employee, HRSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: LeaveCase
    side_effects: []

  - method: GET
    path: "/employees/{employee_id}/leave-cases"
    description: "List leave cases for an employee (paginated)"
    roles: [Employee, HRSpecialist, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "case_status?"]
    output: "LeaveCase[]"
    side_effects: []

  - method: POST
    path: "/leave-cases/{leave_case_id}/instances"
    description: "Log a single-day LeaveInstance under an intermittent or reduced-schedule case"
    roles: [Employee, HRSpecialist]
    code: 201
    input: [instance_date, hours_used]
    output: LeaveInstance
    side_effects:
      - "LeaveCase.hours_charged recomputed if instance auto-becomes APPROVED on already-APPROVED parent case"
      - "Validations 16, 17, 22 fire"

  - method: DELETE
    path: "/leave-cases/{leave_case_id}/instances/{instance_id}"
    description: "Void a logged instance (only by HRSpecialist; only while parent case is APPROVED or ACTIVE)"
    roles: [HRSpecialist]
    code: 204
    input: []
    output: null
    side_effects:
      - "instance.instance_status := VOIDED"
      - "LeaveCase.hours_charged recomputed (re-credits the bucket)"

  - method: POST
    path: "/leave-cases/{leave_case_id}/certifications"
    description: "Submit a MedicalCertification (employee uploads provider attestation)"
    roles: [Employee]
    code: 201
    input: ["serious_health_condition", "estimated_frequency_per_month?", "estimated_duration_hours?"]
    output: MedicalCertification
    side_effects:
      - "LeaveCase.certification_status := RECEIVED"
      - "New row created; old INSUFFICIENT row remains for audit"

  - method: POST
    path: "/leave-cases/{leave_case_id}/certifications/{cert_id}/review"
    description: "HRSpecialist reviews a MedicalCertification packet"
    roles: [HRSpecialist]
    code: 200
    input: [decision]
    output: MedicalCertification
    side_effects:
      - "review_outcome updated"
      - "LeaveCase.certification_status updated per the MedicalCertification state machine"

  - method: POST
    path: "/leave-cases/{leave_case_id}/review"
    description: "HRSpecialist decides APPROVE or DENY on the case"
    roles: [HRSpecialist]
    code: 200
    input: [decision]
    output: LeaveCase
    side_effects:
      - "If APPROVE: PROPOSED instances become APPROVED; hours_charged recomputed; PfLClaim linked claim flips to PAYING; first BenefitInvoice issued"
      - "If DENY: all instances become VOIDED; quota re-credited; pfl claim DENIED; job_restoration_status := NOT_APPLICABLE"

  - method: POST
    path: "/leave-cases/{leave_case_id}/return"
    description: "Employee posts return-to-work, ending the leave"
    roles: [Employee, HRSpecialist]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "case_status := COMPLETED"

  - method: POST
    path: "/leave-cases/{leave_case_id}/restore-job"
    description: "Mark the employee restored to position"
    roles: [HRSpecialist]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "case_status := JOB_RESTORED"
      - "Employee.employment_status := RESTORED"

  - method: DELETE
    path: "/leave-cases/{leave_case_id}"
    description: "Cancel a case while it is still DRAFT or PENDING_CERTIFICATION"
    roles: [Employee]
    code: 204
    input: ["version?"]
    output: null
    side_effects:
      - "case_status := CANCELLED; instances voided"

  # --- PFL claim ---
  - method: POST
    path: "/pfl-claims"
    description: "Create a state PFL claim (employee or HR on behalf of employee)"
    roles: [Employee, HRSpecialist]
    code: 201
    input: [employee_id, claim_type, weeks_authorized]
    output: PfLClaim
    side_effects:
      - "pfl_weekly_benefit_calc runs and pins weekly_benefit_cents"

  - method: GET
    path: "/pfl-claims/{pfl_claim_id}"
    description: "Read a PFL claim"
    roles: [Employee, HRSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: PfLClaim
    side_effects: []

  # --- Benefit invoices ---
  - method: GET
    path: "/leave-cases/{leave_case_id}/benefit-invoices"
    description: "List benefit invoices for a case"
    roles: [Employee, HRSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "BenefitInvoice[]"
    side_effects: []

  - method: POST
    path: "/benefit-invoices/{invoice_id}/pay"
    description: "Mark invoice paid"
    roles: [Employee, HRSpecialist]
    code: 200
    input: []
    output: BenefitInvoice
    side_effects:
      - "invoice_status := PAID"

  # --- Audit ---
  - method: GET
    path: "/leave-cases/{leave_case_id}/audit-events"
    description: "Append-only audit log for a case"
    roles: [HRSpecialist, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Test-driving endpoints (REQUIRED for time-gated transitions, see §1.5 testability-completeness principle) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock so time-gated transitions fire (ACTIVE on start_date, COMPLETED on end_date, BenefitInvoice GRACE/FORFEITED, cert deadline expiry)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_timestamp]
    output: "{ now: datetime, transitions_fired: integer }"
    side_effects:
      - "LeaveCase APPROVED -> ACTIVE for those whose requested_start_date <= now()"
      - "LeaveCase ACTIVE -> COMPLETED for those whose expected_end_date <= now() with no PROPOSED instances"
      - "BenefitInvoice ISSUED -> GRACE for invoices >= 30 days old"
      - "BenefitInvoice GRACE -> FORFEITED for invoices >= 45 days old; cascades LeaveCase.job_restoration_status := FORFEITED"
      - "MedicalCertification cure deadline (cert_deadline + 7 days) auto-flips LeaveCase.certification_status to INSUFFICIENT permanently"

  - method: GET
    path: "/_health"
    description: "Liveness probe — returns server clock"
    roles: ["*"]
    code: 200
    input: []
    output: "{ status: string, now: datetime }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"

  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the declared roles"

  - id: ERR_UNKNOWN_IDENTITY
    http: 401
    condition: "X-User-ID for an entity-backed role does not exist in the backing entity"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted for the endpoint per RBAC"

  - id: ERR_NOT_OWNER
    http: 403
    condition: "Employee role's X-User-ID does not match the employee_id that owns the resource"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not resolve to an existing row"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource status is not in the transition's allowed-from set"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version != current row version on a mutation"

  - id: ERR_EMPLOYEE_TERMINATED
    http: 409
    condition: "Employee.employment_status == TERMINATED while attempting a case mutation"

  - id: ERR_NOT_ELIGIBLE_TENURE
    http: 422
    condition: "months_of_service < 12 at case submission"

  - id: ERR_NOT_ELIGIBLE_HOURS
    http: 422
    condition: "hours_worked_trailing_12mo < 1250 at case submission"

  - id: ERR_NOT_ELIGIBLE_WORKSITE
    http: 422
    condition: "Worksite.employee_count_within_75_miles < 50 at case submission"

  - id: ERR_CERT_DEADLINE_MISSED
    http: 422
    condition: "AT review-time, certification_status is still AWAITING_DOC and now() > cert_deadline"

  - id: ERR_CERT_INCOMPLETE
    http: 422
    condition: "Attempt to APPROVE a case whose certification_status is INSUFFICIENT or AWAITING_DOC"

  - id: ERR_QUOTA_EXCEEDED
    http: 422
    condition: "Approving the case (or logging the instance) would push consumed_hours above 480"

  - id: ERR_INSTANCE_NOT_ALLOWED
    http: 422
    condition: "Instance posted on a CONTINUOUS case OR hours_used outside [1, 24]"

  - id: ERR_INSTANCE_OVERLAP
    http: 422
    condition: "Another LeaveInstance for the same employee on the same instance_date already exists across this employee's cases"

  - id: ERR_PFL_NOT_AVAILABLE
    http: 422
    condition: "Employer.state_pfl_program == NONE OR weeks_authorized outside [1,8]"

  - id: ERR_PFL_MISMATCH
    http: 422
    condition: "PfLClaim.employee_id != LeaveCase.employee_id OR claim_type does not align with reason"

  - id: ERR_JOB_RESTORATION_FORFEITED
    http: 409
    condition: "restore-job called while job_restoration_status != PROTECTED"

  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "BenefitInvoice.invoice_status not in {ISSUED, GRACE}"

  - id: ERR_DUPLICATE_INSTANCE_DAY
    http: 409
    condition: "(leave_case_id, instance_date) uniqueness violated"

  - id: ERR_VALIDATION
    http: 400
    condition: "Request body fails schema validation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Employee
    description: "An individual worker who may submit and manage their own leave cases."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /employees/{id}/leave-cases for self"
      - "POST /leave-cases/{id}/certifications"
      - "DELETE /leave-cases/{id} (while DRAFT or PENDING_CERTIFICATION) — self only"
    shared_operations:
      - "POST /leave-cases/{id}/instances (shared with HRSpecialist)"
      - "POST /leave-cases/{id}/return (shared with HRSpecialist)"
      - "POST /pfl-claims (shared with HRSpecialist; must be for self)"
      - "POST /benefit-invoices/{id}/pay (shared with HRSpecialist)"
      - "GET /employees/{id} (self)"
      - "GET /employees/{id}/eligibility-snapshot (self)"
      - "GET /employees/{id}/quota-balance (self)"
      - "GET /employees/{id}/leave-cases (self)"
      - "GET /leave-cases/{id} (self)"
      - "GET /leave-cases/{id}/benefit-invoices (self)"

  - name: HRSpecialist
    description: "Human-resources staff who review certifications, approve/deny cases, restore jobs, and may act on behalf of any employee within the same employer."
    identity: "entity_backed:HRSpecialist"
    exclusive_operations:
      - "POST /leave-cases/{id}/review"
      - "POST /leave-cases/{id}/certifications/{cert_id}/review"
      - "POST /leave-cases/{id}/restore-job"
      - "DELETE /leave-cases/{id}/instances/{instance_id} (void)"
      - "POST /employees/{id}/hours-snapshot"
    shared_operations:
      - "Most read endpoints and the instance-logging endpoint shared with Employee"
      - "GET /leave-cases/{id}/audit-events (shared with ComplianceOfficer)"

  - name: ComplianceOfficer
    description: "Read-only auditor and admin who manages employer/worksite configuration and exercises test-driving endpoints. Not tied to any employee."
    identity: "opaque"
    exclusive_operations:
      - "POST /employers"
      - "POST /employers/{id}/worksites"
      - "PATCH /worksites/{id}"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /leave-cases/{id}/audit-events"
      - "GET /employers/{id}"
