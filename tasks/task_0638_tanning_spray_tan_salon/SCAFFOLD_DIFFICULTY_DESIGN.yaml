  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_turnaround_buffer_adjacency
        grounds:
          - validations[priority=13]
          - entities.Equipment.fields.turnaround_seconds
          - errors[ERR_EQUIPMENT_SLOT_CONFLICT]
        distinguishing_aspect: "Equipment interval semantics: occupation is [start, end + turnaround_seconds). A booking starting one minute inside the 600s turnaround buffer collides (ERR_EQUIPMENT_SLOT_CONFLICT) while a booking starting exactly at the buffer end (half-open) is admitted; different members avoid the 24h cooldown."
