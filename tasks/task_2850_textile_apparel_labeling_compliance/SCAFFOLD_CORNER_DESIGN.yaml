        distinguishing_aspect: "The five uniqueness keys have five different shapes - a global code, a per-brand pair, a global string, a state-filtered pair and a state-filtered triple - and each raises its own error_id at priority 81; the two state-filtered keys must also prove they are scoped, so a second CARE reservation on a different style and a same-code finding on a different style both succeed."
