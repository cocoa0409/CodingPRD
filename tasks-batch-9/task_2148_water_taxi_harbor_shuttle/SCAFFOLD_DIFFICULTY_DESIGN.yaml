              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip_ok_id: $.data.id }
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_bad_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-16T10:00:00Z", scheduled_arrival_utc: "2026-09-16T10:25:00Z" }
