        claim_type: correct_result
        grounds: [calculations.exposure_minutes_on_return]
        distinguishing_aspect: "exposure_minutes uses floor((returned_at - issued_at)/60s); 90 seconds yields 1 minute."
        test_recipe:
          setup: ["Shop + lot issued at T0; clock advanced 90 seconds; issue returned"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SC1", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "WC1", full_name: "Welder C1" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV-C1", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L-C1", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
              captures: { issue_id: $.data.id }
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:30Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues/${issue_id}/return"
              payload: {}
              as: MaterialController
              captures: { exposure: $.data.exposure_minutes }
          assert:
            - "exposure == 1 (floor of 90/60)"

      - name: smaw_exposure_limit_boundary
        claim_type: boundary_edge
        grounds: [calculations.exposure_minutes_on_return, entities.ConsumableLot.fields.exposed_minutes_total]
        distinguishing_aspect: "exposed_minutes_total at exactly 240 triggers QUARANTINED (>=); 239 does not."
        test_recipe:
          setup: ["Two SMAW lots; lot A accumulated 239 minutes, lot B accumulated 240 minutes"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SC2", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
