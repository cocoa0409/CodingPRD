          A 14-day claim on a 28-day term of 1001 cents is exactly 500.5 cents, so round_half_up must
          return 501 — truncation or banker's rounding would return 500 — while under UNUSED_PERIOD a
          29-day claim collapses to 0 because floor(29/30) is 0 and a 30-day claim on the same
          365-day term of 11999 cents yields round_half_up(986.2192) == 986.
