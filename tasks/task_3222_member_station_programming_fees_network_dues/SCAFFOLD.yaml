scenario: "Member Station Programming Fees & Network Dues (NPR): member station eligibility criteria based on coverage, staffing and operations with membership classes, programming fee computation from a station's revenue and market size with annual adjustment, program carriage agreements with clearance requirements, broadcast windows and embargo rules, distribution infrastructure operations for satellite and digital feeds with station scheduling automation, underwriting and sponsorship rules constraining acknowledgment language, station-network content sharing where local reporting feeds national programs with compensation, membership drive coordination and audience data sharing, governance where member stations elect board representation and vote on dues structures"
domain_name: "member-station-programming-fees-network-dues"
api_prefix: "/network"
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: "Pushed beyond the Expert band: 15 entities, 60 endpoints, 30 error codes, 10 calculations (4 with dual variants), 12 state machines of which 5 are non-linear (4 cyclic, 1 parallel-counter), and 5 hard transitive cascades of depth 3+."
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
entities:
  - name: MemberStation
    parent: null
    common_fields: true
    fields:
      - {name: call_sign, type: string, source: input, description: "Unique uppercase station call sign", constraints: "unique; pattern ^[A-Z]{3,4}$"}
      - {name: licensee_name, type: string, source: input, description: "Licensee organization name"}
      - {name: state_code, type: string, source: input, description: "Two-letter US state code of the station's primary community", constraints: "length 2, uppercase"}
      - {name: dma_market_rank, type: integer, source: input, description: "Nielsen DMA rank of the station's market, 1 (largest) to 210", constraints: "1 <= dma_market_rank <= 210"}
      - {name: dma_households, type: integer, source: input, description: "Households in the station's DMA; the coverage-breadth input", constraints: ">= 0"}
      - {name: coverage_population, type: integer, source: input, description: "Population inside the station's primary contour", constraints: ">= 0"}
      - {name: full_time_staff_count, type: integer, source: input, description: "Full-time station staff headcount", constraints: ">= 0"}
      - {name: newsroom_staff_count, type: integer, source: input, description: "Full-time newsroom staff headcount", constraints: ">= 0"}
      - {name: annual_local_revenue_cents, type: integer, source: input, description: "Most recently reported annual local revenue, in cents", constraints: ">= 0"}
      - {name: board_seat_region, type: enum, source: input, description: "Governance region used for board representation", constraints: "REGION_NORTHEAST | REGION_SOUTH | REGION_MIDWEST | REGION_WEST"}
      - {name: operations_score, type: number, source: computed, description: "Weighted operations score over coverage, staffing and operations inputs; produced by station_operations_score"}
      - {name: membership_class, type: enum, source: computed, description: "Membership class selected from operations_score and coverage thresholds; produced by membership_class_assignment", constraints: "CLASS_A | CLASS_B | CLASS_C | CLASS_D"}
      - {name: eligibility_status, type: enum, source: system, description: "Eligibility lifecycle state of the member station", default: APPLICANT, constraints: "APPLICANT | UNDER_REVIEW | DEFICIENT | REMEDIATION_SUBMITTED | ELIGIBLE | PROBATION | SUSPENDED | WITHDRAWN"}
      - {name: dues_arrears_cents, type: integer, source: system, description: "Unpaid network dues accumulated when programming fee assessments finalize", default: 0}
      - {name: contribution_credit_cents, type: integer, source: computed, description: "Conserved national content-sharing credit balance", default: 0}
      - {name: applied_relief_cents, type: integer, source: computed, description: "Cumulative credit mass this station has converted into dues relief; the third term of the credit-conservation invariant", default: 0}
      - {name: dues_vote_eligible, type: boolean, source: computed, description: "Mirror of the DuesVoteEligibilityProjection row; true only while eligibility_status IN {ELIGIBLE, PROBATION} and eligible_from <= clock.now()", default: false}
      - {name: eligible_from, type: datetime, source: system, description: "Instant from which the station may vote and field candidates", default: null}
      - {name: last_review_at, type: datetime, source: system, description: "Timestamp of the most recent eligibility decision", default: null}
  - name: ProgrammingFeeSchedule
    parent: null
    common_fields: false
    fields:
      - {name: schedule_code, type: string, source: input, description: "Unique schedule identifier", constraints: "unique; pattern ^FY[0-9]{4}[A-Z]$"}
      - {name: fiscal_year, type: integer, source: input, description: "Fiscal year the schedule prices", constraints: "2024 <= fiscal_year <= 2100"}
      - {name: base_fee_cents, type: integer, source: input, description: "Flat annual network programming base fee, in cents", constraints: ">= 0"}
      - {name: revenue_rate_bps, type: integer, source: input, description: "Basis points applied to the station's assessed local revenue", constraints: ">= 0"}
      - {name: market_tier_1_max_rank, type: integer, source: input, description: "Largest DMA rank still in market tier 1", default: 25, constraints: ">= 1"}
      - {name: market_tier_2_max_rank, type: integer, source: input, description: "Largest DMA rank still in market tier 2", default: 75, constraints: ">market_tier_1_max_rank"}
      - {name: market_tier_3_max_rank, type: integer, source: input, description: "Largest DMA rank still in market tier 3; ranks above this are tier 4", default: 150, constraints: ">market_tier_2_max_rank"}
      - {name: market_size_multiplier_bps, type: integer, source: input, description: "Tier-1 market size multiplier in basis points; tiers 2-4 use the pinned ladder in programming_fee_provisional", constraints: ">= 10000"}
      - {name: minimum_fee_cents, type: integer, source: input, description: "Floor applied to the provisional fee", constraints: ">= 0"}
      - {name: maximum_fee_cents, type: integer, source: input, description: "Ceiling applied to the provisional fee", constraints: ">minimum_fee_cents"}
      - {name: annual_adjustment_bps, type: integer, source: input, description: "Signed annual adjustment in basis points applied only by programming_fee_final_adjusted; may be negative", constraints: ">= -2000"}
      - {name: rounding_mode, type: enum, source: input, description: "Pinned rounding order for the fee pipeline", default: ROUND_PER_COMPONENT_THEN_SUM, constraints: "ROUND_PER_COMPONENT_THEN_SUM"}
      - {name: effective_from, type: datetime, source: input, description: "Instant the schedule becomes price-effective (annual adjustment epoch anchor)"}
      - {name: effective_to, type: datetime, source: input, description: "Instant the schedule stops being price-effective"}
  - name: CarriageAgreement
    parent: null
    common_fields: true
    fields:
      - {name: program_code, type: string, source: input, description: "Network program code the agreement carries", constraints: "pattern ^NP-[0-9]{4}$"}
      - {name: obligation_type, type: enum, source: input, description: "Carriage obligation strength", constraints: "MANDATORY | OPTIONAL | DISCRETIONARY"}
      - {name: agreement_status, type: enum, source: system, description: "Carriage agreement lifecycle state", default: DRAFT, constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | CLEARED | CARRIED | ACTIVE | EMBARGOED | EXPIRED | TERMINATED"}
      - {name: clearance_deadline, type: datetime, source: input, description: "Instant by which every window must be cleared"}
      - {name: exception_liability_cap_cents, type: integer, source: input, description: "Cap on billable exception liability accrued by carriage exceptions", constraints: ">= 0"}
      - {name: published_at, type: datetime, source: system, description: "Timestamp the agreement entered CARRIED; null until then", default: null}
  - name: BroadcastWindow
    parent: CarriageAgreement
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the carrying station"}
      - {name: program_code, type: string, source: input, description: "Program code carried inside this window; must equal the sibling agreement's program_code"}
      - {name: window_start, type: datetime, source: input, description: "Inclusive start instant of the broadcast window"}
      - {name: window_end, type: datetime, source: input, description: "Exclusive end instant of the broadcast window"}
      - {name: embargo_until, type: datetime, source: input, description: "Instant before which the program may not be broadcast", default: null}
      - {name: clearance_status, type: enum, source: system, description: "Window lifecycle state", default: DRAFT, constraints: "DRAFT | PENDING_CLEARANCE | CLEARED | REJECTED | SCHEDULED | BROADCAST | MISSED | VIOLATED"}
      - {name: is_cleared, type: boolean, source: computed, description: "True when clearance_status == CLEARED and every embargo obligation is satisfied; gates clearance_deadline enforcement and the carriage_clearance_ratio aggregation"}
      - {name: carriage_exception_liability_cents, type: integer, source: computed, description: "Liability accrued by this window's exceptions; summed by the agreement"}
      - {name: rejection_reason, type: string, source: input, description: "Reason recorded when the window is rejected or violated", default: null}
  - name: DistributionFeed
    parent: null
    common_fields: true
    fields:
      - {name: feed_code, type: string, source: input, description: "Unique distribution feed identifier", constraints: "unique; pattern ^FEED-[A-Z0-9]{4}$"}
      - {name: feed_type, type: enum, source: input, description: "Distribution technology class", constraints: "SATELLITE | DIGITAL | HYBRID"}
      - {name: total_capacity_units, type: integer, source: input, description: "Total capacity units the feed can carry per broadcast day", constraints: ">= 1"}
      - {name: reserved_capacity_units, type: integer, source: system, description: "Capacity units currently reserved by RECURRING/SCHEDULED uplink slots", default: 0}
      - {name: crowded, type: boolean, source: computed, description: "True when reserved_capacity_units / total_capacity_units >= max_reserved_capacity_ratio"}
      - {name: feed_status, type: enum, source: system, description: "Feed operational status", default: PLANNED, constraints: "PLANNED | ONLINE | CROWDED | MAINTENANCE | OFFLINE | SUSPENDED"}
  - name: UplinkSlot
    parent: DistributionFeed
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the station occupying the feed"}
      - {name: window_id, type: string, source: input, description: "FK -> BroadcastWindow.id; the window this uplink carries"}
      - {name: slot_start, type: datetime, source: input, description: "Inclusive start instant of the uplink reservation"}
      - {name: slot_end, type: datetime, source: input, description: "Exclusive end instant of the uplink reservation"}
      - {name: slot_status, type: enum, source: system, description: "Uplink slot lifecycle state", default: RESERVED, constraints: "RESERVED | SCHEDULED | PREEMPTED | CANCELLED | RELEASED | AIRED"}
      - {name: priority_rank, type: integer, source: input, description: "Uplink priority; lower value wins preemption", constraints: "1 <= priority_rank <= 5"}
  - name: UnderwritingAgreement
    parent: null
    common_fields: true
    fields:
      - {name: sponsor_name, type: string, source: input, description: "Name of the underwriter or sponsor organization"}
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the station that sold the acknowledgment"}
      - {name: program_code, type: string, source: input, description: "Program code the acknowledgment is attached to"}
      - {name: ack_script_text, type: string, source: input, description: "Proposed acknowledgment script text evaluated by the acknowledgment language rules"}
      - {name: consideration_cents, type: integer, source: input, description: "Cash consideration for the underwriting agreement, in cents", constraints: "> 0"}
      - {name: agreement_status, type: enum, source: system, description: "Underwriting agreement lifecycle state", default: SUBMITTED, constraints: "SUBMITTED | COMPLIANCE_REVIEW | APPROVED | SCHEDULED | AIRED | REJECTED"}
      - {name: compliance_segment_count, type: integer, source: system, description: "Number of on-air segments in which the acknowledgment must air", default: 1, constraints: ">= 1"}
      - {name: aired_segment_count, type: integer, source: system, description: "On-air segments in which the acknowledgment has aired", default: 0}
      - {name: disclosure_test_passed, type: boolean, source: computed, description: "True when ack_script_text violates no sponsorship acknowledgment rule"}
  - name: ContentContribution
    parent: null
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the originating member station"}
      - {name: program_id, type: string, source: input, description: "FK -> NationalProgram.id; the program that may license the piece"}
      - {name: headline, type: string, source: input, description: "Slug headline of the local reporting piece"}
      - {name: duration_seconds, type: integer, source: input, description: "Runtime of the piece in seconds", constraints: ">= 1"}
      - {name: contribution_status, type: enum, source: system, description: "Content contribution lifecycle state", default: DRAFT, constraints: "DRAFT | SUBMITTED | SHORTLISTED | LICENSED | USED | WITHDRAWN | REJECTED"}
      - {name: last_request_at, type: datetime, source: system, description: "Timestamp of the most recent request-for-resubmission; null when never requested", default: null}
      - {name: revision_count, type: integer, source: system, description: "Number of completed revision rounds", default: 0}
      - {name: compensation_credit_cents, type: integer, source: computed, description: "Credit due to the originating station when the piece is licensed; produced by content_compensation_credit"}
  - name: MembershipDrive
    parent: null
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the station running the drive"}
      - {name: drive_name, type: string, source: input, description: "Human-readable drive name"}
      - {name: drive_status, type: enum, source: system, description: "Membership drive lifecycle state", default: PLANNED, constraints: "PLANNED | ACTIVE | CLOSED | REPORTED | SETTLED | CANCELLED"}
      - {name: pledged_cents, type: integer, source: system, description: "Total pledged amount recorded during the active drive", default: 0}
      - {name: collected_cents, type: integer, source: system, description: "Total amount collected during the active drive", default: 0}
      - {name: collection_ratio_bps, type: integer, source: computed, description: "collected_cents / pledged_cents in basis points; 0 when pledged_cents == 0"}
      - {name: drive_close_at, type: datetime, source: input, description: "Instant the drive may be closed"}
      - {name: drive_deduction_cents, type: integer, source: computed, description: "Dues credit the station earns from the drive; produced by drive_dues_deduction"}
  - name: AudienceReport
    parent: null
    common_fields: false
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the reporting station"}
      - {name: fiscal_year, type: integer, source: input, description: "Fiscal year the audience figures cover", constraints: "2024 <= fiscal_year <= 2100"}
      - {name: cume_persons, type: integer, source: input, description: "Weekly cume audience in persons", constraints: ">= 0"}
      - {name: nielsen_share_bps, type: integer, source: input, description: "Reported audience share in basis points", constraints: "0 <= nielsen_share_bps <= 10000"}
      - {name: local_content_hours, type: integer, source: input, description: "Annual local content programming hours", constraints: ">= 0"}
      - {name: reported_at, type: datetime, source: system, description: "Timestamp the report was filed"}
  - name: NationalProgram
    parent: null
    common_fields: true
    fields:
      - {name: program_code, type: string, source: input, description: "Unique national program code", constraints: "unique; pattern ^NP-[0-9]{4}$"}
      - {name: program_title, type: string, source: input, description: "Program title as published to member stations"}
      - {name: strand_type, type: enum, source: input, description: "Editorial strand the program belongs to", constraints: "NEWS | CULTURE | INVESTIGATIVE | MUSIC | TALK"}
      - {name: production_status, type: enum, source: system, description: "Program production lifecycle state", default: DEVELOPMENT, constraints: "DEVELOPMENT | PRODUCTION | SCHEDULED | RUNNING | PUBLISHED | RESCHEDULED | RETIRED"}
      - {name: clearance_required, type: boolean, source: input, description: "True when every carrying window must be cleared before the premiere", default: true}
      - {name: national_premiere_at, type: datetime, source: input, description: "Instant of the national premiere; the anchor for program premiere embargoes"}
      - {name: publication_cycle, type: integer, source: system, description: "Number of completed publication rounds; increments on every PUBLISHED-to-dev rework", default: 0}
      - {name: licensed_contribution_count, type: integer, source: system, description: "Count of Contributions in status LICENSED or USED under this program", default: 0}
      - {name: preliminary_license_credit_cents, type: integer, source: system, description: "Accumulated license-credit mass the archived-program invariant must return to zero", default: 0}
  - name: BoardElection
    parent: null
    common_fields: true
    fields:
      - {name: board_region, type: enum, source: input, description: "Governance region the election fills seats for", constraints: "REGION_NORTHEAST | REGION_SOUTH | REGION_MIDWEST | REGION_WEST"}
      - {name: fiscal_year, type: integer, source: input, description: "Fiscal year of the election cycle", constraints: "2024 <= fiscal_year <= 2100"}
      - {name: election_status, type: enum, source: system, description: "Board election lifecycle state", default: OPEN, constraints: "OPEN | CLOSED | CERTIFIED | CONTESTED | REOPENED | FINALIZED"}
      - {name: cycle_number, type: integer, source: system, description: "Number of completed certification rounds; increments on every CERTIFIED-to-reopened return", default: 0}
      - {name: seats_available, type: integer, source: input, description: "Number of board seats this election fills", constraints: ">= 1"}
      - {name: certification_deadline, type: datetime, source: input, description: "Instant by which the election must be certified"}
  - name: BoardCandidate
    parent: BoardElection
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the station fielding the candidate"}
      - {name: candidate_status, type: enum, source: system, description: "Candidacy lifecycle state", default: FILED, constraints: "FILED | QUALIFIED | ELECTED | DEFEATED | LAPSED | WITHDRAWN"}
      - {name: votes_recorded, type: integer, source: system, description: "Votes recorded for the candidate in the current cycle", default: 0}
      - {name: last_candidacy_cycle, type: datetime, source: system, description: "Timestamp the candidacy last entered FILED; used by the F6 timestamp tie-break"}
      - {name: nomination_statement, type: string, source: input, description: "Candidate's nomination statement"}
  - name: BoardSeat
    parent: null
    common_fields: true
    fields:
      - {name: board_region, type: enum, source: input, description: "Region represented by the seat", constraints: "REGION_NORTHEAST | REGION_SOUTH | REGION_MIDWEST | REGION_WEST"}
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the station holding the seat"}
      - {name: seat_status, type: enum, source: system, description: "Board seat lifecycle state", default: VACANT, constraints: "VACANT | CONTESTED | HOLDOVER | FILLED | RECALLED"}
      - {name: term_start, type: datetime, source: input, description: "Instant the term begins; also the anchor of the fill/deallocate pair"}
      - {name: term_end, type: datetime, source: input, description: "Instant the term ends"}
      - {name: board_rank, type: integer, source: system, description: "Assignment rank used by the board-seat selector; lower value wins", default: 0}
      - {name: carried_credit_cents, type: integer, source: system, description: "Credit mass carried on this seat; the fill/deallocate conserved quantity", default: 0}
      - {name: contribution_deduction_cents, type: integer, source: system, description: "Deduction offloaded onto the seat by the C6 governance cascade", default: 0}
  - name: DuesStructureProposal
    parent: null
    common_fields: true
    fields:
      - {name: fiscal_year, type: integer, source: input, description: "Fiscal year the proposed dues structure would price", constraints: "2024 <= fiscal_year <= 2100"}
      - {name: proposal_status, type: enum, source: system, description: "Proposal lifecycle state", default: DRAFT, constraints: "DRAFT | OPEN | PASSED | ENACTED | REJECTED | TABLED | ENACTMENT_CLOSED"}
      - {name: current_rate_bps, type: integer, source: system, description: "Prevailing network-wide revenue rate the vote will confirm or replace", default: 250}
      - {name: proposed_base_fee_cents, type: integer, source: input, description: "Proposed flat network base fee, in cents", constraints: ">= 0"}
      - {name: proposed_revenue_rate_bps, type: integer, source: input, description: "Proposed revenue rate in basis points", constraints: ">= 0"}
      - {name: quorum_required_votes, type: integer, source: input, description: "Number of eligible station votes needed for quorum", constraints: ">= 1"}
      - {name: eligible_station_count, type: integer, source: system, description: "Number of MemberStations eligible to vote at open time", default: 0}
      - {name: yes_votes, type: integer, source: system, description: "Count of station votes whose recorded weight is yes and current", default: 0}
      - {name: no_votes, type: integer, source: system, description: "Count of station votes whose recorded weight is no and current", default: 0}
      - {name: votes_cast_count, type: integer, source: system, description: "Count of distinct stations with a recorded vote of either choice", default: 0}
      - {name: proposal_cycle, type: integer, source: system, description: "Number of completed enactment rounds; increments on every ENACTED-to-reopened return", default: 0}
      - {name: effective_from, type: datetime, source: input, description: "Instant the enacted dues structure takes effect"}
  - name: StationVote
    parent: DuesStructureProposal
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the voting station"}
      - {name: vote_choice, type: enum, source: input, description: "Recorded vote choice", constraints: "YES | NO"}
      - {name: current_rate_bps, type: integer, source: input, description: "Rate the station observed when casting; used by the supersede/re-vote invariant"}
      - {name: recorded_weight, type: integer, source: system, description: "Weight this vote currently contributes to the tally", default: 1}
      - {name: cast_at, type: datetime, source: system, description: "Timestamp of the most recent vote cast by this station"}
      - {name: vote_status, type: enum, source: system, description: "Lifecycle of this recorded vote row", default: RECORDED, constraints: "RECORDED | SUPERSEDED | INVALIDATED"}
      - {name: superseded_by_vote_id, type: string, source: system, description: "FK -> StationVote.id; the later vote row that superseded this one", default: null}
      - {name: compensated_at, type: datetime, source: system, description: "Timestamp of the last supersede or restore action on this row", default: null}
  - name: ProgrammingFeeAssessment
    parent: null
    common_fields: true
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the assessed station"}
      - {name: schedule_id, type: string, source: input, description: "FK -> ProgrammingFeeSchedule.id; the schedule version the assessment priced against"}
      - {name: fiscal_year, type: integer, source: input, description: "Fiscal year the assessment covers", constraints: "2024 <= fiscal_year <= 2100"}
      - {name: assessment_status, type: enum, source: system, description: "Assessment lifecycle state", default: INITIAL, constraints: "INITIAL | FINALIZED | SUPERSEDED"}
      - {name: provisional_fee_cents, type: integer, source: computed, description: "Output of programming_fee_provisional", default: 0}
      - {name: final_fee_cents, type: integer, source: computed, description: "Output of programming_fee_final_adjusted", default: 0}
      - {name: drive_deduction_cents, type: integer, source: computed, description: "Output of drive_dues_deduction credits applied against this assessment", default: 0}
      - {name: allocated_dues_cents, type: integer, source: computed, description: "Per-station share written by network_dues_pool_allocation", default: 0}
      - {name: total_pot_cents, type: integer, source: input, description: "Fiscal-year dues pool the allocation batches distribute", default: 0}
  - name: DuesVoteEligibilityProjection
    parent: null
    common_fields: false
    fields:
      - {name: station_id, type: string, source: input, description: "FK -> MemberStation.id; the projected station"}
      - {name: fiscal_year, type: integer, source: input, description: "Fiscal year the projection covers", constraints: "2024 <= fiscal_year <= 2100"}
      - {name: dues_vote_eligible, type: boolean, source: system, description: "True only while the station is ELIGIBLE or PROBATION and eligible_from <= clock.now()", default: false}
      - {name: eligible_from, type: datetime, source: system, description: "Instant from which the station counts toward quorum and candidacy", default: null}
      - {name: last_projected_at, type: datetime, source: system, description: "Timestamp the projection was last recomputed", default: null}
state_machines:
  - entity: MemberStation
    initial_state: APPLICANT
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: APPLICANT
        to: UNDER_REVIEW
        trigger: "POST /network/member-stations/{id}/submit-eligibility"
        actor: StationManager
        preconditions: ["station.eligibility_status == APPLICANT", "station.call_sign is non-empty", "station.dma_market_rank is present", "station.annual_local_revenue_cents >= 0"]
        side_effects: ["station.operations_score recomputed by station_operations_score", "station.membership_class recomputed by membership_class_assignment", "a DuesVoteEligibilityProjection row is upserted with station.dues_vote_eligible = false", "station.updated_at refreshed and station.version incremented by 1"]
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /network/member-stations/{id}/record-deficiency"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == UNDER_REVIEW", "station.newsroom_staff_count < 2 or station.full_time_staff_count < 3 or station.coverage_population < 50000"]
        side_effects: ["deficiency detail recorded on the station", "station.updated_at refreshed and station.version incremented by 1"]
      - from: DEFICIENT
        to: REMEDIATION_SUBMITTED
        trigger: "POST /network/member-stations/{id}/remediation"
        actor: StationManager
        preconditions: ["station.eligibility_status == DEFICIENT", "remediated_factors is non-empty"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
      - from: REMEDIATION_SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /network/member-stations/{id}/submit-eligibility"
        actor: StationManager
        preconditions: ["station.eligibility_status == REMEDIATION_SUBMITTED"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
        note: "Closes the DEFICIENT-to-remediation cycle, which is the station-level revision loop"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /network/member-stations/{id}/record-deficiency"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == UNDER_REVIEW", "station.newsroom_staff_count < 2 or station.full_time_staff_count < 3 or station.coverage_population < 50000"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
        note: "Second pass of the review loop after a failed remediation"
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /network/member-stations/{id}/approve-eligibility"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == UNDER_REVIEW", "station.coverage_population >= 50000", "station.full_time_staff_count >= 3", "station.newsroom_staff_count >= 2"]
        side_effects: ["station.membership_class recomputed by membership_class_assignment", "station.operations_score recomputed by station_operations_score", "station.last_review_at = clock.now()", "a ProgrammingFeeAssessment is cascaded with assessment_status = INITIAL on the station for the current fiscal year", "a DuesVoteEligibilityProjection row is upserted with station.dues_vote_eligible = true and station.eligible_from = clock.now()", "station.updated_at refreshed and station.version incremented by 1"]
        note: "Origin of the C1 cascade: eligibility approval mints the assessment that redistributes the schedule's pool share"
      - from: ELIGIBLE
        to: PROBATION
        trigger: "POST /network/member-stations/{id}/probation"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == ELIGIBLE", "reason_code is non-empty"]
        side_effects: ["station.dues_vote_eligible flips to false on the DuesVoteEligibilityProjection row", "every non-terminal BroadcastWindow under any agreement owned by this station becomes clearance_status = VIOLATED", "station.updated_at refreshed and station.version incremented by 1"]
      - from: PROBATION
        to: ELIGIBLE
        trigger: "POST /network/member-stations/{id}/restore-eligibility"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == PROBATION", "station.operations_score >= 55.00"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
        note: "Revert edge of the cyclic station lifecycle"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /network/member-stations/{id}/suspend"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == ELIGIBLE or station.eligibility_status == PROBATION", "suspension_reason is non-empty"]
        side_effects: ["every DuesStructureProposal whose board_region scope includes this station recomputes its quorum denominator because the projection row leaves the eligible set", "station.updated_at refreshed and station.version incremented by 1"]
      - from: PROBATION
        to: SUSPENDED
