              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENTIAL_STATE (account no longer ENROLLED blocks line posting)"
            - "BillingExtract.line_count remains 0 and total_billed_cents remains 0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with DIFFERENT interval semantics.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_half_open_window_overlap
        grounds:
          - validations[priority=11]
          - entities.RateSchedule.fields.period_start
          - state_machines.RateSchedule.PROPOSED_to_ADOPTED
        distinguishing_aspect: |
          Resource: Product's adopted-rate timeline; semantics: half-open intervals
          [start, end) — a new ADOPTED schedule sharing only the boundary instant
          (new.start == existing.end) is LEGAL adjacency, while any interior overlap
          rejects with ERR_UNIQUENESS_CONFLICT.
        test_recipe:
          setup:
            - "Authority FORMING; product P DRAFT with ADOPTED schedule A covering [2026-01-01, 2027-01-01)"
            - "Schedule B covering [2027-01-01, 2028-01-01) — adjacent at the boundary instant"
            - "Schedule C covering [2026-06-01, 2027-06-01) — interior overlap with A"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_a: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_a}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_a}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.55, pcia_rate_cents_per_kwh: 1.60, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_b: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_b}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-06-01T00:00:00Z", period_end: "2027-06-01T00:00:00Z", energy_rate_cents_per_kwh: 11.50, pcia_rate_cents_per_kwh: 1.55, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_c: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_c}/propose"
              payload: {}
              as: RateAnalyst
          trigger:
            - call: "POST /cca/rate-schedules/${rs_b}/adopt"
              payload: {}
              as: BoardDirector
              captures: { st_b: $.data.status }
            - call: "POST /cca/rate-schedules/${rs_c}/adopt"
              payload: {}
              as: BoardDirector
              captures: { err_c: $.data.error_id }
          assert:
            - "Schedule B (adjacent, new.start == A.end) adopts: status == ADOPTED — half-open boundary touch is not an overlap"
            - "Schedule C (interior overlap) adopt returns ERR_UNIQUENESS_CONFLICT"
      - name: supply_contract_window_coverage_gap_semantics
        grounds:
          - calculations.load_forecast_snapshot
          - entities.SupplyContract.fields.delivery_start
          - entities.LoadForecast.fields.coverage_gap_mwh
        distinguishing_aspect: |
          Resource: the supply portfolio against a forecast year; semantics: ANY-overlap
          aggregate capacity — a contract whose delivery window merely clips the year
          boundary (delivery_end == Jan 1 of period_year is EXCLUDED because the window
          is half-open; delivery covering only Dec of period_year counts its FULL
          total_mwh). Different interval treatment than the point-adjacency rule on
          rate schedules: aggregate-capacity inclusion vs pairwise rejection.
        test_recipe:
          setup:
            - "Authority ACTIVE; one ENROLLED account, annual_kwh_estimate 24000 -> total_energy_mwh 24.0"
            - "Contract K_IN: delivery [2027-12-01, 2028-01-01), total_mwh 30 — overlaps period_year 2027, counts fully"
            - "Contract K_OUT: delivery [2026-01-01, 2027-01-01) — delivery_end == 2027-01-01 boundary: EXCLUDED from 2027 coverage (half-open)"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
