            - "Both payloads report stay_state REQUESTED, screening_state CLEARED and risk_tier_at_booking ELEVATED"
            - "The same GET as TrustAdjudicator with X-User-ID adj-1 also returns 200"

      - name: host_cannot_read_another_hosts_property
        claim_type: unauthorized
        grounds:
          - validations.priority_6_ERR_NOT_RESOURCE_OWNER
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "Ownership is enforced within an admitted role: Host B, whose role IS listed on the endpoint, still gets 403 ERR_NOT_RESOURCE_OWNER on Host A's listing — while the very same read succeeds for a Guest, who carries no ownership tie to a listing."
