              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_l: "$.data.id" }
            - call: "POST /change-requests/${cr_l}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
          trigger:
            - call: "POST /releases/${rel_id}/evidence-packets"
              payload: { expected_release_version: "${rel_v0}" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { err: "$.data.error_id" }
            - call: "GET /releases/${rel_id}"
