  - rule_id: boundary_precision_check
    instances:
      - name: program_budget_exact_equality_reserves_down_to_zero
        grounds:
          - calculations.program_budget_reservation
          - validations[priority=70]
          - errors[ERR_PROGRAM_BUDGET_EXHAUSTED]
          - entities.IncentiveProgram.fields.remaining_budget_cents
        distinguishing_aspect: |
          The fiscal comparison is remaining_budget_cents >= award, so an award of exactly 423000 cents
          against a remaining balance of exactly 423000 cents succeeds and drives remaining_budget_cents to 0;
          a strict > comparison would reject this request, and one cent less of budget (422999) would.
