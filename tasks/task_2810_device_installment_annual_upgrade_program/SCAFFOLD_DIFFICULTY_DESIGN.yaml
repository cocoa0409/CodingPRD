            - "UpgradeRequest.${ur_b}.status == ELIGIBILITY_PASSED and eligibility_ratio_bps == 5000"
            - "DeviceModel.${m_a}.reserved_slot_count == 2 (two live reservations on a capacity-1 model, because their windows only touch)"
            - "UpgradeRequest.${ur_a}.status == ELIGIBILITY_PASSED (the incumbent is untouched: it is on a different loan, so nothing is superseded)"
            - "InstallmentLoan.${loan_a}.upgrade_hold_flag == true and InstallmentLoan.${loan_b}.upgrade_hold_flag == true"

      - name: payoff_quote_validity_window_single_occupancy_half_open
        grounds:
          - calculations.payoff_quote
          - validations.priority_59_ERR_PAYOFF_QUOTE_NOT_ISSUED
          - validations.priority_82_ERR_PAYOFF_QUOTE_EXPIRED
          - state_machines.PayoffQuote.status
          - entities.PayoffQuote.fields.expires_at
        distinguishing_aspect: |
          A different resource entity (PayoffQuote against its owning InstallmentLoan) with
          different interval semantics: SINGLE OCCUPANCY per (loan, quote_type) plus a
          half-open validity instant, rather than an aggregate capacity over overlapping
          windows. Two live quotes of the same type may never coexist — issuing q2 on
          2026-08-04 forces q1 into SUPERSEDED even though q1's own validity has six days to
          run — and the [issued_at, expires_at) boundary must be exact in both directions: a
          settlement attempt at exactly expires_at (2026-08-11) is refused, while a quote
          issued at that very instant is immediately usable at that same instant. Closed-
          interval or "expires end of day" implementations accept the 2026-08-11 settlement of
          q2; last-write-wins implementations leave q1 ISSUED and let the customer settle at
          the stale price.
        test_recipe:
          setup:
            - "PRIME customer with an ACTIVE Handset B loan originated 2026-08-01, handset ACTIVATED, 12 installments PAID (PAYMENT 56940), so every EARLY_CANCELLATION quote in this test prices at total_payoff_cents 36659."
