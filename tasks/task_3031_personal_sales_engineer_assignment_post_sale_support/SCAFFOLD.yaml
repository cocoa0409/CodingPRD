  # ---- assignment lifecycle ----
  - method: POST
    path: "/assignments"
    description: "Create a customer-to-engineer assignment in PENDING_ACCEPT, persisting across the account lifetime"
    roles: [SalesEngineerOps, PlatformAdmin]
    code: 201
    input: [customer_id, engineer_id, reason_code, "commission_share_bps?", "effective_until?", expected_customer_version]
    output: Assignment
    side_effects: ["increments Customer.version by 1", "Assignment.sequence set to 1 + max(Assignment.sequence) over the customer's book", "Engineer.active_book_size recomputed for the target engineer"]
  - method: POST
    path: "/assignments/{id}/accept"
    description: "Engineer accepts the assignment, making it the customer's ACTIVE book owner"
    roles: [Engineer]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status -> ACTIVE; assigned_at stamped", "Customer.assigned_engineer_id set; increments Customer.version by 1", "Engineer.active_book_size incremented", "calculations.customer_tech_support_entitlement recomputed on Customer"]
  - method: POST
    path: "/assignments/{id}/decline"
    description: "Engineer declines a pending assignment"
    roles: [Engineer]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status -> ENDED"]
  - method: POST
    path: "/assignments/{id}/end"
    description: "End an active assignment, returning the book and cascading an entitlement downgrade"
    roles: [SalesEngineerOps, PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status -> ENDED", "Customer.assigned_engineer_id -> null; increments Customer.version by 1", "calculations.customer_tech_support_entitlement recomputed", "open SupportTickets with required_entitlement EXTENDED -> ESCALATED", "ServiceCenter.open_ticket_count incremented", "Engineer.active_book_size decremented"]
  - method: POST
    path: "/assignments/{id}/reopen"
    description: "Re-activate an ended assignment under the coverage-overlap rule"
    roles: [SalesEngineerOps, PlatformAdmin]
    code: 200
    input: ["expected_customer_version?"]
    output: Assignment
    side_effects: ["Assignment.status -> ACTIVE; assigned_at restamped; sequence incremented", "Customer.assigned_engineer_id set; increments Customer.version by 1", "Engineer.active_book_size incremented"]
  # ---- customer lifecycle ----
  - method: POST
    path: "/customers/{id}/activate"
    description: "Activate a pending customer account"
    roles: [SalesEngineerOps, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status -> ACTIVE"]
  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend an active customer, ending every open assignment"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status -> PENDING", "every Assignment of the customer with status ACTIVE -> ENDED", "Engineer.active_book_size decremented by 1 for each such Assignment", "Customer.assigned_engineer_id -> null"]
  - method: POST
    path: "/customers/{id}/close"
    description: "Close a customer account terminally"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status -> CLOSED"]
  # ---- quotes ----
  - method: POST
    path: "/quotes"
    description: "Open a consultative quote for an assigned customer"
    roles: [Engineer, SalesEngineerOps]
    code: 201
    input: [customer_id, engineer_id, package_type]
    output: Quote
    side_effects: ["Quote.bundle_ready recomputed", "Quote.dependency_closure_size recomputed"]
  - method: POST
    path: "/quotes/{id}/lines"
    description: "Add a product line to a quote with an optional prerequisite line"
    roles: [Engineer, SalesEngineerOps]
    code: 201
    input: [product_code, "quantity?", "is_anchor?", "requires_line_id?"]
    output: QuoteLine
    side_effects: ["Quote.gross_subtotal_cents recomputed", "Quote.dependency_closure_size recomputed via calculations.quote_dependency_closure_size", "Quote.bundle_ready recomputed"]
  - method: POST
    path: "/quotes/{id}/submit"
    description: "Submit a bundle-ready quote; stores the provisional commission variant"
    roles: [Engineer, SalesEngineerOps]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote.status -> SUBMITTED", "calculations.package_bundle_price_cents recomputed", "calculations.engineer_commission_cents stored with variant provisional"]
  - method: POST
    path: "/quotes/{id}/reserve"
    description: "Reserve a submitted quote of compatible gear; creates one backorder per line"
    roles: [Engineer, SalesEngineerOps]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["Quote.status -> RESERVED; reserved_at stamped", "increments Quote.version by 1", "one Backorder created per QuoteLine with status PREORDER_PENDING", "Quote.bundle_ready recomputed"]
  - method: POST
    path: "/quotes/{id}/reject"
    description: "Reject a submitted quote back to the engineer"
    roles: [SalesEngineerOps]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote.status -> REJECTED", "Quote.bundle_ready recomputed"]
  - method: POST
    path: "/quotes/{id}/amend"
    description: "Return a reserved quote to SUBMITTED for rework, cancelling swept backorders"
    roles: [Engineer]
    code: 200
    input: ["expected_quote_version?"]
    output: Quote
    side_effects: ["Quote.status -> SUBMITTED; reserved_at cleared", "increments Quote.version by 1", "Backorders created by the prior reserve with status ALLOCATION_SWEEP -> CANCELLED"]
  - method: POST
    path: "/quotes/{id}/cancel"
    description: "Cancel a draft or rejected quote"
    roles: [Engineer, SalesEngineerOps]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote.status -> CANCELLED", "increments Quote.version by 1"]
  - method: POST
    path: "/quotes/{id}/reopen"
    description: "Reopen a rejected quote as a draft"
    roles: [Engineer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote.status -> DRAFT", "Quote.bundle_ready recomputed"]
  # ---- instruments: setup and inspection ----
  - method: POST
    path: "/instrument-units"
    description: "Register a serialized instrument unit against a reserved quote line"
    roles: [SetupTechnician, SalesEngineerOps]
    code: 201
    input: [quote_line_id, serial_number, model_code]
    output: InstrumentUnit
  - method: POST
    path: "/instrument-units/{id}/start-setup"
    description: "Begin bench setup for a serialized instrument"
    roles: [SetupTechnician]
    code: 200
    input: []
    output: InstrumentUnit
    side_effects: ["InstrumentUnit.setup_status -> IN_SETUP", "instrument-inspection verdict baseline set to PASS"]
  - method: POST
    path: "/instrument-units/{id}/complete-setup"
    description: "Record bench measurements and store the preliminary inspection verdict"
    roles: [SetupTechnician]
    code: 200
    input: [action_height_mm, relief_mm, intonation_offset_cents]
    output: InstrumentUnit
    side_effects: ["InstrumentUnit.setup_status -> SETUP_COMPLETE", "calculations.instrument_inspection_verdict stored with variant preliminary"]
  - method: POST
    path: "/instrument-units/{id}/record-inspection"
    description: "Record the pre-shipment inspection, storing the final per-instrument documentation verdict"
    roles: [SetupTechnician]
    code: 200
    input: []
    output: InstrumentUnit
    side_effects: ["InstrumentUnit.setup_status -> INSPECTED", "calculations.instrument_inspection_verdict stored with variant final", "InstrumentUnit.modified_since_setup set to false"]
  - method: POST
    path: "/instrument-units/{id}/restart-setup"
    description: "Return a completed or failed instrument to the bench for rework"
    roles: [SetupTechnician]
    code: 200
    input: []
    output: InstrumentUnit
    side_effects: ["InstrumentUnit.setup_status -> IN_SETUP", "InstrumentUnit.inspection_overall reset to PASS", "InstrumentUnit.modified_since_setup set to false"]
  - method: POST
    path: "/instrument-units/{id}/ship"
    description: "Ship an inspected instrument, which finalizes commission attribution"
    roles: [SetupTechnician, SalesEngineerOps]
    code: 200
    input: []
    output: InstrumentUnit
    side_effects: ["InstrumentUnit.setup_status -> SHIPPED; shipped_at stamped", "Customer.purchased_instrument_count recomputed", "calculations.engineer_commission_cents stored with variant final", "Engineer.lifetime_commission_cents recomputed"]
  # ---- warranty ----
  - method: POST
    path: "/warranty-plans"
    description: "Register a free extended warranty plan for a shipped instrument"
    roles: [SalesEngineerOps, SupportAgent]
    code: 201
    input: [customer_id, instrument_unit_id, "term_months?"]
    output: WarrantyPlan
  - method: POST
    path: "/warranty-plans/{id}/activate"
    description: "Activate a pending plan, anchoring the coverage term"
    roles: [SalesEngineerOps]
    code: 200
    input: [starts_on]
    output: WarrantyPlan
    side_effects: ["WarrantyPlan.status -> ACTIVE", "expires_on recomputed", "remaining_repair_rounds recomputed"]
  - method: POST
    path: "/warranty-plans/{id}/void"
    description: "Void a plan, closing every open claim"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WarrantyPlan
    side_effects: ["WarrantyPlan.status -> VOIDED", "WarrantyClaims with status IN {PENDING_ROUTING, ROUTED} -> CLOSED"]
  - method: POST
    path: "/warranty-claims"
    description: "Open a repair claim against a plan and select a service center"
    roles: [SupportAgent]
    code: 201
    input: [warranty_plan_id, reported_fault, service_center_id]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> PENDING_ROUTING", "WarrantyPlan.status -> CLAIM_OPEN"]
  - method: POST
    path: "/warranty-claims/{id}/route"
    description: "Route a claim to its service center under capacity and family-admission checks"
    roles: [SupportAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> ROUTED; routed_at stamped", "ServiceCenter.open_ticket_count incremented", "WarrantyPlan.status -> REPAIR_IN_PROGRESS", "calculations.warranty_service_fee_cents stored with variant provisional"]
  - method: POST
    path: "/warranty-claims/{id}/reopen"
    description: "Pull a routed claim back for re-diagnosis, releasing the center slot"
    roles: [SupportAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> PENDING_ROUTING; routed_at cleared", "ServiceCenter.open_ticket_count decremented", "WarrantyPlan.status -> CLAIM_OPEN"]
  - method: POST
    path: "/warranty-claims/{id}/close"
    description: "Close a repair round, consuming one round and finalizing the service fee"
    roles: [SupportAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> CLOSED; closed_at stamped", "WarrantyPlan.repair_rounds_used incremented and remaining_repair_rounds recomputed", "WarrantyPlan.status -> ACTIVE or EXPIRED", "ServiceCenter.open_ticket_count decremented", "calculations.warranty_service_fee_cents stored with variant final"]
  # ---- tech support ----
  - method: POST
    path: "/support-tickets"
    description: "Open a tech support ticket against the customer's purchase history entitlement"
    roles: [SupportAgent, Anonymous]
    code: 201
    input: [customer_id, subject, channel, service_center_id]
    output: SupportTicket
  - method: POST
    path: "/support-tickets/{id}/triage"
    description: "Triage an open ticket, setting its entitlement requirement"
    roles: [SupportAgent]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["SupportTicket.status -> IN_TRIAGE", "SupportTicket.required_entitlement recomputed"]
  - method: POST
    path: "/support-tickets/{id}/escalate"
    description: "Escalate an extended-entitlement ticket to the service department, appending an escalation ledger row"
    roles: [SupportAgent]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["SupportTicket.status -> ESCALATED; escalated_at and escalated_by stamped", "EscalationLedger row appended with a fresh escalation_seq", "ServiceCenter.open_ticket_count incremented", "SupportTicket.escalation_count incremented"]
  - method: POST
    path: "/support-tickets/{id}/de-escalate"
    description: "Return an escalated ticket to triage, releasing the desk slot"
    roles: [ServiceDepartment]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["SupportTicket.status -> IN_TRIAGE; escalated_at cleared", "EscalationLedger row appended with event_type ESCALATION_WITHDRAWN", "ServiceCenter.open_ticket_count decremented"]
  - method: GET
    path: "/escalation-ledger"
    description: "List escalation ledger rows, filterable by ticket"
    roles: [PlatformAdmin, SupportAgent, ServiceDepartment]
    code: 200
    input: ["support_ticket_id?", "service_center_id?", "limit?", "offset?"]
    output: EscalationLedger[]
  - method: GET
    path: "/escalation-ledger/{id}"
    description: "Fetch one escalation ledger row"
    roles: [PlatformAdmin, SupportAgent, ServiceDepartment]
    code: 200
    input: []
    output: EscalationLedger
  - method: POST
    path: "/support-tickets/{id}/resolve"
    description: "Resolve a ticket in triage or escalation"
    roles: [SupportAgent, ServiceDepartment]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["SupportTicket.status -> RESOLVED"]
  # ---- backorders ----
  - method: POST
    path: "/backorders"
    description: "Place a backorder or preorder claim against a quote line"
    roles: [Engineer, SalesEngineerOps]
    code: 201
    input: [quote_line_id, engineer_id, units_requested, "variant_bps?", preorder_open_at]
    output: Backorder
    side_effects: ["Backorder.alloc_sequence set", "Backorder.eta_deadline recomputed"]
  - method: POST
    path: "/backorders/{id}/start-sweep"
    description: "Begin an allocation sweep under the preorder deadline"
    roles: [SalesEngineerOps]
    code: 200
    input: [pool_units]
    output: Backorder
    side_effects: ["Backorder.status -> ALLOCATION_SWEEP", "calculations.backorder_allocation_units stored with variant preliminary"]
  - method: POST
    path: "/backorders/{id}/finalize-allocation"
    description: "Finalize the waterfall allocation for this backorder, capping at the shared pool"
    roles: [SalesEngineerOps]
    code: 200
    input: [pool_units]
    output: Backorder
    side_effects: ["Backorder.units_filled recomputed via calculations.backorder_allocation_units with variant final", "Backorder.status -> PARTIALLY_FILLED or BOARD_FILLED"]
  - method: POST
    path: "/backorders/{id}/reset-sweep"
    description: "Reset a swept allocation and return the claim to the queue"
    roles: [SalesEngineerOps]
    code: 200
    input: []
    output: Backorder
    side_effects: ["Backorder.units_filled reset to 0", "Backorder.status -> PREORDER_PENDING"]
  - method: POST
    path: "/backorders/{id}/start-receiving"
    description: "Release a filled or partially filled claim into receiving"
    roles: [SalesEngineerOps]
    code: 200
    input: []
    output: Backorder
    side_effects: ["Backorder.status -> RECEIVING"]
  - method: POST
    path: "/backorders/{id}/ship"
    description: "Ship the receiving backorder to the customer"
    roles: [SalesEngineerOps]
    code: 200
    input: []
    output: Backorder
    side_effects: ["Backorder.status -> SHIPPED"]
  - method: POST
    path: "/backorders/{id}/cancel"
    description: "Cancel an unfilled backorder claim"
    roles: [SalesEngineerOps, Engineer]
    code: 200
    input: []
    output: Backorder
    side_effects: ["Backorder.status -> CANCELLED"]
  # ---- gear exchange ----
  - method: POST
    path: "/gear-exchanges"
    description: "Open a trial or return case on a purchased line"
    roles: [SupportAgent]
    code: 201
    input: [quote_line_id, customer_id, reason]
    output: GearExchange
  - method: POST
    path: "/gear-exchanges/{id}/start-trial"
    description: "Start the tone-trial window, storing the provisional restocking fee"
    roles: [SupportAgent]
    code: 200
    input: []
    output: GearExchange
    side_effects: ["GearExchange.status -> TRIAL_ACTIVE; trial_start_date and trial_end_date set", "calculations.gear_exchange_restocking_fee stored with variant provisional"]
  - method: POST
    path: "/gear-exchanges/{id}/request-return"
    description: "Request the exchange: tone mismatches enter the return path, other reasons are denied"
    roles: [SupportAgent]
    code: 200
    input: []
    output: GearExchange
    side_effects: ["GearExchange.status -> RETURN_REQUESTED when reason == TONE_MISMATCH, otherwise DENIED", "calculations.gear_exchange_restocking_fee stored with variant final"]
  - method: POST
    path: "/gear-exchanges/{id}/withdraw-return"
    description: "Withdraw a return request and resume the trial"
    roles: [SupportAgent]
    code: 200
    input: []
    output: GearExchange
    side_effects: ["GearExchange.status -> TRIAL_ACTIVE"]
  - method: POST
    path: "/gear-exchanges/{id}/complete"
    description: "Complete the exchange, crediting the conserved gear-credit balance"
    roles: [SupportAgent]
    code: 200
    input: []
    output: GearExchange
    side_effects: ["GearExchange.status -> EXCHANGED", "calculations.gear_exchange_restocking_fee final recomputed", "Customer.lifetime_gear_credit_cents adjusted by refund_credit_cents and by the restocking fee offset"]
  - method: POST
    path: "/gear-exchanges/{id}/cancel"
    description: "Cancel an in-flight exchange case"
    roles: [SupportAgent]
    code: 200
    input: []
    output: GearExchange
    side_effects: ["GearExchange.status -> CANCELLED"]
  # ---- certification ----
  - method: POST
    path: "/certification-attempts"
    description: "Schedule a product-knowledge assessment for an engineer"
    roles: [SalesEngineerOps]
    code: 201
    input: [engineer_id, product_family, score_pct]
    output: CertificationAttempt
  - method: POST
    path: "/certification-attempts/{id}/grade"
    description: "Grade a scheduled attempt against the 80 percent bar"
    roles: [SalesEngineerOps]
    code: 200
    input: []
    output: CertificationAttempt
    side_effects: ["CertificationAttempt.status -> PASSED or FAILED; assessed_at and expires_at set", "CertificationAttempt.attempt_index and eligible_to_retake recomputed", "Engineer.certified_family_count, Engineer.seniority_tier and Engineer.commission_cap_bps recomputed"]
  - method: POST
    path: "/certification-attempts/{id}/reschedule"
    description: "Reschedule a failed attempt when retake eligibility remains"
    roles: [SalesEngineerOps]
    code: 200
    input: []
    output: CertificationAttempt
    side_effects: ["CertificationAttempt.status -> SCHEDULED", "score_pct cleared"]
  - method: POST
    path: "/certification-attempts/{id}/expire"
    description: "Mark an attempt expired when its certification window lapses"
    roles: [SalesEngineerOps, PlatformAdmin]
    code: 200
    input: []
    output: CertificationAttempt
    side_effects: ["CertificationAttempt.status -> EXPIRED", "Engineer.certified_family_count and seniority_tier recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not permitted by the endpoint's roles list" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "no Customer matches the id path segment" }
  - { id: ERR_ENGINEER_NOT_FOUND, http: 404, condition: "no Engineer matches the id path segment" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "no Quote matches the id path segment" }
  - { id: ERR_INSTRUMENT_UNIT_NOT_FOUND, http: 404, condition: "no InstrumentUnit matches the id path segment" }
  - { id: ERR_WARRANTY_PLAN_NOT_FOUND, http: 404, condition: "no WarrantyPlan matches the id path segment" }
  - { id: ERR_BACKORDER_NOT_FOUND, http: 404, condition: "no Backorder matches the id path segment" }
  - { id: ERR_GEAR_EXCHANGE_NOT_FOUND, http: 404, condition: "no GearExchange matches the id path segment" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "a body-referenced resource (product_code, service_center_id, requires_line_id) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state admitted by the transition's from: set" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "an action is attempted on a resource in a terminal state (SHIPPED, CANCELLED, EXCHANGED, DENIED, RESOLVED, VOIDED, CLOSED)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_BOOK_CAPACITY_EXCEEDED, http: 422, condition: "accepting or reopening the assignment would reach Engineer.max_book_size" }
  - { id: ERR_ASSIGNMENT_COVERAGE_OVERLAP, http: 409, condition: "the requested coverage window overlaps an existing later-sequence assignment interval for the same customer" }
  - { id: ERR_TEMPORARY_COVERAGE_UNTIL_REQUIRED, http: 422, condition: "reason_code TEMPORARY_COVERAGE without effective_until, or a non-temporary reason carrying one" }
  - { id: ERR_COMMISSION_CAP_EXCEEDED, http: 422, condition: "commission_share_bps exceeds the engineer's commission_cap_bps" }
  - { id: ERR_CUSTOMER_ASSIGNMENT_REQUIRED, http: 422, condition: "the customer has no ACTIVE assignment held by the acting engineer" }
  - { id: ERR_DEPENDENCY_CYCLE, http: 422, condition: "requires_line_id edges among a quote's lines form a cycle" }
  - { id: ERR_DEPENDENCY_MISSING, http: 422, condition: "requires_line_id names a line outside the quote, or bundle_ready is false at submit" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 422, condition: "shipping an instrument whose inspection_overall is FAIL, or whose measurements changed after inspection" }
  - { id: ERR_SERIAL_ALREADY_REGISTERED, http: 409, condition: "serial_number already backs another InstrumentUnit" }
  - { id: ERR_REPAIR_ROUNDS_EXHAUSTED, http: 422, condition: "opening a claim on a plan whose remaining_repair_rounds is 0" }
  - { id: ERR_SERVICE_CENTER_CAPACITY_FULL, http: 422, condition: "routing a claim to a center whose open_ticket_count is at capacity_slots" }
  - { id: ERR_SERVICE_CENTER_FAMILY_NOT_ACCEPTED, http: 422, condition: "routing a claim whose product family is not in the center's accepted_families" }
  - { id: ERR_SERVICE_CENTER_SUSPENDED, http: 409, condition: "routing a claim to a suspended service center" }
  - { id: ERR_ENTITLEMENT_REQUIRED, http: 403, condition: "triaging a ticket for a customer whose tech_support_entitlement is NONE" }
  - { id: ERR_ESCALATION_NOT_PERMITTED, http: 422, condition: "escalating a ticket whose required_entitlement is BASIC rather than EXTENDED" }
  - { id: ERR_ESCALATION_DESK_REQUIRED, http: 422, condition: "escalating a ticket that does not name a service_center_id escalation desk" }
  - { id: ERR_SERVICE_CENTER_CAPACITY_FULL_AT_ESCALATION, http: 422, condition: "escalating a ticket whose named service center is already at capacity_slots" }
  - { id: ERR_PREORDER_WINDOW_EXPIRED, http: 409, condition: "starting a sweep after preorder_open_at + 30 days" }
  - { id: ERR_ZERO_ALLOCATION_REQUEST, http: 422, condition: "units_requested == 0 on a backorder, an empty candidate set" }
  - { id: ERR_ALLOCATION_POOL_NEGATIVE, http: 422, condition: "pool_units below zero on a sweep or finalize call" }
  - { id: ERR_TRIAL_WINDOW_EXPIRED, http: 409, condition: "completing or withdrawing a gear exchange after trial_end_date" }
  - { id: ERR_RETURN_REASON_NOT_ELIGIBLE, http: 422, condition: "requesting a return for a reason other than TONE_MISMATCH" }
  - { id: ERR_RETAKE_NOT_ELIGIBLE, http: 422, condition: "rescheduling a failed attempt that already reached attempt_index 3" }
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 400, condition: "a required input field is absent from the request body" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 400, condition: "a field value fails its type or enum constraint (e.g. term_months not in {12,24,36}, score_pct outside 0..100)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Benchmark operator with configuration and override authority over catalog, clock, and terminal state changes"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /products"
      - "POST /service-centers"
      - "POST /warranty-plans/{id}/void"
      - "POST /customers/{id}/suspend"
      - "POST /customers/{id}/close"
      - "POST /certification-attempts/{id}/expire"
    shared_operations:
      - "POST /engineers"
      - "POST /assignments"
      - "POST /assignments/{id}/end"
      - "POST /assignments/{id}/reopen"
      - "POST /customers/{id}/activate"
      - "GET /engineers"
      - "GET /customers"
  - name: SalesEngineerOps
    description: "Inside-sales operations desk that owns assignment flow, allocation sweeps, and certification administration"
    identity: opaque
    exclusive_operations:
      - "POST /quotes/{id}/reject"
      - "POST /warranty-plans"
      - "POST /warranty-plans/{id}/activate"
      - "POST /backorders/{id}/start-sweep"
      - "POST /backorders/{id}/finalize-allocation"
      - "POST /backorders/{id}/reset-sweep"
      - "POST /backorders/{id}/start-receiving"
      - "POST /backorders/{id}/ship"
      - "POST /certification-attempts"
      - "POST /certification-attempts/{id}/grade"
      - "POST /certification-attempts/{id}/reschedule"
    shared_operations:
      - "POST /assignments"
      - "POST /assignments/{id}/end"
      - "POST /assignments/{id}/reopen"
      - "POST /customers/{id}/activate"
      - "POST /quotes"
      - "POST /quotes/{id}/lines"
      - "POST /quotes/{id}/submit"
      - "POST /quotes/{id}/reserve"
      - "POST /quotes/{id}/cancel"
      - "POST /instrument-units"
      - "POST /instrument-units/{id}/ship"
      - "POST /backorders"
  - name: Engineer
    description: "The personal sales engineer who owns a book of customers and authors consultative quotes"
    identity: entity_backed:Engineer
    exclusive_operations:
      - "POST /assignments/{id}/accept"
      - "POST /assignments/{id}/decline"
      - "POST /quotes/{id}/amend"
      - "POST /quotes/{id}/reopen"
    shared_operations:
      - "POST /quotes"
      - "POST /quotes/{id}/lines"
      - "POST /quotes/{id}/submit"
      - "POST /quotes/{id}/reserve"
      - "POST /quotes/{id}/cancel"
      - "POST /backorders"
      - "POST /backorders/{id}/cancel"
      - "GET /engineers/{id}"
      - "GET /customers/{id}"
      - "GET /quotes/{id}"
      - "GET /quotes/{id}/summary"
      - "GET /backorders"
  - name: SetupTechnician
    description: "Bench technician who performs guitar setup, inspection, and shipment with per-instrument documentation"
    identity: opaque
    exclusive_operations:
      - "POST /instrument-units/{id}/start-setup"
      - "POST /instrument-units/{id}/complete-setup"
      - "POST /instrument-units/{id}/record-inspection"
      - "POST /instrument-units/{id}/restart-setup"
    shared_operations:
      - "POST /instrument-units"
      - "POST /instrument-units/{id}/ship"
      - "GET /instrument-units/{id}"
  - name: SupportAgent
    description: "Post-sale support agent who administers warranty claims, service routing, tech-support tickets, and gear exchanges"
    identity: opaque
    exclusive_operations:
      - "POST /warranty-claims"
      - "POST /warranty-claims/{id}/route"
      - "POST /warranty-claims/{id}/reopen"
      - "POST /warranty-claims/{id}/close"
      - "POST /support-tickets/{id}/triage"
      - "POST /support-tickets/{id}/escalate"
      - "POST /gear-exchanges"
      - "POST /gear-exchanges/{id}/start-trial"
      - "POST /gear-exchanges/{id}/request-return"
      - "POST /gear-exchanges/{id}/withdraw-return"
      - "POST /gear-exchanges/{id}/complete"
      - "POST /gear-exchanges/{id}/cancel"
    shared_operations:
      - "POST /warranty-plans"
      - "POST /support-tickets"
      - "POST /support-tickets/{id}/resolve"
      - "GET /warranty-plans"
      - "GET /warranty-claims"
      - "GET /support-tickets"
      - "GET /gear-exchanges"
  - name: ServiceDepartment
    description: "Escalation desk that owns escalated technical tickets"
    identity: opaque
    exclusive_operations:
      - "POST /support-tickets/{id}/resolve"
      - "POST /support-tickets/{id}/de-escalate"
    shared_operations:
      - "GET /support-tickets/{id}"
      - "GET /support-tickets"
      - "GET /warranty-claims"
      - "GET /escalation-ledger"
  - name: Anonymous
    description: "Unauthenticated caller that may self-register a customer account and open a first-contact ticket"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
    shared_operations:
      - "POST /support-tickets"
      - "GET /products"