      trigger:
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${c}
          choice: AYE
        as: BoardChair
        as_user_id: ${c}
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d1}
          choice: AYE
        as: BoardDirector
        as_user_id: ${d1}
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d2}
          choice: AYE
        as: BoardDirector
        as_user_id: ${d2}
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d3}
          choice: AYE
        as: BoardDirector
        as_user_id: ${d3}
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d4}
          choice: AYE
        as: BoardDirector
        as_user_id: ${d4}
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d5}
          choice: NAY
        as: BoardDirector
        as_user_id: ${d5}
      - call: POST /boardgov/motions/${mo}/close_voting
        payload: {}
        as: BoardChair
        as_user_id: ${c}
        captures:
          mo_status: $.data.status
          mo_req: $.data.required_votes
      assert:
      - captured mo_req == 5 (active_count 6 >= ceil(0.75*8)=6 -> basis 6 -> max(2, ceil(0.67*6)=5))
      - captured mo_status == PASSED (5 AYE >= 5; equality passes)
      - BylawsAmendment.${am}.status == ADOPTED (cascade link 1 from the motion close)
      - 'GET /boardgov/bylaws?nonprofit_id shows: base bylaws SUPERSEDED and a new ADOPTED bylaws with version_no == 2 and quorum_pct == 60'
  - name: renewal_fee_nested_rounding_order
    grounds:
    - calculations.registration_renewal_fee
    - state_machines.StateRegistration.LAPSED_to_REGISTERED
    distinguishing_aspect: 'Mode (b) — nested rounding where the pinned order decides the cents: LAPSED reinstatement with

      contributions 50,123,456 computes surcharge = ceil(123,456/100,000)*1,000 = 2,000 FIRST, then

      late fee = round_half_up(0.10 * (50,000 + 2,000)) = 5,200 on the rounded subtotal, total 57,200;

      rounding the late fee on unrounded components (or applying it before the surcharge) yields a

      different figure (56,100-style or 57,193 variants), so the pin is observable.

      '
    test_recipe:
      setup:
      - Org with one CA registration whose current_period_end 2026-07-01T00:00:00Z is already past the default clock 2026-08-01 -> swept to LAPSED
      setup_api_calls:
