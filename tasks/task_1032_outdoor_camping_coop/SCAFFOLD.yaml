    path: "/coop/trade-ins"
    description: "List trade-ins; filter by member_id and/or gear_sku_id (FK reverse-reachability)"
    roles: [Member, StoreStaff]
    code: 200
    input: ["member_id?", "gear_sku_id?", "status?", "limit?", "offset?"]
    output: TradeIn[]
    side_effects: []

  - method: POST
    path: "/coop/trade-ins/{id}/appraise"
    description: "Staff appraisal; SUBMITTED->OFFERED or COUNTERED->OFFERED (re-appraisal round). Sets appraised_value_cents."
    roles: [StoreStaff]
    code: 200
    input: [appraised_value_cents]
    output: TradeIn
    side_effects: ["status SUBMITTED|COUNTERED -> OFFERED", "recompute instant_credit_cents & consignment_estimate_cents"]

  - method: POST
    path: "/coop/trade-ins/{id}/respond"
    description: "Member response to an offer: ACCEPT, COUNTER (with counter_cents), or REJECT"
    roles: [Member]
    code: 200
    input: [action, "counter_cents?"]
    output: TradeIn
    side_effects: ["ACCEPT: INSTANT_CREDIT posts payout to wallet; CONSIGNMENT -> LISTED", "COUNTER: OFFERED->COUNTERED, record member_counter_cents", "REJECT: OFFERED->REJECTED"]

  - method: POST
    path: "/coop/trade-ins/{id}/sell"
    description: "Complete a consignment resale; posts payout_cents = round(resale_price_cents*0.65) to the member"
    roles: [StoreStaff]
    code: 200
    input: [resale_price_cents]
    output: TradeIn
    side_effects: ["LISTED->SOLD", "set resale_price_cents & payout_cents", "Member.store_credit_cents += payout_cents"]

  # ------------------------------- Class/Trip
