          assert:
            - "All three trigger calls: HTTP status == 403 and data.error_id == ERR_UNAUTHORIZED"
            - "ReviewCase.${case_id}.state == QUEUED and assigned_analyst_id == null"
            - "Analyst.${an1_id}.open_case_count == 0 and version == 1"
            - "PolicyException.${exc_id}.state == REQUESTED"
            - "Customer.${cust_id}.version == ${cust_v} (unchanged)"

      - name: resolve_is_shared_between_risk_analyst_and_review_lead
        claim_type: shared_operations
        grounds:
          - roles.RiskAnalyst.shared_operations
          - roles.ReviewLead.shared_operations
          - endpoints[POST /fraud/review-cases/{id}/resolve]
        distinguishing_aspect: "resolve is the one shared write across the two entity-backed roles, but the sharing is asymmetric: a ReviewLead may resolve a case assigned to someone else, whereas a RiskAnalyst is owner-scoped — the same request body succeeds for the lead on AN1's case."
        test_recipe:
          setup:
            - "BOOT-W plus two REVIEW assessments producing cases C1 and C2 (both BEHAVIORAL, blended 50.00, amount 20000)."
            - "AN1 (SENIOR, [BEHAVIORAL], capacity 2) holds C1; LEAD1 (LEAD, [BEHAVIORAL], capacity 3) holds C2."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/analysts"
              payload: { display_name: "LEAD1", seniority: "LEAD", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 3 }
