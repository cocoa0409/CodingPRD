      - name: corner_stale_encounter_version_on_abn_issue_rejected
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules.abn-issue-stale-encounter
          - errors[ERR_STALE_ENCOUNTER_VERSION]
          - endpoints[POST /dme/encounters/{id}/abn-notices]
          - entities.DispenseEncounter.version
        distinguishing_aspect: |
          The second concurrency rule guards a DIFFERENT parent with a different
          field, and it exists because issuing a notice silently voids every
          earlier ISSUED notice on the encounter -- a destructive write that must
          not proceed from a stale view. The bump that invalidates the
          coordinator's read here comes from a completely unrelated actor: a
          supervising physician's IOAS attestation, which touches nothing
          financial yet still advances DispenseEncounter.version, so the
          coordinator's stored integer no longer matches. The successful issue
          then advances the version again, so replaying the same request is
          refused a second time.
        test_recipe:
          setup:
            - "one SPINE clinic with two group physicians, a patient, and an OFF_SHELF_PREFAB product with cash_price_cents 11765"
            - "one encounter for 1 unit, documented by its ordering physician and verified as NOT covered, so the financial dimension is NON_COVERED and an ABN is due"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "Notice Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Hal Prine", npi: "1700000481", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Isa Munn", npi: "1700000482", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_b_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Odi Vale", dob: "1963-09-09", payer_type: "COMMERCIAL", member_id: "CM-481", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { product_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${product_id}", ordering_physician_id: "${phys_a_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id, enc_v_created: $.data.version }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_a_id}"
              captures: { enc_v_noted: $.data.version }
            - call: "POST /dme/encounters/${enc_id}/coverage-verifications"
              payload: { covered: false, deductible_remaining_cents: 0, coinsurance_pct: 0.0, valid_for_days: 30 }
              as: InsuranceCoordinator
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: InsuranceCoordinator
              captures: { enc_v_read: $.data.version, enc_financial_read: $.data.financial_status }
          trigger:
            - call: "POST /dme/encounters/${enc_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_b_id}"
              captures: { enc_v_attested: $.data.version, enc_financial_attested: $.data.financial_status }
            - call: "POST /dme/encounters/${enc_id}/abn-notices"
              payload: { reason_non_covered: "NON_COVERED_ITEM", expected_encounter_version: "${enc_v_read}" }
              as: InsuranceCoordinator
              captures: { err_stale: $.data.error_id }
            - call: "POST /dme/encounters/${enc_id}/abn-notices"
              payload: { reason_non_covered: "NON_COVERED_ITEM", expected_encounter_version: "${enc_v_read} - 1" }
              as: InsuranceCoordinator
              captures: { err_older: $.data.error_id }
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: InsuranceCoordinator
              captures: { enc_v_refreshed: $.data.version, enc_financial_refreshed: $.data.financial_status }
            - call: "POST /dme/encounters/${enc_id}/abn-notices"
              payload: { reason_non_covered: "NON_COVERED_ITEM", expected_encounter_version: "${enc_v_refreshed}" }
              as: InsuranceCoordinator
              captures: { abn_id: $.data.id, abn_seq: $.data.notice_seq, abn_status: $.data.status, abn_total: $.data.estimated_cost_cents }
            - call: "POST /dme/encounters/${enc_id}/abn-notices"
              payload: { reason_non_covered: "NON_COVERED_ITEM", expected_encounter_version: "${enc_v_refreshed}" }
              as: InsuranceCoordinator
              captures: { err_replay: $.data.error_id }
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: InsuranceCoordinator
              captures: { enc_v_final: $.data.version, enc_financial_final: $.data.financial_status }
          assert:
            - "${enc_v_created} == 1, ${enc_v_noted} == 2 and ${enc_v_read} == 3 with ${enc_financial_read} == NON_COVERED"
            - "${enc_v_attested} == 4 while ${enc_financial_attested} == NON_COVERED: an attestation changes no financial state yet still advances the guarded version"
            - "${err_stale} == ERR_STALE_ENCOUNTER_VERSION with HTTP 412: the coordinator's read was invalidated by a write they had no reason to expect"
            - "${err_older} == ERR_STALE_ENCOUNTER_VERSION with HTTP 412"
            - "${enc_v_refreshed} == 4 and ${enc_financial_refreshed} == NON_COVERED: neither 412 mutated the encounter"
            - "no notice was created by the refusals: GET /dme/encounters/${enc_id}/abn-notices returns total_count 0 at that point"
            - "the re-read version succeeds: ${abn_seq} == 1, ${abn_status} == ISSUED and ${abn_total} == 14265 (11765 + the 2500 dispensing fee)"
            - "${err_replay} == ERR_STALE_ENCOUNTER_VERSION: the successful issue bumped the encounter to version 5, so the coordinator's number is stale again and the second notice that would have voided the first is refused"
            - "${enc_v_final} == 5, ${enc_financial_final} == ABN_ISSUED and GET /dme/encounters/${enc_id}/abn-notices returns total_count 1"

