            - "${tot1} == 1148500 (1000000 + 140000 + 8500)"
            - "${bps2} == 1200 and ${prem2} == 120000 - one cent past the bound reprices the entire amount at the lower rate"
            - "${tot2} == 1128501 (1000001 + 120000 + 8500)"
            - "${prem2} < ${prem1} by 20000 cents even though the hammer is 1 cent higher, and ${tot2} < ${tot1} by 19999 cents"
            - "SaleOrder.${so1}.hammer_price_cents == 1000000 and SaleOrder.${so2}.hammer_price_cents == 1000001"
