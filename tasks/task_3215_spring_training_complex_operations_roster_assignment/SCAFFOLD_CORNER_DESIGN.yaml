# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3215_spring_training_complex_operations_roster_assignment
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Every claim the surface declares
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Sections and claim_type names come verbatim from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: complex_create_returns_every_declared_field_and_starts_normal
        claim_type: Creation
        grounds:
          - entities.Complex
          - endpoints.POST_/camp-ops/complexes
        distinguishing_aspect: "A complex created with only its five input fields comes back 201 with facility_posture NORMAL, field_maintenance_status OPEN, maintenance_block_units 0, posted_occupancy_units 0 and posture_sweep_index 0 — none of the derived fields is client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Complex.${cx}.name == \"Cubs Mesa Complex\" and host_city == \"Mesa\""
            - "Complex.${cx}.season_split_track == DEDICATED and timezone == America/Phoenix"
            - "Complex.${cx}.facility_posture == NORMAL and field_maintenance_status == OPEN"
            - "Complex.${cx}.maintenance_block_units == 0 and posted_occupancy_units == 0"
            - "Complex.${cx}.version == 1 and id, created_at and updated_at are non-null"

      - name: player_get_round_trips_every_stored_field
        claim_type: Retrieval
        grounds:
          - entities.Player
          - endpoints.GET_/camp-ops/players/{playerId}
        distinguishing_aspect: "Every Player field posted at create round-trips through GET unchanged, including the zero-defaulted mlb_service_days and minor_league_option_years_used when they are omitted."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex exists."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Hector Villalobos", idp_number: "IDP-60101", position_code: "C", acquisition_channel: "TRADE", home_country: "Venezuela", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
          trigger:
            - call: "GET /camp-ops/players/${pl}"
              payload: {}
              as: RosterManager
          assert:
            - "the response status is 200 and response_type is object"
            - "Player.${pl}.full_name == \"Hector Villalobos\" and idp_number == \"IDP-60101\""
            - "Player.${pl}.position_code == C and acquisition_channel == TRADE"
            - "Player.${pl}.mlb_service_days == 0 and minor_league_option_years_used == 0 because both defaulted"
            - "Player.${pl}.clearance_status == PENDING"
            - "Player.${pl}.home_country == \"Venezuela\" and home_complex_id == ${cx}"

      - name: players_list_paginates_and_counts_the_whole_filtered_set
        claim_type: Listing
        grounds:
          - endpoints.GET_/camp-ops/players
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three players on file, limit 2 offset 0 returns two rows with total_count 3 and has_more true, and offset 2 returns the remaining row with has_more false; the total_count counts the filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex and three players."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Page One", idp_number: "IDP-60201", position_code: "INF", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
            - call: "POST /camp-ops/players"
              payload: { full_name: "Page Two", idp_number: "IDP-60202", position_code: "OF", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
            - call: "POST /camp-ops/players"
              payload: { full_name: "Page Three", idp_number: "IDP-60203", position_code: "DH", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
          trigger:
            - call: "GET /camp-ops/players?limit=2&offset=0"
              payload: {}
              as: RosterManager
            - call: "GET /camp-ops/players?limit=2&offset=2"
              payload: {}
              as: RosterManager
          assert:
            - "the first page returns 2 rows with total_count 3 and has_more true"
            - "the second page returns 1 row with total_count 3 and has_more false"
            - "response_type is array on both pages and each row carries id, created_at and updated_at"
            - "the default limit is 10 and the default offset is 0 when the query string omits them"

      - name: unknown_complex_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints.GET_/camp-ops/complexes/{complexId}
        distinguishing_aspect: "A GET for a well-formed but unresolvable complex id returns 404 with ERR_RESOURCE_NOT_FOUND rather than an empty object, and the same error id covers a child addressed under the wrong parent."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /camp-ops/complexes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplexDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "the error_id is ERR_RESOURCE_NOT_FOUND"
            - "meta.api_request_id and meta.api_request_timestamp are present on the error response"

      - name: player_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=29]
          - endpoints.POST_/camp-ops/players
        distinguishing_aspect: "Omitting idp_number from a player create returns 400 with ERR_INVALID_REQUEST and creates no row, so an absent required field is rejected before any uniqueness or referral check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex exists."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /camp-ops/players"
              payload: { full_name: "No Idp", position_code: "OF", acquisition_channel: "DRAFT_PICK", home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and response_type is error"
            - "the error_id is ERR_INVALID_REQUEST"
            - "a follow-up GET on the players list returns total_count 0"

      - name: omitting_player_optional_fields_applies_the_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Player.fields.mlb_service_days
          - entities.Player.fields.minor_league_option_years_used
          - entities.Complex.fields.season_split_track
        distinguishing_aspect: "Omitting mlb_service_days, minor_league_option_years_used and season_split_track applies 0, 0 and SHARED respectively, so the declared defaults are the values the server writes rather than the values the client observes as null."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /camp-ops/complexes"
              payload: { name: "Default Complex", host_city: "Mesa", timezone: "America/Phoenix", facility_capacity_units: 50 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Default Player", idp_number: "IDP-60301", position_code: "P", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
          assert:
            - "Complex.${cx}.season_split_track == SHARED because the default applies"
            - "Player.${pl}.mlb_service_days == 0 and minor_league_option_years_used == 0"
            - "Player.${pl}.clearance_status == PENDING"

      - name: complex_posture_and_occupancy_are_computed_never_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.Complex.fields.posted_occupancy_units
          - entities.Complex.fields.facility_posture
          - endpoints.POST_/camp-ops/complexes
        distinguishing_aspect: "A create that attempts to post posted_occupancy_units, facility_posture and maintenance_block_units is rejected as an unknown field, and the server-computed values are the ones returned."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /camp-ops/complexes"
              payload: { name: "Computed Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 120, posted_occupancy_units: 999, facility_posture: "CLOSED", maintenance_block_units: 77 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /camp-ops/complexes"
              payload: { name: "Computed Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 120 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          assert:
            - "the attempt to supply computed fields is rejected with status 400 and error_id ERR_INVALID_REQUEST"
            - "Complex.${cx}.posted_occupancy_units == 0 and maintenance_block_units == 0"
            - "Complex.${cx}.facility_posture == NORMAL regardless of any client-supplied value"

      - name: id_created_at_and_updated_at_are_server_minted_and_ignore_input
        claim_type: System Fields
        grounds:
          - entities.Player.fields.id
          - endpoints.POST_/camp-ops/players
        distinguishing_aspect: "A client-supplied id and created_at are ignored and the response carries a server-minted UUID plus a server-stamped timestamp, with version starting at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex exists."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /camp-ops/players"
              payload: { full_name: "System Fields", idp_number: "IDP-60401", position_code: "P", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}", id: "client-supplied-id", created_at: "2000-01-01T00:00:00.000Z" }
              as: RosterManager
              captures: { err: "$.data.error_id" }
          assert:
            - "the create is rejected with ERR_INVALID_REQUEST because id and created_at are not declared inputs"
            - "a create without them returns a server-minted UUID id that is not client-supplied"
            - "created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "version starts at 1"

      - name: invalid_position_code_and_negative_option_years_are_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Player.fields.position_code
          - entities.Player.fields.minor_league_option_years_used
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An undeclared position_code and a minor_league_option_years_used of 4 are both rejected by the same structural guard with ERR_INVALID_REQUEST rather than silently coerced."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex exists."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /camp-ops/players"
              payload: { full_name: "Bad Position", idp_number: "IDP-60501", position_code: "GOALKEEPER", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 4, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id is ERR_INVALID_REQUEST"
            - "no Player row is created for idp_number IDP-60501"

      - name: roster_records_are_discovered_through_both_reverse_reachability_forms
        claim_type: Parent Relationships
        grounds:
          - entities.PlayerRosterRecord.fields.player_id
          - endpoints.GET_/camp-ops/players/{playerId}/roster-records
          - endpoints.GET_/camp-ops/roster-records
        distinguishing_aspect: "The same roster record is reachable as a nested sub-resource under its player and as a filtered child collection keyed on player_id, and both forms return the same single row."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex and one player with an open roster record."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Reverse Lookup", idp_number: "IDP-60601", position_code: "P", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
              captures: { rr: $.data.id }
          trigger:
            - call: "GET /camp-ops/players/${pl}/roster-records"
              payload: {}
              as: RosterManager
            - call: "GET /camp-ops/roster-records?player_id=${pl}"
              payload: {}
              as: RosterManager
          assert:
            - "both GETs return response_type array with exactly one element"
            - "the single element has id ${rr} in both responses"
            - "PlayerRosterRecord.${rr}.player_id == ${pl} and current_roster_status == NRI"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: workout_group_create_starts_in_forming
        claim_type: Initial State
        grounds:
          - state_machines.WorkoutGroup.initial_state
          - endpoints.POST_/camp-ops/complexes/{complexId}/workout-groups
        distinguishing_aspect: "A newly created workout group is always FORMING with assigned_units 0, never PUBLISHED, and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg: $.data.id }
          assert:
            - "WorkoutGroup.${wg}.group_status == FORMING"
            - "WorkoutGroup.${wg}.assigned_units == 0"
            - "WorkoutGroup.${wg}.assignment_group_tag == PITCHERS_GROUP_A"
            - "WorkoutGroup.${wg}.version == 1"

      - name: disbanding_an_already_disbanded_group_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WorkoutGroup.terminal_states
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/camp-ops/workout-groups/{groupId}/disband
        distinguishing_aspect: "DISBANDED is terminal, so a second disband of the same group returns 409 ERR_INVALID_STATE and no second round of assignment withdrawal fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex with one FORMING group."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg: $.data.id }
            - call: "POST /camp-ops/workout-groups/${wg}/disband"
              payload: {}
              as: ComplexDirector
          trigger:
            - call: "POST /camp-ops/workout-groups/${wg}/disband"
              payload: {}
              as: ComplexDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id is ERR_INVALID_STATE"
            - "WorkoutGroup.${wg}.group_status is unchanged at DISBANDED"
            - "Complex.${cx}.posted_occupancy_units remains 0"

      - name: confirming_a_scheduled_participation_executes_the_declared_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.GameParticipation.transitions.SCHEDULED_to_CONFIRMED
          - endpoints.POST_/camp-ops/games/{gameId}/participations/{participationId}/confirm
        distinguishing_aspect: "A successful confirm flips the participation to CONFIRMED and bumps the parent GameSchedule version by exactly one, so the declared ledger-sync side effect is observable on the parent."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One complex with a published HOME game and one cleared domestic position player on a scheduled participation."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Side Effect Sam", idp_number: "IDP-60701", position_code: "OF", acquisition_channel: "DRAFT_PICK", mlb_service_days: 0, minor_league_option_years_used: 0, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/program-profile"
              payload: { player_id: "${pl}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl}/camp-invitations"
              payload: { player_id: "${pl}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
            - call: "POST /camp-ops/players/${pl}/physicals"
              payload: { player_id: "${pl}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph: $.data.id }
            - call: "POST /camp-ops/physicals/${ph}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/complexes/${cx}/games"
              payload: { complex_id: "${cx}", opponent_name: "Colorado Rockies", home_away: "HOME", game_datetime: "2026-02-12T19:00:00Z", travel_radius_miles: 0, duration_units: 3, split_squad: false }
              as: ComplexDirector
              captures: { gm: $.data.id, gm_v: $.data.version }
            - call: "POST /camp-ops/games/${gm}/publish"
              payload: { expected_game_version: "${gm_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/games/${gm}/participations"
              payload: { game_schedule_id: "${gm}", player_id: "${pl}", squad_side: "HOME_SQUAD", throw_count: 0 }
              as: FieldCoordinator
              captures: { gp: $.data.id }
          trigger:
            - call: "POST /camp-ops/games/${gm}/participations/${gp}/confirm"
              payload: { expected_game_version: "${gm_v}" }
              as: FieldCoordinator
              captures: { gp2: $.data.id, gm_v2: $.data.version }
          assert:
            - "GameParticipation.${gp}.participation_status == CONFIRMED"
            - "GameSchedule.${gm}.version == ${gm_v} + 1"
            - "GameSchedule.${gm}.game_schedule_status is unchanged at PUBLISHED"

      - name: closed_away_game_is_terminal_for_further_field_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GameSchedule.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal for GameSchedule, so publishing, reverting or recording a result on a cancelled game is refused rather than silently accepted."
        test_recipe:
