scenario: |
  343. Vehicle Safety & Emissions Inspection Station: appointment/walk-in, inspection
  checklist by class, emissions (OBD-II) test & result, pass/fail & reinspection,
  certificate/sticker issuance, waiver/repair-cost limit, state reporting, fee

domain_name: vehicle-safety-emissions-inspection
api_prefix: "/"

# Expert tier (§0.4). Density over volume: a compliance/audit pipeline whose
# inspection records gate certificate issuance, whose reinspection loop is a true
# cycle, whose waiver eligibility is a fiscal threshold over a repair-cost ledger
# computed two ways, and whose lane scheduling is a temporal-overlap engine with
# two distinct interval semantics.
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # repair-cost basis: documented vs estimated
    - rate_threshold_triggers         # waiver repair-cost limit, emissions PASS thresholds
    - cascading_side_effects          # fail -> certificate void -> sticker revoke -> reinspection seed
    - optimistic_concurrency          # certificate issuance / state-batch submission OCC on parent version

  entity_topology: flat
  # Peer entities linked by FK references; no deep URL nesting. InspectionRecord is
  # the hub; Appointment, ChecklistResult, EmissionsTest, Certificate, RepairOrder,
  # WaiverRequest, StateReportLine reference it by FK. Lane + VehicleClassProfile +
  # Station are configuration peers.

  state_machine_shape: cyclic
  # InspectionRecord: IN_PROGRESS -> {PASSED, FAILED}; FAILED -> IN_PROGRESS (reinspect)
  # is a genuine revision loop bounded by a reinspection counter. Certificate carries
  # a parallel ACTIVE/VOID dimension driven by the record. StateReportBatch is a
  # branching submit/accept/reject machine.

  relationship_patterns:
    - one_to_many       # InspectionRecord -> ChecklistResult, RepairOrder, StateReportLine
    - cross_aggregate   # Certificate.record_id, WaiverRequest.record_id span aggregates
    - self_referential  # InspectionRecord.original_record_id (reinspection chain)

  role_model: peer_roles
  # Inspector performs checklist + emissions + pass/fail; StationManager issues
  # certificates, approves waivers, submits state batches; Receptionist books
  # appointments / opens walk-ins; StateAuditor (opaque) accepts/rejects batches.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Inspection station legal name.
      - name: state_code
        type: string
        source: input
        description: Two-letter jurisdiction code that governs which rules apply (e.g., "CA").
        constraints: Exactly 2 uppercase letters.
      - name: certificate_serial_prefix
        type: string
        source: input
        description: Prefix stamped onto every Certificate serial minted by this station.
      - name: next_certificate_seq
        type: integer
        source: system
        description: Monotonic counter; the next Certificate serial uses this value, then it increments by 1.
        default: 1
      - name: repair_cost_limit_cents
        type: integer
        source: input
        description: >-
          Jurisdiction repair-cost limit. A vehicle that fails emissions becomes waiver-eligible
          only when its qualifying repair spend reaches this limit (see compute_qualifying_repair_spend).
        constraints: Positive integer.
      - name: analyzer_count
        type: integer
        source: input
        description: >-
          Number of OBD-II analyzer units the station owns. At any instant at most this many
          AnalyzerReservation windows may overlap (aggregate-capacity overlap semantics).
        default: 1
        constraints: Integer >= 1.

  - name: VehicleClassProfile
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station this class profile belongs to."
      - name: vehicle_class
        type: enum
        source: input
        description: Vehicle class this profile configures.
        constraints: One of {PASSENGER, LIGHT_TRUCK, HEAVY_DUTY, MOTORCYCLE}.
      - name: base_fee_cents
        type: integer
        source: input
        description: Base safety-inspection fee for this class, in cents.
        constraints: Positive integer.
      - name: obd_required
        type: boolean
        source: input
        description: Whether an OBD-II emissions test is part of the checklist for this class.
      - name: checklist_item_count
        type: integer
        source: input
        description: Number of safety checklist items that MUST each be recorded before a pass/fail decision.
        constraints: Integer >= 1.
      - name: reinspection_window_days
        type: integer
        source: input
        description: Days after the original inspection during which the first reinspection's service fee is waived.
        default: 30
        constraints: Integer >= 0.

  - name: Lane
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station this lane belongs to."
      - name: lane_number
        type: integer
        source: input
        description: Human-facing lane identifier, unique within a station.
        constraints: Integer >= 1; unique per station_id.
      - name: supports_obd
        type: boolean
        source: input
        description: Whether this lane is equipped for OBD-II emissions testing.
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: >-
          Mandatory clean-down gap enforced AFTER each appointment on this lane before
          the next appointment may start (see Appointment overlap semantics).
        default: 0
        constraints: Integer >= 0.

  - name: AnalyzerReservation
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station whose shared OBD analyzer pool this reservation draws from."
      - name: vehicle_vin
        type: string
        source: input
        description: 17-character VIN this analyzer window is held for.
        constraints: Exactly 17 alphanumeric characters, uppercase.
      - name: window_start
        type: datetime
        source: input
        description: Reservation window start (ISO 8601 UTC). Closed-start interval.
      - name: window_end
        type: datetime
        source: input
        description: Reservation window end (ISO 8601 UTC), exclusive (half-open [start, end)).
        constraints: Must be strictly after window_start.
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        default: HELD
        constraints: One of {HELD, RELEASED}.

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; the lane reserved for this appointment."
      - name: vehicle_vin
        type: string
        source: input
        description: 17-character vehicle identification number.
        constraints: Exactly 17 alphanumeric characters, uppercase.
      - name: vehicle_class
        type: enum
        source: input
        description: Declared vehicle class; must match a VehicleClassProfile at the lane's station.
        constraints: One of {PASSENGER, LIGHT_TRUCK, HEAVY_DUTY, MOTORCYCLE}.
      - name: kind
        type: enum
        source: input
        description: Whether this was pre-booked or created on arrival.
        constraints: One of {APPOINTMENT, WALK_IN}.
      - name: scheduled_start
        type: datetime
        source: input
        description: Reserved slot start (ISO 8601 UTC). Half-open interval [start, end).
      - name: scheduled_end
        type: datetime
        source: input
        description: Reserved slot end (ISO 8601 UTC), exclusive.
        constraints: Must be strictly after scheduled_start.
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        default: BOOKED
        constraints: One of {BOOKED, CHECKED_IN, CONSUMED, CANCELLED, NO_SHOW}.

  - name: InspectionRecord
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the appointment consumed to open this record."
      - name: station_id
        type: string
        source: computed
        description: "FK -> Station.id; copied from the appointment's lane's station at creation."
      - name: vehicle_vin
        type: string
        source: computed
        description: Copied from the appointment.
      - name: vehicle_class
        type: enum
        source: computed
        description: Copied from the appointment.
        constraints: One of {PASSENGER, LIGHT_TRUCK, HEAVY_DUTY, MOTORCYCLE}.
      - name: original_record_id
        type: string
        source: input
        description: >-
          FK -> InspectionRecord.id; null on a first inspection. On a reinspection, points to
          the head of the reinspection chain (the first record for this VIN visit).
        default: null
      - name: reinspection_index
        type: integer
        source: computed
        description: 0 for the original inspection; increments by 1 for each subsequent reinspection in the chain.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        default: IN_PROGRESS
        constraints: One of {IN_PROGRESS, PASSED, FAILED, ABORTED}.
      - name: safety_result
        type: enum
        source: computed
        description: Aggregate safety outcome derived from ChecklistResult rows when pass/fail is decided.
        default: PENDING
        constraints: One of {PENDING, PASS, FAIL}.
      - name: emissions_result
        type: enum
        source: computed
        description: OBD-II outcome; NOT_APPLICABLE when the class's obd_required is false.
        default: PENDING
        constraints: One of {PENDING, PASS, FAIL, NOT_APPLICABLE}.
      - name: fee_cents
        type: integer
        source: computed
        description: Total fee for this record (see compute_inspection_fee). Frozen at the pass/fail decision.
        default: 0
      - name: waiver_applied
        type: boolean
        source: computed
        description: True if a WaiverRequest was approved and let this record PASS despite an emissions FAIL.
        default: false

  - name: ChecklistResult
    parent: null
    common_fields: true
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the inspection record this checklist line belongs to."
      - name: item_code
        type: string
        source: input
        description: Stable code for the safety checklist item (e.g., "BRAKES", "LIGHTS").
      - name: outcome
        type: enum
        source: input
        description: Inspector's verdict for this item.
        constraints: One of {PASS, FAIL, NA}.
      - name: severity
        type: enum
        source: input
        description: How serious a FAIL is; ignored when outcome != FAIL.
        default: MINOR
        constraints: One of {MINOR, MAJOR, CRITICAL}.

  - name: EmissionsTest
    parent: null
    common_fields: true
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the inspection record this OBD-II test belongs to."
      - name: protocol
        type: enum
        source: input
        description: OBD-II readiness protocol used.
        constraints: One of {OBD2_CAN, OBD2_ISO, OBD2_J1850}.
      - name: dtc_count
        type: integer
        source: input
        description: Number of stored Diagnostic Trouble Codes read from the ECU.
        constraints: Integer >= 0.
      - name: readiness_monitors_incomplete
        type: integer
        source: input
        description: Count of emissions readiness monitors not yet complete.
        constraints: Integer >= 0.
      - name: mil_on
        type: boolean
        source: input
        description: Whether the Malfunction Indicator Lamp (check-engine light) is commanded ON.
      - name: result
        type: enum
        source: computed
        description: Computed OBD-II verdict (see evaluate_obd_result).
        default: PENDING
        constraints: One of {PENDING, PASS, FAIL}.

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the failed inspection these repairs respond to."
      - name: shop_name
        type: string
        source: input
        description: Name of the repair facility.
      - name: documented_cost_cents
        type: integer
        source: input
        description: Repair cost backed by an itemized invoice.
        default: 0
        constraints: Integer >= 0.
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Repair cost backed only by a written estimate (no paid invoice).
        default: 0
        constraints: Integer >= 0.
      - name: emissions_related
        type: boolean
        source: input
        description: Whether the repair targets the emissions failure (only emissions-related spend counts toward the waiver limit).
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        default: SUBMITTED
        constraints: One of {SUBMITTED, VERIFIED, REJECTED}.

  - name: WaiverRequest
    parent: null
    common_fields: true
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the emissions-failed record this waiver is sought for."
      - name: cost_basis
        type: enum
        source: input
        description: Which repair-spend basis the requester is claiming to meet the repair-cost limit.
        constraints: One of {DOCUMENTED_ONLY, DOCUMENTED_PLUS_ESTIMATED}.
      - name: qualifying_spend_cents
        type: integer
        source: computed
        description: Repair spend computed under cost_basis at decision time (see compute_qualifying_repair_spend).
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        default: REQUESTED
        constraints: One of {REQUESTED, APPROVED, DENIED}.

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the PASSED record this certificate certifies."
      - name: serial
        type: string
        source: system
        description: Station-minted serial (certificate_serial_prefix + zero-padded next_certificate_seq).
      - name: sticker_number
        type: string
        source: system
        description: Physical sticker number issued with the certificate.
      - name: status
        type: enum
        source: system
        description: Parallel validity dimension; VOID once the underlying record is invalidated.
        default: ACTIVE
        constraints: One of {ACTIVE, VOID}.
      - name: expires_on
        type: datetime
        source: computed
        description: One year after issuance (ISO 8601 UTC).

  - name: StateReportBatch
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station whose results this batch reports."
      - name: period_label
        type: string
        source: input
        description: Reporting period label (e.g., "2026-06").
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        default: OPEN
        constraints: One of {OPEN, SUBMITTED, ACCEPTED, REJECTED}.
      - name: line_count
        type: integer
        source: computed
        description: Number of StateReportLine rows currently attached.
        default: 0
      - name: total_reported_fee_cents
        type: integer
        source: computed
        description: Sum of fee_cents across attached lines, recomputed on every attach/detach (see compute_batch_totals).
        default: 0

  - name: StateReportLine
    parent: null
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> StateReportBatch.id; the batch this line belongs to."
      - name: record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the terminal inspection record being reported."
      - name: reported_result
        type: enum
        source: computed
        description: Snapshot of the record's overall pass/fail at attach time.
        constraints: One of {PASS, FAIL}.
      - name: fee_cents
        type: integer
        source: computed
        description: Snapshot of the record's fee_cents at attach time.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [CONSUMED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: Receptionist
        preconditions:
          - "Appointment.status == BOOKED"
        side_effects:
          - "Set status = CHECKED_IN."
          - "Increment Appointment.version by 1."
      - from: CHECKED_IN
        to: CONSUMED
        trigger: "POST /inspection-records (with this appointment_id)"
        actor: Inspector
        preconditions:
          - "Appointment.status == CHECKED_IN"
          - "No non-ABORTED InspectionRecord already references this appointment_id"
        side_effects:
          - "Set status = CONSUMED."
          - "Create InspectionRecord in IN_PROGRESS referencing this appointment."
          - "Increment Appointment.version by 1."
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Receptionist
        preconditions:
          - "Appointment.status == BOOKED"
        side_effects:
          - "Set status = CANCELLED; the reserved [scheduled_start, scheduled_end) slot is released on the lane."
          - "Increment Appointment.version by 1."
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Receptionist
        preconditions:
          - "Appointment.status == BOOKED"
          - "current_clock >= Appointment.scheduled_end"
        side_effects:
          - "Set status = NO_SHOW; the reserved slot is released on the lane."
          - "Increment Appointment.version by 1."

  - entity: AnalyzerReservation
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "POST /analyzer-reservations/{id}/release"
        actor: Receptionist
        preconditions:
          - "AnalyzerReservation.status == HELD"
        side_effects:
          - "Set status = RELEASED; the window no longer counts toward analyzer concurrency."
          - "Increment AnalyzerReservation.version by 1."

  - entity: InspectionRecord
    initial_state: IN_PROGRESS
    terminal_states: [ABORTED]
    transitions:
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /inspection-records/{id}/decide"
        actor: Inspector
        preconditions:
          - "InspectionRecord.status == IN_PROGRESS"
          - "Count of ChecklistResult rows for this record == VehicleClassProfile.checklist_item_count for this record's class/station"
          - "safety_result resolves to PASS (no ChecklistResult.outcome == FAIL); see evaluate_safety_result"
          - "If class obd_required: exactly one EmissionsTest exists and (its result == PASS OR an APPROVED WaiverRequest exists for this record)"
        side_effects:
          - "Compute safety_result, emissions_result via evaluate_safety_result / evaluate_obd_result."
          - "Set waiver_applied = true iff emissions_result == FAIL and an APPROVED WaiverRequest exists for this record."
          - "Freeze fee_cents via compute_inspection_fee."
          - "Set status = PASSED."
          - "Increment InspectionRecord.version by 1."
        note: "PASSED is non-terminal — it may be reopened via reinspect (e.g., recall, dispute), which voids the certificate."
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /inspection-records/{id}/decide"
        actor: Inspector
        preconditions:
          - "InspectionRecord.status == IN_PROGRESS"
          - "Count of ChecklistResult rows for this record == VehicleClassProfile.checklist_item_count for this record's class/station"
          - "NOT (the PASSED preconditions all hold) — i.e., a safety FAIL exists, or emissions FAIL without an approved waiver"
        side_effects:
          - "Compute safety_result, emissions_result."
          - "Freeze fee_cents via compute_inspection_fee."
          - "Set status = FAILED."
          - "Increment InspectionRecord.version by 1."
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /inspection-records/{id}/reinspect"
        actor: Inspector
        preconditions:
          - "InspectionRecord.status == FAILED"
          - "reinspection_index < 3 (at most 3 reinspections per chain)"
          - "A CHECKED_IN Appointment is supplied for the reinspection visit"
        side_effects:
          - "Mark the FAILED record as superseded and increment its InspectionRecord.version by 1 (it retains FAILED status as chain history)."
          - "Create a NEW InspectionRecord in IN_PROGRESS with original_record_id = head of this chain and reinspection_index = this.reinspection_index + 1 (cyclic revision loop)."
          - "Consume the supplied reinspection Appointment (CHECKED_IN -> CONSUMED)."
        note: >-
          Cyclic shape — the chain returns to IN_PROGRESS on a fresh record. The prior FAILED record
          stays FAILED for audit; the new record carries reinspection_index+1. (A FAILED record never
          holds an ACTIVE certificate, so no certificate cascade fires on this from-state.)
      - from: PASSED
        to: IN_PROGRESS
        trigger: "POST /inspection-records/{id}/reinspect"
        actor: Inspector
        preconditions:
          - "InspectionRecord.status == PASSED"
          - "reinspection_index < 3 (at most 3 reinspections per chain)"
          - "A CHECKED_IN Appointment is supplied for the reinspection visit"
        side_effects:
          - "LINK 1: Mark the PASSED chain-head record as superseded and increment its InspectionRecord.version by 1 (it retains PASSED status as chain history)."
          - "LINK 2 (caused by LINK 1's supersession): the chain head's ACTIVE Certificate is driven through the Certificate ACTIVE -> VOID transition."
          - "LINK 3 (caused by LINK 2's VOID): the Certificate VOID transition's own side effect revokes/surrenders the sticker_number."
          - "Create a NEW InspectionRecord in IN_PROGRESS with original_record_id = head of this chain and reinspection_index = this.reinspection_index + 1 (cyclic revision loop)."
          - "Consume the supplied reinspection Appointment (CHECKED_IN -> CONSUMED)."
        note: >-
          Transitive cascade depth 3: reinspect (PASSED head) -> chain-head supersession -> Certificate
          ACTIVE->VOID -> sticker revoke. Each link is caused by the prior link, not by the raw action.
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /inspection-records/{id}/abort"
        actor: StationManager
        preconditions:
          - "InspectionRecord.status == IN_PROGRESS"
        side_effects:
          - "Set status = ABORTED (terminal)."
          - "Increment InspectionRecord.version by 1."

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "system (cascade) — when the certified InspectionRecord is reopened via reinspect, or POST /certificates/{id}/void"
        actor: system
        preconditions:
          - "Certificate.status == ACTIVE"
        side_effects:
          - "Set status = VOID."
          - "Revoke the issued sticker_number (sticker considered surrendered)."
          - "Increment Certificate.version by 1."
        note: >-
          Compensation/cascade — voiding undoes the issuance side effects so the conserved
          'active-certificate-per-VIN-visit' count returns to its pre-issuance value.

  - entity: RepairOrder
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /repair-orders/{id}/verify"
        actor: StationManager
        preconditions:
          - "RepairOrder.status == SUBMITTED"
          - "The referenced InspectionRecord.status == FAILED with emissions_result == FAIL"
        side_effects:
          - "Set status = VERIFIED (only VERIFIED documented spend counts toward the waiver limit)."
          - "Increment RepairOrder.version by 1."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /repair-orders/{id}/reject"
        actor: StationManager
        preconditions:
          - "RepairOrder.status == SUBMITTED"
        side_effects:
          - "Set status = REJECTED (excluded from all waiver spend)."
          - "Increment RepairOrder.version by 1."

  - entity: WaiverRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /waiver-requests/{id}/decide (decision=APPROVE)"
        actor: StationManager
        preconditions:
          - "WaiverRequest.status == REQUESTED"
          - "Referenced InspectionRecord.status == FAILED and emissions_result == FAIL"
          - "compute_qualifying_repair_spend(record, cost_basis) >= Station.repair_cost_limit_cents"
        side_effects:
          - "Freeze qualifying_spend_cents via compute_qualifying_repair_spend."
          - "Set status = APPROVED (unblocks a subsequent reinspect+decide to PASSED with waiver_applied=true)."
          - "Increment WaiverRequest.version by 1."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /waiver-requests/{id}/decide (decision=DENY)"
        actor: StationManager
        preconditions:
          - "WaiverRequest.status == REQUESTED"
        side_effects:
          - "Freeze qualifying_spend_cents via compute_qualifying_repair_spend (audit snapshot of what was claimed)."
          - "Set status = DENIED."
          - "Increment WaiverRequest.version by 1."

  - entity: StateReportBatch
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /state-report-batches/{id}/submit"
        actor: StationManager
        preconditions:
          - "StateReportBatch.status == OPEN"
          - "line_count >= 1"
          - "expected_batch_version matches StateReportBatch.version (OCC)"
        side_effects:
          - "Set status = SUBMITTED (lines frozen; no further attach/detach)."
          - "Increment StateReportBatch.version by 1."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /state-report-batches/{id}/decide (decision=ACCEPT)"
        actor: StateAuditor
        preconditions:
          - "StateReportBatch.status == SUBMITTED"
        side_effects:
          - "Set status = ACCEPTED (terminal)."
          - "Increment StateReportBatch.version by 1."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /state-report-batches/{id}/decide (decision=REJECT)"
        actor: StateAuditor
        preconditions:
          - "StateReportBatch.status == SUBMITTED"
        side_effects:
          - "Set status = REJECTED."
          - "Increment StateReportBatch.version by 1."
      - from: REJECTED
        to: OPEN
        trigger: "POST /state-report-batches/{id}/reopen"
        actor: StationManager
        preconditions:
          - "StateReportBatch.status == REJECTED"
        side_effects:
          - "Set status = OPEN (lines editable again; branching submit/reject cycle)."
          - "Increment StateReportBatch.version by 1."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cert-issue-stale-record
    parent_entity: InspectionRecord
    write_endpoint: "POST /certificates"
    occ_field: "expected_record_version"
    description: |
      Issuing a Certificate against an InspectionRecord whose version has advanced
      since the client last observed it is rejected. A certificate may legitimately
      be issued for a PASSED record; but if the record was reinspected (reopened),
      which supersedes the head and advances its version since the client read it,
      the client's PASSED view is stale and the issuance must be refused rather than
      certify a superseded result.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: batch-submit-stale-batch
    parent_entity: StateReportBatch
    write_endpoint: "POST /state-report-batches/{id}/submit"
    occ_field: "expected_batch_version"
    description: |
      Submitting a StateReportBatch whose version has advanced since the client last
      observed it is rejected. Another writer may have just attached or detached a
      line (each bumps the batch version and recomputes totals), so the submitter's
      view of line_count / total_reported_fee_cents is stale and submission is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: evaluate_obd_result
    trigger: "POST /emissions-tests (on create) and re-affirmed at POST /inspection-records/{id}/decide"
    algorithm: threshold
    formula: |
      # OBD-II PASS requires a clean, ready ECU.
      if mil_on == true:
          result = FAIL
      elif dtc_count > MAX_STORED_DTC:
          result = FAIL
      elif readiness_monitors_incomplete > MAX_INCOMPLETE_MONITORS:
          result = FAIL
      else:
          result = PASS
    input_set: "The single EmissionsTest row attached to the record (exactly one is permitted)."
    constants:
      MAX_STORED_DTC: 0           # any stored DTC fails
      MAX_INCOMPLETE_MONITORS: 1  # at most 1 incomplete readiness monitor tolerated (>=2 fails)
    precision: "integer counts; no rounding"

  - name: evaluate_safety_result
    trigger: "POST /inspection-records/{id}/decide"
    algorithm: aggregation
    formula: |
      # Aggregate over ALL ChecklistResult rows for record_id == record.id.
      # The decide endpoint requires exactly checklist_item_count rows to exist first.
      if any ChecklistResult.outcome == FAIL (for this record_id):
          safety_result = FAIL
      else:
          safety_result = PASS    # outcomes are all in {PASS, NA}
    input_set: "All ChecklistResult rows whose record_id == this record; ordered by created_at ASC for audit, but order does not affect the boolean OR."
    constants: {}
    precision: "boolean; no rounding"

  - name: compute_qualifying_repair_spend
    trigger: "POST /waiver-requests/{id}/decide and previewed at GET /inspection-records/{id}/waiver-eligibility"
    algorithm: aggregation
    formula: |
      # Sum emissions-related repair spend under the chosen basis. ONLY VERIFIED
      # RepairOrders count; SUBMITTED and REJECTED are excluded.
      eligible = [ ro for ro in RepairOrders
                   where ro.record_id == record.id
                     and ro.emissions_related == true
                     and ro.status == VERIFIED ]
      documented = sum(ro.documented_cost_cents for ro in eligible)
      if cost_basis == DOCUMENTED_ONLY:
          qualifying = documented
      else:  # DOCUMENTED_PLUS_ESTIMATED
          estimated = sum(ro.estimated_cost_cents for ro in eligible)
          qualifying = documented + estimated
      # Waiver-eligible iff qualifying >= Station.repair_cost_limit_cents (threshold uses >=).
    input_set: "VERIFIED, emissions_related RepairOrder rows for the record; basis selects whether estimates are added."
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: documented_only
        when: "cost_basis == DOCUMENTED_ONLY"
        difference: "Counts only documented_cost_cents on VERIFIED emissions repairs; estimates excluded."
      - name: documented_plus_estimated
        when: "cost_basis == DOCUMENTED_PLUS_ESTIMATED"
        difference: "Adds estimated_cost_cents to documented; can cross the limit on the same repair set the documented-only basis fails."

  - name: compute_inspection_fee
    trigger: "POST /inspection-records/{id}/decide (frozen onto fee_cents at the PASSED/FAILED transition)"
    algorithm: tiered_pricing
    formula: |
      # Step order is PINNED. Components are integer cents; sum after each component
      # is fully resolved (there is no sub-cent rounding here — see compute_state_surcharge
      # for the rounding-order-sensitive companion).
      profile = VehicleClassProfile for (record.station_id, record.vehicle_class)
      base = profile.base_fee_cents
      emissions_surcharge = OBD_SURCHARGE_CENTS if profile.obd_required else 0
      service_subtotal = base + emissions_surcharge
      # Reinspection relief: the FIRST reinspection within the window waives the service
      # subtotal (base + emissions_surcharge), but the flat state environmental fee always applies.
      is_free_reinspection = (
          record.reinspection_index == 1
          and (decide_clock - original_record.created_at) <= profile.reinspection_window_days * 86400 seconds
      )
      if is_free_reinspection:
          service_subtotal = 0
      fee_cents = service_subtotal + STATE_ENV_FEE_CENTS
    input_set: "This record, its VehicleClassProfile, and (for reinspections) the chain head record's created_at."
    constants:
      OBD_SURCHARGE_CENTS: 1000
      STATE_ENV_FEE_CENTS: 200
    precision: "integer cents; no rounding"
    variants:
      - name: first_inspection_or_paid_reinspection
        when: "reinspection_index == 0, OR reinspection_index >= 1 but outside the free window / index != 1"
        difference: "Full service_subtotal charged plus state env fee."
      - name: free_first_reinspection
        when: "reinspection_index == 1 and within reinspection_window_days of the chain head's created_at"
        difference: "service_subtotal forced to 0; only STATE_ENV_FEE_CENTS charged."

  - name: compute_state_surcharge
    trigger: "GET /inspection-records/{id}/state-surcharge (regulator remittance preview) and frozen onto StateReportLine.fee_cents components at attach"
    algorithm: aggregation
    formula: |
      # The jurisdiction remits a percentage of the SERVICE portion of each fee back to
      # the state. Rounding order is PINNED: round EACH line's surcharge to whole cents
      # FIRST, then SUM. (Sum-then-round would differ by up to a cent on multi-line batches.)
      # per-line: line_service = max(line.fee_cents - STATE_ENV_FEE_CENTS, 0)
      #           line_surcharge = round_half_up(line_service * STATE_REMIT_RATE)   # to whole cents
      # batch:    state_surcharge_total = sum(line_surcharge over all lines)         # round-per-line-then-sum
    input_set: "All StateReportLine rows on the batch (single-line for the per-record GET preview)."
    constants:
      STATE_REMIT_RATE: 0.075       # 7.5% of the service portion
      STATE_ENV_FEE_CENTS: 200
    precision: "round_half_up to whole cents PER LINE, then integer sum"

  - name: compute_batch_totals
    trigger: "system — on every POST /state-report-batches/{id}/lines (attach) and DELETE .../lines/{record_id} (detach)"
    algorithm: aggregation
    formula: |
      lines = StateReportLine rows where batch_id == batch.id
      line_count = count(lines)
      total_reported_fee_cents = sum(line.fee_cents for line in lines)
    input_set: "All StateReportLine rows currently attached to the batch."
    constants: {}
    precision: "integer cents; no rounding"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per the RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves to an existing entity, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enum members valid, VIN exactly 17 uppercase alphanumerics, state_code exactly 2 uppercase letters, integers non-negative where required."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is defined."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /certificates, POST /state-report-batches/{id}/submit"

  - priority: 7
    category: business_temporal
    check: "scheduled_end is strictly after scheduled_start for an Appointment."
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 8
    category: business_temporal
    check: >-
      Appointment slot [scheduled_start, scheduled_end) plus the lane's turnaround_buffer_minutes
      must not overlap any non-released (BOOKED/CHECKED_IN/CONSUMED) appointment's
      [scheduled_start, scheduled_end + buffer) on the same lane. Half-open adjacency at the boundary
      (new.start == existing.end + buffer) does NOT conflict.
    error_id: ERR_LANE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 9
    category: business_temporal
    check: >-
      For POST /analyzer-reservations, the count of HELD AnalyzerReservation windows at the same
      station whose half-open [window_start, window_end) interval STRICTLY OVERLAPS the requested
      window (positive-length intersection; touching endpoints do NOT overlap) must remain
      < Station.analyzer_count after admitting the new reservation. This is aggregate-capacity
      overlap (N concurrent allowed), distinct from the lane's single-occupant buffer-adjacency rule.
    error_id: ERR_ANALYZER_CAPACITY
    http_status: 409
    applies_to: "POST /analyzer-reservations"

  - priority: 10
    category: business_referential
    check: "Appointment.vehicle_class has a matching VehicleClassProfile at the lane's station."
    error_id: ERR_CLASS_PROFILE_MISSING
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 11
    category: business_referential
    check: "An EmissionsTest may be attached only when the record's class profile has obd_required == true; at most one EmissionsTest per record."
    error_id: ERR_OBD_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /emissions-tests"

  - priority: 12
    category: business_safety
    check: >-
      Pass/fail decision requires that the number of ChecklistResult rows equals the class profile's
      checklist_item_count, and (when obd_required) exactly one EmissionsTest exists. Missing items or
      missing the required OBD test blocks the decision.
    error_id: ERR_INSPECTION_INCOMPLETE
    http_status: 409
    applies_to: "POST /inspection-records/{id}/decide"

  - priority: 13
    category: business_safety
    check: >-
      Issuing a Certificate requires the InspectionRecord.status == PASSED. A FAILED/IN_PROGRESS/ABORTED
      record cannot be certified.
    error_id: ERR_RECORD_NOT_PASSED
    http_status: 409
    applies_to: "POST /certificates"

  - priority: 14
    category: business_constraint
    check: "At most one ACTIVE Certificate may exist per InspectionRecord."
    error_id: ERR_CERTIFICATE_EXISTS
    http_status: 409
    applies_to: "POST /certificates"

  - priority: 15
    category: business_fiscal
    check: >-
      Approving a WaiverRequest requires compute_qualifying_repair_spend(record, cost_basis) >=
      Station.repair_cost_limit_cents. Below the limit the waiver cannot be approved.
    error_id: ERR_REPAIR_LIMIT_NOT_MET
    http_status: 409
    applies_to: "POST /waiver-requests/{id}/decide"

  - priority: 16
    category: business_constraint
    check: "A reinspection chain admits at most 3 reinspections (reinspection_index <= 3)."
    error_id: ERR_REINSPECTION_LIMIT
    http_status: 409
    applies_to: "POST /inspection-records/{id}/reinspect"

  - priority: 17
    category: business_constraint
    check: "A StateReportBatch may only attach a line for a terminal record (PASSED or FAILED), and a record may appear at most once per batch."
    error_id: ERR_LINE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /state-report-batches/{id}/lines"

  - priority: 18
    category: business_constraint
    check: "A StateReportBatch must have line_count >= 1 to be submitted."
    error_id: ERR_EMPTY_BATCH
    http_status: 409
    applies_to: "POST /state-report-batches/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock for deterministic temporal tests."
    roles: [StationManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical current_clock used by no-show and reinspection-window checks."]

  # ---- Station ----
  - method: POST
    path: "/stations"
    description: "Create an inspection station."
    roles: [StationManager]
    code: 201
    input: [name, state_code, certificate_serial_prefix, repair_cost_limit_cents, "analyzer_count?"]
    output: Station
    side_effects: ["Initialize next_certificate_seq = 1."]
  - method: GET
    path: "/stations/{id}"
    description: "Fetch a station."
    roles: [StationManager, Inspector, Receptionist, StateAuditor]
    code: 200
    input: []
    output: Station
    side_effects: []

  # ---- VehicleClassProfile ----
  - method: POST
    path: "/vehicle-class-profiles"
    description: "Create a vehicle-class profile under a station."
    roles: [StationManager]
    code: 201
    input: [station_id, vehicle_class, base_fee_cents, obd_required, checklist_item_count, "reinspection_window_days?"]
    output: VehicleClassProfile
    side_effects: []
  - method: GET
    path: "/vehicle-class-profiles/{id}"
    description: "Fetch a vehicle-class profile."
    roles: [StationManager, Inspector, Receptionist]
    code: 200
    input: []
    output: VehicleClassProfile
    side_effects: []
  - method: GET
    path: "/vehicle-class-profiles"
    description: "List vehicle-class profiles; filter by station_id (reverse-reachability for VehicleClassProfile.station_id)."
    roles: [StationManager, Inspector, Receptionist]
    code: 200
    input: ["station_id?", "vehicle_class?", "limit?", "offset?"]
    output: VehicleClassProfile[]
    side_effects: []

  # ---- Lane ----
  - method: POST
    path: "/lanes"
    description: "Create an inspection lane under a station."
    roles: [StationManager]
    code: 201
    input: [station_id, lane_number, supports_obd, "turnaround_buffer_minutes?"]
    output: Lane
    side_effects: []
  - method: GET
    path: "/lanes/{id}"
    description: "Fetch a lane."
    roles: [StationManager, Inspector, Receptionist]
    code: 200
    input: []
    output: Lane
    side_effects: []
  - method: GET
    path: "/lanes"
    description: "List lanes; filter by station_id (reverse-reachability for Lane.station_id)."
    roles: [StationManager, Inspector, Receptionist]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: Lane[]
    side_effects: []
  - method: GET
    path: "/lanes/{id}/appointments"
    description: "List appointments reserved on a lane (reverse-reachability for Appointment.lane_id)."
    roles: [StationManager, Inspector, Receptionist]
    code: 200
    input: ["limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  # ---- AnalyzerReservation ----
  - method: POST
    path: "/analyzer-reservations"
    description: "Hold one of the station's shared OBD analyzers for a time window (aggregate-capacity overlap check)."
    roles: [Receptionist, StationManager]
    code: 201
    input: [station_id, vehicle_vin, window_start, window_end]
    output: AnalyzerReservation
    side_effects: ["Hold the window after the analyzer-capacity overlap check passes."]
  - method: GET
    path: "/analyzer-reservations/{id}"
    description: "Fetch an analyzer reservation."
    roles: [Receptionist, StationManager, Inspector]
    code: 200
    input: []
    output: AnalyzerReservation
    side_effects: []
  - method: GET
    path: "/analyzer-reservations"
    description: "List analyzer reservations; filter by station_id (reverse-reachability for AnalyzerReservation.station_id)."
    roles: [Receptionist, StationManager, Inspector]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: AnalyzerReservation[]
    side_effects: []
  - method: POST
    path: "/analyzer-reservations/{id}/release"
    description: "Release a held analyzer window so it no longer counts toward concurrency."
    roles: [Receptionist, StationManager]
    code: 200
    input: []
    output: AnalyzerReservation
    side_effects: ["status HELD -> RELEASED; increments AnalyzerReservation.version by 1."]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment or open a walk-in slot on a lane."
    roles: [Receptionist, StationManager]
    code: 201
    input: [lane_id, vehicle_vin, vehicle_class, kind, scheduled_start, scheduled_end]
    output: Appointment
    side_effects: ["Reserve the [scheduled_start, scheduled_end) slot on the lane after overlap check."]
  - method: GET
    path: "/appointments/{id}"
    description: "Fetch an appointment."
    roles: [Receptionist, StationManager, Inspector]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Mark an appointment checked in on arrival."
    roles: [Receptionist, StationManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> CHECKED_IN; increments Appointment.version by 1."]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a booked appointment and release its slot."
    roles: [Receptionist, StationManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> CANCELLED; releases slot; increments Appointment.version by 1."]
  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Mark a booked appointment a no-show after its end time."
    roles: [Receptionist, StationManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> NO_SHOW; releases slot; increments Appointment.version by 1."]

  # ---- InspectionRecord ----
  - method: POST
    path: "/inspection-records"
    description: "Open an inspection record by consuming a CHECKED_IN appointment."
    roles: [Inspector, StationManager]
    code: 201
    input: [appointment_id, "original_record_id?"]
    output: InspectionRecord
    side_effects:
      - "Consume appointment (CHECKED_IN -> CONSUMED)."
      - "Copy station_id, vehicle_vin, vehicle_class from the appointment/lane."
      - "If original_record_id supplied, set reinspection_index = parent chain head index + 1."
  - method: GET
    path: "/inspection-records/{id}"
    description: "Fetch an inspection record."
    roles: [Inspector, StationManager, Receptionist, StateAuditor]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: []
  - method: GET
    path: "/inspection-records"
    description: "List inspection records; filter by appointment_id, original_record_id, station_id, or status."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: ["appointment_id?", "original_record_id?", "station_id?", "status?", "limit?", "offset?"]
    output: InspectionRecord[]
    side_effects: []
  - method: POST
    path: "/inspection-records/{id}/decide"
    description: "Compute results and freeze the record as PASSED or FAILED."
    roles: [Inspector, StationManager]
    code: 200
    input: []
    output: InspectionRecord
    side_effects:
      - "Run evaluate_safety_result, evaluate_obd_result, compute_inspection_fee."
      - "Set status PASSED or FAILED; set waiver_applied; increments InspectionRecord.version by 1."
  - method: POST
    path: "/inspection-records/{id}/reinspect"
    description: "Open a fresh reinspection record from a FAILED or PASSED record, consuming a new CHECKED_IN appointment."
    roles: [Inspector, StationManager]
    code: 201
    input: [reinspection_appointment_id]
    output: InspectionRecord
    side_effects:
      - "Create new IN_PROGRESS record with original_record_id = chain head, reinspection_index+1."
      - "Consume the reinspection appointment; supersede the chain-head record (version+1)."
      - "If the chain head is PASSED and holds an ACTIVE Certificate, the supersession cascades that Certificate to VOID, whose VOID transition in turn revokes the sticker (transitive depth-3 cascade)."
  - method: POST
    path: "/inspection-records/{id}/abort"
    description: "Abort an in-progress record."
    roles: [StationManager]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: ["status IN_PROGRESS -> ABORTED; increments InspectionRecord.version by 1."]
  - method: GET
    path: "/inspection-records/{id}/waiver-eligibility"
    description: "Preview qualifying repair spend and waiver eligibility for both cost bases (computed read)."
    roles: [Inspector, StationManager]
    code: 200
    input: []
    output: "{ documented_only_spend_cents: integer, documented_plus_estimated_spend_cents: integer, repair_cost_limit_cents: integer, eligible_documented_only: boolean, eligible_documented_plus_estimated: boolean }"
    side_effects: []
  - method: GET
    path: "/inspection-records/{id}/state-surcharge"
    description: "Preview the per-record state remittance surcharge (computed read; round-per-line semantics)."
    roles: [StationManager, StateAuditor]
    code: 200
    input: []
    output: "{ service_portion_cents: integer, state_surcharge_cents: integer }"
    side_effects: []

  # ---- ChecklistResult ----
  - method: POST
    path: "/checklist-results"
    description: "Record one safety checklist item outcome on an IN_PROGRESS record."
    roles: [Inspector, StationManager]
    code: 201
    input: [record_id, item_code, outcome, "severity?"]
    output: ChecklistResult
    side_effects: []
  - method: GET
    path: "/checklist-results/{id}"
    description: "Fetch a checklist result."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: []
    output: ChecklistResult
    side_effects: []
  - method: GET
    path: "/checklist-results"
    description: "List checklist results; filter by record_id (reverse-reachability for ChecklistResult.record_id)."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: ["record_id?", "limit?", "offset?"]
    output: ChecklistResult[]
    side_effects: []

  # ---- EmissionsTest ----
  - method: POST
    path: "/emissions-tests"
    description: "Attach an OBD-II test result to an IN_PROGRESS record whose class requires OBD."
    roles: [Inspector, StationManager]
    code: 201
    input: [record_id, protocol, dtc_count, readiness_monitors_incomplete, mil_on]
    output: EmissionsTest
    side_effects: ["Run evaluate_obd_result to set result."]
  - method: GET
    path: "/emissions-tests/{id}"
    description: "Fetch an emissions test."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: []
    output: EmissionsTest
    side_effects: []
  - method: GET
    path: "/emissions-tests"
    description: "List emissions tests; filter by record_id (reverse-reachability for EmissionsTest.record_id)."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: ["record_id?", "limit?", "offset?"]
    output: EmissionsTest[]
    side_effects: []

  # ---- RepairOrder ----
  - method: POST
    path: "/repair-orders"
    description: "Submit a repair order against a FAILED emissions record."
    roles: [Receptionist, StationManager]
    code: 201
    input: [record_id, shop_name, "documented_cost_cents?", "estimated_cost_cents?", emissions_related]
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/repair-orders/{id}"
    description: "Fetch a repair order."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/repair-orders"
    description: "List repair orders; filter by record_id (reverse-reachability for RepairOrder.record_id)."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: ["record_id?", "status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/verify"
    description: "Verify a submitted repair order so its documented spend counts toward the waiver limit."
    roles: [StationManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status SUBMITTED -> VERIFIED; increments RepairOrder.version by 1."]
  - method: POST
    path: "/repair-orders/{id}/reject"
    description: "Reject a submitted repair order."
    roles: [StationManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status SUBMITTED -> REJECTED; increments RepairOrder.version by 1."]

  # ---- WaiverRequest ----
  - method: POST
    path: "/waiver-requests"
    description: "Request an emissions waiver for a FAILED emissions record under a cost basis."
    roles: [Receptionist, StationManager]
    code: 201
    input: [record_id, cost_basis]
    output: WaiverRequest
    side_effects: []
  - method: GET
    path: "/waiver-requests/{id}"
    description: "Fetch a waiver request."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: []
    output: WaiverRequest
    side_effects: []
  - method: GET
    path: "/waiver-requests"
    description: "List waiver requests; filter by record_id (reverse-reachability for WaiverRequest.record_id)."
    roles: [Inspector, StationManager, StateAuditor]
    code: 200
    input: ["record_id?", "status?", "limit?", "offset?"]
    output: WaiverRequest[]
    side_effects: []
  - method: POST
    path: "/waiver-requests/{id}/decide"
    description: "Approve or deny a waiver request; approval requires the repair-cost limit to be met."
    roles: [StationManager]
    code: 200
    input: [decision]
    output: WaiverRequest
    side_effects:
      - "Freeze qualifying_spend_cents via compute_qualifying_repair_spend."
      - "status REQUESTED -> APPROVED|DENIED; increments WaiverRequest.version by 1."

  # ---- Certificate ----
  - method: POST
    path: "/certificates"
    description: "Issue a certificate + sticker for a PASSED record (OCC on the record's version)."
    roles: [StationManager]
    code: 201
    input: [record_id, expected_record_version]
    output: Certificate
    side_effects:
      - "Mint serial = certificate_serial_prefix + zero-padded next_certificate_seq; increment Station.next_certificate_seq by 1."
      - "Mint sticker_number; set expires_on = issuance + 1 year; status ACTIVE."
      - "increments InspectionRecord.version by 1 (the certified record's version advances so a later stale-version issuance fails OCC)."
  - method: GET
    path: "/certificates/{id}"
    description: "Fetch a single certificate."
    roles: [StationManager, Inspector, StateAuditor]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List certificates; filter by record_id (reverse-reachability for Certificate.record_id)."
    roles: [StationManager, Inspector, StateAuditor]
    code: 200
    input: ["record_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/certificates/{id}/void"
    description: "Manually void an active certificate (compensating action; surrenders the sticker)."
    roles: [StationManager]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status ACTIVE -> VOID; revoke sticker; increments Certificate.version by 1."]

  # ---- StateReportBatch + StateReportLine ----
  - method: POST
    path: "/state-report-batches"
    description: "Open a new state report batch for a station/period."
    roles: [StationManager]
    code: 201
    input: [station_id, period_label]
    output: StateReportBatch
    side_effects: ["Initialize line_count = 0, total_reported_fee_cents = 0."]
  - method: GET
    path: "/state-report-batches/{id}"
    description: "Fetch a state report batch."
    roles: [StationManager, StateAuditor]
    code: 200
    input: []
    output: StateReportBatch
    side_effects: []
  - method: GET
    path: "/state-report-batches"
    description: "List state report batches; filter by station_id (reverse-reachability for StateReportBatch.station_id)."
    roles: [StationManager, StateAuditor]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: StateReportBatch[]
    side_effects: []
  - method: POST
    path: "/state-report-batches/{id}/lines"
    description: "Attach a terminal inspection record to an OPEN batch as a report line."
    roles: [StationManager]
    code: 201
    input: [record_id]
    output: StateReportLine
    side_effects: ["Snapshot reported_result, fee_cents from the record; run compute_batch_totals (recompute line_count, total_reported_fee_cents); increments StateReportBatch.version by 1."]
  - method: GET
    path: "/state-report-batches/{id}/lines"
    description: "List the lines attached to a batch (reverse-reachability for StateReportLine.batch_id)."
    roles: [StationManager, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: StateReportLine[]
    side_effects: []
  - method: GET
    path: "/state-report-lines/{id}"
    description: "Fetch a state report line."
    roles: [StationManager, StateAuditor]
    code: 200
    input: []
    output: StateReportLine
    side_effects: []
  - method: GET
    path: "/state-report-lines"
    description: "List state report lines; filter by record_id or batch_id (reverse-reachability for StateReportLine.record_id and .batch_id)."
    roles: [StationManager, StateAuditor]
    code: 200
    input: ["record_id?", "batch_id?", "limit?", "offset?"]
    output: StateReportLine[]
    side_effects: []
  - method: DELETE
    path: "/state-report-batches/{id}/lines/{record_id}"
    description: "Detach a line from an OPEN batch."
    roles: [StationManager]
    code: 200
    input: []
    output: StateReportBatch
    side_effects: ["Remove the line; run compute_batch_totals; increments StateReportBatch.version by 1."]
  - method: POST
    path: "/state-report-batches/{id}/submit"
    description: "Submit a non-empty batch to the state (OCC on the batch's version)."
    roles: [StationManager]
    code: 200
    input: [expected_batch_version]
    output: StateReportBatch
    side_effects: ["status OPEN -> SUBMITTED; freezes lines; increments StateReportBatch.version by 1."]
  - method: POST
    path: "/state-report-batches/{id}/decide"
    description: "State auditor accepts or rejects a submitted batch."
    roles: [StateAuditor]
    code: 200
    input: [decision]
    output: StateReportBatch
    side_effects: ["status SUBMITTED -> ACCEPTED|REJECTED; increments StateReportBatch.version by 1."]
  - method: POST
    path: "/state-report-batches/{id}/reopen"
    description: "Reopen a rejected batch for edits (branching submit/reject cycle)."
    roles: [StationManager]
    code: 200
    input: []
    output: StateReportBatch
    side_effects: ["status REJECTED -> OPEN; increments StateReportBatch.version by 1."]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this operation per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not resolve to an existing entity."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad enum, VIN not 17 chars, state_code not 2 letters, negative integer where forbidden."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is defined."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "Appointment scheduled_end is not strictly after scheduled_start."
  - id: ERR_LANE_TIME_CONFLICT
    http: 409
    condition: "Requested appointment slot (plus turnaround buffer) overlaps an existing non-released appointment on the same lane."
  - id: ERR_ANALYZER_CAPACITY
    http: 409
    condition: "Requested analyzer-reservation window would exceed the station's analyzer_count of strictly-overlapping HELD reservations."
  - id: ERR_CLASS_PROFILE_MISSING
    http: 409
    condition: "No VehicleClassProfile exists for the appointment's vehicle_class at the lane's station."
  - id: ERR_OBD_NOT_APPLICABLE
    http: 409
    condition: "EmissionsTest attached to a record whose class does not require OBD, or a second EmissionsTest attempted."
  - id: ERR_INSPECTION_INCOMPLETE
    http: 409
    condition: "Decide attempted before all checklist items (and required OBD test) are recorded."
  - id: ERR_RECORD_NOT_PASSED
    http: 409
    condition: "Certificate issuance attempted on a record that is not PASSED."
  - id: ERR_CERTIFICATE_EXISTS
    http: 409
    condition: "An ACTIVE Certificate already exists for this record."
  - id: ERR_REPAIR_LIMIT_NOT_MET
    http: 409
    condition: "Waiver approval attempted but qualifying repair spend is below the station's repair_cost_limit_cents."
  - id: ERR_REINSPECTION_LIMIT
    http: 409
    condition: "Reinspect attempted when the chain already holds the maximum 3 reinspections."
  - id: ERR_LINE_NOT_ELIGIBLE
    http: 409
    condition: "Attaching a report line for a non-terminal record, or duplicating a record already on the batch."
  - id: ERR_EMPTY_BATCH
    http: 409
    condition: "Submit attempted on a batch with line_count == 0."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StationManager
    description: "Station superuser: configures station/lanes/profiles, issues/voids certificates, verifies repairs, decides waivers, manages state batches; can also perform Inspector and Receptionist operations."
    identity: opaque
    exclusive_operations:
      - "POST /stations"
      - "POST /vehicle-class-profiles"
      - "POST /lanes"
      - "POST /inspection-records/{id}/abort"
      - "POST /repair-orders/{id}/verify"
      - "POST /repair-orders/{id}/reject"
      - "POST /waiver-requests/{id}/decide"
      - "POST /certificates"
      - "POST /certificates/{id}/void"
      - "POST /state-report-batches"
      - "POST /state-report-batches/{id}/lines"
      - "DELETE /state-report-batches/{id}/lines/{record_id}"
      - "POST /state-report-batches/{id}/submit"
      - "POST /state-report-batches/{id}/reopen"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /appointments (with Receptionist)"
      - "POST /appointments/{id}/check-in, cancel, no-show (with Receptionist)"
      - "POST /analyzer-reservations, /analyzer-reservations/{id}/release (with Receptionist)"
      - "POST /inspection-records, decide, reinspect (with Inspector)"
      - "POST /checklist-results, /emissions-tests (with Inspector)"
      - "POST /repair-orders, /waiver-requests (with Receptionist)"
      - "All GET reads"

  - name: Inspector
    description: "Performs the inspection: opens records, records checklist items and OBD tests, decides pass/fail, opens reinspections."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /inspection-records (with StationManager)"
      - "POST /inspection-records/{id}/decide (with StationManager)"
      - "POST /inspection-records/{id}/reinspect (with StationManager)"
      - "POST /checklist-results (with StationManager)"
      - "POST /emissions-tests (with StationManager)"
      - "GET reads on records, checklist, emissions, repairs, waivers, certificates, profiles, lanes, appointments, stations"

  - name: Receptionist
    description: "Front-desk: books appointments and walk-ins, checks in / cancels / marks no-show, intakes repair orders and waiver requests."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /appointments (with StationManager)"
      - "POST /appointments/{id}/check-in, cancel, no-show (with StationManager)"
      - "POST /analyzer-reservations, /analyzer-reservations/{id}/release (with StationManager)"
      - "POST /repair-orders (with StationManager)"
      - "POST /waiver-requests (with StationManager)"
      - "GET reads on appointments, lanes, profiles, stations, records, analyzer-reservations"

  - name: StateAuditor
    description: "External jurisdiction reviewer: accepts or rejects submitted state report batches; read-only otherwise."
    identity: opaque
    exclusive_operations:
      - "POST /state-report-batches/{id}/decide"
    shared_operations:
      - "GET reads on state-report-batches, state-report-lines, inspection-records, certificates, emissions-tests, checklist-results, repair-orders, waiver-requests, stations"
