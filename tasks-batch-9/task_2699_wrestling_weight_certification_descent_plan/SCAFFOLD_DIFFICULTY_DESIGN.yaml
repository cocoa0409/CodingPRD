              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
