            - "trigger 1 returns 200 with data.scheduled_end_at == 2026-10-01T19:00:00.000Z — scheduled_start_at plus the title's match_duration_minutes of 60, pinned at creation"
            - "trigger 1 also shows data.server_pool_id == POOL-A copied from the title, data.play_status == FORFEITED, data.result_status == ADJUDICATED, data.forfeiting_team_id == ${tm_b_id}, data.winner_team_id == ${tm_a_id}, data.home_points_awarded == 3 and data.away_points_awarded == 0"
