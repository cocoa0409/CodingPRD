              as: CreditAnalyst
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans/${loan_1}/charge_off"
              payload: { charge_off_amount_cents: 100000, charge_off_period: "2026-Q1" }
              as: CreditAnalyst
            - call: "GET /cecl/portfolio-segments/${seg_id}"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/model-runs/${run_id}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "Loan.${loan_1}.status == CHARGED_OFF and amortized_cost_cents == 0"
            - "PortfolioSegment.${seg_id}.ytd_gross_charge_offs_cents == 100000 (hop 1)"
            - "PortfolioSegment.${seg_id}.charge_off_rate_bps == 5000 and status == WATCH (hop 2: 5000 > 200)"
            - "ModelRun.${run_id}.needs_segmentation_review == true (hop 3)"

      - name: backtest_breach_refresh_chain
        grounds:
          - calculations.backtest_outcome
          - state_machines.LossModel.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Depth-2 cascade from POST /loss-models/{id}/backtests (a different trigger
          from charge_off): (hop 1) each BREACH outcome increments the model's
          consecutive_backtest_breach_count; (hop 2) the second increment reaching the
          threshold 2 flips refresh_required to true, which alone unlocks the refresh
          transition (new DRAFT model with parent lineage).
        test_recipe:
          setup:
            - "FINALIZED run 2026-Q1 with total_allowance_cents == 55000 and total_exposure_cents == 10000000 (predicted rate 55 bps)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-BT", amortized_cost_cents: 10000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Adverse", scenario_type: ADVERSE, unemployment_rate_bps: 900, gdp_growth_bps: 0, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_adv: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 6000 }, { scenario_id: "${sc_adv}", weight_bps: 4000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs/${run_id}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
            - call: "POST /cecl/model-runs/${run_id}/finalize"
              payload: { period_charge_offs_cents: 0, period_recoveries_cents: 0 }
              as: ChiefCreditOfficer
          trigger:
            - call: "POST /cecl/loss-models/${m_id}/backtests"
              payload: { backtest_period: "2026-Q1", actual_loss_rate_bps: 300 }
              as: ModelValidator
              captures: { bt1_outcome: $.data.outcome }
            - call: "GET /cecl/loss-models/${m_id}"
              payload: {}
              as: ModelValidator
              captures: { cnt_mid: $.data.consecutive_backtest_breach_count }
            - call: "POST /cecl/loss-models/${m_id}/backtests"
              payload: { backtest_period: "2026-Q2", actual_loss_rate_bps: 300 }
              as: ModelValidator
            - call: "POST /cecl/loss-models/${m_id}/refresh"
              payload: {}
              as: ModelValidator
              captures: { new_model: $.data.id, new_parent: $.data.parent_model_id, new_label: $.data.version_label }
          assert:
            - "First backtest outcome == BREACH (${bt1_outcome}; |300 - 55| = 245 > 150)"
            - "LossModel.${m_id}.consecutive_backtest_breach_count after first BREACH == 1 (${cnt_mid}) and refresh_required still false"
            - "After second BREACH: consecutive_backtest_breach_count == 2 and refresh_required == true"
            - "Refresh then succeeds: new model ${new_model} has parent_model_id == ${m_id} and version_label == 'v2'"
            - "After refresh: LossModel.${m_id}.refresh_required == false and consecutive_backtest_breach_count == 0"

