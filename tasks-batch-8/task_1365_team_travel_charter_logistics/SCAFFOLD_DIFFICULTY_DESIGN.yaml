              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "SAS", display_name: "San Antonio", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
