# =========================================================================
# 1.9 Scaffold Corner Design - task 2723 Winery Direct-to-Consumer Shipping
# Compliance. The breadth probe: every testable claim the SCAFFOLD.yaml
# surface declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already
# cover. Sections and claim_type values come from
# references/claim-extraction-guide.md and nothing else.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * the logical clock is pinned with POST /_clock/set_current_utc as the
#     first call of every chain; unless stated otherwise it reads
#     2026-08-01T00:00:00Z, which is also the documented default
#   * ComplianceOfficer calls carry as_user_id officer_a or officer_b so the
#     segregation-of-duties rule (validations priority 35) is satisfiable
#   * WineryOperator calls carry as_user_id "${w_id}" and Consumer calls
#     as_user_id "${c_id}", per validations priority 3
#   * money is integer cents, liters carry 3 decimals, and every literal in
#     assert: is pre-computed by hand from the 1.3 formulas
#   * "00000000-0000-4000-8000-0000000000ff" is a well-formed UUID that is
#     never stored; it is the 404 probe id
#   * the canonical TX StateRule fixture is the one repeated verbatim in
#     SCAFFOLD_DIFFICULTY_DESIGN.yaml (27.000 L rolling consumer limit,
#     5000.000 L winery limit, 55 c/L excise, 825 bps sales tax on
#     subtotal+shipping, MONTHLY zero-filing reporting)
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: winery_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Winery
          - endpoints.POST_/dtc/wineries
          - response_envelope.success
        distinguishing_aspect: |
          POST /dtc/wineries with all four required input fields must return 201 and a body that already
          carries every system and computed field at its declared default, not a bare echo of the request. A
          response missing excise_accrued_cents or shipping status ACTIVE fails the claim.
        test_recipe:
          setup:
            - "The database is empty; only the logical clock has been pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type \"object\""
            - "data.name == \"Estate 1\", data.ttb_permit_number == \"TTB-1001\", data.home_state_code == \"CA\", data.annual_production_gallons == 120000"
            - "data.status == \"ACTIVE\" and data.suspension_reason is null"
            - "data.excise_accrued_cents == 0, data.excise_reversed_cents == 0, data.suspended_subscription_count == 0, data.open_exception_count == 0"
            - "data.version == 1 and data.created_at == data.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "data.id is a 36-character UUID with no type prefix (no \"win_\" or similar)"
      - name: winery_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Winery
          - endpoints.GET_/dtc/wineries/{id}
          - response_envelope.success
        distinguishing_aspect: |
          A read must not mutate: the GET body equals the creation body field for field, version stays 1
          and updated_at still equals created_at. An implementation that touches updated_at on read fails.
        test_recipe:
          setup:
            - "Winery Estate 1 was created at 2026-08-01T00:00:00Z and nothing has been written since."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 200 and data.id == \"${w_id}\""
            - "data.name == \"Estate 1\", data.annual_production_gallons == 120000, data.status == \"ACTIVE\""
            - "data.version == 1 \u2014 a read is not a mutation"
            - "data.updated_at == \"2026-08-01T00:00:00.000Z\" and equals data.created_at"
      - name: consumers_list_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Consumer
          - endpoints.GET_/dtc/consumers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three consumers exist, so limit 2 must return exactly two rows with total_count 3 and has_more
          true, and offset 2 must return the remaining one row with has_more false. total_count counts the
          whole filtered set, never the page.
        test_recipe:
          setup:
            - "Three consumers were created in the TX fixture state: Ada, Ben and Cleo, all with distinct emails."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ben Buyer", email: "ben@example.com", birthdate: "1979-11-30", address_line: "14 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Cleo Buyer", email: "cleo@example.com", birthdate: "1990-02-14", address_line: "16 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /dtc/consumers"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /dtc/consumers"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /dtc/consumers"
              payload: {}
              as: PlatformAdmin
          assert:
            - "first page: HTTP 200, response_type \"array\", exactly 2 rows, limit 2, offset 0, total_count 3, has_more true"
            - "second page: exactly 1 row, limit 2, offset 2, total_count 3, has_more false"
            - "no pagination arguments: limit 10 and offset 0 are applied by default, all 3 rows come back and has_more is false"
            - "every returned row carries the computed Consumer fields \u2014 screening_tier \"STANDARD\", risk_score_screening 0, return_credit_count 0"
      - name: every_path_parameter_reports_its_own_not_found_error
        claim_type: not_found
        grounds:
          - validations.priority_10
          - errors[ERR_WINERY_NOT_FOUND]
          - errors[ERR_STATE_RULE_NOT_FOUND]
          - errors[ERR_STATE_PERMIT_NOT_FOUND]
          - errors[ERR_CARRIER_PROGRAM_NOT_FOUND]
          - errors[ERR_CARRIER_ENROLLMENT_NOT_FOUND]
          - errors[ERR_CONSUMER_NOT_FOUND]
          - errors[ERR_CLUB_SUBSCRIPTION_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_COMPLIANCE_EXCEPTION_NOT_FOUND]
          - errors[ERR_REMITTANCE_NOT_FOUND]
          - errors[ERR_VOLUME_LEDGER_ENTRY_NOT_FOUND]
        distinguishing_aspect: |
          Priority 10 says the error_id names the entity of the failing segment, so a single generic
          ERR_NOT_FOUND is wrong: each of the twelve single-resource GETs must answer with its own id. The
          probe id is a well-formed UUID, so this is a lookup failure and not a 400.
        test_recipe:
          setup:
            - "The database is empty apart from the pinned clock; no row of any kind exists."
            - "The probe id 00000000-0000-4000-8000-0000000000ff is syntactically valid and stored nowhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /dtc/wineries/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/state-rules/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/state-permits/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/carrier-programs/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/carrier-enrollments/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/consumers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/club-subscriptions/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/orders/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/shipments/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/compliance-exceptions/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/remittances/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/volume-ledger-entries/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "all twelve trigger calls return HTTP 404 with response_type \"error\""
            - "GET /dtc/wineries/{probe} returns error_id \"ERR_WINERY_NOT_FOUND\""
            - "GET /dtc/state-rules/{probe} returns error_id \"ERR_STATE_RULE_NOT_FOUND\""
            - "GET /dtc/state-permits/{probe} returns error_id \"ERR_STATE_PERMIT_NOT_FOUND\""
            - "GET /dtc/carrier-programs/{probe} returns error_id \"ERR_CARRIER_PROGRAM_NOT_FOUND\""
            - "GET /dtc/carrier-enrollments/{probe} returns error_id \"ERR_CARRIER_ENROLLMENT_NOT_FOUND\""
            - "GET /dtc/consumers/{probe} returns error_id \"ERR_CONSUMER_NOT_FOUND\""
            - "GET /dtc/club-subscriptions/{probe} returns error_id \"ERR_CLUB_SUBSCRIPTION_NOT_FOUND\""
            - "GET /dtc/orders/{probe} returns error_id \"ERR_ORDER_NOT_FOUND\""
            - "GET /dtc/shipments/{probe} returns error_id \"ERR_SHIPMENT_NOT_FOUND\""
            - "GET /dtc/compliance-exceptions/{probe} returns error_id \"ERR_COMPLIANCE_EXCEPTION_NOT_FOUND\""
            - "GET /dtc/remittances/{probe} returns error_id \"ERR_REMITTANCE_NOT_FOUND\""
            - "GET /dtc/volume-ledger-entries/{probe} returns error_id \"ERR_VOLUME_LEDGER_ENTRY_NOT_FOUND\""
      - name: a_missing_required_body_field_is_refused_before_anything_else
        claim_type: required_fields
        grounds:
          - validations.priority_15
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/dtc/state-rules
          - endpoints.POST_/dtc/orders
          - endpoints.POST_/dtc/wineries
        distinguishing_aspect: |
          Every §1.5 input field without a declared default is required, and a request that omits one
          must be refused with 400 ERR_INVALID_REQUEST before any FK lookup or state check runs — the order
          probe omits `lines` while also naming a winery that does exist, so a 404 or a 422 answer would prove
          the ladder ran in the wrong order.
        test_recipe:
          setup:
            - "Winery Estate 1, the TX StateRule and the ID-verified Consumer Ada exist. Clock 2026-08-01."
            - "Each trigger call is a well-formed JSON body with exactly one required field missing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /dtc/state-rules"
              payload: { allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 2", home_state_code: "CA", annual_production_gallons: 5000 }
              as: PlatformAdmin
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "POST /dtc/club-subscriptions"
              payload: { consumer_id: "${c_id}", winery_id: "${w_id}", cadence: "MONTHLY", sku: "CLUB-750", bottles_per_shipment: 6, bottle_ml: 750, unit_price_cents: 2600, next_run_date: "2026-08-15" }
              as: WineryOperator
              as_user_id: "${w_id}"
          assert:
            - "state rule without state_code: HTTP 400 with error_id \"ERR_INVALID_REQUEST\""
            - "winery without ttb_permit_number: HTTP 400 with error_id \"ERR_INVALID_REQUEST\""
            - "order without lines: HTTP 400 with error_id \"ERR_INVALID_REQUEST\" \u2014 priority 15 runs before the priority 20 FK checks and before any screening"
            - "club subscription without annual_allotment: HTTP 400 with error_id \"ERR_INVALID_REQUEST\""
            - "no row was created by any refused call: GET /dtc/orders?winery_id=${w_id} returns zero rows and GET /dtc/club-subscriptions?winery_id=${w_id} returns zero rows"
      - name: state_rule_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.StateRule.fields.min_purchaser_age
          - entities.StateRule.fields.renewal_lead_days
          - endpoints.POST_/dtc/state-rules
        distinguishing_aspect: |
          min_purchaser_age and renewal_lead_days are the only two input fields in the scaffold carrying
          declared defaults (21 and 60). Omitting them must persist those exact values — not null, and not the
          45 used by the TX fixture — and the persisted default must then drive downstream logic (the renewal
          calendar reads renewal_lead_days).
        test_recipe:
          setup:
            - "The clock is pinned to 2026-08-01T00:00:00Z and no StateRule exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dtc/state-rules"
              payload: { state_code: "OK", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 70, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 450, tax_on_shipping: false, excise_in_tax_base: true, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true }
              as: PlatformAdmin
              captures: { sr_ok_id: $.data.id }
          assert:
            - "HTTP 201 and data.min_purchaser_age == 21 (declared default, not null)"
            - "data.renewal_lead_days == 60 (declared default, not the 45 the TX fixture supplies)"
            - "every explicitly supplied field is stored verbatim: data.excise_rate_per_liter_cents == 70, data.sales_tax_rate_bps == 450, data.excise_in_tax_base == true, data.tax_on_shipping == false"
            - "data.state_code == \"OK\" and data.version == 1"
      - name: order_money_fields_are_computed_and_have_no_input_channel
        claim_type: computed_fields
        grounds:
          - entities.Order.fields.total_cents
          - entities.Order.fields.total_liters
          - entities.OrderLine.fields.line_liters
          - calculations.order_charge_evaluation_chain
          - endpoints.POST_/dtc/orders
        distinguishing_aspect: |
          §1.5 declares no input field for any monetary column, so the only way a client can influence
          the money is through lines; all twelve chain outputs must appear on the creation response already
          computed, including the intermediate shipping_gross_cents / shipping_tiered_cents pair that no other
          assert in either design file pins.
        test_recipe:
          setup:
            - "Winery Estate 1 (120000 gallons), the TX StateRule and the ID-verified Consumer Ada exist. Clock 2026-08-01."
            - "The order is a single line of 6 x 750 ml at 4200 c, i.e. 4.500 L, with no club subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
          assert:
            - "HTTP 201 and data.total_liters == 4.500 with exactly three decimals"
