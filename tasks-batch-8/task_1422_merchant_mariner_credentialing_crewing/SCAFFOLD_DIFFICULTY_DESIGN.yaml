  - rule_id: compensating_invariant
    instances:
      - name: seat_ledger_enroll_cancel_conservation
        grounds:
          - state_machines.TrainingEnrollment.APPROVED_to_ENROLLED
          - state_machines.TrainingEnrollment.ENROLLED_to_CANCELLED
          - entities.TrainingCourse.fields.seats_reserved
          - entities.TrainingCourse.fields.seats_open
        distinguishing_aspect: |
          Conserved quantity: seat count. Invariant pinned as a formula over entity fields:
          TrainingCourse.seats_reserved + seats_open == seat_capacity at all times, and the
          forward/compensating pair (enroll e2, then cancel e2 from ENROLLED) returns
          seats_reserved to exactly its pre-pair value while e2's budget reservation is also
          released. Re-probe after the pair and after a replacement enroll (e3).
        test_recipe:
          setup:
            - "Course seat_capacity 2, cost 100000; mariners M1, M2, M3 activated"
            - "e1 ENROLLED, e2 ENROLLED (reserved 2, open 0)"
          setup_api_calls:
