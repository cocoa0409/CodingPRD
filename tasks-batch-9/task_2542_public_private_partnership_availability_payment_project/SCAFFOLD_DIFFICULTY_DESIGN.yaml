      - name: dispute_referral_cycle_is_bounded_at_three_submissions
        grounds:
          - state_machines.DeductionDispute
          - state_machines.DeductionDispute.REFERRED_BACK_to_RESUBMITTED
          - state_machines.DeductionDispute.RESUBMITTED_to_REFERRED_BACK
          - calculations.contractual_time_windows
          - validations.priority_65
        distinguishing_aspect: |
          Entity = DeductionDispute, a different entity from the ServicePeriod above.
          Non-linearity by BOUNDED CYCLE: REFERRED_BACK <-> RESUBMITTED is a genuine loop
          that can be traversed more than once, but a counter carried on the looping row
          (round_no, incremented only by resubmit and never by refer-back) closes it after
          exactly DISPUTE_MAX_ROUNDS = 3 submissions. The same endpoint therefore succeeds
          twice and then fails on identical input, and the only remaining exit is
          adjudication — a shape no acyclic or unbounded-cyclic reading reproduces.
