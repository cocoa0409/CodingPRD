            - "after the second trigger call Bid.${b5_id}.responsibility_status == RESPONSIBLE and Bid.${b5_id}.responsiveness_status == RESPONSIVE"
            - "after the second trigger call Bid.${b4_id} is still at the combined state (RESPONSIVE, NONRESPONSIBLE)"
            - "after the second trigger call Solicitation.${s5_id}.status == AWARD_PENDING and apparent_low_bid_id == ${b5_id}"
            - "ResponsibilityReview.${r_b5_id}.composite_score == 85.00"

  - rule_id: transitive_cascade
    instances:
      - name: corrective_action_protest_decision_cascade_depth_five
        grounds:
          - state_machines.Protest.UNDER_REVIEW_to_SUSTAINED
          - state_machines.Award.PENDING_STAY_to_VOID
          - state_machines.Solicitation.AWARD_PENDING_to_EVALUATION
          - state_machines.Bid.RESPONSIBLE_to_NOT_REVIEWED
          - entities.ResponsibilityReview.fields.superseded_at_utc
          - calculations.apparent_low_bidder_selection
        distinguishing_aspect: |
          Trigger is POST /procurement/protests/{id}/decision with outcome SUSTAINED and
          remedy_code CORRECTIVE_ACTION, and the chain is FIVE hops deep across five
          distinct entity types: Protest -> Award -> Solicitation -> Bid ->
          ResponsibilityReview, each hop caused only by the state change the previous hop
          produced.
