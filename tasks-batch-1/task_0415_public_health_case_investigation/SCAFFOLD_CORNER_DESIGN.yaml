# =============================================================================
# §1.9 Scaffold Corner Design (Breadth / Corner-Case Coverage Index)
# Public Health Case Investigation & Contact Tracing — EXPERT
# Breadth probe: enumerates testable claims across the §1.1–§1.7 surface that
# the §1.8 difficulty design does not already cover. Sections + claim_types are
# drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_defaulted_clock
        claim_type: Creation
        grounds:
          - entities.SurveillanceProgram
          - entities.SurveillanceProgram.fields.current_date
          - endpoints.POST_/surveillance/programs
        distinguishing_aspect: |
          POST /surveillance/programs with only name returns 201, an id, common_fields
          (created_at/updated_at/version), and current_date defaulted to
          2026-01-01T00:00:00.000Z — proves the deterministic clock default is applied.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
          assert:
            - "response.status == 201"
            - "SurveillanceProgram.${prog}.name == State PH"
            - "SurveillanceProgram.${prog}.current_date == 2026-01-01T00:00:00.000Z"
            - "SurveillanceProgram.${prog}.version == 1"

      - name: get_program_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.SurveillanceProgram
          - endpoints.GET_/surveillance/programs/{programId}
        distinguishing_aspect: |
          GET /surveillance/programs/{id} echoes the stored program including the
          current_date set at creation; read does not mutate.
        test_recipe:
          setup:
            - "Program P created."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /surveillance/programs/${prog}"
              as: EpiAnalyst
          assert:
            - "response.status == 200"
            - "SurveillanceProgram.${prog}.name == State PH"
            - "SurveillanceProgram.${prog}.current_date == 2026-01-01T00:00:00.000Z"

      - name: get_program_nonexistent_returns_program_not_found
        claim_type: Not Found
        grounds:
          - entities.SurveillanceProgram
          - errors[ERR_PROGRAM_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          GET on a well-formed but non-existent program UUID returns 404
          ERR_PROGRAM_NOT_FOUND (path existence, priority 3).
        test_recipe:
          setup:
            - "Empty DB (no programs)."
          setup_api_calls: []
          trigger:
            - call: "GET /surveillance/programs/00000000-0000-4000-8000-000000000000"
              as: EpiAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROGRAM_NOT_FOUND"

      - name: create_jurisdiction_missing_fips_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Jurisdiction.fields.fips_code
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          fips_code is source:input with no default; omitting it on POST
          /surveillance/jurisdictions returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Program P created."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1" }
              as: JurisdictionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_jurisdiction_defaults_active_monitoring_count_zero
        claim_type: Defaults
        grounds:
          - entities.Jurisdiction.fields.active_monitoring_count
          - endpoints.POST_/surveillance/jurisdictions
        distinguishing_aspect: |
          active_monitoring_count is computed with default 0; a freshly created
          jurisdiction reports active_monitoring_count == 0.
        test_recipe:
          setup:
            - "Program P created."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
          assert:
            - "response.status == 201"
            - "Jurisdiction.${j1}.active_monitoring_count == 0"

      - name: create_case_client_computed_classification_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Case.fields.classification
          - entities.Case.fields.completeness_score
          - entities.Case.fields.contact_count
          - endpoints.POST_/surveillance/cases
        distinguishing_aspect: |
          classification (computed, default SUSPECT), completeness_score (0), and
          contact_count (0) are server-owned; a client that posts classification=CONFIRMED
          and completeness_score=99 is ignored — case opens SUSPECT / 0 / 0.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
          trigger:
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-Z", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true, classification: "CONFIRMED", completeness_score: 99 }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cz: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${cz}.classification == SUSPECT"
            - "Case.${cz}.status == OPEN"
            - "Case.${cz}.completeness_score == 0"
            - "Case.${cz}.contact_count == 0"

      - name: create_case_system_fields_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Case.fields.status
          - entities.Case.common_fields
          - endpoints.POST_/surveillance/cases
        distinguishing_aspect: |
          id/created_at/updated_at/version and status are system-owned; a client
          posting status=CLOSED and a bogus id is ignored — server mints id, opens OPEN,
          version 1.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
          trigger:
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-SYS", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true, status: "CLOSED", id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { csys: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${csys}.status == OPEN"
            - "Case.${csys}.version == 1"
            - "Case.${csys}.id != ffffffff-ffff-4fff-8fff-ffffffffffff"

      - name: create_contact_invalid_exposure_setting_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Contact.fields.exposure_setting
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          exposure_setting is an enum {HOUSEHOLD,HEALTHCARE,WORKPLACE,SOCIAL,COMMUNITY};
          a value outside the set (PARTY) returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-BADENUM", exposure_setting: "PARTY", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_contact_negative_proximity_meters_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Contact.fields.proximity_meters
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          proximity_meters must be >= 0; a negative value (-1) returns 400
          ERR_INVALID_REQUEST — numeric-range constraint distinct from enum membership.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-NEG", exposure_setting: "HOUSEHOLD", proximity_meters: -1, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: monitoring_period_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.MonitoringPeriod.fields.start_date
          - entities.MonitoringPeriod.fields.end_date
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          MonitoringPeriod end_date must be >= start_date; an end_date before start_date
          returns 400 ERR_INVALID_REQUEST (field-level, priority 17) — distinct from the
          priority-9 overlap check on a well-formed period.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed, contact KB elicited."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-B", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kb: $.data.id }
          trigger:
            - call: "POST /surveillance/contacts/${kb}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-29T00:00:00.000Z", end_date: "2026-03-16T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: exposure_event_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ExposureEvent
          - entities.ExposureEvent.common_fields
          - endpoints.POST_/surveillance/contacts/{contactId}/exposure-events
        distinguishing_aspect: |
          ExposureEvent is common_fields:false (append-only: id + created_at only); the
          created event has no version/updated_at field and there is no update endpoint —
          only create/list/get.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed (window [2026-03-08,2026-03-20]), contact KEE elicited."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-EE", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kee: $.data.id }
          trigger:
            - call: "POST /surveillance/contacts/${kee}/exposure-events"
              payload: { encounter_date: "2026-03-15T00:00:00.000Z", setting_note: "kitchen" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { ee: $.data.id }
          assert:
            - "response.status == 201"
            - "ExposureEvent.${ee}.contact_id == ${kee}"
            - "ExposureEvent.${ee}.case_id == ${ci}"
            - "ExposureEvent.${ee}.version is absent"

      - name: create_case_wrong_parent_program_for_jurisdiction_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Case.fields.program_id
          - entities.Case.fields.jurisdiction_id
          - validations[priority=4]
          - errors[ERR_JURISDICTION_NOT_FOUND]
        distinguishing_aspect: |
          flat topology FK integrity: opening a Case in program P2 while naming a
          jurisdiction_id that belongs to program P1 returns 404 ERR_JURISDICTION_NOT_FOUND
          — the FK must reference a row in the SAME program.
        test_recipe:
          setup:
            - "Program P1 with jurisdiction J1 and condition COVID19; separate program P2 with condition COVID19."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH 1" }
              as: JurisdictionAdmin
              captures: { p1: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${p1}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/programs"
              payload: { name: "State PH 2" }
              as: JurisdictionAdmin
              captures: { p2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${p2}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
          trigger:
            - call: "POST /surveillance/cases"
              payload: { program_id: "${p2}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-XP", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_JURISDICTION_NOT_FOUND"

  # ===========================================================================
  # SECTION: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: interview_valid_transition_open_to_under_investigation
        claim_type: Valid Transition
        grounds:
          - state_machines.Case.OPEN_to_UNDER_INVESTIGATION
          - entities.Case.fields.interview_completed
        distinguishing_aspect: |
          POST interview on an OPEN case moves it to UNDER_INVESTIGATION and sets
          interview_completed true (happy-path transition not asserted by §1.8).
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, OPEN case CO."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-O", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { co: $.data.id }
          trigger:
            - call: "POST /surveillance/cases/${co}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          assert:
            - "response.status == 200"
            - "Case.${co}.status == UNDER_INVESTIGATION"
            - "Case.${co}.interview_completed == true"

      - name: classify_before_interview_returns_interview_not_complete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Case.UNDER_INVESTIGATION_to_CLASSIFIED
          - errors[ERR_CASE_NOT_CLASSIFIABLE]
        distinguishing_aspect: |
          classify requires the case to be in UNDER_INVESTIGATION; an OPEN case that was
          never interviewed returns 409 ERR_CASE_NOT_CLASSIFIABLE (state precondition fires
          before the interview_completed check).
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, OPEN case CO (never interviewed)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1, requires_lab_confirmation: false }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-O", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { co: $.data.id }
          trigger:
            - call: "POST /surveillance/cases/${co}/classify"
              payload: { classification: "PROBABLE" }
              as: CaseInvestigator
