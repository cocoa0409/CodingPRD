      - name: optimistic_concurrency_stale_device_version_blocks_the_manual_toner_order
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.consumable-order-create-stale-device
          - errors.ERR_STALE_DEVICE_VERSION
          - validations.priority_6_occ
        distinguishing_aspect: "The device OCC guard is checked at priority 6, ahead of the priority 7 supply-state gate: replaying the manual order with the version observed before the first order returns 412 ERR_STALE_DEVICE_VERSION even though the device has meanwhile moved to SUPPLY_ORDERED, and only after the open order is cancelled and the version re-read does the identical body succeed."
