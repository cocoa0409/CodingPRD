# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1197: Health Plan Provider Contracting & Fee Schedule Load
# 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: escalator_anniversary_vs_calendar
        grounds:
          - calculations.escalator_projection
          - entities.Contract.fields.escalator_mode
        distinguishing_aspect: |
          Dual-variant logic on the Contract domain: identical benchmark, entry
          percentage and service date price to 10000 cents under ANNIVERSARY
          compounding (2027-06-15 completes zero anniversaries of 2026-07-01) but
          10300 cents under CALENDAR compounding (year 2027 - 2026 = 1 step of 3%).
        test_recipe:
          setup:
            - "Benchmark 99213/L01/2026 PUBLISHED at 10000 cents; provider locality L01"
            - "Contract A escalator_mode ANNIVERSARY and Contract B escalator_mode CALENDAR, both SIGNED -> IN_CONFIGURATION with a VALIDATED version effective 2026-07-01 carrying entry 99213 at pct 10000"
            - "Each contract has one batch with one claim: service_date 2027-06-15, billed 15000, expected 0 (forces MISMATCH so priced value is observable)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "99213", benchmark_amount_cents: 10000 }, as: PlanAdmin, captures: { bench_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${bench_id}/publish", as: PlanAdmin }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            # Contract A — ANNIVERSARY
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 300, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { cta_id: $.data.id } }
            - { call: "POST /contracts/${cta_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${cta_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${cta_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${cta_id}/begin-configuration", as: ConfigurationAnalyst, captures: { cta_v: $.data.version } }
            - { call: "POST /contracts/${cta_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${cta_v}" }, as: ContractManager, captures: { va_id: $.data.id } }
            - { call: "POST /contract-versions/${va_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000 }, as: ConfigurationAnalyst, captures: { ea_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${ea_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${va_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${va_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${va_id}/simulation-batches", payload: { label: "BA" }, as: ConfigurationAnalyst, captures: { ba_id: $.data.id } }
            - { call: "POST /simulation-batches/${ba_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2027-06-15", billed_cents: 15000, expected_allowed_cents: 0 }, as: ConfigurationAnalyst, captures: { cla_id: $.data.id } }
            # Contract B — CALENDAR
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 300, escalator_mode: "CALENDAR", auto_renew: false }, as: ContractManager, captures: { ctb_id: $.data.id } }
            - { call: "POST /contracts/${ctb_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ctb_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ctb_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ctb_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ctb_v: $.data.version } }
            - { call: "POST /contracts/${ctb_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ctb_v}" }, as: ContractManager, captures: { vb_id: $.data.id } }
            - { call: "POST /contract-versions/${vb_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000 }, as: ConfigurationAnalyst, captures: { eb_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${eb_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${vb_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${vb_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${vb_id}/simulation-batches", payload: { label: "BB" }, as: ConfigurationAnalyst, captures: { bb_id: $.data.id } }
            - { call: "POST /simulation-batches/${bb_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2027-06-15", billed_cents: 15000, expected_allowed_cents: 0 }, as: ConfigurationAnalyst, captures: { clb_id: $.data.id } }
          trigger:
            - { call: "POST /simulation-batches/${ba_id}/price", as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bb_id}/price", as: ConfigurationAnalyst }
            - { call: "GET /simulation-batches/${ba_id}/claims", as: PlanAdmin }
            - { call: "GET /simulation-batches/${bb_id}/claims", as: PlanAdmin }
          assert:
            - "Claim ${cla_id}.priced_allowed_cents == 10000 (ANNIVERSARY: 0 completed anniversaries of 2026-07-01 by 2027-06-15)"
            - "Claim ${clb_id}.priced_allowed_cents == 10300 (CALENDAR: 1 Jan-1 boundary crossed; round_half_up(10000 * 1.03) == 10300)"
            - "The two priced amounts differ under identical benchmark/entry/service-date inputs"
      - name: benchmark_strict_vs_provisional
        grounds:
          - calculations.benchmark_resolution
          - entities.FeeScheduleEntry.fields.benchmark_lookup_mode
        distinguishing_aspect: |
          Dual-variant logic on the FeeScheduleEntry domain (different entity
          domain from the escalator instance): against the identical benchmark
          set (only 2026 PUBLISHED), a STRICT entry on a 2027-effective version
          fails with ERR_BENCHMARK_UNPUBLISHED while a PROVISIONAL entry maps
          the 2026 benchmark and computes a rate.
        test_recipe:
          setup:
            - "Benchmarks PUBLISHED: 99213/L01/2026 at 10000 and 99214/L01/2026 at 12000; no 2027 benchmarks exist"
            - "Contract in IN_CONFIGURATION with version 1 effective 2027-01-01 in DRAFT"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "99213", benchmark_amount_cents: 10000 }, as: PlanAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${b1_id}/publish", as: PlanAdmin }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "99214", benchmark_amount_cents: 12000 }, as: PlanAdmin, captures: { b2_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${b2_id}/publish", as: PlanAdmin }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 1, effective_date: "2027-01-01", expected_contract_version: "${ct_v}" }, as: ContractManager, captures: { v1_id: $.data.id } }
            - { call: "POST /contract-versions/${v1_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000, benchmark_lookup_mode: "STRICT" }, as: ConfigurationAnalyst, captures: { e_strict: $.data.id } }
            - { call: "POST /contract-versions/${v1_id}/fee-schedule-entries", payload: { hcpcs_code: "99214", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000, benchmark_lookup_mode: "PROVISIONAL" }, as: ConfigurationAnalyst, captures: { e_prov: $.data.id } }
          trigger:
            - { call: "POST /fee-schedule-entries/${e_strict}/map-benchmark", as: ConfigurationAnalyst, captures: { strict_err: $.data.error_id } }
            - { call: "POST /fee-schedule-entries/${e_prov}/map-benchmark", as: ConfigurationAnalyst, captures: { prov_rate: $.data.computed_rate_cents, prov_bench: $.data.medicare_benchmark_id, prov_status: $.data.entry_status } }
          assert:
            - "strict_err == ERR_BENCHMARK_UNPUBLISHED (STRICT requires benchmark_year == 2027; none PUBLISHED)"
            - "Entry ${e_strict}.entry_status == STAGED (unchanged)"
            - "prov_rate == 12000 and prov_bench == ${b2_id} and prov_status == MAPPED (PROVISIONAL fell back to the latest PUBLISHED year 2026)"
  - rule_id: combinatorial_formula
    instances:
      - name: case_rate_outlier_branch
        grounds:
          - calculations.claim_line_pricing
          - calculations.entry_rate_computation
        distinguishing_aspect: |
          Mode (a): the CASE_RATE outlier formula combines >= 3 inputs (base rate,
          billed amount, OUTLIER_THRESHOLD_BPS = 30000, OUTLIER_SHARE_BPS = 8000)
          with a strictly-greater branch condition and a nested min(line_allowed,
          billed_cents) cap — exercised at below-threshold, exactly-at-threshold,
          above-threshold, and cap-binds points.
        test_recipe:
          setup:
            - "Contract in IN_TESTING with VALIDATED version effective 2026-07-01 carrying entry J9999 CASE_RATE flat_rate_cents 200000 (mapped; outlier threshold = 3.0 x base = 600000 cents, share 80%)"
            - "Batch B with four claims on J9999: billed 500000 (below), 600000 (exactly at threshold), 900000 (above), 150000 (cap binds: base 200000 > billed)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ct_v}" }, as: ContractManager, captures: { v1_id: $.data.id } }
            - { call: "POST /contract-versions/${v1_id}/fee-schedule-entries", payload: { hcpcs_code: "J9999", service_category: "INPATIENT_SURGERY", rate_type: "CASE_RATE", flat_rate_cents: 200000 }, as: ConfigurationAnalyst, captures: { e1_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${e1_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/simulation-batches", payload: { label: "BC" }, as: ConfigurationAnalyst, captures: { b_id: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "J9999", service_category: "INPATIENT_SURGERY", service_date: "2026-08-01", billed_cents: 500000, expected_allowed_cents: 0 }, as: ConfigurationAnalyst, captures: { c_below: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "J9999", service_category: "INPATIENT_SURGERY", service_date: "2026-08-01", billed_cents: 600000, expected_allowed_cents: 0 }, as: ConfigurationAnalyst, captures: { c_at: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "J9999", service_category: "INPATIENT_SURGERY", service_date: "2026-08-01", billed_cents: 900000, expected_allowed_cents: 0 }, as: ConfigurationAnalyst, captures: { c_above: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "J9999", service_category: "INPATIENT_SURGERY", service_date: "2026-08-01", billed_cents: 150000, expected_allowed_cents: 0 }, as: ConfigurationAnalyst, captures: { c_cap: $.data.id } }
          trigger:
            - { call: "POST /simulation-batches/${b_id}/price", as: ConfigurationAnalyst }
          assert:
            - "Claim ${c_below}.priced_allowed_cents == 200000 (500000 * 10000 = 5000000000 not > 30000 * 200000 = 6000000000, base applies)"
            - "Claim ${c_at}.priced_allowed_cents == 200000 (600000 * 10000 == 6000000000, strictly-greater is false at the exact threshold)"
            - "Claim ${c_above}.priced_allowed_cents == 440000 (200000 + round_half_up((900000 - 600000) * 8000 / 10000) = 200000 + 240000; min(440000, 900000) does not bind)"
            - "Claim ${c_cap}.priced_allowed_cents == 150000 (below-threshold base 200000 capped by min(200000, 150000))"
      - name: per_line_then_sum_rounding
        grounds:
          - calculations.claim_line_pricing
          - entities.SimulationBatch.fields.total_priced_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different mode from the
          case-rate instance): the scaffold pins round-per-claim-line-then-sum, so
          three lines of round_half_up(10001 * 8000 / 10000) = round_half_up(8000.8)
          = 8001 sum to total_priced_cents == 24003, whereas sum-then-round would
          yield round_half_up(24002.4) == 24002.
        test_recipe:
          setup:
            - "Benchmark X0001/L01/2026 PUBLISHED at 10001 cents; provider locality L01"
            - "Contract in IN_CONFIGURATION with VALIDATED version effective 2026-07-01 carrying entry X0001 PERCENT_OF_MEDICARE pct 3333 (mapped)"
            - "Batch B with three identical claims on X0001, expected 8001 each (pct 8000 sits exactly at the regulatory floor and is allowed)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "X0001", benchmark_amount_cents: 10001 }, as: PlanAdmin, captures: { bx_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${bx_id}/publish", as: PlanAdmin }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ct_v}" }, as: ContractManager, captures: { v1_id: $.data.id } }
            - { call: "POST /contract-versions/${v1_id}/fee-schedule-entries", payload: { hcpcs_code: "X0001", service_category: "LAB", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 8000 }, as: ConfigurationAnalyst, captures: { e1_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${e1_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/simulation-batches", payload: { label: "BR" }, as: ConfigurationAnalyst, captures: { b_id: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "X0001", service_category: "LAB", service_date: "2026-08-01", billed_cents: 999999, expected_allowed_cents: 8001 }, as: ConfigurationAnalyst, captures: { c1_id: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "X0001", service_category: "LAB", service_date: "2026-08-02", billed_cents: 999999, expected_allowed_cents: 8001 }, as: ConfigurationAnalyst, captures: { c2_id: $.data.id } }
            - { call: "POST /simulation-batches/${b_id}/claims", payload: { hcpcs_code: "X0001", service_category: "LAB", service_date: "2026-08-03", billed_cents: 999999, expected_allowed_cents: 8001 }, as: ConfigurationAnalyst, captures: { c3_id: $.data.id } }
          trigger:
            - { call: "POST /simulation-batches/${b_id}/price", as: ConfigurationAnalyst, captures: { tot: $.data.total_priced_cents } }
          assert:
            - "Claim ${c1_id}.priced_allowed_cents == 8001 and claim_outcome == MATCH (round_half_up(10001 * 8000 / 10000) = round_half_up(8000.8) = 8001)"
            - "Claim ${c2_id}.priced_allowed_cents == 8001 and claim_outcome == MATCH"
            - "Claim ${c3_id}.priced_allowed_cents == 8001 and claim_outcome == MATCH"
            - "tot == 24003 (sum of per-line rounded values; sum-then-round would produce 24002 and is explicitly not used)"
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_negotiation_cycle
        grounds:
          - state_machines.Contract.PENDING_SIGNATURE_to_IN_NEGOTIATION
          - state_machines.Contract.IN_NEGOTIATION_to_PENDING_SIGNATURE
        distinguishing_aspect: |
          Non-linear shape on Contract: the PENDING_SIGNATURE -> IN_NEGOTIATION
          counter-offer edge forms a cycle with submit-for-signature; two full
          cycles accumulate negotiation_round == 2 and clear
          submitted_by_user_id on each counter before a successful sign.
        test_recipe:
          setup:
            - "Network and provider exist; contract created (DRAFT, negotiation_round 0)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 300, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
          trigger:
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/counter-offer", as: ContractManager, captures: { r1: $.data.negotiation_round, s1: $.data.contract_status, sub1: $.data.submitted_by_user_id } }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/counter-offer", as: ContractManager, captures: { r2: $.data.negotiation_round } }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1", captures: { final_status: $.data.contract_status } }
          assert:
            - "r1 == 1 and s1 == IN_NEGOTIATION and sub1 == null (counter-offer loops back and clears the submitter)"
            - "r2 == 2 (round accumulates across cycles, not reset)"
            - "final_status == SIGNED (cycle exits through a fresh submit + sign)"
      - name: batch_failed_reopen_cycle
        grounds:
          - state_machines.SimulationBatch.FAILED_to_OPEN
          - state_machines.SimulationClaim.MISMATCH_to_PENDING
        distinguishing_aspect: |
          Non-linear shape on SimulationBatch (different entity from Contract):
          OPEN -> PRICED -> FAILED -> OPEN is a cycle; on reopen every claim
          reverts to PENDING with priced_allowed_cents null, and a second
          price/score pass reproduces FAILED — the loop is repeatable.
        test_recipe:
          setup:
            - "Contract in IN_CONFIGURATION with VALIDATED version effective 2026-07-01 carrying entry 99213 pct 10000 on benchmark 10000"
            - "Batch with 4 claims: two expected 10000 (will MATCH), two expected 9999 (will MISMATCH)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "99213", benchmark_amount_cents: 10000 }, as: PlanAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${b_id}/publish", as: PlanAdmin }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
