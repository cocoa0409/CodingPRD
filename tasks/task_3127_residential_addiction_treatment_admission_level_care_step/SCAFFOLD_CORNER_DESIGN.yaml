    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: dimension_scores is a required input with no default, so omitting it is a 400
      ERR_INVALID_REQUEST from the required-field check — it is NOT the 400 ERR_INVALID_DIMENSION_SCORES
      that a present-but-malformed object produces.
