            - "the per-entry rounding is what makes the draw 89999 rather than 90000: summing the two entries first would round 900000.0 at 1000 bps to 90000 and leave 810000"
            - "the third account created before the departure is also in PENDING_TRANSFER, so the 24-hour clock is checked against its own pending_transfer_at"
            - "the transfer confirmation issued before the 24-hour window returns ERR_TRANSFER_HOLD_PERIOD"
            - "the same call after advancing the clock to exactly pending_transfer_at + 24 hours succeeds and returns status TRANSFERRED_OUT"# ---------------------------------------------------------------------------
