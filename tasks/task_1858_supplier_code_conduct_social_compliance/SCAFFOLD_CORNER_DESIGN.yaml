      - name: grievance_triage_after_resolved_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Grievance, "errors[ERR_GRIEVANCE_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVED is terminal: ESCALATE afterwards returns ERR_GRIEVANCE_INVALID_STATE."
        test_recipe:
          setup: ["Grievance RESOLVED (create -> START_REVIEW -> RESOLVE)"]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { legal_name: "Delta Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id } }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site R", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
