# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# River Cleanup & Adopt-a-Roadway Program
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: standing_rolling_vs_anniversary_windows
        grounds:
          - calculations.compliance_standing
          - entities.AdoptionAgreement.fields.standing
          - state_machines.AdoptionAgreement.RENEWAL_REVIEW_to_ACTIVE
          - validations[priority=9]
        distinguishing_aspect: |
          Entity domain = AdoptionAgreement compliance. The SAME six-completion
          history is COMPLIANT under the ROLLING trailing-365-day window (count 3
          at 2027-08-25; count 5 at renewal time, agreement stays ACTIVE) yet is
          renewal-ineligible under the ANNIVERSARY variant because the first
          12-month term window [2026-08-01, 2027-08-01) holds only 1 < 3
          completions — so renewal-decision APPROVE returns ERR_RENEWAL_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "Approved agreement (term 2026-08-01..2028-08-01) with six COMPLETED cleanups on scheduled dates 2026-09-10, 2027-08-10, 2027-08-20, 2028-04-01, 2028-04-15, 2028-05-01"
            - "Rolling standing verified COMPLIANT (count 3) at 2027-08-25 mid-chain"
            - "Clock at 2028-05-10, inside the renewal window [2028-05-03, 2028-08-01], rolling count 5 so agreement is ACTIVE"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { e1: $.data.id } }
            - { call: "POST /program/events/${e1}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2027-08-10", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { e2: $.data.id } }
            - { call: "POST /program/events/${e2}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2027-08-20", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { e3: $.data.id } }
            - { call: "POST /program/events/${e3}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e1}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e2}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-20T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e3}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-25T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { mid_status: $.data.status, mid_standing: $.data.standing, mid_count: $.data.cleanups_completed_in_window } }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ben Adult", dob: "1988-03-15" }, as: GroupLeader, as_user_id: "${g}", captures: { w2: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2028-04-01", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { e4: $.data.id } }
            - { call: "POST /program/events/${e4}/briefing", payload: { attendee_waiver_ids: ["${w2}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2028-04-15", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { e5: $.data.id } }
            - { call: "POST /program/events/${e5}/briefing", payload: { attendee_waiver_ids: ["${w2}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2028-05-01", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { e6: $.data.id } }
            - { call: "POST /program/events/${e6}/briefing", payload: { attendee_waiver_ids: ["${w2}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-01T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e4}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-15T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e5}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-05-01T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e6}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-05-10T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/agreements/${ag}/renewal-request", payload: {}, as: GroupLeader, as_user_id: "${g}", captures: { rr_status: $.data.status, rr_renewals: $.data.renewal_count } }
            - { call: "POST /program/agreements/${ag}/renewal-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "mid_status == ACTIVE and mid_standing == COMPLIANT and mid_count == 3 (rolling window [2026-08-25, 2027-08-25] holds 3 completions)"
            - "rr_status == RENEWAL_REVIEW and rr_renewals == 0"
            - "err == ERR_RENEWAL_NOT_ELIGIBLE (ANNIVERSARY window [2026-08-01, 2027-08-01) holds only 1 of required 3; rolling count at 2028-05-10 is 5, so the same history passes ROLLING yet fails ANNIVERSARY)"

      - name: debris_measured_vs_estimated_divergence
        grounds:
          - calculations.official_event_weight
          - entities.DebrisReport.fields.official_weight_lbs
          - state_machines.CleanupEvent.BRIEFING_DONE_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = DebrisReport/CleanupEvent weight accounting (different
          domain from the agreement-compliance instance). The same physical debris
          (2 GENERAL_TRASH bags + 2 RECYCLABLES bags) yields official_weight_lbs
          40.0 under ESTIMATED but 38.4 under MEASURED, and program metrics sum
          both sanctioned results to 78.4.
        test_recipe:
          setup:
            - "Approved agreement on a ROADWAY segment; adult waiver; two completed sibling events on 2026-09-10 and 2026-09-12"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Clean Banks", org_type: "CIVIC", contact_name: "Sam Lead", contact_email: "sam@cleanbanks.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 10.0, mile_marker_end: 12.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "sam@cleanbanks.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { ea: $.data.id } }
            - { call: "POST /program/events/${ea}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-12", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { eb: $.data.id } }
            - { call: "POST /program/events/${eb}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/events/${ea}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 }, { material_type: "RECYCLABLES", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { est_official: $.data.official_weight_lbs } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${eb}/debris-report", payload: { weight_method: "MEASURED", measured_total_weight_lbs: 38.4, material_lines: [ { material_type: "GENERAL_TRASH", line_weight_lbs: 24.9 }, { material_type: "RECYCLABLES", line_weight_lbs: 13.5 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { meas_official: $.data.official_weight_lbs } }
            - { call: "GET /program/metrics", payload: {}, as: ProgramCoordinator, captures: { tot_debris: $.data.total_debris_lbs, tot_cleanups: $.data.completed_cleanups } }
          assert:
            - "est_official == 40.0 (2x12.75 -> 25.5 plus 2x7.25 -> 14.5)"
            - "meas_official == 38.4 (scale reading; lines 24.9 + 13.5 reconcile exactly)"
            - "est_official != meas_official for the same physical debris"
            - "tot_debris == 78.4 and tot_cleanups == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: supply_allocation_water_surcharge_and_caps
        grounds:
          - calculations.supply_allocation
          - entities.SupplyDistribution.fields.bags_issued
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (expected_volunteers, mile_length, water_adjacent,
          depot stock) with a conditional branch on segment.water_adjacent and
          nested ceil. Identical V=7 and M=2.0 produce bags_issued 35 on the
          water-adjacent segment (ceil(ceil(7*2*2.0) * 1.25)) vs 28 on the
          non-water segment.
        test_recipe:
          setup:
            - "Depot stocked 500 bags / 100 vests / 50 grabbers; two approved agreements on two 2.0-mile segments, one water-adjacent RIVERBANK and one ROADWAY"
          setup_api_calls:
            - { call: "POST /program/depots", payload: { name: "Central Depot", bags_on_hand: 500, vests_on_hand: 100, grabbers_on_hand: 50 }, as: ProgramCoordinator, captures: { d: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g1: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { sw: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g1}", segment_id: "${sw}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g1}", captures: { ag1: $.data.id } }
            - { call: "POST /program/agreements/${ag1}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/groups", payload: { name: "Road Rangers", org_type: "BUSINESS", contact_name: "Rob Lead", contact_email: "rob@roadrangers.com" }, as: GroupLeader, captures: { g2: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 10.0, mile_marker_end: 12.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { sr: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g2}", segment_id: "${sr}", contact_email: "rob@roadrangers.com" }, as: GroupLeader, as_user_id: "${g2}", captures: { ag2: $.data.id } }
            - { call: "POST /program/agreements/${ag2}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag1}", scheduled_date: "2026-09-10", expected_volunteers: 7 }, as: GroupLeader, as_user_id: "${g1}", captures: { ew: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag2}", scheduled_date: "2026-09-10", expected_volunteers: 7 }, as: GroupLeader, as_user_id: "${g2}", captures: { er: $.data.id } }
          trigger:
            - { call: "POST /program/events/${ew}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g1}", captures: { w_vests: $.data.vests_issued, w_grabbers: $.data.grabbers_issued, w_bags: $.data.bags_issued } }
            - { call: "POST /program/events/${er}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g2}", captures: { r_vests: $.data.vests_issued, r_grabbers: $.data.grabbers_issued, r_bags: $.data.bags_issued } }
            - { call: "GET /program/depots/${d}", payload: {}, as: ProgramCoordinator, captures: { dep_bags: $.data.bags_on_hand, dep_vests: $.data.vests_on_hand, dep_grabbers: $.data.grabbers_on_hand } }
          assert:
            - "w_vests == 7 and w_grabbers == 4 and w_bags == 35 (water surcharge: ceil(28 * 1.25))"
            - "r_vests == 7 and r_grabbers == 4 and r_bags == 28 (no surcharge)"
            - "dep_bags == 437 and dep_vests == 86 and dep_grabbers == 42"

      - name: estimated_weight_per_line_rounding_order
        grounds:
          - calculations.official_event_weight
          - entities.DebrisReport.fields.material_breakdown
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. ESTIMATED report of
          1 GENERAL_TRASH + 1 RECYCLABLES bag: per-line round_half_up to 1dp gives
          12.8 and 7.3, summed to 20.1; the opposite order (sum raw products
          12.75 + 7.25 = 20.00, then round) would give 20.0. The scaffold pins
          round-per-line-then-sum, so official_weight_lbs == 20.1.
        test_recipe:
          setup:
            - "Approved agreement; adult waiver; event briefed and clock on the scheduled date 2026-09-10"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Clean Banks", org_type: "CIVIC", contact_name: "Sam Lead", contact_email: "sam@cleanbanks.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 1.0, mile_marker_end: 2.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "sam@cleanbanks.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 1 }, { material_type: "RECYCLABLES", bag_count: 1 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { official: $.data.official_weight_lbs, breakdown: $.data.material_breakdown } }
          assert:
            - "official == 20.1 (12.8 + 7.3 per-line-rounded, NOT 20.0 from sum-then-round)"
            - "breakdown == [{material_type: GENERAL_TRASH, line_weight_lbs: 12.8}, {material_type: RECYCLABLES, line_weight_lbs: 7.3}]"

  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_suspension_reinstatement_cycle
        grounds:
          - state_machines.AdoptionAgreement.ACTIVE_to_SUSPENDED
          - state_machines.AdoptionAgreement.SUSPENDED_to_ACTIVE
          - calculations.compliance_standing
        distinguishing_aspect: |
          Cyclic machine on AdoptionAgreement: ACTIVE -> SUSPENDED (system sweep
          at rolling count 2) -> ACTIVE (auto-reinstatement when the surviving
          BRIEFING_DONE event completes and the rolling count reaches 3). The
          loop back to ACTIVE distinguishes this from a linear pipeline.
        test_recipe:
          setup:
            - "Approved agreement with COMPLETED cleanups on 2026-09-10 and 2026-09-15 and a BRIEFING_DONE event scheduled 2027-02-10"
            - "Clock advanced to 2027-02-10: agreement age 193 days >= 180, rolling count 2 < 3, so the sweep suspends it; the BRIEFING_DONE event survives suspension"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 3.0, mile_marker_end: 4.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e1: $.data.id } }
            - { call: "POST /program/events/${e1}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-15", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e2: $.data.id } }
            - { call: "POST /program/events/${e2}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2027-02-10", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e3: $.data.id } }
            - { call: "POST /program/events/${e3}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e1}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e2}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-10T09:00:00Z" }, as: ProgramCoordinator }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { mid_status: $.data.status, mid_standing: $.data.standing, mid_reason: $.data.suspension_reason } }
          trigger:
            - { call: "POST /program/events/${e3}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 4 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { rep_official: $.data.official_weight_lbs } }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { fin_status: $.data.status, fin_standing: $.data.standing, fin_count: $.data.cleanups_completed_in_window } }
          assert:
            - "mid_status == SUSPENDED and mid_standing == NON_COMPLIANT and mid_reason == COMPLIANCE_DEFICIENCY"
            - "rep_official == 51.0"
            - "fin_status == ACTIVE and fin_standing == COMPLIANT and fin_count == 3 (cycle ACTIVE -> SUSPENDED -> ACTIVE traversed)"

      - name: event_postpone_reschedule_cycle
        grounds:
          - state_machines.CleanupEvent.SCHEDULED_to_POSTPONED
          - state_machines.CleanupEvent.POSTPONED_to_SCHEDULED
          - entities.CleanupEvent.fields.postpone_count
        distinguishing_aspect: |
          Cyclic machine on CleanupEvent (a different entity from the agreement
          cycle): SCHEDULED -> BRIEFING_DONE -> POSTPONED -> SCHEDULED, and the
          loop invalidates the prior briefing (briefing_attendee_count resets to
          0, postpone_count becomes 1) so a second briefing is required before
          completion.
        test_recipe:
          setup:
            - "Approved agreement; adult waiver; event scheduled 2026-09-10 and briefed"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Clean Banks", org_type: "CIVIC", contact_name: "Sam Lead", contact_email: "sam@cleanbanks.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 1.0, mile_marker_end: 2.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "sam@cleanbanks.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /program/events/${e}/postpone", payload: { reason: "storm warning" }, as: GroupLeader, as_user_id: "${g}", captures: { p_status: $.data.status, p_count: $.data.postpone_count, p_brief: $.data.briefing_attendee_count } }
            - { call: "PATCH /program/events/${e}", payload: { scheduled_date: "2026-09-20" }, as: GroupLeader, as_user_id: "${g}", captures: { r_status: $.data.status, r_date: $.data.scheduled_date } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}", captures: { b_status: $.data.status, b_count: $.data.briefing_attendee_count } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "GET /program/events/${e}", payload: {}, as: GroupLeader, as_user_id: "${g}", captures: { f_status: $.data.status, f_weight: $.data.completed_weight_lbs, f_postpone: $.data.postpone_count } }
          assert:
            - "p_status == POSTPONED and p_count == 1 and p_brief == 0 (briefing invalidated by the loop)"
            - "r_status == SCHEDULED and r_date == 2026-09-20"
            - "b_status == BRIEFING_DONE and b_count == 1 (re-briefing accepted after reschedule)"
            - "f_status == COMPLETED and f_weight == 25.5 and f_postpone == 1"

  - rule_id: transitive_cascade
    instances:
