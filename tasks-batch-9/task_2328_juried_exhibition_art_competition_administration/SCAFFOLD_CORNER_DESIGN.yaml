          difficulty_instance: transitive_cascade / purchase_award_confirm_cascades_award_sale_artwork_ledger
          rationale: "That §1.8 instance walks the full four-hop chain from award confirmation through the auto-created Sale, the artwork status change and both money ledgers, and its sibling instance covers the conflict-declaration chain, so the layer is already probed end-to-end with ordering assertions."

      - name: dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / sale_split_tax_inclusive_versus_purchase_award_tax_additional
          rationale: "That §1.8 instance runs both split variants on the identical 250000 price and asserts every diverging cent, and the provisional-versus-certified mean instance covers the second dual-variant rule with its switch delta."

  # =========================================================================
  # SECTION: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_within_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Entry.PENDING_FEE_to_SUBMITTED
        distinguishing_aspect: "consistency_model is immediate, so the fee-payment response itself must already show the frozen fee and the paid amount, and the artworks cascaded by that same call must read SUBMITTED on the very next request with no settling period or re-read loop."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES; MEMBER artist with a PENDING_FEE entry holding two imaged works (entry_fee_cents 3713)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_a_id: $.data.id } }
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "ff01" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Salt Flat", medium_category: "PHOTOGRAPHY", width_cm: 100, height_cm: 70, depth_cm: 4, weight_kg: 5, year_created: 2026, declared_value_cents: 300000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_b_id: $.data.id } }
            - { call: "POST /artworks/${aw_b_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-16T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "ff02" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}" }
          trigger:
            - { call: "POST /entries/${e1_id}/fee-payment", payload: { amount_cents: 3713 }, as: Artist, as_user_id: "${a1_id}", captures: { paid: $.data.fee_paid_cents } }
            - { call: "GET /artworks?entry_id=${e1_id}", payload: {}, as: Artist, as_user_id: "${a1_id}" }
            - { call: "GET /entries/${e1_id}", payload: {}, as: CallManager }
          assert:
            - "the fee-payment response body itself carries status == SUBMITTED, fee_paid_cents == 3713 and entry_fee_cents == 3713 — no second read is needed to observe the write"
            - "GET /artworks?entry_id=${e1_id} immediately shows both works with status == SUBMITTED, so the cascade was visible the moment the write returned"
            - "GET /entries/${e1_id} read by a different role returns the same version and the same works_count == 2, so visibility is not per-actor"
            - "no assertion in this recipe requires a retry, delay or polling loop"
