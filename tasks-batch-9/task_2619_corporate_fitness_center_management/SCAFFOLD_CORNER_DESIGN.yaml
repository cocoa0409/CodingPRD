          - endpoints[POST /monthly-invoices].side_effects
        distinguishing_aspect: |
          Drafting an invoice is itself a contract-version bump, so a billing run
          that reads the contract once and drafts two periods from that single
          read fails on the second draft with 412 ERR_STALE_CONTRACT_VERSION —
          even though the two periods do not collide and the September draft is
          otherwise perfectly legal. The OCC check precedes the period-conflict
          rule at priority 30.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain; contract version read once (${c_ver}) and the 2026-08 invoice drafted with it (net 0)."
