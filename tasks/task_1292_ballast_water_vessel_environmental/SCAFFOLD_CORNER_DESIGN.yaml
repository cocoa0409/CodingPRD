  # ============================================================
  # Section: consistency_model (immediate)
  # ============================================================
  - section: consistency_model
    instances:
      - name: event_post_immediately_visible_in_determination
        claim_type: immediate_consistency
        grounds: [calculations.exchange_vs_treatment_determination, "endpoints[POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events]"]
        distinguishing_aspect: "Consistency model is immediate: in the same logical instant, a persisted DISCHARGE is already reflected in the freshly recomputed current determination (total_discharged_volume_m3 == 200.0, trigger_reason BALLAST_EVENT_RECORDED) and the voyage's version has advanced — no lag, no read-your-writes violation."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9901 IN_PROGRESS; UPTAKE 200 T1 posted"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9100069", vessel_name: "MV Twite", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9901", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 200, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: $.data.version }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 200, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w2}" }
              as: VesselMaster
              captures: { ev: $.data.id }
            - call: "GET /vessels/${v}/voyages/${vy}/determinations"
              as: VesselMaster
              captures: { tot: "$.data[0].total_discharged_volume_m3", reason: "$.data[0].trigger_reason", cur: "$.data[0].is_current" }
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: $.data.version }
          assert:
            - "BallastWaterEvent.${ev} persisted (201) and the very next read sees ${tot} == 200.0"
            - "${reason} == BALLAST_EVENT_RECORDED AND ${cur} == true"
            - "${w3} == ${w2} + 1 (voyage version advanced in the same request's side effects)"
