          - errors.ERR_INSPECTOR_NOT_CERTIFIED
        distinguishing_aspect: "An UNDERGROUND-only inspector cannot be assigned to a SURFACE mine at creation time; the conflict/certification gates run before the inspection row is created."
        test_recipe:
          setup:
            - "SURFACE mine; inspector certified UNDERGROUND only."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - &mk_mine_sf
              call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Surface Pit 1", mine_type: "SURFACE", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "U. Deep", badge_number: "INSP-500", district_code: "D-11", certification: "UNDERGROUND", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { iu: $.data.id }
          trigger:
            - call: "POST /msha/inspections"
