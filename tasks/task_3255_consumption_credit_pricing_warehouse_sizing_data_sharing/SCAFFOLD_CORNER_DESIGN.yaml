              as: PlatformOperator
              captures: { acct_rbc: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_rbc}", name: "WH_RBC", size: "SMALL" }
              as: FinanceController
              captures: { err_rbc: $.data.error_id }
          assert:
            - "${err_rbc} == ERR_FORBIDDEN_ROLE"
            - "GET /v1/warehouses?account_id=${acct_rbc} returns total_count 0"
            - "FinanceController may still POST /v1/resource-monitors for the same account, so the denial is endpoint-scoped and not account-scoped"
      - name: shared_resume_operation_admits_both_roles
        claim_type: shared_operation
        grounds:
          - roles.DataEngineer.shared_operations
          - roles.PlatformOperator.shared_operations
        distinguishing_aspect: "Resume is a shared operation, so both the engineering role and the operations role can drive it while the finance and share roles cannot."
        test_recipe:
          setup: ["one SUSPENDED warehouse"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Rbac Shared", account_locator: "rs5004", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rsh: $.data.id }
            - call: "POST /v1/warehouses"
