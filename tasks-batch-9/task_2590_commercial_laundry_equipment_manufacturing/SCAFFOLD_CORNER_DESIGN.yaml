          - errors[ERR_DOSSIER_ALREADY_OPEN]
        distinguishing_aspect: "The uniqueness is over a STATE SET, not over rows: a model may hold many REJECTED dossiers but only one in IN_REVIEW / CERTIFIED / RESURVEY_REQUIRED, so a second submission while the first is IN_REVIEW is 409."
        test_recipe:
          setup: ["OPL-60-A with one IN_REVIEW dossier"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
