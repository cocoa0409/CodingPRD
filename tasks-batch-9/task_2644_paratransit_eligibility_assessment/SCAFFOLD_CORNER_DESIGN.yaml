        distinguishing_aspect: "The rule is conditional on the request flag, not on the site alone: the SAME inaccessible slot rejects requires_wheelchair_position true with ERR_SITE_NOT_ACCESSIBLE 422 and accepts requires_wheelchair_position false, so the guard must read the request flag rather than the applicant's mobility_aid."
