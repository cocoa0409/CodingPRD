      - name: battery_safety_beats_customer_window_overlap
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_BATTERY_SAFETY]
          - errors[ERR_CUSTOMER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: booking an
          e-bike with battery_health_pct 50 into a window overlapping the same
          customer's existing request fails BOTH; the safety error
          ERR_BATTERY_SAFETY (priority 11) beats ERR_CUSTOMER_WINDOW_OVERLAP
