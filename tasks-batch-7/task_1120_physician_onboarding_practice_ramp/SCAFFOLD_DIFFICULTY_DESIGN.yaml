            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=1", payload: {}, as: PracticeManager, captures: { ms1: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/report", payload: { actual_wrvu: 120, collections_cents: 1200000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst }
          trigger:
            - { call: "POST /onboarding/income-guarantees/${gar_id}/repayments", payload: { amount_cents: 700000 }, as: FinanceAnalyst, captures: { outst_after: "$.data.outstanding_balance_cents" } }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/repayments", payload: { amount_cents: 1 }, as: FinanceAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "First repayment (exactly the pre-repayment outstanding 700000) succeeds: total_repaid_cents == 700000 and outstanding_balance_cents == 0"
            - "Second repayment of 1 cent is rejected with error_id == ERR_REPAYMENT_EXCEEDS_OUTSTANDING (HTTP 422)"
            - "Pinned order observable: outstanding == max(0, 800000 - 700000 - 100000) == 0 after the first repayment"

  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle_loop
        grounds:
          - state_machines.Offer.EXTENDED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_EXTENDED
          - entities.Offer.fields.negotiation_round
        distinguishing_aspect: |
          Cyclic machine on the Offer entity (EXTENDED -> COUNTERED -> EXTENDED): two full
          negotiation rounds drive negotiation_round to 2, re-extension overwrites terms, and the
          executed contract carries the REVISED guarantee_monthly_cents (2100000) into the
          auto-created IncomeGuarantee. The parallel-dimension instance sits on a different
          entity (OnboardingCase).
        test_recipe:
          setup:
            - "Physician + case; one DRAFT offer (base 25000000, monthly guarantee 2000000, start 2027-06-01)"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Fay", specialty: "INTERNAL_MEDICINE", email: "fay@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
          trigger:
            - { call: "POST /onboarding/offers/${offer_id}/counter", payload: { physician_note: "need more base" }, as: Physician, as_user_id: "${phys_id}", captures: { round1: "$.data.negotiation_round", st1: "$.data.status" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: { base_salary_cents: 26000000 }, as: Recruiter, captures: { st2: "$.data.status" } }
            - { call: "POST /onboarding/offers/${offer_id}/counter", payload: { physician_note: "and guarantee" }, as: Physician, as_user_id: "${phys_id}", captures: { round2: "$.data.negotiation_round" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: { guarantee_monthly_cents: 2100000 }, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}", captures: { st3: "$.data.status" } }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator, captures: { st4: "$.data.status" } }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_monthly: "$.data[0].monthly_guarantee_cents" } }
          assert:
            - "After counter 1: status == COUNTERED and negotiation_round == 1"
            - "Re-extension returns status == EXTENDED (cycle hop COUNTERED -> EXTENDED) with base_salary_cents == 26000000"
            - "After counter 2: negotiation_round == 2"
            - "After accept: status == ACCEPTED; after execute: status == EXECUTED"
            - "IncomeGuarantee created from the EXECUTED offer has monthly_guarantee_cents == 2100000 (revised terms), not 2000000"

      - name: onboarding_case_parallel_dimensions_independent
        grounds:
          - state_machines.OnboardingCase
          - entities.OnboardingCase.fields.credential_status
          - entities.OnboardingCase.fields.training_status
          - entities.OnboardingCase.fields.practice_status
          - entities.OnboardingCase.fields.posture
        distinguishing_aspect: |
          Parallel state dimensions on the OnboardingCase entity (a different entity than the
          cyclic Offer): training can be driven to COMPLETE and practice to READY while
          credential_status is still NOT_STARTED, and the derived posture stays CREDENTIALING
          because the credential gate dominates; the dimensions evolve independently but the gate
          reads all three.
        test_recipe:
          setup:
            - "Executed offer pipeline (start 2027-06-01); NO credential items created"
            - "Training plan fully completed and signed off"
            - "Three CLINIC templates ACTIVE totalling exactly 1200 weekly minutes (480 + 480 + 240)"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Gia", specialty: "FAMILY_MEDICINE", email: "gia@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/training-plans?onboarding_case_id=${case_id}", payload: {}, as: PracticeManager, captures: { plan_id: "$.data[0].id" } }
            - { call: "GET /onboarding/training-modules?training_plan_id=${plan_id}&module_code=EHR_FUNDAMENTALS", payload: {}, as: PracticeManager, captures: { mod1: "$.data[0].id" } }
            - { call: "POST /onboarding/training-modules/${mod1}/schedule", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/training-modules/${mod1}/complete", payload: { score: 90 }, as: Physician, as_user_id: "${phys_id}" }
            - { call: "GET /onboarding/training-modules?training_plan_id=${plan_id}&module_code=NOTE_TEMPLATES", payload: {}, as: PracticeManager, captures: { mod2: "$.data[0].id" } }
            - { call: "POST /onboarding/training-modules/${mod2}/schedule", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/training-modules/${mod2}/complete", payload: { score: 90, templates_built_count: 3 }, as: Physician, as_user_id: "${phys_id}" }
            - { call: "GET /onboarding/training-modules?training_plan_id=${plan_id}&module_code=ORDER_ENTRY", payload: {}, as: PracticeManager, captures: { mod3: "$.data[0].id" } }
            - { call: "POST /onboarding/training-modules/${mod3}/schedule", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/training-modules/${mod3}/complete", payload: { score: 88 }, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/training-plans/${plan_id}/signoff", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 480, end_minute: 960, block_type: "CLINIC" }, as: PracticeManager, captures: { t1: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${t1}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 2, start_minute: 480, end_minute: 960, block_type: "CLINIC" }, as: PracticeManager, captures: { t2: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${t2}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 3, start_minute: 480, end_minute: 720, block_type: "CLINIC" }, as: PracticeManager, captures: { t3: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${t3}/activate", payload: {}, as: PracticeManager }
          trigger:
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: OnboardingDirector, captures: { cred: "$.data.credential_status", train: "$.data.training_status", prac: "$.data.practice_status", post: "$.data.posture", mins: "$.data.weekly_active_minutes" } }
          assert:
            - "OnboardingCase.${case_id}.training_status == COMPLETE while credential_status == NOT_STARTED (dimensions evolved independently)"
            - "OnboardingCase.${case_id}.practice_status == READY and weekly_active_minutes == 1200"
            - "OnboardingCase.${case_id}.posture == CREDENTIALING (the incomplete credential dimension dominates the gate despite training COMPLETE and practice READY)"

  - rule_id: transitive_cascade
    instances:
      - name: license_expiry_cascade_freezes_panel
        grounds:
          - state_machines.CredentialItem.APPROVED_to_EXPIRED
          - state_machines.CredentialItem.APPROVED_to_LAPSED
          - state_machines.Panel.OPEN_to_FROZEN
          - entities.OnboardingCase.fields.posture
        distinguishing_aspect: |
          Depth-5 cascade originating from the epoch-sweep trigger (a different trigger than the
          template-retire instance): license EXPIRED -> direct dependent DEA (APPROVED) becomes
          LAPSED -> DEA's own dependent payer enrollment (APPROVED) becomes LAPSED via the
          dependent's own dependency rule -> case credential_status COMPLETE -> BLOCKED ->
          posture LIVE -> CREDENTIALING -> panel OPEN -> FROZEN. Each hop is caused by the
          previous hop, not by the sweep directly.
        test_recipe:
          setup:
            - "Full go-live: executed offer (start 2027-06-01), credential chain license <- DEA <- Medicare payer all APPROVED (license expires_on 2027-08-01, DEA expires_on 2028-06-01), training COMPLETE, 1200 weekly CLINIC minutes ACTIVE, clock advanced 2027-06-01, panel OPEN (physician ACTIVE, posture LIVE)"
            - "Logical clock then advanced to 2027-08-02 (past the license expiry only)"
