  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agency_request_revision_loop_returns_to_submitted_twice
        grounds:
          - state_machines.AgencyRequest.DRAFT_to_SUBMITTED
          - state_machines.AgencyRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.AgencyRequest.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.AgencyRequest.RETURNED_FOR_REVISION_to_SUBMITTED
          - state_machines.AgencyRequest.UNDER_REVIEW_to_ACCEPTED
          - entities.AgencyRequest.fields.revision_count
        distinguishing_aspect: |
          Non-linearity of the CYCLIC kind: AgencyRequest re-enters SUBMITTED from
          RETURNED_FOR_REVISION twice, so the same row occupies SUBMITTED three times,
          revision_count reaches exactly 2, and only the third pass leaves via ACCEPTED —
          a terminal state that then rejects a fourth submit with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Agency DOE registered; BudgetCycle 2027 in phase DEVELOPMENT"
            - "One DRAFT AgencyRequest for that agency with base_budget_cents 1000000000 and no decision packages"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/return-for-revision"
              payload: { reason: "first pass: understate base" }
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/return-for-revision"
              payload: { reason: "second pass: fix FTE table" }
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          assert:
            - "AgencyRequest.${req_id}.status == ACCEPTED after the accept call"
            - "AgencyRequest.${req_id}.revision_count == 2"
            - "AgencyRequest.${req_id}.last_return_reason == \"second pass: fix FTE table\""
            - "AgencyRequest.${req_id}.total_request_cents == 1000000000"
            - "the final POST /fiscal/agency-requests/${req_id}/submit returns HTTP 409 with error_id == ERR_INVALID_STATE"
            - "AgencyRequest.${req_id}.revision_count == 2 after the rejected fourth submit"

      - name: appropriation_authority_and_cash_dimensions_move_independently
        grounds:
          - state_machines.Appropriation.CASH_UNRELEASED_to_CASH_PARTIALLY_RELEASED
          - state_machines.Appropriation.CASH_UNRELEASED_to_CASH_FROZEN
          - state_machines.Appropriation.CASH_FROZEN_to_CASH_PARTIALLY_RELEASED
          - state_machines.Appropriation.CASH_PARTIALLY_RELEASED_to_CASH_UNRELEASED
          - entities.Appropriation.fields.pre_freeze_cash_status
        distinguishing_aspect: |
          Non-linearity of the PARALLEL kind on a different entity than the AgencyRequest
          instance: four consecutive cash-dimension transitions (release, freeze, unfreeze,
          recall) leave authority_status == ENACTED and available_authority_cents ==
          2000000000 untouched, and unfreeze RECOMPUTES cash_status from released_cents
          rather than restoring pre_freeze_cash_status.
