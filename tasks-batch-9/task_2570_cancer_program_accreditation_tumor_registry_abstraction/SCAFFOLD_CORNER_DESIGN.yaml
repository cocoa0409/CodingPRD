            - call: "POST /cancer-registry/submissions/${sub_id}/items/${item_id}/resolve"
              payload: { resolution_note: "Corrected again" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { e5: $.data.error_id }
          assert:
            - "the DRAFT retransmit returns HTTP 409 with data.error_id == ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION and resubmission_round stays 0"
            - "re-adding the same case while DRAFT returns HTTP 409 with data.error_id == ERR_CASE_ALREADY_IN_SUBMISSION, total_case_count stays 1 and the version stays ${sub_v1}"
            - "the DRAFT edit-results returns HTTP 409 with data.error_id == ERR_SUBMISSION_NOT_TRANSMITTED and the item is still edit_status PENDING"
            - "transmit returns HTTP 200 (submission_state TRANSMITTED) and the case's submission_state becomes SUBMITTED"
            - "adding a case to the TRANSMITTED submission returns HTTP 409 with data.error_id == ERR_SUBMISSION_NOT_DRAFT - the priority-40 state rule outranks the priority-61 duplicate-case rule for the very same request"
            - "the EDIT_FAILED batch drives submission_state to EDITS_RETURNED with failed_item_count == 1 and assessment_due_cents == 0 (nothing late against the 2026-12-31 deadline)"
            - "the first resolve returns HTTP 200 with edit_status == RESOLVED, failed_item_count == 0 and edit_codes still [\"E-1004\"]"
            - "the second resolve returns HTTP 409 with data.error_id == ERR_ITEM_NOT_FAILED and failed_item_count stays 0"

      - name: deficiency_response_and_review_on_wrong_states_each_return_their_own_code
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_DEFICIENCY_NOT_UNDER_REVIEW]
          - errors[ERR_DEFICIENCY_NOT_RESPONDABLE]
          - state_machines.Deficiency.deficiency_state
        distinguishing_aspect: |
          Response and review strictly alternate: reviewing a CITED deficiency that nobody answered
          yet is refused, and once the review ACCEPTS it the deficiency is terminal, so a further
          response is refused too - the two errors bracket the same RESPONSE_SUBMITTED window from
          both sides.
        test_recipe:
          setup:
            - "One MINOR deficiency cited 2026-08-01 against an accredited program."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-2.3", severity: "MINOR", cited_on: "2026-08-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "ACCEPTED", reviewer_notes: "Nothing filed yet" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "Conference calendar published", evidence_reference: "CAL-1" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "ACCEPTED", reviewer_notes: "Accepted" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "Extra evidence", evidence_reference: "CAL-2" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { e2: $.data.error_id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "REJECTED", reviewer_notes: "Second thoughts" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { e3: $.data.error_id }
          assert:
            - "reviewing the CITED deficiency returns HTTP 409 with data.error_id == ERR_DEFICIENCY_NOT_UNDER_REVIEW and deficiency_state stays CITED with reviewer_notes null"
            - "the MINOR deficiency's response_due_date is 2026-08-31 and the response moves it to RESPONSE_SUBMITTED"
            - "the ACCEPTED review moves it to RESOLVED with escalation_count == 0 and the program's open_critical_deficiency_count == 0"
            - "the post-resolution response returns HTTP 409 with data.error_id == ERR_DEFICIENCY_NOT_RESPONDABLE and response_narrative is still 'Conference calendar published'"
            - "the second review returns HTTP 409 with data.error_id == ERR_DEFICIENCY_NOT_UNDER_REVIEW and deficiency_state is still RESOLVED (terminal, no re-opening)"

      - name: project_open_on_a_meeting_measure_and_credit_on_a_scheduled_session_are_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_PROJECT_NOT_REQUIRED]
          - errors[ERR_SESSION_NOT_HELD]
          - calculations.quality_measure_performance
        distinguishing_aspect: |
          Both refusals protect a workflow from being entered early rather than late: a measure at
          exactly 85.0 against an 80.0 threshold is MEETS, so no improvement project may be opened
          (and the code is ERR_PROJECT_NOT_REQUIRED, not ERR_MEASURE_STATE_INVALID), and a session
          that was never held cannot be credited even with quorum-worthy attendance recorded.
        test_recipe:
          setup:
            - "One evaluated quality measure at 85.0% against an 80.0% threshold, and one SCHEDULED conference session that was never held."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "CSTC", measurement_year: 2026, threshold_pct: 80.0 }
              as: RegistryManager
              captures: { meas_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures/${meas_id}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_I", eligible_case_count: 20, compliant_case_count: 17 }, { stage_group: "STAGE_II", eligible_case_count: 20, compliant_case_count: 17 }] }
              as: RegistryManager
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-09-10T13:00:00Z", end_at: "2026-09-10T14:30:00Z", required_disciplines: ["SURGERY"] }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { sess_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-SURG-1", discipline: "SURGERY", attended_minutes: 60, is_required_coordinator: true }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          trigger:
            - call: "POST /cancer-registry/quality-measures/${meas_id}/improvement-project"
              payload: { action: "OPEN", project_title: "Unnecessary PI project", target_rate_pct: 95.0 }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/credit"
              payload: { disposition: "CREDIT", credit_note: "Looked fine on paper" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { e2: $.data.error_id }
          assert:
            - "the evaluation stored performance_rate_pct == 85.0, pooled_rate_pct == 85.0, included_strata_count == 2 and performance_state == MEETS (85.0 < 80.0 + 10.0 so not EXCEEDS)"
            - "improvement-project OPEN returns HTTP 409 with data.error_id == ERR_PROJECT_NOT_REQUIRED and project_title / target_rate_pct stay null"
            - "credit returns HTTP 409 with data.error_id == ERR_SESSION_NOT_HELD, session_state is still SCHEDULED and cases_presented_count is still null"
            - "the program's credited_sessions_12mo is still 0 and conference_frequency_compliant is still false"

      - name: contradicting_the_suggested_reportability_without_an_override_reason_is_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED]
          - calculations.reportability_determination
          - endpoints[POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision]
        distinguishing_aspect: |
          The override reason is demanded only when the registrar disagrees with the computed
          suggestion, so the identical NON_REPORTABLE decision is refused on a MALIGNANT_3 entry
          (suggested REPORTABLE) and accepted once a reason is supplied - and accepted with no reason
          at all on an entry the engine already suggested NON_REPORTABLE.
        test_recipe:
          setup:
            - "Two entries on one source: a MALIGNANT_3 breast entry (suggested REPORTABLE) and a BENIGN_0 non-CNS entry (suggested NON_REPORTABLE)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_mal: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0002", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8140/0", behavior_code: "BENIGN_0", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_ben: $.data.id }
          trigger:
            - call: "POST /cancer-registry/casefinding-entries/${entry_mal}/reportability-decision"
              payload: { decision: "NON_REPORTABLE", decision_reason_code: "REGISTRAR_JUDGEMENT" }
              as: RegistryManager
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_mal}/reportability-decision"
              payload: { decision: "NON_REPORTABLE", decision_reason_code: "REGISTRAR_JUDGEMENT", override_reason_code: "PATHOLOGY_AMENDED_TO_BENIGN" }
              as: RegistryManager
            - call: "POST /cancer-registry/casefinding-entries/${entry_ben}/reportability-decision"
              payload: { decision: "NON_REPORTABLE", decision_reason_code: "BENIGN_NON_CNS" }
              as: RegistryManager
          assert:
            - "entry_mal was created with suggested_reportability == REPORTABLE and suggested_reason_code == SEER_REPORTABLE_BEHAVIOR; entry_ben with NON_REPORTABLE and BENIGN_NON_CNS"
            - "the un-justified contradiction returns HTTP 422 with data.error_id == ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED and entry_mal stays PENDING_REVIEW with decision_reason_code null"
            - "the justified contradiction returns HTTP 200 with reportability_state == NON_REPORTABLE, override_reason_code == PATHOLOGY_AMENDED_TO_BENIGN and created_case_id == null"
            - "the agreeing decision on entry_ben returns HTTP 200 with reportability_state == NON_REPORTABLE and override_reason_code == null (no justification demanded)"
            - "GET /cancer-registry/cases?program_id=${prog_id} reports total_count == 0 - neither decision minted a case"

      - name: rework_pending_case_demands_a_valid_supersede_target
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_SUPERSEDE_TARGET_REQUIRED]
          - errors[ERR_SUPERSEDE_TARGET_INVALID]
          - state_machines.TumorCase.case_state
        distinguishing_aspect: |
          REWORK_PENDING is only reachable through a CRITICAL_FAIL audit on an already-approved
          abstraction, and it is the single state where the abstraction create call changes shape: the
          previously optional supersedes_abstraction_id becomes mandatory (422), must point at an
          abstraction on THIS case (a DRAFT on a different case is refused with a different code), and
          only then does the replacement abstract open.
        test_recipe:
          setup:
            - "Canonical fixture through QA approval on case_1, plus a second assigned case carrying a DRAFT abstraction abst_2, then a CRITICAL_FAIL audit on abst_1 that drives case_1 back to REWORK_PENDING."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
