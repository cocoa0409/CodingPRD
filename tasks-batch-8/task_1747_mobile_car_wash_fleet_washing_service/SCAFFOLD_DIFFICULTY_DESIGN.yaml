            - { call: "POST /fleet-wash/weather/evaluations", payload: { evaluation_date: "2026-08-21", forecast_low_f: 33, precip_probability_pct: 0 }, as: Dispatcher, captures: { ev2_freeze: $.data.freeze } }
            - { call: "GET /fleet-wash/routes/${ra_id}", payload: {}, as: Dispatcher, captures: { ra_status: $.data.status } }
            - { call: "GET /fleet-wash/routes/${rb_id}", payload: {}, as: Dispatcher, captures: { rb_status: $.data.status } }
          assert:
