              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "23 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id, comp0: $.data.data_completeness_pct } }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { comp_baseline: $.data.data_completeness_pct } }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
          trigger:
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { comp1: $.data.data_completeness_pct } }
            - { call: "POST /v1/consent-grants/${cg2}/revoke", payload: {}, as: TenantRep, as_user_id: "${u2}" }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { comp2: $.data.data_completeness_pct } }
          assert:
            - "at creation (no consents): data_completeness_pct == 20.00 (common area 10000/50000)"
            - "after the u1 grant (pre-pair baseline): data_completeness_pct == 60.00 (captured comp_baseline); after u2 grant (forward action): 90.00"
            - "after u2 revoke (compensating action): data_completeness_pct == 60.00 exactly — the grant+revoke pair conserves consented floor area"

      - name: usage_void_with_identical_replacement_conserves_kbtu
        grounds:
          - state_machines.UsageRecord.ACTIVE_to_VOIDED
          - calculations.whole_building_kbtu_aggregation
        distinguishing_aspect: |
          Conserved quantity of a different type (energy total, not floor area):
          voiding record R2 with a byte-identical replacement leaves the
          account's and report's ACTIVE kBtu total at exactly 511800 — forward
          and compensating writes cancel with zero drift.
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN; building b1 50000 sqft OFFICE; ELECTRICITY account acc1"
            - "R1 100000 kWh Jan (341200 kBtu); R2 50000 kWh Feb (170600 kBtu); report rep1 DRAFT with aggregated_kbtu 511800"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner S", contact_email: "os@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "24 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/utility-accounts", payload: { account_number: "E-1", commodity: "ELECTRICITY" }, as: BuildingOwner, as_user_id: "${o1}", captures: { acc1: $.data.id } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2027-02-01T00:00:00Z", consumption_value: 100000 }, as: UtilityAgent, captures: { r1: $.data.id } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-02-01T00:00:00Z", period_end: "2027-03-01T00:00:00Z", consumption_value: 50000 }, as: UtilityAgent, captures: { r2: $.data.id } }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id, agg0: $.data.aggregated_kbtu } }
          trigger:
            - { call: "POST /v1/usage-records/${r2}/void", payload: { reason: "Correction re-keyed identically", replacement_period_start: "2027-02-01T00:00:00Z", replacement_period_end: "2027-03-01T00:00:00Z", replacement_consumption_value: 50000 }, as: UtilityAgent, captures: { r2_status: $.data.status } }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { agg1: $.data.aggregated_kbtu } }
            - { call: "GET /v1/usage-records", payload: { replaces_usage_record_id: "${r2}" }, as: ComplianceOfficer, captures: { rep_id: "$.data[0].id", rep_kbtu: "$.data[0].kbtu", rep_status: "$.data[0].status" } }
          assert:
            - "before: aggregated_kbtu == 511800 (341200 + 170600)"
            - "after void+identical-replacement: aggregated_kbtu == 511800 (invariant conserved)"
            - "R2 is VOIDED; the replacement is ACTIVE with kbtu == 170600 and replaces_usage_record_id == ${r2}"
