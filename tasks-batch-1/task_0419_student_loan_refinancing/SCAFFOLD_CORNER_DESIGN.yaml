        claim_type: immediate
        grounds:
          - calculations.pool_capacity_check
          - entities.AbsPool.fields.committed_principal_cents
        distinguishing_aspect: "consistency_model is immediate: the pool's committed_principal_cents reflects the funded loan's principal as soon as GET /abs-pools/{id} is read right after funding, in the same synchronous flow (no lag)."
