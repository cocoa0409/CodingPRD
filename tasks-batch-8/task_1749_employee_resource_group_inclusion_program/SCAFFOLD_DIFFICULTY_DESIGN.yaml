            - "Program OPEN; group 'Recruit Squad' ACTIVE (10 founding members, sponsor emp_sp4 assigned)"
            - "Venue capacity 100; event 'Career Fair' RECRUITING capacity 10 on 2026-08-10T10:00:00Z-12:00:00Z, PUBLISHED"
