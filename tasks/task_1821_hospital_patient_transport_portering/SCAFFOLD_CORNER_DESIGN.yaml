scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: request_creation_with_defaults
        claim_type: creation
        grounds: [entities.TransportRequest]
        distinguishing_aspect: "Minimal POST creates a QUEUED request with all system defaults applied and a conforming success envelope."
        test_recipe:
          setup: ["Locations W4 and IMG exist; logical clock never set, so it reads the startup default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r_st: $.data.status, r_post: $.data.sla_posture } }
          assert:
            - "response envelope: response_type == object and meta.api_request_id present"
            - "status == QUEUED (${r_st}) and sla_posture == ON_TRACK (${r_post})"
            - "defaults: oxygen_required == false, isolation_precaution == NONE, escalation_count == 0, decline_count == 0, release_count == 0, offer_seq_count == 0"
            - "requested_by == clin-1; version == 1; created_at == 2026-08-01T00:00:00.000Z (logical clock default)"

      - name: request_missing_patient_ref_returns_400
        claim_type: required_fields
        grounds: [entities.TransportRequest.fields.patient_ref, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required patient_ref is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Locations W4 and IMG exist"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, http 400"

      - name: request_invalid_priority_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.TransportRequest.fields.priority, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "priority CRITICAL is not in {ROUTINE, URGENT, STAT} and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Locations W4 and IMG exist"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "CRITICAL", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, http 400"

      - name: request_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.TransportRequest]
        distinguishing_aspect: "Client-supplied id and created_at are ignored; the server mints a UUID and stamps the logical clock."
        test_recipe:
          setup: ["Locations W4 and IMG exist; clock at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { id: "00000000-0000-4000-8000-000000000000", created_at: "1999-01-01T00:00:00Z", patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r_ca: $.data.created_at } }
          assert:
            - "201; returned id != 00000000-0000-4000-8000-000000000000"
            - "created_at == 2026-08-01T00:00:00.000Z, not 1999-01-01"

      - name: transporter_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Transporter]
        distinguishing_aspect: "GET /transport/transporters/{id} returns the stored record including defaults and system fields."
        test_recipe:
          setup: ["Location HUB exists; T1 created with WHEELCHAIR cert and oxygen_certified true"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"], oxygen_certified: true }, as: TransportSupervisor, captures: { t1: $.data.id } }
          trigger:
            - { call: "GET /transport/transporters/${t1}", as: TransportDispatcher, captures: { t_name: $.data.name, t_st: $.data.status, t_cur: $.data.current_location_id } }
          assert:
            - "name == T One, certified_equipment == [WHEELCHAIR], oxygen_certified == true, isolation_certified == false (default)"
            - "status == OFF_SHIFT (initial state) and current_location_id == ${loc_h} (initialized to home)"

      - name: request_get_missing_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /transport/requests/11111111-2222-4333-8444-555555555555", as: TransportDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: request_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List responses expose limit/offset/total_count/has_more; limit=1 pages deterministically over 2 requests."
        test_recipe:
          setup: ["Two requests R1 then R2 exist (created in that order); locations W4, IMG"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P2", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "URGENT", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /transport/requests", payload: { limit: 1, offset: 0 }, as: TransportDispatcher, captures: { page1_first: "$.data[0].id" } }
            - { call: "GET /transport/requests", payload: { limit: 1, offset: 1 }, as: TransportDispatcher, captures: { page2_first: "$.data[0].id" } }
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true; first item is ${r1} (created_at ASC default order)"
            - "page 2: exactly 1 item (${r2}), has_more == false, total_count == 2"

      - name: request_list_filter_origin_location
        claim_type: listing
        grounds: [entities.TransportRequest.fields.origin_location_id]
        distinguishing_aspect: "origin_location_id filter returns only requests whose origin matches — FK-filtered listing."
        test_recipe:
          setup: ["R1 originates at W4, R2 originates at HUB; both QUEUED"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P2", origin_location_id: "${loc_h}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /transport/requests", payload: { origin_location_id: "${loc_a}" }, as: TransportDispatcher, captures: { hit: "$.data[0].id" } }
          assert:
            - "exactly 1 result and it is ${r1}; ${r2} excluded"

      - name: task_type_derived_from_isolation
        claim_type: computed_fields
        grounds: [entities.CleaningTask.fields.task_type, entities.EquipmentAsset.fields.isolation_contaminated]
        distinguishing_aspect: "A CONTACT-isolation completion derives a DEEP task and sets isolation_contaminated true; both clear only on VERIFIED."
        test_recipe:
          setup:
            - "CONTACT WHEELCHAIR trip completed by T1 (isolation_certified); edges 8/12 and 10/16; clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"], isolation_certified: true }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR", isolation_precaution: "CONTACT" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
          trigger:
            - { call: "GET /transport/cleaning-tasks", payload: { transport_request_id: "${r1}" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct_type: "$.data[0].task_type", ct_st: "$.data[0].status" } }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { a_contam: $.data.isolation_contaminated, a_st: $.data.status } }
          assert:
            - "CleaningTask.task_type == DEEP (${ct_type}) and status == PENDING (${ct_st})"
            - "EquipmentAsset.isolation_contaminated == true and status == AWAITING_CLEANING"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: complete_from_assigned_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.TransportRequest.IN_TRANSIT_to_COMPLETED, "errors[ERR_INVALID_REQUEST_STATE]"]
        distinguishing_aspect: "COMPLETE is valid only from IN_TRANSIT; invoking it from ASSIGNED (skipping ARRIVE/PICKUP) fails."
        test_recipe:
          setup: ["T1 ON_SHIFT WHEELCHAIR; asset WC-001; R1 accepted (ASSIGNED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST_STATE (ASSIGNED, not IN_TRANSIT)"

      - name: cancel_completed_returns_409
        claim_type: terminal_lockdown
        grounds: [state_machines.TransportRequest, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A COMPLETED request is terminal; close CANCEL fails with ERR_ALREADY_TERMINAL and nothing mutates."
        test_recipe:
          setup: ["Full PORTER_ONLY trip completed by T1 (locs HUB/W4/IMG, edges 8/12 + 10/16)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /transport/requests/${r1}/close", payload: { action: "CANCEL", reason: "TOO_LATE" }, as: TransportDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL, http 409"

      - name: cleaning_advance_invalid_state_covered
        claim_type: invalid_transition
        grounds: [state_machines.CleaningTask, "errors[ERR_INVALID_CLEANING_STATE]"]
        excluded_because:
          difficulty_instance: state_vs_safety_on_cleaning_finish
          rationale: "The PENDING -> AWAITING_VERIFICATION rejection is asserted there as the winning half of the priority conflict."

      - name: offer_double_respond_returns_409
        claim_type: idempotency
        grounds: [state_machines.DispatchOffer, "errors[ERR_INVALID_OFFER_STATE]"]
        distinguishing_aspect: "Responding twice to the same offer: the second ACCEPT hits a terminal offer and fails with ERR_INVALID_OFFER_STATE."
        test_recipe:
          setup: ["T1 ON_SHIFT; R1 QUEUED PORTER_ONLY with PENDING offer O1 to T1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
          trigger:
