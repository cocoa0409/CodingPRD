            - "after the refusal SelfStudy.${ss_id}.state == DRAFT, submitted_at == null, revision_round == 0"
            - "the third trigger, at exactly self_study_due_at, returns 200 with state == SUBMITTED and submitted_at == 2026-09-01T00:00:00.000Z"
            - "ReviewCycle.${cycle_id}.state is still SELF_STUDY_OPEN — SUBMIT does not cascade the cycle"

      - name: self_study_submit_with_missing_sections_rejected_then_patched
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=20]
          - errors[ERR_SELF_STUDY_SECTIONS_INCOMPLETE]
          - entities.SelfStudy.fields.missing_section_codes
          - endpoints["PATCH /provost/self-studies/{id}"]
        distinguishing_aspect: |
          The shortfall is echoed on missing_section_codes before and after the
          fix, so the same row transitions from refused to accepted with no
          state change in between: a PATCH that adds the one missing code empties
          missing_section_codes and the identical SUBMIT then succeeds. Extra
          codes beyond the required set are harmless.
        test_recipe:
          setup:
            - "Program HIST-BA with a cycle requiring S1, S2 and S3, and a DRAFT self-study covering S1, S3 and the extra code S9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1", "S2", "S3"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Partial self-study", section_codes: ["S1", "S3", "S9"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
          trigger:
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { err: $.data.error_id }
            - call: "PATCH /provost/self-studies/${ss_id}"
              payload: { section_codes: ["S1", "S2", "S3", "S9"], attestation_note: "All three required sections are now attached." }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
          assert:
            - "the first trigger returns 422 with data.error_id == ERR_SELF_STUDY_SECTIONS_INCOMPLETE"
            - "at that point SelfStudy.${ss_id}.missing_section_codes == [S2] — the extra S9 is not reported as a problem"
            - "the PATCH returns 200 with section_codes == [S1, S2, S3, S9], missing_section_codes == [], attestation_note stored, and state still DRAFT"
            - "the third trigger returns 200 with state == SUBMITTED and submitted_at == 2026-08-01T00:00:00.000Z"
            - "SelfStudy.${ss_id}.revision_round == 0 — a refused SUBMIT and a PATCH are not RETURN and do not consume a revision round"

      - name: reviewer_with_a_conflict_cannot_be_scheduled_on_that_program
