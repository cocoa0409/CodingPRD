# =============================================================================
# task_1076 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules (§0.5) × 2 instances each = 18 instances.
# Every setup_api_calls chain drives empty-DB -> the setup state using only §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_estimated_vs_actual_trueup
        grounds:
          - calculations.estimated_commission
          - calculations.actual_commission_trueup
          - state_machines.CommissionStatement.APPROVED_to_TRUED_UP
          - entities.CommissionStatement.fields.actual_gross_cents
        distinguishing_aspect: |
          On the Contract/CommissionStatement domain the estimated gross (30000)
          and the actual trued-up gross (29972) diverge, producing a 28-cent
          clawback — a different entity domain from the DR-incentive dual variant.
        test_recipe:
          setup:
            - "One AGENT, two MANAGERs (approval_limit 100000000), one Customer, one ACTIVE ELECTRICITY Supplier."
            - "Account (est 60000 kWh) VERIFIED under a SIGNED USAGE_AND_ENROLL LOA; one is_actual=false usage row for verify."
            - "RFP OPEN; one Supplier quote (rate 60, adder 5, term 12) SHORTLISTED and AWARDED into a Contract."
            - "Contract accepted, approved by MGR1, enrollment submitted (PROVISIONAL commission gross 30000) and CONFIRMED -> ACTIVE."
            - "Four is_actual=true usage rows of 14985 kWh each on the account; statement APPROVED by MGR1."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr One", email: "m1@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr1_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr Two", email: "m2@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr2_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-1", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, source: "BROKER_ESTIMATE", is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /rfps/${rfp_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_v: "$.data.version" } }
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 60, term_months: 12, broker_adder_mills: 5, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/shortlist", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts", payload: { rfp_id: "${rfp_id}", account_id: "${acct_id}", estimated_annual_usage_kwh: 60000, start_date: "2026-07-01T00:00:00Z", requested_switch_date: "2026-07-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { contract_id: "$.data.id" } }
            - { call: "POST /contracts/${contract_id}/customer-decision", payload: { decision: "ACCEPT" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /contracts/${contract_id}/approve", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
            - { call: "POST /contracts/${contract_id}/submit-enrollment", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts/${contract_id}/enrollment-result", payload: { result: "CONFIRM" }, as: OpsAdmin }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2026-01", usage_kwh: 14985, is_actual: true }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2026-02", usage_kwh: 14985, is_actual: true }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2026-03", usage_kwh: 14985, is_actual: true }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2026-04", usage_kwh: 14985, is_actual: true }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /commission-statements", payload: { contract_id: "${contract_id}" }, as: BrokerManager, as_user_id: "${mgr1_id}", captures: { stmt_id: "$.data[0].id" } }
            - { call: "POST /commission-statements/${stmt_id}/approve", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
          trigger:
            - { call: "POST /commission-statements/${stmt_id}/true-up", payload: {}, as: BrokerManager, as_user_id: "${mgr2_id}" }
          assert:
            - "CommissionStatement.${stmt_id}.gross_commission_cents == 30000"
            - "CommissionStatement.${stmt_id}.actual_gross_cents == 29972"
            - "CommissionStatement.${stmt_id}.clawback_cents == 28"
            - "CommissionStatement.${stmt_id}.net_commission_cents == 29972"
            - "CommissionStatement.${stmt_id}.basis == ACTUAL"
            - "CommissionStatement.${stmt_id}.status == TRUED_UP"

      - name: dr_committed_vs_performed_incentive
        grounds:
          - calculations.dr_provisional_incentive
          - calculations.dr_settled_incentive
          - state_machines.DemandResponseEnrollment.PERFORMED_to_SETTLED
          - entities.DemandResponseEnrollment.fields.settled_incentive_cents
        distinguishing_aspect: |
          On the DemandResponseEnrollment domain the provisional incentive
          (450000, committed 100 kW) and the settled incentive (320000, performed
          80 kW with a 20-kW shortfall penalty) diverge — a different entity
          domain from the commission dual variant.
        test_recipe:
          setup:
            - "Account made ENROLLED via a fully-awarded, CONFIRMED (ACTIVE) contract (reuses the commission happy path, term 12)."
            - "A DR enrollment committed_kw 100 at 4500 cents/kW (provisional 450000), ACTIVE, clock at 2026-08-15, performance recorded at 80 kW."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr One", email: "m1@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr1_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-1", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /rfps/${rfp_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_v: "$.data.version" } }
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 60, term_months: 12, broker_adder_mills: 5, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/shortlist", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts", payload: { rfp_id: "${rfp_id}", account_id: "${acct_id}", estimated_annual_usage_kwh: 60000, start_date: "2026-07-01T00:00:00Z", requested_switch_date: "2026-07-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { contract_id: "$.data.id" } }
            - { call: "POST /contracts/${contract_id}/customer-decision", payload: { decision: "ACCEPT" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /contracts/${contract_id}/approve", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
            - { call: "POST /contracts/${contract_id}/submit-enrollment", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts/${contract_id}/enrollment-result", payload: { result: "CONFIRM" }, as: OpsAdmin }
            - { call: "POST /dr-enrollments", payload: { account_id: "${acct_id}", program_name: "Summer DR", season_start: "2026-08-01T00:00:00Z", season_end: "2026-10-31T00:00:00Z", committed_kw: 100, incentive_per_kw_cents: 4500 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { dr_id: "$.data.id" } }
            - { call: "POST /dr-enrollments/${dr_id}/activate", payload: {}, as: OpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /dr-enrollments/${dr_id}/record-performance", payload: { performed_kw: 80 }, as: OpsAdmin }
          trigger:
            - { call: "POST /dr-enrollments/${dr_id}/settle", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
          assert:
            - "DemandResponseEnrollment.${dr_id}.provisional_incentive_cents == 450000"
            - "DemandResponseEnrollment.${dr_id}.settled_incentive_cents == 320000"
            - "DemandResponseEnrollment.${dr_id}.status == SETTLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commission_tiered_multiplier_and_clamp
        grounds:
          - calculations.estimated_commission
          - entities.Contract.fields.term_months
          - entities.CommissionStatement.fields.gross_commission_cents
        distinguishing_aspect: |
          MODE (a): >=3 inputs (usage 120000, adder 4, term 24) with a non-linear
          term-tier selection (24 -> x1.10) then a min/max clamp: base 48000 ->
          52800. Distinct from the mode-(b) rounding-order instance.
        test_recipe:
          setup:
            - "AGENT, MANAGER (approval_limit 100000000), Customer, ACTIVE Supplier."
            - "Account est 120000 kWh, VERIFIED; RFP OPEN; quote rate 55 adder 4 term 24 SHORTLISTED and AWARDED."
            - "Contract accepted and approved; enrollment submitted -> PROVISIONAL statement created."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr One", email: "m1@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr1_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Beta Inc", email: "c@beta.co", segment: "LARGE_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-2", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 120000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 10000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 24, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /rfps/${rfp_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_v: "$.data.version" } }
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 55, term_months: 24, broker_adder_mills: 4, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/shortlist", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts", payload: { rfp_id: "${rfp_id}", account_id: "${acct_id}", estimated_annual_usage_kwh: 120000, start_date: "2026-07-01T00:00:00Z", requested_switch_date: "2026-07-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { contract_id: "$.data.id" } }
            - { call: "POST /contracts/${contract_id}/customer-decision", payload: { decision: "ACCEPT" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /contracts/${contract_id}/approve", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
          trigger:
            - { call: "POST /contracts/${contract_id}/submit-enrollment", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /commission-statements", payload: { contract_id: "${contract_id}" }, as: BrokerManager, as_user_id: "${mgr1_id}", captures: { stmt_id: "$.data[0].id" } }
          assert:
            - "CommissionStatement.${stmt_id}.gross_commission_cents == 52800"
            - "CommissionStatement.${stmt_id}.net_commission_cents == 52800"
            - "CommissionStatement.${stmt_id}.status == PROVISIONAL"

      - name: commission_actual_rounding_order_pinned
        grounds:
          - calculations.actual_commission_trueup
          - entities.CommissionStatement.fields.actual_gross_cents
          - state_machines.CommissionStatement.APPROVED_to_TRUED_UP
        distinguishing_aspect: |
          MODE (b): rounding ORDER is pinned — round each month to whole cents
          then sum (4 x 7493 = 29972), NOT sum-then-round (which yields 29970).
