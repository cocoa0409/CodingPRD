  - rule: cross_entity_state_dependency
    instances:
      - name: quoting_gated_on_plan_amendment_scope_not_plan_state
        grounds:
          - state_machines.BuyoutTranche.DRAFT_to_QUOTING
          - state_machines.PensionPlan.SETTLEMENT_AUTHORIZED_to_ONGOING
          - validations.priority_42
          - errors.ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED
        distinguishing_aspect: |
          The gate on POST /prt/tranches/{id}/quoting is not "is the plan
          authorized" but "does the plan's amendment_scope cover the buyout
          channel". A plan sitting squarely in SETTLEMENT_AUTHORIZED with
          amendment_scope LUMP_SUM_ONLY still rejects quoting with
          ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED, so an implementation that only
          compares plan_status passes nothing here. The instance then rescinds the
          amendment, which cascades the DRAFT tranche to ABANDONED, and repeats the
          identical trigger: the answer changes from the priority-42 cross-entity
          error to the priority-40 own-state error ERR_TRANCHE_STATE_INVALID,
          because the target's own state is now the first thing that fails. Only
          after re-adopting with amendment_scope BOTH and rebuilding a fresh DRAFT
          tranche does the same call succeed. Three different outcomes from one
          unchanged request body, driven entirely by a peer entity's scalar field.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a PensionPlan with an APPROVED HYBRID_WINDOW_AND_BUYOUT strategy"
            - "amendment adopted with amendment_scope LUMP_SUM_ONLY, so plan_status == SETTLEMENT_AUTHORIZED but the buyout channel is not authorized"
            - "one cleansed participant and one ENGAGED independent expert, so every other quoting precondition is satisfied"
