            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client Q", email: "cq@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_q: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "PKG-8", tier_type: "PACKAGE", session_count: 8, price_cents: 80000, duration_days: 56, installment_count_allowed: 3, reschedule_cap: 2 }
              as: PlatformAdmin
              captures: { tier_q: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_q}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_q}"
              captures: { dc_q: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_q}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_q}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 70 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_q}", coach_id: "${coach_a}", program_tier_id: "${tier_q}", discovery_call_id: "${dc_q}", installment_count: 3 }
              as: Client
              as_user_id: "${client_q}"
              captures: { enr_q: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_q}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/refund-requests"
              payload: { enrollment_id: "${enr_q}" }
              as: Client
              as_user_id: "${client_q}"
