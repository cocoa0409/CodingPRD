      - name: chassis_errors_not_matched_then_no_candidate_then_already_matched
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CHASSIS_NOT_MATCHED
          - errors.ERR_NO_MATCHING_CHASSIS
          - errors.ERR_ORDER_ALREADY_MATCHED
        distinguishing_aspect: "The three chassis codes describe three different failures on one arc: releasing a slotted order with no matched chassis is 409, asking for a match when the eligible set is empty is 422, and asking twice once a chassis is held is 409."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit with LINE-T; the order is submitted and slotted, and no ChassisReceipt exists yet."
          setup_api_calls:
            - call: "POST /suppliers"
