            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 100.00, crash_free_sessions_pct: 99.49, content_completeness_pct: 100.00, known_blocker_count: 0, release_notes: "One hundredth of a point short" }
