              as: RefundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: refund_admin_can_open_refund_request_shared_op
        claim_type: rbac_allow
        grounds:
          - roles.RefundAdmin
          - roles.ResortOps
          - endpoints.POST_/refund-requests
        distinguishing_aspect: "POST /refund-requests is a shared op; RefundAdmin may open a refund request (status PENDING), confirming the shared_operations grant."
        test_recipe:
          setup:
