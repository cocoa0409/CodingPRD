      - name: overlapping_forecast_supersedes_the_incumbent_by_system_trigger
        claim_type: valid_transition
        grounds:
          - state_machines.DemandForecast.PUBLISHED_to_SUPERSEDED
          - calculations.fleet_sizing
        distinguishing_aspect: "SUPERSEDED has no client trigger at all: publishing a second overlapping window is what demotes the incumbent, a non-overlapping third window leaves both PUBLISHED, and the superseded row keeps its own recomputed block counts."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE. Forecast F1 covers [06:00,10:00) with 40 trips and peak_factor 1.20."
            - "Each POST /demand-forecasts re-reads the zone version first, since publishing writes to the zone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
