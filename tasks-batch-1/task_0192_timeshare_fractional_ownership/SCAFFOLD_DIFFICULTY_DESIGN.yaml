# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Timeshare & Fractional Ownership — Expert
#
# Canonical resort config used across instances unless overridden:
#   points_per_week_base = 1000
#   annual_fee_cents_per_1000_points = 20000   (i.e. $200 per 1000 points)
#   rescission_days = 7, borrow_surcharge_pct = 0.10
#   delinquency_grace_days = 30, foreclosure_threshold_periods = 2
#   current_use_year = 2026, clock starts at 2026-01-01T00:00:00Z
# Season multipliers: PLATINUM 1.50, GOLD 1.00, SILVER 0.60 -> unit points_value
#   PLATINUM=1500, GOLD=1000, SILVER=600 against base 1000.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: maintenance_fee_provisional_vs_resale_split
        grounds:
          - calculations.maintenance_fee_proration
          - state_machines.MaintenanceFeeInvoice.DRAFT_to_ISSUED
          - state_machines.ResaleTransfer.PENDING_RESCISSION_to_COMPLETED
          - entities.MaintenanceFeeInvoice.fields.amount_cents
        distinguishing_aspect: |
          Same annual_full ($2000 = 200000 cents on a 10000-point contract) yields one number
          when issued provisionally to the original owner (amount_cents=200000) and two
          different per-party numbers on resale-split (seller=65753, buyer=134247); operates on
          the Contract/MaintenanceFeeInvoice billing domain.
        test_recipe:
          setup:
            - "Resort R with base config; clock at 2026-01-01."
            - "Owner SELLER and Owner BUYER at R."
            - "DEEDED POINTS contract C, annual_points_allotment=10000, owner=SELLER, ACTIVE (rescission elapsed)."
            - "ANNUAL invoice for use_year 2026 issued on C -> amount_cents=200000 (provisional full year)."
            - "ResaleTransfer T on C to BUYER, transfer_use_year=2026, transfer_day_of_year=120, signed at 2026-01-01."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, rescission_days: 7 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "Seller", email: "seller@x.com" }
              as: ResortManager
              captures: { seller_id: $.data.id }
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "Buyer", email: "buyer@x.com" }
              as: ResortManager
              captures: { buyer_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${seller_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/issue"
              payload: {}
              as: ResortManager
              captures: { provisional_amount: $.data.amount_cents }
            - call: "POST /resale-transfers"
              payload: { source_contract_id: "${contract_id}", buyer_owner_id: "${buyer_id}", sale_price_cents: 5000000, transfer_use_year: 2026, transfer_day_of_year: 120 }
              as: ResaleAgent
              captures: { transfer_id: $.data.id }
          trigger:
            - call: "POST /resale-transfers/${transfer_id}/complete"
              payload: {}
              as: ResaleAgent
              captures: { new_contract_id: $.data.new_contract_id }
          assert:
            - "Provisional issue: MaintenanceFeeInvoice.${invoice_id}.amount_cents == 200000 before transfer"
            - "After complete: seller invoice ${invoice_id}.amount_cents == 65753"
            - "The buyer's new ISSUED ANNUAL invoice (GET /invoices?contract_id=${new_contract_id}&use_year=2026) has amount_cents == 134247"
            - "65753 + 134247 == 200000 (no drift)"

      - name: delinquency_late_charge_simple_vs_compounding
        grounds:
          - calculations.delinquency_late_charge
          - state_machines.DelinquencyCase.NOTICE_to_LIEN
          - state_machines.DelinquencyCase.LIEN_to_LIEN
          - entities.MaintenanceFeeInvoice.fields.late_charge_cents
          - entities.DelinquencyCase.fields.late_charge_basis
        distinguishing_aspect: |
          On an identical $2000 (200000-cent) delinquent invoice escalated three periods, the
          SIMPLE basis yields late_charge_cents=30000 while COMPOUNDING yields 31525; the divergence
          lives on the DelinquencyCase/late-charge domain, distinct from the resale-fee proration above.
        test_recipe:
          setup:
            - "Resort R; one DEEDED POINTS ACTIVE contract per owner; an ANNUAL invoice amount_cents=200000 issued, due_date 2026-02-01."
            - "Clock advanced past grace (>= 2026-03-03), invoice marked DELINQUENT -> opens DelinquencyCase (NOTICE)."
            - "One case uses late_charge_basis SIMPLE, the other COMPOUNDING (two separate contracts)."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, delinquency_grace_days: 30, foreclosure_threshold_periods: 2 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/issue"
              payload: {}
              as: ResortManager
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-03-10T00:00:00Z" }
              as: ResortManager
            - call: "POST /invoices/${invoice_id}/mark-delinquent"
              payload: {}
              as: ResortManager
            - call: "GET /delinquency-cases?contract_id=${contract_id}"
              as: ComplianceOfficer
              captures: { case_id: $.data.0.id }
          trigger:
            - call: "POST /delinquency-cases/${case_id}/escalate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /delinquency-cases/${case_id}/escalate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /delinquency-cases/${case_id}/escalate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "DelinquencyCase.${case_id}.late_charge_basis default == COMPOUNDING"
            - "After three escalations on the COMPOUNDING case: MaintenanceFeeInvoice.${invoice_id}.late_charge_cents == 31525"
            - "A SIMPLE-basis case escalated three periods on an identical 200000-cent invoice would total late_charge_cents == 30000 (31525 != 30000 proves divergence)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: reservation_points_cost_nonlinear_borrow_branch
        grounds:
          - calculations.reservation_points_cost
          - entities.Reservation.fields.points_cost
          - entities.Reservation.fields.borrowed_points
          - entities.InventoryUnit.fields.season
        distinguishing_aspect: |
          Mode (a): >=3 inputs (season multiplier, base points, lead-time tier, available-balance
          branch) combine non-linearly — a PLATINUM unit (base 1500) booked with only 1000 available
          borrows the 500 shortfall and adds ceil(500*0.10)=50 surcharge -> points_cost=1550,
          borrowed_points=500, a branch the within-balance path never takes.
        test_recipe:
          setup:
            - "Resort R base config; DEEDED POINTS ACTIVE contract C, annual_points_allotment=1000 for use_year 2026; clock at 2026-01-08 (current_use_year 2026)."
            - "PLATINUM unit U (points_value 1500), week 10."
            - "2026 account available_points = 1000 (< 1500 cost). No 2027 account yet; the reservation lazily creates it (allotment 1000) and borrows the 500 shortfall from it."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, borrow_surcharge_pct: 0.10 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Plat", week_number: 10, season: "PLATINUM" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 1000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract_id}&use_year=2026"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { acct_2026_id: $.data.0.id, acct_2026_version: $.data.0.version }
          trigger:
            - call: "POST /reservations"
              payload: { contract_id: "${contract_id}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct_2026_version}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { reservation_id: $.data.id, pc: $.data.points_cost, bp: $.data.borrowed_points }
          assert:
            - "Reservation.${reservation_id}.points_cost == 1550 (1500 + ceil(500*0.10)=50)"
            - "Reservation.${reservation_id}.borrowed_points == 500"
            - "Reservation.${reservation_id}.borrow_source_account_id is the contract's lazily-created 2027 PointsAccount (not null)"

      - name: special_assessment_round_then_distribute
        grounds:
          - calculations.special_assessment_proration
          - state_machines.SpecialAssessment.DRAFT_to_LEVIED
          - entities.MaintenanceFeeInvoice.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — per-contract shares are floored first, then the single
          leftover cent of a 100000-cent assessment split across A(10000 pts)=33333.33 and
          B(20000 pts)=66666.67 goes to B (largest fractional part), giving A=33333, B=66667 rather
          than a sum-then-round result; distinct mode from the non-linear formula above.
        test_recipe:
          setup:
            - "Resort R base config; two DEEDED POINTS ACTIVE contracts A (allotment 10000) and B (allotment 20000), created in that order."
            - "SpecialAssessment SA total_amount_cents=100000, use_year 2026, DRAFT."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "OA", email: "oa@x.com" }
              as: ResortManager
              captures: { owner_a: $.data.id }
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "OB", email: "ob@x.com" }
              as: ResortManager
              captures: { owner_b: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_a}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_a: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_b}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 20000 }
              as: ResortManager
              captures: { contract_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_a}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /contracts/${contract_b}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /special-assessments"
              payload: { resort_id: "${resort_id}", reason: "Roof", total_amount_cents: 100000, use_year: 2026 }
              as: ResortManager
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /special-assessments/${sa_id}/levy"
              payload: { due_date: "2026-04-01T00:00:00Z" }
              as: ResortManager
          assert:
            - "Contract A's SPECIAL_ASSESSMENT invoice (GET /invoices?contract_id=${contract_a}&special_assessment_id=${sa_id}) amount_cents == 33333"
            - "Contract B's SPECIAL_ASSESSMENT invoice (GET /invoices?contract_id=${contract_b}&special_assessment_id=${sa_id}) amount_cents == 66667"
            - "33333 + 66667 == 100000 (conserved; leftover cent went to B by larger fractional part)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_exchange_recall_cycle
        grounds:
          - state_machines.Reservation.CONFIRMED_to_DEPOSITED_TO_EXCHANGE
          - state_machines.ExchangeDeposit.DEPOSITED_to_RECALLED
          - entities.Reservation.fields.status
          - entities.ExchangeDeposit.fields.status
        distinguishing_aspect: |
          Reservation is cyclic: CONFIRMED -> DEPOSITED_TO_EXCHANGE -> (ExchangeDeposit recall) ->
          CONFIRMED, returning to a previously-occupied state — non-linear on the Reservation entity.
        test_recipe:
          setup:
            - "Resort R; DEEDED POINTS ACTIVE contract C allotment 5000; GOLD unit U (1000 pts)."
            - "CONFIRMED reservation on U, then deposited to RCI -> ExchangeDeposit DEPOSITED."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Gold", week_number: 20, season: "GOLD" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract_id}&use_year=2026"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { acct_version: $.data.0.version }
            - call: "POST /reservations"
              payload: { contract_id: "${contract_id}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct_version}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { reservation_id: $.data.id }
            - call: "POST /reservations/${reservation_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /reservations/${reservation_id}/deposit-exchange"
              payload: { exchange_network: "RCI" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { deposit_id: $.data.id }
          trigger:
            - call: "POST /exchange-deposits/${deposit_id}/recall"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "ExchangeDeposit.${deposit_id}.status == RECALLED"
            - "Reservation.${reservation_id}.status == CONFIRMED (returned to a previously-held state)"
            - "InventoryUnit.${unit_id}.status == RESERVED"

      - name: delinquency_foreclose_branch_fork
        grounds:
          - state_machines.DelinquencyCase.LIEN_to_FORECLOSURE
          - state_machines.DelinquencyCase.LIEN_to_TERMINATION
          - entities.Contract.fields.ownership_type
          - entities.DelinquencyCase.fields.status
        distinguishing_aspect: |
          DelinquencyCase forks from LIEN into two branches with divergent side-effects: DEEDED ->
          FORECLOSURE (Contract FORECLOSED) vs RIGHT_TO_USE -> TERMINATION (Contract TERMINATED);
          a branching machine on the DelinquencyCase entity (distinct entity from Reservation above).
        test_recipe:
          setup:
            - "Resort R, foreclosure_threshold_periods=2; a RIGHT_TO_USE POINTS contract C (rtu_expiry_use_year 2030), ACTIVE."
            - "Invoice issued, marked DELINQUENT, case escalated to LIEN twice (escalation_periods=2)."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, delinquency_grace_days: 30, foreclosure_threshold_periods: 2 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "RIGHT_TO_USE", inventory_model: "POINTS", annual_points_allotment: 8000, rtu_expiry_use_year: 2030 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/issue"
              payload: {}
              as: ResortManager
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-03-10T00:00:00Z" }
              as: ResortManager
            - call: "POST /invoices/${invoice_id}/mark-delinquent"
              payload: {}
              as: ResortManager
            - call: "GET /delinquency-cases?contract_id=${contract_id}"
              as: ComplianceOfficer
              captures: { case_id: $.data.0.id }
            - call: "POST /delinquency-cases/${case_id}/escalate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /delinquency-cases/${case_id}/escalate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /delinquency-cases/${case_id}/foreclose"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "DelinquencyCase.${case_id}.status == TERMINATION (RIGHT_TO_USE branch, not FORECLOSURE)"
            - "Contract.${contract_id}.status == TERMINATED"
            - "MaintenanceFeeInvoice.${invoice_id}.status == WRITTEN_OFF"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: foreclose_cascade_depth3_case_contract_invoice
        grounds:
          - state_machines.DelinquencyCase.LIEN_to_FORECLOSURE
          - state_machines.Contract.SUSPENDED_to_FORECLOSED
          - state_machines.MaintenanceFeeInvoice.DELINQUENT_to_WRITTEN_OFF
        distinguishing_aspect: |
          Depth-3 chain originating at foreclose: (1) DelinquencyCase LIEN->FORECLOSURE causes
          (2) Contract SUSPENDED->FORECLOSED, which itself causes (3) the contract's DELINQUENT
          invoices -> WRITTEN_OFF. Each link is caused by the previous, not by the foreclose call.
        test_recipe:
          setup:
            - "Resort R, foreclosure_threshold_periods=2; DEEDED POINTS contract C ACTIVE; invoice ISSUED then DELINQUENT; case escalated to LIEN with escalation_periods=2."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, delinquency_grace_days: 30, foreclosure_threshold_periods: 2 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
