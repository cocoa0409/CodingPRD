  - rule_id: transitive_cascade
    instances:
      - name: material_reprocess_drives_five_link_chain_to_provisional_trade_rollback
        grounds:
          - state_machines.PricingErrorCase.MATERIAL_APPROVED_to_REPROCESSED
          - state_machines.NavRecord.UNDER_ERROR_REVIEW_to_CORRECTED
          - state_machines.Trade.PRICED_FINAL_to_RESTATED
          - state_machines.NavRecord.PRELIMINARY_to_STALE_REPRICE_REQUIRED
          - state_machines.Trade.PRICED_PROVISIONAL_to_RECEIVED
          - entities.PricingErrorCase.fields.invalidated_nav_record_count
        distinguishing_aspect: |
          The trigger is POST /pricing-error-cases/{id}/reprocess and each hop is caused by the previous
          hop, not by the original call: correcting the NAV forces the settled trade to restate, the
          restatement moves the class share balance, the moved balance invalidates the later PRELIMINARY
          strike, and that invalidation rolls the provisionally priced trade back to RECEIVED.
