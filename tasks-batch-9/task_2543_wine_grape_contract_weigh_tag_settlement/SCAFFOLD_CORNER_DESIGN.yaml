  # ===========================================================================
  # SECTION 2 — State Machines (claim-extraction-guide "From Table 2")
  # state_machine_shape: parallel; side-effect patterns present: cascade down,
  # bubble up, cross-entity, ledger sync, compensation, conditional cascade.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.GrapeContract.lifecycle
          - state_machines.GrapeContract.renewal
          - state_machines.SamplingVisit
          - state_machines.WeighTag.weigh_status
          - state_machines.WeighTag.disposition
        distinguishing_aspect: |
          Five state dimensions across three entities, each with its own
          initial_state. The contract carries TWO independent dimensions at once
          (lifecycle DRAFT and renewal NOT_DUE), which is the parallel shape showing up
          the moment the row is born, and the sampling visit starts SCHEDULED with
          maturity_flag still UNKNOWN rather than defaulting to NOT_READY.
        test_recipe:
          setup:
            - "One Grower, one VineyardBlock, one QualitySpec and one SamplingCrew exist; the clock is at 2026-08-20T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
