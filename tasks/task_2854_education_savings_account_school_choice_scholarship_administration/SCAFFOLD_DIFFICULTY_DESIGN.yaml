        grounds:
          - calculations.unused_balance_rollover
          - entities.Account.fields.rollover_carried_cents
          - entities.Account.fields.forfeited_cents
          - entities.ProgramYear.fields.rollover_cap_pct
          - state_machines.ProgramYear.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          The cap is 932663 * 0.25 = 233165.75, which only ROUND_HALF_UP turns into 233166, and
          the spent-down balance lands on exactly that value: because the forfeiture comparison
          is strictly greater, forfeited_cents must be 0 and rollover_carried_cents 233166. Any
          truncating cap (233165) or a >= comparison forfeits 1 cent and fails.
