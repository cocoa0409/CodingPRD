      - name: extension_beyond_the_twelve_month_cap_is_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority 26]", "errors[ERR_EXTENSION_CAP_EXCEEDED]", "operational_constants.MAX_EXTENSION_MONTHS", "concurrency_rules.OCC_DEPOSIT_EXTENSION"]
        distinguishing_aspect: >-
          The cap is on the CUMULATIVE extension_months_purchased, not on the months in one call, so a
          deposit that has already bought the whole allowance must reject even a single further month.
          The endpoint is OCC-guarded, so the rejection has to happen on the business rule with a
          perfectly fresh expected_deposit_version in hand — and the already-purchased months must
          still be reflected in expires_at.
        test_recipe:
          setup: >-
            Tier PLUS with extension_fee_cents_per_month 3400. Resort A affiliated, member M1 on PLUS
            with dues paid (wallet 80100) holding a banked ONE_BR week checking in 2027-06-15 worth 82,
            whose expires_at is 2029-06-14T00:00:00Z. M1 buys the full twelve months of extension in one
            call for 12 * 3400 = 40800 cents, leaving wallet 39300 and pushing expires_at out by
            12 * 30 = 360 days to 2030-06-09T00:00:00Z.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id", dep1_v: "$.data.version" }
            - call: "POST /exchange-network/deposits/${dep1}/extensions"
              as: Member
              as_user_id: "${m1}"
              payload: { months: 12, expected_deposit_version: "${dep1_v}" }
          trigger:
            - call: "GET /exchange-network/deposits/${dep1}"
              as: Member
              as_user_id: "${m1}"
              payload: {}
              captures: { dep1_v2: "$.data.version" }
            - call: "POST /exchange-network/deposits/${dep1}/extensions"
              as: Member
              as_user_id: "${m1}"
              payload: { months: 1, expected_deposit_version: "${dep1_v2}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "the setup extension returned HTTP 200 with extension_months_purchased 12 and expires_at \"2030-06-09T00:00:00Z\""
            - "after the setup extension, GET /exchange-network/members/${m1} shows wallet_credit_cents 39300 and a single EXTENSION_FEE ledger row of -40800"
            - "the trigger's expected_deposit_version is current, so OCC cannot be the cause of failure"
            - "the trigger returns HTTP 409 with error_id ERR_EXTENSION_CAP_EXCEEDED, not 422 ERR_INVALID_REQUEST — one month is a legal input value, the cumulative total is not"
            - "GET /exchange-network/deposits/${dep1} — extension_months_purchased still 12 and expires_at still \"2030-06-09T00:00:00Z\""
            - "GET /exchange-network/members/${m1} — wallet_credit_cents still 39300; GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=EXTENSION_FEE — total_count == 1"

      - name: member_state_check_outranks_the_wallet_balance_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: lapsed_member_state_beats_wallet_fiscal_on_exchange_request
          rationale: >-
            The state-versus-fiscal precedence on POST /exchange-requests is the whole point of the §1.8
            priority_pair_validation_conflict instance, which constructs a lapsed member whose wallet is
            simultaneously too small and asserts ERR_MEMBER_NOT_ACTIVE rather than
            ERR_INSUFFICIENT_WALLET_CREDIT. A corner instance would restate the same ordering claim.

      - name: resort_safety_check_outranks_the_season_band_lookup
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: suspended_resort_safety_beats_missing_season_band_referential_on_deposit
          rationale: >-
            The business_safety-versus-business_referential precedence on POST /deposits is covered by
            the §1.8 priority_pair_validation_conflict instance, which suspends the resort AND removes
            the covering band in one fixture and asserts ERR_RESORT_NOT_AFFILIATED. Nothing further is
            gained by re-deriving it here.

  # ===========================================================================
  - section: endpoints
    instances:

      - name: deposit_valuation_read_exposes_every_multiplier
        claim_type: computed_read
        grounds: ["endpoints[GET /exchange-network/deposits/{deposit_id}/valuation]", "calculations.deposit_trading_power"]
        distinguishing_aspect: >-
          The valuation read is the only place the intermediate terms of deposit_trading_power are
          published, so it must expose the season multiplier, the demand multiplier, the quality bonus
          and BOTH lead times side by side. On a deposit no run has touched, the settlement half of the
          projection must come back null rather than being back-filled from the awarded half, which is
          what makes the read a genuine window onto the dual-variant state.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A (demand_index 4, GOLD_CROWN) affiliated at the default clock with a GOLD
            band 04-01..06-30, member M1 on PLUS with dues paid, and one banked ONE_BR week checking in
            2027-06-15. No matching run has ever executed.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/deposits/${dep1}/valuation"
              as: ResortManager
              as_user_id: "${resort_a}"
              payload: {}
          assert:
            - "HTTP 200 with response_type \"object\"; the payload is the declared inline shape, not a Deposit row"
            - "deposit_id == \"${dep1}\" and season_band_code == \"GOLD\""
            - "unit_size_base == 45, season_multiplier == \"1.25\", demand_multiplier == \"1.10\" and quality_bonus == 6"
            - "awarded_lead_time_days == 318 (2026-08-01 to 2027-06-15) and awarded_power == 82"
            - "settlement_lead_time_days == null and settlement_power == null — no run has frozen a settlement value"
            - "remaining_power == 82"
            - "the same read as Member, NetworkOperator and DisputeAnalyst returns byte-identical data; the projection is not role-dependent"

      - name: resort_patch_does_not_rewrite_frozen_awarded_power
        claim_type: standard_crud
        grounds: ["endpoints[PATCH /exchange-network/resorts/{resort_id}]", "entities.Deposit.awarded_power", "calculations.deposit_trading_power"]
        distinguishing_aspect: >-
          PATCH accepts only the three mutable configuration fields and every one of them is optional, so
          a body containing just demand_index must leave units_per_size and
          required_annual_deposit_units alone. More importantly, awarded_power was frozen at deposit time
          and must NOT be recomputed when the demand index moves — the same read that shows the resort at
          demand 1 must still show the old deposit at 82 while a brand-new deposit prices at 43.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A (demand_index 4, units_per_size 2, required_annual_deposit_units 2)
            affiliated with a GOLD band, member M1 on PLUS with dues paid, and one banked ONE_BR week
            checking in 2027-06-15 worth 82.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_old: "$.data.id" }
          trigger:
            - call: "PATCH /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: { demand_index: 1 }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "STUDIO", check_in_date: "2027-06-20" }
              captures: { dep_new: "$.data.id" }
          assert:
            - "the PATCH returns HTTP 200 with demand_index 1, units_per_size still 2 and required_annual_deposit_units still 2 — the omitted optional fields are untouched"
            - "the PATCH bumps version and updated_at but leaves affiliation_status \"ACTIVE\", affiliated_on \"2026-08-01\", quality_rating \"GOLD_CROWN\" and deposits_committed_count 1 unchanged"
            - "GET /exchange-network/deposits/${dep_old} — awarded_power still 82; the frozen valuation is immune to configuration drift"
            - "GET /exchange-network/deposits/${dep_old}/valuation — demand_multiplier still \"1.10\", the multiplier in force at deposit time, not the resort's current 0.80"
            - "the new deposit has awarded_power 43 (30 * 1.25 * 0.80 = 30.0 -> 30, +6 = 36, lead 323 gives factor 1.20, round_half_up(43.2) = 43)"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 125 (82 + 43)"

      - name: member_tier_change_switches_the_fee_schedule
        claim_type: action_endpoint
        grounds: ["endpoints[POST /exchange-network/members/{member_id}/tier-changes]", "calculations.exchange_charge", "calculations.request_power_budget"]
        distinguishing_aspect: >-
          The tier-change action rewrites only the pointer, and every downstream fee has to be read
          through it at the moment of use rather than copied onto the Member at enrollment. The same
          82-power week that would cost 21710 on BASIC with a budget of 82 costs 24410 on ELITE with a
          budget of 98, so a single request filed after the switch discriminates a live lookup from a
          cached schedule. Dues already paid are not re-levied by the switch.
        test_recipe:
          setup: >-
            Two tiers: BASIC (annual_dues_cents 9900, base_exchange_fee_cents 21900,
            priority_surcharge_cents 0, deposit_first_bonus_pct 0, max_active_requests 1) and ELITE
            (annual_dues_cents 39900, base_exchange_fee_cents 18900, priority_surcharge_cents 6000,
            deposit_first_bonus_pct 20, max_active_requests 5). Resort A affiliated with a GOLD band.
            Member M1 enrolls on BASIC and pays 100000 in dues, so 9900 is withheld and wallet is 90100.
            M1 banks a ONE_BR week checking in 2027-06-15 worth 82.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "BASIC", annual_dues_cents: 9900, base_exchange_fee_cents: 21900, priority_surcharge_cents: 0, priority_window_days: 180, deposit_first_bonus_pct: 0, max_active_requests: 1, cancellation_fee_cents: 9900, reinstatement_fee_cents: 12900, extension_fee_cents_per_month: 3900 }
              captures: { basic_tier: "$.data.id" }
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "ELITE", annual_dues_cents: 39900, base_exchange_fee_cents: 18900, priority_surcharge_cents: 6000, priority_window_days: 730, deposit_first_bonus_pct: 20, max_active_requests: 5, cancellation_fee_cents: 6900, reinstatement_fee_cents: 8900, extension_fee_cents_per_month: 2900 }
              captures: { elite_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${basic_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/members/${m1}/tier-changes"
              as: NetworkOperator
              payload: { tier_id: "${elite_tier}" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep1}" }
              captures: { req: "$.data.id" }
          assert:
            - "the tier change returns HTTP 200 with tier_id \"${elite_tier}\", a bumped version, enrollment_status still \"ACTIVE\" and dues_paid_through still \"2030-12-31\""
            - "wallet_credit_cents is still 90100 after the switch — moving to a dearer tier does not retroactively withhold the 39900 ELITE dues"
            - "the request reports power_budget 98 (floor(82 * 120 / 100)) — the ELITE deposit-first bonus, not BASIC's zero which would have given 82"
            - "the request reports quoted_charge_cents 24410 (subtotal 18900 + 0 shortfall + 6000 surcharge = 24900, credit floor(24900*10/100) = 2490, processing fee 2000)"
            - "under BASIC the identical week would have cost 21710 from a subtotal of 21900, so the totals are not interchangeable"
            - "GET /exchange-network/members/${m1} — wallet_credit_cents == 65690 and active_request_count == 1, which BASIC's cap of 1 would also have allowed; only the pricing distinguishes the tiers here"

      - name: request_funding_link_requires_both_rows_to_exist
        claim_type: cross_reference_link
        grounds: ["endpoints[POST /exchange-network/exchange-requests/{request_id}/funding]", "validations[priority 6]", "validations[priority 7]"]
        distinguishing_aspect: >-
          The funding call is the one endpoint that joins two independently addressable aggregates, one
          through the path and one through the body, so it needs two existence checks in the declared
          order: the path parameter at priority 6 before the body foreign key at priority 7. Swapping
          them returns ERR_DEPOSIT_NOT_FOUND for a request that does not exist, which hides the real
          fault from the caller.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated, member M1 on PLUS with dues paid holding a banked ONE_BR week
            checking in 2027-06-15 worth 82. M1 files a REQUEST_FIRST request for a ONE_BR over
            2027-06-01..2027-06-30 with no deposit_id: the estimate of 82 is entirely a shortfall, so the
            quoted charge is 55000 and the wallet drops to 25100.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30" }
              captures: { req: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests/44444444-4444-4444-8444-444444444444/funding"
              as: Member
              as_user_id: "${m1}"
              payload: { deposit_id: "${dep1}" }
              captures: { err_path: "$.data.error_id" }
            - call: "POST /exchange-network/exchange-requests/${req}/funding"
              as: Member
              as_user_id: "${m1}"
              payload: { deposit_id: "55555555-5555-4555-8555-555555555555" }
              captures: { err_body: "$.data.error_id" }
            - call: "POST /exchange-network/exchange-requests/${req}/funding"
              as: Member
              as_user_id: "${m1}"
              payload: { deposit_id: "${dep1}" }
          assert:
            - "call 1, unknown request in the path with a real deposit in the body — HTTP 404 with error_id ERR_EXCHANGE_REQUEST_NOT_FOUND"
            - "call 2, real request with an unknown deposit in the body — HTTP 404 with error_id ERR_DEPOSIT_NOT_FOUND"
            - "call 3 — HTTP 200; deposit_id == \"${dep1}\" and power_budget == 74 (floor(82 * 100 / 110)), the REQUEST_FIRST branch"
            - "after call 3, GET /exchange-network/exchange-requests/${req} — funding_mode still \"REQUEST_FIRST\" and quoted_charge_cents still 55000"
            - "GET /exchange-network/members/${m1} — wallet_credit_cents == 25100 throughout; neither the two rejections nor the successful link moved cash"
            - "GET /exchange-network/deposits/${dep1} — deposit_status still \"BANKED\"; linking funding does not reserve the week"

      - name: clock_endpoint_reports_previous_and_current_instants
        claim_type: action_endpoint
        grounds: ["endpoints[POST /exchange-network/_clock/set_current_utc]", "operational_constants.DEFAULT_LOGICAL_CLOCK"]
        distinguishing_aspect: >-
          The clock endpoint is the fixture primitive the whole suite depends on, so it must return the
          instant it replaced as well as the one it installed, and the first call in a fresh network must
          report the mandatory default 2026-08-01T00:00:00Z as previous_utc. Setting the clock must be
          inert: no run executes, nothing lapses, nothing expires.
        test_recipe:
          setup: >-
            A completely empty network at the mandatory default logical clock. No entity of any kind
            exists.
          setup_api_calls: []
          trigger:
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2027-03-01T12:34:56Z" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
          assert:
            - "call 1 — HTTP 200 with previous_utc == \"2026-08-01T00:00:00Z\", the mandatory default, and current_utc == \"2027-03-01T12:34:56Z\""
            - "call 2 — HTTP 200 with previous_utc == \"2027-03-01T12:34:56Z\" and current_utc == \"2027-04-01T00:00:00Z\"; the endpoint reports the value it replaced, not the default"
            - "both responses are the declared inline shape with exactly the two fields, wrapped in the standard object envelope with meta.api_request_id present"
            - "GET /exchange-network/matching-runs — total_count == 0; setting the clock triggers no run"
            - "GET /exchange-network/ledger-entries — total_count == 0"
            - "a subsequent POST /exchange-network/matching-runs records as_of_utc == \"2027-04-01T00:00:00Z\", so the installed clock is what later writes observe"

      - name: resort_compliance_read_reports_both_shortfall_variants
        claim_type: computed_read
        excluded_because:
          difficulty_instance: resort_obligation_shortfall_stay_year_vs_deposit_date
          rationale: >-
            The compliance projection's reason for existing is to publish both obligation variants at
            once, and the §1.8 dual_variant_calc instance already reads it on a fixture engineered to make
            counted_by_stay_year and counted_by_deposit_date disagree while only the stay-year figure
            drives PROBATION. A corner instance could only assert the weaker agreeing case, which the
            calculations-section input_set_filtering instance already covers.

  # ===========================================================================
  # Error-catalog coverage map for the 42 declared error_ids. The three active
  # instances below cover the auth trio, all eleven NOT_FOUND ids and the wallet
  # 402. The eight excluded_because stubs point at the §1.8 instances that own
  # their error. Every remaining id is claimed elsewhere in this file:
  #   ERR_INVALID_REQUEST                  -> entities/create_calls_with_malformed_bodies_return_invalid_request
  #   ERR_ROLE_NOT_PERMITTED               -> rbac/role_not_permitted_on_each_roles_exclusive_endpoints
  #   ERR_NOT_RESOURCE_OWNER               -> rbac/member_cannot_withdraw_another_members_deposit
  #   ERR_NOT_RESORT_MANAGER               -> rbac/resort_manager_cannot_read_another_resorts_compliance
