        distinguishing_aspect: "A second referral for a case that already has an open referral, sent to an AUDIOLOGY clinic with referral_reason CARDIOLOGY, violates business_referential (specialty mismatch, priority 8) and business_constraint (duplicate open referral, priority 9); the referential error ERR_CLINIC_SPECIALTY_MISMATCH wins — pair (business_referential, business_constraint), disjoint from the safety/temporal pair."
        test_recipe:
          setup:
            - "Case opened via PRESUMPTIVE_POSITIVE; an AUDIOLOGY clinic; a first (valid) AUDIOLOGY referral already exists on the case in REQUESTED."
