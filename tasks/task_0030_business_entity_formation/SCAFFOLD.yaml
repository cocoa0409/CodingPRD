roles:
  - name: Anonymous
    description: "Pre-formation requester; only formation and read endpoints."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /business-entities"
      - "GET /business-entities/{id}"
      - "GET /business-entities"
  - name: Filer
    description: "Person filing on behalf of a BusinessEntity; identified by X-User-ID == BusinessEntity.id of the entity they act on."
    identity: "entity_backed:BusinessEntity"
    exclusive_operations:
      - "PATCH /business-entities/{id}/dissolve"
      - "POST /business-entities/{id}/registered-agents"
      - "POST /registered-agents/{id}/resign"
      - "POST /business-entities/{id}/operating-agreements"
      - "POST /operating-agreements/{id}/execute"
      - "POST /business-entities/{id}/ein-applications"
      - "POST /business-entities/{id}/annual-reports"
