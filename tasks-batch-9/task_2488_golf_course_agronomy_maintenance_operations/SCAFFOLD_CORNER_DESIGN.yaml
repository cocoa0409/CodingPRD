              captures: { cv4: $.data.version, posture_4: $.data.play_posture, frost_4: $.data.frost_delay_minutes }
            - call: "POST /weather-events/${wx_ltg_id}/clear"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /courses/${course_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { cv5: $.data.version, posture_5: $.data.play_posture, frost_5: $.data.frost_delay_minutes }
            - call: "POST /weather-events"
