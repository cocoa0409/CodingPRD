    side_effects: ["asset MARKED_FOR_SALE -> IN_AUCTION", "net_proceeds_cents computed"]

  - method: GET
    path: "/trustee/cases/{id}/sales"
    description: "List sales of a case"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: ["status?", "asset_id?"]
    output: "AuctionSale[]"
    side_effects: []

  - method: GET
    path: "/trustee/sales/{id}"
    description: "Get a sale"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: AuctionSale
    side_effects: []

  - method: POST
    path: "/trustee/sales/{id}/approve"
    description: "Court approves sale (minimum-price gate); sets effective_on = approval + objection_window_days"
    roles: [Court]
    code: 200
    input: []
    output: AuctionSale
    side_effects: ["sale_approved_on set", "effective_on computed", "case.version += 1"]

  - method: POST
    path: "/trustee/sales/{id}/consummate"
    description: "Post proceeds after objection window; asset -> SOLD; estate cash += net"
    roles: [Trustee]
    code: 200
    input: []
