              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-01" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
          trigger:
            - call: "POST /co-living/memberships/${mem1_id}/move-in"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { tenancy: $.data.tenancy_status }
            - call: "GET /co-living/houses/${house_id}"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { occ: $.data.occupied_room_count }
          assert:
            - "${tenancy} == ACTIVE in the move-in response body itself"
            - "${occ} == 1 on the very next read"
            - "House.${house_id}.reserved_room_count == 0 and vacant_room_count == 0 and total_room_count == 1"
            - "Room.${room1_id}.occupancy_state == OCCUPIED"
            - "House.${house_id}.compliance_posture == OPEN"
