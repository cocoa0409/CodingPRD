  - rule_id: resource_temporal_overlap
    instances:
      - name: review_cycle_half_open_adjacency
        grounds:
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - entities.ReviewCycle.fields.starts_on
          - entities.ReviewCycle.fields.ends_on
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the ReviewCycle resource: a cycle
          starting exactly when another ends (ends_on == starts_on) is legal
          adjacency, while a window sharing any interior day overlaps. Resource:
          ScholarshipProgram's cycle calendar; endpoint: POST /api/review-cycles.
        test_recipe:
          setup:
            - "Program (any state) with cycle1 occupying [2026-10-01, 2026-10-31)"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Ov One", email: "o1@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
