  - rule_id: compensating_invariant
    instances:
      - name: reviewer_open_invitation_count_conserved_by_withdraw
        grounds:
          - state_machines.ReviewInvitation.INVITED_to_WITHDRAWN
          - entities.Reviewer.fields.open_invitation_count
          - entities.Reviewer.fields.invited_count
          - calculations.reviewer_reliability_score
        distinguishing_aspect: |
          Conserved quantity = Reviewer.open_invitation_count (an open-load counter): the withdraw
          transition restores it to exactly its pre-invitation value 0 while the monotone audit
          counter invited_count stays at 1, so the compensation is scoped to the load ledger and
          does not erase history.
        test_recipe:
          setup:
            - "One Journal with default config; one Manuscript advanced to UNDER_REVIEW under a HANDLING editor."
            - "One Reviewer with a fresh record (open_invitation_count 0, invited_count 0, reliability_score_rolling 50.00) who is then invited once and left in state INVITED, so open_invitation_count == 1."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Conserved Load", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /editors"
