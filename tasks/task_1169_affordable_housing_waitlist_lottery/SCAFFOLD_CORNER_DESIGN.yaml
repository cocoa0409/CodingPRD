  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: transition_response_reflects_new_state_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
        distinguishing_aspect: "The ANNOUNCE transition response body itself carries status == ANNOUNCED and the incremented version — no follow-up read is needed to observe the mutation (immediate consistency)."
        test_recipe:
          setup: ["DRAFT campaign with two marketing channels"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id", v0: "$.data.version" }
          trigger:
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
              captures: { st: "$.data.status", v1: "$.data.version" }
          assert:
            - "create returned version 1 (${v0}); the ANNOUNCE response itself returns status == ANNOUNCED and version == 2 (${v1})"
            - "no GET was issued between the mutation and the assertion — changes are visible in the same request's response"

  # ===========================================================================
  # Corners already covered by §1.8 difficulty instances (stubs, no recipes)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_stub_offer_refusal_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_RANKED
        excluded_because:
          difficulty_instance: waitlist_entry_offer_refusal_cycle
          rationale: "The RANKED -> OFFERED -> RANKED cycle with refusal_count accounting is asserted verbatim by the named §1.8 instance."
      - name: corner_stub_max_refusal_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_REMOVED
          - state_machines.Unit.RESERVED_to_AVAILABLE
        excluded_because:
          difficulty_instance: offer_decline_max_refusal_cascade
          rationale: "The decline -> refusal-count -> REMOVED -> unit-release -> counter-recompute chain is the subject of the named §1.8 cascade instance."
      - name: corner_stub_purge_empties_waitlist
        claim_type: side_effect_execution
        grounds:
          - state_machines.PurgeRun.NOTICES_SENT_to_EXECUTED
          - state_machines.ApplicationCampaign.PURGE_SCHEDULED_to_PURGED
        excluded_because:
          difficulty_instance: purge_execute_cascade_empties_waitlist
          rationale: "Full purge execution cascade including the PURGED flip is covered by the named §1.8 instance."
      - name: corner_stub_review_info_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Application.NEEDS_INFO_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: application_review_info_cycle_twice
          rationale: "The documentation-request cycle (twice around, with version increments) is asserted by the named §1.8 instance."
  - section: validations
    instances:
      - name: corner_stub_campaign_window_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_CAMPAIGN_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: campaign_windows_half_open_adjacency_allowed
          rationale: "Half-open overlap and adjacency acceptance are both asserted by the named §1.8 instance."
      - name: corner_stub_report_period_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: report_periods_closed_interval_shared_boundary_conflicts
          rationale: "Closed-interval shared-boundary conflict and first-free-day acceptance are asserted by the named §1.8 instance."
      - name: corner_stub_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: certify_segregated_and_over_income_safety_beats_fiscal
          rationale: "The segregation rejection (including its priority over the fiscal check) is the subject of the named §1.8 instance."
      - name: corner_stub_campaign_not_open
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAMPAIGN_NOT_OPEN]
        excluded_because:
          difficulty_instance: application_submit_gated_by_campaign_state
          rationale: "Submission gating on campaign state (negative and positive legs) is covered by the named §1.8 instance."
      - name: corner_stub_application_not_verified
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPLICATION_NOT_VERIFIED]
        excluded_because:
          difficulty_instance: income_certification_gated_by_application_verified
          rationale: "Certification gating on application VERIFIED state is covered by the named §1.8 instance."
      - name: report_submit_without_published_lottery_returns_incomplete_data
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_REPORT_INCOMPLETE_DATA]
          - state_machines.ComplianceReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: "SUBMIT on a campaign that has no PUBLISHED lottery run (here: never even ran one) fails with ERR_REPORT_INCOMPLETE_DATA; the report stays DRAFT."
        test_recipe:
          setup: ["DRAFT campaign; one DRAFT Q2 report"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /compliance-reports"
              payload: { campaign_id: "${c}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", period_mode: "CALENDAR_QUARTER" }
              as: ComplianceOfficer
              captures: { rep: "$.data.id" }
          trigger:
            - call: "POST /compliance-reports/${rep}/transition"
              payload: { action: "SUBMIT" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_REPORT_INCOMPLETE_DATA (422): no PUBLISHED LotteryRun exists for campaign ${c}"
            - "ComplianceReport.${rep} remains DRAFT"
