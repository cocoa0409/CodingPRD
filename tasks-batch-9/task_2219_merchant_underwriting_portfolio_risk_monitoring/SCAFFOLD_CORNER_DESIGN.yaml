        excluded_because:
          difficulty_instance: appeal_creation_requires_executed_termination_decision
          rationale: "That §1.8 instance covers priority 35 in both directions - an APPROVED-but-not-executed decision and a decision belonging to another merchant - plus the successful appeal once the decision is EXECUTED."
