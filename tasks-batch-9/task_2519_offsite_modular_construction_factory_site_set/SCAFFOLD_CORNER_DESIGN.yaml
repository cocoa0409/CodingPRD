            - "GET /modular/factories/${fac2} reports committed_line_minutes == 0 — no ledger was touched on either factory"

      - name: line_slot_shift_window_rejects_before_open_and_admits_at_open
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=77]
          - validations[priority=76]
          - entities.Factory.fields.shift_start_minute_of_day
        distinguishing_aspect: |
          The shift window is the half-open minute-of-day range [360, 1440) for a factory opening at
