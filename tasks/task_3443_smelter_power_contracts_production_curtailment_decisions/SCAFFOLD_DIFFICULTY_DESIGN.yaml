          assert:
            - "CurtailmentDecision.${dec}.status == EXECUTED and executed_at == 2026-09-01T00:00:00Z"
            - "link 1: Potline.${pl1}.operating_status == CURTAILED, curtailment_depth_pct == 60, active_decision_id == ${dec}"
            - "link 2: Smelter.${sm}.operating_posture == PARTIAL_CURTAILMENT (P2 still OPERATING) and curtailed_capacity_tpd == 500"
            - "link 3: PowerContract.${pc}.take_or_pay_exposed == true (flipped by the posture change, not by the execute call directly)"

      - name: restart_complete_cascade_depth2
        grounds:
          - state_machines.RestartPlan.IN_PROGRESS_to_COMPLETED
          - state_machines.Potline.RESTARTING_to_OPERATING
          - entities.Smelter.fields.operating_posture
          - calculations.restart_cost
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (restart-plan complete, not
          decision execute): complete mutates the plan (actual_cost_usd reconciled);
          the plan completion — not the original request alone — mutates the
          potline RESTARTING -> OPERATING; the potline mutation recomputes the
          smelter posture back to FULL_OPERATION.
        test_recipe:
          setup:
            - "Smelter with ACTIVE fixed-only contract, ACTIVE SPL permit, potline 500 tpd idled at 2026-09-01, HOT restart plan (planned 2026-09-03, estimate 100000), clock walked to 2026-09-03 for start and 2026-09-06 for completion."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/environmental-permits"
              payload: { smelter_id: "${sm}", permit_type: "SPL_DISPOSAL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-06-01T00:00:00Z" }
              as: EHSManager
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl: $.data.id }
            - call: "POST /smelter-ops/potlines/${pl}/curtail"
              payload: { depth_pct: 100 }
              as: SmelterManager
            - call: "POST /smelter-ops/restart-plans"
              payload: { potline_id: "${pl}", planned_restart_at: "2026-09-03T00:00:00Z" }
              as: SmelterManager
              captures: { rp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smelter-ops/restart-plans/${rp}/start"
              payload: {}
              as: SmelterManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /smelter-ops/restart-plans/${rp}/complete"
              payload: {}
              as: SmelterManager
            - call: "GET /smelter-ops/potlines/${pl}"
              as: SmelterManager
              captures: { p_status: $.data.operating_status }
            - call: "GET /smelter-ops/smelters/${sm}"
              as: SmelterManager
              captures: { posture: $.data.operating_posture, curt_cap: $.data.curtailed_capacity_tpd }
          assert:
            - "link 1: RestartPlan.${rp}.status == COMPLETED and actual_cost_usd == 145000 (80000 + 40*500 + 0 idle-day cost + 15000 * 3 realized restart days; realized idle 2 days at HOT rate 0)"
            - "link 2: Potline.${pl}.operating_status == OPERATING (mutated by the completion, curtailment_depth_pct reset to 0)"
            - "link 3: Smelter.${sm}.operating_posture == FULL_OPERATION and curtailed_capacity_tpd == 0"
            - "RestartPlan.${rp}.estimated_cost_usd == 100000 remains frozen and diverges from actual_cost_usd == 145000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: restart_start_state_beats_permit_safety
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_RESTART_PLAN_INVALID_STATE]
          - errors[ERR_PERMIT_NOT_ACTIVE]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the plan is IN_PROGRESS
          (state violation for start) AND the smelter's SPL permit is SUSPENDED
          (safety violation). Priority 9 state beats priority 11 safety, so the
          observed error is ERR_RESTART_PLAN_INVALID_STATE.
        test_recipe:
          setup:
            - "Smelter with ACTIVE contract, potline idled, SPL permit created ACTIVE, restart plan started (IN_PROGRESS), then the permit is suspended — a second start now violates both the state machine and the safety gate."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
