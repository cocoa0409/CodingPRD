          capacity_cases: 100
          trade_spend_cents: 1000
        as: ManufacturerPlanner
      - call: POST /jbp/launches/${lau_id}/phases/${ph4}/evaluate
        as: ManufacturerPlanner
      - call: POST /jbp/_clock/set_current_utc
        payload:
          to_iso8601: '2027-01-15T00:00:00Z'
        as: PlatformAdmin
      - call: POST /jbp/launches/${lau_id}/launch
        as: ManufacturerPlanner
      - call: POST /jbp/_clock/set_current_utc
        payload:
          to_iso8601: '2027-04-09T00:00:00Z'
        as: PlatformAdmin
      - call: POST /jbp/launches/${lau_id}/performance-reviews
        payload:
          period_start: '2027-01-01T00:00:00Z'
          period_end: '2027-12-31T00:00:00Z'
          actual_sales_cents: 900000
          sales_target_cents: 1000000
          target_distribution_pct: 90
          distribution_achieved_pct: 90
        as: ManufacturerPlanner
      trigger:
      - call: POST /jbp/launches/${lau_id}/performance-reviews
        payload:
          period_start: '2027-06-01T00:00:00Z'
          period_end: '2027-12-31T00:00:00Z'
          actual_sales_cents: 100
          sales_target_cents: 1000000
          target_distribution_pct: 90
          distribution_achieved_pct: 10
        as: ManufacturerPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_REVIEW_ALREADY_EXISTS (409)
  - name: err_analysis_not_accepted_triggerable
    claim_type: violation_to_error
    grounds:
    - errors[ERR_ANALYSIS_NOT_ACCEPTED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / shelf_rec_requires_accepted_analysis
      rationale: Asserted as the failure leg of the named difficulty instance.
  - name: err_negotiation_rounds_exhausted_triggerable
    claim_type: violation_to_error
    grounds:
    - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
    excluded_because:
      difficulty_instance: boundary_precision_check / negotiation_round_exhaustion_at_six
      rationale: Asserted with the exact boundary count by the named difficulty instance.
  - name: err_phase_gates_incomplete_triggerable
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PHASE_GATES_INCOMPLETE]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / launch_state_beats_temporal
      rationale: Asserted as the winning error of the named priority-conflict instance.
  - name: err_promo_overlap_triggerable
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PROMO_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / promo_overlap_half_open_adjacency
      rationale: Asserted by the named difficulty instance including the adjacency carve-out.
  - name: err_plan_not_activated_triggerable
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PLAN_NOT_ACTIVATED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / forecast_create_requires_activated_plan
      rationale: Asserted by the named difficulty instance (and as priority winner in lock_event_state_beats_fiscal).

- section: rbac
  instances:
    - name: retailer_buyer_cannot_create_plan
      claim_type: role_denied
      grounds: [roles.RetailerBuyer, endpoints."POST /jbp/plans"]
      distinguishing_aspect: "Plan creation is exclusive to ManufacturerPlanner; a RetailerBuyer attempt fails ERR_FORBIDDEN."
      test_recipe:
        setup: ["retailer and category exist"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
        trigger:
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_FORBIDDEN (403)"

    - name: manufacturer_cannot_commit_forecast
      claim_type: role_denied
      grounds: [roles.RetailerBuyer]
      distinguishing_aspect: "Forecast commit is exclusive to RetailerBuyer; ManufacturerPlanner fails ERR_FORBIDDEN even on a valid PUBLISHED forecast."
      test_recipe:
        setup: ["ACTIVATED plan; one PUBLISHED forecast"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
          - call: "POST /jbp/plans/${plan_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
          - call: "POST /jbp/plans/${plan_id}/activate"
            payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
            as: ManufacturerPlanner
          - call: "POST /jbp/plans/${plan_id}/forecasts"
            payload: { week_start: "2027-03-01T00:00:00Z", baseline_cases: 1000 }
            as: SupplyChainPlanner
            captures: { fc_id: "$.data.id" }
        trigger:
          - call: "POST /jbp/forecasts/${fc_id}/commit"
            payload: { committed_cases: 1100 }
            as: ManufacturerPlanner
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_FORBIDDEN (403); forecast remains UNCOMMITTED"

    - name: advisor_cannot_post_accrual
      claim_type: role_denied
      grounds: [roles.FinanceAnalyst]
      distinguishing_aspect: "Accrual posting is exclusive to FinanceAnalyst; CategoryAdvisor fails ERR_FORBIDDEN."
      test_recipe:
        setup: ["ACTIVATED plan with fund"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
          - call: "POST /jbp/plans/${plan_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
          - call: "POST /jbp/plans/${plan_id}/activate"
            payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
            as: ManufacturerPlanner
          - call: "GET /jbp/funds?plan_id=${plan_id}"
            as: ManufacturerPlanner
            captures: { fund_id: "$.data[0].id" }
        trigger:
          - call: "POST /jbp/funds/${fund_id}/accruals"
            payload: { period: "2027-01", invoiced_sales_cents: 100000 }
            as: CategoryAdvisor
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_FORBIDDEN (403); total_invoiced_cents remains 0"

    - name: retailer_scope_mismatch_on_counter
      claim_type: role_denied
      grounds: [roles.RetailerBuyer, "validations[priority=3]"]
      distinguishing_aspect: "A RetailerBuyer whose X-User-ID is retailer B cannot counter retailer A's plan: ERR_RETAILER_SCOPE_MISMATCH, distinct from ERR_FORBIDDEN."
      test_recipe:
        setup: ["retailers A and B; plan for retailer A (PROPOSED)"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_a: "$.data.id" }
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Beta", country_code: "US", channels: ["GROCERY"] }
            as: PlatformAdmin
            captures: { ret_b: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_a}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
        trigger:
          - call: "POST /jbp/plans/${plan_id}/negotiate"
            payload: { growth_target_pct: 9 }
            as: RetailerBuyer
            as_user_id: "${ret_b}"
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_RETAILER_SCOPE_MISMATCH (403)"
          - "plan remains PROPOSED with negotiation_round 1"

    - name: platform_admin_cannot_negotiate
      claim_type: role_denied
      grounds: [roles.PlatformAdmin]
      distinguishing_aspect: "PlatformAdmin is outside the negotiation role pair; negotiate fails ERR_FORBIDDEN."
      test_recipe:
        setup: ["plan PROPOSED"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
        trigger:
          - call: "POST /jbp/plans/${plan_id}/negotiate"
            payload: { growth_target_pct: 9 }
            as: PlatformAdmin
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_FORBIDDEN (403)"

    - name: clock_set_requires_platform_admin
      claim_type: role_denied
      grounds: [roles.PlatformAdmin, endpoints."POST /jbp/_clock/set_current_utc"]
      distinguishing_aspect: "The logical clock is PlatformAdmin-exclusive; ManufacturerPlanner fails ERR_FORBIDDEN."
