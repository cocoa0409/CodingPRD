            - call: "POST /procedures/${proc1_id}/recovery"
              payload: { sedation_end_at: "2026-08-01T14:00:00Z" }
              as: Interventionalist
              as_user_id: "${op_id}"
            - call: "POST /procedures/${proc1_id}/recovery-observations"
              payload: { observed_at: "2026-08-01T14:10:00Z", aldrete_score: 8, on_room_air: false }
              as: SedationRN
              as_user_id: "${rn_id}"
            - call: "POST /procedures/${proc1_id}/recovery-observations"
              payload: { observed_at: "2026-08-01T14:25:00Z", aldrete_score: 9, on_room_air: true }
              as: SedationRN
              as_user_id: "${rn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:30:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /procedures/${proc1_id}/discharge"
              payload: {}
              as: SedationRN
              as_user_id: "${rn_id}"
            - call: "POST /procedures/${proc2_id}/cancel"
              payload: { cancel_note: "patient deferred, units back to the shelf" }
              as: AccessCoordinator
            - call: "GET /device-lots/${lot_id}"
              payload: {}
              as: CenterAdmin
          assert:
            - "before the trigger the lot reads received_quantity 10, quantity_on_hand 10, quantity_reserved 7, status AVAILABLE - a reservation touches only quantity_reserved"
            - "after the discharge DeviceUsage.${use1_id}.state == CONSUMED with wasted_quantity 0 and consumed_at == 2026-08-01T14:30:00Z, and the lot reads quantity_on_hand 7, quantity_reserved 4"
            - "after the cancellation DeviceUsage.${use2_id}.state == RELEASED with released_at == 2026-08-01T14:30:00Z, wasted_quantity 0, and the lot reads quantity_on_hand 7, quantity_reserved 0"
            - "the release did NOT add its 4 units back to quantity_on_hand: an implementation that mirrors the consumption reports quantity_on_hand 11 against received_quantity 10"
            - "the conservation invariant holds exactly: quantity_on_hand (7) + SUM(quantity of CONSUMED usages) (3) == received_quantity (10), and received_quantity is still 10 after five writes to the lot"
            - "quantity_reserved is exactly 0 and never went negative at any step; the released units are not double-counted against the consumed ones"
            - "DeviceLot.${lot_id}.status is still AVAILABLE - quantity_on_hand 7 > 0, so the AVAILABLE -> DEPLETED hop does not fire"
            - "DeviceLot.${lot_id}.version == 5: one increment at create and one for each of the two reservations, the consumption and the release"
            - "the cancel used the coordinator path, so Procedure.${proc2_id}.clinical_status == CANCELLED with cancel_reason == COORDINATOR_CANCEL and Referral.${ref2_id}.status reverted SCHEDULED -> TRIAGED"
            - "the discharge cascade is unaffected by the pending second reservation: Referral.${ref1_id}.status == COMPLETED and VascularAccess.${acc_id}.status == IN_USE with angioplasty_count 1"

      - name: rebill_restores_the_money_ledger_with_zero_drift_until_the_second_rebill_is_spent
        grounds:
          - state_machines.Procedure.DENIED_to_REBILLED
          - validations.priority_29_ERR_REBILL_LIMIT_REACHED
          - calculations.procedure_allowed_amount
          - endpoints.POST_procedures_id_deny
        distinguishing_aspect: |
          The deny/rebill pair is a compensation loop that must be perfectly reversible: each deny
          moves the whole billed amount into denied_amount_cents and zeroes net_receivable_cents,
          and each rebill must restore the exact pre-denial figures by RE-RUNNING the allowed-amount
          calculation over the unchanged line set rather than by remembering the old total. Because
          the per-line rounding is applied before summation, an implementation that recomputes by
          summing then rounding drifts to 225100 on the first rebill - one cent of drift that the
          initial billing did not have. The loop is also bounded: rebill_count is capped at 2, and
          the third rebill must fail while leaving the ledger in its denied state rather than
          half-compensated.
        test_recipe:
          setup:
            - "one FEE_FOR_SERVICE patient with an IN_USE AVG access and one reading on 2026-07-25 for the necessity citation"
            - "one ANGIOPLASTY procedure, sedation NONE, 13:00-14:00, with 2 BALLOON units reserved"
            - "the case is started and ABORTED, which consumes the balloon units (wasted_quantity 2) and opens the coding dimension"
            - "three code lines posted by a Coder who is neither the operator nor an RN: rank 1 ANGIOPLASTY 180050, rank 2 IMAGING 45075, rank 3 ACCESS_MAINTENANCE_BUNDLE 90050, all modifier NONE"
            - "the operator attests citing the 2026-07-25 reading"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Eastmark Dialysis", facility_code: "EMK-02" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0023", full_name: "Wren Adeyemi", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Wren Salas", clinician_role: "INTERVENTIONALIST", npi: "1000000017", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { op_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Cory Baptiste", clinician_role: "CODER", npi: "1000000018", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { coder_id: $.data.id }
            - call: "POST /procedure-rooms"
              payload: { room_code: "ANGIO-18", room_type: "ANGIO_SUITE", turnover_buffer_min: 30, daily_case_cap: 6, recovery_bay_count: 2 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /device-lots"
              payload: { device_type: "BALLOON", catalog_code: "BAL-6X40", lot_number: "L-2026-H", expires_on: "2027-06-30", received_quantity: 5, unit_cost_cents: 22000 }
              as: CenterAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "RIGHT", site: "UPPER_ARM", placed_on: "2026-04-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-25T08:00:00Z", access_flow_ml_min: 900, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { read_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "money loop case", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref_v: $.data.version }
            - call: "POST /procedures"
              payload: { referral_id: "${ref_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", procedure_type: "ANGIOPLASTY", sedation_level: "NONE", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T14:00:00Z", expected_referral_version: "${ref_v}" }
              as: AccessCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /procedures/${proc_id}/device-usages"
              payload: { device_lot_id: "${lot_id}", quantity: 2, expected_device_lot_version: "${lot_v}" }
              as: AccessCoordinator
              captures: { use_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T13:00:00Z" }
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/start"
              payload: {}
              as: Interventionalist
              as_user_id: "${op_id}"
            - call: "POST /procedures/${proc_id}/abort"
              payload: { abort_reason: "vessel could not be crossed" }
              as: Interventionalist
              as_user_id: "${op_id}"
            - call: "POST /procedures/${proc_id}/codes"
              payload: { hcpcs_code: "36902", code_family: "ANGIOPLASTY", base_allowed_cents: 180050, rank: 1 }
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /procedures/${proc_id}/codes"
              payload: { hcpcs_code: "75791", code_family: "IMAGING", base_allowed_cents: 45075, rank: 2 }
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /procedures/${proc_id}/codes"
              payload: { hcpcs_code: "36598", code_family: "ACCESS_MAINTENANCE_BUNDLE", base_allowed_cents: 90050, rank: 3 }
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /procedures/${proc_id}/attest"
              payload: { medical_necessity_statement: "declining access flow with rising venous pressure", supporting_reading_id: "${read_id}" }
              as: Interventionalist
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /procedures/${proc_id}/bill"
              payload: {}
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/deny"
              payload: { denial_reason: "documentation requested", denial_code: "CO-16" }
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/rebill"
              payload: {}
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/deny"
              payload: { denial_reason: "second review", denial_code: "CO-50" }
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/rebill"
              payload: {}
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/deny"
              payload: { denial_reason: "final adverse determination", denial_code: "CO-97" }
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/rebill"
              payload: {}
              as: CenterAdmin
          assert:
            - "the coding pass produced per-line allowed_cents of 180050 (rank 1, factor 100), 22538 (rank 2, 45075 * 50% = 22537.5 rounded half up) and 22513 (rank 3, 90050 * 25% = 22512.5 rounded half up), so allowed_amount_cents == 225101 with reimbursement_variant FEE_FOR_SERVICE and is_bundled false on every line"
            - "the bill returns 200 with coding_status BILLED, billed_amount_cents 225101, denied_amount_cents 0, net_receivable_cents 225101 - ERR_CODE_DEVICE_MISMATCH does not fire because the abort left a CONSUMED BALLOON usage on the procedure, and 225101 <= SESSION_CAP_CENTS 480000"
            - "the first deny yields coding_status DENIED, billed_amount_cents 225101, denied_amount_cents 225101, net_receivable_cents 0, rebill_count 0"
            - "the first rebill yields coding_status REBILLED, billed_amount_cents 225101, denied_amount_cents 0, net_receivable_cents 225101, rebill_count 1 - exactly the pre-denial ledger, with zero drift"
            - "a sum-then-round implementation restores 225100 here, one cent below the amount it originally billed; the per-line rounding order must be reapplied on the rebill path too"
            - "the three ProcedureCode rows are byte-identical after the rebill: allowed_cents 180050 / 22538 / 22513, reduction_factor_pct 100 / 50 / 25, is_bundled false, and no line was deleted or re-created"
            - "the second deny/rebill pair repeats the loop exactly: net_receivable_cents 0 then 225101 again, and rebill_count reaches 2"
            - "the third deny succeeds (coding_status DENIED, denied_amount_cents 225101, net_receivable_cents 0) - the cap is on rebills, not denials"
            - "the third rebill returns 409 ERR_REBILL_LIMIT_REACHED because rebill_count is already 2"
            - "the refused rebill is not half-applied: coding_status stays DENIED, denied_amount_cents stays 225101, net_receivable_cents stays 0, rebill_count stays 2 and Procedure.version is unchanged by the rejected call"
            - "Procedure.${proc_id}.clinical_status is ABORTED throughout - the coding dimension walked bill -> deny -> rebill -> deny -> rebill -> deny independently of it, and Referral.${ref_id}.status stays SCHEDULED because an abort fires none of hops 2-5"
