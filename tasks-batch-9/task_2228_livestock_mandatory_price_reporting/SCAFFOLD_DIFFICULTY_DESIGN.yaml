            - "State compensation follows the ledger: Registration.${reg_a}.status == ACTIVE with suspended_reason == null and registration_number unchanged"
            - "Compensation is bounded: Submission.${sub_a}.status is still VOIDED (a terminal submission is never resurrected by a waiver)"
            - "After the payment: PenaltyAssessment.${pen_1}.status == PAID, paid_penalty_cents == 1126000, outstanding_penalty_cents == 1689000, waived_penalty_cents == 2000000 and assessed_penalty_cents == 4815000"
