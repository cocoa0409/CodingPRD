scaffold_corner_design:
  - section: entities
    instances:
      - name: account_create_applies_defaults
        claim_type: defaults
        grounds: ["entities.Account"]
        distinguishing_aspect: "Creating an account with only required fields applies every documented default: status ACTIVE, credit_status GOOD, outstanding_balance_cents 0, priority_class STANDARD, controlled_substance_license false, version 1, server-minted UUID id."
        test_recipe:
          setup: ["Empty database; default logical clock 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /lab/accounts"
              payload: { name: "Defaults Lab", segment: "ACADEMIC", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id, st: $.data.status, cr: $.data.credit_status, ob: $.data.outstanding_balance_cents, pc: $.data.priority_class, lic: $.data.controlled_substance_license, v: $.data.version }
          assert:
            - "status == ACTIVE, credit_status == GOOD, outstanding_balance_cents == 0"
            - "priority_class == STANDARD and controlled_substance_license == false (defaults applied)"
            - "version == 1 and id is a server-minted UUID"

      - name: account_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Account", "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent account id returns 404 ERR_ACCOUNT_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /lab/accounts/00000000-0000-4000-8000-000000000000"
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_FOUND with HTTP 404"

      - name: duplicate_sku_rejected
        claim_type: type_constraints
        grounds: ["entities.CatalogItem.fields.sku", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Catalog sku uniqueness: the second create with an existing sku fails with 409 ERR_DUPLICATE_SKU and no second item is stored."
        test_recipe:
          setup: ["Catalog contains sku DUP-1."]
          setup_api_calls:
            - call: "POST /lab/catalog-items"
              payload: { sku: "DUP-1", name: "First", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 5 }
              as: SupplyOps
          trigger:
            - call: "POST /lab/catalog-items"
              payload: { sku: "DUP-1", name: "Second", item_class: "COLD_CHAIN", allocation_group: "GROUP_A", base_price_cents: 200, stock_on_hand: 5 }
              as: SupplyOps
              captures: { err: $.data.error_id }
          assert:
            - "second create fails with error_id == ERR_DUPLICATE_SKU (HTTP 409)"

      - name: reagent_rental_missing_commitment_invalid_request
        claim_type: required_fields
        grounds: ["entities.Instrument.fields.monthly_consumable_commitment_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Conditional required field: placement_type REAGENT_RENTAL without a positive monthly_consumable_commitment_cents is rejected, while the same payload with CAPITAL and commitment 0 succeeds."
        test_recipe:
          setup: ["ACTIVE account exists."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Rental Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "RNT-1", placement_type: "REAGENT_RENTAL" }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "RNT-2", placement_type: "CAPITAL", monthly_consumable_commitment_cents: 0 }
              as: AccountManager
              captures: { i_ok: $.data.id }
          assert:
            - "REAGENT_RENTAL without commitment fails with error_id == ERR_INVALID_REQUEST (HTTP 400)"
            - "CAPITAL with commitment 0 succeeds with 201"

      - name: controlled_order_with_license_succeeds
        claim_type: satisfaction_pass
        grounds: ["validations[priority=6]", "entities.Account.fields.controlled_substance_license"]
        distinguishing_aspect: "The license gate is conditional: the same CONTROLLED order that fails for an unlicensed account goes ALLOCATED for a licensed one, priced goods 10000 + fee 9500 = 19500."
        test_recipe:
          setup: ["ACTIVE account with controlled_substance_license true; catalog holds a 10000-cent CONTROLLED item."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Licensed Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH", controlled_substance_license: true }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "CTRL-OK", name: "Controlled OK", item_class: "CONTROLLED", allocation_group: "GROUP_B", base_price_cents: 10000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "CTRL-OK", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { st: $.data.status, sc: $.data.shipping_class, fee: $.data.handling_fee_cents, tot: $.data.total_cents }
          assert:
            - "submit succeeds: status == ALLOCATED"
            - "shipping_class == CONTROLLED, handling_fee_cents == 9500, goods_subtotal_cents == 10000, total_cents == 19500"

  - section: state_machines
    instances:
      - name: ship_draft_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Order.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Ship is only valid from ALLOCATED; invoking it on a DRAFT order returns 409 ERR_INVALID_STATE and the order stays DRAFT."
        test_recipe:
          setup: ["Account and catalog item exist; order created but never submitted."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Ship Gate Lab", segment: "INDUSTRIAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "SHIP-1", name: "Ship item", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "SHIP-1", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /lab/orders/${o_id}/ship"
              payload: {}
              as: SupplyOps
              captures: { err: $.data.error_id }
          assert:
            - "ship fails with error_id == ERR_INVALID_STATE (HTTP 409)"
            - "Order remains DRAFT"

      - name: cancel_shipped_order_returns_not_cancellable
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order.transitions", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel from SHIPPED is outside the cancellable set {DRAFT, BACKORDERED, ALLOCATED} and returns 409 ERR_ORDER_NOT_CANCELLABLE; the shipment is unaffected."
        test_recipe:
          setup: ["ALLOCATED order already shipped."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Cancel Gate Lab", segment: "INDUSTRIAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "SHIP-2", name: "Ship item 2", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "SHIP-2", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_id}/ship"
              payload: {}
              as: SupplyOps
          trigger:
            - call: "POST /lab/orders/${o_id}/cancel"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "cancel fails with error_id == ERR_ORDER_NOT_CANCELLABLE (HTTP 409)"
            - "Order remains SHIPPED"

      - name: closed_account_cannot_reopen_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Account.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal for Account: PATCHing status back to ACTIVE returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account patched to CLOSED."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Closing Lab", segment: "ACADEMIC", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "PATCH /lab/accounts/${a_id}"
              payload: { status: "CLOSED" }
              as: AccountManager
          trigger:
            - call: "PATCH /lab/accounts/${a_id}"
              payload: { status: "ACTIVE" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "reopen fails with error_id == ERR_INVALID_STATE"
            - "Account.status remains CLOSED"

      - name: decommission_blocked_by_open_request
        claim_type: precondition_enforcement
        grounds: ["state_machines.Instrument.INSTALLED_to_DECOMMISSIONED", "errors[ERR_DECOMMISSION_BLOCKED]"]
        distinguishing_aspect: "Decommission is blocked while any service request is OPEN/DISPATCHED, even though the instrument's own state (INSTALLED) is valid — the guard reads child state."
        test_recipe:
          setup: ["Installed instrument with one OPEN BREAK_FIX request."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Decom Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "DEC-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "LOW" }
              as: LabProcurement
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /lab/instruments/${i_id}/decommission"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "decommission fails with error_id == ERR_DECOMMISSION_BLOCKED (HTTP 409)"
            - "Instrument.placement_status remains INSTALLED"

      - name: surge_resolve_twice_returns_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.SurgeEvent.ACTIVE_to_RESOLVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolve is not idempotent: the second resolve on an already-RESOLVED surge returns 409 ERR_INVALID_STATE and the waterfall does not re-run."
        test_recipe:
          setup: ["One ACTIVE surge on GROUP_C."]
          setup_api_calls:
            - call: "POST /lab/surge-events"
              payload: { allocation_group: "GROUP_C", reason: "shortage" }
              as: SupplyOps
              captures: { sg: $.data.id }
            - call: "POST /lab/surge-events/${sg}/resolve"
              payload: {}
              as: SupplyOps
          trigger:
            - call: "POST /lab/surge-events/${sg}/resolve"
              payload: {}
              as: SupplyOps
              captures: { err: $.data.error_id }
          assert:
            - "second resolve fails with error_id == ERR_INVALID_STATE"
            - "SurgeEvent.status remains RESOLVED"

      - name: contract_renew_before_window_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ServiceContract.RENEWAL_DUE_to_ACTIVE", "errors[ERR_RENEWAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "Renew is only legal from RENEWAL_DUE; at default clock the contract is ACTIVE (30-day window opens 2027-08-02) so a version-correct renew still fails with 422 ERR_RENEWAL_WINDOW_CLOSED (state gate precedes the OCC check)."
        test_recipe:
          setup: ["Installed instrument with GOLD contract 2026-09-01 to 2027-09-01; clock at default."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Early Renew Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "REW-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "GOLD", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
              captures: { c_id: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /lab/service-contracts/${c_id}/renew"
              payload: { expected_contract_version: "${cv}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "renew fails with error_id == ERR_RENEWAL_WINDOW_CLOSED (HTTP 422) despite a correct OCC version"
            - "end_date remains 2027-09-01T00:00:00Z and renewal_count == 0"

      - name: ea_expiring_renew_cycle_succeeds
        claim_type: valid_transition
        grounds: ["state_machines.EnterpriseAgreement.EXPIRING_to_ACTIVE", "concurrency_rules[ea-renew-stale-version]"]
        distinguishing_aspect: "EA renewal happy path: at 2027-04-15 (>= end 2027-06-01 minus 60 days = 2027-04-02) the derived status is EXPIRING; a renew carrying the observed version extends end_date to 2028-06-01 and returns status to ACTIVE."
        test_recipe:
          setup: ["Account with agreement [2026-06-01, 2027-06-01); clock advanced to 2027-04-15T00:00:00Z."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Renew Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z", committed_annual_spend_cents: 50000 }
              as: AccountManager
              captures: { ea: $.data.id, eav: $.data.version }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /lab/enterprise-agreements/${ea}"
              as: AccountManager
              captures: { st_due: $.data.status }
          trigger:
            - call: "POST /lab/enterprise-agreements/${ea}/renew"
              payload: { expected_agreement_version: "${eav}" }
              as: AccountManager
              captures: { st: $.data.status, end: $.data.end_date, rc: $.data.renewal_count, v: $.data.version }
          assert:
            - "status read at 2027-04-15 == EXPIRING while version is still 1 (derived transition, no version bump)"
            - "renew succeeds: status == ACTIVE, end_date == 2028-06-01T00:00:00Z, renewal_count == 1, version == 2"

      - name: loaner_auto_returns_on_resolve
        claim_type: side_effect_execution
        grounds: ["state_machines.LoanerUnit.RESERVED_to_AVAILABLE", "state_machines.ServiceRequest.DISPATCHED_to_RESOLVED"]
        distinguishing_aspect: "Compensation-style side effect: resolving the holding service request flips its RESERVED loaner unit back to AVAILABLE while ServiceRequest.loaner_unit_id is retained for audit."
        test_recipe:
          setup: ["GOLD-contracted instrument, HIGH BREAK_FIX request with a reserved loaner unit of the same model."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Loaner Return Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Fixer", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "LRT-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "GOLD", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /lab/loaner-units"
              payload: { model: "SEQ-5000", serial_number: "LN-RET" }
              as: ServiceDispatcher
              captures: { u1: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "HIGH" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr: $.data.id }
            - call: "POST /lab/service-requests/${sr}/loaner"
              payload: {}
              as: ServiceDispatcher
              captures: { lu: $.data.loaner_unit_id }
            - call: "POST /lab/service-requests/${sr}/dispatch"
              payload: {}
              as: ServiceDispatcher
          trigger:
            - call: "POST /lab/service-requests/${sr}/resolve"
              payload: { hours_on_site: 1, parts_cost_cents: 0 }
              as: ServiceDispatcher
            - call: "GET /lab/loaner-units?model=SEQ-5000"
              as: ServiceDispatcher
              captures: { u_status: "$.data[0].status" }
          assert:
            - "reserve set ServiceRequest.loaner_unit_id == LoanerUnit.${u1}"
            - "after resolve the unit's status is AVAILABLE again"
            - "ServiceRequest.${sr}.loaner_unit_id is still set after return (audit retention)"

  - section: calculations
    instances:
      - name: handling_fee_controlled_precedence
        claim_type: constants_applied
        grounds: ["calculations.order_total_pricing", "entities.Order.fields.shipping_class"]
        distinguishing_aspect: "Shipping-class precedence CONTROLLED > COLD_CHAIN collapses a mixed order to a single 9500 handling fee (fees never stack): goods 5000 + 9500 = 14500."
        test_recipe:
          setup: ["Licensed account; catalog holds a COLD_CHAIN item (2000) and a CONTROLLED item (3000)."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Mixed Ship Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH", controlled_substance_license: true }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "CC-1", name: "Cold pack", item_class: "COLD_CHAIN", allocation_group: "GROUP_B", base_price_cents: 2000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "CTRL-2", name: "Controlled 2", item_class: "CONTROLLED", allocation_group: "GROUP_B", base_price_cents: 3000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "CC-1", quantity: 1 }, { sku: "CTRL-2", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sc: $.data.shipping_class, fee: $.data.handling_fee_cents, tot: $.data.total_cents }
          assert:
            - "shipping_class == CONTROLLED (precedence over COLD_CHAIN)"
            - "handling_fee_cents == 9500 (single fee by class; 4500 cold-chain fee does NOT stack)"
            - "goods_subtotal_cents == 5000 and total_cents == 14500"

      - name: cold_chain_handling_fee_applied
        claim_type: correct_result
        grounds: ["calculations.order_total_pricing"]
        distinguishing_aspect: "A COLD_CHAIN-only order carries exactly the 4500 handling fee and shipping_class COLD_CHAIN: goods 4000 (2 x 2000) + 4500 = 8500."
        test_recipe:
          setup: ["ACTIVE account; catalog holds a 2000-cent COLD_CHAIN item."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Cold Lab", segment: "CLINICAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "CC-2", name: "Cold reagent", item_class: "COLD_CHAIN", allocation_group: "GROUP_B", base_price_cents: 2000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "CC-2", quantity: 2 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sc: $.data.shipping_class, fee: $.data.handling_fee_cents, tot: $.data.total_cents }
          assert:
            - "shipping_class == COLD_CHAIN and handling_fee_cents == 4500"
            - "total_cents == 8500"

      - name: transit_delivery_after_three_days
        claim_type: constants_applied
        grounds: ["calculations.delivery_transit_schedule", "state_machines.Order.SHIPPED_to_DELIVERED"]
        distinguishing_aspect: "Transit threshold is inclusive >= shipped_at + 3 days for STANDARD: at +2 days the order is still SHIPPED, at exactly +3 days the clock sweep delivers it with delivered_at pinned to 2026-09-04T00:00:00Z."
        test_recipe:
          setup: ["STANDARD order shipped at the default clock 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Transit Lab", segment: "INDUSTRIAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "STD-1", name: "Standard item", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "STD-1", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_id}/ship"
              payload: {}
              as: SupplyOps
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /lab/orders/${o_id}"
              as: SupplyOps
              captures: { st_2d: $.data.status }
          trigger:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /lab/orders/${o_id}"
              as: SupplyOps
              captures: { st_3d: $.data.status, dlv: $.data.delivered_at }
          assert:
            - "at +2 days (2026-09-03T00:00:00Z): status still SHIPPED"
            - "at exactly +3 days (2026-09-04T00:00:00Z): status == DELIVERED and delivered_at == 2026-09-04T00:00:00Z"

      - name: credit_hold_boundary_strictly_greater
        claim_type: constants_applied
        grounds: ["calculations.credit_hold_evaluation", "entities.Account.fields.credit_status"]
        distinguishing_aspect: "Credit boundary is strictly greater: outstanding exactly 2000000 keeps credit_status GOOD; one more invoiced cent (2000001) flips it to HOLD."
        test_recipe:
          setup: ["Account ships a 2000000-cent order (balance exactly at the limit), then a 1-cent order."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Edge Credit Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "EXACT-2M", name: "Exactly at limit", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 2000000, stock_on_hand: 5 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "ONE-CENT", name: "One cent", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 1, stock_on_hand: 5 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "EXACT-2M", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o1: $.data.id }
            - call: "POST /lab/orders/${o1}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o1}/ship"
              payload: {}
              as: SupplyOps
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { cr_at: $.data.credit_status, bal_at: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "ONE-CENT", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o2: $.data.id }
            - call: "POST /lab/orders/${o2}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o2}/ship"
              payload: {}
              as: SupplyOps
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { cr_over: $.data.credit_status, bal_over: $.data.outstanding_balance_cents }
          assert:
            - "at balance == 2000000 (== CREDIT_LIMIT_CENTS): credit_status == GOOD and the second submit was allowed"
            - "at balance == 2000001: credit_status == HOLD"

      - name: early_termination_fee_math
        claim_type: correct_result
        grounds: ["calculations.early_termination_fee"]
        excluded_because:
          difficulty_instance: contract_cancel_credit_hold_cancels_drafts
          rationale: "The fee arithmetic (PLATINUM 800000 x 6 months x 0.5 = 2400000 posted to outstanding_balance_cents) is asserted as link 1 of that cascade instance."

