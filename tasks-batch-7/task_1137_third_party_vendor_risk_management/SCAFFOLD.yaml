    input: [contract_reference, effective_date, expiry_date, has_right_to_audit_clause, has_sla_terms, has_exit_plan_section, sla_uptime_pct, breach_cure_window_days, renewal_notice_days]
    output: Contract
    side_effects:
      - "engagement.lifecycle_status DD_APPROVED -> CONTRACTING"
      - "contract.status := DRAFT"

  - method: GET
    path: "/tprm/engagements/{id}/contracts"
    description: "List contracts on an engagement."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/tprm/contracts"
    description: "Filtered list of contracts across engagements (supports filtering by version_pin_dd_package_id for FK reverse-reachability)."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: ["engagement_id?", "status?", "version_pin_dd_package_id?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/tprm/fourth-parties"
    description: "Filtered list of fourth-parties (supports parent_fourth_party_id to traverse the sub-contractor chain)."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: ["engagement_id?", "acknowledgement_status?", "data_access_level?", "parent_fourth_party_id?", "limit?", "offset?"]
    output: FourthParty[]
    side_effects: []

  - method: GET
    path: "/tprm/audit-findings"
    description: "Filtered list of audit findings (supports raised_incident_id for FK reverse-reachability from Incident)."
    roles: [RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: ["audit_exercise_id?", "severity?", "raised_incident_id?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: GET
    path: "/tprm/audit-findings/{id}"
    description: "Fetch a single audit finding."
    roles: [RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: GET
    path: "/tprm/contracts/{id}"
    description: "Fetch a contract."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/tprm/contracts/{id}/execute"
