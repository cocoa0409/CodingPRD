# =============================================================================
# PRD Benchmark Seed Tables — task_2878_trade_promotion_planning_deduction_management
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2878. Trade Promotion Planning & Deduction Management (consumer packaged goods trade marketing): annual trade budget allocation by customer, brand and event with baseline and incremental volume assumptions, promotion planning across temporary price reduction, display and feature with retailer commitment documentation, accrual by shipment or consumption method with rate maintenance, deduction intake matched to promotion agreements with validation of performance evidence, invalid deduction dispute and recovery process with aging and write-off thresholds, post-event analysis of lift, cannibalization and return on investment, live promotion balance monitoring with over-spend alerts, contract compliance audits at the customer

domain_name: trade-promotion-deductions
api_prefix: /trade-marketing

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every business resource is addressed at one level under /trade-marketing
  # (`/trade-marketing/promotions/{id}`, `/trade-marketing/deductions/{id}`, …)
  # and linked by explicit foreign keys carried in request bodies. No entity id
  # is nested inside another entity's id path segment.

  state_machine_shape: cyclic
  # Promotion carries a revision loop (SUBMITTED -> CHANGES_REQUESTED -> DRAFT ->
  # SUBMITTED) capped at MAX_REVISION_ROUNDS, Dispute carries a negotiation loop
  # (OPEN -> AWAITING_RETAILER -> OPEN) capped at MAX_DISPUTE_ROUNDS, and Customer
  # runs two independent state axes (trading_status x audit_status) on one row.

  relationship_patterns:
    - one_to_many          # BudgetAllocation -> Promotion -> PromotionTactic
    - self_referential     # AccrualEntry.reverses_entry_id, Deduction.supersedes_deduction_id
    - cross_aggregate      # Deduction (AR aggregate) consumes Promotion accrual balance

  role_model: segregation_of_duties
  # The opaque X-User-ID that approved a Promotion may not validate a Deduction
  # matched to it, and the opaque X-User-ID that opened a Dispute may not approve
  # its write-off at or above WRITE_OFF_SELF_APPROVAL_LIMIT.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 67 endpoints (23 of them GETs that exist only so every FK is
  # reverse-reachable) / 62 error codes / 14 calculation rules, 3 of them
  # dual-variant / 13 state-machine blocks over 7 entities, because Promotion,
  # BudgetAllocation and Customer each run two independent state axes.
  # Density, not volume, is where the
  # difficulty sits: Promotion is the join point of the budget ledger, the
  # accrual ledger, the deduction ledger and the post-event analytics, and a
  # single deduction validation can propagate four hops out to Customer.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: TradeProgram
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year this annual trade program covers.
        constraints: "2020..2100"
      - name: name
        type: string
        source: input
        description: Program label, e.g. "FY2026 National Trade Fund".
        constraints: "1..120 chars"
      - name: total_budget_amount
        type: number
        source: input
        description: Annual trade fund envelope in USD; the aggregate ceiling every BudgetAllocation competes for.
        constraints: "> 0, exactly 2 decimal places"
      - name: accrual_method_default
        type: enum
        source: input
        description: Default accrual method inherited by Promotions created under this program when the request omits accrual_method.
        default: SHIPMENT
        constraints: "SHIPMENT | CONSUMPTION"
      - name: status
        type: enum
        source: system
        description: Program posture driver. LOCKED forces every child BudgetAllocation.posture to FROZEN.
        default: OPEN
        constraints: "OPEN | LOCKED"
      - name: allocated_amount
        type: number
        source: computed
        description: "Sum of BudgetAllocation.planned_amount over allocations with program_id == this.id, all statuses included. See calculations.program_budget_rollup."
      - name: unallocated_amount
        type: number
        source: computed
        description: "round(total_budget_amount - allocated_amount, 2). See calculations.program_budget_rollup."

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> TradeProgram.id; the annual program that funds this brand."
      - name: name
        type: string
        source: input
        description: Brand name as sold to retailers.
        constraints: "1..120 chars"
      - name: list_price_per_case
        type: number
        source: input
        description: Manufacturer list price per case in USD, used for incremental gross profit.
        constraints: "> 0, exactly 2 decimal places"
      - name: cogs_per_case
        type: number
        source: input
        description: Fully loaded cost of goods per case in USD.
        constraints: ">= 0, exactly 2 decimal places, MUST be < list_price_per_case"
      - name: baseline_units_per_week
        type: integer
        source: input
        description: Seasonal planning baseline in cases per week; the SEASONAL variant of calculations.post_event_analysis reads this instead of trailing actuals.
        constraints: ">= 0"
      - name: unit_margin
        type: number
        source: computed
        description: "round(list_price_per_case - cogs_per_case, 2)."

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> TradeProgram.id; program under which this retailer is funded."
      - name: name
        type: string
        source: input
        description: Retailer name.
        constraints: "1..120 chars"
      - name: channel
        type: enum
        source: input
        description: Retail channel; used by nothing but reporting filters, and by the RBAC scope of CustomerPortalUser.
        constraints: "GROCERY | MASS | CLUB | DOLLAR"
      - name: deduction_validation_policy
        type: enum
        source: input
        description: Selects which variant of calculations.deduction_valuation runs for every Deduction of this customer. This is the only selector; it is never inferred from the claim.
        default: EVIDENCE_BASED
        constraints: "EVIDENCE_BASED | AGREEMENT_CAP"
      - name: trading_status
        type: enum
        source: system
        description: Commercial axis of the Customer's two independent state dimensions. Gates Deduction settlement.
        default: ACTIVE
        constraints: "ACTIVE | CREDIT_HOLD | SUSPENDED"
      - name: audit_status
        type: enum
        source: system
        description: Compliance axis of the Customer's two independent state dimensions. Moves only through ComplianceAudit transitions and never rewrites trading_status.
        default: CLEAR
        constraints: "CLEAR | AUDIT_IN_PROGRESS | FINDINGS_OPEN"
      - name: compliance_penalty_points
        type: integer
        source: computed
        description: "Weighted penalty score; see calculations.customer_penalty_score. Crossing CREDIT_HOLD_POINTS auto-advances trading_status."
        default: 0
      - name: credit_hold_reason
        type: string
        source: system
        description: Free-text reason captured when trading_status becomes CREDIT_HOLD; null while ACTIVE.
        default: null
      - name: open_deduction_amount
        type: number
        source: computed
        description: "Sum of Deduction.claimed_amount over deductions with customer_id == this.id and status IN {RECEIVED, MATCHED, VALIDATED, DISPUTED}. See calculations.customer_deduction_rollup."
      - name: write_off_ytd_amount
        type: number
        source: computed
        description: "Sum of Dispute.write_off_amount over disputes with status == WRITTEN_OFF whose Deduction.customer_id == this.id. See calculations.customer_deduction_rollup."

  - name: BudgetAllocation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> TradeProgram.id; funding program."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the retailer this money is earmarked for."
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand this money is earmarked for."
      - name: event_type
        type: enum
        source: input
        description: Event bucket the allocation funds.
        constraints: "SEASONAL | EVERYDAY | NEW_ITEM"
      - name: planned_amount
        type: number
        source: input
        description: Annual trade dollars allocated to this customer/brand/event cell.
        constraints: "> 0, exactly 2 decimal places"
      - name: baseline_units
        type: integer
        source: input
        description: Baseline (non-promoted) case volume assumption for the year on this cell.
        constraints: ">= 0"
      - name: planned_incremental_units
        type: integer
        source: input
        description: Incremental case volume assumption the allocation is expected to buy. The conserved quantity of the units invariant.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Approval axis. Promotions may only be created and approved against an APPROVED allocation.
        default: DRAFT
        constraints: "DRAFT | APPROVED"
      - name: posture
        type: enum
        source: computed
        description: "Gating axis, independent of status; see calculations.allocation_posture. FROZEN when the program is LOCKED, RESTRICTED once any child Promotion has overspent, otherwise OPEN."
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: overspend_event_count
        type: integer
        source: system
        description: Count of distinct child Promotions that have entered spend_status == OVERSPENT at least once. Never decremented.
        default: 0
      - name: committed_amount
        type: number
        source: computed
        description: "Sum of Promotion.planned_total_spend over child promotions with lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED}. See calculations.allocation_ledger_rollup."
      - name: accrued_amount
        type: number
        source: computed
        description: "Sum of (Promotion.gross_accrued_amount - Promotion.reversed_accrual_amount) over all child promotions. See calculations.allocation_ledger_rollup."
      - name: settled_amount
        type: number
        source: computed
        description: "Sum of Deduction.validated_amount over deductions with status == SETTLED whose promotion_id is a child promotion of this allocation. See calculations.allocation_ledger_rollup."
      - name: available_amount
        type: number
        source: computed
        description: "round(planned_amount - committed_amount, 2). Consumed by the fiscal check on promotion approval."
      - name: committed_units
        type: integer
        source: computed
        description: "Sum of Promotion.committed_units over child promotions with lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED}."
      - name: unreserved_units
        type: integer
        source: computed
        description: "planned_incremental_units - committed_units. Half of the conserved units identity."
      - name: at_risk_amount
        type: number
        source: computed
        description: "Sum of PostEventAnalysis.net_spend over child promotions whose performance_flag == UNDERPERFORMING. See calculations.allocation_ledger_rollup."

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - name: allocation_id
        type: string
        source: input
        description: "FK -> BudgetAllocation.id; the funding cell. Also the OCC parent for promotion creation."
      - name: customer_id
        type: string
        source: computed
        description: "FK -> Customer.id; copied from BudgetAllocation.customer_id at creation and never editable."
      - name: brand_id
        type: string
        source: computed
        description: "FK -> Brand.id; copied from BudgetAllocation.brand_id at creation and never editable."
      - name: name
        type: string
        source: input
        description: Promotion event name.
        constraints: "1..120 chars"
      - name: window_start
        type: string
        source: input
        description: Inclusive first day of the promoted period.
        constraints: "ISO 8601 date YYYY-MM-DD, MUST be a Monday"
      - name: window_end
        type: string
        source: input
        description: Exclusive last day of the promoted period; the window is half-open [window_start, window_end).
        constraints: "ISO 8601 date YYYY-MM-DD, MUST be a Monday, MUST be > window_start"
      - name: accrual_method
        type: enum
        source: input
        description: Accrual basis for this promotion. Defaults to the owning TradeProgram.accrual_method_default when omitted.
        constraints: "SHIPMENT | CONSUMPTION"
      - name: lifecycle_status
        type: enum
        source: system
        description: Planning/execution axis, carrying the revision cycle.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | LIVE | ENDED | ANALYZED | WITHDRAWN"
      - name: spend_status
        type: enum
        source: computed
        description: "Live balance-monitoring axis, recomputed on every accrual, reversal, deduction validation and write-off. See calculations.promotion_spend_status."
        default: WITHIN_BUDGET
        constraints: "WITHIN_BUDGET | OVERSPEND_WARNING | OVERSPENT"
      - name: performance_flag
        type: enum
        source: computed
        description: "Post-event verdict, derived from the latest PostEventAnalysis.roi against ROI_FLOOR. See calculations.post_event_analysis."
        default: UNRATED
        constraints: "UNRATED | ON_TRACK | UNDERPERFORMING"
      - name: revision_round
        type: integer
        source: system
        description: Number of completed revision loops; incremented by the revise transition, capped by MAX_REVISION_ROUNDS.
        default: 0
      - name: tactic_subtotal_amount
        type: number
        source: computed
        description: "Per-line-rounded sum of PromotionTactic.line_planned_spend over tactics with status IN {PLANNED, ACTIVE, COMPLETED}. See calculations.promotion_planned_total_spend."
      - name: allowance_rate
        type: number
        source: computed
        description: "Off-invoice allowance rate selected from tactic_subtotal_amount ONLY (never from planned_total_spend). See calculations.promotion_planned_total_spend."
      - name: off_invoice_allowance_amount
        type: number
        source: computed
        description: "round(tactic_subtotal_amount * allowance_rate, 2)."
      - name: planned_total_spend
        type: number
        source: computed
        description: "tactic_subtotal_amount + off_invoice_allowance_amount. The amount committed against the allocation at approval."
      - name: committed_units
        type: integer
        source: computed
        description: "Sum of PromotionTactic.planned_units over tactics with status IN {PLANNED, ACTIVE, COMPLETED}; 0 once the promotion is WITHDRAWN."
      - name: gross_accrued_amount
        type: number
        source: computed
        description: "Sum of AccrualEntry.amount over entries with entry_type == ACCRUAL for this promotion, regardless of status. See calculations.promotion_accrual_ledger."
      - name: reversed_accrual_amount
        type: number
        source: computed
        description: "Sum of AccrualEntry.amount over entries with entry_type == REVERSAL for this promotion. See calculations.promotion_accrual_ledger."
      - name: consumed_deduction_amount
        type: number
        source: computed
        description: "Sum of Deduction.validated_amount for deductions of this promotion with status IN {VALIDATED, SETTLED} plus sum of Dispute.write_off_amount for WRITTEN_OFF disputes of this promotion's deductions. See calculations.promotion_accrual_ledger."
      - name: recognized_spend_amount
        type: number
        source: computed
        description: "round(max(gross_accrued_amount - reversed_accrual_amount, consumed_deduction_amount), 2). See calculations.promotion_spend_status."
      - name: accrued_balance
        type: number
        source: computed
        description: "round(gross_accrued_amount - reversed_accrual_amount - consumed_deduction_amount, 2). May be negative when deductions exceed accruals."
      - name: spend_ratio
        type: number
        source: computed
        description: "round(recognized_spend_amount / planned_total_spend, 4); 0.0000 when planned_total_spend == 0."
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the TradeMarketingDirector who approved this promotion; the segregation-of-duties comparand for deduction validation.
        default: null
      - name: commitment_verified
        type: boolean
        source: computed
        description: "True when every DISPLAY and FEATURE tactic of this promotion is covered by a RetailerDocument with doc_class == COMMITMENT, status == VERIFIED and covers_tactic_type IN {ALL, <that tactic_type>}. See calculations.commitment_coverage."

  - name: PromotionTactic
    parent: Promotion
    common_fields: true
    fields:
      - name: promotion_id
        type: string
        source: input
        description: "FK -> Promotion.id; owning promotion. Supplied by the path segment on creation."
      - name: tactic_type
        type: enum
        source: input
        description: Trade tactic. TPR is a per-case price reduction; DISPLAY and FEATURE are fixed-fee placements.
        constraints: "TPR | DISPLAY | FEATURE"
      - name: rate_per_case
        type: number
        source: input
        description: Allowance per case in USD. REQUIRED when tactic_type == TPR, MUST be omitted otherwise.
        default: null
        constraints: "> 0, up to 3 decimal places"
      - name: fixed_fee
        type: number
        source: input
        description: Flat placement fee in USD. REQUIRED when tactic_type IN {DISPLAY, FEATURE}, MUST be omitted otherwise.
        default: null
        constraints: "> 0, exactly 2 decimal places"
      - name: planned_units
        type: integer
        source: input
        description: Planned promoted case volume for this line; contributes to Promotion.committed_units.
        constraints: ">= 0"
      - name: window_start
        type: string
        source: input
        description: Inclusive first day of the tactic period.
        constraints: "ISO 8601 date YYYY-MM-DD, MUST be a Monday, MUST be >= Promotion.window_start"
      - name: window_end
        type: string
        source: input
        description: Exclusive last day of the tactic period; half-open [window_start, window_end).
        constraints: "ISO 8601 date YYYY-MM-DD, MUST be a Monday, MUST be > window_start, MUST be <= Promotion.window_end"
      - name: week_count
        type: integer
        source: computed
        description: "(window_end - window_start) in days / 7. Always a positive integer because both ends are Monday-aligned."
      - name: line_planned_spend
        type: number
        source: computed
        description: "round(planned_units * rate_per_case, 2) for TPR; round(fixed_fee, 2) for DISPLAY and FEATURE. See calculations.tactic_line_planned_spend."
      - name: status
        type: enum
        source: system
        description: Execution axis driven by the activation run and by promotion withdrawal.
        default: PLANNED
        constraints: "PLANNED | ACTIVE | COMPLETED | CANCELLED"
      - name: effective_from_period
        type: string
        source: system
        description: Monday of the first period the most recent rate-maintenance edit applies to; null until the tactic is edited.
        default: null

  - name: RetailerDocument
    parent: Promotion
    common_fields: true
    fields:
      - name: promotion_id
        type: string
        source: input
        description: "FK -> Promotion.id; the promotion this paperwork belongs to. Supplied by the path segment on creation."
      - name: doc_class
        type: enum
        source: input
        description: COMMITMENT documents gate promotion approval; EVIDENCE documents supply units_verified to deduction validation.
        constraints: "COMMITMENT | EVIDENCE"
      - name: doc_type
        type: enum
        source: input
        description: Paperwork kind. SIGNED_LOI and PORTAL_ACK are COMMITMENT types; SCAN_DATA, DISPLAY_PHOTO and AD_TEARSHEET are EVIDENCE types.
        constraints: "SIGNED_LOI | PORTAL_ACK | SCAN_DATA | DISPLAY_PHOTO | AD_TEARSHEET"
      - name: covers_tactic_type
        type: enum
        source: input
        description: Which tactic line(s) this document covers. ALL covers every tactic type on the promotion.
        constraints: "TPR | DISPLAY | FEATURE | ALL"
      - name: units_verified
        type: integer
        source: input
        description: Cases substantiated by this document. MUST be 0 when doc_class == COMMITMENT; only VERIFIED EVIDENCE rows contribute to deduction entitlement.
        default: 0
        constraints: ">= 0"
      - name: received_at
        type: string
        source: input
        description: Instant the retailer's paperwork was received.
        constraints: "ISO 8601 UTC instant with three fractional digits"
      - name: status
        type: enum
        source: system
        description: Verification axis.
        default: SUBMITTED
        constraints: "SUBMITTED | VERIFIED"
      - name: verified_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the verifier; null while SUBMITTED.
        default: null

  - name: VolumeFact
    parent: null
    common_fields: false
    # Append-only fact row: only `id` and `created_at`. No version, no update
    # endpoint — corrections are posted as additional facts, never edits.
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the retailer the volume belongs to."
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand the volume belongs to."
      - name: fact_type
        type: enum
        source: input
        description: SHIPMENT rows are manufacturer shipments (EDI 856); CONSUMPTION rows are retailer point-of-sale (EDI 852).
        constraints: "SHIPMENT | CONSUMPTION"
      - name: period_start
        type: string
        source: input
        description: Monday of the fiscal week this fact belongs to; weeks are half-open [period_start, period_start + 7 days).
        constraints: "ISO 8601 date YYYY-MM-DD, MUST be a Monday"
      - name: units
        type: integer
        source: input
        description: Cases shipped or consumed in that week.
        constraints: ">= 0"
      - name: source
        type: enum
        source: input
        description: Provenance of the row.
        constraints: "EDI_852 | EDI_856 | MANUAL"

  - name: AccrualEntry
    parent: Promotion
    common_fields: true
    fields:
      - name: promotion_id
        type: string
        source: input
        description: "FK -> Promotion.id; the promotion being accrued. Supplied by the path segment on creation."
      - name: period_start
        type: string
        source: input
        description: Monday of the fiscal week being accrued. Unique per (promotion_id, entry_type == ACCRUAL).
        constraints: "ISO 8601 date YYYY-MM-DD, MUST be a Monday"
      - name: method
        type: enum
        source: system
        description: Copied from Promotion.accrual_method at posting time so a later method change cannot rewrite history.
        constraints: "SHIPMENT | CONSUMPTION"
      - name: fact_units
        type: integer
        source: computed
        description: "Units the accrual was computed on; see calculations.accrual_amount_for_period. 0 on REVERSAL entries."
      - name: entry_type
        type: enum
        source: system
        description: ACCRUAL for postings, REVERSAL for compensating entries.
        constraints: "ACCRUAL | REVERSAL"
      - name: amount
        type: number
        source: computed
        description: "Positive magnitude in USD. On a REVERSAL entry this equals the reversed ACCRUAL entry's amount exactly."
      - name: status
        type: enum
        source: system
        description: POSTED for live entries; an ACCRUAL flips to REVERSED once a REVERSAL entry points at it. REVERSAL entries stay POSTED forever.
        default: POSTED
        constraints: "POSTED | REVERSED"
      - name: reverses_entry_id
        type: string
        source: system
        description: "FK -> AccrualEntry.id; on a REVERSAL entry, the ACCRUAL entry it compensates. null on ACCRUAL entries."
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: Free-text reason recorded on the REVERSAL entry; null on ACCRUAL entries.
        default: null
      - name: tactic_line_amounts
        type: array
        source: computed
        description: "Ordered array of { tactic_id, amount } objects — the per-line rounded components that were summed to produce amount, ordered by PromotionTactic.created_at ASC. Empty array on REVERSAL entries."

  - name: Deduction
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the retailer that took the deduction."
      - name: claim_reference
        type: string
        source: input
        description: Retailer's own claim number. Unique per customer_id across all statuses.
        constraints: "1..60 chars"
      - name: claimed_amount
        type: number
        source: input
        description: Gross amount the retailer deducted from remittance.
        constraints: "> 0, exactly 2 decimal places"
      - name: deduction_date
        type: string
        source: input
        description: Date the retailer took the deduction, as printed on the remittance advice.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: promotion_id
        type: string
        source: system
        description: "FK -> Promotion.id; set by the match transition, null while RECEIVED."
        default: null
      - name: status
        type: enum
        source: system
        description: Intake-to-resolution axis.
        default: RECEIVED
        constraints: "RECEIVED | MATCHED | VALIDATED | SETTLED | DISPUTED | RECOVERED | WRITTEN_OFF"
      - name: validation_basis
        type: enum
        source: computed
        description: Copy of Customer.deduction_validation_policy as it stood at validation time; null before validation.
        default: null
        constraints: "EVIDENCE_BASED | AGREEMENT_CAP"
      - name: entitled_amount
        type: number
        source: computed
        description: "Uncapped entitlement produced by the selected variant of calculations.deduction_valuation; null before validation."
        default: null
      - name: validated_amount
        type: number
        source: computed
        description: "min(claimed_amount, entitled_amount); the amount that consumes promotion accrual. null before validation."
        default: null
      - name: variance_amount
        type: number
        source: computed
        description: "round(claimed_amount - validated_amount, 2); the invalid portion eligible for dispute. null before validation."
        default: null
      - name: supersedes_deduction_id
        type: string
        source: input
        description: "FK -> Deduction.id; set when the retailer re-issues a corrected claim replacing an earlier one. null for first-issue claims."
        default: null
      - name: matched_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the DeductionSpecialist who matched the claim to a promotion; null while RECEIVED.
        default: null
      - name: validated_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the TradeFinanceAnalyst who validated the claim; the segregation-of-duties comparand against Promotion.approved_by_user_id.
        default: null
      - name: settled_at
        type: string
        source: system
        description: Logical-clock instant the deduction was settled; null until SETTLED.
        default: null

  - name: Dispute
    parent: Deduction
    common_fields: true
    fields:
      - name: deduction_id
        type: string
        source: input
        description: "FK -> Deduction.id; the claim being disputed. Supplied by the path segment on creation."
      - name: reason_code
        type: enum
        source: input
        description: Why the deduction is considered invalid.
        constraints: "NO_AGREEMENT | NO_EVIDENCE | RATE_MISMATCH | DUPLICATE_CLAIM"
      - name: disputed_amount
        type: number
        source: input
        description: Portion of the claim being challenged. MUST be <= Deduction.claimed_amount.
        constraints: "> 0, exactly 2 decimal places"
      - name: opened_at
        type: string
        source: system
        description: Logical-clock instant the dispute was opened; the anchor for aging_days.
      - name: opened_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID that opened the dispute; the segregation-of-duties comparand for write-off approval.
      - name: status
        type: enum
        source: system
        description: Negotiation axis carrying the retailer round-trip cycle.
        default: OPEN
        constraints: "OPEN | AWAITING_RETAILER | ESCALATED | RECOVERED | WRITTEN_OFF"
      - name: round_count
        type: integer
        source: system
        description: Completed retailer round-trips; incremented by send-to-retailer and capped by MAX_DISPUTE_ROUNDS.
        default: 0
      - name: aging_days
        type: integer
        source: computed
        description: "floor((logical clock now - opened_at) / 86400 seconds). See calculations.dispute_aging."
      - name: retailer_response
        type: enum
        source: system
        description: Most recent retailer answer; null until the retailer responds.
        default: null
        constraints: "ACCEPT_CHARGEBACK | PROVIDE_EVIDENCE | REFUSE"
      - name: recovered_amount
        type: number
        source: system
        description: Cash recovered from the retailer; null unless status == RECOVERED.
        default: null
      - name: write_off_amount
        type: number
        source: system
        description: Amount abandoned; null unless status == WRITTEN_OFF. Feeds Promotion.consumed_deduction_amount.
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID that recorded the recovery or approved the write-off; null while unresolved.
        default: null

  - name: PostEventAnalysis
    parent: Promotion
    common_fields: true
    fields:
      - name: promotion_id
        type: string
        source: input
        description: "FK -> Promotion.id; the analysed promotion. Supplied by the path segment on creation."
      - name: baseline_method
        type: enum
        source: input
        description: Selects the baseline variant of calculations.post_event_analysis. Pinned at creation and reused verbatim on every later recompute.
        constraints: "TRAILING | SEASONAL"
      - name: baseline_weekly_units
        type: number
        source: computed
        description: "Weekly baseline in cases produced by the selected variant."
      - name: promo_consumption_units
        type: integer
        source: computed
        description: "Sum of VolumeFact.units with fact_type == CONSUMPTION for the promotion's customer/brand whose period_start is in [Promotion.window_start, Promotion.window_end)."
      - name: baseline_units
        type: number
        source: computed
        description: "round(baseline_weekly_units * promotion week count, 2)."
      - name: lift_units
        type: number
        source: computed
        description: "round(promo_consumption_units - baseline_units, 2). May be negative."
      - name: post_period_units
        type: integer
        source: computed
        description: "Sum of CONSUMPTION units in the two whole weeks [window_end, window_end + 14 days)."
      - name: cannibalization_units
        type: number
        source: computed
        description: "round(max(0, round(baseline_weekly_units * 2, 2) - post_period_units), 2)."
      - name: net_incremental_units
        type: number
        source: computed
        description: "round(lift_units - cannibalization_units, 2)."
      - name: incremental_gross_profit
        type: number
        source: computed
        description: "round(net_incremental_units * Brand.unit_margin, 2)."
      - name: net_spend
        type: number
        source: computed
        description: "round(Promotion.recognized_spend_amount - recovered_total, 2), where recovered_total is the sum of Dispute.recovered_amount over RECOVERED disputes of this promotion's deductions."
      - name: roi
        type: number
        source: computed
        description: "round(incremental_gross_profit / net_spend, 4); null when net_spend <= 0 or data_status == INSUFFICIENT_DATA."
        default: null
      - name: data_status
        type: enum
        source: computed
        description: INSUFFICIENT_DATA when zero CONSUMPTION VolumeFact rows exist inside the promotion window; COMPLETE otherwise.
        constraints: "COMPLETE | INSUFFICIENT_DATA"
      - name: computed_at
        type: string
        source: system
        description: Logical-clock instant of the most recent recompute; refreshed by cascaded recomputes as well as by the analyze call.

  - name: ComplianceAudit
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the audited retailer. Supplied by the path segment on creation."
      - name: scope_start
        type: string
        source: input
        description: Inclusive first day of the audited trading period.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: scope_end
        type: string
        source: input
        description: Exclusive last day of the audited trading period; MUST be > scope_start.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: Audit axis; drives the Customer's audit_status dimension.
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | FINDINGS_ISSUED"
      - name: auditor_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceAuditor who opened the audit.
      - name: findings_count
        type: integer
        source: system
        description: Number of recorded findings; issuance requires at least one.
        default: 0
      - name: recovery_claim_amount
        type: number
        source: computed
        description: "Sum of the `amount` values recorded by every record-finding call on this audit, rounded to 2 decimals."
        default: 0.00
      - name: issued_at
        type: string
        source: system
        description: Logical-clock instant the findings were issued; null before issuance.
        default: null

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: TradeProgram
    state_field: status
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /trade-marketing/programs/{programId}/lock"
        actor: TradeMarketingDirector
        preconditions:
          - "program.status == OPEN"
        side_effects:
          - "Every BudgetAllocation with program_id == program.id recomputes posture; because calculations.allocation_posture ranks FROZEN first, each such allocation's posture becomes FROZEN."
          - "increments TradeProgram.version by 1; refreshes updated_at"
        note: "Terminal. Year-end lock: no new allocation or promotion money may be committed under a LOCKED program."

  - entity: BudgetAllocation
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /trade-marketing/budget-allocations/{allocationId}/approve"
        actor: TradeMarketingDirector
        preconditions:
          - "allocation.status == DRAFT"
          - "TradeProgram.status == OPEN for allocation.program_id"
        side_effects:
          - "recomputes calculations.allocation_ledger_rollup (committed_amount, accrued_amount, settled_amount, available_amount, committed_units, unreserved_units, at_risk_amount)"
          - "increments BudgetAllocation.version by 1; refreshes updated_at"
        note: "Promotions may be created against an allocation only once it is APPROVED (cross-entity gate)."

  - entity: BudgetAllocation
    state_field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: a child Promotion's spend_status becomes OVERSPENT (cascade hop 3 of transitive_cascade.deduction_validation_overspend_chain)"
        actor: system
        preconditions:
          - "allocation.overspend_event_count was 0 and is incremented to 1 or more by the overspending child promotion"
          - "TradeProgram.status == OPEN (otherwise FROZEN outranks RESTRICTED)"
        side_effects:
          - "recomputes calculations.customer_penalty_score for allocation.customer_id, adding RESTRICTED_ALLOCATION_POINTS per RESTRICTED allocation"
          - "increments BudgetAllocation.version by 1; refreshes updated_at"
        note: "RESTRICTED blocks POST /trade-marketing/promotions and promotion approval against this allocation with ERR_ALLOCATION_POSTURE_RESTRICTED. Never reverts — overspend_event_count is monotonic."
      - from: OPEN
        to: FROZEN
        trigger: "system: owning TradeProgram transitions OPEN -> LOCKED"
        actor: system
        preconditions:
          - "TradeProgram.status == LOCKED"
        side_effects:
          - "increments BudgetAllocation.version by 1; refreshes updated_at"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: owning TradeProgram transitions OPEN -> LOCKED"
        actor: system
        preconditions:
          - "TradeProgram.status == LOCKED"
        side_effects:
          - "increments BudgetAllocation.version by 1; refreshes updated_at"

  - entity: Promotion
    state_field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [ANALYZED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /trade-marketing/promotions/{promotionId}/submit"
        actor: KeyAccountManager
        preconditions:
          - "promotion.lifecycle_status == DRAFT"
          - "at least one PromotionTactic with status == PLANNED exists for this promotion"
          - "BudgetAllocation.status == APPROVED for promotion.allocation_id"
        side_effects:
          - "recomputes calculations.promotion_planned_total_spend (tactic_subtotal_amount, allowance_rate, off_invoice_allowance_amount, planned_total_spend, committed_units)"
          - "increments Promotion.version by 1; refreshes updated_at"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /trade-marketing/promotions/{promotionId}/request-changes"
        actor: TradeMarketingDirector
        preconditions:
          - "promotion.lifecycle_status == SUBMITTED"
        side_effects:
          - "stores the reviewer comment on the promotion audit trail"
          - "increments Promotion.version by 1; refreshes updated_at"
        note: "Branch 1 of the SUBMITTED fork. Divergent side-effect set: no budget money moves."
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "POST /trade-marketing/promotions/{promotionId}/revise"
        actor: KeyAccountManager
        preconditions:
          - "promotion.lifecycle_status == CHANGES_REQUESTED"
          - "promotion.revision_round < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "increments Promotion.revision_round by 1"
          - "unlocks tactic editing (PromotionTactic rows become editable again)"
          - "increments Promotion.version by 1; refreshes updated_at"
        note: "Closes the revision cycle DRAFT -> SUBMITTED -> CHANGES_REQUESTED -> DRAFT. A third revise attempt is rejected with ERR_MAX_REVISION_ROUNDS."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /trade-marketing/promotions/{promotionId}/approve"
        actor: TradeMarketingDirector
        preconditions:
          - "promotion.lifecycle_status == SUBMITTED"
          - "BudgetAllocation.status == APPROVED and BudgetAllocation.posture == OPEN"
          - "promotion.commitment_verified == true (every DISPLAY and FEATURE tactic covered by a VERIFIED COMMITMENT document)"
          - "BudgetAllocation.available_amount >= promotion.planned_total_spend"
        side_effects:
          - "sets Promotion.approved_by_user_id to the caller's X-User-ID"
          - "commits money and volume: BudgetAllocation.committed_amount += promotion.planned_total_spend, committed_units += promotion.committed_units, and available_amount / unreserved_units are recomputed from those"
          - "increments Promotion.version by 1 and BudgetAllocation.version by 1; refreshes updated_at on both"
        note: "Branch 2 of the SUBMITTED fork. Divergent side-effect set: budget dollars AND incremental units are reserved."
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /trade-marketing/promotions/{promotionId}/withdraw"
        actor: KeyAccountManager
        preconditions:
          - "promotion.lifecycle_status == APPROVED"
          - "promotion.gross_accrued_amount == 0.00 (nothing accrued yet)"
        side_effects:
          - "sets every PromotionTactic of this promotion with status IN {PLANNED, ACTIVE} to CANCELLED (conditional cascade: COMPLETED tactics are untouched)"
          - "because all tactics are CANCELLED, promotion.committed_units recomputes to 0 and planned_total_spend recomputes to 0.00"
          - "because the promotion left {APPROVED, LIVE, ENDED, ANALYZED}, BudgetAllocation.committed_amount and committed_units drop this promotion's contribution, restoring available_amount and unreserved_units to their pre-approval values exactly"
          - "increments Promotion.version by 1 and BudgetAllocation.version by 1; refreshes updated_at on both"
        note: "Compensating action for approve. Terminal."
      - from: APPROVED
        to: LIVE
        trigger: "POST /trade-marketing/promotion-activation-runs"
        actor: system
        preconditions:
          - "promotion.lifecycle_status == APPROVED"
          - "promotion.window_start <= logical clock date"
        side_effects:
          - "sets every PromotionTactic whose window contains the clock date (window_start <= clock date < window_end) to ACTIVE"
          - "increments Promotion.version by 1; refreshes updated_at"
        note: "Ops-run checkpoint. Within one run activation is evaluated before ending, so a promotion whose whole window is in the past traverses APPROVED -> LIVE -> ENDED in a single call."
      - from: LIVE
        to: ENDED
        trigger: "POST /trade-marketing/promotion-activation-runs"
        actor: system
        preconditions:
          - "promotion.lifecycle_status == LIVE"
          - "promotion.window_end <= logical clock date"
        side_effects:
          - "sets every PromotionTactic with status IN {PLANNED, ACTIVE} whose window_end <= clock date to COMPLETED"
          - "increments Promotion.version by 1; refreshes updated_at"
      - from: ENDED
        to: ANALYZED
        trigger: "POST /trade-marketing/promotions/{promotionId}/analyze"
        actor: TradeFinanceAnalyst
        preconditions:
          - "promotion.lifecycle_status == ENDED"
          - "no PostEventAnalysis row exists for this promotion"
        side_effects:
          - "creates one PostEventAnalysis row and runs calculations.post_event_analysis with the requested baseline_method"
          - "sets Promotion.performance_flag from the resulting roi: UNDERPERFORMING when roi < ROI_FLOOR, ON_TRACK when roi >= ROI_FLOOR, UNRATED when roi is null"
          - "when performance_flag becomes UNDERPERFORMING, BudgetAllocation.at_risk_amount is recomputed to include this analysis's net_spend"
          - "increments Promotion.version by 1; refreshes updated_at"
        note: "Terminal for the lifecycle axis. Accrual, deduction and dispute activity continue on an ANALYZED promotion, and each such event recomputes the existing PostEventAnalysis in place."

  - entity: Promotion
    state_field: spend_status
    initial_state: WITHIN_BUDGET
    terminal_states: []
    transitions:
      - from: WITHIN_BUDGET
        to: OVERSPEND_WARNING
        trigger: "system: recompute of calculations.promotion_spend_status after an accrual posting, accrual reversal, deduction validation or dispute write-off"
        actor: system
        preconditions:
          - "spend_ratio >= OVERSPEND_WARNING_RATIO (0.9000) and spend_ratio <= OVERSPENT_RATIO (1.0000)"
        side_effects:
          - "increments Promotion.version by 1; refreshes updated_at"
      - from: OVERSPEND_WARNING
        to: OVERSPENT
        trigger: "system: recompute of calculations.promotion_spend_status after an accrual posting, accrual reversal, deduction validation or dispute write-off"
        actor: system
        preconditions:
          - "spend_ratio > OVERSPENT_RATIO (1.0000)"
        side_effects:
          - "increments BudgetAllocation.overspend_event_count by 1 the first time this promotion reaches OVERSPENT, which drives that allocation's posture OPEN -> RESTRICTED"
          - "increments Promotion.version by 1; refreshes updated_at"
        note: "Cascade hop 2 of transitive_cascade.deduction_validation_overspend_chain."
      - from: WITHIN_BUDGET
        to: OVERSPENT
        trigger: "system: recompute of calculations.promotion_spend_status after a single event that pushes spend_ratio past 1.0000 directly"
        actor: system
        preconditions:
          - "spend_ratio > OVERSPENT_RATIO (1.0000)"
        side_effects:
          - "increments BudgetAllocation.overspend_event_count by 1 the first time this promotion reaches OVERSPENT, which drives that allocation's posture OPEN -> RESTRICTED"
          - "increments Promotion.version by 1; refreshes updated_at"
      - from: OVERSPEND_WARNING
        to: WITHIN_BUDGET
        trigger: "system: recompute of calculations.promotion_spend_status after an accrual reversal lowers recognized_spend_amount"
        actor: system
        preconditions:
          - "spend_ratio < OVERSPEND_WARNING_RATIO (0.9000)"
        side_effects:
          - "increments Promotion.version by 1; refreshes updated_at"
      - from: OVERSPENT
        to: OVERSPEND_WARNING
        trigger: "system: recompute of calculations.promotion_spend_status after an accrual reversal lowers recognized_spend_amount"
        actor: system
        preconditions:
          - "spend_ratio >= OVERSPEND_WARNING_RATIO (0.9000) and spend_ratio <= OVERSPENT_RATIO (1.0000)"
        side_effects:
          - "BudgetAllocation.overspend_event_count is NOT decremented, so the allocation stays RESTRICTED"
          - "increments Promotion.version by 1; refreshes updated_at"
        note: "The spend axis is fully reversible; the allocation posture it triggered is not."

  - entity: PromotionTactic
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /trade-marketing/promotion-activation-runs"
        actor: system
        preconditions:
          - "owning promotion transitions to or already is LIVE in this run"
          - "tactic.window_start <= clock date < tactic.window_end"
        side_effects:
          - "increments PromotionTactic.version by 1; refreshes updated_at"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /trade-marketing/promotion-activation-runs"
        actor: system
        preconditions:
          - "tactic.window_end <= clock date"
        side_effects:
          - "increments PromotionTactic.version by 1; refreshes updated_at"
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /trade-marketing/promotion-activation-runs"
        actor: system
        preconditions:
          - "owning promotion transitions LIVE -> ENDED in this run"
          - "tactic.window_end <= clock date"
        side_effects:
          - "increments PromotionTactic.version by 1; refreshes updated_at"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /trade-marketing/tactics/{tacticId}/cancel"
        actor: KeyAccountManager
        preconditions:
          - "tactic.status == PLANNED"
          - "owning promotion.lifecycle_status == DRAFT"
        side_effects:
          - "removes this line from Promotion.tactic_subtotal_amount, allowance_rate, off_invoice_allowance_amount, planned_total_spend and committed_units"
          - "recomputes calculations.commitment_coverage on the owning promotion"
          - "increments PromotionTactic.version by 1 and Promotion.version by 1"
        note: "Planning-time removal of a line. This is the transition that lets a non-PLANNED tactic exist under a DRAFT promotion, which is what makes validations priority 44 (ERR_TACTIC_STATE_INVALID) reachable."
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /trade-marketing/promotions/{promotionId}/withdraw"
        actor: KeyAccountManager
        preconditions:
          - "owning promotion transitions APPROVED -> WITHDRAWN"
        side_effects:
          - "removes this line from Promotion.tactic_subtotal_amount and Promotion.committed_units"
          - "increments PromotionTactic.version by 1; refreshes updated_at"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /trade-marketing/promotions/{promotionId}/withdraw"
        actor: KeyAccountManager
        preconditions:
          - "owning promotion transitions APPROVED -> WITHDRAWN"
        side_effects:
          - "removes this line from Promotion.tactic_subtotal_amount and Promotion.committed_units"
          - "increments PromotionTactic.version by 1; refreshes updated_at"

  - entity: RetailerDocument
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /trade-marketing/documents/{documentId}/verify"
        actor: KeyAccountManager | TradeFinanceAnalyst
        preconditions:
          - "document.status == SUBMITTED"
          - "caller role is KeyAccountManager when doc_class == COMMITMENT, TradeFinanceAnalyst when doc_class == EVIDENCE"
        side_effects:
          - "sets verified_by_user_id to the caller's X-User-ID"
          - "when doc_class == COMMITMENT, recomputes calculations.commitment_coverage on the owning promotion (Promotion.commitment_verified may flip false -> true)"
          - "when doc_class == EVIDENCE, the units_verified now counts toward calculations.deduction_valuation for that promotion's deductions"
          - "increments RetailerDocument.version by 1 and Promotion.version by 1; refreshes updated_at on both"

  - entity: AccrualEntry
    state_field: status
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /trade-marketing/accruals/{accrualId}/reverse"
        actor: TradeFinanceAnalyst
        preconditions:
          - "entry.entry_type == ACCRUAL"
          - "entry.status == POSTED"
        side_effects:
          - "creates a second AccrualEntry with entry_type == REVERSAL, status == POSTED, amount equal to the reversed entry's amount, reverses_entry_id == the reversed entry's id, fact_units == 0 and tactic_line_amounts == []"
          - "recomputes calculations.promotion_accrual_ledger, so Promotion.reversed_accrual_amount rises by that amount and accrued_balance falls back to its pre-posting value"
          - "recomputes calculations.promotion_spend_status, which may move spend_status downward"
          - "recomputes BudgetAllocation.accrued_amount"
          - "increments AccrualEntry.version by 1 on the reversed entry, Promotion.version by 1 and BudgetAllocation.version by 1"

  - entity: Deduction
    state_field: status
    initial_state: RECEIVED
    terminal_states: [SETTLED, RECOVERED, WRITTEN_OFF]
    transitions:
      - from: RECEIVED
        to: MATCHED
        trigger: "POST /trade-marketing/deductions/{deductionId}/match"
        actor: DeductionSpecialist
        preconditions:
          - "deduction.status == RECEIVED"
          - "target promotion exists and promotion.customer_id == deduction.customer_id"
          - "promotion.lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED}"
        side_effects:
          - "sets deduction.promotion_id and matched_by_user_id"
          - "increments Deduction.version by 1; refreshes updated_at"
      - from: MATCHED
        to: VALIDATED
        trigger: "POST /trade-marketing/deductions/{deductionId}/validate"
        actor: TradeFinanceAnalyst
        preconditions:
          - "deduction.status == MATCHED"
          - "caller X-User-ID != Promotion.approved_by_user_id (segregation of duties)"
          - "expected_promotion_version matches the matched promotion's current version"
          - "when Customer.deduction_validation_policy == EVIDENCE_BASED: verified evidence units for the promotion > 0"
          - "when Customer.deduction_validation_policy == AGREEMENT_CAP: Promotion.accrued_balance > 0.00"
        side_effects:
          - "runs calculations.deduction_valuation and writes validation_basis, entitled_amount, validated_amount, variance_amount"
          - "sets validated_by_user_id to the caller's X-User-ID"
          - "recomputes calculations.promotion_accrual_ledger: Promotion.consumed_deduction_amount rises by validated_amount and accrued_balance falls by the same amount (hop 1)"
          - "recomputes calculations.promotion_spend_status from the new consumed_deduction_amount, which may drive spend_status to OVERSPENT (hop 2)"
          - "recomputes BudgetAllocation.accrued_amount and, when an analysis exists, the promotion's PostEventAnalysis"
          - "increments Deduction.version by 1 and Promotion.version by 1; refreshes updated_at on both"
      - from: VALIDATED
        to: SETTLED
        trigger: "POST /trade-marketing/deductions/{deductionId}/settle"
        actor: TradeFinanceAnalyst
        preconditions:
          - "deduction.status == VALIDATED"
          - "Customer.trading_status == ACTIVE for deduction.customer_id"
        side_effects:
          - "sets settled_at to the logical clock instant"
          - "recomputes BudgetAllocation.settled_amount and Customer.open_deduction_amount"
          - "increments Deduction.version by 1; refreshes updated_at"
        note: "Cross-entity guard: a customer on CREDIT_HOLD or SUSPENDED cannot have deductions settled."
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /trade-marketing/deductions/{deductionId}/dispute"
        actor: DeductionSpecialist
        preconditions:
          - "deduction.status == RECEIVED"
          - "disputed_amount <= deduction.claimed_amount"
        side_effects:
          - "creates one Dispute row in status OPEN with opened_at = logical clock instant and opened_by_user_id = caller X-User-ID"
          - "increments Deduction.version by 1; refreshes updated_at"
        note: "An unmatched claim disputed for reason NO_AGREEMENT never touches any promotion ledger."
      - from: MATCHED
        to: DISPUTED
        trigger: "POST /trade-marketing/deductions/{deductionId}/dispute"
        actor: DeductionSpecialist
        preconditions:
          - "deduction.status == MATCHED"
          - "disputed_amount <= deduction.claimed_amount"
        side_effects:
          - "creates one Dispute row in status OPEN"
          - "increments Deduction.version by 1; refreshes updated_at"
      - from: VALIDATED
        to: DISPUTED
        trigger: "POST /trade-marketing/deductions/{deductionId}/dispute"
        actor: DeductionSpecialist
        preconditions:
          - "deduction.status == VALIDATED"
          - "disputed_amount <= deduction.variance_amount"
        side_effects:
          - "creates one Dispute row in status OPEN"
          - "increments Deduction.version by 1; refreshes updated_at"
        note: "Only the invalid portion (variance_amount) of an already validated claim may be disputed."
      - from: DISPUTED
        to: RECOVERED
        trigger: "POST /trade-marketing/disputes/{disputeId}/record-recovery"
        actor: DeductionSpecialist
        preconditions:
          - "the deduction's Dispute transitions to RECOVERED"
        side_effects:
          - "recomputes Customer.open_deduction_amount"
          - "increments Deduction.version by 1; refreshes updated_at"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /trade-marketing/disputes/{disputeId}/write-off"
        actor: DeductionSpecialist | TradeMarketingDirector
        preconditions:
          - "the deduction's Dispute transitions to WRITTEN_OFF"
        side_effects:
          - "recomputes Customer.open_deduction_amount and Customer.write_off_ytd_amount"
          - "increments Deduction.version by 1; refreshes updated_at"

  - entity: Dispute
    state_field: status
    initial_state: OPEN
    terminal_states: [RECOVERED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: AWAITING_RETAILER
        trigger: "POST /trade-marketing/disputes/{disputeId}/send-to-retailer"
        actor: DeductionSpecialist
        preconditions:
          - "dispute.status == OPEN"
          - "dispute.round_count < MAX_DISPUTE_ROUNDS (2)"
        side_effects:
          - "increments Dispute.round_count by 1"
          - "increments Dispute.version by 1; refreshes updated_at"
      - from: AWAITING_RETAILER
        to: OPEN
        trigger: "POST /trade-marketing/disputes/{disputeId}/retailer-respond"
        actor: CustomerPortalUser
        preconditions:
          - "dispute.status == AWAITING_RETAILER"
          - "caller X-User-ID == the disputed Deduction's customer_id"
        side_effects:
          - "records retailer_response"
          - "increments Dispute.version by 1; refreshes updated_at"
        note: "Closes the negotiation cycle OPEN -> AWAITING_RETAILER -> OPEN. round_count is not reset, so at most MAX_DISPUTE_ROUNDS loops are possible."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /trade-marketing/deduction-aging-runs"
        actor: system
        preconditions:
          - "dispute.aging_days >= AGING_ESCALATION_DAYS (90)"
        side_effects:
          - "recomputes calculations.customer_penalty_score for the disputed deduction's customer, adding ESCALATED_DISPUTE_POINTS"
          - "increments Dispute.version by 1; refreshes updated_at"
      - from: AWAITING_RETAILER
        to: ESCALATED
        trigger: "POST /trade-marketing/deduction-aging-runs"
        actor: system
        preconditions:
          - "dispute.aging_days >= AGING_ESCALATION_DAYS (90)"
        side_effects:
          - "recomputes calculations.customer_penalty_score for the disputed deduction's customer, adding ESCALATED_DISPUTE_POINTS"
          - "increments Dispute.version by 1; refreshes updated_at"
      - from: OPEN
        to: RECOVERED
        trigger: "POST /trade-marketing/disputes/{disputeId}/record-recovery"
        actor: DeductionSpecialist
        preconditions:
          - "dispute.status == OPEN"
          - "recovered_amount <= dispute.disputed_amount"
        side_effects:
          - "sets recovered_amount and resolved_by_user_id"
          - "sets the parent Deduction.status to RECOVERED"
          - "when a PostEventAnalysis exists for the deduction's promotion, recomputes its net_spend and roi (recovery lowers net_spend)"
          - "increments Dispute.version by 1 and Deduction.version by 1"
      - from: ESCALATED
        to: RECOVERED
        trigger: "POST /trade-marketing/disputes/{disputeId}/record-recovery"
        actor: DeductionSpecialist
        preconditions:
          - "dispute.status == ESCALATED"
          - "recovered_amount <= dispute.disputed_amount"
        side_effects:
          - "sets recovered_amount and resolved_by_user_id"
          - "sets the parent Deduction.status to RECOVERED"
          - "increments Dispute.version by 1 and Deduction.version by 1"
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /trade-marketing/disputes/{disputeId}/write-off"
        actor: DeductionSpecialist | TradeMarketingDirector
        preconditions:
          - "dispute.status == OPEN"
          - "write_off_amount <= dispute.disputed_amount"
          - "when write_off_amount >= WRITE_OFF_SELF_APPROVAL_LIMIT (500.00): caller role == TradeMarketingDirector AND caller X-User-ID != dispute.opened_by_user_id"
        side_effects:
          - "sets write_off_amount and resolved_by_user_id"
          - "sets the parent Deduction.status to WRITTEN_OFF"
          - "recomputes Promotion.consumed_deduction_amount for the deduction's promotion (write-offs are recognized spend), which recomputes recognized_spend_amount and spend_status (hop 1)"
          - "when a PostEventAnalysis exists, recomputes its net_spend and roi (hop 2), which may flip Promotion.performance_flag to UNDERPERFORMING (hop 3), which raises BudgetAllocation.at_risk_amount (hop 4)"
          - "increments Dispute.version by 1, Deduction.version by 1, Promotion.version by 1 and BudgetAllocation.version by 1"
      - from: ESCALATED
        to: WRITTEN_OFF
        trigger: "POST /trade-marketing/disputes/{disputeId}/write-off"
        actor: DeductionSpecialist | TradeMarketingDirector
        preconditions:
          - "dispute.status == ESCALATED"
          - "write_off_amount <= dispute.disputed_amount"
          - "when write_off_amount >= WRITE_OFF_SELF_APPROVAL_LIMIT (500.00): caller role == TradeMarketingDirector AND caller X-User-ID != dispute.opened_by_user_id"
        side_effects:
          - "same cascade as the OPEN -> WRITTEN_OFF transition"
          - "increments Dispute.version by 1, Deduction.version by 1, Promotion.version by 1 and BudgetAllocation.version by 1"

  - entity: Customer
    state_field: trading_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /trade-marketing/customers/{customerId}/credit-hold"
        actor: DeductionSpecialist | TradeMarketingDirector
        preconditions:
          - "customer.trading_status == ACTIVE"
        side_effects:
          - "stores credit_hold_reason"
          - "increments Customer.version by 1; refreshes updated_at"
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system: calculations.customer_penalty_score recompute lands compliance_penalty_points >= CREDIT_HOLD_POINTS (10)"
        actor: system
        preconditions:
          - "customer.trading_status == ACTIVE"
          - "compliance_penalty_points >= 10 and < 25"
        side_effects:
          - "sets credit_hold_reason to \"AUTO: compliance penalty points <points>\""
          - "increments Customer.version by 1; refreshes updated_at"
        note: "Cascade hop 4 of transitive_cascade.deduction_validation_overspend_chain. Does not touch audit_status."
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: "system: calculations.customer_penalty_score recompute lands compliance_penalty_points >= SUSPENSION_POINTS (25)"
        actor: system
        preconditions:
          - "customer.trading_status == CREDIT_HOLD"
          - "compliance_penalty_points >= 25"
        side_effects:
          - "increments Customer.version by 1; refreshes updated_at"

  - entity: Customer
    state_field: audit_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: AUDIT_IN_PROGRESS
        trigger: "POST /trade-marketing/customers/{customerId}/compliance-audits"
        actor: ComplianceAuditor
        preconditions:
          - "customer.audit_status == CLEAR"
        side_effects:
          - "increments Customer.version by 1; refreshes updated_at"
        note: "Independent of trading_status: opening an audit never changes the commercial axis."
      - from: AUDIT_IN_PROGRESS
        to: FINDINGS_OPEN
        trigger: "POST /trade-marketing/compliance-audits/{auditId}/issue-findings"
        actor: ComplianceAuditor
        preconditions:
          - "customer.audit_status == AUDIT_IN_PROGRESS"
          - "audit.findings_count >= 1"
        side_effects:
          - "recomputes calculations.customer_penalty_score, adding FINDINGS_ISSUED_POINTS (10), which may drive trading_status ACTIVE -> CREDIT_HOLD on the other axis"
          - "increments Customer.version by 1; refreshes updated_at"

  - entity: ComplianceAudit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [FINDINGS_ISSUED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /trade-marketing/compliance-audits/{auditId}/record-finding"
        actor: ComplianceAuditor
        preconditions:
          - "audit.status == SCHEDULED"
        side_effects:
          - "increments findings_count by 1 and adds the finding amount to recovery_claim_amount"
          - "increments ComplianceAudit.version by 1; refreshes updated_at"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /trade-marketing/compliance-audits/{auditId}/record-finding"
        actor: ComplianceAuditor
        preconditions:
          - "audit.status == IN_PROGRESS"
        side_effects:
          - "increments findings_count by 1 and adds the finding amount to recovery_claim_amount"
          - "increments ComplianceAudit.version by 1; refreshes updated_at"
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: "POST /trade-marketing/compliance-audits/{auditId}/issue-findings"
        actor: ComplianceAuditor
        preconditions:
          - "audit.status == IN_PROGRESS"
          - "audit.findings_count >= 1"
        side_effects:
          - "sets issued_at to the logical clock instant"
          - "sets Customer.audit_status to FINDINGS_OPEN and recomputes Customer.compliance_penalty_score"
          - "increments ComplianceAudit.version by 1 and Customer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: promotion-create-stale-allocation
    parent_entity: BudgetAllocation
    write_endpoint: "POST /trade-marketing/promotions"
    occ_field: "expected_allocation_version"
    description: |
      Creating a Promotion against a BudgetAllocation whose version has advanced
      since the client last read it is rejected. Two promotions may legitimately
      be planned against the same allocation cell, and each approval consumes
      available_amount, so a create carrying a stale allocation version was
      planned against a balance that no longer exists.
    error_id: ERR_STALE_ALLOCATION_VERSION
    http_status: 412

  - rule_id: deduction-validate-stale-promotion
    parent_entity: Promotion
    write_endpoint: "POST /trade-marketing/deductions/{deductionId}/validate"
    occ_field: "expected_promotion_version"
    description: |
      Validating a Deduction against a Promotion whose version has advanced since
      the client last read it is rejected. Several deductions may legitimately be
      validated against one promotion and each one consumes accrued_balance, so a
      validation carrying a stale promotion version was priced off a balance that
      has already been spent.
    error_id: ERR_STALE_PROMOTION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# All money is USD with exactly 2 decimal places, round_half_up, unless a rule
# states otherwise. Ratios carry 4 decimal places, round_half_up.
# =============================================================================
calculations:
  - name: program_budget_rollup
    trigger: "on BudgetAllocation creation, and on read of TradeProgram"
    algorithm: aggregation
    formula: |
      allocated_amount   = round(SUM(a.planned_amount
                                     for a in BudgetAllocation
                                     where a.program_id == program.id
                                       and a.status IN {DRAFT, APPROVED}), 2)
      unallocated_amount = round(program.total_budget_amount - allocated_amount, 2)
    input_set: "Every BudgetAllocation of the program; BudgetAllocation has no terminal/void status, so both DRAFT and APPROVED rows count. Order-insensitive (plain sum), no tie-break needed."
    precision: "2 decimal places, round_half_up"

  - name: tactic_line_planned_spend
    trigger: "on POST /trade-marketing/promotions/{promotionId}/tactics and on PATCH /trade-marketing/tactics/{tacticId}"
    algorithm: aggregation
    formula: |
      week_count = (date(window_end) - date(window_start)).days / 7      # always integral
      if tactic_type == TPR:
          line_planned_spend = round(planned_units * rate_per_case, 2)
      else:                                                             # DISPLAY, FEATURE
          line_planned_spend = round(fixed_fee, 2)
    input_set: "The single tactic row being written."
    precision: "2 decimal places, round_half_up. rate_per_case may carry 3 decimals, so this rounding is load-bearing."

  - name: promotion_planned_total_spend
    trigger: "on tactic create, tactic PATCH, promotion submit, promotion approve and promotion withdraw"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — per-line round FIRST, then sum (PINNED ORDER; summing raw
      # products and rounding once at the end is WRONG and can differ by cents).
      tactic_subtotal_amount = SUM(t.line_planned_spend
                                   for t in PromotionTactic
                                   where t.promotion_id == promotion.id
                                     and t.status IN {PLANNED, ACTIVE, COMPLETED})
      # STEP 2 — the off-invoice allowance tier is selected from
      # tactic_subtotal_amount ONLY. It is NEVER selected from
      # planned_total_spend, even though planned_total_spend is the figure the
      # allowance is "a percentage of" in trade-marketing prose. Evaluation
      # order is subtotal -> tier -> allowance -> total; there is no fixed point
      # to iterate.
      if   tactic_subtotal_amount <  10000.00: allowance_rate = 0.000
      elif tactic_subtotal_amount <  50000.00: allowance_rate = 0.020
      else:                                    allowance_rate = 0.035
      # STEP 3
      off_invoice_allowance_amount = round(tactic_subtotal_amount * allowance_rate, 2)
      # STEP 4
      planned_total_spend = round(tactic_subtotal_amount + off_invoice_allowance_amount, 2)
      committed_units     = SUM(t.planned_units
                                for t in PromotionTactic
                                where t.promotion_id == promotion.id
                                  and t.status IN {PLANNED, ACTIVE, COMPLETED})
    input_set: "Tactics of this promotion with status IN {PLANNED, ACTIVE, COMPLETED}. CANCELLED tactics are excluded, which is why withdrawal drops planned_total_spend to 0.00."
    constants:
      TIER1_CEILING: 10000.00
      TIER2_CEILING: 50000.00
      TIER1_RATE: 0.000
      TIER2_RATE: 0.020
      TIER3_RATE: 0.035
    precision: "2 decimal places, round_half_up; tier comparisons use >= on the lower bound (a subtotal of exactly 10000.00 selects TIER2_RATE)"

  - name: commitment_coverage
    trigger: "on RetailerDocument creation, on document verify, and on promotion approve"
    algorithm: aggregation
    formula: |
      required_types = { t.tactic_type
                         for t in PromotionTactic
                         where t.promotion_id == promotion.id
                           and t.status IN {PLANNED, ACTIVE, COMPLETED}
                           and t.tactic_type IN {DISPLAY, FEATURE} }
      covered_types  = { ct
                         for d in RetailerDocument
                         where d.promotion_id == promotion.id
                           and d.doc_class == COMMITMENT
                           and d.status == VERIFIED
                         for ct in ({TPR, DISPLAY, FEATURE} if d.covers_tactic_type == ALL
                                    else {d.covers_tactic_type}) }
      commitment_verified = required_types.issubset(covered_types)
    input_set: "VERIFIED COMMITMENT documents only; SUBMITTED documents and EVIDENCE documents never count. When the promotion has no DISPLAY and no FEATURE tactic, required_types is empty and commitment_verified is true (empty-set edge)."
    precision: "boolean"

  - name: accrual_amount_for_period
    trigger: "on POST /trade-marketing/promotions/{promotionId}/accruals"
    algorithm: chronological
    formula: |
      # --- period alignment: the two methods look at DIFFERENT weeks ---
      if promotion.accrual_method == SHIPMENT:
          effective_period_start = period_start + SHIP_LEAD_DAYS (14)
          fact_type_filter       = SHIPMENT
      else:                                        # CONSUMPTION
          effective_period_start = period_start
          fact_type_filter       = CONSUMPTION
      # effective_period_start MUST satisfy
      #   promotion.window_start <= effective_period_start < promotion.window_end
      # otherwise the call is rejected with ERR_ACCRUAL_WINDOW_MISMATCH.

      fact_units = SUM(v.units
                       for v in VolumeFact
                       where v.customer_id == promotion.customer_id
                         and v.brand_id    == promotion.brand_id
                         and v.fact_type   == fact_type_filter
                         and v.period_start == period_start)     # exact week match

      # --- which tactic lines are live in this period (half-open window) ---
      live = [ t for t in PromotionTactic
               where t.promotion_id == promotion.id
                 and t.status IN {PLANNED, ACTIVE, COMPLETED}
                 and t.window_start <= effective_period_start < t.window_end ]
      # ordered by t.created_at ASC (never by t.id) so tactic_line_amounts is
      # deterministic.

      # --- per-line rounding FIRST, then sum (PINNED ORDER) ---
      lines = []
      for t in live ordered by created_at ASC:
          if t.tactic_type == TPR:
              lines.append({tactic_id: t.id, amount: round(fact_units * t.rate_per_case, 2)})
          else:                                  # DISPLAY, FEATURE: fee amortised per week
              lines.append({tactic_id: t.id, amount: round(t.fixed_fee / t.week_count, 2)})
      amount = round(SUM(l.amount for l in lines), 2)
      tactic_line_amounts = lines
    input_set: "VolumeFact rows for the promotion's customer_id and brand_id whose period_start equals the requested period exactly (no week ranges, no aggregation across weeks). Tactics with status IN {PLANNED, ACTIVE, COMPLETED}; CANCELLED tactics contribute nothing."
    constants:
      SHIP_LEAD_DAYS: 14
    precision: "2 decimal places, round_half_up, applied ONCE PER LINE and then summed. Summing unrounded products and rounding at the end is a different (wrong) result."
    variants:
      - name: shipment_basis
        when: "Promotion.accrual_method == SHIPMENT (inherited from TradeProgram.accrual_method_default unless the create call overrode it)"
        difference: "Reads SHIPMENT VolumeFact rows and shifts the period forward by SHIP_LEAD_DAYS before testing the promotion and tactic windows, so the week that funds promoted sell-through is the week goods left the plant — 14 days before the consumer saw the price."
      - name: consumption_basis
        when: "Promotion.accrual_method == CONSUMPTION"
        difference: "Reads CONSUMPTION (point-of-sale) VolumeFact rows for the same calendar week with no shift. For identical fact data the two variants accrue different amounts in different weeks, and the same promotion can only be on one basis."

  - name: promotion_accrual_ledger
    trigger: "on accrual post, accrual reverse, deduction validate, deduction settle, dispute write-off and dispute recovery"
    algorithm: aggregation
    formula: |
      gross_accrued_amount     = round(SUM(e.amount for e in AccrualEntry
                                           where e.promotion_id == promotion.id
                                             and e.entry_type == ACCRUAL), 2)
      reversed_accrual_amount  = round(SUM(e.amount for e in AccrualEntry
                                           where e.promotion_id == promotion.id
                                             and e.entry_type == REVERSAL), 2)
      validated_total          = round(SUM(d.validated_amount for d in Deduction
                                           where d.promotion_id == promotion.id
                                             and d.status IN {VALIDATED, SETTLED}), 2)
      written_off_total        = round(SUM(p.write_off_amount for p in Dispute
                                           where p.status == WRITTEN_OFF
                                             and Deduction[p.deduction_id].promotion_id == promotion.id), 2)
      consumed_deduction_amount = round(validated_total + written_off_total, 2)
      accrued_balance           = round(gross_accrued_amount
                                        - reversed_accrual_amount
                                        - consumed_deduction_amount, 2)
      # Conservation identity, always true:
      #   gross_accrued_amount == reversed_accrual_amount
      #                           + consumed_deduction_amount
      #                           + accrued_balance
    input_set: "ACCRUAL entries regardless of status (a REVERSED accrual stays in gross_accrued_amount and is offset by its REVERSAL twin); deductions in {VALIDATED, SETTLED}; WRITTEN_OFF disputes. DISPUTED, RECOVERED and RECEIVED deductions contribute nothing."
    precision: "2 decimal places, round_half_up"

  - name: promotion_spend_status
    trigger: "on accrual post, accrual reverse, deduction validate, dispute write-off, dispute recovery and promotion withdraw"
    algorithm: threshold
    formula: |
      # Non-linear: the live spend view is the WORSE of the accrual-book view and
      # the deduction-book view. A retailer can deduct more than was ever accrued
      # (over-accrual variance) and an accrual can sit un-deducted; recognized
      # spend must not double count, so it is the max of the two, not the sum.
      recognized_spend_amount = round(max(gross_accrued_amount - reversed_accrual_amount,
                                          consumed_deduction_amount), 2)
      if promotion.planned_total_spend == 0.00:
          spend_ratio  = 0.0000
          spend_status = WITHIN_BUDGET
      else:
          spend_ratio = round(recognized_spend_amount / planned_total_spend, 4)
          if   spend_ratio >  OVERSPENT_RATIO:         spend_status = OVERSPENT
          elif spend_ratio >= OVERSPEND_WARNING_RATIO: spend_status = OVERSPEND_WARNING
          else:                                       spend_status = WITHIN_BUDGET
    input_set: "The promotion's own ledger fields from promotion_accrual_ledger. No cross-promotion aggregation."
    constants:
      OVERSPEND_WARNING_RATIO: 0.9000
      OVERSPENT_RATIO: 1.0000
    precision: "spend_ratio to 4 decimal places, round_half_up. Boundaries are exact: ratio == 0.9000 is OVERSPEND_WARNING, ratio == 1.0000 is still OVERSPEND_WARNING (strict > for OVERSPENT), ratio == 1.0001 is OVERSPENT."

  - name: deduction_valuation
    trigger: "on POST /trade-marketing/deductions/{deductionId}/validate"
    algorithm: forward_looking
    formula: |
      validation_basis = Customer[deduction.customer_id].deduction_validation_policy
      contract_rate    = SUM(t.rate_per_case
                             for t in PromotionTactic
                             where t.promotion_id == deduction.promotion_id
                               and t.tactic_type == TPR
                               and t.status IN {PLANNED, ACTIVE, COMPLETED})
      evidence_units   = SUM(d.units_verified
                             for d in RetailerDocument
                             where d.promotion_id == deduction.promotion_id
                               and d.doc_class == EVIDENCE
                               and d.status == VERIFIED)
      if validation_basis == EVIDENCE_BASED:
          entitled_amount = round(evidence_units * contract_rate, 2)
      else:                                        # AGREEMENT_CAP
          entitled_amount = Promotion[deduction.promotion_id].accrued_balance   # as of this request, before this deduction is applied
      validated_amount = min(deduction.claimed_amount, entitled_amount)
      variance_amount  = round(deduction.claimed_amount - validated_amount, 2)
    input_set: "VERIFIED EVIDENCE documents of the matched promotion (SUBMITTED evidence never counts); TPR tactics with status IN {PLANNED, ACTIVE, COMPLETED}. DISPLAY and FEATURE tactics contribute no per-case rate."
    precision: "2 decimal places, round_half_up"
    variants:
      - name: evidence_based
        when: "Customer.deduction_validation_policy == EVIDENCE_BASED"
        difference: "Entitlement is rebuilt bottom-up from substantiated cases (verified scan/photo/tearsheet units x contracted per-case rate) and is NOT capped by the accrual balance, so a well-evidenced claim can legitimately exceed what was accrued and push the promotion over budget."
      - name: agreement_cap
        when: "Customer.deduction_validation_policy == AGREEMENT_CAP"
        difference: "Entitlement is top-down: whatever accrual balance is left on the agreement, ignoring evidence entirely. For identical claim, evidence and accrual data the two variants return different validated_amount values, and the divergence sign flips depending on whether evidence or accrual is scarcer."

  - name: post_event_analysis
    trigger: "on POST /trade-marketing/promotions/{promotionId}/analyze, and on every later recompute caused by deduction validation, dispute write-off or dispute recovery on that promotion"
    algorithm: weighted_scoring
    formula: |
      promo_weeks = (date(promotion.window_end) - date(promotion.window_start)).days / 7
      promo_facts = [ v for v in VolumeFact
                      where v.customer_id == promotion.customer_id
                        and v.brand_id    == promotion.brand_id
                        and v.fact_type   == CONSUMPTION
                        and promotion.window_start <= v.period_start < promotion.window_end ]
      promo_consumption_units = SUM(v.units for v in promo_facts)
      if len(promo_facts) == 0:
          data_status = INSUFFICIENT_DATA
          baseline_weekly_units = 0.00; baseline_units = 0.00; lift_units = 0.00
          post_period_units = 0; cannibalization_units = 0.00
          net_incremental_units = 0.00; incremental_gross_profit = 0.00
          net_spend = round(promotion.recognized_spend_amount - recovered_total, 2)
          roi = null
      else:
          data_status = COMPLETE
          if baseline_method == TRAILING:
              trailing = [ v for v in VolumeFact
                           where same customer/brand, fact_type == CONSUMPTION,
                             and (promotion.window_start - 28 days) <= v.period_start
                                 < promotion.window_start ]
              baseline_weekly_units = round(SUM(v.units for v in trailing) / 4, 2)
          else:                                  # SEASONAL
              baseline_weekly_units = round(Brand[promotion.brand_id].baseline_units_per_week, 2)
          baseline_units        = round(baseline_weekly_units * promo_weeks, 2)
          lift_units            = round(promo_consumption_units - baseline_units, 2)
          post_period_units     = SUM(v.units for v in VolumeFact
                                      where same customer/brand, fact_type == CONSUMPTION,
                                        and promotion.window_end <= v.period_start
                                            < promotion.window_end + 14 days)
          expected_post_units   = round(baseline_weekly_units * 2, 2)
          cannibalization_units = round(max(0, expected_post_units - post_period_units), 2)
          net_incremental_units = round(lift_units - cannibalization_units, 2)
          incremental_gross_profit = round(net_incremental_units * Brand.unit_margin, 2)
          recovered_total = round(SUM(p.recovered_amount for p in Dispute
                                      where p.status == RECOVERED
                                        and Deduction[p.deduction_id].promotion_id == promotion.id), 2)
          net_spend = round(promotion.recognized_spend_amount - recovered_total, 2)
          roi = null if net_spend <= 0.00 else round(incremental_gross_profit / net_spend, 4)
      # Promotion.performance_flag follows directly:
      #   roi is null           -> UNRATED
      #   roi <  ROI_FLOOR      -> UNDERPERFORMING
      #   roi >= ROI_FLOOR      -> ON_TRACK
    input_set: "CONSUMPTION VolumeFact rows only, for the promotion's customer_id and brand_id, in three disjoint half-open week ranges: trailing [window_start-28d, window_start), promoted [window_start, window_end), post [window_end, window_end+14d). SHIPMENT rows are never read here even when the promotion accrues on the shipment basis."
    constants:
      TRAILING_BASELINE_WEEKS: 4
      POST_PERIOD_WEEKS: 2
      ROI_FLOOR: 1.0000
    precision: "units and money to 2 decimal places, roi to 4 decimal places, round_half_up. performance_flag uses >= on ROI_FLOOR, so roi == 1.0000 is ON_TRACK."
    variants:
      - name: trailing_baseline
        when: "PostEventAnalysis.baseline_method == TRAILING"
        difference: "Baseline is the retailer's own average of the four whole weeks immediately before the promotion, so a soft pre-period inflates measured lift."
      - name: seasonal_baseline
        when: "PostEventAnalysis.baseline_method == SEASONAL"
        difference: "Baseline is Brand.baseline_units_per_week, a planning constant independent of the retailer's recent actuals. The two variants report different lift, different cannibalization and different ROI from byte-identical fact data, and the chosen method is pinned at analysis creation so later recomputes cannot silently switch basis."

  - name: dispute_aging
    trigger: "on read of Dispute, and on POST /trade-marketing/deduction-aging-runs"
    algorithm: threshold
    formula: |
      aging_days = floor((logical_clock_now - dispute.opened_at) / 86400 seconds)
      escalate   = dispute.status IN {OPEN, AWAITING_RETAILER}
                   and aging_days >= AGING_ESCALATION_DAYS
    input_set: "Disputes with status IN {OPEN, AWAITING_RETAILER}; ESCALATED, RECOVERED and WRITTEN_OFF disputes are skipped by the aging run. The run processes candidates ordered by Dispute.opened_at ASC, then by Dispute.created_at ASC as the tie-break (never by id)."
    constants:
      AGING_ESCALATION_DAYS: 90
    precision: "whole days, floor. aging_days == 90 escalates (>=), aging_days == 89 does not."

  - name: customer_penalty_score
    trigger: "on allocation posture change, on dispute escalation, on audit findings issuance and on deduction write-off"
    algorithm: weighted_scoring
    formula: |
      compliance_penalty_points =
            RESTRICTED_ALLOCATION_POINTS * COUNT(a for a in BudgetAllocation
                                                 where a.customer_id == customer.id
                                                   and a.posture == RESTRICTED)
          + ESCALATED_DISPUTE_POINTS     * COUNT(p for p in Dispute
                                                 where p.status == ESCALATED
                                                   and Deduction[p.deduction_id].customer_id == customer.id)
          + FINDINGS_ISSUED_POINTS       * COUNT(c for c in ComplianceAudit
                                                 where c.customer_id == customer.id
                                                   and c.status == FINDINGS_ISSUED)
      # trading_status follows, and only ever moves forward:
      #   points >= SUSPENSION_POINTS and trading_status == CREDIT_HOLD -> SUSPENDED
      #   points >= CREDIT_HOLD_POINTS and trading_status == ACTIVE     -> CREDIT_HOLD
    input_set: "RESTRICTED allocations (FROZEN allocations do not score — a year-end lock is not the customer's fault), ESCALATED disputes only, FINDINGS_ISSUED audits only."
    constants:
      RESTRICTED_ALLOCATION_POINTS: 10
      ESCALATED_DISPUTE_POINTS: 5
      FINDINGS_ISSUED_POINTS: 10
      CREDIT_HOLD_POINTS: 10
      SUSPENSION_POINTS: 25
    precision: "integer points; thresholds use >= (exactly 10 points puts an ACTIVE customer on CREDIT_HOLD)"

  - name: allocation_posture
    trigger: "on program lock, on child promotion reaching spend_status == OVERSPENT, and on read of BudgetAllocation"
    algorithm: threshold
    formula: |
      if TradeProgram[allocation.program_id].status == LOCKED: posture = FROZEN
      elif allocation.overspend_event_count >= 1:              posture = RESTRICTED
      else:                                                    posture = OPEN
    input_set: "The owning program's status and the allocation's own monotonic overspend_event_count. Precedence is strictly FROZEN > RESTRICTED > OPEN."
    precision: "enum"

  - name: allocation_ledger_rollup
    trigger: "on promotion approve, promotion withdraw, accrual post, accrual reverse, deduction validate, deduction settle, dispute write-off and analysis recompute"
    algorithm: aggregation
    formula: |
      committed_amount = round(SUM(p.planned_total_spend for p in Promotion
                                   where p.allocation_id == allocation.id
                                     and p.lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED}), 2)
      committed_units  = SUM(p.committed_units for p in Promotion
                             where p.allocation_id == allocation.id
                               and p.lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED})
      accrued_amount   = round(SUM(p.gross_accrued_amount - p.reversed_accrual_amount
                                   for p in Promotion where p.allocation_id == allocation.id), 2)
      settled_amount   = round(SUM(d.validated_amount for d in Deduction
                                   where d.status == SETTLED
                                     and Promotion[d.promotion_id].allocation_id == allocation.id), 2)
      at_risk_amount   = round(SUM(latest_analysis(p).net_spend for p in Promotion
                                   where p.allocation_id == allocation.id
                                     and p.performance_flag == UNDERPERFORMING), 2)
      available_amount = round(allocation.planned_amount - committed_amount, 2)
      unreserved_units = allocation.planned_incremental_units - committed_units
      # Conserved units identity, always true:
      #   planned_incremental_units == committed_units + unreserved_units
    input_set: "Promotions with lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED} for the commitment figures — DRAFT, SUBMITTED, CHANGES_REQUESTED and WITHDRAWN promotions reserve nothing. Each promotion has at most one PostEventAnalysis, so latest_analysis(p) is unambiguous."
    precision: "2 decimal places, round_half_up; units are integers"

  - name: customer_deduction_rollup
    trigger: "on deduction create, match, validate, settle, dispute open, dispute recovery and dispute write-off"
    algorithm: aggregation
    formula: |
      open_deduction_amount = round(SUM(d.claimed_amount for d in Deduction
                                        where d.customer_id == customer.id
                                          and d.status IN {RECEIVED, MATCHED, VALIDATED, DISPUTED}), 2)
      write_off_ytd_amount  = round(SUM(p.write_off_amount for p in Dispute
                                        where p.status == WRITTEN_OFF
                                          and Deduction[p.deduction_id].customer_id == customer.id), 2)
    input_set: "Deductions in the four non-terminal statuses for the open figure; WRITTEN_OFF disputes for the write-off figure. SETTLED and RECOVERED deductions leave the open figure."
    precision: "2 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — evaluated in ascending priority order.
# The FIRST rule that fails determines the response; later rules are not
# evaluated. Priorities are sparse so the ordering is unambiguous when a single
# request violates several rules.
# =============================================================================
validations:
  # ---- 1-9: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header whose value is the empty string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role == CustomerPortalUser, X-User-ID equals the Customer.id that owns the addressed resource (the promotion's, deduction's, dispute's or allocation's customer_id, or the customer_id query filter). Cross-customer reads and writes are refused before existence is checked, so a portal user cannot probe other customers' ids."
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles list includes CustomerPortalUser"

  # ---- 10: request shape ---------------------------------------------------
  - priority: 10
    category: business_constraint
    check: "Request body/query is well formed: every required input field is present and non-null; enum fields carry a declared value; monetary fields are numbers with at most 2 decimal places and >= 0.00; rate_per_case has at most 3 decimal places; unit counts are integers >= 0; timestamps are RFC3339 UTC instants ending in Z; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 20-29: existence, path first (left to right), then body FKs ---------
  - priority: 20
    category: existence
    check: "Every id in the URL path resolves, validated left to right: programId, brandId, customerId, allocationId, promotionId, tacticId, documentId, factId, accrualId, deductionId, disputeId, auditId"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_BRAND_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_TACTIC_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_VOLUME_FACT_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND | ERR_DEDUCTION_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 21
    category: existence
    check: "Every foreign key in the request body resolves, validated in the order the field appears in the endpoint's input list: program_id, brand_id, customer_id, allocation_id, promotion_id, deduction_id, reverses_entry_id, supersedes_deduction_id"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_BRAND_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_DEDUCTION_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK fields in input"

  # ---- 30: optimistic concurrency (§1.2.1) --------------------------------
  - priority: 30
    category: state
    check: "expected_allocation_version equals BudgetAllocation.version of the referenced allocation"
    error_id: ERR_STALE_ALLOCATION_VERSION
    http_status: 412
    applies_to: "POST /trade-marketing/promotions"

  - priority: 31
    category: state
    check: "expected_promotion_version equals Promotion.version of the matched promotion"
    error_id: ERR_STALE_PROMOTION_VERSION
    http_status: 412
    applies_to: "POST /trade-marketing/deductions/{deductionId}/validate, PATCH /trade-marketing/tactics/{tacticId}"


  # ---- 40-49: state preconditions -----------------------------------------
  - priority: 40
    category: state
    check: "TradeProgram.status is OPEN. Scoped to program-level writes only: POST /trade-marketing/brands, POST /trade-marketing/budget-allocations, POST /trade-marketing/budget-allocations/{allocationId}/approve. Promotion-level writes are gated by allocation posture at priority 42 instead, so no single request can violate both this rule and rule 42."
    error_id: ERR_PROGRAM_LOCKED
    http_status: 409
    applies_to: "POST /trade-marketing/brands, POST /trade-marketing/budget-allocations, POST /trade-marketing/budget-allocations/{allocationId}/approve"

  - priority: 41
    category: state
    check: "BudgetAllocation.status is APPROVED when a promotion is created under it or submitted"
    error_id: ERR_ALLOCATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /trade-marketing/promotions, POST /trade-marketing/promotions/{promotionId}/submit"

  - priority: 42
    category: state
    check: "BudgetAllocation.posture is OPEN. A RESTRICTED posture (a sibling promotion under the same allocation went OVERSPENT) or a FROZEN posture (owning program LOCKED) blocks promotion creation and promotion approval under that allocation. Accrual posting, deduction handling and analysis are NOT gated by posture — the ledger must keep recording money that has already been spent."
    error_id: ERR_ALLOCATION_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /trade-marketing/promotions, POST /trade-marketing/promotions/{promotionId}/approve"

  - priority: 43
    category: state
    check: "Promotion.lifecycle_status permits the requested transition per §1.2: tactics may be created, patched or cancelled only in DRAFT; submit only from DRAFT; request-changes and approve only from SUBMITTED; revise only from CHANGES_REQUESTED; withdraw only from APPROVED; documents may be attached in any lifecycle_status except WITHDRAWN, because retailer evidence normally arrives after the event has run; accruals may be posted only from LIVE, ENDED or ANALYZED; analyze only from ENDED or ANALYZED — a second analyze on an ANALYZED promotion satisfies THIS rule and is refused at priority 65 by the one-analysis-per-promotion rule instead"
    error_id: ERR_PROMOTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/submit, /request-changes, /revise, /approve, /withdraw, /tactics, /documents, /accruals, /analyze and PATCH /trade-marketing/tactics/{tacticId}, POST /trade-marketing/tactics/{tacticId}/cancel"

  - priority: 44
    category: state
    check: "PromotionTactic.status is PLANNED when the tactic is patched or cancelled (an ACTIVE, COMPLETED or CANCELLED tactic is frozen). Reachable because a line may be cancelled off a DRAFT promotion: the promotion stays DRAFT (so priority 43 passes) while the line is no longer PLANNED."
    error_id: ERR_TACTIC_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /trade-marketing/tactics/{tacticId}, POST /trade-marketing/tactics/{tacticId}/cancel"

  - priority: 45
    category: state
    check: "RetailerDocument.status is SUBMITTED when verified; VERIFIED is terminal, so verifying twice is refused"
    error_id: ERR_DOCUMENT_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /trade-marketing/documents/{documentId}/verify"

  - priority: 46
    category: state
    check: "The reversed AccrualEntry has entry_type == ACCRUAL and status == POSTED; a REVERSAL entry cannot itself be reversed and an already-REVERSED entry cannot be reversed twice"
    error_id: ERR_ACCRUAL_ENTRY_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /trade-marketing/accruals/{accrualId}/reverse"

  - priority: 47
    category: state
    check: "Deduction.status permits the requested transition: match only from RECEIVED; validate only from MATCHED; settle only from VALIDATED; dispute only from RECEIVED, MATCHED or VALIDATED"
    error_id: ERR_DEDUCTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /trade-marketing/deductions/{deductionId}/match, /validate, /settle, /dispute"

  - priority: 48
    category: state
    check: "Dispute.status permits the requested transition: send-to-retailer only from OPEN; retailer-respond only from AWAITING_RETAILER; record-recovery only from OPEN or ESCALATED; write-off only from OPEN or ESCALATED. RECOVERED and WRITTEN_OFF are terminal."
    error_id: ERR_DISPUTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /trade-marketing/disputes/{disputeId}/send-to-retailer, /retailer-respond, /record-recovery, /write-off"

  - priority: 49
    category: state
    check: "ComplianceAudit.status permits the requested transition: record-finding only from SCHEDULED or IN_PROGRESS; issue-findings only from IN_PROGRESS. FINDINGS_ISSUED is terminal."
    error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /trade-marketing/compliance-audits/{auditId}/record-finding, POST /trade-marketing/compliance-audits/{auditId}/issue-findings"

  # ---- 50-59: compliance / segregation of duties (safety class) ------------
  - priority: 50
    category: business_safety
    check: "Segregation of duties on the opaque X-User-ID: the user recorded in Promotion.approved_by_user_id may not validate a deduction matched to that promotion, and the user recorded in Dispute.opened_by_user_id may not approve that dispute's write-off"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trade-marketing/deductions/{deductionId}/validate, POST /trade-marketing/disputes/{disputeId}/write-off"

  - priority: 51
    category: business_safety
    check: "A write-off whose write_off_amount is >= WRITE_OFF_SELF_APPROVAL_LIMIT (500.00) requires X-User-Role == TradeMarketingDirector; a DeductionSpecialist may only approve write-offs strictly below the limit. A write_off_amount of exactly 500.00 already requires the director."
    error_id: ERR_WRITE_OFF_APPROVAL_REQUIRED
    http_status: 403
    applies_to: "POST /trade-marketing/disputes/{disputeId}/write-off"

  - priority: 52
    category: business_safety
    check: "RetailerDocument verification is class-restricted: a COMMITMENT document may be verified only by KeyAccountManager, an EVIDENCE document only by TradeFinanceAnalyst. Both roles are on the endpoint, so this is a payload-dependent authorization check, not a plain role check."
    error_id: ERR_DOCUMENT_CLASS_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /trade-marketing/documents/{documentId}/verify"

  - priority: 53
    category: business_safety
    check: "Customer.trading_status is ACTIVE. CREDIT_HOLD and SUSPENDED both block promotion creation, promotion approval and deduction settlement for that customer; SUSPENDED additionally blocks budget-allocation creation."
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /trade-marketing/promotions, POST /trade-marketing/promotions/{promotionId}/approve, POST /trade-marketing/deductions/{deductionId}/settle, POST /trade-marketing/budget-allocations"

  # ---- 60-69: referential coherence between related entities --------------
  - priority: 60
    category: business_referential
    check: "The brand referenced by a budget allocation belongs to the same TradeProgram as the allocation's program_id, and so does the customer"
    error_id: ERR_BRAND_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /trade-marketing/budget-allocations"

  - priority: 61
    category: business_referential
    check: "The promotion a deduction is matched to belongs to the deduction's own customer_id"
    error_id: ERR_DEDUCTION_CUSTOMER_MISMATCH
    http_status: 422
    applies_to: "POST /trade-marketing/deductions/{deductionId}/match"

  - priority: 62
    category: business_referential
    check: "The promotion a deduction is matched to has lifecycle_status IN {APPROVED, LIVE, ENDED, ANALYZED}; a DRAFT, SUBMITTED, CHANGES_REQUESTED or WITHDRAWN promotion is not a matchable agreement"
    error_id: ERR_PROMOTION_NOT_MATCHABLE
    http_status: 409
    applies_to: "POST /trade-marketing/deductions/{deductionId}/match"

  - priority: 63
    category: business_referential
    check: "claim_reference is unique per customer_id across all Deduction rows"
    error_id: ERR_DUPLICATE_CLAIM_REFERENCE
    http_status: 409
    applies_to: "POST /trade-marketing/deductions"

  - priority: 64
    category: business_referential
    check: "The tuple (customer_id, brand_id, fact_type, period_start) is unique across all VolumeFact rows"
    error_id: ERR_VOLUME_FACT_DUPLICATE
    http_status: 409
    applies_to: "POST /trade-marketing/volume-facts"

  - priority: 65
    category: business_referential
    check: "A promotion has at most one PostEventAnalysis row"
    error_id: ERR_ANALYSIS_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/analyze"

  - priority: 66
    category: business_referential
    check: "At most one ACCRUAL entry exists per (promotion_id, period_start); a second post for the same week is refused even after the first was reversed"
    error_id: ERR_ACCRUAL_PERIOD_DUPLICATE
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/accruals"

  - priority: 67
    category: business_referential
    check: "Customer.audit_status is CLEAR when a compliance audit is opened; a customer with an audit already in progress or with issued findings still open cannot be re-audited"
    error_id: ERR_AUDIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /trade-marketing/customers/{customerId}/compliance-audits"

  # ---- 70-79: temporal rules ---------------------------------------------
  - priority: 70
    category: business_temporal
    check: "Every promotion window and tactic window is week-aligned: window_start is a Monday at 00:00:00Z, window_end is a Monday at 00:00:00Z, and window_end is strictly after window_start. Windows are half-open [window_start, window_end)."
    error_id: ERR_WINDOW_NOT_WEEK_ALIGNED
    http_status: 422
    applies_to: "POST /trade-marketing/promotions, POST /trade-marketing/promotions/{promotionId}/tactics, PATCH /trade-marketing/tactics/{tacticId}, POST /trade-marketing/volume-facts (period_start), POST /trade-marketing/promotions/{promotionId}/accruals (period_start)"

  - priority: 71
    category: business_temporal
    check: "A tactic window is contained in its promotion's window: promotion.window_start <= tactic.window_start and tactic.window_end <= promotion.window_end"
    error_id: ERR_TACTIC_WINDOW_OUTSIDE_PROMOTION
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/tactics, PATCH /trade-marketing/tactics/{tacticId}"

  - priority: 72
    category: business_temporal
    check: "An accrual period, after the accrual_method's lead-day shift, falls inside the promotion window: promotion.window_start <= effective_period_start < promotion.window_end, where effective_period_start is period_start + 14 days on the SHIPMENT basis and period_start itself on the CONSUMPTION basis"
    error_id: ERR_ACCRUAL_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/accruals"

  - priority: 73
    category: business_temporal
    check: "DISPLAY exclusivity: no other DISPLAY tactic with status IN {PLANNED, ACTIVE, COMPLETED} on the same customer_id AND brand_id has a window overlapping the requested window. Windows are half-open, so a tactic ending 2026-08-17T00:00:00Z and one starting 2026-08-17T00:00:00Z do not overlap and are both allowed."
    error_id: ERR_DISPLAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/tactics, PATCH /trade-marketing/tactics/{tacticId}"

  - priority: 74
    category: business_temporal
    check: "FEATURE cooldown: no other FEATURE tactic with status IN {PLANNED, ACTIVE, COMPLETED} on the same brand_id — across ALL customers, unlike the DISPLAY rule — lies within FEATURE_COOLDOWN_DAYS (7) of the requested window. The requested window must satisfy requested.window_start >= other.window_end + 7 days OR requested.window_end + 7 days <= other.window_start. A gap of exactly 7 days passes; a gap of 6 days is refused; bare adjacency (gap 0) is refused."
    error_id: ERR_FEATURE_COOLDOWN_CONFLICT
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/tactics, PATCH /trade-marketing/tactics/{tacticId}"

  - priority: 75
    category: business_temporal
    check: "Rate maintenance is forward-only: a PATCH that changes rate_per_case or fixed_fee is accepted only when the tactic's window_start is strictly after the current logical clock instant, so a rate cannot be revised for a week that has already begun"
    error_id: ERR_RATE_CHANGE_NOT_FUTURE
    http_status: 422
    applies_to: "PATCH /trade-marketing/tactics/{tacticId}"

  # ---- 80-89: constraint satisfaction ------------------------------------
  - priority: 80
    category: business_constraint
    check: "TPR concurrency cap: on any single day, at most TPR_CONCURRENCY_CAP (2) TPR tactics with status IN {PLANNED, ACTIVE, COMPLETED} may cover the same customer_id and brand_id. Each candidate tactic is individually legal; only the collective count fails, and the count is taken across promotions."
    error_id: ERR_TPR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/tactics, PATCH /trade-marketing/tactics/{tacticId}"

  - priority: 81
    category: business_constraint
    check: "A TPR tactic carries rate_per_case and no fixed_fee; a DISPLAY or FEATURE tactic carries fixed_fee and no rate_per_case"
    error_id: ERR_TACTIC_TYPE_RATE_MISMATCH
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/tactics, PATCH /trade-marketing/tactics/{tacticId}"

  - priority: 82
    category: business_constraint
    check: "Promotion.revision_round is < MAX_REVISION_ROUNDS (2) when the promotion is revised; a third trip around the revision cycle is refused"
    error_id: ERR_MAX_REVISION_ROUNDS
    http_status: 409
    applies_to: "POST /trade-marketing/promotions/{promotionId}/revise"

  - priority: 83
    category: business_constraint
    check: "Dispute.round_count is < MAX_DISPUTE_ROUNDS (2) when the dispute is sent to the retailer; a third send on the same dispute is refused"
    error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /trade-marketing/disputes/{disputeId}/send-to-retailer"

  - priority: 84
    category: business_constraint
    check: "A promotion has at least one PromotionTactic with status == PLANNED when submitted"
    error_id: ERR_PROMOTION_HAS_NO_TACTICS
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/submit"

  - priority: 85
    category: business_constraint
    check: "Promotion.commitment_verified is true when the promotion is approved: every DISPLAY or FEATURE tactic type present on the promotion is covered by a VERIFIED COMMITMENT RetailerDocument whose covers_tactic_type is that type or ALL. A TPR-only promotion needs no commitment document and passes this rule vacuously."
    error_id: ERR_COMMITMENT_DOCUMENTATION_MISSING
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/approve"

  - priority: 86
    category: business_constraint
    check: "Under Customer.deduction_validation_policy == EVIDENCE_BASED, the matched promotion has at least one VERIFIED EVIDENCE RetailerDocument with units_verified > 0. Under AGREEMENT_CAP this rule does not apply at all — the same request body succeeds or fails depending on the customer's policy flag."
    error_id: ERR_NO_PERFORMANCE_EVIDENCE
    http_status: 422
    applies_to: "POST /trade-marketing/deductions/{deductionId}/validate"

  - priority: 87
    category: business_constraint
    check: "disputed_amount is > 0.00 and does not exceed the disputable base: the deduction's claimed_amount when the deduction is RECEIVED or MATCHED, and the deduction's variance_amount when it is already VALIDATED"
    error_id: ERR_DISPUTED_AMOUNT_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /trade-marketing/deductions/{deductionId}/dispute"

  - priority: 88
    category: business_constraint
    check: "write_off_amount is > 0.00 and <= Dispute.disputed_amount"
    error_id: ERR_WRITE_OFF_EXCEEDS_OPEN_AMOUNT
    http_status: 422
    applies_to: "POST /trade-marketing/disputes/{disputeId}/write-off"

  - priority: 89
    category: business_constraint
    check: "recovered_amount is > 0.00 and <= Dispute.disputed_amount"
    error_id: ERR_RECOVERY_EXCEEDS_OPEN_AMOUNT
    http_status: 422
    applies_to: "POST /trade-marketing/disputes/{disputeId}/record-recovery"

  - priority: 90
    category: business_constraint
    check: "A reversal amount is > 0.00 and equals the reversed ACCRUAL entry's amount (partial reversals are not supported; the compensating entry mirrors the original exactly)"
    error_id: ERR_REVERSAL_EXCEEDS_ENTRY_AMOUNT
    http_status: 422
    applies_to: "POST /trade-marketing/accruals/{accrualId}/reverse"

  # ---- 95-99: fiscal capacity, evaluated last ----------------------------
  - priority: 95
    category: business_fiscal
    check: "Promotion.planned_total_spend <= BudgetAllocation.available_amount at approval time (available_amount still excludes this promotion, which is not yet committed)"
    error_id: ERR_ALLOCATION_BALANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/approve"

  - priority: 96
    category: business_fiscal
    check: "Promotion.committed_units <= BudgetAllocation.unreserved_units at approval time"
    error_id: ERR_UNITS_EXCEED_UNRESERVED
    http_status: 422
    applies_to: "POST /trade-marketing/promotions/{promotionId}/approve"

  - priority: 97
    category: business_fiscal
    check: "TradeProgram.allocated_amount + the new allocation's planned_amount <= TradeProgram.total_budget_amount"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /trade-marketing/budget-allocations"

  - priority: 98
    category: business_fiscal
    check: "Under Customer.deduction_validation_policy == AGREEMENT_CAP, Promotion.accrued_balance is > 0.00 at validation time; there is nothing left on the agreement to allow"
    error_id: ERR_ACCRUAL_BALANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /trade-marketing/deductions/{deductionId}/validate"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# Every business path is flat under /trade-marketing plus one test-driving
# endpoint under /_clock. All list endpoints accept limit? and offset? and
# return the paginated envelope of §1.0.
# =============================================================================
endpoints:
  # ---- test-driving: logical clock ---------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. The server starts at the fixed default 2026-08-01T00:00:00Z and NEVER falls back to wall-clock time, so every window, cooldown, aging and rate-maintenance rule is deterministic. All week-aligned fixtures in this scaffold sit at or after that default."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "all subsequent reads of the logical clock return current_utc"
      - "recomputes no entity: aging_days and window comparisons are evaluated on read or on the next run endpoint"

  # ---- trade programs -----------------------------------------------------
  - method: POST
    path: "/trade-marketing/programs"
    description: "Opens an annual trade program with a total budget envelope and a default accrual method."
    roles: [TradeMarketingDirector]
    code: 201
    input: [fiscal_year, name, total_budget_amount, "accrual_method_default?"]
    output: TradeProgram
    side_effects:
      - "status defaults to OPEN"
      - "allocated_amount initialises to 0.00 and unallocated_amount to total_budget_amount"

  - method: GET
    path: "/trade-marketing/programs/{programId}"
    description: "Reads one trade program with its live budget rollup."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: TradeProgram
    side_effects: []

  - method: GET
    path: "/trade-marketing/programs"
    description: "Lists trade programs, newest first by created_at DESC."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: TradeProgram[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/programs/{programId}/lock"
    description: "Year-end lock. Freezes every BudgetAllocation under the program."
    roles: [TradeMarketingDirector]
    code: 200
    input: []
    output: TradeProgram
    side_effects:
      - "TradeProgram.status OPEN -> LOCKED (terminal)"
      - "every child BudgetAllocation recomputes calculations.allocation_posture to FROZEN and increments its version by 1"
      - "increments TradeProgram.version by 1"

  # ---- brands -------------------------------------------------------------
  - method: POST
    path: "/trade-marketing/brands"
    description: "Registers a brand under a trade program with its price, cost and seasonal baseline."
    roles: [TradeMarketingDirector]
    code: 201
    input: [program_id, name, list_price_per_case, cogs_per_case, baseline_units_per_week]
    output: Brand
    side_effects:
      - "computes unit_margin = round(list_price_per_case - cogs_per_case, 2)"

  - method: GET
    path: "/trade-marketing/brands/{brandId}"
    description: "Reads one brand."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: GET
    path: "/trade-marketing/brands"
    description: "Lists brands, optionally filtered by owning program (reverse lookup for Brand.program_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: Brand[]
    side_effects: []

  # ---- customers ----------------------------------------------------------
  - method: POST
    path: "/trade-marketing/customers"
    description: "Registers a retail customer with its deduction validation policy. The policy flag selects which deduction_valuation variant every later claim against this customer uses."
    roles: [TradeMarketingDirector]
    code: 201
    input: [program_id, name, channel, "deduction_validation_policy?"]
    output: Customer
    side_effects:
      - "trading_status defaults to ACTIVE, audit_status to CLEAR, compliance_penalty_points to 0"
      - "deduction_validation_policy defaults to EVIDENCE_BASED when omitted"

  - method: GET
    path: "/trade-marketing/customers/{customerId}"
    description: "Reads one customer with its penalty score and deduction rollup."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/trade-marketing/customers"
    description: "Lists customers, optionally filtered by owning program (reverse lookup for Customer.program_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["program_id?", "channel?", "trading_status?", "audit_status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/customers/{customerId}/credit-hold"
    description: "Places an ACTIVE customer on manual credit hold, blocking new promotions and deduction settlement."
    roles: [DeductionSpecialist, TradeMarketingDirector]
    code: 200
    input: [reason]
    output: Customer
    side_effects:
      - "Customer.trading_status ACTIVE -> CREDIT_HOLD and credit_hold_reason is stored"
      - "audit_status is untouched (independent state axis)"
      - "increments Customer.version by 1"

  # ---- budget allocations -------------------------------------------------
  - method: POST
    path: "/trade-marketing/budget-allocations"
    description: "Allocates part of the program envelope to one customer / brand / event, with baseline and incremental volume assumptions."
    roles: [TradeMarketingDirector, TradeFinanceAnalyst]
    code: 201
    input: [program_id, customer_id, brand_id, event_type, planned_amount, baseline_units, planned_incremental_units]
    output: BudgetAllocation
    side_effects:
      - "status defaults to DRAFT, posture to OPEN, overspend_event_count to 0"
      - "recomputes calculations.program_budget_rollup on the parent TradeProgram (allocated_amount, unallocated_amount) and increments TradeProgram.version by 1"
      - "initialises calculations.allocation_ledger_rollup: committed_amount 0.00, available_amount == planned_amount, committed_units 0, unreserved_units == planned_incremental_units"

  - method: GET
    path: "/trade-marketing/budget-allocations/{allocationId}"
    description: "Reads one budget allocation with its live ledger rollup and posture."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: BudgetAllocation
    side_effects: []

  - method: GET
    path: "/trade-marketing/budget-allocations"
    description: "Lists budget allocations (reverse lookup for BudgetAllocation.program_id, customer_id and brand_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["program_id?", "customer_id?", "brand_id?", "event_type?", "status?", "posture?", "limit?", "offset?"]
    output: BudgetAllocation[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/budget-allocations/{allocationId}/approve"
    description: "Approves a DRAFT allocation, opening it for promotion planning."
    roles: [TradeMarketingDirector]
    code: 200
    input: []
    output: BudgetAllocation
    side_effects:
      - "BudgetAllocation.status DRAFT -> APPROVED"
      - "recomputes calculations.allocation_ledger_rollup"
      - "increments BudgetAllocation.version by 1"

  # ---- promotions ---------------------------------------------------------
  - method: POST
    path: "/trade-marketing/promotions"
    description: "Plans a promotion under an APPROVED allocation. customer_id and brand_id are copied from the allocation and cannot be supplied. Requires expected_allocation_version (OCC on the parent allocation, §1.2.1)."
    roles: [KeyAccountManager]
    code: 201
    input: [allocation_id, name, window_start, window_end, "accrual_method?", expected_allocation_version]
    output: Promotion
    side_effects:
      - "lifecycle_status defaults to DRAFT, spend_status to WITHIN_BUDGET, performance_flag to UNRATED, revision_round to 0"
      - "customer_id and brand_id are copied from the allocation; accrual_method defaults to TradeProgram.accrual_method_default when omitted"
      - "increments BudgetAllocation.version by 1 (the parent version advances on every child create, which is what makes a second stale-version create fail)"

  - method: GET
    path: "/trade-marketing/promotions/{promotionId}"
    description: "Reads one promotion with its planning figures, accrual ledger, live spend status and performance flag."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: GET
    path: "/trade-marketing/promotions"
    description: "Lists promotions (reverse lookup for Promotion.allocation_id, customer_id and brand_id). Supports the live over-spend monitoring view via spend_status."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: ["allocation_id?", "customer_id?", "brand_id?", "lifecycle_status?", "spend_status?", "performance_flag?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/tactics"
    description: "Adds a TPR, DISPLAY or FEATURE tactic line to a DRAFT promotion."
    roles: [KeyAccountManager]
    code: 201
    input: [tactic_type, planned_units, window_start, window_end, "rate_per_case?", "fixed_fee?"]
    output: PromotionTactic
    side_effects:
      - "status defaults to PLANNED; week_count = (window_end - window_start) / 7 days"
      - "computes calculations.tactic_line_planned_spend for the new line"
      - "recomputes calculations.promotion_planned_total_spend on the promotion (tactic_subtotal_amount, allowance_rate, off_invoice_allowance_amount, planned_total_spend, committed_units)"
      - "recomputes calculations.commitment_coverage (adding a DISPLAY or FEATURE line can flip Promotion.commitment_verified true -> false)"
      - "increments Promotion.version by 1"

  - method: GET
    path: "/trade-marketing/promotions/{promotionId}/tactics"
    description: "Lists the tactic lines of a promotion, ordered by created_at ASC (reverse lookup for PromotionTactic.promotion_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["tactic_type?", "status?", "limit?", "offset?"]
    output: PromotionTactic[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/tactics"
    description: "Lists tactic lines across promotions, ordered by created_at ASC. Filterable by promotion_id (flat reverse lookup for PromotionTactic.promotion_id) and by tactic_type or status, which is how the DISPLAY-exclusivity and TPR-concurrency input sets are inspected."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["promotion_id?", "tactic_type?", "status?", "limit?", "offset?"]
    output: PromotionTactic[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/tactics/{tacticId}"
    description: "Reads one tactic line."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: PromotionTactic
    side_effects: []

  - method: PATCH
    path: "/trade-marketing/tactics/{tacticId}"
    description: "Rate maintenance on a PLANNED tactic of a DRAFT promotion. Rate and fee changes are forward-only. Requires expected_promotion_version (OCC on the parent promotion)."
    roles: [KeyAccountManager]
    code: 200
    input: [expected_promotion_version, "rate_per_case?", "fixed_fee?", "planned_units?", "window_start?", "window_end?"]
    output: PromotionTactic
    side_effects:
      - "recomputes calculations.tactic_line_planned_spend for this line and calculations.promotion_planned_total_spend on the promotion, which can move allowance_rate across a tier boundary in either direction"
      - "sets effective_from_period to the tactic's window_start when a rate or fee changed"
      - "increments PromotionTactic.version by 1 and Promotion.version by 1"

  - method: POST
    path: "/trade-marketing/tactics/{tacticId}/cancel"
    description: "Removes a PLANNED tactic line from a DRAFT promotion before submission. The row is preserved in CANCELLED so the planning history stays auditable; it stops contributing to the promotion's money and unit rollups."
    roles: [KeyAccountManager]
    code: 200
    input: ["cancel_reason?"]
    output: PromotionTactic
    side_effects:
      - "PromotionTactic.status PLANNED -> CANCELLED (terminal)"
      - "recomputes calculations.promotion_planned_total_spend on the promotion, so tactic_subtotal_amount drops this line and allowance_rate can fall back across a tier boundary"
      - "recomputes calculations.commitment_coverage, so cancelling the only DISPLAY line can flip Promotion.commitment_verified false -> true"
      - "the cancelled line is released from the DISPLAY-exclusivity, FEATURE-cooldown and TPR-concurrency input sets, because all three read status IN {PLANNED, ACTIVE, COMPLETED}"
      - "increments PromotionTactic.version by 1 and Promotion.version by 1"

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/submit"
    description: "Submits a DRAFT promotion for director review."
    roles: [KeyAccountManager]
    code: 200
    input: []
    output: Promotion
    side_effects:
      - "lifecycle_status DRAFT -> SUBMITTED"
      - "recomputes calculations.promotion_planned_total_spend"
      - "increments Promotion.version by 1"

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/request-changes"
    description: "Fork branch 1 from SUBMITTED: sends the plan back for rework without committing any budget."
    roles: [TradeMarketingDirector]
    code: 200
    input: [change_notes]
    output: Promotion
    side_effects:
      - "lifecycle_status SUBMITTED -> CHANGES_REQUESTED"
      - "no BudgetAllocation field changes (contrast with approve)"
      - "increments Promotion.version by 1"

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/revise"
    description: "Reopens a CHANGES_REQUESTED promotion for editing, closing the revision cycle. Capped at MAX_REVISION_ROUNDS."
    roles: [KeyAccountManager]
    code: 200
    input: []
    output: Promotion
    side_effects:
      - "lifecycle_status CHANGES_REQUESTED -> DRAFT and revision_round += 1"
      - "tactic editing is unlocked again"
      - "increments Promotion.version by 1"

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/approve"
    description: "Fork branch 2 from SUBMITTED: commits allocation dollars and incremental units to the promotion."
    roles: [TradeMarketingDirector]
    code: 200
    input: []
    output: Promotion
    side_effects:
      - "lifecycle_status SUBMITTED -> APPROVED and approved_by_user_id = caller X-User-ID (the segregation-of-duties anchor for later deduction validation)"
      - "BudgetAllocation.committed_amount += planned_total_spend, committed_units += promotion.committed_units, available_amount and unreserved_units recomputed"
      - "increments Promotion.version by 1 and BudgetAllocation.version by 1"

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/withdraw"
    description: "Compensating action for approve: cancels an APPROVED promotion that has not yet accrued and releases every reserved dollar and unit."
    roles: [KeyAccountManager]
    code: 200
    input: ["withdraw_reason?"]
    output: Promotion
    side_effects:
      - "lifecycle_status APPROVED -> WITHDRAWN (terminal)"
      - "every PromotionTactic with status IN {PLANNED, ACTIVE} becomes CANCELLED; COMPLETED tactics are untouched"
      - "planned_total_spend and committed_units recompute to 0.00 and 0"
      - "BudgetAllocation.available_amount and unreserved_units return to exactly their pre-approval values"
      - "increments Promotion.version by 1, each cancelled PromotionTactic.version by 1 and BudgetAllocation.version by 1"

  - method: POST
    path: "/trade-marketing/promotion-activation-runs"
    description: "Ops-run checkpoint over the logical clock: activates APPROVED promotions whose window has started, ends LIVE promotions whose window has closed, and moves their tactic lines. Activation is evaluated before ending inside one run."
    roles: [TradeFinanceAnalyst, TradeMarketingDirector]
    code: 200
    input: []
    output: "{ run_at: string, promotions_activated: string[], promotions_ended: string[], tactics_activated: string[], tactics_completed: string[] }"
    side_effects:
      - "APPROVED -> LIVE for every promotion with window_start <= clock, then LIVE -> ENDED for every promotion with window_end <= clock"
      - "PromotionTactic PLANNED -> ACTIVE for lines whose window contains the clock date, ACTIVE -> COMPLETED and PLANNED -> COMPLETED for lines whose window_end <= clock"
      - "increments the version of every promotion and tactic it touches; promotions are processed in created_at ASC order"

  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/analyze"
    description: "Post-event analysis of an ENDED promotion: lift, cannibalization, ROI. The baseline_method is pinned at creation and every later recompute reuses it."
    roles: [TradeFinanceAnalyst]
    code: 201
    input: [baseline_method]
    output: PostEventAnalysis
    side_effects:
      - "creates the single PostEventAnalysis row and runs calculations.post_event_analysis"
      - "Promotion.lifecycle_status ENDED -> ANALYZED and performance_flag set from roi (UNDERPERFORMING below ROI_FLOOR, ON_TRACK at or above, UNRATED when roi is null)"
      - "when performance_flag is UNDERPERFORMING, BudgetAllocation.at_risk_amount picks up this analysis's net_spend"
      - "increments Promotion.version by 1 and BudgetAllocation.version by 1"

  - method: GET
    path: "/trade-marketing/promotions/{promotionId}/post-event-analyses"
    description: "Lists the post-event analyses of a promotion — zero or one row (reverse lookup for PostEventAnalysis.promotion_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: PostEventAnalysis[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/post-event-analyses"
    description: "Lists post-event analyses across promotions, newest first by created_at DESC. Filterable by promotion_id (flat reverse lookup for PostEventAnalysis.promotion_id), baseline_method and data_status."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["promotion_id?", "baseline_method?", "data_status?", "limit?", "offset?"]
    output: PostEventAnalysis[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/post-event-analyses/{analysisId}"
    description: "Reads one post-event analysis with its live lift, cannibalization and ROI figures, which are recomputed in place by every later deduction validation, dispute write-off and dispute recovery on the promotion."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: PostEventAnalysis
    side_effects: []

  # ---- retailer documents (commitment + performance evidence) --------------
  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/documents"
    description: "Attaches a retailer document to a promotion: a COMMITMENT (signed agreement, display contract) or EVIDENCE (scan data, photo, tearsheet) with the units it substantiates."
    roles: [KeyAccountManager, TradeFinanceAnalyst]
    code: 201
    input: [doc_class, doc_type, covers_tactic_type, received_at, "units_verified?"]
    output: RetailerDocument
    side_effects:
      - "status defaults to SUBMITTED; units_verified defaults to 0"
      - "a SUBMITTED document counts for nothing: commitment_coverage and deduction_valuation both ignore it until it is verified"

  - method: GET
    path: "/trade-marketing/promotions/{promotionId}/documents"
    description: "Lists the retailer documents of a promotion (reverse lookup for RetailerDocument.promotion_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["doc_class?", "status?", "limit?", "offset?"]
    output: RetailerDocument[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/documents"
    description: "Lists retailer documents across promotions, newest first by created_at DESC. Filterable by promotion_id (flat reverse lookup for RetailerDocument.promotion_id), doc_class and status, which is how the commitment-coverage and evidence-units input sets are inspected."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["promotion_id?", "doc_class?", "doc_type?", "status?", "limit?", "offset?"]
    output: RetailerDocument[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/documents/{documentId}"
    description: "Reads one retailer document."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: RetailerDocument
    side_effects: []

  - method: POST
    path: "/trade-marketing/documents/{documentId}/verify"
    description: "Verifies a SUBMITTED document. Class-restricted: COMMITMENT documents by KeyAccountManager, EVIDENCE documents by TradeFinanceAnalyst — both roles are on the endpoint, so the check depends on the document's doc_class."
    roles: [KeyAccountManager, TradeFinanceAnalyst]
    code: 200
    input: []
    output: RetailerDocument
    side_effects:
      - "RetailerDocument.status SUBMITTED -> VERIFIED (terminal) and verified_by_user_id = caller X-User-ID"
      - "for a COMMITMENT document, recomputes calculations.commitment_coverage on the promotion (Promotion.commitment_verified may flip false -> true)"
      - "for an EVIDENCE document, its units_verified now feeds calculations.deduction_valuation under the EVIDENCE_BASED variant"
      - "increments RetailerDocument.version by 1 and Promotion.version by 1"

  # ---- volume facts (append-only) -----------------------------------------
  - method: POST
    path: "/trade-marketing/volume-facts"
    description: "Records one week of shipment or consumption volume for a customer / brand pair. Append-only: no update, no delete, no version field."
    roles: [TradeFinanceAnalyst]
    code: 201
    input: [customer_id, brand_id, fact_type, period_start, units, source]
    output: VolumeFact
    side_effects:
      - "no recomputation on write: accruals read facts when a period is posted, and post-event analysis reads them when it runs"

  - method: GET
    path: "/trade-marketing/volume-facts/{factId}"
    description: "Reads one volume fact."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: VolumeFact
    side_effects: []

  - method: GET
    path: "/trade-marketing/volume-facts"
    description: "Lists volume facts ordered by period_start ASC (reverse lookup for VolumeFact.customer_id and brand_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["customer_id?", "brand_id?", "fact_type?", "period_start?", "limit?", "offset?"]
    output: VolumeFact[]
    side_effects: []

  # ---- accrual ledger -----------------------------------------------------
  - method: POST
    path: "/trade-marketing/promotions/{promotionId}/accruals"
    description: "Posts the accrual for one week of a LIVE, ENDED or ANALYZED promotion. The promotion's accrual_method decides which VolumeFact type is read and whether the period is shifted by the 14-day shipment lead."
    roles: [TradeFinanceAnalyst]
    code: 201
    input: [period_start]
    output: AccrualEntry
    side_effects:
      - "entry_type = ACCRUAL, status = POSTED, method copied from the promotion, amount and tactic_line_amounts from calculations.accrual_amount_for_period"
      - "recomputes calculations.promotion_accrual_ledger (gross_accrued_amount, accrued_balance)"
      - "recomputes calculations.promotion_spend_status, which may move spend_status WITHIN_BUDGET -> OVERSPEND_WARNING -> OVERSPENT"
      - "recomputes BudgetAllocation.accrued_amount"
      - "increments Promotion.version by 1 and BudgetAllocation.version by 1"

  - method: GET
    path: "/trade-marketing/accruals/{accrualId}"
    description: "Reads one accrual ledger entry with its per-tactic line breakdown."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: AccrualEntry
    side_effects: []

  - method: GET
    path: "/trade-marketing/accruals"
    description: "Lists accrual entries ordered by period_start ASC then created_at ASC (reverse lookup for AccrualEntry.promotion_id and for the self-referential reverses_entry_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor]
    code: 200
    input: ["promotion_id?", "reverses_entry_id?", "entry_type?", "status?", "limit?", "offset?"]
    output: AccrualEntry[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/accruals/{accrualId}/reverse"
    description: "Compensating entry for a posted accrual: creates a mirror REVERSAL entry of the same amount and returns the ledger to its pre-posting state. The original row is preserved for audit."
    roles: [TradeFinanceAnalyst]
    code: 201
    input: [amount, reversal_reason]
    output: AccrualEntry
    side_effects:
      - "the reversed entry's status POSTED -> REVERSED"
      - "creates a new AccrualEntry with entry_type = REVERSAL, status = POSTED, reverses_entry_id = the reversed entry id, fact_units = 0 and tactic_line_amounts = [] — this new entry is the response body"
      - "recomputes calculations.promotion_accrual_ledger: reversed_accrual_amount rises and accrued_balance returns to its pre-posting value exactly, while gross_accrued_amount is unchanged"
      - "recomputes calculations.promotion_spend_status, which may move spend_status downward (OVERSPENT -> OVERSPEND_WARNING -> WITHIN_BUDGET) without ever lowering BudgetAllocation.overspend_event_count"
      - "increments AccrualEntry.version by 1 on the reversed entry, Promotion.version by 1 and BudgetAllocation.version by 1"

  # ---- deduction intake and validation ------------------------------------
  - method: POST
    path: "/trade-marketing/deductions"
    description: "Intakes a retailer chargeback. supersedes_deduction_id links a corrected claim to the one it replaces (self-referential)."
    roles: [DeductionSpecialist]
    code: 201
    input: [customer_id, claim_reference, claimed_amount, deduction_date, "supersedes_deduction_id?"]
    output: Deduction
    side_effects:
      - "status defaults to RECEIVED; promotion_id, validation_basis, entitled_amount, validated_amount and variance_amount are all null"
      - "recomputes Customer.open_deduction_amount and increments Customer.version by 1"

  - method: GET
    path: "/trade-marketing/deductions/{deductionId}"
    description: "Reads one deduction with its valuation figures."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: []
    output: Deduction
    side_effects: []

  - method: GET
    path: "/trade-marketing/deductions"
    description: "Lists deductions (reverse lookup for Deduction.customer_id, promotion_id and the self-referential supersedes_deduction_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: ["customer_id?", "promotion_id?", "status?", "supersedes_deduction_id?", "limit?", "offset?"]
    output: Deduction[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/deductions/{deductionId}/match"
    description: "Matches a RECEIVED claim to a promotion agreement of the same customer."
    roles: [DeductionSpecialist]
    code: 200
    input: [promotion_id]
    output: Deduction
    side_effects:
      - "status RECEIVED -> MATCHED; promotion_id and matched_by_user_id are stored"
      - "increments Deduction.version by 1"

  - method: POST
    path: "/trade-marketing/deductions/{deductionId}/validate"
    description: "Values a MATCHED claim against the agreement. Which variant runs is decided by the customer's deduction_validation_policy, not by the request. Requires expected_promotion_version (OCC on the matched promotion, §1.2.1) and enforces segregation of duties against the promotion's approver."
    roles: [TradeFinanceAnalyst]
    code: 200
    input: [expected_promotion_version]
    output: Deduction
    side_effects:
      - "status MATCHED -> VALIDATED; writes validation_basis, entitled_amount, validated_amount, variance_amount from calculations.deduction_valuation and validated_by_user_id"
      - "hop 1: Promotion.consumed_deduction_amount rises by validated_amount and accrued_balance falls by the same amount"
      - "hop 2: calculations.promotion_spend_status recomputes and may reach OVERSPENT"
      - "hop 3: reaching OVERSPENT increments BudgetAllocation.overspend_event_count, driving posture OPEN -> RESTRICTED"
      - "hop 4: the RESTRICTED allocation adds RESTRICTED_ALLOCATION_POINTS to Customer.compliance_penalty_points, which can drive trading_status ACTIVE -> CREDIT_HOLD"
      - "recomputes the promotion's PostEventAnalysis when one exists"
      - "increments Deduction.version, Promotion.version, BudgetAllocation.version and Customer.version by 1 each on the hops that fire"

  - method: POST
    path: "/trade-marketing/deductions/{deductionId}/settle"
    description: "Settles a VALIDATED claim against the accrual balance. Blocked while the customer is on credit hold or suspended."
    roles: [TradeFinanceAnalyst]
    code: 200
    input: []
    output: Deduction
    side_effects:
      - "status VALIDATED -> SETTLED (terminal) and settled_at = logical clock instant"
      - "recomputes BudgetAllocation.settled_amount and Customer.open_deduction_amount"
      - "increments Deduction.version by 1, BudgetAllocation.version by 1 and Customer.version by 1"

  - method: POST
    path: "/trade-marketing/deductions/{deductionId}/dispute"
    description: "Opens a dispute over an invalid claim. From RECEIVED or MATCHED the whole claimed_amount is disputable; from VALIDATED only the variance_amount is."
    roles: [DeductionSpecialist]
    code: 201
    input: [reason_code, disputed_amount]
    output: Dispute
    side_effects:
      - "Deduction.status -> DISPUTED"
      - "creates one Dispute in status OPEN with opened_at = logical clock instant, opened_by_user_id = caller X-User-ID and round_count = 0"
      - "increments Deduction.version by 1"

  # ---- dispute, recovery and write-off ------------------------------------
  - method: GET
    path: "/trade-marketing/disputes/{disputeId}"
    description: "Reads one dispute with its live aging_days."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/trade-marketing/disputes"
    description: "Lists disputes ordered by opened_at ASC (reverse lookup for Dispute.deduction_id)."
    roles: [TradeMarketingDirector, KeyAccountManager, TradeFinanceAnalyst, DeductionSpecialist, ComplianceAuditor, CustomerPortalUser]
    code: 200
    input: ["deduction_id?", "status?", "reason_code?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/trade-marketing/disputes/{disputeId}/send-to-retailer"
    description: "Sends the dispute to the retailer for response. Capped at MAX_DISPUTE_ROUNDS round trips."
    roles: [DeductionSpecialist]
    code: 200
    input: ["packet_notes?"]
    output: Dispute
    side_effects:
      - "status OPEN -> AWAITING_RETAILER and round_count += 1"
      - "opened_at is NOT reset, so the aging clock keeps running through the negotiation cycle"
      - "increments Dispute.version by 1"

  - method: POST
    path: "/trade-marketing/disputes/{disputeId}/retailer-respond"
    description: "Retailer answer, posted by the customer portal user of the disputed deduction's own customer. Closes one negotiation loop."
    roles: [CustomerPortalUser]
    code: 200
    input: [retailer_response]
    output: Dispute
    side_effects:
      - "status AWAITING_RETAILER -> OPEN and retailer_response is stored"
      - "round_count is not reset"
      - "increments Dispute.version by 1"

  - method: POST
    path: "/trade-marketing/disputes/{disputeId}/record-recovery"
    description: "Records cash recovered from the retailer, closing the dispute and the deduction."
    roles: [DeductionSpecialist]
    code: 200
    input: [recovered_amount]
    output: Dispute
    side_effects:
      - "status OPEN or ESCALATED -> RECOVERED (terminal); recovered_amount and resolved_by_user_id are stored"
      - "parent Deduction.status DISPUTED -> RECOVERED and Customer.open_deduction_amount is recomputed"
      - "when a PostEventAnalysis exists for the deduction's promotion, its net_spend falls by recovered_amount and roi is recomputed, which can lift performance_flag UNDERPERFORMING -> ON_TRACK and lower BudgetAllocation.at_risk_amount"
      - "increments Dispute.version, Deduction.version, Customer.version and, when an analysis exists, Promotion.version and BudgetAllocation.version by 1 each"

  - method: POST
    path: "/trade-marketing/disputes/{disputeId}/write-off"
    description: "Abandons an uncollectible dispute. A write_off_amount at or above WRITE_OFF_SELF_APPROVAL_LIMIT (500.00) requires the TradeMarketingDirector, and the user who opened the dispute may never approve its write-off."
    roles: [DeductionSpecialist, TradeMarketingDirector]
    code: 200
    input: [write_off_amount, "write_off_reason?"]
    output: Dispute
    side_effects:
      - "status OPEN or ESCALATED -> WRITTEN_OFF (terminal); write_off_amount and resolved_by_user_id are stored"
      - "parent Deduction.status DISPUTED -> WRITTEN_OFF; Customer.open_deduction_amount and write_off_ytd_amount are recomputed"
      - "hop 1: Promotion.consumed_deduction_amount rises by write_off_amount, so recognized_spend_amount and spend_status recompute"
      - "hop 2: the promotion's PostEventAnalysis net_spend rises and roi falls"
      - "hop 3: performance_flag may flip ON_TRACK -> UNDERPERFORMING"
      - "hop 4: BudgetAllocation.at_risk_amount picks up the analysis's net_spend"
      - "increments Dispute.version, Deduction.version, Customer.version, Promotion.version and BudgetAllocation.version by 1 each"

  - method: POST
    path: "/trade-marketing/deduction-aging-runs"
    description: "Aging sweep over open disputes: escalates every dispute whose aging_days has reached AGING_ESCALATION_DAYS (90) and re-scores the affected customers. Candidates are processed in opened_at ASC order, then created_at ASC."
    roles: [TradeFinanceAnalyst, DeductionSpecialist]
    code: 200
    input: []
    output: "{ run_at: string, disputes_scanned: integer, disputes_escalated: string[], customers_penalized: string[] }"
    side_effects:
      - "Dispute status OPEN or AWAITING_RETAILER -> ESCALATED for every candidate at or past the threshold; ESCALATED, RECOVERED and WRITTEN_OFF disputes are skipped"
      - "each escalation adds ESCALATED_DISPUTE_POINTS to the deduction's Customer.compliance_penalty_points, which can drive trading_status ACTIVE -> CREDIT_HOLD or CREDIT_HOLD -> SUSPENDED"
      - "increments the version of every Dispute and Customer it touches"

  # ---- customer compliance audits ----------------------------------------
  - method: POST
    path: "/trade-marketing/customers/{customerId}/compliance-audits"
    description: "Opens a contract-compliance audit over a scope window at the customer. One open audit per customer."
    roles: [ComplianceAuditor]
    code: 201
    input: [scope_start, scope_end]
    output: ComplianceAudit
    side_effects:
      - "status defaults to SCHEDULED, findings_count to 0, recovery_claim_amount to 0.00, auditor_user_id = caller X-User-ID"
      - "Customer.audit_status CLEAR -> AUDIT_IN_PROGRESS while trading_status is untouched (independent axes)"
      - "increments Customer.version by 1"

  - method: GET
    path: "/trade-marketing/customers/{customerId}/compliance-audits"
    description: "Lists the compliance audits of a customer (reverse lookup for ComplianceAudit.customer_id)."
    roles: [TradeMarketingDirector, TradeFinanceAnalyst, ComplianceAuditor, DeductionSpecialist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/compliance-audits"
    description: "Lists compliance audits across customers, newest first by created_at DESC. Filterable by customer_id (flat reverse lookup for ComplianceAudit.customer_id) and status."
    roles: [TradeMarketingDirector, TradeFinanceAnalyst, ComplianceAuditor, DeductionSpecialist]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []

  - method: GET
    path: "/trade-marketing/compliance-audits/{auditId}"
    description: "Reads one compliance audit."
    roles: [TradeMarketingDirector, TradeFinanceAnalyst, ComplianceAuditor, DeductionSpecialist]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: []

  - method: POST
    path: "/trade-marketing/compliance-audits/{auditId}/record-finding"
    description: "Records one audit finding with its recovery claim. The first finding moves the audit into fieldwork; later findings accumulate."
    roles: [ComplianceAuditor]
    code: 200
    input: [finding_code, recovery_amount]
    output: ComplianceAudit
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS on the first finding, IN_PROGRESS -> IN_PROGRESS afterwards"
      - "findings_count += 1 and recovery_claim_amount += recovery_amount"
      - "increments ComplianceAudit.version by 1"

  - method: POST
    path: "/trade-marketing/compliance-audits/{auditId}/issue-findings"
    description: "Issues the audit findings to the customer, closing the audit and scoring the customer."
    roles: [ComplianceAuditor, TradeMarketingDirector]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects:
      - "status IN_PROGRESS -> FINDINGS_ISSUED (terminal) and issued_at = logical clock instant"
      - "Customer.audit_status AUDIT_IN_PROGRESS -> FINDINGS_OPEN"
      - "adds FINDINGS_ISSUED_POINTS to Customer.compliance_penalty_points, which can drive trading_status ACTIVE -> CREDIT_HOLD or CREDIT_HOLD -> SUSPENDED"
      - "increments ComplianceAudit.version by 1 and Customer.version by 1"

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# Every code below is triggerable by at least one endpoint in §1.5.
# =============================================================================
errors:
  # ---- authentication / authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing or empty on any request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six roles in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Caller's role is not in the target endpoint's roles list"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "CustomerPortalUser addresses a resource, or filters a list, belonging to a customer other than its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The promotion's approved_by_user_id validates a deduction matched to that promotion, or the dispute's opened_by_user_id approves that dispute's write-off"
  - id: ERR_WRITE_OFF_APPROVAL_REQUIRED
    http: 403
    condition: "write_off_amount >= WRITE_OFF_SELF_APPROVAL_LIMIT (500.00) and the caller is not TradeMarketingDirector"
  - id: ERR_DOCUMENT_CLASS_ROLE_MISMATCH
    http: 403
    condition: "A COMMITMENT document is verified by a role other than KeyAccountManager, or an EVIDENCE document by a role other than TradeFinanceAnalyst"

  # ---- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, wrong type, undeclared enum value, negative amount, money with more than 2 decimals, rate with more than 3 decimals, or a non-RFC3339 timestamp"

  # ---- not found ---------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "programId in the path, or program_id in the body, does not resolve"
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "brandId in the path, or brand_id in the body, does not resolve"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customerId in the path, or customer_id in the body, does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocationId in the path, or allocation_id in the body, does not resolve"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "promotionId in the path, or promotion_id in the body, does not resolve"
  - id: ERR_TACTIC_NOT_FOUND
    http: 404
    condition: "tacticId in the path does not resolve"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "documentId in the path does not resolve"
  - id: ERR_VOLUME_FACT_NOT_FOUND
    http: 404
    condition: "factId in the path does not resolve"
  - id: ERR_ACCRUAL_NOT_FOUND
    http: 404
    condition: "accrualId in the path, or reverses_entry_id in a list filter, does not resolve"
  - id: ERR_DEDUCTION_NOT_FOUND
    http: 404
    condition: "deductionId in the path, or supersedes_deduction_id in the body, does not resolve"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "disputeId in the path does not resolve"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "auditId in the path does not resolve"

  # ---- optimistic concurrency (412) --------------------------------------
  - id: ERR_STALE_ALLOCATION_VERSION
    http: 412
    condition: "expected_allocation_version does not equal the referenced BudgetAllocation.version when a promotion is created"
  - id: ERR_STALE_PROMOTION_VERSION
    http: 412
    condition: "expected_promotion_version does not equal the parent Promotion.version when a deduction is validated or a tactic is patched"

  # ---- state preconditions (409) -----------------------------------------
  - id: ERR_PROGRAM_LOCKED
    http: 409
    condition: "A brand, allocation or allocation approval is written under a TradeProgram whose status is LOCKED"
  - id: ERR_ALLOCATION_NOT_APPROVED
    http: 409
    condition: "A promotion is created or submitted under a BudgetAllocation still in DRAFT"
  - id: ERR_ALLOCATION_POSTURE_RESTRICTED
    http: 409
    condition: "A promotion is created or approved under an allocation whose posture is RESTRICTED or FROZEN"
  - id: ERR_PROMOTION_STATE_INVALID
    http: 409
    condition: "A promotion action, tactic write, document attach, accrual post or analysis is attempted from a lifecycle_status that does not permit it"
  - id: ERR_TACTIC_STATE_INVALID
    http: 409
    condition: "A tactic that is ACTIVE, COMPLETED or CANCELLED is patched or cancelled"
  - id: ERR_DOCUMENT_ALREADY_VERIFIED
    http: 409
    condition: "A RetailerDocument already in VERIFIED is verified again"
  - id: ERR_ACCRUAL_ENTRY_ALREADY_REVERSED
    http: 409
    condition: "A REVERSAL entry is reversed, or an ACCRUAL entry already in REVERSED is reversed again"
  - id: ERR_DEDUCTION_STATE_INVALID
    http: 409
    condition: "match, validate, settle or dispute is attempted from a Deduction status that does not permit it"
  - id: ERR_DISPUTE_STATE_INVALID
    http: 409
    condition: "send-to-retailer, retailer-respond, record-recovery or write-off is attempted from a Dispute status that does not permit it, including any action on a terminal RECOVERED or WRITTEN_OFF dispute"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "record-finding on a FINDINGS_ISSUED audit, or issue-findings on a SCHEDULED or FINDINGS_ISSUED audit"
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 409
    condition: "A promotion is created or approved, a deduction settled, or an allocation created for a customer whose trading_status is CREDIT_HOLD or SUSPENDED"
  - id: ERR_PROMOTION_NOT_MATCHABLE
    http: 409
    condition: "A deduction is matched to a promotion whose lifecycle_status is DRAFT, SUBMITTED, CHANGES_REQUESTED or WITHDRAWN"
  - id: ERR_AUDIT_ALREADY_OPEN
    http: 409
    condition: "A compliance audit is opened for a customer whose audit_status is not CLEAR"

  # ---- uniqueness (409) --------------------------------------------------
  - id: ERR_DUPLICATE_CLAIM_REFERENCE
    http: 409
    condition: "claim_reference already exists for that customer_id"
  - id: ERR_VOLUME_FACT_DUPLICATE
    http: 409
    condition: "(customer_id, brand_id, fact_type, period_start) already exists"
  - id: ERR_ACCRUAL_PERIOD_DUPLICATE
    http: 409
    condition: "An ACCRUAL entry already exists for (promotion_id, period_start)"
  - id: ERR_ANALYSIS_ALREADY_EXISTS
    http: 409
    condition: "The promotion already has a PostEventAnalysis row (a second analyze on an ANALYZED promotion lands here, not on ERR_PROMOTION_STATE_INVALID)"

  # ---- temporal and capacity conflicts (409) -----------------------------
  - id: ERR_DISPLAY_WINDOW_CONFLICT
    http: 409
    condition: "A DISPLAY tactic window overlaps another live DISPLAY tactic on the same customer and brand (half-open windows, so touching endpoints do not conflict)"
  - id: ERR_FEATURE_COOLDOWN_CONFLICT
    http: 409
    condition: "A FEATURE tactic window is within FEATURE_COOLDOWN_DAYS (7) of another live FEATURE tactic on the same brand, at any customer"
  - id: ERR_TPR_CAPACITY_EXCEEDED
    http: 409
    condition: "A third live TPR tactic would cover the same customer and brand on a single day"
  - id: ERR_MAX_REVISION_ROUNDS
    http: 409
    condition: "revise is called when Promotion.revision_round has already reached MAX_REVISION_ROUNDS (2)"
  - id: ERR_DISPUTE_ROUND_LIMIT
    http: 409
    condition: "send-to-retailer is called when Dispute.round_count has already reached MAX_DISPUTE_ROUNDS (2)"

  # ---- business rules (422) ----------------------------------------------
  - id: ERR_WINDOW_NOT_WEEK_ALIGNED
    http: 422
    condition: "A promotion window, tactic window, volume-fact period_start or accrual period_start is not a Monday 00:00:00Z boundary, or window_end is not strictly after window_start"
  - id: ERR_TACTIC_WINDOW_OUTSIDE_PROMOTION
    http: 422
    condition: "A tactic window is not contained in its promotion's window"
  - id: ERR_ACCRUAL_WINDOW_MISMATCH
    http: 422
    condition: "The accrual period, after the method's lead-day shift, falls outside [promotion.window_start, promotion.window_end)"
  - id: ERR_RATE_CHANGE_NOT_FUTURE
    http: 422
    condition: "A PATCH changes rate_per_case or fixed_fee on a tactic whose window_start is at or before the logical clock"
  - id: ERR_TACTIC_TYPE_RATE_MISMATCH
    http: 422
    condition: "A TPR tactic carries fixed_fee or no rate_per_case, or a DISPLAY/FEATURE tactic carries rate_per_case or no fixed_fee"
  - id: ERR_BRAND_PROGRAM_MISMATCH
    http: 422
    condition: "The brand or customer named in an allocation belongs to a different TradeProgram than program_id"
  - id: ERR_DEDUCTION_CUSTOMER_MISMATCH
    http: 422
    condition: "The promotion a deduction is matched to belongs to a different customer"
  - id: ERR_PROMOTION_HAS_NO_TACTICS
    http: 422
    condition: "submit is called on a promotion with no PLANNED tactic"
  - id: ERR_COMMITMENT_DOCUMENTATION_MISSING
    http: 422
    condition: "approve is called while a DISPLAY or FEATURE tactic type on the promotion has no VERIFIED COMMITMENT document covering it"
  - id: ERR_NO_PERFORMANCE_EVIDENCE
    http: 422
    condition: "validate is called under the EVIDENCE_BASED policy with no VERIFIED EVIDENCE document carrying units_verified > 0"
  - id: ERR_DISPUTED_AMOUNT_EXCEEDS_CLAIM
    http: 422
    condition: "disputed_amount is not positive, or exceeds claimed_amount (RECEIVED/MATCHED) or variance_amount (VALIDATED)"
  - id: ERR_WRITE_OFF_EXCEEDS_OPEN_AMOUNT
    http: 422
    condition: "write_off_amount is not positive or exceeds Dispute.disputed_amount"
  - id: ERR_RECOVERY_EXCEEDS_OPEN_AMOUNT
    http: 422
    condition: "recovered_amount is not positive or exceeds Dispute.disputed_amount"
  - id: ERR_REVERSAL_EXCEEDS_ENTRY_AMOUNT
    http: 422
    condition: "The reversal amount does not equal the reversed ACCRUAL entry's amount"
  - id: ERR_ALLOCATION_BALANCE_INSUFFICIENT
    http: 422
    condition: "planned_total_spend exceeds BudgetAllocation.available_amount at approval"
  - id: ERR_UNITS_EXCEED_UNRESERVED
    http: 422
    condition: "Promotion.committed_units exceeds BudgetAllocation.unreserved_units at approval"
  - id: ERR_PROGRAM_BUDGET_EXCEEDED
    http: 422
    condition: "A new allocation's planned_amount would push TradeProgram.allocated_amount past total_budget_amount"
  - id: ERR_ACCRUAL_BALANCE_INSUFFICIENT
    http: 422
    condition: "validate is called under the AGREEMENT_CAP policy while Promotion.accrued_balance is 0.00 or negative"

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# Segregation of duties: the opaque X-User-ID that approved a promotion may not
# validate a deduction matched to it, and the X-User-ID that opened a dispute
# may not approve its write-off. Both checks compare user ids, not roles, so a
# second user in the same role always succeeds.
# =============================================================================
roles:
  - name: TradeMarketingDirector
    description: "Owns the annual trade fund: creates programs, brands, customers and allocations, approves allocations and promotions, locks the program at year end, and is the only role that may approve a write-off at or above WRITE_OFF_SELF_APPROVAL_LIMIT."
    identity: opaque
    exclusive_operations:
      - "POST /trade-marketing/programs"
      - "POST /trade-marketing/programs/{programId}/lock"
      - "POST /trade-marketing/brands"
      - "POST /trade-marketing/customers"
      - "POST /trade-marketing/budget-allocations/{allocationId}/approve"
      - "POST /trade-marketing/promotions/{promotionId}/request-changes"
      - "POST /trade-marketing/promotions/{promotionId}/approve"
      - "write-off of an amount >= WRITE_OFF_SELF_APPROVAL_LIMIT (500.00)"
    shared_operations:
      - "POST /trade-marketing/budget-allocations (with TradeFinanceAnalyst)"
      - "POST /trade-marketing/customers/{customerId}/credit-hold (with DeductionSpecialist)"
      - "POST /trade-marketing/disputes/{disputeId}/write-off (with DeductionSpecialist, below the limit)"
      - "POST /trade-marketing/promotion-activation-runs (with TradeFinanceAnalyst)"
      - "POST /trade-marketing/compliance-audits/{auditId}/issue-findings (with ComplianceAuditor)"
      - "all GET endpoints except the portal-scoped reads"

  - name: KeyAccountManager
    description: "Plans promotions at the retailer: creates promotions and tactic lines, maintains rates, submits for review, revises after changes are requested, withdraws approved promotions, and verifies retailer COMMITMENT documents."
    identity: opaque
    exclusive_operations:
      - "POST /trade-marketing/promotions"
      - "POST /trade-marketing/promotions/{promotionId}/tactics"
      - "PATCH /trade-marketing/tactics/{tacticId}"
      - "POST /trade-marketing/tactics/{tacticId}/cancel"
      - "POST /trade-marketing/promotions/{promotionId}/submit"
      - "POST /trade-marketing/promotions/{promotionId}/revise"
      - "POST /trade-marketing/promotions/{promotionId}/withdraw"
      - "verification of a COMMITMENT RetailerDocument"
    shared_operations:
      - "POST /trade-marketing/promotions/{promotionId}/documents (with TradeFinanceAnalyst)"
      - "POST /trade-marketing/documents/{documentId}/verify (with TradeFinanceAnalyst, split by doc_class)"
      - "all GET endpoints except the portal-scoped reads"

  - name: TradeFinanceAnalyst
    description: "Runs the ledger: posts and reverses accruals, loads volume facts, values and settles deductions, verifies EVIDENCE documents, drives the activation and aging runs, and produces post-event analyses."
    identity: opaque
    exclusive_operations:
      - "POST /trade-marketing/volume-facts"
      - "POST /trade-marketing/promotions/{promotionId}/accruals"
      - "POST /trade-marketing/accruals/{accrualId}/reverse"
      - "POST /trade-marketing/deductions/{deductionId}/validate"
      - "POST /trade-marketing/deductions/{deductionId}/settle"
      - "POST /trade-marketing/promotions/{promotionId}/analyze"
      - "verification of an EVIDENCE RetailerDocument"
    shared_operations:
      - "POST /trade-marketing/budget-allocations (with TradeMarketingDirector)"
      - "POST /trade-marketing/promotions/{promotionId}/documents (with KeyAccountManager)"
      - "POST /trade-marketing/documents/{documentId}/verify (with KeyAccountManager, split by doc_class)"
      - "POST /trade-marketing/promotion-activation-runs (with TradeMarketingDirector)"
      - "POST /trade-marketing/deduction-aging-runs (with DeductionSpecialist)"
      - "all GET endpoints except the portal-scoped reads"

  - name: DeductionSpecialist
    description: "Owns accounts-receivable deduction intake: books claims, matches them to agreements, opens disputes, drives the retailer round trips, records recoveries and approves small write-offs."
    identity: opaque
    exclusive_operations:
      - "POST /trade-marketing/deductions"
      - "POST /trade-marketing/deductions/{deductionId}/match"
      - "POST /trade-marketing/deductions/{deductionId}/dispute"
      - "POST /trade-marketing/disputes/{disputeId}/send-to-retailer"
      - "POST /trade-marketing/disputes/{disputeId}/record-recovery"
    shared_operations:
      - "POST /trade-marketing/customers/{customerId}/credit-hold (with TradeMarketingDirector)"
      - "POST /trade-marketing/disputes/{disputeId}/write-off (with TradeMarketingDirector, below the limit only)"
      - "POST /trade-marketing/deduction-aging-runs (with TradeFinanceAnalyst)"
      - "all GET endpoints except the portal-scoped reads"

  - name: ComplianceAuditor
    description: "Audits contract compliance at the customer: opens the audit, records findings with recovery claims and issues them. Has no authority over money, promotions or deductions."
    identity: opaque
    exclusive_operations:
      - "POST /trade-marketing/customers/{customerId}/compliance-audits"
      - "POST /trade-marketing/compliance-audits/{auditId}/record-finding"
    shared_operations:
      - "POST /trade-marketing/compliance-audits/{auditId}/issue-findings (with TradeMarketingDirector)"
      - "read-only access to programs, brands, customers, allocations, promotions, tactics, documents, volume facts, accruals, deductions, disputes and audits"

  - name: CustomerPortalUser
    description: "The retailer's own portal login. X-User-ID is the Customer.id it acts as; it may read only its own customer's promotions, deductions and disputes, and its only write is answering a dispute sent to it."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /trade-marketing/disputes/{disputeId}/retailer-respond"
    shared_operations:
      - "GET /trade-marketing/customers/{customerId}, /promotions, /promotions/{promotionId}, /deductions, /deductions/{deductionId}, /disputes, /disputes/{disputeId} — always narrowed to its own customer_id, otherwise ERR_CUSTOMER_SCOPE_VIOLATION"
