    excluded_because:
      difficulty_instance: cross_entity_state_dependency / lot_creation_capped_by_interim_approved_submission_then_reopened_by_resubmit
      rationale: That §1.8 instance triggers the cap, then withdraws and re-grants the verdict to show the ceiling
        appearing and disappearing with the submission state.
  - name: fourth_submission_round_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_MAX_SUBMISSION_ROUNDS_EXCEEDED]
    - validations[priority 61]
    excluded_because:
      difficulty_instance: non_linear_state_machine / qualification_submission_revision_cycle_capped_at_three_rounds
      rationale: The §1.8 cycle instance walks the REVISION_REQUESTED -> SUBMITTED loop to its bound and asserts
        this error on the round that would have been the fourth.
  - name: heat_treat_charge_over_the_oven_capacity_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_OVEN_CAPACITY_EXCEEDED]
    - validations[priority 71]
    excluded_because:
      difficulty_instance: boundary_precision_check / oven_aggregate_load_exactly_at_capacity_and_closed_interval_touch_on_heat_treat
      rationale: That §1.8 instance triggers this error one kilogram over the aggregate ceiling and shows the
        exactly-at-capacity charge being admitted.
  - name: run_creation_before_the_design_is_released_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PPAP_NOT_APPROVED]
    - validations[priority 41]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / ppap_not_approved_safety_outranks_setup_design_mismatch_referential_on_run_creation
      rationale: The §1.8 pair instance triggers this error on POST /production-runs as the winning row and then
        satisfies it to expose the referential row underneath.
  - name: lot_from_an_incomplete_run_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RUN_NOT_COMPLETE]
    - validations[priority 22]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / run_not_complete_state_outranks_commitment_exceeded_fiscal_on_lot_creation
      rationale: That §1.8 instance triggers this error from a RUNNING run while a commitment violation is also
        pending, which is a strictly stronger version of the plain trigger.
  - name: ship_of_a_lot_whose_run_is_on_spc_hold_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RUN_ON_SPC_HOLD]
    - validations[priority 23]
    excluded_because:
      difficulty_instance: non_linear_state_machine / production_run_parallel_axes_move_independently
      rationale: The §1.8 parallel-axis instance holds the quality axis at SPC_HOLD while the process axis is
        elsewhere and asserts this error on every endpoint the hold blocks.
  - name: run_whose_body_design_differs_from_the_setup_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SETUP_DESIGN_MISMATCH]
    - validations[priority 47]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / ppap_not_approved_safety_outranks_setup_design_mismatch_referential_on_run_creation
      rationale: That §1.8 instance triggers this error as the second half of its ordering assertion, with the
        safety row above it satisfied.
  - name: setup_overlapping_a_scheduled_window_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SETUP_WINDOW_CONFLICT]
    - validations[priority 67]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / coiling_machine_half_open_windows_with_symmetric_changeover_buffer
      rationale: The §1.8 overlap instance triggers this error inside the changeover buffer and admits the abutting
        window just outside it.
  - name: ship_against_written_off_tooling_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_TOOLING_NOT_AMORTIZING]
    - validations[priority 76]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / lot_ship_blocked_by_written_off_tooling_after_design_obsolescence
      rationale: That §1.8 instance reaches this error through a design obsolescence that writes the tool off
        underneath an already-packed lot, which is the only way the row is reachable.
  - name: setup_whose_wire_exceeds_the_machine_capacity_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_WIRE_DIAMETER_EXCEEDS_MACHINE]
    - validations[priority 53]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / wire_diameter_constraint_outranks_setup_window_conflict_temporal_on_setup_creation
      rationale: The §1.8 pair instance triggers this error while a buffered window conflict is also pending on
        the same coiler.
  - name: run_on_an_uncertified_heat_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_WIRE_LOT_NOT_CERTIFIED]
    - validations[priority 40]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / run_creation_blocked_by_rejected_and_untested_wire_heats
      rationale: That §1.8 instance triggers this error from both the UNCERTIFIED and the REJECTED heat, covering
        both faces of the certification gate.
