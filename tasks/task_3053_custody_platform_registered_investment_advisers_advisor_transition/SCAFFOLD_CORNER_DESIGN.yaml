  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_block_allocation_variants_covered_by_difficulty_index
        claim_type: Variant Divergence
        grounds: [calculations.block_trade_average_price_allocation]
        excluded_because:
          difficulty_instance: block_allocate_then_round_vs_round_then_allocate_variant
          rationale: "Both rounding orders and their one-cent divergence are asserted by the named §1.8 instance."

      - name: corner_carryover_variants_covered_by_difficulty_index
        claim_type: Variant Selection
        grounds: [calculations.cost_basis_carryover]
        excluded_because:
          difficulty_instance: transfer_basis_graded_vs_full_carryover_variant
          rationale: "GRADED_CARRYOVER versus FULL_CARRYOVER selection by transfer method is asserted by the named §1.8 instance."

      - name: excluded_alternative_and_stale_sleeves_do_not_enter_fee_basis
        claim_type: Input Set Filtering
        grounds:
          - calculations.household_fee_basis.input_set
          - calculations.alternative_valuation_haircut.variants.HAIRCUT_STALE
          - entities.AlternativeAssetHolding.fields.fee_basis_eligible
        distinguishing_aspect: "The C1 input filter is explicit: a PENDING account, a CLOSED account, an ENTITY account and a stale accepted holding all contribute 0, while the same holding with a fresh as-of date contributes its haircut value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement, granted BILLING and ALTERNATIVE_ASSETS entitlements, one household with an OPEN billable INDIVIDUAL account, a PENDING ENTITY account and a CLOSED account."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - &z_ent_bil
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "BILLING", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_bil_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "ALTERNATIVE_ASSETS", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_alt_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_alt_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-115001", account_type: "ENTITY", householding_consent: "NONE" }
              as: AdvisorOperationsLead
              captures: { ent_acct_id: $.data.id }
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-115002", account_type: "JOINT", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { closed_acct_id: $.data.id }
            - call: "POST /ria/accounts/${closed_acct_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts/${closed_acct_id}/close"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/alternatives"
              payload: { account_id: "${acct_id}", asset_name: "Meridian Real Assets Fund II", unit_count: 20, stated_value_cents: 50000000, valuation_floor_cents: 30000000, valuation_as_of_date: "2026-08-01T00:00:00Z" }
              as: AdvisorOperationsLead
              captures: { alt_id: $.data.id }
          trigger:
            - call: "POST /ria/alternatives/${alt_id}/submit-valuation"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/alternatives/${alt_id}/accept-valuation"
              payload: {}
              as: ComplianceReviewer
          assert:
            - "AlternativeAssetHolding.${alt_id}.asset_acceptance_status == ACCEPTED"
            - "AlternativeAssetHolding.${alt_id}.valuation_age_days == 31 and stale_valuation == false"
            - "AlternativeAssetHolding.${alt_id}.accepted_value_cents == 37500000 (25 percent haircut with the floor inactive)"
            - "AlternativeAssetHolding.${alt_id}.fee_basis_eligible == true"
            - "HouseholdAccount.${ent_acct_id}.billable == false and HouseholdAccount.${closed_acct_id}.account_status == CLOSED"
            - "Household.${h_id}.household_fee_basis_cents == 37500000, so the PENDING ENTITY account and the CLOSED account both contributed 0"

      - name: alt_haircut_honours_floor_and_caps_at_stated_value
        claim_type: Constants Applied
        grounds:
          - calculations.alternative_valuation_haircut.constants.HAIRCUT_BPS_AGED
          - calculations.alternative_valuation_haircut.formula
          - entities.AlternativeAssetHolding.fields.valuation_floor_cents
        distinguishing_aspect: "The haircut constant 2500 bps is applied and then both clamps fire: with a stated value of 40000000 and a floor of 32000000 the floor binds (32000000), while with a floor of 1000 the haircut binds (30000000)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted ALTERNATIVE_ASSETS entitlement, one household, one OPEN account."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "ALTERNATIVE_ASSETS", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_alt_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_alt_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/alternatives"
              payload: { account_id: "${acct_id}", asset_name: "Harbour Lane Credit Fund III", unit_count: 10, stated_value_cents: 40000000, valuation_floor_cents: 32000000, valuation_as_of_date: "2026-08-15T00:00:00Z" }
              as: AdvisorOperationsLead
              captures: { alt_floor_id: $.data.id }
            - call: "POST /ria/alternatives"
              payload: { account_id: "${acct_id}", asset_name: "Harbour Lane Value Fund IV", unit_count: 10, stated_value_cents: 40000000, valuation_floor_cents: 1000, valuation_as_of_date: "2026-08-15T00:00:00Z" }
              as: AdvisorOperationsLead
              captures: { alt_hair_id: $.data.id }
          trigger:
            - call: "POST /ria/alternatives/${alt_floor_id}/submit-valuation"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/alternatives/${alt_floor_id}/accept-valuation"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /ria/alternatives/${alt_hair_id}/submit-valuation"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/alternatives/${alt_hair_id}/accept-valuation"
              payload: {}
              as: ComplianceReviewer
          assert:
            - "AlternativeAssetHolding.${alt_floor_id}.accepted_value_cents == 32000000 because max(30000000, 32000000) binds the floor"
            - "AlternativeAssetHolding.${alt_hair_id}.accepted_value_cents == 30000000 because max(30000000, 1000) leaves the haircut binding"
            - "both holdings report haircut_pct == 2500"
            - "Household.${h_id}.household_fee_basis_cents == 62000000"

