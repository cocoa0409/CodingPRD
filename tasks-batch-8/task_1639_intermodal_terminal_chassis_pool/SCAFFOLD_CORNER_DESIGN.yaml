              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
