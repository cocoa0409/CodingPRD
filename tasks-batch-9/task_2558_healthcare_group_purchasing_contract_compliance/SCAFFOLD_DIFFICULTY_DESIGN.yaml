            - "the new election returns error_id ERR_MEMBER_NOT_ACTIVE with HTTP 409 — not ERR_DUPLICATE_COMMITMENT — because the member-state check at priority 7 outranks the uniqueness check at priority 15"
            - "the load of the pre-existing file succeeds: DistributorFile.${f1}.status == LOADED"
            - "Commitment.${k1}.ytd_on_contract_spend_cents == 1900000 and ytd_measured_volume_units == 200 — suspension did not block settlement of purchases already in flight"
            - "Commitment.${k1}.leakage_flag == false and Member.${m1}.watchlist_status == NONE"

  # ═══════════════════════════════════════════════════════════════════════════
  - rule_id: resource_temporal_overlap
    instances:
      - name: distributor_file_half_open_periods_abut_without_colliding
        grounds:
          - validations[priority=19]
          - state_machines.DistributorFile.null_to_RECEIVED
          - state_machines.DistributorFile.LOADED_to_REVERSED
          - entities.DistributorFile.fields.distributor_code
          - errors.ERR_FILE_PERIOD_OVERLAP
        distinguishing_aspect: |
          Resource entity: DistributorFile, keyed on (member_id, contract_id,
          distributor_code), with HALF-OPEN [period_start, period_end) semantics — so
          [2026-08-01, 2026-09-01) and [2026-09-01, 2026-10-01) abut and both stand, while
          [2026-08-15, 2026-09-15) straddles both and is refused. The exclusion set is also
          status-sensitive: a REVERSED file stops reserving its window.
        test_recipe:
          setup:
            - "ACTIVE contract C-SUT-1 and ACTIVE member M-1 with item_master MI-1; no commitment exists, so loading a file is a pure intake exercise and no ledger moves."
            - "File D-A over [2026-08-01, 2026-09-01) already LOADED with one accepted UNMATCHED line."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUT-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 100, unit_price_paid_cents: 9500, purchase_date: "2026-08-05" } ] }
              as: DistributorAgent
              captures: { f1: $.data.id }
            - call: "POST /gpo/distributor-files/${f1}/validate"
              payload: {}
              as: DistributorAgent
            - call: "POST /gpo/distributor-files/${f1}/load"
              payload: {}
              as: ComplianceAnalyst
              captures: { f1_status: $.data.status }
          trigger:
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-09-01", period_end: "2026-10-01", lines: [ { member_item_number: "MI-1", quantity_units: 10, unit_price_paid_cents: 9500, purchase_date: "2026-09-05" } ] }
              as: DistributorAgent
              captures: { f_adj: $.data.id, f_adj_status: $.data.status }
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-15", period_end: "2026-09-15", lines: [ { member_item_number: "MI-1", quantity_units: 10, unit_price_paid_cents: 9500, purchase_date: "2026-08-20" } ] }
              as: DistributorAgent
              expect_error: ERR_FILE_PERIOD_OVERLAP
              expect_status: 409
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-B", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 10, unit_price_paid_cents: 9500, purchase_date: "2026-08-06" } ] }
              as: DistributorAgent
              captures: { f_other_distributor: $.data.id }
            - call: "POST /gpo/distributor-files/${f1}/reverse"
              payload: { reason: "Distributor restated the August statement." }
              as: ComplianceAnalyst
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 120, unit_price_paid_cents: 9500, purchase_date: "2026-08-05" } ] }
              as: DistributorAgent
              captures: { f_restated: $.data.id }
          assert:
            - "${f1_status} == LOADED"
            - "${f_adj_status} == RECEIVED — [2026-09-01, 2026-10-01) abuts [2026-08-01, 2026-09-01) at exactly one instant and is accepted, because the interval is half-open"
            - "the straddling [2026-08-15, 2026-09-15) intake returns error_id ERR_FILE_PERIOD_OVERLAP with HTTP 409"
            - "the D-B intake over the identical [2026-08-01, 2026-09-01) window succeeds: the reservation key includes distributor_code"
            - "DistributorFile.${f1}.status == REVERSED after the reverse"
            - "the restated D-A intake over [2026-08-01, 2026-09-01) succeeds with status RECEIVED, because a REVERSED file no longer reserves its window"
            - "GET /gpo/distributor-files?member_id=${m1}&distributor_code=D-A returns exactly 3 rows: one REVERSED and two RECEIVED"

      - name: price_activation_closed_windows_collide_on_a_shared_endpoint_date
        grounds:
          - validations[priority=20]
          - state_machines.PriceActivation.null_to_DRAFT
          - state_machines.PriceActivation.DRAFT_to_DENIED
          - entities.PriceActivation.fields.activation_type
          - errors.ERR_ACTIVATION_PERIOD_OVERLAP
        distinguishing_aspect: |
          A different resource entity (PriceActivation, keyed on commitment_id +
          contract_item_id + activation_type) with the OPPOSITE interval semantics: the
          window is FULLY CLOSED [effective_from, effective_to], so sharing the single date
          2026-09-30 is already a collision — the exact configuration that the half-open
          file periods above accept. activation_type is part of the key, so a LOCAL_EXCEPTION
          may cover the identical dates as a TIER_PRICE row, and a DENIED row stops
          reserving its window.
        test_recipe:
          setup:
            - "ACTIVE contract C-SUT-1 spanning [2026-01-01, 2026-12-31]; catalog item V-1 at base 10000 / floor 8200."
            - "Member M-1 with an ELECTED commitment (letter not yet countersigned, so current_tier_code is null and activations price off Contract.default_tier_code TIER_0)."
            - "A DRAFT TIER_PRICE activation over the closed window [2026-08-01, 2026-09-30]; DRAFT rows already reserve their window."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUT-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-09-30" }
              as: ContractManager
              captures: { a1: $.data.id, a1_tier: $.data.tier_code_at_activation, a1_price: $.data.computed_price_cents }
          trigger:
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-09-30", effective_to: "2026-12-31" }
              as: ContractManager
              expect_error: ERR_ACTIVATION_PERIOD_OVERLAP
              expect_status: 409
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-10-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { a2: $.data.id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "LOCAL_EXCEPTION", requested_price_cents: 9000, effective_from: "2026-08-01", effective_to: "2026-09-30" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { a3: $.data.id, a3_price: $.data.computed_price_cents }
            - call: "POST /gpo/price-activations/${a3}/deny"
              payload: { reason: "Local price not justified." }
              as: ContractManager
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "LOCAL_EXCEPTION", requested_price_cents: 8800, effective_from: "2026-08-01", effective_to: "2026-09-30" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { a4: $.data.id, a4_price: $.data.computed_price_cents }
          assert:
            - "${a1_tier} == TIER_0 and ${a1_price} == 10000 — the commitment is only ELECTED, so the price came off Contract.default_tier_code"
            - "the [2026-09-30, 2026-12-31] create returns error_id ERR_ACTIVATION_PERIOD_OVERLAP with HTTP 409: one shared endpoint date is a collision under closed-interval semantics"
            - "the [2026-10-01, 2026-12-31] create succeeds with PriceActivation.${a2}.status == DRAFT"
            - "the LOCAL_EXCEPTION over the identical [2026-08-01, 2026-09-30] window succeeds because activation_type is part of the reservation key, and ${a3_price} == 9000"
            - "PriceActivation.${a3}.status == DENIED after the deny"
            - "the second LOCAL_EXCEPTION over the identical window succeeds because DENIED rows no longer reserve it, and ${a4_price} == 8800"
            - "GET /gpo/price-activations?commitment_id=${k1} returns exactly 4 rows (3 DRAFT, 1 DENIED) and ContractItem.${i1}.active_activation_count == 0 — nothing was ever activated"

  # ═══════════════════════════════════════════════════════════════════════════
  - rule_id: compensating_invariant
    instances:
      - name: distribution_reverse_conserves_gross_fee_cents
        grounds:
          - state_machines.AdminFeeDistribution.DISTRIBUTED_to_REVERSED
          - calculations.distribution_waterfall
          - entities.AdminFeeDistribution.fields.undistributed_cents
          - entities.Member.fields.fee_credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY — gross_pool_cents. Before the reversal the identity is
          58617 + 0 + 41583 == 100200; after it, every member is debited by exactly the
          share_cents it was credited (never a re-derived amount), the pools are zeroed and
          the whole 100200 lands in undistributed_cents, so
          member_share_total_cents + undistributed_cents + gpo_retained_cents == 100200
          still holds and both member balances return to 0 with no residual cent.
        test_recipe:
          setup:
            - "ACTIVE contract C-COL with share_basis COLLECTED, admin_fee_bps 300, member_share_bps 6000 and the shared holdback ladder."
            - "Members M-A then M-B, each with an ACTIVE COUNTERSIGNED TIER_0 commitment, an APPROVED cross-reference and an ACTIVE TIER_PRICE activation at 10000; both start at fee_credit_balance_cents 0."
            - "LOADED files giving M-A ytd_on_contract_spend_cents 4750000 and M-B 1900000 over [2026-08-01, 2026-09-01), both with leakage_flag false."
            - "A distribution for that period accrued at 199500, collected at 100200 and already DISTRIBUTED, so member_shares is [{M-A, 41869}, {M-B, 16748}], member_share_total_cents 58617, undistributed_cents 0 and gpo_retained_cents 41583."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
