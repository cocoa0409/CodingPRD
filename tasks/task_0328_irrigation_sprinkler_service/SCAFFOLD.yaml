# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceQuote
    field: quote_state
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    note: "Cyclic revision loop: SENT → CHANGES_REQUESTED → DRAFT → SENT (Rule 3)."
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /service-quotes/{id}/send"
        actor: Dispatcher
        preconditions:
          - "quote_state == DRAFT (else ERR_QUOTE_NOT_DRAFT)"
          - "line_items non-empty (else ERR_EMPTY_QUOTE)"
        side_effects:
          - "estimated_total_cents recomputed via §1.3 quote_total variant=estimated"

      - from: SENT
        to: CHANGES_REQUESTED
        trigger: "POST /service-quotes/{id}/request-changes"
        actor: Customer
        preconditions:
          - "quote_state == SENT (else ERR_QUOTE_NOT_SENT)"
          - "acting Customer owns Property.customer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /service-quotes/{id}/line-items"
        actor: Dispatcher
        preconditions:
          - "quote_state == CHANGES_REQUESTED (else ERR_QUOTE_NOT_REVISABLE)"
        side_effects:
          - "line_items replaced; estimated_total_cents recomputed via §1.3 quote_total variant=estimated"

      - from: SENT
        to: APPROVED
        trigger: "POST /service-quotes/{id}/approve"
        actor: Customer
        preconditions:
          - "quote_state == SENT (else ERR_QUOTE_NOT_SENT)"
          - "acting Customer owns Property.customer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Property.status == ACTIVE (else ERR_PROPERTY_INACTIVE) [cross-entity: ServiceQuote→Property]"
        side_effects:
          - "Spawns a WorkOrder (job_type INSTALL if quote_type==INSTALL else LEAK_REPAIR) on the property's first OPERATIONAL system with completion_status=PENDING, dispatch_status=UNSCHEDULED, estimated_cost_cents=estimated_total_cents, origin_quote_id=this.id"
          - "linked_work_order_id set to the new WorkOrder.id"
          - "the spawned WorkOrder creation debits IrrigationSystem.committed_cost_cents by estimated_cost_cents (cascade hop, Rule 4b)"

      - from: SENT
        to: REJECTED
        trigger: "POST /service-quotes/{id}/reject"
        actor: Customer
        preconditions:
          - "quote_state == SENT (else ERR_QUOTE_NOT_SENT)"
          - "acting Customer owns Property.customer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

  - entity: WorkOrder
    field: "dispatch_status × completion_status (parallel dimensions, Rule 3)"
    initial_state: "dispatch_status=UNSCHEDULED, completion_status=PENDING"
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    note: |
      Two independent state axes on one row. dispatch_status advances UNSCHEDULED→SCHEDULED→EN_ROUTE→ON_SITE
      as the route progresses; completion_status advances PENDING→IN_PROGRESS→{COMPLETED|FAILED} as the work
      progresses. They evolve independently except where preconditions cross-reference each other.
    transitions:
      # --- dispatch_status dimension ---
      - from: "dispatch_status=UNSCHEDULED"
        to: "dispatch_status=SCHEDULED"
        trigger: "POST /route-stops (creates a RouteStop referencing this work order)"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.completion_status == PENDING (else ERR_WORKORDER_NOT_PENDING)"
          - "WorkOrder.dispatch_status == UNSCHEDULED (else ERR_WORKORDER_ALREADY_SCHEDULED)"
          - "if job_type==STARTUP then system.season_state == WINTERIZED (else ERR_SEASON_STATE_BLOCKS_STARTUP) [cross-entity: WorkOrder→IrrigationSystem, Rule 7a]"
        side_effects:
          - "assigned_technician_id set to the route's technician_id"
          - "Route.stops_used and Route.minutes_committed recomputed (Rule 9b conserved count)"

      - from: "dispatch_status=SCHEDULED"
        to: "dispatch_status=EN_ROUTE"
        trigger: "POST /work-orders/{id}/depart"
        actor: Technician
        preconditions:
          - "dispatch_status == SCHEDULED (else ERR_WORKORDER_NOT_SCHEDULED)"
          - "acting Technician == assigned_technician_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: "dispatch_status=EN_ROUTE"
        to: "dispatch_status=ON_SITE"
        trigger: "POST /work-orders/{id}/arrive"
        actor: Technician
        preconditions:
          - "dispatch_status == EN_ROUTE (else ERR_WORKORDER_NOT_EN_ROUTE)"
          - "acting Technician == assigned_technician_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "completion_status PENDING → IN_PROGRESS (auto)"

      # --- completion_status dimension ---
      - from: "completion_status=IN_PROGRESS"
        to: "completion_status=COMPLETED"
        trigger: "POST /work-orders/{id}/complete"
        actor: Technician
        preconditions:
          - "completion_status == IN_PROGRESS (else ERR_WORKORDER_NOT_IN_PROGRESS)"
          - "dispatch_status == ON_SITE (else ERR_WORKORDER_NOT_ON_SITE)"
          - "acting Technician == assigned_technician_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "IrrigationSystem.committed_cost_cents credited back by estimated_cost_cents (Rule 9a conserved money)"
          - "ServiceQuote.final_total_cents recomputed if origin_quote_id set (§1.3 quote_total variant=final)"
          - "if job_type==WINTERIZATION: system.season_state → WINTERIZED; system.assessed_winter_risk recomputed (Rule 4b depth-2 cascade)"
          - "if job_type==STARTUP: system.season_state → ACTIVE"

      - from: "completion_status=IN_PROGRESS"
        to: "completion_status=FAILED"
        trigger: "POST /work-orders/{id}/fail"
        actor: Technician
        preconditions:
          - "completion_status == IN_PROGRESS (else ERR_WORKORDER_NOT_IN_PROGRESS)"
          - "acting Technician == assigned_technician_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "IrrigationSystem.committed_cost_cents credited back by estimated_cost_cents (Rule 9a conserved money)"

      - from: "completion_status IN {PENDING, IN_PROGRESS}"
        to: "completion_status=CANCELLED"
        trigger: "POST /work-orders/{id}/cancel  OR  system (IrrigationSystem decommission cascade)"
        actor: Dispatcher | system
        preconditions:
          - "completion_status NOT IN {COMPLETED, FAILED, CANCELLED} (else ERR_WORKORDER_TERMINAL)"
        side_effects:
          - "IrrigationSystem.committed_cost_cents credited back by estimated_cost_cents (Rule 9a conserved money)"
          - "any SCHEDULED RouteStop referencing this work order → REMOVED (its Route.stops_used/minutes_committed recomputed) (cascade hop)"

  - entity: IrrigationSystem
    field: lifecycle_state
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    note: "Decommission triggers a depth-3+ cascade (Rule 4a)."
    transitions:
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /irrigation-systems/{id}/decommission"
        actor: Dispatcher
        preconditions:
          - "lifecycle_state == OPERATIONAL (else ERR_SYSTEM_ALREADY_DECOMMISSIONED)"
        side_effects:
          - "CASCADE HOP 1: every Zone with system_id==this.id and zone_state != ARCHIVED → ARCHIVED"
          - "CASCADE HOP 2: each just-archived zone that is referenced by an ACTIVE ControllerProgram.slots forces that ControllerProgram.program_state ACTIVE → STALE"
          - "CASCADE HOP 3: every WorkOrder with system_id==this.id whose completion_status NOT IN {COMPLETED,FAILED,CANCELLED} → CANCELLED (each cancellation itself credits committed_cost_cents and removes its SCHEDULED RouteStops, per WorkOrder cancel side-effects)"
          - "Property.compliance_status recomputed"

  - entity: ControllerProgram
    field: program_state
    initial_state: DRAFT
    terminal_states: [STALE]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /controller-programs/{id}/activate"
        actor: Technician
        preconditions:
          - "program_state == DRAFT (else ERR_PROGRAM_NOT_DRAFT)"
          - "slots non-empty (else ERR_EMPTY_PROGRAM) [boundary: empty-set, Rule 6b]"
          - "system.season_state == ACTIVE (else ERR_SEASON_STATE_BLOCKS_PROGRAM) [cross-entity: ControllerProgram→IrrigationSystem]"
          - "no two slots overlap on [start_sec, start_sec+run_minutes*60) after enforcing VALVE_SWITCH_BUFFER_SEC gap (else ERR_PROGRAM_SLOT_OVERLAP) [temporal overlap with buffer, Rule 8b]"
        side_effects:
          - "every Zone referenced in slots with zone_state==MAPPED → ACTIVE; IrrigationSystem.zone_count recomputed"

  - entity: Route
    field: route_state
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "route_state == PLANNING (else ERR_ROUTE_NOT_PLANNING)"
          - "stops_used >= 1 (else ERR_EMPTY_ROUTE) [boundary: zero-count, Rule 6b]"
        side_effects:
          - "all SCHEDULED RouteStops' WorkOrders dispatch_status SCHEDULED → SCHEDULED (no-op; stamps dispatched marker only)"

      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /routes/{id}/close"
        actor: Dispatcher
        preconditions:
          - "route_state == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
        side_effects: []

  - entity: MaintenancePlan
    field: plan_state
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /maintenance-plans/{id}/pause"
        actor: Dispatcher
        preconditions:
          - "plan_state == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /maintenance-plans/{id}/resume"
        actor: Dispatcher
        preconditions:
          - "plan_state == PAUSED (else ERR_PLAN_NOT_PAUSED)"
        side_effects: []
      - from: "{ACTIVE, PAUSED}"
        to: CANCELLED
        trigger: "POST /maintenance-plans/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "plan_state != CANCELLED (else ERR_PLAN_TERMINAL)"
        side_effects: []

  - entity: BackflowTest
    field: result
    initial_state: "(none — computed once at creation)"
    terminal_states: [PASS, FAIL]
    note: "Append-only record; result is computed at creation and immutable. Its creation drives a bubble-up cascade on the system and property (Rule 4a)."
    transitions:
      - from: "(create)"
        to: "result=PASS"
        trigger: "POST /backflow-tests"
        actor: BackflowTester
        preconditions:
          - "system.has_backflow_device == true (else ERR_NO_BACKFLOW_DEVICE) [referential, Rule 5b]"
          - "tester_technician_id refers to a Technician with backflow_certified==true (else ERR_TESTER_NOT_CERTIFIED) [safety, Rule 5b]"
          - "relief_open_psi >= MIN_RELIEF_PSI AND checkvalve_hold_psi >= MIN_HOLD_PSI"
        side_effects:
          - "CASCADE HOP 1: IrrigationSystem.backflow_status → CERTIFIED"
          - "CASCADE HOP 2: Property.compliance_status recomputed → COMPLIANT iff every non-decommissioned system on the property is CERTIFIED"
      - from: "(create)"
        to: "result=FAIL"
        trigger: "POST /backflow-tests"
        actor: BackflowTester
        preconditions:
          - "system.has_backflow_device == true (else ERR_NO_BACKFLOW_DEVICE)"
          - "tester_technician_id refers to a Technician with backflow_certified==true (else ERR_TESTER_NOT_CERTIFIED)"
          - "relief_open_psi < MIN_RELIEF_PSI OR checkvalve_hold_psi < MIN_HOLD_PSI"
        side_effects:
          - "IrrigationSystem.backflow_status → FAILED"
          - "Property.compliance_status recomputed (stays NON_COMPLIANT)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: route-stop-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /route-stops"
    occ_field: "expected_route_version"
    description: |
      Adding a RouteStop against a Route whose version has advanced since the client
      last observed it is rejected. A prior accepted stop legitimately consumed slot
      and minute capacity on the route and advanced Route.version; a writer still
      carrying the pre-add version holds a stale view of the route's remaining capacity.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_total
    trigger: "ServiceQuote send / line-item revision (estimated); linked WorkOrder completion (final)"
    algorithm: aggregation
    formula: |
      # variant=estimated (forward-looking, catalog rates):
      #   per_line = quantity * unit_rate_cents      # exact integer cents, no rounding needed
      #   subtotal = sum(per_line for each line_item)
      #   estimated_total_cents = round_half_up( subtotal * (1 + TAX_RATE) )   # single round at the end
      #
      # variant=final (chronological, actuals on the linked WorkOrder):
      #   parts_taxed_per_nothing... compute per the PINNED ORDER below:
      #   labor_component  = round_half_up( actual_labor_cents * (1 + TAX_RATE) )   # round labor line first
      #   parts_component  = round_half_up( actual_parts_cents * (1 + TAX_RATE) )   # round parts line second
      #   final_total_cents = labor_component + parts_component                     # THEN sum (Rule 2b: round-per-line-then-sum)
    input_set: "estimated: this quote's line_items. final: actual_labor_cents + actual_parts_cents on WorkOrder whose id==linked_work_order_id, only after that WorkOrder reaches completion_status==COMPLETED."
    constants:
      TAX_RATE: 0.08
    precision: "integer cents, round_half_up at each pinned rounding point"
    variants:
      - name: estimated
        when: "quote_state transitions into SENT, or line-items revised"
        difference: "Forward-looking: catalog unit rates, single round AFTER summing the whole subtotal."
      - name: final
        when: "linked WorkOrder reaches COMPLETED"
        difference: "Chronological actuals: tax each of the labor and parts lines and round EACH line, THEN sum — produces a different cents figure from estimated even when raw totals match (Rule 2b pinned order)."

  - name: winter_risk_score
    trigger: "WorkOrder lifecycle on the system (provisional: any open WINTERIZATION/REPAIR order; assessed: on WINTERIZATION completion)"
    algorithm: weighted_scoring
    formula: |
      # Per-zone exposure weight by plant_type:
      #   WEIGHT[TURF]=4, WEIGHT[SHRUB]=2, WEIGHT[DRIP]=1, WEIGHT[ROTOR]=3
      # zone_exposure = sum over non-ARCHIVED zones of ( WEIGHT[plant_type] * head_count )
      # psi_factor    = 2 if static_psi >= HIGH_PSI else 1        # threshold branch (Rule 2a non-linear input #3)
      #
      # variant=provisional (forward-looking): assumes EVERY non-ARCHIVED zone still holds water
      #   provisional_winter_risk = min( RISK_CAP, zone_exposure * psi_factor )
      #
      # variant=assessed (settled after blowout): zones serviced by a COMPLETED WINTERIZATION are drained
      #   drained_exposure = sum over non-ARCHIVED zones of (WEIGHT[plant_type]*head_count) ONLY IF
      #                       the system has NO COMPLETED WINTERIZATION work order; else 0
      #   assessed_winter_risk = min( RISK_CAP, drained_exposure * psi_factor )
    input_set: "Non-ARCHIVED zones of the system. provisional ignores winterization completion; assessed zeroes exposure once a WINTERIZATION WorkOrder on the system is COMPLETED."
    constants:
      HIGH_PSI: 80
      RISK_CAP: 1000
    precision: "integer points"
    variants:
      - name: provisional
        when: "any non-terminal WINTERIZATION/REPAIR work order exists on the system"
        difference: "Treats all zones as still pressurized — forward-looking worst case."
      - name: assessed
        when: "a WINTERIZATION WorkOrder on the system has reached COMPLETED"
        difference: "Drains exposure to 0 once winterized — different result from provisional for identical zone inventory (dual-variant, different entity domain from quote_total)."

  - name: blowout_price
    trigger: "GET /irrigation-systems/{id}/blowout-quote (winterization pricing preview)"
    algorithm: tiered_pricing
    formula: |
      n = zone_count (non-ARCHIVED zones)
      # Tiered per-zone rate by zone count (Rule 2a: >=3 inputs, tiered selection + nested min/max):
      #   if n <= 4:        per_zone = TIER1_RATE_CENTS
      #   elif n <= 10:     per_zone = TIER2_RATE_CENTS
      #   else:             per_zone = TIER3_RATE_CENTS
      # psi_surcharge_cents = max(0, min(PSI_SURCHARGE_CAP_CENTS, (static_psi - HIGH_PSI) * PSI_SURCHARGE_PER_PSI))
      # blowout_price_cents = BASE_FEE_CENTS + per_zone * n + psi_surcharge_cents
    input_set: "The system's non-ARCHIVED zone_count and static_psi."
    constants:
      BASE_FEE_CENTS: 4500
      TIER1_RATE_CENTS: 1200
      TIER2_RATE_CENTS: 1000
      TIER3_RATE_CENTS: 850
      HIGH_PSI: 80
      PSI_SURCHARGE_PER_PSI: 50
      PSI_SURCHARGE_CAP_CENTS: 3000
    precision: "integer cents, exact (no fractional cents arise)"

  - name: plan_annual_dues
    trigger: "MaintenancePlan creation"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency pinned by evaluation order (Rule 2c):
      #   base_per_visit = TIER_RATE_CENTS[tier]
      #   gross = base_per_visit * visits_per_year
      #   # the loyalty discount tier is keyed on gross, but gross is needed to pick the tier:
      #   # PINNED ORDER — compute gross FIRST, THEN select discount_pct from gross, THEN apply:
      #   if gross >= LOYALTY_HI_CENTS:   discount_pct = 0.15
      #   elif gross >= LOYALTY_LO_CENTS: discount_pct = 0.08
      #   else:                           discount_pct = 0.0
      #   annual_dues_cents = round_half_up( gross * (1 - discount_pct) )
    input_set: "This plan's tier and visits_per_year only."
    constants:
      TIER_RATE_BASIC_CENTS: 6000
      TIER_RATE_PLUS_CENTS: 9000
      TIER_RATE_PREMIUM_CENTS: 13000
      LOYALTY_LO_CENTS: 60000
      LOYALTY_HI_CENTS: 120000
    precision: "integer cents, round_half_up once at the end"

  - name: backflow_result
    trigger: "BackflowTest creation"
    algorithm: threshold
    formula: |
      result = PASS if (relief_open_psi >= MIN_RELIEF_PSI AND checkvalve_hold_psi >= MIN_HOLD_PSI) else FAIL
      # boundary precision: relief_open_psi == MIN_RELIEF_PSI passes (>=, not >) (Rule 6a)
    input_set: "This test's relief_open_psi and checkvalve_hold_psi."
    constants:
      MIN_RELIEF_PSI: 2
      MIN_HOLD_PSI: 1
    precision: "integer PSI"

  - name: program_slot_overlap_check
    trigger: "POST /controller-programs/{id}/activate (before activation)"
    algorithm: interval_merge
    formula: |
      # Each slot occupies the half-open interval [start_sec, start_sec + run_minutes*60).
      # Buffered (closed-with-gap) semantics: two slots A,B (A.end <= B.start, sorted by start_sec)
      # CONFLICT when (B.start - A.end) < VALVE_SWITCH_BUFFER_SEC. Thus exact adjacency (gap==0)
      # is REJECTED, unlike a plain half-open overlap test where adjacency is allowed.
      # Sort slots by start_sec ASC; tie-break by run_minutes ASC, then by created_at ASC of the
      # referenced zone (never by id). Walk adjacent pairs; reject on first conflict.
      reject with ERR_PROGRAM_SLOT_OVERLAP if any adjacent pair violates the buffer.
    input_set: "All slots in the program being activated."
    constants:
      VALVE_SWITCH_BUFFER_SEC: 120
    precision: "integer seconds"

  - name: route_capacity_check
    trigger: "POST /route-stops (before accepting a stop)"
    algorithm: threshold
    formula: |
      prospective_stops   = Route.stops_used + 1
      prospective_minutes = Route.minutes_committed + new_stop.window_minutes
      tech = Technician(Route.technician_id)
      shift_minutes = (tech.shift_end_sec - tech.shift_start_sec) // 60
      # capacity is breached when EITHER cap is exceeded:
      #   prospective_stops  > MAX_STOPS_PER_ROUTE            (boundary >, Rule 6a numeric metric)
      #   prospective_minutes > shift_minutes
      reject with ERR_ROUTE_CAPACITY_EXCEEDED if either holds.
    input_set: "Route.stops_used, Route.minutes_committed, the new stop's window_minutes, and the route technician's shift window."
    constants:
      MAX_STOPS_PER_ROUTE: 8
    precision: "integer minutes / integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in path / FK body field resolves to an existing row, validated left-to-right"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_TECHNICIAN_NOT_FOUND / ERR_PROPERTY_NOT_FOUND / ERR_SYSTEM_NOT_FOUND / ERR_ZONE_NOT_FOUND / ERR_PROGRAM_NOT_FOUND / ERR_QUOTE_NOT_FOUND / ERR_WORKORDER_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_ROUTE_NOT_FOUND / ERR_ROUTESTOP_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or FK body fields

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the targeted resource (Customer owns Property of the quote; Technician == assigned_technician_id of the work order)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "quote approve/reject/request-changes; work-order depart/arrive/complete/fail"

  - priority: 5
    category: state
    check: "Target resource in a valid state for this transition (quote_state / dispatch_status / completion_status / lifecycle_state / program_state / route_state / plan_state preconditions)"
    error_id: "ERR_QUOTE_NOT_DRAFT / ERR_QUOTE_NOT_SENT / ERR_QUOTE_NOT_REVISABLE / ERR_WORKORDER_NOT_PENDING / ERR_WORKORDER_ALREADY_SCHEDULED / ERR_WORKORDER_NOT_SCHEDULED / ERR_WORKORDER_NOT_EN_ROUTE / ERR_WORKORDER_NOT_ON_SITE / ERR_WORKORDER_NOT_IN_PROGRESS / ERR_WORKORDER_TERMINAL / ERR_SYSTEM_ALREADY_DECOMMISSIONED / ERR_PROGRAM_NOT_DRAFT / ERR_ROUTE_NOT_PLANNING / ERR_ROUTE_NOT_DISPATCHED / ERR_PLAN_NOT_ACTIVE / ERR_PLAN_NOT_PAUSED / ERR_PLAN_TERMINAL"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_route_version must equal Route.version when adding a stop"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /route-stops"

  - priority: 7
    category: business_safety
    check: "Backflow tester must be backflow_certified"
    error_id: ERR_TESTER_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /backflow-tests"

  - priority: 8
    category: business_referential
    check: "System must have a backflow device before a backflow test can be recorded"
    error_id: ERR_NO_BACKFLOW_DEVICE
    http_status: 409
    applies_to: "POST /backflow-tests"

  - priority: 9
    category: business_constraint
    check: "Cross-entity season gate: STARTUP work order may be scheduled only when system.season_state==WINTERIZED; controller program may activate only when system.season_state==ACTIVE"
    error_id: "ERR_SEASON_STATE_BLOCKS_STARTUP / ERR_SEASON_STATE_BLOCKS_PROGRAM"
    http_status: 409
    applies_to: "POST /route-stops (STARTUP work orders); POST /controller-programs/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "Controller program slots must be non-empty and non-overlapping (with VALVE_SWITCH_BUFFER_SEC gap); zone numbers unique among non-ARCHIVED zones of a system"
    error_id: "ERR_EMPTY_PROGRAM / ERR_PROGRAM_SLOT_OVERLAP / ERR_DUPLICATE_ZONE_NUMBER"
    http_status: 409
    applies_to: "POST /zones; POST /controller-programs/{id}/activate"

  - priority: 11
    category: business_temporal
    check: "A route stop's arrival window must not overlap another SCHEDULED stop's half-open window on the same route"
    error_id: ERR_ROUTESTOP_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /route-stops"

  - priority: 12
    category: business_constraint
    check: "Route stop count and committed minutes must stay within MAX_STOPS_PER_ROUTE and the technician's shift window"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /route-stops"

  - priority: 13
    category: business_constraint
    check: "A non-empty quote cannot be sent empty; line_items required to send"
    error_id: ERR_EMPTY_QUOTE
    http_status: 422
    applies_to: "POST /service-quotes/{id}/send"

  - priority: 14
    category: business_constraint
    check: "A route with zero SCHEDULED stops cannot be dispatched"
    error_id: ERR_EMPTY_ROUTE
    http_status: 409
    applies_to: "POST /routes/{id}/dispatch"

  - priority: 99
    category: business_constraint
    check: "Generic field-level request validation (missing required body field, wrong type, enum out of range, negative quantity, end<=start time)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Customer ----------
  - method: POST
    path: "/customers"
    description: "Create a customer account"
    roles: [Dispatcher]
    code: 201
    input: [company_name, contact_email, billing_zip]
    output: Customer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer account"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED"]

  # ---------- Technician ----------
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [Dispatcher]
    code: 201
    input: [full_name, shift_start_sec, shift_end_sec, "backflow_certified?"]
    output: Technician
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/technicians/{id}"
    description: "Get a technician"
    roles: [Dispatcher, Technician, BackflowTester]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: GET
    path: "/technicians"
    description: "List technicians (filterable by certification)"
    roles: [Dispatcher]
    code: 200
    input: ["backflow_certified?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # ---------- Property ----------
  - method: POST
    path: "/properties"
    description: "Create a property under a customer"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, site_address, lat, lng]
    output: Property
    side_effects: ["status=ACTIVE, compliance_status=NON_COMPLIANT"]

  - method: GET
    path: "/properties/{id}"
    description: "Get a property (includes computed compliance_status)"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties; filter by customer_id"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # ---------- IrrigationSystem ----------
  - method: POST
    path: "/irrigation-systems"
    description: "Register an irrigation system on a property"
    roles: [Dispatcher]
    code: 201
    input: [property_id, controller_model, static_psi, "has_backflow_device?"]
    output: IrrigationSystem
    side_effects: ["season_state=DORMANT, backflow_status=UNTESTED, lifecycle_state=OPERATIONAL, zone_count=0, committed_cost_cents=0"]

  - method: GET
    path: "/irrigation-systems/{id}"
    description: "Get a system (computed counts, costs, risks)"
    roles: [Dispatcher, Customer, Technician]
    code: 200
    input: []
    output: IrrigationSystem
    side_effects: []

  - method: GET
    path: "/irrigation-systems"
    description: "List systems; filter by property_id"
    roles: [Dispatcher, Customer, Technician]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: IrrigationSystem[]
    side_effects: []

  - method: GET
    path: "/irrigation-systems/{id}/blowout-quote"
    description: "Compute the winterization (blowout) price preview for a system"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: "{ system_id: string, zone_count: integer, blowout_price_cents: integer }"
    side_effects: []

  - method: POST
    path: "/irrigation-systems/{id}/decommission"
    description: "Decommission a system (cascades to zones, programs, work orders)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: IrrigationSystem
    side_effects: ["lifecycle_state → DECOMMISSIONED + depth-3 cascade per §1.2"]

  # ---------- Zone ----------
  - method: POST
    path: "/zones"
    description: "Add a zone to a system (inventory & map)"
    roles: [Dispatcher, Technician]
    code: 201
    input: [system_id, zone_number, plant_type, head_count, gpm_per_head]
    output: Zone
    side_effects: ["zone_state=MAPPED"]

  - method: GET
    path: "/zones/{id}"
    description: "Get a zone"
    roles: [Dispatcher, Customer, Technician]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: GET
    path: "/zones"
    description: "List zones; filter by system_id"
    roles: [Dispatcher, Customer, Technician]
    code: 200
    input: ["system_id?", "limit?", "offset?"]
    output: Zone[]
    side_effects: []

  # ---------- ControllerProgram ----------
  - method: POST
    path: "/controller-programs"
    description: "Create a controller program (draft schedule) for a system"
    roles: [Dispatcher, Technician]
    code: 201
    input: [system_id, slots]
    output: ControllerProgram
    side_effects: ["program_state=DRAFT, total_run_minutes computed"]

  - method: GET
    path: "/controller-programs/{id}"
    description: "Get a controller program"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: ControllerProgram
    side_effects: []

  - method: GET
    path: "/controller-programs"
    description: "List controller programs; filter by system_id"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["system_id?", "limit?", "offset?"]
    output: ControllerProgram[]
    side_effects: []

  - method: POST
    path: "/controller-programs/{id}/activate"
    description: "Activate a draft program (validates overlap, season, zones)"
    roles: [Technician]
    code: 200
    input: []
    output: ControllerProgram
    side_effects: ["program_state → ACTIVE; referenced MAPPED zones → ACTIVE; system.zone_count recomputed"]

  # ---------- ServiceQuote ----------
  - method: POST
    path: "/service-quotes"
    description: "Create a draft install/repair quote"
    roles: [Dispatcher]
    code: 201
    input: [property_id, quote_type, line_items]
    output: ServiceQuote
    side_effects: ["quote_state=DRAFT"]

  - method: GET
    path: "/service-quotes/{id}"
    description: "Get a quote (estimated & final totals)"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: []

  - method: GET
    path: "/service-quotes"
    description: "List quotes; filter by property_id or linked_work_order_id"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["property_id?", "linked_work_order_id?", "limit?", "offset?"]
    output: ServiceQuote[]
    side_effects: []

  - method: POST
    path: "/service-quotes/{id}/send"
    description: "Send a quote to the customer (DRAFT → SENT)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["estimated_total_cents recomputed; quote_state → SENT"]

  - method: PATCH
    path: "/service-quotes/{id}/line-items"
    description: "Revise line items after change request (CHANGES_REQUESTED → DRAFT)"
    roles: [Dispatcher]
    code: 200
    input: [line_items]
    output: ServiceQuote
    side_effects: ["line_items replaced; estimated_total_cents recomputed; quote_state → DRAFT"]

  - method: POST
    path: "/service-quotes/{id}/request-changes"
    description: "Customer requests changes (SENT → CHANGES_REQUESTED)"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["quote_state → CHANGES_REQUESTED"]

  - method: POST
    path: "/service-quotes/{id}/approve"
    description: "Customer approves a quote (SENT → APPROVED); spawns a WorkOrder"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["quote_state → APPROVED; spawns WorkOrder; linked_work_order_id set; system.committed_cost_cents debited"]

  - method: POST
    path: "/service-quotes/{id}/reject"
    description: "Customer rejects a quote (SENT → REJECTED)"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["quote_state → REJECTED"]

  # ---------- WorkOrder ----------
  - method: POST
    path: "/work-orders"
    description: "Create a work order directly (startup/winterization/leak/head/install/backflow scheduling)"
    roles: [Dispatcher]
    code: 201
    input: [system_id, job_type, estimated_minutes, estimated_cost_cents]
    output: WorkOrder
    side_effects: ["dispatch_status=UNSCHEDULED, completion_status=PENDING; system.committed_cost_cents debited by estimated_cost_cents"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order (both status dimensions)"
    roles: [Dispatcher, Customer, Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders; filter by system_id, assigned_technician_id, or origin_quote_id"
    roles: [Dispatcher, Customer, Technician]
    code: 200
    input: ["system_id?", "assigned_technician_id?", "origin_quote_id?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/depart"
    description: "Technician departs for the job (SCHEDULED → EN_ROUTE)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["dispatch_status → EN_ROUTE"]

  - method: POST
    path: "/work-orders/{id}/arrive"
    description: "Technician arrives on site (EN_ROUTE → ON_SITE); work begins"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["dispatch_status → ON_SITE; completion_status PENDING → IN_PROGRESS"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete the job; record actuals"
    roles: [Technician]
    code: 200
    input: [actual_labor_cents, actual_parts_cents]
    output: WorkOrder
    side_effects: ["completion_status → COMPLETED; committed_cost credited; quote final total / season_state / assessed_winter_risk recomputed per §1.2"]

  - method: POST
    path: "/work-orders/{id}/fail"
    description: "Mark the job failed (IN_PROGRESS → FAILED)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["completion_status → FAILED; committed_cost credited"]

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-terminal work order"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["completion_status → CANCELLED; committed_cost credited; SCHEDULED RouteStops → REMOVED"]

  # ---------- MaintenancePlan ----------
  - method: POST
    path: "/maintenance-plans"
    description: "Create a recurring maintenance plan"
    roles: [Dispatcher]
    code: 201
    input: [property_id, tier, visits_per_year]
    output: MaintenancePlan
    side_effects: ["plan_state=ACTIVE; annual_dues_cents computed"]

  - method: GET
    path: "/maintenance-plans/{id}"
    description: "Get a maintenance plan"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: []

  - method: GET
    path: "/maintenance-plans"
    description: "List maintenance plans; filter by property_id"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: MaintenancePlan[]
    side_effects: []

  - method: POST
    path: "/maintenance-plans/{id}/pause"
    description: "Pause a plan (ACTIVE → PAUSED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: ["plan_state → PAUSED"]

  - method: POST
    path: "/maintenance-plans/{id}/resume"
    description: "Resume a plan (PAUSED → ACTIVE)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: ["plan_state → ACTIVE"]

  - method: POST
    path: "/maintenance-plans/{id}/cancel"
    description: "Cancel a plan"
    roles: [Dispatcher]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: ["plan_state → CANCELLED"]

  # ---------- BackflowTest ----------
  - method: POST
    path: "/backflow-tests"
    description: "Record a backflow test; computes PASS/FAIL and certifies the system"
    roles: [BackflowTester]
    code: 201
    input: [system_id, tester_technician_id, relief_open_psi, checkvalve_hold_psi]
    output: BackflowTest
    side_effects: ["result computed; system.backflow_status → CERTIFIED|FAILED; property.compliance_status recomputed"]

  - method: GET
    path: "/backflow-tests/{id}"
    description: "Get a backflow test"
    roles: [Dispatcher, Customer, BackflowTester]
    code: 200
    input: []
    output: BackflowTest
    side_effects: []

  - method: GET
    path: "/backflow-tests"
    description: "List backflow tests; filter by system_id or tester_technician_id"
    roles: [Dispatcher, Customer, BackflowTester]
    code: 200
    input: ["system_id?", "tester_technician_id?", "limit?", "offset?"]
    output: BackflowTest[]
    side_effects: []

  # ---------- Route ----------
  - method: POST
    path: "/routes"
    description: "Create a daily route for a technician"
    roles: [Dispatcher]
    code: 201
    input: [technician_id, route_date]
    output: Route
    side_effects: ["route_state=PLANNING, stops_used=0, minutes_committed=0"]

  - method: GET
    path: "/routes/{id}"
    description: "Get a route (computed stop count and minutes)"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: GET
    path: "/routes"
    description: "List routes; filter by technician_id"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["technician_id?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Dispatch a route (PLANNING → DISPATCHED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["route_state → DISPATCHED"]

  - method: POST
    path: "/routes/{id}/close"
    description: "Close a route (DISPATCHED → CLOSED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["route_state → CLOSED"]

  # ---------- RouteStop ----------
  - method: POST
    path: "/route-stops"
    description: "Schedule a work order onto a route (OCC-guarded by expected_route_version)"
    roles: [Dispatcher]
    code: 201
    input: [route_id, work_order_id, arrival_start_sec, window_minutes, expected_route_version]
    output: RouteStop
    side_effects:
      - "stop_state=SCHEDULED; WorkOrder.dispatch_status UNSCHEDULED → SCHEDULED; WorkOrder.assigned_technician_id set"
      - "Route.stops_used / Route.minutes_committed recomputed; increments Route.version by 1"

  - method: GET
    path: "/route-stops/{id}"
    description: "Get a route stop"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: GET
    path: "/route-stops"
    description: "List route stops; filter by route_id or work_order_id"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["route_id?", "work_order_id?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed user is not the owner of the targeted resource" }
  # --- existence ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not resolve" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not resolve" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not resolve" }
  - { id: ERR_SYSTEM_NOT_FOUND, http: 404, condition: "IrrigationSystem id does not resolve" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "Zone id does not resolve" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "ControllerProgram id does not resolve" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "ServiceQuote id does not resolve" }
  - { id: ERR_WORKORDER_NOT_FOUND, http: 404, condition: "WorkOrder id does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "MaintenancePlan id does not resolve" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id does not resolve" }
  - { id: ERR_ROUTESTOP_NOT_FOUND, http: 404, condition: "RouteStop id does not resolve" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, wrong type, enum out of range, negative quantity, or end<=start time" }
  # --- quote state ---
  - { id: ERR_QUOTE_NOT_DRAFT, http: 409, condition: "send requires quote_state==DRAFT" }
  - { id: ERR_QUOTE_NOT_SENT, http: 409, condition: "approve/reject/request-changes requires quote_state==SENT" }
  - { id: ERR_QUOTE_NOT_REVISABLE, http: 409, condition: "line-item revision requires quote_state==CHANGES_REQUESTED" }
  - { id: ERR_EMPTY_QUOTE, http: 422, condition: "Cannot send a quote with empty line_items" }
  - { id: ERR_PROPERTY_INACTIVE, http: 409, condition: "Quote approve requires Property.status==ACTIVE" }
  # --- work order state ---
  - { id: ERR_WORKORDER_NOT_PENDING, http: 409, condition: "Scheduling requires completion_status==PENDING" }
  - { id: ERR_WORKORDER_ALREADY_SCHEDULED, http: 409, condition: "Scheduling requires dispatch_status==UNSCHEDULED" }
  - { id: ERR_WORKORDER_NOT_SCHEDULED, http: 409, condition: "depart requires dispatch_status==SCHEDULED" }
  - { id: ERR_WORKORDER_NOT_EN_ROUTE, http: 409, condition: "arrive requires dispatch_status==EN_ROUTE" }
  - { id: ERR_WORKORDER_NOT_ON_SITE, http: 409, condition: "complete requires dispatch_status==ON_SITE" }
  - { id: ERR_WORKORDER_NOT_IN_PROGRESS, http: 409, condition: "complete/fail requires completion_status==IN_PROGRESS" }
  - { id: ERR_WORKORDER_TERMINAL, http: 409, condition: "cancel requires non-terminal completion_status" }
  - { id: ERR_SEASON_STATE_BLOCKS_STARTUP, http: 409, condition: "STARTUP work order requires system.season_state==WINTERIZED to schedule" }
  # --- system / program ---
  - { id: ERR_SYSTEM_ALREADY_DECOMMISSIONED, http: 409, condition: "decommission requires lifecycle_state==OPERATIONAL" }
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "activate requires program_state==DRAFT" }
  - { id: ERR_EMPTY_PROGRAM, http: 409, condition: "activate requires at least one slot" }
  - { id: ERR_PROGRAM_SLOT_OVERLAP, http: 409, condition: "Two program slots overlap within VALVE_SWITCH_BUFFER_SEC" }
  - { id: ERR_SEASON_STATE_BLOCKS_PROGRAM, http: 409, condition: "activate requires system.season_state==ACTIVE" }
  - { id: ERR_DUPLICATE_ZONE_NUMBER, http: 409, condition: "zone_number already used among non-ARCHIVED zones of the system" }
  # --- backflow ---
  - { id: ERR_TESTER_NOT_CERTIFIED, http: 403, condition: "tester_technician is not backflow_certified" }
  - { id: ERR_NO_BACKFLOW_DEVICE, http: 409, condition: "System has no backflow device to test" }
  # --- route / scheduling ---
  - { id: ERR_ROUTE_NOT_PLANNING, http: 409, condition: "Adding a stop / dispatch requires route_state==PLANNING" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "close requires route_state==DISPATCHED" }
  - { id: ERR_EMPTY_ROUTE, http: 409, condition: "dispatch requires stops_used>=1" }
  - { id: ERR_ROUTESTOP_TIME_OVERLAP, http: 409, condition: "Stop window overlaps another SCHEDULED stop on the same route" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "Stop count > MAX_STOPS_PER_ROUTE or minutes > technician shift window" }
  - { id: ERR_STALE_ROUTE_VERSION, http: 412, condition: "expected_route_version != Route.version (OCC)" }
  # --- plan ---
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "pause requires plan_state==ACTIVE" }
  - { id: ERR_PLAN_NOT_PAUSED, http: 409, condition: "resume requires plan_state==PAUSED" }
  - { id: ERR_PLAN_TERMINAL, http: 409, condition: "cancel requires plan_state != CANCELLED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Back-office operator: manages customers, properties, system/zone inventory, quotes, work orders, plans, routes, and route scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers, POST /customers/{id}/suspend"
      - "POST /technicians"
      - "POST /properties"
      - "POST /irrigation-systems, POST /irrigation-systems/{id}/decommission"
      - "POST /service-quotes, POST /service-quotes/{id}/send, PATCH /service-quotes/{id}/line-items"
      - "POST /work-orders, POST /work-orders/{id}/cancel"
      - "POST /maintenance-plans + pause/resume/cancel"
      - "POST /routes, POST /routes/{id}/dispatch, POST /routes/{id}/close"
      - "POST /route-stops"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /zones, POST /controller-programs (shared with Technician)"

  - name: Technician
    description: "Field worker: maps zones, drafts/activates controller programs, and executes work orders assigned to them."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /controller-programs/{id}/activate"
      - "POST /work-orders/{id}/depart, /arrive, /complete, /fail (only for own assigned work orders)"
    shared_operations:
      - "POST /zones, POST /controller-programs (shared with Dispatcher)"
      - "GET on systems, zones, programs, work-orders, routes, route-stops, technicians"

  - name: Customer
    description: "Account holder: reviews and approves/rejects/requests-changes on quotes for properties they own; reads their own properties, systems, plans, quotes, tests."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /service-quotes/{id}/approve, /reject, /request-changes (only for quotes on owned properties)"
    shared_operations:
      - "GET on owned customers, properties, systems, zones, quotes, plans, work-orders, backflow-tests"

  - name: BackflowTester
    description: "Certified backflow inspector (a Technician acting in inspection capacity): records backflow tests."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /backflow-tests"
    shared_operations:
      - "GET on technicians, backflow-tests"
