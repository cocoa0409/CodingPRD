- section: rbac
  instances:
  - name: auditor_cannot_create_contract_forbidden
    claim_type: role_denial
    grounds:
    - roles
    - errors[ERR_ROLE_FORBIDDEN]
    distinguishing_aspect: Auditor invoking POST /contracts (ContractAdmin exclusive) is rejected with ERR_ROLE_FORBIDDEN (403).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /contracts
        payload:
          contract_number: C-RBAC-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: Auditor
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ROLE_FORBIDDEN (403)
  - name: seat_admin_cannot_approve_renewal_forbidden
    claim_type: role_denial
    grounds:
    - roles
    - errors[ERR_ROLE_FORBIDDEN]
    distinguishing_aspect: SeatAdmin invoking POST /renewal-events/{id}/approve (Auditor exclusive) is rejected with ERR_ROLE_FORBIDDEN.
    test_recipe:
      setup:
      - ACTIVE PRO contract with a PROPOSED RENEWAL event
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-RBAC-2
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: GET /contracts/${cid}
        as: ContractAdmin
        captures:
          cv: $.data.version
      - call: POST /contracts/${cid}/renewal-events
        payload:
          event_kind: RENEWAL
          expected_contract_version: ${cv}
        as: Auditor
        captures:
          ev: $.data.id
      trigger:
      - call: POST /renewal-events/${ev}/approve
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ROLE_FORBIDDEN (403)
  - name: ats_service_cannot_record_spend_forbidden
    claim_type: role_denial
    grounds:
    - roles
    - errors[ERR_ROLE_FORBIDDEN]
    distinguishing_aspect: AtsService invoking POST /contracts/{cid}/job-postings/{id}/record-spend (SeatAdmin exclusive) is rejected with ERR_ROLE_FORBIDDEN before any posting state is checked.
    test_recipe:
      setup:
      - ACTIVE PRO contract with assigned seat and one DRAFT posting
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-RBAC-3
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: rbac3@x.com
          full_name: RB Three
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/job-postings
        payload:
          title: RBACJob
          budget_cents: 5000
          daily_cap_cents: 1000
          pacing_mode: EVEN
          start_at: '2026-09-01T00:00:00Z'
          end_at: '2026-09-05T00:00:00Z'
          created_by_seat_id: ${s1}
        as: SeatAdmin
        captures:
          jp: $.data.id
      trigger:
      - call: POST /contracts/${cid}/job-postings/${jp}/record-spend
        payload:
          amount_cents: 100
        as: AtsService
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ROLE_FORBIDDEN (403)
  - name: recruiter_user_identity_ownership_enforced
    claim_type: role_ownership
    grounds:
    - roles
    - entities.Recruiter.fields.active_seat_id
    distinguishing_aspect: 'RecruiterUser may only send from the seat they hold: X-User-ID != the seat''s assigned_recruiter_id is rejected with ERR_ROLE_FORBIDDEN.'
    test_recipe:
      setup:
      - ACTIVE PRO contract with seats_purchased=2; seat S1 assigned to R1; R2 active but seatless; OPEN project owned by S1; PUBLIC candidate
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-RBAC-4
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 2
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: rbac4a@x.com
          full_name: RB 4a
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: POST /recruiters
        payload:
          email: rbac4b@x.com
          full_name: RB 4b
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r2: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/projects
        payload:
          name: RB4P
          owner_seat_id: ${s1}
        as: SeatAdmin
        captures:
          p1: $.data.id
      - call: POST /projects/${p1}/open
        as: SeatAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: rbac4-c
          full_name: C
          headline: h
          privacy_setting: PUBLIC
          open_to_work: false
          open_to_work_visibility: NONE
          years_experience: 1
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      trigger:
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: b
        as: RecruiterUser
        as_user_id: ${r2}
        captures:
          err: $.data.error_id
      assert:
      - "error_id == ERR_ROLE_FORBIDDEN (R2 does not hold seat S1 \u2014 seat non-sharing enforced at the identity level)"
- section: cross_cutting_layers
  instances:
  - name: seat_assign_stale_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[seat-assign-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Assign with expected_seat_version captured before an intervening assign+unassign cycle is rejected with ERR_STALE_VERSION (412) even though the seat is UNASSIGNED again.
    test_recipe:
      setup:
      - ACTIVE PRO contract, seat S version observed at 1; R1 assigned then unassigned (version now 3); R2 seatless
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-OCC-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: occ1a@x.com
          full_name: OCC 1a
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: POST /recruiters
        payload:
          email: occ1b@x.com
          full_name: OCC 1b
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r2: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/seats/${s1}/unassign
        as: SeatAdmin
      trigger:
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r2}
          expected_seat_version: ${s1v}
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - 'error_id == ERR_STALE_VERSION (412): seat version advanced 1 -> 3 during the assign/unassign cycle, so the captured version is stale'
  - name: renewal_event_stale_contract_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[renewal-event-stale-contract-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Creating a second RenewalEvent with the contract version captured before the first RenewalEvent was created is rejected with ERR_STALE_VERSION (412).
    test_recipe:
      setup:
      - ACTIVE PRO contract at version V; one RenewalEvent created at version V (bumps contract version to V+1)
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-OCC-2
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: GET /contracts/${cid}
        as: ContractAdmin
        captures:
          cv: $.data.version
      - call: POST /contracts/${cid}/renewal-events
        payload:
          event_kind: RENEWAL
          expected_contract_version: ${cv}
        as: Auditor
      trigger:
      - call: POST /contracts/${cid}/renewal-events
        payload:
          event_kind: RENEWAL
          expected_contract_version: ${cv}
        as: Auditor
        captures:
          err: $.data.error_id
      assert:
      - 'error_id == ERR_STALE_VERSION (412): the first RenewalEvent creation bumped the contract version, so the replayed version is stale'
  - name: throttled_pool_reopens_on_positive_response
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.spam_strike_scoring
    - state_machines.MessageCreditPool
    distinguishing_aspect: A RESPONDED response on a SENT message decrements spam_strike_count by 1 (floor 0); when the count drops below 3 the THROTTLED pool reopens to OPEN.
    test_recipe:
      setup:
      - ACTIVE PRO contract, assigned seat, OPEN project, PUBLIC candidate; pool THROTTLED at exactly 3 strikes (one NEGATIVE_RESPONSE + one REPORTED_AS_SPAM on two earlier messages); a third SENT message
        still AWAITING
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-CCL-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: ccl1@x.com
          full_name: CCL One
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/projects
        payload:
          name: CCLP
          owner_seat_id: ${s1}
        as: SeatAdmin
        captures:
          p1: $.data.id
      - call: POST /projects/${p1}/open
        as: SeatAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: ccl1-c
          full_name: C
          headline: h
          privacy_setting: PUBLIC
          open_to_work: false
          open_to_work_visibility: NONE
          years_experience: 1
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: m1
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          m1: $.data.id
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: m2
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          m2: $.data.id
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: m3
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          m3: $.data.id
      - call: POST /messages/${m1}/record-response
        payload:
          response_kind: NEGATIVE_RESPONSE
        as: AtsService
      - call: POST /messages/${m2}/record-response
        payload:
          response_kind: REPORTED_AS_SPAM
        as: AtsService
      - call: GET /seats/${s1}/credit-pools
        as: Auditor
        captures:
          pre_strikes: $.data.0.spam_strike_count
          pre_status: $.data.0.pool_status
      trigger:
      - call: POST /messages/${m3}/record-response
        payload:
          response_kind: RESPONDED
        as: AtsService
      - call: GET /seats/${s1}/credit-pools
        as: Auditor
        captures:
          post_strikes: $.data.0.spam_strike_count
          post_status: $.data.0.pool_status
      assert:
      - 'pre: spam_strike_count == 3 and pool_status == THROTTLED'
      - 'post: spam_strike_count == 2 and pool_status == OPEN (positive response cancelled one strike)'
