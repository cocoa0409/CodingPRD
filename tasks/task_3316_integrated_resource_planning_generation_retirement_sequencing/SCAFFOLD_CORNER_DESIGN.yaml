              as: UtilityPlanner
              captures: { c1: $.data.id }
            - call: "POST /plans/${plan_id}/procurement-commitments"
              payload: { candidate_id: "${cand_id}", committed_mw: 50, solicitation_type: "RFP", condition_discharge_ids: ["${cond_id}"] }
              as: UtilityPlanner
              captures: { c2: $.data.id }
