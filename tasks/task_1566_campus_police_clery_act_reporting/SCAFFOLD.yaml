  - { method: GET, path: "/program-reviews/{id}", description: "Get one program review", roles: [SystemAdmin, CleryCoordinator, PoliceChief, FederalReviewer], code: 200, input: [], output: ProgramReview, side_effects: [] }
  - { method: POST, path: "/program-reviews/{id}/advance", description: "Advance review one stage; gates enforced per state machine", roles: [FederalReviewer], code: 200, input: [], output: ProgramReview, side_effects: ["penalty_score recomputed at UNDER_VERIFICATION"] }
  - { method: POST, path: "/program-reviews/{id}/return-for-correction", description: "UNDER_VERIFICATION -> CORRECTIVE_ACTION loop-back", roles: [FederalReviewer], code: 200, input: ["note?"], output: ProgramReview, side_effects: [] }
  - { method: POST, path: "/program-reviews/{id}/corrective-actions", description: "Add a corrective action; allowed in FINDINGS_ISSUED and CORRECTIVE_ACTION", roles: [FederalReviewer], code: 201, input: [finding_code, severity, description, due_date], output: CorrectiveAction, side_effects: ["review open_action_count += 1; weight and penalty_score recomputed"] }
  - { method: GET, path: "/program-reviews/{id}/corrective-actions", description: "List corrective actions of a review", roles: [SystemAdmin, CleryCoordinator, PoliceChief, FederalReviewer], code: 200, input: [], output: "CorrectiveAction[]", side_effects: [] }
  - { method: POST, path: "/corrective-actions/{id}/submit", description: "Submit remediation evidence (requires review in CORRECTIVE_ACTION)", roles: [CleryCoordinator], code: 200, input: [resolution_summary], output: CorrectiveAction, side_effects: [] }
  - { method: POST, path: "/corrective-actions/{id}/verify", description: "Verify a submitted action; last verification auto-advances the review", roles: [FederalReviewer], code: 200, input: [], output: CorrectiveAction, side_effects: ["open_action_count -= 1; auto-advance cascade"] }
  - { method: POST, path: "/corrective-actions/{id}/reject", description: "Reject a submitted action back to OPEN", roles: [FederalReviewer], code: 200, input: [verification_note], output: CorrectiveAction, side_effects: ["rejection_count += 1"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed type" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or CSA acting on another CSA's referral" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body foreign key (geography_id, referral_id) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from current state" }
  - { id: ERR_INCIDENT_TERMINAL, http: 409, condition: "Incident action attempted from UNFOUNDED or WITHDRAWN" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version (OCC)" }
  - { id: ERR_VALIDATION_FAILED, http: 422, condition: "Enum/range/date-order field constraint violated" }
  - { id: ERR_UNFOUNDED_JUSTIFICATION_REQUIRED, http: 422, condition: "unfound called with empty justification" }
  - { id: ERR_CSA_NOT_CERTIFIED, http: 422, condition: "Referral from CSA not in ACTIVE status" }
  - { id: ERR_CLASSIFICATION_INCOMPLETE, http: 422, condition: "classify with empty offense_counts or only NON_CLERY offenses" }
  - { id: ERR_REPORT_LOCKED, http: 409, condition: "Reclassification blocked because the year's ASR is PUBLISHED or REPUBLISHED" }
  - { id: ERR_ALERT_WINDOW_EXPIRED, http: 422, condition: "Reopen attempted more than 72h after closed_at" }
  - { id: ERR_DUPLICATE_REPORT_YEAR, http: 409, condition: "ASR or fire safety report already exists for report_year" }
  - { id: ERR_REVIEW_SCOPE_OVERLAP, http: 409, condition: "Program review closed year-interval overlaps a non-CLOSED review (shared boundary year counts)" }
  - { id: ERR_TRAINING_WINDOW_OVERLAP, http: 409, condition: "New passing training record's half-open validity window overlaps an existing record of the same CSA" }
  - { id: ERR_DUPLICATE_ACTIVE_ALERT, http: 409, condition: "Incident already has a SafetyAlert in a non-CLOSED status" }
  - { id: ERR_GEOGRAPHY_RETIRED, http: 422, condition: "Operation references a RETIRED geography" }
  - { id: ERR_GEOGRAPHY_IN_USE, http: 409, condition: "Retire blocked: geography referenced by non-terminal incident or fire incident" }
  - { id: ERR_RESIDENTIAL_FACILITY_REQUIRED, http: 422, condition: "Fire incident geography is not a residential facility" }
  - { id: ERR_NO_DISTRIBUTION_CHANNELS, http: 422, condition: "disseminate with empty distribution_channels" }
  - { id: ERR_FINAL_COMPILE_REQUIRED, http: 422, condition: "submit-review before any FINAL compile" }
  - { id: ERR_RECOMPILE_REQUIRED, http: 422, condition: "republish without a compile newer than amendment_started_at" }
  - { id: ERR_UNRESOLVED_ACTIONS, http: 422, condition: "Program review advance blocked by missing actions or open_action_count > 0" }
  - { id: ERR_ENTRY_NOT_PUBLIC, http: 403, condition: "Anonymous access to a non-public crime log entry" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Campus police system administrator; owns configuration entities (geographies, CSAs, report shells) and the logical clock"
    identity: opaque
    exclusive_operations: [geography create/update, CSA register/deactivate, training record entry, ASR/fire-report creation, clock control]
    shared_operations: [read access to all entities]
  - name: CleryCoordinator
    description: "Compliance coordinator; classifies incidents, decides alerts, compiles and amends reports, fulfills inspection requests, submits corrective actions"
    identity: opaque
    exclusive_operations: [incident begin-classification/classify/begin-reclassification/withdraw, alert create/decide/close/reopen, ASR compile/submit-review/begin-amendment, fire-report compile, inspection fulfill, corrective-action submit, referral mark-duplicate]
    shared_operations: [incident create, read access]
  - name: PoliceChief
    description: "Chief of campus police; unfounds incidents, authorizes and disseminates alerts, sets log dispositions, publishes reports, finalizes fire incidents"
    identity: opaque
    exclusive_operations: [incident unfound, alert authorize/disseminate, log disposition PATCH, ASR publish/republish, fire-report publish, fire-incident finalize/begin-adjustment]
    shared_operations: [incident create, read access]
  - name: CampusSecurityAuthority
    description: "Trained campus security authority filing referral reports"
    identity: entity_backed:CampusSecurityAuthority
    exclusive_operations: [referral create, referral forward (own only)]
    shared_operations: [read own CSA record and own referrals]
  - name: FederalReviewer
    description: "Department of Education program reviewer"
    identity: opaque
    exclusive_operations: [program review create/advance/return-for-correction, corrective-action create/verify/reject]
    shared_operations: [read access to incidents, reports, log]
  - name: Anonymous
    description: "Unauthenticated-equivalent public role for crime log transparency (still sends X-User-Role: Anonymous)"
    identity: opaque
    exclusive_operations: [crime log public read, inspection request create]
    shared_operations: []
