          - validations[priority=13]
          - entities.RouteStop.fields.window_start_at
          - entities.CourierRoute.fields.buffer_minutes
          - errors[ERR_ROUTE_WINDOW_CONFLICT]
        distinguishing_aspect: >-
          CourierRoute stops use buffered closed intervals: a window expanded by buffer_minutes (30) on both sides must
          not overlap any existing stop. A stop at [13:40,14:00) is rejected against [13:00,13:20) because the 20-min
          gap is under the 30-min buffer, even though the raw windows do not touch — different interval geometry
          (buffer-expanded closed) than the half-open milling rule, and a different resource entity.
        test_recipe:
          setup:
            - "A CourierRoute with buffer_minutes=30, max_stops=5, holding one stop at [2026-01-01T13:00:00Z, 13:20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr O", practice_name: "P", email: "dvo@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /courier-routes"
              payload: { label: "R5", service_date: "2026-01-01T00:00:00Z", max_stops: 5, buffer_minutes: 30 }
              as: Scheduler
              captures: { route_id: "$.data.id"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "RX_PAPER" }
              as: LabTech
              captures: { case_a: "$.data.id"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "RX_PAPER" }
              as: LabTech
              captures: { case_b: "$.data.id"}
            - call: "POST /route-stops"
              payload: { courier_route_id: "${route_id}", case_id: "${case_a}", window_start_at: "2026-01-01T13:00:00Z", window_minutes: 20 }
              as: Scheduler
              captures: { stop1: "$.data.id"}
          trigger:
            - call: "POST /route-stops"
              payload: { courier_route_id: "${route_id}", case_id: "${case_b}", window_start_at: "2026-01-01T13:40:00Z", window_minutes: 20 }
              as: Scheduler
              captures: { err: "$.data.error_id"}
          assert:
            - "Response error_id == ERR_ROUTE_WINDOW_CONFLICT (gap 20min < 30min buffer)"
            - "A stop at [2026-01-01T13:55:00Z, +20m) (gap 35min >= 30) on the same route would succeed"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: remake_conserves_billable_unit_count_and_subtotal
        grounds:
          - state_machines.FabricationUnit.PASSED_to_REMADE_OUT
          - entities.FabricationUnit.fields.is_billable
          - entities.Case.fields.billable_unit_count
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: >-
          Approving a warranty remake spawns a replacement unit with is_billable=false; the forward action (REMADE_OUT
          + new unit) leaves Case.billable_unit_count and Invoice.subtotal_cents exactly unchanged. Conserved quantity:
          billable unit count / invoice subtotal (a fabrication count + money quantity).
        test_recipe:
          setup:
            - "A DELIVERED crown case with one PASSED billable unit, billable_unit_count=1, subtotal_cents=12000, and an OPEN RemakeRequest on that unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
