  # ===========================================================================
  # SECTION: errors  (claim-extraction-guide "From Table 6" - every error code
  # in the 1.6 catalog must be triggerable by at least one test)
  # ===========================================================================
  - section: errors
    instances:

      - name: request_missing_x_user_id_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
        distinguishing_aspect: "A GET on an existing holder sent WITHOUT the X-User-ID header returns 401 ERR_UNAUTHENTICATED, not the 404 the unknown-caller path might suggest and not a 200; priority 1 outranks every existence check."
        test_recipe:
          setup:
            - "One InteropProfile and one Holder exist."
            - "The trigger request carries X-User-Role: SystemAdmin but omits the X-User-ID header entirely."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
          trigger:
            - call: "GET /mdl/holders/${holder_id}"
              payload: {}
              as: SystemAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "GET /mdl/holders/${holder_id} sent with no X-User-ID header status == 401"
            - "response data.error_id == \"ERR_UNAUTHENTICATED\""

      - name: proofing_agent_creating_an_interop_profile_returns_forbidden
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority 2]
          - endpoints[POST /mdl/interop-profiles].roles
        distinguishing_aspect: "POST /mdl/interop-profiles lists SystemAdmin only, so a ProofingAgent sending a perfectly valid body gets 403 ERR_FORBIDDEN_ROLE and no profile row is created; priority 2 outranks the body-schema check at priority 3."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /mdl/interop-profiles status == 403"
            - "response data.error_id == \"ERR_FORBIDDEN_ROLE\""

      - name: holder_cannot_report_another_holders_handset_lost
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority 6]
          - roles[Holder].entity_backed
        distinguishing_aspect: "Holder A calling report-lost on Holder B's device gets 403 ERR_NOT_RESOURCE_OWNER at priority 6, before the priority-7 state rule can object that the handset is only REGISTERED; the device is left untouched at version 1."
        test_recipe:
          setup:
            - "One InteropProfile, two Holders, one REGISTERED device owned by holder B."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_a_id: "$.data.id" }
            - call: "POST /mdl/holders"
              payload: { legal_name: "Dmitri Vance", date_of_birth: "1985-02-02", address_line1: "9 Quarry Road", city: "Seward", state_code: "NE", postal_code: "68434", physical_credential_number: "NE-9930014", physical_credential_expires_on: "2029-11-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_b_id: "$.data.id" }
            - call: "POST /mdl/devices"
              payload: { holder_id: "${holder_b_id}", platform: "IOS", model_name: "iPhone 17", hardware_attestation_token: "att-tok-b1", protection_method: "PASSCODE" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { device_b_id: "$.data.id" }
          trigger:
            - call: "POST /mdl/devices/${device_b_id}/report-lost"
              payload: {}
              as: Holder
              as_user_id: "${holder_a_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /mdl/devices/${device_b_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "POST /mdl/devices/${device_b_id}/report-lost status == 403"
            - "response data.error_id == \"ERR_NOT_RESOURCE_OWNER\""
            - "GET /mdl/devices/${device_b_id} response data.state == \"REGISTERED\""
            - "GET /mdl/devices/${device_b_id} response data.version == 1"
            - "GET /mdl/devices/${device_b_id} response data.lost_reported_at == null"

      - name: every_remaining_path_scoped_not_found_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_INTEROP_PROFILE_NOT_FOUND]
          - errors[ERR_PROOFING_SESSION_NOT_FOUND]
          - errors[ERR_DEVICE_NOT_FOUND]
          - errors[ERR_CREDENTIAL_NOT_FOUND]
          - errors[ERR_UPDATE_ORDER_NOT_FOUND]
          - errors[ERR_UPDATE_DELIVERY_NOT_FOUND]
          - errors[ERR_READER_APP_NOT_FOUND]
          - errors[ERR_PRESENTATION_SESSION_NOT_FOUND]
        distinguishing_aspect: "Each of the eight remaining path-scoped 404 codes is raised by its own endpoint against an unknown id, and each returns the code named for ITS resource - an implementation with one generic ERR_NOT_FOUND, or one that returns 500 on an unknown update-delivery, fails."
