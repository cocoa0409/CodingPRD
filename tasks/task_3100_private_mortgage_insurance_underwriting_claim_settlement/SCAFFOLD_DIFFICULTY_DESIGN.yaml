              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "PERIOD-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
