        grounds:
          - validations[priority=80]
          - errors[ERR_OUTSIDE_MEASURING_PERIOD]
          - entities.CostLineItem.fields.in_measuring_period
          - entities.Project.fields.measuring_period_end_date
        distinguishing_aspect: |
          A different metric (calendar-date interval endpoint, not a cents threshold)
          reached through a different endpoint (POST /cost-line-items, not
          PATCH /projects/{id}): 2028-09-01 — the computed measuring_period_end_date —
          is excluded because the window is half-open, while 2028-08-31 is included.
        test_recipe:
          setup:
            - "A project with measuring_period_start_date 2026-09-01 and measuring_period_months 24, so measuring_period_end_date == 2028-09-01."
            - "Clock advanced to 2028-10-01T00:00:00Z so both candidate dates are in the past."
