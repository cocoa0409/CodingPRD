  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: print_pricing_tier_plate_reprint_interaction
        grounds:
          - calculations.print_volume_pricing
          - entities.PrintOrder.fields.unit_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: tiered unit rate
          x plate-fee waiver x reprint discount. 19999 units cost MORE in total
          than 20000 units (tier cliff + plate waiver), and a 6000-unit reprint
          reprices the unit to round_half_up(185 x 0.9) = 167 with no plate fee.
        test_recipe:
          setup:
            - "Clock 2026-09-01. INFANT title available 2026-01..2027-12. Three INFANT selections for 2026-11, 2026-12, 2027-01, each proposed by acm-ada and approved by acm-ben."
          setup_api_calls:
            - *c_sep
            - *t_inf
            - call: "POST /library/selections"
              payload: { mailing_month: "2026-11", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_a: $.data.id }
            - call: "POST /library/selections/${sel_a}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/selections"
              payload: { mailing_month: "2026-12", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_b: $.data.id }
            - call: "POST /library/selections/${sel_b}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/selections"
              payload: { mailing_month: "2027-01", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_c: $.data.id }
            - call: "POST /library/selections/${sel_c}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_a}", quantity: 19999, is_reprint: false }
              as: PublisherOps
              captures: { po_a: $.data.id }
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_b}", quantity: 20000, is_reprint: false }
              as: PublisherOps
              captures: { po_b: $.data.id }
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_c}", quantity: 6000, is_reprint: true }
              as: PublisherOps
              captures: { po_c: $.data.id }
          trigger:
            - call: "POST /library/print-orders/${po_a}/confirm"
              payload: {}
              as: PublisherOps
            - call: "POST /library/print-orders/${po_b}/confirm"
              payload: {}
              as: PublisherOps
            - call: "POST /library/print-orders/${po_c}/confirm"
              payload: {}
              as: PublisherOps
          assert:
            - "PrintOrder.${po_a}: unit_cents == 185, plate_fee_cents == 25000, total_cents == 3724815  (19999 x 185 + 25000)"
            - "PrintOrder.${po_b}: unit_cents == 160, plate_fee_cents == 0, total_cents == 3200000  (20000 x 160, plate waived at >= 20000)"
            - "PrintOrder.${po_b}.total_cents < PrintOrder.${po_a}.total_cents  (ordering more costs less — tier cliff + waiver interaction)"
            - "PrintOrder.${po_c}: unit_cents == 167, plate_fee_cents == 0, total_cents == 1002000  (reprint: round_half_up(185 x 0.9) = 167, plate waived)"
            - "PrintOrder.${po_a}.production_month == \"2026-10\" and PrintOrder.${po_c}.production_month == \"2026-12\""

      - name: invoice_rounding_order_round_then_sum
        grounds:
          - calculations.invoice_cost_share
          - calculations.per_item_book_cost
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-line round_half_up THEN
          sum. With share 4975bp and item costs 224/224/225 the pinned order
          yields state 334 / local 339; summing first then rounding (AGGREGATE)
          yields 335 / 338 — a one-cent drift the pinned order eliminates.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Program TN2 share 4975bp cap 300c; affiliate Knox (prefix 379) operative 2026-01..2028-01."
