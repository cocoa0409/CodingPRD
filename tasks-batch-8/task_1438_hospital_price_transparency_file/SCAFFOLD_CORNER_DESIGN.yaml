          assert: ["error_id == ERR_CONTRACT_NOT_EDITABLE (http 409)"]

      - name: record_create_on_retired_item_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ITEM_RETIRED]", "state_machines.ServiceItem.ACTIVE_to_RETIRED"]
        distinguishing_aspect: "A RETIRED item (no certified-list guard engaged because no list references it) rejects new extraction with ERR_ITEM_RETIRED."
        test_recipe:
          setup: ["Facility F; item SI retired; cycle CY OPEN"]
          setup_api_calls:
