              as: HrisAnalyst
              as_user_id: "analyst-1"
            - call: "GET /hris/workers/${w_id}"
              payload: {}
              as: HrisAnalyst
              captures: { w_v2: $.data.version }
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_sal}", new_value: "11000", effective_date: "2026-10-01", expected_worker_version: "${w_v2}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr2_id: $.data.id }
            - call: "POST /hris/change-requests/${cr2_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
            - call: "POST /hris/change-requests/${cr2_id}/apply"
