  - section: cross_cutting_layers
    instances:
      - name: occ_stale_care_unit_version_rejected_on_admission_decision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.admission-decision-stale-care-unit
          - errors.ERR_CARE_UNIT_VERSION_STALE
          - validations[priority=55,ERR_CARE_UNIT_VERSION_STALE]
        distinguishing_aspect: |
          The admission decision carries expected_care_unit_version and a value one behind the unit's current
          version is rejected with 412 ERR_CARE_UNIT_VERSION_STALE, writing nothing: the applicant stays
          WAITLISTED, occupied_bed_count stays 0 and the unit's version does not move. Re-issuing the
          identical payload with the observed version succeeds and bumps the version. An implementation that
          ignores the field admits on the first call; one that compares with >= rejects the retry too.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit, licensed_bed_count 2, out_of_service_bed_count 0."
            - "One ELIGIBLE applicant holding an ACTIVE WaitlistEntry on that unit with a SUBMITTED NURSING assessment authored by assessor-1."
