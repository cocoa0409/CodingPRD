  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_half_up_at_exactly_85_promotes_to_high
        grounds:
          - calculations.risk_stratification_score
          - entities.RiskStratification.fields.raw_score
          - entities.RiskStratification.fields.tier
        distinguishing_aspect: |
          Boundary one sits on the risk-score metric reached through
          POST /care-management/members/{id}/stratifications: raw_score 84.5 must round half-up to
          85 and cross the `score >= 85` edge into HIGH, while a twin member differing only by one
          decayed observation stay lands on 82 and stays RISING.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "Member B has chronic_condition_count 3 plus three CLOSED inpatient admissions inside 90 days, one CLOSED ED visit 153 days back and one CLOSED observation stay 144 days back, giving 60 + 4 + 2.5 + 18 = 84.5."
            - "Member C has the same events minus the observation stay, giving 82.0."
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-1401", full_name: "Bea Lund", birth_date: "1951-03-03", state_code: "CA", chronic_condition_count: 3 }
              as: ProgramAdmin
              captures: { m_b: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-1402", full_name: "Cal Reyes", birth_date: "1953-05-05", state_code: "CA", chronic_condition_count: 3 }
              as: ProgramAdmin
              captures: { m_c: $.data.id }
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_b}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-06-01T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_b}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-06-20T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_b}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-07-05T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_b}", event_type: "ED_VISIT", occurred_at: "2026-03-01T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_b}", event_type: "OBSERVATION_STAY", occurred_at: "2026-03-10T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_c}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-06-01T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_c}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-06-20T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_c}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-07-05T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_c}", event_type: "ED_VISIT", occurred_at: "2026-03-01T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members/${m_b}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { b_raw: $.data.raw_score, b_score: $.data.score, b_tier: $.data.tier }
            - call: "POST /care-management/members/${m_c}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { c_raw: $.data.raw_score, c_score: $.data.score, c_tier: $.data.tier }
          assert:
            - "${b_raw} == 84.5"
            - "${b_score} == 85"
            - "${b_tier} == HIGH"
            - "${c_raw} == 82.0"
            - "${c_score} == 82"
            - "${c_tier} == RISING"
            - "RiskStratification for ${m_b} has utilization_points == 66.5 and chronic_points == 18"
            - "Member.${m_b}.latest_concurrent_tier == HIGH and Member.${m_c}.latest_concurrent_tier == RISING"

      - name: caseload_equal_to_capacity_stays_open_and_one_point_more_is_rejected
        grounds:
          - calculations.caseload_weight_points
          - validations[priority=80]
          - entities.CareManager.fields.capacity_status
          - errors[ERR_CASELOAD_WOULD_EXCEED_CAPACITY]
        distinguishing_aspect: |
          Boundary two sits on a different metric - caseload points - and is reached through a
          different endpoint, POST /care-management/enrollments: assigned_caseload_points exactly
          equal to capacity_points (6.0 of 6.0) leaves capacity_status OPEN, and only the next
          enrollment, which would make 7.0, is rejected with ERR_CASELOAD_WOULD_EXCEED_CAPACITY.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; program min_risk_tier LOW so every tier is eligible."
            - "One care manager with capacity_points 6.0."
            - "Members stratifying to RISING (weight 4.0), MODERATE (weight 2.0) and LOW (weight 1.0) under CONCURRENT."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Capacity Edge Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 6.0 }
              as: ProgramAdmin
              captures: { cm: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-1501", full_name: "Rho Vance", birth_date: "1959-07-07", state_code: "CA", chronic_condition_count: 10 }
              as: ProgramAdmin
              captures: { m_r: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-1502", full_name: "Mo Quinn", birth_date: "1964-08-08", state_code: "CA", chronic_condition_count: 6 }
              as: ProgramAdmin
              captures: { m_m: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-1503", full_name: "Lee Ash", birth_date: "1977-09-09", state_code: "CA", chronic_condition_count: 3 }
              as: ProgramAdmin
              captures: { m_l: $.data.id }
            - call: "POST /care-management/members/${m_r}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { r_tier: $.data.tier }
            - call: "POST /care-management/members/${m_m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { mo_tier: $.data.tier }
            - call: "POST /care-management/members/${m_l}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { l_tier: $.data.tier }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_r}", program_id: "${prog}", care_manager_id: "${cm}" }
              as: ProgramAdmin
              captures: { e_r: $.data.id, w_r: $.data.acuity_weight_points }
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_m}", program_id: "${prog}", care_manager_id: "${cm}" }
              as: ProgramAdmin
              captures: { e_m: $.data.id, w_m: $.data.acuity_weight_points }
            - call: "GET /care-management/care-managers/${cm}"
              payload: {}
              as: ProgramAdmin
              captures: { load_at_edge: $.data.assigned_caseload_points, status_at_edge: $.data.capacity_status }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_l}", program_id: "${prog}", care_manager_id: "${cm}" }
              as: ProgramAdmin
              captures: { over_err: $.data.error_id }
            - call: "GET /care-management/care-managers/${cm}"
              payload: {}
              as: ProgramAdmin
              captures: { load_after_reject: $.data.assigned_caseload_points, status_after_reject: $.data.capacity_status }
          assert:
            - "${r_tier} == RISING and ${mo_tier} == MODERATE and ${l_tier} == LOW"
            - "${w_r} == 4.0 and ${w_m} == 2.0"
            - "${load_at_edge} == 6.0"
            - "${status_at_edge} == OPEN"
            - "${over_err} == ERR_CASELOAD_WOULD_EXCEED_CAPACITY"
            - "the rejected create returns HTTP 409 and no Enrollment exists for ${m_l}"
            - "${load_after_reject} == 6.0 and ${status_after_reject} == OPEN"

      - name: roi_with_zero_whole_months_rejects_empty_measurement_period
        grounds:
          - calculations.roi_savings_measurement
          - validations[priority=59]
          - errors[ERR_MEASUREMENT_PERIOD_EMPTY]
        distinguishing_aspect: |
          Boundary three is an empty-set edge on a third metric and a third endpoint - the ROI
