        as: VeterinaryOfficer
        captures: {necropsy_status: '$.data[0].status'}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v3: $.data.version}
      - call: GET /aquarium/acquisition-requests/${ar2_id}
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/permits/${pm2_id}
        payload: {}
        as: PermitOfficer
      - call: GET /aquarium/collection-plan-entries/${cpe_id}
        payload: {}
        as: CuratorOfCollections
      assert:
      - 'link 1: Specimen.disposition_status == DECEASED, health_status == DECEASED_PENDING_NECROPSY, exhibit_id == null'
      - 'link 1: a VeterinaryCase with case_type == NECROPSY, status == OPEN, opened_at == ''2026-09-01T00:00:00Z'' and opened_by_user_id == ''vet-necropsy-opener'' now exists for the specimen'
      - 'link 2: the former Exhibit reports occupied_bioload_units == 0.00, bioload_utilization_pct == 0.00, posture == OPEN, last_posture_reason == null'
      - 'link 3: CollectionPlanEntry.status == SUSPENDED with suspension_reason == ''LAST_SPECIMEN_LOST'' (the exhibit retains no specimen of that species)'
      - 'link 4: AcquisitionRequest ar2 has status == CANCELLED, closure_reason == ''PLAN_SUSPENDED'' and quota_units_reserved == 0'
      - 'link 5: the ISSUED import permit of ar2 has status == REVOKED and decision_reason == ''ACQUISITION_CANCELLED'''
      - AcquisitionRequest ar1 is untouched at status == FULFILLED with fulfilled_count == 1 because FULFILLED is terminal
      - Species.wild_take_quota_reserved == 0 throughout (ar2 was never cleared, so it had reserved nothing to release)
      - a second POST mortality on the same specimen returns 409 ERR_ENTITY_TERMINAL at priority 11, not ERR_INVALID_STATE
  - name: cascade_d_clock_advance_expires_permit_and_releases_wild_quota
    grounds:
    - §1.2 Permit ISSUED -> EXPIRED (CASCADE D link 1)
