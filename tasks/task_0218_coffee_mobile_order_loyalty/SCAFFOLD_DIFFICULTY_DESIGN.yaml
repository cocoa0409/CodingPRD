            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T18:00:00Z", window_end: "2026-06-01T18:15:00Z" }, as: PlatformAdmin, captures: { slot2_id: $.data.id, slot2_v: $.data.version } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T19:00:00Z", window_end: "2026-06-01T19:15:00Z" }, as: PlatformAdmin, captures: { slot3_id: $.data.id } }
            - { call: "POST /members", payload: { email: "rr@x.com", full_name: "RR", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot1_id}" }, as: Member, as_user_id: "${mem_id}", captures: { seed_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/lines", payload: { menu_item_id: "${box_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/place", payload: { expected_slot_version: "${slot1_v}" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/rewards/redeem", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { reward_id: $.data.id } }
            # redeem the reward on a real order to drive it to REDEEMED
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot2_id}", applied_reward_id: "${reward_id}" }, as: Member, as_user_id: "${mem_id}", captures: { ord_used: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${ord_used}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${ord_used}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${ord_used}/place", payload: { expected_slot_version: "${slot2_v}" }, as: Member, as_user_id: "${mem_id}" }
            # new order re-applies the now-REDEEMED reward
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot3_id}", applied_reward_id: "${reward_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_REWARD_NOT_APPLICABLE"
            - "RewardGrant.${reward_id}.status == REDEEMED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_slot_create_halfopen_overlap_rejected
        grounds:
          - validations[priority=8b]
          - entities.PickupSlot.fields.window_start
          - entities.PickupSlot.fields.window_end
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: >
          Half-open interval geometry on the Store's slot timeline: a new slot [17:10, 17:20) overlapping an
          existing [17:00, 17:15) on the same store is rejected ERR_SLOT_OVERLAP, while an endpoint-touching
          slot [17:15, 17:30) is accepted — adjacency-tolerant geometry, distinct from instance 2's
          aggregate-capacity semantics.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store with one existing slot [17:00,17:15)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Vine St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot1_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:15:00Z", window_end: "2026-06-01T17:30:00Z" }, as: PlatformAdmin, captures: { slot_touch_id: $.data.id } }
          trigger:
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:10:00Z", window_end: "2026-06-01T17:20:00Z" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Endpoint-touching slot [17:15,17:30) created successfully (PickupSlot.${slot_touch_id} exists)"
            - "Overlapping slot [17:10,17:20): response status == 409 and data.error_id == ERR_SLOT_OVERLAP"

      - name: pickup_slot_aggregate_capacity_overlap_at_place
        grounds:
          - calculations.slot_reserved_count
          - validations[priority=11]
          - entities.PickupSlot.fields.reserved_count
          - errors[ERR_SLOT_FULL]
        distinguishing_aspect: >
          Aggregate-capacity occupancy on PickupSlot: several orders together occupy one window bounded
          by slot_capacity (here 2); the 3rd placement collides and is rejected ERR_SLOT_FULL — capacity
          arithmetic, a different interval semantics than instance 1's half-open geometry.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 2; one slot; three paid orders by three members."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Rose St", timezone: "America/Los_Angeles", slot_capacity: 2, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v0: $.data.version } }
            - { call: "POST /members", payload: { email: "c1@x.com", full_name: "C1", birth_month_day: "01-01" }, as: Anonymous, captures: { m1: $.data.id } }
            - { call: "POST /members/${m1}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${m1}", captures: { o1: $.data.id } }
            - { call: "POST /members/${m1}/orders/${o1}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${m1}" }
            - { call: "POST /members/${m1}/orders/${o1}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${m1}" }
            - { call: "POST /members", payload: { email: "c2@x.com", full_name: "C2", birth_month_day: "01-01" }, as: Anonymous, captures: { m2: $.data.id } }
            - { call: "POST /members/${m2}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${m2}", captures: { o2: $.data.id } }
            - { call: "POST /members/${m2}/orders/${o2}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${m2}" }
            - { call: "POST /members/${m2}/orders/${o2}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${m2}" }
            - { call: "POST /members", payload: { email: "c3@x.com", full_name: "C3", birth_month_day: "01-01" }, as: Anonymous, captures: { m3: $.data.id } }
            - { call: "POST /members/${m3}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${m3}", captures: { o3: $.data.id } }
            - { call: "POST /members/${m3}/orders/${o3}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${m3}" }
            - { call: "POST /members/${m3}/orders/${o3}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${m3}" }
            - { call: "POST /members/${m1}/orders/${o1}/place", payload: { expected_slot_version: "${slot_v0}" }, as: Member, as_user_id: "${m1}" }
            - { call: "GET /stores/${store_id}/pickup-slots", payload: {}, as: Member, as_user_id: "${m2}", captures: { slot_v1: "$.data[0].version" } }
            - { call: "POST /members/${m2}/orders/${o2}/place", payload: { expected_slot_version: "${slot_v1}" }, as: Member, as_user_id: "${m2}" }
            - { call: "GET /stores/${store_id}/pickup-slots", payload: {}, as: Member, as_user_id: "${m3}", captures: { slot_v2: "$.data[0].version" } }
          trigger:
            - { call: "POST /members/${m3}/orders/${o3}/place", payload: { expected_slot_version: "${slot_v2}" }, as: Member, as_user_id: "${m3}", captures: { err: $.data.error_id } }
          assert:
            - "PickupSlot.${slot_id}.reserved_count == 2 before the third place"
            - "Third place: response status == 409 and data.error_id == ERR_SLOT_FULL"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: refund_preserves_card_balance_invariant
        grounds:
          - state_machines.Refund.(none)_to_SETTLED
          - calculations.card_balance
          - entities.StoredValueCard.fields.balance_cents
          - entities.WalletTransaction.fields.amount_cents
        distinguishing_aspect: >
          Conserved quantity = StoredValueCard.balance_cents. Forward ORDER_SPEND(-669) paired with the
          compensating REFUND(+669) leaves balance_cents exactly equal to the pre-pay value (5000): the
          named formula sum(WalletTransaction.amount_cents) is unchanged, a different conserved quantity
          than instance 2's star balance.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; member card reloaded to 5000c; order paid STORED_VALUE (total 669) and placed."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Plum St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "ci@x.com", full_name: "CI", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/card/reload", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${mem_id}", captures: { card_v: $.data.version } }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "STORED_VALUE", expected_card_version: "${card_v}" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/place", payload: { expected_slot_version: "${slot_v}" }, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/cancel", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { ps: $.data.payment_status } }
            - { call: "GET /members/${mem_id}/card", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { bal: "$.data[0].balance_cents" } }
          assert:
            - "StoredValueCard(member ${mem_id}).balance_cents == 5000"
            - "Order.${order_id}.payment_status == REFUNDED"

      - name: refund_preserves_member_star_balance_invariant
        grounds:
          - state_machines.Refund.(none)_to_SETTLED
          - calculations.member_star_balance
          - entities.Member.fields.star_balance
          - entities.StarLedgerEntry.fields.delta_stars
        distinguishing_aspect: >
          Conserved quantity = Member.star_balance. Forward EARN(+6) paired with compensating REVERSAL(-6) on
          refund leaves star_balance equal to the pre-pay value (0); sum(StarLedgerEntry.delta_stars) is
          unchanged, a different conserved quantity than instance 1's card balance.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; member star_balance 0; order paid EXTERNAL_CARD (total 669, earns 6 stars) and placed."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Hazel St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "si@x.com", full_name: "SI", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}", captures: { se: $.data.stars_earned } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/place", payload: { expected_slot_version: "${slot_v}" }, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/cancel", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { ps: $.data.payment_status } }
            - { call: "GET /members/${mem_id}", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { sb: $.data.star_balance } }
          assert:
            - "Order.${order_id}.stars_earned == 6"
            - "Member.${mem_id}.star_balance == 0"
            - "Order.${order_id}.payment_status == REFUNDED"
