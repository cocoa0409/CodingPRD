            - "verify by EmergencyOperator: 403 ERR_UNAUTHORIZED (role boundary enforces segregation)"
            - "StolenVehicleCase.${svc_so}.status still == REPORTED after both rejections"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_convert_after_successful_convert_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[subscription-convert-stale-version]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/accounts/{accountId}/subscriptions/{subscriptionId}/convert
        distinguishing_aspect: "Client reads version 1, a first convert succeeds (version advances to 2), then a second strictly-sequential convert still carrying expected version 1 is rejected 412 ERR_STALE_VERSION — the OCC loser is deterministic."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1, TRIAL subscription with captured version."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_oc: $.data.id, sub_oc_v: $.data.version }
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_oc}/convert"
              payload: { expected_subscription_version: "${sub_oc_v}" }
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_oc}/convert"
              payload: { expected_subscription_version: "${sub_oc_v}" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_oc: $.data.error_id }
          assert:
            - "response status 412 and error_id == ERR_STALE_VERSION"
            - "Subscription.${sub_oc}.status == ACTIVE and version == ${sub_oc_v} + 1"

      - name: clock_set_advances_lapse_and_cancellation_epochs
        claim_type: scheduled_actions
        grounds:
          - state_machines.Subscription.PAST_DUE_to_LAPSED
          - state_machines.Subscription.LAPSED_to_CANCELLED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The clock endpoint fires deferred transitions deterministically: PAST_DUE at 2026-09-02 lapses when the clock reaches 2026-09-12, and auto-cancels when it passes 2026-10-12 without a retention decision."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1; subscription converted ACTIVE 2026-09-01, payment failed 2026-09-02."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_sc: $.data.id, sub_sc_v: $.data.version }
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_sc}/convert"
              payload: { expected_subscription_version: "${sub_sc_v}" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_sc}/billing-events"
              payload: { outcome: "PAYMENT_FAILED" }
              as: BillingAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /accounts/${acct_a1}/subscriptions/${sub_sc}"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_lapsed_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /accounts/${acct_a1}/subscriptions/${sub_sc}"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
          assert:
            - "at 2026-09-12: Subscription.${sub_sc}.status == LAPSED and lapse_date == 2026-09-12"
            - "at 2026-10-13: Subscription.${sub_sc}.status == CANCELLED (retention window lapsed without decision)"
            - "Subscription.${sub_sc}.next_renewal_date is null after lapse"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: crash_dispatch_acknowledge_visibility
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CrashEvent.DISPATCH_COORDINATED_to_CLOSED_DISPATCHED
        excluded_because:
          difficulty_instance: transitive_cascade / crash_dispatch_acknowledge_bubbleup_chain
          rationale: "Immediate visibility of the CLOSED_DISPATCHED bubble-up is asserted in the named §1.8 instance's final assert on CrashEvent status."

      - name: subscription_emergency_retained_visibility
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Subscription.LAPSED_to_EMERGENCY_RETAINED
        excluded_because:
          difficulty_instance: boundary_precision_check / emergency_locate_cap_at_exactly_two_in_thirty_day_window
          rationale: "EMERGENCY_RETAINED visibility (emergency_only_flag, command admission) is exercised directly by the named §1.8 instance."

      - name: appointment_cancel_compensation_visibility
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ServiceAppointment.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / appointment_cancel_compensates_report_schedule_pointer
          rationale: "The compensation revert of DiagnosticReport to GENERATED in the same request is asserted in the named §1.8 instance."

      - name: dual_variant_severity_delta
        claim_type: dual_variant_calculation_layer
        grounds:
          - complexity_profile.complexity_layers
          - calculations.crash_severity
        excluded_because:
          difficulty_instance: dual_variant_calc / crash_severity_sensor_reported_vs_delta_v_only
          rationale: "Both variants and their 25.0-point delta are asserted in the named §1.8 instance."

      - name: cascade_chain_end_to_end_ordering
        claim_type: cascading_side_effects_layer
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.StolenVehicleCase
        excluded_because:
          difficulty_instance: transitive_cascade / stolen_verify_to_recovery_restores_vehicle_chain
          rationale: "The verify -> vehicle-mutation -> arm-eligibility chain is asserted link-by-link in the named §1.8 instance."
