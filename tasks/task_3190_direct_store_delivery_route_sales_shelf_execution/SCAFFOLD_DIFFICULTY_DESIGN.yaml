              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_a_id}", qty_cases: 5 }] }
              as: RouteSalesRep
