      - { name: severity_points, type: integer, source: computed, description: "Frozen at the SUBSTANTIATED transition; see calculations.incident_severity_and_deadline", default: null }
      - { name: severity, type: enum, source: computed, description: "LOW | MODERATE | HIGH | CRITICAL — frozen at the SUBSTANTIATED transition", default: null }
      - { name: lead_investigator_user_id, type: string, source: system, description: "X-User-ID that opened the investigation; may not perform the agency notification", default: null }
      - { name: substantiated_at, type: datetime, source: system, description: "Logical-clock instant of the SUBSTANTIATED transition", default: null }
