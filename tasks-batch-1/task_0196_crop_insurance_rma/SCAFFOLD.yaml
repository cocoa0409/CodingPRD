# =============================================================================
# Crop Insurance (USDA RMA) — Multi-Peril Crop Insurance Administration
# Scaffold seed tables (§1.0–§1.7)
# Difficulty: Expert (§0.4)
# =============================================================================

scenario: |
  Crop Insurance (USDA RMA): APH yield coverage election, revenue protection,
  acreage reporting, planting/harvest dates, loss adjustment, prevented planting,
  subsidy factor, agent commission

domain_name: crop-insurance-rma
api_prefix: ""   # flat topology: many peer top-level collections (/policies, /coverage-elections, /units, …); no single nesting root

# Structural DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation        # Yield Protection vs Revenue Protection
  secondary_archetype: compliance_audit            # acreage-report deadlines, planting/harvest date gates, segregation of duties
  complexity_layers:
    - dual_variant_calculation                     # YP indemnity vs RP indemnity on the same loss
    - rate_threshold_triggers                      # subsidy-factor breakpoints, commission tiers, coverage-level gates
    - cascading_side_effects                       # loss approval -> indemnity -> commission clawback -> policy ledger
    - optimistic_concurrency                       # OCC on Policy.version for coverage election / acreage report supersede

  entity_topology: flat                            # peer entities linked by FK; no deep URL nesting (PRIORITIZED)
  state_machine_shape: branching                   # approve/deny forks, revision loops on loss claims (PRIORITIZED)
  relationship_patterns:
    - one_to_many                                  # Policy -> CoverageElection -> Unit
    - cross_aggregate                              # LossClaim references Unit, AcreageReport, CommodityProgram across boundaries
  role_model: segregation_of_duties                # Agent sells, LossAdjuster adjusts, RmaAdmin sets params (PRIORITIZED)
  consistency_model: immediate                     # all ledger updates atomic within a request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration: RMA actuarial parameters per crop/county/year ----
  - name: CommodityProgram
    parent: null
    common_fields: true
    fields:
      - { name: crop_code, type: string, source: input, description: "Crop identifier, e.g. CORN, SOYBEANS, WHEAT" }
      - { name: county_code, type: string, source: input, description: "FIPS-style county code, e.g. 19153" }
      - { name: crop_year, type: integer, source: input, description: "Reinsurance year, e.g. 2026", constraints: ">= 2000" }
      - { name: projected_price, type: number, source: input, description: "RMA projected price per bushel (set at sales close)", constraints: "> 0" }
      - { name: harvest_price, type: number, source: input, description: "RMA harvest price per bushel; null until harvest-price discovery", default: null }
      - { name: base_premium_rate, type: number, source: input, description: "County base premium rate applied to dollar liability", constraints: "0 < rate < 1" }
      - { name: pp_coverage_factor, type: number, source: input, description: "Prevented-planting payment factor on dollar liability, e.g. 0.60", constraints: "0 < factor <= 1" }
      - { name: final_planting_date, type: datetime, source: input, description: "Last day to plant for full coverage (ISO 8601 UTC)" }
      - { name: acreage_reporting_deadline, type: datetime, source: input, description: "Deadline to file the acreage report (ISO 8601 UTC)" }
      - { name: harvest_price_published, type: boolean, source: computed, description: "True once harvest_price has been set via the harvest-price endpoint", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED — sales availability", default: DRAFT, constraints: "DRAFT|OPEN|CLOSED" }

  # ---- Resource: master insurance policy held by a producer with a selling agent ----
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; the insured producer" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; the selling agent of record" }
      - { name: crop_year, type: integer, source: input, description: "Reinsurance year covered by this policy" }
      - { name: total_premium_cents, type: integer, source: computed, description: "Sum of CoverageElection.total_premium_cents for elections in ELECTED|REPORTED|INDEMNIFIED", default: 0 }
      - { name: producer_premium_cents, type: integer, source: computed, description: "Sum of CoverageElection.producer_premium_cents over the same election set", default: 0 }
      - { name: subsidy_cents, type: integer, source: computed, description: "= total_premium_cents - producer_premium_cents (federal subsidy share)", default: 0 }
      - { name: total_indemnity_cents, type: integer, source: computed, description: "Sum of approved LossClaim.indemnity_cents and PreventedPlantingClaim.pp_indemnity_cents", default: 0 }
      - { name: total_insured_acres, type: number, source: computed, description: "Sum of Unit.acres for units in REPORTED or ACTIVE across this policy's elections", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CANCELLED — policy lifecycle", default: DRAFT, constraints: "DRAFT|ACTIVE|CANCELLED" }

  # ---- Resource: a coverage election (plan + level) under a policy for one commodity ----
  - name: CoverageElection
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; owning policy" }
      - { name: commodity_program_id, type: string, source: input, description: "FK -> CommodityProgram.id; actuarial parameters used" }
      - { name: plan_type, type: enum, source: input, description: "YP (yield protection) | RP (revenue protection) | RP_HPE (revenue protection harvest-price-exclusion)", constraints: "YP|RP|RP_HPE" }
      - { name: aph_yield, type: number, source: input, description: "Actual Production History yield in bushels per acre", constraints: "> 0" }
      - { name: coverage_level, type: number, source: input, description: "Coverage level fraction; one of 0.50,0.55,0.60,0.65,0.70,0.75,0.80,0.85" }
      - { name: yield_guarantee_bu, type: number, source: computed, description: "= round(aph_yield * coverage_level, 2) bushels per acre" }
      - { name: dollar_liability_per_acre_cents, type: integer, source: computed, description: "= round(yield_guarantee_bu * projected_price * 100) cents per acre (projected price at election for all plans)" }
      - { name: total_premium_cents, type: integer, source: computed, description: "Sum over units of per-acre premium; see total_premium calculation" }
      - { name: subsidy_factor, type: number, source: computed, description: "Federal subsidy factor selected by coverage_level from SUBSIDY_FACTORS" }
      - { name: subsidy_cents, type: integer, source: computed, description: "= round(total_premium_cents * subsidy_factor)" }
      - { name: producer_premium_cents, type: integer, source: computed, description: "= total_premium_cents - subsidy_cents (conserved: subsidy_cents + producer_premium_cents == total_premium_cents)" }
      - { name: status, type: enum, source: system, description: "ELECTED | REPORTED | INDEMNIFIED | VOID", default: ELECTED, constraints: "ELECTED|REPORTED|INDEMNIFIED|VOID" }

  # ---- Resource: an insurable unit (acreage block) under a coverage election ----
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: coverage_election_id, type: string, source: input, description: "FK -> CoverageElection.id; owning election" }
      - { name: unit_number, type: string, source: input, description: "Producer-assigned unit label, e.g. 0001-0001" }
      - { name: acres, type: number, source: input, description: "Insured acres in this unit", constraints: "> 0" }
      - { name: share, type: number, source: input, description: "Producer share of the unit as a fraction", constraints: "0 < share <= 1" }
      - { name: planted_acres, type: number, source: computed, description: "Acres reported planted (from AcreageReport); 0 until reported", default: 0 }
      - { name: prevented_acres, type: number, source: computed, description: "Acres reported prevented from planting; 0 until reported", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | REPORTED | ACTIVE | SETTLED | VOID", default: PENDING, constraints: "PENDING|REPORTED|ACTIVE|SETTLED|VOID" }

  # ---- Resource: acreage report filed against a unit (planted + prevented + dates) ----
  - name: AcreageReport
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit being reported" }
      - { name: planted_acres, type: number, source: input, description: "Acres actually planted", constraints: ">= 0" }
      - { name: prevented_acres, type: number, source: input, description: "Acres prevented from planting", constraints: ">= 0" }
      - { name: planting_date, type: datetime, source: input, description: "Date the unit was planted (ISO 8601 UTC); null if fully prevented", default: null }
      - { name: late_planted, type: boolean, source: computed, description: "True when planting_date is strictly after the program final_planting_date" }
      - { name: status, type: enum, source: system, description: "FILED | ACCEPTED | SUPERSEDED — only one ACCEPTED report per unit", default: FILED, constraints: "FILED|ACCEPTED|SUPERSEDED" }

  # ---- Resource: notice of loss / loss claim with adjustment lifecycle ----
  - name: LossClaim
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit suffering the loss" }
      - { name: harvest_date, type: datetime, source: input, description: "Reported harvest/appraisal date (ISO 8601 UTC)" }
      - { name: production_to_count_bu, type: number, source: input, description: "Total bushels produced/appraised on the unit (whole-unit, not per-acre)", constraints: ">= 0" }
      - { name: assigned_adjuster_id, type: string, source: input, description: "FK -> Agent.id; LossAdjuster assigned at intake (opaque actor still stored as Agent for audit)", default: null }
      - { name: indemnity_cents, type: integer, source: computed, description: "Approved indemnity in cents; 0 until APPROVED", default: 0 }
      - { name: revision_count, type: integer, source: computed, description: "Number of times the claim returned from UNDER_REVIEW to DRAFT for rework", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | DENIED | PAID", default: DRAFT, constraints: "DRAFT|UNDER_REVIEW|APPROVED|DENIED|PAID" }

  # ---- Resource: prevented-planting claim (separate indemnity path) ----
  - name: PreventedPlantingClaim
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit with prevented acres" }
      - { name: claimed_prevented_acres, type: number, source: input, description: "Prevented acres claimed (must not exceed unit.prevented_acres)", constraints: "> 0" }
      - { name: cause, type: enum, source: input, description: "EXCESS_MOISTURE | DROUGHT | FLOOD | OTHER", constraints: "EXCESS_MOISTURE|DROUGHT|FLOOD|OTHER" }
      - { name: pp_indemnity_cents, type: integer, source: computed, description: "Approved prevented-planting indemnity in cents; 0 until APPROVED", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | DENIED", default: DRAFT, constraints: "DRAFT|UNDER_REVIEW|APPROVED|DENIED" }

  # ---- Resource: agent commission ledger entry ----
  - name: AgentCommission
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; commissioned agent" }
      - { name: coverage_election_id, type: string, source: input, description: "FK -> CoverageElection.id; election this commission was earned on" }
      - { name: commission_rate, type: number, source: computed, description: "Tier rate selected from the election's total_premium_cents (see agent_commission calc)" }
      - { name: commission_cents, type: integer, source: computed, description: "= round(total_premium_cents * commission_rate)" }
      - { name: clawback_cents, type: integer, source: computed, description: "Commission reversed when the underlying election is VOIDed; 0 normally", default: 0 }
      - { name: status, type: enum, source: system, description: "EARNED | CLAWED_BACK", default: EARNED, constraints: "EARNED|CLAWED_BACK" }

  # ---- Identity entities for RBAC ----
  - name: Producer
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Producer (insured) legal name" }
      - { name: tax_id, type: string, source: input, description: "Producer tax identifier" }

  - name: Agent
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Agent or adjuster name" }
      - { name: license_number, type: string, source: input, description: "State insurance license number" }
      - { name: role_kind, type: enum, source: input, description: "SELLING | ADJUSTING — distinguishes selling agents from loss adjusters", constraints: "SELLING|ADJUSTING" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CommodityProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /commodity-programs/{id}/open"
        actor: RmaAdmin
        preconditions:
          - "projected_price is set and > 0"
          - "final_planting_date and acreage_reporting_deadline are both set"
        side_effects:
          - "Coverage elections may now be created against this program"
          - "increments CommodityProgram.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /commodity-programs/{id}/close"
        actor: RmaAdmin
        preconditions:
          - "No CoverageElection in ELECTED status references this program (ERR_PROGRAM_HAS_OPEN_ELECTIONS)"
        side_effects:
          - "New elections against this program are rejected"
          - "increments CommodityProgram.version by 1"

  - entity: Policy
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: Agent
        preconditions:
          - "At least one CoverageElection in ELECTED status under this policy (ERR_POLICY_HAS_NO_ELECTIONS)"
        side_effects:
          - "Policy locked for acreage reporting and loss adjustment"
          - "increments Policy.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Agent
        preconditions:
          - "No LossClaim or PreventedPlantingClaim under this policy is in UNDER_REVIEW or APPROVED (ERR_POLICY_HAS_OPEN_CLAIMS)"
        side_effects:
          - "Cascade: every non-VOID CoverageElection under the policy -> VOID"
          - "Cascade hop 2: each VOIDed election VOIDs its Units (non-SETTLED) and triggers commission clawback on the election's AgentCommission"
          - "Recompute Policy.total_premium_cents, producer_premium_cents, subsidy_cents (drop VOIDed elections)"
          - "increments Policy.version by 1"

  - entity: CoverageElection
    initial_state: ELECTED
    terminal_states: [INDEMNIFIED, VOID]
    transitions:
      - from: ELECTED
        to: REPORTED
        trigger: "system: all units under the election reach REPORTED"
        actor: system
        preconditions:
          - "Every Unit under the election has an ACCEPTED AcreageReport"
        side_effects:
          - "Election is eligible for loss adjustment"
      - from: REPORTED
        to: INDEMNIFIED
        trigger: "system: a LossClaim or PreventedPlantingClaim under the election is APPROVED"
        actor: system
        preconditions:
          - "At least one approved claim references a Unit under this election"
        side_effects:
          - "Adds approved indemnity into Policy.total_indemnity_cents"
      - from: ELECTED
        to: VOID
        trigger: "POST /coverage-elections/{id}/void  OR  cascade from Policy cancel"
        actor: Agent
        preconditions:
          - "No Unit under the election has an ACCEPTED AcreageReport (ERR_ELECTION_ALREADY_REPORTED)"
        side_effects:
          - "Cascade: all Units under the election (status PENDING) -> VOID"
          - "Cascade hop 2: the election's AgentCommission (status EARNED) -> CLAWED_BACK with clawback_cents = commission_cents"
          - "Recompute owning Policy.total_premium_cents, producer_premium_cents, subsidy_cents excluding this election"
          - "increments Policy.version by 1 (owning policy)"

  - entity: Unit
    initial_state: PENDING
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /acreage-reports  (report ACCEPTED)"
        actor: Agent
        preconditions:
          - "Unit's owning CoverageElection is ELECTED"
          - "planted_acres + prevented_acres <= Unit.acres (ERR_ACREAGE_OVER_REPORTED)"
        side_effects:
          - "Unit.planted_acres and prevented_acres set from the ACCEPTED report"
          - "Bubble up: if all sibling units REPORTED, owning CoverageElection ELECTED -> REPORTED"
          - "Recompute owning Policy.total_insured_acres"
      - from: REPORTED
        to: ACTIVE
        trigger: "system: first LossClaim or PreventedPlantingClaim filed against the unit"
        actor: system
        preconditions:
          - "Unit is REPORTED"
        side_effects:
          - "Unit flagged in loss adjustment"
      - from: ACTIVE
        to: SETTLED
        trigger: "system: a claim on the unit is APPROVED or DENIED (final)"
        actor: system
        preconditions:
          - "No other claim on the unit is in DRAFT or UNDER_REVIEW"
        side_effects:
          - "Unit closed to further claims"
      - from: PENDING
        to: VOID
        trigger: "cascade from CoverageElection void"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute owning Policy.total_insured_acres"

  - entity: LossClaim
    initial_state: DRAFT
    terminal_states: [DENIED, PAID]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /loss-claims/{id}/submit"
        actor: Agent
        preconditions:
          - "Unit is REPORTED or ACTIVE (ERR_UNIT_NOT_REPORTED)"
          - "CommodityProgram.harvest_price_published is true for RP/RP_HPE elections (ERR_HARVEST_PRICE_UNAVAILABLE)"
        side_effects:
          - "Unit (if REPORTED) -> ACTIVE"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /loss-claims/{id}/return  (adjuster requests rework — revision loop)"
        actor: LossAdjuster
        preconditions:
          - "Acting LossAdjuster is the assigned_adjuster_id (ERR_ADJUSTER_NOT_ASSIGNED)"
        side_effects:
          - "increments LossClaim.revision_count by 1"
          - "note: cyclic — claim may re-submit, looping DRAFT<->UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /loss-claims/{id}/approve"
        actor: LossAdjuster
        preconditions:
          - "Acting LossAdjuster is the assigned_adjuster_id and is NOT the policy's selling agent (ERR_SEGREGATION_OF_DUTIES)"
          - "Computed indemnity_cents >= 0"
        side_effects:
          - "Set indemnity_cents from yp_or_rp_indemnity calculation"
          - "Cascade: owning CoverageElection REPORTED -> INDEMNIFIED"
          - "Cascade hop 2: add indemnity_cents into owning Policy.total_indemnity_cents"
          - "Unit -> SETTLED if no other open claim"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /loss-claims/{id}/deny"
        actor: LossAdjuster
        preconditions:
          - "Acting LossAdjuster is the assigned_adjuster_id and is NOT the policy's selling agent (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "indemnity_cents stays 0"
          - "Unit -> SETTLED if no other open claim"
      - from: APPROVED
        to: PAID
        trigger: "POST /loss-claims/{id}/pay"
        actor: RmaAdmin
        preconditions:
          - "Claim is APPROVED"
        side_effects:
          - "Marks indemnity disbursed (terminal)"

  - entity: PreventedPlantingClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /prevented-planting-claims/{id}/submit"
        actor: Agent
        preconditions:
          - "claimed_prevented_acres <= Unit.prevented_acres (ERR_PP_ACRES_EXCEED_REPORTED)"
          - "Unit is REPORTED or ACTIVE (ERR_UNIT_NOT_REPORTED)"
        side_effects:
          - "Unit (if REPORTED) -> ACTIVE"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /prevented-planting-claims/{id}/approve"
        actor: LossAdjuster
        preconditions:
          - "Acting LossAdjuster is NOT the policy's selling agent (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set pp_indemnity_cents from prevented_planting_indemnity calculation"
          - "Cascade: owning CoverageElection REPORTED -> INDEMNIFIED"
          - "Cascade hop 2: add pp_indemnity_cents into owning Policy.total_indemnity_cents"
          - "Unit -> SETTLED if no other open claim"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /prevented-planting-claims/{id}/deny"
        actor: LossAdjuster
        preconditions:
          - "Acting LossAdjuster is NOT the policy's selling agent (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "pp_indemnity_cents stays 0"
          - "Unit -> SETTLED if no other open claim"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: acreage-report-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /acreage-reports"
    occ_field: "expected_unit_version"
    description: |
      Filing an AcreageReport against a Unit whose version has advanced since the
      client last observed it is rejected. A prior writer has already filed and had
      an AcreageReport ACCEPTED for that unit (which legitimately supersedes any
      later filing under the one-ACCEPTED-report-per-unit rule and advances the
      unit's version); the current writer's view of the unit is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: election-void-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /coverage-elections/{id}/void"
    occ_field: "expected_policy_version"
    description: |
      Voiding a CoverageElection carries the owning Policy's expected version. If the
      policy's version has advanced (another election was voided, or the policy was
      activated, recomputing the premium ledger and bumping the policy version) the
      void is rejected because the caller's premium-ledger view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: yield_guarantee_and_liability
    trigger: "on CoverageElection create (POST /coverage-elections)"
    algorithm: aggregation
    formula: |
      yield_guarantee_bu = round(aph_yield * coverage_level, 2)            # bushels per acre
      # Liability always uses the PROJECTED price at election (harvest price unknown at election)
      dollar_liability_per_acre_cents = round(yield_guarantee_bu * projected_price * 100)
    input_set: "Single CoverageElection plus its CommodityProgram.projected_price"
    constants: {}
    precision: "yield_guarantee_bu: 2 decimals round_half_up; cents: integer round_half_up"

  - name: total_premium
    trigger: "on CoverageElection create and on each Unit add (POST /units)"
    algorithm: tiered_pricing
    formula: |
      RATE_MULTIPLIER = { YP: 1.00, RP: 1.15, RP_HPE: 1.08 }   # plan loading
      # PINNED ROUNDING ORDER: round per-acre premium to whole cents FIRST, then multiply
      # by acres*share and sum across units. (round-per-unit-then-sum, NOT sum-then-round.)
      per_acre_premium_cents = round(dollar_liability_per_acre_cents
                                     * base_premium_rate
                                     * RATE_MULTIPLIER[plan_type])
      unit_premium_cents = round(per_acre_premium_cents * acres * share)
      total_premium_cents = sum(unit_premium_cents for Unit in {PENDING, REPORTED, ACTIVE})
    input_set: "All Units under the election whose status IN {PENDING, REPORTED, ACTIVE}; VOID/SETTLED excluded"
    constants:
      RATE_MULTIPLIER_YP: 1.00
      RATE_MULTIPLIER_RP: 1.15
      RATE_MULTIPLIER_RP_HPE: 1.08
    precision: "per_acre_premium_cents: integer cents round_half_up, applied BEFORE multiplying by acres*share"

  - name: subsidy_split
    trigger: "on total_premium recompute (CoverageElection create, Unit add)"
    algorithm: threshold
    formula: |
      SUBSIDY_FACTORS = { 0.50:0.67, 0.55:0.64, 0.60:0.64, 0.65:0.59,
                          0.70:0.59, 0.75:0.55, 0.80:0.48, 0.85:0.38 }
      subsidy_factor = SUBSIDY_FACTORS[coverage_level]    # exact-key lookup; no interpolation
      subsidy_cents = round(total_premium_cents * subsidy_factor)
      producer_premium_cents = total_premium_cents - subsidy_cents   # conserved: parts sum to total
    input_set: "Single CoverageElection.total_premium_cents and its coverage_level"
    constants:
      SUBSIDY_FACTORS: "{0.50:0.67,0.55:0.64,0.60:0.64,0.65:0.59,0.70:0.59,0.75:0.55,0.80:0.48,0.85:0.38}"
    precision: "subsidy_cents: integer round_half_up; producer_premium_cents derived by subtraction (no independent rounding)"

  - name: yp_or_rp_indemnity
    trigger: "on LossClaim approve (POST /loss-claims/{id}/approve)"
    algorithm: forward_looking
    formula: |
      guar_bu = yield_guarantee_bu                                # per acre
      insured_acres = sum(Unit.acres for the claim's unit)        # whole unit
      share = Unit.share
      ptc_per_acre = production_to_count_bu / insured_acres       # bushels per acre actually made
      if plan_type == YP:
        # YIELD loss only, priced at PROJECTED price
        indemnity_per_acre = max(0, guar_bu - ptc_per_acre) * projected_price
      else:  # RP or RP_HPE — REVENUE loss
        rp_price = (max(projected_price, harvest_price) if plan_type == RP
                    else projected_price)                          # RP_HPE excludes harvest upside
        revenue_guarantee_per_acre = guar_bu * rp_price
        calculated_revenue_per_acre = ptc_per_acre * harvest_price
        indemnity_per_acre = max(0, revenue_guarantee_per_acre - calculated_revenue_per_acre)
      indemnity_cents = round(indemnity_per_acre * insured_acres * share * 100)
    input_set: "LossClaim + its Unit (acres, share) + CoverageElection (plan_type, yield_guarantee_bu) + CommodityProgram (projected_price, harvest_price)"
    constants: {}
    precision: "indemnity_cents: integer cents round_half_up after all per-acre arithmetic"
    variants:
      - name: yield_protection
        when: "election.plan_type == YP"
        difference: "Loss measured in bushels priced at projected_price; harvest_price ignored entirely"
      - name: revenue_protection
        when: "election.plan_type == RP"
        difference: "Loss measured in revenue; guarantee uses max(projected,harvest); calculated revenue uses harvest_price — same loss yields a different (often larger) indemnity than YP"
      - name: revenue_protection_hpe
        when: "election.plan_type == RP_HPE"
        difference: "Like RP but guarantee uses projected_price only (no harvest-price upside); calculated revenue still uses harvest_price"

  - name: prevented_planting_indemnity
    trigger: "on PreventedPlantingClaim approve (POST /prevented-planting-claims/{id}/approve)"
    algorithm: aggregation
    formula: |
      pp_indemnity_per_acre_cents = round(dollar_liability_per_acre_cents * pp_coverage_factor)
      pp_indemnity_cents = round(pp_indemnity_per_acre_cents * claimed_prevented_acres * share)
    input_set: "PreventedPlantingClaim.claimed_prevented_acres + Unit.share + CoverageElection.dollar_liability_per_acre_cents + CommodityProgram.pp_coverage_factor"
    constants: {}
    precision: "per-acre cents rounded first, then multiplied by claimed_prevented_acres*share and rounded"

  - name: agent_commission
    trigger: "on CoverageElection create / total_premium recompute (commission EARNED when policy activates)"
    algorithm: threshold
    formula: |
      # ORDERED dependency: total_premium_cents must be finalized BEFORE the tier is chosen,
      # because the tier is keyed on the very total it scales.
      tp = total_premium_cents
      if   tp <  500000:  commission_rate = 0.10     # < $5,000.00
      elif tp <= 1000000: commission_rate = 0.08     # $5,000.00 .. $10,000.00 inclusive
      else:               commission_rate = 0.06     # > $10,000.00
      commission_cents = round(total_premium_cents * commission_rate)
    input_set: "Single CoverageElection.total_premium_cents"
    constants:
      TIER_1_CEIL_CENTS: 500000
      TIER_2_CEIL_CENTS: 1000000
      RATE_TIER_1: 0.10
      RATE_TIER_2: 0.08
      RATE_TIER_3: 0.06
    precision: "commission_cents: integer round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, coverage_level in {0.50,0.55,0.60,0.65,0.70,0.75,0.80,0.85}, numeric fields positive where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals current parent.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /acreage-reports, POST /coverage-elections/{id}/void"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the approving/denying LossAdjuster's agent_id is NOT the policy's selling agent_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /loss-claims/{id}/approve, /deny; POST /prevented-planting-claims/{id}/approve, /deny"

  - priority: 8
    category: business_safety
    check: "Acting LossAdjuster on a loss-claim return/approve/deny is the claim's assigned_adjuster_id"
    error_id: ERR_ADJUSTER_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /loss-claims/{id}/return, /approve, /deny"

  - priority: 9
    category: business_temporal
    check: "On loss-claim submit, if election plan_type is RP or RP_HPE, the CommodityProgram.harvest_price must be published"
    error_id: ERR_HARVEST_PRICE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /loss-claims/{id}/submit"

  - priority: 10
    category: business_referential
    check: "On coverage-election create, the referenced CommodityProgram is OPEN"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: "POST /coverage-elections"

  - priority: 11
    category: business_temporal
    check: "On acreage-report file, the program acreage_reporting_deadline has not passed (current clock <= deadline)"
    error_id: ERR_ACREAGE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /acreage-reports"

  - priority: 12
    category: business_constraint
    check: "On acreage-report file, planted_acres + prevented_acres <= Unit.acres"
    error_id: ERR_ACREAGE_OVER_REPORTED
    http_status: 422
    applies_to: "POST /acreage-reports"

  - priority: 13
    category: business_constraint
    check: "On prevented-planting-claim submit, claimed_prevented_acres <= Unit.prevented_acres"
    error_id: ERR_PP_ACRES_EXCEED_REPORTED
    http_status: 422
    applies_to: "POST /prevented-planting-claims/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Identity ----
  - method: POST
    path: "/producers"
    description: "Register a producer (insured)"
    roles: [RmaAdmin, Agent]
    code: 201
    input: [name, tax_id]
    output: Producer
    side_effects: []

  - method: POST
    path: "/agents"
    description: "Register a selling agent or loss adjuster"
    roles: [RmaAdmin]
    code: 201
    input: [name, license_number, role_kind]
    output: Agent
    side_effects: []

  # ---- CommodityProgram ----
  - method: POST
    path: "/commodity-programs"
    description: "Create an actuarial commodity program (DRAFT)"
    roles: [RmaAdmin]
    code: 201
    input: [crop_code, county_code, crop_year, projected_price, base_premium_rate, pp_coverage_factor, final_planting_date, acreage_reporting_deadline]
    output: CommodityProgram
    side_effects: ["status=DRAFT, harvest_price_published=false"]

  - method: GET
    path: "/commodity-programs/{id}"
    description: "Fetch a commodity program"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: CommodityProgram
    side_effects: []

  - method: GET
    path: "/commodity-programs"
    description: "List commodity programs"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["crop_code?", "county_code?", "crop_year?", "limit?", "offset?"]
    output: CommodityProgram[]
    side_effects: []

  - method: POST
    path: "/commodity-programs/{id}/open"
    description: "Open a program for sales"
    roles: [RmaAdmin]
    code: 200
    input: []
    output: CommodityProgram
    side_effects: ["status DRAFT->OPEN", "increments CommodityProgram.version by 1"]

  - method: POST
    path: "/commodity-programs/{id}/close"
    description: "Close a program to new elections"
    roles: [RmaAdmin]
    code: 200
    input: []
    output: CommodityProgram
    side_effects: ["status OPEN->CLOSED", "increments CommodityProgram.version by 1"]

  - method: POST
    path: "/commodity-programs/{id}/publish-harvest-price"
    description: "Publish the discovered harvest price (test-driving + business: harvest-price discovery event)"
    roles: [RmaAdmin]
    code: 200
    input: [harvest_price]
    output: CommodityProgram
    side_effects: ["sets harvest_price, harvest_price_published=true", "increments CommodityProgram.version by 1"]

  # ---- Policy ----
  - method: POST
    path: "/policies"
    description: "Create a policy for a producer with a selling agent"
    roles: [Agent]
    code: 201
    input: [producer_id, agent_id, crop_year]
    output: Policy
    side_effects: ["status=DRAFT, all ledger fields=0"]

  - method: GET
    path: "/policies/{id}"
    description: "Fetch a policy with computed ledger fields"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "List policies, filterable by producer or agent"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["producer_id?", "agent_id?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/policies/{id}/coverage-elections"
    description: "List coverage elections under a policy (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: CoverageElection[]
    side_effects: []

  - method: POST
    path: "/policies/{id}/activate"
    description: "Activate a policy; earns agent commissions"
    roles: [Agent]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "status DRAFT->ACTIVE"
      - "Creates/finalizes AgentCommission (EARNED) for each ELECTED election via agent_commission calc"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/cancel"
    description: "Cancel an active policy; cascades election void + commission clawback"
    roles: [Agent]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "status ACTIVE->CANCELLED"
      - "Cascade: non-VOID elections -> VOID -> Units VOID -> AgentCommission CLAWED_BACK"
      - "Recompute Policy premium ledger"
      - "increments Policy.version by 1"

  # ---- CoverageElection ----
  - method: POST
    path: "/coverage-elections"
    description: "Create a coverage election under a policy"
    roles: [Agent]
    code: 201
    input: [policy_id, commodity_program_id, plan_type, aph_yield, coverage_level]
    output: CoverageElection
    side_effects:
      - "Compute yield_guarantee_bu, dollar_liability_per_acre_cents, subsidy_factor"
      - "total_premium_cents=0 until units added"

  - method: GET
    path: "/coverage-elections/{id}"
    description: "Fetch a coverage election with computed premium fields"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: CoverageElection
    side_effects: []

  - method: GET
    path: "/coverage-elections"
    description: "List coverage elections, filterable by policy or program (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["policy_id?", "commodity_program_id?", "limit?", "offset?"]
    output: CoverageElection[]
    side_effects: []

  - method: GET
    path: "/coverage-elections/{id}/units"
    description: "List units under an election (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: POST
    path: "/coverage-elections/{id}/void"
    description: "Void an election (OCC on owning policy)"
    roles: [Agent]
    code: 200
    input: [expected_policy_version]
    output: CoverageElection
    side_effects:
      - "status ELECTED->VOID"
      - "Cascade: Units PENDING->VOID; AgentCommission EARNED->CLAWED_BACK"
      - "Recompute owning Policy premium ledger"
      - "increments Policy.version by 1"

  # ---- Unit ----
  - method: POST
    path: "/units"
    description: "Add an insurable unit to an election; recomputes premium ledger"
    roles: [Agent]
    code: 201
    input: [coverage_election_id, unit_number, acres, share]
    output: Unit
    side_effects:
      - "Recompute CoverageElection.total_premium_cents (total_premium calc), subsidy_split, owning Policy premium ledger"

  - method: GET
    path: "/units/{id}"
    description: "Fetch a unit"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List units, filterable by coverage election (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["coverage_election_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: GET
    path: "/units/{id}/acreage-reports"
    description: "List acreage reports for a unit (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: AcreageReport[]
    side_effects: []

  # ---- AcreageReport ----
  - method: POST
    path: "/acreage-reports"
    description: "File an acreage report against a unit (OCC on unit); ACCEPTED on success"
    roles: [Agent]
    code: 201
    input: [unit_id, planted_acres, prevented_acres, "planting_date?", expected_unit_version]
    output: AcreageReport
    side_effects:
      - "Any prior ACCEPTED report on the unit -> SUPERSEDED; this report -> ACCEPTED"
      - "Set late_planted = planting_date > program.final_planting_date"
      - "Unit PENDING->REPORTED; set Unit.planted_acres/prevented_acres"
      - "Bubble up: election ELECTED->REPORTED if all units REPORTED"
      - "Recompute Policy.total_insured_acres; increments Unit.version by 1"

  - method: GET
    path: "/acreage-reports/{id}"
    description: "Fetch an acreage report"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: AcreageReport
    side_effects: []

  - method: GET
    path: "/acreage-reports"
    description: "List acreage reports, filterable by unit (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["unit_id?", "limit?", "offset?"]
    output: AcreageReport[]
    side_effects: []

  # ---- LossClaim ----
  - method: POST
    path: "/loss-claims"
    description: "File a notice of loss (DRAFT) against a unit"
    roles: [Agent]
    code: 201
    input: [unit_id, harvest_date, production_to_count_bu, assigned_adjuster_id]
    output: LossClaim
    side_effects: ["status=DRAFT, indemnity_cents=0, revision_count=0"]

  - method: GET
    path: "/loss-claims/{id}"
    description: "Fetch a loss claim"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: LossClaim
    side_effects: []

  - method: GET
    path: "/loss-claims"
    description: "List loss claims, filterable by unit or assigned adjuster (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["unit_id?", "assigned_adjuster_id?", "limit?", "offset?"]
    output: LossClaim[]
    side_effects: []

  - method: POST
    path: "/loss-claims/{id}/submit"
    description: "Submit a loss claim for adjuster review"
    roles: [Agent]
    code: 200
    input: []
    output: LossClaim
    side_effects: ["status DRAFT->UNDER_REVIEW", "Unit REPORTED->ACTIVE"]

  - method: POST
    path: "/loss-claims/{id}/return"
    description: "Adjuster returns claim to producer/agent for rework (revision loop)"
    roles: [LossAdjuster]
    code: 200
    input: []
    output: LossClaim
    side_effects: ["status UNDER_REVIEW->DRAFT", "increments LossClaim.revision_count by 1"]

  - method: POST
    path: "/loss-claims/{id}/approve"
    description: "Adjuster approves; computes indemnity, cascades to election and policy"
    roles: [LossAdjuster]
    code: 200
    input: []
    output: LossClaim
    side_effects:
      - "Set indemnity_cents (yp_or_rp_indemnity calc)"
      - "Cascade: election REPORTED->INDEMNIFIED; add indemnity into Policy.total_indemnity_cents; Unit->SETTLED"

  - method: POST
    path: "/loss-claims/{id}/deny"
    description: "Adjuster denies the claim"
    roles: [LossAdjuster]
    code: 200
    input: []
    output: LossClaim
    side_effects: ["status UNDER_REVIEW->DENIED", "Unit->SETTLED if no other open claim"]

  - method: POST
    path: "/loss-claims/{id}/pay"
    description: "RMA disburses an approved indemnity"
    roles: [RmaAdmin]
    code: 200
    input: []
    output: LossClaim
    side_effects: ["status APPROVED->PAID"]

  # ---- PreventedPlantingClaim ----
  - method: POST
    path: "/prevented-planting-claims"
    description: "File a prevented-planting claim against a unit"
    roles: [Agent]
    code: 201
    input: [unit_id, claimed_prevented_acres, cause]
    output: PreventedPlantingClaim
    side_effects: ["status=DRAFT, pp_indemnity_cents=0"]

  - method: GET
    path: "/prevented-planting-claims/{id}"
    description: "Fetch a prevented-planting claim"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: []
    output: PreventedPlantingClaim
    side_effects: []

  - method: GET
    path: "/prevented-planting-claims"
    description: "List prevented-planting claims, filterable by unit (FK reverse-reachability)"
    roles: [RmaAdmin, Agent, LossAdjuster]
    code: 200
    input: ["unit_id?", "limit?", "offset?"]
    output: PreventedPlantingClaim[]
    side_effects: []

  - method: POST
    path: "/prevented-planting-claims/{id}/submit"
    description: "Submit a prevented-planting claim for review"
    roles: [Agent]
    code: 200
    input: []
    output: PreventedPlantingClaim
    side_effects: ["status DRAFT->UNDER_REVIEW", "Unit REPORTED->ACTIVE"]

  - method: POST
    path: "/prevented-planting-claims/{id}/approve"
    description: "Adjuster approves; computes pp indemnity, cascades to election and policy"
    roles: [LossAdjuster]
    code: 200
    input: []
    output: PreventedPlantingClaim
    side_effects:
      - "Set pp_indemnity_cents (prevented_planting_indemnity calc)"
      - "Cascade: election REPORTED->INDEMNIFIED; add pp_indemnity into Policy.total_indemnity_cents; Unit->SETTLED"

  - method: POST
    path: "/prevented-planting-claims/{id}/deny"
    description: "Adjuster denies the prevented-planting claim"
    roles: [LossAdjuster]
    code: 200
    input: []
    output: PreventedPlantingClaim
    side_effects: ["status UNDER_REVIEW->DENIED", "Unit->SETTLED if no other open claim"]

  # ---- AgentCommission ----
  - method: GET
    path: "/agent-commissions/{id}"
    description: "Fetch a commission ledger entry"
    roles: [RmaAdmin, Agent]
    code: 200
    input: []
    output: AgentCommission
    side_effects: []

  - method: GET
    path: "/agent-commissions"
    description: "List commissions, filterable by agent or coverage election (FK reverse-reachability)"
    roles: [RmaAdmin, Agent]
    code: 200
    input: ["agent_id?", "coverage_election_id?", "limit?", "offset?"]
    output: AgentCommission[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; gates acreage deadline + late planting)"
    roles: [RmaAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server 'now' set to to_iso8601 for all temporal checks"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN,              http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND,             http: 404, condition: "Referenced path or FK resource does not exist" }
  - { id: ERR_INVALID_REQUEST,       http: 422, condition: "Malformed body: missing required field, bad enum, coverage_level not in allowed set, non-positive where positive required" }
  - { id: ERR_STALE_VERSION,         http: 412, condition: "expected_<parent>_version does not equal current parent.version (OCC)" }
  - { id: ERR_INVALID_STATE,         http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "LossAdjuster approving/denying a claim is the policy's selling agent" }
  - { id: ERR_ADJUSTER_NOT_ASSIGNED, http: 409, condition: "LossAdjuster acting on a loss claim is not the claim's assigned_adjuster_id" }
  - { id: ERR_HARVEST_PRICE_UNAVAILABLE, http: 409, condition: "Loss-claim submit on RP/RP_HPE election before harvest price published" }
  - { id: ERR_PROGRAM_NOT_OPEN,      http: 409, condition: "Coverage-election create references a program not in OPEN status" }
  - { id: ERR_PROGRAM_HAS_OPEN_ELECTIONS, http: 409, condition: "Closing a program that still has ELECTED coverage elections" }
  - { id: ERR_ACREAGE_DEADLINE_PASSED, http: 409, condition: "Acreage report filed after the program acreage_reporting_deadline" }
  - { id: ERR_ACREAGE_OVER_REPORTED, http: 422, condition: "planted_acres + prevented_acres exceeds Unit.acres" }
  - { id: ERR_PP_ACRES_EXCEED_REPORTED, http: 422, condition: "claimed_prevented_acres exceeds Unit.prevented_acres" }
  - { id: ERR_ELECTION_ALREADY_REPORTED, http: 409, condition: "Voiding an election that already has an ACCEPTED acreage report on a unit" }
  - { id: ERR_POLICY_HAS_NO_ELECTIONS, http: 409, condition: "Activating a policy with no ELECTED coverage elections" }
  - { id: ERR_POLICY_HAS_OPEN_CLAIMS, http: 409, condition: "Cancelling a policy with claims in UNDER_REVIEW or APPROVED" }
  - { id: ERR_UNIT_NOT_REPORTED,     http: 409, condition: "Submitting a claim against a unit not yet REPORTED/ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RmaAdmin
    description: "USDA/RMA operator: manages commodity programs, publishes harvest prices, disburses indemnities, sets the clock"
    identity: opaque
    exclusive_operations:
      - "POST /agents — register agents/adjusters"
      - "POST /commodity-programs and /open /close /publish-harvest-price"
      - "POST /loss-claims/{id}/pay — disburse indemnity"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /producers (with Agent)"
      - "GET on all resources"

  - name: Agent
    description: "Selling agent of record: creates policies, coverage elections, units, files acreage reports and notices of loss"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /policies, /policies/{id}/activate, /policies/{id}/cancel"
      - "POST /coverage-elections, /coverage-elections/{id}/void"
      - "POST /units"
      - "POST /acreage-reports"
      - "POST /loss-claims, /loss-claims/{id}/submit"
      - "POST /prevented-planting-claims, /prevented-planting-claims/{id}/submit"
    shared_operations:
      - "POST /producers (with RmaAdmin)"
      - "GET on policies, elections, units, claims, commodity-programs, agent-commissions"

  - name: LossAdjuster
    description: "Independent loss adjuster: reviews, returns, approves, and denies loss and prevented-planting claims. Segregated from the selling agent."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /loss-claims/{id}/return, /approve, /deny"
      - "POST /prevented-planting-claims/{id}/approve, /deny"
    shared_operations:
      - "GET on policies, elections, units, claims, commodity-programs"
