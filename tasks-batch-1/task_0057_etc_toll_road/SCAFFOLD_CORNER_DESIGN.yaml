scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_defaults
        claim_type: Creation
        grounds: [entities.Account.fields.status, entities.Account.fields.balance_cents]
        distinguishing_aspect: "POST /etc/accounts with only required fields returns 201 with status=ACTIVE, balance_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Dee", home_state_code: "NJ" }
              as: AccountHolder
              captures: { a_id: $.data.id }
          assert:
            - "response http_status == 201"
            - "Account.${a_id}.status == ACTIVE"
            - "Account.${a_id}.balance_cents == 0"
            - "Account.${a_id}.version == 1"

      - name: account_defaults_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Account.fields.low_balance_threshold_cents, entities.Account.fields.reload_policy]
        distinguishing_aspect: "Omitting low_balance_threshold_cents/reload_policy yields defaults 1000 and FIXED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Def", home_state_code: "NY" }
              as: AccountHolder
              captures: { d_id: $.data.id }
          assert:
            - "Account.${d_id}.low_balance_threshold_cents == 1000"
            - "Account.${d_id}.reload_policy == FIXED"
            - "Account.${d_id}.auto_reload_enabled == false"

      - name: account_get_not_found
        claim_type: Not Found
        grounds: [entities.Account]
        distinguishing_aspect: "GET /etc/accounts/{unknown} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /etc/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SystemAdmin
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http_status == 404"

      - name: account_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Account.fields.holder_name]
        distinguishing_aspect: "POST /etc/accounts without holder_name returns ERR_VALIDATION 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /etc/accounts"
              payload: { home_state_code: "NY" }
              as: AccountHolder
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 422"

      - name: vehicle_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Vehicle.fields.registration_status]
        distinguishing_aspect: "Vehicle created with registration_status=REGISTERED regardless of any client-supplied value; id/created_at server-minted."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Veh", home_state_code: "NY" }
              as: TollOperator
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /etc/vehicles"
              payload: { account_id: "${acc}", plate_number: "ZZ1", plate_state_code: "NY" }
              as: TollOperator
              captures: { v: $.data.id }
          assert:
            - "Vehicle.${v}.registration_status == REGISTERED"

      - name: ledger_entry_immutable_no_version
        claim_type: Immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry uses common_fields:false — it carries id and created_at only, no version field, and has no update endpoint."
        test_recipe:
          setup: ["An account with at least one ledger entry from a manual credit."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Led", home_state_code: "NY" }
              as: TollOperator
              captures: { la: $.data.id }
            - call: "POST /etc/accounts/${la}/credit"
              payload: { amount_cents: 500 }
              as: TollOperator
          trigger:
            - call: "GET /etc/accounts/${la}/ledger-entries"
              payload: {}
              as: TollOperator
          assert:
            - "the RELOAD_CREDIT entry has amount_cents == 500 and balance_after_cents == 500"
            - "no 'version' key appears on any LedgerEntry"

      - name: vehicle_wrong_parent_account_not_found
        claim_type: Parent Relationships
        grounds: [entities.Vehicle.fields.account_id]
        distinguishing_aspect: "Creating a Vehicle with a nonexistent account_id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /etc/vehicles"
              payload: { account_id: "00000000-0000-4000-8000-000000000000", plate_number: "NO1", plate_state_code: "NY" }
              as: TollOperator
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: flat_fk_cross_reference_integrity_binding
        claim_type: flat
        grounds: [entities.Transponder.fields.account_id, entities.Vehicle.fields.account_id]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / binding_requires_account_active
          rationale: "FK cross-reference integrity on bind (same-account requirement and existence) is exercised by the binding difficulty instances and the ownership-mismatch corner below."

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: price_already_priced_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TollTransaction.PENDING_to_PRICED]
        distinguishing_aspect: "Pricing a transaction already PRICED returns ERR_INVALID_STATE 409; no second debit."
        test_recipe:
          setup: ["A transponder read priced once already."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ip", home_state_code: "NY" }
              as: TollOperator
              captures: { ip: $.data.id }
            - call: "POST /etc/accounts/${ip}/credit"
              payload: { amount_cents: 5000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${ip}", plate_number: "IP1", plate_state_code: "NY" }
              as: TollOperator
              captures: { ipv: $.data.id, ipvv: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${ip}", serial: "TP-IP" }
              as: TollOperator
              captures: { iptp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${iptp}", vehicle_id: "${ipv}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${ipvv}" }
              as: AccountHolder
              as_user_id: "${ip}"
            - call: "POST /etc/plazas"
              payload: { name: "Pip", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pip: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pip}", read_method: "TRANSPONDER", read_at: "2026-03-01T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${iptp}" }
              as: TollOperator
              captures: { iptxn: $.data.id }
            - call: "POST /etc/toll-transactions/${iptxn}/price"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/toll-transactions/${iptxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Account.${ip}.balance_cents == 4600"

      - name: contest_already_contested_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Violation.ASSESSED_to_CONTESTED]
        distinguishing_aspect: "Contesting a CONTESTED violation a second time returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A violation already CONTESTED."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Cc", home_state_code: "NY" }
              as: TollOperator
              captures: { cc: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${cc}", plate_number: "CC1", plate_state_code: "NY" }
              as: TollOperator
              captures: { ccv: $.data.id }
            - call: "POST /etc/plazas"
              payload: { name: "Pcc", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { pcc: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pcc}", read_method: "PLATE", read_at: "2026-03-02T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "CC1", plate_state_code: "NY" }
              as: TollOperator
              captures: { cctxn: $.data.id }
            - call: "POST /etc/toll-transactions/${cctxn}/price"
              payload: {}
              as: TollOperator
            - call: "POST /etc/violations"
              payload: { toll_transaction_id: "${cctxn}" }
              as: TollOperator
              captures: { ccviol: $.data.id }
            - call: "POST /etc/violations/${ccviol}/contest"
              payload: { dispute_reason: "first" }
              as: AccountHolder
              as_user_id: "${cc}"
          trigger:
            - call: "POST /etc/violations/${ccviol}/contest"
              payload: { dispute_reason: "second" }
              as: AccountHolder
              as_user_id: "${cc}"
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: account_initial_state_active
        claim_type: Initial State
        grounds: [state_machines.Account.initial_state]
        excluded_because:
          difficulty_instance: dual_variant_calc / auto_reload_fixed_vs_restore_to_target
          rationale: "Account initial ACTIVE state is asserted in difficulty instances that begin from a freshly created ACTIVE account."

      - name: closed_account_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Account.SUSPENDED_to_CLOSED]
        distinguishing_aspect: "A CLOSED account cannot be reinstated; POST /etc/accounts/{id}/reinstate on a CLOSED account returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An account suspended, then closed (zero balance, no fines)."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Cl", home_state_code: "NY" }
              as: TollOperator
              captures: { cl: $.data.id }
            - call: "POST /etc/accounts/${cl}/suspend"
              payload: {}
              as: TollOperator
            - call: "POST /etc/accounts/${cl}/close"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/accounts/${cl}/reinstate"
              payload: {}
              as: TollOperator
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: suspend_account_deactivates_bound_transponders
        claim_type: Side Effect Execution
        grounds: [state_machines.Account.ACTIVE_to_SUSPENDED, state_machines.Transponder.BOUND_to_DEACTIVATED]
        distinguishing_aspect: "Suspending an account flips its BOUND transponder to DEACTIVATED and ends the ACTIVE binding (cross-entity cascade)."
        test_recipe:
          setup: ["Account ACTIVE with a transponder bound to a vehicle."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Sd", home_state_code: "NY" }
              as: TollOperator
              captures: { sd: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${sd}", plate_number: "SD1", plate_state_code: "NY" }
              as: TollOperator
              captures: { sdv: $.data.id, sdvv: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${sd}", serial: "TP-SD" }
              as: TollOperator
              captures: { sdtp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${sdtp}", vehicle_id: "${sdv}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${sdvv}" }
              as: AccountHolder
              as_user_id: "${sd}"
          trigger:
            - call: "POST /etc/accounts/${sd}/suspend"
              payload: {}
              as: TollOperator
          assert:
            - "Account.${sd}.status == SUSPENDED"
            - "Transponder.${sdtp}.status == DEACTIVATED"
            - "the binding for ${sdtp} has status == ENDED"

      - name: violation_creation_cascades_account_delinquent
        claim_type: Cross-entity
        grounds: [state_machines.TollTransaction.UNSETTLED_to_IN_VIOLATION, state_machines.Account.ACTIVE_to_DELINQUENT]
        excluded_because:
          difficulty_instance: transitive_cascade / accept_dispute_writeoff_delinquent_clears_depth3
          rationale: "The ACTIVE -> DELINQUENT cascade on violation creation is set up and relied upon by that depth-3 cascade instance."

      - name: pay_violation_settles_linked_transaction
        claim_type: Compensation
        grounds: [state_machines.Violation.ASSESSED_to_SETTLED, state_machines.TollTransaction.IN_VIOLATION_to_SETTLED]
        excluded_because:
          difficulty_instance: compensating_invariant / violation_outstanding_fines_conservation
          rationale: "Paying a violation cascading the linked transaction to SETTLED is asserted in that invariant instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: transponder_offpeak_base_only
        claim_type: Correct Result
        grounds: [calculations.toll_pricing]
        distinguishing_aspect: "Off-peak 2-axle transponder read tolls exactly base_rate_cents (400), no peak multiplier, no plate surcharge."
        test_recipe:
          setup: ["Account funded, transponder bound; off-peak plaza base 400."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Cr", home_state_code: "NY" }
              as: TollOperator
              captures: { cr: $.data.id }
            - call: "POST /etc/accounts/${cr}/credit"
              payload: { amount_cents: 5000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${cr}", plate_number: "CR1", plate_state_code: "NY" }
              as: TollOperator
              captures: { crv: $.data.id, crvv: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${cr}", serial: "TP-CR" }
              as: TollOperator
              captures: { crtp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${crtp}", vehicle_id: "${crv}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${crvv}" }
              as: AccountHolder
              as_user_id: "${cr}"
            - call: "POST /etc/plazas"
              payload: { name: "Pcr", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pcr: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pcr}", read_method: "TRANSPONDER", read_at: "2026-03-03T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${crtp}" }
              as: TollOperator
              captures: { crtxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${crtxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "TollTransaction.${crtxn}.gross_toll_cents == 400"
            - "TollTransaction.${crtxn}.toll_cents == 400"

      - name: interop_home_share_fee_withheld
        claim_type: Constants Applied
        grounds: [calculations.interop_home_share, entities.InteropAgency.fields.settlement_fee_bps]
        distinguishing_aspect: "A 750-cent plate toll posted by an agency with settlement_fee_bps=200 debits the account 735 (withholds 15)."
        test_recipe:
          setup: ["An active interop agency (fee 200bps); a vehicle whose plate the agency posts a peak 2-axle read for."]
          setup_api_calls:
            - call: "POST /etc/interop-agencies"
              payload: { name: "EZ-NJ", state_code: "NJ", settlement_fee_bps: 200, active: true }
              as: SystemAdmin
              captures: { ag: $.data.id }
            - call: "POST /etc/accounts"
              payload: { holder_name: "Io", home_state_code: "NY" }
              as: TollOperator
              captures: { io: $.data.id }
            - call: "POST /etc/accounts/${io}/credit"
              payload: { amount_cents: 5000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${io}", plate_number: "IO1", plate_state_code: "NY" }
              as: TollOperator
              captures: { iov: $.data.id }
            - call: "POST /etc/plazas"
              payload: { name: "Pio", state_code: "NJ", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { pio: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pio}", read_method: "PLATE", read_at: "2026-03-04T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "IO1", plate_state_code: "NY", interop_agency_id: "${ag}" }
              as: InteropClerk
              captures: { iotxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${iotxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "TollTransaction.${iotxn}.toll_cents == 750"
            - "Account.${io}.balance_cents == 4265"

      - name: account_outstanding_fines_excludes_settled
        claim_type: Input Set Filtering
        grounds: [calculations.account_outstanding_fines]
        excluded_because:
          difficulty_instance: compensating_invariant / violation_outstanding_fines_conservation
          rationale: "Outstanding-fines aggregation excluding SETTLED is asserted (outstanding -> 0 after pay) in that instance."

      - name: violation_fine_tier_escalation_step
        claim_type: Constants Applied
        grounds: [calculations.violation_fine]
        excluded_because:
          difficulty_instance: non_linear_state_machine / violation_cyclic_contest_reject_reissue
          rationale: "Tier step (+1500) producing fine_total 4750 at tier 2 is asserted there."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_transponder_serial_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "Creating a second transponder with an existing serial returns ERR_DUPLICATE_SERIAL 409."
        test_recipe:
          setup: ["An account with one transponder serial TP-DUP."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Du", home_state_code: "NY" }
              as: TollOperator
              captures: { du: $.data.id }
            - call: "POST /etc/transponders"
              payload: { account_id: "${du}", serial: "TP-DUP" }
              as: TollOperator
          trigger:
            - call: "POST /etc/transponders"
              payload: { account_id: "${du}", serial: "TP-DUP" }
              as: TollOperator
          assert:
            - "response error_id == ERR_DUPLICATE_SERIAL"
            - "response http_status == 409"

      - name: ownership_mismatch_on_binding
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", entities.Transponder.fields.account_id]
        distinguishing_aspect: "Binding a transponder of account A to a vehicle of account B returns ERR_OWNERSHIP_MISMATCH 409."
        test_recipe:
          setup: ["Two active accounts; transponder of A, vehicle of B."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Oa", home_state_code: "NY" }
              as: TollOperator
              captures: { oa: $.data.id }
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ob", home_state_code: "NY" }
              as: TollOperator
              captures: { ob: $.data.id }
            - call: "POST /etc/transponders"
              payload: { account_id: "${oa}", serial: "TP-OA" }
              as: TollOperator
              captures: { oatp: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${ob}", plate_number: "OBV", plate_state_code: "NY" }
              as: TollOperator
              captures: { obv: $.data.id, obvv: $.data.version }
          trigger:
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${oatp}", vehicle_id: "${obv}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${obvv}" }
              as: AccountHolder
              as_user_id: "${oa}"
          assert:
            - "response error_id == ERR_OWNERSHIP_MISMATCH"

      - name: invalid_occupancy_zero_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", entities.HovWindow.fields.declared_occupants]
        distinguishing_aspect: "Declaring an HOV window with declared_occupants=0 returns ERR_INVALID_OCCUPANCY 422."
        test_recipe:
          setup: ["An hov_capable vehicle."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Oc", home_state_code: "NY" }
              as: TollOperator
              captures: { oc: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${oc}", plate_number: "OC1", plate_state_code: "NY", hov_capable: true }
              as: TollOperator
              captures: { ocv: $.data.id }
          trigger:
            - call: "POST /etc/hov-windows"
              payload: { vehicle_id: "${ocv}", window_from: "2026-03-05T07:00:00Z", window_to: "2026-03-05T09:00:00Z", declared_occupants: 0 }
              as: AccountHolder
              as_user_id: "${oc}"
          assert:
            - "response error_id == ERR_INVALID_OCCUPANCY"
            - "response http_status == 422"

      - name: interop_agency_inactive_rejected_at_post
        claim_type: Conditional validation
        grounds: ["validations[priority=14]", entities.InteropAgency.fields.active]
        distinguishing_aspect: "Posting an interop read referencing an inactive agency returns ERR_INTEROP_AGENCY_INACTIVE 409."
        test_recipe:
          setup: ["An inactive interop agency; a vehicle and plaza."]
          setup_api_calls:
            - call: "POST /etc/interop-agencies"
              payload: { name: "Old", state_code: "PA", active: false }
              as: SystemAdmin
              captures: { ina: $.data.id }
            - call: "POST /etc/accounts"
              payload: { holder_name: "In", home_state_code: "NY" }
              as: TollOperator
              captures: { inacc: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${inacc}", plate_number: "IN1", plate_state_code: "NY" }
              as: TollOperator
            - call: "POST /etc/plazas"
              payload: { name: "Pin", state_code: "PA", base_rate_cents: 400 }
              as: TollOperator
              captures: { pin: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pin}", read_method: "PLATE", read_at: "2026-03-06T08:00:00Z", is_peak: false, declared_axles: 2, plate_number: "IN1", plate_state_code: "NY", interop_agency_id: "${ina}" }
              as: InteropClerk
          assert:
            - "response error_id == ERR_INTEROP_AGENCY_INACTIVE"

      - name: close_account_with_balance_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=16]"]
        distinguishing_aspect: "Closing a SUSPENDED account with nonzero balance returns ERR_BALANCE_NONZERO 409."
        test_recipe:
          setup: ["A suspended account holding 500 balance."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Cb", home_state_code: "NY" }
              as: TollOperator
              captures: { cb: $.data.id }
            - call: "POST /etc/accounts/${cb}/credit"
              payload: { amount_cents: 500 }
              as: TollOperator
            - call: "POST /etc/accounts/${cb}/suspend"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/accounts/${cb}/close"
              payload: {}
              as: TollOperator
          assert:
            - "response error_id == ERR_BALANCE_NONZERO"

      - name: violation_not_eligible_transponder_read
        claim_type: Violation → Error
