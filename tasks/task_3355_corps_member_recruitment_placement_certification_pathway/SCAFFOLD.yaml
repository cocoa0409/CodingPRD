    side_effects: ["Applies the ACTIVE -> EXITED_EARLY transition.", "Decrements PartnerDistrict.committed_placement_count and PartnerSchool.occupied_classrooms.", "Recomputes PartnerDistrict.invoice_amount_cents and re-evaluates the district fee ceiling."]
  - method: POST
    path: "/corps/placements/{id}/reinstate"
    description: "Reverse an early exit, restoring the placement and the district and school counters it released."
    roles: [PlacementCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["Applies the EXITED_EARLY -> ACTIVE transition.", "Increments PartnerDistrict.committed_placement_count and PartnerSchool.occupied_classrooms.", "Recomputes PartnerDistrict.invoice_amount_cents and Placement.employment_eligible."]
  - method: POST
    path: "/corps/certification-milestones"
    description: "Create one certification milestone for a corps member under a state pathway."
    roles: [CertificationOfficer]
    code: 201
    input: [corps_member_id, pathway_id, milestone_type, required_hours, "due_date?", expected_corps_member_version]
    output: CertificationMilestone
    side_effects: ["Sets progress_status = PENDING and verification_status = UNVERIFIED.", "When due_date is omitted, derives it as Region.term_start_date minus pathway.deadline_days_before_term.", "Increments CorpsMember.version by 1."]
  - method: GET
    path: "/corps/certification-milestones/{id}"
    description: "Read one certification milestone with its derived days_remaining and deadline_status."
    roles: [PlacementCoordinator, CertificationOfficer]
    code: 200
    input: []
    output: CertificationMilestone
    side_effects: []
  - method: POST
    path: "/corps/certification-milestones/{id}/start"
    description: "Begin work on a pending certification milestone."
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: CertificationMilestone
    side_effects: ["Applies the PENDING -> IN_PROGRESS transition."]
  - method: POST
    path: "/corps/certification-milestones/{id}/complete"
    description: "Mark a certification milestone complete; the milestone must not be past its state deadline."
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: CertificationMilestone
    side_effects: ["Applies the PENDING -> COMPLETED or IN_PROGRESS -> COMPLETED transition.", "Records completed_by_user_id from X-User-ID.", "Recomputes CorpsMember.readiness_score and CorpsMember.coursework_hours_completed."]
  - method: POST
    path: "/corps/certification-milestones/{id}/verify"
    description: "Verify or reject a completed certification milestone, advancing the member's verified hours."
    roles: [CertificationOfficer]
    code: 200
    input: [outcome]
    output: CertificationMilestone
    side_effects: ["Applies UNVERIFIED -> VERIFIED or UNVERIFIED -> REJECTED.", "Recomputes CorpsMember.certification_hours_verified and CorpsMember.readiness_score.", "Recomputes Placement.employment_eligible for the member's CONFIRMED and ACTIVE placements."]
  - method: POST
    path: "/corps/support-records"
    description: "Record a coaching session or a formal performance evaluation against a corps member."
    roles: [Coach]
    code: 201
    input: [corps_member_id, record_type, coach_user_id, session_start, session_end, effectiveness_score, "notes?"]
    output: SupportRecord
    side_effects: []
  - method: POST
    path: "/corps/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads the fixed startup default 2026-09-01T00:00:00Z and never falls back to real wall-clock time, so every deadline, expiry and window rule is deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Replaces the logical clock's current instant for every subsequent request."]
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent, or X-User-Role names no role declared in §1.7."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's §1.5 roles array."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, an enum value is not a declared member, or a numeric field falls outside its declared range."
  - id: ERR_REGION_NOT_FOUND
    http: 404
    condition: "The Region referenced by path or body does not exist."
  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: "The PartnerDistrict referenced by path or body does not exist."
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "The PartnerSchool referenced by path or body does not exist."
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "The Applicant referenced by the request body does not exist."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "The Application referenced by the request path does not exist."
  - id: ERR_PATHWAY_NOT_FOUND
    http: 404
    condition: "The CertificationPathway referenced by path or body does not exist."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "The CorpsMember referenced by path or body does not exist."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "The Placement referenced by the request path does not exist."
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "The CertificationMilestone referenced by the request path does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in the from-state required by the requested §1.2 transition, or a precondition clause of that transition is false."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The requested transition would leave a resource that already sits in one of its §1.2 terminal states."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "An offer response arrives after Application.offer_expires_at has passed on the logical clock."
  - id: ERR_DISTRICT_NOT_ACTIVE
    http: 409
    condition: "PartnerDistrict.agreement_status is DRAFT, SUSPENDED or EXPIRED where an ACTIVE agreement is required."
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "CorpsMember.service_status is ON_LEAVE or EXITED where ACTIVE service is required."
  - id: ERR_INSTITUTE_INCOMPLETE
    http: 409
    condition: "CorpsMember.institute_status is not COMPLETED where a completed pre-service institute is required."
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation of duties: X-User-ID equals Application.reviewed_by_user_id on a decision, or equals CertificationMilestone.completed_by_user_id on a verification."
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "The applicant already holds an Application whose status is neither REJECTED nor DECLINED."
  - id: ERR_SCHOOL_CAPACITY_EXCEEDED
    http: 409
    condition: "Confirming the placement would push the count of overlapping CONFIRMED or ACTIVE placements at the school to or past PartnerSchool.classroom_capacity, using closed term intervals."
  - id: ERR_COACH_SCHEDULE_OVERLAP
    http: 409
    condition: "A COACHING SupportRecord for the same coach_user_id already occupies a half-open interval that intersects the new record's half-open interval."
  - id: ERR_MILESTONE_PAST_DUE
    http: 422
    condition: "Completing the milestone would happen after CertificationMilestone.due_date on the logical clock."
  - id: ERR_PATHWAY_REGION_MISMATCH
    http: 422
    condition: "The milestone's CertificationPathway belongs to a region other than the region the owning corps member's application selected."
  - id: ERR_DISTRICT_BUDGET_EXCEEDED
    http: 402
    condition: "The district's recomputed invoice_amount_cents would exceed PartnerDistrict.fee_budget_cents once this placement is counted."
  - id: ERR_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "decision=SELECT was requested but Application.final_selection_score is below 85.00."
  - id: ERR_PRACTICE_HOURS_EXCEEDED
    http: 422
    condition: "The requested practice-hour delta would push CorpsMember.practice_teaching_hours above the 480-hour program ceiling."
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_corps_member_version on POST /corps/placements does not equal the stored CorpsMember.version."
  - id: ERR_STALE_DISTRICT_VERSION
    http: 412
    condition: "expected_district_version on POST /corps/partner-schools does not equal the stored PartnerDistrict.version."

roles:
  - name: PlatformAdmin
    description: "Program operator who owns regional configuration, district partnership agreements, partner schools and the logical clock."
    identity: "opaque"
    exclusive_operations: ["POST /corps/regions", "POST /corps/partner-districts", "POST /corps/partner-districts/{id}/status", "POST /corps/partner-schools", "POST /corps/certification-pathways", "POST /corps/_clock/set_current_utc"]
    shared_operations: ["GET /corps/partner-districts", "GET /corps/partner-districts/{id}", "GET /corps/partner-districts/{id}/partner-schools", "GET /corps/partner-schools/{id}", "GET /corps/partner-schools/{id}/placements", "GET /corps/certification-pathways", "GET /corps/certification-pathways/{id}", "GET /corps/certification-pathways/{id}/certification-milestones"]
  - name: SelectionManager
    description: "Recruiter who sources applicants and runs the selection pipeline from review through offer."
    identity: "opaque"
    exclusive_operations: ["POST /corps/applicants", "POST /corps/applications/{id}/review", "POST /corps/applications/{id}/return", "POST /corps/applications/{id}/decision", "POST /corps/applications/{id}/offer"]
    shared_operations: ["POST /corps/applications", "GET /corps/applications", "GET /corps/applications/{id}"]
  - name: Applicant
    description: "Recruited candidate who owns one application and is the only actor allowed to resubmit it or answer its offer."
    identity: "entity_backed:Applicant"
    exclusive_operations: ["POST /corps/applications/{id}/resubmit", "POST /corps/applications/{id}/offer/respond"]
    shared_operations: ["POST /corps/applications", "GET /corps/applications", "GET /corps/applications/{id}"]
  - name: PlacementCoordinator
    description: "Regional operator who matches corps members to partner schools and manages the two-year service status."
    identity: "opaque"
    exclusive_operations: ["POST /corps/placements", "POST /corps/placements/{id}/confirm", "POST /corps/placements/{id}/activate", "POST /corps/placements/{id}/early-exit", "POST /corps/placements/{id}/reinstate", "POST /corps/corps-members/{id}/leave", "POST /corps/corps-members/{id}/return-from-leave", "POST /corps/corps-members/{id}/exit"]
    shared_operations: ["GET /corps/corps-members", "GET /corps/corps-members/{id}", "GET /corps/corps-members/{id}/placements", "GET /corps/corps-members/{id}/certification-milestones", "GET /corps/corps-members/{id}/support-records", "GET /corps/partner-districts", "GET /corps/partner-districts/{id}", "GET /corps/partner-districts/{id}/partner-schools", "GET /corps/partner-schools/{id}", "GET /corps/partner-schools/{id}/placements", "GET /corps/certification-milestones/{id}"]
  - name: InstituteDirector
    description: "Pre-service summer institute operator who records practice-teaching hours and certifies institute completion."
    identity: "opaque"
    exclusive_operations: ["POST /corps/corps-members/{id}/institute/practice-hours", "POST /corps/corps-members/{id}/institute/complete"]
    shared_operations: ["GET /corps/corps-members", "GET /corps/corps-members/{id}"]
  - name: CertificationOfficer
    description: "State-certification specialist who creates, completes and verifies certification milestones."
    identity: "opaque"
    exclusive_operations: ["POST /corps/certification-milestones", "POST /corps/certification-milestones/{id}/start", "POST /corps/certification-milestones/{id}/complete", "POST /corps/certification-milestones/{id}/verify"]
    shared_operations: ["GET /corps/certification-pathways", "GET /corps/certification-pathways/{id}", "GET /corps/certification-pathways/{id}/certification-milestones", "GET /corps/corps-members", "GET /corps/corps-members/{id}", "GET /corps/corps-members/{id}/certification-milestones", "GET /corps/corps-members/{id}/placements", "GET /corps/corps-members/{id}/support-records", "GET /corps/certification-milestones/{id}"]
  - name: Coach
    description: "Support coach and evaluator who records coaching sessions and performance evaluations for corps members."
    identity: "opaque"
    exclusive_operations: ["POST /corps/support-records"]
    shared_operations: ["GET /corps/corps-members/{id}/support-records"]
