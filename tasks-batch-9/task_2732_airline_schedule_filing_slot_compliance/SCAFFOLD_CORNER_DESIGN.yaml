      - name: slot_holding_creation_with_unknown_carrier_returns_carrier_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.SlotHolding.fields.carrier_id
          - "errors.ERR_CARRIER_NOT_FOUND"
        distinguishing_aspect: |
          entity_topology is flat, so every cross-reference is a validated FK rather than a URL parent.
          A SlotHolding whose station_id and season_id both resolve but whose carrier_id does not must
          fail with ERR_CARRIER_NOT_FOUND (404) at priority 6 — the lowest-numbered of the three
          existence checks involved — proving the ladder is ordered by priority and not by payload key
          order.
        test_recipe:
          setup:
            - "FRA LEVEL_3_COORDINATED and Season W26 OPEN both exist; no Carrier row has been created."
          setup_api_calls:
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
