scenario: |
  2912. Television Series Development & Order Process (television network development department): pitch intake with agency relationships, packaging and rights availability checks, script development deals with writer attachment, step deals and option periods, budget and schedule feasibility assessment against the slot and platform economics, pilot order decisions with casting contingencies and location scouting, testing and research on pilots with audience scoring feeding order decisions, series order negotiation covering episode count, license fee, backend participation and ownership splits, development slate management with holding deals, turnaround rights and abandoned project accounting, greenlight approval workflow across creative, business affairs and finance

domain_name: television-series-development
api_prefix: ""   # flat top-level collections: /agencies, /slates, /pitches, /development-projects, ...

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions

  entity_topology: graph
  # graph: Writers, Agencies, Slates and Projects form a many-to-many web
  # (a Writer is represented by an Agency and may be held by a Slate while
  # writing for a Project on another Slate), and DevelopmentProject is
  # self-referential through predecessor_project_id (turnaround successors).

  state_machine_shape: cyclic
  # DealStep cycles DELIVERED -> NOTES_ISSUED -> DELIVERED; SeriesOrderNegotiation
  # cycles NETWORK_OFFER -> STUDIO_COUNTER -> NETWORK_OFFER; DevelopmentProject
  # cycles SCRIPT_COMPLETE -> ACTIVE_DEVELOPMENT; PilotOrder carries three
  # independent state dimensions (production_status x casting_status x
  # location_status) and GreenlightRequest is a three-way fork-join.

  relationship_patterns:
    - one_to_many          # Slate -> Pitch/Project/HoldingDeal; ScriptDeal -> DealStep
    - many_to_many         # Writer <-> Slate through HoldingDeal and ScriptDeal
    - self_referential     # DevelopmentProject.predecessor_project_id
    - cross_aggregate      # GreenlightRequest reads Slate + Negotiation + PilotOrder + TestScreening

  role_model: segregation_of_duties
  # The three greenlight committees are decided by three distinct roles, and one
  # X-User-ID may record at most one committee decision per GreenlightRequest.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  pagination_placement: >-
    On every response_type "array" the four pagination_fields are returned inside
    meta alongside api_request_id and api_request_timestamp - meta.limit,
    meta.offset, meta.total_count and meta.has_more - while data holds the page's
    rows. total_count counts the rows matching the request's filters, not the
    whole table, and has_more is true exactly when offset + len(data) <
    total_count.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: talent agency legal name
        constraints: non-blank, max 120 chars
      - name: agency_code
        type: string
        source: input
        description: short trading code for the agency
        constraints: unique across all Agency rows, uppercase A-Z, 2-6 chars
      - name: relationship_tier
        type: enum
        source: input
        description: standing of the network's relationship with this agency
        constraints: one of {PREMIER, STANDARD, PROBATION}
      - name: packaging_allowed
        type: boolean
        source: input
        description: whether this agency may submit pitches carrying packaging_elements
        default: false
      - name: annual_submission_cap
        type: integer
        source: input
        description: submissions this agency may make against one Slate season_year
        constraints: integer >= 1
      - name: effective_submission_cap
        type: integer
        source: computed
        description: >-
          PROBATION_SUBMISSION_CAP (1) when relationship_tier == PROBATION;
          annual_submission_cap + PREMIER_SUBMISSION_BONUS (2) when PREMIER;
          annual_submission_cap when STANDARD
      - name: submissions_used_count
        type: integer
        source: computed
        description: >-
          count of Pitch rows with agency_id == this.id whose slate_id resolves to a
          Slate with the same season_year as the Slate named in the request under
          evaluation, and whose status IN {SUBMITTED, COVERED, ADVANCED}; a PASSED
          pitch is forgiven and stops consuming the agency's annual allotment

  - name: Slate
    parent: null
    common_fields: true
    fields:
      - name: platform
        type: enum
        source: input
        description: distribution platform whose economics govern this slate
        constraints: one of {BROADCAST, CABLE, STREAMING}
      - name: season_year
        type: integer
        source: input
        description: broadcast season the slate serves
        constraints: integer between 2026 and 2035
      - name: total_dev_budget_cents
        type: integer
        source: input
        description: total development dollars authorised for this slate
        constraints: integer >= 0
      - name: pattern_budget_per_episode_cents
        type: integer
        source: input
        description: pattern (benchmark) production budget per episode for this slate
        constraints: integer > 0
      - name: license_fee_cap_per_episode_cents
        type: integer
        source: input
        description: maximum per-episode license fee the network may commit on this slate
        constraints: integer > 0
      - name: max_deficit_per_episode_cents
        type: integer
        source: input
        description: largest per-episode deficit still considered FEASIBLE
        constraints: integer >= 0
      - name: episode_capacity
        type: integer
        source: input
        description: total episode inventory the slate can order in season_year
        constraints: integer >= 1
      - name: default_episode_count
        type: integer
        source: input
        description: episode count assumed by feasibility reads when the caller omits episode_count
        constraints: integer >= 1
      - name: max_backend_points_bps
        type: integer
        source: input
        description: ceiling on backend participation granted in a series order, in basis points
        constraints: integer between 0 and 10000
      - name: max_concurrent_pilot_shoots
        type: integer
        source: input
        description: number of pilot shoot windows that may overlap on this slate's stages
        constraints: integer >= 1
      - name: committed_dev_cents
        type: integer
        source: computed
        description: >-
          sum of ScriptDeal.encumbered_cents over every ScriptDeal row whose project's
          slate_id == this.id (no deal_status filter - the encumbrance is carried entirely
          by DealStep.status inside encumbered_cents), PLUS sum of PilotOrder.budget_cents
          over PilotOrder rows whose production_status IN {ORDERED, GREEN_TO_SHOOT, WRAPPED}
          and whose project's slate_id == this.id
      - name: reserved_holding_cents
        type: integer
        source: computed
        description: sum of HoldingDeal.annual_cost_cents where slate_id == this.id and status == ACTIVE
      - name: writeoff_dev_cents
        type: integer
        source: computed
        description: sum of DevelopmentProject.writeoff_cents where slate_id == this.id and dev_status == ABANDONED
      - name: recouped_dev_cents
        type: integer
        source: computed
        description: sum of DevelopmentProject.recoupment_paid_cents where slate_id == this.id and turnaround_status == EXERCISED
      - name: available_dev_cents
        type: integer
        source: computed
        description: total_dev_budget_cents - committed_dev_cents - reserved_holding_cents - writeoff_dev_cents + recouped_dev_cents
      - name: committed_episode_count
        type: integer
        source: computed
        description: sum of SeriesOrderNegotiation.episode_count over negotiations whose status == AGREED and whose project's slate_id == this.id
      - name: reserved_episode_count
        type: integer
        source: computed
        description: sum of SeriesOrderNegotiation.episode_count over negotiations whose status IN {NETWORK_OFFER, STUDIO_COUNTER} and whose project's slate_id == this.id
      - name: available_episode_count
        type: integer
        source: computed
        description: episode_capacity - committed_episode_count - reserved_episode_count
      - name: posture
        type: enum
        source: computed
        description: >-
          LOCKED when committed_episode_count >= episode_capacity; else RESTRICTED when
          floor((committed_episode_count + reserved_episode_count) * 10000 / episode_capacity)
          >= 6000; else OPEN
        constraints: one of {OPEN, RESTRICTED, LOCKED}

  - name: Writer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: writer's professional name
        constraints: non-blank, max 120 chars
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; the agency representing this writer
      - name: guild_minimum_tier
        type: enum
        source: input
        description: guild minimum band applied to this writer's step fees
        constraints: one of {LOW, HIGH}
      - name: quote_per_step_cents
        type: integer
        source: input
        description: the writer's asking price per step, recorded for reference only
        constraints: integer >= 0
      - name: exclusivity_status
        type: enum
        source: computed
        description: >-
          HOLDING_DEAL when at least one HoldingDeal with writer_id == this.id has
          status == ACTIVE and term_state == IN_TERM; otherwise FREE
        constraints: one of {FREE, HOLDING_DEAL}
      - name: open_step_count
        type: integer
        source: computed
        description: >-
          count of DealStep rows whose status IN {EXERCISED, DELIVERED, NOTES_ISSUED}
          and whose ScriptDeal.writer_id == this.id

  - name: HoldingDeal
    parent: null
    common_fields: true
    fields:
      - name: writer_id
        type: string
        source: input
        description: FK -> Writer.id; the held writer
      - name: slate_id
        type: string
        source: input
        description: FK -> Slate.id; the slate whose development budget funds the hold
      - name: annual_cost_cents
        type: integer
        source: input
        description: annual cost of the hold, reserved against the slate
        constraints: integer > 0
      - name: term_start_date
        type: string
        source: input
        description: first day of the hold term, inclusive
        constraints: date, format YYYY-MM-DD
      - name: term_end_date
        type: string
        source: input
        description: exclusive end of the hold term (the term covers [term_start_date, term_end_date))
        constraints: date, format YYYY-MM-DD, strictly after term_start_date
      - name: status
        type: enum
        source: system
        description: ACTIVE on creation; TERMINATED once the terminate action runs
        default: ACTIVE
        constraints: one of {ACTIVE, TERMINATED}
      - name: term_state
        type: enum
        source: computed
        description: >-
          derived from the logical clock date D: PENDING_START when D < term_start_date;
          IN_TERM when term_start_date <= D < term_end_date; EXPIRED when D >= term_end_date
        constraints: one of {PENDING_START, IN_TERM, EXPIRED}
      - name: termination_reason
        type: string
        source: system
        description: reason string supplied to the terminate action; null while ACTIVE
        default: null

  - name: Pitch
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; the submitting agency
      - name: slate_id
        type: string
        source: input
        description: FK -> Slate.id; the slate the pitch targets
      - name: title
        type: string
        source: input
        description: working title of the project pitched
        constraints: non-blank, max 160 chars
      - name: logline
        type: string
        source: input
        description: one-paragraph logline
        constraints: non-blank, max 600 chars
      - name: packaging_elements
        type: array
        source: input
        description: attached elements (talent, directors, showrunners) the agency packaged with the pitch
        default: []
        constraints: array of non-blank strings, max 6 entries
      - name: underlying_ip_key
        type: string
        source: input
        description: canonical key of the underlying IP, if the pitch is an adaptation
        default: null
        constraints: null or non-blank string, max 80 chars, compared case-sensitively
      - name: status
        type: enum
        source: system
        description: pitch lifecycle state
        default: SUBMITTED
        constraints: one of {SUBMITTED, COVERED, PASSED, ADVANCED}
      - name: coverage_score
        type: number
        source: system
        description: most recent coverage score recorded by the development executive
        default: null
        constraints: null or number between 0 and 100 with at most 1 decimal place
      - name: coverage_round
        type: integer
        source: system
        description: number of coverage passes recorded on this pitch
        default: 0
      - name: recommendation
        type: enum
        source: system
        description: most recent coverage recommendation
        default: null
        constraints: null or one of {ADVANCE, PASS}

  - name: RightsCheck
    parent: Pitch
    common_fields: false
    fields:
      - name: pitch_id
        type: string
        source: input
        description: FK -> Pitch.id; the pitch this clearance record belongs to
      - name: underlying_ip_key
        type: string
        source: input
        description: canonical key of the underlying IP being cleared, compared case-sensitively
        constraints: non-blank, max 80 chars
      - name: chain_of_title_status
        type: enum
        source: input
        description: outcome of the chain-of-title search
        constraints: one of {CLEAN, DISPUTED, UNKNOWN}
      - name: holdback_start_date
        type: string
        source: input
        description: first day of the exclusive holdback window requested, inclusive
        constraints: date, format YYYY-MM-DD
      - name: holdback_end_date
        type: string
        source: input
        description: last day of the exclusive holdback window requested, inclusive
        constraints: date, format YYYY-MM-DD, on or after holdback_start_date
      - name: quiet_period_end_date
        type: string
        source: computed
        description: holdback_end_date plus RIGHTS_QUIET_BUFFER_DAYS (90) calendar days, inclusive
      - name: result
        type: enum
        source: computed
        description: >-
          CLEAR when chain_of_title_status == CLEAN, ENCUMBERED when DISPUTED,
          BLOCKED when UNKNOWN; fixed at creation and never revised
        constraints: one of {CLEAR, ENCUMBERED, BLOCKED}

  - name: DevelopmentProject
    parent: null
    common_fields: true
    fields:
      - name: pitch_id
        type: string
        source: system
        description: FK -> Pitch.id; the advanced pitch this project came from (copied from the predecessor on a turnaround successor)
      - name: slate_id
        type: string
        source: system
        description: FK -> Slate.id; the slate carrying this project's development cost
      - name: predecessor_project_id
        type: string
        source: system
        description: FK -> DevelopmentProject.id; set only on a project created by a turnaround exercise, else null
        default: null
      - name: title
        type: string
        source: system
        description: working title, copied from the pitch on advance or from successor_title on a turnaround exercise
      - name: dev_status
        type: enum
        source: system
        description: development lifecycle dimension
        default: ACTIVE_DEVELOPMENT
        constraints: one of {ACTIVE_DEVELOPMENT, SCRIPT_COMPLETE, PILOT_ORDERED, PILOT_DELIVERED, SERIES_ORDERED, ABANDONED}
      - name: turnaround_status
        type: enum
        source: system
        description: turnaround-rights dimension, independent of dev_status
        default: NONE
        constraints: one of {NONE, OFFERED, EXERCISED}
      - name: turnaround_offered_at
        type: datetime
        source: system
        description: logical-clock instant the turnaround was offered; null while turnaround_status == NONE
        default: null
      - name: turnaround_window_open
        type: boolean
        source: computed
        description: true when turnaround_status == OFFERED and the logical clock is strictly before turnaround_offered_at + TURNAROUND_WINDOW_DAYS (180) days
      - name: cumulative_dev_cost_cents
        type: integer
        source: computed
        description: >-
          sum of ScriptDeal.encumbered_cents over every ScriptDeal row with
          project_id == this.id, PLUS sum of PilotOrder.budget_cents over this
          project's PilotOrder rows whose production_status IN {ORDERED, GREEN_TO_SHOOT, WRAPPED}
      - name: writeoff_cents
        type: integer
        source: system
        description: snapshot of cumulative_dev_cost_cents taken at the instant the project was abandoned
        default: 0
      - name: abandoned_at
        type: datetime
        source: system
        description: logical-clock instant of abandonment; null unless dev_status == ABANDONED
        default: null
      - name: abandon_reason
        type: string
        source: system
        description: reason recorded by the abandon action
        default: null
      - name: recoupment_amount_cents
        type: integer
        source: computed
        description: >-
          0 unless turnaround_status IN {OFFERED, EXERCISED}; otherwise the
          turnaround_recoupment formula evaluated at the current logical clock
          (OFFERED) or frozen at exercise time (EXERCISED, equals recoupment_paid_cents)
      - name: recoupment_paid_cents
        type: integer
        source: system
        description: recoupment actually paid by the studio at turnaround exercise
        default: 0

  - name: ScriptDeal
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> DevelopmentProject.id; the project this development deal serves
      - name: writer_id
        type: string
        source: input
        description: FK -> Writer.id; the attached writer
      - name: guaranteed_step_count
        type: integer
        source: input
        description: number of leading steps (by step_index) the network guarantees
        constraints: integer >= 1 and <= number of submitted steps
      - name: option_period_days
        type: integer
        source: input
        description: length in days of each step's option period
        constraints: integer between 1 and 365
      - name: deal_status
        type: enum
        source: system
        description: deal lifecycle state
        default: EXECUTED
        constraints: one of {EXECUTED, COMPLETED, CUT_OFF, TERMINATED}
      - name: step_count
        type: integer
        source: computed
        description: count of DealStep rows with script_deal_id == this.id
      - name: guaranteed_commitment_cents
        type: integer
        source: computed
        description: >-
          GUARANTEED_ONLY variant of script_deal_commitment - sum of
          DealStep.effective_fee_cents over steps with step_index <= guaranteed_step_count,
          regardless of step status
      - name: full_option_exposure_cents
        type: integer
        source: computed
        description: >-
          FULL_OPTION variant of script_deal_commitment - sum of
          DealStep.effective_fee_cents over every step of the deal, regardless of step status
      - name: encumbered_cents
        type: integer
        source: computed
        description: >-
          live slate encumbrance - sum of DealStep.effective_fee_cents over steps where
          (step_index <= guaranteed_step_count AND status != CUT_OFF) OR
          (step_index > guaranteed_step_count AND status IN {EXERCISED, DELIVERED, NOTES_ISSUED, ACCEPTED});
          a guaranteed step is money the network owes from execution onward, an optional
          step only once its option is exercised, and CUT_OFF always releases

  - name: DealStep
    parent: ScriptDeal
    common_fields: true
    fields:
      - name: script_deal_id
        type: string
        source: system
        description: FK -> ScriptDeal.id; the deal this step belongs to
      - name: step_index
        type: integer
        source: system
        description: 1-based position of the step in the submitted steps array, preserving submitted order
      - name: step_type
        type: enum
        source: system
        description: kind of writing step
        constraints: one of {STORY, FIRST_DRAFT, REVISION, POLISH}
      - name: fee_cents
        type: integer
        source: system
        description: fee as submitted in the steps array
        constraints: integer >= 0
      - name: effective_fee_cents
        type: integer
        source: computed
        description: max(fee_cents, floor(GUILD_MIN_CENTS_BASE[step_type] * GUILD_TIER_FACTOR_BPS[writer.guild_minimum_tier] / 10000))
      - name: status
        type: enum
        source: system
        description: step lifecycle state
        default: PENDING
        constraints: one of {PENDING, EXERCISED, DELIVERED, NOTES_ISSUED, ACCEPTED, CUT_OFF}
      - name: option_expires_at
        type: datetime
        source: system
        description: deal created_at plus (step_index * ScriptDeal.option_period_days) days; the step may only be exercised strictly before this instant
      - name: notes_round
        type: integer
        source: system
        description: number of notes rounds issued on this step
        default: 0
      - name: exercised_at
        type: datetime
        source: system
        description: logical-clock instant the option was exercised
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent delivery
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the step was accepted
        default: null

  - name: PilotOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> DevelopmentProject.id; the project ordered to pilot
      - name: budget_cents
        type: integer
        source: input
        description: approved pilot production budget
        constraints: integer > 0
      - name: shoot_start_date
        type: string
        source: input
        description: first day of the pilot shoot window, inclusive
        constraints: date, format YYYY-MM-DD
      - name: shoot_end_date
        type: string
        source: input
        description: last day of the pilot shoot window, inclusive
        constraints: date, format YYYY-MM-DD, on or after shoot_start_date
      - name: casting_deadline_date
        type: string
        source: input
        description: date by which the casting contingency must be resolved
        constraints: date, format YYYY-MM-DD
      - name: location_deadline_date
        type: string
        source: input
        description: date by which the location contingency must be resolved
        constraints: date, format YYYY-MM-DD
      - name: casting_status
        type: enum
        source: system
        description: casting contingency dimension, evolves independently of location_status
        default: PENDING
        constraints: one of {PENDING, SATISFIED, WAIVED, FAILED}
      - name: location_status
        type: enum
        source: system
        description: location contingency dimension, evolves independently of casting_status
        default: PENDING
        constraints: one of {PENDING, SATISFIED, WAIVED, FAILED}
      - name: production_status
        type: enum
        source: system
        description: production dimension, auto-advanced from the two contingency dimensions
        default: ORDERED
        constraints: one of {ORDERED, GREEN_TO_SHOOT, WRAPPED, COLLAPSED}
      - name: budget_variance_bps
        type: integer
        source: computed
        description: floor((budget_cents - slate.pattern_budget_per_episode_cents) * 10000 / slate.pattern_budget_per_episode_cents), for the slate of this pilot's project
      - name: collapsed_reason
        type: string
        source: system
        description: >-
          why the pilot collapsed - the contingency kind that failed (CASTING or
          LOCATION), or PROJECT_ABANDONED when the abandonment cascade collapsed
          it; null unless production_status == COLLAPSED
        default: null

  - name: TestScreening
    parent: PilotOrder
    common_fields: true
    fields:
      - name: pilot_order_id
        type: string
        source: system
        description: FK -> PilotOrder.id; the pilot that was screened
      - name: panel_size
        type: integer
        source: input
        description: number of respondents in the research panel
        constraints: integer >= 1
      - name: overall_score
        type: integer
        source: input
        description: raw overall-opinion score
        constraints: integer between 0 and 100
      - name: intent_to_view_score
        type: integer
        source: input
        description: raw intent-to-view score
        constraints: integer between 0 and 100
      - name: appeal_score
        type: integer
        source: input
        description: raw lead-appeal score
        constraints: integer between 0 and 100
      - name: comp_norm_index
        type: number
        source: input
        description: comparable-title norm index the raw score is adjusted against
        constraints: number between 50.0 and 150.0 with at most 1 decimal place
      - name: weighted_raw_score
        type: number
        source: computed
        description: weighted_test_score step 1 output - sum of the three per-component values each already rounded to 2 decimals, half-up
      - name: norm_adjusted_score
        type: number
        source: computed
        description: weighted_test_score step 2 output - round_half_up(weighted_raw_score * 100 / comp_norm_index, 1)
      - name: status
        type: enum
        source: system
        description: research record state
        default: FIELDED
        constraints: one of {FIELDED, CERTIFIED, INVALIDATED}
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification; null unless status == CERTIFIED
        default: null

  - name: SeriesOrderNegotiation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> DevelopmentProject.id; the project being negotiated to series
      - name: episode_count
        type: integer
        source: input
        description: episodes in the standing term sheet
        constraints: integer >= 1
      - name: license_fee_per_episode_cents
        type: integer
        source: input
        description: per-episode license fee in the standing term sheet
        constraints: integer > 0
      - name: backend_points_bps
        type: integer
        source: input
        description: backend participation granted to the studio, in basis points
        constraints: integer between 0 and 10000
      - name: network_ownership_pct
        type: integer
        source: input
        description: network's ownership share of the series
        constraints: integer between 0 and 100
      - name: studio_ownership_pct
        type: integer
        source: input
        description: studio's ownership share of the series
        constraints: integer between 0 and 100; network_ownership_pct + studio_ownership_pct must equal 100
      - name: status
        type: enum
        source: system
        description: negotiation state; NETWORK_OFFER and STUDIO_COUNTER alternate across rounds
        default: NETWORK_OFFER
        constraints: one of {NETWORK_OFFER, STUDIO_COUNTER, AGREED, WITHDRAWN}
      - name: round_number
        type: integer
        source: system
        description: number of term sheets exchanged, starting at 1 for the opening network offer
        default: 1
      - name: last_offer_side
        type: enum
        source: system
        description: side that put the standing term sheet on the table
        default: NETWORK
        constraints: one of {NETWORK, STUDIO}
      - name: total_license_commitment_cents
        type: integer
        source: computed
        description: episode_count * license_fee_per_episode_cents
      - name: agreed_at
        type: datetime
        source: system
        description: logical-clock instant the term sheet was accepted; null unless status == AGREED
        default: null
      - name: withdrawn_reason
        type: string
        source: system
        description: reason propagated from the abandoning project; null unless status == WITHDRAWN
        default: null

  - name: GreenlightRequest
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> DevelopmentProject.id; the project seeking a series greenlight
      - name: negotiation_id
        type: string
        source: input
        description: FK -> SeriesOrderNegotiation.id; the AGREED term sheet submitted for approval
      - name: project_version_at_request
        type: integer
        source: system
        description: the DevelopmentProject.version observed when the request was accepted (equals expected_project_version)
      - name: creative_decision
        type: enum
        source: system
        description: creative committee vote
        default: PENDING
        constraints: one of {PENDING, APPROVED, REJECTED}
      - name: business_decision
        type: enum
        source: system
        description: business-affairs committee vote
        default: PENDING
        constraints: one of {PENDING, APPROVED, REJECTED}
      - name: finance_decision
        type: enum
        source: system
        description: finance committee vote
        default: PENDING
        constraints: one of {PENDING, APPROVED, REJECTED}
      - name: creative_decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID that recorded the creative vote
        default: null
      - name: business_decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID that recorded the business vote
        default: null
      - name: finance_decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID that recorded the finance vote
        default: null
      - name: status
        type: enum
        source: system
        description: join state of the three-committee fork
        default: OPEN
        constraints: one of {OPEN, APPROVED, REJECTED, SUPERSEDED}
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant the join resolved; null while OPEN
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Pitch
    initial_state: SUBMITTED
    terminal_states: [PASSED, ADVANCED]
    transitions:
      - from: SUBMITTED
        to: COVERED
        trigger: "POST /pitches/{id}/coverage with recommendation ADVANCE"
        actor: DevelopmentExec
        preconditions:
          - "pitch.status == SUBMITTED"
        side_effects:
          - "set pitch.coverage_score to the submitted coverage_score"
          - "set pitch.recommendation = ADVANCE"
          - "increment pitch.coverage_round by 1"
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /pitches/{id}/coverage with recommendation PASS"
        actor: DevelopmentExec
        preconditions:
          - "pitch.status == SUBMITTED"
        side_effects:
          - "set pitch.coverage_score, set pitch.recommendation = PASS, increment pitch.coverage_round by 1"
        note: "PASSED is terminal; a passed pitch can never be re-covered or advanced."
      - from: COVERED
        to: COVERED
        trigger: "POST /pitches/{id}/coverage with recommendation ADVANCE (re-coverage self-loop)"
        actor: DevelopmentExec
        preconditions:
          - "pitch.status == COVERED"
        side_effects:
          - "overwrite pitch.coverage_score with the new coverage_score"
          - "increment pitch.coverage_round by 1"
        note: "Cyclic self-loop: development may re-cover a pitch any number of times while it stays COVERED."
      - from: COVERED
        to: PASSED
        trigger: "POST /pitches/{id}/coverage with recommendation PASS"
        actor: DevelopmentExec
        preconditions:
          - "pitch.status == COVERED"
        side_effects:
          - "set pitch.recommendation = PASS, overwrite coverage_score, increment coverage_round by 1"
      - from: COVERED
        to: ADVANCED
        trigger: "POST /pitches/{id}/advance"
        actor: DevelopmentExec
        preconditions:
          - "pitch.status == COVERED"
          - "pitch.recommendation == ADVANCE"
          - "at least one RightsCheck with pitch_id == pitch.id has result == CLEAR AND no RightsCheck on the pitch has result == BLOCKED"
          - "the pitch's Slate has posture != LOCKED"
        side_effects:
          - "create one DevelopmentProject with pitch_id = pitch.id, slate_id = pitch.slate_id, title = pitch.title, dev_status = ACTIVE_DEVELOPMENT, turnaround_status = NONE, predecessor_project_id = null"
          - "increment Slate.version by 1 (the slate's project set changed)"

  - entity: HoldingDeal
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /holding-deals (creation)"
        actor: BusinessAffairs
        preconditions:
          - "slate.available_dev_cents >= annual_cost_cents"
          - "no other HoldingDeal for the same writer_id with status == ACTIVE has a term interval [term_start_date, term_end_date) intersecting the requested interval"
        side_effects:
          - "raise Slate.reserved_holding_cents by annual_cost_cents, which lowers Slate.available_dev_cents by the same amount"
          - "recompute Writer.exclusivity_status (HOLDING_DEAL once term_state == IN_TERM)"
          - "increment Slate.version by 1 and Writer.version by 1"
        note: "Creation row recorded here so the compensating pair (create/terminate) is auditable in one place."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /holding-deals/{id}/terminate"
        actor: BusinessAffairs
        preconditions:
          - "holding_deal.status == ACTIVE"
        side_effects:
          - "set status = TERMINATED and termination_reason = the submitted reason"
          - "lower Slate.reserved_holding_cents by annual_cost_cents, which raises Slate.available_dev_cents by the same amount"
          - "recompute Writer.exclusivity_status (back to FREE when no other ACTIVE IN_TERM hold exists)"
          - "increment Slate.version by 1 and Writer.version by 1"

  - entity: DevelopmentProject
    initial_state: ACTIVE_DEVELOPMENT
    terminal_states: [SERIES_ORDERED, ABANDONED]
    transitions:
      - from: ACTIVE_DEVELOPMENT
        to: SCRIPT_COMPLETE
        trigger: "system: last guaranteed DealStep of a ScriptDeal reaches ACCEPTED (bubble-up from POST /script-deals/{id}/steps/{step_id}/review with outcome ACCEPT)"
        actor: system
        preconditions:
          - "every DealStep of the reviewed ScriptDeal with step_index <= guaranteed_step_count has status == ACCEPTED"
          - "project.dev_status == ACTIVE_DEVELOPMENT"
        side_effects:
          - "set project.dev_status = SCRIPT_COMPLETE"
          - "increment DevelopmentProject.version by 1"
      - from: SCRIPT_COMPLETE
        to: ACTIVE_DEVELOPMENT
        trigger: "POST /script-deals/{id}/steps/{step_id}/exercise on a step with step_index > guaranteed_step_count"
        actor: BusinessAffairs
        preconditions:
          - "project.dev_status == SCRIPT_COMPLETE"
        side_effects:
          - "set project.dev_status = ACTIVE_DEVELOPMENT"
          - "increment DevelopmentProject.version by 1"
        note: "Cycle: exercising an optional step after script completion re-opens development; the project can return to SCRIPT_COMPLETE again once that step is ACCEPTED."
      - from: SCRIPT_COMPLETE
        to: PILOT_ORDERED
        trigger: "POST /pilot-orders"
        actor: DevelopmentExec
        preconditions:
          - "project.dev_status == SCRIPT_COMPLETE"
          - "project's Slate has posture != LOCKED"
          - "Slate.available_dev_cents >= budget_cents"
        side_effects:
          - "create the PilotOrder with production_status = ORDERED, casting_status = PENDING, location_status = PENDING"
          - "raise Slate.committed_dev_cents by budget_cents and lower Slate.available_dev_cents by the same amount"
          - "set project.dev_status = PILOT_ORDERED; increment DevelopmentProject.version by 1 and Slate.version by 1"
      - from: PILOT_ORDERED
        to: ACTIVE_DEVELOPMENT
        trigger: "system: the project's PilotOrder reaches production_status COLLAPSED (cascade link 2 of the contingency-failure chain)"
        actor: system
        preconditions:
          - "project.dev_status == PILOT_ORDERED"
        side_effects:
          - "set project.dev_status = ACTIVE_DEVELOPMENT"
          - "increment DevelopmentProject.version by 1"
      - from: PILOT_ORDERED
        to: PILOT_DELIVERED
        trigger: "POST /pilot-orders/{id}/wrap"
        actor: DevelopmentExec
        preconditions:
          - "project.dev_status == PILOT_ORDERED"
          - "pilot_order.production_status == GREEN_TO_SHOOT"
        side_effects:
          - "set project.dev_status = PILOT_DELIVERED"
          - "increment DevelopmentProject.version by 1"
      - from: PILOT_DELIVERED
        to: SERIES_ORDERED
        trigger: "system: GreenlightRequest join resolves to APPROVED (cascade link 2 of the greenlight chain)"
        actor: system
        preconditions:
          - "project.dev_status == PILOT_DELIVERED"
          - "greenlight_request.creative_decision == APPROVED AND business_decision == APPROVED AND finance_decision == APPROVED"
        side_effects:
          - "set project.dev_status = SERIES_ORDERED"
          - "cascade link 3: every ScriptDeal with project_id == project.id and deal_status == EXECUTED becomes COMPLETED, and each such deal's steps with status == PENDING become CUT_OFF"
          - "cascade link 4: because those steps left encumbered_cents, Slate.committed_dev_cents drops, and Slate.available_dev_cents plus Slate.posture are recomputed"
          - "increment DevelopmentProject.version by 1 and Slate.version by 1"
      - from: ACTIVE_DEVELOPMENT
        to: ABANDONED
        trigger: "POST /development-projects/{id}/abandon"
        actor: DevelopmentExec
        preconditions:
          - "project.dev_status IN {ACTIVE_DEVELOPMENT, SCRIPT_COMPLETE, PILOT_ORDERED, PILOT_DELIVERED}"
        side_effects:
          - "step 1 (evaluated first, before every other side effect of this transition): set project.writeoff_cents = project.cumulative_dev_cost_cents, project.abandoned_at = logical clock now, project.abandon_reason = submitted reason, project.dev_status = ABANDONED"
          - "cascade link 2: caused by link 1, every ScriptDeal with project_id == project.id and deal_status == EXECUTED becomes TERMINATED"
          - "cascade link 3: caused by link 2, every DealStep of each terminated deal that is not already CUT_OFF becomes CUT_OFF, ACCEPTED steps included"
          - "cascade link 4: caused by link 3, each terminated deal's encumbered_cents falls to 0, so Slate.committed_dev_cents drops by that amount and Slate.available_dev_cents plus Slate.posture are recomputed"
          - "cascade link 2b: caused by link 1, every SeriesOrderNegotiation of the project with status IN {NETWORK_OFFER, STUDIO_COUNTER} becomes WITHDRAWN with withdrawn_reason = the submitted reason"
          - "cascade link 3b: caused by link 2b, Slate.reserved_episode_count drops by those negotiations' episode_count, so Slate.available_episode_count and Slate.posture are recomputed"
          - "cascade link 2c: caused by link 1, every PilotOrder of the project with production_status IN {ORDERED, GREEN_TO_SHOOT} becomes COLLAPSED with collapsed_reason = PROJECT_ABANDONED, which removes its budget_cents from Slate.committed_dev_cents"
          - "Slate.writeoff_dev_cents rises by project.writeoff_cents, holding the spent development dollars out of available_dev_cents"
          - "increment DevelopmentProject.version by 1 and Slate.version by 1"
        note: "The same transition exists from SCRIPT_COMPLETE, PILOT_ORDERED and PILOT_DELIVERED with identical side effects."
      - from: ABANDONED
        to: ABANDONED
        trigger: "POST /development-projects/{id}/turnaround (turnaround dimension: NONE -> OFFERED)"
        actor: BusinessAffairs
        preconditions:
          - "project.dev_status == ABANDONED"
          - "project.turnaround_status == NONE"
        side_effects:
          - "set project.turnaround_status = OFFERED and project.turnaround_offered_at = logical clock now"
          - "project.recoupment_amount_cents becomes live (turnaround_recoupment evaluated at the current clock)"
          - "increment DevelopmentProject.version by 1"
        note: "turnaround_status is a second, independent state dimension on the same row; dev_status stays ABANDONED throughout."
      - from: ABANDONED
        to: ABANDONED
        trigger: "POST /development-projects/{id}/turnaround-exercise (turnaround dimension: OFFERED -> EXERCISED)"
        actor: BusinessAffairs
        preconditions:
          - "project.turnaround_status == OFFERED"
          - "project.turnaround_window_open == true"
        side_effects:
          - "freeze project.recoupment_paid_cents = project.recoupment_amount_cents evaluated at the current clock and set project.turnaround_status = EXERCISED"
          - "cascade link 2: caused by link 1, Slate.recouped_dev_cents rises by recoupment_paid_cents, so Slate.available_dev_cents rises by the same amount and Slate.posture is recomputed"
          - "create a successor DevelopmentProject with predecessor_project_id = project.id, pitch_id and slate_id copied from project, title = submitted successor_title, dev_status = ACTIVE_DEVELOPMENT, turnaround_status = NONE"
          - "increment DevelopmentProject.version by 1 and Slate.version by 1"

  - entity: ScriptDeal
    initial_state: EXECUTED
    terminal_states: [COMPLETED, CUT_OFF, TERMINATED]
    transitions:
      - from: EXECUTED
        to: EXECUTED
        trigger: "POST /script-deals (creation)"
        actor: BusinessAffairs
        preconditions:
          - "project.dev_status IN {ACTIVE_DEVELOPMENT, SCRIPT_COMPLETE}"
          - "the attached Writer has no HoldingDeal with status == ACTIVE, term_state == IN_TERM and slate_id != project.slate_id"
          - "Slate.available_dev_cents >= the deal's guaranteed_commitment_cents"
        side_effects:
          - "materialise one DealStep per entry of the submitted steps array, in submitted order, with step_index starting at 1, status PENDING and option_expires_at = deal.created_at + (step_index * option_period_days) days"
          - "raise Slate.committed_dev_cents by the deal's encumbered_cents (at creation this equals guaranteed_commitment_cents) and lower Slate.available_dev_cents accordingly"
          - "increment DevelopmentProject.version by 1 and Slate.version by 1"
      - from: EXECUTED
        to: CUT_OFF
        trigger: "POST /script-deals/{id}/cutoff"
        actor: BusinessAffairs
        preconditions:
          - "deal.deal_status == EXECUTED"
          - "no DealStep with step_index <= guaranteed_step_count has status == PENDING"
        side_effects:
          - "every DealStep with status == PENDING becomes CUT_OFF"
          - "set deal.deal_status = CUT_OFF"
          - "those steps leave encumbered_cents, so Slate.committed_dev_cents drops and Slate.available_dev_cents plus Slate.posture are recomputed"
          - "increment Slate.version by 1"
      - from: EXECUTED
        to: COMPLETED
        trigger: "system: the project reaches SERIES_ORDERED (cascade link 3 of the greenlight chain)"
        actor: system
        preconditions:
          - "deal.deal_status == EXECUTED"
        side_effects:
          - "every DealStep with status == PENDING becomes CUT_OFF"
          - "set deal.deal_status = COMPLETED"
          - "Slate.committed_dev_cents drops by the released step fees"
      - from: EXECUTED
        to: TERMINATED
        trigger: "system: the project is abandoned (cascade link 2 of the abandonment chain)"
        actor: system
        preconditions:
          - "deal.deal_status == EXECUTED"
        side_effects:
          - "every DealStep of the deal that is not already CUT_OFF becomes CUT_OFF, ACCEPTED steps included"
          - "set deal.deal_status = TERMINATED"
          - "encumbered_cents falls to 0, so Slate.committed_dev_cents drops by the whole deal encumbrance"

  - entity: DealStep
    initial_state: PENDING
    terminal_states: [CUT_OFF]
    transitions:
      - from: PENDING
        to: EXERCISED
        trigger: "POST /script-deals/{id}/steps/{step_id}/exercise"
        actor: BusinessAffairs
        preconditions:
          - "step.status == PENDING"
          - "deal.deal_status == EXECUTED"
          - "logical clock now < step.option_expires_at"
          - "the deal's Writer has open_step_count < MAX_OPEN_STEPS_PER_WRITER (2)"
          - "every step with a lower step_index on the same deal has status IN {ACCEPTED, CUT_OFF}"
        side_effects:
          - "set step.status = EXERCISED and step.exercised_at = logical clock now"
          - "Writer.open_step_count recomputed (rises by 1)"
          - "when step_index > guaranteed_step_count the step enters encumbered_cents, so Slate.committed_dev_cents rises by effective_fee_cents and Slate.available_dev_cents drops"
          - "when step_index > guaranteed_step_count, project.cumulative_dev_cost_cents rises by effective_fee_cents; a guaranteed step was already encumbered at execution so neither ledger moves"
          - "when project.dev_status == SCRIPT_COMPLETE and step_index > guaranteed_step_count, project.dev_status returns to ACTIVE_DEVELOPMENT"
          - "increment ScriptDeal.version by 1 and Slate.version by 1"
      - from: EXERCISED
        to: DELIVERED
        trigger: "POST /script-deals/{id}/steps/{step_id}/deliver"
        actor: BusinessAffairs | DevelopmentExec
        preconditions:
          - "step.status IN {EXERCISED, NOTES_ISSUED}"
        side_effects:
          - "set step.status = DELIVERED and step.delivered_at = logical clock now"
      - from: DELIVERED
        to: NOTES_ISSUED
        trigger: "POST /script-deals/{id}/steps/{step_id}/review with outcome NOTES"
        actor: DevelopmentExec
        preconditions:
          - "step.status == DELIVERED"
          - "step.notes_round < MAX_NOTES_ROUNDS (2)"
        side_effects:
          - "set step.status = NOTES_ISSUED and increment step.notes_round by 1"
        note: "Cycle: NOTES_ISSUED -> DELIVERED -> NOTES_ISSUED may repeat until notes_round reaches 2."
      - from: NOTES_ISSUED
        to: DELIVERED
        trigger: "POST /script-deals/{id}/steps/{step_id}/deliver (redelivery)"
        actor: BusinessAffairs | DevelopmentExec
        preconditions:
          - "step.status == NOTES_ISSUED"
        side_effects:
          - "set step.status = DELIVERED and overwrite step.delivered_at with the logical clock now"
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /script-deals/{id}/steps/{step_id}/review with outcome ACCEPT"
        actor: DevelopmentExec
        preconditions:
          - "step.status == DELIVERED"
        side_effects:
          - "set step.status = ACCEPTED and step.accepted_at = logical clock now"
          - "Writer.open_step_count recomputed (drops by 1)"
          - "when every step with step_index <= guaranteed_step_count is ACCEPTED and project.dev_status == ACTIVE_DEVELOPMENT, project.dev_status becomes SCRIPT_COMPLETE (bubble-up)"
          - "increment ScriptDeal.version by 1"
      - from: PENDING
        to: CUT_OFF
        trigger: "POST /script-deals/{id}/cutoff, or system cascade when the deal becomes COMPLETED or TERMINATED"
        actor: BusinessAffairs | system
        preconditions:
          - "step.status == PENDING"
        side_effects:
          - "set step.status = CUT_OFF"
          - "a guaranteed step (step_index <= guaranteed_step_count) leaves encumbered_cents, so Slate.committed_dev_cents drops by effective_fee_cents; an optional PENDING step was never encumbered, so the ledger does not move"
      - from: ACCEPTED
        to: CUT_OFF
        trigger: "system: the project is abandoned and the deal becomes TERMINATED (cascade link 3 of the abandonment chain)"
        actor: system
        preconditions:
          - "step.status IN {EXERCISED, DELIVERED, NOTES_ISSUED, ACCEPTED}"
        side_effects:
          - "set step.status = CUT_OFF"
          - "the step leaves encumbered_cents, so Slate.committed_dev_cents drops by effective_fee_cents - the same cents that link 1 already froze into writeoff_cents, which is why the dollar invariant shows no drift"
        note: >-
          Abandonment reclassifies every step of the terminated deal, ACCEPTED
          steps included; that is why CUT_OFF is DealStep's only terminal state.
          The SERIES_ORDERED cascade is deliberately narrower - it cuts off only
          PENDING steps and leaves ACCEPTED work encumbered.

  - entity: PilotOrder
    initial_state: ORDERED
    terminal_states: [WRAPPED, COLLAPSED]
    transitions:
      - from: ORDERED
        to: ORDERED
        trigger: "POST /pilot-orders/{id}/contingency-clearances resolving only one of the two dimensions"
        actor: DevelopmentExec | BusinessAffairs
        preconditions:
          - "pilot_order.production_status == ORDERED"
          - "the dimension named by kind currently has status PENDING"
          - "resolution WAIVED is recorded only by BusinessAffairs"
        side_effects:
          - "set casting_status (kind == CASTING) or location_status (kind == LOCATION) to the submitted resolution"
          - "production_status stays ORDERED while the other dimension is still PENDING"
        note: "casting_status and location_status are independent state dimensions on the same row; either may be resolved first."
      - from: ORDERED
        to: GREEN_TO_SHOOT
        trigger: "POST /pilot-orders/{id}/contingency-clearances resolving the last PENDING dimension to SATISFIED or WAIVED"
        actor: DevelopmentExec | BusinessAffairs
        preconditions:
          - "pilot_order.production_status == ORDERED"
          - "after applying this clearance, casting_status IN {SATISFIED, WAIVED} AND location_status IN {SATISFIED, WAIVED}"
        side_effects:
          - "set production_status = GREEN_TO_SHOOT (compound auto-transition derived from the two contingency dimensions)"
          - "increment PilotOrder.version by 1"
      - from: ORDERED
        to: COLLAPSED
        trigger: "POST /pilot-orders/{id}/contingency-clearances with resolution FAILED"
        actor: DevelopmentExec | BusinessAffairs
        preconditions:
          - "pilot_order.production_status IN {ORDERED, GREEN_TO_SHOOT}"
        side_effects:
          - "cascade link 1: set the named dimension to FAILED, production_status = COLLAPSED and collapsed_reason = the kind that failed"
          - "cascade link 2: caused by link 1, the project's dev_status returns from PILOT_ORDERED to ACTIVE_DEVELOPMENT"
          - "cascade link 3: caused by link 1, the pilot leaves Slate.committed_dev_cents (COLLAPSED is outside {ORDERED, GREEN_TO_SHOOT, WRAPPED}), so Slate.available_dev_cents rises by budget_cents and Slate.posture is recomputed"
          - "increment PilotOrder.version by 1, DevelopmentProject.version by 1 and Slate.version by 1"
        note: "The same transition exists from GREEN_TO_SHOOT with identical side effects."
      - from: GREEN_TO_SHOOT
        to: WRAPPED
        trigger: "POST /pilot-orders/{id}/wrap"
        actor: DevelopmentExec
        preconditions:
          - "pilot_order.production_status == GREEN_TO_SHOOT"
          - "the logical clock date is on or after shoot_end_date"
        side_effects:
          - "set production_status = WRAPPED"
          - "set the project's dev_status from PILOT_ORDERED to PILOT_DELIVERED"
          - "increment PilotOrder.version by 1 and DevelopmentProject.version by 1"

  - entity: TestScreening
    initial_state: FIELDED
    terminal_states: [CERTIFIED, INVALIDATED]
    transitions:
      - from: FIELDED
        to: FIELDED
        trigger: "POST /pilot-orders/{id}/test-screenings (creation with results already in hand)"
        actor: ResearchAnalyst
        preconditions:
          - "pilot_order.production_status == WRAPPED"
          - "expected_pilot_order_version equals the PilotOrder's current version"
        side_effects:
          - "compute weighted_raw_score and norm_adjusted_score by the weighted_test_score calculation"
          - "every earlier TestScreening of the same pilot_order with status IN {FIELDED, CERTIFIED} becomes INVALIDATED (the new screening supersedes it)"
          - "increment PilotOrder.version by 1"
      - from: FIELDED
        to: CERTIFIED
        trigger: "POST /test-screenings/{id}/certify"
        actor: ResearchAnalyst
        preconditions:
          - "screening.status == FIELDED"
          - "screening.panel_size >= MIN_TEST_PANEL_SIZE (300)"
        side_effects:
          - "set status = CERTIFIED and certified_at = logical clock now"
      - from: FIELDED
        to: INVALIDATED
        trigger: "system: a newer TestScreening is fielded on the same PilotOrder"
        actor: system
        preconditions:
          - "screening.status IN {FIELDED, CERTIFIED}"
        side_effects:
          - "set status = INVALIDATED"
          - "the project loses its CERTIFIED research if this was its only certified screening, which re-blocks POST /negotiations"
        note: >-
          The same transition exists from CERTIFIED with identical side effects.
          CERTIFIED is therefore terminal with respect to every client-driven
          transition - certify, and any other write naming the screening, is
          refused once it is CERTIFIED - and this system supersession by a newer
          screening on the same pilot order is its only exit.

  - entity: SeriesOrderNegotiation
    initial_state: NETWORK_OFFER
    terminal_states: [AGREED, WITHDRAWN]
    transitions:
      - from: NETWORK_OFFER
        to: NETWORK_OFFER
        trigger: "POST /negotiations (creation of the opening network offer)"
        actor: BusinessAffairs
        preconditions:
          - "project.dev_status == PILOT_DELIVERED"
          - "the project's Slate has posture != LOCKED"
          - "at least one TestScreening on one of the project's PilotOrder rows has status == CERTIFIED"
          - "the most recently certified screening (highest certified_at; ties broken by lowest created_at) has norm_adjusted_score >= TEST_SCORE_FLOOR (62.0)"
          - "license_fee_per_episode_cents <= slate.license_fee_cap_per_episode_cents"
          - "network_ownership_pct + studio_ownership_pct == 100 AND backend_points_bps <= slate.max_backend_points_bps"
          - "slate.available_episode_count >= episode_count"
        side_effects:
          - "create the negotiation with status NETWORK_OFFER, round_number 1, last_offer_side NETWORK"
          - "raise Slate.reserved_episode_count by episode_count, lowering Slate.available_episode_count, and recompute Slate.posture"
          - "increment Slate.version by 1"
      - from: NETWORK_OFFER
        to: STUDIO_COUNTER
        trigger: "POST /negotiations/{id}/rounds submitted by StudioPartner"
        actor: StudioPartner
        preconditions:
          - "negotiation.status == NETWORK_OFFER"
          - "negotiation.round_number < MAX_NEGOTIATION_ROUNDS (4)"
          - "the submitted term sheet passes the same cap, ownership-split and backend checks as creation"
          - "slate.available_episode_count + negotiation.episode_count >= the submitted episode_count"
        side_effects:
          - "overwrite episode_count, license_fee_per_episode_cents, backend_points_bps, network_ownership_pct, studio_ownership_pct with the counter's terms"
          - "set status = STUDIO_COUNTER, last_offer_side = STUDIO, increment round_number by 1"
          - "reconcile Slate.reserved_episode_count by (new episode_count - old episode_count) and recompute Slate.available_episode_count and Slate.posture"
          - "increment Slate.version by 1"
      - from: STUDIO_COUNTER
        to: NETWORK_OFFER
        trigger: "POST /negotiations/{id}/rounds submitted by BusinessAffairs"
        actor: BusinessAffairs
        preconditions:
          - "negotiation.status == STUDIO_COUNTER"
          - "negotiation.round_number < MAX_NEGOTIATION_ROUNDS (4)"
          - "the submitted term sheet passes the same cap, ownership-split and backend checks as creation"
        side_effects:
          - "overwrite the term-sheet fields, set status = NETWORK_OFFER, last_offer_side = NETWORK, increment round_number by 1"
          - "reconcile Slate.reserved_episode_count by the episode_count delta and recompute Slate.posture"
        note: "Cycle: NETWORK_OFFER -> STUDIO_COUNTER -> NETWORK_OFFER repeats until round_number reaches 4."
      - from: STUDIO_COUNTER
        to: AGREED
        trigger: "POST /negotiations/{id}/accept submitted by BusinessAffairs"
        actor: BusinessAffairs
        preconditions:
          - "negotiation.status == STUDIO_COUNTER"
          - "negotiation.last_offer_side == STUDIO (the accepting side is not the side that tabled the standing sheet)"
        side_effects:
          - "set status = AGREED and agreed_at = logical clock now"
          - "the episode_count moves from Slate.reserved_episode_count into Slate.committed_episode_count, leaving Slate.available_episode_count unchanged, and Slate.posture is recomputed"
          - "increment Slate.version by 1"
      - from: NETWORK_OFFER
        to: AGREED
        trigger: "POST /negotiations/{id}/accept submitted by StudioPartner"
        actor: StudioPartner
        preconditions:
          - "negotiation.status == NETWORK_OFFER"
          - "negotiation.last_offer_side == NETWORK"
        side_effects:
          - "set status = AGREED and agreed_at = logical clock now"
          - "the episode_count moves from Slate.reserved_episode_count into Slate.committed_episode_count and Slate.posture is recomputed"
          - "increment Slate.version by 1"
      - from: NETWORK_OFFER
        to: WITHDRAWN
        trigger: "system: the project is abandoned (cascade link 2b of the abandonment chain)"
        actor: system
        preconditions:
          - "negotiation.status IN {NETWORK_OFFER, STUDIO_COUNTER}"
        side_effects:
          - "set status = WITHDRAWN and withdrawn_reason = the abandonment reason"
          - "release episode_count from Slate.reserved_episode_count, raising Slate.available_episode_count, and recompute Slate.posture"
        note: "The same transition exists from STUDIO_COUNTER with identical side effects."

  - entity: GreenlightRequest
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /greenlight-requests (creation) or POST /greenlight-requests/{id}/decisions recording the first or second committee vote"
        actor: BusinessAffairs | DevelopmentExec | FinanceController
        preconditions:
          - "on creation: negotiation.status == AGREED, negotiation.project_id == the submitted project_id, project.dev_status == PILOT_DELIVERED, expected_project_version equals the project's current version"
          - "on a decision: request.status == OPEN, the named committee's decision is PENDING, the acting X-User-ID does not already appear in another committee's decided_by field on this request"
          - "on a FINANCE decision of APPROVED: the project's feasibility verdict on the PATTERN basis at the negotiation's episode_count is FEASIBLE"
        side_effects:
          - "on creation: every other GreenlightRequest for the same project with status == OPEN becomes SUPERSEDED, project_version_at_request is stored, and DevelopmentProject.version is incremented by 1"
          - "on a decision: set the committee's decision and decided_by_user_id; status stays OPEN while any committee is still PENDING"
      - from: OPEN
        to: APPROVED
        trigger: "POST /greenlight-requests/{id}/decisions recording the third APPROVED vote (fork-join)"
        actor: DevelopmentExec | BusinessAffairs | FinanceController
        preconditions:
          - "request.status == OPEN"
          - "after applying this vote, creative_decision == APPROVED AND business_decision == APPROVED AND finance_decision == APPROVED"
        side_effects:
          - "cascade link 1: set status = APPROVED and decided_at = logical clock now"
          - "cascade link 2: caused by link 1, project.dev_status moves PILOT_DELIVERED -> SERIES_ORDERED"
          - "cascade link 3: caused by link 2, every ScriptDeal of the project with deal_status == EXECUTED becomes COMPLETED and its PENDING steps become CUT_OFF"
          - "cascade link 4: caused by link 3, Slate.committed_dev_cents drops by the released step fees and Slate.available_dev_cents plus Slate.posture are recomputed"
          - "increment DevelopmentProject.version by 1 and Slate.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /greenlight-requests/{id}/decisions recording any REJECTED vote"
        actor: DevelopmentExec | BusinessAffairs | FinanceController
        preconditions:
          - "request.status == OPEN"
          - "the named committee's decision is PENDING"
        side_effects:
          - "set the committee's decision = REJECTED, status = REJECTED and decided_at = logical clock now"
          - "the remaining committees stay PENDING forever (the join short-circuits); project.dev_status is left at PILOT_DELIVERED so business affairs may renegotiate and file a fresh request"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system: a newer GreenlightRequest is created for the same project"
        actor: system
        preconditions:
          - "request.status == OPEN"
        side_effects:
          - "set status = SUPERSEDED; recorded committee decisions are frozen as they stand"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned
# write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: greenlight-request-create-stale-project
    parent_entity: DevelopmentProject
    write_endpoint: "POST /greenlight-requests"
    occ_field: "expected_project_version"
    description: |
      Filing a GreenlightRequest against a DevelopmentProject whose version has
      advanced since the client last read it is rejected. A new request
      legitimately supersedes the project's prior OPEN request, so the write
      itself is valid under the product rules; the stale expected_project_version
      is what identifies a filer whose view of the project (its term sheet, its
      superseded request, its committee votes) is out of date.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: test-screening-create-stale-pilot-order
    parent_entity: PilotOrder
    write_endpoint: "POST /pilot-orders/{id}/test-screenings"
    occ_field: "expected_pilot_order_version"
    description: |
      Fielding a TestScreening against a PilotOrder whose version has advanced
      since the client last read it is rejected. Fielding a new screening
      legitimately invalidates the pilot's earlier screenings, so the write is
      valid under the product rules; the stale expected_pilot_order_version
      identifies a researcher who has not seen the screening that already
      superseded the one they believe is current.
    error_id: ERR_STALE_PILOT_ORDER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: pilot_series_feasibility
    trigger: >-
      Read on GET /development-projects/{id}/feasibility, and re-evaluated
      server-side when a FINANCE committee member records an APPROVED decision
      on a GreenlightRequest (the PATTERN variant at the agreed episode_count).
    algorithm: tiered_pricing
    formula: |
      # Inputs: project (for cumulative_dev_cost_cents), its slate (for the
      # platform economics), and an episode_count. `basis` selects the variant.
      # All money is integer cents; every division is floor division unless the
      # step says otherwise.

      # -- step 1: per-episode provisional cost -------------------------------
      if basis == "PATTERN":
          base_cost_per_ep = slate.pattern_budget_per_episode_cents
      else:  # basis == "LICENSE"
          factor_bps      = PLATFORM_COST_FACTOR_BPS[slate.platform]
          base_cost_per_ep = floor(slate.license_fee_cap_per_episode_cents
                                   * factor_bps / 10000)
      amortized_dev_per_ep = floor(project.cumulative_dev_cost_cents / episode_count)
      per_episode_cost_cents = base_cost_per_ep + amortized_dev_per_ep

      # -- step 2: provisional deficit selects the tier -----------------------
      # NOTE (pinned circular order): the tier is chosen from the PROVISIONAL
      # deficit measured against the slate cap, NOT from the final deficit that
      # step 4 produces. The final license fee depends on the tier and the tier
      # depends on the provisional deficit; evaluating them in any other order
      # (e.g. re-deriving the tier from deficit_per_episode_cents, or iterating
      # the pair to a fixed point) yields a different, wrong license fee whenever
      # the two deficits straddle DEFICIT_TIER1_CENTS - exactly one pass in the
      # order written here is the defined answer.
      # `provisional_deficit` is the deficit the slate WOULD carry if the network
      # paid the full cap; it is NOT deficit_per_episode_cents from step 4.
      provisional_deficit = per_episode_cost_cents - slate.license_fee_cap_per_episode_cents
      if provisional_deficit <= 0:
          tier_factor_bps = 10000
      elif provisional_deficit <= DEFICIT_TIER1_CENTS:
          tier_factor_bps = 9500
      else:
          tier_factor_bps = 9000

      # -- step 3: final license fee -----------------------------------------
      license_fee_final_cents = min(
          slate.license_fee_cap_per_episode_cents,
          floor(per_episode_cost_cents * tier_factor_bps / 10000))

      # -- step 4: deficit and verdict ---------------------------------------
      deficit_per_episode_cents = per_episode_cost_cents - license_fee_final_cents
      total_deficit_cents       = deficit_per_episode_cents * episode_count
      verdict = "FEASIBLE" if deficit_per_episode_cents
                              <= slate.max_deficit_per_episode_cents else "INFEASIBLE"
    input_set: >-
      The project's own cumulative_dev_cost_cents (itself the sum of its
      ScriptDeal.encumbered_cents plus its PilotOrder.budget_cents for pilots in
      production_status ORDERED/GREEN_TO_SHOOT/WRAPPED) and the slate's platform
      economics. episode_count defaults to
      slate.default_episode_count when the caller omits it.
    constants:
      PLATFORM_COST_FACTOR_BPS: "{BROADCAST: 11000, CABLE: 10500, STREAMING: 12000}"
      DEFICIT_TIER1_CENTS: 1500000  # tier-1/tier-2 breakpoint on the provisional deficit
      TIER0_FACTOR_BPS: 10000
      TIER1_FACTOR_BPS: 9500
      TIER2_FACTOR_BPS: 9000
    precision: "integer cents throughout; every division floors; no float arithmetic"
    variants:
      - name: PATTERN
        when: >-
          basis=PATTERN (the default). The network's own pattern budget is the
          cost base - what the network believes the show costs to make at its slot.
        difference: >-
          base_cost_per_ep = slate.pattern_budget_per_episode_cents directly, with
          no platform factor applied.
      - name: LICENSE
        when: >-
          basis=LICENSE. The studio's deficit-financing view: cost is derived from
          the licence ceiling scaled by the platform's cost factor.
        difference: >-
          base_cost_per_ep = floor(license_fee_cap_per_episode_cents *
          PLATFORM_COST_FACTOR_BPS[platform] / 10000). For any STREAMING or
          BROADCAST slate this exceeds the cap, so the LICENSE variant lands in
          tier 2 and reports a strictly larger deficit_per_episode_cents than
          PATTERN on identical data - the two bases can return opposite verdicts.
    worked_example: |
      slate: platform STREAMING (factor 12000), pattern_budget_per_episode_cents
      32000000, license_fee_cap_per_episode_cents 30000000,
      max_deficit_per_episode_cents 4000000; project cumulative_dev_cost_cents
      15000000; episode_count 10.

      PATTERN:  amortized 1500000; per_episode_cost 33500000;
                provisional_deficit 3500000 > 1500000 -> tier_factor_bps 9000;
                floor(33500000*9000/10000) = 30150000; min(cap, 30150000) =
                30000000; deficit_per_episode 3500000 <= 4000000 -> FEASIBLE;
                total_deficit 35000000.
      LICENSE:  base floor(30000000*12000/10000) = 36000000; per_episode_cost
                37500000; provisional_deficit 7500000 -> tier_factor_bps 9000;
                floor(37500000*9000/10000) = 33750000; min(cap, 33750000) =
                30000000; deficit_per_episode 7500000 > 4000000 -> INFEASIBLE;
                total_deficit 75000000.

  - name: weighted_test_score
    trigger: "POST /pilot-orders/{id}/test-screenings, at creation of the TestScreening row"
    algorithm: weighted_scoring
    formula: |
      # Each raw score is an integer 0..100. comp_norm_index is a decimal with
      # one decimal place representing the comparable-title norm (100.0 = norm).

      # -- pinned rounding order (mode b) ------------------------------------
      # Each weighted component is rounded to 2 decimal places FIRST, and the
      # rounded components are THEN summed. Summing the unrounded products and
      # rounding the total afterwards is a different, wrong answer.
      c_overall = round_half_up(overall_score      * WEIGHT_OVERALL_BPS / 10000, 2)
      c_intent  = round_half_up(intent_to_view_score * WEIGHT_INTENT_BPS / 10000, 2)
      c_appeal  = round_half_up(appeal_score        * WEIGHT_APPEAL_BPS / 10000, 2)
      weighted_raw_score = c_overall + c_intent + c_appeal          # 2 decimals

      # -- normalisation against the comparable-title index -------------------
      norm_adjusted_score = round_half_up(
          weighted_raw_score * 100 / comp_norm_index, 1)            # 1 decimal
    input_set: >-
      The three panel scores and comp_norm_index submitted with the screening.
      Nothing else feeds this calculation; the certification gate
      (panel_size >= 300) is a separate validation and does not alter the score.
    constants:
      WEIGHT_OVERALL_BPS: 4550
      WEIGHT_INTENT_BPS: 2975
      WEIGHT_APPEAL_BPS: 2475
      TEST_SCORE_FLOOR: 62.0
    precision: >-
      weighted_raw_score 2 decimal places round_half_up per component then sum;
      norm_adjusted_score 1 decimal place round_half_up
    worked_example: |
      (overall 71, intent 64, appeal 58):
        c_overall = round_half_up(71*4550/10000, 2) = round_half_up(32.305) = 32.31
        c_intent  = round_half_up(64*2975/10000, 2) = round_half_up(19.04)   = 19.04
        c_appeal  = round_half_up(58*2475/10000, 2) = round_half_up(14.355)  = 14.36
        weighted_raw_score = 65.71
        (sum-first would give 65.700 -> 65.70; the pinned order gives 65.71)
      with comp_norm_index 103.0:
        norm_adjusted_score = round_half_up(65.71*100/103.0, 1)
                            = round_half_up(63.796...) = 63.8

      Floor boundary set (overall 70, intent 60, appeal 50):
        31.85 + 17.85 + 12.38 = 62.08
        comp_norm_index 100.1 -> round_half_up(62.017...) = 62.0  -> passes (>=)
        comp_norm_index 100.3 -> round_half_up(61.894...) = 61.9  -> below floor

  - name: script_deal_commitment
    trigger: >-
      Recomputed on POST /script-deals (creation), on every DealStep transition
      (exercise, deliver, review, cutoff) and on ScriptDeal cutoff/completion.
    algorithm: aggregation
    formula: |
      # -- per-step guild floor ----------------------------------------------
      # A step's fee can never fall below the guild minimum for its step_type,
      # scaled by the writer's guild tier.
      for each step of the deal:
          floor_cents = floor(GUILD_MIN_CENTS_BASE[step.step_type]
                              * GUILD_TIER_FACTOR_BPS[writer.guild_minimum_tier]
                              / 10000)
          step.effective_fee_cents = max(step.fee_cents, floor_cents)

      # -- variant GUARANTEED_ONLY -------------------------------------------
      guaranteed_commitment_cents = sum(step.effective_fee_cents
                                        for step where step.step_index
                                                       <= deal.guaranteed_step_count)

      # -- variant FULL_OPTION ------------------------------------------------
      full_option_exposure_cents  = sum(step.effective_fee_cents
                                        for every step of the deal)

      # -- the money the slate is actually carrying right now -----------------
      encumbered_cents = sum(step.effective_fee_cents for step where
                             (step.step_index <= deal.guaranteed_step_count
                              and step.status != "CUT_OFF")
                             or (step.step_index > deal.guaranteed_step_count
                                 and step.status IN {EXERCISED, DELIVERED,
                                                     NOTES_ISSUED, ACCEPTED}))
    input_set: >-
      All DealStep rows of the ScriptDeal for the two variants (they differ only
      in the step_index filter). encumbered_cents filters differently on either
      side of guaranteed_step_count: a guaranteed step counts from execution
      onward until it is CUT_OFF, an optional step only once EXERCISED, so a deal
      whose optional steps are all still PENDING has
      encumbered_cents == guaranteed_commitment_cents.
    constants:
      GUILD_MIN_CENTS_BASE: "{STORY: 3500000, FIRST_DRAFT: 5500000, REVISION: 2500000, POLISH: 1500000}"
      GUILD_TIER_FACTOR_BPS: "{LOW: 10000, HIGH: 12500}"
    precision: "integer cents; the guild-floor scaling floors"
    variants:
      - name: GUARANTEED_ONLY
        when: >-
          The contractual floor exposure - what the network owes even if it cuts
          the writer off at the first opportunity. Surfaced as
          ScriptDeal.guaranteed_commitment_cents.
        difference: >-
          Sums only steps with step_index <= guaranteed_step_count.
      - name: FULL_OPTION
        when: >-
          The worst-case exposure if every optional step is exercised. Surfaced as
          ScriptDeal.full_option_exposure_cents.
        difference: >-
          Sums every step regardless of step_index, so it is >= GUARANTEED_ONLY and
          strictly greater whenever the deal has any optional step.
    worked_example: |
      writer.guild_minimum_tier HIGH (factor 12500), guaranteed_step_count 1,
      steps [ {index 1, STORY, fee 3000000}, {index 2, FIRST_DRAFT, fee 8000000} ]:
        STORY floor       = floor(3500000*12500/10000) = 4375000 -> effective 4375000
        FIRST_DRAFT floor = floor(5500000*12500/10000) = 6875000 -> effective 8000000
        guaranteed_commitment_cents = 4375000
        full_option_exposure_cents  = 12375000
      With guild_minimum_tier LOW the same rows give effective 3500000 and
      8000000 -> guaranteed 3500000, full_option 11500000.

  - name: project_cumulative_dev_cost
    trigger: >-
      Read as DevelopmentProject.cumulative_dev_cost_cents; recomputed after every
      DealStep transition, every ScriptDeal transition and every PilotOrder
      transition on the project.
    algorithm: aggregation
    formula: |
      script_spend = sum(ScriptDeal.encumbered_cents
                         for every ScriptDeal of this project)
      pilot_spend  = sum(PilotOrder.budget_cents
                         for PilotOrder rows of this project whose
                         production_status IN {ORDERED, GREEN_TO_SHOOT, WRAPPED})
      cumulative_dev_cost_cents = script_spend + pilot_spend
    input_set: >-
      Every ScriptDeal of the project regardless of deal_status (the per-step
      filter inside encumbered_cents carries the state logic), plus its
      non-COLLAPSED PilotOrder rows. A COLLAPSED pilot's budget leaves the number, which is why a pilot
      collapse lowers the project's dev cost and raises the slate's available
      budget in the same request.
    constants: {}
    precision: "integer cents"

  - name: slate_dev_budget_ledger
    trigger: >-
      Recomputed on every write that touches a HoldingDeal, ScriptDeal, DealStep,
      PilotOrder or project abandonment/turnaround on the slate; read on
      GET /slates/{id}.
    algorithm: aggregation
    formula: |
      committed_dev_cents  = sum(ScriptDeal.encumbered_cents over deals whose
                                 project.slate_id == slate.id)
                           + sum(PilotOrder.budget_cents over pilots whose
                                 production_status IN {ORDERED, GREEN_TO_SHOOT,
                                 WRAPPED} and project.slate_id == slate.id)
      reserved_holding_cents = sum(HoldingDeal.annual_cost_cents over holding
                                   deals on this slate with status == ACTIVE)
      writeoff_dev_cents     = sum(DevelopmentProject.writeoff_cents over the
                                   slate's projects with dev_status == ABANDONED)
      recouped_dev_cents     = sum(DevelopmentProject.recoupment_paid_cents over
                                   the slate's projects)

      available_dev_cents = total_dev_budget_cents
                          - committed_dev_cents
                          - reserved_holding_cents
                          - writeoff_dev_cents
                          + recouped_dev_cents

      # INVARIANT (must hold after every request, no drift):
      #   available_dev_cents + committed_dev_cents + reserved_holding_cents
      #     + writeoff_dev_cents - recouped_dev_cents == total_dev_budget_cents
    input_set: >-
      State-filtered as written above: ACTIVE holding deals only, non-COLLAPSED
      pilots only, ABANDONED projects only for write-offs. Terminating a holding
      deal or collapsing a pilot removes the row from its input set and the
      released cents reappear in available_dev_cents in the same response.
    constants: {}
    precision: "integer cents; no rounding is performed anywhere in this ledger"

  - name: slate_episode_inventory
    trigger: >-
      Recomputed on POST /negotiations, POST /negotiations/{id}/rounds,
      POST /negotiations/{id}/accept and on the abandonment cascade's negotiation
      withdrawal; read on GET /slates/{id}.
    algorithm: threshold
    formula: |
      reserved_episode_count  = sum(SeriesOrderNegotiation.episode_count over the
                                    slate's projects' negotiations whose status
                                    IN {NETWORK_OFFER, STUDIO_COUNTER})
      committed_episode_count = sum(SeriesOrderNegotiation.episode_count over the
                                    slate's projects' negotiations whose status
                                    == AGREED)
      available_episode_count = episode_capacity
                              - committed_episode_count
                              - reserved_episode_count

      # -- posture threshold (boundary semantics are >=, not >) ---------------
      if committed_episode_count >= episode_capacity:
          posture = "LOCKED"
      elif floor((committed_episode_count + reserved_episode_count) * 10000
                 / episode_capacity) >= POSTURE_RESTRICTED_BPS:
          posture = "RESTRICTED"
      else:
          posture = "OPEN"

      # INVARIANT (must hold after every request, no drift):
      #   episode_capacity == available_episode_count + reserved_episode_count
      #                       + committed_episode_count
    input_set: >-
      Open negotiations (NETWORK_OFFER, STUDIO_COUNTER) reserve; AGREED
      negotiations commit; WITHDRAWN negotiations contribute nothing. A counter
      that changes episode_count reconciles the reservation by the delta rather
      than adding a second reservation.
    constants:
      POSTURE_RESTRICTED_BPS: 6000
    precision: "integer episode counts; the utilisation ratio floors before comparison"
    worked_example: |
      episode_capacity 20, committed 6, reserved 6:
        floor((6+6)*10000/20) = 6000 >= 6000 -> RESTRICTED (exactly at the boundary)
      episode_capacity 20, committed 6, reserved 5:
        floor(11*10000/20) = 5500 < 6000 -> OPEN
      episode_capacity 20, committed 20, reserved 0 -> LOCKED

  - name: turnaround_recoupment
    trigger: >-
      Read as DevelopmentProject.recoupment_amount_cents on any ABANDONED project
      whose turnaround_status is OFFERED or EXERCISED; charged on
      POST /development-projects/{id}/turnaround-exercise.
    algorithm: tiered_pricing
    formula: |
      months_elapsed = whole calendar months from the project's abandoned_at date
                       to the logical clock's current date (floor; a partial month
                       does not count)
      interest_cents = floor(project.writeoff_cents
                             * TURNAROUND_INTEREST_BPS_PER_YEAR
                             * months_elapsed / (10000 * 12))
      # tiered handling fee on the size of the write-off
      if project.writeoff_cents <= HANDLING_TIER1_CENTS:
          handling_fee_cents = HANDLING_FEE_TIER1_CENTS
      elif project.writeoff_cents <= HANDLING_TIER2_CENTS:
          handling_fee_cents = HANDLING_FEE_TIER2_CENTS
      else:
          handling_fee_cents = HANDLING_FEE_TIER3_CENTS

      recoupment_amount_cents = min(
          project.writeoff_cents + interest_cents + handling_fee_cents,
          floor(project.writeoff_cents * RECOUPMENT_CAP_BPS / 10000))
    input_set: >-
      The abandoned project's frozen writeoff_cents (never recomputed after
      abandonment), its abandoned_at, and the logical clock. The nested cap means
      a long-dormant project stops accruing once the total reaches 135% of the
      write-off.
    constants:
      TURNAROUND_INTEREST_BPS_PER_YEAR: 900
      TURNAROUND_WINDOW_DAYS: 180
      HANDLING_TIER1_CENTS: 10000000
      HANDLING_TIER2_CENTS: 50000000
      HANDLING_FEE_TIER1_CENTS: 250000
      HANDLING_FEE_TIER2_CENTS: 750000
      HANDLING_FEE_TIER3_CENTS: 1500000
      RECOUPMENT_CAP_BPS: 13500
    precision: "integer cents; both the interest and the cap floor"
    worked_example: |
      writeoff_cents 19375000, abandoned_at 2026-08-15, clock 2026-11-20
      -> months_elapsed 3:
        interest  = floor(19375000*900*3/120000) = floor(435937.5) = 435937
        handling  = 750000 (19375000 is in (10000000, 50000000])
        sum       = 19375000 + 435937 + 750000 = 20560937
        cap       = floor(19375000*13500/10000) = 26156250
        recoupment_amount_cents = 20560937

  - name: agency_submission_quota
    trigger: >-
      Recomputed on POST /pitches and on any change of Agency.relationship_tier;
      read as Agency.effective_submission_cap and Agency.submissions_used_count.
    algorithm: threshold
    formula: |
      if agency.relationship_tier == "PROBATION":
          effective_submission_cap = PROBATION_SUBMISSION_CAP
      elif agency.relationship_tier == "PREMIER":
          effective_submission_cap = agency.annual_submission_cap
                                     + PREMIER_SUBMISSION_BONUS
      else:  # STANDARD
          effective_submission_cap = agency.annual_submission_cap

      submissions_used_count = count(Pitch rows with this agency_id whose status
                                     IN {SUBMITTED, COVERED, ADVANCED} and whose
                                     slate's season_year equals the season_year of
                                     the slate named in the request under evaluation)
      # PASSED pitches are forgiven and do not consume the annual cap.

      # a further POST /pitches is refused when
      #   submissions_used_count >= effective_submission_cap
    input_set: >-
      The agency's own pitches in status SUBMITTED, COVERED or ADVANCED. A pitch
      the network passes on is not charged against the agency's allotment, so a
      coverage PASS frees a slot immediately.
    constants:
      PROBATION_SUBMISSION_CAP: 1
      PREMIER_SUBMISSION_BONUS: 2
    precision: "integer counts; comparison is >= so the cap-th pitch is the last accepted one"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in strict priority order; the first rule
# whose condition is violated determines the response, and no later rule runs)
# ---------------------------------------------------------------------------
validations:
  # --- authentication / authorization -------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: >-
      X-User-Role is one of the seven roles declared in §1.7 and that role is
      listed in the target endpoint's roles
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: >-
      when X-User-Role is AgencyRep, X-User-ID equals the agency_id of the Agency
      the request touches (the agency_id in a pitch payload, or the agency_id of
      the pitch/writer named in the path)
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /pitches, GET /pitches/{id}, GET /pitches, POST /writers, GET /writers/{id}, GET /writers"

  - priority: 4
    category: auth
    check: >-
      the committee named in a greenlight decision matches the acting role -
      CREATIVE requires DevelopmentExec, BUSINESS requires BusinessAffairs,
      FINANCE requires FinanceController
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /greenlight-requests/{id}/decisions"

  - priority: 5
    category: auth
    check: >-
      a contingency clearance with resolution WAIVED is recorded only by
      BusinessAffairs; DevelopmentExec may record SATISFIED or FAILED only
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /pilot-orders/{id}/contingency-clearances"

  - priority: 6
    category: auth
    check: >-
      segregation of duties - the X-User-ID recording a greenlight committee
      decision does not already appear in any other committee's
      *_decided_by_user_id on the same GreenlightRequest
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /greenlight-requests/{id}/decisions"

  # --- existence ------------------------------------------------------------
  - priority: 7
    category: existence
    check: >-
      every id in the path exists, validated left to right (agency, slate,
      writer, pitch, development project, script deal, deal step, pilot order,
      test screening, negotiation, greenlight request, holding deal)
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_SLATE_NOT_FOUND | ERR_WRITER_NOT_FOUND | ERR_PITCH_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_SCRIPT_DEAL_NOT_FOUND | ERR_DEAL_STEP_NOT_FOUND | ERR_PILOT_ORDER_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_GREENLIGHT_NOT_FOUND | ERR_HOLDING_DEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 8
    category: existence
    check: >-
      every foreign key in the request body resolves to an existing row
      (agency_id, slate_id, writer_id, project_id, negotiation_id), and a nested
      id belongs to its path parent (deal step belongs to the script deal)
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_SLATE_NOT_FOUND | ERR_WRITER_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_DEAL_STEP_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign keys or nested ids"

  # --- request shape --------------------------------------------------------
  - priority: 9
    category: existence
    check: >-
      required fields are present, enum values are members of their declared
      enum, integers are non-negative, scores are within 0..100, comp_norm_index
      is greater than 0, ownership percentages are 0..100, dates are ISO-8601,
      the steps array holds 1..6 entries each carrying a valid step_type and a
      non-negative fee_cents, and guaranteed_step_count is between 1 and the
      number of submitted steps
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- state preconditions -------------------------------------------------
  - priority: 10
    category: state
    check: "the pitch is in a status that permits the operation (coverage requires SUBMITTED or COVERED; advance requires COVERED)"
    error_id: ERR_INVALID_PITCH_STATE
    http_status: 409
    applies_to: "POST /pitches/{id}/coverage, POST /pitches/{id}/rights-checks, POST /pitches/{id}/advance"

  - priority: 11
    category: state
    check: >-
      the development project is in a dev_status that permits the operation
      (script deals require ACTIVE_DEVELOPMENT or SCRIPT_COMPLETE; abandonment
      requires any of ACTIVE_DEVELOPMENT, SCRIPT_COMPLETE, PILOT_ORDERED or
      PILOT_DELIVERED; pilot order requires SCRIPT_COMPLETE; test screening
      requires the pilot WRAPPED; negotiation and greenlight require
      PILOT_DELIVERED; turnaround requires ABANDONED)
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /script-deals, POST /pilot-orders, POST /negotiations, POST /greenlight-requests, POST /development-projects/{id}/abandon, POST /development-projects/{id}/turnaround, POST /development-projects/{id}/turnaround-exercise"

  - priority: 12
    category: state
    check: "the script deal's deal_status is EXECUTED (COMPLETED, CUT_OFF and TERMINATED deals are frozen)"
    error_id: ERR_INVALID_DEAL_STATE
    http_status: 409
    applies_to: "POST /script-deals/{id}/steps/{step_id}/exercise, POST /script-deals/{id}/steps/{step_id}/deliver, POST /script-deals/{id}/steps/{step_id}/review, POST /script-deals/{id}/cutoff"

  - priority: 13
    category: state
    check: >-
      the deal step is in the status the operation requires (exercise requires
      PENDING, deliver requires EXERCISED or NOTES_ISSUED, review requires
      DELIVERED), and for exercise every step with a lower step_index is already
      ACCEPTED or CUT_OFF
    error_id: ERR_INVALID_DEAL_STEP_STATE
    http_status: 409
    applies_to: "POST /script-deals/{id}/steps/{step_id}/exercise, POST /script-deals/{id}/steps/{step_id}/deliver, POST /script-deals/{id}/steps/{step_id}/review"

  - priority: 14
    category: state
    check: >-
      the pilot order's production_status permits the operation (clearances
      require ORDERED or GREEN_TO_SHOOT, wrap requires GREEN_TO_SHOOT, test
      screening requires WRAPPED)
    error_id: ERR_INVALID_PILOT_ORDER_STATE
    http_status: 409
    applies_to: "POST /pilot-orders/{id}/contingency-clearances, POST /pilot-orders/{id}/wrap, POST /pilot-orders/{id}/test-screenings"

  - priority: 15
    category: state
    check: "the contingency dimension named by kind is still PENDING on this pilot order"
    error_id: ERR_CONTINGENCY_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /pilot-orders/{id}/contingency-clearances"

  - priority: 16
    category: state
    check: "the test screening's status is FIELDED (CERTIFIED and INVALIDATED screenings cannot be certified)"
    error_id: ERR_INVALID_SCREENING_STATE
    http_status: 409
    applies_to: "POST /test-screenings/{id}/certify"

  - priority: 17
    category: state
    check: "the negotiation's status is NETWORK_OFFER or STUDIO_COUNTER (AGREED and WITHDRAWN negotiations are closed)"
    error_id: ERR_INVALID_NEGOTIATION_STATE
    http_status: 409
    applies_to: "POST /negotiations/{id}/rounds, POST /negotiations/{id}/accept, POST /greenlight-requests"

  - priority: 18
    category: state
    check: "the greenlight request's status is OPEN (APPROVED, REJECTED and SUPERSEDED requests take no further decisions)"
    error_id: ERR_INVALID_GREENLIGHT_STATE
    http_status: 409
    applies_to: "POST /greenlight-requests/{id}/decisions"

  - priority: 19
    category: state
    check: "the named committee's decision on this greenlight request is still PENDING"
    error_id: ERR_COMMITTEE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /greenlight-requests/{id}/decisions"

  - priority: 20
    category: state
    check: >-
      the accepting side is not the side that tabled the standing offer -
      StudioPartner may accept only when last_offer_side is NETWORK and
      BusinessAffairs only when last_offer_side is STUDIO
    error_id: ERR_ACCEPT_BY_OFFERING_SIDE
    http_status: 409
    applies_to: "POST /negotiations/{id}/accept"

  # --- optimistic concurrency (§1.2.1) --------------------------------------
  - priority: 21
    category: state
    check: "expected_project_version equals the DevelopmentProject's current version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /greenlight-requests"

  - priority: 22
    category: state
    check: "expected_pilot_order_version equals the PilotOrder's current version"
    error_id: ERR_STALE_PILOT_ORDER_VERSION
    http_status: 412
    applies_to: "POST /pilot-orders/{id}/test-screenings"

  # --- business rules: rights / talent safety first -------------------------
  - priority: 23
    category: business_safety
    check: >-
      a pitch that lists packaging_elements may only be submitted by an agency
      whose packaging_allowed is true
    error_id: ERR_PACKAGING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /pitches"

  - priority: 24
    category: business_safety
    check: >-
      the pitch has at least one RightsCheck and its most recent check (highest
      created_at) has result CLEAR
    error_id: ERR_RIGHTS_NOT_CLEAR
    http_status: 422
    applies_to: "POST /pitches/{id}/advance"

  - priority: 25
    category: business_safety
    check: >-
      the writer is not exclusive to another slate - a writer whose
      exclusivity_status is HOLDING_DEAL may only take a script deal on a project
      belonging to the slate that holds them
    error_id: ERR_WRITER_EXCLUSIVITY_CONFLICT
    http_status: 422
    applies_to: "POST /script-deals"

  - priority: 26
    category: business_safety
    check: >-
      a guaranteed step (step_index <= guaranteed_step_count) is never cuttable,
      either individually or by a deal-level cutoff while it is still PENDING
    error_id: ERR_GUARANTEED_STEP_NOT_CUTTABLE
    http_status: 422
    applies_to: "POST /script-deals/{id}/cutoff"

  - priority: 27
    category: business_safety
    check: "the screening's panel_size is at least MIN_TEST_PANEL_SIZE (300) before it may be certified"
    error_id: ERR_TEST_SAMPLE_TOO_SMALL
    http_status: 422
    applies_to: "POST /test-screenings/{id}/certify"

  # --- business rules: temporal windows ------------------------------------
  - priority: 28
    category: business_temporal
    check: >-
      the underlying IP is free on the logical clock date - the pitch may not be
      advanced while the most recent RightsCheck's closed holdback interval
      [holdback_start_date, holdback_end_date] or its 90-day quiet buffer
      (through quiet_period_end_date, inclusive) still contains today
    error_id: ERR_RIGHTS_HOLDBACK_CONFLICT
    http_status: 422
    applies_to: "POST /pitches/{id}/advance"

  - priority: 29
    category: business_temporal
    check: >-
      the writer has no other ACTIVE holding deal whose half-open term
      [term_start_date, term_end_date) overlaps the submitted term; abutting
      terms (one ends exactly where the next begins) are permitted
    error_id: ERR_HOLDING_DEAL_OVERLAP
    http_status: 422
    applies_to: "POST /holding-deals"

  - priority: 30
    category: business_temporal
    check: >-
      the logical clock's current instant is strictly before the step's
      option_expires_at (an exercise at exactly option_expires_at is too late)
    error_id: ERR_OPTION_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /script-deals/{id}/steps/{step_id}/exercise"

  - priority: 31
    category: business_temporal
    check: "the logical clock date is on or after the pilot order's shoot_end_date"
    error_id: ERR_SHOOT_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /pilot-orders/{id}/wrap"

  - priority: 32
    category: business_temporal
    check: >-
      the turnaround window is still open - the logical clock is within
      TURNAROUND_WINDOW_DAYS (180) of turnaround_offered_at, inclusive of the
      last day
    error_id: ERR_TURNAROUND_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /development-projects/{id}/turnaround-exercise"

  # --- business rules: constraint satisfaction ------------------------------
  - priority: 33
    category: business_constraint
    check: "the slate's posture is not LOCKED"
    error_id: ERR_SLATE_POSTURE_LOCKED
    http_status: 409
    applies_to: "POST /pitches/{id}/advance, POST /pilot-orders, POST /negotiations"

  - priority: 34
    category: business_constraint
    check: >-
      the writer's open_step_count (steps in EXERCISED, DELIVERED or
      NOTES_ISSUED across all their deals) stays at or below
      MAX_OPEN_STEPS_PER_WRITER (2)
    error_id: ERR_WRITER_STEP_LOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /script-deals/{id}/steps/{step_id}/exercise"

  - priority: 35
    category: business_constraint
    check: "the step's notes_round is below MAX_NOTES_ROUNDS (2) before a further notes round is issued"
    error_id: ERR_NOTES_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /script-deals/{id}/steps/{step_id}/review"

  - priority: 36
    category: business_constraint
    check: "the negotiation's round_number is below MAX_NEGOTIATION_ROUNDS (4)"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /negotiations/{id}/rounds"

  - priority: 37
    category: business_constraint
    check: >-
      the term sheet is internally coherent - network_ownership_pct +
      studio_ownership_pct == 100, backend_points_bps <=
      slate.max_backend_points_bps, and episode_count >= 1
    error_id: ERR_TERM_SHEET_INVALID
    http_status: 422
    applies_to: "POST /negotiations, POST /negotiations/{id}/rounds"

  - priority: 38
    category: business_constraint
    check: "license_fee_per_episode_cents is at or below slate.license_fee_cap_per_episode_cents"
    error_id: ERR_LICENSE_FEE_ABOVE_CAP
    http_status: 422
    applies_to: "POST /negotiations, POST /negotiations/{id}/rounds"

  - priority: 39
    category: business_constraint
    check: >-
      the pilot budget is within MAX_PILOT_VARIANCE_BPS (1500) of the slate's
      pattern_budget_per_episode_cents - that is, budget_variance_bps <= 1500
    error_id: ERR_PILOT_BUDGET_ABOVE_PATTERN
    http_status: 422
    applies_to: "POST /pilot-orders"

  - priority: 40
    category: business_constraint
    check: >-
      the number of pilots the slate has in production_status ORDERED or
      GREEN_TO_SHOOT stays at or below slate.max_concurrent_pilot_shoots
    error_id: ERR_STAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /pilot-orders"

  - priority: 41
    category: business_constraint
    check: "the agency's submissions_used_count is below its effective_submission_cap"
    error_id: ERR_AGENCY_SUBMISSION_CAP_REACHED
    http_status: 422
    applies_to: "POST /pitches"

  # --- business rules: referential coherence -------------------------------
  - priority: 42
    category: business_referential
    check: "the negotiation named in the greenlight request belongs to the project named in the same request"
    error_id: ERR_NEGOTIATION_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /greenlight-requests"

  - priority: 43
    category: business_referential
    check: >-
      at least one TestScreening on one of the project's pilot orders has status
      CERTIFIED
    error_id: ERR_NO_CERTIFIED_TEST
    http_status: 422
    applies_to: "POST /negotiations"

  - priority: 44
    category: business_referential
    check: >-
      the project's most recently certified screening (highest certified_at, ties
      broken by lowest created_at) has norm_adjusted_score >= TEST_SCORE_FLOOR
      (62.0)
    error_id: ERR_TEST_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /negotiations"

  # --- business rules: fiscal checks last ----------------------------------
  - priority: 45
    category: business_fiscal
    check: >-
      the slate's available_dev_cents covers the new commitment - a script deal's
      guaranteed_commitment_cents, a holding deal's annual_cost_cents, or a pilot
      order's budget_cents
    error_id: ERR_SLATE_DEV_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /script-deals, POST /holding-deals, POST /pilot-orders"

  - priority: 46
    category: business_fiscal
    check: >-
      the slate's available_episode_count covers the episode_count being reserved
      (on a counter, the delta against the reservation already held)
    error_id: ERR_EPISODE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /negotiations, POST /negotiations/{id}/rounds"

  - priority: 47
    category: business_fiscal
    check: >-
      a FINANCE committee APPROVED decision requires the project's
      pilot_series_feasibility verdict on the PATTERN basis, at the negotiation's
      agreed episode_count, to be FEASIBLE
    error_id: ERR_FEASIBILITY_FAILED
    http_status: 422
    applies_to: "POST /greenlight-requests/{id}/decisions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoints (api_prefix is empty, so every path below is the full path)
# ---------------------------------------------------------------------------
endpoints:
  # --- Agency ---------------------------------------------------------------
  - method: POST
    path: "/agencies"
    description: Register a talent/literary agency and its submission relationship with the network.
    roles: [PlatformAdmin]
    code: 201
    input: [name, agency_code, relationship_tier, packaging_allowed, annual_submission_cap]
    output: Agency
    side_effects:
      - "computes effective_submission_cap by the agency_submission_quota calculation"
      - "submissions_used_count starts at 0"

  - method: GET
    path: "/agencies/{id}"
    description: Read one agency including its computed submission allotment and usage.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, AgencyRep]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- Slate ----------------------------------------------------------------
  - method: POST
    path: "/slates"
    description: Open a development slate for a platform and season with its budget and episode economics.
    roles: [PlatformAdmin]
    code: 201
    input: [platform, season_year, total_dev_budget_cents, pattern_budget_per_episode_cents, license_fee_cap_per_episode_cents, max_deficit_per_episode_cents, episode_capacity, default_episode_count, max_backend_points_bps, max_concurrent_pilot_shoots]
    output: Slate
    side_effects:
      - "initialises the slate_dev_budget_ledger and slate_episode_inventory calculations; posture starts OPEN"

  - method: GET
    path: "/slates/{id}"
    description: Read one slate with its live dollar ledger, episode inventory and posture.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: []
    output: Slate
    side_effects: []

  # --- Writer ---------------------------------------------------------------
  - method: POST
    path: "/writers"
    description: Register a writer represented by an agency, with their guild tier and quote.
    roles: [PlatformAdmin, AgencyRep]
    code: 201
    input: [full_name, agency_id, guild_minimum_tier, quote_per_step_cents]
    output: Writer
    side_effects:
      - "exclusivity_status starts FREE and open_step_count starts 0"

  - method: GET
    path: "/writers/{id}"
    description: Read one writer with computed exclusivity_status and open_step_count.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, AgencyRep]
    code: 200
    input: []
    output: Writer
    side_effects: []

  - method: GET
    path: "/writers"
    description: List writers, optionally narrowed to one agency or one exclusivity status.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, AgencyRep]
    code: 200
    input: ["agency_id?", "exclusivity_status?", "limit?", "offset?"]
    output: Writer[]
    side_effects: []

  # --- HoldingDeal ----------------------------------------------------------
  - method: POST
    path: "/holding-deals"
    description: Put a writer under an exclusive holding deal funded by a slate's development budget.
    roles: [BusinessAffairs]
    code: 201
    input: [writer_id, slate_id, annual_cost_cents, term_start_date, term_end_date]
    output: HoldingDeal
    side_effects:
      - "status is ACTIVE; term_state is derived from the logical clock against the half-open term"
      - "raises Slate.reserved_holding_cents by annual_cost_cents, lowering Slate.available_dev_cents"
      - "increments Slate.version by 1"
      - "the writer's exclusivity_status becomes HOLDING_DEAL once the term contains the clock date"

  - method: GET
    path: "/holding-deals/{id}"
    description: Read one holding deal with its computed term_state.
    roles: [PlatformAdmin, BusinessAffairs, DevelopmentExec]
    code: 200
    input: []
    output: HoldingDeal
    side_effects: []

  - method: GET
    path: "/holding-deals"
    description: List holding deals, optionally narrowed by writer, slate or status.
    roles: [PlatformAdmin, BusinessAffairs, DevelopmentExec]
    code: 200
    input: ["writer_id?", "slate_id?", "status?", "limit?", "offset?"]
    output: HoldingDeal[]
    side_effects: []

  - method: POST
    path: "/holding-deals/{id}/terminate"
    description: Terminate an ACTIVE holding deal and release its reservation against the slate.
    roles: [BusinessAffairs]
    code: 200
    input: [termination_reason]
    output: HoldingDeal
    side_effects:
      - "sets status TERMINATED and records termination_reason"
      - "lowers Slate.reserved_holding_cents by annual_cost_cents, restoring Slate.available_dev_cents exactly (compensating pair with creation - no drift)"
      - "increments Slate.version by 1"
      - "the writer's exclusivity_status falls back to FREE unless another ACTIVE in-term deal exists"

  # --- Pitch ----------------------------------------------------------------
  - method: POST
    path: "/pitches"
    description: Submit a pitch from an agency against a slate.
    roles: [AgencyRep]
    code: 201
    input: [agency_id, slate_id, title, logline, packaging_elements, underlying_ip_key]
    output: Pitch
    side_effects:
      - "status starts SUBMITTED, coverage_round 0, coverage_score and recommendation null"
      - "raises the agency's submissions_used_count by 1"

  - method: GET
    path: "/pitches/{id}"
    description: Read one pitch with its coverage state.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, AgencyRep]
    code: 200
    input: []
    output: Pitch
    side_effects: []

  - method: GET
    path: "/pitches"
    description: List pitches, optionally narrowed by agency, slate or status.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, AgencyRep]
    code: 200
    input: ["agency_id?", "slate_id?", "status?", "limit?", "offset?"]
    output: Pitch[]
    side_effects: []

  - method: POST
    path: "/pitches/{id}/coverage"
    description: Record a coverage read on a pitch; a PASS recommendation closes the pitch and refunds the agency's slot.
    roles: [DevelopmentExec]
    code: 200
    input: [coverage_score, recommendation]
    output: Pitch
    side_effects:
      - "increments coverage_round by 1 and overwrites coverage_score and recommendation"
      - "recommendation ADVANCE moves status SUBMITTED -> COVERED (or leaves an already COVERED pitch COVERED)"
      - "recommendation PASS moves status to PASSED, which drops the pitch out of the agency's submissions_used_count"

  - method: POST
    path: "/pitches/{id}/rights-checks"
    description: File a chain-of-title and availability clearance record against a pitch's underlying IP.
    roles: [BusinessAffairs]
    code: 201
    input: [underlying_ip_key, chain_of_title_status, holdback_start_date, holdback_end_date]
    output: RightsCheck
    side_effects:
      - "computes quiet_period_end_date as holdback_end_date + 90 days"
      - "computes result CLEAR, ENCUMBERED or BLOCKED from chain_of_title_status and the holdback window against the logical clock"

  - method: GET
    path: "/pitches/{id}/rights-checks"
    description: List every rights check filed against a pitch, newest last.
    roles: [PlatformAdmin, BusinessAffairs, DevelopmentExec]
    code: 200
    input: ["limit?", "offset?"]
    output: RightsCheck[]
    side_effects: []

  - method: POST
    path: "/pitches/{id}/advance"
    description: Advance a covered, rights-clear pitch into active development, creating the DevelopmentProject.
    roles: [DevelopmentExec]
    code: 201
    input: []
    output: DevelopmentProject
    side_effects:
      - "moves the pitch status COVERED -> ADVANCED"
      - "creates a DevelopmentProject with dev_status ACTIVE_DEVELOPMENT, turnaround_status NONE, title copied from the pitch, predecessor_project_id null"
      - "the new project's cumulative_dev_cost_cents starts at 0"

  # --- DevelopmentProject ---------------------------------------------------
  - method: GET
    path: "/development-projects/{id}"
    description: Read one development project with its cumulative dev cost and turnaround state.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: []
    output: DevelopmentProject
    side_effects: []

  - method: GET
    path: "/development-projects"
    description: List development projects, optionally narrowed by originating pitch, slate, predecessor project or dev_status.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: ["pitch_id?", "slate_id?", "predecessor_project_id?", "dev_status?", "limit?", "offset?"]
    output: DevelopmentProject[]
    side_effects: []

  - method: GET
    path: "/development-projects/{id}/feasibility"
    description: >-
      Computed read of the pilot_series_feasibility calculation for this project.
      basis selects the PATTERN (default) or LICENSE variant; episode_count
      defaults to the slate's default_episode_count.
    roles: [DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: ["basis?", "episode_count?"]
    output: "{ basis: string, episode_count: integer, per_episode_cost_cents: integer, tier_factor_bps: integer, license_fee_final_cents: integer, deficit_per_episode_cents: integer, total_deficit_cents: integer, verdict: string }"
    side_effects: []

  - method: GET
    path: "/development-projects/{id}/pilot-orders"
    description: List the pilot orders placed on this project, including collapsed ones.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, ResearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: PilotOrder[]
    side_effects: []

  - method: GET
    path: "/development-projects/{id}/negotiations"
    description: List the series-order negotiations opened on this project.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, FinanceController, StudioPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: SeriesOrderNegotiation[]
    side_effects: []

  - method: POST
    path: "/development-projects/{id}/abandon"
    description: >-
      Abandon a development project, freezing its write-off and unwinding every
      downstream commitment in one cascade.
    roles: [DevelopmentExec]
    code: 200
    input: [abandon_reason]
    output: DevelopmentProject
    side_effects:
      - "cascade link 1 (evaluated first): writeoff_cents is frozen at the project's current cumulative_dev_cost_cents, dev_status becomes ABANDONED, abandoned_at is stamped from the logical clock"
      - "cascade link 2: every EXECUTED ScriptDeal of the project becomes TERMINATED"
      - "cascade link 2b: every NETWORK_OFFER or STUDIO_COUNTER negotiation becomes WITHDRAWN, releasing its episode reservation"
      - "cascade link 2c: every ORDERED or GREEN_TO_SHOOT pilot order becomes COLLAPSED with collapsed_reason PROJECT_ABANDONED"
      - "cascade link 3: caused by link 2, every step of those deals that is not already CUT_OFF becomes CUT_OFF, ACCEPTED steps included, driving each deal's encumbered_cents to 0"
      - "cascade link 4: caused by link 3, Slate.committed_dev_cents falls to exclude the released steps and the collapsed pilots, Slate.writeoff_dev_cents rises by writeoff_cents, and Slate.available_dev_cents plus Slate.posture are recomputed"
      - "increments DevelopmentProject.version by 1 and Slate.version by 1"

  - method: POST
    path: "/development-projects/{id}/turnaround"
    description: Offer an abandoned project into turnaround, opening the 180-day exercise window.
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: DevelopmentProject
    side_effects:
      - "moves turnaround_status NONE -> OFFERED and stamps turnaround_offered_at from the logical clock"
      - "turnaround_window_open becomes true and recoupment_amount_cents becomes readable"

  - method: POST
    path: "/development-projects/{id}/turnaround-exercise"
    description: >-
      Exercise a turnaround offer: the studio pays the recoupment and a successor
      project is created carrying the same underlying pitch.
    roles: [BusinessAffairs]
    code: 201
    input: [successor_title]
    output: DevelopmentProject
    side_effects:
      - "moves turnaround_status OFFERED -> EXERCISED on the predecessor and sets its recoupment_paid_cents to the turnaround_recoupment result"
      - "creates a successor DevelopmentProject with dev_status ACTIVE_DEVELOPMENT, predecessor_project_id set to the abandoned project, pitch_id and slate_id copied from it, and title = successor_title"
      - "raises Slate.recouped_dev_cents by the paid amount, restoring that much of Slate.available_dev_cents"
      - "increments the predecessor's version by 1 and Slate.version by 1; the response is the newly created successor project"

  # --- ScriptDeal -----------------------------------------------------------
  - method: POST
    path: "/script-deals"
    description: >-
      Execute a step deal attaching a writer to a project, with its full step
      ladder and the option period that governs each optional step.
    roles: [BusinessAffairs]
    code: 201
    input: [project_id, writer_id, guaranteed_step_count, option_period_days, steps]
    output: ScriptDeal
    side_effects:
      - "creates the deal with deal_status EXECUTED and one DealStep per entry of steps, in submitted order, with step_index starting at 1 (each entry carries step_type and fee_cents)"
      - "every step is created PENDING with option_expires_at = the deal's created_at plus (step_index * option_period_days) days"
      - "computes each step's effective_fee_cents against the writer's guild tier, then guaranteed_commitment_cents, full_option_exposure_cents and encumbered_cents by the script_deal_commitment calculation; at creation encumbered_cents equals guaranteed_commitment_cents"
      - "raises the project's cumulative_dev_cost_cents and the slate's committed_dev_cents by encumbered_cents, lowering available_dev_cents"
      - "increments DevelopmentProject.version by 1 and Slate.version by 1"

  - method: GET
    path: "/script-deals/{id}"
    description: Read one script deal with both commitment variants and its live encumbrance.
    roles: [PlatformAdmin, BusinessAffairs, DevelopmentExec, FinanceController]
    code: 200
    input: []
    output: ScriptDeal
    side_effects: []

  - method: GET
    path: "/script-deals"
    description: List script deals, optionally narrowed by project, writer or deal_status.
    roles: [PlatformAdmin, BusinessAffairs, DevelopmentExec, FinanceController]
    code: 200
    input: ["project_id?", "writer_id?", "deal_status?", "limit?", "offset?"]
    output: ScriptDeal[]
    side_effects: []

  - method: GET
    path: "/script-deals/{id}/steps"
    description: List the deal's steps in step_index order with their effective fees and option expiries.
    roles: [PlatformAdmin, BusinessAffairs, DevelopmentExec, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: DealStep[]
    side_effects: []

  - method: POST
    path: "/script-deals/{id}/steps/{step_id}/exercise"
    description: Exercise an optional step inside its option period, committing the network to its fee.
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: DealStep
    side_effects:
      - "moves the step PENDING -> EXERCISED and stamps exercised_at from the logical clock"
      - "for an optional step (step_index > guaranteed_step_count) raises the deal's encumbered_cents, the project's cumulative_dev_cost_cents and the slate's committed_dev_cents by the step's effective_fee_cents; a guaranteed step is already encumbered from execution, so those ledgers do not move"
      - "raises the writer's open_step_count by 1"
      - "if the project was SCRIPT_COMPLETE and this is an optional step, it returns to ACTIVE_DEVELOPMENT"
      - "increments DealStep.version, ScriptDeal.version, DevelopmentProject.version and Slate.version by 1 each"

  - method: POST
    path: "/script-deals/{id}/steps/{step_id}/deliver"
    description: Record delivery of an exercised step's material, or redelivery after a notes round.
    roles: [BusinessAffairs, DevelopmentExec]
    code: 200
    input: []
    output: DealStep
    side_effects:
      - "moves the step EXERCISED -> DELIVERED, or NOTES_ISSUED -> DELIVERED on a redelivery"
      - "stamps delivered_at from the logical clock; notes_round is left untouched"

  - method: POST
    path: "/script-deals/{id}/steps/{step_id}/review"
    description: >-
      Review a delivered step: outcome NOTES issues a further notes round,
      outcome ACCEPT closes the step and may complete the deal.
    roles: [DevelopmentExec]
    code: 200
    input: [outcome, "notes_summary?"]
    output: DealStep
    side_effects:
      - "outcome NOTES moves DELIVERED -> NOTES_ISSUED and increments notes_round by 1 (cycle back to DELIVERED on redelivery)"
      - "outcome ACCEPT moves DELIVERED -> ACCEPTED, stamps accepted_at and lowers the writer's open_step_count by 1"
      - "on ACCEPT, when every step with step_index <= guaranteed_step_count on the project's deals is ACCEPTED, the project bubbles up ACTIVE_DEVELOPMENT -> SCRIPT_COMPLETE"
      - "increments DealStep.version by 1 and, when the bubble-up fires, ScriptDeal.version and DevelopmentProject.version by 1"

  - method: POST
    path: "/script-deals/{id}/cutoff"
    description: Cut the writer off after the guaranteed steps, releasing every remaining optional step.
    roles: [BusinessAffairs]
    code: 200
    input: [cutoff_reason]
    output: ScriptDeal
    side_effects:
      - "moves deal_status EXECUTED -> CUT_OFF and every PENDING step to CUT_OFF; refused with ERR_GUARANTEED_STEP_NOT_CUTTABLE while any guaranteed step is still PENDING"
      - "lowers the deal's encumbered_cents, the project's cumulative_dev_cost_cents and the slate's committed_dev_cents by the released fees"
      - "increments ScriptDeal.version, DevelopmentProject.version and Slate.version by 1 each"

  # --- PilotOrder -----------------------------------------------------------
  - method: POST
    path: "/pilot-orders"
    description: Order a pilot on a script-complete project, with casting and location contingencies pending.
    roles: [DevelopmentExec]
    code: 201
    input: [project_id, budget_cents, shoot_start_date, shoot_end_date, casting_deadline_date, location_deadline_date]
    output: PilotOrder
    side_effects:
      - "creates the order with production_status ORDERED and both casting_status and location_status PENDING"
      - "computes budget_variance_bps against the slate's pattern_budget_per_episode_cents"
      - "moves the project SCRIPT_COMPLETE -> PILOT_ORDERED"
      - "raises the project's cumulative_dev_cost_cents and the slate's committed_dev_cents by budget_cents, lowering available_dev_cents and possibly changing posture"
      - "increments DevelopmentProject.version by 1 and Slate.version by 1"

  - method: GET
    path: "/pilot-orders/{id}"
    description: Read one pilot order with both contingency dimensions and its budget variance.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, ResearchAnalyst, FinanceController]
    code: 200
    input: []
    output: PilotOrder
    side_effects: []

  - method: POST
    path: "/pilot-orders/{id}/contingency-clearances"
    description: >-
      Resolve one of the pilot's two contingency dimensions. kind is CASTING or
      LOCATION; resolution is SATISFIED, WAIVED (BusinessAffairs only) or FAILED.
    roles: [DevelopmentExec, BusinessAffairs]
    code: 200
    input: [kind, resolution, "note?"]
    output: PilotOrder
    side_effects:
      - "sets casting_status or location_status to the resolution"
      - "when both dimensions are SATISFIED or WAIVED, production_status auto-derives ORDERED -> GREEN_TO_SHOOT"
      - "a FAILED resolution collapses the pilot: production_status COLLAPSED, collapsed_reason set, the project returns PILOT_ORDERED -> ACTIVE_DEVELOPMENT, and budget_cents leaves the slate's committed_dev_cents"
      - "increments PilotOrder.version by 1 and, on a collapse, DevelopmentProject.version and Slate.version by 1"

  - method: POST
    path: "/pilot-orders/{id}/wrap"
    description: Wrap a green-lit pilot shoot once its shoot window has elapsed.
    roles: [DevelopmentExec]
    code: 200
    input: []
    output: PilotOrder
    side_effects:
      - "moves production_status GREEN_TO_SHOOT -> WRAPPED"
      - "moves the project PILOT_ORDERED -> PILOT_DELIVERED"
      - "increments PilotOrder.version by 1 and DevelopmentProject.version by 1"

  # --- TestScreening --------------------------------------------------------
  - method: POST
    path: "/pilot-orders/{id}/test-screenings"
    description: >-
      Field a research screening on a wrapped pilot, superseding any earlier
      screening on the same pilot. Requires the caller's observed PilotOrder
      version.
    roles: [ResearchAnalyst]
    code: 201
    input: [expected_pilot_order_version, panel_size, overall_score, intent_to_view_score, appeal_score, comp_norm_index]
    output: TestScreening
    side_effects:
      - "creates the screening with status FIELDED and computes weighted_raw_score and norm_adjusted_score by the weighted_test_score calculation"
      - "every earlier FIELDED or CERTIFIED screening on the same pilot order becomes INVALIDATED"
      - "increments PilotOrder.version by 1"

  - method: GET
    path: "/pilot-orders/{id}/test-screenings"
    description: List every screening fielded on this pilot order, including invalidated ones.
    roles: [PlatformAdmin, ResearchAnalyst, DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TestScreening[]
    side_effects: []

  - method: POST
    path: "/test-screenings/{id}/certify"
    description: Certify a fielded screening as research of record; refused when the panel is under 300.
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: TestScreening
    side_effects:
      - "moves status FIELDED -> CERTIFIED and stamps certified_at from the logical clock"
      - "unblocks POST /negotiations for the screening's project when norm_adjusted_score is at or above 62.0"

  # --- SeriesOrderNegotiation ----------------------------------------------
  - method: POST
    path: "/negotiations"
    description: Open the network's series-order offer on a pilot-delivered project with certified research.
    roles: [BusinessAffairs]
    code: 201
    input: [project_id, episode_count, license_fee_per_episode_cents, backend_points_bps, network_ownership_pct, studio_ownership_pct]
    output: SeriesOrderNegotiation
    side_effects:
      - "creates the negotiation with status NETWORK_OFFER, round_number 1, last_offer_side NETWORK"
      - "computes total_license_commitment_cents as episode_count * license_fee_per_episode_cents"
      - "raises Slate.reserved_episode_count by episode_count, lowering available_episode_count and possibly changing posture"
      - "increments Slate.version by 1"

  - method: POST
    path: "/negotiations/{id}/rounds"
    description: >-
      Table a counter on an open negotiation. StudioPartner counters a network
      offer; BusinessAffairs counters a studio counter.
    roles: [BusinessAffairs, StudioPartner]
    code: 200
    input: [episode_count, license_fee_per_episode_cents, backend_points_bps, network_ownership_pct, studio_ownership_pct]
    output: SeriesOrderNegotiation
    side_effects:
      - "overwrites the term-sheet fields, flips status between NETWORK_OFFER and STUDIO_COUNTER, flips last_offer_side and increments round_number by 1"
      - "reconciles Slate.reserved_episode_count by the episode_count delta and recomputes available_episode_count and posture"
      - "recomputes total_license_commitment_cents"
      - "increments SeriesOrderNegotiation.version by 1 and Slate.version by 1"

  - method: POST
    path: "/negotiations/{id}/accept"
    description: >-
      Accept the standing offer. Only the side that did not table it may accept,
      which converts the episode reservation into a commitment.
    roles: [BusinessAffairs, StudioPartner]
    code: 200
    input: []
    output: SeriesOrderNegotiation
    side_effects:
      - "moves status to AGREED and stamps agreed_at from the logical clock"
      - "moves episode_count out of Slate.reserved_episode_count and into Slate.committed_episode_count, leaving available_episode_count unchanged, and recomputes posture"
      - "increments SeriesOrderNegotiation.version by 1 and Slate.version by 1"

  # --- GreenlightRequest ---------------------------------------------------
  - method: POST
    path: "/greenlight-requests"
    description: >-
      File a series greenlight request against an AGREED term sheet, superseding
      any request still OPEN on the same project. Requires the caller's observed
      DevelopmentProject version.
    roles: [BusinessAffairs]
    code: 201
    input: [project_id, negotiation_id, expected_project_version]
    output: GreenlightRequest
    side_effects:
      - "creates the request with status OPEN, all three committee decisions PENDING, and project_version_at_request stamped from the project"
      - "every other OPEN request on the same project becomes SUPERSEDED"
      - "increments DevelopmentProject.version by 1"

  - method: GET
    path: "/greenlight-requests/{id}"
    description: Read one greenlight request with each committee's decision and decider.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: []
    output: GreenlightRequest
    side_effects: []

  - method: GET
    path: "/greenlight-requests"
    description: List greenlight requests, optionally narrowed by project, negotiation or status.
    roles: [PlatformAdmin, DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: ["project_id?", "negotiation_id?", "status?", "limit?", "offset?"]
    output: GreenlightRequest[]
    side_effects: []

  - method: POST
    path: "/greenlight-requests/{id}/decisions"
    description: >-
      Record one committee's decision. committee is CREATIVE, BUSINESS or
      FINANCE and must match the acting role; the same user may not decide twice
      on one request.
    roles: [DevelopmentExec, BusinessAffairs, FinanceController]
    code: 200
    input: [committee, decision, "note?"]
    output: GreenlightRequest
    side_effects:
      - "sets the committee's decision and decided_by_user_id from X-User-ID"
      - "a FINANCE APPROVED decision first re-evaluates pilot_series_feasibility on the PATTERN basis at the negotiation's episode_count and is refused when the verdict is INFEASIBLE"
      - "when all three committees are APPROVED the request becomes APPROVED and the project cascades PILOT_DELIVERED -> SERIES_ORDERED, completing its EXECUTED script deals, cutting their PENDING steps and releasing that money on the slate"
      - "any REJECTED decision closes the request as REJECTED and leaves the project at PILOT_DELIVERED"
      - "increments GreenlightRequest.version by 1 and, on approval, DevelopmentProject.version and Slate.version by 1"

  # --- test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock, which is the sole source of every
      server-stamped timestamp, every date comparison and every window/expiry
      rule in this domain. Before any call to this endpoint the logical clock
      reads exactly its startup default 2026-08-01T00:00:00Z and never falls
      back to real wall-clock time.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "re-derives HoldingDeal.term_state, RightsCheck.result, Writer.exclusivity_status and DevelopmentProject.turnaround_window_open on the next read"
      - "does not itself transition any entity; it only moves the instant against which windows are evaluated"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: X-User-Role or X-User-ID header missing or empty
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: >-
      the acting role is not permitted on this endpoint, or the greenlight
      committee named does not match the acting role, or a non-BusinessAffairs
      role attempts a WAIVED contingency resolution
  - id: ERR_AGENCY_SCOPE_VIOLATION
    http: 403
    condition: an AgencyRep acts on an agency, writer or pitch that is not their own agency's
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: the same X-User-ID attempts to decide a second committee on one greenlight request

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: >-
      a required field is missing, an enum value is not a declared member, a
      numeric field is out of range, a date is not ISO-8601, or the steps array
      is empty, oversized, or carries an entry without a valid step_type

  # --- existence ------------------------------------------------------------
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: no Agency with the given id
  - id: ERR_SLATE_NOT_FOUND
    http: 404
    condition: no Slate with the given id
  - id: ERR_WRITER_NOT_FOUND
    http: 404
    condition: no Writer with the given id
  - id: ERR_HOLDING_DEAL_NOT_FOUND
    http: 404
    condition: no HoldingDeal with the given id
  - id: ERR_PITCH_NOT_FOUND
    http: 404
    condition: no Pitch with the given id
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: no DevelopmentProject with the given id
  - id: ERR_SCRIPT_DEAL_NOT_FOUND
    http: 404
    condition: no ScriptDeal with the given id
  - id: ERR_DEAL_STEP_NOT_FOUND
    http: 404
    condition: no DealStep with the given id, or the step does not belong to the script deal in the path
  - id: ERR_PILOT_ORDER_NOT_FOUND
    http: 404
    condition: no PilotOrder with the given id
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: no TestScreening with the given id
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: no SeriesOrderNegotiation with the given id
  - id: ERR_GREENLIGHT_NOT_FOUND
    http: 404
    condition: no GreenlightRequest with the given id

  # --- state ----------------------------------------------------------------
  - id: ERR_INVALID_PITCH_STATE
    http: 409
    condition: the pitch's status does not permit this operation (e.g. advancing a SUBMITTED, PASSED or already ADVANCED pitch)
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: the project's dev_status does not permit this operation
  - id: ERR_INVALID_DEAL_STATE
    http: 409
    condition: the script deal is not EXECUTED, so its steps are frozen
  - id: ERR_INVALID_DEAL_STEP_STATE
    http: 409
    condition: >-
      the step is not in the status this operation requires, or an earlier
      step_index on the same deal is not yet ACCEPTED or CUT_OFF
  - id: ERR_INVALID_PILOT_ORDER_STATE
    http: 409
    condition: the pilot order's production_status does not permit this operation
  - id: ERR_CONTINGENCY_ALREADY_RESOLVED
    http: 409
    condition: the casting or location dimension named by kind is no longer PENDING
  - id: ERR_INVALID_SCREENING_STATE
    http: 409
    condition: the screening is not FIELDED (already certified or invalidated by a newer screening)
  - id: ERR_INVALID_NEGOTIATION_STATE
    http: 409
    condition: the negotiation is not open, or a greenlight request names a negotiation that is not AGREED
  - id: ERR_INVALID_GREENLIGHT_STATE
    http: 409
    condition: the greenlight request is not OPEN
  - id: ERR_COMMITTEE_ALREADY_DECIDED
    http: 409
    condition: the named committee has already recorded a decision on this request
  - id: ERR_ACCEPT_BY_OFFERING_SIDE
    http: 409
    condition: the side that tabled the standing offer attempts to accept it
  - id: ERR_SLATE_POSTURE_LOCKED
    http: 409
    condition: the slate's posture is LOCKED, so it takes no new development, pilot or series commitments

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: expected_project_version does not equal the DevelopmentProject's current version
  - id: ERR_STALE_PILOT_ORDER_VERSION
    http: 412
    condition: expected_pilot_order_version does not equal the PilotOrder's current version

  # --- business: rights and talent safety ----------------------------------
  - id: ERR_PACKAGING_NOT_PERMITTED
    http: 422
    condition: a pitch carries packaging_elements but the submitting agency has packaging_allowed false
  - id: ERR_RIGHTS_NOT_CLEAR
    http: 422
    condition: the pitch has no rights check, or its most recent check's result is ENCUMBERED or BLOCKED
  - id: ERR_RIGHTS_HOLDBACK_CONFLICT
    http: 422
    condition: >-
      the logical clock date falls inside the most recent rights check's closed
      holdback interval or its 90-day quiet buffer
  - id: ERR_HOLDING_DEAL_OVERLAP
    http: 422
    condition: the writer already has an ACTIVE holding deal whose half-open term overlaps the submitted term
  - id: ERR_WRITER_EXCLUSIVITY_CONFLICT
    http: 422
    condition: the writer is under a holding deal held by a different slate than the project's
  - id: ERR_WRITER_STEP_LOAD_EXCEEDED
    http: 422
    condition: exercising this step would push the writer's open_step_count above 2
  - id: ERR_GUARANTEED_STEP_NOT_CUTTABLE
    http: 422
    condition: a deal cutoff is attempted while a guaranteed step is still PENDING
  - id: ERR_TEST_SAMPLE_TOO_SMALL
    http: 422
    condition: certification is attempted on a screening whose panel_size is below 300

  # --- business: temporal windows ------------------------------------------
  - id: ERR_OPTION_PERIOD_EXPIRED
    http: 422
    condition: the step's option_expires_at is at or before the logical clock's current instant
  - id: ERR_SHOOT_WINDOW_NOT_ELAPSED
    http: 422
    condition: a wrap is attempted before the pilot's shoot_end_date
  - id: ERR_TURNAROUND_WINDOW_CLOSED
    http: 422
    condition: the turnaround exercise falls more than 180 days after turnaround_offered_at

  # --- business: constraint satisfaction -----------------------------------
  - id: ERR_NOTES_ROUNDS_EXHAUSTED
    http: 422
    condition: a further notes round is issued on a step whose notes_round already equals 2
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: a counter is tabled on a negotiation whose round_number already equals 4
  - id: ERR_TERM_SHEET_INVALID
    http: 422
    condition: >-
      the ownership split does not total 100, backend_points_bps exceeds the
      slate's ceiling, or episode_count is below 1
  - id: ERR_LICENSE_FEE_ABOVE_CAP
    http: 422
    condition: license_fee_per_episode_cents exceeds the slate's license_fee_cap_per_episode_cents
  - id: ERR_PILOT_BUDGET_ABOVE_PATTERN
    http: 422
    condition: the pilot's budget_variance_bps against the slate pattern budget exceeds 1500
  - id: ERR_STAGE_CAPACITY_EXCEEDED
    http: 422
    condition: the slate already has max_concurrent_pilot_shoots pilots in ORDERED or GREEN_TO_SHOOT
  - id: ERR_AGENCY_SUBMISSION_CAP_REACHED
    http: 422
    condition: the agency's submissions_used_count already equals its effective_submission_cap

  # --- business: referential coherence -------------------------------------
  - id: ERR_NEGOTIATION_PROJECT_MISMATCH
    http: 422
    condition: the negotiation named in a greenlight request belongs to a different project
  - id: ERR_NO_CERTIFIED_TEST
    http: 422
    condition: the project has no CERTIFIED test screening on any of its pilot orders
  - id: ERR_TEST_SCORE_BELOW_FLOOR
    http: 422
    condition: the project's most recently certified screening has norm_adjusted_score below 62.0

  # --- business: fiscal ----------------------------------------------------
  - id: ERR_SLATE_DEV_BUDGET_EXCEEDED
    http: 422
    condition: the slate's available_dev_cents does not cover the new holding deal, script deal or pilot commitment
  - id: ERR_EPISODE_CAPACITY_EXCEEDED
    http: 422
    condition: the slate's available_episode_count does not cover the episode_count being reserved
  - id: ERR_FEASIBILITY_FAILED
    http: 422
    condition: a FINANCE APPROVED decision is attempted while the project's PATTERN-basis feasibility verdict is INFEASIBLE

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: Network operations administrator who sets up agencies and slates and drives the logical clock.
    identity: opaque
    exclusive_operations:
      - "POST /agencies"
      - "POST /slates"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /writers"
      - "GET on every entity except the feasibility read"

  - name: AgencyRep
    description: Agent submitting pitches and registering clients on behalf of one agency.
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /pitches"
    shared_operations:
      - "POST /writers"
      - "GET /agencies/{id}, GET /writers, GET /writers/{id}, GET /pitches, GET /pitches/{id} - all scoped to their own agency"

  - name: DevelopmentExec
    description: Creative executive who covers pitches, advances them, reviews scripts, orders pilots and votes the CREATIVE committee.
    identity: opaque
    exclusive_operations:
      - "POST /pitches/{id}/coverage"
      - "POST /pitches/{id}/advance"
      - "POST /script-deals/{id}/steps/{step_id}/review"
      - "POST /pilot-orders"
      - "POST /pilot-orders/{id}/wrap"
      - "POST /development-projects/{id}/abandon"
      - "CREATIVE decisions on POST /greenlight-requests/{id}/decisions"
    shared_operations:
      - "POST /script-deals/{id}/steps/{step_id}/deliver"
      - "POST /pilot-orders/{id}/contingency-clearances (SATISFIED or FAILED only)"
      - "GET /development-projects/{id}/feasibility and the read surface"

  - name: BusinessAffairs
    description: >-
      Deal-making arm - holding deals, rights checks, step deals, term sheets,
      greenlight filing and the BUSINESS committee vote.
    identity: opaque
    exclusive_operations:
      - "POST /holding-deals"
      - "POST /holding-deals/{id}/terminate"
      - "POST /pitches/{id}/rights-checks"
      - "POST /script-deals"
      - "POST /script-deals/{id}/steps/{step_id}/exercise"
      - "POST /script-deals/{id}/cutoff"
      - "POST /negotiations"
      - "POST /greenlight-requests"
      - "POST /development-projects/{id}/turnaround"
      - "POST /development-projects/{id}/turnaround-exercise"
      - "BUSINESS decisions on POST /greenlight-requests/{id}/decisions"
      - "WAIVED resolutions on POST /pilot-orders/{id}/contingency-clearances"
    shared_operations:
      - "POST /script-deals/{id}/steps/{step_id}/deliver"
      - "POST /pilot-orders/{id}/contingency-clearances"
      - "POST /negotiations/{id}/rounds and POST /negotiations/{id}/accept (network side)"
      - "the read surface"

  - name: FinanceController
    description: Finance officer who tests slate economics and votes the FINANCE committee.
    identity: opaque
    exclusive_operations:
      - "FINANCE decisions on POST /greenlight-requests/{id}/decisions"
    shared_operations:
      - "GET /slates/{id}, GET /development-projects/{id}/feasibility, GET /script-deals, GET /pilot-orders/{id}, GET /greenlight-requests"

  - name: ResearchAnalyst
    description: Audience research analyst who fields and certifies pilot testing.
    identity: opaque
    exclusive_operations:
      - "POST /pilot-orders/{id}/test-screenings"
      - "POST /test-screenings/{id}/certify"
    shared_operations:
      - "GET /pilot-orders/{id}, GET /pilot-orders/{id}/test-screenings, GET /development-projects/{id}/pilot-orders"

  - name: StudioPartner
    description: Studio counterparty on the series order, countering and accepting network offers.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /negotiations/{id}/rounds and POST /negotiations/{id}/accept (studio side)"
      - "GET /development-projects/{id}/negotiations"
