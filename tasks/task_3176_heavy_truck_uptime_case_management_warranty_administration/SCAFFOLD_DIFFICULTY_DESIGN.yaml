              payload: { vin: "1FUJGBDV8CLBP0040", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 60000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "CC Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /campaigns"
              payload: { campaign_code: "RCL-2026-002", campaign_kind: "SERVICE_CAMPAIGN", affected_model_codes: ["CASCADIA_126"], fault_code: "SPN3216_FMI4", opens_on: "2026-08-01T00:00:00Z", closes_on: "2027-08-01T00:00:00Z" }
              as: UptimeCoordinator
              captures: { campaign_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
            - call: "GET /campaigns/${campaign_id}/completions"
              payload: { truck_id: "${truck_id}" }
              as: UptimeCoordinator
              captures: { cc_id: "$.data[0].id" }
            - call: "POST /campaigns/${campaign_id}/completions/${cc_id}/schedule"
              payload: { case_id: "${case_id}" }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
