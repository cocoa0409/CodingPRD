            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Shr St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 500000 }, as: MasterServicer, captures: { r_id: $.data.id } }
            - { call: "POST /reserve-accounts/${r_id}/deposits", payload: { amount_cents: 100000 }, as: MasterServicer }
            - { call: "POST /inspectors", payload: { full_name: "Shr Spect", license_no: "LIC-SHR" }, as: MasterServicer, captures: { i_id: $.data.id } }
