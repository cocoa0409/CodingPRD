  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: period_span_overlap_closed_interval
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource AgreementPeriod span, CLOSED-interval semantics: a second period for the
          same aco_tax_id whose start EQUALS the existing period's end (2026-12-31)
          conflicts (adjacency counts as overlap); a span starting the next day succeeds, as
          does an identical span under a different aco_tax_id.
        test_recipe:
          setup:
            - "Existing period P1 for ACO-OV spanning [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-OV", aco_name: "OV", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-OV", aco_name: "OV-adj", performance_start_date: "2026-12-31", performance_end_date: "2027-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { err_adj: $.data.error_id } }
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-OV", aco_name: "OV-ok", performance_start_date: "2027-01-01", performance_end_date: "2027-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p2: $.data.id } }
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-OTHER", aco_name: "OTHER", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "TWO_SIDED" }, as: AcoAdministrator, captures: { p3: $.data.id } }
          assert:
            - "err_adj == 'ERR_PERIOD_OVERLAP'  (closed semantics: shared endpoint 2026-12-31 conflicts)"
            - "P2 created successfully (2027-01-01 is strictly outside [2026-01-01, 2026-12-31])"
            - "P3 created successfully (overlap predicate is scoped per aco_tax_id)"

      - name: alignment_window_overlap_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_ALIGNMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource AlignmentRun window, HALF-OPEN semantics on a different entity than
          AgreementPeriod: a run starting exactly at the prior run's window_end (2026-07-01)
          is ALLOWED (adjacency is not overlap) and supersedes it; a run starting one day
          earlier (2026-06-30) overlaps the now-live run and is rejected.
        test_recipe:
          setup:
            - "Period OPEN; participant PA; beneficiary with one PART_B visit (needed so runs produce records)"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-AW", aco_name: "AW", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-AW-1", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", participant_id: "${pa}", service_date: "2026-03-15", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v0: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2026-07-01", expected_agreement_period_version: "${p1_v0}" }, as: AcoAdministrator, captures: { run1: $.data.id } }
          trigger:
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v1: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-07-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v1}" }, as: AcoAdministrator, captures: { run2: $.data.id } }
            - { call: "GET /aco/alignment-runs/${run1}", as: AcoAdministrator, captures: { run1_status: $.data.status } }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-06-30", window_end_date: "2026-12-01", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator, captures: { err_ov: $.data.error_id } }
          assert:
            - "run2 created successfully  (adjacent half-open windows do NOT overlap: 2026-07-01 == prior window_end is allowed)"
            - "run1_status == 'SUPERSEDED'  (same-methodology supersede side effect)"
            - "err_ov == 'ERR_ALIGNMENT_WINDOW_OVERLAP'  ([2026-06-30, 2026-12-01) intersects live run [2026-07-01, 2027-01-01))"

