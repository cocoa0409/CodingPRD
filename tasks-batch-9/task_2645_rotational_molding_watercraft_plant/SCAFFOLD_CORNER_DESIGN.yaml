      - name: calc_constants_applied_warpage_size_class_and_cooling_mode_factors
        claim_type: Constants Applied
        grounds:
          - calculations.cycle_warpage_index
          - calculations.cycle_warpage_index.constants.SIZE_CLASS_WARPAGE_FACTOR
          - calculations.cycle_warpage_index.constants.COOLING_MODE_WARPAGE_FACTOR
        distinguishing_aspect: "A TANDEM hull cooled on WATER_MIST multiplies its 0.200 base by 1.150 and 1.250 to give 0.2875, which is stored as 0.288; the same cycle as MID / AMBIENT would store 0.200, so both lookup tables are provably read."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVD is size_class TANDEM with min_cooling_minutes 30, wall_cv_max_pct 12.00, wall_thickness_min_mm 4.50 and impact_test_min_joules 90.00."
            - "Cooling bay CB-CVD is airflow_mode WATER_MIST and oven station OV-CVD accepts up to OVERSIZE."
            - "One cycle is OVEN_RUNNING then COOLING at oven_temp_c 308.0 with arm_rpm 8.00 / 2.00 (rotation ratio exactly 4.000) and scheduled_cooling_minutes 30, so the thermal term is the only non-zero term."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvD_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVD", hull_type: "CANOE", size_class: "TANDEM", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 30.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.5000, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
