  - {method: POST, path: "/network/distribution-feeds/{id}/restore", description: "Return a MAINTENANCE feed to ONLINE once maintenance has ended", roles: [NetworkScheduler], code: 200, input: [], output: DistributionFeed, side_effects: ["MAINTENANCE_to_ONLINE transition"]}
