      - name: tractor_shop_window_collides_on_touch_across_a_120_minute_buffer
        grounds:
          - calculations.asset_maintenance_conflict
          - calculations.asset_maintenance_conflict.constants.SHOP_BUFFER_MINUTES
          - validations[priority 14 temporal]
          - errors.ERR_ASSET_MAINTENANCE_CONFLICT
          - endpoints[POST /fleet/maintenance-work-orders]
        distinguishing_aspect: |
          RESOURCE: a Tractor. INTERVAL SEMANTICS: CLOSED on both edges and
          inflated by a 120-minute shop buffer on each side, i.e. the exact
          OPPOSITE adjacency rule from the dock and with no aggregate
          tolerance at all (one tractor, one shop bay). TRIP-S runs
          07:00 -> 14:50, so the tractor is reserved over the closed interval
          [05:00, 16:50]. A shop window whose left edge is exactly 16:50 - the
          instant the buffer expires - COLLIDES, and 16:51 does not; symmetrically
          a window whose right edge is exactly 05:00 collides while 04:59 does
          not. The probe is run from the work-order side, the reverse direction
          of the same geometry.
        test_recipe:
          setup:
            - "Store S-1010 unloads 600 cases/hour around the clock with 2 doors; trailer VAN-921 holds 1800 cases."
            - "TRIP-S is PLANNED for driver D-99 on tractor TR-521 and trailer VAN-921: planned_start_at 2026-08-03T07:00:00Z and a single 900-case DELIVERY scheduled 09:00 -> 14:50, so planned_end_at is 2026-08-03T14:50:00Z, service 105 and duty 225."
