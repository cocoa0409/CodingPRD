            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-2", zone_type: "HOT_AISLE", containment_kind: "CURTAIN", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
