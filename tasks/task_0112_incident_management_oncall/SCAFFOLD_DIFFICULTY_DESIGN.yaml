# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Incident Management & On-Call — Expert
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. 9 rules x >=2 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_deadline_business_hours_vs_calendar
        grounds:
          - calculations.incident_sla_deadlines
          - entities.Service.fields.tier
          - entities.Incident.fields.ack_deadline_at
        distinguishing_aspect: |
          Same severity and trigger instant produce different ack_deadline_at on a
          TIER_1 service (business_hours variant: off-hours minutes skipped) versus a
          TIER_2 service (calendar variant: 24/7 wall-clock); the two variants live on
          the Incident timing domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z (a Monday, before 09:00 UTC business window)."
            - "TIER_1 service S1 and TIER_2 service S2 both exist; one policy each is not needed for this read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S1", tier: "TIER_1", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /services"
              payload: { name: "S2", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /escalation-policies"
              payload: { name: "P1", service_id: "${s1_id}" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /escalation-policies"
              payload: { name: "P2", service_id: "${s2_id}" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /incidents"
              payload: { service_id: "${s2_id}", policy_id: "${p2_id}", title: "calendar", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_cal_id: $.data.id, inc_cal_ack: $.data.ack_deadline_at }
          trigger:
            - call: "POST /incidents"
              payload: { service_id: "${s1_id}", policy_id: "${p1_id}", title: "biz", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_biz_id: $.data.id, inc_biz_ack: $.data.ack_deadline_at }
          assert:
            - "Incident.${inc_cal_id}.ack_deadline_at == '2026-06-01T00:30:00.000Z' (calendar: +30 wall-clock minutes)"
            - "Incident.${inc_biz_id}.ack_deadline_at == '2026-06-01T09:30:00.000Z' (business_hours: 30 business minutes consumed starting at 09:00)"
            - "Incident.${inc_biz_id}.ack_deadline_at != Incident.${inc_cal_id}.ack_deadline_at"

      - name: budget_time_based_vs_event_based
        grounds:
          - calculations.error_budget_consumed
          - calculations.error_budget_event_cost
          - entities.Service.fields.error_budget_consumed_minutes
        distinguishing_aspect: |
          The same single RESOLVED SEV2 incident yields a time_based consumed value
          (downtime-derived minutes) different from the event_based cost (fixed 30
          minutes by severity); the dual-variant logic is on the Service budget
          domain, a different entity from the Incident timing dual-variant above.
        test_recipe:
          setup:
            - "Service S with budget 1000; one SEV2 incident triggered 00:00:00, acknowledged, resolved at 00:02:30 (150s span)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550001" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:02:30Z" }
              as: PlatformAdmin
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
          trigger:
            - call: "GET /services/${s_id}/budget-summary"
              payload: {}
              as: IncidentCommander
              captures: { consumed: $.data.consumed_minutes, event_cost: $.data.event_cost_minutes }
          assert:
            - "budget-summary.consumed_minutes == 3 (ceil(150/60) = 3, time_based)"
            - "budget-summary.event_cost_minutes == 30 (fixed SEV2 event cost)"
            - "budget-summary.consumed_minutes != budget-summary.event_cost_minutes"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: effective_sla_nonlinear_min_max_branch_on_posture
        grounds:
          - calculations.effective_sla_minutes
          - calculations.incident_sla_deadlines
          - entities.Service.fields.budget_status
        distinguishing_aspect: |
          Mode (a): effective ack minutes is a >=3-input formula (severity base,
          budget_status branch, pressure factor) with nested max(floor, min(base,
          tightened)); on an EXHAUSTED service a SEV2 base of 30 tightens to 15 and
          the ack deadline lands 15 minutes out, not 30.
        test_recipe:
          setup:
            - "Service S budget 2 minutes; a prior SEV2 incident resolved with 2 downtime minutes drives budget_status to EXHAUSTED; then a new SEV2 incident is triggered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550002" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "first", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc1_id: $.data.id }
            - call: "POST /incidents/${inc1_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:01:30Z" }
              as: PlatformAdmin
            - call: "POST /incidents/${inc1_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "second", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc2_id: $.data.id, inc2_ack: $.data.ack_deadline_at }
          assert:
            - "Service.${s_id}.budget_status == 'EXHAUSTED' (consumed 2 >= budget 2)"
            - "Incident.${inc2_id}.ack_deadline_at == '2026-06-01T00:16:30.000Z' (effective 15 min from trigger 00:01:30, not 30)"

      - name: budget_consumed_round_per_incident_then_sum
        grounds:
          - calculations.error_budget_consumed
          - entities.Incident.fields.downtime_minutes
          - entities.Service.fields.error_budget_consumed_minutes
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two incidents of 90s each
          give round-per-incident-then-sum = ceil(90/60)+ceil(90/60) = 2+2 = 4, whereas
          sum-then-round would be ceil(180/60) = 3; the scaffold pins round-then-sum so
          consumed == 4.
        test_recipe:
          setup:
            - "Service S budget 1000; two SEV4 incidents each open 90 seconds then resolved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550003" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "a", severity: "SEV4" }
              as: IncidentCommander
              captures: { inc_a_id: $.data.id }
            - call: "POST /incidents/${inc_a_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:01:30Z" }
              as: PlatformAdmin
            - call: "POST /incidents/${inc_a_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "b", severity: "SEV4" }
              as: IncidentCommander
              captures: { inc_b_id: $.data.id }
            - call: "POST /incidents/${inc_b_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:03:00Z" }
              as: PlatformAdmin
            - call: "POST /incidents/${inc_b_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
          trigger:
            - call: "GET /services/${s_id}"
              payload: {}
              as: IncidentCommander
              captures: { consumed: $.data.error_budget_consumed_minutes }
          assert:
            - "Incident.${inc_a_id}.downtime_minutes == 2"
            - "Incident.${inc_b_id}.downtime_minutes == 2"
            - "Service.${s_id}.error_budget_consumed_minutes == 4 (round-per-incident-then-sum, not 3)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: incident_parallel_dimensions_ack_does_not_block_escalation_history
        grounds:
          - state_machines.Incident.TRIGGERED_to_ACKNOWLEDGED
          - entities.Incident.fields.lifecycle_status
          - entities.Incident.fields.escalation_status
        distinguishing_aspect: |
          Incident carries two independent dimensions: acknowledging moves
          lifecycle_status TRIGGERED->ACKNOWLEDGED while escalation_status moves
          ESCALATING->EXHAUSTED on the same row — parallel state axes on one entity.
        test_recipe:
          setup:
            - "Incident triggered with tier-1 page fired; escalation_status ESCALATING; then acknowledged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550004" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
              captures: { life: $.data.lifecycle_status, esc: $.data.escalation_status }
          assert:
            - "Incident.${inc_id}.lifecycle_status == 'ACKNOWLEDGED'"
            - "Incident.${inc_id}.escalation_status == 'EXHAUSTED' (ack halted the ladder on a different dimension)"

      - name: postmortem_cyclic_revert_in_review_to_draft
        grounds:
          - state_machines.Postmortem.IN_REVIEW_to_DRAFT
          - state_machines.Postmortem.DRAFT_to_IN_REVIEW
          - entities.Postmortem.fields.status
        distinguishing_aspect: |
          Postmortem is a cyclic machine on a different entity: DRAFT->IN_REVIEW->DRAFT
          via submit then return, demonstrating a revision loop (A->B->A), not a linear
          pipeline.
        test_recipe:
          setup:
            - "A RESOLVED incident with a DRAFT postmortem, submitted to IN_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550005" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /postmortems"
              payload: { incident_id: "${inc_id}", summary: "rca" }
              as: IncidentCommander
              captures: { pm_id: $.data.id }
            - call: "POST /postmortems/${pm_id}/submit"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /postmortems/${pm_id}/return"
              payload: {}
              as: IncidentCommander
              captures: { st: $.data.status }
          assert:
            - "Postmortem.${pm_id}.status == 'DRAFT' (returned from IN_REVIEW — loop back)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: resolve_recompute_consumed_then_remaining_then_budget_status
        grounds:
          - state_machines.Incident.ACKNOWLEDGED_to_RESOLVED
          - calculations.error_budget_consumed
          - calculations.service_budget_status
          - entities.Service.fields.budget_status
        distinguishing_aspect: |
          Depth-3 chain from POST /incidents/{id}/resolve: (1) Incident->RESOLVED stamps
          downtime, which causes (2) Service.error_budget_consumed_minutes recompute,
          which causes (3) Service.budget_status to flip HEALTHY->EXHAUSTED once consumed
          reaches the budget; each hop is caused by the previous, not by the resolve.
        test_recipe:
          setup:
            - "Service S budget 2 minutes; one SEV4 incident acknowledged, open 90s (2 downtime minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550006" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV4" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:01:30Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
          assert:
            - "Incident.${inc_id}.downtime_minutes == 2"
            - "Service.${s_id}.error_budget_consumed_minutes == 2"
            - "Service.${s_id}.error_budget_remaining_minutes == 0"
            - "Service.${s_id}.budget_status == 'EXHAUSTED'"

      - name: window_activation_suppresses_triggered_incident_depth2
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_ACTIVE
          - state_machines.Incident.TRIGGERED_to_SUPPRESSED
          - entities.Incident.fields.lifecycle_status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger, POST /maintenance-windows/{id}/activate:
          (1) window->ACTIVE causes (2) every TRIGGERED incident on the service->SUPPRESSED
          with counts_against_budget=false; the second hop is caused by the activation, not
          requested directly.
        test_recipe:
          setup:
            - "Service S; one TRIGGERED SEV2 incident; a SCHEDULED maintenance window covering the current clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550007" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /maintenance-windows"
