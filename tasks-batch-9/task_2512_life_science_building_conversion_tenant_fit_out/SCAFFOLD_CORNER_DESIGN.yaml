          - endpoints["POST /suitability-assessments/{assessmentId}/submit"]
        distinguishing_aspect: "POST /suitability-assessments/{assessmentId}/submit moves the assessment DRAFT -> SUBMITTED and freezes score 78.0 / verdict SUITABLE onto the row, while the Building stays in ASSESSING until a decision is recorded."
        test_recipe:
          setup: ["Building with floor 2; one SCREENING assessment in DRAFT"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
              as: LandlordAssetManager
