            - call: "POST /direct-selling/qualification-periods/${p8_id}/lock"
              payload: {}
              as: CommissionAnalyst
            - call: "POST /direct-selling/qualification-periods/${p8_id}/close"
              payload: {}
              as: CommissionAnalyst
            - call: "GET /direct-selling/qualification-periods/${p8_id}"
              as: CommissionAnalyst
              captures: { p8_v: "$.data.version" }
            - call: "POST /direct-selling/commission-runs"
              payload: { qualification_period_id: "${p8_id}", expected_qualification_period_version: "${p8_v}" }
              as: CommissionAnalyst
              as_user_id: "ANALYST-1"
              captures: { run1_id: "$.data.id" }
          trigger:
            - call: "POST /direct-selling/commission-runs/${run1_id}/calculate"
              payload: {}
              as: CommissionAnalyst
              as_user_id: "ANALYST-1"
              captures: { dyn_gross: "$.data.gross_total_cents", dyn_forfeited: "$.data.forfeited_to_company_cents", dyn_pool: "$.data.distributable_pool_cents", dyn_mode: "$.data.compression_mode_snapshot" }
            - call: "GET /direct-selling/commission-statements"
              payload: { commission_run_id: "${run1_id}", consultant_id: "${cons_a_id}", status: "ACTIVE" }
              as: CommissionAnalyst
              captures: { dyn_override_a: "$.data[0].override_total_cents", dyn_pv_a: "$.data[0].pv_bonus_cents" }
            - call: "POST /direct-selling/commission-runs/${run1_id}/approval-decision"
              payload: { decision: "REJECT", decision_note: "recalculate under STATIC compression" }
              as: FinanceController
              as_user_id: "FC-1"
            - call: "PATCH /direct-selling/compensation-plans/${plan_id}"
              payload: { compression_mode: "STATIC" }
              as: PlatformAdmin
            - call: "POST /direct-selling/commission-runs/${run1_id}/calculate"
              payload: {}
              as: CommissionAnalyst
              as_user_id: "ANALYST-1"
              captures: { sta_gross: "$.data.gross_total_cents", sta_forfeited: "$.data.forfeited_to_company_cents", sta_pool: "$.data.distributable_pool_cents", sta_mode: "$.data.compression_mode_snapshot", sta_seq: "$.data.calculation_sequence" }
            - call: "GET /direct-selling/commission-statements"
              payload: { commission_run_id: "${run1_id}", consultant_id: "${cons_a_id}", status: "ACTIVE" }
              as: CommissionAnalyst
              captures: { sta_override_a: "$.data[0].override_total_cents" }
          assert:
            - "dyn_mode == DYNAMIC and sta_mode == STATIC (compression_mode_snapshot is taken from the plan at each calculate, not read live at payment time)"
            - "dyn_override_a == 19200 (C's 2400 points paid at compressed level 1, 800 bp) and dyn_pv_a == 4600"
            - "dyn_forfeited == 0, dyn_gross == 47500, dyn_pool == 47500"
            - "sta_override_a == 9600 (C's 2400 points paid at literal level 2, 400 bp)"
            - "sta_forfeited == 800 (B's 100 points x 100 x 800 bp forfeited at level 1), sta_gross == 37900, sta_pool == 38700"
            - "dyn_override_a - sta_override_a == 9600 and sta_pool - sta_gross == 800"
            - "sta_seq == 2 (calculation_sequence incremented by each calculate)"
            - "CommissionStatement of ${cons_b_id} has override_total_cents == 0 under both variants (paid_as CONSULTANT has override_levels 0)"

      - name: income_disclosure_all_enrolled_vs_paid_only_divergence
