              payload: { hangar_code: "HOC", aircraft_id: "${aoc}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { soc: $.data.id, socv: $.data.version }
          trigger:
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${aoc}", hangar_slot_id: "${soc}", opened_by_mechanic_id: "${moc}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${socv}" }
              as: ShopManager
              captures: { wooc: $.data.id }
            - call: "GET /api/hangar-slots/${soc}"
              payload: {}
              as: ShopManager
          assert:
            - "WO creation succeeded (201)"
            - "HangarSlot.version == ${socv} + 1 (increments by 1 on WO create)"
      - name: cascading_side_effect_release_on_rts
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WorkOrder.READY_FOR_RTS_to_RETURNED_TO_SERVICE
          - state_machines.HangarSlot.OCCUPIED_to_RELEASED
        distinguishing_aspect: "RTS transition cascades HangarSlot OCCUPIED -> RELEASED and auto-creates DRAFT Invoice in a single call."
        excluded_because:
          difficulty_instance: hangar_slot_release_restores_capacity
          rationale: "Cascade products asserted in compensating_invariant difficulty instance."
      - name: derived_field_reconciliation_open_discrepancy_count
        claim_type: derived_field_reconciliation
        grounds:
          - entities.WorkOrder.fields.open_discrepancy_count
        distinguishing_aspect: "open_discrepancy_count stays in sync after decide, rectify, verify."
        excluded_because:
          difficulty_instance: part_install_rectify_verify_chain
          rationale: "Count reconciliation asserted as hop-3 product of cascade difficulty instance."
      - name: dual_variant_calculation_invoice_creation_mode_selection
        claim_type: dual_variant_calculation
        grounds:
          - calculations.labor_charge
        distinguishing_aspect: "Invoice uses pricing_mode from parent WO to pick variant at creation."
        excluded_because:
          difficulty_instance: labor_charge_hourly_vs_flat_rate_divergence
          rationale: "Variant selection covered by difficulty instance."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_posted_labor_entry
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After POST labor-entry returns 201, GET reflects the entry in the same request-response cycle (no eventual lag)."
        test_recipe:
          setup: ["WO in IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "oic@x.com", phone: "1", approval_cap_cents: 1 }
              as: ShopManager
              captures: { oic: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${oic}", tail_number: "N-IC", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { aic: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-IC", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { mic: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HIC", aircraft_id: "${aic}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { sic: $.data.id, sicv: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${aic}", hangar_slot_id: "${sic}", opened_by_mechanic_id: "${mic}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${sicv}" }
              as: ShopManager
              captures: { woic: $.data.id }
            - call: "POST /api/work-orders/${woic}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${woic}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${mic}"
          trigger:
            - call: "POST /api/work-orders/${woic}/labor-entries"
              payload: { mechanic_id: "${mic}", duration_tenths: 3, notes: "n" }
              as: Mechanic
              as_user_id: "${mic}"
            - call: "GET /api/work-orders/${woic}"
              payload: {}
              as: Mechanic
              as_user_id: "${mic}"
          assert:
            - "WorkOrder.labor_hours_tenths == 3 immediately after POST (immediate consistency)"
