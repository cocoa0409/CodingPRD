            - "after publish: ${pub_pub} == PUBLISHED and ${pub_at} == 2026-08-01T00:00:00Z"
            - "${pub_cur} == CURATED - publishing did not disturb the curation dimension"
            - "${dom_pub_count} == 1 and ${dom_posture} == OPEN"

      - name: publish_guarded_by_domain_posture_corner
        claim_type: guarded transitions
        grounds:
          - state_machines.MasterRecord.UNPUBLISHED_to_PUBLISHED.preconditions
          - errors.ERR_DOMAIN_POSTURE_BLOCKED
        excluded_because:
          difficulty_instance: publish_blocked_until_domain_posture_returns_to_open
          rationale: "The cross-entity guard 'MasterRecord may publish only while its Domain sits at posture OPEN' is exercised in depth by that §1.8 cross_entity_state_dependency instance, which drives the posture to RESTRICTED, gets ERR_DOMAIN_POSTURE_BLOCKED, then waives the finding and shows the same publish succeeding once the guard clears."

      - name: merge_proposal_rework_loop_corner
        claim_type: cyclic
        grounds:
          - state_machines.MergeProposal.REWORK_to_PROPOSED
          - entities.MergeProposal.fields.rework_count
        excluded_because:
          difficulty_instance: merge_proposal_rework_cycle_upgrades_confidence_on_rescore
          rationale: "The UNDER_REVIEW -> REWORK -> PROPOSED -> UNDER_REVIEW loop, its rework_count increment and the re-derivation of match_score / match_confidence on the second pass are the whole subject of that §1.8 non_linear_state_machine instance."

      - name: change_request_decide_fork_corner
        claim_type: branching
        grounds:
          - state_machines.ChangeRequest.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ChangeRequest.CHANGES_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: change_request_changes_requested_branch_resets_impact_then_recycles
          rationale: "The REQUEST_CHANGES fork out of UNDER_REVIEW - reviewer cleared, impact fields reset to 0/0/null, then recomputed against a changed consumer set on re-submit - is covered in depth by that §1.8 instance."

      - name: source_decertification_cascade_corner
        claim_type: Cascade down
        grounds:
          - state_machines.SourceSystem.CERTIFIED_to_DECERTIFIED.side_effects
        excluded_because:
          difficulty_instance: source_decertification_five_hop_cascade_to_consumer_lineage
          rationale: "The five-hop parent-to-descendant cascade (source -> registration -> domain posture -> master records -> consumer lineage), including which children are and are not touched, is exactly that §1.8 transitive_cascade instance."

      - name: classification_uplift_cross_entity_adjustment_corner
        claim_type: Conditional cascade
        grounds:
          - state_machines.ChangeRequest.SCHEDULED_to_APPLIED.side_effects
          - state_machines.ConsumerSubscription.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: classification_uplift_apply_three_hop_impact_reassessment
          rationale: "Hop 2 of apply suspends only those ACTIVE subscriptions whose clearance_level rank falls below the new classification_level - a conditional cascade whose selective firing (one suspended, one retained) is the core of that §1.8 instance."

      - name: domain_posture_derived_from_open_finding_set_corner
        claim_type: Bubble up
        grounds:
          - state_machines.Domain.RESTRICTED_to_OPEN
          - calculations.domain_posture_recompute
        excluded_because:
          difficulty_instance: plan_then_resolve_restores_finding_load_and_posture
          rationale: "Domain.governance_posture is derived from its finding children, so the parent transition back to OPEN when the last open finding closes is a bubble-up; that §1.8 compensating_invariant instance drives exactly that round trip and reconciles open_finding_weight and Steward.open_finding_load with it."

      - name: schedule_then_withdraw_compensation_corner
        claim_type: Compensation
        grounds:
          - state_machines.ChangeRequest.SCHEDULED_to_WITHDRAWN.side_effects
        excluded_because:
          difficulty_instance: withdraw_after_schedule_restores_counters_and_notifications
          rationale: "Undoing the schedule transition - freeze window nulled, scheduled_change_count decremented, the whole notification fan-out cleared, reference_data_revision deliberately left alone - is that §1.8 compensating_invariant instance end to end."

  # =========================================================================
  - section: calculations
    instances:
      - name: completeness_pct_rounds_half_up_to_two_decimals
        claim_type: Precision
        grounds:
          - calculations.record_completeness_pct
          - calculations.record_completeness_pct.constants.ROUNDING
        distinguishing_aspect: "The completeness quotient is rarely exact: 2 of 3 expected attributes is 66.666... and must be stored as 66.67 (round_half_up at 2dp), while 1 of 3 is 33.333... and must be stored as 33.33 - truncation would produce 66.66."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain PRODUCT with expected_attribute_count 3, an ACTIVE DATA_STEWARD assignment for Sam, and a CERTIFIED source ERP."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "PRODUCT", name: "Product Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 3 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-PROD-1", attributes: { sku: "SKU-1", description: "Widget" }, last_verified_at: "2026-08-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { two_of_three: $.data.completeness_pct }
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-PROD-2", attributes: { sku: "SKU-2", description: null }, last_verified_at: "2026-08-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { one_of_three: $.data.completeness_pct }
          assert:
            - "${two_of_three} == 66.67 (100 * 2 / 3 = 66.666..., round_half_up at 2dp; not 66.66 and not 66.7)"
            - "${one_of_three} == 33.33 (the null-valued description key does not count as present)"

      - name: retired_rule_leaves_the_certified_denominator
