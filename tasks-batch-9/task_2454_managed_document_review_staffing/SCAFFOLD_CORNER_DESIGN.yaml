      - name: batch_sizing_errors_are_distinguishable
        claim_type: triggerability
        grounds:
          - validations[priority=37]
          - validations[priority=38]
          - errors[ERR_ZERO_DOCUMENT_BATCH]
          - errors[ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS]
        distinguishing_aspect: "A zero-document carve is a shape error (ERR_ZERO_DOCUMENT_BATCH, not ERR_INVALID_REQUEST, because 0 is non-negative) while an over-large carve is a pool error (ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS); after a legal 600-document carve, even a 1-document carve hits the pool error."
        test_recipe:
          setup:
            - "the core matter (600 documents, none batched) with an APPROVED protocol"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
          trigger:
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 0, priority_rank: 5 }
              as: EngagementManager
              captures: { err_zero: $.data.error_id }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 601, priority_rank: 5 }
              as: EngagementManager
              captures: { err_over: $.data.error_id }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 600, priority_rank: 5 }
              as: EngagementManager
              captures: { b_all_id: $.data.id }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 1, priority_rank: 5 }
              as: EngagementManager
              captures: { err_empty_pool: $.data.error_id }
          assert:
            - "first call: HTTP 422 with error_id \"ERR_ZERO_DOCUMENT_BATCH\""
            - "second call: HTTP 422 with error_id \"ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS\" (601 > 600)"
            - "third call: HTTP 201 with document_count 600, batch_number 1 and qc_sample_target_size 60"
            - "fourth call: HTTP 422 with error_id \"ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS\" — the pool is now empty"
            - "GET /batches?matter_id=${m_id} returns exactly 1 row and Matter.${m_id}.unbatched_document_count == 0"

