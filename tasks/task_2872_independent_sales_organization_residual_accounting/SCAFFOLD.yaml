# =============================================================================
# PRD Benchmark Scaffold — Independent Sales Organization Residual Accounting
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2872. Independent Sales Organization Residual Accounting (merchant services independent sales organization): agent hierarchy with split percentages and override tiers across multiple levels, processor residual file ingestion with interchange, assessments and buy-rate normalization, per-merchant profitability calculation including chargebacks, attrition and equipment costs, agent advance and portfolio buyout amortization against residual streams, minimum monthly and per-transaction fee reconciliation, agent statement generation with dispute and adjustment handling, portfolio ownership, vesting and transfer on agent departure, clawback of upfront bonuses for early attrition

domain_name: iso-residual-accounting
api_prefix: "/"

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Every collection is a top-level peer resource joined by explicit foreign
  # keys (`/agents`, `/merchants`, `/residual-batches`, `/agent-statements`,
  # `/statement-adjustments`, `/residual-allocations`). No business entity is
  # nested inside another entity's URL path; the only nested paths are
  # reverse-reachability reads and action sub-paths on a single resource.

  state_machine_shape: parallel
  # AgentStatement carries two INDEPENDENT state dimensions on one row —
  # `lifecycle_state` (DRAFT -> ISSUED -> FINALIZED, with ISSUED -> DRAFT recall)
  # and `settlement_state` (UNSETTLED -> HELD -> UNSETTLED -> SETTLED). Two more
  # machines are cyclic: ResidualBatch (NORMALIZED -> RECEIVED recall loop) and
  # StatementAdjustment (UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW loop).

  relationship_patterns:
    - one_to_many          # Agent -> Merchant, ResidualBatch -> ResidualLine
    - self_referential     # Agent.parent_agent_id -> Agent.id (override tiers)
    - cross_aggregate      # ResidualAllocation joins Agent, Merchant, AgentStatement
    - polymorphic          # StatementAdjustment.source_merchant_id set only for merchant-originated kinds

  role_model: segregation_of_duties
  # The user who proposes a StatementAdjustment may never be the user who
  # approves it (`X-User-ID` compared), even when both act as ResidualController.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 11 entities, 61 endpoints, 53 error codes, 11 calculation rules
  # (3 of them dual-variant), 6 state machines (one carrying two parallel
  # dimensions), 54 ordered validation rules across 13 priority bands,
  # 3 OCC-guarded write endpoints.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: ProcessorProgram
    parent: null
    common_fields: true
    description: "Configuration entity: the processor-side economics (buy rate, assessments, normalization mode) that every merchant boarded under it inherits."
    fields:
      - name: name
        type: string
        source: input
        description: "Human label of the processor program, e.g. 'FirstAtlantic Core'."
        constraints: "1..120 chars"
      - name: buy_rate_bps
        type: integer
        source: input
        description: "Processor buy rate in basis points applied to sales volume."
        constraints: "0..500"
      - name: buy_rate_per_item_cents
        type: integer
        source: input
        description: "Processor per-authorization buy rate in whole cents."
        constraints: ">= 0"
      - name: assessment_bps
        type: integer
        source: input
        description: "Card-brand assessment rate in basis points, recorded for audit; the ingested per-line assessments_cents is the authoritative deduction."
        constraints: "0..100"
      - name: normalization_mode
        type: enum
        source: input
        description: "Selects which buy-rate normalization variant applies to every ResidualLine of this program."
        constraints: "one of {NET_REVENUE_SPLIT, GROSS_SPLIT}"
      - name: minimum_billing_mode
        type: enum
        source: input
        default: SHORTFALL_BILLED
        description: "Feature flag: SHORTFALL_BILLED bills monthly-minimum shortfalls; NO_MINIMUM forces every shortfall to 0."
        constraints: "one of {SHORTFALL_BILLED, NO_MINIMUM}"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE programs accept batch posting; SUSPENDED programs reject it."
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: posted_batch_count
        type: integer
        source: computed
        default: 0
        description: "Count of ResidualBatch rows for this program whose state == POSTED."

  - name: Agent
    parent: null
    common_fields: true
    description: "Resource entity: a sales agent node in the self-referential ISO hierarchy. Holds its own merchant split and the override percentage it earns on downline production."
    fields:
      - name: name
        type: string
        source: input
        description: "Agent display name."
        constraints: "1..120 chars"
      - name: parent_agent_id
        type: string
        source: input
        description: "FK -> Agent.id; null for a top-level principal. Defines the override chain walked upward at allocation time."
        default: null
        constraints: "must reference an Agent whose status == ACTIVE at write time"
      - name: split_pct
        type: number
        source: input
        description: "Share of a directly owned merchant's agent_basis_cents paid to this agent, as a decimal fraction with 4 decimal places."
        constraints: "0.0000 <= split_pct <= 1.0000"
      - name: override_pct
        type: number
        source: input
        description: "Cumulative-to-this-tier share used for differential override math on downline merchants, as a decimal fraction with 4 decimal places."
        constraints: "0.0000 <= override_pct <= 1.0000; parent.override_pct >= max(child.split_pct, child.override_pct)"
      - name: vesting_start_date
        type: string
        source: input
        description: "Date-only (YYYY-MM-DD) anchor for the portfolio vesting schedule."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE -> DEPARTURE_NOTICE -> DEPARTED lifecycle; DEPARTURE_NOTICE may be rescinded back to ACTIVE."
        constraints: "one of {ACTIVE, DEPARTURE_NOTICE, DEPARTED}"
      - name: departure_effective_date
        type: string
        source: system
        default: null
        description: "Date-only effective date captured when a departure notice is filed; cleared on rescind."
      - name: hierarchy_depth
        type: integer
        source: computed
        default: 0
        description: "0 for a top-level principal; parent.hierarchy_depth + 1 otherwise. Recomputed for the agent and every descendant when the hierarchy changes."
      - name: vested_pct
        type: integer
        source: computed
        default: 0
        description: "Whole-percent portfolio vesting evaluated against the logical clock per calculations.agent_vesting_pct."
      - name: vested_pct_at_departure
        type: integer
        source: system
        default: null
        description: "vested_pct frozen at the instant the agent transitioned to DEPARTED; the value used to scale every later allocation to this agent."
      - name: residual_hold
        type: boolean
        source: computed
        default: false
        description: "True once portfolio_attrition_bps >= ATTRITION_HOLD_THRESHOLD_BPS; blocks releasing a statement hold."
      - name: portfolio_attrition_bps
        type: integer
        source: computed
        default: 0
        description: "Attrition rate of the agent's own portfolio in basis points per calculations.agent_portfolio_attrition_bps."
      - name: lifetime_clawback_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of |amount_cents| over APPLIED StatementAdjustment rows of kind BONUS_CLAWBACK minus those of kind CLAWBACK_REVERSAL, across all statements of this agent."
      - name: trailing_residual_cents
        type: integer
        source: computed
        default: 0
        description: "Production KPI: sum of gross_after_trueup_cents over this agent's up-to-3 most recent AgentStatement rows ordered by period_month DESC, counting ALL lifecycle_state values {DRAFT, ISSUED, FINALIZED}. Distinct from the narrower {ISSUED, FINALIZED} window used by calculations.departure_vested_buyout."
      - name: advance_outstanding_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of outstanding_cents over this agent's AgentAdvance rows with state == ACTIVE."
      - name: portfolio_merchant_count
        type: integer
        source: computed
        default: 0
        description: "Count of Merchant rows with owning_agent_id == this agent and status IN {PENDING, ACTIVE, ATTRITED}."

  - name: Merchant
    parent: null
    common_fields: true
    description: "Resource entity: a boarded merchant. Owned by exactly one agent at a time and priced by exactly one processor program."
    fields:
      - name: owning_agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the agent receiving the DIRECT_SPLIT allocation for this merchant. Mutated by reassignment and by portfolio transfer."
      - name: processor_program_id
        type: string
        source: input
        description: "FK -> ProcessorProgram.id; fixes the buy rate and normalization variant used for this merchant's residual lines."
      - name: mid
        type: string
        source: input
        description: "Processor merchant identifier; unique across all Merchant rows."
        constraints: "unique; 4..32 chars"
      - name: monthly_minimum_cents
        type: integer
        source: input
        description: "Contractual monthly minimum the ISO bills this merchant."
        constraints: ">= 0"
      - name: per_transaction_fee_cents
        type: integer
        source: input
        description: "ISO per-transaction fee used for monthly-minimum reconciliation."
        constraints: ">= 0"
      - name: equipment_lease_monthly_cents
        type: integer
        source: input
        description: "Monthly equipment lease cost charged against this merchant's profitability."
        constraints: ">= 0"
      - name: upfront_bonus_cents
        type: integer
        source: input
        default: 0
        description: "Boarding bonus already paid to the owning agent; subject to clawback on early attrition."
        constraints: ">= 0"
      - name: boarded_on
        type: string
        source: input
        description: "Date-only (YYYY-MM-DD) boarding date; the clawback window origin."
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "PENDING -> ACTIVE -> ATTRITED, with ATTRITED -> ACTIVE reactivation."
        constraints: "one of {PENDING, ACTIVE, ATTRITED}"
      - name: attrition_date
        type: string
        source: system
        default: null
        description: "Date-only attrition date; drives equipment proration and the bonus clawback amount. Cleared on reactivation."
      - name: reactivation_date
        type: string
        source: system
        default: null
        description: "Date-only date of the most recent reactivation; null if never reactivated."
      - name: clawed_back_bonus_cents
        type: integer
        source: computed
        default: 0
        description: "Net bonus clawed back for this merchant: sum of |amount_cents| over APPLIED BONUS_CLAWBACK adjustments with source_merchant_id == this merchant, minus the same over CLAWBACK_REVERSAL adjustments."

  - name: ResidualBatch
    parent: null
    common_fields: true
    description: "Resource entity: one processor residual file for one program and one accounting month. Lines are ingested while RECEIVED, priced on normalize, and distributed on post."
    fields:
      - name: processor_program_id
        type: string
        source: input
        description: "FK -> ProcessorProgram.id; supplies the buy rate and normalization mode for every line in this batch."
      - name: period_month
        type: string
        source: input
        description: "Accounting month in YYYY-MM form; the period every derived MerchantProfitability, ResidualAllocation and AgentStatement row is keyed on."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: coverage_start
        type: string
        source: input
        description: "Date-only INCLUSIVE first day of the file's coverage window."
      - name: coverage_end
        type: string
        source: input
        description: "Date-only EXCLUSIVE end of the file's coverage window; must be strictly after coverage_start."
      - name: file_checksum
        type: string
        source: input
        description: "Processor file checksum; unique across ResidualBatch rows whose state != REVERSED."
        constraints: "unique among non-REVERSED batches; 8..80 chars"
      - name: state
        type: enum
        source: system
        default: RECEIVED
        description: "RECEIVED -> NORMALIZED -> POSTED -> REVERSED, plus the NORMALIZED -> RECEIVED recall loop."
        constraints: "one of {RECEIVED, NORMALIZED, POSTED, REVERSED}"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Count of ResidualLine rows attached to this batch."
      - name: gross_volume_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of sales_volume_cents over this batch's lines."
      - name: total_normalized_net_revenue_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of the per-line, already-rounded normalized_net_revenue_cents values (round-then-sum order is pinned by calculations.normalize_residual_line)."
      - name: iso_retained_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of iso_retained_cents over the MerchantProfitability rows this batch produced; 0 until the batch is POSTED."
      - name: posted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the POST transition; cleared on reversal."
      - name: recall_count
        type: integer
        source: system
        default: 0
        description: "Number of NORMALIZED -> RECEIVED recalls performed on this batch."

  - name: ResidualLine
    parent: ResidualBatch
    common_fields: true
    description: "Ingested residual file row for one merchant inside one batch. Input amounts come from the processor file; the two cost fields are written by normalization."
    fields:
      - name: residual_batch_id
        type: string
        source: input
        description: "FK -> ResidualBatch.id; the batch this line was ingested into."
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; at most one line per merchant per batch."
      - name: transaction_count
        type: integer
        source: input
        description: "Authorization count reported by the processor for the period."
        constraints: ">= 0"
      - name: sales_volume_cents
        type: integer
        source: input
        description: "Settled sales volume in cents."
        constraints: ">= 0"
      - name: interchange_cents
        type: integer
        source: input
        description: "Interchange reported by the processor in cents."
        constraints: ">= 0"
      - name: assessments_cents
        type: integer
        source: input
        description: "Card-brand assessments reported by the processor in cents."
        constraints: ">= 0"
      - name: gross_income_cents
        type: integer
        source: input
        description: "Total fees billed to the merchant as reported by the processor, in cents."
        constraints: ">= 0"
      - name: processor_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Buy-rate cost for this line, rounded to the cent before any summation."
      - name: normalized_net_revenue_cents
        type: integer
        source: computed
        default: 0
        description: "Net revenue for this line under the program's normalization variant; may be negative."
      - name: normalization_mode_applied
        type: enum
        source: computed
        default: null
        description: "The ProcessorProgram.normalization_mode value in force when this line was normalized."
        constraints: "one of {NET_REVENUE_SPLIT, GROSS_SPLIT, null}"

  - name: ChargebackEvent
    parent: null
    common_fields: false
    description: "Append-only event: a chargeback charged against a merchant's residual period. Never mutated; only id and created_at are server-managed."
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant the chargeback belongs to."
      - name: amount_cents
        type: integer
        source: input
        description: "Chargeback amount in cents."
        constraints: "> 0"
      - name: occurred_on
        type: string
        source: input
        description: "Date-only date the chargeback was received."
      - name: period_month
        type: string
        source: input
        description: "Residual period (YYYY-MM) this chargeback is charged against."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: liability
        type: enum
        source: input
        description: "AGENT_CHARGED reduces the agent split basis; ISO_ABSORBED reduces ISO profit only."
        constraints: "one of {AGENT_CHARGED, ISO_ABSORBED}"

  - name: MerchantProfitability
    parent: null
    common_fields: true
    description: "Derived per-merchant, per-batch profitability record created by posting a batch. Carries both the ISO profit view and the narrower agent split basis."
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant this record scores."
      - name: residual_batch_id
        type: string
        source: input
        description: "FK -> ResidualBatch.id; the batch whose posting produced this record."
      - name: period_month
        type: string
        source: system
        description: "Copied from the producing batch's period_month."
      - name: normalized_net_revenue_cents
        type: integer
        source: computed
        description: "Copied from the producing ResidualLine.normalized_net_revenue_cents."
      - name: chargeback_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ChargebackEvent.amount_cents for this merchant with period_month == this record's period_month, over BOTH liability values."
      - name: agent_chargeable_chargeback_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ChargebackEvent.amount_cents for this merchant with period_month == this record's period_month and liability == AGENT_CHARGED."
      - name: equipment_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Equipment lease charged for the period, prorated when the merchant attrited inside the period."
      - name: profit_cents
        type: integer
        source: computed
        description: "ISO profit view: net revenue less ALL chargebacks less equipment cost."
      - name: agent_basis_cents
        type: integer
        source: computed
        description: "Split basis: net revenue less AGENT_CHARGED chargebacks less equipment cost. May be negative."
      - name: allocated_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of gross_allocation_cents over the ResidualAllocation rows produced from this record."
      - name: iso_retained_cents
        type: integer
        source: computed
        default: 0
        description: "agent_basis_cents - allocated_total_cents; absorbs the un-allocated tiers, every vesting withholding and every rounding remainder."

  - name: ResidualAllocation
    parent: null
    common_fields: true
    description: "One agent's claim on one merchant's basis for one period. Created by batch posting, attached to the agent's DRAFT statement, and deleted by batch reversal."
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the agent credited by this allocation."
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant whose basis is being split."
      - name: statement_id
        type: string
        source: input
        description: "FK -> AgentStatement.id; the DRAFT statement this allocation was attached to."
      - name: period_month
        type: string
        source: system
        description: "Copied from the producing batch's period_month."
      - name: allocation_type
        type: enum
        source: computed
        description: "DIRECT_SPLIT for the owning agent; OVERRIDE for an ancestor tier."
        constraints: "one of {DIRECT_SPLIT, OVERRIDE}"
      - name: tier_level
        type: integer
        source: computed
        description: "0 for DIRECT_SPLIT; 1..MAX_OVERRIDE_LEVELS for OVERRIDE, counted upward from the owning agent."
      - name: applied_pct
        type: number
        source: computed
        description: "The percentage actually applied: split_pct for DIRECT_SPLIT, the differential override for OVERRIDE, before any vesting scaling."
      - name: basis_cents
        type: integer
        source: computed
        description: "The MerchantProfitability.agent_basis_cents this allocation was computed from."
      - name: gross_allocation_cents
        type: integer
        source: computed
        description: "Cents credited to the agent after vesting scaling and rounding."
      - name: vesting_withheld_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(basis_cents * applied_pct) - gross_allocation_cents when the agent is DEPARTED; 0 otherwise."

  - name: AgentStatement
    parent: null
    common_fields: true
    description: "One agent's monthly residual statement. Two independent state dimensions: lifecycle_state (authoring) and settlement_state (payment)."
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the statement owner."
      - name: period_month
        type: string
        source: input
        description: "Accounting month (YYYY-MM); unique per agent."
        constraints: "unique with agent_id; matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: lifecycle_state
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT -> ISSUED -> FINALIZED with an ISSUED -> DRAFT recall edge; evolves independently of settlement_state."
        constraints: "one of {DRAFT, ISSUED, FINALIZED}"
      - name: settlement_state
        type: enum
        source: system
        default: UNSETTLED
        description: "UNSETTLED -> HELD -> UNSETTLED -> SETTLED; evolves independently of lifecycle_state."
        constraints: "one of {UNSETTLED, HELD, SETTLED}"
      - name: direct_residual_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of gross_allocation_cents over attached allocations with allocation_type == DIRECT_SPLIT."
      - name: override_residual_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of gross_allocation_cents over attached allocations with allocation_type == OVERRIDE."
      - name: minimum_true_up_cents
        type: integer
        source: computed
        default: 0
        description: "Monthly-minimum reconciliation credit computed at issue time; 0 while DRAFT."
      - name: gross_after_trueup_cents
        type: integer
        source: computed
        default: 0
        description: "direct_residual_cents + override_residual_cents + minimum_true_up_cents."
      - name: advance_recoupment_cents
        type: integer
        source: computed
        default: 0
        description: "Total recouped against ACTIVE advances at issue time; 0 while DRAFT."
      - name: adjustment_cents
        type: integer
        source: computed
        default: 0
        description: "Signed sum of amount_cents over this statement's StatementAdjustment rows with state == APPLIED."
      - name: opening_deficit_cents
        type: integer
        source: computed
        default: 0
        description: "carry_forward_deficit_cents of this agent's statement for the immediately preceding period_month whose lifecycle_state IN {ISSUED, FINALIZED}; 0 when absent."
      - name: net_payable_cents
        type: integer
        source: computed
        default: 0
        description: "Floored-at-zero amount payable to the agent per calculations.statement_net_payable."
      - name: carry_forward_deficit_cents
        type: integer
        source: computed
        default: 0
        description: "Absolute value of the pre-floor negative balance; 0 when the pre-floor balance is >= 0."
      - name: issued_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the DRAFT -> ISSUED transition; cleared on recall."
      - name: paid_on
        type: string
        source: system
        default: null
        description: "Date-only settlement date supplied at settle time."
      - name: hold_reason
        type: string
        source: system
        default: null
        description: "Free-text reason captured when settlement_state became HELD; cleared on release."

  - name: StatementAdjustment
    parent: null
    common_fields: true
    description: "A signed correction against one statement. Client-proposed kinds walk the review cycle; system-generated kinds are created already APPLIED."
    fields:
      - name: statement_id
        type: string
        source: input
        description: "FK -> AgentStatement.id; the statement this adjustment corrects."
      - name: source_merchant_id
        type: string
        source: input
        default: null
        description: "FK -> Merchant.id; set only for merchant-originated kinds (BONUS_CLAWBACK, CLAWBACK_REVERSAL, DISPUTE_CREDIT), null otherwise."
      - name: kind
        type: enum
        source: input
        description: "DISPUTE_CREDIT and MANUAL_DEBIT are client-proposable; BONUS_CLAWBACK, CLAWBACK_REVERSAL and VESTED_BUYOUT are system-generated only."
        constraints: "one of {DISPUTE_CREDIT, MANUAL_DEBIT, BONUS_CLAWBACK, CLAWBACK_REVERSAL, VESTED_BUYOUT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed cents: positive for DISPUTE_CREDIT, CLAWBACK_REVERSAL and VESTED_BUYOUT; negative for MANUAL_DEBIT and BONUS_CLAWBACK."
        constraints: "!= 0"
      - name: reason
        type: string
        source: input
        description: "Free-text justification; required on every proposal."
        constraints: "1..300 chars"
      - name: state
        type: enum
        source: system
        default: PROPOSED
        description: "PROPOSED -> UNDER_REVIEW -> {INFO_REQUESTED -> UNDER_REVIEW} -> APPLIED | REJECTED. System-generated kinds are created directly in APPLIED."
        constraints: "one of {PROPOSED, UNDER_REVIEW, INFO_REQUESTED, APPLIED, REJECTED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the proposer, or the literal 'system' for system-generated kinds."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the approver; must differ from created_by_user_id."
      - name: info_request_note
        type: string
        source: system
        default: null
        description: "Question recorded on the UNDER_REVIEW -> INFO_REQUESTED transition."

  - name: AgentAdvance
    parent: null
    common_fields: true
    description: "Cash advance or portfolio buyout funded to an agent and recouped against the agent's residual stream under one of two recoupment variants."
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the agent whose residual stream repays this advance."
      - name: advance_type
        type: enum
        source: input
        description: "CASH_ADVANCE is working capital; PORTFOLIO_BUYOUT purchases a residual stream."
        constraints: "one of {CASH_ADVANCE, PORTFOLIO_BUYOUT}"
      - name: recoupment_mode
        type: enum
        source: input
        description: "PERCENT_OF_RESIDUAL takes a tier-capped percentage of the statement; STRAIGHT_LINE_AMORTIZATION takes a fixed monthly amortization."
        constraints: "one of {PERCENT_OF_RESIDUAL, STRAIGHT_LINE_AMORTIZATION}"
      - name: principal_cents
        type: integer
        source: input
        description: "Funded principal in cents."
        constraints: "> 0"
      - name: recoupment_pct
        type: number
        source: input
        default: null
        description: "Requested share of gross_after_trueup_cents; required when recoupment_mode == PERCENT_OF_RESIDUAL, must be null otherwise."
        constraints: "0.0000 < recoupment_pct <= 1.0000"
      - name: amortization_months
        type: integer
        source: input
        description: "Length of the recoupment window in whole months; also the divisor for STRAIGHT_LINE_AMORTIZATION."
        constraints: "1..60"
      - name: first_recoupment_month
        type: string
        source: input
        description: "First period (YYYY-MM) this advance may be recouped from."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: last_recoupment_month
        type: string
        source: input
        description: "The INCLUSIVE close (YYYY-MM) of the recoupment window. Supplied by the caller and shape-checked by §1.4: for STRAIGHT_LINE_AMORTIZATION the inclusive month count of [first_recoupment_month, last_recoupment_month] must equal amortization_months exactly, while a PERCENT_OF_RESIDUAL window may be any length."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$; >= first_recoupment_month"
      - name: funded_on
        type: string
        source: input
        description: "Date-only funding date; the primary sort key of the recoupment waterfall."
      - name: outstanding_cents
        type: integer
        source: computed
        description: "principal_cents - cumulative_recouped_cents."
      - name: cumulative_recouped_cents
        type: integer
        source: computed
        default: 0
        description: "Total recouped across all statements so far; restored downward when a statement is recalled."
      - name: months_recouped
        type: integer
        source: computed
        default: 0
        description: "Count of distinct period_month values this advance has been recouped from; the amortization index."
      - name: state
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE while outstanding_cents > 0; auto-transitions to RECOUPED when outstanding_cents reaches 0 and back to ACTIVE if a recall restores a balance."
        constraints: "one of {ACTIVE, RECOUPED}"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: ResidualBatch
    shape: "cyclic — NORMALIZED -> RECEIVED recall loop before the one-way POST/REVERSE edges"
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: NORMALIZED
        trigger: "POST /residual-batches/{id}/normalize"
        actor: ResidualAnalyst
        preconditions:
          - "batch.state == RECEIVED"
          - "ProcessorProgram.status == ACTIVE for batch.processor_program_id (else ERR_PROGRAM_SUSPENDED)"
        side_effects:
          - "For every ResidualLine of the batch, ordered by ResidualLine.created_at ASC, run calculations.normalize_residual_line and write processor_cost_cents, normalized_net_revenue_cents and normalization_mode_applied."
          - "Write batch.line_count, batch.gross_volume_cents and batch.total_normalized_net_revenue_cents per calculations.batch_totals (per-line values are rounded first, then summed)."
          - "increments ResidualBatch.version by 1"
        note: "A batch with zero lines normalizes successfully; line_count, gross_volume_cents and total_normalized_net_revenue_cents all stay 0."

      - from: NORMALIZED
        to: RECEIVED
        trigger: "POST /residual-batches/{id}/recall"
        actor: ResidualAnalyst
        preconditions:
          - "batch.state == NORMALIZED"
        side_effects:
          - "Reset processor_cost_cents = 0, normalized_net_revenue_cents = 0 and normalization_mode_applied = null on every ResidualLine of the batch."
          - "Reset batch.total_normalized_net_revenue_cents = 0; line_count and gross_volume_cents keep their ingested values."
          - "increments batch.recall_count by 1"
          - "increments ResidualBatch.version by 1"
        note: "The recall loop exists so a corrected processor file can be re-ingested; lines may be added again once the batch is RECEIVED."

      - from: NORMALIZED
        to: POSTED
        trigger: "POST /residual-batches/{id}/post"
        actor: ResidualController
        preconditions:
          - "batch.state == NORMALIZED"
          - "ProcessorProgram.status == ACTIVE for batch.processor_program_id (else ERR_PROGRAM_SUSPENDED)"
          - "No AgentStatement whose period_month == batch.period_month has lifecycle_state IN {ISSUED, FINALIZED} (else ERR_PERIOD_LOCKED)"
        side_effects:
          - "CASCADE LINK 1 — for every ResidualLine, ordered by ResidualLine.created_at ASC, create one MerchantProfitability row per calculations.merchant_profitability."
          - "CASCADE LINK 2 — each newly created MerchantProfitability row itself triggers calculations.residual_split_allocation, which upserts the DRAFT AgentStatement (agent_id, batch.period_month) of the owning agent and of each paying ancestor tier (creating a DRAFT/UNSETTLED statement when absent) and creates one ResidualAllocation per paying tier; the record's allocated_total_cents and iso_retained_cents are written from those allocations."
          - "CASCADE LINK 3 — each ResidualAllocation attachment itself triggers a recompute of its AgentStatement.direct_residual_cents, override_residual_cents, gross_after_trueup_cents, net_payable_cents and carry_forward_deficit_cents per calculations.statement_net_payable (DRAFT variant)."
          - "CASCADE LINK 4 — each AgentStatement recompute itself triggers a recompute of Agent.trailing_residual_cents for that statement's agent."
          - "Write batch.iso_retained_cents = sum of iso_retained_cents over the MerchantProfitability rows produced, batch.posted_at = current logical clock, and increment ProcessorProgram.posted_batch_count by 1."
          - "increments ResidualBatch.version by 1"

      - from: POSTED
        to: REVERSED
        trigger: "POST /residual-batches/{id}/reverse"
        actor: ResidualController
        preconditions:
          - "batch.state == POSTED"
          - "No AgentStatement whose period_month == batch.period_month has lifecycle_state IN {ISSUED, FINALIZED} (else ERR_PERIOD_LOCKED); every statement the reversal touches is therefore DRAFT and is recomputed with the DRAFT variant"
        side_effects:
          - "COMPENSATION — delete every ResidualAllocation produced by this batch, then delete every MerchantProfitability row produced by this batch."
          - "Recompute each affected AgentStatement (direct_residual_cents, override_residual_cents, gross_after_trueup_cents, net_payable_cents, carry_forward_deficit_cents) and then each affected Agent.trailing_residual_cents, in that order."
          - "Reset batch.iso_retained_cents = 0 and batch.posted_at = null; decrement ProcessorProgram.posted_batch_count by 1."
          - "Statements auto-created by the posting are kept as empty DRAFT statements."
          - "increments ResidualBatch.version by 1"
        note: "Invariant compensating_invariant/residual_distribution_conserved: after reverse, every affected statement's gross_after_trueup_cents equals its pre-post value."

  - entity: AgentStatement
    shape: "parallel — lifecycle_state and settlement_state are independent dimensions on the same row"
    initial_state: "lifecycle_state = DRAFT, settlement_state = UNSETTLED"
    terminal_states: ["lifecycle_state = FINALIZED", "settlement_state = SETTLED"]
    transitions:
      - from: "lifecycle_state = DRAFT"
        to: "lifecycle_state = ISSUED"
        trigger: "POST /agent-statements/{id}/issue"
        actor: ResidualController
        preconditions:
          - "statement.lifecycle_state == DRAFT"
          - "Every ResidualBatch whose period_month == statement.period_month has state IN {POSTED, REVERSED} (else ERR_BATCHES_NOT_POSTED)"
        side_effects:
          - "Run calculations.minimum_fee_reconciliation and write minimum_true_up_cents; recompute gross_after_trueup_cents."
          - "Run calculations.advance_recoupment_schedule and write advance_recoupment_cents; for each advance touched increment cumulative_recouped_cents and months_recouped, decrement outstanding_cents, and auto-transition ACTIVE -> RECOUPED when outstanding_cents reaches 0."
          - "Recompute Agent.advance_outstanding_cents for the statement's agent."
          - "Write opening_deficit_cents, net_payable_cents and carry_forward_deficit_cents per calculations.statement_net_payable (ISSUED variant); write issued_at = current logical clock."
          - "Recompute Agent.trailing_residual_cents."
          - "increments AgentStatement.version by 1"
        note: "settlement_state is untouched: a HELD statement can still be issued."

      - from: "lifecycle_state = ISSUED"
        to: "lifecycle_state = DRAFT"
        trigger: "POST /agent-statements/{id}/recall"
        actor: ResidualController
        preconditions:
          - "statement.lifecycle_state == ISSUED"
          - "statement.settlement_state != SETTLED (else ERR_SETTLEMENT_STATE_INVALID)"
        side_effects:
          - "COMPENSATION — for every AgentAdvance recouped by this statement, decrement cumulative_recouped_cents by exactly this statement's recouped amount, decrement months_recouped by 1, restore outstanding_cents, and auto-transition RECOUPED -> ACTIVE when outstanding_cents becomes > 0."
          - "Reset minimum_true_up_cents = 0, advance_recoupment_cents = 0, issued_at = null; recompute gross_after_trueup_cents, opening_deficit_cents, net_payable_cents and carry_forward_deficit_cents per the DRAFT variant."
          - "Recompute Agent.advance_outstanding_cents and Agent.trailing_residual_cents."
          - "increments AgentStatement.version by 1"
        note: "Invariant compensating_invariant/advance_principal_conserved: principal_cents == outstanding_cents + cumulative_recouped_cents holds before issue, after issue and after recall."

      - from: "lifecycle_state = ISSUED"
        to: "lifecycle_state = FINALIZED"
        trigger: "POST /agent-statements/{id}/finalize"
        actor: ResidualController
        preconditions:
          - "statement.lifecycle_state == ISSUED"
        side_effects:
          - "Freeze the statement: no allocation may be attached and no adjustment may be applied afterwards."
          - "increments AgentStatement.version by 1"
        note: "Allowed while settlement_state == HELD — the two dimensions do not gate each other."

      - from: "settlement_state = UNSETTLED"
        to: "settlement_state = HELD"
        trigger: "POST /agent-statements/{id}/hold, or the system cascade from Agent.residual_hold becoming true"
        actor: ResidualController | system
        preconditions:
          - "statement.settlement_state == UNSETTLED"
          - "statement.lifecycle_state IN {DRAFT, ISSUED}"
        side_effects:
          - "Write hold_reason."
          - "increments AgentStatement.version by 1"

      - from: "settlement_state = HELD"
        to: "settlement_state = UNSETTLED"
        trigger: "POST /agent-statements/{id}/release-hold"
        actor: ResidualController
        preconditions:
          - "statement.settlement_state == HELD"
          - "Agent.residual_hold == false for statement.agent_id (else ERR_RESIDUAL_HOLD_ACTIVE)"
        side_effects:
          - "Clear hold_reason."
          - "increments AgentStatement.version by 1"

      - from: "settlement_state = UNSETTLED"
        to: "settlement_state = SETTLED"
        trigger: "POST /agent-statements/{id}/settle"
        actor: ResidualController
        preconditions:
          - "statement.settlement_state == UNSETTLED"
          - "statement.lifecycle_state IN {ISSUED, FINALIZED} (else ERR_STATEMENT_STATE_INVALID)"
          - "Agent.residual_hold == false for statement.agent_id (else ERR_RESIDUAL_HOLD_ACTIVE)"
          - "statement.net_payable_cents >= MIN_PAYOUT_CENTS (else ERR_BELOW_MIN_PAYOUT)"
        side_effects:
          - "Write paid_on."
          - "increments AgentStatement.version by 1"

  - entity: StatementAdjustment
    shape: "cyclic — UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat any number of times"
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /statement-adjustments/{id}/review"
        actor: ResidualController
        preconditions:
          - "adjustment.state == PROPOSED"
          - "The parent AgentStatement has lifecycle_state IN {DRAFT, ISSUED} (else ERR_STATEMENT_STATE_INVALID)"
        side_effects:
          - "increments StatementAdjustment.version by 1"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /statement-adjustments/{id}/request-info"
        actor: ResidualController
        preconditions:
          - "adjustment.state == UNDER_REVIEW"
        side_effects:
          - "Write info_request_note."
          - "increments StatementAdjustment.version by 1"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /statement-adjustments/{id}/resubmit"
        actor: IsoAdmin | ResidualAnalyst | ResidualController | Agent
        preconditions:
          - "adjustment.state == INFO_REQUESTED"
        side_effects:
          - "Clear info_request_note."
          - "increments StatementAdjustment.version by 1"
        note: "This edge closes the review cycle; it may be traversed repeatedly."

      - from: UNDER_REVIEW
        to: APPLIED
        trigger: "POST /statement-adjustments/{id}/approve"
        actor: ResidualController
        preconditions:
          - "adjustment.state == UNDER_REVIEW"
          - "X-User-ID != adjustment.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "The parent AgentStatement has lifecycle_state IN {DRAFT, ISSUED} (else ERR_STATEMENT_STATE_INVALID)"
        side_effects:
          - "Write approved_by_user_id = X-User-ID."
          - "Recompute the parent AgentStatement.adjustment_cents, net_payable_cents and carry_forward_deficit_cents per calculations.statement_net_payable."
          - "Recompute Agent.lifetime_clawback_cents and, when source_merchant_id is set, Merchant.clawed_back_bonus_cents."
          - "increments StatementAdjustment.version by 1 and AgentStatement.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /statement-adjustments/{id}/reject"
        actor: ResidualController
        preconditions:
          - "adjustment.state == UNDER_REVIEW"
        side_effects:
          - "Write approved_by_user_id = X-User-ID and reason-of-record; the statement's adjustment_cents is unchanged because REJECTED rows are excluded from the APPLIED filter."
          - "increments StatementAdjustment.version by 1"

  - entity: Merchant
    shape: "branching with revert — PENDING -> ACTIVE -> ATTRITED with an ATTRITED -> ACTIVE reactivation edge that compensates the clawback"
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /merchants/{id}/activate"
        actor: IsoAdmin
        preconditions:
          - "merchant.status == PENDING"
          - "Agent.status == ACTIVE for merchant.owning_agent_id (else ERR_AGENT_STATE_INVALID)"
        side_effects:
          - "Recompute Agent.portfolio_attrition_bps and Agent.residual_hold for the owning agent."
          - "increments Merchant.version by 1"

      - from: ACTIVE
        to: ATTRITED
        trigger: "POST /merchants/{id}/attrite"
        actor: IsoAdmin
        preconditions:
          - "merchant.status == ACTIVE"
          - "attrition_date >= merchant.boarded_on AND attrition_date <= the logical clock's current date (else ERR_MERCHANT_DATE_OUT_OF_RANGE)"
        side_effects:
          - "Write attrition_date and clear reactivation_date."
          - "CASCADE LINK 1 (clawback branch) — run calculations.bonus_clawback; when the amount is > 0, upsert the owning agent's AgentStatement for the calendar month of attrition_date (creating it DRAFT/UNSETTLED when absent) and create a StatementAdjustment{kind: BONUS_CLAWBACK, amount_cents: -clawback, state: APPLIED, created_by_user_id: 'system', source_merchant_id: this merchant}."
          - "CASCADE LINK 2 — that APPLIED adjustment itself triggers a recompute of the statement's adjustment_cents, net_payable_cents and carry_forward_deficit_cents."
          - "CASCADE LINK 3 — that statement recompute itself triggers a recompute of Agent.lifetime_clawback_cents, Agent.trailing_residual_cents and Merchant.clawed_back_bonus_cents."
          - "ATTRITION BRANCH — recompute Agent.portfolio_attrition_bps per calculations.agent_portfolio_attrition_bps; when it reaches ATTRITION_HOLD_THRESHOLD_BPS the agent's residual_hold flips to true, and every AgentStatement of that agent with lifecycle_state IN {DRAFT, ISSUED} and settlement_state == UNSETTLED transitions to HELD with hold_reason 'PORTFOLIO_ATTRITION_THRESHOLD'."
          - "increments Merchant.version by 1"

      - from: ATTRITED
        to: ACTIVE
        trigger: "POST /merchants/{id}/reactivate"
        actor: IsoAdmin
        preconditions:
          - "merchant.status == ATTRITED"
          - "Agent.status == ACTIVE for merchant.owning_agent_id (else ERR_AGENT_STATE_INVALID)"
          - "reactivation_date >= merchant.attrition_date AND reactivation_date <= the logical clock's current date (else ERR_MERCHANT_DATE_OUT_OF_RANGE)"
        side_effects:
          - "COMPENSATION — when clawed_back_bonus_cents > 0, create a StatementAdjustment{kind: CLAWBACK_REVERSAL, amount_cents: +clawed_back_bonus_cents, state: APPLIED, created_by_user_id: 'system', source_merchant_id: this merchant} on the owning agent's statement for the calendar month of reactivation_date (upserting it DRAFT/UNSETTLED when absent), then recompute that statement and Agent.lifetime_clawback_cents and Merchant.clawed_back_bonus_cents."
          - "Write reactivation_date and clear attrition_date."
          - "Recompute Agent.portfolio_attrition_bps; when it falls below ATTRITION_HOLD_THRESHOLD_BPS, Agent.residual_hold flips to false (existing HELD statements stay HELD until release-hold is called)."
          - "increments Merchant.version by 1"
        note: "Invariant compensating_invariant/bonus_retention_conserved: after attrite+reactivate, Merchant.clawed_back_bonus_cents == 0 and Agent.lifetime_clawback_cents equals its pre-attrition value."

  - entity: Agent
    shape: "branching with revert — ACTIVE -> DEPARTURE_NOTICE -> DEPARTED, with DEPARTURE_NOTICE -> ACTIVE rescission"
    initial_state: ACTIVE
    terminal_states: [DEPARTED]
    transitions:
      - from: ACTIVE
        to: DEPARTURE_NOTICE
        trigger: "POST /agents/{id}/notice"
        actor: IsoAdmin
        preconditions:
          - "agent.status == ACTIVE"
          - "departure_effective_date >= the logical clock's current date (else ERR_DEPARTURE_DATE_OUT_OF_RANGE)"
        side_effects:
          - "Write departure_effective_date."
          - "increments Agent.version by 1"

      - from: DEPARTURE_NOTICE
        to: ACTIVE
        trigger: "POST /agents/{id}/rescind-notice"
        actor: IsoAdmin
        preconditions:
          - "agent.status == DEPARTURE_NOTICE"
        side_effects:
          - "Clear departure_effective_date."
          - "increments Agent.version by 1"

      - from: DEPARTURE_NOTICE
        to: DEPARTED
        trigger: "POST /agents/{id}/depart"
        actor: IsoAdmin
        preconditions:
          - "agent.status == DEPARTURE_NOTICE"
          - "The logical clock's current date >= agent.departure_effective_date (else ERR_DEPARTURE_DATE_OUT_OF_RANGE)"
        side_effects:
          - "Run calculations.agent_vesting_pct against the logical clock and freeze the result into vested_pct_at_departure (vested_pct keeps returning the same frozen value afterwards)."
          - "Run calculations.departure_vested_buyout; when the amount is > 0, upsert the agent's AgentStatement for the calendar month of departure_effective_date (creating it DRAFT/UNSETTLED when absent) and create a StatementAdjustment{kind: VESTED_BUYOUT, amount_cents: +buyout, state: APPLIED, created_by_user_id: 'system', source_merchant_id: null}, then recompute that statement and Agent.trailing_residual_cents."
          - "Every later ResidualAllocation credited to this agent is scaled by vested_pct_at_departure per calculations.residual_split_allocation; the withheld remainder falls to MerchantProfitability.iso_retained_cents."
          - "increments Agent.version by 1"

      - from: DEPARTED
        to: DEPARTED
        trigger: "POST /agents/{id}/transfer-portfolio"
        actor: IsoAdmin
        preconditions:
          - "agent.status == DEPARTED"
          - "target_agent.status == ACTIVE AND target_agent.id != agent.id (else ERR_TRANSFER_TARGET_INVALID)"
        side_effects:
          - "CONDITIONAL CASCADE — every Merchant with owning_agent_id == agent and status IN {PENDING, ACTIVE} is re-pointed to target_agent_id; merchants with status == ATTRITED keep the departing agent for audit."
          - "Recompute portfolio_merchant_count, portfolio_attrition_bps and residual_hold on BOTH agents, in the order (departing agent, receiving agent)."
          - "increments Agent.version by 1 on both agents and Merchant.version by 1 on every transferred merchant"
        note: "A self-loop on DEPARTED: portfolio transfer changes ownership without changing the agent's state."

  - entity: AgentAdvance
    shape: "linear with an auto-transition and its compensating reverse edge"
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RECOUPED
        trigger: "system — outstanding_cents reaches 0 during POST /agent-statements/{id}/issue"
        actor: system
        preconditions:
          - "advance.state == ACTIVE"
          - "advance.outstanding_cents - this statement's recoupment == 0"
        side_effects:
          - "Recompute Agent.advance_outstanding_cents."
      - from: RECOUPED
        to: ACTIVE
        trigger: "system — POST /agent-statements/{id}/recall restores a positive outstanding balance"
        actor: system
        preconditions:
          - "advance.state == RECOUPED"
          - "the recalled statement had recouped a positive amount against this advance"
        side_effects:
          - "Recompute Agent.advance_outstanding_cents."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: advance-create-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /agents/{id}/advances"
    occ_field: "expected_agent_version"
    description: |
      Funding an advance against an Agent whose version has advanced since the
      client last read it is rejected. Advances legitimately stack on one agent,
      so a second funding request is not blocked by any state precondition; the
      recoupment-capacity check (ERR_RECOUPMENT_PCT_EXCEEDS_CAP) is evaluated
      against the agent's advance set as the writer last observed it, so a stale
      version means the capacity decision was made on out-of-date data.
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412

  - rule_id: merchant-reassign-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /merchants/{id}/reassign-agent"
    occ_field: "expected_merchant_version"
    description: |
      Re-pointing a Merchant to a new owning agent when the merchant's version
      has advanced since the client last read it is rejected. A reassignment
      legitimately supersedes the previous ownership, so a second sequential
      reassignment to a different agent would otherwise succeed and silently
      overwrite the ownership the previous writer established.
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412

  - rule_id: adjustment-create-stale-statement
    parent_entity: AgentStatement
    write_endpoint: "POST /agent-statements/{id}/adjustments"
    occ_field: "expected_statement_version"
    description: |
      Proposing a StatementAdjustment against an AgentStatement whose version
      has advanced since the client last read it is rejected. Multiple
      adjustments legitimately coexist on one statement, so no state
      precondition blocks the second proposal; the guard exists because the
      proposed amount_cents is derived from the net_payable_cents the proposer
      observed, and a posted batch or an applied adjustment has since moved it.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
# Global money convention: every monetary field is an INTEGER count of cents.
# `round_half_up(x)` rounds a rational to the nearest whole cent, halves away
# from zero. Percentages are decimal fractions with 4 decimal places.
# -----------------------------------------------------------------------------
calculations:

  - name: normalize_residual_line
    trigger: "POST /residual-batches/{id}/normalize — once per ResidualLine of the batch, in ResidualLine.created_at ASC order"
    algorithm: aggregation
    formula: |
      program = ProcessorProgram of the line's batch
      # STEP 1 — buy-rate cost, rounded to the cent for THIS LINE before any summation:
      processor_cost_cents = round_half_up(line.sales_volume_cents * program.buy_rate_bps / 10000)
                             + program.buy_rate_per_item_cents * line.transaction_count
      # STEP 2 — variant-dependent net revenue:
      if program.normalization_mode == NET_REVENUE_SPLIT:
          normalized_net_revenue_cents = line.gross_income_cents
                                         - line.interchange_cents
                                         - line.assessments_cents
                                         - processor_cost_cents
      else:   # GROSS_SPLIT
          normalized_net_revenue_cents = line.gross_income_cents
                                         - line.interchange_cents
                                         - line.assessments_cents
      normalization_mode_applied = program.normalization_mode
    input_set: "Every ResidualLine whose residual_batch_id == the batch being normalized, regardless of the referenced Merchant's status. Lines of other batches are never touched."
    constants: {}
    precision: "Whole cents, round_half_up. ROUNDING ORDER IS PINNED: the buy-rate product is rounded per line BEFORE the per-item term is added and before any batch-level summation. Summing sales volumes first and applying buy_rate_bps once to the total is WRONG."
    variants:
      - name: net_revenue_split
        when: "program.normalization_mode == NET_REVENUE_SPLIT"
        difference: "The processor buy rate is deducted from the line, so the agent split basis is net of processor cost and the ISO carries no buy-rate exposure."
      - name: gross_split
        when: "program.normalization_mode == GROSS_SPLIT"
        difference: "The processor buy rate is NOT deducted from the line; the ISO absorbs it at the house level, so normalized_net_revenue_cents is exactly processor_cost_cents higher for identical file data."

  - name: batch_totals
    trigger: "POST /residual-batches/{id}/normalize — after every line of the batch has been normalized"
    algorithm: aggregation
    formula: |
      line_count = count(ResidualLine where residual_batch_id == batch.id)
      gross_volume_cents = sum(line.sales_volume_cents over those lines)
      total_normalized_net_revenue_cents = sum(line.normalized_net_revenue_cents over those lines)
    input_set: "All ResidualLine rows of the batch; empty batch yields 0 / 0 / 0."
    constants: {}
    precision: "Integer cents. The summed values are the ALREADY-ROUNDED per-line results (round-then-sum, never sum-then-round)."

  - name: merchant_profitability
    trigger: "POST /residual-batches/{id}/post — cascade link 1, once per ResidualLine"
    algorithm: threshold
    formula: |
      period_start = first calendar day of batch.period_month
      period_next  = first calendar day of the month after batch.period_month
      days_in_period = (period_next - period_start) in days
      # STEP 1 — chargeback aggregation, two different filters over the same event set:
      chargeback_cost_cents = sum(ChargebackEvent.amount_cents
                                  where merchant_id == line.merchant_id
                                    and period_month == batch.period_month)          # both liability values
      agent_chargeable_chargeback_cents = sum(ChargebackEvent.amount_cents
                                  where merchant_id == line.merchant_id
                                    and period_month == batch.period_month
                                    and liability == AGENT_CHARGED)
      # STEP 2 — equipment cost with in-period attrition proration:
      if merchant.status == ATTRITED and merchant.attrition_date >= period_start and merchant.attrition_date < period_next:
          active_days = (merchant.attrition_date - period_start) in days + 1
          equipment_cost_cents = round_half_up(merchant.equipment_lease_monthly_cents
                                               * min(active_days, days_in_period) / days_in_period)
      elif merchant.status == ATTRITED and merchant.attrition_date < period_start:
          equipment_cost_cents = 0
      else:
          equipment_cost_cents = merchant.equipment_lease_monthly_cents
      # STEP 3 — the two divergent bottom lines:
      profit_cents      = line.normalized_net_revenue_cents - chargeback_cost_cents - equipment_cost_cents
      agent_basis_cents = line.normalized_net_revenue_cents - agent_chargeable_chargeback_cents - equipment_cost_cents
      # agent_basis_cents is NOT floored: a negative basis flows through to negative allocations.
    input_set: "One record per ResidualLine of the batch being posted. ChargebackEvent rows are selected by exact period_month equality — events booked to another period never enter, no matter when they occurred."
    constants:
      MINIMUM_ACTIVE_DAYS: 1
    precision: "Whole cents, round_half_up on the equipment proration only; all other terms are integer arithmetic."

  - name: residual_split_allocation
    trigger: "POST /residual-batches/{id}/post — cascade link 2, once per MerchantProfitability row created by link 1"
    algorithm: waterfall_allocation
    formula: |
      basis = profitability.agent_basis_cents
      direct_agent = Agent referenced by Merchant.owning_agent_id AT POST TIME
      # pay_tier(agent, pct, tier_level, allocation_type):
      #     raw_cents = round_half_up(basis * pct)
      #     if agent.status == DEPARTED:
      #         paid_cents = round_half_up(basis * pct * agent.vested_pct_at_departure / 100)
      #     else:
      #         paid_cents = raw_cents
      #     vesting_withheld_cents = raw_cents - paid_cents
      #     create ResidualAllocation{applied_pct: pct, basis_cents: basis,
      #                               gross_allocation_cents: paid_cents,
      #                               vesting_withheld_cents: vesting_withheld_cents}
      #     when paid_cents != 0 or vesting_withheld_cents != 0
      # STEP 1 — direct tier:
      pay_tier(direct_agent, direct_agent.split_pct, 0, DIRECT_SPLIT)
      cumulative_pct = direct_agent.split_pct
      # STEP 2 — override tiers, walked in STRICTLY ASCENDING DEPTH ORDER
      #          (nearest ancestor first) via parent_agent_id, at most
      #          MAX_OVERRIDE_LEVELS ancestors visited, DEPARTED ancestors
      #          included in that count:
      for visit_index in 1..MAX_OVERRIDE_LEVELS:
          ancestor = parent of the previously visited agent; stop if null
          differential_pct = max(0, ancestor.override_pct - cumulative_pct)
          if differential_pct > 0:
              pay_tier(ancestor, differential_pct, visit_index, OVERRIDE)
          cumulative_pct = max(cumulative_pct, ancestor.override_pct)
      # STEP 3 — house residue absorbs unpaid tiers, vesting withholdings and rounding:
      allocated_total_cents = sum(gross_allocation_cents of the rows created above)
      iso_retained_cents    = basis - allocated_total_cents
      # STEP 4 — attach: each allocation is written to the DRAFT AgentStatement
      #          (agent_id, batch.period_month), created DRAFT/UNSETTLED when absent.
    input_set: "The owning agent plus at most MAX_OVERRIDE_LEVELS ancestors. cumulative_pct always advances on NOMINAL percentages — vesting scaling changes what is paid, never the tier arithmetic."
    constants:
      MAX_OVERRIDE_LEVELS: 3
    precision: "Whole cents, round_half_up per tier. Each tier is rounded independently; the rounding remainder is never redistributed to another agent — it lands in iso_retained_cents."

  - name: minimum_fee_reconciliation
    trigger: "POST /agent-statements/{id}/issue — step 3 of calculations.statement_net_payable"
    algorithm: threshold
    formula: |
      total = 0
      for each ResidualAllocation a where a.statement_id == statement.id
          and a.allocation_type == DIRECT_SPLIT, ordered by a.created_at ASC:
          m = Merchant a.merchant_id ; program = ProcessorProgram m.processor_program_id
          if m.status != ACTIVE:                      continue    # attrited merchants owe no minimum
          if program.minimum_billing_mode == NO_MINIMUM: continue
          line = the ResidualLine with merchant_id == m.id whose batch has
                 period_month == statement.period_month and state == POSTED
                 (at most one such line exists; if none, continue)
          billable_fee_cents = m.per_transaction_fee_cents * line.transaction_count
          shortfall_cents = max(0, m.monthly_minimum_cents - billable_fee_cents)
          total += round_half_up(shortfall_cents * agent.split_pct * MINIMUM_SHARE_PCT)
      minimum_true_up_cents = total
    input_set: "DIRECT_SPLIT allocations only — override tiers receive no share of a monthly-minimum shortfall. Merchants whose status != ACTIVE at issue time are excluded even when they produced a line for the period."
    constants:
      MINIMUM_SHARE_PCT: 0.5
    precision: "Whole cents, round_half_up PER MERCHANT, then summed (round-then-sum pinned). Boundary: billable_fee_cents == monthly_minimum_cents yields shortfall 0 (the comparison is `>=`, so exact coverage bills nothing)."

  - name: advance_recoupment_schedule
    trigger: "POST /agent-statements/{id}/issue — step 5 of calculations.statement_net_payable"
    algorithm: waterfall_allocation
    formula: |
      G = statement.gross_after_trueup_cents            # value produced by step 4
      cap_total_cents = max(0, round_half_up(G * MAX_TOTAL_RECOUPMENT_PCT))
      remaining_cap = cap_total_cents
      eligible = AgentAdvance rows where agent_id == statement.agent_id
                 and state == ACTIVE
                 and first_recoupment_month <= statement.period_month <= last_recoupment_month,
                 ordered by funded_on ASC, then created_at ASC
      taken_total = 0
      for advance in eligible:
          if advance.recoupment_mode == PERCENT_OF_RESIDUAL:
              tier_cap_pct = 0.25 if G < TIER_1_CEILING_CENTS
                             else 0.40 if G < TIER_2_CEILING_CENTS
                             else 0.50
              effective_pct = min(advance.recoupment_pct, tier_cap_pct)
              want_cents = round_half_up(G * effective_pct)
          else:   # STRAIGHT_LINE_AMORTIZATION
              if advance.months_recouped + 1 >= advance.amortization_months:
                  want_cents = advance.outstanding_cents        # final instalment absorbs the remainder
              else:
                  want_cents = round_half_up(advance.principal_cents / advance.amortization_months)
          take_cents = min(want_cents, advance.outstanding_cents, remaining_cap)
          remaining_cap -= take_cents
          taken_total += take_cents
      advance_recoupment_cents = taken_total
    input_set: "Only ACTIVE advances whose closed recoupment window [first_recoupment_month, last_recoupment_month] contains statement.period_month. RECOUPED advances and out-of-window advances contribute 0."
    constants:
      MAX_TOTAL_RECOUPMENT_PCT: 0.5
      TIER_1_CEILING_CENTS: 50000
      TIER_2_CEILING_CENTS: 150000
    precision: "Whole cents, round_half_up. The aggregate cap is computed once from G and consumed in funded_on ASC order (created_at ASC tie-break); a later advance is truncated, never the earlier one."
    variants:
      - name: percent_of_residual
        when: "advance.recoupment_mode == PERCENT_OF_RESIDUAL"
        difference: "The instalment floats with the statement: min(requested pct, tier cap keyed on G) applied to G. A weak month recoups little and the horizon stretches."
      - name: straight_line_amortization
        when: "advance.recoupment_mode == STRAIGHT_LINE_AMORTIZATION"
        difference: "The instalment is fixed at round_half_up(principal / amortization_months) regardless of G, and the final instalment absorbs the rounding remainder — for identical statements and identical principal the two variants recoup different amounts."

  - name: statement_net_payable
    trigger: "Every mutation that touches a statement: allocation attach or delete, adjustment APPLIED, POST /agent-statements/{id}/issue, POST /agent-statements/{id}/recall"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. Step 5's tier selection reads step 4, which
      # includes step 3 — so the value is only well defined in this sequence.
      1. direct_residual_cents   = sum(alloc.gross_allocation_cents
                                       where alloc.statement_id == s.id
                                         and alloc.allocation_type == DIRECT_SPLIT)
      2. override_residual_cents = sum(alloc.gross_allocation_cents
                                       where alloc.statement_id == s.id
                                         and alloc.allocation_type == OVERRIDE)
      3. minimum_true_up_cents   = 0                                  # DRAFT variant
                                 | calculations.minimum_fee_reconciliation  # ISSUED variant
      4. gross_after_trueup_cents = direct_residual_cents + override_residual_cents
                                    + minimum_true_up_cents
      5. advance_recoupment_cents = 0                                 # DRAFT variant
                                  | calculations.advance_recoupment_schedule(G = step 4)  # ISSUED variant
      6. adjustment_cents        = signed sum(adj.amount_cents
                                       where adj.statement_id == s.id and adj.state == APPLIED)
      7. opening_deficit_cents   = carry_forward_deficit_cents of the AgentStatement with
                                   agent_id == s.agent_id, period_month == the calendar month
                                   immediately preceding s.period_month, and
                                   lifecycle_state IN {ISSUED, FINALIZED}; 0 when absent
      8. pre_floor_cents = gross_after_trueup_cents - advance_recoupment_cents
                           + adjustment_cents - opening_deficit_cents
      9. net_payable_cents            = max(0, pre_floor_cents)
         carry_forward_deficit_cents  = max(0, -pre_floor_cents)
    input_set: "Allocations and adjustments attached to THIS statement only. The preceding period's deficit enters through step 7 and only when that statement is ISSUED or FINALIZED — a DRAFT predecessor contributes 0."
    constants:
      MIN_PAYOUT_CENTS: 2500
    precision: "Integer cents throughout; the only rounding happens inside steps 3 and 5."
    variants:
      - name: draft_variant
        when: "statement.lifecycle_state == DRAFT"
        difference: "Steps 3 and 5 are forced to 0 — a DRAFT statement shows allocations and applied adjustments but never a minimum true-up and never an advance recoupment."
      - name: issued_variant
        when: "the DRAFT -> ISSUED transition, and thereafter while lifecycle_state IN {ISSUED, FINALIZED}"
        difference: "Steps 3 and 5 are evaluated and persisted, so the same allocation set yields a different net_payable_cents before and after issue."

  - name: agent_vesting_pct
    trigger: "Read of Agent.vested_pct, and the DEPARTURE_NOTICE -> DEPARTED transition (where the result is frozen into vested_pct_at_departure)"
    algorithm: decay_function
    formula: |
      if agent.status == DEPARTED and agent.vested_pct_at_departure != null:
          return agent.vested_pct_at_departure
      vs = agent.vesting_start_date ; now = the logical clock's current date (UTC)
      months_elapsed = (now.year - vs.year) * 12 + (now.month - vs.month)
      if now.day < vs.day: months_elapsed -= 1
      if months_elapsed < VESTING_CLIFF_MONTHS:
          return 0
      return min(100, VESTING_STEP_PCT * floor(months_elapsed / VESTING_STEP_MONTHS))
    input_set: "The agent's own vesting_start_date against the logical clock. No merchant or statement data participates."
    constants:
      VESTING_CLIFF_MONTHS: 12
      VESTING_STEP_MONTHS: 12
      VESTING_STEP_PCT: 25
    precision: "Whole percent. Boundary is INCLUSIVE at the cliff: months_elapsed == 12 returns 25, months_elapsed == 11 returns 0."

  - name: departure_vested_buyout
    trigger: "POST /agents/{id}/depart"
    algorithm: chronological
    formula: |
      window = the agent's AgentStatement rows with lifecycle_state IN {ISSUED, FINALIZED},
               ordered by period_month DESC (period_month is unique per agent, so the
               order is total), take the first up-to-3 rows
      if count(window) == 0: return 0
      avg_cents = round_half_up(sum(gross_after_trueup_cents over window) / count(window))
      return round_half_up(avg_cents * VESTING_BUYOUT_MULTIPLE
                           * agent.vested_pct_at_departure / 100)
    input_set: "ISSUED and FINALIZED statements only — DRAFT statements (including the one the departure cascade upserts) never enter the trailing average."
    constants:
      VESTING_BUYOUT_MULTIPLE: 24
    precision: "Whole cents, round_half_up twice: once on the trailing average, once on the multiple. A 0% vested agent buys out at exactly 0."

  - name: bonus_clawback
    trigger: "POST /merchants/{id}/attrite — cascade link 1"
    algorithm: decay_function
    formula: |
      days_active = (merchant.attrition_date - merchant.boarded_on) in whole days
      if days_active >= CLAWBACK_WINDOW_DAYS:
          return 0
      return round_half_up(merchant.upfront_bonus_cents
                           * (CLAWBACK_WINDOW_DAYS - days_active) / CLAWBACK_WINDOW_DAYS)
    input_set: "The attriting merchant's own boarded_on, attrition_date and upfront_bonus_cents. Reactivation does not re-open the window: a later attrition recomputes from the SAME boarded_on."
    constants:
      CLAWBACK_WINDOW_DAYS: 270
    precision: "Whole cents, round_half_up. Boundary is EXCLUSIVE of clawback at exactly the window edge: days_active == 270 returns 0, days_active == 269 returns round_half_up(bonus / 270)."

  - name: agent_portfolio_attrition_bps
    trigger: "Any Merchant status change (activate, attrite, reactivate), reassignment, or portfolio transfer touching the agent"
    algorithm: threshold
    formula: |
      denominator = count(Merchant where owning_agent_id == agent.id
                          and status IN {ACTIVE, ATTRITED})
      if denominator == 0:
          portfolio_attrition_bps = 0
      else:
          numerator = count(Merchant where owning_agent_id == agent.id and status == ATTRITED)
          portfolio_attrition_bps = round_half_up(10000 * numerator / denominator)
      residual_hold = (portfolio_attrition_bps >= ATTRITION_HOLD_THRESHOLD_BPS)
    input_set: "Merchants with status IN {ACTIVE, ATTRITED} only — PENDING merchants are excluded from BOTH numerator and denominator, unlike Agent.portfolio_merchant_count which counts all three."
    constants:
      ATTRITION_HOLD_THRESHOLD_BPS: 2500
    precision: "Integer basis points, round_half_up. The hold comparison is INCLUSIVE: exactly 2500 bps (1 of 4 merchants attrited) sets residual_hold = true."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# -----------------------------------------------------------------------------
# Priority bands:
#   1-3   authentication / authorization / actor scope
#   4-5   request schema and field-domain checks
#   6     existence of path-segment resources, left to right
#   7     existence of body-referenced foreign keys, in declaration order
#   8     optimistic-concurrency version match (§1.2.1)
#   9     state preconditions on the target resource
#   10    business safety (segregation of duties, portfolio risk holds)
#   11    business temporal (coverage windows, period locks, recoupment windows)
#   12    business constraint (uniqueness, hierarchy, cross-entity readiness)
#   13    business fiscal (money ceilings, exposure, payout floors)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four roles declared in §1.7"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When X-User-Role == Agent, the addressed resource must belong to the acting agent: X-User-ID must equal Agent.id for /agents/{id} reads, ResidualAllocation.agent_id / AgentStatement.agent_id for statement and allocation reads, Merchant.owning_agent_id for merchant reads, and the agent_id of the statement being adjusted for POST /agent-statements/{id}/adjustments and POST /statement-adjustments/{id}/resubmit. Filtered list reads by an Agent must carry the matching agent_id / owning_agent_id filter equal to X-User-ID."
    error_id: ERR_AGENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /agents/{id}, GET /agents/{id}/portfolio-summary, GET /merchants, GET /merchants/{id}, GET /agent-statements, GET /agent-statements/{id}, GET /residual-allocations, GET /residual-allocations/{id}, GET /statement-adjustments, POST /agent-statements/{id}/adjustments, POST /statement-adjustments/{id}/resubmit"

  - priority: 4
    category: business_constraint
    check: "Every required input field of the endpoint is present, every value has the declared JSON type, every enum-typed field carries a value from that field's declared enum set in §1.1, integer cent fields are integers, and monetary/count fields that must be non-negative (principal_cents, monthly_minimum_cents, per_transaction_fee_cents, equipment_lease_monthly_cents, upfront_bonus_cents, transaction_count, sales_volume_cents, interchange_cents, assessments_cents, gross_income_cents, amount_cents on chargebacks) are >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "split_pct, override_pct and recoupment_pct are decimal fractions in the closed interval [0, 1]"
    error_id: ERR_INVALID_PCT_RANGE
    http_status: 422
    applies_to: "POST /agents, PATCH /agents/{id}, POST /agents/{id}/advances"

  - priority: 5
    category: business_constraint
    check: "Every period_month input matches the exact pattern YYYY-MM with month in 01..12"
    error_id: ERR_INVALID_PERIOD_MONTH
    http_status: 422
    applies_to: "POST /residual-batches, POST /merchants/{id}/chargebacks, POST /agents/{id}/advances (first_recoupment_month, last_recoupment_month)"

  - priority: 6
    category: existence
    check: "The ProcessorProgram named by the {id} path segment exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /processor-programs/{id}, PATCH /processor-programs/{id}, POST /processor-programs/{id}/suspend, POST /processor-programs/{id}/reinstate"

  - priority: 6
    category: existence
    check: "The Agent named by the {id} path segment exists"
    error_id: ERR_AGENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /agents/{id}, GET /agents/{id}/portfolio-summary, PATCH /agents/{id}, POST /agents/{id}/notice, POST /agents/{id}/rescind-notice, POST /agents/{id}/depart, POST /agents/{id}/transfer-portfolio, POST /agents/{id}/advances"

  - priority: 6
    category: existence
    check: "The AgentAdvance named by the {id} path segment exists"
    error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /agent-advances/{id}"

  - priority: 6
    category: existence
    check: "The Merchant named by the {id} path segment exists"
    error_id: ERR_MERCHANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /merchants/{id}, PATCH /merchants/{id}, POST /merchants/{id}/activate, POST /merchants/{id}/attrite, POST /merchants/{id}/reactivate, POST /merchants/{id}/reassign-agent, POST /merchants/{id}/chargebacks"

  - priority: 6
    category: existence
    check: "The ChargebackEvent named by the {id} path segment exists"
    error_id: ERR_CHARGEBACK_NOT_FOUND
    http_status: 404
    applies_to: "GET /chargeback-events/{id}"

  - priority: 6
    category: existence
    check: "The ResidualBatch named by the {id} path segment exists"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "GET /residual-batches/{id}, POST /residual-batches/{id}/lines, POST /residual-batches/{id}/normalize, POST /residual-batches/{id}/recall, POST /residual-batches/{id}/post, POST /residual-batches/{id}/reverse"

  - priority: 6
    category: existence
    check: "The ResidualLine named by the {id} path segment exists"
    error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /residual-lines/{id}"

  - priority: 6
    category: existence
    check: "The MerchantProfitability row named by the {id} path segment exists"
    error_id: ERR_PROFITABILITY_NOT_FOUND
    http_status: 404
    applies_to: "GET /merchant-profitability/{id}"

  - priority: 6
    category: existence
    check: "The ResidualAllocation named by the {id} path segment exists"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /residual-allocations/{id}"

  - priority: 6
    category: existence
    check: "The AgentStatement named by the {id} path segment exists"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /agent-statements/{id}, POST /agent-statements/{id}/issue, POST /agent-statements/{id}/recall, POST /agent-statements/{id}/finalize, POST /agent-statements/{id}/hold, POST /agent-statements/{id}/release-hold, POST /agent-statements/{id}/settle, POST /agent-statements/{id}/adjustments"

  - priority: 6
    category: existence
    check: "The StatementAdjustment named by the {id} path segment exists"
    error_id: ERR_ADJUSTMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /statement-adjustments/{id}, POST /statement-adjustments/{id}/review, POST /statement-adjustments/{id}/request-info, POST /statement-adjustments/{id}/resubmit, POST /statement-adjustments/{id}/approve, POST /statement-adjustments/{id}/reject"

  - priority: 7
    category: business_referential
    check: "Every Agent id supplied in the request body exists: parent_agent_id on POST /agents and PATCH /agents/{id}, new_agent_id on POST /merchants/{id}/reassign-agent, owning_agent_id on POST /merchants, target_agent_id on POST /agents/{id}/transfer-portfolio"
    error_id: ERR_REFERENCED_AGENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /agents, PATCH /agents/{id}, POST /merchants, POST /merchants/{id}/reassign-agent, POST /agents/{id}/transfer-portfolio"

  - priority: 7
    category: business_referential
    check: "processor_program_id supplied in the request body exists"
    error_id: ERR_REFERENCED_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /merchants, POST /residual-batches"

  - priority: 7
    category: business_referential
    check: "Every Merchant id supplied in the request body exists: merchant_id on POST /residual-batches/{id}/lines, source_merchant_id on POST /agent-statements/{id}/adjustments"
    error_id: ERR_REFERENCED_MERCHANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /residual-batches/{id}/lines, POST /agent-statements/{id}/adjustments"

  - priority: 8
    category: state
    check: "expected_agent_version equals the addressed Agent's current version"
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412
    applies_to: "POST /agents/{id}/advances"

  - priority: 8
    category: state
    check: "expected_merchant_version equals the addressed Merchant's current version"
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412
    applies_to: "POST /merchants/{id}/reassign-agent"

  - priority: 8
    category: state
    check: "expected_statement_version equals the addressed AgentStatement's current version"
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412
    applies_to: "POST /agent-statements/{id}/adjustments"

  - priority: 9
    category: state
    check: "The ResidualBatch is in a state that admits the requested transition per §1.2: lines may be appended only in RECEIVED, normalize only from RECEIVED, recall only from NORMALIZED, post only from NORMALIZED, reverse only from POSTED"
    error_id: ERR_BATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /residual-batches/{id}/lines, POST /residual-batches/{id}/normalize, POST /residual-batches/{id}/recall, POST /residual-batches/{id}/post, POST /residual-batches/{id}/reverse"

  - priority: 9
    category: state
    check: "The AgentStatement's lifecycle_state admits the requested transition per §1.2: issue only from DRAFT, recall only from ISSUED, finalize only from ISSUED, settle only from ISSUED or FINALIZED, adjustments may be proposed only against DRAFT or ISSUED (never FINALIZED)"
    error_id: ERR_STATEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /agent-statements/{id}/issue, POST /agent-statements/{id}/recall, POST /agent-statements/{id}/finalize, POST /agent-statements/{id}/settle, POST /agent-statements/{id}/adjustments"

  - priority: 9
    category: state
    check: "The AgentStatement's settlement_state admits the requested transition per §1.2: hold only from UNSETTLED, release-hold only from HELD, settle only from UNSETTLED; a SETTLED statement admits none of the three, and recall is refused once settlement_state == SETTLED"
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /agent-statements/{id}/hold, POST /agent-statements/{id}/release-hold, POST /agent-statements/{id}/settle, POST /agent-statements/{id}/recall"

  - priority: 9
    category: state
    check: "The StatementAdjustment's state admits the requested transition per §1.2: review only from PROPOSED, request-info only from UNDER_REVIEW, resubmit only from INFO_REQUESTED, approve and reject only from UNDER_REVIEW"
    error_id: ERR_ADJUSTMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /statement-adjustments/{id}/review, POST /statement-adjustments/{id}/request-info, POST /statement-adjustments/{id}/resubmit, POST /statement-adjustments/{id}/approve, POST /statement-adjustments/{id}/reject"

  - priority: 9
    category: state
    check: "The Merchant's status admits the requested transition per §1.2: activate only from PENDING, attrite only from ACTIVE, reactivate only from ATTRITED; a residual line may be appended for a merchant in any status, but reassignment requires status != ATTRITED"
    error_id: ERR_MERCHANT_STATE_INVALID
    http_status: 409
    applies_to: "POST /merchants/{id}/activate, POST /merchants/{id}/attrite, POST /merchants/{id}/reactivate, POST /merchants/{id}/reassign-agent"

  - priority: 9
    category: state
    check: "The Agent's status admits the requested operation per §1.2: notice only from ACTIVE, rescind-notice only from DEPARTURE_NOTICE, depart only from DEPARTURE_NOTICE, transfer-portfolio only from DEPARTED; an advance may be funded only for an ACTIVE agent; a merchant may be created under or reassigned to an agent only while that agent is ACTIVE; a parent_agent_id supplied on POST /agents or PATCH /agents/{id} must reference an agent whose status == ACTIVE"
    error_id: ERR_AGENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /agents/{id}/notice, POST /agents/{id}/rescind-notice, POST /agents/{id}/depart, POST /agents/{id}/transfer-portfolio, POST /agents/{id}/advances, POST /merchants, POST /merchants/{id}/reassign-agent, POST /agents, PATCH /agents/{id}"

  - priority: 9
    category: state
    check: "The AgentAdvance is in state ACTIVE. A RECOUPED advance is closed: its terms can no longer be restructured (and it never participates in a recoupment waterfall)."
    error_id: ERR_ADVANCE_STATE_INVALID
    http_status: 409
    applies_to: "POST /agent-advances/{id}/restructure"

  - priority: 9
    category: state
    check: "Conditional shape rule on restructuring: when the resulting recoupment_mode is STRAIGHT_LINE_AMORTIZATION, amortization_months must be present on the advance after the patch is applied; when it is PERCENT_OF_RESIDUAL, recoupment_pct must be present after the patch. Evaluated after the state check so a RECOUPED advance reports its state error rather than a shape error."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /agent-advances/{id}/restructure"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the X-User-ID approving a StatementAdjustment must differ from that adjustment's created_by_user_id. Checked after the state check, so approving a PROPOSED adjustment as its own creator reports ERR_ADJUSTMENT_STATE_INVALID (priority 9), not this error."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /statement-adjustments/{id}/approve"

  - priority: 10
    category: business_safety
    check: "Portfolio risk hold: money may not leave while the owning Agent's residual_hold == true. Settlement is refused outright, and a HELD statement may not be released while the hold flag is still set — the flag must first be cleared by bringing portfolio_attrition_bps back under ATTRITION_HOLD_THRESHOLD_BPS (e.g. by reactivating a merchant)."
    error_id: ERR_RESIDUAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /agent-statements/{id}/settle, POST /agent-statements/{id}/release-hold"

  - priority: 11
    category: business_temporal
    check: "Batch coverage window shape: coverage_end must be strictly after coverage_start; coverage_start must fall inside period_month (>= its first day and < the first day of the next month); coverage_end must be <= the first day of the second month after period_month, so a file may spill at most one month past its accounting period"
    error_id: ERR_COVERAGE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /residual-batches"

  - priority: 11
    category: business_temporal
    check: "Coverage exclusivity: the half-open day interval [coverage_start, coverage_end) of a new batch must not overlap the interval of any existing ResidualBatch of the same ProcessorProgram whose state != REVERSED. Touching intervals do not overlap: an existing window ending 2026-08-10 and a new window starting 2026-08-10 are both accepted."
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /residual-batches"

  - priority: 11
    category: business_temporal
    check: "Period lock: neither a post nor a reverse may touch a period that has already been reported — a batch may not be posted while any AgentStatement with the same period_month has lifecycle_state IN {ISSUED, FINALIZED}, and a posted batch may not be reversed while any AgentStatement with that period_month has lifecycle_state IN {ISSUED, FINALIZED}"
    error_id: ERR_PERIOD_LOCKED
    http_status: 409
    applies_to: "POST /residual-batches/{id}/post, POST /residual-batches/{id}/reverse"

  - priority: 11
    category: business_temporal
    check: "Recoupment window shape: last_recoupment_month >= first_recoupment_month; first_recoupment_month >= the calendar month of funded_on; and when recoupment_mode == STRAIGHT_LINE_AMORTIZATION the inclusive month count of [first_recoupment_month, last_recoupment_month] must equal amortization_months exactly"
    error_id: ERR_RECOUPMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /agents/{id}/advances, POST /agent-advances/{id}/restructure"

  - priority: 11
    category: business_temporal
    check: "Merchant lifecycle dates are bounded by the logical clock: attrition_date >= boarded_on and attrition_date <= the clock's current date; reactivation_date >= attrition_date and reactivation_date <= the clock's current date"
    error_id: ERR_MERCHANT_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /merchants/{id}/attrite, POST /merchants/{id}/reactivate"

  - priority: 11
    category: business_temporal
    check: "Departure dates are bounded by the logical clock: on POST /agents/{id}/notice, departure_effective_date >= the clock's current date; on POST /agents/{id}/depart, the clock's current date must have reached departure_effective_date"
    error_id: ERR_DEPARTURE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /agents/{id}/notice, POST /agents/{id}/depart"

  - priority: 12
    category: business_constraint
    check: "The governing ProcessorProgram's status must be ACTIVE. A SUSPENDED program accepts no new batch, no appended line, no normalization and no posting — even for batches ingested before the suspension."
    error_id: ERR_PROGRAM_SUSPENDED
    http_status: 409
    applies_to: "POST /residual-batches, POST /residual-batches/{id}/lines, POST /residual-batches/{id}/normalize, POST /residual-batches/{id}/post"

  - priority: 12
    category: business_constraint
    check: "file_checksum is unique across all ResidualBatch rows whose state != REVERSED; a reversed batch releases its checksum so a corrected re-ingest can reuse it"
    error_id: ERR_DUPLICATE_FILE_CHECKSUM
    http_status: 409
    applies_to: "POST /residual-batches"

  - priority: 12
    category: business_constraint
    check: "mid is unique across all Merchant rows regardless of status"
    error_id: ERR_DUPLICATE_MID
    http_status: 409
    applies_to: "POST /merchants"

  - priority: 12
    category: business_constraint
    check: "At most one ResidualLine per (residual_batch_id, merchant_id) pair — a processor file states each merchant once per period"
    error_id: ERR_DUPLICATE_LINE_FOR_MERCHANT
    http_status: 409
    applies_to: "POST /residual-batches/{id}/lines"

  - priority: 12
    category: business_constraint
    check: "The line's Merchant.processor_program_id must equal the batch's processor_program_id — a merchant boarded on another program cannot appear in this program's residual file"
    error_id: ERR_LINE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /residual-batches/{id}/lines"

  - priority: 12
    category: business_constraint
    check: "parent_agent_id must not be the agent itself, nor any agent reachable by following parent_agent_id upward from the agent (no cycles in the hierarchy)"
    error_id: ERR_HIERARCHY_CYCLE
    http_status: 422
    applies_to: "POST /agents, PATCH /agents/{id}"

  - priority: 12
    category: business_constraint
    check: "The resulting hierarchy_depth of the agent (and, for a re-parent, of every descendant) must be <= MAX_HIERARCHY_DEPTH (4)"
    error_id: ERR_HIERARCHY_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /agents, PATCH /agents/{id}"

  - priority: 12
    category: business_constraint
    check: "Cross-entity readiness for issue: every ResidualBatch whose period_month equals the statement's period_month must be in state POSTED or REVERSED. A single RECEIVED or NORMALIZED batch for that period blocks the issue of every statement of that period."
    error_id: ERR_BATCHES_NOT_POSTED
    http_status: 409
    applies_to: "POST /agent-statements/{id}/issue"

  - priority: 12
    category: business_constraint
    check: "The portfolio transfer target must exist, must have status ACTIVE, and must not be the departing agent"
    error_id: ERR_TRANSFER_TARGET_INVALID
    http_status: 422
    applies_to: "POST /agents/{id}/transfer-portfolio"

  - priority: 12
    category: business_constraint
    check: "Override monotonicity: for every parent/child edge that the write creates or moves, parent.override_pct >= max(child.split_pct, child.override_pct). An upline tier can never be entitled to a smaller cumulative share than the tier below it, since the differential override walk would then pay it nothing."
    error_id: ERR_OVERRIDE_PCT_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /agents, PATCH /agents/{id}"

  - priority: 13
    category: business_fiscal
    check: "recoupment_pct must be <= MAX_TOTAL_RECOUPMENT_PCT (0.50) — no single advance may be written to claim more than half of a monthly residual"
    error_id: ERR_RECOUPMENT_PCT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /agents/{id}/advances, POST /agent-advances/{id}/restructure"

  - priority: 13
    category: business_fiscal
    check: "Aggregate exposure: sum(outstanding_cents of the agent's ACTIVE advances) + principal_cents of the new advance must be <= max(BOOTSTRAP_ADVANCE_CEILING_CENTS (250000), MAX_ADVANCE_EXPOSURE_MULTIPLE (6) * agent.trailing_residual_cents). Each advance may be individually acceptable while the portfolio total is not."
    error_id: ERR_ADVANCE_EXPOSURE_EXCEEDED
    http_status: 409
    applies_to: "POST /agents/{id}/advances"

  - priority: 13
    category: business_fiscal
    check: "Payout floor: net_payable_cents must be >= MIN_PAYOUT_CENTS (2500) at settlement; smaller balances stay unsettled and roll into the next period"
    error_id: ERR_BELOW_MIN_PAYOUT
    http_status: 409
    applies_to: "POST /agent-statements/{id}/settle"

  - priority: 13
    category: business_fiscal
    check: "Adjustment sign discipline: amount_cents must be non-zero, strictly positive for kind IN {DISPUTE_CREDIT, CLAWBACK_REVERSAL, VESTED_BUYOUT} and strictly negative for kind IN {MANUAL_DEBIT, BONUS_CLAWBACK}"
    error_id: ERR_ADJUSTMENT_SIGN_INVALID
    http_status: 422
    applies_to: "POST /agent-statements/{id}/adjustments"

  - priority: 13
    category: business_fiscal
    check: "A CLAWBACK_REVERSAL may not give back more than was taken: amount_cents must be <= the owning Agent's lifetime_clawback_cents"
    error_id: ERR_CLAWBACK_REVERSAL_EXCEEDS_CLAWBACK
    http_status: 409
    applies_to: "POST /agent-statements/{id}/adjustments"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
# api_prefix is "/", so every path below is absolute and flat. `{id}` is the
# only path placeholder name used anywhere in this scaffold.
# All list endpoints accept `limit?` and `offset?` and return the paginated
# envelope declared in §1.0.
# -----------------------------------------------------------------------------
endpoints:

  # --- test-driving: logical clock --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical current UTC instant, which every date-sensitive rule reads (agent_vesting_pct, bonus_clawback window, statement issued_at, advance funding month checks). The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time."
    roles: [IsoAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["sets the logical clock consulted by every subsequent request"]

  # --- ProcessorProgram -------------------------------------------------------
  - method: POST
    path: "/processor-programs"
    description: "Register a processor program with its buy-rate economics and normalization variant."
    roles: [IsoAdmin]
    code: 201
    input: ["name", "buy_rate_bps", "buy_rate_per_item_cents", "assessment_bps", "normalization_mode", "minimum_billing_mode?"]
    output: ProcessorProgram
    side_effects: ["status := ACTIVE", "posted_batch_count := 0", "minimum_billing_mode defaults to SHORTFALL_BILLED when omitted"]

  - method: GET
    path: "/processor-programs"
    description: "List processor programs, optionally filtered by status."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProcessorProgram[]
    side_effects: []

  - method: GET
    path: "/processor-programs/{id}"
    description: "Fetch one processor program."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: []
    output: ProcessorProgram
    side_effects: []

  - method: PATCH
    path: "/processor-programs/{id}"
    description: "Amend program economics. Never retroactive: already-normalized lines keep the values computed at normalization time."
    roles: [IsoAdmin]
    code: 200
    input: ["name?", "buy_rate_bps?", "buy_rate_per_item_cents?", "assessment_bps?", "minimum_billing_mode?"]
    output: ProcessorProgram
    side_effects: ["increments ProcessorProgram.version by 1"]

  - method: POST
    path: "/processor-programs/{id}/suspend"
    description: "Suspend a program: it stops accepting batch ingest, line append, normalization and posting."
    roles: [IsoAdmin]
    code: 200
    input: []
    output: ProcessorProgram
    side_effects: ["status := SUSPENDED", "increments ProcessorProgram.version by 1"]

  - method: POST
    path: "/processor-programs/{id}/reinstate"
    description: "Return a SUSPENDED program to ACTIVE."
    roles: [IsoAdmin]
    code: 200
    input: []
    output: ProcessorProgram
    side_effects: ["status := ACTIVE", "increments ProcessorProgram.version by 1"]

  # --- Agent ------------------------------------------------------------------
  - method: POST
    path: "/agents"
    description: "Create an agent, optionally under a parent agent, establishing the override chain."
    roles: [IsoAdmin]
    code: 201
    input: ["name", "split_pct", "override_pct", "vesting_start_date", "parent_agent_id?"]
    output: Agent
    side_effects: ["status := ACTIVE", "hierarchy_depth := 0 when parent_agent_id is null, else parent.hierarchy_depth + 1", "vested_pct := calculations.agent_vesting_pct", "residual_hold := false", "portfolio_attrition_bps := 0", "all money counters := 0"]

  - method: GET
    path: "/agents"
    description: "List agents. Filtering by parent_agent_id is the reverse-reachability read for the self-referential hierarchy FK."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: ["status?", "parent_agent_id?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []

  - method: GET
    path: "/agents/{id}"
    description: "Fetch one agent. An acting Agent may read only itself."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: PATCH
    path: "/agents/{id}"
    description: "Amend agent terms or re-parent the agent in the hierarchy. Never retroactive: existing ResidualAllocation rows are untouched."
    roles: [IsoAdmin]
    code: 200
    input: ["name?", "split_pct?", "override_pct?", "vesting_start_date?", "parent_agent_id?"]
    output: Agent
    side_effects: ["recomputes hierarchy_depth for this agent and every descendant", "vested_pct := calculations.agent_vesting_pct", "increments Agent.version by 1"]

  - method: GET
    path: "/agents/{id}/portfolio-summary"
    description: "Computed read: the agent's portfolio risk and exposure snapshot, derived on the fly from its merchants, statements and advances."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: []
    output: { agent_id: string, portfolio_merchant_count: integer, active_merchant_count: integer, attrited_merchant_count: integer, portfolio_attrition_bps: integer, residual_hold: boolean, vested_pct: integer, trailing_residual_cents: integer, advance_outstanding_cents: integer, lifetime_clawback_cents: integer }
    side_effects: []

  - method: POST
    path: "/agents/{id}/notice"
    description: "Record an agent's departure notice with its effective date."
    roles: [IsoAdmin]
    code: 200
    input: [departure_effective_date]
    output: Agent
    side_effects: ["status := DEPARTURE_NOTICE", "departure_effective_date := input", "increments Agent.version by 1"]

  - method: POST
    path: "/agents/{id}/rescind-notice"
    description: "Withdraw a departure notice; the agent returns to ACTIVE and departure_effective_date is cleared."
    roles: [IsoAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status := ACTIVE", "departure_effective_date := null", "increments Agent.version by 1"]

  - method: POST
    path: "/agents/{id}/depart"
    description: "Complete the departure: freeze the vesting percentage and book the vested portfolio buyout as an adjustment on the agent's DRAFT statement for the departure month."
    roles: [IsoAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status := DEPARTED", "vested_pct_at_departure := calculations.agent_vesting_pct evaluated at the logical clock", "creates a system StatementAdjustment{kind: VESTED_BUYOUT, state: APPLIED, created_by_user_id: 'system', amount_cents: calculations.departure_vested_buyout} on the agent's AgentStatement for the calendar month of departure_effective_date, creating that statement DRAFT/UNSETTLED when absent; no adjustment is created when the buyout evaluates to 0", "increments Agent.version by 1"]

  - method: POST
    path: "/agents/{id}/transfer-portfolio"
    description: "Reassign a DEPARTED agent's merchants to another active agent. Conditional cascade: only merchants whose status != ATTRITED move."
    roles: [IsoAdmin]
    code: 200
    input: [target_agent_id]
    output: Agent
    side_effects: ["for every Merchant with owning_agent_id == this agent and status IN {PENDING, ACTIVE}: owning_agent_id := target_agent_id and increments that Merchant.version by 1", "ATTRITED merchants keep their original owning_agent_id", "recomputes calculations.agent_portfolio_attrition_bps for both agents", "increments Agent.version by 1 on both agents"]

  # --- AgentAdvance -----------------------------------------------------------
  - method: POST
    path: "/agents/{id}/advances"
    description: "Fund a cash advance or portfolio buyout against the agent's future residual stream. OCC-guarded on the Agent: expected_agent_version must equal the agent's current version."
    roles: [IsoAdmin]
    code: 201
    input: ["advance_type", "recoupment_mode", "principal_cents", "first_recoupment_month", "last_recoupment_month", "funded_on", "expected_agent_version", "recoupment_pct?", "amortization_months?"]
    output: AgentAdvance
    side_effects: ["state := ACTIVE", "outstanding_cents := principal_cents", "cumulative_recouped_cents := 0", "months_recouped := 0", "Agent.advance_outstanding_cents += principal_cents", "increments Agent.version by 1"]

  - method: GET
    path: "/agent-advances"
    description: "List advances; filtering by agent_id is the reverse-reachability read for AgentAdvance.agent_id."
    roles: [IsoAdmin, ResidualController]
    code: 200
    input: ["agent_id?", "state?", "recoupment_mode?", "limit?", "offset?"]
    output: AgentAdvance[]
    side_effects: []

  - method: GET
    path: "/agent-advances/{id}"
    description: "Fetch one advance with its live outstanding balance."
    roles: [IsoAdmin, ResidualController]
    code: 200
    input: []
    output: AgentAdvance
    side_effects: []

  - method: POST
    path: "/agent-advances/{id}/restructure"
    description: "Amend an ACTIVE advance's recoupment terms, including switching between the two recoupment variants. Never retroactive: already-recouped amounts stand."
    roles: [IsoAdmin]
    code: 200
    input: ["recoupment_mode?", "recoupment_pct?", "amortization_months?", "last_recoupment_month?"]
    output: AgentAdvance
    side_effects: ["increments AgentAdvance.version by 1"]

  # --- Merchant ---------------------------------------------------------------
  - method: POST
    path: "/merchants"
    description: "Board a merchant under an ACTIVE owning agent and a processor program. Starts PENDING."
    roles: [IsoAdmin]
    code: 201
    input: ["owning_agent_id", "processor_program_id", "mid", "monthly_minimum_cents", "per_transaction_fee_cents", "equipment_lease_monthly_cents", "boarded_on", "upfront_bonus_cents?"]
    output: Merchant
    side_effects: ["status := PENDING", "upfront_bonus_cents defaults to 0 when omitted", "clawed_back_bonus_cents := 0", "Agent.portfolio_merchant_count += 1"]

  - method: GET
    path: "/merchants"
    description: "List merchants. Filtering by owning_agent_id and processor_program_id provides reverse reachability for both of Merchant's FKs. An acting Agent must pass owning_agent_id equal to its own id."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: ["owning_agent_id?", "processor_program_id?", "status?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []

  - method: GET
    path: "/merchants/{id}"
    description: "Fetch one merchant. An acting Agent may read only merchants it owns."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: PATCH
    path: "/merchants/{id}"
    description: "Amend merchant fee terms. Applies to future periods only; already-posted profitability rows are untouched."
    roles: [IsoAdmin]
    code: 200
    input: ["monthly_minimum_cents?", "per_transaction_fee_cents?", "equipment_lease_monthly_cents?"]
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/activate"
    description: "Move a boarded merchant from PENDING to ACTIVE, making it eligible for monthly-minimum reconciliation."
    roles: [IsoAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status := ACTIVE", "recomputes calculations.agent_portfolio_attrition_bps for the owning agent", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/attrite"
    description: "Close a merchant. Cascades the bonus clawback and the owning agent's attrition-risk hold."
    roles: [IsoAdmin]
    code: 200
    input: [attrition_date]
    output: Merchant
    side_effects: ["status := ATTRITED", "attrition_date := input", "clawed_back_bonus_cents := calculations.bonus_clawback", "when clawed_back_bonus_cents > 0: Agent.lifetime_clawback_cents += clawed_back_bonus_cents and a system StatementAdjustment{kind: BONUS_CLAWBACK, state: APPLIED, created_by_user_id: 'system', amount_cents: -clawed_back_bonus_cents, source_merchant_id: this merchant} is created on the owning agent's AgentStatement for the calendar month of attrition_date, creating that statement DRAFT/UNSETTLED when absent, and that statement is recomputed via calculations.statement_net_payable", "recomputes calculations.agent_portfolio_attrition_bps for the owning agent, sets Agent.residual_hold accordingly, and when the hold flips to true every statement of that agent with lifecycle_state IN {DRAFT, ISSUED} and settlement_state == UNSETTLED moves to HELD with hold_reason PORTFOLIO_ATTRITION_THRESHOLD", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/reactivate"
    description: "Reopen an ATTRITED merchant. Reverses the clawback and re-evaluates the owning agent's attrition hold."
    roles: [IsoAdmin]
    code: 200
    input: [reactivation_date]
    output: Merchant
    side_effects: ["status := ACTIVE", "reactivation_date := input", "attrition_date := null", "when clawed_back_bonus_cents > 0: Agent.lifetime_clawback_cents -= clawed_back_bonus_cents, a system StatementAdjustment{kind: CLAWBACK_REVERSAL, state: APPLIED, created_by_user_id: 'system', amount_cents: +clawed_back_bonus_cents, source_merchant_id: this merchant} is created on the owning agent's AgentStatement for the calendar month of reactivation_date and that statement is recomputed, and clawed_back_bonus_cents := 0", "recomputes calculations.agent_portfolio_attrition_bps for the owning agent and clears Agent.residual_hold when it falls below ATTRITION_HOLD_THRESHOLD_BPS", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/reassign-agent"
    description: "Move a merchant to a different ACTIVE agent. OCC-guarded on the Merchant: expected_merchant_version must equal the merchant's current version."
    roles: [IsoAdmin]
    code: 200
    input: [new_agent_id, expected_merchant_version]
    output: Merchant
    side_effects: ["owning_agent_id := new_agent_id", "Agent.portfolio_merchant_count -= 1 on the previous owner and += 1 on the new owner", "recomputes calculations.agent_portfolio_attrition_bps for both agents", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchants/{id}/chargebacks"
    description: "Book a chargeback against a merchant for a given accounting period. Immutable append-only event."
    roles: [IsoAdmin, ResidualAnalyst]
    code: 201
    input: [amount_cents, occurred_on, period_month, liability]
    output: ChargebackEvent
    side_effects: ["appends an immutable ChargebackEvent; it enters merchant profitability only when a batch for the same period_month is posted"]

  - method: GET
    path: "/chargeback-events"
    description: "List chargeback events; filtering by merchant_id is the reverse-reachability read for ChargebackEvent.merchant_id."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: ["merchant_id?", "period_month?", "liability?", "limit?", "offset?"]
    output: ChargebackEvent[]
    side_effects: []

  - method: GET
    path: "/chargeback-events/{id}"
    description: "Fetch one chargeback event."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: []
    output: ChargebackEvent
    side_effects: []

  # --- ResidualBatch / ResidualLine -------------------------------------------
  - method: POST
    path: "/residual-batches"
    description: "Ingest a processor residual file header for one program and accounting period. Starts RECEIVED."
    roles: [IsoAdmin, ResidualAnalyst]
    code: 201
    input: [processor_program_id, period_month, coverage_start, coverage_end, file_checksum]
    output: ResidualBatch
    side_effects: ["state := RECEIVED", "line_count := 0", "recall_count := 0", "all money totals := 0"]

  - method: GET
    path: "/residual-batches"
    description: "List residual batches; filtering by processor_program_id is the reverse-reachability read for ResidualBatch.processor_program_id."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: ["processor_program_id?", "period_month?", "state?", "limit?", "offset?"]
    output: ResidualBatch[]
    side_effects: []

  - method: GET
    path: "/residual-batches/{id}"
    description: "Fetch one residual batch with its normalization totals."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: []
    output: ResidualBatch
    side_effects: []

  - method: POST
    path: "/residual-batches/{id}/lines"
    description: "Append one merchant's residual file line to a RECEIVED batch."
    roles: [IsoAdmin, ResidualAnalyst]
    code: 201
    input: [merchant_id, transaction_count, sales_volume_cents, interchange_cents, assessments_cents, gross_income_cents]
    output: ResidualLine
    side_effects: ["ResidualBatch.line_count += 1", "computed normalization fields stay null until the batch is normalized", "increments ResidualBatch.version by 1"]

  - method: GET
    path: "/residual-lines"
    description: "List residual lines; filtering by residual_batch_id and merchant_id provides reverse reachability for both of ResidualLine's FKs."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: ["residual_batch_id?", "merchant_id?", "limit?", "offset?"]
    output: ResidualLine[]
    side_effects: []

  - method: GET
    path: "/residual-lines/{id}"
    description: "Fetch one residual line with its normalized values."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: []
    output: ResidualLine
    side_effects: []

  - method: POST
    path: "/residual-batches/{id}/normalize"
    description: "Normalize every line of a RECEIVED batch using the program's normalization variant, then roll up the batch totals."
    roles: [IsoAdmin, ResidualAnalyst]
    code: 200
    input: []
    output: ResidualBatch
    side_effects: ["state := NORMALIZED", "for every line: calculations.normalize_residual_line writes processor_cost_cents, normalized_net_revenue_cents and normalization_mode_applied", "calculations.batch_totals writes line_count, gross_volume_cents and total_normalized_net_revenue_cents", "increments ResidualBatch.version by 1"]

  - method: POST
    path: "/residual-batches/{id}/recall"
    description: "Return a NORMALIZED batch to RECEIVED so lines can be corrected or appended. Clears every normalization output."
    roles: [IsoAdmin, ResidualAnalyst]
    code: 200
    input: []
    output: ResidualBatch
    side_effects: ["state := RECEIVED", "recall_count += 1", "clears processor_cost_cents, normalized_net_revenue_cents and normalization_mode_applied on every line", "resets gross_volume_cents and total_normalized_net_revenue_cents to 0", "increments ResidualBatch.version by 1"]

  - method: POST
    path: "/residual-batches/{id}/post"
    description: "Post a NORMALIZED batch to the residual ledger. Drives the four-level cascade: profitability, allocations, statement recompute, agent KPI."
    roles: [ResidualController]
    code: 200
    input: []
    output: ResidualBatch
    side_effects: ["state := POSTED", "posted_at := logical clock", "CASCADE LINK 1: creates one MerchantProfitability per line via calculations.merchant_profitability", "CASCADE LINK 2: creates ResidualAllocation rows per profitability row via calculations.residual_split_allocation and sets iso_retained_cents on each profitability row", "CASCADE LINK 3: upserts a DRAFT/UNSETTLED AgentStatement per (agent, period_month) touched and recomputes it via calculations.statement_net_payable (DRAFT variant)", "CASCADE LINK 4: recomputes Agent.trailing_residual_cents for every agent whose statement changed", "ResidualBatch.iso_retained_cents := sum of the profitability rows' iso_retained_cents", "ProcessorProgram.posted_batch_count += 1", "increments ResidualBatch.version by 1"]

  - method: POST
    path: "/residual-batches/{id}/reverse"
    description: "Reverse a POSTED batch. Compensating transition: every ledger artefact created by the post is removed and every derived total is restored."
    roles: [ResidualController]
    code: 200
    input: []
    output: ResidualBatch
    side_effects: ["state := REVERSED", "deletes every ResidualAllocation created by this batch's post", "deletes every MerchantProfitability row of this batch", "recomputes each affected AgentStatement via calculations.statement_net_payable", "recomputes Agent.trailing_residual_cents for every affected agent", "ProcessorProgram.posted_batch_count -= 1", "releases file_checksum for re-ingest", "increments ResidualBatch.version by 1"]

  # --- MerchantProfitability / ResidualAllocation (read-only ledger artefacts) -
  - method: GET
    path: "/merchant-profitability"
    description: "List per-merchant profitability rows; filtering by merchant_id and residual_batch_id provides reverse reachability for both of MerchantProfitability's FKs."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: ["merchant_id?", "residual_batch_id?", "period_month?", "limit?", "offset?"]
    output: MerchantProfitability[]
    side_effects: []

  - method: GET
    path: "/merchant-profitability/{id}"
    description: "Fetch one profitability row."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: []
    output: MerchantProfitability
    side_effects: []

  - method: GET
    path: "/residual-allocations"
    description: "List residual allocations; filtering by agent_id, merchant_id and statement_id provides reverse reachability for all three of ResidualAllocation's FKs. An acting Agent must pass agent_id equal to its own id."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: ["agent_id?", "merchant_id?", "statement_id?", "period_month?", "allocation_type?", "limit?", "offset?"]
    output: ResidualAllocation[]
    side_effects: []

  - method: GET
    path: "/residual-allocations/{id}"
    description: "Fetch one residual allocation. An acting Agent may read only its own allocations."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: []
    output: ResidualAllocation
    side_effects: []

  # --- AgentStatement ---------------------------------------------------------
  - method: GET
    path: "/agent-statements"
    description: "List agent statements; filtering by agent_id is the reverse-reachability read for AgentStatement.agent_id. An acting Agent must pass agent_id equal to its own id."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: ["agent_id?", "period_month?", "lifecycle_state?", "settlement_state?", "limit?", "offset?"]
    output: AgentStatement[]
    side_effects: []

  - method: GET
    path: "/agent-statements/{id}"
    description: "Fetch one statement with every money line. An acting Agent may read only its own statements."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: []
    output: AgentStatement
    side_effects: []

  - method: POST
    path: "/agent-statements/{id}/issue"
    description: "Issue a DRAFT statement: run the monthly-minimum reconciliation and the advance recoupment waterfall, then freeze the payable."
    roles: [ResidualController]
    code: 200
    input: []
    output: AgentStatement
    side_effects: ["lifecycle_state := ISSUED", "issued_at := logical clock", "minimum_true_up_cents := calculations.minimum_fee_reconciliation", "advance_recoupment_cents := calculations.advance_recoupment_schedule", "for each advance touched: outstanding_cents -= its take, cumulative_recouped_cents += its take, months_recouped += 1, state := RECOUPED when outstanding_cents reaches 0, Agent.advance_outstanding_cents -= its take", "recomputes every money line via calculations.statement_net_payable (ISSUED variant)", "recomputes Agent.trailing_residual_cents", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/agent-statements/{id}/recall"
    description: "Recall an ISSUED statement to DRAFT. Compensating transition: the minimum true-up and every advance recoupment booked at issue are reversed exactly."
    roles: [ResidualController]
    code: 200
    input: []
    output: AgentStatement
    side_effects: ["lifecycle_state := DRAFT", "issued_at := null", "for each advance recouped by this statement's issue: outstanding_cents += its take, cumulative_recouped_cents -= its take, months_recouped -= 1, state := ACTIVE when it had become RECOUPED, Agent.advance_outstanding_cents += its take", "minimum_true_up_cents := 0", "advance_recoupment_cents := 0", "recomputes every money line via calculations.statement_net_payable (DRAFT variant)", "recomputes Agent.trailing_residual_cents", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/agent-statements/{id}/finalize"
    description: "Lock an ISSUED statement against further adjustment and against reversal of its period's batches."
    roles: [ResidualController]
    code: 200
    input: []
    output: AgentStatement
    side_effects: ["lifecycle_state := FINALIZED", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/agent-statements/{id}/hold"
    description: "Place an UNSETTLED statement on payment hold along the settlement dimension; the lifecycle dimension is unaffected."
    roles: [ResidualController]
    code: 200
    input: [hold_reason]
    output: AgentStatement
    side_effects: ["settlement_state := HELD", "hold_reason := input", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/agent-statements/{id}/release-hold"
    description: "Return a HELD statement to UNSETTLED. Refused while the owning agent's residual_hold flag is still set."
    roles: [ResidualController]
    code: 200
    input: []
    output: AgentStatement
    side_effects: ["settlement_state := UNSETTLED", "hold_reason := null", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/agent-statements/{id}/settle"
    description: "Pay an issued or finalized statement. Enforces the payout floor and the portfolio risk hold."
    roles: [ResidualController]
    code: 200
    input: [paid_on]
    output: AgentStatement
    side_effects: ["settlement_state := SETTLED", "paid_on := input", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/agent-statements/{id}/adjustments"
    description: "Propose a dispute credit, manual debit or clawback reversal against a statement. OCC-guarded on the AgentStatement: expected_statement_version must equal the statement's current version. The proposing X-User-ID is recorded and may never approve the result."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 201
    input: ["kind", "amount_cents", "reason", "expected_statement_version", "source_merchant_id?"]
    output: StatementAdjustment
    side_effects: ["state := PROPOSED", "created_by_user_id := X-User-ID", "no money moves until the adjustment is APPLIED", "increments AgentStatement.version by 1"]

  # --- StatementAdjustment ----------------------------------------------------
  - method: GET
    path: "/statement-adjustments"
    description: "List statement adjustments; filtering by statement_id and source_merchant_id provides reverse reachability for both of StatementAdjustment's FKs."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: ["statement_id?", "source_merchant_id?", "kind?", "state?", "limit?", "offset?"]
    output: StatementAdjustment[]
    side_effects: []

  - method: GET
    path: "/statement-adjustments/{id}"
    description: "Fetch one adjustment with its review trail."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController]
    code: 200
    input: []
    output: StatementAdjustment
    side_effects: []

  - method: POST
    path: "/statement-adjustments/{id}/review"
    description: "Take a PROPOSED adjustment under review."
    roles: [ResidualController]
    code: 200
    input: []
    output: StatementAdjustment
    side_effects: ["state := UNDER_REVIEW", "increments StatementAdjustment.version by 1"]

  - method: POST
    path: "/statement-adjustments/{id}/request-info"
    description: "Send an adjustment back to the proposer for more information."
    roles: [ResidualController]
    code: 200
    input: [info_request_note]
    output: StatementAdjustment
    side_effects: ["state := INFO_REQUESTED", "info_request_note := input", "increments StatementAdjustment.version by 1"]

  - method: POST
    path: "/statement-adjustments/{id}/resubmit"
    description: "Answer an information request and return the adjustment to review. Loops as often as needed."
    roles: [IsoAdmin, ResidualAnalyst, ResidualController, Agent]
    code: 200
    input: ["reason?"]
    output: StatementAdjustment
    side_effects: ["state := UNDER_REVIEW", "reason := input when supplied", "info_request_note := null", "increments StatementAdjustment.version by 1"]

  - method: POST
    path: "/statement-adjustments/{id}/approve"
    description: "Apply an adjustment to its statement. Segregation of duties: the approving X-User-ID must differ from created_by_user_id."
    roles: [ResidualController]
    code: 200
    input: []
    output: StatementAdjustment
    side_effects: ["state := APPLIED", "approved_by_user_id := X-User-ID", "recomputes the statement via calculations.statement_net_payable", "increments StatementAdjustment.version by 1", "increments AgentStatement.version by 1"]

  - method: POST
    path: "/statement-adjustments/{id}/reject"
    description: "Refuse an adjustment. No money moves and the statement is untouched."
    roles: [ResidualController]
    code: 200
    input: ["reason?"]
    output: StatementAdjustment
    side_effects: ["state := REJECTED", "approved_by_user_id := X-User-ID", "increments StatementAdjustment.version by 1"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- authentication / authorization ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of IsoAdmin, ResidualAnalyst, ResidualController, Agent"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles (e.g. ResidualAnalyst posting a batch, Agent creating a merchant)"
  - id: ERR_AGENT_SCOPE_VIOLATION
    http: 403
    condition: "An acting Agent addresses another agent's statement, allocation, merchant or agent record, or omits the agent_id / owning_agent_id filter on a list read"

  # --- request shape / field domains ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, value outside a declared enum set, a negative amount or count where non-negative is required, or a restructure that leaves the advance without the field its recoupment_mode requires"
  - id: ERR_INVALID_PCT_RANGE
    http: 422
    condition: "split_pct, override_pct or recoupment_pct outside the closed interval [0, 1]"
  - id: ERR_INVALID_PERIOD_MONTH
    http: 422
    condition: "A period_month, first_recoupment_month or last_recoupment_month that does not match YYYY-MM with a month in 01..12"

  # --- existence of path resources ---
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No ProcessorProgram with the {id} in the path"
  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "No Agent with the {id} in the path"
  - id: ERR_ADVANCE_NOT_FOUND
    http: 404
    condition: "No AgentAdvance with the {id} in the path"
  - id: ERR_MERCHANT_NOT_FOUND
    http: 404
    condition: "No Merchant with the {id} in the path"
  - id: ERR_CHARGEBACK_NOT_FOUND
    http: 404
    condition: "No ChargebackEvent with the {id} in the path"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No ResidualBatch with the {id} in the path"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "No ResidualLine with the {id} in the path"
  - id: ERR_PROFITABILITY_NOT_FOUND
    http: 404
    condition: "No MerchantProfitability row with the {id} in the path"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No ResidualAllocation with the {id} in the path"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "No AgentStatement with the {id} in the path"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "No StatementAdjustment with the {id} in the path"

  # --- existence of body-referenced foreign keys ---
  - id: ERR_REFERENCED_AGENT_NOT_FOUND
    http: 404
    condition: "parent_agent_id, owning_agent_id, new_agent_id or target_agent_id in the body names no existing Agent"
  - id: ERR_REFERENCED_PROGRAM_NOT_FOUND
    http: 404
    condition: "processor_program_id in the body names no existing ProcessorProgram"
  - id: ERR_REFERENCED_MERCHANT_NOT_FOUND
    http: 404
    condition: "merchant_id or source_merchant_id in the body names no existing Merchant"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_AGENT_VERSION
    http: 412
    condition: "expected_agent_version on POST /agents/{id}/advances does not equal the Agent's current version"
  - id: ERR_STALE_MERCHANT_VERSION
    http: 412
    condition: "expected_merchant_version on POST /merchants/{id}/reassign-agent does not equal the Merchant's current version"
  - id: ERR_STALE_STATEMENT_VERSION
    http: 412
    condition: "expected_statement_version on POST /agent-statements/{id}/adjustments does not equal the AgentStatement's current version"

  # --- state preconditions ---
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "The ResidualBatch's state does not admit the requested transition (append line outside RECEIVED, normalize outside RECEIVED, recall outside NORMALIZED, post outside NORMALIZED, reverse outside POSTED)"
  - id: ERR_STATEMENT_STATE_INVALID
    http: 409
    condition: "The statement's lifecycle_state does not admit the operation (issue outside DRAFT, recall or finalize outside ISSUED, settle from DRAFT, adjustment proposed against a FINALIZED statement)"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "The statement's settlement_state does not admit the operation (hold outside UNSETTLED, release-hold outside HELD, settle from HELD or SETTLED, recall of a SETTLED statement)"
  - id: ERR_ADJUSTMENT_STATE_INVALID
    http: 409
    condition: "The adjustment's state does not admit the operation (review outside PROPOSED, request-info outside UNDER_REVIEW, resubmit outside INFO_REQUESTED, approve or reject outside UNDER_REVIEW)"
  - id: ERR_MERCHANT_STATE_INVALID
    http: 409
    condition: "The merchant's status does not admit the operation (activate outside PENDING, attrite outside ACTIVE, reactivate outside ATTRITED, reassign an ATTRITED merchant)"
  - id: ERR_AGENT_STATE_INVALID
    http: 409
    condition: "The agent's status does not admit the operation (notice outside ACTIVE, rescind-notice or depart outside DEPARTURE_NOTICE, transfer-portfolio outside DEPARTED, advance funded for a non-ACTIVE agent, merchant boarded under or reassigned to a non-ACTIVE agent, parent_agent_id pointing at a non-ACTIVE agent)"
  - id: ERR_ADVANCE_STATE_INVALID
    http: 409
    condition: "Restructuring an advance whose state is RECOUPED"

  # --- business safety ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The X-User-ID approving a StatementAdjustment equals its created_by_user_id"
  - id: ERR_RESIDUAL_HOLD_ACTIVE
    http: 409
    condition: "Settling a statement, or releasing its payment hold, while the owning Agent's residual_hold == true"

  # --- business temporal ---
  - id: ERR_COVERAGE_WINDOW_INVALID
    http: 422
    condition: "coverage_end <= coverage_start, coverage_start outside period_month, or coverage_end later than the first day of the second month after period_month"
  - id: ERR_COVERAGE_OVERLAP
    http: 409
    condition: "The new batch's half-open [coverage_start, coverage_end) day interval overlaps that of a non-REVERSED batch of the same ProcessorProgram"
  - id: ERR_PERIOD_LOCKED
    http: 409
    condition: "Posting a batch whose period already has an ISSUED or FINALIZED statement, or reversing a batch whose period already has a FINALIZED statement"
  - id: ERR_RECOUPMENT_WINDOW_INVALID
    http: 422
    condition: "last_recoupment_month earlier than first_recoupment_month, first_recoupment_month earlier than the month of funded_on, or a STRAIGHT_LINE_AMORTIZATION window whose inclusive month count differs from amortization_months"
  - id: ERR_MERCHANT_DATE_OUT_OF_RANGE
    http: 422
    condition: "attrition_date before boarded_on or after the logical clock's current date; reactivation_date before attrition_date or after the logical clock's current date"
  - id: ERR_DEPARTURE_DATE_OUT_OF_RANGE
    http: 422
    condition: "A departure_effective_date earlier than the logical clock's current date on /notice, or a /depart call before the clock has reached departure_effective_date"

  # --- business constraint ---
  - id: ERR_PROGRAM_SUSPENDED
    http: 409
    condition: "Ingesting, appending to, normalizing or posting a batch whose ProcessorProgram.status == SUSPENDED"
  - id: ERR_DUPLICATE_FILE_CHECKSUM
    http: 409
    condition: "file_checksum already used by a ResidualBatch whose state != REVERSED"
  - id: ERR_DUPLICATE_MID
    http: 409
    condition: "mid already used by another Merchant"
  - id: ERR_DUPLICATE_LINE_FOR_MERCHANT
    http: 409
    condition: "A ResidualLine for this (residual_batch_id, merchant_id) pair already exists"
  - id: ERR_LINE_PROGRAM_MISMATCH
    http: 422
    condition: "The line's merchant is boarded on a different ProcessorProgram than the batch"
  - id: ERR_HIERARCHY_CYCLE
    http: 422
    condition: "parent_agent_id is the agent itself or one of its own descendants"
  - id: ERR_HIERARCHY_DEPTH_EXCEEDED
    http: 422
    condition: "The write would give the agent or one of its descendants a hierarchy_depth greater than MAX_HIERARCHY_DEPTH (4)"
  - id: ERR_BATCHES_NOT_POSTED
    http: 409
    condition: "Issuing a statement while a ResidualBatch for the same period_month is still RECEIVED or NORMALIZED"
  - id: ERR_TRANSFER_TARGET_INVALID
    http: 422
    condition: "The portfolio transfer target is the departing agent itself or is not ACTIVE"
  - id: ERR_OVERRIDE_PCT_NOT_MONOTONIC
    http: 422
    condition: "A parent/child edge in which parent.override_pct < max(child.split_pct, child.override_pct)"

  # --- business fiscal ---
  - id: ERR_RECOUPMENT_PCT_EXCEEDS_CAP
    http: 422
    condition: "recoupment_pct greater than MAX_TOTAL_RECOUPMENT_PCT (0.50)"
  - id: ERR_ADVANCE_EXPOSURE_EXCEEDED
    http: 409
    condition: "Outstanding ACTIVE advance principal plus the new principal_cents exceeds max(250000, 6 * Agent.trailing_residual_cents)"
  - id: ERR_BELOW_MIN_PAYOUT
    http: 409
    condition: "Settling a statement whose net_payable_cents is below MIN_PAYOUT_CENTS (2500)"
  - id: ERR_ADJUSTMENT_SIGN_INVALID
    http: 422
    condition: "amount_cents is zero, or its sign contradicts the adjustment kind"
  - id: ERR_CLAWBACK_REVERSAL_EXCEEDS_CLAWBACK
    http: 409
    condition: "A CLAWBACK_REVERSAL amount_cents exceeding the owning Agent's lifetime_clawback_cents"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# -----------------------------------------------------------------------------
roles:

  - name: IsoAdmin
    description: "ISO back-office operator: owns the master data — programs, agents, hierarchy, merchants, advances, portfolio transfers and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /processor-programs"
      - "PATCH /processor-programs/{id}"
      - "POST /processor-programs/{id}/suspend"
      - "POST /processor-programs/{id}/reinstate"
      - "POST /agents"
      - "PATCH /agents/{id}"
      - "POST /agents/{id}/notice"
      - "POST /agents/{id}/rescind-notice"
      - "POST /agents/{id}/depart"
      - "POST /agents/{id}/transfer-portfolio"
      - "POST /agents/{id}/advances"
      - "POST /agent-advances/{id}/restructure"
      - "POST /merchants"
      - "PATCH /merchants/{id}"
      - "POST /merchants/{id}/activate"
      - "POST /merchants/{id}/attrite"
      - "POST /merchants/{id}/reactivate"
      - "POST /merchants/{id}/reassign-agent"
    shared_operations:
      - "POST /residual-batches (with ResidualAnalyst)"
      - "POST /residual-batches/{id}/lines (with ResidualAnalyst)"
      - "POST /residual-batches/{id}/normalize (with ResidualAnalyst)"
      - "POST /residual-batches/{id}/recall (with ResidualAnalyst)"
      - "POST /merchants/{id}/chargebacks (with ResidualAnalyst)"
      - "POST /agent-statements/{id}/adjustments (with ResidualAnalyst, ResidualController, Agent)"
      - "POST /statement-adjustments/{id}/resubmit (with ResidualAnalyst, ResidualController, Agent)"
      - "every GET except GET /agent-advances and GET /agent-advances/{id}, which it shares only with ResidualController"

  - name: ResidualAnalyst
    description: "Residual operations analyst: ingests processor files, appends and corrects lines, normalizes, books chargebacks and proposes adjustments. Never posts to the ledger and never moves money."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /residual-batches (with IsoAdmin)"
      - "POST /residual-batches/{id}/lines (with IsoAdmin)"
      - "POST /residual-batches/{id}/normalize (with IsoAdmin)"
      - "POST /residual-batches/{id}/recall (with IsoAdmin)"
      - "POST /merchants/{id}/chargebacks (with IsoAdmin)"
      - "POST /agent-statements/{id}/adjustments (with IsoAdmin, ResidualController, Agent)"
      - "POST /statement-adjustments/{id}/resubmit (with IsoAdmin, ResidualController, Agent)"
      - "read access to programs, agents, merchants, chargebacks, batches, lines, profitability, allocations, statements and adjustments"

  - name: ResidualController
    description: "Residual controller: the only role that moves money — posts and reverses batches, issues, recalls, finalizes, holds and settles statements, and adjudicates adjustments. Bound by segregation of duties: any adjustment this user proposed must be approved by a different user."
    identity: "opaque"
    exclusive_operations:
      - "POST /residual-batches/{id}/post"
      - "POST /residual-batches/{id}/reverse"
      - "POST /agent-statements/{id}/issue"
      - "POST /agent-statements/{id}/recall"
      - "POST /agent-statements/{id}/finalize"
      - "POST /agent-statements/{id}/hold"
      - "POST /agent-statements/{id}/release-hold"
      - "POST /agent-statements/{id}/settle"
      - "POST /statement-adjustments/{id}/review"
      - "POST /statement-adjustments/{id}/request-info"
      - "POST /statement-adjustments/{id}/approve"
      - "POST /statement-adjustments/{id}/reject"
    shared_operations:
      - "POST /agent-statements/{id}/adjustments (with IsoAdmin, ResidualAnalyst, Agent)"
      - "POST /statement-adjustments/{id}/resubmit (with IsoAdmin, ResidualAnalyst, Agent)"
      - "GET /agent-advances and GET /agent-advances/{id} (with IsoAdmin)"
      - "read access to programs, agents, merchants, chargebacks, batches, lines, profitability, allocations, statements and adjustments"

  - name: Agent
    description: "A sales agent acting on its own book of business: reads its own agent record, portfolio summary, merchants, allocations and statements, and may propose or resubmit adjustments against its own statements. X-User-ID is the Agent row's id."
    identity: "entity_backed:Agent"
    exclusive_operations: []
    shared_operations:
      - "GET /agents/{id} restricted to X-User-ID == Agent.id (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "GET /agents/{id}/portfolio-summary restricted to itself (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "GET /merchants and GET /merchants/{id} restricted to owning_agent_id == X-User-ID (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "GET /agent-statements and GET /agent-statements/{id} restricted to agent_id == X-User-ID (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "GET /residual-allocations and GET /residual-allocations/{id} restricted to agent_id == X-User-ID (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "GET /statement-adjustments restricted to its own statements (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "POST /agent-statements/{id}/adjustments against its own statements (with IsoAdmin, ResidualAnalyst, ResidualController)"
      - "POST /statement-adjustments/{id}/resubmit against its own statements (with IsoAdmin, ResidualAnalyst, ResidualController)"
