            - "After activation the identical attest succeeds: RampMilestone.${ms1}.status == ATTESTED and attained == true (120 >= 100)"
            - "IncomeGuarantee.${gar_id}.total_advanced_cents == 800000 after the successful attest (cascade fired)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: template_half_open_adjacency_allowed
        grounds:
          - state_machines.ScheduleTemplate.DRAFT_to_ACTIVE
          - calculations.weekly_capacity_minutes
          - errors[ERR_TEMPLATE_OVERLAP]
        distinguishing_aspect: |
          Half-open minute-interval semantics on the ScheduleTemplate resource: [480,960) and
          [960,1020) share only an endpoint and coexist (adjacency allowed), while [959,1020)
          overlaps by one minute and is rejected. A different resource entity and different
          interval arithmetic than the closed-date-interval campaign-event instance.
        test_recipe:
          setup:
            - "Physician + case; one ACTIVE CLINIC template on weekday 1 covering [480,960)"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Pam", specialty: "ORTHOPEDICS", email: "pam@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 480, end_minute: 960, block_type: "CLINIC" }, as: PracticeManager, captures: { t1: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${t1}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 960, end_minute: 1020, block_type: "CLINIC" }, as: PracticeManager, captures: { t2: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 959, end_minute: 1020, block_type: "CLINIC" }, as: PracticeManager, captures: { t3: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/schedule-templates/${t2}/activate", payload: {}, as: PracticeManager, captures: { t2_st: "$.data.status" } }
            - { call: "POST /onboarding/schedule-templates/${t3}/activate", payload: {}, as: PracticeManager, captures: { err: "$.data.error_id" } }
          assert:
            - "Adjacent block [960,1020) activates: ScheduleTemplate.${t2}.status == ACTIVE (touching at 960 is not an overlap under half-open semantics)"
            - "Block [959,1020) is rejected with error_id == ERR_TEMPLATE_OVERLAP (HTTP 422): one minute of real overlap"
            - "OnboardingCase.${case_id}.weekly_active_minutes == 540 (480 + 60; the rejected template contributes nothing)"

      - name: event_closed_interval_adjacency_conflicts
        grounds:
          - state_machines.CampaignEvent
          - entities.CampaignEvent.fields.start_date
          - entities.CampaignEvent.fields.end_date
          - errors[ERR_EVENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed date-interval semantics on the CampaignEvent resource: [2027-03-10, 2027-03-12]
          and a new event starting 2027-03-12 CONFLICT because both bounds are inclusive
          (adjacency is a collision), whereas starting 2027-03-13 is accepted. This is the
          opposite adjacency treatment from the half-open schedule-template instance, on a
          different resource entity.
        test_recipe:
          setup:
            - "Physician + case; ACTIVE campaign with budget 1000000; existing PLANNED event [2027-03-10, 2027-03-12] costing 600000"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Quin", specialty: "PEDIATRICS", email: "quin@x.com", hire_type: "NEW_GRAD" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns", payload: { onboarding_case_id: "${case_id}", name: "Outreach", budget_cents: 1000000 }, as: PracticeManager, captures: { camp_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns/${camp_id}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "COMMUNITY_TALK", start_date: "2027-03-10", end_date: "2027-03-12", cost_cents: 600000, venue: "Library" }, as: PracticeManager, captures: { ev1: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "OPEN_HOUSE", start_date: "2027-03-12", end_date: "2027-03-13", cost_cents: 100000, venue: "Clinic" }, as: PracticeManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "MEDIA", start_date: "2027-03-13", end_date: "2027-03-14", cost_cents: 300000, venue: "Studio" }, as: PracticeManager, captures: { ev3: "$.data.id" } }
          assert:
            - "Event starting 2027-03-12 (a date the existing event still occupies) is rejected with error_id == ERR_EVENT_WINDOW_OVERLAP"
            - "Event starting 2027-03-13 is created with status PLANNED (first free date after the closed window)"
            - "ReferralCampaign.${camp_id}.spent_cents == 900000 (600000 + 300000; the rejected event contributed nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: campaign_budget_conserved_by_cancel
        grounds:
          - calculations.campaign_spend
          - state_machines.CampaignEvent.PLANNED_to_CANCELLED
          - entities.ReferralCampaign.fields.spent_cents
        distinguishing_aspect: |
          Conserved quantity: campaign budget cents. The forward action (event create debits
          cost_cents) paired with its compensating action (cancel refunds exactly cost_cents)
          leaves spent_cents identical to its pre-create value; the invariant spent_cents ==
          sum(cost of events with status in {PLANNED, HELD}) holds after every step. A different
          conserved quantity (marketing budget) than the guarantee-ledger instance.
        test_recipe:
          setup:
            - "Physician + case; ACTIVE campaign with budget_cents 1000000"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Raj", specialty: "INTERNAL_MEDICINE", email: "raj@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns", payload: { onboarding_case_id: "${case_id}", name: "Q3", budget_cents: 1000000 }, as: PracticeManager, captures: { camp_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns/${camp_id}/activate", payload: {}, as: PracticeManager }
          trigger:
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "REFERRAL_DINNER", start_date: "2027-04-05", end_date: "2027-04-05", cost_cents: 400000, venue: "Bistro" }, as: PracticeManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "MEDIA", start_date: "2027-04-10", end_date: "2027-04-11", cost_cents: 250000, venue: "Studio" }, as: PracticeManager, captures: { ev2: "$.data.id" } }
            - { call: "GET /onboarding/referral-campaigns/${camp_id}", payload: {}, as: PracticeManager, captures: { spent_mid: "$.data.spent_cents" } }
            - { call: "POST /onboarding/campaign-events/${ev1}/cancel", payload: {}, as: PracticeManager, captures: { ev1_st: "$.data.status" } }
            - { call: "GET /onboarding/referral-campaigns/${camp_id}", payload: {}, as: PracticeManager, captures: { spent_end: "$.data.spent_cents" } }
          assert:
            - "After two creates: spent_cents == 650000 (400000 + 250000)"
            - "After cancelling event ${ev1}: event status == CANCELLED and spent_cents == 250000 (exact refund of 400000, not prorated)"
            - "Invariant holds at each step: spent_cents == sum of cost_cents over events with status in {PLANNED, HELD}"

      - name: guarantee_outstanding_conserved_by_repayments
        grounds:
          - calculations.income_guarantee_draw
          - entities.IncomeGuarantee.fields.outstanding_balance_cents
          - errors[ERR_REPAYMENT_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: |
          Conserved quantity: guarantee exposure cents. The forward action (milestone attestation
          advances an 800000 draw) paired with compensating repayments (300000 then 400000) plus
          the earned forgiveness (100000) returns outstanding_balance_cents to 0; the invariant
          outstanding == max(0, total_advanced_cents - total_repaid_cents -
          forgiveness_accrued_cents) holds after every step. A different conserved quantity
          (guarantee ledger) than the campaign-budget instance.
        test_recipe:
          setup:
            - "Executed offer pipeline; guarantee ACTIVE at clock 2027-06-05"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Sam", specialty: "FAMILY_MEDICINE", email: "sam@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=1", payload: {}, as: PracticeManager, captures: { ms1: "$.data[0].id" } }
          trigger:
            - { call: "POST /onboarding/ramp-milestones/${ms1}/report", payload: { actual_wrvu: 120, collections_cents: 1200000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/income-guarantees/${gar_id}", payload: {}, as: FinanceAnalyst, captures: { outst_1: "$.data.outstanding_balance_cents" } }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/repayments", payload: { amount_cents: 300000 }, as: FinanceAnalyst, captures: { outst_2: "$.data.outstanding_balance_cents" } }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/repayments", payload: { amount_cents: 400000 }, as: FinanceAnalyst, captures: { outst_3: "$.data.outstanding_balance_cents" } }
          assert:
            - "After attest (forward action): outstanding_balance_cents == 700000 (800000 advanced - 100000 forgiveness)"
            - "After repayment 300000: outstanding_balance_cents == 400000"
            - "After repayment 400000 (compensating the remainder): outstanding_balance_cents == 0"
            - "Invariant holds at each step: outstanding == max(0, 800000 - total_repaid_cents - 100000)"
