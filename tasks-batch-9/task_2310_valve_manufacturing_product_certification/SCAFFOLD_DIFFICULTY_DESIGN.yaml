      - name: qualification_closed_windows_collide_on_touching_endpoints
        grounds:
          - validations[priority=61]
          - state_machines.FoundryQualification.window_uniqueness
          - endpoints[POST /valve-mfg/foundry-qualifications]
        distinguishing_aspect: |
          Different resource entity (a foundry's process/grade qualification slot, not a test bench) and the
          opposite interval semantics: validity is a CLOSED interval [valid_from, valid_until], so a window
          whose valid_from equals the incumbent's valid_until DOES collide, while the next day is accepted.
        test_recipe:
          setup:
            - "A foundry with one CASTING/CF8M qualification valid from 2026-01-01 to 2026-06-30 inclusive."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-15", name: "Omicron Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q1_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q1_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
          trigger:
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-06-30T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { err: $.data.error_id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q2_id: $.data.id }
          assert:
            - "${err} == ERR_QUALIFICATION_WINDOW_OVERLAP"
            - "HTTP status == 409"
            - "FoundryQualification.${q2_id}.valid_from == 2026-07-01T00:00:00Z"
            - "FoundryQualification.${q2_id}.status == PENDING"
            - "FoundryQualification.${q1_id}.status == QUALIFIED"

  - rule_id: compensating_invariant
    instances:
      - name: component_void_returns_lot_mass_while_scrap_retains_it
        grounds:
          - calculations.heat_lot_mass_balance
          - state_machines.Component.CREATED_to_SCRAPPED
          - state_machines.Component.CREATED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: heat-lot mass in kilograms. qty_received_kg always equals available + committed +
          scrapped; SCRAP moves mass from committed to scrapped (no return) while VOID is the compensating
          disposition that returns mass to available. Both dispositions are exercised against the same lot.
        test_recipe:
          setup:
            - "A RELEASED heat lot of 500.000 kg from a QUALIFIED CASTING/CF8M foundry."
            - "Two components off that lot: 120.500 kg and 60.250 kg, so committed is 180.750 and available 319.250."
            - "The 60.250 kg component has been SCRAPPED, leaving committed 120.500, scrapped 60.250, available 319.250."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-16", name: "Pi Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-MASSBAL", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-1601", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-1601", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c1_id: $.data.id }
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BONNET", net_weight_kg: 60.250 }
              as: ProcurementSpecialist
              captures: { c2_id: $.data.id }
            - call: "POST /valve-mfg/components/${c2_id}/dispositions"
              payload: { action: "SCRAP" }
              as: ProcurementSpecialist
          trigger:
            - call: "POST /valve-mfg/components/${c1_id}/dispositions"
              payload: { action: "VOID" }
              as: ProcurementSpecialist
          assert:
            - "Component.${c1_id}.status == VOIDED"
            - "Component.${c2_id}.status == SCRAPPED"
            - "HeatLot.${l_id}.qty_committed_kg == 0.000"
            - "HeatLot.${l_id}.qty_scrapped_kg == 60.250"
            - "HeatLot.${l_id}.qty_available_kg == 439.750"
            - "HeatLot.${l_id}.qty_received_kg == 500.000"
            - "invariant: 439.750 + 0.000 + 60.250 == 500.000"

      - name: order_cancellation_conserves_money_via_credit_note
        grounds:
          - calculations.eto_order_price_cents
          - state_machines.EngineeredOrder.IN_PRODUCTION_to_CANCELLED
          - entities.EngineeredOrder.credit_issued_cents
        distinguishing_aspect: |
          Conserved quantity: money in integer cents. gross_quoted_cents is frozen at APPROVE and cancellation
          never changes it — the retained share and the credit note must add back to it exactly, with no
          rounding drift, at the IN_PRODUCTION retention rate of 0.35.
        test_recipe:
          setup:
            - "A RELEASED BALL model with no special services required."
            - "An order for 4 units at 1,500,000 cents with expedite_requested true and a 7,000,000 cent credit limit."
            - "Priced at APPROVE: subtotal 6,000,000 -> discount tier 0.06 -> 360,000 -> base 5,640,000 -> expedite 451,200 -> gross 6,091,200."
            - "The order is released to production, so the cancellation retention rate is 0.35."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-MONEY", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-MONEY", model_id: "${m_id}", ordered_qty: 4, unit_price_cents: 1500000, customer_credit_limit_cents: 7000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "VENDOR_MEASURED", expedite_requested: true }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "APPROVE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders/${o_id}/lifecycle-actions"
              payload: { action: "RELEASE_TO_PRODUCTION" }
              as: ProductEngineer
          trigger:
            - call: "POST /valve-mfg/engineered-orders/${o_id}/lifecycle-actions"
              payload: { action: "CANCEL" }
              as: ProductEngineer
          assert:
            - "EngineeredOrder.${o_id}.status == CANCELLED"
            - "EngineeredOrder.${o_id}.gross_quoted_cents == 6091200"
            - "EngineeredOrder.${o_id}.net_billable_cents == 2131920"
            - "EngineeredOrder.${o_id}.credit_issued_cents == 3959280"
            - "invariant: 2131920 + 3959280 == 6091200"
            - "EngineeredOrder.${o_id}.net_billable_cents != 609120"

      - name: service_abort_restores_repair_kit_stock_unlike_completion
        grounds:
          - state_machines.ValveUnit.service_status_PARTS_RESERVED_to_NONE
          - state_machines.ValveUnit.service_status_OPEN_to_PARTS_RESERVED
          - entities.ValveModel.repair_kit_stock_qty
          - entities.ValveUnit.reserved_kit_qty
        distinguishing_aspect: |
          Conserved quantity: repair-kit units on hand (an integer stock count, neither mass nor money).
          RESERVE_KIT holds stock off the model and ABORT is the compensating action that returns it exactly,
          whereas COMPLETE would consume it — so the conservation law holds only along the abort path.
        test_recipe:
          setup:
            - "A RELEASED BALL model with repair_kit_stock_qty 5 and a GRANTED license scoped to BALL."
            - "A unit certified by qm-4 and advanced to PACKAGED, with a field-service case OPEN and a 2-unit kit reserved, leaving model stock 3."
