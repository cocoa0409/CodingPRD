            - "LicenseApplication.${app_tx}.status == UNDER_REVIEW, decision_at is null, required_net_worth_cents == 100000000"
            - "GET /state-licenses?application_id=${app_tx} returns 0 rows"

      - name: certification_after_the_forty_five_day_window_rejects
        claim_type: Violation → Error
        grounds:
          - validations[priority=92]
          - errors[ERR_CERTIFICATION_WINDOW_CLOSED]
        distinguishing_aspect: "The certification window is coverage_period_end + 45 days: a period ending 2026-06-15 closes on 2026-07-30, so certifying at the default clock 2026-08-01 fails with ERR_CERTIFICATION_WINDOW_CLOSED (409) even though the certifier differs from the preparer and the segregation rule is satisfied."
        test_recipe:
          setup:
            - "One licensee with 4000000 of CASH."
            - "A test over 2026-05-16..2026-06-15 prepared by user-co-1; the clock is left at the default 2026-08-01."
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "First Republic Trust", book_value_cents: 4000000, market_value_cents: 4000000 }
              as: ComplianceOfficer
              as_user_id: "user-co-1"
            - call: "GET /licensees/${lic_id}"
              as: ComplianceOfficer
              as_user_id: "user-co-1"
              captures: { lic_v: "$.data.version" }
            - call: "POST /permissible-investment-tests"
              payload: { licensee_id: "${lic_id}", coverage_period_start: "2026-05-16T00:00:00Z", coverage_period_end: "2026-06-15T00:00:00Z", method: "ELIGIBLE_MARKET", expected_licensee_version: "${lic_v}" }
              as: ComplianceOfficer
              as_user_id: "user-co-1"
              captures: { test_id: "$.data.id" }
            - call: "POST /permissible-investment-tests/${test_id}/prepare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-co-1"
          trigger:
            - call: "POST /permissible-investment-tests/${test_id}/certify"
              payload: { attestation_note: "Late certification attempt." }
              as: ChiefComplianceOfficer
              as_user_id: "user-cco-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id == ERR_CERTIFICATION_WINDOW_CLOSED"
            - "error_id != ERR_SEGREGATION_OF_DUTIES (user-cco-1 differs from prepared_by_user_id user-co-1, so the priority-70 rule is satisfied and priority 92 is the first violation)"
            - "PermissibleInvestmentTest.${test_id}.status == PREPARED, certified_at is null, result == PASS"
            - "Licensee.${lic_id}.consecutive_failed_test_count == 0"

      - name: bond_one_cent_short_of_the_requirement_rejects_then_the_exact_amount_passes
