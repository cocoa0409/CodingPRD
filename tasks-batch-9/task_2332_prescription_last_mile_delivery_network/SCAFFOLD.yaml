# =============================================================================
# task_2332 — Prescription Last-Mile Delivery Network (ScriptDrop)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: |
  2332. Prescription Last-Mile Delivery Network (ScriptDrop): pharmacy order intake and delivery-window selection, courier network routing across on-demand and scheduled couriers, cold-chain and controlled-handling flagging with signature requirements, patient identity verification and proof-of-delivery capture, failed-delivery re-attempt ladder and pharmacy return, delivery-fee payer mix (patient, pharmacy, health plan grant), HIPAA-limited data exposure to couriers, delivery exception and reship reconciliation

domain_name: prescription-last-mile-delivery
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys
  # (`/deliveries`, `/couriers`, `/pharmacy-orders`, ...). No ownership nesting
  # in URL paths; the only nested reads are HIPAA/audit projections.

  state_machine_shape: parallel
  # Delivery carries two independent state dimensions on the same row
  # (custody_status × settlement_status). Delivery.custody_status additionally
  # cycles (OUT_FOR_DELIVERY → ATTEMPT_FAILED → OUT_FOR_DELIVERY), ExceptionCase
  # forks and re-joins (OPEN → UNDER_REVIEW → {RESHIP_AUTHORIZED, CREDIT_ISSUED,
  # DENIED} → CLOSED), PharmacyOrder cycles (READY ⇄ INTAKE, DISPATCHED → READY),
  # and DeliveryWindow / PlanGrant / Courier each cycle between two states.

  relationship_patterns:
    - one_to_many          # Pharmacy → PharmacyOrder, Delivery → DeliveryAttempt
    - self_referential     # Delivery.reship_of_delivery_id -> Delivery.id
    - cross_aggregate      # FeeAllocation spans Delivery and PlanGrant
    - polymorphic_none

  role_model: segregation_of_duties
  # NetworkOps is one role but two distinct ops users are required across the
  # exception-adjudication chain: the ops user who opened a case (or who revoked
  # a courier assignment on that delivery) cannot adjudicate it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HealthPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Payer display name
        constraints: 1..120 chars
      - name: payer_type
        type: enum
        source: input
        description: Payer class; MEDICAID triggers the zero-patient-cost mandate
        constraints: "one of {COMMERCIAL, MEDICAID, MEDICARE_ADVANTAGE}"
      - name: member_cost_share_pct
        type: number
        source: input
        description: Fraction of each delivery-fee line item borne by the member before grant subsidy
        constraints: "0.00 <= value <= 1.00, exactly 2 decimals"

  - name: PlanGrant
    parent: null
    common_fields: true
    fields:
      - name: health_plan_id
        type: string
        source: input
        description: FK -> HealthPlan.id; owner of the grant pool
      - name: benefit_year
        type: integer
        source: input
        description: Calendar year the grant funds; matched against the UTC year of DeliveryWindow.window_start
        constraints: "2026..2030"
      - name: grant_budget_cents
        type: integer
        source: input
        description: Total pool funded by the plan for delivery-fee subsidy
        constraints: "> 0"
      - name: per_delivery_cap_cents
        type: integer
        source: input
        description: Maximum subsidy this grant may commit to a single Delivery
        constraints: ">= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of FeeAllocation.plan_grant_cents over allocations with status ACTIVE and variant PROVISIONAL for this grant
        default: 0
      - name: consumed_cents
        type: integer
        source: computed
        description: Sum of FeeAllocation.plan_grant_cents over allocations with status ACTIVE and variant FINAL for this grant
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: grant_budget_cents - committed_cents - consumed_cents
        default: 0
      - name: status
        type: enum
        source: computed
        description: ACTIVE while remaining_cents > 0; EXHAUSTED at remaining_cents == 0; returns to ACTIVE when a release raises remaining_cents above 0
        default: ACTIVE
        constraints: "one of {ACTIVE, EXHAUSTED}"

  - name: Pharmacy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Dispensing pharmacy name
        constraints: 1..120 chars
      - name: state_code
        type: string
        source: input
        description: Two-letter US state of the dispensing site
        constraints: exactly 2 uppercase letters
      - name: cold_chain_certified
        type: boolean
        source: input
        description: Whether the site may release cold-chain product to couriers
        default: false
      - name: controlled_license_tier
        type: enum
        source: input
        description: Highest controlled schedule the site may dispense for delivery
        default: NONE
        constraints: "one of {NONE, CIII_V, CII_V}"
      - name: return_window_minutes
        type: integer
        source: input
        description: Minutes allowed between a Delivery entering RETURN_PENDING and the pharmacy confirming physical receipt
        default: 240
        constraints: "60..1440"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name used for door-step identity verification
        constraints: 1..120 chars
      - name: date_of_birth
        type: string
        source: input
        description: YYYY-MM-DD, matched during DOB_MATCH verification
        constraints: ISO calendar date
      - name: phone_last4
        type: string
        source: input
        description: Last four digits of the contact phone, the only phone data ever exposed to couriers
        constraints: exactly 4 digits
      - name: address_line
        type: string
        source: input
        description: Street address handed to the courier
        constraints: 1..200 chars
      - name: zone_code
        type: string
        source: input
        description: Serviced zone natural key; must equal an existing DeliveryZone.zone_code
        constraints: 2..12 chars
      - name: hipaa_consent_status
        type: enum
        source: input
        description: Authorization for third-party courier disclosure
        default: GRANTED
        constraints: "one of {GRANTED, REVOKED}"
      - name: masked_name
        type: string
        source: computed
        description: HIPAA-limited projection of full_name — first character of each whitespace-separated token, remaining characters replaced by '*' (e.g. "Dana Reyes" -> "D*** R****")

  - name: DeliveryZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Unique zone natural key
        constraints: 2..12 chars, unique across DeliveryZone
      - name: distance_band_miles
        type: number
        source: input
        description: Billable distance band for the zone, one decimal place
        constraints: "0.1 <= value <= 60.0"
      - name: base_fee_cents
        type: integer
        source: input
        description: Flat per-delivery line item
        constraints: ">= 0"
      - name: per_mile_cents
        type: integer
        source: input
        description: Rate multiplied by ceil(distance_band_miles) for the mileage line
        constraints: ">= 0"
      - name: cold_pack_fee_cents
        type: integer
        source: input
        description: Charge per cold pack consumed
        constraints: ">= 0"
      - name: controlled_handling_fee_cents
        type: integer
        source: input
        description: Charge applied once when the order carries a controlled schedule
        constraints: ">= 0"
      - name: after_hours_fee_cents
        type: integer
        source: input
        description: Charge applied once when the selected window is after hours
        constraints: ">= 0"
      - name: cold_chain_supported
        type: boolean
        source: input
        description: Whether cold-chain product may be delivered into this zone
        default: true
      - name: controlled_delivery_allowed
        type: boolean
        source: input
        description: Whether controlled schedules may be delivered into this zone
        default: true

  - name: DeliveryWindow
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> DeliveryZone.id; zone this window serves
      - name: courier_mode
        type: enum
        source: input
        description: Courier network the window draws from
        constraints: "one of {ON_DEMAND, SCHEDULED}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the promised delivery interval (UTC)
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the promised delivery interval (UTC); interval semantics are half-open [window_start, window_end)
      - name: capacity_slots
        type: integer
        source: input
        description: Aggregate number of Deliveries the window may hold
        constraints: ">= 1"
      - name: reserved_slots
        type: integer
        source: computed
        description: Count of Deliveries with window_id == this window and custody_status IN {QUEUED, ASSIGNED, PICKED_UP, OUT_FOR_DELIVERY, ATTEMPT_FAILED}
        default: 0
      - name: available_slots
        type: integer
        source: computed
        description: capacity_slots - reserved_slots
      - name: is_after_hours
        type: boolean
        source: computed
        description: True when the UTC hour of window_start is >= 20 or < 6
      - name: status
        type: enum
        source: computed
        description: OPEN while reserved_slots < capacity_slots; FULL at reserved_slots == capacity_slots; CLOSED once a routing run observes clock >= window_end
        default: OPEN
        constraints: "one of {OPEN, FULL, CLOSED}"

  - name: PharmacyOrder
    parent: null
    common_fields: true
    fields:
      - name: pharmacy_id
        type: string
        source: input
        description: FK -> Pharmacy.id; dispensing site and owning tenant
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; recipient
      - name: health_plan_id
        type: string
        source: input
        description: FK -> HealthPlan.id; payer pinned at intake, null for self-pay
        default: null
      - name: rx_line_count
        type: integer
        source: input
        description: Number of prescription lines in the bag
        constraints: ">= 1"
      - name: cold_chain_required
        type: boolean
        source: input
        description: Whether the bag needs a cold pack and sealed handoff
        default: false
      - name: controlled_schedule
        type: enum
        source: input
        description: Highest controlled schedule in the bag
        default: NONE
        constraints: "one of {NONE, CIII, CII}"
      - name: total_rx_value_cents
        type: integer
        source: input
        description: Retail value of the bag, used by the signature threshold
        constraints: ">= 0"
      - name: signature_required
        type: boolean
        source: computed
        description: True when cold_chain_required, or controlled_schedule != NONE, or total_rx_value_cents >= 25000
      - name: required_id_verification
        type: enum
        source: computed
        description: GOVT_ID_SCAN when controlled_schedule == CII; PHOTO_ID when CIII; DOB_MATCH otherwise
        constraints: "one of {DOB_MATCH, PHOTO_ID, GOVT_ID_SCAN}"
      - name: hold_count
        type: integer
        source: computed
        description: Number of READY -> INTAKE reverts performed on this order
        default: 0
      - name: status
        type: enum
        source: computed
        description: Intake lifecycle; see §1.2
        default: INTAKE
        constraints: "one of {INTAKE, READY, DISPATCHED, CLOSED, RETURNED_TO_STOCK}"

  - name: Courier
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Courier display name shown on the patient tracker
        constraints: 1..80 chars
      - name: mode
        type: enum
        source: input
        description: Network the courier belongs to; must equal the window's courier_mode to be eligible
        constraints: "one of {ON_DEMAND, SCHEDULED}"
      - name: served_zone_codes
        type: array
        source: input
        description: DeliveryZone.zone_code values the courier serves
        constraints: non-empty array of 2..12 char strings
      - name: cold_chain_equipped
        type: boolean
        source: input
        description: Carries a validated cold box
        default: false
      - name: controlled_certified
        type: boolean
        source: input
        description: Cleared to transport controlled schedules
        default: false
      - name: status
        type: enum
        source: computed
        description: Availability lifecycle; see §1.2
        default: OFFLINE
        constraints: "one of {OFFLINE, AVAILABLE, ON_ROUTE, SUSPENDED}"
      - name: active_delivery_count
        type: integer
        source: computed
        description: Count of CourierAssignment rows for this courier with status ACCEPTED
        default: 0
      - name: attempt_total_count
        type: integer
        source: computed
        description: Count of DeliveryAttempt rows with courier_id == this courier
        default: 0
      - name: delivered_count
        type: integer
        source: computed
        description: Count of DeliveryAttempt rows with courier_id == this courier and outcome == DELIVERED
        default: 0
      - name: rolling_reliability_score
        type: number
        source: computed
        description: Decay-weighted score over the courier's last 3 attempts; ranking key for courier selection
        default: 100.00
      - name: lifetime_reliability_score
        type: number
        source: computed
        description: Undecayed delivered/total score over all attempts; gates eligibility and auto-suspension
        default: 100.00

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> PharmacyOrder.id; bag being moved
      - name: window_id
        type: string
        source: input
        description: FK -> DeliveryWindow.id; reserved promise interval
      - name: courier_id
        type: string
        source: computed
        description: FK -> Courier.id; courier holding the ACCEPTED assignment, null while unassigned
        default: null
      - name: reship_of_delivery_id
        type: string
        source: computed
        description: FK -> Delivery.id; original delivery this reship replaces, null for first-run deliveries
        default: null
      - name: custody_status
        type: enum
        source: computed
        description: Physical custody dimension; evolves independently of settlement_status
        default: QUEUED
        constraints: "one of {QUEUED, ASSIGNED, PICKED_UP, OUT_FOR_DELIVERY, ATTEMPT_FAILED, DELIVERED, RETURN_PENDING, RETURNED, CANCELLED}"
      - name: settlement_status
        type: enum
        source: computed
        description: Money dimension; evolves independently of custody_status
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINALIZED, WAIVED, VOIDED}"
      - name: handling_class
        type: enum
        source: computed
        description: Snapshot of the order's handling flags taken at delivery creation
        constraints: "one of {STANDARD, COLD_CHAIN, CONTROLLED, COLD_CHAIN_CONTROLLED}"
      - name: signature_required
        type: boolean
        source: computed
        description: Snapshot of PharmacyOrder.signature_required at delivery creation
      - name: required_id_verification
        type: enum
        source: computed
        description: Snapshot of PharmacyOrder.required_id_verification at delivery creation
        constraints: "one of {DOB_MATCH, PHOTO_ID, GOVT_ID_SCAN}"
      - name: attempt_count
        type: integer
        source: computed
        description: Count of DeliveryAttempt rows for this delivery
        default: 0
      - name: last_attempt_at
        type: datetime
        source: computed
        description: attempted_at of the most recent DeliveryAttempt, null before the first attempt
        default: null
      - name: excluded_courier_ids
        type: array
        source: computed
        description: Courier ids barred from re-selection on this delivery after DECLINED, EXPIRED or REVOKED assignments
        default: []
      - name: cold_chain_seal_id
        type: string
        source: input
        description: Seal identifier captured at pickup, required when handling_class includes COLD_CHAIN
        default: null
      - name: picked_up_at
        type: datetime
        source: computed
        description: Clock value at the pickup transition, null before pickup
        default: null
      - name: delivered_at
        type: datetime
        source: computed
        description: attempted_at of the DELIVERED attempt, null otherwise
        default: null
      - name: return_due_at
        type: datetime
        source: computed
        description: Clock value at entry into RETURN_PENDING plus Pharmacy.return_window_minutes, null otherwise
        default: null
      - name: fee_subtotal_cents
        type: integer
        source: computed
        description: fee_subtotal_cents of this delivery's FeeAllocation whose status == ACTIVE, 0 when none is ACTIVE
        default: 0

  - name: CourierAssignment
    parent: null
    common_fields: true
    fields:
      - name: delivery_id
        type: string
        source: input
        description: FK -> Delivery.id; delivery being offered
      - name: courier_id
        type: string
        source: computed
        description: FK -> Courier.id; courier the offer was routed to
      - name: mode
        type: enum
        source: computed
        description: Copy of Courier.mode at offer time
        constraints: "one of {ON_DEMAND, SCHEDULED}"
      - name: status
        type: enum
        source: computed
        description: Offer lifecycle; see §1.2
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, EXPIRED, REVOKED, RELEASED, COMPLETED}"
      - name: offered_at
        type: datetime
        source: computed
        description: Clock value when the offer was created
      - name: offer_expires_at
        type: datetime
        source: computed
        description: offered_at plus OFFER_TTL_MINUTES
      - name: responded_at
        type: datetime
        source: computed
        description: Clock value of the accept/decline, null while OFFERED
        default: null
      - name: rank_score
        type: number
        source: computed
        description: Courier.rolling_reliability_score recorded at selection time, or 0.00 for an operator override
        default: 0.00
      - name: revoked_by_ops_user_id
        type: string
        source: computed
        description: X-User-ID of the NetworkOps operator who revoked this offer, null otherwise
        default: null

  - name: DeliveryAttempt
    parent: null
    common_fields: false
    fields:
      - name: delivery_id
        type: string
        source: input
        description: FK -> Delivery.id; delivery attempted
      - name: courier_id
        type: string
        source: computed
        description: FK -> Courier.id; courier who attempted, copied from Delivery.courier_id
      - name: attempt_no
        type: integer
        source: computed
        description: Delivery.attempt_count after this attempt is recorded, starting at 1
      - name: attempted_at
        type: datetime
        source: computed
        description: Clock value when the attempt was recorded
      - name: requested_outcome
        type: enum
        source: input
        description: Outcome the courier reports at the door
        constraints: "one of {DELIVERED, NO_ANSWER, REFUSED, ADDRESS_INVALID, ID_MISMATCH}"
      - name: outcome
        type: enum
        source: computed
        description: Recorded outcome; equals requested_outcome unless the cold-excursion override forces COLD_BREACH
        constraints: "one of {DELIVERED, NO_ANSWER, REFUSED, ADDRESS_INVALID, ID_MISMATCH, COLD_BREACH}"
      - name: id_verification_method
        type: enum
        source: input
        description: Identity proof collected at the door
        constraints: "one of {NONE, DOB_MATCH, PHOTO_ID, GOVT_ID_SCAN}"
      - name: signature_captured
        type: boolean
        source: input
        description: Whether a recipient signature was captured
        default: false
      - name: recipient_relationship
        type: enum
        source: input
        description: Who took possession
        default: SELF
        constraints: "one of {SELF, CAREGIVER, UNATTENDED}"
      - name: pod_photo_ref
        type: string
        source: input
        description: Opaque reference to the proof-of-delivery photo
        default: null
      - name: elapsed_since_pickup_minutes
        type: integer
        source: computed
        description: Whole minutes between Delivery.picked_up_at and attempted_at
      - name: reliability_credit
        type: number
        source: computed
        description: 1.0 for DELIVERED; 0.5 for NO_ANSWER, REFUSED, ADDRESS_INVALID, ID_MISMATCH; 0.0 for COLD_BREACH

  - name: FeeAllocation
    parent: null
    common_fields: true
    fields:
      - name: delivery_id
        type: string
        source: input
        description: FK -> Delivery.id; delivery being priced
      - name: plan_grant_id
        type: string
        source: computed
        description: FK -> PlanGrant.id; grant selected by the subsidy selector, null when no grant is eligible
        default: null
      - name: variant
        type: enum
        source: computed
        description: PROVISIONAL at window reservation, FINAL at settlement
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: status
        type: enum
        source: computed
        description: ACTIVE for the row currently in force; SUPERSEDED when a FINAL row replaces a PROVISIONAL row; VOIDED on cancellation or waiver
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, VOIDED}"
      - name: base_line_cents
        type: integer
        source: computed
        description: DeliveryZone.base_fee_cents
      - name: mileage_line_cents
        type: integer
        source: computed
        description: DeliveryZone.per_mile_cents * ceil(DeliveryZone.distance_band_miles)
      - name: cold_pack_line_cents
        type: integer
        source: computed
        description: Cold-pack charge for this variant, 0 when the delivery is not cold-chain
      - name: controlled_line_cents
        type: integer
        source: computed
        description: Controlled-handling charge, 0 when controlled_schedule is NONE
      - name: after_hours_line_cents
        type: integer
        source: computed
        description: After-hours charge, 0 when DeliveryWindow.is_after_hours is false
      - name: reattempt_line_cents
        type: integer
        source: computed
        description: Re-attempt surcharge, always 0 on PROVISIONAL rows
      - name: fee_subtotal_cents
        type: integer
        source: computed
        description: Sum of the six line items
      - name: cost_share_pct_applied
        type: number
        source: computed
        description: HealthPlan.member_cost_share_pct of the order's payer, or 1.00 for self-pay
      - name: patient_gross_share_cents
        type: integer
        source: computed
        description: Per-line-item member share, each line rounded half-up to whole cents before summation
      - name: plan_grant_cents
        type: integer
        source: computed
        description: Subsidy committed by the selected PlanGrant
      - name: absorption_tier_cents
        type: integer
        source: computed
        description: Pharmacy absorption tier selected from patient_gross_share_cents minus plan_grant_cents
      - name: pharmacy_absorption_cents
        type: integer
        source: computed
        description: Absorption actually applied, capped so patient_payable_cents never drops below 0
      - name: patient_payable_cents
        type: integer
        source: computed
        description: Final patient obligation in cents
      - name: pharmacy_payable_cents
        type: integer
        source: computed
        description: fee_subtotal_cents - plan_grant_cents - patient_payable_cents

  - name: ExceptionCase
    parent: null
    common_fields: true
    fields:
      - name: delivery_id
        type: string
        source: input
        description: FK -> Delivery.id; delivery in exception
      - name: reship_delivery_id
        type: string
        source: computed
        description: FK -> Delivery.id; replacement delivery created by a RESHIP adjudication, null otherwise
        default: null
      - name: exception_type
        type: enum
        source: input
        description: Nature of the exception
        constraints: "one of {COLD_BREACH, ID_MISMATCH_EXHAUSTED, ATTEMPTS_EXHAUSTED, DAMAGED, LOST_IN_TRANSIT, RETURN_OVERDUE}"
      - name: status
        type: enum
        source: computed
        description: Adjudication lifecycle; see §1.2
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, RESHIP_AUTHORIZED, CREDIT_ISSUED, DENIED, CLOSED}"
      - name: opened_by_ops_user_id
        type: string
        source: computed
        description: X-User-ID of the NetworkOps operator who opened the case; null when opened by system cascade, PharmacyOperator or Courier
        default: null
      - name: adjudicated_by_ops_user_id
        type: string
        source: computed
        description: X-User-ID of the NetworkOps operator who adjudicated the case
        default: null
      - name: disposition
        type: enum
        source: computed
        description: Branch taken at adjudication
        default: null
        constraints: "one of {RESHIP, CREDIT, DENY}"
      - name: credit_cents
        type: integer
        source: computed
        description: Delivery fee waived by a CREDIT adjudication, 0 for other dispositions
        default: 0
      - name: notes
        type: string
        source: input
        description: Free-text adjudication note
        default: null

  - name: CourierDataDisclosure
    parent: null
    common_fields: false
    fields:
      - name: delivery_id
        type: string
        source: input
        description: FK -> Delivery.id; delivery whose limited data set was released
      - name: courier_id
        type: string
        source: computed
        description: FK -> Courier.id; recipient of the disclosure, or null when a NetworkOps operator previewed the courier view
        default: null
      - name: disclosed_at
        type: datetime
        source: computed
        description: Clock value at disclosure
      - name: purpose
        type: enum
        source: input
        description: HIPAA purpose-of-use recorded with the disclosure
        default: DELIVERY_EXECUTION
        constraints: "one of {ROUTING, DELIVERY_EXECUTION}"
      - name: fields_disclosed
        type: array
        source: computed
        description: Sorted list of field names released in the courier projection
      - name: redacted_field_count
        type: integer
        source: computed
        description: Count of Delivery/PharmacyOrder/Patient fields withheld from the courier projection
      - name: minimization_profile
        type: enum
        source: computed
        description: Redaction profile applied
        default: COURIER_LIMITED
        constraints: "one of {COURIER_LIMITED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PharmacyOrder
    dimension: status
    initial_state: INTAKE
    terminal_states: [CLOSED, RETURNED_TO_STOCK]
    transitions:
      - from: INTAKE
        to: READY
        trigger: "POST /pharmacy-orders/{id}/mark-ready"
        actor: PharmacyOperator
        preconditions:
          - "order.status == INTAKE"
          - "order.pharmacy_id == X-User-ID"
          - "Patient(order.patient_id).hipaa_consent_status == GRANTED"
          - "Pharmacy(order.pharmacy_id).controlled_license_tier covers order.controlled_schedule: NONE covers only NONE; CIII_V covers {NONE, CIII}; CII_V covers {NONE, CIII, CII}"
          - "if order.cold_chain_required then Pharmacy(order.pharmacy_id).cold_chain_certified == true"
        side_effects:
          - "recompute order.signature_required and order.required_id_verification"
          - "increments PharmacyOrder.version by 1"
      - from: READY
        to: INTAKE
        trigger: "POST /pharmacy-orders/{id}/hold"
        actor: PharmacyOperator
        preconditions:
          - "order.status == READY"
          - "order.pharmacy_id == X-User-ID"
          - "order.hold_count < MAX_ORDER_HOLDS (2)"
          - "no Delivery exists for this order with custody_status NOT IN {CANCELLED, RETURNED, DELIVERED}"
        side_effects:
          - "order.hold_count += 1"
          - "increments PharmacyOrder.version by 1"
        note: "Revision loop; the third hold attempt is rejected with ERR_MAX_HOLDS_EXCEEDED."
      - from: READY
        to: DISPATCHED
        trigger: "system cascade from POST /deliveries (window reservation)"
        actor: system
        preconditions:
          - "order.status == READY"
        side_effects:
          - "increments PharmacyOrder.version by 1"
      - from: DISPATCHED
        to: READY
        trigger: "system cascade from POST /deliveries/{id}/cancel"
        actor: system
        preconditions:
          - "the cancelled delivery is the only Delivery of this order with custody_status NOT IN {CANCELLED}"
        side_effects:
          - "increments PharmacyOrder.version by 1"
        note: "Compensating transition; makes the order re-schedulable and closes the READY -> DISPATCHED -> READY cycle."
      - from: DISPATCHED
        to: CLOSED
        trigger: "system cascade from POST /deliveries/{id}/settle when delivery.custody_status == DELIVERED"
        actor: system
        preconditions:
          - "delivery.custody_status == DELIVERED"
        side_effects:
          - "increments PharmacyOrder.version by 1"
      - from: DISPATCHED
        to: RETURNED_TO_STOCK
        trigger: "POST /deliveries/{id}/confirm-return"
        actor: PharmacyOperator
        preconditions:
          - "delivery.custody_status == RETURN_PENDING"
        side_effects:
          - "increments PharmacyOrder.version by 1"
        note: "Divergent branch from the same DISPATCHED state: CLOSED means the bag reached the patient, RETURNED_TO_STOCK means it came back."

  - entity: Delivery
    dimension: custody_status
    initial_state: QUEUED
    terminal_states: [DELIVERED, RETURNED, CANCELLED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /courier-assignments/{id}/accept"
        actor: Courier
        preconditions:
          - "assignment.status == OFFERED"
          - "assignment.courier_id == X-User-ID"
          - "clock < assignment.offer_expires_at"
          - "Courier(assignment.courier_id).status IN {AVAILABLE, ON_ROUTE}"
        side_effects:
          - "delivery.courier_id := assignment.courier_id"
          - "assignment.status := ACCEPTED, assignment.responded_at := clock"
          - "Courier.active_delivery_count += 1 and Courier.status := ON_ROUTE"
          - "increments Delivery.version by 1"
      - from: ASSIGNED
        to: QUEUED
        trigger: "POST /courier-assignments/{id}/revoke"
        actor: NetworkOps
        preconditions:
          - "assignment.status IN {OFFERED, ACCEPTED}"
          - "delivery.custody_status IN {QUEUED, ASSIGNED}"
        side_effects:
          - "assignment.status := REVOKED, assignment.revoked_by_ops_user_id := X-User-ID"
          - "delivery.excluded_courier_ids += [assignment.courier_id]"
          - "delivery.courier_id := null"
          - "Courier.active_delivery_count -= 1 and Courier.status := AVAILABLE when active_delivery_count reaches 0"
          - "increments Delivery.version by 1"
        note: "Routing override; re-entry into QUEUED closes the QUEUED -> ASSIGNED -> QUEUED cycle and seeds the selector exclusion set."
      - from: ASSIGNED
        to: PICKED_UP
        trigger: "POST /deliveries/{id}/pickup"
        actor: Courier
        preconditions:
          - "delivery.custody_status == ASSIGNED"
          - "delivery.courier_id == X-User-ID"
          - "PharmacyOrder(delivery.order_id).status == DISPATCHED"
          - "if delivery.handling_class IN {COLD_CHAIN, COLD_CHAIN_CONTROLLED} then cold_chain_seal_id is present"
        side_effects:
          - "delivery.picked_up_at := clock, delivery.cold_chain_seal_id := input"
          - "increments Delivery.version by 1"
      - from: PICKED_UP
        to: OUT_FOR_DELIVERY
        trigger: "POST /deliveries/{id}/depart"
        actor: Courier
        preconditions:
          - "delivery.custody_status == PICKED_UP"
          - "delivery.courier_id == X-User-ID"
          - "clock < DeliveryWindow(delivery.window_id).window_end"
          - "DeliveryWindow(delivery.window_id).status != CLOSED"
        side_effects:
          - "increments Delivery.version by 1"
      - from: ATTEMPT_FAILED
        to: OUT_FOR_DELIVERY
        trigger: "POST /deliveries/{id}/depart (re-attempt leg of the ladder)"
        actor: Courier
        preconditions:
          - "delivery.custody_status == ATTEMPT_FAILED"
          - "delivery.courier_id == X-User-ID"
          - "delivery.attempt_count < MAX_DELIVERY_ATTEMPTS (3)"
          - "clock >= delivery.last_attempt_at + REATTEMPT_COOLDOWN_MINUTES_BY_STAGE[delivery.attempt_count]"
          - "clock < DeliveryWindow(delivery.window_id).window_end"
          - "DeliveryWindow(delivery.window_id).status != CLOSED"
        side_effects:
          - "increments Delivery.version by 1"
        note: "Cycle: OUT_FOR_DELIVERY -> ATTEMPT_FAILED -> OUT_FOR_DELIVERY, gated by the per-stage cooldown ladder."
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /deliveries/{id}/attempts with recorded outcome DELIVERED"
        actor: Courier
        preconditions:
          - "delivery.custody_status == OUT_FOR_DELIVERY"
          - "delivery.courier_id == X-User-ID"
          - "if delivery.signature_required then signature_captured == true and recipient_relationship != UNATTENDED"
          - "id_verification_method is at or above delivery.required_id_verification on the ladder NONE < DOB_MATCH < PHOTO_ID < GOVT_ID_SCAN"
          - "NOT (delivery.handling_class IN {COLD_CHAIN, COLD_CHAIN_CONTROLLED} AND elapsed_since_pickup_minutes >= COLD_CHAIN_MAX_EXCURSION_MINUTES (120))"
        side_effects:
          - "DeliveryAttempt row appended with outcome DELIVERED, reliability_credit 1.0"
          - "delivery.attempt_count += 1, delivery.last_attempt_at := clock, delivery.delivered_at := clock"
          - "CourierAssignment(status ACCEPTED) := COMPLETED"
          - "Courier.active_delivery_count -= 1; Courier.status := AVAILABLE when active_delivery_count reaches 0"
          - "recompute Courier.attempt_total_count, delivered_count, rolling_reliability_score, lifetime_reliability_score"
          - "DeliveryWindow.reserved_slots -= 1; window.status := OPEN when it was FULL and clock < window_end"
          - "increments Delivery.version by 1"
      - from: OUT_FOR_DELIVERY
        to: ATTEMPT_FAILED
        trigger: "POST /deliveries/{id}/attempts with recorded outcome IN {NO_ANSWER, REFUSED, ADDRESS_INVALID, ID_MISMATCH} while delivery.attempt_count + 1 < MAX_DELIVERY_ATTEMPTS (3)"
        actor: Courier
        preconditions:
          - "delivery.custody_status == OUT_FOR_DELIVERY"
          - "delivery.courier_id == X-User-ID"
        side_effects:
          - "DeliveryAttempt row appended, reliability_credit 0.5"
          - "delivery.attempt_count += 1, delivery.last_attempt_at := clock"
          - "recompute Courier.attempt_total_count, rolling_reliability_score, lifetime_reliability_score; auto-suspend per §1.3 courier_reliability_scores"
          - "window slot stays reserved (ATTEMPT_FAILED is inside the reserved set)"
          - "increments Delivery.version by 1"
      - from: OUT_FOR_DELIVERY
        to: RETURN_PENDING
        trigger: "POST /deliveries/{id}/attempts with recorded outcome IN {NO_ANSWER, REFUSED, ADDRESS_INVALID, ID_MISMATCH} while delivery.attempt_count + 1 == MAX_DELIVERY_ATTEMPTS (3)"
        actor: Courier
        preconditions:
          - "delivery.custody_status == OUT_FOR_DELIVERY"
          - "delivery.courier_id == X-User-ID"
        side_effects:
          - "DeliveryAttempt row appended, reliability_credit 0.5"
          - "delivery.attempt_count := 3, delivery.return_due_at := clock + Pharmacy(order.pharmacy_id).return_window_minutes"
          - "ladder exhaustion opens an ExceptionCase with exception_type ID_MISMATCH_EXHAUSTED when the third recorded outcome is ID_MISMATCH, otherwise ATTEMPTS_EXHAUSTED, status OPEN, opened_by_ops_user_id null"
          - "CourierAssignment(status ACCEPTED) := RELEASED"
          - "Courier.active_delivery_count -= 1; Courier.status := AVAILABLE when active_delivery_count reaches 0"
          - "DeliveryWindow.reserved_slots -= 1; window.status := OPEN when it was FULL and clock < window_end"
          - "FeeAllocation stays ACTIVE and PROVISIONAL — an exhausted ladder is still billable"
          - "increments Delivery.version by 1"
      - from: OUT_FOR_DELIVERY
        to: RETURN_PENDING
        trigger: "POST /deliveries/{id}/attempts where the cold-excursion override forces outcome COLD_BREACH"
        actor: Courier
        preconditions:
          - "delivery.custody_status == OUT_FOR_DELIVERY"
          - "delivery.courier_id == X-User-ID"
          - "delivery.handling_class IN {COLD_CHAIN, COLD_CHAIN_CONTROLLED}"
          - "elapsed_since_pickup_minutes >= COLD_CHAIN_MAX_EXCURSION_MINUTES (120)"
        side_effects:
          - "DeliveryAttempt row appended with outcome COLD_BREACH (requested_outcome ignored), reliability_credit 0.0"
          - "L1: delivery.custody_status := RETURN_PENDING, delivery.return_due_at := clock + Pharmacy.return_window_minutes, delivery.attempt_count += 1"
          - "L2: because the delivery entered RETURN_PENDING with a cold-chain handling class, an ExceptionCase(exception_type COLD_BREACH, status OPEN, opened_by_ops_user_id null) is opened"
          - "L3: because a COLD_BREACH ExceptionCase was opened, the delivery's ACTIVE FeeAllocation.status := VOIDED and delivery.settlement_status := VOIDED and delivery.fee_subtotal_cents := 0"
          - "L4: because that FeeAllocation was VOIDED, PlanGrant.committed_cents -= voided_allocation.plan_grant_cents and PlanGrant.status := ACTIVE when remaining_cents becomes > 0"
          - "CourierAssignment(status ACCEPTED) := RELEASED; Courier.active_delivery_count -= 1; Courier.status := AVAILABLE when it reaches 0"
          - "DeliveryWindow.reserved_slots -= 1; window.status := OPEN when it was FULL and clock < window_end"
          - "recompute Courier reliability scores; auto-suspend per §1.3 courier_reliability_scores"
          - "increments Delivery.version by 1"
        note: "Depth-4 transitive cascade L1 -> L2 -> L3 -> L4; each link is caused by the previous one, not by the attempt itself."
      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /deliveries/{id}/confirm-return"
        actor: PharmacyOperator
        preconditions:
          - "delivery.custody_status == RETURN_PENDING"
          - "PharmacyOrder(delivery.order_id).pharmacy_id == X-User-ID"
        side_effects:
          - "PharmacyOrder.status := RETURNED_TO_STOCK"
          - "increments Delivery.version by 1"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /deliveries/{id}/cancel"
        actor: PharmacyOperator | Patient
        preconditions:
          - "delivery.custody_status IN {QUEUED, ASSIGNED}"
          - "acting PharmacyOperator owns PharmacyOrder.pharmacy_id, or acting Patient equals PharmacyOrder.patient_id"
        side_effects:
          - "DeliveryWindow.reserved_slots -= 1; window.status := OPEN when it was FULL and clock < window_end"
          - "delivery's ACTIVE FeeAllocation.status := VOIDED; delivery.settlement_status := VOIDED; delivery.fee_subtotal_cents := 0"
          - "PlanGrant.committed_cents -= voided_allocation.plan_grant_cents; PlanGrant.status := ACTIVE when remaining_cents becomes > 0"
          - "any CourierAssignment with status IN {OFFERED, ACCEPTED} := REVOKED with revoked_by_ops_user_id null; Courier.active_delivery_count -= 1 for an ACCEPTED one; Courier.status := AVAILABLE when it reaches 0"
          - "PharmacyOrder.status := READY"
          - "increments Delivery.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /deliveries/{id}/cancel"
        actor: PharmacyOperator | Patient
        preconditions:
          - "delivery.custody_status IN {QUEUED, ASSIGNED}"
        side_effects:
          - "same compensating set as QUEUED -> CANCELLED"
          - "increments Delivery.version by 1"

  - entity: Delivery
    dimension: settlement_status
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, WAIVED, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /deliveries/{id}/settle"
        actor: NetworkOps
        preconditions:
          - "delivery.settlement_status == PROVISIONAL"
          - "delivery.custody_status IN {DELIVERED, RETURNED}"
          - "no ExceptionCase for this delivery has status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "existing PROVISIONAL FeeAllocation.status := SUPERSEDED and its plan_grant_cents is released from PlanGrant.committed_cents"
          - "new FeeAllocation(variant FINAL, status ACTIVE) computed per §1.3 delivery_fee_subtotal variant FINAL"
          - "PlanGrant.consumed_cents += final_allocation.plan_grant_cents; PlanGrant.status recomputed"
          - "delivery.fee_subtotal_cents := final_allocation.fee_subtotal_cents"
          - "PharmacyOrder.status := CLOSED when delivery.custody_status == DELIVERED"
          - "increments Delivery.version by 1"
        note: "Money dimension advances independently of custody_status, which stays DELIVERED or RETURNED."
      - from: PROVISIONAL
        to: WAIVED
        trigger: "system cascade from POST /exception-cases/{id}/adjudicate with disposition CREDIT"
        actor: system
        preconditions:
          - "delivery.settlement_status == PROVISIONAL"
        side_effects:
          - "ACTIVE FeeAllocation.status := VOIDED; delivery.fee_subtotal_cents := 0"
          - "PlanGrant.committed_cents -= voided_allocation.plan_grant_cents; PlanGrant.status := ACTIVE when remaining_cents becomes > 0"
          - "ExceptionCase.credit_cents := voided_allocation.fee_subtotal_cents"
          - "increments Delivery.version by 1"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system cascade from delivery cancellation or from a COLD_BREACH attempt"
        actor: system
        preconditions:
          - "delivery.settlement_status == PROVISIONAL"
        side_effects:
          - "ACTIVE FeeAllocation.status := VOIDED; PlanGrant.committed_cents released; delivery.fee_subtotal_cents := 0"
          - "increments Delivery.version by 1"

  - entity: Courier
    dimension: status
    initial_state: OFFLINE
    terminal_states: []
    transitions:
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /couriers/{id}/status with target_status AVAILABLE"
        actor: Courier
        preconditions:
          - "courier.status == OFFLINE"
          - "courier.id == X-User-ID"
        side_effects:
          - "increments Courier.version by 1"
      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /couriers/{id}/status with target_status OFFLINE"
        actor: Courier
        preconditions:
          - "courier.status == AVAILABLE"
          - "courier.active_delivery_count == 0"
        side_effects:
          - "increments Courier.version by 1"
        note: "Cycle OFFLINE -> AVAILABLE -> OFFLINE."
      - from: AVAILABLE
        to: ON_ROUTE
        trigger: "system cascade from POST /courier-assignments/{id}/accept"
        actor: system
        preconditions:
          - "courier.status == AVAILABLE"
        side_effects:
          - "courier.active_delivery_count += 1"
          - "increments Courier.version by 1"
        note: "A courier already ON_ROUTE may accept a further leg whose buffered interval does not touch an existing one; that acceptance only increments active_delivery_count and leaves status ON_ROUTE, so temporal non-overlap — not the status flag — is what bounds a courier's concurrent load."
      - from: ON_ROUTE
        to: AVAILABLE
        trigger: "system cascade when the courier's last ACCEPTED assignment leaves ACCEPTED (COMPLETED, RELEASED or REVOKED)"
        actor: system
        preconditions:
          - "courier.active_delivery_count reaches 0"
        side_effects:
          - "increments Courier.version by 1"
        note: "Cycle AVAILABLE -> ON_ROUTE -> AVAILABLE."
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "POST /couriers/{id}/status with target_status SUSPENDED, or system cascade from an attempt that drops lifetime_reliability_score below COURIER_MIN_LIFETIME_SCORE"
        actor: NetworkOps | system
        preconditions:
          - "courier.status IN {OFFLINE, AVAILABLE, ON_ROUTE}"
        side_effects:
          - "courier is removed from the selector candidate set for all future dispatches"
          - "increments Courier.version by 1"
      - from: ON_ROUTE
        to: SUSPENDED
        trigger: "system cascade from an attempt that drops lifetime_reliability_score below COURIER_MIN_LIFETIME_SCORE while the courier still holds ACCEPTED work"
        actor: system
        preconditions:
          - "courier.attempt_total_count >= COURIER_SCORE_MIN_ATTEMPTS (3)"
          - "courier.lifetime_reliability_score < COURIER_MIN_LIFETIME_SCORE (60.00)"
        side_effects:
          - "in-flight ACCEPTED assignments are left untouched so the bag is not abandoned"
          - "increments Courier.version by 1"
      - from: SUSPENDED
        to: AVAILABLE
        trigger: "POST /couriers/{id}/status with target_status AVAILABLE"
        actor: NetworkOps
        preconditions:
          - "courier.status == SUSPENDED"
          - "acting role is NetworkOps (a Courier cannot lift its own suspension)"
        side_effects:
          - "increments Courier.version by 1"
        note: "Reinstatement closes the AVAILABLE -> SUSPENDED -> AVAILABLE cycle."

  - entity: CourierAssignment
    dimension: status
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, REVOKED, RELEASED, COMPLETED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /courier-assignments/{id}/accept"
        actor: Courier
        preconditions:
          - "assignment.status == OFFERED"
          - "assignment.courier_id == X-User-ID"
          - "clock < assignment.offer_expires_at"
          - "Courier.status IN {AVAILABLE, ON_ROUTE}"
          - "Delivery.custody_status == QUEUED"
        side_effects:
          - "Delivery.custody_status := ASSIGNED; Delivery.courier_id := courier"
          - "Courier.status := ON_ROUTE; Courier.active_delivery_count += 1"
          - "increments CourierAssignment.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /courier-assignments/{id}/decline"
        actor: Courier
        preconditions:
          - "assignment.status == OFFERED"
          - "assignment.courier_id == X-User-ID"
        side_effects:
          - "Delivery.excluded_courier_ids += [courier_id]; Delivery.custody_status stays QUEUED"
          - "increments CourierAssignment.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /routing-runs (sweep)"
        actor: NetworkOps
        preconditions:
          - "clock >= assignment.offer_expires_at"
        side_effects:
          - "Delivery.excluded_courier_ids += [courier_id]"
          - "increments CourierAssignment.version by 1"
      - from: OFFERED
        to: REVOKED
        trigger: "POST /courier-assignments/{id}/revoke"
        actor: NetworkOps
        preconditions:
          - "assignment.status IN {OFFERED, ACCEPTED}"
        side_effects:
          - "assignment.revoked_by_ops_user_id := X-User-ID"
          - "Delivery.excluded_courier_ids += [courier_id]"
          - "increments CourierAssignment.version by 1"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /courier-assignments/{id}/revoke"
        actor: NetworkOps
        preconditions:
          - "assignment.status IN {OFFERED, ACCEPTED}"
          - "Delivery.custody_status IN {QUEUED, ASSIGNED}"
        side_effects:
          - "assignment.revoked_by_ops_user_id := X-User-ID"
          - "Delivery.custody_status := QUEUED; Delivery.courier_id := null"
          - "Courier.active_delivery_count -= 1; Courier.status := AVAILABLE when it reaches 0"
          - "increments CourierAssignment.version by 1"
      - from: ACCEPTED
        to: RELEASED
        trigger: "system cascade when the delivery enters RETURN_PENDING"
        actor: system
        preconditions:
          - "Delivery.custody_status == RETURN_PENDING"
        side_effects:
          - "Courier.active_delivery_count -= 1; Courier.status := AVAILABLE when it reaches 0"
          - "increments CourierAssignment.version by 1"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system cascade when the delivery enters DELIVERED"
        actor: system
        preconditions:
          - "Delivery.custody_status == DELIVERED"
        side_effects:
          - "Courier.active_delivery_count -= 1; Courier.status := AVAILABLE when it reaches 0"
          - "increments CourierAssignment.version by 1"

  - entity: DeliveryWindow
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system cascade from POST /deliveries or POST /deliveries/{id}/reschedule when reserved_slots reaches capacity_slots"
        actor: system
        preconditions:
          - "reserved_slots == capacity_slots"
        side_effects:
          - "increments DeliveryWindow.version by 1"
      - from: FULL
        to: OPEN
        trigger: "system cascade from any slot release (cancel, reschedule away, DELIVERED, RETURN_PENDING)"
        actor: system
        preconditions:
          - "reserved_slots < capacity_slots"
          - "clock < window.window_end"
        side_effects:
          - "increments DeliveryWindow.version by 1"
        note: "Cycle OPEN -> FULL -> OPEN driven purely by aggregate occupancy."
      - from: OPEN
        to: CLOSED
        trigger: "POST /routing-runs (sweep)"
        actor: NetworkOps
        preconditions:
          - "clock >= window.window_end"
        side_effects:
          - "no further Delivery may reserve or depart against this window"
          - "increments DeliveryWindow.version by 1"
      - from: FULL
        to: CLOSED
        trigger: "POST /routing-runs (sweep)"
        actor: NetworkOps
        preconditions:
          - "clock >= window.window_end"
        side_effects:
          - "increments DeliveryWindow.version by 1"

  - entity: PlanGrant
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system cascade from any commitment or consumption that drives remaining_cents to 0"
        actor: system
        preconditions:
          - "remaining_cents == 0"
        side_effects:
          - "grant is removed from the subsidy selector candidate set"
          - "increments PlanGrant.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system cascade from any release that raises remaining_cents above 0 (cancel, waiver, cold-breach void, settle release)"
        actor: system
        preconditions:
          - "remaining_cents > 0"
        side_effects:
          - "increments PlanGrant.version by 1"
        note: "Cycle ACTIVE -> EXHAUSTED -> ACTIVE; the release path is what makes grant-fund conservation observable."

  - entity: ExceptionCase
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /exception-cases/{id}/start-review"
        actor: NetworkOps
        preconditions:
          - "case.status == OPEN"
        side_effects:
          - "increments ExceptionCase.version by 1"
      - from: UNDER_REVIEW
        to: RESHIP_AUTHORIZED
        trigger: "POST /exception-cases/{id}/adjudicate with disposition RESHIP"
        actor: NetworkOps
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "X-User-ID != case.opened_by_ops_user_id when that field is non-null"
          - "X-User-ID is not the revoked_by_ops_user_id of any CourierAssignment on case.delivery_id"
          - "expected_delivery_version == Delivery.version"
          - "Delivery.custody_status IN {RETURN_PENDING, RETURNED}"
          - "target reship window is OPEN, its zone_id equals the original window's zone_id, its courier_mode equals the original window's courier_mode, and available_slots >= 1"
        side_effects:
          - "case.disposition := RESHIP, case.adjudicated_by_ops_user_id := X-User-ID"
          - "L1: a new Delivery is created with order_id = original order, window_id = reship_window_id, reship_of_delivery_id = original delivery, custody_status QUEUED, settlement_status PROVISIONAL"
          - "L2: because the reship Delivery was created, a PROVISIONAL FeeAllocation is computed for it per §1.3"
          - "L3: because that FeeAllocation was created, PlanGrant.committed_cents += allocation.plan_grant_cents"
          - "L4: because committed_cents rose, PlanGrant.status := EXHAUSTED when remaining_cents reaches 0"
          - "target DeliveryWindow.reserved_slots += 1 and status := FULL when it reaches capacity"
          - "case.reship_delivery_id := new delivery id"
          - "increments Delivery.version by 1 (the original delivery, whose reship linkage changed)"
          - "increments ExceptionCase.version by 1"
        note: "Fork branch A. Depth-4 cascade with a different trigger from the COLD_BREACH chain."
      - from: UNDER_REVIEW
        to: CREDIT_ISSUED
        trigger: "POST /exception-cases/{id}/adjudicate with disposition CREDIT"
        actor: NetworkOps
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "X-User-ID != case.opened_by_ops_user_id when that field is non-null"
          - "X-User-ID is not the revoked_by_ops_user_id of any CourierAssignment on case.delivery_id"
          - "expected_delivery_version == Delivery.version"
          - "Delivery.settlement_status == PROVISIONAL"
        side_effects:
          - "case.disposition := CREDIT, case.adjudicated_by_ops_user_id := X-User-ID"
          - "Delivery.settlement_status := WAIVED; ACTIVE FeeAllocation.status := VOIDED; Delivery.fee_subtotal_cents := 0"
          - "PlanGrant.committed_cents -= voided plan_grant_cents; PlanGrant.status := ACTIVE when remaining_cents becomes > 0"
          - "case.credit_cents := voided allocation fee_subtotal_cents"
          - "no reship Delivery is created and no window slot is reserved"
          - "increments Delivery.version by 1"
          - "increments ExceptionCase.version by 1"
        note: "Fork branch B — financially compensating, physically inert; the exact mirror image of branch A."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /exception-cases/{id}/adjudicate with disposition DENY"
        actor: NetworkOps
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "X-User-ID != case.opened_by_ops_user_id when that field is non-null"
          - "expected_delivery_version == Delivery.version"
        side_effects:
          - "case.disposition := DENY, case.adjudicated_by_ops_user_id := X-User-ID, case.credit_cents := 0"
          - "Delivery.settlement_status is left PROVISIONAL so settlement proceeds normally"
          - "increments ExceptionCase.version by 1"
        note: "Fork branch C — no financial and no physical effect."
      - from: RESHIP_AUTHORIZED
        to: CLOSED
        trigger: "POST /exception-cases/{id}/close"
        actor: NetworkOps
        preconditions:
          - "case.status IN {RESHIP_AUTHORIZED, CREDIT_ISSUED, DENIED}"
        side_effects:
          - "increments ExceptionCase.version by 1"
        note: "Join point of the three-way fork."
      - from: CREDIT_ISSUED
        to: CLOSED
        trigger: "POST /exception-cases/{id}/close"
        actor: NetworkOps
        preconditions:
          - "case.status IN {RESHIP_AUTHORIZED, CREDIT_ISSUED, DENIED}"
        side_effects:
          - "increments ExceptionCase.version by 1"
      - from: DENIED
        to: CLOSED
        trigger: "POST /exception-cases/{id}/close"
        actor: NetworkOps
        preconditions:
          - "case.status IN {RESHIP_AUTHORIZED, CREDIT_ISSUED, DENIED}"
        side_effects:
          - "increments ExceptionCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: delivery-create-stale-window
    parent_entity: DeliveryWindow
    write_endpoint: "POST /deliveries"
    occ_field: "expected_window_version"
    description: |
      Reserving a slot on a DeliveryWindow whose version has advanced since the
      client last read it is rejected. This captures the case where another
      writer has already reserved a slot on that window — legitimate while
      available_slots remains positive — so the current writer's view of
      reserved_slots, available_slots and status is stale.
    error_id: ERR_STALE_WINDOW_VERSION
    http_status: 412

  - rule_id: reship-adjudication-stale-delivery
    parent_entity: Delivery
    write_endpoint: "POST /exception-cases/{id}/adjudicate"
    occ_field: "expected_delivery_version"
    description: |
      Adjudicating an ExceptionCase against a Delivery whose version has
      advanced since the operator loaded the case is rejected. This captures the
      case where the delivery has meanwhile been settled, waived, returned or
      re-linked to another reship — each of which legitimately supersedes the
      operator's view of what the adjudication would do.
    error_id: ERR_STALE_DELIVERY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: handling_class_and_verification_requirements
    description: |
      Derives a Delivery's handling class and the door-step proof requirements
      from the order's cold-chain flag, controlled schedule and total value.
      Runs before any fee arithmetic because handling_class selects which fee
      surcharge lines exist.
    trigger: "POST /pharmacy-orders/{id}/mark-ready (on the order) and POST /deliveries (copied onto the Delivery)"
    inputs:
      - "PharmacyOrder.cold_chain_required"
      - "PharmacyOrder.controlled_schedule"
      - "PharmacyOrder.total_rx_value_cents"
    algorithm: threshold
    formula: |
      handling_class:
        cold = order.cold_chain_required
        ctrl = order.controlled_schedule != NONE
        if cold and ctrl: COLD_CHAIN_CONTROLLED
        elif cold:        COLD_CHAIN
        elif ctrl:        CONTROLLED
        else:             STANDARD

      signature_required =
        ctrl
        or order.total_rx_value_cents >= SIGNATURE_VALUE_THRESHOLD_CENTS

      required_id_verification =
        if order.controlled_schedule == CII:                 GOVT_ID_SCAN
        elif order.controlled_schedule == CIII:              PHOTO_ID
        elif order.total_rx_value_cents >= SIGNATURE_VALUE_THRESHOLD_CENTS:
                                                            PHOTO_ID
        elif order.cold_chain_required:                      DOB_MATCH
        else:                                               DOB_MATCH

      # Ladder used for comparison at attempt time (strictly increasing):
      #   NONE(0) < DOB_MATCH(1) < PHOTO_ID(2) < GOVT_ID_SCAN(3)
    constants:
      SIGNATURE_VALUE_THRESHOLD_CENTS: 25000
    precision: "integer cents; the threshold comparison is >= (at-threshold value requires a signature)"

  - name: delivery_fee_subtotal
    description: |
      Builds the six-line delivery-fee bill for one Delivery. The line vector is
      the shared input of every downstream money calculation, so it is emitted
      as an ordered list, never as a pre-summed total.
    trigger: "POST /deliveries (variant PROVISIONAL); POST /deliveries/{id}/settle and reship allocation (variant FINAL)"
    inputs:
      - "DeliveryZone.base_fee_cents, per_mile_cents, distance_band_miles, cold_pack_fee_cents, controlled_handling_fee_cents, after_hours_fee_cents"
      - "Delivery.handling_class"
      - "DeliveryWindow.window_start"
      - "Delivery.attempt_count (FINAL variant only)"
    algorithm: tiered_pricing
    formula: |
      billable_attempts =
        PROVISIONAL -> 1                                  # the planned single run
        FINAL       -> max(delivery.attempt_count, 1)     # what actually happened

      L1 base_line_cents        = zone.base_fee_cents
      L2 mileage_line_cents     = zone.per_mile_cents * ceil(zone.distance_band_miles)
      L3 cold_pack_line_cents  = (handling_class IN {COLD_CHAIN, COLD_CHAIN_CONTROLLED})
                                   ? zone.cold_pack_fee_cents * billable_attempts
                                   : 0
                                 # each door-step run needs a fresh gel-pack re-ice
      L4 controlled_line_cents  = (handling_class IN {CONTROLLED, COLD_CHAIN_CONTROLLED})
                                   ? zone.controlled_handling_fee_cents : 0
      L5 after_hours_line_cents = after_hours(window.window_start) ? zone.after_hours_fee_cents : 0
      L6 reattempt_line_cents   = REATTEMPT_SURCHARGE_CENTS
                                   * min(max(billable_attempts - 1, 0), REATTEMPT_SURCHARGE_MAX_UNITS)

      after_hours(ts) = (utc_hour(ts) >= AFTER_HOURS_START_UTC_HOUR) or (utc_hour(ts) < AFTER_HOURS_END_UTC_HOUR)

      fee_line_items   = [L1, L2, L3, L4, L5, L6]           # positional, zeros retained
      fee_subtotal_cents = sum(fee_line_items)
    constants:
      REATTEMPT_SURCHARGE_CENTS: 400
      REATTEMPT_SURCHARGE_MAX_UNITS: 2
      AFTER_HOURS_START_UTC_HOUR: 20
      AFTER_HOURS_END_UTC_HOUR: 6
    precision: "integer cents; ceil() applied to distance_band_miles before multiplying, never after"
    variants:
      - name: PROVISIONAL
        when: "Delivery creation (POST /deliveries) and reship-Delivery creation"
        difference: "billable_attempts is pinned to 1: exactly one cold-chain re-ice line and zero re-attempt surcharge, because no door-step run has happened yet"
      - name: FINAL
        when: "POST /deliveries/{id}/settle"
        difference: "billable_attempts = max(attempt_count, 1): the cold-chain line is multiplied by the number of runs actually made and the re-attempt surcharge appears, capped at REATTEMPT_SURCHARGE_MAX_UNITS units"
    worked_example: |
      Zone Z1 (base 705, per_mile 123, distance_band_miles 6.4, cold 455, controlled 605,
      after_hours 305), handling_class COLD_CHAIN_CONTROLLED, window_start
      2026-08-03T14:00:00Z (not after-hours).
        mileage = 123 * ceil(6.4) = 123 * 7 = 861
        PROVISIONAL (billable_attempts 1):
          [705, 861, 455, 605, 0, 0]        -> 2626
        FINAL after attempt_count 2 (billable_attempts 2):
          [705, 861, 910, 605, 0, 400]      -> 3481
      Delta on the variant switch = 3481 - 2626 = 855.

  - name: patient_gross_cost_share
    description: |
      The member's share of the delivery fee before any subsidy. Rounded
      per fee line and then summed — not computed on the subtotal — because each
      line is a separately adjudicated benefit item.
    trigger: "Any FeeAllocation computation (POST /deliveries, POST /deliveries/{id}/settle, reship authorization)"
    inputs:
      - "fee_line_items from delivery_fee_subtotal"
      - "HealthPlan.member_cost_share_pct"
    algorithm: aggregation
    formula: |
      patient_gross_share_cents = sum over each line L in fee_line_items of
                              round_half_up(L * plan.member_cost_share_pct)

      # NOT round_half_up(fee_subtotal_cents * pct) — the two disagree whenever
      # two or more lines land on a half-cent.
    constants: {}
    precision: "round_half_up to whole cents, applied once per line item, then summed"
    worked_example: |
      lines [705, 861, 455, 605, 0, 0], member_cost_share_pct 0.10
        per line: 71 (70.5 up), 86 (86.1 down), 46 (45.5 up), 61 (60.5 up), 0, 0
        patient_gross_share_cents = 264
        sum-then-round would give round_half_up(2626 * 0.10) = round_half_up(262.6) = 263
      lines [705, 861, 910, 605, 0, 400], pct 0.10
        per line: 71, 86, 91, 61, 0, 40 -> 349   (sum-then-round: 348)
      lines [2005, 1395, 0, 0, 305, 0], pct 0.30
        per line: 602 (601.5 up), 419 (418.5 up), 0, 0, 92 (91.5 up), 0 -> 1113
        (sum-then-round: round_half_up(1111.5) = 1112)

  - name: plan_grant_commitment_and_absorption
    description: |
      The payer-mix waterfall. Splits the fee subtotal three ways — health-plan
      grant, pharmacy absorption, patient out-of-pocket — in a strictly pinned
      evaluation order. The pharmacy absorption tier is selected from the
      patient's PRE-absorption net and is never re-derived from the post-
      absorption figure.
    trigger: "Any FeeAllocation computation (POST /deliveries, POST /deliveries/{id}/settle, reship authorization)"
    inputs:
      - "fee_subtotal_cents and patient_gross_share_cents"
      - "HealthPlan.payer_type"
      - "PlanGrant.per_delivery_cap_cents, remaining_cents, status"
    algorithm: waterfall_allocation
    formula: |
      step 1  gross = patient_gross_cost_share(...)
      step 2  grant_eligible_cents = min(gross,
                                         grant.per_delivery_cap_cents,
                                         grant.remaining_cents)
      step 3  if plan.payer_type == MEDICAID and grant_eligible_cents < gross:
                reject with ERR_GRANT_COVERAGE_INSUFFICIENT
                # zero-member-cost mandate: a Medicaid member may not be billed
                # any residue, so a partially funded grant cannot be used at all
      step 4  plan_grant_cents = grant_eligible_cents
      step 5  patient_net_pre_absorption_cents = gross - plan_grant_cents
      step 6  absorption_tier_cents =
                patient_net_pre_absorption_cents >= ABSORB_TIER3_FLOOR_CENTS -> ABSORB_TIER3_CENTS
                patient_net_pre_absorption_cents >= ABSORB_TIER2_FLOOR_CENTS -> ABSORB_TIER2_CENTS
                patient_net_pre_absorption_cents >= 1                        -> ABSORB_TIER1_CENTS
                otherwise                                                    -> 0
              pharmacy_absorption_cents = min(absorption_tier_cents,
                                            patient_net_pre_absorption_cents)
      step 7  patient_payable_cents = patient_net_pre_absorption_cents
                                            - pharmacy_absorption_cents
              pharmacy_payable_cents = fee_subtotal_cents
                               - plan_grant_cents
                               - patient_payable_cents
              # pharmacy_payable_cents therefore carries both the absorbed goodwill slice
              # and the whole non-member portion of the bill

      invariant: plan_grant_cents + pharmacy_payable_cents + patient_payable_cents
                 == fee_subtotal_cents
    constants:
      ABSORB_TIER3_FLOOR_CENTS: 1000
      ABSORB_TIER3_CENTS: 500
      ABSORB_TIER2_FLOOR_CENTS: 500
      ABSORB_TIER2_CENTS: 200
      ABSORB_TIER1_CENTS: 50
    precision: "integer cents throughout; no rounding occurs in this calculation, only min/subtraction"
    worked_example: |
      (a) COMMERCIAL 0.10, lines [705,861,455,605,0,0], subtotal 2626, gross 264,
          cap 150, remaining 100000:
            plan_grant 150; pre_absorption 114; tier(114) = 50; absorbed 50;
            patient 64; pharmacy 2626 - 150 - 64 = 2412
      (b) same delivery settled FINAL, subtotal 3481, gross 349:
            plan_grant 150; pre_absorption 199; tier 50; patient 149;
            pharmacy 3481 - 150 - 149 = 3182
      (c) COMMERCIAL 0.30, lines [2005,1395,0,0,305,0], subtotal 3705, gross 1113,
          cap 60, remaining 60:
            plan_grant 60; pre_absorption 1053; tier(1053) = 500; absorbed 500;
            patient 553; pharmacy 3705 - 60 - 553 = 3092
          Re-deriving the tier from the post-absorption 553 would yield tier 200
          and patient 853 — wrong.
      (d) MEDICAID 0.20, lines [705,861,0,0,0,0], subtotal 1566, gross 313,
          cap 400, remaining 313:
            grant_eligible = min(313,400,313) = 313 == gross -> admitted
            plan_grant 313; pre_absorption 0; absorbed 0; patient 0;
            pharmacy 1253
          With remaining 312: grant_eligible 312 < 313 -> ERR_GRANT_COVERAGE_INSUFFICIENT

  - name: courier_reliability_scores
    description: |
      Two scores per courier off the same DeliveryAttempt history. The rolling
      score is a decay-weighted graded average over the most recent attempts and
      drives selector ranking; the lifetime score is an unweighted binary
      completion rate over all attempts and is the only score that can suspend a
      courier. They deliberately disagree.
    trigger: "Recomputed on every POST /deliveries/{id}/attempts for the attempting courier"
    inputs:
      - "DeliveryAttempt rows for the courier, ordered by created_at ASC"
      - "DeliveryAttempt.outcome"
    algorithm: decay_function
    formula: |
      reliability_credit(outcome) =
        DELIVERED                                          -> 1.0
        NO_ANSWER | REFUSED | ADDRESS_INVALID | ID_MISMATCH -> 0.5
        COLD_BREACH                                        -> 0.0

      attempt_total_count = count(all attempts by courier)
      delivered_count     = count(attempts with outcome DELIVERED)

      # ---- variant ROLLING ----
      window = the last min(ROLLING_WINDOW_SIZE, attempt_total_count) attempts
               ordered by created_at DESC, then created_at ASC as the only
               tie-break; index i = 0 for the most recent
      weight(i) = ROLLING_DECAY_FACTOR ** i
      rolling_reliability_score =
        attempt_total_count == 0
          ? 100.00
          : round_half_up(100 * sum(credit_i * weight(i)) / sum(weight(i)), 2)

      # ---- variant LIFETIME ----
      lifetime_reliability_score =
        attempt_total_count == 0
          ? 100.00
          : round_half_up(100 * delivered_count / attempt_total_count, 2)

      # ---- suspension gate (LIFETIME only) ----
      if attempt_total_count >= COURIER_SCORE_MIN_ATTEMPTS
         and lifetime_reliability_score < COURIER_MIN_LIFETIME_SCORE
         and courier.status IN {OFFLINE, AVAILABLE, ON_ROUTE}:
        courier.status := SUSPENDED
    constants:
      ROLLING_WINDOW_SIZE: 3
      ROLLING_DECAY_FACTOR: 0.8
      COURIER_SCORE_MIN_ATTEMPTS: 3
      COURIER_MIN_LIFETIME_SCORE: 60.00
    precision: "2 decimal places, round_half_up; the suspension comparison is strict <"
    variants:
      - name: ROLLING
        when: "Selector ranking in courier_selection_rank"
        difference: "decay-weighted (0.8**i) over the last 3 attempts, graded credits 1.0/0.5/0.0; recency dominates and partial credit is given for a failed door-step"
      - name: LIFETIME
        when: "Suspension gate"
        difference: "unweighted delivered/total over the whole history, binary credit; no recency weighting and no partial credit"
    worked_example: |
      history in chronological order, weights [1, 0.8, 0.64] (sum 2.44):
      (a) [NO_ANSWER, DELIVERED, DELIVERED]
            ROLLING  = 100 * (1.0*1 + 1.0*0.8 + 0.5*0.64) / 2.44
                     = 100 * 2.12 / 2.44 = 86.885... -> 86.89
            LIFETIME = 100 * 2/3 = 66.666... -> 66.67
            3 attempts >= 3 but 66.67 >= 60.00 -> not suspended
      (b) [NO_ANSWER, DELIVERED, DELIVERED, COLD_BREACH]  (window = last 3)
            ROLLING  = 100 * (0.0*1 + 1.0*0.8 + 1.0*0.64) / 2.44
                     = 100 * 1.44 / 2.44 = 59.016... -> 59.02
            LIFETIME = 100 * 2/4 = 50.00
            4 >= 3 and 50.00 < 60.00 -> SUSPENDED
      (c) [NO_ANSWER, COLD_BREACH]  (weights [1, 0.8], sum 1.8)
            ROLLING  = 100 * (0.0*1 + 0.5*0.8) / 1.8 = 22.222... -> 22.22
            LIFETIME = 100 * 0/2 = 0.00
            2 < COURIER_SCORE_MIN_ATTEMPTS -> NOT suspended despite 0.00

  - name: courier_selection_rank
    description: |
      Deterministic selector that picks the courier to offer a Delivery to when
      POST /deliveries/{id}/dispatch is called without an explicit courier_id.
    trigger: "POST /deliveries/{id}/dispatch with courier_id absent; also POST /routing-runs for every QUEUED delivery with no live offer"
    inputs:
      - "all Courier rows"
      - "Delivery.handling_class, Delivery.excluded_courier_ids, DeliveryWindow.zone_id, DeliveryWindow.courier_mode, window_start, window_end"
    algorithm: weighted_scoring
    formula: |
      eligibility filter — a Courier is a candidate only if ALL hold:
        c.status IN {AVAILABLE, ON_ROUTE}
        c.mode == window.courier_mode
        window.zone_id IN c.served_zone_codes
        c.id NOT IN delivery.excluded_courier_ids
        handling_class IN {COLD_CHAIN, COLD_CHAIN_CONTROLLED}  implies c.cold_chain_equipped == true
        handling_class IN {CONTROLLED, COLD_CHAIN_CONTROLLED}  implies c.controlled_certified == true
        c has no CourierAssignment with status ACCEPTED whose delivery's window
          buffered interval overlaps this window (see courier_overlap_detection)

      ranking expression, applied to the candidate set in order:
        1. rolling_reliability_score DESC
        2. active_delivery_count ASC
        3. created_at ASC                      # sole tie-break, never id
      selected = first row after ranking

      empty-pool fallback: if the candidate set is empty, no CourierAssignment is
      created and the request fails with ERR_NO_ELIGIBLE_COURIER (409); the
      Delivery stays in QUEUED and nothing is mutated.
    constants:
      OFFER_TTL_MINUTES: 10
    precision: "score comparison at 2 decimal places, exactly as stored on Courier.rolling_reliability_score"

  - name: window_slot_occupancy
    description: |
      Aggregate capacity accounting for a DeliveryWindow. Occupancy is defined by
      membership in a reserved custody set, so it is recomputed from Delivery
      rows rather than incremented blindly.
    trigger: "POST /deliveries, POST /deliveries/{id}/reschedule, POST /deliveries/{id}/cancel, POST /deliveries/{id}/attempts, POST /routing-runs"
    inputs:
      - "Delivery.window_id, Delivery.custody_status"
      - "DeliveryWindow.capacity_slots"
    algorithm: aggregation
    formula: |
      RESERVED_CUSTODY_STATES = {QUEUED, ASSIGNED, PICKED_UP, OUT_FOR_DELIVERY, ATTEMPT_FAILED}

      reserved_slots  = count(Delivery d where d.window_id == W.id
                                          and d.custody_status IN RESERVED_CUSTODY_STATES)
      available_slots = max(W.capacity_slots - reserved_slots, 0)

      status: OPEN while reserved_slots < capacity_slots and clock < window_end
              FULL when reserved_slots == capacity_slots
              CLOSED once a routing run observes clock >= window_end (sticky)

      A reservation attempt when available_slots == 0 fails with ERR_WINDOW_FULL.
      DELIVERED, RETURN_PENDING, RETURNED and CANCELLED all release the slot;
      ATTEMPT_FAILED does not, because the bag is still out on that window.
    constants: {}
    precision: "integer counts; the FULL comparison is == capacity_slots and the rejection comparison is available_slots < 1"

  - name: window_interval_overlap
    description: |
      Zone-level temporal uniqueness for DeliveryWindow. Windows are half-open
      intervals, so a window that starts exactly when another ends is a distinct
      resource slot, not a conflict.
    trigger: "POST /delivery-windows"
    inputs:
      - "candidate window_start, window_end, zone_id, courier_mode"
      - "existing DeliveryWindow rows with status != CLOSED in the same zone"
    algorithm: interval_merge
    formula: |
      require window_start < window_end            else ERR_WINDOW_INTERVAL_INVALID

      conflict(existing E) =
            E.zone_id == candidate.zone_id
        and E.courier_mode == candidate.courier_mode
        and E.status != CLOSED
        and candidate.window_start <  E.window_end
        and E.window_start        <  candidate.window_end
      # half-open [start, end): touching endpoints (candidate.start == E.end or
      # E.start == candidate.end) produce a strict-inequality miss and are allowed

      any conflict -> ERR_WINDOW_OVERLAP (409)
    constants: {}
    precision: "second-resolution UTC timestamps; both comparisons strict (<)"
    worked_example: |
      existing SCHEDULED window in Z1 [14:00:00Z, 16:00:00Z)
        candidate [16:00:00Z, 18:00:00Z) -> 16:00 < 16:00 false -> allowed (adjacent)
        candidate [15:59:59Z, 18:00:00Z) -> 15:59:59 < 16:00 and 14:00 < 18:00 -> ERR_WINDOW_OVERLAP
        candidate [16:00:00Z, 18:00:00Z) in Z1 but courier_mode ON_DEMAND -> allowed (different mode)

  - name: courier_overlap_detection
    description: |
      Per-courier double-booking guard. Unlike window intervals, a courier's
      committed interval is CLOSED and padded on both ends by a turnaround
      buffer, so back-to-back windows that are legal for a zone are illegal for
      one courier.
    trigger: "POST /deliveries/{id}/dispatch (selector eligibility and explicit-courier validation), POST /courier-assignments/{id}/accept"
    inputs:
      - "CourierAssignment rows with status ACCEPTED for the courier"
      - "DeliveryWindow.window_start, window_end of each such assignment's delivery"
      - "candidate DeliveryWindow.window_start, window_end"
    algorithm: interval_merge
    formula: |
      committed(E) = [ E.window_start - COURIER_TURNAROUND_BUFFER_MINUTES,
                       E.window_end   + COURIER_TURNAROUND_BUFFER_MINUTES ]   # closed

      conflict = exists an ACCEPTED assignment E for this courier with
                   candidate.window_start <= committed(E).hi
               and committed(E).lo       <= candidate.window_end
      # closed-interval containment: shared endpoints DO conflict

      conflict at accept time            -> ERR_COURIER_OVERLAP_CONFLICT (409)
      conflict during selector filtering -> the courier is dropped from the
                                            candidate pool (no error of its own)
    constants:
      COURIER_TURNAROUND_BUFFER_MINUTES: 15
    precision: "minute arithmetic on UTC timestamps; both comparisons non-strict (<=)"
    worked_example: |
      courier holds an ACCEPTED assignment on window [14:00Z, 16:00Z)
        committed = [13:45Z, 16:15Z]
        candidate window [16:00Z, 18:00Z): 16:00 <= 16:15 and 13:45 <= 18:00
          -> ERR_COURIER_OVERLAP_CONFLICT, even though the two windows are
             adjacent and both legal under window_interval_overlap
        candidate window [16:15Z, 18:15Z): 16:15 <= 16:15 -> still a conflict (closed hi)
        candidate window [16:16Z, 18:16Z): 16:16 <= 16:15 false -> allowed

  - name: reattempt_ladder
    description: |
      Governs how many door-step runs a Delivery may have and how long the
      courier must wait between them. The cooldown lengthens with each rung.
    trigger: "POST /deliveries/{id}/depart from ATTEMPT_FAILED; POST /deliveries/{id}/attempts"
    inputs:
      - "Delivery.attempt_count, Delivery.last_attempt_at"
      - "clock"
    algorithm: threshold
    formula: |
      rung = delivery.attempt_count            # 0 before the first run
      remaining_attempts = MAX_DELIVERY_ATTEMPTS - delivery.attempt_count

      cooldown_minutes(rung) =
        rung == 1 -> REATTEMPT_COOLDOWN_STAGE1_MINUTES
        rung == 2 -> REATTEMPT_COOLDOWN_STAGE2_MINUTES
        otherwise -> 0

      re-departure gate (custody ATTEMPT_FAILED -> OUT_FOR_DELIVERY):
        # attempt_count >= MAX_DELIVERY_ATTEMPTS is structurally unreachable here:
        # the MAX-th failure routes custody to RETURN_PENDING (below), so a fourth
        # departure is rejected by the custody-state rule at priority 13 with
        # ERR_INVALID_CUSTODY_STATE. No separate exhaustion error exists.
        if clock < delivery.last_attempt_at + cooldown_minutes(attempt_count):
          ERR_REATTEMPT_COOLDOWN_ACTIVE (409)
        # boundary: clock exactly at last_attempt_at + cooldown is allowed

      outcome routing at POST /deliveries/{id}/attempts:
        n = delivery.attempt_count + 1
        forced COLD_BREACH                      -> RETURN_PENDING
        outcome DELIVERED                       -> DELIVERED
        failure outcome and n <  MAX_DELIVERY_ATTEMPTS -> ATTEMPT_FAILED
        failure outcome and n == MAX_DELIVERY_ATTEMPTS -> RETURN_PENDING
    constants:
      MAX_DELIVERY_ATTEMPTS: 3
      REATTEMPT_COOLDOWN_STAGE1_MINUTES: 60
      REATTEMPT_COOLDOWN_STAGE2_MINUTES: 180
    precision: "minute arithmetic; the cooldown comparison is strict < (at-boundary passes) and the exhaustion comparison n == MAX_DELIVERY_ATTEMPTS routes custody rather than raising an error"

# =============================================================================
# §1.4 Validation Rules Table (strictly ordered; the lowest-priority number
# whose condition is violated is the error returned, and no later check runs)
# =============================================================================
validations:
  # ---- auth / authorization / scoping -------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Checked before routing, role resolution and path existence."

  - priority: 2
    category: auth
    check: "The role that owns X-User-ID appears in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role is resolved by locating X-User-ID among Pharmacy / Patient / Courier / HealthPlan ids; an id that matches none is treated as NetworkOps."

  - priority: 3
    category: auth
    check: "An acting PharmacyOperator's id equals the pharmacy_id of the PharmacyOrder behind the addressed resource"
    error_id: ERR_PHARMACY_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /pharmacy-orders/{id}/hold", "POST /deliveries", "POST /deliveries/{id}/cancel", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/confirm-return", "GET /pharmacy-orders/{id}", "GET /deliveries/{id}"]
    description: "Peer isolation between pharmacies."

  - priority: 4
    category: auth
    check: "An acting Patient's id equals the patient_id of the PharmacyOrder behind the addressed resource"
    error_id: ERR_PATIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /deliveries/{id}/cancel", "POST /deliveries/{id}/reschedule", "POST /patients/{id}/consent", "GET /deliveries/{id}", "GET /pharmacy-orders/{id}"]
    description: "A patient may only act on their own prescriptions."

  - priority: 5
    category: auth
    check: "An acting Courier's id equals the courier_id of the addressed Delivery or CourierAssignment"
    error_id: ERR_COURIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /courier-assignments/{id}/accept", "POST /courier-assignments/{id}/decline", "POST /couriers/{id}/status", "POST /deliveries/{id}/pickup", "POST /deliveries/{id}/depart", "POST /deliveries/{id}/attempts", "GET /deliveries/{id}/courier-view", "GET /couriers/{id}"]
    description: "A courier cannot touch another courier's leg of the network."

  - priority: 6
    category: auth
    check: "An acting PlanAdministrator's id equals the health_plan_id of the addressed PlanGrant, or of the PharmacyOrder behind the addressed Delivery"
    error_id: ERR_PLAN_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /plan-grants", "GET /plan-grants/{id}", "GET /plan-grants", "GET /fee-allocations/{id}", "GET /fee-allocations", "GET /deliveries/{id}"]
    description: "A payer sees only its own grant pool and the allocations drawn against it."

  - priority: 7
    category: auth
    check: "A Courier reading GET /deliveries/{id}/courier-view holds a CourierAssignment on that delivery with status IN {OFFERED, ACCEPTED, COMPLETED} or is the delivery's courier_id"
    error_id: ERR_HIPAA_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["GET /deliveries/{id}/courier-view"]
    description: "Minimum-necessary rule: no live or historical assignment means no disclosure at all, not even the redacted projection."

  # ---- existence / schema -------------------------------------------------
  - priority: 8
    category: existence
    check: "Every {id} path segment resolves to a stored row of the addressed collection"
    error_id: "ERR_ORDER_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_COURIER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_EXCEPTION_CASE_NOT_FOUND | ERR_PLAN_GRANT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ATTEMPT_NOT_FOUND | ERR_PATIENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Selected by the addressed collection, evaluated after scoping so a cross-tenant probe of a real id yields 403 rather than leaking 404-vs-200."

  - priority: 9
    category: existence
    check: "Request body parses, contains every required field, and every field satisfies its declared type / enum / range / format constraint"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
    description: "Includes pagination bounds (limit 1..100, offset >= 0), 2-decimal percentage checks, ISO-8601 shape and unknown enum members."

  - priority: 10
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row of the referenced entity"
    error_id: "ERR_ORDER_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_COURIER_NOT_FOUND | ERR_PLAN_GRANT_NOT_FOUND | ERR_REFERENCE_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /plan-grants", "POST /patients", "POST /couriers", "POST /delivery-windows", "POST /pharmacy-orders", "POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/dispatch", "POST /exception-cases", "POST /exception-cases/{id}/adjudicate"]
    description: "ERR_REFERENCE_NOT_FOUND covers referenced entities without a dedicated code (HealthPlan, Pharmacy, DeliveryZone by zone_code)."

  - priority: 11
    category: auth
    check: "The adjudicating ops user is neither the case's opened_by_ops_user_id nor the revoked_by_ops_user_id of any CourierAssignment on the case's delivery"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /exception-cases/{id}/adjudicate"]
    description: "Requires the case row, so it is ordered after existence; still an authorization decision and therefore ahead of every state check. A system-opened case (opened_by_ops_user_id null) is adjudicable by anyone in NetworkOps."

  # ---- state preconditions ------------------------------------------------
  - priority: 12
    category: state
    check: "PharmacyOrder.status is the state the operation requires (READY to reserve a delivery, INTAKE to mark ready, READY to hold, DISPATCHED to pick up)"
    error_id: "ERR_ORDER_NOT_READY | ERR_INVALID_ORDER_STATE"
    http_status: 409
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /pharmacy-orders/{id}/hold", "POST /deliveries", "POST /deliveries/{id}/pickup"]
    description: "ERR_ORDER_NOT_READY is used specifically where READY is required; other mismatches use ERR_INVALID_ORDER_STATE."

  - priority: 13
    category: state
    check: "Delivery.custody_status is in the operation's allowed from-set"
    error_id: ERR_INVALID_CUSTODY_STATE
    http_status: 409
    applies_to: ["POST /deliveries/{id}/dispatch", "POST /deliveries/{id}/pickup", "POST /deliveries/{id}/depart", "POST /deliveries/{id}/attempts", "POST /deliveries/{id}/cancel", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/confirm-return", "POST /deliveries/{id}/settle", "POST /exception-cases"]
    description: "Also covers terminal-state lockdown for DELIVERED, RETURNED and CANCELLED."

  - priority: 14
    category: state
    check: "Delivery.settlement_status == PROVISIONAL where the operation moves the money dimension"
    error_id: ERR_INVALID_SETTLEMENT_STATE
    http_status: 409
    applies_to: ["POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
    description: "Independent of custody_status: a DELIVERED delivery whose settlement is already FINALIZED cannot be settled again, and a WAIVED one cannot be credited twice."

  - priority: 15
    category: state
    check: "CourierAssignment.status == OFFERED for accept/decline, IN {OFFERED, ACCEPTED} for revoke, and clock < offer_expires_at for accept"
    error_id: "ERR_INVALID_ASSIGNMENT_STATE | ERR_OFFER_EXPIRED"
    http_status: 409
    applies_to: ["POST /courier-assignments/{id}/accept", "POST /courier-assignments/{id}/decline", "POST /courier-assignments/{id}/revoke"]
    description: "Status mismatch is reported before expiry, so declining an already-declined offer reports the status, not the TTL."

  - priority: 16
    category: state
    check: "ExceptionCase.status is OPEN for start-review, UNDER_REVIEW for adjudicate, and IN {RESHIP_AUTHORIZED, CREDIT_ISSUED, DENIED} for close"
    error_id: ERR_INVALID_EXCEPTION_STATE
    http_status: 409
    applies_to: ["POST /exception-cases/{id}/start-review", "POST /exception-cases/{id}/adjudicate", "POST /exception-cases/{id}/close"]
    description: "Adjudicating straight out of OPEN is rejected — the review step cannot be skipped."

  - priority: 17
    category: state
    check: "Courier.status is compatible with the operation: not SUSPENDED and not OFFLINE for dispatch or accept, active_delivery_count == 0 to go OFFLINE, and a Courier may not self-clear SUSPENDED"
    error_id: "ERR_COURIER_SUSPENDED | ERR_COURIER_UNAVAILABLE | ERR_INVALID_COURIER_STATE"
    http_status: 409
    applies_to: ["POST /deliveries/{id}/dispatch", "POST /courier-assignments/{id}/accept", "POST /couriers/{id}/status"]
    description: "ERR_COURIER_SUSPENDED is reported ahead of ERR_COURIER_UNAVAILABLE when both hold, because suspension is the stronger fact. ON_ROUTE is deliberately NOT rejected here — a courier already carrying a leg is a legitimate dispatch target, and the buffered-interval rule at priority 36 is what actually bounds its load."

  - priority: 18
    category: state
    check: "DeliveryWindow.status is not CLOSED and, for a reservation, not FULL by status flag"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/depart"]
    description: "Status-field check only. The clock-versus-window_end check is a separate temporal rule at priority 34 and deliberately loses to the safety rules in between."

  - priority: 19
    category: state
    check: "PlanGrant.benefit_year equals the UTC calendar year of the target DeliveryWindow.window_start and the grant's health_plan_id equals the order's health_plan_id"
    error_id: ERR_GRANT_NOT_APPLICABLE
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
    description: "Grant selection is deterministic: among that plan's ACTIVE grants for the window's benefit year, the one with the lowest created_at is used; none applicable is this error."

  # ---- optimistic concurrency --------------------------------------------
  - priority: 20
    category: concurrency
    check: "expected_window_version equals DeliveryWindow.version"
    error_id: ERR_STALE_WINDOW_VERSION
    http_status: 412
    applies_to: ["POST /deliveries"]
    description: "OCC on the reservation parent; evaluated after every state precondition and before all business rules."

  - priority: 21
    category: concurrency
    check: "expected_delivery_version equals Delivery.version"
    error_id: ERR_STALE_DELIVERY_VERSION
    http_status: 412
    applies_to: ["POST /exception-cases/{id}/adjudicate"]
    description: "OCC on the adjudication parent."

  # ---- business: patient safety and regulatory compliance ----------------
  - priority: 22
    category: business_safety
    check: "Patient.hipaa_consent_status == GRANTED"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /deliveries"]
    description: "Cross-entity dependency: PharmacyOrder cannot advance on the state of a different aggregate, Patient."

  - priority: 23
    category: business_safety
    check: "Pharmacy.controlled_license_tier covers PharmacyOrder.controlled_schedule and Pharmacy.cold_chain_certified is true when cold_chain_required"
    error_id: ERR_CONTROLLED_NOT_LICENSED
    http_status: 409
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready"]
    description: "Coverage ladder: NONE covers {NONE}; CIII_V covers {NONE, CIII}; CII_V covers {NONE, CIII, CII}."

  - priority: 24
    category: business_safety
    check: "DeliveryZone.controlled_delivery_allowed is true when handling_class includes CONTROLLED"
    error_id: ERR_CONTROLLED_ZONE_PROHIBITED
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule"]
    description: "Some municipalities forbid courier delivery of scheduled drugs."

  - priority: 25
    category: business_safety
    check: "DeliveryZone.cold_chain_supported is true when handling_class includes COLD_CHAIN"
    error_id: ERR_COLD_CHAIN_UNSUPPORTED_ZONE
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule"]
    description: "Drive time in the zone exceeds the excursion budget, so cold product may not be routed there at all."

  - priority: 26
    category: business_safety
    check: "An explicitly named courier is cold_chain_equipped when handling_class includes COLD_CHAIN, controlled_certified when it includes CONTROLLED, serves the window's zone_code, and has mode == window.courier_mode"
    error_id: "ERR_COURIER_NOT_COLD_CERTIFIED | ERR_COURIER_NOT_CONTROLLED_CERTIFIED | ERR_COURIER_ZONE_NOT_SERVED | ERR_COURIER_MODE_MISMATCH"
    http_status: 409
    applies_to: ["POST /deliveries/{id}/dispatch"]
    description: "Only reachable on the explicit-courier_id override; the selector silently filters uncertified couriers instead. Deliberately ordered ahead of the temporal window-elapsed rule at priority 34: an uncertified handoff is a patient-safety fact, a late window is only a scheduling fact."

  - priority: 27
    category: business_safety
    check: "cold_chain_seal_id is present at pickup when handling_class includes COLD_CHAIN"
    error_id: ERR_COLD_SEAL_REQUIRED
    http_status: 409
    applies_to: ["POST /deliveries/{id}/pickup"]
    description: "Conditional validation — the field is forbidden-but-ignored for STANDARD and CONTROLLED classes."

  - priority: 28
    category: business_safety
    check: "signature_captured is true and recipient_relationship != UNATTENDED when Delivery.signature_required and the recorded outcome is DELIVERED"
    error_id: "ERR_SIGNATURE_REQUIRED | ERR_UNATTENDED_NOT_PERMITTED"
    http_status: 409
    applies_to: ["POST /deliveries/{id}/attempts"]
    description: "ERR_SIGNATURE_REQUIRED for a missing signature; ERR_UNATTENDED_NOT_PERMITTED when a signature is claimed but the drop is recorded as UNATTENDED."

  - priority: 29
    category: business_safety
    check: "id_verification_method ranks at or above Delivery.required_id_verification on the ladder NONE < DOB_MATCH < PHOTO_ID < GOVT_ID_SCAN when the recorded outcome is DELIVERED"
    error_id: ERR_ID_VERIFICATION_INSUFFICIENT
    http_status: 409
    applies_to: ["POST /deliveries/{id}/attempts"]
    description: "A courier who cannot meet the bar must record ID_MISMATCH instead, which is a normal ladder failure rather than an error."

  # ---- business: structural constraints ----------------------------------
  - priority: 30
    category: business_constraint
    check: "Patient.zone_code names an existing serviced DeliveryZone and the target DeliveryWindow.zone_id is that zone"
    error_id: "ERR_ZONE_NOT_SERVICED | ERR_ZONE_MISMATCH"
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate"]
    description: "ERR_ZONE_NOT_SERVICED when the patient's zone_code has no DeliveryZone row; ERR_ZONE_MISMATCH when the window belongs to a different zone. A reship window must sit in the original window's zone."

  - priority: 31
    category: business_constraint
    check: "A replacement or reship window's courier_mode equals the courier_mode of the window the Delivery currently holds"
    error_id: ERR_WINDOW_MODE_MISMATCH
    http_status: 409
    applies_to: ["POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate"]
    description: "On-demand and scheduled capacity pools are not interchangeable, so a bag priced and staffed against one pool cannot be moved into the other. Not applicable to POST /deliveries, where the window itself establishes the mode."

  - priority: 32
    category: business_constraint
    check: "The PharmacyOrder has no Delivery other than the one addressed by the request whose custody_status is NOT IN {CANCELLED, RETURNED}"
    error_id: ERR_DUPLICATE_ACTIVE_DELIVERY
    http_status: 409
    applies_to: ["POST /deliveries", "POST /exception-cases/{id}/adjudicate"]
    description: "One live bag per order. At POST /deliveries the order-state rule at priority 12 normally speaks first, so the reachable trigger is a second RESHIP adjudication: the case's own delivery is exempt, but a reship Delivery already spawned for the same order is not, which blocks a double reship ahead of the weaker ERR_OVERRIDE_ADJUDICATION_CONFLICT at priority 41."

  - priority: 33
    category: business_constraint
    check: "PharmacyOrder.hold_count < MAX_ORDER_HOLDS (2)"
    error_id: ERR_MAX_HOLDS_EXCEEDED
    http_status: 409
    applies_to: ["POST /pharmacy-orders/{id}/hold"]
    description: "Bounds the INTAKE <-> READY revision cycle."

  # ---- business: temporal ------------------------------------------------
  - priority: 34
    category: business_temporal
    check: "clock < DeliveryWindow.window_end, and for a new reservation clock <= window_start - DISPATCH_LEAD_MINUTES for SCHEDULED windows"
    error_id: ERR_WINDOW_ELAPSED
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/dispatch", "POST /deliveries/{id}/depart"]
    description: "Clock-versus-boundary check, distinct from the status-flag check at priority 18. DISPATCH_LEAD_MINUTES is 120 and applies only to SCHEDULED windows; ON_DEMAND windows may be reserved up to window_end."

  - priority: 35
    category: business_temporal
    check: "window_start < window_end and the candidate interval does not overlap a non-CLOSED window of the same zone and courier_mode (half-open comparison)"
    error_id: "ERR_WINDOW_INTERVAL_INVALID | ERR_WINDOW_OVERLAP"
    http_status: 409
    applies_to: ["POST /delivery-windows"]
    description: "Adjacent intervals sharing an endpoint are legal; see §1.3 window_interval_overlap."

  - priority: 36
    category: business_temporal
    check: "The courier has no ACCEPTED assignment whose buffered closed interval touches the target window"
    error_id: ERR_COURIER_OVERLAP_CONFLICT
    http_status: 409
    applies_to: ["POST /deliveries/{id}/dispatch", "POST /courier-assignments/{id}/accept"]
    description: "Buffered by COURIER_TURNAROUND_BUFFER_MINUTES on both ends; see §1.3 courier_overlap_detection."

  - priority: 37
    category: business_temporal
    check: "clock >= Delivery.last_attempt_at + cooldown_minutes(attempt_count)"
    error_id: ERR_REATTEMPT_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: ["POST /deliveries/{id}/depart"]
    description: "60 minutes after the first failure, 180 after the second; at-boundary passes."

  # ---- business: capacity and money (evaluated last) ---------------------
  - priority: 38
    category: business_constraint
    check: "DeliveryWindow.available_slots >= 1 per §1.3 window_slot_occupancy"
    error_id: ERR_WINDOW_FULL
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate"]
    description: "Aggregate check: each individual reservation is legal but the collective exceeds capacity_slots."

  - priority: 39
    category: business_safety
    check: "The selector's candidate pool is non-empty when POST /deliveries/{id}/dispatch is called without courier_id"
    error_id: ERR_NO_ELIGIBLE_COURIER
    http_status: 409
    applies_to: ["POST /deliveries/{id}/dispatch"]
    description: "Empty-pool fallback of §1.3 courier_selection_rank; nothing is mutated."

  - priority: 40
    category: business_fiscal
    check: "For a MEDICAID plan, grant_eligible_cents == patient_gross_share_cents (the grant must fully absorb the member share)"
    error_id: ERR_GRANT_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
    description: "Last rule in the ladder. Deliberately loses to every state check — an order that is not READY reports ERR_ORDER_NOT_READY even when the grant is also short."

  - priority: 41
    category: business_fiscal
    check: "No ExceptionCase on the delivery has status IN {OPEN, UNDER_REVIEW} at settlement, and a delivery already linked to a reship cannot be adjudicated to RESHIP again"
    error_id: "ERR_EXCEPTION_PENDING | ERR_OVERRIDE_ADJUDICATION_CONFLICT"
    http_status: 409
    applies_to: ["POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
    description: "Money may not be finalized while an exception is live, and one delivery may spawn at most one reship."

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix "/" — every collection is top-level)
# =============================================================================
endpoints:
  # ---- reference data ----------------------------------------------------
  - method: POST
    path: /health-plans
    description: Register a payer and its member cost-share percentage.
    roles: [NetworkOps]
    code: 201
    input: [name, payer_type, member_cost_share_pct]
    output: HealthPlan
    side_effects: []

  - method: POST
    path: /plan-grants
    description: Fund a delivery-fee subsidy pool for one plan and benefit year.
    roles: [PlanAdministrator, NetworkOps]
    code: 201
    input: [health_plan_id, benefit_year, grant_budget_cents, per_delivery_cap_cents]
    output: PlanGrant
    side_effects:
      - "committed_cents and consumed_cents initialised to 0; remaining_cents := grant_budget_cents; status := ACTIVE"

  - method: POST
    path: /pharmacies
    description: Register a dispensing site with its cold-chain and controlled-substance credentials.
    roles: [NetworkOps]
    code: 201
    input: [name, state_code, "cold_chain_certified?", "controlled_license_tier?", "return_window_minutes?"]
    output: Pharmacy
    side_effects: []

  - method: POST
    path: /delivery-zones
    description: Define a serviced zone and its fee schedule.
    roles: [NetworkOps]
    code: 201
    input: [zone_code, distance_band_miles, base_fee_cents, per_mile_cents, cold_pack_fee_cents, controlled_handling_fee_cents, after_hours_fee_cents, "cold_chain_supported?", "controlled_delivery_allowed?"]
    output: DeliveryZone
    side_effects: []

  - method: POST
    path: /patients
    description: Register a delivery recipient.
    roles: [PharmacyOperator, NetworkOps]
    code: 201
    input: [full_name, date_of_birth, phone_last4, address_line, zone_code, "hipaa_consent_status?"]
    output: Patient
    side_effects:
      - "masked_name computed from full_name for courier-facing projections"

  - method: POST
    path: /patients/{id}/consent
    description: Record or revoke the patient's HIPAA delivery-disclosure consent.
    roles: [Patient, PharmacyOperator]
    code: 200
    input: [hipaa_consent_status]
    output: Patient
    side_effects:
      - "increments Patient.version by 1"

  - method: POST
    path: /couriers
    description: Onboard a courier with mode, served zones and handling certifications.
    roles: [NetworkOps]
    code: 201
    input: [display_name, mode, served_zone_codes, "cold_chain_equipped?", "controlled_certified?"]
    output: Courier
    side_effects:
      - "status := OFFLINE; active_delivery_count 0; both reliability scores initialised to 100.00"

  - method: POST
    path: /couriers/{id}/status
    description: Move a courier between OFFLINE, AVAILABLE and SUSPENDED.
    roles: [Courier, NetworkOps]
    code: 200
    input: [target_status]
    output: Courier
    side_effects:
      - "state machine Courier.status per §1.2"
      - "increments Courier.version by 1"

  - method: POST
    path: /delivery-windows
    description: Publish a capacity window for one zone and courier mode.
    roles: [NetworkOps]
    code: 201
    input: [zone_id, courier_mode, window_start, window_end, capacity_slots]
    output: DeliveryWindow
    side_effects:
      - "is_after_hours computed from window_start per §1.3 delivery_fee_subtotal"
      - "reserved_slots 0; available_slots := capacity_slots; status := OPEN"

  # ---- order intake ------------------------------------------------------
  - method: POST
    path: /pharmacy-orders
    description: Intake a filled prescription bundle awaiting delivery.
    roles: [PharmacyOperator]
    code: 201
    input: [pharmacy_id, patient_id, health_plan_id, rx_line_count, "cold_chain_required?", "controlled_schedule?", total_rx_value_cents]
    output: PharmacyOrder
    side_effects:
      - "status := INTAKE; hold_count 0"

  - method: POST
    path: /pharmacy-orders/{id}/mark-ready
    description: Release the order for delivery scheduling.
    roles: [PharmacyOperator]
    code: 200
    input: []
    output: PharmacyOrder
    side_effects:
      - "state machine PharmacyOrder INTAKE -> READY per §1.2"
      - "computes signature_required and required_id_verification per §1.3 handling_class_and_verification_requirements"
      - "increments PharmacyOrder.version by 1"

  - method: POST
    path: /pharmacy-orders/{id}/hold
    description: Pull a READY order back to INTAKE for re-verification.
    roles: [PharmacyOperator]
    code: 200
    input: ["notes?"]
    output: PharmacyOrder
    side_effects:
      - "state machine PharmacyOrder READY -> INTAKE per §1.2"
      - "hold_count += 1"
      - "increments PharmacyOrder.version by 1"

  # ---- delivery lifecycle -------------------------------------------------
  - method: POST
    path: /deliveries
    description: Reserve a window slot for a READY order and price it provisionally.
    roles: [PharmacyOperator]
    code: 201
    input: [order_id, window_id, expected_window_version]
    output: Delivery
    side_effects:
      - "custody_status := QUEUED; settlement_status := PROVISIONAL"
      - "copies handling_class, signature_required and required_id_verification off the order"
      - "DeliveryWindow.reserved_slots += 1; status := FULL when capacity is reached; increments DeliveryWindow.version by 1"
      - "PharmacyOrder.status := DISPATCHED; increments PharmacyOrder.version by 1"
      - "creates FeeAllocation(variant PROVISIONAL, status ACTIVE) per §1.3 delivery_fee_subtotal, patient_gross_cost_share and plan_grant_commitment_and_absorption"
      - "PlanGrant.committed_cents += allocation.plan_grant_cents; status recomputed; increments PlanGrant.version by 1"
      - "OCC: requires expected_window_version == DeliveryWindow.version (ERR_STALE_WINDOW_VERSION)"

  - method: POST
    path: /deliveries/{id}/reschedule
    description: Move an unpicked delivery to another window in the same zone and mode.
    roles: [PharmacyOperator, Patient]
    code: 200
    input: [window_id]
    output: Delivery
    side_effects:
      - "old DeliveryWindow.reserved_slots -= 1 and status := OPEN when it was FULL; new window reserved_slots += 1 and status := FULL when capacity is reached; increments both DeliveryWindow versions by 1"
      - "supersedes the ACTIVE PROVISIONAL FeeAllocation and computes a replacement, releasing and re-committing PlanGrant.committed_cents"
      - "any CourierAssignment with status IN {OFFERED, ACCEPTED} := REVOKED and the courier is released"
      - "increments Delivery.version by 1"

  - method: POST
    path: /deliveries/{id}/cancel
    description: Abandon a delivery before pickup and reverse every reservation it made.
    roles: [PharmacyOperator, Patient]
    code: 200
    input: ["notes?"]
    output: Delivery
    side_effects:
      - "custody_status := CANCELLED; settlement_status := VOIDED; fee_subtotal_cents := 0"
      - "DeliveryWindow.reserved_slots -= 1; status := OPEN when it was FULL; increments DeliveryWindow.version by 1"
      - "ACTIVE FeeAllocation.status := VOIDED; PlanGrant.committed_cents released; PlanGrant.status := ACTIVE when remaining_cents becomes > 0"
      - "live CourierAssignment := REVOKED; Courier.active_delivery_count and status adjusted"
      - "PharmacyOrder.status := READY; increments PharmacyOrder.version by 1"
      - "increments Delivery.version by 1"

  - method: POST
    path: /deliveries/{id}/dispatch
    description: Offer the delivery to a courier — selected by policy, or to an explicitly named courier.
    roles: [NetworkOps]
    code: 201
    input: ["courier_id?"]
    output: CourierAssignment
    side_effects:
      - "with courier_id absent: runs §1.3 courier_selection_rank over the candidate pool; empty pool -> ERR_NO_ELIGIBLE_COURIER and no mutation"
      - "with courier_id present: bypasses ranking but still enforces certification, zone, mode, suspension and overlap rules"
      - "creates CourierAssignment(status OFFERED, offered_at := clock, offer_expires_at := clock + OFFER_TTL_MINUTES, rank_score := the selected courier's rolling_reliability_score)"
      - "Delivery.custody_status stays QUEUED until the offer is accepted"

  - method: POST
    path: /courier-assignments/{id}/accept
    description: Courier accepts an outstanding offer and takes the delivery.
    roles: [Courier]
    code: 200
    input: []
    output: CourierAssignment
    side_effects:
      - "status := ACCEPTED; responded_at := clock"
      - "Delivery.custody_status := ASSIGNED; Delivery.courier_id := courier; increments Delivery.version by 1"
      - "Courier.status := ON_ROUTE; active_delivery_count += 1; increments Courier.version by 1"
      - "increments CourierAssignment.version by 1"

  - method: POST
    path: /courier-assignments/{id}/decline
    description: Courier turns down an offer, excluding itself from re-selection on that delivery.
    roles: [Courier]
    code: 200
    input: ["notes?"]
    output: CourierAssignment
    side_effects:
      - "status := DECLINED; responded_at := clock"
      - "Delivery.excluded_courier_ids += [courier_id]; custody_status stays QUEUED; increments Delivery.version by 1"
      - "increments CourierAssignment.version by 1"

  - method: POST
    path: /courier-assignments/{id}/revoke
    description: Ops pulls an offer or an accepted leg back from a courier.
    roles: [NetworkOps]
    code: 200
    input: ["notes?"]
    output: CourierAssignment
    side_effects:
      - "status := REVOKED; revoked_by_ops_user_id := X-User-ID"
      - "Delivery.excluded_courier_ids += [courier_id]; custody_status := QUEUED and courier_id := null when it was ASSIGNED; increments Delivery.version by 1"
      - "Courier.active_delivery_count -= 1 and status := AVAILABLE when it reaches 0; increments Courier.version by 1"
      - "the revoking ops user is barred from adjudicating exceptions on that delivery (§1.4 priority 11)"

  - method: POST
    path: /deliveries/{id}/pickup
    description: Courier takes custody at the pharmacy counter.
    roles: [Courier]
    code: 200
    input: ["cold_chain_seal_id?"]
    output: Delivery
    side_effects:
      - "custody_status := PICKED_UP; picked_up_at := clock; cold_chain_seal_id stored"
      - "increments Delivery.version by 1"

  - method: POST
    path: /deliveries/{id}/depart
    description: Courier leaves for the patient's address, either on the first run or on a ladder re-attempt.
    roles: [Courier]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "custody_status := OUT_FOR_DELIVERY from PICKED_UP or from ATTEMPT_FAILED"
      - "enforces §1.3 reattempt_ladder cooldown and exhaustion gates"
      - "increments Delivery.version by 1"

  - method: POST
    path: /deliveries/{id}/attempts
    description: Record the outcome of one door-step run, with proof-of-delivery capture.
    roles: [Courier]
    code: 201
    input: [requested_outcome, "id_verification_method?", "signature_captured?", "recipient_relationship?", "pod_photo_ref?"]
    output: DeliveryAttempt
    side_effects:
      - "computes elapsed_since_pickup_minutes and applies the cold-excursion override: requested_outcome is replaced by COLD_BREACH when the handling class is cold and the excursion budget is exceeded"
      - "attempt_no := Delivery.attempt_count + 1; reliability_credit per §1.3 courier_reliability_scores"
      - "routes Delivery.custody_status to DELIVERED, ATTEMPT_FAILED or RETURN_PENDING per §1.3 reattempt_ladder; increments Delivery.version by 1"
      - "recomputes Courier rolling and lifetime reliability scores and may cascade Courier.status := SUSPENDED; increments Courier.version by 1"
      - "on DELIVERED or RETURN_PENDING: releases the window slot and closes out the CourierAssignment; increments DeliveryWindow and CourierAssignment versions by 1"
      - "on RETURN_PENDING: opens an ExceptionCase with opened_by_ops_user_id null"
      - "on COLD_BREACH: voids the ACTIVE FeeAllocation, sets settlement_status := VOIDED and releases PlanGrant.committed_cents; increments FeeAllocation and PlanGrant versions by 1"

  - method: POST
    path: /deliveries/{id}/confirm-return
    description: Pharmacy confirms physical receipt of an undelivered bag.
    roles: [PharmacyOperator]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "custody_status := RETURNED"
      - "PharmacyOrder.status := RETURNED_TO_STOCK; increments PharmacyOrder.version by 1"
      - "increments Delivery.version by 1"

  - method: POST
    path: /deliveries/{id}/settle
    description: Finalize the money dimension, replacing the provisional bill with the FINAL variant.
    roles: [NetworkOps]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "PROVISIONAL FeeAllocation.status := SUPERSEDED and its plan_grant_cents released from PlanGrant.committed_cents"
      - "creates FeeAllocation(variant FINAL, status ACTIVE) per §1.3 delivery_fee_subtotal variant FINAL"
      - "PlanGrant.consumed_cents += final plan_grant_cents; status recomputed; increments PlanGrant.version by 1"
      - "settlement_status := FINALIZED; fee_subtotal_cents := the FINAL subtotal"
      - "PharmacyOrder.status := CLOSED when custody_status == DELIVERED; increments PharmacyOrder.version by 1"
      - "increments Delivery.version by 1"

  # ---- exception handling -------------------------------------------------
  - method: POST
    path: /exception-cases
    description: Open an exception on a delivery by hand (system-opened cases arrive via the attempt cascade).
    roles: [NetworkOps, PharmacyOperator]
    code: 201
    input: [delivery_id, exception_type, "notes?"]
    output: ExceptionCase
    side_effects:
      - "status := OPEN; opened_by_ops_user_id := X-User-ID when the caller is NetworkOps, else null"

  - method: POST
    path: /exception-cases/{id}/start-review
    description: Ops takes the case up for adjudication.
    roles: [NetworkOps]
    code: 200
    input: []
    output: ExceptionCase
    side_effects:
      - "status := UNDER_REVIEW"
      - "increments ExceptionCase.version by 1"

  - method: POST
    path: /exception-cases/{id}/adjudicate
    description: Fork the case into a reship, a fee credit, or a denial.
    roles: [NetworkOps]
    code: 200
    input: [disposition, expected_delivery_version, "reship_window_id?", "notes?"]
    output: ExceptionCase
    side_effects:
      - "OCC: requires expected_delivery_version == Delivery.version (ERR_STALE_DELIVERY_VERSION)"
      - "segregation of duties: the case opener and any assignment revoker on that delivery are barred (ERR_SEGREGATION_OF_DUTIES)"
      - "RESHIP: creates a replacement Delivery(custody QUEUED, settlement PROVISIONAL, reship_of_delivery_id := original), reserves a slot on reship_window_id, computes a PROVISIONAL FeeAllocation and commits PlanGrant funds; sets reship_delivery_id"
      - "CREDIT: Delivery.settlement_status := WAIVED, ACTIVE FeeAllocation.status := VOIDED, PlanGrant.committed_cents released, credit_cents := the voided subtotal"
      - "DENY: no financial or physical effect; credit_cents := 0"
      - "increments Delivery.version by 1 and ExceptionCase.version by 1"

  - method: POST
    path: /exception-cases/{id}/close
    description: Join the three adjudication branches back into CLOSED.
    roles: [NetworkOps]
    code: 200
    input: []
    output: ExceptionCase
    side_effects:
      - "status := CLOSED"
      - "increments ExceptionCase.version by 1"

  # ---- sweeps and clock ---------------------------------------------------
  - method: POST
    path: /routing-runs
    description: Sweep expired offers and elapsed windows, then offer every unassigned QUEUED delivery.
    roles: [NetworkOps]
    code: 200
    input: []
    output: { expired_offer_count: integer, closed_window_count: integer, offers_created_count: integer, offered_delivery_ids: string }
    side_effects:
      - "every CourierAssignment with status OFFERED and clock >= offer_expires_at := EXPIRED, adding the courier to the delivery's excluded_courier_ids"
      - "every DeliveryWindow with clock >= window_end and status != CLOSED := CLOSED"
      - "for each QUEUED delivery with no OFFERED assignment, in created_at ASC order, runs §1.3 courier_selection_rank and creates an offer where the pool is non-empty; deliveries with an empty pool are skipped silently"

  - method: POST
    path: /_clock/set_current_utc
    description: Set the logical clock that every temporal rule reads.
    roles: [NetworkOps]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "the clock defaults to 2026-08-01T00:00:00Z until this endpoint is called"

  # ---- reads -------------------------------------------------------------
  - method: GET
    path: /plan-grants/{id}
    description: Read one grant pool with its live commitment ledger.
    roles: [PlanAdministrator, NetworkOps]
    code: 200
    input: []
    output: PlanGrant
    side_effects: []

  - method: GET
    path: /plan-grants
    description: List grant pools.
    roles: [PlanAdministrator, NetworkOps]
    code: 200
    input: ["health_plan_id?", "benefit_year?", "status?", "limit?", "offset?"]
    output: PlanGrant[]
    side_effects: []

  - method: GET
    path: /delivery-windows/{id}
    description: Read one capacity window with occupancy.
    roles: [PharmacyOperator, Patient, Courier, NetworkOps]
    code: 200
    input: []
    output: DeliveryWindow
    side_effects: []

  - method: GET
    path: /delivery-windows
    description: List capacity windows.
    roles: [PharmacyOperator, Patient, Courier, NetworkOps]
    code: 200
    input: ["zone_id?", "courier_mode?", "status?", "limit?", "offset?"]
    output: DeliveryWindow[]
    side_effects: []

  - method: GET
    path: /pharmacy-orders/{id}
    description: Read one order.
    roles: [PharmacyOperator, Patient, NetworkOps]
    code: 200
    input: []
    output: PharmacyOrder
    side_effects: []

  - method: GET
    path: /pharmacy-orders
    description: List orders.
    roles: [PharmacyOperator, Patient, PlanAdministrator, NetworkOps]
    code: 200
    input: ["pharmacy_id?", "patient_id?", "health_plan_id?", "status?", "limit?", "offset?"]
    output: PharmacyOrder[]
    side_effects: []

  - method: GET
    path: /couriers/{id}
    description: Read one courier with both reliability scores.
    roles: [Courier, NetworkOps]
    code: 200
    input: []
    output: Courier
    side_effects: []

  - method: GET
    path: /couriers/{id}/disclosures
    description: Audit trail of every PHI projection this courier has been shown.
    roles: [Courier, NetworkOps]
    code: 200
    input: ["limit?", "offset?"]
    output: CourierDataDisclosure[]
    side_effects: []

  - method: GET
    path: /deliveries/{id}
    description: Read one delivery with both state dimensions and the full PHI payload.
    roles: [PharmacyOperator, Patient, PlanAdministrator, NetworkOps]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: GET
    path: /deliveries
    description: List deliveries with filters over both state dimensions and every relationship.
    roles: [PharmacyOperator, Patient, PlanAdministrator, NetworkOps]
    code: 200
    input: ["order_id?", "window_id?", "courier_id?", "reship_of_delivery_id?", "custody_status?", "settlement_status?", "limit?", "offset?"]
    output: Delivery[]
    side_effects: []

  - method: GET
    path: /deliveries/{id}/courier-view
    description: HIPAA minimum-necessary projection of a delivery for the assigned courier.
    roles: [Courier, NetworkOps]
    code: 200
    input: ["purpose?"]
    output: { delivery_id: string, order_id: string, patient_masked_name: string, patient_phone_last4: string, address_line: string, window_start: string, window_end: string, handling_class: string, signature_required: boolean, required_id_verification: string, rx_line_count: integer, redacted_field_count: integer, disclosure_id: string }
    side_effects:
      - "appends a CourierDataDisclosure row recording purpose (default DELIVERY_EXECUTION), fields_disclosed, redacted_field_count and minimization_profile"
      - "never exposes full_name, date_of_birth, total_rx_value_cents, controlled_schedule, health_plan_id or any fee figure"

  - method: GET
    path: /deliveries/{id}/disclosures
    description: Audit trail of every courier who has been shown this delivery's PHI.
    roles: [PharmacyOperator, Patient, NetworkOps]
    code: 200
    input: ["limit?", "offset?"]
    output: CourierDataDisclosure[]
    side_effects: []

  - method: GET
    path: /courier-assignments/{id}
    description: Read one offer or accepted leg.
    roles: [Courier, NetworkOps]
    code: 200
    input: []
    output: CourierAssignment
    side_effects: []

  - method: GET
    path: /courier-assignments
    description: List assignments.
    roles: [Courier, NetworkOps]
    code: 200
    input: ["delivery_id?", "courier_id?", "status?", "limit?", "offset?"]
    output: CourierAssignment[]
    side_effects: []

  - method: GET
    path: /delivery-attempts/{id}
    description: Read one immutable door-step attempt record.
    roles: [Courier, PharmacyOperator, NetworkOps]
    code: 200
    input: []
    output: DeliveryAttempt
    side_effects: []

  - method: GET
    path: /delivery-attempts
    description: List attempts, the raw input of both reliability variants.
    roles: [Courier, PharmacyOperator, NetworkOps]
    code: 200
    input: ["delivery_id?", "courier_id?", "outcome?", "limit?", "offset?"]
    output: DeliveryAttempt[]
    side_effects: []

  - method: GET
    path: /fee-allocations/{id}
    description: Read one payer-mix allocation with its full line vector.
    roles: [PharmacyOperator, PlanAdministrator, NetworkOps]
    code: 200
    input: []
    output: FeeAllocation
    side_effects: []

  - method: GET
    path: /fee-allocations
    description: List allocations, including superseded and voided history.
    roles: [PharmacyOperator, PlanAdministrator, NetworkOps]
    code: 200
    input: ["delivery_id?", "plan_grant_id?", "variant?", "status?", "limit?", "offset?"]
    output: FeeAllocation[]
    side_effects: []

  - method: GET
    path: /exception-cases/{id}
    description: Read one exception case with its disposition and reship link.
    roles: [NetworkOps, PharmacyOperator, PlanAdministrator]
    code: 200
    input: []
    output: ExceptionCase
    side_effects: []

  - method: GET
    path: /exception-cases
    description: List exception cases.
    roles: [NetworkOps, PharmacyOperator, PlanAdministrator]
    code: 200
    input: ["delivery_id?", "reship_delivery_id?", "exception_type?", "status?", "limit?", "offset?"]
    output: ExceptionCase[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header absent or empty"
    applies_to: ["all"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "Caller's role is not in the endpoint's roles list"
    applies_to: ["all"]
  - id: ERR_PHARMACY_SCOPE_VIOLATION
    http_status: 403
    condition: "PharmacyOperator acting on an order or delivery belonging to another pharmacy"
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /pharmacy-orders/{id}/hold", "POST /deliveries", "POST /deliveries/{id}/cancel", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/confirm-return", "GET /pharmacy-orders/{id}", "GET /deliveries/{id}"]
  - id: ERR_PATIENT_SCOPE_VIOLATION
    http_status: 403
    condition: "Patient acting on another patient's order, delivery or consent record"
    applies_to: ["POST /patients/{id}/consent", "POST /deliveries/{id}/cancel", "POST /deliveries/{id}/reschedule", "GET /deliveries/{id}", "GET /pharmacy-orders/{id}"]
  - id: ERR_COURIER_SCOPE_VIOLATION
    http_status: 403
    condition: "Courier acting on another courier's assignment, delivery or profile"
    applies_to: ["POST /couriers/{id}/status", "POST /courier-assignments/{id}/accept", "POST /courier-assignments/{id}/decline", "POST /deliveries/{id}/pickup", "POST /deliveries/{id}/depart", "POST /deliveries/{id}/attempts", "GET /couriers/{id}", "GET /couriers/{id}/disclosures"]
  - id: ERR_PLAN_SCOPE_VIOLATION
    http_status: 403
    condition: "PlanAdministrator reaching a grant, allocation or delivery outside its own health plan"
    applies_to: ["POST /plan-grants", "GET /plan-grants/{id}", "GET /plan-grants", "GET /fee-allocations/{id}", "GET /fee-allocations", "GET /deliveries/{id}"]
  - id: ERR_HIPAA_SCOPE_VIOLATION
    http_status: 403
    condition: "Courier requests the courier-view projection of a delivery it holds no assignment on"
    applies_to: ["GET /deliveries/{id}/courier-view"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "The adjudicating ops user opened the case, or revoked a CourierAssignment on the case's delivery"
    applies_to: ["POST /exception-cases/{id}/adjudicate"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Malformed body, missing required field, bad enum member, out-of-range number, bad ISO-8601, or pagination outside limit 1..100 / offset >= 0"
    applies_to: ["all"]
  - id: ERR_ORDER_NOT_FOUND
    http_status: 404
    condition: "order_id in the path or body names no PharmacyOrder"
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /pharmacy-orders/{id}/hold", "POST /deliveries", "GET /pharmacy-orders/{id}"]
  - id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    condition: "patient_id in the path or body names no Patient"
    applies_to: ["POST /patients/{id}/consent", "POST /pharmacy-orders"]
  - id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    condition: "delivery id in the path or body names no Delivery"
    applies_to: ["POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/cancel", "POST /deliveries/{id}/dispatch", "POST /deliveries/{id}/pickup", "POST /deliveries/{id}/depart", "POST /deliveries/{id}/attempts", "POST /deliveries/{id}/confirm-return", "POST /deliveries/{id}/settle", "POST /exception-cases", "GET /deliveries/{id}", "GET /deliveries/{id}/courier-view", "GET /deliveries/{id}/disclosures"]
  - id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    condition: "window_id, reship_window_id or the path window id names no DeliveryWindow"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate", "GET /delivery-windows/{id}"]
  - id: ERR_COURIER_NOT_FOUND
    http_status: 404
    condition: "courier_id in the path or body names no Courier"
    applies_to: ["POST /couriers/{id}/status", "POST /deliveries/{id}/dispatch", "GET /couriers/{id}", "GET /couriers/{id}/disclosures"]
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "Path id names no CourierAssignment"
    applies_to: ["POST /courier-assignments/{id}/accept", "POST /courier-assignments/{id}/decline", "POST /courier-assignments/{id}/revoke", "GET /courier-assignments/{id}"]
  - id: ERR_EXCEPTION_CASE_NOT_FOUND
    http_status: 404
    condition: "Path id names no ExceptionCase"
    applies_to: ["POST /exception-cases/{id}/start-review", "POST /exception-cases/{id}/adjudicate", "POST /exception-cases/{id}/close", "GET /exception-cases/{id}"]
  - id: ERR_PLAN_GRANT_NOT_FOUND
    http_status: 404
    condition: "Path id names no PlanGrant"
    applies_to: ["GET /plan-grants/{id}"]
  - id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    condition: "Path id names no FeeAllocation"
    applies_to: ["GET /fee-allocations/{id}"]
  - id: ERR_ATTEMPT_NOT_FOUND
    http_status: 404
    condition: "Path id names no DeliveryAttempt"
    applies_to: ["GET /delivery-attempts/{id}"]
  - id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    condition: "A referenced HealthPlan, Pharmacy or DeliveryZone (by id or zone_code) does not exist"
    applies_to: ["POST /plan-grants", "POST /patients", "POST /couriers", "POST /delivery-windows", "POST /pharmacy-orders"]
  - id: ERR_ORDER_NOT_READY
    http_status: 409
    condition: "PharmacyOrder.status != READY where READY is required"
    applies_to: ["POST /deliveries", "POST /pharmacy-orders/{id}/hold"]
  - id: ERR_INVALID_ORDER_STATE
    http_status: 409
    condition: "PharmacyOrder.status is not in the operation's allowed from-set (e.g. mark-ready on a DISPATCHED order, pickup on a non-DISPATCHED order)"
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /deliveries/{id}/pickup"]
  - id: ERR_INVALID_CUSTODY_STATE
    http_status: 409
    condition: "Delivery.custody_status is not in the operation's allowed from-set, including all terminal states"
    applies_to: ["POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/cancel", "POST /deliveries/{id}/dispatch", "POST /deliveries/{id}/pickup", "POST /deliveries/{id}/depart", "POST /deliveries/{id}/attempts", "POST /deliveries/{id}/confirm-return", "POST /deliveries/{id}/settle", "POST /exception-cases"]
  - id: ERR_INVALID_SETTLEMENT_STATE
    http_status: 409
    condition: "Delivery.settlement_status != PROVISIONAL where the money dimension must still be open"
    applies_to: ["POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    condition: "CourierAssignment.status is not in the operation's allowed from-set"
    applies_to: ["POST /courier-assignments/{id}/accept", "POST /courier-assignments/{id}/decline", "POST /courier-assignments/{id}/revoke"]
  - id: ERR_OFFER_EXPIRED
    http_status: 409
    condition: "clock >= CourierAssignment.offer_expires_at at accept time"
    applies_to: ["POST /courier-assignments/{id}/accept"]
  - id: ERR_INVALID_EXCEPTION_STATE
    http_status: 409
    condition: "ExceptionCase.status is not in the operation's allowed from-set, including adjudicating straight out of OPEN"
    applies_to: ["POST /exception-cases/{id}/start-review", "POST /exception-cases/{id}/adjudicate", "POST /exception-cases/{id}/close"]
  - id: ERR_COURIER_SUSPENDED
    http_status: 409
    condition: "Courier.status == SUSPENDED at dispatch or accept time"
    applies_to: ["POST /deliveries/{id}/dispatch", "POST /courier-assignments/{id}/accept"]
  - id: ERR_COURIER_UNAVAILABLE
    http_status: 409
    condition: "Courier.status == OFFLINE at dispatch or accept time (a courier must at least be on shift)"
    applies_to: ["POST /deliveries/{id}/dispatch", "POST /courier-assignments/{id}/accept"]
  - id: ERR_INVALID_COURIER_STATE
    http_status: 409
    condition: "Illegal Courier.status transition: going OFFLINE with active_delivery_count > 0, or a Courier clearing its own SUSPENDED status"
    applies_to: ["POST /couriers/{id}/status"]
  - id: ERR_WINDOW_CLOSED
    http_status: 409
    condition: "DeliveryWindow.status == CLOSED, or FULL by status flag where a reservation is required"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/depart"]
  - id: ERR_GRANT_NOT_APPLICABLE
    http_status: 409
    condition: "The order's health plan has no ACTIVE PlanGrant whose benefit_year equals the UTC year of the target window_start"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_STALE_WINDOW_VERSION
    http_status: 412
    condition: "expected_window_version != DeliveryWindow.version"
    applies_to: ["POST /deliveries"]
  - id: ERR_STALE_DELIVERY_VERSION
    http_status: 412
    condition: "expected_delivery_version != Delivery.version"
    applies_to: ["POST /exception-cases/{id}/adjudicate"]
  - id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    condition: "Patient.hipaa_consent_status != GRANTED"
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready", "POST /deliveries"]
  - id: ERR_CONTROLLED_NOT_LICENSED
    http_status: 409
    condition: "Pharmacy.controlled_license_tier does not cover the order's controlled_schedule, or the site is not cold_chain_certified for a cold order"
    applies_to: ["POST /pharmacy-orders/{id}/mark-ready"]
  - id: ERR_CONTROLLED_ZONE_PROHIBITED
    http_status: 409
    condition: "DeliveryZone.controlled_delivery_allowed is false for a CONTROLLED or COLD_CHAIN_CONTROLLED delivery"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule"]
  - id: ERR_COLD_CHAIN_UNSUPPORTED_ZONE
    http_status: 409
    condition: "DeliveryZone.cold_chain_supported is false for a COLD_CHAIN or COLD_CHAIN_CONTROLLED delivery"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule"]
  - id: ERR_COURIER_NOT_COLD_CERTIFIED
    http_status: 409
    condition: "Explicitly named courier is not cold_chain_equipped for a cold delivery"
    applies_to: ["POST /deliveries/{id}/dispatch"]
  - id: ERR_COURIER_NOT_CONTROLLED_CERTIFIED
    http_status: 409
    condition: "Explicitly named courier is not controlled_certified for a controlled delivery"
    applies_to: ["POST /deliveries/{id}/dispatch"]
  - id: ERR_COURIER_ZONE_NOT_SERVED
    http_status: 409
    condition: "Explicitly named courier's served_zone_codes does not contain the window zone's zone_code"
    applies_to: ["POST /deliveries/{id}/dispatch"]
  - id: ERR_COURIER_MODE_MISMATCH
    http_status: 409
    condition: "Explicitly named courier's mode differs from DeliveryWindow.courier_mode"
    applies_to: ["POST /deliveries/{id}/dispatch"]
  - id: ERR_COLD_SEAL_REQUIRED
    http_status: 409
    condition: "cold_chain_seal_id absent at pickup for a COLD_CHAIN or COLD_CHAIN_CONTROLLED delivery"
    applies_to: ["POST /deliveries/{id}/pickup"]
  - id: ERR_SIGNATURE_REQUIRED
    http_status: 409
    condition: "signature_captured is absent or false while recording a DELIVERED outcome on a signature_required delivery"
    applies_to: ["POST /deliveries/{id}/attempts"]
  - id: ERR_UNATTENDED_NOT_PERMITTED
    http_status: 409
    condition: "recipient_relationship == UNATTENDED while recording a DELIVERED outcome on a signature_required delivery"
    applies_to: ["POST /deliveries/{id}/attempts"]
  - id: ERR_ID_VERIFICATION_INSUFFICIENT
    http_status: 409
    condition: "id_verification_method ranks below Delivery.required_id_verification while recording DELIVERED"
    applies_to: ["POST /deliveries/{id}/attempts"]
  - id: ERR_ZONE_NOT_SERVICED
    http_status: 409
    condition: "Patient.zone_code names no DeliveryZone"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule"]
  - id: ERR_ZONE_MISMATCH
    http_status: 409
    condition: "Target DeliveryWindow.zone_id is not the patient's zone, or a reship window sits in a different zone from the original"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_WINDOW_MODE_MISMATCH
    http_status: 409
    condition: "Replacement or reship window's courier_mode differs from the delivery's current window courier_mode"
    applies_to: ["POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_DUPLICATE_ACTIVE_DELIVERY
    http_status: 409
    condition: "The order already has a Delivery other than the one addressed by the request whose custody_status is not CANCELLED or RETURNED — in practice a second RESHIP adjudication for an order that already carries a reship Delivery"
    applies_to: ["POST /deliveries", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_MAX_HOLDS_EXCEEDED
    http_status: 409
    condition: "PharmacyOrder.hold_count is already MAX_ORDER_HOLDS (2)"
    applies_to: ["POST /pharmacy-orders/{id}/hold"]
  - id: ERR_WINDOW_ELAPSED
    http_status: 409
    condition: "clock >= DeliveryWindow.window_end, or a SCHEDULED reservation arrives later than window_start - DISPATCH_LEAD_MINUTES"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/dispatch", "POST /deliveries/{id}/depart"]
  - id: ERR_WINDOW_INTERVAL_INVALID
    http_status: 409
    condition: "window_start >= window_end"
    applies_to: ["POST /delivery-windows"]
  - id: ERR_WINDOW_OVERLAP
    http_status: 409
    condition: "Candidate window's half-open interval overlaps a non-CLOSED window of the same zone and courier_mode"
    applies_to: ["POST /delivery-windows"]
  - id: ERR_COURIER_OVERLAP_CONFLICT
    http_status: 409
    condition: "The courier already holds an ACCEPTED assignment whose buffered closed interval touches the target window"
    applies_to: ["POST /deliveries/{id}/dispatch", "POST /courier-assignments/{id}/accept"]
  - id: ERR_REATTEMPT_COOLDOWN_ACTIVE
    http_status: 409
    condition: "clock < Delivery.last_attempt_at + cooldown_minutes(attempt_count)"
    applies_to: ["POST /deliveries/{id}/depart"]
  - id: ERR_WINDOW_FULL
    http_status: 409
    condition: "DeliveryWindow.available_slots is 0"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_NO_ELIGIBLE_COURIER
    http_status: 409
    condition: "Selector candidate pool is empty on a dispatch without an explicit courier_id"
    applies_to: ["POST /deliveries/{id}/dispatch"]
  - id: ERR_GRANT_COVERAGE_INSUFFICIENT
    http_status: 409
    condition: "MEDICAID plan whose grant cannot fully absorb patient_gross_share_cents (cap or remaining_cents too low)"
    applies_to: ["POST /deliveries", "POST /deliveries/{id}/reschedule", "POST /deliveries/{id}/settle", "POST /exception-cases/{id}/adjudicate"]
  - id: ERR_EXCEPTION_PENDING
    http_status: 409
    condition: "An ExceptionCase on the delivery is still OPEN or UNDER_REVIEW at settlement"
    applies_to: ["POST /deliveries/{id}/settle"]
  - id: ERR_OVERRIDE_ADJUDICATION_CONFLICT
    http_status: 409
    condition: "The delivery is already linked to a reship, or disposition RESHIP arrives without reship_window_id"
    applies_to: ["POST /exception-cases/{id}/adjudicate"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: PharmacyOperator
    description: "Dispensing-site staff. Owns order intake, delivery scheduling, cancellation and physical return receipt."
    identity: "entity_backed:Pharmacy"
    exclusive_operations:
      - "POST /pharmacy-orders"
      - "POST /pharmacy-orders/{id}/mark-ready"
      - "POST /pharmacy-orders/{id}/hold"
      - "POST /deliveries"
      - "POST /deliveries/{id}/confirm-return"
    shared_operations:
      - "POST /patients (with NetworkOps)"
      - "POST /patients/{id}/consent (with Patient)"
      - "POST /deliveries/{id}/reschedule (with Patient)"
      - "POST /deliveries/{id}/cancel (with Patient)"
      - "POST /exception-cases (with NetworkOps)"
      - "GET /pharmacy-orders/{id}, GET /pharmacy-orders, GET /deliveries/{id}, GET /deliveries, GET /deliveries/{id}/disclosures, GET /delivery-windows/{id}, GET /delivery-windows, GET /delivery-attempts/{id}, GET /delivery-attempts, GET /fee-allocations/{id}, GET /fee-allocations, GET /exception-cases/{id}, GET /exception-cases"

  - name: Patient
    description: "Delivery recipient. May grant or revoke HIPAA disclosure consent and reschedule or cancel their own delivery."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /patients/{id}/consent (with PharmacyOperator)"
      - "POST /deliveries/{id}/reschedule (with PharmacyOperator)"
      - "POST /deliveries/{id}/cancel (with PharmacyOperator)"
      - "GET /deliveries/{id}, GET /deliveries, GET /deliveries/{id}/disclosures, GET /pharmacy-orders/{id}, GET /pharmacy-orders, GET /delivery-windows/{id}, GET /delivery-windows"
    note: "Has no exclusive operation of its own: every action a patient can take is one a pharmacy operator can also take on their behalf. The differentiator is scope, not capability."

  - name: Courier
    description: "Network driver. Accepts or declines offers, takes custody, departs, records door-step attempts, and toggles its own availability."
    identity: "entity_backed:Courier"
    exclusive_operations:
      - "POST /courier-assignments/{id}/accept"
      - "POST /courier-assignments/{id}/decline"
      - "POST /deliveries/{id}/pickup"
      - "POST /deliveries/{id}/depart"
      - "POST /deliveries/{id}/attempts"
      - "GET /deliveries/{id}/courier-view"
    shared_operations:
      - "POST /couriers/{id}/status (with NetworkOps, but a Courier cannot clear its own SUSPENDED status)"
      - "GET /couriers/{id}, GET /couriers/{id}/disclosures, GET /courier-assignments/{id}, GET /courier-assignments, GET /delivery-attempts/{id}, GET /delivery-attempts, GET /delivery-windows/{id}, GET /delivery-windows"
    note: "A Courier never sees GET /deliveries/{id}; its only delivery read is the redacted courier-view projection, and only while it holds an assignment."

  - name: NetworkOps
    description: "ScriptDrop network operations. Owns reference data, routing, settlement, sweeps and exception adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-plans"
      - "POST /pharmacies"
      - "POST /delivery-zones"
      - "POST /couriers"
      - "POST /delivery-windows"
      - "POST /deliveries/{id}/dispatch"
      - "POST /courier-assignments/{id}/revoke"
      - "POST /deliveries/{id}/settle"
      - "POST /exception-cases/{id}/start-review"
      - "POST /exception-cases/{id}/adjudicate"
      - "POST /exception-cases/{id}/close"
      - "POST /routing-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /plan-grants (with PlanAdministrator)"
      - "POST /patients (with PharmacyOperator)"
      - "POST /couriers/{id}/status (with Courier)"
      - "POST /exception-cases (with PharmacyOperator)"
      - "every GET endpoint"
    note: "Segregation of duties operates inside this single role: the ops user who opened a case, or who revoked a courier assignment on that delivery, cannot adjudicate it, so two distinct X-User-ID values are required to complete the exception workflow."

  - name: PlanAdministrator
    description: "Health-plan payer administrator. Funds grant pools and audits the allocations drawn against them."
    identity: "entity_backed:HealthPlan"
    exclusive_operations: []
    shared_operations:
      - "POST /plan-grants (with NetworkOps)"
      - "GET /plan-grants/{id}, GET /plan-grants, GET /fee-allocations/{id}, GET /fee-allocations, GET /deliveries/{id}, GET /deliveries, GET /pharmacy-orders, GET /exception-cases/{id}, GET /exception-cases"
    note: "Read-heavy payer role; may never touch custody, routing or settlement, and never sees Patient rows directly."
