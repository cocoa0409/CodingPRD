      - name: lot_has_failing_test_blocks_accept
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_LOT_HAS_FAILING_TEST]
        distinguishing_aspect: "Latest MICRO result is FAIL: ACCEPT is blocked by ERR_LOT_HAS_FAILING_TEST (safety, priority 12) even though the suite is ALSO incomplete (priority 17) — safety outranks suite completeness."
        test_recipe:
          setup: ["supplier S; lot IN_TEST with MICRO FAIL (200000), ADULTERANT_SCREEN PASS (0.5), MOISTURE PASS (8.0)"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: OREGANO, origin_region: "Lesvos", crop_year: 2025, quantity_kg: 40, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 200000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r_fail: $.data.result } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 0.5, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { st: $.data.status } }
          assert:
            - "${r_fail} == FAIL (200000 > 100000)"
            - "${err} == ERR_LOT_HAS_FAILING_TEST (HTTP 409) — NOT ERR_TEST_SUITE_INCOMPLETE, which also applies (no MICRO PASS on record); safety priority 12 beats constraint priority 17"
            - "${st} == IN_TEST (no transition)"

