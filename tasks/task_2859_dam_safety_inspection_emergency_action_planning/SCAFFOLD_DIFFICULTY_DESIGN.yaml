              captures: { event_id: "$.data.id" }
            - call: "POST /drawdown-orders"
              payload: { dam_id: "${dam_id}", high_water_event_id: "${event_id}", requested_release_cfs: 400, window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: EmergencyCoordinator
              captures: { order_id: "$.data.id" }
            - call: "GET /river-reaches/${reach_id}"
              payload: {}
              as: ProgramAdmin
              captures: { reach_v1: "$.data.version" }
            - call: "POST /drawdown-orders/${order_id}/coordinate"
              payload: { expected_reach_version: "${reach_v1}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /drawdown-orders/${order_id}/cancel"
              payload: { reason: "Forecast revised downward; release no longer required." }
              as: EmergencyCoordinator
          assert:
            - "before the trigger: Dam.${dam_id}.committed_drawdown_acre_ft == 198.347 and available_conservation_storage_acre_ft == 1301.653, summing to exactly 1500.000"
            - "before the trigger: RiverReach.${reach_id}.committed_release_cfs == 400 and active_drawdown_count == 1"
            - "after the trigger: DrawdownOrder.${order_id}.status == CANCELLED, cancelled_at == 2026-08-01T00:00:00Z, cancel_reason stored, actual_release_acre_ft == null"
            - "after the trigger: Dam.${dam_id}.committed_drawdown_acre_ft == 0.000 and available_conservation_storage_acre_ft == 1500.000, summing to exactly 1500.000"
            - "after the trigger: RiverReach.${reach_id}.committed_release_cfs == 0 and active_drawdown_count == 0"
            - "DrawdownOrder.${order_id}.planned_release_acre_ft is still 198.347 - the cancel releases the commitment without rewriting the plan"
            - "no rounding residue: the released volume is bit-for-bit the 198.347 that was committed, not 198.346 or 198.348"

      - name: fee_void_entry_returns_the_owner_ledger_to_a_zero_balance
        grounds:
          - calculations.owner_fee_balance_and_delinquency
          - calculations.permit_fee_schedule
          - entities.FeeLedgerEntry.fields.amount_cents
          - entities.FeeLedgerEntry.fields.balance_after_cents
          - validations[priority=40]
          - errors[ERR_LEDGER_SIGN_MISMATCH]
        distinguishing_aspect: |
          A different conserved quantity from the drawdown instance - money in the owner's fee ledger
          rather than reservoir volume - and a compensation that is appended rather than subtracted in
          place: the ledger keeps both rows and the invariant is that the last row's
          balance_after_cents, the sum of every amount_cents and Owner.fee_balance_cents are all the
          same number. Voiding the 166000-cent review fee returns the balance to 0 and the owner to
          CURRENT while the Permit's own total_fee_cents stays 166000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SIGNIFICANT dam (score 6.60) and an owner starting at a zero balance, CURRENT."
            - "One CONSTRUCTION permit for 8,000,000 cents: base 100000 + review round_half_up(8000000 * 0.0075 * 1.10) = 66000, no surcharge, pre-credit 166000 < 500000 so no credit; total_fee_cents 166000 posted to the ledger, which pushes the owner to DELINQUENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /permits"
              payload: { dam_id: "${dam_id}", permit_type: "CONSTRUCTION", scope_description: "New crest gates on the service spillway.", estimated_project_cost_cents: 8000000, proposed_start_date: "2026-10-01T00:00:00Z" }
              as: DamOwner
              as_user_id: "${owner_id}"
              captures: { permit_id: "$.data.id", posted_total: "$.data.total_fee_cents" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "FEE_VOID", amount_cents: -166000, source_ref: "${permit_id}", memo: "Review fee voided; application withdrawn from the fee schedule." }
              as: ProgramAdmin
              captures: { void_entry_id: "$.data.id", void_balance: "$.data.balance_after_cents" }
          assert:
            - "before the trigger: Owner.${owner_id}.fee_balance_cents == 166000 and delinquency_status == DELINQUENT"
            - "before the trigger the ledger holds one row: sequence_no 1, entry_type PERMIT_REVIEW_FEE, amount_cents 166000, balance_after_cents 166000"
            - "after the trigger the ledger holds exactly two rows and the second is sequence_no 2, entry_type FEE_VOID, amount_cents -166000, balance_after_cents 0, source_ref == ${permit_id}"
            - "invariant: 166000 + (-166000) == 0 == the last row's balance_after_cents == Owner.${owner_id}.fee_balance_cents"
            - "Owner.${owner_id}.delinquency_status == CURRENT (0 < 25000)"
            - "Permit.${permit_id}.total_fee_cents is still 166000 and status is still SUBMITTED - the compensation lives only in the ledger"
            - "a FEE_VOID submitted with a POSITIVE amount_cents would have been rejected with 422 ERR_LEDGER_SIGN_MISMATCH, so the compensation can only ever reduce the balance"
