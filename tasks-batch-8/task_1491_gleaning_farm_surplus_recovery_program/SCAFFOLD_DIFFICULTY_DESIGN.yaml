              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 3 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /glean/assignments"
              payload: { glean_event_id: "${event_id}", volunteer_id: "${vt_id}" }
              as: ProgramCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /glean/waivers"
              payload: { volunteer_id: "${vt_id}", glean_event_id: "${event_id}", signature_payload: "sigT", witness_volunteer_id: "${lead_id}" }
              as: Volunteer
              as_user_id: "${vt_id}"
            - call: "POST /glean/assignments/${asg_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vt_id}"
          trigger:
            - call: "POST /glean/offers/${offer_id}/cancel"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { ev_st: $.data.status, ev_cnt: $.data.crew_confirmed_count }
            - call: "GET /glean/assignments"
              payload: { glean_event_id: "${event_id}" }
              as: ProgramCoordinator
              captures: { asg_st: "$.data[0].status" }
            - call: "GET /glean/vehicles"
              payload: {}
              as: ProgramCoordinator
              captures: { veh_st: "$.data[0].status" }
          assert:
            - "ev_st == CANCELLED (link 1: offer cancel cascaded to event)"
            - "asg_st == DECLINED (link 2: event cancel cascaded to assignment)"
            - "ev_cnt == 0 (link 3: assignment decline recomputed the event counter)"
            - "veh_st == AVAILABLE (link 3 terminus: vehicle released by event cancel)"

