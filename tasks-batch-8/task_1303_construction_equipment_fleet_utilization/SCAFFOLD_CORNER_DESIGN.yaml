              as: FleetAdmin
              captures: { p402b_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-402", class_id: "${c402_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
