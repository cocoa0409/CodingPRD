      - name: methodology_version_diamond_freeze_resolve
        grounds:
          - state_machines.MethodologyVersion
          - state_machines.MethodologyVersion.FROZEN_to_ACTIVE
          - state_machines.MethodologyVersion.FROZEN_to_SUPERSEDED
