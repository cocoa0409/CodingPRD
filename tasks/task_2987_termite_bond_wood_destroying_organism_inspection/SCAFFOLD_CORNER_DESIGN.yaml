        distinguishing_aspect: >-
          A body-borne FK that names no row is a priority-60 failure reported with the referenced
          entity's own 404 code, and it must be reported even though the OTHER two references in
          the same body (property_id, applicator_id) do resolve.
        test_recipe:
          setup:
            - "One property and one applicator exist; no Inspection row has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
