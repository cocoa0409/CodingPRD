        grounds:
          - validations.priority_9_business_safety
          - validations.priority_10_business_safety
          - calculations.specimen_remaining_stability
          - entities.TestCatalogEntry.fields.min_volume_ml
          - entities.Specimen.fields.volume_ml
        distinguishing_aspect: |
          The empty-versus-zero volume edge is the deciding pair for the volume metric: a 1.00
          mL specimen against a 1.00 mL minimum accessions, while the same test's batch
          sibling with 0.99 mL is rejected, so the bound is inclusive at equality and NOT a
          zero-or-nonzero check.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client, a certified build, a published ferritin entry with min_volume_ml 1.0 and a 12-hour AMBIENT window."
            - "Two specimens received at the same instant: at_volume with exactly 1.00 mL and below_volume with 0.99 mL, both collected 2 hours before the clock so stability is not the binding constraint."
          setup_api_calls:
            - *clk
            - *c1
            - *t1b
            - call: "POST /reference-lab/test-catalog-entries/${t1b_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - &specAt
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-8301", patient_mrn: "MRN-8401", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 1.00, collection_at: "2026-09-01T05:00:00Z", received_at: "2026-09-01T05:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { spAt_id: $.data.id }
            - &ordAt
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${spAt_id}", order_number: "REQ-8301", patient_mrn: "MRN-8401", client_requested_at: "2026-09-01T05:05:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1b_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { oAt_id: $.data.id }
            - &specBelow
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-8302", patient_mrn: "MRN-8402", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 0.99, collection_at: "2026-09-01T05:00:00Z", received_at: "2026-09-01T05:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { spBelow_id: $.data.id }
            - &ordBelow
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${spBelow_id}", order_number: "REQ-8302", patient_mrn: "MRN-8402", client_requested_at: "2026-09-01T05:06:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1b_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { oBelow_id: $.data.id }
          trigger:
            - call: "POST /reference-lab/specimens/${spAt_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { at_status: $.data.status }
            - call: "POST /reference-lab/specimens/${spBelow_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { below_err: $.data.error_id }
          assert:
            - "Specimen.${spAt_id}.volume_ml == 1.00 and the accession returns Specimen.${spAt_id}.status == ACCESSIONED, so equality at the minimum passes"
            - "Specimen.${spBelow_id}.volume_ml == 0.99 and the accession returns 422 with error_id ERR_INSUFFICIENT_SPECIMEN_VOLUME"
            - "GET /reference-lab/send-out-orders/${oBelow_id} shows order_status == SUBMITTED, so the rejected specimen left no order row behind"
            - "the two specimens are identical except for 0.01 mL of volume, so a zero-or-nonzero volume check would pass both"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      # -----------------------------------------------------------------------
      - name: send_out_order_accession_requires_client_active_and_specimen_accessioned
        grounds:
          - state_machines.SendOutOrder.S_SUBMITTED_to_S_ACCESSIONED
          - state_machines.Specimen.R_RECEIVED_to_R_ACCESSIONED
          - state_machines.ClientLaboratory.PENDING_ONBOARDING_to_ACTIVE
          - entities.SendOutOrder.fields.order_status
        distinguishing_aspect: |
          This dependency crosses the ClientLaboratory-to-SendOutOrder pair: an order may only
          be accessioned while its own client is ACTIVE and its specimen is ACCESSIONED, so the
          same request succeeds and then fails purely because the client posture moved from
          ACTIVE to CREDIT_HOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. Two ACTIVE clients with published ferritin entries, certified builds and accessioned specimens, one of them with a credit_limit_cents of 1000 so a charge can push it over."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - *spec1
            - *ord1
            - *run1
            - call: "POST /reference-lab/specimens/${sp1_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { sp1_acc: $.data.status }
            - call: "POST /reference-lab/send-out-orders/${o1_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { o1_acc: $.data.order_status }
            - &spec1b
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-8401", patient_mrn: "MRN-5101", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { sp1b_id: $.data.id }
            - &ord1b
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${sp1b_id}", order_number: "REQ-8402", patient_mrn: "MRN-5102", client_requested_at: "2026-09-01T06:41:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { o1b_id: $.data.id }
            - call: "POST /reference-lab/specimens/${sp1b_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/billing-ledgers"
              payload: { client_laboratory_id: "${c1_id}" }
              as: LabBillingSpecialist
              captures: { bl1b_id: $.data.id }
            - *run1
          trigger:
            - call: "POST /reference-lab/send-out-orders/${o1b_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { o1b_before: $.data.order_status }
            - call: "POST /reference-lab/send-out-orders/${o1_id}/charge"
              payload: {}
              as: LabBillingSpecialist
              captures: { o1_bs: $.data.billing_status }
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { c1_after: $.data.status }
            - &spec1c
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-8403", patient_mrn: "MRN-5103", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { sp1c_id: $.data.id }
            - &ord1c
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${sp1c_id}", order_number: "REQ-8403", patient_mrn: "MRN-5104", client_requested_at: "2026-09-01T06:42:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { o1c_id: $.data.id }
            - call: "POST /reference-lab/specimens/${sp1c_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { sp1c_acc: $.data.status }
            - call: "POST /reference-lab/send-out-orders/${o1c_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { o1c_err: $.data.error_id }
          assert:
            - "the first accession succeeds: SendOutOrder.${o1b_id}.order_status == ACCESSIONED while ClientLaboratory.${c1_id}.status == ACTIVE"
            - "after the charge, outstanding_balance_cents == 1150.00 exceeds the 1000-cent limit and ClientLaboratory.${c1_id}.status == CREDIT_HOLD"
            - "the third order's own specimen accessions cleanly (Specimen.${sp1c_id}.status == ACCESSIONED) yet its order accession is refused with 402 ERR_CREDIT_LIMIT_EXCEEDED"
            - "SendOutOrder.${o1c_id}.order_status == SUBMITTED, so the dependency is on the client's posture and not on this order's own state"

      # -----------------------------------------------------------------------
      - name: result_release_requires_reviewed_specimen_and_held_transmission_flips_it
        grounds:
          - state_machines.Specimen.R_IN_TESTING_to_R_RESULT_PENDING_REVIEW
          - state_machines.Specimen.R_RESULT_PENDING_REVIEW_to_R_RELEASED
          - state_machines.ResultInterfaceMessage.VALIDATED_to_TRANSMITTED
          - entities.Specimen.fields.status
        distinguishing_aspect: |
          This dependency crosses the ResultInterfaceMessage-to-Specimen pair rather than the
          client-to-order pair: the specimen only reaches RELEASED when a RESULT message is
          actually transmitted, so identifying the same order's specimen before and after the
          transmission shows an in-place state change caused by a different entity's transition.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client with a certified dual-direction build and a published ferritin entry."
            - "One serum specimen in IN_TESTING with results entered but not yet released, so the specimen sits at RESULT_PENDING_REVIEW."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - *spec1
            - *ord1
            - *run1
            - *acc1
            - *oadm1
            - *beg1
            - *o1ver
            - call: "POST /reference-lab/send-out-orders/${o1_id}/enter-results"
              payload: { expected_send_out_order_version: "${o1_v}", result_lines: [{ order_test_line_id: "${l1_id}", result_value: 250.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
              captures: { sp1_rpr: $.data.specimen_id }
            - call: "GET /reference-lab/specimens/${sp1_id}"
              payload: {}
              as: MedicalTechnologist
              captures: { sp1_before: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o1_id}/release-results"
              payload: { interpretive_comment: "Ferritin within reference interval." }
              as: Pathologist
              captures: { o1_vrel3: $.data.version }
            - call: "POST /reference-lab/result-interface-messages"
              payload: { send_out_order_id: "${o1_id}", interface_build_id: "${ib_id}", message_type: "RESULT", control_id: "CTL-9101", expected_send_out_order_version: "${o1_vrel3}" }
              as: InterfaceAnalyst
              captures: { msg3_id: $.data.id }
            - call: "POST /reference-lab/result-interface-messages/${msg3_id}/validate"
              payload: {}
              as: InterfaceAnalyst
              captures: { msg3_valid: $.data.status }
          trigger:
            - call: "GET /reference-lab/specimens/${sp1_id}"
              payload: {}
              as: MedicalTechnologist
              captures: { sp1_still: $.data.status }
            - call: "POST /reference-lab/result-interface-messages/${msg3_id}/transmit"
              payload: {}
              as: InterfaceAnalyst
              captures: { msg3_tx: $.data.status }
            - call: "GET /reference-lab/specimens/${sp1_id}"
              payload: {}
              as: MedicalTechnologist
              captures: { sp1_after: $.data.status }
          assert:
            - "Specimen.${sp1_id}.status == RESULT_PENDING_REVIEW after the result release, although every line is already FINAL"
            - "ResultInterfaceMessage.${msg3_id}.status == VALIDATED before transmission, so the specimen stays unreleased while the message is merely validated"
            - "after the transmission ResultInterfaceMessage.${msg3_id}.status == TRANSMITTED and Specimen.${sp1_id}.status == RELEASED"
            - "the specimen's status changed without any specimen endpoint being called, purely as a consequence of the interface message transition"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      # -----------------------------------------------------------------------
      - name: analyzer_buffer_overlap_on_an_exact_boundary
        grounds:
          - validations.priority_15_business_constraint
          - errors.ERR_INSTRUMENT_DOUBLE_BOOKED
          - entities.InstrumentRun.fields.occupied_until_at
          - entities.InstrumentRun.fields.decontamination_buffer_minutes
        distinguishing_aspect: |
          Interval semantics here are closed-start and closed-end plus a mandatory 30-minute
          decontamination buffer, so a new run starting exactly at the earlier run's
          occupied_until_at instant is accepted while one starting one minute earlier is
          rejected — adjacency is decided by the buffer rather than by the run length.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One published ferritin entry and one booked run on analyzer IMM-08 from 2026-09-01T07:00:00Z to 2026-09-01T12:00:00Z with a 30-minute buffer, so its occupied_until_at is 2026-09-01T12:30:00Z."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - &first_run
              call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t1_id}", instrument_code: "IMM-08", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T07:00:00Z", reserved_end_at: "2026-09-01T12:00:00Z" }
              as: MedicalTechnologist
              captures: { fr_id: $.data.id, fr_occ: $.data.occupied_until_at }
          trigger:
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t1_id}", instrument_code: "IMM-08", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T12:30:00Z", reserved_end_at: "2026-09-01T13:00:00Z" }
              as: MedicalTechnologist
              captures: { adj_id: $.data.id }
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t1_id}", instrument_code: "IMM-08", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T12:29:00Z", reserved_end_at: "2026-09-01T13:00:00Z" }
              as: MedicalTechnologist
              captures: { buf_err: $.data.error_id }
          assert:
            - "InstrumentRun.${fr_id}.occupied_until_at == 2026-09-01T12:30:00Z, which is the end instant plus the 30-minute buffer"
            - "the run starting at 2026-09-01T12:30:00Z is accepted with a 201 and InstrumentRun.${adj_id}.run_status == RESERVED, because adjacency at the occupied boundary is legal"
            - "the run starting at 2026-09-01T12:29:00Z is refused with 409 ERR_INSTRUMENT_DOUBLE_BOOKED, one minute inside the buffer"
            - "GET /reference-lab/instrument-runs?instrument_code=IMM-08 returns exactly 2 rows"

      # -----------------------------------------------------------------------
      - name: courier_vehicle_half_open_overlap_and_adjacency
        grounds:
          - validations.priority_16_business_constraint
          - errors.ERR_COURIER_LEG_OVERLAP
          - entities.CourierRun.fields.scheduled_pickup_at
          - entities.CourierRun.fields.scheduled_delivery_at
        distinguishing_aspect: |
          Interval semantics here are half-open with no buffer, on a different resource than the
          analyzer: a leg from 09:00 to 13:00 is accepted against an earlier leg that ends
          exactly at 09:00, while a leg starting at 08:59 on the same vehicle is rejected — so
          the two overlap rules do not share interval arithmetic.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client and a first leg on vehicle VAN-21 occupying 2026-09-01T05:00:00Z through 2026-09-01T09:00:00Z."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - &leg_one
              call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${c1_id}", route_code: "SLC-AM", origin_city: "Provo", destination_city: "Salt Lake City", vehicle_id: "VAN-21", scheduled_departure_at: "2026-09-01T05:00:00Z", scheduled_arrival_at: "2026-09-01T09:00:00Z", scheduled_pickup_at: "2026-09-01T05:00:00Z", scheduled_delivery_at: "2026-09-01T09:00:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${c1_v}" }
              as: CourierCoordinator
              captures: { leg1_id: $.data.id }
            - *pr
            - *act
          trigger:
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { c1_v2: $.data.version }
            - call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${c1_id}", route_code: "SLC-MID", origin_city: "Provo", destination_city: "Salt Lake City", vehicle_id: "VAN-21", scheduled_departure_at: "2026-09-01T09:00:00Z", scheduled_arrival_at: "2026-09-01T13:00:00Z", scheduled_pickup_at: "2026-09-01T09:00:00Z", scheduled_delivery_at: "2026-09-01T13:00:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${c1_v2}" }
              as: CourierCoordinator
              captures: { leg2_id: $.data.id }
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { c1_v3: $.data.version }
            - call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${c1_id}", route_code: "SLC-PM", origin_city: "Provo", destination_city: "Salt Lake City", vehicle_id: "VAN-21", scheduled_departure_at: "2026-09-01T08:59:00Z", scheduled_arrival_at: "2026-09-01T11:00:00Z", scheduled_pickup_at: "2026-09-01T08:59:00Z", scheduled_delivery_at: "2026-09-01T11:00:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${c1_v3}" }
              as: CourierCoordinator
              captures: { ovl_err: $.data.error_id }
          assert:
            - "the leg starting exactly at 2026-09-01T09:00:00Z is accepted with a 201, because adjacency with a half-open interval does not overlap"
            - "CourierRun.${leg2_id}.transit_allowance_minutes == 5.0, being the 5.0 base allowance alone because this is the first leg created on route SLC-MID"
            - "the leg starting at 2026-09-01T08:59:00Z on the same vehicle is refused with 409 ERR_COURIER_LEG_OVERLAP"
            - "GET /reference-lab/courier-runs?vehicle_id=VAN-21 returns exactly 2 rows, so the rejected leg persisted nothing"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      # -----------------------------------------------------------------------
      - name: void_then_recharge_leaves_net_billed_and_routed_balance_unchanged
        grounds:
          - calculations.billing_ledger_net_position
          - calculations.billing_route_attribution
          - state_machines.SendOutOrder.S_BILLED_to_S_VOIDED
          - state_machines.SendOutOrder.S_VOIDED_to_S_BILLED
          - entities.BillingLedger.fields.net_billed_cents
        distinguishing_aspect: |
          The conserved quantity is a money figure spanning the BillingLedger, the SendOutOrder
          and the ClientLaboratory: a void of 1150 cents followed by a re-charge of 1150 cents
          returns net_billed_cents, billed_cents, voided_cents and the client's routed balance to
          their exact pre-pair values, while charge_entry_count is deliberately allowed to grow.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client with a 500000-cent limit, an OPEN ledger, a certified build and a published ferritin entry, plus one released order charged at 1150 cents."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - call: "POST /reference-lab/billing-ledgers"
              payload: { client_laboratory_id: "${c1_id}" }
              as: LabBillingSpecialist
              captures: { blV_id: $.data.id }
            - *spec1
            - *ord1
            - *run1
            - *acc1
            - *oadm1
            - *beg1
            - *o1ver
            - *ent1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o1_id}/release-results"
              payload: { interpretive_comment: "Ferritin within reference interval." }
              as: Pathologist
            - call: "GET /reference-lab/billing-ledgers/${blV_id}"
              payload: {}
              as: LabBillingSpecialist
              captures: { net_before: $.data.net_billed_cents, billed_before: $.data.billed_cents }
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { bal_before: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /reference-lab/billing-ledgers/${blV_id}/void-charges"
              payload: { send_out_order_id: "${o1_id}", void_amount_cents: 1150 }
              as: LabBillingSpecialist
              captures: { net_voided: $.data.net_billed_cents, ostatus: $.data.status }
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { bal_voided: $.data.outstanding_balance_cents }
            - call: "POST /reference-lab/send-out-orders/${o1_id}/charge"
              payload: {}
              as: LabBillingSpecialist
              captures: { o_bs_after: $.data.billing_status }
            - call: "GET /reference-lab/billing-ledgers/${blV_id}"
              payload: {}
              as: LabBillingSpecialist
              captures: { net_after: $.data.net_billed_cents, billed_after: $.data.billed_cents, voided_after: $.data.voided_cents, entries_after: $.data.charge_entry_count }
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { bal_after: $.data.outstanding_balance_cents }
          assert:
            - "BillingLedger.${blV_id}.net_billed_cents == 1150.00 before the pair and == 1150.00 after it, so the conserved quantity is unchanged"
            - "ClientLaboratory.${c1_id}.outstanding_balance_cents == 1150.00 before the pair and == 1150.00 after it"
            - "BillingLedger.${blV_id}.billed_cents == 2300.00 and voided_cents == 1150.00 after the pair, so both gross figures grew while the net did not"
            - "BillingLedger.${blV_id}.charge_entry_count == 2 after the pair, so the entry count is explicitly outside the conserved quantity"
            - "SendOutOrder.${o1_id}.billing_status == BILLED after the re-charge and the void-to-recharge cycle is closed"

      # -----------------------------------------------------------------------
      - name: aliquot_create_then_delete_leaves_the_stored_totals_unchanged
        grounds:
          - calculations.specimen_aliquot_volume_conservation
          - state_machines.Specimen.A_RECEIVED_to_A_ACCESSIONED
          - entities.Specimen.fields.total_aliquot_volume_ml
          - entities.Specimen.fields.aliquot_parent_id
        distinguishing_aspect: |
          The conserved quantity here is a specimen volume over a self-referential child set
          rather than a money figure: creating a 1.00 mL aliquot then deleting that same aliquot
          returns total_aliquot_volume_ml to 0.00 and the child count to zero, while a
          successful read mid-pair proves the total really moved to 1.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client, a certified build, a published ferritin entry, and one ACCESSIONED 3.0 mL serum specimen with no children."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - &specAq
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-8501", patient_mrn: "MRN-8601", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { spAq_id: $.data.id }
            - &ordAq
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${spAq_id}", order_number: "REQ-8501", patient_mrn: "MRN-8601", client_requested_at: "2026-09-01T06:35:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { oAq_id: $.data.id }
            - *run1
            - call: "POST /reference-lab/specimens/${spAq_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${oAq_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "GET /reference-lab/specimens/${spAq_id}"
              payload: {}
              as: AccessioningTechnologist
              captures: { total_before: $.data.total_aliquot_volume_ml }
          trigger:
            - call: "POST /reference-lab/specimens/${spAq_id}/aliquots"
              payload: { aliquot_volume_ml: 1.00, container_type: "GOLD_SST", accession_number: "ACC-8501-A1" }
              as: AccessioningTechnologist
              captures: { alq_id: $.data.id }
            - call: "GET /reference-lab/specimens/${spAq_id}"
              payload: {}
              as: AccessioningTechnologist
              captures: { total_mid: $.data.total_aliquot_volume_ml }
            - call: "DELETE /reference-lab/specimens/${spAq_id}/aliquots/${alq_id}"
              payload: {}
              as: AccessioningTechnologist
            - call: "GET /reference-lab/specimens/${spAq_id}"
              payload: {}
              as: AccessioningTechnologist
              captures: { total_after: $.data.total_aliquot_volume_ml }
            - call: "GET /reference-lab/specimens"
              payload: { aliquot_parent_id: "${spAq_id}" }
              as: AccessioningTechnologist
          assert:
            - "Specimen.${spAq_id}.total_aliquot_volume_ml == 0.00 before the pair"
            - "Specimen.${spAq_id}.total_aliquot_volume_ml == 1.00 mid-pair, which proves the create really moved the derived total"
            - "Specimen.${spAq_id}.total_aliquot_volume_ml == 0.00 after the pair, so the delete compensates the create exactly"
            - "GET /reference-lab/specimens?aliquot_parent_id=${spAq_id} returns an empty array after the pair"
            - "Specimen.${spAq_id}.status == ACCESSIONED throughout, because the parent's own receipt state is outside the conserved quantity"