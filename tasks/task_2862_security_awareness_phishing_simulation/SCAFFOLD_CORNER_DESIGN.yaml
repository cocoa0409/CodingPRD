  - section: errors
    instances:
      - name: sweep_missing_x_user_role_header_returns_401
        claim_type: error_triggerable
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked before role permission and before any resource lookup: a compliance sweep with no X-User-Role header (and, separately, with no X-User-ID header) returns ERR_UNAUTHENTICATED (401) rather than 403 or 404, and no sweep side effects run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one employee registered."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "auth.probe@corp.example", full_name: "Anna Auth", department: "HR", role_code: "IC", hire_date: "2019-06-06" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {} }
            - { call: "GET /awareness/employees/00000000-0000-4000-8000-000000000000", payload: {} }
          assert:
            - "the sweep with no X-User-Role header returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the same call with an empty X-User-ID header also returns HTTP 401 ERR_UNAUTHENTICATED"
            - "the unauthenticated GET on a non-existent employee returns 401, not 404: auth precedes existence"
            - "Employee.${e} is unchanged and no EscalationNotice rows exist"

      - name: clock_set_with_invalid_role_header_returns_401
        claim_type: error_triggerable
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "A syntactically present but undeclared role value (SuperAdmin) is an authentication failure, not an authorization failure: the six declared roles form a closed set, so the call returns ERR_UNAUTHENTICATED (401) and the logical clock does not move."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SuperAdmin, as_user_id: "root" }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { swept: "$.data.swept_at" } }
          assert:
            - "the SuperAdmin call returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the follow-up sweep reports swept_at == 2026-08-01T00:00:00Z, proving the clock never moved"
            - "a lowercase programadmin role value is likewise rejected with 401 (role matching is exact)"

      - name: learner_cannot_run_compliance_sweeps_returns_403
        claim_type: error_triggerable
        grounds:
          - validations[priority 2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /awareness/compliance-sweeps]
        distinguishing_aspect: "Role permission is evaluated against the endpoint's declared roles list before any ownership or state rule: an authenticated Learner calling the ProgramAdmin-only sweep gets ERR_ROLE_NOT_PERMITTED (403), which is distinct from the 401 an undeclared role would get."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one employee whose id is used as the Learner's X-User-ID."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "lee.learner@corp.example", full_name: "Lee Learner", department: "SALES", role_code: "IC", hire_date: "2021-07-07" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: Learner, as_user_id: "${e}" }
            - { call: "POST /awareness/incidents", payload: { incident_type: "BEC", severity: "LOW", department: "SALES", occurred_at: "2026-07-31T10:00:00Z", summary: "Learner attempting an analyst-only write." }, as: Learner, as_user_id: "${e}" }
          assert:
            - "the sweep returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the incident create returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED (SecurityAnalyst-exclusive)"
            - "no IncidentRecord row was written: the incident listing is empty"
            - "the same Learner CAN read their own employee record via GET /awareness/employees/{id}"

      - name: unknown_path_ids_return_entity_specific_not_found_codes
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_TEMPLATE_NOT_FOUND]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
        distinguishing_aspect: "The 404 family is per-entity rather than one generic code: the same well-formed unknown UUID returns ERR_ASSIGNMENT_NOT_FOUND, ERR_TEMPLATE_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND or ERR_DELIVERY_NOT_FOUND depending on which collection is addressed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the estate is empty apart from the clock."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/curriculum-assignments/11111111-1111-4111-8111-111111111111", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/phishing-templates/22222222-2222-4222-8222-222222222222", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/campaigns/33333333-3333-4333-8333-333333333333", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries/44444444-4444-4444-8444-444444444444", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/training-modules/55555555-5555-4555-8555-555555555555", payload: {}, as: ProgramAdmin }
          assert:
            - "each call returns HTTP 404 with, respectively, ERR_ASSIGNMENT_NOT_FOUND, ERR_TEMPLATE_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_DELIVERY_NOT_FOUND and ERR_MODULE_NOT_FOUND"
            - "every error envelope carries response_type error with data.error_id and data.message"
            - "an action endpoint on an unknown id (POST /awareness/campaigns/{unknown}/launch) also returns ERR_CAMPAIGN_NOT_FOUND rather than a state error"

      - name: unknown_secondary_resource_ids_return_404_resource_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Escalation notices, access consequences, interventions, incidents and communication windows share the catch-all ERR_RESOURCE_NOT_FOUND (404) rather than each owning a code, which is the boundary of the per-entity 404 family."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no notices, consequences, interventions or incidents exist."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/escalation-notices/66666666-6666-4666-8666-666666666666", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/access-consequences/77777777-7777-4777-8777-777777777777", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/interventions/88888888-8888-4888-8888-888888888888", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/incidents/99999999-9999-4999-8999-999999999999", payload: {}, as: SecurityAnalyst }
          assert:
            - "all four calls return HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "the corresponding list endpoints return HTTP 200 with an empty data array and total_count == 0 (an empty collection is not a 404)"

      - name: schedule_in_the_past_returns_422_schedule_in_past
        claim_type: error_triggerable
        grounds:
          - validations[priority 22]
          - errors[ERR_SCHEDULE_IN_PAST]
          - endpoints[POST /awareness/campaigns/{id}/schedule]
        distinguishing_aspect: "The past check is inclusive of the current instant: a scheduled_send_at exactly equal to the logical clock is rejected with ERR_SCHEDULE_IN_PAST (422), and one second later is accepted - so the campaign cannot be scheduled to fire in the same instant it is scheduled."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T12:00:00Z."
            - "One APPROVED campaign whose cohort contains one ACTIVE ENGINEERING employee."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "pat.past@corp.example", full_name: "Pat Past", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-03-03" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Past Probe Template", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Past Schedule Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-09T12:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-10T12:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-10T12:00:01Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1", captures: { sched_state: "$.data.state" } }
          assert:
            - "the yesterday send returns HTTP 422 with error_id ERR_SCHEDULE_IN_PAST"
            - "the send exactly at the clock instant also returns HTTP 422 ERR_SCHEDULE_IN_PAST (the comparison is <=)"
            - "the one-second-later send returns HTTP 200 with state SCHEDULED and scheduled_send_at == 2026-08-10T12:00:01Z"
            - "the two rejected calls did not bump the campaign version, which is why all three reuse ${c_v}"
            - "exactly one QUEUED SimulationDelivery exists for ${c} after the successful schedule"

      - name: report_period_span_over_24_months_returns_422
        claim_type: error_triggerable
        grounds:
          - validations[priority 29]
          - validations[priority 3]
          - errors[ERR_REPORT_PERIOD_INVALID]
        distinguishing_aspect: "The two period defects land on different codes because of priority order: a 29-month span passes the well-formedness check and fails priority 29 with ERR_REPORT_PERIOD_INVALID (422), while period_end == period_start is caught by priority 3 as ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no campaigns or incidents are needed."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/effectiveness-report", payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", variant: "CONCURRENT" }, as: SecurityAnalyst }
            - { call: "GET /awareness/effectiveness-report", payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", variant: "CONCURRENT" }, as: SecurityAnalyst }
            - { call: "GET /awareness/effectiveness-report", payload: { period_start: "2024-07-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", variant: "CONCURRENT" }, as: SecurityAnalyst, captures: { pairs: "$.data.pair_count" } }
          assert:
            - "the 29-month span returns HTTP 422 with error_id ERR_REPORT_PERIOD_INVALID"
            - "the zero-length period returns HTTP 400 with error_id ERR_INVALID_REQUEST (priority 3 outranks priority 29)"
            - "the 23-month span returns HTTP 200 with variant CONCURRENT and pair_count == 0 on an empty estate"
            - "the 200 response still carries correlation == null with correlation_reason_code INSUFFICIENT_PAIRS"

      - name: template_approved_twice_returns_409_template_state_invalid
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TEMPLATE_STATE_INVALID]
          - validations[priority 11]
          - state_machines.PhishingTemplate
        distinguishing_aspect: "approve-for-use is only declared from DRAFT, so approving an APPROVED_FOR_USE template returns ERR_TEMPLATE_STATE_INVALID (409), and blocking an already BLOCKED template returns the same code - two different non-DRAFT origins collapsing onto one error."
