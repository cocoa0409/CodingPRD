            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-10T14:30:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin, captures: { s_status: "$.data.status", s_total: "$.data.total_improvement_cents" } }
          assert:
            - "While O1 is ROUTED: ${err} == ERR_UNRESOLVED_ORDERS and snapshot stays PROVISIONAL"
            - "After execution resolves the order: ${s_status} == LOCKED with frozen metrics ${s_total} == 5.00 * 10 == 50.00"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: arrangement_window_half_open_adjacency
        grounds:
          - validations[priority=19]
          - entities.RoutingArrangement.fields.effective_from
        distinguishing_aspect: |
          Interval semantics A (pure half-open, no buffer) on the venue resource:
          a successor arrangement whose effective_from == the incumbent's
          effective_to is LEGAL (adjacency allowed), while a one-second earlier
          start collides. Different semantics than the sibling instance (buffered).
        test_recipe:
          setup:
            - "Venue NYSE; arrangement A1 NEGOTIATION with window [2026-08-01, 2026-11-01)"
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-11-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.12 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-10-31T23:59:59Z", effective_to: "2027-01-31T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.12 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Adjacency legal: A2 created (201) with id ${a2} — to == next from does not intersect under half-open semantics"
            - "One second of real overlap rejected: ${err} == ERR_ARRANGEMENT_WINDOW_OVERLAP"

      - name: restricted_list_buffer_gap_boundary
        grounds:
          - validations[priority=20]
          - entities.RestrictedListEntry.fields.effective_from
        distinguishing_aspect: |
          Interval semantics B (1-day BUFFER around each entry) on the symbol
          resource: a gap of exactly 86400s between windows is allowed (buffered
          start touches incumbent's exclusive end), while 86399s collides —
          geometrically distinct from the sibling's pure half-open adjacency.
        test_recipe:
          setup:
            - "SCHEDULED restricted entry E1 for ACME, window [2026-09-10, 2026-09-20)"
          setup_api_calls:
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "ALL", effective_from: "2026-09-10T00:00:00Z", effective_to: "2026-09-20T00:00:00Z" }, as: ComplianceAdmin, captures: { e1: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "EMPLOYEE_ONLY", effective_from: "2026-09-21T00:00:00Z", effective_to: "2026-09-25T00:00:00Z" }, as: ComplianceAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "CLIENT_ONLY", effective_from: "2026-09-20T23:59:59Z", effective_to: "2026-09-26T00:00:00Z" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Exact 86400s gap allowed: E2 created (201) with id ${e2} (buffered start 2026-09-20T00:00:00Z touches but does not intersect E1's exclusive end)"
            - "86399s gap rejected: ${err} == ERR_RESTRICTED_WINDOW_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: case_disposition_reopen_roundtrip_conserves_open_case_count
        grounds:
          - state_machines.SurveillanceCase
          - state_machines.SurveillanceAlert
          - entities.Employee.fields.open_case_count
        distinguishing_aspect: |
          Conserved quantity: Employee.open_case_count (count of cases in
          {OPEN, UNDER_INVESTIGATION, REOPENED}). The forward action
          (DISPOSITIONED, drops the count to 0) paired with its compensating action
          (REOPENED, restores it to 1) leaves the quantity unchanged end-to-end,
          and the alert dimension is symmetric (ESCALATED -> ACKNOWLEDGED ->
          re-ESCALATED re-links the same case). Distinct quantity from the sibling
          (open training assignments).
        test_recipe:
          setup:
            - "Employee EMP-111 with an escalated front-running alert; case OPEN (open_case_count == 1)"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Ned Round", employee_ref: "EMP-111", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 100 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "EXECUTION_REPORTED", executed_price_cents: 10000, executed_at: "2026-08-03T14:30:00Z" }, as: CoveredEmployee, as_user_id: "${e_id}" }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "RT1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:50:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-03T14:45:00Z" }, as: OpsAdmin }
            - { call: "GET /surveillance/surveillance-alerts", payload: { related_order_id: "${o_id}" }, as: SurveillanceAnalyst, captures: { al_id: "$.data[0].id" } }
            - { call: "POST /surveillance/surveillance-alerts/${al_id}/transition", payload: { to_status: "ACKNOWLEDGED" }, as: SurveillanceAnalyst }
            - { call: "POST /surveillance/surveillance-alerts/${al_id}/transition", payload: { to_status: "ESCALATED" }, as: SurveillanceAnalyst }
            - { call: "GET /surveillance/surveillance-cases", payload: { subject_employee_id: "${e_id}" }, as: SurveillanceAnalyst, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "UNDER_INVESTIGATION" }, as: SurveillanceAnalyst }
          trigger:
            - { call: "GET /surveillance/employees/${e_id}", payload: {}, as: SurveillanceAnalyst, captures: { cnt_before: "$.data.open_case_count" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "DISPOSITIONED", disposition: "VIOLATION_CONFIRMED" }, as: SurveillanceAnalyst }
            - { call: "GET /surveillance/employees/${e_id}", payload: {}, as: SurveillanceAnalyst, captures: { cnt_mid: "$.data.open_case_count" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "REOPENED" }, as: SurveillanceAnalyst, captures: { c_rev: "$.data.review_status", c_fil: "$.data.filing_status", c_fee: "$.data.late_fee_cents" } }
            - { call: "GET /surveillance/employees/${e_id}", payload: {}, as: SurveillanceAnalyst, captures: { cnt_after: "$.data.open_case_count" } }
            - { call: "POST /surveillance/surveillance-alerts/${al_id}/transition", payload: { to_status: "ESCALATED" }, as: SurveillanceAnalyst, captures: { al_final: "$.data.status", al_case: "$.data.case_id" } }
          assert:
            - "Forward action: DISPOSITIONED drops the conserved quantity ${cnt_before} == 1 -> ${cnt_mid} == 0"
            - "Compensating action restores it: ${cnt_after} == 1 — no drift in open_case_count across the round trip"
            - "Filing dimension compensated: ${c_fil} == NOT_REQUIRED and ${c_fee} == 0 (draft voided)"
            - "Alert symmetry: re-escalation from ACKNOWLEDGED succeeds and re-links the same case: ${al_final} == ESCALATED and ${al_case} == ${c_id}"

      - name: policy_publish_supersede_conserves_single_open_assignment
        grounds:
          - state_machines.CompliancePolicy.DRAFT_to_EFFECTIVE
          - state_machines.TrainingAssignment
          - entities.Employee.fields.training_overdue_count
        distinguishing_aspect: |
          Conserved quantity: per (employee, policy_code) the count of
          TrainingAssignments in {ASSIGNED, OVERDUE} equals exactly 1 after every
          publish — the publish of a successor cancels the predecessor's
          non-terminal assignments (compensation) while COMPLETED assignments are
          untouched. Different conserved quantity than the sibling (case count).
        test_recipe:
          setup:
            - "Employees EMP-121 and EMP-122 both ACTIVE"
            - "Policy PAT v1 published; EMP-121 completed its assignment, EMP-122's still ASSIGNED"
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Ola Done", employee_ref: "EMP-121", department: "COMPLIANCE", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /surveillance/employees", payload: { full_name: "Pam Pending", employee_ref: "EMP-122", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /surveillance/compliance-policies", payload: { policy_code: "PAT", title: "Personal Account Trading", version_label: "v2026.1" }, as: ComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /surveillance/compliance-policies/${p1}/publish", payload: {}, as: ComplianceAdmin, captures: { p1_status: "$.data.status" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e1}" }, as: ComplianceAdmin, captures: { a1_id: "$.data[0].id" } }
            - { call: "POST /surveillance/training-assignments/${a1_id}/complete", payload: {}, as: CoveredEmployee, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /surveillance/compliance-policies", payload: { policy_code: "PAT", title: "Personal Account Trading", version_label: "v2026.2" }, as: ComplianceAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /surveillance/compliance-policies/${p2}/publish", payload: {}, as: ComplianceAdmin }
            - { call: "GET /surveillance/compliance-policies/${p1}", payload: {}, as: ComplianceAdmin, captures: { p1_after: "$.data.status" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e1}", policy_id: "${p1}" }, as: ComplianceAdmin, captures: { e1_old: "$.data[0].status" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e1}", policy_id: "${p2}" }, as: ComplianceAdmin, captures: { e1_new: "$.data[0].status" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e2}", policy_id: "${p1}" }, as: ComplianceAdmin, captures: { e2_old: "$.data[0].status" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e2}", policy_id: "${p2}" }, as: ComplianceAdmin, captures: { e2_new: "$.data[0].status" } }
          assert:
            - "First publish fanned out: ${p1_status} == EFFECTIVE and one ASSIGNED assignment per ACTIVE employee"
            - "Successor publish supersedes: ${p1_after} == SUPERSEDED"
            - "Compensation: ${e2_old} == CANCELLED (EMP-122's open assignment cancelled), and exactly one open assignment per (employee, PAT) survives: ${e2_new} == ASSIGNED"
            - "COMPLETED is conserved, not compensated: ${e1_old} == COMPLETED and ${e1_new} == ASSIGNED — count of open assignments per (employee, PAT) remains exactly 1"
