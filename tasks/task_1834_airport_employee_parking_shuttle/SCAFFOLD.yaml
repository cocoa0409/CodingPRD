# =============================================================================
# Task 1834: Airport Employee Parking & Shuttle Operations — seed tables
# =============================================================================

scenario: |
  1834. Airport Employee Parking & Shuttle Operations (airport employee parking program): badge-based parking eligibility & permit issuance, lot capacity & waitlist by shift pattern, shuttle headway & wait-time service level, payroll deduction billing & termination sweeps, violation enforcement & tow, remote lot activation on peak days, service change communication, cost per employee & subsidy

domain_name: airport-employee-parking
api_prefix: /parking

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - ops_run_checkpoint
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references; no URL nesting except sub-resource list reads
  state_machine_shape: cyclic      # Permit ACTIVE<->SUSPENDED, Lot STANDBY<->ACTIVATED, Route ACTIVE<->SUSPENDED, BillingCycle CLOSED->EXPORTED->CLOSED; Violation carries parallel payment_status x appeal_status dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # violation issuer may not decide its appeal; billing ops split from parking ops
  consistency_model: immediate
  entity_count: 13
  state_machine_count: 13
  calculation_count: 10
  endpoint_count: 41
  error_code_count: 29
  role_count: 6

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ParkingProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: posture, type: enum, source: system, description: "PROGRAM_NORMAL | PROGRAM_FROZEN | PROGRAM_CLOSED; initial PROGRAM_NORMAL", default: PROGRAM_NORMAL }
      - { name: proration_mode, type: enum, source: input, description: "CALENDAR_DAY | HALF_MONTH; selects proration_charge variant; immutable after creation", default: CALENDAR_DAY }
      - { name: monthly_subsidy_pool_cents, type: integer, source: input, description: "Subsidy pool available per billing cycle", default: 0, constraints: ">= 0" }
      - { name: waitlist_offer_ttl_hours, type: integer, source: input, description: "Hours an offer remains acceptable", default: 72, constraints: "> 0" }
      - { name: violation_suspension_threshold, type: integer, source: input, description: "Unpaid violation count that suspends a permit (>= comparison)", default: 3, constraints: ">= 1" }
      - { name: tow_hold_hours, type: integer, source: input, description: "Minimum suspension age in hours before a tow may be authorized", default: 48, constraints: ">= 0" }
      - { name: ops_run_index, type: integer, source: system, description: "Batch checkpoint counter, starts at 0, incremented by run-ops" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ParkingProgram.id; program the employee parks under" }
      - { name: badge_number, type: string, source: input, description: "Badge number; unique per program among all employees", constraints: "unique per program_id" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: employer_code, type: string, source: input, description: "Employer/tenant code at the airport (e.g. airline code)" }
      - { name: shift_pattern, type: enum, source: input, description: "DAY | NIGHT | ROTATING | SPLIT; drives fee multiplier, subsidy pct, and waitlist priority class", constraints: "immutable after creation" }
      - { name: hire_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of hire" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | TERMINATED; initial ACTIVE" }
      - { name: terminated_at, type: datetime, source: system, description: "Logical-clock timestamp of termination; null until terminated" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Sum of amount_cents over this employee's ChargeEntry rows currently in DEDUCTION_FAILED status; always >= 0" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | BILLING_HOLD; BILLING_HOLD iff balance_due_cents > 0, GOOD_STANDING iff balance_due_cents == 0" }

  - name: ParkingLot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ParkingProgram.id; owning program" }
      - { name: code, type: string, source: input, description: "Lot code; unique per program", constraints: "unique per program_id" }
      - { name: tier, type: enum, source: input, description: "CORE | REMOTE; immutable after creation" }
      - { name: capacity, type: integer, source: input, description: "Total bookable slots", constraints: ">= 0; PATCH may not set capacity below occupied_slots + reserved_slots" }
      - { name: monthly_maintenance_cents, type: integer, source: input, description: "Monthly fixed cost feeding program cost-per-employee", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | STANDBY | ACTIVATED | CLOSED; initial ACTIVE for CORE, STANDBY for REMOTE; bookable iff ACTIVE or ACTIVATED" }
      - { name: occupied_slots, type: integer, source: computed, description: "Count of Permit rows with lot_id == this lot and status == ACTIVE" }
      - { name: reserved_slots, type: integer, source: computed, description: "Count of Permit rows with lot_id == this lot and status == OFFERED and offer_expires_at >= current logical time" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; permit holder", constraints: "at most one non-terminal Permit per employee" }
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; requested/assigned lot" }
      - { name: vehicle_plate, type: string, source: input, description: "Vehicle plate for enforcement" }
      - { name: queue_shift_pattern, type: enum, source: system, description: "Snapshot of Employee.shift_pattern at request time; waitlist ranking key (DAY|NIGHT|ROTATING|SPLIT)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | WAITLISTED | OFFERED | ACTIVE | SUSPENDED | REVOKED | DECLINED | EXPIRED | CANCELLED" }
      - { name: offered_at, type: datetime, source: system, description: "Logical time of offer; null until first OFFERED" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + program.waitlist_offer_ttl_hours; accept allowed while current logical time <= offer_expires_at" }
      - { name: activated_at, type: datetime, source: system, description: "Logical time of OFFERED->ACTIVE; null until active" }
      - { name: suspended_at, type: datetime, source: system, description: "Logical time of the most recent ACTIVE->SUSPENDED; tow hold measured from this" }
      - { name: suspension_reason, type: enum, source: system, description: "VIOLATION_THRESHOLD | LOT_CLOSURE | BILLING_HOLD | ADMIN; null when not suspended" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "GROSS monthly fee snapshot (tier base rate x shift multiplier) fixed at activation via permit_monthly_fee; subsidy is re-derived per posting from the billed cycle's subsidy_per_capita_cap_cents; null until active" }
      - { name: term_end, type: string, source: system, description: "ISO date; activated date + 12 months; renewal approval extends by 12 months; null until active" }

  - name: PermitRenewal
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit being renewed" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | SUPERSEDED; initial PENDING; creating a new renewal supersedes any PENDING one" }
      - { name: requested_at, type: datetime, source: system, description: "Logical time of creation" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding ParkingAdmin; null until decided" }

  - name: ShuttleRoute
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; lot this route serves" }
      - { name: code, type: string, source: input, description: "Route code; unique within its lot's program", constraints: "unique per program (via lot)" }
      - { name: headway_target_minutes, type: integer, source: input, description: "Scheduled headway target", constraints: "> 0" }
      - { name: operating_cost_per_trip_cents, type: integer, source: input, description: "Cost per COMPLETED trip feeding cost-per-employee", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE" }

  - name: ShuttleTrip
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> ShuttleRoute.id; route operated" }
      - { name: scheduled_departure_at, type: datetime, source: input, description: "Planned departure (logical clock domain)" }
      - { name: actual_departure_at, type: datetime, source: system, description: "Set on DEPART; null until departed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DEPARTED | COMPLETED | CANCELLED; initial SCHEDULED" }
      - { name: boarded_count, type: integer, source: input, description: "Boarded passengers, supplied at COMPLETE", default: 0, constraints: ">= 0" }

  - name: ServiceChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; target lot for LOT_CLOSURE / LOT_REOPEN; null otherwise" }
      - { name: route_id, type: string, source: input, description: "FK -> ShuttleRoute.id; target route for ROUTE_SUSPENSION / HEADWAY_CHANGE; null otherwise" }
      - { name: notice_type, type: enum, source: input, description: "LOT_CLOSURE | LOT_REOPEN | ROUTE_SUSPENSION | HEADWAY_CHANGE | GENERAL" }
      - { name: headline, type: string, source: input, description: "Public communication headline" }
      - { name: effective_from, type: datetime, source: input, description: "Logical time the change takes effect; publish requires effective_from >= now + 72h" }
      - { name: effective_to, type: datetime, source: input, description: "Optional end of effect window; must be > effective_from when present" }
      - { name: new_headway_minutes, type: integer, source: input, description: "Required for HEADWAY_CHANGE; new route headway target", constraints: "> 0 when present" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | EFFECTIVE | CANCELLED; initial DRAFT; PUBLISHED -> EFFECTIVE via run-ops once now >= effective_from" }
      - { name: published_at, type: datetime, source: system, description: "Logical time of publish; null until published" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit cited" }
      - { name: violation_code, type: enum, source: input, description: "EXPIRED_PERMIT | WRONG_LOT | NO_PERMIT_DISPLAY | BLOCKED_LANE | PARKED_AFTER_REVOCATION" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of issuing EnforcementOfficer; segregation-of-duties anchor" }
      - { name: issued_at, type: datetime, source: system, description: "Logical time of issuance" }
      - { name: fine_cents, type: integer, source: computed, description: "violation_fine_escalation result at issuance" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REVERSED; initial UNPAID; parallel dimension 1" }
      - { name: appeal_status, type: enum, source: system, description: "NONE | APPEALED | UPHELD | DISMISSED; initial NONE; parallel dimension 2" }
      - { name: charge_entry_id, type: string, source: system, description: "FK -> ChargeEntry.id; VIOLATION_FINE entry created at issuance in the open cycle" }

  - name: TowEvent
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; suspended permit whose vehicle is towed" }
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id; triggering violation; must belong to permit_id" }
      - { name: authorized_by, type: string, source: system, description: "X-User-ID of authorizing EnforcementOfficer" }
      - { name: status, type: enum, source: system, description: "AUTHORIZED | TOWED | RELEASED | CANCELLED; initial AUTHORIZED" }
      - { name: towed_at, type: datetime, source: system, description: "Logical time of MARK_TOWED; null until towed" }
      - { name: released_at, type: datetime, source: system, description: "Logical time of RELEASE; null until released" }
      - { name: impound_fee_cents, type: integer, source: computed, description: "tow_impound_fee result computed at RELEASE; null until released" }
      - { name: charge_entry_id, type: string, source: system, description: "FK -> ChargeEntry.id; TOW_FEE entry created at RELEASE; null until released" }

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ParkingProgram.id; billed program" }
      - { name: period_start, type: string, source: input, description: "ISO date, closed-interval start" }
      - { name: period_end, type: string, source: input, description: "ISO date, closed-interval end; must be >= period_start; cycles of one program may not overlap on any calendar day" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | EXPORTED; initial OPEN; EXPORTED -> CLOSED allowed on payroll rejection" }
      - { name: subsidy_per_capita_cap_cents, type: integer, source: computed, description: "floor(monthly_subsidy_pool_cents / max(1, eligible_count_at_open)) snapshot taken at creation; eligible = permits ACTIVE whose employee standing == GOOD_STANDING at that moment" }
      - { name: total_charges_cents, type: integer, source: computed, description: "Sum of amount_cents over entries of this cycle NOT in REVERSED status" }

  - name: ChargeEntry
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> BillingCycle.id; owning cycle (system-assigned at posting; input only for manual adjustments)" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; employee charged" }
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id; permit context for PERMIT_FEE / VIOLATION_FINE / TOW_FEE / PRORATION_CREDIT; null on plain adjustments" }
      - { name: charge_type, type: enum, source: input, description: "PERMIT_FEE | VIOLATION_FINE | TOW_FEE | ADJUSTMENT_CREDIT | ADJUSTMENT_DEBIT; system entries pin their own type" }
      - { name: amount_cents, type: integer, source: computed, description: "Signed amount; debits positive, credits negative; computed for system entries, input for ADJUSTMENT_* (sign enforced by type)" }
      - { name: subsidy_cents, type: integer, source: computed, description: "Subsidy portion embedded in a PERMIT_FEE, prorated over the same span as amount_cents (subsidy_full x span ratio, round_half_up); 0 on other types" }
      - { name: span_start, type: string, source: system, description: "ISO date; billed-span start for PERMIT_FEE entries (inclusive); null on non-fee types" }
      - { name: span_end, type: string, source: system, description: "ISO date; billed-span end for PERMIT_FEE entries (inclusive); null on non-fee types" }
      - { name: status, type: enum, source: system, description: "PENDING | APPLIED | EXPORTED | SETTLED | DEDUCTION_FAILED | REVERSED; initial PENDING" }
      - { name: description, type: string, source: input, description: "Optional free text for manual adjustments" }

  - name: PeakWindow
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; must reference a tier == REMOTE lot" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open window end (exclusive); must be > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ENDED | CANCELLED; initial SCHEDULED; run-ops advances SCHEDULED->ACTIVE when starts_at <= now < ends_at and ACTIVE->ENDED when now >= ends_at" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ParkingProgram
    field: posture
    initial_state: PROGRAM_NORMAL
    terminal_states: [PROGRAM_CLOSED]
    transitions:
      - from: PROGRAM_NORMAL
        to: PROGRAM_FROZEN
        trigger: "POST /parking/programs/{program_id}/posture {posture: PROGRAM_FROZEN}"
        actor: ParkingAdmin
        preconditions: []
        side_effects:
          - "Waitlist promotion is disabled while FROZEN; new permit applications and renewal creations are rejected with ERR_PROGRAM_FROZEN"
      - from: PROGRAM_FROZEN
        to: PROGRAM_NORMAL
        trigger: "POST /parking/programs/{program_id}/posture {posture: PROGRAM_NORMAL}"
        actor: ParkingAdmin
        preconditions: []
        side_effects:
          - "Runs a waitlist promotion pass on every bookable lot of the program (lots in created_at ASC order)"
      - from: PROGRAM_NORMAL
        to: PROGRAM_CLOSED
        trigger: "POST /parking/programs/{program_id}/posture {posture: PROGRAM_CLOSED}"
        actor: ParkingAdmin
        preconditions:
          - "No Permit of the program in REQUESTED, WAITLISTED, OFFERED, ACTIVE, or SUSPENDED"
          - "No BillingCycle of the program in OPEN"
        side_effects: []
      - from: PROGRAM_FROZEN
        to: PROGRAM_CLOSED
        trigger: "POST /parking/programs/{program_id}/posture {posture: PROGRAM_CLOSED}"
        actor: ParkingAdmin
        preconditions:
          - "No Permit of the program in REQUESTED, WAITLISTED, OFFERED, ACTIVE, or SUSPENDED"
          - "No BillingCycle of the program in OPEN"
        side_effects: []

  - entity: Employee
    field: employment_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /parking/employees/{employee_id}/terminate"
        actor: ParkingAdmin
        preconditions: []
        side_effects:
          - "terminated_at set to current logical time"
          - "Permits of this employee are NOT revoked here; revocation happens in the run-ops termination sweep"

  - entity: ParkingLot
    field: status
    initial_state: "ACTIVE (tier CORE) | STANDBY (tier REMOTE)"
    terminal_states: []
    transitions:
      - from: STANDBY
        to: ACTIVATED
        trigger: "system (run-ops: a PeakWindow for this lot enters ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot becomes bookable; a waitlist promotion pass runs on this lot"
      - from: ACTIVATED
        to: STANDBY
        trigger: "system (run-ops: the lot's ACTIVE PeakWindow reaches ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot becomes unbookable for new applications; existing ACTIVE permits are unaffected"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (run-ops: a PUBLISHED LOT_CLOSURE ServiceChangeNotice for this lot reaches effective_from)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Permit with lot_id == this lot and status == ACTIVE transitions to SUSPENDED with suspension_reason=LOT_CLOSURE, suspended_at=now (link 2 of the notice cascade)"
          - "Each such suspension applies span truncation: the permit's PENDING PERMIT_FEE entry in the program's OPEN cycle whose [span_start, span_end] contains the suspension date is REVERSED and a truncated PENDING repost [span_start, suspension date] is created (link 3 of the notice cascade); spans already ended before the suspension date are untouched; skipped when no OPEN cycle exists"
      - from: ACTIVATED
        to: CLOSED
        trigger: "system (run-ops: LOT_CLOSURE notice effectiveness)"
        actor: system
        preconditions: []
        side_effects:
          - "Same permit suspension cascade as ACTIVE->CLOSED"
      - from: STANDBY
        to: CLOSED
        trigger: "system (run-ops: LOT_CLOSURE notice effectiveness)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: ACTIVE
        trigger: "system (run-ops: LOT_REOPEN notice effectiveness, tier CORE)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Permit with lot_id == this lot, status == SUSPENDED and suspension_reason == LOT_CLOSURE transitions to ACTIVE (auto-reinstate) and a PENDING PERMIT_FEE prorated for reinstate date..period_end is posted in the OPEN cycle when one exists"
          - "Waitlist promotion pass runs on this lot"
      - from: CLOSED
        to: STANDBY
        trigger: "system (run-ops: LOT_REOPEN notice effectiveness, tier REMOTE)"
        actor: system
        preconditions: []
        side_effects:
          - "Same LOT_CLOSURE auto-reinstate cascade as CLOSED->ACTIVE"

  - entity: Permit
    field: status
    initial_state: "OFFERED (slot available) | WAITLISTED (no slot)"
    terminal_states: [REVOKED, DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: OFFERED
        trigger: "system (synchronous evaluation inside POST /parking/permits: available_slots >= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "offered_at = now; offer_expires_at = now + program.waitlist_offer_ttl_hours; lot.reserved_slots +1 (derived)"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "system (synchronous evaluation inside POST /parking/permits: available_slots == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: OFFERED
        trigger: "system (waitlist promotion pass after slot release, capacity increase, unfreeze, lot activation/reopen, or run-ops)"
        actor: system
        preconditions:
          - "Lot bookable (ACTIVE or ACTIVATED) and program posture == PROGRAM_NORMAL"
          - "available_slots >= 1 at promotion moment"
          - "Permit is the highest-ranked WAITLISTED entry per waitlist_promotion_order"
        side_effects:
          - "offered_at = now; offer_expires_at = now + program.waitlist_offer_ttl_hours; lot.reserved_slots +1 (derived)"
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /parking/permits/{permit_id}/events {event_type: ACCEPT}"
        actor: "Employee (own permit) or ParkingAdmin"
        preconditions:
          - "now <= offer_expires_at (inclusive boundary; ERR_OFFER_EXPIRED past it)"
          - "Employee.employment_status == ACTIVE (ERR_EMPLOYEE_NOT_ACTIVE)"
          - "Employee.standing == GOOD_STANDING (ERR_BILLING_HOLD)"
          - "An OPEN BillingCycle exists for the program (ERR_NO_OPEN_BILLING_CYCLE)"
        side_effects:
          - "activated_at = now; term_end = activation date + 12 months"
          - "monthly_fee_cents = GROSS fee snapshot per permit_monthly_fee (tier base x shift multiplier)"
          - "Posts a PENDING PERMIT_FEE ChargeEntry in the OPEN cycle with span [activation date, period_end]; amount = proration_charge over that span of (gross - subsidy_full), subsidy_full derived with the OPEN cycle's subsidy_per_capita_cap_cents"
          - "lot.reserved_slots -1 and lot.occupied_slots +1 (derived)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /parking/permits/{permit_id}/events {event_type: DECLINE}"
        actor: "Employee (own permit) or ParkingAdmin"
        preconditions: []
        side_effects:
          - "lot.reserved_slots -1 (derived); immediate waitlist promotion pass on this lot"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (run-ops offer-expiry sweep: offer_expires_at < now)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.reserved_slots -1 (derived); promotion pass continues within the same run-ops"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (violation threshold / LOT_CLOSURE cascade) or POST /parking/permits/{permit_id}/events {event_type: SUSPEND, suspension_reason?: ADMIN | BILLING_HOLD} (admin path)"
        actor: "system or ParkingAdmin"
        preconditions:
          - "Violation path: after creation, unpaid count for this permit >= program.violation_suspension_threshold"
        side_effects:
          - "suspended_at = now; suspension_reason set (VIOLATION_THRESHOLD | LOT_CLOSURE from system paths; admin path takes the optional input, default ADMIN)"
          - "Span truncation: the permit's PENDING PERMIT_FEE entry in the OPEN cycle whose [span_start, span_end] contains the suspension date -> REVERSED, and a truncated PENDING repost [span_start, suspension date] is posted; spans already ended before the suspension date are untouched; skipped when no OPEN cycle exists"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /parking/permits/{permit_id}/events {event_type: REINSTATE} or system (LOT_REOPEN cascade)"
        actor: "ParkingAdmin or system"
        preconditions:
          - "If suspension_reason == VIOLATION_THRESHOLD: unpaid violation count for the permit < program.violation_suspension_threshold (ERR_REINSTATE_BLOCKED)"
          - "If suspension_reason == LOT_CLOSURE: lot bookable (ERR_REINSTATE_BLOCKED)"
          - "If suspension_reason == BILLING_HOLD or ADMIN: Employee.standing == GOOD_STANDING (ERR_REINSTATE_BLOCKED)"
          - "An OPEN BillingCycle exists for the program (ERR_NO_OPEN_BILLING_CYCLE)"
        side_effects:
          - "suspension_reason cleared; lot.occupied_slots +1 (derived)"
          - "Posts a new PENDING PERMIT_FEE span [reinstate date, period_end] in the OPEN cycle"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (run-ops termination sweep: Employee.employment_status == TERMINATED) or POST /parking/permits/{permit_id}/events {event_type: REVOKE}"
        actor: "system or ParkingAdmin"
        preconditions: []
        side_effects:
          - "Span truncation: the permit's PENDING PERMIT_FEE entry in the OPEN cycle whose [span_start, span_end] contains the revocation date -> REVERSED, and a truncated PENDING repost [span_start, revocation date] is posted; earlier ended spans untouched; skipped when no OPEN cycle exists"
          - "lot.occupied_slots -1 (derived); immediate waitlist promotion pass on this lot"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (termination sweep) or POST /parking/permits/{permit_id}/events {event_type: REVOKE}"
        actor: "system or ParkingAdmin"
        preconditions: []
        side_effects:
          - "No additional billing adjustment (fee already prorated at suspension); lot.occupied_slots -1 (derived); promotion pass"
      - from: OFFERED
        to: REVOKED
        trigger: "system (termination sweep) or POST /parking/permits/{permit_id}/events {event_type: REVOKE}"
        actor: "system or ParkingAdmin"
        preconditions: []
        side_effects:
          - "lot.reserved_slots -1 (derived); promotion pass"
      - from: WAITLISTED
        to: REVOKED
        trigger: "system (termination sweep) or POST /parking/permits/{permit_id}/events {event_type: REVOKE}"
        actor: "system or ParkingAdmin"
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /parking/permits/{permit_id}/events {event_type: CANCEL}"
        actor: "Employee (own permit) or ParkingAdmin"
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /parking/permits/{permit_id}/events {event_type: CANCEL}"
        actor: "Employee (own permit) or ParkingAdmin"
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /parking/permits/{permit_id}/events {event_type: CANCEL}"
        actor: "Employee (own permit) or ParkingAdmin"
        preconditions: []
        side_effects:
          - "lot.reserved_slots -1 (derived); promotion pass"

  - entity: PermitRenewal
    field: status
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a new PermitRenewal is created for the same permit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: APPROVED
        trigger: "POST /parking/renewals/{renewal_id}/decide {decision: APPROVE}"
        actor: ParkingAdmin
        preconditions:
          - "Permit.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Permit.term_end extended by 12 months; decided_by set"
      - from: PENDING
        to: REJECTED
        trigger: "POST /parking/renewals/{renewal_id}/decide {decision: REJECT}"
        actor: ParkingAdmin
        preconditions: []
        side_effects:
          - "decided_by set"
      - from: PENDING
        to: EXPIRED
        trigger: "system (run-ops: Permit.term_end < now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShuttleRoute
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /parking/routes/{route_id}/events {event_type: SUSPEND} or system (ROUTE_SUSPENSION notice effectiveness)"
        actor: "ShuttleDispatcher or system"
        preconditions: []
        side_effects:
          - "Trips of this route are NOT cancelled; SCHEDULED trips remain but DEPART is rejected with ERR_ROUTE_NOT_ACTIVE while the route is SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /parking/routes/{route_id}/events {event_type: RESUME}"
        actor: ShuttleDispatcher
        preconditions: []
        side_effects: []

  - entity: ShuttleTrip
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /parking/trips/{trip_id}/events {event_type: DEPART}"
        actor: ShuttleDispatcher
        preconditions:
          - "ShuttleRoute.status == ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
        side_effects:
          - "actual_departure_at = now"
      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /parking/trips/{trip_id}/events {event_type: COMPLETE, boarded_count}"
        actor: ShuttleDispatcher
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /parking/trips/{trip_id}/events {event_type: CANCEL}"
        actor: ShuttleDispatcher
        preconditions: []
        side_effects: []
      - from: DEPARTED
        to: CANCELLED
        trigger: "POST /parking/trips/{trip_id}/events {event_type: CANCEL}"
        actor: ShuttleDispatcher
        preconditions: []
        side_effects: []

  - entity: ServiceChangeNotice
    field: status
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /parking/notices/{notice_id}/events {event_type: PUBLISH}"
        actor: ParkingAdmin
        preconditions:
          - "effective_from >= now + 72 hours (ERR_NOTICE_EFFECTIVE_TOO_SOON)"
        side_effects:
          - "published_at = now"
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "system (run-ops: now >= effective_from)"
        actor: system
        preconditions: []
        side_effects:
          - "LOT_CLOSURE: target lot -> CLOSED (cascades per ParkingLot transitions)"
          - "LOT_REOPEN: target lot CLOSED -> ACTIVE (CORE) or STANDBY (REMOTE) with LOT_CLOSURE auto-reinstate cascade"
          - "ROUTE_SUSPENSION: target route -> SUSPENDED (trips are NOT cancelled; DEPART is blocked while SUSPENDED)"
          - "HEADWAY_CHANGE: route.headway_target_minutes := new_headway_minutes"
          - "GENERAL: no structural effect"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /parking/notices/{notice_id}/events {event_type: CANCEL}"
        actor: ParkingAdmin
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /parking/notices/{notice_id}/events {event_type: CANCEL}"
        actor: ParkingAdmin
        preconditions: []
        side_effects: []

  - entity: Violation
    field: "payment_status x appeal_status (parallel dimensions)"
    initial_state: "payment_status=UNPAID, appeal_status=NONE"
    terminal_states: []
    transitions:
      - from: "appeal_status NONE"
        to: APPEALED
        trigger: "POST /parking/violations/{violation_id}/events {event_type: APPEAL}"
        actor: "Employee (owner of the cited permit)"
        preconditions:
          - "payment_status == UNPAID (ERR_INVALID_STATE)"
          - "now <= issued_at + 14 days inclusive (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: []
      - from: APPEALED
        to: UPHELD
        trigger: "POST /parking/violations/{violation_id}/events {event_type: DECIDE_APPEAL, decision: UPHELD}"
        actor: AppealsOfficer
        preconditions:
          - "deciding officer X-User-ID != issued_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /parking/violations/{violation_id}/events {event_type: DECIDE_APPEAL, decision: DISMISSED}"
        actor: AppealsOfficer
        preconditions:
          - "deciding officer X-User-ID != issued_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "payment_status -> REVERSED (cross-dimension side effect)"
          - "Linked VIOLATION_FINE entry -> REVERSED when still PENDING; when already APPLIED/EXPORTED, an ADJUSTMENT_CREDIT for the fine amount is posted in the program's current OPEN cycle if one exists"
      - from: "payment_status UNPAID"
        to: PAID
        trigger: "system (linked VIOLATION_FINE ChargeEntry settles to SETTLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment_status UNPAID"
        to: REVERSED
        trigger: "system (appeal DISMISSED cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TowEvent
    field: status
    initial_state: AUTHORIZED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: AUTHORIZED
        to: TOWED
        trigger: "POST /parking/tow-events/{tow_event_id}/events {event_type: MARK_TOWED}"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "towed_at = now"
      - from: TOWED
        to: RELEASED
        trigger: "POST /parking/tow-events/{tow_event_id}/events {event_type: RELEASE}"
        actor: EnforcementOfficer
        preconditions:
          - "An OPEN BillingCycle exists for the program (ERR_NO_OPEN_BILLING_CYCLE)"
        side_effects:
          - "released_at = now; impound_fee_cents = tow_impound_fee(towed_at, released_at)"
          - "Posts a PENDING TOW_FEE ChargeEntry in the OPEN cycle; TowEvent.charge_entry_id set"
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /parking/tow-events/{tow_event_id}/events {event_type: CANCEL}"
        actor: EnforcementOfficer
        preconditions: []
        side_effects: []

  - entity: BillingCycle
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /parking/billing-cycles/{cycle_id}/close"
        actor: PayrollAdmin
        preconditions:
          - "expected_billing_cycle_version matches current version (OCC; ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "PENDING entries of this cycle -> APPLIED"
          - "total_charges_cents recomputed; increments BillingCycle.version by 1"
      - from: CLOSED
        to: EXPORTED
        trigger: "POST /parking/billing-cycles/{cycle_id}/events {event_type: EXPORT}"
        actor: PayrollAdmin
        preconditions: []
        side_effects:
          - "APPLIED entries of this cycle -> EXPORTED"
      - from: EXPORTED
        to: CLOSED
        trigger: "POST /parking/billing-cycles/{cycle_id}/events {event_type: REJECT_EXPORT}"
        actor: PayrollAdmin
        preconditions:
          - "No entry of this cycle in SETTLED or DEDUCTION_FAILED (ERR_INVALID_STATE)"
        side_effects:
          - "EXPORTED entries of this cycle -> APPLIED (compensation of the export)"

  - entity: ChargeEntry
    field: status
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "system (billing cycle close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REVERSED
        trigger: "system (permit suspension/revocation billing adjustment, appeal dismissal, or admin reversal)"
        actor: system
        preconditions: []
        side_effects:
          - "Excluded from BillingCycle.total_charges_cents"
      - from: APPLIED
        to: EXPORTED
        trigger: "system (billing cycle export)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: REVERSED
        trigger: "system (cycle EXPORTED -> CLOSED rejection returns entries to APPLIED first; dismissal credit path posts a compensating ADJUSTMENT_CREDIT instead of reversing APPLIED rows)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPORTED
        to: SETTLED
        trigger: "POST /parking/charge-entries/{entry_id}/settle {outcome: SETTLED}"
        actor: PayrollAdmin
        preconditions: []
        side_effects:
          - "When charge_type == VIOLATION_FINE: linked Violation.payment_status UNPAID -> PAID"
      - from: EXPORTED
        to: DEDUCTION_FAILED
        trigger: "POST /parking/charge-entries/{entry_id}/settle {outcome: DEDUCTION_FAILED}"
        actor: PayrollAdmin
        preconditions: []
        side_effects:
          - "Employee.balance_due_cents increases by amount_cents; Employee.standing recomputed (BILLING_HOLD when > 0); permits are NOT auto-suspended (BILLING_HOLD suspension is an explicit admin action)"
      - from: DEDUCTION_FAILED
        to: SETTLED
        trigger: "POST /parking/charge-entries/{entry_id}/settle {outcome: SETTLED}"
        actor: PayrollAdmin
        preconditions: []
        side_effects:
          - "Employee.balance_due_cents decreases by amount_cents; Employee.standing recomputed"
          - "When charge_type == VIOLATION_FINE: linked Violation.payment_status UNPAID -> PAID"

  - entity: PeakWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (run-ops: starts_at <= now < ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Target lot STANDBY -> ACTIVATED (promotion pass runs on the lot)"
      - from: ACTIVE
        to: ENDED
        trigger: "system (run-ops: now >= ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Target lot ACTIVATED -> STANDBY"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /parking/peak-windows/{peak_window_id}/cancel"
        actor: ParkingAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (true races resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /parking/permits/{permit_id}/renewals"
    occ_field: expected_permit_version
    description: |
      Creating a PermitRenewal against a Permit whose version has advanced since the
      client last observed it is rejected. Creating a renewal legitimately supersedes
      any PENDING renewal of the same permit, so a writer holding a stale view of the
      permit (e.g. another writer's renewal create or a cascade-driven suspension has
      already bumped Permit.version) must re-read before writing.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
  - rule_id: cycle-close-stale-cycle
    parent_entity: BillingCycle
    write_endpoint: "POST /parking/billing-cycles/{cycle_id}/close"
    occ_field: expected_billing_cycle_version
    description: |
      Closing a BillingCycle whose version has advanced since the client last observed
      it is rejected. Entry postings (activation fees, proration reposts, manual
      adjustments) bump BillingCycle.version, so a closer holding a stale snapshot would
      otherwise finalize a total it never saw.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_monthly_fee
    trigger: "Permit OFFERED -> ACTIVE (gross snapshot onto Permit.monthly_fee_cents); and again at every PERMIT_FEE posting for the subsidy/net derivation against the billed cycle"
    algorithm: tiered_pricing
    formula: |
      At activation (once per activation span):
        base    = BASE_RATE_BY_TIER[lot.tier]
        gross   = round_half_up(base * SHIFT_MULTIPLIER[permit.queue_shift_pattern])   # integer cents; stored as Permit.monthly_fee_cents
      At every PERMIT_FEE posting against a cycle (activation entry, cycle-open entry, truncation repost, reinstate span):
        cap          = billed_cycle.subsidy_per_capita_cap_cents                       # snapshot taken at cycle creation, NOT recomputed live
        subsidy_full = min( round_half_up(SUBSIDY_PCT[permit.queue_shift_pattern] * gross), cap, gross )
        net_full     = gross - subsidy_full                                            # >= 0 by the min(..., gross) clamp
        amount_cents  = proration_charge(net_full, span, program.proration_mode)
        subsidy_cents = same proration ratio applied to subsidy_full, round_half_up (CALENDAR_DAY: subsidy_full * active_days / days_in_period; HALF_MONTH: subsidy_full if span day_index <= 15 else round_half_up(subsidy_full / 2))
      Evaluation order is fixed: gross -> subsidy_full -> net_full -> per-entry proration.
    input_set: "The permit, its lot (tier), its queue_shift_pattern snapshot, the program config, and the billed cycle's subsidy_per_capita_cap_cents"
    constants:
      BASE_RATE_CORE_CENTS: 12000
      BASE_RATE_REMOTE_CENTS: 6000
      SHIFT_MULTIPLIER_DAY: 1.0
      SHIFT_MULTIPLIER_NIGHT: 0.75
      SHIFT_MULTIPLIER_ROTATING: 0.85
      SHIFT_MULTIPLIER_SPLIT: 1.1
      SUBSIDY_PCT_DAY: 0.10
      SUBSIDY_PCT_NIGHT: 0.40
      SUBSIDY_PCT_ROTATING: 0.25
      SUBSIDY_PCT_SPLIT: 0.15
    precision: "integer cents; round_half_up at each marked step"

  - name: subsidy_per_capita_cap
    trigger: "BillingCycle creation (stored as BillingCycle.subsidy_per_capita_cap_cents)"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency, pinned evaluation order:
        (1) standing snapshot: read every employee's CURRENT standing (settled by prior cycles only)
        (2) eligible_count = count of permits with status == ACTIVE whose employee.standing == GOOD_STANDING,
            evaluated over all lots of the program at creation instant
        (3) cap = floor(program.monthly_subsidy_pool_cents / max(1, eligible_count))
        (4) each fee charged against this cycle uses this stored cap (see permit_monthly_fee)
      Eligibility intentionally does NOT depend on the subsidy being computed; the standing
      snapshot in step (1) breaks the circle.
    input_set: "Permits of the program in status ACTIVE at cycle-creation instant, joined to their employees' standing"
    precision: "integer cents; floor division"

  - name: proration_charge
    trigger: "PERMIT_FEE posting at accept (span [activation date, period_end]), at cycle creation for already-ACTIVE permits (span [period_start, period_end]), at suspension/revocation truncation repost (span [span_start, event date]), at reinstate repost (span [reinstate date, period_end])"
    algorithm: forward_looking
    formula: |
      Input fee is net_full (gross snapshot minus subsidy_full of the billed cycle, per permit_monthly_fee).
      days_in_period = (period_end - period_start).days + 1            # closed interval
      active_days    = number of calendar days of the billed span [span_start, span_end] intersected with the period, both inclusive
      Variant CALENDAR_DAY:
        amount = round_half_up(net_full * active_days / days_in_period)
      Variant HALF_MONTH:
        day_index = (span_start - period_start).days + 1               # 1-based day of period at span start
        activation/reinstate span: amount = net_full if day_index <= 15 else round_half_up(net_full / 2)
        truncation repost (span ends at the suspension/revocation date): amount = net_full if (span_end - period_start).days + 1 > 15 else round_half_up(net_full / 2)
      Rounding order (pinned): EVERY ChargeEntry amount is rounded half-up to integer cents at
      posting time; BillingCycle.total_charges_cents is the integer SUM of non-REVERSED entries
      and is never re-rounded. (Per-entry-then-sum is the pinned order; sum-then-round is rejected.)
    input_set: "The permit's net_full for the billed cycle, the cycle's period dates, the entry span, and the event date (logical clock)"
    precision: "integer cents, round_half_up per entry, sum without re-rounding"
    variants:
      - name: CALENDAR_DAY
        when: "ParkingProgram.proration_mode == CALENDAR_DAY"
        difference: "Exact calendar-day ratio; e.g. net 10800 activated 2026-08-11 in a 31-day period -> 21 active days -> 7316"
      - name: HALF_MONTH
        when: "ParkingProgram.proration_mode == HALF_MONTH"
        difference: "Half-month split on day 15/16; same inputs -> day_index 11 <= 15 -> full 10800 (diverges from 7316)"

  - name: waitlist_promotion_order
    trigger: "Any slot release (decline, revoke, offer expiry at run-ops), capacity increase, lot STANDBY->ACTIVATED or CLOSED->ACTIVE/STANDBY, program unfreeze, and the run-ops promotion pass"
    algorithm: chronological
    formula: |
      candidate set: permits with status == WAITLISTED and lot_id == target lot
      ranking:       shift class priority DESC  (NIGHT=3 > ROTATING=2 > SPLIT=1 > DAY=0)
                     then created_at ASC
                     then employee badge_number ASC  (final tie-break; ids are never used)
      promotion:     while available_slots >= 1 and candidates remain:
                       promote top candidate to OFFERED (offered_at=now, offer_expires_at=now+ttl)
      available_slots = lot.capacity - count(ACTIVE on lot) - count(OFFERED on lot with offer_expires_at >= now)
      Multi-lot passes process lots in lot.created_at ASC order.
    input_set: "WAITLISTED permits of one lot; OFFERED permits with unexpired offers count as reserved"
    precision: "not numeric"

  - name: violation_fine_escalation
    trigger: "Violation creation (POST /parking/violations)"
    algorithm: threshold
    formula: |
      prior_unpaid = count of Violations with permit_id == this permit,
                     payment_status == UNPAID, and issued_at >= (now - 365 days)  [inclusive boundary]
      fine_cents   = round_half_up(BASE_FINE_BY_CODE[violation_code] * (1 + ESCALATION_STEP * prior_unpaid))
      Suspension trigger (after entry posting): if prior_unpaid + 1 >= program.violation_suspension_threshold
      and permit.status == ACTIVE: permit -> SUSPENDED with suspension_reason=VIOLATION_THRESHOLD.
      (>= comparison: the violation that REACHES the threshold suspends.)
    input_set: "Violations of the same permit with payment_status == UNPAID inside the rolling 365-day window; PAID or REVERSED excluded"
    constants:
      BASE_FINE_EXPIRED_PERMIT_CENTS: 5000
      BASE_FINE_WRONG_LOT_CENTS: 3500
      BASE_FINE_NO_PERMIT_DISPLAY_CENTS: 2500
      BASE_FINE_BLOCKED_LANE_CENTS: 7500
      BASE_FINE_PARKED_AFTER_REVOCATION_CENTS: 10000
      ESCALATION_STEP: 0.5
      WINDOW_DAYS: 365
    precision: "integer cents, round_half_up"

  - name: tow_impound_fee
    trigger: "TowEvent TOWED -> RELEASED"
    algorithm: chronological
    formula: |
      held_seconds = released_at - towed_at (logical clock)
      days_held    = max(1, ceil(held_seconds / 86400))
      impound_fee_cents = TOW_BASE_CENTS + STORAGE_DAILY_CENTS * days_held
    input_set: "The TowEvent's towed_at and released_at"
    constants:
      TOW_BASE_CENTS: 15000
      STORAGE_DAILY_CENTS: 2500
    precision: "integer cents"

  - name: shuttle_wait_time_service_level
    trigger: "GET /parking/routes/{route_id}/service-level"
    algorithm: chronological
    formula: |
      Input window: trips with scheduled_departure_at in [window_start, window_end] inclusive.
      Common shape: order participating trips by departure ASC (tie-break: created_at ASC);
      gaps = consecutive departure deltas in minutes;
      max_gap_minutes = max(gaps); expected_wait_minutes = round(mean(gaps) / 2, 2);
      sla_compliant = (max_gap_minutes <= 2 * route.headway_target_minutes).
      If fewer than 2 participating trips: gaps empty -> expected_wait_minutes = null and sla_compliant = null.
      Variant SCHEDULED (mode=SCHEDULED):
        participants = ALL trips in window regardless of status (the published timetable);
        departure = scheduled_departure_at
      Variant OBSERVED (mode=OBSERVED):
        participants = trips in window with actual_departure_at set (DEPARTED or COMPLETED);
        departure = actual_departure_at; CANCELLED and never-departed trips are excluded,
        which stretches the adjacent observed gaps.
    input_set: "ShuttleTrips of the route filtered by window and variant-specific status set"
    precision: "minutes, 2 decimals round_half_up for expected_wait; integer minutes for gaps"
    variants:
      - name: SCHEDULED
        when: "mode=SCHEDULED"
        difference: "Uses the published timetable: every trip in the window participates by its scheduled_departure_at, whatever its status"
      - name: OBSERVED
        when: "mode=OBSERVED"
        difference: "Uses actual departures only; cancelled trips widen gaps (e.g. 4 trips 10 min apart with the middle two cancelled: SCHEDULED max_gap 10 -> compliant, OBSERVED max_gap 30 -> non-compliant)"

  - name: program_cost_per_employee
    trigger: "GET /parking/programs/{program_id}/cost-report"
    algorithm: aggregation
    formula: |
      total_cost_cents = sum over routes of the program (count of COMPLETED trips all-time * route.operating_cost_per_trip_cents)
                       + sum over all lots of the program of lot.monthly_maintenance_cents
      subsidy_spent_cents = sum of subsidy_cents over PERMIT_FEE ChargeEntries of the program NOT in REVERSED status
      active_permit_count = count of permits of the program with status == ACTIVE at read time
      denominator = max(1, active_permit_count)
      Variant GROSS: cost_per_employee_cents = round_half_up(total_cost_cents / denominator)
      Variant NET:   cost_per_employee_cents = round_half_up((total_cost_cents - subsidy_spent_cents) / denominator)
      Both variants are returned in one response (gross_cost_per_employee_cents, net_cost_per_employee_cents).
    input_set: "All-time COMPLETED trips of program routes; all lots of the program; all non-REVERSED PERMIT_FEE entries of the program; currently ACTIVE permits"
    precision: "integer cents, round_half_up division"
    variants:
      - name: GROSS
        when: "always reported"
        difference: "Total program cost divided by active permits, subsidy ignored"
      - name: NET
        when: "always reported"
        difference: "Subsidy spend subtracted from total cost before division; identical inputs, lower result whenever subsidy_spent_cents > 0"

  - name: employee_balance_due
    trigger: "ChargeEntry transitions into/out of DEDUCTION_FAILED (settle); read of Employee"
    algorithm: aggregation
    formula: |
      balance_due_cents = sum of amount_cents over ChargeEntry rows with employee_id == this employee
                          and status == DEDUCTION_FAILED   (REVERSED/SETTLED rows excluded)
      standing = BILLING_HOLD if balance_due_cents > 0 else GOOD_STANDING
      (boundary: balance of exactly 0 is GOOD_STANDING; comparison is strict >)
    input_set: "The employee's ChargeEntry rows currently in DEDUCTION_FAILED status"
    precision: "integer cents"

  - name: lot_occupancy
    trigger: "Any permit status change on the lot; read of ParkingLot; capacity PATCH"
    algorithm: aggregation
    formula: |
      occupied_slots = count of permits with lot_id == lot and status == ACTIVE
      reserved_slots = count of permits with lot_id == lot and status == OFFERED and offer_expires_at >= now
      available_slots = capacity - occupied_slots - reserved_slots
      Application routing at POST /parking/permits: available_slots >= 1 -> OFFERED, else WAITLISTED
      (boundary: available exactly 1 satisfies >= 1 and yields OFFERED; 0 yields WAITLISTED)
    input_set: "Permits of the lot in ACTIVE, plus OFFERED with unexpired offers (expired offers excluded by the offer_expires_at >= now filter)"
    precision: "integer slots"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_AUTH_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles (for permit/violation event endpoints, event-type-specific role restrictions also apply: SUSPEND/REINSTATE/REVOKE are ParkingAdmin-only events, APPEAL is Employee-only, DECIDE_APPEAL is AppealsOfficer-only)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Employee body-ownership: on POST /parking/permits the payload employee_id must equal X-User-ID. (Employee path-ownership — the loaded permit's/violation's owning employee_id must equal X-User-ID — is evaluated immediately after the path resource loads at priority 4, before state checks.)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /parking/permits (priority 3); POST /parking/permits/{id}/events, POST /parking/permits/{id}/renewals, POST /parking/violations/{id}/events (immediately after priority-4 path load)"
  - priority: 4
    category: existence
    check: "Every id in the path and every FK id in the body exists (path ids validated left to right); unknown UUID -> not found"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "OCC: expected_permit_version == Permit.version on renewal create; expected_billing_cycle_version == BillingCycle.version on cycle close (stale snapshot rejected before any state evaluation)"
    error_id: ERR_STALE_PERMIT_VERSION | ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /parking/permits/{id}/renewals; POST /parking/billing-cycles/{id}/close"
  - priority: 6
    category: state
    check: "Lifecycle state precondition of the target resource and posture gates: program not FROZEN/CLOSED for applications and renewal creation (ERR_PROGRAM_FROZEN); permit in the exact from-state of the requested event (ERR_PERMIT_NOT_OFFERED for ACCEPT from non-OFFERED, ERR_INVALID_STATE otherwise); lot bookable for new applications (ERR_LOT_NOT_BOOKABLE); route ACTIVE for trip DEPART (ERR_ROUTE_NOT_ACTIVE); cycle OPEN for adjustments (ERR_CYCLE_NOT_OPEN); tow authorization requires Permit SUSPENDED with suspension_reason == VIOLATION_THRESHOLD (ERR_INVALID_STATE)"
    error_id: "ERR_PROGRAM_FROZEN | ERR_PERMIT_NOT_OFFERED | ERR_INVALID_STATE | ERR_LOT_NOT_BOOKABLE | ERR_ROUTE_NOT_ACTIVE | ERR_CYCLE_NOT_OPEN"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates: Employee.employment_status == ACTIVE for permit ACCEPT and renewal creation (ERR_EMPLOYEE_NOT_ACTIVE); tow triggering violation must have payment_status == UNPAID and appeal_status != DISMISSED (ERR_TOW_VIOLATION_NOT_ENFORCEABLE); appeal decider must differ from the violation's issued_by officer (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_EMPLOYEE_NOT_ACTIVE | ERR_TOW_VIOLATION_NOT_ENFORCEABLE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "permit ACCEPT; POST /parking/permits/{id}/renewals; POST /parking/tow-events; violation DECIDE_APPEAL"
  - priority: 8
    category: business_temporal
    check: "Time-window gates (logical clock): offer accept requires now <= offer_expires_at (ERR_OFFER_EXPIRED); tow authorization requires now >= permit.suspended_at + program.tow_hold_hours (ERR_TOW_HOLD_NOT_ELAPSED); appeal requires now <= issued_at + 14 days inclusive (ERR_APPEAL_WINDOW_CLOSED); notice publish requires effective_from >= now + 72 hours (ERR_NOTICE_EFFECTIVE_TOO_SOON)"
    error_id: "ERR_OFFER_EXPIRED | ERR_TOW_HOLD_NOT_ELAPSED | ERR_APPEAL_WINDOW_CLOSED | ERR_NOTICE_EFFECTIVE_TOO_SOON"
    http_status: 409
    applies_to: "permit ACCEPT; POST /parking/tow-events; violation APPEAL; notice PUBLISH"
    note: "ERR_NOTICE_EFFECTIVE_TOO_SOON returns http 422; the other three return 409"
  - priority: 9
    category: business_constraint
    check: "Structural constraints: one non-terminal permit per employee (ERR_DUPLICATE_ACTIVE_PERMIT); badge_number unique per program (ERR_BADGE_NUMBER_TAKEN); lot code unique per program (ERR_INVALID_REQUEST reused for code conflicts is forbidden -> ERR_BADGE_NUMBER_TAKEN is badge-only; lot code conflicts use ERR_INVALID_REQUEST); PeakWindow half-open overlap on same lot (ERR_PEAK_WINDOW_OVERLAP); BillingCycle closed-interval overlap on same program (ERR_BILLING_CYCLE_OVERLAP); PATCH capacity >= occupied_slots + reserved_slots (ERR_CAPACITY_BELOW_OCCUPANCY); trip scheduled departures on one route spaced >= 5 minutes among non-CANCELLED trips (ERR_TRIP_SPACING_CONFLICT); PeakWindow target lot must be tier REMOTE (ERR_REMOTE_LOT_REQUIRED); manual charge entries limited to ADJUSTMENT_CREDIT (negative amount) / ADJUSTMENT_DEBIT (positive amount)"
    error_id: "ERR_DUPLICATE_ACTIVE_PERMIT | ERR_BADGE_NUMBER_TAKEN | ERR_INVALID_REQUEST | ERR_PEAK_WINDOW_OVERLAP | ERR_BILLING_CYCLE_OVERLAP | ERR_CAPACITY_BELOW_OCCUPANCY | ERR_TRIP_SPACING_CONFLICT | ERR_REMOTE_LOT_REQUIRED"
    http_status: 409
    applies_to: "creation and PATCH endpoints"
    note: "ERR_INVALID_REQUEST returns http 400; ERR_REMOTE_LOT_REQUIRED returns 422; the rest return 409"
  - priority: 10
    category: business_fiscal
    check: "Fiscal gates: Employee.standing == GOOD_STANDING for permit ACCEPT (ERR_BILLING_HOLD); an OPEN BillingCycle for the program must exist for permit ACCEPT, permit REINSTATE, violation issuance, tow RELEASE (ERR_NO_OPEN_BILLING_CYCLE)"
    error_id: "ERR_BILLING_HOLD | ERR_NO_OPEN_BILLING_CYCLE"
    http_status: 409
    applies_to: "permit ACCEPT/REINSTATE; POST /parking/violations; tow RELEASE"
    note: "ERR_BILLING_HOLD returns http 402; ERR_NO_OPEN_BILLING_CYCLE returns 409"
  - priority: 11
    category: business_referential
    check: "Cross-reference coherence: TowEvent.violation_id must reference a violation whose permit_id == the tow's permit_id (ERR_VIOLATION_PERMIT_MISMATCH); ServiceChangeNotice target coherence: LOT_CLOSURE/LOT_REOPEN require lot_id and forbid route_id, ROUTE_SUSPENSION/HEADWAY_CHANGE require route_id and forbid lot_id, HEADWAY_CHANGE requires new_headway_minutes (ERR_NOTICE_TARGET_MISMATCH)"
    error_id: "ERR_VIOLATION_PERMIT_MISMATCH | ERR_NOTICE_TARGET_MISMATCH"
    http_status: 409
    applies_to: "POST /parking/tow-events; POST /parking/notices"
    note: "ERR_NOTICE_TARGET_MISMATCH returns http 422; ERR_VIOLATION_PERMIT_MISMATCH returns 409"

# =============================================================================
# Table 5 preamble: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default logical time before any set is 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [ParkingAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent time-dependent rules (offer expiry, peak windows, notice effectiveness, appeal window, tow hold) evaluate against this clock"]

  # --- ParkingProgram ---
  - method: POST
    path: "/parking/programs"
    description: "Create a parking program (posture PROGRAM_NORMAL, ops_run_index 0)"
    roles: [ParkingAdmin]
    code: 201
    input: [name, "proration_mode?", "monthly_subsidy_pool_cents?", "waitlist_offer_ttl_hours?", "violation_suspension_threshold?", "tow_hold_hours?"]
    output: ParkingProgram
    side_effects: ["posture=PROGRAM_NORMAL, ops_run_index=0, defaults applied for omitted config"]
  - method: GET
    path: "/parking/programs/{id}"
    description: "Get a program"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: ParkingProgram
    side_effects: []
  - method: POST
    path: "/parking/programs/{id}/posture"
    description: "Transition program posture (PROGRAM_FROZEN | PROGRAM_NORMAL | PROGRAM_CLOSED); unfreeze runs a promotion pass on every bookable lot"
    roles: [ParkingAdmin]
    code: 200
    input: [posture]
    output: ParkingProgram
    side_effects: ["PROGRAM_FROZEN blocks POST /parking/permits and renewal creation; unfreeze promotes waitlists lot-by-lot in lot.created_at ASC order"]
  - method: POST
    path: "/parking/programs/{id}/run-ops"
    description: "Advance the ops checkpoint. Ordered steps: (1) PeakWindow activation/ending (STANDBY<->ACTIVATED with promotion pass); (2) PUBLISHED notices with effective_from <= now become EFFECTIVE and fire their cascades; (3) OFFERED permits with offer_expires_at < now -> EXPIRED; (4) termination sweep: every non-terminal permit of a TERMINATED employee -> REVOKED (billing proration repost for ACTIVE; reservation release for OFFERED); (5) waitlist promotion pass per lot (created_at ASC); (6) PENDING renewals with Permit.term_end < now -> EXPIRED; (7) ops_run_index += 1"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: ParkingProgram
    side_effects: ["Cascades per ParkingLot/Permit/PermitRenewal/PeakWindow/ServiceChangeNotice transitions; increments ops_run_index by 1; increments ParkingProgram.version by 1"]
  - method: GET
    path: "/parking/programs/{id}/cost-report"
    description: "Computed program economics: total cost, subsidy spend, active permits, gross and net cost per employee (program_cost_per_employee, both variants in one response)"
    roles: [ParkingAdmin, PayrollAdmin]
    code: 200
    input: []
    output: { total_cost_cents: integer, subsidy_spent_cents: integer, active_permit_count: integer, gross_cost_per_employee_cents: integer, net_cost_per_employee_cents: integer }
    side_effects: []

  # --- Employee ---
  - method: POST
    path: "/parking/employees"
    description: "Register an employee (employment_status ACTIVE, standing GOOD_STANDING, balance_due_cents 0)"
    roles: [ParkingAdmin]
    code: 201
    input: [program_id, badge_number, full_name, employer_code, shift_pattern, hire_date]
    output: Employee
    side_effects: []
  - method: GET
    path: "/parking/employees/{id}"
    description: "Get an employee"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/parking/employees"
    description: "List employees with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["program_id?", "shift_pattern?", "standing?", "employment_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: POST
    path: "/parking/employees/{id}/terminate"
    description: "Terminate employment (sets TERMINATED + terminated_at); permit revocation happens in the run-ops termination sweep"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: ["employment_status=TERMINATED, terminated_at=now"]

  # --- ParkingLot ---
  - method: POST
    path: "/parking/lots"
    description: "Create a lot (CORE starts ACTIVE, REMOTE starts STANDBY; occupied_slots and reserved_slots 0)"
    roles: [ParkingAdmin]
    code: 201
    input: [program_id, code, tier, capacity, "monthly_maintenance_cents?"]
    output: ParkingLot
    side_effects: []
  - method: GET
    path: "/parking/lots/{id}"
    description: "Get a lot (includes computed occupied_slots / reserved_slots)"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: ParkingLot
    side_effects: []
  - method: GET
    path: "/parking/lots"
    description: "List lots with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["program_id?", "tier?", "status?", "limit?", "offset?"]
    output: ParkingLot[]
    side_effects: []
  - method: PATCH
    path: "/parking/lots/{id}"
    description: "Change lot capacity; rejected below occupied+reserved; an increase triggers an immediate promotion pass on the lot"
    roles: [ParkingAdmin]
    code: 200
    input: ["capacity?"]
    output: ParkingLot
    side_effects: ["On capacity increase: waitlist promotion pass on this lot (waitlist_promotion_order)"]

  # --- Permit ---
  - method: POST
    path: "/parking/permits"
    description: "Apply for a permit; synchronously evaluates capacity -> OFFERED (with offer expiry) or WAITLISTED"
    roles: [Employee, ParkingAdmin]
    code: 201
    input: [employee_id, lot_id, vehicle_plate]
    output: Permit
    side_effects: ["queue_shift_pattern snapshot from employee; OFFERED sets offered_at/offer_expires_at; lot occupancy/reservation derived fields update"]
  - method: GET
    path: "/parking/permits/{id}"
    description: "Get a permit"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/parking/permits"
    description: "List permits with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["employee_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/parking/permits/{id}/events"
    description: "Permit lifecycle events: ACCEPT, DECLINE, CANCEL (Employee owner or ParkingAdmin); SUSPEND, REINSTATE, REVOKE (ParkingAdmin only); SUSPEND accepts optional suspension_reason (ADMIN default | BILLING_HOLD)"
    roles: [Employee, ParkingAdmin]
    code: 200
    input: [event_type, "suspension_reason?"]
    output: Permit
    side_effects: ["Per Permit state machine: fee posting/reversal+repost, slot release + promotion pass, suspension bookkeeping"]
  - method: POST
    path: "/parking/permits/{id}/renewals"
    description: "Request permit renewal; supersedes any PENDING renewal of the same permit; OCC-guarded by expected_permit_version"
    roles: [Employee, ParkingAdmin]
    code: 201
    input: [expected_permit_version]
    output: PermitRenewal
    side_effects: ["Existing PENDING renewal of this permit -> SUPERSEDED", "increments Permit.version by 1"]
  - method: GET
    path: "/parking/permits/{id}/renewals"
    description: "List renewals of a permit"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitRenewal[]
    side_effects: []
  - method: POST
    path: "/parking/renewals/{id}/decide"
    description: "Decide a PENDING renewal (decision: APPROVE | REJECT); approval requires permit ACTIVE and extends term_end by 12 months"
    roles: [ParkingAdmin]
    code: 200
    input: [decision]
    output: PermitRenewal
    side_effects: ["APPROVE: Permit.term_end += 12 months; decided_by set"]

  # --- ShuttleRoute / ShuttleTrip ---
  - method: POST
    path: "/parking/routes"
    description: "Create a shuttle route serving a lot (status ACTIVE)"
    roles: [ShuttleDispatcher]
    code: 201
    input: [lot_id, code, headway_target_minutes, operating_cost_per_trip_cents]
    output: ShuttleRoute
    side_effects: []
  - method: GET
    path: "/parking/routes/{id}"
    description: "Get a route"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: ShuttleRoute
    side_effects: []
  - method: GET
    path: "/parking/routes"
    description: "List routes with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: ShuttleRoute[]
    side_effects: []
  - method: POST
    path: "/parking/routes/{id}/events"
    description: "Route events: SUSPEND (cancels its SCHEDULED trips), RESUME"
    roles: [ShuttleDispatcher]
    code: 200
    input: [event_type]
    output: ShuttleRoute
    side_effects: ["SUSPEND: SCHEDULED trips of the route -> CANCELLED"]
  - method: GET
    path: "/parking/routes/{id}/service-level"
    description: "Computed headway/wait-time service level for a window under one mode (shuttle_wait_time_service_level; mode SCHEDULED or OBSERVED)"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: [window_start, window_end, mode]
    output: { max_gap_minutes: integer, expected_wait_minutes: number, sla_compliant: boolean, trip_count: integer }
    side_effects: []
  - method: POST
    path: "/parking/trips"
    description: "Schedule a trip on a route (status SCHEDULED); non-CANCELLED departures on a route must be >= 5 minutes apart"
    roles: [ShuttleDispatcher]
    code: 201
    input: [route_id, scheduled_departure_at]
    output: ShuttleTrip
    side_effects: []
  - method: GET
    path: "/parking/trips/{id}"
    description: "Get a trip"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: ShuttleTrip
    side_effects: []
  - method: GET
    path: "/parking/trips"
    description: "List trips with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["route_id?", "status?", "limit?", "offset?"]
    output: ShuttleTrip[]
    side_effects: []
  - method: POST
    path: "/parking/trips/{id}/events"
    description: "Trip events: DEPART (sets actual_departure_at; route must be ACTIVE), COMPLETE (takes boarded_count), CANCEL"
    roles: [ShuttleDispatcher]
    code: 200
    input: [event_type, "boarded_count?"]
    output: ShuttleTrip
    side_effects: ["DEPART: actual_departure_at = now"]

  # --- ServiceChangeNotice ---
  - method: POST
    path: "/parking/notices"
    description: "Draft a service change notice (DRAFT); target coherence per notice_type (lot_id vs route_id)"
    roles: [ParkingAdmin]
    code: 201
    input: [notice_type, headline, effective_from, "lot_id?", "route_id?", "effective_to?", "new_headway_minutes?"]
    output: ServiceChangeNotice
    side_effects: []
  - method: GET
    path: "/parking/notices/{id}"
    description: "Get a notice"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: ServiceChangeNotice
    side_effects: []
  - method: GET
    path: "/parking/notices"
    description: "List notices with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["lot_id?", "route_id?", "notice_type?", "status?", "limit?", "offset?"]
    output: ServiceChangeNotice[]
    side_effects: []
  - method: POST
    path: "/parking/notices/{id}/events"
    description: "Notice events: PUBLISH (requires effective_from >= now + 72h), CANCEL (from DRAFT or PUBLISHED)"
    roles: [ParkingAdmin]
    code: 200
    input: [event_type]
    output: ServiceChangeNotice
    side_effects: ["PUBLISH sets published_at; effectiveness and cascades happen at run-ops"]

  # --- Violation ---
  - method: POST
    path: "/parking/violations"
    description: "Issue a violation against a permit; computes escalated fine, posts a PENDING VIOLATION_FINE in the OPEN cycle, and may suspend the permit at the unpaid-count threshold"
    roles: [EnforcementOfficer]
    code: 201
    input: [permit_id, violation_code]
    output: Violation
    side_effects: ["fine_cents per violation_fine_escalation; PENDING VIOLATION_FINE entry created (charge_entry_id); on reaching threshold: permit ACTIVE -> SUSPENDED(VIOLATION_THRESHOLD) with fee reversal+proration repost"]
  - method: GET
    path: "/parking/violations/{id}"
    description: "Get a violation"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/parking/violations"
    description: "List violations with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["permit_id?", "charge_entry_id?", "payment_status?", "appeal_status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/parking/violations/{id}/events"
    description: "Violation events: APPEAL (Employee owner, within 14 days, UNPAID only); DECIDE_APPEAL (AppealsOfficer, decision UPHELD|DISMISSED, decider != issuer)"
    roles: [Employee, AppealsOfficer]
    code: 200
    input: [event_type, "decision?"]
    output: Violation
    side_effects: ["DISMISSED: payment_status -> REVERSED; linked fine entry REVERSED if PENDING else compensating ADJUSTMENT_CREDIT posted in current OPEN cycle if any"]

  # --- TowEvent ---
  - method: POST
    path: "/parking/tow-events"
    description: "Authorize a tow for a permit suspended for VIOLATION_THRESHOLD after the hold period; triggering violation must be enforceable and belong to the permit"
    roles: [EnforcementOfficer]
    code: 201
    input: [permit_id, violation_id]
    output: TowEvent
    side_effects: ["status AUTHORIZED; authorized_by = X-User-ID"]
  - method: GET
    path: "/parking/tow-events/{id}"
    description: "Get a tow event"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: TowEvent
    side_effects: []
  - method: GET
    path: "/parking/tow-events"
    description: "List tow events with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["permit_id?", "violation_id?", "charge_entry_id?", "status?", "limit?", "offset?"]
    output: TowEvent[]
    side_effects: []
  - method: POST
    path: "/parking/tow-events/{id}/events"
    description: "Tow events: MARK_TOWED (sets towed_at), RELEASE (computes impound fee, posts PENDING TOW_FEE in the OPEN cycle), CANCEL (from AUTHORIZED)"
    roles: [EnforcementOfficer]
    code: 200
    input: [event_type]
    output: TowEvent
    side_effects: ["RELEASE: impound_fee_cents = tow_impound_fee; charge_entry_id set"]

  # --- BillingCycle / ChargeEntry ---
  - method: POST
    path: "/parking/billing-cycles"
    description: "Open a billing cycle; closed-interval overlap with existing cycles of the program is rejected; snapshots subsidy_per_capita_cap_cents and posts full-period PENDING PERMIT_FEE entries for permits ACTIVE at creation"
    roles: [PayrollAdmin]
    code: 201
    input: [program_id, period_start, period_end]
    output: BillingCycle
    side_effects: ["subsidy_per_capita_cap_cents snapshot (subsidy_per_capita_cap calc); posts full-period PENDING PERMIT_FEE entries (span [period_start, period_end]) for permits ACTIVE at creation, each amount = proration_charge of (gross snapshot - subsidy_full derived with THIS cycle's cap)"]
  - method: GET
    path: "/parking/billing-cycles/{id}"
    description: "Get a billing cycle (includes total_charges_cents and subsidy_per_capita_cap_cents)"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []
  - method: GET
    path: "/parking/billing-cycles"
    description: "List billing cycles with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: BillingCycle[]
    side_effects: []
  - method: POST
    path: "/parking/billing-cycles/{id}/close"
    description: "Close an OPEN cycle (OCC via expected_billing_cycle_version); PENDING entries -> APPLIED; total recomputed"
    roles: [PayrollAdmin]
    code: 200
    input: [expected_billing_cycle_version]
    output: BillingCycle
    side_effects: ["PENDING -> APPLIED for entries of this cycle; total_charges_cents recomputed; increments BillingCycle.version by 1"]
  - method: POST
    path: "/parking/billing-cycles/{id}/events"
    description: "Cycle events: EXPORT (CLOSED -> EXPORTED, entries APPLIED -> EXPORTED), REJECT_EXPORT (EXPORTED -> CLOSED, entries EXPORTED -> APPLIED; forbidden once any entry SETTLED or DEDUCTION_FAILED)"
    roles: [PayrollAdmin]
    code: 200
    input: [event_type]
    output: BillingCycle
    side_effects: ["Entry status cascades per BillingCycle state machine"]
  - method: POST
    path: "/parking/charge-entries"
    description: "Post a manual adjustment to an OPEN cycle; charge_type limited to ADJUSTMENT_CREDIT (amount_cents negative) or ADJUSTMENT_DEBIT (amount_cents positive)"
    roles: [PayrollAdmin]
    code: 201
    input: [cycle_id, employee_id, charge_type, amount_cents, "description?"]
    output: ChargeEntry
    side_effects: []
  - method: GET
    path: "/parking/charge-entries/{id}"
    description: "Get a charge entry"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: ChargeEntry
    side_effects: []
  - method: GET
    path: "/parking/charge-entries"
    description: "List charge entries with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["cycle_id?", "employee_id?", "permit_id?", "charge_type?", "status?", "limit?", "offset?"]
    output: ChargeEntry[]
    side_effects: []
  - method: POST
    path: "/parking/charge-entries/{id}/settle"
    description: "Settle an EXPORTED (or retry a DEDUCTION_FAILED) entry: outcome SETTLED | DEDUCTION_FAILED; updates employee balance/standing and PAID linkage for VIOLATION_FINE"
    roles: [PayrollAdmin]
    code: 200
    input: [outcome]
    output: ChargeEntry
    side_effects: ["DEDUCTION_FAILED increases Employee.balance_due_cents (standing -> BILLING_HOLD when > 0); SETTLED reverses that; VIOLATION_FINE settle flips Violation.payment_status UNPAID -> PAID"]

  # --- PeakWindow ---
  - method: POST
    path: "/parking/peak-windows"
    description: "Schedule a remote-lot activation window (SCHEDULED); half-open overlap with non-CANCELLED windows of the same lot is rejected; adjacency (starts_at == other.ends_at) is allowed"
    roles: [ParkingAdmin]
    code: 201
    input: [lot_id, starts_at, ends_at]
    output: PeakWindow
    side_effects: []
  - method: GET
    path: "/parking/peak-windows/{id}"
    description: "Get a peak window"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: []
    output: PeakWindow
    side_effects: []
  - method: GET
    path: "/parking/peak-windows"
    description: "List peak windows with filters and pagination"
    roles: [ParkingAdmin, Employee, PayrollAdmin, EnforcementOfficer, AppealsOfficer, ShuttleDispatcher]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: PeakWindow[]
    side_effects: []
  - method: POST
    path: "/parking/peak-windows/{id}/cancel"
    description: "Cancel a SCHEDULED peak window"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: PeakWindow
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_AUTH_CONTEXT, http: 400, condition: "X-User-ID / X-User-Role headers missing or role unknown" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed JSON, missing required field, invalid enum value, bad date/datetime format, sign rule violated on manual adjustment, lot code conflict (client-supplied computed/system fields are silently ignored, never an error)" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on this endpoint (or on this event_type within an events endpoint)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Employee role acting on a resource owned by a different employee" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not exist" }
  - { id: ERR_STALE_PERMIT_VERSION, http: 412, condition: "expected_permit_version does not match Permit.version on renewal create (OCC)" }
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_billing_cycle_version does not match BillingCycle.version on close (OCC)" }
  - { id: ERR_PROGRAM_FROZEN, http: 409, condition: "Program posture FROZEN or CLOSED blocks permit applications and renewal creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic lifecycle violation: event not allowed from the resource's current state (incl. terminal-state lockdown, REJECT_EXPORT after any settlement, tow authorize without VIOLATION_THRESHOLD suspension)" }
  - { id: ERR_PERMIT_NOT_OFFERED, http: 409, condition: "ACCEPT attempted on a permit not in OFFERED status" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "ACCEPT attempted with now > offer_expires_at" }
  - { id: ERR_LOT_NOT_BOOKABLE, http: 409, condition: "Permit application targets a lot in STANDBY or CLOSED" }
  - { id: ERR_ROUTE_NOT_ACTIVE, http: 409, condition: "Trip DEPART while route is SUSPENDED" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Manual adjustment or cycle close attempted on a non-OPEN cycle" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Permit ACCEPT or renewal creation while Employee.employment_status == TERMINATED" }
  - { id: ERR_TOW_VIOLATION_NOT_ENFORCEABLE, http: 409, condition: "Tow authorization with a triggering violation whose payment_status != UNPAID or appeal_status == DISMISSED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Appeal decided by the same officer id that issued the violation" }
  - { id: ERR_TOW_HOLD_NOT_ELAPSED, http: 409, condition: "Tow authorization before permit.suspended_at + program.tow_hold_hours" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "APPEAL after issued_at + 14 days" }
  - { id: ERR_NOTICE_EFFECTIVE_TOO_SOON, http: 422, condition: "PUBLISH with effective_from < now + 72 hours" }
  - { id: ERR_DUPLICATE_ACTIVE_PERMIT, http: 409, condition: "Employee already holds a non-terminal permit (REQUESTED|WAITLISTED|OFFERED|ACTIVE|SUSPENDED)" }
  - { id: ERR_BADGE_NUMBER_TAKEN, http: 409, condition: "badge_number already used by another employee of the same program" }
  - { id: ERR_PEAK_WINDOW_OVERLAP, http: 409, condition: "New peak window overlaps a non-CANCELLED window of the same lot under half-open [starts_at, ends_at) semantics" }
  - { id: ERR_BILLING_CYCLE_OVERLAP, http: 409, condition: "New billing cycle shares at least one calendar day with an existing cycle of the same program (closed intervals; sharing a boundary day is an overlap)" }
  - { id: ERR_CAPACITY_BELOW_OCCUPANCY, http: 409, condition: "PATCH capacity below occupied_slots + reserved_slots" }
  - { id: ERR_TRIP_SPACING_CONFLICT, http: 409, condition: "New trip's scheduled departure within 5 minutes of another non-CANCELLED trip on the same route" }
  - { id: ERR_REMOTE_LOT_REQUIRED, http: 422, condition: "Peak window targets a lot whose tier is not REMOTE" }
  - { id: ERR_BILLING_HOLD, http: 402, condition: "Permit ACCEPT while Employee.standing == BILLING_HOLD (balance_due_cents > 0)" }
  - { id: ERR_NO_OPEN_BILLING_CYCLE, http: 409, condition: "Permit ACCEPT / REINSTATE, violation issuance, or tow RELEASE with no OPEN BillingCycle for the program" }
  - { id: ERR_REINSTATE_BLOCKED, http: 409, condition: "REINSTATE precondition for the recorded suspension_reason not met (unpaid count still >= threshold, lot still unbookable, or standing still BILLING_HOLD)" }
  - { id: ERR_VIOLATION_PERMIT_MISMATCH, http: 409, condition: "TowEvent.violation_id references a violation of a different permit" }
  - { id: ERR_NOTICE_TARGET_MISMATCH, http: 422, condition: "Notice target fields incoherent with notice_type (lot vs route, missing new_headway_minutes for HEADWAY_CHANGE)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ParkingAdmin
    description: "Airport parking program administrator: programs, lots, peak windows, notices, posture, run-ops, permit administration, renewal decisions, employee registration/termination"
    identity: opaque
    exclusive_operations:
      - "POST /parking/programs; POST /parking/programs/{id}/posture; POST /parking/programs/{id}/run-ops"
      - "POST /parking/employees; POST /parking/employees/{id}/terminate"
      - "POST /parking/lots; PATCH /parking/lots/{id}"
      - "POST /parking/peak-windows; POST /parking/peak-windows/{id}/cancel"
      - "POST /parking/notices; POST /parking/notices/{id}/events"
      - "POST /parking/renewals/{id}/decide"
      - "POST /_clock/set_current_utc"
      - "Permit events SUSPEND / REINSTATE / REVOKE"
    shared_operations:
      - "POST /parking/permits; POST /parking/permits/{id}/events (ACCEPT/DECLINE/CANCEL); POST /parking/permits/{id}/renewals"
      - "GET reads; GET /parking/programs/{id}/cost-report"
  - name: Employee
    description: "Badge-holding airport employee acting on their own permits, renewals, and violation appeals"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "Violation event APPEAL (own permit's violation)"
    shared_operations:
      - "POST /parking/permits; POST /parking/permits/{id}/events (ACCEPT/DECLINE/CANCEL, own permit only); POST /parking/permits/{id}/renewals (own permit)"
      - "GET reads"
  - name: PayrollAdmin
    description: "Payroll deduction operator: billing cycles, manual adjustments, settlement outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /parking/billing-cycles; POST /parking/billing-cycles/{id}/close; POST /parking/billing-cycles/{id}/events"
      - "POST /parking/charge-entries; POST /parking/charge-entries/{id}/settle"
    shared_operations:
      - "GET reads; GET /parking/programs/{id}/cost-report"
  - name: EnforcementOfficer
    description: "Parking enforcement officer: issues violations, authorizes and processes tows; may never adjudicate appeals"
    identity: opaque
    exclusive_operations:
      - "POST /parking/violations"
      - "POST /parking/tow-events; POST /parking/tow-events/{id}/events"
    shared_operations:
      - "GET reads"
  - name: AppealsOfficer
    description: "Independent adjudicator for violation appeals; segregation of duties vs the issuing officer"
    identity: opaque
    exclusive_operations:
      - "Violation event DECIDE_APPEAL"
    shared_operations:
      - "GET reads"
  - name: ShuttleDispatcher
    description: "Shuttle operations dispatcher: routes, trips, departures, completions"
    identity: opaque
    exclusive_operations:
      - "POST /parking/routes; POST /parking/routes/{id}/events"
      - "POST /parking/trips; POST /parking/trips/{id}/events"
    shared_operations:
      - "GET reads (incl. GET /parking/routes/{id}/service-level)"
