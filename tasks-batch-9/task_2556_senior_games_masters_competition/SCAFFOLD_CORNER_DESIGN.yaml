          setup:
            - "Standard fixture. Edition in REGISTRATION_OPEN with one 60-64 event; three athletes born 1966-03-02 registered and deliberately left unpaid in PENDING_PAYMENT. The logical clock stays at its 2026-08-01T00:00:00Z default, well before the 2026-08-25T23:59:59Z deadline, so no expiry and no status advance can fire."
