            - "ReproductionOrder.${o}.status == QUOTED (unchanged) and invoiced_fee_cents == null"

      - name: fragile_safety_beats_ownership_referential
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_ITEM_TOO_FRAGILE]
          - errors[ERR_REQUEST_OWNERSHIP_MISMATCH]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential (different pair
          from the state/fiscal instance): booking against ANOTHER researcher's
          APPROVED request whose item is FRAGILE violates both the conservation
          safety gate (priority 7) and the ownership gate (priority 10); the
          pinned ordering returns ERR_ITEM_TOO_FRAGILE.
        test_recipe:
          setup:
            - "Item I AVAILABLE with condition_grade FRAGILE; researcher A owns APPROVED request RQ_A over [I]; researcher B is a different ACTIVE researcher"
          setup_api_calls:
