            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /stations/${st_hkg}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01", captures: { st_v1: $.data.version } }
            - { call: "POST /kennel-allocations", payload: { station_id: "${st_hkg}", animal_record_id: "${an1}", bay_count: 2, occupancy_start_utc: "2026-08-05T06:00:00Z", occupancy_end_utc: "2026-08-05T09:00:00Z", feeding_interval_minutes: 240, expected_station_version: "${st_v1}" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { ka1: $.data.id } }
            - { call: "GET /stations/${st_hkg}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01", captures: { st_v2: $.data.version } }
            - { call: "POST /kennel-allocations", payload: { station_id: "${st_hkg}", animal_record_id: "${an1}", bay_count: 2, occupancy_start_utc: "2026-08-05T09:44:00Z", occupancy_end_utc: "2026-08-05T12:00:00Z", feeding_interval_minutes: 240, expected_station_version: "${st_v2}" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { ka2: $.data.id } }
            - { call: "GET /stations/${st_hkg}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01", captures: { st_v3: $.data.version } }
          trigger:
            - { call: "POST /kennel-allocations", payload: { station_id: "${st_hkg}", animal_record_id: "${an1}", bay_count: 1, occupancy_start_utc: "2026-08-05T09:44:00Z", occupancy_end_utc: "2026-08-05T10:30:00Z", feeding_interval_minutes: 240, expected_station_version: "${st_v3}" }, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 409 with error_id ERR_KENNEL_CAPACITY_EXCEEDED"
            - "Station.${st_hkg}.reserved_bay_count == 4"
            - "KennelAllocation.${ka1}.status == RESERVED and KennelAllocation.${ka2}.status == RESERVED"
            - "exactly two KennelAllocation rows exist at Station.${st_hkg}"
            - "the accepted A2 in setup proves the aggregate comparison is <= kennel_bay_count, since its projection was exactly 4"

  - rule_id: compensating_invariant
    instances:
      - name: leg_routing_counter_returns_to_baseline_after_release
        grounds:
          - entities.FlightLeg.fields.booked_checked_count
          - state_machines.SegmentAssignment.RESERVED_to_RELEASED
          - calculations.leg_posture_derivation
          - calculations.reservation_charge_assembly
        distinguishing_aspect: |
          The compensated accumulator is the LEG-SIDE capacity counter: after a release, booked_checked_count
          returns to 0 and posture returns to OPEN, with the invariant that each booked_<routing>_count always
          equals the number of that leg's segments in status RESERVED or ACCEPTED.
        test_recipe:
          setup:
            - "CHECKED itinerary confirmed on AN101 with one RESERVED segment priced 33180, booked_checked_count 1, posture OPEN, subtotal 33180, refunded 0, net 33180"
