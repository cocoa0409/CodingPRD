# Termite Bond & Wood-Destroying-Organism Inspection — Seed Tables (§1.0–§1.7)
# Companion files: SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8), SCAFFOLD_CORNER_DESIGN.yaml (§1.9)

scenario: >-
  Termite Bond & Wood-Destroying-Organism Inspection (Terminix): initial graphed inspection &
  conducive-condition notation, treatment method selection (liquid barrier, bait station,
  fumigation) by construction type, bond issuance with repair vs retreat-only coverage tiers,
  annual renewal inspection and lapse reinstatement rules, real-estate transaction WDO report
  turnaround and state form compliance, bait station service interval & activity escalation,
  damage claim adjudication against pre-existing damage exclusions, applicator license and
  state pesticide record retention.

domain_name: termite-bond-wdo-inspection
api_prefix: ""   # flat topology: every collection is a top-level path (/properties, /bonds, …)

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection at the URL root; parentage is expressed only through
  # FK body fields. No entity nests its identity inside another entity's path.

  state_machine_shape: cyclic
  # Bond: ACTIVE -> LAPSED -> ACTIVE (reinstatement loop, repeatable).
  # WdoReport: ISSUED -> AMENDED -> ISSUED (amendment/re-issue loop).
  # Inspector: ACTIVE -> SUSPENDED -> ACTIVE and ACTIVE -> EXPIRED -> ACTIVE (licence loop).
  # DamageClaim: branching fork from UNDER_ADJUDICATION into three divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Property -> Inspection, TreatmentPlan -> BaitStation, Bond -> DamageClaim
    - self_referential     # Inspection.supersedes_inspection_id -> Inspection.id
    - cross_aggregate      # DamageClaim.verifying_inspection_id crosses the Bond aggregate boundary

  role_model: segregation_of_duties
  # Two enforced separations: (1) the ClaimsAdjudicator's X-User-ID must differ from the
  # Bond.issued_by_user_id that underwrote the bond; (2) the Inspector who signed the
  # verifying inspection must differ from the TreatmentPlan.applicator_id that treated
  # the structure being claimed.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: address_line1
        type: string
        source: input
        description: street address of the inspected structure
        constraints: 1..120 chars, non-blank
      - name: state_code
        type: enum
        source: input
        description: US state whose pesticide/WDO regulations govern this structure
        constraints: one of {AL, FL, GA, TX, CA}
      - name: construction_type
        type: enum
        source: input
        description: substructure type; gates which treatment methods are permitted
        constraints: one of {SLAB, CRAWLSPACE, BASEMENT, PIER_AND_BEAM}
      - name: square_footage
        type: integer
        source: input
        description: heated square footage; tiered input to the treatment quote
        constraints: 200..12000
      - name: linear_footage
        type: integer
        source: input
        description: perimeter linear feet; drives trench gallons and bait station count
        constraints: 20..2000
      - name: crawl_clearance_inches
        type: integer
        source: input
        description: vertical clearance under the structure; null when construction_type is SLAB
        default: null
        constraints: null or 0..60
      - name: year_built
        type: integer
        source: input
        description: year of construction
        constraints: 1850..2026
      - name: has_attached_structures
        type: boolean
        source: input
        description: whether attached garages/porches extend the treated perimeter
        default: false
      - name: total_conducive_condition_count
        type: integer
        source: computed
        description: >-
          count of distinct conducive_code values (excluding NONE) on CONDUCIVE_CONDITION
          findings of this property's latest GRAPHED Inspection (see calculations.conducive_condition_ledger)
        default: 0
      - name: waived_conducive_condition_count
        type: integer
        source: computed
        description: >-
          count of those distinct conducive_code values that also appear in the
          conducive_waiver_codes of this property's Bond whose status IN {ACTIVE, LAPSED}
        default: 0
      - name: open_conducive_condition_count
        type: integer
        source: computed
        description: total_conducive_condition_count minus waived_conducive_condition_count
        default: 0
      - name: active_infestation_on_record
        type: boolean
        source: computed
        description: >-
          true when the latest GRAPHED Inspection of this property carries at least one
          finding with finding_type == ACTIVE_INFESTATION
        default: false

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: licensed individual's name as printed on state forms
        constraints: 1..80 chars, non-blank
      - name: license_number
        type: string
        source: input
        description: state pesticide applicator/inspector licence number
        constraints: "pattern ^[A-Z]{2}-[0-9]{5}$; unique per license_state"
      - name: license_state
        type: enum
        source: input
        description: state that issued the licence
        constraints: one of {AL, FL, GA, TX, CA}
      - name: license_categories
        type: array
        source: input
        description: >-
          licence categories held; array of enum values from
          {WDO_INSPECTOR, TERMITE_APPLICATOR, FUMIGATION_CERTIFIED}
        constraints: 1..3 distinct members
      - name: license_expires_on
        type: string
        source: input
        description: licence expiry date, YYYY-MM-DD (calendar date, no time component)
        constraints: valid ISO date
      - name: fumigation_endorsement
        type: boolean
        source: input
        description: whether the licence carries the structural fumigation endorsement
        default: false
      - name: ce_credits
        type: integer
        source: input
        description: continuing-education credits on file; reinstating an EXPIRED licence needs >= 8
        default: 0
        constraints: 0..99
      - name: status
        type: enum
        source: system
        description: licence lifecycle state
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, EXPIRED}

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the structure being graphed
      - name: inspector_id
        type: string
        source: input
        description: >-
          FK -> Inspector.id; the licensed inspector who owns this graph. Must equal X-User-ID
          when the caller acts as FieldInspector.
      - name: supersedes_inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the prior inspection this one replaces. Null for purpose INITIAL;
          required for purpose IN {RENEWAL, REINSTATEMENT}.
        default: null
      - name: purpose
        type: enum
        source: input
        description: why the graph was produced; gates which downstream workflow may consume it
        constraints: one of {INITIAL, RENEWAL, REAL_ESTATE, REINSTATEMENT}
      - name: status
        type: enum
        source: system
        description: graph lifecycle state
        default: DRAFT
        constraints: one of {DRAFT, GRAPHED, SUPERSEDED}
      - name: scheduled_start_at
        type: datetime
        source: input
        description: inclusive start of the inspector's on-site occupation, ISO 8601 UTC
      - name: scheduled_end_at
        type: datetime
        source: input
        description: exclusive end of the inspector's on-site occupation, ISO 8601 UTC
        constraints: must be strictly after scheduled_start_at
      - name: closing_date
        type: string
        source: input
        description: >-
          real-estate closing date, YYYY-MM-DD; required when purpose == REAL_ESTATE,
          must be null otherwise
        default: null
      - name: sequence_no
        type: integer
        source: system
        description: >-
          1-based counter stamped at creation, monotonically increasing within property_id.
          Supplies a total, non-random tie-break for latest-graph selection when two
          inspections share the same graph_completed_at.
      - name: graph_completed_at
        type: datetime
        source: computed
        description: logical-clock instant at which DRAFT -> GRAPHED fired; null while DRAFT
        default: null
      - name: no_findings_attested
        type: boolean
        source: system
        description: >-
          set from the graph-complete request body; permits a zero-finding graph to be
          completed without ERR_GRAPH_INCOMPLETE
        default: false
      - name: findings_count
        type: integer
        source: computed
        description: number of GraphFinding rows whose inspection_id is this inspection
        default: 0
      - name: conducive_condition_count
        type: integer
        source: computed
        description: >-
          number of GraphFinding rows on this inspection with finding_type == CONDUCIVE_CONDITION
          (counted per row, not per distinct code); basis of the renewal conducive surcharge
        default: 0
      - name: active_infestation_found
        type: boolean
        source: computed
        description: true when >= 1 GraphFinding row on this inspection has finding_type == ACTIVE_INFESTATION
        default: false
      - name: damage_estimate_total_usd
        type: number
        source: computed
        description: sum of damage_estimate_usd over this inspection's finding_type == DAMAGE rows
        default: 0.00

  - name: GraphFinding
    parent: null
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; the graph this notation belongs to
      - name: finding_type
        type: enum
        source: input
        description: category of the graphed notation
        constraints: one of {ACTIVE_INFESTATION, PREVIOUS_TREATMENT_EVIDENCE, DAMAGE, CONDUCIVE_CONDITION}
      - name: organism
        type: enum
        source: input
        description: wood-destroying organism identified at this grid cell
        default: NONE
        constraints: >-
          one of {SUBTERRANEAN_TERMITE, DRYWOOD_TERMITE, WOOD_BORING_BEETLE, FUNGUS,
          CARPENTER_ANT, NONE}; must not be NONE when finding_type == ACTIVE_INFESTATION
      - name: grid_ref
        type: string
        source: input
        description: cell on the inspection graph (column letter A..J, row 1..10)
        constraints: "pattern ^[A-J](10|[1-9])$"
      - name: severity
        type: integer
        source: input
        description: severity weight used by the AGGREGATE_PRORATION exclusion basis
        default: 1
        constraints: 1..5
      - name: conducive_code
        type: enum
        source: input
        description: conducive condition noted at this cell
        default: NONE
        constraints: >-
          one of {WOOD_TO_GROUND, EXCESS_MOISTURE, DEBRIS_UNDER_STRUCTURE,
          INSUFFICIENT_CLEARANCE, FAULTY_GRADE, NONE}; must not be NONE when
          finding_type == CONDUCIVE_CONDITION, must be NONE otherwise
      - name: damage_estimate_usd
        type: number
        source: input
        description: repair estimate for this cell in USD
        default: 0.00
        constraints: >-
          0.00..250000.00, 2 decimal places; must be > 0.00 when finding_type == DAMAGE,
          must be 0.00 otherwise
      - name: pre_existing
        type: boolean
        source: input
        description: >-
          true when the damage/infestation at this cell predates bond coverage; drives the
          claim exclusion arithmetic
        default: false

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the structure to be treated
      - name: inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the graph that justifies this plan. Must belong to property_id
          and must be in status GRAPHED before the plan may be APPROVED.
      - name: applicator_id
        type: string
        source: input
        description: >-
          FK -> Inspector.id; the licensed applicator who will apply chemical. Must equal
          X-User-ID when the caller acts as Applicator on this plan's applications.
      - name: method
        type: enum
        source: input
        description: >-
          treatment method; must be a member of METHOD_BY_CONSTRUCTION[Property.construction_type]
          as pinned by §1.4 priority 103
        constraints: one of {LIQUID_BARRIER, BAIT_STATION, FUMIGATION}
      - name: chemical_product_code
        type: enum
        source: input
        description: >-
          product selected; must be a member of PRODUCT_BY_METHOD[method] as pinned by §1.4
          priority 109
        constraints: one of {FIPRO_9, IMID_4, HEXA_BAIT_2, SULFURYL_F}
      - name: fumigation_permit_number
        type: string
        source: input
        description: state fumigation permit; required when method == FUMIGATION, must be null otherwise
        default: null
        constraints: "pattern ^FUM-[0-9]{6}$ when present"
      - name: fumigation_start_at
        type: datetime
        source: input
        description: >-
          inclusive start of the tenting occupation of the property; required when
          method == FUMIGATION, must be null otherwise
        default: null
      - name: fumigation_reentry_at
        type: datetime
        source: input
        description: >-
          inclusive end of the tenting occupation (clearance/re-entry instant); required when
          method == FUMIGATION, must be null otherwise; must be strictly after fumigation_start_at
        default: null
      - name: status
        type: enum
        source: system
        description: plan lifecycle state
        default: PROPOSED
        constraints: one of {PROPOSED, APPROVED, COMPLETED, ABANDONED}
      - name: target_gallons
        type: number
        source: computed
        description: >-
          termiticide volume the plan must deliver before it may be COMPLETED; 0.00 for methods
          other than LIQUID_BARRIER (see calculations.treatment_sizing_and_quote)
        default: 0.00
      - name: target_station_count
        type: integer
        source: computed
        description: >-
          number of BaitStation rows to install at completion; 0 for methods other than
          BAIT_STATION (see calculations.treatment_sizing_and_quote)
        default: 0
      - name: quoted_price_usd
        type: number
        source: computed
        description: tiered treatment price in USD (see calculations.treatment_sizing_and_quote)
      - name: gallons_applied_total
        type: number
        source: computed
        description: sum of gallons_applied over this plan's PesticideRecord rows
        default: 0.00
      - name: escalated_station_count
        type: integer
        source: computed
        description: number of this plan's BaitStation rows currently in status ESCALATED
        default: 0
      - name: retreat_required
        type: boolean
        source: computed
        description: >-
          set true by the bait-station escalation cascade when escalated_station_count reaches
          the plan's escalation threshold (see calculations.station_interval_and_escalation)
        default: false
      - name: completed_at
        type: datetime
        source: computed
        description: logical-clock instant at which APPROVED -> COMPLETED fired
        default: null

  - name: PesticideRecord
    parent: null
    common_fields: false
    fields:
      - name: treatment_plan_id
        type: string
        source: input
        description: FK -> TreatmentPlan.id; the plan this application discharges
      - name: applicator_license_number
        type: string
        source: system
        description: >-
          snapshot of the acting Applicator's Inspector.license_number at application time;
          retained independently of the Inspector row so the state record survives licence churn
      - name: applicator_license_state
        type: enum
        source: system
        description: snapshot of the acting Applicator's Inspector.license_state
        constraints: one of {AL, FL, GA, TX, CA}
      - name: state_code
        type: enum
        source: system
        description: snapshot of the treated Property.state_code; selects the retention period
        constraints: one of {AL, FL, GA, TX, CA}
      - name: product_epa_number
        type: string
        source: input
        description: EPA registration number printed on the label; must match the plan's chemical_product_code
        constraints: "pattern ^[0-9]{3,5}-[0-9]{2,4}$"
      - name: gallons_applied
        type: number
        source: input
        description: gallons of finished dilution discharged in this application
        constraints: 0.10..2000.00, 2 decimal places
      - name: concentration_pct
        type: number
        source: input
        description: finished-dilution concentration as a percentage
        constraints: 0.01..5.00, 2 decimal places
      - name: applied_at
        type: datetime
        source: system
        description: logical-clock instant at which the application was recorded
      - name: retention_until
        type: string
        source: computed
        description: >-
          last date the state requires this record to be retained, YYYY-MM-DD
          (see calculations.pesticide_record_retention)

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the bonded structure
      - name: treatment_plan_id
        type: string
        source: input
        description: >-
          FK -> TreatmentPlan.id; the completed treatment the bond is written against.
          Must belong to property_id and be in status COMPLETED at issuance.
      - name: coverage_tier
        type: enum
        source: input
        description: >-
          RETREAT_ONLY covers re-treatment labour only (repair liability cap 0.00);
          REPAIR_AND_RETREAT adds a monetary repair cap
        constraints: one of {RETREAT_ONLY, REPAIR_AND_RETREAT}
      - name: conducive_waiver_codes
        type: array
        source: input
        description: >-
          conducive_code values the homeowner formally waives at issuance; array of enum values
          from the GraphFinding.conducive_code domain excluding NONE
        default: []
      - name: issued_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the BranchManager who issued the bond; the segregation-of-duties gate
          compares this against the adjudicating ClaimsAdjudicator's X-User-ID
      - name: status
        type: enum
        source: system
        description: bond lifecycle state
        default: ACTIVE
        constraints: one of {ACTIVE, LAPSED, TERMINATED}
      - name: issued_on
        type: string
        source: computed
        description: logical-clock UTC date at issuance, YYYY-MM-DD
      - name: current_term_start
        type: string
        source: computed
        description: inclusive first date of the current coverage term, YYYY-MM-DD
      - name: current_term_end
        type: string
        source: computed
        description: >-
          inclusive last date of the current coverage term, YYYY-MM-DD
          (see calculations.bond_term_and_lapse_windows)
      - name: renewal_window_opens_on
        type: string
        source: computed
        description: current_term_end minus RENEWAL_WINDOW_DAYS, YYYY-MM-DD
      - name: term_index
        type: integer
        source: computed
        description: 1 for the issuance term, incremented on every PAID renewal
        default: 1
      - name: lapse_date
        type: string
        source: computed
        description: >-
          the grace deadline that was missed (current_term_end + GRACE_DAYS), YYYY-MM-DD;
          set when the bond enters LAPSED, never the wall-clock date of the review call
        default: null
      - name: reinstatement_count
        type: integer
        source: computed
        description: number of LAPSED -> ACTIVE reinstatements this bond has undergone
        default: 0
      - name: base_premium_usd
        type: number
        source: computed
        description: >-
          premium before cap loading; first step of calculations.bond_premium_and_cap and the
          ONLY input to repair_liability_cap_usd
      - name: repair_liability_cap_usd
        type: number
        source: computed
        description: lifetime repair liability ceiling in USD; 0.00 for RETREAT_ONLY
      - name: annual_premium_usd
        type: number
        source: computed
        description: base_premium_usd plus cap loading; billing basis for renewal and reinstatement
      - name: claims_paid_to_date_usd
        type: number
        source: computed
        description: sum of approved_payout_usd over this bond's DamageClaim rows in status APPROVED_REPAIR
        default: 0.00
      - name: reserved_claim_amount_usd
        type: number
        source: computed
        description: >-
          sum of projected_payout_usd over this bond's DamageClaim rows in status UNDER_ADJUDICATION
        default: 0.00
      - name: remaining_repair_cap_usd
        type: number
        source: computed
        description: >-
          repair_liability_cap_usd - claims_paid_to_date_usd - reserved_claim_amount_usd;
          the conserved quantity of the repair-liability invariant
      - name: retreat_credit_count
        type: integer
        source: computed
        description: number of claims resolved as APPROVED_RETREAT_ONLY on this bond
        default: 0
      - name: retreat_required
        type: boolean
        source: computed
        description: true once a retreat obligation has been raised by a claim or a station escalation
        default: false
      - name: coverage_watch
        type: boolean
        source: computed
        description: >-
          true once the bait-station escalation cascade has reached this bond; flags the bond for
          mandatory review at the next renewal
        default: false

  - name: BondRenewal
    parent: null
    common_fields: true
    fields:
      - name: bond_id
        type: string
        source: input
        description: FK -> Bond.id; the bond whose term this invoice renews
      - name: inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the RENEWAL-purpose graph attached at completion. Null while
          the renewal is PENDING.
        default: null
      - name: term_index
        type: integer
        source: computed
        description: the bond term_index this renewal closes out (snapshot at creation)
      - name: status
        type: enum
        source: system
        description: renewal lifecycle state
        default: PENDING
        constraints: one of {PENDING, PAID, VOID}
      - name: due_on
        type: string
        source: computed
        description: snapshot of Bond.current_term_end at creation, YYYY-MM-DD
      - name: base_renewal_fee_usd
        type: number
        source: computed
        description: rounded premium-derived component (computed at creation)
      - name: inspection_fee_usd
        type: number
        source: computed
        description: rounded square-footage component (computed at creation)
      - name: conducive_surcharge_usd
        type: number
        source: computed
        description: >-
          rounded conducive component; 0.00 while PENDING, recomputed from the attached
          renewal inspection at completion
        default: 0.00
      - name: late_fee_usd
        type: number
        source: computed
        description: >-
          rounded past-due component; 0.00 while PENDING, recomputed from the logical clock
          at completion
        default: 0.00
      - name: invoice_total_usd
        type: number
        source: computed
        description: >-
          sum of the four independently rounded components
          (see calculations.renewal_invoice_total, variants PROVISIONAL_AT_CREATION / FINAL_AT_COMPLETION)
      - name: paid_at
        type: datetime
        source: computed
        description: logical-clock instant of the PENDING -> PAID transition
        default: null
      - name: amount_paid_usd
        type: number
        source: computed
        description: amount tendered at completion
        default: null

  - name: WdoReport
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the REAL_ESTATE-purpose graph this statutory report transcribes
      - name: state_code
        type: enum
        source: system
        description: snapshot of the inspected Property.state_code; selects the mandatory form and SLA
        constraints: one of {AL, FL, GA, TX, CA}
      - name: form_code
        type: enum
        source: input
        description: statutory form used; must equal STATE_FORM_MAP[state_code]
        constraints: one of {NPMA_33, FL_DACS_13645, GA_100, TX_SPCS_TWDIR, CA_NPCA_1}
      - name: status
        type: enum
        source: system
        description: report lifecycle state
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, AMENDED, VOID}
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant at which the report was requested (row created)
      - name: due_at
        type: datetime
        source: computed
        description: requested_at plus STATE_TURNAROUND_HOURS[state_code]
      - name: issued_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent transition into ISSUED
        default: null
      - name: turnaround_hours
        type: integer
        source: computed
        description: >-
          whole hours from requested_at to the FIRST issuance, ceiling-rounded
          (see calculations.wdo_turnaround_and_form_compliance)
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: true when turnaround_hours strictly exceeds STATE_TURNAROUND_HOURS[state_code]
        default: false
      - name: amendment_count
        type: integer
        source: computed
        description: number of ISSUED -> AMENDED transitions this report has undergone
        default: 0
      - name: closing_date
        type: string
        source: system
        description: snapshot of Inspection.closing_date at creation, YYYY-MM-DD
      - name: amendment_reason_code
        type: enum
        source: input
        description: reason recorded on the most recent amendment
        default: null
        constraints: >-
          null, or one of {SECONDARY_EVIDENCE_ADDED, INACCESSIBLE_AREA_CLARIFIED,
          DAMAGE_SCOPE_REVISED, CLERICAL_CORRECTION}

  - name: BaitStation
    parent: null
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: input
        description: FK -> TreatmentPlan.id; the BAIT_STATION plan that installed this station
      - name: station_index
        type: integer
        source: system
        description: 1-based installation ordinal within the plan
        constraints: 1..target_station_count
      - name: grid_ref
        type: string
        source: system
        description: >-
          placement cell derived from station_index: column letter = chr(65 + ((index-1) // 10)),
          row = ((index-1) % 10) + 1
      - name: status
        type: enum
        source: system
        description: station lifecycle state; also selects the service interval
        default: INSTALLED
        constraints: one of {INSTALLED, ACTIVE_HIT, ESCALATED, REMOVED}
      - name: consecutive_activity_count
        type: integer
        source: computed
        description: >-
          run length of consecutive MODERATE/HEAVY services; reset to 0 by a NONE service,
          left unchanged by a LIGHT service
        default: 0
      - name: last_serviced_at
        type: datetime
        source: computed
        description: >-
          logical-clock instant of the most recent StationService; initialised to the plan's
          completed_at at installation
      - name: next_due_at
        type: datetime
        source: computed
        description: last_serviced_at plus STATION_INTERVAL_DAYS[status]
      - name: service_count
        type: integer
        source: computed
        description: number of StationService rows recorded against this station
        default: 0
      - name: matrix_replacement_count
        type: integer
        source: computed
        description: number of services on this station with matrix_replaced == true
        default: 0

  - name: StationService
    parent: null
    common_fields: false
    fields:
      - name: bait_station_id
        type: string
        source: input
        description: FK -> BaitStation.id; the station serviced
      - name: serviced_by_license_number
        type: string
        source: system
        description: >-
          snapshot of the acting FieldInspector's Inspector.license_number; the service record
          is retained independently of the Inspector row
      - name: serviced_at
        type: datetime
        source: system
        description: logical-clock instant of the service visit
      - name: activity_level
        type: enum
        source: input
        description: termite activity observed in the station matrix
        constraints: one of {NONE, LIGHT, MODERATE, HEAVY}
      - name: matrix_replaced
        type: boolean
        source: input
        description: whether the bait matrix was replaced during this visit
        default: false
      - name: days_since_last_service
        type: integer
        source: computed
        description: >-
          whole UTC days from the station's last_serviced_at (before this visit) to serviced_at,
          floor-rounded
      - name: interval_compliance
        type: enum
        source: computed
        description: >-
          ON_TIME / LATE / MISSED, graded against STATION_INTERVAL_DAYS of the station's status
          BEFORE this visit (see calculations.station_interval_and_escalation)
        constraints: one of {ON_TIME, LATE, MISSED}

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: bond_id
        type: string
        source: input
        description: FK -> Bond.id; the bond the claim is made under
      - name: verifying_inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the graph produced to verify the claimed damage. Null while
          the claim is SUBMITTED.
        default: null
      - name: claim_type
        type: enum
        source: input
        description: REPAIR seeks monetary repair; RETREAT seeks re-treatment labour only
        constraints: one of {REPAIR, RETREAT}
      - name: claimed_damage_usd
        type: number
        source: input
        description: homeowner's claimed repair amount in USD
        constraints: 0.01..250000.00, 2 decimal places
      - name: reported_at
        type: datetime
        source: system
        description: logical-clock instant at which the claim was filed
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: SUBMITTED
        constraints: >-
          one of {SUBMITTED, UNDER_ADJUDICATION, APPROVED_REPAIR, APPROVED_RETREAT_ONLY,
          DENIED, WITHDRAWN}
      - name: exclusion_basis
        type: enum
        source: computed
        description: >-
          which pre-existing-damage exclusion algorithm was applied; selected at verification
          (see calculations.claim_exclusion_and_eligibility)
        default: null
        constraints: null, or one of {FINDING_LEVEL, AGGREGATE_PRORATION}
      - name: excluded_pre_existing_usd
        type: number
        source: computed
        description: portion of claimed_damage_usd removed by the pre-existing exclusion
        default: 0.00
      - name: eligible_damage_usd
        type: number
        source: computed
        description: claimed damage surviving the exclusion, before deductible and cap
        default: 0.00
      - name: deductible_usd
        type: number
        source: computed
        description: tiered deductible keyed on eligible_damage_usd
        default: 0.00
      - name: projected_payout_usd
        type: number
        source: computed
        description: >-
          amount reserved against the bond while UNDER_ADJUDICATION
          (see calculations.claim_payout_waterfall)
        default: 0.00
      - name: approved_payout_usd
        type: number
        source: computed
        description: amount actually charged to the bond; 0.00 unless status == APPROVED_REPAIR
        default: 0.00
      - name: denial_reason_code
        type: enum
        source: input
        description: reason recorded when the claim is denied
        default: null
        constraints: >-
          null, or one of {PRE_EXISTING_DAMAGE, NO_ELIGIBLE_DAMAGE, BOND_LAPSED, OUTSIDE_COVERAGE}
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjudicator who resolved the claim
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Inspector
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /inspectors/{id}/license-status with status=SUSPENDED"
        actor: ComplianceOfficer
        preconditions:
          - "Inspector.status == ACTIVE"
        side_effects:
          - "Inspector.status = SUSPENDED"
          - "increments Inspector.version by 1"
        note: >-
          A SUSPENDED inspector can neither complete a graph nor record a pesticide application;
          rows already written are untouched.
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /inspectors/{id}/license-status with status=ACTIVE"
        actor: ComplianceOfficer
        preconditions:
          - "Inspector.status == SUSPENDED"
          - "Inspector.license_expires_on >= logical clock UTC date"
        side_effects:
          - "Inspector.status = ACTIVE"
          - "increments Inspector.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /inspectors/{id}/license-status with status=EXPIRED"
        actor: ComplianceOfficer
        preconditions:
          - "Inspector.status == ACTIVE"
        side_effects:
          - "Inspector.status = EXPIRED"
          - "increments Inspector.version by 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /inspectors/{id}/license-status with status=ACTIVE and license_expires_on set"
        actor: ComplianceOfficer
        preconditions:
          - "Inspector.status == EXPIRED"
          - "request body carries license_expires_on strictly after the logical clock UTC date"
          - "the effective credit count (request ce_credits when supplied, else Inspector.ce_credits) >= CE_CREDITS_REQUIRED (8)"
        side_effects:
          - "Inspector.license_expires_on = request license_expires_on"
          - "Inspector.ce_credits = request ce_credits when supplied, otherwise unchanged"
          - "Inspector.status = ACTIVE"
          - "increments Inspector.version by 1"

  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: GRAPHED
        trigger: "POST /inspections/{id}/graph-complete"
        actor: FieldInspector
        preconditions:
          - "Inspection.status == DRAFT"
          - "Inspection.inspector_id == X-User-ID"
          - "Inspector(inspector_id).status == ACTIVE"
          - "Inspector(inspector_id).license_expires_on >= logical clock UTC date"
          - "WDO_INSPECTOR is a member of Inspector(inspector_id).license_categories"
          - "Inspection.findings_count >= 1 OR request no_findings_attested == true"
        side_effects:
          - "Inspection.graph_completed_at = logical clock instant"
          - "Inspection.no_findings_attested = request no_findings_attested (default false)"
          - "recomputes Inspection.findings_count, conducive_condition_count, active_infestation_found, damage_estimate_total_usd"
          - "recomputes Property.total_conducive_condition_count / waived_conducive_condition_count / open_conducive_condition_count / active_infestation_on_record via calculations.conducive_condition_ledger"
          - "increments Inspection.version by 1"
      - from: GRAPHED
        to: SUPERSEDED
        trigger: "system: a later Inspection is created with supersedes_inspection_id == this id"
        actor: system
        preconditions:
          - "Inspection.status == GRAPHED"
        side_effects:
          - "Inspection.status = SUPERSEDED"
          - "cascade hop 2: every WdoReport whose inspection_id is this inspection and whose status IN {DRAFT, ISSUED, AMENDED} transitions to VOID"
          - "increments Inspection.version by 1"
        note: >-
          Transitive cascade origin (create-inspection). Hop 1 supersedes the prior graph,
          hop 2 is caused by hop 1 and voids the statutory reports transcribed from it.
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a later Inspection is created with supersedes_inspection_id == this id"
        actor: system
        preconditions:
          - "Inspection.status == DRAFT"
        side_effects:
          - "Inspection.status = SUPERSEDED"
          - "increments Inspection.version by 1"
        note: "A never-completed draft is retired the same way; it has no WdoReport rows to void."

  - entity: TreatmentPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: PROPOSED
        to: ABANDONED
        trigger: "system: a later TreatmentPlan is created for the same property_id"
        actor: system
        preconditions:
          - "TreatmentPlan.status == PROPOSED"
        side_effects:
          - "TreatmentPlan.status = ABANDONED"
          - "increments TreatmentPlan.version by 1"
        note: "A newly proposed plan supersedes every still-PROPOSED plan on the same property."
      - from: APPROVED
        to: ABANDONED
        trigger: "POST /treatment-plans/{id}/abandon"
        actor: BranchManager
        preconditions:
          - "TreatmentPlan.status == APPROVED"
          - "no PesticideRecord row of this plan has retention_until >= the logical clock UTC date"
        side_effects:
          - "TreatmentPlan.status = ABANDONED"
          - "increments TreatmentPlan.version by 1"
        note: >-
          Manual abandonment of an approved plan. Blocked by ERR_RETENTION_LOCK_ACTIVE while any
          pesticide record of the plan is still inside its state retention period, so a plan that
          has already discharged chemical can only be abandoned once every record has aged out.
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /treatment-plans/{id}/approve"
        actor: BranchManager
        preconditions:
          - "TreatmentPlan.status == PROPOSED"
          - "Inspection(inspection_id).status == GRAPHED"
          - "Inspector(applicator_id).status == ACTIVE"
          - "Inspector(applicator_id).license_expires_on >= logical clock UTC date"
        side_effects:
          - "TreatmentPlan.status = APPROVED"
          - "increments TreatmentPlan.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /treatment-plans/{id}/complete"
        actor: Applicator
        preconditions:
          - "TreatmentPlan.status == APPROVED"
          - "TreatmentPlan.applicator_id == X-User-ID"
          - "method == LIQUID_BARRIER implies gallons_applied_total >= target_gallons"
          - "method == BAIT_STATION implies at least one PesticideRecord row exists for this plan"
          - "method == FUMIGATION implies logical clock instant >= fumigation_reentry_at"
        side_effects:
          - "TreatmentPlan.status = COMPLETED"
          - "TreatmentPlan.completed_at = logical clock instant"
          - "method == BAIT_STATION: creates target_station_count BaitStation rows with station_index 1..target_station_count, status INSTALLED, last_serviced_at = completed_at, next_due_at = completed_at + 90 days"
          - "increments TreatmentPlan.version by 1"

  - entity: BaitStation
    initial_state: INSTALLED
    terminal_states: [REMOVED]
    transitions:
      - from: INSTALLED
        to: ACTIVE_HIT
        trigger: "POST /bait-stations/{id}/services with activity_level IN {MODERATE, HEAVY}"
        actor: FieldInspector
        preconditions:
          - "BaitStation.status == INSTALLED"
          - "TreatmentPlan(treatment_plan_id).status == COMPLETED"
        side_effects:
          - "creates a StationService row (immutable)"
          - "BaitStation.consecutive_activity_count += 1"
          - "BaitStation.status = ACTIVE_HIT when consecutive_activity_count < ESCALATION_RUN_LENGTH (3)"
          - "BaitStation.last_serviced_at = logical clock instant; next_due_at = last_serviced_at + STATION_INTERVAL_DAYS[ACTIVE_HIT] (30 days)"
          - "BaitStation.service_count += 1; matrix_replacement_count += 1 when matrix_replaced"
          - "increments BaitStation.version by 1"
      - from: ACTIVE_HIT
        to: ACTIVE_HIT
        trigger: "POST /bait-stations/{id}/services with activity_level IN {MODERATE, HEAVY} and resulting run length < 3"
        actor: FieldInspector
        preconditions:
          - "BaitStation.status == ACTIVE_HIT"
          - "BaitStation.consecutive_activity_count + 1 < ESCALATION_RUN_LENGTH (3)"
        side_effects:
          - "creates a StationService row (immutable)"
          - "BaitStation.consecutive_activity_count += 1"
          - "BaitStation.last_serviced_at / next_due_at / service_count / matrix_replacement_count refreshed as above"
          - "increments BaitStation.version by 1"
      - from: ACTIVE_HIT
        to: INSTALLED
        trigger: "POST /bait-stations/{id}/services with activity_level == NONE"
        actor: FieldInspector
        preconditions:
          - "BaitStation.status == ACTIVE_HIT"
        side_effects:
          - "creates a StationService row (immutable)"
          - "BaitStation.consecutive_activity_count = 0"
          - "BaitStation.status = INSTALLED; next_due_at = serviced_at + STATION_INTERVAL_DAYS[INSTALLED] (90 days)"
          - "increments BaitStation.version by 1"
        note: "Cyclic: a clean station returns to the 90-day interval. A LIGHT service leaves both status and run length unchanged."
      - from: ACTIVE_HIT
        to: ESCALATED
        trigger: "POST /bait-stations/{id}/services with activity_level IN {MODERATE, HEAVY} reaching run length 3"
        actor: FieldInspector
        preconditions:
          - "BaitStation.status == ACTIVE_HIT"
          - "BaitStation.consecutive_activity_count + 1 >= ESCALATION_RUN_LENGTH (3)"
        side_effects:
          - "creates a StationService row (immutable)"
          - "BaitStation.consecutive_activity_count += 1"
          - "BaitStation.status = ESCALATED; next_due_at = serviced_at + STATION_INTERVAL_DAYS[ESCALATED] (14 days)"
          - "cascade hop 2: TreatmentPlan(treatment_plan_id).escalated_station_count += 1, and when escalated_station_count >= ceil(target_station_count * ESCALATION_STATION_RATIO) the plan's retreat_required flips to true (TreatmentPlan.version += 1)"
          - "cascade hop 3: caused by the plan's retreat_required flip only — the Bond whose treatment_plan_id is this plan and whose status == ACTIVE sets coverage_watch = true and retreat_required = true (Bond.version += 1)"
          - "increments BaitStation.version by 1"
        note: >-
          Depth-3 transitive cascade origin (record-service). Each hop is caused by the previous
          hop, not by the original request: service -> station ESCALATED -> plan retreat_required
          -> bond coverage_watch.
      - from: INSTALLED
        to: REMOVED
        trigger: "system: the Bond covering this station's TreatmentPlan transitions to TERMINATED"
        actor: system
        preconditions:
          - "BaitStation.status IN {INSTALLED, ACTIVE_HIT, ESCALATED}"
        side_effects:
          - "BaitStation.status = REMOVED"
          - "increments BaitStation.version by 1"
      - from: ACTIVE_HIT
        to: REMOVED
        trigger: "system: the Bond covering this station's TreatmentPlan transitions to TERMINATED"
        actor: system
        preconditions:
          - "BaitStation.status IN {INSTALLED, ACTIVE_HIT, ESCALATED}"
        side_effects:
          - "BaitStation.status = REMOVED"
          - "increments BaitStation.version by 1"
      - from: ESCALATED
        to: REMOVED
        trigger: "system: the Bond covering this station's TreatmentPlan transitions to TERMINATED"
        actor: system
        preconditions:
          - "BaitStation.status IN {INSTALLED, ACTIVE_HIT, ESCALATED}"
        side_effects:
          - "BaitStation.status = REMOVED"
          - "increments BaitStation.version by 1"

  - entity: Bond
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /bond-renewals/{id}/complete (term roll-forward)"
        actor: BranchManager
        preconditions:
          - "Bond.status == ACTIVE"
          - "BondRenewal.status == PENDING and BondRenewal.bond_id == this bond"
          - "logical clock UTC date <= Bond.current_term_end + GRACE_DAYS (30)"
        side_effects:
          - "Bond.current_term_start = previous Bond.current_term_end"
          - "Bond.current_term_end = previous Bond.current_term_end + TERM_DAYS (365)"
          - "Bond.renewal_window_opens_on = new current_term_end - RENEWAL_WINDOW_DAYS (60)"
          - "Bond.term_index += 1"
          - "Bond.retreat_required = true when Inspection(BondRenewal.inspection_id).active_infestation_found is true, otherwise unchanged"
          - "increments Bond.version by 1"
        note: "Self-transition: the bond stays ACTIVE while its coverage window advances one term."
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /bonds/{id}/term-review"
        actor: ComplianceOfficer
        preconditions:
          - "Bond.status == ACTIVE"
          - "logical clock UTC date > Bond.current_term_end + GRACE_DAYS (30)"
        side_effects:
          - "Bond.status = LAPSED"
          - "Bond.lapse_date = Bond.current_term_end + GRACE_DAYS (30) — the missed grace deadline, not the review date"
          - "cascade hop 2: every BondRenewal of this bond in status PENDING transitions to VOID (BondRenewal.version += 1)"
          - "cascade hop 2: every DamageClaim of this bond in status IN {SUBMITTED, UNDER_ADJUDICATION} transitions to DENIED with denial_reason_code = BOND_LAPSED (DamageClaim.version += 1)"
          - "cascade hop 3: caused by each UNDER_ADJUDICATION -> DENIED hop only — Bond.reserved_claim_amount_usd -= that claim's projected_payout_usd and Bond.remaining_repair_cap_usd += the same amount"
          - "increments Bond.version by 1"
        note: >-
          Depth-3 transitive cascade origin (term-review). The reserve release in hop 3 is caused
          by the claim denial in hop 2, not by the review call, and preserves the repair-liability
          invariant.
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /bonds/{id}/reinstate"
        actor: BranchManager
        preconditions:
          - "Bond.status == LAPSED"
          - "logical clock UTC date <= Bond.lapse_date + REINSTATEMENT_WINDOW_DAYS (90)"
          - "Inspection(reinstatement_inspection_id).property_id == Bond.property_id"
          - "Inspection(reinstatement_inspection_id).purpose == REINSTATEMENT and status == GRAPHED"
          - "Inspection(reinstatement_inspection_id).graph_completed_at >= logical clock instant - REINSTATEMENT_INSPECTION_MAX_AGE_DAYS (30) days"
          - "Inspection(reinstatement_inspection_id).active_infestation_found == false"
          - "request amount_usd >= reinstatement_total_usd from calculations.reinstatement_settlement"
        side_effects:
          - "Bond.status = ACTIVE"
          - "Bond.reinstatement_count += 1"
          - "Bond.lapse_date = null"
          - "variant PRORATED_REMAINDER (lapse_days <= PRORATION_CUTOFF_DAYS 30): Bond.current_term_start = old lapse_date, Bond.current_term_end = old current_term_end + TERM_DAYS (365)"
          - "variant FULL_TERM_RESTART (lapse_days > 30): Bond.current_term_start = logical clock UTC date, Bond.current_term_end = logical clock UTC date + TERM_DAYS (365)"
          - "Bond.renewal_window_opens_on = new current_term_end - RENEWAL_WINDOW_DAYS (60)"
          - "Bond.term_index += 1"
          - "increments Bond.version by 1"
        note: "Closes the ACTIVE -> LAPSED -> ACTIVE cycle; repeatable, counted by reinstatement_count."
      - from: LAPSED
        to: TERMINATED
        trigger: "POST /bonds/{id}/term-review"
        actor: ComplianceOfficer
        preconditions:
          - "Bond.status == LAPSED"
          - "logical clock UTC date > Bond.lapse_date + REINSTATEMENT_WINDOW_DAYS (90)"
        side_effects:
          - "Bond.status = TERMINATED"
          - "cascade hop 2: every BaitStation of Bond.treatment_plan_id in status IN {INSTALLED, ACTIVE_HIT, ESCALATED} transitions to REMOVED (BaitStation.version += 1)"
          - "cascade hop 2: Property.waived_conducive_condition_count recomputed to 0 and open_conducive_condition_count restored to total_conducive_condition_count, because a TERMINATED bond's conducive_waiver_codes no longer suppress any condition"
          - "Bond.repair_liability_cap_usd / claims_paid_to_date_usd / reserved_claim_amount_usd / remaining_repair_cap_usd are left frozen at their pre-termination values"
          - "increments Bond.version by 1"

  - entity: BondRenewal
    initial_state: PENDING
    terminal_states: [PAID, VOID]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /bond-renewals/{id}/complete"
        actor: BranchManager
        preconditions:
          - "BondRenewal.status == PENDING"
          - "Bond(bond_id).status == ACTIVE"
          - "Inspection(request inspection_id).property_id == Bond(bond_id).property_id"
          - "Inspection(request inspection_id).purpose == RENEWAL and status == GRAPHED"
          - "request amount_usd >= invoice_total_usd recomputed by variant FINAL_AT_COMPLETION"
        side_effects:
          - "BondRenewal.inspection_id = request inspection_id"
          - "BondRenewal.conducive_surcharge_usd / late_fee_usd / invoice_total_usd recomputed under variant FINAL_AT_COMPLETION"
          - "BondRenewal.status = PAID; paid_at = logical clock instant; amount_paid_usd = request amount_usd"
          - "cascade: the parent Bond takes its ACTIVE -> ACTIVE term roll-forward"
          - "increments BondRenewal.version by 1"
      - from: PENDING
        to: VOID
        trigger: "system: the parent Bond transitions ACTIVE -> LAPSED"
        actor: system
        preconditions:
          - "BondRenewal.status == PENDING"
        side_effects:
          - "BondRenewal.status = VOID"
          - "increments BondRenewal.version by 1"

  - entity: WdoReport
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /wdo-reports/{id}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "WdoReport.status == DRAFT"
          - "Inspection(inspection_id).status == GRAPHED"
          - "Inspection(inspection_id).purpose == REAL_ESTATE"
          - "logical clock instant <= (WdoReport.closing_date at 00:00:00Z) - CLOSING_LEAD_HOURS (24)"
        side_effects:
          - "WdoReport.status = ISSUED; issued_at = logical clock instant"
          - "WdoReport.turnaround_hours = ceil hours from requested_at to issued_at"
          - "WdoReport.sla_breached = turnaround_hours > STATE_TURNAROUND_HOURS[state_code]"
          - "increments WdoReport.version by 1"
      - from: ISSUED
        to: AMENDED
        trigger: "POST /wdo-reports/{id}/amend"
        actor: ComplianceOfficer
        preconditions:
          - "WdoReport.status == ISSUED"
          - "request amendment_reason_code is present"
          - "logical clock UTC date <= (date of WdoReport.issued_at) + AMENDMENT_WINDOW_DAYS (30)"
        side_effects:
          - "WdoReport.status = AMENDED; amendment_count += 1; amendment_reason_code = request amendment_reason_code"
          - "WdoReport.turnaround_hours and sla_breached are NOT recomputed — both stay pinned to the first issuance"
          - "increments WdoReport.version by 1"
      - from: AMENDED
        to: ISSUED
        trigger: "POST /wdo-reports/{id}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "WdoReport.status == AMENDED"
          - "Inspection(inspection_id).status == GRAPHED"
          - "logical clock instant <= (WdoReport.closing_date at 00:00:00Z) - CLOSING_LEAD_HOURS (24)"
        side_effects:
          - "WdoReport.status = ISSUED; issued_at = logical clock instant"
          - "WdoReport.turnaround_hours and sla_breached remain at their first-issuance values"
          - "increments WdoReport.version by 1"
        note: "Closes the ISSUED -> AMENDED -> ISSUED cycle; amendment_count records how many loops ran."
      - from: DRAFT
        to: VOID
        trigger: "system: Inspection(inspection_id) transitions to SUPERSEDED"
        actor: system
        preconditions:
          - "WdoReport.status IN {DRAFT, ISSUED, AMENDED}"
        side_effects:
          - "WdoReport.status = VOID"
          - "increments WdoReport.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "system: Inspection(inspection_id) transitions to SUPERSEDED"
        actor: system
        preconditions:
          - "WdoReport.status IN {DRAFT, ISSUED, AMENDED}"
        side_effects:
          - "WdoReport.status = VOID"
          - "increments WdoReport.version by 1"
      - from: AMENDED
        to: VOID
        trigger: "system: Inspection(inspection_id) transitions to SUPERSEDED"
        actor: system
        preconditions:
          - "WdoReport.status IN {DRAFT, ISSUED, AMENDED}"
        side_effects:
          - "WdoReport.status = VOID"
          - "increments WdoReport.version by 1"

  - entity: DamageClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED_REPAIR, APPROVED_RETREAT_ONLY, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_ADJUDICATION
        trigger: "POST /damage-claims/{id}/attach-verification"
        actor: FieldInspector
        preconditions:
          - "DamageClaim.status == SUBMITTED"
          - "Bond(bond_id).status == ACTIVE"
          - "Inspection(request verifying_inspection_id).property_id == Bond(bond_id).property_id"
          - "Inspection(request verifying_inspection_id).status == GRAPHED"
          - "Inspection(request verifying_inspection_id).inspector_id == X-User-ID"
          - "Inspection(request verifying_inspection_id).inspector_id != TreatmentPlan(Bond.treatment_plan_id).applicator_id"
        side_effects:
          - "DamageClaim.verifying_inspection_id = request verifying_inspection_id"
          - "DamageClaim.exclusion_basis / excluded_pre_existing_usd / eligible_damage_usd / deductible_usd computed by calculations.claim_exclusion_and_eligibility"
          - "DamageClaim.projected_payout_usd computed by calculations.claim_payout_waterfall"
          - "DamageClaim.status = UNDER_ADJUDICATION"
          - "Bond.reserved_claim_amount_usd += DamageClaim.projected_payout_usd; Bond.remaining_repair_cap_usd -= the same amount (Bond.version += 1)"
          - "increments DamageClaim.version by 1"
        note: "Forward half of the repair-liability compensating pair; withdraw is the reverse half."
      - from: UNDER_ADJUDICATION
        to: APPROVED_REPAIR
        trigger: "POST /damage-claims/{id}/adjudicate with decision=APPROVE_REPAIR"
        actor: ClaimsAdjudicator
        preconditions:
          - "DamageClaim.status == UNDER_ADJUDICATION"
          - "Bond(bond_id).status == ACTIVE"
          - "X-User-ID != Bond(bond_id).issued_by_user_id"
          - "Bond(bond_id).coverage_tier == REPAIR_AND_RETREAT"
          - "DamageClaim.projected_payout_usd > 0.00"
        side_effects:
          - "DamageClaim.approved_payout_usd = DamageClaim.projected_payout_usd"
          - "DamageClaim.status = APPROVED_REPAIR; adjudicated_by_user_id = X-User-ID"
          - "Bond.claims_paid_to_date_usd += approved_payout_usd; Bond.reserved_claim_amount_usd -= projected_payout_usd; Bond.remaining_repair_cap_usd unchanged (Bond.version += 1)"
          - "increments DamageClaim.version by 1"
      - from: UNDER_ADJUDICATION
        to: APPROVED_RETREAT_ONLY
        trigger: "POST /damage-claims/{id}/adjudicate with decision=APPROVE_RETREAT_ONLY"
        actor: ClaimsAdjudicator
        preconditions:
          - "DamageClaim.status == UNDER_ADJUDICATION"
          - "Bond(bond_id).status == ACTIVE"
          - "X-User-ID != Bond(bond_id).issued_by_user_id"
        side_effects:
          - "DamageClaim.approved_payout_usd = 0.00"
          - "DamageClaim.status = APPROVED_RETREAT_ONLY; adjudicated_by_user_id = X-User-ID"
          - "Bond.reserved_claim_amount_usd -= projected_payout_usd; Bond.remaining_repair_cap_usd += the same amount; claims_paid_to_date_usd unchanged"
          - "Bond.retreat_required = true; Bond.retreat_credit_count += 1 (Bond.version += 1)"
          - "increments DamageClaim.version by 1"
        note: "Divergent branch: releases the reserve AND raises a retreat obligation; no money moves."
      - from: UNDER_ADJUDICATION
        to: DENIED
        trigger: "POST /damage-claims/{id}/adjudicate with decision=DENY"
        actor: ClaimsAdjudicator
        preconditions:
          - "DamageClaim.status == UNDER_ADJUDICATION"
          - "Bond(bond_id).status == ACTIVE"
          - "X-User-ID != Bond(bond_id).issued_by_user_id"
          - "request denial_reason_code is present"
        side_effects:
          - "DamageClaim.approved_payout_usd = 0.00; denial_reason_code = request denial_reason_code"
          - "DamageClaim.status = DENIED; adjudicated_by_user_id = X-User-ID"
          - "Bond.reserved_claim_amount_usd -= projected_payout_usd; Bond.remaining_repair_cap_usd += the same amount (Bond.version += 1)"
          - "increments DamageClaim.version by 1"
        note: "Divergent branch: releases the reserve and raises NO retreat obligation."
      - from: UNDER_ADJUDICATION
        to: WITHDRAWN
        trigger: "POST /damage-claims/{id}/withdraw"
        actor: PropertyOwner
        preconditions:
          - "DamageClaim.status == UNDER_ADJUDICATION"
          - "Bond(bond_id).property_id == X-User-ID"
        side_effects:
          - "DamageClaim.status = WITHDRAWN; approved_payout_usd = 0.00"
          - "Bond.reserved_claim_amount_usd -= projected_payout_usd; Bond.remaining_repair_cap_usd += the same amount (Bond.version += 1)"
          - "increments DamageClaim.version by 1"
        note: >-
          Compensating half of the repair-liability pair: releases exactly the amount reserved at
          verification, so repair_liability_cap_usd == claims_paid_to_date_usd +
          reserved_claim_amount_usd + remaining_repair_cap_usd still holds and
          remaining_repair_cap_usd returns to its pre-verification value.
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /damage-claims/{id}/withdraw"
        actor: PropertyOwner
        preconditions:
          - "DamageClaim.status == SUBMITTED"
          - "Bond(bond_id).property_id == X-User-ID"
        side_effects:
          - "DamageClaim.status = WITHDRAWN"
          - "no reserve movement, because nothing was reserved before verification"
          - "increments DamageClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "system: the parent Bond transitions ACTIVE -> LAPSED"
        actor: system
        preconditions:
          - "DamageClaim.status IN {SUBMITTED, UNDER_ADJUDICATION}"
        side_effects:
          - "DamageClaim.status = DENIED; denial_reason_code = BOND_LAPSED"
          - "increments DamageClaim.version by 1"
      - from: UNDER_ADJUDICATION
        to: DENIED
        trigger: "system: the parent Bond transitions ACTIVE -> LAPSED"
        actor: system
        preconditions:
          - "DamageClaim.status IN {SUBMITTED, UNDER_ADJUDICATION}"
        side_effects:
          - "DamageClaim.status = DENIED; denial_reason_code = BOND_LAPSED"
          - "cascade hop 3 on the Bond: reserved_claim_amount_usd -= projected_payout_usd and remaining_repair_cap_usd += the same amount"
          - "increments DamageClaim.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned mechanism)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: application-create-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /treatment-plans/{id}/applications"
    occ_field: "expected_treatment_plan_version"
    description: |
      Recording a pesticide application against a TreatmentPlan whose version has advanced since
      the client last read it is rejected. A plan legitimately accepts several applications, so a
      later application is not blocked by any state precondition; the stale-version check is what
      stops an applicator from adding gallons on top of a plan view that no longer reflects
      gallons_applied_total (or a status that has since moved to COMPLETED).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-create-stale-bond
    parent_entity: Bond
    write_endpoint: "POST /damage-claims"
    occ_field: "expected_bond_version"
    description: |
      Filing a DamageClaim against a Bond whose version has advanced since the client last read it
      is rejected. A bond legitimately accepts several claims, so a second filing is not blocked by
      any state precondition; the stale-version check is what stops a homeowner from filing against
      a stale view of remaining_repair_cap_usd that an earlier verification reserve or approved
      payout has already consumed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: treatment_sizing_and_quote
    trigger: "POST /treatment-plans (row creation); recomputed nowhere else — the quote is frozen at proposal"
    algorithm: tiered_pricing
    formula: |
      # --- sizing -------------------------------------------------------
      target_gallons =
        method == LIQUID_BARRIER
          ? ceil( P.linear_footage * TRENCH_GAL_PER_LF[P.construction_type]
                  + (P.construction_type == SLAB
                       ? ceil(P.square_footage / 100) * SLAB_DRILL_GAL_PER_100_SQFT
                       : 0) )
          : 0.00
      target_station_count =
        method == BAIT_STATION
          ? ceil(P.linear_footage / STATION_SPACING_FT) + (P.has_attached_structures ? 2 : 0)
          : 0
      # --- price (evaluation order is PINNED, steps run exactly once, in order) ---
      step 1  sqft_tier_subtotal = min(S, 1500) * TIER1_RATE
                                 + max(0, min(S, 3000) - 1500) * TIER2_RATE
                                 + max(0, S - 3000)            * TIER3_RATE       # S = P.square_footage
      step 2  pre_multiplier     = BASE_FEE[method] + sqft_tier_subtotal
      step 3  after_construction = pre_multiplier * CONSTRUCTION_MULTIPLIER[P.construction_type]
      step 4  after_infestation  = after_construction
                                   * (Inspection(inspection_id).active_infestation_found
                                        ? (1 + INFESTATION_SURCHARGE_RATE) : 1)
      step 5  rounded            = round_half_up(after_infestation, 2)
      step 6  quoted_price_usd   = min(rounded, METHOD_PRICE_CAP[method])
      # Rounding happens ONCE, at step 5. Steps 1-4 carry full precision.
    input_set: >-
      Exactly one Property row (the plan's property_id) and exactly one Inspection row (the plan's
      inspection_id, any status at creation time). No aggregation over other plans.
    constants:
      TIER1_RATE: 0.42          # first 1500 sq ft
      TIER2_RATE: 0.35          # sq ft 1501..3000
      TIER3_RATE: 0.28          # sq ft above 3000
      BASE_FEE: { LIQUID_BARRIER: 275.00, BAIT_STATION: 390.00, FUMIGATION: 640.00 }
      CONSTRUCTION_MULTIPLIER: { SLAB: 1.00, CRAWLSPACE: 1.15, BASEMENT: 1.25, PIER_AND_BEAM: 1.10 }
      INFESTATION_SURCHARGE_RATE: 0.12
      METHOD_PRICE_CAP: { LIQUID_BARRIER: 4200.00, BAIT_STATION: 3600.00, FUMIGATION: 9800.00 }
      TRENCH_GAL_PER_LF: { SLAB: 1.0, CRAWLSPACE: 1.5, BASEMENT: 2.0, PIER_AND_BEAM: 1.25 }
      SLAB_DRILL_GAL_PER_100_SQFT: 0.5
      STATION_SPACING_FT: 10
    precision: "quoted_price_usd 2 decimal places round_half_up; target_gallons whole gallons via ceil; target_station_count integer via ceil"

  - name: bond_premium_and_cap
    trigger: "POST /bonds (row creation); the three outputs are frozen for the life of the bond"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency: the cap is loaded into the premium, and the cap is a
      # multiple of the premium. The evaluation order below is PINNED so the values are
      # well-defined; the cap is derived from base_premium_usd and NEVER re-derived from
      # annual_premium_usd.
      step 1  base_premium_usd        = round_half_up(TreatmentPlan.quoted_price_usd * PREMIUM_RATE_OF_QUOTE, 2)
      step 2  repair_liability_cap_usd = round_half_up(base_premium_usd * CAP_MULTIPLIER[coverage_tier], 2)
      step 3  annual_premium_usd      = round_half_up(base_premium_usd
                                                      + CAP_LOADING_RATE * repair_liability_cap_usd, 2)
      step 4  claims_paid_to_date_usd = 0.00
      step 5  reserved_claim_amount_usd = 0.00
      step 6  remaining_repair_cap_usd = repair_liability_cap_usd
      # Re-deriving step 2 from annual_premium_usd is the wrong reading and produces a
      # materially larger cap; the scaffold rejects that order.
    input_set: >-
      Exactly one TreatmentPlan row (the bond's treatment_plan_id, status COMPLETED) and the
      request's coverage_tier. No other bond, claim, or renewal participates.
    constants:
      PREMIUM_RATE_OF_QUOTE: 0.18
      CAP_MULTIPLIER: { RETREAT_ONLY: 0.0, REPAIR_AND_RETREAT: 60.0 }
      CAP_LOADING_RATE: 0.004
    precision: "all three outputs 2 decimal places round_half_up; each round applied once, at its own step"

  - name: renewal_invoice_total
    trigger: >-
      POST /bonds/{id}/renewals (variant PROVISIONAL_AT_CREATION) and
      POST /bond-renewals/{id}/complete (variant FINAL_AT_COMPLETION)
    algorithm: aggregation
    formula: |
      # Nested-rounding order is PINNED: round EACH component to 2 dp, THEN sum.
      # Summing first and rounding once yields a different cent on many inputs and is wrong.
      c1 = round_half_up(Bond.annual_premium_usd * RENEWAL_RATE_OF_PREMIUM, 2)
      c2 = round_half_up(INSPECTION_BASE_FEE
                         + INSPECTION_FEE_PER_100_SQFT * (Property.square_footage / 100), 2)
      c3 = round_half_up(CONDUCIVE_SURCHARGE_PER_CONDITION * conducive_basis_count, 2)
      c4 = round_half_up(LATE_FEE_PER_DAY * past_due_days, 2)
      invoice_total_usd = c1 + c2 + c3 + c4        # exact sum of four already-rounded values
      where:
        conducive_basis_count =
          variant PROVISIONAL_AT_CREATION -> 0
          variant FINAL_AT_COMPLETION     -> Inspection(request inspection_id).conducive_condition_count
        past_due_days =
          variant PROVISIONAL_AT_CREATION -> 0
          variant FINAL_AT_COMPLETION     -> max(0, whole UTC days from Bond.current_term_end
                                                    to the logical clock UTC date)
    input_set: >-
      Exactly one Bond row (status ACTIVE), its Property row, and — for FINAL_AT_COMPLETION only —
      the single Inspection row supplied in the completion request (purpose RENEWAL, status GRAPHED).
      conducive_basis_count counts CONDUCIVE_CONDITION finding ROWS on that inspection, including
      rows whose code the bond has waived.
    constants:
      RENEWAL_RATE_OF_PREMIUM: 0.345
      INSPECTION_BASE_FEE: 85.00
      INSPECTION_FEE_PER_100_SQFT: 2.155
      CONDUCIVE_SURCHARGE_PER_CONDITION: 7.335
      LATE_FEE_PER_DAY: 0.415
    precision: "each of c1..c4 rounded to 2 dp round_half_up before summation; the sum is exact"
    variants:
      - name: PROVISIONAL_AT_CREATION
        when: "the renewal row is created by POST /bonds/{id}/renewals — no inspection attached, nothing past due yet"
        difference: "c3 and c4 are forced to 0.00, so invoice_total_usd == c1 + c2"
      - name: FINAL_AT_COMPLETION
        when: "the renewal is completed by POST /bond-renewals/{id}/complete"
        difference: >-
          c3 uses the attached renewal inspection's conducive_condition_count and c4 uses the
          logical clock's distance past Bond.current_term_end; the payment-sufficiency check
          compares amount_usd against THIS total, not the provisional one persisted earlier.

  - name: reinstatement_settlement
    trigger: "POST /bonds/{id}/reinstate"
    algorithm: forward_looking
    formula: |
      lapse_days = whole UTC days from Bond.lapse_date to the logical clock UTC date (floor, >= 0)
      # Two valid readings of "what does a reinstated term cost and cover". The scaffold PINS
      # the selector: variant is chosen by lapse_days against PRORATION_CUTOFF_DAYS.
      variant PRORATED_REMAINDER   (lapse_days <= PRORATION_CUTOFF_DAYS):
        premium_charge_usd  = round_half_up(Bond.annual_premium_usd * (TERM_DAYS - lapse_days) / TERM_DAYS, 2)
        new_term_start      = Bond.lapse_date
        new_term_end        = previous Bond.current_term_end + TERM_DAYS
      variant FULL_TERM_RESTART    (lapse_days >  PRORATION_CUTOFF_DAYS):
        premium_charge_usd  = Bond.annual_premium_usd
        new_term_start      = logical clock UTC date
        new_term_end        = logical clock UTC date + TERM_DAYS
      reinstatement_total_usd = round_half_up(premium_charge_usd
                                              + REINSTATEMENT_FEE_BASE
                                              + LAPSE_DAY_FEE * lapse_days, 2)
    input_set: >-
      Exactly one Bond row (status LAPSED) plus the logical clock. The reinstatement inspection is
      a precondition, not an arithmetic input.
    constants:
      TERM_DAYS: 365
      PRORATION_CUTOFF_DAYS: 30
      REINSTATEMENT_FEE_BASE: 95.00
      LAPSE_DAY_FEE: 1.75
    precision: "2 decimal places round_half_up; premium_charge_usd rounded before the outer sum"
    variants:
      - name: PRORATED_REMAINDER
        when: "lapse_days <= 30 — the original term schedule is preserved"
        difference: >-
          Charges only the unexpired fraction (TERM_DAYS - lapse_days)/TERM_DAYS of the annual
          premium and rolls current_term_end forward from the ORIGINAL term end, so the bond's
          anniversary date never moves.
      - name: FULL_TERM_RESTART
        when: "lapse_days > 30 — coverage restarts rather than resumes"
        difference: >-
          Charges the full annual premium and resets both term endpoints to the reinstatement
          date, moving the anniversary. For identical bonds this yields a strictly larger
          reinstatement_total_usd and a different current_term_end than PRORATED_REMAINDER.

  - name: claim_exclusion_and_eligibility
    trigger: "POST /damage-claims/{id}/attach-verification"
    algorithm: weighted_scoring
    formula: |
      V = Inspection(verifying_inspection_id)
      D = { GraphFinding rows where inspection_id == V.id AND finding_type == DAMAGE }
      # Variant selector is PINNED on the verifying graph's lineage, not on the adjudicator's taste.
      exclusion_basis = (V.supersedes_inspection_id IS NOT NULL) ? FINDING_LEVEL : AGGREGATE_PRORATION
      variant FINDING_LEVEL:
        new_damage_sum        = sum(f.damage_estimate_usd for f in D where f.pre_existing == false)
        eligible_damage_usd   = round_half_up(min(DamageClaim.claimed_damage_usd, new_damage_sum), 2)
      variant AGGREGATE_PRORATION:
        new_severity_sum      = sum(f.severity for f in D where f.pre_existing == false)
        total_severity_sum    = sum(f.severity for f in D)
        eligible_damage_usd   = total_severity_sum == 0
                                  ? 0.00
                                  : round_half_up(DamageClaim.claimed_damage_usd
                                                  * new_severity_sum / total_severity_sum, 2)
      excluded_pre_existing_usd = round_half_up(DamageClaim.claimed_damage_usd - eligible_damage_usd, 2)
    input_set: >-
      Exactly the GraphFinding rows of the verifying inspection with finding_type == DAMAGE.
      CONDUCIVE_CONDITION, ACTIVE_INFESTATION and PREVIOUS_TREATMENT_EVIDENCE rows are excluded
      from both sums. No rows from any other inspection participate, superseded or not.
    constants: {}
    precision: "2 decimal places round_half_up; the division in AGGREGATE_PRORATION is carried at full precision and rounded once"
    variants:
      - name: FINDING_LEVEL
        when: "the verifying inspection supersedes a prior graph, so cell-by-cell comparison is possible"
        difference: >-
          Excludes the whole dollar estimate of every pre_existing DAMAGE cell and caps the result
          at the claimed amount.
      - name: AGGREGATE_PRORATION
        when: "the verifying inspection supersedes nothing, so no cell-level baseline exists"
        difference: >-
          Excludes a severity-weighted PROPORTION of the claim instead of dollar amounts, which for
          identical findings yields a different eligible_damage_usd than FINDING_LEVEL.

  - name: claim_payout_waterfall
    trigger: >-
      POST /damage-claims/{id}/attach-verification (projected_payout_usd) and
      POST /damage-claims/{id}/adjudicate with decision=APPROVE_REPAIR (approved_payout_usd)
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED. The deductible tier is keyed on the PRE-deductible
      # eligible amount; it is never re-keyed on the post-deductible or post-cap figure.
      step 1  eligible_damage_usd     = from calculations.claim_exclusion_and_eligibility
      step 2  deductible_rate         = eligible_damage_usd <  DEDUCTIBLE_TIER1_LIMIT ? 0.10
                                      : eligible_damage_usd <  DEDUCTIBLE_TIER2_LIMIT ? 0.07
                                      :                                                 0.05
      step 3  deductible_usd          = round_half_up(eligible_damage_usd * deductible_rate, 2)
      step 4  net_claim_usd           = eligible_damage_usd - deductible_usd
      step 5  cap_headroom_usd        = Bond.repair_liability_cap_usd
                                        - Bond.claims_paid_to_date_usd
                                        - Bond.reserved_claim_amount_usd      # excludes this claim
      step 6  projected_payout_usd    = max(0.00, round_half_up(min(net_claim_usd, cap_headroom_usd), 2))
      step 7  at adjudication: approved_payout_usd = projected_payout_usd (recomputed identically;
              a RETREAT-type or non-REPAIR outcome sets approved_payout_usd = 0.00)
    input_set: >-
      One DamageClaim row, its Bond row, and the Bond's other DamageClaim rows only through the
      already-maintained aggregates claims_paid_to_date_usd (status APPROVED_REPAIR) and
      reserved_claim_amount_usd (status UNDER_ADJUDICATION).
    constants:
      DEDUCTIBLE_TIER1_LIMIT: 2000.00
      DEDUCTIBLE_TIER2_LIMIT: 10000.00
      DEDUCTIBLE_RATE_TIER1: 0.10
      DEDUCTIBLE_RATE_TIER2: 0.07
      DEDUCTIBLE_RATE_TIER3: 0.05
    precision: "2 decimal places round_half_up at steps 3 and 6 only; steps 4 and 5 are exact"

  - name: repair_liability_conservation
    trigger: >-
      asserted after every transition that touches a Bond's money fields:
      DamageClaim SUBMITTED_to_UNDER_ADJUDICATION, UNDER_ADJUDICATION_to_APPROVED_REPAIR,
      UNDER_ADJUDICATION_to_APPROVED_RETREAT_ONLY, UNDER_ADJUDICATION_to_DENIED,
      UNDER_ADJUDICATION_to_WITHDRAWN
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 — money. MUST hold for every Bond after every request, in every status.
      Bond.repair_liability_cap_usd == Bond.claims_paid_to_date_usd
                                     + Bond.reserved_claim_amount_usd
                                     + Bond.remaining_repair_cap_usd
      # and the component definitions that make it hold:
      Bond.claims_paid_to_date_usd    = sum(c.approved_payout_usd  for c in claims(bond) where c.status == APPROVED_REPAIR)
      Bond.reserved_claim_amount_usd  = sum(c.projected_payout_usd for c in claims(bond) where c.status == UNDER_ADJUDICATION)
      Bond.remaining_repair_cap_usd   = Bond.repair_liability_cap_usd
                                        - Bond.claims_paid_to_date_usd
                                        - Bond.reserved_claim_amount_usd
      # Compensating pair: attach-verification reserves X; withdraw releases exactly X, so
      # remaining_repair_cap_usd returns to its pre-verification value with zero drift.
    input_set: >-
      All DamageClaim rows whose bond_id is this bond, partitioned strictly by status:
      APPROVED_REPAIR feeds claims_paid_to_date_usd, UNDER_ADJUDICATION feeds
      reserved_claim_amount_usd, and {SUBMITTED, APPROVED_RETREAT_ONLY, DENIED, WITHDRAWN}
      feed neither.
    constants: {}
    precision: "exact equality on 2-decimal values; no tolerance window"

  - name: conducive_condition_ledger
    trigger: >-
      Inspection DRAFT_to_GRAPHED, POST /bonds (issuance applies the waiver set), and
      Bond LAPSED_to_TERMINATED (waiver set stops suppressing conditions)
    algorithm: aggregation
    formula: |
      latest_graph(P) = the Inspection row with property_id == P and status == GRAPHED that
                        maximises (graph_completed_at DESC, sequence_no DESC); none -> no graph
      codes(P)        = DISTINCT g.conducive_code over GraphFinding g where
                        g.inspection_id == latest_graph(P).id
                        AND g.finding_type == CONDUCIVE_CONDITION
                        AND g.conducive_code != NONE
      bond_of_record(P) = the single Bond row with property_id == P and status IN {ACTIVE, LAPSED}
                          (at most one exists — ERR_DUPLICATE_ACTIVE_BOND enforces it)
      total_conducive_condition_count  = |codes(P)|                             # 0 when no graph
      waived_conducive_condition_count = |codes(P) INTERSECT bond_of_record(P).conducive_waiver_codes|
                                         # 0 when no bond_of_record exists
      open_conducive_condition_count   = total - waived
      # Conserved quantity #2 — a count, not money. MUST hold for every Property after every request:
      open_conducive_condition_count + waived_conducive_condition_count
        == total_conducive_condition_count
      # Compensating pair: POST /bonds suppresses |intersection| conditions; the bond's
      # LAPSED -> TERMINATED transition restores them, so total is unchanged and open returns
      # to its pre-issuance value with zero drift.
      active_infestation_on_record = latest_graph(P) exists AND latest_graph(P).active_infestation_found
    input_set: >-
      Exactly the CONDUCIVE_CONDITION GraphFinding rows of the property's latest GRAPHED
      inspection, deduplicated by conducive_code; plus the conducive_waiver_codes array of the
      property's single Bond in status ACTIVE or LAPSED. SUPERSEDED and DRAFT inspections
      contribute nothing.
    constants: {}
    precision: "integer counts; no rounding"

  - name: station_interval_and_escalation
    trigger: "POST /bait-stations/{id}/services"
    algorithm: threshold
    formula: |
      prior_status  = BaitStation.status BEFORE this visit
      limit_days    = STATION_INTERVAL_DAYS[prior_status]
      days_since_last_service = floor((serviced_at - BaitStation.last_serviced_at) / 86400 seconds)
      interval_compliance =
          days_since_last_service <= limit_days                   -> ON_TIME
        : days_since_last_service <= limit_days + LATE_GRACE_DAYS -> LATE
        :                                                           MISSED
      # Boundary is inclusive on BOTH graded edges: exactly limit_days is ON_TIME (not LATE),
      # exactly limit_days + LATE_GRACE_DAYS is LATE (not MISSED).
      run_after =
          activity_level == NONE               -> 0
        : activity_level == LIGHT              -> BaitStation.consecutive_activity_count   # unchanged
        : activity_level IN {MODERATE, HEAVY}  -> BaitStation.consecutive_activity_count + 1
      new_status =
          activity_level == NONE                          -> INSTALLED
        : activity_level == LIGHT                          -> prior_status                 # unchanged
        : run_after >= ESCALATION_RUN_LENGTH               -> ESCALATED
        :                                                     ACTIVE_HIT
      next_due_at = serviced_at + STATION_INTERVAL_DAYS[new_status] days
      # plan-level threshold, evaluated only when new_status == ESCALATED and prior_status != ESCALATED
      plan_escalation_threshold = ceil(TreatmentPlan.target_station_count * ESCALATION_STATION_RATIO)
      TreatmentPlan.retreat_required = TreatmentPlan.escalated_station_count >= plan_escalation_threshold
    input_set: >-
      Exactly one BaitStation row (status IN {INSTALLED, ACTIVE_HIT, ESCALATED}) and its
      TreatmentPlan row (status COMPLETED). Prior StationService rows are read only through the
      station's maintained counters, never re-aggregated.
    constants:
      STATION_INTERVAL_DAYS: { INSTALLED: 90, ACTIVE_HIT: 30, ESCALATED: 14 }
      LATE_GRACE_DAYS: 7
      ESCALATION_RUN_LENGTH: 3
      ESCALATION_STATION_RATIO: 0.05
    precision: "whole days via floor for days_since_last_service; ceil for plan_escalation_threshold"

  - name: wdo_turnaround_and_form_compliance
    trigger: "POST /wdo-reports (due_at, form check) and POST /wdo-reports/{id}/issue (turnaround, SLA, lead time)"
    algorithm: interval_merge
    formula: |
      due_at = requested_at + STATE_TURNAROUND_HOURS[state_code] hours
      required_form_code = STATE_FORM_MAP[state_code]             # compared to WdoReport.form_code at creation
      # first issuance only; a re-issue after an amendment does NOT recompute these two
      turnaround_hours = ceil((first issued_at - requested_at) / 3600 seconds)
      sla_breached     = turnaround_hours > STATE_TURNAROUND_HOURS[state_code]   # STRICT >
      # closing-lead gate, re-checked on every issuance including re-issues
      closing_deadline = (closing_date at 00:00:00Z) - CLOSING_LEAD_HOURS hours
      lead_ok          = issued_at <= closing_deadline                          # inclusive <=
    input_set: >-
      Exactly one WdoReport row plus its snapshot state_code and closing_date. No aggregation over
      other reports.
    constants:
      STATE_TURNAROUND_HOURS: { AL: 120, FL: 72, GA: 96, TX: 96, CA: 168 }
      STATE_FORM_MAP: { AL: NPMA_33, FL: FL_DACS_13645, GA: GA_100, TX: TX_SPCS_TWDIR, CA: CA_NPCA_1 }
      CLOSING_LEAD_HOURS: 24
      AMENDMENT_WINDOW_DAYS: 30
    precision: "turnaround_hours is a whole number of hours via ceil; comparisons on instants are exact"

  - name: bond_term_and_lapse_windows
    trigger: "POST /bonds, Bond ACTIVE_to_ACTIVE, Bond ACTIVE_to_LAPSED, Bond LAPSED_to_ACTIVE, POST /bonds/{id}/term-review"
    algorithm: interval_merge
    formula: |
      at issuance:  current_term_start = issued_on = logical clock UTC date
                    current_term_end   = current_term_start + TERM_DAYS days     # fixed 365-day term
      always:       renewal_window_opens_on = current_term_end - RENEWAL_WINDOW_DAYS days
      renewal open when logical clock UTC date >= renewal_window_opens_on
                    AND logical clock UTC date <= current_term_end + GRACE_DAYS days
      lapse due when logical clock UTC date >  current_term_end + GRACE_DAYS days
      lapse_date  =  current_term_end + GRACE_DAYS days      # the missed deadline, clock-independent
      reinstatable while logical clock UTC date <= lapse_date + REINSTATEMENT_WINDOW_DAYS days
      termination due when logical clock UTC date > lapse_date + REINSTATEMENT_WINDOW_DAYS days
    input_set: "Exactly one Bond row plus the logical clock. Calendar months are never used — every window is a whole-day offset."
    constants:
      TERM_DAYS: 365
      RENEWAL_WINDOW_DAYS: 60
      GRACE_DAYS: 30
      REINSTATEMENT_WINDOW_DAYS: 90
      REINSTATEMENT_INSPECTION_MAX_AGE_DAYS: 30
    precision: "whole UTC days; all boundaries inclusive as written above"

  - name: pesticide_record_retention
    trigger: "POST /treatment-plans/{id}/applications (row creation); immutable thereafter"
    algorithm: decay_function
    formula: |
      state_code       = Property(TreatmentPlan.property_id).state_code      # snapshot
      retention_until  = (applied_at UTC date) + RETENTION_YEARS[state_code] * 365 days
      # Fixed 365-day years, so leap days shorten the calendar span rather than shifting the
      # anniversary; the value is a pure function of applied_at and the state.
    input_set: "Exactly one TreatmentPlan row and its Property row, read once at creation."
    constants:
      RETENTION_YEARS: { AL: 2, FL: 4, GA: 2, TX: 2, CA: 3 }
    precision: "calendar date, YYYY-MM-DD; no time component"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
#
# Priorities are evaluated in strictly ascending numeric order. The FIRST rule
# whose condition is violated determines the response; no later rule is
# evaluated. Gaps in the numbering are intentional room for later rules.
# The ladder is: auth (10-30) -> path existence (40) -> request shape (50-55)
# -> body-reference existence (60) -> optimistic concurrency (70) -> target
# state (80) -> business_safety (90) -> business_referential (100) ->
# business_constraint (105) -> business_temporal (110) -> business_fiscal (120).
# Safety and compliance always outrank money in this domain: a request that is
# both unlicensed and underpaid reports the licence failure.
# ---------------------------------------------------------------------------

validations:
  # --- 10-30: authentication, authorization, ownership -----------------------
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request except GET /_clock/current"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7 and that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 30
    category: auth
    check: >-
      Ownership: when X-User-Role IN {FieldInspector, Applicator}, X-User-ID must equal the Inspector.id named
      by the resource's inspector_id (Inspection) or applicator_id (TreatmentPlan / PesticideRecord
      / StationService); an entity_backed inspector may not act on another inspector's rows.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: >-
      POST /inspections, POST /inspections/{id}/findings, POST /inspections/{id}/graph-complete,
      POST /treatment-plans/{id}/applications, POST /bait-stations/{id}/services

  # --- 40: path existence, left to right ------------------------------------
  - priority: 40
    category: existence
    check: >-
      Every {id} segment in the request path resolves to a persisted row of the segment's entity,
      validated left to right; the leftmost unresolved segment reports its own entity's error_id.
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_TREATMENT_PLAN_NOT_FOUND | ERR_BOND_NOT_FOUND | ERR_BOND_RENEWAL_NOT_FOUND | ERR_WDO_REPORT_NOT_FOUND | ERR_BAIT_STATION_NOT_FOUND | ERR_DAMAGE_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  # --- 50-55: request shape --------------------------------------------------
  - priority: 50
    category: business_constraint
    check: >-
      Request body shape: every field the endpoint declares as required is present and non-null;
      every field has the declared JSON type; every enum field holds a declared member; every
      money field is a JSON number with at most 2 decimal places and >= 0; every datetime field is
      an RFC 3339 UTC instant ending in Z; every date field matches YYYY-MM-DD; state_code matches
      ^[A-Z]{2}$; grid_ref matches ^[A-J](10|[1-9])$; unknown fields are ignored.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 52
    category: business_constraint
    check: >-
      Cross-field shape: scheduled_end_at strictly after scheduled_start_at; closing_date present
      exactly when purpose == REAL_ESTATE (and null otherwise); supersedes_inspection_id present
      exactly when purpose IN {RENEWAL, REINSTATEMENT}; conducive_code non-NONE exactly when
      finding_type == CONDUCIVE_CONDITION; damage_estimate_usd > 0 exactly when
      finding_type == DAMAGE; pre_existing present exactly when finding_type == DAMAGE.
    error_id: ERR_FIELD_COMBINATION_INVALID
    http_status: 422
    applies_to: "POST /inspections, POST /inspections/{id}/findings"

  - priority: 55
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  # --- 60: body-reference existence -----------------------------------------
  - priority: 60
    category: existence
    check: >-
      Every id carried in the request BODY resolves to a persisted row: property_id, inspector_id,
      supersedes_inspection_id, inspection_id, treatment_plan_id, bond_id, verifying_inspection_id,
      reinstatement_inspection_id. Body references are checked after shape and before OCC.
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_TREATMENT_PLAN_NOT_FOUND | ERR_BOND_NOT_FOUND"
    http_status: 404
    applies_to: "POST /inspections, POST /treatment-plans, POST /bonds, POST /wdo-reports, POST /damage-claims, POST /damage-claims/{id}/attach-verification, POST /bonds/{id}/reinstate"
    note: >-
      Priority-conflict partner of rule 70. A POST /damage-claims carrying an unknown
      verifying-side reference AND a stale expected_bond_version reports the 404, never the 412.

  # --- 70: optimistic concurrency -------------------------------------------
  - priority: 70
    category: state
    check: >-
      expected_treatment_plan_version equals TreatmentPlan.version (POST
      /treatment-plans/{id}/applications) and expected_bond_version equals Bond.version
      (POST /damage-claims), per §1.2.1.
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /treatment-plans/{id}/applications, POST /damage-claims"

  # --- 80: target-resource state --------------------------------------------
  - priority: 80
    category: state
    check: >-
      The target row named by the path is in a status from which the requested transition is
      declared in §1.2 (e.g. license-status requires a declared Inspector transition;
      graph-complete requires Inspection.status == DRAFT; approve requires
      TreatmentPlan.status == PROPOSED; adjudicate requires DamageClaim.status ==
      UNDER_ADJUDICATION; service requires BaitStation.status IN {INSTALLED, ACTIVE_HIT,
      ESCALATED}).
    error_id: "ERR_INVALID_INSPECTOR_STATE | ERR_INVALID_INSPECTION_STATE | ERR_INVALID_PLAN_STATE | ERR_INVALID_BOND_STATE | ERR_INVALID_RENEWAL_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_STATION_STATE | ERR_INVALID_CLAIM_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
    note: >-
      Priority-conflict partner of rule 114. POST /bonds/{id}/renewals against a LAPSED bond that
      is also outside its renewal window reports ERR_INVALID_BOND_STATE, not
      ERR_RENEWAL_WINDOW_NOT_OPEN.

  # --- 90: business_safety — licensing, compliance, segregation of duties ----
  - priority: 90
    category: business_safety
    check: "Inspector.status == ACTIVE for the acting inspector or applicator (SUSPENDED and EXPIRED both fail)"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/graph-complete, POST /treatment-plans/{id}/applications, POST /bait-stations/{id}/services, POST /bond-renewals/{id}/complete"

  - priority: 92
    category: business_safety
    check: >-
      Inspector.license_expires_on >= the logical clock UTC date (inclusive: expiry ON the clock
      date still passes) for every inspector or applicator whose work the request records.
    error_id: ERR_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /inspections/{id}/graph-complete, POST /treatment-plans/{id}/applications, POST /bait-stations/{id}/services, POST /bond-renewals/{id}/complete"
    note: >-
      Priority-conflict partner of rule 130. POST /bond-renewals/{id}/complete carrying both an
      expired applicator licence and an underpayment reports ERR_LICENSE_EXPIRED — compliance
      outranks money.

  - priority: 93
    category: business_safety
    check: >-
      Licence reinstatement requirements, checked only when the requested status is ACTIVE and
      Inspector.status == EXPIRED: license_expires_on must be present in the body and strictly
      after the logical clock UTC date, and the effective credit count (request ce_credits when
      supplied, otherwise Inspector.ce_credits) must be >= CE_CREDITS_REQUIRED (8). An EXPIRED
      licence is never reactivated on the strength of its stale expiry date or an unmet
      continuing-education balance.
    error_id: ERR_LICENSE_REINSTATEMENT_UNMET
    http_status: 422
    applies_to: "POST /inspectors/{id}/license-status"

  - priority: 94
    category: business_safety
    check: >-
      Inspector.license_state == Property.state_code for the property being inspected or treated;
      a licence issued by another state may not sign a graph or apply a pesticide.
    error_id: ERR_LICENSE_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /inspections, POST /treatment-plans/{id}/applications"

  - priority: 95
    category: business_safety
    check: >-
      WdoReport.form_code equals STATE_FORM_MAP[state_code] from
      calculations.wdo_turnaround_and_form_compliance; a report filed on another state's form is
      not a compliant filing.
    error_id: ERR_FORM_CODE_MISMATCH
    http_status: 422
    applies_to: "POST /wdo-reports"

  - priority: 96
    category: business_safety
    check: >-
      Category endorsement: the acting inspector's license_categories array must contain
      WDO_INSPECTOR to graph-complete an inspection; must contain TERMITE_APPLICATOR to record an
      application on a LIQUID_BARRIER or BAIT_STATION plan; and must contain FUMIGATION_CERTIFIED
      AND have fumigation_endorsement == true to record an application on a FUMIGATION plan. A
      missing endorsement blocks the request even when the licence is ACTIVE and unexpired.
    error_id: ERR_CATEGORY_NOT_LICENSED
    http_status: 422
    applies_to: "POST /inspections/{id}/graph-complete, POST /treatment-plans/{id}/applications"

  - priority: 97
    category: business_safety
    check: >-
      Segregation of duties on adjudication: X-User-ID must differ from Bond.issued_by_user_id.
      The user who underwrote a bond may never adjudicate a claim against it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /damage-claims/{id}/adjudicate"

  - priority: 98
    category: business_safety
    check: >-
      Segregation of duties on verification: the verifying inspection's inspector_id must differ
      from TreatmentPlan.applicator_id on the bond's plan. The applicator who treated the
      structure may not certify the damage claimed against that treatment.
    error_id: ERR_VERIFIER_IS_APPLICATOR
    http_status: 422
    applies_to: "POST /damage-claims/{id}/attach-verification"

  - priority: 99
    category: business_safety
    check: >-
      A TreatmentPlan may not be abandoned while any of its PesticideRecord rows has
      retention_until >= the logical clock UTC date; state pesticide records must outlive the
      plan that produced them.
    error_id: ERR_RETENTION_LOCK_ACTIVE
    http_status: 409
    applies_to: "POST /treatment-plans/{id}/abandon"


  # --- 100: business_referential — the state of OTHER entities ---------------
  - priority: 100
    category: business_referential
    check: >-
      Inspection(inspection_id).status == GRAPHED wherever an inspection is consumed as evidence:
      bond issuance, renewal completion, reinstatement, WDO report issuance, claim verification.
      A DRAFT or SUPERSEDED graph is not evidence.
    error_id: ERR_INSPECTION_NOT_GRAPHED
    http_status: 409
    applies_to: "POST /bonds, POST /bond-renewals/{id}/complete, POST /bonds/{id}/reinstate, POST /wdo-reports/{id}/issue, POST /damage-claims/{id}/attach-verification"

  - priority: 101
    category: business_referential
    check: >-
      Inspection(inspection_id).purpose matches the consumer: INITIAL for bond issuance, RENEWAL
      for renewal completion, REINSTATEMENT for reinstatement, REAL_ESTATE for WDO report issuance.
      Claim verification accepts any purpose.
    error_id: ERR_INSPECTION_PURPOSE_MISMATCH
    http_status: 422
    applies_to: "POST /bonds, POST /bond-renewals/{id}/complete, POST /bonds/{id}/reinstate, POST /wdo-reports/{id}/issue"

  - priority: 102
    category: business_referential
    check: >-
      TreatmentPlan(treatment_plan_id).status == COMPLETED before a bond may be issued against it;
      a PROPOSED, APPROVED or ABANDONED plan cannot be bonded.
    error_id: ERR_PLAN_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /bonds"

  - priority: 103
    category: business_referential
    check: >-
      The requested method is permitted for the property's construction type:
      METHOD_BY_CONSTRUCTION = { SLAB: [LIQUID_BARRIER, BAIT_STATION, FUMIGATION],
      CRAWLSPACE: [LIQUID_BARRIER, BAIT_STATION], BASEMENT: [BAIT_STATION, FUMIGATION],
      PIER_AND_BEAM: [LIQUID_BARRIER, BAIT_STATION, FUMIGATION] }. A vented CRAWLSPACE cannot be
      sealed to hold fumigant, and a BASEMENT cannot take a continuous exterior trench below its
      footing, so those two cells are refused.
    error_id: ERR_METHOD_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /treatment-plans"

  - priority: 104
    category: business_referential
    check: >-
      Property alignment across referenced rows: Inspection.property_id ==
      TreatmentPlan.property_id at plan creation; Bond.property_id ==
      Inspection(reinstatement_inspection_id).property_id at reinstatement; Bond.property_id ==
      Inspection(verifying_inspection_id).property_id at claim verification;
      Inspection.supersedes_inspection_id points at an inspection of the SAME property.
    error_id: ERR_PROPERTY_MISMATCH
    http_status: 422
    applies_to: "POST /treatment-plans, POST /inspections, POST /bonds/{id}/reinstate, POST /damage-claims/{id}/attach-verification"

  - priority: 105
    category: business_referential
    check: "Bond.status == ACTIVE before a damage claim may be filed against it (LAPSED and TERMINATED bonds accept no new claims)"
    error_id: ERR_BOND_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /damage-claims"

  # --- 105: business_constraint — uniqueness, capacity, completeness --------
  - priority: 106
    category: business_constraint
    check: >-
      A Property has at most one Bond in status ACTIVE or LAPSED at any instant; issuing a second
      one is rejected even when the first is mid-lapse.
    error_id: ERR_DUPLICATE_ACTIVE_BOND
    http_status: 409
    applies_to: "POST /bonds"

  - priority: 107
    category: business_constraint
    check: >-
      A DRAFT inspection may not be graph-completed with zero GraphFinding rows unless the request
      body sets no_findings_attested == true.
    error_id: ERR_GRAPH_INCOMPLETE
    http_status: 422
    applies_to: "POST /inspections/{id}/graph-complete"

  - priority: 108
    category: business_constraint
    check: >-
      Within one Inspection, the pair (grid_ref, finding_type) is unique; the same cell may carry
      a DAMAGE and a CONDUCIVE_CONDITION finding but not two of either.
    error_id: ERR_DUPLICATE_GRID_FINDING
    http_status: 409
    applies_to: "POST /inspections/{id}/findings"

  - priority: 109
    category: business_constraint
    check: >-
      The chemical product matches the method: PRODUCT_BY_METHOD = { LIQUID_BARRIER:
      [FIPRO_9, IMID_4], BAIT_STATION: [HEXA_BAIT_2], FUMIGATION: [SULFURYL_F] }. A soil
      termiticide may not be loaded into a bait cartridge and a fumigant may not be trenched.
    error_id: ERR_PRODUCT_METHOD_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /treatment-plans"

  - priority: 110
    category: business_constraint
    check: >-
      A Bond has at most one DamageClaim in status UNDER_ADJUDICATION at any instant; a second
      verification attempt while one claim holds a reserve is rejected.
    error_id: ERR_CLAIM_ALREADY_RESERVED
    http_status: 409
    applies_to: "POST /damage-claims/{id}/attach-verification"

  - priority: 111
    category: business_constraint
    check: >-
      decision == APPROVE_REPAIR requires Bond.coverage_tier == REPAIR_AND_RETREAT; a RETREAT_ONLY
      bond can only be adjudicated APPROVE_RETREAT_ONLY or DENY.
    error_id: ERR_TIER_EXCLUDES_REPAIR
    http_status: 422
    applies_to: "POST /damage-claims/{id}/adjudicate"

  - priority: 112
    category: business_constraint
    check: >-
      A Bond has at most one BondRenewal in status PENDING at any instant; the open renewal must be
      completed or voided before another is created.
    error_id: ERR_RENEWAL_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /bonds/{id}/renewals"

  # --- 110: business_temporal — windows, intervals, ordering ----------------
  - priority: 113
    category: business_temporal
    check: >-
      The acting inspector has no other Inspection whose half-open occupation interval
      [scheduled_start_at, scheduled_end_at) overlaps the requested one; touching intervals
      (previous end == new start) are permitted.
    error_id: ERR_INSPECTOR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 114
    category: business_temporal
    check: >-
      The logical clock UTC date is within the renewal window: >= current_term_end -
      RENEWAL_WINDOW_DAYS (60) and <= current_term_end + GRACE_DAYS (30). Both bounds inclusive.
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /bonds/{id}/renewals, POST /bond-renewals/{id}/complete"

  - priority: 115
    category: business_temporal
    check: >-
      The logical clock UTC date is <= Bond.lapse_date + REINSTATEMENT_WINDOW_DAYS (90); past that
      the bond can only be terminated.
    error_id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /bonds/{id}/reinstate"

  - priority: 116
    category: business_temporal
    check: >-
      Inspection(reinstatement_inspection_id).graph_completed_at >= logical clock instant -
      REINSTATEMENT_INSPECTION_MAX_AGE_DAYS (30) days; an older graph cannot support reinstatement.
    error_id: ERR_REINSTATEMENT_INSPECTION_STALE
    http_status: 422
    applies_to: "POST /bonds/{id}/reinstate"

  - priority: 117
    category: business_temporal
    check: >-
      For method == FUMIGATION, the logical clock instant (which stamps PesticideRecord.applied_at)
      must be >= TreatmentPlan.fumigation_start_at; fumigant may not be recorded as discharged
      before the permitted start of the fumigation window.
    error_id: ERR_APPLICATION_BEFORE_PERMIT_WINDOW
    http_status: 422
    applies_to: "POST /treatment-plans/{id}/applications"

  - priority: 118
    category: business_temporal
    check: >-
      The logical clock instant (which stamps StationService.serviced_at) is strictly after
      BaitStation.last_serviced_at; station visits form a strictly increasing chronological chain,
      so a clock rewound to or before the previous visit is refused.
    error_id: ERR_SERVICE_TIME_INVALID
    http_status: 422
    applies_to: "POST /bait-stations/{id}/services"

  - priority: 119
    category: business_temporal
    check: >-
      issued_at (the logical clock instant) <= closing_date at 00:00:00Z minus CLOSING_LEAD_HOURS
      (24); inclusive at exactly the deadline instant. A report that would land inside the
      24-hour pre-closing window is refused rather than issued late.
    error_id: ERR_CLOSING_LEAD_TIME_MISSED
    http_status: 409
    applies_to: "POST /wdo-reports/{id}/issue"

  - priority: 120
    category: business_temporal
    check: >-
      The logical clock UTC date is <= WdoReport.issued_at date + AMENDMENT_WINDOW_DAYS (30) when
      amending an ISSUED report.
    error_id: ERR_AMENDMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /wdo-reports/{id}/amend"

  - priority: 121
    category: business_temporal
    check: >-
      The logical clock UTC date (which stamps DamageClaim.reported_at) is within the bond's
      coverage window: >= Bond.current_term_start and <= Bond.current_term_end, both inclusive.
      Damage reported outside the current term is not covered by it.
    error_id: ERR_DAMAGE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /damage-claims"

  # --- 120: business_fiscal — money last -----------------------------------
  - priority: 130
    category: business_fiscal
    check: >-
      amount_usd >= the FINAL_AT_COMPLETION invoice_total_usd recomputed at completion time (not
      the provisional total stored at creation).
    error_id: ERR_PAYMENT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /bond-renewals/{id}/complete"

  - priority: 131
    category: business_fiscal
    check: "amount_usd >= reinstatement_total_usd from calculations.reinstatement_settlement"
    error_id: ERR_REINSTATEMENT_PAYMENT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /bonds/{id}/reinstate"

  - priority: 132
    category: business_fiscal
    check: >-
      Bond.remaining_repair_cap_usd > 0.00 before a claim may be verified on a REPAIR_AND_RETREAT
      bond; an exhausted cap leaves nothing to reserve.
    error_id: ERR_REPAIR_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /damage-claims/{id}/attach-verification"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# api_prefix is "" — every path below is the literal request path.
# Every list endpoint accepts limit? and offset? and returns the paginated
# envelope from §1.0. Every FK declared in §1.1 is reverse-reachable either
# through a sub-resource GET (findings, applications, bait-stations, services,
# renewals) or through a filtered list that accepts the FK field as a query
# parameter.
# ---------------------------------------------------------------------------

endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock to any UTC instant. Every timestamp the server stamps
      (created_at, updated_at, graph_completed_at, requested_at, issued_at, applied_at,
      serviced_at, reported_at, paid_at) and every window comparison reads this clock. The clock's
      mandatory startup default is exactly 2026-08-01T00:00:00Z — before any call to this endpoint
      the clock reads that instant and MUST NOT fall back to real wall-clock time. Moving the clock
      never retro-fires a transition; state changes only happen when a business endpoint is called.
    roles: [ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock is set to current_utc"]

  - method: GET
    path: "/_clock/current"
    description: "Reads the logical clock's current UTC instant. Requires no headers."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: []
    output: null
    side_effects: []

  # --- Property -------------------------------------------------------------
  - method: POST
    path: "/properties"
    description: "Registers a structure. The four conducive counters and active_infestation_on_record start at 0 / false."
    roles: [ComplianceOfficer]
    code: 201
    input: [address_line1, state_code, construction_type, square_footage, linear_footage, year_built, "crawl_clearance_inches?", "has_attached_structures?"]
    output: Property
    side_effects: ["Property.total_conducive_condition_count / waived_conducive_condition_count / open_conducive_condition_count = 0", "Property.active_infestation_on_record = false"]

  - method: GET
    path: "/properties/{id}"
    description: "Reads one structure, including its live conducive-condition ledger counters."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "Lists structures, newest first by created_at."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: ["state_code?", "construction_type?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # --- Inspector ------------------------------------------------------------
  - method: POST
    path: "/inspectors"
    description: "Registers a licensed inspector/applicator. Starts in status ACTIVE."
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, license_number, license_state, license_categories, license_expires_on, "fumigation_endorsement?", "ce_credits?"]
    output: Inspector
    side_effects: ["Inspector.status = ACTIVE"]

  - method: GET
    path: "/inspectors/{id}"
    description: "Reads one inspector, including licence status, categories and expiry."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: GET
    path: "/inspectors"
    description: "Lists inspectors."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator]
    code: 200
    input: ["status?", "license_state?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []

  - method: POST
    path: "/inspectors/{id}/license-status"
    description: >-
      Drives the Inspector licence cycle: ACTIVE -> SUSPENDED, SUSPENDED -> ACTIVE,
      ACTIVE -> EXPIRED, EXPIRED -> ACTIVE. license_expires_on is required when moving
      EXPIRED -> ACTIVE and must be >= the logical clock UTC date.
    roles: [ComplianceOfficer]
    code: 200
    input: [status, "license_expires_on?", "ce_credits?"]
    output: Inspector
    side_effects: ["Inspector.status = requested status", "Inspector.license_expires_on / ce_credits updated when supplied", "increments Inspector.version by 1"]

  # --- Inspection + GraphFinding -------------------------------------------
  - method: POST
    path: "/inspections"
    description: >-
      Opens a DRAFT graph on a property and stamps sequence_no (1-based, monotonically increasing
      within property_id). Supplying supersedes_inspection_id retires the prior graph immediately.
    roles: [FieldInspector]
    code: 201
    input: [property_id, inspector_id, purpose, scheduled_start_at, scheduled_end_at, "supersedes_inspection_id?", "closing_date?"]
    output: Inspection
    side_effects:
      - "Inspection.status = DRAFT; sequence_no = (max sequence_no over the property) + 1"
      - "cascade hop 1: Inspection(supersedes_inspection_id) transitions to SUPERSEDED"
      - "cascade hop 2: every WdoReport whose inspection_id is the superseded inspection transitions to VOID"
      - "cascade hop 3: Property.total / waived / open_conducive_condition_count and active_infestation_on_record are recomputed from the property's new latest GRAPHED inspection"

  - method: GET
    path: "/inspections/{id}"
    description: "Reads one graph with its computed finding rollups."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: >-
      Lists graphs, filterable by property, inspector, the graph they supersede, status and purpose.
      Reverse-reachability for Inspection.property_id, Inspection.inspector_id and
      Inspection.supersedes_inspection_id.
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: ["property_id?", "inspector_id?", "supersedes_inspection_id?", "status?", "purpose?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/findings"
    description: "Adds one immutable graph cell notation to a DRAFT inspection."
    roles: [FieldInspector]
    code: 201
    input: [finding_type, grid_ref, "organism?", "severity?", "conducive_code?", "damage_estimate_usd?", "pre_existing?"]
    output: GraphFinding
    side_effects: ["GraphFinding row created (immutable — no version, no update endpoint)"]

  - method: GET
    path: "/inspections/{id}/findings"
    description: "Lists the graph cells of one inspection. Reverse-reachability for GraphFinding.inspection_id."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: ["finding_type?", "limit?", "offset?"]
    output: GraphFinding[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/graph-complete"
    description: >-
      Signs the graph: DRAFT -> GRAPHED. Set no_findings_attested true to sign a zero-finding graph.
      Recomputes the inspection's rollups and the property's conducive ledger.
    roles: [FieldInspector]
    code: 200
    input: ["no_findings_attested?"]
    output: Inspection
    side_effects:
      - "Inspection.status = GRAPHED; graph_completed_at = logical clock instant"
      - "recomputes Inspection.findings_count / conducive_condition_count / active_infestation_found / damage_estimate_total_usd"
      - "recomputes the Property ledger via calculations.conducive_condition_ledger"
      - "increments Inspection.version by 1"

  # --- TreatmentPlan + PesticideRecord -------------------------------------
  - method: POST
    path: "/treatment-plans"
    description: >-
      Proposes a treatment. Sizing and the quote are computed once here and frozen. Creating a plan
      retires every still-PROPOSED plan on the same property.
    roles: [BranchManager]
    code: 201
    input: [property_id, inspection_id, applicator_id, method, chemical_product_code, "fumigation_permit_number?", "fumigation_start_at?", "fumigation_reentry_at?"]
    output: TreatmentPlan
    side_effects:
      - "TreatmentPlan.status = PROPOSED"
      - "computes target_gallons / target_station_count / quoted_price_usd via calculations.treatment_sizing_and_quote"
      - "cascade: every other TreatmentPlan of this property in status PROPOSED transitions to ABANDONED"

  - method: GET
    path: "/treatment-plans/{id}"
    description: "Reads one plan with its frozen sizing and quote plus its live escalation counters."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: GET
    path: "/treatment-plans"
    description: >-
      Lists plans. Reverse-reachability for TreatmentPlan.property_id, TreatmentPlan.inspection_id
      and TreatmentPlan.applicator_id.
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, ClaimsAdjudicator, PropertyOwner]
    code: 200
    input: ["property_id?", "inspection_id?", "applicator_id?", "status?", "method?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []

  - method: POST
    path: "/treatment-plans/{id}/approve"
    description: "PROPOSED -> APPROVED. Requires a GRAPHED justifying inspection and an unexpired ACTIVE applicator licence."
    roles: [BranchManager]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["TreatmentPlan.status = APPROVED", "increments TreatmentPlan.version by 1"]

  - method: POST
    path: "/treatment-plans/{id}/abandon"
    description: >-
      APPROVED -> ABANDONED. Refused with ERR_RETENTION_LOCK_ACTIVE while any PesticideRecord of
      the plan still has retention_until >= the logical clock UTC date.
    roles: [BranchManager]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["TreatmentPlan.status = ABANDONED", "increments TreatmentPlan.version by 1"]

  - method: POST
    path: "/treatment-plans/{id}/applications"
    description: >-
      Records one immutable pesticide application against an APPROVED plan and stamps its state
      retention date. OCC-guarded on the parent plan per §1.2.1.
    roles: [Applicator]
    code: 201
    input: [product_epa_number, gallons_applied, concentration_pct, expected_treatment_plan_version]
    output: PesticideRecord
    side_effects:
      - "PesticideRecord row created (immutable) with applied_at = logical clock instant, applicator_license_number / applicator_license_state / state_code snapshotted"
      - "computes retention_until via calculations.pesticide_record_retention"
      - "TreatmentPlan.gallons_applied_total += gallons_applied"
      - "increments TreatmentPlan.version by 1"

  - method: GET
    path: "/treatment-plans/{id}/applications"
    description: "Lists the pesticide records of one plan. Reverse-reachability for PesticideRecord.treatment_plan_id."
    roles: [ComplianceOfficer, BranchManager, Applicator, FieldInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: PesticideRecord[]
    side_effects: []

  - method: POST
    path: "/treatment-plans/{id}/complete"
    description: >-
      APPROVED -> COMPLETED. For BAIT_STATION plans this cascade-creates target_station_count
      BaitStation rows, which are discoverable only through GET /treatment-plans/{id}/bait-stations.
    roles: [Applicator]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "TreatmentPlan.status = COMPLETED; completed_at = logical clock instant"
      - "method == BAIT_STATION: creates target_station_count BaitStation rows in status INSTALLED with station_index 1..target_station_count"
      - "increments TreatmentPlan.version by 1"

  - method: GET
    path: "/treatment-plans/{id}/bait-stations"
    description: >-
      Lists the stations installed under one plan, ordered by station_index ascending. Reverse-reachability
      for BaitStation.treatment_plan_id and the only discovery channel for cascade-created stations.
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, PropertyOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BaitStation[]
    side_effects: []

  # --- BaitStation + StationService ----------------------------------------
  - method: GET
    path: "/bait-stations/{id}"
    description: "Reads one station with its activity run length, service counters and next_due_at."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, PropertyOwner]
    code: 200
    input: []
    output: BaitStation
    side_effects: []

  - method: POST
    path: "/bait-stations/{id}/services"
    description: >-
      Records one immutable station visit at the logical clock instant, grades the interval,
      advances or resets the activity run, and may escalate the station and its plan.
    roles: [FieldInspector]
    code: 201
    input: [activity_level, "matrix_replaced?"]
    output: StationService
    side_effects:
      - "StationService row created (immutable) with serviced_at = logical clock instant, days_since_last_service and interval_compliance computed"
      - "BaitStation.status / consecutive_activity_count / last_serviced_at / next_due_at / service_count / matrix_replacement_count updated per calculations.station_interval_and_escalation"
      - "cascade hop 2 on escalation: TreatmentPlan.escalated_station_count += 1 and retreat_required may flip"
      - "cascade hop 3 on the retreat_required flip: the covering ACTIVE Bond sets coverage_watch and retreat_required true"
      - "increments BaitStation.version by 1"

  - method: GET
    path: "/bait-stations/{id}/services"
    description: "Lists the visit history of one station. Reverse-reachability for StationService.bait_station_id."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, Applicator, PropertyOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: StationService[]
    side_effects: []

  # --- Bond -----------------------------------------------------------------
  - method: POST
    path: "/bonds"
    description: >-
      Issues a bond against a COMPLETED plan. Premium, repair-liability cap and the 365-day term
      windows are computed here and frozen. conducive_waiver_codes immediately suppresses the
      matching conditions in the property ledger.
    roles: [BranchManager]
    code: 201
    input: [property_id, treatment_plan_id, coverage_tier, "conducive_waiver_codes?"]
    output: Bond
    side_effects:
      - "Bond.status = ACTIVE; issued_by_user_id = X-User-ID; term_index = 1"
      - "computes base_premium_usd / repair_liability_cap_usd / annual_premium_usd via calculations.bond_premium_and_cap"
      - "computes issued_on / current_term_start / current_term_end / renewal_window_opens_on via calculations.bond_term_and_lapse_windows"
      - "remaining_repair_cap_usd = repair_liability_cap_usd; claims_paid_to_date_usd = reserved_claim_amount_usd = 0.00"
      - "recomputes the Property ledger via calculations.conducive_condition_ledger (waived conditions rise, open conditions fall)"

  - method: GET
    path: "/bonds/{id}"
    description: "Reads one bond with its money ledger, term windows and watch flags."
    roles: [ComplianceOfficer, BranchManager, ClaimsAdjudicator, FieldInspector, PropertyOwner]
    code: 200
    input: []
    output: Bond
    side_effects: []

  - method: GET
    path: "/bonds"
    description: "Lists bonds. Reverse-reachability for Bond.property_id and Bond.treatment_plan_id."
    roles: [ComplianceOfficer, BranchManager, ClaimsAdjudicator, FieldInspector, PropertyOwner]
    code: 200
    input: ["property_id?", "treatment_plan_id?", "status?", "coverage_tier?", "limit?", "offset?"]
    output: Bond[]
    side_effects: []

  - method: POST
    path: "/bonds/{id}/term-review"
    description: >-
      Compliance sweep of one bond against the logical clock. ACTIVE past grace -> LAPSED (voiding
      pending renewals and denying open claims, releasing their reserves); LAPSED past the
      90-day reinstatement window -> TERMINATED (removing stations, restoring the property ledger).
      Returns 409 when neither deadline has passed.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Bond
    side_effects:
      - "Bond.status = LAPSED with lapse_date = current_term_end + GRACE_DAYS, or Bond.status = TERMINATED"
      - "cascade hop 2 (lapse): pending BondRenewal rows -> VOID; SUBMITTED / UNDER_ADJUDICATION DamageClaim rows -> DENIED with denial_reason_code BOND_LAPSED"
      - "cascade hop 3 (lapse): each denied UNDER_ADJUDICATION claim releases its projected_payout_usd from reserved_claim_amount_usd back into remaining_repair_cap_usd"
      - "cascade hop 2 (termination): BaitStation rows -> REMOVED; Property waived count -> 0 and open count restored"
      - "increments Bond.version by 1"

  - method: POST
    path: "/bonds/{id}/reinstate"
    description: >-
      LAPSED -> ACTIVE against a fresh REINSTATEMENT graph and a payment. Charges the prorated
      remainder when the lapse is 30 days old or less, otherwise a full restarted term.
    roles: [BranchManager]
    code: 200
    input: [reinstatement_inspection_id, amount_usd]
    output: Bond
    side_effects:
      - "Bond.status = ACTIVE; lapse_date = null; reinstatement_count += 1; term_index += 1"
      - "current_term_start / current_term_end / renewal_window_opens_on set per the selected variant of calculations.reinstatement_settlement"
      - "increments Bond.version by 1"

  - method: POST
    path: "/bonds/{id}/renewals"
    description: >-
      Opens a PENDING renewal invoice for the current term, priced under variant
      PROVISIONAL_AT_CREATION. Only one PENDING renewal may exist per bond.
    roles: [BranchManager]
    code: 201
    input: []
    output: BondRenewal
    side_effects:
      - "BondRenewal.status = PENDING; term_index = Bond.term_index; due_on = Bond.current_term_end"
      - "computes base_renewal_fee_usd / inspection_fee_usd / invoice_total_usd via calculations.renewal_invoice_total variant PROVISIONAL_AT_CREATION (conducive_surcharge_usd and late_fee_usd = 0.00)"

  - method: GET
    path: "/bonds/{id}/renewals"
    description: "Lists the renewal invoices of one bond. Reverse-reachability for BondRenewal.bond_id."
    roles: [ComplianceOfficer, BranchManager, PropertyOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BondRenewal[]
    side_effects: []

  # --- BondRenewal ----------------------------------------------------------
  - method: GET
    path: "/bond-renewals/{id}"
    description: "Reads one renewal invoice with its four priced components."
    roles: [ComplianceOfficer, BranchManager, PropertyOwner]
    code: 200
    input: []
    output: BondRenewal
    side_effects: []

  - method: GET
    path: "/bond-renewals"
    description: "Lists renewal invoices. Reverse-reachability for BondRenewal.inspection_id."
    roles: [ComplianceOfficer, BranchManager, PropertyOwner]
    code: 200
    input: ["bond_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: BondRenewal[]
    side_effects: []

  - method: POST
    path: "/bond-renewals/{id}/complete"
    description: >-
      Attaches the RENEWAL graph, reprices the invoice under variant FINAL_AT_COMPLETION, checks
      the payment against that final total, marks the renewal PAID and rolls the bond's term
      forward one 365-day period.
    roles: [BranchManager]
    code: 200
    input: [inspection_id, amount_usd]
    output: BondRenewal
    side_effects:
      - "BondRenewal.inspection_id set; conducive_surcharge_usd / late_fee_usd / invoice_total_usd repriced under variant FINAL_AT_COMPLETION"
      - "BondRenewal.status = PAID; paid_at = logical clock instant; amount_paid_usd = amount_usd"
      - "cascade: the parent Bond takes its ACTIVE -> ACTIVE term roll-forward (term_index += 1, term windows advanced, Bond.version += 1)"
      - "increments BondRenewal.version by 1"

  # --- WdoReport ------------------------------------------------------------
  - method: POST
    path: "/wdo-reports"
    description: >-
      Opens a statutory real-estate WDO report on a REAL_ESTATE graph. Snapshots state_code and
      closing_date, computes due_at from the state turnaround clock, and rejects a form_code that
      is not that state's form.
    roles: [PropertyOwner, ComplianceOfficer]
    code: 201
    input: [inspection_id, form_code]
    output: WdoReport
    side_effects:
      - "WdoReport.status = DRAFT; requested_at = logical clock instant; state_code and closing_date snapshotted from the inspection's property and the inspection"
      - "computes due_at via calculations.wdo_turnaround_and_form_compliance"

  - method: GET
    path: "/wdo-reports/{id}"
    description: "Reads one report with its turnaround measurement and SLA verdict."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, PropertyOwner]
    code: 200
    input: []
    output: WdoReport
    side_effects: []

  - method: GET
    path: "/wdo-reports"
    description: "Lists reports. Reverse-reachability for WdoReport.inspection_id."
    roles: [ComplianceOfficer, BranchManager, FieldInspector, PropertyOwner]
    code: 200
    input: ["inspection_id?", "status?", "sla_breached?", "limit?", "offset?"]
    output: WdoReport[]
    side_effects: []

  - method: POST
    path: "/wdo-reports/{id}/issue"
    description: >-
      DRAFT -> ISSUED or AMENDED -> ISSUED. The first issuance measures turnaround_hours and sets
      sla_breached; a re-issue after an amendment leaves both untouched. Every issuance re-checks
      the 24-hour pre-closing lead time.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WdoReport
    side_effects:
      - "WdoReport.status = ISSUED; issued_at = logical clock instant of THIS issuance (a re-issue after an amendment refreshes it, which restarts the 30-day amendment window)"
      - "first issuance: computes turnaround_hours and sla_breached via calculations.wdo_turnaround_and_form_compliance"
      - "increments WdoReport.version by 1"

  - method: POST
    path: "/wdo-reports/{id}/amend"
    description: "ISSUED -> AMENDED within 30 days of issuance. Increments amendment_count and records the reason code."
    roles: [ComplianceOfficer]
    code: 200
    input: [amendment_reason_code]
    output: WdoReport
    side_effects: ["WdoReport.status = AMENDED; amendment_count += 1; amendment_reason_code recorded", "increments WdoReport.version by 1"]

  # --- DamageClaim ----------------------------------------------------------
  - method: POST
    path: "/damage-claims"
    description: >-
      Files a claim against an ACTIVE bond. OCC-guarded on the bond per §1.2.1 so a claim can never
      be filed against a bond whose money ledger or status the client has not observed.
    roles: [PropertyOwner]
    code: 201
    input: [bond_id, claim_type, claimed_damage_usd, expected_bond_version]
    output: DamageClaim
    side_effects:
      - "DamageClaim.status = SUBMITTED; reported_at = logical clock instant"
      - "increments Bond.version by 1"

  - method: GET
    path: "/damage-claims/{id}"
    description: "Reads one claim with its exclusion basis and money breakdown."
    roles: [ComplianceOfficer, BranchManager, ClaimsAdjudicator, FieldInspector, PropertyOwner]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: GET
    path: "/damage-claims"
    description: >-
      Lists claims. Reverse-reachability for DamageClaim.bond_id and
      DamageClaim.verifying_inspection_id.
    roles: [ComplianceOfficer, BranchManager, ClaimsAdjudicator, FieldInspector, PropertyOwner]
    code: 200
    input: ["bond_id?", "verifying_inspection_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []

  - method: POST
    path: "/damage-claims/{id}/attach-verification"
    description: >-
      SUBMITTED -> UNDER_ADJUDICATION. Attaches a verifying graph, selects the exclusion basis from
      that graph's lineage, prices the eligible damage, deductible and projected payout, and
      reserves the payout against the bond's repair cap.
    roles: [FieldInspector]
    code: 200
    input: [verifying_inspection_id]
    output: DamageClaim
    side_effects:
      - "DamageClaim.status = UNDER_ADJUDICATION; verifying_inspection_id set"
      - "computes exclusion_basis / excluded_pre_existing_usd / eligible_damage_usd via calculations.claim_exclusion_and_eligibility"
      - "computes deductible_usd / projected_payout_usd via calculations.claim_payout_waterfall"
      - "Bond.reserved_claim_amount_usd += projected_payout_usd and Bond.remaining_repair_cap_usd -= the same amount (Bond.version += 1)"
      - "increments DamageClaim.version by 1"

  - method: POST
    path: "/damage-claims/{id}/adjudicate"
    description: >-
      UNDER_ADJUDICATION -> APPROVED_REPAIR | APPROVED_RETREAT_ONLY | DENIED. The acting X-User-ID
      must differ from the bond's issued_by_user_id. Each branch settles the reserve differently.
    roles: [ClaimsAdjudicator]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: DamageClaim
    side_effects:
      - "APPROVE_REPAIR: approved_payout_usd = projected_payout_usd; Bond.reserved_claim_amount_usd -= it and Bond.claims_paid_to_date_usd += it"
      - "APPROVE_RETREAT_ONLY: approved_payout_usd = 0.00; the reserve is released back into Bond.remaining_repair_cap_usd; Bond.retreat_credit_count += 1 and Bond.retreat_required = true"
      - "DENY: approved_payout_usd = 0.00; the reserve is released back into Bond.remaining_repair_cap_usd; denial_reason_code recorded"
      - "adjudicated_by_user_id = X-User-ID; increments DamageClaim.version and Bond.version by 1"

  - method: POST
    path: "/damage-claims/{id}/withdraw"
    description: >-
      SUBMITTED -> WITHDRAWN or UNDER_ADJUDICATION -> WITHDRAWN by the property owner. Withdrawing
      an under-adjudication claim releases exactly the amount it reserved, with no drift.
    roles: [PropertyOwner]
    code: 200
    input: []
    output: DamageClaim
    side_effects:
      - "DamageClaim.status = WITHDRAWN"
      - "from UNDER_ADJUDICATION only: Bond.reserved_claim_amount_usd -= projected_payout_usd and Bond.remaining_repair_cap_usd += the same amount (Bond.version += 1)"
      - "increments DamageClaim.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
#
# Every code below is triggerable by at least one endpoint in §1.5 and is
# named by at least one rule in §1.4 or one precondition in §1.2.
# ---------------------------------------------------------------------------

errors:
  # --- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting FieldInspector / Applicator is not the inspector_id or applicator_id of the resource, or acting PropertyOwner is not the property the resource belongs to"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "adjudicating X-User-ID equals Bond.issued_by_user_id"

  # --- not found -----------------------------------------------------------
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no Property with the given id, in path or body"
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "no Inspector with the given id, in path or body"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection with the given id, in path or body (including supersedes_inspection_id, verifying_inspection_id, reinstatement_inspection_id)"
  - id: ERR_TREATMENT_PLAN_NOT_FOUND
    http: 404
    condition: "no TreatmentPlan with the given id, in path or body"
  - id: ERR_BOND_NOT_FOUND
    http: 404
    condition: "no Bond with the given id, in path or body"
  - id: ERR_BOND_RENEWAL_NOT_FOUND
    http: 404
    condition: "no BondRenewal with the given id"
  - id: ERR_WDO_REPORT_NOT_FOUND
    http: 404
    condition: "no WdoReport with the given id"
  - id: ERR_BAIT_STATION_NOT_FOUND
    http: 404
    condition: "no BaitStation with the given id"
  - id: ERR_DAMAGE_CLAIM_NOT_FOUND
    http: 404
    condition: "no DamageClaim with the given id"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong JSON type, undeclared enum member, malformed date / instant / pattern, or out-of-range numeric"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset < 0"
  - id: ERR_FIELD_COMBINATION_INVALID
    http: 422
    condition: "a conditionally-required field is absent or a conditionally-forbidden field is present (closing_date, supersedes_inspection_id, conducive_code, damage_estimate_usd, pre_existing, scheduled interval ordering)"

  # --- concurrency ---------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_treatment_plan_version != TreatmentPlan.version, or expected_bond_version != Bond.version (§1.2.1)"

  # --- state ---------------------------------------------------------------
  - id: ERR_INVALID_INSPECTOR_STATE
    http: 409
    condition: "requested licence transition is not declared from the inspector's current status"
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "inspection is not DRAFT when adding findings or completing the graph, or is SUPERSEDED when consumed"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "plan is not PROPOSED when approving, not APPROVED when recording an application, completing or abandoning"
  - id: ERR_INVALID_BOND_STATE
    http: 409
    condition: "bond is not ACTIVE when renewing, not LAPSED when reinstating, or already TERMINATED"
  - id: ERR_INVALID_RENEWAL_STATE
    http: 409
    condition: "renewal is not PENDING when completing"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "report is not DRAFT or AMENDED when issuing, not ISSUED when amending, or already VOID"
  - id: ERR_INVALID_STATION_STATE
    http: 409
    condition: "station is REMOVED when a service is recorded"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "claim is not SUBMITTED when attaching verification, not UNDER_ADJUDICATION when adjudicating, or already terminal when withdrawing"

  # --- business_safety -----------------------------------------------------
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 409
    condition: "acting inspector's or applicator's Inspector.status is SUSPENDED or EXPIRED"
  - id: ERR_LICENSE_EXPIRED
    http: 409
    condition: "Inspector.license_expires_on is strictly before the logical clock UTC date"
  - id: ERR_LICENSE_REINSTATEMENT_UNMET
    http: 422
    condition: >-
      EXPIRED -> ACTIVE licence reinstatement without a license_expires_on strictly after the
      logical clock date, or with fewer than CE_CREDITS_REQUIRED (8) effective ce_credits
  - id: ERR_LICENSE_STATE_MISMATCH
    http: 422
    condition: "Inspector.license_state != Property.state_code for the structure being inspected or treated"
  - id: ERR_FORM_CODE_MISMATCH
    http: 422
    condition: "WdoReport.form_code is not STATE_FORM_MAP[state_code]"
  - id: ERR_CATEGORY_NOT_LICENSED
    http: 422
    condition: "acting inspector lacks the WDO_INSPECTOR, TERMITE_APPLICATOR or FUMIGATION_CERTIFIED endorsement the operation requires"
  - id: ERR_VERIFIER_IS_APPLICATOR
    http: 422
    condition: "verifying inspection's inspector_id equals the bonded plan's applicator_id"
  - id: ERR_RETENTION_LOCK_ACTIVE
    http: 409
    condition: "plan abandonment attempted while a PesticideRecord of the plan has retention_until >= the logical clock UTC date"

  # --- business_referential ------------------------------------------------
  - id: ERR_INSPECTION_NOT_GRAPHED
    http: 409
    condition: "a consumed inspection is DRAFT or SUPERSEDED rather than GRAPHED"
  - id: ERR_INSPECTION_PURPOSE_MISMATCH
    http: 422
    condition: "consumed inspection's purpose is not the one the consumer requires (INITIAL / RENEWAL / REINSTATEMENT / REAL_ESTATE)"
  - id: ERR_PLAN_NOT_COMPLETED
    http: 409
    condition: "bond issuance against a plan that is not COMPLETED"
  - id: ERR_METHOD_NOT_PERMITTED
    http: 422
    condition: "plan method is not in METHOD_BY_CONSTRUCTION[Property.construction_type] (CRAWLSPACE + FUMIGATION, BASEMENT + LIQUID_BARRIER)"
  - id: ERR_PROPERTY_MISMATCH
    http: 422
    condition: "two referenced rows do not belong to the same Property"
  - id: ERR_BOND_NOT_ACTIVE
    http: 409
    condition: "damage claim filed against a LAPSED or TERMINATED bond"

  # --- business_constraint -------------------------------------------------
  - id: ERR_DUPLICATE_ACTIVE_BOND
    http: 409
    condition: "the property already has a Bond in status ACTIVE or LAPSED"
  - id: ERR_GRAPH_INCOMPLETE
    http: 422
    condition: "graph-complete on a DRAFT inspection with zero findings and no_findings_attested not set true"
  - id: ERR_DUPLICATE_GRID_FINDING
    http: 409
    condition: "the (grid_ref, finding_type) pair already exists on this inspection"
  - id: ERR_PRODUCT_METHOD_INCOMPATIBLE
    http: 422
    condition: "chemical_product_code is not in PRODUCT_BY_METHOD[method]"
  - id: ERR_CLAIM_ALREADY_RESERVED
    http: 409
    condition: "the bond already has a DamageClaim in status UNDER_ADJUDICATION"
  - id: ERR_TIER_EXCLUDES_REPAIR
    http: 422
    condition: "decision APPROVE_REPAIR on a RETREAT_ONLY bond"
  - id: ERR_RENEWAL_ALREADY_PENDING
    http: 409
    condition: "the bond already has a BondRenewal in status PENDING"

  # --- business_temporal ---------------------------------------------------
  - id: ERR_INSPECTOR_SCHEDULE_OVERLAP
    http: 409
    condition: "the inspector's requested [scheduled_start_at, scheduled_end_at) overlaps another of that inspector's inspections"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "the logical clock date is before current_term_end - 60 days or after current_term_end + 30 days"
  - id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http: 409
    condition: "the logical clock date is after lapse_date + 90 days"
  - id: ERR_REINSTATEMENT_INSPECTION_STALE
    http: 422
    condition: "the reinstatement graph was completed more than 30 days before the logical clock instant"
  - id: ERR_APPLICATION_BEFORE_PERMIT_WINDOW
    http: 422
    condition: "a FUMIGATION application is recorded before TreatmentPlan.fumigation_start_at"
  - id: ERR_SERVICE_TIME_INVALID
    http: 422
    condition: "the logical clock instant is not strictly after BaitStation.last_serviced_at"
  - id: ERR_CLOSING_LEAD_TIME_MISSED
    http: 409
    condition: "issuance would land later than closing_date 00:00:00Z minus 24 hours"
  - id: ERR_AMENDMENT_WINDOW_CLOSED
    http: 409
    condition: "amendment attempted more than 30 days after WdoReport.issued_at"
  - id: ERR_DAMAGE_OUTSIDE_TERM
    http: 422
    condition: "the logical clock date is outside [Bond.current_term_start, Bond.current_term_end] when the claim is filed"

  # --- business_fiscal -----------------------------------------------------
  - id: ERR_PAYMENT_INSUFFICIENT
    http: 402
    condition: "renewal amount_usd is less than the FINAL_AT_COMPLETION invoice_total_usd"
  - id: ERR_REINSTATEMENT_PAYMENT_INSUFFICIENT
    http: 402
    condition: "reinstatement amount_usd is less than reinstatement_total_usd"
  - id: ERR_REPAIR_CAP_EXHAUSTED
    http: 409
    condition: "Bond.remaining_repair_cap_usd is 0.00 or less when a claim verification is attached"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: ComplianceOfficer
    description: >-
      State-compliance operator. Owns the registry (properties, inspectors, licence status), the
      statutory WDO filing surface, the bond term-review sweep and the logical clock.
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /properties"
      - "POST /inspectors"
      - "POST /inspectors/{id}/license-status"
      - "POST /bonds/{id}/term-review"
      - "POST /wdo-reports/{id}/issue"
      - "POST /wdo-reports/{id}/amend"
    shared_operations:
      - "POST /wdo-reports (with PropertyOwner)"
      - "all GET reads"

  - name: BranchManager
    description: >-
      Underwriting and plan-authorisation operator. Proposes and approves treatment plans, abandons
      approved plans, issues bonds, opens and completes renewals, and reinstates lapsed bonds.
    identity: opaque
    exclusive_operations:
      - "POST /treatment-plans"
      - "POST /treatment-plans/{id}/approve"
      - "POST /treatment-plans/{id}/abandon"
      - "POST /bonds"
      - "POST /bonds/{id}/renewals"
      - "POST /bond-renewals/{id}/complete"
      - "POST /bonds/{id}/reinstate"
    shared_operations:
      - "all GET reads"

  - name: FieldInspector
    description: >-
      Licensed WDO inspector. Opens and signs graphs, notates graph cells, services bait stations
      and attaches the verifying graph to a damage claim.
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/findings"
      - "POST /inspections/{id}/graph-complete"
      - "POST /bait-stations/{id}/services"
      - "POST /damage-claims/{id}/attach-verification"
    shared_operations:
      - "all GET reads"

  - name: Applicator
    description: >-
      Licensed pesticide applicator. Records applications against approved plans and closes plans
      out as completed.
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /treatment-plans/{id}/applications"
      - "POST /treatment-plans/{id}/complete"
    shared_operations:
      - "all GET reads"

  - name: ClaimsAdjudicator
    description: >-
      Claims decision-maker. Adjudicates verified claims into repair, retreat-only or denial. Bound
      by segregation of duties against the bond's issuing operator id.
    identity: opaque
    exclusive_operations:
      - "POST /damage-claims/{id}/adjudicate"
    shared_operations:
      - "all GET reads"

  - name: PropertyOwner
    description: >-
      The bonded homeowner. Requests statutory WDO reports, files damage claims against their own
      bond and withdraws them.
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST /damage-claims"
      - "POST /damage-claims/{id}/withdraw"
    shared_operations:
      - "POST /wdo-reports (with ComplianceOfficer)"
      - "all GET reads"
