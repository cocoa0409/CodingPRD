              payload: { plan_name: "Umberwood 401(k)", plan_sponsor_name: "Umberwood Ceramics", erisa_covered: true, participant_account_count: 200, menu_slot_capacity: 5, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
