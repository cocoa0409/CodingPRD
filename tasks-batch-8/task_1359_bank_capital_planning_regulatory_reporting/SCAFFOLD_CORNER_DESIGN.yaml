        distinguishing_aspect: "Stress loss includes only exposures whose ReportingPeriod.status in {OPEN, FILING_DUE}; exposures in CLOSED periods excluded."
        test_recipe:
          setup: ["Bank with two periods P1 (CLOSED after accept) and P2 (OPEN); P1 has 50e9 CORPORATE exposure, P2 has 100e9 CORPORATE exposure"]
