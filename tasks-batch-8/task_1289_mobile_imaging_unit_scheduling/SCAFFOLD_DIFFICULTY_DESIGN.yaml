            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd1}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg1: $.data.id } }
            - { call: "POST /api/site-days/${sd1}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg1}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd1}/begin-setup", payload: {}, as: OperationsDirector }
