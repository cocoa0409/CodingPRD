            - call: "GET /licensing/agreements/${a6_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /licensing/plantings/${p6_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /licensing/plant-lots/${l6_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g6_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 100, cultural_practice_codes: ["ORGANIC"], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g6_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "Grower.${g6_id}.status == EXITED"
            - "GrowerAgreement.${a6_id}.status == TERMINATED (link 1)"
            - "Planting.${p6_id}.status == CANCELLED (link 2 — caused by the termination, not by the exit directly)"
            - "PlantLot.${l6_id}: plants_reserved == 0, plants_available == 500 (link 3 — reservation released by the cancellation), status stays SHIPPED"
            - "the exited grower cannot re-engage: new agreement fails 409 ERR_GROWER_NOT_ACTIVE"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispute_state_gate_beats_temporal_gate
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_STATEMENT_NOT_DISPUTABLE
          - errors.ERR_DISPUTE_WINDOW_EXPIRED
        distinguishing_aspect: |
          Pair {state vs business_temporal}: disputing a FINAL statement after the dispute
          deadline fails BOTH gates; the state gate (priority 7) is checked first, so the error
          is 409 ERR_STATEMENT_NOT_DISPUTED-able (ERR_STATEMENT_NOT_DISPUTABLE), never the
          temporal 422 ERR_DISPUTE_WINDOW_EXPIRED that the same request would produce on an
          ISSUED statement.
        test_recipe:
          setup:
            - "Canonical pool through settle; G1 statement ISSUED (issued_at 2026-10-12T00:00:00Z, deadline 2026-10-26T00:00:00Z), disputed once and resolved UPHOLD -> FINAL; logical clock then advanced to 2026-10-27T00:00:01Z (past the deadline)."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g1
            - *k_a1
            - *k_a1_dec
            - *k_l1
            - *k_w1
            - *k_p1
            - *k_clock_aug
            - *k_p1_conf
            - *k_clock_h1a
            - *k_h1
            - *k_clock_h1b
            - *k_h1_recv
            - *k_h1_grade
            - *k_h1_cert
            - *k_p1_get3
            - *k_clock_h2a
            - *k_h2
            - *k_clock_h2b
            - *k_h2_recv
            - *k_h2_grade
            - *k_h2_cert
            - *k_g2
            - *k_a2
            - *k_a2_dec
            - *k_l2
            - *k_p2
            - *k_p2_conf
            - *k_clock_h3a
            - *k_h3
            - *k_clock_h3b
            - *k_h3_recv
            - *k_h3_grade
            - *k_h3_cert
            - *k_pool
            - *k_clock_close
            - *k_close
            - *k_stmt_g1_pre
            - *k_settle
          trigger:
            - call: "POST /licensing/settlement-statements/${s_g1}/dispute"
              payload: { reason: "audit dispute" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
            - call: "POST /licensing/settlement-statements/${s_g1}/resolve"
              payload: { resolution: "UPHOLD" }
              as: SettlementOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-27T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /licensing/settlement-statements/${s_g1}/dispute"
              payload: { reason: "late dispute" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the late dispute on the FINAL statement returns 409 with error_id == ERR_STATEMENT_NOT_DISPUTABLE"
            - "error_id != ERR_DISPUTE_WINDOW_EXPIRED, although the temporal gate (2026-10-27 > 2026-10-26 deadline) also fails — priority 7 state beats priority 10 temporal"
            - "SettlementStatement.${s_g1}.status stays FINAL, dispute_count stays 1"

      - name: confirm_state_gate_beats_quota_gate
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - errors.ERR_PLANTING_QUOTA_EXCEEDED
        distinguishing_aspect: |
          Pair {state vs business_constraint} — a different category pair than the dispute
          instance: confirming 150 plants under a SUSPENDED agreement whose max is 100 fails
          both the state gate and the quota gate; the state gate (priority 7) wins, producing
          409 ERR_AGREEMENT_NOT_ACTIVE, never ERR_PLANTING_QUOTA_EXCEEDED.
        test_recipe:
          setup:
            - "V1 RELEASED; grower G7 with agreement A7 (max_planting_units 100) APPROVED then SUSPENDED via grower suspend; lot L7 of 500 plants; planting P7 planned 150 (creation does not check the quota — only confirm does)."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - &k_g7
              call: "POST /licensing/growers"
              payload: { legal_name: "Half Moon Bay Fruit", region_code: "CA-SALINAS" }
              as: PlatformAdmin
              captures: { g7_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g7_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 100, cultural_practice_codes: ["CONVENTIONAL"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g7_id}"
              captures: { a7_id: $.data.id }
            - call: "POST /licensing/agreements/${a7_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { a7_v: $.data.version }
            - call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-CA-01", agreement_id: "${a7_id}", variety_id: "${v1_id}", quantity_plants: 500 }
              as: NurseryManager
              captures: { l7_id: $.data.id }
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${a7_id}", plant_lot_id: "${l7_id}", planned_plants: 150, expected_agreement_version: "${a7_v}" }
              as: GrowerPrincipal
              as_user_id: "${g7_id}"
              captures: { p7_id: $.data.id }
            - call: "POST /licensing/growers/${g7_id}/suspend"
              payload: { reason: "audit hold" }
              as: ComplianceOfficer
            - *k_clock_aug
          trigger:
            - call: "POST /licensing/plantings/${p7_id}/confirm"
              payload: { plants_planted_actual: 150, planted_on: "2026-08-01T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g7_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the confirm returns 409 with error_id == ERR_AGREEMENT_NOT_ACTIVE (state gate, priority 7)"
            - "error_id != ERR_PLANTING_QUOTA_EXCEEDED, although 150 > 100 violates the quota gate (priority 11) at the same time"
            - "Planting.${p7_id}.status stays PLANNED; agreement.units_planted stays 0"

  - rule_id: boundary_precision_check
    instances:
      - name: grade_brix_boundary_exactly_11_0
        grounds:
          - calculations.grade_determination
          - entities.HarvestLot.fields.grade
        distinguishing_aspect: |
          Grade-metric boundary on POST grade: brix exactly 11.0 (with firmness 350, appearance
          85, defect 3.0 — all exactly at their PREMIUM bounds) grades PREMIUM because every
          band bound is inclusive (>= / <=); brix 10.9 with identical other scores grades
          STANDARD. One decimal digit flips the pack designation.
        test_recipe:
          setup:
            - "Canonical G1 chain: H1 and H2 both received and ungraded."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g1
            - *k_a1
            - *k_a1_dec
            - *k_l1
            - *k_w1
            - *k_p1
            - *k_clock_aug
            - *k_p1_conf
            - *k_clock_h1a
            - *k_h1
            - *k_clock_h1b
            - *k_h1_recv
            - *k_p1_get3
            - *k_clock_h2a
            - *k_h2
            - *k_clock_h2b
            - *k_h2_recv
          trigger:
            - call: "POST /licensing/harvest-lots/${h1_id}/grade"
              payload: { flavor_brix: 11.0, firmness_g: 350, appearance_score: 85, defect_pct: 3.0 }
              as: QualityGrader
              as_user_id: "qg-1"
            - call: "POST /licensing/harvest-lots/${h2_id}/grade"
              payload: { flavor_brix: 10.9, firmness_g: 350, appearance_score: 85, defect_pct: 3.0 }
              as: QualityGrader
              as_user_id: "qg-1"
          assert:
            - "HarvestLot.${h1_id}.grade == PREMIUM and pack_designation == PREMIUM — all four inclusive bounds met exactly"
            - "HarvestLot.${h2_id}.grade == STANDARD — brix 10.9 < 11.0 drops a band despite firmness/appearance/defect sitting exactly at PREMIUM bounds"
            - "grade boundary is on the raw submitted score, not a rounded value"

      - name: precool_boundary_exactly_8h
        grounds:
          - calculations.cold_chain_evaluation
          - entities.HarvestLot.fields.precool_hours
          - entities.HarvestLot.fields.cold_chain_compliant
        distinguishing_aspect: |
          Time-metric boundary on POST receive (a different metric and endpoint than the grade
          boundary): exactly 8h00m between harvest and receipt yields precool_hours 8.00 and
          cold_chain_compliant == true (inclusive <=); 8h01m yields 8.02 and false — a one-minute
          difference flips cold-chain compliance and with it the 8 percent settlement deduction.
        test_recipe:
          setup:
            - "Canonical G1 chain through P1 confirmed; no harvest lots yet."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g1
            - *k_a1
            - *k_a1_dec
            - *k_l1
            - *k_w1
            - *k_p1
            - *k_clock_aug
            - *k_p1_conf
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T04:30:00Z" }
              as: PlatformAdmin
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-10-06T04:00:00Z", gross_weight_kg: 1100, tare_weight_kg: 100, expected_planting_version: "${p1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { ha_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /licensing/harvest-lots/${ha_id}/receive"
              payload: { received_at: "2026-10-06T12:00:00Z", pulp_temp_c_at_receipt: 3.0 }
              as: CoolingOperator
              as_user_id: "co-1"
            - call: "GET /licensing/plantings/${p1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p1_v_after_ha: $.data.version }
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-10-06T04:00:00Z", gross_weight_kg: 1100, tare_weight_kg: 100, expected_planting_version: "${p1_v_after_ha}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { hb_id: $.data.id }
            - call: "POST /licensing/harvest-lots/${hb_id}/receive"
              payload: { received_at: "2026-10-06T12:01:00Z", pulp_temp_c_at_receipt: 3.0 }
              as: CoolingOperator
              as_user_id: "co-1"
          assert:
            - "HarvestLot.${ha_id}: precool_hours == 8.0 and cold_chain_compliant == true — the 8.0h bound is inclusive"
            - "HarvestLot.${hb_id}: precool_hours == 8.02 and cold_chain_compliant == false — one minute past the boundary breaches"
            - "both lots have identical pulp_temp_c_at_receipt 3.0, so the compliance difference is decided purely on the precool-hours axis"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_decide_requires_active_grower
        grounds:
          - state_machines.GrowerAgreement.PENDING_REVIEW_to_ACTIVE
          - state_machines.Grower.ACTIVE_to_SUSPENDED
          - errors.ERR_GROWER_NOT_ACTIVE
        distinguishing_aspect: |
          Grower -> Agreement pair: deciding APPROVE on a PENDING_REVIEW agreement is gated on
          the GROWER's state, not the agreement's — a suspended grower's pending agreement cannot
          be approved (the suspend cascade deliberately touches only ACTIVE agreements, leaving
          PENDING_REVIEW ones stuck).
        test_recipe:
          setup:
            - "V1 RELEASED; grower G8 ACTIVE; agreement A8 created (PENDING_REVIEW); G8 then SUSPENDED (A8 untouched by the cascade because it is not ACTIVE)."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - &k_g8
              call: "POST /licensing/growers"
              payload: { legal_name: "San Juan Bautista Growers", region_code: "CA-SALINAS" }
              as: PlatformAdmin
              captures: { g8_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g8_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 5000, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g8_id}"
              captures: { a8_id: $.data.id }
            - call: "POST /licensing/growers/${g8_id}/suspend"
              payload: { reason: "compliance investigation" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /licensing/agreements/${a8_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
            - call: "GET /licensing/agreements/${a8_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "decide returns 409 with error_id == ERR_GROWER_NOT_ACTIVE — the grower's state gates the agreement's transition"
            - "GrowerAgreement.${a8_id}.status stays PENDING_REVIEW"
            - "decide REJECT would still succeed from PENDING_REVIEW (rejection is not gated on grower state) — not exercised here"

      - name: pool_close_requires_certified_lots
        grounds:
          - state_machines.PoolPeriod.OPEN_to_CLOSED
          - errors.ERR_POOL_HAS_UNGRADED_LOTS
        distinguishing_aspect: |
          HarvestLot -> PoolPeriod pair (a different entity pair than Grower -> Agreement): the
          pool's OPEN -> CLOSED transition is gated on the grading state of every in-window
          harvest lot — a single RECEIVED-but-UNGRADED lot blocks the close.
        test_recipe:
          setup:
            - "Canonical G1 chain through H1 received 2026-10-06 (inside the pool window) but never graded."
            - "Pool STRAWBERRY [2026-10-05, 2026-10-12) created; logical clock 2026-10-12."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g1
            - *k_a1
            - *k_a1_dec
            - *k_l1
            - *k_w1
            - *k_p1
            - *k_clock_aug
            - *k_p1_conf
            - *k_clock_h1a
            - *k_h1
            - *k_clock_h1b
            - *k_h1_recv
            - call: "POST /licensing/pool-periods"
              payload: { berry_type: "STRAWBERRY", week_start: "2026-10-05T00:00:00Z", week_end: "2026-10-12T00:00:00Z", is_shoulder_week: false }
              as: SettlementOfficer
              captures: { poolx_id: $.data.id }
            - *k_clock_close
          trigger:
            - call: "POST /licensing/pool-periods/${poolx_id}/close"
              payload: { estimated_price_cents_per_kg: 500 }
              as: SettlementOfficer
              captures: { error_id: $.data.error_id }
            - call: "GET /licensing/pool-periods/${poolx_id}"
              payload: {}
              as: SettlementOfficer
          assert:
            - "close returns 409 with error_id == ERR_POOL_HAS_UNGRADED_LOTS — the child lot's grade_status (UNGRADED) gates the pool's transition"
            - "PoolPeriod.${poolx_id}.status stays OPEN; no statements are created"
            - "once H1 were certified (or REJECTED) the same close would succeed — the gate is on collective child state, not on the pool itself"

  - rule_id: resource_temporal_overlap
    instances:
      - name: harvest_window_half_open_overlap
        grounds:
          - validations[priority=10]
          - errors.ERR_HARVEST_WINDOW_OVERLAP
          - entities.HarvestWindow
        distinguishing_aspect: |
          HarvestWindow uses HALF-OPEN [week_start, week_end) interval semantics on resource
          (region_code, variety_id): a successor window starting exactly at the previous window's
          week_end is legal adjacency, while a one-day-earlier start overlaps and is rejected.
        test_recipe:
          setup:
            - "V1 RELEASED; window WA [2026-09-28, 2026-10-05) exists for (CA-SALINAS, V1)."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-09-28T00:00:00Z", week_end: "2026-10-05T00:00:00Z", target_volume_kg: 10000 }
              as: PlatformAdmin
              captures: { wa_id: $.data.id }
          trigger:
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-10-05T00:00:00Z", week_end: "2026-10-12T00:00:00Z", target_volume_kg: 10000 }
              as: PlatformAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-10-04T00:00:00Z", week_end: "2026-10-11T00:00:00Z", target_volume_kg: 5000 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "WB [2026-10-05, 2026-10-12) is accepted (201): week_start == WA.week_end is pure adjacency and does not overlap a half-open interval"
            - "WC [2026-10-04, 2026-10-11) is rejected 422 ERR_HARVEST_WINDOW_OVERLAP: it shares the instant 2026-10-04..05 with WA and 2026-10-05..11 with WB"
            - "overlap is scoped per (region_code, variety_id) — a window for a different region or variety in the same weeks would pass (not exercised here)"

      - name: agreement_window_closed_overlap
        grounds:
          - validations[priority=10]
          - errors.ERR_AGREEMENT_WINDOW_OVERLAP
          - entities.GrowerAgreement
        distinguishing_aspect: |
          GrowerAgreement uses CLOSED [effective_from, effective_to] interval semantics on
          resource (grower_id, variety_id) — the OPPOSITE adjacency rule from harvest windows:
          sharing the boundary day 2026-12-31 IS an overlap, and only starting the day after
          (2027-01-01) is legal.
        test_recipe:
          setup:
            - "V1 RELEASED; grower G9 ACTIVE; agreement A91 effective [2026-01-01, 2026-12-31] exists (PENDING_REVIEW counts as occupying the interval)."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - &k_g9
              call: "POST /licensing/growers"
              payload: { legal_name: "Watsonville Coast Produce", region_code: "CA-SALINAS" }
              as: PlatformAdmin
              captures: { g9_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g9_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 1000, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g9_id}"
              captures: { a91_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g9_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 500, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-12-31T00:00:00Z", effective_to: "2027-06-30T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g9_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g9_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 500, cultural_practice_codes: ["ORGANIC"], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g9_id}"
              captures: { a93_id: $.data.id }
          assert:
            - "A92 starting 2026-12-31 is rejected 422 ERR_AGREEMENT_WINDOW_OVERLAP: closed intervals share the boundary day"
            - "A93 starting 2027-01-01 is accepted (201): the day AFTER the boundary is free under closed-interval semantics"
            - "contrast with harvest_window_half_open_overlap: same geometric question, opposite answer — the two rules differ in interval semantics per Rule 8"

  - rule_id: compensating_invariant
    instances:
      - name: plant_lot_quantity_conservation
        grounds:
          - entities.PlantLot.fields.plants_available
          - state_machines.Planting.PLANNED_to_CANCELLED
          - state_machines.Planting.PLANNED_to_PLANTED
        distinguishing_aspect: |
          Conserved quantity: per-lot plant accounting. For every PlantLot and at every step,
          plants_reserved + plants_planted + plants_destroyed + plants_available ==
          quantity_plants. The forward action (planting create reserves 400) paired with its
          compensating action (grower exit cancels the planting, releasing the reservation)
          returns every counter to its original value — no drift.
