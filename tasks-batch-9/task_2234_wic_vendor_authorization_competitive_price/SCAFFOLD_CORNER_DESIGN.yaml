          A CLASS_D case on a vendor with no adjudicated claims prices the CMP off
          reported_monthly_redemption_cents: 300000 == round_half_up(6000000 * 0.05 * 1).
          A payment of 299999 is refused with ERR_CMP_UNDERPAID and leaves cmp_paid_cents
          at 0; exactly 300000 closes the case and only then are the case's sanction
          points added to the vendor.
