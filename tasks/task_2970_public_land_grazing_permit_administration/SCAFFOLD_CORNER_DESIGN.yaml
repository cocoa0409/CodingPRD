            - "fourth call: HTTP 200 with actual_aums \"150.00\" and record_status \"ACTUAL_REPORTED\""
            - "fifth call: HTTP 200 whose response body reads aoi_status \"BILLED\" — NOT \"USE_REPORTED\"; both declared hops (ISSUED -> USE_REPORTED -> BILLED) ran inside this single request, and actual_aums_total \"150.00\" is already on the same response"
