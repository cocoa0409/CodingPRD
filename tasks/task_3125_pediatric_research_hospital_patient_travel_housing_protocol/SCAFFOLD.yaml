    output: "ProtocolMilestone[]"
    side_effects: []
  - method: GET
    path: "/programs/enrollments/{id}/survivorship-enrollments"
    description: "List survivorship study enrollments for this patient"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "SurvivorshipEnrollment[]"
    side_effects: []
  - method: GET
    path: "/programs/enrollments/{id}/sibling-services"
    description: "List sibling support services for this household"
    roles: [Any]
    code: 200
    input: ["service_type?", "status?"]
    output: "SiblingSupportService[]"
    side_effects: []
  - method: POST
    path: "/programs/enrollments/{id}/sibling-services"
