        distinguishing_aspect: |
          The withdraw cascade is scoped by child state, not by child type: the
          FILED appeal is dismissed and the four COMPUTED DimensionScore rows go
          STALE, while the correction that was already REJECTED must be left
          exactly as it is - same status, same decided_at, same version. An
          implementation that sweeps all children unconditionally would restamp
          a terminal row and would also have to invent a decision for it.
