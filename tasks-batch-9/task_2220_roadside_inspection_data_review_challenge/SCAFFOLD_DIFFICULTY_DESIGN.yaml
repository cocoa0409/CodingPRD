          - entities.Carrier.fields.safety_fitness_status
          - entities.CorrectiveActionPlan.fields.triggering_fitness_status
          - concurrency_rules[cap-create-stale-carrier]
        distinguishing_aspect: |
          The gating entity is the Carrier's safety-fitness dimension: a CAP create against an UNRATED
          carrier fails with ERR_CAP_NOT_REQUIRED, and the identical create succeeds after the auditor
          records a CONDITIONAL determination, stamping triggering_fitness_status CONDITIONAL - and the
          second attempt must present the carrier version observed after the determination, because the
          determination itself bumped Carrier.version.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 created with the default safety_fitness_status UNRATED; its current version has been read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "GET /carriers/${c1_id}"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_v0: $.data.version }
          trigger:
            - call: "POST /corrective-action-plans"
              payload: { carrier_id: "${c1_id}", expected_carrier_version: "${c1_v0}", narrative: "Voluntary remediation plan." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /carriers/${c1_id}/fitness-determination"
              payload: { determination: "CONDITIONAL", basis_note: "Compliance review found acute violations." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "GET /carriers/${c1_id}"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_v1: $.data.version }
            - call: "POST /corrective-action-plans"
              payload: { carrier_id: "${c1_id}", expected_carrier_version: "${c1_v1}", narrative: "Remediation plan for the conditional rating." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { cap_id: $.data.id }
          assert:
            - "after trigger[0]: HTTP status == 422"
            - "after trigger[0]: error_id == ERR_CAP_NOT_REQUIRED"
            - "after trigger[0]: Carrier.${c1_id}.safety_fitness_status == UNRATED"
            - "after trigger[0]: GET /corrective-action-plans?carrier_id=${c1_id} returns 0 rows"
            - "after trigger[1]: Carrier.${c1_id}.safety_fitness_status == CONDITIONAL"
            - "after trigger[1]: Carrier.${c1_id}.fitness_determined_at == 2026-08-01T00:00:00Z"
            - "after trigger[1]: Carrier.${c1_id}.fitness_determined_by_user_id == auditor_alice"
            - "after trigger[3]: HTTP status == 201"
            - "after trigger[3]: CorrectiveActionPlan.${cap_id}.status == DRAFT"
            - "after trigger[3]: CorrectiveActionPlan.${cap_id}.triggering_fitness_status == CONDITIONAL"
            - "after trigger[3]: CorrectiveActionPlan.${cap_id}.item_count == 0"
            - "after trigger[3]: CorrectiveActionPlan.${cap_id}.completion_pct == 0.0"
            - "after trigger[3]: CorrectiveActionPlan.${cap_id}.superseded_cap_id == null"

  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_inspection_window_closed_interval_with_120_minute_buffer
        grounds:
          - validations[priority=22]
          - entities.InspectionReport.fields.vehicle_vin
          - entities.InspectionReport.fields.inspection_start
        distinguishing_aspect: |
          The contended resource is a vehicle (vehicle_vin) under a CLOSED interval with a
          DUPLICATE_BUFFER_MINUTES of 120 applied to the new report on both ends: against an existing
          [14:00, 15:00] inspection, a new start of 16:59 and a new start of exactly 17:00 are both
          rejected with ERR_DUPLICATE_INSPECTION_WINDOW (touching endpoints count), and only 17:01 is
          accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (MEDIUM)."
            - "One report on VIN 1FUJA6CK21LK00016 spanning 2026-07-01T14:00:00Z to 2026-07-01T15:00:00Z in status RECEIVED (non-RESCINDED, so it participates in the window check)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
