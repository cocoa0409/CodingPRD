              as: HotelVendorRep
              as_user_id: "${vend_w}"
              captures: { prop_w: $.data.id }
            - call: "POST /rfp-cycles/${cyc_y}/proposals"
              payload: { vendor_id: "${vend_y}", offered_room_count: 10, offered_rate_cents: 11000, quiet_room_commitment: 10 }
