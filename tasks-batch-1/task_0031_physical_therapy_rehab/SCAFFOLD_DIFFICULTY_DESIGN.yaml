scaffold_difficulty_design:

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 1 — dual_variant_calc
  # Two calcs on DIFFERENT entity domains where two valid approaches diverge.
  #   (A) Visit (cost-accounting): planned_units vs billable_units
  #   (B) MIPSQualityMeasure (risk-scoring): score under DRAFT-revision vs at SUBMIT
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: visit_planned_vs_billable_units_diverge_on_overrun
        grounds:
          - calculations.visit_planned_units
          - calculations.visit_billable_units
          - state_machines.Visit.SCHEDULED_to_COMPLETED
          - entities.Visit.fields.planned_units
          - entities.Visit.fields.billable_units
        distinguishing_aspect: |
          Visit cost-accounting entity: planned_units (forward-looking variant on
          planned_minutes=60 → 4 units) and billable_units (chronological variant
          on actual_minutes=30 → 2 units) produce DIFFERENT integers for the
          same Visit row — observable as planned_units != billable_units after
          completion.
        test_recipe:
          setup:
            - "1 MEDICARE Patient (any state), 1 Therapist (CA license, medicare_provider_enrolled=true), 1 ACTIVE PlanOfCare with an INITIAL Evaluation, 1 ACTIVE AuthorizationGrant under that POC (total_units_granted=20). 1 SCHEDULED Visit, planned_minutes=60, CPT_97110, scheduled today."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "Tessa CA", npi_number: "1000000010", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat A", date_of_birth: "1955-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 20, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-01T10:00:00Z", scheduled_end_utc: "2026-06-01T11:00:00Z", planned_minutes: 60, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /rehab/visits/${visit_id}/complete"
              payload: { actual_minutes: 30 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v_billable: $.data.billable_units, v_planned: $.data.planned_units }
          assert:
            - "Visit.${visit_id}.planned_units == 4"
            - "Visit.${visit_id}.billable_units == 2"
            - "Visit.${visit_id}.planned_units != Visit.${visit_id}.billable_units"

      - name: mips_score_diverges_between_revise_and_submit
        grounds:
          - calculations.mips_composite_score
          - state_machines.MIPSQualityMeasure.DRAFT_to_DRAFT
          - state_machines.MIPSQualityMeasure.DRAFT_to_SUBMITTED
          - entities.MIPSQualityMeasure.fields.composite_score
        distinguishing_aspect: |
          MIPSQualityMeasure risk-scoring entity: composite_score recomputed on
          DRAFT-revise (numerator_met=false → base 60 only = 60.00) diverges from
          composite_score on SUBMIT after numerator_met flipped to true (60 + 25
          = 85.00). Same row, two valid computation moments, different scores.
        test_recipe:
          setup:
            - "1 MEDICARE Patient, 1 Therapist medicare-enrolled. 1 ACTIVE PlanOfCare with INITIAL Eval. 1 DRAFT MIPSQualityMeasure (measure_code=MIPS128_FALL_RISK, numerator_met=false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "Tessa MIPS", npi_number: "1000000011", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat M", date_of_birth: "1955-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 50, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/mips-measures"
              payload: { patient_id: "${pt_id}", plan_of_care_id: "${poc_id}", reporting_therapist_id: "${th_id}", measure_code: "MIPS128_FALL_RISK", performance_period_start: "2026-06-01", performance_period_end: "2026-06-30", numerator_met: false }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { mips_id: $.data.id }
            - call: "POST /rehab/mips-measures/${mips_id}/revise"
              payload: { numerator_met: false }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { s_revise: $.data.composite_score }
          trigger:
            - call: "POST /rehab/mips-measures/${mips_id}/revise"
              payload: { numerator_met: true }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { s_revise_after: $.data.composite_score }
            - call: "POST /rehab/mips-measures/${mips_id}/submit"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { s_submit: $.data.composite_score }
          assert:
            - "MIPSQualityMeasure.${mips_id}.composite_score after first revise == 60.00"
            - "MIPSQualityMeasure.${mips_id}.composite_score after second revise == 85.00"
            - "MIPSQualityMeasure.${mips_id}.composite_score at SUBMITTED == 85.00"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 2 — combinatorial_formula
  # Two instances in DIFFERENT modes.
  #   (A) Mode (a): mips_composite_score — 3+ inputs (base, numerator, HEP count,
  #       evaluation improvement) with non-linear caps (min(10, …), min(15, …),
  #       min(100, raw)).
  #   (B) Mode (b): visit_billed_amount — nested rounding; round_half_up applied
  #       PER-UNIT (`reduced = round_half_up(rate * 0.5)`) THEN summed —
  #       different from "sum then round".
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: mips_composite_score_nonlinear_caps_mode_a
        grounds:
          - calculations.mips_composite_score
          - entities.HomeExerciseProgram
          - entities.Evaluation
        distinguishing_aspect: |
          Mode (a) — formula has 4 inputs (measure base, numerator_met,
          ACTIVE-HEP count over the performance window, max(0, latest_eval -
          initial_eval) improvement) with non-linear interaction via min() caps
          on each contribution. Pinned: MIPS128 (base 60) + numerator true (+25)
          + 2 ACTIVE HEPs prescribed within period (engagement=min(10, 2*3.5)=7)
          + initial functional_score 40, RE_EVAL functional_score 80
          (improvement=40, improvement_bonus=min(15, 40*0.5)=15) → raw=107 →
          min(100, 107)=100.00.
        test_recipe:
          setup:
            - "MEDICARE patient, Therapist medicare-enrolled. ACTIVE POC. INITIAL Eval (functional_score=40, 2026-06-01). RE_EVAL (functional_score=80, 2026-06-15). 2 ACTIVE HEPs prescribed 2026-06-05 and 2026-06-10. 1 DRAFT MIPS128 measure with numerator_met=true and performance_period 2026-06-01..2026-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Comb A", npi_number: "1000000020", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Comb A2", npi_number: "1000000021", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_b_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Comb A", date_of_birth: "1955-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/home-exercise-programs"
              payload: { plan_of_care_id: "${poc_id}", prescribed_by_therapist_id: "${th_id}", exercise_count: 5, weekly_frequency: 3, prescribed_on: "2026-06-05" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { hep1_id: $.data.id }
            - call: "POST /rehab/home-exercise-programs"
              payload: { plan_of_care_id: "${poc_id}", prescribed_by_therapist_id: "${th_id}", exercise_count: 6, weekly_frequency: 4, prescribed_on: "2026-06-10" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { hep2_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "RE_EVALUATION", performed_on: "2026-06-15", functional_score: 80, minutes_spent: 25 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/mips-measures"
              payload: { patient_id: "${pt_id}", plan_of_care_id: "${poc_id}", reporting_therapist_id: "${th_id}", measure_code: "MIPS128_FALL_RISK", performance_period_start: "2026-06-01", performance_period_end: "2026-06-30", numerator_met: true }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { mips_id: $.data.id }
          trigger:
            - call: "POST /rehab/mips-measures/${mips_id}/submit"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { score: $.data.composite_score }
          assert:
            - "MIPSQualityMeasure.${mips_id}.composite_score == 100.00"
            - "MIPSQualityMeasure.${mips_id}.status == SUBMITTED"

      - name: visit_billed_amount_round_per_unit_then_sum_mode_b
        grounds:
          - calculations.visit_billed_amount
          - entities.Visit.fields.billed_cents
          - entities.Visit.fields.cpt_code
        distinguishing_aspect: |
          Mode (b) — nested rounding order is PINNED: round_half_up applied
          PER-UNIT to the reduced rate (`reduced = round_half_up(rate_cents *
          MPPR_FACTOR)`), THEN summed across extra units. CPT_97140 at 3500¢ per
          unit, 3 billable units: first_unit=3500, reduced_per_unit=round_half_up(3500*0.5)=1750,
          billed = 3500 + 1750*2 = 7000¢. The alternative ordering (sum_then_round:
          round(3500 + 3500*2*0.5)=round(7000)=7000 — coincidentally same here)
          differs whenever rate*0.5 has fractional cents — but the scaffold's
          frozen order is round-per-unit-then-sum regardless of arithmetic equivalence.
        test_recipe:
          setup:
            - "MEDICARE Patient, Therapist CA-licensed. ACTIVE POC + ACTIVE Grant. SCHEDULED then COMPLETED Visit with cpt_code=CPT_97140, planned_minutes=45 (→ 3 planned units), actual_minutes=45 (→ 3 billable units)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Bill B", npi_number: "1000000022", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat B", date_of_birth: "1955-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_v_active: $.data.version }
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 10, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-01T10:00:00Z", scheduled_end_utc: "2026-06-01T10:45:00Z", planned_minutes: 45, cpt_code: "CPT_97140" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /rehab/visits/${visit_id}/complete"
              payload: { actual_minutes: 45 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_v_now: $.data.version }
          trigger:
            - call: "POST /rehab/visits/${visit_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_v_now}" }
              as: BillingClerk
              captures: { v_billed: $.data.billed_cents }
          assert:
            - "Visit.${visit_id}.billable_units == 3"
            - "Visit.${visit_id}.billed_cents == 7000"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 3 — non_linear_state_machine
  # Two non-linear machines on DIFFERENT entities.
  #   (A) PlanOfCare — branching/fork: ACTIVE can go to {RECERT_DUE} via clock
  #       OR {DISCHARGED} via explicit discharge; RECERT_DUE can fork to
  #       {ACTIVE (recertify), EXPIRED (clock past end)}.
  #   (B) MIPSQualityMeasure — cyclic self-loop DRAFT -> DRAFT (revise) before
  #       branching SUBMITTED -> {ACCEPTED, REJECTED}.
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: poc_fork_active_to_recert_due_to_active_again
        grounds:
          - state_machines.PlanOfCare.ACTIVE_to_RECERT_DUE
          - state_machines.PlanOfCare.RECERT_DUE_to_ACTIVE
          - state_machines.PlanOfCare.RECERT_DUE_to_EXPIRED
        distinguishing_aspect: |
          PlanOfCare entity exhibits a branching/cyclic shape: from ACTIVE the
          machine forks to RECERT_DUE (clock auto-transition within 7 days of
          end), and from RECERT_DUE two outgoing edges exist — back to ACTIVE
          (recertify trigger, with side-effect set: refresh dates, bump version)
          or forward to EXPIRED (clock past end). This is non-linear because
          the same RECERT_DUE state can resolve to either of two distinct
          side-effect sets depending on the trigger.
        test_recipe:
          setup:
            - "ACTIVE PlanOfCare with certified_start_date=2026-06-01, certified_end_date=2026-06-08. Clock starts at 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T NLin", npi_number: "1000000030", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat NLin", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-06-08" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_v_recert_due: $.data.version }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "RE_EVALUATION", performed_on: "2026-06-04", functional_score: 55, minutes_spent: 25 }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /rehab/plans-of-care/${poc_id}/recertify"
              payload: { expected_plan_of_care_version: "${poc_v_recert_due}", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_status_after: $.data.status, poc_end_after: $.data.certified_end_date }
          assert:
            - "PlanOfCare.${poc_id}.status == ACTIVE"
            - "PlanOfCare.${poc_id}.certified_end_date == 2026-07-31"

      - name: mips_cyclic_draft_self_loop_then_branch
        grounds:
          - state_machines.MIPSQualityMeasure.DRAFT_to_DRAFT
          - state_machines.MIPSQualityMeasure.DRAFT_to_SUBMITTED
          - state_machines.MIPSQualityMeasure.SUBMITTED_to_ACCEPTED
          - state_machines.MIPSQualityMeasure.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          MIPSQualityMeasure entity exhibits a cyclic DRAFT->DRAFT self-loop
          (revise can fire multiple times) followed by a branching SUBMITTED ->
          {ACCEPTED | REJECTED} fork at adjudicate based on composite_score vs
          30.0. Three revises then a submit then an adjudicate exercises both
          non-linear features (cycle + branch) on the same entity.
        test_recipe:
          setup:
            - "MEDICARE Patient + medicare-enrolled Therapist. ACTIVE POC + INITIAL Eval. DRAFT MIPS131_PAIN_ASSESSMENT measure (base=18.0 — chosen so a simple numerator-only score is < 30 → REJECTED branch testable)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T NLin Mips", npi_number: "1000000031", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Mips R", date_of_birth: "1960-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 50, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/mips-measures"
              payload: { patient_id: "${pt_id}", plan_of_care_id: "${poc_id}", reporting_therapist_id: "${th_id}", measure_code: "MIPS131_PAIN_ASSESSMENT", performance_period_start: "2026-06-01", performance_period_end: "2026-06-30", numerator_met: false }
