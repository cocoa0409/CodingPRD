# =============================================================================
# task_2339 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 difficulty rules × 2 differentiated instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7; every setup chain is
# executable from an empty DB using only §1.5 endpoints.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: amortization_forecast_straight_vs_volume_weighted_divergence
        grounds:
          - calculations.slotting_amortization
          - entities.SlottingDeal.fields.amortization_method
          - entities.SlottingDeal.fields.recovered_cents
          - entities.SlottingDeal.fields.unamortized_balance_cents
          - entities.DistributionSnapshot.fields.amortized_amount_cents
          - state_machines.SlottingDeal.ACCEPTED_to_AMORTIZING
        distinguishing_aspect: |
          The two variants of calculations.slotting_amortization are selected by
          SlottingDeal.amortization_method and diverge on MONEY: given byte-identical
          deals (accepted_fee_cents=4756000, amortization_periods=6,
          forecast_annual_units=120000) and one identical period posting
          (reported_case_volume=15000), FORECAST_STRAIGHT posts 792666 (volume
          ignored) while VOLUME_WEIGHTED posts 594500 (ratio_bps =
          floor(15000*10000/20000) = 7500), a 198166-cent delta that also shifts
          the →RECOVERED timing. This instance's variant axis is the amortization
          METHOD on SlottingDeal; the sibling instance's axis is the void-rate
          BASIS on Authorization (a ratio, not money).
        test_recipe:
          setup:
            - "Retailer BIGMART with 1200 stores, STORE_COUNT_BASIS default, at_risk_void_rate_bps=1500."
            - "Two ACTIVE principals (NWF, SBF), each with an ACTIVE FROZEN_SNACKS agreement covering 2026 and a 20,000,000-cent slotting budget."
            - "One VALIDATED item per principal; one FROZEN_SNACKS review, both presentations SUBMITTED then ACCEPTED at decide."
            - "Two slotting deals, identical inputs (fee 50000/store, 100 stores, 1 item, forecast 120000, 6 periods) except amortization_method: deal_fs=FORECAST_STRAIGHT, deal_vw=VOLUME_WEIGHTED. Both ACCEPTED → AMORTIZING with accepted_fee_cents=4756000 and unamortized_balance_cents=4756000."
            - "Clock at 2026-09-02 (inside the review decision window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200, void_rate_basis_default: "STORE_COUNT_BASIS", at_risk_void_rate_bps: 1500 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p_fs: $.data.id }
            - call: "POST /principals"
              payload: { name: "Southbay Foods", code: "SBF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p_vw: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${p_fs}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300, exclusive_in_category: false }
              as: BrokerAdmin
              captures: { agr_fs: $.data.id }
            - call: "POST /commission-agreements/${agr_fs}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /commission-agreements"
              payload: { principal_id: "${p_vw}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300, exclusive_in_category: false }
              as: BrokerAdmin
              captures: { agr_vw: $.data.id }
            - call: "POST /commission-agreements/${agr_vw}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /principals/${p_fs}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /principals/${p_vw}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${p_fs}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { i_fs: $.data.id }
            - call: "POST /items/${i_fs}/catalog-submissions"
              payload: { gtin14: "00011111000001", dimensions_cm: "20x15x8", gross_weight_g: 900, nutrition_panel_url: "https://cdn.example/n1.pdf", shelf_life_days: 365 }
              as: BrokerAccountManager
            - call: "POST /items/${i_fs}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /items"
              payload: { principal_id: "${p_vw}", upc: "022222000002", description: "Churro Bites 10ct", case_pack_units: 10, list_price_cents: 2010, unit_cost_cents: 1150 }
              as: BrokerAccountManager
              captures: { i_vw: $.data.id }
            - call: "POST /items/${i_vw}/catalog-submissions"
              payload: { gtin14: "00022222000002", dimensions_cm: "22x14x9", gross_weight_g: 850, nutrition_panel_url: "https://cdn.example/n2.pdf", shelf_life_days: 300 }
              as: BrokerAccountManager
            - call: "POST /items/${i_vw}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 4 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev: $.data.id }
            - call: "POST /category-reviews/${rev}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${p_fs}", item_ids: ["${i_fs}"] }
              as: BrokerAccountManager
              captures: { pres_fs: $.data.id }
            - call: "POST /presentations/${pres_fs}/submit"
              payload: {}
              as: BrokerAccountManager
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${p_vw}", item_ids: ["${i_vw}"] }
              as: BrokerAccountManager
              captures: { pres_vw: $.data.id }
            - call: "POST /presentations/${pres_vw}/submit"
              payload: {}
              as: BrokerAccountManager
            - call: "POST /slotting-deals"
              payload: { presentation_id: "${pres_fs}", requested_fee_per_store_cents: 50000, store_count_in_scope: 100, item_count_in_scope: 1, forecast_annual_units: 120000, amortization_periods: 6, amortization_method: "FORECAST_STRAIGHT" }
              as: BrokerAccountManager
              captures: { deal_fs: $.data.id }
            - call: "POST /slotting-deals/${deal_fs}/propose"
              payload: { proposed_fee_per_store_cents: 50000 }
              as: BrokerAccountManager
            - call: "POST /slotting-deals"
              payload: { presentation_id: "${pres_vw}", requested_fee_per_store_cents: 50000, store_count_in_scope: 100, item_count_in_scope: 1, forecast_annual_units: 120000, amortization_periods: 6, amortization_method: "VOLUME_WEIGHTED" }
              as: BrokerAccountManager
              captures: { deal_vw: $.data.id }
            - call: "POST /slotting-deals/${deal_vw}/propose"
              payload: { proposed_fee_per_store_cents: 50000 }
              as: BrokerAccountManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /category-reviews/${rev}/lock"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: BrokerAdmin
            - call: "GET /category-reviews/${rev}"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev_v: $.data.version }
            - call: "POST /category-reviews/${rev}/decide"
              payload: { expected_review_version: "${rev_v}", authorized_item_ids: ["${i_fs}", "${i_vw}"] }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /principals/${p_fs}"
              payload: {}
              as: BrokerAdmin
              captures: { p_fs_v: $.data.version }
            - call: "POST /slotting-deals/${deal_fs}/accept"
              payload: { expected_principal_version: "${p_fs_v}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /principals/${p_vw}"
              payload: {}
              as: BrokerAdmin
              captures: { p_vw_v: $.data.version }
            - call: "POST /slotting-deals/${deal_vw}/accept"
              payload: { expected_principal_version: "${p_vw_v}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /authorizations"
              payload: { item_id: "${i_fs}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { auth_fs: "$.data[0].id", auth_fs_v: "$.data[0].version" }
            - call: "GET /authorizations"
              payload: { item_id: "${i_vw}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { auth_vw: "$.data[0].id", auth_vw_v: "$.data[0].version" }
          trigger:
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth_fs}", expected_authorization_version: "${auth_fs_v}", period_index: 1, reported_store_count: 95, distributed_store_count: 90, reported_case_volume: 15000 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { snap_fs: $.data.id, amt_fs: $.data.amortized_amount_cents }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth_vw}", expected_authorization_version: "${auth_vw_v}", period_index: 1, reported_store_count: 95, distributed_store_count: 90, reported_case_volume: 15000 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { snap_vw: $.data.id, amt_vw: $.data.amortized_amount_cents }
          assert:
            - "SlottingDeal.${deal_fs}.accepted_fee_cents == 4756000 and SlottingDeal.${deal_vw}.accepted_fee_cents == 4756000 (identical quotes: gross 5000000, volume_credit 360000, net 4640000, admin 116000)"
            - "DistributionSnapshot.${snap_fs}.amortized_amount_cents == 792666 (FORECAST_STRAIGHT: floor(4756000/6))"
            - "DistributionSnapshot.${snap_vw}.amortized_amount_cents == 594500 (VOLUME_WEIGHTED: period_target=ceil(120000/6)=20000, ratio_bps=floor(15000*10000/20000)=7500, round_half_up(4756000*7500/60000))"
            - "amortized_amount_cents delta between the two variants == 198166"
            - "SlottingDeal.${deal_fs}.recovered_cents == 792666 and unamortized_balance_cents == 3963334"
            - "SlottingDeal.${deal_vw}.recovered_cents == 594500 and unamortized_balance_cents == 4161500"
            - "Both deals: accepted_fee_cents == recovered_cents + unamortized_balance_cents + written_off_cents"
            - "Both deals state == AMORTIZING and periods_posted == 1"
            - "Authorization.${auth_fs}.void_rate_bps == 1000 and authorization_state == AUTHORIZED (void 10 of 100 authorized stores, below the 1500 threshold — no RECOVERY_HOLD noise)"

      - name: void_rate_store_count_basis_vs_reported_basis_divergence
        grounds:
          - calculations.void_rate
          - entities.Authorization.fields.void_rate_basis
          - entities.Authorization.fields.void_store_count
          - entities.Authorization.fields.pending_store_count
          - entities.Retailer.fields.void_rate_basis_default
          - state_machines.Authorization.AUTHORIZED_to_AT_RISK
        distinguishing_aspect: |
          The two variants of calculations.void_rate are selected by
          Authorization.void_rate_basis (pinned from the retailer at award time)
          and diverge on a RATIO plus a STATE: identical snapshot input
          (authorized 400, reported 380, distributed 340) yields 1500 bps with
          void 60 / pending 0 under STORE_COUNT_BASIS (→ AT_RISK, threshold is
          inclusive) but 1052 bps with void 40 / pending 20 under REPORTED_BASIS
          (→ stays AUTHORIZED). Variant axis = denominators and unreported-store
          semantics on Authorization, not the money-amortization METHOD axis of
          the sibling instance.
        test_recipe:
          setup:
            - "Two retailers: BIGMART (void_rate_basis_default=STORE_COUNT_BASIS) and VALUFRESH (void_rate_basis_default=REPORTED_BASIS), both at_risk_void_rate_bps=1500, 1200 stores."
            - "One ACTIVE principal NWF with an ACTIVE FROZEN_SNACKS agreement at each retailer, one VALIDATED item."
            - "One FROZEN_SNACKS review per retailer, presentation SUBMITTED in each, no slotting deal → both awarded authorizations auto-advance PENDING_SETUP→AUTHORIZED with authorized_store_count=400 (default_store_count)."
            - "Clock at 2026-09-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200, void_rate_basis_default: "STORE_COUNT_BASIS", at_risk_void_rate_bps: 1500 }
              as: BrokerAdmin
              captures: { ret_a: $.data.id }
            - call: "POST /retailers"
              payload: { name: "Valufresh", chain_code: "VALUFRESH", total_store_count: 1200, void_rate_basis_default: "REPORTED_BASIS", at_risk_void_rate_bps: 1500 }
              as: BrokerAdmin
              captures: { ret_b: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret_a}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300, exclusive_in_category: false }
              as: BrokerAdmin
              captures: { agr_a: $.data.id }
            - call: "POST /commission-agreements/${agr_a}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret_b}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300, exclusive_in_category: false }
              as: BrokerAdmin
              captures: { agr_b: $.data.id }
            - call: "POST /commission-agreements/${agr_b}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { itm: $.data.id }
            - call: "POST /items/${itm}/catalog-submissions"
              payload: { gtin14: "00011111000001", dimensions_cm: "20x15x8", gross_weight_g: 900, nutrition_panel_url: "https://cdn.example/n1.pdf", shelf_life_days: 365 }
              as: BrokerAccountManager
            - call: "POST /items/${itm}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret_a}"
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret_a}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret_a}"
              captures: { rev_a: $.data.id }
            - call: "POST /category-reviews/${rev_a}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret_a}"
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret_b}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret_b}"
              captures: { rev_b: $.data.id }
            - call: "POST /category-reviews/${rev_b}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret_b}"
            - call: "POST /presentations"
              payload: { review_id: "${rev_a}", principal_id: "${prin}", item_ids: ["${itm}"] }
              as: BrokerAccountManager
              captures: { pres_a: $.data.id }
            - call: "POST /presentations/${pres_a}/submit"
              payload: {}
              as: BrokerAccountManager
            - call: "POST /presentations"
              payload: { review_id: "${rev_b}", principal_id: "${prin}", item_ids: ["${itm}"] }
              as: BrokerAccountManager
              captures: { pres_b: $.data.id }
            - call: "POST /presentations/${pres_b}/submit"
              payload: {}
              as: BrokerAccountManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /category-reviews/${rev_a}/lock"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret_a}"
            - call: "POST /category-reviews/${rev_b}/lock"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: BrokerAdmin
            - call: "GET /category-reviews/${rev_a}"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret_a}"
              captures: { rev_a_v: $.data.version }
            - call: "POST /category-reviews/${rev_a}/decide"
              payload: { expected_review_version: "${rev_a_v}", authorized_item_ids: ["${itm}"], default_store_count: 400 }
              as: RetailerBuyer
              as_user_id: "${ret_a}"
            - call: "GET /category-reviews/${rev_b}"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret_b}"
              captures: { rev_b_v: $.data.version }
            - call: "POST /category-reviews/${rev_b}/decide"
              payload: { expected_review_version: "${rev_b_v}", authorized_item_ids: ["${itm}"], default_store_count: 400 }
              as: RetailerBuyer
              as_user_id: "${ret_b}"
            - call: "GET /authorizations"
              payload: { review_id: "${rev_a}" }
              as: RetailerBuyer
              as_user_id: "${ret_a}"
              captures: { auth_a: "$.data[0].id", auth_a_v: "$.data[0].version" }
            - call: "GET /authorizations"
              payload: { review_id: "${rev_b}" }
              as: RetailerBuyer
              as_user_id: "${ret_b}"
              captures: { auth_b: "$.data[0].id", auth_b_v: "$.data[0].version" }
          trigger:
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth_a}", expected_authorization_version: "${auth_a_v}", period_index: 1, reported_store_count: 380, distributed_store_count: 340, reported_case_volume: 5000 }
              as: RetailerBuyer
              as_user_id: "${ret_a}"
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth_b}", expected_authorization_version: "${auth_b_v}", period_index: 1, reported_store_count: 380, distributed_store_count: 340, reported_case_volume: 5000 }
              as: RetailerBuyer
              as_user_id: "${ret_b}"
          assert:
            - "Authorization.${auth_a}.void_rate_basis == STORE_COUNT_BASIS and Authorization.${auth_b}.void_rate_basis == REPORTED_BASIS (each pinned from its retailer's default at award)"
            - "Authorization.${auth_a}.void_store_count == 60, pending_store_count == 0, void_rate_bps == 1500"
            - "Authorization.${auth_b}.void_store_count == 40, pending_store_count == 20, void_rate_bps == 1052 (floor(40*10000/380))"
            - "Authorization.${auth_a}.authorization_state == AT_RISK (1500 >= 1500, inclusive threshold)"
            - "Authorization.${auth_b}.authorization_state == AUTHORIZED (1052 < 1500)"
            - "Both authorizations: authorized_store_count == distributed_store_count + void_store_count + pending_store_count == 400"
            - "GET /authorizations/${auth_a}/voids-report → void_rate_bps == 1500 and counterfactual_void_rate_bps == 1052; GET /authorizations/${auth_b}/voids-report → void_rate_bps == 1052 and counterfactual_void_rate_bps == 1500"

  - rule_id: combinatorial_formula
    instances:
      - name: slotting_admin_tier_keyed_on_pre_admin_net_not_quoted_fee
        grounds:
          - calculations.slotting_quote
          - entities.SlottingDeal.fields.gross_fee_cents
          - entities.SlottingDeal.fields.volume_credit_cents
          - entities.SlottingDeal.fields.net_before_admin_cents
          - entities.SlottingDeal.fields.admin_fee_cents
          - entities.SlottingDeal.fields.quoted_fee_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by declared evaluation
          order. The admin-fee tier is keyed on net_before_admin_cents (the value
          BEFORE the admin fee is added), even though the admin fee is itself part
          of quoted_fee_cents. At the exact tier boundary net == 5000000 the
          correct chain is 250 bps → admin 125000 → quoted 5125000, while keying
          the tier on the (larger) quoted fee would yield 150 bps → admin 76875 →
          quoted 5076875. The sibling instance is mode (b) — per-line rounding
          order in the commission statement — not an ordering-of-derivation case.
        test_recipe:
          setup:
            - "Retailer BIGMART with 1200 stores; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement and a 20,000,000-cent budget."
            - "Two items owned by NWF (catalog validation is not required to open a negotiation)."
            - "One SCHEDULED FROZEN_SNACKS review and one DRAFT presentation listing both items."
            - "Clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300, exclusive_in_category: false }
              as: BrokerAdmin
              captures: { agr: $.data.id }
            - call: "POST /commission-agreements/${agr}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /items"
