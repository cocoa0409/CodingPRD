            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v: $.data.version }
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2026, principal_cents: 40000, expected_certificate_version: "${cert_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v2: $.data.version }
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2026, principal_cents: 10000, expected_certificate_version: "${cert_v2}" }
              as: Investor
              as_user_id: "${i1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_SUB_TAX"
            - "Certificate.${cert_id}.sub_tax_total_cents == 40000"

      - name: duplicate_listing_for_parcel_on_open_sale
        grounds:
          - entities.Parcel.fields.status
          - state_machines.SaleListing.LISTED_to_SOLD
          - validations[priority=7]
        distinguishing_aspect: "Continuous-occupancy overlap on the Parcel resource: a Parcel can hold at most one LISTED occupancy across all sales at once; attaching the same parcel to a second sale while it is ON_SALE collides (parcel occupancy interval semantics), distinct from the discrete tax-year point semantics."
        test_recipe:
          setup:
            - "Parcel ON_SALE via a LISTED listing on sale S1. A second sale S2 exists; attaching the parcel to S2 must be rejected because the parcel is not DELINQUENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
