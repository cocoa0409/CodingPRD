          trigger:
            - { call: "POST /h2a/job-orders/${jo9}/submit", payload: {}, as: ContractorAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /h2a/growers/${g1}/refresh-status", payload: {}, as: WageAuditor, captures: { st1: $.data.status } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: SystemAdmin }
