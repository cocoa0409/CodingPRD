              as: FinancialAidOfficer
              captures: { pta: $.data.id }
            - call: "POST /r2t4/awards/${pta}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dta: $.data.id }
            - call: "POST /r2t4/disbursements/${dta}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${eta}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cta: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${cta}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cta}/recalculate"
              payload: { expected_withdrawal_case_version: "${cv} - 1" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
              captures: { err: $.data.error_id }
            - call: "POST /r2t4/withdrawal-cases/${cta}/recalculate"
              payload: { expected_withdrawal_case_version: "${cv}" }
