          The two ends of the offer flow read the same field with different admissible sets: creation
          accepts INTERESTED as well as VOLUNTARY_CONFIRMED, presentation accepts only
          VOLUNTARY_CONFIRMED. Confirmation itself is gated on a third field, so CONFIRM_VOLUNTARY
          before a pre-event value is set returns 422 ERR_PRE_EVENT_VALUE_NOT_DETERMINED - an offer can
          therefore be drafted for a parcel that is not yet eligible to receive it.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one parcel that has neither a pre-event value nor any participation decision."
