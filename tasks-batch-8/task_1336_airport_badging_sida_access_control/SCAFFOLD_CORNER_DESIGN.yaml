            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2401" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "AOA_MOVEMENT", badge_id: "${b1}" }, as: AccessControlSystem, captures: { e1: $.data.id, d1: $.data.decision } }
            - { call: "POST /badging/access-checks", payload: { zone_code: "SECURE_ID_AREA", badge_id: "${b1}", escortee_count: 1 }, as: AccessControlSystem, captures: { e2: $.data.id, d2: $.data.decision, r2: $.data.denial_reason } }
            - { call: "GET /badging/badges/${b1}/access-events", payload: {}, as: Auditor, captures: { l1: "$.data[0].id", l2: "$.data[1].id", l1z: "$.data[0].zone_code", l1t: "$.data[0].occurred_at" } }
          assert:
            - "first check ALLOWED at AOA_MOVEMENT (${d1} == ALLOWED); second DENIED at SECURE_ID_AREA with escortee (${d2} == DENIED, ${r2} == DENIED_ESCORT_NOT_PERMITTED — zone forbids escorted entry)"
            - "the list returns exactly 2 events in created_at order: ${l1} == ${e1} and ${l2} == ${e2}"
            - "persisted fields: ${l1z} == AOA_MOVEMENT and ${l1t} == 2026-08-01T00:00:00Z (logical clock at check time)"

  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: escort_grant_stale_version_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[escort-grant-stale-badge]", "errors[ERR_STALE_VERSION]", "validations[priority=6]"]
        distinguishing_aspect: "OCC on Badge.version: after a successful grant advances the badge from version 1 to 2, a second grant carrying the stale expected_badge_version 1 is rejected with ERR_STALE_VERSION (412) and creates nothing."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B2501) at version 1"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2501" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
          trigger:
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { ep1: $.data.id, ep1st: $.data.status } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { bv_after: $.data.version } }
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 5, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "GET /badging/badges/${b1}/escort-privileges", payload: {}, as: SecurityManager, captures: { only: "$.data[0].status" } }
          assert:
            - "fresh version succeeds: ${ep1st} == GRANTED and the grant advanced the badge — ${bv1} == 1, ${bv_after} == 2"
            - "stale version rejected: ${err} == ERR_STALE_VERSION with HTTP 412"
            - "no second privilege was created: the list still holds exactly one entry and ${only} == GRANTED"

      - name: escort_grant_supersedes_prior_grant
        claim_type: cascading_side_effects
        grounds: ["concurrency_rules[escort-grant-stale-badge]", state_machines.EscortPrivilege.GRANTED_to_REVOKED]
        distinguishing_aspect: "A new grant supersedes: the previously GRANTED privilege becomes REVOKED with revoked_reason SUPERSEDED, the new privilege is GRANTED, and exactly one GRANTED privilege exists per badge at any time."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B2601) with escort privilege ep1 (max_escortees 3) GRANTED; badge now at version 2"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2601" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { ep1: $.data.id } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { bv2: $.data.version } }
          trigger:
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 5, expected_badge_version: "${bv2}" }, as: SecurityManager, as_user_id: "mgr-2", captures: { ep2: $.data.id, ep2st: $.data.status, ep2max: $.data.max_escortees } }
            - { call: "GET /badging/badges/${b1}/escort-privileges", payload: {}, as: SecurityManager, captures: { first_st: "$.data[0].status", first_rs: "$.data[0].revoked_reason", second_st: "$.data[1].status", second_id: "$.data[1].id" } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { bv3: $.data.version } }
          assert:
            - "new privilege: ${ep2st} == GRANTED and ${ep2max} == 5"
            - "superseded privilege: ${first_st} == REVOKED and ${first_rs} == SUPERSEDED (list is created_at ascending, so index 0 is ep1)"
            - "${second_st} == GRANTED and ${second_id} == ${ep2} — exactly one GRANTED privilege per badge"
            - "the superseding grant also advanced the badge: ${bv3} == 3"

      - name: badges_list_filter_by_status_and_sponsor
        claim_type: pagination_with_filtering
        grounds: [endpoints.GET /badging/badges]
        distinguishing_aspect: "The badge list combines filters: sponsor_id + status == SUSPENDED returns only the suspended badge of that sponsor; applicant_id + status == ACTIVE returns only the other badge."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE with badges b1 (B2701, a1) and b2 (B2702, a2); b1 is then suspended"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2701" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ben Okafor", date_of_birth: "1988-05-02", government_id_number: "G1002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B2702" }, as: BadgingOfficer, captures: { b2: $.data.id } }
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "review" }, as: SecurityManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "GET /badging/badges?sponsor_id=${s1}&status=SUSPENDED", payload: {}, as: Auditor, captures: { f1: "$.data[0].id" } }
            - { call: "GET /badging/badges?applicant_id=${a2}&status=ACTIVE", payload: {}, as: Auditor, captures: { f2: "$.data[0].id" } }
          assert:
            - "sponsor+SUSPENDED: exactly 1 row and ${f1} == ${b1}"
            - "applicant+ACTIVE: exactly 1 row and ${f2} == ${b2}"

      - name: dual_variant_calculation_coverage
        claim_type: dual_variant_calculation
        grounds: [calculations.audit_recovery_rate, calculations.training_currency_check]
        excluded_because:
          difficulty_instance: audit_recovery_provisional_vs_final
          rationale: "Both variants of both dual-variant calculations are asserted with literal divergent values in §1.8 (audit_recovery_provisional_vs_final and training_currency_strict_vs_renewal_grace)."

      - name: multi_hop_cascade_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.Badge.ACTIVE_to_SUSPENDED, state_machines.EscortPrivilege.GRANTED_to_REVOKED]
        excluded_because:
          difficulty_instance: violation_sustain_cascades_badge_suspend_escort_revoke
          rationale: "The 3-hop violation->badge->escort chain and the sponsor->badge->escort chain are asserted end-to-end in §1.8 (violation_sustain_cascades_badge_suspend_escort_revoke and sponsor_suspend_cascades_applications_badges_escorts)."

      - name: rate_threshold_trigger_coverage
        claim_type: rate_threshold_triggers
        grounds: [calculations.violation_points_and_suspension, calculations.audit_recovery_rate]
        excluded_because:
          difficulty_instance: violation_points_threshold_exactly_12_suspends
          rationale: "The 12-point suspension threshold (with below/above behavior) is asserted in §1.8 violation_points_threshold_exactly_12_suspends; the 95.00 audit outcome threshold is exercised on both sides by §1.8 audit_recovery_provisional_vs_final (DEFICIENT) and corner audit_empty_scope_closes_compliant_100 (COMPLIANT)."

  # ---------------------------------------------------------------------------
  # Section: consistency model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: badge_suspend_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST /badging/badges/{id}/suspend"]
        distinguishing_aspect: "Immediate consistency: the suspend response itself carries status SUSPENDED, and a subsequent GET in the same test observes the same state and fields with no lag."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B2801)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2801" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "investigation" }, as: SecurityManager, as_user_id: "mgr-1", captures: { st_resp: $.data.status, by_resp: $.data.suspended_by, rs_resp: $.data.suspension_reason } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: Auditor, captures: { st_get: $.data.status, by_get: $.data.suspended_by } }
          assert:
            - "mutation response: ${st_resp} == SUSPENDED, ${by_resp} == mgr-1, ${rs_resp} == MANUAL"
            - "immediate re-read: ${st_get} == SUSPENDED and ${by_get} == mgr-1 (no reconciliation lag)"
