# =============================================================================
# PRD-Bench Scaffold — Berry Harvest Labor & Packing Operations
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2755. Berry Harvest Labor & Packing Operations (fresh berry grower-packer): variety and field maturity forecasting for harvest window planning, harvest crew recruitment with seasonal labor programs, housing and transportation, piece-rate pay design with minimum wage guarantees and productivity tracking per picker, field-pack quality standards with grading, culling and clamshell filling at the row, cold chain from field heat removal through forced-air cooling with time-to-cool targets, packing line operations for repacked fruit with optical sorting and defect removal, food safety programs including water testing, worker hygiene and traceability by block and pick date, buyer program commitments with volume, price and shelf-life guarantees

domain_name: berry-harvest-ops
api_prefix: /berry-ops

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # piece-rate vs period-averaged wage; forecast vs verified shelf life
    - cascading_side_effects        # water failure -> quarantine -> window suspend -> session void -> crew ledger
    - rate_threshold_triggers       # E. coli geometric-mean limit, time-to-cool target, cull-rate ceiling, fill-rate floor
    - optimistic_concurrency        # OCC on CoolingTunnel.version and BuyerCommitment.version

  entity_topology: flat
  # All 11 entities are peers under a single /berry-ops namespace and link by
  # explicit foreign keys in request bodies; no entity id is nested inside
  # another entity's collection path.

  state_machine_shape: parallel
  # FruitLot carries two independent state dimensions (cold_chain_status x
  # disposition_status). PickSession is cyclic (TALLIED <-> DISPUTED with a
  # revision cap). Block posture is a derived compound field. HarvestWindow has
  # a suspend/resume loop.

  relationship_patterns:
    - one_to_many          # Block -> WaterTest/HarvestWindow/FruitLot, Crew -> Picker/PayrollRun
    - self_referential     # FruitLot.source_lot_id -> FruitLot.id (repack lineage)
    - cross_aggregate      # LotAllocation joins the packhouse aggregate to the sales aggregate
    - polymorphic: false

  role_model: segregation_of_duties
  # Peer operational roles (harvest / food safety / crew / payroll / packhouse /
  # sales) plus three hard segregation rules keyed on X-User-ID: the clerk who
  # locks a PayrollRun cannot settle it, the officer who quarantined a Block
  # cannot clear it, and the user who tallied a PickSession cannot approve it.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Block
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Grower-facing block label, unique across blocks
        constraints: 1..80 chars; unique (case-sensitive)
      - name: variety
        type: enum
        source: input
        description: Planted berry variety; drives pick rate, brix gates and base shelf life
        constraints: STRAWBERRY | BLUEBERRY | RASPBERRY | BLACKBERRY
      - name: acres
        type: number
        source: input
        description: Planted acreage, 2 decimals
        constraints: "> 0"
      - name: planting_year
        type: integer
        source: input
        description: Year the block was planted
        constraints: 2000..2026
      - name: irrigation_source_code
        type: string
        source: input
        description: Agricultural water source identifier sampled by WaterTest
        constraints: 1..32 chars
      - name: water_sample_count
        type: integer
        source: computed
        description: Count of WaterTest rows whose block_id equals this block
        default: 0
      - name: water_geomean_mpn
        type: number
        source: computed
        description: Rolling geometric mean of the most recent samples per calculations.water_quality_status; null while water_sample_count == 0
        default: null
        constraints: 1 decimal, round_half_up
      - name: water_status
        type: enum
        source: computed
        description: Agricultural-water compliance state derived by calculations.water_quality_status
        default: NO_SAMPLES
        constraints: NO_SAMPLES | PROVISIONAL | COMPLIANT | NON_COMPLIANT | FAILED
      - name: last_sample_date
        type: string
        source: computed
        description: Greatest sample_date among this block's WaterTest rows; null while none exist
        default: null
        constraints: ISO date (YYYY-MM-DD)
      - name: manual_quarantine_active
        type: boolean
        source: system
        description: True while an operator quarantine hold is open on this block
        default: false
      - name: quarantined_by_user_id
        type: string
        source: system
        description: X-User-ID of the FoodSafetyOfficer that opened the current manual quarantine; retained after clearing for the segregation-of-duties check
        default: null
      - name: quarantine_reason_code
        type: string
        source: system
        description: Reason code supplied on the last quarantine call
        default: null
      - name: food_safety_posture
        type: enum
        source: computed
        description: Derived gate over all block child operations per calculations.block_food_safety_posture
        default: RESTRICTED
        constraints: CLEARED | RESTRICTED | QUARANTINED

  - name: WaterTest
    parent: null
    common_fields: false
    fields:
      - name: block_id
        type: string
        source: input
        description: FK -> Block.id; the block whose irrigation source was sampled
      - name: sample_date
        type: string
        source: input
        description: Calendar date the sample was drawn; ordering key of the rolling series
        constraints: ISO date (YYYY-MM-DD)
      - name: generic_ecoli_mpn
        type: integer
        source: input
        description: Generic E. coli most-probable-number per 100 mL for this sample
        constraints: ">= 1 and <= 100000"
      - name: single_sample_exceedance
        type: boolean
        source: computed
        description: True when generic_ecoli_mpn > SINGLE_SAMPLE_MAX_MPN (410)
      - name: resulting_water_status
        type: enum
        source: computed
        description: Snapshot of the parent block's water_status immediately after this sample was recorded
        constraints: NO_SAMPLES | PROVISIONAL | COMPLIANT | NON_COMPLIANT | FAILED
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the FoodSafetyOfficer that recorded the sample

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Crew label
        constraints: 1..80 chars
      - name: labor_program
        type: enum
        source: input
        description: Seasonal labor program the crew is engaged under; H2A additionally requires employer-provided housing
        constraints: DOMESTIC | H2A
      - name: supervisor_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the CrewSupervisor that owns this crew's pick sessions
        constraints: 1..64 chars
      - name: planned_head_count
        type: integer
        source: input
        description: Contracted crew size; housing beds and vehicle seats are checked against it
        constraints: 1..60
      - name: contract_start_date
        type: string
        source: input
        description: First date of the seasonal engagement
        constraints: ISO date
      - name: contract_end_date
        type: string
        source: input
        description: Last date of the seasonal engagement
        constraints: ISO date; ">= contract_start_date"
      - name: housing_unit_code
        type: string
        source: system
        description: Housing unit code recorded by the support-plan call
        default: null
      - name: beds_confirmed
        type: integer
        source: system
        description: Beds secured for this crew by the support-plan call
        default: 0
      - name: transport_route_code
        type: string
        source: system
        description: Daily field-transport route code recorded by the support-plan call
        default: null
      - name: vehicle_seats
        type: integer
        source: system
        description: Seats secured on the transport route by the support-plan call
        default: 0
      - name: support_plan_complete
        type: boolean
        source: computed
        description: True when transport_route_code is non-null and vehicle_seats >= planned_head_count and, for labor_program == H2A, housing_unit_code is non-null and beds_confirmed >= planned_head_count
        default: false
      - name: picker_count
        type: integer
        source: computed
        description: Count of Picker rows whose crew_id equals this crew
        default: 0
      - name: status
        type: enum
        source: computed
        description: Crew lifecycle state per state_machines.Crew
        default: RECRUITING
        constraints: RECRUITING | STAFFED | CERTIFIED | ACTIVE | RELEASED
      - name: accrued_wage_cents
        type: integer
        source: computed
        description: Unsettled wage liability; equals the sum of net_cents over this crew's PickSession rows with status == APPROVED
        default: 0
      - name: settled_wage_cents
        type: integer
        source: computed
        description: Cumulative settled_net_cents posted by SETTLED PayrollRun rows of this crew
        default: 0
      - name: reconciliation_delta_cents
        type: integer
        source: computed
        description: Cumulative signed difference between period-averaged settlement and per-session accrual posted by SETTLED PayrollRun rows of this crew
        default: 0

  - name: Picker
    parent: null
    common_fields: true
    fields:
      - name: crew_id
        type: string
        source: input
        description: FK -> Crew.id; the crew this picker belongs to
      - name: full_name
        type: string
        source: input
        description: Worker name
        constraints: 1..80 chars
      - name: hygiene_training_on
        type: string
        source: input
        description: Date the worker completed produce-handler hygiene training; omit when untrained
        default: null
        constraints: ISO date
      - name: labor_program
        type: enum
        source: computed
        description: Copied from the parent crew's labor_program at creation
        constraints: DOMESTIC | H2A
      - name: hygiene_training_expires_on
        type: string
        source: computed
        description: hygiene_training_on + HYGIENE_VALID_DAYS (365); null while hygiene_training_on is null
        default: null
        constraints: ISO date
      - name: total_clamshells_lifetime
        type: integer
        source: computed
        description: Sum of (clamshells_filled - culled_clamshells) over this picker's PickSession rows with status IN {APPROVED, SETTLED} — the paid, saleable clamshells only, per calculations.picker_productivity
        default: 0
      - name: total_hours_lifetime
        type: number
        source: computed
        description: Sum of hours_worked over this picker's PickSession rows with status IN {APPROVED, SETTLED}, 2 decimals
        default: 0
      - name: avg_lbs_per_hour
        type: number
        source: computed
        description: Productivity per calculations.picker_productivity; exactly 0.00 while total_hours_lifetime == 0
        default: 0
        constraints: 2 decimals, round_half_up

  - name: HarvestWindow
    parent: null
    common_fields: true
    fields:
      - name: block_id
        type: string
        source: input
        description: FK -> Block.id; the block to be harvested in this window
      - name: crew_id
        type: string
        source: input
        description: FK -> Crew.id; the crew assigned to the window
      - name: start_at
        type: datetime
        source: input
        description: Window open instant (ISO 8601 UTC, 3 fractional digits accepted)
      - name: end_at
        type: datetime
        source: input
        description: Window close instant; must be strictly after start_at and on the same calendar date
      - name: forecast_brix
        type: number
        source: input
        description: Forecast soluble-solids reading used as the maturity input, 1 decimal
        constraints: 0.0..30.0
      - name: planned_volume_lbs
        type: number
        source: input
        description: Planned harvest volume in pounds, 2 decimals
        constraints: "> 0"
      - name: piece_rate_cents_per_clamshell
        type: integer
        source: input
        description: Piece rate paid per filled clamshell in this window
        constraints: 1..500
      - name: clamshell_net_weight_lbs
        type: number
        source: input
        description: Net fruit weight of one clamshell for this pack format, 2 decimals
        constraints: "> 0 and <= 5"
      - name: window_hours
        type: number
        source: computed
        description: (end_at - start_at) expressed in hours, 2 decimals
        constraints: 2 decimals, round_half_up
      - name: effective_pick_rate_lbs_per_hour
        type: number
        source: computed
        description: Maturity- and posture-adjusted pick rate per calculations.window_crew_requirement; null before confirmation
        default: null
      - name: required_picker_count
        type: integer
        source: computed
        description: Staffing requirement per calculations.window_crew_requirement; null before confirmation
        default: null
      - name: status
        type: enum
        source: computed
        description: Window lifecycle state per state_machines.HarvestWindow
        default: PLANNED
        constraints: PLANNED | CONFIRMED | OPEN | SUSPENDED | CLOSED | CANCELLED
      - name: suspended_reason_code
        type: string
        source: system
        description: Reason code stamped when the window is suspended by a block quarantine cascade
        default: null
      - name: cancel_reason_code
        type: string
        source: system
        description: Reason code supplied on cancellation
        default: null
      - name: harvested_clamshells
        type: integer
        source: computed
        description: Sum of clamshells_filled over this window's PickSession rows with status IN {APPROVED, SETTLED}
        default: 0
      - name: packed_lbs
        type: number
        source: computed
        description: Sum of net_packed_lbs over this window's FruitLot rows with disposition_status != REJECTED, 2 decimals
        default: 0

  - name: PickSession
    parent: null
    common_fields: true
    fields:
      - name: harvest_window_id
        type: string
        source: input
        description: FK -> HarvestWindow.id; the window worked
      - name: picker_id
        type: string
        source: input
        description: FK -> Picker.id; the worker whose piece-rate tally this session holds
      - name: payroll_run_id
        type: string
        source: system
        description: FK -> PayrollRun.id; set when a PayrollRun locks this session, null before that
        default: null
      - name: work_date
        type: string
        source: input
        description: Calendar date worked; must fall inside the window's calendar date
        constraints: ISO date
      - name: hours_worked
        type: number
        source: input
        description: Clock hours on the row, supplied by the tally call, 2 decimals
        default: null
        constraints: "> 0 and <= 16"
      - name: clamshells_filled
        type: integer
        source: input
        description: Clamshells accepted at the row, supplied by the tally call
        default: null
        constraints: ">= 0"
      - name: culled_clamshells
        type: integer
        source: input
        description: Clamshells rejected at the row for grade defects, supplied by the tally call
        default: null
        constraints: ">= 0"
      - name: cull_rate
        type: number
        source: computed
        description: culled_clamshells / clamshells_filled, 4 decimals (culls are a subset of the filled count); exactly 0.0000 when clamshells_filled is zero
        default: null
      - name: quality_flag
        type: enum
        source: computed
        description: PENDING before tally; MEETS_STANDARD when cull_rate <= MAX_CULL_RATE (0.08); BELOW_STANDARD otherwise
        default: PENDING
        constraints: PENDING | MEETS_STANDARD | BELOW_STANDARD
      - name: effective_piece_rate_cents
        type: integer
        source: computed
        description: Window piece rate, derated by QUALITY_DERATE_PCT when quality_flag == BELOW_STANDARD, per calculations.session_pay_per_session
        default: null
      - name: piece_cents
        type: integer
        source: computed
        description: (clamshells_filled - culled_clamshells) * effective_piece_rate_cents — culled clamshells are never paid
        default: null
      - name: guarantee_floor_cents
        type: integer
        source: computed
        description: round_half_up(hours_worked * MIN_WAGE_CENTS_PER_HOUR)
        default: null
      - name: makeup_cents
        type: integer
        source: computed
        description: max(0, guarantee_floor_cents - piece_cents)
        default: null
      - name: gross_cents
        type: integer
        source: computed
        description: piece_cents + makeup_cents
        default: null
      - name: housing_deduction_cents
        type: integer
        source: computed
        description: Allowable daily housing charge per calculations.session_pay_per_session; never pushes net_cents below guarantee_floor_cents
        default: null
      - name: net_cents
        type: integer
        source: computed
        description: gross_cents - housing_deduction_cents
        default: null
      - name: tally_revision_count
        type: integer
        source: computed
        description: Number of tally calls applied after the first one; capped by MAX_TALLY_REVISIONS (3)
        default: 0
      - name: tallied_by_user_id
        type: string
        source: system
        description: X-User-ID of the most recent tally call
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approving PayrollClerk
        default: null
      - name: dispute_reason_code
        type: string
        source: system
        description: Reason code supplied on the last dispute call
        default: null
      - name: void_reason_code
        type: string
        source: system
        description: Reason code stamped when a window suspension voids this session
        default: null
      - name: status
        type: enum
        source: computed
        description: Session lifecycle state per state_machines.PickSession
        default: OPEN
        constraints: OPEN | TALLIED | DISPUTED | APPROVED | SETTLED | VOIDED

  - name: PayrollRun
    parent: null
    common_fields: true
    fields:
      - name: crew_id
        type: string
        source: input
        description: FK -> Crew.id; the crew being settled
      - name: period_start_date
        type: string
        source: input
        description: First work_date included in the period
        constraints: ISO date
      - name: period_end_date
        type: string
        source: input
        description: Last work_date included in the period
        constraints: ISO date; ">= period_start_date"
      - name: bound_session_count
        type: integer
        source: computed
        description: Number of PickSession rows bound at lock time
        default: 0
      - name: period_hours
        type: number
        source: computed
        description: Sum of hours_worked over bound sessions, 2 decimals
        default: null
      - name: period_piece_cents
        type: integer
        source: computed
        description: Sum of piece_cents over bound sessions
        default: null
      - name: period_floor_cents
        type: integer
        source: computed
        description: round_half_up(period_hours * MIN_WAGE_CENTS_PER_HOUR) — hours are summed BEFORE the multiplication
        default: null
      - name: period_makeup_cents
        type: integer
        source: computed
        description: max(0, period_floor_cents - period_piece_cents)
        default: null
      - name: period_deduction_cents
        type: integer
        source: computed
        description: Period housing charge per calculations.payroll_period_averaged_settlement
        default: null
      - name: settled_gross_cents
        type: integer
        source: computed
        description: period_piece_cents + period_makeup_cents (period-averaged variant)
        default: null
      - name: settled_net_cents
        type: integer
        source: computed
        description: settled_gross_cents - period_deduction_cents
        default: null
      - name: accrued_gross_cents
        type: integer
        source: computed
        description: Sum of gross_cents over bound sessions (per-session variant), stamped at lock
        default: null
      - name: reconciliation_delta_cents
        type: integer
        source: computed
        description: settled_net_cents - the sum of net_cents over the bound sessions (the per-session accrual); zero or negative by construction
        default: null
      - name: locked_by_user_id
        type: string
        source: system
        description: X-User-ID of the PayrollClerk that locked the run
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the PayrollClerk that settled the run; must differ from locked_by_user_id
        default: null
      - name: status
        type: enum
        source: computed
        description: Run lifecycle state per state_machines.PayrollRun
        default: DRAFT
        constraints: DRAFT | LOCKED | SETTLED

  - name: CoolingTunnel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Forced-air tunnel label
        constraints: 1..40 chars
      - name: slot_capacity
        type: integer
        source: input
        description: Pallet slots available in the tunnel at any instant
        constraints: 1..96
      - name: target_pulp_temp_f
        type: number
        source: input
        description: Seven-eighths-cool target pulp temperature in degrees F, 1 decimal
        constraints: 30.0..40.0
      - name: committed_slots
        type: integer
        source: computed
        description: Sum of pallet_slots over FruitLot rows on this tunnel with cold_chain_status == COOLING
        default: 0

  - name: FruitLot
    parent: null
    common_fields: true
    fields:
      - name: harvest_window_id
        type: string
        source: input
        description: FK -> HarvestWindow.id; the window the fruit was field-packed in
      - name: block_id
        type: string
        source: input
        description: FK -> Block.id; traceability block, must equal the window's block_id
      - name: source_lot_id
        type: string
        source: system
        description: FK -> FruitLot.id; the lot this lot was repacked out of, null for field-packed lots
        default: null
      - name: cooling_tunnel_id
        type: string
        source: input
        description: FK -> CoolingTunnel.id; tunnel supplied by the start-cooling call, null before cooling
        default: null
      - name: pick_date
        type: string
        source: input
        description: Traceability pick date; must equal the window's calendar date
        constraints: ISO date
      - name: variety
        type: enum
        source: computed
        description: Copied from the traceability block's variety at creation
        constraints: STRAWBERRY | BLUEBERRY | RASPBERRY | BLACKBERRY
      - name: grade
        type: enum
        source: input
        description: Field-pack grade assigned at the row
        constraints: A | B | CULL
      - name: clamshell_count
        type: integer
        source: input
        description: Clamshells in the lot
        constraints: ">= 1"
      - name: clamshell_net_weight_lbs
        type: number
        source: input
        description: Net fruit weight of one clamshell as actually packed for this lot, 2 decimals; supplied on field-pack creation and copied from the source lot by a repack
        constraints: "> 0 and <= 5"
      - name: net_packed_lbs
        type: number
        source: computed
        description: round_half_up(clamshell_count * clamshell_net_weight_lbs, 2)
      - name: pack_completed_at
        type: datetime
        source: input
        description: Instant the lot finished field packing; start of the field-heat clock
      - name: field_pulp_temp_f
        type: number
        source: input
        description: Pulp temperature measured at pack completion, 1 decimal
        constraints: 30.0..110.0
      - name: cool_start_at
        type: datetime
        source: input
        description: Instant the lot entered the tunnel, supplied by the start-cooling call
        default: null
      - name: planned_cool_end_at
        type: datetime
        source: input
        description: Planned tunnel exit instant, supplied by the start-cooling call; end of the reserved occupancy interval
        default: null
      - name: cool_complete_at
        type: datetime
        source: input
        description: Actual tunnel exit instant, supplied by the complete-cooling call
        default: null
      - name: entry_pulp_temp_f
        type: number
        source: input
        description: Pulp temperature at tunnel entry, 1 decimal
        default: null
      - name: exit_pulp_temp_f
        type: number
        source: input
        description: Pulp temperature at tunnel exit, 1 decimal
        default: null
      - name: pallet_slots
        type: integer
        source: input
        description: Tunnel slots the lot occupies while COOLING
        default: null
        constraints: 1..96
      - name: field_delay_hours
        type: number
        source: computed
        description: (cool_start_at - pack_completed_at) in hours, 2 decimals; null before cooling starts
        default: null
      - name: cool_hours
        type: number
        source: computed
        description: (cool_complete_at - cool_start_at) in hours, 2 decimals; null before cooling completes
        default: null
      - name: forecast_shelf_life_days
        type: integer
        source: computed
        description: Forecast variant of calculations.lot_shelf_life
        default: null
      - name: verified_shelf_life_days
        type: integer
        source: computed
        description: Verified variant of calculations.lot_shelf_life; null before cooling completes
        default: null
      - name: shelf_life_expires_on
        type: string
        source: computed
        description: date(cool_complete_at) + verified_shelf_life_days; null before cooling completes
        default: null
        constraints: ISO date
      - name: cold_chain_status
        type: enum
        source: computed
        description: Cold-chain dimension per state_machines.FruitLot (cold_chain_status)
        default: PACKED
        constraints: PACKED | COOLING | COOLED | SHIPPED
      - name: disposition_status
        type: enum
        source: computed
        description: Commercial dimension per state_machines.FruitLot (disposition_status)
        default: UNCOMMITTED
        constraints: UNCOMMITTED | RESERVED | DELIVERED | REJECTED | REPACKED
      - name: allocated_lbs
        type: number
        source: computed
        description: Sum of allocated_lbs over this lot's LotAllocation rows with status IN {RESERVED, SHIPPED}, 2 decimals
        default: 0
      - name: available_lbs
        type: number
        source: computed
        description: net_packed_lbs - allocated_lbs - repack_out_lbs - cull_lbs - optical_reject_lbs, 2 decimals
        default: null
      - name: repack_out_lbs
        type: number
        source: computed
        description: Net pounds moved into the child lot by the repack call, 2 decimals
        default: 0
      - name: cull_lbs
        type: number
        source: computed
        description: Net pounds hand-culled off the packing line by the repack call, 2 decimals
        default: 0
      - name: optical_reject_lbs
        type: number
        source: computed
        description: Net pounds rejected by the optical sorter during the repack call, 2 decimals
        default: 0
      - name: food_safety_hold
        type: boolean
        source: system
        description: True while a block quarantine or lot rejection holds this lot out of commerce
        default: false
      - name: reject_reason_code
        type: string
        source: system
        description: Reason code supplied on rejection
        default: null
      - name: traceability_code
        type: string
        source: computed
        description: "Traceability label composed as '<block.name>-<pick_date as YYYYMMDD>-<grade>-<seq:03d>', seq being 1 + the count of existing lots sharing (block_id, pick_date, grade) in created_at ASC order"

  - name: BuyerCommitment
    parent: null
    common_fields: true
    fields:
      - name: buyer_name
        type: string
        source: input
        description: Buyer program name
        constraints: 1..80 chars
      - name: buyer_user_id
        type: string
        source: input
        description: Opaque identifier of the buyer contact for this program
        constraints: 1..64 chars
      - name: variety
        type: enum
        source: input
        description: Variety the program accepts; allocations must match
        constraints: STRAWBERRY | BLUEBERRY | RASPBERRY | BLACKBERRY
      - name: volume_commitment_lbs
        type: number
        source: input
        description: Contracted volume in pounds, 2 decimals
        constraints: "> 0"
      - name: price_cents_per_lb
        type: integer
        source: input
        description: Contract price in cents per pound
        constraints: 1..10000
      - name: shelf_life_guarantee_days
        type: integer
        source: input
        description: Guaranteed remaining shelf life at delivery, in days
        constraints: 1..30
      - name: window_start_date
        type: string
        source: input
        description: First delivery date of the program
        constraints: ISO date
      - name: window_end_date
        type: string
        source: input
        description: Last delivery date of the program
        constraints: ISO date; ">= window_start_date"
      - name: committed_lbs
        type: number
        source: computed
        description: Sum of allocated_lbs over this commitment's LotAllocation rows with status IN {RESERVED, SHIPPED}, 2 decimals
        default: 0
      - name: shipped_lbs
        type: number
        source: computed
        description: Sum of allocated_lbs over this commitment's LotAllocation rows with status == SHIPPED, 2 decimals
        default: 0
      - name: open_lbs
        type: number
        source: computed
        description: volume_commitment_lbs - committed_lbs, 2 decimals
        default: null
      - name: fill_pct
        type: number
        source: computed
        description: shipped_lbs / volume_commitment_lbs, 4 decimals, round_half_up
        default: 0
      - name: fill_status
        type: enum
        source: computed
        description: PENDING until settlement; FILLED when fill_pct >= FILL_TARGET_PCT (0.95) at settlement; SHORTFALL otherwise
        default: PENDING
        constraints: PENDING | FILLED | SHORTFALL
      - name: risk_flag
        type: enum
        source: computed
        description: AT_RISK once the logical clock date is past window_end_date - RISK_LEAD_DAYS (3) while coverage_pct < FILL_TARGET_PCT (0.95), ON_TRACK otherwise, per calculations.commitment_settlement
        default: ON_TRACK
        constraints: ON_TRACK | AT_RISK
      - name: settled_revenue_cents
        type: integer
        source: computed
        description: Sum of line_net_cents over SHIPPED allocations at settlement
        default: null
      - name: shortfall_penalty_cents
        type: integer
        source: computed
        description: Volume shortfall penalty per calculations.commitment_settlement
        default: null
      - name: settled_net_cents
        type: integer
        source: computed
        description: settled_revenue_cents - shortfall_penalty_cents
        default: null
      - name: status
        type: enum
        source: computed
        description: Program lifecycle state per state_machines.BuyerCommitment
        default: OPEN
        constraints: OPEN | SETTLED | DEFAULTED

  - name: LotAllocation
    parent: null
    common_fields: true
    fields:
      - name: fruit_lot_id
        type: string
        source: input
        description: FK -> FruitLot.id; the lot pledged to the program
      - name: buyer_commitment_id
        type: string
        source: input
        description: FK -> BuyerCommitment.id; the program being filled
      - name: allocated_lbs
        type: number
        source: input
        description: Pounds pledged from the lot, 2 decimals
        constraints: "> 0"
      - name: shipped_at
        type: datetime
        source: input
        description: Instant of pickup, supplied by the ship call
        default: null
      - name: release_reason_code
        type: string
        source: system
        description: Reason code stamped on release, including cascaded releases
        default: null
      - name: shelf_life_shortfall_days
        type: integer
        source: computed
        description: max(0, commitment.shelf_life_guarantee_days - lot.verified_shelf_life_days), stamped at settlement
        default: null
      - name: line_gross_cents
        type: integer
        source: computed
        description: round_half_up(allocated_lbs * commitment.price_cents_per_lb), stamped at settlement
        default: null
      - name: line_discount_cents
        type: integer
        source: computed
        description: Shelf-life shortfall discount, stamped at settlement
        default: null
      - name: line_net_cents
        type: integer
        source: computed
        description: line_gross_cents - line_discount_cents, stamped at settlement
        default: null
      - name: status
        type: enum
        source: computed
        description: Allocation lifecycle state per state_machines.LotAllocation
        default: RESERVED
        constraints: RESERVED | SHIPPED | RELEASED

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: Block
    state_field: food_safety_posture
    initial_state: RESTRICTED
    terminal_states: []
    note: |
      Posture is derived, never supplied. It is recomputed by
      calculations.block_food_safety_posture at the end of every call that
      writes a WaterTest for the block or toggles manual_quarantine_active.
    transitions:
      - from: RESTRICTED
        to: CLEARED
        trigger: "POST /berry-ops/water-tests (posture recompute after the sample is stored)"
        actor: system
        preconditions:
          - "block.manual_quarantine_active == false"
          - "recomputed water_status IN {PROVISIONAL, COMPLIANT}"
        side_effects:
          - "block.water_sample_count, block.water_geomean_mpn, block.water_status, block.last_sample_date refreshed per calculations.water_quality_status"
          - "block.version incremented by 1"

      - from: CLEARED
        to: RESTRICTED
        trigger: "POST /berry-ops/water-tests (posture recompute after the sample is stored)"
        actor: system
        preconditions:
          - "block.manual_quarantine_active == false"
          - "recomputed water_status == NON_COMPLIANT"
        side_effects:
          - "block.water_status set to NON_COMPLIANT; block.water_geomean_mpn refreshed"
          - "block.version incremented by 1"
        note: "Windows already OPEN keep running; only confirm/open of new windows is blocked while posture != CLEARED."

      - from: CLEARED
        to: QUARANTINED
        trigger: "POST /berry-ops/water-tests with generic_ecoli_mpn > 410, or POST /berry-ops/blocks/{block_id}/quarantine"
        actor: FoodSafetyOfficer
        preconditions:
          - "for the sample path: the newest sample by (sample_date ASC, created_at ASC) has generic_ecoli_mpn > SINGLE_SAMPLE_MAX_MPN (410)"
          - "for the manual path: block.manual_quarantine_active == false"
        side_effects:
          - "block.manual_quarantine_active = true; block.quarantined_by_user_id = X-User-ID; block.quarantine_reason_code set ('SINGLE_SAMPLE_EXCEEDANCE' on the sample path)"
          - "CASCADE L1: every HarvestWindow with window.block_id == block.id and status IN {CONFIRMED, OPEN}, processed in (start_at ASC, created_at ASC) order, transitions to SUSPENDED with suspended_reason_code = 'BLOCK_QUARANTINE'"
          - "CASCADE L2 (caused by L1): for each window that just entered SUSPENDED, its PickSession rows in (created_at ASC) order with status IN {OPEN, TALLIED} transition to VOIDED with void_reason_code = 'WINDOW_SUSPENDED', and those with status == APPROVED transition to DISPUTED with dispute_reason_code = 'WINDOW_SUSPENDED'"
          - "CASCADE L3 (caused by L2): for each session that just left APPROVED, crew.accrued_wage_cents is decremented by that session's net_cents, and picker.total_clamshells_lifetime / picker.total_hours_lifetime / picker.avg_lbs_per_hour and window.harvested_clamshells are recomputed over the remaining APPROVED/SETTLED sessions"
          - "every FruitLot with lot.block_id == block.id and disposition_status IN {UNCOMMITTED, RESERVED} has food_safety_hold set to true"
          - "block.version incremented by 1; version of every mutated window, session, crew, picker and lot incremented by 1"

      - from: RESTRICTED
        to: QUARANTINED
        trigger: "POST /berry-ops/water-tests with generic_ecoli_mpn > 410, or POST /berry-ops/blocks/{block_id}/quarantine"
        actor: FoodSafetyOfficer
        preconditions:
          - "block.manual_quarantine_active == false (manual path)"
        side_effects:
          - "identical cascade to the CLEARED -> QUARANTINED transition"

      - from: QUARANTINED
        to: CLEARED
        trigger: "POST /berry-ops/blocks/{block_id}/clear"
        actor: FoodSafetyOfficer
        preconditions:
          - "block.manual_quarantine_active == true"
          - "block.water_status IN {PROVISIONAL, COMPLIANT} (a passing sample recorded after the hold)"
          - "X-User-ID != block.quarantined_by_user_id (segregation of duties)"
        side_effects:
          - "block.manual_quarantine_active = false; posture recomputed to CLEARED"
          - "every FruitLot with lot.block_id == block.id and disposition_status IN {UNCOMMITTED, RESERVED} has food_safety_hold set to false"
          - "SUSPENDED windows are NOT resumed automatically — POST /berry-ops/harvest-windows/{harvest_window_id}/resume is required"
          - "block.version incremented by 1"

  - entity: Crew
    state_field: status
    initial_state: RECRUITING
    terminal_states: [RELEASED]
    transitions:
      - from: RECRUITING
        to: STAFFED
        trigger: "POST /berry-ops/pickers (first picker registered on the crew)"
        actor: system
        preconditions:
          - "crew.picker_count transitions from 0 to 1"
        side_effects:
          - "crew.picker_count recomputed; crew.version incremented by 1"

      - from: STAFFED
        to: CERTIFIED
        trigger: "POST /berry-ops/crews/{crew_id}/certify"
        actor: HarvestManager
        preconditions:
          - "crew.support_plan_complete == true"
          - "every Picker with picker.crew_id == crew.id has hygiene_training_expires_on non-null and hygiene_training_expires_on > current logical clock date"
        side_effects:
          - "crew.status = CERTIFIED; crew.version incremented by 1"

      - from: CERTIFIED
        to: ACTIVE
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/open (first window of the crew to open)"
        actor: system
        preconditions:
          - "crew.status == CERTIFIED"
        side_effects:
          - "crew.status = ACTIVE; crew.version incremented by 1"

      - from: CERTIFIED
        to: RELEASED
        trigger: "POST /berry-ops/crews/{crew_id}/release"
        actor: HarvestManager
        preconditions:
          - "no HarvestWindow with window.crew_id == crew.id in status IN {CONFIRMED, OPEN, SUSPENDED}"
          - "no PickSession of this crew's pickers in status IN {OPEN, TALLIED, DISPUTED}"
          - "crew.accrued_wage_cents == 0"
        side_effects:
          - "crew.status = RELEASED; crew.version incremented by 1"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /berry-ops/crews/{crew_id}/release"
        actor: HarvestManager
        preconditions:
          - "no HarvestWindow with window.crew_id == crew.id in status IN {CONFIRMED, OPEN, SUSPENDED}"
          - "no PickSession of this crew's pickers in status IN {OPEN, TALLIED, DISPUTED}"
          - "crew.accrued_wage_cents == 0"
        side_effects:
          - "crew.status = RELEASED; crew.version incremented by 1"

  - entity: HarvestWindow
    state_field: status
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/confirm"
        actor: HarvestManager
        preconditions:
          - "block.food_safety_posture != QUARANTINED"
          - "window.forecast_brix >= BRIX_MIN[block.variety]"
        side_effects:
          - "window.effective_pick_rate_lbs_per_hour and window.required_picker_count computed by calculations.window_crew_requirement"
          - "window.version incremented by 1"

      - from: CONFIRMED
        to: OPEN
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/open"
        actor: HarvestManager
        preconditions:
          - "block.food_safety_posture == CLEARED (cross-entity gate)"
          - "crew.status IN {CERTIFIED, ACTIVE}"
          - "crew.picker_count >= window.required_picker_count"
          - "current logical clock instant < window.end_at"
        side_effects:
          - "window.status = OPEN; window.version incremented by 1"
          - "if crew.status == CERTIFIED it transitions to ACTIVE (see state_machines.Crew CERTIFIED -> ACTIVE)"

      - from: OPEN
        to: CLOSED
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/close"
        actor: HarvestManager
        preconditions:
          - "no PickSession of this window in status == OPEN"
          - "no FruitLot of this window with cold_chain_status == COOLING"
        side_effects:
          - "window.packed_lbs and window.harvested_clamshells recomputed"
          - "window.version incremented by 1"

      - from: CONFIRMED
        to: SUSPENDED
        trigger: "block quarantine cascade L1 (see state_machines.Block CLEARED -> QUARANTINED)"
        actor: system
        preconditions:
          - "block.food_safety_posture just became QUARANTINED"
        side_effects:
          - "window.suspended_reason_code = 'BLOCK_QUARANTINE'; window.version incremented by 1"

      - from: OPEN
        to: SUSPENDED
        trigger: "block quarantine cascade L1 (see state_machines.Block CLEARED -> QUARANTINED)"
        actor: system
        preconditions:
          - "block.food_safety_posture just became QUARANTINED"
        side_effects:
          - "window.suspended_reason_code = 'BLOCK_QUARANTINE'; window.version incremented by 1"
          - "cascade L2 fires on this window's PickSession rows"

      - from: SUSPENDED
        to: CONFIRMED
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/resume"
        actor: HarvestManager
        preconditions:
          - "block.food_safety_posture == CLEARED"
          - "current logical clock instant < window.end_at"
        side_effects:
          - "window.suspended_reason_code = null; window.required_picker_count recomputed by calculations.window_crew_requirement"
          - "window.version incremented by 1"
        note: "Resume returns the window to CONFIRMED, never straight to OPEN — the open gate must be re-passed."

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/cancel"
        actor: HarvestManager
        preconditions: []
        side_effects:
          - "window.cancel_reason_code set; window.version incremented by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/cancel"
        actor: HarvestManager
        preconditions:
          - "no PickSession of this window in status IN {OPEN, TALLIED, DISPUTED, APPROVED}"
        side_effects:
          - "window.cancel_reason_code set; window.version incremented by 1"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /berry-ops/harvest-windows/{harvest_window_id}/cancel"
        actor: HarvestManager
        preconditions:
          - "no PickSession of this window in status IN {OPEN, TALLIED, DISPUTED, APPROVED}"
        side_effects:
          - "window.cancel_reason_code set; window.version incremented by 1"

  - entity: PickSession
    state_field: status
    initial_state: OPEN
    terminal_states: [SETTLED, VOIDED]
    note: "Cyclic: TALLIED -> DISPUTED -> TALLIED and APPROVED -> DISPUTED -> TALLIED, bounded by MAX_TALLY_REVISIONS."
    transitions:
      - from: OPEN
        to: TALLIED
        trigger: "POST /berry-ops/pick-sessions/{pick_session_id}/tally"
        actor: CrewSupervisor
        preconditions:
          - "window.status == OPEN"
          - "X-User-ID == crew.supervisor_user_id of the window's crew"
        side_effects:
          - "cull_rate, quality_flag, effective_piece_rate_cents, piece_cents, guarantee_floor_cents, makeup_cents, gross_cents, housing_deduction_cents, net_cents computed by calculations.session_pay_per_session"
          - "session.tallied_by_user_id = X-User-ID; session.version incremented by 1"

      - from: DISPUTED
        to: TALLIED
        trigger: "POST /berry-ops/pick-sessions/{pick_session_id}/tally"
        actor: CrewSupervisor
        preconditions:
          - "window.status == OPEN"
          - "session.tally_revision_count < MAX_TALLY_REVISIONS (3)"
          - "X-User-ID == crew.supervisor_user_id of the window's crew"
        side_effects:
          - "session.tally_revision_count incremented by 1; all pay fields recomputed from the new tally inputs"
          - "session.dispute_reason_code = null; session.version incremented by 1"

      - from: TALLIED
        to: APPROVED
        trigger: "POST /berry-ops/pick-sessions/{pick_session_id}/approve"
        actor: PayrollClerk
        preconditions:
          - "session.quality_flag != PENDING"
          - "X-User-ID != session.tallied_by_user_id (segregation of duties)"
        side_effects:
          - "session.approved_by_user_id = X-User-ID"
          - "crew.accrued_wage_cents incremented by session.net_cents"
          - "picker.total_clamshells_lifetime, picker.total_hours_lifetime, picker.avg_lbs_per_hour recomputed by calculations.picker_productivity"
          - "window.harvested_clamshells recomputed"
          - "session.version, crew.version, picker.version, window.version each incremented by 1"

      - from: TALLIED
        to: DISPUTED
        trigger: "POST /berry-ops/pick-sessions/{pick_session_id}/dispute"
        actor: Picker
        preconditions:
          - "window.status == OPEN"
          - "X-User-ID == session.picker_id (the worker owns the session) OR the caller is the window crew's CrewSupervisor"
        side_effects:
          - "session.dispute_reason_code set; session.version incremented by 1"

      - from: APPROVED
        to: DISPUTED
        trigger: "POST /berry-ops/pick-sessions/{pick_session_id}/dispute, or block quarantine cascade L2"
        actor: Picker
        preconditions:
          - "session.payroll_run_id == null (not yet bound by a locked run)"
          - "for the API path: window.status == OPEN and X-User-ID == session.picker_id OR the caller is the window crew's CrewSupervisor"
        side_effects:
          - "COMPENSATION: crew.accrued_wage_cents decremented by session.net_cents — exactly reversing the APPROVED accrual"
          - "picker.total_clamshells_lifetime, picker.total_hours_lifetime, picker.avg_lbs_per_hour and window.harvested_clamshells recomputed over the remaining APPROVED/SETTLED sessions"
          - "session.approved_by_user_id = null; session.dispute_reason_code set"
          - "session.version, crew.version, picker.version, window.version each incremented by 1"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /berry-ops/payroll-runs/{payroll_run_id}/settle (system, for every bound session)"
        actor: system
        preconditions:
          - "session.payroll_run_id == the settling run's id"
        side_effects:
          - "session.status = SETTLED; session.version incremented by 1"

      - from: OPEN
        to: VOIDED
        trigger: "block quarantine cascade L2 (see state_machines.Block CLEARED -> QUARANTINED)"
        actor: system
        preconditions:
          - "the session's window just entered SUSPENDED"
        side_effects:
          - "session.void_reason_code = 'WINDOW_SUSPENDED'; session.version incremented by 1"

      - from: TALLIED
        to: VOIDED
        trigger: "block quarantine cascade L2 (see state_machines.Block CLEARED -> QUARANTINED)"
        actor: system
        preconditions:
          - "the session's window just entered SUSPENDED"
        side_effects:
          - "session.void_reason_code = 'WINDOW_SUSPENDED'; pay fields retained for audit; session.version incremented by 1"

  - entity: PayrollRun
    state_field: status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /berry-ops/payroll-runs/{payroll_run_id}/lock"
        actor: PayrollClerk
        preconditions:
          - "no PickSession of this crew with work_date BETWEEN run.period_start_date AND run.period_end_date in status IN {OPEN, TALLIED, DISPUTED}"
          - "no other PayrollRun of this crew in status == LOCKED"
        side_effects:
          - "every PickSession of this crew with status == APPROVED and work_date BETWEEN period_start_date AND period_end_date and payroll_run_id == null gets payroll_run_id = run.id"
          - "run.bound_session_count, run.period_hours, run.period_piece_cents, run.accrued_gross_cents stamped from the bound set"
          - "run.locked_by_user_id = X-User-ID; run.version incremented by 1; version of every bound session incremented by 1"

      - from: LOCKED
        to: SETTLED
        trigger: "POST /berry-ops/payroll-runs/{payroll_run_id}/settle"
        actor: PayrollClerk
        preconditions:
          - "X-User-ID != run.locked_by_user_id (segregation of duties)"
        side_effects:
          - "run.period_floor_cents, run.period_makeup_cents, run.period_deduction_cents, run.settled_gross_cents, run.settled_net_cents, run.reconciliation_delta_cents computed by calculations.payroll_period_averaged_settlement"
          - "every bound PickSession transitions APPROVED -> SETTLED"
          - "crew.accrued_wage_cents decremented by the sum of net_cents over the bound sessions"
          - "crew.settled_wage_cents incremented by run.settled_net_cents"
          - "crew.reconciliation_delta_cents incremented by (run.settled_net_cents - sum of bound sessions' net_cents)"
          - "run.settled_by_user_id = X-User-ID; run.version and crew.version incremented by 1"

  - entity: FruitLot
    state_field: cold_chain_status
    initial_state: PACKED
    terminal_states: [SHIPPED]
    note: "Cold-chain dimension. Evolves independently of disposition_status — the same row carries both."
    transitions:
      - from: PACKED
        to: COOLING
        trigger: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"
        actor: PackhouseOperator
        preconditions:
          - "lot.disposition_status IN {UNCOMMITTED, RESERVED}"
          - "lot.food_safety_hold == false"
          - "payload cool_start_at >= lot.pack_completed_at and planned_cool_end_at > cool_start_at"
          - "payload expected_cooling_tunnel_version == tunnel.version (see concurrency_rules.cooling-start-stale-tunnel)"
          - "aggregate tunnel occupancy over the requested half-open interval leaves room for pallet_slots (see validations priority 61)"
        side_effects:
          - "lot.cooling_tunnel_id, cool_start_at, planned_cool_end_at, entry_pulp_temp_f, pallet_slots stored; lot.field_delay_hours computed"
          - "lot.forecast_shelf_life_days recomputed by the forecast variant of calculations.lot_shelf_life (planned interval)"
          - "tunnel.committed_slots incremented by pallet_slots; tunnel.version incremented by 1"
          - "lot.version incremented by 1"

      - from: COOLING
        to: COOLED
        trigger: "POST /berry-ops/fruit-lots/{fruit_lot_id}/complete-cooling"
        actor: PackhouseOperator
        preconditions:
          - "payload cool_complete_at > lot.cool_start_at"
        side_effects:
          - "lot.cool_complete_at, exit_pulp_temp_f stored; lot.cool_hours computed"
          - "lot.verified_shelf_life_days and lot.shelf_life_expires_on computed by the verified variant of calculations.lot_shelf_life"
          - "tunnel.committed_slots decremented by lot.pallet_slots; tunnel.version incremented by 1"
          - "lot.version incremented by 1"

      - from: COOLED
        to: SHIPPED
        trigger: "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship (system, on the allocated lot)"
        actor: system
        preconditions:
          - "the shipping allocation's fruit_lot_id == lot.id"
        side_effects:
          - "lot.cold_chain_status = SHIPPED; lot.disposition_status = DELIVERED; lot.version incremented by 1"

  - entity: FruitLot
    state_field: disposition_status
    initial_state: UNCOMMITTED
    terminal_states: [DELIVERED, REJECTED, REPACKED]
    note: "Commercial dimension. A lot can be RESERVED while still COOLING, and can be REJECTED from any non-terminal cold-chain state."
    transitions:
      - from: UNCOMMITTED
        to: RESERVED
        trigger: "POST /berry-ops/lot-allocations"
        actor: SalesManager
        preconditions:
          - "lot.food_safety_hold == false"
          - "allocated_lbs <= lot.available_lbs"
        side_effects:
          - "lot.allocated_lbs and lot.available_lbs recomputed; lot.version incremented by 1"

      - from: RESERVED
        to: UNCOMMITTED
        trigger: "POST /berry-ops/lot-allocations/{lot_allocation_id}/release, or lot-rejection cascade"
        actor: SalesManager
        preconditions:
          - "after the release, the lot has no LotAllocation rows in status IN {RESERVED, SHIPPED}"
        side_effects:
          - "COMPENSATION: lot.allocated_lbs and lot.available_lbs restored to their pre-allocation values; lot.version incremented by 1"

      - from: RESERVED
        to: DELIVERED
        trigger: "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship"
        actor: SalesManager
        preconditions:
          - "lot.cold_chain_status == COOLED (cross-entity gate)"
        side_effects:
          - "lot.cold_chain_status = SHIPPED (see the cold-chain dimension); lot.version incremented by 1"

      - from: UNCOMMITTED
        to: REPACKED
        trigger: "POST /berry-ops/fruit-lots/{fruit_lot_id}/repack"
        actor: PackhouseOperator
        preconditions:
          - "lot.cold_chain_status == COOLED"
          - "lot.food_safety_hold == false"
          - "output_clamshell_count + cull_clamshell_count + optical_reject_clamshell_count == lot.clamshell_count (mass balance)"
        side_effects:
          - "a child FruitLot is created with source_lot_id = lot.id, the same harvest_window_id / block_id / pick_date / variety / clamshell_net_weight_lbs / pack_completed_at / field_pulp_temp_f, grade = payload output_grade, clamshell_count = output_clamshell_count, cold_chain_status = COOLED, disposition_status = UNCOMMITTED, verified_shelf_life_days = max(SHELF_LIFE_FLOOR_DAYS, source.verified_shelf_life_days - REPACK_DERATE_DAYS)"
          - "the child's cooling_tunnel_id, pallet_slots, cool_start_at, planned_cool_end_at, cool_complete_at, cool_hours, entry_pulp_temp_f, exit_pulp_temp_f and forecast_shelf_life_days are copied from the source lot (the child was cooled inside the source pallet), and child.shelf_life_expires_on = date(source.cool_complete_at) + child.verified_shelf_life_days days. The child does NOT re-occupy tunnel slots: tunnel.committed_slots is unchanged because the child is already COOLED"
          - "source lot: repack_out_lbs, cull_lbs, optical_reject_lbs stamped so that net_packed_lbs == repack_out_lbs + cull_lbs + optical_reject_lbs and available_lbs becomes 0.00"
          - "lot.version incremented by 1"

      - from: UNCOMMITTED
        to: REJECTED
        trigger: "POST /berry-ops/fruit-lots/{fruit_lot_id}/reject"
        actor: PackhouseOperator
        preconditions:
          - "lot.cold_chain_status != SHIPPED"
        side_effects:
          - "lot.food_safety_hold = true; lot.available_lbs = 0.00; lot.reject_reason_code set; lot.version incremented by 1"
          - "window.packed_lbs recomputed"

      - from: RESERVED
        to: REJECTED
        trigger: "POST /berry-ops/fruit-lots/{fruit_lot_id}/reject"
        actor: PackhouseOperator
        preconditions:
          - "lot.cold_chain_status != SHIPPED"
        side_effects:
          - "lot.food_safety_hold = true; lot.available_lbs = 0.00; lot.reject_reason_code set"
          - "CASCADE L1: every LotAllocation with allocation.fruit_lot_id == lot.id and status == RESERVED, processed in created_at ASC order, transitions to RELEASED with release_reason_code = 'LOT_REJECTED'"
          - "CASCADE L2 (caused by L1): for each released allocation, commitment.committed_lbs is decremented by allocation.allocated_lbs, commitment.open_lbs and commitment.risk_flag are recomputed, and commitment.version is incremented by 1"
          - "lot.version incremented by 1"

  - entity: BuyerCommitment
    state_field: status
    initial_state: OPEN
    terminal_states: [SETTLED, DEFAULTED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /berry-ops/buyer-commitments/{buyer_commitment_id}/settle"
        actor: SalesManager
        preconditions:
          - "current logical clock date > commitment.window_end_date"
          - "commitment.shipped_lbs > 0"
          - "no LotAllocation of this commitment in status == RESERVED"
        side_effects:
          - "per-line line_gross_cents, line_discount_cents, line_net_cents and shelf_life_shortfall_days stamped on every SHIPPED allocation by calculations.commitment_settlement"
          - "commitment.settled_revenue_cents, shortfall_penalty_cents, settled_net_cents, fill_pct, fill_status stamped"
          - "commitment.version incremented by 1; version of every stamped allocation incremented by 1"

      - from: OPEN
        to: DEFAULTED
        trigger: "POST /berry-ops/buyer-commitments/{buyer_commitment_id}/settle"
        actor: SalesManager
        preconditions:
          - "current logical clock date > commitment.window_end_date"
          - "commitment.shipped_lbs == 0 (empty shipped set)"
          - "no LotAllocation of this commitment in status == RESERVED"
        side_effects:
          - "commitment.settled_revenue_cents = 0; shortfall_penalty_cents = round_half_up(volume_commitment_lbs * price_cents_per_lb * SHORTFALL_PENALTY_RATE); settled_net_cents = 0 - shortfall_penalty_cents"
          - "commitment.fill_pct = 0.0000; fill_status = SHORTFALL; commitment.version incremented by 1"

  - entity: LotAllocation
    state_field: status
    initial_state: RESERVED
    terminal_states: [SHIPPED, RELEASED]
    transitions:
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship"
        actor: SalesManager
        preconditions:
          - "lot.cold_chain_status == COOLED (cross-entity gate)"
          - "lot.food_safety_hold == false"
          - "block.water_status == COMPLIANT for the lot's traceability block"
          - "current logical clock date <= lot.shelf_life_expires_on"
          - "commitment.status == OPEN and payload shipped_at date BETWEEN commitment.window_start_date AND commitment.window_end_date"
        side_effects:
          - "allocation.shipped_at stored; lot.cold_chain_status = SHIPPED and lot.disposition_status = DELIVERED"
          - "commitment.shipped_lbs incremented by allocation.allocated_lbs; commitment.fill_pct recomputed; commitment.version incremented by 1"
          - "allocation.version and lot.version incremented by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /berry-ops/lot-allocations/{lot_allocation_id}/release, or lot-rejection cascade L1"
        actor: SalesManager
        preconditions:
          - "commitment.status == OPEN"
        side_effects:
          - "COMPENSATION: commitment.committed_lbs decremented by allocation.allocated_lbs; commitment.open_lbs and risk_flag recomputed; commitment.version incremented by 1"
          - "lot.allocated_lbs and lot.available_lbs restored; lot.disposition_status returns to UNCOMMITTED when no RESERVED/SHIPPED allocation remains"
          - "allocation.release_reason_code set; allocation.version incremented by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: cooling-start-stale-tunnel
    parent_entity: CoolingTunnel
    write_endpoint: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"
    occ_field: "expected_cooling_tunnel_version"
    description: |
      Pushing a lot into a forced-air tunnel whose version has advanced since
      the client last read it is rejected. The advance means another lot has
      already taken (or released) slots in the requested occupancy interval, so
      the caller's view of committed_slots is stale and the capacity arithmetic
      it based its request on no longer holds. A caller that re-reads the tunnel
      and resubmits with the current version succeeds whenever room remains.
    error_id: ERR_STALE_TUNNEL_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-commitment
    parent_entity: BuyerCommitment
    write_endpoint: "POST /berry-ops/lot-allocations"
    occ_field: "expected_buyer_commitment_version"
    description: |
      Pledging pounds against a BuyerCommitment whose version has advanced
      since the client last read it is rejected. Every accepted allocation,
      release, ship or cascaded release mutates committed_lbs / shipped_lbs and
      advances the commitment's version, so a stale version means the caller
      computed allocated_lbs against an open_lbs figure the server no longer
      holds. Re-reading the commitment and resubmitting succeeds while open_lbs
      still covers the request.
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
#
# Money is integer cents. All decimal arithmetic is exact-decimal (no binary
# float), and every rounding step names its mode explicitly. Where a formula
# says round_half_up(x) with no digit count, the result is a whole cent / whole
# day / whole picker.
# -----------------------------------------------------------------------------
calculations:

  - name: water_quality_status
    trigger: "on POST /berry-ops/water-tests, after the new WaterTest row is stored"
    algorithm: threshold
    formula: |
      window = the WaterTest rows of this block ordered by (sample_date ASC, created_at ASC),
               keeping only the LAST WATER_SAMPLE_WINDOW (5) rows of that ordering
      n = count(window)
      newest = the last row of window                      # highest (sample_date, created_at)

      if n == 0:
          water_sample_count = 0
          water_geomean_mpn  = null
          water_status       = NO_SAMPLES
      else:
          product = product of row.generic_ecoli_mpn for row in window     # every mpn >= 1
          water_geomean_mpn = round_half_up(product ** (1 / n), 1)
          water_sample_count = n
          last_sample_date   = newest.sample_date

          if newest.generic_ecoli_mpn > SINGLE_SAMPLE_MAX_MPN:             # strict >
              water_status = FAILED
          elif n < MIN_SAMPLES_FOR_COMPLIANT:                              # 1 or 2 samples
              water_status = PROVISIONAL
          elif water_geomean_mpn <= GEOMEAN_LIMIT_MPN:                     # inclusive <=
              water_status = COMPLIANT
          else:
              water_status = NON_COMPLIANT

      WaterTest.single_sample_exceedance = (this row's generic_ecoli_mpn > SINGLE_SAMPLE_MAX_MPN)
      WaterTest.resulting_water_status   = the water_status just computed
    input_set: |
      Only the trailing five WaterTest rows of the block by (sample_date ASC,
      created_at ASC). Older samples are excluded entirely — they neither raise
      nor lower the geometric mean. WaterTest rows of other blocks are never
      included. WaterTest is append-only (common_fields: false), so a sample
      once recorded can never be edited out of the window.
    constants:
      SINGLE_SAMPLE_MAX_MPN: 410          # MPN/100 mL, single-sample maximum
      GEOMEAN_LIMIT_MPN: 126              # MPN/100 mL, geometric-mean criterion
      WATER_SAMPLE_WINDOW: 5              # rolling sample count
      MIN_SAMPLES_FOR_COMPLIANT: 3        # fewer than this can only be PROVISIONAL
    precision: |
      water_geomean_mpn: 1 decimal place, round_half_up. The COMPLIANT
      comparison uses the STORED rounded value, not the unrounded root — a raw
      root of 126.04 stores 126.0 and is therefore COMPLIANT, while a raw root
      of 126.17 stores 126.2 and is NON_COMPLIANT.

  - name: block_food_safety_posture
    trigger: |
      Recomputed at the end of every call that stores a WaterTest for the block
      (POST /berry-ops/water-tests) or toggles the manual hold
      (POST /berry-ops/blocks/{block_id}/quarantine,
      POST /berry-ops/blocks/{block_id}/clear).
    algorithm: projection
    formula: |
      if block.manual_quarantine_active:
          food_safety_posture = QUARANTINED
      elif block.water_status in {PROVISIONAL, COMPLIANT}:
          food_safety_posture = CLEARED
      else:                                    # NO_SAMPLES, NON_COMPLIANT, FAILED
          food_safety_posture = RESTRICTED

      # a FAILED status also SETS manual_quarantine_active = true inside the
      # same water-test call, so a single-sample exceedance always lands on
      # QUARANTINED, never on RESTRICTED.
    input_set: "This block's manual_quarantine_active flag and its recomputed water_status only."
    constants: {}
    precision: "Enum, no arithmetic."

  - name: window_crew_requirement
    trigger: |
      On POST /berry-ops/harvest-windows/{harvest_window_id}/confirm and again
      on POST /berry-ops/harvest-windows/{harvest_window_id}/resume.
    algorithm: threshold
    formula: |
      base_rate = VARIETY_PICK_RATE[block.variety]                  # lbs per picker-hour
      if window.forecast_brix >= BRIX_TARGET[block.variety]:
          maturity_multiplier = RIPE_MULTIPLIER                     # 1.10
      else:
          maturity_multiplier = 1.00                                # brix below BRIX_MIN is rejected earlier
      effective_pick_rate_lbs_per_hour = round_half_up(base_rate * maturity_multiplier, 2)

      window_hours = round_half_up((window.end_at - window.start_at) in hours, 2)
      crew_capacity_lbs = effective_pick_rate_lbs_per_hour * window_hours
      required_picker_count = max(MIN_PICKER_FLOOR,
                                  ceil(window.planned_volume_lbs / crew_capacity_lbs))
    input_set: |
      The window's own start_at / end_at / forecast_brix / planned_volume_lbs
      plus the variety of the window's Block. No PickSession or Picker row
      participates — this is a forward-looking staffing estimate, not an actual.
    constants:
      VARIETY_PICK_RATE: {STRAWBERRY: 22, BLUEBERRY: 18, RASPBERRY: 12, BLACKBERRY: 14}
      BRIX_MIN: {STRAWBERRY: 7.0, BLUEBERRY: 10.0, RASPBERRY: 8.0, BLACKBERRY: 8.5}
      BRIX_TARGET: {STRAWBERRY: 9.0, BLUEBERRY: 12.0, RASPBERRY: 10.0, BLACKBERRY: 10.5}
      RIPE_MULTIPLIER: 1.10
      MIN_PICKER_FLOOR: 1
      CREW_CAP: 60                        # required_picker_count above this is rejected at confirm
    precision: |
      effective_pick_rate_lbs_per_hour: 2 dp round_half_up.
      window_hours: 2 dp round_half_up.
      required_picker_count: integer, CEILING of the quotient (a partial picker
      is a whole picker), then floored at MIN_PICKER_FLOOR.
      Worked example: STRAWBERRY, forecast_brix 8.5 (< 9.0 target) ->
      multiplier 1.00 -> rate 22.00; an 8.00 h window -> capacity 176.0000 lbs;
      planned_volume_lbs 150.00 -> 150.00/176.0000 = 0.8523 -> ceil 1 ->
      required_picker_count 1.
      Worked example: BLUEBERRY, forecast_brix 12.5 (>= 12.0) -> multiplier 1.10
      -> rate 19.80; a 7.50 h window -> capacity 148.5000; planned_volume_lbs
      300.00 -> 2.0202 -> ceil 3 -> required_picker_count 3.

  - name: session_pay_per_session
    trigger: "On POST /berry-ops/pick-sessions/{pick_session_id}/tally (every tally, including re-tallies out of DISPUTED)."
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: quality grading of the row-pack tally -------------------
      if session.clamshells_filled == 0:
          cull_rate = 0.0000
      else:
          cull_rate = round_half_up(session.culled_clamshells / session.clamshells_filled, 4)
      quality_flag = MEETS_STANDARD if cull_rate <= MAX_CULL_RATE else BELOW_STANDARD

      # ---- step 2: the effective piece rate --------------------------------
      if quality_flag == MEETS_STANDARD:
          effective_piece_rate_cents = window.piece_rate_cents_per_clamshell
      else:
          effective_piece_rate_cents = round_half_up(
              window.piece_rate_cents_per_clamshell * (1 - QUALITY_DERATE_PCT))

      # ---- step 3: piece earnings (culls are never paid) -------------------
      saleable_clamshells = session.clamshells_filled - session.culled_clamshells
      piece_cents = effective_piece_rate_cents * saleable_clamshells

      # ---- step 4: the minimum-wage guarantee, PER SESSION -----------------
      guarantee_floor_cents = round_half_up(session.hours_worked * MIN_WAGE_CENTS_PER_HOUR)
      makeup_cents = max(0, guarantee_floor_cents - piece_cents)
      gross_cents  = piece_cents + makeup_cents

      # ---- step 5: housing deduction, capped against the MADE-WHOLE gross --
      # ORDERING IS LOAD-BEARING: the guarantee is satisfied first, then the
      # deduction cap is taken as a percentage of the resulting gross_cents.
      # The deduction may never be applied before the make-up, and the cap may
      # never be computed against piece_cents or against net_cents.
      if crew.labor_program == H2A and crew.housing_unit_code is not null:
          housing_deduction_cents = min(HOUSING_DAILY_DEDUCTION_CENTS,
                                        floor(gross_cents * DEDUCTION_GROSS_CAP_PCT))
      else:
          housing_deduction_cents = 0
      net_cents = gross_cents - housing_deduction_cents
    input_set: |
      Exactly one PickSession row plus its HarvestWindow (piece rate, clamshell
      net weight) and the window's Crew (labor_program, housing_unit_code). No
      sibling session of the same picker, day or window participates — that is
      the whole point of the per-session variant.
    constants:
      MIN_WAGE_CENTS_PER_HOUR: 1650
      MAX_CULL_RATE: 0.08
      QUALITY_DERATE_PCT: 0.20
      HOUSING_DAILY_DEDUCTION_CENTS: 900
      DEDUCTION_GROSS_CAP_PCT: 0.10
    precision: |
      cull_rate: 4 dp round_half_up. Money: whole cents. guarantee_floor_cents
      and effective_piece_rate_cents use round_half_up; the deduction cap uses
      FLOOR so a rounding step can never take more from the worker than 10% of
      gross.
      Worked example (DOMESTIC, no housing): hours_worked 3.00, clamshells 20,
      culled 0, piece rate 45 -> piece_cents 900, guarantee_floor_cents 4950,
      makeup_cents 4050, gross_cents 4950, net_cents 4950.
      Worked example (H2A with housing): hours_worked 2.00, clamshells 10,
      culled 0, piece rate 45 -> piece_cents 450, guarantee_floor_cents 3300,
      makeup_cents 2850, gross_cents 3300, housing_deduction_cents
      min(900, floor(330.0)) = 330, net_cents 2970.
    variants:
      - name: per_session_guarantee
        when: "PickSession tally — the worker's daily pay statement."
        difference: |
          The minimum-wage floor is evaluated against ONE session's hours and
          ONE session's piece earnings, so a slow session is topped up even when
          a fast session on the same crew and period earned far above the floor.
          The housing deduction cap is evaluated against that single session's
          gross.
      - name: period_averaged_settlement
        when: "PayrollRun settle — the payable amount for the pay period."
        difference: |
          See calculations.payroll_period_averaged_settlement: hours are summed
          across the bound session set BEFORE the multiplication by
          MIN_WAGE_CENTS_PER_HOUR, piece earnings are summed before the
          comparison, and the housing cap applies once to the period gross.
          For identical underlying tallies the two variants disagree whenever
          any single session fell below the floor while the period as a whole
          did not; the difference is recorded as reconciliation_delta_cents.

  - name: payroll_period_averaged_settlement
    trigger: "On POST /berry-ops/payroll-runs/{payroll_run_id}/settle."
    algorithm: aggregation
    formula: |
      S = the bound session set (see input_set)

      period_hours       = sum(s.hours_worked for s in S)
      period_piece_cents = sum(s.piece_cents  for s in S)

      # hours are SUMMED FIRST, then multiplied once — not per-session floors summed
      period_floor_cents   = round_half_up(period_hours * MIN_WAGE_CENTS_PER_HOUR)
      period_makeup_cents  = max(0, period_floor_cents - period_piece_cents)
      settled_gross_cents  = period_piece_cents + period_makeup_cents

      # the housing cap applies ONCE, to the period gross
      housing_sessions = [s for s in S if crew.labor_program == H2A
                                       and crew.housing_unit_code is not null]
      period_deduction_cents = min(
          HOUSING_DAILY_DEDUCTION_CENTS * count(housing_sessions),
          floor(settled_gross_cents * DEDUCTION_GROSS_CAP_PCT))
      settled_net_cents = settled_gross_cents - period_deduction_cents

      accrued_gross_cents          = sum(s.gross_cents for s in S)      # stamped at lock
      reconciliation_delta_cents   = settled_net_cents - sum(s.net_cents for s in S)
      bound_session_count          = count(S)

      # empty-set boundary: S == [] -> every figure above is 0 and the settle
      # SUCCEEDS. An empty run is a legitimate zero-pay period, not an error.
    input_set: |
      Every PickSession whose payroll_run_id equals this run's id — i.e. exactly
      the set frozen at lock time (status APPROVED, work_date inside
      [period_start_date, period_end_date], payroll_run_id previously null).
      Sessions still OPEN, TALLIED, DISPUTED or VOIDED are excluded, and a
      session disputed after lock is impossible because the DISPUTE precondition
      requires payroll_run_id == null. Sessions of other crews are never bound.
    constants:
      MIN_WAGE_CENTS_PER_HOUR: 1650
      HOUSING_DAILY_DEDUCTION_CENTS: 900
      DEDUCTION_GROSS_CAP_PCT: 0.10
    precision: |
      period_hours: 2 dp. Money: whole cents, round_half_up except the FLOOR on
      the deduction cap. reconciliation_delta_cents is signed and may be
      negative (the period view paid less than the sum of the session views).
      Worked example, two DOMESTIC sessions of the same picker, piece rate 45,
      clamshell weight 1.00: session A hours 3.00 / 20 clamshells / 0 culled ->
      piece 900, floor 4950, makeup 4050, gross 4950, net 4950; session B hours
      3.00 / 200 clamshells / 0 culled -> piece 9000, floor 4950, makeup 0,
      gross 9000, net 9000. Period: period_hours 6.00, period_piece_cents 9900,
      period_floor_cents 9900, period_makeup_cents 0, settled_gross_cents 9900,
      period_deduction_cents 0, settled_net_cents 9900, and
      reconciliation_delta_cents 9900 - 13950 = -4050.

  - name: picker_productivity
    trigger: |
      Whenever a PickSession of the picker enters or leaves the paid set:
      POST /berry-ops/pick-sessions/{pick_session_id}/approve,
      POST /berry-ops/pick-sessions/{pick_session_id}/dispute out of APPROVED,
      the quarantine cascade's APPROVED -> DISPUTED and -> VOIDED steps, and
      POST /berry-ops/payroll-runs/{payroll_run_id}/settle.
    algorithm: aggregation
    formula: |
      P = sessions of this picker with status in {APPROVED, SETTLED}

      total_clamshells_lifetime = sum(s.clamshells_filled - s.culled_clamshells for s in P)
      total_hours_lifetime      = sum(s.hours_worked for s in P)
      paid_lbs = sum((s.clamshells_filled - s.culled_clamshells)
                     * window(s).clamshell_net_weight_lbs for s in P)

      if total_hours_lifetime == 0:
          avg_lbs_per_hour = 0.00
      else:
          avg_lbs_per_hour = round_half_up(paid_lbs / total_hours_lifetime, 2)
    input_set: |
      FULL RECOMPUTE over the picker's APPROVED and SETTLED sessions, never an
      incremental delta. OPEN, TALLIED, DISPUTED and VOIDED sessions contribute
      nothing, so a reversal restores the pre-approval figures exactly.
    constants: {}
    precision: "total_hours_lifetime 2 dp; avg_lbs_per_hour 2 dp round_half_up."

  - name: lot_shelf_life
    trigger: |
      Forecast variant on POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling;
      verified variant on POST /berry-ops/fruit-lots/{fruit_lot_id}/complete-cooling.
    algorithm: decay_function
    formula: |
      base_days   = VARIETY_BASE_SHELF_LIFE[lot.variety]
      grade_derate = GRADE_DERATE[lot.grade]

      field_delay_hours = round_half_up((lot.cool_start_at - lot.pack_completed_at) in hours, 2)
      field_penalty     = ceil(max(0.00, field_delay_hours - FIELD_HEAT_MAX_HOURS))

      # cool_hours is the ONLY input that differs between the two variants
      cool_hours   = round_half_up((cool_end_instant - lot.cool_start_at) in hours, 2)
      cool_penalty = ceil(max(0.00, cool_hours - TARGET_COOL_HOURS))

      temp_penalty = floor(max(0.0, exit_pulp_temp_f - EXIT_TEMP_TARGET_F) / EXIT_TEMP_STEP_F)

      shelf_life_days = max(SHELF_LIFE_FLOOR_DAYS,
                            base_days - grade_derate - field_penalty
                                      - cool_penalty - temp_penalty)
    input_set: |
      One FruitLot row plus the variety/grade constants. Sibling lots in the
      same tunnel do not affect a lot's shelf life; tunnel occupancy is a
      capacity question, not a quality one. A repacked child lot starts from its
      SOURCE lot's verified figure minus REPACK_DERATE_DAYS instead of running
      this formula again (see state_machines.FruitLot UNCOMMITTED -> REPACKED).
    constants:
      VARIETY_BASE_SHELF_LIFE: {STRAWBERRY: 7, BLUEBERRY: 14, RASPBERRY: 5, BLACKBERRY: 6}
      GRADE_DERATE: {A: 0, B: 1, CULL: 3}
      FIELD_HEAT_MAX_HOURS: 2.0            # hours from pack to cool start before penalties start
      TARGET_COOL_HOURS: 4.0               # 7/8-cool target for forced-air
      EXIT_TEMP_TARGET_F: 34.0
      EXIT_TEMP_STEP_F: 2.0                # one lost day per FULL 2 degF above target
      SHELF_LIFE_FLOOR_DAYS: 1
      REPACK_DERATE_DAYS: 1
    precision: |
      field_delay_hours and cool_hours: 2 dp round_half_up. field_penalty and
      cool_penalty use CEILING (any part of an hour past the target costs a full
      day); temp_penalty uses FLOOR (only a FULL 2 degF step costs a day).
      shelf_life_days is an integer floored at SHELF_LIFE_FLOOR_DAYS.
      shelf_life_expires_on = date(lot.cool_complete_at) + verified_shelf_life_days days.
    variants:
      - name: forecast_shelf_life
        when: "start-cooling — stamped into forecast_shelf_life_days."
        difference: |
          cool_end_instant is the PLANNED end (lot.planned_cool_end_at) and
          temp_penalty is fixed at 0 because no exit pulp temperature has been
          measured yet. The forecast is therefore an upper bound.
          Worked example: STRAWBERRY grade A (base 7, derate 0),
          pack_completed_at 2026-08-01T06:00:00Z, cool_start_at
          2026-08-01T09:30:00Z -> field_delay_hours 3.50 -> field_penalty 2;
          planned_cool_end_at 2026-08-01T13:30:00Z -> cool_hours 4.00 ->
          cool_penalty 0; temp_penalty 0 -> forecast_shelf_life_days 5.
      - name: verified_shelf_life
        when: "complete-cooling — stamped into verified_shelf_life_days and shelf_life_expires_on."
        difference: |
          cool_end_instant is the ACTUAL lot.cool_complete_at and temp_penalty is
          computed from the measured exit_pulp_temp_f, so a tunnel that ran long
          or came out warm is charged twice — once through cool_penalty and once
          through temp_penalty.
          Worked example, same lot as above: cool_complete_at
          2026-08-01T15:00:00Z -> cool_hours 5.50 -> cool_penalty 2;
          exit_pulp_temp_f 37.0 -> floor(3.0 / 2.0) = 1 -> verified_shelf_life_days
          7 - 0 - 2 - 2 - 1 = 2, shelf_life_expires_on 2026-08-03. Same lot,
          forecast 5 vs verified 2.

  - name: lot_pack_mass_balance
    trigger: |
      net_packed_lbs / available_lbs / traceability_code on POST /berry-ops/fruit-lots;
      allocated_lbs and available_lbs on every LotAllocation create / ship /
      release; repack_out_lbs, cull_lbs and optical_reject_lbs on
      POST /berry-ops/fruit-lots/{fruit_lot_id}/repack.
    algorithm: aggregation
    formula: |
      net_packed_lbs = round_half_up(lot.clamshell_count * lot.clamshell_net_weight_lbs, 2)
      allocated_lbs  = sum(a.allocated_lbs for a in allocations of this lot
                           with a.status in {RESERVED, SHIPPED})
      available_lbs  = round_half_up(net_packed_lbs - allocated_lbs - repack_out_lbs
                                     - cull_lbs - optical_reject_lbs, 2)
                       # forced to 0.00 by REJECTED, and driven to 0.00 by REPACKED
                       # because the three repack terms then sum to net_packed_lbs

      # repack split (optical sorter output), all in clamshells of the SOURCE lot:
      # output_clamshell_count + cull_clamshell_count + optical_reject_clamshell_count
      #   must equal lot.clamshell_count exactly
      repack_out_lbs     = round_half_up(output_clamshell_count        * clamshell_net_weight_lbs, 2)
      cull_lbs           = round_half_up(cull_clamshell_count          * clamshell_net_weight_lbs, 2)
      optical_reject_lbs = round_half_up(optical_reject_clamshell_count * clamshell_net_weight_lbs, 2)
      # invariant: repack_out_lbs + cull_lbs + optical_reject_lbs == net_packed_lbs

      traceability_code = "<block.name>-<pick_date as YYYYMMDD>-<grade>-<seq:03d>"
      # seq = 1 + count of existing FruitLot rows sharing (block_id, pick_date,
      # grade), so codes are assigned in created_at ASC order and never draw on
      # a random id.
    input_set: |
      The lot's own clamshell figures plus its RESERVED and SHIPPED allocations.
      RELEASED allocations are excluded, which is what makes a release restore
      available_lbs exactly.
    constants: {}
    precision: "Pounds: 2 dp round_half_up. Clamshell counts: integers, exact."

  - name: tunnel_occupancy
    trigger: |
      On POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling, before the lot
      is admitted to the tunnel.
    algorithm: interval_merge
    formula: |
      request = [payload.cool_start_at, payload.planned_cool_end_at)      # half-open
      occupants = lots with cooling_tunnel_id == tunnel.id
                  and cold_chain_status == COOLING
                  and cool_start_at        <  request.end
                  and planned_cool_end_at  >  request.start      # strict both sides
      occupied_slots = sum(o.pallet_slots for o in occupants)
      admitted = (occupied_slots + payload.pallet_slots) <= tunnel.slot_capacity
    input_set: |
      Only lots currently in cold_chain_status COOLING in this tunnel. A lot that
      has completed cooling has released its slots (tunnel.committed_slots was
      decremented) and no longer occupies the interval, even though its
      cool_start_at / planned_cool_end_at values are still stored.
    constants: {}
    precision: |
      Integer slots. Intervals are HALF-OPEN: a lot whose planned_cool_end_at
      equals the request's cool_start_at does NOT overlap and its slots are
      free, i.e. back-to-back tunnel runs are legal. This is deliberately the
      opposite of the Block re-entry rule in
      calculations.block_window_separation, where adjacency is rejected.

  - name: block_window_separation
    trigger: "On POST /berry-ops/harvest-windows and on POST /berry-ops/harvest-windows/{harvest_window_id}/confirm."
    algorithm: interval_merge
    formula: |
      others = HarvestWindow rows with block_id == candidate.block_id,
               id != candidate.id,
               status in {PLANNED, CONFIRMED, OPEN, SUSPENDED}     # CLOSED/CANCELLED are ignored
      buffer = BLOCK_REENTRY_BUFFER_HOURS hours

      conflict = any other in others where
                 candidate.start_at <  other.end_at   + buffer  and
                 candidate.end_at   + buffer >  other.start_at
    input_set: |
      Only live windows of the SAME block. Windows of other blocks and windows in
      CLOSED or CANCELLED never conflict, so cancelling a window frees its slot
      immediately.
    constants:
      BLOCK_REENTRY_BUFFER_HOURS: 12       # worker re-entry / spray interval on a picked block
    precision: |
      Instant comparisons at second resolution. The buffer makes adjacency a
      CONFLICT: a candidate starting exactly at another window's end_at is
      rejected, and so is one starting 11:59:59 after it. Contrast
      calculations.tunnel_occupancy, where adjacency is admitted.

  - name: commitment_settlement
    trigger: |
      committed_lbs / shipped_lbs / open_lbs / fill_pct / risk_flag on every
      POST /berry-ops/lot-allocations, .../ship and .../release; the money
      figures on POST /berry-ops/buyer-commitments/{buyer_commitment_id}/settle.
    algorithm: tiered_pricing
    formula: |
      # ---- running exposure, recomputed on every allocation event ----------
      committed_lbs = sum(a.allocated_lbs for a in allocations with status in {RESERVED, SHIPPED})
      shipped_lbs   = sum(a.allocated_lbs for a in allocations with status == SHIPPED)
      open_lbs      = max(0.00, round_half_up(volume_commitment_lbs - committed_lbs, 2))
      fill_pct      = round_half_up(shipped_lbs / volume_commitment_lbs, 4)
      coverage_pct  = round_half_up(committed_lbs / volume_commitment_lbs, 4)
      risk_flag     = AT_RISK if (current logical clock date > window_end_date - RISK_LEAD_DAYS
                                  and coverage_pct < FILL_TARGET_PCT) else ON_TRACK

      # ---- settlement, PER SHIPPED LINE, ordered (shipped_at ASC, created_at ASC)
      for each SHIPPED allocation a of this commitment:
          shelf_life_shortfall_days = max(0, commitment.shelf_life_guarantee_days
                                             - lot(a).verified_shelf_life_days)
          discount_pct = min(SHELF_LIFE_DISCOUNT_CAP_PCT,
                             shelf_life_shortfall_days * SHELF_LIFE_DISCOUNT_PER_DAY)
          line_gross_cents    = round_half_up(a.allocated_lbs * commitment.price_cents_per_lb)
          line_discount_cents = round_half_up(line_gross_cents * discount_pct)
          line_net_cents      = line_gross_cents - line_discount_cents

      # EACH LINE IS ROUNDED SEPARATELY AND ONLY THEN SUMMED. Rounding the
      # aggregate instead is a different number.
      settled_revenue_cents = sum(line_net_cents over the SHIPPED lines)

      fill_status = FILLED if fill_pct >= FILL_TARGET_PCT else SHORTFALL
      if fill_status == FILLED:
          shortfall_penalty_cents = 0
      else:
          shortfall_penalty_cents = round_half_up(
              (volume_commitment_lbs - shipped_lbs) * price_cents_per_lb * SHORTFALL_PENALTY_RATE)
      settled_net_cents = settled_revenue_cents - shortfall_penalty_cents
      # shipped_lbs == 0 -> revenue 0, fill_pct 0.0000, SHORTFALL, and the
      # commitment settles into DEFAULTED rather than SETTLED.
    input_set: |
      SHIPPED allocations only for the money; RESERVED and SHIPPED for
      committed_lbs; RELEASED allocations are excluded everywhere, so a released
      line leaves no trace in revenue or exposure. Allocations of other
      commitments never participate.
    constants:
      FILL_TARGET_PCT: 0.95
      SHORTFALL_PENALTY_RATE: 0.15
      SHELF_LIFE_DISCOUNT_PER_DAY: 0.05
      SHELF_LIFE_DISCOUNT_CAP_PCT: 0.30
      RISK_LEAD_DAYS: 3
    precision: |
      fill_pct and coverage_pct: 4 dp round_half_up. Money: whole cents,
      round_half_up, applied once per line.
      Worked example, price_cents_per_lb 380, shelf_life_guarantee_days 5, two
      SHIPPED lines whose lots both verified 4 days (shortfall 1 ->
      discount_pct 0.05): line A 120.50 lbs -> gross 45790, discount
      round_half_up(2289.50) = 2290, net 43500; line B 90.30 lbs -> gross 34314,
      discount round_half_up(1715.70) = 1716, net 32598;
      settled_revenue_cents = 76098. Rounding the aggregate instead
      (round_half_up(80104 * 0.05) = 4005 -> 76099) is WRONG by one cent.
      With volume_commitment_lbs 220.00, shipped_lbs 210.80 -> fill_pct 0.9582
      >= 0.95 -> FILLED, shortfall_penalty_cents 0, settled_net_cents 76098.

  - name: crew_wage_ledger
    trigger: |
      Incremented on PickSession TALLIED -> APPROVED; decremented on
      APPROVED -> DISPUTED (API or quarantine cascade) and on payroll settle.
    algorithm: chronological
    formula: |
      # accrued_wage_cents is a running liability, adjusted by signed deltas in
      # the order the transitions are applied.
      on APPROVED:              accrued_wage_cents += session.net_cents
      on APPROVED -> DISPUTED:  accrued_wage_cents -= session.net_cents
      on payroll settle:        accrued_wage_cents -= sum(s.net_cents for s in bound set)
                                settled_wage_cents += run.settled_net_cents
                                reconciliation_delta_cents += (run.settled_net_cents
                                                               - sum(s.net_cents for s in bound set))

      # INVARIANT (checked by the compensating-invariant tests):
      # accrued_wage_cents == sum(s.net_cents for s in sessions of this crew's
      #                           pickers with status == APPROVED)
      # at the end of EVERY request, for every crew.
    input_set: |
      APPROVED sessions of pickers whose crew_id is this crew. VOIDED sessions
      are excluded, which is why the quarantine cascade must decrement for the
      APPROVED -> DISPUTED step and must NOT decrement for OPEN/TALLIED -> VOIDED
      (those never accrued).
    constants: {}
    precision: "Whole cents. Deltas are exact reversals — the ledger never drifts by a rounding step, because the same stored session.net_cents is added and subtracted."

  - name: block_traceability_summary
    trigger: "On GET /berry-ops/blocks/{block_id}/traceability-summary."
    algorithm: aggregation
    formula: |
      lots = FruitLot rows with block_id == block.id, ordered (pick_date ASC, created_at ASC)
      pick_date_count   = count of distinct lot.pick_date over lots
      lot_count         = count(lots)
      total_packed_lbs  = round_half_up(sum(l.net_packed_lbs for l in lots), 2)
      shipped_lbs       = round_half_up(sum(l.net_packed_lbs for l in lots
                                            if l.disposition_status == DELIVERED), 2)
      held_lot_count    = count(l for l in lots if l.food_safety_hold)
      rejected_lot_count = count(l for l in lots if l.disposition_status == REJECTED)
      water_status      = block.water_status
      food_safety_posture = block.food_safety_posture
      earliest_pick_date = lots[0].pick_date if lots else null
      latest_pick_date   = lots[-1].pick_date if lots else null
    input_set: "Every FruitLot of the block regardless of status, including REPACKED parents and their children (children carry the same block_id)."
    constants: {}
    precision: "Pounds 2 dp round_half_up; counts are integers; an empty block returns zeros and null dates, never a 404."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated rule determines the response, and no side effect of the request is
# applied once a rule fires)
#
# Tier map:
#   1-2    authentication
#   3-4    authorization (role)
#   5-9    path existence (left to right)
#   10-15  body schema / enum / range
#   16-19  body foreign-key existence
#   20-22  ownership
#   23-24  optimistic concurrency (stale parent version)
#   25-37  state preconditions
#   38-44  business_safety (food safety and labor compliance)
#   45-51  business_constraint (uniqueness, segregation of duties, mass balance)
#   52-54  business_referential (cross-entity coherence)
#   55-59  business_temporal (windows, expiry, ordering of instants)
#   60-64  business_fiscal (capacity and quota)
#   65-66  appended rows (see each row's check for why its late position is
#          behaviourally equivalent or deliberate)
# -----------------------------------------------------------------------------
validations:

  # ---- tier 1: authentication ------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared role names in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- tier 2: authorization -------------------------------------------------
  - priority: 3
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role is Picker, X-User-ID is the id of an existing Picker row (identity: entity_backed:Picker)."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/dispute, GET /berry-ops/pick-sessions/{pick_session_id}, GET /berry-ops/pick-sessions"

  # ---- tier 3: path existence (left to right) --------------------------------
  - priority: 5
    category: existence
    check: "{block_id} in the path resolves to a Block."
    error_id: ERR_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {block_id}"

  - priority: 6
    category: existence
    check: "{crew_id} resolves to a Crew; {picker_id} resolves to a Picker."
    error_id: ERR_CREW_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {crew_id} or {picker_id} (ERR_PICKER_NOT_FOUND for {picker_id})"

  - priority: 7
    category: existence
    check: "{harvest_window_id} resolves to a HarvestWindow; {pick_session_id} resolves to a PickSession; {payroll_run_id} resolves to a PayrollRun."
    error_id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {harvest_window_id}, {pick_session_id} (ERR_SESSION_NOT_FOUND) or {payroll_run_id} (ERR_PAYROLL_RUN_NOT_FOUND)"

  - priority: 8
    category: existence
    check: "{fruit_lot_id} resolves to a FruitLot; {cooling_tunnel_id} resolves to a CoolingTunnel."
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {fruit_lot_id} or {cooling_tunnel_id} (ERR_TUNNEL_NOT_FOUND)"

  - priority: 9
    category: existence
    check: "{buyer_commitment_id} resolves to a BuyerCommitment; {lot_allocation_id} resolves to a LotAllocation."
    error_id: ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {buyer_commitment_id} or {lot_allocation_id} (ERR_ALLOCATION_NOT_FOUND)"

  # ---- tier 4: body schema, enums and ranges ---------------------------------
  - priority: 10
    category: business_constraint
    check: "Every field declared required in the endpoint's input list is present and of the declared JSON type."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 11
    category: business_constraint
    check: "Enum-typed body fields carry a declared value: variety in {STRAWBERRY, BLUEBERRY, RASPBERRY, BLACKBERRY}, labor_program in {DOMESTIC, H2A}, grade in {A, B, CULL}."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "POST /berry-ops/blocks, POST /berry-ops/crews, POST /berry-ops/fruit-lots, POST /berry-ops/buyer-commitments"

  - priority: 12
    category: business_constraint
    check: "Numeric body fields respect their declared ranges: acres > 0, generic_ecoli_mpn >= 1, hours_worked > 0.00 and <= 16.00, clamshells_filled >= 0, culled_clamshells >= 0, piece_rate_cents_per_clamshell >= 1, clamshell_net_weight_lbs > 0.00, clamshell_count >= 1, pallet_slots >= 1, slot_capacity >= 1, allocated_lbs > 0.00, volume_commitment_lbs > 0.00, price_cents_per_lb >= 1, shelf_life_guarantee_days >= 1, planned_head_count >= 1, vehicle_seats >= 0, beds_confirmed >= 0."
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 13
    category: business_constraint
    check: "culled_clamshells <= clamshells_filled on a tally."
    error_id: ERR_CULL_EXCEEDS_TALLY
    http_status: 400
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/tally"

  - priority: 14
    category: business_constraint
    check: "Instant and date pairs are correctly ordered within the body: end_at > start_at, period_end_date >= period_start_date, window_end_date >= window_start_date, planned_cool_end_at > cool_start_at, contract_end_date >= contract_start_date."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /berry-ops/harvest-windows, POST /berry-ops/payroll-runs, POST /berry-ops/buyer-commitments, POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling, POST /berry-ops/crews"

  - priority: 15
    category: business_constraint
    check: "Timestamps parse as RFC 3339 UTC instants ending in Z and dates as YYYY-MM-DD."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints carrying an instant or date"

  # ---- tier 5: body foreign-key existence ------------------------------------
  - priority: 16
    category: existence
    check: "block_id in the body resolves to a Block."
    error_id: ERR_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "POST /berry-ops/water-tests, POST /berry-ops/harvest-windows, POST /berry-ops/fruit-lots"

  - priority: 17
    category: existence
    check: "crew_id resolves to a Crew and picker_id resolves to a Picker."
    error_id: ERR_CREW_NOT_FOUND
    http_status: 404
    applies_to: "POST /berry-ops/pickers, POST /berry-ops/harvest-windows, POST /berry-ops/payroll-runs, POST /berry-ops/pick-sessions (ERR_PICKER_NOT_FOUND for picker_id)"

  - priority: 18
    category: existence
    check: "harvest_window_id resolves to a HarvestWindow; source_lot_id, when supplied, resolves to a FruitLot; cooling_tunnel_id resolves to a CoolingTunnel."
    error_id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "POST /berry-ops/pick-sessions, POST /berry-ops/fruit-lots, POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"

  - priority: 19
    category: existence
    check: "fruit_lot_id and buyer_commitment_id in the body resolve to a FruitLot and a BuyerCommitment."
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /berry-ops/lot-allocations (ERR_COMMITMENT_NOT_FOUND for buyer_commitment_id)"

  # ---- tier 6: ownership -----------------------------------------------------
  - priority: 20
    category: auth
    check: "On a tally, X-User-ID equals the supervisor_user_id of the Crew that owns the session's HarvestWindow."
    error_id: ERR_NOT_SESSION_SUPERVISOR
    http_status: 403
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/tally"

  - priority: 21
    category: auth
    check: "On a dispute raised with X-User-Role Picker, X-User-ID equals the session's picker_id."
    error_id: ERR_NOT_SESSION_OWNER
    http_status: 403
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/dispute"

  - priority: 22
    category: auth
    check: "On a pick-session create, X-User-ID equals the supervisor_user_id of the Crew that owns the target HarvestWindow, and the supplied picker's crew_id equals that crew's id."
    error_id: ERR_NOT_SESSION_SUPERVISOR
    http_status: 403
    applies_to: "POST /berry-ops/pick-sessions"

  # ---- tier 7: optimistic concurrency ----------------------------------------
  - priority: 23
    category: state
    check: "expected_cooling_tunnel_version equals the target CoolingTunnel's current version (see concurrency_rules.cooling-start-stale-tunnel)."
    error_id: ERR_STALE_TUNNEL_VERSION
    http_status: 412
    applies_to: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"

  - priority: 24
    category: state
    check: "expected_buyer_commitment_version equals the target BuyerCommitment's current version (see concurrency_rules.allocation-create-stale-commitment)."
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412
    applies_to: "POST /berry-ops/lot-allocations"

  # ---- tier 8: state preconditions -------------------------------------------
  - priority: 25
    category: state
    check: "The block is not already under a manual hold when quarantining, and IS under one when clearing."
    error_id: ERR_INVALID_BLOCK_STATE
    http_status: 409
    applies_to: "POST /berry-ops/blocks/{block_id}/quarantine, POST /berry-ops/blocks/{block_id}/clear"

  - priority: 26
    category: state
    check: "Crew.status is STAFFED when certifying, and is CERTIFIED or ACTIVE when releasing."
    error_id: ERR_INVALID_CREW_STATE
    http_status: 409
    applies_to: "POST /berry-ops/crews/{crew_id}/certify, POST /berry-ops/crews/{crew_id}/release"

  - priority: 27
    category: state
    check: "Crew.status is RECRUITING or STAFFED when the support plan is recorded (housing and transport cannot be re-cut after certification)."
    error_id: ERR_INVALID_CREW_STATE
    http_status: 409
    applies_to: "POST /berry-ops/crews/{crew_id}/support-plan"

  - priority: 28
    category: state
    check: "HarvestWindow.status is PLANNED when confirming, CONFIRMED when opening, OPEN when closing, SUSPENDED when resuming, and one of PLANNED / CONFIRMED / SUSPENDED when cancelling."
    error_id: ERR_INVALID_WINDOW_STATE
    http_status: 409
    applies_to: "POST /berry-ops/harvest-windows/{harvest_window_id}/confirm, /open, /close, /resume, /cancel"

  - priority: 29
    category: state
    check: "The session's HarvestWindow is OPEN when a session is created, tallied or disputed. A SUSPENDED, CLOSED, CONFIRMED or CANCELLED window admits none of the three."
    error_id: ERR_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions, POST /berry-ops/pick-sessions/{pick_session_id}/tally, POST /berry-ops/pick-sessions/{pick_session_id}/dispute"

  - priority: 30
    category: state
    check: "PickSession.quality_flag is not PENDING when approving (an untallied session carries no pay figures) — evaluated BEFORE the status check so that approving a never-tallied OPEN session reports the missing tally rather than the status."
    error_id: ERR_SESSION_NOT_TALLIED
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/approve"

  - priority: 31
    category: state
    check: "PickSession.status is OPEN or DISPUTED when tallying, TALLIED when approving, and TALLIED or APPROVED when disputing."
    error_id: ERR_INVALID_SESSION_STATE
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/tally, /approve, /dispute"

  - priority: 32
    category: state
    check: "PickSession.payroll_run_id is null when disputing (a session already bound into a LOCKED run cannot be reopened)."
    error_id: ERR_SESSION_PAYROLL_LOCKED
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/dispute"

  - priority: 33
    category: state
    check: "PayrollRun.status is DRAFT when locking and LOCKED when settling."
    error_id: ERR_INVALID_PAYROLL_STATE
    http_status: 409
    applies_to: "POST /berry-ops/payroll-runs/{payroll_run_id}/lock, /settle"

  - priority: 34
    category: state
    check: "No PickSession of the crew with work_date inside the run period is OPEN, TALLIED or DISPUTED when locking."
    error_id: ERR_PERIOD_HAS_UNRESOLVED_SESSIONS
    http_status: 409
    applies_to: "POST /berry-ops/payroll-runs/{payroll_run_id}/lock"

  - priority: 35
    category: state
    check: "FruitLot.cold_chain_status is PACKED when starting cooling, COOLING when completing cooling, COOLED when repacking, and COOLED when the lot's allocation line is shipped."
    error_id: ERR_INVALID_COLD_CHAIN_STATE
    http_status: 409
    applies_to: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling, /complete-cooling, /repack, POST /berry-ops/lot-allocations/{lot_allocation_id}/ship"

  - priority: 36
    category: state
    check: "FruitLot.disposition_status is UNCOMMITTED or RESERVED when starting cooling; UNCOMMITTED when repacking; and not DELIVERED, REJECTED or REPACKED when rejecting or allocating."
    error_id: ERR_INVALID_DISPOSITION_STATE
    http_status: 409
    applies_to: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling, /repack, /reject, POST /berry-ops/lot-allocations"

  - priority: 37
    category: state
    check: "LotAllocation.status is RESERVED when shipping or releasing, and BuyerCommitment.status is OPEN when allocating, shipping, releasing or settling."
    error_id: ERR_INVALID_ALLOCATION_STATE
    http_status: 409
    applies_to: "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship, /release, POST /berry-ops/buyer-commitments/{buyer_commitment_id}/settle (ERR_INVALID_COMMITMENT_STATE for the commitment)"

  # ---- tier 9: business_safety (food safety and labor compliance) ------------
  - priority: 38
    category: business_safety
    check: "The window's Block is not QUARANTINED when confirming, opening or resuming a window, and not QUARANTINED when a FruitLot is created against it."
    error_id: ERR_BLOCK_QUARANTINED
    http_status: 409
    applies_to: "POST /berry-ops/harvest-windows/{harvest_window_id}/confirm, /open, /resume, POST /berry-ops/fruit-lots"

  - priority: 39
    category: business_safety
    check: "The window's Block has food_safety_posture CLEARED when opening a window (a RESTRICTED block with NO_SAMPLES or NON_COMPLIANT water cannot be picked)."
    error_id: ERR_BLOCK_NOT_CLEARED
    http_status: 409
    applies_to: "POST /berry-ops/harvest-windows/{harvest_window_id}/open"

  - priority: 40
    category: business_safety
    check: "The lot is not under a food safety hold when starting cooling, repacking or allocating it."
    error_id: ERR_LOT_ON_FOOD_SAFETY_HOLD
    http_status: 409
    applies_to: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling, /repack, POST /berry-ops/lot-allocations"

  - priority: 41
    category: business_safety
    check: "The traceability Block of the shipping lot has water_status COMPLIANT (a PROVISIONAL block may be picked but its fruit may not be shipped to a buyer program)."
    error_id: ERR_BLOCK_WATER_NOT_COMPLIANT
    http_status: 409
    applies_to: "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship"

  - priority: 42
    category: business_safety
    check: "Every Picker of the crew has a non-null hygiene_training_expires_on strictly after the current logical clock date when certifying the crew."
    error_id: ERR_HYGIENE_TRAINING_INVALID
    http_status: 409
    applies_to: "POST /berry-ops/crews/{crew_id}/certify"

  - priority: 43
    category: business_safety
    check: "The picker's hygiene_training_expires_on is non-null and strictly after the session's work_date when a PickSession is created."
    error_id: ERR_HYGIENE_TRAINING_INVALID
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions"

  - priority: 44
    category: business_safety
    check: "The crew's support_plan_complete is true when certifying: transport_route_code present with vehicle_seats >= planned_head_count for every crew, and additionally housing_unit_code present with beds_confirmed >= planned_head_count for an H2A crew."
    error_id: ERR_SUPPORT_PLAN_INCOMPLETE
    http_status: 409
    applies_to: "POST /berry-ops/crews/{crew_id}/certify"

  # ---- tier 10: business_constraint -----------------------------------------
  - priority: 45
    category: business_constraint
    check: "A PayrollRun may not be locked while another PayrollRun of the same crew is LOCKED."
    error_id: ERR_CREW_RUN_ALREADY_LOCKED
    http_status: 409
    applies_to: "POST /berry-ops/payroll-runs/{payroll_run_id}/lock"

  - priority: 46
    category: business_constraint
    check: "SEGREGATION OF DUTIES: X-User-ID of a payroll settle differs from the run's locked_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /berry-ops/payroll-runs/{payroll_run_id}/settle"

  - priority: 47
    category: business_constraint
    check: "SEGREGATION OF DUTIES: X-User-ID of a session approval differs from the session's tallied_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/approve"

  - priority: 48
    category: business_constraint
    check: "SEGREGATION OF DUTIES: X-User-ID of a block clear differs from the block's quarantined_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /berry-ops/blocks/{block_id}/clear"

  - priority: 49
    category: business_constraint
    check: "A session's tally_revision_count is below MAX_TALLY_REVISIONS (3) when re-tallying out of DISPUTED."
    error_id: ERR_TALLY_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /berry-ops/pick-sessions/{pick_session_id}/tally"

  - priority: 50
    category: business_constraint
    check: "REPACK MASS BALANCE: output_clamshell_count + cull_clamshell_count + optical_reject_clamshell_count equals the source lot's clamshell_count exactly, and output_clamshell_count >= 1."
    error_id: ERR_REPACK_MASS_BALANCE
    http_status: 422
    applies_to: "POST /berry-ops/fruit-lots/{fruit_lot_id}/repack"

  - priority: 51
    category: business_constraint
    check: "Uniqueness: Block.name is unique; CoolingTunnel.name is unique; a PickSession is unique per (harvest_window_id, picker_id, work_date); a PayrollRun is unique per (crew_id, period_start_date, period_end_date)."
    error_id: ERR_DUPLICATE_RECORD
    http_status: 409
    applies_to: "POST /berry-ops/blocks, POST /berry-ops/cooling-tunnels, POST /berry-ops/pick-sessions, POST /berry-ops/payroll-runs"

  # ---- tier 11: business_referential ----------------------------------------
  - priority: 52
    category: business_referential
    check: "A FruitLot's block_id equals the block_id of its harvest_window_id (the pack record must trace to the block that was actually picked)."
    error_id: ERR_LOT_BLOCK_MISMATCH
    http_status: 422
    applies_to: "POST /berry-ops/fruit-lots"

  - priority: 53
    category: business_referential
    check: "A FruitLot's variety equals the variety of its Block, and an allocated lot's variety equals the BuyerCommitment's variety."
    error_id: ERR_VARIETY_MISMATCH
    http_status: 422
    applies_to: "POST /berry-ops/fruit-lots, POST /berry-ops/lot-allocations"

  - priority: 54
    category: business_referential
    check: "A PayrollRun's crew_id equals the crew of every session it would bind, and a HarvestWindow's crew must not be RELEASED."
    error_id: ERR_CREW_MISMATCH
    http_status: 422
    applies_to: "POST /berry-ops/payroll-runs/{payroll_run_id}/lock, POST /berry-ops/harvest-windows"

  # ---- tier 12: business_temporal -------------------------------------------
  - priority: 55
    category: business_temporal
    check: "A FruitLot's pick_date lies within the calendar dates spanned by its HarvestWindow's start_at and end_at, inclusive."
    error_id: ERR_PICK_DATE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /berry-ops/fruit-lots"

  - priority: 56
    category: business_temporal
    check: "A PickSession's work_date lies within the calendar dates spanned by its HarvestWindow, inclusive."
    error_id: ERR_WORK_DATE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /berry-ops/pick-sessions"

  - priority: 57
    category: business_temporal
    check: "BLOCK RE-ENTRY: a candidate HarvestWindow does not overlap, and is separated by at least BLOCK_REENTRY_BUFFER_HOURS (12) from, every live window of the same block (see calculations.block_window_separation). Adjacency is a conflict."
    error_id: ERR_BLOCK_REENTRY_CONFLICT
    http_status: 409
    applies_to: "POST /berry-ops/harvest-windows, POST /berry-ops/harvest-windows/{harvest_window_id}/confirm"

  - priority: 58
    category: business_temporal
    check: "The current logical clock instant is strictly before window.end_at when opening or resuming a window; cool_start_at is not before pack_completed_at; cool_complete_at is strictly after cool_start_at; a commitment may only settle after its window_end_date has passed."
    error_id: ERR_TEMPORAL_ORDER_VIOLATION
    http_status: 422
    applies_to: "POST /berry-ops/harvest-windows/{harvest_window_id}/open, /resume, POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling, /complete-cooling, POST /berry-ops/buyer-commitments/{buyer_commitment_id}/settle"

  - priority: 59
    category: business_temporal
    check: "On ship: the shipped_at date lies within [commitment.window_start_date, commitment.window_end_date] inclusive AND the current logical clock date is not after lot.shelf_life_expires_on."
    error_id: ERR_SHIP_OUTSIDE_PROGRAM_WINDOW
    http_status: 422
    applies_to: "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship"

  # ---- tier 13: business_fiscal (capacity and quota) ------------------------
  - priority: 60
    category: business_fiscal
    check: "The crew has at least window.required_picker_count pickers when a window is opened, and required_picker_count does not exceed CREW_CAP (60) when a window is confirmed."
    error_id: ERR_INSUFFICIENT_PICKERS
    http_status: 422
    applies_to: "POST /berry-ops/harvest-windows/{harvest_window_id}/open, /confirm"

  - priority: 61
    category: business_fiscal
    check: "AGGREGATE TUNNEL CAPACITY: occupied_slots over the requested half-open interval plus the requested pallet_slots does not exceed tunnel.slot_capacity (see calculations.tunnel_occupancy). Each occupant is individually admissible; only the sum offends."
    error_id: ERR_TUNNEL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"

  - priority: 62
    category: business_fiscal
    check: "allocated_lbs does not exceed the lot's available_lbs."
    error_id: ERR_LOT_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /berry-ops/lot-allocations"

  - priority: 63
    category: business_fiscal
    check: "allocated_lbs does not exceed the commitment's open_lbs (a buyer program may not be overbooked)."
    error_id: ERR_COMMITMENT_OVERBOOKED
    http_status: 422
    applies_to: "POST /berry-ops/lot-allocations"

  - priority: 64
    category: business_fiscal
    check: "The crew's accrued_wage_cents is 0 and no live window or unresolved session remains when releasing a crew."
    error_id: ERR_CREW_LEDGER_NOT_CLEAR
    http_status: 422
    applies_to: "POST /berry-ops/crews/{crew_id}/release"

  - priority: 65
    category: existence
    check: "{water_test_id} in the path resolves to a WaterTest. Appended after the initial numbering: the only endpoint it applies to is the single-sample read, whose sole other applicable rules are the authentication and authorization tier, so its late position is observationally identical to sitting in the 5-9 existence tier."
    error_id: ERR_WATER_TEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /berry-ops/water-tests/{water_test_id}"

  - priority: 66
    category: business_constraint
    check: "VARIETY MATURITY GATE: window.forecast_brix >= BRIX_MIN[block.variety] when a harvest window is confirmed (STRAWBERRY 7.0, BLUEBERRY 10.0, RASPBERRY 8.0, BLACKBERRY 8.5), compared inclusively so a window sitting exactly on the minimum confirms. Deliberately evaluated last: a window that is both immature and mis-staffed reports the staffing error first, because staffing is the cheaper of the two problems to correct."
    error_id: ERR_BRIX_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /berry-ops/harvest-windows/{harvest_window_id}/confirm"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# Flat topology: every path is <api_prefix>/<collection>[/{id}][/<action>].
# Every entity has a single-resource GET and, where it carries a foreign key,
# a filtered list GET that finds children from a parent id.
# All roles: HarvestManager, FoodSafetyOfficer, CrewSupervisor, PayrollClerk,
# PackhouseOperator, SalesManager, Picker.
# -----------------------------------------------------------------------------
endpoints:

  # ---- Block -----------------------------------------------------------------
  - method: POST
    path: "/berry-ops/blocks"
    description: "Register a production block. water_status starts NO_SAMPLES and food_safety_posture starts RESTRICTED, so a brand-new block cannot be opened for picking until a water sample is on file."
    roles: [HarvestManager]
    code: 201
    input: [name, variety, acres, planting_year, irrigation_source_code]
    output: Block
    side_effects: ["water_sample_count 0; water_geomean_mpn null; water_status NO_SAMPLES; manual_quarantine_active false; food_safety_posture RESTRICTED"]

  - method: GET
    path: "/berry-ops/blocks/{block_id}"
    description: "Read one block including its derived water and food-safety fields."
    roles: [HarvestManager, FoodSafetyOfficer, CrewSupervisor, PayrollClerk, PackhouseOperator, SalesManager]
    code: 200
    input: []
    output: Block
    side_effects: []

  - method: GET
    path: "/berry-ops/blocks"
    description: "List blocks, optionally filtered by variety or food-safety posture."
    roles: [HarvestManager, FoodSafetyOfficer, CrewSupervisor, PayrollClerk, PackhouseOperator, SalesManager]
    code: 200
    input: ["variety?", "food_safety_posture?", "water_status?"]
    output: Block[]
    side_effects: []

  - method: POST
    path: "/berry-ops/blocks/{block_id}/quarantine"
    description: "Place a manual food-safety hold on the block. Fires the four-level quarantine cascade (windows, sessions, crew ledger, picker productivity) plus the food-safety hold on the block's uncommitted and reserved lots."
    roles: [FoodSafetyOfficer]
    code: 200
    input: [quarantine_reason_code]
    output: Block
    side_effects:
      - "manual_quarantine_active true; quarantined_by_user_id = X-User-ID; food_safety_posture QUARANTINED"
      - "cascade per state_machines.Block CLEARED -> QUARANTINED (L1 windows -> SUSPENDED, L2 sessions -> VOIDED/DISPUTED, L3 crew.accrued_wage_cents and picker productivity, lots -> food_safety_hold)"
      - "increments block.version by 1"

  - method: POST
    path: "/berry-ops/blocks/{block_id}/clear"
    description: "Lift the manual food-safety hold. Requires a passing water status and a different officer from the one who imposed the hold. Suspended windows are NOT auto-resumed."
    roles: [FoodSafetyOfficer]
    code: 200
    input: []
    output: Block
    side_effects:
      - "manual_quarantine_active false; food_safety_posture recomputed to CLEARED"
      - "food_safety_hold cleared on the block's UNCOMMITTED and RESERVED lots"
      - "increments block.version by 1"

  - method: GET
    path: "/berry-ops/blocks/{block_id}/traceability-summary"
    description: "Computed read: the block-and-pick-date traceability roll-up demanded by the food safety program. Returns zeros and null dates for a block with no lots rather than 404."
    roles: [HarvestManager, FoodSafetyOfficer, PackhouseOperator, SalesManager]
    code: 200
    input: []
    output: "{ block_id: string, block_name: string, variety: string, water_status: string, food_safety_posture: string, lot_count: integer, pick_date_count: integer, total_packed_lbs: decimal, shipped_lbs: decimal, held_lot_count: integer, rejected_lot_count: integer, earliest_pick_date: date, latest_pick_date: date }"
    side_effects: []

  # ---- WaterTest -------------------------------------------------------------
  - method: POST
    path: "/berry-ops/water-tests"
    description: "Record one agricultural-water sample. Recomputes the block's rolling five-sample geometric mean and water_status, and auto-quarantines the block when the sample exceeds the single-sample maximum."
    roles: [FoodSafetyOfficer]
    code: 201
    input: [block_id, sample_date, generic_ecoli_mpn]
    output: WaterTest
    side_effects:
      - "recorded_by_user_id = X-User-ID; single_sample_exceedance and resulting_water_status stamped"
      - "block.water_sample_count / water_geomean_mpn / water_status / last_sample_date recomputed per calculations.water_quality_status"
      - "block.food_safety_posture recomputed per calculations.block_food_safety_posture"
      - "on a single-sample exceedance: block.manual_quarantine_active = true, quarantine_reason_code = 'SINGLE_SAMPLE_EXCEEDANCE', quarantined_by_user_id = X-User-ID, and the full quarantine cascade fires"
      - "increments block.version by 1"

  - method: GET
    path: "/berry-ops/water-tests/{water_test_id}"
    description: "Read one water sample. WaterTest is append-only: there is no update or delete endpoint and no version field."
    roles: [HarvestManager, FoodSafetyOfficer, SalesManager]
    code: 200
    input: []
    output: WaterTest
    side_effects: []

  - method: GET
    path: "/berry-ops/water-tests"
    description: "List water samples, optionally filtered to one block. Ordered (sample_date ASC, created_at ASC) — the same ordering the geometric-mean window uses."
    roles: [HarvestManager, FoodSafetyOfficer, SalesManager]
    code: 200
    input: ["block_id?"]
    output: WaterTest[]
    side_effects: []

  # ---- Crew ------------------------------------------------------------------
  - method: POST
    path: "/berry-ops/crews"
    description: "Recruit a harvest crew under a seasonal labor program. supervisor_user_id is the opaque CrewSupervisor operator id that will own the crew's tallies."
    roles: [HarvestManager]
    code: 201
    input: [name, labor_program, supervisor_user_id, planned_head_count, contract_start_date, contract_end_date]
    output: Crew
    side_effects: ["status RECRUITING; picker_count 0; support_plan_complete false; accrued_wage_cents 0; settled_wage_cents 0; reconciliation_delta_cents 0"]

  - method: GET
    path: "/berry-ops/crews/{crew_id}"
    description: "Read one crew including its wage ledger."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, FoodSafetyOfficer]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: GET
    path: "/berry-ops/crews"
    description: "List crews, optionally filtered by labor program or status."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, FoodSafetyOfficer]
    code: 200
    input: ["labor_program?", "status?"]
    output: Crew[]
    side_effects: []

  - method: POST
    path: "/berry-ops/crews/{crew_id}/support-plan"
    description: "Record the crew's housing and transportation arrangements in one call. support_plan_complete becomes true only when beds_confirmed and vehicle_seats both cover planned_head_count."
    roles: [HarvestManager]
    code: 200
    input: [housing_unit_code, beds_confirmed, transport_route_code, vehicle_seats]
    output: Crew
    side_effects:
      - "housing_unit_code, beds_confirmed, transport_route_code, vehicle_seats stored"
      - "support_plan_complete = (beds_confirmed >= planned_head_count and vehicle_seats >= planned_head_count)"
      - "increments crew.version by 1"

  - method: POST
    path: "/berry-ops/crews/{crew_id}/certify"
    description: "Certify a staffed crew as ready to pick: support plan complete and every picker's hygiene training unexpired."
    roles: [HarvestManager]
    code: 200
    input: []
    output: Crew
    side_effects: ["status STAFFED -> CERTIFIED", "increments crew.version by 1"]

  - method: POST
    path: "/berry-ops/crews/{crew_id}/release"
    description: "Release the crew at the end of its contract. Refused while any live window, unresolved session or non-zero accrued wage remains."
    roles: [HarvestManager]
    code: 200
    input: []
    output: Crew
    side_effects: ["status -> RELEASED", "increments crew.version by 1"]

  # ---- Picker ----------------------------------------------------------------
  - method: POST
    path: "/berry-ops/pickers"
    description: "Register a picker on a crew and record the date of their worker-hygiene training. hygiene_training_expires_on is computed as hygiene_training_on + 365 days."
    roles: [HarvestManager, CrewSupervisor]
    code: 201
    input: [crew_id, full_name, "hygiene_training_on?"]
    output: Picker
    side_effects:
      - "labor_program copied from the crew; hygiene_training_expires_on = hygiene_training_on + HYGIENE_VALID_DAYS (365)"
      - "crew.picker_count recomputed; crew RECRUITING -> STAFFED on the first picker"
      - "increments crew.version by 1"

  - method: GET
    path: "/berry-ops/pickers/{picker_id}"
    description: "Read one picker including lifetime productivity."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, Picker]
    code: 200
    input: []
    output: Picker
    side_effects: []

  - method: GET
    path: "/berry-ops/pickers"
    description: "List pickers, optionally filtered to one crew."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk]
    code: 200
    input: ["crew_id?"]
    output: Picker[]
    side_effects: []

  - method: POST
    path: "/berry-ops/pickers/{picker_id}/hygiene-training"
    description: "Re-record worker hygiene training, resetting the 365-day validity clock."
    roles: [HarvestManager, CrewSupervisor]
    code: 200
    input: [hygiene_training_on]
    output: Picker
    side_effects: ["hygiene_training_on stored; hygiene_training_expires_on = hygiene_training_on + 365 days", "increments picker.version by 1"]

  # ---- CoolingTunnel ---------------------------------------------------------
  - method: POST
    path: "/berry-ops/cooling-tunnels"
    description: "Register a forced-air cooling tunnel with its pallet-slot capacity and target pulp temperature."
    roles: [PackhouseOperator]
    code: 201
    input: [name, slot_capacity, target_pulp_temp_f]
    output: CoolingTunnel
    side_effects: ["committed_slots 0"]

  - method: GET
    path: "/berry-ops/cooling-tunnels/{cooling_tunnel_id}"
    description: "Read one tunnel. Its version is the OCC token for concurrency_rules.cooling-start-stale-tunnel."
    roles: [PackhouseOperator, HarvestManager, SalesManager]
    code: 200
    input: []
    output: CoolingTunnel
    side_effects: []

  - method: GET
    path: "/berry-ops/cooling-tunnels"
    description: "List cooling tunnels with current committed_slots."
    roles: [PackhouseOperator, HarvestManager, SalesManager]
    code: 200
    input: []
    output: CoolingTunnel[]
    side_effects: []

  # ---- HarvestWindow ---------------------------------------------------------
  - method: POST
    path: "/berry-ops/harvest-windows"
    description: "Plan a harvest window for one block and crew from the maturity forecast. Enforces the 12-hour block re-entry separation against every live window of the same block."
    roles: [HarvestManager]
    code: 201
    input: [block_id, crew_id, start_at, end_at, forecast_brix, planned_volume_lbs, piece_rate_cents_per_clamshell, clamshell_net_weight_lbs]
    output: HarvestWindow
    side_effects: ["status PLANNED; window_hours computed; harvested_clamshells 0; packed_lbs 0.00"]

  - method: GET
    path: "/berry-ops/harvest-windows/{harvest_window_id}"
    description: "Read one harvest window including its staffing requirement and actuals."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, PackhouseOperator, FoodSafetyOfficer]
    code: 200
    input: []
    output: HarvestWindow
    side_effects: []

  - method: GET
    path: "/berry-ops/harvest-windows"
    description: "List harvest windows, optionally filtered by block, crew or status."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, PackhouseOperator, FoodSafetyOfficer]
    code: 200
    input: ["block_id?", "crew_id?", "status?"]
    output: HarvestWindow[]
    side_effects: []

  - method: POST
    path: "/berry-ops/harvest-windows/{harvest_window_id}/confirm"
    description: "Confirm the window against the maturity forecast and compute the crew requirement (calculations.window_crew_requirement)."
    roles: [HarvestManager]
    code: 200
    input: []
    output: HarvestWindow
    side_effects: ["status PLANNED -> CONFIRMED; effective_pick_rate_lbs_per_hour and required_picker_count computed", "increments window.version by 1"]

  - method: POST
    path: "/berry-ops/harvest-windows/{harvest_window_id}/open"
    description: "Open the window for picking. Gated on the block being CLEARED, the crew being CERTIFIED or ACTIVE, and the crew having at least required_picker_count pickers."
    roles: [HarvestManager]
    code: 200
    input: []
    output: HarvestWindow
    side_effects: ["status CONFIRMED -> OPEN", "crew CERTIFIED -> ACTIVE on the crew's first opened window", "increments window.version by 1 and crew.version by 1 when the crew transitions"]

  - method: POST
    path: "/berry-ops/harvest-windows/{harvest_window_id}/close"
    description: "Close the window at the end of picking. Refused while any session is OPEN or any lot of the window is still COOLING."
    roles: [HarvestManager]
    code: 200
    input: []
    output: HarvestWindow
    side_effects: ["status OPEN -> CLOSED; packed_lbs and harvested_clamshells recomputed", "increments window.version by 1"]

  - method: POST
    path: "/berry-ops/harvest-windows/{harvest_window_id}/resume"
    description: "Return a window suspended by a block quarantine to CONFIRMED once the block is CLEARED. Never goes straight to OPEN — the open gate must be re-passed."
    roles: [HarvestManager]
    code: 200
    input: []
    output: HarvestWindow
    side_effects: ["status SUSPENDED -> CONFIRMED; suspended_reason_code cleared; required_picker_count recomputed", "increments window.version by 1"]

  - method: POST
    path: "/berry-ops/harvest-windows/{harvest_window_id}/cancel"
    description: "Cancel a window that will not be picked, freeing its block re-entry slot immediately."
    roles: [HarvestManager]
    code: 200
    input: [cancel_reason_code]
    output: HarvestWindow
    side_effects: ["status -> CANCELLED; cancel_reason_code stored", "increments window.version by 1"]

  # ---- PickSession -----------------------------------------------------------
  - method: POST
    path: "/berry-ops/pick-sessions"
    description: "Open a picker's day on an OPEN window. Created by the crew's own supervisor only; the picker's hygiene training must be valid on the work_date."
    roles: [CrewSupervisor]
    code: 201
    input: [harvest_window_id, picker_id, work_date]
    output: PickSession
    side_effects: ["status OPEN; quality_flag PENDING; hours_worked 0.00; clamshells_filled 0; culled_clamshells 0; every money field 0; tally_revision_count 0; payroll_run_id null"]

  - method: GET
    path: "/berry-ops/pick-sessions/{pick_session_id}"
    description: "Read one pick session including its piece-rate and guarantee figures."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, Picker]
    code: 200
    input: []
    output: PickSession
    side_effects: []

  - method: GET
    path: "/berry-ops/pick-sessions"
    description: "List pick sessions, optionally filtered by window, picker, payroll run or status. This is the only discovery channel for sessions voided or disputed by the quarantine cascade."
    roles: [HarvestManager, CrewSupervisor, PayrollClerk, Picker]
    code: 200
    input: ["harvest_window_id?", "picker_id?", "payroll_run_id?", "status?"]
    output: PickSession[]
    side_effects: []

  - method: POST
    path: "/berry-ops/pick-sessions/{pick_session_id}/tally"
    description: "Record the row-pack tally for the session and price it with the per-session minimum-wage guarantee (calculations.session_pay_per_session). Also used to re-tally a disputed session, up to MAX_TALLY_REVISIONS (3) revisions."
    roles: [CrewSupervisor]
    code: 200
    input: [hours_worked, clamshells_filled, culled_clamshells]
    output: PickSession
    side_effects:
      - "hours_worked, clamshells_filled, culled_clamshells stored; cull_rate, quality_flag, effective_piece_rate_cents, piece_cents, guarantee_floor_cents, makeup_cents, gross_cents, housing_deduction_cents, net_cents computed"
      - "tallied_by_user_id = X-User-ID; status OPEN|DISPUTED -> TALLIED; tally_revision_count incremented by 1 when the source state was DISPUTED"
      - "increments session.version by 1"

  - method: POST
    path: "/berry-ops/pick-sessions/{pick_session_id}/approve"
    description: "Approve a tallied session for payroll. The approver must differ from the tallier (segregation of duties). Accrues the session's net pay onto the crew ledger."
    roles: [PayrollClerk]
    code: 200
    input: []
    output: PickSession
    side_effects:
      - "status TALLIED -> APPROVED; approved_by_user_id = X-User-ID"
      - "crew.accrued_wage_cents incremented by session.net_cents; picker productivity and window.harvested_clamshells recomputed"
      - "increments session.version, crew.version, picker.version and window.version by 1"

  - method: POST
    path: "/berry-ops/pick-sessions/{pick_session_id}/dispute"
    description: "Dispute a tally. A Picker may dispute only their own session; the crew's supervisor may dispute any session of their crew. Disputing an APPROVED session reverses the crew ledger accrual exactly."
    roles: [Picker, CrewSupervisor]
    code: 200
    input: [dispute_reason_code]
    output: PickSession
    side_effects:
      - "status TALLIED|APPROVED -> DISPUTED; dispute_reason_code stored"
      - "when the source state was APPROVED: crew.accrued_wage_cents decremented by session.net_cents, approved_by_user_id cleared, picker productivity and window.harvested_clamshells recomputed"
      - "increments session.version by 1 (and crew.version, picker.version, window.version by 1 on the APPROVED path)"

  # ---- PayrollRun ------------------------------------------------------------
  - method: POST
    path: "/berry-ops/payroll-runs"
    description: "Open a draft pay period for a crew. Unique per (crew_id, period_start_date, period_end_date)."
    roles: [PayrollClerk]
    code: 201
    input: [crew_id, period_start_date, period_end_date]
    output: PayrollRun
    side_effects: ["status DRAFT; bound_session_count 0; every aggregate field 0"]

  - method: GET
    path: "/berry-ops/payroll-runs/{payroll_run_id}"
    description: "Read one payroll run including its period-averaged settlement figures."
    roles: [PayrollClerk, HarvestManager, CrewSupervisor]
    code: 200
    input: []
    output: PayrollRun
    side_effects: []

  - method: GET
    path: "/berry-ops/payroll-runs"
    description: "List payroll runs, optionally filtered by crew or status."
    roles: [PayrollClerk, HarvestManager, CrewSupervisor]
    code: 200
    input: ["crew_id?", "status?"]
    output: PayrollRun[]
    side_effects: []

  - method: POST
    path: "/berry-ops/payroll-runs/{payroll_run_id}/lock"
    description: "Freeze the bound session set for the period. Every APPROVED, unbound session of the crew whose work_date falls inside the period is stamped with this run's id and can no longer be disputed."
    roles: [PayrollClerk]
    code: 200
    input: []
    output: PayrollRun
    side_effects:
      - "status DRAFT -> LOCKED; locked_by_user_id = X-User-ID"
      - "payroll_run_id stamped on every bound session; bound_session_count, period_hours, period_piece_cents, accrued_gross_cents stamped"
      - "increments run.version by 1 and the version of every bound session by 1"

  - method: POST
    path: "/berry-ops/payroll-runs/{payroll_run_id}/settle"
    description: "Settle the locked period using the period-averaged guarantee (calculations.payroll_period_averaged_settlement). A run with an empty bound set settles to all zeros and SUCCEEDS. The settler must differ from the locker."
    roles: [PayrollClerk]
    code: 200
    input: []
    output: PayrollRun
    side_effects:
      - "status LOCKED -> SETTLED; settled_by_user_id = X-User-ID"
      - "period_floor_cents, period_makeup_cents, period_deduction_cents, settled_gross_cents, settled_net_cents, reconciliation_delta_cents computed"
      - "every bound session APPROVED -> SETTLED"
      - "crew.accrued_wage_cents decremented by the sum of bound net_cents; crew.settled_wage_cents and crew.reconciliation_delta_cents updated"
      - "increments run.version, crew.version and the version of every bound session by 1"

  # ---- FruitLot --------------------------------------------------------------
  - method: POST
    path: "/berry-ops/fruit-lots"
    description: "Record a field-packed lot of clamshells against a harvest window. Its block_id and variety must agree with the window's block, and its pick_date must fall inside the window's calendar span."
    roles: [PackhouseOperator]
    code: 201
    input: [harvest_window_id, block_id, pick_date, variety, grade, clamshell_count, clamshell_net_weight_lbs, pack_completed_at, field_pulp_temp_f]
    output: FruitLot
    side_effects:
      - "net_packed_lbs and available_lbs computed; allocated_lbs 0.00; traceability_code assigned per calculations.lot_pack_mass_balance"
      - "cold_chain_status PACKED; disposition_status UNCOMMITTED; food_safety_hold false; source_lot_id null; cooling_tunnel_id null"
      - "window.packed_lbs recomputed; increments window.version by 1"

  - method: GET
    path: "/berry-ops/fruit-lots/{fruit_lot_id}"
    description: "Read one fruit lot with both of its state dimensions and both shelf-life figures."
    roles: [PackhouseOperator, HarvestManager, SalesManager, FoodSafetyOfficer]
    code: 200
    input: []
    output: FruitLot
    side_effects: []

  - method: GET
    path: "/berry-ops/fruit-lots"
    description: "List fruit lots, optionally filtered by window, block, source lot (repack lineage), tunnel or either state dimension. This is the only discovery channel for a repack child lot."
    roles: [PackhouseOperator, HarvestManager, SalesManager, FoodSafetyOfficer]
    code: 200
    input: ["harvest_window_id?", "block_id?", "source_lot_id?", "cooling_tunnel_id?", "cold_chain_status?", "disposition_status?"]
    output: FruitLot[]
    side_effects: []

  - method: POST
    path: "/berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"
    description: "Push the lot into a forced-air tunnel. Admission is an aggregate half-open-interval slot check (calculations.tunnel_occupancy) guarded by the tunnel's OCC version."
    roles: [PackhouseOperator]
    code: 200
    input: [cooling_tunnel_id, cool_start_at, planned_cool_end_at, entry_pulp_temp_f, pallet_slots, expected_cooling_tunnel_version]
    output: FruitLot
    side_effects:
      - "cold_chain_status PACKED -> COOLING; cooling_tunnel_id, cool_start_at, planned_cool_end_at, entry_pulp_temp_f, pallet_slots stored"
      - "field_delay_hours and forecast_shelf_life_days computed by the forecast variant of calculations.lot_shelf_life"
      - "tunnel.committed_slots incremented by pallet_slots; increments cooling_tunnel.version by 1"
      - "increments lot.version by 1"

  - method: POST
    path: "/berry-ops/fruit-lots/{fruit_lot_id}/complete-cooling"
    description: "Record the measured exit pulp temperature and release the tunnel slots. Stamps the verified shelf life, which may be far below the forecast."
    roles: [PackhouseOperator]
    code: 200
    input: [cool_complete_at, exit_pulp_temp_f]
    output: FruitLot
    side_effects:
      - "cold_chain_status COOLING -> COOLED; cool_complete_at, exit_pulp_temp_f, cool_hours stored"
      - "verified_shelf_life_days and shelf_life_expires_on computed by the verified variant of calculations.lot_shelf_life"
      - "tunnel.committed_slots decremented by lot.pallet_slots; increments cooling_tunnel.version by 1"
      - "increments lot.version by 1"

  - method: POST
    path: "/berry-ops/fruit-lots/{fruit_lot_id}/repack"
    description: "Run a cooled lot across the optical sorter and emit a repacked child lot. The three output counts must exactly balance the source lot's clamshell_count. Returns the CHILD lot."
    roles: [PackhouseOperator]
    code: 201
    input: [output_grade, output_clamshell_count, cull_clamshell_count, optical_reject_clamshell_count]
    output: FruitLot
    side_effects:
      - "creates a child FruitLot with source_lot_id = the source lot, cold_chain_status COOLED, disposition_status UNCOMMITTED, verified_shelf_life_days = max(SHELF_LIFE_FLOOR_DAYS, source.verified_shelf_life_days - REPACK_DERATE_DAYS), shelf_life_expires_on = date(source.cool_complete_at) + the child's verified_shelf_life_days, and its variety / clamshell_net_weight_lbs / pick_date / cooling fields copied from the source per state_machines.FruitLot UNCOMMITTED -> REPACKED"
      - "source lot: repack_out_lbs, cull_lbs, optical_reject_lbs stamped; available_lbs 0.00; disposition_status UNCOMMITTED -> REPACKED"
      - "increments the source lot's version by 1"

  - method: POST
    path: "/berry-ops/fruit-lots/{fruit_lot_id}/reject"
    description: "Reject a lot on quality or food-safety grounds. Fires the three-level rejection cascade onto its reserved allocations and their buyer commitments."
    roles: [PackhouseOperator, FoodSafetyOfficer]
    code: 200
    input: [reject_reason_code]
    output: FruitLot
    side_effects:
      - "disposition_status -> REJECTED; food_safety_hold true; available_lbs 0.00; reject_reason_code stored"
      - "cascade per state_machines.FruitLot RESERVED -> REJECTED (L1 allocations -> RELEASED, L2 commitment.committed_lbs / open_lbs / risk_flag and commitment.version)"
      - "window.packed_lbs recomputed; increments lot.version by 1"

  # ---- BuyerCommitment -------------------------------------------------------
  - method: POST
    path: "/berry-ops/buyer-commitments"
    description: "Register a buyer program commitment with volume, price and shelf-life guarantees over a delivery window."
    roles: [SalesManager]
    code: 201
    input: [buyer_name, buyer_user_id, variety, volume_commitment_lbs, price_cents_per_lb, shelf_life_guarantee_days, window_start_date, window_end_date]
    output: BuyerCommitment
    side_effects: ["status OPEN; committed_lbs 0.00; shipped_lbs 0.00; open_lbs = volume_commitment_lbs; fill_pct 0.0000; fill_status PENDING; risk_flag computed per calculations.commitment_settlement (ON_TRACK while the logical clock date is at or before window_end_date - RISK_LEAD_DAYS); all money 0"]

  - method: GET
    path: "/berry-ops/buyer-commitments/{buyer_commitment_id}"
    description: "Read one buyer commitment. Its version is the OCC token for concurrency_rules.allocation-create-stale-commitment."
    roles: [SalesManager, HarvestManager, PackhouseOperator]
    code: 200
    input: []
    output: BuyerCommitment
    side_effects: []

  - method: GET
    path: "/berry-ops/buyer-commitments"
    description: "List buyer commitments, optionally filtered by variety or status."
    roles: [SalesManager, HarvestManager, PackhouseOperator]
    code: 200
    input: ["variety?", "status?"]
    output: BuyerCommitment[]
    side_effects: []

  - method: POST
    path: "/berry-ops/buyer-commitments/{buyer_commitment_id}/settle"
    description: "Settle the buyer program after its delivery window has closed. Prices every shipped line separately with its own shelf-life discount, then sums; a commitment with nothing shipped settles into DEFAULTED with a shortfall penalty."
    roles: [SalesManager]
    code: 200
    input: []
    output: BuyerCommitment
    side_effects:
      - "per-line line_gross_cents, line_discount_cents, line_net_cents and shelf_life_shortfall_days stamped on every SHIPPED allocation"
      - "settled_revenue_cents, shortfall_penalty_cents, settled_net_cents, fill_pct, fill_status stamped; status -> SETTLED or DEFAULTED"
      - "increments commitment.version by 1 and the version of every stamped allocation by 1"

  # ---- LotAllocation ---------------------------------------------------------
  - method: POST
    path: "/berry-ops/lot-allocations"
    description: "Pledge pounds from a lot to a buyer commitment. Guarded by the commitment's OCC version; refused when the lot lacks the pounds or the commitment is already fully booked."
    roles: [SalesManager]
    code: 201
    input: [fruit_lot_id, buyer_commitment_id, allocated_lbs, expected_buyer_commitment_version]
    output: LotAllocation
    side_effects:
      - "status RESERVED; lot.disposition_status UNCOMMITTED -> RESERVED; lot.allocated_lbs and lot.available_lbs recomputed"
      - "commitment.committed_lbs, open_lbs and risk_flag recomputed; increments buyer_commitment.version by 1"
      - "increments lot.version by 1"

  - method: GET
    path: "/berry-ops/lot-allocations/{lot_allocation_id}"
    description: "Read one allocation line including its settled money figures."
    roles: [SalesManager, HarvestManager, PackhouseOperator]
    code: 200
    input: []
    output: LotAllocation
    side_effects: []

  - method: GET
    path: "/berry-ops/lot-allocations"
    description: "List allocation lines, optionally filtered by lot, commitment or status. This is the only discovery channel for allocations released by the lot-rejection cascade."
    roles: [SalesManager, HarvestManager, PackhouseOperator]
    code: 200
    input: ["fruit_lot_id?", "buyer_commitment_id?", "status?"]
    output: LotAllocation[]
    side_effects: []

  - method: POST
    path: "/berry-ops/lot-allocations/{lot_allocation_id}/ship"
    description: "Ship the allocated line. Gated on the lot being COOLED, off hold, sourced from a water-COMPLIANT block, still inside its shelf life, and on shipped_at falling inside the buyer's delivery window."
    roles: [SalesManager]
    code: 200
    input: [shipped_at]
    output: LotAllocation
    side_effects:
      - "status RESERVED -> SHIPPED; shipped_at stored"
      - "lot.cold_chain_status COOLED -> SHIPPED and lot.disposition_status RESERVED -> DELIVERED"
      - "commitment.shipped_lbs and fill_pct recomputed; increments buyer_commitment.version by 1"
      - "increments allocation.version and lot.version by 1"

  - method: POST
    path: "/berry-ops/lot-allocations/{lot_allocation_id}/release"
    description: "Release a reserved line back to inventory. Exactly reverses the pounds the allocation took from both the lot and the commitment."
    roles: [SalesManager]
    code: 200
    input: [release_reason_code]
    output: LotAllocation
    side_effects:
      - "status RESERVED -> RELEASED; release_reason_code stored"
      - "commitment.committed_lbs decremented by allocated_lbs; open_lbs and risk_flag recomputed; increments buyer_commitment.version by 1"
      - "lot.allocated_lbs and lot.available_lbs restored; lot.disposition_status RESERVED -> UNCOMMITTED when no RESERVED/SHIPPED line remains; increments lot.version by 1"

  # ---- test-driving surface --------------------------------------------------
  - method: POST
    path: "/berry-ops/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every date and expiry rule reads. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and never falls back to real wall-clock time."
    roles: [HarvestManager]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock used by hygiene expiry, window open/resume, commitment settle eligibility, shelf-life expiry and risk_flag is set to the supplied instant"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or carrying an undeclared role name."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed on the endpoint, or a Picker-role caller's X-User-ID is not an existing Picker id."
  - id: ERR_NOT_SESSION_SUPERVISOR
    http: 403
    condition: "The caller is not the supervisor_user_id of the crew owning the session's harvest window."
  - id: ERR_NOT_SESSION_OWNER
    http: 403
    condition: "A Picker-role caller acts on a PickSession whose picker_id is not their own X-User-ID."
  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "block_id in the path or body does not resolve to a Block."
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crew_id in the path or body does not resolve to a Crew."
  - id: ERR_PICKER_NOT_FOUND
    http: 404
    condition: "picker_id in the path or body does not resolve to a Picker."
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "harvest_window_id in the path or body does not resolve to a HarvestWindow."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "pick_session_id does not resolve to a PickSession."
  - id: ERR_PAYROLL_RUN_NOT_FOUND
    http: 404
    condition: "payroll_run_id does not resolve to a PayrollRun."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "fruit_lot_id or source_lot_id does not resolve to a FruitLot."
  - id: ERR_TUNNEL_NOT_FOUND
    http: 404
    condition: "cooling_tunnel_id does not resolve to a CoolingTunnel."
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "buyer_commitment_id does not resolve to a BuyerCommitment."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "lot_allocation_id does not resolve to a LotAllocation."
  - id: ERR_WATER_TEST_NOT_FOUND
    http: 404
    condition: "water_test_id does not resolve to a WaterTest."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, of the wrong JSON type, or an instant/date fails to parse as RFC 3339 UTC / YYYY-MM-DD."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed body field carries a value outside its declared set."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 400
    condition: "A numeric body field falls outside its declared range."
  - id: ERR_CULL_EXCEEDS_TALLY
    http: 400
    condition: "culled_clamshells exceeds clamshells_filled on a tally."
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "A body instant/date pair is mis-ordered (end before start)."
  - id: ERR_STALE_TUNNEL_VERSION
    http: 412
    condition: "expected_cooling_tunnel_version does not match the tunnel's current version."
  - id: ERR_STALE_COMMITMENT_VERSION
    http: 412
    condition: "expected_buyer_commitment_version does not match the commitment's current version."
  - id: ERR_INVALID_BLOCK_STATE
    http: 409
    condition: "Quarantining an already-held block, or clearing a block that is not under a manual hold."
  - id: ERR_INVALID_CREW_STATE
    http: 409
    condition: "The crew's status does not admit certify, release or support-plan."
  - id: ERR_INVALID_WINDOW_STATE
    http: 409
    condition: "The harvest window's status does not admit confirm, open, close, resume or cancel."
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "A pick session is created, tallied or disputed while its harvest window is not OPEN."
  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "The pick session's status does not admit tally, approve or dispute."
  - id: ERR_SESSION_NOT_TALLIED
    http: 409
    condition: "Approving a session whose quality_flag is still PENDING."
  - id: ERR_SESSION_PAYROLL_LOCKED
    http: 409
    condition: "Disputing a session already bound to a LOCKED payroll run."
  - id: ERR_INVALID_PAYROLL_STATE
    http: 409
    condition: "The payroll run's status does not admit lock or settle."
  - id: ERR_PERIOD_HAS_UNRESOLVED_SESSIONS
    http: 409
    condition: "Locking a period that still contains OPEN, TALLIED or DISPUTED sessions of the crew."
  - id: ERR_CREW_RUN_ALREADY_LOCKED
    http: 409
    condition: "Locking a run while another run of the same crew is already LOCKED."
  - id: ERR_INVALID_COLD_CHAIN_STATE
    http: 409
    condition: "The lot's cold_chain_status does not admit start-cooling, complete-cooling, repack, or the shipping of an allocation line drawn on it."
  - id: ERR_INVALID_DISPOSITION_STATE
    http: 409
    condition: "The lot's disposition_status does not admit start-cooling, repack, reject or allocation."
  - id: ERR_INVALID_ALLOCATION_STATE
    http: 409
    condition: "The allocation line is not RESERVED when shipping or releasing."
  - id: ERR_INVALID_COMMITMENT_STATE
    http: 409
    condition: "The buyer commitment is not OPEN when allocating, shipping, releasing or settling."
  - id: ERR_BLOCK_QUARANTINED
    http: 409
    condition: "The block is under a food-safety quarantine when a window is confirmed, opened or resumed, or a lot is packed against it."
  - id: ERR_BLOCK_NOT_CLEARED
    http: 409
    condition: "The block's food_safety_posture is RESTRICTED when a window is opened."
  - id: ERR_LOT_ON_FOOD_SAFETY_HOLD
    http: 409
    condition: "The lot carries food_safety_hold when cooled, repacked or allocated."
  - id: ERR_BLOCK_WATER_NOT_COMPLIANT
    http: 409
    condition: "The shipping lot's traceability block does not have water_status COMPLIANT."
  - id: ERR_HYGIENE_TRAINING_INVALID
    http: 409
    condition: "A picker's worker-hygiene training is missing or expired for the crew certification date or the session's work_date."
  - id: ERR_SUPPORT_PLAN_INCOMPLETE
    http: 409
    condition: "Certifying a crew whose housing beds or transport seats do not cover planned_head_count."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID already performed the opposing step (tally vs approve, lock vs settle, quarantine vs clear)."
  - id: ERR_TALLY_REVISION_LIMIT
    http: 409
    condition: "Re-tallying a session that has already used MAX_TALLY_REVISIONS (3) revisions."
  - id: ERR_DUPLICATE_RECORD
    http: 409
    condition: "A uniqueness constraint is violated (block name, tunnel name, session per window/picker/date, run per crew/period)."
  - id: ERR_BLOCK_REENTRY_CONFLICT
    http: 409
    condition: "A candidate harvest window overlaps, or falls within the 12-hour re-entry buffer of, a live window of the same block."
  - id: ERR_REPACK_MASS_BALANCE
    http: 422
    condition: "The repack output, cull and optical-reject clamshell counts do not sum to the source lot's clamshell_count, or the output count is zero."
  - id: ERR_LOT_BLOCK_MISMATCH
    http: 422
    condition: "A fruit lot's block_id differs from the block_id of its harvest window."
  - id: ERR_VARIETY_MISMATCH
    http: 422
    condition: "A lot's variety differs from its block's variety, or an allocated lot's variety differs from the commitment's variety."
  - id: ERR_CREW_MISMATCH
    http: 422
    condition: "A payroll run would bind a session of a different crew, or a harvest window names a RELEASED crew."
  - id: ERR_PICK_DATE_OUTSIDE_WINDOW
    http: 422
    condition: "A fruit lot's pick_date falls outside the calendar span of its harvest window."
  - id: ERR_WORK_DATE_OUTSIDE_WINDOW
    http: 422
    condition: "A pick session's work_date falls outside the calendar span of its harvest window."
  - id: ERR_TEMPORAL_ORDER_VIOLATION
    http: 422
    condition: "The logical clock is at or past window.end_at on open/resume, cooling instants are mis-ordered against pack_completed_at, or a commitment settles before its window_end_date has passed."
  - id: ERR_SHIP_OUTSIDE_PROGRAM_WINDOW
    http: 422
    condition: "shipped_at falls outside the buyer's delivery window, or the lot's shelf_life_expires_on has already passed."
  - id: ERR_INSUFFICIENT_PICKERS
    http: 422
    condition: "The crew has fewer pickers than required_picker_count on open, or required_picker_count would exceed CREW_CAP on confirm."
  - id: ERR_BRIX_BELOW_MINIMUM
    http: 422
    condition: "A harvest window is confirmed while its forecast_brix is below BRIX_MIN for the block's variety."
  - id: ERR_TUNNEL_CAPACITY_EXCEEDED
    http: 422
    condition: "Aggregate occupied slots plus the requested pallet_slots exceed the tunnel's slot_capacity over the requested interval."
  - id: ERR_LOT_VOLUME_EXCEEDED
    http: 422
    condition: "allocated_lbs exceeds the lot's available_lbs."
  - id: ERR_COMMITMENT_OVERBOOKED
    http: 422
    condition: "allocated_lbs exceeds the commitment's open_lbs."
  - id: ERR_CREW_LEDGER_NOT_CLEAR
    http: 422
    condition: "Releasing a crew that still holds accrued wages, live windows or unresolved sessions."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation_of_duties
#
# X-User-ID is compared against stored operator ids for three duty splits:
#   tally vs approve (PickSession.tallied_by_user_id vs approved_by_user_id)
#   lock vs settle   (PayrollRun.locked_by_user_id vs settled_by_user_id)
#   quarantine vs clear (Block.quarantined_by_user_id vs the clearing officer)
# -----------------------------------------------------------------------------
roles:
  - name: HarvestManager
    description: "Plans variety and field maturity forecasting, harvest windows and crew recruitment, housing and transport. Owns the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /berry-ops/blocks"
      - "POST /berry-ops/crews"
      - "POST /berry-ops/crews/{crew_id}/support-plan"
      - "POST /berry-ops/crews/{crew_id}/certify"
      - "POST /berry-ops/crews/{crew_id}/release"
      - "POST /berry-ops/harvest-windows"
      - "POST /berry-ops/harvest-windows/{harvest_window_id}/confirm"
      - "POST /berry-ops/harvest-windows/{harvest_window_id}/open"
      - "POST /berry-ops/harvest-windows/{harvest_window_id}/close"
      - "POST /berry-ops/harvest-windows/{harvest_window_id}/resume"
      - "POST /berry-ops/harvest-windows/{harvest_window_id}/cancel"
      - "POST /berry-ops/_clock/set_current_utc"
    shared_operations:
      - "POST /berry-ops/pickers (with CrewSupervisor)"
      - "POST /berry-ops/pickers/{picker_id}/hygiene-training (with CrewSupervisor)"
      - "all GET reads except GET /berry-ops/pick-sessions filtered as a Picker"

  - name: FoodSafetyOfficer
    description: "Runs the food safety program: agricultural water testing, quarantine and clearance, and quality rejection of lots."
    identity: opaque
    exclusive_operations:
      - "POST /berry-ops/water-tests"
      - "POST /berry-ops/blocks/{block_id}/quarantine"
      - "POST /berry-ops/blocks/{block_id}/clear"
    shared_operations:
      - "POST /berry-ops/fruit-lots/{fruit_lot_id}/reject (with PackhouseOperator)"
      - "GET /berry-ops/blocks, /water-tests, /crews, /harvest-windows, /fruit-lots and their single-resource reads"
      - "GET /berry-ops/blocks/{block_id}/traceability-summary"

  - name: CrewSupervisor
    description: "Field supervisor of one crew. Owns that crew's roster and its per-picker productivity tallies. Ownership is checked as X-User-ID == Crew.supervisor_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /berry-ops/pick-sessions"
      - "POST /berry-ops/pick-sessions/{pick_session_id}/tally"
    shared_operations:
      - "POST /berry-ops/pickers (with HarvestManager)"
      - "POST /berry-ops/pickers/{picker_id}/hygiene-training (with HarvestManager)"
      - "POST /berry-ops/pick-sessions/{pick_session_id}/dispute (with Picker)"
      - "GET /berry-ops/crews, /pickers, /harvest-windows, /pick-sessions, /payroll-runs and their single-resource reads"

  - name: PayrollClerk
    description: "Prices and settles piece-rate pay with minimum-wage guarantees. May approve tallies but never author them, and may not both lock and settle the same run."
    identity: opaque
    exclusive_operations:
      - "POST /berry-ops/pick-sessions/{pick_session_id}/approve"
      - "POST /berry-ops/payroll-runs"
      - "POST /berry-ops/payroll-runs/{payroll_run_id}/lock"
      - "POST /berry-ops/payroll-runs/{payroll_run_id}/settle"
    shared_operations:
      - "GET /berry-ops/crews, /pickers, /harvest-windows, /pick-sessions, /payroll-runs and their single-resource reads"

  - name: PackhouseOperator
    description: "Runs field-heat removal, forced-air cooling, the optical-sorting repack line and lot rejection."
    identity: opaque
    exclusive_operations:
      - "POST /berry-ops/cooling-tunnels"
      - "POST /berry-ops/fruit-lots"
      - "POST /berry-ops/fruit-lots/{fruit_lot_id}/start-cooling"
      - "POST /berry-ops/fruit-lots/{fruit_lot_id}/complete-cooling"
      - "POST /berry-ops/fruit-lots/{fruit_lot_id}/repack"
    shared_operations:
      - "POST /berry-ops/fruit-lots/{fruit_lot_id}/reject (with FoodSafetyOfficer)"
      - "GET /berry-ops/blocks, /cooling-tunnels, /harvest-windows, /fruit-lots, /buyer-commitments, /lot-allocations and their single-resource reads"
      - "GET /berry-ops/blocks/{block_id}/traceability-summary"

  - name: SalesManager
    description: "Negotiates and settles buyer program commitments and allocates cooled fruit against them."
    identity: opaque
    exclusive_operations:
      - "POST /berry-ops/buyer-commitments"
      - "POST /berry-ops/buyer-commitments/{buyer_commitment_id}/settle"
      - "POST /berry-ops/lot-allocations"
      - "POST /berry-ops/lot-allocations/{lot_allocation_id}/ship"
      - "POST /berry-ops/lot-allocations/{lot_allocation_id}/release"
    shared_operations:
      - "GET /berry-ops/blocks, /water-tests, /cooling-tunnels, /fruit-lots, /buyer-commitments, /lot-allocations and their single-resource reads"
      - "GET /berry-ops/blocks/{block_id}/traceability-summary"

  - name: Picker
    description: "A seasonal harvest worker. X-User-ID is the id of a Picker row, so a picker may read and dispute only their own sessions."
    identity: "entity_backed:Picker"
    exclusive_operations: []
    shared_operations:
      - "POST /berry-ops/pick-sessions/{pick_session_id}/dispute (with CrewSupervisor; restricted to their own sessions)"
      - "GET /berry-ops/pick-sessions/{pick_session_id} and GET /berry-ops/pick-sessions (their own)"
      - "GET /berry-ops/pickers/{picker_id} (their own)"
