          setup:
            - "MINI fixture with an APPROVED one-peer group and PayProgram P1 COMMITTEE_APPROVED, share price 50.00, no incentive metrics."
            - "A GRANTED LONG_TERM_PSU award of 100,000 units at grant price 50.00; with no LONG_TERM_PSU metric defined its certified_factor_pct stays null so the REALIZABLE variant uses ASSUMED_TARGET_FACTOR_PCT 100.00, giving realizable_value_usd 5,000,000.00."
            - "An ISS ProxyAdvisorScreen in SCREENED."
            - "A CD_AND_A CdaDraft with word_count 2000 and required_tables_included true, authored by counsel-001, submitted, and LEGAL_CLEARED by counsel-002 — one call away from filing."
