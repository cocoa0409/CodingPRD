          assert:
            - "all nine calls return status_code == 403"
            - "${e1} == ${e2} == ${e3} == ${e4} == ${e5} == ${e6} == ${e7} == ${e8} == ${e9} == \"ERR_UNAUTHORIZED\""
            - "${e4} and ${e7} are ERR_UNAUTHORIZED, NOT ERR_DEFECT_NOT_FOUND / ERR_CASE_NOT_FOUND — priority 2 precedes priority 4"
            - "${e5} and ${e8} are ERR_UNAUTHORIZED, NOT ERR_REPORT_NOT_FOUND / ERR_ROAD_NOT_FOUND — priority 2 precedes priority 5"
            - "${e7} is ERR_UNAUTHORIZED, NOT ERR_AGENCY_IDENTITY_MISMATCH — priority 2 precedes priority 3"
            - "GET /gis/jurisdictions returns meta.total_count == 1 — no denied write left a trace"
            - "Jurisdiction.${j_id}.cell_count == 0 and covered_cell_count == 0 and gap_pair_count == 0"
            - "GET /gis/agencies returns meta.total_count == 1 and GET /gis/road-centerlines returns meta.total_count == 0"

      - name: permit_coordinator_cannot_run_a_qc_scan_rejected
        claim_type: unauthorized_denial
        grounds:
          - roles.PermitCoordinator
          - roles.GisAnalyst.exclusive_operations
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The PermitCoordinator owns the request intake but not the QC scan: the same POST body that succeeds for a GisAnalyst is 403 ERR_UNAUTHORIZED for a PermitCoordinator, and the denial produces no QcValidationReport row at all."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and one DRAFT centerline."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          assert:
            - "the PermitCoordinator call returns status_code == 403 with ${err_id} == \"ERR_UNAUTHORIZED\""
            - "the GisAnalyst call returns status_code == 201 with QcValidationReport.${rep_id}.generated_by_user_id == \"analyst-1\""
            - "QcValidationReport.${rep_id}.scope == \"ROAD\" and status == \"GENERATED\""
            - "GET /gis/qc-validation-reports returns meta.total_count == 1 — the denied scan created nothing"
            - "GET /gis/qc-validation-reports as PermitCoordinator returns status_code 200 — reads are shared, writes are not"

      - name: agency_liaison_cannot_touch_another_agencys_boundary_rejected
        claim_type: unauthorized_denial
        grounds:
          - roles.AgencyLiaison
          - validations[priority=3]
          - errors.ERR_AGENCY_IDENTITY_MISMATCH
        distinguishing_aspect: "AgencyLiaison is entity_backed:Agency, so authorisation is per-row rather than per-role: a liaison holding the correct role is still refused 403 ERR_AGENCY_IDENTITY_MISMATCH on a peer agency's boundary — on create (payload agency other than the caller) and on propose and cell-assignments (path resource owned by another agency) — and priority 3 fires before any precondition on the boundary itself."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and two ACTIVE agencies: a1 Larimer County Sheriff (LAW) and a2 Poudre Fire Authority (FIRE)."
            - "One DRAFT boundary b1 owned by a1, created by the a1 liaison."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a2_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${a1_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { b1_id: $.data.id, b1_version: $.data.version }
          trigger:
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${a2_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${a2_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b1_version}" }
              as: AgencyLiaison
              as_user_id: "${a2_id}"
