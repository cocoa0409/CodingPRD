            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@dep.example", cert_number: "AD" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 10000000, guaranteed_cents: 10000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 10000000, proposed_guaranteed_cents: 10000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons/${cs_id}/lock"
              payload: {}
              as: LeagueOfficer
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_locked: $.data.version }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_locked}" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESOURCE_LOCKED   # CapSeason.status != OPEN blocks submit"
            - "Proposal.${p_id}.status == DRAFT   # unchanged"

      - name: contract_sign_gated_by_client_active
        grounds:
          - state_machines.Contract.NEGOTIATING_to_SIGNED
          - state_machines.Client.ACTIVE_to_TRANSITIONING
        distinguishing_aspect: |
          Pair = Contract -> Client (different entity pair from instance 1).
          Signing requires Client.status == ACTIVE. When the Client is
          TRANSITIONING (mid agent-change), sign MUST be rejected with
