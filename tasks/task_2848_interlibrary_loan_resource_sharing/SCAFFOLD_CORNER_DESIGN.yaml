              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${southc_id}", manual_rank: 1, quoted_fee_cents: 1200, quoted_turnaround_days: 9, is_enabled: true }
