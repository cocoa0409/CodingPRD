# =============================================================================
# Task 3334: Adjustable Bed Delivery, In-Home Setup & Sleep Data Subscription
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Adjustable Bed Delivery, In-Home Setup & Sleep Data Subscription (Sleep Number): in-store fit assessment producing a recommended firmness setting and product configuration, order fulfillment with modular components shipped and assembled in the home by delivery teams, delivery scheduling with room preparation, old mattress removal and setup verification, adjustable base pairing, remote configuration and connectivity setup during the visit, sleep data collection with nightly scoring and feature entitlements tied to account registration, in-home trial period with return logistics and restocking terms, service claims on air chambers, pumps and electronics under a prorated limited warranty, financing offers and promotional payment plan administration

domain_name: adjustable-bed-sleep-retail
api_prefix: /sleep

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: zone_codes, type: array, source: input, description: "Delivery zone postal prefixes the store serves" }
      - { name: default_window_capacity_slots, type: integer, source: input, default: 4, description: "Default slot capacity for new delivery windows" }

  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique catalog SKU" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "MATTRESS | ADJUSTABLE_BASE | AIR_CHAMBER | PUMP | ELECTRONICS | BEDDING" }
      - { name: price_cents, type: integer, source: input, description: "Unit retail price in cents" }
      - { name: replacement_part_price_cents, type: integer, source: input, default: 0, description: "Replacement-part price used as the proration base for warranty credit (CHAMBER/PUMP/ELECTRONICS components)" }
      - { name: warranty_months, type: integer, source: input, description: "Limited-warranty length in months for this model's warranty component category" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; the store that owns delivery and service for this customer" }
      - { name: email, type: string, source: input, description: "Unique account email" }
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: subscription_tier, type: enum, source: input, default: "FREE", description: "FREE | PLUS | PREMIUM — drives sleep-data feature entitlements" }
      - { name: subscription_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CANCELLED" }
      - { name: store_credit_cents, type: integer, source: computed, default: 0, description: "Credit balance; incremented by approved warranty credit and STORE_CREDIT trial refunds; decremented by applications" }
      - { name: entitlements, type: array, source: computed, description: "Derived from subscription_tier: FREE -> [SCORE_BASIC]; PLUS -> [SCORE_BASIC, SCORE_DETAIL]; PREMIUM -> [SCORE_BASIC, SCORE_DETAIL, TRENDS]" }

  - name: FitAssessment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; assessed customer" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the assessment ran" }
      - { name: sleep_position, type: enum, source: input, description: "SIDE | BACK | STOMACH | COMBINATION" }
      - { name: weight_band, type: enum, source: input, description: "UNDER_130 | BAND_130_230 | OVER_230" }
      - { name: partner_sleeper, type: boolean, source: input, description: "True when the bed is shared" }
      - { name: preferred_feel, type: enum, source: input, description: "PLUSH | MEDIUM | FIRM" }
      - { name: recommended_firmness, type: integer, source: computed, description: "0-100 in steps of 5; computed by recommended_firmness calculation on complete" }
      - { name: recommended_skus, type: array, source: computed, description: "SKU list computed by recommended_configuration calculation on complete" }
      - { name: supersedes_assessment_id, type: string, source: input, description: "FK -> FitAssessment.id; optional self-reference — the earlier assessment this one replaces" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> COMPLETED -> SUPERSEDED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null while DRAFT" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: fit_assessment_id, type: string, source: input, description: "FK -> FitAssessment.id; the COMPLETED assessment that justified the configuration" }
      - { name: line_items, type: array, source: input, description: "Array of {sku, qty}; sku references ProductModel.sku. Server expands each element with unit_price_cents (snapshot) and computed line_total_cents = round_half_up(qty * unit_price_cents)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents over line_items" }
      - { name: discount_cents, type: integer, source: computed, description: "Tiered discount from order_totals calculation" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "9900 when subtotal_cents < 200000, else 0" }
      - { name: total_due_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + delivery_fee_cents" }
      - { name: total_paid_cents, type: integer, source: system, default: 0, description: "Amount captured at confirm; equals total_due_cents at confirm time" }
      - { name: order_status, type: enum, source: system, default: "PLACED", description: "PLACED -> CONFIRMED -> FULFILLING -> DELIVERED -> CLOSED | RETURNED; CANCELLED from PLACED or CONFIRMED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID -> PAID | FINANCED -> REFUNDED (parallel dimension, independent of order_status)" }
      - { name: trial_verified_at, type: datetime, source: system, description: "Logical-clock timestamp when a DeliveryVisit first reaches VERIFIED; starts the 100-night trial; null until then" }

  - name: DeliveryWindow
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store operating the window" }
      - { name: team_id, type: string, source: input, description: "Delivery-crew identifier (opaque string); windows for the same (store_id, team_id) must not overlap" }
      - { name: window_start, type: datetime, source: input, description: "Window start (half-open, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Window end (half-open, exclusive); must be > window_start" }
      - { name: capacity_slots, type: integer, source: input, description: "Total slot budget for the window" }
      - { name: reserved_slots, type: integer, source: computed, default: 0, description: "Sum of slot_need over SCHEDULED visits attached to this window; released on cancel/reschedule-away, consumed on schedule/promotion" }

  - name: DeliveryVisit
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being delivered and installed" }
      - { name: delivery_window_id, type: string, source: input, description: "FK -> DeliveryWindow.id; requested window; retained while WAITLISTED as the requested window" }
      - { name: remove_old_mattress, type: boolean, source: input, default: false, description: "Old-mattress removal flag; adds 1 to slot_need" }
      - { name: slot_need, type: integer, source: computed, description: "= 2 + (remove_old_mattress ? 1 : 0)" }
      - { name: room_prep_notes, type: string, source: input, description: "Room preparation notes recorded at scheduling" }
      - { name: setup_checklist, type: object, source: input, description: "{base_assembled, chambers_connected, remote_configured, connectivity_verified} — all four must be true for outcome VERIFIED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> VERIFIED | FAILED_SETUP | CANCELLED; FAILED_SETUP -> SCHEDULED via reschedule; WAITLISTED -> SCHEDULED via promotion or reschedule; WAITLISTED -> CANCELLED" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order this hardware was installed under" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; denormalized from Order.customer_id at registration" }
      - { name: kind, type: enum, source: input, description: "BASE | PUMP | CHAMBER | SENSOR" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique per kind" }
      - { name: firmware_version, type: string, source: input, description: "Firmware flashed at install" }
      - { name: pairing_status, type: enum, source: system, default: "UNPAIRED", description: "UNPAIRED -> PAIRED -> UNPAIRED (cyclic re-pair allowed)" }
      - { name: connectivity, type: enum, source: computed, default: "OFFLINE", description: "ONLINE when the pair action carried connectivity_verified=true, else OFFLINE" }
      - { name: final_nights_count, type: integer, source: computed, default: 0, description: "Number of FINAL SleepNight rows for this device; incremented when a night finalizes" }

  - name: SleepNight
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; sensor/base that produced the record" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; denormalized from Device.customer_id at ingest" }
      - { name: night_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD) of the night; unique per device" }
      - { name: minutes_asleep, type: integer, source: input, description: "Total recorded sleep minutes" }
      - { name: restlessness_events, type: integer, source: input, description: "Count of restlessness events" }
      - { name: avg_heart_rate, type: integer, source: input, description: "Average sleeping heart rate (bpm)" }
      - { name: provisional_score, type: integer, source: computed, description: "Score from partial-night data (sleep_score provisional variant); set at ingest" }
      - { name: final_score, type: integer, source: computed, description: "Score from full-night replay (sleep_score final variant); set at finalization; null while PROVISIONAL" }
      - { name: status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL -> FINAL (system: logical clock reaches night_date + 1 day at 12:00Z)" }

  - name: TrialReturn
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being returned under the in-home trial" }
      - { name: reason, type: string, source: input, description: "Free-text return reason" }
      - { name: refund_destination, type: enum, source: input, description: "ORIGINAL_PAYMENT | STORE_CREDIT" }
      - { name: initiated_night_index, type: integer, source: computed, description: "floor((clock - Order.trial_verified_at)/86400s) at initiation; must be <= 99" }
      - { name: condition, type: enum, source: system, description: "GOOD | DAMAGED — set at inspect" }
      - { name: depreciation_cents, type: integer, source: computed, description: "Per-line depreciation summed (restocking_refund calculation); set at inspect" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "max(9900, round_half_up(0.10 * total_paid_cents)); set at inspect" }
      - { name: refund_cents, type: integer, source: computed, description: "max(0, total_paid_cents - depreciation_cents - restocking_fee_cents); set at inspect" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED -> REFUNDED | REJECTED (branch at inspect with divergent side effects)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order the failed component belongs to" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; the failed chamber/pump/electronics device" }
      - { name: component_category, type: enum, source: input, description: "CHAMBER | PUMP | ELECTRONICS | STRUCTURAL; selects the warranty-months constant" }
      - { name: proration_variant, type: enum, source: input, description: "TIME_BASED | NIGHTS_USED — selects the proration variant of prorated_warranty_credit" }
      - { name: description, type: string, source: input, description: "Failure description" }
      - { name: months_in_service, type: integer, source: computed, description: "floor(days since Order.trial_verified_at / 30) at filing" }
      - { name: final_nights_used, type: integer, source: computed, description: "Device.final_nights_count at filing" }
      - { name: credit_cents, type: integer, source: computed, description: "Prorated credit computed at review-APPROVE; null until then" }
      - { name: applied_to, type: enum, source: computed, description: "FINANCING_BALANCE when the order has an ACTIVE FinancingPlan (reduces balance_cents), else STORE_CREDIT (credits Customer.store_credit_cents); set at review-APPROVE" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED -> APPROVED | DENIED; DENIED -> APPEALED -> APPROVED | DENIED (appeal cycle, repeatable)" }

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being financed" }
      - { name: offer_type, type: enum, source: input, description: "ZERO_APR | DEFERRED_INTEREST | STANDARD" }
      - { name: down_payment_cents, type: integer, source: input, default: 0, description: "Cash down payment collected outside the plan" }
      - { name: term_months, type: integer, source: input, description: "Must be one of 12 | 24 | 36" }
      - { name: apr_bps, type: integer, source: input, description: "Annual percentage rate in basis points; must be 0 for ZERO_APR" }
      - { name: principal_cents, type: integer, source: computed, description: "= Order.total_due_cents - down_payment_cents at creation" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "financing_schedule calculation; ZERO_APR: ceil(principal/term); DEFERRED_INTEREST: ceil(principal*0.03); STANDARD: amortized" }
      - { name: promo_months, type: integer, source: computed, description: "12 for DEFERRED_INTEREST, else 0" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of recorded payments" }
      - { name: balance_cents, type: integer, source: computed, description: "principal_cents + retro interest posted - paid_cents - warranty/return credits applied" }
      - { name: retro_interest_posted, type: boolean, source: system, default: false, description: "True once deferred-interest retro accrual has been posted" }
      - { name: settled_credit_cents, type: integer, source: computed, default: 0, description: "Credit memo applied at trial-refund settlement" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation (order confirm); null until ACTIVE" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED -> ACCEPTED -> ACTIVE -> PAID_OFF | SETTLED_EARLY | DEFAULTED; ACTIVE <-> DELINQUENT cycle; ACCEPTED -> VOIDED on order cancel" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FitAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /sleep/fit-assessments/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "All profile inputs present (sleep_position, weight_band, partner_sleeper, preferred_feel)"
        side_effects:
          - "Computes recommended_firmness (recommended_firmness calculation)"
          - "Computes recommended_skus (recommended_configuration calculation)"
          - "Sets completed_at to logical clock"
          - "If supersedes_assessment_id set: the referenced COMPLETED assessment transitions COMPLETED -> SUPERSEDED (its own side effect: none)"
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system (a successor assessment carrying supersedes_assessment_id == this id completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: PLACED
    terminal_states: [CANCELLED, CLOSED, RETURNED]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /sleep/orders/{id}/confirm"
        actor: SalesAssociate
        preconditions:
          - "payment_method == PAY_IN_FULL, or (payment_method == FINANCING and a FINANCING plan in ACCEPTED exists for this order)"
        side_effects:
          - "Sets total_paid_cents = total_due_cents"
          - "payment_status: UNPAID -> PAID (PAY_IN_FULL) or -> FINANCED (FINANCING)"
          - "FINANCING: linked FinancingPlan ACCEPTED -> ACTIVE, sets activated_at"
      - from: CONFIRMED
        to: FULFILLING
        trigger: "system (first DeliveryVisit for this order reaches SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLING
        to: DELIVERED
        trigger: "system (a DeliveryVisit for this order completes with outcome VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets trial_verified_at to logical clock (starts 100-night trial)"
      - from: DELIVERED
        to: CLOSED
        trigger: "system (logical clock reaches trial_verified_at + 101 days — a one-day grace past the 100-night trial boundary — with no non-terminal TrialReturn)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: RETURNED
        trigger: "system (a TrialReturn for this order reaches REFUNDED)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status -> REFUNDED"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /sleep/orders/{id}/cancel"
        actor: "Customer | SalesAssociate"
        preconditions: []
        side_effects:
          - "Cascade link 1: every non-terminal DeliveryVisit (SCHEDULED | WAITLISTED | FAILED_SETUP) for this order -> CANCELLED"
          - "Cascade link 2: each SCHEDULED visit so cancelled releases slot_need slots on its DeliveryWindow (reserved_slots -= slot_need)"
          - "Cascade link 3: each DeliveryWindow that freed slots runs waitlist promotion (window_slot_reservation calculation), transitioning promoted WAITLISTED visits -> SCHEDULED and consuming slots again"
          - "Any ACCEPTED FinancingPlan for this order -> VOIDED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sleep/orders/{id}/cancel"
        actor: "Customer | SalesAssociate"
        preconditions:
          - "No DeliveryVisit for this order is VERIFIED"
        side_effects:
          - "Same 3-link cascade as PLACED -> CANCELLED"
          - "ACTIVE FinancingPlan -> VOIDED; payment_status PAID|FINANCED -> REFUNDED"
    note: "payment_status is a parallel state dimension: UNPAID -> PAID | FINANCED -> REFUNDED, evolving independently of order_status except where transitions above pin it."

  - entity: DeliveryVisit
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: null
        to: WAITLISTED
        trigger: "POST /sleep/delivery-visits with allow_waitlist=true when the requested window lacks capacity"
        actor: SalesAssociate
        preconditions:
          - "reserved_slots + slot_need > capacity_slots on the requested window"
        side_effects: []
        note: "Creation-time branch: capacity available -> SCHEDULED; full + allow_waitlist -> WAITLISTED; full + no waitlist -> ERR_WINDOW_CAPACITY_EXCEEDED"
      - from: WAITLISTED
        to: SCHEDULED
        trigger: "system (waitlist promotion when its requested DeliveryWindow frees enough slots)"
        actor: system
        preconditions:
          - "window reserved_slots + slot_need <= capacity_slots"
        side_effects:
          - "DeliveryWindow.reserved_slots += slot_need"
      - from: SCHEDULED
        to: VERIFIED
        trigger: "POST /sleep/delivery-visits/{id}/complete with outcome=VERIFIED"
        actor: DeliveryTechnician
        preconditions:
          - "setup_checklist all four flags true (else ERR_SETUP_CHECKLIST_INCOMPLETE)"
          - "Every Device with kind == BASE on the order has pairing_status == PAIRED (else ERR_DEVICE_NOT_PAIRED)"
        side_effects:
          - "Order FULFILLING -> DELIVERED; sets Order.trial_verified_at (bubble-up)"
      - from: SCHEDULED
        to: FAILED_SETUP
        trigger: "POST /sleep/delivery-visits/{id}/complete with outcome=FAILED_SETUP"
        actor: DeliveryTechnician
        preconditions: []
        side_effects: []
      - from: FAILED_SETUP
        to: SCHEDULED
        trigger: "POST /sleep/delivery-visits/{id}/reschedule"
        actor: "SalesAssociate | Customer"
        preconditions:
          - "OCC: expected_visit_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Moves attachment to new_delivery_window_id; consumes slot_need on the new window (or -> WAITLISTED if full and allow_waitlist)"
          - "Increments version by 1"
        note: "cycle: FAILED_SETUP -> SCHEDULED -> FAILED_SETUP repeatable"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /sleep/delivery-visits/{id}/reschedule (move between windows)"
        actor: "SalesAssociate | Customer"
        preconditions:
          - "OCC: expected_visit_version matches (else ERR_STALE_VERSION)"
          - "Target window start in the future (else ERR_WINDOW_IN_PAST)"
        side_effects:
          - "Releases slot_need on old window; consumes on new window (or -> WAITLISTED if full and allow_waitlist)"
          - "Release triggers waitlist promotion on the old window"
          - "Increments version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Releases slot_need on its DeliveryWindow, which triggers waitlist promotion on that window"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Device
    initial_state: UNPAIRED
    terminal_states: []
    transitions:
      - from: UNPAIRED
        to: PAIRED
        trigger: "POST /sleep/devices/{id}/pair with target_status=PAIRED"
        actor: DeliveryTechnician
        preconditions:
          - "Order.order_status not in {CANCELLED, RETURNED}"
        side_effects:
          - "connectivity := ONLINE if connectivity_verified else OFFLINE"
      - from: PAIRED
        to: UNPAIRED
        trigger: "POST /sleep/devices/{id}/pair with target_status=UNPAIRED"
        actor: DeliveryTechnician
        preconditions: []
        side_effects:
          - "connectivity := OFFLINE"
    note: "pairing_status is cyclic UNPAIRED <-> PAIRED (re-pair allowed)"

  - entity: SleepNight
    initial_state: PROVISIONAL
    terminal_states: [FINAL]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system (logical clock set to >= night_date + 1 day 12:00Z)"
        actor: system
        preconditions: []
        side_effects:
          - "Computes final_score (sleep_score final variant)"
          - "Device.final_nights_count += 1"

  - entity: TrialReturn
    initial_state: INITIATED
    terminal_states: [REFUNDED, REJECTED]
    transitions:
      - from: INITIATED
        to: REFUNDED
        trigger: "POST /sleep/trial-returns/{id}/inspect with outcome=APPROVED"
        actor: ServiceAgent
        preconditions: []
        side_effects:
          - "Sets condition, depreciation_cents, restocking_fee_cents, refund_cents (restocking_refund calculation)"
          - "Cascade link 1: Order DELIVERED -> RETURNED; payment_status -> REFUNDED"
          - "Cascade link 2: if the order has an ACTIVE FinancingPlan: settled_credit_cents = min(refund_cents, balance_cents); balance_cents -= settled_credit_cents; plan ACTIVE -> SETTLED_EARLY"
          - "If refund_destination == STORE_CREDIT: Customer.store_credit_cents += (refund_cents - settled_credit_cents)"
      - from: INITIATED
        to: REJECTED
        trigger: "POST /sleep/trial-returns/{id}/inspect with outcome=REJECTED"
        actor: ServiceAgent
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [APPROVED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /sleep/warranty-claims/{id}/review with decision=APPROVE"
        actor: ServiceAgent
        preconditions:
          - "Order.order_status not in {CANCELLED, RETURNED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Computes credit_cents (prorated_warranty_credit with the claim's proration_variant)"
          - "Applies credit: order has ACTIVE FinancingPlan -> balance_cents -= credit_cents, applied_to=FINANCING_BALANCE; else Customer.store_credit_cents += credit_cents, applied_to=STORE_CREDIT"
      - from: FILED
        to: DENIED
        trigger: "POST /sleep/warranty-claims/{id}/review with decision=DENY"
        actor: ServiceAgent
        preconditions: []
        side_effects: []
      - from: DENIED
        to: APPEALED
        trigger: "POST /sleep/warranty-claims/{id}/appeal"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: APPROVED
        trigger: "POST /sleep/warranty-claims/{id}/review with decision=APPROVE"
        actor: ServiceAgent
        preconditions:
          - "Order.order_status not in {CANCELLED, RETURNED}"
        side_effects:
          - "Same credit computation and application as FILED -> APPROVED"
      - from: APPEALED
        to: DENIED
        trigger: "POST /sleep/warranty-claims/{id}/review with decision=DENY"
        actor: ServiceAgent
        preconditions: []
        side_effects: []
    note: "DENIED -> APPEALED -> DENIED cycle is repeatable; APPROVED is terminal"

  - entity: FinancingPlan
    initial_state: OFFERED
    terminal_states: [PAID_OFF, SETTLED_EARLY, DEFAULTED, VOIDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /sleep/financing-plans/{id}/accept"
        actor: Customer
        preconditions:
          - "Constraint: term_months in {12,24,36} already enforced at create; acceptance re-checks nothing structural"
        side_effects: []
      - from: ACCEPTED
        to: ACTIVE
        trigger: "system (order confirm with payment_method=FINANCING referencing this plan)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets activated_at to logical clock"
      - from: ACCEPTED
        to: VOIDED
        trigger: "system (order cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (logical clock set: missed = installments_due - paid_installments >= 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /sleep/financing-plans/{id}/payments bringing paid_installments >= installments_due - 1"
        actor: FinanceAgent
        preconditions: []
        side_effects: []
        note: "cure cycle: ACTIVE -> DELINQUENT -> ACTIVE"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system (logical clock set: missed >= 4)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (a payment reduces balance_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SETTLED_EARLY
        trigger: "system (trial-refund credit memo: TrialReturn REFUNDED cascade link 2)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-modify-stale-version
    parent_entity: Order
    write_endpoint: "PATCH /sleep/orders/{id}"
    occ_field: "expected_order_version"
    description: |
      Modifying a PLACED order's line_items with an expected_order_version
      that no longer matches Order.version is rejected. This captures the case
      where another writer has already modified the order since the client
      last observed it, making the client's view of the priced lines stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: visit-reschedule-stale-version
    parent_entity: DeliveryVisit
    write_endpoint: "POST /sleep/delivery-visits/{id}/reschedule"
    occ_field: "expected_visit_version"
    description: |
      Rescheduling a DeliveryVisit with an expected_visit_version that no
      longer matches DeliveryVisit.version is rejected. This captures the case
      where the visit has already been rescheduled since the client last
      observed it, so the window the client believes the visit occupies is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: recommended_firmness
    trigger: "POST /sleep/fit-assessments/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      base = { SIDE: 35, BACK: 55, STOMACH: 65, COMBINATION: 50 }[sleep_position]
      adj  = { UNDER_130: -10, BAND_130_230: 0, OVER_230: +10 }[weight_band]
           + { PLUSH: -10, MEDIUM: 0, FIRM: +10 }[preferred_feel]
           + (-5 if partner_sleeper else 0)
      raw  = base + adj
      recommended_firmness = clamp(round_to_nearest_5(raw), 5, 100)
      # round_to_nearest_5 rounds half up: raw=52 -> 50, raw=53 -> 55
    input_set: "the FitAssessment's four profile inputs"
    constants:
      BASE_SIDE: 35
      BASE_BACK: 55
      BASE_STOMACH: 65
      BASE_COMBINATION: 50
      WEIGHT_UNDER_130: -10
      WEIGHT_OVER_230: 10
      FEEL_PLUSH: -10
      FEEL_FIRM: 10
      PARTNER_ADJ: -5
      FIRMNESS_MIN: 5
      FIRMNESS_MAX: 100
    precision: "integer, steps of 5, round half up"

  - name: recommended_configuration
    trigger: "POST /sleep/fit-assessments/{id}/complete"
    algorithm: constraint_propagation
    formula: |
      required_categories = [MATTRESS, ADJUSTABLE_BASE, AIR_CHAMBER, PUMP]
      for each category: candidate set = all ProductModels with that category
      select per category: lowest price_cents; tie-break: created_at ASC
      (never id). recommended_skus = the four selected SKUs.
      Empty candidate set for a category -> complete fails ERR_VALIDATION.
    input_set: "all ProductModels (no status filter — catalog is always sellable)"
    constants:
      REQUIRED_CATEGORIES: "MATTRESS,ADJUSTABLE_BASE,AIR_CHAMBER,PUMP"
    precision: "n/a (selector)"

  - name: order_totals
    trigger: "POST /sleep/orders (create) and PATCH /sleep/orders/{id} (line_items replace)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned:
      1. per line: line_total_cents = round_half_up(qty * unit_price_cents)
         (unit_price_cents snapshotted from ProductModel.price_cents)
      2. subtotal_cents = sum(line_total_cents)
      3. discount_pct = 0.15 if subtotal_cents >= 1000000
                      else 0.10 if subtotal_cents >= 500000
                      else 0
      4. discount_cents = round_half_up(subtotal_cents * discount_pct)
      5. delivery_fee_cents = 0 if subtotal_cents >= 200000 else 9900
         (threshold uses SUBTOTAL BEFORE discount)
      6. total_due_cents = subtotal_cents - discount_cents + delivery_fee_cents
    input_set: "the order's line_items as submitted in this write"
    constants:
      DISCOUNT_TIER1_SUBTOTAL: 500000
      DISCOUNT_TIER1_PCT: 0.10
      DISCOUNT_TIER2_SUBTOTAL: 1000000
      DISCOUNT_TIER2_PCT: 0.15
      DELIVERY_FEE_CENTS: 9900
      FREE_DELIVERY_SUBTOTAL: 200000
    precision: "integer cents, round_half_up; discount computed on subtotal then rounded once"

  - name: financing_schedule
    trigger: "POST /sleep/financing-plans (create)"
    algorithm: tiered_pricing
    formula: |
      principal_cents = Order.total_due_cents - down_payment_cents
      ZERO_APR:           apr_bps must be 0
                          monthly_payment_cents = ceil(principal_cents / term_months)
      DEFERRED_INTEREST:  promo_months = 12
                          monthly_payment_cents = ceil(principal_cents * 0.03)
      STANDARD:           r = apr_bps / 10000 / 12
                          monthly_payment_cents = round_half_up(
                            principal_cents * r / (1 - (1 + r)^(-term_months)))
      Non-linear interaction: offer_type gates both the rate semantics AND the
      payment formula AND (for DEFERRED_INTEREST) the down-payment floor of
      round_half_up(0.10 * total_due_cents); term_months must be in {12,24,36}
      regardless of type.
    input_set: "Order.total_due_cents, down_payment_cents, offer_type, term_months, apr_bps"
    constants:
      ALLOWED_TERMS: "12,24,36"
      DEFERRED_PROMO_MONTHS: 12
      DEFERRED_MIN_PAYMENT_PCT: 0.03
      DEFERRED_DOWN_PAYMENT_PCT: 0.10
      MAX_PRINCIPAL_CENTS: 500000
    precision: "integer cents; ceil for ZERO_APR/DEFERRED payments; round_half_up for STANDARD"

  - name: deferred_interest_accrual
    trigger: "system on POST /_clock/set_current_utc, for each ACTIVE DEFERRED_INTEREST plan"
    algorithm: threshold
    formula: |
      if clock >= activated_at + promo_months months and balance_cents > 0
         and not retro_interest_posted:
        retro = round_half_up(principal_cents * (apr_bps / 10000) * (promo_months / 12))
        balance_cents += retro
        retro_interest_posted = true
      If balance_cents == 0 at promo end, no retro interest ever posts.
    input_set: "ACTIVE FinancingPlans with offer_type == DEFERRED_INTEREST"
    constants:
      DEFERRED_PROMO_MONTHS: 12
    precision: "integer cents, round_half_up"

  - name: sleep_score
    trigger: "provisional: POST /sleep/devices/{id}/sleep-nights (ingest); final: PROVISIONAL -> FINAL finalization"
    algorithm: weighted_scoring
    formula: |
      shared:  rest_component = max(0, 100 - 2 * restlessness_events)
               duration_component = min(100, round_half_up(minutes_asleep * 100 / 480))
               heart_component = max(0, 100 - abs(avg_heart_rate - 60))
      provisional_score = round_half_up(0.6 * rest_component + 0.4 * duration_component)
      final_score       = clamp(round_half_up(0.5 * rest_component
                                              + 0.3 * duration_component
                                              + 0.2 * heart_component), 0, 100)
    input_set: "the single SleepNight row"
    constants:
      TARGET_SLEEP_MINUTES: 480
      RESTLESSNESS_PENALTY_PER_EVENT: 2
      TARGET_HEART_RATE: 60
    precision: "integer 0-100, round_half_up"
    variants:
      - name: provisional
        when: "at ingest; partial-night reading"
        difference: "weights 0.6/0.4 over rest/duration; heart rate ignored"
      - name: final
        when: "at finalization (clock reaches night_date + 1 day 12:00Z)"
        difference: "weights 0.5/0.3/0.2 including heart_component; same inputs generally produce a different score"

  - name: prorated_warranty_credit
    trigger: "POST /sleep/warranty-claims/{id}/review with decision=APPROVE"
    algorithm: decay_function
    formula: |
      warranty_months by component_category:
        STRUCTURAL: 120, CHAMBER: 60, PUMP: 36, ELECTRONICS: 24
      base_price = replacement_part_price_cents of the ProductModel whose sku
        appears on the order's line_items and whose category maps to the claim's
        component_category (AIR_CHAMBER->CHAMBER, PUMP->PUMP, ELECTRONICS->ELECTRONICS,
        MATTRESS/ADJUSTABLE_BASE->STRUCTURAL); selector: among matching lines pick
        the one whose sku the claim's device was registered under is not tracked,
        so use: the matching line with the highest replacement_part_price_cents;
        tie-break: lowest price_cents, then created_at ASC of the ProductModel.
      TIME_BASED:  pct = max(0, 1 - months_in_service / warranty_months)
      NIGHTS_USED: expected_nights = warranty_months * 30
                   pct = max(0, 1 - final_nights_used / expected_nights)
      credit_cents = round_half_up(base_price * pct)
    input_set: "the WarrantyClaim, its Device (final_nights_count), the Order's line_items, referenced ProductModels"
    constants:
      WARRANTY_MONTHS_STRUCTURAL: 120
      WARRANTY_MONTHS_CHAMBER: 60
      WARRANTY_MONTHS_PUMP: 36
      WARRANTY_MONTHS_ELECTRONICS: 24
      NIGHTS_PER_MONTH: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: TIME_BASED
        when: "claim.proration_variant == TIME_BASED"
        difference: "prorates linearly over calendar months in service"
      - name: NIGHTS_USED
        when: "claim.proration_variant == NIGHTS_USED"
        difference: "prorates over FINAL sleep nights recorded on the device vs warranty_months * 30; ignores calendar time entirely"

  - name: restocking_refund
    trigger: "POST /sleep/trial-returns/{id}/inspect with outcome=APPROVED"
    algorithm: waterfall_allocation
    formula: |
      Rounding order is pinned — per line first, then sum, then fee, then subtract:
      1. per order line: rate = DEPRECIATION[ProductModel.category][condition]
         GOOD:    MATTRESS 0.15, ADJUSTABLE_BASE 0.10, other 0.05
         DAMAGED: MATTRESS 0.30, ADJUSTABLE_BASE 0.20, other 0.10
         line_dep_cents = round_half_up(line_total_cents * rate)
      2. depreciation_cents = sum(line_dep_cents)
      3. restocking_fee_cents = max(9900, round_half_up(0.10 * Order.total_paid_cents))
      4. refund_cents = max(0, Order.total_paid_cents - depreciation_cents - restocking_fee_cents)
    input_set: "the Order's line_items (with snapshotted prices), condition from inspect"
    constants:
      RESTOCKING_FEE_MIN_CENTS: 9900
      RESTOCKING_FEE_PCT: 0.10
      DEP_GOOD_MATTRESS: 0.15
      DEP_GOOD_BASE: 0.10
      DEP_GOOD_OTHER: 0.05
      DEP_DAMAGED_MATTRESS: 0.30
      DEP_DAMAGED_BASE: 0.20
      DEP_DAMAGED_OTHER: 0.10
    precision: "integer cents, round_half_up; per-line rounding before summing is load-bearing"

  - name: trial_night_index
    trigger: "POST /sleep/orders/{id}/trial-return"
    algorithm: threshold
    formula: |
      night_index = floor((clock - Order.trial_verified_at) / 86400 seconds)
      return allowed iff night_index <= 99  (i.e. clock < trial_verified_at + 100 days;
      at exactly trial_verified_at + 100 days, night_index == 100 -> ERR_TRIAL_WINDOW_EXPIRED)
    input_set: "Order.trial_verified_at, logical clock"
    constants:
      TRIAL_NIGHTS: 100
    precision: "integer nights; boundary is inclusive at 99, exclusive at 100"

  - name: window_slot_reservation
    trigger: "DeliveryVisit create / reschedule / cancel / promotion"
    algorithm: aggregation
    formula: |
      slot_need = 2 + (remove_old_mattress ? 1 : 0)
      A window accepts a visit iff reserved_slots + slot_need <= capacity_slots
      (equality allowed: reserved_slots == capacity_slots - slot_need succeeds).
      Waitlist promotion on a window that just freed slots:
        candidates = WAITLISTED visits with delivery_window_id == this window
        eligibility: slot_need <= (capacity_slots - reserved_slots)
        ranking: created_at ASC; tie-break: slot_need ASC (never id)
        promote greedily in ranking order while eligibility holds.
      Invariant: for every window, reserved_slots == sum(slot_need over its
      SCHEDULED visits); schedule and cancel/release must conserve
      capacity_slots - reserved_slots + (slots consumed) exactly.
    input_set: "DeliveryVisits with status SCHEDULED on the window; WAITLISTED for promotion"
    constants:
      VISIT_BASE_SLOTS: 2
      REMOVAL_EXTRA_SLOTS: 1
    precision: "integer slots"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a known role; X-User-ID present for all roles except Anonymous", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for the endpoint per §1.5 roles and §1.7; entity_backed ownership: Customer role may only act on resources whose customer_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids resolve, validated left-to-right; body-referenced ids (customer_id, store_id, order_id, device_id, fit_assessment_id, delivery_window_id, supersedes_assessment_id) exist", error_id: ERR_*_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource in a state from which the requested transition exists (per §1.2); terminal-state lockdown", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Order-specific terminal guard: cancel/confirm/patch/financing against CANCELLED | CLOSED | RETURNED orders", error_id: ERR_ORDER_ALREADY_TERMINAL, http_status: 409, applies_to: "POST /sleep/orders/{id}/confirm, POST /sleep/orders/{id}/cancel, PATCH /sleep/orders/{id}, POST /sleep/financing-plans" }
  - { priority: 6, category: state, check: "DeliveryVisit completion/reschedule guard: visit in VERIFIED or CANCELLED rejects complete and reschedule", error_id: ERR_VISIT_ALREADY_COMPLETED, http_status: 409, applies_to: "POST /sleep/delivery-visits/{id}/complete, POST /sleep/delivery-visits/{id}/reschedule" }
  - { priority: 7, category: state, check: "OCC: expected_order_version == Order.version / expected_visit_version == DeliveryVisit.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /sleep/orders/{id}, POST /sleep/delivery-visits/{id}/reschedule" }
  - { priority: 8, category: business_referential, check: "Order.fit_assessment_id belongs to the same customer as Order.customer_id and the assessment is COMPLETED (not DRAFT, not SUPERSEDED)", error_id: ERR_FIT_ASSESSMENT_MISMATCH, http_status: 422, applies_to: "POST /sleep/orders" }
  - { priority: 9, category: business_referential, check: "WarrantyClaim.device_id is registered under WarrantyClaim.order_id", error_id: ERR_DEVICE_NOT_ON_ORDER, http_status: 422, applies_to: "POST /sleep/warranty-claims" }
  - { priority: 10, category: business_referential, check: "Every Device of kind BASE on the order has pairing_status == PAIRED before a visit may verify", error_id: ERR_DEVICE_NOT_PAIRED, http_status: 422, applies_to: "POST /sleep/delivery-visits/{id}/complete (outcome=VERIFIED)" }
  - { priority: 11, category: business_constraint, check: "Window slot capacity: reserved_slots + slot_need <= capacity_slots unless allow_waitlist; equality allowed", error_id: ERR_WINDOW_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /sleep/delivery-visits, POST /sleep/delivery-visits/{id}/reschedule" }
  - { priority: 12, category: business_constraint, check: "Team timeline: new DeliveryWindow [window_start, window_end) must not overlap any existing window with the same (store_id, team_id); half-open semantics — adjacency (existing.window_end == new.window_start) is allowed", error_id: ERR_WINDOW_TEAM_OVERLAP, http_status: 422, applies_to: "POST /sleep/delivery-windows" }
  - { priority: 13, category: business_constraint, check: "Financing shape: term_months in {12,24,36}; ZERO_APR requires apr_bps == 0; DEFERRED_INTEREST requires apr_bps > 0", error_id: ERR_PROMO_TERM_INVALID, http_status: 422, applies_to: "POST /sleep/financing-plans" }
  - { priority: 14, category: business_constraint, check: "Setup checklist: outcome=VERIFIED requires all four checklist flags true", error_id: ERR_SETUP_CHECKLIST_INCOMPLETE, http_status: 422, applies_to: "POST /sleep/delivery-visits/{id}/complete" }
  - { priority: 15, category: business_constraint, check: "SleepNight uniqueness per (device_id, night_date)", error_id: ERR_DUPLICATE_NIGHT, http_status: 409, applies_to: "POST /sleep/devices/{id}/sleep-nights" }
  - { priority: 16, category: business_constraint, check: "Entitlement gate: GET /sleep/sleep-nights with detail=FULL requires the owning customer's subscription_tier in {PLUS, PREMIUM} and subscription_status == ACTIVE", error_id: ERR_ENTITLEMENT_REQUIRED, http_status: 403, applies_to: "GET /sleep/sleep-nights" }
  - { priority: 17, category: business_temporal, check: "Delivery window in the future: window_start > logical clock at schedule/reschedule time", error_id: ERR_WINDOW_IN_PAST, http_status: 422, applies_to: "POST /sleep/delivery-visits, POST /sleep/delivery-visits/{id}/reschedule" }
  - { priority: 18, category: business_temporal, check: "Trial window: trial_night_index <= 99 (clock < trial_verified_at + 100 days); also requires Order.order_status == DELIVERED (state check at priority 4 wins if both fail)", error_id: ERR_TRIAL_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /sleep/orders/{id}/trial-return" }
  - { priority: 19, category: business_temporal, check: "Warranty window: months_in_service < warranty_months for the component_category (months_in_service == warranty_months is expired)", error_id: ERR_WARRANTY_EXPIRED, http_status: 422, applies_to: "POST /sleep/warranty-claims" }
  - { priority: 20, category: business_fiscal, check: "Financing principal cap: principal_cents <= 500000", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /sleep/financing-plans" }
  - { priority: 21, category: business_fiscal, check: "DEFERRED_INTEREST down-payment floor: down_payment_cents >= round_half_up(0.10 * Order.total_due_cents)", error_id: ERR_DOWN_PAYMENT_INSUFFICIENT, http_status: 402, applies_to: "POST /sleep/financing-plans" }
  - { priority: 22, category: business_fiscal, check: "Payment amount must be >= 1 and <= balance_cents", error_id: ERR_PAYMENT_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /sleep/financing-plans/{id}/payments" }
  - { priority: 23, category: business_constraint, check: "Schema/type/required-field validation and enum membership (e.g. malformed line_items, unknown offer_type, window_end <= window_start)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/sleep/stores", description: "Create a store", roles: [PlatformAdmin], code: 201, input: [name, zone_codes, "default_window_capacity_slots?"], output: Store, side_effects: [] }
  - { method: GET, path: "/sleep/stores/{id}", description: "Read a store", roles: [PlatformAdmin, SalesAssociate, ServiceAgent], code: 200, input: [], output: Store, side_effects: [] }

  - { method: POST, path: "/sleep/product-models", description: "Create a catalog product model", roles: [PlatformAdmin], code: 201, input: [sku, name, category, price_cents, "replacement_part_price_cents?", warranty_months], output: ProductModel, side_effects: [] }

  - { method: POST, path: "/sleep/customers", description: "Register a customer account (self-service)", roles: [Anonymous], code: 201, input: [home_store_id, email, full_name], output: Customer, side_effects: ["subscription_tier defaults FREE, subscription_status ACTIVE, entitlements computed"] }
  - { method: GET, path: "/sleep/customers/{id}", description: "Read a customer incl. computed entitlements and store_credit_cents", roles: [PlatformAdmin, SalesAssociate, ServiceAgent, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/sleep/customers", description: "List customers; optional filter home_store_id; paginated", roles: [PlatformAdmin, SalesAssociate, ServiceAgent], code: 200, input: ["home_store_id?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: PATCH, path: "/sleep/customers/{id}/subscription", description: "Change subscription tier (admin adjustment); recomputes entitlements", roles: [PlatformAdmin], code: 200, input: [subscription_tier], output: Customer, side_effects: ["recompute entitlements", "increments Customer.version by 1"] }

  - { method: POST, path: "/sleep/fit-assessments", description: "Create an in-store fit assessment (DRAFT); optional supersedes_assessment_id for re-assessment", roles: [SalesAssociate], code: 201, input: [customer_id, store_id, sleep_position, weight_band, partner_sleeper, preferred_feel, "supersedes_assessment_id?"], output: FitAssessment, side_effects: [] }
  - { method: GET, path: "/sleep/fit-assessments/{id}", description: "Read a fit assessment", roles: [PlatformAdmin, SalesAssociate, Customer], code: 200, input: [], output: FitAssessment, side_effects: [] }
  - { method: GET, path: "/sleep/fit-assessments", description: "List fit assessments; filters customer_id?, store_id?, supersedes_assessment_id?", roles: [PlatformAdmin, SalesAssociate], code: 200, input: ["customer_id?", "store_id?", "supersedes_assessment_id?", "limit?", "offset?"], output: "FitAssessment[]", side_effects: [] }
  - { method: POST, path: "/sleep/fit-assessments/{id}/complete", description: "Complete an assessment: computes recommended_firmness and recommended_skus; supersedes referenced predecessor", roles: [SalesAssociate], code: 200, input: [], output: FitAssessment, side_effects: ["recommended_firmness calculation", "recommended_configuration calculation", "predecessor COMPLETED -> SUPERSEDED"] }

  - { method: POST, path: "/sleep/orders", description: "Create an order from a COMPLETED fit assessment; computes totals", roles: [Customer, SalesAssociate], code: 201, input: [customer_id, fit_assessment_id, line_items], output: Order, side_effects: ["order_totals calculation", "unit_price_cents snapshot from ProductModel.price_cents"] }
  - { method: GET, path: "/sleep/orders/{id}", description: "Read an order", roles: [PlatformAdmin, SalesAssociate, ServiceAgent, FinanceAgent, Customer], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/sleep/orders", description: "List orders; filters customer_id?, fit_assessment_id?", roles: [PlatformAdmin, SalesAssociate, ServiceAgent, FinanceAgent], code: 200, input: ["customer_id?", "fit_assessment_id?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: PATCH, path: "/sleep/orders/{id}", description: "Replace line_items on a PLACED order (OCC on expected_order_version); recomputes totals", roles: [Customer, SalesAssociate], code: 200, input: [expected_order_version, line_items], output: Order, side_effects: ["order_totals calculation", "increments Order.version by 1"] }
  - { method: POST, path: "/sleep/orders/{id}/confirm", description: "Confirm an order and capture payment (PAY_IN_FULL) or attach an ACCEPTED financing plan (FINANCING)", roles: [SalesAssociate], code: 200, input: [payment_method, "financing_plan_id?"], output: Order, side_effects: ["PLACED -> CONFIRMED", "total_paid_cents = total_due_cents", "payment_status -> PAID | FINANCED", "FinancingPlan ACCEPTED -> ACTIVE, sets activated_at"] }
  - { method: POST, path: "/sleep/orders/{id}/cancel", description: "Cancel an order; cascades to visits (release slots, waitlist promotion) and financing (VOIDED)", roles: [Customer, SalesAssociate], code: 200, input: [], output: Order, side_effects: ["order cancel cascade (3 links per §1.2)", "increments Order.version by 1"] }

  - { method: POST, path: "/sleep/delivery-windows", description: "Create a delivery window for a store team; half-open overlap rule per (store_id, team_id)", roles: [PlatformAdmin], code: 201, input: [store_id, team_id, window_start, window_end, capacity_slots], output: DeliveryWindow, side_effects: [] }
  - { method: GET, path: "/sleep/delivery-windows/{id}", description: "Read a delivery window incl. reserved_slots", roles: [PlatformAdmin, SalesAssociate, DeliveryTechnician], code: 200, input: [], output: DeliveryWindow, side_effects: [] }
  - { method: GET, path: "/sleep/delivery-windows", description: "List windows; filters store_id?, team_id?, window_date? (YYYY-MM-DD)", roles: [PlatformAdmin, SalesAssociate, DeliveryTechnician], code: 200, input: ["store_id?", "team_id?", "window_date?", "limit?", "offset?"], output: "DeliveryWindow[]", side_effects: [] }

  - { method: POST, path: "/sleep/delivery-visits", description: "Schedule a delivery/setup visit; capacity check; WAITLISTED when full and allow_waitlist", roles: [SalesAssociate], code: 201, input: [order_id, delivery_window_id, "remove_old_mattress?", "room_prep_notes?", "allow_waitlist?"], output: DeliveryVisit, side_effects: ["window_slot_reservation calculation", "window.reserved_slots += slot_need when SCHEDULED", "Order CONFIRMED -> FULFILLING on first SCHEDULED visit"] }
  - { method: GET, path: "/sleep/delivery-visits/{id}", description: "Read a delivery visit", roles: [PlatformAdmin, SalesAssociate, DeliveryTechnician, Customer], code: 200, input: [], output: DeliveryVisit, side_effects: [] }
  - { method: GET, path: "/sleep/delivery-visits", description: "List visits; filters order_id?, delivery_window_id?", roles: [PlatformAdmin, SalesAssociate, DeliveryTechnician, Customer], code: 200, input: ["order_id?", "delivery_window_id?", "limit?", "offset?"], output: "DeliveryVisit[]", side_effects: [] }
  - { method: POST, path: "/sleep/delivery-visits/{id}/reschedule", description: "Move a SCHEDULED or FAILED_SETUP visit to a new window (OCC on expected_visit_version)", roles: [SalesAssociate, Customer], code: 200, input: [expected_visit_version, new_delivery_window_id, "allow_waitlist?"], output: DeliveryVisit, side_effects: ["release slots on old window + waitlist promotion there", "consume slots on new window or WAITLISTED", "increments DeliveryVisit.version by 1"] }
  - { method: POST, path: "/sleep/delivery-visits/{id}/complete", description: "Complete a visit: outcome VERIFIED (requires full checklist + all BASE devices PAIRED) or FAILED_SETUP", roles: [DeliveryTechnician], code: 200, input: [outcome, setup_checklist], output: DeliveryVisit, side_effects: ["VERIFIED: Order FULFILLING -> DELIVERED, sets trial_verified_at"] }

  - { method: POST, path: "/sleep/devices", description: "Register installed hardware under an order (order must not be terminal)", roles: [DeliveryTechnician], code: 201, input: [order_id, kind, serial_number, firmware_version], output: Device, side_effects: ["customer_id denormalized from order"] }
  - { method: GET, path: "/sleep/devices/{id}", description: "Read a device", roles: [PlatformAdmin, DeliveryTechnician, ServiceAgent, Customer], code: 200, input: [], output: Device, side_effects: [] }
  - { method: GET, path: "/sleep/devices", description: "List devices; filters order_id?, customer_id?", roles: [PlatformAdmin, DeliveryTechnician, ServiceAgent, Customer], code: 200, input: ["order_id?", "customer_id?", "limit?", "offset?"], output: "Device[]", side_effects: [] }
  - { method: POST, path: "/sleep/devices/{id}/pair", description: "Pair or unpair an adjustable base; records connectivity at pair time", roles: [DeliveryTechnician], code: 200, input: [target_status, "connectivity_verified?"], output: Device, side_effects: ["pairing_status transition", "connectivity recomputed"] }

  - { method: POST, path: "/sleep/devices/{id}/sleep-nights", description: "Ingest one night of sleep data (PROVISIONAL, provisional_score computed)", roles: [DeviceGateway], code: 201, input: [night_date, minutes_asleep, restlessness_events, avg_heart_rate], output: SleepNight, side_effects: ["sleep_score provisional variant"] }
  - { method: GET, path: "/sleep/sleep-nights/{id}", description: "Read a sleep night", roles: [PlatformAdmin, ServiceAgent, Customer], code: 200, input: [], output: SleepNight, side_effects: [] }
  - { method: GET, path: "/sleep/sleep-nights", description: "List sleep nights; filters device_id?, customer_id?; detail=FULL gated by subscription tier", roles: [PlatformAdmin, ServiceAgent, Customer], code: 200, input: ["device_id?", "customer_id?", "detail?", "limit?", "offset?"], output: "SleepNight[]", side_effects: [] }

  - { method: POST, path: "/sleep/orders/{id}/trial-return", description: "Initiate an in-home trial return (night_index <= 99, order DELIVERED)", roles: [Customer], code: 201, input: [reason, refund_destination], output: TrialReturn, side_effects: ["trial_night_index calculation"] }
  - { method: GET, path: "/sleep/trial-returns/{id}", description: "Read a trial return", roles: [PlatformAdmin, ServiceAgent, Customer], code: 200, input: [], output: TrialReturn, side_effects: [] }
  - { method: GET, path: "/sleep/trial-returns", description: "List trial returns; filter order_id?", roles: [PlatformAdmin, ServiceAgent, Customer], code: 200, input: ["order_id?", "limit?", "offset?"], output: "TrialReturn[]", side_effects: [] }
  - { method: POST, path: "/sleep/trial-returns/{id}/inspect", description: "Inspect a returned bed: outcome APPROVED computes refund and cascades to order/financing; REJECTED terminates", roles: [ServiceAgent], code: 200, input: [outcome, condition], output: TrialReturn, side_effects: ["restocking_refund calculation", "cascade: Order -> RETURNED, payment_status -> REFUNDED", "cascade: FinancingPlan ACTIVE -> SETTLED_EARLY with credit memo", "STORE_CREDIT destination credits Customer.store_credit_cents"] }

  - { method: POST, path: "/sleep/warranty-claims", description: "File a prorated limited-warranty claim on a chamber/pump/electronics device", roles: [Customer], code: 201, input: [order_id, device_id, component_category, proration_variant, description], output: WarrantyClaim, side_effects: ["months_in_service and final_nights_used snapshotted at filing"] }
  - { method: GET, path: "/sleep/warranty-claims/{id}", description: "Read a warranty claim", roles: [PlatformAdmin, ServiceAgent, Customer], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/sleep/warranty-claims", description: "List warranty claims; filters order_id?, device_id?", roles: [PlatformAdmin, ServiceAgent, Customer], code: 200, input: ["order_id?", "device_id?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/sleep/warranty-claims/{id}/review", description: "Review a FILED or APPEALED claim: APPROVE computes and applies prorated credit; DENY allows appeal", roles: [ServiceAgent], code: 200, input: [decision, "denial_reason?"], output: WarrantyClaim, side_effects: ["prorated_warranty_credit on APPROVE", "credit applied to ACTIVE FinancingPlan balance or Customer.store_credit_cents"] }
  - { method: POST, path: "/sleep/warranty-claims/{id}/appeal", description: "Appeal a DENIED claim (cycle DENIED -> APPEALED)", roles: [Customer], code: 200, input: [], output: WarrantyClaim, side_effects: [] }

  - { method: POST, path: "/sleep/financing-plans", description: "Create a financing offer for a PLACED order (OFFERED); validates term/principal/down-payment", roles: [FinanceAgent], code: 201, input: [order_id, offer_type, term_months, apr_bps, "down_payment_cents?"], output: FinancingPlan, side_effects: ["financing_schedule calculation"] }
  - { method: GET, path: "/sleep/financing-plans/{id}", description: "Read a financing plan", roles: [PlatformAdmin, FinanceAgent, ServiceAgent, Customer], code: 200, input: [], output: FinancingPlan, side_effects: [] }
  - { method: GET, path: "/sleep/financing-plans", description: "List financing plans; filter order_id?", roles: [PlatformAdmin, FinanceAgent, ServiceAgent, Customer], code: 200, input: ["order_id?", "limit?", "offset?"], output: "FinancingPlan[]", side_effects: [] }
  - { method: POST, path: "/sleep/financing-plans/{id}/accept", description: "Customer accepts an OFFERED plan", roles: [Customer], code: 200, input: [], output: FinancingPlan, side_effects: ["OFFERED -> ACCEPTED"] }
  - { method: POST, path: "/sleep/financing-plans/{id}/payments", description: "Record a payment against an ACTIVE or DELINQUENT plan; cures delinquency when caught up; PAID_OFF at zero balance", roles: [FinanceAgent], code: 201, input: [amount_cents], output: FinancingPlan, side_effects: ["paid_cents += amount", "balance_cents -= amount", "status recompute (PAID_OFF / cure DELINQUENT -> ACTIVE)"] }

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Server startup default is exactly 2026-09-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Setting the clock triggers: SleepNight finalization (PROVISIONAL nights whose night_date + 1 day 12:00Z <= new clock), deferred-interest retro accrual, FinancingPlan delinquency/default recompute, and Order DELIVERED -> CLOSED when the clock reaches trial_verified_at + 101 days with no open return."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["SleepNight PROVISIONAL -> FINAL sweep", "deferred_interest_accrual", "financing delinquency/default sweep", "order trial-expiry CLOSED sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role, or missing X-User-ID for a non-Anonymous role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or Customer ownership mismatch (X-User-ID != resource customer_id)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, unknown enum value, window_end <= window_start, malformed line_items" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store id does not resolve" }
  - { id: ERR_PRODUCT_MODEL_NOT_FOUND, http: 404, condition: "product model id does not resolve, or a line_items sku matches no ProductModel" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not resolve" }
  - { id: ERR_FIT_ASSESSMENT_NOT_FOUND, http: 404, condition: "fit assessment id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not resolve" }
  - { id: ERR_DELIVERY_WINDOW_NOT_FOUND, http: 404, condition: "delivery window id does not resolve" }
  - { id: ERR_DELIVERY_VISIT_NOT_FOUND, http: 404, condition: "delivery visit id does not resolve" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "device id does not resolve" }
  - { id: ERR_SLEEP_NIGHT_NOT_FOUND, http: 404, condition: "sleep night id does not resolve" }
  - { id: ERR_TRIAL_RETURN_NOT_FOUND, http: 404, condition: "trial return id does not resolve" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id does not resolve" }
  - { id: ERR_FINANCING_PLAN_NOT_FOUND, http: 404, condition: "financing plan id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_ORDER_ALREADY_TERMINAL, http: 409, condition: "Confirm/cancel/patch/financing against a CANCELLED, CLOSED or RETURNED order" }
  - { id: ERR_VISIT_ALREADY_COMPLETED, http: 409, condition: "Complete or reschedule against a VERIFIED or CANCELLED visit" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_order_version != Order.version or expected_visit_version != DeliveryVisit.version" }
  - { id: ERR_FIT_ASSESSMENT_MISMATCH, http: 422, condition: "Order's fit assessment belongs to a different customer, or is DRAFT or SUPERSEDED" }
  - { id: ERR_DEVICE_NOT_ON_ORDER, http: 422, condition: "Warranty claim device_id not registered under claim order_id" }
  - { id: ERR_DEVICE_NOT_PAIRED, http: 422, condition: "Visit verification attempted while a BASE device on the order is not PAIRED" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 422, condition: "reserved_slots + slot_need > capacity_slots and allow_waitlist not set" }
  - { id: ERR_WINDOW_TEAM_OVERLAP, http: 422, condition: "New window overlaps an existing window for the same (store_id, team_id) under half-open semantics; adjacency allowed" }
  - { id: ERR_PROMO_TERM_INVALID, http: 422, condition: "term_months not in {12,24,36}, or ZERO_APR with apr_bps != 0, or DEFERRED_INTEREST with apr_bps == 0" }
  - { id: ERR_SETUP_CHECKLIST_INCOMPLETE, http: 422, condition: "outcome=VERIFIED with any of base_assembled/chambers_connected/remote_configured/connectivity_verified false" }
  - { id: ERR_DUPLICATE_NIGHT, http: 409, condition: "A SleepNight already exists for (device_id, night_date)" }
  - { id: ERR_ENTITLEMENT_REQUIRED, http: 403, condition: "detail=FULL sleep-night read by a customer whose tier is FREE or whose subscription is CANCELLED" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "Target window_start is not after the logical clock" }
  - { id: ERR_TRIAL_WINDOW_EXPIRED, http: 422, condition: "Trial return initiated at night_index >= 100 (clock >= trial_verified_at + 100 days)" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "months_in_service >= warranty_months for the claimed component_category" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Financing principal_cents > 500000" }
  - { id: ERR_DOWN_PAYMENT_INSUFFICIENT, http: 402, condition: "DEFERRED_INTEREST down_payment_cents < round_half_up(0.10 * total_due_cents)" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount_cents > balance_cents or < 1" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a customer account"
    identity: opaque
    exclusive_operations: ["POST /sleep/customers"]
    shared_operations: []
  - name: PlatformAdmin
    description: "Platform operator; owns catalog, stores, windows, clock, subscription tier adjustments"
    identity: opaque
    exclusive_operations: ["POST /sleep/stores", "POST /sleep/product-models", "POST /sleep/delivery-windows", "PATCH /sleep/customers/{id}/subscription", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: SalesAssociate
    description: "In-store associate; runs fit assessments, creates/confirms orders, schedules delivery"
    identity: opaque
    exclusive_operations: ["POST /sleep/fit-assessments", "POST /sleep/fit-assessments/{id}/complete", "POST /sleep/orders/{id}/confirm", "POST /sleep/delivery-visits"]
    shared_operations: ["POST /sleep/orders", "PATCH /sleep/orders/{id}", "POST /sleep/orders/{id}/cancel", "POST /sleep/delivery-visits/{id}/reschedule", "GET endpoints per §1.5"]
  - name: Customer
    description: "Registered account holder; owns their orders, returns, claims, financing acceptance"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /sleep/orders/{id}/trial-return", "POST /sleep/warranty-claims", "POST /sleep/warranty-claims/{id}/appeal", "POST /sleep/financing-plans/{id}/accept"]
    shared_operations: ["POST /sleep/orders", "PATCH /sleep/orders/{id}", "POST /sleep/orders/{id}/cancel", "POST /sleep/delivery-visits/{id}/reschedule", "GET endpoints per §1.5 (own resources only)"]
  - name: DeliveryTechnician
    description: "Delivery and in-home setup crew; completes visits, registers and pairs devices"
    identity: opaque
    exclusive_operations: ["POST /sleep/delivery-visits/{id}/complete", "POST /sleep/devices", "POST /sleep/devices/{id}/pair"]
    shared_operations: ["GET /sleep/delivery-windows*", "GET /sleep/delivery-visits*", "GET /sleep/devices*"]
  - name: ServiceAgent
    description: "Post-sale service; inspects trial returns, reviews warranty claims"
    identity: opaque
    exclusive_operations: ["POST /sleep/trial-returns/{id}/inspect", "POST /sleep/warranty-claims/{id}/review"]
    shared_operations: ["GET endpoints per §1.5"]
  - name: FinanceAgent
    description: "Financing administration; creates offers and records payments"
    identity: opaque
    exclusive_operations: ["POST /sleep/financing-plans", "POST /sleep/financing-plans/{id}/payments"]
    shared_operations: ["GET /sleep/orders*", "GET /sleep/financing-plans*"]
  - name: DeviceGateway
    description: "Device telemetry ingestion channel"
    identity: opaque
    exclusive_operations: ["POST /sleep/devices/{id}/sleep-nights"]
    shared_operations: []
