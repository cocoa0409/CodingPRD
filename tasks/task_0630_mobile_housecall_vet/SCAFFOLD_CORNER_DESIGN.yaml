# =============================================================================
# Mobile & House-Call Veterinary Service — §1.9 Scaffold Corner Design
# Breadth probe: enumerate testable claims not covered by §1.8 (difficulty).
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_all_fields
        claim_type: Creation
        grounds: [entities.Patient]
        distinguishing_aspect: "POST /patients with all required fields -> 201, response carries id, owner_name, species, weight_kg, home_zip, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { owner_name: "Owner P", species: "DOG", weight_kg: 14.5, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id, v: $.data.version }
          assert:
            - "response_type == object"
            - "Patient.${pat_id}.species == DOG"
            - "Patient.${pat_id}.weight_kg == 14.5"
            - "Patient.${pat_id}.version == 1"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds:
          - entities.Patient
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{nonexistent-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Patient
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients omitting weight_kg -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { owner_name: "Owner Q", species: "CAT", home_zip: "11201" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_patient_invalid_enum_species
        claim_type: Type Constraints
        grounds:
          - entities.Patient
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients with species=='HORSE' (not in DOG/CAT/OTHER) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { owner_name: "Owner R", species: "HORSE", weight_kg: 400, home_zip: "11201" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_patient_nonpositive_weight
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.weight_kg
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients with weight_kg==0 violates the >0 constraint -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { owner_name: "Owner S", species: "DOG", weight_kg: 0, home_zip: "11201" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: vet_requires_dea_number
        claim_type: Required Fields
        grounds:
          - entities.Clinician.fields.dea_number
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /clinicians clinician_role==VET without dea_number -> 400 ERR_INVALID_REQUEST (conditional required field)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "Dr NoDEA", clinician_role: "VET" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: service_area_defaults_active_and_euthanasia_allowed
        claim_type: Defaults
        grounds: [entities.ServiceArea.fields.status, entities.ServiceArea.fields.euthanasia_allowed]
        distinguishing_aspect: "POST /service-areas omitting euthanasia_allowed -> default true; status defaults ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 500 }
              as: Dispatcher
              captures: { area_id: $.data.id }
          assert:
            - "ServiceArea.${area_id}.status == ACTIVE"
            - "ServiceArea.${area_id}.euthanasia_allowed == true"

      - name: appointment_resolves_service_area_id_computed
        claim_type: Computed Fields
        grounds: [entities.Appointment.fields.service_area_id]
        distinguishing_aspect: "POST /appointments resolves service_area_id from patient.home_zip to the matching ACTIVE ServiceArea; client cannot set it."
        test_recipe:
          setup: ["ServiceArea ZIP 11201 ACTIVE; patient in 11201"]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner T", species: "DOG", weight_kg: 12, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-03-01T09:00:00Z", requested_end: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id, sa: $.data.service_area_id }
          assert:
            - "Appointment.${appt_id}.service_area_id == ${area_id}"
            - "Appointment.${appt_id}.status == REQUESTED"

      - name: controlled_med_log_is_append_only_no_version
        claim_type: Immutability
        grounds: [entities.ControlledMedLog]
        distinguishing_aspect: "ControlledMedLog has common_fields:false; entries expose id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["A DISPENSE entry created on a euthanasia visit"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: Dispatcher
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet G", clinician_role: "VET", dea_number: "GV5556667", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vet_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-18", controlled_stock_ml: 50, vaccine_stock_count: 0 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner U", species: "DOG", weight_kg: 30, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EUTHANASIA", requested_start: "2026-03-02T09:00:00Z", requested_end: "2026-03-02T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${vet_id}", rolling_clinic_id: "${van_id}", service_date: "2026-03-02T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/euthanasia-log"
              payload: { rolling_clinic_id: "${van_id}", administering_vet_id: "${vet_id}", entry_type: "DISPENSE", amount_ml: 6.0 }
              as: Clinician
              as_user_id: "${vet_id}"
              captures: { log_id: $.data.id, log_amt: $.data.amount_ml }
          assert:
            - "ControlledMedLog.${log_id}.amount_ml == 6.0"
            - "ControlledMedLog.${log_id}.entry_type == DISPENSE"

      - name: list_appointments_pagination_envelope
        claim_type: Listing
        grounds: [entities.Appointment]
        distinguishing_aspect: "GET /appointments returns array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One appointment exists in a covered area"]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner W", species: "CAT", weight_kg: 4, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-03-03T09:00:00Z", requested_end: "2026-03-03T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
          trigger:
            - call: "GET /appointments?patient_id=${pat_id}&limit=10&offset=0"
              payload: {}
              as: Dispatcher
          assert:
            - "response_type == array"
            - "meta has total_count == 1"
            - "meta has_more == false"

  # =========================================================================
  - section: state_machines
    instances:
      - name: arrive_from_requested_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Appointment.SCHEDULED_to_IN_VISIT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /appointments/{id}/arrive on a REQUESTED (never booked) appointment -> 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["A REQUESTED appointment in a covered area (no stop)"]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner X", species: "DOG", weight_kg: 10, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Tx", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-03-04T09:00:00Z", requested_end: "2026-03-04T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_terminal_completed_appointment_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /appointments/{id}/cancel on a COMPLETED appointment -> 409 ERR_INVALID_STATE (terminal state lockdown)."
        test_recipe:
          setup: ["A fully completed EXAM appointment (paid)"]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Ty2", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-19", controlled_stock_ml: 0, vaccine_stock_count: 5 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner Y", species: "DOG", weight_kg: 16, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-03-05T09:00:00Z", requested_end: "2026-03-05T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-03-05T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-03-05T09:00:00Z", window_end: "2026-03-05T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /appointments/${appt_id}/complete-visit"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /payments"
              payload: { estimate_id: "${est_id}", amount_cents: 9000, method: "CASH" }
              as: Clinician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: refer_euthanasia_blocked
        claim_type: guarded_transition
        grounds:
          - state_machines.Appointment.IN_VISIT_to_REFERRED
          - errors[ERR_EUTHANASIA_NOT_REFERABLE]
        distinguishing_aspect: "POST /appointments/{id}/refer on an EUTHANASIA visit -> 409 ERR_EUTHANASIA_NOT_REFERABLE (visit_type guard)."
        test_recipe:
          setup: ["A EUTHANASIA appointment booked, route LOCKED, IN_VISIT"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T08:00:00Z" }
              as: Dispatcher
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet H", clinician_role: "VET", dea_number: "HV6667778", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vet_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-20", controlled_stock_ml: 50, vaccine_stock_count: 0 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner Z", species: "DOG", weight_kg: 28, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EUTHANASIA", requested_start: "2026-03-06T09:00:00Z", requested_end: "2026-03-06T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${vet_id}", rolling_clinic_id: "${van_id}", service_date: "2026-03-06T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-03-06T09:00:00Z", window_end: "2026-03-06T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/refer"
              payload: { hospital_name: "ER", reason: "n/a" }
              as: Clinician
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_EUTHANASIA_NOT_REFERABLE"

      - name: complete_visit_no_approved_estimate
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Appointment.IN_VISIT_to_AWAITING_PAYMENT
          - errors[ERR_NO_APPROVED_ESTIMATE]
        distinguishing_aspect: "complete-visit on an IN_VISIT appointment with only a DRAFT (unapproved) estimate -> 409 ERR_NO_APPROVED_ESTIMATE."
        test_recipe:
          setup: ["EXAM appointment IN_VISIT with a DRAFT estimate (not approved)"]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Tz", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-21", controlled_stock_ml: 0, vaccine_stock_count: 5 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner A1", species: "CAT", weight_kg: 5, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-03-07T09:00:00Z", requested_end: "2026-03-07T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-03-07T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-03-07T09:00:00Z", window_end: "2026-03-07T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/complete-visit"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NO_APPROVED_ESTIMATE"

      - name: complete_euthanasia_visit_log_incomplete
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Appointment.IN_VISIT_to_AWAITING_PAYMENT
          - errors[ERR_EUTHANASIA_LOG_INCOMPLETE]
        distinguishing_aspect: "complete-visit on a EUTHANASIA appointment with a DISPENSE but no WASTE log entry -> 409 ERR_EUTHANASIA_LOG_INCOMPLETE."
        test_recipe:
          setup: ["EUTHANASIA appointment IN_VISIT, APPROVED estimate, DISPENSE logged but WASTE missing"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T08:00:00Z" }
              as: Dispatcher
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet I", clinician_role: "VET", dea_number: "IV7778889", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vet_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-22", controlled_stock_ml: 50, vaccine_stock_count: 0 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner B1", species: "DOG", weight_kg: 30, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EUTHANASIA", requested_start: "2026-03-08T09:00:00Z", requested_end: "2026-03-08T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${vet_id}", rolling_clinic_id: "${van_id}", service_date: "2026-03-08T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-03-08T09:00:00Z", window_end: "2026-03-08T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
