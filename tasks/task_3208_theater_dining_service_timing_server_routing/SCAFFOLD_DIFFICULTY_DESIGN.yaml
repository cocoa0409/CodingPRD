          assert:
            - "hop 1: the slip's check reads data.status == \"REFUNDED\" with data.refunded_cents == 1200 and data.original_cents == 1200, so orig.cents - refunded_cents == 0"
            - "the disturbance event reads data.stage == \"EJECTION\""
            - "hop 2: closing the assignment scores data.assignment_points == 9, being round_half_up(base 3 for a B grade times ejection 2.0 times refund 1.5)"
            - "hop 3: the server reads data.lifetime_points == 9, data.in_rotation == false and data.status == \"PENALIZED\""
