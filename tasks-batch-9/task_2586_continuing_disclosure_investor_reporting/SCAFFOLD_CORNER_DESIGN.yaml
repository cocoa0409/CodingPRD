      - name: materiality_ratio_rounds_half_up_at_the_five_hundred_bp_threshold
        claim_type: threshold
        grounds:
          - calculations.direct_placement_materiality_ratio
          - calculations.direct_placement_materiality_ratio.constants.MATERIAL_OBLIGATION_THRESHOLD_BP
          - validations.priority_22
        distinguishing_aspect: >-
          The threshold is inclusive AND the ratio is rounded half-up before it is compared, so a
          principal that computes to 499.5 bp must be treated as 500 and become
          DISCLOSURE_REQUIRED. Truncation, banker's rounding, or an exclusive comparison each
          misclassify exactly one of the four probes. A fifth placement below the threshold but
          carrying MANDATORY_MATERIAL_EVENT practice proves the rule is a disjunction, not a pure
          threshold test. Review windows are kept pairwise disjoint so the aggregate capacity of
          two is never engaged and cannot mask a classification error.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with outstanding_par_amount_cents = 100000000, so one basis point of par is 10000 cents."
            - "Five DirectPlacements, all executed 2026-07-28, with pairwise disjoint three-day closed review windows."
