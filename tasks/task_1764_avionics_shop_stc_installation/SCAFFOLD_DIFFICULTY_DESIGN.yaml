            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "t", estimated_hours: 2.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 2.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-testing", payload: {}, as: ShopManager }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "GROUND", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: ShopManager, captures: { g_id: "$.data.id" } }
            - { call: "POST /avionics/test-events/${g_id}/record-result", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "FLIGHT", scheduled_start: "2026-08-18T14:00:00Z", scheduled_end: "2026-08-18T15:30:00Z" }, as: ShopManager, captures: { f1_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "FLIGHT", scheduled_start: "2026-08-18T16:30:00Z", scheduled_end: "2026-08-18T17:30:00Z" }, as: ShopManager, captures: { f2_id: "$.data.id" } }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "FLIGHT", scheduled_start: "2026-08-18T16:29:00Z", scheduled_end: "2026-08-18T17:29:00Z" }, as: ShopManager, captures: { err3: "$.data.error_id" } }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "FLIGHT", scheduled_start: "2026-08-18T15:30:00Z", scheduled_end: "2026-08-18T16:00:00Z" }, as: ShopManager, captures: { err4: "$.data.error_id" } }
          assert:
            - "flight-2 at exactly end+60min (16:30) is created: TestEvent.${f2_id}.status == SCHEDULED — >= buffer boundary satisfied exactly"
            - "flight-3 at 16:29 rejected: ERR_FLIGHT_WINDOW_CONFLICT (inside the 60-minute buffer)"
            - "flight-4 adjacent at 15:30 (prior end) rejected: ERR_FLIGHT_WINDOW_CONFLICT — buffer semantics forbid adjacency, unlike the bay rule"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: labor_hours_restored_by_void
        grounds:
          - calculations.derived_counts_and_totals
          - state_machines.InstallTask.COMPLETED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = WorkOrder.total_actual_labor_hours (labor hours): completing
          task-2 adds 4.0 h (total 10.0); the compensating void removes exactly those hours,
          restoring the pre-completion value 6.0 — no drift from the forward+compensating pair.
        test_recipe:
          setup:
            - "Work order in INSTALLATION; task-1 COMPLETED with 6.0 h; task-2 COMPLETED with 4.0 h"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Inv Owner", contact_email: "inv@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N520IV", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "invariant probe", estimated_downtime_days: 10, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "HARNESS_FABRICATION", description: "t1", estimated_hours: 6.0 }, as: ShopManager, captures: { t1: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${t1}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${t1}/complete", payload: { actual_hours: 6.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "t2", estimated_hours: 4.0 }, as: ShopManager, captures: { t2: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${t2}/start", payload: {}, as: Technician, as_user_id: "tech-2" }
            - { call: "POST /avionics/install-tasks/${t2}/complete", payload: { actual_hours: 4.0 }, as: Technician, as_user_id: "tech-2" }
            - { call: "GET /avionics/work-orders/${wo_id}", payload: {}, as: ShopManager, captures: { hours_pre: "$.data.total_actual_labor_hours" } }
          trigger:
            - { call: "POST /avionics/install-tasks/${t2}/void", payload: {}, as: ShopManager }
          assert:
            - "before void: WorkOrder.${wo_id}.total_actual_labor_hours == 10.0 (6.0 + 4.0)"
            - "after void: InstallTask.${t2}.status == VOIDED"
            - "after void: WorkOrder.${wo_id}.total_actual_labor_hours == 6.0 — complete+void pair leaves the labor-hour total unchanged"
            - "WorkOrder.${wo_id}.tasks_unverified_count == 1 (only task-1 COMPLETED remains)"

      - name: empty_weight_restored_by_removal_revision
        grounds:
          - calculations.weight_balance_recompute
          - state_machines.WeightBalanceRevision.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity = aircraft empty weight as reported by the latest ACCEPTED
          W&B revision (weight, a different quantity than labor hours above): accepting an
          installation revision (+10.0 lb @ 40.0) then a compensating removal revision
          (-10.0 lb @ 40.0) restores new_empty_weight_lb to the 1800.0 baseline exactly.
        test_recipe:
          setup:
            - "Work order in TESTING (zero-line design, verified task); aircraft baseline 1800.0 lb @ 40.0 (moment 72000.0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "WB2 Owner", contact_email: "wb2@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N530WB", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "wb invariant", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "HARNESS_FABRICATION", description: "h", estimated_hours: 1.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 1.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-testing", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /avionics/weight-balance-revisions", payload: { work_order_id: "${wo_id}", method: "INCREMENTAL", added_items: [ { description: "GPS", weight_lb: 10.0, arm_in: 40.0 } ] }, as: ShopManager, captures: { rev1: "$.data.id" } }
            - { call: "POST /avionics/weight-balance-revisions/${rev1}/accept", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/weight-balance-revisions", payload: { work_order_id: "${wo_id}", method: "INCREMENTAL", added_items: [], removed_weight_lb: 10.0, removed_arm_in: 40.0 }, as: ShopManager, captures: { rev2: "$.data.id" } }
            - { call: "POST /avionics/weight-balance-revisions/${rev2}/accept", payload: {}, as: Inspector, as_user_id: "insp-1" }
          assert:
            - "WeightBalanceRevision.${rev1}.new_empty_weight_lb == 1810.0 and .new_moment_lb_in == 72400.0 and .new_arm_in == 40.0"
            - "WeightBalanceRevision.${rev2}.new_empty_weight_lb == 1800.0 — install+removal pair restores the baseline empty weight exactly"
            - "WeightBalanceRevision.${rev2}.new_moment_lb_in == 72000.0 and .new_arm_in == 40.0"
            - "after rev2 accept: rev1.status == SUPERSEDED and rev2.status == ACCEPTED"
