            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T00:00:00Z" }
              as: CredentialingOfficer
            - call: "POST /programs/${prog}/compliance-sweep"
              payload: {}
              as: ProgramManager
            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2027-07-06", result: "CLEAR", vendor_reference: "BGS-2001" }
              as: CredentialingOfficer
