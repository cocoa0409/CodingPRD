  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: index_segment_term_overlap_half_open_adjacency_ok
        grounds:
          - validations[priority=18]
          - entities.IndexSegment.fields.term_start_date
          - entities.IndexSegment.fields.term_end_date
          - errors[ERR_SEGMENT_TERM_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on IndexSegment: a second SP500 segment whose window
          [2026-06-01, 2027-01-01) overlaps an existing OPEN [2026-01-01, 2026-12-01) is rejected.
          Adjacency-ALLOWED treatment (a start exactly at an existing end would pass) distinguishes
          it from the crediting-period rule.
        test_recipe:
          setup:
            - "INDEXED contract ACTIVE; one OPEN SP500 IndexSegment term [2026-01-01, 2026-12-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Indexed", contract_type: "INDEXED", death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /index-segments"
              payload: { contract_id: "${cid}", index_name: "SP500", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", segment_premium_cents: 1000000, cap_bps: 800 }
              as: ContractAdmin
              captures: { seg1: $.data.id }
          trigger:
            - call: "POST /index-segments"
              payload: { contract_id: "${cid}", index_name: "SP500", term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", segment_premium_cents: 500000, cap_bps: 800 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_SEGMENT_TERM_OVERLAP"

      - name: crediting_period_touch_rejected_closed_buffer
        grounds:
          - validations[priority=19]
          - entities.CreditingEvent.fields.credit_period_start
          - entities.CreditingEvent.fields.credit_period_end
          - errors[ERR_CREDIT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          CLOSED/buffer interval semantics on a different resource (CreditingEvent, not IndexSegment):
          a second INDEX_SEGMENT crediting period whose start exactly equals the prior period's end
          (gap=0, merely touching) is REJECTED — the opposite adjacency treatment from the half-open
          IndexSegment rule. First period [2026-01-01, 2026-06-01) posts; touching
          [2026-06-01, 2026-09-01) is rejected.
        test_recipe:
          setup:
            - "INDEXED contract ACTIVE with an OPEN SP500 segment term [2026-01-01, 2027-01-01); one INDEX_SEGMENT crediting event already posted for period [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Indexed", contract_type: "INDEXED", death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /index-segments"
              payload: { contract_id: "${cid}", index_name: "SP500", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", segment_premium_cents: 1000000, cap_bps: 800 }
              as: ContractAdmin
              captures: { seg: $.data.id }
            - call: "POST /crediting-events"
              payload: { contract_id: "${cid}", crediting_kind: "INDEX_SEGMENT", source_segment_id: "${seg}", raw_index_return_bps: 300, credit_period_start: "2026-01-01T00:00:00Z", credit_period_end: "2026-06-01T00:00:00Z" }
              as: CreditingOfficer
          trigger:
            - call: "POST /crediting-events"
