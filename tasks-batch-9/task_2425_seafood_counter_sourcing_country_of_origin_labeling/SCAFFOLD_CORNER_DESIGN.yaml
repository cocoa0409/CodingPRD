          rationale: "The named §1.8 instance already asserts that publication is refused with ERR_COUNTER_RESTRICTED while the counter is RESTRICTED and succeeds once the posture returns to OPEN."

  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_is_identical_on_every_failure
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_LOT_NOT_FOUND
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Failures at three different layers -- referential 404, authorization 403 and shape
          400 -- must all come back in the SAME envelope: meta.api_request_id and
          meta.api_request_timestamp present, response_type == "error", and data carrying
          exactly error_id plus a non-empty human message, with no partial entity payload
          leaking into data.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter and Supplier registered so that a legitimate 403 target exists"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
          trigger:
            - call: "GET /seafood-ops/lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_404: $.data.error_id, m_404: $.data.message }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
              captures: { e_403: $.data.error_id, m_403: $.data.message }
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: "six" }
              as: ChainAdmin
              captures: { e_400: $.data.error_id, m_400: $.data.message }
          assert:
            - "${e_404} == ERR_LOT_NOT_FOUND on HTTP 404"
            - "${e_403} == ERR_UNAUTHORIZED on HTTP 403"
            - "${e_400} == ERR_INVALID_REQUEST on HTTP 400"
            - "each of the three responses has response_type == \"error\""
            - "each of the three responses has a non-null meta.api_request_id and meta.api_request_timestamp"
            - "${m_404}, ${m_403} and ${m_400} are all non-empty strings"
            - "data on each error response contains only error_id and message"

