      - name: error_open_session_blocks_submit_qa
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_SCAN_SESSION_EXISTS]"]
        distinguishing_aspect: "submit-qa is rejected while any session of the batch is OPEN; after voiding it, the same call proceeds."
        test_recipe:
          setup: ["client + agreement; SCANNING batch with one 50-page document scanned via a committed session; a second session still OPEN"]
          setup_api_calls:
