# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1922_debate_speech_tournament_management
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: speaker_points_high_low_adjusted_divergence
        grounds:
          - calculations.speaker_point_tabulation
          - entities.Entry.fields.speaker_points_raw
          - entities.Entry.fields.speaker_points_adjusted
          - state_machines.Round.BALLOTS_OPEN_to_TABULATED
        distinguishing_aspect: |
          Entity domain Entry (debate tabulation): on identical ballot data the RAW_TOTAL
          variant sums all three contributions (27 bye + 26 + 22 = 75) while the
          HIGH_LOW_ADJUSTED variant drops max (27) and min (22) yielding 26 — the two
          variants of the same entry's speaker points diverge; this instance is in the
          Entry domain, distinct from the HiredJudgeContract fee domain of the sibling instance.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 3, fees 2500) with one DEBATE/CX/VARSITY division; schools A-E each with 1 confirmed entry, school F with zero entries and 2 committed judges; all six schools CONFIRMED; tournament locked at 2026-08-10; three PRELIM rounds scheduled (14:00-15:30, 16:00-17:30, 18:00-19:30 on 2026-08-12); prelims active; rounds 1-3 paired, staffed with F judges, balloted, verified and tabulated; entry E1 receives the round-1 bye (lowest in created_at order), wins round 2 with 26 points, wins round 3 with 22 points."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts SP", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 3, entry_fee_cents: 2500, tournament_staff_count: 10 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Gamma" }, as: TournamentDirector, captures: { s_c: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Delta" }, as: TournamentDirector, captures: { s_d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Epsilon" }, as: TournamentDirector, captures: { s_e: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Zeta" }, as: TournamentDirector, captures: { s_f: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_c}", division_id: "${d}", competitor_name: "C-One" }, as: SchoolCoach, as_user_id: "${s_c}", captures: { e_c1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_d}", division_id: "${d}", competitor_name: "D-One" }, as: SchoolCoach, as_user_id: "${s_d}", captures: { e_d1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_e}", division_id: "${d}", competitor_name: "E-One" }, as: SchoolCoach, as_user_id: "${s_e}", captures: { e_e1: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /entries/${e_c1}/confirm", as: SchoolCoach, as_user_id: "${s_c}" }
            - { call: "POST /entries/${e_d1}/confirm", as: SchoolCoach, as_user_id: "${s_d}" }
            - { call: "POST /entries/${e_e1}/confirm", as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_b}", name: "J-Beta" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { j_b: $.data.id } }
            - { call: "POST /judges/${j_b}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_c}", name: "J-Gamma" }, as: SchoolCoach, as_user_id: "${s_c}", captures: { j_c: $.data.id } }
            - { call: "POST /judges/${j_c}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_c}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_d}", name: "J-Delta" }, as: SchoolCoach, as_user_id: "${s_d}", captures: { j_d: $.data.id } }
            - { call: "POST /judges/${j_d}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_d}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_e}", name: "J-Epsilon" }, as: SchoolCoach, as_user_id: "${s_e}", captures: { j_e: $.data.id } }
            - { call: "POST /judges/${j_e}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_f}", name: "J-Zeta-1" }, as: SchoolCoach, as_user_id: "${s_f}", captures: { j_f1: $.data.id } }
            - { call: "POST /judges/${j_f1}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_f}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_f}", name: "J-Zeta-2" }, as: SchoolCoach, as_user_id: "${s_f}", captures: { j_f2: $.data.id } }
            - { call: "POST /judges/${j_f2}/commit", payload: { commitment_rounds: 3 }, as: SchoolCoach, as_user_id: "${s_f}" }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /schools/${s_b}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /schools/${s_c}/confirm", as: SchoolCoach, as_user_id: "${s_c}" }
            - { call: "POST /schools/${s_d}/confirm", as: SchoolCoach, as_user_id: "${s_d}" }
            - { call: "POST /schools/${s_e}/confirm", as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /schools/${s_f}/confirm", as: SchoolCoach, as_user_id: "${s_f}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T14:00:00Z", ends_at: "2026-08-12T15:30:00Z" }, as: TabStaff, captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 2, kind: "PRELIM", starts_at: "2026-08-12T16:00:00Z", ends_at: "2026-08-12T17:30:00Z" }, as: TabStaff, captures: { r2: $.data.id, r2_v: $.data.version } }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 3, kind: "PRELIM", starts_at: "2026-08-12T18:00:00Z", ends_at: "2026-08-12T19:30:00Z" }, as: TabStaff, captures: { r3: $.data.id, r3_v: $.data.version } }
            - { call: "POST /tournaments/${t}/start-prelims", as: TournamentDirector }
            - { call: "POST /rooms", payload: { tournament_id: "${t}", name: "Room 1" }, as: TournamentDirector, captures: { rm1: $.data.id } }
            - { call: "POST /rooms", payload: { tournament_id: "${t}", name: "Room 2" }, as: TournamentDirector, captures: { rm2: $.data.id } }
            # --- Round 1: pairings (A1,B1),(C1,D1), bye E1 (emitted last) ---
            - { call: "POST /rounds/${r1}/generate-pairings", payload: { expected_round_version: "${r1_v}" }, as: TabStaff }
            - { call: "GET /pairings?round_id=${r1}", as: TabStaff, captures: { p10: "$.data[0].id", p11: "$.data[1].id", p12: "$.data[2].id" } }
            - { call: "GET /pairing-entries?pairing_id=${p12}", as: TabStaff, captures: { bye_e: "$.data[0].entry_id" } }
            - { call: "POST /pairings/${p10}/assign-room", payload: { room_id: "${rm1}" }, as: TabStaff }
            - { call: "POST /pairings/${p10}/assign-judge", payload: { judge_id: "${j_f1}" }, as: TabStaff }
            - { call: "POST /pairings/${p11}/assign-room", payload: { room_id: "${rm2}" }, as: TabStaff }
            - { call: "POST /pairings/${p11}/assign-judge", payload: { judge_id: "${j_f2}" }, as: TabStaff }
            - { call: "POST /rounds/${r1}/open-ballots", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p10}", as: TabStaff, captures: { p10w: "$.data[0].entry_id", p10l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p10}", winner_entry_id: "${p10w}", speaker_points: { "${p10w}": 30, "${p10l}": 26 } }, as: Judge, as_user_id: "${j_f1}", captures: { b10: $.data.id } }
            - { call: "POST /ballots/${b10}/submit", as: Judge, as_user_id: "${j_f1}" }
            - { call: "POST /ballots/${b10}/verify", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p11}", as: TabStaff, captures: { p11w: "$.data[0].entry_id", p11l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p11}", winner_entry_id: "${p11w}", speaker_points: { "${p11w}": 28, "${p11l}": 25 } }, as: Judge, as_user_id: "${j_f2}", captures: { b11: $.data.id } }
            - { call: "POST /ballots/${b11}/submit", as: Judge, as_user_id: "${j_f2}" }
            - { call: "POST /ballots/${b11}/verify", as: TabStaff }
            - { call: "POST /rounds/${r1}/tabulate", as: TabStaff }
            # --- Round 2: bye D1 (lowest without bye), pairings (A1,C1),(E1,B1) ---
            - { call: "POST /rounds/${r2}/generate-pairings", payload: { expected_round_version: "${r2_v}" }, as: TabStaff }
            - { call: "GET /pairings?round_id=${r2}", as: TabStaff, captures: { p20: "$.data[0].id", p21: "$.data[1].id" } }
            - { call: "POST /pairings/${p20}/assign-room", payload: { room_id: "${rm1}" }, as: TabStaff }
            - { call: "POST /pairings/${p20}/assign-judge", payload: { judge_id: "${j_f1}" }, as: TabStaff }
            - { call: "POST /pairings/${p21}/assign-room", payload: { room_id: "${rm2}" }, as: TabStaff }
            - { call: "POST /pairings/${p21}/assign-judge", payload: { judge_id: "${j_f2}" }, as: TabStaff }
            - { call: "POST /rounds/${r2}/open-ballots", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p20}", as: TabStaff, captures: { p20w: "$.data[0].entry_id", p20l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p20}", winner_entry_id: "${p20w}", speaker_points: { "${p20w}": 28, "${p20l}": 26 } }, as: Judge, as_user_id: "${j_f1}", captures: { b20: $.data.id } }
            - { call: "POST /ballots/${b20}/submit", as: Judge, as_user_id: "${j_f1}" }
            - { call: "POST /ballots/${b20}/verify", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p21}", as: TabStaff, captures: { p21w: "$.data[0].entry_id", p21l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p21}", winner_entry_id: "${p21w}", speaker_points: { "${p21w}": 26, "${p21l}": 24 } }, as: Judge, as_user_id: "${j_f2}", captures: { b21: $.data.id } }
            - { call: "POST /ballots/${b21}/submit", as: Judge, as_user_id: "${j_f2}" }
            - { call: "POST /ballots/${b21}/verify", as: TabStaff }
            - { call: "POST /rounds/${r2}/tabulate", as: TabStaff }
            # --- Round 3: bye B1, pairings (A1,D1),(E1,C1) after rematch backtracking ---
            - { call: "POST /rounds/${r3}/generate-pairings", payload: { expected_round_version: "${r3_v}" }, as: TabStaff }
            - { call: "GET /pairings?round_id=${r3}", as: TabStaff, captures: { p30: "$.data[0].id", p31: "$.data[1].id" } }
            - { call: "POST /pairings/${p30}/assign-room", payload: { room_id: "${rm1}" }, as: TabStaff }
            - { call: "POST /pairings/${p30}/assign-judge", payload: { judge_id: "${j_f1}" }, as: TabStaff }
            - { call: "POST /pairings/${p31}/assign-room", payload: { room_id: "${rm2}" }, as: TabStaff }
            - { call: "POST /pairings/${p31}/assign-judge", payload: { judge_id: "${j_f2}" }, as: TabStaff }
            - { call: "POST /rounds/${r3}/open-ballots", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p30}", as: TabStaff, captures: { p30w: "$.data[0].entry_id", p30l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p30}", winner_entry_id: "${p30w}", speaker_points: { "${p30w}": 28, "${p30l}": 24 } }, as: Judge, as_user_id: "${j_f1}", captures: { b30: $.data.id } }
            - { call: "POST /ballots/${b30}/submit", as: Judge, as_user_id: "${j_f1}" }
            - { call: "POST /ballots/${b30}/verify", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p31}", as: TabStaff, captures: { p31w: "$.data[0].entry_id", p31l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p31}", winner_entry_id: "${p31w}", speaker_points: { "${p31w}": 22, "${p31l}": 20 } }, as: Judge, as_user_id: "${j_f2}", captures: { b31: $.data.id } }
            - { call: "POST /ballots/${b31}/submit", as: Judge, as_user_id: "${j_f2}" }
            - { call: "POST /ballots/${b31}/verify", as: TabStaff }
          trigger:
            - { call: "POST /rounds/${r3}/tabulate", as: TabStaff }
            - { call: "GET /entries/${e_e1}", as: TabStaff }
          assert:
            - "Entry.${e_e1}.speaker_points_raw == 75 (27 bye + 26 round-2 + 22 round-3)"
            - "Entry.${e_e1}.speaker_points_adjusted == 26 (75 - max 27 - min 22; >= 3 contributions)"
            - "Entry.${e_e1}.wins == 3"
            - "Entry.${e_e1}.has_received_bye == true"
            - "bye pairing member ${bye_e} == ${e_e1} (round-1 bye went to the lowest-ordered entry in created_at order)"
            - "speaker_points_raw != speaker_points_adjusted on identical ballot data (75 != 26)"

      - name: hired_judge_fee_quote_final_divergence
        grounds:
          - calculations.hired_judge_fee
          - entities.HiredJudgeContract.fields.fee_quote_cents
          - entities.HiredJudgeContract.fields.final_fee_cents
          - state_machines.HiredJudgeContract.FILLED_to_CONFIRMED
        distinguishing_aspect: |
          Entity domain HiredJudgeContract (fiscal): the PROVISIONAL_QUOTE variant counts
          school A's still-REQUESTED 4-round contract in the tournament-wide tier position,
          pricing school B's 6 rounds at 35000 (4 base + 2 premium); the FINAL_INVOICE
          variant excludes REQUESTED contracts, pricing the same 6 rounds at 30000 on
          identical data — a different entity domain from the Entry speaker-point instance.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 4) with DEBATE/CX/VARSITY division; school Alpha with 2 confirmed entries (obligation 4 rounds, no judges, shortfall 4); school Beta with 3 confirmed entries (obligation 8, shortfall 8); Alpha's contract (4 rounds, quote with C_pre=0) created first and left REQUESTED."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts HF", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4, entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a2: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e_a2}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-Two" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b2: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-Three" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b3: $.data.id } }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /entries/${e_b2}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /entries/${e_b3}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}", captures: { s_a_v: $.data.version } }
            - { call: "POST /hired-judge-contracts", payload: { school_id: "${s_a}", rounds_requested: 4, expected_school_version: "${s_a_v}" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { c_a: $.data.id } }
            - { call: "GET /schools/${s_b}", as: SchoolCoach, as_user_id: "${s_b}", captures: { s_b_v: $.data.version } }
            - { call: "POST /hired-judge-contracts", payload: { school_id: "${s_b}", rounds_requested: 6, expected_school_version: "${s_b_v}" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { c_b: $.data.id } }
          trigger:
            - { call: "POST /hired-judge-contracts/${c_b}/fill", payload: { judge_name: "Hired Beta" }, as: TournamentDirector }
            - { call: "POST /hired-judge-contracts/${c_b}/accept", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "GET /hired-judge-contracts/${c_a}", as: TournamentDirector }
            - { call: "GET /hired-judge-contracts/${c_b}", as: TournamentDirector }
          assert:
            - "HiredJudgeContract.${c_a}.fee_quote_cents == 20000 (4 rounds x 5000, C_pre 0, still REQUESTED)"
            - "HiredJudgeContract.${c_b}.fee_quote_cents == 35000 (quote variant: C_pre 4 -> 4 rounds at 5000 + 2 rounds at 7500)"
            - "HiredJudgeContract.${c_b}.final_fee_cents == 30000 (final variant excludes REQUESTED contracts: C_pre 0 -> 6 x 5000)"
            - "HiredJudgeContract.${c_b}.fee_quote_cents != HiredJudgeContract.${c_b}.final_fee_cents (35000 != 30000 on identical tournament data)"
            - "HiredJudgeContract.${c_b}.hired_judge_id != null (HIRED judge created at fill, COMMITTED with commitment_rounds == 6)"
  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: judge_obligation_mixed_event_type_ceil
        grounds:
          - calculations.judge_obligation_rounds
          - calculations.judge_coverage_shortfall
          - entities.School.fields.judge_obligation_rounds
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: per-division conditional
          rate (2 debate vs 5 speech entries per judge), per-division ceil, and the
          tournament prelim_round_count multiplier. 3 debate entries contribute
          ceil(3/2)*4 = 8 and 6 speech entries contribute ceil(6/5)*4 = 8, total 16 —
          not 9*4 nor ceil(9/2)*4; the branch + ceil + multiply ordering is observable.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 4, entry_fee 2500); division CX (DEBATE, per-school cap 8); division OO (SPEECH, per-school cap 8); school Alpha with 3 confirmed CX entries and 6 confirmed OO entries; no judges."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts OB", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4, entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY", per_school_entry_cap: 8 }, as: TournamentDirector, captures: { d_cx: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "SPEECH", event_code: "OO", division: "VARSITY", per_school_entry_cap: 8 }, as: TournamentDirector, captures: { d_oo: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d_cx}", competitor_name: "CX-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d_cx}", competitor_name: "CX-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e2: $.data.id } }
