          - calculations.combustion_safety_verdict
        distinguishing_aspect: "The verdict filter selects on a COMPUTED field, so the list endpoint has to persist what the calculation decided: a RANGE at 500 ppm is MARGINAL while a water heater at 18 ppm is PASS, and phase and verdict compose into a single narrowed page."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one programme, one technician and one project (gas_appliance_count 1)"
            - "Three combustion tests on the project: WH-1 PRE (PASS), RANGE-1 PRE (MARGINAL on the RANGE-specific CO ceiling) and WH-1 POST (PASS)"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 12, co_ppm_air_free: 18.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { v_wh_pre: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "RANGE-1", appliance_type: "RANGE", phase: "PRE", spillage_seconds: 5, co_ppm_air_free: 500.0, draft_pressure_pa: 2.0, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { v_range_pre: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "POST", spillage_seconds: 8, co_ppm_air_free: 14.0, draft_pressure_pa: 2.7, worst_case_depressurization_pa: 2.8 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { v_wh_post: $.data.verdict }
          trigger:
            - call: "GET /duct-sealing/projects/${proj_id}/combustion-tests"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { all_first_label: "$.data[0].appliance_label" }
            - call: "GET /duct-sealing/projects/${proj_id}/combustion-tests?phase=PRE"
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "GET /duct-sealing/projects/${proj_id}/combustion-tests?verdict=MARGINAL"
              as: UtilityInspector
              as_user_id: "insp-1"
              captures: { marg_label: "$.data[0].appliance_label", marg_type: "$.data[0].appliance_type" }
            - call: "GET /duct-sealing/projects/${proj_id}/combustion-tests?phase=PRE&verdict=PASS"
              as: UtilityInspector
              as_user_id: "insp-1"
              captures: { pre_pass_label: "$.data[0].appliance_label" }
            - call: "GET /duct-sealing/projects/${proj_id}/combustion-tests?verdict=FAIL"
              as: ProgramAdmin
            - call: "GET /duct-sealing/projects/${proj_id}"
