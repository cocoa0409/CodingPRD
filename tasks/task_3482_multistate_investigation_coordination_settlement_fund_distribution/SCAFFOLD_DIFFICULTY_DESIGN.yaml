  - rule_id: resource_temporal_overlap
    instances:
      - name: lead_window_capacity_conflict_on_second_investigation
        grounds:
          - validations[priority=10]
          - errors[ERR_LEAD_WINDOW_OVERLAP]
          - entities.Investigation.fields.opened_at
          - entities.Investigation.fields.settled_at
        distinguishing_aspect: |
          Capacity-1 interval semantics on the StateOffice resource: a LEAD designation
          occupies the half-open window [opened_at, settled_at) of its investigation;
          activating a second investigation whose lead set includes CA while inv1's window
          is still open is rejected with ERR_LEAD_WINDOW_OVERLAP.
