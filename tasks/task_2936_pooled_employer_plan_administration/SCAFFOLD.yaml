# =============================================================================
# SCAFFOLD — Pooled Employer Plan (PEP) Administration
# Sections §1.0 – §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# and corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Pooled Employer Plan Administration (pooled employer plan provider): adopting employer
  onboarding with plan design elections inside a single plan document, pooled plan provider
  registration and fiduciary role allocation among service providers, payroll integration,
  contribution remittance timeliness and correction of late deposits, plan-level
  nondiscrimination and coverage testing considerations across adopting employers, single audit
  and Form filing at the plan level with employer-level data, employer-specific eligibility,
  vesting and match formulas within the common structure, adopting employer exit, spin-off and
  asset transfer, fee disclosure and revenue sharing allocation

domain_name: pooled-employer-plan-administration
api_prefix: /pep

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every business resource is addressed at its own top-level collection under /pep.
  # Ownership is expressed only through FK fields (plan_document_id, adopting_employer_id,
  # payroll_batch_id, …), never through nested write paths. Reverse navigation is provided by
  # sub-resource GET listings; the self-referential ServiceProvider.affiliated_service_provider_id
  # edge makes the provider layer a graph rather than a tree.

  state_machine_shape: parallel
  # RemittanceDeposit carries two independent state dimensions (deposit_status ×
  # timeliness_status) that advance on different triggers by different actors.
  # AdoptingEmployer is cyclic (ELECTIONS_SUBMITTED → RETURNED_FOR_REVISION →
  # ELECTIONS_SUBMITTED). PlanFiling is a fork-join (PREPARED → {attest, certify} →
  # READY_TO_FILE) whose two branches carry different side-effect sets.

  relationship_patterns:
    - one_to_many          # PlanDocument → AdoptingEmployer → PayrollBatch → RemittanceDeposit
    - many_to_many         # FiduciaryRoleAllocation joins PlanDocument × ServiceProvider by role
    - self_referential     # ServiceProvider.affiliated_service_provider_id → ServiceProvider.id
    - cross_aggregate      # ComplianceTest / PlanFiling read employer-level aggregates

  role_model: segregation_of_duties
  # The service provider that holds any ALLOCATED fiduciary role (or an affiliate of one) can
  # never supply the plan audit; the service provider that prepared the annual return may not
  # audit it; the pooled plan provider certifies employer-level data but can neither prepare,
  # attest nor file; only RegulatorOps files.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PooledPlanProvider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the pooled plan provider entity."
        constraints: "1..200 chars"
      - name: ein
        type: string
        source: input
        description: "Employer identification number of the pooled plan provider."
        constraints: "exactly 9 digits; unique across all PooledPlanProvider rows"
      - name: fidelity_bond_amount_cents
        type: integer
        source: input
        description: "ERISA 412 fidelity bond face amount carried by the provider, in cents."
        constraints: ">= 0"
      - name: registration_status
        type: enum
        source: system
        description: "Registration posture with the plan regulator."
        default: PENDING_REGISTRATION
        constraints: "PENDING_REGISTRATION | REGISTERED"
      - name: registration_number
        type: string
        source: computed
        description: "Minted when registration is approved; format PPP-NNNN where NNNN is the 1-based approval ordinal zero-padded to 4 digits, assigned in ascending order of approval (ties impossible: one approval per request). Null while PENDING_REGISTRATION."
        default: null
      - name: registration_effective_date
        type: string
        source: system
        description: "Calendar date the registration takes effect, copied from the approval request. Null while PENDING_REGISTRATION."
        default: null
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock instant of registration approval. Null while PENDING_REGISTRATION."
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"

  - name: PlanDocument
    parent: null
    common_fields: true
    fields:
      - name: pooled_plan_provider_id
        type: string
        source: input
        description: "FK -> PooledPlanProvider.id; the provider that sponsors and administers this single plan document."
      - name: plan_name
        type: string
        source: input
        description: "Name of the pooled employer plan."
        constraints: "1..200 chars"
      - name: plan_number
        type: string
        source: input
        description: "Three-digit plan number used on the annual return."
        constraints: "exactly 3 digits; unique per pooled_plan_provider_id"
      - name: plan_year_end_date
        type: string
        source: input
        description: "Last calendar date of the plan year."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the plan document itself."
        default: DRAFT
        constraints: "DRAFT | ACTIVE"
      - name: effective_date
        type: string
        source: system
        description: "Calendar date the plan document became ACTIVE. Null while DRAFT."
        default: null
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: base_eligibility_min_age
        type: integer
        source: input
        description: "Common-structure maximum age condition an adopting employer may impose."
        constraints: "18..21"
      - name: base_eligibility_service_months
        type: integer
        source: input
        description: "Common-structure maximum service condition in months an adopting employer may impose."
        constraints: "0..12"
      - name: base_vesting_schedule
        type: enum
        source: input
        description: "Least generous vesting schedule permitted inside the common structure."
        constraints: "IMMEDIATE | GRADED_2_6 | CLIFF_3YR"
      - name: base_match_formula_code
        type: enum
        source: input
        description: "Default employer match formula in the plan document."
        constraints: "SAFE_HARBOR_BASIC | SAFE_HARBOR_ENHANCED | DISCRETIONARY_TIERED | NONE"
      - name: participant_count
        type: integer
        source: computed
        description: "Sum of AdoptingEmployer.participant_count over employers of this plan whose adoption_status IN {APPLIED, ELECTIONS_SUBMITTED, RETURNED_FOR_REVISION, ACTIVE, SUSPENDED, EXIT_REQUESTED, SPINOFF_IN_PROGRESS}; employers in EXITED are excluded."
        default: 0
      - name: cumulative_enrolled_participant_count
        type: integer
        source: computed
        description: "Monotone control total: increased by every employer admission and by every positive census delta, decreased by every negative census delta, never decreased by an exit."
        default: 0
      - name: transferred_out_participant_count
        type: integer
        source: computed
        description: "Sum of ExitTransfer.transferred_participant_count over transfers of this plan whose status == SETTLED."
        default: 0
      - name: headcount_control_delta
        type: integer
        source: computed
        description: "participant_count + transferred_out_participant_count - cumulative_enrolled_participant_count. Invariant: always exactly 0."
        default: 0
      - name: active_employer_count
        type: integer
        source: computed
        description: "Count of AdoptingEmployer rows of this plan whose adoption_status IN {ACTIVE, EXIT_REQUESTED, SPINOFF_IN_PROGRESS}."
        default: 0
      - name: suspended_employer_count
        type: integer
        source: computed
        description: "Count of AdoptingEmployer rows of this plan whose adoption_status == SUSPENDED."
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "Plan-wide gate derived from suspended_employer_count: 0 -> OPEN, exactly 1 -> RESTRICTED, >= 2 -> FROZEN."
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: audit_required
        type: boolean
        source: computed
        description: "True when participant_count >= 1000 (plan-level single audit threshold)."
        default: false
      - name: total_validated_contributions_cents
        type: integer
        source: computed
        description: "Sum of PayrollBatch.batch_total_cents over batches of this plan whose status IN {VALIDATED, REMITTED}."
        default: 0
      - name: aggregate_receivable_cents
        type: integer
        source: computed
        description: "Sum of AdoptingEmployer.contribution_receivable_cents over all employers of this plan."
        default: 0
      - name: total_assets_cents
        type: integer
        source: computed
        description: "Sum of AdoptingEmployer.account_balance_cents over all employers of this plan, plus expense_recovered_cents."
        default: 0
      - name: total_corrections_funded_cents
        type: integer
        source: computed
        description: "Sum of RemittanceDeposit.restoration_cents over deposits of this plan whose timeliness_status == CORRECTED."
        default: 0
      - name: transferred_out_cents
        type: integer
        source: computed
        description: "Sum of ExitTransfer.transfer_amount_cents over transfers of this plan whose status == SETTLED — the value that actually left the trust, net of deductions retained by the plan."
        default: 0
      - name: expense_recovered_cents
        type: integer
        source: computed
        description: "Sum of ExitTransfer.deductions_applied_cents over transfers of this plan whose status == SETTLED."
        default: 0
      - name: contribution_control_delta_cents
        type: integer
        source: computed
        description: "total_assets_cents + aggregate_receivable_cents + transferred_out_cents - total_corrections_funded_cents - total_validated_contributions_cents. Invariant: always exactly 0."
        default: 0

  - name: ServiceProvider
    parent: null
    common_fields: true
    fields:
      - name: plan_document_id
        type: string
        source: input
        description: "FK -> PlanDocument.id; the plan this provider is engaged on."
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the engaged service provider firm."
        constraints: "1..200 chars"
      - name: provider_type
        type: enum
        source: input
        description: "Functional category of the engagement."
        constraints: "RECORDKEEPER | TPA | TRUSTEE | INVESTMENT_MANAGER | AUDITOR_FIRM"
      - name: revenue_sharing_bps
        type: integer
        source: input
        description: "Indirect compensation the provider receives from plan investments, in basis points."
        constraints: "0..500"
      - name: direct_fee_cents_per_participant
        type: integer
        source: input
        description: "Direct per-participant annual fee billed to the plan, in cents."
        constraints: ">= 0"
      - name: affiliated_service_provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; self-referential link to a commonly controlled provider on the same plan. Null when the firm has no affiliate."
        default: null
      - name: holds_fiduciary_role
        type: boolean
        source: computed
        description: "True when at least one FiduciaryRoleAllocation with service_provider_id == this.id has status == ALLOCATED."
        default: false

  - name: FiduciaryRoleAllocation
    parent: null
    common_fields: true
    fields:
      - name: plan_document_id
        type: string
        source: input
        description: "FK -> PlanDocument.id; the plan whose fiduciary function is being allocated."
      - name: service_provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider accepting the named function."
      - name: fiduciary_role
        type: enum
        source: input
        description: "Statutory function being allocated to the provider."
        constraints: "NAMED_FIDUCIARY_3_16 | INVESTMENT_MANAGER_3_38 | TRUSTEE_403A | NON_FIDUCIARY_MINISTERIAL"
      - name: effective_from
        type: string
        source: input
        description: "First calendar date the provider holds the function (closed interval start)."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: effective_to
        type: string
        source: input
        description: "Last calendar date the provider holds the function (closed interval end)."
        constraints: "ISO-8601 calendar date YYYY-MM-DD; >= effective_from"
      - name: status
        type: enum
        source: system
        description: "ALLOCATED until a later allocation for the same (plan_document_id, fiduciary_role) supersedes it."
        default: ALLOCATED
        constraints: "ALLOCATED | REVOKED"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant the provider acknowledged the function in writing. Null until acknowledged."
        default: null
      - name: acknowledgment_statement
        type: string
        source: system
        description: "Verbatim acknowledgment text supplied by the provider. Null until acknowledged."
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant this allocation was superseded. Null while ALLOCATED."
        default: null
      - name: revoked_reason
        type: enum
        source: system
        description: "Why the allocation left ALLOCATED."
        default: null
        constraints: "SUPERSEDED_BY_NEW_ALLOCATION"

  - name: AdoptingEmployer
    parent: null
    common_fields: true
    fields:
      - name: plan_document_id
        type: string
        source: input
        description: "FK -> PlanDocument.id; the single plan document this employer adopts."
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the adopting employer."
        constraints: "1..200 chars"
      - name: ein
        type: string
        source: input
        description: "Adopting employer EIN."
        constraints: "exactly 9 digits; unique per plan_document_id"
      - name: election_window_close_date
        type: string
        source: input
        description: "Last calendar date on which this employer may submit a plan design election."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: adoption_status
        type: enum
        source: system
        description: "Onboarding and participation lifecycle of the employer inside the pooled plan."
        default: APPLIED
        constraints: "APPLIED | ELECTIONS_SUBMITTED | RETURNED_FOR_REVISION | ACTIVE | SUSPENDED | EXIT_REQUESTED | SPINOFF_IN_PROGRESS | EXITED"
      - name: effective_adoption_date
        type: string
        source: system
        description: "Calendar date the employer's approved election took effect. Null until an election is APPROVED."
        default: null
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: participant_count
        type: integer
        source: input
        description: "Employer-reported count of plan participants in this employer's workforce."
        constraints: ">= 0"
      - name: hce_count
        type: integer
        source: input
        description: "Employer-reported count of highly compensated employees."
        constraints: ">= 0"
      - name: nhce_count
        type: integer
        source: input
        description: "Employer-reported count of non-highly compensated employees."
        constraints: ">= 1"
      - name: benefiting_hce_count
        type: integer
        source: input
        description: "Highly compensated employees benefiting under the plan for coverage testing."
        constraints: ">= 0; <= hce_count"
      - name: benefiting_nhce_count
        type: integer
        source: input
        description: "Non-highly compensated employees benefiting under the plan for coverage testing."
        constraints: ">= 0; <= nhce_count"
      - name: hce_avg_deferral_pct
        type: number
        source: input
        description: "Average deferral percentage of this employer's highly compensated employees."
        constraints: "0.00..25.00, two decimal places"
      - name: nhce_avg_deferral_pct
        type: number
        source: input
        description: "Average deferral percentage of this employer's non-highly compensated employees."
        constraints: "0.00..25.00, two decimal places"
      - name: is_small_plan
        type: boolean
        source: computed
        description: "True when participant_count < 100; selects the seven-business-day deposit safe harbour for this employer's payroll batches."
        default: true
      - name: employer_audit_required
        type: boolean
        source: computed
        description: "True when participant_count >= 100; the employer must supply audited employer-level financial data for the plan filing."
        default: false
      - name: contribution_hold
        type: boolean
        source: computed
        description: "True when at least one RemittanceDeposit whose payroll_batch_id resolves to a PayrollBatch with adopting_employer_id == this.id has deposit_status == POSTED and timeliness_status IN {LATE, CORRECTION_COMPUTED}."
        default: false
      - name: open_correction_count
        type: integer
        source: computed
        description: "Count of RemittanceDeposit rows whose payroll_batch_id resolves to a PayrollBatch with adopting_employer_id == this.id, deposit_status == POSTED, and timeliness_status IN {LATE, CORRECTION_COMPUTED}."
        default: 0
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Sum of RemittanceDeposit.amount_cents for POSTED deposits of this employer's batches, plus sum of RemittanceDeposit.restoration_cents for deposits with timeliness_status == CORRECTED, minus ExitTransfer settlements that zeroed the account."
        default: 0
      - name: contribution_receivable_cents
        type: integer
        source: computed
        description: "Sum of PayrollBatch.batch_total_cents for this employer's batches whose status == VALIDATED (validated but not yet remitted)."
        default: 0
      - name: revenue_sharing_credit_cents
        type: integer
        source: computed
        description: "Cumulative sum of this employer's credit_cents across every FeeDisclosure allocation_lines entry naming this employer."
        default: 0
      - name: exited_at
        type: datetime
        source: system
        description: "Logical-clock instant the employer's exit transfer settled. Null unless adoption_status == EXITED."
        default: null

  - name: PlanDesignElection
    parent: null
    common_fields: true
    fields:
      - name: adopting_employer_id
        type: string
        source: input
        description: "FK -> AdoptingEmployer.id; the employer making elections inside the common plan document."
      - name: election_sequence
        type: integer
        source: computed
        description: "1-based ordinal of this election among the same employer's elections, assigned in ascending created_at order."
        default: 1
      - name: eligibility_min_age
        type: integer
        source: input
        description: "Minimum age this employer imposes; may not exceed PlanDocument.base_eligibility_min_age."
        constraints: "18..21"
      - name: eligibility_service_months
        type: integer
        source: input
        description: "Service months this employer imposes; may not exceed PlanDocument.base_eligibility_service_months."
        constraints: "0..12"
      - name: vesting_schedule
        type: enum
        source: input
        description: "Employer-specific vesting schedule; generosity rank IMMEDIATE=0, GRADED_2_6=1, CLIFF_3YR=2 may not exceed the plan base rank."
        constraints: "IMMEDIATE | GRADED_2_6 | CLIFF_3YR"
      - name: match_formula_code
        type: enum
        source: input
        description: "Employer-specific match formula selected from the common structure."
        constraints: "SAFE_HARBOR_BASIC | SAFE_HARBOR_ENHANCED | DISCRETIONARY_TIERED | NONE"
      - name: match_tier_1_pct
        type: number
        source: input
        description: "Match rate applied to the first tier of deferrals; required only when match_formula_code == DISCRETIONARY_TIERED."
        default: null
        constraints: "0.00..100.00"
      - name: match_tier_1_limit_pct
        type: number
        source: input
        description: "Upper bound of the first tier expressed as a percentage of eligible compensation; required only when match_formula_code == DISCRETIONARY_TIERED."
        default: null
        constraints: "0.00..15.00"
      - name: match_tier_2_pct
        type: number
        source: input
        description: "Match rate applied to the second tier of deferrals; required only when match_formula_code == DISCRETIONARY_TIERED."
        default: null
        constraints: "0.00..100.00"
      - name: match_tier_2_limit_pct
        type: number
        source: input
        description: "Upper bound of the second tier as a percentage of eligible compensation; required only when match_formula_code == DISCRETIONARY_TIERED and must be >= match_tier_1_limit_pct."
        default: null
        constraints: "0.00..15.00"
      - name: nondiscrimination_track
        type: enum
        source: computed
        description: "SAFE_HARBOR_EXEMPT when match_formula_code IN {SAFE_HARBOR_BASIC, SAFE_HARBOR_ENHANCED}; otherwise ADP_ACP_TESTED."
        constraints: "SAFE_HARBOR_EXEMPT | ADP_ACP_TESTED"
      - name: status
        type: enum
        source: system
        description: "Election review lifecycle."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED | APPROVED | SUPERSEDED"
      - name: signatory_name
        type: string
        source: system
        description: "Name of the employer signatory captured at submission. Null while DRAFT."
        default: null
      - name: return_reason
        type: string
        source: system
        description: "Free text supplied by the pooled plan provider when returning the election. Null unless status == RETURNED."
        default: null
      - name: deficiency_code
        type: enum
        source: system
        description: "Structured reason the election was returned. Null unless status == RETURNED."
        default: null
        constraints: "MISSING_SIGNATORY | TIER_MISMATCH | ELIGIBILITY_TOO_RESTRICTIVE | VESTING_TOO_RESTRICTIVE"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of approval. Null unless status IN {APPROVED, SUPERSEDED}."
        default: null

  - name: PayrollBatch
    parent: null
    common_fields: true
    fields:
      - name: adopting_employer_id
        type: string
        source: input
        description: "FK -> AdoptingEmployer.id; the employer whose payroll produced this batch."
      - name: pay_period_start
        type: string
        source: input
        description: "First calendar date of the pay period (half-open interval start)."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: pay_period_end
        type: string
        source: input
        description: "Exclusive upper bound of the pay period (half-open interval end); must be > pay_period_start."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: pay_date
        type: string
        source: input
        description: "Calendar date wages were paid."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: withholding_date
        type: string
        source: input
        description: "Calendar date elective deferrals were withheld from wages; starts the deposit clock."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: payroll_provider_reference
        type: string
        source: input
        description: "Reference issued by the employer's payroll system."
        constraints: "1..64 chars; unique per adopting_employer_id"
      - name: total_eligible_compensation_cents
        type: integer
        source: input
        description: "Aggregate plan-eligible compensation in the period, in cents."
        constraints: ">= 0"
      - name: total_deferral_cents
        type: integer
        source: input
        description: "Aggregate elective deferrals withheld, in cents."
        constraints: ">= 0"
      - name: total_match_cents
        type: integer
        source: input
        description: "Aggregate employer match the employer claims for the period, in cents; must equal expected_match_cents."
        constraints: ">= 0"
      - name: total_loan_repayment_cents
        type: integer
        source: input
        description: "Aggregate participant loan repayments withheld, in cents."
        constraints: ">= 0"
      - name: participant_line_count
        type: integer
        source: input
        description: "Number of participant lines in the payroll file."
        constraints: ">= 1"
      - name: expected_match_cents
        type: integer
        source: computed
        description: "Employer match computed by the employer_match_amount rule from the employer's APPROVED PlanDesignElection and this batch's compensation and deferrals."
        default: 0
      - name: batch_total_cents
        type: integer
        source: computed
        description: "total_deferral_cents + total_match_cents + total_loan_repayment_cents."
        default: 0
      - name: deposit_rule
        type: enum
        source: computed
        description: "SMALL_PLAN_7_BUSINESS_DAY when the employer's is_small_plan was true at batch creation; otherwise GENERAL_15TH_BUSINESS_DAY."
        constraints: "SMALL_PLAN_7_BUSINESS_DAY | GENERAL_15TH_BUSINESS_DAY"
      - name: deposit_due_date
        type: string
        source: computed
        description: "Latest calendar date a remittance for this batch is timely, from the deposit_due_date calculation."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: "Payroll integration lifecycle."
        default: RECEIVED
        constraints: "RECEIVED | VALIDATED | REMITTED"
      - name: validated_at
        type: datetime
        source: system
        description: "Logical-clock instant the recordkeeper reconciled the batch. Null while RECEIVED."
        default: null
      - name: reconciliation_note
        type: string
        source: system
        description: "Recordkeeper note captured at validation. Null while RECEIVED."
        default: null

  - name: RemittanceDeposit
    parent: null
    common_fields: true
    fields:
      - name: payroll_batch_id
        type: string
        source: input
        description: "FK -> PayrollBatch.id; the validated batch this money settles."
      - name: deposit_date
        type: string
        source: input
        description: "Calendar date the money reached the trust; may not be in the future relative to the logical clock."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount remitted, in cents; must equal the batch's batch_total_cents."
        constraints: ">= 1"
      - name: deposit_reference
        type: string
        source: input
        description: "Wire or ACH reference supplied by the employer."
        constraints: "1..64 chars"
      - name: deposit_status
        type: enum
        source: system
        description: "Settlement dimension, advanced by the recordkeeper. Independent of timeliness_status."
        default: PENDING
        constraints: "PENDING | POSTED | REVERSED"
      - name: timeliness_status
        type: enum
        source: system
        description: "Compliance dimension, evaluated at posting and advanced by the correction workflow. Independent of deposit_status."
        default: UNDETERMINED
        constraints: "UNDETERMINED | TIMELY | LATE | CORRECTION_COMPUTED | CORRECTED"
      - name: business_days_elapsed
        type: integer
        source: computed
        description: "Business days strictly after PayrollBatch.withholding_date through deposit_date inclusive, per the business_days_elapsed rule. Null until posted."
        default: null
      - name: late_by_business_days
        type: integer
        source: computed
        description: "Business days strictly after PayrollBatch.deposit_due_date through deposit_date inclusive; 0 when timely. Null until posted."
        default: null
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant of posting. Null while PENDING."
        default: null
      - name: posting_reference
        type: string
        source: system
        description: "Trust posting reference captured at posting. Null while PENDING."
        default: null
      - name: correction_method
        type: enum
        source: system
        description: "Lost-earnings algorithm selected by the recordkeeper. Null until a correction is computed."
        default: null
        constraints: "VFCP_RECOVERY_DATE | IRS_6621_UNDERPAYMENT"
      - name: recovery_date
        type: string
        source: system
        description: "Calendar date used as the end of the lost-earnings period. Null until a correction is computed."
        default: null
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: actual_investment_return_cents
        type: integer
        source: system
        description: "Actual investment return the plan would have earned, supplied at correction time for the restoration floor test."
        default: 0
      - name: lost_earnings_cents
        type: integer
        source: computed
        description: "Output of the lost_earnings calculation under correction_method. Null until a correction is computed."
        default: null
      - name: restoration_cents
        type: integer
        source: computed
        description: "max(lost_earnings_cents, actual_investment_return_cents) — the amount the employer must actually restore. Null until a correction is computed."
        default: null
      - name: excise_tax_cents
        type: integer
        source: computed
        description: "Fifteen percent excise tax on the amount involved, from the excise_tax_5330 calculation. Null until a correction is computed."
        default: null
      - name: form_5330_reference
        type: string
        source: system
        description: "Excise tax return reference captured when the correction is funded. Null until funded."
        default: null
      - name: funded_at
        type: datetime
        source: system
        description: "Logical-clock instant the restoration was funded. Null until funded."
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: "Reason captured when the deposit was reversed. Null unless deposit_status == REVERSED."
        default: null

  - name: ComplianceTest
    parent: null
    common_fields: true
    fields:
      - name: plan_document_id
        type: string
        source: input
        description: "FK -> PlanDocument.id; the plan whose population is tested."
      - name: adopting_employer_id
        type: string
        source: input
        description: "FK -> AdoptingEmployer.id; required when scope == EMPLOYER_LEVEL, must be null when scope == PLAN_LEVEL."
        default: null
      - name: test_type
        type: enum
        source: input
        description: "Which nondiscrimination or coverage test this row evaluates."
        constraints: "COVERAGE_410B_RATIO | ADP | ACP"
      - name: scope
        type: enum
        source: input
        description: "Testing population: the whole pooled plan, or one adopting employer treated as a separate plan."
        constraints: "PLAN_LEVEL | EMPLOYER_LEVEL"
      - name: plan_year
        type: integer
        source: input
        description: "Plan year under test."
        constraints: "2020..2030"
      - name: status
        type: enum
        source: system
        description: "Test lifecycle."
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | CLOSED"
      - name: population_hce_count
        type: integer
        source: computed
        description: "Sum of hce_count over the tested population (all ACTIVE and SUSPENDED employers of the plan when PLAN_LEVEL; the single employer when EMPLOYER_LEVEL). Null while SCHEDULED."
        default: null
      - name: population_nhce_count
        type: integer
        source: computed
        description: "Sum of nhce_count over the tested population. Null while SCHEDULED."
        default: null
      - name: benefiting_hce_count
        type: integer
        source: computed
        description: "Sum of benefiting_hce_count over the tested population. Null while SCHEDULED."
        default: null
      - name: benefiting_nhce_count
        type: integer
        source: computed
        description: "Sum of benefiting_nhce_count over the tested population. Null while SCHEDULED."
        default: null
      - name: hce_benefiting_pct
        type: number
        source: computed
        description: "benefiting_hce_count / population_hce_count as a percentage. Null unless test_type == COVERAGE_410B_RATIO and status != SCHEDULED."
        default: null
        constraints: "two decimal places, round_half_up"
      - name: nhce_benefiting_pct
        type: number
        source: computed
        description: "benefiting_nhce_count / population_nhce_count as a percentage. Null unless test_type == COVERAGE_410B_RATIO and status != SCHEDULED."
        default: null
        constraints: "two decimal places, round_half_up"
      - name: ratio_pct
        type: number
        source: computed
        description: "Ratio percentage from the coverage_ratio_percentage calculation. Null unless test_type == COVERAGE_410B_RATIO and status != SCHEDULED."
        default: null
        constraints: "two decimal places, round_half_up"
      - name: hce_avg_deferral_pct
        type: number
        source: computed
        description: "Population-weighted average deferral percentage of highly compensated employees. Null unless test_type IN {ADP, ACP} and status != SCHEDULED."
        default: null
        constraints: "two decimal places, round_half_up"
      - name: nhce_avg_deferral_pct
        type: number
        source: computed
        description: "Population-weighted average deferral percentage of non-highly compensated employees. Null unless test_type IN {ADP, ACP} and status != SCHEDULED."
        default: null
        constraints: "two decimal places, round_half_up"
      - name: adp_limit_pct
        type: number
        source: computed
        description: "Maximum permitted HCE average from the adp_acp_limit calculation. Null unless test_type IN {ADP, ACP} and status != SCHEDULED."
        default: null
        constraints: "two decimal places, round_half_up"
      - name: exemption_applied
        type: boolean
        source: computed
        description: "True when every employer in the tested population has an APPROVED PlanDesignElection with nondiscrimination_track == SAFE_HARBOR_EXEMPT and test_type IN {ADP, ACP}; the test then passes without computing averages."
        default: false
      - name: run_at
        type: datetime
        source: system
        description: "Logical-clock instant the test was run. Null while SCHEDULED."
        default: null
      - name: failure_reason
        type: enum
        source: system
        description: "Structured cause when status == FAILED."
        default: null
        constraints: "RATIO_BELOW_THRESHOLD | HCE_AVERAGE_EXCEEDS_LIMIT"
      - name: closed_reason
        type: enum
        source: system
        description: "Why the test was closed without a verdict. Null unless status == CLOSED."
        default: null
        constraints: "EMPLOYER_EXITED"

  - name: PlanFiling
    parent: null
    common_fields: true
    fields:
      - name: plan_document_id
        type: string
        source: input
        description: "FK -> PlanDocument.id; the plan whose annual return this row tracks."
      - name: plan_year
        type: integer
        source: input
        description: "Plan year covered by the filing; unique per plan_document_id."
        constraints: "2020..2030"
      - name: filing_status
        type: enum
        source: system
        description: "Fork-join filing lifecycle: PREPARED forks into an audit branch and an employer-data branch that join at READY_TO_FILE."
        default: DRAFT
        constraints: "DRAFT | PREPARED | PARTIALLY_CLEARED | READY_TO_FILE | FILED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ServiceProvider that prepared the annual return, i.e. that provider's id. Null while DRAFT."
        default: null
      - name: prepared_at
        type: datetime
        source: system
        description: "Logical-clock instant of preparation. Null while DRAFT."
        default: null
      - name: audit_attested_at
        type: datetime
        source: system
        description: "Logical-clock instant the independent auditor attested. Null until the audit branch clears."
        default: null
      - name: audit_opinion
        type: enum
        source: system
        description: "Auditor opinion recorded on the single plan-level audit. Null until the audit branch clears."
        default: null
        constraints: "UNMODIFIED | QUALIFIED | DISCLAIMER"
      - name: audit_firm_service_provider_id
        type: string
        source: system
        description: "FK -> ServiceProvider.id; the AUDITOR_FIRM that attested. Null until the audit branch clears."
        default: null
      - name: employer_data_certified_at
        type: datetime
        source: system
        description: "Logical-clock instant employer-level data was certified. Null until the employer-data branch clears."
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID that certified employer-level data. Null until the employer-data branch clears."
        default: null
      - name: certified_employer_count
        type: integer
        source: computed
        description: "Count of the plan's employers with adoption_status other than EXITED at certification time, i.e. every employer whose data the return must carry. Null until the employer-data branch clears."
        default: null
      - name: late_deposit_schedule_h_line_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over every RemittanceDeposit of the plan with deposit_status == POSTED and timeliness_status IN {LATE, CORRECTION_COMPUTED, CORRECTED}, reported on the delinquent-participant-contributions line. Null while DRAFT."
        default: null
      - name: fidelity_bond_minimum_cents
        type: integer
        source: computed
        description: "Minimum ERISA 412 bond required for the plan from the fidelity_bond_minimum calculation. Null while DRAFT."
        default: null
      - name: audit_required
        type: boolean
        source: computed
        description: "Copy of PlanDocument.audit_required evaluated at preparation time; when false the audit branch is pre-cleared and attestation is rejected."
        default: false
      - name: filing_deadline_date
        type: string
        source: computed
        description: "Calendar date the return is due, from the filing_deadline_date calculation. Null while DRAFT."
        default: null
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: filed_date
        type: string
        source: system
        description: "Calendar date the return was filed, taken from the logical clock. Null until FILED."
        default: null
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: is_late_filing
        type: boolean
        source: computed
        description: "True when filed_date > filing_deadline_date. Null-equivalent false until FILED."
        default: false
      - name: acknowledgment_reference
        type: string
        source: system
        description: "Regulator acknowledgment reference minted at filing. Null until FILED."
        default: null

  - name: ExitTransfer
    parent: null
    common_fields: true
    fields:
      - name: adopting_employer_id
        type: string
        source: input
        description: "FK -> AdoptingEmployer.id; the employer leaving the pooled plan."
      - name: exit_type
        type: enum
        source: input
        description: "Whether assets spin off into the employer's own single-employer plan, transfer to another pooled plan, or are distributed on termination."
        constraints: "SPINOFF_TO_SINGLE_PLAN | TRANSFER_TO_OTHER_PEP | PLAN_TERMINATION_DISTRIBUTION"
      - name: requested_exit_date
        type: string
        source: input
        description: "Calendar date the employer asks to leave."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: blackout_start_date
        type: string
        source: input
        description: "First calendar date of the asset-transfer blackout window (closed interval)."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: blackout_end_date
        type: string
        source: input
        description: "Last calendar date of the blackout window (closed interval); must be >= blackout_start_date."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: successor_plan_name
        type: string
        source: input
        description: "Name of the receiving plan; required unless exit_type == PLAN_TERMINATION_DISTRIBUTION."
        default: null
        constraints: "1..200 chars"
      - name: status
        type: enum
        source: system
        description: "Exit lifecycle."
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | SETTLED | REVERSED"
      - name: transferred_participant_count
        type: integer
        source: computed
        description: "AdoptingEmployer.participant_count captured at settlement. Null until SETTLED."
        default: null
      - name: gross_account_balance_cents
        type: integer
        source: computed
        description: "AdoptingEmployer.account_balance_cents captured at settlement. Null until SETTLED."
        default: null
      - name: admin_recovery_cents
        type: integer
        source: computed
        description: "Per-participant administrative recovery from the exit_settlement_waterfall calculation. Null until SETTLED."
        default: null
      - name: flat_exit_fee_cents
        type: integer
        source: computed
        description: "Flat exit fee, waived for PLAN_TERMINATION_DISTRIBUTION. Null until SETTLED."
        default: null
      - name: deductions_applied_cents
        type: integer
        source: computed
        description: "Portion of admin_recovery_cents + flat_exit_fee_cents actually recoverable from the gross balance under the waterfall. Null until SETTLED."
        default: null
      - name: unrecovered_deduction_cents
        type: integer
        source: computed
        description: "Portion of the deductions the balance could not cover, written off by the plan. Null until SETTLED."
        default: null
      - name: transfer_amount_cents
        type: integer
        source: computed
        description: "gross_account_balance_cents - deductions_applied_cents; the amount moved to the successor arrangement. Null until SETTLED."
        default: null
      - name: settled_amount_cents
        type: integer
        source: computed
        description: "Total value removed from the pooled plan on settlement, equal to gross_account_balance_cents. Null until SETTLED."
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant the pooled plan provider approved the exit. Null while REQUESTED."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement. Null until SETTLED."
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: "Reason captured when a settled transfer is unwound. Null unless status == REVERSED."
        default: null

  - name: FeeDisclosure
    parent: null
    common_fields: false
    fields:
      - name: plan_document_id
        type: string
        source: input
        description: "FK -> PlanDocument.id; the plan whose fees are disclosed. Immutable event row: no version field and no update endpoint."
      - name: disclosure_period_start
        type: string
        source: input
        description: "First calendar date of the disclosure period."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: disclosure_period_end
        type: string
        source: input
        description: "Last calendar date of the disclosure period; must be >= disclosure_period_start."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: allocation_method
        type: enum
        source: input
        description: "Whether the revenue sharing pool is allocated in proportion to employer account balances or evenly per participant."
        constraints: "PRO_RATA_ASSETS | PER_CAPITA"
      - name: revenue_sharing_pool_cents
        type: integer
        source: input
        description: "Indirect compensation received from investment providers that must be allocated back to employers, in cents."
        constraints: ">= 0"
      - name: gross_direct_fees_cents
        type: integer
        source: computed
        description: "Sum over the plan's ServiceProvider rows of direct_fee_cents_per_participant multiplied by PlanDocument.participant_count."
      - name: expense_rebate_pct
        type: number
        source: computed
        description: "Tiered rebate percentage applied to gross_direct_fees_cents from the net_plan_expense calculation."
        constraints: "two decimal places"
      - name: revenue_sharing_offset_cents
        type: integer
        source: computed
        description: "revenue_sharing_pool_cents applied as an offset against the rebated direct fees, capped at the rebated amount."
      - name: net_plan_expense_cents
        type: integer
        source: computed
        description: "Final plan-level expense after rebate and revenue-sharing offset, from the net_plan_expense calculation."
      - name: total_revenue_sharing_allocated_cents
        type: integer
        source: computed
        description: "Sum of credit_cents across allocation_lines; always equals revenue_sharing_pool_cents when at least one employer is eligible, else 0."
      - name: residual_cents_distributed
        type: integer
        source: computed
        description: "Number of leftover cents handed out by the largest-remainder step."
      - name: allocation_lines
        type: array
        source: computed
        description: "One entry per eligible employer, ordered by credit_cents descending, tie-broken by the named employer's created_at ascending. Each entry is { adopting_employer_id, basis_amount, basis_share_pct, credit_cents, residual_awarded }."
      - name: eligible_employer_count
        type: integer
        source: computed
        description: "Count of the plan's employers with adoption_status IN {ACTIVE, SUSPENDED} used as the allocation basis population."
      - name: disclosed_at
        type: datetime
        source: system
        description: "Logical-clock instant the disclosure was issued."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: PooledPlanProvider
    initial_state: PENDING_REGISTRATION
    terminal_states: [REGISTERED]
    transitions:
      - from: PENDING_REGISTRATION
        to: REGISTERED
        trigger: "POST /pep/plan-providers/{id}/register"
        actor: RegulatorOps
        preconditions:
          - "fidelity_bond_amount_cents >= 100000 (ERISA 412 statutory floor)"
          - "registration_effective_date is not earlier than the logical-clock calendar date"
        side_effects:
          - "mints registration_number as PPP-NNNN using the 1-based approval ordinal in ascending approval order"
          - "sets registration_effective_date from the request and registered_at from the logical clock"
          - "increments PooledPlanProvider.version by 1"

  - entity: PlanDocument
    initial_state: DRAFT
    terminal_states: [ACTIVE]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pep/plan-documents/{id}/activate"
        actor: PooledPlanProvider
        preconditions:
          - "the sponsoring PooledPlanProvider.registration_status == REGISTERED"
          - "an ALLOCATED FiduciaryRoleAllocation with fiduciary_role == NAMED_FIDUCIARY_3_16 exists for this plan and has acknowledged_at set"
          - "an ALLOCATED FiduciaryRoleAllocation with fiduciary_role == TRUSTEE_403A exists for this plan and has acknowledged_at set"
        side_effects:
          - "sets effective_date to the logical-clock calendar date"
          - "increments PlanDocument.version by 1"
        note: "Guarded transition: the gate lives on sibling entities (provider registration + two acknowledged fiduciary allocations), not on the plan document itself."

  - entity: FiduciaryRoleAllocation
    initial_state: ALLOCATED
    terminal_states: [REVOKED]
    transitions:
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /pep/fiduciary-role-allocations/{id}/acknowledge"
        actor: ServiceProvider
        preconditions:
          - "acknowledged_at is null (a second acknowledgment is rejected as already acknowledged)"
          - "the acting X-User-ID equals this allocation's service_provider_id"
        side_effects:
          - "sets acknowledged_at from the logical clock and acknowledgment_statement from the request"
          - "increments FiduciaryRoleAllocation.version by 1"
        note: "Self-transition: acknowledgment is a required attribute of an ALLOCATED role, not a separate status."
      - from: ALLOCATED
        to: REVOKED
        trigger: "system event: a later POST /pep/fiduciary-role-allocations succeeds for the same (plan_document_id, fiduciary_role)"
        actor: system
        preconditions:
          - "the new allocation's effective_from is strictly later than this allocation's effective_from"
        side_effects:
          - "sets revoked_at from the logical clock and revoked_reason = SUPERSEDED_BY_NEW_ALLOCATION"
          - "recomputes ServiceProvider.holds_fiduciary_role for the outgoing provider"
          - "increments FiduciaryRoleAllocation.version by 1"

  - entity: AdoptingEmployer
    initial_state: APPLIED
    terminal_states: [EXITED]
    transitions:
      - from: APPLIED
        to: ELECTIONS_SUBMITTED
        trigger: "POST /pep/plan-design-elections/{id}/submit"
        actor: AdoptingEmployer
        preconditions:
          - "the submitted election belongs to this employer and is in status DRAFT"
        side_effects:
          - "increments AdoptingEmployer.version by 1"
      - from: RETURNED_FOR_REVISION
        to: ELECTIONS_SUBMITTED
        trigger: "POST /pep/plan-design-elections/{id}/submit"
        actor: AdoptingEmployer
        preconditions:
          - "the submitted election belongs to this employer and is in status RETURNED"
        side_effects:
          - "increments AdoptingEmployer.version by 1"
        note: "Cycle edge: ELECTIONS_SUBMITTED -> RETURNED_FOR_REVISION -> ELECTIONS_SUBMITTED may repeat without bound; election_sequence does not advance on resubmission."
      - from: ELECTIONS_SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /pep/plan-design-elections/{id}/return"
        actor: PooledPlanProvider
        preconditions:
          - "the election is in status SUBMITTED"
        side_effects:
          - "sets the election's return_reason and deficiency_code"
          - "increments AdoptingEmployer.version by 1"
      - from: ELECTIONS_SUBMITTED
        to: APPLIED
        trigger: "POST /pep/plan-design-elections (a replacement election supersedes the in-flight one)"
        actor: AdoptingEmployer
        preconditions:
          - "the employer has an election in status IN {DRAFT, SUBMITTED, RETURNED}"
        side_effects:
          - "supersedes the prior election (status -> SUPERSEDED)"
          - "increments AdoptingEmployer.version by 1"
        note: "Reset edge: because the in-flight election no longer exists, the employer returns to APPLIED and must submit again."
      - from: RETURNED_FOR_REVISION
        to: APPLIED
        trigger: "POST /pep/plan-design-elections (a replacement election supersedes the returned one)"
        actor: AdoptingEmployer
        preconditions:
          - "the employer has an election in status IN {DRAFT, SUBMITTED, RETURNED}"
        side_effects:
          - "supersedes the prior election (status -> SUPERSEDED)"
          - "increments AdoptingEmployer.version by 1"
      - from: ELECTIONS_SUBMITTED
        to: ACTIVE
        trigger: "POST /pep/plan-design-elections/{id}/approve"
        actor: PooledPlanProvider
        preconditions:
          - "the election is in status SUBMITTED"
          - "the plan document status == ACTIVE"
        side_effects:
          - "sets effective_adoption_date to the logical-clock calendar date"
          - "recomputes PlanDocument.active_employer_count"
          - "increments AdoptingEmployer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: POST /pep/remittance-deposits/{id}/post evaluates the deposit as LATE"
        actor: system
        preconditions:
          - "the posted deposit's payroll batch belongs to this employer"
        side_effects:
          - "sets contribution_hold = true and increments open_correction_count"
          - "recomputes PlanDocument.active_employer_count, suspended_employer_count and compliance_posture"
          - "increments AdoptingEmployer.version by 1"
        note: "Cascade level 2 of the late-deposit chain."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: POST /pep/remittance-deposits/{id}/fund-correction leaves this employer with open_correction_count == 0"
        actor: system
        preconditions:
          - "no other deposit of this employer has deposit_status == POSTED and timeliness_status IN {LATE, CORRECTION_COMPUTED}"
        side_effects:
          - "sets contribution_hold = false"
          - "recomputes PlanDocument.active_employer_count, suspended_employer_count and compliance_posture"
          - "increments AdoptingEmployer.version by 1"
      - from: ACTIVE
        to: EXIT_REQUESTED
        trigger: "POST /pep/exit-transfers"
        actor: AdoptingEmployer
        preconditions:
          - "adoption_status == ACTIVE (a SUSPENDED employer may not request an exit)"
          - "the employer has no RemittanceDeposit with deposit_status == POSTED and timeliness_status IN {LATE, CORRECTION_COMPUTED}"
        side_effects:
          - "increments AdoptingEmployer.version by 1"
      - from: EXIT_REQUESTED
        to: SPINOFF_IN_PROGRESS
        trigger: "POST /pep/exit-transfers/{id}/approve"
        actor: PooledPlanProvider
        preconditions:
          - "the exit transfer is in status REQUESTED"
        side_effects:
          - "increments AdoptingEmployer.version by 1"
        note: "SPINOFF_IN_PROGRESS is the asset-movement phase for every exit_type, not only SPINOFF_TO_SINGLE_PLAN; the blackout window is in force while the employer sits here."
      - from: SPINOFF_IN_PROGRESS
        to: EXITED
        trigger: "POST /pep/exit-transfers/{id}/settle"
        actor: PooledPlanProvider
        preconditions:
          - "the exit transfer is in status APPROVED"
          - "the logical-clock calendar date is strictly after blackout_end_date"
        side_effects:
          - "sets exited_at from the logical clock and zeroes account_balance_cents"
          - "supersedes the employer's APPROVED PlanDesignElection (status -> SUPERSEDED)"
          - "closes the employer's EMPLOYER_LEVEL ComplianceTest rows (status -> CLOSED, closed_reason = EMPLOYER_EXITED)"
          - "recomputes PlanDocument.participant_count, transferred_out_participant_count, active_employer_count, audit_required, total_assets_cents, transferred_out_cents and expense_recovered_cents"
          - "increments AdoptingEmployer.version by 1"
        note: "Cascade level 1 of the exit chain; drives the depth-3 transitive cascade in §1.8."
      - from: EXITED
        to: SPINOFF_IN_PROGRESS
        trigger: "POST /pep/exit-transfers/{id}/reverse"
        actor: PooledPlanProvider
        preconditions:
          - "the exit transfer is in status SETTLED"
          - "no PlanFiling of this plan has filing_status == FILED for the plan year containing settled_at"
        side_effects:
          - "restores account_balance_cents to the pre-settlement gross, clears exited_at"
          - "reverses every ledger side effect of settlement on PlanDocument with no drift"
          - "increments AdoptingEmployer.version by 1"
        note: "Compensation edge: the only way out of EXITED; the terminal state is escaped exclusively by explicitly unwinding the settlement that produced it."

  - entity: PlanDesignElection
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pep/plan-design-elections/{id}/submit"
        actor: AdoptingEmployer
        preconditions:
          - "the logical-clock calendar date is on or before AdoptingEmployer.election_window_close_date"
          - "when match_formula_code == DISCRETIONARY_TIERED, all four tier fields are non-null"
        side_effects:
          - "sets signatory_name from the request"
          - "advances the employer to ELECTIONS_SUBMITTED"
          - "increments PlanDesignElection.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /pep/plan-design-elections/{id}/return"
        actor: PooledPlanProvider
        preconditions:
          - "the election is in status SUBMITTED"
        side_effects:
          - "sets return_reason and deficiency_code from the request"
          - "advances the employer to RETURNED_FOR_REVISION"
          - "increments PlanDesignElection.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /pep/plan-design-elections/{id}/submit"
        actor: AdoptingEmployer
        preconditions:
          - "the logical-clock calendar date is on or before AdoptingEmployer.election_window_close_date"
        side_effects:
          - "clears return_reason and deficiency_code"
          - "advances the employer to ELECTIONS_SUBMITTED"
          - "increments PlanDesignElection.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pep/plan-design-elections/{id}/approve"
        actor: PooledPlanProvider
        preconditions:
          - "eligibility_min_age <= PlanDocument.base_eligibility_min_age"
          - "eligibility_service_months <= PlanDocument.base_eligibility_service_months"
          - "the vesting generosity rank of vesting_schedule is <= the plan base rank (IMMEDIATE=0, GRADED_2_6=1, CLIFF_3YR=2)"
          - "the plan document status == ACTIVE"
        side_effects:
          - "sets approved_at from the logical clock"
          - "advances the employer to ACTIVE and sets effective_adoption_date"
          - "increments PlanDesignElection.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /pep/plan-design-elections creates a replacement election for the same employer"
        actor: system
        preconditions: []
        side_effects:
          - "resets the employer to APPLIED when it was in ELECTIONS_SUBMITTED or RETURNED_FOR_REVISION"
          - "increments PlanDesignElection.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system event: POST /pep/plan-design-elections creates a replacement election for the same employer"
        actor: system
        preconditions: []
        side_effects:
          - "resets the employer to APPLIED"
          - "increments PlanDesignElection.version by 1"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system event: POST /pep/plan-design-elections creates a replacement election for the same employer"
        actor: system
        preconditions: []
        side_effects:
          - "resets the employer to APPLIED"
          - "increments PlanDesignElection.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: POST /pep/exit-transfers/{id}/settle settles this employer's exit"
        actor: system
        preconditions: []
        side_effects:
          - "increments PlanDesignElection.version by 1"
        note: "An APPROVED election is never superseded by a new election — election creation is rejected once the employer is ACTIVE — so this is the only edge into SUPERSEDED from APPROVED."

  - entity: PayrollBatch
    initial_state: RECEIVED
    terminal_states: []
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /pep/payroll-batches/{id}/validate"
        actor: ServiceProvider
        preconditions:
          - "total_match_cents equals the computed expected_match_cents"
          - "participant_line_count >= 1"
          - "the acting service provider has provider_type == RECORDKEEPER on this plan"
        side_effects:
          - "sets validated_at and reconciliation_note"
          - "recomputes AdoptingEmployer.contribution_receivable_cents"
          - "recomputes PlanDocument.total_validated_contributions_cents, aggregate_receivable_cents and contribution_control_delta_cents"
          - "increments PayrollBatch.version by 1"
      - from: VALIDATED
        to: REMITTED
        trigger: "system event: POST /pep/remittance-deposits/{id}/post posts a deposit for this batch"
        actor: system
        preconditions:
          - "the deposit amount_cents equals batch_total_cents"
        side_effects:
          - "recomputes AdoptingEmployer.contribution_receivable_cents and account_balance_cents"
          - "recomputes PlanDocument.aggregate_receivable_cents, total_assets_cents and contribution_control_delta_cents"
          - "increments PayrollBatch.version by 1"
      - from: REMITTED
        to: VALIDATED
        trigger: "system event: POST /pep/remittance-deposits/{id}/reverse reverses the posted deposit"
        actor: system
        preconditions:
          - "the deposit's timeliness_status is not IN {CORRECTION_COMPUTED, CORRECTED}"
        side_effects:
          - "restores AdoptingEmployer.contribution_receivable_cents and reduces account_balance_cents by the reversed amount"
          - "recomputes PlanDocument.aggregate_receivable_cents, total_assets_cents and contribution_control_delta_cents"
          - "increments PayrollBatch.version by 1"
        note: "Compensation edge: reversal restores the pre-posting ledger exactly, so contribution_control_delta_cents returns to 0."

  - entity: RemittanceDeposit
    dimension: deposit_status
    state_field: deposit_status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /pep/remittance-deposits/{id}/post"
        actor: ServiceProvider
        preconditions:
          - "the parent PayrollBatch.status == VALIDATED"
          - "amount_cents equals PayrollBatch.batch_total_cents"
        side_effects:
          - "sets posted_at and posting_reference"
          - "computes business_days_elapsed and late_by_business_days"
          - "advances timeliness_status to TIMELY or LATE (independent dimension)"
          - "advances the PayrollBatch to REMITTED"
          - "increments RemittanceDeposit.version by 1"
      - from: POSTED
        to: REVERSED
        trigger: "POST /pep/remittance-deposits/{id}/reverse"
        actor: ServiceProvider
        preconditions:
          - "timeliness_status is not IN {CORRECTION_COMPUTED, CORRECTED}"
        side_effects:
          - "sets reversal_reason and resets timeliness_status to UNDETERMINED"
          - "clears business_days_elapsed and late_by_business_days"
          - "reverts the PayrollBatch to VALIDATED"
          - "when the deposit was LATE, decrements AdoptingEmployer.open_correction_count and may return the employer to ACTIVE"
          - "increments RemittanceDeposit.version by 1"
    note: "Dimension 1 of a parallel state machine: settlement. Advances only on recordkeeper action and is independent of the compliance dimension below."

  - entity: RemittanceDeposit
    dimension: timeliness_status
    state_field: timeliness_status
    initial_state: UNDETERMINED
    terminal_states: [CORRECTED]
    transitions:
      - from: UNDETERMINED
        to: TIMELY
        trigger: "system event: POST /pep/remittance-deposits/{id}/post with deposit_date <= PayrollBatch.deposit_due_date"
        actor: system
        preconditions:
          - "deposit_status is advancing to POSTED"
        side_effects:
          - "sets late_by_business_days = 0"
      - from: UNDETERMINED
        to: LATE
        trigger: "system event: POST /pep/remittance-deposits/{id}/post with deposit_date > PayrollBatch.deposit_due_date"
        actor: system
        preconditions:
          - "deposit_status is advancing to POSTED"
        side_effects:
          - "sets late_by_business_days from the business_days_elapsed rule"
          - "suspends the AdoptingEmployer and sets contribution_hold = true"
          - "recomputes PlanDocument.suspended_employer_count and compliance_posture"
          - "adds amount_cents to any non-FILED PlanFiling's late_deposit_schedule_h_line_cents for the plan"
          - "reverts a READY_TO_FILE PlanFiling of the plan and clears its employer-data certification"
        note: "Cascade level 1 of the depth-4 late-deposit chain in §1.8."
      - from: LATE
        to: CORRECTION_COMPUTED
        trigger: "POST /pep/remittance-deposits/{id}/compute-correction"
        actor: ServiceProvider
        preconditions:
          - "deposit_status == POSTED"
          - "recovery_date is on or after deposit_date"
        side_effects:
          - "sets correction_method, recovery_date and actual_investment_return_cents from the request"
          - "computes lost_earnings_cents under the selected variant, restoration_cents and excise_tax_cents"
        note: "Dual-variant entry point: VFCP_RECOVERY_DATE and IRS_6621_UNDERPAYMENT produce different lost_earnings_cents for identical inputs."
      - from: CORRECTION_COMPUTED
        to: CORRECTED
        trigger: "POST /pep/remittance-deposits/{id}/fund-correction"
        actor: AdoptingEmployer
        preconditions:
          - "restoration_cents is non-null"
          - "form_5330_reference is supplied when excise_tax_cents > 0"
        side_effects:
          - "sets funded_at and form_5330_reference"
          - "adds restoration_cents to AdoptingEmployer.account_balance_cents"
          - "decrements AdoptingEmployer.open_correction_count and returns the employer to ACTIVE when it reaches 0"
          - "recomputes PlanDocument.total_corrections_funded_cents, total_assets_cents and contribution_control_delta_cents"
      - from: TIMELY
        to: UNDETERMINED
        trigger: "system event: POST /pep/remittance-deposits/{id}/reverse"
        actor: system
        preconditions:
          - "deposit_status is advancing to REVERSED"
        side_effects:
          - "clears business_days_elapsed and late_by_business_days"
      - from: LATE
        to: UNDETERMINED
        trigger: "system event: POST /pep/remittance-deposits/{id}/reverse"
        actor: system
        preconditions:
          - "deposit_status is advancing to REVERSED"
        side_effects:
          - "unwinds the suspension cascade: decrements AdoptingEmployer.open_correction_count and returns the employer to ACTIVE when it reaches 0"
          - "recomputes PlanDocument.suspended_employer_count and compliance_posture"
    note: "Dimension 2 of the parallel state machine: compliance. A deposit can be (POSTED, LATE), (POSTED, CORRECTED) or (REVERSED, UNDETERMINED); the two dimensions are advanced by different actors on different triggers."

  - entity: ComplianceTest
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /pep/compliance-tests/{id}/run"
        actor: ServiceProvider
        preconditions:
          - "the plan document status == ACTIVE"
          - "the tested population has at least one employer with adoption_status IN {ACTIVE, SUSPENDED}"
          - "for COVERAGE_410B_RATIO, ratio_pct >= 70.00; for ADP/ACP, exemption_applied is true or hce_avg_deferral_pct <= adp_limit_pct"
        side_effects:
          - "sets run_at and all computed population and percentage fields"
          - "increments ComplianceTest.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /pep/compliance-tests/{id}/run"
        actor: ServiceProvider
        preconditions:
          - "the plan document status == ACTIVE"
          - "for COVERAGE_410B_RATIO, ratio_pct < 70.00; for ADP/ACP, exemption_applied is false and hce_avg_deferral_pct > adp_limit_pct"
        side_effects:
          - "sets run_at, the computed fields and failure_reason"
          - "increments ComplianceTest.version by 1"
      - from: SCHEDULED
        to: CLOSED
        trigger: "system event: POST /pep/exit-transfers/{id}/settle settles the tested employer's exit"
        actor: system
        preconditions:
          - "scope == EMPLOYER_LEVEL and adopting_employer_id is the exiting employer"
        side_effects:
          - "sets closed_reason = EMPLOYER_EXITED"
          - "increments ComplianceTest.version by 1"
      - from: FAILED
        to: CLOSED
        trigger: "system event: POST /pep/exit-transfers/{id}/settle settles the tested employer's exit"
        actor: system
        preconditions:
          - "scope == EMPLOYER_LEVEL and adopting_employer_id is the exiting employer"
        side_effects:
          - "sets closed_reason = EMPLOYER_EXITED"
          - "increments ComplianceTest.version by 1"
      - from: PASSED
        to: CLOSED
        trigger: "system event: POST /pep/exit-transfers/{id}/settle settles the tested employer's exit"
        actor: system
        preconditions:
          - "scope == EMPLOYER_LEVEL and adopting_employer_id is the exiting employer"
        side_effects:
          - "sets closed_reason = EMPLOYER_EXITED"
          - "increments ComplianceTest.version by 1"
        note: "Cascade level 2 of the exit chain; PLAN_LEVEL tests are never closed by an individual exit."

  - entity: PlanFiling
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /pep/plan-filings/{id}/prepare"
        actor: ServiceProvider
        preconditions:
          - "the acting ServiceProvider is engaged on this plan"
          - "the plan document status == ACTIVE"
          - "PlanDocument.compliance_posture != FROZEN"
          - "no ComplianceTest of this plan with scope == PLAN_LEVEL is in status SCHEDULED for plan_year"
        side_effects:
          - "sets prepared_by_user_id from X-User-ID and prepared_at from the logical clock"
          - "computes late_deposit_schedule_h_line_cents, fidelity_bond_minimum_cents, audit_required and filing_deadline_date"
          - "increments PlanFiling.version by 1"
        note: "Fork point: PREPARED forks into an audit branch (attest) and an employer-data branch (certify-employer-data)."
      - from: PREPARED
        to: PARTIALLY_CLEARED
        trigger: "POST /pep/plan-filings/{id}/attest"
        actor: IndependentAuditor
        preconditions:
          - "audit_required == true"
          - "employer_data_certified_at is null"
          - "the named AUDITOR_FIRM holds no ALLOCATED FiduciaryRoleAllocation on this plan and is not affiliated with a provider that does"
          - "audit_firm_service_provider_id != prepared_by_user_id (segregation of duties: the firm that prepared the return may not audit it)"
          - "the plan's fidelity bond satisfies fidelity_bond_minimum_cents"
        side_effects:
          - "sets audit_attested_at, audit_opinion and audit_firm_service_provider_id"
          - "increments PlanFiling.version by 1"
      - from: PREPARED
        to: PARTIALLY_CLEARED
        trigger: "POST /pep/plan-filings/{id}/certify-employer-data"
        actor: PooledPlanProvider
        preconditions:
          - "audit_required == true"
          - "audit_attested_at is null"
          - "every employer of the plan whose adoption_status is not EXITED has an APPROVED PlanDesignElection"
        side_effects:
          - "sets employer_data_certified_at, certified_by_user_id and certified_employer_count"
          - "increments PlanFiling.version by 1"
      - from: PREPARED
        to: READY_TO_FILE
        trigger: "POST /pep/plan-filings/{id}/certify-employer-data"
        actor: PooledPlanProvider
        preconditions:
          - "audit_required == false (the audit branch is pre-cleared, so the join completes on this single branch)"
        side_effects:
          - "sets employer_data_certified_at, certified_by_user_id and certified_employer_count"
          - "increments PlanFiling.version by 1"
        note: "Conditional join: when the plan is under the 1000-participant audit threshold the fork degenerates to one branch."
      - from: PARTIALLY_CLEARED
        to: READY_TO_FILE
        trigger: "POST /pep/plan-filings/{id}/attest"
        actor: IndependentAuditor
        preconditions:
          - "employer_data_certified_at is not null"
          - "audit_attested_at is null"
        side_effects:
          - "sets audit_attested_at, audit_opinion and audit_firm_service_provider_id"
          - "increments PlanFiling.version by 1"
      - from: PARTIALLY_CLEARED
        to: READY_TO_FILE
        trigger: "POST /pep/plan-filings/{id}/certify-employer-data"
        actor: PooledPlanProvider
        preconditions:
          - "audit_attested_at is not null"
          - "employer_data_certified_at is null"
        side_effects:
          - "sets employer_data_certified_at, certified_by_user_id and certified_employer_count"
          - "increments PlanFiling.version by 1"
      - from: READY_TO_FILE
        to: FILED
        trigger: "POST /pep/plan-filings/{id}/file"
        actor: RegulatorOps
        preconditions:
          - "PlanDocument.compliance_posture != FROZEN"
          - "audit_opinion != DISCLAIMER when audit_required == true"
        side_effects:
          - "sets filed_date from the logical clock, is_late_filing and acknowledgment_reference"
          - "increments PlanFiling.version by 1"
      - from: READY_TO_FILE
        to: PREPARED
        trigger: "system event: a RemittanceDeposit of this plan posts with timeliness_status == LATE"
        actor: system
        preconditions:
          - "audit_required == false"
        side_effects:
          - "clears employer_data_certified_at, certified_by_user_id and certified_employer_count"
          - "increases late_deposit_schedule_h_line_cents by the late deposit's amount_cents"
          - "increments PlanFiling.version by 1"
        note: "Cascade level 4 of the late-deposit chain: a compliance event on a grandchild entity revokes a completed join branch."
      - from: READY_TO_FILE
        to: PARTIALLY_CLEARED
        trigger: "system event: a RemittanceDeposit of this plan posts with timeliness_status == LATE"
        actor: system
        preconditions:
          - "audit_required == true (the audit branch stays cleared; only the employer-data branch reopens)"
        side_effects:
          - "clears employer_data_certified_at, certified_by_user_id and certified_employer_count"
          - "increases late_deposit_schedule_h_line_cents by the late deposit's amount_cents"
          - "increments PlanFiling.version by 1"

  - entity: ExitTransfer
    initial_state: REQUESTED
    terminal_states: [REVERSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pep/exit-transfers/{id}/approve"
        actor: PooledPlanProvider
        preconditions:
          - "PlanDocument.compliance_posture != FROZEN"
          - "the blackout window does not overlap, nor sit within 5 calendar days of, any other non-REVERSED ExitTransfer blackout window on the same plan"
        side_effects:
          - "sets approved_at from the logical clock"
          - "advances the AdoptingEmployer to SPINOFF_IN_PROGRESS"
          - "increments ExitTransfer.version by 1"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /pep/exit-transfers/{id}/settle"
        actor: PooledPlanProvider
        preconditions:
          - "the logical-clock calendar date is strictly after blackout_end_date"
          - "the employer has no RemittanceDeposit with deposit_status == POSTED and timeliness_status IN {LATE, CORRECTION_COMPUTED}"
          - "the employer has no PayrollBatch in status VALIDATED awaiting remittance"
        side_effects:
          - "captures transferred_participant_count and gross_account_balance_cents"
          - "runs the exit_settlement_waterfall to set admin_recovery_cents, flat_exit_fee_cents, deductions_applied_cents, unrecovered_deduction_cents, transfer_amount_cents and settled_amount_cents"
          - "advances the AdoptingEmployer to EXITED and zeroes its balance"
          - "increments ExitTransfer.version by 1"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /pep/exit-transfers/{id}/reverse"
        actor: PooledPlanProvider
        preconditions:
          - "no PlanFiling of the plan is FILED for the plan year containing settled_at"
        side_effects:
          - "sets reversal_reason"
          - "returns the AdoptingEmployer to SPINOFF_IN_PROGRESS and restores its balance"
          - "recomputes every PlanDocument control total so headcount_control_delta and contribution_control_delta_cents both return to 0"
          - "increments ExitTransfer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: design-election-create-stale-employer
    parent_entity: AdoptingEmployer
    write_endpoint: "POST /pep/plan-design-elections"
    occ_field: "expected_adopting_employer_version"
    description: |
      Creating a PlanDesignElection against an AdoptingEmployer whose version has
      advanced since the client last read it is rejected. A replacement election
      legitimately supersedes the employer's prior in-flight election and resets the
      employer to APPLIED, so a writer holding a stale view of the employer would
      silently discard election content it never saw. The stale version is the only
      observable signal that the view is out of date.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412

  - rule_id: fiduciary-allocation-create-stale-plan
    parent_entity: PlanDocument
    write_endpoint: "POST /pep/fiduciary-role-allocations"
    occ_field: "expected_plan_document_version"
    description: |
      Creating a FiduciaryRoleAllocation against a PlanDocument whose version has
      advanced since the client last read it is rejected. A new allocation for the same
      fiduciary_role legitimately revokes the incumbent holder, so a writer working from
      a stale plan view would displace a role holder it never observed.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: business_days_elapsed
    trigger: "on POST /pep/remittance-deposits/{id}/post, and as a shared primitive of deposit_due_date"
    algorithm: chronological
    formula: |
      is_business_day(d) := d.weekday NOT IN {Saturday, Sunday} AND d NOT IN FEDERAL_HOLIDAYS
      business_days_elapsed(from_date, to_date) :=
        count of dates d with from_date < d <= to_date AND is_business_day(d)
      # Half-open on the left, closed on the right: the withholding date itself never counts,
      # the deposit date always counts when it is a business day.
      nth_business_day_after(start, n) := the n-th date d > start with is_business_day(d)
      nth_business_day_of_month(year, month, n) := the n-th date d in that calendar month
                                                   with is_business_day(d)
    input_set: "PayrollBatch.withholding_date and RemittanceDeposit.deposit_date of the deposit being posted."
    constants:
      FEDERAL_HOLIDAYS_2025: ["2025-01-01", "2025-01-20", "2025-02-17", "2025-05-26", "2025-06-19", "2025-07-04", "2025-09-01", "2025-10-13", "2025-11-11", "2025-11-27", "2025-12-25"]
      FEDERAL_HOLIDAYS_2026: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-05-25", "2026-06-19", "2026-07-03", "2026-09-07", "2026-10-12", "2026-11-11", "2026-11-26", "2026-12-25"]
      FEDERAL_HOLIDAYS_2027: ["2027-01-01", "2027-01-18", "2027-02-15", "2027-05-31", "2027-06-18", "2027-07-05", "2027-09-06", "2027-10-11", "2027-11-11", "2027-11-25", "2027-12-24"]
    precision: "integer count of days; no rounding"

  - name: deposit_due_date
    trigger: "on POST /pep/payroll-batches (stored on the batch at creation, never recomputed afterwards)"
    algorithm: threshold
    formula: |
      deposit_rule := SMALL_PLAN_7_BUSINESS_DAY
                        if AdoptingEmployer.is_small_plan at batch creation
                      else GENERAL_15TH_BUSINESS_DAY

      if deposit_rule == SMALL_PLAN_7_BUSINESS_DAY:
          deposit_due_date := nth_business_day_after(withholding_date, 7)
      else:
          m := the calendar month immediately following the month of withholding_date
          deposit_due_date := nth_business_day_of_month(m.year, m.month, 15)
      # Worked example (safe harbour): withholding_date 2026-08-03 -> 2026-08-12.
      # Worked example (general rule): withholding_date 2026-06-15 -> 2026-07-22.
    input_set: "The AdoptingEmployer's is_small_plan flag (derived from participant_count < 100) evaluated at the moment the batch is created; later census changes do not move an existing batch's due date."
    constants:
      SMALL_PLAN_PARTICIPANT_THRESHOLD: 100
      SAFE_HARBOR_BUSINESS_DAYS: 7
      GENERAL_RULE_BUSINESS_DAY_OF_MONTH: 15
    precision: "calendar date, no rounding"

  - name: employer_match_amount
    trigger: "on POST /pep/payroll-batches, to produce expected_match_cents which the submitted total_match_cents must equal"
    algorithm: tiered_pricing
    formula: |
      e   := the AdoptingEmployer's PlanDesignElection with status == APPROVED
      C   := total_eligible_compensation_cents
      D   := total_deferral_cents

      if e.match_formula_code == SAFE_HARBOR_BASIC:
          t1 := round_half_up( min(D, C * 0.03) )
          t2 := round_half_up( 0.50 * max(0, min(D, C * 0.05) - C * 0.03) )
          raw := t1 + t2
      elif e.match_formula_code == SAFE_HARBOR_ENHANCED:
          raw := round_half_up( min(D, C * 0.04) )
      elif e.match_formula_code == DISCRETIONARY_TIERED:
          t1 := round_half_up( (e.match_tier_1_pct/100) * min(D, C * e.match_tier_1_limit_pct/100) )
          t2 := round_half_up( (e.match_tier_2_pct/100) *
                               max(0, min(D, C * e.match_tier_2_limit_pct/100)
                                        - C * e.match_tier_1_limit_pct/100) )
          raw := t1 + t2
      else:                        # NONE
          raw := 0

      cap := round_half_up( C * PLAN_MATCH_CAP_PCT / 100 )
      expected_match_cents := min(raw, cap)

      # Evaluation order is pinned: round EACH tier to whole cents, THEN sum, THEN apply the
      # plan-wide cap. Summing unrounded tiers, or capping before rounding, gives different
      # answers on the cent.
      # Worked example, C = 100000000, D = 4500000:
      #   SAFE_HARBOR_BASIC      -> 3000000 + 750000 = 3750000
      #   SAFE_HARBOR_ENHANCED   -> 4000000
      #   DISCRETIONARY_TIERED (100%/3.0%, 25%/6.0%) -> 3000000 + 375000 = 3375000
      #   NONE                   -> 0
    input_set: "Exactly one PlanDesignElection per employer may be APPROVED; SUPERSEDED, DRAFT, SUBMITTED and RETURNED elections are never used for match computation."
    constants:
      PLAN_MATCH_CAP_PCT: 6.0
      SAFE_HARBOR_BASIC_TIER_1: "100% of deferrals up to 3.0% of compensation"
      SAFE_HARBOR_BASIC_TIER_2: "50% of deferrals from 3.0% to 5.0% of compensation"
      SAFE_HARBOR_ENHANCED_TIER_1: "100% of deferrals up to 4.0% of compensation"
    precision: "integer cents, round_half_up per tier before summation"

  - name: lost_earnings
    trigger: "on POST /pep/remittance-deposits/{id}/compute-correction"
    algorithm: chronological
    formula: |
      P   := RemittanceDeposit.amount_cents            # the delinquent principal
      due := PayrollBatch.deposit_due_date
      rate_for(quarter) := IRS_6621_ANNUAL_RATE_PCT[quarter]

      # ---- variant IRS_6621_UNDERPAYMENT -------------------------------------
      days := deposit_date - due                        # simple calendar-day count
      r    := rate_for(the calendar quarter containing deposit_date)
      lost_earnings_cents := round_half_up( P * r/100 * days / 365 )

      # ---- variant VFCP_RECOVERY_DATE ---------------------------------------
      period := [due + 1 day .. recovery_date]          # inclusive on both ends
      split period into calendar-quarter segments in chronological order
      for each segment s:
          seg_days   := number of dates in s
          seg_amount := round_half_up( P * rate_for(s.quarter)/100 * seg_days / 365 )
      lost_earnings_cents := sum of seg_amount over segments
      # Each segment is rounded to whole cents BEFORE summation, so rounding accumulates
      # across quarter boundaries; a single unsegmented computation gives a different answer.

      restoration_cents := max(lost_earnings_cents, actual_investment_return_cents)
    input_set: "One POSTED RemittanceDeposit with timeliness_status == LATE, its parent PayrollBatch's deposit_due_date, and the correction_method / recovery_date / actual_investment_return_cents supplied on the request."
    constants:
      IRS_6621_ANNUAL_RATE_PCT: { "2025Q1": 7.0, "2025Q2": 7.0, "2025Q3": 7.0, "2025Q4": 7.0, "2026Q1": 7.0, "2026Q2": 8.0, "2026Q3": 9.0, "2026Q4": 9.0, "2027Q1": 9.0, "2027Q2": 9.0, "2027Q3": 9.0, "2027Q4": 9.0 }
      DAY_COUNT_BASIS: 365
    precision: "integer cents, round_half_up per segment"
    variants:
      - name: IRS_6621_UNDERPAYMENT
        when: "correction_method == IRS_6621_UNDERPAYMENT — the employer self-corrects outside the DOL programme and owes interest only for the delinquency period."
        difference: "Ends at deposit_date (not recovery_date) and applies a single rate — the one for the quarter containing deposit_date — to the whole period, with no quarter segmentation. recovery_date is stored but does not enter the arithmetic."
      - name: VFCP_RECOVERY_DATE
        when: "correction_method == VFCP_RECOVERY_DATE — the employer corrects under the Voluntary Fiduciary Correction Program and must make the plan whole through the recovery date."
        difference: "Ends at recovery_date (which may be much later than deposit_date) and segments the period by calendar quarter, applying each quarter's own rate and rounding each segment independently. For P = 8500000, due = 2026-06-25, deposit_date = 2026-07-20, recovery_date = 2026-08-31 this variant yields 139260 against the other variant's 52397."

  - name: excise_tax_5330
    trigger: "on POST /pep/remittance-deposits/{id}/compute-correction, immediately after restoration_cents is known"
    algorithm: threshold
    formula: |
      if restoration_cents < EXCISE_TAX_DE_MINIMIS_CENTS:
          excise_tax_cents := 0
      else:
          excise_tax_cents := round_half_up( restoration_cents * EXCISE_TAX_RATE )
      # The de-minimis test is strictly less-than: restoration_cents == 10000 is taxable
      # (1500), restoration_cents == 9999 is not (0).
    input_set: "The restoration_cents just computed for this deposit."
    constants:
      EXCISE_TAX_RATE: 0.15
      EXCISE_TAX_DE_MINIMIS_CENTS: 10000
    precision: "integer cents, round_half_up"

  - name: coverage_ratio_percentage
    trigger: "on POST /pep/compliance-tests/{id}/run when test_type == COVERAGE_410B_RATIO"
    algorithm: aggregation
    formula: |
      population := the employers selected by the scope variant below
      H  := sum of participant-population hce_count  over population
      N  := sum of participant-population nhce_count over population
      BH := sum of benefiting_hce_count  over population
      BN := sum of benefiting_nhce_count over population

      hce_benefiting_pct  := round_half_up_2dp( BH * 100 / H )
      nhce_benefiting_pct := round_half_up_2dp( BN * 100 / N )
      ratio_pct           := round_half_up_2dp( nhce_benefiting_pct * 100 / hce_benefiting_pct )
      verdict             := PASSED if ratio_pct >= COVERAGE_RATIO_PASS_PCT else FAILED
      # Each percentage is rounded to two decimals BEFORE the ratio is taken; taking the ratio
      # of unrounded percentages gives a different last cent-of-a-percent.
    input_set: "Employers of the plan whose adoption_status IN {ACTIVE, SUSPENDED}; APPLIED, ELECTIONS_SUBMITTED, RETURNED_FOR_REVISION and EXITED employers are excluded from every population."
    constants:
      COVERAGE_RATIO_PASS_PCT: 70.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PLAN_LEVEL
        when: "scope == PLAN_LEVEL — the pooled plan is treated as a single plan and every adopting employer's census is aggregated."
        difference: "Population is every employer of the plan with adoption_status IN {ACTIVE, SUSPENDED}; adopting_employer_id must be null."
      - name: EMPLOYER_LEVEL
        when: "scope == EMPLOYER_LEVEL — the adopting employer is tested as if it maintained its own plan."
        difference: "Population is the single employer named by adopting_employer_id. Identical census data can pass at PLAN_LEVEL and fail at EMPLOYER_LEVEL: employers with (BH/H, BN/N) of (10/10, 90/100) and (10/10, 12/20) give 85.00 aggregated (PASSED) but 60.00 for the second employer alone (FAILED)."

  - name: adp_acp_limit
    trigger: "on POST /pep/compliance-tests/{id}/run when test_type IN {ADP, ACP}"
    algorithm: threshold
    formula: |
      population := the employers selected by the scope variant of coverage_ratio_percentage
      exemption_applied := true iff every employer in population has an APPROVED
                           PlanDesignElection with nondiscrimination_track == SAFE_HARBOR_EXEMPT
      if exemption_applied:
          verdict := PASSED ; hce_avg_deferral_pct := null ; adp_limit_pct := null
      else:
          nhce_avg_deferral_pct := round_half_up_2dp(
              sum(employer.nhce_avg_deferral_pct * employer.nhce_count) / sum(employer.nhce_count) )
          hce_avg_deferral_pct  := round_half_up_2dp(
              sum(employer.hce_avg_deferral_pct  * employer.hce_count)  / sum(employer.hce_count) )
          A := nhce_avg_deferral_pct
          if   A <= ADP_TIER_1_PCT: adp_limit_pct := round_half_up_2dp(A * ADP_TIER_1_MULTIPLIER)
          elif A <= ADP_TIER_2_PCT: adp_limit_pct := round_half_up_2dp(A + ADP_TIER_2_ADDEND)
          else:                     adp_limit_pct := round_half_up_2dp(A * ADP_TIER_3_MULTIPLIER)
          verdict := PASSED if hce_avg_deferral_pct <= adp_limit_pct else FAILED
      # Branch selection is observable even though the piecewise function is continuous:
      # A = 2.50 -> 4.50 (addend branch, not 5.00), A = 8.50 -> 10.63 (multiplier branch,
      # not 10.50). The pass test is inclusive: hce_avg == adp_limit_pct PASSES.
    input_set: "Headcount-weighted averages over the same population as coverage_ratio_percentage; an employer with nhce_count == 0 cannot appear because nhce_count >= 1 is enforced at census level."
    constants:
      ADP_TIER_1_PCT: 2.00
      ADP_TIER_1_MULTIPLIER: 2.00
      ADP_TIER_2_PCT: 8.00
      ADP_TIER_2_ADDEND: 2.00
      ADP_TIER_3_MULTIPLIER: 1.25
    precision: "2 decimal places, round_half_up"

  - name: revenue_sharing_allocation
    trigger: "on POST /pep/fee-disclosures"
    algorithm: waterfall_allocation
    formula: |
      eligible := employers of the plan with adoption_status IN {ACTIVE, SUSPENDED},
                  ordered by created_at ascending
      basis_i  := per the allocation_method variant below
      T        := sum of basis_i

      if T == 0:
          allocation_lines := [] ; total_revenue_sharing_allocated_cents := 0
          residual_cents_distributed := 0
      else:
          for each eligible employer i:
              raw_i   := revenue_sharing_pool_cents * basis_i / T
              floor_i := floor(raw_i)
              frac_i  := raw_i - floor_i
              basis_share_pct_i := round_half_up_2dp( basis_i * 100 / T )
          residual := revenue_sharing_pool_cents - sum(floor_i)
          rank the eligible employers by frac_i descending, tie-broken by created_at ascending
          award one extra cent to each of the first `residual` employers (residual_awarded = 1)
          credit_cents_i := floor_i + residual_awarded_i
          residual_cents_distributed := residual
          total_revenue_sharing_allocated_cents := sum(credit_cents_i)   # == pool, exactly
      each employer's revenue_sharing_credit_cents increases by its credit_cents
      # Worked example, pool 1000000, PER_CAPITA basis (13, 4):
      #   raw = 764705.88 / 235294.11 -> floors 764705 / 235294, residual 1 -> A wins the cent
      #   -> credits 764706 / 235294, residual_cents_distributed = 1
    input_set: "Only ACTIVE and SUSPENDED employers of the plan; EXITED employers receive no credit even when they held assets during the disclosure period."
    constants:
      RESIDUAL_TIE_BREAK: "largest fractional remainder, then created_at ascending (never id)"
    precision: "integer cents; basis_share_pct to 2 decimal places, round_half_up"
    variants:
      - name: PRO_RATA_ASSETS
        when: "allocation_method == PRO_RATA_ASSETS"
        difference: "basis_i := AdoptingEmployer.account_balance_cents. An employer with a zero balance receives a line with credit_cents 0, and when every eligible employer has a zero balance the pool is not allocated at all."
      - name: PER_CAPITA
        when: "allocation_method == PER_CAPITA"
        difference: "basis_i := AdoptingEmployer.participant_count. For balances (8500000, 0) and headcounts (13, 4) the same pool of 1000000 allocates (1000000, 0) under PRO_RATA_ASSETS but (764706, 235294) under PER_CAPITA."

  - name: net_plan_expense
    trigger: "on POST /pep/fee-disclosures, before revenue_sharing_allocation runs"
    algorithm: tiered_pricing
    formula: |
      gross_direct_fees_cents := PlanDocument.participant_count *
          sum(ServiceProvider.direct_fee_cents_per_participant over providers of the plan)

      if   gross_direct_fees_cents >= REBATE_TIER_2_FLOOR_CENTS: expense_rebate_pct := 5.0
      elif gross_direct_fees_cents >= REBATE_TIER_1_FLOOR_CENTS: expense_rebate_pct := 2.0
      else:                                                       expense_rebate_pct := 0.0

      rebate_cents            := round_half_up( gross_direct_fees_cents * expense_rebate_pct / 100 )
      rebated_cents           := gross_direct_fees_cents - rebate_cents
      revenue_sharing_offset_cents := min(revenue_sharing_pool_cents, rebated_cents)
      net_plan_expense_cents  := rebated_cents - revenue_sharing_offset_cents

      # Evaluation order is pinned and observable: tier selection reads the GROSS figure, the
      # rebate is applied next, and only then is the revenue-sharing pool offset. Offsetting
      # first would drop gross 1020000 to 20000, select the 0.0% tier and yield 20000 instead
      # of the correct 0.
    input_set: "Every ServiceProvider row whose plan_document_id is this plan, regardless of provider_type or whether it holds a fiduciary role."
    constants:
      REBATE_TIER_1_FLOOR_CENTS: 1000000
      REBATE_TIER_2_FLOOR_CENTS: 5000000
      REBATE_TIER_1_PCT: 2.0
      REBATE_TIER_2_PCT: 5.0
    precision: "integer cents, round_half_up; expense_rebate_pct to 1 decimal place"

  - name: exit_settlement_waterfall
    trigger: "on POST /pep/exit-transfers/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      gross_account_balance_cents := AdoptingEmployer.account_balance_cents
      transferred_participant_count := AdoptingEmployer.participant_count
      admin_recovery_cents := EXIT_ADMIN_FEE_CENTS_PER_PARTICIPANT * transferred_participant_count
      flat_exit_fee_cents  := 0 if exit_type == PLAN_TERMINATION_DISTRIBUTION
                              else EXIT_FLAT_FEE_CENTS

      # Ordered buckets: administrative recovery is satisfied before the flat exit fee.
      applied_1 := min(admin_recovery_cents, gross_account_balance_cents)
      remaining := gross_account_balance_cents - applied_1
      applied_2 := min(flat_exit_fee_cents, remaining)
      deductions_applied_cents   := applied_1 + applied_2
      unrecovered_deduction_cents := (admin_recovery_cents + flat_exit_fee_cents)
                                     - deductions_applied_cents
      transfer_amount_cents := gross_account_balance_cents - deductions_applied_cents
      settled_amount_cents  := gross_account_balance_cents

      # Ledger routing: deductions_applied_cents stays inside the plan (PlanDocument
      # .expense_recovered_cents), transfer_amount_cents leaves it
      # (PlanDocument.transferred_out_cents), and the employer's balance is zeroed — so
      # contribution_control_delta_cents stays 0. unrecovered_deduction_cents is written off
      # and never becomes a receivable.
      # Worked examples: gross 8500000 / 13 participants / SPINOFF_TO_SINGLE_PLAN ->
      #   16250 + 250000 applied, 0 unrecovered, 8233750 transferred.
      # gross 100000 / 4 participants / SPINOFF_TO_SINGLE_PLAN ->
      #   5000 + 95000 applied, 155000 unrecovered, 0 transferred.
    input_set: "The single AdoptingEmployer named by the transfer; balances and headcount are captured at the settlement instant, not at request time."
    constants:
      EXIT_ADMIN_FEE_CENTS_PER_PARTICIPANT: 1250
      EXIT_FLAT_FEE_CENTS: 250000
    precision: "integer cents; no rounding required"

  - name: fidelity_bond_minimum
    trigger: "on POST /pep/plan-filings/{id}/prepare"
    algorithm: threshold
    formula: |
      raw := round_half_up( PlanDocument.total_assets_cents * BOND_PCT_OF_ASSETS )
      fidelity_bond_minimum_cents := min( max(raw, BOND_FLOOR_CENTS), BOND_CEILING_CENTS )
      # The floor binds until assets reach 1000000 (10% of which is exactly the floor); the
      # ceiling binds from 1000000000 of assets upward.
    input_set: "PlanDocument.total_assets_cents at preparation time, which already includes expense_recovered_cents from settled exits."
    constants:
      BOND_PCT_OF_ASSETS: 0.10
      BOND_FLOOR_CENTS: 100000
      BOND_CEILING_CENTS: 100000000
    precision: "integer cents, round_half_up"

  - name: filing_deadline_date
    trigger: "on POST /pep/plan-filings/{id}/prepare"
    algorithm: chronological
    formula: |
      target_month := the month 7 months after the month of PlanDocument.plan_year_end_date
      d := the last calendar day of target_month
      while NOT is_business_day(d): d := d + 1 day
      filing_deadline_date := d
      is_late_filing := filed_date > filing_deadline_date
      # Worked example: plan_year_end_date 2026-12-31 -> last day of 2027-07 is Saturday
      # 2027-07-31, so the deadline rolls forward to 2027-08-02.
    input_set: "The plan document's plan_year_end_date; the filing's own plan_year is not used for the deadline."
    constants:
      MONTHS_AFTER_PLAN_YEAR_END: 7
    precision: "calendar date; roll forward only, never backward"

  - name: plan_control_totals
    trigger: "after every transition that moves money or headcount: payroll validate, deposit post, deposit reverse, correction fund, exit settle, exit reverse, employer admission, census patch"
    algorithm: aggregation
    formula: |
      # ---- money ------------------------------------------------------------
      total_validated_contributions_cents := sum(PayrollBatch.batch_total_cents
                                                 where status IN {VALIDATED, REMITTED})
      aggregate_receivable_cents := sum(PayrollBatch.batch_total_cents where status == VALIDATED)
      total_assets_cents := sum(AdoptingEmployer.account_balance_cents) + expense_recovered_cents
      total_corrections_funded_cents := sum(RemittanceDeposit.restoration_cents
                                            where timeliness_status == CORRECTED)
      transferred_out_cents := sum(ExitTransfer.transfer_amount_cents where status == SETTLED)
      expense_recovered_cents := sum(ExitTransfer.deductions_applied_cents where status == SETTLED)

      contribution_control_delta_cents :=
            total_assets_cents + aggregate_receivable_cents + transferred_out_cents
          - total_corrections_funded_cents - total_validated_contributions_cents
      INVARIANT: contribution_control_delta_cents == 0 after every one of the triggers above

      # ---- headcount --------------------------------------------------------
      participant_count := sum(AdoptingEmployer.participant_count where adoption_status != EXITED)
      cumulative_enrolled_participant_count := monotone accumulator, moved by employer
            admission and by every census delta, never reduced by an exit
      transferred_out_participant_count := sum(ExitTransfer.transferred_participant_count
                                               where status == SETTLED)
      headcount_control_delta := participant_count + transferred_out_participant_count
                                 - cumulative_enrolled_participant_count
      INVARIANT: headcount_control_delta == 0 after every one of the triggers above

      # ---- derived gates ----------------------------------------------------
      active_employer_count    := count(adoption_status IN {ACTIVE, EXIT_REQUESTED, SPINOFF_IN_PROGRESS})
      suspended_employer_count := count(adoption_status == SUSPENDED)
      compliance_posture := OPEN       if suspended_employer_count == 0
                            RESTRICTED if suspended_employer_count == 1
                            FROZEN     if suspended_employer_count >= 2
      audit_required := participant_count >= PLAN_AUDIT_PARTICIPANT_THRESHOLD
    input_set: "All PayrollBatch, RemittanceDeposit, AdoptingEmployer and ExitTransfer rows of the plan; state filters above are exact and exhaustive."
    constants:
      PLAN_AUDIT_PARTICIPANT_THRESHOLD: 1000
      SUSPENDED_RESTRICTED_THRESHOLD: 1
      SUSPENDED_FROZEN_THRESHOLD: 2
    precision: "integer cents and integer counts; both control deltas must be exactly 0"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:

  # ---- authentication / authorization -----------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header whose value is the empty string counts as absent)."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles: RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider, IndependentAuditor."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The role is listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "For entity_backed roles, X-User-ID must equal the id of the owning entity instance: PooledPlanProvider acts only on its own plans and their descendants; AdoptingEmployer acts only on its own elections, payroll batches, deposits and exit transfers; ServiceProvider acts only on allocations naming itself and on plans it is engaged on."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose resource resolves to an owner"

  # ---- existence ---------------------------------------------------------------
  - priority: 5
    category: existence
    check: "Every id in the path resolves to an existing row, validated left-to-right."
    error_id: "ERR_PLAN_PROVIDER_NOT_FOUND | ERR_PLAN_DOCUMENT_NOT_FOUND | ERR_SERVICE_PROVIDER_NOT_FOUND | ERR_FIDUCIARY_ALLOCATION_NOT_FOUND | ERR_ADOPTING_EMPLOYER_NOT_FOUND | ERR_DESIGN_ELECTION_NOT_FOUND | ERR_PAYROLL_BATCH_NOT_FOUND | ERR_REMITTANCE_DEPOSIT_NOT_FOUND | ERR_COMPLIANCE_TEST_NOT_FOUND | ERR_PLAN_FILING_NOT_FOUND | ERR_EXIT_TRANSFER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 6
    category: existence
    check: "Every well-formed foreign-key value in the request body resolves to an existing row, validated in the order the fields are declared in §1.1. A body FK that is absent or not a string is reported by rule 7 instead."
    error_id: "ERR_PLAN_DOCUMENT_NOT_FOUND | ERR_SERVICE_PROVIDER_NOT_FOUND | ERR_ADOPTING_EMPLOYER_NOT_FOUND | ERR_PAYROLL_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"

  # ---- request shape -----------------------------------------------------------
  - priority: 7
    category: business_constraint
    check: "Every required input field is present and well-typed; enum fields carry a declared member; integers are within their declared range; dates are ISO-8601 YYYY-MM-DD and datetimes ISO-8601 UTC; pagination limit is 1..100 and offset >= 0; unknown fields are ignored."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

  # ---- optimistic concurrency --------------------------------------------------
  - priority: 8
    category: state
    check: "expected_adopting_employer_version equals the AdoptingEmployer's current version."
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412
    applies_to: "POST /pep/plan-design-elections"
  - priority: 9
    category: state
    check: "expected_plan_document_version equals the PlanDocument's current version."
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /pep/fiduciary-role-allocations"

  # ---- state preconditions -----------------------------------------------------
  - priority: 10
    category: state
    check: "The PooledPlanProvider is in registration_status PENDING_REGISTRATION."
    error_id: ERR_PROVIDER_NOT_PENDING
    http_status: 409
    applies_to: "POST /pep/plan-providers/{id}/register"
  - priority: 11
    category: state
    check: "The PlanDocument is in status DRAFT."
    error_id: ERR_PLAN_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /pep/plan-documents/{id}/activate"
  - priority: 12
    category: state
    check: "The PlanDocument is in status ACTIVE."
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pep/adopting-employers, POST /pep/plan-design-elections/{id}/approve, POST /pep/compliance-tests/{id}/run, POST /pep/plan-filings/{id}/prepare, POST /pep/fee-disclosures"
  - priority: 13
    category: state
    check: "The FiduciaryRoleAllocation has status ALLOCATED and acknowledged_at is null."
    error_id: ERR_ALLOCATION_ALREADY_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /pep/fiduciary-role-allocations/{id}/acknowledge"
  - priority: 14
    category: state
    check: "The PlanDesignElection is in the status the action requires: DRAFT or RETURNED for submit, SUBMITTED for return and for approve."
    error_id: ERR_ELECTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/plan-design-elections/{id}/submit, /return, /approve"
  - priority: 15
    category: state
    check: "The AdoptingEmployer is in the adoption_status the action requires: APPLIED, ELECTIONS_SUBMITTED or RETURNED_FOR_REVISION for election creation; ACTIVE for payroll batch creation, census patch and exit request."
    error_id: ERR_EMPLOYER_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/plan-design-elections, POST /pep/payroll-batches, PATCH /pep/adopting-employers/{id}/census, POST /pep/exit-transfers"
  - priority: 16
    category: state
    check: "The PayrollBatch is in status RECEIVED for validate, and in status VALIDATED for deposit creation and posting."
    error_id: ERR_BATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/payroll-batches/{id}/validate, POST /pep/remittance-deposits, POST /pep/remittance-deposits/{id}/post"
  - priority: 17
    category: state
    check: "The RemittanceDeposit's deposit_status is PENDING for post and POSTED for reverse, compute-correction and fund-correction."
    error_id: ERR_DEPOSIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/remittance-deposits/{id}/post, /reverse, /compute-correction, /fund-correction"
  - priority: 18
    category: state
    check: "A POSTED deposit may be reversed only while its timeliness_status is TIMELY, LATE or UNDETERMINED; once a correction has been computed or funded the posting is frozen."
    error_id: ERR_DEPOSIT_NOT_REVERSIBLE
    http_status: 409
    applies_to: "POST /pep/remittance-deposits/{id}/reverse"
  - priority: 19
    category: state
    check: "The deposit's timeliness_status is LATE for compute-correction and CORRECTION_COMPUTED for fund-correction."
    error_id: ERR_CORRECTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/remittance-deposits/{id}/compute-correction, /fund-correction"
  - priority: 20
    category: state
    check: "The ComplianceTest is in status SCHEDULED."
    error_id: ERR_TEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/compliance-tests/{id}/run"
  - priority: 21
    category: state
    check: "The PlanFiling is in the filing_status the action requires: DRAFT for prepare, PREPARED or PARTIALLY_CLEARED for attest and certify-employer-data, READY_TO_FILE for file. A branch that has already cleared cannot clear twice: attest requires audit_attested_at null and certify-employer-data requires employer_data_certified_at null."
    error_id: ERR_FILING_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/prepare, /attest, /certify-employer-data, /file"
  - priority: 22
    category: state
    check: "Attestation is only accepted when the filing's audit_required is true; a plan under the 1000-participant threshold has no audit branch to clear."
    error_id: ERR_AUDIT_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/attest"
  - priority: 23
    category: state
    check: "The ExitTransfer is in status REQUESTED for approve, APPROVED for settle and SETTLED for reverse."
    error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    applies_to: "POST /pep/exit-transfers/{id}/approve, /settle, /reverse"

  # ---- business rules: safety / compliance / regulatory ------------------------
  - priority: 24
    category: business_safety
    check: "fidelity_bond_amount_cents is at least the ERISA 412 statutory floor of 100000 cents."
    error_id: ERR_FIDELITY_BOND_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /pep/plan-providers/{id}/register"
  - priority: 25
    category: business_safety
    check: "The sponsoring PooledPlanProvider has registration_status REGISTERED."
    error_id: ERR_PROVIDER_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /pep/plan-documents/{id}/activate"
  - priority: 26
    category: business_safety
    check: "An ALLOCATED FiduciaryRoleAllocation with fiduciary_role NAMED_FIDUCIARY_3_16 exists for the plan and has acknowledged_at set."
    error_id: ERR_NAMED_FIDUCIARY_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /pep/plan-documents/{id}/activate"
  - priority: 27
    category: business_safety
    check: "An ALLOCATED FiduciaryRoleAllocation with fiduciary_role TRUSTEE_403A exists for the plan and has acknowledged_at set."
    error_id: ERR_TRUSTEE_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /pep/plan-documents/{id}/activate"
  - priority: 28
    category: business_safety
    check: "PlanDocument.compliance_posture is not FROZEN (two or more suspended adopting employers freeze plan-level regulatory actions)."
    error_id: ERR_PLAN_COMPLIANCE_FROZEN
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/prepare, POST /pep/plan-filings/{id}/file, POST /pep/exit-transfers/{id}/approve"
  - priority: 29
    category: business_safety
    check: "No ComplianceTest of the plan with scope PLAN_LEVEL and the same plan_year is still in status SCHEDULED."
    error_id: ERR_PLAN_LEVEL_TEST_OUTSTANDING
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/prepare"
  - priority: 30
    category: business_safety
    check: "When audit_required is true the recorded audit_opinion is not DISCLAIMER."
    error_id: ERR_AUDIT_OPINION_UNACCEPTABLE
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/file"

  # ---- business rules: referential integrity across entities -------------------
  - priority: 31
    category: business_referential
    check: "The service provider named for attestation has provider_type AUDITOR_FIRM and is engaged on this plan."
    error_id: ERR_NOT_AN_AUDITOR_FIRM
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/attest"
  - priority: 32
    category: business_referential
    check: "The attesting AUDITOR_FIRM holds no FiduciaryRoleAllocation with status ALLOCATED on this plan, and is not linked by affiliated_service_provider_id in either direction to a provider that does."
    error_id: ERR_AUDITOR_NOT_INDEPENDENT
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/attest"
  - priority: 33
    category: business_referential
    check: "audit_firm_service_provider_id differs from the filing's prepared_by_user_id — the service provider that prepared the annual return may not also supply its audit."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/attest"
  - priority: 34
    category: business_referential
    check: "Every employer of the plan whose adoption_status is not EXITED has a PlanDesignElection in status APPROVED. The return reports employer-level data for every employer the plan has admitted and not yet released, so an employer still sitting in APPLIED, ELECTIONS_SUBMITTED or RETURNED_FOR_REVISION blocks certification just as surely as an ACTIVE one without an approved election."
    error_id: ERR_EMPLOYER_ELECTIONS_INCOMPLETE
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/certify-employer-data"
  - priority: 35
    category: business_referential
    check: "adopting_employer_id is present when scope is EMPLOYER_LEVEL and null when scope is PLAN_LEVEL."
    error_id: ERR_TEST_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /pep/compliance-tests"
  - priority: 36
    category: business_referential
    check: "A referenced AdoptingEmployer belongs to the referenced PlanDocument."
    error_id: ERR_EMPLOYER_PLAN_MISMATCH
    http_status: 409
    applies_to: "POST /pep/compliance-tests"
  - priority: 37
    category: business_referential
    check: "The acting ServiceProvider is engaged on the batch's plan with provider_type RECORDKEEPER."
    error_id: ERR_NOT_PLAN_RECORDKEEPER
    http_status: 409
    applies_to: "POST /pep/payroll-batches/{id}/validate, POST /pep/remittance-deposits/{id}/post, /reverse, /compute-correction"
  - priority: 38
    category: business_referential
    check: "affiliated_service_provider_id, when present, references a ServiceProvider on the same plan and is not the row's own id."
    error_id: ERR_INVALID_AFFILIATION
    http_status: 422
    applies_to: "POST /pep/service-providers"
  - priority: 39
    category: business_referential
    check: "At least one ServiceProvider engaged on the plan charges direct_fee_cents_per_participant > 0, so the disclosure has a non-zero gross direct fee to allocate. Plan activation already guarantees that engaged providers exist, so the violation this rule actually catches is a plan whose every engaged provider charges no direct fee at all: there is then nothing to disclose and the revenue-sharing rebate has no base to reduce."
    error_id: ERR_NO_BILLABLE_SERVICE_PROVIDER
    http_status: 409
    applies_to: "POST /pep/fee-disclosures"

  # ---- business rules: temporal ------------------------------------------------
  - priority: 40
    category: business_temporal
    check: "pay_period_end is strictly after pay_period_start (half-open interval [start, end)), and pay_date is on or after pay_period_start."
    error_id: ERR_INVALID_PAY_PERIOD
    http_status: 422
    applies_to: "POST /pep/payroll-batches"
  - priority: 41
    category: business_temporal
    check: "The half-open interval [pay_period_start, pay_period_end) does not overlap the interval of any other PayrollBatch of the same adopting employer. Adjacency is allowed: one batch ending on 2026-06-15 and the next starting on 2026-06-15 do not overlap."
    error_id: ERR_PAY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /pep/payroll-batches"
  - priority: 42
    category: business_temporal
    check: "withholding_date is on or after pay_period_start and no later than 31 calendar days after pay_period_end."
    error_id: ERR_WITHHOLDING_DATE_OUT_OF_PERIOD
    http_status: 422
    applies_to: "POST /pep/payroll-batches"
  - priority: 43
    category: business_temporal
    check: "deposit_date is not after the logical-clock calendar date and is on or after the batch's withholding_date."
    error_id: ERR_DEPOSIT_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /pep/remittance-deposits"
  - priority: 44
    category: business_temporal
    check: "recovery_date is on or after the deposit's deposit_date and not after the logical-clock calendar date."
    error_id: ERR_INVALID_RECOVERY_DATE
    http_status: 422
    applies_to: "POST /pep/remittance-deposits/{id}/compute-correction"
  - priority: 45
    category: business_temporal
    check: "effective_to is on or after effective_from (closed interval [effective_from, effective_to])."
    error_id: ERR_INVALID_ALLOCATION_WINDOW
    http_status: 422
    applies_to: "POST /pep/fiduciary-role-allocations"
  - priority: 46
    category: business_temporal
    check: "The new allocation's closed window [effective_from, effective_to] does not overlap the closed window of the incumbent ALLOCATED allocation for the same (plan_document_id, fiduciary_role). Touching at a single day is an overlap: effective_from equal to the incumbent's effective_to is rejected, effective_from one day later is accepted."
    error_id: ERR_ALLOCATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /pep/fiduciary-role-allocations"
  - priority: 47
    category: business_temporal
    check: "blackout_end_date is on or after blackout_start_date and requested_exit_date is on or after blackout_end_date."
    error_id: ERR_INVALID_BLACKOUT_WINDOW
    http_status: 422
    applies_to: "POST /pep/exit-transfers"
  - priority: 48
    category: business_temporal
    check: "The blackout window neither overlaps nor comes within BLACKOUT_BUFFER_DAYS (5) calendar days of the blackout window of any other ExitTransfer of the same plan whose status is not REVERSED — the plan can service one asset transfer at a time. The gap between two non-overlapping windows is the whole number of calendar days from the earlier window's blackout_end_date to the later window's blackout_start_date; a gap of 5 days or fewer conflicts and a gap of 6 days or more is accepted. A SETTLED transfer still holds the slot; only a REVERSED transfer releases it."
    error_id: ERR_BLACKOUT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pep/exit-transfers/{id}/approve"
  - priority: 49
    category: business_temporal
    check: "The logical-clock calendar date is on or before the employer's election_window_close_date."
    error_id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /pep/plan-design-elections/{id}/submit"
  - priority: 50
    category: business_temporal
    check: "The logical-clock calendar date is strictly after blackout_end_date — assets cannot move while the blackout is still open."
    error_id: ERR_BLACKOUT_NOT_ENDED
    http_status: 409
    applies_to: "POST /pep/exit-transfers/{id}/settle"
  - priority: 51
    category: business_temporal
    check: "disclosure_period_end is on or after disclosure_period_start."
    error_id: ERR_INVALID_DISCLOSURE_PERIOD
    http_status: 422
    applies_to: "POST /pep/fee-disclosures"

  # ---- business rules: constraint satisfaction / uniqueness --------------------
  - priority: 52
    category: business_constraint
    check: "PooledPlanProvider.ein is unique across all providers."
    error_id: ERR_DUPLICATE_PROVIDER_EIN
    http_status: 409
    applies_to: "POST /pep/plan-providers"
  - priority: 53
    category: business_constraint
    check: "plan_number is unique per pooled_plan_provider_id."
    error_id: ERR_DUPLICATE_PLAN_NUMBER
    http_status: 409
    applies_to: "POST /pep/plan-documents"
  - priority: 54
    category: business_constraint
    check: "AdoptingEmployer.ein is unique per plan_document_id."
    error_id: ERR_DUPLICATE_EMPLOYER_EIN
    http_status: 409
    applies_to: "POST /pep/adopting-employers"
  - priority: 55
    category: business_constraint
    check: "payroll_provider_reference is unique per adopting_employer_id."
    error_id: ERR_DUPLICATE_PAYROLL_REFERENCE
    http_status: 409
    applies_to: "POST /pep/payroll-batches"
  - priority: 56
    category: business_constraint
    check: "plan_year is unique per plan_document_id for PlanFiling rows."
    error_id: ERR_DUPLICATE_FILING_YEAR
    http_status: 409
    applies_to: "POST /pep/plan-filings"
  - priority: 57
    category: business_constraint
    check: "At most one non-CLOSED ComplianceTest exists per (plan_document_id, test_type, scope, plan_year, adopting_employer_id)."
    error_id: ERR_DUPLICATE_COMPLIANCE_TEST
    http_status: 409
    applies_to: "POST /pep/compliance-tests"
  - priority: 58
    category: business_constraint
    check: "All four tier fields (match_tier_1_pct, match_tier_1_limit_pct, match_tier_2_pct, match_tier_2_limit_pct) are present when match_formula_code is DISCRETIONARY_TIERED and all four are absent or null otherwise."
    error_id: ERR_TIER_FIELDS_MISMATCH
    http_status: 422
    applies_to: "POST /pep/plan-design-elections"
  - priority: 59
    category: business_constraint
    check: "match_tier_2_limit_pct is greater than or equal to match_tier_1_limit_pct."
    error_id: ERR_TIER_LIMITS_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /pep/plan-design-elections"
  - priority: 60
    category: business_constraint
    check: "signatory_name is supplied at submission."
    error_id: ERR_SIGNATORY_REQUIRED
    http_status: 422
    applies_to: "POST /pep/plan-design-elections/{id}/submit"
  - priority: 61
    category: business_constraint
    check: "eligibility_min_age is at most PlanDocument.base_eligibility_min_age and eligibility_service_months is at most PlanDocument.base_eligibility_service_months — an adopting employer may be more generous than the common structure but never more restrictive."
    error_id: ERR_ELIGIBILITY_MORE_RESTRICTIVE
    http_status: 409
    applies_to: "POST /pep/plan-design-elections/{id}/approve"
  - priority: 62
    category: business_constraint
    check: "The generosity rank of vesting_schedule (IMMEDIATE 0, GRADED_2_6 1, CLIFF_3YR 2) is at most the rank of PlanDocument.base_vesting_schedule."
    error_id: ERR_VESTING_MORE_RESTRICTIVE
    http_status: 409
    applies_to: "POST /pep/plan-design-elections/{id}/approve"
  - priority: 63
    category: business_constraint
    check: "benefiting_hce_count <= hce_count, benefiting_nhce_count <= nhce_count, nhce_count >= 1, and hce_count + nhce_count == participant_count."
    error_id: ERR_CENSUS_INCONSISTENT
    http_status: 422
    applies_to: "POST /pep/adopting-employers, PATCH /pep/adopting-employers/{id}/census"
  - priority: 64
    category: business_constraint
    check: "The employer has a PlanDesignElection in status APPROVED, so its elected match formula and nondiscrimination track are defined. On POST /pep/payroll-batches this is what makes an expected match computable; on POST /pep/compliance-tests with scope EMPLOYER_LEVEL it is what makes the tested employer's ADP/ACP track known. A payroll batch can only be delivered by an ACTIVE employer, which always holds an approved election, so the reachable violation is an EMPLOYER_LEVEL test scheduled against an employer still in APPLIED, ELECTIONS_SUBMITTED or RETURNED_FOR_REVISION."
    error_id: ERR_NO_APPROVED_ELECTION
    http_status: 409
    applies_to: "POST /pep/payroll-batches, POST /pep/compliance-tests (scope EMPLOYER_LEVEL)"
  - priority: 65
    category: business_constraint
    check: "total_match_cents equals the batch's computed expected_match_cents."
    error_id: ERR_MATCH_MISMATCH
    http_status: 409
    applies_to: "POST /pep/payroll-batches/{id}/validate"

  # ---- business rules: fiscal (money and quota checks last) --------------------
  - priority: 66
    category: business_fiscal
    check: "amount_cents equals the parent PayrollBatch.batch_total_cents — partial remittances are not accepted."
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /pep/remittance-deposits"
  - priority: 67
    category: business_fiscal
    check: "The adopting employer has no RemittanceDeposit with deposit_status POSTED and timeliness_status LATE or CORRECTION_COMPUTED."
    error_id: ERR_OPEN_LATE_DEPOSIT_CORRECTION
    http_status: 409
    applies_to: "POST /pep/exit-transfers, POST /pep/exit-transfers/{id}/settle"
  - priority: 68
    category: business_fiscal
    check: "The adopting employer has no PayrollBatch in status VALIDATED awaiting remittance."
    error_id: ERR_UNREMITTED_CONTRIBUTIONS
    http_status: 409
    applies_to: "POST /pep/exit-transfers/{id}/settle"
  - priority: 69
    category: business_fiscal
    check: "The sponsoring PooledPlanProvider.fidelity_bond_amount_cents is at least the filing's fidelity_bond_minimum_cents."
    error_id: ERR_FIDELITY_BOND_INSUFFICIENT
    http_status: 409
    applies_to: "POST /pep/plan-filings/{id}/attest"
  - priority: 70
    category: business_fiscal
    check: "form_5330_reference is supplied whenever the deposit's excise_tax_cents is greater than 0."
    error_id: ERR_FORM_5330_REFERENCE_REQUIRED
    http_status: 422
    applies_to: "POST /pep/remittance-deposits/{id}/fund-correction"
  - priority: 71
    category: business_fiscal
    check: "No PlanFiling of the plan has filing_status FILED for the plan year containing the transfer's settled_at."
    error_id: ERR_FILING_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /pep/exit-transfers/{id}/reverse"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- pooled plan provider ----------------------------------------------------
  - method: POST
    path: "/pep/plan-providers"
    description: "Register the intent of a firm to act as a pooled plan provider; the row starts PENDING_REGISTRATION."
    roles: [RegulatorOps]
    code: 201
    input: [legal_name, ein, fidelity_bond_amount_cents]
    output: PooledPlanProvider
    side_effects: ["none beyond row creation"]
  - method: POST
    path: "/pep/plan-providers/{id}/register"
    description: "Approve the provider's registration and mint its registration number."
    roles: [RegulatorOps]
    code: 200
    input: [registration_effective_date]
    output: PooledPlanProvider
    side_effects:
      - "registration_status -> REGISTERED"
      - "mints registration_number (PPP-NNNN)"
      - "sets registration_effective_date and registered_at"
      - "increments PooledPlanProvider.version by 1"
  - method: GET
    path: "/pep/plan-providers/{id}"
    description: "Read one pooled plan provider."
    roles: [RegulatorOps, PooledPlanProvider]
    code: 200
    input: []
    output: PooledPlanProvider
    side_effects: []
  - method: GET
    path: "/pep/plan-providers/{id}/plan-documents"
    description: "List the plan documents sponsored by this provider (FK reverse for PlanDocument.pooled_plan_provider_id)."
    roles: [RegulatorOps, PooledPlanProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanDocument[]
    side_effects: []

  # ---- plan document -----------------------------------------------------------
  - method: POST
    path: "/pep/plan-documents"
    description: "Create the single plan document that every adopting employer will adopt."
    roles: [PooledPlanProvider]
    code: 201
    input: [pooled_plan_provider_id, plan_name, plan_number, plan_year_end_date, base_eligibility_min_age, base_eligibility_service_months, base_vesting_schedule, base_match_formula_code]
    output: PlanDocument
    side_effects: ["initialises all control totals to 0 and compliance_posture to OPEN"]
  - method: POST
    path: "/pep/plan-documents/{id}/activate"
    description: "Activate the plan document once the provider is registered and the named fiduciary and trustee roles are acknowledged."
    roles: [PooledPlanProvider]
    code: 200
    input: []
    output: PlanDocument
    side_effects:
      - "status -> ACTIVE"
      - "sets effective_date to the logical-clock calendar date"
      - "increments PlanDocument.version by 1"
  - method: GET
    path: "/pep/plan-documents/{id}"
    description: "Read one plan document, including every derived control total and the compliance posture."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider, IndependentAuditor]
    code: 200
    input: []
    output: PlanDocument
    side_effects: []
  - method: GET
    path: "/pep/plan-documents/{id}/service-providers"
    description: "List the service providers engaged on this plan (FK reverse for ServiceProvider.plan_document_id)."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceProvider[]
    side_effects: []
  - method: GET
    path: "/pep/plan-documents/{id}/adopting-employers"
    description: "List the employers that have adopted this plan (FK reverse for AdoptingEmployer.plan_document_id)."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: AdoptingEmployer[]
    side_effects: []
  - method: GET
    path: "/pep/plan-documents/{id}/fiduciary-role-allocations"
    description: "List every fiduciary role allocation on this plan, ALLOCATED and REVOKED (FK reverse for FiduciaryRoleAllocation.plan_document_id)."
    roles: [RegulatorOps, PooledPlanProvider, ServiceProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: FiduciaryRoleAllocation[]
    side_effects: []
  - method: GET
    path: "/pep/plan-documents/{id}/compliance-tests"
    description: "List the coverage and nondiscrimination tests of this plan (FK reverse for ComplianceTest.plan_document_id)."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceTest[]
    side_effects: []
  - method: GET
    path: "/pep/plan-documents/{id}/plan-filings"
    description: "List the annual returns of this plan (FK reverse for PlanFiling.plan_document_id)."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanFiling[]
    side_effects: []
  - method: GET
    path: "/pep/plan-documents/{id}/fee-disclosures"
    description: "List the fee disclosures issued for this plan (FK reverse for FeeDisclosure.plan_document_id)."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeDisclosure[]
    side_effects: []

  # ---- service provider --------------------------------------------------------
  - method: POST
    path: "/pep/service-providers"
    description: "Engage a service provider on the plan and record its direct fee and revenue sharing terms."
    roles: [PooledPlanProvider]
    code: 201
    input: [plan_document_id, legal_name, provider_type, revenue_sharing_bps, direct_fee_cents_per_participant, "affiliated_service_provider_id?"]
    output: ServiceProvider
    side_effects: ["holds_fiduciary_role initialised to false"]
  - method: GET
    path: "/pep/service-providers/{id}"
    description: "Read one service provider."
    roles: [RegulatorOps, PooledPlanProvider, ServiceProvider, IndependentAuditor]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: []
  - method: GET
    path: "/pep/service-providers/{id}/affiliates"
    description: "List the providers that name this provider as their affiliate (FK reverse for the self-referential ServiceProvider.affiliated_service_provider_id)."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceProvider[]
    side_effects: []
  - method: GET
    path: "/pep/service-providers/{id}/fiduciary-role-allocations"
    description: "List the fiduciary roles allocated to this provider (FK reverse for FiduciaryRoleAllocation.service_provider_id)."
    roles: [RegulatorOps, PooledPlanProvider, ServiceProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: FiduciaryRoleAllocation[]
    side_effects: []
  - method: GET
    path: "/pep/service-providers/{id}/attested-filings"
    description: "List the plan filings this provider attested as auditor (FK reverse for PlanFiling.audit_firm_service_provider_id)."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanFiling[]
    side_effects: []

  # ---- fiduciary role allocation -----------------------------------------------
  - method: POST
    path: "/pep/fiduciary-role-allocations"
    description: "Allocate a statutory fiduciary function to a service provider for a closed effective window. A new allocation for the same (plan, role) revokes the incumbent."
    roles: [PooledPlanProvider]
    code: 201
    input: [plan_document_id, service_provider_id, fiduciary_role, effective_from, effective_to, expected_plan_document_version]
    output: FiduciaryRoleAllocation
    side_effects:
      - "revokes the incumbent ALLOCATED allocation for the same (plan_document_id, fiduciary_role)"
      - "recomputes ServiceProvider.holds_fiduciary_role for both providers"
      - "increments PlanDocument.version by 1"
  - method: POST
    path: "/pep/fiduciary-role-allocations/{id}/acknowledge"
    description: "The named provider acknowledges the fiduciary function in writing."
    roles: [ServiceProvider]
    code: 200
    input: [acknowledgment_statement]
    output: FiduciaryRoleAllocation
    side_effects:
      - "sets acknowledged_at and acknowledgment_statement"
      - "increments FiduciaryRoleAllocation.version by 1"
  - method: GET
    path: "/pep/fiduciary-role-allocations/{id}"
    description: "Read one fiduciary role allocation."
    roles: [RegulatorOps, PooledPlanProvider, ServiceProvider]
    code: 200
    input: []
    output: FiduciaryRoleAllocation
    side_effects: []

  # ---- adopting employer -------------------------------------------------------
  - method: POST
    path: "/pep/adopting-employers"
    description: "Onboard an adopting employer onto the active plan document with its opening census."
    roles: [PooledPlanProvider]
    code: 201
    input: [plan_document_id, legal_name, ein, election_window_close_date, participant_count, hce_count, nhce_count, benefiting_hce_count, benefiting_nhce_count, hce_avg_deferral_pct, nhce_avg_deferral_pct]
    output: AdoptingEmployer
    side_effects:
      - "computes is_small_plan and employer_audit_required"
      - "increases PlanDocument.participant_count and cumulative_enrolled_participant_count by participant_count"
      - "recomputes PlanDocument.audit_required and headcount_control_delta"
      - "increments PlanDocument.version by 1"
  - method: GET
    path: "/pep/adopting-employers/{id}"
    description: "Read one adopting employer, including its balances, hold flag and open correction count."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: []
    output: AdoptingEmployer
    side_effects: []
  - method: PATCH
    path: "/pep/adopting-employers/{id}/census"
    description: "Restate the employer's census counts and deferral averages; the plan's headcount control totals move with the delta."
    roles: [AdoptingEmployer, PooledPlanProvider]
    code: 200
    input: [participant_count, hce_count, nhce_count, benefiting_hce_count, benefiting_nhce_count, "hce_avg_deferral_pct?", "nhce_avg_deferral_pct?"]
    output: AdoptingEmployer
    side_effects:
      - "recomputes is_small_plan and employer_audit_required"
      - "moves PlanDocument.participant_count and cumulative_enrolled_participant_count by the delta, keeping headcount_control_delta at 0"
      - "recomputes PlanDocument.audit_required"
      - "increments AdoptingEmployer.version by 1"
  - method: GET
    path: "/pep/adopting-employers/{id}/design-elections"
    description: "List this employer's plan design elections in every status (FK reverse for PlanDesignElection.adopting_employer_id)."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanDesignElection[]
    side_effects: []
  - method: GET
    path: "/pep/adopting-employers/{id}/payroll-batches"
    description: "List this employer's payroll batches (FK reverse for PayrollBatch.adopting_employer_id)."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: PayrollBatch[]
    side_effects: []
  - method: GET
    path: "/pep/adopting-employers/{id}/compliance-tests"
    description: "List the EMPLOYER_LEVEL tests naming this employer (FK reverse for ComplianceTest.adopting_employer_id)."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceTest[]
    side_effects: []
  - method: GET
    path: "/pep/adopting-employers/{id}/exit-transfers"
    description: "List this employer's exit transfers (FK reverse for ExitTransfer.adopting_employer_id)."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: ["limit?", "offset?"]
    output: ExitTransfer[]
    side_effects: []

  # ---- plan design election ----------------------------------------------------
  - method: POST
    path: "/pep/plan-design-elections"
    description: "Create the employer's elections inside the common plan document. Supersedes any in-flight election of the same employer, which is why the employer's version must be supplied."
    roles: [AdoptingEmployer]
    code: 201
    input: [adopting_employer_id, eligibility_min_age, eligibility_service_months, vesting_schedule, match_formula_code, "match_tier_1_pct?", "match_tier_1_limit_pct?", "match_tier_2_pct?", "match_tier_2_limit_pct?", expected_adopting_employer_version]
    output: PlanDesignElection
    side_effects:
      - "assigns election_sequence and derives nondiscrimination_track"
      - "supersedes any prior election of this employer in status DRAFT, SUBMITTED or RETURNED"
      - "resets the employer to APPLIED when it was ELECTIONS_SUBMITTED or RETURNED_FOR_REVISION"
      - "increments AdoptingEmployer.version by 1"
  - method: POST
    path: "/pep/plan-design-elections/{id}/submit"
    description: "Submit the election for the pooled plan provider's review, inside the employer's election window."
    roles: [AdoptingEmployer]
    code: 200
    input: [signatory_name]
    output: PlanDesignElection
    side_effects:
      - "status -> SUBMITTED and clears return_reason and deficiency_code"
      - "advances the AdoptingEmployer to ELECTIONS_SUBMITTED"
      - "increments PlanDesignElection.version by 1 and AdoptingEmployer.version by 1"
  - method: POST
    path: "/pep/plan-design-elections/{id}/return"
    description: "Return a submitted election to the employer for revision with a structured deficiency code."
    roles: [PooledPlanProvider]
    code: 200
    input: [return_reason, deficiency_code]
    output: PlanDesignElection
    side_effects:
      - "status -> RETURNED"
      - "advances the AdoptingEmployer to RETURNED_FOR_REVISION"
      - "increments PlanDesignElection.version by 1 and AdoptingEmployer.version by 1"
  - method: POST
    path: "/pep/plan-design-elections/{id}/approve"
    description: "Approve the election, admitting the employer as an ACTIVE participant in the pooled plan."
    roles: [PooledPlanProvider]
    code: 200
    input: []
    output: PlanDesignElection
    side_effects:
      - "status -> APPROVED and sets approved_at"
      - "advances the AdoptingEmployer to ACTIVE and sets effective_adoption_date"
      - "recomputes PlanDocument.active_employer_count"
      - "increments PlanDesignElection.version by 1 and AdoptingEmployer.version by 1"
  - method: GET
    path: "/pep/plan-design-elections/{id}"
    description: "Read one plan design election."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: []
    output: PlanDesignElection
    side_effects: []

  # ---- payroll batch -----------------------------------------------------------
  - method: POST
    path: "/pep/payroll-batches"
    description: "Deliver a payroll period's deferral, match and loan repayment totals from the employer's payroll system."
    roles: [AdoptingEmployer]
    code: 201
    input: [adopting_employer_id, pay_period_start, pay_period_end, pay_date, withholding_date, payroll_provider_reference, total_eligible_compensation_cents, total_deferral_cents, total_match_cents, total_loan_repayment_cents, participant_line_count]
    output: PayrollBatch
    side_effects:
      - "computes expected_match_cents from the employer's APPROVED election"
      - "computes batch_total_cents, deposit_rule and deposit_due_date"
    note: "expected_match_cents is computed and returned even when it disagrees with total_match_cents; the mismatch is rejected at validation, not at delivery."
  - method: POST
    path: "/pep/payroll-batches/{id}/validate"
    description: "The plan recordkeeper reconciles the delivered batch against the employer's elected match formula."
    roles: [ServiceProvider]
    code: 200
    input: [reconciliation_note]
    output: PayrollBatch
    side_effects:
      - "status -> VALIDATED, sets validated_at and reconciliation_note"
      - "recomputes AdoptingEmployer.contribution_receivable_cents"
      - "recomputes PlanDocument.total_validated_contributions_cents, aggregate_receivable_cents and contribution_control_delta_cents"
      - "increments PayrollBatch.version by 1"
  - method: GET
    path: "/pep/payroll-batches/{id}"
    description: "Read one payroll batch, including its computed deposit_due_date and deposit_rule."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider]
    code: 200
    input: []
    output: PayrollBatch
    side_effects: []
  - method: GET
    path: "/pep/payroll-batches/{id}/remittance-deposits"
    description: "List the remittance deposits made against this batch (FK reverse for RemittanceDeposit.payroll_batch_id)."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: RemittanceDeposit[]
    side_effects: []

  # ---- remittance deposit ------------------------------------------------------
  - method: POST
    path: "/pep/remittance-deposits"
    description: "Record the employer's remittance of a validated batch to the trust; the deposit starts PENDING and UNDETERMINED."
    roles: [AdoptingEmployer]
    code: 201
    input: [payroll_batch_id, deposit_date, amount_cents, deposit_reference]
    output: RemittanceDeposit
    side_effects: ["none until the deposit is posted"]
  - method: POST
    path: "/pep/remittance-deposits/{id}/post"
    description: "The recordkeeper posts the deposit to the trust; timeliness is evaluated against the batch's deposit_due_date in the same request."
    roles: [ServiceProvider]
    code: 200
    input: [posting_reference]
    output: RemittanceDeposit
    side_effects:
      - "deposit_status -> POSTED, sets posted_at and posting_reference"
      - "computes business_days_elapsed and late_by_business_days"
      - "timeliness_status -> TIMELY or LATE"
      - "advances the PayrollBatch to REMITTED and moves AdoptingEmployer.account_balance_cents and contribution_receivable_cents"
      - "when LATE: suspends the employer, sets contribution_hold, increments open_correction_count, recomputes PlanDocument.suspended_employer_count and compliance_posture, and reopens the employer-data branch of any non-FILED PlanFiling of the plan"
      - "increments RemittanceDeposit.version by 1"
  - method: POST
    path: "/pep/remittance-deposits/{id}/reverse"
    description: "Reverse a posted deposit that has not yet entered the correction workflow, restoring the pre-posting ledger exactly."
    roles: [ServiceProvider]
    code: 200
    input: [reversal_reason]
    output: RemittanceDeposit
    side_effects:
      - "deposit_status -> REVERSED and timeliness_status -> UNDETERMINED"
      - "reverts the PayrollBatch to VALIDATED and restores both employer balances"
      - "unwinds any suspension the posting caused"
      - "recomputes every PlanDocument control total so contribution_control_delta_cents returns to 0"
      - "increments RemittanceDeposit.version by 1"
  - method: POST
    path: "/pep/remittance-deposits/{id}/compute-correction"
    description: "Compute lost earnings, the restoration amount and the Form 5330 excise tax for a late deposit under the chosen correction method."
    roles: [ServiceProvider]
    code: 200
    input: [correction_method, recovery_date, actual_investment_return_cents]
    output: RemittanceDeposit
    side_effects:
      - "timeliness_status -> CORRECTION_COMPUTED"
      - "sets correction_method, recovery_date, actual_investment_return_cents, lost_earnings_cents, restoration_cents and excise_tax_cents"
      - "increments RemittanceDeposit.version by 1"
  - method: POST
    path: "/pep/remittance-deposits/{id}/fund-correction"
    description: "The employer funds the restoration amount into the trust and reports the excise tax return reference."
    roles: [AdoptingEmployer]
    code: 200
    input: ["form_5330_reference?"]
    output: RemittanceDeposit
    side_effects:
      - "timeliness_status -> CORRECTED, sets funded_at and form_5330_reference"
      - "adds restoration_cents to AdoptingEmployer.account_balance_cents"
      - "decrements open_correction_count and returns the employer to ACTIVE when it reaches 0"
      - "recomputes PlanDocument.total_corrections_funded_cents, total_assets_cents, suspended_employer_count, compliance_posture and contribution_control_delta_cents"
      - "increments RemittanceDeposit.version by 1"
  - method: GET
    path: "/pep/remittance-deposits/{id}"
    description: "Read one remittance deposit, including both state dimensions and every correction figure."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider]
    code: 200
    input: []
    output: RemittanceDeposit
    side_effects: []

  # ---- compliance testing ------------------------------------------------------
  - method: POST
    path: "/pep/compliance-tests"
    description: "Schedule a coverage or nondiscrimination test at plan level or for a single adopting employer."
    roles: [PooledPlanProvider]
    code: 201
    input: [plan_document_id, test_type, scope, plan_year, "adopting_employer_id?"]
    output: ComplianceTest
    side_effects: ["none until the test is run"]
  - method: POST
    path: "/pep/compliance-tests/{id}/run"
    description: "Run the scheduled test over the population selected by its scope and record the verdict."
    roles: [ServiceProvider]
    code: 200
    input: []
    output: ComplianceTest
    side_effects:
      - "status -> PASSED or FAILED, sets run_at, every population count and percentage, exemption_applied and failure_reason"
      - "increments ComplianceTest.version by 1"
  - method: GET
    path: "/pep/compliance-tests/{id}"
    description: "Read one compliance test with all computed percentages."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer, IndependentAuditor]
    code: 200
    input: []
    output: ComplianceTest
    side_effects: []

  # ---- plan filing -------------------------------------------------------------
  - method: POST
    path: "/pep/plan-filings"
    description: "Open the plan's annual return for a plan year."
    roles: [PooledPlanProvider]
    code: 201
    input: [plan_document_id, plan_year]
    output: PlanFiling
    side_effects: ["none until the filing is prepared"]
  - method: POST
    path: "/pep/plan-filings/{id}/prepare"
    description: "A service provider prepares the annual return, snapshotting the delinquent-contribution line, the bond minimum, the audit requirement and the deadline."
    roles: [ServiceProvider]
    code: 200
    input: []
    output: PlanFiling
    side_effects:
      - "filing_status -> PREPARED, sets prepared_by_user_id and prepared_at"
      - "computes late_deposit_schedule_h_line_cents, fidelity_bond_minimum_cents, audit_required and filing_deadline_date"
      - "increments PlanFiling.version by 1"
  - method: POST
    path: "/pep/plan-filings/{id}/attest"
    description: "The independent auditor attests the plan-level single audit; the attesting firm must be independent and must not have prepared the return."
    roles: [IndependentAuditor]
    code: 200
    input: [audit_firm_service_provider_id, audit_opinion]
    output: PlanFiling
    side_effects:
      - "clears the audit branch: sets audit_attested_at, audit_opinion and audit_firm_service_provider_id"
      - "filing_status -> PARTIALLY_CLEARED or READY_TO_FILE depending on the employer-data branch"
      - "increments PlanFiling.version by 1"
  - method: POST
    path: "/pep/plan-filings/{id}/certify-employer-data"
    description: "The pooled plan provider certifies the employer-level data attached to the plan-level return."
    roles: [PooledPlanProvider]
    code: 200
    input: []
    output: PlanFiling
    side_effects:
      - "clears the employer-data branch: sets employer_data_certified_at, certified_by_user_id and certified_employer_count"
      - "filing_status -> PARTIALLY_CLEARED or READY_TO_FILE depending on the audit branch and audit_required"
      - "increments PlanFiling.version by 1"
  - method: POST
    path: "/pep/plan-filings/{id}/file"
    description: "File the annual return with the regulator."
    roles: [RegulatorOps]
    code: 200
    input: []
    output: PlanFiling
    side_effects:
      - "filing_status -> FILED, sets filed_date, is_late_filing and acknowledgment_reference"
      - "increments PlanFiling.version by 1"
  - method: GET
    path: "/pep/plan-filings/{id}"
    description: "Read one plan filing with both branch clearances and every snapshotted figure."
    roles: [RegulatorOps, PooledPlanProvider, IndependentAuditor]
    code: 200
    input: []
    output: PlanFiling
    side_effects: []

  # ---- exit, spin-off and asset transfer ---------------------------------------
  - method: POST
    path: "/pep/exit-transfers"
    description: "The employer requests to leave the pooled plan by spin-off, transfer to another pooled plan, or termination distribution."
    roles: [AdoptingEmployer]
    code: 201
    input: [adopting_employer_id, exit_type, requested_exit_date, blackout_start_date, blackout_end_date, "successor_plan_name?"]
    output: ExitTransfer
    side_effects:
      - "advances the AdoptingEmployer to EXIT_REQUESTED"
      - "increments AdoptingEmployer.version by 1"
  - method: POST
    path: "/pep/exit-transfers/{id}/approve"
    description: "Approve the exit and open the asset-transfer blackout window; the plan services one transfer window at a time."
    roles: [PooledPlanProvider]
    code: 200
    input: []
    output: ExitTransfer
    side_effects:
      - "status -> APPROVED, sets approved_at"
      - "advances the AdoptingEmployer to SPINOFF_IN_PROGRESS"
      - "increments ExitTransfer.version by 1 and AdoptingEmployer.version by 1"
  - method: POST
    path: "/pep/exit-transfers/{id}/settle"
    description: "Settle the transfer after the blackout closes, running the deduction waterfall and moving the employer's assets out of the pooled plan."
    roles: [PooledPlanProvider]
    code: 200
    input: []
    output: ExitTransfer
    side_effects:
      - "status -> SETTLED, sets settled_at and every waterfall figure"
      - "advances the AdoptingEmployer to EXITED, sets exited_at and zeroes account_balance_cents"
      - "supersedes the employer's APPROVED election and closes its EMPLOYER_LEVEL compliance tests"
      - "recomputes PlanDocument participant, asset, transferred-out and expense-recovered totals, audit_required and both control deltas"
      - "increments ExitTransfer.version by 1 and AdoptingEmployer.version by 1"
  - method: POST
    path: "/pep/exit-transfers/{id}/reverse"
    description: "Unwind a settled transfer before the plan year's return is filed, restoring the employer and every plan control total."
    roles: [PooledPlanProvider]
    code: 200
    input: [reversal_reason]
    output: ExitTransfer
    side_effects:
      - "status -> REVERSED, sets reversal_reason"
      - "returns the AdoptingEmployer to SPINOFF_IN_PROGRESS, restores account_balance_cents and clears exited_at"
      - "recomputes every PlanDocument control total so headcount_control_delta and contribution_control_delta_cents both return to 0"
      - "increments ExitTransfer.version by 1 and AdoptingEmployer.version by 1"
  - method: GET
    path: "/pep/exit-transfers/{id}"
    description: "Read one exit transfer with every waterfall figure."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: []
    output: ExitTransfer
    side_effects: []

  # ---- fee disclosure and revenue sharing --------------------------------------
  - method: POST
    path: "/pep/fee-disclosures"
    description: "Issue an immutable fee disclosure for a period: compute the net plan expense and allocate the revenue sharing pool across eligible adopting employers."
    roles: [PooledPlanProvider]
    code: 201
    input: [plan_document_id, disclosure_period_start, disclosure_period_end, allocation_method, revenue_sharing_pool_cents]
    output: FeeDisclosure
    side_effects:
      - "computes gross_direct_fees_cents, expense_rebate_pct, revenue_sharing_offset_cents and net_plan_expense_cents in that order"
      - "builds allocation_lines by largest-remainder allocation and sets residual_cents_distributed and total_revenue_sharing_allocated_cents"
      - "increases each named AdoptingEmployer.revenue_sharing_credit_cents by its credit_cents"
  - method: GET
    path: "/pep/fee-disclosures/{id}"
    description: "Read one fee disclosure with its full allocation_lines array."
    roles: [RegulatorOps, PooledPlanProvider, AdoptingEmployer]
    code: 200
    input: []
    output: FeeDisclosure
    side_effects: []

  # ---- test-driving endpoint (logical clock) -----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and timeliness rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [RegulatorOps]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["no business state changes; only the logical clock moves"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication and authorisation (priorities 1-4) -----------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID is absent or is the empty string."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of RegulatorOps, PooledPlanProvider, AdoptingEmployer, ServiceProvider, IndependentAuditor."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The declared role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own: a PooledPlanProvider on another provider's plan or descendant, an AdoptingEmployer on another employer's election, batch, deposit or exit, or a ServiceProvider on an allocation or plan it is not engaged on."

  # ---- existence (priorities 5-6) ---------------------------------------------
  - id: ERR_PLAN_PROVIDER_NOT_FOUND
    http: 404
    condition: "A pooled plan provider id in the path or body does not resolve to an existing row."
  - id: ERR_PLAN_DOCUMENT_NOT_FOUND
    http: 404
    condition: "A plan document id in the path or body does not resolve to an existing row."
  - id: ERR_SERVICE_PROVIDER_NOT_FOUND
    http: 404
    condition: "A service provider id in the path or body (including affiliated_service_provider_id and audit_firm_service_provider_id) does not resolve to an existing row."
  - id: ERR_FIDUCIARY_ALLOCATION_NOT_FOUND
    http: 404
    condition: "A fiduciary role allocation id in the path does not resolve to an existing row."
  - id: ERR_ADOPTING_EMPLOYER_NOT_FOUND
    http: 404
    condition: "An adopting employer id in the path or body does not resolve to an existing row."
  - id: ERR_DESIGN_ELECTION_NOT_FOUND
    http: 404
    condition: "A plan design election id in the path does not resolve to an existing row."
  - id: ERR_PAYROLL_BATCH_NOT_FOUND
    http: 404
    condition: "A payroll batch id in the path or body does not resolve to an existing row."
  - id: ERR_REMITTANCE_DEPOSIT_NOT_FOUND
    http: 404
    condition: "A remittance deposit id in the path does not resolve to an existing row."
  - id: ERR_COMPLIANCE_TEST_NOT_FOUND
    http: 404
    condition: "A compliance test id in the path does not resolve to an existing row."
  - id: ERR_PLAN_FILING_NOT_FOUND
    http: 404
    condition: "A plan filing id in the path does not resolve to an existing row."
  - id: ERR_EXIT_TRANSFER_NOT_FOUND
    http: 404
    condition: "An exit transfer id in the path does not resolve to an existing row."

  # ---- request shape (priority 7) ---------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "A required input field is missing, mistyped, outside its declared range, not a declared enum member, or not ISO-8601; or a pagination parameter is malformed."

  # ---- optimistic concurrency (priorities 8-9) --------------------------------
  - id: ERR_STALE_EMPLOYER_VERSION
    http: 412
    condition: "expected_adopting_employer_version does not equal the AdoptingEmployer's current version."
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_document_version does not equal the PlanDocument's current version."

  # ---- state (priorities 10-23) -----------------------------------------------
  - id: ERR_PROVIDER_NOT_PENDING
    http: 409
    condition: "Registration is attempted on a provider whose registration_status is already REGISTERED."
  - id: ERR_PLAN_ALREADY_ACTIVE
    http: 409
    condition: "Activation is attempted on a plan document that is not in status DRAFT."
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "An operation that presumes a live plan (employer onboarding, filings, fee disclosures) is attempted while the plan document is still DRAFT."
  - id: ERR_ALLOCATION_ALREADY_ACKNOWLEDGED
    http: 409
    condition: "Acknowledgement is attempted on a REVOKED allocation, or on an allocation whose acknowledged_at is already set."
  - id: ERR_ELECTION_INVALID_STATE
    http: 409
    condition: "An election action is attempted from the wrong status: submit outside DRAFT or RETURNED, return or approve outside SUBMITTED, or any action on a SUPERSEDED or APPROVED election."
  - id: ERR_EMPLOYER_INVALID_STATE
    http: 409
    condition: "An employer-scoped action is attempted from the wrong adoption_status: election creation outside APPLIED / ELECTIONS_SUBMITTED / RETURNED_FOR_REVISION, payroll, census or exit request outside ACTIVE, or any action on an EXITED employer."
  - id: ERR_BATCH_INVALID_STATE
    http: 409
    condition: "Validation is attempted on a batch that is not RECEIVED, or a deposit is created or posted against a batch that is not VALIDATED."
  - id: ERR_DEPOSIT_INVALID_STATE
    http: 409
    condition: "Posting is attempted on a deposit that is not PENDING, or reversal, correction computation or funding is attempted on a deposit that is not POSTED."
  - id: ERR_DEPOSIT_NOT_REVERSIBLE
    http: 409
    condition: "Reversal is attempted on a POSTED deposit whose timeliness_status is already CORRECTION_COMPUTED or CORRECTED."
  - id: ERR_CORRECTION_INVALID_STATE
    http: 409
    condition: "compute-correction is attempted on a deposit that is not LATE, or fund-correction on a deposit whose timeliness_status is not CORRECTION_COMPUTED."
  - id: ERR_TEST_INVALID_STATE
    http: 409
    condition: "A compliance test is run when its status is not SCHEDULED."
  - id: ERR_FILING_INVALID_STATE
    http: 409
    condition: "A filing action is attempted from the wrong filing_status, or a branch that has already cleared is cleared again (double attest, double certify)."
  - id: ERR_AUDIT_NOT_REQUIRED
    http: 409
    condition: "Attestation is attempted on a filing whose audit_required is false, so no audit branch exists to clear."
  - id: ERR_TRANSFER_INVALID_STATE
    http: 409
    condition: "An exit transfer action is attempted from the wrong status: approve outside REQUESTED, settle outside APPROVED, reverse outside SETTLED."

  # ---- business safety (priorities 24-30) -------------------------------------
  - id: ERR_FIDELITY_BOND_BELOW_FLOOR
    http: 422
    condition: "fidelity_bond_amount_cents is below the ERISA 412 statutory floor of 100000 cents."
  - id: ERR_PROVIDER_NOT_REGISTERED
    http: 409
    condition: "A plan document is created or activated while its sponsoring pooled plan provider is still PENDING_REGISTRATION."
  - id: ERR_NAMED_FIDUCIARY_NOT_ACKNOWLEDGED
    http: 409
    condition: "Plan activation is attempted with no acknowledged ALLOCATED NAMED_FIDUCIARY_3_16 allocation on the plan."
  - id: ERR_TRUSTEE_NOT_ACKNOWLEDGED
    http: 409
    condition: "Plan activation is attempted with no acknowledged ALLOCATED TRUSTEE_403A allocation on the plan."
  - id: ERR_PLAN_COMPLIANCE_FROZEN
    http: 409
    condition: "A plan-level regulatory action is attempted while compliance_posture is FROZEN (two or more suspended adopting employers)."
  - id: ERR_PLAN_LEVEL_TEST_OUTSTANDING
    http: 409
    condition: "A filing is prepared while a PLAN_LEVEL compliance test for the same plan year is still SCHEDULED."
  - id: ERR_AUDIT_OPINION_UNACCEPTABLE
    http: 409
    condition: "A filing is submitted with audit_required true and audit_opinion DISCLAIMER."

  # ---- business referential (priorities 31-39) --------------------------------
  - id: ERR_NOT_AN_AUDITOR_FIRM
    http: 409
    condition: "audit_firm_service_provider_id names a provider whose provider_type is not AUDITOR_FIRM, or one not engaged on this plan."
  - id: ERR_AUDITOR_NOT_INDEPENDENT
    http: 409
    condition: "The attesting auditor firm holds an ALLOCATED fiduciary role on the plan, or is affiliated in either direction with a provider that does."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "audit_firm_service_provider_id equals the filing's prepared_by_user_id — the provider that prepared the annual return may not audit it."
  - id: ERR_EMPLOYER_ELECTIONS_INCOMPLETE
    http: 409
    condition: "Employer data is certified while some non-EXITED employer of the plan has no APPROVED plan design election — including an employer still in APPLIED that was admitted after the filing was prepared."
  - id: ERR_TEST_SCOPE_MISMATCH
    http: 422
    condition: "adopting_employer_id is supplied for a PLAN_LEVEL test, or omitted for an EMPLOYER_LEVEL test."
  - id: ERR_EMPLOYER_PLAN_MISMATCH
    http: 409
    condition: "A referenced adopting employer does not belong to the referenced plan document."
  - id: ERR_NOT_PLAN_RECORDKEEPER
    http: 409
    condition: "The acting service provider is not engaged on the batch's plan with provider_type RECORDKEEPER."
  - id: ERR_INVALID_AFFILIATION
    http: 422
    condition: "affiliated_service_provider_id names a provider on a different plan, or the row's own id."
  - id: ERR_NO_BILLABLE_SERVICE_PROVIDER
    http: 409
    condition: "A fee disclosure is issued for a plan on which every engaged service provider charges direct_fee_cents_per_participant == 0, so gross direct fees are zero and there is nothing to allocate."

  # ---- business temporal (priorities 40-51) -----------------------------------
  - id: ERR_INVALID_PAY_PERIOD
    http: 422
    condition: "pay_period_end is not strictly after pay_period_start, or pay_date precedes pay_period_start."
  - id: ERR_PAY_PERIOD_OVERLAP
    http: 409
    condition: "The half-open pay period overlaps another payroll batch of the same employer; exact adjacency (end == next start) is allowed."
  - id: ERR_WITHHOLDING_DATE_OUT_OF_PERIOD
    http: 422
    condition: "withholding_date precedes pay_period_start or falls more than 31 calendar days after pay_period_end."
  - id: ERR_DEPOSIT_DATE_OUT_OF_RANGE
    http: 422
    condition: "deposit_date is in the logical-clock future or precedes the batch's withholding_date."
  - id: ERR_INVALID_RECOVERY_DATE
    http: 422
    condition: "recovery_date precedes the deposit's deposit_date or is in the logical-clock future."
  - id: ERR_INVALID_ALLOCATION_WINDOW
    http: 422
    condition: "effective_to precedes effective_from."
  - id: ERR_ALLOCATION_WINDOW_OVERLAP
    http: 409
    condition: "The new closed allocation window overlaps the incumbent ALLOCATED window for the same (plan, fiduciary_role); touching at a single day is an overlap."
  - id: ERR_INVALID_BLACKOUT_WINDOW
    http: 422
    condition: "blackout_end_date precedes blackout_start_date, or requested_exit_date precedes blackout_end_date."
  - id: ERR_BLACKOUT_WINDOW_CONFLICT
    http: 409
    condition: "The requested blackout window overlaps or falls within 5 calendar days of another non-REVERSED exit transfer's blackout window on the same plan."
  - id: ERR_ELECTION_WINDOW_CLOSED
    http: 409
    condition: "An election is submitted after the employer's election_window_close_date."
  - id: ERR_BLACKOUT_NOT_ENDED
    http: 409
    condition: "Settlement is attempted on or before blackout_end_date."
  - id: ERR_INVALID_DISCLOSURE_PERIOD
    http: 422
    condition: "disclosure_period_end precedes disclosure_period_start."

  # ---- business constraint (priorities 52-65) ---------------------------------
  - id: ERR_DUPLICATE_PROVIDER_EIN
    http: 409
    condition: "Another pooled plan provider already carries this ein."
  - id: ERR_DUPLICATE_PLAN_NUMBER
    http: 409
    condition: "The provider already sponsors a plan document with this plan_number."
  - id: ERR_DUPLICATE_EMPLOYER_EIN
    http: 409
    condition: "The plan already has an adopting employer with this ein."
  - id: ERR_DUPLICATE_PAYROLL_REFERENCE
    http: 409
    condition: "The employer already delivered a batch with this payroll_provider_reference."
  - id: ERR_DUPLICATE_FILING_YEAR
    http: 409
    condition: "The plan already has a filing for this plan_year."
  - id: ERR_DUPLICATE_COMPLIANCE_TEST
    http: 409
    condition: "A non-CLOSED compliance test already exists for this (plan, test_type, scope, plan_year, employer) tuple."
  - id: ERR_TIER_FIELDS_MISMATCH
    http: 422
    condition: "The four tier fields are not all present for DISCRETIONARY_TIERED, or are supplied for a non-tiered formula code."
  - id: ERR_TIER_LIMITS_OUT_OF_ORDER
    http: 422
    condition: "match_tier_2_limit_pct is below match_tier_1_limit_pct."
  - id: ERR_SIGNATORY_REQUIRED
    http: 422
    condition: "signatory_name is missing or blank at election submission."
  - id: ERR_ELIGIBILITY_MORE_RESTRICTIVE
    http: 409
    condition: "The employer elects an eligibility age or service requirement stricter than the plan document's base terms."
  - id: ERR_VESTING_MORE_RESTRICTIVE
    http: 409
    condition: "The employer elects a vesting schedule less generous than the plan document's base schedule."
  - id: ERR_CENSUS_INCONSISTENT
    http: 422
    condition: "A benefiting count exceeds its population, nhce_count is 0, or hce_count + nhce_count does not equal participant_count."
  - id: ERR_NO_APPROVED_ELECTION
    http: 409
    condition: "A payroll batch is delivered, or an EMPLOYER_LEVEL compliance test is scheduled, for an employer with no APPROVED plan design election, so its elected match formula and nondiscrimination track are undefined."
  - id: ERR_MATCH_MISMATCH
    http: 409
    condition: "total_match_cents disagrees with the match the employer's elected formula produces for this batch."

  # ---- business fiscal (priorities 66-71) -------------------------------------
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 409
    condition: "amount_cents differs from the parent batch's batch_total_cents; partial remittances are refused."
  - id: ERR_OPEN_LATE_DEPOSIT_CORRECTION
    http: 409
    condition: "The employer still has a POSTED deposit whose timeliness_status is LATE or CORRECTION_COMPUTED."
  - id: ERR_UNREMITTED_CONTRIBUTIONS
    http: 409
    condition: "The employer still has a VALIDATED payroll batch awaiting remittance."
  - id: ERR_FIDELITY_BOND_INSUFFICIENT
    http: 409
    condition: "The sponsoring provider's fidelity_bond_amount_cents is below the filing's computed fidelity_bond_minimum_cents."
  - id: ERR_FORM_5330_REFERENCE_REQUIRED
    http: 422
    condition: "The correction carries excise_tax_cents above 0 but no form_5330_reference was supplied at funding."
  - id: ERR_FILING_ALREADY_SUBMITTED
    http: 409
    condition: "An exit transfer reversal is attempted after the plan's return for the affected plan year has been FILED."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegulatorOps
    description: "The government-side operator: it admits pooled plan providers to the register and accepts the plan's annual return. It never touches employer or contribution data."
    identity: "opaque"
    exclusive_operations:
      - "POST /pep/plan-providers (create a provider registration record)"
      - "POST /pep/plan-providers/{id}/register (grant registration and mint the registration number)"
      - "POST /pep/plan-filings/{id}/file (accept the annual return)"
      - "POST /_clock/set_current_utc (move the logical clock)"
    shared_operations:
      - "GET on every entity in the domain for oversight"

  - name: PooledPlanProvider
    description: "The pooled plan provider: it authors the single plan document, engages service providers, allocates statutory fiduciary functions, onboards and reviews adopting employers, certifies employer-level filing data, approves and settles exits, and issues fee disclosures. It cannot prepare, attest or file the annual return."
    identity: "entity_backed:PooledPlanProvider"
    exclusive_operations:
      - "POST /pep/plan-documents and POST /pep/plan-documents/{id}/activate"
      - "POST /pep/service-providers"
      - "POST /pep/fiduciary-role-allocations"
      - "POST /pep/adopting-employers"
      - "POST /pep/plan-design-elections/{id}/return and POST /pep/plan-design-elections/{id}/approve"
      - "POST /pep/compliance-tests"
      - "POST /pep/plan-filings and POST /pep/plan-filings/{id}/certify-employer-data"
      - "POST /pep/exit-transfers/{id}/approve, /settle and /reverse"
      - "POST /pep/fee-disclosures"
    shared_operations:
      - "PATCH /pep/adopting-employers/{id}/census (shared with AdoptingEmployer)"
      - "GET on its own provider row, plan documents and every descendant"

  - name: AdoptingEmployer
    description: "An employer that has adopted the pooled plan: it elects its own eligibility, vesting and match terms inside the common document, delivers payroll, remits contributions, funds late-deposit corrections, and requests exit. It acts only on its own records."
    identity: "entity_backed:AdoptingEmployer"
    exclusive_operations:
      - "POST /pep/plan-design-elections and POST /pep/plan-design-elections/{id}/submit"
      - "POST /pep/payroll-batches"
      - "POST /pep/remittance-deposits"
      - "POST /pep/remittance-deposits/{id}/fund-correction"
      - "POST /pep/exit-transfers"
    shared_operations:
      - "PATCH /pep/adopting-employers/{id}/census (shared with PooledPlanProvider)"
      - "GET on its own employer row, elections, batches, deposits, tests and exits, plus the plan document and its fee disclosures"

  - name: ServiceProvider
    description: "A firm engaged on the plan (recordkeeper, TPA, trustee, investment manager or audit firm): it acknowledges the fiduciary functions allocated to it, reconciles and posts contributions, computes late-deposit corrections, runs compliance tests, and prepares the annual return."
    identity: "entity_backed:ServiceProvider"
    exclusive_operations:
      - "POST /pep/fiduciary-role-allocations/{id}/acknowledge"
      - "POST /pep/payroll-batches/{id}/validate"
      - "POST /pep/remittance-deposits/{id}/post, /reverse and /compute-correction"
      - "POST /pep/compliance-tests/{id}/run"
      - "POST /pep/plan-filings/{id}/prepare"
    shared_operations:
      - "GET on the plan documents it is engaged on, its own allocations, and the batches and deposits it services"

  - name: IndependentAuditor
    description: "The independent qualified public accountant that performs the plan-level single audit. It only attests, and only when the firm it names is independent of every ALLOCATED fiduciary and did not prepare the return."
    identity: "opaque"
    exclusive_operations:
      - "POST /pep/plan-filings/{id}/attest"
    shared_operations:
      - "GET on the plan document, its service providers, employers, compliance tests and filings"
