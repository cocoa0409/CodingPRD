  - section: rbac
    instances:
      - name: caseworker_cannot_create_representative
        claim_type: Cannot perform other role's exclusive op
        grounds: ["roles.Caseworker", "roles.OfficeAdmin", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /representatives as Caseworker returns 403 ERR_UNAUTHORIZED (OfficeAdmin-exclusive)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /representatives"
              payload: { full_name: "X", chamber: "HOUSE", district_name: "NY-18", state_code: "NY", office_email: "x@leg.gov" }
              as: Caseworker
          assert:
            - "Response is 403 with data.error_id == ERR_UNAUTHORIZED"

      - name: constituent_cannot_read_others_case
        claim_type: Ownership denial
        grounds: ["roles.Constituent", "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Constituent GETting another constituent's case (X-User-ID != case.constituent_id) returns 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Two constituents; a case owned by the first."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AR", chamber: "HOUSE", district_name: "NY-19", state_code: "NY", office_email: "ar@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Owner", email: "own@x.com", address: "o" }
              as: OfficeAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Other", email: "oth@x.com", address: "p" }
              as: OfficeAdmin
              captures: { other_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${owner_id}", subject: "S", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Constituent
              as_user_id: "${other_id}"
          assert:
            - "Response is 403 with data.error_id == ERR_FORBIDDEN"

      - name: anonymous_self_registration_allowed
        claim_type: Shared operation permitted
        grounds: ["roles.Anonymous", "endpoints.POST_/constituents"]
        distinguishing_aspect: "POST /constituents as Anonymous succeeds with 201, confirming the self-service registration surface."
        test_recipe:
          setup: ["A representative exists."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AS", chamber: "HOUSE", district_name: "NY-20", state_code: "NY", office_email: "as@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Self Cy", email: "self@x.com", address: "q" }
              as: Anonymous
              captures: { con_id: $.data.id }
          assert:
            - "Response is 201; Constituent.${con_id}.status == ACTIVE"

  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: event_reschedule_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-reschedule-stale-version]", "endpoints.POST_/events/{id}/reschedule", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one successful reschedule bumps Event.version 1->2, a second reschedule still carrying expected_event_version=1 returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A scheduled event (version 1) with a free calendar so overlap checks pass on reschedule."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AT", chamber: "HOUSE", district_name: "NY-21", state_code: "NY", office_email: "at@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V AT", capacity: 60 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T11:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/reschedule"
              payload: { expected_event_version: "${ev_v0}", start_at: "2026-09-01T14:00:00Z", end_at: "2026-09-01T15:00:00Z" }
              as: OfficeAdmin
          trigger:
            - call: "POST /events/${event_id}/reschedule"
              payload: { expected_event_version: "${ev_v0}", start_at: "2026-09-01T16:00:00Z", end_at: "2026-09-01T17:00:00Z" }
              as: OfficeAdmin
          assert:
            - "Response is 412 with data.error_id == ERR_STALE_VERSION"

      - name: event_reschedule_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-reschedule-stale-version]", "endpoints.POST_/events/{id}/reschedule", "entities.Event.fields.version"]
        distinguishing_aspect: "A reschedule carrying the current expected_event_version succeeds and increments Event.version by 1."
        test_recipe:
          setup: ["A scheduled event (version 1)."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AU", chamber: "HOUSE", district_name: "NY-22", state_code: "NY", office_email: "au@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V AU", capacity: 60 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T11:00:00Z", capacity: 10 }
              as: OfficeAdmin
              captures: { event_id: $.data.id, ev_v0: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/reschedule"
              payload: { expected_event_version: "${ev_v0}", start_at: "2026-09-02T14:00:00Z", end_at: "2026-09-02T15:00:00Z" }
              as: OfficeAdmin
          assert:
            - "Response is 200; Event.${event_id}.version == 2 and start_at == \"2026-09-02T14:00:00.000Z\""

