            - { call: "POST /api/nonconformance-reports/${ncr_id}/disposition", payload: { disposition: "REWORK", fault: "INTERNAL" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-CN", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/capas", payload: { capa_code: "CAPA-CN", dmr_id: "${dmr_id}", source_type: "NCR", source_ncr_id: "${ncr_id}", process_change: false }, as: QualityEngineer, as_user_id: "qe-alice", captures: { capa_id: "$.data.id" } }
            - { call: "POST /api/capas/${capa_id}/begin-investigation", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
