      - name: suspension_decide_guards_fire_in_declared_priority_order
        claim_type: priority_conflict
        grounds:
          - validations.priority_33.ERR_PROCEEDING_STATE_INVALID
          - validations.priority_46.ERR_DECIDER_NOT_INDEPENDENT
          - validations.priority_48.ERR_SUSPENSION_UNSUPPORTED
          - validations.priority_66.ERR_RESPONSE_WINDOW_CLOSED
          - validations.priority_69.ERR_SUSPENSION_START_IN_PAST
          - errors.ERR_DUE_PROCESS_INCOMPLETE
        distinguishing_aspect: "One manually proposed proceeding exercises the whole decide ladder in order: state (33) pre-empts the due-process guard (47) so a decide from NOTICE_SENT is a 409 rather than a 422; decider independence (46) pre-empts both the past-start check (69) and the unsupported-conduct check (48); and the rider response window is inclusive on its last day (2026-08-19 accepted, 2026-08-20 refused)."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; rider with two unexcused NO_SHOWs (4 points, 2 misses) so the conduct record does NOT support a suspension"
            - "co-1 raises a MANUAL proceeding; notice sent at clock 2026-08-05 so response_deadline_date == 2026-08-19"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Jules Amadi", date_of_birth: "1986-06-26", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-10", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-17", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { rider_v: $.data.version, pts: $.data.no_show_points_event_basis }
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${rider_v}", review_window_end_date: "2026-08-31", grounds_note: "pattern of missed trips" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { proc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /suspension-proceedings/${proc_id}/send-notice"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { deadline: $.data.response_deadline_date }
          trigger:
            - call: "POST /suspension-proceedings/${proc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-09-01" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { state_before_due_process_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /suspension-proceedings/${proc_id}/respond"
              payload: { rider_response_note: "late reply" }
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { window_closed_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /suspension-proceedings/${proc_id}/respond"
              payload: { rider_response_note: "on the last permitted day" }
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { responded_status: $.data.status, responded_at: $.data.rider_response_at }
            - call: "POST /suspension-proceedings/${proc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-09-01" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { decider_err: $.data.error_id }
            - call: "POST /suspension-proceedings/${proc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-08-18" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { past_start_err: $.data.error_id }
            - call: "POST /suspension-proceedings/${proc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-09-01" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { unsupported_err: $.data.error_id }
            - call: "POST /suspension-proceedings/${proc_id}/rescind"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { rescind_state_err: $.data.error_id }
          assert:
            - "${pts} == 4 and ${deadline} == \"2026-08-19\""
            - "the decide from NOTICE_SENT returns HTTP 409 with data.error_id == \"ERR_PROCEEDING_STATE_INVALID\" — priority 33 pre-empts ERR_DUE_PROCESS_INCOMPLETE (47), which is why the 422 is never observed on this path"
            - "the response on 2026-08-20 returns HTTP 422 with data.error_id == \"ERR_RESPONSE_WINDOW_CLOSED\" and the proceeding stays NOTICE_SENT"
            - "the response on 2026-08-19 returns HTTP 200 with ${responded_status} == \"RIDER_RESPONDED\" and ${responded_at} == \"2026-08-19T00:00:00.000Z\" (the deadline day is inclusive)"
            - "the decide by co-1 (the proposer) returns HTTP 422 with data.error_id == \"ERR_DECIDER_NOT_INDEPENDENT\", even though the same request would also fail the conduct check"
            - "the decide by co-2 with start 2026-08-18 returns HTTP 422 with data.error_id == \"ERR_SUSPENSION_START_IN_PAST\" (priority 69 before the priority-48 conduct check)"
            - "the decide by co-2 with start 2026-09-01 returns HTTP 422 with data.error_id == \"ERR_SUSPENSION_UNSUPPORTED\" (4 points < 6, 2 misses < 3)"
            - "the rescind returns HTTP 409 with data.error_id == \"ERR_PROCEEDING_STATE_INVALID\" (rescind requires UPHELD_PENDING or ACTIVE)"
            - "SuspensionProceeding.${proc_id}.status == \"RIDER_RESPONDED\", decision == null, duration_days == 0; Applicant.${rider_id}.service_status == \"ACTIVE\" and prior_upheld_suspension_count == 0"

