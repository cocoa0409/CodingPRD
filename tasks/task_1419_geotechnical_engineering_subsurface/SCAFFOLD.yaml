scenario: |
  Geotechnical Engineering & Subsurface Investigation (geotechnical engineering firm): scope & boring plan development, drilling subcontractor & utility clearance coordination, sampling, lab testing & soil classification, foundation recommendation & bearing capacity analysis, groundwater/settlement/seismic considerations, report issuance & construction-phase observation, changed-condition claim support, additional exploration authorization

domain_name: geotechnical-subsurface
api_prefix: /geo

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }

  - name: Project
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: site_address, type: string, source: input, description: "Site street address" }
      - { name: target_report_date, type: datetime, source: input, description: "Contractual report due date" }
      - { name: base_fee_cents, type: integer, source: input, description: "Fixed base services fee in cents" }
      - { name: additional_auth_cap_cents, type: integer, source: input, description: "Client-negotiated cap on cumulative APPROVED additional exploration authorization amounts" }
      - { name: assumed_gwt_depth_ft, type: number, source: input, description: "Assumed groundwater table depth used in preliminary analysis" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCOPED | FIELD_AUTHORIZED | FIELDWORK | LAB_ANALYSIS | REPORT_REVIEW | ISSUED | CONSTRUCTION_SUPPORT | CLOSED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | FROZEN | CLAIM_REVIEW — FROZEN when any clearance on active-plan borings is CONFLICT_MARKED; else CLAIM_REVIEW when any claim is UNDER_REVIEW or SUBSTANTIATED; else OPEN. FROZEN > CLAIM_REVIEW > OPEN." }
      - { name: additional_committed_cents, type: integer, source: computed, description: "Sum of authorized_amount_cents over ExplorationAuthorization in {APPROVED} (EXHAUSTED keeps its amount committed)" }
      - { name: claims_exposure_cents, type: integer, source: computed, description: "Sum of claimed_amount_cents over claims UNDER_REVIEW plus quantum_report_baseline_cents over claims SUBSTANTIATED; 0 otherwise" }
      - { name: testing_invoice_cents, type: integer, source: computed, description: "Sum of LabTestOrder.fee_cents (per-line rounded) over all orders of the project in any status" }
      - { name: total_fee_cents, type: integer, source: computed, description: "Base fee + testing invoice minus volume discount; see calculation project_total_fee" }

  - name: BoringPlan
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project (path-scoped)" }
      - { name: revision_no, type: integer, source: system, description: "1-based per-project revision counter, assigned at creation as max(existing)+1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | LOCKED | SUPERSEDED" }
      - { name: planned_boring_count, type: integer, source: input, description: "Number of borings in scope" }
      - { name: planned_total_footage_ft, type: number, source: input, description: "Total planned drilling footage" }
      - { name: supersedes_plan_id, type: string, source: input, description: "FK -> BoringPlan.id; optional pointer to the plan revision this one replaces", default: null }
      - { name: mobilization_charged, type: boolean, source: system, description: "True once the first boring of this plan reaches DRILLED and mobilization fee has been billed", default: false }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Drilling subcontractor legal name" }
      - { name: license_no, type: string, source: input, description: "Driller license number; unique across subcontractors" }
      - { name: day_rate_cents, type: integer, source: input, description: "Standby day rate in cents" }
      - { name: max_concurrent_rigs, type: integer, source: input, description: "Maximum rigs deployable at once" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING | SUSPENDED; GOOD_STANDING at creation", default: GOOD_STANDING }
      - { name: committed_rig_hours, type: number, source: computed, description: "Sum of (window_end - window_start) in hours over own RigAssignment in {SCHEDULED, MOBILIZED}" }

  - name: RigAssignment
    parent: null
    common_fields: true
    fields:
      - { name: boring_id, type: string, source: input, description: "FK -> Boring.id; boring the rig is assigned to (path-scoped)" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; drilling firm owning the rig" }
      - { name: window_start, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open window end (exclusive); must be strictly after window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | MOBILIZED | DEMOBILIZED | CANCELLED" }

  - name: UtilityClearance
    parent: Boring
    common_fields: true
    fields:
      - { name: boring_id, type: string, source: input, description: "FK -> Boring.id; boring this ticket clears (path-scoped)" }
      - { name: ticket_number, type: string, source: input, description: "One-call (811) ticket number; unique per boring" }
      - { name: issued_on, type: datetime, source: input, description: "Ticket issue timestamp" }
      - { name: valid_days, type: integer, source: input, description: "Days the ticket remains valid", default: 14 }
      - { name: expires_on, type: datetime, source: computed, description: "issued_on + valid_days * 24h; ticket valid while current logical time <= expires_on (inclusive boundary)" }
      - { name: status, type: enum, source: system, description: "FILED | CLEARED | CONFLICT_MARKED | EXPIRED; EXPIRED is system-set when logical clock passes expires_on while status in {FILED, CLEARED}" }

  - name: Boring
    parent: BoringPlan
    common_fields: true
    fields:
      - { name: boring_plan_id, type: string, source: input, description: "FK -> BoringPlan.id; owning plan (path-scoped)" }
      - { name: offset_of_boring_id, type: string, source: input, description: "FK -> Boring.id; set only when created via the offsets endpoint (offset of a REFUSED boring)", default: null }
      - { name: boring_no, type: string, source: input, description: "Boring identifier within the plan (e.g. B-1)" }
      - { name: planned_depth_ft, type: number, source: input, description: "Planned termination depth" }
      - { name: access_difficult, type: boolean, source: input, description: "True if limited-access drilling surcharge applies", default: false }
      - { name: status, type: enum, source: system, description: "PLANNED | SCHEDULED | CLEARED | DRILLED | LOGGED | CLOSED | REFUSED | ABANDONED" }
      - { name: actual_depth_ft, type: number, source: system, description: "Set at DRILLED transition", default: null }
      - { name: rock_depth_ft, type: number, source: system, description: "Footage in rock (subset of actual_depth_ft), set at DRILLED", default: 0 }
      - { name: groundwater_depth_ft, type: number, source: system, description: "Measured groundwater depth, set at DRILLED", default: null }
      - { name: avg_n60, type: number, source: system, description: "Average corrected SPT N60 over the boring, set at DRILLED", default: null }
      - { name: refusal_depth_ft, type: number, source: system, description: "Depth at refusal, set at REFUSED; must be < planned_depth_ft", default: null }
      - { name: drilling_cost_cents, type: integer, source: computed, description: "Computed at DRILLED per calculation drilling_cost_estimate", default: null }

  - name: Sample
    parent: Boring
    common_fields: true
    fields:
      - { name: boring_id, type: string, source: input, description: "FK -> Boring.id; source boring (path-scoped)" }
      - { name: depth_top_ft, type: number, source: input, description: "Sample interval top depth; must be < depth_bottom_ft and <= boring actual_depth_ft" }
      - { name: depth_bottom_ft, type: number, source: input, description: "Sample interval bottom depth; must be > depth_top_ft and <= boring actual_depth_ft" }
      - { name: sampler_type, type: enum, source: input, description: "SPT | SHELBY | BULK | ROCK_CORE" }
      - { name: recovery_pct, type: number, source: input, description: "Recovery percentage 0-100 inclusive" }
      - { name: custody_status, type: enum, source: system, description: "COLLECTED | IN_TRANSIT | LAB_RECEIVED | CONSUMED | ARCHIVED | LOST" }
      - { name: uscs_class, type: enum, source: computed, description: "GW | GP | GM | GC | SW | SP | SM | SC | ML | CL | OL | MH | CH | OH | PT | null — set by uscs_classification once both SIEVE_ANALYSIS and ATTERBERG results are ACCEPTED for this sample; reset to null when either is REJECTED", default: null }

  - name: LabTestOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; billing project (path-scoped)" }
      - { name: sample_id, type: string, source: input, description: "FK -> Sample.id; sample under test; sample's boring must belong to this project" }
      - { name: test_type, type: enum, source: input, description: "MOISTURE_CONTENT | ATTERBERG | SIEVE_ANALYSIS | UNCONFINED_COMPRESSION | DIRECT_SHEAR | CONSOLIDATION | PROCTOR" }
      - { name: priority, type: enum, source: input, description: "STANDARD | RUSH; RUSH applies RUSH_MULT to the base fee", default: STANDARD }
      - { name: fee_cents, type: integer, source: computed, description: "round_half_up(base_fee[test_type] * (RUSH_MULT if RUSH else 1)) to whole cents, per calculation lab_invoice_total" }
      - { name: status, type: enum, source: system, description: "REQUESTED | AUTHORIZED | IN_TEST | RESULT_SUBMITTED | ACCEPTED | REJECTED" }
      - { name: rerun_count, type: integer, source: system, description: "Number of REJECTED -> IN_TEST reruns; capped at RERUN_MAX=2", default: 0 }

  - name: LabTestResult
    parent: LabTestOrder
    common_fields: true
    fields:
      - { name: lab_test_order_id, type: string, source: input, description: "FK -> LabTestOrder.id; order this result satisfies (path-scoped)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting LabTechnician" }
      - { name: percent_passing_200, type: number, source: input, description: "SIEVE_ANALYSIS: percent finer than No.200 sieve (0-100)", default: null }
      - { name: liquid_limit, type: number, source: input, description: "ATTERBERG: LL", default: null }
      - { name: plasticity_index, type: number, source: input, description: "ATTERBERG: PI", default: null }
      - { name: qu_psf, type: number, source: input, description: "UNCONFINED_COMPRESSION: unconfined compressive strength psf", default: null }
      - { name: moisture_content_pct, type: number, source: input, description: "MOISTURE_CONTENT: gravimetric water content", default: null }

  - name: FoundationAnalysis
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; subject project (path-scoped)" }
      - { name: method, type: enum, source: input, description: "ALLOWABLE_STRESS | LRFD" }
      - { name: fs_required, type: number, source: input, description: "Required factor of safety", default: 3.0 }
      - { name: footing_width_ft, type: number, source: input, description: "Design footing width B" }
      - { name: applied_bearing_psf, type: number, source: input, description: "Applied net bearing demand q" }
      - { name: bearing_capacity_provisional_psf, type: number, source: computed, description: "min(400 * n60_average, 8000); computed at creation per allowable_bearing_capacity provisional variant" }
      - { name: bearing_capacity_final_psf, type: number, source: computed, description: "min(max(9 * (qu/2) / fs_required, 1500), 12000) using qu from the latest ACCEPTED UNCONFINED_COMPRESSION result; null until VERIFIED", default: null }
      - { name: settlement_est_in, type: number, source: computed, description: "(applied_bearing_psf * footing_width_ft) / (1200 * n60_average); computed at VERIFIED", default: null }
      - { name: deep_foundation_required, type: boolean, source: computed, description: "true when settlement_est_in >= 1.0 (inclusive threshold)", default: null }
      - { name: data_status, type: enum, source: computed, description: "CURRENT | STALE; STALE when any LabTestOrder of the project is REJECTED or any boring reaches DRILLED while this analysis is VERIFIED; restored to CURRENT by a VERIFIED->VERIFIED refresh transition", default: CURRENT }
      - { name: status, type: enum, source: system, description: "PRELIMINARY | VERIFIED | SUPERSEDED" }

  - name: Report
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; subject project (path-scoped)" }
      - { name: revision_no, type: integer, source: system, description: "1-based per-project report revision counter" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the creating SeniorEngineer; the issuing PrincipalEngineer must differ (segregation of duties)" }
      - { name: sealed_by_pe_user_id, type: string, source: system, description: "X-User-ID of the issuing PrincipalEngineer; set at ISSUED", default: null }
      - { name: sealed_at, type: datetime, source: system, description: "Logical timestamp of issuance", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | TECH_REVIEW | PE_REVIEW | ISSUED | SUPERSEDED" }

  - name: ObservationVisit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project under construction-phase observation (path-scoped)" }
      - { name: visit_date, type: datetime, source: input, description: "Scheduled visit date; PERFORMED requires current logical time >= visit_date" }
      - { name: findings, type: enum, source: input, description: "CONSISTENT | MARGINAL | DIFFERING; supplied at FINDINGS_FILED", default: null }
      - { name: observed_bearing_psf, type: number, source: input, description: "Observed subgrade bearing; supplied at FINDINGS_FILED", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PERFORMED | FINDINGS_FILED | CLOSED" }

  - name: ChangedConditionClaim
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; subject project (path-scoped)" }
      - { name: observation_visit_id, type: string, source: input, description: "FK -> ObservationVisit.id; optional supporting visit; must belong to same project", default: null }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Contractor's claimed extra cost; must be >= 0" }
      - { name: basis_text, type: string, source: input, description: "Narrative basis for the differing site condition" }
      - { name: baseline_bearing_psf, type: number, source: computed, description: "Snapshot of the project's VERIFIED FoundationAnalysis.bearing_capacity_final_psf taken at claim creation; null if no VERIFIED analysis", default: null }
      - { name: quantum_report_baseline_cents, type: integer, source: computed, description: "Per changed_condition_quantum report_baseline variant; computed at UNDER_REVIEW", default: null }
      - { name: quantum_site_observed_cents, type: integer, source: computed, description: "Per changed_condition_quantum site_observed variant; computed at UNDER_REVIEW", default: null }
      - { name: awarded_amount_cents, type: integer, source: system, description: "Set at SETTLED", default: null }
      - { name: appeal_count, type: integer, source: system, description: "Number of REBUTTED -> UNDER_REVIEW appeals; capped at APPEAL_MAX=1", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | SUBSTANTIATED | REBUTTED | SETTLED" }

  - name: ExplorationAuthorization
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; authorizing project (path-scoped)" }
      - { name: authorized_amount_cents, type: integer, source: input, description: "Client-authorized additional exploration budget" }
      - { name: extra_boring_count, type: integer, source: input, description: "Number of offset borings this authorization permits beyond planned_boring_count" }
      - { name: consumed_boring_count, type: integer, source: system, description: "Offset borings created against this authorization", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REVOKED | EXHAUSTED" }

state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /geo/projects/{id}/transition {to: SCOPED}"
        actor: ProjectManager
        preconditions: ["At least one BoringPlan of this project is in APPROVED or LOCKED (ERR_PROJECT_STATE_FORBIDS)"]
        side_effects: ["increments Project.version by 1"]
      - from: SCOPED
        to: FIELD_AUTHORIZED
        trigger: "POST /geo/projects/{id}/transition {to: FIELD_AUTHORIZED}"
        actor: ProjectManager
        preconditions:
          - "At least one RigAssignment in SCHEDULED exists for a boring of the active plan (ERR_PROJECT_STATE_FORBIDS)"
          - "Every Boring of the active plan has at least one UtilityClearance in {FILED, CLEARED} (ERR_CLEARANCE_MISSING)"
        side_effects: ["increments Project.version by 1"]
      - from: FIELD_AUTHORIZED
        to: FIELDWORK
        trigger: "POST /geo/projects/{id}/transition {to: FIELDWORK}"
        actor: ProjectManager
        preconditions: ["posture != FROZEN (ERR_POSTURE_FROZEN)"]
        side_effects: ["increments Project.version by 1"]
      - from: FIELDWORK
        to: LAB_ANALYSIS
        trigger: "POST /geo/projects/{id}/transition {to: LAB_ANALYSIS}"
        actor: ProjectManager
        preconditions: ["Every Boring of the active plan is in {CLOSED, ABANDONED} (ERR_PROJECT_STATE_FORBIDS)"]
        side_effects: ["increments Project.version by 1"]
      - from: LAB_ANALYSIS
        to: REPORT_REVIEW
        trigger: "POST /geo/projects/{id}/transition {to: REPORT_REVIEW}"
        actor: SeniorEngineer
        preconditions:
          - "A FoundationAnalysis of this project is VERIFIED with data_status == CURRENT (ERR_ANALYSIS_NOT_VERIFIED)"
          - "Every LabTestOrder of this project is ACCEPTED (ERR_ORDER_STATE_FORBIDS)"
        side_effects: ["increments Project.version by 1"]
      - from: REPORT_REVIEW
        to: LAB_ANALYSIS
        trigger: "POST /geo/projects/{id}/transition {to: LAB_ANALYSIS}"
        actor: PrincipalEngineer
        preconditions: []
        side_effects: ["increments Project.version by 1", "reopens analysis scope (revision loop)"]
        note: "Cyclic revert: report deficiencies send the project back to analysis"
      - from: REPORT_REVIEW
        to: ISSUED
        trigger: "POST /geo/projects/{id}/transition {to: ISSUED}"
        actor: ProjectManager
        preconditions: ["The highest-revision Report of this project is ISSUED (ERR_REPORT_NOT_ISSUABLE)"]
        side_effects: ["increments Project.version by 1"]
      - from: ISSUED
        to: CONSTRUCTION_SUPPORT
        trigger: "POST /geo/projects/{id}/transition {to: CONSTRUCTION_SUPPORT}"
        actor: ClientRep
        preconditions: ["X-User-ID == project.client_id (ERR_FORBIDDEN_ROLE)"]
        side_effects: ["increments Project.version by 1"]
      - from: CONSTRUCTION_SUPPORT
        to: CLOSED
        trigger: "POST /geo/projects/{id}/transition {to: CLOSED}"
        actor: ProjectManager
        preconditions:
          - "No ChangedConditionClaim in {SUBMITTED, UNDER_REVIEW, SUBSTANTIATED} (ERR_CLAIM_STATE_FORBIDS)"
          - "Every ObservationVisit is CLOSED (ERR_INVALID_STATE)"
        side_effects: ["increments Project.version by 1"]

  - entity: BoringPlan
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /geo/boring-plans/{id}/transition {to: SUBMITTED}"
        actor: StaffEngineer
        preconditions: ["planned_boring_count >= 1 (ERR_VALIDATION)"]
        side_effects: ["increments BoringPlan.version by 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /geo/boring-plans/{id}/transition {to: DRAFT}"
        actor: ProjectManager
        preconditions: []
        side_effects: ["increments BoringPlan.version by 1"]
        note: "Cyclic revise loop: rejected plans return to DRAFT for rework"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /geo/boring-plans/{id}/transition {to: APPROVED}"
        actor: ProjectManager
        preconditions:
          - "project.status in {DRAFT, SCOPED} (ERR_PROJECT_STATE_FORBIDS)"
          - "No other BoringPlan of the same project in {APPROVED, LOCKED} (ERR_PLAN_ALREADY_ACTIVE)"
        side_effects:
          - "The previously APPROVED plan of the project (if any, when this plan names it via supersedes_plan_id) transitions to SUPERSEDED"
          - "increments BoringPlan.version by 1"
      - from: APPROVED
        to: LOCKED
        trigger: "system: first Boring of this plan reaches DRILLED"
        actor: system
        preconditions: []
        side_effects: ["increments BoringPlan.version by 1", "plan scope frozen; further borings only via offsets"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a later revision of the same project is APPROVED while naming this plan in supersedes_plan_id"
        actor: system
        preconditions: []
        side_effects: ["increments BoringPlan.version by 1"]

  - entity: Subcontractor
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "POST /geo/subcontractors/{id}/transition {to: SUSPENDED}"
        actor: FirmAdmin
        preconditions: []
        side_effects: ["increments Subcontractor.version by 1"]
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "POST /geo/subcontractors/{id}/transition {to: GOOD_STANDING}"
        actor: FirmAdmin
        preconditions: []
        side_effects: ["increments Subcontractor.version by 1"]

  - entity: RigAssignment
    initial_state: SCHEDULED
    terminal_states: [DEMOBILIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: MOBILIZED
        trigger: "POST /geo/rig-assignments/{id}/transition {to: MOBILIZED}"
        actor: DrillingSub
        preconditions:
          - "X-User-ID == assignment.subcontractor_id (ERR_FORBIDDEN_ROLE)"
          - "subcontractor.standing == GOOD_STANDING (ERR_STANDING_SUSPENDED)"
          - "project.posture != FROZEN (ERR_POSTURE_FROZEN)"
        side_effects: ["increments RigAssignment.version by 1"]
      - from: MOBILIZED
        to: DEMOBILIZED
        trigger: "POST /geo/rig-assignments/{id}/transition {to: DEMOBILIZED}"
        actor: DrillingSub
        preconditions: ["X-User-ID == assignment.subcontractor_id (ERR_FORBIDDEN_ROLE)"]
        side_effects:
          - "increments RigAssignment.version by 1"
          - "Subcontractor.committed_rig_hours decreases by (window_end - window_start) hours"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /geo/rig-assignments/{id}/transition {to: CANCELLED}"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "increments RigAssignment.version by 1"
          - "Subcontractor.committed_rig_hours decreases by (window_end - window_start) hours (compensation)"
          - "boring stays SCHEDULED (a later assignment may re-cover it)"
      - from: MOBILIZED
        to: CANCELLED
        trigger: "POST /geo/rig-assignments/{id}/transition {to: CANCELLED}"
        actor: ProjectManager
        preconditions: ["boring.status not in {DRILLED, LOGGED, CLOSED} (ERR_INVALID_STATE)"]
        side_effects:
          - "increments RigAssignment.version by 1"
          - "Subcontractor.committed_rig_hours decreases by (window_end - window_start) hours (compensation)"

  - entity: UtilityClearance
    initial_state: FILED
    terminal_states: []
    transitions:
      - from: FILED
        to: CLEARED
        trigger: "POST /geo/clearances/{id}/transition {to: CLEARED}"
        actor: StaffEngineer
        preconditions: ["current logical time <= expires_on (ERR_CLEARANCE_EXPIRED)"]
        side_effects: ["increments UtilityClearance.version by 1"]
      - from: CONFLICT_MARKED
        to: CLEARED
        trigger: "POST /geo/clearances/{id}/transition {to: CLEARED}"
        actor: StaffEngineer
        preconditions: ["current logical time <= expires_on (ERR_CLEARANCE_EXPIRED)"]
        side_effects:
          - "increments UtilityClearance.version by 1"
          - "project.posture recomputed (FROZEN lifted when no other clearance is CONFLICT_MARKED)"
      - from: FILED
        to: CONFLICT_MARKED
        trigger: "POST /geo/clearances/{id}/transition {to: CONFLICT_MARKED}"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "increments UtilityClearance.version by 1"
          - "project.posture recomputed -> FROZEN (safety freeze; gates rig mobilization and drilling)"
      - from: CLEARED
        to: CONFLICT_MARKED
        trigger: "POST /geo/clearances/{id}/transition {to: CONFLICT_MARKED}"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "increments UtilityClearance.version by 1"
          - "project.posture recomputed -> FROZEN"
      - from: FILED
        to: EXPIRED
        trigger: "system: logical clock advance via POST /geo/_clock/set_current_utc lands strictly after expires_on"
        actor: system
        preconditions: []
        side_effects: ["increments UtilityClearance.version by 1"]
      - from: CLEARED
        to: EXPIRED
        trigger: "system: logical clock advance via POST /geo/_clock/set_current_utc lands strictly after expires_on"
        actor: system
        preconditions: []
        side_effects: ["increments UtilityClearance.version by 1"]

  - entity: Boring
    initial_state: PLANNED
    terminal_states: [CLOSED, REFUSED, ABANDONED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "system: POST /geo/borings/{id}/rig-assignments creates a SCHEDULED RigAssignment for this boring"
        actor: system
        preconditions: []
        side_effects: ["increments Boring.version by 1"]
      - from: SCHEDULED
        to: CLEARED
        trigger: "POST /geo/borings/{id}/transition {to: CLEARED}"
        actor: StaffEngineer
        preconditions:
          - "At least one UtilityClearance of this boring is CLEARED (ERR_CLEARANCE_MISSING)"
          - "That clearance has current logical time <= expires_on (ERR_CLEARANCE_EXPIRED)"
          - "project.posture != FROZEN (ERR_POSTURE_FROZEN)"
        side_effects: ["increments Boring.version by 1"]
      - from: CLEARED
        to: DRILLED
        trigger: "POST /geo/borings/{id}/transition {to: DRILLED}"
        actor: DrillingSub
        preconditions:
          - "project.status == FIELDWORK (ERR_PROJECT_STATE_FORBIDS)"
          - "A RigAssignment for this boring is MOBILIZED and X-User-ID == its subcontractor_id (ERR_RIG_NOT_MOBILIZED)"
          - "A CLEARED UtilityClearance of this boring has current logical time <= expires_on (ERR_CLEARANCE_EXPIRED)"
          - "project.posture != FROZEN (ERR_POSTURE_FROZEN)"
        side_effects:
          - "sets actual_depth_ft, rock_depth_ft, groundwater_depth_ft, avg_n60 from payload"
          - "computes drilling_cost_cents per drilling_cost_estimate (mobilization included when this is the first DRILLED boring of the plan)"
          - "BoringPlan transitions APPROVED -> LOCKED on first drill"
          - "any VERIFIED FoundationAnalysis of the project gets data_status = STALE"
          - "increments Boring.version by 1"
      - from: DRILLED
        to: LOGGED
        trigger: "POST /geo/borings/{id}/transition {to: LOGGED}"
        actor: FieldGeologist
        preconditions: ["At least one Sample of this boring exists in any custody_status (ERR_INVALID_STATE)"]
        side_effects: ["increments Boring.version by 1"]
      - from: LOGGED
        to: CLOSED
        trigger: "POST /geo/borings/{id}/transition {to: CLOSED}"
        actor: StaffEngineer
        preconditions: []
        side_effects: ["increments Boring.version by 1", "boring backfilled and sealed"]
      - from: DRILLED
        to: REFUSED
        trigger: "POST /geo/borings/{id}/transition {to: REFUSED, refusal_depth_ft}"
        actor: DrillingSub
        preconditions: ["refusal_depth_ft < planned_depth_ft (ERR_VALIDATION)"]
        side_effects: ["sets refusal_depth_ft", "increments Boring.version by 1"]
      - from: PLANNED
        to: ABANDONED
        trigger: "POST /geo/borings/{id}/transition {to: ABANDONED}"
        actor: ProjectManager
        preconditions: []
        side_effects: ["increments Boring.version by 1"]
      - from: SCHEDULED
        to: ABANDONED
        trigger: "POST /geo/borings/{id}/transition {to: ABANDONED}"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "any RigAssignment of this boring in {SCHEDULED, MOBILIZED} transitions to CANCELLED and releases its committed rig hours"
          - "increments Boring.version by 1"

  - entity: Sample
    initial_state: COLLECTED
    terminal_states: [CONSUMED, ARCHIVED, LOST]
    transitions:
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /geo/samples/{id}/transition {to: IN_TRANSIT}"
        actor: FieldGeologist
        preconditions: []
        side_effects: ["increments Sample.version by 1"]
      - from: IN_TRANSIT
        to: LAB_RECEIVED
        trigger: "POST /geo/samples/{id}/transition {to: LAB_RECEIVED}"
        actor: LabTechnician
        preconditions: []
        side_effects: ["increments Sample.version by 1"]
      - from: IN_TRANSIT
        to: LOST
        trigger: "POST /geo/samples/{id}/transition {to: LOST}"
        actor: FieldGeologist
        preconditions: []
        side_effects: ["increments Sample.version by 1"]
      - from: LAB_RECEIVED
        to: ARCHIVED
        trigger: "POST /geo/samples/{id}/transition {to: ARCHIVED}"
        actor: LabManager
        preconditions: ["No LabTestOrder of this sample is in {REQUESTED, AUTHORIZED, IN_TEST, RESULT_SUBMITTED, REJECTED} (ERR_INVALID_STATE)"]
        side_effects: ["increments Sample.version by 1"]
      - from: LAB_RECEIVED
        to: CONSUMED
        trigger: "system: a destructive LabTestOrder (UNCONFINED_COMPRESSION or DIRECT_SHEAR) of this sample reaches ACCEPTED"
        actor: system
        preconditions: []
        side_effects: ["increments Sample.version by 1"]

  - entity: LabTestOrder
    initial_state: REQUESTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /geo/lab-test-orders/{id}/transition {to: AUTHORIZED}"
        actor: LabManager
        preconditions: ["sample.custody_status == LAB_RECEIVED (ERR_SAMPLE_NOT_IN_LAB)"]
        side_effects: ["increments LabTestOrder.version by 1"]
      - from: AUTHORIZED
        to: IN_TEST
        trigger: "POST /geo/lab-test-orders/{id}/transition {to: IN_TEST}"
        actor: LabTechnician
        preconditions: ["Fewer than LAB_MAX_IN_TEST=6 LabTestOrders are currently IN_TEST (ERR_LAB_CAPACITY_EXCEEDED)"]
        side_effects: ["increments LabTestOrder.version by 1"]
      - from: IN_TEST
        to: RESULT_SUBMITTED
        trigger: "system: POST /geo/lab-test-orders/{id}/results creates a LabTestResult"
        actor: system
        preconditions: []
        side_effects: ["increments LabTestOrder.version by 1"]
      - from: RESULT_SUBMITTED
        to: ACCEPTED
        trigger: "POST /geo/lab-test-orders/{id}/transition {to: ACCEPTED}"
        actor: LabManager
        preconditions: []
        side_effects:
          - "if test_type in {UNCONFINED_COMPRESSION, DIRECT_SHEAR}: sample.custody_status -> CONSUMED"
          - "if SIEVE_ANALYSIS and ATTERBERG orders of the same sample are both ACCEPTED: recompute sample.uscs_class per uscs_classification"
          - "project.testing_invoice_cents and project.total_fee_cents recomputed"
          - "increments LabTestOrder.version by 1"
      - from: RESULT_SUBMITTED
        to: REJECTED
        trigger: "POST /geo/lab-test-orders/{id}/transition {to: REJECTED}"
        actor: LabManager
        preconditions: []
        side_effects:
          - "sample.uscs_class reset to null (link 1)"
          - "every VERIFIED FoundationAnalysis of the project gets data_status = STALE (link 2, caused by the classification reset)"
          - "report issuance is consequently blocked: POST /geo/reports/{id}/issue requires a VERIFIED analysis with data_status == CURRENT (link 3, caused by the analysis going STALE)"
          - "increments LabTestOrder.version by 1"
      - from: REJECTED
        to: IN_TEST
        trigger: "POST /geo/lab-test-orders/{id}/transition {to: IN_TEST}"
        actor: LabTechnician
        preconditions: ["rerun_count < RERUN_MAX=2 (ERR_RERUN_LIMIT)", "Fewer than LAB_MAX_IN_TEST=6 orders IN_TEST (ERR_LAB_CAPACITY_EXCEEDED)"]
        side_effects: ["rerun_count += 1", "increments LabTestOrder.version by 1"]
        note: "Cyclic rerun loop with a hard cap"

  - entity: FoundationAnalysis
    initial_state: PRELIMINARY
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: VERIFIED
        trigger: "POST /geo/foundation-analyses/{id}/transition {to: VERIFIED}"
        actor: SeniorEngineer
        preconditions:
          - "At least one LabTestOrder of the project with test_type == UNCONFINED_COMPRESSION is ACCEPTED (ERR_ANALYSIS_NOT_VERIFIED)"
          - "data_status == CURRENT (ERR_ANALYSIS_DATA_STALE)"
        side_effects:
          - "computes bearing_capacity_final_psf, settlement_est_in, deep_foundation_required"
          - "any other VERIFIED FoundationAnalysis of the project transitions to SUPERSEDED"
          - "increments FoundationAnalysis.version by 1"
      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /geo/foundation-analyses/{id}/transition {to: VERIFIED}"
        actor: SeniorEngineer
        preconditions: ["data_status == STALE (ERR_INVALID_STATE)"]
        side_effects: ["data_status -> CURRENT", "recomputes bearing_capacity_final_psf and settlement_est_in from current inputs", "increments FoundationAnalysis.version by 1"]
        note: "Self-loop refresh after stale lab data is cured"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system: another FoundationAnalysis of the same project is VERIFIED"
        actor: system
        preconditions: []
        side_effects: ["increments FoundationAnalysis.version by 1"]

  - entity: Report
    initial_state: DRAFT
    terminal_states: [ISSUED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: TECH_REVIEW
        trigger: "POST /geo/reports/{id}/transition {to: TECH_REVIEW}"
        actor: SeniorEngineer
        preconditions: []
        side_effects: ["increments Report.version by 1"]
      - from: TECH_REVIEW
        to: DRAFT
        trigger: "POST /geo/reports/{id}/transition {to: DRAFT}"
        actor: ProjectManager
        preconditions: []
        side_effects: ["increments Report.version by 1"]
        note: "Cyclic revision loop"
      - from: TECH_REVIEW
        to: PE_REVIEW
        trigger: "POST /geo/reports/{id}/transition {to: PE_REVIEW}"
        actor: ProjectManager
        preconditions: []
        side_effects: ["increments Report.version by 1"]
      - from: PE_REVIEW
        to: DRAFT
        trigger: "POST /geo/reports/{id}/transition {to: DRAFT}"
        actor: PrincipalEngineer
        preconditions: []
        side_effects: ["increments Report.version by 1"]
        note: "Cyclic revision loop (PE reject)"
      - from: PE_REVIEW
        to: ISSUED
        trigger: "POST /geo/reports/{id}/issue"
        actor: PrincipalEngineer
        preconditions:
          - "X-User-ID != report.prepared_by_user_id (ERR_SOD_PE_IS_PREPARER)"
          - "A FoundationAnalysis of the project is VERIFIED (ERR_ANALYSIS_NOT_VERIFIED)"
          - "That analysis has data_status == CURRENT (ERR_ANALYSIS_DATA_STALE)"
          - "Every LabTestOrder of the project is ACCEPTED (ERR_ORDER_STATE_FORBIDS)"
          - "expected_report_version == report.version (ERR_STALE_REPORT_VERSION)"
        side_effects:
          - "sets sealed_by_pe_user_id and sealed_at"
          - "any previously ISSUED Report of the project transitions to SUPERSEDED"
          - "increments Report.version by 1"

  - entity: ObservationVisit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /geo/observation-visits/{id}/transition {to: PERFORMED}"
        actor: StaffEngineer
        preconditions:
          - "project.status == CONSTRUCTION_SUPPORT (ERR_PROJECT_STATE_FORBIDS)"
          - "current logical time >= visit_date (ERR_VISIT_DATE_FUTURE)"
        side_effects: ["increments ObservationVisit.version by 1"]
      - from: PERFORMED
        to: FINDINGS_FILED
        trigger: "POST /geo/observation-visits/{id}/transition {to: FINDINGS_FILED, findings, observed_bearing_psf}"
        actor: StaffEngineer
        preconditions: []
        side_effects:
          - "sets findings and observed_bearing_psf"
          - "if findings == DIFFERING: system auto-creates a ChangedConditionClaim of the project in SUBMITTED with claimed_amount_cents = 0, basis_text = 'Auto-opened from differing-site-condition finding', observation_visit_id = this visit (link 1 of claim-intake cascade)"
          - "increments ObservationVisit.version by 1"
      - from: FINDINGS_FILED
        to: CLOSED
        trigger: "POST /geo/observation-visits/{id}/transition {to: CLOSED}"
        actor: ProjectManager
        preconditions: []
        side_effects: ["increments ObservationVisit.version by 1"]

  - entity: ChangedConditionClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /geo/claims/{id}/transition {to: UNDER_REVIEW}"
        actor: SeniorEngineer
        preconditions: []
        side_effects:
          - "computes quantum_report_baseline_cents and quantum_site_observed_cents per changed_condition_quantum"
          - "project.claims_exposure_cents recomputed (link 1)"
          - "project.posture recomputed -> CLAIM_REVIEW while any claim is UNDER_REVIEW or SUBSTANTIATED (link 2, caused by the exposure/state change)"
          - "increments ChangedConditionClaim.version by 1"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /geo/claims/{id}/transition {to: SUBSTANTIATED}"
        actor: SeniorEngineer
        preconditions: ["baseline_bearing_psf is not null (ERR_ANALYSIS_NOT_VERIFIED)"]
        side_effects: ["project.claims_exposure_cents recomputed (now uses quantum_report_baseline_cents)", "project.posture recomputed", "increments ChangedConditionClaim.version by 1"]
      - from: UNDER_REVIEW
        to: REBUTTED
        trigger: "POST /geo/claims/{id}/transition {to: REBUTTED}"
        actor: SeniorEngineer
        preconditions: []
        side_effects: ["project.claims_exposure_cents recomputed (claim contributes 0)", "project.posture recomputed", "increments ChangedConditionClaim.version by 1"]
      - from: REBUTTED
        to: UNDER_REVIEW
        trigger: "POST /geo/claims/{id}/transition {to: UNDER_REVIEW}"
        actor: SeniorEngineer
        preconditions: ["appeal_count < APPEAL_MAX=1 (ERR_APPEAL_LIMIT)"]
        side_effects: ["appeal_count += 1", "quanta recomputed", "project.claims_exposure_cents and posture recomputed", "increments ChangedConditionClaim.version by 1"]
        note: "Single-appeal cyclic loop"
      - from: SUBSTANTIATED
        to: SETTLED
        trigger: "POST /geo/claims/{id}/transition {to: SETTLED, awarded_amount_cents}"
        actor: ProjectManager
        preconditions: ["awarded_amount_cents >= 0 (ERR_VALIDATION)"]
        side_effects: ["sets awarded_amount_cents", "project.claims_exposure_cents recomputed (claim drops out)", "project.posture recomputed", "increments ChangedConditionClaim.version by 1"]

  - entity: ExplorationAuthorization
    initial_state: PROPOSED
    terminal_states: [REVOKED, EXHAUSTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /geo/exploration-authorizations/{id}/transition {to: APPROVED}"
        actor: ClientRep
        preconditions:
          - "X-User-ID == project.client_id (ERR_FORBIDDEN_ROLE)"
          - "project.additional_committed_cents + authorized_amount_cents <= project.additional_auth_cap_cents, inclusive (ERR_AUTH_CAP_EXCEEDED)"
          - "expected_project_version == project.version (ERR_STALE_PROJECT_VERSION)"
        side_effects:
          - "project.additional_committed_cents += authorized_amount_cents"
          - "increments Project.version by 1"
          - "increments ExplorationAuthorization.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /geo/exploration-authorizations/{id}/transition {to: REVOKED}"
        actor: ClientRep
        preconditions:
          - "X-User-ID == project.client_id (ERR_FORBIDDEN_ROLE)"
          - "consumed_boring_count == 0 (ERR_INVALID_STATE)"
          - "expected_project_version == project.version (ERR_STALE_PROJECT_VERSION)"
        side_effects:
          - "project.additional_committed_cents -= authorized_amount_cents (compensation)"
          - "increments Project.version by 1"
          - "increments ExplorationAuthorization.version by 1"
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system: consumed_boring_count reaches extra_boring_count via offset boring creation"
        actor: system
        preconditions: []
        side_effects: ["authorization amount remains in project.additional_committed_cents", "increments ExplorationAuthorization.version by 1"]

concurrency_rules:
  - rule_id: plan-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /geo/projects/{id}/boring-plans"
    occ_field: "expected_project_version"
    description: |
      Creating a BoringPlan revision against a Project whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a plan revision (which the next approval can
      legitimately supersede) and the current writer's view of the project is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: authorization-write-stale-project
    parent_entity: Project
    write_endpoint: "POST /geo/exploration-authorizations/{id}/transition"
    occ_field: "expected_project_version"
    description: |
      Approving or revoking an ExplorationAuthorization against a Project whose
      version has advanced since the client last observed it is rejected. The
      transition mutates project.additional_committed_cents, so a stale view of
      the committed total must not drive the cap check.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: report-issue-stale-report
    parent_entity: Report
    write_endpoint: "POST /geo/reports/{id}/issue"
    occ_field: "expected_report_version"
    description: |
      Issuing a Report whose version has advanced since the client last observed
      it is rejected. This captures the case where a reviewer has just cycled the
      report back to DRAFT and the issuer's view of the review state is stale.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

calculations:
  - name: n60_average
    trigger: "Recomputed whenever a Boring of the project's active plan (latest revision in {APPROVED, LOCKED}) reaches DRILLED; consumed by allowable_bearing_capacity and settlement_estimate"
    algorithm: aggregation
    formula: |
      n60_average = round_half_up( mean(boring.avg_n60 for borings of the active plan
                    whose status in {DRILLED, LOGGED, CLOSED, REFUSED}), 2 )
      Empty set -> analysis creation is rejected with ERR_VALIDATION (no DRILLED data).
    input_set: "Borings of the active BoringPlan with status in {DRILLED, LOGGED, CLOSED, REFUSED}"
    precision: "2 decimal places, round_half_up"

  - name: allowable_bearing_capacity
    trigger: "FoundationAnalysis creation (provisional variant) and PRELIMINARY -> VERIFIED transition (final variant)"
    algorithm: threshold
    formula: |
      provisional: q_allow_prov = min(PROV_PSF_PER_N * n60_average, PROV_CAP)
      final:       su = qu_psf / 2
                   q_ult = QULT_SU_FACTOR * su
                   q_allow_final = min( max(q_ult / fs_required, FINAL_MIN), FINAL_CAP )
      qu_psf is taken from the latest (created_at DESC, tie-break: none needed since
      created_at is unique per result submission) ACCEPTED UNCONFINED_COMPRESSION
      LabTestResult of the project.
    input_set: "Active-plan borings for n60_average; ACCEPTED UNCONFINED_COMPRESSION LabTestResults of the project for the final variant"
    constants:
      PROV_PSF_PER_N: 400
      PROV_CAP: 8000
      QULT_SU_FACTOR: 9
      FINAL_MIN: 1500
      FINAL_CAP: 12000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Analysis is PRELIMINARY (no lab-verified strength yet); SPT N60 correlation only"
        difference: "Uses n60_average * 400 capped at 8000; ignores lab qu_psf entirely"
      - name: final
        when: "Analysis transitions to VERIFIED"
        difference: "Uses Terzaghi-style 9*su/fs with floor 1500 and cap 12000; produces a different value than provisional for the same subsurface data (e.g. n60=12 gives 4800 provisional vs 6000 final for qu=4000, fs=3.0)"

  - name: settlement_estimate
    trigger: "FoundationAnalysis PRELIMINARY -> VERIFIED transition (and VERIFIED -> VERIFIED refresh)"
    algorithm: threshold
    formula: |
      settlement_est_in = (applied_bearing_psf * footing_width_ft) / (1200 * n60_average)
      deep_foundation_required = (settlement_est_in >= DEEP_FOUNDATION_THRESHOLD_IN)
      Boundary is INCLUSIVE: settlement_est_in == 1.0 exactly -> deep_foundation_required = true.
    input_set: "Analysis inputs applied_bearing_psf and footing_width_ft; active-plan n60_average"
    constants:
      SETTLE_DENOM_PER_N: 1200
      DEEP_FOUNDATION_THRESHOLD_IN: 1.0
    precision: "3 decimal places, round_half_up"

  - name: uscs_classification
    trigger: "When a SIEVE_ANALYSIS or ATTERBERG LabTestOrder is ACCEPTED and the sample has both result types ACCEPTED"
    algorithm: constraint_propagation
    formula: |
      F = percent_passing_200 (from latest ACCEPTED SIEVE_ANALYSIS result of the sample)
      LL = liquid_limit, PI = plasticity_index (from latest ACCEPTED ATTERBERG result)
      A_LINE = 0.73 * (LL - 20)
      if F < 5:                    uscs_class = "SW"
      elif 5 <= F <= 12:           uscs_class = "SM"
      elif 12 < F <= 50:           uscs_class = (PI > 7) ? "SC" : "SM"
      else  # F > 50, fine-grained
        if LL < 50:                uscs_class = (PI >= 7 and PI >= A_LINE) ? "CL" : "ML"
        else:                      uscs_class = (PI >= A_LINE) ? "CH" : "MH"
      Boundary: F == 50.0 exactly falls in the 12 < F <= 50 bucket (coarse with fines),
      because the fine-grained branch requires strictly F > 50.
    input_set: "Latest ACCEPTED SIEVE_ANALYSIS and ATTERBERG LabTestResults of the same sample"
    precision: "F, LL, PI taken as given (1 decimal place); A_LINE evaluated unrounded"

  - name: lab_invoice_total
    trigger: "LabTestOrder creation (fee_cents computed) and project.testing_invoice_cents recompute on any order ACCEPTED / state change"
    algorithm: aggregation
    formula: |
      Per order: fee_cents = round_half_up(BASE_FEE[test_type] * (RUSH_MULT if priority == RUSH else 1.0))
      Rounding order is PINNED: round each order line to whole cents FIRST (round_half_up,
      half-cent rounds away from zero), then sum. Summing raw products and rounding once
      is FORBIDDEN and yields a different total (e.g. two RUSH MOISTURE_CONTENT orders:
      2 * round(4533*1.5) = 13600 vs round(2*6799.5) = 13599).
      project.testing_invoice_cents = sum(fee_cents) over ALL LabTestOrders of the
      project in any status (fees accrue at order time; rejected reruns are not refunded).
    input_set: "All LabTestOrders of the project regardless of status"
    constants:
      BASE_FEE: { MOISTURE_CONTENT: 4533, ATTERBERG: 24500, SIEVE_ANALYSIS: 18500, UNCONFINED_COMPRESSION: 32000, DIRECT_SHEAR: 55000, CONSOLIDATION: 88000, PROCTOR: 21000 }
      RUSH_MULT: 1.5
      LAB_MAX_IN_TEST: 6
      RERUN_MAX: 2
    precision: "integer cents, round_half_up per line"

  - name: project_total_fee
    trigger: "Recomputed whenever base_fee_cents changes or testing_invoice_cents is recomputed"
    algorithm: aggregation
    formula: |
      Evaluation order is PINNED (the discount tier keys on the PRE-discount gross):
      1) testing = project.testing_invoice_cents
      2) gross = base_fee_cents + testing
      3) if gross >= DISCOUNT_TIER_GROSS_CENTS: discount = round_half_up(testing * DISCOUNT_RATE)
         else: discount = 0
      4) total_fee_cents = gross - discount
      The tier test uses the pre-discount gross, so a project at exactly
      gross == 500000 cents receives the discount and lands BELOW the tier
      (500000 - 10000 = 490000 for testing 200000).
    input_set: "Project.base_fee_cents; project.testing_invoice_cents"
    constants:
      DISCOUNT_TIER_GROSS_CENTS: 500000
      DISCOUNT_RATE: 0.05
    precision: "integer cents, round_half_up"

  - name: drilling_cost_estimate
    trigger: "Boring CLEARED -> DRILLED transition; sets Boring.drilling_cost_cents"
    algorithm: tiered_pricing
    formula: |
      Per-foot billing by depth band of each foot, with a rock multiplier on rock footage:
        soil_cost = (min(D,25) * T1) + (max(0, min(D,75) - 25) * T2) + (max(0, D - 75) * T3)
        rock feet R are the DEEPEST R feet; rock_extra = R * rate_of_their_band * (ROCK_MULT - 1)
        where rate_of_their_band = T2 when the rock feet lie within 25-75 ft (typical test case),
        generally: bill each rock foot at its band rate times ROCK_MULT instead of its band rate.
      Surcharge: + ACCESS_SURCHARGE if boring.access_difficult.
      Per-boring floor: boring_cost = max(BORING_MIN, footage_cost + rock_extra + surcharge).
      Mobilization: + MOBILIZATION_CENTS only for the FIRST boring of the plan to reach
      DRILLED (plan.mobilization_charged flips false -> true).
      drilling_cost_cents = boring_cost + (mobilization if first else 0).
    input_set: "The drilled boring's actual_depth_ft, rock_depth_ft, access_difficult; plan mobilization flag"
    constants:
      MOBILIZATION_CENTS: 45000
      T1_RATE_PER_FT: 4200
      T1_MAX_FT: 25
      T2_RATE_PER_FT: 6800
      T2_MAX_FT: 75
      T3_RATE_PER_FT: 9500
      ROCK_MULT: 1.8
      ACCESS_SURCHARGE: 15000
      BORING_MIN: 25000
    precision: "integer cents; tier arithmetic exact"

  - name: changed_condition_quantum
    trigger: "ChangedConditionClaim SUBMITTED -> UNDER_REVIEW transition (and appeal re-entry)"
    algorithm: threshold
    formula: |
      Let B = claim.baseline_bearing_psf (snapshot at creation), O = the linked
      observation visit's observed_bearing_psf (or project's latest FINDINGS_FILED
      visit observed value when observation_visit_id is null: use the most recent by
      visit_date, tie-break created_at ASC).
      If B is null or O is null or O >= B: both quanta = 0.
      Else shortfall = (B - O) / B evaluated UNROUNDED.
      report_baseline:  quantum_rb = round_half_up(claimed_amount_cents * min(shortfall, RB_SHORTFALL_CAP))
      site_observed:    quantum_so = round_half_up(claimed_amount_cents * min(shortfall * SO_MULT, SO_CAP))
    input_set: "Claim fields; linked/latest ObservationVisit; snapshot baseline from VERIFIED FoundationAnalysis"
    constants:
      RB_SHORTFALL_CAP: 0.5
      SO_MULT: 1.25
      SO_CAP: 0.75
      APPEAL_MAX: 1
    precision: "integer cents, round_half_up"
    variants:
      - name: report_baseline
        when: "Quantum measured against the issued report's baseline bearing"
        difference: "Caps recoverable share at 50% of claim; no multiplier"
      - name: site_observed
        when: "Quantum measured against as-observed subgrade with aggravation multiplier"
        difference: "Multiplies shortfall by 1.25 and raises the cap to 75%; yields a different amount for identical inputs (e.g. B=6000, O=4000, claim=120000 -> 40000 vs 50000)"

  - name: rig_committed_hours
    trigger: "RigAssignment creation, and transitions to MOBILIZED / DEMOBILIZED / CANCELLED"
    algorithm: aggregation
    formula: |
      subcontractor.committed_rig_hours = sum( (window_end - window_start) in fractional hours )
      over own RigAssignments in {SCHEDULED, MOBILIZED}.
      Schedule then cancel (or mobilize then demobilize) restores the prior value exactly.
    input_set: "RigAssignments of the subcontractor in {SCHEDULED, MOBILIZED}"
    precision: "1 decimal place"

  - name: clearance_expiry
    trigger: "UtilityClearance creation (computes expires_on) and logical clock advance (system EXPIRED transitions)"
    algorithm: threshold
    formula: |
      expires_on = issued_on + valid_days * 24h
      The ticket is valid while current_logical_time <= expires_on (INCLUSIVE upper bound):
      drilling or clearing at exactly expires_on succeeds; one second after fails with
      ERR_CLEARANCE_EXPIRED. Clock advance strictly past expires_on moves status
      {FILED, CLEARED} -> EXPIRED.
    input_set: "UtilityClearance issued_on, valid_days; logical clock"
    precision: "second precision ISO8601"

  - name: claims_exposure_rollup
    trigger: "Any ChangedConditionClaim state change or claimed_amount change"
    algorithm: aggregation
    formula: |
      exposure = sum(claimed_amount_cents) over claims UNDER_REVIEW
               + sum(quantum_report_baseline_cents) over claims SUBSTANTIATED
      Claims in {SUBMITTED, REBUTTED, SETTLED} contribute 0.
      posture = FROZEN if any clearance of active-plan borings is CONFLICT_MARKED
                else CLAIM_REVIEW if any claim in {UNDER_REVIEW, SUBSTANTIATED}
                else OPEN.
    input_set: "Claims of the project by status; clearances of active-plan borings"
    precision: "integer cents"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role appears in the endpoint's roles list; entity-backed ownership rules (ClientRep owns project.client_id, DrillingSub owns assignment.subcontractor_id)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id exists, validated left-to-right", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, enums in range, numbers in domain (e.g. recovery_pct 0-100, refusal_depth_ft < planned_depth_ft, claimed_amount_cents >= 0, window_end strictly after window_start is NOT here - see temporal)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 5, category: state, check: "Target resource's current state permits the requested transition per its state machine (covers wrong-from for every machine)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 5, category: state, check: "Child creation allowed by parent state: visits only under CONSTRUCTION_SUPPORT, analyses under {FIELDWORK, LAB_ANALYSIS}, reports under REPORT_REVIEW, orders under {FIELDWORK, LAB_ANALYSIS, REPORT_REVIEW} (errata orders during review), authorizations under {FIELDWORK}, claims under {CONSTRUCTION_SUPPORT}, samples only on borings in {DRILLED, LOGGED}", error_id: ERR_PROJECT_STATE_FORBIDS, http_status: 409, applies_to: "child-creation endpoints" }
  - { priority: 5, category: state, check: "Borings may be added directly only to an APPROVED plan; a LOCKED or SUPERSEDED plan accepts new borings only via the offsets endpoint", error_id: ERR_PLAN_NOT_EDITABLE, http_status: 409, applies_to: ["POST /geo/boring-plans/{id}/borings"] }
  - { priority: 5, category: state, check: "Report issue and analysis verify require the VERIFIED analysis to carry data_status CURRENT", error_id: ERR_ANALYSIS_DATA_STALE, http_status: 409, applies_to: ["POST /geo/reports/{id}/issue", "POST /geo/foundation-analyses/{id}/transition"] }
  - { priority: 5, category: state, check: "Project REPORT_REVIEW and report issue require every LabTestOrder of the project to be ACCEPTED", error_id: ERR_ORDER_STATE_FORBIDS, http_status: 409, applies_to: ["POST /geo/projects/{id}/transition", "POST /geo/reports/{id}/issue"] }
  - { priority: 5, category: state, check: "Boring drill requires a MOBILIZED RigAssignment owned by the acting DrillingSub", error_id: ERR_RIG_NOT_MOBILIZED, http_status: 409, applies_to: ["POST /geo/borings/{id}/transition"] }
  - { priority: 5, category: state, check: "Lab test authorization requires the sample in LAB_RECEIVED custody", error_id: ERR_SAMPLE_NOT_IN_LAB, http_status: 409, applies_to: ["POST /geo/lab-test-orders/{id}/transition"] }
  - { priority: 5, category: state, check: "Report issue / project REPORT_REVIEW require a VERIFIED FoundationAnalysis", error_id: ERR_ANALYSIS_NOT_VERIFIED, http_status: 409, applies_to: ["POST /geo/reports/{id}/issue", "POST /geo/projects/{id}/transition"] }
  - { priority: 5, category: state, check: "Claim/visit/order terminal-state guards (e.g. appeal cap, visits closed before project close)", error_id: ERR_CLAIM_STATE_FORBIDS, http_status: 409, applies_to: ["POST /geo/projects/{id}/transition", "POST /geo/claims/{id}/transition"] }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent's current version on OCC-guarded endpoints", error_id: ERR_STALE_PROJECT_VERSION, http_status: 412, applies_to: ["POST /geo/projects/{id}/boring-plans", "POST /geo/exploration-authorizations/{id}/transition"] }
  - { priority: 5, category: state, check: "OCC: expected_report_version equals the report's current version", error_id: ERR_STALE_REPORT_VERSION, http_status: 412, applies_to: ["POST /geo/reports/{id}/issue"] }
  - { priority: 6, category: business_safety, check: "Boring CLEARED/DRILLED transitions require a CLEARED clearance with current logical time <= expires_on", error_id: ERR_CLEARANCE_EXPIRED, http_status: 409, applies_to: ["POST /geo/borings/{id}/transition"] }
  - { priority: 6, category: business_safety, check: "Boring CLEARED requires at least one linked clearance in CLEARED; FIELD_AUTHORIZED requires every active-plan boring to hold a ticket in {FILED, CLEARED}", error_id: ERR_CLEARANCE_MISSING, http_status: 409, applies_to: ["POST /geo/borings/{id}/transition", "POST /geo/projects/{id}/transition"] }
  - { priority: 6, category: business_safety, check: "No drilling, mobilization, or new rig assignment while project.posture == FROZEN (utility conflict freeze)", error_id: ERR_POSTURE_FROZEN, http_status: 409, applies_to: ["POST /geo/borings/{id}/transition", "POST /geo/borings/{id}/rig-assignments", "POST /geo/rig-assignments/{id}/transition"] }
  - { priority: 7, category: business_constraint, check: "Approving a plan while another plan of the project is APPROVED or LOCKED is forbidden", error_id: ERR_PLAN_ALREADY_ACTIVE, http_status: 409, applies_to: ["POST /geo/boring-plans/{id}/transition"] }
  - { priority: 7, category: business_constraint, check: "New rig assignment window must not overlap any existing SCHEDULED or MOBILIZED assignment of the same subcontractor; half-open semantics: [window_start, window_end) so end == start of another assignment is allowed", error_id: ERR_RIG_DOUBLE_BOOKED, http_status: 409, applies_to: ["POST /geo/borings/{id}/rig-assignments"] }
  - { priority: 7, category: business_constraint, check: "Suspended subcontractor cannot receive new assignments or mobilize", error_id: ERR_STANDING_SUSPENDED, http_status: 409, applies_to: ["POST /geo/borings/{id}/rig-assignments", "POST /geo/rig-assignments/{id}/transition"] }
  - { priority: 7, category: business_constraint, check: "At most LAB_MAX_IN_TEST=6 orders may be IN_TEST at once (aggregate capacity, not interval overlap)", error_id: ERR_LAB_CAPACITY_EXCEEDED, http_status: 409, applies_to: ["POST /geo/lab-test-orders/{id}/transition"] }
  - { priority: 7, category: business_constraint, check: "Order rerun cap: rerun_count < 2 to re-enter IN_TEST", error_id: ERR_RERUN_LIMIT, http_status: 409, applies_to: ["POST /geo/lab-test-orders/{id}/transition"] }
  - { priority: 7, category: business_constraint, check: "Issuing PrincipalEngineer's X-User-ID must differ from report.prepared_by_user_id (segregation of duties)", error_id: ERR_SOD_PE_IS_PREPARER, http_status: 409, applies_to: ["POST /geo/reports/{id}/issue"] }
  - { priority: 7, category: business_constraint, check: "ticket_number unique per boring; license_no unique across subcontractors", error_id: ERR_DUPLICATE_TICKET, http_status: 409, applies_to: ["POST /geo/borings/{id}/clearances", "POST /geo/subcontractors"] }
  - { priority: 8, category: business_temporal, check: "window_end strictly after window_start on rig assignments; visit PERFORMED only when current logical time >= visit_date", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: ["POST /geo/borings/{id}/rig-assignments"] }
  - { priority: 8, category: business_temporal, check: "ObservationVisit cannot be performed before its visit_date", error_id: ERR_VISIT_DATE_FUTURE, http_status: 422, applies_to: ["POST /geo/observation-visits/{id}/transition"] }
  - { priority: 9, category: business_referential, check: "LabTestOrder.sample_id must resolve to a sample whose boring's plan belongs to this project", error_id: ERR_SAMPLE_PROJECT_MISMATCH, http_status: 422, applies_to: ["POST /geo/projects/{id}/lab-test-orders"] }
  - { priority: 9, category: business_referential, check: "ChangedConditionClaim.observation_visit_id must resolve to a visit of the same project", error_id: ERR_VISIT_PROJECT_MISMATCH, http_status: 422, applies_to: ["POST /geo/projects/{id}/claims"] }
  - { priority: 9, category: business_referential, check: "Offset borings may only be created from a parent boring in REFUSED", error_id: ERR_OFFSET_PARENT_NOT_REFUSED, http_status: 422, applies_to: ["POST /geo/borings/{id}/offsets"] }
  - { priority: 10, category: business_fiscal, check: "Authorization approval: project.additional_committed_cents + authorized_amount_cents <= project.additional_auth_cap_cents (inclusive boundary)", error_id: ERR_AUTH_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /geo/exploration-authorizations/{id}/transition"] }
  - { priority: 10, category: business_fiscal, check: "Offset creation beyond planned_boring_count requires an APPROVED authorization with consumed_boring_count < extra_boring_count", error_id: ERR_EXTRA_BORINGS_EXHAUSTED, http_status: 422, applies_to: ["POST /geo/borings/{id}/offsets"] }
  - { priority: 10, category: business_fiscal, check: "Manually filed claims must carry claimed_amount_cents >= 1 (auto-opened claims carry 0)", error_id: ERR_CLAIM_AMOUNT_INVALID, http_status: 422, applies_to: ["POST /geo/projects/{id}/claims"] }

endpoints:
  - { method: POST, path: "/geo/clients", description: "Create a client", roles: [FirmAdmin], code: 201, input: [name, contact_email], output: Client, side_effects: [] }
  - { method: GET, path: "/geo/clients/{id}", description: "Fetch a client", roles: [FirmAdmin, ProjectManager, ClientRep, SeniorEngineer], code: 200, input: [], output: Client, side_effects: [] }
  - { method: POST, path: "/geo/projects", description: "Create a project for a client", roles: [FirmAdmin], code: 201, input: [client_id, name, site_address, target_report_date, base_fee_cents, additional_auth_cap_cents, assumed_gwt_depth_ft], output: Project, side_effects: ["project starts DRAFT with posture OPEN"] }
  - { method: GET, path: "/geo/projects/{id}", description: "Fetch a project incl. computed posture, exposure, invoice and fee fields", roles: [FirmAdmin, ProjectManager, StaffEngineer, FieldGeologist, SeniorEngineer, PrincipalEngineer, LabManager, LabTechnician, ClientRep, DrillingSub], code: 200, input: [], output: Project, side_effects: [] }
  - { method: GET, path: "/geo/projects", description: "List projects; optional client_id filter", roles: [FirmAdmin, ProjectManager, SeniorEngineer, ClientRep], code: 200, input: ["client_id?", "limit?", "offset?"], output: "Project[]", side_effects: [] }
  - { method: POST, path: "/geo/projects/{id}/transition", description: "Drive the Project lifecycle machine; body field 'to' names the target state", roles: [ProjectManager, SeniorEngineer, PrincipalEngineer, ClientRep], code: 200, input: [to], output: Project, side_effects: ["per Project state machine; increments Project.version by 1"] }
  - { method: POST, path: "/geo/projects/{id}/boring-plans", description: "Create a new boring plan revision (OCC-guarded on Project.version)", roles: [StaffEngineer], code: 201, input: [planned_boring_count, planned_total_footage_ft, expected_project_version, "supersedes_plan_id?"], output: BoringPlan, side_effects: ["revision_no assigned as max+1", "increments Project.version by 1"] }
  - { method: GET, path: "/geo/boring-plans/{id}", description: "Fetch a boring plan", roles: [FirmAdmin, ProjectManager, StaffEngineer, SeniorEngineer, PrincipalEngineer], code: 200, input: [], output: BoringPlan, side_effects: [] }
  - { method: GET, path: "/geo/boring-plans", description: "List boring plans; filters project_id and/or supersedes_plan_id", roles: [FirmAdmin, ProjectManager, StaffEngineer, SeniorEngineer], code: 200, input: ["project_id?", "supersedes_plan_id?", "limit?", "offset?"], output: "BoringPlan[]", side_effects: [] }
  - { method: POST, path: "/geo/boring-plans/{id}/transition", description: "Drive the BoringPlan machine (SUBMITTED / DRAFT / APPROVED)", roles: [StaffEngineer, ProjectManager], code: 200, input: [to], output: BoringPlan, side_effects: ["per BoringPlan state machine incl. SUPERSEDED cascade"] }
  - { method: POST, path: "/geo/subcontractors", description: "Register a drilling subcontractor", roles: [FirmAdmin], code: 201, input: [name, license_no, day_rate_cents, max_concurrent_rigs], output: Subcontractor, side_effects: [] }
  - { method: GET, path: "/geo/subcontractors/{id}", description: "Fetch a subcontractor incl. committed_rig_hours", roles: [FirmAdmin, ProjectManager, DrillingSub], code: 200, input: [], output: Subcontractor, side_effects: [] }
  - { method: POST, path: "/geo/subcontractors/{id}/transition", description: "Set standing SUSPENDED / GOOD_STANDING", roles: [FirmAdmin], code: 200, input: [to], output: Subcontractor, side_effects: ["increments Subcontractor.version by 1"] }
  - { method: POST, path: "/geo/borings/{id}/rig-assignments", description: "Schedule a rig window for a boring; half-open overlap check per subcontractor", roles: [ProjectManager], code: 201, input: [subcontractor_id, window_start, window_end], output: RigAssignment, side_effects: ["boring PLANNED -> SCHEDULED", "subcontractor.committed_rig_hours += window hours"] }
  - { method: GET, path: "/geo/rig-assignments/{id}", description: "Fetch a rig assignment", roles: [FirmAdmin, ProjectManager, DrillingSub], code: 200, input: [], output: RigAssignment, side_effects: [] }
  - { method: GET, path: "/geo/rig-assignments", description: "List rig assignments; filters boring_id and/or subcontractor_id", roles: [FirmAdmin, ProjectManager, DrillingSub], code: 200, input: ["boring_id?", "subcontractor_id?", "limit?", "offset?"], output: "RigAssignment[]", side_effects: [] }
  - { method: POST, path: "/geo/rig-assignments/{id}/transition", description: "Drive the RigAssignment machine (MOBILIZED / DEMOBILIZED / CANCELLED)", roles: [DrillingSub, ProjectManager], code: 200, input: [to], output: RigAssignment, side_effects: ["per RigAssignment state machine incl. committed-hours compensation"] }
  - { method: POST, path: "/geo/boring-plans/{id}/borings", description: "Add a boring to an APPROVED plan", roles: [StaffEngineer], code: 201, input: [boring_no, planned_depth_ft, "access_difficult?"], output: Boring, side_effects: [] }
  - { method: GET, path: "/geo/borings/{id}", description: "Fetch a boring", roles: [FirmAdmin, ProjectManager, StaffEngineer, FieldGeologist, DrillingSub, SeniorEngineer], code: 200, input: [], output: Boring, side_effects: [] }
  - { method: GET, path: "/geo/borings", description: "List borings; filters boring_plan_id and/or offset_of_boring_id", roles: [FirmAdmin, ProjectManager, StaffEngineer, FieldGeologist, DrillingSub, SeniorEngineer], code: 200, input: ["boring_plan_id?", "offset_of_boring_id?", "limit?", "offset?"], output: "Boring[]", side_effects: [] }
  - { method: POST, path: "/geo/borings/{id}/transition", description: "Drive the Boring machine (CLEARED / DRILLED / LOGGED / CLOSED / REFUSED / ABANDONED)", roles: [StaffEngineer, FieldGeologist, DrillingSub, ProjectManager], code: 200, input: [to, "actual_depth_ft?", "rock_depth_ft?", "groundwater_depth_ft?", "avg_n60?", "refusal_depth_ft?"], output: Boring, side_effects: ["per Boring state machine incl. plan LOCKED cascade, drilling_cost_cents computation, analysis STALE cascade"] }
  - { method: POST, path: "/geo/borings/{id}/offsets", description: "Create an offset boring for a REFUSED boring; consumes extra-exploration authorization when beyond planned count", roles: [StaffEngineer], code: 201, input: [boring_no, planned_depth_ft, "access_difficult?"], output: Boring, side_effects: ["offset_of_boring_id set", "authorization consumed_boring_count += 1 and possibly EXHAUSTED when beyond planned_boring_count"] }
  - { method: POST, path: "/geo/borings/{id}/clearances", description: "File a utility clearance ticket for a boring", roles: [StaffEngineer], code: 201, input: [ticket_number, issued_on, "valid_days?"], output: UtilityClearance, side_effects: ["expires_on computed"] }
  - { method: GET, path: "/geo/clearances/{id}", description: "Fetch a clearance ticket", roles: [FirmAdmin, ProjectManager, StaffEngineer], code: 200, input: [], output: UtilityClearance, side_effects: [] }
  - { method: GET, path: "/geo/clearances", description: "List clearance tickets; filter boring_id", roles: [FirmAdmin, ProjectManager, StaffEngineer], code: 200, input: ["boring_id?", "limit?", "offset?"], output: "UtilityClearance[]", side_effects: [] }
  - { method: POST, path: "/geo/clearances/{id}/transition", description: "Drive the clearance machine (CLEARED / CONFLICT_MARKED); EXPIRED is system-only", roles: [StaffEngineer, ProjectManager], code: 200, input: [to], output: UtilityClearance, side_effects: ["project.posture recomputed on CONFLICT_MARKED / CLEARED"] }
  - { method: POST, path: "/geo/borings/{id}/samples", description: "Log a sample from a DRILLED (or later) boring", roles: [FieldGeologist], code: 201, input: [depth_top_ft, depth_bottom_ft, sampler_type, recovery_pct], output: Sample, side_effects: [] }
  - { method: GET, path: "/geo/samples/{id}", description: "Fetch a sample incl. computed uscs_class", roles: [FirmAdmin, ProjectManager, StaffEngineer, FieldGeologist, LabManager, LabTechnician, SeniorEngineer], code: 200, input: [], output: Sample, side_effects: [] }
  - { method: GET, path: "/geo/samples", description: "List samples; filter boring_id", roles: [FirmAdmin, ProjectManager, StaffEngineer, FieldGeologist, LabManager, LabTechnician, SeniorEngineer], code: 200, input: ["boring_id?", "limit?", "offset?"], output: "Sample[]", side_effects: [] }
  - { method: POST, path: "/geo/samples/{id}/transition", description: "Drive the custody machine (IN_TRANSIT / LAB_RECEIVED / LOST / ARCHIVED)", roles: [FieldGeologist, LabTechnician, LabManager], code: 200, input: [to], output: Sample, side_effects: ["per Sample state machine"] }
  - { method: POST, path: "/geo/projects/{id}/lab-test-orders", description: "Order a lab test on a sample; fee_cents computed per-line", roles: [LabManager], code: 201, input: [sample_id, test_type, "priority?"], output: LabTestOrder, side_effects: ["fee_cents computed", "project.testing_invoice_cents and total_fee_cents recomputed"] }
  - { method: GET, path: "/geo/lab-test-orders/{id}", description: "Fetch a lab test order", roles: [FirmAdmin, ProjectManager, LabManager, LabTechnician, SeniorEngineer], code: 200, input: [], output: LabTestOrder, side_effects: [] }
