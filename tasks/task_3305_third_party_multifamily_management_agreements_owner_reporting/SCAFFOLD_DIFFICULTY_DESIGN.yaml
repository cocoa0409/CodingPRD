          setup:
            - "Owner O9; Agreement AG9 ACTIVE; Property P9 MANAGED (zero-balance onboarding, one resident)"
            - "Statement SM9 for 2026-09 CASH already CLOSED once; logical clock then moved BACK-HELD at 2026-09-15T00:00:00Z (inside the statement month, so the temporal check would also fail if reached)"
