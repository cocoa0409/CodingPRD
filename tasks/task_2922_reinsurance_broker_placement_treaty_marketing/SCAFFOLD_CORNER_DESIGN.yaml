              as_user_id: "${alpha_id}"
              captures: { e_rein_counter: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { e_lead_clock: $.data.error_id }
            - call: "GET /fiduciary-transactions"
              payload: { program_id: "${prog_id}" }
              as: BrokerActuary
              as_user_id: "act-1"
              captures: { e_act_ledger: $.data.error_id }
            - call: "GET /programs/${prog_id}/fiduciary-transactions"
              payload: {}
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { e_ced_ledger: $.data.error_id }
            - call: "GET /cedents"
              payload: {}
              as: ReinsurerUnderwriter
              as_user_id: "${alpha_id}"
              captures: { e_rein_cedents: $.data.error_id }
            - call: "GET /reinsurers"
              payload: {}
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { e_ced_reinsurers: $.data.error_id }
            - call: "GET /programs"
              payload: { cedent_id: "${ced_id}" }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { only_prog: "$.data[0].id" }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { v_after: $.data.version, status_after: $.data.placement_status }
            - call: "GET /exposure-submissions/${sub_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { sub_state_after: $.data.status, years_after: $.data.historical_years_supplied }
          assert:
            - "${e_blank} == ERR_MISSING_USER_ID with HTTP 401, and ${e_ws} == ERR_MISSING_USER_ID too — a whitespace-only header counts as absent, not as an unknown user"
            - "${e_ghost} == ERR_UNKNOWN_USER with HTTP 401 — priority 2 answers before the role table is consulted, so the caller never learns whether BrokerPlacementLead could have read this program"
            - "${e_act_prog} == ERR_UNAUTHORIZED and ${e_admin_prog} == ERR_UNAUTHORIZED — creating a program is BrokerPlacementLead's alone, and PlatformAdmin is a registry operator rather than a superuser"
            - "${e_act_ghostced} == ERR_UNAUTHORIZED, not ERR_CEDENT_NOT_FOUND — priority 3 pre-empts the existence band at priority 8"
            - "${e_lead_signoff} == ERR_UNAUTHORIZED and ${e_act_revise} == ERR_UNAUTHORIZED — the broker cannot sign off actuarial work and the actuary cannot rewrite the cedent's data"
            - "${e_lead_book} == ERR_UNAUTHORIZED and ${e_compl_book} == ERR_UNAUTHORIZED — booking fiduciary money is the accountant's alone, and the approver is deliberately not admitted to it"
            - "${e_acct_reverse} == ERR_UNAUTHORIZED, not ERR_TRANSACTION_NOT_FOUND — the id space is not enumerable by a caller who lacks the verb"
            - "${e_ced_gtm} == ERR_UNAUTHORIZED and ${e_rein_counter} == ERR_UNAUTHORIZED — the cedent does not drive the placement and the market does not counter its own quotes"
            - "${e_lead_clock} == ERR_UNAUTHORIZED — only PlatformAdmin moves the logical clock"
            - "${e_act_ledger}, ${e_ced_ledger}, ${e_rein_cedents} and ${e_ced_reinsurers} are all ERR_UNAUTHORIZED — read endpoints are gated by exactly the same band, and the two entity-backed roles cannot browse each other's registry"
            - "the listing returns exactly 1 row with total_count 1 and ${only_prog} == ${prog_id}, ${v_after} == ${v0}, ${status_after} == DRAFT, ${sub_state_after} == DRAFT and ${years_after} == 5 — sixteen refusals mutated nothing at all"

      - name: shared_operations_admit_both_owners_while_identity_binding_confines_them_to_their_own_rows
        claim_type: shared_operations
        grounds:
          - roles.BrokerPlacementLead.shared_operations
          - roles.CedentUnderwriter.shared_operations
          - roles.ReinsurerUnderwriter.shared_operations
          - validations[priority=4] ERR_FOREIGN_RESOURCE
        distinguishing_aspect: |
          A shared operation is not a free-for-all: the role check at priority 3 says the verb is
          available, and the ownership check at priority 4 then says whose rows it is available on.
          The interesting part is the interleaving. Two different broker identities and the cedent
          may all package exposure data on the same program; six roles may read the program while
          the market may not read it at all; and a market that was never invited cannot quote,
          requote or decline on a submission addressed to a rival — with the foreign-resource
          refusal arriving before the state machine would independently have refused, which is the
          only ordering that keeps one cedent from probing another cedent's submission states.
        test_recipe:
          setup:
            - "Two cedents (ced1, ced2) and two reinsurers (Alpha invited, Bravo not invited)."
            - "ced1 owns an IN_MARKET program with one CATASTROPHE layer, one market submission to Alpha, one DISCLOSED brokerage disclosure and one DRAFT exposure submission."
