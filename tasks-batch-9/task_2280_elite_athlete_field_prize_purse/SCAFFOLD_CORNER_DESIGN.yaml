              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Settle Reps", license_code: "AGT-SG-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Settle Winner", country_code: USA, gender: MALE, birth_date: "1996-02-01", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athA_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Settle Runner", country_code: USA, gender: MALE, birth_date: "1996-02-02", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athB_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${athA_id}", race_name: "Qual SG-A", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-SG-A", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { prA_id: "$.data.id" }
            - call: POST /performance-records/${prA_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload: { athlete_id: "${athB_id}", race_name: "Qual SG-B", performance_date: "2026-03-02", performance_seconds: 7910, division: ELITE, sanctioning_ref: "SB-SG-B", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { prB_id: "$.data.id" }
            - call: POST /performance-records/${prB_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7910 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athA_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prA_id}", division: ELITE }
