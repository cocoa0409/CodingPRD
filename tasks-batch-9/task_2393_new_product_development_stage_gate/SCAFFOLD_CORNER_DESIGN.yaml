              as: GateChair
              as_user_id: "chair-sod"
            - call: "POST /innovation-projects/${sod_p_id}/gate-reviews"
              payload: { gate_id: "${sod_g2_id}", scheduled_at: "2026-08-12T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-sod"
              captures: { sod_gr_id: $.data.id }
            - call: "POST /gate-reviews/${sod_gr_id}/open"
