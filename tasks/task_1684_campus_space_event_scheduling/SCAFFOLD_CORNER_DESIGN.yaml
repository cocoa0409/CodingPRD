          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "No start", expected_attendance: 5, end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400); nothing persisted"

