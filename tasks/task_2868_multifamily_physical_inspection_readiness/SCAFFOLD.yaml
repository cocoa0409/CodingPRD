scenario: |
  2868. Multifamily Physical Inspection Readiness (assisted housing owner): inspection standard adoption with unit and inside/outside area defect definitions, unit sampling methodology and inspectable area weighting, life-threatening deficiency identification and twenty-four-hour correction obligations, pre-inspection self-assessment sweeps with work-order generation and closure verification, tenant notification, access coordination and refusal handling, inspection scoring, appeal of technical errors and score correction requests, corrective action plan submission and follow-up inspection scheduling, capital needs planning driven by recurring deficiencies

domain_name: multifamily-physical-inspection-readiness
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  # flat: 12 peer entities linked exclusively by foreign keys in request bodies and
  # query filters. No entity is nested in a URL path segment under another entity's
  # collection; every collection sits directly under the root prefix
  # (/properties, /units, /inspections, /deficiencies, /work-orders, ...). Action
  # endpoints hang off a single resource id only (POST /inspections/{id}/score).
  state_machine_shape: cyclic
  # Inspection runs SCORED -> APPEALED -> SCORED (appeal/rescore loop); Appeal runs
  # SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED; CorrectiveActionPlan runs
  # SUBMITTED -> REJECTED -> SUBMITTED; WorkOrder carries two independent state
  # dimensions (repair_status x verification_status) with a
  # REPAIRED/REJECTED -> OPEN/UNVERIFIED loop; SampleSelection branches
  # NOTIFIED -> {GRANTED, REFUSED} with divergent side-effect sets.
  relationship_patterns:
    - one_to_many
    - self_referential      # Deficiency.supersedes_deficiency_id -> Deficiency.id;
                            # SampleSelection.replaced_selection_id -> SampleSelection.id
    - polymorphic           # Deficiency.source in {INSPECTION, SELF_ASSESSMENT}: exactly one of
                            # inspection_id / sweep_id is non-null
    - cross_aggregate       # CapitalNeedItem aggregates Deficiency rows across Inspections;
                            # Property.readiness_posture aggregates Deficiency rows across Inspections
  role_model: segregation_of_duties
  # A QualityAssuranceReviewer may complete a WorkOrder repair OR verify its closure,
  # never both on the same WorkOrder (compared on X-User-ID). PropertyOwner files
  # appeals and submits corrective action plans but never reviews either; AppealsOfficer
  # reviews appeals but cannot file them; QualityAssuranceReviewer reviews plans but
  # cannot submit them.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: InspectionStandard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Standard code such as NSPIRE-2026"
        constraints: "1-32 chars; at most one row with the same code may have adoption_status IN {DRAFT, ADOPTED}"
      - name: name
        type: string
        source: input
        description: "Human-readable standard title"
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which the standard may be pinned to an Inspection"
      - name: adoption_status
        type: enum
        source: system
        description: "Adoption lifecycle state"
        default: DRAFT
        constraints: "DRAFT | ADOPTED | SUPERSEDED"
      - name: unit_weight_pct
        type: number
        source: input
        description: "Weight of the UNIT inspectable area in the composite score"
        constraints: "0.00-100.00, 2 dp; unit_weight_pct + inside_weight_pct + outside_weight_pct MUST equal 100.00"
      - name: inside_weight_pct
        type: number
        source: input
        description: "Weight of the INSIDE inspectable area in the composite score"
        constraints: "0.00-100.00, 2 dp"
      - name: outside_weight_pct
        type: number
        source: input
        description: "Weight of the OUTSIDE inspectable area in the composite score"
        constraints: "0.00-100.00, 2 dp"
      - name: adopted_at
        type: datetime
        source: system
        description: "Instant adoption_status became ADOPTED; null while DRAFT"
        default: null
      - name: superseded_at
        type: datetime
        source: system
        description: "Instant adoption_status became SUPERSEDED; null otherwise"
        default: null
      - name: defect_definition_count
        type: integer
        source: computed
        description: "count of DefectDefinition rows whose standard_id == this.id"
        default: 0
      - name: life_threatening_definition_count
        type: integer
        source: computed
        description: "count of DefectDefinition rows whose standard_id == this.id AND severity == LIFE_THREATENING"
        default: 0

  - name: DefectDefinition
    parent: InspectionStandard
    common_fields: true
    fields:
      - name: standard_id
        type: string
        source: input
        description: "FK -> InspectionStandard.id; the standard that defines this defect"
      - name: code
        type: string
        source: input
        description: "Defect code, unique among DefectDefinition rows sharing standard_id"
      - name: name
        type: string
        source: input
        description: "Human-readable defect name"
      - name: inspectable_area
        type: enum
        source: input
        description: "Inspectable area this defect is scored against"
        constraints: "UNIT | INSIDE | OUTSIDE"
      - name: severity
        type: enum
        source: input
        description: "Severity band driving the severity multiplier and the correction clock"
        constraints: "LIFE_THREATENING | SEVERE | MODERATE | LOW"
      - name: base_point_value
        type: number
        source: input
        description: "Base deduction points before multipliers"
        constraints: "0.01-40.00, 2 dp"
      - name: correction_deadline_hours
        type: integer
        source: input
        description: "Hours from observed_at to correction_due_at"
        constraints: ">= 1; MUST equal 24 when severity == LIFE_THREATENING"
      - name: is_life_threatening
        type: boolean
        source: computed
        description: "true when severity == LIFE_THREATENING"
        default: false

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Property name"
      - name: total_unit_count
        type: integer
        source: input
        description: "Declared dwelling-unit count driving the sampling tier in unit_sample_size"
        constraints: ">= 1"
      - name: capital_reserve_cents
        type: integer
        source: input
        description: "Capital reserve available for allocation across CapitalNeedItem rows, in integer cents"
        constraints: ">= 0"
      - name: owner_contact_email
        type: string
        source: input
        description: "Owner notification mailbox"
      - name: readiness_posture
        type: enum
        source: computed
        description: "Derived gate over child operations; recomputed by property_readiness_posture"
        default: READY
        constraints: "READY | WATCH | RESTRICTED | FROZEN"
      - name: open_life_threatening_count
        type: integer
        source: computed
        description: "count of Deficiency rows for this property with severity == LIFE_THREATENING AND status IN {OPEN, OVERDUE}"
        default: 0
      - name: overdue_life_threatening_count
        type: integer
        source: computed
        description: "count of Deficiency rows for this property with severity == LIFE_THREATENING AND status == OVERDUE"
        default: 0
      - name: open_severe_count
        type: integer
        source: computed
        description: "count of Deficiency rows for this property with severity == SEVERE AND status IN {OPEN, OVERDUE}"
        default: 0
      - name: last_final_score
        type: number
        source: computed
        description: "final_score of the most recently scored Inspection of this property (scored_at DESC, created_at ASC tie-break); null when none"
        default: null
      - name: last_sweep_closed_at
        type: datetime
        source: computed
        description: "closed_at of the most recently CLOSED SelfAssessmentSweep of this property; null when none"
        default: null
      - name: allocated_reserve_total_cents
        type: integer
        source: computed
        description: "sum of allocated_reserve_cents over CapitalNeedItem rows with property_id == this.id AND status == ACTIVE"
        default: 0

  - name: Unit
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this dwelling unit belongs to"
      - name: unit_number
        type: string
        source: input
        description: "Unit designator, unique among Unit rows sharing property_id"
      - name: bedroom_count
        type: integer
        source: input
        description: "Bedroom count"
        constraints: "0-6"
      - name: occupancy_status
        type: enum
        source: input
        description: "Occupancy state; DOWN units are excluded from the sampling eligibility filter"
        default: OCCUPIED
        constraints: "OCCUPIED | VACANT | DOWN"
      - name: occupant_display_name
        type: string
        source: input
        description: "Household name printed on the tenant notice; null when VACANT or DOWN"
        default: null
      - name: prior_deficiency_count
        type: integer
        source: computed
        description: "count of Deficiency rows with unit_id == this.id AND source == INSPECTION AND status != VOIDED whose Inspection.status IN {CLOSED, FOLLOW_UP_SCHEDULED}"
        default: 0
      - name: open_deficiency_count
        type: integer
        source: computed
        description: "count of Deficiency rows with unit_id == this.id AND status IN {OPEN, OVERDUE}"
        default: 0

  - name: Inspection
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property under inspection"
      - name: standard_id
        type: string
        source: input
        description: "FK -> InspectionStandard.id; pinned at creation and never re-read afterwards, so a later SUPERSEDED transition on that standard does not change this inspection's weights"
      - name: inspection_kind
        type: enum
        source: input
        description: "INITIAL for a scheduled cycle inspection, FOLLOW_UP for one created by a corrective action plan"
        default: INITIAL
        constraints: "INITIAL | FOLLOW_UP"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state"
        default: SCHEDULED
        constraints: "SCHEDULED | SAMPLED | NOTIFIED | IN_PROGRESS | SCORED | APPEALED | CAP_REQUIRED | CAP_APPROVED | FOLLOW_UP_SCHEDULED | CLOSED | CANCELLED"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the on-site window (ISO 8601 UTC, 3 fractional digits)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the on-site window; MUST be strictly after scheduled_start"
      - name: drawn_at
        type: datetime
        source: system
        description: "Instant the unit sample was drawn; null before SAMPLED"
        default: null
      - name: started_at
        type: datetime
        source: system
        description: "Instant the inspection entered IN_PROGRESS; null before"
        default: null
      - name: scored_at
        type: datetime
        source: system
        description: "Instant scores were published; null before SCORED"
        default: null
      - name: rescored_at
        type: datetime
        source: system
        description: "Instant the most recent granted appeal forced a rescore; null when no appeal was granted"
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: "Instant the inspection left SCORED for CAP_REQUIRED or CLOSED; null before"
        default: null
      - name: sample_tier_value
        type: integer
        source: computed
        description: "Tier output of unit_sample_size before the eligible-pool clamp"
        default: 0
      - name: sample_size
        type: integer
        source: computed
        description: "min(sample_tier_value, eligible unit pool size); count of SampleSelection rows with selection_status == ACTIVE"
        default: 0
      - name: inspected_unit_count
        type: integer
        source: computed
        description: "count of SampleSelection rows with inspection_id == this.id AND selection_status == ACTIVE AND access_status == GRANTED"
        default: 0
      - name: refused_unit_count
        type: integer
        source: computed
        description: "count of SampleSelection rows with inspection_id == this.id AND selection_status == ACTIVE AND access_status == REFUSED"
        default: 0
      - name: unit_area_points
        type: number
        source: computed
        description: "sum of Deficiency.points_deducted where inspection_id == this.id AND inspectable_area == UNIT AND status != VOIDED"
        default: 0.00
      - name: inside_area_points
        type: number
        source: computed
        description: "sum of Deficiency.points_deducted where inspection_id == this.id AND inspectable_area == INSIDE AND status != VOIDED"
        default: 0.00
      - name: outside_area_points
        type: number
        source: computed
        description: "sum of Deficiency.points_deducted where inspection_id == this.id AND inspectable_area == OUTSIDE AND status != VOIDED"
        default: 0.00
      - name: total_points_deducted
        type: number
        source: computed
        description: "unit_area_points + inside_area_points + outside_area_points, 2 dp"
        default: 0.00
      - name: life_threatening_count
        type: integer
        source: computed
        description: "count of Deficiency rows with inspection_id == this.id AND severity == LIFE_THREATENING AND status != VOIDED"
        default: 0
      - name: provisional_score
        type: number
        source: computed
        description: "inspection_score PROVISIONAL variant, 1 dp; null before SCORED"
        default: null
      - name: final_score
        type: number
        source: computed
        description: "inspection_score FINAL variant, 1 dp; null before SCORED"
        default: null
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "scored_at + APPEAL_WINDOW_HOURS; frozen at first scoring and NOT re-derived on rescore"
        default: null
      - name: cap_required
        type: boolean
        source: computed
        description: "true when final_score < CAP_SCORE_THRESHOLD OR life_threatening_count >= 1, evaluated at finalize"
        default: false
      - name: cap_window_days
        type: integer
        source: computed
        description: "Tier output of cap_window_and_followup_schedule keyed on final_score; null before finalize"
        default: null
      - name: cap_due_at
        type: datetime
        source: computed
        description: "Deadline for corrective action plan submission; null before finalize"
        default: null
      - name: followup_due_at
        type: datetime
        source: computed
        description: "Deadline for the follow-up inspection start; null before finalize"
        default: null

  - name: SampleSelection
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this sample slot belongs to"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the dwelling unit occupying this sample slot"
      - name: replaced_selection_id
        type: string
        source: system
        description: "FK -> SampleSelection.id; on a REPLACEMENT selection, the refused selection it substitutes; null on SAMPLED selections"
        default: null
      - name: selection_rank
        type: integer
        source: computed
        description: "1-based rank from the unit_sample_size ranking expression; replacement selections continue the sequence"
        default: 0
      - name: selection_basis
        type: enum
        source: system
        description: "SAMPLED for a slot from the original draw, REPLACEMENT for a slot created by refusal handling"
        default: SAMPLED
        constraints: "SAMPLED | REPLACEMENT"
      - name: selection_status
        type: enum
        source: system
        description: "ACTIVE slots count toward sample_size; REPLACED slots were substituted after a refusal"
        default: ACTIVE
        constraints: "ACTIVE | REPLACED"
      - name: access_status
        type: enum
        source: system
        description: "Tenant notification and access coordination state"
        default: NOT_NOTIFIED
        constraints: "NOT_NOTIFIED | NOTIFIED | GRANTED | REFUSED"
      - name: notice_method
        type: enum
        source: input
        description: "Delivery channel of the tenant notice; null before NOTIFIED"
        default: null
        constraints: "POSTED | MAILED | POSTED_AND_MAILED | EMAIL"
      - name: notified_at
        type: datetime
        source: input
        description: "Instant the tenant notice was delivered; null before NOTIFIED"
        default: null
      - name: access_window_start
        type: datetime
        source: input
        description: "Start of the agreed entry window on this unit; null before NOTIFIED"
        default: null
      - name: access_window_end
        type: datetime
        source: input
        description: "End of the agreed entry window; MUST be strictly after access_window_start"
        default: null
      - name: notice_lead_hours
        type: number
        source: computed
        description: "(inspection.scheduled_start - notified_at) expressed in hours, 2 dp; null before NOTIFIED"
        default: null
      - name: access_recorded_at
        type: datetime
        source: system
        description: "Instant access_status became GRANTED or REFUSED; null before"
        default: null
      - name: refusal_reason
        type: string
        source: input
        description: "Free-text refusal reason; null unless access_status == REFUSED"
        default: null

  - name: Deficiency
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; non-null when source == INSPECTION, null when source == SELF_ASSESSMENT"
        default: null
      - name: sweep_id
        type: string
        source: input
        description: "FK -> SelfAssessmentSweep.id; non-null when source == SELF_ASSESSMENT, null when source == INSPECTION"
        default: null
      - name: defect_definition_id
        type: string
        source: input
        description: "FK -> DefectDefinition.id; the defect definition this observation cites"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the dwelling unit, null when inspectable_area IN {INSIDE, OUTSIDE}"
        default: null
      - name: supersedes_deficiency_id
        type: string
        source: input
        description: "FK -> Deficiency.id; the earlier deficiency this observation recurs from, driving recurrence_mult"
        default: null
      - name: source
        type: enum
        source: system
        description: "INSPECTION when recorded on an official inspection, SELF_ASSESSMENT when raised by a pre-inspection sweep"
        constraints: "INSPECTION | SELF_ASSESSMENT"
      - name: inspectable_area
        type: enum
        source: input
        description: "Area the observation is scored against; MUST equal the DefectDefinition.inspectable_area"
        constraints: "UNIT | INSIDE | OUTSIDE"
      - name: severity
        type: enum
        source: computed
        description: "Copied from DefectDefinition.severity at record time"
        constraints: "LIFE_THREATENING | SEVERE | MODERATE | LOW"
      - name: status
        type: enum
        source: system
        description: "Correction lifecycle state"
        default: OPEN
        constraints: "OPEN | CORRECTED | VERIFIED | OVERDUE | VOIDED"
      - name: observed_at
        type: datetime
        source: input
        description: "Instant the defect was observed"
      - name: correction_due_at
        type: datetime
        source: computed
        description: "observed_at + DefectDefinition.correction_deadline_hours (24h for LIFE_THREATENING)"
      - name: corrected_at
        type: datetime
        source: system
        description: "Instant status became CORRECTED; null before"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Instant status became VERIFIED; null before"
        default: null
      - name: points_deducted
        type: number
        source: computed
        description: "Output of deficiency_points_deducted, 2 dp; set to 0.00 when status == VOIDED"
        default: 0.00
      - name: recurrence_applied
        type: boolean
        source: computed
        description: "true when supersedes_deficiency_id is non-null, meaning recurrence_mult 1.5 was applied"
        default: false
      - name: inspection_version_after_record
        type: integer
        source: system
        description: "Snapshot of the parent Inspection.version taken immediately after this record and its cascades were applied; null when source == SELF_ASSESSMENT"
        default: null
      - name: note
        type: string
        source: input
        description: "Inspector or owner note"
        default: null

  - name: SelfAssessmentSweep
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being swept"
      - name: status
        type: enum
        source: system
        description: "Sweep lifecycle state"
        default: PLANNED
        constraints: "PLANNED | IN_PROGRESS | CLOSED | ABANDONED"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the sweep window on the property"
      - name: window_end
        type: datetime
        source: input
        description: "End of the sweep window; MUST be strictly after window_start"
      - name: planned_area_scope
        type: enum
        source: input
        description: "Which inspectable areas the sweep covers"
        constraints: "UNIT_ONLY | INSIDE_OUTSIDE | ALL_AREAS"
      - name: started_at
        type: datetime
        source: system
        description: "Instant status became IN_PROGRESS; null before"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Instant status became CLOSED or ABANDONED; null before"
        default: null
      - name: generated_work_order_count
        type: integer
        source: computed
        description: "count of WorkOrder rows with sweep_id == this.id (VOID rows included)"
        default: 0
      - name: open_work_order_count
        type: integer
        source: computed
        description: "count of WorkOrder rows with sweep_id == this.id AND repair_status == OPEN"
        default: 0
      - name: verified_work_order_count
        type: integer
        source: computed
        description: "count of WorkOrder rows with sweep_id == this.id AND verification_status == VERIFIED"
        default: 0
      - name: void_work_order_count
        type: integer
        source: computed
        description: "count of WorkOrder rows with sweep_id == this.id AND repair_status == VOID"
        default: 0
      - name: closure_verified_rate
        type: number
        source: computed
        description: "Output of sweep_closure_verified_rate, 2 dp; 100.00 when no non-VOID work order exists"
        default: 100.00
      - name: urgent_work_order_count
        type: integer
        source: computed
        description: "count of WorkOrder rows with sweep_id == this.id AND priority_tier == URGENT"
        default: 0

  - name: WorkOrder
    parent: SelfAssessmentSweep
    common_fields: true
    fields:
      - name: sweep_id
        type: string
        source: input
        description: "FK -> SelfAssessmentSweep.id; the sweep whose finding generated this work order"
      - name: deficiency_id
        type: string
        source: input
        description: "FK -> Deficiency.id; the SELF_ASSESSMENT deficiency this work order remediates"
      - name: repair_status
        type: enum
        source: system
        description: "Repair dimension of the work order, independent of verification_status"
        default: OPEN
        constraints: "OPEN | REPAIRED | VOID"
      - name: verification_status
        type: enum
        source: system
        description: "Closure-verification dimension, independent of repair_status"
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | REJECTED"
      - name: priority_tier
        type: enum
        source: computed
        description: "Raised to URGENT by the readiness-posture cascade when the property becomes RESTRICTED or FROZEN"
        default: ROUTINE
        constraints: "ROUTINE | URGENT"
      - name: due_at
        type: datetime
        source: computed
        description: "Deficiency.observed_at + DefectDefinition.correction_deadline_hours at creation; pulled in by URGENT_DUE_PULL_IN_HOURS when priority_tier becomes URGENT"
      - name: completed_at
        type: datetime
        source: system
        description: "Instant repair_status became REPAIRED; null before"
        default: null
      - name: completed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who recorded the repair; compared against verified_by_user_id for segregation of duties"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Instant verification_status became VERIFIED or REJECTED; null before"
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who verified closure; MUST differ from completed_by_user_id"
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of times verification_result FAILED sent this work order back to repair_status OPEN"
        default: 0
      - name: resolution_note
        type: string
        source: input
        description: "Repair narrative supplied at completion"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Reason supplied when the work order was voided"
        default: null

  - name: Appeal
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the scored inspection being appealed"
      - name: contested_deficiency_id
        type: string
        source: input
        description: "FK -> Deficiency.id; the deficiency whose record is contested; required when appeal_type == TECHNICAL_ERROR, null otherwise"
        default: null
      - name: appeal_type
        type: enum
        source: input
        description: "TECHNICAL_ERROR voids the contested deficiency outright; SCORE_CORRECTION reduces its points by granted_point_adjustment"
        constraints: "TECHNICAL_ERROR | SCORE_CORRECTION"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | RETURNED_FOR_INFO | GRANTED | DENIED"
      - name: rationale
        type: string
        source: input
        description: "Owner's written basis for the appeal"
      - name: filed_at
        type: datetime
        source: input
        description: "Instant the appeal was filed; MUST be <= Inspection.appeal_deadline_at"
      - name: requested_point_adjustment
        type: number
        source: input
        description: "Points the owner asks to have removed; required when appeal_type == SCORE_CORRECTION"
        default: null
      - name: granted_point_adjustment
        type: number
        source: system
        description: "Points actually removed by the reviewer; null unless status == GRANTED with appeal_type == SCORE_CORRECTION"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Instant status became GRANTED or DENIED; null before"
        default: null
      - name: resubmission_count
        type: integer
        source: computed
        description: "Number of times the owner resubmitted after RETURNED_FOR_INFO; capped by APPEAL_RESUBMIT_LIMIT"
        default: 0
      - name: additional_evidence
        type: string
        source: input
        description: "Evidence added on the most recent resubmission"
        default: null
      - name: reviewer_note
        type: string
        source: system
        description: "Appeals officer note recorded with the latest decision"
        default: null

  - name: CorrectiveActionPlan
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection whose deficiencies the plan addresses"
      - name: follow_up_inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the FOLLOW_UP inspection created by schedule-follow-up; null before"
        default: null
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | REJECTED | APPROVED | FOLLOW_UP_SCHEDULED | COMPLETED"
      - name: narrative
        type: string
        source: input
        description: "Plan narrative"
      - name: total_estimated_cost_cents
        type: integer
        source: input
        description: "Total estimated remediation cost in integer cents; MUST be <= Property.capital_reserve_cents"
        constraints: ">= 0"
      - name: milestone_count
        type: integer
        source: input
        description: "Number of milestones in the plan"
        constraints: ">= 1"
      - name: target_completion_at
        type: datetime
        source: input
        description: "Owner's committed completion instant; MUST be <= Inspection.cap_due_at"
      - name: submitted_at
        type: datetime
        source: input
        description: "Instant of the original submission"
      - name: decided_at
        type: datetime
        source: system
        description: "Instant of the most recent review decision; null before"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of resubmissions after a REJECTED decision"
        default: 0
      - name: reviewer_note
        type: string
        source: system
        description: "Quality assurance reviewer note from the latest decision"
        default: null

  - name: CapitalNeedItem
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property whose capital plan holds this item"
      - name: defect_definition_id
        type: string
        source: input
        description: "FK -> DefectDefinition.id; the recurring defect driving this capital need"
      - name: recurrence_basis
        type: enum
        source: system
        description: "Which recurrence variant produced recurrence_count for this item"
        constraints: "INSPECTION_SCOPED | CALENDAR_SCOPED"
      - name: recurrence_count
        type: integer
        source: computed
        description: "Output of capital_need_recurrence_count under recurrence_basis"
        default: 0
      - name: priority_score
        type: number
        source: computed
        description: "Output of capital_need_priority_score, 2 dp, capped at 100.00"
        default: 0.00
      - name: allocation_rank
        type: integer
        source: computed
        description: "1-based rank by priority_score DESC then DefectDefinition.code ASC; drives remainder-cent distribution order"
        default: 0
      - name: allocated_reserve_cents
        type: integer
        source: computed
        description: "Output of capital_reserve_allocation, integer cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE for the current plan generation; SUPERSEDED once a later recompute replaces it"
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"
      - name: computed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the recompute that produced this item"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: InspectionStandard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /inspection-standards/{id}/adopt"
        actor: PlatformAdmin
        preconditions:
          - "adoption_status == DRAFT"
          - "unit_weight_pct + inside_weight_pct + outside_weight_pct == 100.00"
          - "life_threatening_definition_count >= 1"
        side_effects:
          - "sets adoption_status = ADOPTED and adopted_at = request.adopted_at"
          - "every other InspectionStandard with the same code and adoption_status == ADOPTED transitions ADOPTED -> SUPERSEDED with superseded_at = request.adopted_at"
          - "increments InspectionStandard.version by 1 on this row and on each superseded row"
        note: "Adoption is the only producer of ADOPTED; a DRAFT standard can never be pinned to an Inspection."
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system: adoption of a newer InspectionStandard sharing the same code"
        actor: system
        preconditions:
          - "adoption_status == ADOPTED"
          - "the newly adopted standard has the same code"
        side_effects:
          - "sets adoption_status = SUPERSEDED and superseded_at = the newer standard's adopted_at"
          - "Inspection rows already pinned to this standard keep their weights: standard_id is never re-read after Inspection creation"

  - entity: SelfAssessmentSweep
    initial_state: PLANNED
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /self-assessment-sweeps/{id}/start"
        actor: PropertyOwner
        preconditions:
          - "status == PLANNED"
          - "X-User-ID == property_id"
        side_effects:
          - "sets started_at = request.started_at"
          - "increments SelfAssessmentSweep.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /self-assessment-sweeps/{id}/findings"
        actor: PropertyOwner
        preconditions:
          - "status == IN_PROGRESS"
          - "request.expected_sweep_version == version"
          - "the cited DefectDefinition belongs to an InspectionStandard with adoption_status == ADOPTED"
          - "request.inspectable_area is inside planned_area_scope (UNIT_ONLY admits UNIT; INSIDE_OUTSIDE admits INSIDE and OUTSIDE; ALL_AREAS admits all three)"
        side_effects:
          - "creates one Deficiency with source = SELF_ASSESSMENT, sweep_id = this.id, inspection_id = null, status = OPEN, points_deducted from deficiency_points_deducted, correction_due_at from observed_at + DefectDefinition.correction_deadline_hours"
          - "creates one WorkOrder with sweep_id = this.id, deficiency_id = the new Deficiency.id, repair_status = OPEN, verification_status = UNVERIFIED, priority_tier = ROUTINE, due_at = the new Deficiency.correction_due_at"
          - "recomputes generated_work_order_count, open_work_order_count and closure_verified_rate"
          - "recomputes Property.open_life_threatening_count / open_severe_count and re-derives Property.readiness_posture"
          - "increments SelfAssessmentSweep.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /self-assessment-sweeps/{id}/close"
        actor: PropertyOwner
        preconditions:
          - "status == IN_PROGRESS"
          - "closure_verified_rate >= SWEEP_CLOSURE_RATE_FLOOR (90.00)"
        side_effects:
          - "sets closed_at = request.closed_at"
          - "sets Property.last_sweep_closed_at = request.closed_at"
          - "increments SelfAssessmentSweep.version by 1 and Property.version by 1"
      - from: PLANNED
        to: ABANDONED
        trigger: "POST /self-assessment-sweeps/{id}/close with a sweep that never started"
        actor: PropertyOwner
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "sets closed_at = request.closed_at and status = ABANDONED"
          - "increments SelfAssessmentSweep.version by 1"
        note: "The same endpoint lands on ABANDONED from PLANNED and on CLOSED from IN_PROGRESS; the closure-rate floor is only evaluated on the IN_PROGRESS branch."

  - entity: WorkOrder
    initial_state: "repair_status=OPEN x verification_status=UNVERIFIED"
    terminal_states: ["repair_status=VOID", "repair_status=REPAIRED x verification_status=VERIFIED"]
    transitions:
      - from: "repair_status=OPEN"
        to: "repair_status=REPAIRED"
        trigger: "POST /work-orders/{id}/complete"
        actor: MaintenanceTechnician
        preconditions:
          - "repair_status == OPEN"
          - "the owning SelfAssessmentSweep.status == IN_PROGRESS"
        side_effects:
          - "sets completed_at = request.completed_at, completed_by_user_id = X-User-ID, resolution_note = request.resolution_note"
          - "when every non-VOID WorkOrder sharing deficiency_id now has repair_status == REPAIRED, the linked Deficiency bubbles OPEN -> CORRECTED with corrected_at = request.completed_at"
          - "recomputes SelfAssessmentSweep.open_work_order_count and closure_verified_rate"
          - "increments WorkOrder.version, Deficiency.version and SelfAssessmentSweep.version by 1"
        note: "verification_status is untouched by this transition; the two dimensions advance independently."
      - from: "verification_status=UNVERIFIED"
        to: "verification_status=VERIFIED"
        trigger: "POST /work-orders/{id}/verify-closure with verification_result == PASSED"
        actor: PropertyOwner | QualityAssuranceReviewer
        preconditions:
          - "repair_status == REPAIRED"
          - "verification_status IN {UNVERIFIED, REJECTED}"
          - "X-User-ID != completed_by_user_id"
        side_effects:
          - "CASCADE C link 1: sets verification_status = VERIFIED, verified_at, verified_by_user_id = X-User-ID; recomputes SelfAssessmentSweep.verified_work_order_count and closure_verified_rate"
          - "CASCADE C link 2: because every non-VOID WorkOrder sharing deficiency_id now has verification_status == VERIFIED, that Deficiency transitions to VERIFIED with verified_at = request.verified_at"
          - "CASCADE C link 3: because that Deficiency left {OPEN, OVERDUE}, Property.open_life_threatening_count / overdue_life_threatening_count / open_severe_count are recomputed and readiness_posture is re-derived"
          - "CASCADE C link 4: because the re-derived readiness_posture of link 3 is NOT IN {RESTRICTED, FROZEN} (evaluated on the posture value after link 3, not on whether this call is the one that changed it), every WorkOrder of the property with repair_status == OPEN AND priority_tier == URGENT is demoted to ROUTINE and its due_at restored by +URGENT_DUE_PULL_IN_HOURS; each owning sweep's urgent_work_order_count is recomputed"
          - "increments WorkOrder.version, Deficiency.version, Property.version and each touched sweep's version by 1"
      - from: "verification_status=UNVERIFIED"
        to: "verification_status=REJECTED"
        trigger: "POST /work-orders/{id}/verify-closure with verification_result == FAILED"
        actor: PropertyOwner | QualityAssuranceReviewer
        preconditions:
          - "repair_status == REPAIRED"
          - "verification_status IN {UNVERIFIED, REJECTED}"
          - "X-User-ID != completed_by_user_id"
        side_effects:
          - "sets verification_status = REJECTED, verified_at = request.verified_at, verified_by_user_id = X-User-ID and increments rejection_count by 1"
          - "sends repair_status REPAIRED -> OPEN and clears completed_at and completed_by_user_id to null, reopening the repair dimension"
          - "sends the linked Deficiency CORRECTED -> OPEN and clears its corrected_at to null"
          - "recomputes SelfAssessmentSweep.open_work_order_count, verified_work_order_count and closure_verified_rate"
          - "increments WorkOrder.version, Deficiency.version and SelfAssessmentSweep.version by 1"
        note: "This is the cycle: REPAIRED/REJECTED -> OPEN/UNVERIFIED-eligible, so the same work order can be completed and verified repeatedly."
      - from: "repair_status IN {OPEN, REPAIRED}"
        to: "repair_status=VOID"
        trigger: "POST /work-orders/{id}/void"
        actor: PropertyOwner | PlatformAdmin
        preconditions:
          - "repair_status IN {OPEN, REPAIRED}"
          - "verification_status != VERIFIED"
        side_effects:
          - "sets repair_status = VOID and void_reason = request.void_reason"
          - "recomputes SelfAssessmentSweep.void_work_order_count, open_work_order_count and closure_verified_rate, keeping generated_work_order_count unchanged"
          - "when no non-VOID WorkOrder remains for the linked Deficiency, that Deficiency transitions to VOIDED with points_deducted = 0.00"
          - "increments WorkOrder.version by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SAMPLED
        trigger: "POST /inspections/{id}/draw-sample"
        actor: HousingAgencyInspector
        preconditions:
          - "status == SCHEDULED"
          - "Property.readiness_posture != FROZEN"
          - "at least one Unit of the property satisfies the unit_sample_size eligibility filter (occupancy_status IN {OCCUPIED, VACANT})"
        side_effects:
          - "sets sample_tier_value and sample_size from unit_sample_size, and drawn_at = request.drawn_at"
          - "creates sample_size SampleSelection rows with selection_basis = SAMPLED, selection_status = ACTIVE, access_status = NOT_NOTIFIED and selection_rank 1..sample_size following the unit_sample_size ranking expression"
          - "increments Inspection.version by 1"
      - from: SAMPLED
        to: NOTIFIED
        trigger: "system: the last ACTIVE SampleSelection of this inspection reaches access_status == NOTIFIED via POST /sample-selections/{id}/notice"
        actor: system
        preconditions:
          - "status == SAMPLED"
          - "every SampleSelection with selection_status == ACTIVE has access_status == NOTIFIED"
        side_effects:
          - "increments Inspection.version by 1"
        note: "Bubble-up: the parent auto-transitions off the aggregate state of its ACTIVE selections."
      - from: NOTIFIED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: HousingAgencyInspector
        preconditions:
          - "status == NOTIFIED"
          - "Property.readiness_posture != FROZEN"
          - "every SampleSelection with selection_status == ACTIVE AND selection_basis == SAMPLED has notice_lead_hours >= NOTICE_LEAD_HOURS_MIN (48.00); REPLACEMENT selections are exempt because they are created mid-inspection"
        side_effects:
          - "sets started_at = request.started_at"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/deficiencies"
        actor: HousingAgencyInspector
        preconditions:
          - "status == IN_PROGRESS"
          - "request.expected_inspection_version == version"
          - "the cited DefectDefinition.standard_id == this.standard_id"
          - "request.inspectable_area == the cited DefectDefinition.inspectable_area"
          - "when request.inspectable_area == UNIT: request.unit_id belongs to an ACTIVE SampleSelection of this inspection whose access_status == GRANTED"
        side_effects:
          - "CASCADE A link 1: creates one Deficiency with source = INSPECTION, status = OPEN, points_deducted from deficiency_points_deducted, correction_due_at = observed_at + DefectDefinition.correction_deadline_hours"
          - "CASCADE A link 2: because that Deficiency row now exists, this Inspection recomputes unit_area_points / inside_area_points / outside_area_points, total_points_deducted and life_threatening_count, and increments version by 1; the new version is written back to Deficiency.inspection_version_after_record"
          - "CASCADE A link 3: because Inspection.life_threatening_count / area points changed, Property.open_life_threatening_count and open_severe_count are recomputed and readiness_posture is re-derived by property_readiness_posture (RESTRICTED once an open LIFE_THREATENING deficiency exists)"
          - "CASCADE A link 4: because Property.readiness_posture became RESTRICTED or FROZEN, every WorkOrder of that property with repair_status == OPEN is raised to priority_tier = URGENT and its due_at pulled in by URGENT_DUE_PULL_IN_HOURS (24)"
          - "CASCADE A link 5: because those WorkOrder rows changed priority_tier, each owning SelfAssessmentSweep recomputes urgent_work_order_count and increments its version by 1"
      - from: IN_PROGRESS
        to: SCORED
        trigger: "POST /inspections/{id}/score"
        actor: HousingAgencyInspector
        preconditions:
          - "status == IN_PROGRESS"
          - "every ACTIVE SampleSelection has access_status IN {GRANTED, REFUSED}"
          - "no Deficiency of this inspection has severity == LIFE_THREATENING AND status IN {OPEN, OVERDUE}"
        side_effects:
          - "sets scored_at = request.scored_at, provisional_score from inspection_score PROVISIONAL and final_score from inspection_score FINAL"
          - "sets appeal_deadline_at = scored_at + APPEAL_WINDOW_HOURS (360); this value is frozen and is NOT re-derived on any later rescore"
          - "sets Property.last_final_score = final_score and re-derives Property.readiness_posture"
          - "increments Inspection.version by 1 and Property.version by 1"
      - from: SCORED
        to: APPEALED
        trigger: "system: POST /appeals creates an Appeal against this inspection"
        actor: system
        preconditions:
          - "status == SCORED"
          - "Appeal.filed_at <= appeal_deadline_at"
        side_effects:
          - "increments Inspection.version by 1"
      - from: APPEALED
        to: SCORED
        trigger: "system: the last non-terminal Appeal of this inspection reaches GRANTED or DENIED via POST /appeals/{id}/review"
        actor: system
        preconditions:
          - "status == APPEALED"
          - "no Appeal of this inspection has status IN {SUBMITTED, RETURNED_FOR_INFO}"
        side_effects:
          - "on a GRANTED appeal: recomputes area points, total_points_deducted, provisional_score and final_score from the surviving deficiencies and sets rescored_at = Appeal.decided_at"
          - "on a DENIED appeal: leaves all score fields unchanged and leaves rescored_at unchanged"
          - "sets Property.last_final_score = final_score and re-derives Property.readiness_posture"
          - "increments Inspection.version by 1"
        note: "This is the cycle SCORED -> APPEALED -> SCORED; appeal_deadline_at is never recomputed, so a second appeal is still measured against the original window."
      - from: SCORED
        to: CAP_REQUIRED
        trigger: "POST /inspections/{id}/finalize when cap_required evaluates true"
        actor: HousingAgencyInspector
        preconditions:
          - "status == SCORED"
          - "no Appeal of this inspection has status IN {SUBMITTED, RETURNED_FOR_INFO}"
          - "final_score < CAP_SCORE_THRESHOLD (90.00) OR life_threatening_count >= 1"
        side_effects:
          - "sets cap_required = true, finalized_at = request.finalized_at, and cap_window_days / cap_due_at / followup_due_at from cap_window_and_followup_schedule"
          - "increments Inspection.version by 1"
        note: "Branch 1 of the fork: the divergent side-effect set is the CAP deadline trio."
      - from: SCORED
        to: CLOSED
        trigger: "POST /inspections/{id}/finalize when cap_required evaluates false"
        actor: HousingAgencyInspector
        preconditions:
          - "status == SCORED"
          - "no Appeal of this inspection has status IN {SUBMITTED, RETURNED_FOR_INFO}"
          - "final_score >= CAP_SCORE_THRESHOLD (90.00) AND life_threatening_count == 0"
        side_effects:
          - "sets cap_required = false, finalized_at = request.finalized_at, and leaves cap_window_days / cap_due_at / followup_due_at null"
          - "recomputes prior_deficiency_count on every Unit that carries a non-VOIDED Deficiency of this inspection"
          - "when inspection_kind == FOLLOW_UP: the CorrectiveActionPlan whose follow_up_inspection_id == this.id transitions FOLLOW_UP_SCHEDULED -> COMPLETED"
          - "increments Inspection.version by 1"
        note: "Branch 2 of the fork: no CAP deadlines, and this is the branch that closes the plan loop and freezes unit history."
      - from: CAP_REQUIRED
        to: CAP_APPROVED
        trigger: "system: POST /corrective-action-plans/{id}/review with decision APPROVED"
        actor: system
        preconditions:
          - "status == CAP_REQUIRED"
          - "the reviewed CorrectiveActionPlan.inspection_id == this.id"
        side_effects:
          - "increments Inspection.version by 1"
      - from: CAP_APPROVED
        to: FOLLOW_UP_SCHEDULED
        trigger: "system: POST /corrective-action-plans/{id}/schedule-follow-up"
        actor: system
        preconditions:
          - "status == CAP_APPROVED"
        side_effects:
          - "creates a new Inspection with inspection_kind = FOLLOW_UP, status = SCHEDULED, the same property_id and standard_id"
          - "recomputes prior_deficiency_count on every Unit that carries a non-VOIDED Deficiency of this inspection"
          - "increments Inspection.version by 1"
      - from: FOLLOW_UP_SCHEDULED
        to: CLOSED
        trigger: "POST /inspections/{id}/finalize on the parent inspection once its follow-up inspection reached CLOSED"
        actor: HousingAgencyInspector
        preconditions:
          - "status == FOLLOW_UP_SCHEDULED"
          - "the CorrectiveActionPlan of this inspection has follow_up_inspection_id pointing at an Inspection with status == CLOSED"
        side_effects:
          - "sets finalized_at = request.finalized_at"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: HousingAgencyInspector
        preconditions:
          - "status IN {SCHEDULED, SAMPLED, NOTIFIED}"
        side_effects:
          - "sets every SampleSelection of this inspection to selection_status = REPLACED"
          - "increments Inspection.version by 1"
        note: "Also reachable from SAMPLED and NOTIFIED; no transition out of CANCELLED exists."

  - entity: SampleSelection
    initial_state: NOT_NOTIFIED
    terminal_states: [GRANTED, REFUSED]
    transitions:
      - from: NOT_NOTIFIED
        to: NOTIFIED
        trigger: "POST /sample-selections/{id}/notice"
        actor: PropertyOwner
        preconditions:
          - "access_status == NOT_NOTIFIED"
          - "selection_status == ACTIVE"
          - "the owning Inspection.status IN {SAMPLED, NOTIFIED, IN_PROGRESS}"
          - "X-User-ID == the owning Inspection's property_id"
          - "request.access_window_end > request.access_window_start"
          - "no other ACTIVE SampleSelection sharing unit_id has a half-open [access_window_start, access_window_end) interval that overlaps this request's interval"
        side_effects:
          - "sets notice_method, notified_at, access_window_start, access_window_end and notice_lead_hours"
          - "when the owning Inspection.status == SAMPLED and every ACTIVE selection of that inspection is NOTIFIED, bubbles the Inspection SAMPLED -> NOTIFIED"
          - "increments SampleSelection.version by 1"
      - from: NOTIFIED
        to: GRANTED
        trigger: "POST /sample-selections/{id}/access with access_result == GRANTED"
        actor: HousingAgencyInspector
        preconditions:
          - "access_status == NOTIFIED"
          - "selection_status == ACTIVE"
          - "the owning Inspection.status == IN_PROGRESS"
        side_effects:
          - "sets access_status = GRANTED and access_recorded_at = request.recorded_at"
          - "recomputes Inspection.inspected_unit_count"
          - "increments SampleSelection.version and Inspection.version by 1"
        note: "Branch 1 of the fork: unlocks UNIT-area deficiency recording on this unit."
      - from: NOTIFIED
        to: REFUSED
        trigger: "POST /sample-selections/{id}/access with access_result == REFUSED"
        actor: HousingAgencyInspector
        preconditions:
          - "access_status == NOTIFIED"
          - "selection_status == ACTIVE"
          - "the owning Inspection.status == IN_PROGRESS"
        side_effects:
          - "sets access_status = REFUSED, access_recorded_at = request.recorded_at and refusal_reason = request.refusal_reason"
          - "runs the replacement selector: when at least one Unit of the property passes the unit_sample_size eligibility filter and holds no SampleSelection of this inspection, this row becomes selection_status = REPLACED and a new SampleSelection is created with selection_basis = REPLACEMENT, selection_status = ACTIVE, access_status = NOT_NOTIFIED, replaced_selection_id = this.id and selection_rank = max(selection_rank of this inspection) + 1"
          - "when the replacement candidate set is empty, this row keeps selection_status = ACTIVE and access_status = REFUSED, so it stays in the FINAL scoring denominator and attracts REFUSAL_PENALTY_POINTS"
          - "recomputes Inspection.refused_unit_count and sample_size; the Inspection keeps status IN_PROGRESS and the replacement selection must still receive a notice before its access can be recorded"
          - "increments SampleSelection.version and Inspection.version by 1"
        note: "Branch 2 of the fork: divergent side-effect set (replacement selector plus denominator bookkeeping) versus branch 1."

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: OPEN
        to: CORRECTED
        trigger: "POST /deficiencies/{id}/correction, or the bubble-up from POST /work-orders/{id}/complete once every non-VOID work order of a SELF_ASSESSMENT deficiency is REPAIRED"
        actor: PropertyOwner | MaintenanceTechnician
        preconditions:
          - "status IN {OPEN, OVERDUE}"
          - "on the POST /deficiencies/{id}/correction path only, X-User-ID == the property_id reached through inspection_id or sweep_id"
          - "when severity == LIFE_THREATENING: the supplied correction instant <= correction_due_at"
        side_effects:
          - "sets corrected_at = request.corrected_at on the direct path, or request.completed_at on the work-order bubble-up path"
          - "recomputes Property.open_life_threatening_count / overdue_life_threatening_count / open_severe_count and re-derives readiness_posture"
          - "increments Deficiency.version and Property.version by 1"
        note: "Also reachable from OVERDUE for non-LIFE_THREATENING severities; a LIFE_THREATENING deficiency that is already OVERDUE can never be corrected and blocks scoring permanently."
      - from: CORRECTED
        to: VERIFIED
        trigger: "POST /deficiencies/{id}/verification with verification_result == PASSED, or CASCADE C link 2 from POST /work-orders/{id}/verify-closure with verification_result == PASSED"
        actor: HousingAgencyInspector | QualityAssuranceReviewer
        preconditions:
          - "status == CORRECTED"
        side_effects:
          - "sets verified_at = request.verified_at"
          - "recomputes Property counters and re-derives readiness_posture"
          - "increments Deficiency.version and Property.version by 1"
      - from: CORRECTED
        to: OPEN
        trigger: "POST /deficiencies/{id}/verification with verification_result == FAILED, or the work-order rejection path of POST /work-orders/{id}/verify-closure"
        actor: HousingAgencyInspector | QualityAssuranceReviewer
        preconditions:
          - "status == CORRECTED"
        side_effects:
          - "clears corrected_at to null"
          - "recomputes Property counters and re-derives readiness_posture"
          - "increments Deficiency.version and Property.version by 1"
        note: "Cycle: OPEN -> CORRECTED -> OPEN can repeat without limit; correction_due_at is never extended by a failed verification."
      - from: OPEN
        to: OVERDUE
        trigger: "system: POST /_clock/set_current_utc advances the logical clock strictly past correction_due_at"
        actor: system
        preconditions:
          - "status == OPEN"
          - "new logical clock value > correction_due_at (a clock exactly equal to correction_due_at does NOT trip this transition)"
        side_effects:
          - "sets status = OVERDUE"
          - "recomputes Property.overdue_life_threatening_count and re-derives readiness_posture (FROZEN once overdue_life_threatening_count >= 1)"
          - "increments Deficiency.version and Property.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "system: POST /appeals/{id}/review grants a TECHNICAL_ERROR appeal citing this deficiency"
        actor: system
        preconditions:
          - "status IN {OPEN, OVERDUE, CORRECTED, VERIFIED}"
          - "the granted Appeal.contested_deficiency_id == this.id"
        side_effects:
          - "CASCADE B link 2: sets status = VOIDED and points_deducted = 0.00"
          - "CASCADE B link 3: because this row is now VOIDED it leaves every area point sum, so the owning Inspection recomputes unit_area_points / inside_area_points / outside_area_points / total_points_deducted / life_threatening_count, recomputes provisional_score and final_score, sets rescored_at and returns APPEALED -> SCORED"
          - "CASCADE B link 4: because Inspection.final_score changed, Property.last_final_score is rewritten and readiness_posture is re-derived, which can move the property RESTRICTED -> READY when this was the last open LIFE_THREATENING deficiency"
          - "increments Deficiency.version, Inspection.version and Property.version by 1"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /appeals/{id}/review with decision == GRANTED"
        actor: AppealsOfficer
        preconditions:
          - "status IN {SUBMITTED, RETURNED_FOR_INFO}"
          - "when appeal_type == SCORE_CORRECTION: request.granted_point_adjustment is present and 0.00 < granted_point_adjustment <= the contested Deficiency.points_deducted"
        side_effects:
          - "CASCADE B link 1: sets status = GRANTED, decided_at = request.decided_at, reviewer_note and, for SCORE_CORRECTION, granted_point_adjustment"
          - "for appeal_type == TECHNICAL_ERROR: drives the contested Deficiency OPEN -> VOIDED (cascade B links 2-4)"
          - "for appeal_type == SCORE_CORRECTION: reduces the contested Deficiency.points_deducted by granted_point_adjustment (floored at 0.00) and triggers the same Inspection rescore and Property posture re-derivation"
          - "increments Appeal.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /appeals/{id}/review with decision == DENIED"
        actor: AppealsOfficer
        preconditions:
          - "status IN {SUBMITTED, RETURNED_FOR_INFO}"
        side_effects:
          - "sets status = DENIED, decided_at and reviewer_note"
          - "returns the Inspection APPEALED -> SCORED with every score field unchanged and rescored_at unchanged"
          - "increments Appeal.version and Inspection.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /appeals/{id}/review with decision == RETURNED_FOR_INFO"
        actor: AppealsOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets status = RETURNED_FOR_INFO, decided_at and reviewer_note"
          - "leaves the Inspection in APPEALED because a non-terminal appeal still exists"
          - "increments Appeal.version by 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /appeals/{id}/resubmit"
        actor: PropertyOwner
        preconditions:
          - "status == RETURNED_FOR_INFO"
          - "resubmission_count < APPEAL_RESUBMIT_LIMIT (2)"
          - "X-User-ID == the Inspection's property_id"
        side_effects:
          - "sets additional_evidence = request.additional_evidence and increments resubmission_count by 1"
          - "clears decided_at to null"
          - "increments Appeal.version by 1"
        note: "Cycle: SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED, at most twice; the third resubmission attempt is rejected and the appeal can only be GRANTED or DENIED from there."

  - entity: CorrectiveActionPlan
    initial_state: SUBMITTED
    terminal_states: [COMPLETED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /corrective-action-plans/{id}/review with decision == APPROVED"
        actor: QualityAssuranceReviewer
        preconditions:
          - "status IN {SUBMITTED}"
          - "the owning Inspection.status == CAP_REQUIRED"
        side_effects:
          - "sets status = APPROVED, decided_at and reviewer_note"
          - "drives the Inspection CAP_REQUIRED -> CAP_APPROVED"
          - "increments CorrectiveActionPlan.version and Inspection.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-action-plans/{id}/review with decision == REJECTED"
        actor: QualityAssuranceReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the owning Inspection.status == CAP_REQUIRED"
        side_effects:
          - "sets status = REJECTED, decided_at and reviewer_note"
          - "leaves the Inspection in CAP_REQUIRED"
          - "increments CorrectiveActionPlan.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/resubmit"
        actor: PropertyOwner
        preconditions:
          - "status == REJECTED"
          - "X-User-ID == the Inspection's property_id"
          - "request.total_estimated_cost_cents <= Property.capital_reserve_cents"
          - "request.target_completion_at <= the Inspection's cap_due_at"
        side_effects:
          - "overwrites narrative, total_estimated_cost_cents, target_completion_at; increments revision_count by 1; clears decided_at and reviewer_note to null"
          - "increments CorrectiveActionPlan.version by 1"
        note: "Cycle: SUBMITTED -> REJECTED -> SUBMITTED, unbounded."
      - from: APPROVED
        to: FOLLOW_UP_SCHEDULED
        trigger: "POST /corrective-action-plans/{id}/schedule-follow-up"
        actor: HousingAgencyInspector
        preconditions:
          - "status == APPROVED"
          - "request.scheduled_start >= target_completion_at"
          - "request.scheduled_start <= the Inspection's followup_due_at"
          - "the new window does not collide with any other Inspection window on the property under inspection_window_conflict semantics"
        side_effects:
          - "creates a FOLLOW_UP Inspection and sets follow_up_inspection_id to it"
          - "drives the parent Inspection CAP_APPROVED -> FOLLOW_UP_SCHEDULED"
          - "increments CorrectiveActionPlan.version and Inspection.version by 1"
      - from: FOLLOW_UP_SCHEDULED
        to: COMPLETED
        trigger: "system: the follow-up Inspection reaches CLOSED via POST /inspections/{id}/finalize"
        actor: system
        preconditions:
          - "status == FOLLOW_UP_SCHEDULED"
          - "the Inspection referenced by follow_up_inspection_id has status == CLOSED"
        side_effects:
          - "sets status = COMPLETED"
          - "increments CorrectiveActionPlan.version by 1"

  - entity: CapitalNeedItem
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: POST /capital-needs/recompute produces a newer generation for the same property"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the recompute targets the same property_id"
        side_effects:
          - "sets status = SUPERSEDED and allocated_reserve_cents = 0"
          - "recomputes Property.allocated_reserve_total_cents over the new ACTIVE generation only"
          - "increments CapitalNeedItem.version and Property.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: deficiency-record-stale-inspection
    parent_entity: Inspection
    write_endpoint: "POST /inspections/{id}/deficiencies"
    occ_field: "expected_inspection_version"
    description: |
      Recording a Deficiency against an Inspection whose version has advanced
      since the client last observed it is rejected. Repeated deficiency records
      against an IN_PROGRESS inspection are all legitimate on their own, so the
      only way to detect that a writer is working from a stale view of the
      inspection's accumulated points is the version check.
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412
  - rule_id: sweep-finding-stale-sweep
    parent_entity: SelfAssessmentSweep
    write_endpoint: "POST /self-assessment-sweeps/{id}/findings"
    occ_field: "expected_sweep_version"
    description: |
      Filing a finding against a SelfAssessmentSweep whose version has advanced
      is rejected. Each finding legitimately generates another work order, so a
      writer holding a stale view of the sweep's work-order counters cannot be
      detected by any state precondition.
    error_id: ERR_STALE_SWEEP_VERSION
    http_status: 412
  - rule_id: capital-recompute-stale-property
    parent_entity: Property
    write_endpoint: "POST /capital-needs/recompute"
    occ_field: "expected_property_version"
    description: |
      A capital-needs recompute legitimately supersedes the previous generation
      of CapitalNeedItem rows, so a second recompute always succeeds under the
      natural product semantics. Rejecting the recompute whose
      expected_property_version no longer matches Property.version is what stops
      a writer from superseding a generation it never saw.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: unit_sample_size
    trigger: "POST /inspections/{id}/draw-sample (Inspection SCHEDULED -> SAMPLED)"
    algorithm: threshold
    formula: |
      # STEP 1 - tier value from the property's DECLARED unit count
      N = Property.total_unit_count
      if   N <= 4:   sample_tier_value = N
      elif N <= 30:  sample_tier_value = max(5,  ceil(0.20 * N))
      elif N <= 100: sample_tier_value = max(8,  ceil(0.15 * N))
      else:          sample_tier_value = min(35, max(15, ceil(0.10 * N)))

      # STEP 2 - eligibility filter over ACTUAL Unit rows
      candidates = [ u for u in Unit
                     if u.property_id == Inspection.property_id
                     and u.occupancy_status IN {OCCUPIED, VACANT}
                     and no SampleSelection of this Inspection already holds u.id ]
      if len(candidates) == 0: reject with ERR_NO_ELIGIBLE_UNITS

      # STEP 3 - clamp
      sample_size = min(sample_tier_value, len(candidates))

      # STEP 4 - ranking expression (selector policy)
      order candidates by  u.prior_deficiency_count DESC,
                     then  u.created_at ASC          # tie-break; `id` is NEVER consulted
      take the first sample_size candidates; selection_rank = 1..sample_size in that order
    input_set: "Unit rows of the inspection's property with occupancy_status IN {OCCUPIED, VACANT}; DOWN units are excluded outright. Units already holding a SampleSelection of this inspection are excluded, which is what makes the refusal-replacement selector pick an untouched unit."
    constants:
      TIER_1_MAX_UNITS: 4
      TIER_2_MAX_UNITS: 30
      TIER_2_RATE: 0.20
      TIER_2_FLOOR: 5
      TIER_3_MAX_UNITS: 100
      TIER_3_RATE: 0.15
      TIER_3_FLOOR: 8
      TIER_4_RATE: 0.10
      TIER_4_FLOOR: 15
      TIER_4_CAP: 35
    precision: "sample_tier_value and sample_size are integers; ceil is applied to the exact rational product, not to a rounded intermediate"
    variants:
      - name: replacement_draw
        when: "invoked by the SampleSelection NOTIFIED -> REFUSED branch instead of by draw-sample"
        difference: "STEP 1 and STEP 3 are skipped entirely (sample_size is already fixed); STEP 2 and STEP 4 run and yield exactly one unit, whose selection_rank continues the existing sequence. When STEP 2's candidate set is empty the refusal is recorded WITHOUT a replacement instead of raising ERR_NO_ELIGIBLE_UNITS."

  - name: deficiency_points_deducted
    trigger: "POST /inspections/{id}/deficiencies and POST /self-assessment-sweeps/{id}/findings, both of which create a Deficiency"
    algorithm: weighted_scoring
    formula: |
      severity_mult = SEVERITY_MULT[DefectDefinition.severity]
      area_mult     = AREA_MULT[Deficiency.inspectable_area]
      recurrence_mult = 1.5 if Deficiency.supersedes_deficiency_id is not null else 1.0
      # conditional branch on a DIFFERENT entity's state:
      occupancy_mult = 1.2 if (DefectDefinition.severity == LIFE_THREATENING
                               and Deficiency.unit_id is not null
                               and Unit.occupancy_status == OCCUPIED) else 1.0
      raw = DefectDefinition.base_point_value * severity_mult * area_mult
            * recurrence_mult * occupancy_mult
      points_deducted = min(DEFICIENCY_POINT_CAP, round_half_up(raw, 2))
    input_set: "One Deficiency row at creation time. The multipliers read DefectDefinition.severity, Deficiency.inspectable_area, Deficiency.supersedes_deficiency_id and Unit.occupancy_status; nothing is re-read afterwards, so later occupancy changes never move a recorded deduction."
    constants:
      SEVERITY_MULT: { LIFE_THREATENING: 3.0, SEVERE: 2.0, MODERATE: 1.0, LOW: 0.5 }
      AREA_MULT: { UNIT: 1.0, INSIDE: 0.8, OUTSIDE: 0.6 }
      RECURRENCE_MULT: 1.5
      OCCUPIED_LIFE_THREATENING_MULT: 1.2
      DEFICIENCY_POINT_CAP: 40.00
    precision: "2 decimal places, round_half_up, applied to `raw` BEFORE the cap is taken (round first, then min)"

  - name: inspection_score
    trigger: "POST /inspections/{id}/score (IN_PROGRESS -> SCORED) and the rescore inside the APPEALED -> SCORED transition"
    algorithm: weighted_scoring
    formula: |
      unit_raw    = sum(d.points_deducted for d in Deficiency
                        if d.inspection_id == I.id and d.inspectable_area == UNIT
                        and d.status != VOIDED)
      inside_raw  = same with inspectable_area == INSIDE
      outside_raw = same with inspectable_area == OUTSIDE

      # the ONLY difference between the two variants is the UNIT denominator
      if variant == PROVISIONAL:
          unit_per_unit = round_half_up(unit_raw / I.inspected_unit_count, 2)
                          if I.inspected_unit_count > 0 else 0.00
      if variant == FINAL:
          unit_per_unit = round_half_up(
              (unit_raw + REFUSAL_PENALTY_POINTS * I.refused_unit_count) / I.sample_size, 2)
              if I.sample_size > 0 else 0.00

      unit_area_score    = round_half_up(max(0.00, 100.00 - unit_per_unit), 2)
      inside_area_score  = round_half_up(max(0.00, 100.00 - inside_raw), 2)
      outside_area_score = round_half_up(max(0.00, 100.00 - outside_raw), 2)

      # ROUNDING ORDER IS PINNED: weight each area score, round THAT product to 2 dp,
      # then sum the three rounded products, then round the sum to 1 dp.
      w_unit    = round_half_up(unit_area_score    * (Std.unit_weight_pct    / 100), 2)
      w_inside  = round_half_up(inside_area_score  * (Std.inside_weight_pct  / 100), 2)
      w_outside = round_half_up(outside_area_score * (Std.outside_weight_pct / 100), 2)
      score = round_half_up(w_unit + w_inside + w_outside, 1)
    input_set: "Deficiency rows with inspection_id == this inspection and status != VOIDED (OPEN, OVERDUE, CORRECTED and VERIFIED all count; only VOIDED leaves the sum). Weights come from the InspectionStandard pinned in Inspection.standard_id, never from the currently ADOPTED standard."
    constants:
      REFUSAL_PENALTY_POINTS: 12.00
    precision: "area scores and weighted products at 2 dp round_half_up; the composite score at 1 dp round_half_up"
    variants:
      - name: PROVISIONAL
        when: "written to Inspection.provisional_score at every scoring and rescoring"
        difference: "divides unit_raw by inspected_unit_count (units whose access was GRANTED) and ignores refusals entirely, so a refused unit neither dilutes nor penalises the unit area."
      - name: FINAL
        when: "written to Inspection.final_score at every scoring and rescoring; this is the variant that drives cap_required, cap_window_days and Property.last_final_score"
        difference: "divides by sample_size (which still counts unreplaced refusals) after adding REFUSAL_PENALTY_POINTS for each refused unit, so identical deficiency data yields a different number from PROVISIONAL whenever refused_unit_count >= 1."

  - name: property_readiness_posture
    trigger: "every Deficiency create/status change, every Inspection scoring or rescoring, every sweep close, and POST /_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      overdue_lt = count(Deficiency d where d reaches this property through
                         d.inspection_id -> Inspection.property_id
                         or d.sweep_id -> SelfAssessmentSweep.property_id,
                         and d.severity == LIFE_THREATENING and d.status == OVERDUE)
      open_lt    = same but d.status IN {OPEN, OVERDUE}
      open_sev   = same but d.severity == SEVERE and d.status IN {OPEN, OVERDUE}

      if   overdue_lt >= 1:                                     posture = FROZEN
      elif open_lt    >= 1:                                     posture = RESTRICTED
      elif open_sev   >= WATCH_SEVERE_FLOOR (5):                 posture = WATCH
      elif last_final_score is not null and last_final_score < WATCH_SCORE_FLOOR (60.00):
                                                                 posture = WATCH
      else:                                                      posture = READY
    input_set: "Deficiency rows of the property reached through either FK path (INSPECTION-sourced and SELF_ASSESSMENT-sourced both count), excluding status IN {CORRECTED, VERIFIED, VOIDED}."
    constants:
      WATCH_SEVERE_FLOOR: 5
      WATCH_SCORE_FLOOR: 60.00
    precision: "integer counts; last_final_score compared at its stored 1 dp precision"
    variants:
      - name: gate_effect
        when: "evaluated as a precondition of POST /inspections/{id}/draw-sample and POST /inspections/{id}/start"
        difference: "FROZEN blocks both endpoints with ERR_PROPERTY_FROZEN; RESTRICTED allows them but raises every OPEN WorkOrder of the property to priority_tier URGENT; WATCH and READY gate nothing."

  - name: sweep_closure_verified_rate
    trigger: "every POST /self-assessment-sweeps/{id}/findings, POST /work-orders/{id}/complete, /verify-closure and /void; read as a precondition of POST /self-assessment-sweeps/{id}/close"
    algorithm: aggregation
    formula: |
      denominator = count(WorkOrder w where w.sweep_id == S.id and w.repair_status != VOID)
      numerator   = count(WorkOrder w where w.sweep_id == S.id and w.repair_status != VOID
                                        and w.verification_status == VERIFIED)
      if denominator == 0:
          closure_verified_rate = 100.00      # PINNED empty-set value, not 0.00 and not null
      else:
          closure_verified_rate = round_half_up(numerator * 100 / denominator, 2)
      # close gate uses >= , not >
      may_close = (closure_verified_rate >= SWEEP_CLOSURE_RATE_FLOOR)
    input_set: "WorkOrder rows with sweep_id == this sweep and repair_status != VOID. Voided work orders leave BOTH numerator and denominator, which is why voiding an unverified work order raises the rate."
    constants:
      SWEEP_CLOSURE_RATE_FLOOR: 90.00
    precision: "2 decimal places, round_half_up; the comparison against the floor is made on the rounded value"

  - name: cap_window_and_followup_schedule
    trigger: "POST /inspections/{id}/finalize on the SCORED -> CAP_REQUIRED branch"
    algorithm: constraint_propagation
    formula: |
      # The dependency LOOKS circular - the appeal window bounds when an appeal may be
      # filed, a granted appeal changes final_score, and final_score selects the CAP
      # window - so the evaluation order is pinned explicitly:
      # STEP 1 (at first scoring, never re-run):
      #     appeal_deadline_at = scored_at + APPEAL_WINDOW_HOURS
      #     -> derived from scored_at ONLY; it does NOT read provisional_score,
      #        final_score, or any later rescore.
      # STEP 2 (at each granted appeal): final_score is recomputed by
      #     inspection_score FINAL and rescored_at is set. appeal_deadline_at is
      #     left untouched.
      # STEP 3 (at finalize): the CAP tier reads the CURRENT final_score,
      #     i.e. the post-rescore value when STEP 2 ran, the original otherwise.
      #     if   final_score >= 90.00: cap_window_days = 60
      #     elif final_score >= 80.00: cap_window_days = 45
      #     elif final_score >= 60.00: cap_window_days = 30
      #     else:                      cap_window_days = 15
      # STEP 4: anchor = rescored_at if rescored_at is not null else scored_at
      #     cap_due_at = anchor + cap_window_days * 24 hours
      # STEP 5: followup_due_at = cap_due_at
      #     + (FOLLOWUP_OFFSET_LT_DAYS if life_threatening_count >= 1
      #        else FOLLOWUP_OFFSET_DAYS) * 24 hours
    input_set: "The single Inspection being finalized: its final_score after all appeals are terminal, its scored_at/rescored_at anchors, and its life_threatening_count over non-VOIDED deficiencies."
    constants:
      APPEAL_WINDOW_HOURS: 360
      CAP_SCORE_THRESHOLD: 90.00
      CAP_TIER_90_DAYS: 60
      CAP_TIER_80_DAYS: 45
      CAP_TIER_60_DAYS: 30
      CAP_TIER_LOW_DAYS: 15
      FOLLOWUP_OFFSET_DAYS: 30
      FOLLOWUP_OFFSET_LT_DAYS: 10
    precision: "cap_window_days integer; all instants ISO 8601 UTC with 3 fractional digits; tier comparisons use >= at each boundary, so exactly 90.00 lands in the 60-day tier and exactly 80.00 in the 45-day tier"

  - name: capital_need_recurrence_count
    trigger: "POST /capital-needs/recompute"
    algorithm: aggregation
    formula: |
      history = [ i for i in Inspection
                  if i.property_id == P.id and i.status == CLOSED
                  and i.finalized_at is not null ]
      order history by  i.finalized_at DESC, then i.created_at DESC   # `id` never consulted
      if basis == INSPECTION_SCOPED:
          scope = first RECURRENCE_INSPECTION_WINDOW (2) entries of history
      if basis == CALENDAR_SCOPED:
          scope = [ i for i in history
                    if i.finalized_at >= current_utc - RECURRENCE_CALENDAR_DAYS (730) days ]
                    # inclusive lower bound: an inspection finalized exactly on the
                    # boundary instant IS inside the window
      for each DefectDefinition dd cited by at least one Deficiency of `scope`:
          recurrence_count[dd] = count of DISTINCT inspections in `scope` holding a
                                 Deficiency with defect_definition_id == dd.id
                                 and source == INSPECTION and status != VOIDED
      keep only dd with recurrence_count >= RECURRENCE_MIN_COUNT (2)
    input_set: "Deficiency rows with source == INSPECTION and status != VOIDED belonging to CLOSED Inspections of the property. SELF_ASSESSMENT deficiencies are excluded outright, so sweep findings never inflate a capital need."
    constants:
      RECURRENCE_INSPECTION_WINDOW: 2
      RECURRENCE_CALENDAR_DAYS: 730
      RECURRENCE_MIN_COUNT: 2
    precision: "integer counts; DISTINCT is taken over inspection_id, so two deficiencies of the same defect in one inspection count once"
    variants:
      - name: INSPECTION_SCOPED
        when: "request.recurrence_basis == INSPECTION_SCOPED"
        difference: "scope is the 2 most recently finalized CLOSED inspections regardless of age, so a defect that appeared in 3 inspections can never score above recurrence_count 2."
      - name: CALENDAR_SCOPED
        when: "request.recurrence_basis omitted (default) or == CALENDAR_SCOPED"
        difference: "scope is every CLOSED inspection finalized within the last 730 days regardless of how many that is, so the same defect history yields a strictly larger recurrence_count than INSPECTION_SCOPED whenever more than 2 in-window inspections cite it."

  - name: capital_need_priority_score
    trigger: "POST /capital-needs/recompute, immediately after capital_need_recurrence_count"
    algorithm: weighted_scoring
    formula: |
      priority_score = min(100.00,
          round_half_up(recurrence_count
                        * DefectDefinition.base_point_value
                        * SEVERITY_MULT[DefectDefinition.severity], 2))
    input_set: "One (property, defect definition) pair surviving the RECURRENCE_MIN_COUNT filter."
    constants:
      SEVERITY_MULT: { LIFE_THREATENING: 3.0, SEVERE: 2.0, MODERATE: 1.0, LOW: 0.5 }
      PRIORITY_SCORE_CAP: 100.00
    precision: "2 decimal places, round_half_up before the cap"

  - name: capital_reserve_allocation
    trigger: "POST /capital-needs/recompute, immediately after capital_need_priority_score"
    algorithm: waterfall_allocation
    formula: |
      items = CapitalNeedItem rows just created for this property (status == ACTIVE)
      order items by  priority_score DESC, then DefectDefinition.code ASC  # allocation_rank 1..n
      total_priority = sum(i.priority_score for i in items)
      if total_priority == 0 or len(items) == 0:
          every allocated_reserve_cents = 0
      else:
          # STEP 1 - floor every share to whole cents (NEVER round_half_up per item)
          for i in items:
              i.allocated_reserve_cents = floor(P.capital_reserve_cents
                                                * i.priority_score / total_priority)
          # STEP 2 - the floors under-allocate; hand the leftover out one cent at a
          #          time in allocation_rank order (priority_score DESC, code ASC),
          #          wrapping around if the remainder exceeds len(items)
          remainder = P.capital_reserve_cents - sum(i.allocated_reserve_cents)
          walk items in allocation_rank order, +1 cent each, until remainder == 0
      # INVARIANT: sum(allocated_reserve_cents) == P.capital_reserve_cents exactly
    input_set: "The ACTIVE CapitalNeedItem generation created by this recompute. Rows superseded by this recompute are set to allocated_reserve_cents = 0 and leave the sum."
    constants:
      ALLOCATION_ORDER: "priority_score DESC, DefectDefinition.code ASC"
    precision: "integer cents; floor per item then distribute the remainder. Rounding each share with round_half_up and summing is explicitly WRONG and produces different per-item cents than this pinned order."

  - name: notice_lead_hours
    trigger: "POST /sample-selections/{id}/notice"
    algorithm: aggregation
    formula: |
      notice_lead_hours = round_half_up(
          (Inspection.scheduled_start - SampleSelection.notified_at) / 3600 seconds, 2)
      # may be negative for a REPLACEMENT selection noticed after the window opened
    input_set: "The single SampleSelection being noticed plus the scheduled_start of its Inspection."
    constants:
      NOTICE_LEAD_HOURS_MIN: 48.00
    precision: "2 decimal places, round_half_up; the >= NOTICE_LEAD_HOURS_MIN gate is evaluated at POST /inspections/{id}/start over SAMPLED selections only"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "every required body field of the endpoint's input schema is present and correctly typed; numeric fields respect their declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"
  - priority: 4
    category: business_constraint
    check: "every enum-typed body field carries a declared member of that enum"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST/PATCH endpoints with enum inputs"
  - priority: 5
    category: existence
    check: "path-segment ids resolve to existing rows, validated left to right"
    error_id: "ERR_STANDARD_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_SAMPLE_SELECTION_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND | ERR_SWEEP_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_CAP_NOT_FOUND | ERR_CAPITAL_NEED_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 6
    category: existence
    check: "body foreign-key ids resolve to existing rows, validated in the endpoint's declared input order"
    error_id: "ERR_STANDARD_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_DEFECT_DEFINITION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK inputs"
  - priority: 7
    category: auth
    check: "for X-User-Role == PropertyOwner, X-User-ID equals the Property.id reached from the target resource (Property directly; Unit/Inspection/SelfAssessmentSweep via property_id; SampleSelection/Deficiency/Appeal/CorrectiveActionPlan via their inspection or sweep; WorkOrder via its sweep). Collection GET endpoints have no single target resource and instead return only rows reachable from the caller's own Property, so they never raise this error."
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include PropertyOwner"
  - priority: 8
    category: business_safety
    check: "on closure verification, X-User-ID differs from WorkOrder.completed_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /work-orders/{id}/verify-closure"
  - priority: 20
    category: state
    check: "the target resource's status/repair_status/verification_status/adoption_status admits this transition per 1.2"
    error_id: "ERR_STANDARD_ALREADY_ADOPTED | ERR_INSPECTION_INVALID_STATE | ERR_SELECTION_INVALID_STATE | ERR_DEFICIENCY_INVALID_STATE | ERR_SWEEP_INVALID_STATE | ERR_WORK_ORDER_INVALID_STATE | ERR_APPEAL_INVALID_STATE | ERR_CAP_INVALID_STATE | ERR_APPEAL_PENDING | ERR_FOLLOW_UP_NOT_CLOSED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 25
    category: state
    check: "expected_<parent>_version equals the current parent version (OCC per 1.2.1)"
    error_id: "ERR_STALE_INSPECTION_VERSION | ERR_STALE_SWEEP_VERSION | ERR_STALE_PROPERTY_VERSION"
    http_status: 412
    applies_to: "POST /inspections/{id}/deficiencies, POST /self-assessment-sweeps/{id}/findings, POST /capital-needs/recompute"
  - priority: 30
    category: business_safety
    check: "the Property.readiness_posture of the target property is not FROZEN"
    error_id: ERR_PROPERTY_FROZEN
    http_status: 409
    applies_to: "POST /inspections/{id}/draw-sample, POST /inspections/{id}/start"
  - priority: 32
    category: business_safety
    check: "no Deficiency of the inspection has severity == LIFE_THREATENING AND status IN {OPEN, OVERDUE}"
    error_id: ERR_LIFE_THREATENING_UNCORRECTED
    http_status: 409
    applies_to: "POST /inspections/{id}/score"
  - priority: 34
    category: business_safety
    check: "for a LIFE_THREATENING deficiency, corrected_at <= correction_due_at (the twenty-four-hour obligation)"
    error_id: ERR_LT_CORRECTION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /deficiencies/{id}/correction"
  - priority: 40
    category: business_referential
    check: "the cited DefectDefinition.standard_id equals the Inspection.standard_id pinned at inspection creation"
    error_id: ERR_DEFECT_DEFINITION_STANDARD_MISMATCH
    http_status: 422
    applies_to: "POST /inspections/{id}/deficiencies"
  - priority: 41
    category: business_referential
    check: "the cited InspectionStandard has adoption_status == ADOPTED"
    error_id: ERR_STANDARD_NOT_ADOPTED
    http_status: 409
    applies_to: "POST /inspections, POST /self-assessment-sweeps/{id}/findings, POST /_inject/completed-inspection-history"
  - priority: 42
    category: business_referential
    check: "request.inspectable_area equals the cited DefectDefinition.inspectable_area, and unit_id is present exactly when inspectable_area == UNIT"
    error_id: ERR_AREA_MISMATCH
    http_status: 422
    applies_to: "POST /inspections/{id}/deficiencies, POST /self-assessment-sweeps/{id}/findings"
  - priority: 43
    category: business_referential
    check: "contested_deficiency_id is required for both appeal types and must reference a Deficiency whose inspection_id equals the appealed inspection and whose status != VOIDED; requested_point_adjustment is present exactly when appeal_type == SCORE_CORRECTION"
    error_id: ERR_DEFICIENCY_NOT_IN_INSPECTION
    http_status: 422
    applies_to: "POST /appeals"
  - priority: 50
    category: business_temporal
    check: "Appeal.filed_at <= Inspection.appeal_deadline_at (the window frozen at first scoring)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"
  - priority: 51
    category: business_temporal
    check: "every submitted interval is strictly increasing: scheduled_end > scheduled_start, window_end > window_start, access_window_end > access_window_start"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /inspections, POST /self-assessment-sweeps, POST /sample-selections/{id}/notice, POST /corrective-action-plans/{id}/schedule-follow-up"
  - priority: 52
    category: business_temporal
    check: "CLOSED-interval overlap with a 72-hour cooldown buffer on each side: the requested [scheduled_start, scheduled_end] expanded by INSPECTION_COOLDOWN_BUFFER_HOURS must not intersect the expanded interval of any other Inspection on the same property with status NOT IN {CANCELLED, CLOSED}. Touching endpoints ARE a conflict under closed-interval arithmetic."
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections, POST /corrective-action-plans/{id}/schedule-follow-up"
  - priority: 53
    category: business_temporal
    check: "HALF-OPEN-interval overlap with no buffer: the requested [access_window_start, access_window_end) must not intersect the interval of any other SampleSelection with selection_status == ACTIVE and the same unit_id. An interval starting exactly when another ends is ACCEPTED."
    error_id: ERR_UNIT_ACCESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sample-selections/{id}/notice"
  - priority: 54
    category: business_temporal
    check: "AGGREGATE-CAPACITY overlap: at most SWEEP_OVERLAP_CAPACITY (2) SelfAssessmentSweep rows with status IN {PLANNED, IN_PROGRESS} may cover any single instant on one property, using half-open [window_start, window_end) intervals. The third sweep covering a shared instant is rejected."
    error_id: ERR_SWEEP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /self-assessment-sweeps"
  - priority: 55
    category: business_temporal
    check: "follow-up scheduled_start >= CorrectiveActionPlan.target_completion_at AND scheduled_start <= Inspection.followup_due_at"
    error_id: ERR_FOLLOW_UP_TOO_EARLY
    http_status: 422
    applies_to: "POST /corrective-action-plans/{id}/schedule-follow-up"
  - priority: 60
    category: business_constraint
    check: "for a UNIT-area deficiency, the cited unit holds an ACTIVE SampleSelection of this inspection with access_status == GRANTED"
    error_id: ERR_UNIT_ACCESS_NOT_GRANTED
    http_status: 409
    applies_to: "POST /inspections/{id}/deficiencies"
  - priority: 61
    category: business_constraint
    check: "every SampleSelection with selection_status == ACTIVE has access_status IN {GRANTED, REFUSED}"
    error_id: ERR_ACCESS_NOT_RECORDED
    http_status: 409
    applies_to: "POST /inspections/{id}/score"
  - priority: 62
    category: business_constraint
    check: "the cited unit's property_id equals the inspection's property_id and the unit holds an ACTIVE SampleSelection of that inspection"
    error_id: ERR_UNIT_NOT_IN_SAMPLE
    http_status: 422
    applies_to: "POST /inspections/{id}/deficiencies"
  - priority: 63
    category: business_constraint
    check: "unit_weight_pct + inside_weight_pct + outside_weight_pct == 100.00"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /inspection-standards"
  - priority: 64
    category: business_constraint
    check: "the standard has life_threatening_definition_count >= 1 at adoption"
    error_id: ERR_NO_LIFE_THREATENING_DEFINITION
    http_status: 422
    applies_to: "POST /inspection-standards/{id}/adopt"
  - priority: 65
    category: business_constraint
    check: "scope-local uniqueness: InspectionStandard.code among adoption_status IN {DRAFT, ADOPTED}; DefectDefinition.code within standard_id; Unit.unit_number within property_id"
    error_id: "ERR_DUPLICATE_STANDARD_CODE | ERR_DUPLICATE_DEFECT_CODE | ERR_DUPLICATE_UNIT_NUMBER"
    http_status: 409
    applies_to: "POST /inspection-standards, POST /defect-definitions, POST /units"
  - priority: 66
    category: business_constraint
    check: "correction_deadline_hours == 24 when severity == LIFE_THREATENING"
    error_id: ERR_LT_DEADLINE_MUST_BE_24H
    http_status: 422
    applies_to: "POST /defect-definitions"
  - priority: 67
    category: business_constraint
    check: "Appeal.resubmission_count < APPEAL_RESUBMIT_LIMIT (2)"
    error_id: ERR_APPEAL_RESUBMIT_LIMIT
    http_status: 409
    applies_to: "POST /appeals/{id}/resubmit"
  - priority: 68
    category: business_constraint
    check: "SelfAssessmentSweep.closure_verified_rate >= SWEEP_CLOSURE_RATE_FLOOR (90.00) when closing from IN_PROGRESS"
    error_id: ERR_SWEEP_CLOSURE_RATE_TOO_LOW
    http_status: 409
    applies_to: "POST /self-assessment-sweeps/{id}/close"
  - priority: 69
    category: business_constraint
    check: "the unit_sample_size eligibility filter yields at least one candidate"
    error_id: ERR_NO_ELIGIBLE_UNITS
    http_status: 422
    applies_to: "POST /inspections/{id}/draw-sample"
  - priority: 70
    category: business_constraint
    check: "every ACTIVE SampleSelection with selection_basis == SAMPLED has notice_lead_hours >= NOTICE_LEAD_HOURS_MIN (48.00)"
    error_id: ERR_NOTICE_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: "POST /inspections/{id}/start"
  - priority: 71
    category: business_constraint
    check: "request.inspectable_area is admitted by SelfAssessmentSweep.planned_area_scope"
    error_id: ERR_AREA_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /self-assessment-sweeps/{id}/findings"
  - priority: 80
    category: business_fiscal
    check: "CorrectiveActionPlan.total_estimated_cost_cents <= Property.capital_reserve_cents"
    error_id: ERR_CAP_COST_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "POST /corrective-action-plans, POST /corrective-action-plans/{id}/resubmit"
  - priority: 81
    category: business_fiscal
    check: "target_completion_at <= Inspection.cap_due_at"
    error_id: ERR_CAP_TARGET_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /corrective-action-plans, POST /corrective-action-plans/{id}/resubmit"
  - priority: 82
    category: business_fiscal
    check: "on a granted SCORE_CORRECTION appeal, granted_point_adjustment is present (ERR_ADJUSTMENT_REQUIRED) and satisfies 0.00 < granted_point_adjustment <= the contested Deficiency.points_deducted (ERR_ADJUSTMENT_EXCEEDS_POINTS)"
    error_id: "ERR_ADJUSTMENT_REQUIRED | ERR_ADJUSTMENT_EXCEEDS_POINTS"
    http_status: 422
    applies_to: "POST /appeals/{id}/review"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Inspection standard adoption -----------------------------------------
  - method: POST
    path: "/inspection-standards"
    description: "Register a DRAFT inspection standard with its inspectable-area weighting"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, effective_date, unit_weight_pct, inside_weight_pct, outside_weight_pct]
    output: InspectionStandard
    side_effects:
      - "creates the standard with adoption_status DRAFT, adopted_at null, superseded_at null"
      - "sets defect_definition_count 0 and life_threatening_definition_count 0"
  - method: POST
    path: "/inspection-standards/{id}/adopt"
    description: "Adopt a DRAFT standard, superseding any previously ADOPTED standard sharing its code"
    roles: [PlatformAdmin]
    code: 200
    input: [adopted_at]
    output: InspectionStandard
    side_effects:
      - "DRAFT -> ADOPTED; sets adopted_at to the logical clock"
      - "any other InspectionStandard with the same code and adoption_status ADOPTED transitions ADOPTED -> SUPERSEDED with superseded_at set"
      - "increments InspectionStandard.version by 1"
  - method: GET
    path: "/inspection-standards/{id}"
    description: "Read one inspection standard including its derived definition counts"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: InspectionStandard
    side_effects: []
  - method: GET
    path: "/inspection-standards"
    description: "List inspection standards"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["code?", "adoption_status?", "limit?", "offset?"]
    output: InspectionStandard[]
    side_effects: []

  # --- Defect definitions ---------------------------------------------------
  - method: POST
    path: "/defect-definitions"
    description: "Define a scoreable defect under a standard, fixing its inspectable area, severity and correction clock"
    roles: [PlatformAdmin]
    code: 201
    input: [standard_id, code, name, inspectable_area, severity, base_point_value, correction_deadline_hours]
    output: DefectDefinition
    side_effects:
      - "sets is_life_threatening from severity"
      - "recomputes the parent InspectionStandard.defect_definition_count and life_threatening_definition_count"
      - "increments InspectionStandard.version by 1"
  - method: GET
    path: "/defect-definitions/{id}"
    description: "Read one defect definition"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DefectDefinition
    side_effects: []
  - method: GET
    path: "/defect-definitions"
    description: "List defect definitions, filterable by owning standard"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["standard_id?", "inspectable_area?", "severity?", "limit?", "offset?"]
    output: DefectDefinition[]
    side_effects: []

  # --- Properties and units -------------------------------------------------
  - method: POST
    path: "/properties"
    description: "Register an assisted-housing property; its id is the X-User-ID a PropertyOwner acts under"
    roles: [PlatformAdmin]
    code: 201
    input: [name, total_unit_count, capital_reserve_cents, owner_contact_email]
    output: Property
    side_effects:
      - "sets readiness_posture READY and every derived counter to 0, last_final_score null, last_sweep_closed_at null"
  - method: GET
    path: "/properties/{id}"
    description: "Read one property including readiness_posture and the derived deficiency counters"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List properties"
    roles: [HousingAgencyInspector, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["readiness_posture?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: PATCH
    path: "/properties/{id}"
    description: "Update property attributes including the capital reserve available for allocation"
    roles: [PropertyOwner, PlatformAdmin]
    code: 200
    input: ["name?", "total_unit_count?", "capital_reserve_cents?", "owner_contact_email?"]
    output: Property
    side_effects:
      - "increments Property.version by 1"
  - method: POST
    path: "/units"
    description: "Register a dwelling unit on a property"
    roles: [PlatformAdmin]
    code: 201
    input: [property_id, unit_number, bedroom_count, "occupancy_status?", "occupant_display_name?"]
    output: Unit
    side_effects:
      - "sets prior_deficiency_count 0 and open_deficiency_count 0"
  - method: GET
    path: "/units/{id}"
    description: "Read one dwelling unit including its derived deficiency counters"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/units"
    description: "List dwelling units, filterable by owning property"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["property_id?", "occupancy_status?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: PATCH
    path: "/units/{id}"
    description: "Update occupancy attributes of a dwelling unit, which changes its sampling eligibility"
    roles: [PropertyOwner, PlatformAdmin]
    code: 200
    input: ["bedroom_count?", "occupancy_status?", "occupant_display_name?"]
    output: Unit
    side_effects:
      - "increments Unit.version by 1"

  # --- Pre-inspection self-assessment sweeps --------------------------------
  - method: POST
    path: "/self-assessment-sweeps"
    description: "Plan a pre-inspection self-assessment sweep over a window on the property"
    roles: [PropertyOwner, PlatformAdmin]
    code: 201
    input: [property_id, window_start, window_end, planned_area_scope]
    output: SelfAssessmentSweep
    side_effects:
      - "creates the sweep with status PLANNED and every derived work-order counter 0"
      - "sets closure_verified_rate to 100.00 per the zero-denominator pin in sweep_closure_verified_rate"
  - method: GET
    path: "/self-assessment-sweeps/{id}"
    description: "Read one sweep including generated_work_order_count, verified_work_order_count, void_work_order_count, urgent_work_order_count and closure_verified_rate"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SelfAssessmentSweep
    side_effects: []
  - method: GET
    path: "/self-assessment-sweeps"
    description: "List sweeps, filterable by owning property"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: SelfAssessmentSweep[]
    side_effects: []
  - method: POST
    path: "/self-assessment-sweeps/{id}/start"
    description: "Begin a planned sweep so findings may be recorded against it"
    roles: [PropertyOwner, PlatformAdmin]
    code: 200
    input: [started_at]
    output: SelfAssessmentSweep
    side_effects:
      - "PLANNED -> IN_PROGRESS; sets started_at to the logical clock"
      - "increments SelfAssessmentSweep.version by 1"
  - method: POST
    path: "/self-assessment-sweeps/{id}/findings"
    description: "Record a self-assessment finding on an IN_PROGRESS sweep; creates a SELF_ASSESSMENT Deficiency and the WorkOrder that remediates it"
    roles: [PropertyOwner, MaintenanceTechnician]
    code: 201
    input: [expected_sweep_version, defect_definition_id, inspectable_area, observed_at, "unit_id?", "supersedes_deficiency_id?", "note?"]
    output: WorkOrder
    side_effects:
      - "creates a Deficiency with source SELF_ASSESSMENT, sweep_id set, inspection_id null, status OPEN, severity copied from the definition, correction_due_at = observed_at + correction_deadline_hours, points_deducted per deficiency_points_deducted"
      - "creates a WorkOrder with repair_status OPEN, verification_status UNVERIFIED, priority_tier ROUTINE, due_at = the deficiency's correction_due_at"
      - "recomputes the sweep's generated_work_order_count, open_work_order_count, urgent_work_order_count and closure_verified_rate"
      - "recomputes Property.open_life_threatening_count, open_severe_count and readiness_posture, which may raise this sweep's OPEN work orders to URGENT"
      - "increments SelfAssessmentSweep.version by 1"
  - method: POST
    path: "/self-assessment-sweeps/{id}/close"
    description: "Close a sweep once its closure_verified_rate clears the floor; a PLANNED sweep that never started is ABANDONED instead"
    roles: [PropertyOwner, PlatformAdmin]
    code: 200
    input: [closed_at]
    output: SelfAssessmentSweep
    side_effects:
      - "IN_PROGRESS -> CLOSED when closure_verified_rate >= SWEEP_CLOSURE_RATE_FLOOR; PLANNED -> ABANDONED when started_at is null"
      - "sets closed_at to the logical clock"
      - "on CLOSED, updates Property.last_sweep_closed_at"
      - "increments SelfAssessmentSweep.version by 1"

  # --- Work orders ----------------------------------------------------------
  - method: GET
    path: "/work-orders/{id}"
    description: "Read one work order with its two independent status dimensions, priority_tier and due_at"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List work orders, filterable by owning sweep or remediated deficiency"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["sweep_id?", "deficiency_id?", "repair_status?", "verification_status?", "priority_tier?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Record the repair on a work order; the acting X-User-ID is stored for the segregation-of-duties check at verification"
    roles: [MaintenanceTechnician]
    code: 200
    input: [completed_at, resolution_note]
    output: WorkOrder
    side_effects:
      - "repair_status OPEN -> REPAIRED; sets completed_at = request.completed_at and completed_by_user_id = X-User-ID"
      - "bubbles the linked Deficiency OPEN -> CORRECTED once every non-VOID work order sharing deficiency_id is REPAIRED"
      - "recomputes the sweep's open_work_order_count and closure_verified_rate"
      - "increments WorkOrder.version, Deficiency.version and SelfAssessmentSweep.version by 1"
  - method: POST
    path: "/work-orders/{id}/verify-closure"
    description: "Verify or reject the closure of a repaired work order; the verifier must differ from the completer"
    roles: [PropertyOwner, QualityAssuranceReviewer]
    code: 200
    input: [verification_result, verified_at]
    output: WorkOrder
    side_effects:
      - "on PASSED: verification_status UNVERIFIED -> VERIFIED; the remediated Deficiency moves CORRECTED -> VERIFIED; Property.readiness_posture is re-derived and URGENT work orders may be demoted to ROUTINE"
      - "on FAILED: verification_status UNVERIFIED -> REJECTED, repair_status returns to OPEN, rejection_count increases by 1 and the remediated Deficiency returns CORRECTED -> OPEN"
      - "sets verified_at = request.verified_at and verified_by_user_id = X-User-ID"
      - "recomputes the sweep's verified_work_order_count, open_work_order_count and closure_verified_rate"
      - "increments WorkOrder.version by 1 and SelfAssessmentSweep.version by 1"
  - method: POST
    path: "/work-orders/{id}/void"
    description: "Void a work order raised in error; voided rows leave the closure-rate denominator"
    roles: [PropertyOwner, PlatformAdmin]
    code: 200
    input: [void_reason]
    output: WorkOrder
    side_effects:
      - "repair_status -> VOID"
      - "recomputes the sweep's void_work_order_count, open_work_order_count, urgent_work_order_count and closure_verified_rate"
      - "increments WorkOrder.version by 1 and SelfAssessmentSweep.version by 1"

  # --- Inspections ----------------------------------------------------------
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection, pinning the ADOPTED standard whose weights will score it"
    roles: [HousingAgencyInspector]
    code: 201
    input: [property_id, standard_id, scheduled_start, scheduled_end, "inspection_kind?"]
    output: Inspection
    side_effects:
      - "creates the inspection with status SCHEDULED, sample_tier_value 0, sample_size 0 and every score field null"
      - "pins standard_id so a later SUPERSEDED transition on that standard never changes this inspection's weights"
  - method: GET
    path: "/inspections/{id}"
    description: "Read one inspection including sample_tier_value, sample_size, inspected_unit_count, refused_unit_count, the three area point sums, total_points_deducted, life_threatening_count, provisional_score, final_score, appeal_deadline_at, cap_required, cap_window_days, cap_due_at and followup_due_at"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections, filterable by property or pinned standard"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["property_id?", "standard_id?", "status?", "inspection_kind?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/draw-sample"
    description: "Draw the unit sample using the tier policy, eligibility filter and ranking of unit_sample_size"
    roles: [HousingAgencyInspector]
    code: 200
    input: [drawn_at]
    output: Inspection
    side_effects:
      - "SCHEDULED -> SAMPLED; sets drawn_at, sample_tier_value and sample_size"
      - "creates one SampleSelection per drawn unit with selection_basis SAMPLED, selection_status ACTIVE, access_status NOT_NOTIFIED and selection_rank following the ranking expression"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/inspections/{id}/start"
    description: "Begin the on-site inspection once every sampled unit has a compliant tenant notice"
    roles: [HousingAgencyInspector]
    code: 200
    input: [started_at]
    output: Inspection
    side_effects:
      - "NOTIFIED -> IN_PROGRESS; sets started_at"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/inspections/{id}/deficiencies"
    description: "Record one observed deficiency against an in-progress inspection under optimistic concurrency on the inspection"
    roles: [HousingAgencyInspector]
    code: 201
    input: [expected_inspection_version, defect_definition_id, inspectable_area, observed_at, "unit_id?", "supersedes_deficiency_id?", "note?"]
    output: Deficiency
    side_effects:
      - "creates the Deficiency with source INSPECTION, status OPEN, severity copied from the definition, points_deducted per deficiency_points_deducted and correction_due_at = observed_at + correction_deadline_hours"
      - "recomputes the inspection's area point sums, total_points_deducted and life_threatening_count (CASCADE A links 2-5)"
      - "re-derives Property.readiness_posture, which may raise every OPEN WorkOrder on the property to URGENT and pull its due_at in by URGENT_DUE_PULL_IN_HOURS"
      - "increments Inspection.version by 1 and writes the post-cascade value to Deficiency.inspection_version_after_record"
      - "recomputes Unit.open_deficiency_count on the cited unit"
  - method: POST
    path: "/inspections/{id}/score"
    description: "Publish the provisional and final scores and open the appeal window"
    roles: [HousingAgencyInspector]
    code: 200
    input: [scored_at]
    output: Inspection
    side_effects:
      - "IN_PROGRESS -> SCORED; sets scored_at, provisional_score (PROVISIONAL variant) and final_score (FINAL variant)"
      - "sets appeal_deadline_at = scored_at + APPEAL_WINDOW_HOURS, frozen against later rescores"
      - "sets Property.last_final_score and re-derives readiness_posture"
      - "increments Inspection.version by 1 and Property.version by 1"
  - method: POST
    path: "/inspections/{id}/finalize"
    description: "Finalize a scored inspection into CAP_REQUIRED or CLOSED, or close a parent inspection whose follow-up already closed"
    roles: [HousingAgencyInspector]
    code: 200
    input: [finalized_at]
    output: Inspection
    side_effects:
      - "SCORED -> CAP_REQUIRED when cap_required evaluates true; sets cap_window_days, cap_due_at and followup_due_at from cap_window_and_followup_schedule"
      - "SCORED -> CLOSED when cap_required evaluates false; recomputes Unit.prior_deficiency_count for every unit carrying a non-VOIDED deficiency of this inspection"
      - "FOLLOW_UP_SCHEDULED -> CLOSED on the parent inspection; a FOLLOW_UP inspection reaching CLOSED drives its CorrectiveActionPlan FOLLOW_UP_SCHEDULED -> COMPLETED"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/inspections/{id}/cancel"
    description: "Cancel an inspection that has not yet started, releasing every sample slot"
    roles: [HousingAgencyInspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "status IN {SCHEDULED, SAMPLED, NOTIFIED} -> CANCELLED"
      - "sets every SampleSelection of this inspection to selection_status REPLACED"
      - "increments Inspection.version by 1"

  # --- Sample selections, tenant notice and access --------------------------
  - method: GET
    path: "/sample-selections/{id}"
    description: "Read one sample slot including selection_rank, selection_basis, access_status and notice_lead_hours"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SampleSelection
    side_effects: []
  - method: GET
    path: "/sample-selections"
    description: "List sample slots, filterable by inspection, unit or the refused slot a replacement substitutes"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["inspection_id?", "unit_id?", "replaced_selection_id?", "selection_basis?", "selection_status?", "access_status?", "limit?", "offset?"]
    output: SampleSelection[]
    side_effects: []
  - method: POST
    path: "/sample-selections/{id}/notice"
    description: "Record delivery of the tenant notice and the agreed half-open entry window on this unit"
    roles: [PropertyOwner]
    code: 200
    input: [notice_method, notified_at, access_window_start, access_window_end]
    output: SampleSelection
    side_effects:
      - "access_status NOT_NOTIFIED -> NOTIFIED; stores the notice fields and computes notice_lead_hours per notice_lead_hours"
      - "bubbles the owning Inspection SAMPLED -> NOTIFIED once every ACTIVE selection is NOTIFIED"
      - "increments SampleSelection.version by 1"
  - method: POST
    path: "/sample-selections/{id}/access"
    description: "Record whether the household granted or refused entry; refusal runs the replacement selector"
    roles: [HousingAgencyInspector]
    code: 200
    input: [access_result, recorded_at, "refusal_reason?"]
    output: SampleSelection
    side_effects:
      - "on GRANTED: access_status NOTIFIED -> GRANTED and Inspection.inspected_unit_count is recomputed"
      - "on REFUSED: access_status NOTIFIED -> REFUSED; when an eligible unreached unit exists this slot becomes selection_status REPLACED and a REPLACEMENT SampleSelection is created with replaced_selection_id set; when none exists the refused slot stays ACTIVE and attracts REFUSAL_PENALTY_POINTS in the FINAL variant"
      - "recomputes Inspection.refused_unit_count and sample_size"
      - "increments SampleSelection.version and Inspection.version by 1"

  # --- Deficiencies ---------------------------------------------------------
  - method: GET
    path: "/deficiencies/{id}"
    description: "Read one deficiency including severity, points_deducted, recurrence_applied, correction_due_at and inspection_version_after_record"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Deficiency
    side_effects: []
  - method: GET
    path: "/deficiencies"
    description: "List deficiencies, filterable by owning inspection or sweep, unit, cited definition, or the earlier deficiency they recur from"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["inspection_id?", "sweep_id?", "unit_id?", "defect_definition_id?", "supersedes_deficiency_id?", "source?", "status?", "severity?", "limit?", "offset?"]
    output: Deficiency[]
    side_effects: []
  - method: POST
    path: "/deficiencies/{id}/correction"
    description: "Record the owner's correction of a deficiency; a life-threatening deficiency must be corrected inside its twenty-four-hour clock"
    roles: [PropertyOwner]
    code: 200
    input: [corrected_at, "note?"]
    output: Deficiency
    side_effects:
      - "status OPEN or OVERDUE -> CORRECTED; sets corrected_at"
      - "recomputes Property.open_life_threatening_count, overdue_life_threatening_count, open_severe_count and re-derives readiness_posture"
      - "recomputes Unit.open_deficiency_count"
      - "increments Deficiency.version and Property.version by 1"
  - method: POST
    path: "/deficiencies/{id}/verification"
    description: "Verify or reject a claimed correction; rejection returns the deficiency to OPEN without extending its due date"
    roles: [HousingAgencyInspector]
    code: 200
    input: [verification_result, verified_at, "note?"]
    output: Deficiency
    side_effects:
      - "on PASSED: CORRECTED -> VERIFIED; sets verified_at"
      - "on FAILED: CORRECTED -> OPEN and clears corrected_at to null"
      - "recomputes the Property counters and re-derives readiness_posture"
      - "increments Deficiency.version and Property.version by 1"

  # --- Appeals of technical errors and score corrections --------------------
  - method: POST
    path: "/appeals"
    description: "File an appeal against a scored inspection, inside the frozen appeal window"
    roles: [PropertyOwner]
    code: 201
    input: [inspection_id, appeal_type, rationale, filed_at, "contested_deficiency_id?", "requested_point_adjustment?"]
    output: Appeal
    side_effects:
      - "creates the appeal with status SUBMITTED, resubmission_count 0, granted_point_adjustment null"
      - "drives the Inspection SCORED -> APPEALED"
      - "increments Inspection.version by 1"
  - method: GET
    path: "/appeals/{id}"
    description: "Read one appeal including resubmission_count and granted_point_adjustment"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals, filterable by appealed inspection or contested deficiency"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["inspection_id?", "contested_deficiency_id?", "appeal_type?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/review"
    description: "Grant, deny or return an appeal for more information; granting rescores the inspection"
    roles: [AppealsOfficer]
    code: 200
    input: [decision, decided_at, "reviewer_note?", "granted_point_adjustment?"]
    output: Appeal
    side_effects:
      - "on GRANTED with appeal_type TECHNICAL_ERROR: the contested Deficiency becomes VOIDED with points_deducted 0.00 (CASCADE B links 2-4)"
      - "on GRANTED with appeal_type SCORE_CORRECTION: reduces the contested Deficiency.points_deducted by granted_point_adjustment, floored at 0.00"
      - "on GRANTED or DENIED, once no non-terminal appeal remains: returns the Inspection APPEALED -> SCORED, recomputing the score fields and rescored_at on a grant and leaving them untouched on a denial"
      - "on RETURNED_FOR_INFO: leaves the Inspection in APPEALED"
      - "rewrites Property.last_final_score and re-derives readiness_posture when final_score changed"
      - "increments Appeal.version, Inspection.version and Property.version by 1"
  - method: POST
    path: "/appeals/{id}/resubmit"
    description: "Resubmit a returned appeal with additional evidence, at most APPEAL_RESUBMIT_LIMIT times"
    roles: [PropertyOwner]
    code: 200
    input: [additional_evidence]
    output: Appeal
    side_effects:
      - "RETURNED_FOR_INFO -> SUBMITTED; stores additional_evidence, increments resubmission_count by 1 and clears decided_at"
      - "increments Appeal.version by 1"

  # --- Corrective action plans and follow-up scheduling ---------------------
  - method: POST
    path: "/corrective-action-plans"
    description: "Submit a corrective action plan for an inspection that requires one"
    roles: [PropertyOwner]
    code: 201
    input: [inspection_id, narrative, total_estimated_cost_cents, milestone_count, target_completion_at, submitted_at]
    output: CorrectiveActionPlan
    side_effects:
      - "creates the plan with status SUBMITTED, revision_count 0, follow_up_inspection_id null"
  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Read one corrective action plan including revision_count and follow_up_inspection_id"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: GET
    path: "/corrective-action-plans"
    description: "List corrective action plans, filterable by the inspection they address or the follow-up inspection they created"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["inspection_id?", "follow_up_inspection_id?", "status?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []
  - method: POST
    path: "/corrective-action-plans/{id}/review"
    description: "Approve or reject a submitted corrective action plan"
    roles: [QualityAssuranceReviewer]
    code: 200
    input: [decision, decided_at, "reviewer_note?"]
    output: CorrectiveActionPlan
    side_effects:
      - "on APPROVED: SUBMITTED -> APPROVED and the Inspection moves CAP_REQUIRED -> CAP_APPROVED"
      - "on REJECTED: SUBMITTED -> REJECTED and the Inspection stays CAP_REQUIRED"
      - "increments CorrectiveActionPlan.version and Inspection.version by 1"
  - method: POST
    path: "/corrective-action-plans/{id}/resubmit"
    description: "Resubmit a rejected plan with a revised scope, cost and completion commitment"
    roles: [PropertyOwner]
    code: 200
    input: [narrative, total_estimated_cost_cents, milestone_count, target_completion_at]
    output: CorrectiveActionPlan
    side_effects:
      - "REJECTED -> SUBMITTED; overwrites the plan fields, increments revision_count by 1 and clears decided_at and reviewer_note"
      - "increments CorrectiveActionPlan.version by 1"
  - method: POST
    path: "/corrective-action-plans/{id}/schedule-follow-up"
    description: "Schedule the follow-up inspection an approved plan owes, creating a FOLLOW_UP Inspection on the same property and standard"
    roles: [HousingAgencyInspector]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: Inspection
    side_effects:
      - "creates a FOLLOW_UP Inspection with status SCHEDULED and writes its id to CorrectiveActionPlan.follow_up_inspection_id"
      - "APPROVED -> FOLLOW_UP_SCHEDULED on the plan and CAP_APPROVED -> FOLLOW_UP_SCHEDULED on the parent inspection"
      - "recomputes Unit.prior_deficiency_count for every unit carrying a non-VOIDED deficiency of the parent inspection"
      - "increments CorrectiveActionPlan.version and Inspection.version by 1"

  # --- Capital needs planning ----------------------------------------------
  - method: POST
    path: "/capital-needs/recompute"
    description: "Recompute the property's capital needs plan from recurring deficiencies under optimistic concurrency on the property"
    roles: [PropertyOwner]
    code: 200
    input: [property_id, expected_property_version, "recurrence_basis?"]
    output: CapitalNeedItem[]
    side_effects:
      - "supersedes every ACTIVE CapitalNeedItem of the property"
      - "creates one ACTIVE CapitalNeedItem per DefectDefinition whose recurrence_count under the selected recurrence_basis reaches RECURRENCE_MIN_COUNT, with priority_score, allocation_rank, allocated_reserve_cents and computed_at set"
      - "recomputes Property.allocated_reserve_total_cents"
      - "increments Property.version by 1"
  - method: GET
    path: "/capital-needs/{id}"
    description: "Read one capital need item including recurrence_basis, recurrence_count, priority_score, allocation_rank and allocated_reserve_cents"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CapitalNeedItem
    side_effects: []
  - method: GET
    path: "/capital-needs"
    description: "List capital need items, filterable by property or driving defect definition"
    roles: [PropertyOwner, HousingAgencyInspector, MaintenanceTechnician, QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin]
    code: 200
    input: ["property_id?", "defect_definition_id?", "status?", "recurrence_basis?", "limit?", "offset?"]
    output: CapitalNeedItem[]
    side_effects: []

  # --- Test-driving endpoints (outside the public business surface) ---------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock strictly past a Deficiency.correction_due_at trips that deficiency OPEN -> OVERDUE and re-derives the owning Property.readiness_posture."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every OPEN Deficiency whose correction_due_at is strictly before the new value becomes OVERDUE (a clock exactly equal to correction_due_at does not trip it)"
      - "recomputes Property.overdue_life_threatening_count and re-derives readiness_posture, FROZEN once overdue_life_threatening_count >= 1"
      - "increments the version of every touched Deficiency and Property by 1"
  - method: POST
    path: "/_inject/completed-inspection-history"
    description: "Inject one already-CLOSED historical inspection with its VERIFIED deficiencies, so recurrence-driven capital needs planning can be exercised without replaying a full inspection lifecycle per historical cycle"
    roles: [PlatformAdmin]
    code: 201
    input: [property_id, standard_id, finalized_at, defect_definition_ids, "unit_id?"]
    output: Inspection
    side_effects:
      - "creates one Inspection with inspection_kind INITIAL, status CLOSED, scored_at = finalized_at, finalized_at as supplied and cap_required false"
      - "creates one Deficiency with source INSPECTION and status VERIFIED per entry of defect_definition_ids, each with observed_at = finalized_at, corrected_at = finalized_at and verified_at = finalized_at"
      - "recomputes Unit.prior_deficiency_count for the cited unit; leaves Property.readiness_posture untouched because no deficiency is left OPEN"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- authentication and authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "a PropertyOwner acts on a resource that does not reach their own Property.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "closure verification attempted by the same X-User-ID that recorded the repair on that work order"
  # -- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing or has the wrong type, or a numeric field falls outside its declared range"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed body field carries a value that is not a declared member of that enum"
  # -- existence -------------------------------------------------------------
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: "no InspectionStandard exists for the supplied id"
  - id: ERR_DEFECT_DEFINITION_NOT_FOUND
    http: 404
    condition: "no DefectDefinition exists for the supplied id"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no Property exists for the supplied id"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "no Unit exists for the supplied id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection exists for the supplied id"
  - id: ERR_SAMPLE_SELECTION_NOT_FOUND
    http: 404
    condition: "no SampleSelection exists for the supplied id"
  - id: ERR_DEFICIENCY_NOT_FOUND
    http: 404
    condition: "no Deficiency exists for the supplied id"
  - id: ERR_SWEEP_NOT_FOUND
    http: 404
    condition: "no SelfAssessmentSweep exists for the supplied id"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "no WorkOrder exists for the supplied id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no Appeal exists for the supplied id"
  - id: ERR_CAP_NOT_FOUND
    http: 404
    condition: "no CorrectiveActionPlan exists for the supplied id"
  - id: ERR_CAPITAL_NEED_NOT_FOUND
    http: 404
    condition: "no CapitalNeedItem exists for the supplied id"
  # -- state -----------------------------------------------------------------
  - id: ERR_STANDARD_ALREADY_ADOPTED
    http: 409
    condition: "adopt requested on a standard whose adoption_status is already ADOPTED or SUPERSEDED"
  - id: ERR_INSPECTION_INVALID_STATE
    http: 409
    condition: "the requested inspection transition is not declared from the inspection's current status"
  - id: ERR_SELECTION_INVALID_STATE
    http: 409
    condition: "notice or access requested on a sample slot whose access_status or selection_status does not admit it"
  - id: ERR_DEFICIENCY_INVALID_STATE
    http: 409
    condition: "correction requested on a deficiency that is not OPEN or OVERDUE, or verification requested on one that is not CORRECTED"
  - id: ERR_SWEEP_INVALID_STATE
    http: 409
    condition: "the requested sweep transition is not declared from the sweep's current status"
  - id: ERR_WORK_ORDER_INVALID_STATE
    http: 409
    condition: "completion requested when repair_status is not OPEN, verification requested when repair_status is not REPAIRED, or void requested when verification_status is VERIFIED"
  - id: ERR_APPEAL_INVALID_STATE
    http: 409
    condition: "review requested on a terminal appeal, or resubmit requested on an appeal that is not RETURNED_FOR_INFO"
  - id: ERR_CAP_INVALID_STATE
    http: 409
    condition: "the requested corrective action plan transition is not declared from the plan's current status, or the owning inspection is not in the required status"
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "finalize requested while an Appeal of the inspection is still SUBMITTED or RETURNED_FOR_INFO"
  - id: ERR_FOLLOW_UP_NOT_CLOSED
    http: 409
    condition: "finalize requested on a FOLLOW_UP_SCHEDULED inspection whose follow-up inspection has not reached CLOSED"
  # -- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_INSPECTION_VERSION
    http: 412
    condition: "expected_inspection_version does not equal the current Inspection.version"
  - id: ERR_STALE_SWEEP_VERSION
    http: 412
    condition: "expected_sweep_version does not equal the current SelfAssessmentSweep.version"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not equal the current Property.version"
  # -- life-safety gating ----------------------------------------------------
  - id: ERR_PROPERTY_FROZEN
    http: 409
    condition: "sampling or inspection start requested while Property.readiness_posture is FROZEN"
  - id: ERR_LIFE_THREATENING_UNCORRECTED
    http: 409
    condition: "scoring requested while a LIFE_THREATENING deficiency of the inspection is still OPEN or OVERDUE"
  - id: ERR_LT_CORRECTION_DEADLINE_PASSED
    http: 422
    condition: "a LIFE_THREATENING deficiency is corrected with corrected_at strictly after its twenty-four-hour correction_due_at"
  # -- referential integrity between standards, definitions and observations --
  - id: ERR_STANDARD_NOT_ADOPTED
    http: 409
    condition: "the cited InspectionStandard has adoption_status DRAFT or SUPERSEDED"
  - id: ERR_DEFECT_DEFINITION_STANDARD_MISMATCH
    http: 422
    condition: "the cited DefectDefinition belongs to a standard other than the one pinned to the inspection"
  - id: ERR_AREA_MISMATCH
    http: 422
    condition: "the submitted inspectable_area differs from the cited definition's inspectable_area, or unit_id presence disagrees with a UNIT-area observation"
  - id: ERR_AREA_OUT_OF_SCOPE
    http: 422
    condition: "the submitted inspectable_area is not admitted by the sweep's planned_area_scope"
  - id: ERR_DEFICIENCY_NOT_IN_INSPECTION
    http: 422
    condition: "contested_deficiency_id names a deficiency of a different inspection, or is absent on a TECHNICAL_ERROR appeal, or present on a SCORE_CORRECTION appeal without belonging to the appealed inspection"
  # -- temporal --------------------------------------------------------------
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "a submitted interval is empty or inverted (end not strictly after start)"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "filed_at is strictly after the inspection's frozen appeal_deadline_at"
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "the requested inspection window, expanded by the 72-hour cooldown buffer, intersects another live inspection window on the same property under closed-interval arithmetic"
  - id: ERR_UNIT_ACCESS_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open entry window overlaps another ACTIVE sample slot's window on the same unit"
  - id: ERR_SWEEP_CAPACITY_EXCEEDED
    http: 409
    condition: "a third live sweep would cover an instant already covered by two live sweeps on the property"
  - id: ERR_FOLLOW_UP_TOO_EARLY
    http: 422
    condition: "the follow-up window starts before the plan's target_completion_at or after the inspection's followup_due_at"
  - id: ERR_NOTICE_WINDOW_TOO_SHORT
    http: 422
    condition: "an ACTIVE SAMPLED slot has notice_lead_hours below NOTICE_LEAD_HOURS_MIN when the inspection is started"
  # -- sampling and access constraints ---------------------------------------
  - id: ERR_NO_ELIGIBLE_UNITS
    http: 422
    condition: "no unit of the property passes the sampling eligibility filter"
  - id: ERR_UNIT_NOT_IN_SAMPLE
    http: 422
    condition: "the cited unit is not held by an ACTIVE sample slot of this inspection, or belongs to a different property"
  - id: ERR_UNIT_ACCESS_NOT_GRANTED
    http: 409
    condition: "a UNIT-area deficiency is recorded against a unit whose sample slot has access_status other than GRANTED"
  - id: ERR_ACCESS_NOT_RECORDED
    http: 409
    condition: "scoring requested while an ACTIVE sample slot still has access_status NOT_NOTIFIED or NOTIFIED"
  # -- configuration and uniqueness constraints ------------------------------
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "unit_weight_pct + inside_weight_pct + outside_weight_pct does not equal 100.00"
  - id: ERR_LT_DEADLINE_MUST_BE_24H
    http: 422
    condition: "a LIFE_THREATENING defect definition declares correction_deadline_hours other than 24"
  - id: ERR_NO_LIFE_THREATENING_DEFINITION
    http: 422
    condition: "adopt requested on a standard that defines no LIFE_THREATENING defect"
  - id: ERR_DUPLICATE_STANDARD_CODE
    http: 409
    condition: "another InspectionStandard with the same code is DRAFT or ADOPTED"
  - id: ERR_DUPLICATE_DEFECT_CODE
    http: 409
    condition: "another DefectDefinition under the same standard already uses this code"
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "another Unit on the same property already uses this unit_number"
  # -- workflow limits and fiscal constraints --------------------------------
  - id: ERR_APPEAL_RESUBMIT_LIMIT
    http: 409
    condition: "resubmit requested when resubmission_count already reached APPEAL_RESUBMIT_LIMIT"
  - id: ERR_SWEEP_CLOSURE_RATE_TOO_LOW
    http: 409
    condition: "close requested on an IN_PROGRESS sweep whose closure_verified_rate is below SWEEP_CLOSURE_RATE_FLOOR"
  - id: ERR_CAP_COST_EXCEEDS_RESERVE
    http: 422
    condition: "total_estimated_cost_cents exceeds the property's capital_reserve_cents"
  - id: ERR_CAP_TARGET_AFTER_DEADLINE
    http: 422
    condition: "target_completion_at is strictly after the inspection's cap_due_at"
  - id: ERR_ADJUSTMENT_REQUIRED
    http: 422
    condition: "a SCORE_CORRECTION appeal is granted without granted_point_adjustment"
  - id: ERR_ADJUSTMENT_EXCEEDS_POINTS
    http: 422
    condition: "granted_point_adjustment is not strictly positive, or exceeds the contested deficiency's points_deducted"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PropertyOwner
    description: "Assisted-housing owner responsible for self-assessment, tenant notification, corrective action plans, appeals and capital needs planning on their own property"
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST /self-assessment-sweeps"
      - "POST /sample-selections/{id}/notice"
      - "POST /deficiencies/{id}/correction"
      - "POST /appeals"
      - "POST /appeals/{id}/resubmit"
      - "POST /corrective-action-plans"
      - "POST /corrective-action-plans/{id}/resubmit"
      - "POST /capital-needs/recompute"
    shared_operations:
      - "POST /self-assessment-sweeps/{id}/start (with PlatformAdmin)"
      - "POST /self-assessment-sweeps/{id}/close (with PlatformAdmin)"
      - "POST /self-assessment-sweeps/{id}/findings (with MaintenanceTechnician)"
      - "POST /work-orders/{id}/verify-closure (with QualityAssuranceReviewer)"
      - "POST /work-orders/{id}/void (with PlatformAdmin)"
      - "PATCH /properties/{id} and PATCH /units/{id} (with PlatformAdmin)"
      - "every single-resource and filtered-list GET except GET /properties"
  - name: HousingAgencyInspector
    description: "Agency inspector who schedules inspections, draws the unit sample, coordinates access, records deficiencies, scores and finalizes"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/draw-sample"
      - "POST /inspections/{id}/start"
      - "POST /inspections/{id}/deficiencies"
      - "POST /inspections/{id}/score"
      - "POST /inspections/{id}/finalize"
      - "POST /inspections/{id}/cancel"
      - "POST /sample-selections/{id}/access"
      - "POST /deficiencies/{id}/verification"
      - "POST /corrective-action-plans/{id}/schedule-follow-up"
    shared_operations:
      - "GET /properties (with QualityAssuranceReviewer, AppealsOfficer, PlatformAdmin)"
      - "every single-resource and filtered-list GET"
  - name: MaintenanceTechnician
    description: "Maintenance staff who record self-assessment findings and complete the resulting work orders; never verifies their own closure"
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/complete"
    shared_operations:
      - "POST /self-assessment-sweeps/{id}/findings (with PropertyOwner)"
      - "every single-resource and filtered-list GET except GET /properties"
  - name: QualityAssuranceReviewer
    description: "Independent reviewer who verifies work-order closure and adjudicates corrective action plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /corrective-action-plans/{id}/review"
    shared_operations:
      - "POST /work-orders/{id}/verify-closure (with PropertyOwner)"
      - "GET /properties (with HousingAgencyInspector, AppealsOfficer, PlatformAdmin)"
      - "every single-resource and filtered-list GET"
  - name: AppealsOfficer
    description: "Officer who adjudicates technical-error and score-correction appeals; holds no operational authority over inspections or repairs"
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/review"
    shared_operations:
      - "GET /properties (with HousingAgencyInspector, QualityAssuranceReviewer, PlatformAdmin)"
      - "every single-resource and filtered-list GET"
  - name: PlatformAdmin
    description: "Operator of the readiness platform who curates inspection standards, defect definitions, properties and units, and drives the logical clock and history injection"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection-standards"
      - "POST /inspection-standards/{id}/adopt"
      - "POST /defect-definitions"
      - "POST /properties"
      - "POST /units"
      - "POST /_clock/set_current_utc"
      - "POST /_inject/completed-inspection-history"
    shared_operations:
      - "POST /self-assessment-sweeps (with PropertyOwner)"
      - "POST /self-assessment-sweeps/{id}/start and /close (with PropertyOwner)"
      - "POST /work-orders/{id}/void (with PropertyOwner)"
      - "PATCH /properties/{id} and PATCH /units/{id} (with PropertyOwner)"
      - "every single-resource and filtered-list GET"
