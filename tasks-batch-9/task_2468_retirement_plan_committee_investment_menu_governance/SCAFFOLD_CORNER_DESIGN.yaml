      - name: hop_four_blocks_only_live_proposals_on_impaired_slots_and_walks_them_in_slot_index_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.QuarterlyReview.PENDING_MINUTES_to_FINALIZED
          - state_machines.FundReplacementProposal.DRAFT_to_BLOCKED
          - calculations.menu_posture
        distinguishing_aspect: "The last hop of the finalize cascade is a filtered, ordered fan-out, and this instance pins down all three filters at once on a single call: the status filter (a WITHDRAWN predecessor on an impaired slot is skipped because BLOCKED is only reachable from DRAFT, UNDER_REVIEW and REVISION_REQUESTED), the slot filter (a proposal on a slot whose fund stayed CLEAR survives as DRAFT because the posture reached RESTRICTED and not FROZEN), and the ordering (slot_index ASC, so the small-cap proposal is blocked before the international one). Plan.draft_proposal_count must be unchanged by the whole hop, because BLOCKED is inside its counted set."
        test_recipe:
          setup:
            - "chain_breach up to the approved minutes: SMLVX is scored to exactly 40.00 (WATCH) and INTDX to exactly 25.00 (REMEDIATION), the other three funds stay CLEAR, and the review is PENDING_MINUTES with the minutes approved — so finalize is legal and hop 3 will land on 2/5 = 0.4000 -> RESTRICTED."
            - "Three more live proposals are drafted before the finalize: a superseding one on the small-cap slot (slot_index 3, which pushes chain_breach's ${prop_small_id} to WITHDRAWN), one on the international slot (slot_index 4) and one on the core-bond slot (slot_index 2) whose seated fund stays CLEAR."
          setup_api_calls:
            - *chain_breach
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "INTGX", fund_name: "Summit International Developed R6", asset_class_code: "INTL_DEVELOPED", share_class_code: "R6", gross_expense_ratio_bps: 30, net_expense_ratio_bps: 30, revenue_share_bps: 0, peer_median_expense_bps: 35, track_record_quarters: 40, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9400, plan_assets_cents: 0 }
