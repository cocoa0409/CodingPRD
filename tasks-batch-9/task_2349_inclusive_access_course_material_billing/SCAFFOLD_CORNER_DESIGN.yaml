        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_reconciliation_enrollment_snapshot_versus_access_days_weighted
          rationale: "Both reconciliation variants are computed over identical facts there and the delta on switching method is asserted as a literal."

