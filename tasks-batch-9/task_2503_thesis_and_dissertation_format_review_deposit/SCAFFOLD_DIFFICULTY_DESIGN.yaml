  - rule_id: non_linear_state_machine
    instances:
      - name: format_review_cycle_loops_and_increments_cycle_number
        grounds:
          - state_machines.FormatReview.REVISIONS_REQUIRED_to_SUPERSEDED
          - state_machines.Thesis.FORMAT_REVISIONS_REQUIRED_to_UNDER_FORMAT_REVIEW
          - calculations.format_revision_window
          - entities.FormatReview.fields.cycle_number
          - entities.Thesis.fields.format_cycle_count
        distinguishing_aspect: |
          Thesis oscillates UNDER_FORMAT_REVIEW -> FORMAT_REVISIONS_REQUIRED -> UNDER_FORMAT_REVIEW
          three times through the same pair of endpoints, and the loop is not memoryless: the
          revision window narrows 10 -> 7 -> 5 business days as cycle_number climbs, so the third
          cycle's revision_due_at is 2026-10-23T09:00:00Z (5 business days) rather than the
          2026-10-30T09:00:00Z a first-cycle window would produce from the same decision instant.
