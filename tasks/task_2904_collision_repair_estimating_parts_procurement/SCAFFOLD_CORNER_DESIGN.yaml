      - name: the_delay_sweep_opens_one_event_per_overdue_line_and_never_twice
        claim_type: side_effects
        grounds:
          - endpoints.POST_/repair-orders/{id}/parts-delay-sweep
          - entities.PartsDelayEvent.fields.reason
          - entities.RepairOrder.fields.open_parts_delay_count
        distinguishing_aspect: >-
          The sweep is a bulk system operation with a computed response body rather than an entity: it
          reports opened_count for the lines whose promised_eta has passed and leaves the line that is
          still within its promise alone. Running it again after the clock moves opens nothing further,
          because a line that already has an open ETA_BREACH event is not swept twice.
