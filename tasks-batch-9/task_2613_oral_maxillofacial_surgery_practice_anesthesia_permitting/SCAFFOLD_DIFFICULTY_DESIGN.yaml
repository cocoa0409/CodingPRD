              payload: { expected_block_version: "${blk_v}" }
              as: SchedulingCoordinator
          assert:
            - "setup baseline: SurgicalCase.${case_id}.clearance_status == CLEARED, scheduling_status == BLOCK_HELD, Practice.${prac_id}.sedation_privilege_state == SUSPENDED"
            - "trigger[0] fails with HTTP 409 ERR_SEDATION_PRIVILEGE_UNAVAILABLE - the case itself is faultless"
            - "after trigger[3]: FacilityInspection.${insp3_id}.inspection_score == 91 and status == PASSED"
            - "after trigger[3]: AnesthesiaPermit.${perm_id}.status == ACTIVE, last_enforcement_reason == null, expires_at == 2028-09-12T10:00:00Z (reinstatement never extends the term)"
            - "after trigger[3]: Practice.${prac_id}.sedation_privilege_state == PERMITTED"
            - "trigger[4] succeeds: SurgicalCase.${case_id}.scheduling_status == CONFIRMED with clearance_status still CLEARED"
            - "BlockTime.${blk_id}.committed_minutes == 60 and utilization_pct == 25.00 throughout (the refused confirmation wrote nothing)"

      - name: reservation_creation_depends_on_lot_status
        entity_pair: [ImplantReservation, ImplantLot]
        grounds:
          - validations[priority=42]
          - validations[priority=80]
          - errors.ERR_LOT_UNAVAILABLE
          - state_machines.ImplantLot.AVAILABLE_to_QUARANTINED
        distinguishing_aspect: |
          A different entity pair with the dependency running the other way: the child's creation is
          gated on the parent lot's lifecycle state, not on any state of its own. A recalled lot is
          QUARANTINED with available_quantity forced to 0, so two rules are violated at once
          (priority 42 lot status and priority 80 stock); the state rule at 42 must be the one that
          answers. The identical request against a sibling lot that is still AVAILABLE succeeds with
          the same quantity, which isolates lot status as the only differing input.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "practice with consignment_credit_limit_cents 500000, one surgeon, one patient, one DRAFT LOCAL_ONLY IMPLANT case planned 2026-09-14T13:00Z"
            - "lot R: unit_cost_cents 20000, quantity_on_hand 5, then QUARANTINED on a manufacturer recall"
            - "lot S: identical dimensions and cost, left AVAILABLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2, consignment_credit_limit_cents: 500000 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Recall", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, dental_plan_active: true }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 150000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4310", diameter_mm: 4.3, length_mm: 10.0, unit_cost_cents: 20000, quantity_on_hand: 5, expiry_date: "2027-06-30T00:00:00Z", is_consignment: false }
              as: InventoryManager
              captures: { lotR_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4310", diameter_mm: 4.3, length_mm: 10.0, unit_cost_cents: 20000, quantity_on_hand: 5, expiry_date: "2027-06-30T00:00:00Z", is_consignment: false }
              as: InventoryManager
              captures: { lotS_id: $.data.id, lotS_v: $.data.version }
            - call: "POST /implant-lots/${lotR_id}/quarantine"
              payload: { quarantine_reason: "Manufacturer sterility recall SR-2026-118." }
              as: InventoryManager
              captures: { lotR_v: $.data.version }
          trigger:
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lotR_id}", quantity: 2, expected_lot_version: "${lotR_v}" }
              as: InventoryManager
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lotS_id}", quantity: 2, expected_lot_version: "${lotS_v}" }
              as: InventoryManager
              captures: { res_id: $.data.id }
          assert:
            - "setup baseline: ImplantLot.${lotR_id}.status == QUARANTINED with available_quantity == 0 and quantity_on_hand == 5"
            - "trigger[0] fails with HTTP 409 ERR_LOT_UNAVAILABLE - NOT ERR_IMPLANT_STOCK_INSUFFICIENT, even though available_quantity is 0 (priority 42 precedes priority 80)"
            - "trigger[0] leaves ImplantLot.${lotR_id}.quantity_reserved == 0 and creates no reservation row"
            - "trigger[1] succeeds with the same quantity: ImplantReservation.${res_id}.status == HELD and line_subtotal_cents == 40000"
            - "after trigger[1]: ImplantReservation.${res_id}.restocking_fee_cents == 6000 (the 40000 subtotal sits in the 15% tier), consignment_credit_cents == 0 (not a consignment lot) and consignment_liability_cents == 40000"
            - "after trigger[1]: ImplantLot.${lotS_id}.quantity_reserved == 2 and available_quantity == 3; Practice.${prac_id}.consignment_committed_cents == 40000"

      - name: determination_submission_depends_on_evaluation_status
        entity_pair: [BenefitDetermination, PreAnesthesiaEvaluation]
        grounds:
          - validations[priority=43]
          - state_machines.BenefitDetermination.DRAFT_to_SUBMITTED
          - calculations.benefit_route
          - calculations.benefit_allocation
        distinguishing_aspect: |
          A third pair, and the dependency crosses two entities that share no foreign key: the
          determination hangs off the case, and the gate reads the case's PreAnesthesiaEvaluation.
          A merely SIGNED evaluation is not enough - the day-of verification must have promoted it to
          VERIFIED. The dental-primary SPLIT waterfall is then observable in the same call, which
          shows the gate blocks the whole computation rather than just the status write.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z, then 2026-09-14T12:00:00Z"
            - "patient with BOTH plans active and dental_annual_remaining_cents 150000"
            - "LOCAL_ONLY THIRD_MOLAR case (a DENTAL_PRIMARY_CATEGORY, so the SPLIT route puts dental first) with total_charge_cents 100000"
            - "one evaluation, signed but deliberately NOT verified"
            - "one DRAFT determination with a single 100000-cent dental service line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
