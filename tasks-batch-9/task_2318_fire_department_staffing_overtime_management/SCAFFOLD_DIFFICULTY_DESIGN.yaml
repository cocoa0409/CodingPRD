  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: leave_approval_cascade_relieves_seat_reprices_period_reopens_shift
        grounds:
          - state_machines.LeaveRequest.QUEUED_to_APPROVED
          - state_machines.ShiftAssignment.SCHEDULED_to_RELIEVED
          - state_machines.DutyShift.STAFFED_to_HIRING
          - calculations.leave_adjudication_order
          - calculations.work_period_hour_ledger
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication"]
        distinguishing_aspect: |
          A depth-3 cascade triggered by leave adjudication: approval relieves the
          seat (hop 1); the relief — not the approval — re-hours and re-prices the
          work period and mints a LEAVE-driver vacancy (hop 2); that vacancy — not
          the relief — drives the shift from STAFFED back to HIRING (hop 3).
        test_recipe:
          setup:
            - "Station 47 with staffing floor 1 and one company ENGINE-47 (minimum_crew_size 2, no required certifications), so required_staffing is 2 and leave_floor_headcount is max(1, 0) == 1."
            - "Members ff47a (platoon C, Kelly 1, seniority 1, rate 4237), ff47b (platoon C, Kelly 2, seniority 2, rate 4000) and ff47c (platoon C, Kelly 3, seniority 9) as the company officer."
            - "The 2026-08-11 shift is published and fully staffed by REGULAR 24-hour seats for ff47a and ff47b, so it is STAFFED with assigned_headcount 2 and open_vacancy_count 0."
            - "ff47a's work period holds scheduled_hours 24 and leave_hours 0."
            - "ff47a has one QUEUED VACATION leave request for 24 hours against that shift."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 47", battalion_code: "B6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
