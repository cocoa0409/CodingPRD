        claim_type: violation_error
        grounds:
          - validations[priority=22]
          - errors[ERR_TRACT_NOT_LIC_ELIGIBLE]
          - calculations.tract_distress_profile
        distinguishing_aspect: "Tract eligibility gates QALICB registration, not deployment: a tract with poverty 12.00 and MFI 95.00 has eligible_for_qlici false, so POST /nmtc/qalicbs returns 422 ERR_TRACT_NOT_LIC_ELIGIBLE before any award, fund or agreement exists."
        test_recipe:
          setup:
            - "One ineligible tract (poverty 12.00, MFI ratio 95.00, unemployment 0.80, no contiguous neighbour) and one SEVERE eligible tract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
