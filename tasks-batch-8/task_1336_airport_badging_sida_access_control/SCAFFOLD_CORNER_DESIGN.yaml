      - name: auditor_cannot_sustain_violation
        claim_type: role_exclusive_denied
        grounds: [roles.Auditor, roles.SecurityManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Violation sustain is exclusive to SecurityManager: an Auditor is rejected with ERR_FORBIDDEN_ROLE (read-only outside audit endpoints)."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B2101); violation v1 RECORDED"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2101" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /badging/violations/${v1}/sustain", payload: {}, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"

      - name: reinstate_by_suspending_manager_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Badge.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Segregation of duties: the SecurityManager who suspended a badge (X-User-ID mgr-1) cannot reinstate it — ERR_SEGREGATION_OF_DUTIES (403); a different manager (mgr-2) can."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds STERILE badge b1 (B2201), manually suspended by mgr-1 (suspended_until null)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B2201" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "investigation" }, as: SecurityManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { st: $.data.status } }
          assert:
            - "same manager: ${err} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "different manager: ${st} == ACTIVE"

      - name: dismiss_by_sustaining_manager_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Violation.SUSTAINED_to_DISMISSED]
        distinguishing_aspect: "Segregation of duties on adjudication: the manager who sustained a violation cannot dismiss it — ERR_SEGREGATION_OF_DUTIES (403); a different manager can."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B2301); violation v1 (FAILURE_TO_DISPLAY, 3 pts) SUSTAINED by mgr-1"]
          setup_api_calls:
