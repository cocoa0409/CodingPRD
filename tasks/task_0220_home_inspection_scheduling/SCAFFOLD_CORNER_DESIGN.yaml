# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Home Inspection Scheduling & Reporting — EXPERT tier
# Breadth probe across the claim-extraction-guide sections.
# Shared fixture conventions identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_create_inspection_order_returns_201_requested
        claim_type: Creation
        grounds:
          - entities.InspectionOrder
          - endpoints
        distinguishing_aspect: "POST /inspection-orders with all required FKs returns 201, status=REQUESTED, order_kind=PRIMARY, version=1, amount_paid_cents=0."
        test_recipe:
          setup:
            - "PUBLISHED fee schedule, client, agent, property exist."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "InspectionOrder.${ord_id}.status == REQUESTED"
            - "InspectionOrder.${ord_id}.order_kind == PRIMARY"
            - "InspectionOrder.${ord_id}.version == 1"
            - "InspectionOrder.${ord_id}.amount_paid_cents == 0"

      - name: corner_get_inspection_order_not_found
        claim_type: Not Found
        grounds:
          - entities.InspectionOrder
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /inspection-orders/{nonexistent UUID} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /inspection-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: corner_create_order_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.InspectionOrder.fields.inspection_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inspection-orders omitting inspection_type returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "PUBLISHED fee schedule, client, agent, property exist."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: corner_create_order_invalid_enum_inspection_type
        claim_type: Type Constraints
        grounds:
          - entities.InspectionOrder.fields.inspection_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inspection-orders with inspection_type='HOME' (not a member) returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "PUBLISHED fee schedule, client, agent, property exist."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "HOME" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: corner_create_order_unknown_fee_schedule_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.InspectionOrder.fields.fee_schedule_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /inspection-orders referencing a non-existent fee_schedule_id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Client, agent, property exist; no fee schedule with the referenced id."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "00000000-0000-4000-8000-000000000001", inspection_type: "BUYER" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: corner_create_order_draft_fee_schedule_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.FeeSchedule.fields.status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inspection-orders pinning a DRAFT (not PUBLISHED) fee schedule returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "A DRAFT (never-published) fee schedule; client, agent, property exist."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: corner_list_inspection_orders_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.InspectionOrder
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /inspection-orders returns a paginated array envelope with total_count and has_more; limit honored."
        test_recipe:
          setup:
            - "Two orders created."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop1_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "2 B St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop2_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop1_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop2_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
          trigger:
            - call: "GET /inspection-orders"
              payload: { limit: 1, offset: 0 }
              as: Scheduler
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"
            - "returned data length == 1"

      - name: corner_computed_fields_ignored_on_order_create
        claim_type: System Fields
        grounds:
          - entities.InspectionOrder.fields.quoted_fee_cents
          - entities.InspectionOrder.fields.status
        distinguishing_aspect: "On create, server-controlled fields are not accepted from input: status stays REQUESTED and quoted_fee_cents is null (no scheduling has occurred)."
        test_recipe:
          setup:
            - "PUBLISHED fee schedule, client, agent, property exist."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { st: $.data.status, qf: $.data.quoted_fee_cents }
          assert:
            - "InspectionOrder.status == REQUESTED"
            - "InspectionOrder.quoted_fee_cents == null"

      - name: corner_client_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Client
        distinguishing_aspect: "Client has common_fields:false — its create response carries id and created_at but no version field; there is no Client update or transition endpoint."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Client response has no 'version' field"
            - "Client.${cli_id}.role_in_deal == BUYER"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_start_from_requested_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.InspectionOrder.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling /start on a REQUESTED (never-scheduled) order returns ERR_INVALID_STATE 409 (start requires SCHEDULED)."
        test_recipe:
          setup:
            - "A REQUESTED order; an inspector exists to act."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: corner_cancel_from_delivered_terminal_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.InspectionOrder.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a DELIVERED (terminal) order returns ERR_INVALID_STATE 409; no further transitions out of a terminal state."
        test_recipe:
          setup:
            - "Order driven to DELIVERED (scheduled, paid 43000, started, report created, submitted, approved, delivered)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-08-01T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: { amount_cents: 43000 }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/approve"
              payload: {}
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /inspection-orders/${ord_id}/cancel"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: corner_approve_report_from_draft_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Report.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a DRAFT (not yet SUBMITTED) report returns ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "Order scheduled+started; report DRAFT created, not submitted."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-08-02T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /reports/${rep_id}/approve"
