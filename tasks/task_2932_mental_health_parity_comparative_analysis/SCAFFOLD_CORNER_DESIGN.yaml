              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
