      - name: error_catering_cutoff_passed_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATERING_CUTOFF_PASSED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / catering_cutoff_exact_instant_passes_then_fails"
          rationale: "Asserted as the failure branch of the cutoff boundary instance."

      - name: error_credential_capacity_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDENTIAL_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / credential_capacity_nth_succeeds_nplus1_fails"
          rationale: "Asserted as the n+1 branch of the capacity boundary instance."

      - name: error_event_not_scheduled_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_NOT_SCHEDULED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / credential_issue_blocked_when_event_cancelled"
          rationale: "Asserted as the failure path of the credential-x-event dependency instance."

      - name: error_agreement_not_active_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / catering_confirm_blocked_when_agreement_suspended"
          rationale: "Asserted as the failure path of the catering-x-agreement dependency instance."

      - name: error_suite_not_available_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUITE_NOT_AVAILABLE]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / rental_blocked_by_license_coverage_only_for_covered_event_types"
          rationale: "Asserted as the covered-event branch of the license-coverage overlap instance; the OUT_OF_SERVICE variant is separately covered by rental_hold_blocked_when_suite_out_of_service."

      - name: error_event_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / event_overlap_half_open_adjacency_allowed_touching_rejected"
          rationale: "Asserted as the intersecting-interval branch of the half-open overlap instance."

