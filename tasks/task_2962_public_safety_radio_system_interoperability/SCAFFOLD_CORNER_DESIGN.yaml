              captures: { unit_gos1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_gos_id}", serial_number: "GOS0002", radio_id: 29002, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_gos_id}"
              captures: { unit_gos2: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_gos_id}", serial_number: "GOS0003", radio_id: 29003, model: "PORTABLE" }
