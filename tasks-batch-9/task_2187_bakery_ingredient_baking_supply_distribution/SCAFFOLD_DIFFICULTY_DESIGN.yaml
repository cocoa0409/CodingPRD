            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-ALM-3001", product_id: "${almond_id}", zone_id: "${zone_nut_id}", manufactured_on: "2026-07-20T00:00:00Z", quantity_received_lb: 10000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_id: $.data.id }
            - call: "POST /bakery-distribution/lots/${lot_id}/quarantine"
