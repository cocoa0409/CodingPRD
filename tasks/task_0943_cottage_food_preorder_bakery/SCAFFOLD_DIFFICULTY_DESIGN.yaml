            - "${u_canc} == 240 and ${c_canc} == 0 and ${h_canc} == 0 and ${r_canc} == 0, and 240 + 0 + 0 + 0 == 240"
            - "Order.${o1}.order_status == CANCELLED and Baker.${baker_id}.annual_gross_sales_cents == 0 after the compensating cancel"

      - name: yield_conservation_holds_on_both_surplus_and_shortfall_forks
        grounds:
          - conservation_invariants[yield_conservation]
          - calculations.shortfall_allocation
          - calculations.shortfall_credit
          - state_machines.Batch.BAKED_to_YIELD_CONFIRMED
          - state_machines.Batch.BAKED_to_UNDER_YIELD
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL UNITS PRODUCED BY A BATCH, a different
          quantity from orderable window units: sum(allocated_units) + surplus_units
          == actual_yield_units holds on the surplus fork (26 + 14 == 40) and on the
          shortfall fork (3 + 0 == 3), and the shortfall's compensating credit of 900
          cents leaves the unit equation untouched.
        test_recipe:
          setup:
            - "An ACTIVE baker with a PUBLISHED recipe and two LISTED menu items: a STANDARD cookie (24 units per slot) and a LONG_BAKE loaf (12 units per slot, 3.0 oven hours per slot)."
            - "An OPEN window with default capacity; clock at 2026-05-04T09:00:00Z."
            - "One CONFIRMED, unpaid PICKUP_COUNTER order holding 26 cookies (planned_yield 48) and 4 loaves (planned_yield 12)."
            - "The window is LOCKED, PLANNED and IN_PRODUCTION with both batches BAKED."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
