      - name: server_pool_capacity_is_released_by_a_forfeited_match
        claim_type: input_set_filtering
        grounds:
          - calculations.server_pool_overlap.input_set
          - validations[priority=47]
          - entities.Match.scheduled_end_at
          - entities.Match.server_pool_id
        distinguishing_aspect: |
          Pool occupancy counts only peers in SCHEDULED, SERVER_READY or PLAYED. A second
          match starting 30 minutes into a 60-minute match on a capacity-1 pool is
          refused with 409 ERR_SERVER_POOL_CAPACITY_EXCEEDED; forfeiting the first match
          moves it to a terminal play_status and the identical request then succeeds. An
          implementation that counts every row on the pool regardless of play_status
          rejects the retry too.
        test_recipe:
          setup:
            - "District, school, two coaches, title with server_pool_id POOL-A, server_pool_capacity 1 and match_duration_minutes 60, season, two DRAFT teams"
            - "One match scheduled 2026-10-01T18:00:00.000Z, so it occupies [18:00, 19:00)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Alpha", email: "alpha@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Bravo", email: "bravo@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive", server_pool_id: "POOL-A", server_pool_capacity: 1, match_duration_minutes: 60 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_b_id}", name: "North Bravo" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-10-01T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_b_id}", away_team_id: "${tm_a_id}", scheduled_start_at: "2026-10-01T18:30:00.000Z" }
              as: LeagueAdmin
              captures: { err_pool: $.data.error_id }
            - call: "POST /matches/${m1_id}/forfeit"
              payload: { forfeiting_team_id: "${tm_b_id}", reason_note: "roster collapse" }
              as: LeagueAdmin
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_b_id}", away_team_id: "${tm_a_id}", scheduled_start_at: "2026-10-01T18:30:00.000Z" }
              as: LeagueAdmin
              captures: { m2_id: $.data.id }
          assert:
            - "the first trigger call returns 409 with data.error_id == ERR_SERVER_POOL_CAPACITY_EXCEEDED"
            - "Match.${m1_id}.server_pool_id == POOL-A and scheduled_end_at == 2026-10-01T19:00:00.000Z"
            - "the second trigger call returns 200 with data.play_status == FORFEITED"
            - "the third trigger call returns 201 with data.scheduled_start_at == 2026-10-01T18:30:00.000Z, data.scheduled_end_at == 2026-10-01T19:30:00.000Z, data.play_status == SCHEDULED and data.server_pool_id == POOL-A"
            - "exactly two Match rows exist for season ${se_id}"

      - name: academic_standing_variant_divergence_across_districts
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: academic_standing_term_snapshot_vs_rolling_cumulative_divergence
          rationale: |
            The §1.8 instance posts the identical two terms to two students in two
            districts and shows TERM_SNAPSHOT yielding PROBATION (rejected on a STARTER
            slot with ERR_PROBATION_STARTER_RESTRICTED) while ROLLING_CUMULATIVE yields
            GOOD, including the delta between the two effective_gpa values.

      - name: seed_points_variant_divergence_between_the_two_bases
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: seed_points_match_point_basis_vs_win_percentage_basis_rank_inversion
          rationale: |
            The §1.8 instance builds a forfeit-fed team and a single-real-win team and
            shows the seed order inverting between MATCH_POINT_BASIS and
            WIN_PERCENTAGE_BASIS on the same data.

      - name: seeding_run_selects_the_basis_from_the_override_or_the_season_default
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: seed_points_match_point_basis_vs_win_percentage_basis_rank_inversion
          rationale: |
            The same §1.8 instance runs seeding twice — once with no override, once with
            basis_override WIN_PERCENTAGE_BASIS — and asserts
            Season.seeding_basis_applied for both runs, which is precisely the
            variant-selection claim.

      - name: scholarship_state_reconciles_when_results_are_restated
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: dispute_upheld_cascades_four_links_result_ledger_seeding_scholarship
          rationale: |
            Cascade link 4 of that §1.8 instance flips every nominated student's
            scholarship_award_state from CURRENT to RECALC_REQUIRED when the upheld
            dispute restates results, which is the ledger reconciliation this row asks
            for.

      - name: entry_fee_waterfall_rounds_each_line_item_before_summing
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: entry_fee_waterfall_per_line_subsidy_rounding_with_two_starters
          rationale: |
            The §1.8 instance pins the per-line rounding order with two starters
            (19180 / 4796 / 14384) and names the sum-then-round trap explicitly, so the
            waterfall boundary claim is already covered in depth.

      - name: scholarship_tier_boundary_is_read_from_the_provisional_total
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: scholarship_award_tier_pinned_to_provisional_total_not_final_total
          rationale: |
            The §1.8 instance sits a seed-1 GOOD student at provisional 330000, inside
            the SILVER band, and shows the final 369600 landing in the GOLD band without
            relabelling the tier — the cross-tier straddle this row asks for.

      - name: integrity_score_decay_ladder_at_the_suspension_floor
        claim_type: aggregation
        excluded_because:
          difficulty_instance: integrity_score_repeat_multiplier_ladder_lands_exactly_on_the_suspension_floor
          rationale: |
            The §1.8 instance drives the running penalty total onto exactly the
            INTEGRITY_SUSPENSION_FLOOR of 40 and shows the sanction ladder promoting the
            sanction to TEAM_SUSPENSION, covering the running-total and floor claims.

      - name: server_pool_half_open_interval_adjacency
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: server_pool_half_open_aggregate_capacity_with_legal_adjacency
          rationale: |
            The §1.8 instance tests the aggregate capacity at the probe instants, the
            legal adjacency where a peer ends exactly at the candidate's start, and the
            one-millisecond overlap that trips ERR_SERVER_POOL_CAPACITY_EXCEEDED.

      - name: broadcast_channel_closed_interval_adjacency
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: broadcast_channel_closed_interval_with_buffer_makes_adjacency_illegal
          rationale: |
            The §1.8 instance expands the candidate window by the district buffer on both
            ends and shows a 15-minute gap conflicting while a 16-minute gap clears, which
            covers the closed-interval and buffer claims for this resource.

  # ===========================================================================
  # SECTION 4 — VALIDATIONS
  # Guide rows: Violation -> Error, Satisfaction -> Pass, Priority Ordering,
  # plus the pattern rows implied by the declared categories (priority conflict,
  # cross-entity, temporal, aggregate, conditional, cascading validation).
  # ===========================================================================
  - section: validations
    instances:

      - name: probation_floor_above_min_gpa_is_rejected_and_equality_clears
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_GPA_THRESHOLDS]
          - entities.District.fields.probation_gpa_floor
        distinguishing_aspect: |
          Priority 6 is a cross-field semantic check on a single body, distinct from the
          priority 5 shape check: both values are individually inside 0.000..4.000, so a
          range-only validator accepts the pair. The rule is `probation_gpa_floor <=
          min_gpa`, so EQUAL thresholds must clear — an implementation using strict `<`
          rejects a legitimate district.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /districts"
              payload: { name: "Inverted District", state_code: "NV", min_gpa: 1.500, probation_gpa_floor: 2.000 }
              as: LeagueAdmin
              captures: { e_inverted: $.data.error_id }
            - call: "POST /districts"
              payload: { name: "Equal District", state_code: "NV", min_gpa: 2.000, probation_gpa_floor: 2.000 }
              as: LeagueAdmin
              captures: { d_eq: $.data.id }
          assert:
            - "the first trigger returns 422 with data.error_id == ERR_INVALID_GPA_THRESHOLDS (not 400 ERR_INVALID_REQUEST — both numbers are inside the declared range)"
            - "no District row is created by the first trigger"
            - "the second trigger returns 201 and District.${d_eq}.min_gpa == 2.0 and probation_gpa_floor == 2.0"

      - name: match_creation_rejects_a_self_match_and_a_cross_season_participant
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - validations[priority=39]
          - errors[ERR_SELF_MATCH_FORBIDDEN]
          - errors[ERR_TEAM_SEASON_MISMATCH]
          - endpoints[POST /matches]
        distinguishing_aspect: |
          Two different referential defects on the same endpoint: a team scheduled
          against itself (priority 7, 422) and a well-formed pair whose away team belongs
          to a DIFFERENT season (priority 39, 422). Both ids resolve, so priority 9
          existence passes and an implementation that only checks existence lets both
          through.
        test_recipe:
          setup:
            - "One district, one school, one certified coach, one title and TWO seasons on that title"
            - "Teams North Alpha and North Bravo sit in season 1; South Charlie sits in season 2; all three stay DRAFT (POST /matches has no team-status precondition)"
