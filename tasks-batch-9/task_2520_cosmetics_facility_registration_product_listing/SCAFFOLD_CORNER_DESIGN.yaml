              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${rec_a2}", units: 10 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err_unlinked: $.data.error_id }
          assert:
            - "${err_mismatch} == \"ERR_DISTRIBUTION_RECORD_LISTING_MISMATCH\" with HTTP 422 — REC-B1 belongs to the sibling listing"
            - "the rejected bulk call is atomic: GET /cosmetics/distribution-records?withdrawal_id=${wd_id} is empty and REC-A1 remains unlinked afterwards"
            - "${shipped_total} == 400 and ${wd_status} == \"RECORDS_PRODUCED\" — only REC-A1 is linked"
            - "${err_unlinked} == \"ERR_RECORD_NOT_IN_WITHDRAWAL\" with HTTP 422 — REC-A2 is on the right listing but was never produced"
            - "MarketWithdrawal ${wd_id}.reported_recovered_units == 0 and outstanding_units_total == 400"
            - "DistributionRecord ${rec_a2}.units_outstanding is still 250 and its withdrawal link is null"

