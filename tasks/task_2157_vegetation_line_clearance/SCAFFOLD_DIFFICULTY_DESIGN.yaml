            - call: "POST /vm/work-orders/${wo_p}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_p}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_p}", crew_id: "${crew1_id}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_p: $.data.id }
            - call: "POST /vm/work-orders/${wo_p}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_p}", work_date: "2026-08-03", units_trimmed: 236, labor_hours: 8, equipment_hours: 6, disposal_tons: 1 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/work-orders/${wo_p}/complete"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 240 }
              as: ContractorPlanner
              captures: { wo_q: $.data.id }
            - call: "POST /vm/work-orders/${wo_q}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_q}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_q}", crew_id: "${crew1_id}", start_at: "2026-08-04T08:00:00Z", end_at: "2026-08-04T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_q: $.data.id }
            - call: "POST /vm/work-orders/${wo_q}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_q}", work_date: "2026-08-04", units_trimmed: 240, labor_hours: 8, equipment_hours: 6, disposal_tons: 1 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/work-orders/${wo_q}/complete"
              payload: {}
              as: ContractorPlanner
            - call: "GET /vm/work-orders/${wo_p}"
              payload: {}
              as: BillingAnalyst
              captures: { wo_p_v: $.data.version }
            - call: "GET /vm/work-orders/${wo_q}"
