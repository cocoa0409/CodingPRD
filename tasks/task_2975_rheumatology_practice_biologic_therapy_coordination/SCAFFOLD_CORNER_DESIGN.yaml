              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567894", full_name: "Bo Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: false }
              as: RegistryAdmin
              captures: { rheum2_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
