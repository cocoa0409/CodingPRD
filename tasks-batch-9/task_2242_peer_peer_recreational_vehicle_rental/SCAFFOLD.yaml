# =============================================================================
# PRD Benchmark Seed Tables — task_2242
# Peer-to-Peer Recreational Vehicle Rental Marketplace
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2242. Peer-to-Peer Recreational Vehicle Rental Marketplace (recreational vehicle sharing platform): owner listing onboarding with vehicle documentation, insurance status and inspection photos, renter qualification with driving record checks, age minimums and towing experience verification, insurance and protection plan tiers with deductibles and coverage exclusions for the sharing period, delivery and setup options with campground drop-off coordination, mileage and generator hour metering with post-trip charge reconciliation, damage claim intake with pre- and post-trip photo comparison and adjudication, cancellation policies by tier with owner and renter penalties, seasonal pricing guidance and utilization analytics for owners

domain_name: rv-share-marketplace
api_prefix: /rv-marketplace

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked purely by FK fields carried in request bodies. No entity
  # id is ever nested inside another entity's URL path; every collection hangs
  # directly off /rv-marketplace.

  state_machine_shape: parallel
  # Booking carries two independent state dimensions (trip_status ×
  # settlement_status) that advance on different triggers. DamageClaim is cyclic
  # (UNDER_REVIEW ⇄ INFO_REQUESTED). Listing is branching-with-revert plus a
  # SUSPENDED ⇄ LISTED cycle.

  relationship_patterns:
    - one_to_many          # Owner→Listing, Listing→Booking, Booking→MeterReading/TripPhoto/LedgerEntry
    - cross_aggregate      # DeliveryAssignment couples the Booking aggregate to the Campground aggregate
    - polymorphic          # LedgerEntry.party selects which of Owner/Renter/PLATFORM the amount lands on

  role_model: peer_roles
  # Owner owns Listing/VehicleDocument, Renter owns Booking-side actions,
  # PlatformAdmin runs configuration + settlement, ClaimsAdjuster exclusively
  # adjudicates damage claims (PlatformAdmin may NOT adjudicate).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 60 endpoints / 51 error codes / 9 calculations with 6 variant
  # pairs / 5 state machines across 4 entities (parallel + cyclic + branching).

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Owner ----
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public name of the RV owner.
        constraints: "1..80 chars"
      - name: email
        type: string
        source: input
        description: Contact email, unique across Owner.
        constraints: "must contain '@'; unique"
      - name: payout_state_code
        type: string
        source: input
        description: Two-letter US state code used for the owner's payout account.
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: computed
        description: Owner standing; SUSPENDED blocks listing submission and reinstatement.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: owner_penalty_points
        type: integer
        source: computed
        description: Running penalty total accumulated from owner-initiated cancellations and admin adjustments; crossing OWNER_SUSPENSION_POINT_THRESHOLD suspends the owner and all LISTED listings.
        default: 0
        constraints: ">= 0"
      - name: payout_balance_cents
        type: integer
        source: computed
        description: Sum of LedgerEntry.amount_cents over every LedgerEntry with party == OWNER whose booking_id belongs to a Listing owned by this Owner.
        default: 0
      - name: listed_listing_count
        type: integer
        source: computed
        description: Count of Listing rows with owner_id == this Owner and listing_status == LISTED.
        default: 0

  # --------------------------------------------------------------- Renter ----
  - name: Renter
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public name of the renter.
        constraints: "1..80 chars"
      - name: email
        type: string
        source: input
        description: Contact email, unique across Renter.
        constraints: "must contain '@'; unique"
      - name: date_of_birth
        type: string
        source: input
        description: Renter date of birth in YYYY-MM-DD, used for age-minimum evaluation.
        constraints: "ISO date; must be strictly before the logical clock date"
      - name: license_state_code
        type: string
        source: input
        description: Two-letter US state code of the driving licence on file.
        constraints: "exactly 2 uppercase letters"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Platform wallet balance in cents; funds holds, absorbs refunds, pays post-trip balances.
        default: 0
        constraints: ">= 0"
      - name: renter_penalty_points
        type: integer
        source: computed
        description: Running penalty total from late renter cancellations and admin adjustments; at or above RENTER_BLOCK_POINT_THRESHOLD the renter may not create bookings.
        default: 0
        constraints: ">= 0"
      - name: driving_record_points
        type: integer
        source: computed
        description: "Dual-variant risk score, ROLLING_36M variant (see calculations.renter_driving_record_points): sum of violation_points over RenterQualification rows with check_type == DRIVING_RECORD and checked_at within RECORD_LOOKBACK_MONTHS of the logical clock."
        default: 0
      - name: driving_record_status
        type: enum
        source: computed
        description: Result of the latest DRIVING_RECORD RenterQualification by checked_at DESC (tie-break created_at DESC); NONE when no such row exists, EXPIRED when that row's expires_on is before the logical clock date.
        default: NONE
        constraints: "NONE | CLEAR | MINOR | MAJOR | EXPIRED"
      - name: towing_verified_tier
        type: enum
        source: computed
        description: Highest tier among TOWING_EXPERIENCE RenterQualification rows whose expires_on >= logical clock date; ADVANCED outranks BASIC.
        default: NONE
        constraints: "NONE | BASIC | ADVANCED"

  # -------------------------------------------------------------- Listing ----
  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the Owner who may mutate this Listing."
      - name: nickname
        type: string
        source: input
        description: Owner-facing label for the rig.
        constraints: "1..80 chars"
      - name: vehicle_class
        type: enum
        source: input
        description: Rig category, drives towing requirement and plan eligibility.
        constraints: "CLASS_A | CLASS_C | CAMPER_VAN | TRAVEL_TRAILER | FIFTH_WHEEL"
      - name: requires_towing
        type: boolean
        source: computed
        description: True exactly when vehicle_class IN {TRAVEL_TRAILER, FIFTH_WHEEL}; renter must hold a TOWING_EXPERIENCE check.
      - name: gvwr_lbs
        type: integer
        source: input
        description: Gross vehicle weight rating in pounds; above TOWING_ADVANCED_GVWR_THRESHOLD_LBS the renter needs the ADVANCED towing tier.
        constraints: "1000..30000"
      - name: length_ft
        type: integer
        source: input
        description: Rig length in feet, compared against Campground.max_rig_length_ft on delivery.
        constraints: "10..45"
      - name: base_nightly_rate_cents
        type: integer
        source: input
        description: Owner's list price per night before seasonal multipliers.
        constraints: ">= 1000"
      - name: included_miles_per_night
        type: integer
        source: input
        description: Mileage allowance granted per night of the sharing period.
        constraints: ">= 0"
      - name: mileage_overage_rate_cents_per_mile
        type: integer
        source: input
        description: Charge per mile beyond the allowance.
        constraints: ">= 0"
      - name: included_generator_hours_per_night
        type: number
        source: input
        description: Generator-hour allowance granted per night, one decimal place.
        constraints: ">= 0; multiple of 0.1"
      - name: generator_overage_rate_cents_per_hour
        type: integer
        source: input
        description: Charge per generator hour beyond the allowance.
        constraints: ">= 0"
      - name: min_renter_age
        type: integer
        source: input
        description: Minimum renter age in whole years evaluated at the booking's start_date.
        constraints: "21..30"
      - name: delivery_offered
        type: boolean
        source: input
        description: Whether the owner will deliver to a campground.
        default: false
      - name: delivery_base_fee_cents
        type: integer
        source: input
        description: Flat delivery charge when delivery_offered is true.
        default: 0
        constraints: ">= 0"
      - name: delivery_per_mile_cents
        type: integer
        source: input
        description: Per-mile delivery charge when delivery_offered is true.
        default: 0
        constraints: ">= 0"
      - name: listing_status
        type: enum
        source: computed
        description: Listing lifecycle state (see state_machines.Listing).
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | LISTED | SUSPENDED | ARCHIVED"
      - name: insurance_status
        type: enum
        source: computed
        description: VERIFIED when a VehicleDocument with doc_type == INSURANCE_POLICY, verification_status == VERIFIED, superseded == false and expires_on >= logical clock date exists; EXPIRED when such a row exists but expires_on < clock date; otherwise PENDING.
        default: PENDING
        constraints: "PENDING | VERIFIED | EXPIRED"
      - name: inspection_photo_zone_count
        type: integer
        source: computed
        description: Count of DISTINCT zone values over VehicleDocument rows with listing_id == this Listing, doc_type == INSPECTION_PHOTO, superseded == false.
        default: 0
      - name: completed_night_count
        type: integer
        source: computed
        description: Sum of Booking.nights over Booking rows on this Listing whose trip_status == CLOSED.
        default: 0
      - name: last_reconciled_at
        type: datetime
        source: computed
        description: Logical-clock value at the most recent settlement of a Booking on this Listing; null before the first settlement.
        default: null

  # ------------------------------------------------------- VehicleDocument ----
  - name: VehicleDocument
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> Listing.id; the Listing this document or inspection photo belongs to."
      - name: doc_type
        type: enum
        source: input
        description: Kind of documentation on file.
        constraints: "TITLE | REGISTRATION | INSURANCE_POLICY | INSPECTION_PHOTO"
      - name: zone
        type: enum
        source: input
        description: Rig zone depicted, required when doc_type == INSPECTION_PHOTO and forbidden otherwise.
        default: null
        constraints: "EXTERIOR_FRONT | EXTERIOR_REAR | INTERIOR | ROOF | UNDERCARRIAGE | null"
      - name: expires_on
        type: string
        source: input
        description: Expiry date YYYY-MM-DD; required for TITLE, REGISTRATION and INSURANCE_POLICY, forbidden for INSPECTION_PHOTO.
        default: null
      - name: image_ref
        type: string
        source: input
        description: Opaque storage reference for the scan or photo.
        constraints: "1..200 chars"
      - name: verification_status
        type: enum
        source: computed
        description: PENDING until POST /vehicle-documents/{documentId}/verify flips it to VERIFIED.
        default: PENDING
        constraints: "PENDING | VERIFIED | SUPERSEDED"
      - name: superseded
        type: boolean
        source: computed
        description: Set true when a newer VehicleDocument of the same doc_type (and same zone for INSPECTION_PHOTO) is created on the same Listing.
        default: false

  # --------------------------------------------------- RenterQualification ----
  - name: RenterQualification
    parent: null
    common_fields: false
    fields:
      - name: renter_id
        type: string
        source: input
        description: "FK -> Renter.id; the Renter this check belongs to."
      - name: check_type
        type: enum
        source: input
        description: Which qualification gate this row records.
        constraints: "DRIVING_RECORD | TOWING_EXPERIENCE"
      - name: result
        type: enum
        source: input
        description: Outcome; CLEAR/MINOR/MAJOR only for DRIVING_RECORD, VERIFIED_BASIC/VERIFIED_ADVANCED/UNVERIFIED only for TOWING_EXPERIENCE.
        constraints: "CLEAR | MINOR | MAJOR | VERIFIED_BASIC | VERIFIED_ADVANCED | UNVERIFIED"
      - name: violation_points
        type: integer
        source: input
        description: Moving-violation points carried by this DRIVING_RECORD check; must be 0 for TOWING_EXPERIENCE.
        default: 0
        constraints: "0..20"
      - name: checked_at
        type: datetime
        source: input
        description: When the third-party check was run; drives the ROLLING_36M lookback window and the latest-check selector.
      - name: expires_on
        type: string
        source: input
        description: Date YYYY-MM-DD after which this check no longer satisfies a booking gate.

  # ------------------------------------------------------- ProtectionPlan ----
  - name: ProtectionPlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: Protection tier label, unique across ProtectionPlan.
        constraints: "BASIC | STANDARD | PREMIUM; unique"
      - name: daily_premium_cents
        type: integer
        source: input
        description: Per-night premium floor input to calculations.protection_premium.
        constraints: ">= 0"
      - name: premium_pct_of_base_bp
        type: integer
        source: input
        description: Percentage-of-base premium in basis points input to calculations.protection_premium.
        constraints: "0..5000"
      - name: deductible_cents
        type: integer
        source: input
        description: Renter's out-of-pocket ceiling on an approved damage claim.
        constraints: ">= 0"
      - name: coverage_ceiling_cents
        type: integer
        source: input
        description: Maximum gross damage amount the plan will recognise for the sharing period.
        constraints: ">= 0"
      - name: excluded_causes
        type: array
        source: input
        description: Cause codes this tier does not cover; a claim whose cause_code is listed adjudicates to zero.
        constraints: "subset of {COLLISION, THEFT, WATER_INTRUSION, TIRE_BLOWOUT, AWNING_WIND, INTERIOR_STAIN, APPLIANCE_FAILURE}"
      - name: eligible_vehicle_classes
        type: array
        source: input
        description: Vehicle classes this plan may be attached to.
        constraints: "non-empty subset of {CLASS_A, CLASS_C, CAMPER_VAN, TRAVEL_TRAILER, FIFTH_WHEEL}"

  # --------------------------------------------------- CancellationPolicy ----
  - name: CancellationPolicy
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: Cancellation tier label, unique across CancellationPolicy.
        constraints: "FLEXIBLE | MODERATE | STRICT; unique"
      - name: full_refund_hours_before
        type: integer
        source: input
        description: Renter cancellations at or beyond this many hours before scheduled pickup refund 100 percent of the hold.
        constraints: ">= 0"
      - name: partial_refund_pct_bp
        type: integer
        source: input
        description: Refund share in basis points applied to renter cancellations inside the full-refund window.
        constraints: "0..10000"
      - name: renter_cancel_penalty_points
        type: integer
        source: input
        description: Penalty points added to Renter.renter_penalty_points on an inside-window renter cancellation.
        constraints: "0..10"
      - name: owner_cancel_penalty_points
        type: integer
        source: input
        description: Penalty points added to Owner.owner_penalty_points on any owner cancellation of a CONFIRMED booking.
        constraints: "0..12"
      - name: owner_cancel_fee_bp
        type: integer
        source: input
        description: Owner cancellation fee in basis points of Booking.base_subtotal_cents, debited from the owner's payout balance.
        constraints: "0..5000"

  # ---------------------------------------------------------- PricingSeason ----
  - name: PricingSeason
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: enum
        source: input
        description: Season label surfaced in pricing guidance.
        constraints: "PEAK | SHOULDER | OFF"
      - name: start_month_day
        type: string
        source: input
        description: Inclusive window start as MM-DD, compared year-independently.
        constraints: "matches ^\\d{2}-\\d{2}$"
      - name: end_month_day
        type: string
        source: input
        description: Inclusive window end as MM-DD; must be >= start_month_day lexicographically (no wrap-around rows).
        constraints: "matches ^\\d{2}-\\d{2}$"
      - name: multiplier_bp
        type: integer
        source: input
        description: Nightly rate multiplier in basis points for nights falling inside the window.
        constraints: "1000..30000"

  # ----------------------------------------------------------- Campground ----
  - name: Campground
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Campground name.
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code.
        constraints: "exactly 2 uppercase letters"
      - name: max_rig_length_ft
        type: integer
        source: input
        description: Longest rig the campground can receive; compared against Listing.length_ft.
        constraints: "10..60"
      - name: daily_dropoff_capacity
        type: integer
        source: input
        description: Maximum number of SCHEDULED DeliveryAssignment rows permitted per UTC calendar date.
        constraints: ">= 1"
      - name: dropoff_buffer_minutes
        type: integer
        source: input
        description: Symmetric buffer in minutes applied to BOTH ends of every SCHEDULED drop-off window when testing conflicts.
        constraints: "0..240"
      - name: status
        type: enum
        source: input
        description: ACCEPTING campgrounds may receive drop-offs; CLOSED campgrounds may not.
        default: ACCEPTING
        constraints: "ACCEPTING | CLOSED"
      - name: scheduled_assignment_count
        type: integer
        source: computed
        description: Count of DeliveryAssignment rows with campground_id == this Campground and status == SCHEDULED. Conserved quantity of calculations.dropoff_slot_conservation.
        default: 0

  # -------------------------------------------------------------- Booking ----
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> Listing.id; the rig being shared."
      - name: renter_id
        type: string
        source: input
        description: "FK -> Renter.id; the renting party."
      - name: protection_plan_id
        type: string
        source: input
        description: "FK -> ProtectionPlan.id; version-pinned protection tier for the sharing period."
      - name: cancellation_policy_id
        type: string
        source: input
        description: "FK -> CancellationPolicy.id; cancellation tier for the sharing period."
      - name: start_date
        type: string
        source: input
        description: First night of the sharing period, YYYY-MM-DD. Scheduled pickup is start_date at SCHEDULED_PICKUP_TIME_UTC.
      - name: end_date
        type: string
        source: input
        description: Checkout date, YYYY-MM-DD, exclusive of the night count. Scheduled return is end_date at SCHEDULED_RETURN_TIME_UTC.
      - name: delivery_option
        type: enum
        source: input
        description: PICKUP means the renter collects the rig; CAMPGROUND_DROPOFF requires a DeliveryAssignment.
        constraints: "PICKUP | CAMPGROUND_DROPOFF"
      - name: declared_miles
        type: integer
        source: input
        description: Renter's declared mileage estimate, input to the provisional quote.
        constraints: ">= 0"
      - name: declared_generator_hours
        type: number
        source: input
        description: Renter's declared generator-hour estimate, one decimal place, input to the provisional quote.
        constraints: ">= 0; multiple of 0.1"
      - name: nights
        type: integer
        source: computed
        description: date_diff(end_date, start_date) in whole days; the sharing period is the half-open range [start_date, end_date).
      - name: trip_status
        type: enum
        source: computed
        description: Trip dimension of the Booking state (see state_machines.Booking trip_status).
        default: REQUESTED
        constraints: "REQUESTED | OWNER_APPROVED | CONFIRMED | IN_TRIP | RETURNED | CLOSED | CANCELLED_BY_RENTER | CANCELLED_BY_OWNER | CANCELLED_BY_PLATFORM"
      - name: settlement_status
        type: enum
        source: computed
        description: Money dimension of the Booking state, advancing independently of trip_status (see state_machines.Booking settlement_status).
        default: NONE
        constraints: "NONE | HELD | RECONCILING | DISPUTED | SETTLED | REFUNDED"
      - name: renter_age_years_at_start
        type: integer
        source: computed
        description: Whole years between Renter.date_of_birth and this Booking's start_date, floored.
      - name: renter_record_points_snapshot
        type: integer
        source: computed
        description: "Dual-variant risk score, MOST_RECENT_ONLY variant (see calculations.renter_driving_record_points): violation_points of the single latest DRIVING_RECORD RenterQualification at booking creation time."
      - name: towing_verified_tier
        type: enum
        source: computed
        description: Renter.towing_verified_tier frozen at booking creation; drives the towing surcharge branch of calculations.protection_premium.
        constraints: "NONE | BASIC | ADVANCED"
      - name: base_subtotal_cents
        type: integer
        source: computed
        description: Seasonal nightly subtotal per calculations.booking_nightly_subtotal (round per night, then sum).
      - name: premium_cents
        type: integer
        source: computed
        description: Protection premium per calculations.protection_premium.
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: Delivery and setup charge mirrored from the DeliveryAssignment with status IN {SCHEDULED, COMPLETED} for this Booking; 0 when delivery_option == PICKUP or the assignment is WAITLISTED/VOIDED.
        default: 0
      - name: loyalty_tier
        type: enum
        source: computed
        description: Discount tier selected from pre_discount_cents per calculations.booking_quote_total STEP 2.
        default: NONE
        constraints: "NONE | LOYALTY_TIER_1 | LOYALTY_TIER_2"
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: Discount per calculations.booking_quote_total STEP 3.
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: Platform service fee per calculations.booking_quote_total STEP 5, computed on the discounted subtotal and excluding overages.
      - name: estimated_overage_cents
        type: integer
        source: computed
        description: Provisional overage from declared_miles / declared_generator_hours under the TRIP_TOTAL variant of calculations.metered_overage.
        default: 0
      - name: quoted_total_cents
        type: integer
        source: computed
        description: Provisional grand total per calculations.booking_quote_total STEP 6.
      - name: hold_amount_cents
        type: integer
        source: computed
        description: Amount debited from Renter.wallet_credit_cents at confirmation; equals quoted_total_cents at that moment.
        default: 0
      - name: final_overage_cents
        type: integer
        source: computed
        description: Actual metered overage under the PINNED SEGMENT_WISE variant of calculations.metered_overage.
        default: 0
      - name: trip_total_overage_cents
        type: integer
        source: computed
        description: Same metered data evaluated under the TRIP_TOTAL variant; retained for reconciliation transparency and never billed.
        default: 0
      - name: late_return_fee_cents
        type: integer
        source: computed
        description: Late-return charge per calculations.late_return_fee.
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: Final trip cost per calculations.final_trip_total.
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: final_total_cents - hold_amount_cents; positive means the renter owes, negative means a refund is owed.
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: Amount credited back to Renter.wallet_credit_cents on cancellation per calculations.cancellation_refund.
        default: 0
      - name: info_round_count
        type: integer
        source: computed
        description: Number of completed INFO_REQUESTED → UNDER_REVIEW loops across DamageClaim rows on this Booking; capped by MAX_INFO_ROUNDS.
        default: 0

  # ---------------------------------------------------- DeliveryAssignment ----
  - name: DeliveryAssignment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking being delivered."
      - name: campground_id
        type: string
        source: input
        description: "FK -> Campground.id; the drop-off site."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the drop-off window (closed interval).
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the drop-off window (closed interval); must be strictly after window_start.
      - name: distance_miles
        type: integer
        source: input
        description: Road miles from the rig's home base to the campground, input to the delivery fee.
        constraints: "0..500"
      - name: setup_fee_cents
        type: integer
        source: input
        description: Flat on-site levelling and hookup charge.
        default: 0
        constraints: "0..50000"
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: Delivery charge per calculations.delivery_fee.
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle (see state_machines.DeliveryAssignment).
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | WAITLISTED | COMPLETED | VOIDED"
      - name: dropoff_date
        type: string
        source: computed
        description: UTC calendar date of window_start as YYYY-MM-DD; the capacity bucket key on Campground.
      - name: promoted_from_waitlist
        type: boolean
        source: computed
        description: True when this assignment reached SCHEDULED via calculations.dropoff_waitlist_promotion rather than at creation.
        default: false

  # ---------------------------------------------------------- MeterReading ----
  - name: MeterReading
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the sharing period being metered."
      - name: reading_type
        type: enum
        source: input
        description: PRE_TRIP at handover, MID_TRIP for interim readings, POST_TRIP at return.
        constraints: "PRE_TRIP | MID_TRIP | POST_TRIP"
      - name: odometer_miles
        type: integer
        source: input
        description: Absolute odometer value in miles; must be non-decreasing across readings ordered by recorded_at.
        constraints: ">= 0"
      - name: generator_hours
        type: number
        source: input
        description: Absolute generator hour-meter value, one decimal place; must be non-decreasing across readings ordered by recorded_at.
        constraints: ">= 0; multiple of 0.1"
      - name: recorded_at
        type: datetime
        source: input
        description: Instant of the reading; primary sort key for calculations.metered_overage segment construction.

  # ------------------------------------------------------------- TripPhoto ----
  - name: TripPhoto
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the sharing period documented."
      - name: phase
        type: enum
        source: input
        description: PRE_TRIP photos form the damage baseline; POST_TRIP photos are the comparison set.
        constraints: "PRE_TRIP | POST_TRIP"
      - name: zone
        type: enum
        source: input
        description: Rig zone depicted; damage claims are scoped to a single zone.
        constraints: "EXTERIOR_FRONT | EXTERIOR_REAR | INTERIOR | ROOF | UNDERCARRIAGE"
      - name: damage_flagged
        type: boolean
        source: input
        description: Whether the uploader marked visible damage in this photo.
        default: false
      - name: image_ref
        type: string
        source: input
        description: Opaque storage reference.
        constraints: "1..200 chars"

  # ------------------------------------------------------------ DamageClaim ----
  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the sharing period the damage is attributed to."
      - name: cause_code
        type: enum
        source: input
        description: Damage cause; compared against the booking's ProtectionPlan.excluded_causes.
        constraints: "COLLISION | THEFT | WATER_INTRUSION | TIRE_BLOWOUT | AWNING_WIND | INTERIOR_STAIN | APPLIANCE_FAILURE"
      - name: damage_zone
        type: enum
        source: input
        description: Rig zone claimed; scopes the pre/post TripPhoto comparison.
        constraints: "EXTERIOR_FRONT | EXTERIOR_REAR | INTERIOR | ROOF | UNDERCARRIAGE"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Owner's asserted repair cost.
        constraints: ">= 1"
      - name: description
        type: string
        source: input
        description: Free-text narrative from the owner.
        constraints: "1..500 chars"
      - name: status
        type: enum
        source: computed
        description: Claim lifecycle (see state_machines.DamageClaim).
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | PARTIAL | DENIED | WITHDRAWN"
      - name: comparison_verdict
        type: enum
        source: computed
        description: Photo comparison outcome per calculations.damage_photo_comparison, frozen at claim creation.
        constraints: "PRE_EXISTING | NEW_DAMAGE | NO_VISIBLE_CHANGE"
      - name: pre_photo_count
        type: integer
        source: computed
        description: Count of TripPhoto rows for this booking with phase == PRE_TRIP and zone == damage_zone, frozen at claim creation.
      - name: post_photo_count
        type: integer
        source: computed
        description: Count of TripPhoto rows for this booking with phase == POST_TRIP and zone == damage_zone, frozen at claim creation.
      - name: info_rounds_used
        type: integer
        source: computed
        description: Number of INFO_REQUESTED → UNDER_REVIEW loops this claim has completed.
        default: 0
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Adjudicated gross damage per calculations.damage_claim_adjudication.
        default: 0
      - name: renter_charge_cents
        type: integer
        source: computed
        description: Renter's share of the gross amount, capped by ProtectionPlan.deductible_cents.
        default: 0
      - name: plan_paid_cents
        type: integer
        source: computed
        description: Protection plan's share, gross_amount_cents minus renter_charge_cents.
        default: 0
      - name: owner_payout_cents
        type: integer
        source: computed
        description: Amount credited to the owner for the damage; equals gross_amount_cents.
        default: 0
      - name: override_amount_cents
        type: integer
        source: input
        description: Adjuster's manual gross override supplied at adjudication; null when the formula result stands.
        default: null
      - name: override_reason
        type: string
        source: input
        description: Mandatory justification whenever override_amount_cents is supplied.
        default: null

  # ------------------------------------------------------------ LedgerEntry ----
  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; every money movement is scoped to one booking."
      - name: party
        type: enum
        source: system
        description: Which side of the marketplace the signed amount lands on.
        constraints: "RENTER | OWNER | PLATFORM"
      - name: entry_type
        type: enum
        source: system
        description: Money movement kind.
        constraints: "TRIP_CHARGE | OWNER_PAYOUT | SERVICE_FEE | PROTECTION_PREMIUM | OWNER_CANCEL_FEE | DAMAGE_RENTER_CHARGE | DAMAGE_OWNER_CREDIT | DAMAGE_PLAN_PAYMENT | TRIP_CHARGE_REVERSAL | OWNER_PAYOUT_REVERSAL | SERVICE_FEE_REVERSAL | PROTECTION_PREMIUM_REVERSAL"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount; positive credits the party, negative debits it. The sum over all LedgerEntry rows of one booking is invariantly 0.
      - name: reversal_of_entry_id
        type: string
        source: system
        description: Id of the LedgerEntry this row reverses; null for forward entries. Not an FK to another entity type.
        default: null
      - name: memo
        type: string
        source: system
        description: Human-readable reason recorded by the producing transition.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------- Listing (branching) ----
  - entity: Listing
    state_field: listing_status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /rv-marketplace/listings/{listingId}/submit-for-review"
        actor: Owner
        preconditions:
          - "acting Owner.id == Listing.owner_id"
          - "Owner.status == ACTIVE (else ERR_OWNER_SUSPENDED)"
          - "for each doc_type IN {TITLE, REGISTRATION, INSURANCE_POLICY} there exists a VehicleDocument with listing_id == Listing.id, that doc_type, verification_status == VERIFIED, superseded == false and expires_on >= logical clock date (else ERR_REQUIRED_DOCUMENT_MISSING)"
          - "Listing.inspection_photo_zone_count == MIN_INSPECTION_PHOTO_ZONES (5) (else ERR_INSPECTION_PHOTOS_INCOMPLETE)"
        side_effects:
          - "Listing.listing_status = IN_REVIEW"
          - "recompute Listing.insurance_status and Listing.inspection_photo_zone_count"
          - "Listing.version += 1; Listing.updated_at = logical clock"
      - from: IN_REVIEW
        to: LISTED
        trigger: "POST /rv-marketplace/listings/{listingId}/decision with decision == APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "Listing.insurance_status == VERIFIED (else ERR_LISTING_INSURANCE_NOT_VERIFIED)"
        side_effects:
          - "Listing.listing_status = LISTED"
          - "Owner.listed_listing_count += 1"
          - "Listing.version += 1; Owner.version += 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /rv-marketplace/listings/{listingId}/decision with decision == REJECT"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Listing.listing_status = DRAFT (revert branch; the owner may resubmit after fixing documentation)"
          - "Listing.version += 1"
        note: "Branching fork on the same trigger with divergent side-effect sets — APPROVE credits Owner.listed_listing_count, REJECT does not."
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /rv-marketplace/listings/{listingId}/suspend, or cascade level L2→L3 of the owner-cancellation chain"
        actor: PlatformAdmin | system
        preconditions:
          - "Listing.listing_status == LISTED"
        side_effects:
          - "Listing.listing_status = SUSPENDED"
          - "Owner.listed_listing_count -= 1"
          - "CASCADE L3→L4 (caused by this Listing entering SUSPENDED): every Booking with listing_id == Listing.id and trip_status IN {REQUESTED, OWNER_APPROVED, CONFIRMED}, processed in Booking.created_at ASC order, transitions to CANCELLED_BY_PLATFORM; for each, Booking.settlement_status = REFUNDED, Booking.refund_cents = Booking.hold_amount_cents, Renter.wallet_credit_cents += Booking.hold_amount_cents, Booking.hold_amount_cents = 0"
          - "CASCADE L4→L5 (caused by those Bookings entering CANCELLED_BY_PLATFORM): every DeliveryAssignment with booking_id in that set and status IN {REQUESTED, SCHEDULED, WAITLISTED} transitions to VOIDED; for each formerly-SCHEDULED assignment Campground.scheduled_assignment_count -= 1 and calculations.dropoff_waitlist_promotion runs on that Campground and dropoff_date"
          - "Listing.version += 1; Owner.version += 1"
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /rv-marketplace/listings/{listingId}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Owner.owner_penalty_points < OWNER_SUSPENSION_POINT_THRESHOLD (else ERR_LISTING_STATE_INVALID)"
          - "Listing.insurance_status == VERIFIED (else ERR_LISTING_INSURANCE_NOT_VERIFIED)"
        side_effects:
          - "Listing.listing_status = LISTED"
          - "Owner.listed_listing_count += 1"
          - "Listing.version += 1; Owner.version += 1"
        note: "SUSPENDED ⇄ LISTED forms a cycle; a listing may be suspended and reinstated any number of times."
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /rv-marketplace/listings/{listingId}/archive"
        actor: Owner | PlatformAdmin
        preconditions:
          - "no Booking on this Listing has trip_status IN {REQUESTED, OWNER_APPROVED, CONFIRMED, IN_TRIP, RETURNED} (else ERR_LISTING_STATE_INVALID)"
        side_effects:
          - "Listing.listing_status = ARCHIVED; Listing.version += 1"
      - from: SUSPENDED
        to: ARCHIVED
        trigger: "POST /rv-marketplace/listings/{listingId}/archive"
        actor: Owner | PlatformAdmin
        preconditions:
          - "no Booking on this Listing has trip_status IN {REQUESTED, OWNER_APPROVED, CONFIRMED, IN_TRIP, RETURNED} (else ERR_LISTING_STATE_INVALID)"
        side_effects:
          - "Listing.listing_status = ARCHIVED; Listing.version += 1"

  # ------------------------------- Booking, dimension 1: trip_status --------
  - entity: Booking
    state_field: trip_status
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED_BY_RENTER, CANCELLED_BY_OWNER, CANCELLED_BY_PLATFORM]
    transitions:
      - from: REQUESTED
        to: OWNER_APPROVED
        trigger: "POST /rv-marketplace/bookings/{bookingId}/approve"
        actor: Owner
        preconditions:
          - "acting Owner.id == Listing.owner_id for Booking.listing_id"
          - "Listing.listing_status == LISTED (else ERR_LISTING_NOT_BOOKABLE)"
        side_effects:
          - "Booking.trip_status = OWNER_APPROVED; Booking.version += 1"
      - from: OWNER_APPROVED
        to: CONFIRMED
        trigger: "POST /rv-marketplace/bookings/{bookingId}/confirm"
        actor: Renter
        preconditions:
          - "acting Renter.id == Booking.renter_id"
          - "Listing.listing_status == LISTED (else ERR_LISTING_NOT_BOOKABLE)"
          - "Renter.wallet_credit_cents >= Booking.quoted_total_cents (else ERR_INSUFFICIENT_RENTER_FUNDS)"
        side_effects:
          - "recompute Booking.base_subtotal_cents, premium_cents, delivery_fee_cents, loyalty_tier, loyalty_discount_cents, service_fee_cents, estimated_overage_cents, quoted_total_cents per calculations.booking_quote_total"
          - "Booking.hold_amount_cents = Booking.quoted_total_cents"
          - "Renter.wallet_credit_cents -= Booking.hold_amount_cents; Renter.version += 1"
          - "settlement dimension advances NONE → HELD"
          - "Booking.trip_status = CONFIRMED; Booking.version += 1"
      - from: CONFIRMED
        to: IN_TRIP
        trigger: "POST /rv-marketplace/bookings/{bookingId}/start"
        actor: Owner
        preconditions:
          - "acting Owner.id == Listing.owner_id"
          - "a MeterReading with booking_id == Booking.id and reading_type == PRE_TRIP exists (else ERR_METER_READINGS_INCOMPLETE)"
          - "TripPhoto rows with booking_id == Booking.id and phase == PRE_TRIP cover at least MIN_TRIP_PHOTO_ZONES (4) DISTINCT zone values (else ERR_TRIP_PHOTOS_INCOMPLETE) — note this is 4, not the 5 that MIN_INSPECTION_PHOTO_ZONES demands of listing onboarding, so a returned trip can legitimately have one undocumented zone"
          - "when Booking.delivery_option == CAMPGROUND_DROPOFF, a DeliveryAssignment with booking_id == Booking.id and status == SCHEDULED exists (else ERR_ASSIGNMENT_STATE_INVALID)"
        side_effects:
          - "Booking.trip_status = IN_TRIP; Booking.version += 1"
          - "CASCADE L1→L2 (caused by Booking entering IN_TRIP): the DeliveryAssignment with booking_id == Booking.id and status == SCHEDULED transitions to COMPLETED"
          - "CASCADE L2→L3 (caused by that assignment leaving SCHEDULED): Campground.scheduled_assignment_count -= 1 and calculations.dropoff_waitlist_promotion runs for that campground_id and dropoff_date, transitioning the selected WAITLISTED assignment to SCHEDULED with promoted_from_waitlist = true"
          - "CASCADE L3→L4 (caused by that promotion): the promoted assignment's Booking.delivery_fee_cents = promoted.delivery_fee_cents and that Booking's quote is recomputed per calculations.booking_quote_total; when that Booking.settlement_status == HELD the hold delta (new quoted_total_cents - old hold_amount_cents) is debited from its Renter.wallet_credit_cents and Booking.hold_amount_cents is reset to the new quoted_total_cents"
      - from: IN_TRIP
        to: RETURNED
        trigger: "POST /rv-marketplace/bookings/{bookingId}/return"
        actor: Renter | Owner
        preconditions:
          - "acting Renter.id == Booking.renter_id, or acting Owner.id == Listing.owner_id"
          - "a MeterReading with reading_type == POST_TRIP exists for this booking (else ERR_METER_READINGS_INCOMPLETE)"
          - "TripPhoto rows with phase == POST_TRIP cover at least MIN_TRIP_PHOTO_ZONES (4) DISTINCT zone values (else ERR_TRIP_PHOTOS_INCOMPLETE); the zone left undocumented is exactly the empty-baseline boundary that validations priority 23 rejects at claim intake"
        side_effects:
          - "compute Booking.final_overage_cents (SEGMENT_WISE variant) and Booking.trip_total_overage_cents (TRIP_TOTAL variant) per calculations.metered_overage"
          - "compute Booking.late_return_fee_cents per calculations.late_return_fee"
          - "compute Booking.final_total_cents and Booking.balance_due_cents per calculations.final_trip_total"
          - "settlement dimension advances HELD → RECONCILING"
          - "Booking.trip_status = RETURNED; Booking.version += 1"
      - from: RETURNED
        to: CLOSED
        trigger: "POST /rv-marketplace/bookings/{bookingId}/settle"
        actor: PlatformAdmin
        preconditions:
          - "Booking.settlement_status == RECONCILING (else ERR_SETTLEMENT_STATE_INVALID)"
          - "no DamageClaim on this Booking has status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} (else ERR_CLAIM_STATE_INVALID)"
          - "when Booking.balance_due_cents > 0, Renter.wallet_credit_cents >= Booking.balance_due_cents (else ERR_INSUFFICIENT_RENTER_FUNDS)"
        side_effects:
          - "append LedgerEntry rows per calculations.settlement_ledger_posting (TRIP_CHARGE, OWNER_PAYOUT, SERVICE_FEE, PROTECTION_PREMIUM)"
          - "when balance_due_cents > 0: Renter.wallet_credit_cents -= balance_due_cents; when balance_due_cents < 0: Renter.wallet_credit_cents += (-balance_due_cents)"
          - "Owner.payout_balance_cents recomputed from LedgerEntry rows with party == OWNER"
          - "Listing.completed_night_count += Booking.nights; Listing.last_reconciled_at = logical clock"
          - "settlement dimension advances RECONCILING → SETTLED"
          - "Booking.trip_status = CLOSED; Booking.version += 1"
      - from: REQUESTED
        to: CANCELLED_BY_RENTER
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by Renter"
        actor: Renter
        preconditions:
          - "acting Renter.id == Booking.renter_id"
        side_effects:
          - "Booking.refund_cents per calculations.cancellation_refund; Renter.wallet_credit_cents += refund_cents; Booking.hold_amount_cents = 0"
          - "when refund_bp < 10000: Renter.renter_penalty_points += CancellationPolicy.renter_cancel_penalty_points"
          - "settlement dimension advances to REFUNDED"
          - "every DeliveryAssignment for this Booking with status IN {REQUESTED, SCHEDULED, WAITLISTED} transitions to VOIDED; formerly-SCHEDULED assignments decrement Campground.scheduled_assignment_count and trigger calculations.dropoff_waitlist_promotion"
          - "Booking.trip_status = CANCELLED_BY_RENTER; Booking.version += 1"
      - from: OWNER_APPROVED
        to: CANCELLED_BY_RENTER
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by Renter"
        actor: Renter
        preconditions:
          - "acting Renter.id == Booking.renter_id"
        side_effects:
          - "identical to the REQUESTED → CANCELLED_BY_RENTER side-effect set"
      - from: CONFIRMED
        to: CANCELLED_BY_RENTER
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by Renter"
        actor: Renter
        preconditions:
          - "acting Renter.id == Booking.renter_id"
        side_effects:
          - "identical to the REQUESTED → CANCELLED_BY_RENTER side-effect set; because settlement_status == HELD the refund is a real wallet credit"
      - from: CONFIRMED
        to: CANCELLED_BY_OWNER
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by Owner"
        actor: Owner
        preconditions:
          - "acting Owner.id == Listing.owner_id"
        side_effects:
          - "L1: Booking.trip_status = CANCELLED_BY_OWNER; Booking.refund_cents = Booking.hold_amount_cents; Renter.wallet_credit_cents += Booking.refund_cents; Booking.hold_amount_cents = 0; settlement dimension advances to REFUNDED"
          - "CASCADE L1→L2 (caused by Booking entering CANCELLED_BY_OWNER): Owner.owner_penalty_points += CancellationPolicy.owner_cancel_penalty_points; owner_cancel_fee_cents = round_half_up(Booking.base_subtotal_cents * CancellationPolicy.owner_cancel_fee_bp / 10000); append LedgerEntry(party=OWNER, entry_type=OWNER_CANCEL_FEE, amount_cents = -owner_cancel_fee_cents) and LedgerEntry(party=PLATFORM, entry_type=OWNER_CANCEL_FEE, amount_cents = +owner_cancel_fee_cents); Owner.payout_balance_cents recomputed"
          - "CASCADE L2→L3 (caused by Owner.owner_penalty_points reaching >= OWNER_SUSPENSION_POINT_THRESHOLD): Owner.status = SUSPENDED and every Listing with owner_id == Owner.id and listing_status == LISTED, processed in Listing.created_at ASC order, transitions LISTED → SUSPENDED"
          - "CASCADE L3→L4 and L4→L5 continue inside state_machines.Listing LISTED → SUSPENDED (sibling bookings cancelled, their delivery assignments voided, campground slots released and waitlists promoted)"
          - "Booking.version += 1; Owner.version += 1"
        note: "Deepest cascade in the scaffold: 5 causally chained levels from a single owner cancellation."
      - from: REQUESTED
        to: CANCELLED_BY_PLATFORM
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by PlatformAdmin, or cascade L3→L4 from state_machines.Listing LISTED → SUSPENDED"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "Booking.refund_cents = Booking.hold_amount_cents; Renter.wallet_credit_cents += refund_cents; Booking.hold_amount_cents = 0; settlement dimension advances to REFUNDED; no penalty points are assessed"
          - "DeliveryAssignments voided as in the renter-cancellation set"
          - "Booking.trip_status = CANCELLED_BY_PLATFORM; Booking.version += 1"
      - from: OWNER_APPROVED
        to: CANCELLED_BY_PLATFORM
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by PlatformAdmin, or cascade L3→L4 from state_machines.Listing LISTED → SUSPENDED"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "identical to the REQUESTED → CANCELLED_BY_PLATFORM side-effect set"
      - from: CONFIRMED
        to: CANCELLED_BY_PLATFORM
        trigger: "POST /rv-marketplace/bookings/{bookingId}/cancel by PlatformAdmin, or cascade L3→L4 from state_machines.Listing LISTED → SUSPENDED"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "identical to the REQUESTED → CANCELLED_BY_PLATFORM side-effect set"

  # -------------------------- Booking, dimension 2: settlement_status -------
  - entity: Booking
    state_field: settlement_status
    initial_state: NONE
    terminal_states: [REFUNDED]
    transitions:
      - from: NONE
        to: HELD
        trigger: "system, on the trip dimension's OWNER_APPROVED → CONFIRMED transition"
        actor: system
        preconditions:
          - "Booking.quoted_total_cents has been computed"
        side_effects:
          - "Booking.settlement_status = HELD"
        note: "The two dimensions advance on different triggers: /start and /return move trip_status while settlement_status is untouched by /start, and /settlement/reverse moves settlement_status while trip_status stays CLOSED."
      - from: HELD
        to: RECONCILING
        trigger: "system, on the trip dimension's IN_TRIP → RETURNED transition"
        actor: system
        preconditions:
          - "Booking.final_total_cents has been computed"
        side_effects:
          - "Booking.settlement_status = RECONCILING"
      - from: RECONCILING
        to: DISPUTED
        trigger: "POST /rv-marketplace/damage-claims (claim created against this Booking)"
        actor: Owner
        preconditions:
          - "Booking.trip_status == RETURNED"
        side_effects:
          - "Booking.settlement_status = DISPUTED; Booking.version += 1"
      - from: DISPUTED
        to: RECONCILING
        trigger: "system, when every DamageClaim on this Booking has reached a terminal status IN {APPROVED, PARTIAL, DENIED, WITHDRAWN}"
        actor: system
        preconditions:
          - "count of DamageClaim rows on this Booking with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} == 0"
        side_effects:
          - "Booking.settlement_status = RECONCILING"
          - "Booking.final_total_cents and balance_due_cents recomputed to include the sum of DamageClaim.renter_charge_cents over claims with status IN {APPROVED, PARTIAL}"
      - from: RECONCILING
        to: SETTLED
        trigger: "POST /rv-marketplace/bookings/{bookingId}/settle"
        actor: PlatformAdmin
        preconditions:
          - "no DamageClaim on this Booking is in a non-terminal status"
        side_effects:
          - "Booking.settlement_status = SETTLED; LedgerEntry rows appended per calculations.settlement_ledger_posting"
      - from: SETTLED
        to: RECONCILING
        trigger: "POST /rv-marketplace/bookings/{bookingId}/settlement/reverse"
        actor: PlatformAdmin
        preconditions:
          - "Booking.settlement_status == SETTLED (else ERR_SETTLEMENT_STATE_INVALID)"
        side_effects:
          - "for every forward LedgerEntry of this Booking with entry_type IN {TRIP_CHARGE, OWNER_PAYOUT, SERVICE_FEE, PROTECTION_PREMIUM} and reversal_of_entry_id == null, processed in created_at ASC order, append the exact inverse row with entry_type suffixed _REVERSAL and reversal_of_entry_id set"
          - "reverse the wallet movement of settlement: when balance_due_cents > 0 Renter.wallet_credit_cents += balance_due_cents, when balance_due_cents < 0 Renter.wallet_credit_cents -= (-balance_due_cents)"
          - "Owner.payout_balance_cents recomputed; Listing.completed_night_count -= Booking.nights"
          - "Booking.settlement_status = RECONCILING; Booking.trip_status stays CLOSED; Booking.version += 1"
        note: "Compensating action for calculations.settlement_ledger_posting; invariant pinned by calculations.booking_ledger_conservation."
      - from: HELD
        to: REFUNDED
        trigger: "system, on any trip-dimension transition into CANCELLED_BY_RENTER / CANCELLED_BY_OWNER / CANCELLED_BY_PLATFORM"
        actor: system
        preconditions: []
        side_effects:
          - "Booking.settlement_status = REFUNDED"
      - from: NONE
        to: REFUNDED
        trigger: "system, on any trip-dimension transition into CANCELLED_BY_RENTER / CANCELLED_BY_OWNER / CANCELLED_BY_PLATFORM before confirmation"
        actor: system
        preconditions: []
        side_effects:
          - "Booking.settlement_status = REFUNDED; Booking.refund_cents = 0 because no hold was ever taken"

  # ----------------------------------------- DeliveryAssignment (branching) --
  - entity: DeliveryAssignment
    state_field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "system, at POST /rv-marketplace/delivery-assignments when capacity is available"
        actor: system
        preconditions:
          - "Campground.status == ACCEPTING"
          - "count of DeliveryAssignment rows with the same campground_id, the same dropoff_date and status == SCHEDULED < Campground.daily_dropoff_capacity"
          - "no window conflict per validations priority 25"
        side_effects:
          - "DeliveryAssignment.status = SCHEDULED; Campground.scheduled_assignment_count += 1; Campground.version += 1"
          - "Booking.delivery_fee_cents = DeliveryAssignment.delivery_fee_cents and the Booking quote is recomputed per calculations.booking_quote_total"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "system, at POST /rv-marketplace/delivery-assignments when the dropoff_date capacity bucket is already full"
        actor: system
        preconditions:
          - "Campground.status == ACCEPTING"
          - "count of SCHEDULED assignments on the same campground_id and dropoff_date >= Campground.daily_dropoff_capacity"
        side_effects:
          - "DeliveryAssignment.status = WAITLISTED; Campground.scheduled_assignment_count unchanged"
          - "Booking.delivery_fee_cents stays 0 — a WAITLISTED assignment does not bill"
        note: "Fork on the same trigger with divergent side-effect sets: SCHEDULED bills and consumes a slot, WAITLISTED does neither."
      - from: WAITLISTED
        to: SCHEDULED
        trigger: "system, calculations.dropoff_waitlist_promotion after a SCHEDULED assignment on the same campground_id and dropoff_date leaves SCHEDULED"
        actor: system
        preconditions:
          - "this row is the promotion winner per calculations.dropoff_waitlist_promotion"
          - "its window passes the validations priority 25 conflict test against the remaining SCHEDULED windows"
        side_effects:
          - "DeliveryAssignment.status = SCHEDULED; promoted_from_waitlist = true; Campground.scheduled_assignment_count += 1"
          - "Booking.delivery_fee_cents = DeliveryAssignment.delivery_fee_cents; that Booking's quote recomputed; hold delta applied when settlement_status == HELD"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system, on the Booking trip dimension's CONFIRMED → IN_TRIP transition"
        actor: system
        preconditions:
          - "DeliveryAssignment.booking_id == the starting Booking"
        side_effects:
          - "DeliveryAssignment.status = COMPLETED; Campground.scheduled_assignment_count -= 1; calculations.dropoff_waitlist_promotion runs"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /rv-marketplace/delivery-assignments/{assignmentId}/void, or cascade from any Booking cancellation"
        actor: Owner | PlatformAdmin | system
        preconditions:
          - "acting Owner.id == Listing.owner_id of the assignment's Booking when actor is Owner"
        side_effects:
          - "DeliveryAssignment.status = VOIDED; Campground.scheduled_assignment_count -= 1; Campground.version += 1"
          - "Booking.delivery_fee_cents = 0 and the Booking quote recomputed"
          - "calculations.dropoff_waitlist_promotion runs for this campground_id and dropoff_date"
      - from: WAITLISTED
        to: VOIDED
        trigger: "POST /rv-marketplace/delivery-assignments/{assignmentId}/void, or cascade from any Booking cancellation"
        actor: Owner | PlatformAdmin | system
        preconditions: []
        side_effects:
          - "DeliveryAssignment.status = VOIDED; Campground.scheduled_assignment_count unchanged; no promotion runs because no slot was released"

  # ------------------------------------------------ DamageClaim (cyclic) ----
  - entity: DamageClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, PARTIAL, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Booking.settlement_status IN {DISPUTED} (else ERR_BOOKING_SETTLEMENT_CLOSED)"
        side_effects:
          - "DamageClaim.status = UNDER_REVIEW; DamageClaim.version += 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.info_rounds_used < MAX_INFO_ROUNDS (else ERR_INFO_ROUND_LIMIT_REACHED)"
        side_effects:
          - "DamageClaim.status = INFO_REQUESTED; DamageClaim.version += 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/respond"
        actor: Owner | Renter
        preconditions:
          - "acting Owner.id == Listing.owner_id of the claim's Booking, or acting Renter.id == Booking.renter_id"
        side_effects:
          - "DamageClaim.info_rounds_used += 1; Booking.info_round_count += 1"
          - "DamageClaim.status = UNDER_REVIEW; DamageClaim.version += 1; Booking.version += 1"
        note: "UNDER_REVIEW ⇄ INFO_REQUESTED is the scaffold's revision cycle, bounded by MAX_INFO_ROUNDS = 2."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/adjudicate resulting in gross_amount_cents == claimed_amount_cents"
        actor: ClaimsAdjuster
        preconditions:
          - "override_reason is present whenever override_amount_cents is supplied (else ERR_ADJUDICATION_OVERRIDE_REASON_REQUIRED)"
        side_effects:
          - "compute gross_amount_cents, renter_charge_cents, plan_paid_cents, owner_payout_cents per calculations.damage_claim_adjudication"
          - "append LedgerEntry(RENTER, DAMAGE_RENTER_CHARGE, -renter_charge_cents), LedgerEntry(PLATFORM, DAMAGE_PLAN_PAYMENT, -plan_paid_cents), LedgerEntry(OWNER, DAMAGE_OWNER_CREDIT, +owner_payout_cents)"
          - "when no DamageClaim on the Booking remains non-terminal, the settlement dimension advances DISPUTED → RECONCILING and Booking.final_total_cents / balance_due_cents are recomputed"
          - "DamageClaim.status = APPROVED; DamageClaim.version += 1"
      - from: UNDER_REVIEW
        to: PARTIAL
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/adjudicate resulting in 0 < gross_amount_cents < claimed_amount_cents"
        actor: ClaimsAdjuster
        preconditions:
          - "override_reason is present whenever override_amount_cents is supplied"
        side_effects:
          - "identical ledger and settlement side-effect set to the APPROVED branch, with the reduced gross_amount_cents"
          - "DamageClaim.status = PARTIAL; DamageClaim.version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/adjudicate resulting in gross_amount_cents == 0"
        actor: ClaimsAdjuster
        preconditions:
          - "override_reason is present whenever override_amount_cents is supplied"
        side_effects:
          - "no LedgerEntry rows are appended — a denied claim moves no money"
          - "when no DamageClaim on the Booking remains non-terminal, the settlement dimension advances DISPUTED → RECONCILING"
          - "DamageClaim.status = DENIED; DamageClaim.version += 1"
        note: "Divergent side-effect sets across the fork: APPROVED/PARTIAL post three ledger rows, DENIED posts none."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/withdraw"
        actor: Owner
        preconditions:
          - "acting Owner.id == Listing.owner_id of the claim's Booking"
        side_effects:
          - "DamageClaim.status = WITHDRAWN; when no claim on the Booking remains non-terminal the settlement dimension advances DISPUTED → RECONCILING"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /rv-marketplace/damage-claims/{claimId}/withdraw"
        actor: Owner
        preconditions:
          - "acting Owner.id == Listing.owner_id of the claim's Booking"
        side_effects:
          - "identical to the SUBMITTED → WITHDRAWN side-effect set"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /rv-marketplace/delivery-assignments"
    occ_field: "expected_booking_version"
    description: |
      Creating a DeliveryAssignment against a Booking whose version has advanced
      since the client last read it is rejected. A second create is legitimate
      product behaviour — the newer assignment supersedes the prior one, which is
      voided and releases its campground slot — so the only way to detect that the
      client's view of the booking (its delivery_fee_cents, hold_amount_cents and
      quoted_total_cents) is stale is the version check.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: document-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /rv-marketplace/vehicle-documents"
    occ_field: "expected_listing_version"
    description: |
      Uploading a VehicleDocument against a Listing whose version has advanced
      since the client last read it is rejected. Uploading a replacement document
      of the same doc_type legitimately supersedes the prior one and can flip
      Listing.insurance_status, so a client acting on a stale view of the listing
      would silently supersede a document it never saw.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: season_multiplier_for_date
    trigger: "helper invoked by booking_nightly_subtotal and listing_pricing_guidance"
    algorithm: threshold
    formula: |
      season_multiplier_bp(d):
        md = format(d, "MM-DD")
        candidates = PricingSeason rows where start_month_day <= md <= end_month_day
                     (lexicographic MM-DD comparison, both bounds INCLUSIVE)
        if candidates is empty: return (SEASON_DEFAULT_MULTIPLIER_BP, "OFF")
        winner = candidates sorted by created_at ASC -> first        # tie-break pinned
        return (winner.multiplier_bp, winner.season_code)
    input_set: "all PricingSeason rows; no status filter exists on this configuration entity"
    constants:
      SEASON_DEFAULT_MULTIPLIER_BP: 10000
    precision: "integer basis points; no rounding at this step"
    variants: []

  - name: booking_nightly_subtotal
    trigger: "OWNER_APPROVED → CONFIRMED (booking confirm) and every recompute of the quote"
    algorithm: tiered_pricing
    formula: |
      nights = date_diff(Booking.end_date, Booking.start_date)     # half-open [start, end)
      base_subtotal_cents = 0
      for n in 0 .. nights-1:
        d = Booking.start_date + n days
        (m_bp, _) = season_multiplier_for_date(d)
        night_cents = round_half_up(Listing.base_nightly_rate_cents * m_bp / 10000)
        base_subtotal_cents += night_cents                          # PINNED ORDER:
      # round PER NIGHT to whole cents, THEN sum. Summing the unrounded products
      # and rounding once at the end is a DIFFERENT number and is NOT the rule.
    input_set: "the Listing referenced by Booking.listing_id and every PricingSeason row"
    constants:
      SEASON_DEFAULT_MULTIPLIER_BP: 10000
    precision: "whole cents, round_half_up, applied once per night before summation"
    variants:
      - name: ROUND_PER_NIGHT
        when: "always — this is the pinned production rule"
        difference: "each night's seasonal product is rounded to whole cents before it enters the sum"
      - name: ROUND_ONCE_AT_END
        when: "never applied; documented only to name the trap"
        difference: "sums the unrounded per-night products then rounds once; for base_nightly_rate_cents = 21533 over 2026-08-29..2026-09-02 it yields 110895 instead of the correct 110896"

  - name: protection_premium
    trigger: "OWNER_APPROVED → CONFIRMED (booking confirm) and every recompute of the quote"
    algorithm: weighted_scoring
    formula: |
      tier_premium_cents = max(
          ProtectionPlan.daily_premium_cents * Booking.nights,
          round_half_up(Booking.base_subtotal_cents * ProtectionPlan.premium_pct_of_base_bp / 10000)
      )
      if Listing.requires_towing == true and Booking.towing_verified_tier == BASIC:
          towing_surcharge_cents = round_half_up(tier_premium_cents * TOWING_SURCHARGE_BP / 10000)
      else:
          towing_surcharge_cents = 0
      premium_cents = min(
          tier_premium_cents + towing_surcharge_cents,
          round_half_up(ProtectionPlan.coverage_ceiling_cents * PREMIUM_CEILING_CAP_BP / 10000)
      )
    input_set: "the Booking's ProtectionPlan, its Listing, and Booking.towing_verified_tier frozen at creation"
    constants:
      TOWING_SURCHARGE_BP: 2500
      PREMIUM_CEILING_CAP_BP: 1500
    precision: "whole cents, round_half_up at each named round_half_up site"
    variants: []

  - name: delivery_fee
    trigger: "POST /rv-marketplace/delivery-assignments, and on every promotion of a WAITLISTED assignment"
    algorithm: aggregation
    formula: |
      delivery_fee_cents = Listing.delivery_base_fee_cents
                         + Listing.delivery_per_mile_cents * DeliveryAssignment.distance_miles
                         + DeliveryAssignment.setup_fee_cents
      # Booking.delivery_fee_cents mirrors this value only while the assignment's
      # status IN {SCHEDULED, COMPLETED}; it is 0 for REQUESTED, WAITLISTED, VOIDED.
    input_set: "the Listing of the assignment's Booking and the assignment's own inputs"
    constants: {}
    precision: "whole cents; all inputs are integers so no rounding occurs"
    variants: []

  - name: booking_quote_total
    trigger: "OWNER_APPROVED → CONFIRMED, and every quote recompute caused by a delivery_fee_cents change"
    algorithm: constraint_propagation
    formula: |
      # The discount depends on a subtotal, the fee depends on the discounted
      # subtotal, and the total depends on the fee — a circular-looking chain.
      # The evaluation order below is PINNED and the tier key is PINNED to
      # pre_discount_cents, NOT to quoted_total_cents.
      STEP 1: pre_discount_cents = Booking.base_subtotal_cents
                                 + Booking.premium_cents
                                 + Booking.delivery_fee_cents
      STEP 2: if   pre_discount_cents >= LOYALTY_TIER_2_MIN_CENTS: loyalty_tier = LOYALTY_TIER_2; tier_bp = LOYALTY_TIER_2_BP
              elif pre_discount_cents >= LOYALTY_TIER_1_MIN_CENTS: loyalty_tier = LOYALTY_TIER_1; tier_bp = LOYALTY_TIER_1_BP
              else:                                                loyalty_tier = NONE;           tier_bp = 0
              # PINNED: the tier is keyed on pre_discount_cents. Keying it on the
              # post-fee grand total is the trap: for pre_discount_cents = 135847
              # the correct tier is LOYALTY_TIER_1 (400 bp) even though the
              # undiscounted grand total 152149 sits in the LOYALTY_TIER_2 band.
      STEP 3: loyalty_discount_cents = round_half_up(pre_discount_cents * tier_bp / 10000)
      STEP 4: discounted_subtotal_cents = pre_discount_cents - loyalty_discount_cents
      STEP 5: service_fee_cents = round_half_up(discounted_subtotal_cents * SERVICE_FEE_BP / 10000)
              # PINNED: the fee base EXCLUDES overages.
      STEP 6: estimated_overage_cents = metered_overage(TRIP_TOTAL variant, declared inputs)
              quoted_total_cents = discounted_subtotal_cents + service_fee_cents + estimated_overage_cents
    input_set: "Booking.base_subtotal_cents, premium_cents, delivery_fee_cents, declared_miles, declared_generator_hours"
    constants:
      LOYALTY_TIER_1_MIN_CENTS: 100000
      LOYALTY_TIER_1_BP: 400
      LOYALTY_TIER_2_MIN_CENTS: 150000
      LOYALTY_TIER_2_BP: 700
      SERVICE_FEE_BP: 1200
    precision: "whole cents, round_half_up at STEP 3 and STEP 5 only"
    variants: []

  - name: metered_overage
    trigger: "IN_TRIP → RETURNED computes both variants; the TRIP_TOTAL variant also runs at confirm over declared estimates"
    algorithm: chronological
    formula: |
      readings = MeterReading rows with booking_id == Booking.id and
                 reading_type IN {PRE_TRIP, MID_TRIP, POST_TRIP},
                 sorted by recorded_at ASC, tie-break created_at ASC

      # ---- PINNED PRODUCTION VARIANT: SEGMENT_WISE -> Booking.final_overage_cents
      final_overage_cents = 0
      for each consecutive pair (r_i, r_j) in readings:
        segment_nights = date_diff(date(r_j.recorded_at), date(r_i.recorded_at))
        if segment_nights == 0: segment_nights = 1
        miles_allowance = segment_nights * Listing.included_miles_per_night
        miles_used      = r_j.odometer_miles - r_i.odometer_miles
        final_overage_cents += max(0, miles_used - miles_allowance)
                               * Listing.mileage_overage_rate_cents_per_mile
        gen_allowance = segment_nights * Listing.included_generator_hours_per_night
        gen_used      = r_j.generator_hours - r_i.generator_hours
        billable_hours = ceil_to_tenth(max(0.0, gen_used - gen_allowance))
        final_overage_cents += round_half_up(billable_hours
                               * Listing.generator_overage_rate_cents_per_hour)

      # ---- REPORTING VARIANT: TRIP_TOTAL -> Booking.trip_total_overage_cents
      first = earliest reading with reading_type == PRE_TRIP  (recorded_at ASC)
      last  = latest reading with reading_type == POST_TRIP   (recorded_at DESC)
      miles_allowance = Booking.nights * Listing.included_miles_per_night
      gen_allowance   = Booking.nights * Listing.included_generator_hours_per_night
      trip_total_overage_cents =
          max(0, (last.odometer_miles - first.odometer_miles) - miles_allowance)
              * Listing.mileage_overage_rate_cents_per_mile
        + round_half_up(ceil_to_tenth(max(0.0,
              (last.generator_hours - first.generator_hours) - gen_allowance))
              * Listing.generator_overage_rate_cents_per_hour)

      # ---- At confirm, the TRIP_TOTAL shape is applied to DECLARED estimates:
      estimated_overage_cents =
          max(0, Booking.declared_miles - Booking.nights * Listing.included_miles_per_night)
              * Listing.mileage_overage_rate_cents_per_mile
        + round_half_up(ceil_to_tenth(max(0.0, Booking.declared_generator_hours
              - Booking.nights * Listing.included_generator_hours_per_night))
              * Listing.generator_overage_rate_cents_per_hour)
    input_set: "every MeterReading of the Booking regardless of reading_type; MID_TRIP rows are included by SEGMENT_WISE and EXCLUDED by TRIP_TOTAL"
    constants: {}
    precision: "generator hours ceiled to 0.1 h before pricing; each segment's generator charge rounded_half_up to whole cents before it enters the sum"
    variants:
      - name: SEGMENT_WISE
        when: "always, for Booking.final_overage_cents — the billed number"
        difference: "allowance is granted per segment, so under-use inside one segment does NOT offset over-use inside another"
      - name: TRIP_TOTAL
        when: "always, for Booking.trip_total_overage_cents and for estimated_overage_cents at confirm"
        difference: "ignores MID_TRIP rows and pools the entire trip allowance, so it can report 0 where SEGMENT_WISE bills a real overage"

  - name: late_return_fee
    trigger: "IN_TRIP → RETURNED"
    algorithm: threshold
    formula: |
      scheduled_return_utc = Booking.end_date at SCHEDULED_RETURN_TIME_UTC
      late_minutes = max(0, floor((logical_clock - scheduled_return_utc) in minutes))
      if late_minutes <= LATE_GRACE_MINUTES:
          late_return_fee_cents = 0                      # PINNED: <= not <
      else:
          late_blocks = ceil((late_minutes - LATE_GRACE_MINUTES) / 60)
          cap_cents   = round_half_up(Listing.base_nightly_rate_cents * LATE_FEE_CAP_BP / 10000)
          late_return_fee_cents = min(late_blocks * LATE_HOUR_FEE_CENTS, cap_cents)
    input_set: "the logical clock at the moment of the return call and the Booking's own end_date"
    constants:
      SCHEDULED_RETURN_TIME_UTC: "11:00:00"
      LATE_GRACE_MINUTES: 60
      LATE_HOUR_FEE_CENTS: 7500
      LATE_FEE_CAP_BP: 20000
    precision: "whole cents; late_minutes floored to whole minutes"
    variants: []

  - name: final_trip_total
    trigger: "IN_TRIP → RETURNED, and again on DISPUTED → RECONCILING when damage charges land"
    algorithm: aggregation
    formula: |
      discounted_subtotal_cents = Booking.base_subtotal_cents + Booking.premium_cents
                                + Booking.delivery_fee_cents - Booking.loyalty_discount_cents
      damage_renter_charge_cents = sum of DamageClaim.renter_charge_cents over
          DamageClaim rows with booking_id == Booking.id and status IN {APPROVED, PARTIAL}
          (0 while no claim has been adjudicated)
      final_total_cents = discounted_subtotal_cents
                        + Booking.service_fee_cents
                        + Booking.final_overage_cents
                        + Booking.late_return_fee_cents
                        + damage_renter_charge_cents
      balance_due_cents = final_total_cents - Booking.hold_amount_cents
    input_set: "the Booking's own computed money fields plus DamageClaim rows in {APPROVED, PARTIAL}; claims in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, DENIED, WITHDRAWN} are excluded"
    constants: {}
    precision: "whole cents; all inputs are already whole cents so no rounding occurs here"
    variants: []

  - name: cancellation_refund
    trigger: "any trip-dimension transition into CANCELLED_BY_RENTER / CANCELLED_BY_OWNER / CANCELLED_BY_PLATFORM"
    algorithm: threshold
    formula: |
      scheduled_pickup_utc = Booking.start_date at SCHEDULED_PICKUP_TIME_UTC
      hours_before = floor((scheduled_pickup_utc - logical_clock) in hours)   # negative when already past
      if the cancelling actor is Renter:
          if hours_before >= CancellationPolicy.full_refund_hours_before:     # PINNED: >= not >
              refund_bp = 10000
          else:
              refund_bp = CancellationPolicy.partial_refund_pct_bp
          refund_cents = round_half_up(Booking.hold_amount_cents * refund_bp / 10000)
          if refund_bp < 10000:
              Renter.renter_penalty_points += CancellationPolicy.renter_cancel_penalty_points
      else:   # Owner or PlatformAdmin cancellation
          refund_bp = 10000
          refund_cents = Booking.hold_amount_cents
          if the cancelling actor is Owner:
              Owner.owner_penalty_points += CancellationPolicy.owner_cancel_penalty_points
              owner_cancel_fee_cents = round_half_up(Booking.base_subtotal_cents
                                       * CancellationPolicy.owner_cancel_fee_bp / 10000)
    input_set: "the Booking's CancellationPolicy, its hold_amount_cents and base_subtotal_cents, and the logical clock"
    constants:
      SCHEDULED_PICKUP_TIME_UTC: "15:00:00"
      OWNER_SUSPENSION_POINT_THRESHOLD: 12
      RENTER_BLOCK_POINT_THRESHOLD: 8
    precision: "whole cents, round_half_up"
    variants: []

  - name: renter_driving_record_points
    trigger: "read of Renter.driving_record_points; and POST /rv-marketplace/bookings freezes Booking.renter_record_points_snapshot"
    algorithm: aggregation
    formula: |
      rows = RenterQualification with renter_id == Renter.id and check_type == DRIVING_RECORD

      # ---- VARIANT ROLLING_36M -> Renter.driving_record_points (the gate)
      window_start = logical_clock - RECORD_LOOKBACK_MONTHS months            # inclusive
      driving_record_points = sum of violation_points over rows where
          checked_at >= window_start and checked_at <= logical_clock

      # ---- VARIANT MOST_RECENT_ONLY -> Booking.renter_record_points_snapshot
      latest = rows sorted by checked_at DESC, tie-break created_at DESC -> first
      renter_record_points_snapshot = latest.violation_points  (0 when rows is empty)
    input_set: "RenterQualification rows with check_type == DRIVING_RECORD only; TOWING_EXPERIENCE rows are excluded and always carry violation_points == 0"
    constants:
      RECORD_LOOKBACK_MONTHS: 36
      MAX_RECORD_POINTS: 6
    precision: "integer points; no rounding"
    variants:
      - name: ROLLING_36M
        when: "Renter.driving_record_points and the priority-18 booking gate"
        difference: "sums every in-window check, so three 2-point checks total 6 and a fourth breaches MAX_RECORD_POINTS"
      - name: MOST_RECENT_ONLY
        when: "Booking.renter_record_points_snapshot, the number the insurer underwrites on"
        difference: "reads only the newest check, so the same renter can show 6 on the gate and 2 on the snapshot"

  - name: damage_photo_comparison
    trigger: "POST /rv-marketplace/damage-claims (verdict frozen at creation)"
    algorithm: projection
    formula: |
      pre  = TripPhoto rows with booking_id == Booking.id, phase == PRE_TRIP,
             zone == DamageClaim.damage_zone
      post = TripPhoto rows with booking_id == Booking.id, phase == POST_TRIP,
             zone == DamageClaim.damage_zone
      pre_photo_count = count(pre); post_photo_count = count(post)
      # count(pre) == 0 or count(post) == 0 is rejected earlier by validations
      # priority 23 with ERR_PHOTO_BASELINE_MISSING — the empty-set boundary.
      if any p in pre  has damage_flagged == true:  comparison_verdict = PRE_EXISTING
      elif any p in post has damage_flagged == true: comparison_verdict = NEW_DAMAGE
      else:                                          comparison_verdict = NO_VISIBLE_CHANGE
      # PINNED precedence: a flagged PRE_TRIP photo wins over a flagged POST_TRIP one.
    input_set: "TripPhoto rows of this Booking restricted to the claim's damage_zone; other zones are ignored entirely"
    constants:
      MIN_TRIP_PHOTO_ZONES: 4
    precision: "n/a — enumerated verdict"
    variants: []

  - name: damage_claim_adjudication
    trigger: "POST /rv-marketplace/damage-claims/{claimId}/adjudicate"
    algorithm: waterfall_allocation
    formula: |
      if DamageClaim.cause_code IN ProtectionPlan.excluded_causes:
          gross_amount_cents = 0                       # exclusion beats every verdict
      elif override_amount_cents is supplied:
          gross_amount_cents = min(override_amount_cents, ProtectionPlan.coverage_ceiling_cents)
      else:
          eligible_cents = min(DamageClaim.claimed_amount_cents,
                               ProtectionPlan.coverage_ceiling_cents)
          verdict_factor_bp = { NEW_DAMAGE: 10000, NO_VISIBLE_CHANGE: 5000, PRE_EXISTING: 0 }
                              [DamageClaim.comparison_verdict]
          gross_amount_cents = round_half_up(eligible_cents * verdict_factor_bp / 10000)

      # waterfall: the renter's deductible bucket fills first, the plan absorbs the rest
      renter_charge_cents = min(gross_amount_cents, ProtectionPlan.deductible_cents)
      plan_paid_cents     = gross_amount_cents - renter_charge_cents
      owner_payout_cents  = gross_amount_cents
      status = DENIED  if gross_amount_cents == 0
               else APPROVED if gross_amount_cents >= DamageClaim.claimed_amount_cents
               else PARTIAL
    input_set: "the claim's frozen comparison_verdict and photo counts, plus the Booking's ProtectionPlan"
    constants:
      VERDICT_FACTOR_NEW_DAMAGE_BP: 10000
      VERDICT_FACTOR_NO_VISIBLE_CHANGE_BP: 5000
      VERDICT_FACTOR_PRE_EXISTING_BP: 0
    precision: "whole cents, round_half_up"
    variants: []

  - name: settlement_ledger_posting
    trigger: "RECONCILING → SETTLED (POST /rv-marketplace/bookings/{bookingId}/settle)"
    algorithm: waterfall_allocation
    formula: |
      owner_payout_cents = Booking.final_total_cents
                         - Booking.service_fee_cents
                         - Booking.premium_cents
      append, in this PINNED order:
        LedgerEntry(party=RENTER,   entry_type=TRIP_CHARGE,         amount_cents = -Booking.final_total_cents)
        LedgerEntry(party=OWNER,    entry_type=OWNER_PAYOUT,        amount_cents = +owner_payout_cents)
        LedgerEntry(party=PLATFORM, entry_type=SERVICE_FEE,         amount_cents = +Booking.service_fee_cents)
        LedgerEntry(party=PLATFORM, entry_type=PROTECTION_PREMIUM,  amount_cents = +Booking.premium_cents)
    input_set: "the Booking's final money fields at the moment of settlement"
    constants: {}
    precision: "whole cents; the four amounts sum to exactly 0 by construction"
    variants: []

  - name: booking_ledger_conservation
    trigger: "invariant checked after every LedgerEntry-producing transition and after POST /rv-marketplace/bookings/{bookingId}/settlement/reverse"
    algorithm: aggregation
    formula: |
      booking_ledger_balance_cents(B) =
          sum of LedgerEntry.amount_cents over ALL LedgerEntry rows with booking_id == B
          (every party, every entry_type, forward and reversal rows alike)
      INVARIANT: booking_ledger_balance_cents(B) == 0 at all times.
      COMPENSATION INVARIANT: for a settle followed by settlement/reverse,
          count(LedgerEntry where booking_id == B) doubles from 4 to 8,
          booking_ledger_balance_cents(B) stays 0, and
          Owner.payout_balance_cents returns to its pre-settle value.
    input_set: "every LedgerEntry row of the booking; no status filter — LedgerEntry is append-only and has no status"
    constants: {}
    precision: "whole cents; exact integer arithmetic, no rounding"
    variants: []

  - name: dropoff_slot_conservation
    trigger: "invariant checked after every DeliveryAssignment status change"
    algorithm: aggregation
    formula: |
      Campground.scheduled_assignment_count ==
          count of DeliveryAssignment rows with campground_id == Campground.id
          and status == SCHEDULED
      available_slots(C, D) = C.daily_dropoff_capacity
          - count(DeliveryAssignment where campground_id == C and dropoff_date == D
                  and status == SCHEDULED)
      INVARIANT: available_slots(C, D) >= 0 for every (C, D).
      COMPENSATION INVARIANT: a schedule followed by a void on a campground whose
      WAITLISTED set for that dropoff_date is empty returns
      Campground.scheduled_assignment_count to its pre-schedule value exactly.
    input_set: "DeliveryAssignment rows filtered to status == SCHEDULED; REQUESTED, WAITLISTED, COMPLETED and VOIDED rows are excluded"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: dropoff_waitlist_promotion
    trigger: "system, whenever a DeliveryAssignment leaves status SCHEDULED (COMPLETED or VOIDED) for a given campground_id and dropoff_date"
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER
      candidates = DeliveryAssignment rows where
            campground_id == C
        and dropoff_date  == D
        and status        == WAITLISTED
        and the Booking referenced by booking_id has trip_status IN {CONFIRMED, OWNER_APPROVED, REQUESTED}
      # (b) RANKING EXPRESSION
      ordered = candidates sorted by created_at ASC
      # (c) TIE-BREAK when created_at values are equal
      #     then by window_start ASC, then by distance_miles ASC
      # (d) FALLBACK
      for cand in ordered:
          if cand's window passes the validations priority-25 conflict test against
             the remaining SCHEDULED windows on (C, D):
                promote cand -> SCHEDULED, promoted_from_waitlist = true; STOP
      # if ordered is empty, or every candidate's window conflicts:
      #     no promotion occurs; Campground.scheduled_assignment_count simply stays
      #     at its decremented value. This is not an error.
    input_set: "WAITLISTED DeliveryAssignment rows on the affected (campground_id, dropoff_date) bucket only"
    constants: {}
    precision: "n/a — selector"
    variants: []

  - name: listing_pricing_guidance
    trigger: "GET /rv-marketplace/listings/{listingId}/pricing-guidance"
    algorithm: aggregation
    formula: |
      window_start_date = date(logical_clock)                       # inclusive
      window_end_date   = window_start_date + (GUIDANCE_WINDOW_DAYS - 1) days   # inclusive
      booked_nights = count of nights d with window_start_date <= d <= window_end_date
          such that some Booking B on this Listing satisfies
              B.trip_status IN {CONFIRMED, IN_TRIP, RETURNED, CLOSED}
              and B.start_date <= d < B.end_date
          (a night covered by two such bookings counts once)
      utilization_bp = round_half_up(booked_nights * 10000 / GUIDANCE_WINDOW_DAYS)
      if   utilization_bp >= 7000: util_adj_bp = 1500
      elif utilization_bp >= 4000: util_adj_bp = 500
      elif utilization_bp >= 2000: util_adj_bp = 0
      else:                        util_adj_bp = -1000
      (season_mult_bp, season_code) =
          season_multiplier_for_date(window_start_date + GUIDANCE_LOOKAHEAD_DAYS days)
      suggested_nightly_rate_cents = round_half_up(
          Listing.base_nightly_rate_cents * (10000 + util_adj_bp) * season_mult_bp
          / 100000000 )
      # PINNED: ONE rounding, at the very end. Rounding after the utilisation
      # adjustment and again after the seasonal multiplier is a different number.
    input_set: "Booking rows on this Listing with trip_status IN {CONFIRMED, IN_TRIP, RETURNED, CLOSED}; REQUESTED, OWNER_APPROVED and all CANCELLED_* bookings are excluded"
    constants:
      GUIDANCE_WINDOW_DAYS: 90
      GUIDANCE_LOOKAHEAD_DAYS: 30
    precision: "whole cents, round_half_up, applied exactly once; utilization_bp rounded_half_up to whole basis points"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of Owner, Renter, PlatformAdmin, ClaimsAdjuster"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "request body and query parameters satisfy §1.1 field types, enum members, numeric ranges, required-field presence, and pagination bounds (limit 1..100, offset >= 0); INSPECTION_PHOTO documents must carry zone and must not carry expires_on, while TITLE/REGISTRATION/INSURANCE_POLICY must carry expires_on and must not carry zone"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; the concrete error_id is the per-entity code from §1.6 (ERR_OWNER_NOT_FOUND, ERR_RENTER_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_QUALIFICATION_NOT_FOUND, ERR_CAMPGROUND_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_READING_NOT_FOUND, ERR_PHOTO_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND)"

  - priority: 6
    category: existence
    check: "every foreign key in the request body resolves, validated in §1.5 input-list order"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /rv-marketplace/listings, POST /rv-marketplace/vehicle-documents, POST /rv-marketplace/renter-qualifications, POST /rv-marketplace/bookings, POST /rv-marketplace/delivery-assignments, POST /rv-marketplace/meter-readings, POST /rv-marketplace/trip-photos, POST /rv-marketplace/damage-claims; concrete error_id is the per-entity code from §1.6"

  - priority: 7
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the target: Owner must equal Listing.owner_id (directly, or via the Booking's Listing, or via the assignment's or claim's Booking), Renter must equal Booking.renter_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Owner- and Renter-scoped endpoints"

  - priority: 8
    category: state
    check: "when the endpoint declares an expected_<parent>_version input, it equals the parent's current version"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /rv-marketplace/delivery-assignments, POST /rv-marketplace/vehicle-documents"

  - priority: 9
    category: state
    check: "Booking.trip_status is in the triggered transition's from-set per state_machines.Booking trip_status"
    error_id: ERR_BOOKING_STATE_INVALID
    http_status: 409
    applies_to: "POST /rv-marketplace/bookings/{bookingId}/approve, /confirm, /start, /return, /settle, /cancel"

  - priority: 10
    category: state
    check: "Booking.settlement_status is in the triggered transition's from-set per state_machines.Booking settlement_status"
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /rv-marketplace/bookings/{bookingId}/settle, POST /rv-marketplace/bookings/{bookingId}/settlement/reverse"

  - priority: 11
    category: state
    check: "Listing.listing_status is in the triggered transition's from-set per state_machines.Listing; archive additionally requires that no Booking on the Listing has trip_status IN {REQUESTED, OWNER_APPROVED, CONFIRMED, IN_TRIP, RETURNED}, and reinstate additionally requires Owner.owner_penalty_points < OWNER_SUSPENSION_POINT_THRESHOLD"
    error_id: ERR_LISTING_STATE_INVALID
    http_status: 409
    applies_to: "POST /rv-marketplace/listings/{listingId}/submit-for-review, /decision, /suspend, /reinstate, /archive"

  - priority: 12
    category: state
    check: "DamageClaim.status is in the triggered transition's from-set per state_machines.DamageClaim; POST /rv-marketplace/bookings/{bookingId}/settle additionally requires that no DamageClaim on the Booking has status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /rv-marketplace/damage-claims/{claimId}/start-review, /request-info, /respond, /adjudicate, /withdraw, POST /rv-marketplace/bookings/{bookingId}/settle"

  - priority: 13
    category: state
    check: "DeliveryAssignment.status is in the triggered transition's from-set; POST /rv-marketplace/bookings/{bookingId}/start additionally requires a SCHEDULED assignment when Booking.delivery_option == CAMPGROUND_DROPOFF"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /rv-marketplace/delivery-assignments/{assignmentId}/void, POST /rv-marketplace/bookings/{bookingId}/start"

  - priority: 14
    category: state
    check: "the Listing referenced by the request has listing_status == LISTED"
    error_id: ERR_LISTING_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /rv-marketplace/bookings, POST /rv-marketplace/bookings/{bookingId}/approve, POST /rv-marketplace/bookings/{bookingId}/confirm"

  - priority: 15
    category: state
    check: "at POST /rv-marketplace/damage-claims the Booking's settlement_status is IN {RECONCILING, DISPUTED} (a further claim may be filed while an earlier one is still open); at every other claim-workflow endpoint it is DISPUTED — a Booking already SETTLED or REFUNDED accepts no claim activity at all"
    error_id: ERR_BOOKING_SETTLEMENT_CLOSED
    http_status: 409
    applies_to: "POST /rv-marketplace/damage-claims, POST /rv-marketplace/damage-claims/{claimId}/start-review, /request-info, /respond, /adjudicate"

  - priority: 16
    category: business_safety
    check: "Booking.renter_age_years_at_start >= Listing.min_renter_age"
    error_id: ERR_RENTER_AGE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 17
    category: business_safety
    check: "the latest DRIVING_RECORD RenterQualification (checked_at DESC, tie-break created_at DESC) has result IN {CLEAR, MINOR} and expires_on >= Booking.end_date"
    error_id: ERR_DRIVING_RECORD_INVALID
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 18
    category: business_safety
    check: "Renter.driving_record_points (ROLLING_36M variant) <= MAX_RECORD_POINTS (6)"
    error_id: ERR_DRIVING_RECORD_POINTS_EXCEEDED
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 19
    category: business_safety
    check: "when Listing.requires_towing == true, Renter.towing_verified_tier != NONE evaluated against RenterQualification rows with expires_on >= Booking.end_date"
    error_id: ERR_TOWING_EXPERIENCE_MISSING
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 20
    category: business_safety
    check: "when Listing.requires_towing == true and Listing.gvwr_lbs > TOWING_ADVANCED_GVWR_THRESHOLD_LBS (10000), Renter.towing_verified_tier == ADVANCED"
    error_id: ERR_TOWING_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 21
    category: business_safety
    check: "Renter.renter_penalty_points < RENTER_BLOCK_POINT_THRESHOLD (8)"
    error_id: ERR_RENTER_BLOCKED
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 22
    category: business_safety
    check: "Listing.insurance_status == VERIFIED"
    error_id: ERR_LISTING_INSURANCE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings, POST /rv-marketplace/listings/{listingId}/decision with decision == APPROVE, POST /rv-marketplace/listings/{listingId}/reinstate"

  - priority: 23
    category: business_safety
    check: "for the claim's damage_zone, at least one PRE_TRIP TripPhoto and at least one POST_TRIP TripPhoto exist on the Booking — the empty-baseline boundary"
    error_id: ERR_PHOTO_BASELINE_MISSING
    http_status: 422
    applies_to: "POST /rv-marketplace/damage-claims"

  - priority: 24
    category: business_temporal
    check: "no Booking on the same Listing with trip_status IN {REQUESTED, OWNER_APPROVED, CONFIRMED, IN_TRIP, RETURNED} collides under the half-open date interval [start_date, end_date) extended by TURNAROUND_BUFFER_NIGHTS (1) after end_date: collision iff new.start_date < existing.end_date + 1 day AND new.end_date > existing.start_date"
    error_id: ERR_LISTING_DATES_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 25
    category: business_temporal
    check: "no DeliveryAssignment with status == SCHEDULED on the same campground_id collides under CLOSED minute intervals with Campground.dropoff_buffer_minutes applied SYMMETRICALLY to both ends: collision iff new.window_start <= existing.window_end + buffer AND new.window_end >= existing.window_start - buffer"
    error_id: ERR_DROPOFF_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rv-marketplace/delivery-assignments"

  - priority: 26
    category: business_temporal
    check: "Booking.start_date < Booking.end_date and Booking.start_date >= date(logical clock); DeliveryAssignment.window_end > window_start and date(window_start) == Booking.start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings, POST /rv-marketplace/delivery-assignments"

  - priority: 27
    category: business_constraint
    check: "Listing.length_ft <= Campground.max_rig_length_ft and Campground.status == ACCEPTING"
    error_id: ERR_RIG_LENGTH_EXCEEDS_CAMPGROUND
    http_status: 422
    applies_to: "POST /rv-marketplace/delivery-assignments"

  - priority: 28
    category: business_constraint
    check: "Listing.inspection_photo_zone_count == MIN_INSPECTION_PHOTO_ZONES (5)"
    error_id: ERR_INSPECTION_PHOTOS_INCOMPLETE
    http_status: 422
    applies_to: "POST /rv-marketplace/listings/{listingId}/submit-for-review"

  - priority: 29
    category: business_constraint
    check: "a VERIFIED, non-superseded, unexpired VehicleDocument exists for each doc_type IN {TITLE, REGISTRATION, INSURANCE_POLICY}"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /rv-marketplace/listings/{listingId}/submit-for-review"

  - priority: 30
    category: business_constraint
    check: "Owner.status == ACTIVE"
    error_id: ERR_OWNER_SUSPENDED
    http_status: 422
    applies_to: "POST /rv-marketplace/listings/{listingId}/submit-for-review, POST /rv-marketplace/bookings/{bookingId}/approve"

  - priority: 31
    category: business_constraint
    check: "the new MeterReading keeps odometer_miles and generator_hours non-decreasing against the immediately preceding reading by recorded_at ASC, and its recorded_at is not equal to an existing reading's recorded_at on the same Booking"
    error_id: ERR_METER_READING_REGRESSION
    http_status: 422
    applies_to: "POST /rv-marketplace/meter-readings"

  - priority: 32
    category: business_constraint
    check: "DamageClaim.info_rounds_used < MAX_INFO_ROUNDS (2)"
    error_id: ERR_INFO_ROUND_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /rv-marketplace/damage-claims/{claimId}/request-info"

  - priority: 33
    category: business_constraint
    check: "override_reason is present and non-empty whenever override_amount_cents is supplied"
    error_id: ERR_ADJUDICATION_OVERRIDE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /rv-marketplace/damage-claims/{claimId}/adjudicate"

  - priority: 34
    category: business_referential
    check: "Listing.vehicle_class is a member of ProtectionPlan.eligible_vehicle_classes"
    error_id: ERR_PLAN_CLASS_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 35
    category: business_referential
    check: "when Booking.delivery_option == CAMPGROUND_DROPOFF, Listing.delivery_offered == true"
    error_id: ERR_DELIVERY_NOT_OFFERED
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings"

  - priority: 36
    category: business_referential
    check: "the assignment's Booking has delivery_option == CAMPGROUND_DROPOFF"
    error_id: ERR_DELIVERY_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /rv-marketplace/delivery-assignments"

  - priority: 37
    category: business_referential
    check: "a MeterReading with reading_type == PRE_TRIP exists before /start, and one with reading_type == POST_TRIP exists before /return"
    error_id: ERR_METER_READINGS_INCOMPLETE
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings/{bookingId}/start, POST /rv-marketplace/bookings/{bookingId}/return"

  - priority: 38
    category: business_referential
    check: "TripPhoto rows for the relevant phase cover at least MIN_TRIP_PHOTO_ZONES (4) DISTINCT zone values (PRE_TRIP before /start, POST_TRIP before /return). Deliberately 4 of 5, unlike MIN_INSPECTION_PHOTO_ZONES which demands all 5 at listing onboarding, so that one zone may legitimately end the trip undocumented and reach the priority-23 empty-baseline boundary."
    error_id: ERR_TRIP_PHOTOS_INCOMPLETE
    http_status: 422
    applies_to: "POST /rv-marketplace/bookings/{bookingId}/start, POST /rv-marketplace/bookings/{bookingId}/return"

  - priority: 39
    category: business_fiscal
    check: "at /confirm Renter.wallet_credit_cents >= Booking.quoted_total_cents; at /settle, when Booking.balance_due_cents > 0, Renter.wallet_credit_cents >= Booking.balance_due_cents; at POST /rv-marketplace/renters/{renterId}/wallet-adjustments the resulting balance must not go negative"
    error_id: ERR_INSUFFICIENT_RENTER_FUNDS
    http_status: 402
    applies_to: "POST /rv-marketplace/bookings/{bookingId}/confirm, POST /rv-marketplace/bookings/{bookingId}/settle, POST /rv-marketplace/renters/{renterId}/wallet-adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------- test-driving clock ---
  - method: POST
    path: "/rv-marketplace/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default logical clock is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every date/deadline/expiry rule evaluates against that default and never against real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock repositioned; no entity is mutated and no version is bumped"]

  # --------------------------------------------------------------- Owner ----
  - method: POST
    path: "/rv-marketplace/owners"
    description: "Onboard an RV owner."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email, payout_state_code]
    output: Owner
    side_effects: ["Owner created with status ACTIVE, owner_penalty_points 0, payout_balance_cents 0, listed_listing_count 0"]

  - method: GET
    path: "/rv-marketplace/owners/{ownerId}"
    description: "Read one owner with computed standing and payout balance."
    roles: [Owner, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: POST
    path: "/rv-marketplace/owners/{ownerId}/penalty-adjustments"
    description: "Operator adjustment of an owner's penalty points (dispute credits, manual sanctions)."
    roles: [PlatformAdmin]
    code: 200
    input: [points_delta, reason]
    output: Owner
    side_effects:
      - "Owner.owner_penalty_points += points_delta, floored at 0; Owner.version += 1"
      - "when the result reaches >= OWNER_SUSPENSION_POINT_THRESHOLD, Owner.status = SUSPENDED and every LISTED Listing of this Owner cascades to SUSPENDED per state_machines.Listing"
      - "when the result drops below the threshold, Owner.status = ACTIVE (listings are NOT auto-reinstated)"

  # -------------------------------------------------------------- Renter ----
  - method: POST
    path: "/rv-marketplace/renters"
    description: "Onboard a renter."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email, date_of_birth, license_state_code]
    output: Renter
    side_effects: ["Renter created with wallet_credit_cents 0, renter_penalty_points 0, driving_record_status NONE, towing_verified_tier NONE"]

  - method: GET
    path: "/rv-marketplace/renters/{renterId}"
    description: "Read one renter with computed qualification and wallet fields."
    roles: [Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Renter
    side_effects: []

  - method: POST
    path: "/rv-marketplace/renters/{renterId}/wallet-adjustments"
    description: "Operator credit or debit of a renter's platform wallet."
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents_delta, reason]
    output: Renter
    side_effects: ["Renter.wallet_credit_cents += amount_cents_delta; rejected with ERR_INSUFFICIENT_RENTER_FUNDS when the result would be negative; Renter.version += 1"]

  - method: POST
    path: "/rv-marketplace/renters/{renterId}/penalty-adjustments"
    description: "Operator adjustment of a renter's penalty points."
    roles: [PlatformAdmin]
    code: 200
    input: [points_delta, reason]
    output: Renter
    side_effects: ["Renter.renter_penalty_points += points_delta, floored at 0; Renter.version += 1"]

  - method: POST
    path: "/rv-marketplace/renter-qualifications"
    description: "Record a driving-record or towing-experience check result for a renter."
    roles: [PlatformAdmin]
    code: 201
    input: ["renter_id", "check_type", "result", "violation_points?", "checked_at", "expires_on"]
    output: RenterQualification
    side_effects: ["Renter.driving_record_points, driving_record_status and towing_verified_tier recomputed; Renter.version += 1"]

  - method: GET
    path: "/rv-marketplace/renter-qualifications/{qualificationId}"
    description: "Read one qualification check."
    roles: [Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: RenterQualification
    side_effects: []

  - method: GET
    path: "/rv-marketplace/renter-qualifications"
    description: "List qualification checks, filterable by renter and check type."
    roles: [Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["renter_id?", "check_type?", "limit?", "offset?"]
    output: RenterQualification[]
    side_effects: []

  # -------------------------------------------------------- configuration ----
  - method: POST
    path: "/rv-marketplace/protection-plans"
    description: "Define a protection tier with its deductible, premium inputs, coverage ceiling and exclusions."
    roles: [PlatformAdmin]
    code: 201
    input: [tier, daily_premium_cents, premium_pct_of_base_bp, deductible_cents, coverage_ceiling_cents, excluded_causes, eligible_vehicle_classes]
    output: ProtectionPlan
    side_effects: []

  - method: POST
    path: "/rv-marketplace/cancellation-policies"
    description: "Define a cancellation tier with owner and renter penalties."
    roles: [PlatformAdmin]
    code: 201
    input: [tier, full_refund_hours_before, partial_refund_pct_bp, renter_cancel_penalty_points, owner_cancel_penalty_points, owner_cancel_fee_bp]
    output: CancellationPolicy
    side_effects: []

  - method: POST
    path: "/rv-marketplace/pricing-seasons"
    description: "Define a seasonal nightly-rate multiplier window."
    roles: [PlatformAdmin]
    code: 201
    input: [season_code, start_month_day, end_month_day, multiplier_bp]
    output: PricingSeason
    side_effects: []

  - method: GET
    path: "/rv-marketplace/pricing-seasons"
    description: "List seasonal multiplier windows in created_at ASC order — the same order the multiplier selector's tie-break uses."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["season_code?", "limit?", "offset?"]
    output: PricingSeason[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/campgrounds"
    description: "Register a campground drop-off site with its rig limit, daily capacity and window buffer."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "state_code", "max_rig_length_ft", "daily_dropoff_capacity", "dropoff_buffer_minutes", "status?"]
    output: Campground
    side_effects: ["Campground created with scheduled_assignment_count 0"]

  - method: GET
    path: "/rv-marketplace/campgrounds/{campgroundId}"
    description: "Read one campground including its conserved scheduled_assignment_count."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Campground
    side_effects: []

  # ------------------------------------------------------------- Listing ----
  - method: POST
    path: "/rv-marketplace/listings"
    description: "Create a DRAFT listing for a rig."
    roles: [Owner]
    code: 201
    input: ["owner_id", "nickname", "vehicle_class", "gvwr_lbs", "length_ft", "base_nightly_rate_cents", "included_miles_per_night", "mileage_overage_rate_cents_per_mile", "included_generator_hours_per_night", "generator_overage_rate_cents_per_hour", "min_renter_age", "delivery_offered?", "delivery_base_fee_cents?", "delivery_per_mile_cents?"]
    output: Listing
    side_effects: ["Listing created in DRAFT with requires_towing derived from vehicle_class, insurance_status PENDING, inspection_photo_zone_count 0"]

  - method: GET
    path: "/rv-marketplace/listings/{listingId}"
    description: "Read one listing with all computed onboarding and utilisation fields."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/rv-marketplace/listings"
    description: "List listings, filterable by owner and status."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["owner_id?", "listing_status?", "vehicle_class?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/listings/{listingId}/submit-for-review"
    description: "Owner submits a DRAFT listing for platform review."
    roles: [Owner]
    code: 200
    input: []
    output: Listing
    side_effects: ["Listing.listing_status DRAFT → IN_REVIEW; insurance_status and inspection_photo_zone_count recomputed; Listing.version += 1"]

  - method: POST
    path: "/rv-marketplace/listings/{listingId}/decision"
    description: "Platform approves (→ LISTED) or rejects (→ DRAFT) a listing under review."
    roles: [PlatformAdmin]
    code: 200
    input: ["decision", "decision_note?"]
    output: Listing
    side_effects:
      - "decision == APPROVE: Listing.listing_status IN_REVIEW → LISTED and Owner.listed_listing_count += 1"
      - "decision == REJECT: Listing.listing_status IN_REVIEW → DRAFT and Owner.listed_listing_count unchanged"
      - "Listing.version += 1"

  - method: POST
    path: "/rv-marketplace/listings/{listingId}/suspend"
    description: "Platform suspends a LISTED listing, cascading to its live bookings and delivery assignments."
    roles: [PlatformAdmin]
    code: 200
    input: [suspend_reason]
    output: Listing
    side_effects:
      - "Listing.listing_status LISTED → SUSPENDED; Owner.listed_listing_count -= 1"
      - "cascade L3→L4 and L4→L5 per state_machines.Listing LISTED → SUSPENDED"
      - "Listing.version += 1"

  - method: POST
    path: "/rv-marketplace/listings/{listingId}/reinstate"
    description: "Platform returns a SUSPENDED listing to LISTED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: ["Listing.listing_status SUSPENDED → LISTED; Owner.listed_listing_count += 1; Listing.version += 1"]

  - method: POST
    path: "/rv-marketplace/listings/{listingId}/archive"
    description: "Permanently retire a DRAFT or SUSPENDED listing."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: ["Listing.listing_status → ARCHIVED (terminal); Listing.version += 1"]

  - method: GET
    path: "/rv-marketplace/listings/{listingId}/pricing-guidance"
    description: "Seasonal pricing guidance and utilisation analytics over the 90-day window starting at the logical clock date."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: "{ listing_id: string, window_start_date: string, window_end_date: string, booked_nights: integer, utilization_bp: integer, util_adj_bp: integer, season_code: string, season_multiplier_bp: integer, suggested_nightly_rate_cents: integer }"
    side_effects: ["read-only; calculations.listing_pricing_guidance evaluated on demand"]

  # ----------------------------------------------------- VehicleDocument ----
  - method: POST
    path: "/rv-marketplace/vehicle-documents"
    description: "Upload vehicle documentation or an inspection photo for a listing. OCC-guarded on the parent Listing."
    roles: [Owner]
    code: 201
    input: ["listing_id", "doc_type", "zone?", "expires_on?", "image_ref", "expected_listing_version"]
    output: VehicleDocument
    side_effects:
      - "any prior non-superseded VehicleDocument on the same Listing with the same doc_type (and same zone for INSPECTION_PHOTO) gets superseded = true and verification_status = SUPERSEDED"
      - "Listing.insurance_status and Listing.inspection_photo_zone_count recomputed"
      - "increments Listing.version by 1"

  - method: GET
    path: "/rv-marketplace/vehicle-documents/{documentId}"
    description: "Read one vehicle document."
    roles: [Owner, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: VehicleDocument
    side_effects: []

  - method: GET
    path: "/rv-marketplace/vehicle-documents"
    description: "List vehicle documents, filterable by listing and doc type."
    roles: [Owner, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["listing_id?", "doc_type?", "verification_status?", "limit?", "offset?"]
    output: VehicleDocument[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/vehicle-documents/{documentId}/verify"
    description: "Platform marks a document as verified."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: VehicleDocument
    side_effects: ["VehicleDocument.verification_status PENDING → VERIFIED; Listing.insurance_status recomputed; VehicleDocument.version += 1; Listing.version += 1"]

  # ------------------------------------------------------------- Booking ----
  - method: POST
    path: "/rv-marketplace/bookings"
    description: "Renter requests a sharing period on a listed rig; all qualification, availability and plan-eligibility gates run here."
    roles: [Renter]
    code: 201
    input: [listing_id, renter_id, protection_plan_id, cancellation_policy_id, start_date, end_date, delivery_option, declared_miles, declared_generator_hours]
    output: Booking
    side_effects:
      - "Booking created with trip_status REQUESTED, settlement_status NONE"
      - "nights, renter_age_years_at_start, renter_record_points_snapshot (MOST_RECENT_ONLY variant) and towing_verified_tier frozen"
      - "base_subtotal_cents, premium_cents, loyalty_tier, loyalty_discount_cents, service_fee_cents, estimated_overage_cents and quoted_total_cents computed per calculations.booking_quote_total with delivery_fee_cents = 0"

  - method: GET
    path: "/rv-marketplace/bookings/{bookingId}"
    description: "Read one booking with both state dimensions and every computed money field."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/rv-marketplace/bookings"
    description: "List bookings, filterable by listing, renter, protection plan, cancellation policy and either state dimension."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["listing_id?", "renter_id?", "protection_plan_id?", "cancellation_policy_id?", "trip_status?", "settlement_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/approve"
    description: "Owner accepts a booking request."
    roles: [Owner]
    code: 200
    input: []
    output: Booking
    side_effects: ["Booking.trip_status REQUESTED → OWNER_APPROVED; Booking.version += 1"]

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/confirm"
    description: "Renter confirms and funds the booking; the provisional quote is recomputed and held."
    roles: [Renter]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "quote recomputed per calculations.booking_quote_total; hold_amount_cents = quoted_total_cents"
      - "Renter.wallet_credit_cents -= hold_amount_cents; Renter.version += 1"
      - "Booking.trip_status OWNER_APPROVED → CONFIRMED and settlement_status NONE → HELD; Booking.version += 1"

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/start"
    description: "Owner hands the rig over; pre-trip metering and photo coverage are enforced here."
    roles: [Owner]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Booking.trip_status CONFIRMED → IN_TRIP; Booking.version += 1"
      - "cascade L1→L2→L3→L4: SCHEDULED DeliveryAssignment → COMPLETED, campground slot released, waitlist promotion runs, the promoted assignment's Booking quote and hold are recomputed"

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/return"
    description: "Rig returned; both metered-overage variants, the late fee and the final total are computed."
    roles: [Owner, Renter]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "final_overage_cents (SEGMENT_WISE) and trip_total_overage_cents (TRIP_TOTAL) computed per calculations.metered_overage"
      - "late_return_fee_cents computed per calculations.late_return_fee"
      - "final_total_cents and balance_due_cents computed per calculations.final_trip_total"
      - "Booking.trip_status IN_TRIP → RETURNED and settlement_status HELD → RECONCILING; Booking.version += 1"

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/settle"
    description: "Platform posts the four settlement ledger rows and closes the booking."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "four LedgerEntry rows appended per calculations.settlement_ledger_posting; booking_ledger_balance_cents stays 0"
      - "Renter.wallet_credit_cents adjusted by balance_due_cents; Owner.payout_balance_cents recomputed"
      - "Listing.completed_night_count += nights; Listing.last_reconciled_at = logical clock"
      - "Booking.trip_status RETURNED → CLOSED and settlement_status RECONCILING → SETTLED; Booking.version += 1"

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/settlement/reverse"
    description: "Compensating action: reverse a posted settlement, leaving booking_ledger_balance_cents at 0 and the owner's payout balance at its pre-settle value."
    roles: [PlatformAdmin]
    code: 200
    input: [reversal_reason]
    output: Booking
    side_effects:
      - "one inverse LedgerEntry appended for each of the four forward rows, in created_at ASC order"
      - "wallet movement of settlement reversed; Owner.payout_balance_cents recomputed; Listing.completed_night_count -= nights"
      - "Booking.settlement_status SETTLED → RECONCILING while trip_status stays CLOSED; Booking.version += 1"

  - method: POST
    path: "/rv-marketplace/bookings/{bookingId}/cancel"
    description: "Cancel a booking; the refund share, penalty points and cascade depend on the acting role and the cancellation tier."
    roles: [Owner, Renter, PlatformAdmin]
    code: 200
    input: [cancel_reason]
    output: Booking
    side_effects:
      - "refund_cents per calculations.cancellation_refund credited to Renter.wallet_credit_cents"
      - "Renter or Owner penalty points assessed per the acting role"
      - "Owner cancellations post the OWNER_CANCEL_FEE ledger pair and may drive the 5-level suspension cascade"
      - "all live DeliveryAssignments of the booking → VOIDED with slot release and waitlist promotion"
      - "Booking.trip_status → CANCELLED_BY_* and settlement_status → REFUNDED; Booking.version += 1"

  # -------------------------------------------------- DeliveryAssignment ----
  - method: POST
    path: "/rv-marketplace/delivery-assignments"
    description: "Schedule a campground drop-off window for a booking. OCC-guarded on the parent Booking; a full capacity bucket yields WAITLISTED rather than an error."
    roles: [Owner, PlatformAdmin]
    code: 201
    input: ["booking_id", "campground_id", "window_start", "window_end", "distance_miles", "setup_fee_cents?", "expected_booking_version"]
    output: DeliveryAssignment
    side_effects:
      - "any prior DeliveryAssignment of the same Booking with status IN {SCHEDULED, WAITLISTED} is VOIDED first, releasing its slot and running waitlist promotion"
      - "delivery_fee_cents computed per calculations.delivery_fee; dropoff_date derived from window_start"
      - "status resolved to SCHEDULED or WAITLISTED per state_machines.DeliveryAssignment"
      - "on SCHEDULED: Campground.scheduled_assignment_count += 1 and the Booking quote is recomputed with the new delivery_fee_cents"
      - "increments Booking.version by 1"

  - method: GET
    path: "/rv-marketplace/delivery-assignments/{assignmentId}"
    description: "Read one delivery assignment."
    roles: [Owner, Renter, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects: []

  - method: GET
    path: "/rv-marketplace/delivery-assignments"
    description: "List delivery assignments, filterable by booking, campground, status and drop-off date."
    roles: [Owner, Renter, PlatformAdmin]
    code: 200
    input: ["booking_id?", "campground_id?", "status?", "dropoff_date?", "limit?", "offset?"]
    output: DeliveryAssignment[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/delivery-assignments/{assignmentId}/void"
    description: "Cancel a scheduled or waitlisted drop-off window, releasing the slot and promoting the waitlist."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: [void_reason]
    output: DeliveryAssignment
    side_effects:
      - "DeliveryAssignment.status → VOIDED; Booking.delivery_fee_cents = 0 and the Booking quote recomputed"
      - "when the row was SCHEDULED: Campground.scheduled_assignment_count -= 1 and calculations.dropoff_waitlist_promotion runs"
      - "DeliveryAssignment.version += 1"

  # -------------------------------------------- metering and trip photos ----
  - method: POST
    path: "/rv-marketplace/meter-readings"
    description: "Record a pre-trip, mid-trip or post-trip odometer and generator-hour reading."
    roles: [Owner, Renter]
    code: 201
    input: [booking_id, reading_type, odometer_miles, generator_hours, recorded_at]
    output: MeterReading
    side_effects: ["MeterReading appended; monotonicity enforced by validations priority 31; no Booking money field changes until /return"]

  - method: GET
    path: "/rv-marketplace/meter-readings/{readingId}"
    description: "Read one meter reading."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: MeterReading
    side_effects: []

  - method: GET
    path: "/rv-marketplace/meter-readings"
    description: "List meter readings, filterable by booking and reading type, ordered recorded_at ASC."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["booking_id?", "reading_type?", "limit?", "offset?"]
    output: MeterReading[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/trip-photos"
    description: "Upload a pre-trip or post-trip zone photo for a booking."
    roles: [Owner, Renter]
    code: 201
    input: ["booking_id", "phase", "zone", "damage_flagged?", "image_ref"]
    output: TripPhoto
    side_effects: ["TripPhoto appended; PRE_TRIP rows form the damage baseline consumed by calculations.damage_photo_comparison"]

  - method: GET
    path: "/rv-marketplace/trip-photos/{photoId}"
    description: "Read one trip photo."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: TripPhoto
    side_effects: []

  - method: GET
    path: "/rv-marketplace/trip-photos"
    description: "List trip photos, filterable by booking, phase and zone."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["booking_id?", "phase?", "zone?", "limit?", "offset?"]
    output: TripPhoto[]
    side_effects: []

  # ---------------------------------------------------------- DamageClaim ----
  - method: POST
    path: "/rv-marketplace/damage-claims"
    description: "Owner files a damage claim; the pre/post photo comparison verdict is frozen at creation and the booking's settlement dimension moves to DISPUTED."
    roles: [Owner]
    code: 201
    input: [booking_id, cause_code, damage_zone, claimed_amount_cents, description]
    output: DamageClaim
    side_effects:
      - "comparison_verdict, pre_photo_count and post_photo_count frozen per calculations.damage_photo_comparison"
      - "DamageClaim created in SUBMITTED"
      - "Booking.settlement_status RECONCILING → DISPUTED; Booking.version += 1"

  - method: GET
    path: "/rv-marketplace/damage-claims/{claimId}"
    description: "Read one damage claim including the frozen verdict and every adjudicated amount."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: GET
    path: "/rv-marketplace/damage-claims"
    description: "List damage claims, filterable by booking and status."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []

  - method: POST
    path: "/rv-marketplace/damage-claims/{claimId}/start-review"
    description: "Adjuster opens a submitted claim."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["DamageClaim.status SUBMITTED → UNDER_REVIEW; DamageClaim.version += 1"]

  - method: POST
    path: "/rv-marketplace/damage-claims/{claimId}/request-info"
    description: "Adjuster pauses review pending more information; bounded by MAX_INFO_ROUNDS."
    roles: [ClaimsAdjuster]
    code: 200
    input: [info_request_note]
    output: DamageClaim
    side_effects: ["DamageClaim.status UNDER_REVIEW → INFO_REQUESTED; DamageClaim.version += 1"]

  - method: POST
    path: "/rv-marketplace/damage-claims/{claimId}/respond"
    description: "Owner or renter answers an information request, closing one review cycle."
    roles: [Owner, Renter]
    code: 200
    input: [response_note]
    output: DamageClaim
    side_effects:
      - "DamageClaim.info_rounds_used += 1 and Booking.info_round_count += 1"
      - "DamageClaim.status INFO_REQUESTED → UNDER_REVIEW; DamageClaim.version += 1; Booking.version += 1"

  - method: POST
    path: "/rv-marketplace/damage-claims/{claimId}/adjudicate"
    description: "Adjuster decides the claim; the deductible waterfall and the damage ledger rows are produced here."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["override_amount_cents?", "override_reason?"]
    output: DamageClaim
    side_effects:
      - "gross_amount_cents, renter_charge_cents, plan_paid_cents and owner_payout_cents computed per calculations.damage_claim_adjudication"
      - "APPROVED and PARTIAL append three LedgerEntry rows; DENIED appends none"
      - "when no claim on the Booking remains non-terminal, Booking.settlement_status DISPUTED → RECONCILING and final_total_cents / balance_due_cents recomputed"
      - "DamageClaim.version += 1; Booking.version += 1"

  - method: POST
    path: "/rv-marketplace/damage-claims/{claimId}/withdraw"
    description: "Owner withdraws a claim before adjudication."
    roles: [Owner]
    code: 200
    input: [withdraw_reason]
    output: DamageClaim
    side_effects:
      - "DamageClaim.status → WITHDRAWN"
      - "when no claim on the Booking remains non-terminal, Booking.settlement_status DISPUTED → RECONCILING"
      - "DamageClaim.version += 1; Booking.version += 1"

  # ---------------------------------------------------------- LedgerEntry ----
  - method: GET
    path: "/rv-marketplace/ledger-entries/{entryId}"
    description: "Read one ledger row."
    roles: [Owner, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/rv-marketplace/ledger-entries"
    description: "List ledger rows, filterable by booking, party and entry type, ordered created_at ASC. The signed amount_cents of a booking's rows always sums to 0."
    roles: [Owner, Renter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["booking_id?", "party?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role is not listed in the endpoint's roles (e.g. PlatformAdmin calling /damage-claims/{claimId}/adjudicate)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor's X-User-ID does not match the resource's owning foreign key"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "body or query violates §1.1 types, enum members, ranges, required-field presence, or pagination bounds"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "ownerId path parameter or owner_id body field does not resolve"
  - id: ERR_RENTER_NOT_FOUND
    http: 404
    condition: "renterId path parameter or renter_id body field does not resolve"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "listingId path parameter or listing_id body field does not resolve"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "documentId path parameter does not resolve"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "qualificationId path parameter does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "protection_plan_id body field does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "cancellation_policy_id body field does not resolve"
  - id: ERR_CAMPGROUND_NOT_FOUND
    http: 404
    condition: "campgroundId path parameter or campground_id body field does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "bookingId path parameter or booking_id body field does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId path parameter does not resolve"
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "readingId path parameter does not resolve"
  - id: ERR_PHOTO_NOT_FOUND
    http: 404
    condition: "photoId path parameter does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claimId path parameter does not resolve"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "entryId path parameter does not resolve"
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_booking_version or expected_listing_version does not equal the parent's current version"
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "Booking.trip_status is not in the triggered transition's from-set"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "Booking.settlement_status is not in the triggered transition's from-set (e.g. reversing a settlement that is still RECONCILING)"
  - id: ERR_LISTING_STATE_INVALID
    http: 409
    condition: "Listing.listing_status is not in the triggered transition's from-set, archive attempted with live bookings, or reinstate attempted while the owner is still at or above the suspension threshold"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "DamageClaim.status is not in the triggered transition's from-set, or settle attempted while a claim on the booking is still non-terminal"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "DeliveryAssignment.status is not in the triggered transition's from-set, or a CAMPGROUND_DROPOFF booking is started without a SCHEDULED assignment"
  - id: ERR_LISTING_NOT_BOOKABLE
    http: 409
    condition: "the referenced Listing is not LISTED at booking creation, approval or confirmation"
  - id: ERR_BOOKING_SETTLEMENT_CLOSED
    http: 409
    condition: "claim creation attempted on a Booking whose settlement_status is not IN {RECONCILING, DISPUTED}, or any other claim activity attempted on a Booking whose settlement_status is not DISPUTED"
  - id: ERR_RENTER_AGE_BELOW_MINIMUM
    http: 422
    condition: "renter's age in whole years at Booking.start_date is below Listing.min_renter_age"
  - id: ERR_DRIVING_RECORD_INVALID
    http: 422
    condition: "latest DRIVING_RECORD check is missing, has result MAJOR, or expires before Booking.end_date"
  - id: ERR_DRIVING_RECORD_POINTS_EXCEEDED
    http: 422
    condition: "Renter.driving_record_points (ROLLING_36M) exceeds MAX_RECORD_POINTS (6)"
  - id: ERR_TOWING_EXPERIENCE_MISSING
    http: 422
    condition: "listing requires towing and the renter holds no unexpired TOWING_EXPERIENCE check"
  - id: ERR_TOWING_TIER_INSUFFICIENT
    http: 422
    condition: "listing GVWR exceeds 10000 lbs and the renter's towing tier is BASIC rather than ADVANCED"
  - id: ERR_RENTER_BLOCKED
    http: 422
    condition: "Renter.renter_penalty_points is at or above RENTER_BLOCK_POINT_THRESHOLD (8)"
  - id: ERR_LISTING_INSURANCE_NOT_VERIFIED
    http: 422
    condition: "Listing.insurance_status is PENDING or EXPIRED where VERIFIED is required"
  - id: ERR_PHOTO_BASELINE_MISSING
    http: 422
    condition: "the claimed zone has zero PRE_TRIP photos or zero POST_TRIP photos on the booking"
  - id: ERR_LISTING_DATES_UNAVAILABLE
    http: 409
    condition: "requested dates collide with a live booking on the same listing under the half-open interval plus the 1-night turnaround buffer"
  - id: ERR_DROPOFF_WINDOW_CONFLICT
    http: 409
    condition: "requested drop-off window collides with a SCHEDULED window on the same campground under closed intervals plus the symmetric buffer"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "start_date is not before end_date, start_date is in the past relative to the logical clock, window_end is not after window_start, or the drop-off date is not the booking's start_date"
  - id: ERR_RIG_LENGTH_EXCEEDS_CAMPGROUND
    http: 422
    condition: "Listing.length_ft exceeds Campground.max_rig_length_ft, or the campground status is CLOSED"
  - id: ERR_INSPECTION_PHOTOS_INCOMPLETE
    http: 422
    condition: "fewer than all 5 inspection photo zones are present on the listing at submit-for-review"
  - id: ERR_REQUIRED_DOCUMENT_MISSING
    http: 422
    condition: "a VERIFIED, non-superseded, unexpired TITLE, REGISTRATION or INSURANCE_POLICY document is missing at submit-for-review"
  - id: ERR_OWNER_SUSPENDED
    http: 422
    condition: "Owner.status is SUSPENDED where ACTIVE is required"
  - id: ERR_METER_READING_REGRESSION
    http: 422
    condition: "the new reading's odometer_miles or generator_hours would decrease against the preceding reading, or duplicates an existing recorded_at on the booking"
  - id: ERR_INFO_ROUND_LIMIT_REACHED
    http: 422
    condition: "a third information request is attempted on a claim that has already used MAX_INFO_ROUNDS (2) rounds"
  - id: ERR_ADJUDICATION_OVERRIDE_REASON_REQUIRED
    http: 422
    condition: "override_amount_cents supplied without a non-empty override_reason"
  - id: ERR_PLAN_CLASS_NOT_ELIGIBLE
    http: 422
    condition: "the listing's vehicle_class is not in the protection plan's eligible_vehicle_classes"
  - id: ERR_DELIVERY_NOT_OFFERED
    http: 422
    condition: "CAMPGROUND_DROPOFF requested on a listing whose delivery_offered is false"
  - id: ERR_DELIVERY_NOT_APPLICABLE
    http: 422
    condition: "a delivery assignment is created for a booking whose delivery_option is PICKUP"
  - id: ERR_METER_READINGS_INCOMPLETE
    http: 422
    condition: "no PRE_TRIP reading exists at /start, or no POST_TRIP reading exists at /return"
  - id: ERR_TRIP_PHOTOS_INCOMPLETE
    http: 422
    condition: "the relevant phase's TripPhoto rows cover fewer than MIN_TRIP_PHOTO_ZONES (4) distinct zones at /start or /return"
  - id: ERR_INSUFFICIENT_RENTER_FUNDS
    http: 402
    condition: "wallet balance is below the required hold at /confirm, below the positive balance_due at /settle, or would go negative on a wallet adjustment"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "RV owner: onboards listings and documentation, approves bookings, hands over and receives rigs, schedules deliveries, files damage claims."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /rv-marketplace/listings"
      - "POST /rv-marketplace/vehicle-documents"
      - "POST /rv-marketplace/listings/{listingId}/submit-for-review"
      - "POST /rv-marketplace/bookings/{bookingId}/approve"
      - "POST /rv-marketplace/bookings/{bookingId}/start"
      - "POST /rv-marketplace/damage-claims"
      - "POST /rv-marketplace/damage-claims/{claimId}/withdraw"
    shared_operations:
      - "POST /rv-marketplace/listings/{listingId}/archive (with PlatformAdmin)"
      - "POST /rv-marketplace/delivery-assignments (with PlatformAdmin)"
      - "POST /rv-marketplace/delivery-assignments/{assignmentId}/void (with PlatformAdmin)"
      - "POST /rv-marketplace/meter-readings (with Renter)"
      - "POST /rv-marketplace/trip-photos (with Renter)"
      - "POST /rv-marketplace/bookings/{bookingId}/return (with Renter)"
      - "POST /rv-marketplace/bookings/{bookingId}/cancel (with Renter, PlatformAdmin)"
      - "POST /rv-marketplace/damage-claims/{claimId}/respond (with Renter)"
      - "all GET reads except GET /rv-marketplace/renters/{renterId}"

  - name: Renter
    description: "Renting party: requests and confirms bookings, records metering and photos, returns the rig, answers claim information requests."
    identity: "entity_backed:Renter"
    exclusive_operations:
      - "POST /rv-marketplace/bookings"
      - "POST /rv-marketplace/bookings/{bookingId}/confirm"
    shared_operations:
      - "POST /rv-marketplace/meter-readings (with Owner)"
      - "POST /rv-marketplace/trip-photos (with Owner)"
      - "POST /rv-marketplace/bookings/{bookingId}/return (with Owner)"
      - "POST /rv-marketplace/bookings/{bookingId}/cancel (with Owner, PlatformAdmin)"
      - "POST /rv-marketplace/damage-claims/{claimId}/respond (with Owner)"
      - "GET reads of bookings, listings, assignments, readings, photos, claims, ledger entries and own renter record"

  - name: PlatformAdmin
    description: "Marketplace operator: configuration, onboarding, listing review and suspension, settlement and its compensating reversal, wallet and penalty adjustments, logical clock. Explicitly may NOT adjudicate damage claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /rv-marketplace/_clock/set_current_utc"
      - "POST /rv-marketplace/owners"
      - "POST /rv-marketplace/renters"
      - "POST /rv-marketplace/renter-qualifications"
      - "POST /rv-marketplace/protection-plans"
      - "POST /rv-marketplace/cancellation-policies"
      - "POST /rv-marketplace/pricing-seasons"
      - "POST /rv-marketplace/campgrounds"
      - "POST /rv-marketplace/owners/{ownerId}/penalty-adjustments"
      - "POST /rv-marketplace/renters/{renterId}/wallet-adjustments"
      - "POST /rv-marketplace/renters/{renterId}/penalty-adjustments"
      - "POST /rv-marketplace/vehicle-documents/{documentId}/verify"
      - "POST /rv-marketplace/listings/{listingId}/decision"
      - "POST /rv-marketplace/listings/{listingId}/suspend"
      - "POST /rv-marketplace/listings/{listingId}/reinstate"
      - "POST /rv-marketplace/bookings/{bookingId}/settle"
      - "POST /rv-marketplace/bookings/{bookingId}/settlement/reverse"
    shared_operations:
      - "POST /rv-marketplace/listings/{listingId}/archive (with Owner)"
      - "POST /rv-marketplace/delivery-assignments (with Owner)"
      - "POST /rv-marketplace/delivery-assignments/{assignmentId}/void (with Owner)"
      - "POST /rv-marketplace/bookings/{bookingId}/cancel (with Owner, Renter)"
      - "all GET reads"

  - name: ClaimsAdjuster
    description: "Independent damage adjudicator. Sole holder of the claim review and adjudication powers; holds no configuration, settlement or listing powers, so the party that decides a claim is never the party that posts the settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /rv-marketplace/damage-claims/{claimId}/start-review"
      - "POST /rv-marketplace/damage-claims/{claimId}/request-info"
      - "POST /rv-marketplace/damage-claims/{claimId}/adjudicate"
    shared_operations:
      - "read-only GETs of owners, renters, listings, documents, qualifications, bookings, readings, photos, claims and ledger entries"
