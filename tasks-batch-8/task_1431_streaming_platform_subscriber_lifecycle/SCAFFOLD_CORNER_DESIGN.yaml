      - name: winback_enroll_ineligible_account_returns_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_WINBACK_INELIGIBLE]"
        distinguishing_aspect: "Account whose cancel is too recent returns ERR_WINBACK_INELIGIBLE."
