            - "deposit_paid_cents is still 430000 — the deposit ledger is not rewritten, only the requirement and the client's balance move."
            - "The deposit recomputation used the client's balance as it stood BEFORE step 9 (10000, still strictly positive), which is why the equipment term was evaluated at all."

      - name: settlement_finalize_forward_cascade_into_reserve_and_artist_ledger
        differentiation: |
          A FORWARD cascade that appends rather than releases, and whose last hop lands in an
          append-only entity with a running balance: finalize -> engagement SETTLED -> WORKED calls
          RECONCILED -> a new SETTLEMENT_CONTRIBUTION ledger row whose balance_after_cents must
          accumulate on top of two earlier reserve movements -> the Artist's lifetime payout counter.
          The sibling instance above reverses reservations and never appends to the ledger's positive
          side.
        mechanism: "state_machines Settlement EXPENSES_RECONCILED -> FINALIZED and Engagement.lifecycle_status PERFORMED -> SETTLED with its declared four-hop side-effect chain; ReserveLedgerEntry.balance_after_cents accumulates in created_at ASC order"
