  - rule_id: boundary_precision_check
    instances:
      - name: complaint_velocity_tier_boundaries_at_9_10_49_50
        grounds:
          - calculations.complaint_velocity_risk_tier
          - errors.ERR_MONITORING_THRESHOLD_NOT_MET
          - entities.SubjectCompany.fields.risk_tier
        distinguishing_aspect: "Numeric threshold boundary on complaint_count_90d via POST /enforcement/subject-companies and POST /enforcement/investigations: 9 is STANDARD (MARKET_MONITORING intake rejected 422), exactly 10 is ELEVATED (intake allowed), 49 stays ELEVATED, exactly 50 flips to CRITICAL (>= semantics at both cut points). The other boundary instance targets an empty claimant collection on a different endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Nine Complaints LLC", complaint_count_90d: 9 }
              as: PlatformAdmin
              captures: { company_9_id: $.data.id, tier_9: $.data.risk_tier }
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Ten Complaints LLC", complaint_count_90d: 10 }
