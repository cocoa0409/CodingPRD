  - section: complexity_layers
    instances:
      - name: occ_stale_version_and_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[screening-create-stale-employee]", "errors[ERR_STALE_EMPLOYEE_VERSION]"]
        distinguishing_aspect: "OCC on Employee.version: a second screening create carrying the pre-first-create version fails ERR_STALE_EMPLOYEE_VERSION (412); with the fresh version it succeeds and supersedes (VOIDs) the first screening, bumping version to 3."
        test_recipe:
          setup: ["Employee E1 created (version 1)"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-L1", full_name: "Occ Test", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v1: $.data.version }
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v1}" }
              as: EmployeeHealthNurse
              captures: { scr_a: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v1}" }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
            - call: "GET /employee-health/employees/${emp_id}"
              as: EmployeeHealthNurse
              captures: { emp_v2: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v2}" }
              as: EmployeeHealthNurse
              captures: { scr_b: $.data.id }
            - call: "GET /employee-health/pre-placement-screenings/${scr_a}"
              as: EmployeeHealthNurse
              captures: { scr_a_status: $.data.status }
          assert:
            - "Stale second create: error_id == ERR_STALE_EMPLOYEE_VERSION (412)"
            - "Fresh create succeeded: PrePlacementScreening.${scr_b}.status == IN_PROGRESS"
            - "Superseded: ${scr_a_status} == VOID; Employee.${emp_id}.version == 3 after both successful creates"

      - name: pep_start_spawns_followups_and_injury
        claim_type: cascading_side_effects
        grounds: ["state_machines.PEPRegimen.RECOMMENDED_to_STARTED", "calculations.serology_schedule"]
        distinguishing_aspect: "One STARTED call fans out: 3 new SerologyFollowUp rows (WEEK_6/WEEK_12/MONTH_6 SCHEDULED) plus one InjuryReport (origin PEP_LINKAGE, injury_type NEEDLESTICK, status FILED, osha_recordable true)."
        test_recipe:
          setup: ["Employee; MEDIUM case exposure 2026-07-30T10:00:00Z; clock 2026-08-01T12:00:00Z; PEP RECOMMENDED"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-L2", full_name: "Spawn Fx", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
          trigger:
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-01T12:00:00Z" }
              as: EmployeeHealthPhysician
            - call: "GET /employee-health/serology-follow-ups"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthNurse
            - call: "GET /employee-health/injury-reports"
              payload: { exposure_case_id: "${case_id}" }
              as: SafetyOfficer
              captures: { inj_origin: "$.data[0].origin" }
          assert:
            - "serology-follow-ups for the case: total_count == 4 (BASELINE + WEEK_6 + WEEK_12 + MONTH_6), all status SCHEDULED or DUE"
            - "injury-reports for the case: exactly 1 row, origin == PEP_LINKAGE, injury_type == NEEDLESTICK, status == FILED, osha_recordable == true"
            - "PEPRegimen.${pep_id}.started_at == 2026-08-01T12:00:00Z"

      - name: scheduled_followup_due_at_window_open
