            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr2}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca2: $.data.id } }
            - { call: "POST /coverage-assignments/${ca1}/acknowledge", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /coverage-assignments/${ca1}/check-in", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /coverage-assignments/${ca2}/acknowledge", payload: {}, as: AthleticTrainer, as_user_id: "${tr2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:05:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T17:05:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/complete", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_s: $.data.status } }
            - { call: "GET /coverage-assignments/${ca1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca1_s: $.data.status } }
            - { call: "GET /coverage-assignments/${ca2}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca2_s: $.data.status } }
          assert:
            - "ev_s == COMPLETED"
            - "ca1_s == COMPLETED (was ON_SITE)"
            - "ca2_s == COMPLETED (was ACKNOWLEDGED)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: posture_gate_progression_end_to_end
        claim_type: input_set_filtering
        grounds:
          - calculations.athlete_participation_posture
        distinguishing_aspect: "One athlete walked through every posture gate in priority order: NOT_CLEARED (nothing filed) -> INELIGIBLE (verified physical but no baseline) -> CLEARED (baseline added) -> MEDICAL_HOLD (injury OPEN) -> CLEARED_WITH_RESTRICTIONS (begin-care) -> CLEARED (resolve). Each step asserts the exact gate output."
        test_recipe:
          setup: ["Trainer T1, nurse N1; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9301", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p1: $.data.participation_posture } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p2: $.data.participation_posture } }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p3: $.data.participation_posture } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: ANKLE_FOOT, injury_type: SPRAIN, severity: MINOR, mechanism: "landing", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p4: $.data.participation_posture } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p5: $.data.participation_posture } }
          trigger:
            - { call: "POST /injuries/${inj}/resolve", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p6: $.data.participation_posture, r6: $.data.posture_reasons } }
          assert:
            - "p1 == NOT_CLEARED"
            - "p2 == INELIGIBLE (verified physical, but no CURRENT baseline)"
            - "p3 == CLEARED"
            - "p4 == MEDICAL_HOLD (injury OPEN)"
            - "p5 == CLEARED_WITH_RESTRICTIONS (UNDER_CARE with restricted_activities)"
            - "p6 == CLEARED and r6 == [] (all gates pass after resolve)"

      - name: recurrence_two_requires_physician_review
        claim_type: conditional_validation
        grounds:
          - calculations.athlete_participation_posture
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
          - errors[ERR_RTP_PHYSICIAN_REVIEW_REQUIRED]
        distinguishing_aspect: "Conditional gate that switches on recurrence_count: after the second symptom regression, advances are blocked (ERR_RTP_PHYSICIAN_REVIEW_REQUIRED) and posture flips to MEDICAL_HOLD via the PHYSICIAN_REVIEW_PENDING clause — until a completed physician report with clearance unlocks the identical advance."
        test_recipe:
          setup:
            - "Cleared athlete (physical 2026-07-01 verified, baseline B1 2026-07-15); clock 2026-08-02T09:00"
            - "CONCUSSION/MODERATE injury at 08:30 (B1 superseded); new baseline B2 (2026-08-02); begin-care; protocol ACTIVE (injury RTP_IN_PROGRESS)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Doc Em", role_type: PHYSICIAN }, as: SystemAdmin, captures: { md: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9302", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: HEAD_NECK, injury_type: CONCUSSION, severity: MODERATE, mechanism: "collision", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE, CONTACT] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-08-02", instrument: SCAT6, symptom_score: 4, memory_index: 90.0, reaction_time_ms: 270.0, balance_errors: 3 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/regress", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rec1: $.data.recurrence_count } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T11:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/regress", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rec2: $.data.recurrence_count } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture_mid: $.data.participation_posture, reasons_mid: $.data.posture_reasons } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T11:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md}", reason: "recurrent symptoms", urgency: URGENT }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-05T12:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "cleared with monitoring", report_clearance: CLEARED_RESTRICTED }, as: Physician, as_user_id: "${md}" }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st_final: $.data.current_stage } }
          assert:
            - "rec1 == 1 and rec2 == 2"
            - "posture_mid == MEDICAL_HOLD and reasons_mid contains PHYSICIAN_REVIEW_PENDING (concussion protocol at recurrence_count 2 without a clearing report)"
            - "err == ERR_RTP_PHYSICIAN_REVIEW_REQUIRED (dwell was satisfied: stage re-entered 2026-08-04T11:00, attempt at 2026-08-05T11:00)"
            - "st_final == 2 after the physician files CLEARED_RESTRICTED (gate unlocks; dwell still satisfied at the same clock)"

      - name: lightning_timer_reset_and_radius_boundary
        claim_type: boundary
        grounds:
          - calculations.lightning_all_clear
          - entities.Venue.fields.lightning_radius_miles
        distinguishing_aspect: "Strike at exactly the venue radius (8.0 mi) counts (inclusive <=) while 8.1 does not; a second counting strike resets hold_until to its own recorded_at + 30 min; resume before hold_until fails and at exactly hold_until succeeds."
        test_recipe:
          setup: ["Venue V (OUTDOOR, default radius 8.0) with ACTIVE EAP; SOCCER PRACTICE event covered by T1 and started at 13:55 (IN_PROGRESS)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id, v_v: $.data.version } }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v1", evacuation_route: "Gate A", aed_location: "Shed", ems_contact: "911", nearest_hospital: "General" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap: $.data.id } }
            - { call: "POST /emergency-action-plans/${eap}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /emergency-action-plans/${eap}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /emergency-action-plans/${eap}/activate", payload: { expected_venue_version: "${v_v}" }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /events", payload: { event_name: "Practice", sport: SOCCER, team_level: VARSITY, event_type: PRACTICE, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:30:00Z", expected_attendance: 0 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T13:55:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}", payload: {}, as: SystemAdmin, captures: { v_radius: $.data.lightning_radius_miles } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:00:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: LIGHTNING_STRIKE, strike_distance_miles: 8.1, recorded_at: "2026-08-02T14:00:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { holdA: $.data.lightning_hold_active } }
            - { call: "GET /events/${ev}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { evA: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:10:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: LIGHTNING_STRIKE, strike_distance_miles: 8.0, recorded_at: "2026-08-02T14:10:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /events/${ev}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { evB: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:20:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: LIGHTNING_STRIKE, strike_distance_miles: 3.0, recorded_at: "2026-08-02T14:20:00Z", source: WEATHER_SERVICE }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { holdC: $.data.lightning_hold_until } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:35:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/resume", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:50:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/resume", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_final: $.data.status } }
          assert:
            - "v_radius == 8.0 (default applied)"
            - "holdA == false and evA == IN_PROGRESS (8.1 mi is outside the radius — boundary excluded)"
            - "evB == SUSPENDED_WEATHER (8.0 mi counts — inclusive boundary)"
            - "holdC == 2026-08-02T14:50:00Z (the 14:20 strike reset the 30-minute timer past the 14:10 strike's 14:40)"
            - "err == ERR_LIGHTNING_HOLD_ACTIVE at 14:35"
            - "ev_final == IN_PROGRESS at exactly 14:50 (inclusive all-clear boundary)"

      - name: inventory_fifo_multi_layer_consumption
        claim_type: correct_result
        grounds:
          - calculations.inventory_valuation
          - calculations.inventory_stock
        distinguishing_aspect: "FIFO consumes the oldest layers first: RESTOCK 2@100 + RESTOCK 2@150 then USAGE 3 leaves exactly 1@150 (valuation 150), while WAC_RUNNING values the same remainder at 125 — layer-order semantics on a fresh item."
        test_recipe:
          setup: ["Item I (par 40, threshold 10, unit_cost 100); ledger R 2@100 (09:00), R 2@150 (10:00), U 3 (11:00); clock 12:00"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Gauze", category: FIRST_AID, unit: BOX, par_level: 40, reorder_threshold: 10, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 2, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 2, unit_cost_cents: 150, occurred_at: "2026-08-01T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 3, occurred_at: "2026-08-01T11:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: FIFO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { fifo_v: $.data.valuation_cents, fifo_q: $.data.quantity_on_hand } }
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: WAC_RUNNING }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { wac_v: $.data.valuation_cents } }
          assert:
            - "fifo_v == 150 and fifo_q == 1 (oldest layers consumed first: 2@100 and 1@150 gone)"
            - "wac_v == 125 (wac 125 after the second restock; 500 - 3*125 = 125)"

      - name: reorder_suggestion_without_budget_returns_zero
        claim_type: correct_result
        grounds:
          - calculations.supply_reorder_suggestion
        distinguishing_aspect: "Missing-budget fallback: with no SupplyBudget for the clock's fiscal year, available_cents is treated as 0 and the suggestion clamps to 0 while deficit math still reports the true shortfall (25)."
        test_recipe:
          setup: ["Item I (par 30, threshold 10, unit_cost 200) with stock 5 (one RESTOCK); NO SupplyBudget for 2026"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 30, reorder_threshold: 10, unit_cost_cents: 200 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 5, unit_cost_cents: 200, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /supply-items/${item}/reorder-suggestion", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { sug: $.data.suggested_qty, def: $.data.deficit_qty, avb: $.data.available_budget_cents, maf: $.data.max_affordable_qty } }
          assert:
            - "def == 25 (30 - 5 - 0 inbound)"
            - "avb == 0 (no budget record for the clock year 2026)"
            - "maf == 0 and sug == 0"

      - name: late_arriving_reading_keeps_current_tier
        claim_type: correct_result
        grounds:
          - calculations.heat_activity_tier
        distinguishing_aspect: "Chronological input set: the current tier follows the maximum recorded_at, not insertion order — a late-posted reading with an EARLIER recorded_at (81.0 at 12:00) must not displace the current tier set by 88.0 at 13:00."
        test_recipe:
          setup: ["Venue V (OUTDOOR); clock 2026-08-02T14:00:00Z; reading 88.0 recorded 13:00 posted first"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Track", venue_type: OUTDOOR, surface: TRACK, address: "7 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:00:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 88.0, recorded_at: "2026-08-02T13:00:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { t1: $.data.current_heat_tier } }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 81.0, recorded_at: "2026-08-02T12:00:00Z", source: WEATHER_SERVICE }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { t2: $.data.current_heat_tier } }
          assert:
            - "t1 == SEVERE (88.0 in [87.0, 90.0) DISTRICT)"
            - "t2 == SEVERE (the later-posted but earlier-recorded 81.0 does not become current)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: clearance_authority_trainer_rejected_physician_succeeds
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - entities.ReturnToPlayProtocol.fields.clearance_authority_required
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_CLEARED
          - errors[ERR_CLEARANCE_AUTHORITY_INSUFFICIENT]
        distinguishing_aspect: "Clearance authority is computed from the injury: a concussion protocol at stage 6 rejects an AthleticTrainer clear with ERR_CLEARANCE_AUTHORITY_INSUFFICIENT (403), and the same call by a Physician succeeds — resolving the injury and notifying the family."
        test_recipe:
          setup:
            - "Cleared athlete; CONCUSSION/MODERATE injury with replacement baseline; protocol ACTIVE at 2026-08-02T09:00, advanced to stage 4; physician referral completed CLEARED_FULL; advanced to stage 6 by 2026-08-07T09:00"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Doc Em", role_type: PHYSICIAN }, as: SystemAdmin, captures: { md: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 12, sex: M, primary_sport: FOOTBALL, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9401", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: HEAD_NECK, injury_type: CONCUSSION, severity: MODERATE, mechanism: "helmet contact", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE, CONTACT, GAME] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-08-02", instrument: SCAT6, symptom_score: 2, memory_index: 93.0, reaction_time_ms: 260.0, balance_errors: 2 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id, auth: $.data.clearance_authority_required } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md}", reason: "stage-5 clearance eval", urgency: ROUTINE }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-05T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "recovered", report_clearance: CLEARED_FULL }, as: Physician, as_user_id: "${md}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st5: $.data.current_stage } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st6: $.data.current_stage } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/clear", payload: { clearance_notes: "trainer attempt" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /rtp-protocols/${rtp}/clear", payload: { clearance_notes: "physician clearance" }, as: Physician, as_user_id: "${md}", captures: { rtp_s: $.data.status, cleared_by: $.data.cleared_by_staff_id } }
            - { call: "GET /injuries/${inj}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_s: $.data.status } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture: $.data.participation_posture } }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${a1}", notification_type: CLEARANCE_GRANTED, status: QUEUED }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n_id: "$.data[0].id", n_type: "$.data[0].notification_type" } }
          assert:
            - "auth == PHYSICIAN and st5 == 5 and st6 == 6"
            - "err == ERR_CLEARANCE_AUTHORITY_INSUFFICIENT (http 403) for the trainer clear"
            - "rtp_s == CLEARED and cleared_by == ${md} for the physician clear"
            - "inj_s == RESOLVED (clearance cascades to the injury)"
            - "posture == CLEARED (no injuries remain open; physical and baseline valid)"
            - "n_type == CLEARANCE_GRANTED queued for the family"

      - name: priority_ordering_covered_by_difficulty
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: rtp_advance_state_vs_safety_priority
          rationale: "Dual-failure priority is exercised by §1.8 instances rtp_advance_state_vs_safety_priority (state vs safety) and coverage_assign_temporal_vs_referential_priority (temporal vs referential)."

      - name: staff_role_mismatch_on_referral_and_coverage
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_STAFF_ROLE_MISMATCH]
          - entities.PhysicianReferral.fields.physician_staff_id
          - entities.CoverageAssignment.fields.staff_id
        distinguishing_aspect: "Reference-quality rule on two endpoints: a referral addressed to a TEAM_COACH and a coverage assignment for a TEAM_COACH both fail ERR_STAFF_ROLE_MISMATCH (422)."
        test_recipe:
          setup: ["Coach C1, trainer T1, director AD; athlete with an OPEN injury; SOCCER PRACTICE event at a venue"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Coach Cal", role_type: TEAM_COACH }, as: SystemAdmin, captures: { co1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 10, sex: M, primary_sport: SOCCER, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-9402", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "tackle", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /events", payload: { event_name: "Practice", sport: SOCCER, team_level: JV, event_type: PRACTICE, venue_id: "${v1}", scheduled_start: "2026-08-02T15:00:00Z", scheduled_end: "2026-08-02T16:30:00Z", expected_attendance: 0 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${co1}", reason: "bad ref", urgency: ROUTINE }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err1: $.data.error_id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${co1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_STAFF_ROLE_MISMATCH (referral target is not PHYSICIAN)"
            - "err2 == ERR_STAFF_ROLE_MISMATCH (coverage assignee is not ATHLETIC_TRAINER)"

      - name: restock_discontinued_item_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_ITEM_DISCONTINUED]
          - entities.SupplyItem.fields.is_discontinued
        distinguishing_aspect: "A restock order for an item flipped to is_discontinued via PATCH fails with ERR_ITEM_DISCONTINUED even though the budget exists and the payload is otherwise valid."
        test_recipe:
          setup: ["Budget FY2026; item I created then discontinued via PATCH"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 50000 }, as: SystemAdmin }
            - { call: "POST /supply-items", payload: { item_name: "Old Brace", category: EQUIPMENT, unit: EACH, par_level: 10, reorder_threshold: 2, unit_cost_cents: 1500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "PATCH /supply-items/${item}", payload: { is_discontinued: true }, as: SystemAdmin, captures: { i_disc: $.data.is_discontinued } }
          trigger:
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 5, unit_cost_cents: 1500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "i_disc == true"
            - "err == ERR_ITEM_DISCONTINUED (http 422)"

      - name: guardian_contact_missing_on_send
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_GUARDIAN_CONTACT_MISSING]
          - entities.GuardianNotification.fields.channel
        distinguishing_aspect: "An athlete with neither guardian_email nor guardian_phone gets a PHONE-channel notification whose send is rejected with ERR_GUARDIAN_CONTACT_MISSING (distinct from the UNREACHABLE carrier-failure path that yields FAILED)."
        test_recipe:
          setup: ["Athlete A with no guardian contact fields; injury creates a QUEUED notification (channel PHONE)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 9, sex: F, primary_sport: TRACK, team_level: FRESHMAN, guardian_name: "Guard A", guardian_user_id: "g-9403" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: LOWER_LEG, injury_type: STRAIN, severity: MINOR, mechanism: "sprint", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${a1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n1: "$.data[0].id", n_ch: "$.data[0].channel" } }
          trigger:
            - { call: "POST /guardian-notifications/${n1}/send", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "GET /guardian-notifications/${n1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n_s: $.data.status, n_att: $.data.attempts } }
          assert:
            - "n_ch == PHONE (fallback channel when no email)"
            - "err == ERR_GUARDIAN_CONTACT_MISSING (http 409)"
            - "n_s == QUEUED and n_att == 0 (rejection is not a delivery attempt)"

      - name: inventory_quantity_and_stock_violations
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_QUANTITY_NONPOSITIVE]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: "quantity 0 is a shape violation (422 ERR_QUANTITY_NONPOSITIVE) while USAGE 3 against stock 2 is an aggregate constraint violation (409 ERR_INSUFFICIENT_STOCK); the failed usage leaves stock untouched."
        test_recipe:
          setup: ["Item I with stock 2 (one RESTOCK 2@100 at 09:00); clock 12:00"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 30, reorder_threshold: 10, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 2, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 0, occurred_at: "2026-08-01T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err1: $.data.error_id } }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 3, occurred_at: "2026-08-01T10:05:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err2: $.data.error_id } }
            - { call: "GET /supply-items/${item}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { stock: $.data.current_stock } }
          assert:
            - "err1 == ERR_QUANTITY_NONPOSITIVE (http 422)"
            - "err2 == ERR_INSUFFICIENT_STOCK (http 409)"
            - "stock == 2 (no partial consumption)"

      - name: duplicate_budget_year_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_BUDGET_YEAR]
          - entities.SupplyBudget.fields.fiscal_year
        distinguishing_aspect: "fiscal_year is unique across SupplyBudget: the second POST for 2026 fails with ERR_DUPLICATE_BUDGET_YEAR while 2027 succeeds."
