            - "L3 batch at 10:30: succeeds — Load.${l3_id}.status == BATCHED (half-open adjacency allowed)"
            - "Load.${l2_id}.status remains SCHEDULED"

      - name: truck_turnaround_closed_buffer
        grounds:
          - validations[priority=7]
          - errors[ERR_TRUCK_OVERLAP]
          - calculations.truck_selector
        distinguishing_aspect: |
          Resource Truck with different interval semantics than the plant rule: a CLOSED
          buffered interval — the next batch on the same truck requires
          batch_time >= prior batch_time + 90 min, so 11:15 (75 min after a 10:00 batch)
          is rejected while exactly 11:30 (90 min, equality) is accepted.
        test_recipe:
          setup:
            - "Standard catalog; order qty 16.0 pour 2026-08-17; L1 on T1 batched 10:00 and completed 11:00 (T1 AVAILABLE again); L2 scheduled onto T1"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
