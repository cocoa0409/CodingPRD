      - name: cf_dairy_share_floor_per_line_then_residual_cent_by_committed_tonnage
        grounds:
          - calculations.dairy_share_allocation
          - calculations.net_distributable_waterfall
          - entities.RevenueStatement.fields.share_lines
          - entities.RevenueStatement.fields.total_dairy_share_cents
          - entities.FeedstockAgreement.fields.revenue_share_basis
        distinguishing_aspect: |
          Mode (b) - a pinned rounding ORDER, not a nested expression: each share line is
          floored independently (309383 and 300810) and only then is the single residual
          cent handed to the larger committed_tonnes_per_day line, producing 309384 /
          300810; rounding each line half-up would give 309384 / 300810 by accident but
