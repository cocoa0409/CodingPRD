            - { call: "POST /records/exemption-claims/${claim_id}/adjudication", payload: { disposition: "OVERRULED", adjudication_note: "Supervisor overreach" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_adjudicate: $.data.error_id } }
            - { call: "POST /records/requests/${req_id}/invoice", payload: { memo: "Clerk invoice" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_invoice: $.data.error_id } }
