scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_defaults_and_computed_balance
        claim_type: creation_defaults
        grounds: ["entities.Customer.fields.credit_balance_cents"]
        distinguishing_aspect: "POST /api/customers with required fields returns 201; credit_balance_cents defaults to 0 and ignores any client-supplied value."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { legal_name: "New Co", billing_email: "n@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
          trigger:
            - call: "GET /api/customers/${cu1}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Customer.${cu1}.credit_balance_cents == 0"
            - "Customer.${cu1}.version == 1"
      - name: contract_missing_required_term_months
        claim_type: required_field_validation
        grounds: ["entities.Contract.fields.term_months, errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/contracts without term_months fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { legal_name: "Req Co", billing_email: "rq@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
          trigger:
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z" }
              as: OpsManager
              captures: { err1: $.data.error_id }
          assert:
            - "response 400 ERR_INVALID_REQUEST"
      - name: service_line_invalid_enum_container_size
        claim_type: type_constraint
        grounds: ["entities.ContractServiceLine.fields.container_size, errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "container_size CY_5 is outside the enum -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DRAFT contract exists"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { legal_name: "Enum Co", billing_email: "e@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
          trigger:
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_5, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
              captures: { err1: $.data.error_id }
          assert:
            - "response 400 ERR_INVALID_REQUEST"
      - name: get_contract_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/contracts/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OpsManager
              captures: { err1: $.data.error_id }
          assert:
            - "response 404 ERR_NOT_FOUND"
      - name: pickup_event_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.LedgerEntry"]
        distinguishing_aspect: "LedgerEntry has common_fields false: no update endpoint exists and rows are append-only; creating rate changes appends entries without mutating prior ones."
        test_recipe:
          setup: ["ACTIVE contract, rate notice applied via clock advance"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Led Co", billing_email: "l@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/rate-notices"
              payload: { contract_id: "${ct1}", reason: CPI, pct_increase: 0.05, effective_date: "2026-09-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/contracts/${ct1}/ledger-entries"
              payload: {}
              as: OpsManager
              captures: { le_old: $.data.0.old_base_monthly_cents, le_new: $.data.0.new_base_monthly_cents, le_src: $.data.0.source }
          assert:
            - "ledger entry source == RATE_NOTICE, old_base_monthly_cents == 100000, new_base_monthly_cents == 105000"
  - section: state_machines
    instances:
      - name: activate_contract_without_lines_invalid
        claim_type: precondition_enforcement
        grounds: ["state_machines.Contract.DRAFT_to_ACTIVE, errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a DRAFT contract with zero service lines -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT contract, no lines, start_date <= now"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "NoLine Co", billing_email: "nl@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
          trigger:
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
              captures: { err1: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE; contract still DRAFT"
      - name: terminal_contract_lockdown_reject_cancellation
        claim_type: invalid_transition
        grounds: ["state_machines.Contract, errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Filing a cancellation request against an already-TERMINATED contract is rejected (timely path terminated it earlier)."
        test_recipe:
          setup: ["contract TERMINATED via timely approved cancellation"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Term Co", billing_email: "t@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12, cancellation_notice_days: 60 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ct1}", requested_end_date: "2026-11-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { cx1: $.data.id }
            - call: "POST /api/cancellation-requests/${cx1}/approve"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ct1}", requested_end_date: "2026-12-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { err1: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE (contract TERMINATED)"
      - name: dispute_completed_event_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.PickupEvent.NONE_to_DISPUTED, errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Disputing a COMPLETED pickup (no contamination/overweight) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE contract, line, COMPLETED pickup on 2026-09-02"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Disp Co", billing_email: "dp@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-09-02", outcome: COMPLETED }
              as: HaulerAgent
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /api/pickup-events/${ev1}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${cu1}"
              captures: { err1: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE"
      - name: auto_renewal_extends_end_date
        claim_type: valid_transition
        grounds: ["state_machines.Contract.ACTIVE_to_ACTIVE"]
        distinguishing_aspect: "Clock advance past end_date auto-renews: end_date += renewal_term_months, current_term_index 1->2, contract stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE contract start 2026-09-01, term 6mo (end 2027-03-01), renewal 12mo, line @ 100000"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Ren Co", billing_email: "rn@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 6, renewal_term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/contracts/${ct1}"
              payload: {}
              as: OpsManager
              captures: { c_end: $.data.end_date, c_ti: $.data.current_term_index }
          assert:
            - "Contract.${ct1}.status == ACTIVE and current_term_index == 2"
            - "Contract.${ct1}.end_date == 2028-03-01T00:00:00Z"
  - section: calculations
    instances:
      - name: monthly_invoice_indexed_fuel_below_base_zero
        claim_type: correct_result
        grounds: ["calculations.calc_monthly_invoice"]
        distinguishing_aspect: "INDEXED fuel with current index 3.00 below base 4.00 yields fuel_cents 0 (max(0,...) floor), never negative; env and admin still apply to base 200000."
        test_recipe:
          setup: ["Clock 2026-09-01; INDEXED config (base 4.00, current 3.00, env 0.10, admin 0.05) effective 2026-09-01; ACTIVE contract, line @ 200000"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: INDEXED, fuel_index_base: 4.00, fuel_index_current: 3.00, environmental_pct: 0.10, admin_pct: 0.05, contamination_fee_cents: 15000, overweight_fee_cents: 20000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Idx Co", billing_email: "ix@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 200000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
          trigger:
            - call: "GET /api/contracts/${ct1}/monthly-invoice"
              payload: {}
              as: OpsManager
              captures: { f: $.data.fuel_cents, e: $.data.env_cents, a: $.data.admin_cents, t: $.data.total_cents }
          assert:
            - "invoice.fuel_cents == 0, env_cents == 20000, admin_cents == 10000"
            - "invoice.total_cents == 230000"
      - name: invoice_includes_event_fees_and_credits
        claim_type: input_set_filtering
        grounds: ["calculations.calc_monthly_invoice"]
        distinguishing_aspect: "Window filter: a CONTAMINATED_OVERWEIGHT event inside the 30-day window adds 15000+20000=35000 fees; an event older than 30 days is excluded; an ACTIVE credit subtracts 5000."
        test_recipe:
          setup: ["Clock 2026-09-01; FIXED config (fuel 0.10 env 0.10 admin 0.05; contam 15000, overweight 20000) effective 2026-08-01; ACTIVE contract line @ 100000; old CONTAMINATED event 2026-08-10 (excluded); recent CONTAMINATED_OVERWEIGHT event 2026-09-15; MISSED event 2026-09-14 with credit filed (credit 5000 = 100000*0.05); clock at 2026-09-20"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: FIXED, fuel_fixed_pct: 0.10, environmental_pct: 0.10, admin_pct: 0.05, contamination_fee_cents: 15000, overweight_fee_cents: 20000, effective_from: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Fee Co", billing_email: "f@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-08-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 3, base_rate_cents: 100000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-08-10", outcome: CONTAMINATED, photo_evidence_url: "https://img.example/old.jpg" }
              as: HaulerAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-09-14", outcome: MISSED }
              as: HaulerAgent
              captures: { ev_m: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-09-15", outcome: CONTAMINATED_OVERWEIGHT, photo_evidence_url: "https://img.example/new.jpg" }
              as: HaulerAgent
            - call: "POST /api/service-credits"
              payload: { service_line_id: "${sl1}", pickup_event_id: "${ev_m}" }
              as: Customer
              as_user_id: "${cu1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/contracts/${ct1}/monthly-invoice"
              payload: {}
              as: OpsManager
              captures: { fees: $.data.fees_cents, creds: $.data.credits_cents, tot: $.data.total_cents }
          assert:
            - "invoice.fees_cents == 35000 (only the 09-15 event; the 08-10 event is outside the 30-day window)"
            - "invoice.credits_cents == 5000"
            - "invoice.total_cents == 100000 + 10000 + 10000 + 5000 + 35000 - 5000 == 155000"
      - name: pickup_event_fee_snapshot_at_occurred_date
        claim_type: constants_applied
        grounds: ["calculations.calc_monthly_invoice, entities.PickupEvent.fields.contamination_fee_cents"]
        distinguishing_aspect: "Event fees snapshot the config active at occurred_date, not at read time: a config change on 2026-09-10 raising the contamination fee to 18000 leaves a 2026-09-05 event's fee at 15000."
        test_recipe:
          setup: ["Clock 2026-09-01; config A (contam 15000) effective 2026-09-01; config B (contam 18000) effective 2026-09-10; ACTIVE contract line @ 100000; CONTAMINATED event occurred 2026-09-05"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: FIXED, fuel_fixed_pct: 0.10, environmental_pct: 0.10, admin_pct: 0.05, contamination_fee_cents: 15000, overweight_fee_cents: 20000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: FIXED, fuel_fixed_pct: 0.10, environmental_pct: 0.10, admin_pct: 0.05, contamination_fee_cents: 18000, overweight_fee_cents: 20000, effective_from: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Snap Co", billing_email: "s@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-09-05", outcome: CONTAMINATED, photo_evidence_url: "https://img.example/c.jpg" }
              as: HaulerAgent
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/pickup-events/${ev1}"
              payload: {}
              as: OpsManager
              captures: { cf: $.data.contamination_fee_cents }
          assert:
            - "PickupEvent.${ev1}.contamination_fee_cents == 15000 (snapshot at occurred_date, before config B took effect)"
  - section: validations
    instances:
      - name: rate_notice_effective_date_not_future
        claim_type: violation_to_error
        grounds: ["validations[priority=7], errors[ERR_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Filing a rate notice with effective_date == now (not strictly after) -> 422 ERR_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Clock 2026-09-01; ACTIVE contract with line @ 100000"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Rn Co", billing_email: "rn2@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/rate-notices"
              payload: { contract_id: "${ct1}", reason: CPI, pct_increase: 0.05, effective_date: "2026-09-01T00:00:00Z" }
              as: OpsManager
              captures: { err1: $.data.error_id }
          assert:
            - "response 422 ERR_WINDOW_EXPIRED"
      - name: competing_offer_requires_rofr_enabled
        claim_type: violation_to_error
        grounds: ["validations[priority=9], errors[ERR_ROFR_NOT_ENABLED]"]
        distinguishing_aspect: "Offer against a contract with rofr_enabled=false -> 422 ERR_ROFR_NOT_ENABLED."
        test_recipe:
          setup: ["ACTIVE contract, rofr_enabled false (default), line @ 100000"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "NoRofr Co", billing_email: "nr@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 100000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
