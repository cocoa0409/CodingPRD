          assert:
            - "${det} == SUFFICIENT before any challenge is filed"
            - "${ch_status} == FILED, ${ch_owner} == chal-1, ${ch_filed} == 2026-08-10T00:00:00.000Z, ${ch_deadline} == 2026-08-25T00:00:00.000Z (filed_at + 15 days) and Petition.${pet_id}.challenge_status == CHALLENGE_FILED"
