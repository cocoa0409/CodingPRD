            - "trigger 5 returns HTTP 409 with data.error_id == ERR_DUPLICATE_DISPUTE_CATEGORY while the first CC_FEE dispute is OPEN"
            - "trigger 6 returns HTTP 201: TIP_CREDIT is a different category on the same pay line, so the uniqueness key is (pay_line_id, category, not-CLOSED)"
            - "trigger 7 returns HTTP 200 with status == DENIED and adjudicated_amount_cents == 0, and GET /back-wage-corrections?pay_line_id=${line_id} still reports total_count == 0 with GET /pay-lines/${line_id} reporting version == 2: the DENIED arm writes no correction and does not bump the line"
            - "trigger 8 returns HTTP 200 with status == PARTIALLY_UPHELD and adjudicated_amount_cents == 599, and GET /back-wage-corrections?pay_line_id=${line_id} reports total_count == 1 with that row PENDING at amount_cents == 599, dispute_id == ${d2_id} and supersedes_correction_id == null"
            - "GET /pay-lines/${line_id} now reports version == 3, pending_correction_cents == 599, correction_applied_cents == 0 and open_dispute_count == 0, and GET /pay-periods/${period_id} reports total_correction_cents == 599"
            - "trigger 9 returns HTTP 409 with data.error_id == ERR_DUPLICATE_DISPUTE_CATEGORY even though the CC_FEE dispute is now DENIED: the window is 'not CLOSED', not 'OPEN'"
            - "trigger 10 returns HTTP 200 with status == CLOSED and closed_at == 2026-08-10T12:00:00.000Z, no APPLIED correction being required on the DENIED arm"
            - "trigger 11 returns HTTP 201, the category having been freed by the close, and GET /disputes?pay_line_id=${line_id} reports total_count == 3"

      - name: correction_claim_ceiling_and_supersede_target_guards_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_CORRECTION_EXCEEDS_CLAIM]
          - errors[ERR_SUPERSEDE_TARGET_MISMATCH]
          - validations.priority_37
          - validations.priority_54
          - calculations.back_wage_correction_application
          - entities.BackWageCorrection.fields.supersedes_correction_id
        distinguishing_aspect: >-
          Both limbs of the supersede rule on one pay line: pointing at a correction that is no
          longer PENDING is rejected, and omitting the pointer while a PENDING correction exists is
          rejected by the same error id. Between them sits the claim ceiling, which binds only when
          dispute_id is supplied — an award of 800 cannot be paid out as 900 — while a discretionary
          correction with no dispute_id is bounded only by the obligation. The rejected writes leave
