            - "recovery_date 2026-08-19, one day before the 2026-08-20 deposit_date, returns 422 ERR_INVALID_RECOVERY_DATE"
            - "recovery_date 2026-08-26, one day past the clock date, returns 422 ERR_INVALID_RECOVERY_DATE"
            - "recovery_date 2026-08-25 returns 200 with timeliness_status CORRECTION_COMPUTED, lost_earnings_cents 27247 (8500000 x 9.0% x 13/365 over 2026-08-13..2026-08-25, all inside 2026Q3), restoration_cents 27247 and excise_tax_cents 4087"
            - "the second compute-correction, even under the other correction_method, returns 409 ERR_CORRECTION_INVALID_STATE: a computed correction is frozen, not recomputable"

