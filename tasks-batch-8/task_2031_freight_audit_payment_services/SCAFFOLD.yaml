    roles: [FinanceController]
    code: 200
    input: [gl_account_id]
    output: InvoiceLine
    side_effects: ["ERR_GL_ACCOUNT_INACTIVE"]
  - method: POST
    path: "/fap/invoice-lines/{id}/allocations"
    description: "Replace the line's cost-allocation set (must sum to 10000 bp)"
    roles: [FinanceController]
    code: 200
    input: [allocations]
    output: InvoiceLine
    side_effects: ["cost_allocation_split", "ERR_ALLOCATION_SUM_INVALID"]

  # --- AuditException ---
  - method: GET
    path: "/fap/invoices/{id}/exceptions"
