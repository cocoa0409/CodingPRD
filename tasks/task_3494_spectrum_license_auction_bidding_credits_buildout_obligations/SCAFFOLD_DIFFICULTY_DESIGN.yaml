              as: TransferReviewer
            - call: "POST /spectrum-auctions/licenses/${lic_a_id}/transfer-applications"
              payload: { transfer_type: "LEASE", transferee_applicant_id: "${t2_id}", lease_start: "2028-07-01T00:00:00Z", lease_end: "2029-01-01T00:00:00Z" }
              as: Bidder
              as_user_id: "${w1_id}"
              captures: { lease2_id: "$.data.id" }
            - call: "POST /spectrum-auctions/transfer-applications/${lease2_id}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: TransferReviewer
            - call: "POST /spectrum-auctions/transfer-applications/${lease2_id}/review"
              payload: { action: "APPROVE" }
              as: TransferReviewer
            - call: "POST /spectrum-auctions/licenses/${lic_a_id}/transfer-applications"
              payload: { transfer_type: "LEASE", transferee_applicant_id: "${t3_id}", lease_start: "2028-06-30T00:00:00Z", lease_end: "2028-12-01T00:00:00Z" }
              as: Bidder
              as_user_id: "${w1_id}"
              captures: { lease3_err: "$.data.error_id" }
          assert:
            - "TransferApplication.${lease1_id}.status == APPROVED (window [2028-01-01, 2028-07-01))"
            - "TransferApplication.${lease2_id}.status == APPROVED (starts exactly at lease1's end — half-open adjacency is NOT overlap)"
            - "lease3_err == ERR_LEASE_WINDOW_OVERLAP ([2028-06-30, 2028-12-01) intersects lease1 by one day)"
            - "lease3 was rejected at FILING time: no third TransferApplication exists for the license"
            - "License.${lic_a_id}.unjust fields untouched: transfers with credit_amount 0 carry unjust_enrichment_cents 0"

      - name: incumbent_windows_buffer_gap_in_area
        grounds:
          - state_machines.Incumbent.PLAN_SUBMITTED_to_RELOCATING
          - errors[ERR_TRANSITION_WINDOW_CONFLICT]
        distinguishing_aspect: |
          CLOSED-interval + mandatory-buffer semantics on the LICENSE-AREA resource: incumbent
          I2's window starting exactly 30 days after I1's window end (2027-03-01 -> 2027-03-31)
          satisfies the >= INCUMBENT_TRANSITION_BUFFER_DAYS gap and is accepted, while I3's
          window at a 29-day gap is rejected — adjacency alone is NOT sufficient here, unlike
          the half-open lease rule.
        test_recipe:
          setup:
            - "Band plan with area PEA001; incumbents I1, I2, I3 all registered in PEA001 and all in PLAN_SUBMITTED"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_x
            - *c_block_a
            - *c_publish
            - call: "POST /spectrum-auctions/incumbents"
              payload: { band_plan_id: "${plan_id}", area_id: "${area_x_id}", callsign: "I1-AA", relocation_cost_cents: 1000000 }
              as: AuctionAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /spectrum-auctions/incumbents"
              payload: { band_plan_id: "${plan_id}", area_id: "${area_x_id}", callsign: "I2-BB", relocation_cost_cents: 2000000 }
              as: AuctionAdmin
              captures: { i2_id: "$.data.id" }
            - call: "POST /spectrum-auctions/incumbents"
              payload: { band_plan_id: "${plan_id}", area_id: "${area_x_id}", callsign: "I3-CC", relocation_cost_cents: 3000000 }
              as: AuctionAdmin
              captures: { i3_id: "$.data.id" }
            - call: "POST /spectrum-auctions/incumbents/${i1_id}/transition"
              payload: { action: "SUBMIT_PLAN" }
              as: IncumbentOperator
              as_user_id: "${i1_id}"
            - call: "POST /spectrum-auctions/incumbents/${i2_id}/transition"
              payload: { action: "SUBMIT_PLAN" }
              as: IncumbentOperator
              as_user_id: "${i2_id}"
            - call: "POST /spectrum-auctions/incumbents/${i3_id}/transition"
              payload: { action: "SUBMIT_PLAN" }
              as: IncumbentOperator
              as_user_id: "${i3_id}"
          trigger:
            - call: "POST /spectrum-auctions/incumbents/${i1_id}/transition"
              payload: { action: "BEGIN_RELOCATION", transition_window_start: "2027-01-01T00:00:00Z", transition_window_end: "2027-03-01T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/incumbents/${i2_id}/transition"
              payload: { action: "BEGIN_RELOCATION", transition_window_start: "2027-03-31T00:00:00Z", transition_window_end: "2027-05-01T00:00:00Z" }
              as: AuctionAdmin
              captures: { i2_status: "$.data.status" }
            - call: "POST /spectrum-auctions/incumbents/${i3_id}/transition"
              payload: { action: "BEGIN_RELOCATION", transition_window_start: "2027-03-30T00:00:00Z", transition_window_end: "2027-04-20T00:00:00Z" }
              as: AuctionAdmin
              captures: { i3_err: "$.data.error_id" }
          assert:
            - "Incumbent.${i1_id}.status == RELOCATING with window [2027-01-01, 2027-03-01]"
            - "i2_status == RELOCATING (gap 2027-03-01 -> 2027-03-31 == 30 days >= INCUMBENT_TRANSITION_BUFFER_DAYS exactly — inclusive)"
            - "i3_err == ERR_TRANSITION_WINDOW_CONFLICT (29-day gap < 30-day buffer against I1; also overlaps I2)"
            - "Incumbent.${i3_id}.status == PLAN_SUBMITTED (failed transition leaves state and version untouched)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: upfront_ledger_conserved_across_refund_forfeit
        grounds:
          - entities.Applicant.fields.upfront_paid_cents
          - entities.Applicant.fields.upfront_held_cents
          - entities.Applicant.fields.upfront_refunded_cents
          - entities.Applicant.fields.upfront_forfeited_cents
        distinguishing_aspect: |
          Conserved quantity: per-applicant UPFRONT MONEY. For every applicant and after every
          compensating action, upfront_paid_cents == upfront_held_cents + upfront_refunded_cents
          + upfront_forfeited_cents. W's withdrawal moves held -> refunded; K's disqualification
          moves held -> forfeited; the sum never drifts.
        test_recipe:
          setup:
            - "W paid 31,250,000,000 and withdraws while APPLICATION_OPEN; K paid 25,000,000,000, qualifies, and is later DISQUALIFIED during CLOCK_ACTIVE"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_x
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "W Withdrawer", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "W Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { w_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${w_id}/upfront-payments"
              payload: { amount_cents: 31250000000 }
              as: Bidder
              as_user_id: "${w_id}"
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "K Colluder", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "K Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { k_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${k_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${k_id}"
            - call: "POST /spectrum-auctions/applicants/${w_id}/withdraw"
              payload: {}
              as: Bidder
              as_user_id: "${w_id}"
            - call: "POST /spectrum-auctions/applicants/${k_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${k_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
          trigger:
            - call: "POST /spectrum-auctions/applicants/${k_id}/review"
              payload: { action: "DISQUALIFY" }
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/applicants/${w_id}"
              payload: {}
              as: AuctionAdmin
              captures: { w_paid: "$.data.upfront_paid_cents", w_held: "$.data.upfront_held_cents", w_ref: "$.data.upfront_refunded_cents", w_forf: "$.data.upfront_forfeited_cents" }
            - call: "GET /spectrum-auctions/applicants/${k_id}"
              payload: {}
              as: AuctionAdmin
              captures: { k_paid: "$.data.upfront_paid_cents", k_held: "$.data.upfront_held_cents", k_ref: "$.data.upfront_refunded_cents", k_forf: "$.data.upfront_forfeited_cents" }
          assert:
            - "w_paid == 31250000000 and w_held == 0 and w_ref == 31250000000 and w_forf == 0 (compensating WITHDRAW conserves the total)"
            - "w_paid == w_held + w_ref + w_forf"
            - "k_paid == 25000000000 and k_held == 0 and k_ref == 0 and k_forf == 25000000000 (compensating DISQUALIFY conserves the total)"
            - "k_paid == k_held + k_ref + k_forf"
            - "Auction.${auction_id}.forfeited_deposits_cents == 25000000000"

      - name: block_supply_conserved_across_grant_and_termination
        grounds:
          - entities.Auction.fields.available_supply
          - state_machines.License.PENDING_PAYMENT_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: BLOCK SUPPLY per (area, category). Granting consumes supply
          (available 2 -> 0 as two licenses are created); the compensating payment-deadline
          cancellations return supply (0 -> 2). At every observation, available + (licenses in
          PENDING_PAYMENT/ACTIVE/RENEWAL_REVIEW) == supply_per_area == 2.
        test_recipe:
          setup:
            - "Single-product plan PEA002 / CATEGORY_A supply 2; no-credit applicant wins qty 2 (two licenses created); never pays"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - *c_applicant_w1
            - *c_upfront_w1
            - *c_review_w1
            - *c_qualify_w1
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - call: "GET /spectrum-auctions/auctions/${auction_id}"
              payload: {}
              as: AuctionAdmin
              captures: { avail_at_start: "$.data.available_supply" }
            - *c_get_rounds
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", quantity: 2 }
              as: Bidder
              as_user_id: "${w1_id}"
            - *c_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 0 }
              as: Bidder
              as_user_id: "${w1_id}"
            - *c_complete
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/auctions/${auction_id}"
              payload: {}
              as: AuctionAdmin
              captures: { avail_after_grant: "$.data.available_supply" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/auctions/${auction_id}"
              payload: {}
              as: AuctionAdmin
              captures: { avail_after_cancel: "$.data.available_supply" }
            - call: "GET /spectrum-auctions/licenses"
              payload: { auction_id: "${auction_id}" }
              as: AuctionAdmin
          assert:
            - "avail_at_start shows (PEA002, CATEGORY_A) available == 2"
            - "avail_after_grant shows available == 0 (forward action consumed both units; 2 non-terminal licenses + 0 available == 2)"
            - "both licenses were created at the 2026-09-16 clock read with payment_deadline 2026-10-16 (PAYMENT_DEADLINE_DAYS 30)"
            - "avail_after_cancel shows available == 2 (compensating cancellation returned both units; 0 non-terminal + 2 available == 2)"
            - "both licenses are CANCELLED, and the holder's upfront (25,000,000,000) moved entirely to upfront_forfeited_cents"
            - "Auction.${auction_id}.forfeited_deposits_cents == 25000000000"
