            - "second SUSPEND/REINSTATE loop also succeeds (no loop cap)"
            - "Subscription.${sub_id}.service_status == ACTIVE after the second REINSTATE cascade"

      - name: invoice_reissue_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DRAFT
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Cyclic machine on Invoice (distinct entity): ISSUED -> DRAFT via REISSUE clears
          issued_at, and DRAFT -> ISSUE re-stamps it — a correction loop unavailable in a
          linear pipeline.
        test_recipe:
          setup: ["ACTIVE STANDARD subscription; DRAFT invoice for 2026-08-03..2026-08-10"]
          setup_api_calls:
