          setup:
            - "Property HTL-SFO with required_image_count 5; room type KING with master_description_hash 'kingv1' and master_image_count 5."
            - "Channel OTA1 with requires_content_parity true (schema default) and a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000."
            - "One mapping BAR x OTA1 x KING created with the correct hash 'kingv1' but only 4 images, then VERIFIED (verification does not read parity), so mapping_state == VERIFIED and parity_state == OUT_OF_PARITY."
            - "Promotion MEMBER10 (MEMBER_RATE, PERCENT 1000, 2026-09-01..2026-09-30) exists in distribution_status NOT_LOADED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
