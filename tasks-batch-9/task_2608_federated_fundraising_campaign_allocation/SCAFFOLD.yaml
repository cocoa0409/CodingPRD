  # ------------------------------------------------- employer partnerships ----
  - method: POST
    path: "/fundraising/employers"
    description: "Register a workplace campaign partner. status is computed at creation: ACTIVE when partnership_signed is true, otherwise PROSPECT."
    roles: [UnitedFundAdmin]
    code: 201
    input: [legal_name, employee_count, "payroll_periods_per_year?", "historical_shrinkage_rate_bps?", "partnership_signed?"]
    output: Employer
    side_effects: ["sets status to ACTIVE when partnership_signed is true else PROSPECT", "initialises active_campaign_count to 0"]

  - method: POST
    path: "/fundraising/employers/{id}/activate"
    description: "Countersign the partnership agreement: PROSPECT -> ACTIVE."
    roles: [UnitedFundAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["Employer.status PROSPECT -> ACTIVE", "sets partnership_signed to true", "increments Employer.version by 1"]

  - method: POST
    path: "/fundraising/employers/{id}/coordinators"
    description: "Seat a campaign coordinator at an employer. The returned id is the X-User-ID a CampaignCoordinator acts under."
    roles: [UnitedFundAdmin]
    code: 201
    input: [full_name, email, "coordinator_role?"]
    output: CampaignCoordinator
    side_effects: ["creates CampaignCoordinator with status ACTIVE", "initialises recorded_pledge_count to 0"]

  # --------------------------------------------------- campaign lifecycle ----
  - method: POST
    path: "/fundraising/campaigns"
    description: "Create a workplace campaign in PLANNED posture. Enforces the employer-scoped solicitation window exclusivity rule (priority 27)."
    roles: [UnitedFundAdmin, CampaignCoordinator]
    code: 201
    input: [employer_id, campaign_year, solicitation_start_date, solicitation_end_date, "loss_reserve_amount?"]
    output: Campaign
    side_effects: ["creates Campaign in posture PLANNED", "zeroes every gross/fee/loss aggregate", "recomputes Employer.active_campaign_count"]

  - method: POST
    path: "/fundraising/campaigns/{id}/open"
    description: "Open solicitation: PLANNED -> OPEN. Requires the employer to be ACTIVE."
    roles: [UnitedFundAdmin, CampaignCoordinator]
    code: 200
    input: []
    output: Campaign
    side_effects: ["Campaign.posture PLANNED -> OPEN", "increments Campaign.version by 1", "recomputes Employer.active_campaign_count"]

  - method: POST
    path: "/fundraising/campaigns/{id}/close-solicitation"
    description: "Close solicitation: OPEN -> SOLICITATION_CLOSED. No further pledges may be recorded, confirmed or amended (priority 11), but remittances and write-offs stay open until reconcile. Runs the PROVISIONAL variant of campaign_pledge_loss_estimate."
    roles: [UnitedFundAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["Campaign.posture OPEN -> SOLICITATION_CLOSED", "stamps solicitation_closed_at from the logical clock", "runs campaign_pledge_loss_estimate PROVISIONAL variant, writing projected_payroll_pledge_total, provisional_estimated_loss and provisional_net_expected_revenue", "increments Campaign.version by 1"]

  - method: POST
    path: "/fundraising/campaigns/{id}/reconcile"
    description: "Reconcile the campaign after remittance: SOLICITATION_CLOSED -> RECONCILED, or -> ESCROW_HOLD when realized_shrinkage_rate_bps exceeds SHRINKAGE_ESCROW_THRESHOLD_BPS. The ESCROW_HOLD branch fires the campaign_escrow_hold cascade."
    roles: [UnitedFundAdmin, FinanceReviewer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["runs campaign_pledge_loss_estimate FINAL variant, writing reserve_absorbed_amount, final_actual_loss, final_net_expected_revenue and realized_shrinkage_rate_bps", "then sets designation_status = LOCKED on every Pledge of the campaign whose designation_status IN {CONFIRMED, AMENDED}", "Campaign.posture SOLICITATION_CLOSED -> RECONCILED when realized_shrinkage_rate_bps <= SHRINKAGE_ESCROW_THRESHOLD_BPS, else -> ESCROW_HOLD", "stamps reconciled_at from the logical clock", "on the ESCROW_HOLD branch: campaign_escrow_hold cascade sets Employer.status to SUSPENDED with suspended_reason ESCROW_HOLD_SHRINKAGE and fans out CampaignCoordinator.status INACTIVE for every coordinator of that employer", "recomputes Employer.active_campaign_count", "increments Campaign.version by 1"]

  # -------------------------------------------------- pledge and designation ----
  - method: POST
    path: "/fundraising/campaigns/{id}/pledges"
    description: "Record a donor pledge inside an OPEN campaign, optionally with designation lines. `designations` is an array of objects, each exactly { agency_id: string, designated_amount: number }; array position fixes designation_sequence 1..N. recorded_by_coordinator_id is taken from X-User-ID when the caller is a CampaignCoordinator. Runs pledge_designation_fee_allocation over the supplied designations."
    roles: [UnitedFundAdmin, CampaignCoordinator]
    code: 201
    input: [donor_reference, giving_method, gross_amount, "designations?"]
    output: Pledge
    side_effects: ["creates Pledge in designation_status DRAFT and collection_status PENDING", "creates one PledgeDesignation per designations[] entry in ACTIVE status with sequential designation_sequence starting at 1", "runs pledge_designation_fee_allocation, writing PledgeDesignation.processing_fee / net_designated_amount and Pledge.designated_amount_total / undesignated_amount / designation_fee_total / net_designated_total", "increments CampaignCoordinator.recorded_pledge_count when recorded by a coordinator"]

  - method: POST
    path: "/fundraising/pledges/{id}/confirm"
    description: "Confirm a pledge: DRAFT|AMENDED -> CONFIRMED. Confirmation folds the pledge into the campaign's confirmed gross aggregates."
    roles: [UnitedFundAdmin, CampaignCoordinator]
    code: 200
    input: []
    output: Pledge
    side_effects: ["Pledge.designation_status DRAFT|AMENDED -> CONFIRMED", "recomputes Campaign.confirmed_gross_total, designated_gross_total, undesignated_gross_total and designation_fee_total", "recomputes Agency.designated_passthrough_ytd for every designated agency", "increments Pledge.version by 1"]

  - method: POST
    path: "/fundraising/pledges/{id}/designations:amend"
    description: "Replace the designation lines of a CONFIRMED pledge (donor changes their mind). `designations` has the same element shape as pledge creation: { agency_id: string, designated_amount: number }. Optimistically concurrent on the Pledge parent via expected_pledge_version. Existing ACTIVE lines become SUPERSEDED and a fresh ACTIVE set is created."
    roles: [UnitedFundAdmin, CampaignCoordinator]
    code: 200
    input: [expected_pledge_version, designations]
    output: Pledge
    side_effects: ["rejects with ERR_STALE_VERSION (412) when expected_pledge_version does not equal the pledge's current version", "Pledge.designation_status CONFIRMED -> AMENDED", "sets status SUPERSEDED on every currently ACTIVE PledgeDesignation of the pledge", "creates the replacement ACTIVE PledgeDesignation set numbered designation_sequence 1..N in request array order", "re-runs pledge_designation_fee_allocation over the new ACTIVE set", "increments Pledge.amend_count by 1", "recomputes Campaign designated/undesignated/fee aggregates and Agency.designated_passthrough_ytd", "increments Pledge.version by 1"]

  - method: POST
    path: "/fundraising/pledges/{id}/collections"
    description: "Record a payroll remittance against a pledge. Moves collection_status PENDING -> PARTIAL, or -> COLLECTED once collected_amount reaches gross_amount."
    roles: [UnitedFundAdmin, FinanceReviewer]
    code: 200
    input: [amount, remitted_on]
    output: Pledge
    side_effects: ["increases Pledge.collected_amount by amount", "Pledge.collection_status PENDING|PARTIAL -> PARTIAL, or -> COLLECTED when collected_amount equals gross_amount", "distributes the remittance across ACTIVE PledgeDesignation.collected_designated_amount in designation_sequence order", "increments Pledge.version by 1"]

  - method: POST
    path: "/fundraising/pledges/{id}/write-off"
    description: "Write off an uncollectable payroll pledge, firing the pledge_write_off cascade (depth 3: pledge -> designation lines -> agency passthrough ledger)."
    roles: [UnitedFundAdmin, FinanceReviewer]
    code: 200
    input: [reason_code]
    output: Pledge
    side_effects: ["Pledge.collection_status PENDING|PARTIAL -> WRITTEN_OFF", "sets Pledge.uncollected_amount to gross_amount minus collected_amount and stores write_off_reason_code", "cascade link 2: sets status UNCOLLECTED on every ACTIVE PledgeDesignation of the pledge", "cascade link 3: recomputes Agency.designated_passthrough_ytd for every affected agency", "increments Pledge.version by 1"]

  # ------------------------------------ agency membership and financial review ----
  - method: POST
    path: "/fundraising/agencies"
    description: "Admit a candidate member agency in APPLICANT membership_status."
    roles: [UnitedFundAdmin]
    code: 201
    input: [legal_name, ein, primary_priority_area]
    output: Agency
    side_effects: ["creates Agency in membership_status APPLICANT", "initialises latest_standing_score, designated_passthrough_ytd, open_review_count and probation_count to 0 and outcome_report_delinquent to false"]

  - method: POST
    path: "/fundraising/agencies/{id}/reviews"
    description: "File a self-reported financial review packet. Runs the PRELIMINARY variant of agency_financial_standing_score and moves the agency into UNDER_FINANCIAL_REVIEW."
    roles: [UnitedFundAdmin, FinanceReviewer, AgencyRepresentative]
    code: 201
    input: [fiscal_year, program_expense_ratio, admin_expense_ratio, months_operating_reserve, governance_checklist_passed_count, audit_opinion]
    output: AgencyReview
    side_effects: ["creates AgencyReview in status PENDING with review_basis SELF_REPORTED", "runs agency_financial_standing_score PRELIMINARY variant, writing preliminary_score", "Agency.membership_status APPLICANT|GOOD_STANDING|PROBATION -> UNDER_FINANCIAL_REVIEW", "increments Agency.open_review_count by 1", "increments Agency.version by 1"]

  - method: POST
    path: "/fundraising/agencies/{id}/reviews/{review_id}/certify"
    description: "Certify a filed review against audited figures. Runs the CERTIFIED variant of agency_financial_standing_score (which may apply RESTATEMENT_PENALTY) and drives the agency to GOOD_STANDING, PROBATION or SUSPENDED_MEMBERSHIP. The PROBATION branch fires the agency_probation cascade (depth 4)."
    roles: [UnitedFundAdmin, FinanceReviewer]
    code: 200
    input: [audited_program_expense_ratio, audited_admin_expense_ratio, audited_months_operating_reserve]
    output: AgencyReview
    side_effects: ["cascade link 1: AgencyReview.status PENDING -> CERTIFIED with review_basis AUDITED", "runs agency_financial_standing_score CERTIFIED variant, writing certified_score, restatement_penalty_applied and standards_met", "cascade link 2: sets Agency.membership_status to GOOD_STANDING when certified_score >= STANDARDS_PASS_SCORE, PROBATION when >= PROBATION_FLOOR_SCORE, else SUSPENDED_MEMBERSHIP; writes latest_standing_score; increments probation_count on the PROBATION branch; decrements open_review_count", "cascade link 3 (PROBATION or SUSPENDED_MEMBERSHIP branch): every AllocationRequest of that agency in SUBMITTED or UNDER_PANEL_REVIEW moves to SUSPENDED_REVIEW with status_before_suspension recorded", "cascade link 4: recomputes AllocationCycle.suspended_request_count and suspended_request_ratio for each affected cycle; a ratio >= CYCLE_RESTRICT_RATIO drives cycle posture OPEN -> RESTRICTED and sets awards_blocked to true", "increments Agency.version by 1"]

  - method: POST
    path: "/fundraising/agencies/{id}/reinstate"
    description: "Lift probation: PROBATION -> GOOD_STANDING once no review is open. Restores every SUSPENDED_REVIEW allocation request of the agency to its status_before_suspension and re-derives the affected cycles' restriction ratio."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 200
    input: [justification]
    output: Agency
    side_effects: ["Agency.membership_status PROBATION -> GOOD_STANDING", "restores every SUSPENDED_REVIEW AllocationRequest of the agency to status_before_suspension and clears status_before_suspension", "recomputes AllocationCycle.suspended_request_count and suspended_request_ratio; a ratio below CYCLE_RESTRICT_RATIO drives cycle posture RESTRICTED -> OPEN and clears awards_blocked", "increments Agency.version by 1"]

  # ---------------------------------------------------- panel and cycle setup ----
  - method: POST
    path: "/fundraising/panelists"
    description: "Register a volunteer review panelist. The returned id is the X-User-ID a VolunteerPanelist acts under."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 201
    input: [full_name, email, expertise_area]
    output: Panelist
    side_effects: ["creates Panelist with submitted_score_count and site_visit_count at 0"]

  - method: POST
    path: "/fundraising/allocation-cycles"
    description: "Open a community impact fund allocation cycle in DRAFT posture, seeded with the undesignated pool carried over from reconciled campaigns."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 201
    input: [cycle_year, focus_priority_area, opening_undesignated_pool, max_award_per_agency, request_window_start, request_window_end]
    output: AllocationCycle
    side_effects: ["creates AllocationCycle in posture DRAFT", "sets available_undesignated_pool to opening_undesignated_pool", "zeroes awarded_total, submitted_request_count, suspended_request_count and suspended_request_ratio; awards_blocked false"]

  - method: POST
    path: "/fundraising/allocation-cycles/{id}/panel-assignments"
    description: "Seat a volunteer panelist on a cycle, optionally recording a declared conflict of interest."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 201
    input: [panelist_id, "conflict_declared?", "assignment_role?"]
    output: PanelAssignment
    side_effects: ["creates PanelAssignment with submitted_score_count 0", "rejects a second seat for the same panelist on the same cycle with ERR_DUPLICATE_PANEL_SCORE (409)"]

  - method: POST
    path: "/fundraising/allocation-cycles/{id}/open"
    description: "Open the cycle for agency requests: DRAFT -> OPEN. Requires at least one conflict-free panel seat."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 200
    input: []
    output: AllocationCycle
    side_effects: ["AllocationCycle.posture DRAFT -> OPEN", "increments AllocationCycle.version by 1"]

  - method: POST
    path: "/fundraising/allocation-cycles/{id}/freeze"
    description: "Freeze the cycle: OPEN|RESTRICTED -> FROZEN (terminal). No further submissions, scores, or awards."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 200
    input: []
    output: AllocationCycle
    side_effects: ["AllocationCycle.posture OPEN|RESTRICTED -> FROZEN", "sets awards_blocked to true", "increments AllocationCycle.version by 1"]

  # --------------------------------------------- allocation request lifecycle ----
  - method: POST
    path: "/fundraising/allocation-requests"
    description: "Draft an allocation request from a member agency against a cycle."
    roles: [UnitedFundAdmin, AgencyRepresentative, AllocationsDirector]
    code: 201
    input: [cycle_id, agency_id, requested_amount, priority_area, narrative_summary]
    output: AllocationRequest
    side_effects: ["creates AllocationRequest in status DRAFT", "zeroes eligible_score_count, composite_score and the three award components"]

  - method: POST
    path: "/fundraising/allocation-requests/{id}/submit"
    description: "Submit the request for panel review: DRAFT -> SUBMITTED. Gated on agency good standing, outcome-report compliance, the cycle request window, and the REQUEST_CAP_MULTIPLE ceiling."
    roles: [UnitedFundAdmin, AgencyRepresentative]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["AllocationRequest.status DRAFT -> SUBMITTED", "stamps submitted_at from the logical clock", "increments AllocationCycle.submitted_request_count by 1", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/fundraising/allocation-requests/{id}/scores"
    description: "File one volunteer panelist's three-dimension score. panelist_id is taken from X-User-ID. Computes the weighted_score and moves the request SUBMITTED -> UNDER_PANEL_REVIEW on the first score."
    roles: [VolunteerPanelist]
    code: 201
    input: [priority_alignment_score, outcome_evidence_score, capacity_score]
    output: PanelScore
    side_effects: ["creates PanelScore with panelist_id from X-User-ID and eligible true", "runs the per-score weighting step of request_panel_composite_score, writing weighted_score", "AllocationRequest.status SUBMITTED -> UNDER_PANEL_REVIEW on the first score", "increments Panelist.submitted_score_count and PanelAssignment.submitted_score_count", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/fundraising/allocation-requests/{id}/finalize-review"
    description: "Close panel review: UNDER_PANEL_REVIEW -> PANEL_APPROVED or PANEL_DECLINED. Runs the trimmed-mean aggregation of request_panel_composite_score against PANEL_QUORUM and PANEL_APPROVAL_THRESHOLD. Accepted from SUBMITTED as well, where the eligible set is necessarily empty and the call fails with ERR_NO_ELIGIBLE_SCORES (422)."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["marks the trimmed high/low scores eligible false when eligible_score_count >= TRIM_MIN_COUNT", "runs request_panel_composite_score, writing eligible_score_count and composite_score", "AllocationRequest.status UNDER_PANEL_REVIEW -> PANEL_APPROVED when composite_score >= PANEL_APPROVAL_THRESHOLD, else -> PANEL_DECLINED", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/fundraising/allocation-cycles/{id}/awards"
    description: "Award an approved request out of the community impact fund. Optimistically concurrent on the AllocationCycle parent via expected_allocation_cycle_version. Runs community_impact_fund_allocation to split the award into base_award, designation_offset and strategic_supplement."
    roles: [AllocationsDirector]
    code: 200
    input: [request_id, expected_allocation_cycle_version]
    output: AllocationRequest
    side_effects: ["rejects with ERR_STALE_VERSION (412) when expected_allocation_cycle_version does not equal the cycle's current version", "runs community_impact_fund_allocation, writing AllocationRequest.base_award, designation_offset, strategic_supplement and total_award", "AllocationRequest.status PANEL_APPROVED -> AWARDED", "stamps awarded_at and sets outcome_report_due_date to awarded_at date plus OUTCOME_REPORT_DUE_DAYS", "decreases AllocationCycle.available_undesignated_pool and increases awarded_total by total_award", "increments AllocationCycle.version by 1", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/fundraising/allocation-requests/{id}/rescind-award"
    description: "Compensating transition: AWARDED -> PANEL_APPROVED. Returns the exact total_award to the cycle pool and clears every award component, so the cycle conserves opening_undesignated_pool = available_undesignated_pool + awarded_total."
    roles: [AllocationsDirector]
    code: 200
    input: [reason_code]
    output: AllocationRequest
    side_effects: ["AllocationRequest.status AWARDED -> PANEL_APPROVED", "increases AllocationCycle.available_undesignated_pool and decreases awarded_total by the rescinded total_award", "zeroes base_award, designation_offset, strategic_supplement and total_award and clears awarded_at and outcome_report_due_date", "increments AllocationCycle.version by 1", "increments AllocationRequest.version by 1"]

  # ---------------------------------------- outcome reporting and site visits ----
  - method: POST
    path: "/fundraising/allocation-requests/{id}/outcome-reports"
    description: "File the funded agency's outcome report. Moves the request AWARDED -> REPORTING and runs outcome_report_expenditure_variance."
    roles: [UnitedFundAdmin, AgencyRepresentative]
    code: 201
    input: [reporting_period_end, persons_served, outcome_metric_name, outcome_metric_value, funds_expended]
    output: OutcomeReport
    side_effects: ["creates OutcomeReport in status SUBMITTED with revision_round_count 0", "stamps submitted_at from the logical clock", "runs outcome_report_expenditure_variance, writing expenditure_variance_pct", "AllocationRequest.status AWARDED -> REPORTING", "clears Agency.outcome_report_delinquent when no other report of that agency is overdue", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/fundraising/outcome-reports/{id}/site-visit"
    description: "Schedule a monitoring site visit: SUBMITTED -> SITE_VISIT_SCHEDULED. site_visit_panelist_id is taken from X-User-ID. Enforces the SITE_VISIT_BUFFER_DAYS spacing rule on that panelist and the segregation-of-duties bar against panelists who scored the request."
    roles: [VolunteerPanelist]
    code: 200
    input: [site_visit_window_start, site_visit_window_end]
    output: OutcomeReport
    side_effects: ["OutcomeReport.status SUBMITTED -> SITE_VISIT_SCHEDULED", "sets site_visit_panelist_id from X-User-ID and stores the window", "increments Panelist.site_visit_count by 1", "increments OutcomeReport.version by 1"]

  - method: POST
    path: "/fundraising/outcome-reports/{id}/site-visit/complete"
    description: "Record site visit findings: SITE_VISIT_SCHEDULED -> SITE_VISIT_COMPLETED. Only the assigned panelist may complete it."
    roles: [VolunteerPanelist]
    code: 200
    input: [site_visit_findings]
    output: OutcomeReport
    side_effects: ["OutcomeReport.status SITE_VISIT_SCHEDULED -> SITE_VISIT_COMPLETED", "stores site_visit_findings", "increments OutcomeReport.version by 1"]

  - method: POST
    path: "/fundraising/outcome-reports/{id}/accept"
    description: "Accept the report: SITE_VISIT_COMPLETED -> ACCEPTED, closing the funded request as CLOSED_SATISFIED."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["OutcomeReport.status SITE_VISIT_COMPLETED -> ACCEPTED", "AllocationRequest.status REPORTING -> CLOSED_SATISFIED", "increments OutcomeReport.version by 1", "increments AllocationRequest.version by 1"]

  - method: POST
    path: "/fundraising/outcome-reports/{id}/request-revision"
    description: "Send the report back to the agency: SITE_VISIT_COMPLETED -> REVISION_REQUESTED. Refused once revision_round_count has reached MAX_REVISION_ROUNDS."
    roles: [UnitedFundAdmin, AllocationsDirector]
    code: 200
    input: [revision_note]
    output: OutcomeReport
    side_effects: ["OutcomeReport.status SITE_VISIT_COMPLETED -> REVISION_REQUESTED", "increments revision_round_count by 1", "increments OutcomeReport.version by 1"]

  - method: POST
    path: "/fundraising/outcome-reports/{id}/resubmit"
    description: "Agency resubmits corrected figures: REVISION_REQUESTED -> SUBMITTED (cyclic). Clears the previous site visit assignment and re-runs outcome_report_expenditure_variance."
    roles: [UnitedFundAdmin, AgencyRepresentative]
    code: 200
    input: [persons_served, outcome_metric_value, funds_expended]
    output: OutcomeReport
    side_effects: ["OutcomeReport.status REVISION_REQUESTED -> SUBMITTED", "overwrites persons_served, outcome_metric_value and funds_expended", "clears site_visit_panelist_id, site_visit_window_start, site_visit_window_end and site_visit_findings", "re-stamps submitted_at from the logical clock", "re-runs outcome_report_expenditure_variance", "increments OutcomeReport.version by 1"]

  # ------------------------------------------------- test-driving endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock to any instant, so deadline, window and buffer rules are deterministic. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time."
    roles: [UnitedFundAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock used by every timestamp, window and deadline rule", "re-derives Agency.outcome_report_delinquent for any agency whose outcome_report_due_date has now passed without an ACCEPTED report"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the six declared roles, or X-User-ID missing for an entity_backed role."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles set."
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "An entity_backed caller acts on a resource it does not own: a coordinator outside the campaign's employer, an agency representative on another agency's request or report, or a panelist completing a site visit assigned to someone else."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A panelist who filed a PanelScore on the request attempts to schedule the monitoring site visit for that request's outcome report."

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, enum value outside the declared set, numeric value outside the declared range, or money value with more than 2 decimal places."

  # --- not found ---
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "No Employer exists with the referenced id."
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "No Campaign exists with the referenced id."
  - id: ERR_PLEDGE_NOT_FOUND
    http: 404
    condition: "No Pledge exists with the referenced id."
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "No Agency exists with the referenced id, including any designations[].agency_id target."
  - id: ERR_AGENCY_REVIEW_NOT_FOUND
    http: 404
    condition: "No AgencyReview exists with the referenced review_id."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No AllocationCycle exists with the referenced id."
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "No AllocationRequest exists with the referenced id or request_id."
  - id: ERR_PANELIST_NOT_FOUND
    http: 404
    condition: "No Panelist exists with the referenced id or panelist_id."
  - id: ERR_OUTCOME_REPORT_NOT_FOUND
    http: 404
    condition: "No OutcomeReport exists with the referenced id."

  # --- concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_pledge_version does not equal the Pledge's current version on designation amendment, or expected_allocation_cycle_version does not equal the AllocationCycle's current version on award."

  # --- state ---
  - id: ERR_EMPLOYER_INVALID_STATE
    http: 409
    condition: "Employer activation attempted from a status other than PROSPECT."
  - id: ERR_EMPLOYER_NOT_ACTIVE
    http: 409
    condition: "A campaign is opened while its employer is PROSPECT or SUSPENDED."
  - id: ERR_CAMPAIGN_NOT_OPEN
    http: 409
    condition: "Pledge recording, confirmation or designation amendment attempted while the campaign posture is not OPEN."
  - id: ERR_CAMPAIGN_INVALID_STATE
    http: 409
    condition: "A campaign transition or a pledge collection/write-off is attempted from a campaign posture the transition does not start from."
  - id: ERR_PLEDGE_NOT_CONFIRMED
    http: 409
    condition: "A pledge operation is attempted from a designation_status the transition does not start from (confirm from CONFIRMED/LOCKED, amend from DRAFT/LOCKED, or collection/write-off on a DRAFT or LOCKED pledge)."
  - id: ERR_PLEDGE_COLLECTION_TERMINAL
    http: 409
    condition: "A collection or write-off is attempted on a pledge whose collection_status is already COLLECTED or WRITTEN_OFF."
  - id: ERR_REVIEW_ALREADY_CERTIFIED
    http: 409
    condition: "Certification attempted on an AgencyReview whose status is already CERTIFIED."
  - id: ERR_REVIEW_AGENCY_MISMATCH
    http: 409
    condition: "The {review_id} in the path does not belong to the {id} agency in the same path."
  - id: ERR_AGENCY_MEMBERSHIP_TERMINAL
    http: 409
    condition: "A review, certification or reinstatement is attempted on a SUSPENDED_MEMBERSHIP agency, or reinstatement is attempted from a membership_status other than PROBATION or while open_review_count is greater than 0."
  - id: ERR_CYCLE_FROZEN
    http: 409
    condition: "Any allocation write (panel seating, submission, scoring, review finalization, award) is attempted on a FROZEN cycle."
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "Request submission or panel scoring is attempted while the cycle posture is DRAFT, or cycle opening is attempted from a posture other than DRAFT."
  - id: ERR_CYCLE_RESTRICTED
    http: 409
    condition: "An award is attempted on a cycle whose posture is RESTRICTED (awards_blocked true) because the agency_probation cascade pushed suspended_request_ratio to at least CYCLE_RESTRICT_RATIO."
  - id: ERR_REQUEST_INVALID_STATE
    http: 409
    condition: "An allocation request operation is attempted from a status it does not accept (see validation priority 20), including any write against a SUSPENDED_REVIEW request. finalize-review is the one operation that accepts two entry statuses, SUBMITTED and UNDER_PANEL_REVIEW."
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "An outcome report transition is attempted from a status the transition does not start from."
  - id: ERR_AWARD_ALREADY_REPORTED
    http: 409
    condition: "Award rescission is attempted after an OutcomeReport already exists for the request."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A revision is requested on an outcome report whose revision_round_count already equals MAX_REVISION_ROUNDS."
  - id: ERR_CAMPAIGN_WINDOW_OVERLAP
    http: 409
    condition: "The new campaign's half-open solicitation window intersects an existing non-ESCROW_HOLD campaign window of the same employer; touching endpoints do not intersect."
  - id: ERR_SITE_VISIT_BUFFER_CONFLICT
    http: 409
    condition: "The requested closed site-visit window is within SITE_VISIT_BUFFER_DAYS calendar days of another window already held by the same panelist."
  - id: ERR_DUPLICATE_DONOR_REFERENCE
    http: 409
    condition: "donor_reference already exists on another pledge of the same campaign."
  - id: ERR_DUPLICATE_PANEL_SCORE
    http: 409
    condition: "The panelist already filed a PanelScore for this AllocationRequest, or already holds a PanelAssignment on this cycle."
  - id: ERR_DUPLICATE_REQUEST_FOR_CYCLE
    http: 409
    condition: "The agency already holds an AllocationRequest on this cycle in a status other than PANEL_DECLINED."

  # --- business ---
  - id: ERR_PANELIST_CONFLICT_DECLARED
    http: 422
    condition: "A panelist whose PanelAssignment on the cycle carries conflict_declared true attempts to file a score on any request of that cycle."
  - id: ERR_PANELIST_NOT_ASSIGNED
    http: 422
    condition: "The acting panelist holds no PanelAssignment on the cycle of the target request."
  - id: ERR_AGENCY_NOT_IN_GOOD_STANDING
    http: 422
    condition: "The requesting agency's membership_status is not GOOD_STANDING at submission time."
  - id: ERR_OUTCOME_REPORT_DELINQUENT
    http: 422
    condition: "The requesting agency carries outcome_report_delinquent true because a funded request passed its outcome_report_due_date without an ACCEPTED report."
  - id: ERR_DESIGNATION_TARGET_INELIGIBLE
    http: 422
    condition: "A designations[].agency_id targets an agency whose membership_status is APPLICANT, UNDER_FINANCIAL_REVIEW or SUSPENDED_MEMBERSHIP."
  - id: ERR_DESIGNATION_BELOW_MINIMUM
    http: 422
    condition: "A designations[].designated_amount is below MIN_DESIGNATION_AMOUNT."
  - id: ERR_DESIGNATION_EXCEEDS_GROSS
    http: 422
    condition: "The sum of designations[].designated_amount exceeds the pledge's gross_amount."
  - id: ERR_SITE_VISIT_WINDOW_INVALID
    http: 422
    condition: "site_visit_window_start precedes the report's submission date, the window end precedes its start, or the window end exceeds submission date plus SITE_VISIT_MAX_LEAD_DAYS."
  - id: ERR_REQUEST_WINDOW_CLOSED
    http: 422
    condition: "The logical clock date falls outside the cycle's half-open request window at submission time."
  - id: ERR_NO_ELIGIBLE_SCORES
    http: 422
    condition: "Review finalization is attempted with an empty eligible PanelScore set."
  - id: ERR_PANEL_QUORUM_NOT_MET
    http: 422
    condition: "Review finalization is attempted with a non-empty eligible PanelScore set smaller than PANEL_QUORUM."
  - id: ERR_PANEL_NOT_SEATED
    http: 422
    condition: "Cycle opening is attempted with no PanelAssignment whose conflict_declared is false."
  - id: ERR_PAYROLL_METHOD_UNAVAILABLE
    http: 422
    condition: "A PAYROLL_DEDUCTION pledge is recorded at an employer whose payroll_periods_per_year is 0."
  - id: ERR_COLLECTION_EXCEEDS_OUTSTANDING
    http: 422
    condition: "The remitted amount exceeds the pledge's outstanding balance (gross_amount minus collected_amount)."
  - id: ERR_CAMPAIGN_NOT_FULLY_REMITTED
    http: 422
    condition: "Reconciliation is attempted while some CONFIRMED or AMENDED pledge of the campaign is still collection_status PENDING."
  - id: ERR_AWARD_EXCEEDS_AGENCY_CAP
    http: 422
    condition: "requested_amount exceeds cycle.max_award_per_agency multiplied by REQUEST_CAP_MULTIPLE at submission time."
  - id: ERR_POOL_INSUFFICIENT
    http: 422
    condition: "The computed total_award_unclamped exceeds the cycle's available_undesignated_pool."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UnitedFundAdmin
    description: "United fundraising organization staff operator with the broadest administrative surface: employer partnerships, campaign lifecycle, agency admission, panel and cycle setup."
    identity: opaque
    exclusive_operations:
      - "POST /fundraising/employers"
      - "POST /fundraising/employers/{id}/activate"
      - "POST /fundraising/employers/{id}/coordinators"
      - "POST /fundraising/agencies"
      - "POST /fundraising/campaigns/{id}/close-solicitation"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /fundraising/campaigns"
      - "POST /fundraising/campaigns/{id}/open"
      - "POST /fundraising/campaigns/{id}/reconcile"
      - "POST /fundraising/campaigns/{id}/pledges"
      - "POST /fundraising/pledges/{id}/confirm"
      - "POST /fundraising/pledges/{id}/designations:amend"
      - "POST /fundraising/pledges/{id}/collections"
      - "POST /fundraising/pledges/{id}/write-off"
      - "POST /fundraising/agencies/{id}/reviews"
      - "POST /fundraising/agencies/{id}/reviews/{review_id}/certify"
      - "POST /fundraising/agencies/{id}/reinstate"
      - "POST /fundraising/panelists"
      - "POST /fundraising/allocation-cycles"
      - "POST /fundraising/allocation-cycles/{id}/panel-assignments"
      - "POST /fundraising/allocation-cycles/{id}/open"
      - "POST /fundraising/allocation-cycles/{id}/freeze"
      - "POST /fundraising/allocation-requests"
      - "POST /fundraising/allocation-requests/{id}/submit"
      - "POST /fundraising/allocation-requests/{id}/finalize-review"
      - "POST /fundraising/allocation-requests/{id}/outcome-reports"
      - "POST /fundraising/outcome-reports/{id}/accept"
      - "POST /fundraising/outcome-reports/{id}/request-revision"
      - "POST /fundraising/outcome-reports/{id}/resubmit"
      - "all GET endpoints"

  - name: CampaignCoordinator
    description: "Employer-side volunteer who runs the workplace campaign and records donor pledges. X-User-ID is the CampaignCoordinator id, and every pledge write is ownership-checked against the campaign's employer."
    identity: "entity_backed:CampaignCoordinator"
    exclusive_operations: []
    shared_operations:
      - "POST /fundraising/campaigns"
      - "POST /fundraising/campaigns/{id}/open"
      - "POST /fundraising/campaigns/{id}/pledges"
      - "POST /fundraising/pledges/{id}/confirm"
      - "POST /fundraising/pledges/{id}/designations:amend"
      - "all GET endpoints"

  - name: FinanceReviewer
    description: "United fund finance staff responsible for remittance, shrinkage accounting and agency financial review certification."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /fundraising/campaigns/{id}/reconcile"
      - "POST /fundraising/pledges/{id}/collections"
      - "POST /fundraising/pledges/{id}/write-off"
      - "POST /fundraising/agencies/{id}/reviews"
      - "POST /fundraising/agencies/{id}/reviews/{review_id}/certify"
      - "all GET endpoints"

  - name: AgencyRepresentative
    description: "Member agency staff who file financial reviews, allocation requests and outcome reports. X-User-ID is the Agency id, and every write is ownership-checked against that agency."
    identity: "entity_backed:Agency"
    exclusive_operations: []
    shared_operations:
      - "POST /fundraising/agencies/{id}/reviews"
      - "POST /fundraising/allocation-requests"
      - "POST /fundraising/allocation-requests/{id}/submit"
      - "POST /fundraising/allocation-requests/{id}/outcome-reports"
      - "POST /fundraising/outcome-reports/{id}/resubmit"
      - "all GET endpoints"

  - name: VolunteerPanelist
    description: "Community volunteer seated on a cycle's review panel. X-User-ID is the Panelist id. Scoring and site-visit monitoring are exclusive to this role, and the segregation-of-duties rule bars the same panelist from doing both on one request."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /fundraising/allocation-requests/{id}/scores"
      - "POST /fundraising/outcome-reports/{id}/site-visit"
      - "POST /fundraising/outcome-reports/{id}/site-visit/complete"
    shared_operations:
      - "all GET endpoints"

  - name: AllocationsDirector
    description: "Community impact fund steward who seats panels, finalizes panel review, and is the only role that may award or rescind money from the undesignated pool."
    identity: opaque
    exclusive_operations:
      - "POST /fundraising/allocation-cycles/{id}/awards"
      - "POST /fundraising/allocation-requests/{id}/rescind-award"
    shared_operations:
      - "POST /fundraising/agencies/{id}/reinstate"
      - "POST /fundraising/panelists"
      - "POST /fundraising/allocation-cycles"
      - "POST /fundraising/allocation-cycles/{id}/panel-assignments"
      - "POST /fundraising/allocation-cycles/{id}/open"
      - "POST /fundraising/allocation-cycles/{id}/freeze"
      - "POST /fundraising/allocation-requests"
      - "POST /fundraising/allocation-requests/{id}/finalize-review"
      - "POST /fundraising/outcome-reports/{id}/accept"
      - "POST /fundraising/outcome-reports/{id}/request-revision"
      - "all GET endpoints"
