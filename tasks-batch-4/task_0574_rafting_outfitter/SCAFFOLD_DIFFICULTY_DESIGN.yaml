          trigger:
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_b}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_GUIDE_DOUBLE_BOOKED"

      - name: shuttle_vehicle_buffer_conflict_within_30_minutes
        grounds:
          - validations[priority=7]
          - errors[ERR_SHUTTLE_BUFFER_CONFLICT]
          - entities.ShuttleRun.fields.depart_time
          - entities.ShuttleRun.fields.arrive_time
        distinguishing_aspect: |
          Buffered-adjacency interval semantics on the ShuttleVehicle resource (distinct from the guide's pure
          overlap): a run departing 15 minutes after the prior run's arrival is rejected because the gap (15)
          is < SHUTTLE_BUFFER_MINUTES=30 -> ERR_SHUTTLE_BUFFER_CONFLICT.
        test_recipe:
          setup:
            - "A shuttle vehicle has a SCHEDULED run arriving 2026-07-02T16:00Z; a new run on the same vehicle departs 2026-07-02T16:15Z (gap=15 min)."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "ShuttleTrip", difficulty_class: "CLASS_III", trip_date: "2026-07-02T09:00:00Z", end_time: "2026-07-02T15:00:00Z", put_in_location: "S1", take_out_location: "S2", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /shuttle-vehicles"
              payload: { name: "Van 1", seat_capacity: 14 }
              as: OutfitterManager
              captures: { veh_id: $.data.id }
            - call: "POST /shuttle-runs"
              payload: { trip_id: "${trip_id}", shuttle_vehicle_id: "${veh_id}", direction: "FROM_TAKE_OUT", depart_time: "2026-07-02T15:00:00Z", arrive_time: "2026-07-02T16:00:00Z" }
              as: OutfitterManager
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /shuttle-runs"
              payload: { trip_id: "${trip_id}", shuttle_vehicle_id: "${veh_id}", direction: "TO_PUT_IN", depart_time: "2026-07-02T16:15:00Z", arrive_time: "2026-07-02T17:00:00Z" }
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_SHUTTLE_BUFFER_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: gear_serviceable_count_conserved_across_assign_release
        grounds:
          - calculations.serviceable_gear_count
          - state_machines.GearItem.AVAILABLE_to_ASSIGNED
          - state_machines.GearItem.ASSIGNED_to_AVAILABLE
          - state_machines.GearAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = serviceable_gear_count(PFD): assigning then releasing a single PFD leaves the
          item AVAILABLE and the available-PFD count identical to the pre-assign value (1), with no drift.
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 guide; exactly one PFD (AVAILABLE); a guest with an ASSIGNED PFD gear assignment."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Klamath", difficulty_class: "CLASS_III", trip_date: "2026-07-03T09:00:00Z", end_time: "2026-07-03T15:00:00Z", put_in_location: "K1", take_out_location: "K2", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "POST /gear-items"
              payload: { gear_type: "PFD", size_label: "L", min_weight_lbs: 100, max_weight_lbs: 250 }
              as: OutfitterManager
              captures: { pfd_id: $.data.id }
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Kim", age: 30, weight_lbs: 175 }
              as: Reservationist
              captures: { guest_id: $.data.id }
            - call: "POST /gear-assignments"
              payload: { gear_item_id: "${pfd_id}", guest_id: "${guest_id}", trip_id: "${trip_id}" }
              as: Reservationist
              captures: { gasg_id: $.data.id }
          trigger:
            - call: "POST /gear-assignments/${gasg_id}/release"
              payload: {}
              as: Reservationist
            - call: "GET /gear-items?gear_type=PFD&status=AVAILABLE"
              payload: {}
              as: Reservationist
              captures: { avail_total: "$.data[0].id" }
          assert:
            - "GearAssignment.${gasg_id}.status == RELEASED"
            - "GearItem.${pfd_id}.status == AVAILABLE"
            - "GET /gear-items?gear_type=PFD&status=AVAILABLE total_count == 1 (equal to the pre-assign available count)"

      - name: deposits_held_conserved_across_pay_and_refund
        grounds:
          - calculations.deposits_held_cents
          - state_machines.Reservation.UNPAID_to_DEPOSIT_PAID
          - state_machines.Reservation.DEPOSIT_PAID_to_REFUNDED
          - entities.RiverTrip.fields.deposits_held_cents
        distinguishing_aspect: |
          Conserved quantity = RiverTrip.deposits_held_cents (money): paying a 3000-cent deposit raises it to
          3000, and cancelling the reservation refunds exactly 3000, returning deposits_held_cents to 0 with no
          drift (a different conserved quantity than the gear count invariant).
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 guide; a Reservation (deposit_cents=3000) that is CONFIRMED and DEPOSIT_PAID, so trip.deposits_held_cents == 3000."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Rio Grande", difficulty_class: "CLASS_III", trip_date: "2026-07-04T09:00:00Z", end_time: "2026-07-04T15:00:00Z", put_in_location: "Taos", take_out_location: "Box", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
          trigger:
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { held_before: $.data.deposits_held_cents }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Reservationist
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { held_after: $.data.deposits_held_cents }
          assert:
            - "Before cancel: RiverTrip.${trip_id}.deposits_held_cents == 3000"
            - "After cancel: RiverTrip.${trip_id}.deposits_held_cents == 0"
            - "Reservation.${res_id}.payment_status == REFUNDED"
