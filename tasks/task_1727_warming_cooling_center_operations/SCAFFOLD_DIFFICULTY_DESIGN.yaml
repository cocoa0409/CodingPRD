# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Warming & Cooling Center Operations — 9 rules x >=2 instances = 19 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bed_nights_provisional_exceeds_final_for_in_progress_stay
        grounds:
          - calculations.bed_nights
          - entities.GuestStay.fields.bed_nights_provisional
          - entities.GuestStay.fields.bed_nights_final
        distinguishing_aspect: |
          Dual-variant on the GuestStay domain: for the identical stay record, the provisional
          variant credits the in-progress current night (midnight crossings + 1 while CHECKED_IN)
          while the final variant stays null until checkout and then counts only fully crossed
          00:00Z boundaries — 2 vs null while checked in, then 1 vs 1 after checkout.
        test_recipe:
          setup:
            - "COOLING episode ACTIVE with one OPEN SiteActivation (bed_capacity 4, pet 2, locker 4)"
            - "Guest g1 checked in at 2026-08-10T20:00:00Z; logical clock later at 2026-08-11T21:00:00Z"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 100.5 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 96.0, heat_index_f: 100.2 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 96.0, heat_index_f: 100.8 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 97.0, heat_index_f: 100.1 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 2, locker_capacity: 4 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead Two", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead2: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${lead1}", role_on_shift: "SITE_LEAD", start_at: "2026-08-10T22:00:00Z", end_at: "2026-08-11T06:00:00Z" }
              as: SiteLead
              as_user_id: "${lead2}"
              captures: { sh: $.data.id }
            - { call: "POST /api/shifts/${sh}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead2}" }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - { call: "POST /api/site-activations/${sa}/open", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T20:00:00Z" }, as: EOCManager }
            - call: "POST /api/guests"
              payload: { alias: "guest-one" }
              as: IntakeStaff
              as_user_id: "${lead2}"
              captures: { g1: $.data.id }
            - call: "POST /api/site-activations/${sa}/stays"
              payload: { guest_id: "${g1}" }
              as: IntakeStaff
              as_user_id: "${lead2}"
              captures: { stay: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T21:00:00Z" }, as: EOCManager }
          trigger:
            - call: "GET /api/stays/${stay}"
              as: IntakeStaff
              as_user_id: "${lead2}"
              captures: { prov: $.data.bed_nights_provisional, fin: $.data.bed_nights_final }
            - call: "POST /api/stays/${stay}/check-out"
              payload: {}
              as: IntakeStaff
              as_user_id: "${lead2}"
              captures: { fin_after: $.data.bed_nights_final, prov_after: $.data.bed_nights_provisional }
          assert:
            - "GuestStay.${stay}.bed_nights_provisional == 2 while CHECKED_IN (crossing 2026-08-11T00:00Z plus in-progress night)"
            - "GuestStay.${stay}.bed_nights_final == null while CHECKED_IN"
            - "After check-out at 2026-08-11T21:00:00Z: bed_nights_final == 1 and bed_nights_provisional == 1"
      - name: supply_stock_projected_includes_pledged_on_hand_does_not
        grounds:
          - calculations.supply_stock
          - entities.SiteActivation.fields.meal_stock_on_hand
          - entities.SiteActivation.fields.meal_stock_projected
        distinguishing_aspect: |
          Dual-variant on the Donation/MealService domain (different entity domain from
          bed_nights): for identical donation data, projected stock counts PLEDGED units while
          on_hand counts only RECEIVED — 150 vs 100 with a 50-unit pledge outstanding.
        test_recipe:
          setup:
            - "Episode in STANDBY with one SiteActivation in OPENING (no weather needed)"
            - "Donation A: 50 MEAL PLEDGED; Donation B: 100 MEAL RECEIVED"
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "WARMING", threshold_f: 32.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "Armory", address: "9 Oak Ave", bed_capacity: 10, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/site-activations/${sa}/donations"
              payload: { partner_name: "FoodBank", category: "MEAL", quantity: 50 }
              as: SiteLead
              as_user_id: "${lead1}"
            - call: "POST /api/site-activations/${sa}/donations"
              payload: { partner_name: "Church", category: "MEAL", quantity: 100 }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { don_b: $.data.id }
            - { call: "POST /api/donations/${don_b}/receive", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
          trigger:
            - call: "GET /api/site-activations/${sa}"
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { on_hand: $.data.meal_stock_on_hand, projected: $.data.meal_stock_projected }
          assert:
            - "SiteActivation.${sa}.meal_stock_on_hand == 100"
            - "SiteActivation.${sa}.meal_stock_projected == 150"
  - rule_id: combinatorial_formula
    instances:
      - name: dispatch_assign_nested_min_with_conditional_pet_branch
        grounds:
          - calculations.dispatch_reservation_capacity
        distinguishing_aspect: |
          Mode (a) combinatorial: three independent pools (beds, pet slots, lockers) interact via
          nested min with a conditional branch on has_pets; with beds sufficient (4 >= 4) but
          pets_needed 3 > pet_slots_free 2 the all-or-nothing gate rejects with
          ERR_PET_CAPACITY_EXCEEDED, while an identical 4-rider dispatch without pets succeeds.
        test_recipe:
          setup:
            - "COOLING episode ACTIVE; SiteActivation OPEN with beds 4, pet_capacity 2, locker_capacity 8"
            - "Guests g1 (pet_count 2), g2 (pet_count 1), g3, g4 (no pets); Vehicle seats 6"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 2, locker_capacity: 8 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead Two", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead2: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Outreach One", skills: ["OUTREACH"] }
              as: EOCManager
              captures: { out1: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${lead1}", role_on_shift: "SITE_LEAD", start_at: "2026-08-10T22:00:00Z", end_at: "2026-08-11T06:00:00Z" }
              as: SiteLead
              as_user_id: "${lead2}"
              captures: { sh: $.data.id }
            - { call: "POST /api/shifts/${sh}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead2}" }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - { call: "POST /api/site-activations/${sa}/open", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/guests"
              payload: { alias: "pet-two", has_pets: true, pet_count: 2 }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g1: $.data.id }
            - call: "POST /api/guests"
              payload: { alias: "pet-one", has_pets: true, pet_count: 1 }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g2: $.data.id }
            - call: "POST /api/guests"
              payload: { alias: "plain-three" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g3: $.data.id }
            - call: "POST /api/guests"
              payload: { alias: "plain-four" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g4: $.data.id }
            - call: "POST /api/vehicles"
              payload: { label: "van-1", seats: 6, turnaround_minutes: 30 }
              as: TransportCoordinator
              captures: { veh: $.data.id }
            - call: "POST /api/transport-dispatches"
              payload: { site_activation_id: "${sa}", guest_ids: ["${g1}", "${g2}", "${g3}", "${g4}"], pickup_window_start: "2026-08-10T14:00:00Z", pickup_window_end: "2026-08-10T15:00:00Z", has_pets: true }
              as: OutreachWorker
              as_user_id: "${out1}"
              captures: { disp_pets: $.data.id }
            - call: "POST /api/transport-dispatches"
              payload: { site_activation_id: "${sa}", guest_ids: ["${g3}", "${g4}"], pickup_window_start: "2026-08-10T16:00:00Z", pickup_window_end: "2026-08-10T17:00:00Z", has_pets: false }
              as: OutreachWorker
              as_user_id: "${out1}"
              captures: { disp_plain: $.data.id }
          trigger:
            - call: "POST /api/transport-dispatches/${disp_pets}/assign"
              payload: { vehicle_id: "${veh}" }
              as: TransportCoordinator
              captures: { err_pets: $.data.error_id }
            - call: "POST /api/transport-dispatches/${disp_plain}/assign"
              payload: { vehicle_id: "${veh}" }
              as: TransportCoordinator
              captures: { plain_status: $.data.status, plain_reserved: $.data.reserved_bed_count }
          assert:
            - "Pet dispatch assign rejected: error_id == ERR_PET_CAPACITY_EXCEEDED (beds 4 >= 4 pass, pets 3 > 2 fail)"
            - "Plain dispatch assign succeeds: status == ASSIGNED, reserved_bed_count == 2"
            - "GET /api/site-activations/${sa}: reserved_beds == 2, beds_free == 2, occupied_beds == 0"
      - name: meal_planned_round_per_service_then_sum
        grounds:
          - calculations.meal_planned_rounding
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from nested-min): rounding order is pinned as
          round-per-service-then-sum. With attendance 3, per-service ceil gives 4+4+4 = 12;
          the forbidden sum-then-round order would give ceil(3*1.10+3*1.15+3*1.25)=ceil(10.5)=11.
        test_recipe:
          setup:
            - "COOLING episode ACTIVE; SiteActivation OPEN (beds 4); three guests CHECKED_IN so attendance == 3"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead Two", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead2: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${lead1}", role_on_shift: "SITE_LEAD", start_at: "2026-08-10T22:00:00Z", end_at: "2026-08-11T06:00:00Z" }
              as: SiteLead
              as_user_id: "${lead2}"
              captures: { sh: $.data.id }
            - { call: "POST /api/shifts/${sh}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead2}" }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - { call: "POST /api/site-activations/${sa}/open", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/guests"
              payload: { alias: "a" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g1: $.data.id }
            - call: "POST /api/guests"
              payload: { alias: "b" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g2: $.data.id }
            - call: "POST /api/guests"
              payload: { alias: "c" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g3: $.data.id }
            - { call: "POST /api/site-activations/${sa}/stays", payload: { guest_id: "${g1}" }, as: IntakeStaff, as_user_id: "${lead1}" }
            - { call: "POST /api/site-activations/${sa}/stays", payload: { guest_id: "${g2}" }, as: IntakeStaff, as_user_id: "${lead1}" }
            - { call: "POST /api/site-activations/${sa}/stays", payload: { guest_id: "${g3}" }, as: IntakeStaff, as_user_id: "${lead1}" }
          trigger:
            - call: "POST /api/site-activations/${sa}/meal-services"
              payload: { service_date: "2026-08-10T00:00:00Z", meal_period: "BREAKFAST" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { p_breakfast: $.data.planned_meals }
            - call: "POST /api/site-activations/${sa}/meal-services"
              payload: { service_date: "2026-08-10T00:00:00Z", meal_period: "LUNCH" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { p_lunch: $.data.planned_meals }
            - call: "POST /api/site-activations/${sa}/meal-services"
              payload: { service_date: "2026-08-10T00:00:00Z", meal_period: "DINNER" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { p_dinner: $.data.planned_meals }
          assert:
            - "planned_meals BREAKFAST == 4 (ceil(3 * 1.10))"
            - "planned_meals LUNCH == 4 (ceil(3 * 1.15))"
            - "planned_meals DINNER == 4 (ceil(3 * 1.25))"
            - "Daily total == 12 (round-per-service then sum), not 11 (sum then round)"
  - rule_id: non_linear_state_machine
    instances:
      - name: episode_double_cycle_standby_standdown_and_deactivation_resurge
        grounds:
          - state_machines.Episode.STANDBY_to_ACTIVATING
          - state_machines.Episode.ACTIVATING_to_STANDBY
          - state_machines.Episode.DEACTIVATING_to_ACTIVE
        distinguishing_aspect: |
          Episode machine is cyclic, not a pipeline: STANDBY->ACTIVATING->STANDBY (stand-down on
          breach-run reset) and later ACTIVE->DEACTIVATING->ACTIVE (re-surge on re-breach), with
          the re-surge also flipping DRAINING SiteActivations back to OPEN while CANCELLED stays
          stay cancelled (asymmetric cycle).
        test_recipe:
          setup:
            - "COOLING episode, threshold 100.0, sustained 1h; one site with full overnight lead coverage"
            - "Breach runs and resets drive the episode through both cycles"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T05:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/episodes/${ep}/evaluate"
              payload: {}
              as: EOCManager
              captures: { st1: $.data.status }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:15:00Z", temp_f: 90.0, heat_index_f: 90.0 }, as: EOCManager }
            - call: "POST /api/episodes/${ep}/evaluate"
              payload: {}
              as: EOCManager
              captures: { st2: $.data.status }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T08:00:00Z", temp_f: 96.0, heat_index_f: 102.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T08:15:00Z", temp_f: 96.0, heat_index_f: 102.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T08:30:00Z", temp_f: 96.0, heat_index_f: 102.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T08:45:00Z", temp_f: 96.0, heat_index_f: 102.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T09:00:00Z", temp_f: 96.0, heat_index_f: 102.0 }, as: EOCManager }
            - call: "POST /api/episodes/${ep}/evaluate"
              payload: {}
