              captures: { mid_status: $.data.status, mid_basis: $.data.invoice_basis, mid_total: $.data.invoice_total_cents, mid_delivered: $.data.delivered_quantity }
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 6000, seal_number: "SEAL-1001" }, { lot_code: "L-002", quantity_shipped: 6501, seal_number: "SEAL-1002" }] }
              as: PrintVendorRep
              as_user_id: "${vend}"
              captures: { fin_status: $.data.status, fin_delivered: $.data.delivered_quantity, fin_sub: $.data.invoice_subtotal_cents, fin_credit: $.data.defect_credit_cents, fin_total: $.data.invoice_total_cents }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
              captures: { committed: $.data.committed_print_cents }
          assert:
            - "Call 1: HTTP 409 with ${err1} == \"ERR_SEAL_NUMBER_DUPLICATE\" - the seal repeated inside one manifest collides with itself, and the check runs over all lines before any row is written."
            - "Call 2: HTTP 400 with ${err2} == \"ERR_INVALID_REQUEST\" - a lot_code repeated within the manifest is a schema fault at priority 30, so it is reported ahead of the seal rule at priority 90 even though those seals are legal."
            - "Call 3: HTTP 400 with ${err3} == \"ERR_INVALID_REQUEST\" - an empty manifest is rejected rather than treated as a zero-lot delivery."
            - "After the three rejections, GET /ballot-lots?print_job_id=<job> returns an empty list with total_count 0: no line of any rejected manifest survived."
            - "${mid_status} == \"QC_PASSED\", ${mid_basis} == \"ESTIMATE\", ${mid_total} == 150625 and ${mid_delivered} == 0: the job never left its pre-delivery state and the invoice was not switched to the FINAL basis."
            - "Call 5: HTTP 200 with ${fin_status} == \"DELIVERED\" and ${fin_delivered} == 12501 - one ballot more than quantity_ordered 12500, which is accepted because no rule caps the delivered quantity."
            - "${fin_sub} == 105633: round_half_up(6000 * 8450 / 1000) == 50700 plus round_half_up(6501 * 8450 / 1000) == round_half_up(54933.45) == 54933."
            - "${fin_credit} == 1268 (round_half_up(105633 * 120 / 10000) == round_half_up(1267.596)) and ${fin_total} == 105633 + 45000 - 1268 == 149365; freight stays in tier 1 because 12501 <= 50000."
            - "${committed} == 149365: the ledger moved by 149365 - 150625 == -1260 on the one delivery that was accepted, and not at all on the three that were not."

      - name: ep_layout_defaults_to_certified_basis_when_basis_omitted
        claim_type: computed_read
        grounds:
          - endpoints.GET /ballot-styles/{id}/layout
          - calculations.candidate_ballot_order.variants
        distinguishing_aspect: "The optional basis query parameter defaults to CERTIFIED_BASIS, so an omitted parameter and an explicit CERTIFIED_BASIS return the same document while PROVISIONAL_BASIS returns a different one - the default is the frozen view, not the as-filed view. An unknown basis value is a 400 rather than a silent fallback to the default."
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED whose contest County Sheriff (D-12, rotation_required false) certified two candidates, Alvarez and Brooks, after which Brooks was disqualified; the LOCKED style S-100 covers D-12 and the election's rotation_policy is NONE."
