        distinguishing_aspect: |
          A correction DECISION is only legal from CORRECTION_SUBMITTED. Fired
          against a finding still in OPEN (no plan of correction submitted yet),
          it is a 409 at priority 47 - the surveyor cannot close a finding the
          site has not answered.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site; one issued CONDITION_LEVEL finding sitting in OPEN (weight 8.00), no correction submitted."
          setup_api_calls:
