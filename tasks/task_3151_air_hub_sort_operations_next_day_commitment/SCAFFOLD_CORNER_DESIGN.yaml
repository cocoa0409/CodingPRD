            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - call: "POST /airhub/aircraft/${ac2_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/land"
              payload: { inbound_weight_grams: 40000 }
              as: GatewayCoordinator
          trigger:
            - call: "POST /airhub/aircraft/${ac2_id}/begin-unload"
              payload: {}
              as: SortSupervisor
              captures: { err_face: $.data.error_id }
            - call: "POST /airhub/aircraft/${ac1_id}/complete-unload"
              payload: { unload_completed_minutes: 1390 }
              as: SortSupervisor
              captures: { err_regression: $.data.error_id }
            - call: "POST /airhub/aircraft/${ac1_id}/complete-unload"
              payload: { unload_completed_minutes: 1395 }
              as: SortSupervisor
              captures: { ok_status: $.data.status }
          assert:
            - "the second aircraft is refused because N701UP already holds the unload face: status 409 and ${err_face} == ERR_UNLOAD_FACE_OCCUPIED"
            - "Aircraft.${ac2_id}.status == LANDED, so the bank gate alone did not block it"
            - "the completion stamped at 1390 is refused with ${err_regression} == ERR_LATE_UNLOAD_REGRESSION because it precedes the arrival of 1400"
            - "the completion stamped at exactly 1395 succeeds with ${ok_status} == UNLOADED, so the boundary is inclusive"
            - "Aircraft.${ac1_id}.actual_arrival_minutes == 1400 and unload_completed_minutes == 1395, which is legitimate because unload_completed_minutes is the aircraft-local minute supplied by the operator"

      - name: err_ack_mismatch_is_reachable_on_package_creation
        claim_type: error_triggerable
        grounds:
