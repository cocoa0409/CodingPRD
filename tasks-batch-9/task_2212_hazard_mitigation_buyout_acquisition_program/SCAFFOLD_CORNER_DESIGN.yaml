              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
            - call: "POST /demolition-contractors"
              payload: { name: "Cedar Point Demolition", license_no: "DEM-9", asbestos_certified: true, max_concurrent_work_orders: 3 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ct1: "$.data.id" }
            - call: "POST /parcels/${p1}/demolition-work-orders"
              payload: { parcel_id: "${p1}", contractor_id: "${ct1}", asbestos_survey_status: "CLEARED", scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-03T17:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { wo1: "$.data.id" }
            - call: "POST /demolition-work-orders/${wo1}/utility-disconnections"
              payload: { work_order_id: "${wo1}", utility_type: "ELECTRIC", provider_name: "Riverbend Electric Coop" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { ud1: "$.data.id" }
            - call: "POST /parcels/${p1}/demolition-work-orders"
              payload: { parcel_id: "${p1}", contractor_id: "${ct1}", asbestos_survey_status: "CLEARED", scheduled_start: "2026-10-01T08:00:00Z", scheduled_end: "2026-10-03T17:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { wo2: "$.data.id" }
          trigger:
            - call: "POST /demolition-work-orders/${wo1}/utility-disconnections"
