      - name: escrow_return_waits_out_the_escrow_return_days_clock_after_termination
        claim_type: cascading_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_ESCROW_RETURN_NOT_DUE]
          - entities.Driver.fields.escrow_return_due_at
          - state_machines.Driver.CLOSING_to_RETURNED
          - entities.EscrowTransaction.fields.txn_type
        distinguishing_aspect: |
          The gate cascades: terminating the driver derives escrow_return_due_at as the termination instant plus
          ESCROW_RETURN_DAYS 45, /escrow/close moves the escrow axis to CLOSING, and only then does the return
          become time-gated. At 2026-09-01 the return is refused with 409 while escrow_status stays CLOSING and
          the 3686 principal is untouched; at exactly the due instant 2026-09-29T12:00:00Z it succeeds, emitting
          one RETURN_DISBURSEMENT of -3686 that lands balance_after_cents on 0.
