    description: "Get one campaign"
    roles: [CoalitionAdmin, AgencyNavigator]
    code: 200
    input: []
    output: OutreachCampaign
    side_effects: []
  - method: POST
    path: "/api/outreach-campaigns/{id}/close"
    description: "ACTIVE -> CLOSED"
    roles: [CoalitionAdmin]
    code: 200
    input: []
    output: OutreachCampaign
    side_effects: []

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads that default and never falls back to wall-clock time. All due/expiry/window rules evaluate against this clock."
    roles: [CoalitionAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced (monotonic: to_iso8601 must be >= current value, ERR_VALIDATION otherwise)"]

# =============================================================================
# §1.6 Error Code Catalog (25 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for endpoint, or entity_backed ownership check failed (officer institution mismatch, coach mismatch, participant mismatch)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum/type, starts_at >= ends_at, period_start > period_end, closed_at < opened_at, non-monotonic clock set" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (path ids left-to-right, then body FKs in input order)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists (incl. terminal-state lockdown and referral to CLOSED campaign)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_institution_version / expected_grant_version does not match current parent version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties: review finalizer X-User-ID equals scored_by_user_id" }
  - { id: ERR_DOCS_INCOMPLETE, http: 422, condition: "Participant lacks required VERIFIED documents (identity doc + PROOF_OF_ADDRESS)" }
  - { id: ERR_ALT_ID_NOT_ACCEPTED, http: 422, condition: "id_type_presented not among participant's VERIFIED docs, or non-STATE_ID type not in certified standard's accepted_alt_id_types" }
  - { id: ERR_BARRIER_UNRESOLVED, http: 409, condition: "APPROVE attempted with prior_banking_record=FLAGGED (or chex_flagged) and no RESOLVED BarrierCase for the application" }
  - { id: ERR_EDUCATION_REQUIRED, http: 409, condition: "Certified standard requires_financial_education and participant holds no COMPLETED/FOLLOW_UP_* pairing" }
  - { id: ERR_FOLLOW_UP_NOT_DUE, http: 409, condition: "log-follow-up attempted while pairing COMPLETED but logical clock < follow_up_due_at" }
  - { id: ERR_EVENT_WINDOW_CONFLICT, http: 409, condition: "Event window [starts_at, ends_at) overlaps another SCHEDULED event at same institution+venue (half-open; adjacency allowed)" }
  - { id: ERR_REVIEW_GAP_VIOLATION, http: 409, condition: "New review period_start < latest prior review period_end + 30 days for the institution" }
  - { id: ERR_CAMPAIGN_OVERLAP, http: 409, condition: "ACTIVE campaign with same zip_cluster and overlapping half-open window exists" }
  - { id: ERR_INSTITUTION_NOT_CERTIFIED, http: 409, condition: "Institution not CERTIFIED for event creation, booking, application create/decision" }
  - { id: ERR_STANDARD_NOT_EFFECTIVE, http: 409, condition: "Review created against a standard not in EFFECTIVE status" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "Report submit attempted while grant not ACTIVE" }
  - { id: ERR_REFERRAL_MISMATCH, http: 409, condition: "referral_id belongs to another participant, referral not in {DOCS_COMPLETE, BOOKED}, or event_id != referral.booked_event_id" }
  - { id: ERR_EVENT_NOT_BOOKABLE, http: 409, condition: "Target event not SCHEDULED for booking" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "booked_count == capacity at booking time" }
  - { id: ERR_COACH_CASELOAD_FULL, http: 409, condition: "Coach already has 3 ACTIVE pairings" }
  - { id: ERR_INSUFFICIENT_GRANT_FUNDS, http: 402, condition: "claim_total_cents > grant.available_cents at submit" }
  - { id: ERR_CLAIM_EXCEEDS_CAP, http: 422, condition: "claim_total_cents > grant.per_report_cap_cents at submit" }
  - { id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http: 422, condition: "Zip-cluster ACTIVE campaign budget sum would exceed 500000 cents" }
  - { id: ERR_GRANT_HAS_PENDING_CLAIMS, http: 409, condition: "Grant close attempted with SUBMITTED reports or reserved_cents > 0" }
  - { id: ERR_NEGOTIATION_ROUNDS_REMAINING, http: 409, condition: "Barrier escalate attempted with negotiation_rounds < 3" }
  - { id: ERR_CERTIFICATION_LAPSED, http: 409, condition: "Reinstate attempted at/after certification_expires_at" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoalitionAdmin
    description: "Bank On coalition program operator; owns standards, certification, grants, campaigns, ops epoch, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/account-standards, /activate"
      - "POST /api/partner-institutions, /suspend, /reinstate"
      - "POST /api/certification-reviews (incl. /score, /finalize)"
      - "POST /api/funding-grants (incl. /activate, /suspend, /close)"
      - "POST /api/partner-reports/{id}/review"
      - "POST /api/outreach-campaigns (incl. /close)"
      - "POST /api/ops/evaluate-due"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET reads across resources"
      - "POST /api/participants, PATCH documents, POST /api/referrals"
      - "POST /api/education-pairings"
  - name: InstitutionOfficer
    description: "Staff of a partner financial institution; X-User-ID equals the PartnerInstitution id they act for"
    identity: "entity_backed:PartnerInstitution"
    exclusive_operations:
      - "POST /api/account-opening-events (own institution), /cancel"
      - "POST /api/account-applications, /decision, /report-closure (own institution)"
      - "POST /api/barrier-cases/{id}/propose, /escalate (own institution)"
      - "POST /api/partner-reports, /submit (own institution)"
    shared_operations:
      - "GET reads for institutions, events, applications, barrier cases, reports, checkpoints, grants, referrals, standards"
  - name: AgencyNavigator
    description: "Social-services navigator; registers participants, assists documentation, manages referrals and bookings, counters barrier proposals"
    identity: opaque
    exclusive_operations:
      - "POST /api/referrals/{id}/docs-complete, /book, /unbook"
      - "POST /api/barrier-cases/{id}/counter"
    shared_operations:
      - "POST /api/participants, PATCH /api/participants/{id}/documents, POST /api/referrals"
      - "GET reads for participants, referrals, events, applications, barrier cases, pairings, campaigns, standards, institutions"
  - name: Participant
    description: "Program participant; X-User-ID equals the Participant id"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /api/barrier-cases/{id}/accept (own case only)"
    shared_operations:
      - "GET own participant record, events, institutions, standards, own barrier case"
  - name: FinancialCoach
    description: "Financial education coach; X-User-ID is an opaque coach identifier used as pairing.coach_id"
    identity: opaque
    exclusive_operations:
      - "POST /api/education-pairings/{id}/complete, /log-follow-up (own pairings only)"
    shared_operations:
      - "POST /api/education-pairings (coach_id must equal own X-User-ID)"
      - "GET reads for pairings, institutions, standards"
