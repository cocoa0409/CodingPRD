scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: post_feed_score_safety_boost_variant_amplifies_score_under_emergency_posture
        grounds:
          - calculations.post_feed_score
          - calculations.post_feed_score.variants.safety_boost
          - state_machines.Incident.OPEN_to_ACKNOWLEDGED
          - entities.Neighborhood.fields.safety_posture
          - entities.Post.fields.local_relevance_score
        distinguishing_aspect: |
          Same SAFETY-category Post, computed under Neighborhood.safety_posture=OPEN
          (posture_multiplier=1.0) yields local_relevance_score=2.10; the identical
          Post evaluated under safety_posture=EMERGENCY (posture_multiplier=2.0)
          yields 3.10. The variant lives on the Post entity domain.
        test_recipe:
          setup:
            - "Neighborhood N1 exists with radius 2000m centered at (37.75, -122.42), safety_posture=OPEN, unresolved_critical_count=0."
            - "Verified Resident R1 (trust_score 100, not suspended) has VERIFIED ResidentMembership in N1."
            - "Logical clock is 2026-06-01T00:00:00Z."
            - "A SAFETY-category Post P1 by R1 in N1 exists, created at 2026-06-01T00:00:00Z, flag_count=0, state=PUBLISHED, local_relevance_score=2.10."
            - "Three additional Residents R2, R3, R4 each reported CRITICAL Incidents in N1 that remain OPEN, driving unresolved_critical_count=3 and safety_posture=EMERGENCY."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "Mission N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/posts"
              payload: { author_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", category: "SAFETY", title: "Fire hazard", body: "See 4th and Main" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_id: "$.data.id", p1_score_open: "$.data.local_relevance_score" }
            - call: "POST /neighborhood/residents"
              payload: { email: "r2@x.com", display_name: "R2", home_address_line: "3 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r2_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r2_id: "$.data[1].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r2_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "PROPERTY_CRIME", description: "burglary in progress", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r2_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "TRAFFIC_HAZARD", description: "downed pole", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r2_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "ENVIRONMENTAL", description: "gas leak", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r2_id}"
          trigger:
            - call: "GET /neighborhood/posts/${p1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_score_emergency: "$.data.local_relevance_score" }
          assert:
            - "Neighborhood.${n1_id}.safety_posture == \"EMERGENCY\""
            - "Neighborhood.${n1_id}.unresolved_critical_count == 3"
            - "Post.${p1_id}.local_relevance_score == 3.10"
            - "3.10 - 2.10 == 1.00 (safety_boost variant delta)"

      - name: ad_impression_charge_last_impression_underbid_variant_caps_charge_at_remaining
        grounds:
          - calculations.ad_impression_charge
          - calculations.ad_impression_charge.variants.last_impression_underbid
          - state_machines.LocalAd.RUNNING_to_EXHAUSTED
          - entities.LocalAd.fields.spend_cents
        distinguishing_aspect: |
          On a LocalAd with budget_cents=1200 and bid_cents_per_impression=1000,
          the first served impression charges 1000 (full bid) leaving remaining=200.
          The second impression's variant `last_impression_underbid` caps charge
          at remaining=200 (not the full bid) and transitions RUNNING -> EXHAUSTED
          in the same call. Variant operates on the LocalAd entity domain,
          structurally different from post_feed_score.safety_boost on Post.
        test_recipe:
          setup:
            - "Neighborhood N1 exists (same as prior)."
            - "Verified Resident R1 exists in N1."
            - "Business B1 owned by R1 in N1 is VERIFIED_BUSINESS."
            - "LocalAd A1 for B1 targeting N1 with budget_cents=1200, bid_cents_per_impression=1000, start_at=2026-06-01T00:00:00Z, end_at=2026-06-30T00:00:00Z, state=RUNNING, spend_cents=0."
            - "Logical clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "Mission N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/businesses"
              payload: { owner_resident_id: "${r1_id}", name: "R1 Cafe", address_line: "1 A St", business_lat: 37.75, business_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { b1_id: "$.data.id" }
            - call: "POST /neighborhood/businesses/${b1_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/local-ads"
              payload: { business_id: "${b1_id}", target_neighborhood_ids: ["${n1_id}"], budget_cents: 1200, bid_cents_per_impression: 1000, start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-30T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${b1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /neighborhood/local-ads/${a1_id}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${b1_id}"
            - call: "POST /neighborhood/local-ads/${a1_id}/serve-impression"
              payload: { neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { a1_spend_after_first: "$.data.spend_cents", a1_state_after_first: "$.data.state" }
          trigger:
            - call: "POST /neighborhood/local-ads/${a1_id}/serve-impression"
              payload: { neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { a1_spend_after_second: "$.data.spend_cents", a1_state_after_second: "$.data.state" }
          assert:
            - "LocalAd.${a1_id}.spend_cents == 1200"
            - "LocalAd.${a1_id}.state == \"EXHAUSTED\""
            - "Second impression charged only 200 (variant caps at remaining, not full bid=1000)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes {a,b,c}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ad_impression_charge_mode_a_nested_min_over_three_inputs
        grounds:
          - calculations.ad_impression_charge
          - entities.LocalAd.fields.budget_cents
          - entities.LocalAd.fields.bid_cents_per_impression
          - entities.LocalAd.fields.spend_cents
          - state_machines.LocalAd.RUNNING_to_EXHAUSTED
        distinguishing_aspect: |
          Mode (a): charge = min(bid_cents_per_impression, budget_cents - spend_cents)
          nests min with a subtraction, taking three inputs (budget, spend, bid)
          whose non-linear interaction determines charge and whether state
          transitions to EXHAUSTED. Given budget=500, spend=200, bid=1000:
          charge = min(1000, 500-200) = 300 (bid loses; remaining wins).
        test_recipe:
          setup:
            - "Neighborhood N1 exists."
            - "Verified Resident R1 exists."
            - "Business B1 owned by R1, VERIFIED_BUSINESS."
            - "LocalAd A2 for B1 targeting N1: budget_cents=500, bid_cents_per_impression=1000, state=RUNNING, spend_cents=200 (from one prior impression capped at 200)."
            - "Logical clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "Mission N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/businesses"
              payload: { owner_resident_id: "${r1_id}", name: "R1 Cafe", address_line: "1 A St", business_lat: 37.75, business_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { b1_id: "$.data.id" }
            - call: "POST /neighborhood/businesses/${b1_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/local-ads"
              payload: { business_id: "${b1_id}", target_neighborhood_ids: ["${n1_id}"], budget_cents: 500, bid_cents_per_impression: 1000, start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-30T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${b1_id}"
              captures: { a2_id: "$.data.id" }
            - call: "POST /neighborhood/local-ads/${a2_id}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /neighborhood/local-ads/${a2_id}/serve-impression"
              payload: { neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { a2_spend: "$.data.spend_cents", a2_state: "$.data.state" }
          assert:
            - "LocalAd.${a2_id}.spend_cents == 500"
            - "LocalAd.${a2_id}.state == \"EXHAUSTED\""
            - "First-impression charge collapses to min(1000, 500-0)=500 confirming mode (a) three-input non-linear interaction"

      - name: resident_trust_score_mode_c_pinned_replay_order_over_moderation_decisions
        grounds:
          - calculations.resident_trust_score
          - state_machines.Post.FLAGGED_to_HIDDEN
          - state_machines.Post.HIDDEN_to_PUBLISHED
          - entities.Resident.fields.trust_score
        distinguishing_aspect: |
          Mode (c): resident_trust_score is defined as a fresh replay over
          ModerationDecision rows ordered by created_at ASC (id NEVER decides).
          On any moderation write the score is not incrementally updated —
          it is recomputed from the ordered event stream, so replay order
          is a pinned evaluation order rather than an incremental sum. Given
          two decisions (UPHOLD at t0, REVERSE at t1) on the same Post,
          replaying yields trust_score = 100 - 25 + 25 = 100 (not 100 - 25
          plus a separate compensation applied after the fact).
        test_recipe:
          setup:
            - "Neighborhood N1, Moderator MOD, Verified Resident R1 in N1."
            - "Post P1 by R1 exists; 3 OPEN FlagReports have already been filed against P1 so flag_count=3 and P1 auto-transitioned PUBLISHED->FLAGGED."
            - "Logical clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "Mission N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/residents"
              payload: { email: "r2@x.com", display_name: "R2", home_address_line: "3 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r2_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r2_id: "$.data[1].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/residents"
              payload: { email: "r3@x.com", display_name: "R3", home_address_line: "4 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r3_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r3_id: "$.data[2].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r3_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r3_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/residents"
              payload: { email: "r4@x.com", display_name: "R4", home_address_line: "5 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r4_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: {}
              as: PlatformAdmin
              captures: { vr_r4_id: "$.data[3].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r4_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r4_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/posts"
              payload: { author_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", category: "GENERAL", title: "Hi", body: "hello" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /neighborhood/flag-reports"
              payload: { reporter_resident_id: "${r2_id}", target_type: "POST", target_id: "${p1_id}", reason: "SPAM" }
              as: Resident
              as_user_id: "${r2_id}"
              captures: { fr1_id: "$.data.id" }
            - call: "POST /neighborhood/flag-reports"
              payload: { reporter_resident_id: "${r3_id}", target_type: "POST", target_id: "${p1_id}", reason: "SPAM" }
              as: Resident
              as_user_id: "${r3_id}"
            - call: "POST /neighborhood/flag-reports"
              payload: { reporter_resident_id: "${r4_id}", target_type: "POST", target_id: "${p1_id}", reason: "SPAM" }
              as: Resident
              as_user_id: "${r4_id}"
            - call: "GET /neighborhood/posts/${p1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_v_before: "$.data.version" }
            - call: "POST /neighborhood/moderation-decisions"
              payload: { moderator_resident_id: "${mod_id}", flag_report_id: "${fr1_id}", decision: "UPHOLD", rationale: "spam", expected_target_version: "${p1_v_before}" }
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "GET /neighborhood/posts/${p1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_v_after_uphold: "$.data.version" }
            - call: "GET /neighborhood/residents/${r1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { r1_trust_after_uphold: "$.data.trust_score" }
            - call: "GET /neighborhood/flag-reports"
              payload: { target_id: "${p1_id}", status: "UPHELD" }
              as: Moderator
              as_user_id: "${mod_id}"
              captures: { fr_upheld_id: "$.data[0].id" }
          trigger:
            - call: "POST /neighborhood/moderation-decisions"
              payload: { moderator_resident_id: "${mod_id}", flag_report_id: "${fr_upheld_id}", decision: "REVERSE", rationale: "false positive", expected_target_version: "${p1_v_after_uphold}" }
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "GET /neighborhood/residents/${r1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { r1_trust_final: "$.data.trust_score" }
          assert:
            - "Resident.${r1_id}.trust_score after UPHOLD == 75"
            - "Resident.${r1_id}.trust_score after REVERSE == 100"
            - "Trust replay is order-sensitive and pinned by created_at ASC on ModerationDecision rows"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: verification_request_cycles_in_review_and_resubmission_required
        grounds:
          - state_machines.VerificationRequest.IN_REVIEW_to_RESUBMISSION_REQUIRED
          - state_machines.VerificationRequest.RESUBMISSION_REQUIRED_to_IN_REVIEW
          - entities.VerificationRequest.fields.state
        distinguishing_aspect: |
          VerificationRequest exhibits a cycle IN_REVIEW -> RESUBMISSION_REQUIRED
          -> IN_REVIEW. Same instance can re-enter IN_REVIEW after a
          resubmission. This is a cyclic shape on the VerificationRequest
          entity, structurally distinct from Post's cyclic shape below.
        test_recipe:
          setup:
