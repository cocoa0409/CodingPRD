            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
