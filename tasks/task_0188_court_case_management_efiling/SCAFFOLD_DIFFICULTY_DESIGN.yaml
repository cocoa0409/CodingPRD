# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0188
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every rule_id below carries >= 2 instances (>= 18 total).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: due_date_calendar_vs_court_days_diverge
        grounds:
          - calculations.due_date_calc
          - entities.Deadline.fields.counting_mode
          - entities.Deadline.fields.due_date
        distinguishing_aspect: |
          Same anchor_date (2026-03-04) and same interval_days (10) on the Deadline
          entity produce a CALENDAR due_date of 2026-03-16 but a COURT_DAYS due_date
          of 2026-03-18 — two valid calendaring algorithms diverge on identical inputs.
        test_recipe:
          setup:
            - "A court with business_days_only=true, no holidays, clock at 2026-03-01."
            - "An OPEN case under that court."
            - "Two Deadline rows anchored at 2026-03-04 interval_days=10, one CALENDAR one COURT_DAYS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct A", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /deadlines"
              payload: { case_id: "${case_id}", deadline_type: "DISCOVERY", anchor_event: "MANUAL", anchor_date: "2026-03-04T00:00:00.000Z", interval_days: 10, counting_mode: "CALENDAR" }
              as: Clerk
              captures: { dl_cal_id: $.data.id }
            - call: "POST /deadlines"
              payload: { case_id: "${case_id}", deadline_type: "DISCOVERY", anchor_event: "MANUAL", anchor_date: "2026-03-04T00:00:00.000Z", interval_days: 10, counting_mode: "COURT_DAYS" }
              as: Clerk
              captures: { dl_cd_id: $.data.id }
          assert:
            - "Deadline.${dl_cal_id}.due_date == '2026-03-16T23:59:59.000Z'"
            - "Deadline.${dl_cd_id}.due_date == '2026-03-18T23:59:59.000Z'"
            - "Deadline.${dl_cal_id}.due_date != Deadline.${dl_cd_id}.due_date"

      - name: judgment_interest_vs_fee_eligibility_different_domains
        grounds:
          - calculations.judgment_interest
          - calculations.fee_waiver_eligibility
          - entities.Judgment.fields.total_with_interest_cents
          - entities.FeeWaiver.fields.eligibility_ratio
        distinguishing_aspect: |
          The two computations live on different entity domains: judgment_interest is
          a money accrual on Judgment (principal 1,000,000c, 1000bps, 91 days ->
          total 1,024,932c), while fee_waiver_eligibility is a means-test ratio on
          FeeWaiver (income 150,000c / hh 1 -> ratio 1.1538); neither shares inputs.
        test_recipe:
          setup:
            - "An OPEN case with parties; a judgment entered 2026-04-01 with principal 1,000,000c at 1000 bps; clock advanced to 2026-07-01."
            - "A separate fee-waiver request income 150,000c household 1 against the complaint filing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct B", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /fee-waivers"
              payload: { case_id: "${case_id}", filing_id: "${f_comp_id}", requesting_party_id: "${p_pl_id}", monthly_income_cents: 150000, household_size: 1 }
              as: Attorney
              as_user_id: "att_1"
              captures: { fw_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { case_v2: $.data.version }
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "TRIAL", prevailing_party_id: "${p_pl_id}", principal_cents: 1000000, interest_rate_bps: 1000, expected_case_version: "${case_v2}" }
              as: Judge
              captures: { j_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /judgments/${j_id}"
              payload: {}
              as: Clerk
              captures: { j_total: $.data.total_with_interest_cents }
            - call: "GET /fee-waivers/${fw_id}"
              payload: {}
              as: Clerk
              captures: { fw_ratio: $.data.eligibility_ratio }
          assert:
            - "Judgment.${j_id}.total_with_interest_cents == 1024932"
            - "FeeWaiver.${fw_id}.eligibility_ratio == 1.1538"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: appeal_transmittal_marginal_tiers_nonlinear   # mode (a)
        grounds:
          - calculations.appeal_transmittal_fee
          - entities.Appeal.fields.record_page_count
          - entities.Appeal.fields.transmittal_fee_cents
        distinguishing_aspect: |
          Mode (a) non-linear: a 600-page record straddles three marginal tiers
          (100*50 + 400*30 + 100*15 + base 5000 = 23,500c), NOT 600 pages at a flat
          rate; the per-page charge is a piecewise function of cumulative pages.
        test_recipe:
          setup:
            - "A case in JUDGMENT_ENTERED with a judgment and a NOTICE_FILED appeal; clock at 2026-04-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct C", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "TRIAL", prevailing_party_id: "${p_pl_id}", principal_cents: 0, interest_rate_bps: 0, expected_case_version: "${case_v}" }
              as: Judge
              captures: { j_id: $.data.id, case_v2: $.data.version }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { case_v3: $.data.version }
            - call: "POST /appeals"
              payload: { case_id: "${case_id}", judgment_id: "${j_id}", appellant_party_id: "${p_df_id}", filed_on: "2026-04-10T00:00:00.000Z", expected_case_version: "${case_v3}" }
              as: Attorney
              as_user_id: "att_2"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /appeals/${ap_id}/prepare-record"
              payload: { record_page_count: 600 }
              as: Clerk
              captures: { fee: $.data.transmittal_fee_cents }
          assert:
            - "Appeal.${ap_id}.transmittal_fee_cents == 23500"
            - "Appeal.${ap_id}.status == 'RECORD_PREPARED'"

      - name: case_total_fees_sum_then_aggregate_order   # mode (b) order-sensitive aggregation
        grounds:
          - entities.Case.fields.total_fees_assessed_cents
          - entities.Case.fields.total_fees_paid_cents
          - calculations.case_posture
        distinguishing_aspect: |
          Mode (b) nested-order: the case fee aggregates are computed by summing each
          accepted filing's integer fee_cents and only then comparing (sum-then-compare),
          so a complaint fee of 43,500c that is PAID lands in BOTH total_fees_assessed
          (43,500) and total_fees_paid (43,500); a second complaint WAIVED adds 0 to
          paid via WAIVED-not-PAID classification only — the per-filing classify-then-sum
          order is pinned and must not be reordered into sum-then-classify.
        test_recipe:
          setup:
            - "An OPEN case whose complaint fee was PAID; a second complaint filing WAIVED via approved fee waiver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct D", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint 1" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f1_id: $.data.id }
            - call: "POST /filings/${f1_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f1_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f1_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint 2" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f2_id: $.data.id }
            - call: "POST /fee-waivers"
              payload: { case_id: "${case_id}", filing_id: "${f2_id}", requesting_party_id: "${p_pl_id}", monthly_income_cents: 150000, household_size: 1 }
              as: Attorney
              as_user_id: "att_1"
              captures: { fw_id: $.data.id }
            - call: "POST /fee-waivers/${fw_id}/approve"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f2_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f2_id}/accept"
              payload: {}
              as: Clerk
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { assessed: $.data.total_fees_assessed_cents, paid: $.data.total_fees_paid_cents }
          assert:
            - "Case.${case_id}.total_fees_assessed_cents == 43500"
            - "Case.${case_id}.total_fees_paid_cents == 87000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: motion_ruling_branch_fork_grant_deny_part
        grounds:
          - state_machines.Motion.UNDER_SUBMISSION_to_GRANTED
          - state_machines.Motion.UNDER_SUBMISSION_to_DENIED
          - state_machines.Motion.UNDER_SUBMISSION_to_GRANTED_IN_PART
        distinguishing_aspect: |
          The Motion entity forks at UNDER_SUBMISSION into three branches with
          divergent side-effect sets: GRANT/GRANT_IN_PART can carry the stay cascade
          (Order.stays_case=true -> Case OPEN->STAYED) while DENY forces stays_case
          false and never stays the case.
        test_recipe:
          setup:
            - "Two OPEN cases, each with a motion UNDER_SUBMISSION; one ruled GRANT with stays_case=true, one ruled DENY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct E", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Grant Case", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "MOTION", title: "Mtn to Dismiss" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_mot_id: $.data.id }
            - call: "POST /filings/${f_mot_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_mot_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /motions"
              payload: { case_id: "${case_id}", filing_id: "${f_mot_id}", moving_party_id: "${p_pl_id}", motion_type: "DISMISS", opposed: true }
              as: Attorney
              as_user_id: "att_1"
              captures: { m_id: $.data.id }
            - call: "POST /motions/${m_id}/submit"
              payload: {}
              as: Judge
          trigger:
            - call: "POST /motions/${m_id}/rule"
              payload: { ruling: "GRANT", order_text: "Granted and stayed", stays_case: true }
              as: Judge
              captures: { order_id: $.data.order_id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { case_status: $.data.status }
          assert:
            - "Motion.${m_id}.status == 'GRANTED'"
            - "Case.${case_id}.status == 'STAYED'"
            - "Case.${case_id}.posture == 'FROZEN'"

      - name: fee_waiver_revision_cycle_pending_needs_info
        grounds:
          - state_machines.FeeWaiver.PENDING_to_NEEDS_INFO
          - state_machines.FeeWaiver.NEEDS_INFO_to_PENDING
          - entities.FeeWaiver.fields.eligibility_ratio
        distinguishing_aspect: |
          The FeeWaiver entity is cyclic: PENDING->NEEDS_INFO->PENDING forms a revision
          loop, and the resubmit re-runs fee_waiver_eligibility so the ratio recomputes
          from 1.1538 (income 150,000c) to 0.8929 (income 200,000c, hh 3) on the loop-back.
        test_recipe:
          setup:
            - "A fee waiver PENDING (income 150,000c hh 1), moved to NEEDS_INFO, resubmitted with income 200,000c hh 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct F", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /fee-waivers"
              payload: { case_id: "${case_id}", filing_id: "${f_comp_id}", requesting_party_id: "${p_pl_id}", monthly_income_cents: 150000, household_size: 1 }
              as: Attorney
              as_user_id: "att_1"
              captures: { fw_id: $.data.id }
            - call: "POST /fee-waivers/${fw_id}/request-info"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /fee-waivers/${fw_id}/resubmit"
              payload: { monthly_income_cents: 200000, household_size: 3 }
              as: Attorney
              as_user_id: "att_1"
              captures: { ratio: $.data.eligibility_ratio, st: $.data.status }
          assert:
            - "FeeWaiver.${fw_id}.status == 'PENDING'"
            - "FeeWaiver.${fw_id}.eligibility_ratio == 0.8929"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: service_complete_depth3_party_deadline_posture
        grounds:
          - state_machines.ServiceOfProcess.ATTEMPTED_to_COMPLETED
          - entities.Party.fields.service_status
          - entities.Deadline.fields.due_date
          - entities.Case.fields.open_deadline_count
          - calculations.case_posture
        distinguishing_aspect: |
          Depth-3 chain triggered by ServiceOfProcess ATTEMPTED->COMPLETED: hop1 sets
          served Party.service_status=SERVED; hop1's deadline creation itself produces a
          RESPONSE Deadline (PENDING) incrementing Case.open_deadline_count; that count
          change is hop3 that re-derives Case.posture. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "An OPEN case with a served defendant pending; a COMPLAINT filing accepted; clock 2026-03-02; service ATTEMPTED on 2026-03-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct G", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
