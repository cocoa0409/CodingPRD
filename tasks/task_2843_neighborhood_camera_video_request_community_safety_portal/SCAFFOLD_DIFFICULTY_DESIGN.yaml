          setup:
            - "Author RA at (0,0) with alert_radius_m 0; flaggers RB and RC with alert_radius_m 0; moderators mod-1 (opens) and mod-2 (decides)."
            - "The logical clock is advanced between post creations so created_at is strictly increasing and the L4 sweep order is unambiguous."
            - "At 2026-08-12T00:00:00Z RA publishes post PA; RB and RC flag it; mod-1 opens a case and mod-2 decides REMOVE_INACCURATE, so PA is REMOVED and RA holds accuracy_strike_count 1, total_strike_score 1 and post_privilege_state UNRESTRICTED."
            - "At 2026-08-12T01:00:00Z RA publishes P1 and at 2026-08-12T02:00:00Z RA publishes P2; both are PUBLISHED with no classifier signals and both are inside RECENT_POST_LOOKBACK_DAYS."
