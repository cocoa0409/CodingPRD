    input: ["well_profile_id", "jurisdiction_code", "scope", "quote_id?", "work_order_id?", "expedited?", "post_hoc?"]
    output: Permit
    side_effects: ["status starts at DRAFT; fee_cents 0 until filed"]
  - method: GET
    path: "/water-service/permits/{permit_id}"
    description: "Reads one permit."
    roles: [PlatformAdmin, ComplianceOfficer, Estimator, Dispatcher, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/water-service/permits"
    description: "Lists permits with optional foreign-key filters."
    roles: [PlatformAdmin, ComplianceOfficer, Estimator, Dispatcher, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["well_profile_id?", "work_order_id?", "quote_id?", "mandated_alternate_part_id?", "superseded_quote_line_id?", "status?", "jurisdiction_code?", "scope?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/water-service/permits/{permit_id}/file"
    description: "Files the permit with the WELL's jurisdiction and computes the fee."
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G6_REGULATORY, G9_BUSINESS]
    input: []
    output: Permit
    side_effects: ["sets jurisdiction_tier, fee_cents and filed_at; increments Permit.version by 1"]
  - method: POST
    path: "/water-service/permits/{permit_id}/approve"
    description: "Approves a FILED permit, optionally imposing a mandated alternate part which fires the four-hop CASCADE-C-2."
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G8_PAYLOAD, G9_BUSINESS]
    input: ["mandated_alternate_part_id?", "superseded_quote_line_id?", "condition_text?"]
    output: Permit
    side_effects:
      - "with no alternate: status APPROVED, version + 1"
      - "with an alternate: CASCADE-C-2 hops 1-4 - permit APPROVED_WITH_CONDITIONS, quote line SUPERSEDED plus a new alternate line, quote REVISION_REQUIRED and re-totalled, every SCHEDULED work order on that quote HELD"
  - method: POST
    path: "/water-service/permits/{permit_id}/reject"
    description: "Rejects a FILED permit."
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: Permit
    side_effects: ["increments Permit.version by 1"]
  - method: POST
    path: "/water-service/permits/{permit_id}/refile-draft"
    description: "Returns a REJECTED permit to DRAFT so it can be corrected and filed again."
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: Permit
    side_effects: ["clears filed_at and resets fee_cents to 0; increments Permit.version by 1"]
  - method: POST
    path: "/water-service/permits/{permit_id}/withdraw"
    description: "Withdraws a FILED permit."
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: Permit
    side_effects: ["increments Permit.version by 1"]

  # ---------- maintenance plans ----------
  - method: POST
    path: "/water-service/maintenance-plans"
    description: "Creates a recurring maintenance plan on a well, freezing interval_days_as_designed."
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD, G9_BUSINESS]
    input: ["well_profile_id", "account_id"]
    output: MaintenancePlan
    side_effects:
      - "sets interval_days_as_designed and interval_days_as_operated from the current duty cycle class and media"
      - "sets last_service_date to the plan's created_at and next_due_at to last_service_date + interval_days_as_operated"
      - "filter_media mirrors WellProfile.treatment_media; monthly_salt_lbs is 0.0 until a softener recommendation is accepted"
  - method: GET
    path: "/water-service/maintenance-plans/{maintenance_plan_id}"
    description: "Reads one maintenance plan, both axes and both clocks."
    roles: [PlatformAdmin, Dispatcher, Technician, BillingClerk, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: MaintenancePlan
    side_effects: []
  - method: GET
    path: "/water-service/maintenance-plans"
    description: "Lists maintenance plans with optional foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Technician, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["well_profile_id?", "account_id?", "status?", "compliance_state?", "filter_media?", "limit?", "offset?"]
    output: MaintenancePlan[]
    side_effects: []
  - method: POST
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries"
    description: "Records a salt delivery, resetting the CONSUMPTION-driven clock. Carries OCC on the plan."
    roles: [Dispatcher, Technician, PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G7_OCC, G8_PAYLOAD, G9_BUSINESS]
    input: ["delivered_lbs", "expected_maintenance_plan_version"]
    output: MaintenancePlan
    side_effects:
      - "adds delivered_lbs to salt_remaining_lbs, sets last_salt_delivery_date to the logical clock and recomputes salt_next_due_date"
      - "does NOT touch the filter clock or compliance_state"
      - "increments MaintenancePlan.version by 1"
  - method: POST
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/filter-change"
    description: "Records a filter media change, resetting the TIME-driven clock."
    roles: [Technician, Dispatcher, PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G9_BUSINESS]
    input: []
    output: MaintenancePlan
    side_effects:
      - "sets last_filter_change_date to the logical clock and recomputes filter_next_due_date"
      - "does NOT touch the salt clock and does NOT clear an OVERDUE latch"
      - "increments MaintenancePlan.version by 1"
  - method: POST
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/evaluate-compliance"
    description: "Runs the compliance evaluation that LATCHES an overdue plan."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G9_BUSINESS]
    input: []
    output: MaintenancePlan
    side_effects: ["latches compliance_state OVERDUE and overdue_latched_at when clock > next_due_at; increments MaintenancePlan.version by 1"]
  - method: POST
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/suspend"
    description: "Suspends an ACTIVE plan."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: MaintenancePlan
    side_effects: ["increments MaintenancePlan.version by 1"]
  - method: POST
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/resume"
    description: "Returns a SUSPENDED plan to ACTIVE and recomputes the operated interval."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: MaintenancePlan
    side_effects: ["recomputes interval_days_as_operated and next_due_at; increments MaintenancePlan.version by 1"]
  - method: POST
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/terminate"
    description: "Terminates a SUSPENDED plan."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: MaintenancePlan
    side_effects: ["increments MaintenancePlan.version by 1"]
  - method: GET
    path: "/water-service/maintenance-plans/{maintenance_plan_id}/visits"
    description: "Reverse-reachability read: visits recorded against this plan."
    roles: [PlatformAdmin, Dispatcher, Technician, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["limit?", "offset?"]
    output: MaintenanceVisit[]
    side_effects: []

  # ---------- maintenance visits ----------
  - method: GET
    path: "/water-service/maintenance-visits/{maintenance_visit_id}"
    description: "Reads one maintenance visit."
    roles: [PlatformAdmin, Dispatcher, Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: MaintenanceVisit
    side_effects: []
  - method: GET
    path: "/water-service/maintenance-visits"
    description: "Lists maintenance visits with optional foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["maintenance_plan_id?", "work_order_id?", "visit_kind?", "limit?", "offset?"]
    output: MaintenanceVisit[]
    side_effects: []

  # ---------- invoices ----------
  - method: GET
    path: "/water-service/invoices/{invoice_id}"
    description: "Reads one invoice."
    roles: [PlatformAdmin, BillingClerk, Dispatcher, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G4_SCOPE]
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/water-service/invoices"
    description: "Lists invoices with optional foreign-key filters."
    roles: [PlatformAdmin, BillingClerk, Dispatcher]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["account_id?", "work_order_id?", "status?", "variant?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/water-service/invoices/{invoice_id}/lines"
    description: "Reverse-reachability read: the constructed lines of this invoice, in sequence_no order."
    roles: [PlatformAdmin, BillingClerk, Dispatcher, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G4_SCOPE, G8_PAYLOAD]
    input: ["limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: POST
    path: "/water-service/invoices/{invoice_id}/issue"
    description: "Issues a DRAFT invoice, moving money onto the account balance."
    roles: [BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G9_BUSINESS]
    input: []
    output: Invoice
    side_effects:
      - "sets issued_at, raises Account.balance_cents and lifetime_invoiced_cents by total_cents, re-derives credit_hold"
      - "moves WorkOrder.billing_status PENDING_INVOICE -> INVOICED"
      - "increments Invoice.version, Account.version and WorkOrder.version by 1"
  - method: POST
    path: "/water-service/invoices/{invoice_id}/payments"
    description: "Records a payment against an ISSUED or PARTIALLY_PAID invoice. Carries OCC on the invoice."
    roles: [BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G7_OCC, G8_PAYLOAD, G9_BUSINESS]
    input: ["amount_cents", "expected_invoice_version"]
    output: Invoice
    side_effects:
      - "raises amount_paid_cents, lowers Account.balance_cents, raises Account.lifetime_paid_cents, re-derives credit_hold"
      - "a payment equal to the outstanding amount settles the invoice and moves WorkOrder.billing_status INVOICED -> SETTLED"
      - "increments Invoice.version and Account.version by 1"
  - method: POST
    path: "/water-service/invoices/{invoice_id}/void"
    description: "Voids an ISSUED or PARTIALLY_PAID invoice, running the CI-2 compensating action."
    roles: [BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: Invoice
    side_effects:
      - "removes exactly the amounts issuing and paying added, restoring the balance identity"
      - "moves WorkOrder.billing_status INVOICED -> WRITTEN_OFF"
      - "increments Invoice.version, Account.version and WorkOrder.version by 1"

  # ---------- invoice lines ----------
  - method: GET
    path: "/water-service/invoice-lines/{invoice_line_id}"
    description: "Reads one invoice line."
    roles: [PlatformAdmin, BillingClerk, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: InvoiceLine
    side_effects: []
  - method: GET
    path: "/water-service/invoice-lines"
    description: "Lists invoice lines with optional foreign-key filters."
    roles: [PlatformAdmin, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["invoice_id?", "parts_consumption_entry_id?", "line_type?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

errors:
  # --- G1 / G2 / G4 : identity and scope ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The declared role is not listed in the endpoint's roles."
  - id: ERR_ACTOR_SCOPE_VIOLATION
    http: 403
    condition: "An entity_backed actor addressed a resource it does not own: a CustomerContact whose X-User-ID is not the resource's owning Account.id, or a Technician whose X-User-ID is not the resource's assigned technician."
  # --- G3 / G9A : existence ---
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "A path or body account_id does not resolve."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "A path or body property_id does not resolve."
  - id: ERR_WELL_PROFILE_NOT_FOUND
    http: 404
    condition: "A path or body well_profile_id does not resolve."
  - id: ERR_SHARED_WELL_AGREEMENT_NOT_FOUND
    http: 404
    condition: "A path shared_well_agreement_id does not resolve."
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "A path or body technician id does not resolve."
  - id: ERR_PART_CATALOG_ITEM_NOT_FOUND
    http: 404
    condition: "A path or body part_catalog_item_id (including a mandated_alternate_part_id) does not resolve."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "A path or body inspection_id does not resolve."
  - id: ERR_WATER_TEST_NOT_FOUND
    http: 404
    condition: "A path or body water_test_id does not resolve."
  - id: ERR_TREATMENT_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "A path treatment_recommendation_id does not resolve."
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "A path or body quote_id does not resolve."
  - id: ERR_QUOTE_LINE_NOT_FOUND
    http: 404
    condition: "A path quote_line_id or a body superseded_quote_line_id does not resolve."
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "A path or body work_order_id does not resolve."
  - id: ERR_EMERGENCY_TICKET_NOT_FOUND
    http: 404
    condition: "A path or body emergency_ticket_id does not resolve."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "A path permit_id does not resolve."
  - id: ERR_PARTS_CONSUMPTION_ENTRY_NOT_FOUND
    http: 404
    condition: "A path parts_consumption_entry_id does not resolve."
  - id: ERR_WARRANTY_COVERAGE_NOT_FOUND
    http: 404
    condition: "A path or body warranty_coverage_id does not resolve."
  - id: ERR_CALLBACK_CLAIM_NOT_FOUND
    http: 404
    condition: "A path callback_claim_id does not resolve."
  - id: ERR_MAINTENANCE_PLAN_NOT_FOUND
    http: 404
    condition: "A path maintenance_plan_id does not resolve."
  - id: ERR_MAINTENANCE_VISIT_NOT_FOUND
    http: 404
    condition: "A path maintenance_visit_id does not resolve."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "A path invoice_id does not resolve."
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http: 404
    condition: "A path invoice_line_id does not resolve."
  # --- G5 : entity state ---
  - id: ERR_INSPECTION_INVALID_STATE
    http: 409
    condition: "The inspection is not in the from-state the requested transition needs."
  - id: ERR_WATER_TEST_INVALID_STATE
    http: 409
    condition: "The water test is not in the from-state the requested transition needs, e.g. a lab result on an already-analyzed test or a confirmatory result on a test that never went presumptive positive."
  - id: ERR_TREATMENT_RECOMMENDATION_INVALID_STATE
    http: 409
    condition: "Accepting a recommendation whose stored status is not PROPOSED."
  - id: ERR_QUOTE_INVALID_STATE
    http: 409
    condition: "The quote is not in the from-state the requested transition needs."
  - id: ERR_QUOTE_LINE_INVALID_STATE
    http: 409
    condition: "Deleting a line that is not ACTIVE, or whose owning quote is not DRAFT or REVISION_REQUIRED."
  - id: ERR_EMERGENCY_DISPATCH_INVALID_STATE
    http: 409
    condition: "The ticket's dispatch axis is not in the from-state the requested transition needs."
  - id: ERR_EMERGENCY_AUTH_INVALID_STATE
    http: 409
    condition: "The ticket's authorization axis is not PENDING when authorize or decline-authorization is called."
  - id: ERR_WORK_ORDER_INVALID_FULFILLMENT_STATE
    http: 409
    condition: "The work order's fulfillment axis is not in the from-state the requested transition needs; also raised when issuing an invoice whose work order is not COMPLETED."
  - id: ERR_WORK_ORDER_INVALID_BILLING_STATE
    http: 409
    condition: "The work order's billing axis is not NOT_BILLABLE when write-off is called."
  - id: ERR_PERMIT_INVALID_STATE
    http: 409
    condition: "The permit is not in the from-state the requested transition needs."
  - id: ERR_CALLBACK_CLAIM_INVALID_STATE
    http: 409
    condition: "The claim is not in the from-state the requested transition needs, including raising a remedy work order from a claim that is not APPROVED_WARRANTY or already has one."
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "The invoice is not in the from-state the requested transition needs."
  - id: ERR_MAINTENANCE_PLAN_INVALID_STATE
    http: 409
    condition: "The plan is not in the from-state the requested transition needs; salt deliveries, filter changes and compliance evaluation all require ACTIVE."
  - id: ERR_WARRANTY_ALREADY_SUPERSEDED
    http: 409
    condition: "Voiding a coverage whose stored status is not ACTIVE (already SUPERSEDED or already VOIDED)."
  # --- G6 : regulatory ---
  - id: ERR_PERMIT_JURISDICTION_MISMATCH
    http: 422
    condition: "The permit's jurisdiction_code differs from the WELL's jurisdiction_code at filing."
  - id: ERR_POST_HOC_PERMIT_WINDOW_EXPIRED
    http: 422
    condition: "A post_hoc permit is filed more than POST_HOC_PERMIT_WINDOW_DAYS after the linked work order's actual_end_at."
  - id: ERR_PERMIT_REQUIRED_NOT_APPROVED
    http: 422
    condition: "Scheduling a SCHEDULED-pipeline work order whose scope needs a permit while no APPROVED or APPROVED_WITH_CONDITIONS permit is linked to it."
  - id: ERR_TECHNICIAN_TIER_INSUFFICIENT
    http: 403
    condition: "The assigned technician's tier is not allowed for the work order's scope."
  - id: ERR_RETEST_WINDOW_EXPIRED
    http: 422
    condition: "A confirmatory sample was drawn more than RETEST_WINDOW_DAYS after the parent sample."
  - id: ERR_WATER_TEST_HOLD_TIME_EXCEEDED
    http: 422
    condition: "The CONFIRMATORY sample's own analysis exceeded the bacteriological hold time."
  - id: ERR_CONFIRMATORY_SAME_OFFICER
    http: 403
    condition: "The compliance officer recording the confirmatory result is the same X-User-ID that recorded the presumptive result."
  - id: ERR_CALLBACK_ADJUDICATOR_CONFLICT
    http: 403
    condition: "The technician adjudicating a callback claim is the same X-User-ID assigned to the original work order."
  # --- G7 : optimistic concurrency ---
  - id: ERR_STALE_WELL_PROFILE_VERSION
    http: 412
    condition: "expected_well_profile_version does not equal the stored WellProfile.version."
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version does not equal the stored Quote.version."
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not equal the stored Invoice.version."
  - id: ERR_STALE_MAINTENANCE_PLAN_VERSION
    http: 412
    condition: "expected_maintenance_plan_version does not equal the stored MaintenancePlan.version."
  # --- G8 : payload ---
  - id: ERR_VALIDATION
    http: 400
    condition: "A required body field is missing or has the wrong JSON type."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed body field carries a value outside its declared member set."
  - id: ERR_INVALID_TIMESTAMP
    http: 400
    condition: "A datetime body field is not a parseable ISO 8601 UTC instant."
  - id: ERR_NEGATIVE_QUANTITY
    http: 400
    condition: "A quantity, amount or pounds body field is strictly negative. Zero is not caught here."
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "scheduled_end_at is not strictly after scheduled_start_at, or analyzed_at precedes sample_datetime."
  - id: ERR_CLOCK_BACKWARD
    http: 400
    condition: "to_iso8601 is strictly before the current logical clock."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside [1, 100] or offset is negative."
  # --- G9 : business ---
  - id: ERR_NO_TREATMENT_INDICATED
    http: 422
    condition: "The cited CHEMICAL test has no analyte above its trigger, so no media can be selected."
  - id: ERR_POTABILITY_PENDING_CONFIRMATION
    http: 422
    condition: "Accepting a treatment recommendation while the well sits at ADVISORY with advisory_reason PRESUMPTIVE_COLIFORM."
  - id: ERR_TREATMENT_RECOMMENDATION_EXPIRED
    http: 422
    condition: "Accepting a recommendation whose status_effective is EXPIRED, i.e. the logical clock has reached expires_at."
  - id: ERR_RETEST_WINDOW_STILL_OPEN
    http: 409
    condition: "The retest-window lapse sweep was called while the 21-day window is still open."
  - id: ERR_YIELD_INSUFFICIENT_FOR_PUMP
    http: 422
    condition: "A PUMP part's rated_gpm is below MIN_PUMP_GPM or above measured_yield_gpm * YIELD_SAFETY_FACTOR."
  - id: ERR_INSPECTION_REQUIRED
    http: 422
    condition: "A PUMP line was added to a quote whose well has no measured_yield_gpm from a COMPLETED inspection."
  - id: ERR_INSPECTION_STALE
    http: 422
    condition: "At quote approval the cited inspection completed more than INSPECTION_VALIDITY_DAYS ago."
  - id: ERR_QUOTE_HAS_NO_ACTIVE_LINES
    http: 422
    condition: "Pricing a quote that has no line with status ACTIVE."
  - id: ERR_QUOTE_LINE_YIELD_EXCEEDED
    http: 409
    condition: "MUTATE-THEN-REJECT (L61): at approval an ACTIVE PUMP line no longer clears the yield gate. The line moves to SUPERSEDED_BY_YIELD and the quote to REVISION_REQUIRED before this error is returned; both writes persist."
  - id: ERR_QUOTE_NOT_APPROVED
    http: 422
    condition: "Creating a work order from a quote whose status is not APPROVED."
  - id: ERR_WORK_ORDER_ORIGIN_CONFLICT
    http: 422
    condition: "POST /water-service/work-orders received both quote_id and emergency_ticket_id, or neither."
  - id: ERR_EMERGENCY_TICKET_ALREADY_LINKED
    http: 409
    condition: "The emergency ticket already has a work order."
  - id: ERR_TECHNICIAN_UNAVAILABLE
    http: 409
    condition: "The named technician's status is OFF_DUTY when dispatch or inspection start is attempted."
  - id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http: 409
    condition: "The candidate window, expanded by TRAVEL_BUFFER_MINUTES on both sides, overlaps another SCHEDULED or IN_PROGRESS window of the same technician (rule TO-1)."
  - id: ERR_WELL_SERVICE_WINDOW_CONFLICT
    http: 409
    condition: "The well already has WELL_DAILY_WORK_ORDER_CAP other SCHEDULED or IN_PROGRESS work orders whose scheduled_start_at falls in the same UTC calendar day (rule TO-2)."
  - id: ERR_NON_WELL_CAUSE_BLOCKS_PARTS
    http: 422
    condition: "Posting parts consumption on an emergency work order whose ticket was diagnosed NON_WELL_CAUSE."
  - id: ERR_AUTHORIZATION_REQUIRED
    http: 402
    condition: "Posting parts or completing an emergency work order whose ticket's authorization axis is PENDING."
  - id: ERR_PREAUTH_CAP_EXCEEDED
    http: 402
    condition: "Cumulative posted parts plus computed labor on a PRE_AUTHORIZED emergency work order would exceed the ticket's preauth_cap_cents."
  - id: ERR_PART_DISCONTINUED
    http: 422
    condition: "The catalog part's status is DISCONTINUED."
  - id: ERR_PART_OUT_OF_STOCK
    http: 409
    condition: "The catalog part's on_hand_qty is below the requested quantity."
  - id: ERR_PART_CATEGORY_MISMATCH
    http: 422
    condition: "A permit-mandated alternate part's category differs from the superseded line's part category."
  - id: ERR_QUANTITY_EXCEEDS_LIMIT
    http: 422
    condition: "quantity exceeds PART_MAX_LINE_QUANTITY."
  - id: ERR_CALLBACK_OUT_OF_WARRANTY
    http: 409
    condition: "MUTATE-THEN-REJECT (L62): the claimed coverage is out of window for the claimed class. The CallbackClaim row, the claim_count bump, the callback_attempt_count bump and callback_eligibility EXPIRED all persist before this error is returned."
  - id: ERR_CALLBACK_ALREADY_CONSUMED
    http: 409
    condition: "The original work order's callback_eligibility is already CONSUMED."
  - id: ERR_CALLBACK_LIMIT_REACHED
    http: 409
    condition: "Approving a claim against a coverage whose claim_count already exceeds CALLBACK_MAX_PER_COVERAGE."
  - id: ERR_PERMIT_ALREADY_ON_FILE
    http: 409
    condition: "Another permit for the same well and scope is already FILED, APPROVED or APPROVED_WITH_CONDITIONS."
  - id: ERR_OUT_OF_SERVICE_AREA
    http: 422
    condition: "The ticket's property has service_zone OUT_OF_AREA."
  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 400
    condition: "amount_cents is zero."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds total_cents - amount_paid_cents on the invoice."
  - id: ERR_ACCOUNT_ON_CREDIT_HOLD
    http: 402
    condition: "The owning account's credit_hold is true at quote approval or emergency authorization."
  - id: ERR_DUPLICATE_SHARED_WELL_AGREEMENT
    http: 409
    condition: "An ACTIVE agreement already links this well to this account."
  - id: ERR_SHARED_WELL_SPLIT_INVALID
    http: 422
    condition: "The resulting ACTIVE shares on the well would exceed 100.00, or would number more than SHARED_WELL_MAX_PARTIES."
  - id: ERR_SALT_DELIVERY_EXCEEDS_CAPACITY
    http: 422
    condition: "salt_remaining_lbs + delivered_lbs would exceed SALT_TANK_CAPACITY_LBS."
  - id: ERR_FILTER_CHANGE_TOO_SOON
    http: 422
    condition: "A filter change is recorded fewer than FILTER_MIN_DAYS_BETWEEN_CHANGES days after the previous one."
  - id: ERR_PLAN_ALREADY_EXISTS_FOR_WELL
    http: 409
    condition: "The well already has a MaintenancePlan whose status is ACTIVE or SUSPENDED."
  - id: ERR_RETEST_CONFIRMED_POSITIVE
    http: 422
    condition: "MUTATE-THEN-REJECT (L60): the confirmatory retest confirmed coliform. The child test row, the CONFIRMED_POSITIVE latch, the UNSAFE potability and both version bumps all persist before this error is returned."

roles:
  - name: PlatformAdmin
    description: "Operator with configuration authority: accounts, properties, wells, technicians, catalog, plans, the logical clock and coverage voids."
    identity: opaque
    exclusive_operations:
      - "POST /water-service/_clock/set_current_utc"
      - "POST /water-service/accounts"
      - "PATCH /water-service/accounts/{account_id}"
      - "POST /water-service/technicians"
      - "PATCH /water-service/technicians/{technician_id}"
      - "POST /water-service/part-catalog-items"
      - "PATCH /water-service/part-catalog-items/{part_catalog_item_id}"
      - "POST /water-service/warranty-coverages/{warranty_coverage_id}/void"
      - "POST /water-service/quotes/{quote_id}/expire"
      - "POST /water-service/maintenance-plans/{maintenance_plan_id}/evaluate-compliance"
      - "POST /water-service/maintenance-plans/{maintenance_plan_id}/suspend"
      - "POST /water-service/maintenance-plans/{maintenance_plan_id}/resume"
      - "POST /water-service/maintenance-plans/{maintenance_plan_id}/terminate"
      - "POST /water-service/shared-well-agreements/{shared_well_agreement_id}/terminate"
    shared_operations:
      - "creating properties, well profiles, inspections, water tests, permits, maintenance plans, emergency tickets and work orders"
      - "recording a pressure-tank replacement, a salt delivery, a filter change and a retest-window lapse"
      - "every read endpoint it appears on"
  - name: Dispatcher
    description: "Schedules field work: inspections, emergency triage and dispatch, work-order creation, scheduling and cancellation, remedy work orders."
    identity: opaque
    exclusive_operations:
      - "POST /water-service/emergency-tickets/{emergency_ticket_id}/triage"
      - "POST /water-service/emergency-tickets/{emergency_ticket_id}/dispatch"
      - "POST /water-service/work-orders/{work_order_id}/schedule"
      - "POST /water-service/callback-claims/{callback_claim_id}/remedy-work-order"
    shared_operations:
      - "creating properties, well profiles, inspections, emergency tickets, work orders and maintenance plans"
      - "cancelling inspections, emergency tickets and work orders"
      - "recording salt deliveries and filter changes"
  - name: Estimator
    description: "Builds and prices quotes and raises the permits they depend on. Cannot approve a quote - that is the customer's act (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /water-service/quotes/{quote_id}/lines"
      - "DELETE /water-service/quote-lines/{quote_line_id}"
      - "POST /water-service/quotes/{quote_id}/price"
      - "POST /water-service/quotes/{quote_id}/send"
    shared_operations:
      - "creating quotes and permits"
      - "reading accounts, properties, wells, inspections, catalog parts, quotes, quote lines, permits and work orders"
  - name: Technician
    description: "Field worker. Performs inspections, collects samples, works and completes work orders, posts parts, and adjudicates OTHER technicians' callback claims."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /water-service/inspections/{inspection_id}/start"
      - "POST /water-service/inspections/{inspection_id}/complete"
      - "POST /water-service/emergency-tickets/{emergency_ticket_id}/arrive"
      - "POST /water-service/emergency-tickets/{emergency_ticket_id}/diagnosis"
      - "POST /water-service/work-orders/{work_order_id}/start"
      - "POST /water-service/work-orders/{work_order_id}/parts-consumption"
      - "POST /water-service/work-orders/{work_order_id}/complete"
      - "POST /water-service/callback-claims/{callback_claim_id}/adjudicate"
    shared_operations:
      - "creating water tests, recording a pressure-tank replacement, salt deliveries and filter changes"
      - "reading properties, wells, inspections, water tests, catalog parts, work orders, coverages, claims, plans and visits"
  - name: ComplianceOfficer
    description: "Water-quality and permitting authority. Records lab and confirmatory results and drives the permit lifecycle. Cannot confirm a result it recorded itself (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /water-service/water-tests/{water_test_id}/lab-result"
      - "POST /water-service/water-tests/{water_test_id}/confirmatory-result"
      - "POST /water-service/permits/{permit_id}/file"
      - "POST /water-service/permits/{permit_id}/approve"
      - "POST /water-service/permits/{permit_id}/reject"
      - "POST /water-service/permits/{permit_id}/refile-draft"
      - "POST /water-service/permits/{permit_id}/withdraw"
    shared_operations:
      - "creating water tests, permits and treatment recommendations"
      - "lapsing a retest window"
      - "reading wells, water tests, treatment recommendations, permits, technicians, catalog parts and work orders"
  - name: BillingClerk
    description: "Money authority: issues invoices, records payments, voids invoices, writes off cancelled work and maintains shared-well splits."
    identity: opaque
    exclusive_operations:
      - "POST /water-service/invoices/{invoice_id}/issue"
      - "POST /water-service/invoices/{invoice_id}/payments"
      - "POST /water-service/invoices/{invoice_id}/void"
      - "POST /water-service/work-orders/{work_order_id}/write-off"
    shared_operations:
      - "creating shared-well agreements"
      - "reading accounts, properties, quotes, quote lines, work orders, consumption entries, coverages, claims, plans, invoices and invoice lines"
  - name: CustomerContact
    description: "The account holder acting on its own resources: approves or declines quotes, accepts treatment recommendations, authorises emergency work and raises callback claims."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /water-service/quotes/{quote_id}/approve"
      - "POST /water-service/quotes/{quote_id}/decline"
      - "POST /water-service/treatment-recommendations/{treatment_recommendation_id}/accept"
      - "POST /water-service/emergency-tickets/{emergency_ticket_id}/authorize"
      - "POST /water-service/emergency-tickets/{emergency_ticket_id}/decline-authorization"
      - "POST /water-service/work-orders/{work_order_id}/callback-claims"
    shared_operations:
      - "reading its own account, invoices, invoice lines, quotes, quote lines, wells, water tests, recommendations, tickets, work orders, coverages, claims, plans and visits"

segregation_of_duties:
  - id: SOD-1
    rule: "The ComplianceOfficer X-User-ID that recorded a presumptive bacteriological result MUST NOT be the X-User-ID that records its confirmatory result."
    enforced_at: G6_REGULATORY
    error_id: ERR_CONFIRMATORY_SAME_OFFICER
  - id: SOD-2
    rule: "The Technician X-User-ID assigned to a work order MUST NOT be the X-User-ID that adjudicates a callback claim raised against that work order."
    enforced_at: G6_REGULATORY
    error_id: ERR_CALLBACK_ADJUDICATOR_CONFLICT
  - id: SOD-3
    rule: "The Estimator role can price and send a quote but can never approve it; approval is exclusive to CustomerContact acting on its own account."
    enforced_at: G2_ROLE
    error_id: ERR_UNAUTHORIZED
