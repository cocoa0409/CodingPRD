            - { call: "POST /rate-sheets", payload: { product_id: "${p_cad}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_cad: $.data.id } }
            - { call: "POST /rate-sheets/${s_cad}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_cad}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_cad}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_cad}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_cad}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_cad}/activate", payload: {}, as: PricingAnalyst }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-13T00:00:00Z" }, as: OperationsAdmin }
            - { call: "GET /repricing-cycles/${cyc}", payload: {}, as: PricingAnalyst, captures: { due: $.data.next_review_due, st_913: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T00:00:00Z" }, as: OperationsAdmin }
            - { call: "GET /repricing-cycles/${cyc}", payload: {}, as: PricingAnalyst, captures: { st_914: $.data.status } }
          assert:
            - "after activation: next_review_due == 2026-09-14 (last_reviewed_at 2026-08-15 + 30 days)"
            - "on 2026-09-13: status == CURRENT"
            - "on 2026-09-14 (the due date itself): status == OVERDUE (inclusive >= boundary)"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activate_gated_by_notice_and_deployment_states
        grounds:
          - state_machines.RateSheet.SCHEDULED_to_EFFECTIVE
          - "validations[priority=8]"
          - "validations[priority=9]"
        distinguishing_aspect: |
          RateSheet activation depends on two OTHER entities' states: all PRE_CHANGE
          DisclosureNotice rows SENT-not-late/WAIVED and all 4 RateDeployment rows DEPLOYED.
          One PENDING notice blocks with ERR_DISCLOSURE_LEAD_TIME_UNMET; fixing that exposes
          ERR_DEPLOYMENT_INCOMPLETE for a PENDING deployment; only both green activates.
        test_recipe:
          setup:
            - "P-GATE (SAVINGS, term 0, WHOLE_BALANCE, cap 500); sheet in US-WEST effective 2026-08-10, lead 7, floor 0, single tier [0,unbounded)@100, SCHEDULED; clock held at 2026-08-03 (the required_by date) until the final activation day"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "GATE", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_g: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_g}", market_code: "US-WEST", effective_date: "2026-08-10", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_g: $.data.id } }
            - { call: "POST /rate-sheets/${s_g}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_g}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_g}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_g}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_g}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "POST /rate-sheets/${s_g}/activate", payload: {}, as: PricingAnalyst, captures: { err1: $.data.error_id } }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /rate-sheets/${s_g}/activate", payload: {}, as: PricingAnalyst, captures: { err2: $.data.error_id } }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_g}/activate", payload: {}, as: PricingAnalyst, captures: { st3: $.data.status } }
          assert:
            - "attempt 1 (clock 2026-08-03, notice n3 PENDING, deployment d3 PENDING): error_id == ERR_DISCLOSURE_LEAD_TIME_UNMET (priority 8 beats deployment gate 9 and temporal gate 23)"
            - "attempt 2 (notices all SENT, d3 still PENDING): error_id == ERR_DEPLOYMENT_INCOMPLETE"
            - "n3 sent at 2026-08-03 == required_by (on-time, is_late false); attempt 3 after clock advances to 2026-08-10 (effective_date): status == EFFECTIVE"

      - name: promo_enroll_requires_offer_active_and_window
        grounds:
          - state_machines.DepositAccount.SHEET_to_PROMO
          - "validations[priority=16]"
        distinguishing_aspect: |
          DepositAccount rate_source transition depends on PromotionalOffer state: enrolling while
          the offer is SCHEDULED (before enrollment_start) or EXPIRED (after enrollment_end) fails
          with ERR_PROMO_NOT_ENROLLABLE; only ACTIVE inside the closed window admits enrollment.
        test_recipe:
          setup:
            - "P-MMAE (MONEY_MARKET, term 0, MARGINAL, cap 600) with EFFECTIVE single-tier sheet [0,unbounded)@150 in US-WEST (effective 2026-08-15, lead 7, floor 0)"
            - "Offer PE: rate 500, term 30, window [2026-08-20, 2026-08-31], ROLL_TO_SHEET — published on 2026-08-15 while the window is still future (stays SCHEDULED)"
            - "Accounts AE1 and AE2 open with 1,000,000 each"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "MMAE", product_class: "MONEY_MARKET", term_months: 0, tier_application: "MARGINAL", rate_cap_bp: 600, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_me: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_me}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 150, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_me: $.data.id } }
            - { call: "POST /rate-sheets/${s_me}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_me}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_me}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_me}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_me}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_me}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /promotional-offers", payload: { product_id: "${p_me}", market_code: "US-WEST", promo_rate_bp: 500, promo_term_days: 30, enrollment_start: "2026-08-20", enrollment_end: "2026-08-31", min_opening_balance_cents: 0, rollover_treatment: "ROLL_TO_SHEET" }, as: PricingAnalyst, captures: { pe: $.data.id } }
            - { call: "POST /promotional-offers/${pe}/publish", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CE1", product_id: "${p_me}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { ae1: $.data.id } }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CE2", product_id: "${p_me}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { ae2: $.data.id } }
          trigger:
            - { call: "POST /deposit-accounts/${ae1}/actions", payload: { action: "ENROLL_PROMO", promo_offer_id: "${pe}" }, as: BranchBanker, captures: { err_early: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /deposit-accounts/${ae1}/actions", payload: { action: "ENROLL_PROMO", promo_offer_id: "${pe}" }, as: BranchBanker, captures: { ae1_rs: $.data.rate_source, ae1_end: $.data.promo_end_date } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /deposit-accounts/${ae2}/actions", payload: { action: "ENROLL_PROMO", promo_offer_id: "${pe}" }, as: BranchBanker, captures: { err_late: $.data.error_id } }
          assert:
            - "2026-08-15 (offer SCHEDULED, window starts 2026-08-20): error_id == ERR_PROMO_NOT_ENROLLABLE"
            - "2026-08-20 (sweep flipped offer to ACTIVE at window start): enrollment succeeds — rate_source == PROMO, promo_end_date == 2026-09-19"
            - "2026-09-01 (offer EXPIRED after window end 2026-08-31): error_id == ERR_PROMO_NOT_ENROLLABLE"

      - name: migration_requires_target_effective_source_superseded
        grounds:
          - state_machines.MigrationBatch.PLANNED_to_COMPLETED
          - "validations[priority=21]"
        distinguishing_aspect: |
          MigrationBatch execution depends on RateSheet states on BOTH ends (a different entity
          pair): source must be SUPERSEDED and target EFFECTIVE. Executing against an EFFECTIVE
          source + DRAFT target fails with ERR_MIGRATION_INVALID_STATE; after the target activates
          (superseding the source), the same batch shape succeeds and auto-retires the source.
        test_recipe:
          setup:
            - "P-CDX (CD, term 12, WHOLE_BALANCE, cap 900); S1 EFFECTIVE in US-WEST (single tier [0,unbounded)@300, effective 2026-08-15, lead 7, floor 0); S2 DRAFT (effective 2026-09-01, tier @280); no accounts"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "CDX", product_class: "CD", term_months: 12, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: true }, as: OperationsAdmin, captures: { p_cdx: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cdx}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 300, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s1x: $.data.id } }
            - { call: "POST /rate-sheets/${s1x}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s1x}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s1x}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s1x}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s1x}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s1x}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cdx}", market_code: "US-WEST", effective_date: "2026-09-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 280, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s2x: $.data.id } }
            - { call: "POST /migration-batches", payload: { source_sheet_id: "${s1x}", target_sheet_id: "${s2x}" }, as: OperationsAdmin, captures: { mba: $.data.id } }
          trigger:
            - { call: "POST /migration-batches/${mba}/execution", payload: { action: "EXECUTE" }, as: OperationsAdmin, captures: { err_a: $.data.error_id } }
            - { call: "POST /rate-sheets/${s2x}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s2x}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s2x}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s2x}" }, as: ChannelOperator, captures: { e0: "$.data[0].id", e1: "$.data[1].id", e2: "$.data[2].id", e3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${e0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${e1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${e2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${e3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s2x}" }, as: ComplianceOfficer, captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id", m3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${m0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${m1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${m2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${m3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s2x}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /migration-batches/${mba}/execution", payload: { action: "EXECUTE" }, as: OperationsAdmin, captures: { mba_st: $.data.status, mba_mig: $.data.migrated_count } }
            - { call: "GET /rate-sheets/${s1x}", payload: {}, as: PricingAnalyst, captures: { s1x_st: $.data.status } }
          assert:
            - "first EXECUTE (source EFFECTIVE, target DRAFT): error_id == ERR_MIGRATION_INVALID_STATE (state priority 6 beats referential priority 21)"
            - "after S2 activation supersedes S1: EXECUTE succeeds — batch COMPLETED, migrated_count == 0"
            - "source S1 auto-RETIRED (no GRANDFATHERED accounts remain — bubble-up on the empty set)"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sheet_window_half_open_adjacency_allowed
        grounds:
          - "validations[priority=14]"
          - entities.RateSheet.fields.effective_date
        distinguishing_aspect: |
          RateSheet windows are HALF-OPEN [effective_date, end_date): a successor whose
          effective_date equals the incumbent's end_date is legal adjacency, while a window
          starting inside the incumbent's window (or overlapping another SCHEDULED sheet) is
          ERR_EFFECTIVE_WINDOW_OVERLAP.
        test_recipe:
          setup:
