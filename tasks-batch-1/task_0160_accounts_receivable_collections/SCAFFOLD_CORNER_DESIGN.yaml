            - call: "POST /ar/customers"
              payload: { name: "WM", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 80000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /ar/write-offs"
              payload: { invoice_id: "${inv_id}", amount_cents: 50000, reason_code: "UNCOLLECTIBLE" }
