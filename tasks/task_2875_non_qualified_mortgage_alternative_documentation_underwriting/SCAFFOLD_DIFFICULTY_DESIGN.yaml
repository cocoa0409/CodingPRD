          setup:
            - "A DSCR program whose second_valuation_loan_amount_threshold_cents is 30000000, so a 40000000-cent loan requires a second valuation regardless of LTV."
            - "A SIGNIFICANT-severity overlay OVL-LTV requiring ltv_pct <= 70.00 (tier 1, waivable)."
            - "Loan B: 40000000 cents, property_value_cents 55000000, RATE_TERM_REFI on an investment property, so ltv_pct is 72.73 and OVL-LTV is breached on submission."
            - "A tier-1 ExceptionRequest on OVL-LTV, APPROVED by CreditCommittee cc-1, pinning pinned_metric_value 72.73 and clearing unresolved_overlay_breach_count to 0."
            - "The primary appraisal comes in at 55000000 and is accepted; because a second valuation is required, primary_review_status stays PRIMARY_PENDING_REVIEW and reconciled_value_cents stays null."
            - "The second appraisal is ordered and received at 49000000 but not yet decided."
