        claim_type: Violation to Error
        grounds: ["errors[ERR_EXPOSURE_EXCEEDS_AUTHORITY]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / execute_state_check_outranks_exposure_authority_check
          rationale: "Asserted as the second trigger call's error, proving the fiscal rule fires once the state gate is satisfied."
      - name: error_preservation_hold_active_on_case_close
