      - name: private_label_base_and_release_rules_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority 16]
          - validations[priority 41]
          - validations[priority 4]
          - errors[ERR_PRIVATE_LABEL_BASE_INVALID]
          - errors[ERR_BASE_MODEL_NOT_RELEASED]
          - entities.ProductModel.fields.base_model_id
          - state_machines.ProductModel.DRAFT_to_RELEASED
        distinguishing_aspect: >
          brand_label and base_model_id are conditionally required on the is_private_label flag, and the two
          failures are graded differently: an absent brand_label is a priority 4 schema defect (400) while a base
          that is itself private-label, absent, or of a different capacity is a priority 16 business defect (422).
          Release order then matters: the variant cannot reach the channel before its base, so an implementation
          that treats release_status as purely local lets a re-branded model ship off an unreleased base.
        test_recipe:
          setup:
            - "Base model GX50-T is GAS, 50 gallons, TRADE, R-20 and still DRAFT."
            - "Variant HD50-PL is a valid private-label variant of it on the RETAIL channel, also DRAFT."
            - "No other model exists, so every rejected create below leaves the catalogue at two rows."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/product-models"
              payload: { model_code: "HD50-PL", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "RETAIL", insulation_r_value: 20, is_private_label: true, base_model_id: "${m1_id}", brand_label: "HomeValue" }
              as: ComplianceEngineer
              captures: { pl1_id: $.data.id }
          trigger:
            - call: "POST /mfg/product-models"
              payload: { model_code: "NB50-PL", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "RETAIL", insulation_r_value: 20, is_private_label: true, brand_label: "NoBase" }
              as: ComplianceEngineer
            - call: "POST /mfg/product-models"
              payload: { model_code: "PP50-PL", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "RETAIL", insulation_r_value: 20, is_private_label: true, base_model_id: "${pl1_id}", brand_label: "PrivateOnPrivate" }
              as: ComplianceEngineer
            - call: "POST /mfg/product-models"
              payload: { model_code: "BG75-PL", fuel_type: "GAS", nominal_capacity_gallons: 75, channel: "RETAIL", insulation_r_value: 20, is_private_label: true, base_model_id: "${m1_id}", brand_label: "BigGallon" }
              as: ComplianceEngineer
            - call: "POST /mfg/product-models"
              payload: { model_code: "NL50-PL", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "RETAIL", insulation_r_value: 20, is_private_label: true, base_model_id: "${m1_id}" }
              as: ComplianceEngineer
            - call: "POST /mfg/product-models"
              payload: { model_code: "OB50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "BUILDER", insulation_r_value: 20, is_private_label: false, brand_label: "Oops" }
              as: ComplianceEngineer
            - call: "POST /mfg/product-models/${pl1_id}/release-to-channel"
              payload: {}
              as: ComplianceEngineer
            - call: "POST /mfg/product-models/${m1_id}/release-to-channel"
              payload: {}
              as: ComplianceEngineer
            - call: "POST /mfg/product-models/${pl1_id}/release-to-channel"
              payload: {}
              as: ComplianceEngineer
          assert:
            - "the variant with no base_model_id returns 422 with error_id == 'ERR_PRIVATE_LABEL_BASE_INVALID'"
            - "the variant whose base is itself private-label returns 422 with error_id == 'ERR_PRIVATE_LABEL_BASE_INVALID'"
            - "the 75-gallon variant of a 50-gallon base returns 422 with error_id == 'ERR_PRIVATE_LABEL_BASE_INVALID'"
            - "the variant with a valid base but no brand_label returns 400 with error_id == 'ERR_INVALID_REQUEST' (priority 4 before priority 16)"
            - "the non-private model that supplies brand_label returns 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "the first release of HD50-PL returns 409 with error_id == 'ERR_BASE_MODEL_NOT_RELEASED' and it stays DRAFT"
            - "releasing GX50-T returns 200 and ProductModel.${m1_id}.release_status == RELEASED"
            - "the second release of HD50-PL then returns 200 and ProductModel.${pl1_id}.release_status == RELEASED"
            - "exactly two ProductModel rows exist at the end, both with certification_status == UNCERTIFIED"
      - name: recall_close_completion_then_held_units_ladder
        claim_type: priority_ordering
        grounds:
          - validations[priority 32]
          - validations[priority 33]
          - errors[ERR_COMPLETION_BELOW_THRESHOLD]
          - errors[ERR_HELD_UNITS_REMAIN]
          - state_machines.RecallCampaign.IN_REMEDY_to_CLOSED
          - state_machines.HeaterUnit.HELD_to_LABELED
          - calculations.recall_completion_rate
        distinguishing_aspect: >
          Closing is guarded twice and the guards must be reported in priority order: at 40.00 percent
          population completion the answer is ERR_COMPLETION_BELOW_THRESHOLD, and only once completion reaches
          exactly the 80.00 threshold does the held-unit guard surface as ERR_HELD_UNITS_REMAIN. The unnoticed
          LABELED unit is what makes 4 remedies out of a 5-unit population equal exactly 80.00 while the
          notice-based view already reads 100.00, so an implementation that closes on the notice-based number
          closes two guards early.
        test_recipe:
          setup:
            - "Units u1-u4 are SHIPPED and u5 is LABELED; all five carry serials GX50-T-202608-00001..00005."
            - "Campaign RC-001 scoped all five units, so affected_unit_count is 5 and estimated cost is 103500 against a 150000 budget."
            - "Announcement created 4 notices (one per shipped unit) and held u5 with hold_reason_code RECALL_SCOPE, restricting the model."
            - "All 4 notices are NOTIFIED and the first two are already REMEDIED, so the campaign is IN_REMEDY."
            - "CLOSE_COMPLETION_THRESHOLD_PCT is 80.00."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
