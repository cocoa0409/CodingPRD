            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "BOARD" }
              as: DelegatedOfficer
              as_user_id: "officer-1"
              captures: { err_officer_board: $.data.error_id }
            - call: "POST /grants/${g_id}/approve"
