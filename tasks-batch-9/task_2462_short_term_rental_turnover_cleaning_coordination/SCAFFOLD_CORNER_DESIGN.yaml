      - name: corner_val_interval_ordering_rejects_reversed_equal_and_backdated_times
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - errors.ERR_INVALID_TIME_INTERVAL
          - endpoints["POST /bookings/{id}/schedule-change"]
          - endpoints["POST /bookings/{id}/guest-review"]
        distinguishing_aspect: |
          One error code guards four different interval predicates, and each is driven at its
          exact degenerate point rather than with an obviously silly value: checkout_at EQUAL to
          checkin_at (zero-length stay), checkout_at before checkin_at, a LATE_CHECKOUT whose
          new_time_at equals the contracted checkout (no actual extension), an EARLY_CHECKIN
          whose new_time_at equals the contracted checkin, and a guest review filed one minute
          before the stay begins.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' exists. Booking OUT-1 runs 2026-08-05T21:00:00Z -> 2026-08-08T16:00:00Z with no turnover attached, so schedule-change validations are exercised in isolation."
            - "Logical clock is 2026-08-01T00:00:00Z, before OUT-1's checkin_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "ZERO-1", guest_name: "Zero Night", checkin_at: "2026-09-01T16:00:00Z", checkout_at: "2026-09-01T16:00:00Z" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "REV-1", guest_name: "Reversed", checkin_at: "2026-09-05T16:00:00Z", checkout_at: "2026-09-04T16:00:00Z" }
              as: Coordinator
              captures: { e2: "$.data.error_id" }
            - call: "POST /bookings/${b1}/schedule-change"
              payload: { change_type: "LATE_CHECKOUT", new_time_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { e3: "$.data.error_id" }
            - call: "POST /bookings/${b1}/schedule-change"
              payload: { change_type: "EARLY_CHECKIN", new_time_at: "2026-08-05T21:00:00Z" }
              as: Coordinator
              captures: { e4: "$.data.error_id" }
            - call: "POST /bookings/${b1}/guest-review"
              payload: { cleanliness_rating: 5 }
              as: Coordinator
              captures: { e5: "$.data.error_id" }
            - call: "POST /bookings/${b1}/schedule-change"
              payload: { change_type: "LATE_CHECKOUT", new_time_at: "2026-08-08T16:01:00Z" }
              as: Coordinator
              captures: { ok_until: "$.data.late_checkout_until_at", ok_status: "$.data.status", ok_notice: "$.data.guest_notice_code" }
          assert:
            - "${e1} == ERR_INVALID_TIME_INTERVAL (422) - checkout_at must be strictly after checkin_at, equality is not a stay"
            - "${e2} == ERR_INVALID_TIME_INTERVAL (422)"
            - "${e3} == ERR_INVALID_TIME_INTERVAL (422) - a LATE_CHECKOUT equal to the contracted checkout extends nothing"
            - "${e4} == ERR_INVALID_TIME_INTERVAL (422) - an EARLY_CHECKIN must be strictly before the contracted checkin"
            - "${e5} == ERR_INVALID_TIME_INTERVAL (422) - the clock 2026-08-01T00:00:00Z precedes checkin_at, so no stay has begun"
            - "${ok_until} == 2026-08-08T16:01:00Z with HTTP 200, ${ok_status} == SCHEDULED, ${ok_notice} == LATE_CHECKOUT_GRANTED - one minute past the boundary is a legal extension"
            - "GET /bookings?property_id=${p1} returns total_count == 1 - neither rejected booking was persisted"

      - name: corner_val_late_checkout_ceiling_accepts_240_and_rejects_241
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=20]
          - errors.ERR_SCHEDULE_CHANGE_LIMIT_EXCEEDED
          - entities.Booking.fields.late_checkout_until_at
        distinguishing_aspect: |
          MAX_LATE_CHECKOUT_MINUTES 240 is an inclusive ceiling measured from the contracted
          checkout_at, so checkout + 240 minutes is granted and checkout + 241 is refused. The
          refused attempt must also leave schedule_change_count at its previous value - a
          rejected change is not a change. The booking carries no turnover, so priority 24 cannot
          mask priority 20.
        test_recipe:
          setup:
            - "Property P1 with booking OUT-1 checking out 2026-08-08T16:00:00Z and no turnover attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
