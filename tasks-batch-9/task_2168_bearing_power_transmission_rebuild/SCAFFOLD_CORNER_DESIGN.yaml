      - name: rebuild_limit_and_aftermarket_waiver_policy_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_REBUILD_LIMIT_REACHED]
          - errors[ERR_AFTERMARKET_NOT_PERMITTED]
          - entities.CustomerAsset.fields.criticality
        distinguishing_aspect: "A core whose rebuild_count has reached max_rebuild_count cannot open an order (422 ERR_REBUILD_LIMIT_REACHED), and an AFTERMARKET line on a CRITICAL asset is refused without an engineering_waiver_ref (422 ERR_AFTERMARKET_NOT_PERMITTED) but accepted with one."
        test_recipe:
          setup:
            - "A standard with max_rebuild_count 3, one core at rebuild_count 3 and one at rebuild_count 2, and a CRITICAL destination asset."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Policy Mill", account_code: "POL-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
