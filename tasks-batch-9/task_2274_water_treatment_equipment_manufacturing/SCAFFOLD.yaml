  - method: GET
    path: /water-treatment/consumable-draws
    purpose: "List consumable draws ordered by created_at ASC, filterable by agreement, by the draw a reversal compensates, or by draw type."
    roles: [PlatformAdmin, ApplicationEngineer, DesignReviewer, FabricationManager, QualityEngineer, CommissioningEngineer, EngineerOfRecord, OwnerRepresentative, ContractsAdministrator]
    input: ["service_agreement_id?", "reverses_draw_id?", "draw_type?"]
