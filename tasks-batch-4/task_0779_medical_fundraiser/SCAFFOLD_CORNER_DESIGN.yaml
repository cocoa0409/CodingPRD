              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Guest
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"

      - name: donor_cannot_approve_verification
        claim_type: peer_roles
        grounds: [roles.TrustSafetyAgent, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Donor calling POST /beneficiaries/{id}/approve-verification is rejected ERR_UNAUTHORIZED (403)."
