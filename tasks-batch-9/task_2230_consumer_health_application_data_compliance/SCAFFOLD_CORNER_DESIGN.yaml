scaffold_corner_design:
  - section: entities
    instances:
      - name: creation_app_product_returns_envelope_and_computed_defaults
        claim_type: creation
        grounds: ["entities.AppProduct", "endpoints['POST /health-data/app-products']", "response_envelope"]
        distinguishing_aspect: "A freshly created AppProduct returns 201 inside the fixed envelope with every computed field at its declared default and version 1; small_business_flag is derived from the two threshold inputs, not supplied."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z (the startup default)", "empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          assert:
            - "http_status == 201"
            - "the response body has exactly the keys ok, data and error, with ok == true and error == null"
            - "AppProduct.${prod_id}.small_business_flag == true"
            - "AppProduct.${prod_id}.applicability_status == UNDETERMINED"
            - "AppProduct.${prod_id}.regulated_scope == NONE"
            - "AppProduct.${prod_id}.active_element_count == 0"
            - "AppProduct.${prod_id}.regulated_element_count == 0"
            - "AppProduct.${prod_id}.active_share_consent_count == 0"
            - "AppProduct.${prod_id}.exposure_cents == 0"
            - "AppProduct.${prod_id}.policy_compliance_state == NO_POLICY"
            - "AppProduct.${prod_id}.security_program_state == NONE"
            - "AppProduct.${prod_id}.compliance_deadline_date == null"
            - "AppProduct.${prod_id}.version == 1"

      - name: retrieval_data_element_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds: ["entities.DataElement", "endpoints['GET /health-data/data-elements/{id}']"]
        distinguishing_aspect: "A single-resource GET echoes the stored input fields unchanged and exposes the computed inference_depth and chd_classification written at create time."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct with one DIAGNOSIS DataElement"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { el_id: $.data.id }
          trigger:
            - call: "GET /health-data/data-elements/${el_id}"
              payload: {}
              as: PrivacyOfficer
          assert:
            - "http_status == 200"
            - "DataElement.${el_id}.element_key == apnea_dx"
            - "DataElement.${el_id}.health_signal_kind == DIAGNOSIS"
            - "DataElement.${el_id}.inference_depth == 0"
            - "DataElement.${el_id}.chd_classification == CHD"
            - "DataElement.${el_id}.status == ACTIVE"
            - "AppProduct.${prod_id}.active_element_count == 1"
            - "AppProduct.${prod_id}.regulated_element_count == 1"

      - name: listing_data_elements_paginated_and_filtered_by_status
        claim_type: listing
        grounds: ["endpoints['GET /health-data/data-elements']", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "The filtered list endpoint honours app_product_id plus status filtering together with limit and offset, and reports total_count over the filtered set rather than the page."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct with three ACTIVE DataElements and one RETIRED DataElement"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "e1", display_name: "Element one", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "e2", display_name: "Element two", source_kind: "DEVICE_SENSOR", health_signal_kind: "MEASUREMENT" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "e3", display_name: "Element three", source_kind: "USER_PROVIDED", health_signal_kind: "NON_HEALTH" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "e4", display_name: "Element four", source_kind: "USER_PROVIDED", health_signal_kind: "NON_HEALTH" }
              as: DataSteward
              captures: { el4_id: $.data.id }
            - call: "POST /health-data/data-elements/${el4_id}/retire"
              payload: { retired_reason: "Dropped from the schema" }
              as: DataSteward
          trigger:
            - call: "GET /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", status: "ACTIVE", limit: 2, offset: 0 }
              as: DataSteward
          assert:
            - "http_status == 200"
            - "the response data array has length 2"
            - "total_count == 3"
            - "has_more == true"
            - "the RETIRED element ${el4_id} is absent from the response data array"

      - name: not_found_breach_incident_by_unknown_id
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "An {id} path segment naming no BreachIncident resolves to the generic ERR_RESOURCE_NOT_FOUND rather than one of the five per-entity 404 ids."
        test_recipe:
          setup: ["empty database beyond the clock default"]
          setup_api_calls: []
          trigger:
            - call: "GET /health-data/breach-incidents/00000000-0000-0000-0000-000000000042"
              payload: {}
              as: SecurityEngineer
          assert:
            - "error_id == ERR_RESOURCE_NOT_FOUND"
            - "http_status == 404"
            - "ok == false and data == null"

      - name: not_found_vendor_path_segment_uses_per_entity_error_id
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_VENDOR_NOT_FOUND]"]
        distinguishing_aspect: "The Vendor entity has its own 404 id, so an unknown vendor {id} must return ERR_VENDOR_NOT_FOUND and never the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty database beyond the clock default"]
          setup_api_calls: []
          trigger:
            - call: "GET /health-data/vendors/00000000-0000-0000-0000-000000000043"
              payload: {}
              as: PrivacyOfficer
          assert:
            - "error_id == ERR_VENDOR_NOT_FOUND"
            - "http_status == 404"
            - "error_id != ERR_RESOURCE_NOT_FOUND"

      - name: required_fields_missing_element_key_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "element_key has source input with no default, so omitting it fails at priority 4 before any business rule runs and no DataElement row is created."
        test_recipe:
          setup: ["one AppProduct"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"
            - "AppProduct.${prod_id}.active_element_count == 0"

      - name: defaults_vendor_clause_flags_and_sla_fall_back_to_declared_defaults
        claim_type: defaults
        grounds: ["entities.Vendor", "endpoints['POST /health-data/vendors']"]
        distinguishing_aspect: "Omitting the four optional Vendor inputs yields flow_down_clause false, audit_rights_clause false, sale_authorization_clause false and deletion_sla_days 30, which in turn makes agreement_compliance DEFICIENT."
        test_recipe:
          setup: ["one AppProduct"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /health-data/vendors"
              payload: { app_product_id: "${prod_id}", vendor_name: "BareCo", vendor_kind: "PROCESSOR" }
              as: PrivacyOfficer
              captures: { ven_id: $.data.id }
          assert:
            - "Vendor.${ven_id}.flow_down_clause == false"
            - "Vendor.${ven_id}.audit_rights_clause == false"
            - "Vendor.${ven_id}.sale_authorization_clause == false"
            - "Vendor.${ven_id}.deletion_sla_days == 30"
            - "Vendor.${ven_id}.agreement_state == DRAFT"
            - "Vendor.${ven_id}.agreement_compliance == DEFICIENT"

      - name: computed_fields_supplied_chd_classification_returns_400
        claim_type: computed_fields
        grounds: ["validations[priority=4]", "entities.DataElement.fields.chd_classification"]
        distinguishing_aspect: "chd_classification has source computed, and priority 4 rejects any computed field offered as input rather than silently ignoring it, so the create fails with 400."
        test_recipe:
          setup: ["one AppProduct"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS", chd_classification: "NON_CHD" }
              as: DataSteward
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"
            - "AppProduct.${prod_id}.regulated_element_count == 0"

      - name: system_fields_supplied_verification_token_returns_400
        claim_type: system_fields
        grounds: ["validations[priority=4]", "entities.Consumer.fields.verification_token"]
        distinguishing_aspect: "verification_token has source system; the server mints it and priority 4 rejects a caller-supplied value, which is what keeps the identity-verification corner honest."
        test_recipe:
          setup: ["one AppProduct"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT", verification_token: "chosen-by-caller" }
              as: PlatformAdmin
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: type_constraints_named_third_party_count_above_disclosed_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.PrivacyPolicyVersion.fields.named_third_party_count"]
        distinguishing_aspect: "Priority 4 carries an explicit inter-field range rule, named_third_party_count <= disclosed_third_party_count, so 3 named against 2 disclosed is a 400 rather than a score of 1.5 capped later."
        test_recipe:
          setup: ["one AppProduct with an APPROVED ApplicabilityAssessment"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app" }
              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "GET /health-data/app-products/${prod_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { fresh_v: $.data.version }
          trigger:
            - call: "POST /health-data/privacy-policy-versions"
              payload: { app_product_id: "${prod_id}", applicability_assessment_id: "${asmt_id}", version_label: "v-bad", specificity_mode: "ELEMENT_LEVEL", disclosed_category_count: 1, disclosed_purpose_count: 0, disclosed_third_party_count: 2, named_third_party_count: 3, effective_from: "2026-09-01", expected_app_product_version: "${fresh_v}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"
            - "GET /health-data/privacy-policy-versions?app_product_id=${prod_id} returns total_count == 0"

      - name: parent_relationships_data_element_under_unknown_product_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_APP_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "app_product_id is the DataElement's parent link; an unresolvable body FK fails at priority 5 with the per-entity 404 id, after the shape check at priority 4 has passed."
        test_recipe:
          setup: ["empty database beyond the clock default"]
          setup_api_calls: []
          trigger:
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "00000000-0000-0000-0000-000000000099", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
          assert:
            - "error_id == ERR_APP_PRODUCT_NOT_FOUND"
            - "http_status == 404"

      - name: graph_topology_mapping_across_two_products_rejected
        claim_type: graph_topology
        grounds: ["validations[priority=6]", "errors[ERR_CROSS_PRODUCT_REFERENCE]", "entities.ElementPurposeMapping"]
        distinguishing_aspect: "ElementPurposeMapping is the many-to-many junction of the graph topology; both legs resolve individually, yet they belong to different AppProducts, which priority 6 rejects with 409 after the 404 checks pass."
        test_recipe:
          setup: ["two AppProducts, each with one DataElement and one ProcessingPurpose"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /health-data/app-products"
              payload: { product_name: "MoodTrack", company_legal_name: "MoodTrack Inc", primary_state_code: "TX", consumer_count: 20000, annual_revenue_cents: 400000000, hipaa_covered_transaction_ratio: 0.00 }
              as: PlatformAdmin
              captures: { prod_b_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_a_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { el_a_id: $.data.id }
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_b_id}", purpose_key: "core_service", description_text: "Deliver the service", purpose_kind: "PRIMARY_SERVICE", activity_kind: "COLLECT" }
              as: DataSteward
              captures: { pur_b_id: $.data.id }
          trigger:
            - call: "POST /health-data/element-purpose-mappings"
              payload: { data_element_id: "${el_a_id}", processing_purpose_id: "${pur_b_id}", disclosure_specificity: "CATEGORY_ONLY" }
              as: DataSteward
          assert:
            - "error_id == ERR_CROSS_PRODUCT_REFERENCE"
            - "http_status == 409"
            - "GET /health-data/element-purpose-mappings?data_element_id=${el_a_id} returns total_count == 0"

  - section: state_machines
    instances:
      - name: initial_state_new_consumer_request_starts_in_received
        claim_type: initial_state
        grounds: ["state_machines.ConsumerRequest", "entities.ConsumerRequest.fields.state"]
        distinguishing_aspect: "A newly filed ConsumerRequest lands in the declared initial_state RECEIVED with zero verification rounds and, for an ACCESS request, a 45-day response deadline already stamped."
        test_recipe:
          setup: ["logical clock at 2026-08-10T00:00:00Z", "one ADULT Consumer"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /health-data/consumer-requests"
              payload: { consumer_id: "${cons_id}", request_kind: "ACCESS", submitted_channel: "WEB_FORM" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { req_id: $.data.id }
          assert:
            - "ConsumerRequest.${req_id}.state == RECEIVED"
            - "ConsumerRequest.${req_id}.received_at == 2026-08-10T00:00:00Z"
            - "ConsumerRequest.${req_id}.verification_rounds_used == 0"
            - "ConsumerRequest.${req_id}.extension_granted == false"
            - "ConsumerRequest.${req_id}.response_deadline_at == 2026-09-24T00:00:00Z"
            - "ConsumerRequest.${req_id}.outstanding_task_count == 0"

      - name: invalid_transition_confirm_pending_deletion_task_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DeletionTask", "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DeletionTask declares no PENDING -> CONFIRMED edge, so confirming before notifying is a from-state mismatch that returns ERR_INVALID_STATE and leaves outstanding_task_count untouched."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one CHD_REGULATED AppProduct with an ACTIVE ElementPurposeMapping on a SHARE purpose naming an EXECUTED Vendor"
            - "one verified DELETE ConsumerRequest with exactly one PENDING DeletionTask"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { el_id: $.data.id }
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "ad_partner_share", description_text: "Share with advertising partners", purpose_kind: "ADVERTISING", activity_kind: "SHARE" }
              as: DataSteward
              captures: { pur_id: $.data.id }
            - call: "POST /health-data/vendors"
              payload: { app_product_id: "${prod_id}", vendor_name: "AdCo", vendor_kind: "THIRD_PARTY_RECIPIENT", flow_down_clause: true, audit_rights_clause: true, deletion_sla_days: 30 }
              as: PrivacyOfficer
              captures: { ven_id: $.data.id }
            - call: "POST /health-data/vendors/${ven_id}/execute-agreement"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app" }
              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /health-data/element-purpose-mappings"
              payload: { data_element_id: "${el_id}", processing_purpose_id: "${pur_id}", vendor_id: "${ven_id}", disclosure_specificity: "ELEMENT_NAMED" }
              as: DataSteward
              captures: { map_id: $.data.id }
            - call: "POST /health-data/element-purpose-mappings/${map_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id, cons_token: $.data.verification_token }
            - call: "POST /health-data/consumer-requests"
              payload: { consumer_id: "${cons_id}", request_kind: "DELETE", submitted_channel: "IN_APP" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { req_id: $.data.id }
            - call: "POST /health-data/consumer-requests/${req_id}/verify"
              payload: { verification_token: "${cons_token}" }
              as: PrivacyOfficer
            - call: "GET /health-data/deletion-tasks"
              payload: { consumer_request_id: "${req_id}" }
              as: PrivacyOfficer
              captures: { task_id: "$.data[0].id" }
          trigger:
            - call: "POST /health-data/deletion-tasks/${task_id}/confirm"
              payload: {}
              as: PrivacyOfficer
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"
            - "DeletionTask.${task_id}.state == PENDING"
            - "DeletionTask.${task_id}.confirmed_at == null"
            - "ConsumerRequest.${req_id}.outstanding_task_count == 1"
            - "ConsumerRequest.${req_id}.state == VERIFIED"

      - name: terminal_state_lockdown_ended_campaign_cannot_be_activated
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.GeofenceCampaign", "errors[ERR_ALREADY_TERMINAL]"]
