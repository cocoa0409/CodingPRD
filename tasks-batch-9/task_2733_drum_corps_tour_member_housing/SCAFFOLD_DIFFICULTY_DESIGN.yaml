              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
