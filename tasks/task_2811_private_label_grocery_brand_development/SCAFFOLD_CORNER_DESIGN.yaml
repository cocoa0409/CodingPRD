      - name: cascading_side_effects_chain_verified_end_to_end
        claim_type: n_level_chain_verified
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /private-label/cost-change-requests/{cost_change_request_id}/decision]
        excluded_because:
          difficulty_instance: transitive_cascade / ingredient_substitution_five_hop_cascade
          rationale: "That §1.8 instance walks all five hops of the accepted-substitution cascade - cost model, specification, artwork nutrition status, dependent claims and the launched item - in one request and asserts each hop."

      - name: cascade_ordering_from_a_complaint_reaches_the_supplier_and_its_runs
        claim_type: ordering_sensitivity_tested
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /private-label/complaints]
        excluded_because:
          difficulty_instance: transitive_cascade / complaint_ppm_probation_supplier_conditional_run_hold
          rationale: "That §1.8 instance asserts the item ppm recompute must run before the supplier probation count, which must run before the run hold, so the ordering claim is already falsifiable there."

      - name: both_cost_variants_diverge_on_the_same_quote
        claim_type: both_variants_expected_results
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.landed_unit_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / landed_cost_as_quoted_vs_audited_yield
          rationale: "That §1.8 instance computes both landed-cost variants from one quote and asserts the exact delta between the quoted and audited yields."

      - name: both_scorecard_windows_diverge_for_the_same_supplier
        claim_type: both_variants_expected_results
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.supplier_composite_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / supplier_scorecard_rolling_vs_period_to_date
          rationale: "That §1.8 instance reads both scorecard variants in one response and asserts each component under the rolling 12-month and period-to-date windows."

