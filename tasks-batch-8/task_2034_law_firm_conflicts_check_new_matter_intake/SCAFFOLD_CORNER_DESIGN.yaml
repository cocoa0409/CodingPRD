          assert: ["err == ERR_FORBIDDEN"]

  # ===============================================================
  - section: complexity_layers
    instances:
      - name: c_occ_patch_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[matter-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the currently-observed version succeeds and bumps it; a second PATCH replaying the original observed version is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Matter M created; caller observed version v0 at creation"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Occ Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "PATCH /intake/matters/${m}", payload: { matter_title: "M amended", expected_matter_version: "${v0}" }, as: IntakeSpecialist, captures: { v1: $.data.version, t1: $.data.matter_title } }
            - { call: "PATCH /intake/matters/${m}", payload: { matter_title: "M amended twice", expected_matter_version: "${v0}" }, as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "v0 == 1 and t1 == 'M amended' and v1 == 2 (first PATCH succeeds and bumps version)"
            - "err == ERR_STALE_VERSION (replaying the stale observed version 1 fails 412)"

      - name: c_occ_letter_create_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[letter-create-stale-matter]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Letter creation is a create-with-supersede guarded by the matter's version: after an intervening PATCH advances the matter, letter creation carrying the pre-PATCH version is rejected 412."
        test_recipe:
          setup: ["Matter M at version v0; a PATCH then advances it"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Occ Letter Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id, v0: $.data.version } }
            - { call: "PATCH /intake/matters/${m}", payload: { matter_title: "M v2", expected_matter_version: "${v0}" }, as: IntakeSpecialist, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 1.0, rate_cents: 1000 }], expected_matter_version: "${v0}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { err: $.data.error_id } }
          assert:
            - "v1 == 2 (PATCH advanced the matter)"
            - "err == ERR_STALE_VERSION (letter create with the superseded observed version 1)"

      - name: c_party_add_supersede_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.ConflictCheck.COMPLETED_to_SUPERSEDED, state_machines.ConflictHit.PENDING_to_STALE, state_machines.Matter.CLEARED_to_UNCHECKED]
        distinguishing_aspect: "One roster add cascades three levels of observable state: the COMPLETED INTAKE check flips SUPERSEDED, its PENDING hit flips STALE, and the matter clearance recomputes to UNCHECKED."
        test_recipe:
          setup: ["Matter M1 CLEARED... no — M1 has a COMPLETED check with one PENDING hit (party X matched), clearance HITS_PENDING"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Cascade X Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { px: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Cascade Y Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { py: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Cascade Z Witness LLC", party_type: "CORPORATION" }, as: FirmAdmin, captures: { pz: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${px}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${py}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${px}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id, hits0: $.data.hit_count } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
          trigger:
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${pz}", role_in_matter: "WITNESS" }, as: IntakeSpecialist }
            - { call: "GET /intake/matters/${m1}/conflict-checks", as: IntakeSpecialist, captures: { chk_st: "$.data[0].status" } }
            - { call: "GET /intake/conflict-hits/${h}", as: IntakeSpecialist, captures: { h_st: $.data.review_status } }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs: $.data.clearance_status } }
          assert:
            - "hits0 == 1 (pre-cascade the check completed with one PENDING hit)"
            - "chk_st == SUPERSEDED (hop 1)"
            - "h_st == STALE (hop 2: PENDING hits of a superseded check stale out)"
            - "cs == UNCHECKED (hop 3: precedence rule 5 — no non-superseded checks remain)"

      - name: c_rate_threshold_coverage
        claim_type: rate_threshold_triggers
        grounds: [calculations.retainer_required_amount, calculations.credit_band]
        excluded_because:
          difficulty_instance: "boundary_precision_check / retainer_exact_equality_funded"
          rationale: "Threshold crossings (credit band 740/739, retainer funded-at-exact-required) are asserted by the §1.8 boundary_precision_check instances."

      - name: c_dual_variant_coverage
        claim_type: variant_divergence
        grounds: [calculations.retainer_required_amount]
        excluded_because:
          difficulty_instance: "dual_variant_calc / dual_variant_recent_vs_best_band_retainer"
          rationale: "V_RECENT vs V_BEST band selection divergence is asserted in the named §1.8 instance."

  # ===============================================================
  - section: consistency_model
    instances:
      - name: c_immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints: PATCH /intake/matters/{id}"]
        distinguishing_aspect: "Writes are visible immediately: the PATCH response and an immediate GET return identical title and version 2 — no asynchronous reconciliation lag anywhere in the model."
        test_recipe:
          setup: ["Matter M created (version 1)"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Consistent Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "Before" }, as: IntakeSpecialist, captures: { m: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "PATCH /intake/matters/${m}", payload: { matter_title: "After", expected_matter_version: "${v0}" }, as: IntakeSpecialist, captures: { t_resp: $.data.matter_title, v_resp: $.data.version } }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { t_get: $.data.matter_title, v_get: $.data.version } }
          assert:
            - "t_resp == 'After' and v_resp == 2 (response reflects the write)"
            - "t_get == 'After' and v_get == 2 (immediate re-read agrees with the mutation response)"
