              payload: {legal_entity_id: "${le_a_id}", anchor_tax_year: 2024, lookback_years: 3, exposure_variant: "FULL_EXPOSURE", estimated_exposure_tax: 210000.00}
              as: TaxManager
              captures: {v_id: $.data.id}
