      - name: substantiated_case_unwinds_four_entities_in_order
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: integrity_void_cascade
          rationale: "The §1.8 rule already walks the deepest chain in the scaffold end to end — SUBSTANTIATED + ATTEMPT_VOID voids the attempt, voids its EvaluatorScore rows, decrements Student.mastered_unit_total and mastered_competency_count, re-derives cumulative_credit_equivalency, drops SubscriptionTerm.units_mastered_in_term and credit_equivalency_earned, and only then pushes the already-SCHEDULED AidDisbursement to HELD with hold_reason CREDIT_EQUIVALENCY_SHORTFALL — with the hop ordering asserted at every level, plus the sibling rule `mastery_to_graduation_cascade` covering the upward bubble to GRADUATED. A §1.9 instance could only assert a strict subset of those hops."

      - name: provisional_and_final_score_variants_diverge_on_the_same_data
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: attempt_score_provisional_vs_final_two_readers
          rationale: "The §1.8 rule is built precisely on the variant delta: the same two reader scores produce PROVISIONAL_SINGLE_READER (is_provisional_score true, no unit award, no mastery outcome) after reader 1 and then TWO_READER_MEAN or ADJUDICATED after reader 2, and it asserts that the switch releases units exactly once. The companion §1.8 rule `credit_equivalency_aid_floor_vs_transcript_round` covers the other declared dual-variant calculation (AID_TERM_FLOOR versus TRANSCRIPT_CUMULATIVE_ROUND). Between them both `variants:` blocks in §1.3 are already exercised at their divergence points."

  - section: consistency_model
    instances:
      - name: cross_aggregate_derivations_are_visible_in_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.credit_hour_equivalency
          - calculations.unit_conservation
        distinguishing_aspect: "§1.4 declares `immediate`, so a single scoring call must land every downstream derivation before it returns — the attempt's own resolution, the Student's mastered totals and cumulative equivalency, the SubscriptionTerm's units_mastered_in_term and credit_equivalency_earned, and the derived progress-summary read — with no retry, no polling and no second write to nudge the denormalised fields into place."
        test_recipe:
          setup:
            - "the base chain, a single-reader WEIGHTED_ONLY blueprint on IT-101 (unit_value 4), an ACTIVE term, one CERTIFIED evaluator and one submitted attempt"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { bp_id: $.data.id }
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Eve Reader", email: "eve@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /assessment-attempts/${att_id}/submit"
              payload: { artifact_hash: "sha256:aaa", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /students/${stu_id}/progress-summary"
              payload: {}
              as: Registrar
              captures: { pre_units: $.data.mastered_unit_total, pre_cum: $.data.cumulative_credit_equivalency }
          trigger:
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev_id}", dimension_scores: [{ code: "D1", score: 90 }] }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { sc_pct: $.data.weighted_score_pct, sc_at: $.data.submitted_at_utc }
            - call: "GET /assessment-attempts/${att_id}"
              payload: {}
              as: Registrar
              captures: { att_status: $.data.status, att_final: $.data.final_score_pct, att_prov: $.data.is_provisional_score, att_mastered_at: $.data.mastered_at_utc }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { stu_units: $.data.mastered_unit_total, stu_count: $.data.mastered_competency_count, stu_cum: $.data.cumulative_credit_equivalency }
            - call: "GET /subscription-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { term_units: $.data.units_mastered_in_term, term_ce: $.data.credit_equivalency_earned, term_attempts: $.data.attempts_used }
            - call: "GET /students/${stu_id}/progress-summary"
              payload: {}
              as: Registrar
              captures: { post_units: $.data.mastered_unit_total, post_count: $.data.mastered_competency_count, post_cum: $.data.cumulative_credit_equivalency, post_var: $.data.credit_equivalency_variance }
            - call: "GET /competencies/${c1_id}"
              payload: {}
              as: Registrar
              captures: { comp_mastered_by: $.data.mastered_by_student_count }
          assert:
            - "${pre_units} == 0"
            - "${pre_cum} == 0.0"
            - "${sc_pct} == 90.00"
            - "${sc_at} == 2026-09-01T00:00:00.000Z"
            - "${att_status} == SCORED_MASTERED"
            - "${att_final} == 90.00"
            - "${att_prov} == false"
            - "${att_mastered_at} == 2026-09-01T00:00:00.000Z"
            - "${stu_units} == 4"
            - "${stu_count} == 1"
            - "${stu_cum} == 1.3"
            - "${term_units} == 4"
            - "${term_ce} == 1"
            - "${term_attempts} == 1"
            - "${post_units} == 4"
            - "${post_count} == 1"
            - "${post_cum} == 1.3"
            - "${post_var} == 1.3"
            - "${comp_mastered_by} == 1"
            - "every one of these reads happens immediately after the single scoring call with no delay, retry or intervening write"

