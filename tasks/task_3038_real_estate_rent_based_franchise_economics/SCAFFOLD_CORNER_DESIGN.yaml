              captures: { cde4: $.data.id }
            - call: "POST /franchise-system/default-events/${cde4}/cure"
              payload: {}
              as: FranchiseFinance
          trigger:
            - call: "POST /franchise-system/default-events/${cde4}/repossess"
              payload: {}
              as: FranchisorAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_DEFAULT_NOT_DECLARED"
            - "DefaultEvent.${cde4}.status remains CURED"

      - name: sales_report_initial_state_is_draft
        claim_type: Initial State
        grounds:
