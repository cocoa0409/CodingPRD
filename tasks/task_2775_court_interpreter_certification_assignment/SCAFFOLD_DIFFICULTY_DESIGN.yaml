  - rule_id: boundary_precision_check
    instances:

      - name: travel_free_radius_inclusive_at_thirty_miles_and_round_trip_cliff
        grounds:
          - calculations.assignment_pay.step_5
          - calculations.assignment_pay.constants
          - entities.RateSchedule.travel_free_radius_miles
          - entities.RateSchedule.travel_mileage_rate_cents
          - entities.RateSchedule.minimum_call_hours
          - entities.PayClaim.travel_cents
        distinguishing_aspect: |
          The free-travel radius comparison is `miles <= travel_free_radius_miles`,
          so exactly 30.0 miles reimburses nothing while 30.1 miles reimburses the
          FULL round trip (2 * miles, not the 0.1-mile excess): 30.0 -> 0 cents,
          30.1 -> round_half_up(2 * 30.1 * 67.5) = 4064 cents. The same fixture
          also pins the minimum-call floor: a 45-minute served window still bills
          2.00 hours, so FINAL equals PROVISIONAL to the cent.
