            - "${ed_prov1} == 901320 and the computed read reports provisional_impact_cents == 901320 (3 heads + 5.4 visitor heads = 8.4 * 18500 * 4 = 621600 direct spend, then 621600 * 1.45 = 901320)"
            - "the computed read reports final_impact_cents == null, checked_in_heads == 0 and actual_room_nights == 0"
            - "the computed read reports registered_heads == 3, counting all three PENDING_PAYMENT athletes because the provisional input set admits PENDING_PAYMENT, REGISTERED and CHECKED_IN"
