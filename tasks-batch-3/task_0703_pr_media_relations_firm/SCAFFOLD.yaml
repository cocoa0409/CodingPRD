# =============================================================================
# PR & Media-Relations Firm — benchmark seed tables (Expert tier)
# =============================================================================

scenario: |
  PR & Media-Relations Firm: client & campaign brief, media-list & journalist/outlet
  pitch, press-release distribution & embargo, coverage/clip tracking & sentiment,
  spokesperson & interview scheduling, crisis-comms protocol, retainer & hours,
  report/ROI

domain_name: pr-media-relations-firm
api_prefix: /agency

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: flat
  # All business resources are peer collections under /agency with FK references
  # (no nesting in URL paths). Journalist<->Outlet and MediaList<->Journalist are
  # many-to-many flavored; Distribution and Coverage are cross-aggregate joins.

  state_machine_shape: branching
  # Pitch forks RESPONDED -> {ACCEPTED, REJECTED} with divergent side-effects;
  # CrisisEvent carries two independent (parallel) status dimensions;
  # Interview and Campaign carry cycles (reschedule / pause-resume).

  relationship_patterns:
    - one_to_many        # Client -> Campaign, Campaign -> Pitch, etc.
    - many_to_many       # MediaList.journalist_ids; Journalist -> Outlet
    - cross_aggregate    # Distribution joins PressRelease x Journalist; Coverage joins Campaign x Journalist

  role_model: peer_roles
  # AccountManager owns client/campaign/retainer/crisis surface; MediaSpecialist
  # owns lists/pitches/releases/coverage; SchedulingCoordinator owns interviews;
  # PlatformAdmin is an opaque operator with override + reference-data control.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client company name" }
      - { name: industry, type: enum, source: input, description: "TECH | HEALTH | FINANCE | CONSUMER | NONPROFIT", constraints: "one of TECH, HEALTH, FINANCE, CONSUMER, NONPROFIT" }
      - { name: monthly_retainer_cents, type: integer, source: input, description: "Monthly retainer fee in cents", constraints: ">= 0" }
      - { name: monthly_hours_cap, type: number, source: input, description: "Included service hours per retainer month before overage billing", constraints: "> 0" }
      - { name: overage_rate_cents, type: integer, source: input, description: "Per-hour overage rate in cents applied above monthly_hours_cap", constraints: ">= 0" }
      - { name: account_tier, type: enum, source: input, description: "STANDARD | PREMIUM | ENTERPRISE — selects media-value multiplier tier", default: "STANDARD", constraints: "one of STANDARD, PREMIUM, ENTERPRISE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED blocks new campaigns/pitches", default: "ACTIVE", constraints: "one of ACTIVE, SUSPENDED" }
      - { name: lifetime_earned_media_cents, type: integer, source: computed, description: "Sum of media_value_cents of all VERIFIED Coverage across the client's campaigns" }

  - name: Outlet
    parent: null
    common_fields: false   # immutable reference data: only id + created_at
    fields:
      - { name: name, type: string, source: input, description: "Outlet / publication name" }
      - { name: tier, type: enum, source: input, description: "NATIONAL | REGIONAL | TRADE | BLOG — drives base media-value units", constraints: "one of NATIONAL, REGIONAL, TRADE, BLOG" }
      - { name: monthly_unique_visitors, type: integer, source: input, description: "Reach used in media-value reach factor", constraints: ">= 0" }
      - { name: domain_authority, type: integer, source: input, description: "0..100 authority score used in media-value weighting", constraints: "0..100" }

  - name: Journalist
    parent: null
    common_fields: true
    fields:
      - { name: outlet_id, type: string, source: input, description: "FK -> Outlet.id; the journalist's primary outlet" }
      - { name: full_name, type: string, source: input, description: "Journalist full name" }
      - { name: email, type: string, source: input, description: "Contact email (unique across journalists)", constraints: "unique" }
      - { name: beat, type: enum, source: input, description: "TECH | HEALTH | FINANCE | CONSUMER | POLITICS — coverage beat", constraints: "one of TECH, HEALTH, FINANCE, CONSUMER, POLITICS" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BLOCKLISTED — BLOCKLISTED journalists cannot be pitched or scheduled", default: "ACTIVE", constraints: "one of ACTIVE, BLOCKLISTED" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: title, type: string, source: input, description: "Campaign / brief title" }
      - { name: objective, type: enum, source: input, description: "LAUNCH | THOUGHT_LEADERSHIP | CRISIS | AWARENESS", constraints: "one of LAUNCH, THOUGHT_LEADERSHIP, CRISIS, AWARENESS" }
      - { name: budget_cents, type: integer, source: input, description: "Authorized media-value budget basis used by ROI cost denominator", constraints: "> 0" }
      - { name: target_beat, type: enum, source: input, description: "TECH | HEALTH | FINANCE | CONSUMER | POLITICS — pitch beat-match target", constraints: "one of TECH, HEALTH, FINANCE, CONSUMER, POLITICS" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | COMPLETED | ARCHIVED", default: "DRAFT", constraints: "one of DRAFT, ACTIVE, PAUSED, COMPLETED, ARCHIVED" }
      - { name: earned_media_value_cents, type: integer, source: computed, description: "Sum of media_value_cents of VERIFIED Coverage linked to this campaign; conserved quantity" }
      - { name: cost_basis_cents, type: integer, source: computed, description: "Service cost attributed to this campaign = sum of cost_cents of APPROVED TimeEntries on this campaign" }
      - { name: roi_ratio, type: number, source: computed, description: "Return on investment ratio per campaign_roi calculation; null until first VERIFIED coverage" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; guards media-list creation supersede" }

  - name: RetainerPeriod
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: period_month, type: string, source: input, description: "Billing month as YYYY-MM (e.g. 2026-03)", constraints: "matches ^[0-9]{4}-[0-9]{2}$; unique per client" }
      - { name: hours_cap, type: number, source: system, description: "Snapshot of Client.monthly_hours_cap at period open" }
      - { name: overage_rate_cents, type: integer, source: system, description: "Snapshot of Client.overage_rate_cents at period open" }
      - { name: hours_consumed, type: number, source: computed, description: "Conserved quantity: sum of billable_hours of SUBMITTED+APPROVED TimeEntries in this period" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional bill per retainer_billing variant=provisional (round-then-sum, includes SUBMITTED)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final bill per retainer_billing variant=final (sum-then-round, APPROVED only); null until CLOSED" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — CLOSED freezes time entry logging", default: "OPEN", constraints: "one of OPEN, CLOSED" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; guards close-period supersede" }

  - name: Spokesperson
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client this spokesperson represents" }
      - { name: full_name, type: string, source: input, description: "Spokesperson full name" }
      - { name: title, type: string, source: input, description: "Job title / role" }
      - { name: prep_buffer_minutes, type: integer, source: input, description: "Minimum gap required before and after each interview for this spokesperson", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE — INACTIVE cancels future interviews", default: "ACTIVE", constraints: "one of ACTIVE, INACTIVE" }

  - name: MediaList
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign this list targets" }
      - { name: name, type: string, source: input, description: "Media list name" }
      - { name: journalist_ids, type: array, source: input, description: "Journalist ids included in the list; each is FK -> Journalist.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | EXHAUSTED | ARCHIVED", default: "ACTIVE", constraints: "one of ACTIVE, SUPERSEDED, EXHAUSTED, ARCHIVED" }

  - name: Pitch
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign being pitched" }
      - { name: media_list_id, type: string, source: input, description: "FK -> MediaList.id; the source list" }
      - { name: journalist_id, type: string, source: input, description: "FK -> Journalist.id; pitch recipient" }
      - { name: angle, type: string, source: input, description: "Pitch angle / hook" }
      - { name: is_exclusive, type: boolean, source: input, description: "Whether the pitch offers an exclusive", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | RESPONDED | ACCEPTED | REJECTED | DECLINED | CANCELLED", default: "DRAFT", constraints: "one of DRAFT, SENT, RESPONDED, ACCEPTED, REJECTED, DECLINED, CANCELLED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp when the pitch moved to SENT; null while DRAFT" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version" }

  - name: PressRelease
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: headline, type: string, source: input, description: "Press release headline" }
      - { name: embargo_until, type: datetime, source: input, description: "ISO-8601 UTC instant before which embargoed content may not be released" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | RELEASED | WITHDRAWN", default: "DRAFT", constraints: "one of DRAFT, SCHEDULED, RELEASED, WITHDRAWN" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp when RELEASED; null otherwise" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version" }

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - { name: press_release_id, type: string, source: input, description: "FK -> PressRelease.id; the release being distributed" }
      - { name: journalist_id, type: string, source: input, description: "FK -> Journalist.id; recipient of the distribution" }
      - { name: status, type: enum, source: system, description: "QUEUED | DELIVERED | BOUNCED", default: "QUEUED", constraints: "one of QUEUED, DELIVERED, BOUNCED" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp when DELIVERED; null otherwise" }

  - name: Coverage
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign that earned the coverage" }
      - { name: journalist_id, type: string, source: input, description: "FK -> Journalist.id; author of the clip" }
      - { name: pitch_id, type: string, source: input, description: "FK -> Pitch.id; originating pitch, nullable for inbound coverage" }
      - { name: headline, type: string, source: input, description: "Clip headline" }
      - { name: published_at, type: datetime, source: input, description: "ISO-8601 UTC instant the clip was published" }
      - { name: sentiment, type: enum, source: input, description: "POSITIVE | NEUTRAL | NEGATIVE — drives sentiment weight", constraints: "one of POSITIVE, NEUTRAL, NEGATIVE" }
      - { name: prominence, type: enum, source: input, description: "FEATURE | MENTION | PASSING — drives prominence weight", constraints: "one of FEATURE, MENTION, PASSING" }
      - { name: estimated_media_value_cents, type: integer, source: computed, description: "Provisional AVE per media_value variant=estimated, fixed at logging" }
      - { name: media_value_cents, type: integer, source: computed, description: "Verified AVE per media_value variant=verified; 0 until VERIFIED, frozen at verification" }
      - { name: status, type: enum, source: system, description: "DRAFT | VERIFIED | RETRACTED — VERIFIED contributes to campaign earned media", default: "DRAFT", constraints: "one of DRAFT, VERIFIED, RETRACTED" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign context" }
      - { name: spokesperson_id, type: string, source: input, description: "FK -> Spokesperson.id; interviewee" }
      - { name: journalist_id, type: string, source: input, description: "FK -> Journalist.id; interviewer" }
      - { name: pitch_id, type: string, source: input, description: "FK -> Pitch.id; the accepted pitch this interview fulfills, nullable" }
      - { name: starts_at, type: datetime, source: input, description: "ISO-8601 UTC interview start instant" }
      - { name: ends_at, type: datetime, source: input, description: "ISO-8601 UTC interview end instant (must be > starts_at)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", default: "REQUESTED", constraints: "one of REQUESTED, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version" }

  - name: CrisisEvent
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; affected client" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; related campaign, nullable" }
      - { name: summary, type: string, source: input, description: "Crisis summary" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL — severity dimension", constraints: "one of LOW, MEDIUM, HIGH, CRITICAL" }
      - { name: severity_status, type: enum, source: system, description: "Parallel dimension A: ASSESSING | CONTAINED | ESCALATED", default: "ASSESSING", constraints: "one of ASSESSING, CONTAINED, ESCALATED" }
      - { name: response_status, type: enum, source: system, description: "Parallel dimension B: DRAFTING | APPROVED | PUBLISHED", default: "DRAFTING", constraints: "one of DRAFTING, APPROVED, PUBLISHED" }
      - { name: holding_statement, type: string, source: input, description: "Holding statement text, nullable until drafted" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version" }

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: retainer_period_id, type: string, source: input, description: "FK -> RetainerPeriod.id; period billed" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign worked on, nullable for non-campaign work" }
      - { name: staff_id, type: string, source: input, description: "Opaque operator id of the staff member who logged the work" }
      - { name: work_type, type: enum, source: input, description: "STRATEGY | WRITING | OUTREACH | MONITORING | CRISIS", constraints: "one of STRATEGY, WRITING, OUTREACH, MONITORING, CRISIS" }
      - { name: billable_hours, type: number, source: input, description: "Hours worked (quarter-hour granularity expected)", constraints: "> 0" }
      - { name: cost_cents, type: integer, source: computed, description: "Per-entry billed cost contribution at logging; see retainer_billing" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | VOID", default: "SUBMITTED", constraints: "one of SUBMITTED, APPROVED, VOID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agency/campaigns/{campaignId}/activate"
        actor: AccountManager
        preconditions:
          - "Owning Client.status == ACTIVE (else ERR_CLIENT_SUSPENDED)"
        side_effects:
          - "No ledger change"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /agency/campaigns/{campaignId}/pause"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "Pitches in DRAFT or SENT cannot advance to RESPONDED while campaign PAUSED (guarded in Pitch SM)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /agency/campaigns/{campaignId}/activate"
        actor: AccountManager
        preconditions:
          - "Owning Client.status == ACTIVE (else ERR_CLIENT_SUSPENDED)"
        side_effects:
          - "Cycle: campaign may pause and resume any number of times"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /agency/campaigns/{campaignId}/complete"
        actor: AccountManager
        preconditions:
          - "No Pitch on this campaign in SENT or RESPONDED (else ERR_CAMPAIGN_HAS_OPEN_PITCHES)"
          - "No Interview on this campaign in REQUESTED or CONFIRMED (else ERR_CAMPAIGN_HAS_OPEN_INTERVIEWS)"
        side_effects:
          - "roi_ratio recomputed per campaign_roi"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /agency/campaigns/{campaignId}/complete"
        actor: AccountManager
        preconditions:
          - "No Pitch on this campaign in SENT or RESPONDED (else ERR_CAMPAIGN_HAS_OPEN_PITCHES)"
          - "No Interview on this campaign in REQUESTED or CONFIRMED (else ERR_CAMPAIGN_HAS_OPEN_INTERVIEWS)"
        side_effects:
          - "roi_ratio recomputed per campaign_roi"
      - from: COMPLETED
        to: ARCHIVED
        trigger: "POST /agency/campaigns/{campaignId}/archive"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "CASCADE depth-3 (cascade-campaign-archive): every MediaList with campaign_id==this and status==ACTIVE -> SUPERSEDED is NOT used; instead status ACTIVE|EXHAUSTED -> ARCHIVED"
          - "Each MediaList moving to ARCHIVED then cascades: every Pitch with media_list_id==that list and status IN {DRAFT, SENT, RESPONDED} -> CANCELLED"
          - "Each Pitch moving to CANCELLED then cascades: every Interview with pitch_id==that pitch and status IN {REQUESTED, CONFIRMED} -> CANCELLED (frees the spokesperson's slot)"
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /agency/campaigns/{campaignId}/archive"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "Same archive cascade as COMPLETED -> ARCHIVED (no-op when no children exist)"

  - entity: Pitch
    initial_state: DRAFT
    terminal_states: [REJECTED, DECLINED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /agency/pitches/{pitchId}/send"
        actor: MediaSpecialist
        preconditions:
          - "Campaign.status == ACTIVE (else ERR_CAMPAIGN_NOT_ACTIVE)"
          - "Journalist.status == ACTIVE (else ERR_JOURNALIST_BLOCKLISTED)"
          - "MediaList.status == ACTIVE (else ERR_MEDIA_LIST_NOT_ACTIVE)"
        side_effects:
          - "sent_at = current logical clock"
      - from: SENT
        to: RESPONDED
        trigger: "POST /agency/pitches/{pitchId}/respond"
        actor: MediaSpecialist
        preconditions:
          - "Campaign.status == ACTIVE (else ERR_CAMPAIGN_NOT_ACTIVE) — guarded: a PAUSED campaign blocks responses"
        side_effects:
          - "No ledger change"
      - from: RESPONDED
        to: ACCEPTED
        trigger: "POST /agency/pitches/{pitchId}/accept"
        actor: MediaSpecialist
        preconditions: []
        side_effects:
          - "BRANCH A: pitch becomes eligible to anchor an Interview (interview create may reference it)"
      - from: RESPONDED
        to: REJECTED
        trigger: "POST /agency/pitches/{pitchId}/reject"
        actor: MediaSpecialist
        preconditions: []
        side_effects:
          - "BRANCH B: terminal; if this was the last Pitch in {DRAFT,SENT,RESPONDED,ACCEPTED} on its MediaList, that MediaList -> EXHAUSTED (bubble-up)"
      - from: SENT
        to: DECLINED
        trigger: "POST /agency/pitches/{pitchId}/decline"
        actor: MediaSpecialist
        preconditions: []
        side_effects:
          - "Terminal; if this was the last Pitch in {DRAFT,SENT,RESPONDED,ACCEPTED} on its MediaList, that MediaList -> EXHAUSTED (bubble-up)"
      - from: ACCEPTED
        to: RESPONDED
        trigger: "system: Spokesperson deactivation cascade (cascade-spokesperson-deactivate)"
        actor: system
        preconditions: []
        side_effects:
          - "Compensation: when a spokesperson is deactivated, an Interview anchored on this ACCEPTED pitch is CANCELLED and the pitch reverts ACCEPTED -> RESPONDED so it can be re-accepted"

  - entity: PressRelease
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /agency/press-releases/{pressReleaseId}/schedule"
        actor: MediaSpecialist
        preconditions:
          - "Campaign.status == ACTIVE (else ERR_CAMPAIGN_NOT_ACTIVE)"
          - "embargo_until > current logical clock (else ERR_EMBARGO_IN_PAST)"
        side_effects:
          - "No ledger change"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /agency/press-releases/{pressReleaseId}/release"
        actor: MediaSpecialist
        preconditions:
          - "current logical clock >= embargo_until (else ERR_EMBARGO_NOT_LIFTED)"
          - "At least one Distribution exists for this release (else ERR_NO_DISTRIBUTIONS)"
        side_effects:
          - "released_at = current logical clock"
          - "All Distribution with status==QUEUED for this release -> DELIVERED (delivered_at = current clock)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /agency/press-releases/{pressReleaseId}/withdraw"
        actor: MediaSpecialist
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /agency/press-releases/{pressReleaseId}/withdraw"
        actor: MediaSpecialist
        preconditions: []
        side_effects:
          - "All Distribution with status==QUEUED for this release -> BOUNCED"

  - entity: Coverage
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /agency/coverage/{coverageId}/verify"
        actor: MediaSpecialist
        preconditions:
          - "Campaign.status IN {ACTIVE, PAUSED, COMPLETED} (else ERR_INVALID_STATE)"
        side_effects:
          - "media_value_cents frozen per media_value variant=verified"
          - "Campaign.earned_media_value_cents += media_value_cents (ledger-sync; conserved quantity)"
          - "Owning Client.lifetime_earned_media_cents += media_value_cents"
          - "Campaign.roi_ratio recomputed per campaign_roi"
      - from: VERIFIED
        to: RETRACTED
        trigger: "POST /agency/coverage/{coverageId}/retract"
        actor: MediaSpecialist
        preconditions: []
        side_effects:
          - "Compensation: Campaign.earned_media_value_cents -= media_value_cents (drift-free reversal)"
          - "Owning Client.lifetime_earned_media_cents -= media_value_cents"
          - "Campaign.roi_ratio recomputed per campaign_roi"
          - "media_value_cents reset to 0"
      - from: DRAFT
        to: RETRACTED
        trigger: "POST /agency/coverage/{coverageId}/retract"
        actor: MediaSpecialist
        preconditions: []
        side_effects:
          - "No ledger change (was never VERIFIED, contributed 0)"

  - entity: Interview
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /agency/interviews/{interviewId}/reschedule"
        actor: SchedulingCoordinator
        preconditions:
          - "New [starts_at, ends_at) must not overlap (with prep buffer) any other non-terminal Interview for the same spokesperson (else ERR_SPOKESPERSON_DOUBLE_BOOKED)"
          - "New [starts_at, ends_at) must not overlap any other non-terminal Interview for the same journalist (else ERR_JOURNALIST_DOUBLE_BOOKED)"
        side_effects:
          - "Cycle: starts_at/ends_at updated in place; status stays REQUESTED"
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /agency/interviews/{interviewId}/confirm"
        actor: SchedulingCoordinator
        preconditions:
          - "Spokesperson.status == ACTIVE (else ERR_SPOKESPERSON_INACTIVE)"
          - "If pitch_id set, that Pitch.status == ACCEPTED (else ERR_PITCH_NOT_ACCEPTED) — cross-entity guard"
        side_effects:
          - "No ledger change"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /agency/interviews/{interviewId}/complete"
        actor: SchedulingCoordinator
        preconditions:
          - "current logical clock >= ends_at (else ERR_INTERVIEW_NOT_ENDED)"
        side_effects:
          - "No ledger change"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /agency/interviews/{interviewId}/no-show"
        actor: SchedulingCoordinator
        preconditions:
          - "current logical clock >= starts_at (else ERR_INTERVIEW_NOT_STARTED)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /agency/interviews/{interviewId}/cancel"
        actor: SchedulingCoordinator
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /agency/interviews/{interviewId}/cancel"
        actor: SchedulingCoordinator
        preconditions: []
        side_effects: []

  - entity: CrisisEvent
    initial_state: ASSESSING            # initial value of severity_status; response_status starts DRAFTING
    terminal_states: []                 # parallel dimensions; CONTAINED+PUBLISHED is effectively resolved but reopenable
    transitions:
      # ---- Parallel dimension A: severity_status ----
      - from: ASSESSING
        to: ESCALATED
        trigger: "POST /agency/crisis-events/{crisisId}/escalate"
        actor: AccountManager
        preconditions:
          - "severity IN {HIGH, CRITICAL} (else ERR_SEVERITY_TOO_LOW)"
        side_effects:
          - "Dimension A only; response_status unaffected"
      - from: ASSESSING
        to: CONTAINED
        trigger: "POST /agency/crisis-events/{crisisId}/contain"
        actor: AccountManager
        preconditions:
          - "response_status == PUBLISHED (else ERR_RESPONSE_NOT_PUBLISHED) — cross-dimension guard"
        side_effects:
          - "Dimension A only"
      - from: ESCALATED
        to: CONTAINED
        trigger: "POST /agency/crisis-events/{crisisId}/contain"
        actor: AccountManager
        preconditions:
          - "response_status == PUBLISHED (else ERR_RESPONSE_NOT_PUBLISHED)"
        side_effects:
          - "Dimension A only"
      # ---- Parallel dimension B: response_status ----
      - from: DRAFTING
        to: APPROVED
        trigger: "POST /agency/crisis-events/{crisisId}/approve-response"
        actor: AccountManager
        preconditions:
          - "holding_statement is non-null (else ERR_NO_HOLDING_STATEMENT)"
        side_effects:
          - "Dimension B only; severity_status unaffected"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /agency/crisis-events/{crisisId}/publish-response"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "Dimension B only"

  - entity: RetainerPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /agency/retainer-periods/{retainerPeriodId}/close"
        actor: AccountManager
        preconditions:
          - "No TimeEntry in this period with status==SUBMITTED (all must be APPROVED or VOID, else ERR_PERIOD_HAS_PENDING_ENTRIES)"
        side_effects:
          - "final_total_cents computed per retainer_billing variant=final"

  - entity: Spokesperson
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /agency/spokespersons/{spokespersonId}/deactivate"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "CASCADE depth-2 (cascade-spokesperson-deactivate): every Interview with spokesperson_id==this and status IN {REQUESTED, CONFIRMED} -> CANCELLED"
          - "Each Interview moving to CANCELLED then cascades: if it had a pitch_id whose Pitch.status==ACCEPTED, that Pitch reverts ACCEPTED -> RESPONDED (compensation)"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on parent version — true CREATE-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: media-list-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /agency/media-lists"
    occ_field: "expected_campaign_version"
    description: |
      Creating a new MediaList against a Campaign supersedes the campaign's
      current ACTIVE MediaList (a campaign holds at most one ACTIVE list).
      If the campaign's version has advanced since the client last observed it,
      the create is rejected: the client's view of which list is current is
      stale. Resolved purely as a version check, not a timing rule.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
  - rule_id: period-close-stale-period
    parent_entity: RetainerPeriod
    write_endpoint: "POST /agency/retainer-periods/{retainerPeriodId}/close"
    occ_field: "expected_retainer_period_version"
    description: |
      Closing a RetainerPeriod finalizes its bill. If the period's version has
      advanced since the client last observed it (another writer approved or
      voided a TimeEntry, changing the totals the closer expected to freeze),
      the close is rejected as operating on a stale view of the period.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: retainer_billing
    trigger: "TimeEntry logging (provisional), and RetainerPeriod close (final)"
    algorithm: tiered_pricing
    formula: |
      Let cap = RetainerPeriod.hours_cap, rate = RetainerPeriod.overage_rate_cents.
      Overage hours are billed at `rate`; in-cap hours are covered by the flat
      monthly_retainer (cost 0 to the period overage bill).

      Both variants compute ONLY the overage portion (in-cap hours add 0 cents).
      Variant divergence is driven by (1) which entries are included and
      (2) WHEN rounding to whole cents happens.

      Per-entry overage allocation (waterfall over entries sorted by
      (created_at ASC, id is NEVER used)):
        running_prior = hours billed by earlier included entries
        in_cap_remaining = max(0, cap - running_prior)
        entry_overage_hours = max(0, billable_hours - in_cap_remaining)
        entry_overage_cents_real = entry_overage_hours * rate    # real number, cents

    input_set: "TimeEntries of the RetainerPeriod, filtered by variant; ordered created_at ASC"
    constants:
      ROUNDING: "round_half_up to whole cents"
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "computed live as RetainerPeriod.provisional_total_cents whenever a TimeEntry is logged/approved/voided"
        difference: |
          Include entries with status IN {SUBMITTED, APPROVED}. ROUND PER ENTRY
          then SUM: provisional_total_cents = sum( round_half_up(entry_overage_cents_real) ).
          Also sets each TimeEntry.cost_cents = round_half_up(entry_overage_cents_real)
          at logging time (provisional per-entry cost).
      - name: final
        when: "computed once at RetainerPeriod close as final_total_cents"
        difference: |
          Include entries with status == APPROVED only. SUM THEN ROUND:
          final_total_cents = round_half_up( sum(entry_overage_cents_real over APPROVED entries) ).
          Combinatorial mode (b): round-per-entry-then-sum vs sum-then-round give
          different cents for the same hours; this scaffold pins provisional=round-then-sum,
          final=sum-then-round.

  - name: media_value
    trigger: "Coverage logging (estimated), and Coverage verify (verified)"
    algorithm: weighted_scoring
    formula: |
      base_units = OUTLET_TIER_UNITS[outlet.tier]
      reach_factor = 1 + (outlet.monthly_unique_visitors / 1_000_000)     # uncapped real
      authority_factor = 1 + (outlet.domain_authority / 100)
      sentiment_w = SENTIMENT_WEIGHT[coverage.sentiment]
      prominence_w = PROMINENCE_WEIGHT[coverage.prominence]
      tier_mult = ACCOUNT_TIER_MULT[client.account_tier]

      raw = base_units
            * min(reach_factor, REACH_CAP)            # non-linear: reach capped
            * authority_factor
            * sentiment_w
            * prominence_w
            * tier_mult
      value_cents = round_half_up(raw)
    input_set: "Single Coverage clip joined to its Journalist.outlet and Campaign.client"
    constants:
      OUTLET_TIER_UNITS: { NATIONAL: 500000, REGIONAL: 200000, TRADE: 80000, BLOG: 20000 }   # cents
      SENTIMENT_WEIGHT: { POSITIVE: 1.0, NEUTRAL: 0.5, NEGATIVE: 0.25 }
      PROMINENCE_WEIGHT: { FEATURE: 1.0, MENTION: 0.6, PASSING: 0.3 }
      ACCOUNT_TIER_MULT: { STANDARD: 1.0, PREMIUM: 1.25, ENTERPRISE: 1.5 }
      REACH_CAP: 3.0
    precision: "whole cents, round_half_up"
    variants:
      - name: estimated
        when: "at Coverage logging; stored as estimated_media_value_cents"
        difference: |
          Uses sentiment_w of the AS-LOGGED sentiment AND applies a 0.8 provisional
          haircut: value_cents = round_half_up(raw * 0.8). Combinatorial mode (a):
          >=3 inputs with a nested min() and tier selection.
      - name: verified
        when: "at Coverage verify; stored as media_value_cents"
        difference: |
          No haircut (full raw). Different entity-domain dual-variant from
          retainer_billing: this is media valuation on Coverage/Campaign, that is
          hours billing on RetainerPeriod.

  - name: campaign_roi
    trigger: "Coverage verify/retract side-effect, and Campaign complete"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED (combinatorial mode (c): roi looks circular
      because cost feeds the denominator and earned feeds the numerator, both
      derived from children — evaluate in this exact order):
        STEP 1: earned = Campaign.earned_media_value_cents
                       = sum(media_value_cents of Coverage with status==VERIFIED)
        STEP 2: cost   = Campaign.cost_basis_cents
                       = sum(cost_cents of TimeEntry with status==APPROVED and campaign_id==this)
        STEP 3: denom  = max(cost, ROI_FLOOR_CENTS)     # never divide by 0
        STEP 4: roi_ratio = round_half_up_to_4dp( (earned - cost) / denom )
      If earned == 0 (no VERIFIED coverage yet) roi_ratio = null.
    input_set: "VERIFIED Coverage and APPROVED TimeEntries of the campaign"
    constants:
      ROI_FLOOR_CENTS: 100000     # $1000 floor so ROI is defined before any time is logged
    precision: "4 decimal places, round_half_up"
    variants:
      - name: live
        when: "recomputed on every Coverage verify/retract"
        difference: "uses current VERIFIED set; the running campaign ROI"
      - name: final
        when: "frozen-read at Campaign complete (same formula, snapshot of the moment)"
        difference: "identical formula; documents that complete recomputes once more so the closed campaign carries a settled ratio"

  - name: campaign_open_pitch_guard
    trigger: "Campaign complete precondition; MediaList exhaustion bubble-up"
    algorithm: aggregation
    formula: |
      open_pitch_count(campaign) = count(Pitch with campaign_id==campaign
                                         and status IN {SENT, RESPONDED})
      list_open_count(media_list) = count(Pitch with media_list_id==media_list
                                          and status IN {DRAFT, SENT, RESPONDED, ACCEPTED})
      A campaign may complete only when open_pitch_count == 0.
      A MediaList auto-transitions ACTIVE -> EXHAUSTED when list_open_count
      reaches exactly 0 via a Pitch REJECT/DECLINE (boundary: 0 triggers, 1 does not).
    input_set: "Pitches grouped by campaign / media_list with explicit status filters"
    constants: {}
    precision: "integer counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "All FK fields in the body reference existing resources"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"
  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in allowed set; numeric ranges (billable_hours > 0, ends_at > starts_at, period_month format)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 6
    category: business_constraint
    check: "OCC: expected_<parent>_version equals current parent.version for supersede-style creates/closes"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /agency/media-lists, POST /agency/retainer-periods/{retainerPeriodId}/close"
  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: business_referential
    check: "Pitch journalist must be a member of the pitch's MediaList.journalist_ids; Distribution journalist must belong to a MediaList of the release's campaign"
    error_id: ERR_JOURNALIST_NOT_IN_LIST
    http_status: 409
    applies_to: "POST /agency/pitches, POST /agency/distributions"
  - priority: 9
    category: business_safety
    check: "Embargo: a SCHEDULED PressRelease cannot be RELEASED before embargo_until"
    error_id: ERR_EMBARGO_NOT_LIFTED
    http_status: 409
    applies_to: "POST /agency/press-releases/{pressReleaseId}/release"
  - priority: 10
    category: business_temporal
    check: "Interview interval overlap (spokesperson with prep buffer; journalist half-open)"
    error_id: ERR_SPOKESPERSON_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /agency/interviews, POST /agency/interviews/{interviewId}/reschedule"
  - priority: 11
    category: business_fiscal
    check: "RetainerPeriod must be OPEN to log time; hours-cap overage billing applies above cap"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /agency/time-entries"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/agency/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced/rewound to to_iso8601"]

  # ---- Client ----
  - method: POST
    path: "/agency/clients"
    description: "Create a Client"
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: [name, industry, monthly_retainer_cents, monthly_hours_cap, overage_rate_cents, "account_tier?"]
    output: Client
    side_effects: ["status=ACTIVE; lifetime_earned_media_cents=0"]
  - method: GET
    path: "/agency/clients/{clientId}"
    description: "Get a Client"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/agency/clients"
    description: "List Clients (paginated, filterable by status)"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/agency/clients/{clientId}/suspend"
    description: "Suspend a Client (blocks new campaigns/pitch sends)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["status=SUSPENDED"]

  # ---- Outlet (immutable reference data) ----
  - method: POST
    path: "/agency/outlets"
    description: "Create an Outlet (immutable reference data: only id + created_at common fields)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier, monthly_unique_visitors, domain_authority]
    output: Outlet
    side_effects: []
  - method: GET
    path: "/agency/outlets/{outletId}"
    description: "Get an Outlet"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Outlet
    side_effects: []
  - method: GET
    path: "/agency/outlets"
    description: "List Outlets (paginated)"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: Outlet[]
    side_effects: []

  # ---- Journalist ----
  - method: POST
    path: "/agency/journalists"
    description: "Create a Journalist"
    roles: [MediaSpecialist, PlatformAdmin]
    code: 201
    input: [outlet_id, full_name, email, beat]
    output: Journalist
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/agency/journalists/{journalistId}"
    description: "Get a Journalist"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Journalist
    side_effects: []
  - method: GET
    path: "/agency/journalists"
    description: "List/filter Journalists (reverse-reachability for Journalist.outlet_id)"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: ["outlet_id?", "beat?", "status?", "limit?", "offset?"]
    output: Journalist[]
    side_effects: []
  - method: POST
    path: "/agency/journalists/{journalistId}/blocklist"
    description: "Blocklist a Journalist"
    roles: [MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: Journalist
    side_effects: ["status=BLOCKLISTED"]

  # ---- Campaign ----
  - method: POST
    path: "/agency/campaigns"
    description: "Create a Campaign (status DRAFT)"
    roles: [AccountManager]
    code: 201
    input: [client_id, title, objective, budget_cents, target_beat]
    output: Campaign
    side_effects: ["status=DRAFT; earned_media_value_cents=0; cost_basis_cents=0; roi_ratio=null; version=1"]
  - method: GET
    path: "/agency/campaigns/{campaignId}"
    description: "Get a Campaign (computed earned/cost/roi reflect current children)"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/agency/campaigns"
    description: "List/filter Campaigns (reverse-reachability for Campaign.client_id)"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/agency/campaigns/{campaignId}/activate"
    description: "Activate (DRAFT/PAUSED -> ACTIVE)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/agency/campaigns/{campaignId}/pause"
    description: "Pause (ACTIVE -> PAUSED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status=PAUSED"]
  - method: POST
    path: "/agency/campaigns/{campaignId}/complete"
    description: "Complete (ACTIVE/PAUSED -> COMPLETED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status=COMPLETED; roi_ratio recomputed (campaign_roi)"]
  - method: POST
    path: "/agency/campaigns/{campaignId}/archive"
    description: "Archive (DRAFT/COMPLETED -> ARCHIVED) with depth-3 cascade"
    roles: [AccountManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status=ARCHIVED; cascade-campaign-archive (MediaList -> Pitch -> Interview)"]

  # ---- RetainerPeriod ----
  - method: POST
    path: "/agency/retainer-periods"
    description: "Open a RetainerPeriod for a client/month (snapshots cap and overage rate)"
    roles: [AccountManager]
    code: 201
    input: [client_id, period_month]
    output: RetainerPeriod
    side_effects: ["status=OPEN; hours_cap/overage_rate_cents snapshot from Client; hours_consumed=0; version=1"]
  - method: GET
    path: "/agency/retainer-periods/{retainerPeriodId}"
    description: "Get a RetainerPeriod (provisional/final totals computed)"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: RetainerPeriod
    side_effects: []
  - method: GET
    path: "/agency/retainer-periods"
    description: "List/filter RetainerPeriods (reverse-reachability for RetainerPeriod.client_id)"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: RetainerPeriod[]
    side_effects: []
  - method: POST
    path: "/agency/retainer-periods/{retainerPeriodId}/close"
    description: "Close a period (OPEN -> CLOSED); OCC-guarded by expected_retainer_period_version"
    roles: [AccountManager]
    code: 200
    input: [expected_retainer_period_version]
    output: RetainerPeriod
    side_effects: ["status=CLOSED; final_total_cents computed (retainer_billing variant=final); increments RetainerPeriod.version by 1"]

  # ---- TimeEntry ----
  - method: POST
    path: "/agency/time-entries"
    description: "Log a TimeEntry against an OPEN period"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator]
    code: 201
    input: [retainer_period_id, "campaign_id?", staff_id, work_type, billable_hours]
    output: TimeEntry
    side_effects: ["status=SUBMITTED; cost_cents set (retainer_billing provisional per-entry); RetainerPeriod.hours_consumed and provisional_total_cents recomputed"]
  - method: GET
    path: "/agency/time-entries/{timeEntryId}"
    description: "Get a TimeEntry"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []
  - method: GET
    path: "/agency/time-entries"
    description: "List/filter TimeEntries (reverse-reachability for retainer_period_id and campaign_id)"
    roles: [AccountManager, MediaSpecialist, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: ["retainer_period_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []
  - method: POST
    path: "/agency/time-entries/{timeEntryId}/approve"
    description: "Approve a TimeEntry (SUBMITTED -> APPROVED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: TimeEntry
    side_effects: ["status=APPROVED; Campaign.cost_basis_cents and RetainerPeriod.provisional_total_cents recomputed"]
  - method: POST
    path: "/agency/time-entries/{timeEntryId}/void"
    description: "Void a TimeEntry (SUBMITTED/APPROVED -> VOID); compensating credit to hours_consumed"
    roles: [AccountManager]
    code: 200
    input: []
    output: TimeEntry
    side_effects: ["status=VOID; RetainerPeriod.hours_consumed -= billable_hours; provisional_total_cents and Campaign.cost_basis_cents recomputed (conserved hours invariant)"]

  # ---- Spokesperson ----
  - method: POST
    path: "/agency/spokespersons"
    description: "Create a Spokesperson"
    roles: [AccountManager]
    code: 201
    input: [client_id, full_name, title, "prep_buffer_minutes?"]
    output: Spokesperson
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/agency/spokespersons/{spokespersonId}"
    description: "Get a Spokesperson"
    roles: [AccountManager, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Spokesperson
    side_effects: []
  - method: GET
    path: "/agency/spokespersons"
    description: "List/filter Spokespersons (reverse-reachability for Spokesperson.client_id)"
    roles: [AccountManager, SchedulingCoordinator, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Spokesperson[]
    side_effects: []
  - method: POST
    path: "/agency/spokespersons/{spokespersonId}/deactivate"
    description: "Deactivate (ACTIVE -> INACTIVE) with depth-2 cascade (Interview -> Pitch revert)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Spokesperson
    side_effects: ["status=INACTIVE; cascade-spokesperson-deactivate"]

  # ---- MediaList ----
  - method: POST
    path: "/agency/media-lists"
    description: "Create a MediaList for a campaign; supersedes the campaign's current ACTIVE list. OCC-guarded by expected_campaign_version."
    roles: [MediaSpecialist]
    code: 201
    input: [campaign_id, name, journalist_ids, expected_campaign_version]
    output: MediaList
    side_effects: ["status=ACTIVE; any prior ACTIVE MediaList for this campaign -> SUPERSEDED; increments Campaign.version by 1"]
  - method: GET
    path: "/agency/media-lists/{mediaListId}"
    description: "Get a MediaList"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: MediaList
    side_effects: []
  - method: GET
    path: "/agency/media-lists"
    description: "List/filter MediaLists (reverse-reachability for MediaList.campaign_id)"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: MediaList[]
    side_effects: []

  # ---- Pitch ----
  - method: POST
    path: "/agency/pitches"
    description: "Create a Pitch (status DRAFT); journalist must be in the media list"
    roles: [MediaSpecialist]
    code: 201
    input: [campaign_id, media_list_id, journalist_id, angle, "is_exclusive?"]
    output: Pitch
    side_effects: ["status=DRAFT; version=1"]
  - method: GET
    path: "/agency/pitches/{pitchId}"
    description: "Get a Pitch"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: Pitch
    side_effects: []
  - method: GET
    path: "/agency/pitches"
    description: "List/filter Pitches (reverse-reachability for campaign_id, media_list_id, journalist_id)"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "media_list_id?", "journalist_id?", "status?", "limit?", "offset?"]
    output: Pitch[]
    side_effects: []
  - method: POST
    path: "/agency/pitches/{pitchId}/send"
    description: "Send a Pitch (DRAFT -> SENT)"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Pitch
    side_effects: ["status=SENT; sent_at=clock"]
  - method: POST
    path: "/agency/pitches/{pitchId}/respond"
    description: "Mark journalist responded (SENT -> RESPONDED)"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Pitch
    side_effects: ["status=RESPONDED"]
  - method: POST
    path: "/agency/pitches/{pitchId}/accept"
    description: "Accept (RESPONDED -> ACCEPTED) — BRANCH A"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Pitch
    side_effects: ["status=ACCEPTED"]
  - method: POST
    path: "/agency/pitches/{pitchId}/reject"
    description: "Reject (RESPONDED -> REJECTED) — BRANCH B; may exhaust MediaList"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Pitch
    side_effects: ["status=REJECTED; MediaList -> EXHAUSTED if list_open_count==0 (bubble-up)"]
  - method: POST
    path: "/agency/pitches/{pitchId}/decline"
    description: "Decline (SENT -> DECLINED); may exhaust MediaList"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Pitch
    side_effects: ["status=DECLINED; MediaList -> EXHAUSTED if list_open_count==0 (bubble-up)"]

  # ---- PressRelease ----
  - method: POST
    path: "/agency/press-releases"
    description: "Create a PressRelease (status DRAFT)"
    roles: [MediaSpecialist]
    code: 201
    input: [campaign_id, headline, embargo_until]
    output: PressRelease
    side_effects: ["status=DRAFT; version=1"]
  - method: GET
    path: "/agency/press-releases/{pressReleaseId}"
    description: "Get a PressRelease"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: PressRelease
    side_effects: []
  - method: GET
    path: "/agency/press-releases"
    description: "List/filter PressReleases (reverse-reachability for PressRelease.campaign_id)"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: PressRelease[]
    side_effects: []
  - method: POST
    path: "/agency/press-releases/{pressReleaseId}/schedule"
    description: "Schedule (DRAFT -> SCHEDULED); embargo must be in the future"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: PressRelease
    side_effects: ["status=SCHEDULED"]
  - method: POST
    path: "/agency/press-releases/{pressReleaseId}/release"
    description: "Release (SCHEDULED -> RELEASED) after embargo lifts; delivers queued distributions"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: PressRelease
    side_effects: ["status=RELEASED; released_at=clock; QUEUED Distributions -> DELIVERED"]
  - method: POST
    path: "/agency/press-releases/{pressReleaseId}/withdraw"
    description: "Withdraw (DRAFT/SCHEDULED -> WITHDRAWN); bounces queued distributions"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: PressRelease
    side_effects: ["status=WITHDRAWN; QUEUED Distributions -> BOUNCED"]

  # ---- Distribution ----
  - method: POST
    path: "/agency/distributions"
    description: "Queue a Distribution of a release to a journalist (status QUEUED); journalist must be in a media list of the release's campaign and release must be DRAFT or SCHEDULED"
    roles: [MediaSpecialist]
    code: 201
    input: [press_release_id, journalist_id]
    output: Distribution
    side_effects: ["status=QUEUED"]
  - method: GET
    path: "/agency/distributions/{distributionId}"
    description: "Get a Distribution"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects: []
  - method: GET
    path: "/agency/distributions"
    description: "List/filter Distributions (reverse-reachability for press_release_id, journalist_id)"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: ["press_release_id?", "journalist_id?", "status?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  # ---- Coverage ----
  - method: POST
    path: "/agency/coverage"
    description: "Log a Coverage clip (status DRAFT); estimated_media_value_cents computed at logging"
    roles: [MediaSpecialist]
    code: 201
    input: [campaign_id, journalist_id, "pitch_id?", headline, published_at, sentiment, prominence]
    output: Coverage
    side_effects: ["status=DRAFT; estimated_media_value_cents computed (media_value variant=estimated); media_value_cents=0; version=1"]
  - method: GET
    path: "/agency/coverage/{coverageId}"
    description: "Get a Coverage clip"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: Coverage
    side_effects: []
  - method: GET
    path: "/agency/coverage"
    description: "List/filter Coverage (reverse-reachability for campaign_id, journalist_id, pitch_id)"
    roles: [AccountManager, MediaSpecialist, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "journalist_id?", "pitch_id?", "status?", "limit?", "offset?"]
    output: Coverage[]
    side_effects: []
  - method: POST
    path: "/agency/coverage/{coverageId}/verify"
    description: "Verify (DRAFT -> VERIFIED); freezes media_value_cents and credits campaign/client ledgers"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Coverage
    side_effects: ["status=VERIFIED; media_value_cents frozen (media_value variant=verified); Campaign.earned_media_value_cents += ; Client.lifetime_earned_media_cents += ; Campaign.roi_ratio recomputed"]
  - method: POST
    path: "/agency/coverage/{coverageId}/retract"
    description: "Retract (DRAFT/VERIFIED -> RETRACTED); reverses ledger contribution if it was VERIFIED"
    roles: [MediaSpecialist]
    code: 200
    input: []
    output: Coverage
    side_effects: ["status=RETRACTED; if was VERIFIED: Campaign.earned_media_value_cents -= ; Client.lifetime_earned_media_cents -= ; media_value_cents=0; Campaign.roi_ratio recomputed"]

  # ---- Interview ----
  - method: POST
    path: "/agency/interviews"
    description: "Create an Interview request (status REQUESTED); checks spokesperson + journalist overlap"
    roles: [SchedulingCoordinator]
    code: 201
    input: [campaign_id, spokesperson_id, journalist_id, "pitch_id?", starts_at, ends_at]
    output: Interview
    side_effects: ["status=REQUESTED; version=1"]
  - method: GET
    path: "/agency/interviews/{interviewId}"
    description: "Get an Interview"
    roles: [AccountManager, SchedulingCoordinator, MediaSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: GET
    path: "/agency/interviews"
    description: "List/filter Interviews (reverse-reachability for campaign_id, spokesperson_id, journalist_id, pitch_id)"
    roles: [AccountManager, SchedulingCoordinator, MediaSpecialist, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "spokesperson_id?", "journalist_id?", "pitch_id?", "status?", "limit?", "offset?"]
    output: Interview[]
    side_effects: []
  - method: POST
    path: "/agency/interviews/{interviewId}/reschedule"
    description: "Reschedule (REQUESTED -> REQUESTED) with new times; re-checks overlaps"
    roles: [SchedulingCoordinator]
    code: 200
    input: [starts_at, ends_at]
    output: Interview
    side_effects: ["starts_at/ends_at updated; status stays REQUESTED"]
  - method: POST
    path: "/agency/interviews/{interviewId}/confirm"
    description: "Confirm (REQUESTED -> CONFIRMED); requires accepted pitch if pitch-anchored"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Interview
    side_effects: ["status=CONFIRMED"]
  - method: POST
    path: "/agency/interviews/{interviewId}/complete"
    description: "Complete (CONFIRMED -> COMPLETED); only after ends_at"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Interview
    side_effects: ["status=COMPLETED"]
  - method: POST
    path: "/agency/interviews/{interviewId}/no-show"
    description: "Mark no-show (CONFIRMED -> NO_SHOW); only after starts_at"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Interview
    side_effects: ["status=NO_SHOW"]
  - method: POST
    path: "/agency/interviews/{interviewId}/cancel"
    description: "Cancel (REQUESTED/CONFIRMED -> CANCELLED)"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Interview
    side_effects: ["status=CANCELLED"]

  # ---- CrisisEvent ----
  - method: POST
    path: "/agency/crisis-events"
    description: "Open a CrisisEvent (severity_status=ASSESSING, response_status=DRAFTING)"
    roles: [AccountManager]
    code: 201
    input: [client_id, "campaign_id?", summary, severity, "holding_statement?"]
    output: CrisisEvent
    side_effects: ["severity_status=ASSESSING; response_status=DRAFTING; version=1"]
  - method: GET
    path: "/agency/crisis-events/{crisisId}"
    description: "Get a CrisisEvent"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: CrisisEvent
    side_effects: []
  - method: GET
    path: "/agency/crisis-events"
    description: "List/filter CrisisEvents (reverse-reachability for client_id, campaign_id)"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["client_id?", "campaign_id?", "limit?", "offset?"]
    output: CrisisEvent[]
    side_effects: []
  - method: POST
    path: "/agency/crisis-events/{crisisId}/escalate"
    description: "Escalate severity dimension (ASSESSING -> ESCALATED); HIGH/CRITICAL only"
    roles: [AccountManager]
    code: 200
    input: []
    output: CrisisEvent
    side_effects: ["severity_status=ESCALATED"]
  - method: POST
    path: "/agency/crisis-events/{crisisId}/contain"
    description: "Contain severity dimension (ASSESSING/ESCALATED -> CONTAINED); requires response PUBLISHED"
    roles: [AccountManager]
    code: 200
    input: []
    output: CrisisEvent
    side_effects: ["severity_status=CONTAINED"]
  - method: POST
    path: "/agency/crisis-events/{crisisId}/approve-response"
    description: "Approve response dimension (DRAFTING -> APPROVED); requires holding_statement"
    roles: [AccountManager]
    code: 200
    input: ["holding_statement?"]
    output: CrisisEvent
    side_effects: ["response_status=APPROVED; holding_statement set if provided"]
  - method: POST
    path: "/agency/crisis-events/{crisisId}/publish-response"
    description: "Publish response dimension (APPROVED -> PUBLISHED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: CrisisEvent
    side_effects: ["response_status=PUBLISHED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "An FK field in the request body references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, bad enum, or out-of-range value (billable_hours<=0, ends_at<=starts_at, bad period_month)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_CAMPAIGN_VERSION, http: 412, condition: "expected_campaign_version does not match current Campaign.version on media-list create" }
  - { id: ERR_STALE_PERIOD_VERSION, http: 412, condition: "expected_retainer_period_version does not match current RetainerPeriod.version on close" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Owning Client is SUSPENDED; campaign activation blocked" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Operation requires Campaign.status==ACTIVE (pitch send/respond, press-release schedule)" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_PITCHES, http: 409, condition: "Cannot complete campaign with Pitches in SENT or RESPONDED" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_INTERVIEWS, http: 409, condition: "Cannot complete campaign with Interviews in REQUESTED or CONFIRMED" }
  - { id: ERR_JOURNALIST_BLOCKLISTED, http: 409, condition: "Journalist is BLOCKLISTED; cannot be pitched or scheduled" }
  - { id: ERR_JOURNALIST_NOT_IN_LIST, http: 409, condition: "Pitch journalist not in MediaList.journalist_ids; or Distribution journalist not in any media list of the release's campaign" }
  - { id: ERR_MEDIA_LIST_NOT_ACTIVE, http: 409, condition: "Pitch send requires its MediaList.status==ACTIVE" }
  - { id: ERR_EMBARGO_IN_PAST, http: 422, condition: "embargo_until is at or before the current logical clock at schedule time" }
  - { id: ERR_EMBARGO_NOT_LIFTED, http: 409, condition: "Release attempted before embargo_until" }
  - { id: ERR_NO_DISTRIBUTIONS, http: 409, condition: "Release attempted with no Distribution rows for the release" }
  - { id: ERR_SPOKESPERSON_DOUBLE_BOOKED, http: 409, condition: "Interview interval overlaps another non-terminal interview for the spokesperson (within prep buffer)" }
  - { id: ERR_JOURNALIST_DOUBLE_BOOKED, http: 409, condition: "Interview interval overlaps another non-terminal interview for the journalist (half-open)" }
  - { id: ERR_SPOKESPERSON_INACTIVE, http: 409, condition: "Confirm requires Spokesperson.status==ACTIVE" }
  - { id: ERR_PITCH_NOT_ACCEPTED, http: 409, condition: "Pitch-anchored interview confirm requires the Pitch.status==ACCEPTED" }
  - { id: ERR_INTERVIEW_NOT_ENDED, http: 409, condition: "Complete attempted before ends_at" }
  - { id: ERR_INTERVIEW_NOT_STARTED, http: 409, condition: "No-show attempted before starts_at" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Time entry logged against a CLOSED RetainerPeriod" }
  - { id: ERR_PERIOD_HAS_PENDING_ENTRIES, http: 409, condition: "Close attempted while period has SUBMITTED TimeEntries" }
  - { id: ERR_DISTRIBUTION_RELEASE_LOCKED, http: 409, condition: "Distribution create attempted on a PressRelease that is RELEASED or WITHDRAWN" }
  - { id: ERR_SEVERITY_TOO_LOW, http: 409, condition: "Escalate attempted on a crisis whose severity is LOW or MEDIUM" }
  - { id: ERR_RESPONSE_NOT_PUBLISHED, http: 409, condition: "Contain attempted before response_status==PUBLISHED" }
  - { id: ERR_NO_HOLDING_STATEMENT, http: 409, condition: "Approve-response attempted with no holding_statement on the crisis" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "RetainerPeriod already exists for this client and period_month" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns the client relationship surface: clients (create), campaigns, retainer periods, time-entry approval/void, spokespersons, crisis-comms."
    identity: "opaque"
    exclusive_operations:
      - "POST /agency/campaigns and all campaign lifecycle (activate/pause/complete/archive)"
      - "POST /agency/retainer-periods and /close"
      - "POST /agency/time-entries/{id}/approve and /void"
      - "POST /agency/spokespersons and /deactivate"
      - "POST /agency/crisis-events and all crisis transitions"
    shared_operations:
      - "POST /agency/clients (with PlatformAdmin)"
      - "POST /agency/time-entries (with MediaSpecialist, SchedulingCoordinator)"
      - "GET reads across clients, campaigns, retainer-periods, time-entries, spokespersons, crisis-events, etc."

  - name: MediaSpecialist
    description: "Owns the earned-media surface: journalists, media lists, pitches, press releases, distributions, coverage."
    identity: "opaque"
    exclusive_operations:
      - "POST /agency/media-lists"
      - "POST /agency/pitches and all pitch transitions (send/respond/accept/reject/decline)"
      - "POST /agency/press-releases and all release transitions (schedule/release/withdraw)"
      - "POST /agency/distributions"
      - "POST /agency/coverage and verify/retract"
      - "POST /agency/journalists and /blocklist"
    shared_operations:
      - "POST /agency/time-entries (with AccountManager, SchedulingCoordinator)"
      - "GET reads across journalists, media-lists, pitches, press-releases, distributions, coverage, etc."

  - name: SchedulingCoordinator
    description: "Owns interview scheduling: interview create and all interview transitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /agency/interviews and all interview transitions (reschedule/confirm/complete/no-show/cancel)"
    shared_operations:
      - "POST /agency/time-entries (with AccountManager, MediaSpecialist)"
      - "GET reads across interviews, campaigns, spokespersons, journalists, etc."

  - name: PlatformAdmin
    description: "Operator/superuser: reference data (outlets, journalists), client suspension, and the logical clock. Opaque operator id not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /agency/_clock/set_current_utc"
      - "POST /agency/outlets"
      - "POST /agency/clients/{id}/suspend"
    shared_operations:
      - "POST /agency/clients (with AccountManager)"
      - "POST /agency/journalists and /blocklist (with MediaSpecialist)"
      - "GET reads across all collections"
