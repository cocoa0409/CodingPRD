          assert:
            - "cash_before == 0"
            - "cash_mid == 250000"
            - "cash_after == cash_before   # conserved quantity restored exactly"

      - name: reopen_reallow_preserves_allowed_register_total
        grounds:
          - state_machines.Claim.ALLOWED_to_UNDER_REVIEW
          - entities.Case.fields.allowed_claims_total_cents
        distinguishing_aspect: |
