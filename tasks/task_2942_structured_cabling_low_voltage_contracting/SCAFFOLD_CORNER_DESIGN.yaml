              payload: { rack_id: "${rack}", equipment_label: "CORE-SW-1", start_ru: 40, end_ru: 42, power_va: 1200, expected_rack_version: "${rack_v1}" }
              as: DesignEngineer
              captures: { assign1: $.data.id }
            - call: "POST /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", equipment_label: "PATCH-P-1", start_ru: 36, end_ru: 37, power_va: 0, expected_rack_version: "${rack_v1}" }
              as: DesignEngineer
              captures: { err: $.data.error_id }
            - call: "GET /cabling/racks/${rack}"
