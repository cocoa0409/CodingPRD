# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts are pre-computed
# literals (see the round_half_up computations pinned inline).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: attendance_rate_recorded_vs_official
        grounds:
          - calculations.student_attendance_rate
          - entities.Student.fields.attendance_rate_recorded
          - entities.Student.fields.attendance_rate_official
        distinguishing_aspect: >
          Same student, two denominators: recorded-basis (days actually recorded)
          gives 50.00 while official-basis (required_instructional_days=180) gives
          98.33 — the divergence lives on the Student entity domain.
        test_recipe:
          setup:
            - "School with required_instructional_days=180 (other thresholds default)."
            - "Student grade 9, with 3 PRESENT, 1 EXCUSED, 2 UNEXCUSED records on distinct dates."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Rate School", required_instructional_days: 180 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ada Rate", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "PRESENT" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "PRESENT" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "PRESENT" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-04", status: "EXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-05", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-06", status: "UNEXCUSED" }
              as: Administrator
          trigger:
            - call: "GET /students/${sid}"
              as: Administrator
              captures: { rr: "$.data.attendance_rate_recorded", ro: "$.data.attendance_rate_official" }
          assert:
            - "Student.${sid}.attendance_rate_recorded == 50.00"   # 3/(3+3)*100
            - "Student.${sid}.attendance_rate_official == 98.33"   # (180-1-2)/180*100
            - "Student.${sid}.attendance_rate_recorded != Student.${sid}.attendance_rate_official"

      - name: contract_score_actual_vs_projected
        grounds:
          - calculations.contract_compliance_score
          - entities.AttendanceContract.fields.compliance_score_actual
          - entities.AttendanceContract.fields.compliance_score_projected
        distinguishing_aspect: >
          Same goal set, two algorithms on the AttendanceContract domain: actual
          uses real met_value giving 25.00; projected treats the not-started goal
          (met_value=0) as fully met giving 75.00.
        test_recipe:
          setup:
            - "A case with a PROPOSED contract whose goals are {w1,t10,m0} and {w1,t4,m2}."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Score School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ben Score", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id", case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Daily attendance", weight: 1, target_value: 10, met_value: 0 }
                  - { description: "Tutoring sessions", weight: 1, target_value: 4, met_value: 2 }
                expected_case_version: "${case_v}"
              as: Administrator
              captures: { contract_id: "$.data.id" }
          trigger:
            - call: "GET /cases/${cid}/contracts"
              as: Administrator
          assert:
            - "AttendanceContract.${contract_id}.compliance_score_actual == 25.00"      # line1 round(0*0.5*100)=0.00 + line2 round(0.5*0.5*100)=25.00
            - "AttendanceContract.${contract_id}.compliance_score_projected == 75.00"   # line1 round(1*0.5*100)=50.00 + line2 25.00

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tier_determination_nonlinear
        grounds:
          - calculations.case_tier_determination
          - entities.Student.fields.grade_level
          - entities.School.fields.tier1_unexcused_threshold
          - state_machines.TruancyCase
        distinguishing_aspect: >
          Mode (a): tier is a non-linear function of >=3 inputs (unexcused_count,
          grade band, school thresholds). An ELEMENTARY student (grade 3, adj=1)
          reaches TIER_1 at unexcused_count=1 against threshold 2, whereas a
          SECONDARY student at the same count/threshold stays NONE.
        test_recipe:
          setup:
            - "School tier1_unexcused_threshold=2; grade-3 (ELEMENTARY) student; a NONE-tier case."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Elem School", tier1_unexcused_threshold: 2, tier2_unexcused_threshold: 4, tier3_unexcused_threshold: 6, court_unexcused_threshold: 8 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Cara Kid", grade_level: 3 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
          trigger:
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
          assert:
            - "TruancyCase.${cid}.tier == TIER_1"   # effective tier1 threshold = 2 - 1(elementary adj) = 1; u=1 meets it

      - name: contract_score_rounding_order
        grounds:
          - calculations.contract_compliance_score
          - entities.AttendanceContract.fields.compliance_score_actual
        distinguishing_aspect: >
          Mode (b): pinned round-per-line-then-sum — each weighted per-goal
          percentage is rounded to 2 dp then summed — yields 99.99 for three equal
          fully-met goals; the naive sum-then-round-once order would give 100.00.
        test_recipe:
          setup:
            - "A case with a PROPOSED contract whose goals are three equal {w1,t1,m1} (all fully met)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Round School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Dee Round", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id", case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Goal one", weight: 1, target_value: 1, met_value: 1 }
                  - { description: "Goal two", weight: 1, target_value: 1, met_value: 1 }
                  - { description: "Goal three", weight: 1, target_value: 1, met_value: 1 }
                expected_case_version: "${case_v}"
              as: Administrator
              captures: { contract_id: "$.data.id" }
          trigger:
            - call: "GET /cases/${cid}/contracts"
              as: Administrator
          assert:
            - "AttendanceContract.${contract_id}.compliance_score_actual == 99.99"   # 3 x round(100/3,2)=33.33 summed; NOT the sum-then-round 100.00

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_parallel_tier_status_dimensions
        grounds:
          - state_machines.TruancyCase
          - entities.TruancyCase.fields.tier
          - entities.TruancyCase.fields.status
        distinguishing_aspect: >
          TruancyCase carries two independent dimensions on one row: after
          reaching tier TIER_2 via absences, moving status OPEN->MONITORING leaves
          tier at TIER_2 — the dimensions evolve independently (parallel shape).
        test_recipe:
          setup:
            - "Low-threshold school; assigned case advanced to tier TIER_2 by 2 UNEXCUSED; a HELD conference exists."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Parallel School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Case Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Eli Par", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf_id: "$.data.id" }
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/transition"
              payload: { to_status: "MONITORING" }
              as: Administrator
              captures: { st: "$.data.status", ti: "$.data.tier" }
          assert:
            - "TruancyCase.${cid}.status == MONITORING"
            - "TruancyCase.${cid}.tier == TIER_2"   # status advance did not touch tier

      - name: contract_breach_cure_cycle
        grounds:
          - state_machines.AttendanceContract
          - entities.AttendanceContract.fields.status
        distinguishing_aspect: >
          The AttendanceContract machine revisits a prior state: ACTIVE->BREACHED
          ->ACTIVE (cure loop) is a cycle, so the contract machine is non-linear
          on a different entity than TruancyCase.
        test_recipe:
          setup:
            - "A case with a HELD conference and an ACTIVE contract."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cure School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Cure Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Fay Cure", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf_id: "$.data.id" }
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
            - call: "GET /cases/${cid}"
              as: Administrator
              captures: { case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Plan goal", weight: 1, target_value: 1, met_value: 0 }
                expected_case_version: "${case_v}"
              as: Administrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "BREACHED" }
              as: Administrator
              captures: { s1: "$.data.status" }
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Administrator
              captures: { s2: "$.data.status" }
          assert:
            - "after the first trigger call AttendanceContract.${contract_id}.status == BREACHED"
            - "after the second trigger call AttendanceContract.${contract_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: record_to_tier_to_referral
        grounds:
          - state_machines.AttendanceRecord
          - state_machines.TruancyCase
          - entities.ServiceReferral.fields.auto_created
          - calculations.student_unexcused_tally
        distinguishing_aspect: >
          Depth-3: one UNEXCUSED POST increments Student.unexcused_count, which
          raises TruancyCase.tier TIER_1->TIER_2, whose entry auto-creates a
          MENTOR ServiceReferral — each hop caused by the prior, trigger is an
          attendance record.
        test_recipe:
          setup:
            - "Low-threshold school; a NONE-tier case; one UNEXCUSED already recorded (tier TIER_1)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cascade School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Gus Casc", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
          trigger:
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
              captures: { rec2: "$.data.id" }
          assert:
            - "TruancyCase.${cid}.tier == TIER_2"
            - "GET /cases/${cid}/service-referrals returns exactly 1 ServiceReferral with service_type == MENTOR and auto_created == true"

      - name: compliance_to_breach_to_tier
        grounds:
          - state_machines.AttendanceContract
          - state_machines.TruancyCase
          - entities.TruancyCase.fields.breach_count
        distinguishing_aspect: >
          Depth-2 from a different trigger (compliance-check): NON_COMPLIANT moves
          the ACTIVE contract to BREACHED, and that breach (not the check itself)
          advances TruancyCase.tier TIER_1->TIER_2.
        test_recipe:
          setup:
            - "Low-threshold school; case at tier TIER_1 (1 UNEXCUSED), assigned, HELD conference, ACTIVE contract."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Breach School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Breach Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Hal Breach", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf_id: "$.data.id" }
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
            - call: "GET /cases/${cid}"
              as: Administrator
              captures: { case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Plan goal", weight: 1, target_value: 1, met_value: 0 }
                expected_case_version: "${case_v}"
              as: Administrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/compliance-checks"
              payload: { check_date: "2026-09-15", result: "NON_COMPLIANT" }
              as: Administrator
          assert:
            - "AttendanceContract.${contract_id}.status == BREACHED"
            - "TruancyCase.${cid}.tier == TIER_2"
            - "TruancyCase.${cid}.breach_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: clerk_transition_unauthorized_beats_invalid_state
        grounds:
          - validations[priority=2]
          - validations[priority=7]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          Pair {auth, state}: an AttendanceClerk (unauthorized) requests an also-
          invalid transition (OPEN->CLOSED). Auth (priority 2) wins over the state
          check (priority 7): ERR_UNAUTHORIZED, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "An OPEN case (from which CLOSED is not a valid direct transition)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Prio School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ivy Prio", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/transition"
              payload: { to_status: "CLOSED" }
              as: AttendanceClerk
              as_user_id: "clerk-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403 (auth priority 2 beats state priority 7)"

      - name: contract_activate_invalid_state_beats_no_conference
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_CONFERENCE_HELD]
        distinguishing_aspect: >
          Pair {state, business_referential}: activating a CANCELLED contract on a
          case with no HELD conference violates both; the state check (priority 7)
          wins → ERR_INVALID_STATE, not ERR_NO_CONFERENCE_HELD (priority 8).
        test_recipe:
          setup:
            - "A case with a contract that has been CANCELLED; no conference ever held."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Prio2 School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Jon Prio", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id", case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Plan goal", weight: 1, target_value: 1, met_value: 0 }
                expected_case_version: "${case_v}"
              as: Administrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409 (state priority 7 beats business_referential priority 8)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: court_tier_threshold_exact
        grounds:
          - calculations.case_tier_determination
          - entities.School.fields.court_unexcused_threshold
          - state_machines.TruancyCase
        distinguishing_aspect: >
          Numeric >= boundary on unexcused_count via POST attendance-records: with
          court_unexcused_threshold=4, unexcused_count=4 flips tier to
          COURT_REFERRED; 3 leaves it at TIER_3.
        test_recipe:
          setup:
            - "Low-threshold school (court=4); NONE-tier case; 3 UNEXCUSED already recorded (tier TIER_3)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Bound School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Kim Bound", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "UNEXCUSED" }
              as: Administrator
          trigger:
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-04", status: "UNEXCUSED" }
              as: Administrator
          assert:
            - "TruancyCase.${cid}.tier == COURT_REFERRED"   # exactly u==4 (>= court threshold); u==3 was TIER_3

      - name: attendance_rate_empty_records_null
        grounds:
          - calculations.student_attendance_rate
          - entities.Student.fields.attendance_rate_recorded
        distinguishing_aspect: >
          Empty-collection edge on a different metric/endpoint: a student with zero
          non-voided records has attendance_rate_recorded == null (division-by-zero
          guarded), observed via GET /students/{id}.
        test_recipe:
          setup:
            - "A freshly created student with no attendance records."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Empty School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Lee Empty", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
          trigger:
            - call: "GET /students/${sid}"
              as: Administrator
              captures: { rr: "$.data.attendance_rate_recorded" }
          assert:
            - "Student.${sid}.attendance_rate_recorded == null"
            - "Student.${sid}.present_count == 0 and Student.${sid}.unexcused_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: citation_requires_court_tier
        grounds:
          - validations[priority=8]
          - errors[ERR_CASE_NOT_COURT_ELIGIBLE]
          - entities.TruancyCase.fields.tier
          - entities.CourtCitation.fields.status
        distinguishing_aspect: >
          Pair (CourtCitation, TruancyCase): a citation may be filed only when the
          parent case.tier == COURT_REFERRED; with the case at COURT_REFERRED the
          filing succeeds (status SCHEDULED).
        test_recipe:
          setup:
            - "Low-threshold school; a case driven to tier COURT_REFERRED by 4 UNEXCUSED; an OFFICER staff exists."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Court School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Off One", role_type: "OFFICER" }
              as: Administrator
              captures: { officer_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia Court", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-04", status: "UNEXCUSED" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/court-citations"
              payload: { courtroom_id: "CR-1", hearing_start: "2026-10-01T09:00:00Z", hearing_end: "2026-10-01T10:00:00Z" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { cit_id: "$.data.id", st: "$.data.status" }
          assert:
            - "TruancyCase.${cid}.tier == COURT_REFERRED"
            - "CourtCitation.${cit_id}.status == SCHEDULED"

      - name: contract_active_requires_held_conference
        grounds:
          - validations[priority=8]
          - errors[ERR_NO_CONFERENCE_HELD]
          - state_machines.Conference
          - state_machines.AttendanceContract
        distinguishing_aspect: >
          Pair (AttendanceContract, Conference): a contract moves to ACTIVE only
          when a sibling Conference on the same case is HELD; with a HELD
          conference the activation succeeds.
        test_recipe:
          setup:
            - "A case with an assigned staff, a HELD conference, and a PROPOSED contract."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Conf School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Conf Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ned Conf", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf_id: "$.data.id" }
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
            - call: "GET /cases/${cid}"
              as: Administrator
              captures: { case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Plan goal", weight: 1, target_value: 1, met_value: 0 }
                expected_case_version: "${case_v}"
              as: Administrator
              captures: { contract_id: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Administrator
              captures: { st: "$.data.status" }
          assert:
            - "AttendanceContract.${contract_id}.status == ACTIVE"
            - "Conference ${conf_id} is in status HELD, satisfying the cross-entity gate"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: conference_staff_adjacency_overlap
        grounds:
          - calculations.conference_overlap_check
          - errors[ERR_CONFERENCE_OVERLAP]
          - entities.TruancyCase.fields.assigned_staff_id
        distinguishing_aspect: >
          Half-open [start,end) overlap on the case's assigned staff: a second
          conference [10:30,11:30) collides with an existing [10:00,11:00); a
          touching [11:00,12:00) would NOT collide (adjacency allowed).
        test_recipe:
          setup:
            - "An assigned case with a SCHEDULED conference 2026-09-10T10:00Z-11:00Z."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Ovl School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Ovl Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ola Ovl", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf1_id: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:30:00Z", scheduled_end: "2026-09-10T11:30:00Z" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_CONFERENCE_OVERLAP"
            - "HTTP status == 409"

      - name: hearing_courtroom_buffer_overlap
        grounds:
          - calculations.hearing_overlap_check
          - errors[ERR_HEARING_OVERLAP]
          - entities.CourtCitation.fields.courtroom_id
        distinguishing_aspect: >
          Buffered overlap (30-min pad) on courtroom_id — a different interval
          geometry and resource than the conference rule: a hearing starting 20
          min after another's end in the same courtroom collides; a 30-min gap
          would not.
        test_recipe:
          setup:
            - "A COURT_REFERRED case with a SCHEDULED citation in courtroom CR-2 09:00Z-10:00Z."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Hear School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Hear Off", role_type: "OFFICER" }
              as: Administrator
              captures: { officer_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Pat Hear", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-04", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /cases/${cid}/court-citations"
              payload: { courtroom_id: "CR-2", hearing_start: "2026-10-05T09:00:00Z", hearing_end: "2026-10-05T10:00:00Z" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { cit1_id: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/court-citations"
              payload: { courtroom_id: "CR-2", hearing_start: "2026-10-05T10:20:00Z", hearing_end: "2026-10-05T11:00:00Z" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_HEARING_OVERLAP"
            - "HTTP status == 409 (20-min gap < 30-min buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: caseload_conserved_on_reassign
        grounds:
          - calculations.staff_active_caseload
          - entities.Staff.fields.active_caseload
          - state_machines.TruancyCase
        distinguishing_aspect: >
          Conserved quantity = total assigned open caseload. Reassigning a case
          from staff1 to staff2 decrements staff1 (->0) and increments staff2
          (->1); the sum stays 1.
        test_recipe:
          setup:
            - "Two CASE_MANAGER staff; one OPEN case assigned to staff1."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Load School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Mgr One", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff1: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Mgr Two", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff2: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Quin Load", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff1}" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff2}" }
              as: Administrator
          assert:
            - "Staff.${staff1}.active_caseload == 0"
            - "Staff.${staff2}.active_caseload == 1"
            - "sum of active_caseload across all staff == 1 (== count of OPEN/MONITORING assigned cases)"

      - name: unexcused_tally_conserved_on_reclassify
        grounds:
          - calculations.student_unexcused_tally
          - state_machines.AttendanceRecord
          - entities.Student.fields.unexcused_count
        distinguishing_aspect: >
          Conserved quantity = unexcused tally. Reclassifying the only UNEXCUSED
          record to EXCUSED is the compensating action; unexcused_count returns to
          0 and still equals the count of UNEXCUSED records.
        test_recipe:
          setup:
            - "A student with a single UNEXCUSED record (unexcused_count=1)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Tally School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ravi Tally", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
              captures: { rec_id: "$.data.id" }
          trigger:
            - call: "POST /students/${sid}/attendance-records/${rec_id}/reclassify"
              payload: { to_status: "EXCUSED" }
              as: Administrator
              captures: { st: "$.data.status" }
          assert:
            - "AttendanceRecord.${rec_id}.status == EXCUSED"
            - "Student.${sid}.unexcused_count == 0 and Student.${sid}.excused_count == 1"
