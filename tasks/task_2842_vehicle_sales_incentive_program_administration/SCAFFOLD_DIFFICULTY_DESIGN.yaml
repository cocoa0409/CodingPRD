            - "LINK 4: ${accrued_after} == -80000, from the single appended REVERSAL row of 80000 against a zero accrual base"
            - "${units_after_prog} == 0 and ${spend_after} == 0 because a STAIR_STEP_BONUS claim is not a UNIT_INCENTIVE claim"
            - "${status_after} == REVISED, so the objective must be re-finalized before another stair-step claim can be adjudicated"
            - "Dealer.${dealer_id}.paid_cents == 30000 and Dealer.${dealer_id}.open_chargeback_cents == 80000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_program_state_error_outranks_live_budget_exhaustion
        grounds:
          - validations.priority_11_ERR_PROGRAM_NOT_ACTIVE
          - validations.priority_31_ERR_PROGRAM_BUDGET_EXHAUSTED
          - state_machines.IncentiveProgram.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Category pair state (priority 11, 409) versus business_fiscal (priority 31, 402) on the
          SAME endpoint POST /incentives/claims/{id}/adjudicate. Both conditions are violated by
          claim A, and the twin claim B — identical in every respect except that its program is
          still ACTIVE — proves the fiscal violation was genuinely live rather than masked.
        test_recipe:
          setup:
            - "Two CUSTOMER_CASH programs with IDENTICAL windows [2026-08-01, 2026-09-01), per_unit_amount_cents 150000 and budget_cents 100000 (deliberately under one unit of spend), differing only in eligibility footprint: PPC-A covers model MX5, PPC-B covers model TRK9, so validations[priority=12] never fires between them."
            - "Dealer D-810, ACTIVE, region WEST."
            - "Two VALIDATED deliveries for D-810: one MX5 (claim A on PPC-A) and one TRK9 (claim B on PPC-B), both sale_date 2026-08-06, both inside both windows."
            - "Both claims are SUBMITTED and UNPAID; neither has been adjudicated, so both programs still have committed_cents == 0."
            - "PPC-A is then CLOSED (permitted: none of its claims has payment_status == SCHEDULED). Closing does NOT reject SUBMITTED claims — only the ACTIVE -> SUPERSEDED edge does that — so claim A survives in SUBMITTED and reaches the adjudication validation chain."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-810", name: "Coldbrook Auto Group", region_code: "WEST", historical_volume_units: 6, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "PPC-A", name: "Priority Pair Cash A", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 150000, budget_cents: 100000, stack_group: "PPC", priority_rank: 61, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_a: $.data.id }
            - call: "POST /incentives/programs/${prog_a}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_a}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_a}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "PPC-B", name: "Priority Pair Cash B", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 150000, budget_cents: 100000, stack_group: "PPC", priority_rank: 62, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_b: $.data.id }
            - call: "POST /incentives/programs/${prog_b}/eligibility-rules"
              payload: { model_code: "TRK9", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_b}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_b}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842PPC000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-10T00:00:00.000Z", msrp_cents: 3200000, sale_date: "2026-08-06T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_a: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842PPC000002", model_code: "TRK9", trim_code: "BASE", build_date: "2026-06-11T00:00:00.000Z", msrp_cents: 5400000, sale_date: "2026-08-06T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_b: $.data.id }
            - call: "POST /incentives/deliveries/${del_a}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${del_b}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "GET /incentives/programs/${prog_a}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { va: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_a}", program_id: "${prog_a}", claimed_amount_cents: 150000, expected_program_version: "${va}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_a: $.data.id }
            - call: "GET /incentives/programs/${prog_b}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { vb: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_b}", program_id: "${prog_b}", claimed_amount_cents: 150000, expected_program_version: "${vb}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_b: $.data.id }
            - call: "POST /incentives/programs/${prog_a}/close"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { a_status: $.data.status }
            - call: "GET /incentives/claims/${claim_a}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { claim_a_vs_before: $.data.validation_status }
          trigger:
            - call: "POST /incentives/claims/${claim_a}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
            - call: "GET /incentives/claims/${claim_a}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { claim_a_vs_after: $.data.validation_status, claim_a_amt: $.data.approved_amount_cents }
            - call: "POST /incentives/claims/${claim_b}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
            - call: "GET /incentives/programs/${prog_b}/spend-summary"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { b_committed: $.data.committed_cents, b_remaining: $.data.budget_remaining_cents }
          assert:
            - "${a_status} == CLOSED and ${claim_a_vs_before} == SUBMITTED (closing a program does not reject its submitted claims)"
            - "adjudicating claim A returns HTTP 409 with error.code == ERR_PROGRAM_NOT_ACTIVE — priority 11 wins even though priority 31 is also violated (committed 0 + 150000 > budget 100000)"
            - "the 409 response body carries error.code / error.message / error.details only; no data envelope key"
            - "${claim_a_vs_after} == SUBMITTED and ${claim_a_amt} == null — the refused adjudication is a total no-op"
            - "adjudicating claim B returns HTTP 402 with error.code == ERR_PROGRAM_BUDGET_EXHAUSTED, which is the SAME fiscal violation claim A carried, proving it was live and merely outranked"
            - "${b_committed} == 0 and ${b_remaining} == 100000 — the refused adjudication left the ledger untouched"

      - name: sale_date_window_error_outranks_forbidden_stack_edge
        grounds:
          - validations.priority_15_ERR_SALE_DATE_OUTSIDE_PROGRAM_WINDOW
          - validations.priority_22_ERR_STACK_COMBINATION_FORBIDDEN
          - calculations.delivery_stack_allocation
          - entities.StackabilityConstraint.fields.mode
        distinguishing_aspect: |
          A different category pair — business_temporal (priority 15, 422) versus
          business_constraint (priority 22, 422) — on POST /incentives/claims, where both
          candidate errors share the same HTTP status so only the error.code discriminates.
          A control delivery whose sale_date sits inside both windows draws the priority-22
          error from the identical FORBIDDEN edge, and neither call may return the
          priority-21 ERR_NO_ELIGIBLE_PROGRAM that the empty candidate set also implies.
        test_recipe:
          setup:
            - "PWS-1, CUSTOMER_CASH, window [2026-08-01, 2026-09-01), per_unit_amount_cents 120000, budget 90000000, priority_rank 71, TRK9/WEST/FINANCE eligibility."
            - "PWS-2, FINANCE_SUBVENTION, window [2026-08-01, 2026-08-16) — deliberately short — apr_buydown_bps 300, priority_rank 72, the SAME TRK9/WEST/FINANCE eligibility footprint."
            - "A StackabilityConstraint row with mode FORBIDDEN joining PWS-1 and PWS-2 (different incentive_types, so validations[priority=12] never blocked either submit)."
            - "Delivery LATE: sale_date 2026-08-20, FINANCE, term_months 60, contract_apr_bps 199 — inside PWS-1's window, OUTSIDE PWS-2's."
            - "Delivery EARLY (control): sale_date 2026-08-10, otherwise identical — inside BOTH windows."
            - "Each delivery already has an accepted claim on PWS-1, so the FORBIDDEN edge is live for both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
