      - name: enrollment_gate_reads_check_state_before_subscriber_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=44]
          - validations[priority=46]
          - errors[ERR_ELIGIBILITY_CHECK_NOT_CONFIRMED]
          - errors[ERR_SUBSCRIBER_NOT_ELIGIBLE]
          - state_machines.Subscriber.status.DUPLICATE_HOLD_to_VERIFIED_ELIGIBLE
        distinguishing_aspect: |
          Enrollment validity depends on TWO other rows and the pair is separated cleanly:
          with an unconfirmed check the request dies at priority 44 regardless of the
          subscriber, and with a CONFIRMED check on a DUPLICATE_HOLD subscriber the next
          rung fires (priority 46) rather than the address rule at 64 - then the very same
          request succeeds once the duplicate resolution cascades the subscriber to
          VERIFIED_ELIGIBLE, with nothing about the check having changed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50."
            - "A1 and A2 are punctuation variants of one dwelling, so both are DUPLICATE_FLAGGED; A3 is a clean third dwelling."
            - "S1 lives at A1 and is therefore born DUPLICATE_HOLD; its check reaches ELIGIBLE_CONFIRMED while S1 stays DUPLICATE_HOLD."
            - "S2 lives at clean A3 and keeps a check parked in PENDING_VERIFIER."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143144", study_area_code: "489144", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 n. main st.", unit_designator: "apt 4-b", city: "EL PASO", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1600 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr3_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub1_id: $.data.id, sub1_status_born: $.data.status }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Q8" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
              captures: { chk1_status: $.data.status }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Beto Ruiz", date_of_birth: "1958-12-19", last4_ssn: "2290", address_id: "${addr3_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Q9" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk2_id: $.data.id }
          trigger:
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr3_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { err_check: $.data.error_id }
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { err_sub: $.data.error_id }
            - call: "GET /lifeline/addresses/${addr1_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { addr1_ver: $.data.version }
            - call: "POST /lifeline/addresses/${addr1_id}/duplicate-resolution"
              payload: { resolution: "MULTI_HOUSEHOLD", expected_address_version: "${addr1_ver}", declared_household_count: 2, independent_household_worksheet_ref: "WS-11" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
