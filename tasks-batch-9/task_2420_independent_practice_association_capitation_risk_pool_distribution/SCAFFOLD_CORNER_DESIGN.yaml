      - name: pool_reserve_self_loop_replaces_ibnr_under_the_other_variant
        claim_type: reconciliation
        grounds:
          - state_machines.RiskPool.RESERVED_to_RESERVED
          - calculations.ibnr_reserve_estimate
          - calculations.pool_settlement_waterfall
        distinguishing_aspect: |
          Switching the reserve variant on the RESERVED -> RESERVED self-loop
          must push the full delta through the settlement ledger, not merely
          restate the reserve. Reserving under COMPLETION_FACTOR gives 3380; the
          self-loop with ibnr_method_override PMPM_LOSS_RATIO must move
          ibnr_reserve_cents to 1480 (delta -1900) and the subsequent
          SETTLEMENT_PROPOSED must therefore report raw_surplus_cents 5000
          rather than 3100 (delta +1900, exactly offsetting), admin_fee_cents 500
          rather than 310, and shared_savings_pool_cents 2700 rather than 1674.
          An implementation that keeps the first reserve, or that recomputes the
          reserve but settles off a stale snapshot, produces the 3100/310/1674
          triple.
