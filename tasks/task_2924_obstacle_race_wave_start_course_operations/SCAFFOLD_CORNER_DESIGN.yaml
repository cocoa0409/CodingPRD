            - "The validate on Course B returns 409 with data.error_id == ERR_DISTURBED_AREA_EXCEEDED: its own progression score is 2.00, so only the priority-29 gate is violated"
            - "Venue.${venue_id}.disturbed_area_sqm == 6300 after the three Course B stations are added"
            - "The final validate on Course A violates both gates and returns 422 with data.error_id == ERR_PROGRESSION_TOO_FLAT, the priority-25 error"
            - "Course.${course_a_id}.status and Course.${course_b_id}.status are both still DRAFT, and neither difficulty_progression_score was cleared: Course A reads 0.00 and Course B reads 2.00"

