      - name: stewardship_suspension_cascades_lots_line_bags_and_program_rollup
        grounds:
          - state_machines.StewardshipAgreement.APPROVED_to_SUSPENDED
          - state_machines.SeedIncreaseLot.ON_HOLD
          - entities.BreedingLine.fields.planned_launch_units_bags
          - entities.BreedingProgram.fields.pre_commercial_units_bags
          - endpoints["POST /stewardship-agreements/{id}/suspend"]
        distinguishing_aspect: |
          A second four-level chain that starts from the OTHER state dimension and
          is deliberately non-compensating where the first one compensates: the
          suspension puts RESERVED and IN_PRODUCTION lots ON_HOLD without crediting
          allocated_seed_g back to seed_inventory_g, so the launch-volume rollups
          collapse to 0 while the seed ledger stays debited - the opposite of the
          DISCARD branch, which cancels and refunds.
        test_recipe:
          setup:
            - "One program, one objective, line SX-5001 with seed_inventory_g 500000 and an APPROVED stewardship agreement covering US_CORNBELT and CA_PRAIRIE."
            - "Two lots exist on that line: lot 1 (US_CORNBELT, 4000 kg demand -> 173 bags, 108125 g) has been moved to IN_PRODUCTION; lot 2 (CA_PRAIRIE, 9000 kg -> 389 bags, 243125 g) is still RESERVED. planned_launch_units_bags is therefore 562."
