  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: derived_field_student_funding_claim_reconciles_after_second_term
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Student.fields.funding_claim_cents
          - calculations.funding_claim_amount
        distinguishing_aspect: "student.funding_claim_cents and funding_days_claimed are recomputed correctly when a second EnrollmentTerm is created and then withdrawn"
        test_recipe:
          setup:
            - "Student S: first term 2026-08-03 to 2026-08-05 (3 days, CALENDAR_ELAPSED, 500 c/day); second term 2026-08-10 to 2026-08-11 (2 days)"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-170", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "DF", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v1: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v1}" }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "HOMESCHOOL" }
              as: EnrollmentOfficer
            - call: "POST /vks/students/${student_id}/request-reenrollment"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v2: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v2}" }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "MOVED_DISTRICT" }
              as: EnrollmentOfficer
          assert:
            - "Student.${student_id}.funding_days_claimed == 5"
            - "Student.${student_id}.funding_claim_cents == 2500"
      - name: internet_stipend_forfeits_without_clawback_on_withdrawal
        claim_type: cascade_conditional
        grounds:
          - state_machines.DeviceStipend.ISSUED_to_FORFEITED
          - state_machines.Student.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: "INTERNET stipends (stipend_type=INTERNET) cascade ISSUED->FORFEITED with clawback_cents=0 — a conditional cascade branch that differs from the DEVICE branch"
        test_recipe:
          setup: ["Student enrolled; INTERNET stipend issued"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-171", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "IN", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/stipends"
              payload: { student_id: "${student_id}", stipend_type: "INTERNET", amount_cents: 5000 }
              as: FinanceOfficer
              captures: { stipend_id: $.data.id }
            - call: "POST /vks/stipends/${stipend_id}/issue"
              payload: {}
              as: FinanceOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "MOVED_DISTRICT" }
              as: EnrollmentOfficer
          assert:
            - "DeviceStipend.${stipend_id}.issue_status == FORFEITED"
            - "DeviceStipend.${stipend_id}.clawback_cents == 0"
      - name: occ_version_increments_on_student_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enroll-stale-student-version, entities.Student.fields.version]
        distinguishing_aspect: "student.version increments by 1 on each mutation; verify-residency -> version goes 1 -> 2; enroll -> 2 -> 3"
        test_recipe:
          setup: ["Student created"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-172", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "V", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { v1: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${v1}" }
              as: EnrollmentOfficer
              captures: { v2: $.data.version }
          assert:
            - "v0 == 1"
            - "v1 == 2"
            - "v2 == 3"
