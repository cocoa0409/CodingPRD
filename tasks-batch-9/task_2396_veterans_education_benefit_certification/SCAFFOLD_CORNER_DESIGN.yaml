scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_certifying_official_and_program_return_their_declared_shapes
        claim_type: creation
        grounds:
          - endpoints[POST /certifying-officials]
          - endpoints[POST /programs]
          - entities.CertifyingOfficial.fields.status
          - entities.Program.fields.approval_status
        distinguishing_aspect: "POST /certifying-officials returns 201 with status ACTIVE and version 1; POST /programs returns 201 with approval_status DRAFT and approved_catalog_version_id null, so neither creation pre-supposes an approval it has not yet earned."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
          trigger:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
          assert:
            - "Trigger step 1 returns HTTP 201"
            - "CertifyingOfficial.${sco1}.full_name == Dana Reyes, email == dana.reyes@u.edu, official_level == SCO"
            - "CertifyingOfficial.${sco1}.status == ACTIVE and version == 1"
            - "Trigger step 2 returns HTTP 201"
            - "Program.${prog1}.program_code == BSN-UG, degree_level == UNDERGRAD, full_time_credit_hours == 12, campus_bah_monthly_cents == 213700"
            - "Program.${prog1}.approval_status == DRAFT, approved_catalog_version_id == null and version == 1"

      - name: veteran_student_creation_applies_every_declared_default
        claim_type: defaults
        grounds:
          - endpoints[POST /veteran-students]
          - entities.VeteranStudent.fields.coe_status
          - entities.VeteranStudent.fields.entitlement_days_remaining
          - entities.VeteranStudent.fields.benefit_payment_protected
          - entities.VeteranStudent.fields.account_hold_status
          - entities.VeteranStudent.fields.open_debt_principal_cents
        distinguishing_aspect: "Omitting the optional coe_issued_on leaves it null and coe_status at NOT_SUBMITTED, while entitlement_days_remaining is seeded to the supplied entitlement_days_granted (1080) rather than 0, protected_until and coe_verified_on are null, benefit_payment_protected is false, account_hold_status is NONE and open_debt_principal_cents is 0."
        test_recipe:
          setup:
            - "One SCO-level CertifyingOfficial exists so a school certifying official identity resolves."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
          trigger:
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
          assert:
            - "HTTP status is 201"
            - "VeteranStudent.${stu1}.coe_status == NOT_SUBMITTED"
            - "VeteranStudent.${stu1}.coe_issued_on == null, coe_verified_on == null, verified_document_reference == null, protected_until == null"
            - "VeteranStudent.${stu1}.entitlement_days_remaining == 1080"
            - "VeteranStudent.${stu1}.benefit_payment_protected == false"
            - "VeteranStudent.${stu1}.account_hold_status == NONE"
            - "VeteranStudent.${stu1}.open_debt_principal_cents == 0"
            - "VeteranStudent.${stu1}.version == 1"

      - name: certification_creation_computes_the_pursuit_and_housing_rate_fields
        claim_type: computed_fields
        grounds:
          - calculations.rate_of_pursuit_and_training_time
          - entities.EnrollmentCertification.fields.certified_days
          - entities.EnrollmentCertification.fields.rate_of_pursuit_pct
          - entities.EnrollmentCertification.fields.modality
          - entities.EnrollmentCertification.fields.mha_monthly_rate_cents
        distinguishing_aspect: "A 12-of-12 residential certification over 2026-08-24..2026-12-11 returns certified_days 110 (inclusive), rate_of_pursuit_pct 100, rop_tier_pct 100, training_time FULL_TIME, modality RESIDENTIAL, mha_eligible true and mha_monthly_rate_cents 213700 in the creation response itself, before any submit or certify."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. Program BSN-UG has full_time_credit_hours 12 and campus_bah_monthly_cents 213700; term FA2026 runs 2026-08-24..2026-12-11; student V-1001 is CH33 at benefit_level_pct 100."
            - "No catalog approval is needed because CALC-1 runs at creation and the catalog gate applies only at submit."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { term1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
          trigger:
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu1}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { cert1: $.data.id }
          assert:
            - "HTTP status is 201"
            - "EnrollmentCertification.${cert1}.certified_days == 110"
            - "EnrollmentCertification.${cert1}.rate_of_pursuit_pct == 100"
            - "EnrollmentCertification.${cert1}.rop_tier_pct == 100"
            - "EnrollmentCertification.${cert1}.training_time == FULL_TIME"
            - "EnrollmentCertification.${cert1}.modality == RESIDENTIAL"
            - "EnrollmentCertification.${cert1}.mha_eligible == true"
            - "EnrollmentCertification.${cert1}.mha_monthly_rate_cents == 213700"
            - "EnrollmentCertification.${cert1}.status == DRAFT, amount_basis == null, mha_term_total_cents == 0, va_tuition_cents == 0, entitlement_days_charged == 0"
            - "VeteranStudent.${stu1}.entitlement_days_remaining == 1080 — creation alone charges nothing"

      - name: get_by_id_returns_the_stored_row_for_each_written_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /veteran-students/{id}]
          - endpoints[GET /academic-terms/{id}]
          - endpoints[GET /catalog-versions/{id}]
          - endpoints[GET /tuition-fee-reports/{id}]
        distinguishing_aspect: "Reading each row back by id returns exactly the values the write returned — including the server-side coe_verified_on 2026-08-01 and protected_until 2026-10-30 on the student and net_covered_cents 2950000 on the tuition report — so no field is write-only."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. Officials, program BSN-UG, a DRAFT catalog version for 2026-2027, term FA2026, student V-1001 with a VERIFIED COE, one DRAFT certification and one REPORTED TuitionFeeReport of gross 3000000, fees 150000 and tuition-specific aid 200000."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
            - call: "POST /catalog-versions"
              payload: { program_id: "${prog1}", catalog_year: "2026-2027", effective_start: "2026-07-01", effective_end: "2027-07-01", has_published_tuition_schedule: true, has_refund_policy: true, has_program_length_disclosure: true }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { cat1: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { term1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
            - call: "POST /veteran-students/${stu1}/verify-coe"
              payload: { coe_issued_on: "2026-07-15", verified_document_reference: "COE-2026-77120" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu1}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { cert1: $.data.id, cert1_v: $.data.version }
            - call: "POST /tuition-fee-reports"
              payload: { certification_id: "${cert1}", gross_tuition_cents: 3000000, mandatory_fees_cents: 150000, tuition_specific_aid_cents: 200000, non_tuition_aid_cents: 0, expected_certification_version: "${cert1_v}" }
              as: BursarOfficer
              captures: { tfr1: $.data.id }
          trigger:
            - call: "GET /veteran-students/${stu1}"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /academic-terms/${term1}"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /catalog-versions/${cat1}"
              payload: {}
              as: StateApprovingAgent
            - call: "GET /tuition-fee-reports/${tfr1}"
              payload: {}
              as: BursarOfficer
          assert:
            - "Trigger step 1 returns HTTP 200 with data.id == ${stu1}, student_number == V-1001, chapter == CH33, coe_status == VERIFIED, coe_verified_on == 2026-08-01 and protected_until == 2026-10-30"
            - "Trigger step 2 returns data.id == ${term1} with term_code == FA2026, start_date == 2026-08-24, end_date == 2026-12-11, status == OPEN"
            - "Trigger step 3 returns data.id == ${cat1} with catalog_year == 2026-2027, effective_start == 2026-07-01, review_status == DRAFT"
            - "Trigger step 4 returns data.id == ${tfr1} with gross_tuition_cents == 3000000, net_covered_cents == 2950000 and status == REPORTED"

      - name: list_enrollment_certifications_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /enrollment-certifications]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT certifications for three students, limit 2 offset 0 returns exactly 2 rows with total_count 3 and has_more true, offset 2 returns 1 row with has_more false, and the status=CERTIFIED filter returns 0 rows with total_count 0 — the filter is applied before pagination, not after."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. Program BSN-UG, term FA2026 2026-08-24..2026-12-11 and three students V-1001, V-1002, V-1003, each with one DRAFT certification of 12 of 12 credits over the full term."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { term1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1002", full_name: "Bea Chen", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2031-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu2: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1003", full_name: "Cy Duval", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2031-12-31" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu3: $.data.id }
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu1}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { certA: $.data.id }
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu2}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { certB: $.data.id }
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu3}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { certC: $.data.id }
          trigger:
            - call: "GET /enrollment-certifications"
              payload: { term_id: "${term1}", limit: 2, offset: 0 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /enrollment-certifications"
              payload: { term_id: "${term1}", limit: 2, offset: 2 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /enrollment-certifications"
              payload: { term_id: "${term1}", status: "CERTIFIED" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /enrollment-certifications"
              payload: { student_id: "${stu2}" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
          assert:
            - "Trigger step 1 returns HTTP 200, response_type array, exactly 2 rows, total_count == 3 and has_more == true"
            - "Trigger step 2 returns exactly 1 row, total_count == 3 and has_more == false"
            - "The three ids ${certA}, ${certB}, ${certC} appear exactly once across the two pages, with no row repeated between them"
            - "Trigger step 3 returns 0 rows with total_count == 0 and has_more == false — the status filter is applied before the page window"
            - "Trigger step 4 returns exactly 1 row whose id == ${certB} and student_id == ${stu2}"

      - name: every_path_id_lookup_returns_its_entity_scoped_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors.ERR_OFFICIAL_NOT_FOUND
          - errors.ERR_STUDENT_NOT_FOUND
          - errors.ERR_TERM_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_CATALOG_VERSION_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_CERTIFICATION_NOT_FOUND
          - errors.ERR_TUITION_REPORT_NOT_FOUND
          - errors.ERR_AWARD_NOT_FOUND
          - errors.ERR_CHANGE_REPORT_NOT_FOUND
          - errors.ERR_DEBT_NOT_FOUND
          - errors.ERR_CHARGE_NOT_FOUND
        distinguishing_aspect: "Each of the twelve id-bearing resources answers an unknown id with its OWN 404 error_id rather than a generic ERR_NOT_FOUND, so a client can tell which link in a chain is broken."
        test_recipe:
          setup:
            - "One SUPERVISORY CertifyingOfficial exists so the reads authenticate; no other rows are needed because every lookup uses a non-existent id."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
          trigger:
            - call: "GET /certifying-officials/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { e_official: $.data.error_id }
            - call: "GET /veteran-students/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /academic-terms/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /programs/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /catalog-versions/00000000-0000-0000-0000-0000000000a5"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /yellow-ribbon-agreements/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /enrollment-certifications/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /tuition-fee-reports/00000000-0000-0000-0000-0000000000a8"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /yellow-ribbon-awards/00000000-0000-0000-0000-0000000000a9"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /enrollment-change-reports/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /benefit-debts/00000000-0000-0000-0000-0000000000ab"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "GET /student-account-charges/00000000-0000-0000-0000-0000000000ac"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
          assert:
            - "Every trigger step returns HTTP 404"
            - "Step 1 error_id == ERR_OFFICIAL_NOT_FOUND"
            - "Step 2 error_id == ERR_STUDENT_NOT_FOUND"
            - "Step 3 error_id == ERR_TERM_NOT_FOUND"
            - "Step 4 error_id == ERR_PROGRAM_NOT_FOUND"
            - "Step 5 error_id == ERR_CATALOG_VERSION_NOT_FOUND"
            - "Step 6 error_id == ERR_AGREEMENT_NOT_FOUND"
            - "Step 7 error_id == ERR_CERTIFICATION_NOT_FOUND"
            - "Step 8 error_id == ERR_TUITION_REPORT_NOT_FOUND"
            - "Step 9 error_id == ERR_AWARD_NOT_FOUND"
            - "Step 10 error_id == ERR_CHANGE_REPORT_NOT_FOUND"
            - "Step 11 error_id == ERR_DEBT_NOT_FOUND"
            - "Step 12 error_id == ERR_CHARGE_NOT_FOUND"

      - name: omitting_a_required_input_field_is_rejected_with_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /academic-terms]
          - endpoints[POST /enrollment-certifications]
        distinguishing_aspect: "Each of four writes with exactly one required field removed — official_level, term_type, credit_hours_online and gross_tuition_cents — returns 400 ERR_INVALID_REQUEST and persists nothing, so required-ness is enforced field by field rather than only on an empty body."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. One SCO official, one SUPERVISORY official, program BSN-UG, term FA2026, student V-1001 and one DRAFT certification exist so that only the omitted field can be the cause of rejection."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
