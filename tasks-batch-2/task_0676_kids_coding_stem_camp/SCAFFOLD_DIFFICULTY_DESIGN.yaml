        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PROGRAM_MISMATCH]
          - errors[ERR_AGE_OUT_OF_RANGE]
        distinguishing_aspect: "A member on Program X (age also out of range for Program Y) enrolling in a Program-Y session fails BOTH the referential program check (priority 6) and the age check (priority 7); the server returns ERR_PROGRAM_MISMATCH (business_referential beats business_constraint)."
        test_recipe:
          setup:
            - "Two programs: PX (ages 4-18) and PY (ages 4-9). A member on PX born 2014-01-01 (age 12 at clock default — out of PY's range)."
            - "An OPEN session on PY. Enrolling the PX member in the PY session violates program-match AND age."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "PX", code: "PX1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
