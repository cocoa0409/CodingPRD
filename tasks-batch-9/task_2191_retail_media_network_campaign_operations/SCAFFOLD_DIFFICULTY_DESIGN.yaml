          not overlap: the candidate window [2026-08-18T00:00:00Z, 2026-08-25T00:00:00Z) is fully disjoint from
          the RUNNING study's [2026-08-05T00:00:00Z, 2026-08-12T00:00:00Z) yet is rejected with
