            - { call: "POST /registrations", payload: { session_id: "${sp}", participant_id: "${pw}", expected_class_session_version: "${sp_v}" }, as: HouseholdManager, as_user_id: "${hw}", captures: { rg: $.data.id, rg_st: $.data.enrollment_status, rg_fee: $.data.fee_charged_cents } }
