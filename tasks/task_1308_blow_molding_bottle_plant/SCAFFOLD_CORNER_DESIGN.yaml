            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-1", received_kg: 100 }, as: PlantAdmin, captures: { lot1_id: "$.data.id" } }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-2", received_kg: 200 }, as: PlantAdmin, captures: { lot2_id: "$.data.id" } }
            - { call: "POST /plant/material-lots/${lot1_id}/release", as: QualityTechnician }
            - { call: "POST /plant/material-lots/${lot2_id}/release", as: QualityTechnician }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 2000, planned_weight_g: 22 }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer }
            - { call: "POST /plant/production-orders/${ord_id}/release", as: ProductionScheduler }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/production-runs", payload: { production_order_id: "${ord_id}", machine_line_id: "${line_id}", mold_id: "${mold_id}", material_lot_id: "${lot1_id}" }, as: ProcessEngineer, captures: { run_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/production-runs/${run_id}/close", payload: { cycles_completed: 600, good_count: 4000, scrap_count: 100, actual_drawdown_kg: 150.0 }, as: ProcessEngineer }
            - { call: "GET /plant/material-lots/${lot1_id}", as: QualityTechnician, captures: { c1: "$.data.consumed_kg", s1: "$.data.status" } }
            - { call: "GET /plant/material-lots/${lot2_id}", as: QualityTechnician, captures: { c2: "$.data.consumed_kg", s2: "$.data.status" } }
