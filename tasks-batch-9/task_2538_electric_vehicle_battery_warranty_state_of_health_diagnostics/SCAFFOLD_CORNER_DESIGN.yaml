              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_ver1}", bench_measured_capacity_kwh: 63.000 }
              as: ServiceTechnician
