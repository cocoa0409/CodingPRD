              captures: { custv_b: $.data.version }
            - call: "GET /warranty-claims/${claim}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pmr_b: $.data.warranty_reserve_cents }
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CD-L2", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 4.50 }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /customers/${cust}/reinstate"
