      - name: err_unauthenticated_when_x_user_role_header_missing_or_unknown
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
          - roles
        distinguishing_aspect: "A wholly absent X-User-Role header and a syntactically valid but undeclared role name ('Notary') both return 401 ERR_UNAUTHENTICATED — not 403 — and neither creates an Engineer."
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /engineers"
              payload: { full_name: "Ghost Applicant", email: "ghost@pe.test", home_jurisdiction: "OR" }
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "SEC-1"
            - call: "POST /engineers"
              payload: { full_name: "Ghost Applicant", email: "ghost@pe.test", home_jurisdiction: "OR" }
              as: "Notary"
              as_user_id: "SEC-1"
          assert:
            - "trigger[0] http_status == 401"
            - "trigger[0] response.data.error_id == \"ERR_UNAUTHENTICATED\""
            - "trigger[1] http_status == 401"
            - "trigger[1] response.data.error_id == \"ERR_UNAUTHENTICATED\""
