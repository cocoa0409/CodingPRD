              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /atfm/flights/${f1}/updates"
              payload: { new_eta: "2026-09-15T13:20:00Z", expected_flight_version: "${v0}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { v1: $.data.version }
          assert:
            - "v0 == 1 and v1 == 2 (exactly one increment per mutation)"

