            - *c_clk10
            - *c_quote_ech50k
            - *c_txn_ech
            - call: "POST /portal/payment-transactions/${txn_ech}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-12" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/payment-transactions/${txn_ech}/ach-return"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/payment-transactions/${txn_ech}/re-present"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_REPRESENTMENT_WINDOW_CLOSED (31 days > 30-day window)"
            - "err_id != ERR_REPRESENTMENT_EXHAUSTED — representment_count is still 0; only the temporal window blocks"
            - "PaymentTransaction.${txn_ech}.funds_status stays RETURNED"

  # ===========================================================================
  - section: rbac
    instances:
      - name: agency_admin_cannot_approve_authorization
        claim_type: Violation → Error
        grounds:
          - roles.AgencyAdmin
          - roles.PlatformAdmin
          - endpoints.POST_/portal/statutory-authorizations/{id}/approve
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "Segregation between drafter and approver: the AgencyAdmin who drafted the statutory authorization gets 403 ERR_FORBIDDEN_FOR_ROLE on approve; PlatformAdmin approves."
        test_recipe:
          setup:
            - "CF agency exists; one DRAFT authorization."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_service
            - *c_authz
          trigger:
