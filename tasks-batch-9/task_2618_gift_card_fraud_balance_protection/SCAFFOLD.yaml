  - method: GET
    path: /reseller-listings
    purpose: List listings across marketplaces.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - card_id?
      - state?
      - marketplace_name?
      - limit?
      - offset?
    output: ResellerListing[]
    side_effects: []

  - method: GET
    path: /reseller-listings/{id}
    purpose: Read one listing with its validation verdict and block reason.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: ResellerListing
    side_effects: []

  - method: POST
    path: /reseller-listings/{id}/validate
    purpose: Validate a listing against the live card, producing one of four verdicts under the fixed check order of §1.3 listing_validation_decision.
    roles: [FraudAnalyst]
    input:
      - validation_note?
    output: ResellerListing
    side_effects:
      - "sets state to VALIDATED, REJECTED or BLOCKED and block_reason to null, CARD_NOT_ACTIVE, CARD_RISK_POSTURE, BALANCE_MISMATCH or DRAIN_SCORE per §1.3 listing_validation_decision"
      - "records validated_by_user_id := X-User-ID and validation_note"
