              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /cooling-bays/${bay}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "cycle creation with BOTH pools DOWN: 409 ERR_OVEN_STATION_DOWN — §1.4 priority 32 outranks priority 33, so the bay error is not the one reported"
            - "cycle creation after the station is restored but the bay is still DOWN: 409 ERR_COOLING_BAY_DOWN — same payload, different report, which pins the guard to the bay's state rather than to the payload"
            - "cycle creation once both pools are OPERATIONAL: 201 with status 'SCHEDULED' and mold_id == '${mold}'; the three attempts used the same expected_production_order_version, which was still current because the two refusals bumped nothing"
            - "the bay mark-down performed while the cycle is OVEN_RUNNING returns 200, and the GET immediately after shows MoldingCycle.${cyc}.status STILL 'OVEN_RUNNING' with abort_reason == null — the CASCADE only aborts SCHEDULED cycles on that bay"
            - "enter-cooling while the bay is DOWN: 409 ERR_COOLING_BAY_DOWN, and the cycle stays OVEN_RUNNING with actual_oven_end_at == null"
            - "enter-cooling after the bay is restored: 200 with status 'COOLING', actual_oven_end_at == '2026-08-01T10:00:00Z' and actual_oven_minutes == 60"
            - "MoldingCycle.${cyc}.version == 4  # 1 create + 1 charge rollup + 1 start-oven + 1 enter-cooling; the refused enter-cooling added nothing"
            - "OvenStation.${station}: status 'OPERATIONAL', version == 3  # 1 create + mark-down + restore"
            - "CoolingBay.${bay}: status 'OPERATIONAL', version == 5  # 1 create + two mark-downs + two restores"
            - "GET /molding-cycles?cooling_bay_id=${bay}&status=ABORTED: total_count == 0 — neither bay outage aborted anything, because no cycle was ever SCHEDULED on it while the bay was down"

      - name: sm_guarded_shipment_line_requires_a_stored_hull_at_the_trailers_own_origin_site
        claim_type: "Shape: guarded transitions"
        grounds:
          - state_machines.FinishedUnit.logistics_status.STORED_to_LOADED
          - validations[priority=65]
          - errors.ERR_WAREHOUSE_MISMATCH
          - errors.ERR_UNIT_INVALID_LOGISTICS_STATE
          - endpoints.POST_/shipment-lines
        distinguishing_aspect: "Loading a hull is guarded by a cross-entity equality — the hull's warehouse_id must equal the trailer's origin_warehouse_id — and that guard sits BEHIND the hull's own logistics guard, so a hull that is both unstored AND at the wrong site reports ERR_UNIT_INVALID_LOGISTICS_STATE while a correctly stored hull at the wrong site reports ERR_WAREHOUSE_MISMATCH."
        test_recipe:
          setup:
            - "Mould MLD-SM-MIS has cavity_count 2, so a single cycle demoulds TWO hulls and no second cycle is needed."
            - "ProductionOrder POR-SM-MIS (ordered_qty 2) targets site WHS-SM-MIS-A; 2 hulls <= floor(2 * 1.20) == 2 so the overbuild ceiling is respected."
            - "A second site WHS-SM-MIS-B exists with nothing stored in it, so a trailer may legally be planned there (its posture is NORMAL, which §1.4 priority 66 does not restrict)."
