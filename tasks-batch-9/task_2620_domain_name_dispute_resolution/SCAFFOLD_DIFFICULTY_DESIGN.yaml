            - "PanelistAppointment.${apt_b_id}.status == WAIVER_PENDING, since 56.67 is below 60 and at or above the 30 waiver threshold"
            - "The waiver on ${apt_b_id} succeeds: status becomes ACCEPTED with accepted_at == 2026-08-01T00:00:00Z and decision_due_at == 2026-08-15T00:00:00Z"
            - "Panelist.${pan_b_id}.active_case_load == 1 and Case.${case_id}.status == PANEL_CONSTITUTED"
            - "PanelistAppointment.${apt_a_id}.status == REPLACED with replaced_by_appointment_id == ${apt_b_id}, and its stored conflict_score is still 60.00"

      - name: refiling_bar_upper_endpoint_is_inclusive_to_the_second
        grounds:
          - calculations.domain_occupation_conflict
          - validations[priority=57].ERR_REFILING_BAR_ACTIVE
          - state_machines.Case.FILED_to_WITHDRAWN
          - entities.Case.fields.refiling_bar_until
        distinguishing_aspect: |
          The cooling-off interval [closed_at, refiling_bar_until] is closed at BOTH ends, so a fresh
          complaint on the same domain filed at exactly 2026-09-09T00:00:00Z - the stored
          refiling_bar_until to the second - is refused, and the same request one second later at
          2026-09-09T00:00:01Z is accepted. Only a comparison written as "clock <= bar" passes both
          halves; "clock < bar" admits the first filing and a whole-day comparison admits both.
