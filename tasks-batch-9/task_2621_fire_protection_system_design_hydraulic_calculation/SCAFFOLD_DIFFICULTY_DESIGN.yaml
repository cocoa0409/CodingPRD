              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { auxB: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_II", label: "Hose station C", riser_count: 1 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { auxC: $.data.id }
            - call: "POST /auxiliary-systems/${auxA}/commission"
              payload: { outage_start_at: "2026-09-08T09:00:00Z", outage_end_at: "2026-09-08T12:00:00Z" }
              as: Contractor
            - call: "POST /auxiliary-systems/${auxB}/commission"
              payload: { outage_start_at: "2026-09-08T11:00:00Z", outage_end_at: "2026-09-08T14:00:00Z" }
              as: Contractor
          trigger:
            - call: "POST /auxiliary-systems/${auxC}/commission"
              payload: { outage_start_at: "2026-09-08T11:30:00Z", outage_end_at: "2026-09-08T13:00:00Z" }
              as: Contractor
            - call: "POST /auxiliary-systems/${auxC}/commission"
