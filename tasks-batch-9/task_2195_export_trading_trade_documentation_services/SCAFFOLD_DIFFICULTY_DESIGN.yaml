            - "ExportOrder.${order_2_id}.fulfillment_status == COMPLIANCE_PENDING"

  # ===========================================================================
  # RULE 9 — Compensating invariants: charge-then-release pairs must restore the
  #          capacity, license and exposure ledgers to their exact prior values
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: booking_cancel_restores_sailing_weight_and_license_value_to_exact_prior_figures
        grounds:
          - calculations.sailing_capacity_ledger
          - calculations.license_value_consumption
          - state_machines.FreightBooking.BOOKED_to_CANCELLED
          - entities.ExportLicense.fields.remaining_value_usd
          - entities.ExportOrder.fields.licensed_value_allocated_usd
        distinguishing_aspect: |
          One cancel must reverse three ledgers at once against a NON-ZERO baseline: the
          sailing returns from 1000.000 to exactly 600.000 kg and from FULL back to OPEN (the
          600.000 belonging to another live booking is untouched), the license returns from
          consumed 4000.00 / remaining 0.00 / EXHAUSTED to consumed 0.00 / remaining 4000.00 /
          ACTIVE (not ISSUED, since it has cleared a screening), and the order's
          licensed_value_allocated_usd returns to 0.00 while fulfillment_status returns BOOKED
          -> COMPLIANCE_CLEARED. Both ledgers must be recomputed from the surviving rows, not
          decremented in place, or the 600.000 baseline drifts.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted) owning both orders; the clock stays at 2026-08-01, strictly before cutoff_at, which is required for the FULL -> OPEN release."
            - "VesselSailing S6 with capacity_weight_kg exactly 1000.000, cutoff_at 2026-08-15, etd 2026-08-17."
            - "Order B (the baseline): one line 60.000 @ 100.0000 gross 600.000, screened NLR, booked LCL 600.000 -> sailing booked_weight_kg 600.000, OPEN. This booking is never cancelled."
            - "Order A: one line 40.000 @ 100.0000 = ordered_goods_value_usd 4000.00, gross 400.000; decided LICENSE_REQUIRED with eccn 3A001, then ExportLicense LIC-2195-C with licensed_value_usd exactly 4000.00 is recorded and used to clear the screening, so the license is ACTIVE with remaining 4000.00."
            - "Order A is then booked for 400.000 kg with a sailing version refreshed after order B's booking, which drives the sailing to 1000.000 / FULL and the license to consumed 4000.00 / remaining 0.00 / EXHAUSTED."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Shimizu Machinery Import", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Yeongsan Star", voyage_no: "Y4401", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 1000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v1: "$.data.version" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_b_id: "$.data.id" }
            - call: "POST /export-orders/${order_b_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Conveyor rollers", hs_code: "848390", quantity: 60.000, uom: "EA", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 550.000, gross_weight_kg: 600.000, package_count: 6 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_b_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_b_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_b_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_b_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_b_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 600.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v1}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_b_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_a_id: "$.data.id" }
            - call: "POST /export-orders/${order_a_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Numerical control units", hs_code: "853710", quantity: 40.000, uom: "EA", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 360.000, gross_weight_kg: 400.000, package_count: 4 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_a_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_a_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_a_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_a_id}/decision"
              payload: { license_determination: "LICENSE_REQUIRED", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /export-control-screenings/${screening_a_id}/licenses"
              payload: { license_number: "LIC-2195-C", authority: "BIS", eccn: "3A001", valid_from: "2026-07-15T00:00:00Z", valid_to: "2026-12-31T00:00:00Z", licensed_value_usd: 4000.00 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { license_id: "$.data.id" }
            - call: "POST /export-control-screenings/${screening_a_id}/clear-with-license"
              payload: { export_license_id: "${license_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "GET /vessel-sailings/${sailing_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_v2: "$.data.version" }
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_a_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 400.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v2}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_a_id: "$.data.id" }
          trigger:
            - call: "POST /freight-bookings/${booking_a_id}/cancel"
              payload: { cancel_reason: "Buyer deferred the shipment; releasing the space and the licence value" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
          assert:
            - "HTTP status is 200"
            - "FreightBooking.${booking_a_id}.status == CANCELLED with cancel_reason recorded"
            - "VesselSailing.${sailing_id}.booked_weight_kg == 600.000 (exactly the pre-charge figure, not 0.000 and not 1000.000)"
            - "VesselSailing.${sailing_id}.status == OPEN (600.000 < 1000.000 and the clock is strictly before cutoff_at)"
            - "ExportLicense.${license_id}.consumed_value_usd == 0.00 and ExportLicense.${license_id}.remaining_value_usd == 4000.00"
            - "ExportLicense.${license_id}.status == ACTIVE (it has cleared a screening, so it does not fall back to ISSUED)"
            - "consumed_value_usd + remaining_value_usd == 4000.00 == licensed_value_usd (invariant holds after the release)"
            - "ExportOrder.${order_a_id}.licensed_value_allocated_usd == 0.00 and ExportOrder.${order_a_id}.fulfillment_status == COMPLIANCE_CLEARED"
            - "FreightBooking.${booking_b_id}.status == BOOKED and its booked_weight_kg is still 600.000 (the other order is untouched)"

      - name: lc_amendment_releases_insured_exposure_back_to_the_full_credit_limit
        grounds:
          - calculations.insured_exposure_ledger
          - state_machines.ExportOrder.LC_ACCEPTED_to_UNSECURED
          - entities.CreditInsurancePolicy.fields.utilized_usd
          - entities.CreditInsurancePolicy.fields.available_limit_usd
          - entities.ForeignBuyer.fields.aggregate_exposure_usd
        distinguishing_aspect: |
          Accepting the credit charges exactly 25000.00 against a 30000.00 policy (utilized
          25000.00 / available 5000.00), and the amendment that returns the credit ACCEPTED ->
          RECEIVED must release the charge to exactly utilized 0.00 / available 30000.00 with
          ExportOrder.insured_exposure_usd 0.00 and the buyer's aggregate_exposure_usd 0.00, so
          the identity utilized_usd + available_limit_usd == credit_limit_usd holds at both
          ends; the release must recompute from the surviving LC_ACCEPTED orders rather than
          subtract, and it must not leave the policy EXHAUSTED-adjacent residue.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted) with a single ACTIVE CreditInsurancePolicy POL-F-2195, credit_limit_usd 30000.00, insured_pct 90.00, deductible_usd 1000.00, effective 2026-08-01 -> 2026-12-31, so it is the only exposure candidate."
            - "ExportOrder FOB / ZONE_1 / USD with one line 50.000 @ 500.0000 = ordered_goods_value_usd 25000.00; submitted and screened NLR."
            - "LetterOfCredit LC-2195-009 captured by ops_1 for 25000.00 with tolerance_pct 5.00 (drawable band 23750.00 .. 26250.00 covers the order value so priority 33 passes), SIGHT, expiry 2026-10-15."
            - "rev_1 (who is not the capturing user, so priority 17 passes) opens the terms review and submits it with recommendation ACCEPT and no findings, giving terms_risk_score 0.00 < RISK_ACCEPT_CEILING 45.00; the credit becomes ACCEPTED and the order becomes LC_ACCEPTED, charging 25000.00 to the policy."
            - "No DocumentPresentation is ever created, which is the precondition for LC_ACCEPTED -> UNSECURED; the LC version is re-read after the ACCEPT so the amendment carries a current OCC value."
            - "The clock stays at 2026-08-01, so no sweep expires the credit or the policy."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Nagoya Press Import", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /credit-insurance-policies"
              payload: { buyer_id: "${buyer_id}", policy_number: "POL-F-2195", credit_limit_usd: 30000.00, insured_pct: 90.00, deductible_usd: 1000.00, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
              captures: { policy_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Press dies", hs_code: "820720", quantity: 50.000, uom: "EA", unit_price_usd: 500.0000, line_discount_pct: 0, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /letters-of-credit"
              payload: { export_order_id: "${order_id}", lc_number: "LC-2195-009", issuing_bank_swift: "SMBCJPJT", amount_usd: 25000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-10-15T00:00:00Z", latest_shipment_date: "2026-09-30T00:00:00Z", presentation_period_days: 21, partial_shipment_allowed: false, transshipment_allowed: false, required_document_types: ["COMMERCIAL_INVOICE", "BILL_OF_LADING"] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_id: "$.data.id", lc_v1: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              payload: { expected_letter_of_credit_version: "${lc_v1}" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { review_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              payload: { recommendation: "ACCEPT" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
            - call: "GET /credit-insurance-policies/${policy_id}"
              payload: {}
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
              captures: { utilized_after_charge: "$.data.utilized_usd" }
            - call: "GET /letters-of-credit/${lc_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_v_accepted: "$.data.version" }
          trigger:
            - call: "POST /letters-of-credit/${lc_id}/amendments"
              payload: { expected_letter_of_credit_version: "${lc_v_accepted}", amount_usd: 27000.00, tolerance_pct: 3.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
          assert:
            - "HTTP status is 200"
            - "the pre-trigger charge was real: ${utilized_after_charge} == 25000.00"
            - "LetterOfCredit.${lc_id}.status == RECEIVED and its amendment_round == 1"
            - "ExportOrder.${order_id}.settlement_status == UNSECURED"
            - "ExportOrder.${order_id}.insured_exposure_usd == 0.00"
            - "CreditInsurancePolicy.${policy_id}.utilized_usd == 0.00 and CreditInsurancePolicy.${policy_id}.available_limit_usd == 30000.00"
            - "utilized_usd + available_limit_usd == 30000.00 == credit_limit_usd (the ledger identity holds after the release)"
            - "CreditInsurancePolicy.${policy_id}.status == ACTIVE"
            - "ForeignBuyer.${buyer_id}.aggregate_exposure_usd == 0.00"
            - "LCTermsReview.${review_id}.status == SUPERSEDED"
