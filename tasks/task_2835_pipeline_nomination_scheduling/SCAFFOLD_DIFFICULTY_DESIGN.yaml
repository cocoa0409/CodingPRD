              captures: { nom_d_id: "$.data.id" }
            - call: "GET /pipeline/cycles/${cyc_id}"
              payload: {}
              as: PipelineScheduler
              captures: { cyc_v1: "$.data.version" }
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc_id}", shipper_id: "${alpha_id}", grade_id: "${cbob_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 26100, expected_cycle_version: "${cyc_v1}" }
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { nom_g_id: "$.data.id" }
