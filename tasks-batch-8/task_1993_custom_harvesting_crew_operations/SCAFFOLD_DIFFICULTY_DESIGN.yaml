  # ===========================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: machine_allocation_conserved_through_assignment_cancel
        grounds:
          - state_machines.MachineAssignment.transitions.RESERVED_to_CANCELLED
          - state_machines.Machine.transitions.ASSIGNED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: count of Machines in ASSIGNED status equals
          count of distinct machines with at least one non-CANCELLED
          non-RELEASED MachineAssignment. Creating then cancelling the only
          assignment returns the machine to AVAILABLE — invariant preserved.
        test_recipe:
          setup:
            - "Season ACTIVE, one machine AVAILABLE"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
              captures: { asg_id: $.data.id }
            - call: "POST /harvest/machine-assignments/${asg_id}/cancel"
              payload: {}
              as: CrewBoss
          assert:
            - "Machine.${machine_id}.status == AVAILABLE (re-read after cancel)"
            - "MachineAssignment.${asg_id}.status == CANCELLED (re-read)"

      - name: contract_harvested_acres_equals_sum_of_completed_stop_acres
        grounds:
          - state_machines.RouteStop.transitions.CUTTING_to_COMPLETED
          - entities.CustomerContract.fields.harvested_acres
        distinguishing_aspect: |
          Conserved quantity: CustomerContract.harvested_acres == sum of
          RouteStop.actual_acres across that contract's stops with
          status==COMPLETED. After two completions (one 60, one 40), the
          contract's harvested_acres must equal exactly 100 — drift is
          forbidden. Different conserved quantity than machine count.
        test_recipe:
          setup:
            - "Season ACTIVE, contract COMMITTED with two stops"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 60, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop1_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop1_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop1_id}"
              payload: { actual_acres: 60 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", planned_acres: 40, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop2_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop2_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-10", assigned_end_date: "2026-08-12" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop2_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop2_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop2_id}"
              payload: { actual_acres: 40 }
              as: CrewBoss
          trigger:
            - call: "POST /harvest/route-stops/${stop2_id}/complete"
              payload: {}
              as: CrewBoss
          assert:
            - "CustomerContract.${contract_id}.harvested_acres == 100 (re-read)"
            - "CustomerContract.${contract_id}.status == HARVESTED (auto-transition when all stops terminal)"
