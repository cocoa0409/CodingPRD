  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ExamRegistration
          - entities.ExamRegistration.fields.logistics_status
          - entities.ExamRegistration.fields.grading_status
          - state_machines.ExamWindow.TESTING_to_SCORING
        distinguishing_aspect: |
          Parallel dimensions on ExamRegistration: after the SCORING sweep only the
          REGISTERED row becomes SAT while the WAITLISTED row keeps WAITLISTED, and
          after publish the SAT row goes RELEASED/PASS while the WAITLISTED row is
          still PENDING with result null — the two state axes evolve independently
          on sibling rows of the same window.
        test_recipe:
          setup:
            - "Window P-2026-10 capacity 1; cand1 REGISTERED, cand2 WAITLISTED (both PENDING)"
          setup_api_calls:
