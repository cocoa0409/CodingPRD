              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-shifts"
              payload: { staff_member_id: "${staff_a}", themed_room_id: "ffffffff-ffff-4fff-8fff-ffffffffffff", shift_start_utc: "2026-08-12T10:00:00Z", shift_end_utc: "2026-08-12T14:00:00Z", station: "FLOOR" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-shifts"
              payload: { staff_member_id: "${staff_a}", themed_room_id: "${room_a}", shift_start_utc: "2026-08-12T10:00:00Z", shift_end_utc: "2026-08-12T14:00:00Z", station: "FLOOR" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { shift_linked: $.data.id }
            - call: "POST /staff-shifts"
              payload: { staff_member_id: "${staff_a}", shift_start_utc: "2026-08-13T10:00:00Z", shift_end_utc: "2026-08-13T12:00:00Z", station: "ENTRY" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { shift_unlinked: $.data.id }
            - call: "GET /staff-shifts"
              payload: { themed_room_id: "${room_a}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /staff-shifts"
              payload: { themed_room_id: "${room_b}" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "GET /staff-shifts"
              payload: { run_id: "${run_a}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /staff-shifts"
              payload: { run_id: "${run_b}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /staff-shifts"
              payload: { staff_member_id: "${staff_a}", themed_room_id: "${room_a}", status: "SCHEDULED" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /staff-shifts/${shift_unlinked}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
          assert:
            - "trigger 1 responds 404 with data.error_id == ERR_ROOM_NOT_FOUND: ${room_b} is a stored ThemedRoom, but its run_id is ${run_b} while the shift's run_id is ${run_a}, so out of scope is reported exactly as if the row did not exist"
            - "trigger 2 responds 404 with data.error_id == ERR_ROOM_NOT_FOUND: an id naming nothing at all is indistinguishable to the caller from the out-of-scope id in trigger 1"
            - "neither refusal wrote anything: GET /staff-shifts?staff_member_id=${staff_a} reports total_count == 0 at that point"
            - "trigger 3 responds 201 with themed_room_id ${room_a}, run_id ${run_a} copied from the staff member rather than supplied, status SCHEDULED and version 1"
            - "trigger 4 responds 201 with themed_room_id null and station ENTRY: the link is genuinely optional, and its window sits a day clear of the first shift so the rest buffer is not engaged"
            - "trigger 5 responds 200 with total_count == 1 and the single shift ${shift_linked}: the room-filtered list is the reverse channel from ThemedRoom to StaffShift"
            - "trigger 6 responds 200 with total_count == 0 - run_b's room has no shifts - and SafetyOfficer may run this read, so the reverse channel is not producer-only"
            - "trigger 7 responds 200 with total_count == 2, covering both the linked and the unlinked shift, because run_id was derived for both"
            - "trigger 8 responds 200 with total_count == 0: no shift was ever attached to run_b, including the one that named its room"
            - "trigger 9 responds 200 with total_count == 1: the three filters intersect, so the unlinked SCHEDULED shift of the same member is excluded by themed_room_id alone"
            - "trigger 10 responds 200 with run_id ${run_a} and themed_room_id null, proving the derived run link survives independently of the optional room link"

      - name: end_lease_is_conditional_on_every_run_at_the_venue_being_finished
        claim_type: conditional_action
        grounds:
          - endpoints[POST /venues/{venueId}/end-lease]
          - state_machines.PopupVenue
          - validations[priority 80]
          - errors[ERR_VENUE_HAS_ACTIVE_RUN]
          - errors[ERR_VENUE_INVALID_STATE]
        distinguishing_aspect: |
          end-lease is the only action whose precondition is a quantifier over CHILD rows of a
          different entity - no run at this venue may still be PLANNED, OPEN, EXTENDED or CLOSING -
          and its input is empty, so the caller supplies nothing the check could key on. It is also
          the one place where a P70 own-state refusal and a P80 cross-entity refusal are reachable on
          the SAME endpoint with the same payload, which makes the priority order observable: a DRAFT
          venue with no runs at all reports its own state, while a LEASE_ACTIVE venue with a live run
          reports the run. An implementation that only checks run_status == OPEN releases the venue
          while a CLOSING run is still settling; one that folds both refusals into a single id makes
          the two indistinguishable.
