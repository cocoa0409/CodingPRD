              captures: { wish_v2: $.data.version }
            - call: "POST /wish-grant/fulfillment-plans"
              payload: { wish_id: "${wish_id}", cash_cost_cents: 100000, expected_wish_version: "${wish_v2}" }
              as: ChapterDirector
              as_user_id: "dir-1"
              captures: { plan_id: $.data.id, plan_creator: $.data.created_by_user_id }
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/submit"
              payload: {}
              as: ChapterDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/approve"
              payload: {}
              as: ChapterDirector
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/approve"
              payload: {}
              as: ChapterDirector
              as_user_id: "dir-2"
          assert:
            - "plan_creator == dir-1 (a ChapterDirector CAN create plans - shared operation)"
            - "approve by dir-1 fails: err == ERR_SEGREGATION_OF_DUTIES (403)"
            - "approve by dir-2 succeeds: FulfillmentPlan.${plan_id}.status == APPROVED and approved_by_user_id == dir-2"

