scaffold_corner_design:
  - section: entities
    instances:
      - name: c_supplier_creation_defaults
        claim_type: defaults
        grounds: [entities.Supplier.fields.qualification_status, entities.Supplier.fields.allergens_handled]
        distinguishing_aspect: "Omitting qualification_status and allergens_handled applies defaults PROVISIONAL and []; system fields id/created_at/updated_at/version are server-set with version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /mfg/suppliers", payload: { name: "S-DEF" }, as: PlantAdmin, captures: { sup: "$.data.id", qs: "$.data.qualification_status", ah: "$.data.allergens_handled", v: "$.data.version" } }
          assert:
            - "Supplier.qualification_status == PROVISIONAL (default applied)"
            - "Supplier.allergens_handled == [] (default applied)"
            - "version == 1 and id is a server-minted UUID; created_at == 2026-08-01T00:00:00.000Z (logical clock default date)"

      - name: c_ingredient_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Ingredient.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field name on ingredient create yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mfg/ingredients", payload: { category: "PROTEIN", nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_INVALID_REQUEST (400)"]

      - name: c_ingredient_invalid_enum_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Ingredient.fields.category, "errors[ERR_INVALID_ENUM_VALUE]"]
        distinguishing_aspect: "category 'MEAT' is not a declared enum member -> ERR_INVALID_ENUM_VALUE (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mfg/ingredients", payload: { name: "BAD", category: "MEAT" }, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_INVALID_ENUM_VALUE (400)"]

      - name: c_revision_computed_fields
        claim_type: computed_fields
        grounds: [entities.FormulaRevision.fields.revision_no, entities.FormulaRevision.fields.allergen_profile]
        distinguishing_aspect: "revision_no auto-assigns 1 then 2 within a formula; allergen_profile is the computed sorted union of line ingredient tags [MILK, WHEAT]."
        test_recipe:
          setup: ["APPROVED supplier; WHEY [MILK] and OATS [WHEAT] ingredients; customer C1; formula F"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "OATS", category: "BINDER", allergen_tags: ["WHEAT"] }, as: PlantAdmin, captures: { oats: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F", bar_weight_g: 60 }, as: FormulationScientist, captures: { f: "$.data.id" } }
          trigger:
            - { call: "POST /mfg/formulas/${f}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }, { ingredient_id: "${oats}", qty_kg_per_batch: 40, is_protein_contributor: false }], batch_size_kg: 100, target_protein_g_per_serving: 15 }, as: FormulationScientist, captures: { r1: "$.data.id", n1: "$.data.revision_no", ap1: "$.data.allergen_profile", st1: "$.data.status" } }
            - { call: "POST /mfg/formulas/${f}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 45, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 17 }, as: FormulationScientist, captures: { r2: "$.data.id", n2: "$.data.revision_no", ap2: "$.data.allergen_profile" } }
          assert:
            - "first revision_no == 1, status == DRAFT, allergen_profile == [MILK, WHEAT] (sorted union)"
            - "second revision_no == 2, allergen_profile == [MILK]"

      - name: c_not_found_sweep
        claim_type: not_found
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "Every resource type answers its own domain-specific 404 on a random UUID path id."
        test_recipe:
          setup: ["empty DB (no resources)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mfg/customers/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_customer: "$.data.error_id" } }
            - { call: "GET /mfg/suppliers/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_supplier: "$.data.error_id" } }
            - { call: "GET /mfg/formulas/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_formula: "$.data.error_id" } }
            - { call: "GET /mfg/revisions/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_revision: "$.data.error_id" } }
            - { call: "GET /mfg/ingredients/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_ingredient: "$.data.error_id" } }
            - { call: "GET /mfg/ingredient-lots/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_lot: "$.data.error_id" } }
            - { call: "GET /mfg/lines/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_line: "$.data.error_id" } }
            - { call: "GET /mfg/agreements/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_agreement: "$.data.error_id" } }
            - { call: "GET /mfg/slots/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_slot: "$.data.error_id" } }
            - { call: "GET /mfg/changeovers/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_changeover: "$.data.error_id" } }
            - { call: "GET /mfg/shelf-life-studies/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_study: "$.data.error_id" } }
            - { call: "GET /mfg/lot-releases/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_release: "$.data.error_id" } }
            - { call: "GET /mfg/claim-reviews/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_claim: "$.data.error_id" } }
            - { call: "GET /mfg/production-runs/11111111-1111-1111-1111-111111111111", payload: {}, as: PlantAdmin, captures: { e_run: "$.data.error_id" } }
          assert:
            - "ERR_CUSTOMER_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_FORMULA_NOT_FOUND, ERR_REVISION_NOT_FOUND, ERR_INGREDIENT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_CHANGEOVER_NOT_FOUND, ERR_STUDY_NOT_FOUND, ERR_RELEASE_NOT_FOUND, ERR_CLAIM_REVIEW_NOT_FOUND, ERR_RUN_NOT_FOUND respectively (all 404)"

      - name: c_lot_body_fk_existence
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_INGREDIENT_NOT_FOUND]"]
        distinguishing_aspect: "A body FK (ingredient_id) referencing a nonexistent ingredient is rejected 404 ERR_INGREDIENT_NOT_FOUND before any other lot validation."
        test_recipe:
          setup: ["APPROVED supplier exists"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
          trigger:
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "22222222-2222-2222-2222-222222222222", supplier_id: "${sup}", lot_code: "X-1", received_qty_kg: 10, received_at: "2026-08-01T00:00:00Z" }, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_INGREDIENT_NOT_FOUND (404)"]

      - name: c_ingredients_pagination
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 3 ingredients, limit 2 -> 2 items has_more true; offset 2 -> 1 item has_more false."
        test_recipe:
          setup: ["three ingredients I1, I2, I3"]
          setup_api_calls:
            - { call: "POST /mfg/ingredients", payload: { name: "I1", category: "BINDER" }, as: PlantAdmin }
            - { call: "POST /mfg/ingredients", payload: { name: "I2", category: "FAT" }, as: PlantAdmin }
            - { call: "POST /mfg/ingredients", payload: { name: "I3", category: "FLAVOR" }, as: PlantAdmin }
          trigger:
            - { call: "GET /mfg/ingredients", payload: { limit: 2, offset: 0 }, as: PlantAdmin, captures: { first0: "$.data[0].id" } }
            - { call: "GET /mfg/ingredients", payload: { limit: 2, offset: 2 }, as: PlantAdmin, captures: { last0: "$.data[0].id" } }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): data length == 1, total_count == 3, has_more == false"

  - section: state_machines
    instances:
      - name: c_lot_initial_quarantine
        claim_type: initial_state
        grounds: [state_machines.IngredientLot]
        distinguishing_aspect: "A newly received lot starts in QUARANTINE with available == received and reserved == consumed == 0."
        test_recipe:
          setup: ["APPROVED supplier; WHEY ingredient"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
          trigger:
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 50, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { st: "$.data.status", av: "$.data.available_qty_kg", rv: "$.data.reserved_qty_kg" } }
          assert: ["status == QUARANTINE; available_qty_kg == 50.00; reserved_qty_kg == 0; consumed_qty_kg == 0"]

      - name: c_lot_release_transition
        claim_type: valid_transition
        grounds: [state_machines.IngredientLot.QUARANTINE_to_RELEASED]
        distinguishing_aspect: "QualityManager releases a QUARANTINE lot -> RELEASED; version increments 1 -> 2."
        test_recipe:
          setup: ["QUARANTINE lot WL-1"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 50, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
          trigger:
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager, captures: { st: "$.data.status", v: "$.data.version" } }
          assert: ["status == RELEASED; version == 2"]

      - name: c_terminal_lot_release_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IngredientLot, "validations[priority=8]", "errors[ERR_TERMINAL_STATE_LOCKED]"]
        distinguishing_aspect: "REJECTED is terminal: releasing a rejected lot answers ERR_TERMINAL_STATE_LOCKED (409), which outranks the generic state check."
        test_recipe:
          setup: ["lot WL-1 rejected from QUARANTINE"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 50, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/reject", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_TERMINAL_STATE_LOCKED (409); lot remains REJECTED"]

      - name: c_agreement_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ManufacturingAgreement, "errors[ERR_TERMINAL_STATE_LOCKED]"]
        distinguishing_aspect: "Activating a TERMINATED agreement is rejected with ERR_TERMINAL_STATE_LOCKED."
        test_recipe:
          setup: ["agreement for ACTIVE customer marched NEGOTIATION -> ACTIVE -> TERMINATED"]
          setup_api_calls:
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 300, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin }
            - { call: "POST /mfg/agreements/${ag}/terminate", payload: {}, as: PlantAdmin, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert: ["agreement reached TERMINATED; re-activate returns error_id == ERR_TERMINAL_STATE_LOCKED (409)"]

      - name: c_superseded_revision_locked
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FormulaRevision, "errors[ERR_TERMINAL_STATE_LOCKED]"]
        distinguishing_aspect: "A SUPERSEDED revision accepts no further transitions: submit on it returns ERR_TERMINAL_STATE_LOCKED."
        test_recipe:
          setup: ["formula F with R1 APPROVED then R2 APPROVED (R1 SUPERSEDED)"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F", bar_weight_g: 60 }, as: FormulationScientist, captures: { f: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 15, claim_tags: [] }, as: FormulationScientist, captures: { r1: "$.data.id" } }
            - { call: "POST /mfg/revisions/${r1}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r1}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${r1}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r1}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/formulas/${f}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 42, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 16, claim_tags: [] }, as: FormulationScientist, captures: { r2: "$.data.id" } }
            - { call: "POST /mfg/revisions/${r2}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r2}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${r2}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r2}/approve", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /mfg/revisions/${r1}/submit", payload: {}, as: FormulationScientist, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_TERMINAL_STATE_LOCKED (409); R1 remains SUPERSEDED"]

      - name: c_changeover_fail_reclean_cycle_and_ppm_limit
        claim_type: valid_transition
        grounds: [state_machines.ChangeoverEvent.FAILED_to_CLEANING_LOGGED, state_machines.ChangeoverEvent.SWAB_RECORDED_to_FAILED, "errors[ERR_SWAB_PPM_EXCEEDS_LIMIT]"]
        distinguishing_aspect: "Cyclic changeover: a 21 ppm swab cannot validate (ERR_SWAB_PPM_EXCEEDS_LIMIT, event stays SWAB_RECORDED); explicit fail -> FAILED -> re-clean -> CLEANING_LOGGED -> fresh swab 10 ppm -> VALIDATED, setting last_wet_clean_utc."
        test_recipe:
          setup:
            - "fixture: WHEY/OATS/SOYPROT ingredients + lots released; AG3 ACTIVE; line LX; revision RW profile [MILK,WHEAT] APPROVED; run A completed on LX"
            - "revision RB profile [SOY] APPROVED; run B scheduled 2026-08-06T12:00-14:00Z => changeover SWAB_RECORDED path armed (carryover {MILK,WHEAT})"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK", "SOY", "WHEAT"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "OATS", category: "BINDER", allergen_tags: ["WHEAT"] }, as: PlantAdmin, captures: { oats: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "SOYPROT", category: "PROTEIN", allergen_tags: ["SOY"], nominal_protein_pct: 0.85 }, as: PlantAdmin, captures: { soy: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${oats}", supplier_id: "${sup}", lot_code: "OL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z" }, as: PlantAdmin, captures: { ol: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${ol}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${soy}", supplier_id: "${sup}", lot_code: "SPL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.85 }, as: PlantAdmin, captures: { spl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${spl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 300, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin, captures: { ag_v0: "$.data.version" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FW", bar_weight_g: 60 }, as: FormulationScientist, captures: { fw: "$.data.id" } }
            - { call: "POST /mfg/formulas/${fw}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }, { ingredient_id: "${oats}", qty_kg_per_batch: 40, is_protein_contributor: false }], batch_size_kg: 100, target_protein_g_per_serving: 15, claim_tags: [] }, as: FormulationScientist, captures: { rw: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rw}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rw}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${rw}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rw}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/lines", payload: { name: "LX", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { lx: "$.data.id", lx_v: "$.data.version" } }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${rw}", agreement_id: "${ag}", line_id: "${lx}", planned_cases: 100, expected_agreement_version: "${ag_v0}" }, as: ProductionPlanner, captures: { runA: "$.data.id" } }
            - { call: "POST /mfg/production-runs/${runA}/schedule", payload: { start_utc: "2026-08-06T08:00:00Z", end_utc: "2026-08-06T10:00:00Z", expected_line_version: "${lx_v}" }, as: ProductionPlanner }
            - { call: "POST /mfg/production-runs/${runA}/verify-pre-run", payload: {}, as: QualityManager }
            - { call: "POST /mfg/production-runs/${runA}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /mfg/production-runs/${runA}/complete", payload: { produced_cases: 100, scrapped_cases: 0 }, as: ProductionPlanner }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FB", bar_weight_g: 60 }, as: FormulationScientist, captures: { fb: "$.data.id" } }
