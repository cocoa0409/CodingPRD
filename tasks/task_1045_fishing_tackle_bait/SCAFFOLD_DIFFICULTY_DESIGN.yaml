scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: charter_settlement_provisional_vs_final_gold_discount
        grounds:
          - "calculations.charter_settlement"
          - "state_machines.CharterBooking.CHECKED_IN_to_COMPLETED"
          - "entities.CharterBooking.fields.provisional_total_cents"
          - "entities.CharterBooking.fields.final_total_cents"
        distinguishing_aspect: "On CharterBooking, the provisional variant (gross seat+fuel, no discount) and the final variant (gross * (1 - GOLD 0.10) rounded) yield different totals for the same booking — the dual-variant subject is the CharterBooking domain."
        test_recipe:
          setup:
            - "Clock at 2026-07-15. Customer M is GOLD (lifetime>=2000) and holds an ACTIVE fishing license covering 2026-08-01. Charter C (guide G) runs 2026-08-01 09:00-12:00, price_per_seat 15000, fuel 2000, capacity 6. M has a PAID, CHECKED_IN booking for 2 seats."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M Angler", email: "m.dv1@x.com", date_of_birth: "1980-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/customers/${m_id}/loyalty-adjustments"
              payload: { points_delta: 2000, reason: "promo-seed-gold" }
              as: ShopManager
            - call: "POST /api/license-types"
              payload: { code: "CA-ANN", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { ls_id: "$.data.id" }
            - call: "POST /api/guides"
              payload: { name: "Cap G", license_no: "G-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "AM Bass", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T12:00:00Z", capacity: 6, price_per_seat_cents: 15000, fuel_surcharge_cents: 2000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${m_id}", seats: 2 }
              as: ShopClerk
              captures: { b_id: "$.data.id", prov: "$.data.provisional_total_cents" }
            - call: "POST /api/charter-bookings/${b_id}/pay"
              payload: {}
              as: ShopClerk
            - call: "POST /api/charter-bookings/${b_id}/check-in"
              payload: {}
              as: ShopClerk
          trigger:
            - call: "POST /api/charter-bookings/${b_id}/complete"
              payload: {}
              as: ShopClerk
              captures: { fin: "$.data.final_total_cents" }
          assert:
            - "CharterBooking.${b_id}.provisional_total_cents == 34000"
            - "CharterBooking.${b_id}.final_total_cents == 30600"
            - "CharterBooking.${b_id}.provisional_total_cents != CharterBooking.${b_id}.final_total_cents"

      - name: service_order_quoted_vs_final_actual_meters_and_parts
        grounds:
          - "calculations.service_order_charge"
          - "state_machines.ServiceOrder.INTAKE_to_DIAGNOSED"
          - "state_machines.ServiceOrder.IN_PROGRESS_to_READY"
          - "entities.ServiceOrder.fields.quoted_cents"
          - "entities.ServiceOrder.fields.final_subtotal_cents"
        distinguishing_aspect: "On ServiceOrder, the quoted variant uses estimated meters and excludes parts, while the final variant uses actual meters plus parts — a different entity domain from charter_settlement, so the scaffold shows dual-variant logic on two subjects."
        test_recipe:
          setup:
            - "Customer C, spool Product P (stock 50). ServiceOrder S is a SPOOLING job, base 2500, line rate 30 cents/m, estimated 100 m; it has been DIAGNOSED (quote pinned) and moved IN_PROGRESS."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Owner", email: "c.dv2@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/products"
              payload: { sku: "LINE-8", name: "8lb mono", category: "LINE", unit_price_cents: 0, stock_qty: 50 }
              as: ShopManager
              captures: { p_id: "$.data.id" }
            - call: "POST /api/service-orders"
              payload: { customer_id: "${c_id}", service_type: "SPOOLING", base_service_cents: 2500, product_id: "${p_id}", line_price_cents_per_meter: 30, estimated_line_meters: 100 }
              as: ShopClerk
              captures: { s_id: "$.data.id" }
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
              captures: { quoted: "$.data.quoted_cents" }
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: ShopClerk
          trigger:
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "READY", actual_line_meters: 120, parts_cents: 800, line_units: 2 }
              as: ShopClerk
              captures: { fin: "$.data.final_subtotal_cents" }
          assert:
            - "ServiceOrder.${s_id}.quoted_cents == 5500"
            - "ServiceOrder.${s_id}.final_subtotal_cents == 6900"
            - "ServiceOrder.${s_id}.quoted_cents != ServiceOrder.${s_id}.final_subtotal_cents"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: license_price_adult_tier_plus_peak_surcharge_mode_a
        grounds:
          - "calculations.license_price"
          - "entities.LicenseSale.fields.price_paid_cents"
          - "entities.LicenseType.fields.peak_surcharge_cents"
        distinguishing_aspect: "Mode (a): >=3 inputs (age, three age-tier config prices, peak-month window) combine non-linearly via tiered age-branch selection plus a conditional seasonal surcharge — adult (age 40) selects base 4000 and July lands in the peak window, adding 500 -> 4500."
        test_recipe:
          setup:
            - "Clock at 2026-07-10. Customer A is 40 (dob 1986-01-01). LicenseType LT has base 4000, youth<=15 ->1000, senior>=65 ->2000, peak months 6-8 surcharge 500, min_age 0, season all of 2026."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "A Adult", email: "a.cf1@x.com", date_of_birth: "1986-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { a_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-TIER", state_code: "CA", license_class: "RESIDENT", base_price_cents: 4000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365, youth_max_age: 15, youth_price_cents: 1000, senior_min_age: 65, senior_price_cents: 2000, peak_surcharge_cents: 500, peak_start_month: 6, peak_end_month: 8 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
          trigger:
            - call: "POST /api/license-sales"
              payload: { customer_id: "${a_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { ls_id: "$.data.id", price: "$.data.price_paid_cents" }
          assert:
            - "LicenseSale.${ls_id}.price_paid_cents == 4500"

      - name: service_order_grand_total_discount_then_tax_mode_c
        grounds:
          - "calculations.service_order_grand_total"
          - "state_machines.ServiceOrder.READY_to_PICKED_UP"
          - "entities.ServiceOrder.fields.grand_total_cents"
        distinguishing_aspect: "Mode (c): pinned evaluation order — subtotal 6900 -> SILVER discount keyed on that subtotal (0.05 => 345) -> 8% tax on the discounted 6555 (=> 524) -> total 7079; a different combinatorial axis (ordering) from the tiered license_price."
        test_recipe:
          setup:
            - "Customer C is SILVER (lifetime>=500). Spool Product P (stock 50). ServiceOrder S (base 2500, rate 30, estimated 100) has been DIAGNOSED, IN_PROGRESS, then READY with actual 120 m and parts 800 (final_subtotal 6900)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Silver", email: "c.cf2@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/customers/${c_id}/loyalty-adjustments"
              payload: { points_delta: 500, reason: "seed-silver" }
              as: ShopManager
            - call: "POST /api/products"
              payload: { sku: "LINE-10", name: "10lb mono", category: "LINE", unit_price_cents: 0, stock_qty: 50 }
              as: ShopManager
              captures: { p_id: "$.data.id" }
            - call: "POST /api/service-orders"
              payload: { customer_id: "${c_id}", service_type: "SPOOLING", base_service_cents: 2500, product_id: "${p_id}", line_price_cents_per_meter: 30, estimated_line_meters: 100 }
              as: ShopClerk
              captures: { s_id: "$.data.id" }
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: ShopClerk
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "READY", actual_line_meters: 120, parts_cents: 800, line_units: 2 }
              as: ShopClerk
          trigger:
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "PICKED_UP" }
              as: ShopClerk
              captures: { gt: "$.data.grand_total_cents" }
          assert:
            - "ServiceOrder.${s_id}.grand_total_cents == 7079"

  # =================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charter_booking_payment_and_attendance_dimensions_independent
        grounds:
          - "state_machines.CharterBooking_payment.UNPAID_to_PAID"
          - "state_machines.CharterBooking.RESERVED_to_CHECKED_IN"
          - "entities.CharterBooking.fields.booking_status"
          - "entities.CharterBooking.fields.payment_status"
        distinguishing_aspect: "Parallel dimensions on one CharterBooking: paying advances payment_status UNPAID->PAID while booking_status remains RESERVED (the attendance axis does not auto-advance), proving the two axes evolve independently."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Customer M with ACTIVE license. Charter C 2026-08-02, price 10000 fuel 0, capacity 4. M has a RESERVED, UNPAID booking for 1 seat."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M Par", email: "m.nl1@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-ANN2", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap H", license_no: "H-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "PM Trip", start_at: "2026-08-02T09:00:00Z", end_at: "2026-08-02T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${m_id}", seats: 1 }
              as: ShopClerk
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /api/charter-bookings/${b_id}/pay"
              payload: {}
              as: ShopClerk
          assert:
            - "CharterBooking.${b_id}.payment_status == PAID"
            - "CharterBooking.${b_id}.booking_status == RESERVED"

      - name: service_order_cycle_reenters_diagnosed_from_in_progress
        grounds:
          - "state_machines.ServiceOrder.INTAKE_to_DIAGNOSED"
          - "state_machines.ServiceOrder.DIAGNOSED_to_IN_PROGRESS"
          - "state_machines.ServiceOrder.IN_PROGRESS_to_DIAGNOSED"
          - "entities.ServiceOrder.fields.status"
        distinguishing_aspect: "ServiceOrder is cyclic: after INTAKE->DIAGNOSED->IN_PROGRESS it re-enters DIAGNOSED (a back-edge), re-running the quote — a genuine cycle on a different entity than the parallel CharterBooking."
        test_recipe:
          setup:
            - "Customer C. ServiceOrder S (base 2500, rate 30, estimated 100) DIAGNOSED (quoted 5500) then IN_PROGRESS."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Cyc", email: "c.nl2@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/service-orders"
              payload: { customer_id: "${c_id}", service_type: "SPOOLING", base_service_cents: 2500, line_price_cents_per_meter: 30, estimated_line_meters: 100 }
              as: ShopClerk
              captures: { s_id: "$.data.id" }
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: ShopClerk
          trigger:
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
          assert:
            - "ServiceOrder.${s_id}.status == DIAGNOSED"
            - "ServiceOrder.${s_id}.quoted_cents == 5500"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: customer_suspend_depth3_cancel_release_promote_waitlist
        grounds:
          - "state_machines.Customer.ACTIVE_to_SUSPENDED"
          - "state_machines.CharterBooking.RESERVED_to_CANCELLED"
          - "state_machines.Charter.FULL_to_OPEN"
          - "state_machines.CharterBooking.WAITLISTED_to_RESERVED"
        distinguishing_aspect: "Depth-3 chain from a customer suspend: suspend A (hop0) -> A's booking CANCELLED (hop1) -> Charter FULL->OPEN on seat release (hop2) -> earliest WAITLISTED booking W1 promoted to RESERVED (hop3); each link is caused by the previous, not by the suspend directly."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Charter C (guide G) capacity 1, start 2026-08-01, price 10000. Customer A (license) holds the single seat (charter FULL). W1 then W2 (both licensed, W1 created before W2) are WAITLISTED on C."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/license-types"
              payload: { code: "CA-ANN3", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/guides"
              payload: { name: "Cap I", license_no: "I-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "Solo", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T12:00:00Z", capacity: 1, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "A Holder", email: "a.tc1@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { a_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${a_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${a_id}", seats: 1 }
              as: ShopClerk
              captures: { ba_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "W1 Wait", email: "w1.tc1@x.com", date_of_birth: "1988-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { w1_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${w1_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${w1_id}", seats: 1, waitlist_requested: true }
              as: ShopClerk
              captures: { bw1_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "W2 Wait", email: "w2.tc1@x.com", date_of_birth: "1989-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { w2_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${w2_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${w2_id}", seats: 1, waitlist_requested: true }
              as: ShopClerk
              captures: { bw2_id: "$.data.id" }
          trigger:
            - call: "POST /api/customers/${a_id}/status"
              payload: { status: "SUSPENDED" }
              as: ShopManager
          assert:
            - "Customer.${a_id}.status == SUSPENDED"
            - "CharterBooking.${ba_id}.booking_status == CANCELLED"
            - "CharterBooking.${bw1_id}.booking_status == RESERVED"
            - "CharterBooking.${bw2_id}.booking_status == WAITLISTED"
            - "Charter.${c_id}.status == FULL"

      - name: guide_suspend_depth2_cancel_charter_then_refund_booking
        grounds:
          - "state_machines.Guide.AVAILABLE_to_SUSPENDED"
          - "state_machines.Charter.OPEN_to_CANCELLED"
          - "state_machines.CharterBooking.RESERVED_to_CANCELLED"
          - "entities.CharterBooking.fields.refund_amount_cents"
        distinguishing_aspect: "Depth-2 chain from a different trigger (guide suspend): suspend G (hop0) -> Charter CANCELLED (hop1) -> booking CANCELLED with a full guide-initiated refund of 26000 (hop2); distinct propagation origin from the customer-suspend cascade."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Guide G2, Charter C2 capacity 4 start 2026-08-05, price 12000 fuel 1000. Customer A (license) has a PAID booking for 2 seats (amount_paid 26000)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/license-types"
              payload: { code: "CA-ANN4", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "A Pay", email: "a.tc2@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { a_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${a_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap J", license_no: "J-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "Group", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T13:00:00Z", capacity: 4, price_per_seat_cents: 12000, fuel_surcharge_cents: 1000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${a_id}", seats: 2 }
              as: ShopClerk
              captures: { b_id: "$.data.id" }
            - call: "POST /api/charter-bookings/${b_id}/pay"
              payload: {}
              as: ShopClerk
          trigger:
            - call: "POST /api/guides/${g_id}/status"
              payload: { status: "SUSPENDED" }
              as: ShopManager
          assert:
            - "Guide.${g_id}.status == SUSPENDED"
            - "Charter.${c_id}.status == CANCELLED"
            - "CharterBooking.${b_id}.booking_status == CANCELLED"
            - "CharterBooking.${b_id}.payment_status == REFUNDED"
            - "CharterBooking.${b_id}.refund_amount_cents == 26000"

  # =================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_beats_seat_capacity
        grounds:
          - "validations[priority=5]"
          - "validations[priority=12]"
          - "errors[ERR_CHARTER_NOT_OPEN]"
          - "errors[ERR_INSUFFICIENT_SEATS]"
        distinguishing_aspect: "A single booking request violates both the state rule (charter CANCELLED, priority 5) and the capacity rule (5 seats > capacity 1, priority 12); the state error wins — category pair state x business_constraint."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Charter C capacity 1 start 2026-08-10 is CANCELLED. Customer B holds an ACTIVE license (so the referential license check would pass, isolating state-vs-capacity)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/license-types"
              payload: { code: "CA-ANN5", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
