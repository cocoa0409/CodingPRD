            - "e4 == ERR_WORKER_HOUSING_OVERLAP (W_A already OCCUPIED in U_OK; unit capacity was fine — the per-worker one-bed rule is distinct)"
            - "e5 == ERR_HOUSING_ASSIGNMENT_INVALID_STATE (second vacate on VACATED row; move_out stays 2026-09-05)"
            - "exp_status == EXPIRED after clock 2027-08-02 > valid_until 2027-08-01"
            - "U_EXP re-inspection PASS recertifies: inspection_status CERTIFIED with certified_on 2027-08-02 and certification_valid_until 2028-08-02 (EXPIRED -> CERTIFIED cycle leg)"
