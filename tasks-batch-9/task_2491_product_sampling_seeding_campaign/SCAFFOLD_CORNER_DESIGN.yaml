          setup:
            - "One campaign in SCREENING_OPEN with holdout_pct 0.2 and one ACTIVE kit line."
            - "Five panelists, each with a distinct address_hash and an account older than 30 days, all in the target segment, so every screening scores 0.0 and passes."
            - "Five enrollments created in order, receiving enrollment_seq 1..5; the first four have already been screened."
