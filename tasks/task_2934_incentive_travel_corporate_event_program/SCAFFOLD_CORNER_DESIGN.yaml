      - 'The same body with "expected_program_version": ${pv_stale} + 5.'
      - The same body with the expected_program_version field omitted entirely, and again with it sent
        as the string "7".
      - 'GET /programs/${p_id} as TravelDesk td-01 to read the current version as ${pv_now}, then the
        same POST body with "expected_program_version": ${pv_now}.'
      - GET /programs/${p_id} once more, then POST /registrations for a GUEST seat of ${ra_id} carrying
        the version read before Ben's seat was created.
      assert:
      - The stale create is rejected with ERR_STALE_PROGRAM_VERSION and HTTP 412, and GET /registrations?qualifier_id=${qb_id}
        still returns total_count 0.
      - A version from the future is rejected with the same ERR_STALE_PROGRAM_VERSION and HTTP 412 — the
        guard is an equality check against the current version, not a "not older than" check.
      - 'Omitting the field returns ERR_INVALID_REQUEST with HTTP 400, and sending it as a string returns
        ERR_INVALID_REQUEST with HTTP 400: schema validation runs before the version comparison, so a
        malformed guard is never treated as a stale guard.'
