              captures: { l2_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-3000", encounter_id: "ENC-3", payer_code: "BCBS_STATE", service_datetime: "2026-06-04T08:00:00Z", quantity: 50, posted_charge_cents: 6400000 }
              as: DepartmentManager
