          - errors[ERR_CERT_TESTS_INCOMPLETE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certification_priority_business_referential_over_state
          rationale: "The named §1.8 instance provokes both violations in one request and pins which error_id wins, which is the entire priority-ordering claim."

