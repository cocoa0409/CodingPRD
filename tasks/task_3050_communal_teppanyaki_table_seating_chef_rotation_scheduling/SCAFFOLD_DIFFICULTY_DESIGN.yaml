        distinguishing_aspect: "A parallel state dimension, not a linear course list: after DESSERT finishes, DESSERT returns to PLANNED and a CELEBRATION phase is created, so DESSERT and CELEBRATION progress independently on the same reservation. DESSERT can sit at SKIPPED while CELEBRATION reaches FINISHED, and the two rows never share a status."
