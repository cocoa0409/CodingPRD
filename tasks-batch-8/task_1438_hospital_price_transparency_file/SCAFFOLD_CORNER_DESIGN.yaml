          assert: ["error_id == ERR_FILE_NOT_SEALED (http 409) — F1.generation_status == SUPERSEDED"]

      - name: rate_create_on_terminated_contract_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_NOT_EDITABLE]", "state_machines.PayerNegotiatedRate"]
        distinguishing_aspect: "Rate creation requires the contract in {DRAFT, RENEGOTIATING}; against a TERMINATED contract it fails ERR_CONTRACT_NOT_EDITABLE with all references valid."
        test_recipe:
          setup: ["Facility F; payer PA; contract CA ACTIVATED then TERMINATED; item SI"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-ER4", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/terminate", as: ContractManager }
          trigger:
