              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Halvorsen Bulk Fuel Co", fein: "41-3000001", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /mft/licensees/${r_id}/bonds"
              payload: { amount_cents: 1600000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${r_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${r_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${r_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { r_ret_id: $.data.id }
            - call: "POST /mft/returns/${r_ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 17482.52 }
              as: ReturnsExaminer
              captures: { r_sch_gas: $.data.id }
            - call: "POST /mft/schedules/${r_sch_gas}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 17482.52, document_date: "2026-08-08", bill_of_lading_number: "BOL-R2-GAS-001" }
              as: ReturnsExaminer
