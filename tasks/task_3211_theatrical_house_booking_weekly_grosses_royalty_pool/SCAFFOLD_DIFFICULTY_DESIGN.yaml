              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 10000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
              captures: { lic1: $.data.id }
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "POST /theatres/license-agreements/${lic1}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v3: $.data.version }
          trigger:
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 600000, stop_clause_weekly_floor_cents: 10000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v3}" }
              as: HouseManager
              captures: { lic2: $.data.id }
          assert:
            - "LicenseAgreement.${lic1}.status == SUPERSEDED (compensating action)"
            - "LicenseAgreement.${lic2}.status == DRAFT (forward action)"
            - "Count of LicenseAgreements for booking ${bk_id} with status in {DRAFT, SIGNED} == 1 (invariant preserved across the supersede pair)"
