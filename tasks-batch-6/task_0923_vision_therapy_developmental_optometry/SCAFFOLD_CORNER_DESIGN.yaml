              payload: { patient_id: "${pt}", direction: "INBOUND", urgency: "ROUTINE", referring_provider_name: "Dr Amara Family Eyecare", target_provider_name: "Vision Therapy Clinic", reason: "Convergence insufficiency workup" }
              as: FrontDesk
              captures: { ref: $.data.id, a0: $.data.attempt_count, sla: $.data.sla_due_at }
            - call: "POST /vision-therapy/referrals/${ref}/respond"
              payload: { response_outcome: "DECLINED", decline_reason: "No capacity" }
              as: FrontDesk
            - call: "POST /vision-therapy/referrals/${ref}/re-refer"
              payload: { target_provider_name: "Northside Vision Therapy" }
              as: FrontDesk
              captures: { a1: $.data.attempt_count }
            - call: "POST /vision-therapy/referrals/${ref}/respond"
              payload: { response_outcome: "DECLINED", decline_reason: "Out of network" }
              as: FrontDesk
            - call: "POST /vision-therapy/referrals/${ref}/re-refer"
              payload: { target_provider_name: "Lakeside Optometry" }
              as: FrontDesk
              captures: { a2: $.data.attempt_count }
            - call: "POST /vision-therapy/referrals/${ref}/respond"
              payload: { response_outcome: "DECLINED", decline_reason: "Waitlist closed" }
              as: FrontDesk
          trigger:
            - call: "POST /vision-therapy/referrals/${ref}/re-refer"
              payload: { target_provider_name: "Harbour Eye Institute" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "${a0} == 1 and ${a1} == 2 and ${a2} == 3"
            - "${sla} == 2026-06-06T00:00:00.000Z, that is creation plus ROUTINE_REFERRAL_SLA_HOURS of 120"
            - "${err} == ERR_REFERRAL_ATTEMPT_LIMIT"
            - "HTTP 409"
            - "Referral.${ref}.status == ABANDONED, committed before the rejection"
            - "Referral.${ref}.attempt_count == 3, unchanged by the refused call"

