            - call: "POST /applications/${app_en1_id}/enroll"
              payload: {}
              as: Applicant
              as_user_id: "${a_en_id}"
          assert:
            - "Application.${app_en1_id}.status == 'ENROLLED'"
            - "Application.${app_en2_id}.status == 'DECLINED' (cascade hop 1)"
            - "AidPackage.${aid_en2_id}.status == 'REVOKED' (cascade hop 2 — caused by app_en2 DECLINE, not by enroll directly)"
            - "AidPackage.${aid_en1_id}.status == 'FINALIZED' (enrolled application's aid is preserved)"
            - "School.${s_enroll_id}.enrolled_count == 1"
            - "School.${s_enroll_id}.admitted_count == 0"
            - "School.${s_other_id}.admitted_count == 0"
            - "School.${s_other_id}.declined_count == 1"

      - name: deny_chains_through_aid_revoke_depth_2
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_DENIED
          - state_machines.AidPackage.FINALIZED_to_REVOKED
        distinguishing_aspect: |
          Depth-2 cascade chain from a DIFFERENT trigger (POST /applications/{id}/deny):
          (1) Application UNDER_REVIEW→DENIED;
          (2) that mutation cascades the linked FINALIZED AidPackage FINALIZED→REVOKED.
          Trigger differs from instance 1 (enroll). This pair captures two distinct
          propagation patterns.
        test_recipe:
          setup:
            - "Applicant A has an UNDER_REVIEW Application with a FINALIZED AidPackage. (Yes: aid was drafted while UNDER_REVIEW after a hypothetical pre-admit — but actually the SM requires app ADMITTED to finalize aid. So we set up admit, finalize, then move to UNDER_REVIEW. Since UNDER_REVIEW is upstream of ADMITTED, we need a fresh app: better — admit, finalize aid, then later deny. But deny requires UNDER_REVIEW. We must structure: ADMIT→FINALIZE aid, then deny is not reachable from ADMITTED. Revise: aid finalize requires Application.status == ADMITTED. So set up: admit, finalize aid, then we cannot transition back to UNDER_REVIEW. Therefore the only way to exercise deny+aid-revoke is on a different application — but spec disallows aid creation pre-ADMIT. To make this scenario testable we use a different applicant entirely: app moves to UNDER_REVIEW, AdmissionsOfficer denies it; for this instance the AidPackage doesn't exist. We pivot the cascade to: deny → no AidPackage cascade. INSTEAD: set up the chain via decline of an ADMITTED app with a FINALIZED aid package (decline from ADMITTED→DECLINED cascades aid REVOKE). That is also a 2-hop chain from a different trigger (decline vs enroll). Use decline here.)"
            - "Applicant has TWO Applications: app_decline_x at school S_x is ADMITTED with FINALIZED AidPackage; app_other at S_y is also ADMITTED but with no aid yet."
            - "Track of app_decline_x is REGULAR (not EARLY_DECISION) so decline is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U DX", state_code: "WA", admission_track: "REGULAR", deadline_iso: "2026-10-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_dx_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "dx@u.edu", full_name: "DX A", gpa_unweighted: 3.80, sat_total: 1400, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_dx_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_dx_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_dx_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_dx_id}", school_id: "${s_dx_id}" }
              as: Applicant
              as_user_id: "${a_dx_id}"
              captures: { app_dx_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_dx_id}", prompt_code: "P1", word_count: 500, text: "essay text.", completed: true }
              as: Applicant
              as_user_id: "${a_dx_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_dx_id}", prompt_code: "P2", word_count: 500, text: "essay text.", completed: true }
              as: Applicant
              as_user_id: "${a_dx_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_dx_id}", school_id: "${s_dx_id}", recommender_email: "rdx1@x.edu" }
              as: Applicant
              as_user_id: "${a_dx_id}"
              captures: { rec_dx1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_dx_id}", school_id: "${s_dx_id}", recommender_email: "rdx2@x.edu" }
              as: Applicant
              as_user_id: "${a_dx_id}"
              captures: { rec_dx2: $.data.id }
            - call: "POST /recommendation-requests/${rec_dx1}/submit"
              payload: { rating: 5 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_dx2}/submit"
              payload: { rating: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_dx_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_dx_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_dx_id}/begin-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { ver_dx: $.data.version }
            - call: "POST /applications/${app_dx_id}/admit"
              payload: { expected_application_version: "${ver_dx}" }
              as: AdmissionsOfficer
            - call: "POST /aid-packages"
              payload: { application_id: "${app_dx_id}", grant_cents: 500000, loan_cents: 400000, work_study_cents: 100000 }
              as: FinancialAidOfficer
              captures: { aid_dx_id: $.data.id }
            - call: "POST /aid-packages/${aid_dx_id}/finalize"
              payload: {}
              as: FinancialAidOfficer
          trigger:
            # Trigger is DECLINE (a distinct trigger from instance 1's ENROLL). Per
            # §1.2 ADMITTED→DECLINED cascades AidPackage FINALIZED→REVOKED.
            - call: "POST /applications/${app_dx_id}/decline"
              payload: {}
