    code: 200
    input: [cancel_reason, "note?"]
    output: Session
    side_effects: ["status → CANCELLED_SCHOOL or CANCELLED_ARTIST, makeup_eligible computed", "encumbrance released, Residency session ledger updated", "ARTIST_NO_SHOW fires CASCADE B (no_show_count, reliability, PROBATION, tier downgrade)", "increments Session.version by 1 and Residency.version by 1"]

  - method: POST
