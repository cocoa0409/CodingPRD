              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /artists"
              payload: { store_id: "${store_id}", name: "Ada", skills: [ "BROW", "MAKEOVER" ] }
              as: MerchandisingAdmin
              captures: { artist_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c14@x.com", name: "C Fourteen" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /service-bookings"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", artist_id: "${artist_id}", service_type: "MAKEOVER", start_at: "2026-06-05T10:00:00Z", linked_order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: "$.data.id"}
          trigger:
            - call: "POST /service-bookings/${bk_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: BeautyArtist
              as_user_id: "${artist_id}"
              captures: { err: "$.data.error_id"}
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
            - call: "POST /service-bookings/${bk_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: BeautyArtist
              as_user_id: "${artist_id}"
              captures: { st: "$.data.status", bonus: "$.data.bonus_points_awarded"}
          assert:
            - "${err} == ERR_PAYMENT_NOT_CAPTURED (HTTP 409) while the linked order was only AUTHORIZED"
            - "${st} == COMPLETED and ${bonus} == 200 after the capture"
            - "Customer.${cust_id}.points_balance == 200"
            - "GET /points-ledger?customer_id=${cust_id} contains exactly one SERVICE_BONUS entry with delta_points == 200"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: artist_sanitation_buffer_is_half_open_touching_end_is_allowed
        grounds:
          - resource_overlap[artist_buffer]
          - validations[priority=13]
          - state_machines.ServiceBooking.CONFIRMED_to_RESCHEDULE_PENDING
          - errors[ERR_ARTIST_TIME_CONFLICT]
        distinguishing_aspect: |
          Interval semantics 1 — GEOMETRIC intersection of half-open intervals with a trailing
          15-minute sanitation buffer, on the Artist resource. Booking A (BROW 10:00-10:30) occupies
          [10:00, 10:45). A second booking starting at 10:44 intersects and is rejected; one starting
          at exactly 10:45 touches the buffered end and is accepted.
        test_recipe:
          setup:
            - "Artist A at SEP-CA holds a CONFIRMED BROW booking at 2026-06-05T10:00:00Z (30 min => buffered end 10:45)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /artists"
              payload: { store_id: "${store_id}", name: "Ada", skills: [ "BROW", "MAKEOVER" ] }
              as: MerchandisingAdmin
              captures: { artist_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c15@x.com", name: "C Fifteen" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c16@x.com", name: "C Sixteen" }
              as: MerchandisingAdmin
              captures: { cust2_id: "$.data.id"}
            - call: "POST /service-bookings"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", artist_id: "${artist_id}", service_type: "BROW", start_at: "2026-06-05T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk1_id: "$.data.id"}
          trigger:
            - call: "POST /service-bookings"
              payload: { customer_id: "${cust2_id}", store_id: "${store_id}", artist_id: "${artist_id}", service_type: "BROW", start_at: "2026-06-05T10:44:00Z" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { err: "$.data.error_id"}
            - call: "POST /service-bookings"
              payload: { customer_id: "${cust2_id}", store_id: "${store_id}", artist_id: "${artist_id}", service_type: "BROW", start_at: "2026-06-05T10:45:00Z" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { ok_id: "$.data.id", ok_status: "$.data.status"}
          assert:
            - "${err} == ERR_ARTIST_TIME_CONFLICT (HTTP 409) for the 10:44 attempt"
            - "${ok_status} == CONFIRMED for the 10:45 attempt (touching the buffered end is not an overlap)"
            - "GET /service-bookings?artist_id=${artist_id} returns exactly 2 rows (${bk1_id} and ${ok_id})"

      - name: bopis_pickup_slot_is_an_aggregate_count_bucket_not_an_intersection
        grounds:
          - resource_overlap[bopis_slot_capacity]
          - validations[priority=14]
          - entities.Store.fields.bopis_slot_capacity
          - errors[ERR_PICKUP_SLOT_FULL]
        distinguishing_aspect: |
          Interval semantics 2 — a DIFFERENT geometry on a DIFFERENT resource (Store): there is no
          intersection test at all. Occupancy is an aggregate COUNT of RESERVED/READY orders keyed on
          an identical on-the-hour pickup_slot_start, and the slot is full at count >= capacity (2),
          so the third reserve into the 14:00 bucket is rejected while a reserve into the 15:00
          bucket succeeds.
        test_recipe:
          setup:
            - "Store SEP-CA has bopis_slot_capacity 2; variant stocked with 10 units."
            - "Two BOPIS orders are already RESERVED into the 2026-06-05T14:00:00Z slot."
            - "A third BOPIS order into the same slot and a fourth into the 15:00 slot are still DRAFT."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA", bopis_slot_capacity: 2 }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c17@x.com", name: "C Seventeen" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o1_id: "$.data.id"}
            - call: "POST /orders/${o1_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o2_id: "$.data.id"}
            - call: "POST /orders/${o2_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o3_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T15:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o4_id: "$.data.id"}
          trigger:
            - call: "POST /orders/${o3_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
            - call: "POST /orders/${o4_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { o4_status: "$.data.fulfillment_status"}
          assert:
            - "${err} == ERR_PICKUP_SLOT_FULL (HTTP 409) — the 14:00 bucket already holds 2 == capacity"
            - "Order.${o3_id}.fulfillment_status is still DRAFT"
            - "${o4_status} == RESERVED — the 15:00 bucket is a separate counter, unaffected by the neighbouring hour"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_received_conserved_across_tester_reserve_and_cancel
        grounds:
          - invariants[inventory_units_conserved]
          - state_machines.Order.RESERVED_to_CANCELLED
          - concurrency_rules[tester-conversion-stale-lot]
          - entities.InventoryLot.fields.units_received
        distinguishing_aspect: |
          Conserved quantity 1 — physical UNITS on an InventoryLot. After a tester conversion (2
          units), a reserve (3 units) and its compensating cancel, the identity
          units_received == on_hand + reserved + tester + sold + destroyed must still evaluate to
          10 == 8 + 0 + 2 + 0 + 0, with zero drift in any bucket.
        test_recipe:
          setup:
            - "Lot L at SEP-CA for a SEALED variant priced 2500, units_received 10."
            - "2 units are converted to testers (OCC-guarded), leaving on_hand 8."
            - "An order for 3 units is RESERVED (on_hand 5, reserved 3)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id", lot_v0: "$.data.version"}
            - call: "POST /inventory-lots/${lot_id}/tester-conversions"
              payload: { units: 2, expected_lot_version: "${lot_v0}" }
              as: StoreAssociate
            - call: "POST /customers"
              payload: { email: "c18@x.com", name: "C Eighteen" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 3 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { reason: "CUSTOMER_CHANGED_MIND" }
              as: StoreAssociate
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreAssociate
              captures: { oh: "$.data.on_hand_units", rv: "$.data.reserved_units", tu: "$.data.tester_units", sd: "$.data.sold_units", de: "$.data.destroyed_units", ur: "$.data.units_received"}
          assert:
            - "${ur} == 10"
            - "${oh} == 8 and ${rv} == 0 and ${tu} == 2 and ${sd} == 0 and ${de} == 0"
            - "${oh} + ${rv} + ${tu} + ${sd} + ${de} == ${ur} (inventory_units_conserved holds with zero drift)"

      - name: points_balance_conserved_across_redeem_and_cancel_reversal
        grounds:
          - invariants[points_ledger_conserved]
          - state_machines.Order.RESERVED_to_CANCELLED
          - entities.PointsLedgerEntry.fields.delta_points
          - entities.Customer.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity 2 — LOYALTY POINTS (a different kind of quantity from physical units,
          and one that only exists as a ledger). Seed +500, REDEEM -300 at reserve, REVERSAL +300 at
          cancel: points_balance must return to exactly 500 AND equal the ledger sum, with the
          REDEEM entry left in place (compensated, never deleted).
        test_recipe:
          setup:
            - "Customer C seeded with 500 points (SEED ledger entry)."
            - "SHIP_FROM_STORE order: 2 units at 2500 = subtotal 5000, INSIDER (0% discount), points_redeemed 300 -> points_value 1500 -> total_due 3500."
            - "The order is RESERVED, so the REDEEM entry has already been appended (balance 200)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c19@x.com", name: "C Nineteen", initial_points: 500 }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", points_redeemed: 300, lines: [ { variant_id: "${v_id}", quantity: 2 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { pv: "$.data.points_value_cents", td: "$.data.total_due_cents"}
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { reason: "CUSTOMER_CHANGED_MIND" }
              as: StoreAssociate
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: MerchandisingAdmin
              captures: { bal: "$.data.points_balance"}
          assert:
            - "${pv} == 1500 and ${td} == 3500"
            - "${bal} == 500"
            - "GET /points-ledger?customer_id=${cust_id} returns exactly 3 entries in created_at ASC order: SEED +500 (balance_after 500), REDEEM -300 (balance_after 200), REVERSAL +300 (balance_after 500)"
            - "SUM(delta_points) over those 3 entries == 500 == Customer.${cust_id}.points_balance (points_ledger_conserved holds)"
