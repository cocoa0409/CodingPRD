          assert:
            - "License.${lict1_id}.annual_fee_cents == 27600: TIER_1 base 42000 + 180 * 100 = 18000 gives subtotal 60000, the MIXED multiplier 10000 bp leaves it unchanged, and 4600 bp of it is 27600"
            - "License.${lict2_id}.annual_fee_cents == 47030: TIER_2 base 78000 + 240 * 101 = 24240 gives subtotal 102240, and 4600 bp of 102240 is 47030.40 rounded half up to 47030"
