# =============================================================================
# PRD-bench scaffold: Gated-Community & Access Control (Expert)
# =============================================================================

scenario: "Gated-Community & Access Control: resident & vehicle/decal, guest/vendor pass & pre-authorization, gate/barrier & LPR, patrol & incident, amenity access, violation & fine, directory & callbox, reporting"

domain_name: gated-community-access-control
api_prefix: /access

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # flat: peer entities linked by foreign keys, all collections mounted directly
  # under the /access base path; no entity nesting in URL paths.

  state_machine_shape: parallel
  # Pass carries two independent axes (auth_status x presence_status); Violation
  # is cyclic (ISSUED<->APPEALED); Resident is cyclic (ACTIVE<->SUSPENDED).

  relationship_patterns:
    - one_to_many        # Community -> Resident/Amenity/Officer(id)/GateEvent
    - flat_foreign_key   # Vehicle.resident_id, Pass.sponsor_resident_id, etc.
    - polymorphic        # GateEvent.matched_id references a Decal OR a Pass

  role_model: peer_roles           # + segregation_of_duties on violation resolution
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Community / HOA name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone label", default: "UTC" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Contact email (directory)" }
      - { name: phone, type: string, source: input, description: "Contact phone (directory / callbox)", default: null }
      - { name: resident_type, type: enum, source: input, description: "OWNER | TENANT" }
      - { name: unit_label, type: string, source: input, description: "Street/unit label", default: null }
      - { name: lot_number, type: string, source: input, description: "Lot number", default: null }
      - { name: directory_listed, type: boolean, source: input, description: "Whether resident appears in the community directory / callbox", default: true }
      - { name: callbox_code, type: string, source: system, description: "System-minted numeric callbox dial code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | MOVED_OUT (initial ACTIVE)" }
      - { name: standing, type: enum, source: computed, description: "GOOD | DELINQUENT — DELINQUENT when outstanding_balance_cents >= DELINQUENCY_THRESHOLD_CENTS" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of assessed_fine_cents over the resident's Violations in {ISSUED,APPEALED,UPHELD,REDUCED} minus sum of paid_amount_cents over PAID Violations" }

  - name: Vehicle
    parent: null
    common_fields: true   # version is the OCC anchor for decal issuance
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: plate, type: string, source: input, description: "License plate string (LPR match key)" }
      - { name: plate_state, type: string, source: input, description: "Plate issuing state/province code" }
      - { name: make, type: string, source: input, description: "Vehicle make", default: null }
      - { name: model, type: string, source: input, description: "Vehicle model", default: null }
      - { name: color, type: string, source: input, description: "Vehicle color", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE (initial ACTIVE)" }

  - name: Decal
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: tier, type: enum, source: input, description: "RESIDENT | TENANT | TEMPORARY" }
      - { name: decal_number, type: string, source: system, description: "System-minted decal serial" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of decal validity window (ISO 8601 UTC)" }
      - { name: valid_until, type: datetime, source: input, description: "Exclusive end of decal validity window (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED (initial ACTIVE)" }

  - name: Pass
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_resident_id, type: string, source: input, description: "FK -> Resident.id (the sponsoring resident)" }
      - { name: pass_type, type: enum, source: input, description: "GUEST | VENDOR" }
      - { name: visitor_name, type: string, source: input, description: "Visitor / vendor contact name" }
      - { name: visitor_plate, type: string, source: input, description: "Visitor vehicle plate (LPR match key)" }
      - { name: plate_state, type: string, source: input, description: "Visitor plate state/province code", default: null }
      - { name: vendor_company, type: string, source: input, description: "Vendor company name (VENDOR passes)", default: null }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of pass validity window (ISO 8601 UTC)" }
      - { name: valid_until, type: datetime, source: input, description: "Exclusive end of pass validity window (ISO 8601 UTC)" }
      - { name: auth_status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | REVOKED | EXPIRED (initial PENDING) — authorization axis" }
      - { name: presence_status, type: enum, source: system, description: "OFFSITE | ONSITE | DEPARTED (initial OFFSITE) — presence axis, driven by gate events" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Provisional fee computed at authorization from the planned window (see pass_fee.estimated variant)", default: null }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final fee computed at gate exit from actual dwell + overstay (see pass_fee.final variant)", default: null }
      - { name: entry_at, type: datetime, source: system, description: "Logical-clock instant of the matched ENTRY gate event", default: null }
      - { name: exit_at, type: datetime, source: system, description: "Logical-clock instant of the matched EXIT gate event", default: null }

  - name: GateEvent
    parent: null
    common_fields: false   # append-only log: id + created_at only
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: gate_id, type: string, source: input, description: "Physical gate / lane identifier" }
      - { name: direction, type: enum, source: input, description: "ENTRY | EXIT" }
      - { name: plate_read, type: string, source: input, description: "Plate string read by the LPR camera" }
      - { name: plate_state, type: string, source: input, description: "Plate state as read by LPR", default: null }
      - { name: matched_type, type: enum, source: computed, description: "DECAL | PASS | UNMATCHED — kind of credential matched to plate_read" }
      - { name: matched_id, type: string, source: computed, description: "Polymorphic id of the matched Decal or Pass per matched_type, or null when UNMATCHED", default: null }
      - { name: decision, type: enum, source: computed, description: "ALLOW | DENY — barrier decision" }
      - { name: reason, type: string, source: computed, description: "Human-readable decision reason code" }
      - { name: event_at, type: datetime, source: system, description: "Logical-clock instant the event was recorded" }

  - name: Amenity
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: name, type: string, source: input, description: "Amenity name" }
      - { name: amenity_type, type: enum, source: input, description: "POOL | GYM | CLUBHOUSE | TENNIS" }
      - { name: capacity, type: integer, source: input, description: "Maximum concurrent party_size across overlapping reservations", constraints: ">= 1" }
      - { name: hourly_fee_cents, type: integer, source: input, description: "Per-started-hour reservation fee in cents", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable deposit held at booking in cents", constraints: ">= 0" }
      - { name: open_hour, type: integer, source: input, description: "Opening hour 0-23 (UTC)", constraints: "0..23" }
      - { name: close_hour, type: integer, source: input, description: "Closing hour 1-24 (UTC), exclusive", constraints: "1..24" }
      - { name: reservable, type: boolean, source: input, description: "Whether the amenity accepts reservations", default: true }

  - name: AmenityReservation
    parent: null
    common_fields: true
    fields:
      - { name: amenity_id, type: string, source: input, description: "FK -> Amenity.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: start_at, type: datetime, source: input, description: "Inclusive reservation window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Exclusive reservation window end (ISO 8601 UTC)" }
      - { name: party_size, type: integer, source: input, description: "Number of occupants counted against amenity capacity", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW (initial BOOKED)" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Provisional fee quoted at booking from planned hours + deposit (amenity_settlement.quoted)" }
      - { name: settled_fee_cents, type: integer, source: computed, description: "Final fee at checkout from actual hours + overage, deposit released (amenity_settlement.settled)", default: null }
      - { name: checkin_at, type: datetime, source: system, description: "Logical-clock instant of check-in", default: null }
      - { name: checkout_at, type: datetime, source: system, description: "Logical-clock instant of check-out", default: null }

  - name: Patrol
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: officer_id, type: string, source: input, description: "Opaque security-officer identifier (not an entity); overlap key for shift scheduling" }
      - { name: route, type: string, source: input, description: "Patrol route label", default: null }
      - { name: start_at, type: datetime, source: input, description: "Inclusive shift start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Exclusive shift end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED (initial SCHEDULED)" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: patrol_id, type: string, source: input, description: "FK -> Patrol.id (patrol during which incident was logged)", default: null }
      - { name: incident_type, type: enum, source: input, description: "TRESPASS | NOISE | SPEEDING | VANDALISM | UNAUTHORIZED_ACCESS | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: location, type: string, source: input, description: "Free-text location", default: null }
      - { name: description, type: string, source: input, description: "Incident narrative" }
      - { name: related_resident_id, type: string, source: input, description: "Optional subject resident id (plain reference, may be null)", default: null }
      - { name: status, type: enum, source: system, description: "REPORTED | INVESTIGATING | RESOLVED | CLOSED (initial REPORTED)" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id (the cited resident)" }
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id (originating incident, optional)", default: null }
      - { name: violation_type, type: enum, source: input, description: "SPEEDING | NOISE | PARKING | UNAUTHORIZED_GUEST | GATE_TAILGATING" }
      - { name: base_fine_cents, type: integer, source: input, description: "Base fine before tier multiplier / surcharge / cap", constraints: ">= 0" }
      - { name: assessed_fine_cents, type: integer, source: computed, description: "Final assessed fine after tier multiplier, delinquency surcharge, and cap (violation_fine)" }
      - { name: repeat_index, type: integer, source: computed, description: "Count of the resident's prior same-type Violations in {ISSUED,UPHELD,REDUCED,PAID} within REPEAT_WINDOW_DAYS, at issuance" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount recorded on payment", default: null }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing SecurityOfficer/CommunityAdmin (SoD anchor)" }
      - { name: status, type: enum, source: system, description: "ISSUED | APPEALED | UPHELD | DISMISSED | REDUCED | PAID | VOID (initial ISSUED)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Resident
    initial_state: ACTIVE
    terminal_states: [MOVED_OUT]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: on Violation issuance/upheld when standing flips to DELINQUENT; OR POST /access/residents/{residentId}/transition {to_status:SUSPENDED} by CommunityAdmin"
        actor: system
        preconditions: []
        side_effects:
          - "All of the resident's AmenityReservations in {BOOKED,CHECKED_IN} -> CANCELLED, releasing their party_size from the amenity concurrent load (cascade hop)"
          - "All of the resident's Passes with auth_status=APPROVED and presence_status=OFFSITE -> auth_status REVOKED"
        note: "Auto-suspend is the second hop of the delinquency cascade (see calculations.resident_standing)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /access/residents/{residentId}/transition {to_status:ACTIVE}"
        actor: CommunityAdmin
        preconditions:
          - "outstanding_balance_cents < DELINQUENCY_THRESHOLD_CENTS (ERR_RESIDENT_NOT_ELIGIBLE otherwise)"
        side_effects: []
      - from: ACTIVE
        to: MOVED_OUT
        trigger: "POST /access/residents/{residentId}/transition {to_status:MOVED_OUT}"
        actor: CommunityAdmin
        preconditions: []
        side_effects:
          - "Every Vehicle of the resident with status=ACTIVE -> INACTIVE (cascade hop 1)"
          - "Each such Vehicle transitioning to INACTIVE revokes its own ACTIVE Decal -> REVOKED (cascade hop 2)"
      - from: SUSPENDED
        to: MOVED_OUT
        trigger: "POST /access/residents/{residentId}/transition {to_status:MOVED_OUT}"
        actor: CommunityAdmin
        preconditions: []
        side_effects:
          - "Same vehicle->decal cascade as ACTIVE->MOVED_OUT"

  - entity: Vehicle
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /access/vehicles/{vehicleId}/transition {to_status:INACTIVE}; OR system cascade from Resident MOVED_OUT"
        actor: CommunityAdmin
        preconditions: []
        side_effects:
          - "The vehicle's ACTIVE Decal (if any) -> REVOKED"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /access/vehicles/{vehicleId}/transition {to_status:ACTIVE}"
        actor: CommunityAdmin
        preconditions: []
        side_effects: []

  - entity: Decal
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /access/decals/{decalId}/transition {to_status:REVOKED}; OR system supersede on new decal issuance; OR system cascade from Vehicle INACTIVE"
        actor: CommunityAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: evaluated at gate-event match time when event_at >= valid_until"
        actor: system
        preconditions: []
        side_effects:
          - "An EXPIRED decal no longer matches at the gate (matched_type stays UNMATCHED / DENY)"

  - entity: Pass
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED, EXPIRED]
    note: "Parallel axes: auth_status (below) evolves independently of presence_status (OFFSITE->ONSITE->DEPARTED, driven by gate events). initial_state names the auth axis; presence axis begins OFFSITE."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /access/passes/{passId}/authorize {decision:APPROVED}"
        actor: SecurityOfficer
        preconditions:
          - "Sponsor Resident.status=ACTIVE AND standing=GOOD (ERR_SPONSOR_NOT_ELIGIBLE) [cross-entity Pass->Resident]"
          - "valid_from < valid_until AND valid_until > current clock (ERR_PASS_WINDOW_INVALID)"
        side_effects:
          - "Compute estimated_fee_cents via pass_fee.estimated"
      - from: PENDING
        to: DENIED
        trigger: "POST /access/passes/{passId}/authorize {decision:DENIED}"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /access/passes/{passId}/revoke; OR system cascade from sponsor Resident SUSPENDED"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system: evaluated at gate-event match time when event_at >= valid_until"
        actor: system
        preconditions: []
        side_effects: []
      # presence axis (independent of auth axis)
      - from: OFFSITE
        to: ONSITE
        trigger: "system: matched ENTRY GateEvent while auth_status=APPROVED and valid_from <= event_at < valid_until"
        actor: system
        preconditions:
          - "presence_status=OFFSITE"
          - "auth_status=APPROVED"
          - "valid_from <= event_at < valid_until (else GateEvent decision=DENY, presence unchanged)"
        side_effects:
          - "Set entry_at = event_at"
      - from: ONSITE
        to: DEPARTED
        trigger: "system: matched EXIT GateEvent"
        actor: system
        preconditions:
          - "presence_status=ONSITE"
        side_effects:
          - "Set exit_at = event_at"
          - "Compute final_fee_cents via pass_fee.final"

  - entity: AmenityReservation
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /access/amenity-reservations/{reservationId}/transition {to_status:CHECKED_IN}"
        actor: Resident
        preconditions:
          - "start_at <= current clock < end_at (ERR_RESERVATION_WINDOW_INVALID)"
          - "Concurrent committed party_size (BOOKED,CHECKED_IN overlapping now) <= capacity (ERR_AMENITY_AT_CAPACITY)"
        side_effects:
          - "Set checkin_at = current clock"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /access/amenity-reservations/{reservationId}/transition {to_status:COMPLETED}"
        actor: Resident
        preconditions: []
        side_effects:
          - "Set checkout_at = current clock; compute settled_fee_cents via amenity_settlement.settled"
          - "Release party_size from amenity concurrent load"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /access/amenity-reservations/{reservationId}/transition {to_status:CANCELLED}; OR system cascade from sponsor Resident SUSPENDED"
        actor: Resident
        preconditions: []
        side_effects:
          - "Release party_size from amenity concurrent load (compensating action for the BOOK reservation)"
          - "Deposit released (not charged)"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /access/amenity-reservations/{reservationId}/transition {to_status:NO_SHOW}"
        actor: CommunityAdmin
        preconditions: []
        side_effects:
          - "Release party_size from amenity concurrent load"
          - "Deposit forfeited: settled_fee_cents = deposit_cents"

  - entity: Patrol
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /access/patrols/{patrolId}/transition {to_status:IN_PROGRESS}"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /access/patrols/{patrolId}/transition {to_status:COMPLETED}"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /access/patrols/{patrolId}/transition {to_status:CANCELLED}"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /access/incidents/{incidentId}/transition {to_status:INVESTIGATING}"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /access/incidents/{incidentId}/transition {to_status:RESOLVED}"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /access/incidents/{incidentId}/transition {to_status:CLOSED}"
        actor: CommunityAdmin
        preconditions: []
        side_effects: []

  - entity: Violation
    initial_state: ISSUED
    terminal_states: [DISMISSED, PAID, VOID]
    note: "Cyclic: ISSUED->APPEALED->ISSUED (appeal withdrawn) forms a revision loop before resolution."
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /access/violations/{violationId}/appeal"
        actor: Resident
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: ISSUED
        trigger: "POST /access/violations/{violationId}/withdraw-appeal"
        actor: Resident
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: UPHELD
        trigger: "POST /access/violations/{violationId}/resolve {resolution:UPHELD}"
        actor: CommunityAdmin
        preconditions:
          - "Acting X-User-ID != Violation.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "assessed_fine_cents unchanged; resident.outstanding_balance_cents unchanged (still counted)"
          - "Recompute sponsor resident standing (may re-trigger auto-suspend)"
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /access/violations/{violationId}/resolve {resolution:DISMISSED}"
        actor: CommunityAdmin
        preconditions:
          - "Acting X-User-ID != Violation.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Violation leaves the balance set: resident.outstanding_balance_cents decreases by assessed_fine_cents (compensating action for issuance)"
          - "Recompute sponsor resident standing"
      - from: APPEALED
        to: REDUCED
        trigger: "POST /access/violations/{violationId}/resolve {resolution:REDUCED, reduced_fine_cents:N}"
        actor: CommunityAdmin
        preconditions:
          - "Acting X-User-ID != Violation.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "reduced_fine_cents present and 0 <= reduced_fine_cents <= assessed_fine_cents (ERR_INVALID_RESOLUTION)"
        side_effects:
          - "assessed_fine_cents set to reduced_fine_cents; resident.outstanding_balance_cents recomputed"
      - from: ISSUED
        to: PAID
        trigger: "POST /access/violations/{violationId}/pay {amount_cents:N}"
        actor: Resident
        preconditions:
          - "amount_cents == assessed_fine_cents (ERR_INVALID_RESOLUTION)"
        side_effects:
          - "paid_amount_cents set; resident.outstanding_balance_cents decreases by assessed_fine_cents"
      - from: UPHELD
        to: PAID
        trigger: "POST /access/violations/{violationId}/pay {amount_cents:N}"
        actor: Resident
        preconditions:
          - "amount_cents == assessed_fine_cents (ERR_INVALID_RESOLUTION)"
        side_effects:
          - "paid_amount_cents set; resident.outstanding_balance_cents decreases by assessed_fine_cents"
      - from: REDUCED
        to: PAID
        trigger: "POST /access/violations/{violationId}/pay {amount_cents:N}"
        actor: Resident
        preconditions:
          - "amount_cents == assessed_fine_cents (ERR_INVALID_RESOLUTION)"
        side_effects:
          - "paid_amount_cents set; resident.outstanding_balance_cents decreases by assessed_fine_cents"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: decal-issue-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /access/decals"
    occ_field: "expected_vehicle_version"
    description: |
      Issuing a Decal against a Vehicle whose version has advanced since the
      client last observed it is rejected. A new decal legitimately supersedes
      the vehicle's prior ACTIVE decal (product allows re-decaling), so a second
      issuance carrying a stale expected_vehicle_version reflects a view of the
      vehicle taken before an earlier issuance already superseded the decal and
      bumped the version; the stale write is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pass_fee
    trigger: "estimated at Pass PENDING->APPROVED; final at Pass ONSITE->DEPARTED"
    algorithm: dual_variant
    formula: |
      rate = VENDOR_HOURLY_CENTS if pass_type == VENDOR else GUEST_HOURLY_CENTS
      # estimated (at authorization): planned window
      planned_hours = (valid_until - valid_from) / 3600
      estimated_fee_cents = ceil(planned_hours) * rate
      # final (at gate exit): actual dwell + overstay
      billable_hours = ceil( (min(exit_at, valid_until) - entry_at) / 3600 )   # >= 0
      overstay_hours = ceil( max(0, exit_at - valid_until) / 3600 )
      final_fee_cents = billable_hours * rate + overstay_hours * OVERSTAY_SURCHARGE_CENTS_PER_HOUR
    input_set: "estimated: this Pass at authorization. final: this Pass at exit, entry_at/exit_at set by gate events."
    constants:
      GUEST_HOURLY_CENTS: 0
      VENDOR_HOURLY_CENTS: 500
      OVERSTAY_SURCHARGE_CENTS_PER_HOUR: 2000
    precision: "integer cents; ceil() on hour fractions before multiply"
    variants:
      - name: estimated
        when: "at PENDING->APPROVED"
        difference: "uses the planned [valid_from, valid_until) window; no overstay term"
      - name: final
        when: "at ONSITE->DEPARTED"
        difference: "uses actual entry_at/exit_at and adds an overstay surcharge for time past valid_until"

  - name: amenity_settlement
    trigger: "quoted at AmenityReservation booking; settled at CHECKED_IN->COMPLETED"
    algorithm: dual_variant
    formula: |
      # quoted (at booking): planned window + deposit held
      planned_hours = (end_at - start_at) / 3600
      quoted_fee_cents = ceil(planned_hours) * amenity.hourly_fee_cents + amenity.deposit_cents
      # settled (at checkout): actual hours + overage, deposit released
      base_hours = ceil( (min(checkout_at, end_at) - checkin_at) / 3600 )
      overage_hours = ceil( max(0, checkout_at - end_at) / 3600 )
      settled_fee_cents = base_hours * amenity.hourly_fee_cents
                          + overage_hours * OVERAGE_MULTIPLIER * amenity.hourly_fee_cents
    input_set: "quoted: this reservation at booking. settled: this reservation at checkout."
    constants:
      OVERAGE_MULTIPLIER: 2
    precision: "integer cents; ceil() on hour fractions"
    variants:
      - name: quoted
        when: "at booking"
        difference: "planned hours plus a refundable deposit hold"
      - name: settled
        when: "at checkout"
        difference: "actual hours plus overage penalty; deposit released (NO_SHOW forfeits deposit instead)"

  - name: violation_fine
    trigger: "at Violation issuance (POST /access/violations); assessed_fine_cents recomputed on REDUCED"
    algorithm: tiered_pricing
    formula: |
      repeat_index = count(Violation v2 where v2.resident_id == resident_id
                           and v2.violation_type == violation_type
                           and v2.status in {ISSUED,UPHELD,REDUCED,PAID}
                           and (issued_at - v2.issued_at) <= REPEAT_WINDOW_DAYS days
                           and v2.id != this.id)
      tier_multiplier = {0:1.0, 1:1.5, 2:2.0}.get(repeat_index, 3.0)   # >=3 -> 3.0
      standing_surcharge = DELINQUENT_SURCHARGE_CENTS if resident.standing == DELINQUENT else 0
      assessed_fine_cents = min(FINE_CAP_CENTS,
                                round_half_up(base_fine_cents * tier_multiplier) + standing_surcharge)
    input_set: "the citing resident's prior same-type violations in the repeat window; resident standing at issuance"
    constants:
      REPEAT_WINDOW_DAYS: 180
      DELINQUENT_SURCHARGE_CENTS: 5000
      FINE_CAP_CENTS: 50000
    precision: "integer cents, round_half_up on base*multiplier before adding surcharge and applying cap"

  - name: resident_balance_and_late_fee
    trigger: "recomputed on any Violation status/assessed change or payment"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
        sum(assessed_fine_cents for v in resident.Violations if v.status in {ISSUED,APPEALED,UPHELD,REDUCED})
        - sum(paid_amount_cents for v in resident.Violations if v.status == PAID)
      # late fee is rounded PER LINE then summed (pinned order; sum-then-round is NOT used)
      accrued_late_fee_cents =
        sum( round_half_up(v.assessed_fine_cents * LATE_FEE_PCT)
             for v in resident.Violations if v.status in {ISSUED,UPHELD,REDUCED} )
      statement_total_cents = outstanding_balance_cents + accrued_late_fee_cents
    input_set: "the resident's Violations filtered by status as above"
    constants:
      LATE_FEE_PCT: 0.015
    precision: "integer cents; round_half_up applied per violation line BEFORE summation"

  - name: resident_standing
    trigger: "recomputed whenever outstanding_balance_cents changes"
    algorithm: threshold
    formula: |
      standing = DELINQUENT if outstanding_balance_cents >= DELINQUENCY_THRESHOLD_CENTS else GOOD
      # boundary is inclusive: balance == DELINQUENCY_THRESHOLD_CENTS -> DELINQUENT
      if standing transitions GOOD->DELINQUENT and status == ACTIVE:
          auto-transition resident ACTIVE->SUSPENDED (see state_machines.Resident)
    input_set: "resident.outstanding_balance_cents"
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 25000
    precision: "integer cents; >= comparison"

  - name: amenity_concurrent_load
    trigger: "reservation booking / check-in capacity gate; overlap enforcement"
    algorithm: interval_merge
    formula: |
      # For a candidate window [start_at, end_at) (half-open), the load at any
      # instant is the sum of party_size over reservations in {BOOKED,CHECKED_IN}
      # on the same amenity whose [start_at, end_at) strictly overlaps the candidate.
      # Two intervals overlap iff a.start < b.end AND b.start < a.end (adjacency,
      # a.end == b.start, does NOT overlap). A booking is rejected when, at the
      # peak overlapping instant, existing_load + candidate.party_size > capacity.
      overlaps(a,b) = (a.start_at < b.end_at) and (b.start_at < a.end_at)
      reject if max_over_instants(existing_load) + party_size > capacity
    input_set: "reservations in {BOOKED,CHECKED_IN} on the amenity"
    constants: {}
    precision: "integer party counts; half-open interval geometry"

  - name: patrol_shift_overlap
    trigger: "patrol scheduling (POST /access/patrols)"
    algorithm: threshold
    formula: |
      # Two shifts for the SAME officer_id must be separated by a buffer gap.
      # Intervals are treated as CLOSED [start_at, end_at]; a new shift is
      # rejected unless the gap to every other non-CANCELLED shift of that
      # officer is >= PATROL_BUFFER_MINUTES on BOTH sides. Gap is measured
      # between the nearer endpoints; a direct overlap has gap < 0.
      gap = minutes_between_nearest_endpoints(new_shift, existing_shift)
      reject with ERR_PATROL_OVERLAP if gap < PATROL_BUFFER_MINUTES
      # boundary is inclusive: gap == PATROL_BUFFER_MINUTES is allowed.
    input_set: "patrols with the same officer_id in status {SCHEDULED,IN_PROGRESS,COMPLETED}"
    constants:
      PATROL_BUFFER_MINUTES: 60
    precision: "integer minutes; >= comparison at the buffer boundary"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC; entity_backed Resident acting on another resident's resource is forbidden"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and referenced foreign keys exist (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Segregation of duties: on violation resolve, acting X-User-ID must differ from Violation.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /access/violations/{violationId}/resolve"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_vehicle_version must equal current Vehicle.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /access/decals"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity state gates: pass authorize requires sponsor Resident ACTIVE+GOOD; decal issuance requires Vehicle ACTIVE; reservation booking requires Resident ACTIVE+GOOD"
    error_id: "ERR_SPONSOR_NOT_ELIGIBLE / ERR_VEHICLE_INACTIVE / ERR_RESIDENT_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "authorize pass, create decal, create reservation"

  - priority: 8
    category: business_temporal
    check: "Window validity and temporal-overlap: pass/reservation window well-formed and not past; patrol shift respects officer buffer; reservation window bounds"
    error_id: "ERR_PASS_WINDOW_INVALID / ERR_RESERVATION_WINDOW_INVALID / ERR_PATROL_OVERLAP"
    http_status: 422
    applies_to: "authorize pass, create/transition reservation, create patrol"

  - priority: 9
    category: business_fiscal
    check: "Amenity aggregate capacity not exceeded by the new/checking-in party"
    error_id: ERR_AMENITY_AT_CAPACITY
    http_status: 409
    applies_to: "create reservation, reservation check-in"

  - priority: 10
    category: business_constraint
    check: "Domain guards: amenity not reservable; payment amount mismatch; invalid reduction"
    error_id: "ERR_AMENITY_NOT_RESERVABLE / ERR_INVALID_RESOLUTION"
    http_status: 422
    applies_to: "create reservation, resolve/pay violation"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/access/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CommunityAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Advances/sets the logical clock used by all window/expiry/fee rules"]

  # --- Community ---
  - method: POST
    path: "/access/communities"
    description: "Create a community"
    roles: [CommunityAdmin]
    code: 201
    input: [name, "timezone?"]
    output: Community
    side_effects: []
  - method: GET
    path: "/access/communities/{communityId}"
    description: "Get a community"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Community
    side_effects: []

  # --- Resident (directory / callbox folded in) ---
  - method: POST
    path: "/access/residents"
    description: "Register a resident (directory + callbox_code minted)"
    roles: [CommunityAdmin]
    code: 201
    input: [community_id, full_name, email, resident_type, "phone?", "unit_label?", "lot_number?", "directory_listed?"]
    output: Resident
    side_effects: ["status=ACTIVE, standing=GOOD, outstanding_balance_cents=0, callbox_code minted"]
  - method: GET
    path: "/access/residents/{residentId}"
    description: "Get a resident"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: GET
    path: "/access/residents"
    description: "List/filter residents (directory)"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: ["community_id?", "standing?", "status?", "directory_listed?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []
  - method: POST
    path: "/access/residents/{residentId}/transition"
    description: "Transition resident status (SUSPENDED/ACTIVE/MOVED_OUT)"
    roles: [CommunityAdmin]
    code: 200
    input: [to_status]
    output: Resident
    side_effects: ["Cascades per Resident state machine"]
  - method: GET
    path: "/access/residents/{residentId}/statement"
    description: "Computed billing statement for a resident"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: []
    output: { outstanding_balance_cents: integer, accrued_late_fee_cents: integer, statement_total_cents: integer, standing: string }
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/access/vehicles"
    description: "Register a vehicle for a resident"
    roles: [Resident, CommunityAdmin]
    code: 201
    input: [resident_id, plate, plate_state, "make?", "model?", "color?"]
    output: Vehicle
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/access/vehicles/{vehicleId}"
    description: "Get a vehicle"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/access/vehicles"
    description: "List/filter vehicles"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []
  - method: POST
    path: "/access/vehicles/{vehicleId}/transition"
    description: "Transition vehicle status (INACTIVE/ACTIVE)"
    roles: [CommunityAdmin]
    code: 200
    input: [to_status]
    output: Vehicle
    side_effects: ["ACTIVE->INACTIVE revokes the vehicle's ACTIVE decal"]

  # --- Decal (OCC parent = Vehicle) ---
  - method: POST
    path: "/access/decals"
    description: "Issue a decal to a vehicle; supersedes the vehicle's prior ACTIVE decal"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 201
    input: [vehicle_id, tier, valid_from, valid_until, expected_vehicle_version]
    output: Decal
    side_effects:
      - "Prior ACTIVE Decal of the vehicle -> REVOKED (supersede)"
      - "increments Vehicle.version by 1"
      - "status=ACTIVE, decal_number minted"
  - method: GET
    path: "/access/decals/{decalId}"
    description: "Get a decal"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Decal
    side_effects: []
  - method: GET
    path: "/access/decals"
    description: "List/filter decals"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: ["vehicle_id?", "status?", "limit?", "offset?"]
    output: Decal[]
    side_effects: []
  - method: POST
    path: "/access/decals/{decalId}/transition"
    description: "Transition decal status (REVOKED)"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: [to_status]
    output: Decal
    side_effects: []

  # --- Pass ---
  - method: POST
    path: "/access/passes"
    description: "Create a guest/vendor pass (PENDING, OFFSITE)"
    roles: [Resident, CommunityAdmin]
    code: 201
    input: [sponsor_resident_id, pass_type, visitor_name, visitor_plate, valid_from, valid_until, "plate_state?", "vendor_company?"]
    output: Pass
    side_effects: ["auth_status=PENDING, presence_status=OFFSITE"]
  - method: GET
    path: "/access/passes/{passId}"
    description: "Get a pass"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Pass
    side_effects: []
  - method: GET
    path: "/access/passes"
    description: "List/filter passes"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: ["sponsor_resident_id?", "auth_status?", "presence_status?", "limit?", "offset?"]
    output: Pass[]
    side_effects: []
  - method: POST
    path: "/access/passes/{passId}/authorize"
    description: "Approve or deny a pending pass"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 200
    input: [decision]
    output: Pass
    side_effects: ["APPROVED computes estimated_fee_cents; cross-entity + window gates apply"]
  - method: POST
    path: "/access/passes/{passId}/revoke"
    description: "Revoke an approved pass"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 200
    input: []
    output: Pass
    side_effects: ["auth_status=REVOKED"]

  # --- GateEvent (LPR) ---
  - method: POST
    path: "/access/gate-events"
    description: "Record an LPR gate read; server matches plate, decides ALLOW/DENY, and drives pass presence"
    roles: [SecurityOfficer]
    code: 201
    input: [community_id, gate_id, direction, plate_read, "plate_state?"]
    output: GateEvent
    side_effects:
      - "Match plate_read to an ACTIVE Decal (via Vehicle.plate) or an APPROVED Pass (visitor_plate); set matched_type/matched_id/decision/reason"
      - "ENTRY match with APPROVED pass in window -> Pass presence OFFSITE->ONSITE, entry_at=event_at"
      - "EXIT match with ONSITE pass -> presence ONSITE->DEPARTED, exit_at=event_at, compute final_fee_cents"
  - method: GET
    path: "/access/gate-events/{gateEventId}"
    description: "Get a gate event"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: []
    output: GateEvent
    side_effects: []
  - method: GET
    path: "/access/gate-events"
    description: "List/filter gate events"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: ["community_id?", "direction?", "decision?", "matched_type?", "limit?", "offset?"]
    output: GateEvent[]
    side_effects: []

  # --- Amenity ---
  - method: POST
    path: "/access/amenities"
    description: "Create an amenity"
    roles: [CommunityAdmin]
    code: 201
    input: [community_id, name, amenity_type, capacity, hourly_fee_cents, deposit_cents, open_hour, close_hour, "reservable?"]
    output: Amenity
    side_effects: []
  - method: GET
    path: "/access/amenities/{amenityId}"
    description: "Get an amenity"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Amenity
    side_effects: []
  - method: GET
    path: "/access/amenities"
    description: "List/filter amenities"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: ["community_id?", "amenity_type?", "limit?", "offset?"]
    output: Amenity[]
    side_effects: []

  # --- AmenityReservation ---
  - method: POST
    path: "/access/amenity-reservations"
    description: "Book an amenity reservation (quoted fee computed, slots reserved)"
    roles: [Resident, CommunityAdmin]
    code: 201
    input: [amenity_id, resident_id, start_at, end_at, party_size]
    output: AmenityReservation
    side_effects: ["status=BOOKED, quoted_fee_cents computed, party_size committed to amenity load"]
  - method: GET
    path: "/access/amenity-reservations/{reservationId}"
    description: "Get a reservation"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: AmenityReservation
    side_effects: []
  - method: GET
    path: "/access/amenity-reservations"
    description: "List/filter reservations"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: ["amenity_id?", "resident_id?", "status?", "limit?", "offset?"]
    output: AmenityReservation[]
    side_effects: []
  - method: POST
    path: "/access/amenity-reservations/{reservationId}/transition"
    description: "Transition a reservation (CHECKED_IN/COMPLETED/CANCELLED/NO_SHOW)"
    roles: [Resident, CommunityAdmin]
    code: 200
    input: [to_status]
    output: AmenityReservation
    side_effects: ["Per reservation state machine; settled_fee_cents on COMPLETED; slot release on terminal states"]

  # --- Patrol ---
  - method: POST
    path: "/access/patrols"
    description: "Schedule a patrol shift (officer overlap enforced with buffer)"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 201
    input: [community_id, officer_id, start_at, end_at, "route?"]
    output: Patrol
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/access/patrols/{patrolId}"
    description: "Get a patrol"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: []
    output: Patrol
    side_effects: []
  - method: GET
    path: "/access/patrols"
    description: "List/filter patrols"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: ["community_id?", "officer_id?", "status?", "limit?", "offset?"]
    output: Patrol[]
    side_effects: []
  - method: POST
    path: "/access/patrols/{patrolId}/transition"
    description: "Transition a patrol (IN_PROGRESS/COMPLETED/CANCELLED)"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 200
    input: [to_status]
    output: Patrol
    side_effects: []

  # --- Incident ---
  - method: POST
    path: "/access/incidents"
    description: "Log an incident"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 201
    input: [community_id, incident_type, severity, description, "patrol_id?", "location?", "related_resident_id?"]
    output: Incident
    side_effects: ["status=REPORTED"]
  - method: GET
    path: "/access/incidents/{incidentId}"
    description: "Get an incident"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/access/incidents"
    description: "List/filter incidents"
    roles: [CommunityAdmin, SecurityOfficer]
    code: 200
    input: ["community_id?", "patrol_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/access/incidents/{incidentId}/transition"
    description: "Transition an incident (INVESTIGATING/RESOLVED/CLOSED)"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 200
    input: [to_status]
    output: Incident
    side_effects: []

  # --- Violation & Fine ---
  - method: POST
    path: "/access/violations"
    description: "Issue a violation to a resident (assessed fine computed; posts to balance)"
    roles: [SecurityOfficer, CommunityAdmin]
    code: 201
    input: [community_id, resident_id, violation_type, base_fine_cents, "incident_id?"]
    output: Violation
    side_effects:
      - "Compute repeat_index and assessed_fine_cents (violation_fine); issued_by_user_id=X-User-ID; status=ISSUED"
      - "Recompute resident.outstanding_balance_cents and standing; may auto-suspend resident (delinquency cascade)"
  - method: GET
    path: "/access/violations/{violationId}"
    description: "Get a violation"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/access/violations"
    description: "List/filter violations"
    roles: [CommunityAdmin, SecurityOfficer, Resident]
    code: 200
    input: ["community_id?", "resident_id?", "incident_id?", "status?", "violation_type?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/access/violations/{violationId}/appeal"
    description: "Resident appeals a violation (ISSUED->APPEALED)"
    roles: [Resident]
    code: 200
    input: ["reason?"]
    output: Violation
    side_effects: []
  - method: POST
    path: "/access/violations/{violationId}/withdraw-appeal"
    description: "Resident withdraws an appeal (APPEALED->ISSUED)"
    roles: [Resident]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: POST
    path: "/access/violations/{violationId}/resolve"
    description: "CommunityAdmin resolves an appealed violation (UPHELD/DISMISSED/REDUCED); SoD enforced"
    roles: [CommunityAdmin]
    code: 200
    input: [resolution, "reduced_fine_cents?"]
    output: Violation
    side_effects: ["Balance/standing recomputed per resolution"]
  - method: POST
    path: "/access/violations/{violationId}/pay"
    description: "Pay a violation fine (->PAID)"
    roles: [Resident, CommunityAdmin]
    code: 200
    input: [amount_cents]
    output: Violation
    side_effects: ["paid_amount_cents set; balance decreases"]

  # --- Reporting ---
  - method: GET
    path: "/access/communities/{communityId}/reports/access-log"
    description: "Aggregate gate access report for a community"
    roles: [CommunityAdmin]
    code: 200
    input: ["from_iso?", "to_iso?"]
    output: { total_events: integer, allow_count: integer, deny_count: integer, unmatched_count: integer }
    side_effects: []
  - method: GET
    path: "/access/communities/{communityId}/reports/violations-summary"
    description: "Aggregate violation/fine report for a community"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: { open_count: integer, total_assessed_cents: integer, delinquent_resident_count: integer }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Resident acting on another resident's resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, or bad numeric range" }
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "Community id not found" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "Resident id not found" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id not found" }
  - { id: ERR_DECAL_NOT_FOUND, http: 404, condition: "Decal id not found" }
  - { id: ERR_PASS_NOT_FOUND, http: 404, condition: "Pass id not found" }
  - { id: ERR_AMENITY_NOT_FOUND, http: 404, condition: "Amenity id not found" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "AmenityReservation id not found" }
  - { id: ERR_PATROL_NOT_FOUND, http: 404, condition: "Patrol id not found" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id not found" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "Violation id not found" }
  - { id: ERR_GATE_EVENT_NOT_FOUND, http: 404, condition: "GateEvent id not found" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vehicle_version does not match current Vehicle.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_VEHICLE_INACTIVE, http: 409, condition: "Decal issuance requires an ACTIVE vehicle" }
  - { id: ERR_SPONSOR_NOT_ELIGIBLE, http: 409, condition: "Pass authorization requires sponsor Resident ACTIVE and GOOD standing" }
  - { id: ERR_RESIDENT_NOT_ELIGIBLE, http: 409, condition: "Reservation booking / reinstatement blocked by resident status/standing" }
  - { id: ERR_PASS_WINDOW_INVALID, http: 422, condition: "Pass window malformed or already past at authorization" }
  - { id: ERR_RESERVATION_WINDOW_INVALID, http: 422, condition: "Reservation window malformed, outside amenity hours, or check-in outside window" }
  - { id: ERR_PATROL_OVERLAP, http: 422, condition: "Officer already has a shift within PATROL_BUFFER_MINUTES of the requested window" }
  - { id: ERR_AMENITY_AT_CAPACITY, http: 409, condition: "Aggregate party_size over overlapping reservations would exceed amenity capacity" }
  - { id: ERR_AMENITY_NOT_RESERVABLE, http: 422, condition: "Amenity has reservable=false" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Violation resolver X-User-ID equals the issuing user id" }
  - { id: ERR_INVALID_RESOLUTION, http: 422, condition: "REDUCED without valid reduced_fine_cents, or payment amount != assessed_fine_cents" }
  - { id: ERR_GATE_ACCESS_DENIED, http: 409, condition: "Reserved for explicit gate-decision error surfaces (gate events themselves return 201 with decision=DENY)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommunityAdmin
    description: "Community/HOA operator: configures the community, amenities, residents, resolves violations, runs reports."
    identity: opaque
    exclusive_operations:
      - "POST /access/communities"
      - "POST /access/amenities"
      - "POST /access/residents"
      - "POST /access/residents/{id}/transition (suspend/reinstate/move-out)"
      - "POST /access/vehicles/{id}/transition"
      - "POST /access/violations/{id}/resolve (UPHELD/DISMISSED/REDUCED; SoD-gated)"
      - "POST /access/amenity-reservations/{id}/transition {to_status:NO_SHOW}"
      - "GET /access/communities/{id}/reports/access-log"
      - "GET /access/communities/{id}/reports/violations-summary"
      - "POST /access/_clock/set_current_utc"
    shared_operations:
      - "GET reads across communities/residents/vehicles/decals/passes/amenities/reservations/patrols/incidents/violations/gate-events"
      - "POST /access/vehicles, /access/decals, /access/passes, /access/passes/{id}/authorize, /access/passes/{id}/revoke"
      - "POST /access/amenity-reservations, /access/patrols, /access/incidents, /access/violations"
      - "POST /access/violations/{id}/pay"

  - name: SecurityOfficer
    description: "Gatehouse / patrol staff: records LPR gate events, manages passes at the gate, runs patrols, logs incidents, issues violations."
    identity: opaque
    exclusive_operations:
      - "POST /access/gate-events"
    shared_operations:
      - "POST /access/decals, /access/decals/{id}/transition"
      - "POST /access/passes/{id}/authorize, /access/passes/{id}/revoke"
      - "POST /access/patrols, /access/patrols/{id}/transition"
      - "POST /access/incidents, /access/incidents/{id}/transition"
      - "POST /access/violations"
      - "GET reads across most resources"

  - name: Resident
    description: "A community resident acting on their own vehicles, passes, reservations, and violations."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /access/violations/{id}/appeal"
      - "POST /access/violations/{id}/withdraw-appeal"
    shared_operations:
      - "POST /access/vehicles (own; resident_id == X-User-ID)"
      - "POST /access/passes (own; sponsor_resident_id == X-User-ID)"
      - "POST /access/amenity-reservations (own; resident_id == X-User-ID)"
      - "POST /access/amenity-reservations/{id}/transition (CHECKED_IN/COMPLETED/CANCELLED on own)"
      - "POST /access/violations/{id}/pay (own)"
      - "GET /access/residents/{id}, /access/residents/{id}/statement (own), and reads of own vehicles/passes/reservations/violations"
