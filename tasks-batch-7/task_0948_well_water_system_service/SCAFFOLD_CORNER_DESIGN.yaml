      - name: corner_consistency_stock_moves_at_posting_not_at_completion
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.parts_inventory_conservation", "entities.PartCatalogItem.fields.on_hand_qty", "entities.WorkOrder.fields.parts_charge_cents"]
        distinguishing_aspect: |
          Posting a consumption row decrements PartCatalogItem.on_hand_qty in the SAME
          request across an aggregate boundary: after quantity 3 the very next catalog
          read shows 7, and after quantity 2 it shows 5, all while the work order is
          still IN_PROGRESS. The billing side is deliberately NOT immediate in the same
          sense - WorkOrder.parts_charge_cents stays 0 until completion finalises the
          rows - so an implementation that defers the stock decrement to completion
          reads 10 twice, and one that eagerly sums parts_charge_cents reads 40000
          before the work order finishes.
        test_recipe:
          setup:
            - "One NONE-tier account, property, well, MASTER technician and one CONTROL part costing 5000 cents with on_hand_qty 10 and version 1."
