      - "status = DRAFT; risk indices 0.00; claim counters 0; adoption_rate 0.0000"

  - method: GET
    path: /battlecards/{battlecard_id}
    description: "Reads one battlecard with both risk indices and its adoption metrics."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: Battlecard
    success: 200
    side_effects: []

  - method: GET
    path: /battlecards
    description: "Filtered list; reverse lookup for Battlecard.competitor_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["competitor_id?", "status?", "limit?", "offset?"]
    output: "Battlecard[]"
    success: 200
