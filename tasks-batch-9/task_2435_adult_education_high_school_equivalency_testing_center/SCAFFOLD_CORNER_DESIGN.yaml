            - "One PLACED self-paying student registered on all four sessions, identity VERIFIED by that proctor, checked in and scored 150 on each."
            - "An ISSUED credential (composite 600), a QUEUED 2-copy transcript order, and a CERTIFIED CREDENTIAL_ATTAINMENT outcome whose 1.50 weight has been committed against an OPEN funding period at 10000 cents per weight."
