            - "the straddling packet returns 409 and ${overlap_err_id} == \"ERR_PACKET_WINDOW_OVERLAP\""
            - "SurveyPacket.${aug_id}.status == OPEN with provision_score null, unchanged by the refusal"
      - name: clock_rewind_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_23_ERR_CLOCK_REWIND_FORBIDDEN
        distinguishing_aspect: "The logical clock is monotonic and starts at exactly 2026-08-01T00:00:00Z: setting it forward to 2026-08-06T09:00:00Z succeeds, and any later attempt to move it back — even to the startup default — returns ERR_CLOCK_REWIND_FORBIDDEN while leaving the clock where it was."
        test_recipe:
          setup:
            - "the clock is at its startup default 2026-08-01T00:00:00Z and is then advanced to 2026-08-06T09:00:00Z"
          setup_api_calls:
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: ActivityDirector
          trigger:
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == \"ERR_CLOCK_REWIND_FORBIDDEN\""
            - "a subsequent POST /recreation/_clock/set_current_utc with current_utc 2026-08-06T09:00:00Z is accepted with 200, proving equality is allowed and the clock still reads 2026-08-06T09:00:00Z"
