              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "REGIONAL", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 1000000 }
              as: FuelAnalyst
              captures: { f3_id: $.data.id }
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-NL3", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 20.00 }
