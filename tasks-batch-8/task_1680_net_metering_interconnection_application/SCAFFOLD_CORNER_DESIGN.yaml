            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx2}", account_number: "SWP-3", service_class: COMMERCIAL, prior_annual_usage_wh: 100000000 }, as: ProgramAdministrator, captures: { acct3: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct3}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 8000, estimated_annual_production_wh: 30000000 }, as: Applicant, as_user_id: "${cust}", captures: { app3: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app3}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc3a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app3}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc3b: $.data.id } }
            - { call: "POST /documents/${doc3a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc3b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app3}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
