      - name: decline_offered_entry_releases_hold
        claim_type: conditional_cascade
        grounds: ["state_machines.WaitlistEntry.OFFERED_to_WITHDRAWN", "entities.LotAllocation.fields.offers_outstanding"]
        distinguishing_aspect: "Withdrawing an OFFERED entry (a decline) releases the held seat: offers_outstanding returns to 0 and the quota-1 allocation flips WAITLISTING -> OPEN; decline_count increments."
