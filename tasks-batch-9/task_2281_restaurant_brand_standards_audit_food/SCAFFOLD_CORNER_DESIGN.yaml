          captures: {p1: '$.data[0].id'}
        assert:
        - create returns HTTP 201 with ${f1_defaults} == 0, ${f1_term} == false, ${f1_v} == 1, and ${f1_created} == '2026-08-01T00:00:00Z' from the logical clock
        - ${g_name} == 'Northline Foods LLC', ${g_brand} == ${brand_id}, ${g_signed} == '2025-03-01T00:00:00Z', ${g_defaults} == 0 - the read echoes the stored row
