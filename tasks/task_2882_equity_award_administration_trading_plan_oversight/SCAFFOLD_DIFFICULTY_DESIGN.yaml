  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: performance_tranche_vest_blocked_until_cycle_certified
        grounds:
          - state_machines.VestingTranche.UNVESTED_to_VESTED
          - state_machines.PerformanceCycle.OPEN_to_CERTIFIED
          - validations[priority=63]
          - errors[ERR_PERFORMANCE_NOT_CERTIFIED]
          - calculations.performance_payout_multiplier
          - entities.VestingTranche.fields.performance_cycle_id
        distinguishing_aspect: |
          The dependent pair is VestingTranche -> PerformanceCycle: a PERFORMANCE tranche
          whose scheduled_vest_date has already passed still cannot vest while its cycle is
          OPEN (ERR_PERFORMANCE_NOT_CERTIFIED), and the identical call succeeds only after
          the cycle reaches CERTIFIED, which is also what first gives the tranche a non-zero
          share count (0 -> 8000 at payout_multiplier_bps 10000).
        test_recipe:
          setup:
