    code: 201
    input: [name, amount_cents, department_id, "waiverable?", "refundable?"]
    output: FeeCatalogItem
    side_effects: []
  - method: GET
    path: "/school-years/{id}/fee-catalog-items"
    description: "List fee catalog items"
