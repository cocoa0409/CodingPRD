scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: batch_cost_moving_average_vs_consumption_layer
        grounds:
          - calculations.batch_component_cost
          - entities.BlendBatch.fields.estimated_component_cost_cents
          - entities.BlendBatch.fields.component_cost_cents
          - state_machines.BlendBatch.PLANNED_to_CHARGING
          - state_machines.BlendBatch.CHARGING_to_BLENDED
        distinguishing_aspect: |
          Cost accounting on BlendBatch: the identical draw of 1437.576 kg of GRP2-150N across a
          400 kg lot at 210 c/kg and a 1500 kg lot at 250 c/kg yields 549918 cents under the
          moving-average variant and 546024 cents under the consumption-layer variant, a fixed
          3894-cent divergence written into two different fields of the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Two GRP2-150N base-oil lots exist: the older holds 400.0 kg at 210 cents/kg, the newer 1500.0 kg at 250 cents/kg."
            - "One OCP-VII lot (300.0 kg at 940 cents/kg) and one ADD-SN-PLUS lot (400.0 kg at 620 cents/kg) exist."
            - "ProductSpec LUBE-0W20-SP is ACTIVE at revision 1; BlendRecipe with 84/6/10 mass fractions is ACTIVE."
            - "BlendTank TK-01 is AVAILABLE with a 10.0 L HDEO_API_CK4 heel."
            - "BlendBatch B-0001 exists in production_status PLANNED, qc_status PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 400.0, unit_cost_cents_per_kg: 210, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 1500.0, unit_cost_cents_per_kg: 250, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b2: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "VI_IMPROVER", component_code: "OCP-VII", received_kg: 300.0, unit_cost_cents_per_kg: 940, kv100_cst: 850.000, density_kg_per_l: 0.900, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_v1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "ADDITIVE_PACKAGE", component_code: "ADD-SN-PLUS", received_kg: 400.0, unit_cost_cents_per_kg: 620, kv100_cst: 105.000, density_kg_per_l: 0.960, additive_family: "ZDDP_PCMO", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_a1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id }
            - call: "POST /blend-recipes/${recipe1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-tanks"
              payload: { tank_code: "TK-01", capacity_l: 5000.0, heel_volume_l: 10.0, heel_additive_family: "HDEO_API_CK4", heel_product_code: "HDEO-15W40" }
              as: PlatformAdmin
              captures: { tank1: $.data.id }
            - call: "POST /blend-batches"
              payload: { blend_recipe_id: "${recipe1}", batch_code: "B-0001", planned_volume_l: 2000.0 }
              as: BlendOperator
              captures: { batch1: $.data.id }
          trigger:
            - call: "POST /blend-batches/${batch1}/charge"
              payload: { blend_tank_id: "${tank1}", charge_volume_l: 1990.0, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: BlendOperator
              captures: { est_cost: $.data.estimated_component_cost_cents }
            - call: "POST /blend-batches/${batch1}/complete-blend"
              payload: {}
              as: BlendOperator
              captures: { final_cost: $.data.component_cost_cents }
          assert:
            - "BlendBatch.${batch1}.charge_mass_kg == 1711.400"
            - "BlendBatch.${batch1}.estimated_component_cost_cents == 549918"
            - "BlendBatch.${batch1}.component_cost_cents == 546024"
            - "BlendBatch.${batch1}.estimated_component_cost_cents - BlendBatch.${batch1}.component_cost_cents == 3894"
            - "BlendBatch.${batch1}.production_status == BLENDED and BlendBatch.${batch1}.qc_status == PENDING"
            - "GET /blend-batches/${batch1}/component-draws returns 4 rows, all with status CONSUMED"
            - "the two GRP2-150N draws are 400.000 kg at 210 cents/kg and 1037.576 kg at 250 cents/kg, in that created_at order"

      - name: takeback_credit_flat_rate_vs_assay_adjusted
        grounds:
          - calculations.takeback_credit
          - entities.TakebackCollection.fields.credit_variant
          - entities.TakebackCollection.fields.credit_cents
          - entities.Customer.fields.contract_tier
          - state_machines.TakebackCollection.ASSAYED_to_CREDITED
        distinguishing_aspect: |
          Customer-side used-oil credit, a different entity domain from batch cost accounting:
          two accounts hand over an identical 1200.0 L load assayed at 6.5 percent water and 3.0
          percent sediment, and the TIER_A account is paid 21600 cents under FLAT_RATE while the
          TIER_B account is paid 27150 cents under ASSAY_ADJUSTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Customer ALPHA is TIER_A with takeback_agreement_status ACTIVE; Customer BRAVO is TIER_B with takeback_agreement_status ACTIVE."
            - "Each account has one TakebackCollection in status ASSAYED with collected_volume_l 1200.0, water_pct 6.5, sediment_pct 3.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Alpha Fleet", customer_type: "FLEET", contract_tier: "TIER_A", credit_limit_cents: 5000000, takeback_agreement_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Bravo Distribution", customer_type: "DISTRIBUTOR", contract_tier: "TIER_B", credit_limit_cents: 5000000, takeback_agreement_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /takeback-collections"
              payload: { customer_id: "${cust_a}", scheduled_volume_l: 1200.0 }
              as: SalesRep
              captures: { tb_a: $.data.id }
            - call: "POST /takeback-collections"
              payload: { customer_id: "${cust_b}", scheduled_volume_l: 1200.0 }
              as: SalesRep
              captures: { tb_b: $.data.id }
            - call: "POST /takeback-collections/${tb_a}/collect"
              payload: { collected_volume_l: 1200.0 }
              as: SalesRep
            - call: "POST /takeback-collections/${tb_b}/collect"
              payload: { collected_volume_l: 1200.0 }
              as: SalesRep
            - call: "POST /takeback-collections/${tb_a}/assay"
              payload: { water_pct: 6.5, sediment_pct: 3.0 }
              as: QCTechnician
            - call: "POST /takeback-collections/${tb_b}/assay"
              payload: { water_pct: 6.5, sediment_pct: 3.0 }
              as: QCTechnician
          trigger:
            - call: "POST /takeback-collections/${tb_a}/credit"
              payload: {}
              as: SalesRep
            - call: "POST /takeback-collections/${tb_b}/credit"
              payload: {}
              as: SalesRep
          assert:
            - "TakebackCollection.${tb_a}.credit_variant == FLAT_RATE"
            - "TakebackCollection.${tb_a}.credit_cents == 21600"
            - "TakebackCollection.${tb_b}.credit_variant == ASSAY_ADJUSTED"
            - "TakebackCollection.${tb_b}.credit_cents == 27150"
            - "TakebackCollection.${tb_b}.credit_cents - TakebackCollection.${tb_a}.credit_cents == 5550"
            - "Customer.${cust_a}.takeback_credit_balance_cents == 21600"
            - "Customer.${cust_b}.takeback_credit_balance_cents == 27150"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: recipe_predicted_kv100_loglog_three_component_blend
        grounds:
          - calculations.recipe_predicted_kv100
          - entities.BlendRecipe.fields.predicted_kv100_cst
          - entities.RecipeComponent.fields.mass_fraction_pct
          - entities.RecipeComponent.fields.nominal_kv100_cst
        distinguishing_aspect: |
          Mode (a): three inputs interacting non-linearly. The double-logarithm weighting of
          5.200, 850.000 and 105.000 cSt at 84/6/10 percent yields 7.614 cSt, whereas the
          mass-weighted arithmetic mean of the same three numbers is 65.868 cSt - an order of
          magnitude apart, so a linear implementation cannot accidentally agree.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "ProductSpec LUBE-0W20-SP is ACTIVE at revision 1 with target_kv100_cst 7.600 and kv100_tolerance_pct 3.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id, pred: $.data.predicted_kv100_cst }
            - call: "POST /blend-recipes/${recipe1}/activate"
              payload: {}
              as: ProductManager
          assert:
            - "BlendRecipe.${recipe1}.predicted_kv100_cst == 7.614"
            - "BlendRecipe.${recipe1}.predicted_kv100_cst != 65.868"
            - "BlendRecipe.${recipe1}.additive_treat_pct == 10.00"
            - "BlendRecipe.${recipe1}.component_count == 3"
            - "BlendRecipe.${recipe1}.spec_revision_pinned == 1"
            - "BlendRecipe.${recipe1}.status == ACTIVE (7.614 lies inside the band 7.372..7.828)"
            - "GET /blend-recipes/${recipe1}/components returns 3 rows"

      - name: order_pricing_rounds_per_line_then_sums
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.line_total_cents
          - entities.OrderLine.fields.unit_price_cents
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding whose order changes the cents. Line 1 prices 740.00 L at the
          unrounded rate 488.145625 c/L to 361228 cents, while 37 units at the separately rounded
          unit_price 9763 would give 361231; the pinned order is round-per-line-then-sum, so the
          subtotal is exactly 844772 and never 844777.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Customer BRAVO is TIER_B with credit_limit_cents 5000000."
            - "ProductSpec LUBE-0W20-SP is ACTIVE; PAIL_20L private-label configuration (fill 20.0 L) and DRUM_205L house configuration (fill 205.0 L) are both ACTIVE with empty claim_codes."
            - "A PACKAGED order in DRAFT exists for BRAVO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Bravo Distribution", customer_type: "PRIVATE_LABEL", contract_tier: "TIER_B", credit_limit_cents: 5000000, takeback_agreement_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "PAIL_20L", label_brand: "Bravo Blue", fill_volume_l: 20.0, private_label: true, customer_id: "${cust1}", claim_codes: [] }
              as: ProductManager
              captures: { cfg_pail: $.data.id }
            - call: "POST /package-configurations/${cfg_pail}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "DRUM_205L", label_brand: "House Drum", fill_volume_l: 205.0, private_label: false, claim_codes: [] }
              as: ProductManager
              captures: { cfg_drum: $.data.id }
            - call: "POST /package-configurations/${cfg_drum}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /orders"
              payload: { customer_id: "${cust1}", delivery_mode: "PACKAGED", takeback_linked: false }
              as: SalesRep
              captures: { ord1: $.data.id }
          trigger:
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_pail}", quantity_units: 37 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_drum}", quantity_units: 6 }
              as: SalesRep
              captures: { line2: $.data.id }
          assert:
            - "OrderLine.${line1}.volume_l == 740.00"
            - "OrderLine.${line1}.line_total_cents == 361228"
            - "OrderLine.${line1}.unit_price_cents == 9763"
            - "OrderLine.${line1}.quantity_units * OrderLine.${line1}.unit_price_cents == 361231, which is NOT equal to OrderLine.${line1}.line_total_cents"
            - "OrderLine.${line2}.volume_l == 1230.00"
            - "OrderLine.${line2}.line_total_cents == 483544"
            - "OrderLine.${line2}.unit_price_cents == 80591"
            - "Order.${ord1}.subtotal_cents == 844772"
            - "Order.${ord1}.total_volume_l == 1970.00"

      - name: order_credit_cap_pinned_to_pre_credit_total
        grounds:
          - calculations.order_freight_and_credit
          - calculations.order_line_pricing
          - entities.Order.fields.freight_surcharge_cents
          - entities.Order.fields.pre_credit_total_cents
          - entities.Order.fields.takeback_credit_applied_cents
          - concurrency_rules[takeback-credit-apply-stale-customer]
        distinguishing_aspect: |
          Mode (c): a circular-looking chain pinned to one evaluation order. The freight tier is
          keyed on subtotal_cents 844772 giving 22500, and the 15 percent credit cap is floored
          against pre_credit_total_cents 867272 giving exactly 130090 - not 126715 (cap taken on
          the subtotal) and not any figure derived from the post-credit total_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Customer BRAVO is TIER_B, takeback_agreement_status ACTIVE, credit_limit_cents 5000000."
            - "BRAVO holds a takeback_credit_balance_cents of 1357500 from one CREDITED 60000.0 L collection assayed at 6.5 / 3.0."
            - "A PACKAGED, takeback_linked order for BRAVO is CONFIRMED with subtotal_cents 844772 and freight_surcharge_cents 22500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Bravo Distribution", customer_type: "PRIVATE_LABEL", contract_tier: "TIER_B", credit_limit_cents: 5000000, takeback_agreement_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "PAIL_20L", label_brand: "Bravo Blue", fill_volume_l: 20.0, private_label: true, customer_id: "${cust1}", claim_codes: [] }
              as: ProductManager
              captures: { cfg_pail: $.data.id }
            - call: "POST /package-configurations/${cfg_pail}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "DRUM_205L", label_brand: "House Drum", fill_volume_l: 205.0, private_label: false, claim_codes: [] }
              as: ProductManager
              captures: { cfg_drum: $.data.id }
            - call: "POST /package-configurations/${cfg_drum}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /takeback-collections"
              payload: { customer_id: "${cust1}", scheduled_volume_l: 60000.0 }
              as: SalesRep
              captures: { tb1: $.data.id }
            - call: "POST /takeback-collections/${tb1}/collect"
              payload: { collected_volume_l: 60000.0 }
              as: SalesRep
            - call: "POST /takeback-collections/${tb1}/assay"
              payload: { water_pct: 6.5, sediment_pct: 3.0 }
              as: QCTechnician
            - call: "POST /takeback-collections/${tb1}/credit"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust1}", delivery_mode: "PACKAGED", takeback_linked: true }
              as: SalesRep
              captures: { ord1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_pail}", quantity_units: 37 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_drum}", quantity_units: 6 }
              as: SalesRep
              captures: { line2: $.data.id }
            - call: "POST /orders/${ord1}/confirm"
              payload: {}
              as: SalesRep
            - call: "GET /customers/${cust1}"
              payload: {}
              as: SalesRep
              captures: { cust1_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord1}/apply-takeback-credit"
              payload: { expected_customer_version: "${cust1_v}" }
              as: SalesRep
          assert:
            - "Order.${ord1}.subtotal_cents == 844772"
            - "Order.${ord1}.freight_surcharge_cents == 22500"
            - "Order.${ord1}.pre_credit_total_cents == 867272"
            - "Order.${ord1}.takeback_credit_applied_cents == 130090"
            - "Order.${ord1}.takeback_credit_applied_cents != 126715"
            - "Order.${ord1}.total_cents == 737182"
            - "Customer.${cust1}.takeback_credit_balance_cents == 1227410"
            - "TakebackCollection.${tb1}.credit_cents == 1357500 and credit_variant == ASSAY_ADJUSTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: blend_batch_production_and_qc_dimensions_advance_independently
        grounds:
          - state_machines.BlendBatch.CHARGING_to_BLENDED
          - state_machines.BlendBatch.PENDING_to_SAMPLED
          - state_machines.BlendBatch.SAMPLED_to_PASSED
          - entities.BlendBatch.fields.production_status
          - entities.BlendBatch.fields.qc_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: BlendBatch reaches production_status BLENDED
          while qc_status is still PENDING, and the two QC results then drive qc_status
          PENDING -> SAMPLED -> PASSED without production_status moving off BLENDED even once.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Component lots, ACTIVE ProductSpec LUBE-0W20-SP and ACTIVE recipe exist as in batch_cost_moving_average_vs_consumption_layer."
            - "BlendTank TK-01 is AVAILABLE with a 10.0 L HDEO_API_CK4 heel."
            - "BlendBatch B-0001 is PLANNED / PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 400.0, unit_cost_cents_per_kg: 210, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 1500.0, unit_cost_cents_per_kg: 250, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b2: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "VI_IMPROVER", component_code: "OCP-VII", received_kg: 300.0, unit_cost_cents_per_kg: 940, kv100_cst: 850.000, density_kg_per_l: 0.900, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_v1: $.data.id }
            - call: "POST /component-lots"
