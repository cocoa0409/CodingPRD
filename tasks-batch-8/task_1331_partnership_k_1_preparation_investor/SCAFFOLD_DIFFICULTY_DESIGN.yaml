scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: book_capital_vs_tax_basis_divergence
        grounds:
          - calculations.capital_account_and_tax_basis
          - entities.Partner.fields.capital_account_balance_cents
          - entities.Partner.fields.tax_basis_cents
          - entities.Partner.fields.excess_distribution_gain_cents
        distinguishing_aspect: |
          Two accumulators over the SAME CapitalAccountEvent stream on the Partner
          domain diverge: ADJUSTMENT is book-only, and a DISTRIBUTION validated
          against book capital floors the tax basis at 0 and spills the excess
          into excess_distribution_gain_cents — so identical inputs yield
          capital_account_balance_cents=300000 but tax_basis_cents=0.
        test_recipe:
          setup:
            - "Fund with one LIMITED US partner (10000 bps, commitment 1000000) and a 2025 TaxYear"
            - "Partner has POSTED events: CONTRIBUTION 1000000 (2025-01-15), ADJUSTMENT +500000 (2025-02-01); capital=1500000, basis=1000000"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R1A", ein: "11-0000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P Solo", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 100000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 1000000, effective_date: "2025-01-15" }
              as: TaxPreparer
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: ADJUSTMENT, amount_cents: 500000, effective_date: "2025-02-01" }
              as: TaxPreparer
          trigger:
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: DISTRIBUTION, amount_cents: 1200000, effective_date: "2025-03-01" }
              as: TaxPreparer
            - call: "GET /funds/partners/${p}"
              payload: {}
              as: TaxPreparer
          assert:
            - "Partner.${p}.capital_account_balance_cents == 300000"
            - "Partner.${p}.tax_basis_cents == 0"
            - "Partner.${p}.excess_distribution_gain_cents == 200000"
            - "the two variants diverge: 300000 != 0 despite the identical event stream"

      - name: withholding_safe_harbor_vs_current_actual
        grounds:
          - calculations.foreign_withholding
          - entities.WithholdingRecord.fields.accrued_cents
        distinguishing_aspect: |
          Same foreign partner, same quarter grid, two declared methods on the
          WithholdingRecord domain: CURRENT_ACTUAL derives from the 2025 LOCKED
          FINAL run (Q1 accrued 904588) while SAFE_HARBOR derives from 110% of the
          partner's 2024 withholding total (flat 106838 per quarter) — different
          entity domain than the Partner capital/basis instance.
        test_recipe:
          setup:
            - "Fund with GP1 (GENERAL US_ENTITY 1000bps), LP1 (LIMITED US_INDIVIDUAL 6000bps), LP2 (LIMITED FOREIGN_INDIVIDUAL 3000bps), each admitted 2024-01-01"
            - "TaxYear 2024 (gross ordinary 4000000, gain 0, interest 0) BOOKS_CLOSED with LOCKED FINAL run; LP2's four 2024 CURRENT_ACTUAL records accrued at 97125 each (total 388500)"
            - "TaxYear 2025 (gross ordinary 10000000, gain 20000000, interest 5000000) BOOKS_CLOSED with LOCKED FINAL run; LP2 2025 allocation total 9779333"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R1B", ein: "11-0000002", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "GP1", partner_type: US_ENTITY, partner_class: GENERAL, residency_state: "DE", ownership_pct_bps: 1000, capital_commitment_cents: 10000000, admission_date: "2024-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 60000000, admission_date: "2024-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP2", partner_type: FOREIGN_INDIVIDUAL, partner_class: LIMITED, residency_state: "XX", ownership_pct_bps: 3000, capital_commitment_cents: 30000000, admission_date: "2024-01-01" }
              as: FundTaxAdmin
              captures: { p_lp2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2024, gross_ordinary_income_cents: 4000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty24: "$.data.id", ty24_v: "$.data.version" }
            - call: "POST /funds/tax-years/${ty24}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty24_v2: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty24}", run_kind: FINAL, expected_tax_year_version: "${ty24_v2}" }
              as: TaxPreparer
              captures: { run24: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run24}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/withholding-accruals"
              payload: { tax_year_id: "${ty24}", quarter: 1, method: CURRENT_ACTUAL }
              as: TaxPreparer
            - call: "POST /funds/withholding-accruals"
              payload: { tax_year_id: "${ty24}", quarter: 2, method: CURRENT_ACTUAL }
              as: TaxPreparer
            - call: "POST /funds/withholding-accruals"
              payload: { tax_year_id: "${ty24}", quarter: 3, method: CURRENT_ACTUAL }
              as: TaxPreparer
            - call: "POST /funds/withholding-accruals"
              payload: { tax_year_id: "${ty24}", quarter: 4, method: CURRENT_ACTUAL }
              as: TaxPreparer
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 10000000, capital_gain_cents: 20000000, interest_income_cents: 5000000 }
              as: FundTaxAdmin
              captures: { ty25: "$.data.id" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_lp2}", tax_year_id: "${ty25}", event_type: CONTRIBUTION, amount_cents: 30000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty25}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty25_v2: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty25}", run_kind: FINAL, expected_tax_year_version: "${ty25_v2}" }
              as: TaxPreparer
              captures: { run25: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run25}/lock"
              payload: {}
              as: TaxReviewer
          trigger:
            - call: "POST /funds/withholding-accruals"
              payload: { tax_year_id: "${ty25}", quarter: 1, method: CURRENT_ACTUAL }
              as: TaxPreparer
            - call: "POST /funds/withholding-accruals"
              payload: { tax_year_id: "${ty25}", quarter: 2, method: SAFE_HARBOR }
              as: TaxPreparer
          assert:
            - "Q1 2025 CURRENT_ACTUAL record: accrued_cents == 904588 (ECTI floor(9779333/4)=2444833 x 3700bps)"
            - "Q2 2025 SAFE_HARBOR record: accrued_cents == 106838 (round_half_up(388500 x 11000/10000 / 4))"
            - "904588 != 106838 — the two variants diverge for the same partner and tax year"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_tier_allocation_capital_gain
        grounds:
          - calculations.allocation_engine
          - calculations.ownership_proration
        distinguishing_aspect: |
          Mode (a) — nested min/max with tiered-rate selection over >=3 inputs
          (category total, beginning capital x hurdle, catchup cap keyed on the
          preferred pool actually paid, carry split of the residual): CAPITAL_GAIN
          20000000 splits into preferred 7200000, catchup 1440000, residual
          11360000 -> LP pool 9088000 / GP pool 2272000, landing GP1=3712000,
          LP1=10858667, LP2=5429333.
        test_recipe:
          setup:
            - "Fund (hurdle 800bps, catchup 2000bps, carry 2000bps) with GP1/LP1/LP2 (1000/6000/3000 bps) admitted 2025-01-01"
            - "Contributions on 2025-01-01: GP1 10000000, LP1 60000000, LP2 30000000 (beginning capital for the preferred tier)"
            - "TaxYear 2025 (net ordinary 9500000 after fee, gain 20000000, interest 5000000) in BOOKS_CLOSED"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R2A", ein: "11-0000003", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "GP1", partner_type: US_ENTITY, partner_class: GENERAL, residency_state: "DE", ownership_pct_bps: 1000, capital_commitment_cents: 10000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_gp: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 60000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP2", partner_type: FOREIGN_INDIVIDUAL, partner_class: LIMITED, residency_state: "XX", ownership_pct_bps: 3000, capital_commitment_cents: 30000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 10000000, capital_gain_cents: 20000000, interest_income_cents: 5000000 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_gp}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 10000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_lp1}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 60000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_lp2}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 30000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
          trigger:
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "GET /funds/allocation-runs/${run}/lines"
              payload: {}
              as: TaxPreparer
          assert:
            - "AllocationRun.${run}.ordinary_total_cents == 9500000 and capital_gain_total_cents == 20000000 and interest_total_cents == 5000000"
            - "AllocationLine(${run}, ${p_gp}, CAPITAL_GAIN).amount_cents == 3712000 (catchup 1440000 + GP residual 2272000)"
            - "AllocationLine(${run}, ${p_lp1}, CAPITAL_GAIN).amount_cents == 10858667 (preferred 4800000 + LP residual 6058667)"
            - "AllocationLine(${run}, ${p_lp2}, CAPITAL_GAIN).amount_cents == 5429333 (preferred 2400000 + LP residual 3029333)"
            - "AllocationLine(${run}, ${p_gp}, ORDINARY).amount_cents == 950000; (${p_lp1}) == 5700000; (${p_lp2}) == 2850000"
            - "sum of CAPITAL_GAIN lines == 20000000 exactly (zero-sum conservation)"

      - name: composite_tax_per_partner_rounding_order
        grounds:
          - calculations.composite_tax
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins per-partner
          round_half_up of state-source income AND of tax before summing; the
          forbidden sum-then-round order yields 21007 while the pinned order
          yields 21008 for identical inputs (two partners at 150050 state-source
          income, 700bps) — a one-cent observable difference.
        test_recipe:
          setup:
            - "Fund with management_fee_rate_bps 0 and two US partners A (US_INDIVIDUAL, CA) and B (US_ENTITY, DE), 5000 bps each"
            - "TaxYear 2025 (gross ordinary 1000000, gain 0, interest 0; net ordinary 1000000) BOOKS_CLOSED with LOCKED FINAL run: each partner allocated 500000"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R2B", ein: "11-0000004", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "A", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_a: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "B", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_b: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id", ty_v0: "$.data.version" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/composite-filings"
              payload: { tax_year_id: "${ty}", state_code: "NY", apportionment_pct_bps: 3001, composite_rate_bps: 700, min_income_cents: 1 }
              as: TaxPreparer
              captures: { cf: "$.data.id" }
          trigger:
            - call: "POST /funds/composite-filings/${cf}/file"
              payload: {}
              as: TaxPreparer
          assert:
            - "CompositeFiling.${cf}.status == FILED"
            - "CompositeFiling.${cf}.included_partner_ids == [${p_a}, ${p_b}] (Partner.created_at ASC order)"
            - "CompositeFiling.${cf}.total_state_source_income_cents == 300100 (2 x round_half_up(500000 x 3001/10000))"
            - "CompositeFiling.${cf}.total_composite_tax_cents == 21008 (2 x round_half_up(150050 x 700/10000) = 2 x 10504)"
            - "21008 != 21007 — sum-then-round would produce 21007 and is the forbidden order"

      - name: management_fee_evaluation_order_boundary
        grounds:
          - calculations.management_fee_net_income
          - entities.TaxYear.fields.net_ordinary_income_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation
          order: the fee reduces net ordinary income while the fee discount is
          keyed on GROSS ordinary income; gross == threshold means NO discount
          (strictly-less test), so two tax years differing by one cent of gross
          income produce fees 1000000 vs 500000.
        test_recipe:
          setup:
            - "Fund (fee 100bps, discount threshold 5000000000, discount 5000bps) with one ACTIVE GENERAL partner committed 100000000 (fee base)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R2C", ein: "11-0000005", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "GP", partner_type: US_ENTITY, partner_class: GENERAL, residency_state: "DE", ownership_pct_bps: 10000, capital_commitment_cents: 100000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2024, gross_ordinary_income_cents: 5000000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty1: "$.data.id" }
          trigger:
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 4999999999, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty2: "$.data.id" }
          assert:
            - "TaxYear.${ty1}.management_fee_cents == 1000000 (gross == threshold -> NO discount, strict <)"
            - "TaxYear.${ty1}.net_ordinary_income_cents == 4999000000"
            - "TaxYear.${ty2}.management_fee_cents == 500000 (gross one cent below threshold -> discount applies)"
            - "TaxYear.${ty2}.net_ordinary_income_cents == 4999499999"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: k1_package_parallel_prep_delivery_dimensions
        grounds:
          - state_machines.K1Package
        distinguishing_aspect: |
          Parallel state dimensions on the K1Package entity: after deliver,
          prep_status=DELIVERED and delivery_status=SENT; report-bounced and
          resend move ONLY the delivery axis (SENT->BOUNCED->SENT) while
          prep_status stays DELIVERED — the two axes evolve independently.
        test_recipe:
          setup:
            - "Fund with one LIMITED US partner; TaxYear 2025 APPROVED with LOCKED FINAL run; K1Package generated, REVIEWED, APPROVED, then DELIVERED (delivery SENT) at the default clock 2026-08-01T00:00:00Z (past the 2026-03-15 deadline, no extension)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R3A", ein: "11-0000006", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/tax-years/${ty}/submit-review"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty}/approve"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/k1-generation"
              payload: { tax_year_id: "${ty}" }
              as: TaxPreparer
              captures: { k1: "$.data[0].id" }
            - call: "POST /funds/k1-packages/${k1}/submit-review"
              payload: {}
              as: TaxPreparer
              as_user_id: prep_1
            - call: "POST /funds/k1-packages/${k1}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /funds/k1-packages/${k1}/deliver"
              payload: { delivery_method: PORTAL }
              as: InvestorServicesRep
          trigger:
            - call: "POST /funds/k1-packages/${k1}/report-bounced"
              payload: {}
              as: InvestorServicesRep
            - call: "GET /funds/k1-packages/${k1}"
              payload: {}
              as: InvestorServicesRep
            - call: "POST /funds/k1-packages/${k1}/resend"
              payload: {}
              as: InvestorServicesRep
          assert:
            - "after report-bounced: K1Package.${k1}.delivery_status == BOUNCED AND prep_status == DELIVERED (delivery axis moved, prep axis untouched)"
            - "after resend: K1Package.${k1}.delivery_status == SENT AND prep_status == DELIVERED"
            - "K1Package.${k1}.is_late == true (delivered_at 2026-08-01 > deadline 2026-03-15T23:59:59Z)"

      - name: k1_amendment_revision_loop_cycle
        grounds:
          - state_machines.K1Amendment
        distinguishing_aspect: |
          Cyclic machine on the K1Amendment entity (different entity than
          K1Package): OPENED -> IN_PREP -> IN_REVIEW -> IN_PREP -> IN_REVIEW ->
          ISSUED — the return-to-prep loop is traversed once before issue.
        test_recipe:
          setup:
            - "Fund with one US partner; TaxYear 2025 APPROVED; K1Package delivered (prep DELIVERED)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R3B", ein: "11-0000007", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
