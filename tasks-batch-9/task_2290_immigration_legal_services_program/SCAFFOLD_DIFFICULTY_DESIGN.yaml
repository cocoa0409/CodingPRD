  # =====================================================================
  # RULE 4 - transitive_cascade
  # Two DIFFERENT triggers, each a declared depth-4 chain: CASCADE-A
  # (recognition LAPSE) and CASCADE-B (accepted-intake withdrawal).
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: recognition_lapse_depth4_suspends_accreditation_assignment_matter_declaration
        grounds:
          - state_machines.OrganizationRecognition.ACTIVE_to_LAPSED
          - state_machines.Accreditation.APPROVED_to_SUSPENDED_BY_RECOGNITION
          - state_machines.CaseAssignment.ACTIVE_to_SUSPENDED
          - state_machines.CaseMatter.SUPERVISED_STAFFED_to_COVERAGE_GAP
          - state_machines.Declaration.IN_REVIEW_to_REVISION_REQUESTED
          - calculations.representative_authorization_status
          - calculations.supervisor_auto_selection
        distinguishing_aspect: |
          ONE request (recognition LAPSE) must walk four causally chained hops that touch
          four other entity types: Accreditation -> SUSPENDED_BY_RECOGNITION, the accredited
          representative's ACTIVE LEAD CaseAssignment -> SUSPENDED with release_reason_code
          RECOGNITION_LAPSE, its CaseMatter -> COVERAGE_GAP, and that matter's IN_REVIEW
          Declaration -> REVISION_REQUESTED with revision_round 1 plus coverage_gap_flag on
          only the CalendarEvent inside the 14-day lookahead; the STAFF_ATTORNEY's own
          SUPERVISOR assignment on the same matter must stay ACTIVE, so an implementation
          that cascades by matter rather than by re-derived authorization_status over-reaches,
          and one that stops at hop 2 leaves the matter STAFFED.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "OrganizationRecognition ACTIVE authorizing USCIS; one ACCREDITED_REP with an APPROVED PARTIAL accreditation for USCIS."
            - "Non-detained ADJUSTMENT_OF_STATUS matter (forum USCIS) with an ACTIVE SUPERVISOR assignment held by a STAFF_ATTORNEY and an ACTIVE LEAD assignment held by the accredited rep (supervision AUTO_SELECTED)."
            - "One Declaration prepared by the accredited LEAD sits IN_REVIEW with revision_round 0."
            - "Two SCHEDULED CalendarEvents: 2026-09-08 (7 days out, inside COVERAGE_GAP_LOOKAHEAD_DAYS) and 2026-11-20 (outside it)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "R-2290-002", effective_date: "2026-01-01", expiry_date: "2033-12-31", authorized_forums: ["USCIS", "ASYLUM_OFFICE"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-700001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-700002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Yusra Bekele", rep_type: "ACCREDITED_REP", languages: ["en", "am"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 35 }
              as: ProgramDirector
              captures: { arep_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${arep_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
              captures: { acc_id: "$.data.id" }
            - call: "POST /accreditations/${acc_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "POST /clients"
              payload: { full_name: "Ivo Petrov", preferred_language_code: "en", country_of_birth_code: "BG", date_of_birth: "1991-06-14", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { i_id: "$.data.id" }
