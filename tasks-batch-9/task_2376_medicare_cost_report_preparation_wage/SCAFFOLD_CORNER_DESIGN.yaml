              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
          trigger:
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_STEPDOWN_STRUCTURE_INCOMPLETE\""
            - "CostReport.${report_id}.unmapped_tb_total_cents == 0"
            - "CostReport.${report_id}.allocation_status == NOT_RUN"
            - "GET /cost-reports/${report_id}/stepdown-runs returns total_count == 0"

      - name: duplicate_occupational_mix_category_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_OCC_MIX_CATEGORY_DUPLICATE]
          - entities.OccMixResponse.fields.category
        distinguishing_aspect: "A second RN OccMixResponse on the same submission returns ERR_OCC_MIX_CATEGORY_DUPLICATE (422) and leaves occ_mix_category_count at 1 and reported_hours_total at 1200000.00."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30"
            - "a DRAFT WageIndexSubmission with total_paid_hours 2000000.00 holding one RN row of 1200000.00 hours"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 5000000000, total_paid_hours: 2000000.00 }
              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "RN", reported_hours: 1200000.00, reported_salaries_cents: 4200000000 }
              as: ReimbursementAnalyst
              captures: { omr_id: $.data.id }
          trigger:
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "RN", reported_hours: 100000.00, reported_salaries_cents: 350000000 }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_OCC_MIX_CATEGORY_DUPLICATE\""
            - "WageIndexSubmission.${wis_id}.occ_mix_category_count == 1"
            - "WageIndexSubmission.${wis_id}.reported_hours_total == 1200000.00"
            - "GET /wage-index-submissions/${wis_id}/occ-mix-responses returns total_count == 1"

      - name: a_second_live_wage_index_submission_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_CHILD_RECORD]
          - endpoints[POST /cost-reports/{id}/wage-index-submissions]
        distinguishing_aspect: "A second WageIndexSubmission on a report that already has a DRAFT one returns ERR_DUPLICATE_CHILD_RECORD (422); the at-most-one rule counts every status except REJECTED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30"
            - "one DRAFT WageIndexSubmission already exists on that report"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 5000000000, total_paid_hours: 2000000.00 }
              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 6000000000, total_paid_hours: 2400000.00 }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_DUPLICATE_CHILD_RECORD\""
            - "GET /cost-reports/${report_id}/wage-index-submissions returns total_count == 1"
            - "WageIndexSubmission.${wis_id}.total_salaries_cents == 5000000000"

      - name: fiscal_period_ending_before_it_begins_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_FISCAL_PERIOD_INVALID]
          - entities.CostReport.fields.fiscal_year_end
        distinguishing_aspect: "POST /cost-reports with fiscal_year_begin 2026-06-30 and fiscal_year_end 2025-07-01 returns ERR_FISCAL_PERIOD_INVALID (422), not ERR_INVALID_REQUEST (400) — both dates parse, it is the ordering that fails."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 exists with no cost reports"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2026-06-30", fiscal_year_end: "2025-07-01" }
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_FISCAL_PERIOD_INVALID\""
            - "GET /cost-reports with provider_id ${provider_id} returns total_count == 0"

      - name: provider_create_by_an_analyst_returns_forbidden_before_the_schema_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - rbac.roles.SystemAdmin
        distinguishing_aspect: "POST /providers sent by ReimbursementAnalyst with the required `ccn` omitted returns 403 ERR_FORBIDDEN_ROLE, not 400 ERR_INVALID_REQUEST — authorization (priority 2) is evaluated before schema (priority 3)."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /providers"
              payload: { name: "Mercy General Hospital", cbsa_code: "19100" }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "response_type == \"error\""
            - "${err_id} == \"ERR_FORBIDDEN_ROLE\""
            - "GET /providers returns total_count == 0"

      - name: foreign_cost_center_leg_is_reported_before_the_net_zero_failure
        claim_type: Priority Ordering
        grounds:
          - validations[priority=11]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / foreign_cost_center_leg_outranks_unbalanced_reclassification
          rationale: "That instance sends a single request violating both rules and asserts ERR_COST_CENTER_FOREIGN_TO_REPORT wins."

      - name: filing_deadline_is_reported_before_the_unmapped_ledger_failure
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / filing_deadline_outranks_unmapped_trial_balance_on_file
          rationale: "That instance files past the deadline with an unmapped ledger and asserts ERR_FILING_DEADLINE_PASSED wins."

      - name: resident_over_the_daily_fte_cap_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors[ERR_RESIDENT_DAILY_FTE_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / resident_daily_fte_capacity_over_half_open_rotation_intervals
          rationale: "That instance covers both the adjacency-is-not-overlap pass and the capped-day rejection on the same resident."

      - name: interim_rate_period_inside_the_thirty_day_buffer_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors[ERR_INTERIM_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / interim_rate_periods_need_a_thirty_day_gap_on_inclusive_bounds
          rationale: "The inclusive-boundary buffer is asserted there on both sides of the 30-day gap."

      - name: filing_without_an_accepted_wage_submission_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_WAGE_SUBMISSION_NOT_ACCEPTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cost_report_cannot_be_filed_until_wage_submission_is_accepted
          rationale: "That instance blocks the file at CHANGE_REQUESTED and then lets the identical call succeed once the submission is ACCEPTED."

      - name: unmapped_ledger_balance_of_zero_lets_the_report_file
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=13]
          - entities.CostReport.fields.unmapped_tb_total_cents
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / filing_deadline_outranks_unmapped_trial_balance_on_file
          rationale: "The passing leg of that instance maps the outstanding line and files inside the deadline, asserting the transition to FILED."

  # =================================================================
  # From Table 5 (Endpoints)
  # =================================================================
  # NOTE: the "Bulk action" row of the claim-extraction guide is
  # non-applicable — §1.5 declares no bulk/batch endpoint.
  - section: endpoints
    instances:
      - name: provider_crud_round_trip_covers_create_read_and_filtered_list
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /providers]
          - endpoints[GET /providers/{id}]
          - endpoints[GET /providers]
          - entities.Provider
        distinguishing_aspect: "The id returned by POST /providers reads back identically from GET /providers/{id}, and GET /providers?ccn=450123 returns exactly that one row out of the two registered providers."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450999", name: "Northside Community Hospital", cbsa_code: "26420", teaching_status: "NON_TEACHING" }
              as: SystemAdmin
              captures: { other_provider_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "GET /providers/${provider_id}"
              payload: {}
              as: ReimbursementAnalyst
            - call: "GET /providers"
              payload: { ccn: "450123" }
              as: SystemAdmin
          assert:
            - "POST /providers returned HTTP 201 with response_type == \"object\""
            - "GET /providers/${provider_id} returns ccn == \"450123\", name == \"Mercy General Hospital\", cbsa_code == \"19100\", teaching_status == \"TEACHING\", fte_cap == 2.00, current_interim_rate_cents == 900000"
            - "GET /providers/${provider_id} returns id == ${provider_id} and version == 1"
            - "GET /providers with ccn 450123 returns total_count == 1 and data[0].id == ${provider_id}"
            - "GET /providers with no filter returns total_count == 2"
            - "${other_provider_id} != ${provider_id}"

      - name: map_action_endpoint_moves_a_ledger_line_and_reprices_the_center
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /trial-balance-lines/{id}/map]
          - state_machines.TrialBalanceLine
          - calculations.trial_balance_mapping_rollup
        distinguishing_aspect: "POST /trial-balance-lines/{id}/map takes only cost_center_id, returns the updated TrialBalanceLine with status MAPPED, and moves 200000000 out of unmapped_tb_total_cents into CostCenter.direct_cost_cents in the same call."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30"
            - "cost centers 00100 (GENERAL_SERVICE, mapped line 100000000) and 03000 (ROUTINE, no lines)"
            - "one UNMAPPED ledger line of 200000000; unmapped_tb_total_cents == 200000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries awaiting mapping", amount_cents: 200000000 }
              as: ReimbursementAnalyst
              captures: { tb_unmapped: $.data.id }
          trigger:
            - call: "POST /trial-balance-lines/${tb_unmapped}/map"
              payload: { cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
          assert:
            - "HTTP status is 200"
            - "TrialBalanceLine.${tb_unmapped}.status == MAPPED"
            - "TrialBalanceLine.${tb_unmapped}.mapped_cost_center_id == ${cc_routine}"
            - "CostCenter.${cc_routine}.direct_cost_cents == 200000000"
            - "CostReport.${report_id}.total_direct_cost_cents == 300000000"
            - "CostReport.${report_id}.unmapped_tb_total_cents == 0"
            - "GET /cost-centers/${cc_routine}/trial-balance-lines returns total_count == 1"

      - name: gme_summary_is_a_computed_read_that_stores_nothing
        claim_type: Computed read
        grounds:
          - endpoints[GET /cost-reports/{id}/gme-summary]
          - calculations.gme_fte_rolling_average
          - entities.Resident.fields.assigned_fte_days
        distinguishing_aspect: "For a 365-day fiscal year with a single 0.6000-FTE rotation over the 184 half-open days of 2025-07-01..2026-01-01, GET /cost-reports/{id}/gme-summary returns period_days 365, unweighted_fte_days_total 110.4000, unweighted_fte_total 0.30, capped_unweighted_fte 0.30, weighted_fte_total 0.30, rolling_average_fte 0.30 and prior_period_count 0 without changing CostReport.status."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with fte_cap 2.00 and a DRAFT CostReport FY 2025-07-01..2026-06-30 (365 days)"
            - "cost center 03000 (ROUTINE) on that report"
            - "Resident in INTERNAL_MEDICINE with the default irp_status WITHIN_IRP"
            - "one ACTIVE RotationAssignment [2025-07-01, 2026-01-01) at fte_fraction 0.6000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Okafor", program: "INTERNAL_MEDICINE" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2025-07-01", end_date: "2026-01-01", fte_fraction: 0.6000 }
              as: ReimbursementAnalyst
              captures: { rotation_id: $.data.id }
          trigger:
            - call: "GET /cost-reports/${report_id}/gme-summary"
              payload: {}
              as: ReimbursementManager
          assert:
            - "HTTP status is 200"
            - "response cost_report_id == ${report_id}"
            - "response period_days == 365"
            - "response unweighted_fte_days_total == 110.4000"
            - "response unweighted_fte_total == 0.30"
            - "response capped_unweighted_fte == 0.30"
            - "response weighted_fte_total == 0.30"
            - "response rolling_average_fte == 0.30"
            - "response prior_period_count == 0"
            - "RotationAssignment.${rotation_id}.overlap_days == 184"
            - "RotationAssignment.${rotation_id}.fte_days == 110.4000"
            - "Resident.${resident_id}.assigned_fte_days == 110.4000"
            - "CostReport.${report_id}.status == DRAFT"

      - name: cost_center_ledger_link_lists_only_the_lines_mapped_to_it
        claim_type: Cross-reference link
        grounds:
          - endpoints[GET /cost-centers/{id}/trial-balance-lines]
          - entities.TrialBalanceLine.fields.mapped_cost_center_id
        distinguishing_aspect: "GET /cost-centers/{id}/trial-balance-lines is the reverse traversal of TrialBalanceLine.mapped_cost_center_id: it returns the 2 lines mapped to 00100 and neither the line mapped to 03000 nor the UNMAPPED line, even though all four belong to the same report."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30"
            - "cost centers 00100 (GENERAL_SERVICE) and 03000 (ROUTINE)"
            - "four ledger lines: 60000000 and 40000000 mapped to 00100, 200000000 mapped to 03000, 5000000 unmapped"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 60000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
              captures: { tb_ag_1: $.data.id }
