            - &k_dr_c3_pay
              call: "POST /vetpay/claims/${dr3_id}/checkout-pay"
              payload: { idempotency_key: "KD" }
              as: HospitalStaff
              as_user_id: "${h_id}"
            - &k_dr_clock
              call: "POST /vetpay/_clock/set_current_utc"
