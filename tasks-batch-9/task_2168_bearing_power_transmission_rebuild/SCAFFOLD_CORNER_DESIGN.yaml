            - "WarrantyClaim.${claim_id}.governing_basis == GOODWILL"
            - "WarrantyClaim.${claim_id}.hours_consumed_fraction == 0.650000"
            - "WarrantyClaim.${claim_id}.remaining_fraction == 1.000000"
            - "WarrantyClaim.${claim_id}.pro_rata_credit_cents == 171250"
            - "the REQUEST_INFO / RESUBMIT round trip moved the claim UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW and left info_note == 'oil analysis attached'"
            - "after adjudication WarrantyClaim.${claim_id}.status == APPROVED"
            - "after ISSUE_CREDIT WarrantyClaim.${claim_id}.status == CREDITED"
            - "GET /shop/credit-notes?warranty_claim_id=${claim_id} returns total_count == 1 with kind == WARRANTY_PRORATA, amount_cents == 171250 and status == POSTED"
            - "Customer.${cust_id}.warranty_credit_balance_cents == 171250"
