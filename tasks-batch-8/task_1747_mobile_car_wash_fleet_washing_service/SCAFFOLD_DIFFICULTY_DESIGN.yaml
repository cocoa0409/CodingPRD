            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-21T13:00:00Z", scheduled_window_end: "2026-08-21T14:00:00Z" }, as: PlatformAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${ob_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-F1", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van1_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van1_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
