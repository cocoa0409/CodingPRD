            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/cleaning-tasks", payload: { equipment_asset_id: "${a1}" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct: "$.data[0].id" } }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "IN_PROGRESS" }, as: HousekeepingStaff, as_user_id: "hk-1" }
          trigger:
