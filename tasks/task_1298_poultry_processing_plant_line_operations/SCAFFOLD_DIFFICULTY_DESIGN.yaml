  - rule_id: resource_temporal_overlap
    instances:
      - name: waiver_windows_half_open_adjacency
        grounds:
          - state_machines.LineSpeedWaiver.SUBMITTED_to_APPROVED
          - errors[ERR_WAIVER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource ProcessingLine waiver calendar with half-open [from,to) semantics:
          back-to-back windows (14:00 == 14:00) are ADJACENT, not overlapping, and
          approve; a window starting at 13:00 intersects and is rejected at approve
          with ERR_WAIVER_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "EV-1; waiver A [06:00,14:00) APPROVED; waiver B [14:00,22:00) created (adjacent to A); waiver C [13:00,15:00) created (overlaps A)"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id, l1_v: $.data.version } }
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 195, effective_from: "2026-08-01T06:00:00Z", effective_to: "2026-08-01T14:00:00Z", expected_line_version: "${l1_v}" }, as: PlantManager, captures: { wa: $.data.id } }
            - { call: "POST /poultry/waivers/${wa}/advance", payload: { to_status: "SUBMITTED" }, as: PlantManager }
            - { call: "POST /poultry/waivers/${wa}/advance", payload: { to_status: "APPROVED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "GET /poultry/lines/${l1}", as: PlantManager, captures: { l1_v2: $.data.version } }
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 190, effective_from: "2026-08-01T14:00:00Z", effective_to: "2026-08-01T22:00:00Z", expected_line_version: "${l1_v2}" }, as: PlantManager, captures: { wb: $.data.id } }
            - { call: "POST /poultry/waivers/${wb}/advance", payload: { to_status: "SUBMITTED" }, as: PlantManager }
            - { call: "POST /poultry/waivers/${wb}/advance", payload: { to_status: "APPROVED" }, as: USDAInspector, as_user_id: "usda-1", captures: { wb_status: $.data.status } }
            - { call: "GET /poultry/lines/${l1}", as: PlantManager, captures: { l1_v3: $.data.version } }
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 192, effective_from: "2026-08-01T13:00:00Z", effective_to: "2026-08-01T15:00:00Z", expected_line_version: "${l1_v3}" }, as: PlantManager, captures: { wc: $.data.id } }
            - { call: "POST /poultry/waivers/${wc}/advance", payload: { to_status: "SUBMITTED" }, as: PlantManager }
          trigger:
            - { call: "POST /poultry/waivers/${wc}/advance", payload: { to_status: "APPROVED" }, as: USDAInspector, as_user_id: "usda-1", captures: { err: $.data.error_id } }
          assert:
            - "adjacent window B approved fine (half-open: A.to == B.from is not overlap): ${wb_status} == APPROVED"
            - "${err} == ERR_WAIVER_WINDOW_OVERLAP (C [13:00,15:00) intersects A [06:00,14:00))"
            - "LineSpeedWaiver.${wc}.status == SUBMITTED unchanged"

      - name: flock_booking_shift_aggregate_capacity
        grounds:
          - validations[priority=8]
          - errors[ERR_SHIFT_CAPACITY_EXCEEDED]
          - entities.ProductionShift.fields.shackle_capacity_birds
        distinguishing_aspect: |
          Resource ProductionShift with aggregate-capacity interval semantics (sum
          of booked_head_count over the shift's lots vs capacity — NOT binary
          exclusion): 10000 + 10000 == 20000 is allowed at exact equality, and one
          more bird (20001 > 20000) is rejected with ERR_SHIFT_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Shift S2 capacity 20000; lot A booked 10000; lot B booked 10000 (cumulative exactly at capacity)"
          setup_api_calls:
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "NIGHT", shackle_capacity_birds: 20000, labor_hours_budget: 50.0 }, as: PlantManager, captures: { s2: $.data.id } }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-A", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s2}" }, as: ReceivingClerk, captures: { fa: $.data.id } }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-B", grower_name: "GrowerB", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s2}" }, as: ReceivingClerk, captures: { fb: $.data.id } }
          trigger:
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-C", grower_name: "GrowerC", booked_head_count: 1, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s2}" }, as: ReceivingClerk, captures: { err: $.data.error_id } }
          assert:
            - "lots A and B booked successfully: cumulative 20000 == capacity allowed (equality does not reject)"
            - "${err} == ERR_SHIFT_CAPACITY_EXCEEDED (20001 > 20000)"
            - "no third lot persisted: GET /poultry/shifts/${s2}/flock-lots returns exactly 2 lots"

