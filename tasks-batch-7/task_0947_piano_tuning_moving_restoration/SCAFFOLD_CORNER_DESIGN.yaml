            - "Milestone.${ms1_id}.status == READY and released_by_user_id == null"

      - name: client_cannot_read_another_clients_instrument
        claim_type: ownership_denied
        grounds:
          - validations[priority=4]
          - errors[ERR_ACTOR_SCOPE_VIOLATION]
          - roles.Client.identity
        distinguishing_aspect: "The Client role is entity_backed:Client, so X-User-ID must equal the resource's client_id; a Client reading a row owned by another client is refused at priority 4 with 403 ERR_ACTOR_SCOPE_VIOLATION, not 404."
        test_recipe:
          setup: ["Two clients; the second owns a location and an instrument."]
          setup_api_calls:
