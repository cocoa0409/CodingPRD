            - "${maturity_after} == BETA"
            - "${sweep_after} == 70.00 and ${baseline_after} == 2026-08-01T00:00:00.000Z (the reset lands on the same logical instant, and audited_at >= baseline is inclusive, so no evidence leaves the window)"
