# =============================================================================
# PRD Benchmark Scaffold — Task 2394
# Beverage Container Deposit Redemption Center
# (Oregon Beverage Recycling Cooperative)
#
# Difficulty band: above Expert (§0.4) — 13 entities, 49 endpoints, 10 state
# machine dimensions, 10 calculation rules, 38 ordered validations, 3 OCC
# concurrency rules, 62 error codes, 6 roles.
# =============================================================================

scenario: |
  2394. Beverage Container Deposit Redemption Center (Oregon Beverage Recycling
  Cooperative): covered container determination by beverage type and label
  registration, deposit initiation at the distributor and redemption payout at
  the center, reverse vending machine counting, jam handling and fraud limits
  per visit, out-of-state container detection and daily redemption caps,
  bag-drop account program with deferred counting and account credit, commodity
  sorting, baling and material sales revenue, unredeemed deposit accounting and
  program funding, retailer redemption obligation and exemption when a center is
  nearby.

domain_name: beverage-container-deposit-redemption

# Adjudication: the entity topology is `flat` (§0.3) — thirteen peer collections
# joined by foreign keys rather than one owning tree — so the API prefix is
# empty and every collection sits at the URL root. This also keeps every
# entity's single-resource GET in the `/<segment>/{id}` shape that
# scaffold_lint.py check (f) parses when it derives collection segments for FK
# reverse-reachability.
api_prefix: ""

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: peer_roles
  consistency_model: immediate
  difficulty_band: "beyond Expert"

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered distributor or bottler legal name"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code where the distributor is licensed"
        constraints: "exactly 2 uppercase letters"
      - name: permit_number
        type: string
        source: input
        description: "Beverage distribution permit number; unique across Distributor"
        constraints: "unique"
      - name: status
        type: enum
        source: input
        description: "Whether the distributor may initiate deposits"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: deposits_initiated_cents
        type: integer
        source: computed
        description: "Running sum of deposit_value_cents initiated by this distributor across all POST /distributors/{id}/deposit-initiations calls"
        default: 0
      - name: containers_initiated_count
        type: integer
        source: computed
        description: "Running sum of container_count across this distributor's deposit initiations"
        default: 0

  - name: BeverageProduct
    parent: null
    common_fields: true
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor that registered this label"
      - name: brand_name
        type: string
        source: input
        description: "Brand name printed on the label"
      - name: beverage_type
        type: enum
        source: input
        description: "Beverage category used by container_coverage_and_deposit to decide coverage"
        constraints: "one of {WATER, FLAVORED_WATER, BEER, MALT_BEVERAGE, CARBONATED_SOFT_DRINK, HARD_CIDER, KOMBUCHA, ENERGY_DRINK, RTD_COFFEE_TEA, FRUIT_JUICE, WINE, DISTILLED_SPIRITS, MILK, INFANT_FORMULA, MEAL_REPLACEMENT, VEGETABLE_JUICE}"
      - name: container_material
        type: enum
        source: input
        description: "Container material used by container_coverage_and_deposit to decide coverage"
        constraints: "one of {ALUMINUM, GLASS, PET_PLASTIC, HDPE_PLASTIC, POUCH, ASEPTIC_BOX, PAPER_CARTON}"
      - name: fill_volume_ml
        type: integer
        source: input
        description: "Labeled fill volume in millilitres; covered range is 118..3000 inclusive"
        constraints: "integer >= 1"
      - name: upc
        type: string
        source: input
        description: "Universal product code printed on the label; unique across BeverageProduct"
        constraints: "unique; 12 digits"
      - name: label_state_code
        type: string
        source: input
        description: "Two-letter state code printed on the redemption legend of the label; OR marks an in-state redeemable label"
        constraints: "exactly 2 uppercase letters"
      - name: coverage_status
        type: enum
        source: computed
        description: "Output of container_coverage_and_deposit — whether this label is a covered container"
        constraints: "one of {COVERED, NOT_COVERED}"
      - name: coverage_reason
        type: enum
        source: computed
        description: "Which clause of container_coverage_and_deposit decided coverage_status"
        constraints: "one of {COVERED_STANDARD, EXCLUDED_BEVERAGE_TYPE, EXCLUDED_MATERIAL, VOLUME_OUT_OF_RANGE}"
      - name: deposit_cents
        type: integer
        source: computed
        description: "Per-container deposit for this label: 10 when coverage_status is COVERED, otherwise 0"
        default: 0
      - name: registration_state
        type: enum
        source: system
        description: "Label registration lifecycle state; see state_machines.BeverageProduct"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REGISTERED, REJECTED, SUSPENDED, WITHDRAWN}"
      - name: rejection_reason
        type: string
        source: computed
        description: "Reason recorded by the REJECT registration action; null until a rejection occurs"
        default: null
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which registration_state last became REGISTERED; null before first approval"
        default: null

  - name: RedemptionCenter
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: "Public name of the redemption center"
      - name: x_miles
        type: number
        source: input
        description: "Center location X coordinate in miles on the program's planar grid"
      - name: y_miles
        type: number
        source: input
        description: "Center location Y coordinate in miles on the program's planar grid"
      - name: accepts_all_materials
        type: boolean
        source: input
        description: "True when the center accepts every material in COVERED_MATERIALS; only such centers can satisfy a retailer exemption"
        default: true
      - name: accepted_materials
        type: array
        source: input
        description: "Materials this center accepts; each element one of {ALUMINUM, GLASS, PET_PLASTIC, HDPE_PLASTIC}"
      - name: daily_account_cap_containers
        type: integer
        source: input
        description: "Per-account daily payable container allowance enforced by daily_cap_ledger at this center"
        default: 350
      - name: opening_cash_cents
        type: integer
        source: input
        description: "Cash loaded into the payout drawer when the center opened"
        default: 0
      - name: cash_drawer_balance_cents
        type: integer
        source: computed
        description: "opening_cash_cents minus the sum of payout_cents over this center's RedemptionVisit rows whose payout_status is PAID, plus the sum of payout_cents over this center's RedemptionVisit rows whose payout_status is REVERSED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Center operating state; see state_machines.RedemptionCenter"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, OPERATIONAL, SUSPENDED, CLOSED}"
      - name: suspension_reason
        type: enum
        source: computed
        description: "Why the center is SUSPENDED; null in every other status"
        default: null
        constraints: "one of {MACHINE_FLEET_DOWN, OPERATOR_REQUEST, PROGRAM_ACTION}"
      - name: machine_count
        type: integer
        source: computed
        description: "Count of ReverseVendingMachine rows for this center whose status is not RETIRED"
        default: 0
      - name: out_of_service_machine_count
        type: integer
        source: computed
        description: "Count of ReverseVendingMachine rows for this center whose status is OUT_OF_SERVICE"
        default: 0
      - name: accepted_container_count
        type: integer
        source: computed
        description: "Running sum of accepted_quantity over ContainerLot rows attached to this center's RedemptionVisit rows whose count_status is COUNTED"
        default: 0
      - name: unbatched_container_count
        type: integer
        source: computed
        description: "accepted_container_count minus batched_container_count; the pool available to CommodityBatch accumulation"
        default: 0
      - name: batched_container_count
        type: integer
        source: computed
        description: "Running sum of container_count over this center's CommodityBatch rows whose status is in {ACCUMULATING, SORTED, BALED, SOLD}"
        default: 0
      - name: withheld_visit_count
        type: integer
        source: computed
        description: "Count of this center's RedemptionVisit rows whose payout_status is WITHHELD"
        default: 0

  - name: ReverseVendingMachine
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> RedemptionCenter.id; the center hosting this machine"
      - name: asset_tag
        type: string
        source: input
        description: "Machine asset tag; unique across ReverseVendingMachine"
        constraints: "unique"
      - name: accepted_material
        type: enum
        source: input
        description: "The single material this machine counts"
        constraints: "one of {ALUMINUM, GLASS, PET_PLASTIC, HDPE_PLASTIC}"
      - name: bin_capacity_containers
        type: integer
        source: input
        description: "Container capacity of the machine bin before it must be emptied"
        default: 2000
      - name: bin_filled_count
        type: integer
        source: computed
        description: "Containers currently in the bin; increased by accepted counts, reset to 0 by an EMPTY_BIN machine event"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Machine state; see state_machines.ReverseVendingMachine"
        default: IDLE
        constraints: "one of {IDLE, COUNTING, JAMMED, BIN_FULL, OUT_OF_SERVICE, RETIRED}"
      - name: jam_day
        type: string
        source: computed
        description: "The visit_date (YYYY-MM-DD, logical clock) that jam_count_today refers to; null before the first jam"
        default: null
      - name: jam_count_today
        type: integer
        source: computed
        description: "Jams reported on jam_day; reset to 0 when a jam is reported on a later date"
        default: 0
      - name: session_started_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the current COUNTING session opened; null when status is not COUNTING"
        default: null
      - name: last_session_closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the most recent COUNTING session closed; anchors the 5-minute cooldown buffer"
        default: null
      - name: open_session_count
        type: integer
        source: computed
        description: "1 while a counting session occupies the machine (status COUNTING, and status JAMMED until the jam is cleared), 0 otherwise; the occupying visit is found with GET /redemption-visits?machine_id=<this machine id>"
        default: 0
      - name: jam_hold_count
        type: integer
        source: computed
        description: "Lifetime number of JAM_REPORTED machine events accepted for this machine"
        default: 0

  - name: RedeemerAccount
    parent: null
    common_fields: true
    fields:
      - name: holder_name
        type: string
        source: input
        description: "Name of the account holder"
      - name: account_code
        type: string
        source: input
        description: "Printed account code used on drop-bag tags; unique across RedeemerAccount"
        constraints: "unique"
      - name: bag_drop_enrolled
        type: boolean
        source: input
        description: "True when the holder may leave drop bags for deferred counting"
        default: false
      - name: status
        type: enum
        source: system
        description: "Account standing; see state_machines.RedeemerAccount"
        default: ACTIVE
        constraints: "one of {ACTIVE, FLAGGED, CLOSED}"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Signed sum of amount_cents over this account's AccountCreditEntry rows"
        default: 0
      - name: redemption_day
        type: string
        source: computed
        description: "The visit_date (YYYY-MM-DD) that containers_redeemed_today refers to; null before the first payable visit"
        default: null
      - name: containers_redeemed_today
        type: integer
        source: computed
        description: "Sum of payable_count over this account's RedemptionVisit rows whose visit_date equals redemption_day and whose count_status is COUNTED"
        default: 0
      - name: cap_reached_today
        type: boolean
        source: computed
        description: "True when containers_redeemed_today is greater than or equal to the visit center's daily_account_cap_containers"
        default: false
      - name: fraud_strikes
        type: integer
        source: computed
        description: "Lifetime count of fraud triggers recorded against the account by visit_payout_valuation and daily_cap_ledger; 2 strikes force status FLAGGED"
        default: 0
      - name: last_strike_reason
        type: enum
        source: computed
        description: "Reason for the most recent fraud strike; null before the first strike"
        default: null
        constraints: "one of {OUT_OF_STATE_RATIO, DAILY_CAP_EXCEEDED, BAG_DROP_VARIANCE}"

  - name: RedemptionVisit
    parent: null
    common_fields: true
    fields:
      - name: site_type
        type: enum
        source: input
        description: "Whether the containers were presented at a redemption center or at an obligated retailer"
        constraints: "one of {CENTER, RETAILER}"
      - name: center_id
        type: string
        source: input
        description: "FK -> RedemptionCenter.id; required when site_type is CENTER, must be omitted when site_type is RETAILER"
        default: null
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; required when site_type is RETAILER, must be omitted when site_type is CENTER"
        default: null
      - name: account_id
        type: string
        source: input
        description: "FK -> RedeemerAccount.id; omitted for anonymous walk-in visits"
        default: null
      - name: machine_id
        type: string
        source: input
        description: "FK -> ReverseVendingMachine.id; required when channel is MACHINE_COUNT, must be omitted when channel is HAND_COUNT"
        default: null
      - name: channel
        type: enum
        source: input
        description: "Counting channel; selects the visit_payout_valuation variant"
        constraints: "one of {MACHINE_COUNT, HAND_COUNT}"
      - name: visit_date
        type: string
        source: system
        description: "Logical-clock date (YYYY-MM-DD) at which the visit was opened; the daily_cap_ledger bucket key"
      - name: count_status
        type: enum
        source: system
        description: "Counting dimension of the visit; see state_machines.RedemptionVisit (state_field count_status)"
        default: OPEN
        constraints: "one of {OPEN, COUNTING, JAM_HOLD, COUNTED}"
      - name: payout_status
        type: enum
        source: system
        description: "Payout dimension of the visit; see state_machines.RedemptionVisit (state_field payout_status)"
        default: PENDING
        constraints: "one of {PENDING, WITHHELD, APPROVED, PAID, REVERSED}"
      - name: presented_total
        type: integer
        source: computed
        description: "Sum of presented_quantity over this visit's ContainerLot rows"
        default: 0
      - name: out_of_state_marked_total
        type: integer
        source: computed
        description: "Sum of out_of_state_marked_quantity over this visit's ContainerLot rows"
        default: 0
      - name: raw_accepted_count
        type: integer
        source: computed
        description: "Sum of accepted_quantity over this visit's ContainerLot rows, produced by lot_acceptance_screening"
        default: 0
      - name: out_of_state_ratio
        type: number
        source: computed
        description: "out_of_state_marked_total divided by presented_total, rounded to 4 decimal places, round_half_up; 0 when presented_total is 0"
        default: 0
      - name: visit_limit_applied
        type: integer
        source: computed
        description: "Per-visit container ceiling chosen by visit_payout_valuation from the visit's channel, site_type and account presence"
        default: 0
      - name: capped_count
        type: integer
        source: computed
        description: "min(raw_accepted_count, visit_limit_applied, daily_allowance) computed by visit_payout_valuation"
        default: 0
      - name: shrink_adjustment_count
        type: integer
        source: computed
        description: "Hand-count shrink deduction; 0 for MACHINE_COUNT visits"
        default: 0
      - name: payable_count
        type: integer
        source: computed
        description: "capped_count minus shrink_adjustment_count; the container count actually paid"
        default: 0
      - name: refused_over_limit_count
        type: integer
        source: computed
        description: "raw_accepted_count minus capped_count; containers accepted for recycling but not paid"
        default: 0
      - name: payout_cents
        type: integer
        source: computed
        description: "Sum over this visit's ContainerLot rows of paid_quantity times deposit_cents_per_container"
        default: 0
      - name: fraud_hold
        type: boolean
        source: computed
        description: "True when close-count detected an out-of-state ratio above 0.10 or a daily-cap breach; forces payout_status WITHHELD"
        default: false
      - name: withhold_reason
        type: enum
        source: computed
        description: "Why the payout is WITHHELD; null in every other payout_status"
        default: null
        constraints: "one of {OUT_OF_STATE_RATIO, DAILY_CAP_EXCEEDED, ACCOUNT_FLAGGED, MANUAL_REVIEW}"
      - name: requires_manual_recount
        type: boolean
        source: computed
        description: "True once a JAM_REPORTED machine event has moved count_status to JAM_HOLD at least once during this visit"
        default: false
      - name: jam_events_count
        type: integer
        source: computed
        description: "Number of JAM_REPORTED machine events recorded against this visit"
        default: 0
      - name: counted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which count_status became COUNTED; null before close-count"
        default: null
      - name: paid_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which payout_status became PAID; null otherwise"
        default: null

  - name: ContainerLot
    parent: null
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> RedemptionVisit.id; the visit this lot was presented at"
      - name: product_id
        type: string
        source: input
        description: "FK -> BeverageProduct.id; the registered label this lot consists of"
      - name: presented_quantity
        type: integer
        source: input
        description: "Containers of this label handed over in the lot"
        constraints: "integer >= 1"
      - name: out_of_state_marked_quantity
        type: integer
        source: input
        description: "Subset of presented_quantity whose redemption legend does not name the program state"
        default: 0
        constraints: "integer >= 0 and <= presented_quantity"
      - name: contaminated_quantity
        type: integer
        source: input
        description: "Subset of presented_quantity rejected for residue, crushing or non-container waste"
        default: 0
        constraints: "integer >= 0 and <= presented_quantity"
      - name: accepted_quantity
        type: integer
        source: computed
        description: "presented_quantity minus out_of_state_marked_quantity minus contaminated_quantity, per lot_acceptance_screening"
        default: 0
      - name: rejected_quantity
        type: integer
        source: computed
        description: "presented_quantity minus accepted_quantity"
        default: 0
      - name: reject_reason
        type: enum
        source: computed
        description: "Dominant rejection cause for the lot; null when rejected_quantity is 0"
        default: null
        constraints: "one of {OUT_OF_STATE, CONTAMINATED, NOT_COVERED, MIXED}"
      - name: deposit_cents_per_container
        type: integer
        source: computed
        description: "Snapshot of BeverageProduct.deposit_cents taken when the lot was added"
        default: 0
      - name: deposit_value_cents
        type: integer
        source: computed
        description: "accepted_quantity times deposit_cents_per_container"
        default: 0
      - name: paid_quantity
        type: integer
        source: computed
        description: "Containers of this lot inside the visit's payable_count after the waterfall allocation in visit_payout_valuation"
        default: 0
      - name: reconciliation_flag
        type: enum
        source: computed
        description: "Whether the lot was paid in full, paid in part, or not paid at all after close-count"
        default: UNSETTLED
        constraints: "one of {UNSETTLED, PAID_FULL, PAID_PARTIAL, UNPAID}"

  - name: BagDrop
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> RedeemerAccount.id; the enrolled holder who left the bag"
      - name: center_id
        type: string
        source: input
        description: "FK -> RedemptionCenter.id; the center that received the bag"
      - name: tag_code
        type: string
        source: input
        description: "Bag tag code; unique across BagDrop"
        constraints: "unique"
      - name: declared_count
        type: integer
        source: input
        description: "Container count declared by the holder on the bag tag"
        constraints: "integer >= 1"
      - name: dropped_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the bag was accepted"
      - name: status
        type: enum
        source: system
        description: "Bag-drop lifecycle; see state_machines.BagDrop"
        default: DROPPED
        constraints: "one of {DROPPED, COUNTED, DISPUTED, CREDITED, VOIDED}"
      - name: provisional_units
        type: integer
        source: computed
        description: "min(declared_count, 250) — the units the provisional variant of bag_drop_credit_valuation pays"
        default: 0
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "provisional_units times 8, posted as a PROVISIONAL AccountCreditEntry at drop time"
        default: 0
      - name: counted_lines
        type: integer
        source: computed
        description: "Number of counted material lines submitted by the plant counter"
        default: 0
      - name: counted_total
        type: integer
        source: computed
        description: "Sum of the counted material line quantities from the most recent accepted count result"
        default: 0
      - name: gross_final_cents
        type: integer
        source: computed
        description: "counted_total times 10, per the FINAL variant of bag_drop_credit_valuation"
        default: 0
      - name: final_credit_cents
        type: integer
        source: computed
        description: "gross_final_cents minus the 50-cent bag service fee, floored at 0"
        default: 0
      - name: adjustment_cents
        type: integer
        source: computed
        description: "final_credit_cents minus provisional_credit_cents; posted as a signed ADJUSTMENT AccountCreditEntry at settlement"
        default: 0
      - name: variance_pct
        type: number
        source: computed
        description: "(counted_total minus declared_count) divided by declared_count, rounded to 4 decimal places, round_half_up"
        default: 0
      - name: variance_flag
        type: boolean
        source: computed
        description: "True when the absolute value of variance_pct is greater than 0.10"
        default: false
      - name: recount_count
        type: integer
        source: computed
        description: "Number of times this bag drop has been moved from COUNTED to DISPUTED for a recount"
        default: 0
      - name: settled_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which status became CREDITED; null otherwise"
        default: null

  # Append-only credit journal. `common_fields: false` — id + created_at only,
  # no version, no update endpoint.
  - name: AccountCreditEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> RedeemerAccount.id; the account this journal line belongs to"
      - name: entry_type
        type: enum
        source: input
        description: "Kind of credit movement recorded by this line"
        constraints: "one of {PROVISIONAL, ADJUSTMENT, PAYOUT_WITHDRAWAL, CLAWBACK, MANUAL_GRANT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed movement in cents; negative for PAYOUT_WITHDRAWAL and CLAWBACK"
      - name: balance_after_cents
        type: integer
        source: computed
        description: "RedeemerAccount.credit_balance_cents immediately after this line was posted"
        default: 0
      - name: source_kind
        type: enum
        source: input
        description: "Polymorphic discriminator naming which entity produced this line"
        constraints: "one of {BAG_DROP, REDEMPTION_VISIT, PROGRAM_ACTION}"
      - name: source_ref_id
        type: string
        source: input
        description: "Identifier of the producing record; interpret against source_kind (BAG_DROP means a BagDrop.id, REDEMPTION_VISIT means a RedemptionVisit.id, PROGRAM_ACTION means the acting operator's X-User-ID). Polymorphic, therefore not a declared foreign key."
        default: null
      - name: memo
        type: string
        source: input
        description: "Free-text note kept for audit"
        default: null

  - name: CommodityBatch
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> RedemptionCenter.id; the center that accumulated this batch"
      - name: material
        type: enum
        source: input
        description: "Commodity stream of this batch"
        constraints: "one of {ALUMINUM, GLASS, PET_PLASTIC, HDPE_PLASTIC}"
      - name: batch_code
        type: string
        source: input
        description: "Plant batch code; unique across CommodityBatch"
        constraints: "unique"
      - name: container_count
        type: integer
        source: input
        description: "Containers drawn from the center's unbatched_container_count into this batch"
        constraints: "integer >= 1"
      - name: contamination_pct
        type: number
        source: input
        description: "Fraction of the batch mass rejected at sorting; strictly greater than 0.05 blocks the BALE action"
        default: 0
        constraints: "number >= 0 and <= 1"
      - name: status
        type: enum
        source: system
        description: "Batch processing lifecycle; see state_machines.CommodityBatch"
        default: ACCUMULATING
        constraints: "one of {ACCUMULATING, SORTED, BALED, SOLD}"
      - name: bale_weights_kg
        type: array
        source: input
        description: "Per-bale scale weights in kilograms recorded by the BALE action; each element a number > 0 with 2 decimal places"
        default: []
      - name: bale_count
        type: integer
        source: computed
        description: "Length of bale_weights_kg"
        default: 0
      - name: gross_weight_kg
        type: number
        source: computed
        description: "Sum of bale_weights_kg, rounded to 2 decimal places, round_half_up"
        default: 0
      - name: pricing_mode
        type: enum
        source: input
        description: "Whether the sale used the quoted spot price or the published index price; selects the material_sale_net_revenue variant"
        default: null
        constraints: "one of {SPOT, INDEX}"
      - name: quoted_price_cents_per_tonne
        type: integer
        source: input
        description: "Price quoted by the mill at sale time in cents per metric tonne"
        default: null
      - name: effective_price_cents_per_tonne
        type: integer
        source: computed
        description: "quoted_price_cents_per_tonne for SPOT; the same value reduced by 250 basis points and rounded to the nearest cent, round_half_up, for INDEX"
        default: 0
      - name: gross_revenue_cents
        type: integer
        source: computed
        description: "Sum over bales of round(bale_weight_kg / 1000 * effective_price_cents_per_tonne * (1 - contamination_pct)), each bale rounded to the nearest cent, round_half_up, before summing"
        default: 0
      - name: freight_cents
        type: integer
        source: computed
        description: "round(gross_weight_kg / 1000 * 4500) to the nearest cent, round_half_up"
        default: 0
      - name: net_revenue_cents
        type: integer
        source: computed
        description: "gross_revenue_cents minus freight_cents, floored at 0"
        default: 0
      - name: sold_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which status became SOLD; null otherwise"
        default: null

  # Append-only program ledger. `common_fields: false` — id + created_at only.
  - name: DepositLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: period_id
        type: string
        source: input
        description: "FK -> ProgramPeriod.id; the period this ledger line is booked into"
      - name: entry_type
        type: enum
        source: input
        description: "Kind of deposit-liability movement recorded by this line"
        constraints: "one of {DEPOSIT_INITIATED, REDEMPTION_PAID, REDEMPTION_REVERSED, BAG_DROP_CREDIT, UNREDEEMED_SWEEP, HANDLING_FEE, MATERIAL_REVENUE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed movement in cents; positive increases the outstanding deposit liability, negative decreases it"
      - name: container_count
        type: integer
        source: input
        description: "Containers represented by this line; 0 for pure money lines such as HANDLING_FEE and MATERIAL_REVENUE"
        default: 0
      - name: liability_after_cents
        type: integer
        source: computed
        description: "ProgramPeriod.outstanding_liability_cents immediately after this line was posted"
        default: 0
      - name: source_kind
        type: enum
        source: input
        description: "Polymorphic discriminator naming which entity produced this line"
        constraints: "one of {DISTRIBUTOR, REDEMPTION_VISIT, BAG_DROP, COMMODITY_BATCH, PROGRAM_ACTION}"
      - name: source_ref_id
        type: string
        source: input
        description: "Identifier of the producing record; interpret against source_kind (DISTRIBUTOR means a Distributor.id, REDEMPTION_VISIT means a RedemptionVisit.id, BAG_DROP means a BagDrop.id, COMMODITY_BATCH means a CommodityBatch.id, PROGRAM_ACTION means the acting operator's X-User-ID). Polymorphic, therefore not a declared foreign key."
        default: null

  - name: ProgramPeriod
    parent: null
    common_fields: true
    fields:
      - name: quarter_code
        type: string
        source: input
        description: "Reporting quarter label such as 2026Q3; unique across ProgramPeriod"
        constraints: "unique; matches ^[0-9]{4}Q[1-4]$"
      - name: start_date
        type: string
        source: input
        description: "First date (YYYY-MM-DD) inside the period"
      - name: end_date
        type: string
        source: input
        description: "Last date (YYYY-MM-DD) inside the period; must be strictly after start_date"
      - name: operating_cost_cents
        type: integer
        source: input
        description: "Administrative cost of running the program during the period, charged against the unredeemed sweep"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Period lifecycle; see state_machines.ProgramPeriod"
        default: OPEN
        constraints: "one of {OPEN, RECONCILING, CLOSED}"
      - name: deposits_initiated_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this period's DepositLedgerEntry rows whose entry_type is DEPOSIT_INITIATED"
        default: 0
      - name: containers_initiated_count
        type: integer
        source: computed
        description: "Sum of container_count over this period's DEPOSIT_INITIATED ledger lines"
        default: 0
      - name: redemptions_paid_cents
        type: integer
        source: computed
        description: "Absolute sum of amount_cents over this period's DepositLedgerEntry rows whose entry_type is in {REDEMPTION_PAID, BAG_DROP_CREDIT} net of REDEMPTION_REVERSED lines"
        default: 0
      - name: containers_redeemed_count
        type: integer
        source: computed
        description: "Sum of container_count over this period's REDEMPTION_PAID and BAG_DROP_CREDIT ledger lines net of REDEMPTION_REVERSED lines"
        default: 0
      - name: material_revenue_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this period's MATERIAL_REVENUE ledger lines"
        default: 0
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "Tiered handling reimbursement owed to redemption sites, computed by period_funding_settlement from containers_redeemed_count"
        default: 0
      - name: gross_unredeemed_cents
        type: integer
        source: computed
        description: "deposits_initiated_cents minus redemptions_paid_cents, floored at 0"
        default: 0
      - name: admin_shortfall_cents
        type: integer
        source: computed
        description: "operating_cost_cents plus handling_fee_cents minus material_revenue_cents, floored at 0"
        default: 0
      - name: sweep_to_funding_cents
        type: integer
        source: computed
        description: "min(gross_unredeemed_cents, admin_shortfall_cents) — the part of the unredeemed pool consumed by program funding"
        default: 0
      - name: unredeemed_deposit_cents
        type: integer
        source: computed
        description: "gross_unredeemed_cents minus sweep_to_funding_cents — the residual unredeemed deposits retained by the cooperative"
        default: 0
      - name: funding_balance_cents
        type: integer
        source: computed
        description: "material_revenue_cents plus sweep_to_funding_cents minus operating_cost_cents minus handling_fee_cents; negative means the period could not fund itself"
        default: 0
      - name: outstanding_liability_cents
        type: integer
        source: computed
        description: "Running deposit liability maintained by program_deposit_liability across this period's DepositLedgerEntry rows"
        default: 0
      - name: funding_status
        type: enum
        source: computed
        description: "Whether the period funded itself; SURPLUS when funding_balance_cents >= 0, SHORTFALL otherwise; UNSETTLED before reconciliation"
        default: UNSETTLED
        constraints: "one of {UNSETTLED, SURPLUS, SHORTFALL}"
      - name: reconciled_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which period_funding_settlement last ran; null before the first RECONCILE"
        default: null

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: store_name
        type: string
        source: input
        description: "Retail store name"
      - name: x_miles
        type: number
        source: input
        description: "Store location X coordinate in miles on the program's planar grid"
      - name: y_miles
        type: number
        source: input
        description: "Store location Y coordinate in miles on the program's planar grid"
      - name: store_area_sqft
        type: integer
        source: input
        description: "Interior retail area in square feet; 5000 or more raises the per-visit hand-count limit"
        constraints: "integer >= 1"
      - name: daily_limit_containers
        type: integer
        source: computed
        description: "Per-visit hand-count ceiling at this store: 50 when store_area_sqft >= 5000, otherwise 24"
        default: 24
      - name: obligation_status
        type: enum
        source: system
        description: "Whether the store must accept containers; see state_machines.Retailer"
        default: OBLIGATED
        constraints: "one of {OBLIGATED, EXEMPT}"
      - name: nearest_center_id
        type: string
        source: computed
        description: "FK -> RedemptionCenter.id; the center selected by retailer_exemption_distance when the exemption was granted; null while obligation_status is OBLIGATED"
        default: null
      - name: nearest_center_distance_miles
        type: number
        source: computed
        description: "Euclidean distance in miles to nearest_center_id, rounded to 2 decimal places, round_half_up; null while obligation_status is OBLIGATED"
        default: null
      - name: exemption_granted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which obligation_status became EXEMPT; null otherwise"
        default: null

# =============================================================================
# §1.2 State Machine Table
#
# Shape: `parallel` — RedemptionVisit carries two independent state dimensions
# (`count_status` and `payout_status`), each declared as its own entry with an
# explicit `state_field:`. ReverseVendingMachine and BagDrop add cyclic
# sub-loops (jam clear, recount) on top of otherwise forward pipelines.
# =============================================================================
state_machines:

  - entity: BeverageProduct
    state_field: registration_state
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /beverage-products/{id}/registration-actions with action SUBMIT"
        actor: DistributorAgent
        preconditions:
          - "Distributor.status of the owning distributor is ACTIVE"
          - "registration_state is DRAFT"
        side_effects:
          - "recompute coverage_status, coverage_reason and deposit_cents via calculations.container_coverage_and_deposit"
          - "increments BeverageProduct.version by 1"
      - from: SUBMITTED
        to: REGISTERED
        trigger: "POST /beverage-products/{id}/registration-actions with action APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "registration_state is SUBMITTED"
          - "coverage_status is COVERED"
        side_effects:
          - "set registered_at to the current logical-clock instant"
          - "clear rejection_reason to null"
          - "increments BeverageProduct.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /beverage-products/{id}/registration-actions with action REJECT"
        actor: ProgramAdmin
        preconditions:
          - "registration_state is SUBMITTED"
        side_effects:
          - "set rejection_reason to the supplied reason"
          - "increments BeverageProduct.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /beverage-products/{id}/registration-actions with action SUBMIT"
        actor: DistributorAgent
        preconditions:
          - "registration_state is REJECTED"
        side_effects:
          - "recompute coverage_status, coverage_reason and deposit_cents via calculations.container_coverage_and_deposit"
          - "increments BeverageProduct.version by 1"
        note: "Cycle — a rejected label may be corrected and resubmitted any number of times."
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /beverage-products/{id}/registration-actions with action SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "registration_state is REGISTERED"
        side_effects:
          - "set rejection_reason to the supplied reason"
          - "increments BeverageProduct.version by 1"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /beverage-products/{id}/registration-actions with action REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "registration_state is SUSPENDED"
        side_effects:
          - "set registered_at to the current logical-clock instant"
          - "clear rejection_reason to null"
          - "increments BeverageProduct.version by 1"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /beverage-products/{id}/registration-actions with action WITHDRAW"
        actor: DistributorAgent
        preconditions:
          - "registration_state is REGISTERED"
        side_effects:
          - "set deposit_cents to 0"
          - "increments BeverageProduct.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /beverage-products/{id}/registration-actions with action WITHDRAW"
        actor: DistributorAgent
        preconditions:
          - "registration_state is SUSPENDED"
        side_effects:
          - "set deposit_cents to 0"
          - "increments BeverageProduct.version by 1"

  - entity: RedemptionCenter
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [CLOSED]
    transitions:
      - from: PROVISIONAL
        to: OPERATIONAL
        trigger: "POST /redemption-centers/{id}/status-changes with action ACTIVATE"
        actor: ProgramAdmin
        preconditions:
          - "status is PROVISIONAL"
          - "machine_count is greater than or equal to 1"
        side_effects:
          - "set cash_drawer_balance_cents to opening_cash_cents"
          - "clear suspension_reason to null"
          - "increments RedemptionCenter.version by 1"
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "POST /redemption-centers/{id}/status-changes with action SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "status is OPERATIONAL"
        side_effects:
          - "set suspension_reason to OPERATOR_REQUEST when the actor is CenterOperator, otherwise PROGRAM_ACTION"
          - "increments RedemptionCenter.version by 1"
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "system — every non-RETIRED machine of the center reaches status OUT_OF_SERVICE after a TAKE_OUT_OF_SERVICE machine event"
        actor: system
        preconditions:
          - "status is OPERATIONAL"
          - "out_of_service_machine_count equals machine_count and machine_count is greater than or equal to 1"
        side_effects:
          - "set suspension_reason to MACHINE_FLEET_DOWN"
          - "increments RedemptionCenter.version by 1"
      - from: SUSPENDED
        to: OPERATIONAL
        trigger: "POST /redemption-centers/{id}/status-changes with action REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "status is SUSPENDED"
          - "out_of_service_machine_count is strictly less than machine_count"
        side_effects:
          - "clear suspension_reason to null"
          - "increments RedemptionCenter.version by 1"
      - from: OPERATIONAL
        to: CLOSED
        trigger: "POST /redemption-centers/{id}/status-changes with action CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "status is OPERATIONAL"
          - "no RedemptionVisit of this center has count_status in {OPEN, COUNTING, JAM_HOLD}"
        side_effects:
          - "cascade — every non-RETIRED ReverseVendingMachine of this center moves to RETIRED"
          - "cascade — every Retailer whose nearest_center_id equals this center id moves obligation_status from EXEMPT to OBLIGATED and has nearest_center_id and nearest_center_distance_miles cleared to null"
          - "increments RedemptionCenter.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /redemption-centers/{id}/status-changes with action CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "status is SUSPENDED"
          - "no RedemptionVisit of this center has count_status in {OPEN, COUNTING, JAM_HOLD}"
        side_effects:
          - "cascade — every non-RETIRED ReverseVendingMachine of this center moves to RETIRED"
          - "cascade — every Retailer whose nearest_center_id equals this center id moves obligation_status from EXEMPT to OBLIGATED and has nearest_center_id and nearest_center_distance_miles cleared to null"
          - "increments RedemptionCenter.version by 1"

  - entity: ReverseVendingMachine
    state_field: status
    initial_state: IDLE
    terminal_states: [RETIRED]
    transitions:
      - from: IDLE
        to: COUNTING
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type SESSION_OPEN"
        actor: CenterOperator
        preconditions:
          - "status is IDLE"
          - "RedemptionCenter.status of the hosting center is OPERATIONAL"
          - "the supplied visit_id names a RedemptionVisit whose machine_id equals this machine and whose count_status is in {OPEN, COUNTING}"
          - "the current logical-clock instant is not inside the half-open cooldown window [last_session_closed_at, last_session_closed_at + 5 minutes) — see calculations.machine_session_cooldown"
        side_effects:
          - "set session_started_at to the current logical-clock instant"
          - "set open_session_count to 1"
          - "increments ReverseVendingMachine.version by 1"
      - from: COUNTING
        to: IDLE
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type SESSION_CLOSE"
        actor: CenterOperator
        preconditions:
          - "status is COUNTING"
        side_effects:
          - "set last_session_closed_at to the current logical-clock instant"
          - "clear session_started_at to null"
          - "set open_session_count to 0"
          - "increments ReverseVendingMachine.version by 1"
      - from: COUNTING
        to: JAMMED
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type JAM_REPORTED"
        actor: CenterOperator
        preconditions:
          - "status is COUNTING"
          - "jam_count_today for the current logical-clock date is strictly less than 3"
        side_effects:
          - "increment jam_hold_count by 1"
          - "set jam_day to the current logical-clock date and increment jam_count_today by 1, resetting it to 1 first when jam_day was an earlier date"
          - "cascade — the RedemptionVisit named by visit_id moves count_status from COUNTING to JAM_HOLD, sets requires_manual_recount true and increments jam_events_count by 1"
          - "increments ReverseVendingMachine.version by 1"
      - from: JAMMED
        to: IDLE
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type JAM_CLEARED"
        actor: CenterOperator
        preconditions:
          - "status is JAMMED"
        side_effects:
          - "set last_session_closed_at to the current logical-clock instant"
          - "clear session_started_at to null"
          - "set open_session_count to 0"
          - "cascade — the RedemptionVisit named by visit_id moves count_status from JAM_HOLD back to COUNTING"
          - "increments ReverseVendingMachine.version by 1"
        note: "Cycle — IDLE -> COUNTING -> JAMMED -> IDLE -> COUNTING is a legal loop until the third jam of the logical-clock date."
      - from: COUNTING
        to: OUT_OF_SERVICE
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type JAM_REPORTED when jam_count_today already equals 3"
        actor: CenterOperator
        preconditions:
          - "status is COUNTING"
          - "jam_count_today for the current logical-clock date equals 3"
        side_effects:
          - "increment jam_hold_count by 1 and increment jam_count_today by 1"
          - "clear session_started_at to null and set open_session_count to 0"
          - "cascade — the RedemptionVisit named by visit_id moves count_status from COUNTING to JAM_HOLD, sets requires_manual_recount true and increments jam_events_count by 1"
          - "cascade — recompute RedemptionCenter.out_of_service_machine_count and, when it equals machine_count, move the center from OPERATIONAL to SUSPENDED with suspension_reason MACHINE_FLEET_DOWN"
          - "increments ReverseVendingMachine.version by 1"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type TAKE_OUT_OF_SERVICE"
        actor: CenterOperator
        preconditions:
          - "status is IDLE"
        side_effects:
          - "cascade — recompute RedemptionCenter.out_of_service_machine_count and, when it equals machine_count, move the center from OPERATIONAL to SUSPENDED with suspension_reason MACHINE_FLEET_DOWN"
          - "increments ReverseVendingMachine.version by 1"
      - from: OUT_OF_SERVICE
        to: IDLE
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type RETURN_TO_SERVICE"
        actor: CenterOperator
        preconditions:
          - "status is OUT_OF_SERVICE"
        side_effects:
          - "set jam_count_today to 0 and jam_day to null"
          - "cascade — recompute RedemptionCenter.out_of_service_machine_count"
          - "increments ReverseVendingMachine.version by 1"
      - from: IDLE
        to: BIN_FULL
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type BIN_FULL"
        actor: CenterOperator
        preconditions:
          - "status is IDLE"
          - "bin_filled_count is greater than or equal to bin_capacity_containers"
        side_effects:
          - "increments ReverseVendingMachine.version by 1"
      - from: BIN_FULL
        to: IDLE
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type EMPTY_BIN"
        actor: CenterOperator
        preconditions:
          - "status is BIN_FULL"
        side_effects:
          - "set bin_filled_count to 0"
          - "increments ReverseVendingMachine.version by 1"
      - from: IDLE
        to: RETIRED
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type RETIRE"
        actor: ProgramAdmin
        preconditions:
          - "status is IDLE"
        side_effects:
          - "cascade — recompute RedemptionCenter.machine_count and out_of_service_machine_count"
          - "increments ReverseVendingMachine.version by 1"
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type RETIRE"
        actor: ProgramAdmin
        preconditions:
          - "status is OUT_OF_SERVICE"
        side_effects:
          - "cascade — recompute RedemptionCenter.machine_count and out_of_service_machine_count"
          - "increments ReverseVendingMachine.version by 1"

  - entity: RedeemerAccount
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FLAGGED
        trigger: "POST /redeemer-accounts/{id}/status-changes with action FLAG"
        actor: ProgramAdmin
        preconditions:
          - "status is ACTIVE"
        side_effects:
          - "increments RedeemerAccount.version by 1"
      - from: ACTIVE
        to: FLAGGED
        trigger: "system — fraud_strikes reaches 2 during POST /redemption-visits/{id}/close-count or POST /bag-drops/{id}/count-results"
        actor: system
        preconditions:
          - "status is ACTIVE"
          - "fraud_strikes reaches 2 after the strike recorded by this request"
        side_effects:
          - "set last_strike_reason to the reason of the strike that reached the limit"
          - "cascade — the triggering RedemptionVisit moves payout_status from PENDING to WITHHELD with withhold_reason ACCOUNT_FLAGGED"
          - "increments RedeemerAccount.version by 1"
      - from: FLAGGED
        to: ACTIVE
        trigger: "POST /redeemer-accounts/{id}/status-changes with action UNFLAG"
        actor: ProgramAdmin
        preconditions:
          - "status is FLAGGED"
        side_effects:
          - "set fraud_strikes to 0 and last_strike_reason to null"
          - "increments RedeemerAccount.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /redeemer-accounts/{id}/status-changes with action CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "status is ACTIVE"
          - "credit_balance_cents equals 0"
          - "no BagDrop of this account has status in {DROPPED, COUNTED, DISPUTED}"
        side_effects:
          - "set bag_drop_enrolled to false"
          - "increments RedeemerAccount.version by 1"
      - from: FLAGGED
        to: CLOSED
        trigger: "POST /redeemer-accounts/{id}/status-changes with action CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "status is FLAGGED"
          - "credit_balance_cents equals 0"
          - "no BagDrop of this account has status in {DROPPED, COUNTED, DISPUTED}"
        side_effects:
          - "set bag_drop_enrolled to false"
          - "increments RedeemerAccount.version by 1"

  # Parallel dimension 1 of 2 on RedemptionVisit.
  - entity: RedemptionVisit
    state_field: count_status
    initial_state: OPEN
    terminal_states: [COUNTED]
    transitions:
      - from: OPEN
        to: COUNTING
        trigger: "POST /redemption-visits/{id}/lots"
        actor: CenterOperator
        preconditions:
          - "count_status is OPEN"
          - "the referenced BeverageProduct has registration_state REGISTERED"
          - "for a CENTER visit, RedemptionCenter.status is OPERATIONAL"
          - "for a RETAILER visit, Retailer.obligation_status is OBLIGATED"
        side_effects:
          - "run calculations.lot_acceptance_screening for the new lot"
          - "recompute presented_total, out_of_state_marked_total, raw_accepted_count and out_of_state_ratio"
          - "increments RedemptionVisit.version by 1"
      - from: COUNTING
        to: COUNTING
        trigger: "POST /redemption-visits/{id}/lots"
        actor: CenterOperator
        preconditions:
          - "count_status is COUNTING"
          - "the referenced BeverageProduct has registration_state REGISTERED"
          - "for a CENTER visit, RedemptionCenter.status is OPERATIONAL"
        side_effects:
          - "run calculations.lot_acceptance_screening for the new lot"
          - "recompute presented_total, out_of_state_marked_total, raw_accepted_count and out_of_state_ratio"
          - "increments RedemptionVisit.version by 1"
        note: "Self-transition — additional lots may be added while the visit is COUNTING."
      - from: COUNTING
        to: JAM_HOLD
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type JAM_REPORTED naming this visit"
        actor: CenterOperator
        preconditions:
          - "count_status is COUNTING"
          - "channel is MACHINE_COUNT"
        side_effects:
          - "set requires_manual_recount true and increment jam_events_count by 1"
          - "increments RedemptionVisit.version by 1"
      - from: JAM_HOLD
        to: COUNTING
        trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type JAM_CLEARED naming this visit"
        actor: CenterOperator
        preconditions:
          - "count_status is JAM_HOLD"
        side_effects:
          - "increments RedemptionVisit.version by 1"
        note: "Cycle — a visit may be held and released repeatedly; requires_manual_recount stays true once set."
      - from: COUNTING
        to: COUNTED
        trigger: "POST /redemption-visits/{id}/close-count"
        actor: CenterOperator
        preconditions:
          - "count_status is COUNTING"
          - "for a CENTER visit, RedemptionCenter.status is OPERATIONAL"
        side_effects:
          - "set counted_at to the current logical-clock instant"
          - "run calculations.visit_payout_valuation to set visit_limit_applied, capped_count, shrink_adjustment_count, payable_count, refused_over_limit_count and payout_cents"
          - "run calculations.daily_cap_ledger to update RedeemerAccount.redemption_day, containers_redeemed_today and cap_reached_today"
          - "allocate payable_count across this visit's ContainerLot rows in created_at ASC order, setting paid_quantity and reconciliation_flag on each"
          - "when out_of_state_ratio is strictly greater than 0.10, set fraud_hold true, withhold_reason OUT_OF_STATE_RATIO and increment RedeemerAccount.fraud_strikes by 1 with last_strike_reason OUT_OF_STATE_RATIO"
          - "when raw_accepted_count exceeds the remaining daily allowance, set fraud_hold true, withhold_reason DAILY_CAP_EXCEEDED and increment RedeemerAccount.fraud_strikes by 1 with last_strike_reason DAILY_CAP_EXCEEDED"
          - "when fraud_hold is true, move payout_status from PENDING to WITHHELD"
          - "when RedeemerAccount.fraud_strikes reaches 2, move the account from ACTIVE to FLAGGED and set withhold_reason ACCOUNT_FLAGGED"
          - "for a MACHINE_COUNT visit, add raw_accepted_count to ReverseVendingMachine.bin_filled_count"
          - "recompute RedemptionCenter.accepted_container_count and unbatched_container_count"
          - "increments RedemptionVisit.version by 1"
      - from: OPEN
        to: COUNTED
        trigger: "POST /redemption-visits/{id}/close-count"
        actor: CenterOperator
        preconditions:
          - "count_status is OPEN"
        side_effects:
          - "set counted_at to the current logical-clock instant"
          - "run calculations.visit_payout_valuation over the empty lot set, yielding capped_count 0, shrink_adjustment_count 0, payable_count 0, refused_over_limit_count 0 and payout_cents 0"
          - "run calculations.daily_cap_ledger, which leaves RedeemerAccount.containers_redeemed_today unchanged"
          - "increments RedemptionVisit.version by 1"
        note: "Empty-set boundary — a visit closed with zero lots is COUNTED with a zero payout and no fraud strike."

  # Parallel dimension 2 of 2 on RedemptionVisit.
  - entity: RedemptionVisit
    state_field: payout_status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: WITHHELD
        trigger: "POST /redemption-visits/{id}/close-count when the request sets fraud_hold true, or POST /redemption-visits/{id}/payout-actions with action WITHHOLD"
        actor: CenterOperator
        preconditions:
          - "payout_status is PENDING"
        side_effects:
          - "set withhold_reason to OUT_OF_STATE_RATIO, DAILY_CAP_EXCEEDED or ACCOUNT_FLAGGED for the automatic path, MANUAL_REVIEW for the explicit WITHHOLD action"
          - "recompute RedemptionCenter.withheld_visit_count"
          - "increments RedemptionVisit.version by 1"
      - from: WITHHELD
        to: PENDING
        trigger: "POST /redemption-visits/{id}/payout-actions with action RELEASE_HOLD"
        actor: ProgramAdmin
        preconditions:
          - "payout_status is WITHHELD"
          - "RedeemerAccount.status is ACTIVE, or the visit has no account_id"
        side_effects:
          - "set fraud_hold false and withhold_reason null"
          - "recompute RedemptionCenter.withheld_visit_count"
          - "increments RedemptionVisit.version by 1"
        note: "Cycle — a released visit can be withheld again by a later WITHHOLD action."
      - from: PENDING
        to: APPROVED
        trigger: "POST /redemption-visits/{id}/payout-actions with action APPROVE"
        actor: CenterOperator
        preconditions:
          - "payout_status is PENDING"
          - "count_status is COUNTED"
          - "fraud_hold is false"
          - "requires_manual_recount is false"
        side_effects:
          - "increments RedemptionVisit.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /redemption-visits/{id}/payout-actions with action PAY"
        actor: CenterOperator
        preconditions:
          - "payout_status is APPROVED"
          - "for a CENTER visit, RedemptionCenter.cash_drawer_balance_cents is greater than or equal to payout_cents"
        side_effects:
          - "set paid_at to the current logical-clock instant"
          - "decrease RedemptionCenter.cash_drawer_balance_cents by payout_cents"
          - "append a DepositLedgerEntry with entry_type REDEMPTION_PAID, amount_cents equal to minus payout_cents, container_count equal to payable_count, source_kind REDEMPTION_VISIT and source_ref_id equal to this visit id, into the ProgramPeriod whose date range contains visit_date"
          - "run calculations.program_deposit_liability to refresh ProgramPeriod.outstanding_liability_cents, redemptions_paid_cents and containers_redeemed_count"
          - "increments RedemptionVisit.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /redemption-visits/{id}/payout-actions with action REVERSE"
        actor: ProgramAdmin
        preconditions:
          - "payout_status is PAID"
          - "the ProgramPeriod containing visit_date has status OPEN"
        side_effects:
          - "compensation — increase RedemptionCenter.cash_drawer_balance_cents by payout_cents"
          - "compensation — append a DepositLedgerEntry with entry_type REDEMPTION_REVERSED, amount_cents equal to payout_cents, container_count equal to payable_count, source_kind REDEMPTION_VISIT and source_ref_id equal to this visit id"
          - "compensation — run calculations.program_deposit_liability so ProgramPeriod.outstanding_liability_cents, redemptions_paid_cents and containers_redeemed_count return to their pre-payment values"
          - "compensation — set every ContainerLot of this visit to paid_quantity 0 and reconciliation_flag UNPAID"
          - "compensation — subtract payable_count from RedeemerAccount.containers_redeemed_today and recompute cap_reached_today"
          - "increments RedemptionVisit.version by 1"

  - entity: BagDrop
    state_field: status
    initial_state: DROPPED
    terminal_states: [CREDITED, VOIDED]
    transitions:
      - from: DROPPED
        to: COUNTED
        trigger: "POST /bag-drops/{id}/count-results"
        actor: PlantCounter
        preconditions:
          - "status is DROPPED"
          - "RedemptionCenter.status of the receiving center is OPERATIONAL"
        side_effects:
          - "run the FINAL variant of calculations.bag_drop_credit_valuation to set counted_lines, counted_total, gross_final_cents, final_credit_cents, adjustment_cents, variance_pct and variance_flag"
          - "when variance_flag is true, increment RedeemerAccount.fraud_strikes by 1 with last_strike_reason BAG_DROP_VARIANCE"
          - "when RedeemerAccount.fraud_strikes reaches 2, move the account from ACTIVE to FLAGGED"
          - "increments BagDrop.version by 1"
      - from: COUNTED
        to: DISPUTED
        trigger: "POST /bag-drops/{id}/settlement-actions with action DISPUTE"
        actor: AccountHolder
        preconditions:
          - "status is COUNTED"
          - "the current logical-clock instant is strictly earlier than dropped_at plus 72 hours"
        side_effects:
          - "increment recount_count by 1"
          - "increments BagDrop.version by 1"
      - from: DISPUTED
        to: COUNTED
        trigger: "POST /bag-drops/{id}/count-results"
        actor: PlantCounter
        preconditions:
          - "status is DISPUTED"
        side_effects:
          - "re-run the FINAL variant of calculations.bag_drop_credit_valuation, replacing counted_lines, counted_total, gross_final_cents, final_credit_cents, adjustment_cents, variance_pct and variance_flag with the recount result"
          - "increments BagDrop.version by 1"
        note: "Cycle — DROPPED -> COUNTED -> DISPUTED -> COUNTED; each recount fully replaces the previous count."
      - from: COUNTED
        to: CREDITED
        trigger: "POST /bag-drops/{id}/settlement-actions with action CREDIT"
        actor: CenterOperator
        preconditions:
          - "status is COUNTED"
          - "RedeemerAccount.status is ACTIVE"
        side_effects:
          - "set settled_at to the current logical-clock instant"
          - "append an AccountCreditEntry with entry_type ADJUSTMENT, amount_cents equal to adjustment_cents, source_kind BAG_DROP and source_ref_id equal to this bag drop id"
          - "recompute RedeemerAccount.credit_balance_cents"
          - "append a DepositLedgerEntry with entry_type BAG_DROP_CREDIT, amount_cents equal to minus final_credit_cents, container_count equal to counted_total, source_kind BAG_DROP and source_ref_id equal to this bag drop id, into the ProgramPeriod whose date range contains the date part of settled_at"
          - "run calculations.program_deposit_liability to refresh ProgramPeriod.outstanding_liability_cents, redemptions_paid_cents and containers_redeemed_count"
          - "increments BagDrop.version by 1"
      - from: DROPPED
        to: VOIDED
        trigger: "POST /bag-drops/{id}/settlement-actions with action VOID"
        actor: ProgramAdmin
        preconditions:
          - "status is DROPPED"
        side_effects:
          - "compensation — append an AccountCreditEntry with entry_type CLAWBACK, amount_cents equal to minus provisional_credit_cents, source_kind BAG_DROP and source_ref_id equal to this bag drop id"
          - "recompute RedeemerAccount.credit_balance_cents"
          - "increments BagDrop.version by 1"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /bag-drops/{id}/settlement-actions with action VOID"
        actor: ProgramAdmin
        preconditions:
          - "status is DISPUTED"
        side_effects:
          - "compensation — append an AccountCreditEntry with entry_type CLAWBACK, amount_cents equal to minus provisional_credit_cents, source_kind BAG_DROP and source_ref_id equal to this bag drop id"
          - "recompute RedeemerAccount.credit_balance_cents"
          - "increments BagDrop.version by 1"

  - entity: CommodityBatch
    state_field: status
    initial_state: ACCUMULATING
    terminal_states: [SOLD]
    transitions:
      - from: ACCUMULATING
        to: SORTED
        trigger: "POST /commodity-batches/{id}/processing-actions with action SORT"
        actor: PlantCounter
        preconditions:
          - "status is ACCUMULATING"
          - "contamination_pct supplied by the request is between 0 and 1 inclusive"
        side_effects:
          - "store contamination_pct"
          - "increments CommodityBatch.version by 1"
      - from: SORTED
        to: BALED
        trigger: "POST /commodity-batches/{id}/processing-actions with action BALE"
        actor: PlantCounter
        preconditions:
          - "status is SORTED"
          - "contamination_pct is less than or equal to 0.05"
          - "bale_weights_kg supplied by the request has at least 1 element"
        side_effects:
          - "store bale_weights_kg and set bale_count and gross_weight_kg"
          - "increments CommodityBatch.version by 1"
      - from: BALED
        to: SOLD
        trigger: "POST /commodity-batches/{id}/sale"
        actor: CenterOperator
        preconditions:
          - "status is BALED"
          - "the ProgramPeriod named by period_id has status OPEN"
        side_effects:
          - "set sold_at to the current logical-clock instant"
          - "run calculations.material_sale_net_revenue to set effective_price_cents_per_tonne, gross_revenue_cents, freight_cents and net_revenue_cents"
          - "append a DepositLedgerEntry with entry_type MATERIAL_REVENUE, amount_cents equal to net_revenue_cents, container_count 0, source_kind COMMODITY_BATCH and source_ref_id equal to this batch id, into the ProgramPeriod named by period_id"
          - "run calculations.program_deposit_liability to refresh ProgramPeriod.material_revenue_cents and outstanding_liability_cents"
          - "increments CommodityBatch.version by 1"

  - entity: ProgramPeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RECONCILING
        trigger: "POST /program-periods/{id}/period-actions with action RECONCILE"
        actor: ProgramAdmin
        preconditions:
          - "status is OPEN"
          - "no RedemptionVisit whose visit_date lies inside [start_date, end_date] has count_status in {OPEN, COUNTING, JAM_HOLD}"
        side_effects:
          - "set reconciled_at to the current logical-clock instant"
          - "run calculations.period_funding_settlement to set handling_fee_cents, gross_unredeemed_cents, admin_shortfall_cents, sweep_to_funding_cents, unredeemed_deposit_cents, funding_balance_cents and funding_status"
          - "append a DepositLedgerEntry with entry_type HANDLING_FEE, amount_cents equal to handling_fee_cents, container_count 0, source_kind PROGRAM_ACTION"
          - "append a DepositLedgerEntry with entry_type UNREDEEMED_SWEEP, amount_cents equal to minus sweep_to_funding_cents, container_count 0, source_kind PROGRAM_ACTION"
          - "run calculations.program_deposit_liability to refresh outstanding_liability_cents"
          - "increments ProgramPeriod.version by 1"
      - from: RECONCILING
        to: OPEN
        trigger: "POST /program-periods/{id}/period-actions with action REOPEN"
        actor: ProgramAdmin
        preconditions:
          - "status is RECONCILING"
        side_effects:
          - "compensation — append a DepositLedgerEntry with entry_type HANDLING_FEE, amount_cents equal to minus handling_fee_cents, container_count 0, source_kind PROGRAM_ACTION"
          - "compensation — append a DepositLedgerEntry with entry_type UNREDEEMED_SWEEP, amount_cents equal to sweep_to_funding_cents, container_count 0, source_kind PROGRAM_ACTION"
          - "reset handling_fee_cents, gross_unredeemed_cents, admin_shortfall_cents, sweep_to_funding_cents, unredeemed_deposit_cents and funding_balance_cents to 0, funding_status to UNSETTLED and reconciled_at to null"
          - "run calculations.program_deposit_liability to refresh outstanding_liability_cents"
          - "increments ProgramPeriod.version by 1"
        note: "Cycle — a period may be reopened for late corrections and reconciled again."
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /program-periods/{id}/period-actions with action CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "status is RECONCILING"
        side_effects:
          - "increments ProgramPeriod.version by 1"

  - entity: Retailer
    state_field: obligation_status
    initial_state: OBLIGATED
    terminal_states: []
    transitions:
      - from: OBLIGATED
        to: EXEMPT
        trigger: "POST /retailers/{id}/exemption-actions with action CLAIM_EXEMPTION"
        actor: RetailClerk
        preconditions:
          - "obligation_status is OBLIGATED"
          - "calculations.retailer_exemption_distance selects a center whose distance is less than or equal to 3.50 miles"
          - "no RedemptionVisit of this retailer has count_status in {OPEN, COUNTING, JAM_HOLD}"
        side_effects:
          - "set nearest_center_id and nearest_center_distance_miles from the selected center"
          - "set exemption_granted_at to the current logical-clock instant"
          - "increments Retailer.version by 1"
      - from: EXEMPT
        to: OBLIGATED
        trigger: "POST /retailers/{id}/exemption-actions with action REVOKE_EXEMPTION"
        actor: ProgramAdmin
        preconditions:
          - "obligation_status is EXEMPT"
        side_effects:
          - "clear nearest_center_id, nearest_center_distance_miles and exemption_granted_at to null"
          - "increments Retailer.version by 1"
      - from: EXEMPT
        to: OBLIGATED
        trigger: "system — the center named by nearest_center_id moves to CLOSED"
        actor: system
        preconditions:
          - "obligation_status is EXEMPT"
          - "nearest_center_id names the center being closed"
        side_effects:
          - "clear nearest_center_id, nearest_center_distance_miles and exemption_granted_at to null"
          - "increments Retailer.version by 1"
        note: "Cycle — the store may claim a fresh exemption against another qualifying center afterwards."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
#
# Each entry passes the serial-observability filter: a request sent strictly
# after the first one completes sees identical business state and would itself
# legitimately succeed, so only a stale `version` distinguishes the two. All
# other write-write conflicts in this domain are state preconditions and live in
# §1.2 / §1.4 instead.
# =============================================================================
concurrency_rules:

  - rule_id: lot-add-stale-visit
    parent_entity: RedemptionVisit
    write_endpoint: "POST /redemption-visits/{id}/lots"
    occ_field: "expected_visit_version"
    description: |
      Adding a ContainerLot to a RedemptionVisit whose version has advanced
      since the client last read the visit is rejected. Lot addition is
      additive — a second lot for the same label is legitimate product
      behaviour and no state field forbids it — so the only defence against a
      writer working from an outdated view of presented_total,
      out_of_state_marked_total and raw_accepted_count is the stale-version
      check on the visit.
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412

  - rule_id: bagdrop-count-stale
    parent_entity: BagDrop
    write_endpoint: "POST /bag-drops/{id}/count-results"
    occ_field: "expected_bag_drop_version"
    description: |
      Submitting a count result for a BagDrop whose version has advanced since
      the counter last read it is rejected. A recount legitimately replaces the
      previous count result under §1.3 bag_drop_credit_valuation, so a count
      submitted against a superseded view of the bag would silently overwrite a
      newer count; the stale-version check on the bag drop rejects it instead.
    error_id: ERR_STALE_BAG_DROP_VERSION
    http_status: 412

  - rule_id: credit-action-stale-account
    parent_entity: RedeemerAccount
    write_endpoint: "POST /redeemer-accounts/{id}/credit-actions"
    occ_field: "expected_account_version"
    description: |
      Posting a credit action against a RedeemerAccount whose version has
      advanced since the operator last read the balance is rejected. Credit
      movements are additive journal lines that no state field forbids, so an
      operator acting on a superseded credit_balance_cents would post an amount
      derived from a balance the account no longer holds; the stale-version
      check on the account rejects it instead.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: container_coverage_and_deposit
    trigger: "POST /beverage-products/{id}/registration-actions with action SUBMIT (from DRAFT or from REJECTED)"
    algorithm: threshold
    input_set: "the single BeverageProduct named in the path, in registration_state DRAFT or REJECTED"
    formula: |
      COVERED_BEVERAGE_TYPES = {WATER, FLAVORED_WATER, BEER, MALT_BEVERAGE,
                                CARBONATED_SOFT_DRINK, HARD_CIDER, KOMBUCHA,
                                ENERGY_DRINK, RTD_COFFEE_TEA, FRUIT_JUICE}
      COVERED_MATERIALS      = {ALUMINUM, GLASS, PET_PLASTIC, HDPE_PLASTIC}

      # Evaluation order is pinned; the FIRST failing clause writes coverage_reason.
      if beverage_type not in COVERED_BEVERAGE_TYPES:
          coverage_status = NOT_COVERED; coverage_reason = EXCLUDED_BEVERAGE_TYPE
      elif container_material not in COVERED_MATERIALS:
          coverage_status = NOT_COVERED; coverage_reason = EXCLUDED_MATERIAL
      elif fill_volume_ml < MIN_FILL_ML or fill_volume_ml > MAX_FILL_ML:
          coverage_status = NOT_COVERED; coverage_reason = VOLUME_OUT_OF_RANGE
      else:
          coverage_status = COVERED;     coverage_reason = COVERED_STANDARD

      deposit_cents = DEPOSIT_CENTS_STANDARD if coverage_status == COVERED else 0
    constants:
      DEPOSIT_CENTS_STANDARD: 10
      MIN_FILL_ML: 118
      MAX_FILL_ML: 3000
    precision: "integer cents; the volume bounds are inclusive at both ends"

  - name: lot_acceptance_screening
    trigger: "POST /redemption-visits/{id}/lots"
    algorithm: threshold
    input_set: "the single ContainerLot being created, together with the BeverageProduct named by product_id (which must be in registration_state REGISTERED)"
    formula: |
      deposit_cents_per_container = BeverageProduct.deposit_cents      # snapshot

      if BeverageProduct.coverage_status == NOT_COVERED:
          accepted_quantity = 0
          reject_reason     = NOT_COVERED
      else:
          accepted_quantity = presented_quantity
                              - out_of_state_marked_quantity
                              - contaminated_quantity
          if   out_of_state_marked_quantity > 0 and contaminated_quantity > 0:
              reject_reason = MIXED
          elif out_of_state_marked_quantity > 0:
              reject_reason = OUT_OF_STATE
          elif contaminated_quantity > 0:
              reject_reason = CONTAMINATED
          else:
              reject_reason = null

      rejected_quantity  = presented_quantity - accepted_quantity
      deposit_value_cents = accepted_quantity * deposit_cents_per_container
      paid_quantity       = 0
      reconciliation_flag = UNSETTLED
    constants: {}
    precision: "integer containers and integer cents; no rounding occurs"

  - name: visit_payout_valuation
    trigger: "POST /redemption-visits/{id}/close-count"
    algorithm: waterfall_allocation
    input_set: "every ContainerLot whose visit_id equals this visit, ordered by created_at ASC; the RedeemerAccount named by account_id when present; the RedemptionCenter named by center_id for a CENTER visit or the Retailer named by retailer_id for a RETAILER visit"
    formula: |
      raw_accepted_count = sum(lot.accepted_quantity for lot in lots)   # 0 for an empty lot set

      # 1. Per-visit ceiling.
      if site_type == CENTER and channel == MACHINE_COUNT:
          base_limit = RVM_VISIT_LIMIT
      elif site_type == CENTER and channel == HAND_COUNT:
          base_limit = HAND_COUNT_VISIT_LIMIT
      else:                                    # site_type == RETAILER (HAND_COUNT only)
          base_limit = Retailer.daily_limit_containers
      visit_limit_applied = min(base_limit, ANONYMOUS_VISIT_LIMIT) if account_id is null
                            else base_limit

      # 2. Remaining daily allowance (see daily_cap_ledger for the bucket key).
      if account_id is null:
          daily_allowance = raw_accepted_count          # unconstrained
      else:
          cap  = RedemptionCenter.daily_account_cap_containers if site_type == CENTER
                 else PROGRAM_DEFAULT_DAILY_CAP
          used = RedeemerAccount.containers_redeemed_today
                 if RedeemerAccount.redemption_day == visit_date else 0
          daily_allowance = max(0, cap - used)

      # 3. Three-way minimum, then the channel-specific shrink deduction.
      capped_count = min(raw_accepted_count, visit_limit_applied, daily_allowance)
      shrink_adjustment_count = ceil(capped_count * HAND_COUNT_SHRINK_RATE)
                                if channel == HAND_COUNT else 0
      payable_count            = capped_count - shrink_adjustment_count
      refused_over_limit_count = raw_accepted_count - capped_count

      # 4. Waterfall allocation of payable_count across lots, created_at ASC.
      remaining = payable_count
      for lot in lots ordered by created_at ASC:
          lot.paid_quantity = min(lot.accepted_quantity, remaining)
          remaining        -= lot.paid_quantity
          lot.reconciliation_flag = PAID_FULL    if lot.paid_quantity == lot.accepted_quantity
                                                    and lot.accepted_quantity > 0
                                    else UNPAID  if lot.paid_quantity == 0
                                    else PAID_PARTIAL
      payout_cents = sum(lot.paid_quantity * lot.deposit_cents_per_container for lot in lots)

      # 5. Fraud posture.
      out_of_state_ratio = round(out_of_state_marked_total / presented_total, 4)
                           if presented_total > 0 else 0
      if out_of_state_ratio > OUT_OF_STATE_HOLD_RATIO:
          fraud_hold = true; withhold_reason = OUT_OF_STATE_RATIO
          strike RedeemerAccount with OUT_OF_STATE_RATIO
      if account_id is not null and raw_accepted_count > daily_allowance:
          fraud_hold = true; withhold_reason = DAILY_CAP_EXCEEDED
          strike RedeemerAccount with DAILY_CAP_EXCEEDED
      if RedeemerAccount.fraud_strikes reaches FRAUD_STRIKE_LIMIT:
          RedeemerAccount.status = FLAGGED; withhold_reason = ACCOUNT_FLAGGED
    constants:
      RVM_VISIT_LIMIT: 240
      HAND_COUNT_VISIT_LIMIT: 50
      ANONYMOUS_VISIT_LIMIT: 144
      PROGRAM_DEFAULT_DAILY_CAP: 350
      HAND_COUNT_SHRINK_RATE: 0.02
      OUT_OF_STATE_HOLD_RATIO: 0.10
      FRAUD_STRIKE_LIMIT: 2
    precision: "integer containers; the shrink deduction rounds UP (ceil) to the next whole container; out_of_state_ratio is rounded to 4 decimal places, round_half_up, and compared with a strict greater-than"
    variants:
      - name: MACHINE_COUNT
        when: "RedemptionVisit.channel is MACHINE_COUNT"
        difference: "base_limit is RVM_VISIT_LIMIT (240) and shrink_adjustment_count is always 0, so payable_count equals capped_count; raw_accepted_count is also added to ReverseVendingMachine.bin_filled_count"
      - name: HAND_COUNT
        when: "RedemptionVisit.channel is HAND_COUNT"
        difference: "base_limit is HAND_COUNT_VISIT_LIMIT (50) at a center or Retailer.daily_limit_containers at a store, and shrink_adjustment_count is ceil(capped_count * 0.02), so payable_count is strictly below capped_count whenever capped_count >= 1"

  - name: daily_cap_ledger
    trigger: "POST /redemption-visits/{id}/close-count"
    algorithm: aggregation
    input_set: "the RedeemerAccount named by the visit's account_id; skipped entirely when account_id is null"
    formula: |
      if RedeemerAccount.redemption_day != visit_date:
          RedeemerAccount.redemption_day             = visit_date
          RedeemerAccount.containers_redeemed_today  = 0        # bucket reset
      RedeemerAccount.containers_redeemed_today += payable_count
      cap = RedemptionCenter.daily_account_cap_containers if site_type == CENTER
            else PROGRAM_DEFAULT_DAILY_CAP
      RedeemerAccount.cap_reached_today =
          RedeemerAccount.containers_redeemed_today >= cap
    constants:
      PROGRAM_DEFAULT_DAILY_CAP: 350
    precision: "integer containers; cap_reached_today uses a non-strict greater-or-equal comparison"

  - name: machine_session_cooldown
    trigger: "POST /reverse-vending-machines/{id}/machine-events with event_type SESSION_OPEN"
    algorithm: interval_merge
    input_set: "the single ReverseVendingMachine named in the path, using last_session_closed_at and the current logical-clock instant"
    formula: |
      if last_session_closed_at is null:
          cooldown_active = false
      else:
          window_start = last_session_closed_at
          window_end   = last_session_closed_at + MACHINE_COOLDOWN_MINUTES minutes
          cooldown_active = window_start <= now < window_end      # half-open
      if cooldown_active: reject with ERR_MACHINE_COOLDOWN_ACTIVE
    constants:
      MACHINE_COOLDOWN_MINUTES: 5
    precision: "second resolution on the logical clock; the window is closed at its start and open at its end, so a SESSION_OPEN at exactly last_session_closed_at + 5 minutes is accepted"

  - name: bag_drop_credit_valuation
    trigger: "POST /bag-drops (PROVISIONAL variant) and POST /bag-drops/{id}/count-results (FINAL variant)"
    algorithm: aggregation
    input_set: "the single BagDrop; the FINAL variant consumes the counted_quantities array of the most recent accepted count result and ignores any earlier count"
    formula: |
      # PROVISIONAL — at drop time, before any container is counted.
      provisional_units        = min(declared_count, BAG_DROP_PROVISIONAL_CAP)
      provisional_credit_cents = provisional_units * BAG_DROP_PROVISIONAL_RATE_CENTS

      # FINAL — when the plant counter submits counted_quantities.
      counted_lines     = len(counted_quantities)
      counted_total     = sum(counted_quantities)
      gross_final_cents = counted_total * DEPOSIT_CENTS_STANDARD
      final_credit_cents = max(0, gross_final_cents - BAG_DROP_SERVICE_FEE_CENTS)
      adjustment_cents   = final_credit_cents - provisional_credit_cents
      variance_pct  = round((counted_total - declared_count) / declared_count, 4)
      variance_flag = abs(variance_pct) > BAG_DROP_VARIANCE_TOLERANCE
    constants:
      BAG_DROP_PROVISIONAL_RATE_CENTS: 8
      BAG_DROP_PROVISIONAL_CAP: 250
      BAG_DROP_SERVICE_FEE_CENTS: 50
      BAG_DROP_VARIANCE_TOLERANCE: 0.10
      DEPOSIT_CENTS_STANDARD: 10
      DISPUTE_WINDOW_HOURS: 72
    precision: "integer cents; variance_pct is rounded to 4 decimal places, round_half_up, and compared with a strict greater-than on its absolute value"
    variants:
      - name: PROVISIONAL
        when: "POST /bag-drops — the bag has been accepted but not counted"
        difference: "pays BAG_DROP_PROVISIONAL_RATE_CENTS (8) per unit on min(declared_count, 250) units and charges no service fee, so the credit is capped at 2000 cents regardless of declared_count"
      - name: FINAL
        when: "POST /bag-drops/{id}/count-results — the plant counter has counted the bag"
        difference: "pays DEPOSIT_CENTS_STANDARD (10) per actually counted container with no unit cap, then deducts the 50-cent service fee once; the difference against the provisional credit is posted as adjustment_cents"

  - name: material_sale_net_revenue
    trigger: "POST /commodity-batches/{id}/sale"
    algorithm: tiered_pricing
    input_set: "the single CommodityBatch in status BALED, using its stored bale_weights_kg array in the order supplied by the BALE action"
    formula: |
      effective_price_cents_per_tonne =
          quoted_price_cents_per_tonne                                if pricing_mode == SPOT
          else round(quoted_price_cents_per_tonne * (1 - INDEX_DISCOUNT_BPS / 10000))

      # Rounding order is pinned: round EACH bale to the cent, THEN sum.
      gross_revenue_cents = sum(
          round(bale_weight_kg / 1000
                * effective_price_cents_per_tonne
                * (1 - contamination_pct))
          for bale_weight_kg in bale_weights_kg)

      gross_weight_kg  = round(sum(bale_weights_kg), 2)
      freight_cents    = round(gross_weight_kg / 1000 * FREIGHT_CENTS_PER_TONNE)
      net_revenue_cents = max(0, gross_revenue_cents - freight_cents)
    constants:
      FREIGHT_CENTS_PER_TONNE: 4500
      INDEX_DISCOUNT_BPS: 250
    precision: "integer cents, round_half_up at every step; per-bale rounding happens BEFORE summation, which can differ by one cent from rounding the summed product"
    variants:
      - name: SPOT
        when: "CommodityBatch.pricing_mode is SPOT"
        difference: "effective_price_cents_per_tonne equals quoted_price_cents_per_tonne unchanged"
      - name: INDEX
        when: "CommodityBatch.pricing_mode is INDEX"
        difference: "effective_price_cents_per_tonne is the quoted price reduced by 250 basis points (multiplied by 0.9750) and rounded to the nearest cent, which lowers every per-bale figure and therefore gross_revenue_cents"

  - name: period_funding_settlement
    trigger: "POST /program-periods/{id}/period-actions with action RECONCILE"
    algorithm: tiered_pricing
    input_set: "every DepositLedgerEntry whose period_id equals this period, in created_at ASC order; the period's own operating_cost_cents"
    formula: |
      # Steps run in exactly this order; each step consumes the previous outputs.
      # 1
      deposits_initiated_cents   = sum(e.amount_cents for e where entry_type == DEPOSIT_INITIATED)
      containers_initiated_count = sum(e.container_count for e where entry_type == DEPOSIT_INITIATED)
      # 2
      redemptions_paid_cents = -(sum(e.amount_cents for e where entry_type in
                                     {REDEMPTION_PAID, BAG_DROP_CREDIT, REDEMPTION_REVERSED}))
      containers_redeemed_count = sum(e.container_count for e where entry_type in
                                      {REDEMPTION_PAID, BAG_DROP_CREDIT})
                                  - sum(e.container_count for e where entry_type == REDEMPTION_REVERSED)
      # 3
      material_revenue_cents = sum(e.amount_cents for e where entry_type == MATERIAL_REVENUE)
      # 4 — marginal tier walk over containers_redeemed_count
      n = containers_redeemed_count
      handling_fee_cents = min(n, 50000) * HANDLING_TIER1_CENTS
                         + max(0, min(n, 150000) - 50000) * HANDLING_TIER2_CENTS
                         + max(0, n - 150000) * HANDLING_TIER3_CENTS
      # 5
      gross_unredeemed_cents = max(0, deposits_initiated_cents - redemptions_paid_cents)
      # 6
      admin_shortfall_cents  = max(0, operating_cost_cents + handling_fee_cents
                                      - material_revenue_cents)
      # 7
      sweep_to_funding_cents = min(gross_unredeemed_cents, admin_shortfall_cents)
      # 8
      unredeemed_deposit_cents = gross_unredeemed_cents - sweep_to_funding_cents
      # 9
      funding_balance_cents = material_revenue_cents + sweep_to_funding_cents
                              - operating_cost_cents - handling_fee_cents
      # 10
      funding_status = SURPLUS if funding_balance_cents >= 0 else SHORTFALL
    constants:
      HANDLING_TIER1_CENTS: 3
      HANDLING_TIER2_CENTS: 2
      HANDLING_TIER3_CENTS: 1
      HANDLING_TIER1_MAX: 50000
      HANDLING_TIER2_MAX: 150000
    precision: "integer cents throughout; the handling reimbursement is MARGINAL per tier, not an average rate, and funding_status uses a non-strict greater-or-equal comparison at zero"

  - name: program_deposit_liability
    trigger: "every append to DepositLedgerEntry — POST /distributors/{id}/deposit-initiations, POST /redemption-visits/{id}/payout-actions with action PAY or REVERSE, POST /bag-drops/{id}/settlement-actions with action CREDIT, POST /commodity-batches/{id}/sale, and POST /program-periods/{id}/period-actions with action RECONCILE or REOPEN"
    algorithm: projection
    input_set: "every DepositLedgerEntry whose period_id equals the affected period, replayed in created_at ASC order"
    formula: |
      liability = 0
      for e in entries ordered by created_at ASC:
          delta = 0 if e.entry_type in {HANDLING_FEE, MATERIAL_REVENUE} else e.amount_cents
          liability += delta
          e.liability_after_cents = liability
      ProgramPeriod.outstanding_liability_cents = liability
      # The container mass balance must hold after every replay:
      #   containers_initiated_count >= containers_redeemed_count
    constants: {}
    precision: "integer cents; replay is by created_at ASC and never by id"

  - name: retailer_exemption_distance
    trigger: "POST /retailers/{id}/exemption-actions with action CLAIM_EXEMPTION"
    algorithm: threshold
    input_set: "every RedemptionCenter whose status is OPERATIONAL and whose accepts_all_materials is true"
    formula: |
      candidates = [c for c in RedemptionCenter
                    if c.status == OPERATIONAL and c.accepts_all_materials == true]
      if candidates is empty:
          reject with ERR_NO_ELIGIBLE_CENTER
      # rank: distance ASC, then created_at ASC (never id)
      for c in candidates:
          c.distance = round(sqrt((Retailer.x_miles - c.x_miles) ** 2
                                 + (Retailer.y_miles - c.y_miles) ** 2), 2)
      selected = min(candidates, key = (distance, created_at))
      if selected.distance > EXEMPTION_RADIUS_MILES:
          reject with ERR_EXEMPTION_DISTANCE_EXCEEDED
      Retailer.nearest_center_id              = selected.id
      Retailer.nearest_center_distance_miles  = selected.distance
    constants:
      EXEMPTION_RADIUS_MILES: 3.50
    precision: "distances rounded to 2 decimal places, round_half_up, BEFORE the radius comparison; the radius test is non-strict, so exactly 3.50 miles grants the exemption"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
#
# Ordering rationale for this domain: authentication, then authorization and
# ownership, then existence, then request shape, then optimistic-concurrency,
# then state preconditions, then regulatory/safety screening, then temporal
# conflicts, then uniqueness, then referential capacity, and finally the fiscal
# checks (caps, drawer, balances) — money questions are answered last.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role names one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID equals the id of the entity that owns the addressed resource — DistributorAgent equals BeverageProduct.distributor_id or the path Distributor.id, CenterOperator equals the addressed RedemptionCenter.id or the center_id of the addressed visit, machine, bag drop or batch, AccountHolder equals the addressed RedeemerAccount.id or the account_id of the addressed bag drop, RetailClerk equals the addressed Retailer.id or the retailer_id of the addressed visit"
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "every endpoint whose path or body names a Distributor, RedemptionCenter, RedeemerAccount, Retailer, RedemptionVisit, ReverseVendingMachine, BagDrop or CommodityBatch"

  - priority: 5
    category: existence
    check: "every id in the path resolves to a stored row, validated left to right"
    error_id: "ERR_DISTRIBUTOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_BAG_DROP_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row"
    error_id: "ERR_DISTRIBUTOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /beverage-products, POST /distributors/{id}/deposit-initiations, POST /redemption-visits, POST /redemption-visits/{id}/lots, POST /reverse-vending-machines/{id}/machine-events, POST /bag-drops, POST /commodity-batches, POST /commodity-batches/{id}/sale"

  - priority: 7
    category: business_constraint
    check: "every required body field is present, every enum value is a declared member, every integer is within its declared range, every state_code is two uppercase letters, and site_type/channel field pairing rules hold (center_id required and retailer_id absent for CENTER, retailer_id required and center_id absent for RETAILER, machine_id required for MACHINE_COUNT and absent for HAND_COUNT, channel HAND_COUNT forced for site_type RETAILER)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 8
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer greater than or equal to 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET endpoint that returns a list"

  - priority: 9
    category: business_constraint
    check: "out_of_state_marked_quantity plus contaminated_quantity is less than or equal to presented_quantity"
    error_id: ERR_LOT_QUANTITY_INCONSISTENT
    http_status: 422
    applies_to: "POST /redemption-visits/{id}/lots"

  - priority: 10
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version — see §1.2.1"
    error_id: "ERR_STALE_VISIT_VERSION | ERR_STALE_BAG_DROP_VERSION | ERR_STALE_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /redemption-visits/{id}/lots, POST /bag-drops/{id}/count-results, POST /redeemer-accounts/{id}/credit-actions"

  - priority: 11
    category: state
    check: "the RedemptionCenter that owns the addressed resource has status OPERATIONAL"
    error_id: ERR_CENTER_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /redemption-visits (site_type CENTER), POST /redemption-visits/{id}/lots, POST /redemption-visits/{id}/close-count, POST /reverse-vending-machines/{id}/machine-events with event_type SESSION_OPEN, POST /bag-drops, POST /bag-drops/{id}/count-results, POST /commodity-batches"

  - priority: 12
    category: state
    check: "the Retailer named by retailer_id has obligation_status OBLIGATED"
    error_id: ERR_RETAILER_EXEMPT
    http_status: 409
    applies_to: "POST /redemption-visits (site_type RETAILER)"

  - priority: 13
    category: state
    check: "RedemptionVisit.count_status satisfies the §1.2 transition's from state"
    error_id: ERR_INVALID_COUNT_STATE
    http_status: 409
    applies_to: "POST /redemption-visits/{id}/lots, POST /redemption-visits/{id}/close-count"

  - priority: 14
    category: state
    check: "RedemptionVisit.payout_status satisfies the §1.2 transition's from state, and count_status is COUNTED for the APPROVE action; once those hold, APPROVE additionally requires requires_manual_recount false"
    error_id: ERR_INVALID_PAYOUT_STATE | ERR_MANUAL_RECOUNT_REQUIRED
    http_status: 409
    applies_to: "POST /redemption-visits/{id}/payout-actions"

  - priority: 15
    category: state
    check: "BeverageProduct.registration_state satisfies the §1.2 transition's from state for the requested registration action"
    error_id: ERR_INVALID_REGISTRATION_STATE
    http_status: 409
    applies_to: "POST /beverage-products/{id}/registration-actions"

  - priority: 16
    category: state
    check: "ReverseVendingMachine.status satisfies the §1.2 transition's from state for the requested machine event, and the transition's own counter precondition holds — BIN_FULL requires bin_filled_count greater than or equal to bin_capacity_containers"
    error_id: ERR_INVALID_MACHINE_STATE
    http_status: 409
    applies_to: "POST /reverse-vending-machines/{id}/machine-events"

  - priority: 17
    category: state
    check: "BagDrop.status satisfies the §1.2 transition's from state for the requested count result or settlement action"
    error_id: ERR_INVALID_BAG_DROP_STATE
    http_status: 409
    applies_to: "POST /bag-drops/{id}/count-results, POST /bag-drops/{id}/settlement-actions"

  - priority: 18
    category: state
    check: "CommodityBatch.status satisfies the §1.2 transition's from state for the requested processing action or sale"
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409
    applies_to: "POST /commodity-batches/{id}/processing-actions, POST /commodity-batches/{id}/sale"

  - priority: 19
    category: state
    check: "ProgramPeriod.status satisfies the §1.2 transition's from state, and is OPEN for any endpoint that appends a DepositLedgerEntry other than RECONCILE and REOPEN"
    error_id: ERR_INVALID_PERIOD_STATE
    http_status: 409
    applies_to: "POST /program-periods/{id}/period-actions, POST /distributors/{id}/deposit-initiations, POST /commodity-batches/{id}/sale, POST /redemption-visits/{id}/payout-actions"

  - priority: 20
    category: state
    check: "RedemptionCenter.status, RedeemerAccount.status and Retailer.obligation_status each satisfy the §1.2 transition's from state for the requested status change, account action or exemption action"
    error_id: "ERR_INVALID_CENTER_STATE | ERR_INVALID_ACCOUNT_STATE | ERR_INVALID_OBLIGATION_STATE"
    http_status: 409
    applies_to: "POST /redemption-centers/{id}/status-changes, POST /redeemer-accounts/{id}/status-changes, POST /retailers/{id}/exemption-actions"

  - priority: 21
    category: state
    check: "RedeemerAccount.status satisfies the operation — CLOSED accounts accept no operation at all, and FLAGGED accounts accept no new bag drop, credit action or visit"
    error_id: "ERR_ACCOUNT_CLOSED | ERR_ACCOUNT_FLAGGED"
    http_status: 409
    applies_to: "POST /redemption-visits, POST /bag-drops, POST /bag-drops/{id}/settlement-actions, POST /redeemer-accounts/{id}/credit-actions, POST /redeemer-accounts/{id}/status-changes"

  - priority: 22
    category: business_safety
    check: "the BeverageProduct named by product_id has registration_state REGISTERED"
    error_id: ERR_PRODUCT_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /redemption-visits/{id}/lots, POST /distributors/{id}/deposit-initiations"

  - priority: 23
    category: business_safety
    check: "for a CENTER visit, the product's container_material appears in RedemptionCenter.accepted_materials, and for a MACHINE_COUNT visit it also equals ReverseVendingMachine.accepted_material"
    error_id: ERR_MATERIAL_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /redemption-visits/{id}/lots"

  - priority: 24
    category: business_safety
    check: "RedeemerAccount.bag_drop_enrolled is true"
    error_id: ERR_ACCOUNT_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /bag-drops"

  - priority: 25
    category: business_safety
    check: "CommodityBatch.contamination_pct is less than or equal to 0.05"
    error_id: ERR_CONTAMINATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /commodity-batches/{id}/processing-actions with action BALE"

  - priority: 26
    category: business_safety
    check: "Distributor.status is ACTIVE"
    error_id: ERR_DISTRIBUTOR_SUSPENDED
    http_status: 422
    applies_to: "POST /distributors/{id}/deposit-initiations, POST /beverage-products/{id}/registration-actions with action SUBMIT"

  - priority: 27
    category: business_temporal
    check: "the current logical-clock instant is not inside the half-open cooldown window [last_session_closed_at, last_session_closed_at + 5 minutes)"
    error_id: ERR_MACHINE_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /reverse-vending-machines/{id}/machine-events with event_type SESSION_OPEN"

  - priority: 28
    category: business_temporal
    check: "the current logical-clock instant is strictly earlier than BagDrop.dropped_at plus 72 hours"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /bag-drops/{id}/settlement-actions with action DISPUTE"

  - priority: 29
    category: business_temporal
    check: "the requested [start_date, end_date] closed interval shares no date with any existing ProgramPeriod whose status is OPEN, RECONCILING or CLOSED"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /program-periods"

  - priority: 30
    category: business_temporal
    check: "a ProgramPeriod with status OPEN exists whose closed [start_date, end_date] interval contains the relevant date — visit_date for a payout, the date part of settled_at for a bag-drop credit"
    error_id: ERR_NO_OPEN_PERIOD
    http_status: 422
    applies_to: "POST /redemption-visits/{id}/payout-actions with action PAY or REVERSE, POST /bag-drops/{id}/settlement-actions with action CREDIT"

  - priority: 31
    category: business_constraint
    check: "the submitted natural key is unused — Distributor.permit_number, BeverageProduct.upc, ReverseVendingMachine.asset_tag, RedeemerAccount.account_code, BagDrop.tag_code, CommodityBatch.batch_code, ProgramPeriod.quarter_code"
    error_id: "ERR_DUPLICATE_PERMIT_NUMBER | ERR_DUPLICATE_UPC | ERR_DUPLICATE_ASSET_TAG | ERR_DUPLICATE_ACCOUNT_CODE | ERR_DUPLICATE_TAG_CODE | ERR_DUPLICATE_BATCH_CODE | ERR_DUPLICATE_QUARTER_CODE"
    http_status: 409
    applies_to: "POST /distributors, POST /beverage-products, POST /redemption-centers/{id}/machines, POST /redeemer-accounts, POST /bag-drops, POST /commodity-batches, POST /program-periods"

  - priority: 32
    category: business_referential
    check: "container_count is less than or equal to RedemptionCenter.unbatched_container_count"
    error_id: ERR_INSUFFICIENT_UNBATCHED_CONTAINERS
    http_status: 422
    applies_to: "POST /commodity-batches"

  - priority: 33
    category: business_referential
    check: "at least one RedemptionCenter has status OPERATIONAL and accepts_all_materials true"
    error_id: ERR_NO_ELIGIBLE_CENTER
    http_status: 422
    applies_to: "POST /retailers/{id}/exemption-actions with action CLAIM_EXEMPTION"

  - priority: 34
    category: business_referential
    check: "ReverseVendingMachine.center_id equals the visit's center_id, and the machine named by visit_id in a machine event belongs to that visit"
    error_id: ERR_MACHINE_CENTER_MISMATCH
    http_status: 422
    applies_to: "POST /redemption-visits, POST /reverse-vending-machines/{id}/machine-events"

  - priority: 35
    category: business_fiscal
    check: "the visit's RedeemerAccount has not already reached the applicable daily cap for the visit_date — cap_reached_today is false or redemption_day differs from visit_date"
    error_id: ERR_DAILY_CAP_EXHAUSTED
    http_status: 422
    applies_to: "POST /redemption-visits/{id}/lots"

  - priority: 36
    category: business_fiscal
    check: "the center selected by calculations.retailer_exemption_distance is within 3.50 miles"
    error_id: ERR_EXEMPTION_DISTANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /retailers/{id}/exemption-actions with action CLAIM_EXEMPTION"

  - priority: 37
    category: business_fiscal
    check: "RedemptionCenter.cash_drawer_balance_cents is greater than or equal to RedemptionVisit.payout_cents"
    error_id: ERR_INSUFFICIENT_CASH_DRAWER
    http_status: 422
    applies_to: "POST /redemption-visits/{id}/payout-actions with action PAY"

  - priority: 38
    category: business_fiscal
    check: "for a WITHDRAW or CLAWBACK credit action, RedeemerAccount.credit_balance_cents is greater than or equal to the requested amount_cents"
    error_id: ERR_INSUFFICIENT_CREDIT_BALANCE
    http_status: 422
    applies_to: "POST /redeemer-accounts/{id}/credit-actions"

  - priority: 39
    category: business_fiscal
    check: "RedeemerAccount.credit_balance_cents equals 0 and no BagDrop of the account is in status DROPPED, COUNTED or DISPUTED"
    error_id: ERR_ACCOUNT_BALANCE_NONZERO
    http_status: 409
    applies_to: "POST /redeemer-accounts/{id}/status-changes with action CLOSE"

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat topology: every collection sits at the URL root (api_prefix is empty).
# Each entity has a single-resource GET in the `/<segment>/{id}` shape, and
# every FK declared in §1.1 is reverse-reachable either through a sub-resource
# GET or through a filtered list GET.
# =============================================================================
endpoints:

  # --- Distributor ---------------------------------------------------------
  - method: POST
    path: "/distributors"
    description: "Register a beverage distributor or bottler."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, state_code, permit_number, "status?"]
    output: Distributor
    side_effects: ["initialises deposits_initiated_cents and containers_initiated_count to 0"]

  - method: GET
    path: "/distributors/{id}"
    description: "Read one distributor."
    roles: [ProgramAdmin, DistributorAgent]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: POST
    path: "/distributors/{id}/deposit-initiations"
    description: "Initiate deposits for a quantity of a registered label; appends a DEPOSIT_INITIATED ledger line to the named period."
    roles: [DistributorAgent, ProgramAdmin]
    code: 201
    input: [product_id, container_count, period_id]
    output: DepositLedgerEntry
    side_effects:
      - "sets amount_cents to container_count times BeverageProduct.deposit_cents and container_count on the new DepositLedgerEntry"
      - "increases Distributor.deposits_initiated_cents and containers_initiated_count"
      - "runs calculations.program_deposit_liability to refresh ProgramPeriod.deposits_initiated_cents, containers_initiated_count and outstanding_liability_cents"

  - method: GET
    path: "/distributors/{id}/deposit-initiations"
    description: "List the DEPOSIT_INITIATED ledger lines produced by this distributor."
    roles: [ProgramAdmin, DistributorAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: DepositLedgerEntry[]
    side_effects: []

  # --- BeverageProduct -----------------------------------------------------
  - method: POST
    path: "/beverage-products"
    description: "Create a label record in registration_state DRAFT."
    roles: [DistributorAgent, ProgramAdmin]
    code: 201
    input: [distributor_id, brand_name, beverage_type, container_material, fill_volume_ml, upc, label_state_code]
    output: BeverageProduct
    side_effects: ["sets registration_state DRAFT, coverage_status and coverage_reason null-equivalent until SUBMIT, deposit_cents 0"]

  - method: GET
    path: "/beverage-products/{id}"
    description: "Read one label."
    roles: [ProgramAdmin, DistributorAgent, CenterOperator, PlantCounter]
    code: 200
    input: []
    output: BeverageProduct
    side_effects: []

  - method: GET
    path: "/beverage-products"
    description: "List labels, filterable by distributor, upc, registration state and coverage status."
    roles: [ProgramAdmin, DistributorAgent, CenterOperator, PlantCounter]
    code: 200
    input: ["distributor_id?", "upc?", "registration_state?", "coverage_status?", "limit?", "offset?"]
    output: BeverageProduct[]
    side_effects: []

  - method: POST
    path: "/beverage-products/{id}/registration-actions"
    description: "Drive the label registration state machine. action is one of SUBMIT, APPROVE, REJECT, SUSPEND, REINSTATE, WITHDRAW."
    roles: [DistributorAgent, ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: BeverageProduct
    side_effects:
      - "SUBMIT runs calculations.container_coverage_and_deposit and rewrites coverage_status, coverage_reason and deposit_cents"
      - "APPROVE sets registered_at; REJECT and SUSPEND set rejection_reason; WITHDRAW sets deposit_cents to 0"
      - "increments BeverageProduct.version by 1"

  - method: GET
    path: "/beverage-products/{id}/container-lots"
    description: "List every ContainerLot presented for this label."
    roles: [ProgramAdmin, DistributorAgent, CenterOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ContainerLot[]
    side_effects: []

  # --- RedemptionCenter ----------------------------------------------------
  - method: POST
    path: "/redemption-centers"
    description: "Create a redemption center in status PROVISIONAL."
    roles: [ProgramAdmin]
    code: 201
    input: [site_name, x_miles, y_miles, accepted_materials, "accepts_all_materials?", "daily_account_cap_containers?", "opening_cash_cents?"]
    output: RedemptionCenter
    side_effects: ["sets status PROVISIONAL, cash_drawer_balance_cents 0 and every counter field to 0"]

  - method: GET
    path: "/redemption-centers/{id}"
    description: "Read one redemption center."
    roles: [ProgramAdmin, CenterOperator, RetailClerk]
    code: 200
    input: []
    output: RedemptionCenter
    side_effects: []

  - method: GET
    path: "/redemption-centers"
    description: "List redemption centers, filterable by status."
    roles: [ProgramAdmin, CenterOperator, RetailClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RedemptionCenter[]
    side_effects: []

  - method: POST
    path: "/redemption-centers/{id}/status-changes"
    description: "Drive the center state machine. action is one of ACTIVATE, SUSPEND, REINSTATE, CLOSE."
    roles: [ProgramAdmin, CenterOperator]
    code: 200
    input: [action, "reason?"]
    output: RedemptionCenter
    side_effects:
      - "ACTIVATE copies opening_cash_cents into cash_drawer_balance_cents"
      - "SUSPEND sets suspension_reason; REINSTATE clears it"
      - "CLOSE retires every non-RETIRED machine of the center and returns every Retailer exempted against this center to OBLIGATED"
      - "increments RedemptionCenter.version by 1"

  - method: POST
    path: "/redemption-centers/{id}/machines"
    description: "Install a reverse vending machine at the center."
    roles: [ProgramAdmin, CenterOperator]
    code: 201
    input: [asset_tag, accepted_material, "bin_capacity_containers?"]
    output: ReverseVendingMachine
    side_effects:
      - "sets status IDLE, bin_filled_count 0, jam_count_today 0"
      - "recomputes RedemptionCenter.machine_count"
      - "increments RedemptionCenter.version by 1"

  - method: GET
    path: "/redemption-centers/{id}/machines"
    description: "List the machines installed at this center."
    roles: [ProgramAdmin, CenterOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ReverseVendingMachine[]
    side_effects: []

  # --- ReverseVendingMachine ----------------------------------------------
  - method: GET
    path: "/reverse-vending-machines/{id}"
    description: "Read one reverse vending machine."
    roles: [ProgramAdmin, CenterOperator]
    code: 200
    input: []
    output: ReverseVendingMachine
    side_effects: []

  - method: POST
    path: "/reverse-vending-machines/{id}/machine-events"
    description: "Record a machine event. event_type is one of SESSION_OPEN, SESSION_CLOSE, JAM_REPORTED, JAM_CLEARED, BIN_FULL, EMPTY_BIN, TAKE_OUT_OF_SERVICE, RETURN_TO_SERVICE, RETIRE."
    roles: [CenterOperator, ProgramAdmin]
    code: 200
    input: [event_type, "visit_id?", "note?"]
    output: ReverseVendingMachine
    side_effects:
      - "drives state_machines.ReverseVendingMachine, honouring calculations.machine_session_cooldown on SESSION_OPEN"
      - "JAM_REPORTED and JAM_CLEARED cascade onto the RedemptionVisit named by visit_id (count_status COUNTING <-> JAM_HOLD, requires_manual_recount, jam_events_count)"
      - "the fourth JAM_REPORTED of a logical-clock date moves the machine to OUT_OF_SERVICE and can cascade the center to SUSPENDED with suspension_reason MACHINE_FLEET_DOWN"
      - "increments ReverseVendingMachine.version by 1"

  # --- RedeemerAccount -----------------------------------------------------
  - method: POST
    path: "/redeemer-accounts"
    description: "Open a redeemer account."
    roles: [ProgramAdmin, CenterOperator]
    code: 201
    input: [holder_name, account_code, "bag_drop_enrolled?"]
    output: RedeemerAccount
    side_effects: ["sets status ACTIVE, credit_balance_cents 0, fraud_strikes 0"]

  - method: GET
    path: "/redeemer-accounts/{id}"
    description: "Read one redeemer account."
    roles: [ProgramAdmin, CenterOperator, AccountHolder]
    code: 200
    input: []
    output: RedeemerAccount
    side_effects: []

  - method: POST
    path: "/redeemer-accounts/{id}/credit-actions"
    description: "Post a credit journal line. action is one of WITHDRAW, MANUAL_GRANT, CLAWBACK; guarded by OCC rule credit-action-stale-account."
    roles: [CenterOperator, ProgramAdmin]
    code: 201
    input: [action, amount_cents, expected_account_version, "memo?"]
    output: AccountCreditEntry
    side_effects:
      - "appends an AccountCreditEntry with entry_type PAYOUT_WITHDRAWAL for WITHDRAW, MANUAL_GRANT for MANUAL_GRANT, CLAWBACK for CLAWBACK, source_kind PROGRAM_ACTION and source_ref_id equal to the acting X-User-ID"
      - "recomputes RedeemerAccount.credit_balance_cents and writes balance_after_cents on the new line"
      - "increments RedeemerAccount.version by 1"

  - method: POST
    path: "/redeemer-accounts/{id}/status-changes"
    description: "Drive the account state machine. action is one of FLAG, UNFLAG, CLOSE."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: RedeemerAccount
    side_effects:
      - "UNFLAG resets fraud_strikes to 0 and last_strike_reason to null"
      - "CLOSE sets bag_drop_enrolled to false"
      - "increments RedeemerAccount.version by 1"

  - method: GET
    path: "/redeemer-accounts/{id}/credit-entries"
    description: "List the account's credit journal in created_at ASC order."
    roles: [ProgramAdmin, CenterOperator, AccountHolder]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: AccountCreditEntry[]
    side_effects: []

  # --- RedemptionVisit -----------------------------------------------------
  - method: POST
    path: "/redemption-visits"
    description: "Open a redemption visit at a center or at an obligated retailer."
    roles: [CenterOperator, RetailClerk, ProgramAdmin]
    code: 201
    input: [site_type, channel, "center_id?", "retailer_id?", "account_id?", "machine_id?"]
    output: RedemptionVisit
    side_effects:
      - "stamps visit_date from the logical clock and sets count_status OPEN, payout_status PENDING"

  - method: GET
    path: "/redemption-visits/{id}"
    description: "Read one redemption visit."
    roles: [ProgramAdmin, CenterOperator, RetailClerk, AccountHolder]
    code: 200
    input: []
    output: RedemptionVisit
    side_effects: []

  - method: GET
    path: "/redemption-visits"
    description: "List redemption visits, filterable by center, retailer, account, machine, state and date."
    roles: [ProgramAdmin, CenterOperator, RetailClerk, AccountHolder]
    code: 200
    input: ["center_id?", "retailer_id?", "account_id?", "machine_id?", "count_status?", "payout_status?", "visit_date?", "limit?", "offset?"]
    output: RedemptionVisit[]
    side_effects: []

  - method: POST
    path: "/redemption-visits/{id}/lots"
    description: "Add a container lot to an open visit; guarded by OCC rule lot-add-stale-visit."
    roles: [CenterOperator, RetailClerk, ProgramAdmin]
    code: 201
    input: [product_id, presented_quantity, expected_visit_version, "out_of_state_marked_quantity?", "contaminated_quantity?"]
    output: ContainerLot
    side_effects:
      - "runs calculations.lot_acceptance_screening to set accepted_quantity, rejected_quantity, reject_reason, deposit_cents_per_container and deposit_value_cents"
      - "moves RedemptionVisit.count_status from OPEN to COUNTING on the first lot"
      - "recomputes RedemptionVisit.presented_total, out_of_state_marked_total, raw_accepted_count and out_of_state_ratio"
      - "increments RedemptionVisit.version by 1"

  - method: GET
    path: "/redemption-visits/{id}/lots"
    description: "List the container lots of this visit in created_at ASC order."
    roles: [ProgramAdmin, CenterOperator, RetailClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ContainerLot[]
    side_effects: []

  - method: POST
    path: "/redemption-visits/{id}/close-count"
    description: "Close counting and value the visit."
    roles: [CenterOperator, RetailClerk, ProgramAdmin]
    code: 200
    input: []
    output: RedemptionVisit
    side_effects:
      - "moves count_status to COUNTED and stamps counted_at"
      - "runs calculations.visit_payout_valuation and calculations.daily_cap_ledger"
      - "allocates payable_count across the visit's lots in created_at ASC order, writing paid_quantity and reconciliation_flag"
      - "may set fraud_hold, move payout_status to WITHHELD, strike the RedeemerAccount and move it to FLAGGED"
      - "adds raw_accepted_count to ReverseVendingMachine.bin_filled_count for MACHINE_COUNT visits"
      - "recomputes RedemptionCenter.accepted_container_count and unbatched_container_count"
      - "increments RedemptionVisit.version by 1"

  - method: POST
    path: "/redemption-visits/{id}/payout-actions"
    description: "Drive the payout dimension. action is one of APPROVE, PAY, REVERSE, RELEASE_HOLD, WITHHOLD."
    roles: [CenterOperator, RetailClerk, ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: RedemptionVisit
    side_effects:
      - "PAY stamps paid_at, debits RedemptionCenter.cash_drawer_balance_cents and appends a REDEMPTION_PAID DepositLedgerEntry"
      - "REVERSE restores the drawer, appends a REDEMPTION_REVERSED DepositLedgerEntry, resets every lot to paid_quantity 0 and reconciliation_flag UNPAID and rolls RedeemerAccount.containers_redeemed_today back"
      - "runs calculations.program_deposit_liability on PAY and REVERSE"
      - "increments RedemptionVisit.version by 1"

  # --- BagDrop -------------------------------------------------------------
  - method: POST
    path: "/bag-drops"
    description: "Accept a drop bag and post the provisional credit."
    roles: [CenterOperator, ProgramAdmin]
    code: 201
    input: [account_id, center_id, tag_code, declared_count]
    output: BagDrop
    side_effects:
      - "stamps dropped_at from the logical clock and sets status DROPPED"
      - "runs the PROVISIONAL variant of calculations.bag_drop_credit_valuation to set provisional_units and provisional_credit_cents"
      - "appends an AccountCreditEntry with entry_type PROVISIONAL, source_kind BAG_DROP and source_ref_id equal to the new bag drop id, then recomputes RedeemerAccount.credit_balance_cents"

  - method: GET
    path: "/bag-drops/{id}"
    description: "Read one bag drop."
    roles: [ProgramAdmin, CenterOperator, PlantCounter, AccountHolder]
    code: 200
    input: []
    output: BagDrop
    side_effects: []

  - method: GET
    path: "/bag-drops"
    description: "List bag drops, filterable by account, center and status."
    roles: [ProgramAdmin, CenterOperator, PlantCounter, AccountHolder]
    code: 200
    input: ["account_id?", "center_id?", "status?", "limit?", "offset?"]
    output: BagDrop[]
    side_effects: []

  - method: POST
    path: "/bag-drops/{id}/count-results"
    description: "Submit the plant count for a dropped or disputed bag; guarded by OCC rule bagdrop-count-stale."
    roles: [PlantCounter, ProgramAdmin]
    code: 200
    input: [counted_quantities, expected_bag_drop_version]
    output: BagDrop
    side_effects:
      - "runs the FINAL variant of calculations.bag_drop_credit_valuation to set counted_lines, counted_total, gross_final_cents, final_credit_cents, adjustment_cents, variance_pct and variance_flag"
      - "moves status to COUNTED"
      - "a true variance_flag strikes the RedeemerAccount with last_strike_reason BAG_DROP_VARIANCE and can move it to FLAGGED"
      - "increments BagDrop.version by 1"

  - method: POST
    path: "/bag-drops/{id}/settlement-actions"
    description: "Drive the bag-drop state machine. action is one of CREDIT, DISPUTE, VOID."
    roles: [CenterOperator, AccountHolder, ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: BagDrop
    side_effects:
      - "CREDIT stamps settled_at, appends an ADJUSTMENT AccountCreditEntry for adjustment_cents, appends a BAG_DROP_CREDIT DepositLedgerEntry and runs calculations.program_deposit_liability"
      - "DISPUTE increments recount_count"
      - "VOID appends a CLAWBACK AccountCreditEntry reversing provisional_credit_cents"
      - "increments BagDrop.version by 1"

  # --- CommodityBatch ------------------------------------------------------
  - method: POST
    path: "/commodity-batches"
    description: "Draw accepted containers from a center's unbatched pool into a new commodity batch."
    roles: [PlantCounter, CenterOperator, ProgramAdmin]
    code: 201
    input: [center_id, material, batch_code, container_count]
    output: CommodityBatch
    side_effects:
      - "sets status ACCUMULATING"
      - "increases RedemptionCenter.batched_container_count and decreases unbatched_container_count by container_count"

  - method: GET
    path: "/commodity-batches/{id}"
    description: "Read one commodity batch."
    roles: [ProgramAdmin, CenterOperator, PlantCounter]
    code: 200
    input: []
    output: CommodityBatch
    side_effects: []

  - method: GET
    path: "/commodity-batches"
    description: "List commodity batches, filterable by center, material and status."
    roles: [ProgramAdmin, CenterOperator, PlantCounter]
    code: 200
    input: ["center_id?", "material?", "status?", "limit?", "offset?"]
    output: CommodityBatch[]
    side_effects: []

  - method: POST
    path: "/commodity-batches/{id}/processing-actions"
    description: "Drive plant processing. action is SORT (requires contamination_pct) or BALE (requires bale_weights_kg)."
    roles: [PlantCounter, ProgramAdmin]
    code: 200
    input: [action, "contamination_pct?", "bale_weights_kg?"]
    output: CommodityBatch
    side_effects:
      - "SORT stores contamination_pct and moves status to SORTED"
      - "BALE stores bale_weights_kg, sets bale_count and gross_weight_kg and moves status to BALED"
      - "increments CommodityBatch.version by 1"

  - method: POST
    path: "/commodity-batches/{id}/sale"
    description: "Sell a baled batch to a mill and book the material revenue into a period."
    roles: [CenterOperator, ProgramAdmin]
    code: 200
    input: [pricing_mode, quoted_price_cents_per_tonne, period_id]
    output: CommodityBatch
    side_effects:
      - "runs calculations.material_sale_net_revenue to set effective_price_cents_per_tonne, gross_revenue_cents, freight_cents and net_revenue_cents"
      - "moves status to SOLD and stamps sold_at"
      - "appends a MATERIAL_REVENUE DepositLedgerEntry and runs calculations.program_deposit_liability"
      - "increments CommodityBatch.version by 1"

  # --- Retailer ------------------------------------------------------------
  - method: POST
    path: "/retailers"
    description: "Register a retail store with a redemption obligation."
    roles: [ProgramAdmin]
    code: 201
    input: [store_name, x_miles, y_miles, store_area_sqft]
    output: Retailer
    side_effects: ["sets obligation_status OBLIGATED and derives daily_limit_containers from store_area_sqft (50 at or above 5000 square feet, otherwise 24)"]

  - method: GET
    path: "/retailers/{id}"
    description: "Read one retailer."
    roles: [ProgramAdmin, RetailClerk]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  - method: GET
    path: "/retailers"
    description: "List retailers, filterable by obligation status and by the center that grants their exemption."
    roles: [ProgramAdmin, RetailClerk]
    code: 200
    input: ["obligation_status?", "nearest_center_id?", "limit?", "offset?"]
    output: Retailer[]
    side_effects: []

  - method: POST
    path: "/retailers/{id}/exemption-actions"
    description: "Drive the retailer obligation state machine. action is CLAIM_EXEMPTION or REVOKE_EXEMPTION."
    roles: [RetailClerk, ProgramAdmin]
    code: 200
    input: [action]
    output: Retailer
    side_effects:
      - "CLAIM_EXEMPTION runs calculations.retailer_exemption_distance and writes nearest_center_id, nearest_center_distance_miles and exemption_granted_at"
      - "REVOKE_EXEMPTION clears all three fields"
      - "increments Retailer.version by 1"

  # --- ProgramPeriod -------------------------------------------------------
  - method: POST
    path: "/program-periods"
    description: "Open a reporting quarter."
    roles: [ProgramAdmin]
    code: 201
    input: [quarter_code, start_date, end_date, "operating_cost_cents?"]
    output: ProgramPeriod
    side_effects: ["sets status OPEN, funding_status UNSETTLED and every money field to 0"]

  - method: GET
    path: "/program-periods/{id}"
    description: "Read one reporting quarter."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramPeriod
    side_effects: []

  - method: GET
    path: "/program-periods"
    description: "List reporting quarters, filterable by status."
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProgramPeriod[]
    side_effects: []

  - method: POST
    path: "/program-periods/{id}/period-actions"
    description: "Drive the period state machine. action is one of RECONCILE, CLOSE, REOPEN."
    roles: [ProgramAdmin]
    code: 200
    input: [action]
    output: ProgramPeriod
    side_effects:
      - "RECONCILE runs calculations.period_funding_settlement, appends HANDLING_FEE and UNREDEEMED_SWEEP ledger lines and stamps reconciled_at"
      - "REOPEN appends the two compensating ledger lines and resets every settlement field to 0 with funding_status UNSETTLED"
      - "runs calculations.program_deposit_liability after either action"
      - "increments ProgramPeriod.version by 1"

  - method: GET
    path: "/program-periods/{id}/ledger-entries"
    description: "List the period's deposit ledger in created_at ASC order."
    roles: [ProgramAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: DepositLedgerEntry[]
    side_effects: []

  # --- Test-driving surface (§1.5 priority ladder rung 3) -------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["every subsequent timestamp, visit_date, cooldown window and dispute window is evaluated against the new logical instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_FORBIDDEN_RESOURCE
    http: 403
    condition: "an entity_backed role acts on a resource owned by a different instance of its backing entity"

  # --- existence -----------------------------------------------------------
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "no Distributor exists for the supplied path id or distributor_id"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "no BeverageProduct exists for the supplied path id or product_id"
  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "no RedemptionCenter exists for the supplied path id or center_id"
  - id: ERR_MACHINE_NOT_FOUND
    http: 404
    condition: "no ReverseVendingMachine exists for the supplied path id or machine_id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no RedeemerAccount exists for the supplied path id or account_id"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "no RedemptionVisit exists for the supplied path id or visit_id"
  - id: ERR_BAG_DROP_NOT_FOUND
    http: 404
    condition: "no BagDrop exists for the supplied path id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no CommodityBatch exists for the supplied path id"
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "no Retailer exists for the supplied path id or retailer_id"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "no ProgramPeriod exists for the supplied path id or period_id"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required body field missing, enum value not a declared member, integer out of range, malformed date, or a site_type/channel field-pairing rule violated (validation priority 7)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative (validation priority 8)"
  - id: ERR_LOT_QUANTITY_INCONSISTENT
    http: 422
    condition: "out_of_state_marked_quantity plus contaminated_quantity exceeds presented_quantity (validation priority 9)"

  # --- optimistic concurrency (§1.2.1) -------------------------------------
  - id: ERR_STALE_VISIT_VERSION
    http: 412
    condition: "expected_visit_version does not equal the current RedemptionVisit.version"
  - id: ERR_STALE_BAG_DROP_VERSION
    http: 412
    condition: "expected_bag_drop_version does not equal the current BagDrop.version"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal the current RedeemerAccount.version"

  # --- state preconditions -------------------------------------------------
  - id: ERR_CENTER_NOT_OPERATIONAL
    http: 409
    condition: "the RedemptionCenter owning the addressed resource is not in status OPERATIONAL (validation priority 11)"
  - id: ERR_RETAILER_EXEMPT
    http: 409
    condition: "a RETAILER visit is opened at a store whose obligation_status is EXEMPT (validation priority 12)"
  - id: ERR_INVALID_CENTER_STATE
    http: 409
    condition: "the requested RedemptionCenter status-change action is not declared from the center's current status (validation priority 20)"
  - id: ERR_INVALID_ACCOUNT_STATE
    http: 409
    condition: "the requested RedeemerAccount status action is not declared from the account's current status — for example CLOSE on a CLOSED account or FLAG on a FLAGGED account (validation priority 20)"
  - id: ERR_INVALID_OBLIGATION_STATE
    http: 409
    condition: "the requested Retailer exemption action is not declared from the store's current obligation_status — CLAIM_EXEMPTION on an EXEMPT store or REVOKE_EXEMPTION on an OBLIGATED store (validation priority 20)"
  - id: ERR_INVALID_COUNT_STATE
    http: 409
    condition: "RedemptionVisit.count_status does not match the requested transition's from state — for example adding a lot to a COUNTED visit or closing a JAM_HOLD visit"
  - id: ERR_INVALID_PAYOUT_STATE
    http: 409
    condition: "RedemptionVisit.payout_status does not match the requested payout action's from state, or APPROVE is requested while count_status is not COUNTED"
  - id: ERR_MANUAL_RECOUNT_REQUIRED
    http: 409
    condition: "APPROVE is requested on a visit whose payout_status is PENDING and count_status is COUNTED but whose requires_manual_recount is true (validation priority 14, checked after ERR_INVALID_PAYOUT_STATE)"
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "BeverageProduct.registration_state does not match the requested registration action's from state"
  - id: ERR_PRODUCT_NOT_COVERED
    http: 409
    condition: "APPROVE is requested on a label whose coverage_status is NOT_COVERED (state_machines.BeverageProduct SUBMITTED_to_REGISTERED precondition)"
  - id: ERR_INVALID_MACHINE_STATE
    http: 409
    condition: "ReverseVendingMachine.status does not match the requested machine event's from state, or the event's counter precondition is unsatisfied — BIN_FULL while bin_filled_count is strictly below bin_capacity_containers (validation priority 16)"
  - id: ERR_INVALID_BAG_DROP_STATE
    http: 409
    condition: "BagDrop.status does not match the requested count result or settlement action's from state"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "CommodityBatch.status does not match the requested processing action or sale's from state"
  - id: ERR_INVALID_PERIOD_STATE
    http: 409
    condition: "ProgramPeriod.status does not match the requested period action's from state, or a ledger-appending endpoint targets a period that is not OPEN"
  - id: ERR_PERIOD_HAS_OPEN_VISITS
    http: 409
    condition: "RECONCILE is requested while some RedemptionVisit inside the period's date range still has count_status OPEN, COUNTING or JAM_HOLD"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "the addressed RedeemerAccount has status CLOSED"
  - id: ERR_ACCOUNT_FLAGGED
    http: 409
    condition: "a new visit, bag drop or credit action targets a RedeemerAccount whose status is FLAGGED"
  - id: ERR_CENTER_HAS_NO_MACHINE
    http: 409
    condition: "ACTIVATE is requested on a center whose machine_count is 0 (state_machines.RedemptionCenter PROVISIONAL_to_OPERATIONAL precondition)"
  - id: ERR_MACHINE_FLEET_DOWN
    http: 409
    condition: "REINSTATE is requested while out_of_service_machine_count still equals machine_count (state_machines.RedemptionCenter SUSPENDED_to_OPERATIONAL precondition)"
  - id: ERR_CENTER_HAS_OPEN_VISITS
    http: 409
    condition: "CLOSE is requested on a center that still has a RedemptionVisit in count_status OPEN, COUNTING or JAM_HOLD"
  - id: ERR_RETAILER_HAS_OPEN_VISITS
    http: 409
    condition: "CLAIM_EXEMPTION is requested while the store still has a RedemptionVisit in count_status OPEN, COUNTING or JAM_HOLD"

  # --- safety / compliance -------------------------------------------------
  - id: ERR_PRODUCT_NOT_REGISTERED
    http: 422
    condition: "the referenced BeverageProduct is not in registration_state REGISTERED (validation priority 22)"
  - id: ERR_MATERIAL_NOT_ACCEPTED
    http: 422
    condition: "the lot's container_material is absent from RedemptionCenter.accepted_materials, or differs from ReverseVendingMachine.accepted_material on a MACHINE_COUNT visit (validation priority 23)"
  - id: ERR_ACCOUNT_NOT_ENROLLED
    http: 422
    condition: "a bag drop is accepted for an account whose bag_drop_enrolled is false (validation priority 24)"
  - id: ERR_CONTAMINATION_LIMIT_EXCEEDED
    http: 422
    condition: "BALE is requested on a batch whose contamination_pct is strictly greater than 0.05 (validation priority 25)"
  - id: ERR_DISTRIBUTOR_SUSPENDED
    http: 422
    condition: "the owning Distributor has status SUSPENDED (validation priority 26)"

  # --- temporal ------------------------------------------------------------
  - id: ERR_MACHINE_COOLDOWN_ACTIVE
    http: 409
    condition: "SESSION_OPEN falls inside the half-open window [last_session_closed_at, last_session_closed_at + 5 minutes) (validation priority 27)"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "DISPUTE is requested at or after dropped_at plus 72 hours (validation priority 28)"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "the requested closed date interval shares at least one date with an existing ProgramPeriod (validation priority 29)"
  - id: ERR_NO_OPEN_PERIOD
    http: 422
    condition: "no ProgramPeriod with status OPEN contains the relevant date (validation priority 30)"

  # --- uniqueness ----------------------------------------------------------
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "another Distributor already uses the submitted permit_number"
  - id: ERR_DUPLICATE_UPC
    http: 409
    condition: "another BeverageProduct already uses the submitted upc"
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: "another ReverseVendingMachine already uses the submitted asset_tag"
  - id: ERR_DUPLICATE_ACCOUNT_CODE
    http: 409
    condition: "another RedeemerAccount already uses the submitted account_code"
  - id: ERR_DUPLICATE_TAG_CODE
    http: 409
    condition: "another BagDrop already uses the submitted tag_code"
  - id: ERR_DUPLICATE_BATCH_CODE
    http: 409
    condition: "another CommodityBatch already uses the submitted batch_code"
  - id: ERR_DUPLICATE_QUARTER_CODE
    http: 409
    condition: "another ProgramPeriod already uses the submitted quarter_code"

  # --- referential capacity ------------------------------------------------
  - id: ERR_INSUFFICIENT_UNBATCHED_CONTAINERS
    http: 422
    condition: "container_count exceeds RedemptionCenter.unbatched_container_count (validation priority 32)"
  - id: ERR_NO_ELIGIBLE_CENTER
    http: 422
    condition: "no RedemptionCenter has status OPERATIONAL together with accepts_all_materials true (validation priority 33)"
  - id: ERR_MACHINE_CENTER_MISMATCH
    http: 422
    condition: "the machine named by machine_id belongs to a different center than the visit, or the visit named by visit_id in a machine event is not the visit occupying that machine (validation priority 34)"

  # --- fiscal --------------------------------------------------------------
  - id: ERR_DAILY_CAP_EXHAUSTED
    http: 422
    condition: "the visit's account has already reached the applicable daily cap for visit_date (validation priority 35)"
  - id: ERR_EXEMPTION_DISTANCE_EXCEEDED
    http: 422
    condition: "the nearest qualifying center is farther than 3.50 miles (validation priority 36)"
  - id: ERR_INSUFFICIENT_CASH_DRAWER
    http: 422
    condition: "RedemptionCenter.cash_drawer_balance_cents is below the visit's payout_cents (validation priority 37)"
  - id: ERR_INSUFFICIENT_CREDIT_BALANCE
    http: 422
    condition: "a WITHDRAW or CLAWBACK exceeds RedeemerAccount.credit_balance_cents (validation priority 38)"
  - id: ERR_ACCOUNT_BALANCE_NONZERO
    http: 409
    condition: "CLOSE is requested while credit_balance_cents is non-zero or an unsettled bag drop remains (validation priority 39)"

# =============================================================================
# §1.7 RBAC Matrix
#
# Role model: peer_roles. Each entity_backed role owns exactly one slice of the
# graph and cannot reach another instance's resources (validation priority 4).
# =============================================================================
roles:

  - name: ProgramAdmin
    description: "Cooperative program staff — registers distributors, centers, retailers and reporting periods, approves labels, releases holds, reverses payouts, reconciles periods and sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /distributors"
      - "POST /redemption-centers"
      - "POST /retailers"
      - "POST /program-periods"
      - "POST /program-periods/{id}/period-actions"
      - "GET /program-periods/{id}"
      - "GET /program-periods"
      - "GET /program-periods/{id}/ledger-entries"
      - "POST /redeemer-accounts/{id}/status-changes"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /beverage-products"
      - "POST /beverage-products/{id}/registration-actions"
      - "POST /distributors/{id}/deposit-initiations"
      - "POST /redemption-centers/{id}/status-changes"
      - "POST /redemption-centers/{id}/machines"
      - "POST /reverse-vending-machines/{id}/machine-events"
      - "POST /redeemer-accounts"
      - "POST /redeemer-accounts/{id}/credit-actions"
      - "POST /redemption-visits"
      - "POST /redemption-visits/{id}/lots"
      - "POST /redemption-visits/{id}/close-count"
      - "POST /redemption-visits/{id}/payout-actions"
      - "POST /bag-drops"
      - "POST /bag-drops/{id}/count-results"
      - "POST /bag-drops/{id}/settlement-actions"
      - "POST /commodity-batches"
      - "POST /commodity-batches/{id}/processing-actions"
      - "POST /commodity-batches/{id}/sale"
      - "POST /retailers/{id}/exemption-actions"
      - "every GET endpoint"
    note: "RELEASE_HOLD, REVERSE, REJECT, APPROVE, SUSPEND, REINSTATE, WITHDRAW, VOID, FLAG, UNFLAG and CLOSE actions are reachable only through this role even where the endpoint itself is shared."

  - name: DistributorAgent
    description: "Staff of one beverage distributor — registers its own labels and initiates deposits for them."
    identity: "entity_backed:Distributor"
    exclusive_operations: []
    shared_operations:
      - "POST /beverage-products"
      - "POST /beverage-products/{id}/registration-actions"
      - "POST /distributors/{id}/deposit-initiations"
      - "GET /distributors/{id}"
      - "GET /distributors/{id}/deposit-initiations"
      - "GET /beverage-products/{id}"
      - "GET /beverage-products"
      - "GET /beverage-products/{id}/container-lots"
    note: "X-User-ID must equal the Distributor.id that owns the addressed label or path distributor."

  - name: CenterOperator
    description: "Staff of one redemption center — runs machines, opens and closes visits, pays redemptions, accepts drop bags and sells batches."
    identity: "entity_backed:RedemptionCenter"
    exclusive_operations: []
    shared_operations:
      - "POST /redemption-centers/{id}/status-changes"
      - "POST /redemption-centers/{id}/machines"
      - "POST /reverse-vending-machines/{id}/machine-events"
      - "POST /redeemer-accounts"
      - "POST /redeemer-accounts/{id}/credit-actions"
      - "POST /redemption-visits"
      - "POST /redemption-visits/{id}/lots"
      - "POST /redemption-visits/{id}/close-count"
      - "POST /redemption-visits/{id}/payout-actions"
      - "POST /bag-drops"
      - "POST /bag-drops/{id}/settlement-actions"
      - "POST /commodity-batches"
      - "POST /commodity-batches/{id}/sale"
      - "GET /redemption-centers/{id}"
      - "GET /redemption-centers"
      - "GET /redemption-centers/{id}/machines"
      - "GET /reverse-vending-machines/{id}"
      - "GET /redemption-visits/{id}"
      - "GET /redemption-visits"
      - "GET /redemption-visits/{id}/lots"
      - "GET /redeemer-accounts/{id}"
      - "GET /redeemer-accounts/{id}/credit-entries"
      - "GET /bag-drops/{id}"
      - "GET /bag-drops"
      - "GET /commodity-batches/{id}"
      - "GET /commodity-batches"
      - "GET /beverage-products/{id}"
      - "GET /beverage-products"
      - "GET /beverage-products/{id}/container-lots"
    note: "X-User-ID must equal the RedemptionCenter.id that owns the addressed machine, visit, bag drop or batch. Only the SUSPEND action of POST /redemption-centers/{id}/status-changes is available to this role."

  - name: PlantCounter
    description: "Central plant counting and sorting staff — counts drop bags and sorts and bales commodity batches; not tied to any single center."
    identity: "opaque"
    exclusive_operations:
      - "POST /bag-drops/{id}/count-results"
      - "POST /commodity-batches/{id}/processing-actions"
    shared_operations:
      - "POST /commodity-batches"
      - "GET /bag-drops/{id}"
      - "GET /bag-drops"
      - "GET /commodity-batches/{id}"
      - "GET /commodity-batches"
      - "GET /beverage-products/{id}"
      - "GET /beverage-products"

  - name: AccountHolder
    description: "A registered redeemer — reads their own account and visits and disputes their own bag-drop counts."
    identity: "entity_backed:RedeemerAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /bag-drops/{id}/settlement-actions"
      - "GET /redeemer-accounts/{id}"
      - "GET /redeemer-accounts/{id}/credit-entries"
      - "GET /redemption-visits/{id}"
      - "GET /redemption-visits"
      - "GET /bag-drops/{id}"
      - "GET /bag-drops"
    note: "X-User-ID must equal the RedeemerAccount.id of the addressed account or of the addressed bag drop's account_id. Only the DISPUTE action of POST /bag-drops/{id}/settlement-actions is available to this role."

  - name: RetailClerk
    description: "Staff of one obligated retail store — runs hand-count redemptions at the store and claims a nearby-center exemption."
    identity: "entity_backed:Retailer"
    exclusive_operations: []
    shared_operations:
      - "POST /redemption-visits"
      - "POST /redemption-visits/{id}/lots"
      - "POST /redemption-visits/{id}/close-count"
      - "POST /redemption-visits/{id}/payout-actions"
      - "POST /retailers/{id}/exemption-actions"
      - "GET /retailers/{id}"
      - "GET /retailers"
      - "GET /redemption-centers/{id}"
      - "GET /redemption-centers"
      - "GET /redemption-visits/{id}"
      - "GET /redemption-visits"
      - "GET /redemption-visits/{id}/lots"
    note: "X-User-ID must equal the Retailer.id of the addressed store or of the addressed visit's retailer_id. Only the CLAIM_EXEMPTION action of POST /retailers/{id}/exemption-actions is available to this role."
