              payload: {}
              as: VendorUnitAnalyst
          assert:
            - "4999999: the call returns HTTP 422 with error_id == ERR_NO_PEER_GROUP_MATCH, and Vendor.${v_lo_minus}.authorization_status is still APPLICANT with peer_group_id == null"
            - "5000000: the call returns HTTP 200, Vendor.${v_lo}.peer_group_id == ${pg_a} and authorization_status == IN_REVIEW — the lower bound is inclusive"
            - "20000000: the call returns HTTP 200 and Vendor.${v_hi}.peer_group_id == ${pg_a}, NOT ${pg_b} — the upper bound is inclusive and the band_width tie-break picks 20000000 - 5000000 == 15000000 over 40000000 - 20000000 == 20000000"
            - "20000001: the call returns HTTP 200 and Vendor.${v_hi_plus}.peer_group_id == ${pg_b} — one cent past PG-SUPER-A's inclusive upper bound only PG-SUPER-B remains eligible"
            - "PeerGroup.${pg_a}.member_count == 0 and PeerGroup.${pg_b}.member_count == 0: assignment at submit-application does not make a vendor a counted member"

      - name: claim_line_at_exactly_the_ceiling_is_accepted_not_reduced
        grounds:
          - calculations.claim_line_edit_adjudication
          - calculations.adjustment_proration
          - entities.ClaimLine.fields.edit_code
        distinguishing_aspect: |
          Two distinct precision boundaries on one claim: the edit comparison is
          strict (`charged > mar` reduces, `charged == mar` accepts at full price),
          and the proration rounds per line before summing, so three lines at rate
          0.005 recoup 6 cents while rounding the total once would yield 5.
        test_recipe:
          setup:
            - "Chain A: clock 2026-08-01T00:00:00Z, PG-SUPER-A, MILK category, ITEM_MILK upc 00011122233, cycle 2026Q3 over [2026-08-01, 2026-09-01), vendor Alpha Market AUTHORIZED with an ACCEPTED milk submission of 320"
