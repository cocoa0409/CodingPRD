      - name: window_completion_cascades_to_zone_occupancy_and_only_that_zones_artifacts
        grounds:
          - state_machines.InstallWindow.IN_PROGRESS_to_COMPLETED
          - state_machines.Artifact.RESERVED_to_PLACED
          - state_machines.ArtifactCase.mount_status.MOUNT_FABRICATED_to_MOUNT_INSTALLED
          - validations.priority_78
          - entities.GalleryZone.fields.occupancy_state
        distinguishing_aspect: |
          Completing one install window promotes artifacts that are two hops
          away from it (window -> zone -> cases in that zone -> artifacts
          reserved into those cases), and the promotion is scoped by zone: an
          artifact reserved into a case in a different zone must stay RESERVED
          even though it belongs to the same project and the same phase. The
          same completion is also GUARDED by state two hops away in the other
          direction - it is refused while any case in the zone that holds a
          reserved object still has mount_status != MOUNT_INSTALLED. So the
          same request fails and then succeeds with no change to the window
          itself, only to a case two hops away. Promotion order is pinned to
          ascending Artifact.created_at so multi-object cases are deterministic.
        test_recipe:
