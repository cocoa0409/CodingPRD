            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T2", original_principal_cents: 500000000, interest_rate_bps: 600, day_count_convention: "THIRTY_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t2: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-D", legal_name: "Holder D", contact_email: "d@x.com" }, as: PlatformAdmin, captures: { nhd: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-E", legal_name: "Holder E", contact_email: "e@x.com" }, as: PlatformAdmin, captures: { nhe: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t2}", noteholder_account_id: "${nhd}", original_principal_cents: 300000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t2}", noteholder_account_id: "${nhe}", original_principal_cents: 200000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t2}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 15000000 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer }
            - { call: "GET /distribution-records?payment_run_id=${run}", payload: {}, as: TrustOfficer }
          assert:
            - "allocations in position-creation order are [9000000, 6000000]"
            - "PaymentRun.${run}.gross_amount_cents == 15000000"

      - name: pro_rata_remainder_tiebreak_by_created_at
        claim_type: constants_applied
        grounds: ["calculations.pro_rata_allocation"]
        distinguishing_aspect: "Equal principals 50000/50000 with target 9999 produce identical floors 4999 and identical fractions 0.5; the single remainder cent goes to the position with earlier created_at (Q1) — never to an id-based tie-break."
        test_recipe:
          setup: ["active indenture; tranche original 100000 with positions Q1 50000 (created first) and Q2 50000; funded SINKING_FUND_REDEMPTION target 9999"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T5", original_principal_cents: 100000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t5: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-Q1", legal_name: "Q1", contact_email: "q1@x.com" }, as: PlatformAdmin, captures: { q1: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-Q2", legal_name: "Q2", contact_email: "q2@x.com" }, as: PlatformAdmin, captures: { q2: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t5}", noteholder_account_id: "${q1}", original_principal_cents: 50000 }, as: PlatformAdmin, captures: { pq1: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t5}", noteholder_account_id: "${q2}", original_principal_cents: 50000 }, as: PlatformAdmin, captures: { pq2: $.data.id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t5}", payment_type: "SINKING_FUND_REDEMPTION", scheduled_payment_date: "2026-06-15", target_amount_cents: 9999 }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 9999 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer }
          assert:
            - "DistributionRecord for ${pq1}.allocated_cents == 5000 (earlier created_at wins the tied remainder)"
            - "DistributionRecord for ${pq2}.allocated_cents == 4999"
            - "sum == 9999 == gross_amount_cents"

      - name: redemption_zero_cent_allocation_records_created
        claim_type: correct_result
        grounds: ["calculations.pro_rata_allocation", "entities.DistributionRecord"]
        distinguishing_aspect: "Zero-quantity edge: a 1-cent redemption over 400000000/350000000/250000000 yields raw shares 0.4/0.35/0.25 — all floors 0, the single remainder cent goes to A (largest fraction), and B/C still receive DistributionRecords with allocated_cents == 0."
        test_recipe:
          setup: ["active indenture; ACT_360 tranche with positions A 400000000, B 350000000, C 250000000; funded SINKING_FUND_REDEMPTION target 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
