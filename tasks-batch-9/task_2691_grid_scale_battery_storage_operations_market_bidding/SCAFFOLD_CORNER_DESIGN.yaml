          assert:
            - "${s1} == 1 - the first sample at 13:00 is stored"
            - "earlier than the newest stored instant: HTTP 409 with ${e_back} == \"ERR_TELEMETRY_OUT_OF_ORDER\""
            - "exactly equal to the newest stored instant: HTTP 409 with ${e_equal} == \"ERR_TELEMETRY_OUT_OF_ORDER\" - strictly greater, not greater-or-equal"
            - "before setpoint_start: HTTP 409 with ${e_pre} == \"ERR_TELEMETRY_OUT_OF_ORDER\" even though 11:30 is later than nothing stored"
            - "${s2} == 2 at 13:30: HTTP 201"
            - "${s3} == 3 at 14:30: HTTP 201 - a sample after setpoint_end is late-arriving telemetry, NOT out of order"
            - "telemetry_sample_count == 3 - the three rejected samples were not stored"

      - name: setpoint_outside_the_delivery_window_returns_window_mismatch
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RESERVATION_WINDOW_MISMATCH]
          - validations[priority=18]
          - endpoints[POST /dispatch-instructions]
        distinguishing_aspect: |
          The setpoint interval must be contained in the cleared delivery interval at BOTH ends, so
          an implementation that only checks setpoint_start inside the window accepts an instruction
          that runs past the end of the traded product. Containment is the test, not overlap: an
          interval that straddles the boundary is refused even though it overlaps the delivery
          window for most of its length.
        test_recipe:
          setup:
            - "reservation R1 12:00-20:00, bid B1 CLEARED for delivery 12:00-16:00 at 10.0 MW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 10.0 }
              as: MarketOperator
          trigger:
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 10.0, setpoint_start: "2026-08-10T15:00:00Z", setpoint_end: "2026-08-10T17:00:00Z" }
              as: MarketOperator
              captures: { e_tail: $.data.error_id }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 10.0, setpoint_start: "2026-08-10T11:00:00Z", setpoint_end: "2026-08-10T13:00:00Z" }
              as: MarketOperator
              captures: { e_head: $.data.error_id }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 10.0, setpoint_start: "2026-08-10T12:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { d_ok: $.data.id, d_energy: $.data.expected_energy_mwh }
          assert:
            - "runs past delivery_end (15:00-17:00 against 12:00-16:00): HTTP 422 with ${e_tail} == \"ERR_RESERVATION_WINDOW_MISMATCH\""
            - "starts before delivery_start (11:00-13:00): HTTP 422 with ${e_head} == \"ERR_RESERVATION_WINDOW_MISMATCH\""
            - "fully contained (12:00-14:00): HTTP 201 with ${d_energy} == 20.0"
            - "only ${d_ok} exists - the reservation clause of priority 18 is a belt-and-braces net behind the submit precondition reservation.window_end > delivery_end, and the setpoint clause is what actually rejects here"

      - name: instruction_one_hundredth_above_cleared_mw_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSTRUCTION_EXCEEDS_CLEARED]
          - validations[priority=28]
        distinguishing_aspect: |
          The instruction is bounded by cleared_mw, not by offer_mw or by the asset rating, so a
          partially cleared bid (awarded less than it offered) is the case that separates the three
          bounds. The comparison is inclusive at cleared_mw and the smallest possible overshoot -
          one hundredth of a MW - must still be refused.
        test_recipe:
          setup:
            - "bid B1 offers 10.0 MW but is cleared for only 6.0 MW at 45.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 6.0 }
              as: MarketOperator
              captures: { cleared: $.data.cleared_mw }
          trigger:
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 6.01, setpoint_start: "2026-08-10T12:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { e_over: $.data.error_id }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 6.0, setpoint_start: "2026-08-10T12:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { d_ok: $.data.id, d_energy: $.data.expected_energy_mwh }
          assert:
            - "${cleared} == 6.0 - the award is smaller than the 10.0 MW offer"
            - "6.01 MW: HTTP 422 with ${e_over} == \"ERR_INSTRUCTION_EXCEEDS_CLEARED\" - the offer_mw of 10.0 and the 25.0 MW rating are irrelevant bounds here"
            - "exactly 6.0 MW: HTTP 201 with ${d_energy} == 12.0 (6.0 * 2 h) - the bound is inclusive"

      - name: award_one_cent_below_the_offer_floor_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLEARING_PRICE_BELOW_FLOOR]
          - validations[priority=29]
          - calculations.bid_floor_price
        distinguishing_aspect: |
          The floor is not a configured constant, it is the bid's own computed
          offer_price_usd_per_mwh, so this code can only be produced by an implementation that
          derived the degradation-aware floor correctly in the first place. The comparison is
          inclusive: an award at exactly the floor is economic and must clear, one cent below it
          would sell degradation below cost and must be refused, leaving the bid SUBMITTED.
        test_recipe:
          setup:
            - "asset A1 at 88.0 % round-trip efficiency, degradation cost 12.00, zero throughput"
            - "bid B1 ENERGY / DISCHARGE with no price adder -> floor (22.0 * 100 / 88.0) + 12.00 * 1.00 + 0.0 == 37.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { b1: $.data.id, floor: $.data.offer_price_usd_per_mwh }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { b1_submitted: $.data.status }
          trigger:
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 36.99, cleared_mw: 10.0 }
              as: MarketOperator
              captures: { e_low: $.data.error_id }
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 37.00, cleared_mw: 10.0 }
              as: MarketOperator
              captures: { b1_final: $.data.status, b1_price: $.data.cleared_price_usd_per_mwh }
          assert:
            - "${floor} == 37.00 and ${b1_submitted} == \"SUBMITTED\""
            - "36.99: HTTP 422 with ${e_low} == \"ERR_CLEARING_PRICE_BELOW_FLOOR\" and the bid is still SUBMITTED (not UNCLEARED, not CLEARED)"
            - "37.00: HTTP 200 with ${b1_final} == \"CLEARED\" and ${b1_price} == 37.00 - an award exactly at the floor is accepted"

      - name: baseline_test_reference_must_be_completed_and_strictly_earlier
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BASELINE_TEST_INVALID]
          - validations[priority=20]
          - entities.CapacityTest.baseline_test_id
        distinguishing_aspect: |
          The baseline reference is a three-part conjunction over an optional self-referencing FK -
          same asset, COMPLETED, and strictly earlier scheduled_date - so a scheduled-but-unrun test
          and a completed-but-later test are both invalid baselines even though the row exists and
          passes the priority 5 existence check. Chronology is the half most implementations forget.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z, asset A1 commissioned"
            - "test T1 scheduled 2026-08-05 and left SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-05T00:00:00Z" }
              as: AssetManager
              captures: { t1: $.data.id, t1_status: $.data.status }
          trigger:
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-20T00:00:00Z", baseline_test_id: "${t1}" }
              as: AssetManager
              captures: { e_not_completed: $.data.error_id }
            - call: "POST /capacity-tests/${t1}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /capacity-tests/${t1}/complete"
              payload: { measured_capacity_mwh: 92.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { t1_final: $.data.status }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-01T00:00:00Z", baseline_test_id: "${t1}" }
              as: AssetManager
              captures: { e_not_earlier: $.data.error_id }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-20T00:00:00Z", baseline_test_id: "${t1}" }
              as: AssetManager
              captures: { t4: $.data.id }
          assert:
            - "${t1_status} == \"SCHEDULED\" when the first baseline reference is attempted"
            - "baseline still SCHEDULED: HTTP 422 with ${e_not_completed} == \"ERR_BASELINE_TEST_INVALID\" - existence is not enough"
            - "${t1_final} == \"COMPLETED\" after the legitimate run"
            - "baseline COMPLETED but scheduled 2026-08-05, later than the new test's 2026-08-01: HTTP 422 with ${e_not_earlier} == \"ERR_BASELINE_TEST_INVALID\" - strictly earlier, so a same-day or later baseline is refused"
            - "COMPLETED baseline strictly earlier than 2026-08-20: HTTP 201, ${t4} created with baseline_test_id == ${t1}"

      - name: ancillary_offer_above_half_the_rating_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OFFER_MW_EXCEEDS_RATING]
          - validations[priority=25]
        distinguishing_aspect: |
          Priority 25 carries two bounds and the tighter one applies only to the three ancillary
          products, because a regulation or spinning-reserve offer has to be able to move in both
          directions from its operating point. An implementation that checks only min(power_rating,
          poi_mw_limit) happily accepts a 13.0 MW spinning offer from a 25.0 MW battery that could
          never follow it downward.
        test_recipe:
          setup:
            - "asset A1: power_rating_mw 25.0, poi_mw_limit 25.0 -> energy ceiling 25.0, ancillary ceiling 12.5"
            - "reservation R1 HELD 40 MWh 12:00-20:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 25.01 }
              as: MarketTrader
              captures: { e_energy: $.data.error_id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "REAL_TIME", product: "SPIN", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 13.0 }
              as: MarketTrader
              captures: { e_spin: $.data.error_id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "REAL_TIME", product: "REG_DOWN", direction: "CHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 12.51 }
              as: MarketTrader
              captures: { e_regdown: $.data.error_id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "REAL_TIME", product: "SPIN", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 12.5 }
              as: MarketTrader
              captures: { spin_ok: $.data.id, spin_price: $.data.offer_price_usd_per_mwh }
          assert:
            - "ENERGY at 25.01 MW: HTTP 422 with ${e_energy} == \"ERR_OFFER_MW_EXCEEDS_RATING\" (above min(25.0, 25.0))"
            - "SPIN at 13.0 MW: HTTP 422 with ${e_spin} == \"ERR_OFFER_MW_EXCEEDS_RATING\" even though 13.0 is far below the 25.0 MW rating - the ancillary bound is 12.5"
            - "REG_DOWN at 12.51 MW: HTTP 422 with ${e_regdown} == \"ERR_OFFER_MW_EXCEEDS_RATING\" - the half-rating bound applies to the charging direction too"
            - "SPIN at exactly 12.5 MW: HTTP 201, ${spin_ok} created with ${spin_price} == 20.35 (floor (25.00 + 12.00) * 0.55) - the bound is inclusive"

      - name: capacity_commitment_above_rating_or_annual_hours_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COMMITMENT_EXCEEDS_RATING]
          - validations[priority=26]
        distinguishing_aspect: |
          One error code covers two unrelated dimensions - power against the nameplate rating and
          required availability hours against the 8760-hour year - and each must be caught
          independently. Both bounds are inclusive, so a full-rating, full-year obligation is a
          legal (if aggressive) enrolment and must be accepted.
        test_recipe:
          setup:
            - "asset A1 commissioned with power_rating_mw 25.0; ANNUAL_HOURS is 8760.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "Desert RA 2027", program_year: 2027, committed_mw: 25.01, availability_hours_required: 7884.0, penalty_rate_usd_per_mw_hour: 3000.00 }
              as: AssetManager
              captures: { e_mw: $.data.error_id }
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "Desert RA 2027", program_year: 2027, committed_mw: 20.0, availability_hours_required: 8760.01, penalty_rate_usd_per_mw_hour: 3000.00 }
              as: AssetManager
              captures: { e_hours: $.data.error_id }
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "Desert RA 2027", program_year: 2027, committed_mw: 25.0, availability_hours_required: 8760.0, penalty_rate_usd_per_mw_hour: 3000.00 }
              as: AssetManager
              captures: { obl_ok: $.data.id, obl_status: $.data.status }
          assert:
            - "committed_mw 25.01 against a 25.0 MW rating: HTTP 422 with ${e_mw} == \"ERR_COMMITMENT_EXCEEDS_RATING\""
            - "availability_hours_required 8760.01: HTTP 422 with ${e_hours} == \"ERR_COMMITMENT_EXCEEDS_RATING\" - the same code, the other dimension"
            - "exactly 25.0 MW for exactly 8760.0 h: HTTP 201 with ${obl_status} == \"ACTIVE\" - both bounds inclusive"
            - "only ${obl_ok} exists, so the two rejections never consumed the (asset, program_name, program_year) slot that priority 27 protects"

      - name: warranty_claim_actions_out_of_order_return_their_own_codes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLAIM_NOT_DRAFT]
          - errors[ERR_CLAIM_NOT_SUBMITTED]
          - errors[ERR_CLAIM_NOT_APPROVED]
          - validations[priority=9]
        distinguishing_aspect: |
          Three codes guard three consecutive steps of one workflow, and every one of them is
          reachable from the same DRAFT row - adjudicating before submission, installing a remedy
          before adjudication, and re-submitting an already submitted claim. The adjudication probe
          also has to clear the priority 8 segregation check first, so it must be issued by a user
          other than the filer to prove the state guard (and not ERR_SEGREGATION_OF_DUTIES) is what
          rejects it.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "asset AX with initial_cumulative_throughput_mwh 19.8, test TX COMPLETED at 90.0 MWh -> warranty_claim_triggered true, deficit 2.10"
            - "claim W1 filed by am_filer and left DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Cross Ref BESS X", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 19.8, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { ax: $.data.id }
            - call: "POST /storage-assets/${ax}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${ax}", scheduled_date: "2026-08-01T00:00:00Z" }
              as: AssetManager
              captures: { tx: $.data.id }
            - call: "POST /capacity-tests/${tx}/start"
              payload: {}
              as: SiteController
              as_user_id: "${ax}"
            - call: "POST /capacity-tests/${tx}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${ax}"
              captures: { tx_trigger: $.data.warranty_claim_triggered }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${ax}", capacity_test_id: "${tx}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w1: $.data.id, w1_status: $.data.status }
          trigger:
            - call: "POST /warranty-claims/${w1}/adjudicate"
              payload: { decision: "APPROVE", remedy_install_date: "2026-09-15T00:00:00Z", remedy_outage_days: 5 }
              as: PlatformAdmin
              as_user_id: "pa_boss"
              captures: { e_not_submitted: $.data.error_id }
            - call: "POST /warranty-claims/${w1}/install-remedy"
              payload: {}
              as: AssetManager
              as_user_id: "am_filer"
              captures: { e_not_approved_draft: $.data.error_id }
            - call: "POST /warranty-claims/${w1}/submit"
              payload: {}
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w1_submitted: $.data.status }
            - call: "POST /warranty-claims/${w1}/submit"
              payload: {}
              as: AssetManager
              as_user_id: "am_filer"
              captures: { e_not_draft: $.data.error_id }
            - call: "POST /warranty-claims/${w1}/install-remedy"
              payload: {}
              as: AssetManager
              as_user_id: "am_filer"
              captures: { e_not_approved_submitted: $.data.error_id }
          assert:
            - "${tx_trigger} == true and ${w1_status} == \"DRAFT\""
            - "adjudicate a DRAFT claim (by a non-filer, so segregation passes): HTTP 409 with ${e_not_submitted} == \"ERR_CLAIM_NOT_SUBMITTED\""
            - "install-remedy on a DRAFT claim: HTTP 409 with ${e_not_approved_draft} == \"ERR_CLAIM_NOT_APPROVED\""
            - "${w1_submitted} == \"SUBMITTED\" - the legal step still works after both rejections"
            - "submit twice: HTTP 409 with ${e_not_draft} == \"ERR_CLAIM_NOT_DRAFT\" and submitted_by_user_id unchanged"
            - "install-remedy on a SUBMITTED claim: HTTP 409 with ${e_not_approved_submitted} == \"ERR_CLAIM_NOT_APPROVED\" - APPROVED is the only state that admits a remedy"
            - "remedy_energy_add_mwh is still null and asset rated_energy_mwh is still 100.0 - no rejected call moved energy"

      - name: soc_insufficient_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SOC_INSUFFICIENT]
          - validations[priority=33]
        excluded_because:
          difficulty_instance: soc_headroom_exact_equality_accepted_and_one_hundredth_over_rejected
          rationale: |
            That instance takes the headroom to exact equality, accepts it, then asks for one
            hundredth of a MWh more and asserts the 422 - the triggerability claim plus the
            boundary, which a plain trigger test would not cover.

      - name: revision_limit_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVISION_LIMIT_REACHED]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: market_bid_revision_cycle_reaches_revision_limit
          rationale: |
            The cyclic UNCLEARED -> DRAFT loop is walked three times there and the fourth revision
            is asserted as the 409, so the code is triggered exactly at its boundary.

      - name: test_not_scheduled_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TEST_NOT_SCHEDULED]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: state_error_outranks_safety_lockout_on_capacity_test_start
          rationale: |
            An IN_PROGRESS test is started again there and ERR_TEST_NOT_SCHEDULED is asserted as
            the winner over the concurrently violated lockout rule.

      - name: safety_lockout_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSET_SAFETY_LOCKOUT]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: state_error_outranks_safety_lockout_on_capacity_test_start
          rationale: |
            The same instance proves the code fires on its own once the state guard is satisfied,
            which is the only way to show it is both reachable and correctly ranked.

      - name: market_not_available_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSET_NOT_MARKET_AVAILABLE]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: market_availability_outranks_soc_insufficiency_on_reservation_create
          rationale: |
            A never-commissioned OFFLINE asset is reserved against there and this code is asserted
            ahead of the state-of-charge rejection it also earns.

      - name: bid_not_cleared_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BID_NOT_CLEARED]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: dispatch_create_requires_cleared_parent_bid
          rationale: |
            That instance walks a bid through DRAFT, SUBMITTED and UNCLEARED and asserts the 409 at
            each stop, so every non-CLEARED origin state is covered.

      - name: reservation_not_held_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RESERVATION_NOT_HELD]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: bid_submit_blocked_by_expired_reservation_state
          rationale: |
            The reservation is swept to EXPIRED by the logical clock there and the submit attempt
            is asserted to fail with this code rather than with a window error.

      - name: no_warranty_trigger_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_WARRANTY_TRIGGER]
          - validations[priority=19]
        excluded_because:
          difficulty_instance: warranty_claim_requires_completed_and_triggered_capacity_test
          rationale: |
            Both halves of the guard - not COMPLETED, and COMPLETED but not triggering - are driven
            there against the same asset, which subsumes a single triggerability test.

      - name: remedy_outage_conflict_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REMEDY_OUTAGE_CONFLICT]
          - validations[priority=22]
        excluded_because:
          difficulty_instance: remedy_outage_window_is_closed_inclusive_with_trailing_buffer_against_capacity_tests
          rationale: |
            The closed inclusive window plus the two-day trailing buffer is probed on the last
            blocked day and the first clear day there, which is strictly stronger.

  # ---------------------------------------------------------------------------
  # 7. RBAC - seven roles, one of them entity-backed, under a
  #    segregation_of_duties role model.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: other_roles_exclusive_operations_are_forbidden
        claim_type: unauthorized_operation
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.MarketTrader.exclusive_operations
          - roles.SiteController.exclusive_operations
          - roles.AssetManager.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Seven roles carve the surface into non-overlapping exclusive slices, so authorization is
          not a two-tier admin/user check: a MarketOperator that may clear bids still may not create
          them, and a ControlRoomOperator that accepts an instruction still may not execute it. Role
          rejection (priority 2) must also outrank every existence check, so a forbidden role on a
          non-existent id gets 403 and not 404.
        test_recipe:
          setup:
            - "asset A1 commissioned; one absent uuid used to prove priority 2 outranks priority 4"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /storage-assets"
              payload: { name: "Rogue BESS", nameplate_energy_mwh: 50.0, power_rating_mw: 12.0, poi_mw_limit: 12.0, poi_mva_limit: 13.2, reactive_capability_mvar: 6.0, initial_soc_mwh: 40.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 20000.0, commercial_operation_date: "2024-01-01T00:00:00Z", cycle_limit_per_year: 300 }
              as: MarketTrader
              captures: { e_create_asset: $.data.error_id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "00000000-0000-4000-8000-00000000fff8", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketOperator
              captures: { e_create_bid: $.data.error_id }
            - call: "POST /dispatch-instructions/00000000-0000-4000-8000-00000000fff9/execute"
              payload: {}
              as: ControlRoomOperator
              captures: { e_execute: $.data.error_id }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-20T00:00:00Z" }
              as: SafetyOfficer
              captures: { e_test: $.data.error_id }
            - call: "POST /warranty-claims/00000000-0000-4000-8000-00000000fffa/adjudicate"
              payload: { decision: "DENY", denial_reason: "OUT_OF_WARRANTY" }
              as: AssetManager
              captures: { e_adjudicate: $.data.error_id }
          assert:
            - "all five calls return HTTP 403 with error_id ERR_FORBIDDEN_ROLE: ${e_create_asset}, ${e_create_bid}, ${e_execute}, ${e_test}, ${e_adjudicate}"
            - "the execute and adjudicate probes name ids that do not exist, yet still return 403 - priority 2 is evaluated before the priority 4 existence check, so the API never confirms or denies the existence of a resource to an unauthorized role"
            - "no StorageAsset, MarketBid or CapacityTest row was created by any of the five calls"

      - name: shared_capacity_obligation_creation_works_for_both_owning_roles
        claim_type: shared_operations
        grounds:
          - roles.AssetManager.shared_operations
          - roles.MarketOperator.shared_operations
          - endpoints[POST /capacity-obligations]
        distinguishing_aspect: |
          Obligation enrolment is deliberately shared between the asset owner and the market
          operator, so an implementation that hard-codes a single role for the endpoint fails for
          the other. The shared grant is per-operation, not per-entity: the same MarketOperator that
          may create an obligation is the only role that may assess it, while AssetManager may not.
        test_recipe:
          setup:
            - "asset A1 commissioned, no obligations yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "Desert RA", program_year: 2027, committed_mw: 20.0, availability_hours_required: 7884.0, penalty_rate_usd_per_mw_hour: 3000.00 }
              as: AssetManager
              captures: { o_am: $.data.id, o_am_status: $.data.status }
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "ISO Winter RA", program_year: 2027, committed_mw: 15.0, availability_hours_required: 2160.0, penalty_rate_usd_per_mw_hour: 2500.00 }
              as: MarketOperator
              captures: { o_mo: $.data.id, o_mo_status: $.data.status }
            - call: "GET /capacity-obligations"
              payload: { asset_id: "${a1}", limit: 10, offset: 0 }
              as: ControlRoomOperator
          assert:
            - "AssetManager enrolment: HTTP 201 with ${o_am_status} == \"ACTIVE\""
            - "MarketOperator enrolment: HTTP 201 with ${o_mo_status} == \"ACTIVE\" - the same endpoint, a different owning role"
            - "the list read returns total_count == 2 containing both ${o_am} and ${o_mo}"

      - name: site_controller_with_a_foreign_asset_id_is_forbidden
        claim_type: entity_backed_identity
        grounds:
          - roles.SiteController.identity
          - validations[priority=7]
          - errors[ERR_ASSET_OWNERSHIP_MISMATCH]
        distinguishing_aspect: |
          SiteController is the one entity-backed identity in the matrix: its X-User-ID is not an
          opaque user string but the id of the StorageAsset whose site controller it is. The
          ownership check therefore has to walk the dispatch_id chain back to an asset and compare,
          which no amount of role checking accomplishes - the foreign controller carries a perfectly
          valid SiteController role.
        test_recipe:
          setup:
            - "asset A1 with instruction D1 ACCEPTED; unrelated asset A2 also commissioned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /storage-assets"
              payload: { name: "Rio Puerco BESS 2", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /storage-assets/${a2}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 10.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 10.0, setpoint_start: "2026-08-10T12:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
          trigger:
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a2}"
              captures: { e_foreign: $.data.error_id }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T13:00:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 78.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a2}"
              captures: { e_foreign_telemetry: $.data.error_id }
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { d1_exec: $.data.execution_status }
          assert:
            - "foreign controller on execute: HTTP 403 with ${e_foreign} == \"ERR_ASSET_OWNERSHIP_MISMATCH\" - the role is right, the identity is not"
            - "foreign controller on telemetry ingestion: HTTP 403 with ${e_foreign_telemetry} == \"ERR_ASSET_OWNERSHIP_MISMATCH\", reached through the dispatch_id in the body rather than a path id"
            - "the asset's own controller: HTTP 200 with ${d1_exec} == \"EXECUTING\""
            - "the instruction is still owned by ${a1} and no sample was stored by the foreign attempt"

      - name: filer_cannot_adjudicate_their_own_warranty_claim_forbidden
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Role separation is not enough here: AssetManager files and PlatformAdmin adjudicates, so
          the roles already differ and only the tracked X-User-ID can catch an operator who holds
          both hats. Segregation sits at priority 8, above every state guard, so it must reject even
          when the claim is in exactly the right state for the action.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; asset AX, triggered test TX, claim W1 filed by am_filer and SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Cross Ref BESS X", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 19.8, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { ax: $.data.id }
            - call: "POST /storage-assets/${ax}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${ax}", scheduled_date: "2026-08-01T00:00:00Z" }
              as: AssetManager
              captures: { tx: $.data.id }
            - call: "POST /capacity-tests/${tx}/start"
              payload: {}
              as: SiteController
              as_user_id: "${ax}"
            - call: "POST /capacity-tests/${tx}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${ax}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${ax}", capacity_test_id: "${tx}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w1: $.data.id }
            - call: "POST /warranty-claims/${w1}/submit"
              payload: {}
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w1_status: $.data.status }
          trigger:
            - call: "POST /warranty-claims/${w1}/adjudicate"
              payload: { decision: "APPROVE", remedy_install_date: "2026-09-15T00:00:00Z", remedy_outage_days: 5 }
              as: PlatformAdmin
              as_user_id: "am_filer"
              captures: { e_sod: $.data.error_id }
            - call: "POST /warranty-claims/${w1}/adjudicate"
              payload: { decision: "APPROVE", remedy_install_date: "2026-09-15T00:00:00Z", remedy_outage_days: 5 }
              as: PlatformAdmin
              as_user_id: "pa_boss"
              captures: { w1_final: $.data.status, w1_remedy: $.data.remedy_energy_add_mwh }
          assert:
            - "${w1_status} == \"SUBMITTED\" - the claim is in the state adjudicate departs from"
            - "adjudicated by the filer: HTTP 403 with ${e_sod} == \"ERR_SEGREGATION_OF_DUTIES\" although the role (PlatformAdmin) is correct and the state is correct"
            - "adjudicated by a different user: HTTP 200, ${w1_final} == \"APPROVED\" and ${w1_remedy} == 2.31 (round(100.0 * 2.1 / 100 * 1.1, 3))"
            - "adjudicated_by_user_id == \"pa_boss\" and created_by_user_id == \"am_filer\" are both retained for audit"

      - name: safety_event_opener_cannot_close_the_same_event_forbidden
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=8]
          - state_machines.SafetyEvent
        distinguishing_aspect: |
          The second segregation pair lives entirely inside one role: SafetyOfficer both reports and
          closes events, so the only thing separating the two duties is the user id. The auto-created
          telemetry event carries the sentinel opener "SYSTEM", which no human id can equal, so the
          rule must not accidentally block the closure of machine-reported events.
        test_recipe:
          setup:
            - "asset A1 commissioned; ADVISORY event E1 opened by officer so_1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "THERMAL_ANOMALY", severity: "ADVISORY", detected_max_cell_temp_c: 47.0 }
              as: SafetyOfficer
              as_user_id: "so_1"
              captures: { ev: $.data.id, ev_opener: $.data.opened_by_user_id }
          trigger:
            - call: "POST /safety-events/${ev}/close"
              payload: { responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /safety-events/${ev}/close"
              payload: { responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_2"
              captures: { ev_status: $.data.status, ev_closer: $.data.closed_by_user_id }
          assert:
            - "${ev_opener} == \"so_1\""
            - "closed by its own reporter: HTTP 403 with ${e_sod} == \"ERR_SEGREGATION_OF_DUTIES\" and the event stays OPEN"
            - "closed by a second officer: HTTP 200 with ${ev_status} == \"CLOSED\" and ${ev_closer} == \"so_2\""

      - name: missing_or_unknown_auth_headers_are_unauthenticated
        claim_type: unauthenticated_request
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 outranks everything, including the role check at priority 2 and the body check
          at priority 3, so a request with no identity at all must be answered 401 rather than 403
          or 400. Both halves matter: absent headers and a syntactically present but unknown role
          string that is not one of the seven declared roles.
        test_recipe:
          setup:
            - "no rows required; the harness sends the probes with the headers manipulated as described"
            - "as: NONE means neither X-User-ID nor X-User-Role is sent; as: BatteryWhisperer means X-User-Role carries a string that is not one of the seven roles"
          setup_api_calls: []
          trigger:
            - call: "GET /storage-assets"
              payload: { limit: 10, offset: 0 }
              as: NONE
              captures: { e_missing: $.data.error_id }
            - call: "POST /storage-assets"
              payload: {}
              as: NONE
              captures: { e_missing_post: $.data.error_id }
            - call: "GET /storage-assets"
              payload: { limit: 10, offset: 0 }
              as: BatteryWhisperer
              captures: { e_unknown_role: $.data.error_id }
          assert:
            - "no headers on a read: HTTP 401 with ${e_missing} == \"ERR_UNAUTHENTICATED\""
            - "no headers on a write with an empty body: HTTP 401 with ${e_missing_post} == \"ERR_UNAUTHENTICATED\" - priority 1 wins over the priority 3 body check, so the answer is never ERR_INVALID_REQUEST"
            - "unknown role string: HTTP 401 with ${e_unknown_role} == \"ERR_UNAUTHENTICATED\" - an unrecognised role is not authenticated at all, so it is not the 403 ERR_FORBIDDEN_ROLE case"

  # ---------------------------------------------------------------------------
  # 8. Cross-cutting complexity layers - optimistic_concurrency,
  #    cascading_side_effects, dual_variant_calculation, rate_threshold_triggers.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_asset_version_on_reservation_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.soc-reservation-create-stale-asset
          - validations[priority=10]
          - errors[ERR_STALE_ASSET_VERSION]
          - entities.StorageAsset.version
        distinguishing_aspect: |
          The reservation writer must present the version of the StorageAsset it read, because every
          accepted reservation rewrites the asset's reserved_mwh_total and free_dispatchable_mwh -
          the very numbers the caller based its request on. The trap is that the FIRST create with a
          freshly read version succeeds and silently invalidates that version, so a client that
          caches one version and fires two requests must be refused on the second with 412 (not 409
          and not a silent overwrite), and must succeed once it re-reads.
        test_recipe:
          setup:
            - "asset A1 commissioned, soc 80.0 MWh, floor 10 % -> 70.0 MWh dispatchable, nothing reserved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id, v0: $.data.version }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 20.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { e_stale: $.data.error_id }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: MarketTrader
              captures: { v2: $.data.version, reserved_after_one: $.data.reserved_mwh_total }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 20.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v2}" }
              as: MarketTrader
              captures: { r2: $.data.id }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: MarketTrader
              captures: { v3: $.data.version, reserved_after_two: $.data.reserved_mwh_total, free_after_two: $.data.free_dispatchable_mwh }
          assert:
            - "the first create with the version read from commission: HTTP 201, ${r1} exists"
            - "${v2} == ${v1} + 1 and ${reserved_after_one} == 40.0 - accepting a reservation bumped the asset version, which is exactly what invalidates the cached one"
            - "the second create replaying ${v1}: HTTP 412 with ${e_stale} == \"ERR_STALE_ASSET_VERSION\" - 412, not 409, and no SocReservation row was written"
            - "the retry with the re-read ${v2}: HTTP 201, ${r2} exists"
            - "${v3} == ${v2} + 1, ${reserved_after_two} == 60.0 and ${free_after_two} == 10.0 (80.0 usable - 10.0 floor - 60.0 held) - one version bump per accepted write, none for the rejected one"
            - "${v1} > ${v0} as well: commissioning is itself a write and increments the version"

      - name: cumulative_cycle_and_throughput_thresholds_bind_at_their_exact_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - errors[ERR_CYCLE_LIMIT_EXCEEDED]
          - errors[ERR_THROUGHPUT_LIMIT_EXCEEDED]
          - entities.StorageAsset.equivalent_full_cycles_ytd
        distinguishing_aspect: |
          Two cumulative budgets are consumed by the same act of submitting a bid, they are checked
          at adjacent priorities, and each is inclusive at its ceiling. Two assets are configured so
          that exactly one budget binds on each: on AC the annual cycle budget runs out first, on AT
          the warranty throughput budget does, and both are driven to the last admissible hundredth
          before being pushed one hundredth past it. An implementation that checks the budgets in the
          wrong order returns the wrong code on AT, and one that uses strict inequality rejects the
          legitimate boundary submission on both.
        test_recipe:
          setup:
            - "asset AC: 190.0 MWh already cycled, warranty limit 400.0 MWh, cycle_limit_per_year 1 -> efc_ytd 0.95, cycle headroom 0.05 efc == 10.0 MWh, throughput headroom 210.0 MWh"
            - "asset AT: 190.0 MWh already cycled, warranty limit 200.0 MWh, cycle_limit_per_year 5 -> throughput headroom 10.0 MWh, cycle headroom 4.05 efc"
            - "one HELD reservation per asset spanning 12:00-20:00 so both submissions clear the window preconditions"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Cycle Bound BESS AC", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 190.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 400.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 1 }
              as: PlatformAdmin
              captures: { ac: $.data.id, ac_efc: $.data.equivalent_full_cycles_ytd }
            - call: "POST /storage-assets/${ac}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { ac_v: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${ac}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 20.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${ac_v}" }
              as: MarketTrader
              captures: { ac_r: $.data.id }
            - call: "POST /storage-assets"
              payload: { name: "Throughput Bound BESS AT", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 190.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 200.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 5 }
              as: PlatformAdmin
              captures: { at: $.data.id, at_efc: $.data.equivalent_full_cycles_ytd }
            - call: "POST /storage-assets/${at}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { at_v: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${at}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 20.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${at_v}" }
              as: MarketTrader
              captures: { at_r: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${ac}", reservation_id: "${ac_r}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T13:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { ac_b1: $.data.id, ac_b1_debit: $.data.cycle_debit_efc }
            - call: "POST /market-bids"
              payload: { asset_id: "${ac}", reservation_id: "${ac_r}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T14:00:00Z", delivery_end: "2026-08-10T15:00:00Z", offer_mw: 10.01 }
              as: MarketTrader
              captures: { ac_b2: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${at}", reservation_id: "${at_r}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T13:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { at_b1: $.data.id, at_b1_energy: $.data.expected_energy_mwh }
            - call: "POST /market-bids"
              payload: { asset_id: "${at}", reservation_id: "${at_r}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T14:00:00Z", delivery_end: "2026-08-10T15:00:00Z", offer_mw: 10.01 }
              as: MarketTrader
              captures: { at_b2: $.data.id }
          trigger:
            - call: "POST /market-bids/${ac_b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { ac_b1_status: $.data.status }
            - call: "POST /market-bids/${ac_b2}/submit"
              payload: {}
              as: MarketTrader
              captures: { e_cycle: $.data.error_id }
            - call: "POST /market-bids/${at_b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { at_b1_status: $.data.status }
            - call: "POST /market-bids/${at_b2}/submit"
              payload: {}
              as: MarketTrader
              captures: { e_throughput: $.data.error_id }
          assert:
            - "${ac_efc} == 0.95 and ${at_efc} == 0.95 (round(190.0 / (2 * 100.0), 4)) at creation"
            - "${ac_b1_debit} == 0.05 and ${at_b1_energy} == 10.0 - a 10.0 MW offer over one hour"
            - "AC at exactly the cycle ceiling: HTTP 200 with ${ac_b1_status} == \"SUBMITTED\" because round(0.95 + 10.0 / 200.0, 4) == 1.0 <= 1"
            - "AC one hundredth over: HTTP 409 with ${e_cycle} == \"ERR_CYCLE_LIMIT_EXCEEDED\" because round(0.95 + 10.01 / 200.0, 4) == 1.0001 > 1"
            - "AT at exactly the throughput ceiling: HTTP 200 with ${at_b1_status} == \"SUBMITTED\" because round(190.0 + 10.0, 3) == 200.0 <= 200.0"
            - "AT one hundredth over: HTTP 409 with ${e_throughput} == \"ERR_THROUGHPUT_LIMIT_EXCEEDED\" - round(190.0 + 10.01, 3) == 200.01 > 200.0 while the cycle budget (1.0001 <= 5) still has room, so the cycle code must NOT be returned"
            - "neither budget moves on submit: both assets still report cumulative_throughput_mwh 190.0 and equivalent_full_cycles_ytd 0.95, because the counters advance on delivery, not on offering"

      - name: cascading_side_effects_layer_corner
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.StorageAsset.safety_state
        excluded_because:
          difficulty_instance: telemetry_runaway_cascades_six_levels_through_bids_reservations_dispatches_and_obligation
          rationale: |
            Six levels are verified end-to-end from a single telemetry sample there, with the pinned
            ordering asserted link by link and the partial-failure question settled by the rollback
            assertion - strictly more than an N-level smoke test.

      - name: dual_variant_calculation_layer_corner
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.dispatch_performance_score.variants
          - calculations.capacity_obligation_assessment.variants
        excluded_because:
          difficulty_instance: dispatch_performance_provisional_versus_settled_score
          rationale: |
            Both variants are computed over identical stored telemetry and the delta on the switch is
            asserted numerically, which is the whole content of this layer's claim.

  # ---------------------------------------------------------------------------
  # 9. Consistency model - immediate.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: completion_response_already_carries_the_settled_ledger
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.throughput_and_soc_ledger
          - endpoints[POST /dispatch-instructions/{id}/complete]
        distinguishing_aspect: |
          Under an immediate model there is no window in which the instruction reports delivered
          energy while the asset ledger still shows the pre-delivery state - the completion response
          itself must already contain the derived quantities, and a read issued immediately
          afterwards must agree with it field for field. This is the claim that forbids deferring the
          asset-side aggregation to a later job.
        test_recipe:
          setup:
            - "asset A1 at soc 80.0 MWh with zero cumulative throughput"
            - "instruction D1 EXECUTING at 10.0 MW with one on-time sample measured 10.0 MW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 10.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 10.0, setpoint_start: "2026-08-10T12:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T13:00:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 78.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
          trigger:
            - call: "POST /dispatch-instructions/${d1}/complete"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { d_delivered: $.data.delivered_mwh, d_soc_delta: $.data.soc_delta_mwh, d_exec: $.data.execution_status, d_score: $.data.scoring_status, d_composite: $.data.composite_score }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { a_soc: $.data.soc_mwh, a_cum: $.data.cumulative_throughput_mwh, a_efc: $.data.equivalent_full_cycles_ytd }
            - call: "GET /dispatch-instructions/${d1}"
              payload: {}
              as: AssetManager
              captures: { d_delivered_read: $.data.delivered_mwh, d_composite_read: $.data.composite_score }
          assert:
            - "the completion response itself carries ${d_delivered} == 2.5 (10.0 MW * 0.25 h sample width), ${d_soc_delta} == -2.5, ${d_exec} == \"COMPLETED\", ${d_score} == \"PROVISIONAL\" and ${d_composite} == 100.00 - nothing is null pending a later pass"
            - "the immediately following asset read agrees: ${a_soc} == 77.5, ${a_cum} == 2.5 and ${a_efc} == 0.0125 (round(2.5 / 200.0, 4))"
            - "the immediately following instruction read agrees with its own write: ${d_delivered_read} == ${d_delivered} and ${d_composite_read} == ${d_composite}"

      - name: reservation_write_is_visible_in_the_asset_aggregates_immediately
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.soc_reservation_availability
          - endpoints[POST /soc-reservations]
        distinguishing_aspect: |
          The reservation response is a SocReservation, so the derived asset aggregates it changed
          are only observable through a separate read - which is exactly where an eventually
          consistent implementation would leak a stale reserved_mwh_total and let the next caller
          over-reserve. The very next read must already reflect the hold and the bumped version.
        test_recipe:
          setup:
            - "asset A1 commissioned, soc 80.0 MWh, soc_floor_pct 10.0, nothing reserved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version, free_before: $.data.free_dispatchable_mwh, reserved_before: $.data.reserved_mwh_total }
          trigger:
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id, r1_status: $.data.status, r1_rank: $.data.priority_rank }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: MarketTrader
              captures: { v2: $.data.version, reserved_after: $.data.reserved_mwh_total, free_after: $.data.free_dispatchable_mwh }
            - call: "GET /soc-reservations"
              payload: { asset_id: "${a1}", status: "HELD", limit: 10, offset: 0 }
              as: MarketTrader
          assert:
            - "${reserved_before} == 0.0 and ${free_before} == 70.0 (min(80.0, 95.0) usable - 10.0 floor) before the write"
            - "${r1_status} == \"HELD\" and ${r1_rank} == 3 (ENERGY_ARBITRAGE) in the create response"
            - "the very next asset read already shows ${reserved_after} == 40.0, ${free_after} == 30.0 and ${v2} == ${v1} + 1 - no lag, no re-read loop"
            - "the collection read already returns total_count == 1 containing ${r1}"
