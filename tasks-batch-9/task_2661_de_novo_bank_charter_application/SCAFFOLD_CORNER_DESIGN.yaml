      - name: calc_escrow_position_sums_only_funded_and_cleared_rows
        claim_type: aggregation
        grounds:
          - calculations.escrow_position
          - calculations.escrow_release_allocation
          - entities.Subscription.fields.counts_toward_escrow
          - entities.CapitalRaise.fields.cleared_escrow_cents
        distinguishing_aspect: >
          Three subscriptions in three different dimension combinations show the aggregate's
          state filter: cleared_escrow_cents counts only rows that are BOTH FUNDED and CLEARED
          (1,500,000,000 after the trigger), pledged_gross_cents counts PLEDGED and FUNDED alike
          (1,750,000,000), and the 250,000,000-cent CLEARED-but-unfunded row enters neither.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING with one OPEN CapitalRaise"
            - "(offering price 1000 cents/share, organizational_expense_claim_cents 150,000,000)."
            - "Subscription s1: 1,000,000 shares, FUNDED and CLEARED."
            - "Subscription s2: 500,000 shares, FUNDED but UNSCREENED."
            - "Subscription s3: 250,000 shares, CLEARED but still PLEDGED."
            - "So cleared_escrow_cents is 1,000,000,000 before the trigger."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/capital-raises"
              payload: { group_id: "${g_id}", target_gross_cents: 4300000000, minimum_gross_cents: 4100000000, offering_price_cents_per_share: 1000, max_shares: 5000000, organizational_expense_claim_cents: 150000000 }
              as: CharterCounsel
              captures: { r_id: $.data.id }
            - call: "POST /de-novo/capital-raises/${r_id}/open"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Harbor Trust LP", shares: 1000000 }
              as: EscrowAgent
              captures: { s1_id: $.data.id }
            - call: "POST /de-novo/subscriptions/${s1_id}/funding"
              payload: { funding_event: "FUND" }
              as: EscrowAgent
            - call: "POST /de-novo/subscriptions/${s1_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Puget Founders Fund", shares: 500000 }
              as: EscrowAgent
              captures: { s2_id: $.data.id }
            - call: "POST /de-novo/subscriptions/${s2_id}/funding"
              payload: { funding_event: "FUND" }
              as: EscrowAgent
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Olympic Coast Holdings", shares: 250000 }
              as: EscrowAgent
              captures: { s3_id: $.data.id }
            - call: "POST /de-novo/subscriptions/${s3_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
          trigger:
            - call: "POST /de-novo/subscriptions/${s2_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
          assert:
            - "before the trigger CapitalRaise.${r_id}.cleared_escrow_cents == 1000000000"
            - "the call returns 200 and Subscription.${s2_id}.clearance_state == CLEARED"
            - "Subscription.${s2_id}.counts_toward_escrow == true"
            - "Subscription.${s3_id}.counts_toward_escrow == false - CLEARED but never FUNDED"
            - "CapitalRaise.${r_id}.cleared_escrow_cents == 1500000000"
            - "CapitalRaise.${r_id}.funded_gross_cents == 1500000000"
            - "CapitalRaise.${r_id}.pledged_gross_cents == 1750000000"
            - "CapitalRaise.${r_id}.refunded_gross_cents == 0"
            - "CapitalRaise.${r_id}.subscribed_shares == 1750000"
            - "CapitalRaise.${r_id}.projected_reimbursement_cents == 75000000 - the 5 percent cap on 1,500,000,000 bites the 150,000,000 claim"
            - "CapitalRaise.${r_id}.projected_net_release_cents == 1425000000"
      - name: calc_supervision_year_index_rolls_at_day_365_and_expires_at_day_1095
        claim_type: chronological
        grounds:
          - calculations.heightened_supervision_window
          - entities.OrganizingGroup.fields.supervision_year_index
          - entities.OrganizingGroup.fields.supervision_started_at
          - endpoints[POST /de-novo/_clock/set_current_utc]
        distinguishing_aspect: >
          Floor division on whole days, recomputed on every clock move: day 364 after opening is
          still year 1, day 365 is year 2, and day 1095 - counted across the 2028 leap day - falls
          outside SUPERVISION_YEARS and collapses the index to 0 rather than to 4.
