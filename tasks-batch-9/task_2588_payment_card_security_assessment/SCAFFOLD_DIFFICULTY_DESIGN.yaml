            - "SystemComponent.${comp_pos01_id}.in_sample == false and sampling_stratum == null - an ineligible row is never stratified"
            - "Engagement.${eng_id}.estimated_hours == 202 and assessment_fee_total == 54540.00 (base 50500.00 plus 8% surcharge 4040.00, subtotal 54540.00 below the 60000 tier floor so no discount)"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: conclusion_blocked_by_stale_sampling_plan_from_other_entity
        grounds:
          - validations[priority=13]
          - state_machines.SamplingPlan.ACTIVE_to_STALE
          - state_machines.RequirementAssessment.IN_TESTING_to_IN_PLACE
          - entities.SamplingPlan.fields.status
          - entities.RequirementAssessment.fields.test_status
        distinguishing_aspect: |
          The blocking state lives on a THIRD entity: nothing about RequirementAssessment 1.2.1 or its three
          SUFFICIENT evidence items changes, yet POST /requirement-assessments/{id}/conclusion is refused with
          ERR_SAMPLING_PLAN_STALE because a FAIL recorded on an unrelated NetworkSegment ('STORE-POS') flipped
          the engagement's ACTIVE SamplingPlan to STALE. Re-scoping (a new FINAL plan) unblocks the identical
          call with no change to the requirement, proving the gate reads foreign state rather than local state.
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1, approved_budget_amount 200000.00) is scope-locked and in FIELDWORK."
            - "NetworkSegment 'CDE-CORE' (CDE) is VALIDATED with app-01 (SERVER, DC-EAST), pay-01 and pay-02 (APPLICATION, DC-EAST); the FINAL SamplingPlan over those three is ACTIVE."
            - "RequirementAssessment 1.2.1 (family R1, testing_procedure_count 3) is IN_TESTING with three SUFFICIENT evidence items - one DOCUMENT_REVIEW, one INTERVIEW, one OBSERVATION against in-sample pay-01 - so every local precondition for a conclusion is satisfied."
            - "NetworkSegment 'STORE-POS' (declared OUT_OF_SCOPE) holds pos-01 (POS_TERMINAL, RETAIL-12) and has a CONFIG_REVIEW test plan awaiting its result."
