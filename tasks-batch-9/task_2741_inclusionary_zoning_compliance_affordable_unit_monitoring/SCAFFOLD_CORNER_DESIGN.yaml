      - name: the_clock_endpoint_sweeps_every_due_row_in_one_call_and_reports_counts
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.InLieuFee.ASSESSED_to_DELINQUENT
        distinguishing_aspect: |
          One clock call is a three-step batch over three unrelated tables, and its response is a
          count triple rather than an entity: a certification whose term has lapsed expires and
          vacates its unit, an unpaid assessment past its due_date turns DELINQUENT, and a
          price-approved resale whose ROFR day has fully elapsed is auto-waived. Setting the clock
          a second time must report all three counts as 0 — the sweep is idempotent and only ever
          acts on rows that became due since the last observation, which is what stops a
          re-observation from double-penalising anything.
