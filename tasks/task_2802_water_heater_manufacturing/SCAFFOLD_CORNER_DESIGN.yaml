      - name: rework_limit_and_reversal_guards_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 18]
          - validations[priority 39]
          - validations[priority 17]
          - errors[ERR_REWORK_LIMIT_EXCEEDED]
          - errors[ERR_REWORK_REVERSAL_NOT_ALLOWED]
          - errors[ERR_BATCH_NOT_FIRED]
          - state_machines.GlassLiningBatch.FIRED_to_QUARANTINED
        distinguishing_aspect: >
          Reversal has FOUR preconditions and two different lots violate two different ones: lot TL-001 was a
          direct FAIL (cascade_rejected false, last_scrap_quantity 5) but its batch is now QUARANTINED, while lot
          TL-002 sits on a healthy record set yet was rejected by the cascade. Both must report the SAME
          ERR_REWORK_REVERSAL_NOT_ALLOWED, so an implementation that only checks cascade_rejected passes TL-002
          and wrongly reverses TL-001. TL-002 may still be re-queued (rework_count 1 < 2) but cannot be re-lined
          from the quarantined batch, which turns into ERR_BATCH_NOT_FIRED.
        test_recipe:
          setup:
            - "Lot TL-001 (planned 120) failed its HOLIDAY inspection twice on batch GLB-001, so rework_count is 2, wip is 105 and scrapped is 15."
            - "The second failure pushed GLB-001.rejected_lot_count to 2, quarantining the batch."
            - "The quarantine cascade rejected sibling lot TL-002 (planned 60), which was LINING_VERIFIED, with cascade_rejected true and last_scrap_quantity still null."
            - "MAX_REWORK_CYCLES is 2 and BATCH_QUARANTINE_THRESHOLD is 2."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
