# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2195 — Export Trading & Trade-Documentation Services
#
# Depth probe: the nine §0.5 Difficulty Rules cross-referenced against
# SCAFFOLD.yaml §1.1–§1.7. Every grounds ref, error id, state name, field name
# and endpoint below is declared in SCAFFOLD.yaml. Every numeric assertion was
# computed by executing the §1.3 formula against its `constants:`.
#
# Shared fixture conventions used by every instance below:
#   * the logical clock starts at 2026-08-01T00:00:00Z and is only moved by an
#     explicit POST /_clock/set_current_utc call;
#   * X-User-ID values are opaque strings: "tco_1" (TradeComplianceOfficer),
#     "ops_1"/"ops_2" (ExportOpsCoordinator), "rev_1" (DocumentaryCreditReviewer),
#     "fin_1" (FinanceCollectionsOfficer), "adm_1" (PlatformAdmin); a ForeignBuyer
#     caller always sends as_user_id equal to the ForeignBuyer row id;
#   * a COMMERCIAL_INVOICE must be ISSUED before the next document is generated,
#     because POST /trade-documents/{document_id}/issue bumps ExportOrder.version
#     and would leave a pre-generated sibling's pinned_order_version stale
#     (§1.4 priority 28).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_vs_final_incoterm_cost_allocation_diverge_on_short_shipment
        grounds:
          - calculations.incoterm_cost_allocation
          - state_machines.ExportOrder.BOOKED_to_SHORT_SHIPPED
          - state_machines.FreightBooking.CONFIRMED_to_SHIPPED
          - entities.ExportOrder.fields.provisional_seller_cost_usd
          - entities.ExportOrder.fields.final_seller_cost_usd
          - entities.ExportOrder.fields.cost_allocation_variance_usd
        distinguishing_aspect: |
          This instance is the cost-accounting domain (ExportOrder trade-cost buckets): the
          provisional_at_booking variant sizes all eight buckets on ordered gross weight
          8000.000 kg / ordered value 15000.00 USD (CW_UNITS = 8) while the
          final_at_bl_issuance variant sizes them on shipped-prorated weight 6200.000 kg /
          shipped value 12000.00 USD (CW_UNITS = 7), so seller cost falls 5381.00 -> 4744.00
          and the variance -637.00 is NOT the 0.8 shipped-value ratio applied to the
          provisional figure (that would be 4304.80), because B2/B3/B6 are flat and B5 is
          pinned at its MIN_MARINE_PREMIUM_USD floor of 75.00 in both variants.
        test_recipe:
          setup:
            - "One ForeignBuyer 'Nakamura Trading KK' (JP, credit_rating BBB, sanctions_tier NONE, restricted_party_flag false)."
            - "One ExportOrder with incoterm DDP (seller owns all eight buckets), destination_zone ZONE_2 (multiplier 1.15), invoice_currency USD, fx 1.000000."
            - "Two ShipmentLine rows: line_no 1 quantity 10.000 @ 1000.0000 USD gross 5000.000 kg; line_no 2 quantity 10.000 @ 500.0000 USD gross 3000.000 kg. ordered_goods_value_usd = 15000.00."
            - "Screening decided NLR so fulfillment_status is COMPLIANCE_CLEARED; one VesselSailing in ZONE_2 with tariff_rate_per_1000kg_usd 300.00 and capacity 20000.000 kg."
            - "One FreightBooking with container_type LCL (CONTAINER_MIN_WEIGHT_KG_LCL = 0, so weight_basis alone drives CW_UNITS); provisional_seller_cost_usd already stored as 5381.00; booking CONFIRMED because the COMMERCIAL_INVOICE and PACKING_LIST are ISSUED."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Nakamura Trading KK", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "DDP", incoterm_named_place: "DDP Yokohama", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_2", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Rolled steel coil", hs_code: "720839", quantity: 10.000, uom: "SET", unit_price_usd: 1000.0000, line_discount_pct: 0, net_weight_kg: 4800.000, gross_weight_kg: 5000.000, package_count: 5 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line1_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 2, goods_description: "Coil end caps", hs_code: "732690", quantity: 10.000, uom: "SET", unit_price_usd: 500.0000, line_discount_pct: 0, net_weight_kg: 2900.000, gross_weight_kg: 3000.000, package_count: 3 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line2_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Han River", voyage_no: "H101", port_of_loading: "KRPUS", port_of_discharge: "JPYOK", destination_zone: "ZONE_2", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 20000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v: "$.data.version" }
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 8000.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_id: "$.data.id" }
            - call: "POST /trade-documents"
              payload: { export_order_id: "${order_id}", doc_type: "COMMERCIAL_INVOICE" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { inv_doc_id: "$.data.id" }
            - call: "POST /trade-documents/${inv_doc_id}/issue"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /trade-documents"
              payload: { export_order_id: "${order_id}", doc_type: "PACKING_LIST" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { pl_doc_id: "$.data.id" }
            - call: "POST /trade-documents/${pl_doc_id}/issue"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /freight-bookings/${booking_id}/confirm"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
          trigger:
            - call: "POST /freight-bookings/${booking_id}/bill-of-lading"
              payload: { on_board_date: "2026-08-01T00:00:00Z", shipped_lines: [ { shipment_line_id: "${line1_id}", shipped_quantity: 10.000 }, { shipment_line_id: "${line2_id}", shipped_quantity: 4.000 } ] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { bl_doc_id: "$.data.id" }
          assert:
            - "ExportOrder.${order_id}.fulfillment_status == SHORT_SHIPPED"
            - "ExportOrder.${order_id}.provisional_seller_cost_usd == 5381.00"
            - "ExportOrder.${order_id}.provisional_buyer_cost_usd == 0.00"
            - "ExportOrder.${order_id}.final_seller_cost_usd == 4744.00"
            - "ExportOrder.${order_id}.final_buyer_cost_usd == 0.00"
            - "ExportOrder.${order_id}.cost_allocation_variance_usd == -637.00"
            - "ExportOrder.${order_id}.final_seller_cost_usd != 4304.80 (the shipped-value-ratio reading of the provisional figure)"
            - "ExportOrder.${order_id}.shipped_goods_value_usd == 12000.00"
            - "ExportOrder.${order_id}.short_shipped_value_usd == 3000.00"
            - "TradeDocument.${bl_doc_id}.doc_type == BILL_OF_LADING and TradeDocument.${bl_doc_id}.status == ISSUED"

      - name: terms_review_vs_examination_risk_score_diverge_on_identical_finding_set
        grounds:
          - calculations.lc_discrepancy_risk_score
          - state_machines.LetterOfCredit.UNDER_REVIEW_to_ACCEPTED
          - state_machines.DocumentPresentation.PRESENTED_to_DISCREPANT
          - entities.LCTermsReview.fields.terms_risk_score
          - entities.DocumentPresentation.fields.examination_risk_score
          - entities.DiscrepancyFinding.fields.raised_in_round
        distinguishing_aspect: |
          This instance is the documentary-risk domain on two different entities
          (LCTermsReview vs DocumentPresentation), not the ExportOrder cost domain: the one
          MINOR/DOCUMENTS TERMS finding scores 5.00 under variant pre_shipment_review
          (CARRYOVER_FACTOR_SAME_ROUND 1.0) and only 2.50 under variant
          presentation_examination (raised_in_round 0 != presentation_round 1 so
          CARRYOVER_FACTOR_EARLIER_ROUND 0.5), giving examination_risk_score
          22.50 + 2.50 = 25.00 rather than the 27.50 a same-round reading would produce.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted); ExportOrder FOB / ZONE_1 with one ShipmentLine quantity 100.000 @ 250.0000 USD (ordered_goods_value_usd 25000.00, gross 1000.000 kg)."
            - "Screening NLR -> order COMPLIANCE_CLEARED; sailing ZONE_1 tariff 300.00 capacity 20000.000; booking LCL 1000.000 kg; COMMERCIAL_INVOICE (declared_total_usd 25000.00 because FOB leaves B4 and B5 with the buyer) and PACKING_LIST ISSUED; booking CONFIRMED; BILL_OF_LADING ISSUED with on_board_date 2026-08-01T00:00:00Z so fulfillment_status is SHIPPED."
            - "LetterOfCredit LC-2195-001 captured by ops_1: amount_usd 26000.00, tolerance_pct 5.00 (max_drawable_usd 27300.00, min_drawable_usd 24700.00), SIGHT, expiry 2026-10-15, required_document_types [COMMERCIAL_INVOICE, BILL_OF_LADING], partial_shipment_allowed false."
            - "One LCTermsReview opened by rev_1 carrying exactly one DiscrepancyFinding: code DOC_TYPE_MISSING, severity MINOR, clause_ref DOCUMENTS, cure_status OPEN, raised_in_round 0; submitted ACCEPT so the credit is ACCEPTED and settlement_status is LC_ACCEPTED."
            - "One DocumentPresentation in PRESENTED at presentation_round 1 tendering the ISSUED invoice and bill of lading (presented_amount_usd 25000.00, days_after_on_board 0)."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Nakamura Trading KK", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Stainless couplings", hs_code: "732290", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, line_discount_pct: 0, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line1_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Han River", voyage_no: "H201", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 20000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v: "$.data.version" }
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 1000.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_id: "$.data.id" }
            - call: "POST /trade-documents"
              payload: { export_order_id: "${order_id}", doc_type: "COMMERCIAL_INVOICE" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { inv_doc_id: "$.data.id" }
            - call: "POST /trade-documents/${inv_doc_id}/issue"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /trade-documents"
              payload: { export_order_id: "${order_id}", doc_type: "PACKING_LIST" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { pl_doc_id: "$.data.id" }
            - call: "POST /trade-documents/${pl_doc_id}/issue"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /freight-bookings/${booking_id}/confirm"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /freight-bookings/${booking_id}/bill-of-lading"
              payload: { on_board_date: "2026-08-01T00:00:00Z", shipped_lines: [ { shipment_line_id: "${line1_id}", shipped_quantity: 100.000 } ] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { bl_doc_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              payload: { export_order_id: "${order_id}", lc_number: "LC-2195-001", issuing_bank_swift: "SMBCJPJT", amount_usd: 26000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-10-15T00:00:00Z", latest_shipment_date: "2026-09-30T00:00:00Z", presentation_period_days: 21, partial_shipment_allowed: false, transshipment_allowed: false, required_document_types: ["COMMERCIAL_INVOICE", "BILL_OF_LADING"] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              payload: { expected_letter_of_credit_version: "${lc_v}" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { review_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/findings"
              payload: { code: "DOC_TYPE_MISSING", severity: "MINOR", clause_ref: "DOCUMENTS", detail: "Credit does not demand the inspection certificate the contract requires" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { terms_finding_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              payload: { recommendation: "ACCEPT" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
            - call: "GET /export-orders/${order_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_v: "$.data.version" }
            - call: "POST /document-presentations"
              payload: { letter_of_credit_id: "${lc_id}", export_order_id: "${order_id}", trade_document_ids: ["${inv_doc_id}", "${bl_doc_id}"], expected_export_order_version: "${order_v}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { pres_id: "$.data.id" }
          trigger:
            - call: "POST /document-presentations/${pres_id}/examine"
              payload: { findings: [ { code: "AMOUNT_MISMATCH", severity: "MAJOR", clause_ref: "AMOUNT", detail: "Invoice total differs from the credit amount" } ] }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
          assert:
            - "LCTermsReview.${review_id}.terms_risk_score == 5.00"
            - "LCTermsReview.${review_id}.finding_count == 1"
            - "DocumentPresentation.${pres_id}.examination_risk_score == 25.00"
            - "DocumentPresentation.${pres_id}.examination_risk_score != LCTermsReview.${review_id}.terms_risk_score"
            - "DocumentPresentation.${pres_id}.status == DISCREPANT"
            - "DocumentPresentation.${pres_id}.open_finding_count == 1"
            - "DiscrepancyFinding.${terms_finding_id}.cure_status == OPEN and DiscrepancyFinding.${terms_finding_id}.raised_in_round == 0"
            - "ExportOrder.${order_id}.settlement_status == LC_ACCEPTED"

  # ===========================================================================
  # RULE 2 — Combinatorial formulas: ordering-sensitive rounding chain (mode b)
  #          and a self-referential evaluation order (mode c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: per_line_round_then_prorata_freight_residual_to_line_1_then_single_fx
        grounds:
          - calculations.commercial_invoice_totalling
          - calculations.incoterm_cost_allocation
          - entities.ShipmentLine.fields.line_extended_usd
          - entities.ShipmentLine.fields.apportioned_freight_usd
          - entities.TradeDocument.fields.declared_total_usd
          - entities.TradeDocument.fields.declared_total_invoice_currency
        distinguishing_aspect: |
          Mode (b), ordering-sensitive rounding: three identical lines of 3.000 x 10.0050
          each round to 30.02 so the subtotal is 90.06, whereas rounding the summed raw
          products would give 90.05; the 1000.00 seller freight pool apportions to
          333.33 x 3 = 999.99 so the 0.01 residual must land on the greatest line_net_usd
          with ties broken by the smaller line_no, i.e. line 1 becomes 333.34 while lines 2
          and 3 stay 333.33; and the single end-of-chain FX gives 994.51, not the 994.52 a
          per-component conversion produces.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted)."
            - "ExportOrder incoterm CFR (SELLER_BUCKETS = {B1,B2,B3,B4}: freight is seller-borne so it enters the invoice pool, but marine insurance B5 is the buyer's so INS is 0.00), destination_zone ZONE_1 (multiplier 1.00), invoice_currency EUR, fx_rate_usd_to_invoice 0.912345."
            - "Three ShipmentLine rows, line_no 1..3, each quantity 3.000 @ unit_price_usd 10.0050 with line_discount_pct 0 and gross_weight_kg 500.000; total gross 1500.000 kg so CW_UNITS = ceil(1500/1000) = 2."
            - "Screening decided NLR so fulfillment_status is COMPLIANCE_CLEARED (the invoice therefore runs the pre_shipment_invoice variant on ShipmentLine.quantity)."
            - "One VesselSailing in ZONE_1 with tariff_rate_per_1000kg_usd 500.00 and capacity_weight_kg 20000.000, plus one LCL FreightBooking of 1500.000 kg, so B4 = max(450.00, round(500.00 * 1.00 * 2, 2)) = 1000.00 and the seller freight pool F is exactly 1000.00."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Sakura Metals GK", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "CFR", incoterm_named_place: "CFR Tokyo", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "EUR", fx_rate_usd_to_invoice: 0.912345, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Brass fitting kit A", hs_code: "741220", quantity: 3.000, uom: "SET", unit_price_usd: 10.0050, line_discount_pct: 0, net_weight_kg: 450.000, gross_weight_kg: 500.000, package_count: 1 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line1_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 2, goods_description: "Brass fitting kit B", hs_code: "741220", quantity: 3.000, uom: "SET", unit_price_usd: 10.0050, line_discount_pct: 0, net_weight_kg: 450.000, gross_weight_kg: 500.000, package_count: 1 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line2_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 3, goods_description: "Brass fitting kit C", hs_code: "741220", quantity: 3.000, uom: "SET", unit_price_usd: 10.0050, line_discount_pct: 0, net_weight_kg: 450.000, gross_weight_kg: 500.000, package_count: 1 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line3_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "ONEY", vessel_name: "Nakdong", voyage_no: "N301", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-28T00:00:00Z", capacity_weight_kg: 20000.000, tariff_rate_per_1000kg_usd: 500.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v: "$.data.version" }
            - call: "POST /freight-bookings"
