          assert:
            - "Evidence write on another holder's right: HTTP 403 ERR_NOT_RESOURCE_OWNER (ownership from WaterRight.claimant_id)."
            - "Withdrawing another holder's application: HTTP 403 ERR_NOT_RESOURCE_OWNER (ownership inherited through the application's right)."
            - "Depositing into another holder's account: HTTP 403 ERR_NOT_RESOURCE_OWNER (ownership from WaterBankAccount.claimant_id) — not ERR_RIGHT_NOT_BANK_ENROLLED, and note the right IS enrolled so only the ownership rule can fire."
            - "Filing an adjudication claim on another holder's right: HTTP 403 ERR_NOT_RESOURCE_OWNER (ownership from the claimed right's claimant_id)."
            - "The identical claim filed by claimant A: HTTP 201 with filing_status FILED — the rule scopes by identity, not by role."
            - "Filing a protest that names claimant A as the protestant while calling as claimant B: HTTP 403 ERR_NOT_RESOURCE_OWNER (ownership from Protest.protestant_claimant_id) — NOT ERR_SELF_PROTEST_FORBIDDEN (priority 38), which would be the verdict if the identity checks were merged, and not ERR_INVALID_STATE (priority 17) even though the application is still DRAFT."
            - "None of the five refusals creates a row or moves a version."

      - name: rbac_segregation_of_duties_certifier_and_resolver_are_both_barred_from_deciding
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=23]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles[DecisionAuthority].description
        distinguishing_aspect: >-
          Two independently recorded user ids disqualify a decider — the study's
          certified_by_user_id and EVERY protest's resolved_by_user_id — and both hold
          even though the disqualified user is presenting a different role header on the
          decide call, so the check is on identity rather than on role. A third,
          uninvolved user decides the same application successfully.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; user u-101 certifies the HCU study, user u-202 resolves the single protest with a full 78.00 AF stipulated offset so the analysis finalizes at net_injury_af 0.00, and the application reaches READY_FOR_DECISION through the protest-clearance cascade."
