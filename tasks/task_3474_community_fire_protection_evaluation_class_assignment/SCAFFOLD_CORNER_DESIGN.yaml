  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_sheet_create_stale_and_fresh_versions
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[score-sheet-create-stale-cycle]"]
        distinguishing_aspect: "Reusing a pre-create cycle version on a second sheet create returns 412 ERR_STALE_VERSION; reading the fresh version and retrying succeeds and supersedes the first DRAFT."
        test_recipe:
          setup: ["community in SCORING; cycle version captured before first sheet create"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "OCC1", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v1}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v1}" }, as: FieldAnalyst, captures: { err: $.data.error_id } }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v2}" }, as: FieldAnalyst, captures: { sheet2: $.data.id } }
          assert:
            - "second create with the stale version returns 412 ERR_STALE_VERSION"
            - "retry with the fresh version succeeds (201) and ScoreSheet.${sheet1}.status == SUPERSEDED"
            - "EvaluationCycle.${cy_id}.version advanced by exactly 1 per successful create"

      - name: occ_bind_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-bind-stale-community]"]
        distinguishing_aspect: "Binding a second quote with the community version captured before the first bind returns 412 ERR_STALE_VERSION (disjoint coverage windows, so only OCC can reject it)."
        test_recipe:
          setup: ["EFFECTIVE class-10 community; property; two quotes on disjoint windows; community version captured before any bind"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "OCC2", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "6 Oak St", distance_to_nearest_hydrant_ft: 300, distance_to_nearest_station_road_miles: 1.0, construction_type: "FRAME", insured_value_cents: 200000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 1000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-01-01", coverage_end_date: "2027-06-30" }, as: Insurer, captures: { q1: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 1000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2028-01-01", coverage_end_date: "2028-06-30" }, as: Insurer, captures: { q2: $.data.id } }
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { v0: $.data.version } }
          trigger:
            - { call: "POST /ppc/premium-quotes/${q1}/bind", payload: { expected_community_version: "${v0}" }, as: Insurer }
            - { call: "POST /ppc/premium-quotes/${q2}/bind", payload: { expected_community_version: "${v0}" }, as: Insurer, captures: { err: $.data.error_id } }
          assert:
            - "first bind succeeds (200)"
            - "second bind with the pre-bind version returns 412 ERR_STALE_VERSION"
            - "PremiumQuote.${q2}.status remains QUOTED"

      - name: draft_sheet_recompute_on_reattestation
        claim_type: derived_field_reconciliation
        grounds: [calculations.comms_points, entities.ScoreSheet.fields.comms_points]
        distinguishing_aspect: "Re-attesting comms data while a DRAFT sheet exists in SCORING recomputes the same sheet in place (comms 0 -> 4) without creating a new sheet."
        test_recipe:
          setup: ["community in SCORING with comms attested at zeros and a DRAFT sheet"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Recompute", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          trigger:
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "GET /ppc/score-sheets/${sheet1}", as: FieldAnalyst }
          assert:
            - "ScoreSheet.${sheet1}.comms_points == 0 before re-attestation (captured at create)"
            - "after re-attestation the same sheet ${sheet1} recomputes to comms_points == 4 and remains DRAFT"

      - name: quoted_quote_expiry_on_activation
        claim_type: cascading_side_effects
        grounds: [state_machines.PremiumQuote.QUOTED_to_EXPIRED]
        excluded_because:
          difficulty_instance: "transitive_cascade / classification_activation_cascade"
          rationale: "That instance asserts the QUOTED quote expires while the BOUND quote survives the activation cascade."

  # ---------------------------------------------------------------------------
  # Consistency model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A created entity is fully visible through its single-resource GET within the same logical instant — no eventual-consistency lag."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Immediate", state_code: "WA", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "VOLUNTEER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /ppc/communities/${c_id}", as: Insurer }
          assert:
            - "GET returns state_code WA, dept-seeded fields visible via the departments list, and status REGISTERED immediately"
