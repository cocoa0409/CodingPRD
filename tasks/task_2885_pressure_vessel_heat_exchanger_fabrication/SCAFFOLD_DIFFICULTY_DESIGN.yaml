              payload: { job_id: "${job_id}", furnace_code: "FURNACE_A", scheduled_start: "2026-08-10T08:00:00.000Z", scheduled_end: "2026-08-10T12:00:00.000Z", soak_temp_f: 1150, weld_ids: ["${w1_id}"] }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /pwht-batches"
              payload: { job_id: "${job_id}", furnace_code: "FURNACE_A", scheduled_start: "2026-08-10T13:00:00.000Z", scheduled_end: "2026-08-10T15:00:00.000Z", soak_temp_f: 1150, weld_ids: [] }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { err_both_violated: $.data.error_id }
            - call: "POST /pwht-batches"
              payload: { job_id: "${job_id}", furnace_code: "FURNACE_A", scheduled_start: "2026-08-10T13:00:00.000Z", scheduled_end: "2026-08-10T15:00:00.000Z", soak_temp_f: 1150, weld_ids: ["${w2_id}"] }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { err_temporal_only: $.data.error_id }
            - call: "POST /pwht-batches"
              payload: { job_id: "${job_id}", furnace_code: "FURNACE_B", scheduled_start: "2026-08-10T13:00:00.000Z", scheduled_end: "2026-08-10T15:00:00.000Z", soak_temp_f: 1150, weld_ids: [] }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { err_constraint_only: $.data.error_id }
            - call: "POST /pwht-batches"
              payload: { job_id: "${job_id}", furnace_code: "FURNACE_B", scheduled_start: "2026-08-10T13:00:00.000Z", scheduled_end: "2026-08-10T15:00:00.000Z", soak_temp_f: 1150, weld_ids: ["${w2_id}"] }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { b2_id: $.data.id }
          assert:
            - "Cell (both violated): ${err_both_violated} == ERR_EMPTY_WELD_SET with HTTP 409 — the 13:00 start falls inside B-1's 12:00 end plus COOLDOWN_BUFFER_MINUTES = 180 (i.e. before 15:00) in the same FURNACE_A, so priority 100 is also violated, yet priority 88 answers first"
            - "Cell (temporal only): ${err_temporal_only} == ERR_FURNACE_WINDOW_CONFLICT with HTTP 409 — a non-empty weld set clears priority 88 and exposes the masked scheduler conflict"
            - "Cell (constraint only): ${err_constraint_only} == ERR_EMPTY_WELD_SET with HTTP 409 — FURNACE_B is unoccupied, so priority 88 fires alone with the identical error_id"
            - "Cell (neither violated): the fourth call returns HTTP 201 and PWHTBatch.${b2_id}.status == SCHEDULED, weld_count == 1, governing_thickness_in == 0.5000 and required_soak_minutes == 30 (round_half_up(0.5000 * 60) = 30, above the MINIMUM_SOAK_MINUTES floor of 15)"
            - "ProductionWeld.${w2_id}.pwht_batch_id == ${b2_id} and pwht_status == PENDING, while ProductionWeld.${w1_id}.pwht_batch_id is still ${b1_id}"
            - "GET /pwht-batches?job_id=${job_id} returns exactly 2 rows, so none of the three refused requests left a partially created batch behind"

  - rule_id: boundary_precision_check
    instances:
      - name: boundary_category_b_full_rt_thickness_threshold_and_ut_crossover
        grounds:
          - calculations.nde_coverage_requirement
          - calculations.nde_coverage_requirement.constants.B_FULL_RT_THICKNESS_THRESHOLD_IN
          - calculations.nde_coverage_requirement.constants.UT_THICKNESS_THRESHOLD_IN
          - endpoints.POST_/vessel-jobs/{job_id}/production-welds
          - entities.ProductionWeld.fields.required_volumetric_pct
          - entities.ProductionWeld.fields.volumetric_method
        distinguishing_aspect: |
          Two independent inclusive thresholds are crossed on the SAME request field at
          4-decimal resolution, and they move different outputs: 1.500 in flips
          required_volumetric_pct from 25 to 100 while leaving the method at RT, and 2.000 in
          flips volumetric_method from RT to UT while leaving the percentage at 100. A
          `>` implementation of either comparison, or a 2-decimal truncation of thickness_in,
          is caught by a single joint one ten-thousandth below the line.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers (SoD) and one WeldingEngineer."
            - "A PRESSURE_VESSEL job J-2885-11 (design_code DIV1, so the DIV2 blanket rule is out of play) whose SHELL and HEAD sheets are both APPROVED at rt_extent_declared FULL, leaving the job in FAB_PLANNING."
            - "Heat H-4471 (SA-516-70 PLATE, carbon steel, material_class CARBON) ACCEPTED, with parts SH-01 (SHELL) and HD-01 (HEAD) ISSUED, so no joint owes a PT surface examination."
            - "WPS-1 QUALIFIED with thickness range [0.1875, 3.0000], wide enough to admit every joint below."
            - "No joint is welded and the examination plan is never run: the assertions read the sizing that POST production-welds itself stamps on each row."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
