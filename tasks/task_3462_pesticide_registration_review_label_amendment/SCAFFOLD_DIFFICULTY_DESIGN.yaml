  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancellation_then_vacatur_restores_label_universe
        grounds:
          - state_machines.Product.CANCELLED_to_REGISTERED
          - state_machines.Tolerance.REVOKED_to_ESTABLISHED
          - state_machines.UseSite.REMOVED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: the product's label universe — product.status plus the
          per-status multisets of its tolerances and use sites. The forward action
          (cancellation order) mutates all of them; the compensating action (vacatur)
          restores exactly the pre-order multiset {tolerances: 1 ESTABLISHED +
          1 PROPOSED; use sites: 1 ACTIVE; product REGISTERED}, while the state
          registration stays REVOKED (documented non-conserved asymmetry).
