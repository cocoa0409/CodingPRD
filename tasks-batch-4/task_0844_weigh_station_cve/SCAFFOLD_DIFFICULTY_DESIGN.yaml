  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: inspection_state_beats_bay_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_SCREENING_NOT_REFERRED]
          - errors[ERR_BAY_WINDOW_CONFLICT]
        distinguishing_aspect: "On POST /inspections a request that both targets a CLEARED (non-REFERRED) screening (state, p6) and overlaps a busy bay window (business_temporal, p9) returns ERR_SCREENING_NOT_REFERRED — state outranks temporal."
        test_recipe:
          setup:
