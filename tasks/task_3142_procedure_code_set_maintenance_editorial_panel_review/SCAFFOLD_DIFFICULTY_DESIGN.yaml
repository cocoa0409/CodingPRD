            - call: "POST /cpt/code-changes"
              payload: { code: "00009", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_i}", society_id: "${soc_i}", clinical_evidence_tier: "TIER_I", evidence_sufficiency_index: 50, procedure_volume_threshold: 900, organ_system_count: 2, descriptor_current: "Placeholder descriptor", descriptor_proposed: "Placeholder descriptor revised", guidelines: "None", parenthetical_instructions: "None" }
              as: EditorialStaff
