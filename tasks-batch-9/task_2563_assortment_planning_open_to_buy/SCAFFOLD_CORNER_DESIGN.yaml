            - "${budget} is therefore turn-driven: the two other candidates (84,375,000 and 108,000,000) both lose, which is the reverse of the department-capped ordinary case"
            - "${slots_total} == 10 and ${slots_open} == 10: tier_share 45,562,500 (GOOD 4500 bps), budget_share 52,396,875 (times sales_index 11500), cost_per_option 8 * 40 * 1800 == 576,000, affordable_options floor(52,396,875 / 576,000) == 90, and max(2, min(breadth_target 10, 90)) == 10, so breadth_target is the binding limb here"
            - "${target_units} == 368 (round_half_up(8 * 40 * 11500 / 10000)) and each of the four equal 2500 bps cells allocates exactly 92 units with zero remainder to reconcile"
            - "${st1} == 6000, ${rate1} == 600 and ${otb1} == 24300000 on the single month, confirming the larger budget did not leak into the month-level reserve arithmetic, which reads only planned_margin_bps and the month's own authored figures"

      - name: variance_input_set_ignores_months_that_never_opened
        claim_type: input_set_filtering
        grounds:
          - calculations.variance_verdict
          - calculations.variance_verdict.input_set
          - entities.CategoryPlan.fields.sales_variance_bps
          - endpoints[POST /otb/actuals-posts]
        distinguishing_aspect: "The declared input set is PlanMonth rows with status IN_SEASON or CLOSED, so a LOCKED_PLAN month contributes to NEITHER side of the ratio - not its actuals (it has none) and, crucially, not its plan. The second month here carries a larger planned_sales_cents than the first, so wrongly admitting it - at full plan or prorated - moves the verdict from WATCH to BREACH and would additionally drive the plan into REFORECAST_OPEN, making the omission loudly observable."
