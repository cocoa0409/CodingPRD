scenario: "Licensed Store Program & Host-Venue Kiosk Operations (Starbucks Licensed Stores): licensee agreements with grocery, airport, campus and hospital hosts covering brand standards and royalty on sales, product assortment restrictions by venue with limited equipment footprints, barista training certification delivered to licensee employees with audit verification, supply chain ordering through approved distributors with par levels and proprietary item controls, loyalty program participation rules where earning and redemption differ from company-operated stores, promotional calendar alignment despite different pricing authority, host venue hours, security and access constraints"
domain_name: licensed-store-program
api_prefix: /licensing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal display name of the licensee operator company" }
      - { name: legal_entity_code, type: string, source: input, description: "Globally unique legal entity code; duplicate rejected with ERR_DUPLICATE_LEGAL_ENTITY_CODE", constraints: "unique across all licensees" }

  - name: HostVenue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: venue_type, type: enum, source: input, description: "Venue category driving assortment restrictions", constraints: "one of GROCERY, AIRPORT, CAMPUS, HOSPITAL" }
      - { name: open_time_utc, type: string, source: input, description: "Host venue daily opening time, HH:MM 24h UTC; kiosk inspections and operations must fall inside [open_time_utc, close_time_utc]" }
      - { name: close_time_utc, type: string, source: input, description: "Host venue daily closing time, HH:MM 24h UTC; must be strictly after open_time_utc" }
      - { name: access_restricted, type: boolean, source: input, description: "Whether the venue imposes badge/escort access constraints on visits" }
      - { name: max_equipment_footprint_units, type: integer, source: input, description: "Maximum total equipment footprint units the venue permits across all its licensed stores; must be >= 1" }
      - { name: security_badge_required, type: boolean, source: input, description: "Whether inspectors must hold a venue security badge" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; the operating company" }
      - { name: venue_id, type: string, source: input, description: "FK -> HostVenue.id; at most one agreement per venue may be in PENDING_ACCEPTANCE or ACTIVE or SUSPENDED at any time" }
      - { name: royalty_tiers, type: array, source: input, description: "Array of {threshold_cents, rate_bps}; first threshold must be 0, thresholds strictly increasing, rate_bps in 1..10000; applied marginally" }
      - { name: royalty_basis, type: enum, source: input, description: "Recognition basis for royalty statements", constraints: "one of CASH, ACCRUAL" }
      - { name: term_start_date, type: string, source: input, description: "ISO date; agreement term start" }
      - { name: term_end_date, type: string, source: input, description: "ISO date; must be strictly after term_start_date" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: DRAFT, constraints: "one of DRAFT, PENDING_ACCEPTANCE, ACTIVE, SUSPENDED, TERMINATED, EXPIRED" }
      - { name: breach_strikes, type: integer, source: system, description: "Count of escalated corrective actions; at BREACH_SUSPEND_THRESHOLD (2) the agreement auto-suspends", default: 0 }

  - name: LicensedStore
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseeAgreement canonical parent: FK -> LicenseAgreement.id" }
      - { name: store_code, type: string, source: input, description: "Store code unique within the parent agreement", constraints: "unique per agreement_id" }
      - { name: equipment_footprint_units, type: integer, source: input, description: "Footprint units this kiosk occupies; sum over the venue's stores (agreements in ACTIVE or SUSPENDED) must not exceed venue max; must be >= 1" }
      - { name: operating_status, type: enum, source: system, description: "Operating dimension, evolves independently of compliance_posture", default: PROVISIONING, constraints: "one of PROVISIONING, CERT_PENDING, OPERATING, SUSPENDED, DELICENSED" }
      - { name: compliance_posture, type: enum, source: computed, description: "Derived dimension per calculation store_posture_recompute; gates assortment and promotions", default: GOOD_STANDING, constraints: "one of GOOD_STANDING, WATCH, PROBATION" }

  - name: ProductItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Globally unique SKU; duplicate rejected with ERR_SKU_CONFLICT" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "Product category", constraints: "one of BEVERAGE_CORE, BEVERAGE_SEASONAL, FOOD, MERCHANDISE, PROPRIETARY_INGREDIENT" }
      - { name: proprietary, type: boolean, source: input, description: "Proprietary item control flag; proprietary items cannot be added to a store in PROBATION posture" }
      - { name: venue_type_restrictions, type: array, source: input, description: "Non-empty array of venue_type values where sale is allowed; empty array means all venue types allowed" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Distributor unit cost; must be >= 1" }
      - { name: case_pack_units, type: integer, source: input, description: "Case pack size used by par replenishment rounding; must be >= 1" }
      - { name: footprint_units, type: integer, source: input, description: "Equipment footprint units this product's equipment occupies when assorted; must be >= 0" }

  - name: StoreAssortmentItem
    parent: LicensedStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> LicensedStore.id" }
      - { name: product_item_id, type: string, source: input, description: "FK -> ProductItem.id" }
      - { name: par_level, type: integer, source: input, description: "Target on-hand level; must be in 0..1000 (MAX_PAR_LEVEL)" }
      - { name: on_hand, type: integer, source: system, description: "Derived stock level; incremented by supply order receipts, never negative", default: 0 }
      - { name: active, type: boolean, source: system, description: "Soft-delete flag; DELETE sets false, row remains queryable", default: true }

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor display name" }
      - { name: approved, type: boolean, source: system, description: "Approved-distributor flag; only approved distributors may receive submitted orders", default: false }
      - { name: lead_time_days, type: integer, source: input, description: "Nominal lead time; must be >= 0" }

  - name: SupplyOrder
    parent: LicensedStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> LicensedStore.id" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: auto_replenish, type: boolean, source: input, description: "When true, lines are generated from assortment par shortfalls at creation", default: false }
      - { name: status, type: enum, source: system, description: "Order lifecycle", default: DRAFT, constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, IN_TRANSIT, RECEIVED, DISPUTED, CLOSED, CANCELLED" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Sum of line_cost_cents over lines, per supply_order_pricing; 0 for an order with no lines" }
      - { name: received_value_cents, type: integer, source: system, description: "Sum over lines of round_half_up(quantity_received * unit_cost_cents * (10000 - discount_bps) / 10000); set at receive", default: 0 }
      - { name: credit_cents, type: integer, source: system, description: "Compensating credit granted at dispute resolution", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }

  - name: SupplyOrderLine
    parent: SupplyOrder
    common_fields: false
    fields:
      - { name: supply_order_id, type: string, source: system, description: "FK -> SupplyOrder.id" }
      - { name: product_item_id, type: string, source: system, description: "FK -> ProductItem.id" }
      - { name: quantity_ordered, type: integer, source: system, description: "Units ordered; from request lines or par_replenishment_quantity when auto_replenish" }
      - { name: quantity_received, type: integer, source: system, description: "Units received; set by receive call", default: 0 }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot of ProductItem.unit_cost_cents at order creation" }
      - { name: discount_bps, type: integer, source: system, description: "Volume discount for this line: 500 when quantity_ordered >= 100, else 0" }
      - { name: line_cost_cents, type: integer, source: computed, description: "round_half_up(quantity_ordered * unit_cost_cents * (10000 - discount_bps) / 10000); per-line rounding pinned by supply_order_pricing" }

  - name: Employee
    parent: Licensee
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: role_tag, type: enum, source: input, description: "Staffing role; only BARISTA certifications count toward staffing minimums", constraints: "one of BARISTA, SHIFT_LEAD, STORE_MANAGER" }
      - { name: active, type: boolean, source: input, description: "Employment flag", default: true }

  - name: Certification
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: program_code, type: string, source: input, description: "Training program code, e.g. BARISTA_CORE" }
      - { name: status, type: enum, source: system, description: "Certification lifecycle", default: ENROLLED, constraints: "one of ENROLLED, EXAM_PASSED, CERTIFIED, AUDIT_FAILED, EXPIRED" }
      - { name: exam_score, type: integer, source: system, description: "Most recent recorded exam score 0..100" }
      - { name: exam_attempts, type: integer, source: system, description: "Count of recorded exams", default: 0 }
      - { name: proctor_anomaly, type: boolean, source: system, description: "Whether the recorded exam carried a proctor anomaly flag (audited variant)", default: false }
      - { name: proctor_inspector_id, type: string, source: system, description: "Opaque X-User-ID of the BrandInspector who recorded the exam" }
      - { name: audit_inspector_id, type: string, source: system, description: "Opaque X-User-ID of the BrandInspector who audit-verified; must differ from proctor_inspector_id" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of audit verification" }
      - { name: expires_at, type: datetime, source: system, description: "certified_at + CERT_VALIDITY_DAYS (365) days" }

  - name: SalesReport
    parent: LicensedStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> LicensedStore.id" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; inclusive period start" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; inclusive period end; must be >= period_start_date" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Gross sales; must be >= 0" }
      - { name: returns_cents, type: integer, source: input, description: "Returns; must be >= 0" }
      - { name: loyalty_redemption_cents, type: integer, source: input, description: "Loyalty redemption value granted; must be >= 0" }
      - { name: net_sales_cents, type: integer, source: computed, description: "gross_sales_cents - returns_cents - loyalty_redemption_cents, computed at finalize; must be >= 0 else ERR_INVALID_REQUEST" }
      - { name: status, type: enum, source: system, description: "Report lifecycle", default: DRAFT, constraints: "one of DRAFT, FINALIZED" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of finalization; drives CASH vs ACCRUAL recognition" }

  - name: RoyaltyStatement
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; inclusive statement period start" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; inclusive statement period end; must be >= period_start_date" }
      - { name: basis, type: enum, source: system, description: "Copy of LicenseAgreement.royalty_basis at generation time", constraints: "one of CASH, ACCRUAL" }
      - { name: recognized_sales_cents, type: integer, source: computed, description: "Recognized net sales per royalty_recognition variant" }
      - { name: royalty_amount_cents, type: integer, source: computed, description: "Tiered royalty per royalty_recognition" }
      - { name: adjustment_delta_cents, type: integer, source: system, description: "Signed recognized-sales delta applied by adjust; royalty recomputed on recognized_sales_cents + delta", default: 0 }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", default: DRAFT, constraints: "one of DRAFT, ISSUED, DISPUTED, ADJUSTED, FINAL, SUPERSEDED" }

  - name: Inspection
    parent: LicensedStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> LicensedStore.id" }
      - { name: inspector_id, type: string, source: system, description: "Opaque X-User-ID of the scheduling BrandInspector" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Scheduled start; half-open interval [start, end) for overlap purposes" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Scheduled end; must be strictly after scheduled_start_utc" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", default: SCHEDULED, constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }
      - { name: result, type: enum, source: system, description: "Outcome set at completion", default: NONE, constraints: "one of NONE, PASSED, FAILED" }
      - { name: total_score, type: integer, source: computed, description: "Weighted composite per inspection_composite_result" }
      - { name: critical_fail, type: boolean, source: system, description: "Critical-fail override flag recorded at completion", default: false }

  - name: CorrectiveAction
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; created automatically by a FAILED inspection" }
      - { name: finding_code, type: string, source: system, description: "CRITICAL when critical_fail, else the failing category name" }
      - { name: due_at, type: datetime, source: system, description: "inspection completion timestamp + CORRECTIVE_DUE_DAYS (14) days" }
      - { name: status, type: enum, source: system, description: "Corrective lifecycle; REOPENED -> SUBMITTED cycle permitted", default: OPEN, constraints: "one of OPEN, SUBMITTED, VERIFIED, REOPENED, ESCALATED" }
      - { name: evidence_note, type: string, source: system, description: "Latest evidence note submitted by the licensee" }
      - { name: reopen_count, type: integer, source: system, description: "Times this action was reopened; reopen rejected at MAX_REOPENS (2)", default: 0 }
      - { name: verified_by, type: string, source: system, description: "Opaque X-User-ID of verifying BrandInspector; must differ from the completing inspector of the parent Inspection" }

  - name: LoyaltyMember
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique member email; duplicate rejected with ERR_MEMBER_DUPLICATE_EMAIL" }
      - { name: points_balance, type: integer, source: system, description: "Current redeemable points; invariant points_balance == lifetime_earned - lifetime_redeemed", default: 0 }
      - { name: lifetime_earned, type: integer, source: system, description: "Cumulative points earned including ADJUST credits", default: 0 }
      - { name: lifetime_redeemed, type: integer, source: system, description: "Cumulative points redeemed including ADJUST debits", default: 0 }

  - name: LoyaltyAccountEvent
    parent: LoyaltyMember
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> LoyaltyMember.id" }
      - { name: store_id, type: string, source: input, description: "FK -> LicensedStore.id; required when store_format is LICENSED, must be null when COMPANY_OPERATED" }
      - { name: store_format, type: enum, source: input, description: "Format of the store where the event occurred; licensed stores earn and redeem at reduced rates", constraints: "one of LICENSED, COMPANY_OPERATED" }
      - { name: event_type, type: enum, source: input, description: "Event kind", constraints: "one of EARN, REDEEM, ADJUST" }
      - { name: purchase_cents, type: integer, source: input, description: "Purchase amount; required for EARN and REDEEM, >= 0" }
      - { name: points, type: integer, source: system, description: "Points credited (EARN) or debited (REDEEM) per loyalty_points_engine; for ADJUST the signed input value is used" }
      - { name: redemption_cents, type: integer, source: computed, description: "Cash value of a REDEEM event: points * POINT_VALUE_CENTS (100), capped per loyalty_points_engine" }

  - name: PromotionCampaign
    parent: LicensedStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> LicensedStore.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: start_date, type: string, source: input, description: "ISO date; inclusive closed-interval start" }
      - { name: end_date, type: string, source: input, description: "ISO date; inclusive closed-interval end; must be >= start_date" }
      - { name: discount_pct, type: integer, source: input, description: "Licensee discount authority 1..90 percent" }
      - { name: floor_price_cents, type: integer, source: input, description: "Brand floor price; licensee may not discount below it; must be >= 1" }
      - { name: status, type: enum, source: system, description: "Campaign lifecycle", default: PLANNED, constraints: "one of PLANNED, ACTIVE, ENDED, RECONCILED, CANCELLED" }
      - { name: reconciled, type: boolean, source: system, description: "Set true at reconcile", default: false }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_ACCEPTANCE
        trigger: "POST /licensing/license-agreements/{id}/submit"
        actor: BrandProgramAdmin
        preconditions:
          - "agreement.status == DRAFT"
        side_effects:
          - "increments LicenseAgreement.version by 1"
      - from: PENDING_ACCEPTANCE
        to: ACTIVE
        trigger: "POST /licensing/license-agreements/{id}/accept"
        actor: HostVenueManager
        preconditions:
          - "agreement.status == PENDING_ACCEPTANCE"
          - "acting HostVenueManager X-User-ID == agreement.venue_id"
          - "no other agreement for the same venue_id has status in {PENDING_ACCEPTANCE, ACTIVE, SUSPENDED}"
        side_effects:
          - "increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/license-agreements/{id}/suspend OR system cascade when breach_strikes reaches BREACH_SUSPEND_THRESHOLD (2)"
        actor: BrandProgramAdmin | system
        preconditions:
          - "agreement.status == ACTIVE (manual suspend only; the system cascade checks ACTIVE at fire time)"
        side_effects:
          - "every LicensedStore of this agreement with operating_status == OPERATING transitions to SUSPENDED"
          - "each store suspended by this cascade cancels its SupplyOrders with status in {DRAFT, SUBMITTED} (status -> CANCELLED)"
          - "each store suspended by this cascade transitions its PromotionCampaigns with status == ACTIVE to ENDED"
          - "increments LicenseAgreement.version by 1 and each mutated store's version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/license-agreements/{id}/reinstate"
        actor: BrandProgramAdmin
        preconditions:
          - "agreement.status == SUSPENDED"
        side_effects:
          - "resets agreement.breach_strikes to 0"
          - "increments LicenseAgreement.version by 1"
          - "stores remain SUSPENDED; each requires an explicit POST /licensing/stores/{id}/resume"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/license-agreements/{id}/terminate"
        actor: BrandProgramAdmin
        preconditions:
          - "agreement.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "every LicensedStore of this agreement not already DELICENSED transitions to DELICENSED"
          - "each delicensed store cancels SupplyOrders in {DRAFT, SUBMITTED, APPROVED} and PromotionCampaigns in {PLANNED, ACTIVE} (-> CANCELLED; ACTIVE campaigns -> ENDED first is NOT applied: they go directly to CANCELLED)"
          - "increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licensing/license-agreements/{id}/terminate"
        actor: BrandProgramAdmin
        preconditions:
          - "agreement.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "same cascade as ACTIVE -> TERMINATED"
          - "increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /licensing/license-agreements/{id}/sweep-expiry with logical clock date strictly after term_end_date"
        actor: BrandProgramAdmin
        preconditions:
          - "agreement.status in {ACTIVE, SUSPENDED}"
          - "logical clock date > agreement.term_end_date"
        side_effects:
          - "same store/order/campaign cascade as terminate"
          - "increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /licensing/license-agreements/{id}/sweep-expiry with logical clock date strictly after term_end_date"
        actor: BrandProgramAdmin
        preconditions:
          - "agreement.status in {ACTIVE, SUSPENDED}"
          - "logical clock date > agreement.term_end_date"
        side_effects:
          - "same cascade as terminate"
          - "increments LicenseAgreement.version by 1"

  - entity: LicensedStore
    initial_state: PROVISIONING
    terminal_states: [DELICENSED]
    transitions:
      - from: PROVISIONING
        to: CERT_PENDING
        trigger: "POST /licensing/stores/{id}/request-certification"
        actor: LicenseeManager
        preconditions:
          - "store.operating_status == PROVISIONING"
        side_effects:
          - "increments LicensedStore.version by 1"
      - from: CERT_PENDING
        to: OPERATING
        trigger: "POST /licensing/stores/{id}/begin-operations"
        actor: LicenseeManager
        preconditions:
          - "store.operating_status == CERT_PENDING"
          - "parent agreement.status == ACTIVE"
          - "at least MIN_CERTIFIED_BARISTAS (2) active BARISTA employees of the agreement's licensee hold a Certification with status == CERTIFIED"
          - "sum of equipment_footprint_units over stores of the venue (agreements in {ACTIVE, SUSPENDED}) <= venue.max_equipment_footprint_units"
        side_effects:
          - "recomputes store.compliance_posture per store_posture_recompute"
          - "increments LicensedStore.version by 1"
      - from: OPERATING
        to: SUSPENDED
        trigger: "POST /licensing/stores/{id}/suspend OR agreement-level cascade"
        actor: BrandProgramAdmin | system
        preconditions:
          - "store.operating_status == OPERATING (manual suspend)"
        side_effects:
          - "cancels the store's SupplyOrders in {DRAFT, SUBMITTED}"
          - "transitions the store's ACTIVE PromotionCampaigns to ENDED"
          - "increments LicensedStore.version by 1"
      - from: SUSPENDED
        to: OPERATING
        trigger: "POST /licensing/stores/{id}/resume"
        actor: BrandProgramAdmin
        preconditions:
          - "store.operating_status == SUSPENDED"
          - "parent agreement.status == ACTIVE"
        side_effects:
          - "recomputes store.compliance_posture per store_posture_recompute"
          - "increments LicensedStore.version by 1"
      - from: OPERATING
        to: DELICENSED
        trigger: "POST /licensing/stores/{id}/delicense OR agreement terminate/expire cascade"
        actor: BrandProgramAdmin | system
        preconditions:
          - "store.operating_status != DELICENSED"
        side_effects:
          - "cancels SupplyOrders in {DRAFT, SUBMITTED, APPROVED}"
          - "transitions PromotionCampaigns in {PLANNED} to CANCELLED and {ACTIVE} to CANCELLED"
          - "increments LicensedStore.version by 1"
      - from: SUSPENDED
        to: DELICENSED
        trigger: "POST /licensing/stores/{id}/delicense OR agreement terminate/expire cascade"
        actor: BrandProgramAdmin | system
        preconditions:
          - "store.operating_status != DELICENSED"
        side_effects:
          - "same cascade as OPERATING -> DELICENSED"
          - "increments LicensedStore.version by 1"
      - from: PROVISIONING
        to: DELICENSED
        trigger: "POST /licensing/stores/{id}/delicense OR agreement terminate/expire cascade"
        actor: BrandProgramAdmin | system
        preconditions:
          - "store.operating_status != DELICENSED"
        side_effects:
          - "same cascade as OPERATING -> DELICENSED"
          - "increments LicensedStore.version by 1"
      - from: CERT_PENDING
        to: DELICENSED
        trigger: "POST /licensing/stores/{id}/delicense OR agreement terminate/expire cascade"
        actor: BrandProgramAdmin | system
        preconditions:
          - "store.operating_status != DELICENSED"
        side_effects:
          - "same cascade as OPERATING -> DELICENSED"
          - "increments LicensedStore.version by 1"
    parallel_dimensions:
      note: |
        operating_status (PROVISIONING -> CERT_PENDING -> OPERATING -> SUSPENDED -> OPERATING -> DELICENSED)
        and compliance_posture (GOOD_STANDING / WATCH / PROBATION, computed per store_posture_recompute)
        evolve independently on the same LicensedStore row: an inspection failure moves
        posture to WATCH without touching operating_status; a manual suspend moves
        operating_status to SUSPENDED without touching posture.

  - entity: SupplyOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/supply-orders/{id}/submit"
        actor: LicenseeManager
        preconditions:
          - "order.status == DRAFT"
          - "order has at least one line (else ERR_EMPTY_ORDER)"
          - "store.operating_status == OPERATING"
          - "distributor.approved == true"
          - "order.total_cost_cents <= ORDER_BUDGET_MAX_CENTS (20000000)"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "increments SupplyOrder.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /licensing/supply-orders/{id}/approve"
        actor: DistributorAgent
        preconditions:
          - "order.status == SUBMITTED"
          - "acting DistributorAgent X-User-ID == order.distributor_id"
        side_effects:
          - "increments SupplyOrder.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /licensing/supply-orders/{id}/reject"
        actor: DistributorAgent
        preconditions:
          - "order.status == SUBMITTED"
          - "acting DistributorAgent X-User-ID == order.distributor_id"
        side_effects:
          - "increments SupplyOrder.version by 1"
      - from: APPROVED
        to: IN_TRANSIT
        trigger: "POST /licensing/supply-orders/{id}/ship"
        actor: DistributorAgent
        preconditions:
          - "order.status == APPROVED"
          - "acting DistributorAgent X-User-ID == order.distributor_id"
        side_effects:
          - "increments SupplyOrder.version by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /licensing/supply-orders/{id}/receive"
        actor: LicenseeManager
        preconditions:
          - "order.status == IN_TRANSIT"
          - "each received_lines entry references a line of this order with 0 <= quantity_received <= quantity_ordered"
        side_effects:
          - "sets each line.quantity_received; unlisted lines keep 0"
          - "sets order.received_value_cents = sum over lines of round_half_up(quantity_received * unit_cost_cents * (10000 - discount_bps) / 10000)"
          - "for each line, increments StoreAssortmentItem.on_hand (matched by store_id and product_item_id, active == true) by quantity_received"
          - "increments SupplyOrder.version by 1"
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /licensing/supply-orders/{id}/dispute"
        actor: LicenseeManager
        preconditions:
          - "order.status == RECEIVED"
        side_effects:
          - "increments SupplyOrder.version by 1"
      - from: DISPUTED
        to: CLOSED
        trigger: "POST /licensing/supply-orders/{id}/resolve-dispute"
        actor: DistributorAgent
        preconditions:
          - "order.status == DISPUTED"
          - "acting DistributorAgent X-User-ID == order.distributor_id"
          - "0 <= credit_cents <= order.total_cost_cents - order.received_value_cents (the shortage)"
        side_effects:
          - "sets order.credit_cents; invariant total_cost_cents == received_value_cents + credit_cents holds exactly when credit equals the shortage"
          - "increments SupplyOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /licensing/supply-orders/{id}/cancel OR store suspend/delicense cascade"
        actor: LicenseeManager | system
        preconditions:
          - "order.status in {DRAFT, SUBMITTED} (manual cancel)"
        side_effects:
          - "increments SupplyOrder.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /licensing/supply-orders/{id}/cancel OR store suspend/delicense cascade"
        actor: LicenseeManager | system
        preconditions:
          - "order.status in {DRAFT, SUBMITTED} (manual cancel)"
        side_effects:
          - "increments SupplyOrder.version by 1"

  - entity: Certification
    initial_state: ENROLLED
    terminal_states: [AUDIT_FAILED, EXPIRED]
    transitions:
      - from: ENROLLED
        to: EXAM_PASSED
        trigger: "POST /licensing/certifications/{id}/record-exam"
        actor: BrandInspector
        preconditions:
          - "certification.status == ENROLLED"
          - "certification_exam_outcome (raw or audited variant per proctor_anomaly) == PASS"
        side_effects:
          - "sets exam_score, proctor_anomaly, proctor_inspector_id (acting inspector X-User-ID); increments exam_attempts"
          - "increments Certification.version by 1"
      - from: ENROLLED
        to: ENROLLED
        trigger: "POST /licensing/certifications/{id}/record-exam with a failing score"
        actor: BrandInspector
        preconditions:
          - "certification.status == ENROLLED"
        side_effects:
          - "sets exam_score, proctor_anomaly, proctor_inspector_id; increments exam_attempts; status remains ENROLLED"
          - "increments Certification.version by 1"
      - from: EXAM_PASSED
        to: CERTIFIED
        trigger: "POST /licensing/certifications/{id}/audit-verify"
        actor: BrandInspector
        preconditions:
          - "certification.status == EXAM_PASSED"
          - "acting inspector X-User-ID != certification.proctor_inspector_id (segregation of duties)"
          - "an ACTIVE LicenseAgreement exists for the employee's licensee_id"
        side_effects:
          - "sets audit_inspector_id, certified_at (logical clock), expires_at = certified_at + 365 days"
          - "recomputes compliance_posture of every non-DELICENSED store of the employee's licensee per store_posture_recompute"
          - "increments Certification.version by 1"
      - from: EXAM_PASSED
        to: AUDIT_FAILED
        trigger: "POST /licensing/certifications/{id}/audit-reject"
        actor: BrandInspector
        preconditions:
          - "certification.status == EXAM_PASSED"
          - "acting inspector X-User-ID != certification.proctor_inspector_id"
        side_effects:
          - "sets audit_inspector_id"
          - "increments Certification.version by 1"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /licensing/certifications/sweep-expiry with logical clock >= expires_at"
        actor: BrandProgramAdmin
        preconditions:
          - "certification.status == CERTIFIED"
          - "logical clock timestamp >= certification.expires_at"
        side_effects:
          - "recomputes compliance_posture of every non-DELICENSED store of the employee's licensee; if a store's posture becomes PROBATION, its PLANNED PromotionCampaigns transition to CANCELLED"
          - "increments Certification.version by 1 and each recomputed store's version by 1"

  - entity: SalesReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /licensing/sales-reports/{id}/finalize"
        actor: LicenseeManager
        preconditions:
          - "report.status == DRAFT"
          - "no other FINALIZED SalesReport for the same store has a date interval overlapping [period_start_date, period_end_date] under closed-interval semantics"
          - "net_sales_cents = gross - returns - loyalty_redemption >= 0"
        side_effects:
          - "computes and stores net_sales_cents; sets finalized_at to the logical clock"
          - "increments SalesReport.version by 1"

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /licensing/royalty-statements/{id}/issue"
        actor: BrandProgramAdmin
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "amounts are NOT recomputed at issue; they were fixed at generation"
          - "increments RoyaltyStatement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /licensing/royalty-statements/{id}/dispute"
        actor: LicenseeManager
        preconditions:
          - "statement.status == ISSUED"
        side_effects:
          - "increments RoyaltyStatement.version by 1"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /licensing/royalty-statements/{id}/adjust"
        actor: BrandProgramAdmin
        preconditions:
          - "statement.status == DISPUTED"
          - "recognized_sales_cents + adjustment_delta_cents >= 0"
        side_effects:
          - "sets adjustment_delta_cents; recomputes royalty_amount_cents per royalty_recognition on (recognized_sales_cents + adjustment_delta_cents) using the agreement's tiers and the statement's basis"
          - "increments RoyaltyStatement.version by 1"
      - from: ISSUED
        to: FINAL
        trigger: "POST /licensing/royalty-statements/{id}/finalize"
        actor: BrandProgramAdmin
        preconditions:
          - "statement.status in {ISSUED, ADJUSTED}"
        side_effects:
          - "increments RoyaltyStatement.version by 1"
      - from: ADJUSTED
        to: FINAL
        trigger: "POST /licensing/royalty-statements/{id}/finalize"
        actor: BrandProgramAdmin
        preconditions:
          - "statement.status in {ISSUED, ADJUSTED}"
        side_effects:
          - "increments RoyaltyStatement.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /licensing/license-agreements/{id}/royalty-statements for an overlapping period while a DRAFT exists"
        actor: system
        preconditions:
          - "a new DRAFT statement for the same agreement and an overlapping period is created"
        side_effects:
          - "prior DRAFT transitions to SUPERSEDED; its version increments by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /licensing/inspections/{id}/complete"
        actor: BrandInspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "category_scores covers exactly the four categories of inspection_composite_result with scores in 0..100"
        side_effects:
          - "computes total_score; sets critical_fail; result = FAILED if critical_fail else (PASSED if total_score >= 85 else FAILED)"
          - "when result == FAILED: creates one CorrectiveAction (finding_code CRITICAL) if critical_fail, else one per category scoring < 70; each due_at = logical clock + 14 days"
          - "when result == FAILED: recomputes the store's compliance_posture per store_posture_recompute; if posture becomes PROBATION, the store's PLANNED PromotionCampaigns transition to CANCELLED"
          - "increments Inspection.version by 1 and the store's version by 1 when posture changes"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /licensing/inspections/{id}/cancel"
        actor: BrandInspector
        preconditions:
          - "inspection.status == SCHEDULED"
        side_effects:
          - "increments Inspection.version by 1"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED, ESCALATED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /licensing/corrective-actions/{id}/submit-evidence"
        actor: LicenseeManager
        preconditions:
          - "action.status in {OPEN, REOPENED}"
        side_effects:
          - "stores evidence_note"
          - "increments CorrectiveAction.version by 1"
      - from: REOPENED
        to: SUBMITTED
        trigger: "POST /licensing/corrective-actions/{id}/submit-evidence"
        actor: LicenseeManager
        preconditions:
          - "action.status in {OPEN, REOPENED}"
        side_effects:
          - "stores evidence_note"
          - "increments CorrectiveAction.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /licensing/corrective-actions/{id}/verify"
        actor: BrandInspector
        preconditions:
          - "action.status == SUBMITTED"
          - "acting inspector X-User-ID != parent Inspection.inspector_id (segregation of duties)"
        side_effects:
          - "sets verified_by"
          - "recomputes the store's compliance_posture per store_posture_recompute"
          - "increments CorrectiveAction.version by 1"
      - from: SUBMITTED
        to: REOPENED
        trigger: "POST /licensing/corrective-actions/{id}/reopen"
        actor: BrandInspector
        preconditions:
          - "action.status == SUBMITTED"
          - "action.reopen_count < MAX_REOPENS (2)"
        side_effects:
          - "increments reopen_count by 1"
          - "recomputes the store's compliance_posture per store_posture_recompute"
          - "increments CorrectiveAction.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /licensing/corrective-actions/sweep-overdue with logical clock > due_at"
        actor: BrandProgramAdmin
        preconditions:
          - "action.status in {OPEN, REOPENED}"
          - "logical clock timestamp > action.due_at"
        side_effects:
          - "increments the parent store's agreement.breach_strikes by 1 (processing order: created_at ASC, then finding_code ASC)"
          - "if breach_strikes reaches BREACH_SUSPEND_THRESHOLD (2): agreement transitions ACTIVE -> SUSPENDED, cascading to stores (OPERATING -> SUSPENDED), their SupplyOrders ({DRAFT, SUBMITTED} -> CANCELLED), and their ACTIVE PromotionCampaigns (-> ENDED)"
          - "increments CorrectiveAction.version by 1, agreement.version by 1, and each cascaded store's version by 1"
      - from: REOPENED
        to: ESCALATED
        trigger: "POST /licensing/corrective-actions/sweep-overdue with logical clock > due_at"
        actor: BrandProgramAdmin
        preconditions:
          - "action.status in {OPEN, REOPENED}"
          - "logical clock timestamp > action.due_at"
        side_effects:
          - "same cascade as OPEN -> ESCALATED"

  - entity: PromotionCampaign
    initial_state: PLANNED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /licensing/promotion-campaigns/{id}/activate"
        actor: BrandProgramAdmin
        preconditions:
          - "campaign.status == PLANNED"
          - "logical clock date within [start_date, end_date] (closed)"
          - "store.operating_status == OPERATING"
          - "store.compliance_posture != PROBATION"
        side_effects:
          - "increments PromotionCampaign.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /licensing/promotion-campaigns/{id}/end OR store suspend cascade"
        actor: BrandProgramAdmin | system
        preconditions:
          - "campaign.status == ACTIVE (manual end)"
        side_effects:
          - "increments PromotionCampaign.version by 1"
      - from: ENDED
        to: RECONCILED
        trigger: "POST /licensing/promotion-campaigns/{id}/reconcile"
        actor: BrandProgramAdmin
        preconditions:
          - "campaign.status == ENDED"
        side_effects:
          - "sets reconciled = true"
          - "increments PromotionCampaign.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system cascade (store delicense, agreement terminate/expire, posture becomes PROBATION)"
        actor: system
        preconditions:
          - "campaign.status == PLANNED"
        side_effects:
          - "increments PromotionCampaign.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system cascade (store delicense, agreement terminate/expire)"
        actor: system
        preconditions:
          - "campaign.status == ACTIVE"
        side_effects:
          - "increments PromotionCampaign.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: LicenseAgreement
    write_endpoint: "PATCH /licensing/license-agreements/{id}"
    occ_field: "expected_agreement_version"
    description: |
      Amending an agreement's royalty terms is rejected when the client's
      expected_agreement_version no longer matches the agreement's current
      version, because another successful write (an amendment, an accept, a
      suspend, a reinstate, or a statement generation) has advanced the
      version since the client's view was taken.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: royalty-statement-create-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /licensing/license-agreements/{id}/royalty-statements"
    occ_field: "expected_agreement_version"
    description: |
      Generating a royalty statement supersedes any existing DRAFT statement
      for an overlapping period; a generation request carrying a stale
      expected_agreement_version is rejected because the agreement's version
      has advanced since the client's view, so the supersede decision would
      be based on outdated agreement terms.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_recognition
    trigger: "POST /licensing/license-agreements/{id}/royalty-statements (generation); POST /licensing/royalty-statements/{id}/adjust (recompute on adjusted recognized sales)"
    algorithm: tiered_pricing
    formula: |
      input_set = all SalesReports of stores belonging to the agreement with
        status == FINALIZED, report period fully inside [period_start_date, period_end_date],
        and (basis == ACCRUAL ? finalized_at <= generation clock : finalized_at <= period_end_date end-of-day)
      recognized_sales_cents = sum(net_sales_cents over input_set)
      royalty_amount_cents = round_half_up(
        sum over tiers i of max(0, min(S, next_threshold_i) - threshold_i) * rate_bps_i / 10000)
      where S = recognized_sales_cents, next_threshold_i = threshold of tier i+1 or +infinity,
      and the per-tier products are summed UNROUNDED with a single round_half_up at the end.
      On adjust: recompute with S = recognized_sales_cents + adjustment_delta_cents.
    input_set: "FINALIZED SalesReports of the agreement's stores whose [period_start_date, period_end_date] is fully inside the statement period; basis variant filters by finalized_at"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up applied once to the tier-sum"
    variants:
      - name: accrual_basis
        when: "agreement.royalty_basis == ACCRUAL"
        difference: "includes reports FINALIZED at any time up to the generation clock, even after period_end_date (late-arriving reports recognized)"
      - name: cash_basis
        when: "agreement.royalty_basis == CASH"
        difference: "includes only reports FINALIZED on or before period_end_date; late-finalized reports are excluded even though they exist at generation time"

  - name: certification_exam_outcome
    trigger: "POST /licensing/certifications/{id}/record-exam"
    algorithm: threshold
    formula: |
      raw variant:    PASS iff exam_score >= PASS_EXAM_SCORE (80)
      audited variant (proctor_anomaly == true):
        adjusted_score = exam_score - AUDIT_ANOMALY_PENALTY (5)
        PASS iff adjusted_score >= PASS_EXAM_SCORE (80)
      Boundary is inclusive: exactly 80 passes raw; exactly 85 passes audited.
    input_set: "single exam record (exam_score, proctor_anomaly)"
    constants:
      PASS_EXAM_SCORE: 80
      AUDIT_ANOMALY_PENALTY: 5
    precision: "integer scores, no rounding"
    variants:
      - name: raw
        when: "proctor_anomaly == false"
        difference: "pass threshold applied to the unmodified exam_score"
      - name: audited_adjusted
        when: "proctor_anomaly == true"
        difference: "pass threshold applied to exam_score - 5; identical inputs except the anomaly flag produce PASS vs FAIL at scores 80..84"

  - name: supply_order_pricing
    trigger: "SupplyOrder creation (explicit lines or auto_replenish generation) and receive (received_value_cents)"
    algorithm: aggregation
    formula: |
      per line: discount_bps = (quantity_ordered >= VOLUME_DISCOUNT_QTY (100)) ? VOLUME_DISCOUNT_BPS (500) : 0
      per line: line_cost_cents = round_half_up(quantity_ordered * unit_cost_cents * (10000 - discount_bps) / 10000)
      order.total_cost_cents = sum(line_cost_cents)   # ROUND-PER-LINE-THEN-SUM is pinned;
      # the alternative sum-then-round order is explicitly forbidden and yields different cents.
    input_set: "all SupplyOrderLines of the order"
    constants:
      VOLUME_DISCOUNT_QTY: 100
      VOLUME_DISCOUNT_BPS: 500
    precision: "integer cents, round_half_up per line before summing"

  - name: par_replenishment_quantity
    trigger: "SupplyOrder creation with auto_replenish == true"
    algorithm: threshold
    formula: |
      for each StoreAssortmentItem of the store with active == true:
        shortfall = par_level - on_hand
        if shortfall <= 0: no line is generated (boundary: on_hand == par_level yields NO line)
        else: quantity_ordered = ceil(shortfall / case_pack_units) * case_pack_units
      if no lines are generated at all (and no explicit lines were supplied): creation fails ERR_EMPTY_ORDER
    input_set: "active StoreAssortmentItems of the ordering store"
    constants:
      MAX_PAR_LEVEL: 1000
    precision: "integer units"

  - name: promotion_price_preview
    trigger: "POST /licensing/promotion-campaigns/{id}/price-preview"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (the dependency clamp->redemption would otherwise be circular):
      1) raw_price_cents     = round_half_up(base_price_cents * (100 - discount_pct) / 100)
      2) clamped_price_cents = max(raw_price_cents, floor_price_cents)
      3) redemption_cents    = min(member.points_balance * POINT_VALUE_CENTS (100),
                                   floor(clamped_price_cents * REDEEM_CAP_PCT_LICENSED (50) / 100))
         # preview always applies the LICENSED-store redemption cap
      4) effective_price_cents = clamped_price_cents - redemption_cents
    input_set: "the campaign, the request base_price_cents, and the member's current points_balance"
    constants:
      POINT_VALUE_CENTS: 100
      REDEEM_CAP_PCT_LICENSED: 50
    precision: "integer cents, round_half_up at step 1; floor at step 3"

  - name: inspection_composite_result
    trigger: "POST /licensing/inspections/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      total_score = round_half_up(
        score[BEVERAGE_QUALITY] * 30 + score[FOOD_SAFETY] * 40 +
        score[BRAND_PRESENTATION] * 20 + score[SERVICE_SPEED] * 10) / 100
      # weights sum to 100; division by 100 yields a 0..100 composite
      result = FAILED if critical_fail == true
               else (PASSED if total_score >= INSPECTION_PASS_SCORE (85) else FAILED)   # boundary inclusive
    input_set: "category_scores from the complete call: exactly the four weighted categories"
    constants:
      INSPECTION_PASS_SCORE: 85
      WEIGHT_BEVERAGE_QUALITY: 30
      WEIGHT_FOOD_SAFETY: 40
      WEIGHT_BRAND_PRESENTATION: 20
      WEIGHT_SERVICE_SPEED: 10
      CORRECTIVE_DUE_DAYS: 14
      CATEGORY_FAIL_SCORE: 70
    precision: "composite rounded once, round_half_up"

  - name: loyalty_points_engine
    trigger: "POST /licensing/loyalty-members/{id}/events (EARN and REDEEM)"
    algorithm: tiered_pricing
    formula: |
      EARN:    points = floor(purchase_cents / 200) * (store_format == LICENSED ? 1 : 2)
      REDEEM:  requested = points input; cap_points = floor(purchase_cents * cap_pct / 100 / POINT_VALUE_CENTS)
               cap_pct = 50 (LICENSED) or 75 (COMPANY_OPERATED)
               points = min(requested, member.points_balance, cap_points)
               redemption_cents = points * POINT_VALUE_CENTS (100)
      ADJUST:  signed points applied directly to balance (must not drive any balance negative)
      Invariant: points_balance == lifetime_earned - lifetime_redeemed after every event.
    input_set: "single event request plus the member's current balance"
    constants:
      EARN_DIVISOR_CENTS: 200
      EARN_RATE_LICENSED: 1
      EARN_RATE_COMPANY: 2
      POINT_VALUE_CENTS: 100
      REDEEM_CAP_PCT_LICENSED: 50
      REDEEM_CAP_PCT_COMPANY: 75
    precision: "integer points and cents, floor division"

  - name: store_posture_recompute
    trigger: "certification audit-verify, certification sweep-expiry, inspection completion, corrective-action verify/reopen, begin-operations, resume"
    algorithm: constraint_propagation
    formula: |
      certified_active = count of Certifications with status == CERTIFIED whose employee
        has licensee_id == store's agreement's licensee_id, active == true, role_tag == BARISTA
      open_correctives = count of CorrectiveActions with status in {OPEN, SUBMITTED, REOPENED}
        whose inspection's store_id == store.id
      posture = PROBATION     if certified_active == 0 or open_correctives >= 2
              = WATCH         else if certified_active < MIN_CERTIFIED_BARISTAS (2) or open_correctives == 1
              = GOOD_STANDING otherwise
      Side effect on transition INTO PROBATION: the store's PLANNED PromotionCampaigns -> CANCELLED.
    input_set: "certifications of the licensee's active BARISTA employees; corrective actions under the store's inspections"
    constants:
      MIN_CERTIFIED_BARISTAS: 2
      MAX_REOPENS: 2
      BREACH_SUSPEND_THRESHOLD: 2
    precision: "integer counts"

  - name: footprint_utilization
    trigger: "POST /licensing/stores/{id}/assortment-items; PATCH /licensing/host-venues/{id}; begin-operations"
    algorithm: aggregation
    formula: |
      venue_usage = sum over the venue's stores (agreements in {ACTIVE, SUSPENDED}) of
        (store.equipment_footprint_units + sum(footprint_units of the store's active assortment products))
      constraint: venue_usage <= venue.max_equipment_footprint_units
      boundary: equality (usage == max) is allowed; max + 1 is rejected.
    input_set: "stores of the venue under agreements in {ACTIVE, SUSPENDED} and their active assortment products"
    constants: {}
    precision: "integer units"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role appears in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: LicenseeManager X-User-ID equals the licensee reached via the resource (store->agreement->licensee; employee->licensee; order->store->agreement->licensee; report->store; assortment->store; certification->employee); HostVenueManager X-User-ID equals venue id (PATCH venue) or agreement.venue_id (accept); LoyaltyMember X-User-ID equals member id", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "role-scoped endpoints" }
  - { priority: 4, category: auth, check: "DistributorAgent X-User-ID equals order.distributor_id", error_id: ERR_DISTRIBUTOR_MISMATCH, http_status: 403, applies_to: ["POST /licensing/supply-orders/{id}/approve", "POST /licensing/supply-orders/{id}/reject", "POST /licensing/supply-orders/{id}/ship", "POST /licensing/supply-orders/{id}/resolve-dispute"] }
  - { priority: 5, category: existence, check: "path-template ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 6, category: existence, check: "body foreign keys exist (licensee_id, venue_id, distributor_id, product_item_id, member_id, employee references)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creation endpoints with FK inputs" }
  - { priority: 7, category: state, check: "LicenseAgreement state precondition for the attempted transition", error_id: ERR_INVALID_AGREEMENT_STATE, http_status: 409, applies_to: ["POST /licensing/license-agreements/{id}/submit", "POST /licensing/license-agreements/{id}/accept", "POST /licensing/license-agreements/{id}/suspend", "POST /licensing/license-agreements/{id}/reinstate", "POST /licensing/license-agreements/{id}/terminate"] }
  - { priority: 8, category: state, check: "agreement.status == ACTIVE when creating a store under it", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /licensing/license-agreements/{id}/stores"] }
  - { priority: 9, category: state, check: "store operating_status permits the transition", error_id: ERR_INVALID_STORE_STATE, http_status: 409, applies_to: ["POST /licensing/stores/{id}/request-certification", "POST /licensing/stores/{id}/begin-operations", "POST /licensing/stores/{id}/suspend", "POST /licensing/stores/{id}/resume", "POST /licensing/stores/{id}/delicense"] }
  - { priority: 10, category: state, check: "store.operating_status == OPERATING for operational writes (order creation itself is allowed in any non-DELICENSED state; only submit is gated)", error_id: ERR_STORE_NOT_OPERATING, http_status: 409, applies_to: ["POST /licensing/supply-orders/{id}/submit", "POST /licensing/stores/{id}/sales-reports", "POST /licensing/promotion-campaigns/{id}/activate", "POST /licensing/stores/{id}/inspections"] }
  - { priority: 11, category: state, check: "supply order status permits the transition", error_id: ERR_INVALID_ORDER_STATE, http_status: 409, applies_to: ["POST /licensing/supply-orders/{id}/submit", "POST /licensing/supply-orders/{id}/approve", "POST /licensing/supply-orders/{id}/reject", "POST /licensing/supply-orders/{id}/ship", "POST /licensing/supply-orders/{id}/receive", "POST /licensing/supply-orders/{id}/dispute", "POST /licensing/supply-orders/{id}/resolve-dispute", "POST /licensing/supply-orders/{id}/cancel"] }
  - { priority: 12, category: state, check: "certification status permits record-exam (ENROLLED) or audit (EXAM_PASSED)", error_id: ERR_INVALID_CERTIFICATION_STATE, http_status: 409, applies_to: ["POST /licensing/certifications/{id}/record-exam", "POST /licensing/certifications/{id}/audit-verify", "POST /licensing/certifications/{id}/audit-reject"] }
  - { priority: 13, category: state, check: "sales report status == DRAFT", error_id: ERR_SALES_REPORT_NOT_DRAFT, http_status: 409, applies_to: ["POST /licensing/sales-reports/{id}/finalize"] }
  - { priority: 14, category: state, check: "royalty statement status permits the transition", error_id: ERR_INVALID_STATEMENT_STATE, http_status: 409, applies_to: ["POST /licensing/royalty-statements/{id}/issue", "POST /licensing/royalty-statements/{id}/dispute", "POST /licensing/royalty-statements/{id}/adjust", "POST /licensing/royalty-statements/{id}/finalize"] }
  - { priority: 15, category: state, check: "inspection status == SCHEDULED", error_id: ERR_INVALID_INSPECTION_STATE, http_status: 409, applies_to: ["POST /licensing/inspections/{id}/complete", "POST /licensing/inspections/{id}/cancel"] }
  - { priority: 16, category: state, check: "corrective action status permits the transition", error_id: ERR_INVALID_CORRECTIVE_STATE, http_status: 409, applies_to: ["POST /licensing/corrective-actions/{id}/submit-evidence", "POST /licensing/corrective-actions/{id}/verify", "POST /licensing/corrective-actions/{id}/reopen"] }
  - { priority: 17, category: state, check: "campaign status permits the transition", error_id: ERR_INVALID_CAMPAIGN_STATE, http_status: 409, applies_to: ["POST /licensing/promotion-campaigns/{id}/activate", "POST /licensing/promotion-campaigns/{id}/end", "POST /licensing/promotion-campaigns/{id}/reconcile", "POST /licensing/promotion-campaigns/{id}/price-preview"] }
  - { priority: 18, category: business_safety, check: "segregation of duties: audit-verify / audit-reject inspector != certification.proctor_inspector_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /licensing/certifications/{id}/audit-verify", "POST /licensing/certifications/{id}/audit-reject"] }
  - { priority: 19, category: business_safety, check: "segregation of duties: corrective-action verify inspector != parent inspection.inspector_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /licensing/corrective-actions/{id}/verify"] }
  - { priority: 20, category: business_safety, check: "product.venue_type_restrictions empty or contains the store's venue type", error_id: ERR_VENUE_TYPE_PROHIBITED, http_status: 422, applies_to: ["POST /licensing/stores/{id}/assortment-items"] }
  - { priority: 21, category: business_safety, check: "proprietary product requires store.compliance_posture != PROBATION", error_id: ERR_PROPRIETARY_ITEM_RESTRICTED, http_status: 422, applies_to: ["POST /licensing/stores/{id}/assortment-items"] }
  - { priority: 22, category: business_safety, check: "cross-entity staffing floor: begin-operations requires >= MIN_CERTIFIED_BARISTAS (2) CERTIFIED active BARISTA employees of the agreement's licensee", error_id: ERR_INSUFFICIENT_CERTIFIED_STAFF, http_status: 422, applies_to: ["POST /licensing/stores/{id}/begin-operations"] }
  - { priority: 22, category: business_safety, check: "campaign activation requires store.compliance_posture != PROBATION", error_id: ERR_STORE_POSTURE_PROBATION, http_status: 422, applies_to: ["POST /licensing/promotion-campaigns/{id}/activate"] }
  - { priority: 23, category: business_constraint, check: "uniqueness: licensee legal_entity_code, product sku, member email, store_code per agreement, at most one non-terminal agreement per venue", error_id: ERR_UNIQUENESS_CONFLICT, http_status: 409, applies_to: ["POST /licensing/licensees", "POST /licensing/product-items", "POST /licensing/loyalty-members", "POST /licensing/license-agreements/{id}/stores", "POST /licensing/license-agreements/{id}/accept"] }
  - { priority: 24, category: business_constraint, check: "shape/value constraints: required fields present, enums valid, royalty_tiers first threshold 0 strictly increasing rates 1..10000, term_start < term_end, close_time > open_time, par_level 0..1000, discount_pct 1..90, quantities > 0, footprint units >= 1", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 25, category: business_constraint, check: "footprint_utilization: venue_usage <= venue.max_equipment_footprint_units (equality allowed)", error_id: ERR_FOOTPRINT_EXCEEDED, http_status: 422, applies_to: ["POST /licensing/stores/{id}/assortment-items", "PATCH /licensing/host-venues/{id}", "POST /licensing/stores/{id}/begin-operations"] }
  - { priority: 26, category: business_constraint, check: "order has at least one line after (optional) auto_replenish generation", error_id: ERR_EMPTY_ORDER, http_status: 422, applies_to: ["POST /licensing/stores/{id}/supply-orders", "POST /licensing/supply-orders/{id}/submit"] }
  - { priority: 27, category: business_constraint, check: "corrective action reopen_count < MAX_REOPENS (2)", error_id: ERR_MAX_REOPENS_EXCEEDED, http_status: 422, applies_to: ["POST /licensing/corrective-actions/{id}/reopen"] }
  - { priority: 28, category: business_temporal, check: "inspection window inside venue hours (time-of-day within [open_time_utc, close_time_utc]) and start < end", error_id: ERR_INSPECTION_OUTSIDE_VENUE_HOURS, http_status: 422, applies_to: ["POST /licensing/stores/{id}/inspections"] }
  - { priority: 29, category: business_temporal, check: "inspector half-open schedule conflict: acting inspector has no other SCHEDULED inspection with start < new.end and new.start < end (adjacent end == start allowed)", error_id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http_status: 409, applies_to: ["POST /licensing/stores/{id}/inspections"] }
  - { priority: 30, category: business_temporal, check: "promotion closed-interval conflict: no other PLANNED/ACTIVE campaign for the same store with start_date <= new.end_date and new.start_date <= end_date (shared boundary date conflicts)", error_id: ERR_CAMPAIGN_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /licensing/stores/{id}/promotion-campaigns"] }
  - { priority: 31, category: business_temporal, check: "campaign activation window: logical clock date within [start_date, end_date]", error_id: ERR_CAMPAIGN_WINDOW_NOT_OPEN, http_status: 422, applies_to: ["POST /licensing/promotion-campaigns/{id}/activate"] }
  - { priority: 32, category: business_temporal, check: "sales report period overlap: no FINALIZED report for the same store whose closed date interval overlaps", error_id: ERR_SALES_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /licensing/sales-reports/{id}/finalize"] }
  - { priority: 33, category: business_referential, check: "order submit targets an approved distributor (distributor.approved == true)", error_id: ERR_DISTRIBUTOR_NOT_APPROVED, http_status: 422, applies_to: ["POST /licensing/supply-orders/{id}/submit"] }
  - { priority: 34, category: business_referential, check: "every order line product is in the store's active assortment; receive quantities within ordered quantities; receive line products belong to the order", error_id: ERR_PRODUCT_NOT_IN_ASSORTMENT, http_status: 422, applies_to: ["POST /licensing/stores/{id}/supply-orders", "POST /licensing/supply-orders/{id}/receive"] }
  - { priority: 35, category: business_referential, check: "LOYALTY event store consistency: store_id required and store OPERATING when store_format == LICENSED; store_id must be null when COMPANY_OPERATED", error_id: ERR_INVALID_LOYALTY_EVENT, http_status: 422, applies_to: ["POST /licensing/loyalty-members/{id}/events"] }
  - { priority: 36, category: business_fiscal, check: "order.total_cost_cents <= ORDER_BUDGET_MAX_CENTS (20000000) at submit", error_id: ERR_ORDER_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /licensing/supply-orders/{id}/submit"] }
  - { priority: 37, category: business_fiscal, check: "loyalty REDEEM: requested points <= member.points_balance and <= format cap", error_id: ERR_LOYALTY_INSUFFICIENT_POINTS, http_status: 422, applies_to: ["POST /licensing/loyalty-members/{id}/events"] }
  - { priority: 38, category: business_fiscal, check: "dispute resolution credit within shortage: 0 <= credit_cents <= total_cost_cents - received_value_cents", error_id: ERR_DISPUTE_CREDIT_EXCEEDS_SHORTAGE, http_status: 422, applies_to: ["POST /licensing/supply-orders/{id}/resolve-dispute"] }
  - { priority: 39, category: business_fiscal, check: "optimistic concurrency: expected_agreement_version equals the agreement's current version", error_id: ERR_STALE_AGREEMENT_VERSION, http_status: 412, applies_to: ["PATCH /licensing/license-agreements/{id}", "POST /licensing/license-agreements/{id}/royalty-statements"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: sets the server's logical clock. Startup default (before any set call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [BrandProgramAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["all sweep endpoints evaluate against this clock"] }

  - { method: POST, path: "/licensing/licensees", description: "Register a licensee operator", roles: [BrandProgramAdmin], code: 201, input: [name, legal_entity_code], output: Licensee, side_effects: [] }
  - { method: GET, path: "/licensing/licensees/{id}", description: "Fetch a licensee", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [], output: Licensee, side_effects: [] }
  - { method: GET, path: "/licensing/licensees", description: "List licensees, paginated", roles: [BrandProgramAdmin], code: 200, input: ["limit?", "offset?"], output: "Licensee[]", side_effects: [] }

  - { method: POST, path: "/licensing/host-venues", description: "Register a host venue (grocery, airport, campus, hospital)", roles: [BrandProgramAdmin], code: 201, input: [name, venue_type, open_time_utc, close_time_utc, access_restricted, max_equipment_footprint_units, security_badge_required], output: HostVenue, side_effects: [] }
  - { method: GET, path: "/licensing/host-venues/{id}", description: "Fetch a host venue", roles: [BrandProgramAdmin, HostVenueManager, LicenseeManager], code: 200, input: [], output: HostVenue, side_effects: [] }
  - { method: GET, path: "/licensing/host-venues", description: "List host venues, filterable by venue_type", roles: [BrandProgramAdmin], code: 200, input: ["venue_type?", "limit?", "offset?"], output: "HostVenue[]", side_effects: [] }
  - { method: PATCH, path: "/licensing/host-venues/{id}", description: "Update venue hours, access constraints, or footprint cap; shrinking the cap below current usage is rejected", roles: [HostVenueManager, BrandProgramAdmin], code: 200, input: ["open_time_utc?", "close_time_utc?", "access_restricted?", "max_equipment_footprint_units?", "security_badge_required?"], output: HostVenue, side_effects: ["footprint_utilization re-checked against the new cap", "increments HostVenue.version by 1"] }

  - { method: POST, path: "/licensing/license-agreements", description: "Draft a license agreement (royalty tiers, basis, term)", roles: [BrandProgramAdmin], code: 201, input: [licensee_id, venue_id, royalty_tiers, royalty_basis, term_start_date, term_end_date], output: LicenseAgreement, side_effects: [] }
  - { method: GET, path: "/licensing/license-agreements/{id}", description: "Fetch an agreement", roles: [BrandProgramAdmin, LicenseeManager, HostVenueManager], code: 200, input: [], output: LicenseAgreement, side_effects: [] }
  - { method: GET, path: "/licensing/license-agreements", description: "List agreements, filterable", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["licensee_id?", "venue_id?", "status?", "limit?", "offset?"], output: "LicenseAgreement[]", side_effects: [] }
  - { method: POST, path: "/licensing/license-agreements/{id}/submit", description: "Submit draft agreement to the host venue (DRAFT -> PENDING_ACCEPTANCE)", roles: [BrandProgramAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/accept", description: "Host venue accepts the agreement (PENDING_ACCEPTANCE -> ACTIVE)", roles: [HostVenueManager], code: 200, input: [], output: LicenseAgreement, side_effects: ["increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/suspend", description: "Brand suspends an ACTIVE agreement; cascades to stores/orders/campaigns", roles: [BrandProgramAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["stores OPERATING -> SUSPENDED; their orders in {DRAFT, SUBMITTED} -> CANCELLED; their ACTIVE campaigns -> ENDED", "increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/reinstate", description: "Reinstate a SUSPENDED agreement (cycle); resets breach_strikes", roles: [BrandProgramAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["breach_strikes reset to 0", "increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/terminate", description: "Terminate agreement; cascades store delicensing", roles: [BrandProgramAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["stores -> DELICENSED; orders in {DRAFT, SUBMITTED, APPROVED} -> CANCELLED; campaigns in {PLANNED, ACTIVE} -> CANCELLED", "increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/sweep-expiry", description: "Expire the agreement if the logical clock date is strictly after term_end_date", roles: [BrandProgramAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["same cascade as terminate when expiry fires"] }
  - { method: PATCH, path: "/licensing/license-agreements/{id}", description: "Amend royalty tiers, basis, or term end; OCC-guarded", roles: [BrandProgramAdmin], code: 200, input: ["royalty_tiers?", "royalty_basis?", "term_end_date?", expected_agreement_version], output: LicenseAgreement, side_effects: ["increments LicenseAgreement.version by 1"] }

  - { method: POST, path: "/licensing/license-agreements/{id}/stores", description: "Create a licensed kiosk store under an ACTIVE agreement", roles: [LicenseeManager, BrandProgramAdmin], code: 201, input: [store_code, equipment_footprint_units], output: LicensedStore, side_effects: ["store created in PROVISIONING / GOOD_STANDING"] }
  - { method: GET, path: "/licensing/stores/{id}", description: "Fetch a store", roles: [BrandProgramAdmin, LicenseeManager, HostVenueManager, BrandInspector, DistributorAgent], code: 200, input: [], output: LicensedStore, side_effects: [] }
  - { method: GET, path: "/licensing/license-agreements/{id}/stores", description: "List stores of an agreement", roles: [BrandProgramAdmin, LicenseeManager, HostVenueManager], code: 200, input: ["limit?", "offset?"], output: "LicensedStore[]", side_effects: [] }
  - { method: POST, path: "/licensing/stores/{id}/request-certification", description: "Declare staff roster ready for training (PROVISIONING -> CERT_PENDING)", roles: [LicenseeManager], code: 200, input: [], output: LicensedStore, side_effects: ["increments LicensedStore.version by 1"] }
  - { method: POST, path: "/licensing/stores/{id}/begin-operations", description: "Open the kiosk (CERT_PENDING -> OPERATING) once staffing and footprint gates pass", roles: [LicenseeManager], code: 200, input: [], output: LicensedStore, side_effects: ["recomputes compliance_posture", "increments LicensedStore.version by 1"] }
  - { method: POST, path: "/licensing/stores/{id}/suspend", description: "Suspend store operations; cancels its DRAFT/SUBMITTED orders, ends ACTIVE campaigns", roles: [BrandProgramAdmin], code: 200, input: [], output: LicensedStore, side_effects: ["orders in {DRAFT, SUBMITTED} -> CANCELLED; ACTIVE campaigns -> ENDED", "increments LicensedStore.version by 1"] }
  - { method: POST, path: "/licensing/stores/{id}/resume", description: "Resume a SUSPENDED store; requires parent agreement ACTIVE", roles: [BrandProgramAdmin], code: 200, input: [], output: LicensedStore, side_effects: ["recomputes compliance_posture", "increments LicensedStore.version by 1"] }
  - { method: POST, path: "/licensing/stores/{id}/delicense", description: "Permanently delicense the store (terminal)", roles: [BrandProgramAdmin], code: 200, input: [], output: LicensedStore, side_effects: ["orders in {DRAFT, SUBMITTED, APPROVED} -> CANCELLED; campaigns in {PLANNED, ACTIVE} -> CANCELLED", "increments LicensedStore.version by 1"] }

  - { method: POST, path: "/licensing/product-items", description: "Register a catalog product with venue-type restrictions and case pack", roles: [BrandProgramAdmin], code: 201, input: [sku, name, category, proprietary, venue_type_restrictions, unit_cost_cents, case_pack_units, footprint_units], output: ProductItem, side_effects: [] }
  - { method: GET, path: "/licensing/product-items/{id}", description: "Fetch a product", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [], output: ProductItem, side_effects: [] }
  - { method: GET, path: "/licensing/product-items", description: "List products", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["category?", "limit?", "offset?"], output: "ProductItem[]", side_effects: [] }

  - { method: POST, path: "/licensing/stores/{id}/assortment-items", description: "Add a product to the store assortment with a par level; venue-type, proprietary-posture, and footprint gates apply", roles: [LicenseeManager], code: 201, input: [product_item_id, par_level], output: StoreAssortmentItem, side_effects: ["footprint_utilization re-checked", "increments LicensedStore.version by 1"] }
  - { method: GET, path: "/licensing/store-assortment-items/{id}", description: "Fetch an assortment item", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [], output: StoreAssortmentItem, side_effects: [] }
  - { method: GET, path: "/licensing/store-assortment-items", description: "List assortment items, filterable by store_id / product_item_id", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["store_id?", "product_item_id?", "limit?", "offset?"], output: "StoreAssortmentItem[]", side_effects: [] }
  - { method: DELETE, path: "/licensing/store-assortment-items/{id}", description: "Soft-delete an assortment item (active -> false); not allowed while the store is OPERATING", roles: [LicenseeManager], code: 204, input: [], output: null, side_effects: [] }

  - { method: POST, path: "/licensing/distributors", description: "Register a distributor (starts unapproved)", roles: [BrandProgramAdmin], code: 201, input: [name, lead_time_days], output: Distributor, side_effects: [] }
  - { method: GET, path: "/licensing/distributors/{id}", description: "Fetch a distributor", roles: [BrandProgramAdmin, DistributorAgent, LicenseeManager], code: 200, input: [], output: Distributor, side_effects: [] }
  - { method: GET, path: "/licensing/distributors", description: "List distributors", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["approved?", "limit?", "offset?"], output: "Distributor[]", side_effects: [] }
  - { method: PATCH, path: "/licensing/distributors/{id}", description: "Approve/unapprove a distributor or adjust lead time", roles: [BrandProgramAdmin], code: 200, input: ["approved?", "lead_time_days?"], output: Distributor, side_effects: ["increments Distributor.version by 1"] }

  - { method: POST, path: "/licensing/stores/{id}/supply-orders", description: "Create a DRAFT supply order; explicit lines or auto_replenish from par shortfalls; computes line costs per supply_order_pricing", roles: [LicenseeManager], code: 201, input: [distributor_id, "auto_replenish?", "lines?"], output: SupplyOrder, side_effects: ["creates SupplyOrderLine rows", "computes total_cost_cents"] }
  - { method: GET, path: "/licensing/supply-orders/{id}", description: "Fetch an order", roles: [BrandProgramAdmin, LicenseeManager, DistributorAgent], code: 200, input: [], output: SupplyOrder, side_effects: [] }
  - { method: GET, path: "/licensing/supply-orders", description: "List orders, filterable", roles: [BrandProgramAdmin, LicenseeManager, DistributorAgent], code: 200, input: ["store_id?", "distributor_id?", "status?", "limit?", "offset?"], output: "SupplyOrder[]", side_effects: [] }
  - { method: POST, path: "/licensing/supply-orders/{id}/submit", description: "Submit a DRAFT order to the distributor", roles: [LicenseeManager], code: 200, input: [], output: SupplyOrder, side_effects: ["sets submitted_at", "increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/approve", description: "Distributor approves a submitted order", roles: [DistributorAgent], code: 200, input: [], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/reject", description: "Distributor rejects a submitted order", roles: [DistributorAgent], code: 200, input: [reason], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/ship", description: "Distributor ships an approved order", roles: [DistributorAgent], code: 200, input: [], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/receive", description: "Record received quantities; updates on_hand and received_value_cents", roles: [LicenseeManager], code: 200, input: [received_lines], output: SupplyOrder, side_effects: ["assortment on_hand incremented per line", "received_value_cents computed", "increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/dispute", description: "Dispute a received order (shortage/damage claim)", roles: [LicenseeManager], code: 200, input: [reason], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/resolve-dispute", description: "Distributor resolves with a compensating credit bounded by the shortage", roles: [DistributorAgent], code: 200, input: [credit_cents], output: SupplyOrder, side_effects: ["sets credit_cents", "increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/licensing/supply-orders/{id}/cancel", description: "Cancel a DRAFT or SUBMITTED order", roles: [LicenseeManager], code: 200, input: [], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1"] }
  - { method: GET, path: "/licensing/supply-order-lines/{id}", description: "Fetch an order line", roles: [BrandProgramAdmin, LicenseeManager, DistributorAgent], code: 200, input: [], output: SupplyOrderLine, side_effects: [] }
  - { method: GET, path: "/licensing/supply-order-lines", description: "List order lines, filterable by supply_order_id / product_item_id", roles: [BrandProgramAdmin, LicenseeManager, DistributorAgent], code: 200, input: ["supply_order_id?", "product_item_id?", "limit?", "offset?"], output: "SupplyOrderLine[]", side_effects: [] }

  - { method: POST, path: "/licensing/licensees/{id}/employees", description: "Hire a licensee employee", roles: [LicenseeManager], code: 201, input: [full_name, role_tag], output: Employee, side_effects: [] }
  - { method: GET, path: "/licensing/employees/{id}", description: "Fetch an employee", roles: [BrandProgramAdmin, LicenseeManager, BrandInspector], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: GET, path: "/licensing/employees", description: "List employees, filterable", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["licensee_id?", "role_tag?", "active?", "limit?", "offset?"], output: "Employee[]", side_effects: [] }

  - { method: POST, path: "/licensing/employees/{id}/certifications", description: "Enroll an employee in a training program", roles: [LicenseeManager], code: 201, input: [program_code], output: Certification, side_effects: [] }
  - { method: GET, path: "/licensing/certifications/{id}", description: "Fetch a certification", roles: [BrandProgramAdmin, LicenseeManager, BrandInspector], code: 200, input: [], output: Certification, side_effects: [] }
  - { method: GET, path: "/licensing/certifications", description: "List certifications, filterable", roles: [BrandProgramAdmin, LicenseeManager, BrandInspector], code: 200, input: ["employee_id?", "status?", "limit?", "offset?"], output: "Certification[]", side_effects: [] }
  - { method: POST, path: "/licensing/certifications/{id}/record-exam", description: "Proctor records an exam score; pass/fail per certification_exam_outcome variant", roles: [BrandInspector], code: 200, input: [exam_score, "proctor_anomaly?"], output: Certification, side_effects: ["sets exam_score, proctor_inspector_id; increments exam_attempts", "increments Certification.version by 1"] }
  - { method: POST, path: "/licensing/certifications/{id}/audit-verify", description: "Audit-verify a passed exam; verifier must differ from proctor; requires an ACTIVE agreement for the licensee", roles: [BrandInspector], code: 200, input: [], output: Certification, side_effects: ["sets certified_at/expires_at", "recomputes store postures of the licensee", "increments Certification.version by 1"] }
  - { method: POST, path: "/licensing/certifications/{id}/audit-reject", description: "Audit-reject a passed exam", roles: [BrandInspector], code: 200, input: [reason], output: Certification, side_effects: ["increments Certification.version by 1"] }
  - { method: POST, path: "/licensing/certifications/sweep-expiry", description: "Expire CERTIFIED certifications whose expires_at is at or before the logical clock; cascades posture recompute and PLANNED campaign cancellation", roles: [BrandProgramAdmin], code: 200, input: [], output: "Certification[]", side_effects: ["cert EXPIRED -> store posture recompute -> PLANNED campaigns CANCELLED on PROBATION"] }

  - { method: POST, path: "/licensing/stores/{id}/sales-reports", description: "File a DRAFT periodic sales report", roles: [LicenseeManager], code: 201, input: [period_start_date, period_end_date, gross_sales_cents, returns_cents, loyalty_redemption_cents], output: SalesReport, side_effects: [] }
  - { method: GET, path: "/licensing/sales-reports/{id}", description: "Fetch a sales report", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [], output: SalesReport, side_effects: [] }
  - { method: GET, path: "/licensing/sales-reports", description: "List sales reports, filterable", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["store_id?", "status?", "limit?", "offset?"], output: "SalesReport[]", side_effects: [] }
  - { method: POST, path: "/licensing/sales-reports/{id}/finalize", description: "Finalize a report; computes net_sales_cents; rejects overlapping FINALIZED periods", roles: [LicenseeManager], code: 200, input: [], output: SalesReport, side_effects: ["sets net_sales_cents and finalized_at", "increments SalesReport.version by 1"] }

  - { method: POST, path: "/licensing/license-agreements/{id}/royalty-statements", description: "Generate a royalty statement (DRAFT) for a period; supersedes an existing DRAFT for an overlapping period; OCC-guarded on the agreement", roles: [BrandProgramAdmin], code: 201, input: [period_start_date, period_end_date, expected_agreement_version], output: RoyaltyStatement, side_effects: ["computes recognized_sales_cents and royalty_amount_cents per royalty_recognition", "prior overlapping DRAFT -> SUPERSEDED", "increments LicenseAgreement.version by 1"] }
  - { method: GET, path: "/licensing/royalty-statements/{id}", description: "Fetch a statement", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }
  - { method: GET, path: "/licensing/royalty-statements", description: "List statements, filterable", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["agreement_id?", "status?", "limit?", "offset?"], output: "RoyaltyStatement[]", side_effects: [] }
  - { method: POST, path: "/licensing/royalty-statements/{id}/issue", description: "Issue a DRAFT statement to the licensee (amounts fixed at generation)", roles: [BrandProgramAdmin], code: 200, input: [], output: RoyaltyStatement, side_effects: ["increments RoyaltyStatement.version by 1"] }
  - { method: POST, path: "/licensing/royalty-statements/{id}/dispute", description: "Licensee disputes an ISSUED statement", roles: [LicenseeManager], code: 200, input: [reason], output: RoyaltyStatement, side_effects: ["increments RoyaltyStatement.version by 1"] }
  - { method: POST, path: "/licensing/royalty-statements/{id}/adjust", description: "Apply a signed recognized-sales delta and recompute the royalty (compensation for a dispute)", roles: [BrandProgramAdmin], code: 200, input: [adjustment_delta_cents], output: RoyaltyStatement, side_effects: ["royalty_amount_cents recomputed on recognized + delta", "increments RoyaltyStatement.version by 1"] }
  - { method: POST, path: "/licensing/royalty-statements/{id}/finalize", description: "Finalize an ISSUED or ADJUSTED statement", roles: [BrandProgramAdmin], code: 200, input: [], output: RoyaltyStatement, side_effects: ["increments RoyaltyStatement.version by 1"] }

  - { method: POST, path: "/licensing/stores/{id}/inspections", description: "Schedule a brand-standards inspection; venue-hours and inspector half-open overlap gates apply", roles: [BrandInspector], code: 201, input: [scheduled_start_utc, scheduled_end_utc], output: Inspection, side_effects: ["inspector_id set from X-User-ID"] }
  - { method: GET, path: "/licensing/inspections/{id}", description: "Fetch an inspection", roles: [BrandProgramAdmin, BrandInspector, LicenseeManager], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: GET, path: "/licensing/inspections", description: "List inspections, filterable", roles: [BrandProgramAdmin, BrandInspector, LicenseeManager], code: 200, input: ["store_id?", "inspector_id?", "status?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/licensing/inspections/{id}/complete", description: "Record category scores; computes composite result; FAILED auto-creates corrective actions and degrades posture", roles: [BrandInspector], code: 200, input: [category_scores, critical_fail], output: Inspection, side_effects: ["result per inspection_composite_result", "FAILED -> creates CorrectiveAction rows (due_at = clock + 14 days)", "posture recompute; PROBATION cancels PLANNED campaigns", "increments Inspection.version by 1"] }
  - { method: POST, path: "/licensing/inspections/{id}/cancel", description: "Cancel a scheduled inspection", roles: [BrandInspector], code: 200, input: [], output: Inspection, side_effects: ["increments Inspection.version by 1"] }

  - { method: GET, path: "/licensing/corrective-actions/{id}", description: "Fetch a corrective action", roles: [BrandProgramAdmin, BrandInspector, LicenseeManager], code: 200, input: [], output: CorrectiveAction, side_effects: [] }
  - { method: GET, path: "/licensing/corrective-actions", description: "List corrective actions, filterable; sorted created_at ASC then finding_code ASC", roles: [BrandProgramAdmin, BrandInspector, LicenseeManager], code: 200, input: ["inspection_id?", "status?", "limit?", "offset?"], output: "CorrectiveAction[]", side_effects: [] }
  - { method: POST, path: "/licensing/corrective-actions/{id}/submit-evidence", description: "Licensee submits remediation evidence (OPEN/REOPENED -> SUBMITTED)", roles: [LicenseeManager], code: 200, input: [evidence_note], output: CorrectiveAction, side_effects: ["increments CorrectiveAction.version by 1"] }
  - { method: POST, path: "/licensing/corrective-actions/{id}/verify", description: "Inspector verifies remediation; verifier must differ from the completing inspector", roles: [BrandInspector], code: 200, input: [], output: CorrectiveAction, side_effects: ["posture recompute", "increments CorrectiveAction.version by 1"] }
  - { method: POST, path: "/licensing/corrective-actions/{id}/reopen", description: "Inspector reopens a submitted action (cycle, max MAX_REOPENS=2)", roles: [BrandInspector], code: 200, input: [reason], output: CorrectiveAction, side_effects: ["reopen_count += 1", "posture recompute", "increments CorrectiveAction.version by 1"] }
  - { method: POST, path: "/licensing/corrective-actions/sweep-overdue", description: "Escalate OPEN/REOPENED actions past due_at; increments agreement breach_strikes and may cascade suspension", roles: [BrandProgramAdmin], code: 200, input: [], output: "CorrectiveAction[]", side_effects: ["ESCALATED -> agreement.breach_strikes += 1 -> at 2, agreement SUSPENDED -> stores SUSPENDED -> orders CANCELLED, campaigns ENDED"] }

  - { method: POST, path: "/licensing/loyalty-members", description: "Register a loyalty member", roles: [BrandProgramAdmin], code: 201, input: [email], output: LoyaltyMember, side_effects: [] }
  - { method: GET, path: "/licensing/loyalty-members/{id}", description: "Fetch a member (members may fetch only themselves)", roles: [BrandProgramAdmin, LicenseeManager, LoyaltyMember], code: 200, input: [], output: LoyaltyMember, side_effects: [] }
  - { method: POST, path: "/licensing/loyalty-members/{id}/events", description: "Append an earn/redeem/adjust event; rates differ LICENSED vs COMPANY_OPERATED per loyalty_points_engine", roles: [LicenseeManager, BrandProgramAdmin], code: 201, input: [event_type, store_format, "store_id?", "purchase_cents?", "points?", "note?"], output: LoyaltyAccountEvent, side_effects: ["updates member points_balance / lifetime_earned / lifetime_redeemed", "increments LoyaltyMember.version by 1"] }
  - { method: GET, path: "/licensing/loyalty-account-events/{id}", description: "Fetch a loyalty event", roles: [BrandProgramAdmin, LicenseeManager, LoyaltyMember], code: 200, input: [], output: LoyaltyAccountEvent, side_effects: [] }
  - { method: GET, path: "/licensing/loyalty-account-events", description: "List loyalty events, filterable", roles: [BrandProgramAdmin, LicenseeManager, LoyaltyMember], code: 200, input: ["member_id?", "store_id?", "event_type?", "limit?", "offset?"], output: "LoyaltyAccountEvent[]", side_effects: [] }

  - { method: POST, path: "/licensing/stores/{id}/promotion-campaigns", description: "Plan a promotional campaign; closed-interval overlap with PLANNED/ACTIVE campaigns on the same store is rejected", roles: [BrandProgramAdmin], code: 201, input: [name, start_date, end_date, discount_pct, floor_price_cents], output: PromotionCampaign, side_effects: [] }
  - { method: GET, path: "/licensing/promotion-campaigns/{id}", description: "Fetch a campaign", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [], output: PromotionCampaign, side_effects: [] }
  - { method: GET, path: "/licensing/promotion-campaigns", description: "List campaigns, filterable", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: ["store_id?", "status?", "limit?", "offset?"], output: "PromotionCampaign[]", side_effects: [] }
  - { method: POST, path: "/licensing/promotion-campaigns/{id}/activate", description: "Activate a campaign within its window; requires store OPERATING and posture != PROBATION", roles: [BrandProgramAdmin], code: 200, input: [], output: PromotionCampaign, side_effects: ["increments PromotionCampaign.version by 1"] }
  - { method: POST, path: "/licensing/promotion-campaigns/{id}/end", description: "End an ACTIVE campaign", roles: [BrandProgramAdmin], code: 200, input: [], output: PromotionCampaign, side_effects: ["increments PromotionCampaign.version by 1"] }
  - { method: POST, path: "/licensing/promotion-campaigns/{id}/reconcile", description: "Reconcile an ENDED campaign (terminal)", roles: [BrandProgramAdmin], code: 200, input: [], output: PromotionCampaign, side_effects: ["sets reconciled = true", "increments PromotionCampaign.version by 1"] }
  - { method: POST, path: "/licensing/promotion-campaigns/{id}/price-preview", description: "Preview the effective price for a member under the pinned discount->floor->redemption order", roles: [BrandProgramAdmin, LicenseeManager], code: 200, input: [base_price_cents, member_id], output: { clamped_price_cents: integer, redemption_cents: integer, effective_price_cents: integer }, side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on the endpoint, or entity-backed ownership check failed (wrong licensee/venue/member)" }
  - { id: ERR_DISTRIBUTOR_MISMATCH, http: 403, condition: "DistributorAgent X-User-ID does not match the order's distributor_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed tier table, invalid date/time window, or out-of-range scalar" }
  - { id: ERR_UNIQUENESS_CONFLICT, http: 409, condition: "Duplicate legal_entity_code / sku / member email / store_code within agreement / second non-terminal agreement for the venue" }
  - { id: ERR_INVALID_AGREEMENT_STATE, http: 409, condition: "Agreement transition attempted from a state that does not allow it" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Store creation or audit-verify requires an ACTIVE agreement" }
  - { id: ERR_INVALID_STORE_STATE, http: 409, condition: "Store transition attempted from a state that does not allow it (including terminal DELICENSED)" }
  - { id: ERR_STORE_NOT_OPERATING, http: 409, condition: "Operational write (order submit/create, sales report, loyalty event, campaign activate, inspection schedule) requires store OPERATING" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order transition attempted from a state that does not allow it" }
  - { id: ERR_INVALID_CERTIFICATION_STATE, http: 409, condition: "record-exam requires ENROLLED; audit actions require EXAM_PASSED" }
  - { id: ERR_SALES_REPORT_NOT_DRAFT, http: 409, condition: "finalize requires a DRAFT sales report" }
  - { id: ERR_INVALID_STATEMENT_STATE, http: 409, condition: "Statement transition attempted from a state that does not allow it (including terminal FINAL/SUPERSEDED)" }
  - { id: ERR_INVALID_INSPECTION_STATE, http: 409, condition: "complete/cancel requires a SCHEDULED inspection" }
  - { id: ERR_INVALID_CORRECTIVE_STATE, http: 409, condition: "Corrective-action transition attempted from a state that does not allow it (including terminal VERIFIED/ESCALATED)" }
  - { id: ERR_INVALID_CAMPAIGN_STATE, http: 409, condition: "Campaign transition or price-preview attempted from a state that does not allow it" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same inspector attempted both sides of a segregated control (proctor vs audit, completing inspector vs corrective verifier)" }
  - { id: ERR_VENUE_TYPE_PROHIBITED, http: 422, condition: "Product's venue_type_restrictions do not include the store's venue type" }
  - { id: ERR_PROPRIETARY_ITEM_RESTRICTED, http: 422, condition: "Proprietary product cannot be assorted while the store is in PROBATION posture" }
  - { id: ERR_INSUFFICIENT_CERTIFIED_STAFF, http: 422, condition: "Fewer than MIN_CERTIFIED_BARISTAS (2) CERTIFIED active BARISTA employees for the agreement's licensee at begin-operations" }
  - { id: ERR_FOOTPRINT_EXCEEDED, http: 422, condition: "Equipment footprint usage would exceed (strictly greater than) the venue cap" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Order creation/submission with zero lines (auto_replenish found no shortfall)" }
  - { id: ERR_MAX_REOPENS_EXCEEDED, http: 422, condition: "Corrective action reopen_count already at MAX_REOPENS (2)" }
  - { id: ERR_STORE_POSTURE_PROBATION, http: 422, condition: "Campaign activation attempted while the store's compliance_posture is PROBATION" }
  - { id: ERR_INSPECTION_OUTSIDE_VENUE_HOURS, http: 422, condition: "Inspection window falls outside host venue hours or start >= end" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "Inspector already has a SCHEDULED inspection overlapping under half-open semantics" }
  - { id: ERR_CAMPAIGN_WINDOW_CONFLICT, http: 409, condition: "Campaign dates overlap another PLANNED/ACTIVE campaign on the same store under closed-interval semantics (shared boundary date counts as overlap)" }
  - { id: ERR_CAMPAIGN_WINDOW_NOT_OPEN, http: 422, condition: "Campaign activation attempted outside [start_date, end_date]" }
  - { id: ERR_SALES_PERIOD_OVERLAP, http: 409, condition: "A FINALIZED sales report already covers an overlapping closed date interval for the store" }
  - { id: ERR_DISTRIBUTOR_NOT_APPROVED, http: 422, condition: "Order submit targets a distributor whose approved flag is false" }
  - { id: ERR_PRODUCT_NOT_IN_ASSORTMENT, http: 422, condition: "Order line product is not in the store's active assortment, or receive references a foreign/over-received line" }
  - { id: ERR_INVALID_LOYALTY_EVENT, http: 422, condition: "Loyalty event store_format/store_id consistency violated (LICENSED requires an OPERATING store_id; COMPANY_OPERATED requires null store_id)" }
  - { id: ERR_ORDER_BUDGET_EXCEEDED, http: 422, condition: "Order total exceeds ORDER_BUDGET_MAX_CENTS (20000000) at submit" }
  - { id: ERR_LOYALTY_INSUFFICIENT_POINTS, http: 422, condition: "Redeem/negative ADJUST exceeds member balance or format redemption cap" }
  - { id: ERR_DISPUTE_CREDIT_EXCEEDS_SHORTAGE, http: 422, condition: "Resolve-dispute credit outside 0..(total_cost_cents - received_value_cents)" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrandProgramAdmin
    description: "Brand-side program operator: owns licensees, venues, agreements, catalog, distributors, statements, campaigns, sweeps, and the logical clock"
    identity: "opaque"
    exclusive_operations: ["create licensees/venues/products/distributors/agreements", "submit/suspend/reinstate/terminate/sweep agreements", "amend agreements (OCC)", "generate/issue/adjust/finalize royalty statements", "create/activate/end/reconcile campaigns", "suspend/resume/delicense stores", "clock and expiry sweeps"]
    shared_operations: ["read stores/agreements/statements/reports/events", "create stores (shared with LicenseeManager)", "post loyalty events (shared with LicenseeManager)"]
  - name: LicenseeManager
    description: "Licensee-side operator: manages its own stores, employees, certifications enrollment, assortment, orders, sales reports, loyalty events, and disputes"
    identity: "entity_backed:Licensee"
    exclusive_operations: ["request-certification / begin-operations on own stores", "manage own employees and their certification enrollment", "manage own assortment", "create/submit/receive/dispute/cancel own orders", "file and finalize own sales reports", "dispute issued statements"]
    shared_operations: ["create stores (shared with BrandProgramAdmin)", "post loyalty events (shared with BrandProgramAdmin)", "read own resources"]
  - name: HostVenueManager
    description: "Host venue representative: accepts agreements for its venue and maintains venue hours/access/footprint constraints"
    identity: "entity_backed:HostVenue"
    exclusive_operations: ["accept agreements for own venue"]
    shared_operations: ["PATCH own venue (shared with BrandProgramAdmin)", "read venues/agreements/stores"]
  - name: DistributorAgent
    description: "Approved-distributor operator: processes orders routed to its distributor"
    identity: "entity_backed:Distributor"
    exclusive_operations: ["approve/reject/ship orders for own distributor", "resolve disputes with compensating credit"]
    shared_operations: ["read own orders and lines"]
  - name: BrandInspector
    description: "Brand standards inspector and training auditor; segregation of duties forbids verifying what the same inspector proctored or completed"
    identity: "opaque"
    exclusive_operations: ["record exams", "audit-verify / audit-reject certifications", "schedule/complete/cancel inspections", "verify/reopen corrective actions"]
    shared_operations: ["read stores/employees/certifications/inspections/corrective actions"]
  - name: LoyaltyMember
    description: "Loyalty program member; read-only access to own balance and events"
    identity: "entity_backed:LoyaltyMember"
    exclusive_operations: []
    shared_operations: ["read own member record and own events"]
