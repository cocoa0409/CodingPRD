  - section: cross_cutting_layers
    instances:
      - name: occ_stale_volunteer_patch_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[volunteer-profile-patch-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Volunteer.version: a PATCH carrying the pre-mutation version succeeds (version 1 -> 2); a second PATCH still carrying the stale captured version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["incident ACTIVE; volunteer REGISTERED at version 1"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood W3", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Pia Pyo", phone: "555-95", email: "pp5@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { vol: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /vrc/volunteers/${vol}", payload: { expected_volunteer_version: "${v1}", phone: "555-95-NEW" }, as: IntakeCoordinator, captures: { v2: $.data.version } }
            - { call: "PATCH /vrc/volunteers/${vol}", payload: { expected_volunteer_version: "${v1}", phone: "555-95-STALE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { phone_now: $.data.phone } }
          assert:
            - "v2 == 2 (first PATCH succeeded with the fresh version)"
            - "err == ERR_STALE_VERSION with HTTP 412 (second PATCH carried the stale version)"
            - "phone_now == '555-95-NEW' (the rejected write did not apply)"

      - name: occ_stale_support_request_put_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[support-request-edit-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on SupportRequest.version where the intervening mutation is a cascade-free lifecycle action: publish bumps version 1 -> 2, so a PUT carrying the pre-publish version is rejected with 412 ERR_STALE_VERSION; re-reading and retrying with version 2 succeeds."
        test_recipe:
          setup: ["incident ACTIVE; request created (version 1) and published (version 2)"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire X3", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 2, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id, v1: $.data.version } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
          trigger:
            - { call: "PUT /vrc/support-requests/${req}", payload: { expected_support_request_version: "${v1}", headcount_needed: 5 }, as: AgencyCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /vrc/support-requests/${req}", payload: {}, as: VRCManager, captures: { v2: $.data.version } }
            - { call: "PUT /vrc/support-requests/${req}", payload: { expected_support_request_version: "${v2}", headcount_needed: 5 }, as: AgencyCoordinator, captures: { hc: $.data.headcount_needed, v3: $.data.version } }
          assert:
            - "err == ERR_STALE_VERSION (publish bumped the version between read and write)"
            - "v2 == 2 and hc == 5 and v3 == 3 (retry with the fresh version succeeds)"

