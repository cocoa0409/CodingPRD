# ===========================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2744: Tip Pooling, Tip Credit & Service Charge Distribution
#
# Nine §0.5 rule_ids, two instances each (18 total). Every literal in an
# `assert:` was computed by executing the matching §1.3 `formula:` in Python
# against the fixture values pinned in `setup_api_calls:`.
#
# Logical clock: the server starts at 2026-08-01T00:00:00Z. Every instance's
# first setup call moves it to 2026-08-10T12:00:00Z (a Monday) so that the
# canonical pay period 2026-08-03 .. 2026-08-09 is entirely in the past and no
# shift trips ERR_SHIFT_FUTURE_DATE.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pay_line_tip_credit_weekly_aggregate_versus_per_shift
        grounds:
          - calculations.pay_line_wage_computation
          - calculations.pay_line_wage_computation.variants.WEEKLY_AGGREGATE
          - calculations.pay_line_wage_computation.variants.PER_SHIFT
          - state_machines.PayPeriod.OPEN_to_COMPUTED
          - state_machines.PayPeriod.COMPUTED_to_APPROVED
          - entities.PayLine.fields.variant
          - entities.PayLine.fields.tip_credit_cents
          - entities.Shift.fields.shift_tip_credit_cents
        distinguishing_aspect: >-
          The dual variant here lives on the PayLine wage domain: the identical two shifts yield
          tip_credit_cents 5500 and total_gross_cents 6100 under WEEKLY_AGGREGATE but
          tip_credit_cents 4596 and total_gross_cents 7004 under PER_SHIFT, a 904-cent divergence,
          because aggregating lets the 5000-tip shift subsidise the 500-tip shift while the
          per-shift reading caps each shift by its own tips.
        test_recipe:
          setup:
            - "One Texas location with applicable_min_wage_cents 725 and cash_wage_cents 213, tip credit claimed, and NO active tip-pool policy so no pool is required at compute time."
            - "One SERVER employee with a tip-credit notice acknowledged 2026-07-01, holding two CLOSED and DECLARED 480-minute shifts in the OPEN period 2026-08-03..2026-08-09, declaring 5000 and 500 cents of cash tips."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 0, max_continuous_side_work_minutes: 0, gross_sales_cents: 0, charged_sales_cents: 0, cc_processing_fee_bps: 0 }
              as: PayrollPreparer
              captures: { shift_a_id: $.data.id }
            - call: "POST /shifts/${shift_a_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_a_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-05T00:00:00Z", start_at: "2026-08-05T16:00:00Z", end_at: "2026-08-06T00:00:00Z", side_work_minutes: 0, max_continuous_side_work_minutes: 0, gross_sales_cents: 0, charged_sales_cents: 0, cc_processing_fee_bps: 0 }
              as: PayrollPreparer
              captures: { shift_b_id: $.data.id }
            - call: "POST /shifts/${shift_b_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_b_id}/declare-tips"
              payload: { declared_cash_tips_cents: 500, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
          assert:
            - "after the first trigger call PayPeriod.compute_variant == WEEKLY_AGGREGATE and PayPeriod.total_tip_credit_cents == 5500 and PayPeriod.total_topup_cents == 2692"
            - "after the first trigger call the single PayLine has variant == WEEKLY_AGGREGATE, status == DRAFT, total_minutes == 960, tip_credit_eligible_minutes == 960, straight_cash_cents == 3408, minimum_wage_obligation_cents == 11600, tips_available_cents == 5500, tip_credit_cents == 5500, topup_cents == 2692, total_gross_cents == 6100"
            - "after the second trigger call the same PayLine has variant == PER_SHIFT, status == FINAL, tip_credit_cents == 4596, topup_cents == 3596, total_gross_cents == 7004"
            - "PayLine.straight_cash_cents == 3408 both before and after the second call, so the entire 904-cent gap comes from the tip-credit and top-up limbs and not from the cash-wage limb"
            - "after the second trigger call Shift.${shift_a_id}.shift_tip_credit_cents == 4096 and Shift.${shift_b_id}.shift_tip_credit_cents == 500"
            - "after the second trigger call PayPeriod.total_tip_credit_cents == 4596 and PayPeriod.total_topup_cents == 3596"

      - name: pool_card_fee_actual_only_versus_capped_bps
        grounds:
          - calculations.pool_cc_fee_deduction
          - calculations.pool_cc_fee_deduction.variants.ACTUAL_ONLY
          - calculations.pool_cc_fee_deduction.variants.CAPPED_BPS
          - entities.Location.fields.cc_fee_policy
          - entities.Location.fields.cc_fee_cap_bps
          - entities.Shift.fields.cc_processing_fee_bps
          - entities.ShiftTipPool.fields.cc_fee_deducted_cents
          - state_machines.ShiftTipPool.distribution_status.PENDING_to_DISTRIBUTED
        distinguishing_aspect: >-
          A different dual variant on a different calculation: the state-law card-fee variant is
          selected by Location.cc_fee_policy rather than by lifecycle position, and the two units
          carry byte-identical shifts, declarations and per-shift 400-bps terminal rates. Only the
          statutory cap diverges, so cc_fee_deducted_cents is 1682 at the ACTUAL_ONLY unit and 1262
          at the CAPPED_BPS unit, and the 420-cent difference lands entirely in net_pool_cents and
          from there in the participants' allocations.
        test_recipe:
          setup:
            - "Two Texas locations, identical wage figures, one with cc_fee_policy ACTUAL_ONLY and one with cc_fee_policy CAPPED_BPS at cc_fee_cap_bps 300; both treat service charges as TIPS but no service charge is recorded."
            - "Each unit runs one SERVER and one BARTENDER 480-minute shift on 2026-08-04 with cc_processing_fee_bps 400, declaring 4000 + 30020 and 2000 + 12020 cents, and each unit has an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / HOURS_WEIGHTED_POINTS policy with cc_fee_pass_through true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Austin Actual", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { loc_a_id: $.data.id, loc_a_version: $.data.version }
            - call: "POST /locations"
              payload: { name: "Houston Capped", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "CAPPED_BPS", cc_fee_cap_bps: 300, service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { loc_b_id: $.data.id, loc_b_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BARTENDER", title: "Bartender", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1000, pool_share_points: 8, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_bar_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_a_id}", full_name: "A Server", external_payroll_ref: "A1" }
              as: PayrollAdmin
              captures: { emp_a1: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_a_id}", full_name: "A Bartender", external_payroll_ref: "A2" }
              as: PayrollAdmin
              captures: { emp_a2: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_b_id}", full_name: "B Server", external_payroll_ref: "B1" }
              as: PayrollAdmin
              captures: { emp_b1: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_b_id}", full_name: "B Bartender", external_payroll_ref: "B2" }
              as: PayrollAdmin
              captures: { emp_b2: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_a1}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_a2}", job_role_id: "${role_bar_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_b1}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_b2}", job_role_id: "${role_bar_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_a_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { policy_a_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_a_id}/activate"
              payload: { expected_location_version: "${loc_a_version}" }
              as: ComplianceOfficer
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_b_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { policy_b_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_b_id}/activate"
              payload: { expected_location_version: "${loc_b_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_a_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_a_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_b_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_b_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_a1}", location_id: "${loc_a_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_a_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 120000, charged_sales_cents: 90000, cc_processing_fee_bps: 400 }
              as: PayrollPreparer
              captures: { shift_a1: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_a2}", location_id: "${loc_a_id}", job_role_id: "${role_bar_id}", pay_period_id: "${period_a_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 60000, charged_sales_cents: 40000, cc_processing_fee_bps: 400 }
              as: PayrollPreparer
              captures: { shift_a2: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_b1}", location_id: "${loc_b_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_b_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 120000, charged_sales_cents: 90000, cc_processing_fee_bps: 400 }
              as: PayrollPreparer
              captures: { shift_b1: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_b2}", location_id: "${loc_b_id}", job_role_id: "${role_bar_id}", pay_period_id: "${period_b_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 60000, charged_sales_cents: 40000, cc_processing_fee_bps: 400 }
              as: PayrollPreparer
              captures: { shift_b2: $.data.id }
            - call: "POST /shifts/${shift_a1}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_a2}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_b1}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_b2}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_a1}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 30020 }
              as: Employee
              as_user_id: "${emp_a1}"
            - call: "POST /shifts/${shift_a2}/declare-tips"
              payload: { declared_cash_tips_cents: 2000, declared_charged_tips_cents: 12020 }
              as: Employee
              as_user_id: "${emp_a2}"
            - call: "POST /shifts/${shift_b1}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 30020 }
              as: Employee
              as_user_id: "${emp_b1}"
            - call: "POST /shifts/${shift_b2}/declare-tips"
              payload: { declared_cash_tips_cents: 2000, declared_charged_tips_cents: 12020 }
              as: Employee
              as_user_id: "${emp_b2}"
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_a_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_a_id: $.data.id }
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_b_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_b_id: $.data.id }
          trigger:
            - call: "POST /shift-tip-pools/${pool_a_id}/distribute"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shift-tip-pools/${pool_b_id}/distribute"
              payload: {}
              as: PayrollPreparer
          assert:
            - "both pools report total_contributed_cents == 6505 and service_charge_tips_cents == 0, confirming the contribution side is identical"
            - "ShiftTipPool.${pool_a_id}.cc_fee_deducted_cents == 1682, the ACTUAL_ONLY reading of 400 bps rounded per shift as 1201 + 481"
            - "ShiftTipPool.${pool_b_id}.cc_fee_deducted_cents == 1262, the CAPPED_BPS reading at the 300-bps statutory cap rounded per shift as 901 + 361"
            - "ShiftTipPool.${pool_a_id}.net_pool_cents == 4823 and ShiftTipPool.${pool_b_id}.net_pool_cents == 5243"
            - "both pools report total_share_weight == 8640 and participant_count == 2"
            - "GET /pool-allocations?shift_tip_pool_id=${pool_a_id} returns two DISTRIBUTION rows with allocated_cents 2680 for shift ${shift_a1} and 2143 for shift ${shift_a2}, the first carrying remainder_cent_awarded true"
            - "GET /pool-allocations?shift_tip_pool_id=${pool_b_id} returns two DISTRIBUTION rows with allocated_cents 2913 for shift ${shift_b1} and 2330 for shift ${shift_b2}, the first carrying remainder_cent_awarded true"
            - "ShiftTipPool.${pool_a_id}.distributed_cents == 4823 and ShiftTipPool.${pool_b_id}.distributed_cents == 5243"

  - rule_id: combinatorial_formula
    instances:
      - name: pool_card_fee_rounded_per_shift_then_summed
        grounds:
          - calculations.pool_cc_fee_deduction
          - calculations.pool_cc_fee_deduction.precision
          - calculations.pool_distribution
          - entities.ShiftTipPool.fields.cc_fee_deducted_cents
          - entities.ShiftTipPool.fields.net_pool_cents
          - entities.PoolAllocation.fields.remainder_cent_awarded
        distinguishing_aspect: >-
          Mode (b) rounding-order sensitivity. The card fee is rounded once per contributing shift
          and only then summed: 250 bps of 30020 and of 12020 give 751 + 301 == 1052, whereas the
          natural but forbidden order, 250 bps of the combined 42040 rounded once, gives 1051. The
          one-cent difference propagates into net_pool_cents (5453 rather than 5454) and changes the
          floor shares, so an implementation that rounds the total once cannot produce this
          instance's allocation triple.
        test_recipe:
          setup:
            - "One Texas location with cc_fee_policy ACTUAL_ONLY and an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / HOURS_WEIGHTED_POINTS policy carrying cc_fee_pass_through true."
            - "Three CLOSED and DECLARED shifts on 2026-08-04, each at cc_processing_fee_bps 250: SERVER 480 minutes declaring 4000 + 30020, BARTENDER 480 minutes declaring 2000 + 12020, and BUSSER 360 minutes declaring 0 + 0 whose role contributes nothing but holds 5 share points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Plano Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BARTENDER", title: "Bartender", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1000, pool_share_points: 8, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_bar_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BUSSER", title: "Busser", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 0, pool_share_points: 5, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_bus_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Sam Server", external_payroll_ref: "P1" }
              as: PayrollAdmin
              captures: { emp_s: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bea Bartender", external_payroll_ref: "P2" }
              as: PayrollAdmin
              captures: { emp_b: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Cal Busser", external_payroll_ref: "P3" }
              as: PayrollAdmin
              captures: { emp_c: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_s}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_b}", job_role_id: "${role_bar_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_c}", job_role_id: "${role_bus_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_s}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 120000, charged_sales_cents: 90000, cc_processing_fee_bps: 250 }
              as: PayrollPreparer
