      - name: par_stock_posture_exact_critical_floor_and_par_min_boundaries
        grounds:
          - calculations.par_stock_posture
          - state_machines.ClinicParLevel.STOCKOUT_to_OK
          - state_machines.ClinicParLevel.OK_to_BELOW_PAR
          - state_machines.ClinicParLevel.BELOW_PAR_to_CRITICAL
          - entities.ClinicParLevel.fields.stock_posture
          - entities.ClinicParLevel.fields.available_qty
        distinguishing_aspect: |
          Boundary metric #3 is an INTEGER SHELF-COUNT threshold reached through
          POST /dme/par-levels/{id}/stock-receipts: with par_min_qty 5 the
          critical floor is ceil(5/2) == 3, and the comparisons are exact --
          on_hand_qty 2 is CRITICAL, exactly 3 is BELOW_PAR (not CRITICAL), and
          exactly 5 is OK (not BELOW_PAR). Different metric and endpoint from
          the money threshold, the month window and the zero-count edge.
        test_recipe:
          setup:
            - "one accredited clinic licensed for TOTAL_JOINT with one TOTAL_JOINT product"
            - "one shelf with par_min_qty 5 and par_max_qty 20, created but not yet stocked"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["TOTAL_JOINT"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1836", description: "Knee immobilizer, post-arthroplasty", category: "OFF_SHELF_PREFAB", specialty: "TOTAL_JOINT", same_or_similar_group: "KNEE_IMMOBILIZER", reasonable_useful_lifetime_months: 24, allowed_amount_cents: 15000, cash_price_cents: 8000, unit_cost_cents: 4000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_ki_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_ki_id}", par_min_qty: 5, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_ki_id: $.data.id, posture_at_create: $.data.stock_posture, on_hand_at_create: $.data.on_hand_qty }
          trigger:
            - call: "POST /dme/par-levels/${par_ki_id}/stock-receipts"
              payload: { received_qty: 2 }
              as: InventoryManager
              captures: { posture_at_2: $.data.stock_posture, on_hand_at_2: $.data.on_hand_qty, available_at_2: $.data.available_qty }
            - call: "POST /dme/par-levels/${par_ki_id}/stock-receipts"
              payload: { received_qty: 1 }
              as: InventoryManager
              captures: { posture_at_3: $.data.stock_posture, on_hand_at_3: $.data.on_hand_qty }
            - call: "POST /dme/par-levels/${par_ki_id}/stock-receipts"
              payload: { received_qty: 1 }
              as: InventoryManager
              captures: { posture_at_4: $.data.stock_posture, on_hand_at_4: $.data.on_hand_qty }
            - call: "POST /dme/par-levels/${par_ki_id}/stock-receipts"
              payload: { received_qty: 1 }
              as: InventoryManager
              captures: { posture_at_5: $.data.stock_posture, on_hand_at_5: $.data.on_hand_qty, lifetime_at_5: $.data.lifetime_received_qty }
          assert:
            - "${posture_at_create} == STOCKOUT and ${on_hand_at_create} == 0"
            - "${on_hand_at_2} == 2 and ${posture_at_2} == CRITICAL (2 < ceil(5/2) == 3)"
            - "${available_at_2} == 2"
            - "${on_hand_at_3} == 3 and ${posture_at_3} == BELOW_PAR (exactly at the critical floor is BELOW_PAR, not CRITICAL)"
            - "${on_hand_at_4} == 4 and ${posture_at_4} == BELOW_PAR"
            - "${on_hand_at_5} == 5 and ${posture_at_5} == OK (exactly at par_min_qty is OK, not BELOW_PAR)"
            - "${lifetime_at_5} == 5"
            - "Clinic.${clinic_id}.dispensing_status == ACTIVE and Clinic.${clinic_id}.stockout_par_level_count == 0 throughout"

      - name: never_stocked_shelf_is_stockout_yet_counts_zero_against_clinic
        grounds:
          - calculations.clinic_dispensing_posture
          - entities.ClinicParLevel.fields.lifetime_received_qty
          - entities.Clinic.fields.stockout_par_level_count
          - entities.Clinic.fields.dispensing_status
        distinguishing_aspect: |
          Boundary metric #4 is a ZERO-COUNT / EMPTY-COLLECTION edge observed
          through GET /dme/clinics/{id}/dispensing-summary: two shelves that
          exist in stock_posture STOCKOUT contribute 0 to
          stockout_par_level_count because their lifetime_received_qty is 0, so
          the clinic stays ACTIVE and every summary total is 0 even though the
          par-level collection is non-empty. This is a set-membership edge, not
          the money, month or shelf-count thresholds of the other instances,
          and it is the only one read through the summary endpoint.
        test_recipe:
          setup:
            - "one accredited clinic licensed for SPINE and HAND with two products"
            - "two shelves created and never stocked; no encounter has ever been created"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE", "HAND"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_lso_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L3908", description: "Wrist cock-up splint, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "HAND", same_or_similar_group: "WRIST_SPLINT", reasonable_useful_lifetime_months: 12, allowed_amount_cents: 9000, cash_price_cents: 5000, unit_cost_cents: 2000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_wrist_id: $.data.id }
          trigger:
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_lso_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_1_id: $.data.id, par_1_posture: $.data.stock_posture, par_1_lifetime: $.data.lifetime_received_qty }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_wrist_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_2_id: $.data.id, par_2_posture: $.data.stock_posture, par_2_lifetime: $.data.lifetime_received_qty }
            - call: "GET /dme/clinics/${clinic_id}/dispensing-summary"
              payload: {}
              as: ComplianceOfficer
              captures: { sum_status: $.data.dispensing_status, sum_count: $.data.stockout_par_level_count, sum_received: $.data.units_received_total, sum_on_hand: $.data.units_on_hand_total, sum_accounted: $.data.units_accounted_total, sum_net_cash: $.data.net_cash_position_cents }
          assert:
            - "${par_1_posture} == STOCKOUT and ${par_1_lifetime} == 0"
            - "${par_2_posture} == STOCKOUT and ${par_2_lifetime} == 0"
            - "${sum_count} == 0 (both STOCKOUT shelves are excluded because lifetime_received_qty is 0)"
            - "${sum_status} == ACTIVE"
            - "${sum_received} == 0 and ${sum_on_hand} == 0 and ${sum_accounted} == 0"
            - "${sum_net_cash} == 0"
            - "Clinic.${clinic_id}.dispensing_status == ACTIVE and Clinic.${clinic_id}.stockout_par_level_count == 0"
            - "GET /dme/par-levels?clinic_id=${clinic_id} returns total_count 2 (the collection is non-empty even though the count is 0)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: custom_fab_order_blocked_while_supplier_quality_hold_active_rejected
        grounds:
          - state_machines.DispenseEncounter.clinical_status.DOCUMENTED_to_AWAITING_DEVICE
          - validations[priority=30]
          - errors[ERR_SUPPLIER_QUALITY_HOLD]
          - entities.Supplier.fields.quality_hold
          - endpoints[POST /dme/suppliers/{id}/standards-attestation]
          - endpoints[POST /dme/encounters/{id}/custom-fab-orders]
        distinguishing_aspect: |
          Entity pair #1 is DispenseEncounter -> Supplier: whether an encounter
          may leave DOCUMENTED for AWAITING_DEVICE depends on a flag living on
          the Supplier of its product, not on anything about the encounter. The
          rule's other instances use the pairs DispenseEncounter -> CustomFabOrder
          and CustomFabOrder -> Supplier, so no pair is repeated.
        test_recipe:
          setup:
            - "one accredited clinic licensed for FOOT_ANKLE, two group physicians, one custom-capable fitter, one patient"
            - "one supplier that is custom_fab_capable and standards-attested, with quality_hold currently false"
            - "one CUSTOM_FABRICATED AFO product and one documented, IOAS-attested encounter for it"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["FOOT_ANKLE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000151", specialty: "FOOT_ANKLE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Dev Rao", npi: "1700000152", specialty: "FOOT_ANKLE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_attest_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Kai Lund", credential: "CPO", credential_expires_on: "2027-12-31", privilege_scope: "CUSTOM_AND_OFF_SHELF" }
              as: PracticeAdmin
              captures: { fitter_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1940", description: "AFO, custom-fabricated", category: "CUSTOM_FABRICATED", specialty: "FOOT_ANKLE", same_or_similar_group: "AFO_CUSTOM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 42000, cash_price_cents: 49999, unit_cost_cents: 20000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_afo_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_a_id}", product_id: "${prod_afo_id}", ordering_physician_id: "${phys_order_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M21.371", mn_functional_deficit: "right foot drop with unstable gait", mn_expected_duration_months: 12 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_attest_id}"
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: true, quality_hold: true }
              as: ComplianceOfficer
          trigger:
            - call: "POST /dme/encounters/${enc_id}/custom-fab-orders"
              payload: { supplier_id: "${supplier_id}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { err_held: $.data.error_id }
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: true, quality_hold: false }
              as: ComplianceOfficer
            - call: "POST /dme/encounters/${enc_id}/custom-fab-orders"
              payload: { supplier_id: "${supplier_id}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { fab_id: $.data.id, fab_status: $.data.status, fab_promised_days: $.data.promised_turnaround_days_snapshot }
          assert:
            - "${err_held} == ERR_SUPPLIER_QUALITY_HOLD"
            - "HTTP status of the first custom-fab-order attempt is 422"
            - "DispenseEncounter.${enc_id}.clinical_status == DOCUMENTED after the rejected attempt (the guard is on the Supplier, so the encounter did not move)"
            - "no CustomFabOrder exists for the encounter after the rejected attempt: GET /dme/custom-fab-orders?encounter_id=${enc_id} returns total_count 0"
            - "${fab_status} == SUBMITTED after the hold is lifted"
            - "${fab_promised_days} == 10"
            - "DispenseEncounter.${enc_id}.clinical_status == AWAITING_DEVICE"
            - "the identical request body was accepted the second time; only the Supplier's quality_hold changed between the two attempts"

      - name: awaiting_device_fitting_blocked_until_fab_order_accepted_rejected
        grounds:
          - state_machines.DispenseEncounter.clinical_status.AWAITING_DEVICE_to_FITTED
          - state_machines.CustomFabOrder.READY_FOR_FITTING_to_ACCEPTED
          - validations[priority=24]
          - errors[ERR_INVALID_FAB_ORDER_STATE]
          - entities.CustomFabOrder.fields.status
          - endpoints[POST /dme/encounters/{id}/fitting-records]
        distinguishing_aspect: |
          Entity pair #2 is DispenseEncounter -> CustomFabOrder: the encounter's
          own clinical_status (AWAITING_DEVICE) is a legal `from` state, so
          ERR_INVALID_CLINICAL_STATE does not apply; what blocks the fitting is
          the *child* order sitting in READY_FOR_FITTING instead of ACCEPTED.
          Different pair from the Supplier-flag guard and from the
          CustomFabOrder -> Supplier attestation guard.
        test_recipe:
          setup:
            - "the same clinic, physicians, fitter, patient, supplier and AFO product as the previous instance"
            - "the encounter is AWAITING_DEVICE and its CustomFabOrder has been accepted by the supplier and delivered to the clinic, so the order is READY_FOR_FITTING"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["FOOT_ANKLE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000161", specialty: "FOOT_ANKLE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Dev Rao", npi: "1700000162", specialty: "FOOT_ANKLE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_attest_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Kai Lund", credential: "CPO", credential_expires_on: "2027-12-31", privilege_scope: "CUSTOM_AND_OFF_SHELF" }
              as: PracticeAdmin
