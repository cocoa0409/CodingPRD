            - call: "POST /wioa/employers/${emp_id}/ojt-contracts"
              payload: { participant_id: "${pb_id}", reimbursement_rate: 0.5, wage_cents_per_hour: 2000, planned_hours: 100, obligated_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z" }
              as: BusinessServicesRep
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /wioa/ojt-contracts/${cb_id}/activate"
              payload: {}
              as: BusinessServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "OJTContract.${cc_id}.status == \"ACTIVE\""
            - "response.data.error_id == \"ERR_OJT_CAPACITY_EXCEEDED\""

  - rule_id: compensating_invariant
    instances:
      - name: ita_budget_conservation_obligate_cancel
        grounds:
          - calculations.ita_budget_conservation
          - state_machines.ITAVoucher.DRAFT_to_OBLIGATED
          - state_machines.ITAVoucher.OBLIGATED_to_CANCELLED
        distinguishing_aspect: "Conserved quantity = ITA training dollars: obligate (available-=800000, obligated+=800000) then cancel a never-disbursed voucher (obligated-=800000, available+=800000) restores ita_budget_available_cents to 5,000,000 with zero drift; available+obligated+expended==total throughout."
        test_recipe:
          setup:
            - "Participant ELIGIBLE+ENROLLED, ACTIVE plan, ETPL program; voucher authorized 800000 OBLIGATED (available drawn to 4,200,000, none disbursed)."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp_id}", authorized_cost_cents: 800000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v_id: $.data.id }
            - call: "POST /wioa/ita-vouchers/${v_id}/obligate"
              payload: { expected_local_area_version: "${la_v}" }
              as: CaseManager
          trigger:
            - call: "POST /wioa/ita-vouchers/${v_id}/cancel"
              payload: {}
              as: CaseManager
          assert:
            - "ITAVoucher.${v_id}.status == \"CANCELLED\""
            - "LocalArea.${la_id}.ita_budget_available_cents == 5000000"
            - "LocalArea.${la_id}.ita_budget_obligated_cents == 0"
            - "LocalArea.${la_id}.ita_budget_expended_cents == 0"

      - name: supportive_budget_conservation_approve_void
        grounds:
          - calculations.supportive_budget_conservation
          - state_machines.SupportiveServicePayment.REQUESTED_to_APPROVED
          - state_machines.SupportiveServicePayment.APPROVED_to_VOIDED
        distinguishing_aspect: "Conserved quantity = supportive-service dollars (a distinct pool): approve (available-=50000, obligated+=50000) then void from APPROVED (obligated-=50000, available+=50000) restores supportive_available_cents to 200,000 with zero drift."
        test_recipe:
          setup:
            - "Participant ELIGIBLE+ENROLLED with an ACTIVE plan documenting supportive need; a CHILDCARE payment of 50000 APPROVED (supportive_available drawn to 150,000)."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING", supportive_need_documented: true }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/supportive-services"
              payload: { service_type: "CHILDCARE", amount_cents: 50000 }
              as: CaseManager
              captures: { ss_id: $.data.id }
            - call: "POST /wioa/supportive-services/${ss_id}/approve"
              payload: {}
              as: FiscalOfficer
          trigger:
            - call: "POST /wioa/supportive-services/${ss_id}/void"
              payload: {}
              as: FiscalOfficer
          assert:
            - "SupportiveServicePayment.${ss_id}.status == \"VOIDED\""
            - "Participant.${p_id}.supportive_available_cents == 200000"
            - "Participant.${p_id}.supportive_obligated_cents == 0"
            - "Participant.${p_id}.supportive_expended_cents == 0"
