# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Internal Audit Planning & Fieldwork Management
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.AuditableEntity.fields.status, entities.AuditableEntity.fields.regulatory_scrutiny]
        distinguishing_aspect: "Creating an AuditableEntity with only required fields applies defaults (status ACTIVE, regulatory_scrutiny false), mints a server id and version 1, and leaves retired_at null."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "Core Payments", business_owner: "CFO" }, as: AuditAdmin, captures: { ent: "$.data.id", ent_status: "$.data.status", ent_scrutiny: "$.data.regulatory_scrutiny", ent_v: "$.data.version" } }
          trigger:
            - { call: "GET /audit/auditable-entities/${ent}", payload: {}, as: AuditAdmin }
          assert:
            - "Created AuditableEntity.${ent}: status == ACTIVE, regulatory_scrutiny == false, version == 1, retired_at is null, id is a server-minted UUID, created_at/updated_at non-null"

      - name: entity_create_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.AuditableEntity.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field name is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /audit/auditable-entities", payload: { business_owner: "CFO" }, as: AuditAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: entity_create_with_system_field_rejected
        claim_type: system_fields
        grounds: [entities.AuditableEntity.fields.status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied system/computed fields (status) are not accepted on creation; the request is rejected with 400 ERR_INVALID_REQUEST rather than silently honored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /audit/auditable-entities", payload: { name: "X", business_owner: "Y", status: "RETIRED" }, as: AuditAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (read-only field in payload)"

      - name: engagement_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ENGAGEMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent engagement id returns 404 ERR_ENGAGEMENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /audit/engagements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: AuditAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ENGAGEMENT_NOT_FOUND and HTTP status 404"

      - name: auditor_grade_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Auditor.fields.grade, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "grade is constrained to {STAFF, SENIOR, MANAGER, DIRECTOR}; PARTNER is rejected with 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /audit/auditors", payload: { full_name: "Pat Partner", grade: "PARTNER" }, as: AuditAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (enum violation)"

      - name: risk_assessment_score_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.RiskAssessment.fields.likelihood, "errors[ERR_SCORE_OUT_OF_RANGE]"]
        distinguishing_aspect: "likelihood is pinned to integer 1..5; likelihood 6 returns 422 ERR_SCORE_OUT_OF_RANGE (semantic range check, distinct from the 400 shape check)."
        test_recipe:
          setup: ["Entity exists at version 1; a MANAGER auditor"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id", ent_v: "$.data.version" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
          trigger:
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent}", fiscal_year: 2026, likelihood: 6, impact: 3, expected_auditable_entity_version: "${ent_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SCORE_OUT_OF_RANGE and HTTP status 422"

      - name: engagement_list_pagination_and_filtering
        claim_type: listing
        grounds: [response_envelope.pagination_fields, endpoints]
        distinguishing_aspect: "Filtered list respects limit/offset: two engagements under one plan, limit=1 returns exactly one item with total_count 2 and has_more true; offset=1 returns the second with has_more false."
        test_recipe:
          setup: ["Plan with two engagements on two different entities (cooling rule kept out of scope)"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E1", business_owner: "O1" }, as: AuditAdmin, captures: { ent1: "$.data.id" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "E2", business_owner: "O2" }, as: AuditAdmin, captures: { ent2: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent1}", title: "G1", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/audit-plans/${plan}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { plan_v2: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent2}", title: "G2", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}" }
          trigger:
            - { call: "GET /audit/engagements?audit_plan_id=${plan}&limit=1&offset=0", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { page1_id: "$.data[0].id" } }
            - { call: "GET /audit/engagements?audit_plan_id=${plan}&limit=1&offset=1", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { page2_id: "$.data[0].id" } }
          assert:
            - "Page 1: data length 1, total_count == 2, has_more == true"
            - "Page 2: data length 1, has_more == false, and ${page2_id} != ${page1_id}"

      - name: assignment_body_fk_integrity
        claim_type: parent_relationships
        grounds: [entities.EngagementAssignment.fields.auditor_id, entities.EngagementAssignment.fields.engagement_id, "errors[ERR_AUDITOR_NOT_FOUND]", "errors[ERR_ENGAGEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology body FKs are validated in declared input order: a bogus engagement_id yields ERR_ENGAGEMENT_NOT_FOUND even when auditor_id is also bogus; a bogus auditor_id with valid engagement yields ERR_AUDITOR_NOT_FOUND."
        test_recipe:
          setup: ["One PLANNED engagement and one STAFF auditor"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
          trigger:
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", auditor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 10 }, as: AuditManager, as_user_id: "${mgr1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 10 }, as: AuditManager, as_user_id: "${mgr1}", captures: { err2: "$.data.error_id" } }
          assert:
            - "Both FKs bogus: error == ERR_ENGAGEMENT_NOT_FOUND (engagement_id validated before auditor_id per input order)"
            - "Only auditor bogus: error == ERR_AUDITOR_NOT_FOUND"

      - name: engagement_supersedes_self_reference
        claim_type: parent_relationships
        grounds: [entities.Engagement.fields.supersedes_engagement_id]
        distinguishing_aspect: "The self-referential FK links a follow-up engagement to a prior one; the reverse filter supersedes_engagement_id returns exactly the follow-up."
        test_recipe:
          setup: ["Two engagements (different entities), the second created with supersedes_engagement_id = first"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E1", business_owner: "O1" }, as: AuditAdmin, captures: { ent1: "$.data.id" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "E2", business_owner: "O2" }, as: AuditAdmin, captures: { ent2: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent1}", title: "G1", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng1: "$.data.id" } }
            - { call: "GET /audit/audit-plans/${plan}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { plan_v2: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent2}", title: "G2 follow-up", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", supersedes_engagement_id: "${eng1}", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng2: "$.data.id" } }
          trigger:
            - { call: "GET /audit/engagements?supersedes_engagement_id=${eng1}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { hit: "$.data[0].id" } }
          assert:
            - "Engagement.${eng2}.supersedes_engagement_id == ${eng1}"
            - "Reverse filter returns exactly [${eng2}] (total_count == 1)"

  - section: state_machines
    instances:
      - name: plan_invalid_transitions_from_draft
        claim_type: invalid_transition
        grounds: [state_machines.AuditPlan, "errors[ERR_PLAN_INVALID_STATE]", "errors[ERR_PLAN_NOT_APPROVED]"]
        distinguishing_aspect: "From DRAFT, approve/return/close are all rejected with ERR_PLAN_INVALID_STATE; committee-pack creation against a DRAFT plan is rejected with ERR_PLAN_NOT_APPROVED."
        test_recipe:
          setup: ["Plan DRAFT"]
          setup_api_calls:
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id" } }
          trigger:
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /audit/audit-plans/${plan}/return", payload: {}, as: AuditCommittee, as_user_id: "ac-1", captures: { e2: "$.data.error_id" } }
            - { call: "POST /audit/audit-plans/${plan}/close", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { e3: "$.data.error_id" } }
            - { call: "POST /audit/committee-packs", payload: { audit_plan_id: "${plan}", meeting_date: "2026-03-15T00:00:00Z", title: "Pack" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { e4: "$.data.error_id" } }
          assert:
            - "approve/return/close from DRAFT: ERR_PLAN_INVALID_STATE each"
            - "pack create on DRAFT plan: ERR_PLAN_NOT_APPROVED"
            - "AuditPlan.${plan}.status remains DRAFT"

      - name: plan_return_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.AuditPlan.RETURNED_to_SUBMITTED, "errors[ERR_PLAN_HAS_OPEN_ENGAGEMENTS]"]
        distinguishing_aspect: "The SUBMITTED -> RETURNED -> SUBMITTED cycle is legal; resubmission refreshes submitted_by_user_id, and the plan can then be approved."
        test_recipe:
          setup: ["Plan with one engagement; submitted by cae-1; returned by committee"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
            - { call: "POST /audit/audit-plans/${plan}/return", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
          trigger:
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-9", captures: { sub_by: "$.data.submitted_by_user_id" } }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
            - { call: "POST /audit/audit-plans/${plan}/close", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { e_close: "$.data.error_id" } }
          assert:
            - "Resubmission succeeds from RETURNED and submitted_by_user_id == cae-9 (refreshed)"
            - "Final AuditPlan.${plan}.status == APPROVED"
            - "Close while the engagement is still PLANNED: error == ERR_PLAN_HAS_OPEN_ENGAGEMENTS"

      - name: plan_self_approval_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AuditPlan.SUBMITTED_to_APPROVED, "errors[ERR_PLAN_SELF_APPROVAL]"]
        distinguishing_aspect: "Segregation of duties on the approval chain: the committee actor whose X-User-ID equals submitted_by_user_id cannot approve; a different committee user can."
        test_recipe:
          setup: ["Plan with one engagement, submitted by cae-1 (SUBMITTED)"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
          trigger:
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "cae-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-2" }
          assert:
            - "Approver cae-1 == submitter: error_id == ERR_PLAN_SELF_APPROVAL (403)"
            - "Approver ac-2: AuditPlan.${plan}.status == APPROVED and approved_by_user_id == ac-2"

      - name: engagement_cancel_cascades_and_terminal_lockdown
        claim_type: side_effect_execution
        grounds: [state_machines.Engagement.PLANNED_to_CANCELLED, state_machines.EngagementAssignment.ACTIVE_to_CANCELLED, entities.AuditPlan.fields.engagement_count]
        distinguishing_aspect: "Cancelling a PLANNED engagement cascades to its ACTIVE assignment (CANCELLED), releases reserved_hours to 0, decrements plan engagement_count; the terminal CANCELLED state then rejects further transitions (scope -> ERR_ENGAGEMENT_INVALID_STATE)."
        test_recipe:
          setup: ["Plan DRAFT with one PLANNED engagement holding one ACTIVE 40h assignment"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}", captures: { asg: "$.data.id" } }
          trigger:
            - { call: "POST /audit/engagements/${eng}/cancel", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
          assert:
            - "Engagement.${eng}.status == CANCELLED and reserved_hours == 0"
            - "EngagementAssignment.${asg}.status == CANCELLED (cascade down)"
            - "AuditPlan.${plan}.engagement_count == 0 (CANCELLED excluded)"
            - "Scope after cancel: error_id == ERR_ENGAGEMENT_INVALID_STATE (terminal lockdown)"

      - name: engagement_begin_fieldwork_requires_approved_plan
        claim_type: precondition_enforcement
        grounds: [state_machines.Engagement.SCOPED_to_FIELDWORK, "errors[ERR_PLAN_NOT_APPROVED]"]
        distinguishing_aspect: "begin-fieldwork on a SCOPED engagement whose plan is still DRAFT fails with ERR_PLAN_NOT_APPROVED — the cross-aggregate plan gate."
        test_recipe:
          setup: ["Plan DRAFT (not submitted); engagement SCOPED with LEAD assignment"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${mgr1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
          trigger:
