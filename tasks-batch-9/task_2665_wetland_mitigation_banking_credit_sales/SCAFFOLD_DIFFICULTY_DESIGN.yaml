      - name: sale_reversal_restores_escrow_and_demand_index_exactly
        grounds:
          - state_machines.CreditSale.EXECUTED_to_CANCELLED
          - entities.Permittee.fields.escrow_balance_cents
          - entities.Permittee.fields.deposited_cents
          - calculations.service_area_demand_index
          - endpoints.POST_/mitigation/credit-sales/{id}/reverse
        distinguishing_aspect: |
          CONSERVED QUANTITY: money (the permittee's escrow), plus the derived demand index that money
          movement feeds — a different invariant from the credit-conservation instance. An IRT reversal
          must return the entire executed_price_cents 32216400 to escrow (back to the full 40000000
          deposit) while RETAINING executed_price_cents on the row for audit, and must drop the sale out
