      - name: business_safety_vs_business_fiscal_on_intake
        grounds:
          - "validations[priority=7]"
          - "validations[priority=11.2]"
          - "errors[ERR_INVASIVE_SPECIES_BLOCKED]"
          - "errors[ERR_EVENT_CREDIT_CAP_EXCEEDED]"
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal) on POST
          /api/swap-events/{id}/intake-items — a different category pair than
          the first instance: the member has already earned 25 credits at this
          event (fiscal cap failure, 11.2) AND the new item's variety is
          invasive (safety failure, 7). The returned error MUST be
          ERR_INVASIVE_SPECIES_BLOCKED — safety outranks fiscal.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A; rare varieties VR and VR2 approved non-invasive; plain VN approved; invasive VI approved but invasive_flag true"
            - "SwapEvent E at S INTAKE_OPEN; Member M earned exactly 25 credits at E (10 + 10 + 5 via three ACCEPTED items)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VR", species: "Rare sp", category: "NATIVE", approved_zones: ["ZONE_5A"], rarity_flag: true, invasive_flag: false }
              as: ProgramAdmin
              captures: { vr_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VR2", species: "Rare sp 2", category: "NATIVE", approved_zones: ["ZONE_5A"], rarity_flag: true, invasive_flag: false }
              as: ProgramAdmin
              captures: { vr2_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VN", species: "Plain sp", category: "FLOWER", approved_zones: ["ZONE_5A"], rarity_flag: false, invasive_flag: false }
              as: ProgramAdmin
              captures: { vn_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VI", species: "Inv sp", category: "FLOWER", approved_zones: ["ZONE_5A"], rarity_flag: false, invasive_flag: true }
              as: ProgramAdmin
              captures: { vi_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-09-19T10:00:00Z", end_at: "2026-09-19T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            # 10 credits: rare PLANT_START EXCELLENT = round_half_up(5*1.5)+2 = 8+2
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vr_id}", item_type: "PLANT_START", condition: "EXCELLENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { i1: "$.data.id" }
            - call: "POST /api/intake-items/${i1}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            # 10 credits: rare PLANT_START EXCELLENT on second rare variety
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vr2_id}", item_type: "PLANT_START", condition: "EXCELLENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { i2: "$.data.id" }
            - call: "POST /api/intake-items/${i2}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            # 5 credits: non-rare PLANT_START GOOD = round_half_up(5*1.0) = 5 -> total exactly 25 (cap reached, allowed)
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vn_id}", item_type: "PLANT_START", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { i3: "$.data.id" }
            - call: "POST /api/intake-items/${i3}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "GET /api/members/${m_id}/credit-summary"
              as: ProgramAdmin
              captures: { earned_pre: "$.data.credits_earned_total" }
          trigger:
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vi_id}", item_type: "CUTTING", condition: "FAIR" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "earned_pre == 25                       # cap exactly reached (allowed)"
            - "err == ERR_INVASIVE_SPECIES_BLOCKED   # safety (7) beats fiscal cap (11.2)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: viability_threshold_exactly_70_passes
        grounds:
          - "calculations.germination_viability"
          - "validations[priority=10]"
          - "state_machines.SeedLot.QUARANTINE_to_ACTIVE"
        distinguishing_aspect: |
          Metric: viability percentage; endpoint: POST
          /api/germination-tests/{id}/certify. The pass band is INCLUSIVE at
          the boundary: result_pct exactly 70.00 (35/50) admits outcome=PASS
          and flips the lot to ACTIVE, while 69.90 (699/1000) only admits
          FAIL. The '>=' vs '>' distinction decides the lot's lifecycle.
        test_recipe:
          setup:
            - "Site S; variety V; lot L1 QUARANTINE with test 35/50 (70.00); lot L2 QUARANTINE with test 699/1000 (69.90)"
            - "Volunteer Vol ACTIVE"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "T70", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 70.00 }
              as: ProgramAdmin
              captures: { l1: "$.data.id" }
            - call: "POST /api/seed-lots/${l1}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${l1}/germination-tests"
              payload: { seeds_tested: 50, sprouted_count: 35 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t1: "$.data.id", r1: "$.data.result_pct" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "T69", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 69.90 }
              as: ProgramAdmin
              captures: { l2: "$.data.id" }
            - call: "POST /api/seed-lots/${l2}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${l2}/germination-tests"
              payload: { seeds_tested: 1000, sprouted_count: 699 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t2: "$.data.id", r2: "$.data.result_pct" }
          trigger:
            - call: "POST /api/germination-tests/${t1}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
              captures: { t1_st: "$.data.status" }
            - call: "POST /api/germination-tests/${t2}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
              captures: { err2: "$.data.error_id" }
            - call: "POST /api/germination-tests/${t2}/certify"
              payload: { outcome: "FAIL" }
              as: ProgramAdmin
              captures: { t2_st: "$.data.status" }
            - call: "GET /api/seed-lots/${l1}"
              as: ProgramAdmin
              captures: { l1_st: "$.data.status" }
            - call: "GET /api/seed-lots/${l2}"
              as: ProgramAdmin
              captures: { l2_st: "$.data.status" }
          assert:
            - "r1 == 70.00"
            - "t1_st == CERTIFIED and l1_st == ACTIVE     # 70.00 >= 70.00 admits PASS (inclusive boundary)"
            - "r2 == 69.90"
            - "err2 == ERR_VIABILITY_OUTCOME_MISMATCH     # 69.90 < 70.00 rejects outcome=PASS"
            - "t2_st == CERTIFIED and l2_st == REJECTED   # FAIL path: never-ACTIVE lot -> REJECTED"

      - name: borrow_limit_at_exact_cap
        grounds:
          - "calculations.member_effective_borrow_limit"
          - "validations[priority=11]"
          - "errors[ERR_BORROW_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Metric: active checkout count (integer, different metric than the
          viability percentage); endpoint: POST /api/checkouts (different
          endpoint than certify). A STANDARD member (limit 5) succeeds on the
          5th checkout (count goes 4 -> 5, admission test is strictly '<') and
          is rejected on the 6th: the boundary is inclusive for count == limit
          on the rejection side only.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A labels 10; variety V approved; lot L ACTIVE certified 90.00, 1000 seeds; 6 packets packed"
            - "Member M (fresh, STANDARD, limit 5)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "CAP5", harvest_year: 2026, seeds_received: 1000, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 6, seeds_per_packet: 20 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id", p4: "$.data[3].id", p5: "$.data[4].id", p6: "$.data[5].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p2}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p3}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p4}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p5}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c5: "$.data.id", c5_st: "$.data.status" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p6}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err6: "$.data.error_id" }
          assert:
            - "c5_st == ACTIVE                        # 5th borrow admitted (count 4 < 5)"
            - "err6 == ERR_BORROW_LIMIT_EXCEEDED      # 6th rejected: active_checkout_count == limit 5"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_gated_by_seedlot_state
        grounds:
          - "state_machines.SeedPacket.AVAILABLE_to_CHECKED_OUT"
          - "validations[priority=6.2]"
          - "errors[ERR_LOT_NOT_ACTIVE]"
        distinguishing_aspect: |
          Pair Checkout -> SeedLot: a checkout against an AVAILABLE packet
          whose parent lot sits in QUARANTINE (not ACTIVE) is rejected with
          ERR_LOT_NOT_ACTIVE even though the packet's own state is valid —
          validity depends on the parent lot's state, a different entity.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A labels 10; variety V approved; lot L ACTIVE certified 90.00 with 1 packet P (AVAILABLE)"
            - "Lot then moved ACTIVE -> QUARANTINE via recheck (P stays AVAILABLE)"
            - "Member M home site S"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "XS1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id" }
            - call: "POST /api/seed-lots/${lot_id}/recheck"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_LOT_NOT_ACTIVE   # packet AVAILABLE but parent lot QUARANTINE blocks the borrow"

      - name: intake_gated_by_swapevent_state
        grounds:
          - "state_machines.SwapIntakeItem.transitions"
          - "validations[priority=6.3]"
          - "errors[ERR_EVENT_NOT_INTAKE_OPEN]"
        distinguishing_aspect: |
          Pair SwapIntakeItem -> SwapEvent (different pair than
          Checkout->SeedLot): an intake submission against an event still in
          SCHEDULED (intake never opened) is rejected with
          ERR_EVENT_NOT_INTAKE_OPEN regardless of item/variety validity.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A; variety V approved non-invasive; SwapEvent E published (SCHEDULED) but intake NOT opened"
            - "Member M home site S"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"], invasive_flag: false }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-10-03T10:00:00Z", end_at: "2026-10-03T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v_id}", item_type: "SEED_PACKET", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_EVENT_NOT_INTAKE_OPEN   # event in SCHEDULED gates the child intake item"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics/resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: swap_event_buffered_interval_overlap
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_EVENT_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Resource Site with BUFFERED half-open semantics: existing event
          10:00-12:00 occupies [09:30, 12:30). A new event starting 12:20 is
          rejected (12:20 < 12:30 buffer end); a new event starting exactly
          12:30 is ACCEPTED (half-open: buffer-end == start is allowed). The
          30-minute buffer distinguishes this from the plain half-open packing
          session rule.
        test_recipe:
          setup:
            - "Site S; SwapEvent E1 at S 2026-10-10 10:00-12:00 (published)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E1", start_at: "2026-10-10T10:00:00Z", end_at: "2026-10-10T12:00:00Z" }
              as: ProgramAdmin
              captures: { e1: "$.data.id" }
            - call: "POST /api/swap-events/${e1}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E2-bad", start_at: "2026-10-10T12:20:00Z", end_at: "2026-10-10T13:00:00Z" }
              as: ProgramAdmin
              captures: { e2: "$.data.id" }
          trigger:
            - call: "POST /api/swap-events/${e2}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E3-ok", start_at: "2026-10-10T12:30:00Z", end_at: "2026-10-10T13:30:00Z" }
              as: ProgramAdmin
              captures: { e3: "$.data.id" }
            - call: "POST /api/swap-events/${e3}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { e3_st: "$.data.status" }
          assert:
            - "err_overlap == ERR_EVENT_WINDOW_OVERLAP   # 12:20 inside [09:30,12:30) buffered interval"
            - "e3_st == SCHEDULED                        # 12:30 == buffer end: half-open adjacency allowed"

      - name: volunteer_closed_interval_double_booking
        grounds:
          - "validations[priority=9.2]"
          - "errors[ERR_VOLUNTEER_DOUBLE_BOOKED]"
          - "validations[priority=9.1]"
        distinguishing_aspect: |
          Resource Volunteer (different resource than Site) with CLOSED
          interval semantics (different semantics than buffered half-open):
          sessions S1 09:00-11:00 and S2 11:00-13:00 coexist at the same site
          (site rule is half-open, back-to-back allowed) yet ONE volunteer
          cannot hold live assignments to both — touching endpoints count as a
          conflict because travel time is zero.
        test_recipe:
          setup:
            - "Site S; PackingSession S1 09:00-11:00 and S2 11:00-13:00 both created at site S (both accepted: site-level half-open allows adjacency)"
            - "Volunteer Vol ACTIVE with a SIGNUP assignment on S1"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/packing-sessions"
              payload: { site_id: "${s_id}", title: "S1", start_at: "2026-10-11T09:00:00Z", end_at: "2026-10-11T11:00:00Z", capacity: 5 }
              as: ProgramAdmin
              captures: { ps1: "$.data.id" }
            - call: "POST /api/packing-sessions"
              payload: { site_id: "${s_id}", title: "S2", start_at: "2026-10-11T11:00:00Z", end_at: "2026-10-11T13:00:00Z", capacity: 5 }
              as: ProgramAdmin
              captures: { ps2: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/packing-sessions/${ps1}/assignments"
              payload: { volunteer_id: "${vol_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { a1: "$.data.id", a1_st: "$.data.status" }
          trigger:
            - call: "POST /api/packing-sessions/${ps2}/assignments"
              payload: { volunteer_id: "${vol_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "a1_st == SIGNUP                          # first assignment fine"
            - "err == ERR_VOLUNTEER_DOUBLE_BOOKED       # 11:00 == 11:00 touch counts as conflict (closed semantics)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seed_count_conservation_pack_then_void_reintegrate
        grounds:
          - "calculations.seed_count_conservation"
          - "state_machines.SeedPacket.AVAILABLE_to_VOIDED"
          - "entities.SeedLot.fields.seeds_remaining"
        distinguishing_aspect: |
          Conserved quantity: TOTAL SEED COUNT of a lot. Forward action
          pack(10 x 20) moves 200 seeds remaining->in_packets; the
          compensating action void(mode=REINTEGRATE) on exactly those 10
          packets moves them back. After the pair, seeds_remaining == 1000 and
          seeds_in_packets == 0 with seeds_received == 1000 — zero drift.
        test_recipe:
          setup:
            - "Site S labels 50; variety V; lot L ACTIVE certified 90.00, seeds_received 1000 (remaining 1000, in_packets 0, discarded 0)"
            - "Volunteer Vol ACTIVE"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A", label_stock_count: 50 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "INV1", harvest_year: 2026, seeds_received: 1000, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 10, seeds_per_packet: 20 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { rem_mid: "$.data.seeds_remaining", inp_mid: "$.data.seeds_in_packets" }
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { q1: "$.data[0].id", q2: "$.data[1].id", q3: "$.data[2].id", q4: "$.data[3].id", q5: "$.data[4].id", q6: "$.data[5].id", q7: "$.data[6].id", q8: "$.data[7].id", q9: "$.data[8].id", q10: "$.data[9].id" }
            - call: "POST /api/seed-packets/${q1}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q2}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q3}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q4}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q5}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q6}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q7}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q8}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q9}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "POST /api/seed-packets/${q10}/void"
              payload: { mode: "REINTEGRATE" }
              as: ProgramAdmin
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { rem_end: "$.data.seeds_remaining", inp_end: "$.data.seeds_in_packets", disc_end: "$.data.seeds_discarded", received: "$.data.seeds_received" }
          assert:
            - "rem_mid == 800 and inp_mid == 200          # forward: pack moved 200 seeds"
            - "rem_end == 1000 and inp_end == 0           # compensating voids restored both buckets"
            - "disc_end == 0"
            - "received == rem_end + inp_end + disc_end  # invariant: 1000 == 1000 + 0 + 0"

      - name: credit_units_conservation_earn_then_revoke_on_cancel
        grounds:
          - "calculations.credit_balance_reconciliation"
          - "state_machines.SwapEvent.SCHEDULED_to_CANCELLED"
          - "entities.Member.fields.credits_balance"
        distinguishing_aspect: |
          Conserved quantity: SWAP CREDIT UNITS (different quantity than seed
          count). Forward action earns 10 credits (EARNED entries); the
          compensating action (event cancel) appends REVOKED entries totalling
          10. earned(10) == redeemed(0) + expired(0) + revoked(10) +
          balance(0) — the ledger identity holds with zero drift.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A; rare variety VR and plain variety VN, both approved non-invasive"
            - "SwapEvent E at S INTAKE_OPEN; Member M with two ACCEPTED items: rare PLANT_START/GOOD (7) + plain SEED_PACKET/EXCELLENT (3) = 10 earned"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VR", species: "Rare sp", category: "NATIVE", approved_zones: ["ZONE_5A"], rarity_flag: true, invasive_flag: false }
              as: ProgramAdmin
              captures: { vr_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VN", species: "Plain sp", category: "FLOWER", approved_zones: ["ZONE_5A"], rarity_flag: false, invasive_flag: false }
              as: ProgramAdmin
              captures: { vn_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-11-07T10:00:00Z", end_at: "2026-11-07T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vr_id}", item_type: "PLANT_START", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { i1: "$.data.id" }
            - call: "POST /api/intake-items/${i1}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vn_id}", item_type: "SEED_PACKET", condition: "EXCELLENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { i2: "$.data.id" }
            - call: "POST /api/intake-items/${i2}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "GET /api/members/${m_id}/credit-summary"
              as: ProgramAdmin
              captures: { earned_mid: "$.data.credits_earned_total", bal_mid: "$.data.credits_balance" }
          trigger:
            - call: "POST /api/swap-events/${e_id}/cancel"
              payload: {}
              as: ProgramAdmin
            - call: "GET /api/members/${m_id}/credit-summary"
              as: ProgramAdmin
              captures: { earned: "$.data.credits_earned_total", redeemed: "$.data.credits_redeemed_total", expired: "$.data.credits_expired_total", revoked: "$.data.credits_revoked_total", balance: "$.data.credits_balance" }
          assert:
            - "earned_mid == 10 and bal_mid == 10                      # forward: 7 + 3 earned"
            - "earned == 10 and revoked == 10 and balance == 0         # compensating revoke zeroes the balance"
            - "redeemed == 0 and expired == 0"
            - "earned == redeemed + expired + revoked + balance        # 10 == 0+0+10+0 (identity holds)"
