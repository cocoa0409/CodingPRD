      - name: transponder_post_gated_by_agency_suspend
        grounds:
          - state_machines.Agency.ACTIVE_to_SUSPENDED
          - validations[priority=5]
          - errors.ERR_AGENCY_SUSPENDED
        distinguishing_aspect: |
          Entity pair TollTransaction x Agency (different pair than
          ImageBill x PlateDataAgreement): a transponder trip at a plaza of a
