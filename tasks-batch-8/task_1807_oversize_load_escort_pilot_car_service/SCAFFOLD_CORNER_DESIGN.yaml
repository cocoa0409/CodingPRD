          trigger:
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "http 409 with data.error_id == ERR_PERMIT_WINDOW_INSUFFICIENT (embargo date 2026-08-10 is traversed)"

      - name: quote_expired_at_exact_ttl
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "Expiry is strict-less-than: at exactly quoted_at + 72h the quote is already expired (now < quote_expires_at is false at equality)."
