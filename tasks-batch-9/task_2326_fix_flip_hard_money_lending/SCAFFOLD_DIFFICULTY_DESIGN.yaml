            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /lending/loans/${loan1}"
              payload: {}
              as: LoanServicer
              captures: { dom_91: $.data.days_on_market, watch_91: $.data.exit_watch_flag }
            - call: "POST /lending/loans/${loan1}/extensions"
              payload: { months: 1 }
              as: LoanServicer
              captures: { watch_err: $.data.error_id }
            - call: "POST /lending/loans/${loan1}/exit-milestones"
              payload: { milestone_type: "PRICE_REDUCED", effective_date: "2026-12-01", listing_price_cents: 30500000, note: "Reduced after 91 days" }
              as: LoanServicer
              captures: { m2: $.data.id }
            - call: "POST /lending/loans/${loan1}/extensions"
              payload: { months: 1 }
              as: LoanServicer
              captures: { fee_bal_2: $.data.fee_balance_cents, rate_2: $.data.note_rate_bps, mat_2: $.data.maturity_date, ext_2: $.data.extension_count }
            - call: "POST /lending/loans/${loan1}/extensions"
              payload: { months: 1 }
              as: LoanServicer
              captures: { limit_err: $.data.error_id }
          assert:
            - "at clock 2026-11-30: days_on_market == 90 and exit_watch_flag == false (the test is strictly greater than 90)"
            - "extension 1 -> 200: fee 131514 added to fee_balance_cents, note_rate_bps 1200, default_rate_bps 1800, extension_count 1, extension_months_total 1, maturity_date 2027-06-10"
            - "at clock 2026-12-01, with no write between: days_on_market == 91 and exit_watch_flag == true"
            - "extension 2 -> 409 ERR_EXTENSION_BLOCKED_BY_EXIT_WATCH; extension_count stays 1, fee_balance_cents stays 131514, note_rate_bps stays 1200, maturity_date stays 2027-06-10"
            - "after the PRICE_REDUCED milestone: exit_watch_flag == false while days_on_market is STILL 91 (a reprice clears the flag; only DELISTED resets the counter) and exit_status is still LISTED"
            - "extension 3 -> 200: fee_balance_cents == 263028 (131514 twice on the unchanged 13151375 base), note_rate_bps 1250, default_rate_bps 1850, extension_count 2, maturity_date 2027-07-10"
            - "extension 4 -> 409 ERR_EXTENSION_LIMIT_REACHED (MAX_EXTENSIONS 2), a DIFFERENT error from the exit-watch refusal even though the flag is now false"
            - "fee_balance_cents is outside the conservation identity: commitment_balance_check_cents == 0 and committed_amount_cents == 23953713 throughout"

      - name: second_close_on_the_same_property_is_gated_by_the_property_state
        grounds:
          - state_machines.Property.UNDER_CONTRACT_to_BORROWER_OWNED
          - validations[priority=9]
          - errors[ERR_PROPERTY_STATE_INVALID]
          - entities.LoanApplication.fields.status
        distinguishing_aspect: |
          Two applications can be sized and APPROVED against the same collateral in parallel —
          nothing forbids it — but only the first close is legal, because closing consumes the
          Property's UNDER_CONTRACT state. The second close fails on a PEER entity's state
          (ERR_PROPERTY_STATE_INVALID), not on its own status, which is still APPROVED, and it
          must create no Loan row and must not touch the property or the first loan.
