        grounds:
          - "calculations.withdrawal_date_determination"
        excluded_because:
          difficulty_instance: official_vs_unofficial_midpoint_withdrawal_basis
          rationale: "Official vs midpoint divergence asserted there; attendance basis variant covered by corner attendance_basis_unofficial_uses_last_attendance."

