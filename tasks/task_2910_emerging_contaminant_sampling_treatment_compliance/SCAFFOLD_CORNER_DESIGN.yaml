      - name: one_acceptance_fans_out_across_four_entities
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /lab-results/{id}/review]
          - state_machines.Sample.transitions.RECEIVED_to_ANALYZED
          - entities.EntryPoint.fields.compliance_posture
        excluded_because:
          difficulty_instance: transitive_cascade / accepting_a_high_result_cascades_through_sample_entry_point_and_mandated_evaluation
          rationale: "That instance already asserts the full fan-out of a single accept — the result, its parent sample, the entry point's derived block and the auto-opened mandated evaluation — in one response boundary, which is exactly what this layer row asks for."

      - name: the_two_lraa_variants_are_read_side_by_side
        claim_type: dual_variant_calculation
        grounds:
          - calculations.lraa_calculation.variants
          - entities.ComplianceDetermination.fields.lraa_ng_per_l
          - entities.ComplianceDetermination.fields.planning_lraa_ng_per_l
        excluded_because:
          difficulty_instance: dual_variant_calc / lraa_compliance_and_planning_variants_diverge_on_two_censored_quarters
          rationale: "The censored-quarter case is the only input shape on which the compliance and planning variants can differ, and that instance pins both values plus the determination they drive on the same row; the bill-impact pair is covered by its own difficulty instance."

      - name: the_residuals_mass_identity_is_reconciled_after_a_void
        claim_type: derived_field_reconciliation
        grounds:
          - entities.PilotTest.fields.unmanifested_media_kg
          - endpoints[POST /residuals-manifests/{id}/void]
        excluded_because:
          difficulty_instance: compensating_invariant / residuals_mass_identity_is_restored_exactly_when_a_manifest_is_voided
          rationale: "That instance asserts the derived mass identity holds exactly before, during and after the compensating void, which is the reconciliation this row asks for; the parallel money identity on the capital funding ledger is covered by the second compensating_invariant instance."

  # ===========================================================================
  # Guide section 9 — Consistency model
  #
  # §1.2.1 declares consistency: immediate. The eventual-consistency and saga
  # rows are skipped, as recorded in this file's header.
  # ===========================================================================
  - section: consistency
    instances:

      - name: the_selection_response_already_carries_everything_it_created
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - endpoints[POST /treatment-evaluations/{id}/decision]
          - calculations.rate_impact_analysis
        distinguishing_aspect: "A single SELECT creates a CapitalProject, runs the whole seven-step rate ladder on it and flips two fields on the winning pilot; with immediate consistency the very next read — taken with no clock advance and no other call in between — must already show the finished ladder, so an implementation that defers the derivation to a background pass or to the first read of the project fails here."
        test_recipe:
          setup:
            - "EPTDS-01 at population 45000 has a GAC pilot (score 80.14) and an IX pilot (score 76.20) both completed above the 90.00 removal floor."
            - "No clock call is made anywhere in this recipe, so the logical clock stays at its 2026-08-01T00:00:00.000Z default throughout."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 520000000, annual_om_estimate_cents: 28000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 18000.00, spent_media_kg: 300.00 }
              as: TreatmentEngineer
          trigger:
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "GAC scores highest above the removal floor" }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id" }
            - call: "GET /pilot-tests/${gac_id}"
              payload: {}
              as: TreatmentEngineer
            - call: "GET /entry-points/${ep_id}"
              payload: {}
              as: TreatmentEngineer
          assert:
            - "The decision response itself carries status SELECTED and selected_technology GAC — no re-read is needed"
            - "The decision response carries selected_at 2026-08-01T00:00:00.000Z, the unchanged logical clock"
            - "The immediately following list read returns exactly one CapitalProject with total_count == 1"
            - "CapitalProject.${proj_id}.capital_cost_cents == 680000000 and annual_om_cost_cents == 31000000 on that first read"
            - "CapitalProject.${proj_id}.rate_impact_pct == 7.18 and uniform_monthly_increase_cents == 341 on that first read"
            - "CapitalProject.${proj_id}.funding_status == NOT_APPLIED and construction_status == PLANNED"
            - "CapitalProject.${proj_id}.required_disposal_method == REACTIVATION and concentrate_permit_required == false"
            - "PilotTest.${gac_id}.selected == true and PilotTest.${ix_id}.selected == false"
            - "EntryPoint.${ep_id}.treatment_status == INSTALLED is NOT yet true — it stays PILOT until the project reaches IN_SERVICE"
