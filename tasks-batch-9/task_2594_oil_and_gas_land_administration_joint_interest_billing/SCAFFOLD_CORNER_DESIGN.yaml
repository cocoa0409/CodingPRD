      - name: plugging_liability_uses_the_base_depth_rate_and_cap_constants
        claim_type: constants_applied
        grounds:
          - calculations.plugging_liability_estimate
          - entities.Well.fields.plugging_liability_cents
          - endpoints.POST_/land-admin/wells
        distinguishing_aspect: |
          PLUG_BASE_CENTS 3500000 plus DEPTH_RATE_CENTS_PER_FT 1200 per foot, clamped at
          PLUG_CAP_CENTS 25000000: 9500 ft yields 14900000, 17916 ft yields 24999200 (just under the
          cap) and 17917 ft yields 25000000 (the raw 25000400 is clamped).
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
            - "Two wells already created: Sandstone 1H at 9500 ft and Sandstone 2H at 17916 ft"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_shallow_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 2H", api_number: "42-123-45679", product_type: "GAS", total_depth_ft: 17916 }
              as: LandAdministrator
              captures: { well_mid_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 3H", api_number: "42-123-45680", product_type: "GAS", total_depth_ft: 17917 }
              as: LandAdministrator
              captures: { well_deep_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Well.${well_shallow_id}.plugging_liability_cents == 14900000"
            - "Well.${well_mid_id}.plugging_liability_cents == 24999200"
            - "Well.${well_deep_id}.plugging_liability_cents == 25000000"

      - name: bond_coverage_rounds_the_per_well_product_before_the_factor
        claim_type: precision
        grounds:
          - calculations.bond_coverage_requirement
          - entities.InterestOwner.fields.required_bond_cents
          - endpoints.POST_/land-admin/wells/{well_id}/interests
        distinguishing_aspect: |
          For one 9500 ft well (plugging_liability_cents 14900000) and a 0.333333 working interest the
          per-well product 4966661.7 is rounded to 4966662 FIRST and only then multiplied by
          BOND_COVERAGE_FACTOR 1.25, giving required_bond_cents 6208328; multiplying the unrounded
          product would give 6208327.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 9H, OIL, 9500 ft (plugging_liability_cents 14900000)"
            - "Interest owner Gamma Operating LP with bond_posted_cents 20000000 and no interests yet"
