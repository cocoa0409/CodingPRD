          cpra: 0.85
          dialysis_years: 2.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          rec1_id: $.data.id
      - call: POST /donor-candidates
        payload:
          program_id: ${prog_id}
          mrn: D-001
          abo_blood_type: O
          age_years: 41
          intended_recipient_id: ${rec1_id}
