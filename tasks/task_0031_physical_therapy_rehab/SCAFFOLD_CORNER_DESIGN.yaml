scaffold_corner_design:

  # ───────────────────────────────────────────────────────────────────────────
  # Section: entities
  # ───────────────────────────────────────────────────────────────────────────
  - section: entities
    instances:
      - name: patient_creation_with_required_fields_returns_201
        claim_type: Creation
        grounds:
          - entities.Patient
          - endpoints["POST /rehab/patients"]
        distinguishing_aspect: "Creating a Patient with all required input fields returns 201 and surfaces id, created_at, version=1, status=ACTIVE."
        test_recipe:
          setup:
            - "Empty system. PlatformAdmin authenticated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rehab/patients"
              payload: { full_name: "Alice", date_of_birth: "1980-01-15", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id, pt_status: $.data.status, pt_v: $.data.version }
          assert:
            - "response.status == 201"
            - "Patient.${pt_id}.status == ACTIVE"
            - "Patient.${pt_id}.version == 1"

      - name: patient_get_by_nonexistent_id_returns_404
        claim_type: NotFound
        grounds:
          - entities.Patient
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=200]
        distinguishing_aspect: "GET /rehab/patients/{id} with a UUID that does not match any row returns 404 with ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty system. PlatformAdmin authenticated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rehab/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: patient_list_pagination_envelope_total_count_has_more
        claim_type: Listing
        grounds:
          - entities.Patient
          - endpoints["GET /rehab/patients"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /rehab/patients respects limit/offset and surfaces total_count and has_more in the envelope."
        test_recipe:
          setup: ["3 Patients created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/patients"
              payload: { full_name: "P1", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
            - call: "POST /rehab/patients"
              payload: { full_name: "P2", date_of_birth: "1971-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
            - call: "POST /rehab/patients"
              payload: { full_name: "P3", date_of_birth: "1972-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
          trigger:
            - call: "GET /rehab/patients"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response.data is an array of 3 Patient objects"
            - "envelope total_count == 3"
            - "envelope has_more == false"

      - name: patient_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.full_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /rehab/patients without full_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["PlatformAdmin authenticated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rehab/patients"
              payload: { date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: patient_is_veteran_default_false_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Patient.fields.is_veteran
        distinguishing_aspect: "POST /rehab/patients without is_veteran defaults the field to false (per §1.1 default)."
        test_recipe:
          setup: ["PlatformAdmin authenticated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rehab/patients"
              payload: { full_name: "DefaultPat", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL" }
              as: PlatformAdmin
              captures: { pt_id: $.data.id, pt_vet: $.data.is_veteran }
          assert:
            - "Patient.${pt_id}.is_veteran == false"

      - name: patient_insurance_type_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.insurance_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An insurance_type value outside the declared enum {MEDICARE, COMMERCIAL, MEDICAID, VA_TRICARE, SELF_PAY} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["PlatformAdmin authenticated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rehab/patients"
              payload: { full_name: "BadEnumPat", date_of_birth: "1970-01-01", insurance_type: "INVALID_PAYER", is_veteran: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: therapist_npi_uniqueness_enforced
        claim_type: Type Constraints
        grounds:
          - entities.Therapist.fields.npi_number
        distinguishing_aspect: "Creating a second Therapist with the same npi_number returns ERR_INVALID_REQUEST (unique-across-Therapist constraint per §1.1)."
        test_recipe:
          setup: ["1 Therapist npi=2000000001."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "Th One", npi_number: "2000000001", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /rehab/therapists"
              payload: { full_name: "Th Two", npi_number: "2000000001", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # ───────────────────────────────────────────────────────────────────────────
  # Section: state_machines
  # ───────────────────────────────────────────────────────────────────────────
  - section: state_machines
    instances:
      - name: poc_initial_state_is_draft_on_create
        claim_type: Initial State
        grounds:
          - state_machines.PlanOfCare.initial_state
        distinguishing_aspect: "Newly-created PlanOfCare has status=DRAFT (matching initial_state per §1.2)."
        test_recipe:
          setup: ["1 Patient, 1 Therapist (CA license)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Init", npi_number: "2000000010", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Init", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id, poc_status: $.data.status }
          assert:
            - "PlanOfCare.${poc_id}.status == DRAFT"

      - name: poc_terminal_discharged_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PlanOfCare.terminal_states
        distinguishing_aspect: "A DISCHARGED PlanOfCare cannot be discharged again — POST /discharge returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE POC discharged once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Term", npi_number: "2000000011", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Term", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/discharge-assessments"
              payload: { plan_of_care_id: "${poc_id}", assessing_therapist_id: "${th_id}", final_functional_score: 60, goals_met_count: 5, total_goals_count: 10, assessed_on: "2026-06-10" }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/discharge"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /rehab/plans-of-care/${poc_id}/discharge"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: visit_cancel_after_finalize_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Visit.terminal_states
          - state_machines.Visit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "A FINALIZED Visit cannot be cancelled — /cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["1 FINALIZED Visit."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T VFin", npi_number: "2000000012", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat VFin", date_of_birth: "1970-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 10, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-02T09:00:00Z", scheduled_end_utc: "2026-06-02T09:30:00Z", planned_minutes: 30, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v_id: $.data.id }
            - call: "POST /rehab/visits/${v_id}/complete"
              payload: { actual_minutes: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_v: $.data.version }
            - call: "POST /rehab/visits/${v_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_v}" }
              as: BillingClerk
          trigger:
            - call: "POST /rehab/visits/${v_id}/cancel"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: visit_initial_state_is_scheduled_on_create
        claim_type: Initial State
        grounds:
          - state_machines.Visit.initial_state
        distinguishing_aspect: "Newly-created Visit has status=SCHEDULED (matching initial_state per §1.2)."
        test_recipe:
          setup: ["ACTIVE POC + grant ready for visit scheduling."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T VI", npi_number: "2000000013", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat VI", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 10, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-02T09:00:00Z", scheduled_end_utc: "2026-06-02T09:30:00Z", planned_minutes: 30, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v_id: $.data.id, v_status: $.data.status }
          assert:
            - "Visit.${v_id}.status == SCHEDULED"

      - name: hep_supersedes_prior_active_hep_on_same_poc
        claim_type: Side Effect Execution
        grounds:
          - entities.HomeExerciseProgram
          - endpoints["POST /rehab/home-exercise-programs"]
        distinguishing_aspect: "Posting a new HEP on the same POC transitions the prior ACTIVE HEP to SUPERSEDED — side effect declared on POST /rehab/home-exercise-programs."
        test_recipe:
          setup: ["ACTIVE POC. 1 ACTIVE HEP already prescribed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T HEP", npi_number: "2000000014", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat HEP", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/home-exercise-programs"
              payload: { plan_of_care_id: "${poc_id}", prescribed_by_therapist_id: "${th_id}", exercise_count: 4, weekly_frequency: 3, prescribed_on: "2026-06-02" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { hep1_id: $.data.id }
          trigger:
            - call: "POST /rehab/home-exercise-programs"
              payload: { plan_of_care_id: "${poc_id}", prescribed_by_therapist_id: "${th_id}", exercise_count: 6, weekly_frequency: 5, prescribed_on: "2026-06-05" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { hep2_id: $.data.id }
            - call: "GET /rehab/home-exercise-programs/${hep1_id}"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { hep1_status: $.data.status }
            - call: "GET /rehab/home-exercise-programs/${hep2_id}"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { hep2_status: $.data.status }
          assert:
            - "HomeExerciseProgram.${hep1_id}.status == SUPERSEDED"
            - "HomeExerciseProgram.${hep2_id}.status == ACTIVE"

      - name: poc_activate_cascades_va_referral_to_consumed
        claim_type: Cross-entity
        grounds:
          - state_machines.PlanOfCare.DRAFT_to_ACTIVE
          - state_machines.VeteranReferral.ISSUED_to_CONSUMED
        distinguishing_aspect: "Activating a VA_TRICARE POC whose veteran_referral_id is set cascades the referral ISSUED -> CONSUMED (depth-2 cascade hop 1)."
        test_recipe:
          setup: ["1 VA_TRICARE Patient (is_veteran=true). 1 ISSUED VeteranReferral. 1 DRAFT POC linked to both. INITIAL Eval recorded."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T VA", npi_number: "2000000015", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Vet Pat", date_of_birth: "1965-01-01", insurance_type: "VA_TRICARE", is_veteran: true }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/veteran-referrals"
              payload: { patient_id: "${pt_id}", referring_va_facility_code: "VA001", referral_authorization_number: "VA-AUTH-12345", max_authorized_visits: 20, expires_on: "2026-12-31" }
              as: VAReferralCoordinator
              captures: { vr_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", veteran_referral_id: "${vr_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_status: $.data.status }
            - call: "GET /rehab/veteran-referrals/${vr_id}"
              payload: {}
              as: VAReferralCoordinator
              captures: { vr_status: $.data.status }
          assert:
            - "PlanOfCare.${poc_id}.status == ACTIVE"
            - "VeteranReferral.${vr_id}.status == CONSUMED"

      - name: poc_clock_auto_transition_active_to_recert_due
        claim_type: Auto Transition
        grounds:
          - state_machines.PlanOfCare.ACTIVE_to_RECERT_DUE
        distinguishing_aspect: "Clock advancing past certified_end_date - 7 days auto-transitions ACTIVE POC to RECERT_DUE."
        test_recipe:
          setup: ["ACTIVE POC ending 2026-06-08."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Clk", npi_number: "2000000016", license_state: "CA", medicare_provider_enrolled: false }
