      - name: psychometric_basis_flag_defaults_to_operational_only_and_changes_what_a_pretest_batch_proves
        claim_type: conditional_feature_flags
        grounds:
          - entities.CertificationProgram.fields.psychometric_stat_basis
          - calculations.item_statistics.variants
          - calculations.item_flag_evaluation
          - state_machines.Item.PRETEST_to_OPERATIONAL
          - calculations.blueprint_posture
          - endpoints.POST_/items/{id}/response-batches
        distinguishing_aspect: |
          The flag is a per-programme feature switch with a declared default: omitting
          psychometric_stat_basis yields OPERATIONAL_ONLY, and then a 40-response PRETEST batch
          proves nothing — stat_basis_applied INSUFFICIENT_DATA, p_value null, the item stays
          PRETEST and the programme stays DEFICIENT — while the identical batch on the
          explicitly POOLED programme computes p_value 0.6000 and discrimination_index 0.6000,
          promotes the item to OPERATIONAL and flips the blueprint to COMPLETE. There is no
          programme-update endpoint, so the comparison is made across two programmes rather than
          by toggling one.
        test_recipe:
          setup:
            - "Two ACTIVE programmes, each with domain_specs [{D1, 100, min_operational_items 1}], form_length 1 and min_responses_for_stats 30: CPX declares psychometric_stat_basis POOLED, CPY omits the field entirely and therefore defaults to OPERATIONAL_ONLY."
            - "Each programme has one APPROVED item with all accumulators at zero: ${itemX_id} under CPX and ${itemY_id} under CPY."
