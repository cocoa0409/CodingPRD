    check: "the technician the operation depends on is ACTIVE, has cert_expires_on strictly after the current logical clock instant, and holds the scope the operation demands: the station's station_type for a station log, QA_SIGNOFF for a qa-signoff, and ServicePart.requires_cert_scope for the reported_by_technician_id of a warranty claim when that scope is not NONE"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
