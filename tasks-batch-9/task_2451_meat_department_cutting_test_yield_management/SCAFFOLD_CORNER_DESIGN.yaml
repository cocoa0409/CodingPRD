              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { po2_id: $.data.id }
            - call: "POST /meat-ops/pre-orders/${po1_id}/transitions"
              payload: { action: "CONFIRM" }
              as: ServiceClerk
              as_user_id: "clerk-01"
            - call: "POST /meat-ops/pre-orders/${po2_id}/transitions"
