              captures: { p_first_outcome: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${mlq_id}", test_code: "POTENCY", measured_value: 80.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "GET /material-lots/${mlp_id}"
              payload: {}
              as: QAReleaser
              captures: { p_oos_at: $.data.first_oos_at, p_retests_before: $.data.retest_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${mlp_id}", test_code: "POTENCY", measured_value: 100.0, is_retest: true }
