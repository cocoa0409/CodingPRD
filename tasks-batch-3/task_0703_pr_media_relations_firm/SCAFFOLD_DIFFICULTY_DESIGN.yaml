  - rule_id: resource_temporal_overlap
    instances:
      - name: spokesperson_overlap_with_prep_buffer
        grounds:
          - state_machines.Interview.REQUESTED_to_REQUESTED
          - entities.Spokesperson.fields.prep_buffer_minutes
          - validations[priority=10]
          - errors[ERR_SPOKESPERSON_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Spokesperson overlap expands each interval symmetrically by prep_buffer_minutes=30 on
          both sides, so a second interview at [11:15,12:00) that is disjoint (15-min gap) from
          the first [10:00,11:00) still collides with the buffered window [09:30,11:30) and is
          rejected with ERR_SPOKESPERSON_DOUBLE_BOOKED — buffered interval semantics on Spokesperson.
        test_recipe:
