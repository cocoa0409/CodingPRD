              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Wrong Side", date_of_birth: "1990-09-09", ssn_last4_hash: "hWS1", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
            - call: "POST /driver-exchange/licenses"
              payload: { driver_id: "${d_id}", license_class: "STANDARD" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { l_id: $.data.id }
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "SSN", result: "VERIFIED" }
              as: FederalVerifier
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "LAWFUL_STATUS", result: "VERIFIED" }
              as: FederalVerifier
            - call: "GET /driver-exchange/drivers/${d_id}"
              payload: {}
              as: AssociationAdmin
              captures: { d_v2: $.data.version }
            - call: "POST /driver-exchange/license-transfers"
              payload: { driver_id: "${d_id}", prior_license_id: "${l_id}", expected_driver_version: "${d_v2}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /driver-exchange/license-transfers/${t_id}/record-surrender"
              payload: {}
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_JURISDICTION_OWNERSHIP_MISMATCH (http 403): surrender belongs to from_jurisdiction AA, not BB"
            - "LicenseTransfer.${t_id}.status remains INITIATED; License.${l_id}.status remains ACTIVE"

      - name: fee_settle_by_other_jurisdiction_forbidden
        claim_type: ownership_denial
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_JURISDICTION_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Only the invoiced jurisdiction's registrar may settle: BB's registrar settling AA's invoice fails ownership even with the correct amount."
        test_recipe:
          setup: ["Jurisdiction AA ACTIVE with CERTIFIED POINTER_NETWORK; AA's invoice fiscal_year 2027 projected_volume 8000 is ISSUED (provisional 2600000); a bare jurisdiction BB exists"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "BB", name: "State B", fee_tier: "TIER_2" }
              as: AssociationAdmin
              captures: { j_b: $.data.id }
            - call: "POST /driver-exchange/fee-invoices"
              payload: { jurisdiction_id: "${j_a}", fiscal_year: 2027, projected_volume: 8000 }
              as: AssociationAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /driver-exchange/fee-invoices/${f_id}/settle"
              payload: { amount_cents: 2600000 }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_JURISDICTION_OWNERSHIP_MISMATCH (http 403): amount correctness is irrelevant when ownership fails"
            - "FeeInvoice.${f_id}.status remains ISSUED"

  # ---------------------------------------------------------------------------
  # From Cross-Cutting Complexity Layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: license_reinstate_after_dq_expiry
        claim_type: scheduled_actions
        grounds:
          - "state_machines.License.SUSPENDED_to_ACTIVE"
          - "state_machines.Disqualification.ACTIVE_to_COMPLETED"
          - "endpoints"
        distinguishing_aspect: "The logical clock is the scheduler: once it passes the disqualification's end_date (2027-09-01), the derived status flips to COMPLETED and reinstate succeeds — no wall-clock waiting."
        test_recipe:
          setup: ["Jurisdiction AA ACTIVE with CERTIFIED POINTER_NETWORK and COMMERCIAL_DRIVER_NETWORK; driver D's record held by AA; D's verified COMMERCIAL license is SUSPENDED by an AUTO_MAJOR disqualification [2026-09-01, 2027-09-01]; clock then advanced to 2027-09-02"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "COMMERCIAL_DRIVER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a2}", window_start: "2026-08-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a2}/complete"
              payload: { result: "PASSED", score: 95 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a2}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Reinstate Me", date_of_birth: "1985-05-05", ssn_last4_hash: "hRM1", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
            - call: "POST /driver-exchange/licenses"
              payload: { driver_id: "${d_id}", license_class: "COMMERCIAL" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { l_id: $.data.id }
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "SSN", result: "VERIFIED" }
              as: FederalVerifier
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "LAWFUL_STATUS", result: "VERIFIED" }
              as: FederalVerifier
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2026-08-15", conviction_date: "2026-08-25", severity: "CMV_MAJOR", points: 6 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
            - call: "POST /driver-exchange/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "GET /driver-exchange/driver-records/${r_id}/disqualifications"
              payload: {}
              as: AuditAuthority
              captures: { dq_status: "$.data[0].status" }
            - call: "POST /driver-exchange/licenses/${l_id}/reinstate"
              payload: {}
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { l_status: $.data.status }
          assert:
            - "dq_status == COMPLETED (2027-09-02 > end_date 2027-09-01)"
            - "l_status == ACTIVE (reinstate succeeds once no derived-ACTIVE disqualification remains)"

      - name: cascade_conviction_to_suspension_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.License.ACTIVE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: "transitive_cascade / conviction_to_license_suspension_cascade"
          rationale: "The depth-3 conviction -> points -> disqualification -> license suspension chain is asserted end-to-end by the named §1.8 instance."

      - name: cascade_suspend_cancels_transfers_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Jurisdiction.ACTIVE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: "transitive_cascade / jurisdiction_suspend_cascade_cancels_transfers"
          rationale: "The depth-2 jurisdiction -> participation -> transfer cascade is asserted by the named §1.8 instance."

      - name: occ_correct_version_success_covered
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[transfer-initiate-stale-driver]"
        excluded_because:
          difficulty_instance: "compensating_invariant / transfer_completion_conserves_single_active_record"
          rationale: "That instance's setup initiates a transfer with a fresh captured driver version and succeeds; the stale-version failure arm is exercised by §1.9 transfer_initiate_stale_driver_version_returns_412."

      - name: immediate_consistency_of_conviction_post_covered
        claim_type: immediate_consistency
        grounds:
          - "entities.Conviction.fields.is_late"
        excluded_because:
          difficulty_instance: "boundary_precision_check / conviction_deadline_exactly_30_vs_31_days"
          rationale: "That instance captures is_late directly from the POST /convictions response envelope, proving computed fields are consistent in the creating response."

