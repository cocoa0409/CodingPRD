# =============================================================================
# Task 2213 — Affiliate Homeownership Program & Sweat Equity
# §1.9 Scaffold Corner Design (Claim Coverage Index)
#
# Breadth index. §1.8 is the depth probe (9 difficulty rules x 2 instances);
# this file walks references/claim-extraction-guide.md row-by-row against
# §1.1–§1.7 of SCAFFOLD.yaml and enumerates every testable claim §1.8 does not
# already assert: envelope shape, defaults, computed/system fields, listing and
# pagination, 404 path/FK integrity, invalid-from and terminal-state rejection,
# OCC 412 conflicts, RBAC and ownership denial, every remaining error_id in the
# catalog, cascade side effects and the immediate-consistency contract.
#
# Fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * logical clock starts at 2026-08-01T00:00:00.000Z on a fresh service; it is
#     only ever moved FORWARD (POST /_clock/set_current_utc rejects equal or
#     earlier instants with ERR_CLOCK_MUST_ADVANCE)
#   * opaque-role X-User-IDs are fixed literals: admin-1, fsc-1, officer-1,
#     officer-2, cm-1, committee-alice, committee-bruno
#   * entity-backed roles use the row id as X-User-ID: an Applicant acts with
#     as_user_id == ApplicantHousehold.id, a Volunteer with VolunteerProfile.id
#   * segregation of duties: hours are never verified by the user that claimed
#     them (fsc-1 claims, cm-1 verifies); underwriting is structured by
#     officer-1 and approved by officer-2; committee identities never act as
#     ProgramAdmin or MortgageOfficer
#   * every `expected_*_version` is re-read from the parent with a GET
#     immediately before the OCC-guarded call, except where a deliberately
#     stale capture is the point of the instance
#   * canonical program: ami_median_income_cents 6000000, subsidy_pool_cents
#     5000000, sweat_equity_base_hours_required 12, committee_quorum 2 — the
#     12-hour requirement lets one 12.00-hour CONSTRUCTION entry satisfy sweat
#     equity in a single credit call
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — From Table 1 (Entities)
  # Creation / Retrieval / Listing / Not Found / Required Fields / Defaults /
  # Computed Fields / System Fields / Type Constraints / Immutability /
  # Parent Relationships, plus the `flat` entity-topology row (FK validated,
  # cross-reference integrity).
  # ===========================================================================
  - section: entities
    instances:

      - name: household_intake_returns_object_envelope_with_initial_system_fields
        claim_type: creation
        grounds: ["endpoints.POST /homeownership/households", entities.ApplicantHousehold.fields.documentation_status, entities.ApplicantHousehold.fields.adult_occupant_count, entities.ApplicantHousehold.fields.sweat_equity_satisfied]
        distinguishing_aspect: "Intake writes ten input fields but ALSO the whole system/computed prologue: DRAFT + NOT_READY + INCOMPLETE, adult_occupant_count 1 with zero member rows, and every scoring field still null because scoring only runs at screening."
        test_recipe:
          setup:
            - "Fresh service, logical clock 2026-08-01T00:00:00.000Z."
            - "One canonical AffiliateProgram exists, so the household create is not the first row the service ever writes."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
          assert:
            - "HTTP 201; response_type == object; meta.api_request_id is a non-empty string and meta.api_request_timestamp is present"
            - "$.data.id is server-assigned and appears nowhere in the request payload; $.data.program_id == ${prog_id}"
            - "$.data.selection_status == DRAFT, $.data.partnership_readiness == NOT_READY, $.data.documentation_status == INCOMPLETE"
            - "$.data.adult_occupant_count == 1 although zero HouseholdMember rows exist for ${hh_id}"
            - "$.data.verified_annual_income_cents == null, $.data.verified_housing_cost_cents == null, $.data.need_score == null, $.data.ability_to_pay_score == null, $.data.willingness_score == null, $.data.composite_selection_score == null, $.data.score_basis == null, $.data.sweat_equity_required_hours == null"
            - "$.data.sweat_equity_credited_hours == 0, $.data.family_member_credited_hours == 0, $.data.sweat_equity_satisfied == false, $.data.closing_date == null, $.data.denial_reason_code == null"

      - name: optional_inputs_fall_back_to_declared_field_defaults
        claim_type: defaults
        grounds: [entities.AffiliateProgram.fields.sweat_equity_base_hours_required, entities.AffiliateProgram.fields.committee_quorum, entities.HouseholdMember.fields.is_adult_occupant, entities.ConstructionShift.fields.required_trade_slots, entities.GrantAward.fields.restricted_to_in_kind_reporting]
        distinguishing_aspect: "Four different entities each omit their optional inputs in one run; the declared defaults 300 / 3 / false / 0 / false must be materialised rather than left null."
        test_recipe:
          setup:
            - "Canonical program, one DRAFT household under it, and one READY_TO_BUILD build site so a shift can be created without touching site readiness rules."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Northgate Habitat", service_area_code: "HAYS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog2_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Mateo Alvarez", relationship: "DEPENDENT", birth_date: "2014-05-02T00:00:00.000Z" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { dep_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 4 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id } }
            - { call: "POST /homeownership/grant-awards", payload: { program_id: "${prog_id}", award_code: "G-2026-01", donor_name: "Cedar Foundation", amount_cents: 2500000, period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-31T00:00:00.000Z", households_served_target: 3 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { grant_id: $.data.id } }
          assert:
            - "Program ${prog2_id}: $.data.sweat_equity_base_hours_required == 300 and $.data.committee_quorum == 3 (declared defaults, not null)"
            - "Program ${prog2_id}: $.data.subsidy_available_cents == 5000000, $.data.subsidy_committed_cents == 0, $.data.subsidy_disbursed_cents == 0, $.data.program_posture == OPEN, $.data.status == ACTIVE, $.data.donated_material_fmv_cents == 0, $.data.households_served_count == 0"
            - "Member ${dep_id}: $.data.is_adult_occupant == false, $.data.status == ACTIVE, $.data.credited_hours_to_date == 0"
            - "Shift ${shift_id}: $.data.required_trade_slots == 0, $.data.required_trade == null, $.data.status == SCHEDULED, $.data.duration_hours == 4.0, $.data.confirmed_general_count == 0, $.data.confirmed_trade_count == 0, $.data.fill_ratio == 0, $.data.safety_briefing_completed == false"
            - "Grant ${grant_id}: $.data.restricted_to_in_kind_reporting == false and $.data.status == OPEN"

      - name: household_create_system_and_computed_client_input_ignored
        claim_type: system_fields
        grounds: [entities.ApplicantHousehold.fields.selection_status, entities.ApplicantHousehold.fields.documentation_status, entities.ApplicantHousehold.fields.need_score, entities.ApplicantHousehold.fields.adult_occupant_count, "validations[priority=8]"]
        distinguishing_aspect: "Client-supplied values for system/computed columns (selection_status, documentation_status, need_score, adult_occupant_count, version) are not accepted as data: the row lands with the server-owned values, so a caller cannot self-promote a household to SELECTED at intake."
        test_recipe:
          setup:
            - "Canonical program only."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Okafor", household_size: 3, current_bedroom_count: 1, habitability_deficiency_count: 2, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 700, on_time_housing_payment_months: 36, selection_status: "SELECTED", documentation_status: "VERIFIED", need_score: 100, adult_occupant_count: 9, version: 77 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
          assert:
            - "Either HTTP 422 with $.data.error_id == ERR_VALIDATION (unknown body fields refused), or HTTP 201 with the server values below — the one outcome that must NOT occur is 201 carrying the client-supplied values"
            - "On the 201 branch: $.data.selection_status == DRAFT (not SELECTED), $.data.documentation_status == INCOMPLETE (not VERIFIED), $.data.need_score == null (not 100), $.data.adult_occupant_count == 1 (not 9)"
            - "On the 201 branch: $.data.version is server-assigned and not 77; $.data.created_at == 2026-08-01T00:00:00.000Z (logical clock, not a client value)"
            - "GET /homeownership/households/${hh_id} re-reads exactly the server-owned values, proving nothing was persisted from the injected fields"

      - name: hour_requirement_and_adult_count_computed_from_member_roster
        claim_type: computed_fields
        grounds: [entities.ApplicantHousehold.fields.adult_occupant_count, entities.ApplicantHousehold.fields.sweat_equity_required_hours, "state_machines.ApplicantHousehold.selection_status.SCREENING_to_COMMITTEE_REVIEW", "endpoints.POST /homeownership/household-members"]
        distinguishing_aspect: "sweat_equity_required_hours is min(500, base + 50*(adults-1)) and is FROZEN at the SCREENING to COMMITTEE_REVIEW hop: with base 12 and three adult occupants the value is 112, and a fourth adult added after referral must not move it."
        test_recipe:
          setup:
            - "Canonical program (base 12, quorum 2); one household with three ACTIVE adult occupants and one dependent; documentation verified at screening so the referral is accepted."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_app_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Luis Alvarez", relationship: "CO_APPLICANT", birth_date: "1983-11-02T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_co_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Ana Alvarez", relationship: "EXTENDED_FAMILY", birth_date: "1962-07-21T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_ext_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Mateo Alvarez", relationship: "DEPENDENT", birth_date: "2014-05-02T00:00:00.000Z", is_adult_occupant: false }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_dep_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          trigger:
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Three adult occupants, file verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Pia Alvarez", relationship: "EXTENDED_FAMILY", birth_date: "1958-02-09T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          assert:
            - "Referral response: $.data.selection_status == COMMITTEE_REVIEW, $.data.adult_occupant_count == 3, $.data.sweat_equity_required_hours == 112.0 (min(500, 12 + 50*2))"
            - "Referral response: $.data.sweat_equity_satisfied == false because 0 credited hours < 112.0"
            - "After the fourth adult is added, the GET shows $.data.adult_occupant_count == 4 but $.data.sweat_equity_required_hours is still 112.0 — the requirement was frozen at referral"
            - "The dependent ${mem_dep_id} never counted: adult_occupant_count moved 1 -> 3 across the three is_adult_occupant true rows only"

      - name: household_list_pagination_window_and_status_filter
        claim_type: listing
        grounds: ["endpoints.GET /homeownership/households", "validations[priority=8]", entities.ApplicantHousehold.fields.selection_status]
        distinguishing_aspect: "Three sibling households under one program: limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true; limit 2 / offset 2 returns the remaining row with has_more false; the two pages together cover all three ids exactly once, and a selection_status filter narrows total_count itself."
        test_recipe:
          setup:
            - "Canonical program with exactly three households: two still DRAFT and one moved to SUBMITTED."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh1_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Bakari", household_size: 2, current_bedroom_count: 2, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 60000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh2_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Costa", household_size: 3, current_bedroom_count: 1, habitability_deficiency_count: 2, self_reported_annual_income_cents: 3300000, self_reported_housing_cost_cents: 120000, monthly_debt_payment_cents: 20000, credit_score: 660, on_time_housing_payment_months: 30 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh3_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh3_id}", full_name: "Nina Costa", relationship: "APPLICANT", birth_date: "1990-01-04T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh3_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          trigger:
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", limit: 2, offset: 0 }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", limit: 2, offset: 2 }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", selection_status: "DRAFT" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "First page: HTTP 200, response_type == array, exactly 2 elements, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "Second page: exactly 1 element, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "The union of ids across the two pages is exactly {${hh1_id}, ${hh2_id}, ${hh3_id}} with no id repeated"
            - "Filtered page: total_count == 2, has_more == false, and every element has selection_status == DRAFT; ${hh3_id} (SUBMITTED) is absent"

      - name: pagination_limit_above_maximum_and_negative_offset_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", errors.ERR_VALIDATION, "endpoints.GET /homeownership/households"]
        distinguishing_aspect: "§1.0 pins limit to [1,100] and offset >= 0; limit 101 and offset -1 are refused with ERR_VALIDATION rather than silently clamped to 100 / 0."
        test_recipe:
          setup:
            - "Canonical program with one household so the unfiltered list is non-empty."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
          trigger:
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", limit: 101 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { err1: $.data.error_id } }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", limit: 0 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { err2: $.data.error_id } }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", offset: -1 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { err3: $.data.error_id } }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "limit 101: HTTP 422, response_type == error, ${err1} == ERR_VALIDATION"
            - "limit 0: HTTP 422, ${err2} == ERR_VALIDATION (min is 1)"
            - "offset -1: HTTP 422, ${err3} == ERR_VALIDATION"
            - "The unparameterised call succeeds with HTTP 200, limit == 10 and offset == 0 (declared pagination defaults), total_count == 1"

      - name: enum_and_numeric_domain_violations_are_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", errors.ERR_VALIDATION, entities.ApplicantHousehold.fields.household_size, entities.HouseholdMember.fields.relationship, entities.SweatEquityEntry.fields.hours_claimed, entities.ConstructionShift.fields.end_at]
        distinguishing_aspect: "Field-level schema checks fire before any business rule: household_size 13 breaks <= 12, relationship COUSIN is not in the enum, credit_score 290 breaks >= 300, and end_at <= start_at breaks the ConstructionShift interval constraint."
        test_recipe:
          setup:
            - "Canonical program plus one READY_TO_BUILD site, so the shift call fails on geometry rather than on site readiness."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
