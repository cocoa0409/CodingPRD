        claim_type: violation_to_error
        grounds:
          - concurrency_rules[formula-revision-stale-parent]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Formula.version: after a first revision succeeds (bumping the parent's version), a second revision carrying the originally observed version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Customer; ACTIVE formula whose current version has been observed by the client"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
