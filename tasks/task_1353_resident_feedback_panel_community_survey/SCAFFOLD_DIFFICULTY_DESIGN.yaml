            - "Cell target 10; P1 ACTIVE locale en; locked instrument"
            - "W0 2026-08-02..08-10: P1 responds (100%, 300s, amount 2000), ACCEPTED, award AUTHORIZED (available 98000, reserved 2000); closed 08-11"
