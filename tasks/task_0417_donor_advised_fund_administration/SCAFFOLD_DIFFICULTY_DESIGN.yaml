              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-14"
              captures: { ver1: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, recurrence: "RECURRING", effective_from_quarter: 3, effective_to_quarter: 5, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-14"
              captures: { grant_a_id: $.data.id }
            - call: "POST /daf/grants/${grant_a_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-8"
            - call: "POST /daf/grants/${grant_a_id}/schedule"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-8"
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
