              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
            - call: "POST /retailer-invoices"
              payload: { wholesaler_id: "${wh_a}", retailer_license_number: "R-777", invoice_date: "2026-10-05T00:00:00Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { inv_a: $.data.id }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv_a}", item_id: "${item_a}", cases_quantity: 1, bottles_quantity: 0, case_price_charged_cents: 115000, unit_price_charged_cents: 11000, promotional_allowance_cents: 0, depletion_allowance_cents: 0 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { line_a: $.data.id }
            - call: "POST /retailer-invoices/${inv_a}/validate"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "GET /wholesalers/${wh_a}"
              as: ComplianceOfficer
              captures: { wh_v: $.data.version }
            - call: "POST /compliance-audits"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", audit_period_month: "2026-10", expected_wholesaler_version: "${wh_v}" }
              as: ComplianceOfficer
              captures: { audit_a: $.data.id }
            - call: "POST /compliance-audits/${audit_a}/collect"
              as: ComplianceOfficer
          trigger:
            - call: "POST /retailer-invoices/${inv_a}/validate"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { under_audit_error: $.data.error_id }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv_a}", item_id: "${item_a}", cases_quantity: 1, bottles_quantity: 0, case_price_charged_cents: 120000, unit_price_charged_cents: 11000, promotional_allowance_cents: 0, depletion_allowance_cents: 0 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { append_error: $.data.error_id }
            - call: "POST /compliance-audits/${audit_a}/assess"
              as: ComplianceOfficer
              captures: { assessed_penalty: $.data.penalty_assessed_cents }
            - call: "POST /retailer-invoices/${inv_a}/validate"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { assessed_error: $.data.error_id }
            - call: "POST /compliance-audits/${audit_a}/void"
              payload: { void_reason: "Audit opened against the wrong period; reissued under a corrected notice." }
              as: ComplianceOfficer
            - call: "POST /retailer-invoices/${inv_a}/validate"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { reopened_status: $.data.validation_status }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv_a}", item_id: "${item_a}", cases_quantity: 1, bottles_quantity: 0, case_price_charged_cents: 120000, unit_price_charged_cents: 11000, promotional_allowance_cents: 0, depletion_allowance_cents: 0 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { appended_line: $.data.id }
          assert:
            - "while the audit is COLLECTED the revalidation returns HTTP 409 with error_id == ERR_INVALID_STATE, and RetailerInvoice.${inv_a}.audit_status == UNDER_AUDIT with audit_id == ${audit_a}"
            - "while the audit is COLLECTED the line append returns HTTP 409 with error_id == ERR_INVALID_STATE and RetailerInvoice.${inv_a}.line_count is still 1"
            - "the assess call returns HTTP 200 with penalty_assessed_cents == 2000, and RetailerInvoice.${inv_a}.audit_status == ASSESSED"
            - "while the audit is ASSESSED the revalidation returns HTTP 409 with error_id == ERR_INVALID_STATE, so the gate is closed for two different audit states"
            - "across all three refusals RetailerInvoice.${inv_a}.validation_status == FLAGGED, off_posted_line_count == 1 and total_variance_cents == 5000 — the refused calls wrote nothing"
            - "the void returns HTTP 200 with ComplianceAudit.${audit_a}.status == VOID, and RetailerInvoice.${inv_a}.audit_status == NOT_AUDITED with audit_id == null"
            - "the revalidation after the void returns HTTP 200 with validation_status == FLAGGED, off_posted_line_count == 1 and total_variance_cents == 5000, because the price data never changed"
            - "the line append after the void returns HTTP 201 and RetailerInvoice.${inv_a}.line_count == 2"
            - "Wholesaler.${wh_a}.assessed_penalty_cents == 0 and Wholesaler.${wh_a}.off_posted_violation_count == 0 after the void"

      - name: error_correction_filing_is_gated_by_the_price_schedule_item_status_across_draft_posted_effective
        grounds:
          - validations[priority=8]
          - entities.PriceScheduleItem.fields.status
          - state_machines.PriceSchedule.SUBMITTED_to_POSTED
          - state_machines.PriceSchedule.POSTED_to_EFFECTIVE
          - calculations.correction_window_containment
          - calculations.correction_variance_pct
        distinguishing_aspect: |
          The dependent pair here is ErrorCorrection on PriceScheduleItem — a different pair from the RetailerInvoice
          on ComplianceAudit gate above — and the gate is a three-valued read rather than a two-valued one: filing is
          refused with ERR_INVALID_STATE while the item is DRAFT under a SUBMITTED schedule, admitted once
          certification makes the item POSTED, and admitted again once a posting run makes it EFFECTIVE, all with the
          same body and the same open correction window.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX with correction_window_days set to 120 so the window stays open past the effective date; every other threshold at its declared default."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand Rio Reserve."
            - "One schedule for posting month 2026-09 (effective_date 2026-10-01T00:00:00.000Z) carrying item A at case 120000 / unit 11000."
            - "The schedule is submitted on time at 2026-08-01T00:00:00Z but NOT yet certified, so item A is still DRAFT while the schedule is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program", correction_window_days: 120 }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
          trigger:
            - call: "POST /error-corrections"
              payload: { item_id: "${item_a}", corrected_case_price_cents: 114000, corrected_unit_price_cents: 10500, reason: "Case price keyed from the wrong supplier quote sheet." }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { draft_error: $.data.error_id }
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /error-corrections"
              payload: { item_id: "${item_a}", corrected_case_price_cents: 114000, corrected_unit_price_cents: 10500, reason: "Case price keyed from the wrong supplier quote sheet." }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { corr_posted: $.data.id, posted_variance: $.data.variance_pct }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
            - call: "POST /error-corrections"
              payload: { item_id: "${item_a}", corrected_case_price_cents: 116000, corrected_unit_price_cents: 10700, reason: "Second keying error found after the prices took effect." }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { corr_effective: $.data.id, effective_status: $.data.status }
          assert:
            - "the first filing, while PriceScheduleItem.${item_a}.status == DRAFT and PriceSchedule.${sched_a}.status == SUBMITTED, returns HTTP 409 with error_id == ERR_INVALID_STATE"
            - "after that refusal GET /error-corrections?item_id=${item_a} returns total_count == 0, so no correction record was left behind"
            - "the certify call returns HTTP 200 and PriceScheduleItem.${item_a}.status == POSTED with certified_case_price_cents == 120000"
            - "the second filing, byte-for-byte identical to the first, returns HTTP 201 with ErrorCorrection.${corr_posted}.status == SUBMITTED, prior_case_price_cents == 120000 and variance_pct == 0.05"
            - "the posting run returns HTTP 200 and PriceScheduleItem.${item_a}.status == EFFECTIVE"
            - "the third filing, against the same item now EFFECTIVE, returns HTTP 201 with ErrorCorrection.${corr_effective}.status == SUBMITTED and prior_case_price_cents == 120000"
            - "GET /error-corrections?item_id=${item_a} returns total_count == 2 after both admitted filings"
            - "PriceScheduleItem.${item_a}.case_price_cents == 120000 and PriceScheduleItem.${item_a}.correction_count == 0, because filing alone applies no price"
            - "the correction window is open throughout: certified_at is 2026-08-01T00:00:00.000Z and correction_window_days 120 puts its exclusive end at 2026-11-29T00:00:00.000Z, well after the 2026-10-01T00:00:00Z filing"

  - rule_id: resource_temporal_overlap
    instances:
      - name: brand_registration_closed_intervals_collide_on_a_single_shared_endpoint_instant
        grounds:
          - validations[priority=13]
          - entities.Brand.fields.registration_effective_from
          - entities.Brand.fields.registration_expires_on
          - entities.Brand.fields.registration_status
        distinguishing_aspect: |
          The resource occupied here is a Brand registration slot and the interval semantics are CLOSED on both ends:
          a new registration whose registration_effective_from is exactly the existing registration's
          registration_expires_on shares one instant and is refused with ERR_BRAND_REGISTRATION_OVERLAP, while the
          very next millisecond is admitted. Half-open comparison would have admitted the first request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults."
            - "Wholesaler A with a filing agent."
            - "Brand Rio Reserve (SPIRITS) is registered and APPROVED for the closed interval 2026-01-01T00:00:00Z through 2026-06-30T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2026-06-30T23:59:59.999Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_first: $.data.id }
            - call: "POST /brands/${brand_first}/approve"
              as: ComplianceOfficer
          trigger:
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-06-30T23:59:59.999Z", registration_expires_on: "2026-12-31T23:59:59.999Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { touching_error: $.data.error_id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-07-01T00:00:00.000Z", registration_expires_on: "2026-12-31T23:59:59.999Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_next: $.data.id, next_status: $.data.registration_status }
          assert:
            - "the first request, starting exactly at the incumbent's registration_expires_on, returns HTTP 409 with error_id == ERR_BRAND_REGISTRATION_OVERLAP, because both intervals contain the instant 2026-06-30T23:59:59.999Z"
            - "the second request, starting one millisecond later at 2026-07-01T00:00:00.000Z, returns HTTP 201 with registration_status == PENDING"
            - "Brand.${brand_next}.registration_effective_from == 2026-07-01T00:00:00.000Z and Brand.${brand_next}.registration_expires_on == 2026-12-31T23:59:59.999Z"
            - "Brand.${brand_first}.registration_expires_on == 2026-06-30T23:59:59.999Z and Brand.${brand_first}.registration_status == APPROVED, untouched by either request"
            - "GET /brands?wholesaler_id=${wh_a} returns total_count == 2, so exactly one of the two requests created a record"

      - name: combination_window_cooldown_conflicts_backward_through_the_buffered_requested_end
        grounds:
          - calculations.combination_window_cooldown
          - validations[priority=13]
          - entities.CombinationSale.fields.promo_starts_at
          - entities.CombinationSale.fields.promo_ends_at
          - entities.StateProgram.fields.combo_cooldown_days
        distinguishing_aspect: |
          The resource occupied here is a CombinationSale promotional window, and the interval semantics are the
          opposite of the Brand slot above: windows are HALF-OPEN and are expanded by combo_cooldown_days on BOTH
          sides before a strict comparison. Both requested windows sit entirely BEFORE the incumbent, so the first
          conflict clause is trivially true and the verdict rests on the second one — a requested end of
          2026-10-25T00:00:00.001Z conflicts because its buffered end passes the incumbent's start by one
          millisecond, while 2026-10-25T00:00:00.000Z buffers to exactly that start and is admitted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (combo_cooldown_days 7, combination_sale_allowed true)."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand Rio Reserve."
            - "A DRAFT schedule for posting month 2026-09 carries item A (750 ml / 12 per case) at case 120000 and item C (375 ml / 24 per case) at case 30000, so a combination over both has floor_price_cents 150000 and min_allowed_price_cents 135000."
            - "One ACTIVE combination sale already occupies the half-open window [2026-11-01T00:00:00Z, 2026-11-10T00:00:00Z) at 135000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 375, bottles_per_case: 24, case_price_cents: 30000, unit_price_cents: 1500 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_c: $.data.id }
            - call: "POST /combination-sales"
              payload: { schedule_id: "${sched_a}", member_item_ids: ["${item_a}", "${item_c}"], promo_starts_at: "2026-11-01T00:00:00Z", promo_ends_at: "2026-11-10T00:00:00Z", combined_case_price_cents: 135000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { combo_incumbent: $.data.id }
          trigger:
            - call: "POST /combination-sales"
              payload: { schedule_id: "${sched_a}", member_item_ids: ["${item_a}", "${item_c}"], promo_starts_at: "2026-10-01T00:00:00Z", promo_ends_at: "2026-10-25T00:00:00.001Z", combined_case_price_cents: 135000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { backward_error: $.data.error_id }
            - call: "POST /combination-sales"
              payload: { schedule_id: "${sched_a}", member_item_ids: ["${item_a}", "${item_c}"], promo_starts_at: "2026-10-01T00:00:00Z", promo_ends_at: "2026-10-25T00:00:00.000Z", combined_case_price_cents: 135000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { combo_earlier: $.data.id, earlier_status: $.data.status }
          assert:
            - "the first request returns HTTP 409 with error_id == ERR_COMBINATION_COOLDOWN_VIOLATION, because 2026-10-25T00:00:00.001Z plus 7 * 86400 seconds is 2026-11-01T00:00:00.001Z, which is strictly after the incumbent's 2026-11-01T00:00:00.000Z start"
            - "the second request returns HTTP 201 with status == ACTIVE, because 2026-10-25T00:00:00.000Z plus 7 * 86400 seconds equals the incumbent's start exactly and the comparison is strict"
            - "CombinationSale.${combo_earlier}.floor_price_cents == 150000 and CombinationSale.${combo_earlier}.min_allowed_price_cents == 135000"
            - "CombinationSale.${combo_earlier}.promo_ends_at == 2026-10-25T00:00:00.000Z"
            - "CombinationSale.${combo_incumbent}.status == ACTIVE with promo_starts_at 2026-11-01T00:00:00.000Z, untouched by either request"
            - "GET /combination-sales?schedule_id=${sched_a}&status=ACTIVE returns total_count == 2, so only the admitted request created a window"

  - rule_id: compensating_invariant
    instances:
      - name: withdraw_conserves_the_wholesaler_late_filing_penalty_ledger_to_the_cent
        grounds:
          - state_machines.PriceSchedule.DRAFT_to_SUBMITTED
          - state_machines.PriceSchedule.SUBMITTED_to_WITHDRAWN
          - calculations.late_filing_determination
          - calculations.wholesaler_penalty_exposure
          - entities.Wholesaler.fields.late_filing_count
          - entities.Wholesaler.fields.late_filing_penalty_accrued_cents
        distinguishing_aspect: |
          The conserved quantity here is the wholesaler's MONEY ledger together with its late_filing_count, pinned as
          penalty_exposure_cents == late_filing_penalty_accrued_cents + correction_penalty_accrued_cents +
          amendment_penalty_accrued_cents + assessed_penalty_cents. A late submission drives the identity from
          0 == 0+0+0+0 to 250000 == 250000+0+0+0, and the withdraw returns it to 0 == 0+0+0+0 with the count back at 0,
          while is_late and filed_at survive on the record and Wholesaler.version has advanced to 3 rather than rewound.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (posting_deadline_day 10, late_filing_penalty_cents 250000)."
            - "Wholesaler A, freshly created at version 1 with every penalty bucket at 0, plus a filing agent and an APPROVED brand Rio Reserve."
            - "A DRAFT schedule for posting month 2026-07 (deadline instant 2026-07-10T23:59:59.999Z, effective_date 2026-08-01T00:00:00.000Z) carries one item at case 120000 / unit 11000."
            - "The schedule is submitted at 2026-08-01T00:00:00Z, three weeks past the deadline, so is_late is true and the 250000-cent late filing penalty accrues."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-07" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_jul: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_jul}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_jul: $.data.id }
            - call: "POST /price-schedules/${sched_jul}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { submitted_is_late: $.data.is_late, submitted_filed_at: $.data.filed_at }
            - call: "GET /wholesalers/${wh_a}"
              as: ComplianceOfficer
              captures: { accrued_before: $.data.late_filing_penalty_accrued_cents, exposure_before: $.data.penalty_exposure_cents, version_before: $.data.version }
          trigger:
            - call: "POST /price-schedules/${sched_jul}/withdraw"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { withdrawn_status: $.data.status, withdrawn_is_late: $.data.is_late }
          assert:
            - "before the trigger the ledger read Wholesaler.${wh_a}.late_filing_count == 1, late_filing_penalty_accrued_cents == 250000 and penalty_exposure_cents == 250000, with version == 2"
            - "the trigger returns HTTP 200 with status == WITHDRAWN"
            - "Wholesaler.${wh_a}.late_filing_count == 0 and Wholesaler.${wh_a}.late_filing_penalty_accrued_cents == 0"
            - "Wholesaler.${wh_a}.correction_penalty_accrued_cents == 0, amendment_penalty_accrued_cents == 0 and assessed_penalty_cents == 0"
            - "Wholesaler.${wh_a}.penalty_exposure_cents == 0, so the pinned identity penalty_exposure_cents == late + correction + amendment + assessed holds at 0 == 0 + 0 + 0 + 0 exactly as it did before the submission"
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant assessed_exposure returns accrued_cents == 0, provisional_cents == 0 and exposure_cents == 0"
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant provisional_exposure returns exposure_cents == 0, because no OPEN or COLLECTED audit exists to project"
            - "Wholesaler.${wh_a}.version == 3, so the ledger is conserved while the audit trail is not rewound"
            - "PriceSchedule.${sched_jul}.is_late == true and PriceSchedule.${sched_jul}.filed_at == 2026-08-01T00:00:00.000Z, preserved as historical facts"
            - "PriceScheduleItem.${item_jul}.status == WITHDRAWN"

      - name: revoke_conserves_the_item_price_vector_and_every_derived_instrument_value
        grounds:
          - state_machines.HoldAmendment.PENDING_to_ACCEPTED
          - state_machines.HoldAmendment.ACCEPTED_to_REVOKED
          - calculations.tier_discounted_case_price
          - calculations.combination_sale_min_price
          - entities.PriceScheduleItem.fields.amendment_count
          - entities.CombinationSale.fields.min_allowed_price_cents
        distinguishing_aspect: |
          The conserved quantity here is not money but the item's POSTED PRICE VECTOR and the derived instrument values
          hanging off it, pinned as tier.discounted_case_price_cents == round_half_up(item.case_price_cents * 0.90),
          combo.floor_price_cents == sum of member case prices, and combo.status ACTIVE exactly while
          combined_case_price_cents >= min_allowed_price_cents. Accepting a 118000 amendment moves the triple to
          (106200, 148000, 140600) and VOIDs the combination; the revoke must restore (108000, 150000, 135000) and
          return the combination to ACTIVE, with amendment_count back to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (hold_window_days 3, combo_cooldown_days 7)."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand Rio Reserve; Wholesaler B with its own filing agent, certifying officer and APPROVED brand on the same posting key."
            - "Schedule A for posting month 2026-09 carries item A (750 ml / 12 per case) at case 120000 / unit 11000 and item C (375 ml / 24 per case) at case 30000 / unit 1500; submitted on time and certified at 2026-08-01T00:00:00Z, so the post-and-hold window runs to 2026-08-04T00:00:00.000Z."
            - "Item A carries one ACTIVE quantity discount tier at min_cases 5 and discount_pct 0.10, so discounted_case_price_cents is 108000."
            - "An ACTIVE combination sale over items A and C is offered at exactly 135000 against floor_price_cents 150000 and min_allowed_price_cents 135000."
            - "Schedule B for posting month 2026-09 carries item B at case 110000 / unit 10000 on the same posting key as item A; submitted on time and certified."
            - "A hold amendment on item A referencing item B at case 118000 / unit 10800 has been ACCEPTED inside the hold window, so the tier reads 106200, the combination floor is 148000, its minimum allowed price is 140600 and its status is VOID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-2002", legal_name: "Gulf Coast Beverage", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_b: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_b}", full_name: "Ben Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_b: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_b}", full_name: "Bea Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_b: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_b}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_b}"
              captures: { brand_b: $.data.id }
            - call: "POST /brands/${brand_b}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 375, bottles_per_case: 24, case_price_cents: 30000, unit_price_cents: 1500 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_c: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /quantity-discount-tiers"
              payload: { item_id: "${item_a}", min_cases: 5, discount_pct: 0.10 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { tier_a: $.data.id }
            - call: "POST /combination-sales"
              payload: { schedule_id: "${sched_a}", member_item_ids: ["${item_a}", "${item_c}"], promo_starts_at: "2026-10-01T00:00:00Z", promo_ends_at: "2026-10-10T00:00:00Z", combined_case_price_cents: 135000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { combo_a: $.data.id }
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_b}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_b}"
              captures: { sched_b: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_b}", brand_id: "${brand_b}", size_ml: 750, bottles_per_case: 12, case_price_cents: 110000, unit_price_cents: 10000 }
              as: FilingAgent
              as_user_id: "${agent_b}"
              captures: { item_b: $.data.id }
            - call: "POST /price-schedules/${sched_b}/submit"
              as: FilingAgent
              as_user_id: "${agent_b}"
            - call: "POST /price-schedules/${sched_b}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_b}"
            - call: "GET /price-schedules/${sched_a}"
              as: ComplianceOfficer
              captures: { sched_a_v: $.data.version }
            - call: "POST /hold-amendments"
              payload: { amending_item_id: "${item_a}", reference_item_id: "${item_b}", new_case_price_cents: 118000, new_unit_price_cents: 10800, expected_schedule_version: "${sched_a_v}" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { amend_a: $.data.id }
            - call: "POST /hold-amendments/${amend_a}/accept"
              as: ComplianceOfficer
              captures: { accepted_prior_case: $.data.prior_case_price_cents }
          trigger:
            - call: "POST /hold-amendments/${amend_a}/revoke"
              payload: { revocation_reason: "The matched competitor posting was itself withdrawn." }
              as: ComplianceOfficer
              captures: { revoked_status: $.data.status }
          assert:
            - "before the trigger the accepted state read PriceScheduleItem.${item_a}.case_price_cents == 118000, QuantityDiscountTier.${tier_a}.discounted_case_price_cents == 106200, CombinationSale.${combo_a}.floor_price_cents == 148000, min_allowed_price_cents == 140600 and status == VOID"
            - "the trigger returns HTTP 200 with status == REVOKED and revocation_reason == the supplied text"
            - "PriceScheduleItem.${item_a}.case_price_cents == 120000 and PriceScheduleItem.${item_a}.unit_price_cents == 11000"
            - "PriceScheduleItem.${item_a}.amendment_count == 0"
            - "QuantityDiscountTier.${tier_a}.discounted_case_price_cents == 108000 and QuantityDiscountTier.${tier_a}.status == ACTIVE, so the pinned identity round_half_up(120000 * 0.90) holds again"
            - "CombinationSale.${combo_a}.floor_price_cents == 150000 and CombinationSale.${combo_a}.min_allowed_price_cents == 135000, back on the 0.10 band"
            - "CombinationSale.${combo_a}.status == ACTIVE, because combined_case_price_cents 135000 is once more >= min_allowed_price_cents 135000"
            - "CombinationSale.${combo_a}.combined_case_price_cents == 135000, never rewritten by either transition"
            - "HoldAmendment.${amend_a}.status == REVOKED with prior_case_price_cents == 120000 and prior_unit_price_cents == 11000 retained as the restoration record"
            - "PriceScheduleItem.${item_c}.case_price_cents == 30000, the untouched member of the combination"
            - "PriceScheduleItem.${item_a}.certified_case_price_cents == 120000 throughout, so the conserved vector and the certification snapshot agree again"
