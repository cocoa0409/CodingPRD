            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: "$.data.version" } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: "$.data.id" } }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
          trigger:
            - { call: "POST /uro/relocation-plans/${pl1}/request-revision", payload: { revision_note: "Betterment split is not documented." }, as: UtilityCoordinator, captures: { pl_after_request: "$.data.status" } }
            - { call: "POST /uro/relocation-plans/${pl1}/resubmit", payload: { estimated_cost_cents: 39000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.20, work_days: 11 }, as: UtilityCoordinator, captures: { pl_after_resubmit: "$.data.status", pl_round: "$.data.revision_round" } }
            - { call: "POST /uro/prior-rights/${d1}/return-for-revision", payload: { revision_note: "Search the county archive before issuing." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d_returned: "$.data.status" } }
            - { call: "POST /uro/prior-rights/${d1}/revise", payload: { claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded easement located." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d_revised: "$.data.status" } }
          assert:
            - "all four calls return 200"
            - "${pl_after_request} == REVISION_REQUESTED and ${pl_after_resubmit} == SUBMITTED with ${pl_round} == 1, even though the resubmit was sent by the UtilityCoordinator rather than the owner"
            - "${d_returned} == RETURNED_FOR_REVISION and ${d_revised} == DRAFT"
            - "the resubmitted plan carries the new estimate 39000000 and capacity ratio 1.20, so resubmit replaces the cost terms instead of only moving the state"

