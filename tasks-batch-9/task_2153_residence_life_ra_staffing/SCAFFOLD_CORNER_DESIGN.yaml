          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /residence-life/buildings lists only ResidenceDirector, so a Student calling it returns HTTP 403 ERR_FORBIDDEN_ROLE and no hall is created."
