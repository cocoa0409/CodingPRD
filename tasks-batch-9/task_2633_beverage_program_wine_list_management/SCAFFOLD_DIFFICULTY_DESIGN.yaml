  - rule_id: transitive_cascade
    instances:
      - name: write_off_approval_cascades_lot_bin_entry_and_list_version
        grounds:
          - state_machines.SpoilageWriteOff.SUBMITTED_to_APPROVED
          - state_machines.InventoryLot.ON_HAND_to_DEPLETED
          - entities.CellarBin.fields.bottles_stored
          - entities.ListEntry.fields.availability_state
          - entities.ListVersion.fields.out_of_stock_entry_count
          - entities.Venue.fields.cogs_ledger_cents
          - calculations.lot_depletion_cogs
        distinguishing_aspect: |
          One POST to /spoilage-write-offs/{id}/approve propagates five levels deep along the inventory
          spine — SpoilageWriteOff.state -> InventoryLot.bottles_on_hand -> InventoryLot.state DEPLETED
          -> ListEntry.availability_state OUT_OF_STOCK -> ListVersion.out_of_stock_entry_count 1 — while
          also releasing CellarBin.bottles_stored to 0 and posting 28800 cents to Venue.cogs_ledger_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB, program_posture OPEN, cogs_ledger_cents 0."
