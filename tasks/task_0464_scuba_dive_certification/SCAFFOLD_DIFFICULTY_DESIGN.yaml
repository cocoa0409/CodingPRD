          - calculations.rental_charge
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (rental check-in): rental ->
          RETURNED (hop1) recomputes the owning Diver.deposit_on_hold_cents
          (hop2), dropping it from 20000 to 0. Originates from a different
          transition than the session-cancel cascade.
        test_recipe:
          setup:
            - "Clock 2026-06-10T09:00:00Z. One diver with a single ACTIVE rental (deposit 20000) -> deposit_on_hold_cents == 20000."
