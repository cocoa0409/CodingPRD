              as: SalesManager
              captures: { bk_bb_id: $.data.id, bk_bb_v1: $.data.version }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bc_id}", event_name: "Sunbelt Boat Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-09", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_bc_id: $.data.id, bk_bc_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_bb_id}/holds"
