# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.md.
# Sections = the guide's nine sections. Instances §1.8 already covers are
# emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ============================================================ 1. ENTITIES
  - section: entities
    instances:
      - name: community_policy_defaults_applied
        claim_type: defaults
        grounds: [entities.Community.fields.holdback_cost_multiplier, entities.Community.fields.survey_window_days]
        distinguishing_aspect: "POST /api/communities with only `name` applies every documented default (multiplier 1.5, min 50000, max 1000000, window 5..30 days, duration 120, buffer 30, survey window 14, photo flag true)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id", mult: "$.data.holdback_cost_multiplier", mind: "$.data.orientation_min_days_before_closing", photo: "$.data.cosmetic_photo_required" } }
          trigger:
            - { call: "GET /api/communities/${c1}/quality-trend", payload: { period_month: "2026-08" }, as: CustomerCareManager, captures: { cnt: "$.data.submitted_survey_count" } }
          assert:
            - "create response carries holdback_cost_multiplier == 1.5 (observed ${mult}), orientation_min_days_before_closing == 5 (observed ${mind}), cosmetic_photo_required == true (observed ${photo})"
            - "trend read on the new community works and submitted_survey_count == 0 (server-stored defaults drive calculations)"

      - name: homebuyer_duplicate_email_rejected
        claim_type: type_constraints
        grounds: [entities.Homebuyer.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second homebuyer with an already-registered email fails with ERR_DUPLICATE_EMAIL (409); uniqueness is global across homebuyers."
        test_recipe:
          setup: ["one registered buyer"]
          setup_api_calls:
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Again", email: "alice@example.com" }, as: CustomerCareManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_EMAIL (http 409)"

      - name: home_create_missing_required_closing_date
        claim_type: required_fields
        grounds: [entities.Home.fields.closing_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required closing_date yields ERR_VALIDATION (400) before any other processing."
        test_recipe:
          setup: ["community and buyer exist"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000 }, as: CustomerCareManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: home_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Home]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored: server mints a UUID id and version starts at 1."
        test_recipe:
          setup: ["community and buyer exist"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z", id: "00000000-0000-4000-8000-aaaaaaaaaaaa", version: 99 }, as: CustomerCareManager, captures: { hid: "$.data.id", hver: "$.data.version" } }
          assert:
            - "response version == 1 (observed ${hver}); response id != client-supplied id (server-minted, observed ${hid})"

      - name: get_home_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent home id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/homes/00000000-0000-4000-8000-bbbbbbbbbbbb", payload: {}, as: CustomerCareManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: appointment_duration_defaults_from_community
        claim_type: defaults
        grounds: [entities.OrientationAppointment.fields.duration_minutes, entities.Community.fields.appointment_duration_minutes]
        distinguishing_aspect: "Omitting duration_minutes at appointment creation applies the community default of 120."
        test_recipe:
          setup: ["home h1 PRE_CLOSE_READY"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { dur: "$.data.duration_minutes" } }
          assert:
            - "duration_minutes == 120 (observed ${dur})"

      - name: fk_reverse_list_appointments_by_home
        claim_type: parent_relationships
        grounds: [entities.OrientationAppointment.fields.home_id, "endpoints: GET /api/appointments"]
        distinguishing_aspect: "GET /api/appointments?home_id=X returns exactly that home's appointments; another home's id returns an empty list."
        test_recipe:
          setup: ["homes h1/h2 PRE_CLOSE_READY; one appointment on h1"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-102", address: "2 Riverbend Way", sales_price_cents: 46000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h2: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/homes/${h2}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
          trigger:
            - { call: "GET /api/appointments?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { found: "$.data[0].id" } }
            - { call: "GET /api/appointments?home_id=${h2}", payload: {}, as: CustomerCareManager }
          assert:
            - "filtered by h1: exactly one appointment, id == ${a1} (observed ${found})"
            - "filtered by h2: empty list (total_count == 0)"

      - name: appointment_checklist_seed_counts_corner
        claim_type: computed_fields
        grounds: [entities.OrientationAppointment.fields.checklist_total_count]
        excluded_because:
          difficulty_instance: checklist_mark_reset_count_conservation
          rationale: "Seed-time counts (total 6 / pending 6 / demonstrated 0 / skipped 0) are asserted as the t0 baseline of the named §1.8 instance."

  # ============================================================ 2. STATE MACHINES
  - section: state_machines
    instances:
      - name: home_initial_state_under_construction
        claim_type: initial_state
        grounds: [state_machines.Home]
        distinguishing_aspect: "A newly created home starts UNDER_CONSTRUCTION, and appointment creation in that state is rejected (ERR_INVALID_STATE)."
        test_recipe:
          setup: ["community, buyer, rep, home (not marked ready)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id", st: "$.data.status" } }
          trigger:
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
          assert:
            - "create response status == UNDER_CONSTRUCTION (observed ${st})"
            - "appointment create -> error_id == ERR_INVALID_STATE (http 409)"

      - name: home_double_mark_ready_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Home.UNDER_CONSTRUCTION_to_PRE_CLOSE_READY, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-ready is only valid from UNDER_CONSTRUCTION; a second call observes PRE_CLOSE_READY and fails."
        test_recipe:
          setup: ["home h1 already PRE_CLOSE_READY"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"

      - name: appointment_start_after_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.OrientationAppointment]
        distinguishing_aspect: "CANCELLED is terminal: start on a cancelled appointment fails with ERR_INVALID_STATE and no checklist is seeded."
        test_recipe:
          setup: ["appointment a1 CONFIRMED then cancelled (reason omitted -> CANCELLED); home reverted to PRE_CLOSE_READY"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/cancel", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"

      - name: cancel_confirmed_as_no_show_branch
        claim_type: valid_transition
        grounds: [state_machines.OrientationAppointment.CONFIRMED_to_NO_SHOW, state_machines.Home.ORIENTATION_SCHEDULED_to_PRE_CLOSE_READY]
        distinguishing_aspect: "cancel with reason BUYER_NO_SHOW from CONFIRMED lands in the NO_SHOW branch (not CANCELLED) and reverts the home to PRE_CLOSE_READY."
        test_recipe:
          setup: ["appointment a1 CONFIRMED; home ORIENTATION_SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/appointments/${a1}/cancel", payload: { reason: "BUYER_NO_SHOW" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { st: "$.data.status", why: "$.data.cancel_reason" } }
            - { call: "GET /api/homes/${h1}", payload: {}, as: CustomerCareManager, captures: { hst: "$.data.status" } }
          assert:
            - "appointment status == NO_SHOW with cancel_reason == BUYER_NO_SHOW (observed ${st}/${why})"
            - "Home.${h1}.status == PRE_CLOSE_READY (observed ${hst})"

      - name: cancel_confirmed_reverts_home_state
        claim_type: side_effect_execution
        grounds: [state_machines.OrientationAppointment.CONFIRMED_to_CANCELLED, state_machines.Home.ORIENTATION_SCHEDULED_to_PRE_CLOSE_READY]
        distinguishing_aspect: "cancel with a non-no-show reason (BUYER_REQUEST) lands in CANCELLED and cascades the home back to PRE_CLOSE_READY — the sibling branch of the NO_SHOW fork."
        test_recipe:
          setup: ["appointment a1 CONFIRMED; home ORIENTATION_SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/appointments/${a1}/cancel", payload: { reason: "BUYER_REQUEST" }, as: CustomerCareManager, captures: { st: "$.data.status" } }
            - { call: "GET /api/homes/${h1}", payload: {}, as: CustomerCareManager, captures: { hst: "$.data.status" } }
          assert:
            - "appointment status == CANCELLED (observed ${st})"
            - "Home.${h1}.status == PRE_CLOSE_READY (observed ${hst})"

      - name: complete_blocked_by_pending_checklist
        claim_type: precondition_enforcement
        grounds: [state_machines.OrientationAppointment.IN_PROGRESS_to_COMPLETED, "errors[ERR_CHECKLIST_INCOMPLETE]"]
        distinguishing_aspect: "Complete with SAFETY still PENDING (attendee already verified) fails with ERR_CHECKLIST_INCOMPLETE; no survey/signature/escrow side effects fire."
        test_recipe:
          setup: ["orientation IN_PROGRESS; buyer attendee VERIFIED; 4 required items DEMONSTRATED + APPLIANCES SKIPPED; SAFETY left PENDING"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
            - { call: "GET /api/feedback-surveys?home_id=${h1}", payload: {}, as: CustomerCareManager }
          assert:
            - "error_id == ERR_CHECKLIST_INCOMPLETE (http 409)"
            - "no FeedbackSurvey exists for the home (total_count == 0) — no partial side effects"

      - name: decide_on_unclassified_item_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DeficiencyItem, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decide requires CLASSIFIED; on an IDENTIFIED item it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["orientation IN_PROGRESS; item d1 IDENTIFIED (not classified)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
