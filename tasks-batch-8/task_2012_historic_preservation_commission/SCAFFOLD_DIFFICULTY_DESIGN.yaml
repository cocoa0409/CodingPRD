# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2012: Historic Preservation Commission & Certificate of Appropriateness
# 9 rules x 2 instances. Every setup_api_calls chain replays against
# SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6. Logical clock default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_assessment
        grounds:
          - calculations.application_fee
          - entities.Application.fields.provisional_fee_cents
          - entities.Application.fields.assessed_fee_cents
        distinguishing_aspect: |
          Same application, two fee variants: the provisional variant prices
          applicant-declared work items with no surcharge (27600 cents), the
          final variant prices staff-verified items and adds the 20000-cent
          hearing surcharge once the track resolves COMMISSION (49300 cents) —
          the companion instance exercises the dual-variant rule on the
          Violation domain, not the Application domain.
        test_recipe:
          setup:
            - "LOCAL district with an ADOPTED guideline set; NON_CONTRIBUTING property (assessed 5000000)"
            - "ALTERATION application, not visible, declared items 500000 + 300000 cents"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/districts/${d_id}/guideline-sets"
              payload: { title: "DG-1", sections: [{ section_code: "S1", text: "Preserve wood siding" }] }
              as: PreservationStaff
              captures: { gs_id: $.data.id }
            - call: "POST /preservation/guideline-sets/${gs_id}/adopt"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/owners"
              payload: { full_name: "Ann Owner", email: "ann@x.com", mailing_address: "1 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "10 Elm", parcel_number: "P-100", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1955, assessed_value_cents: 5000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "EXTERIOR_ALTERATION", description: "repaint", estimated_cost_cents: 500000 }, { category: "SITE_WORK", description: "fence", estimated_cost_cents: 300000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id, prov_fee: $.data.provisional_fee_cents }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "EXTERIOR_ALTERATION", verified_cost_cents: 900000 }, { category: "SITE_WORK", verified_cost_cents: 350000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { assessed: $.data.assessed_fee_cents, track: $.data.review_track }
          assert:
            - "Application.${app_id}.provisional_fee_cents == 27600 (ALT 15000+round(0.004*500000)=17000; SITE 10000+round(0.002*300000)=10600)"
            - "Application.${app_id}.review_track == COMMISSION (verified 1250000 >= 1000000)"
            - "Application.${app_id}.assessed_fee_cents == 49300 (18600 + 10700 + 20000 surcharge)"
            - "Application.${app_id}.fee_balance_cents == 49300"
            - "provisional variant (27600) != final variant (49300) for the same application"

      - name: penalty_demand_projection_vs_final_accrual
        grounds:
          - calculations.civil_penalty
          - entities.Violation.fields.demand_letter_amount_cents
          - entities.Violation.fields.final_penalty_cents
        distinguishing_aspect: |
          Same violation, two stop-rule variants: the demand variant stops
          accrual at notice_issued_at + 30 days (300000 cents), the final
          variant runs to actual compliance at elapsed day 45 with marginal
          tiers (600000 cents) — the companion instance exercises the
          dual-variant rule on the Application fee domain, not Violation.
        test_recipe:
          setup:
            - "Property assessed at 10000000 cents (penalty cap = 1000000)"
            - "Violation noticed at 2026-08-01T00:00:00Z; compliance verified at 2026-09-15T00:00:00Z (elapsed 45 days)"
          setup_api_calls:
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/owners"
              payload: { full_name: "Bob Owner", email: "bob@x.com", mailing_address: "2 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "22 Oak", parcel_number: "P-200", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1960, assessed_value_cents: 10000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/violations"
              payload: { property_id: "${p_id}", observed_violation_date: "2026-07-15T00:00:00Z", work_description: "Unpermitted porch rebuild" }
              as: EnforcementOfficer
              captures: { v_id: $.data.id }
            - call: "POST /preservation/violations/${v_id}/issue-notice"
              payload: {}
              as: EnforcementOfficer
              captures: { demand: $.data.demand_letter_amount_cents }
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/violations/${v_id}/verify-compliance"
              payload: {}
              as: EnforcementOfficer
              captures: { final_pen: $.data.final_penalty_cents, v_status: $.data.status }
          assert:
            - "Violation.${v_id}.demand_letter_amount_cents == 300000 (30 days x 10000, cap 1000000 not reached)"
            - "Violation.${v_id}.final_penalty_cents == 600000 (30x10000 + 15x20000, marginal tiers, elapsed 45)"
            - "Violation.${v_id}.penalty_capped == false"
            - "Violation.${v_id}.status == COMPLIANCE_VERIFIED"
            - "Property.${p_id}.open_violation_count == 0 and compliance_posture == CLEAR"
            - "demand variant (300000) != final variant (600000) for the same violation"

  - rule_id: combinatorial_formula
    instances:
      - name: review_track_multi_branch_override
        grounds:
          - calculations.review_track_determination
        distinguishing_aspect: |
          Mode (a): the track formula combines five inputs (application_type,
          verified_cost_cents, contributing_status, visibility, district tier)
          through nested conditional branches — here verified_cost 500000 is
          BELOW the 1000000 threshold yet the contributing+visible+LANDMARK
          branch still forces COMMISSION; the companion instance is mode (b)
          rounding order, a different combinatorial mode.
        test_recipe:
          setup:
            - "LANDMARK district; CONTRIBUTING property; ALTERATION application visible from the public way"
            - "verified cost 500000 cents — under the threshold"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Landmark Heights", boundary_description: "Hill parcels", significance_tier: "LANDMARK" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Cara Owner", email: "cara@x.com", mailing_address: "3 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "5 Hill Rd", parcel_number: "P-300", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "CONTRIBUTING", construction_year: 1890, assessed_value_cents: 8000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "EXTERIOR_ALTERATION", description: "window replacement", estimated_cost_cents: 400000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "EXTERIOR_ALTERATION", verified_cost_cents: 500000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { track: $.data.review_track, assessed: $.data.assessed_fee_cents }
          assert:
            - "Application.${app_id}.verified_cost_cents == 500000 (< 1000000 threshold)"
            - "Application.${app_id}.review_track == COMMISSION (CONTRIBUTING + visible + LANDMARK branch)"
            - "Application.${app_id}.assessed_fee_cents == 37000 (15000 + 2000 + 20000 surcharge)"

      - name: fee_per_item_rounding_order
        grounds:
          - calculations.application_fee
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-item-then-sum, so two items at 33333 cents each yield
          30266 cents; the sum-then-round order would yield 30267. The
          companion instance is mode (a), a different combinatorial mode.
        test_recipe:
          setup:
            - "LOCAL district; NON_CONTRIBUTING property; two EXTERIOR_ALTERATION line items"
            - "declared 100000 cents each (provisional 30800); verified 33333 cents each"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Mill District", boundary_description: "Riverfront", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Dan Owner", email: "dan@x.com", mailing_address: "4 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "9 River Rd", parcel_number: "P-400", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1972, assessed_value_cents: 4000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "EXTERIOR_ALTERATION", description: "siding north", estimated_cost_cents: 100000 }, { category: "EXTERIOR_ALTERATION", description: "siding south", estimated_cost_cents: 100000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id, prov_fee: $.data.provisional_fee_cents }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "EXTERIOR_ALTERATION", verified_cost_cents: 33333 }, { category: "EXTERIOR_ALTERATION", verified_cost_cents: 33333 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { assessed: $.data.assessed_fee_cents }
          assert:
            - "Application.${app_id}.provisional_fee_cents == 30800 (2 x (15000 + 400))"
            - "Application.${app_id}.assessed_fee_cents == 30266 (per-item: 15000 + round_half_up(133.332) = 15133, twice, then sum; NOT 30267)"
            - "Application.${app_id}.review_track == STAFF (66666 < 1000000; surcharge not applied)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_resubmission_cycle
        grounds:
          - state_machines.Application.UNDER_STAFF_REVIEW_to_INCOMPLETE
          - state_machines.Application.INCOMPLETE_to_UNDER_STAFF_REVIEW
        distinguishing_aspect: |
          The Application machine is cyclic: UNDER_STAFF_REVIEW -> INCOMPLETE
          -> UNDER_STAFF_REVIEW loops twice in this recipe and
          resubmission_count accumulates to 2; the companion instance exercises
          the deferral cycle on the Hearing entity, a different entity.
        test_recipe:
          setup:
            - "LOCAL district; NON_CONTRIBUTING property; STAFF-track-bound ALTERATION application"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Eve Owner", email: "eve@x.com", mailing_address: "5 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "12 Pine", parcel_number: "P-500", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1948, assessed_value_cents: 3000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "walkway", estimated_cost_cents: 100000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/return-incomplete"
              payload: { deficiency_notes: "Missing elevation drawings" }
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/resubmit"
              payload: { work_items: [{ category: "SITE_WORK", description: "walkway rev1", estimated_cost_cents: 120000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { count1: $.data.resubmission_count }
            - call: "POST /preservation/applications/${app_id}/return-incomplete"
              payload: { deficiency_notes: "Material spec still missing" }
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications/${app_id}/resubmit"
              payload: { work_items: [{ category: "SITE_WORK", description: "walkway rev2", estimated_cost_cents: 150000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { count2: $.data.resubmission_count, st: $.data.status, prov: $.data.provisional_fee_cents }
          assert:
            - "resubmission_count after first resubmit == 1; after second == 2"
            - "Application.${app_id}.status == UNDER_STAFF_REVIEW after each resubmit (cycle traversed twice)"
            - "Application.${app_id}.provisional_fee_cents == 10300 after second resubmit (10000 + round(0.002*150000))"

      - name: hearing_continue_reschedule_cycle
        grounds:
          - state_machines.Hearing.OPENED_to_CONTINUED
          - state_machines.Hearing.CONTINUED_to_SCHEDULED
        distinguishing_aspect: |
          The Hearing machine is cyclic: SCHEDULED -> OPENED -> CONTINUED ->
          SCHEDULED, and the meeting slot is freed then re-occupied on a
          different meeting; the companion instance exercises the resubmission
          cycle on the Application entity, a different entity.
        test_recipe:
          setup:
            - "COMMISSION-track application ACCEPTED (verified 1250000 >= threshold)"
            - "Meeting M1 2026-09-01 capacity 2; Meeting M2 2026-10-01 capacity 1"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Fred Owner", email: "fred@x.com", mailing_address: "6 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "40 Cedar", parcel_number: "P-600", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1935, assessed_value_cents: 6000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ADDITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "ADDITION", description: "rear addition", estimated_cost_cents: 1200000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "ADDITION", verified_cost_cents: 1250000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { app_v: $.data.version }
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m1_id: $.data.id }
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-10-01T00:00:00Z", location: "City Hall", agenda_capacity: 1 }
              as: PreservationStaff
              captures: { m2_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m1_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
            - call: "POST /preservation/hearings/${h_id}/open"
              payload: {}
              as: Commissioner
            - call: "POST /preservation/hearings/${h_id}/continue"
              payload: {}
              as: Commissioner
              captures: { h_status: $.data.status }
            - call: "GET /preservation/meetings/${m1_id}"
              payload: {}
              as: PreservationStaff
              captures: { m1_count_after_continue: $.data.scheduled_hearing_count }
          trigger:
            - call: "POST /preservation/hearings/${h_id}/reschedule"
              payload: { meeting_id: "${m2_id}", notice_posted_at: "2026-09-01T00:00:00Z" }
              as: PreservationStaff
              captures: { h_status2: $.data.status, h_meeting: $.data.meeting_id }
          assert:
            - "Hearing went SCHEDULED -> OPENED -> CONTINUED -> SCHEDULED (cycle, not a linear pipeline)"
            - "CommissionMeeting.${m1_id}.scheduled_hearing_count == 0 after continue (slot freed)"
            - "CommissionMeeting.${m2_id}.scheduled_hearing_count == 1 after reschedule"
            - "Application.${app_id}.status == HEARING_SCHEDULED after reschedule"

  - rule_id: transitive_cascade
    instances:
      - name: appeal_sustain_four_hop_chain
        grounds:
          - state_machines.Appeal.FILED_to_DECIDED_SUSTAINED
          - state_machines.Application.DENIED_to_APPROVED_ON_APPEAL
          - state_machines.Violation.AFTER_THE_FACT_PENDING_to_COMPLIANCE_VERIFIED
        distinguishing_aspect: |
          Depth-3 chain from the appeal-decision trigger: Appeal SUSTAINED
          causes Application DENIED -> APPROVED_ON_APPEAL, which itself causes
          the linked Violation -> COMPLIANCE_VERIFIED with accrual stopped at
          the appeal timestamp, which itself causes Property.open_violation_count
          to drop to 0 and compliance_posture to flip CLEAR. The companion
          instance is a depth-2 chain from a different trigger (certificate
          completion).
        test_recipe:
          setup:
            - "Violation NOTICE_ISSUED at 2026-08-01 on a property (assessed 20000000, cap 2000000)"
            - "After-the-fact ADDITION application linked to it, denied at commission hearing; appeal filed 2026-08-02"
          setup_api_calls:
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Gail Owner", email: "gail@x.com", mailing_address: "7 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "77 Birch", parcel_number: "P-700", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1928, assessed_value_cents: 20000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/violations"
              payload: { property_id: "${p_id}", observed_violation_date: "2026-07-01T00:00:00Z", work_description: "Unpermitted rear addition" }
              as: EnforcementOfficer
              captures: { v_id: $.data.id }
            - call: "POST /preservation/violations/${v_id}/issue-notice"
              payload: {}
              as: EnforcementOfficer
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ADDITION", is_visible_from_public_way: true, after_the_fact: true, violation_id: "${v_id}", work_items: [{ category: "ADDITION", description: "rear addition as built", estimated_cost_cents: 1500000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "ADDITION", verified_cost_cents: 1500000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { app_v: $.data.version }
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
            - call: "POST /preservation/hearings/${h_id}/open"
              payload: {}
              as: Commissioner
            - call: "POST /preservation/applications/${app_id}/decide"
              payload: { outcome: "DENY", denial_rationale_sections: ["S1"] }
              as: Commissioner
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/appeals"
              payload: { application_id: "${app_id}", grounds: "Guideline S1 misapplied" }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/appeals/${ap_id}/decide"
              payload: { outcome: "SUSTAIN", council_findings: "Commission misread S1" }
              as: CouncilMember
              captures: { ap_status: $.data.status, ap_decided: $.data.decided_at }
          assert:
            - "Appeal.${ap_id}.status == DECIDED_SUSTAINED"
            - "Application.${app_id}.status == APPROVED_ON_APPEAL (link 1: appeal -> application)"
            - "Violation.${v_id}.status == COMPLIANCE_VERIFIED (link 2: application approval -> violation)"
            - "Violation.${v_id}.compliance_verified_at == 2026-08-03T00:00:00Z (appeal decided_at, not the original denial time)"
            - "Violation.${v_id}.final_penalty_cents == 20000 (2 elapsed days x 10000; accrual stopped at appeal decision)"
            - "Property.${p_id}.open_violation_count == 0 and compliance_posture == CLEAR (link 3: violation -> property)"

      - name: demolition_completion_census_chain
        grounds:
          - state_machines.Certificate.CONDITIONS_VERIFIED_to_COMPLETED
          - state_machines.Property.DEMOLITION_PENDING_to_DEMOLISHED
          - calculations.contributing_census
        distinguishing_aspect: |
          Depth-2 chain from the certificate-completion trigger: completing a
          demolition certificate causes Property DEMOLITION_PENDING ->
          DEMOLISHED, which itself causes the district census to drop and the
          posture to flip STABLE -> AT_RISK. The companion instance is a
          depth-3 chain from a different trigger (appeal decision).
        test_recipe:
          setup:
            - "LOCAL district with P1 CONTRIBUTING + P2 NON_CONTRIBUTING (census 1 of 2, posture STABLE)"
            - "DEMOLITION application on P1 approved at commission hearing; fee paid in full; certificate issued and conditions verified"
          setup_api_calls:
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
