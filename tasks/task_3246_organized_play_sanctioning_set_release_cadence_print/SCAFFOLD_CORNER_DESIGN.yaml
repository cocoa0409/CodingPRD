      - name: enforcement_escalation_branches_on_repeated_offense
        claim_type: Correct Result
        grounds:
          - calculations.enforcement_penalty_points
          - entities.RulesEnforcementCase.fields.repeated_offense
        distinguishing_aspect: "The escalate branch is a genuine fork: repeated_offense true multiplies by 3 while false adds 4, so two ESCALATE calls on the same class and level produce different current_points."
        test_recipe:
