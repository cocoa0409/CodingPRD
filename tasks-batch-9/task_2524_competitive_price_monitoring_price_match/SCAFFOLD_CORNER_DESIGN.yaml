# =============================================================================
# §1.9 Scaffold Corner Design — task_2524 competitive price monitoring & price match
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's §1.1-§1.7 surface and emits one instance per applicable
# row. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the covering §1.8 instance.
#
# Conventions shared with §1.8:
#   * every chain sets the logical clock to 2026-08-01T00:00:00Z first
#   * observations and claimed prices are observed at 2026-07-31T18:00:00Z
#   * audit ids analyst-1 (author) and manager-9 (decider) keep segregation of
#     duties satisfiable; store-scoped calls pass as_user_id: "${s_id}"
#   * every negative call captures $.data.error_id
#
# Sections: entities, state_machines, calculations, validations, endpoints,
#           errors, rbac, cross_cutting_complexity_layers, consistency_model
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_market_creation_returns_full_envelope
        claim_type: creation
        grounds: [entities.Market, endpoints.POST_/pricing/markets, response_envelope.success]
        distinguishing_aspect: "POST /pricing/markets with every declared input returns 201 with meta.api_request_id, response_type object and a data object carrying the four common fields plus all computed fields at their initial values."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", currency_code: "USD", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "data.market_code == US-WEST, name == US West, currency_code == USD, strategic_positioning == AT_PARITY, strategic_index_target_bp == 9800, index_tolerance_bp == 150"
            - "data.observed_index_bp == null, positioning_gap_bp == null, insufficient_data_report_count == 0, pricing_posture == OPEN"
            - "data.id is a UUID with no type prefix, data.version == 1, created_at == updated_at == 2026-08-01T00:00:00Z"

      - name: corner_product_retrieval_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds: [entities.Product, "endpoints.GET_/pricing/products/{id}", calculations.repricing_proposal]
        distinguishing_aspect: "GET /pricing/products/{id} echoes the stored inputs and the computed effective_floor_cents == max(ceil(8000 / 0.8), 9000) == 10000, where the margin term wins over the MAP term."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one market."
            - "Product SKU-READ-1 with unit_cost 8000, margin_floor_pct 0.20 (margin floor 10000) and map_floor 9000."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-READ-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20, map_floor_cents: 9000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /pricing/products/${p_id}"
              payload: {}
              as: PricingAnalyst
          assert:
            - "HTTP 200 with data.id == ${p_id} and data.market_id == ${m_id}"
            - "data.own_price_cents == 20000, unit_cost_cents == 8000, map_floor_cents == 9000, margin_floor_pct == 0.20"
            - "data.effective_floor_cents == 10000 (ceil(8000 / 0.8) beats map_floor 9000)"
            - "data.last_price_change_at == null, price_change_count == 0, status == ACTIVE, index_weight_bp == 10000"

      - name: corner_competitor_listing_pagination_envelope
        claim_type: listing
        grounds: [endpoints.GET_/pricing/competitors, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /pricing/competitors?limit=2 over three rows returns response_type array with total_count 3, has_more true and exactly two data items; the tier filter narrows the same collection to one row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one market with three competitors: two PRIMARY (C-A, C-B) and one SECONDARY (C-C)."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-B", name: "Beta Bazaar", collection_method: "STORE_AUDIT", tier: "PRIMARY" }
              as: PlatformAdmin
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-C", name: "Gamma Goods", collection_method: "HYBRID", tier: "SECONDARY" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pricing/competitors"
              payload: { market_id: "${m_id}", limit: 2, offset: 0 }
              as: PricingAnalyst
            - call: "GET /pricing/competitors"
              payload: { market_id: "${m_id}", tier: "SECONDARY" }
              as: PricingAnalyst
          assert:
            - "First call: HTTP 200, response_type == array, total_count == 3, has_more == true, limit == 2, offset == 0 and exactly 2 rows in data"
            - "Second call: total_count == 1, has_more == false and the single row has competitor_code C-C"
            - "Omitting limit on the second call applies the default limit of 10"

      - name: corner_product_not_found_returns_404_envelope
        claim_type: not_found
        grounds: ["endpoints.GET_/pricing/products/{id}", "errors[ERR_PRODUCT_NOT_FOUND]", response_envelope.error]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /pricing/products/{id} returns the error envelope with response_type error and data.error_id ERR_PRODUCT_NOT_FOUND, not an empty object."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no product with the probed id exists."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pricing/products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error"
            - "data.error_id == ERR_PRODUCT_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are still present on the error envelope"

      - name: corner_required_field_missing_on_product_create_rejected
        claim_type: required_fields
        grounds: [entities.Product.fields.own_price_cents, validations.priority_28_ERR_INVALID_REQUEST]
        distinguishing_aspect: "own_price_cents has source input with no default, so omitting it fails priority 28 with ERR_INVALID_REQUEST; a second call supplying a non-positive value fails the same rule through its constraint clause."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one market."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-MISS-1", category_code: "APPLIANCE", brand: "Vitala", unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-MISS-2", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 0, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { err_zero: $.data.error_id }
          assert:
            - "First call: HTTP 422 with error_id == ERR_INVALID_REQUEST (own_price_cents absent)"
            - "Second call: HTTP 422 with error_id == ERR_INVALID_REQUEST (own_price_cents must be > 0)"
            - "GET /pricing/products?market_id=${m_id} returns total_count == 0 — neither call persisted a row"

      - name: corner_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds: [entities.Product.fields.margin_floor_pct, entities.Competitor.fields.price_match_eligible, entities.PriceMatchPolicy.fields.claim_window_hours, entities.Market.fields.index_tolerance_bp]
        distinguishing_aspect: "Omitting every optional input yields the declared defaults exactly: market currency_code USD and index_tolerance_bp 150, product margin_floor_pct 0.20 / map_floor 0 / index_weight_bp 10000 / status ACTIVE / brand_repricing_restricted false, competitor price_match_eligible false, policy verification_required true / max_match_discount_pct 0.25 / claim_window_hours 168 / excluded_category_codes []."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-DEF-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], daily_override_budget_cents: 100000 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_id: $.data.id }
          assert:
            - "Market.${m_id}.currency_code == USD and index_tolerance_bp == 150"
            - "Product.${p_id}.margin_floor_pct == 0.20, map_floor_cents == 0, index_weight_bp == 10000, status == ACTIVE, brand_repricing_restricted == false"
            - "Product.${p_id}.effective_floor_cents == 10000 — the default margin floor drives the computed field"
            - "Competitor.${c1_id}.price_match_eligible == false and status == ACTIVE"
            - "PriceMatchPolicy.${pol_id}.verification_required == true, max_match_discount_pct == 0.25, claim_window_hours == 168, excluded_category_codes == [], status == ACTIVE, honored_claim_count == 0"

      - name: corner_computed_fields_derived_on_match_create
        claim_type: computed_fields
        grounds: [entities.CompetitorProductLink.fields.confidence_bp, entities.CompetitorProductLink.fields.match_grade, calculations.match_confidence_score]
        distinguishing_aspect: "POST /pricing/matches derives confidence_bp, confidence_variant, match_grade, review_round, data_status and status from the three scores alone; no request field can set them."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; market, ACTIVE product, ACTIVE PRIMARY competitor."
            - "The link is created with match_method IMAGE and scores 40 / 40 / 40, so blend_bp == 55*40 + 30*40 + 15*40 == 4000 and the grade is WEAK."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-COMP-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IMAGE", identifier_score: 40, attribute_score: 40, image_score: 40 }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
          assert:
            - "CompetitorProductLink.${l_id}.confidence_bp == 4000 and confidence_variant == ATTRIBUTE_BLEND"
            - "CompetitorProductLink.${l_id}.match_grade == WEAK (4000 < 6000)"
            - "The low-image ceiling of 6000 does not bind because 4000 is already below it"
            - "CompetitorProductLink.${l_id}.status == PROPOSED, review_round == 0, data_status == INSUFFICIENT"
            - "CompetitorProductLink.${l_id}.latest_effective_price_cents == null, selected_observation_id == null, gap_bp == null, gap_stale == false"
            - "Competitor.${c1_id}.confirmed_match_count == 0 — a PROPOSED link does not count"

      - name: corner_system_fields_generated_on_store_create
        claim_type: system_fields
        grounds: [entities.Store, complexity_profile.entity_topology]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server on POST /pricing/stores, and the two slot counters start at 0 / capacity even though no batch exists yet."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one market."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          assert:
            - "data.id is a server-minted UUID with no type prefix and was not supplied by the request"
            - "data.version == 1 and created_at == updated_at == 2026-08-01T00:00:00Z"
            - "Store.${s_id}.label_slots_used_today == 0 and label_slots_remaining_today == 5"
            - "Store.${s_id}.override_budget_used_cents == 0"

      - name: corner_type_constraints_enum_and_numeric_range
        claim_type: type_constraints
        grounds: [validations.priority_30_ERR_INVALID_ENUM_VALUE, validations.priority_28_ERR_INVALID_REQUEST, entities.CompetitorProductLink.fields.image_score]
        distinguishing_aspect: "An out-of-set enum member fails priority 30 with ERR_INVALID_ENUM_VALUE while an out-of-range 0..100 score fails the earlier priority 28 with ERR_INVALID_REQUEST — two different rules on the same endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; market, product and PRIMARY competitor exist."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-ENUM-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "FUZZY_TEXT", identifier_score: 90, attribute_score: 90, image_score: 90 }
              as: PricingAnalyst
              captures: { err_enum: $.data.error_id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 90, attribute_score: 90, image_score: 140 }
              as: PricingAnalyst
              captures: { err_range: $.data.error_id }
          assert:
            - "First call: HTTP 422 with error_id == ERR_INVALID_ENUM_VALUE (FUZZY_TEXT is not a declared match_method)"
            - "Second call: HTTP 422 with error_id == ERR_INVALID_REQUEST (image_score 140 breaks the 0..100 constraint at priority 28, which outranks the enum rule)"
            - "GET /pricing/matches?product_id=${p_id} returns total_count == 0"

      - name: corner_override_log_is_immutable_audit_row
        claim_type: immutability
        grounds: [entities.OverrideLog, "endpoints.GET_/pricing/claims/{id}/override-logs"]
        distinguishing_aspect: "OverrideLog declares common_fields false, so its rows expose only id and created_at beyond their payload — no version, no updated_at — and §1.5 offers no PATCH or DELETE for them; the reversal appends a second row instead of editing the first."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A claim at claimed_price 10400 on product SKU-APPL-1 (own 12999, cost 7000, margin 0.20) is honored and then reversed, so the ledger holds a DEBIT and a CREDIT row."
            - "Policy budget 100000, max_match_discount_pct 0.30; store STORE-101 override_authority 5000."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-APPL-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 12999, unit_cost_cents: 7000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY", price_match_eligible: true }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], daily_override_budget_cents: 100000, max_match_discount_pct: 0.30 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_id: $.data.id }
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_id}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 10400, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "receipt-imm" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /pricing/claims/${claim_id}/verify"
              payload: {}
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${claim_id}/decide"
              payload: { decision: "VERIFIED" }
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${claim_id}/honor"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${claim_id}/reverse"
              payload: { reversal_reason: "shopper changed mind" }
              as: StoreManager
              as_user_id: "${s_id}"
          trigger:
            - call: "GET /pricing/claims/${claim_id}/override-logs"
              payload: { limit: 10, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "HTTP 200 with total_count == 2 and two data rows ordered by created_at ASC"
            - "Each row exposes id and created_at but no version and no updated_at field"
            - "Row 1: direction == DEBIT, approval_tier == ASSOCIATE, approved_by_role == StoreAssociate, approved_by_user_id == ${s_id}, approved_discount_cents == 3099, honored_price_cents == 9900"
            - "Row 2: direction == CREDIT, approved_by_role == StoreManager, approved_discount_cents == 3099 — the DEBIT row was not rewritten"
            - "§1.5 declares no PATCH or DELETE endpoint for override logs, so the audit trail is append-only by construction"

      - name: corner_flat_topology_foreign_keys_validated_on_claim_create
        claim_type: foreign_key_references_validated
        grounds: [validations.priority_25_ERR_STORE_NOT_FOUND, complexity_profile.entity_topology, entities.PriceMatchClaim]
        distinguishing_aspect: "Flat topology: PriceMatchClaim carries four body FKs and priority 25 validates them in declaration order (policy_id, product_id, competitor_id, store_id), so an unknown store_id surfaces ERR_STORE_NOT_FOUND while an unknown policy_id on the same body surfaces ERR_POLICY_NOT_FOUND first."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; market, product, store, eligible PRIMARY competitor with a CONFIRMED link and an ACTIVE policy all exist."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
