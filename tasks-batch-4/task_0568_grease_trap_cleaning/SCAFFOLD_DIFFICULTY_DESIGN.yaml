  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fog_25_percent_inclusive_boundary
        grounds:
          - calculations.fog_compliance_flag
          - entities.PumpOutManifest.fields.compliance_flag
        distinguishing_aspect: |
          Numeric boundary on POST /pump-out-manifests: fog 24.99 -> COMPLIANT while fog 25.00 ->
          NON_COMPLIANT (>= 25.0 is the inclusive breach).
        test_recipe:
          setup:
            - "A grease-trap WorkOrder IN_PROGRESS owned by a technician"
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Boundary Buffet", billing_email: "bb@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "10 Bnd St", municipality_code: "MUNI-A", permit_number: "P-10" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T12:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-5", hazmat_certified: false, volume_gallons: 50, fog_percentage: 24.99 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { flag_below: $.data.compliance_flag }
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-5", hazmat_certified: false, volume_gallons: 50, fog_percentage: 25.0 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { flag_at: $.data.compliance_flag }
          assert:
            - "first manifest compliance_flag == COMPLIANT"
            - "second manifest compliance_flag == NON_COMPLIANT"

      - name: zero_billable_lines_boundary
        grounds:
          - validations[priority=12]
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: |
          Empty/zero-count boundary on POST /invoices/{id}/issue: an invoice whose contract has
          base_rate 0 and which has zero COMPLETED work orders (0 billable lines) is rejected with
          ERR_NO_BILLABLE_ACTIVITY — a different metric and endpoint than the fog numeric boundary.
        test_recipe:
          setup:
            - "ACTIVE contract base_rate_cents=0; a DRAFT invoice for a period with no completed work orders"
          setup_api_calls:
