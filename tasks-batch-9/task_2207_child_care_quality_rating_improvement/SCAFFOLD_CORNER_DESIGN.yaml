            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "SPACE_FURNISHINGS", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "PERSONAL_CARE", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "LANGUAGE_REASONING", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "ACTIVITIES", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "INTERACTION", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "PROGRAM_STRUCTURE", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}" }
            - { call: "POST /observation-visits/${vid}/finalize", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /rating-cycles/${cid}/award", payload: { score_variant: "FINAL" }, as: StateAdministrator, as_user_id: "admin_award_1" }
          assert:
            - "the preview returns weighted_total == 50.00, points_tier == 2, block_clearance == {1: CLEARED, 2: NOT_CLEARED, 3: NOT_CLEARED}, highest_block_cleared == 1 and awarded_tier == 2"
            - "the finalize call sets RatingCycle.${cid}.observation_composite == 4.00 and ObservationVisit.${vid}.reliability_pct == null"
            - "the award returns HTTP 200 with weighted_total == 26.00, domain_points == {LEARNING_ENVIRONMENT: 12, STAFF_QUALIFICATIONS: 8, FAMILY_PARTNERSHIP: 0, ADMINISTRATION: 0, CHILD_ASSESSMENT: 0}, points_tier == 1, awarded_tier == 1 and score_variant == FINAL"
            - "the FINAL run still reports block_clearance[1] == CLEARED because composite 4.00 meets min_composite_for_block 4.00 exactly, and highest_block_cleared == 1"
            - "RatingCycle.${cid}.status == AWARDED and SelfAssessment.${said}.claimed_points.LEARNING_ENVIRONMENT is still 20 (the preview mutated nothing)"

  - section: consistency_model
    instances:
      - name: create_response_and_immediate_read_agree_with_no_lag
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /providers]
          - endpoints[GET /providers/{provider_id}]
        distinguishing_aspect: "The 201 body of POST /providers already carries version 1, status APPLIED, credential_compliance_pct 0.00, weekly_onsite_cap_hours 12 and public_listing_visible false, and an immediate GET of the same id returns byte-identical values - nothing is filled in asynchronously."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers", payload: { legal_name: "Immediate Center", license_number: "LIC-6141", county_code: "DANE", region_code: "URBAN", licensed_capacity: 25, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "the POST body has status == APPLIED, version == 1, credential_compliance_pct == 0.00, weekly_onsite_cap_hours == 12, public_listing_visible == false, current_tier == null and current_rating_cycle_id == null"
            - "the GET returns the identical field values including version == 1 and the same created_at and updated_at instants"
            - "GET /providers?status=APPLIED returns total_count == 1 with data[0].id == ${pid} in the same sequence, with no re-read needed"

      - name: verification_decision_is_visible_across_entities_in_the_same_response
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /self-assessments/{self_assessment_id}/verification-decisions]
          - state_machines.RatingCycle[SELF_ASSESSMENT_SUBMITTED -> DOCS_VERIFIED]
        distinguishing_aspect: "The APPROVE response stamps SelfAssessment.status VERIFIED, verified_points and documented_domains, and the parent RatingCycle already reads DOCS_VERIFIED on the very next call - the cross-entity state change is not deferred to a later read."
        test_recipe:
          setup:
            - "Cycle with one SUBMITTED SelfAssessment claiming {LE 12, SQ 8, FP 0, AD 0, CA 0}; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "LEARNING_ENVIRONMENT", block_level: 1, max_points: 20, block_min_points: 10, weight: 0.30, observation_linked: true, min_composite_for_block: 4.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "STAFF_QUALIFICATIONS", block_level: 1, max_points: 20, block_min_points: 8, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "FAMILY_PARTNERSHIP", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "ADMINISTRATION", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "CHILD_ASSESSMENT", block_level: 3, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Same Response", license_number: "LIC-6151", county_code: "DANE", region_code: "URBAN", licensed_capacity: 25, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pver: $.data.version } }
            - { call: "POST /providers/${pid}/rating-cycles", payload: { cycle_type: "INITIAL", expected_provider_version: "${pver}" }, as: Provider, as_user_id: "${pid}", captures: { cid: $.data.id } }
            - { call: "POST /rating-cycles/${cid}/self-assessments", payload: { claimed_points: { LEARNING_ENVIRONMENT: 12, STAFF_QUALIFICATIONS: 8, FAMILY_PARTNERSHIP: 0, ADMINISTRATION: 0, CHILD_ASSESSMENT: 0 }, documentation: [ { domain_code: "LEARNING_ENVIRONMENT", evidence_type: "LESSON_PLAN", reference_label: "LP-1", page_count: 4 }, { domain_code: "STAFF_QUALIFICATIONS", evidence_type: "ROSTER", reference_label: "RO-1", page_count: 2 } ] }, as: Provider, as_user_id: "${pid}", captures: { said: $.data.id } }
          trigger:
            - { call: "POST /self-assessments/${said}/verification-decisions", payload: { decision: "APPROVE", verified_points: { LEARNING_ENVIRONMENT: 12, STAFF_QUALIFICATIONS: 8, FAMILY_PARTNERSHIP: 0, ADMINISTRATION: 0, CHILD_ASSESSMENT: 0 } }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /rating-cycles/${cid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /self-assessments/${said}", payload: {}, as: Provider, as_user_id: "${pid}" }
          assert:
            - "the verification response returns HTTP 200 with status == VERIFIED, verified_points.LEARNING_ENVIRONMENT == 12, return_count == 0 and documented_domains covering {LEARNING_ENVIRONMENT, STAFF_QUALIFICATIONS}"
            - "the immediately following GET /rating-cycles/${cid} shows status == DOCS_VERIFIED with observation_composite == null and awarded_tier == null"
            - "the immediately following GET /self-assessments/${said} shows the same VERIFIED status and the same verified_points map"
            - "GET /self-assessments?rating_cycle_id=${cid}&status=VERIFIED returns total_count == 1 with data[0].id == ${said}"
