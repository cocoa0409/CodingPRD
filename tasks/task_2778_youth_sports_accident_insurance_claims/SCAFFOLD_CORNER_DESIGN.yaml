            - "trigger call 1 returns HTTP 422 with data.error_id == ERR_CAT_CERTIFICATION_REQUIRED, because cat_layer_elected is true and benefit_before_limit_cents 640000 > cat_attachment_point_cents 500000"
            - "trigger call 2 returns HTTP 200 with data.adjudication_status == APPROVED, data.base_layer_benefit_cents == 500000, data.cat_layer_benefit_cents == 0, data.payable_amount_cents == 500000 -- no certification is demanded when the layer is not elected"
            - "trigger call 3 returns HTTP 200 with data.cat_certification_status == CERTIFIED"
            - "trigger call 4 returns HTTP 200 with data.adjudication_status == APPROVED, data.base_layer_benefit_cents == 500000, data.cat_layer_benefit_cents == 140000, data.payable_amount_cents == 640000"
            - "Claim.${claim_a_id} and Claim.${claim_b_id} both carry allowed_amount_total_cents == 660000 and deductible_applied_cents == 20000; the 140000 divergence comes only from the elected layer"

      - name: bind_reports_term_overlap_before_minimum_participants
        claim_type: cascading_validation
        grounds:
          - validations.priority_28_policy_term_overlap
          - validations.priority_38_minimum_participants_not_met
          - errors.ERR_POLICY_TERM_OVERLAP
        distinguishing_aspect: "One bind call violates both the overlap constraint (priority 28) and the minimum-participant floor (priority 38); only the overlap error may surface. A second bind on an abutting term with the same undersized count returns ERR_MINIMUM_PARTICIPANTS_NOT_MET, proving priority 38 is live and the first result was genuine precedence rather than a missing check."
        test_recipe:
          setup:
            - "One league and one BASEBALL_U12 classification with minimum_participants 25."
            - "Policy 1 is ACTIVE over [2026-03-01, 2027-03-01) with 404 participants."
            - "Policy 2 is QUOTED over [2026-06-01, 2027-06-01) with only 10 participants: it both overlaps policy 1 and falls below the floor."
            - "Policy 3 is QUOTED over [2027-03-01, 2028-03-01) with 10 participants: it merely abuts policy 1, so only the floor is violated."
