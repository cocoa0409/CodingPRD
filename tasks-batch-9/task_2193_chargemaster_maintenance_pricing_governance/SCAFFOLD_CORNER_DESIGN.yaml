# =============================================================================
# Task 2193 — Chargemaster Maintenance & Pricing Governance
# §1.9 Scaffold Corner Design (BREADTH index)
#
# Enumerative coverage of the testable claims declared by SCAFFOLD.yaml §1.1–§1.7.
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Every instance is fully specified: the
# setup_api_calls chain drives an empty DB into the precondition using only §1.5
# endpoints, every ${var} is bound by an earlier captures: block, and every
# formula-derived assertion is a pre-computed literal.
#
# Logical clock note: before any POST /_clock/set_current_utc the clock reads
# 2026-08-01T00:00:00Z. Every chain below pins it explicitly first.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: charge_item_creation_returns_draft_stale_zero_gross_version_one
        claim_type: creation
        grounds:
          - entities.ChargeItem.fields.lifecycle_status
          - entities.ChargeItem.fields.price_status
          - entities.ChargeItem.fields.gross_charge_cents
          - endpoints[POST /chargemaster/charge-items]
        distinguishing_aspect: "A ChargeItem created with every required input returns 201 with lifecycle_status == DRAFT, price_status == PRICE_STALE, gross_charge_cents == 0, applied_price_rule_id == null and version == 1 — the pricing dimension is untouched by creation."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
            - "Facility 'Mercy General' exists with rounding_mode NEAREST_CENT, posture OPEN."
            - "RevenueCode 0300 allows all four code types and does not require HCPCS."
            - "Department 'Cardiac Cath Lab' exists with an unrestricted allowed_revenue_code_values."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000, duplicate_detection_mode: "STRICT_CODE" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == \"object\" and meta.api_request_id is present"
            - "ChargeItem.${item}.lifecycle_status == DRAFT"
            - "ChargeItem.${item}.price_status == PRICE_STALE"
            - "ChargeItem.${item}.gross_charge_cents == 0"
            - "ChargeItem.${item}.prior_gross_charge_cents == 0"
            - "ChargeItem.${item}.applied_price_rule_id == null"
            - "ChargeItem.${item}.price_conflict == false"
            - "ChargeItem.${item}.duplicate_of_item_id == null"
            - "ChargeItem.${item}.companion_window_hours == 24"
            - "ChargeItem.${item}.version == 1"

      - name: charge_item_retrieval_returns_both_state_dimensions_and_version
        claim_type: retrieval
        grounds:
          - entities.ChargeItem.fields.gross_charge_cents
          - entities.ChargeItem.fields.price_conflict
          - endpoints[GET /chargemaster/charge-items/{charge_item_id}]
        distinguishing_aspect: "GET /charge-items/{id} echoes the stored row exactly after a reprice: gross_charge_cents == 240000, price_status == PRICED_CURRENT and lifecycle_status == DRAFT, proving the two dimensions are reported independently."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility with NEAREST_CENT rounding."
            - "COST_PLUS_MARKUP PriceRule with the default 3 tiers is in force for (facility, 0300)."
            - "ChargeItem CDM-1001 (cost_basis 100000, medicare 50000, market_p75 900000) has been repriced once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { pr300: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "GET /chargemaster/charge-items/${item}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { item_v: $.data.version }
          assert:
            - "HTTP status == 200"
            - "data.cdm_number == \"CDM-1001\""
            - "data.lifecycle_status == DRAFT"
            - "data.price_status == PRICED_CURRENT"
            - "data.gross_charge_cents == 240000"
            - "data.prior_gross_charge_cents == 0"
            - "data.applied_price_rule_id == ${pr300}"
            - "data.price_conflict == false"
            - "data.version == 2"
            - "${item_v} == 2"

      - name: charge_item_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /chargemaster/charge-items]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three items exist in one facility; GET /charge-items with limit=2 offset=0 returns exactly 2 rows with total_count == 3 and has_more == true, and offset=2 returns 1 row with has_more == false."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one facility, one department, one revenue code."
            - "Three DRAFT ChargeItems CDM-1001, CDM-1002, CDM-1003 created in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "REV_ONLY"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CATH BASIC", code_type: "REV_ONLY", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item1: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1002", description: "CATH ADVANCED", code_type: "REV_ONLY", cost_basis_cents: 200000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item2: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1003", description: "CATH SUPPLY KIT", code_type: "REV_ONLY", cost_basis_cents: 30000, medicare_rate_cents: 5000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item3: $.data.id }
          trigger:
            - call: "GET /chargemaster/charge-items"
              payload: { facility_id: "${fac}", limit: 2, offset: 0 }
              as: RevenueIntegrityAnalyst
            - call: "GET /chargemaster/charge-items"
              payload: { facility_id: "${fac}", limit: 2, offset: 2 }
              as: RevenueIntegrityAnalyst
          assert:
            - "First call: HTTP status == 200 and response_type == \"array\""
            - "First call: len(data) == 2"
            - "First call: total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "Second call: len(data) == 1"
            - "Second call: total_count == 3 and has_more == false and offset == 2"

      - name: charge_item_path_id_not_found_returns_err_charge_item_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_CHARGE_ITEM_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown charge_item_id in the path yields ERR_CHARGE_ITEM_NOT_FOUND (404) — priority 5 — not the generic ERR_GOVERNANCE_RESOURCE_NOT_FOUND used for /price-rules and /departments."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; a facility exists but no ChargeItem carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /chargemaster/charge-items/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response_type == \"error\""
            - "${err} == \"ERR_CHARGE_ITEM_NOT_FOUND\""

      - name: revenue_code_creation_missing_required_pricing_class_rejected
        claim_type: required_fields
        grounds:
          - entities.RevenueCode.fields.pricing_class
          - validations[priority=11]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "pricing_class is declared source: input with no default on RevenueCode; omitting it returns ERR_VALIDATION (422) and no RevenueCode row is created."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; empty revenue-code reference table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0301", description: "Lab Chemistry", requires_hcpcs: false, allowed_code_types: ["CPT"] }
              as: SystemAdmin
              captures: { err: $.data.error_id }
            - call: "GET /chargemaster/revenue-codes"
              payload: { code: "0301" }
              as: SystemAdmin
          assert:
            - "First call: HTTP status == 422"
            - "${err} == \"ERR_VALIDATION\""
            - "Second call: total_count == 0 and len(data) == 0"

      - name: facility_defaults_applied_when_optional_configuration_omitted
        claim_type: defaults
        grounds:
          - entities.Facility.fields.rounding_mode
          - entities.Facility.fields.aggregate_markup_limit_bp
          - entities.Facility.fields.volume_growth_bp
          - entities.Facility.fields.impact_lookback_days
          - entities.Facility.fields.duplicate_detection_mode
        distinguishing_aspect: "Creating a Facility with only name + cms_certification_number applies every declared default: rounding_mode NEAREST_DOLLAR, aggregate_markup_limit_bp 40000, volume_growth_bp 10500, impact_lookback_days 90, duplicate_detection_mode STRICT_CODE, transparency_status NEEDS_REFRESH."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; no facilities exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Bare Config Hospital", cms_certification_number: "CCN-0009" }
              as: SystemAdmin
              captures: { fac: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Facility.${fac}.rounding_mode == NEAREST_DOLLAR"
            - "Facility.${fac}.aggregate_markup_limit_bp == 40000"
            - "Facility.${fac}.volume_growth_bp == 10500"
            - "Facility.${fac}.impact_lookback_days == 90"
            - "Facility.${fac}.duplicate_detection_mode == STRICT_CODE"
            - "Facility.${fac}.chargemaster_posture == OPEN"
            - "Facility.${fac}.transparency_status == NEEDS_REFRESH"
            - "Facility.${fac}.active_item_count == 0 and Facility.${fac}.aggregate_gross_charge_cents == 0"
            - "Facility.${fac}.aggregate_markup_ratio_bp == 0"
            - "Facility.${fac}.published_transparency_file_id == null"
            - "Facility.${fac}.version == 1"

      - name: facility_computed_aggregates_reconcile_after_first_activation
        claim_type: computed_fields
        grounds:
          - entities.Facility.fields.active_item_count
          - entities.Facility.fields.aggregate_gross_charge_cents
          - entities.Facility.fields.aggregate_cost_basis_cents
          - entities.Facility.fields.aggregate_markup_ratio_bp
          - state_machines.ChargeItem.lifecycle_status.APPROVED_to_ACTIVE
        distinguishing_aspect: "After exactly one item (gross 240000, cost 100000) reaches ACTIVE, the four Facility computed aggregates read 1 / 240000 / 100000 / 24000 bp; they are derived from persisted ACTIVE items, never from client input."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility NEAREST_CENT; RevenueCode 0300 ACTIVE."
            - "COST_PLUS_MARKUP rule with default tiers effective 2026-01-01."
            - "ChargeItem CDM-1001 repriced to 240000 then driven DRAFT -> PENDING_REVIEW -> APPROVED -> ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { pr300: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { fac_v: $.data.version }
          assert:
            - "First call: HTTP status == 200 and data.lifecycle_status == ACTIVE"
            - "ChargeItem.${item}.approved_by_user_id == \"pca_1\""
            - "Facility.${fac}.active_item_count == 1"
            - "Facility.${fac}.aggregate_gross_charge_cents == 240000"
            - "Facility.${fac}.aggregate_cost_basis_cents == 100000"
            - "Facility.${fac}.aggregate_markup_ratio_bp == 24000"
            - "Facility.${fac}.stale_price_item_count == 0"
            - "Facility.${fac}.transparency_status == NEEDS_REFRESH"
            - "Facility.${fac}.chargemaster_posture == OPEN"

      - name: charge_item_system_fields_are_server_minted_not_client_supplied
        claim_type: system_fields
        grounds:
          - entities.ChargeItem.fields.lifecycle_status
          - entities.ChargeItem.fields.approved_by_user_id
          - entities.ChargeItem.fields.last_code_cycle_id
          - endpoints[POST /chargemaster/charge-items]
        distinguishing_aspect: "POST /charge-items declares no lifecycle_status / price_status / approved_by_user_id / last_code_cycle_id input; the created row carries server-minted id, created_at, updated_at, version == 1, approved_by_user_id == null and last_code_cycle_id == null."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility, revenue code and department configured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["REV_ONLY"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-2001", description: "GENERIC LAB PANEL", code_type: "REV_ONLY", cost_basis_cents: 4000, medicare_rate_cents: 1000, market_p75_cents: 90000, effective_from: "2026-10-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id, item_created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "ChargeItem.${item}.id is a server-minted non-empty string"
            - "${item_created} == \"2026-09-01T00:00:00Z\""
            - "ChargeItem.${item}.updated_at == \"2026-09-01T00:00:00Z\""
            - "ChargeItem.${item}.version == 1"
            - "ChargeItem.${item}.lifecycle_status == DRAFT"
            - "ChargeItem.${item}.price_status == PRICE_STALE"
            - "ChargeItem.${item}.approved_by_user_id == null"
            - "ChargeItem.${item}.last_code_cycle_id == null"
            - "ChargeItem.${item}.code_value == null"

      - name: charge_item_creation_invalid_enum_code_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.ChargeItem.fields.code_type
          - validations[priority=11]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "code_type is constrained to {CPT, HCPCS, REV_ONLY, CDM_INTERNAL}; the illegal member \"J_CODE\" returns ERR_VALIDATION (422) at priority 11, before any revenue-code mapping rule at priority 23 can fire."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; RevenueCode 0300 allows only CPT so a mapping error would also apply if the enum check did not fire first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-3001", description: "BAD ENUM ITEM", code_type: "J_CODE", cost_basis_cents: 4000, medicare_rate_cents: 1000, market_p75_cents: 90000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == \"ERR_VALIDATION\""
            - "${err} != \"ERR_REVENUE_CODE_MAPPING_INVALID\""
            - "GET /chargemaster/charge-items with cdm_number=CDM-3001 returns total_count == 0"

      - name: captured_charge_is_immutable_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.CapturedCharge
          - endpoints[GET /chargemaster/captured-charges/{captured_charge_id}]
        distinguishing_aspect: "CapturedCharge declares common_fields: false, so the read row exposes id and created_at but no version and no updated_at, and §1.5 declares no PATCH/PUT/DELETE for /captured-charges — a posted line can only be re-evaluated by a reconcile pass, never edited."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility, department, one INGESTED batch with a single line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac}", department_id: "${dept}", window_start_date: "2026-08-10T00:00:00Z", window_end_date: "2026-08-20T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { batch: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch}/lines"
              payload: { submitted_cdm_number: "CDM-9999", encounter_id: "ENC-1", payer_code: "AETNA_COMM", service_datetime: "2026-08-12T09:00:00Z", quantity: 1, posted_charge_cents: 5000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { line: $.data.id }
          trigger:
            - call: "GET /chargemaster/captured-charges/${line}"
              payload: {}
              as: RevenueIntegrityAnalyst
          assert:
            - "HTTP status == 200"
            - "data.id == ${line} and data.created_at == \"2026-09-01T00:00:00Z\""
            - "\"version\" is absent from data"
            - "\"updated_at\" is absent from data"
            - "data.match_status == UNRECONCILED"
            - "data.charge_item_id == null and data.expected_charge_cents == null and data.line_variance_bp == null"

      - name: department_creation_with_unknown_facility_id_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Department.fields.facility_id
          - validations[priority=4]
          - errors[ERR_FACILITY_NOT_FOUND]
        distinguishing_aspect: "Department declares parent: Facility via facility_id; a body facility_id that resolves to nothing returns ERR_FACILITY_NOT_FOUND (404) at priority 4, ahead of the priority-10 generic body-FK rule and the priority-39 cost_center_code uniqueness rule."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one real facility exists but the probed id is not it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "00000000-0000-0000-0000-0000000000ff", name: "Orphan Dept", cost_center_code: "CC-999", manager_user_id: "mgr_orphan" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == \"ERR_FACILITY_NOT_FOUND\""
            - "GET /chargemaster/departments with facility_id=${fac} returns total_count == 0"

      - name: companion_item_in_another_facility_cannot_be_linked_across_facilities
        claim_type: cross_cutting_associations_validated
        grounds:
          - entities.ChargeItem.fields.companion_required_item_id
          - validations[priority=26]
          - errors[ERR_COMPANION_ITEM_INVALID]
        distinguishing_aspect: "The hybrid topology's self-referential companion link is facility-scoped: pointing companion_required_item_id at an existing item that belongs to a DIFFERENT facility returns ERR_COMPANION_ITEM_INVALID (422), not ERR_REFERENCED_RESOURCE_NOT_FOUND, because the id resolves but the cross-facility association is illegal."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; two facilities each with a department; facility B owns ChargeItem CDM-B001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { facA: $.data.id }
            - call: "POST /chargemaster/facilities"
              payload: { name: "Saint Elsewhere", cms_certification_number: "CCN-0002" }
              as: SystemAdmin
              captures: { facB: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["REV_ONLY"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${facA}", name: "Cath Lab A", cost_center_code: "CC-100", manager_user_id: "mgr_a" }
              as: SystemAdmin
              captures: { deptA: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${facB}", name: "Cath Lab B", cost_center_code: "CC-200", manager_user_id: "mgr_b" }
              as: SystemAdmin
              captures: { deptB: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${facB}", department_id: "${deptB}", revenue_code_id: "${rc300}", cdm_number: "CDM-B001", description: "FOREIGN COMPANION", code_type: "REV_ONLY", cost_basis_cents: 4000, medicare_rate_cents: 1000, market_p75_cents: 90000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { itemB: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${facA}", department_id: "${deptA}", revenue_code_id: "${rc300}", cdm_number: "CDM-A001", description: "TRIGGER LINE", code_type: "REV_ONLY", cost_basis_cents: 4000, medicare_rate_cents: 1000, market_p75_cents: 90000, effective_from: "2026-09-01T00:00:00Z", companion_required_item_id: "${itemB}", companion_window_hours: 24 }
              as: RevenueIntegrityAnalyst
