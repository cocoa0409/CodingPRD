  - section: state_machines
    instances:

      - name: credential_created_starts_in_pending_verification
        claim_type: initial_state
        grounds:
          - state_machines.Credential.initial_state
          - entities.Credential.fields.status
          - endpoints.POST_/vendor-access/credentials
        distinguishing_aspect: "A newly filed Credential is PENDING_VERIFICATION with verified_by_user_id and verified_at_utc null, and it does not yet cover its type, so the rep's posture stays INCOMPLETE."
        test_recipe:
          setup:
            - "Vendor INITV has one rep with no credentials on file."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Initial State Devices", vendor_code: "INITV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_initv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_initv_id}", full_name: "Ivan Init", email: "ivan@initv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_ivan_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ivan_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-INIT-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_init_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Credential.${cred_init_id}.status == PENDING_VERIFICATION"
            - "Credential.${cred_init_id}.verified_by_user_id is null and verified_at_utc is null and rejection_reason is null"
            - "Credential.${cred_init_id}.version == 1"
            - "VendorRep.${rep_ivan_id}.credential_posture == INCOMPLETE"
            - "VendorRep.${rep_ivan_id}.access_status == PENDING_CREDENTIALING"

      - name: single_credential_verification_transitions_to_verified
        claim_type: valid_transition
        grounds:
          - state_machines.Credential.PENDING_VERIFICATION_to_VERIFIED
          - calculations.rep_credential_posture
        distinguishing_aspect: "Verifying ONE of the four required credentials moves that credential to VERIFIED and stamps the officer, but the rep's posture stays INCOMPLETE and access_status stays PENDING_CREDENTIALING because three required types are still uncovered."
        test_recipe:
          setup:
            - "Vendor ONEV has one rep with a single PENDING_VERIFICATION BACKGROUND_CHECK credential; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "One Step Devices", vendor_code: "ONEV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_onev_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_onev_id}", full_name: "Olive One", email: "olive@onev.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_olive_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_olive_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-ONE-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_olive_bgc_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/credentials/${cred_olive_bgc_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
          assert:
            - "HTTP status is 200"
            - "Credential.${cred_olive_bgc_id}.status == VERIFIED"
            - "Credential.${cred_olive_bgc_id}.verified_by_user_id == user_credentialing_1"
            - "Credential.${cred_olive_bgc_id}.verified_at_utc == 2026-08-01T00:00:00Z"
            - "VendorRep.${rep_olive_id}.credential_posture == INCOMPLETE — IMMUNIZATION_INFLUENZA, TRAINING_BLOODBORNE_PATHOGENS and COI_GIFT_ATTESTATION are still uncovered"
            - "VendorRep.${rep_olive_id}.access_status == PENDING_CREDENTIALING and ever_credentialed == false"

      - name: fourth_credential_verification_credentials_the_rep
        claim_type: side_effect_execution
        grounds:
          - state_machines.VendorRep.PENDING_CREDENTIALING_to_CREDENTIALED
          - calculations.rep_credential_posture
          - global_constants.REQUIRED_CREDENTIAL_TYPES
        distinguishing_aspect: "The fourth verification fires every declared side effect at once: posture COMPLIANT, access_status CREDENTIALED, ever_credentialed true and suspension_reason NONE — and the first three verifications fire none of them."
        test_recipe:
          setup:
