      - name: rbac_other_volunteer_cannot_publish_window_on_foreign_profile
        claim_type: peer_role_isolation
        grounds: ["endpoints[POST /volunteers/{id}/availability-windows]", "errors[ERR_NOT_RESOURCE_OWNER]", "validations[priority=15]", "roles.Volunteer.identity"]
        distinguishing_aspect: "The caller holds the right role, so the priority-2 gate passes and the priority-15 ownership gate is the one that fires: an entity_backed Volunteer id that is not the path id yields ERR_NOT_RESOURCE_OWNER (403), not ERR_ROLE_NOT_PERMITTED, and vol-1's window ledger is untouched."
        test_recipe:
          setup: ["One cycle and two ACTIVE volunteers; only the first has published a window."]
          setup_api_calls:
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Ravi Menon", email: "ravi@vol.example", professional_rate_usd_per_hour: 175.00, seniority: SENIOR, weekly_hours_cap: 15}, captures: {vol2_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1", payload: {verify_skill_codes: ["TAX_LAW"]}}
            - {call: "POST /volunteers/${vol2_id}/vet", as: ProgramManager, as_user_id: "pm-1"}
            - {call: "POST /volunteers/${vol_id}/availability-windows", as: Volunteer, as_user_id: "${vol_id}", payload: {starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", window_kind: HARD, hours_offered: 100.00}, captures: {w1_id: "$.data.id"}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/availability-windows", as: Volunteer, as_user_id: "${vol2_id}", payload: {starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-10-01T00:00:00Z", window_kind: SOFT, hours_offered: 60.00}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_NOT_RESOURCE_OWNER\" - not ERR_ROLE_NOT_PERMITTED, because Volunteer is a permitted role for this endpoint"
            - "GET /volunteers/${vol_id}/availability-windows returns total_count == 1 with only ${w1_id}"
            - "GET /volunteers/${vol2_id}/availability-windows returns total_count == 0"
      - name: rbac_volunteer_cannot_file_project_request
