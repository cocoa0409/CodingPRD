scenario: "Test-Prep Course & Tutoring (Kaplan/Princeton Review style): course catalog (SAT/ACT/MCAT/LSAT) & format (live/online/self), enrollment & cohort/class schedule, diagnostic & score-improvement guarantee, practice-test scoring & analytics, instructor assignment, higher-score-or-refund/retake policy, financing/installment, materials access"
domain_name: "test-prep-tutoring"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"        # finite cohort seats reserved/committed/released
  secondary_archetype: "Compliance / audit"      # score-improvement guarantee eligibility + refund/retake rules with audit trail
  complexity_layers:
    - "Optimistic concurrency"          # OCC on Cohort.version for seat-claiming enrollment creation
    - "Dual-variant calculation"        # score improvement: projected vs final; refund vs retake credit
    - "Cascading side effects"          # enrollment cancel -> seat release -> waitlist promotion -> instructor load adjust
    - "Rate / threshold triggers"       # attendance %, completed practice-test count, score-delta thresholds

  entity_topology: flat
  # Peer entities linked by FK (Course, Cohort, Instructor, Student, Enrollment, PracticeAttempt,
  # InstallmentPlan, GuaranteeClaim). No nested ownership URLs; everything is FK-referenced.

  state_machine_shape: branching
  # Enrollment forks on guarantee resolution: ELIGIBLE -> {REFUND_ISSUED, RETAKE_GRANTED} with divergent
  # side-effect sets; GuaranteeClaim has a revert (UNDER_REVIEW -> REJECTED loop back to closed).

  relationship_patterns:
    - one_to_many        # Course -> Cohort, Cohort -> Enrollment, Enrollment -> PracticeAttempt
    - cross_aggregate    # Enrollment references Cohort and Student across aggregate boundaries
    - many_to_many       # Student <-> Cohort realized through the Enrollment junction

  role_model: peer_roles
  # Student owns own Enrollment/PracticeAttempt actions; Instructor owns assigned cohort grading;
  # Registrar (opaque operator) owns catalog/cohort/financing admin; Anonymous registers students.

  consistency_model: immediate
  # All mutations and their cascades are atomic within a single request.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: exam_type
        type: enum
        source: input
        description: "Standardized exam this course prepares for."
        constraints: "one of {SAT, ACT, MCAT, LSAT}"
      - name: format
        type: enum
        source: input
        description: "Delivery format."
        constraints: "one of {LIVE, ONLINE, SELF}"
      - name: title
        type: string
        source: input
        description: "Marketing title of the course."
      - name: list_price_cents
        type: integer
        source: input
        description: "Full sticker price of the course in integer cents."
        constraints: ">= 0"
      - name: baseline_scale_max
        type: integer
        source: input
        description: "Maximum points on this exam's scale (e.g. SAT 1600, ACT 36, MCAT 528, LSAT 180); used to validate diagnostic/practice scores."
        constraints: "> 0"
      - name: guarantee_min_delta
        type: integer
        source: input
        description: "Score-point improvement the course guarantees over the diagnostic baseline; basis for the higher-score-or-refund policy."
        constraints: ">= 0"
      - name: required_practice_tests
        type: integer
        source: input
        description: "Number of COMPLETED practice tests a student must finish to keep guarantee eligibility."
        constraints: ">= 0"
      - name: required_attendance_pct
        type: number
        source: input
        description: "Minimum attendance fraction (0..1) required for guarantee eligibility on LIVE/ONLINE cohorts; ignored for SELF."
        constraints: "0.0 <= x <= 1.0"
      - name: materials_access_days
        type: integer
        source: input
        description: "Number of days after enrollment activation that materials remain accessible."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Catalog lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, PUBLISHED, RETIRED}"

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Instructor display name."
      - name: certified_exam_types
        type: array
        source: input
        description: "Exam types this instructor is certified to teach; each element one of {SAT, ACT, MCAT, LSAT}."
        constraints: "non-empty array of exam-type enums"
      - name: max_concurrent_cohorts
        type: integer
        source: input
        description: "Cap on the number of cohorts in non-terminal lifecycle states this instructor may be assigned to at once."
        constraints: ">= 1"
      - name: active_cohort_count
        type: integer
        source: computed
        description: "Count of cohorts with status IN {SCHEDULED, IN_SESSION} to which this instructor is currently assigned."
        default: 0

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the catalog course this cohort runs."
      - name: instructor_id
        type: string
        source: system
        description: "FK -> Instructor.id; assigned at scheduling time, null until assigned."
        default: null
      - name: seat_capacity
        type: integer
        source: input
        description: "Total seats in this cohort (committed enrollments may not exceed this)."
        constraints: ">= 1"
      - name: seats_committed
        type: integer
        source: computed
        description: "Count of Enrollment rows for this cohort with status IN {ACTIVE, COMPLETED}; never exceeds seat_capacity."
        default: 0
      - name: starts_at
        type: datetime
        source: input
        description: "Cohort session-window start (inclusive)."
      - name: ends_at
        type: datetime
        source: input
        description: "Cohort session-window end (exclusive)."
        constraints: "must be strictly after starts_at"
      - name: total_sessions
        type: integer
        source: input
        description: "Number of class sessions in this cohort; attendance percentage is sessions_attended / total_sessions."
        constraints: ">= 1; SELF-format cohorts use total_sessions = 1"
      - name: status
        type: enum
        source: system
        description: "Cohort lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, SCHEDULED, IN_SESSION, CONCLUDED, CANCELLED}"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique login email."
        constraints: "unique across Student"
      - name: full_name
        type: string
        source: input
        description: "Student display name."
      - name: diagnostic_score
        type: integer
        source: system
        description: "Baseline diagnostic score recorded by the first DIAGNOSTIC PracticeAttempt scored against this student's active enrollment; null until a diagnostic is scored."
        default: null

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the enrolling student."
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; the cohort the student enrolls into."
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle state."
        default: "PENDING_PAYMENT"
        constraints: "one of {PENDING_PAYMENT, ACTIVE, WAITLISTED, COMPLETED, CANCELLED}"
      - name: price_paid_cents
        type: integer
        source: computed
        description: "Net price charged for this enrollment after any coupon; copied from the Course list price minus discount at creation."
        default: 0
      - name: completed_practice_count
        type: integer
        source: computed
        description: "Count of this enrollment's PracticeAttempt rows with status COMPLETED and attempt_type = PRACTICE."
        default: 0
      - name: sessions_attended
        type: integer
        source: input
        description: "Number of cohort sessions the student attended; recorded by the instructor, used in attendance-percentage gating."
        default: 0
      - name: best_practice_score
        type: integer
        source: computed
        description: "Maximum scaled_score over this enrollment's COMPLETED PRACTICE attempts; null if none."
        default: null
      - name: guarantee_status
        type: enum
        source: system
        description: "Tracks score-improvement guarantee eligibility for this enrollment."
        default: "PENDING"
        constraints: "one of {PENDING, ELIGIBLE, INELIGIBLE, REFUND_ISSUED, RETAKE_GRANTED}"
      - name: materials_expire_at
        type: datetime
        source: computed
        description: "Activation timestamp plus Course.materials_access_days; materials access is denied at or after this instant."
        default: null
      - name: waitlist_seq
        type: integer
        source: computed
        description: "Position assigned when WAITLISTED (created_at order among waitlisted peers); null when not waitlisted."
        default: null

  - name: PracticeAttempt
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this attempt belongs to."
      - name: attempt_type
        type: enum
        source: input
        description: "Whether this is the baseline diagnostic or a scored practice test."
        constraints: "one of {DIAGNOSTIC, PRACTICE}"
      - name: raw_correct
        type: integer
        source: input
        description: "Number of correct items on the attempt."
        constraints: ">= 0 and <= total_items"
      - name: total_items
        type: integer
        source: input
        description: "Total items on the attempt."
        constraints: ">= 1"
      - name: scaled_score
        type: integer
        source: computed
        description: "Score on the exam scale, computed from raw_correct/total_items and the Course baseline_scale_max."
      - name: percentile
        type: number
        source: computed
        description: "Analytics percentile (0..100) of scaled_score relative to baseline_scale_max."
      - name: status
        type: enum
        source: system
        description: "Attempt scoring state."
        default: "STARTED"
        constraints: "one of {STARTED, COMPLETED, VOIDED}"

  - name: InstallmentPlan
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being financed."
      - name: num_installments
        type: integer
        source: input
        description: "Number of equal-ish installments the price is split into."
        constraints: "one of {1, 2, 3, 4, 6, 12}"
      - name: total_financed_cents
        type: integer
        source: computed
        description: "Enrollment.price_paid_cents at plan creation; the amount split across installments."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Running sum of SUCCEEDED installment payments in cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Financing lifecycle state."
        default: "OPEN"
        constraints: "one of {OPEN, PAID_IN_FULL, DEFAULTED, REFUNDED}"

  - name: GuaranteeClaim
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment whose guarantee is claimed."
      - name: resolution
        type: enum
        source: input
        description: "Student's requested remedy when filing the claim."
        constraints: "one of {REFUND, RETAKE}"
      - name: improvement_delta
        type: integer
        source: computed
        description: "Score improvement (best_practice_score - diagnostic_score) recorded at claim filing."
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Refund owed if resolution = REFUND and the claim is approved; 0 otherwise."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state."
        default: "FILED"
        constraints: "one of {FILED, UNDER_REVIEW, APPROVED, REJECTED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Cohort
    initial_state: DRAFT
    terminal_states: [CONCLUDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /cohorts/{id}/schedule"
        actor: Registrar
        preconditions:
          - "Cohort.status == DRAFT"
          - "instructor_id in body references an Instructor whose certified_exam_types contains the parent Course.exam_type (ERR_INSTRUCTOR_NOT_CERTIFIED)"
          - "the referenced Instructor.active_cohort_count < Instructor.max_concurrent_cohorts (ERR_INSTRUCTOR_OVERLOADED)"
          - "the referenced Instructor has no other cohort in {SCHEDULED, IN_SESSION} whose [starts_at, ends_at) interval overlaps this cohort's [starts_at, ends_at) (ERR_INSTRUCTOR_TIME_CONFLICT)"
          - "parent Course.status == PUBLISHED (ERR_COURSE_NOT_PUBLISHED)"
        side_effects:
          - "set Cohort.instructor_id = body.instructor_id"
          - "increment the assigned Instructor.active_cohort_count by 1 (Instructor.updated_at, Instructor.version bump)"
        note: "Assignment uses the instructor id supplied in the request body; the server does not auto-select."
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /cohorts/{id}/start"
        actor: Registrar
        preconditions:
          - "Cohort.status == SCHEDULED"
          - "logical clock current_utc >= Cohort.starts_at (ERR_COHORT_WINDOW_NOT_OPEN)"
        side_effects:
          - "no enrollment changes; WAITLISTED enrollments remain waitlisted"
      - from: IN_SESSION
        to: CONCLUDED
        trigger: "POST /cohorts/{id}/conclude"
        actor: Registrar
        preconditions:
          - "Cohort.status == IN_SESSION"
          - "logical clock current_utc >= Cohort.ends_at (ERR_COHORT_WINDOW_NOT_OPEN)"
        side_effects:
          - "for each ACTIVE Enrollment on this cohort: transition Enrollment ACTIVE -> COMPLETED (each completion evaluates guarantee eligibility; see Enrollment ACTIVE->COMPLETED)"
          - "decrement the assigned Instructor.active_cohort_count by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cohorts/{id}/cancel"
        actor: Registrar
        preconditions:
          - "Cohort.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "cascade: for each Enrollment on this cohort with status IN {ACTIVE, WAITLISTED, PENDING_PAYMENT}, transition it to CANCELLED (Enrollment -> CANCELLED side-effects fire per enrollment, including seat release and waitlist promotion)"
          - "if instructor_id is set, decrement that Instructor.active_cohort_count by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cohorts/{id}/cancel"
        actor: Registrar
        preconditions:
          - "Cohort.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "no enrollments exist on a DRAFT cohort; no cascade"

  - entity: Enrollment
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /enrollments (seat available path) — created directly ACTIVE only when financing settled; see note"
        actor: system
        preconditions:
          - "set by POST /enrollments/{id}/activate after first installment SUCCEEDED"
        side_effects:
          - "set Enrollment.materials_expire_at = current_utc + Course.materials_access_days (days)"
          - "recompute Cohort.seats_committed"
        note: "Creation lands in PENDING_PAYMENT (seat held) or WAITLISTED; activation requires a settled first installment."
      - from: PENDING_PAYMENT
        to: WAITLISTED
        trigger: "POST /enrollments (no seat path)"
        actor: system
        preconditions:
          - "at creation Cohort.seats_committed + count(PENDING_PAYMENT non-waitlisted holds) >= Cohort.seat_capacity"
          - "no ERR_STUDENT_SCHEDULE_CONFLICT: student holds no non-terminal enrollment in a CLOSED-overlapping cohort window (boundary-touching rejected — see §1.4 priority 17)"
        side_effects:
          - "assign Enrollment.waitlist_seq = 1 + max existing waitlist_seq on this cohort (0 if none)"
        note: "Distinct seat-full path chosen at creation time. Student schedule-conflict (closed-interval) is checked before the seat/waitlist branch."
      - from: WAITLISTED
        to: PENDING_PAYMENT
        trigger: "system: waitlist promotion when a seat frees"
        actor: system
        preconditions:
          - "a committed/holding seat was released on this cohort and this enrollment has the lowest waitlist_seq among WAITLISTED peers"
        side_effects:
          - "clear Enrollment.waitlist_seq (set null)"
          - "promoted enrollment now occupies a held seat awaiting payment"
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: Registrar
        preconditions:
          - "Enrollment.status == PENDING_PAYMENT"
          - "an InstallmentPlan exists for this enrollment with amount_paid_cents >= first-installment amount (ERR_PAYMENT_NOT_SETTLED)"
          - "parent Cohort.status IN {SCHEDULED, IN_SESSION} (ERR_COHORT_NOT_ENROLLABLE)"
          - "Cohort.seats_committed < Cohort.seat_capacity (ERR_COHORT_FULL)"
        side_effects:
          - "set Enrollment.materials_expire_at = current_utc + Course.materials_access_days days"
          - "recompute parent Cohort.seats_committed (+1)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: parent Cohort IN_SESSION -> CONCLUDED cascade"
        actor: system
        preconditions:
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "evaluate guarantee: compute attendance_pct and improvement; set Enrollment.guarantee_status = ELIGIBLE if guarantee failed AND prerequisites met, else INELIGIBLE (see calc score_improvement_guarantee_eligibility)"
          - "Cohort.seats_committed unchanged (COMPLETED still counts as committed)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Student
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "expected_cohort_version in body equals current parent Cohort.version (ERR_STALE_VERSION)"
        side_effects:
          - "recompute parent Cohort.seats_committed (-1, seat released)"
          - "cascade A: promote the lowest-waitlist_seq WAITLISTED enrollment on this cohort to PENDING_PAYMENT (WAITLISTED -> PENDING_PAYMENT)"
          - "cascade B: if this enrollment has an OPEN InstallmentPlan, that plan transitions OPEN -> REFUNDED, which itself sets the plan's refund and (see InstallmentPlan OPEN->REFUNDED) marks linked installments reversed"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Student
        preconditions:
          - "Enrollment.status == WAITLISTED"
          - "expected_cohort_version in body equals current parent Cohort.version (ERR_STALE_VERSION)"
        side_effects:
          - "clear Enrollment.waitlist_seq; no seat to release; no promotion"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Student
        preconditions:
          - "Enrollment.status == PENDING_PAYMENT"
          - "expected_cohort_version in body equals current parent Cohort.version (ERR_STALE_VERSION)"
        side_effects:
          - "release the held seat; recompute Cohort.seats_committed"
          - "promote the lowest-waitlist_seq WAITLISTED enrollment to PENDING_PAYMENT if any"

  - entity: PracticeAttempt
    initial_state: STARTED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: STARTED
        to: COMPLETED
        trigger: "POST /practice-attempts/{id}/score"
        actor: Instructor
        preconditions:
          - "PracticeAttempt.status == STARTED"
          - "raw_correct <= total_items (ERR_SCORE_OUT_OF_RANGE)"
          - "parent Enrollment.status IN {ACTIVE, COMPLETED} (ERR_ENROLLMENT_NOT_SCORABLE)"
        side_effects:
          - "compute scaled_score and percentile (see calc practice_test_scaled_score)"
          - "if attempt_type == DIAGNOSTIC and Student.diagnostic_score is null: set Student.diagnostic_score = scaled_score"
          - "if attempt_type == PRACTICE: recompute Enrollment.completed_practice_count and Enrollment.best_practice_score"
      - from: STARTED
        to: VOIDED
        trigger: "POST /practice-attempts/{id}/void"
        actor: Instructor
        preconditions:
          - "PracticeAttempt.status == STARTED"
        side_effects:
          - "attempt excluded from all analytics; no score recorded"

  - entity: InstallmentPlan
    initial_state: OPEN
    terminal_states: [PAID_IN_FULL, DEFAULTED, REFUNDED]
    transitions:
      - from: OPEN
        to: PAID_IN_FULL
        trigger: "system: POST /installment-plans/{id}/payments brings amount_paid_cents == total_financed_cents"
        actor: Registrar
        preconditions:
          - "InstallmentPlan.status == OPEN"
          - "the recorded payment makes amount_paid_cents == total_financed_cents"
        side_effects:
          - "set InstallmentPlan.status = PAID_IN_FULL"
      - from: OPEN
        to: DEFAULTED
        trigger: "POST /installment-plans/{id}/default"
        actor: Registrar
        preconditions:
          - "InstallmentPlan.status == OPEN"
          - "logical clock current_utc is past a missed installment due date (operator-asserted) and amount_paid_cents < total_financed_cents"
        side_effects:
          - "cascade: parent Enrollment, if ACTIVE or PENDING_PAYMENT, transitions to CANCELLED (which itself releases seat + promotes waitlist)"
      - from: OPEN
        to: REFUNDED
        trigger: "system: parent Enrollment -> CANCELLED cascade, or GuaranteeClaim REFUND approval"
        actor: system
        preconditions:
          - "InstallmentPlan.status == OPEN"
        side_effects:
          - "set InstallmentPlan.status = REFUNDED; refund_amount equals amount_paid_cents (conserved: money returned == money collected)"

  - entity: GuaranteeClaim
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /guarantee-claims/{id}/review"
        actor: Registrar
        preconditions:
          - "GuaranteeClaim.status == FILED"
          - "parent Enrollment.guarantee_status == ELIGIBLE (ERR_GUARANTEE_NOT_ELIGIBLE)"
        side_effects:
          - "compute GuaranteeClaim.improvement_delta = Enrollment.best_practice_score - Student.diagnostic_score"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /guarantee-claims/{id}/approve"
        actor: Registrar
        preconditions:
          - "GuaranteeClaim.status == UNDER_REVIEW"
          - "GuaranteeClaim.improvement_delta < parent Course.guarantee_min_delta (ERR_GUARANTEE_THRESHOLD_MET)"
        side_effects:
          - "branch REFUND: if resolution == REFUND -> set refund_amount_cents per calc guarantee_refund_amount; set parent Enrollment.guarantee_status = REFUND_ISSUED; cascade the enrollment's OPEN InstallmentPlan OPEN -> REFUNDED"
          - "branch RETAKE: if resolution == RETAKE -> set parent Enrollment.guarantee_status = RETAKE_GRANTED; refund_amount_cents stays 0; extend Enrollment.materials_expire_at by Course.materials_access_days days"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /guarantee-claims/{id}/reject"
        actor: Registrar
        preconditions:
          - "GuaranteeClaim.status == UNDER_REVIEW"
        side_effects:
          - "set parent Enrollment.guarantee_status = INELIGIBLE; no refund, no retake"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-cohort
    parent_entity: Cohort
    write_endpoint: "POST /enrollments"
    occ_field: "expected_cohort_version"
    description: |
      Creating an Enrollment against a Cohort whose version has advanced since
      the client last observed it is rejected with a stale-version error. A new
      enrollment legitimately claims one of the finite seats (or a waitlist slot),
      which advances Cohort.version; a second create still carrying the prior
      observed version is operating on a stale view of remaining seats and is
      rejected. This is the CREATE-with-supersede case: under natural product
      semantics both creates would succeed on identical state, so the conflict
      cannot be reduced to a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: practice_test_scaled_score
    trigger: "PracticeAttempt STARTED -> COMPLETED (POST /practice-attempts/{id}/score)"
    algorithm: weighted_scoring
    formula: |
      ratio = raw_correct / total_items            # exact rational, not pre-rounded
      raw_scaled = ratio * Course.baseline_scale_max
      scaled_score = round_half_up(raw_scaled, 0)  # integer points on the exam scale
      # percentile is a separate analytics figure (see percentile variant)
      percentile = round_half_up( (scaled_score / Course.baseline_scale_max) * 100 , 1)
    input_set: "single PracticeAttempt's raw_correct and total_items; Course.baseline_scale_max from the cohort's course"
    constants:
      PERCENTILE_SCALE: 100
    precision: "scaled_score: integer, round_half_up; percentile: 1 decimal place, round_half_up"
    variants:
      - name: scaled_score_rounding
        when: "always when scoring"
        difference: "ratio*scale is rounded ONCE to integer; do NOT round ratio first then multiply (that produces a different integer at boundaries like raw_correct/total_items = 0.5 on an odd scale)."
      - name: voided_excluded
        when: "attempt later VOIDED"
        difference: "a VOIDED attempt's scaled_score is excluded from best_practice_score and completed_practice_count even though it was computed."

  - name: enrollment_net_price
    trigger: "Enrollment creation (POST /enrollments)"
    algorithm: tiered_pricing
    formula: |
      base = Course.list_price_cents
      # coupon_code optional; discount selected by tier on base, applied before installment split
      if coupon_code == "EARLYBIRD": discount = round_half_up(base * 0.15, 0)
      elif coupon_code == "REFER50":  discount = 5000          # flat 5000 cents
      elif coupon_code is null:       discount = 0
      else: ERR_INVALID_COUPON
      price_paid_cents = max(base - discount, 0)
    input_set: "single Course list price + optional coupon_code"
    constants:
      EARLYBIRD_PCT: 0.15
      REFER50_FLAT_CENTS: 5000
    precision: "integer cents, round_half_up on percentage discount"
    variants:
      - name: percentage_coupon
        when: "coupon_code == EARLYBIRD"
        difference: "discount is 15% of list price, rounded to whole cents."
      - name: flat_coupon
        when: "coupon_code == REFER50"
        difference: "discount is a fixed 5000 cents regardless of list price; floor at 0."

  - name: installment_schedule
    trigger: "InstallmentPlan creation (POST /installment-plans)"
    algorithm: waterfall_allocation
    formula: |
      N = num_installments
      total = total_financed_cents          # = Enrollment.price_paid_cents at plan creation
      base_each = floor(total / N)           # integer-cent floor per installment
      remainder = total - base_each * N      # cents that don't divide evenly (0 <= remainder < N)
      # remainder cents are allocated ONE cent each to the EARLIEST installments by index ascending
      installment_amount[i] = base_each + (1 if i < remainder else 0)   # i in 0..N-1
      # invariant: sum(installment_amount) == total  (no cents created or lost)
    input_set: "single InstallmentPlan's total_financed_cents and num_installments"
    constants: {}
    precision: "integer cents; remainder allocated low-index-first (earliest installments absorb the extra cent)"
    variants:
      - name: even_split
        when: "total divisible by N"
        difference: "remainder == 0; every installment equal."
      - name: remainder_front_loaded
        when: "total not divisible by N"
        difference: "first `remainder` installments are 1 cent higher than the rest; pinned low-index-first so the schedule is deterministic."

  - name: score_improvement_guarantee_eligibility
    trigger: "Enrollment ACTIVE -> COMPLETED (cohort conclude cascade), and re-checked at GuaranteeClaim FILED -> UNDER_REVIEW"
    algorithm: threshold
    formula: |
      # PREREQUISITES (all must hold or guarantee_status = INELIGIBLE):
      if Cohort.course.format == SELF:
          attendance_ok = true                  # attendance ignored for self-paced
      else:
          attendance_pct = sessions_attended / Cohort.total_sessions
          attendance_ok = attendance_pct >= Course.required_attendance_pct     # >= boundary
      practice_ok = Enrollment.completed_practice_count >= Course.required_practice_tests   # >= boundary
      have_scores = (Student.diagnostic_score is not null) and (Enrollment.best_practice_score is not null)
      # GUARANTEE TEST (improvement must FALL SHORT to be ELIGIBLE for remedy):
      improvement = Enrollment.best_practice_score - Student.diagnostic_score
      guarantee_missed = improvement < Course.guarantee_min_delta     # strict <; meeting the delta exactly is NOT missed
      if attendance_ok and practice_ok and have_scores and guarantee_missed:
          guarantee_status = ELIGIBLE
      else:
          guarantee_status = INELIGIBLE
    input_set: "this Enrollment + its Student.diagnostic_score + COMPLETED PRACTICE attempts; Course thresholds"
    constants: {}
    precision: "integer score points; attendance fraction compared with >= at full float precision"
    variants:
      - name: final_actual_improvement
        when: "evaluated at cohort conclude / claim review"
        difference: "uses best_practice_score over COMPLETED PRACTICE attempts (actual realized best), the authoritative figure for refund decisions."
      - name: provisional_projected_improvement
        when: "read via GET /enrollments/{id}/analytics before conclusion"
        difference: "uses the LATEST COMPLETED practice attempt's scaled_score (most recent, not best) projected against diagnostic, so the projection can differ from the final best-based result and is advisory only."

  - name: guarantee_refund_amount
    trigger: "GuaranteeClaim UNDER_REVIEW -> APPROVED with resolution == REFUND"
    algorithm: aggregation
    formula: |
      # Conserved-quantity refund: returns exactly what the student has paid toward this enrollment.
      plan = the InstallmentPlan for this Enrollment (may be null if paid up front with no plan)
      collected = plan.amount_paid_cents if plan exists else Enrollment.price_paid_cents
      refund_amount_cents = collected            # full refund of collected funds; no partial proration
      # invariant: after approval, money_returned == money_collected for this enrollment
    input_set: "this Enrollment's InstallmentPlan.amount_paid_cents (or price_paid_cents if no plan)"
    constants: {}
    precision: "integer cents; exact, no rounding"
    variants:
      - name: financed_refund
        when: "an InstallmentPlan exists"
        difference: "refund equals plan.amount_paid_cents (what was actually collected so far), which may be less than price_paid_cents if installments remain."
      - name: paid_up_front_refund
        when: "no InstallmentPlan exists"
        difference: "refund equals Enrollment.price_paid_cents (assumed fully paid at activation)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /students/register and GET (public catalog reads)"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7; Student acting on an Enrollment must own it (Enrollment.student_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all role-gated endpoints"
  - priority: 3
    category: existence
    check: "every path/body id resolves to an existing resource, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing ids"
  - priority: 4
    category: validation
    check: "request body well-formed; required fields present; enums in allowed set; numeric types and ranges valid (e.g. seat_capacity >= 1, raw_correct <= total_items)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: validation
    check: "coupon_code, when supplied, is one of {EARLYBIRD, REFER50}"
    error_id: ERR_INVALID_COUPON
    http_status: 422
    applies_to: "POST /enrollments"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_referential
    check: "assigned Instructor.certified_exam_types contains the Course.exam_type"
    error_id: ERR_INSTRUCTOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /cohorts/{id}/schedule"
  - priority: 8
    category: business_temporal
    check: "the assigned instructor has no other {SCHEDULED, IN_SESSION} cohort whose [starts_at, ends_at) HALF-OPEN interval overlaps this cohort's window. Half-open semantics: two windows that merely touch at a boundary (cohortA.ends_at == cohortB.starts_at) do NOT conflict — back-to-back teaching is allowed. Overlap iff (A.starts_at < B.ends_at) AND (B.starts_at < A.ends_at)."
    error_id: ERR_INSTRUCTOR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /cohorts/{id}/schedule"
  - priority: 9
    category: business_constraint
    check: "assigned Instructor.active_cohort_count < Instructor.max_concurrent_cohorts"
    error_id: ERR_INSTRUCTOR_OVERLOADED
    http_status: 409
    applies_to: "POST /cohorts/{id}/schedule"
  - priority: 10
    category: business_temporal
    check: "cohort lifecycle clock gates: start requires current_utc >= starts_at; conclude requires current_utc >= ends_at"
    error_id: ERR_COHORT_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /cohorts/{id}/start, POST /cohorts/{id}/conclude"
  - priority: 11
    category: business_constraint
    check: "guarantee claim approval requires improvement_delta strictly below Course.guarantee_min_delta; if the student met or exceeded the delta the guarantee was satisfied"
    error_id: ERR_GUARANTEE_THRESHOLD_MET
    http_status: 409
    applies_to: "POST /guarantee-claims/{id}/approve"
  - priority: 12
    category: business_constraint
    check: "guarantee claim review requires parent Enrollment.guarantee_status == ELIGIBLE"
    error_id: ERR_GUARANTEE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /guarantee-claims/{id}/review"
  - priority: 13
    category: business_temporal
    check: "materials access denied when logical clock current_utc >= Enrollment.materials_expire_at"
    error_id: ERR_MATERIALS_EXPIRED
    http_status: 403
    applies_to: "GET /enrollments/{id}/materials"
  - priority: 14
    category: business_fiscal
    check: "enrollment activation requires the linked InstallmentPlan's first installment SUCCEEDED (amount_paid_cents >= first installment amount)"
    error_id: ERR_PAYMENT_NOT_SETTLED
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate"
  - priority: 15
    category: business_fiscal
    check: "enrollment activation requires a free committed seat: Cohort.seats_committed < Cohort.seat_capacity"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate"
  - priority: 16
    category: business_constraint
    check: "a Student may not hold two non-terminal (PENDING_PAYMENT, WAITLISTED, ACTIVE, COMPLETED) enrollments in the same Cohort"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 17
    category: business_temporal
    check: "a Student may not enroll into a Cohort whose [starts_at, ends_at) window CLOSED-overlaps (touching endpoints count as a conflict — buffer-inclusive) the window of any other Cohort in which the student already holds a non-terminal {PENDING_PAYMENT, WAITLISTED, ACTIVE} enrollment"
    error_id: ERR_STUDENT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 18
    category: business_constraint
    check: "scaled-score scoring requires raw_correct <= total_items and resulting scaled_score <= Course.baseline_scale_max"
    error_id: ERR_SCORE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /practice-attempts, POST /practice-attempts/{id}/score"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Course catalog ----
  - method: POST
    path: "/courses"
    description: "Create a catalog course (DRAFT)."
    roles: [Registrar]
    code: 201
    input: [exam_type, format, title, list_price_cents, baseline_scale_max, guarantee_min_delta, required_practice_tests, required_attendance_pct, materials_access_days]
    output: Course
    side_effects: ["Course created in DRAFT"]
  - method: POST
    path: "/courses/{id}/publish"
    description: "Publish a DRAFT course so cohorts can be scheduled."
    roles: [Registrar]
    code: 200
    input: []
    output: Course
    side_effects: ["Course.status DRAFT -> PUBLISHED"]
  - method: POST
    path: "/courses/{id}/retire"
    description: "Retire a PUBLISHED course (no new cohorts)."
    roles: [Registrar]
    code: 200
    input: []
    output: Course
    side_effects: ["Course.status PUBLISHED -> RETIRED"]
  - method: GET
    path: "/courses"
    description: "List/filter catalog courses (public)."
    roles: [Anonymous, Student, Instructor, Registrar]
    code: 200
    input: ["exam_type?", "format?", "status?", "limit?", "offset?"]
    output: Course[]
    side_effects: []
  - method: GET
    path: "/courses/{id}"
    description: "Read one course (public)."
    roles: [Anonymous, Student, Instructor, Registrar]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/courses/{id}/cohorts"
    description: "List cohorts for a course (reverse-reach Cohort.course_id)."
    roles: [Anonymous, Student, Instructor, Registrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []

  # ---- Instructors ----
  - method: POST
    path: "/instructors"
    description: "Create an instructor."
    roles: [Registrar]
    code: 201
    input: [full_name, certified_exam_types, max_concurrent_cohorts]
    output: Instructor
    side_effects: ["Instructor created with active_cohort_count = 0"]
  - method: GET
    path: "/instructors/{id}"
    description: "Read one instructor (includes active_cohort_count)."
    roles: [Registrar, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors/{id}/cohorts"
    description: "List cohorts assigned to an instructor (reverse-reach Cohort.instructor_id)."
    roles: [Registrar, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []

  # ---- Cohorts ----
  - method: POST
    path: "/cohorts"
    description: "Create a cohort under a published course (DRAFT, no instructor yet)."
    roles: [Registrar]
    code: 201
    input: [course_id, seat_capacity, starts_at, ends_at, total_sessions]
    output: Cohort
    side_effects: ["Cohort created in DRAFT with seats_committed = 0"]
  - method: GET
    path: "/cohorts/{id}"
    description: "Read one cohort."
    roles: [Anonymous, Student, Instructor, Registrar]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: POST
    path: "/cohorts/{id}/schedule"
    description: "Assign an instructor and move cohort DRAFT -> SCHEDULED."
    roles: [Registrar]
    code: 200
    input: [instructor_id]
    output: Cohort
    side_effects: ["set instructor_id", "Instructor.active_cohort_count +1", "Cohort -> SCHEDULED"]
  - method: POST
    path: "/cohorts/{id}/start"
    description: "Begin a scheduled cohort (SCHEDULED -> IN_SESSION)."
    roles: [Registrar]
    code: 200
    input: []
    output: Cohort
    side_effects: ["Cohort -> IN_SESSION"]
  - method: POST
    path: "/cohorts/{id}/conclude"
    description: "Conclude an in-session cohort; completes ACTIVE enrollments and evaluates guarantees."
    roles: [Registrar]
    code: 200
    input: []
    output: Cohort
    side_effects: ["Cohort -> CONCLUDED", "each ACTIVE Enrollment ACTIVE -> COMPLETED with guarantee eval", "Instructor.active_cohort_count -1"]
  - method: POST
    path: "/cohorts/{id}/cancel"
    description: "Cancel a draft/scheduled cohort; cascades enrollment cancellations."
    roles: [Registrar]
    code: 200
    input: []
    output: Cohort
    side_effects: ["Cohort -> CANCELLED", "cascade cancel enrollments", "Instructor.active_cohort_count -1 if assigned"]
  - method: GET
    path: "/cohorts/{id}/enrollments"
    description: "List enrollments for a cohort (reverse-reach Enrollment.cohort_id)."
    roles: [Registrar, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Students ----
  - method: POST
    path: "/students/register"
    description: "Public student self-registration."
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Student
    side_effects: ["Student created; diagnostic_score null"]
  - method: GET
    path: "/students/{id}"
    description: "Read one student."
    roles: [Student, Registrar]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students/{id}/enrollments"
    description: "List a student's enrollments (reverse-reach Enrollment.student_id)."
    roles: [Student, Registrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Enrollments ----
  - method: POST
    path: "/enrollments"
    description: "Enroll a student into a cohort; claims a seat (PENDING_PAYMENT) or a waitlist slot (WAITLISTED). OCC-guarded on Cohort.version."
    roles: [Student, Registrar]
    code: 201
    input: [student_id, cohort_id, expected_cohort_version, "coupon_code?"]
    output: Enrollment
    side_effects: ["compute price_paid_cents (calc enrollment_net_price)", "seat hold or waitlist_seq assignment", "increments Cohort.version by 1"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Read one enrollment."
    roles: [Student, Instructor, Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate a paid PENDING_PAYMENT enrollment (commits the seat)."
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["Enrollment -> ACTIVE", "set materials_expire_at", "Cohort.seats_committed +1"]
  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Cancel an enrollment; releases seat, promotes waitlist, refunds open plan. OCC-guarded on Cohort.version."
    roles: [Student, Registrar]
    code: 200
    input: [expected_cohort_version]
    output: Enrollment
    side_effects: ["Enrollment -> CANCELLED", "seat release + recompute seats_committed", "waitlist promotion cascade", "OPEN InstallmentPlan -> REFUNDED", "increments Cohort.version by 1"]
  - method: POST
    path: "/enrollments/{id}/attendance"
    description: "Record a student's attended-session count (instructor)."
    roles: [Instructor, Registrar]
    code: 200
    input: [sessions_attended]
    output: Enrollment
    side_effects: ["set Enrollment.sessions_attended"]
  - method: GET
    path: "/enrollments/{id}/analytics"
    description: "Computed read: provisional projected improvement, best/latest practice scores, attendance pct, percentile trend."
    roles: [Student, Instructor, Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments/{id}/materials"
    description: "Access course materials; denied once materials_expire_at has passed."
    roles: [Student, Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments/{id}/practice-attempts"
    description: "List practice attempts for an enrollment (reverse-reach PracticeAttempt.enrollment_id)."
    roles: [Student, Instructor, Registrar]
    code: 200
    input: ["attempt_type?", "status?", "limit?", "offset?"]
    output: PracticeAttempt[]
    side_effects: []
  - method: GET
    path: "/enrollments/{id}/installment-plans"
    description: "List installment plans for an enrollment (reverse-reach InstallmentPlan.enrollment_id)."
    roles: [Student, Registrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallmentPlan[]
    side_effects: []
  - method: GET
    path: "/enrollments/{id}/guarantee-claims"
    description: "List guarantee claims for an enrollment (reverse-reach GuaranteeClaim.enrollment_id)."
    roles: [Student, Registrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GuaranteeClaim[]
    side_effects: []

  # ---- Practice attempts ----
  - method: POST
    path: "/practice-attempts"
    description: "Start a diagnostic or practice attempt for an enrollment (STARTED)."
    roles: [Student, Instructor]
    code: 201
    input: [enrollment_id, attempt_type, raw_correct, total_items]
    output: PracticeAttempt
    side_effects: ["PracticeAttempt created STARTED"]
  - method: GET
    path: "/practice-attempts/{id}"
    description: "Read one practice attempt."
    roles: [Student, Instructor, Registrar]
    code: 200
    input: []
    output: PracticeAttempt
    side_effects: []
  - method: POST
    path: "/practice-attempts/{id}/score"
    description: "Score a STARTED attempt -> COMPLETED; computes scaled_score/percentile and updates diagnostic/best."
    roles: [Instructor]
    code: 200
    input: []
    output: PracticeAttempt
    side_effects: ["compute scaled_score + percentile", "set Student.diagnostic_score if first DIAGNOSTIC", "recompute Enrollment.best_practice_score + completed_practice_count if PRACTICE"]
  - method: POST
    path: "/practice-attempts/{id}/void"
    description: "Void a STARTED attempt; excluded from analytics."
    roles: [Instructor]
    code: 200
    input: []
    output: PracticeAttempt
    side_effects: ["PracticeAttempt -> VOIDED"]

  # ---- Financing ----
  - method: POST
    path: "/installment-plans"
    description: "Create a financing plan for an enrollment; computes the schedule."
    roles: [Student, Registrar]
    code: 201
    input: [enrollment_id, num_installments]
    output: InstallmentPlan
    side_effects: ["compute total_financed_cents + installment schedule (calc installment_schedule)"]
  - method: GET
    path: "/installment-plans/{id}"
    description: "Read one installment plan."
    roles: [Student, Registrar]
    code: 200
    input: []
    output: InstallmentPlan
    side_effects: []
  - method: POST
    path: "/installment-plans/{id}/payments"
    description: "Record a SUCCEEDED installment payment; may close plan PAID_IN_FULL."
    roles: [Registrar]
    code: 200
    input: [amount_cents]
    output: InstallmentPlan
    side_effects: ["amount_paid_cents += amount_cents", "OPEN -> PAID_IN_FULL if amount_paid_cents == total_financed_cents"]
  - method: POST
    path: "/installment-plans/{id}/default"
    description: "Mark an OPEN plan DEFAULTED for a missed installment; cascades enrollment cancellation."
    roles: [Registrar]
    code: 200
    input: []
    output: InstallmentPlan
    side_effects: ["OPEN -> DEFAULTED", "cascade parent Enrollment -> CANCELLED"]

  # ---- Guarantee claims ----
  - method: POST
    path: "/guarantee-claims"
    description: "File a score-improvement guarantee claim for an enrollment."
    roles: [Student, Registrar]
    code: 201
    input: [enrollment_id, resolution]
    output: GuaranteeClaim
    side_effects: ["GuaranteeClaim created FILED"]
  - method: GET
    path: "/guarantee-claims/{id}"
    description: "Read one guarantee claim."
    roles: [Student, Registrar]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []
  - method: POST
    path: "/guarantee-claims/{id}/review"
    description: "Move FILED -> UNDER_REVIEW; computes improvement_delta; requires enrollment ELIGIBLE."
    roles: [Registrar]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["compute improvement_delta", "GuaranteeClaim -> UNDER_REVIEW"]
  - method: POST
    path: "/guarantee-claims/{id}/approve"
    description: "Approve a claim; branches REFUND vs RETAKE."
    roles: [Registrar]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["GuaranteeClaim -> APPROVED", "REFUND branch: set refund_amount, Enrollment.guarantee_status REFUND_ISSUED, cascade InstallmentPlan -> REFUNDED", "RETAKE branch: Enrollment.guarantee_status RETAKE_GRANTED, extend materials_expire_at"]
  - method: POST
    path: "/guarantee-claims/{id}/reject"
    description: "Reject a claim under review."
    roles: [Registrar]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["GuaranteeClaim -> REJECTED", "Enrollment.guarantee_status -> INELIGIBLE"]

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All deadline/window/expiry rules read this clock."
    roles: [Registrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock current_utc := to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or Student acting on an enrollment it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, bad enum, numeric out of declared range"
  - id: ERR_INVALID_COUPON
    http: 422
    condition: "coupon_code not in {EARLYBIRD, REFER50}"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_COURSE_NOT_PUBLISHED
    http: 409
    condition: "scheduling a cohort whose course is not PUBLISHED"
  - id: ERR_INSTRUCTOR_NOT_CERTIFIED
    http: 409
    condition: "assigned instructor not certified for the course exam_type"
  - id: ERR_INSTRUCTOR_TIME_CONFLICT
    http: 409
    condition: "assigned instructor already booked on an overlapping cohort window"
  - id: ERR_INSTRUCTOR_OVERLOADED
    http: 409
    condition: "assigned instructor at max_concurrent_cohorts"
  - id: ERR_COHORT_WINDOW_NOT_OPEN
    http: 409
    condition: "start before starts_at, or conclude before ends_at, per logical clock"
  - id: ERR_COHORT_NOT_ENROLLABLE
    http: 409
    condition: "activating into a cohort not in {SCHEDULED, IN_SESSION}"
  - id: ERR_COHORT_FULL
    http: 409
    condition: "activation would push seats_committed beyond seat_capacity"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "student already has a non-terminal enrollment in this cohort"
  - id: ERR_STUDENT_SCHEDULE_CONFLICT
    http: 409
    condition: "student already enrolled in another cohort whose session window closed-overlaps (boundary-touching included) the target cohort window"
  - id: ERR_PAYMENT_NOT_SETTLED
    http: 409
    condition: "activation attempted before the first installment SUCCEEDED"
  - id: ERR_ENROLLMENT_NOT_SCORABLE
    http: 409
    condition: "scoring a practice attempt whose enrollment is not ACTIVE or COMPLETED"
  - id: ERR_SCORE_OUT_OF_RANGE
    http: 422
    condition: "raw_correct > total_items or scaled_score exceeds baseline_scale_max"
  - id: ERR_MATERIALS_EXPIRED
    http: 403
    condition: "materials access at/after materials_expire_at"
  - id: ERR_GUARANTEE_NOT_ELIGIBLE
    http: 409
    condition: "reviewing a claim whose enrollment guarantee_status != ELIGIBLE"
  - id: ERR_GUARANTEE_THRESHOLD_MET
    http: 409
    condition: "approving a claim where improvement_delta >= Course.guarantee_min_delta (guarantee was satisfied)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_cohort_version does not match current Cohort.version on enrollment create/cancel"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public; reads catalog and self-registers as a student."
    identity: "opaque"
    exclusive_operations:
      - "POST /students/register"
    shared_operations:
      - "GET /courses"
      - "GET /courses/{id}"
      - "GET /courses/{id}/cohorts"
      - "GET /cohorts/{id}"
  - name: Student
    description: "A registered learner who enrolls, takes practice tests, finances, and files guarantee claims for own enrollments."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/cancel"
      - "GET /enrollments/{id}"
      - "GET /enrollments/{id}/analytics"
      - "GET /enrollments/{id}/materials"
      - "GET /enrollments/{id}/practice-attempts"
      - "GET /enrollments/{id}/installment-plans"
      - "GET /enrollments/{id}/guarantee-claims"
