            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "RESIDENT", service_date: "2026-08-10", meal_period: "DINNER", resident_id: "${r_id}" }
              as: SatelliteKitchenLead
              captures: { susp_error: $.data.error_id, susp_message: $.data.message }
          assert:
            - "${posture_initial} == COMPLIANT"
            - "${log1_in_range} == false and ${log1_seq} == 1 and ${log2_seq} == 2"
            - "${posture_watch} == WATCH and ${count_watch} == 2"
            - "${guest_error} == ERR_VENUE_POSTURE_RESTRICTED with HTTP 409"
            - "${res_ticket_amount} == 650 (RESIDENT LUNCH passes at WATCH)"
            - "${log3_seq} == 3, ${posture_susp} == SUSPENDED and ${count_susp} == 3"
            - "${susp_error} == ERR_VENUE_SERVICE_SUSPENDED with HTTP 409 (priority 12 outranks the WATCH-only rule)"
            - "Resident.${r_id}.guest_meal_charge_balance_cents == 0 (the refused GUEST ticket never existed)"

