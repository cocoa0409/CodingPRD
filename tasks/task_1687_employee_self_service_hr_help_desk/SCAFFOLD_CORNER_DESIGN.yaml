            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "DWIN", name: "Defl Win", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "Win Doc", body: "b", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-2" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E205", full_name: "W One", email: "w1@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e1: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E206", full_name: "W Two", email: "w2@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e2: $.data.id } }
            - { call: "POST /hr-helpdesk/article-views", payload: { article_id: "${art_id}" }, as: Employee, as_user_id: "${e1}", captures: { v1: $.data.id } }
            - { call: "POST /hr-helpdesk/article-views", payload: { article_id: "${art_id}" }, as: Employee, as_user_id: "${e2}", captures: { v2: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${e1}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${e1}", captures: { t1: $.data.id, t1_src: $.data.source_article_id } }
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:01:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${e2}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${e2}", captures: { t2: $.data.id } }
            - { call: "GET /hr-helpdesk/article-views", payload: { article_id: "${art_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "t1_src == ${art_id}  (viewed exactly 60 minutes before creation: inclusive)"
            - "Ticket.${t2}.source_article_id == null  (61 minutes: outside the window)"
            - "ArticleView.${v1}.deflection_outcome == TICKET_CREATED and ArticleView.${v2}.deflection_outcome == NONE"
      - name: surge_multiplier_extends_deadline
        claim_type: conditional_calculation
        grounds: [calculations.sla_deadline_calculation, entities.StaffingWindow.fields.sla_multiplier]
        distinguishing_aspect: "Seasonal coupling: an ACTIVE staffing window on the category's specialist team multiplies base SLA minutes (ceil(240 x 1.5) = 360), pushing the resolution due from 04:00 to 06:00 for a ticket created during the window."
        test_recipe:
          setup: ["team T; window on T spanning 2026-07-31..2026-08-31 with sla_multiplier 1.5 (ACTIVE at the default clock 2026-08-01); category CAT -> T with wall policy 60/240; employee E"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Surge Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "OE Surge", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-31T00:00:00Z", required_t1_hours: 0, required_t2_hours: 0, sla_multiplier: 1.5 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w_id: $.data.id, w_status: $.data.status } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SRG", name: "Surge Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E207", full_name: "Surge Sam", email: "surge@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
          assert:
            - "w_status == ACTIVE  (window_start predates the default clock: ACTIVE at creation)"
            - "Ticket.${t_id}.first_response_due_at == 2026-08-01T01:30:00Z  (ceil(60 x 1.5) = 90)"
            - "Ticket.${t_id}.resolution_due_at == 2026-08-01T06:00:00Z  (ceil(240 x 1.5) = 360)"
      - name: breached_response_sticky_after_late_respond
        claim_type: threshold_stickiness
        grounds: [calculations.sla_clock_evaluation, state_machines.Ticket.sla_status]
        distinguishing_aspect: "Once now > first_response_due_at with no response, sla_status latches BREACHED_RESPONSE; a late respond sets first_responded_at but does NOT heal the breach."
        test_recipe:
          setup: ["category CAT wall policy first_response 60 / resolution 4800; ticket created 2026-08-01T00:00 and triaged by agent A; clock advanced to 01:01"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "BR Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "br@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "BR", name: "Breach", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 4800 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E208", full_name: "Bre Ach", email: "bre@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/triage", payload: { }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:01:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { sla_pre: $.data.sla_status } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/respond", payload: { body: "working on it" }, as: HelpDeskAgent, as_user_id: "${ag_id}", captures: { sla_post: $.data.sla_status, fr_at: $.data.first_responded_at } }
          assert:
            - "sla_pre == BREACHED_RESPONSE"
            - "fr_at == 2026-08-01T01:01:00Z"
            - "sla_post == BREACHED_RESPONSE  (breach is sticky; responding late does not heal it)"

  # ====================================================== 4. Validations
  - section: validations
    instances:
      - name: ticket_create_missing_required_field
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Schema validation precedes existence: a ticket create missing subject fails with ERR_VALIDATION even though its category_id is a nonexistent UUID."
        test_recipe:
          setup: ["employee E exists; no category lookup can succeed for the bogus id used"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E301", full_name: "Val Ida", email: "val@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "00000000-0000-4000-8000-000000000000", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_VALIDATION (http 400)  # schema (pri 3) before existence (pri 4)"]
      - name: ticket_create_invalid_enum
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "priority P9 is outside the declared enum -> ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["employee E exists"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E302", full_name: "Enum Emma", email: "emma@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "00000000-0000-4000-8000-000000000000", subject: "s", description: "d", priority: "P9" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_ENUM (http 400)"]
      - name: duplicate_sla_policy_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SLA_POLICY_DUPLICATE]"]
        distinguishing_aspect: "Second SlaPolicy for the same (category_id, priority) pair fails with ERR_SLA_POLICY_DUPLICATE."
        test_recipe:
          setup: ["team, category, existing P3 policy"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "DP Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "DUP", name: "Dup", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240 }, as: HRServicesAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 30, resolution_minutes: 120 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_SLA_POLICY_DUPLICATE (http 409)"]
      - name: duplicate_pending_dcr_same_type_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_DATA_CHANGE_PENDING]"]
        distinguishing_aspect: "One pending ADDRESS DCR per employee: a second ADDRESS create while the first is PENDING_APPROVAL fails with ERR_DUPLICATE_DATA_CHANGE_PENDING (a DIRECT_DEPOSIT would be allowed)."
        test_recipe:
          setup: ["employee E; ADDRESS DCR d1 pending (Employee.version advanced to 2 by the first create)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E303", full_name: "Dup Dcr", email: "dup@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "1 A St", city: "Boise", region: "ID", postal_code: "83701" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { d1: $.data.id } }
            - { call: "GET /hr-helpdesk/employees/${emp_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_v2: $.data.version } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "2 B St", city: "Boise", region: "ID", postal_code: "83702" }, expected_employee_version: "${emp_v2}" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_DUPLICATE_DATA_CHANGE_PENDING (http 409)"]
      - name: fraud_lockout_after_three_failures
        claim_type: threshold_trigger
        grounds: [state_machines.DataChangeRequest.fraud_status, "errors[ERR_FRAUD_EVIDENCE_MISMATCH]", "errors[ERR_FRAUD_VERIFICATION_LOCKED]"]
        distinguishing_aspect: "Cumulative threshold: three wrong SECURITY_CODE attempts lock the verification and auto-REJECT the DCR; a fourth attempt then fails with ERR_FRAUD_VERIFICATION_LOCKED."
        test_recipe:
          setup: ["employee E; DIRECT_DEPOSIT DCR created (fraud PENDING); challenge code read"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E304", full_name: "Loc Kout", email: "lock@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "987654321", bank_account_type: "CHECKING" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
            - { call: "GET /hr-helpdesk/data-change-requests/${dcr_id}/fraud-verifications", as: Employee, as_user_id: "${emp_id}", captures: { fv_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "SECURITY_CODE", evidence_code: "BAD000" }, as: Employee, as_user_id: "${emp_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "SECURITY_CODE", evidence_code: "BAD000" }, as: Employee, as_user_id: "${emp_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "SECURITY_CODE", evidence_code: "BAD000" }, as: Employee, as_user_id: "${emp_id}", captures: { err3: $.data.error_id } }
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "SECURITY_CODE", evidence_code: "BAD000" }, as: Employee, as_user_id: "${emp_id}", captures: { err4: $.data.error_id } }
            - { call: "GET /hr-helpdesk/data-change-requests/${dcr_id}", as: HRDataSteward, as_user_id: "steward-1" }
          assert:
            - "err1 == err2 == err3 == ERR_FRAUD_EVIDENCE_MISMATCH (422)"
            - "err4 == ERR_FRAUD_VERIFICATION_LOCKED (409)"
            - "DataChangeRequest.${dcr_id}.approval_status == REJECTED and fraud_status == LOCKED"
            - "FraudVerification.${fv_id}.attempts == 3 and status == LOCKED"
      - name: approve_pending_verification_fraud_required
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_FRAUD_VERIFICATION_REQUIRED]", state_machines.DataChangeRequest.approval_status]
        distinguishing_aspect: "Approving a DCR still in PENDING_VERIFICATION is a business_safety rejection (ERR_FRAUD_VERIFICATION_REQUIRED), not a generic state error — the approve transition accepts PENDING_VERIFICATION at the state layer so the fraud gate can fire."
        test_recipe:
          setup: ["employee E; DIRECT_DEPOSIT DCR pending verification (fraud PENDING)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E305", full_name: "Gate Gina", email: "gina@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "555555555", bank_account_type: "SAVINGS" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/approve", payload: { }, as: HRDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FRAUD_VERIFICATION_REQUIRED (http 409); approval_status remains PENDING_VERIFICATION"]
      - name: self_approval_forbidden
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SELF_APPROVAL_FORBIDDEN]"]
        distinguishing_aspect: "SoD: a steward call whose X-User-ID equals the DCR's employee_id fails with ERR_SELF_APPROVAL_FORBIDDEN even though the role is allowed."
        test_recipe:
          setup: ["employee E; ADDRESS DCR in PENDING_APPROVAL (fraud NOT_REQUIRED)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E306", full_name: "Self Approve", email: "self@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "3 C St", city: "Reno", region: "NV", postal_code: "89501" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/approve", payload: { }, as: HRDataSteward, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_SELF_APPROVAL_FORBIDDEN (http 403)"]
      - name: verifier_cannot_approve
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_VERIFIER_CANNOT_APPROVE]", entities.FraudVerification.fields.verified_by_user_id]
        distinguishing_aspect: "SoD chain across entities: the manager who satisfied MANAGER_CONFIRMATION (verified_by_user_id = manager's employee id) cannot then approve the same DCR — ERR_VERIFIER_CANNOT_APPROVE."
        test_recipe:
          setup: ["manager M; employee E with manager_id = M; DIRECT_DEPOSIT DCR by E; verified via MANAGER_CONFIRMATION called by M (approval now PENDING_APPROVAL, fraud VERIFIED)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E307", full_name: "Mgr Mary", email: "mary@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { mgr_id: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E308", full_name: "Emp Ed", email: "ed@x.com", manager_id: "${mgr_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "444444444", bank_account_type: "CHECKING" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "MANAGER_CONFIRMATION" }, as: Employee, as_user_id: "${mgr_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/approve", payload: { }, as: HRDataSteward, as_user_id: "${mgr_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_VERIFIER_CANNOT_APPROVE (http 403); approval_status remains PENDING_APPROVAL"]
      - name: manager_confirmation_by_non_manager_forbidden
        claim_type: violation_to_error
        grounds: [state_machines.DataChangeRequest.fraud_status, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "MANAGER_CONFIRMATION from a user who is not the employee's manager of record fails with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["manager M; employee E (manager M); unrelated employee O; DIRECT_DEPOSIT DCR by E pending verification"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E309", full_name: "Mgr Mo", email: "mo@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { mgr_id: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E310", full_name: "Emp Eli", email: "eli2@x.com", manager_id: "${mgr_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E311", full_name: "Other Olga", email: "olga@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { other_id: $.data.id } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "333333333", bank_account_type: "SAVINGS" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "MANAGER_CONFIRMATION" }, as: Employee, as_user_id: "${other_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403); fraud_status remains PENDING"]
      - name: shift_outside_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SHIFT_OUTSIDE_WINDOW]"]
        distinguishing_aspect: "A shift starting before its window's window_start (2026-08-02T20:00 vs 2026-08-03T00:00) fails with ERR_SHIFT_OUTSIDE_WINDOW even though it overlaps no other shift."
        test_recipe:
          setup: ["team, T1 agent, PLANNED window 2026-08-03..2026-08-08"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "OW Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "ow@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "W", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-08T00:00:00Z", required_t1_hours: 10, required_t2_hours: 0 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${ag_id}", staffing_window_id: "${w_id}", shift_start: "2026-08-02T20:00:00Z", shift_end: "2026-08-03T02:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_SHIFT_OUTSIDE_WINDOW (http 422)"]
      - name: invalid_time_ranges_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "Both temporal inversions fail with ERR_INVALID_TIME_RANGE: a shift whose end <= start (inside a valid window), and a window whose end < start (on a fresh team so no overlap check fires first)."
        test_recipe:
          setup: ["team T1 with agent A and valid window W; separate team T2 for the bad window"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "TR Team 1" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm1: $.data.id } }
            - { call: "POST /hr-helpdesk/teams", payload: { name: "TR Team 2" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm2: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "tr@x.com", tier: "T1", team_id: "${tm1}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm1}", name: "GoodW", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-08T00:00:00Z", required_t1_hours: 10, required_t2_hours: 0 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${ag_id}", staffing_window_id: "${w_id}", shift_start: "2026-08-03T10:00:00Z", shift_end: "2026-08-03T09:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { err1: $.data.error_id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm2}", name: "BadW", window_start: "2026-08-08T00:00:00Z", window_end: "2026-08-03T00:00:00Z", required_t1_hours: 10, required_t2_hours: 0 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_TIME_RANGE (422)  (shift_end <= shift_start)"
            - "err2 == ERR_INVALID_TIME_RANGE (422)  (window_end < window_start)"
      - name: category_inactive_intake_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_CATEGORY_INACTIVE]"]
        distinguishing_aspect: "Intake into an inactive category fails with ERR_CATEGORY_INACTIVE even though a valid SLA policy row exists (referential usability, not existence)."
        test_recipe:
          setup: ["team; category active:false; P3 policy configured; employee"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "INACT Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "INA", name: "Inactive", specialist_team_id: "${tm_id}", active: false }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E312", full_name: "Ina Ctive", email: "ina@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_CATEGORY_INACTIVE (http 422)"]
      - name: sla_policy_missing_intake_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SLA_POLICY_NOT_FOUND]", calculations.sla_deadline_calculation]
        distinguishing_aspect: "Intake into an active category with NO policy row for (category, P3) fails with ERR_SLA_POLICY_NOT_FOUND — deadline computation has no inputs."
        test_recipe:
          setup: ["team; active category with no SLA policy; employee"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "NOP Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "NOP", name: "No Policy", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E313", full_name: "No Polly", email: "nop@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_SLA_POLICY_NOT_FOUND (http 404); no ticket is persisted"]
      - name: agent_tier_mismatch_assign_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AGENT_TIER_INSUFFICIENT]"]
        distinguishing_aspect: "Assigning a T1-tier ticket to a T2 agent fails with ERR_AGENT_TIER_INSUFFICIENT (assignee.tier must equal ticket.tier)."
        test_recipe:
          setup: ["team; T2 agent SP (capacity default 10); category+policy; employee; ticket NEW at tier T1"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "TIER Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "SP", email: "tier@x.com", tier: "T2", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { sp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "TIR", name: "Tier", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E314", full_name: "Tia Tier", email: "tia@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${sp_id}", expected_ticket_version: "${t_v}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_AGENT_TIER_INSUFFICIENT (http 409); ticket remains NEW and unassigned"]
      - name: capacity_boundary_at_capacity_rejected
        claim_type: boundary_edge
        grounds: ["validations[priority=8]", "errors[ERR_AGENT_AT_CAPACITY]", entities.Agent.fields.assigned_open_count]
        distinguishing_aspect: "Capacity is an inclusive ceiling: with capacity_max 1 and one open assigned ticket, the second assign fails with ERR_AGENT_AT_CAPACITY (assigned_open_count < capacity_max is false at 1 < 1)."
        test_recipe:
          setup: ["team; T1 agent A capacity_max 1; category+policy; employee; tickets t1 (assigned to A) and t2 (NEW)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "CAP Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "cap@x.com", tier: "T1", team_id: "${tm_id}", capacity_max: 1 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "CAP", name: "Cap", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E315", full_name: "Cap City", email: "cap@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t1: $.data.id, t1_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t2: $.data.id, t2_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t1}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t1_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t2}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t2_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_AGENT_AT_CAPACITY (http 409); t2 remains NEW and unassigned"]

  # ====================================================== 5. Endpoints
  - section: endpoints
    instances:
      - name: pagination_defaults_and_bounds
        claim_type: pagination_envelope
        grounds: [response_envelope, "endpoints.GET_/hr-helpdesk/ticket-categories"]
        distinguishing_aspect: "Default limit 10 applies when no params are given (11 rows -> 10 returned, total_count 11, has_more true); limit=5&offset=10 returns the single tail row with has_more false."
        test_recipe:
          setup: ["team T; 11 categories C01..C11 routed to T"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Pg Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C01", name: "c01", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C02", name: "c02", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C03", name: "c03", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C04", name: "c04", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C05", name: "c05", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C06", name: "c06", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C07", name: "c07", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C08", name: "c08", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C09", name: "c09", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C10", name: "c10", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "C11", name: "c11", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /hr-helpdesk/ticket-categories", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/ticket-categories", payload: { limit: 5, offset: 10 }, as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "first response: response_type == array, 10 data rows, total_count == 11, has_more == true"
            - "second response: 1 data row, total_count == 11, has_more == false"
            - "meta.api_request_id and meta.api_request_timestamp present on both responses"
      - name: kb_search_employee_sees_published_only
        claim_type: role_scoped_listing
        grounds: ["endpoints.GET_/hr-helpdesk/kb-articles", state_machines.KbArticle]
        distinguishing_aspect: "Employee search returns only PUBLISHED articles (a matching DRAFT is invisible), and a direct GET of the DRAFT by an employee returns ERR_ARTICLE_NOT_FOUND while KnowledgeManager sees both."
        test_recipe:
          setup: ["category CAT; article 'Password Reset' PUBLISHED; article 'Password Policy Internal' DRAFT"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "KBQ Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "KBQ", name: "KB Query", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "Password Reset", body: "b", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_pub: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_pub}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_pub}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-2" }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "Password Policy Internal", body: "b", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_draft: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E401", full_name: "Sea Rch", email: "sea@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "GET /hr-helpdesk/kb-articles", payload: { q: "Password" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /hr-helpdesk/kb-articles/${art_draft}", as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
            - { call: "GET /hr-helpdesk/kb-articles", payload: { q: "Password" }, as: KnowledgeManager, as_user_id: "km-1" }
          assert:
            - "employee search total_count == 1 and the row id == ${art_pub}"
            - "err == ERR_ARTICLE_NOT_FOUND (404) for the DRAFT read"
            - "KnowledgeManager search total_count == 2"
      - name: ticket_list_employee_scope
        claim_type: role_scoped_listing
        grounds: ["endpoints.GET_/hr-helpdesk/tickets", roles.Employee]
        distinguishing_aspect: "Employee-role list is force-scoped to the caller: two employees each own one ticket, and each sees exactly their own."
        test_recipe:
          setup: ["category+policy; employees E1 and E2 each created one ticket"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "SC Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SCO", name: "Scope", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E402", full_name: "One Uno", email: "uno@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e1: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E403", full_name: "Two Dos", email: "dos@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e2: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${e1}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${e2}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${e2}" }
          trigger:
            - { call: "GET /hr-helpdesk/tickets", as: Employee, as_user_id: "${e1}" }
          assert:
            - "total_count == 1 and the single row's employee_id == ${e1}"
      - name: sensitive_ticket_masked_read
        claim_type: confidentiality_masking
        grounds: [entities.Ticket.fields.masked, entities.Ticket.fields.sensitive, "errors[ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED]"]
        distinguishing_aspect: "Confidentiality masking interacts with RBAC: a STANDARD-clearance agent reads a sensitive ticket as 200 with subject '[REDACTED]' and masked true, a SENSITIVE-clearance agent sees full content, and a non-owner employee gets 403."
        test_recipe:
          setup: ["sensitive category SEC (no SENSITIVE agent exists at intake, so the ticket stays unassigned NEW); STANDARD agent STD and SENSITIVE agent SEN created afterwards; second employee E2"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "MSK Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "MSK", name: "Sensitive", is_sensitive: true, specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E404", full_name: "Own Er", email: "own@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e1: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E405", full_name: "Oth Er", email: "oth@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e2: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${e1}", category_id: "${cat_id}", subject: "private matter", description: "details" }, as: Employee, as_user_id: "${e1}", captures: { t_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Std", email: "std@x.com", tier: "T1", team_id: "${tm_id}", clearance: "STANDARD" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { std: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Sen", email: "sen@x.com", tier: "T1", team_id: "${tm_id}", clearance: "SENSITIVE" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { sen: $.data.id } }
          trigger:
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: HelpDeskAgent, as_user_id: "${std}", captures: { m_subj: $.data.subject, m_flag: $.data.masked } }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: SensitiveCaseManager, as_user_id: "${sen}", captures: { s_subj: $.data.subject, s_flag: $.data.masked } }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: Employee, as_user_id: "${e1}", captures: { o_subj: $.data.subject } }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: Employee, as_user_id: "${e2}", captures: { err: $.data.error_id } }
          assert:
            - "m_flag == true and m_subj == [REDACTED]  (STANDARD clearance masked)"
            - "s_flag == false and s_subj == private matter  (SENSITIVE clearance full)"
            - "o_subj == private matter  (owner employee full)"
            - "err == ERR_FORBIDDEN_ROLE (403)  (non-owner employee)"
      - name: sensitive_intake_auto_assigns_cleared_agent
        claim_type: selector_determinism
        grounds: ["endpoints.POST_/hr-helpdesk/tickets", entities.Ticket.fields.assigned_agent_id]
        distinguishing_aspect: "Sensitive-category intake runs the pinned selector (active, SENSITIVE clearance, under capacity; rank assigned_open_count ASC then created_at ASC): with exactly one eligible SENSITIVE agent the ticket is created already assigned, workflow_status still NEW, and the agent's assigned_open_count becomes 1."
        test_recipe:
          setup: ["sensitive category SEC with policy; SENSITIVE agent SEN exists before intake; STANDARD agent STD also exists (must NOT be selected)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "AA Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Std", email: "std2@x.com", tier: "T1", team_id: "${tm_id}", clearance: "STANDARD" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { std: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Sen", email: "sen2@x.com", tier: "T1", team_id: "${tm_id}", clearance: "SENSITIVE" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { sen: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SAA", name: "Sensitive AA", is_sensitive: true, specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E406", full_name: "Auto Assign", email: "aa@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${e1}", category_id: "${cat_id}", subject: "sensitive intake", description: "d" }, as: Employee, as_user_id: "${e1}", captures: { t_id: $.data.id, t_agent: $.data.assigned_agent_id, t_status: $.data.workflow_status } }
            - { call: "GET /hr-helpdesk/agents/${sen}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { sen_load: $.data.assigned_open_count } }
          assert:
            - "t_agent == ${sen}  (the only eligible SENSITIVE agent; the STANDARD agent is never eligible)"
            - "t_status == NEW  (auto-assign does not triage)"
            - "sen_load == 1"
      - name: ticket_events_chronological
        claim_type: side_effect_execution
        grounds: [entities.TicketEvent, "endpoints.GET_/hr-helpdesk/tickets/{id}/events"]
        distinguishing_aspect: "Every transition appends its TicketEvent: create->triage->assign->resolve yields exactly [CREATED, TRIAGED, ASSIGNED, RESOLVED] in chronological order."
        test_recipe:
          setup: ["category+policy+agent+employee; one ticket driven through create, triage, assign, resolve"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "EV Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "ev@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "EV", name: "Events", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E407", full_name: "Ev Ent", email: "ev@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/triage", payload: { }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { t_v2: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t_v2}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "done" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
          trigger:
            - { call: "GET /hr-helpdesk/tickets/${t_id}/events", as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "exactly 4 events; event_type sequence == [CREATED, TRIAGED, ASSIGNED, RESOLVED]"
            - "the ASSIGNED event has from_state TRIAGED and to_state IN_PROGRESS"

  # ====================================================== 6. Errors
  - section: errors
    instances:
      - name: not_found_sweep_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_TICKET_NOT_FOUND]", "errors[ERR_DCR_NOT_FOUND]", "errors[ERR_SURVEY_NOT_FOUND]", "errors[ERR_WINDOW_NOT_FOUND]", "errors[ERR_ARTICLE_NOT_FOUND]", "errors[ERR_EMPLOYEE_NOT_FOUND]", "errors[ERR_AGENT_NOT_FOUND]", "errors[ERR_TEAM_NOT_FOUND]", "errors[ERR_CATEGORY_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET maps an unknown UUID to its domain-specific 404 error id (not a generic 404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hr-helpdesk/tickets/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/data-change-requests/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/surveys/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/staffing-windows/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/kb-articles/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/employees/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/agents/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/teams/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/ticket-categories/00000000-0000-4000-8000-000000000000", as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "responses carry, in order: ERR_TICKET_NOT_FOUND, ERR_DCR_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_ARTICLE_NOT_FOUND, ERR_EMPLOYEE_NOT_FOUND, ERR_AGENT_NOT_FOUND, ERR_TEAM_NOT_FOUND, ERR_CATEGORY_NOT_FOUND (all http 404)"
      - name: list_tickets_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid X-User-Role/X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hr-helpdesk/tickets", as: Anonymous }
          assert: ["error_id == ERR_UNAUTHENTICATED (http 401)"]

  # ====================================================== 7. RBAC
  - section: rbac
    instances:
      - name: employee_cannot_create_team
        claim_type: role_denial
        grounds: [roles.Employee, roles.HRServicesAdmin, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Employee is outside POST /teams roles -> ERR_FORBIDDEN_ROLE (403); the team is not created."
        test_recipe:
          setup: ["employee E exists"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E501", full_name: "Role Rob", email: "rob@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Nope Team" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]
      - name: helpdesk_agent_cannot_publish
        claim_type: role_denial
        grounds: [roles.HelpDeskAgent, roles.KnowledgeManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Publish is KnowledgeManager-exclusive: a HelpDeskAgent (who may author drafts) gets ERR_FORBIDDEN_ROLE at publish — role check (pri 2) precedes the author-SoD check (pri 7)."
        test_recipe:
          setup: ["team; T1 agent A; category; article authored by A and submitted (IN_REVIEW)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "RB Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "rb@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "RB", name: "RB", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "Agent Doc", body: "b", category_id: "${cat_id}" }, as: HelpDeskAgent, as_user_id: "${ag_id}", captures: { art_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/submit-review", payload: { }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/publish", payload: { }, as: HelpDeskAgent, as_user_id: "${ag_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403); article remains IN_REVIEW"]
      - name: steward_cannot_triage
        claim_type: role_denial
        grounds: [roles.HRDataSteward, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "HRDataSteward (DCR approver) has no ticket-workflow authority: triage fails with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["team; category+policy; employee; ticket NEW"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "ST Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "ST", name: "ST", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E502", full_name: "Ste Ward", email: "ste@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/triage", payload: { }, as: HRDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]
      - name: planner_cannot_approve
        claim_type: role_denial
        grounds: [roles.WorkforcePlanner, roles.HRDataSteward, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "WorkforcePlanner (staffing) cannot approve DCRs: approve fails with ERR_FORBIDDEN_ROLE before any DCR state logic."
        test_recipe:
          setup: ["employee E; ADDRESS DCR in PENDING_APPROVAL"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E503", full_name: "Plan Ner", email: "plan@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "4 D St", city: "Tulsa", region: "OK", postal_code: "74101" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/approve", payload: { }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403); approval_status remains PENDING_APPROVAL"]
      - name: specialist_cannot_assign_others
        claim_type: role_denial
        grounds: [roles.SpecialistAgent, "endpoints.POST_/hr-helpdesk/tickets/{id}/assign", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "SpecialistAgent may only self-assign: passing another agent's id as agent_id fails with ERR_FORBIDDEN_ROLE even though the role is on the endpoint."
        test_recipe:
          setup: ["team; T2 agent SP and T1 agent A1; category+policy; ticket NEW (tier T1)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "SA Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "SP", email: "sp2@x.com", tier: "T2", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { sp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A1", email: "a1b@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a1_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SA", name: "SA", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E504", full_name: "Self Assign", email: "sa@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${a1_id}", expected_ticket_version: "${t_v}" }, as: SpecialistAgent, as_user_id: "${sp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403); ticket remains NEW and unassigned"]

  # ====================================== 8. Cross-cutting complexity layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_ticket_assign_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ticket-assign-stale-ticket]", "errors[ERR_STALE_TICKET_VERSION]"]
        distinguishing_aspect: "True OCC race per §1.2.1: a second assign carrying the pre-assign version 1 (while the ticket is now version 2) is rejected with 412 ERR_STALE_TICKET_VERSION even though reassignment is otherwise legitimate."
        test_recipe:
          setup: ["team; T1 agents A1, A2; category+policy; employee; ticket version 1"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "OCC Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A1", email: "o1@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a1: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A2", email: "o2@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a2: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "OCC", name: "OCC", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E601", full_name: "Occ Curre", email: "occ@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "s", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${a1}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${a1}", captures: { t_v2: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${a2}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${a2}", captures: { err: $.data.error_id } }
          assert:
            - "first assign succeeds; t_v2 == ${t_v} + 1"
            - "err == ERR_STALE_TICKET_VERSION (http 412); assigned_agent_id remains ${a1}"
      - name: occ_stale_employee_dcr_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dcr-create-stale-employee]", "errors[ERR_STALE_EMPLOYEE_VERSION]"]
        distinguishing_aspect: "OCC on the Employee parent: after the first DCR create bumps Employee.version (has_pending_dcr flip), a second create carrying the stale version is rejected with 412 ERR_STALE_EMPLOYEE_VERSION."
        test_recipe:
          setup: ["employee E at version 1; one ADDRESS DCR already created (Employee.version now 2)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E602", full_name: "Occ Emp", email: "occe@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "5 E St", city: "Mesa", region: "AZ", postal_code: "85201" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "222222222", bank_account_type: "CHECKING" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_STALE_EMPLOYEE_VERSION (http 412); only DCR ${d1} exists for the employee"]
      - name: open_ticket_count_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.Employee.fields.open_ticket_count]
        distinguishing_aspect: "Derived field stays consistent across create and cancel: two tickets push open_ticket_count to 2; cancelling one (NEW -> CANCELLED) drops it to 1 on the very next read."
        test_recipe:
          setup: ["category+policy; employee E with two NEW tickets"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "REC Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "REC", name: "Rec", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E603", full_name: "Rec Oncile", email: "rec@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t1: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t1}/cancel", payload: { reason: "duplicate" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /hr-helpdesk/employees/${emp_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { open_n: $.data.open_ticket_count } }
          assert: ["open_n == 1  (was 2 after the creates; the CANCELLED ticket leaves the open set)"]
      - name: coaching_threshold_exactly_three_no_hold
        claim_type: rate_threshold_boundary
        grounds: [calculations.csat_rolling_calculation, entities.Agent.fields.coaching_hold]
        distinguishing_aspect: "Strict < boundary: three same-day scores of 3 give recency_weighted_mean exactly 3.00, which is NOT below CSAT_COACHING_THRESHOLD, so coaching_hold stays false and no tickets are released."
        test_recipe:
          setup: ["T1 agent A; category+policy; employee E; three tickets resolved by A at 2026-08-01, surveys submitted with score 3 each"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "THR Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "thr@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "THR", name: "Thr", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E604", full_name: "Thr Esh", email: "thr@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t1: $.data.id, t1_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t2: $.data.id, t2_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t3", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t3: $.data.id, t3_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t1}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t1_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t2}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t2_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t3}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t3_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t1}/resolve", payload: { resolution_summary: "r1" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t2}/resolve", payload: { resolution_summary: "r2" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t3}/resolve", payload: { resolution_summary: "r3" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t1}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s1: "$.data[0].id" } }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t2}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s2: "$.data[0].id" } }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t3}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s3: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s1}/submit", payload: { score: 3 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/surveys/${s2}/submit", payload: { score: 3 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/surveys/${s3}/submit", payload: { score: 3 }, as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "GET /hr-helpdesk/agents/${ag_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { hold: $.data.coaching_hold, csat: $.data.rolling_csat } }
          assert:
            - "csat == 3.0"
            - "hold == false  (3.00 < 3.00 is false; strict inequality)"

  # ============================================== 9. Consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_employee
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Employee]
        excluded_because:
          difficulty_instance: employee_creation_defaults_and_immediate_read
          rationale: "That corner instance already asserts read-after-write visibility (GET immediately after POST returns the stored row with computed defaults) — the immediate-consistency claim."
      - name: ticket_create_response_contains_computed_sla
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Ticket.fields.resolution_due_at]
        excluded_because:
          difficulty_instance: ticket_creation_defaults
          rationale: "The ticket_creation_defaults instance asserts the computed first_response_due_at/resolution_due_at in the POST response body itself — immediate consistency of the deadline calculation."
