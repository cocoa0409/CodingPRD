  # ===========================================================================
  # RULE 3 - non_linear_state_machine
  # Instance 1: Deal - a genuine CYCLE on the status dimension plus a second,
  #             INDEPENDENT credit_status dimension moving on its own.
  # Instance 2: ConditionPrecedent - a different entity, a BRANCHING fork into
  #             three terminal outcomes plus a FAILED -> PENDING cure loop.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deal_negotiation_cycle_with_independent_credit_dimension
        grounds:
          - state_machines.Deal.TERM_SHEET_ISSUED_to_UNDER_NEGOTIATION
          - state_machines.Deal.UNDER_NEGOTIATION_to_TERM_SHEET_ISSUED
          - state_machines.Deal.TERM_SHEET_ISSUED_to_TERMS_AGREED
          - state_machines.Deal.TERMS_AGREED_to_UNDER_NEGOTIATION
          - state_machines.Deal.SUBMITTED_to_DECLINED
          - state_machines.Deal.DECLINED_to_SUBMITTED
          - entities.Deal.fields.credit_status
          - entities.Deal.fields.round_count
        distinguishing_aspect: |
          The non-linearity here is on the Deal entity and is of the CYCLE +
          PARALLEL-DIMENSION kind: Deal.status revisits TERMS_AGREED after looping
          out to UNDER_NEGOTIATION and back through TERM_SHEET_ISSUED, while
          Deal.credit_status stays pinned at DECLINED across that entire status
          loop and only moves when its own dimension is triggered - proving the two
          dimensions are not a single combined state.
        test_recipe:
          setup:
            - "Buyer NW (A, 2.5, CDP_AND_TCFD, EBITDA 60000000.00, registry account held) is QUALIFIED with unsecured_credit_limit_usd 3000000.00."
            - "Project KJ1 (SOLAR, 100.000 MW) exists in PRE_DEVELOPMENT."
            - "Deal D (25.000 MW, base 42.50, escalation 2.0, first_delivery_year 2027, AS_GENERATED, SHARED) has already been round-tripped once: developer round A was COUNTERED by the buyer (Deal DRAFT -> TERM_SHEET_ISSUED -> UNDER_NEGOTIATION), a second developer round C pulled it back to TERM_SHEET_ISSUED, and the buyer ACCEPTED C, so Deal.status is TERMS_AGREED with round_count 3 and contract_price_usd_per_mwh 44.10."
            - "One CONFIRMED DealAllocation for 25.000 MW exists, so confirmed_allocated_mw equals contracted_mw."
            - "Credit has been submitted once and DECLINED, so Deal.credit_status is DECLINED while Deal.status is TERMS_AGREED."
            - "Logical clock is the 2026-08-01T00:00:00Z startup default throughout, so no round deadline ever lapses."
          setup_api_calls:
