      grounds:
      - calculations.post_event_savings
      - calculations.post_event_savings.constants
      - entities.PostEventReport
      - entities.MeetingEvent.fields.savings_recognized_usd
      - entities.Venue.fields.blocked_room_nights
      - endpoints[POST /sourcing/events/{event_id}/post-event-report]
      distinguishing_aspect: 'Every computed field of the report follows from the CONTRACTED figures, not from the bid: allowed = floor(587 * (1 - 0.20)) = 469, shortfall 69, attrition charge round(69 * 249.00 * 0.8) = 13744.80, and the realized total 370311.74 keeps the resort fee OUT of the service-charge base but IN the tax base, then subtracts the 11693.04 concession that was actually applied on the contract - savings_vs_benchmark 4400.00 is measured against the 260.00 benchmark ADR on the ACTUAL 400 nights, not the contracted 587.'
