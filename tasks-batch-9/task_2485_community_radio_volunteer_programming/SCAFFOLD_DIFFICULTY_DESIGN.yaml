          - errors[ERR_SLOT_CONFLICT]
          - endpoints[POST /schedule-grids/{gridId}/slot-assignments]
        distinguishing_aspect: |
          The colliding pair is state (v_grid_mutable, priority 50, ERR_GRID_NOT_MUTABLE, 409) against business_temporal (v_slot_window_conflict, priority 66, ERR_SLOT_CONFLICT, 409) on POST /schedule-grids/{gridId}/slot-assignments, and the naive implementation that screens the requested window against live neighbours before checking the grid's own lifecycle returns ERR_SLOT_CONFLICT; the other priority_pair_validation_conflict instance pairs business_safety against state on a different endpoint and the two candidate errors carry different HTTP statuses.
