      - name: skill_assertion_link_validates_body_fks_in_declared_order
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /skill-assertions]
          - validations[priority=5]
          - errors[ERR_CONSULTANT_NOT_FOUND]
          - errors[ERR_SKILL_NOT_FOUND]
        distinguishing_aspect: "A create quoting BOTH an unknown consultant_id and an unknown skill_id returns ERR_CONSULTANT_NOT_FOUND, because priority 5 walks the body FKs in the order the fields are declared in §1.1 — swapping only the skill_id then yields ERR_SKILL_NOT_FOUND, and the valid pair links in one call."
        test_recipe:
          setup:
            - "One NA group, one CLOUD_ARCH skill, one consultant."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /skill-assertions"
              payload: { consultant_id: "00000000-0000-4000-8000-000000000001", skill_id: "00000000-0000-4000-8000-000000000002", proficiency_level: 3 }
              as: ResourceManager
              captures: { err_both: $.data.error_id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "00000000-0000-4000-8000-000000000002", proficiency_level: 3 }
              as: ResourceManager
              captures: { err_skill: $.data.error_id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 3 }
              as: ResourceManager
              captures: { sa_id: $.data.id, sa_consultant: $.data.consultant_id, sa_skill: $.data.skill_id, sa_status: $.data.assertion_status }
          assert:
            - "${err_both} == ERR_CONSULTANT_NOT_FOUND with HTTP 404 — NOT ERR_SKILL_NOT_FOUND, even though both ids are unknown"
            - "${err_skill} == ERR_SKILL_NOT_FOUND with HTTP 404"
            - "the third call returns 201 with ${sa_consultant} == ${c1_id}, ${sa_skill} == ${sk_id} and ${sa_status} == \"ACTIVE\""
            - "GET /skill-assertions?consultant_id=${c1_id} has total_count == 1 and GET /skill-assertions?skill_id=${sk_id} has total_count == 1 — the link is readable from both sides"

