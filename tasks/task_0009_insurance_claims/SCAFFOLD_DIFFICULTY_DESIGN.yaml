scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_gross_payout_estimate_vs_final
        grounds:
          - calculations.gross_payout
          - entities.Claim.fields.claimed_amount_cents
          - entities.Claim.fields.assessed_loss_cents
          - entities.Claim.fields.gross_payout_cents
          - endpoints[GET /claims/{id}/estimate]
          - endpoints[POST /claims/{id}/submit-for-review]
        distinguishing_aspect: |
          Entity domain = Claim cost accounting. Variant estimate_at_intake reads claimed_amount_cents
          (insured-stated 600000); variant final_at_review reads assessed_loss_cents
          (adjuster-finalized 500000). Identical Policy (D=100000, C=0.8000, M=1000000) yields
          400000 vs 320000 gross_payout_cents — different numeric results from the same Policy
          on the same Claim.
        test_recipe:
          setup:
            - "Policy P1: deductible_cents=100000, coinsurance_ratio=0.8000, coverage_limit_cents=1000000, ACTIVE"
            - "Customer C1 files Claim K1 against P1 with claimed_amount_cents=600000, salvage_value_cents=0"
            - "Adjuster A1 (specialty matches) opens Investigation, sets assessed_loss_cents=500000, photo, doc-auth=true, one EstimateLineItem"
          trigger:
            - "GET /claims/{K1.id}/estimate as Customer C1"
            - "POST /claims/{K1.id}/submit-for-review as Adjuster A1"
          assert:
            - "estimate response.gross_payout_cents == 400000"
            - "After submit-for-review, Claim.gross_payout_cents == 320000"
            - "400000 != 320000"

      - name: repair_shop_trust_per_flag_vs_pattern_threshold
        grounds:
          - calculations.repair_shop_trust_decay
          - entities.RepairShop.fields.trust_score
          - endpoints[GET /repair-shops/{id}]
          - endpoints[POST /claims/{id}/submit-for-review]
          - endpoints[POST /claims/{id}/fraud-flags]
        distinguishing_aspect: |
          Entity domain = RepairShop risk scoring (different from Claim). Variant per_flag is
          canonical and mutates trust_score by N*DECAY_PER_FLAG; variant pattern_threshold is a
          read-only projection that yields min(current,0.20) when COLLUSION_PATTERN_THRESHOLD is
          reached. With 3 flags on a shop starting at 1.00, per_flag mutates trust_score to 0.40
          while pattern_threshold projection returns 0.20 — same inputs, different numbers,
          different domain than Rule 1 instance #1.
        test_recipe:
          setup:
            - "RepairShop S1 with default trust_score=1.00, status=ACTIVE"
            - "Three Claims K1,K2,K3 each in UNDER_INVESTIGATION using S1 in their EstimateLineItem"
            - "PlatformAdmin posts FraudFlag (signal=REPAIR_SHOP_COLLUSION, severity=1.0, repair_shop_id=S1) on K1, K2, K3"
          trigger:
            - "POST /claims/{K1.id}/submit-for-review (Adjuster) — first decay"
            - "POST /claims/{K2.id}/submit-for-review (Adjuster) — second decay"
            - "POST /claims/{K3.id}/submit-for-review (Adjuster) — third decay"
            - "GET /repair-shops/{S1.id}?projection=pattern_threshold (PlatformAdmin)"
          assert:
            - "After all three submits, RepairShop S1 trust_score == 0.40"
            - "RepairShop S1 status == ACTIVE (0.40 is NOT < 0.40 boundary)"
            - "GET response with projection=pattern_threshold returns trust_score == 0.20"
            - "0.40 != 0.20"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gross_payout_three_input_nonlinear_min_max
        grounds:
          - calculations.gross_payout
          - entities.Policy.fields.deductible_cents
          - entities.Policy.fields.coinsurance_ratio
          - entities.Policy.fields.coverage_limit_cents
          - entities.Claim.fields.assessed_loss_cents
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs (L, D, C, M) with non-linear interaction —
          max(0, L-D) THEN multiply by C THEN min with M. Reordering the operations
          (e.g., min(L*C, M) - D) yields 700000 instead of 1000000 for L=2000000, D=100000,
          C=0.9, M=1000000 — pinning the order of nested min/max is essential.
        test_recipe:
          setup:
            - "Policy P2: deductible_cents=100000, coinsurance_ratio=0.9000, coverage_limit_cents=1000000"
            - "Customer C1 files Claim K2 with claimed_amount_cents=2000000"
            - "Adjuster A1 sets Investigation.assessed_loss_cents=2000000, doc-auth=true, photo, estimate"
          trigger:
            - "POST /claims/{K2.id}/submit-for-review"
          assert:
            - "Claim.gross_payout_cents == 1000000  # = min(round_half_up((2000000-100000)*0.9), 1000000) = min(1710000, 1000000)"
            - "If incorrectly computed as min(L*C, M) - D, result would be 1000000 - 100000 = 900000; assertion catches that"

      - name: net_payout_circular_evaluation_order
        grounds:
          - calculations.net_payout
          - calculations.gross_payout
          - entities.Claim.fields.salvage_value_cents
          - entities.Claim.fields.subrogation_recovery_cents
          - entities.Claim.fields.gross_payout_cents
          - state_machines.Claim.PAID_to_PAID
          - endpoints[POST /claims/{id}/subrogations]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. gross_payout is computed at submit-for-review
          and pinned. net_payout = gross - salvage - subrogation, BUT subrogation arrives AFTER
          gross is pinned. The scaffold pins evaluation order: gross is fixed at approval and
          NEVER recomputed when subrogation arrives; only net moves. If implementation
          recomputes gross on subrogation (e.g., treating recovery as reducing assessed_loss),
          the order is wrong. Different mode from instance #1 (which is mode (a)).
        test_recipe:
          setup:
            - "Policy P3: deductible_cents=100000, coinsurance_ratio=0.8000, coverage_limit_cents=1000000"
            - "Claim K3 reaches PAID with assessed_loss_cents=500000, salvage_value_cents=50000, gross_payout_cents=320000, net_payout_cents=270000"
          trigger:
            - "POST /claims/{K3.id}/subrogations as PayoutOfficer with amount_cents=30000"
          assert:
            - "Claim.gross_payout_cents == 320000  # unchanged"
            - "Claim.subrogation_recovery_cents == 30000"
            - "Claim.net_payout_cents == 240000  # 320000 - 50000 - 30000"
            - "Payout.amount_cents == 270000  # ledger snapshot of original disbursement, unchanged"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_branching_with_revert
        grounds:
          - state_machines.Claim
          - state_machines.Claim.UNDER_INVESTIGATION_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - state_machines.Claim.DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_APPROVED
          - state_machines.Claim.APPEALED_to_CLOSED
          - state_machines.Investigation.OPEN_to_REJECTED
        distinguishing_aspect: |
          Branching with revert on Claim entity: UNDER_REVIEW forks to {APPROVED, DENIED} with
          divergent side-effect sets (APPROVED triggers payout pipeline; DENIED populates
          denial_reason and gates appeal). DENIED can revert via appeal back to APPROVED through
          APPEALED. Investigation.OPEN -> REJECTED also reverts Claim status to INTAKE. This is
          NOT a linear A->B->C pipeline.
        test_recipe:
          setup:
            - "Claim K reaches UNDER_REVIEW with review_path=MANUAL"
          trigger:
            - "POST /claims/{K.id}/decisions as Reviewer R1 with outcome=DENY  # K -> DENIED"
            - "POST /claims/{K.id}/appeals as Customer C1                       # K -> APPEALED"
            - "POST /claims/{K.id}/appeals/{a.id}/decisions as Reviewer R2 outcome=OVERTURN  # K -> APPROVED"
          assert:
            - "Sequence visits {UNDER_REVIEW, DENIED, APPEALED, APPROVED} — non-linear with revert"
            - "Audit log contains STATUS_CHANGE entries for each transition with from_state/to_state matching"

      - name: payout_branching_with_compensation
        grounds:
          - state_machines.Payout
          - state_machines.Payout.PENDING_to_SETTLED
          - state_machines.Payout.PENDING_to_REVERSED
          - endpoints[POST /_events/bank-settle]
          - endpoints[POST /_events/bank-fail]
        distinguishing_aspect: |
          Branching fork-join on Payout entity (different entity than Claim). PENDING forks to
          {SETTLED, REVERSED} with divergent side effects: SETTLED cascades Claim PAID -> CLOSED;
          REVERSED cascades Claim PAID -> APPROVED (compensating revert). Different entity from
          instance #1.
        test_recipe:
          setup:
            - "Two parallel Claims K_settle and K_fail each reaching APPROVED with net_payout_cents > 0"
            - "POST /claims/{K_settle.id}/payouts -> Payout P1 PENDING; Claim K_settle PAID"
            - "POST /claims/{K_fail.id}/payouts -> Payout P2 PENDING; Claim K_fail PAID"
          trigger:
            - "POST /_events/bank-settle with payout_id=P1.id"
            - "POST /_events/bank-fail with payout_id=P2.id"
          assert:
            - "Payout P1.status == SETTLED; Claim K_settle.status == CLOSED"
            - "Payout P2.status == REVERSED; Claim K_fail.status == APPROVED"
            - "K_fail.gross_payout_cents and K_fail.net_payout_cents unchanged from pre-payout values (compensation invariant)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: submit_review_to_blacklist_chain_depth3
        grounds:
          - state_machines.Claim.UNDER_INVESTIGATION_to_UNDER_REVIEW
          - calculations.repair_shop_trust_decay
          - entities.RepairShop.fields.trust_score
          - entities.RepairShop.fields.status
          - state_machines.RepairShop.ACTIVE_to_BLACKLISTED
          - endpoints[POST /claims/{id}/submit-for-review]
        distinguishing_aspect: |
          Trigger = POST /claims/{id}/submit-for-review (Claim transition). Depth ≥ 3:
          (1) Claim transitions UNDER_INVESTIGATION -> UNDER_REVIEW; (2) THAT mutation triggers
          repair_shop_trust_decay against RepairShop.trust_score; (3) THAT mutation drops
          trust_score below 0.40 which itself triggers RepairShop.status -> BLACKLISTED. Each
          link is caused by the previous link, not by the original action.
        test_recipe:
          setup:
            - "RepairShop S1 trust_score = 0.50 (already weakened from prior flags)"
            - "Claim K1 in UNDER_INVESTIGATION; Investigation has EstimateLineItem with repair_shop_id=S1"
            - "PlatformAdmin posts one FraudFlag(signal=REPAIR_SHOP_COLLUSION, severity=1.0, repair_shop_id=S1) on K1"
          trigger:
            - "POST /claims/{K1.id}/submit-for-review as Adjuster"
          assert:
            - "Claim K1 status == UNDER_REVIEW (link 1)"
            - "RepairShop S1 trust_score == 0.30 (link 2: 0.50 - 0.20)"
            - "RepairShop S1 status == BLACKLISTED (link 3: 0.30 < 0.40)"
            - "AuditLogEntry rows record all three steps"

      - name: bank_settle_to_policy_event_sync_depth3
        grounds:
          - state_machines.Payout.PENDING_to_SETTLED
          - state_machines.Claim.PAID_to_CLOSED
          - entities.AuditLogEntry
          - endpoints[POST /_events/bank-settle]
        distinguishing_aspect: |
          Trigger = POST /_events/bank-settle (DIFFERENT triggering transition than instance #1).
          Depth ≥ 3: (1) Payout PENDING -> SETTLED; (2) THAT mutation auto-cascades Claim
          PAID -> CLOSED; (3) THAT mutation emits POLICY_CLAIM_CLOSED audit event and policy
          event-sync. Different propagation pattern (system-event-driven downstream cascade)
          than instance #1's submit-driven calculation cascade.
        test_recipe:
          setup:
            - "Claim K reaches PAID; Payout P PENDING; Claim.status == PAID"
          trigger:
            - "POST /_events/bank-settle with payout_id=P.id"
          assert:
            - "Payout P status == SETTLED (link 1)"
            - "Claim K status == CLOSED (link 2)"
            - "AuditLogEntry exists with event_type=STATUS_CHANGE from_state=PAID to_state=CLOSED (link 3 — record produced by the K transition, not by /_events/bank-settle directly)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_appeal_on_inactive_policy
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - entities.Claim.fields.status
          - entities.Policy.fields.status
        distinguishing_aspect: |
          Pair = `state` (priority 4: ERR_INVALID_STATE) vs `business_referential` (priority 5:
          ERR_POLICY_INACTIVE). On POST /claims (intake) where the referenced Policy has been
          SUSPENDED AND the request also references a Customer-X-User-ID for an unrelated
          Policy. Order matters: referential check must come AFTER state. Wait — for intake
          there's no claim state. Refine: this conflict applies on POST /claims/{id}/appeals
          where Claim.status=APPROVED (state-fail) AND the Policy linked to that claim is also
          SUSPENDED. State check (priority 4) wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Policy P SUSPENDED"
            - "Claim K linked to P; K reached APPROVED previously"
          trigger:
            - "POST /claims/{K.id}/appeals as Customer (Claim is APPROVED, not DENIED, AND policy inactive)"
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVALID_STATE'  # priority 4 beats priority 5"

      - name: business_safety_vs_business_constraint_fraud_hold_vs_photo
        grounds:
          - validations[priority=9]
          - validations[priority=17]
          - entities.Claim.fields.fraud_score
          - entities.Investigation.fields.photo_urls
          - endpoints[POST /claims/{id}/submit-for-review]
        distinguishing_aspect: |
          Pair = `business_safety` (priority 9: ERR_FRAUD_HOLD) vs `business_constraint`
          (priority 17: ERR_PHOTOS_REQUIRED). Different pair than instance #1. At
          submit-for-review with fraud_score >= 0.80 AND photo_urls empty, fraud-safety
          (priority 9) wins.
        test_recipe:
          setup:
            - "Claim K UNDER_INVESTIGATION; Investigation with photo_urls=[] (empty)"
            - "PlatformAdmin posts FraudFlag(DUPLICATE_PATTERN, 1.0), FraudFlag(REPAIR_SHOP_COLLUSION, 1.0), FraudFlag(DOCUMENT_FORGERY, 1.0), FraudFlag(RAPID_RESUBMISSION, 1.0) on K"
          trigger:
            - "POST /claims/{K.id}/submit-for-review as Adjuster"
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_FRAUD_HOLD'  # priority 9 beats priority 17"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: auto_approval_threshold_inclusive_boundary
        grounds:
          - calculations.review_path_assignment
          - entities.Claim.fields.claimed_amount_cents
          - entities.Claim.fields.review_path
          - endpoints[POST /claims/{id}/submit-for-review]
        distinguishing_aspect: |
          Numeric threshold metric: claimed_amount_cents at AUTO_APPROVAL_THRESHOLD_CENTS=200000.
          claimed_amount_cents == 200000 yields review_path=AUTO (boundary is inclusive: <=).
          claimed_amount_cents == 200001 yields review_path=MANUAL.
        test_recipe:
          setup:
            - "Two Claims K_at and K_over with claimed_amount_cents=200000 and 200001 respectively"
            - "Both reach UNDER_INVESTIGATION with no fraud flags (fraud_score == 0.00)"
            - "Both Investigations have photo, doc-auth=true, one EstimateLineItem"
          trigger:
            - "POST /claims/{K_at.id}/submit-for-review"
            - "POST /claims/{K_over.id}/submit-for-review"
          assert:
            - "K_at.review_path == 'AUTO'  # 200000 <= 200000"
            - "K_over.review_path == 'MANUAL'  # 200001 > 200000"

      - name: estimate_required_empty_collection_boundary
        grounds:
          - validations[priority=18]
          - entities.EstimateLineItem
          - endpoints[POST /claims/{id}/submit-for-review]
        distinguishing_aspect: |
          Different metric (collection cardinality, not numeric threshold) on a different
          endpoint surface (submit-for-review's estimate-count check, vs instance #1's
          review_path threshold). Empty set boundary: 0 estimates -> reject; 1 estimate ->
          pass. Tests the 0-vs-1 cardinality boundary explicitly.
        test_recipe:
          setup:
            - "Claim K_no with Investigation having photo and doc-auth but ZERO EstimateLineItem rows"
            - "Claim K_one with Investigation having photo, doc-auth, and ONE EstimateLineItem"
          trigger:
            - "POST /claims/{K_no.id}/submit-for-review"
            - "POST /claims/{K_one.id}/submit-for-review"
          assert:
            - "First call: HTTP 422, error_id == 'ERR_ESTIMATE_REQUIRED'"
            - "Second call: HTTP 200; Claim.status == UNDER_REVIEW"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_intake_requires_active_policy
        grounds:
          - validations[priority=5]
          - state_machines.Claim
          - entities.Policy.fields.status
          - entities.Claim.fields.policy_id
          - endpoints[POST /claims]
        distinguishing_aspect: |
          Entity pair = (Claim, Policy). Claim's INTAKE creation transition is gated by
          Policy.status == ACTIVE. If Policy is SUSPENDED/EXPIRED/CANCELLED, intake is
          rejected regardless of all other body fields. Cross-entity precondition.
        test_recipe:
          setup:
            - "Policy P with status=SUSPENDED (admin patch from ACTIVE)"
            - "Customer C linked via insured_party_id"
          trigger:
            - "POST /claims as Customer C with policy_id=P.id, valid loss_date and amounts"
          assert:
            - "HTTP 422; error_id == 'ERR_POLICY_INACTIVE'"
            - "No Claim row created"

      - name: payout_creation_requires_no_existing_payout_and_approved_claim
        grounds:
          - validations[priority=4]
          - state_machines.Claim.APPROVED_to_PAID
          - state_machines.Payout
          - entities.Claim.fields.status
          - entities.Payout.fields.status
          - endpoints[POST /claims/{id}/payouts]
        distinguishing_aspect: |
          Entity pair = (Payout, Claim) — DIFFERENT pair than instance #1. Payout creation
          requires Claim.status == APPROVED. If Claim has already transitioned to PAID
          (because a prior Payout exists), second POST returns ERR_INVALID_STATE for the
          claim's state, not just ERR_PAYOUT_ALREADY_EXISTS. The transition is gated by the
          sibling entity's state.
        test_recipe:
          setup:
            - "Claim K reaches APPROVED with net_payout_cents > 0"
            - "POST /claims/{K.id}/payouts succeeds; K transitions to PAID; Payout P PENDING"
          trigger:
            - "POST /claims/{K.id}/payouts (second time) as PayoutOfficer"
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE' (priority 4 — Claim no longer APPROVED) OR 'ERR_PAYOUT_ALREADY_EXISTS' (priority 20). Per validation order, ERR_INVALID_STATE wins."
            - "error_id == 'ERR_INVALID_STATE'"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_period_half_open_interval
        grounds:
          - validations[priority=6]
          - entities.Policy.fields.effective_from
          - entities.Policy.fields.effective_to
          - entities.Claim.fields.loss_date
          - endpoints[POST /claims]
        distinguishing_aspect: |
          Interval semantics = half-open [effective_from, effective_to). Resource = Policy.
          loss_date == effective_from is INCLUDED; loss_date == effective_to is EXCLUDED.
          Claim intake fails ERR_LOSS_OUTSIDE_POLICY_PERIOD if loss_date sits exactly at
          effective_to.
        test_recipe:
          setup:
            - "Policy P with effective_from=2024-01-01T00:00:00.000Z, effective_to=2024-12-31T23:59:59.999Z"
            - "Customer C linked to P"
          trigger:
            - "POST /claims with loss_date=2024-01-01T00:00:00.000Z (== effective_from, INCLUDED)"
            - "POST /claims with loss_date=2024-12-31T23:59:59.999Z (== effective_to, EXCLUDED)"
          assert:
            - "First call: HTTP 201, Claim created"
            - "Second call: HTTP 422, error_id == 'ERR_LOSS_OUTSIDE_POLICY_PERIOD'"

      - name: idempotency_window_24h_aggregate_capacity
        grounds:
          - validations[priority=8]
          - entities.Claim.fields.idempotency_key
          - entities.Claim.fields.claimant_id
          - concurrency_rules[duplicate idempotency]
          - endpoints[POST /claims]
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          DIFFERENT interval semantics from instance #1: rolling 24h window measured from the
          existing Claim.created_at, AND the resource here is the (claimant_id, idempotency_key)
          tuple — not Policy. The geometric treatment is "first occurrence reserves a 24-hour
          window during which no second occurrence with the same key may exist". After 24h
          elapse, the same (claimant_id, idempotency_key) is reusable; semantics is "aggregate
          temporal capacity of 1 within any rolling 24h window".
        test_recipe:
          setup:
            - "Customer C, Policy P ACTIVE; clock at T0"
            - "POST /claims (idempotency_key=K1) -> Claim_a created"
          trigger:
            - "POST /claims (same claimant, idempotency_key=K1) at T0+1h"
            - "POST /_clock/advance to T0+24h+1s"
            - "POST /claims (same claimant, idempotency_key=K1) at T0+24h+1s"
          assert:
            - "Second call: HTTP 409, error_id == 'ERR_DUPLICATE_CLAIM_INTAKE'"
            - "Third call (after window): HTTP 201, new Claim_b created with different id"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: subrogation_preserves_gross_minus_recoveries_equals_net
        grounds:
          - calculations.gross_payout
          - calculations.net_payout
          - state_machines.Claim.PAID_to_PAID
          - entities.Claim.fields.gross_payout_cents
          - entities.Claim.fields.salvage_value_cents
          - entities.Claim.fields.subrogation_recovery_cents
          - entities.Claim.fields.net_payout_cents
        distinguishing_aspect: |
          Conserved quantity = `gross_payout_cents - salvage_value_cents -
          subrogation_recovery_cents - net_payout_cents == 0`. Subrogation recording is the
          forward action; the "compensation" is that gross is NOT retroactively adjusted —
          the formula re-balances by moving net only. Type of conserved quantity = monetary
          balance equation across a single Claim.
        test_recipe:
          setup:
            - "Claim K PAID with gross_payout_cents=320000, salvage_value_cents=50000, subrogation_recovery_cents=0, net_payout_cents=270000"
          trigger:
            - "POST /claims/{K.id}/subrogations amount_cents=30000"
            - "POST /claims/{K.id}/subrogations amount_cents=10000"
          assert:
            - "After step 1: gross=320000, salvage=50000, subrog=30000, net=240000; 320000 - 50000 - 30000 - 240000 == 0"
            - "After step 2: gross=320000, salvage=50000, subrog=40000, net=230000; 320000 - 50000 - 40000 - 230000 == 0"
            - "Across both steps, gross_payout_cents unchanged at 320000"

      - name: bank_fail_revert_preserves_payout_count_invariant
        grounds:
          - state_machines.Payout.PENDING_to_REVERSED
          - state_machines.Claim.PAID_to_PAID
          - entities.Payout.fields.status
          - entities.Claim.fields.status
          - endpoints[POST /_events/bank-fail]
          - endpoints[POST /claims/{id}/payouts]
        distinguishing_aspect: |
          DIFFERENT conserved quantity — count invariant on `count(Payout WHERE status IN
          {PENDING, SETTLED}) per Claim`. Forward action: POST /claims/{id}/payouts increments
          this count by 1. Compensating action: POST /_events/bank-fail decrements
          (PENDING -> REVERSED removes the row from the active count). After fail+retry, the
          conserved global quantity `count(active payouts per claim) <= 1` holds throughout,
          and after a successful retry POST /claims/{id}/payouts the count returns to 1 with
          a different Payout row id.
        test_recipe:
          setup:
            - "Claim K APPROVED with net_payout_cents=270000"
          trigger:
            - "POST /claims/{K.id}/payouts -> Payout P1 PENDING; Claim PAID  (count=1)"
            - "POST /_events/bank-fail with payout_id=P1.id              (count=0; Claim reverts to APPROVED)"
            - "POST /claims/{K.id}/payouts -> Payout P2 PENDING; Claim PAID  (count=1; new id != P1.id)"
          assert:
            - "P1.status == REVERSED; P2.status == PENDING; P2.id != P1.id"
            - "count(Payout for K where status IN {PENDING, SETTLED}) == 1 after retry"
            - "Claim K.gross_payout_cents and net_payout_cents unchanged across the cycle (compensation invariant on monetary fields too)"
