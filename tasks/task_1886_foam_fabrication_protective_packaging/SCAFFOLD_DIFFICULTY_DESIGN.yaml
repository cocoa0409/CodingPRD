            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:30:00Z", drop_height_in: 30, orientation: "CORNER" }, as: QualityEngineer, captures: { dt3: $.data.id, dt3_status: $.data.status } }
