      - name: deferral_cap_exact_application_and_overflow
        claim_type: correct_result
        grounds: ["calculations.deferral_cap", "errors[ERR_DEFERRAL_CAP_EXCEEDED]", "state_machines.DeferralElection.LOCKED_to_APPLIED"]
        distinguishing_aspect: "GENERAL cap = floor(30000000 * 5000 / 10000) = 15000000. Postings of 14999999 then 1 reach the cap exactly and flip the election to APPLIED; a posting of 2 when only 1 remains fails with ERR_DEFERRAL_CAP_EXCEEDED and posts nothing."
        test_recipe:
          setup: ["ACTIVE plan, fund, window 2027; participant (comp 30000000); account; GENERAL election at 5000 bp submitted and LOCKED (cap 15000000)"]
          setup_api_calls:
            - call: "POST /api/plans"
