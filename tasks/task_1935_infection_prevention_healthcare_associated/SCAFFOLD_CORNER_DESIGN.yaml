        as: InfectionPreventionist
        captures:
          err: $.data.error_id
      assert:
      - 'object GET: response_type == ''object'', data carries id == ${unit_id}, meta.api_request_id non-empty'
      - 'list GET: response_type == ''array'', data is an array, pagination fields limit/offset/total_count/has_more present'
