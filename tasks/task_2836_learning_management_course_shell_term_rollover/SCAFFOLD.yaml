# =============================================================================
# PRD Benchmark Scaffold — Learning Management Course Shell & Term Rollover
# Sections §1.0 – §1.7. Difficulty design (§1.8) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design (§1.9) in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2836. Learning Management Course Shell & Term Rollover (campus learning
  management system administration): course shell provisioning from the student
  information system with cross-listing and merge requests, enrollment
  synchronization for adds, drops and waitlists with role assignment, term
  rollover copying content while stripping dates, submissions and grades,
  sandbox and development shell governance, third-party tool integration
  approval with privacy and accessibility review, grade passback to the
  registrar with dispute handling, course archival, retention and student
  access after term end, outage and academic continuity procedures during
  finals

domain_name: lms-shell-rollover

# Flat topology: every entity is a peer collection at the top level and all
# relationships are expressed as foreign keys in request bodies, never as URL
# nesting. The api_prefix is therefore the server root.
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - soft_delete_archival

  entity_topology: flat
  state_machine_shape: parallel
  # AcademicTerm carries two independent state dimensions (lifecycle_state ×
  # continuity_posture); ToolIntegration carries three (privacy_review_state ×
  # accessibility_review_state → compound approval_state); CourseShell,
  # Enrollment and GradePassback each contain a genuine cycle; MergeRequest,
  # RolloverJob and CourseShell provisioning fork on branch decisions with
  # divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many          # ToolPlacement is the junction of ToolIntegration × CourseShell
    - self_referential      # CourseShell.merged_into_shell_id, ContentItem.source_item_id
    - cross_aggregate       # GradeDispute reaches Enrollment across the passback aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

difficulty_level: expert_plus
target_counts:
  entities: 14
  endpoints: 66
  errors: 55
  calculations: 9
  state_machines: 14
  validations: 43
  concurrency_rules: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - name: term_code
        type: string
        source: input
        description: "Registrar term code, globally unique (e.g. 2026FA)"
        constraints: "unique across all AcademicTerm rows"
      - name: lifecycle_state
        type: enum
        source: system
        description: "Registrar-driven term lifecycle dimension"
        default: PLANNING
        constraints: "one of PLANNING, REGISTRATION_OPEN, IN_SESSION, FINALS, GRADING, CLOSED, ARCHIVED"
      - name: continuity_posture
        type: enum
        source: system
        description: "Independent academic-continuity dimension that gates child shell operations"
        default: NORMAL
        constraints: "one of NORMAL, ELEVATED, CONTINUITY_MODE"
      - name: term_start_at
        type: datetime
        source: input
        description: "First instructional instant of the term (ISO 8601 UTC)"
      - name: term_end_at
        type: datetime
        source: input
        description: "Last instructional instant of the term; must be strictly after term_start_at"
      - name: add_drop_deadline_at
        type: datetime
        source: input
        description: "Last instant at which an Enrollment may be reinstated after a drop"
        default: "term_start_at + 14 days"
      - name: finals_window_start_at
        type: datetime
        source: input
        description: "Start of the finals window used by continuity procedures"
        default: "term_end_at - 7 days"
      - name: finals_window_end_at
        type: datetime
        source: input
        description: "End of the finals window; must equal or precede term_end_at"
        default: "term_end_at"
      - name: access_grace_days
        type: integer
        source: input
        description: "Days of post-term student read access granted after term_end_at"
        default: 30
        constraints: ">= 0 and <= 365"
      - name: retention_class
        type: enum
        source: input
        description: "Retention schedule class driving retention_purge_at"
        default: STANDARD
        constraints: "one of STANDARD, EXTENDED, LEGAL_HOLD"
      - name: student_access_end_at
        type: datetime
        source: computed
        description: "Computed by retention_purge_schedule; last instant a Student may read term data"
      - name: retention_purge_at
        type: datetime
        source: computed
        description: "Computed by retention_purge_schedule; null when retention_class == LEGAL_HOLD"
      - name: rollover_completion_pct
        type: number
        source: computed
        description: "Computed by term_rollover_completion_pct; 100.00 when the eligible-shell set is empty"
        default: 100.00
      - name: published_shell_count
        type: integer
        source: computed
        description: "Count of this term's CourseShell rows with provisioning_state == PUBLISHED"
        default: 0
      - name: overflow_shell_count
        type: integer
        source: computed
        description: "Count of this term's CourseShell rows with overflow_flag == true"
        default: 0
      - name: total_active_enrollments
        type: integer
        source: computed
        description: "Conserved headcount maintained by enrollment_seat_ledger"
        default: 0
      - name: open_amendment_count
        type: integer
        source: computed
        description: "Count of this term's GradePassback rows with passback_state IN {DISPUTED, AMENDED}"
        default: 0
      - name: sis_sync_epoch
        type: integer
        source: system
        description: "Monotonic SIS feed epoch; advanced by one on each applied EnrollmentSyncBatch"
        default: 0

  - name: Person
    parent: null
    common_fields: true
    fields:
      - name: sis_person_id
        type: string
        source: input
        description: "Student information system person identifier, globally unique"
        constraints: "unique across all Person rows"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: primary_affiliation
        type: enum
        source: input
        description: "Campus affiliation used for role eligibility checks"
        constraints: "one of STUDENT, FACULTY, STAFF"
      - name: ferpa_block
        type: boolean
        source: system
        description: "When true this person's records may not be exported to third-party tools or the registrar"
        default: false
      - name: access_revoked_at
        type: datetime
        source: system
        description: "Instant at which LMS access was revoked; null while access is live"
      - name: sandbox_storage_charge_usd
        type: number
        source: computed
        description: "Computed by sandbox_storage_chargeback over this person's SANDBOX and DEV shells"
        default: 0.00

  - name: CourseShell
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term this shell belongs to"
      - name: owner_person_id
        type: string
        source: input
        description: "FK -> Person.id; instructor of record; must have primary_affiliation IN {FACULTY, STAFF}"
      - name: sis_section_code
        type: string
        source: input
        description: "SIS section code; unique per (term_id, sis_section_code) when shell_type == OFFICIAL"
      - name: shell_type
        type: enum
        source: input
        description: "Governance class of the shell"
        constraints: "one of OFFICIAL, SANDBOX, DEV"
      - name: provisioning_state
        type: enum
        source: system
        description: "Shell lifecycle dimension"
        default: REQUESTED
        constraints: "one of REQUESTED, PROVISIONED, REJECTED, PUBLISHED, MERGED, CONCLUDED, ARCHIVED, PURGED"
      - name: base_seat_cap
        type: integer
        source: input
        description: "SIS-declared seat cap before any overflow allowance"
        default: 25
        constraints: ">= 1 and <= 2000"
      - name: effective_seat_cap
        type: integer
        source: computed
        description: "Computed by waitlist_promotion_capacity step 3 (base_seat_cap + overflow_allowance)"
        default: 25
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "Count of this shell's Enrollment rows with enrollment_state == ACTIVE and role == STUDENT"
        default: 0
      - name: waitlisted_enrollment_count
        type: integer
        source: computed
        description: "Count of this shell's Enrollment rows with enrollment_state == WAITLISTED"
        default: 0
      - name: seat_utilization_pct
        type: number
        source: computed
        description: "round_half_up(active_enrollment_count / base_seat_cap * 100, 2)"
        default: 0.00
      - name: overflow_flag
        type: boolean
        source: computed
        description: "True when active_enrollment_count > base_seat_cap"
        default: false
      - name: storage_mb
        type: number
        source: system
        description: "Current stored megabytes; sum of this shell's ContentItem.storage_mb plus storage-adjustment deltas"
        default: 0.00
      - name: merged_into_shell_id
        type: string
        source: system
        description: "FK -> CourseShell.id; set when this shell is absorbed as a cross-list child; null otherwise"
      - name: absorbed_child_count
        type: integer
        source: computed
        description: "Count of CourseShell rows whose merged_into_shell_id == this shell's id"
        default: 0
      - name: content_item_count
        type: integer
        source: computed
        description: "Count of this shell's ContentItem rows with copy_state != SKIPPED"
        default: 0
      - name: total_points_possible
        type: number
        source: computed
        description: "Sum of ContentItem.points_possible for this shell where item_type IN {ASSIGNMENT, QUIZ} and copy_state != SKIPPED"
        default: 0.00
      - name: blocked_placement_count
        type: integer
        source: computed
        description: "Count of this shell's ToolPlacement rows with placement_state == BLOCKED"
        default: 0
      - name: publish_readiness
        type: boolean
        source: computed
        description: "True when blocked_placement_count == 0 and no ToolPlacement of this shell has placement_state == REQUESTED"
        default: true
      - name: sandbox_expires_at
        type: datetime
        source: system
        description: "For shell_type IN {SANDBOX, DEV}: term_end_at + 60 days; null for OFFICIAL shells"
      - name: reject_reason
        type: string
        source: system
        description: "Set when provisioning_state becomes REJECTED; null otherwise"
      - name: unpublish_reason
        type: string
        source: system
        description: "Reason recorded by the most recent PUBLISHED -> PROVISIONED transition; null if never unpublished"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the shell the person is enrolled in"
      - name: person_id
        type: string
        source: input
        description: "FK -> Person.id; the enrolled person"
      - name: batch_id
        type: string
        source: system
        description: "FK -> EnrollmentSyncBatch.id; the batch that created or last mutated this row; null for manual enrollments"
      - name: merged_from_shell_id
        type: string
        source: system
        description: "FK -> CourseShell.id; cross-list origin marker set when an applied MergeRequest relocated this row; cleared by REVERSE"
      - name: role
        type: enum
        source: input
        description: "LMS role assigned in the shell"
        constraints: "one of STUDENT, TEACHER, TA, DESIGNER, OBSERVER"
      - name: enrollment_state
        type: enum
        source: system
        description: "Enrollment lifecycle"
        default: ACTIVE
        constraints: "one of ACTIVE, WAITLISTED, DROPPED, COMPLETED"
      - name: waitlist_position
        type: integer
        source: system
        description: "1-based queue position while enrollment_state == WAITLISTED; null otherwise"
      - name: earned_points_total
        type: number
        source: computed
        description: "Sum of earned_points across this enrollment's grade records"
        default: 0.00
      - name: graded_points_possible
        type: number
        source: computed
        description: "Sum of ContentItem.points_possible over the items this enrollment has a grade record for"
        default: 0.00
      - name: provisional_grade_pct
        type: number
        source: computed
        description: "Computed by final_grade_percentage variant PROVISIONAL"
        default: 0.00
      - name: final_grade_pct
        type: number
        source: computed
        description: "Computed by final_grade_percentage variant FINAL at grade passback submit; null before that"
      - name: dropped_at
        type: datetime
        source: system
        description: "Instant of the most recent ACTIVE -> DROPPED transition; null if never dropped"
      - name: reinstatement_count
        type: integer
        source: system
        description: "Number of DROPPED -> ACTIVE reinstatements this row has undergone"
        default: 0
      - name: disputed_points_held
        type: number
        source: computed
        description: "Points of this enrollment currently escrowed by an OPEN GradeDispute"
        default: 0.00

  - name: EnrollmentSyncBatch
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term whose SIS feed this batch carries"
      - name: batch_seq
        type: integer
        source: input
        description: "SIS feed sequence number; must equal AcademicTerm.sis_sync_epoch + 1 at apply time"
        default: "term.sis_sync_epoch + 1"
      - name: operations
        type: array
        source: input
        description: "Ordered array of objects { op: ADD | DROP, shell_id, person_id, role }; processed in array order"
        constraints: "1 to 200 elements"
      - name: batch_state
        type: enum
        source: system
        description: "Batch lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, VALIDATED, APPLIED, FAILED, CANCELLED"
      - name: validated_operation_count
        type: integer
        source: computed
        description: "Operations that passed validation during the DRAFT -> VALIDATED transition"
        default: 0
      - name: rejected_operation_count
        type: integer
        source: computed
        description: "Operations that failed validation during the DRAFT -> VALIDATED transition"
        default: 0
      - name: applied_add_count
        type: integer
        source: computed
        description: "ADD operations that produced an ACTIVE or WAITLISTED Enrollment"
        default: 0
      - name: applied_drop_count
        type: integer
        source: computed
        description: "DROP operations that moved an Enrollment to DROPPED"
        default: 0
      - name: promoted_from_waitlist_count
        type: integer
        source: computed
        description: "WAITLISTED -> ACTIVE promotions cascaded by this batch's drops"
        default: 0
      - name: failure_reason
        type: string
        source: system
        description: "Set when batch_state becomes FAILED; null otherwise"

  - name: MergeRequest
    parent: null
    common_fields: true
    fields:
      - name: parent_shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the cross-list parent that absorbs enrollments and content"
      - name: child_shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the shell to be absorbed; must differ from parent_shell_id"
      - name: justification
        type: string
        source: input
        description: "Free-text cross-listing justification recorded for audit"
        default: "cross-listed section"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LmsAdmin that created the request; drives the segregation-of-duties check"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LmsAdmin that approved or declined the request; null before a decision"
      - name: merge_state
        type: enum
        source: system
        description: "Merge request lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, DECLINED, APPLIED, REVERSED"
      - name: moved_enrollment_count
        type: integer
        source: computed
        description: "Number of Enrollment rows relocated from child to parent by the APPLY transition"
        default: 0
      - name: reversed_enrollment_count
        type: integer
        source: computed
        description: "Number of Enrollment rows returned to the child shell by the REVERSE transition"
        default: 0
      - name: seat_ledger_before
        type: integer
        source: system
        description: "AcademicTerm.total_active_enrollments snapshot taken immediately before APPLY; null before APPLY"
      - name: seat_ledger_after
        type: integer
        source: computed
        description: "AcademicTerm.total_active_enrollments immediately after APPLY; must equal seat_ledger_before"
        default: 0

  - name: ContentItem
    parent: null
    common_fields: true
    fields:
      - name: shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the shell that owns this item"
      - name: source_item_id
        type: string
        source: system
        description: "FK -> ContentItem.id; the item this row was copied from during rollover; null for originals"
      - name: item_type
        type: enum
        source: input
        description: "Content item kind"
        constraints: "one of ASSIGNMENT, QUIZ, PAGE, FILE"
      - name: title
        type: string
        source: input
        description: "Item title"
      - name: due_at
        type: datetime
        source: input
        description: "Due instant for ASSIGNMENT and QUIZ items; null for PAGE and FILE"
      - name: points_possible
        type: number
        source: input
        description: "Gradebook points; must be 0 for PAGE and FILE items"
        default: 0.00
      - name: storage_mb
        type: number
        source: input
        description: "Megabytes this item occupies in the shell"
        default: 0.00
      - name: has_submissions
        type: boolean
        source: system
        description: "True once at least one submission is recorded against this item"
        default: false
      - name: submission_count
        type: integer
        source: computed
        description: "Number of submissions recorded against this item"
        default: 0
      - name: date_stripped
        type: boolean
        source: system
        description: "True when a rollover copy cleared due_at instead of shifting it"
        default: false
      - name: copy_state
        type: enum
        source: system
        description: "Provenance marker set by rollover"
        default: SOURCE
        constraints: "one of SOURCE, COPIED, SKIPPED"

  - name: RolloverJob
    parent: null
    common_fields: true
    fields:
      - name: source_shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the prior-term shell whose content is copied"
      - name: target_shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the new-term shell that receives copies"
      - name: target_term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term whose calendar anchors date projection; must equal target shell's term_id"
      - name: expected_target_shell_version
        type: integer
        source: input
        description: "Optimistic-concurrency guard: the CourseShell.version the client last observed on the target shell"
      - name: strip_dates
        type: boolean
        source: input
        description: "When true every copied item's due_at is cleared; when false due_at is projected per date_shift_mode"
        default: true
      - name: strip_submissions
        type: boolean
        source: input
        description: "When true copies carry has_submissions false and submission_count 0"
        default: true
      - name: strip_grades
        type: boolean
        source: input
        description: "When true no Enrollment grade records are copied into the target shell"
        default: true
      - name: date_shift_mode
        type: enum
        source: input
        description: "Selects the rollover_due_date_projection variant applied when strip_dates is false"
        default: ANCHOR_PROPORTIONAL
        constraints: "one of ANCHOR_PROPORTIONAL, FIXED_OFFSET"
      - name: job_state
        type: enum
        source: system
        description: "Rollover job lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, VALIDATED, COPYING, COMPLETED, FAILED, COMPENSATED"
      - name: eligible_item_count
        type: integer
        source: computed
        description: "Source ContentItem rows with copy_state != SKIPPED counted during DRAFT -> VALIDATED"
        default: 0
      - name: copied_item_count
        type: integer
        source: computed
        description: "ContentItem copies actually created in the target shell"
        default: 0
      - name: skipped_item_count
        type: integer
        source: computed
        description: "Source items not copied because strip_submissions is false and has_submissions is true"
        default: 0
      - name: date_stripped_count
        type: integer
        source: computed
        description: "Copies whose due_at was cleared"
        default: 0
      - name: date_shifted_count
        type: integer
        source: computed
        description: "Copies whose due_at was projected onto the target term calendar"
        default: 0
      - name: copied_storage_mb
        type: number
        source: computed
        description: "Sum of storage_mb over the copies created; added to the target shell's storage_mb"
        default: 0.00
      - name: failure_reason
        type: string
        source: system
        description: "Set when job_state becomes FAILED; null otherwise"

  - name: ToolIntegration
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: "Third-party vendor name"
      - name: tool_name
        type: string
        source: input
        description: "Tool name; unique per (vendor_name, tool_name)"
      - name: tool_version
        type: string
        source: input
        description: "Vendor version string currently registered"
      - name: data_sharing_scope
        type: enum
        source: input
        description: "Student data the tool receives"
        constraints: "one of NONE, ROSTER_ONLY, ROSTER_AND_GRADES, FULL_PROFILE"
      - name: pii_tier
        type: integer
        source: input
        description: "Privacy office PII tier used by tool_approval_risk_score"
        default: 0
        constraints: ">= 0 and <= 3"
      - name: vpat_score
        type: number
        source: input
        description: "Accessibility conformance score from the vendor VPAT, 0 to 100"
        default: 100.00
        constraints: ">= 0 and <= 100"
      - name: wcag_level
        type: enum
        source: input
        description: "Highest WCAG level claimed"
        default: AA
        constraints: "one of NONE, A, AA, AAA"
      - name: privacy_review_state
        type: enum
        source: system
        description: "Privacy dimension outcome, evolves independently of accessibility"
        default: PENDING
        constraints: "one of PENDING, CLEARED, CONDITIONAL, BLOCKED"
      - name: accessibility_review_state
        type: enum
        source: system
        description: "Accessibility dimension outcome, evolves independently of privacy"
        default: PENDING
        constraints: "one of PENDING, CLEARED, CONDITIONAL, BLOCKED"
      - name: approval_state
        type: enum
        source: system
        description: "Compound state derived from both review dimensions plus risk_score at finalize-review"
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, APPROVED, CONDITIONAL, REJECTED, SUSPENDED"
      - name: risk_score
        type: number
        source: computed
        description: "Computed by tool_approval_risk_score"
        default: 0.00
      - name: approved_version
        type: string
        source: system
        description: "tool_version pinned at the moment approval_state became APPROVED or CONDITIONAL; null otherwise"
      - name: active_placement_count
        type: integer
        source: computed
        description: "Count of this tool's ToolPlacement rows with placement_state == ACTIVE"
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: "Reason recorded by the APPROVED -> SUSPENDED transition; null otherwise"

  - name: ToolReview
    parent: null
    common_fields: false
    fields:
      - name: tool_id
        type: string
        source: input
        description: "FK -> ToolIntegration.id; the tool under review"
      - name: dimension
        type: enum
        source: input
        description: "Review dimension this record decides"
        constraints: "one of PRIVACY, ACCESSIBILITY"
      - name: decision
        type: enum
        source: input
        description: "Reviewer verdict for the dimension"
        constraints: "one of CLEAR, CONDITIONS, BLOCK"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewer; a single user may not decide both dimensions of one tool"
      - name: conditions_note
        type: string
        source: input
        description: "Required when decision == CONDITIONS; null otherwise"

  - name: ToolPlacement
    parent: null
    common_fields: true
    fields:
      - name: tool_id
        type: string
        source: input
        description: "FK -> ToolIntegration.id; the tool placed in the shell"
      - name: shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the shell the tool is placed in"
      - name: placement_state
        type: enum
        source: system
        description: "Placement lifecycle"
        default: REQUESTED
        constraints: "one of REQUESTED, ACTIVE, BLOCKED, REMOVED"
      - name: pinned_tool_version
        type: string
        source: system
        description: "ToolIntegration.approved_version copied at activation; drift from tool_version blocks re-activation"
      - name: blocked_reason
        type: string
        source: system
        description: "Reason recorded when placement_state becomes BLOCKED; null otherwise"

  - name: GradePassback
    parent: null
    common_fields: true
    fields:
      - name: shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; the shell whose grades are passed back"
      - name: term_id
        type: string
        source: system
        description: "FK -> AcademicTerm.id; copied from the shell at staging time"
      - name: passback_state
        type: enum
        source: system
        description: "Passback lifecycle including the dispute cycle"
        default: STAGED
        constraints: "one of STAGED, SUBMITTED, ACCEPTED, RETURNED, DISPUTED, AMENDED"
      - name: variant_applied
        type: enum
        source: system
        description: "Which final_grade_percentage variant produced the current figures"
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINAL"
      - name: staged_enrollment_count
        type: integer
        source: computed
        description: "Count of the shell's Enrollment rows with role == STUDENT and enrollment_state IN {ACTIVE, COMPLETED}"
        default: 0
      - name: submitted_points_total
        type: number
        source: computed
        description: "Ledger total maintained by passback_points_ledger"
        default: 0.00
      - name: accepted_points_total
        type: number
        source: computed
        description: "Ledger bucket maintained by passback_points_ledger"
        default: 0.00
      - name: disputed_points_held
        type: number
        source: computed
        description: "Escrow bucket maintained by passback_points_ledger"
        default: 0.00
      - name: open_dispute_count
        type: integer
        source: computed
        description: "Count of this passback's GradeDispute rows with dispute_state == OPEN"
        default: 0
      - name: amendment_round
        type: integer
        source: system
        description: "Number of DISPUTED -> AMENDED transitions this passback has undergone"
        default: 0
      - name: registrar_note
        type: string
        source: system
        description: "Note recorded by the most recent registrar decision; null before any decision"

  - name: GradeDispute
    parent: null
    common_fields: true
    fields:
      - name: passback_id
        type: string
        source: input
        description: "FK -> GradePassback.id; the accepted passback being disputed"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the student enrollment whose grade is disputed"
      - name: content_item_id
        type: string
        source: input
        description: "FK -> ContentItem.id; the graded item the student disputes"
      - name: claimed_earned_points
        type: number
        source: input
        description: "Points the student claims should have been recorded for the item"
        constraints: ">= 0"
      - name: dispute_state
        type: enum
        source: system
        description: "Dispute lifecycle; branches on resolution outcome"
        default: OPEN
        constraints: "one of OPEN, RESOLVED_UPHELD, RESOLVED_CHANGED"
      - name: held_points
        type: number
        source: computed
        description: "Enrollment.earned_points_total escrowed at filing time; released on resolution"
        default: 0.00
      - name: adjusted_earned_points
        type: number
        source: system
        description: "New Enrollment.earned_points_total written by a RESOLVED_CHANGED outcome; null otherwise"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Student that filed the dispute"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of resolution; null while OPEN"

  - name: ContinuityWindow
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term the window is scoped to"
      - name: shell_id
        type: string
        source: input
        description: "FK -> CourseShell.id; set for shell-scoped windows, null for term-wide windows"
      - name: kind
        type: enum
        source: input
        description: "Continuity window kind"
        constraints: "one of OUTAGE, EXTENSION, MAINTENANCE"
      - name: window_start
        type: datetime
        source: input
        description: "Window start instant (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "Window end instant; must be strictly after window_start"
      - name: window_state
        type: enum
        source: system
        description: "Window lifecycle"
        default: OPEN
        constraints: "one of OPEN, CLOSED, CANCELLED"
      - name: affected_enrollment_count
        type: integer
        source: computed
        description: "For shell-scoped windows: the shell's active_enrollment_count at creation; for term-wide: AcademicTerm.total_active_enrollments at creation"
        default: 0
      - name: extension_days_granted
        type: integer
        source: computed
        description: "For kind == EXTENSION: ceil((window_end - window_start) / 86400 seconds); 0 for other kinds"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the OPEN -> CLOSED transition; null otherwise"

# =============================================================================
# §1.2 State Machine Table
# Two entities carry parallel state dimensions (AcademicTerm, ToolIntegration);
# CourseShell, Enrollment, GradePassback and ToolIntegration each contain a
# cycle; MergeRequest, EnrollmentSyncBatch, RolloverJob, GradeDispute and
# CourseShell provisioning fork on branch decisions with divergent side effects.
# =============================================================================

state_machines:

  - entity: AcademicTerm
    state_field: lifecycle_state
    initial_state: PLANNING
    terminal_states: [ARCHIVED]
    transitions:
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=REGISTRATION_OPEN"
        actor: Registrar
        preconditions:
          - "term_rollover_completion_pct is recomputed first; the resulting rollover_completion_pct >= ROLLOVER_READINESS_PCT (100.00), else ERR_ROLLOVER_INCOMPLETE"
        side_effects:
          - "rollover_completion_pct recomputed by term_rollover_completion_pct and persisted"
          - "increments AcademicTerm.version by 1"
        note: "The eligible-shell set is empty for a brand-new term, so rollover_completion_pct is 100.00 by the empty-set convention and the gate passes."
      - from: REGISTRATION_OPEN
        to: IN_SESSION
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=IN_SESSION"
        actor: Registrar
        preconditions: ["lifecycle_state == REGISTRATION_OPEN"]
        side_effects: ["increments AcademicTerm.version by 1"]
      - from: IN_SESSION
        to: FINALS
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=FINALS"
        actor: Registrar
        preconditions: ["lifecycle_state == IN_SESSION"]
        side_effects: ["increments AcademicTerm.version by 1"]
      - from: FINALS
        to: IN_SESSION
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=IN_SESSION"
        actor: Registrar
        preconditions:
          - "continuity_posture == CONTINUITY_MODE, else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["increments AcademicTerm.version by 1"]
        note: "Academic-continuity reversal: finals are suspended and instruction resumes. Only legal while the posture dimension is in CONTINUITY_MODE — a cross-dimension guard on the same row."
      - from: FINALS
        to: GRADING
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=GRADING"
        actor: Registrar
        preconditions:
          - "lifecycle_state == FINALS"
          - "continuity_posture != CONTINUITY_MODE, else ERR_TERM_POSTURE_FROZEN"
        side_effects: ["increments AcademicTerm.version by 1"]
      - from: GRADING
        to: CLOSED
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=CLOSED"
        actor: Registrar
        preconditions:
          - "open_amendment_count == 0, else ERR_OPEN_DISPUTES_BLOCK_CLOSE"
        side_effects:
          - "cascade hop 1: every CourseShell of this term with provisioning_state IN {PROVISIONED, PUBLISHED} and merged_into_shell_id IS NULL transitions to CONCLUDED, processed in CourseShell.created_at ASC order"
          - "cascade hop 2: each of those CONCLUDED transitions sets that shell's Enrollment rows with enrollment_state == ACTIVE to COMPLETED"
          - "cascade hop 3: each COMPLETED transition zeroes the shell's active_enrollment_count / seat_utilization_pct / overflow_flag and decrements AcademicTerm.total_active_enrollments by the number of rows it completed"
          - "published_shell_count set to 0"
          - "increments AcademicTerm.version by 1"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /academic-terms/{id}/lifecycle-transitions with target_state=ARCHIVED"
        actor: Registrar
        preconditions:
          - "logical clock now >= student_access_end_at, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "every CourseShell of this term with provisioning_state == CONCLUDED transitions to ARCHIVED, in CourseShell.created_at ASC order"
          - "increments AcademicTerm.version by 1"

  - entity: AcademicTerm
    state_field: continuity_posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "POST /academic-terms/{id}/posture-changes with target_posture=ELEVATED"
        actor: LmsAdmin
        preconditions:
          - "lifecycle_state IN {IN_SESSION, FINALS, GRADING}, else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["increments AcademicTerm.version by 1"]
      - from: ELEVATED
        to: CONTINUITY_MODE
        trigger: "POST /academic-terms/{id}/posture-changes with target_posture=CONTINUITY_MODE"
        actor: LmsAdmin
        preconditions:
          - "at least one ContinuityWindow exists with term_id == this term, kind == OUTAGE and window_state == OPEN, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "increments AcademicTerm.version by 1"
        note: "While in CONTINUITY_MODE the posture dimension gates child operations: CourseShell publish, CourseShell unpublish and GradePassback SUBMIT all reject with ERR_TERM_POSTURE_FROZEN."
      - from: CONTINUITY_MODE
        to: ELEVATED
        trigger: "POST /academic-terms/{id}/posture-changes with target_posture=ELEVATED"
        actor: LmsAdmin
        preconditions:
          - "no ContinuityWindow exists with term_id == this term, kind == OUTAGE and window_state == OPEN, else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["increments AcademicTerm.version by 1"]
      - from: ELEVATED
        to: NORMAL
        trigger: "POST /academic-terms/{id}/posture-changes with target_posture=NORMAL"
        actor: LmsAdmin
        preconditions: ["continuity_posture == ELEVATED"]
        side_effects: ["increments AcademicTerm.version by 1"]
        note: "Closes the NORMAL -> ELEVATED -> CONTINUITY_MODE -> ELEVATED -> NORMAL cycle. NORMAL -> CONTINUITY_MODE directly is not a declared transition and rejects with ERR_INVALID_STATE_TRANSITION."

  - entity: CourseShell
    state_field: provisioning_state
    initial_state: REQUESTED
    terminal_states: [REJECTED, PURGED]
    transitions:
      - from: REQUESTED
        to: PROVISIONED
        trigger: "POST /course-shells/{id}/provisioning-decisions with decision=APPROVE"
        actor: LmsAdmin
        preconditions:
          - "the shell's AcademicTerm.lifecycle_state IN {PLANNING, REGISTRATION_OPEN, IN_SESSION}, else ERR_INVALID_STATE_TRANSITION"
          - "owner Person.access_revoked_at IS NULL, else ERR_FERPA_BLOCK_ACTIVE"
        side_effects:
          - "effective_seat_cap set to base_seat_cap"
          - "publish_readiness set to true"
          - "sandbox_expires_at set to term_end_at + SANDBOX_GRACE_DAYS (60) days when shell_type IN {SANDBOX, DEV}; left null for OFFICIAL"
          - "increments CourseShell.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /course-shells/{id}/provisioning-decisions with decision=REJECT"
        actor: LmsAdmin
        preconditions: ["provisioning_state == REQUESTED"]
        side_effects:
          - "reject_reason set from the request body"
          - "storage_mb set to 0.00"
          - "owner Person.sandbox_storage_charge_usd recomputed by sandbox_storage_chargeback"
          - "increments CourseShell.version by 1"
        note: "Divergent branch from the APPROVE fork: no seat cap, no sandbox expiry, and the owner's storage charge is recomputed downward."
      - from: PROVISIONED
        to: PUBLISHED
        trigger: "POST /course-shells/{id}/publish"
        actor: Instructor | LmsAdmin
        preconditions:
          - "shell_type == OFFICIAL, else ERR_SANDBOX_NOT_PUBLISHABLE"
          - "merged_into_shell_id IS NULL, else ERR_SHELL_ALREADY_MERGED"
          - "the shell's AcademicTerm.lifecycle_state IN {REGISTRATION_OPEN, IN_SESSION}, else ERR_INVALID_STATE_TRANSITION"
          - "the shell's AcademicTerm.continuity_posture != CONTINUITY_MODE, else ERR_TERM_POSTURE_FROZEN"
          - "publish_readiness == true, else ERR_SHELL_NOT_PUBLISH_READY"
        side_effects:
          - "AcademicTerm.published_shell_count incremented by 1"
          - "increments CourseShell.version by 1"
      - from: PUBLISHED
        to: PROVISIONED
        trigger: "POST /course-shells/{id}/unpublish, or system cascade from a ToolPlacement transition into BLOCKED"
        actor: Instructor | LmsAdmin | system
        preconditions:
          - "for the actor-driven form: the shell's AcademicTerm.continuity_posture != CONTINUITY_MODE, else ERR_TERM_POSTURE_FROZEN"
        side_effects:
          - "unpublish_reason set (request body reason, or 'tool placement blocked' for the system cascade)"
          - "AcademicTerm.published_shell_count decremented by 1"
          - "increments CourseShell.version by 1"
        note: "Closes the PROVISIONED -> PUBLISHED -> PROVISIONED cycle. The system cascade form ignores the posture gate because it is a safety response, not an authoring action."
      - from: PROVISIONED
        to: MERGED
        trigger: "system: MergeRequest APPROVED -> APPLIED"
        actor: system
        preconditions:
          - "this shell is the MergeRequest.child_shell_id"
        side_effects:
          - "merged_into_shell_id set to the MergeRequest.parent_shell_id"
          - "active_enrollment_count, waitlisted_enrollment_count, seat_utilization_pct set to 0 / 0 / 0.00 and overflow_flag set to false"
          - "increments CourseShell.version by 1"
      - from: PUBLISHED
        to: MERGED
        trigger: "system: MergeRequest APPROVED -> APPLIED"
        actor: system
        preconditions: ["this shell is the MergeRequest.child_shell_id"]
        side_effects:
          - "merged_into_shell_id set to the MergeRequest.parent_shell_id"
          - "AcademicTerm.published_shell_count decremented by 1"
          - "active_enrollment_count, waitlisted_enrollment_count, seat_utilization_pct set to 0 / 0 / 0.00 and overflow_flag set to false"
          - "increments CourseShell.version by 1"
      - from: MERGED
        to: PROVISIONED
        trigger: "system: MergeRequest APPLIED -> REVERSED"
        actor: system
        preconditions: ["this shell is the MergeRequest.child_shell_id"]
        side_effects:
          - "merged_into_shell_id set to null"
          - "active_enrollment_count / waitlisted_enrollment_count / seat_utilization_pct / overflow_flag recomputed from the returned Enrollment rows"
          - "increments CourseShell.version by 1"
        note: "Compensating transition; a shell that was PUBLISHED before the merge returns to PROVISIONED, not to PUBLISHED, and must be published again explicitly."
      - from: PROVISIONED
        to: CONCLUDED
        trigger: "POST /course-shells/{id}/lifecycle-transitions with target_state=CONCLUDED, or system cascade from AcademicTerm GRADING -> CLOSED"
        actor: Registrar | system
        preconditions:
          - "merged_into_shell_id IS NULL, else ERR_SHELL_ALREADY_MERGED"
        side_effects:
          - "every Enrollment of this shell with enrollment_state == ACTIVE transitions to COMPLETED, in Enrollment.created_at ASC order"
          - "active_enrollment_count set to 0, seat_utilization_pct set to 0.00, overflow_flag set to false"
          - "AcademicTerm.total_active_enrollments decremented by the number of rows completed"
          - "increments CourseShell.version by 1"
      - from: PUBLISHED
        to: CONCLUDED
        trigger: "POST /course-shells/{id}/lifecycle-transitions with target_state=CONCLUDED, or system cascade from AcademicTerm GRADING -> CLOSED"
        actor: Registrar | system
        preconditions:
          - "merged_into_shell_id IS NULL, else ERR_SHELL_ALREADY_MERGED"
        side_effects:
          - "every Enrollment of this shell with enrollment_state == ACTIVE transitions to COMPLETED, in Enrollment.created_at ASC order"
          - "active_enrollment_count set to 0, seat_utilization_pct set to 0.00, overflow_flag set to false"
          - "AcademicTerm.total_active_enrollments decremented by the number of rows completed"
          - "AcademicTerm.published_shell_count decremented by 1"
          - "increments CourseShell.version by 1"
      - from: CONCLUDED
        to: ARCHIVED
        trigger: "POST /course-shells/{id}/lifecycle-transitions with target_state=ARCHIVED, or system cascade from AcademicTerm CLOSED -> ARCHIVED"
        actor: Registrar | system
        preconditions:
          - "the shell's AcademicTerm.lifecycle_state IN {CLOSED, ARCHIVED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "every ToolPlacement of this shell with placement_state IN {REQUESTED, ACTIVE, BLOCKED} transitions to REMOVED, in ToolPlacement.created_at ASC order"
          - "each removal decrements that ToolIntegration.active_placement_count when the placement was ACTIVE and recomputes that tool's risk_score"
          - "blocked_placement_count set to 0 and publish_readiness set to true"
          - "increments CourseShell.version by 1"
      - from: ARCHIVED
        to: PURGED
        trigger: "POST /course-shells/{id}/lifecycle-transitions with target_state=PURGED"
        actor: Registrar
        preconditions:
          - "the shell's AcademicTerm.retention_class != LEGAL_HOLD, else ERR_RETENTION_HOLD_ACTIVE"
          - "logical clock now >= the shell's AcademicTerm.retention_purge_at, else ERR_PURGE_NOT_DUE"
        side_effects:
          - "every ContentItem of this shell has copy_state set to SKIPPED and storage_mb set to 0.00"
          - "content_item_count set to 0, total_points_possible set to 0.00, storage_mb set to 0.00"
          - "owner Person.sandbox_storage_charge_usd recomputed by sandbox_storage_chargeback"
          - "the shell is excluded from GET /course-shells results unless provisioning_state=PURGED is passed explicitly (soft-delete filter semantics)"
          - "increments CourseShell.version by 1"

  - entity: Enrollment
    state_field: enrollment_state
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /enrollments with requested_state omitted or requested_state=ACTIVE"
        actor: Registrar
        preconditions:
          - "shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
          - "no other Enrollment exists for the same (shell_id, person_id) with enrollment_state IN {ACTIVE, WAITLISTED, DROPPED}, else ERR_ROLE_CONFLICT"
          - "when role == STUDENT: shell.active_enrollment_count < shell.effective_seat_cap, else ERR_SEAT_CAP_EXCEEDED"
        side_effects:
          - "shell.active_enrollment_count incremented by 1 when role == STUDENT"
          - "shell.seat_utilization_pct and shell.overflow_flag recomputed"
          - "AcademicTerm.total_active_enrollments incremented by 1 when role == STUDENT"
      - from: null
        to: WAITLISTED
        trigger: "POST /enrollments with requested_state=WAITLISTED"
        actor: Registrar
        preconditions:
          - "role == STUDENT, else ERR_INVALID_REQUEST"
          - "shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
          - "no other Enrollment exists for the same (shell_id, person_id) with enrollment_state IN {ACTIVE, WAITLISTED, DROPPED}, else ERR_ROLE_CONFLICT"
        side_effects:
          - "waitlist_position set to shell.waitlisted_enrollment_count + 1"
          - "shell.waitlisted_enrollment_count incremented by 1"
      - from: WAITLISTED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/transitions with action=PROMOTE, or system promotion cascaded by a drop or by EnrollmentSyncBatch apply"
        actor: Registrar | system
        preconditions:
          - "waitlist_promotion_capacity yields promotable_count >= 1 for the shell, else ERR_SEAT_CAP_EXCEEDED"
          - "shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
        side_effects:
          - "waitlist_position set to null; the remaining WAITLISTED rows of the shell are renumbered 1..n in waitlist_position ASC order (tie-break created_at ASC)"
          - "shell.waitlisted_enrollment_count decremented by 1; shell.active_enrollment_count incremented by 1"
          - "shell.effective_seat_cap, shell.seat_utilization_pct and shell.overflow_flag recomputed by waitlist_promotion_capacity"
          - "when shell.overflow_flag flips false -> true, AcademicTerm.overflow_shell_count incremented by 1"
          - "AcademicTerm.total_active_enrollments incremented by 1"
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /enrollments/{id}/transitions with action=DROP, or system from an EnrollmentSyncBatch DROP operation"
        actor: Registrar | system
        preconditions:
          - "shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
        side_effects:
          - "dropped_at set to the logical clock now"
          - "cascade hop 1: shell.active_enrollment_count decremented by 1 and AcademicTerm.total_active_enrollments decremented by 1"
          - "cascade hop 2: that freed seat re-runs waitlist_promotion_capacity; while promotable_count >= 1 the head of the shell's waitlist (waitlist_position ASC, tie-break created_at ASC) transitions WAITLISTED -> ACTIVE"
          - "cascade hop 3: each promotion recomputes shell.effective_seat_cap / seat_utilization_pct / overflow_flag"
          - "cascade hop 4: an overflow_flag change bubbles up to AcademicTerm.overflow_shell_count"
      - from: DROPPED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/transitions with action=REINSTATE"
        actor: Registrar
        preconditions:
          - "logical clock now <= AcademicTerm.add_drop_deadline_at, else ERR_ADD_DROP_WINDOW_CLOSED"
          - "shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
          - "when role == STUDENT: shell.active_enrollment_count < shell.effective_seat_cap, else ERR_SEAT_CAP_EXCEEDED"
        side_effects:
          - "reinstatement_count incremented by 1; dropped_at set to null"
          - "shell.active_enrollment_count incremented by 1 when role == STUDENT; seat_utilization_pct and overflow_flag recomputed"
          - "AcademicTerm.total_active_enrollments incremented by 1 when role == STUDENT"
        note: "Closes the ACTIVE -> DROPPED -> ACTIVE cycle; the cycle is bounded by the add/drop deadline, not by a loop counter."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /enrollments/{id}/transitions with action=COMPLETE, or system cascade from CourseShell -> CONCLUDED"
        actor: Registrar | system
        preconditions:
          - "shell.provisioning_state IN {PUBLISHED, CONCLUDED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
        side_effects:
          - "shell.active_enrollment_count decremented by 1 and AcademicTerm.total_active_enrollments decremented by 1"
          - "shell.seat_utilization_pct and shell.overflow_flag recomputed"

  - entity: EnrollmentSyncBatch
    state_field: batch_state
    initial_state: DRAFT
    terminal_states: [APPLIED, FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /enrollment-sync-batches/{id}/transitions with action=VALIDATE"
        actor: Registrar
        preconditions:
          - "term.lifecycle_state IN {REGISTRATION_OPEN, IN_SESSION}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "each operation is checked in array order; an operation is valid when its shell_id resolves to a CourseShell with term_id == this batch's term_id and provisioning_state IN {PROVISIONED, PUBLISHED} and its person_id resolves to a Person with access_revoked_at IS NULL"
          - "validated_operation_count and rejected_operation_count set from that pass"
          - "increments EnrollmentSyncBatch.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /enrollment-sync-batches/{id}/transitions with action=CANCEL"
        actor: Registrar
        preconditions: ["batch_state == DRAFT"]
        side_effects: ["increments EnrollmentSyncBatch.version by 1"]
      - from: VALIDATED
        to: APPLIED
        trigger: "POST /enrollment-sync-batches/{id}/transitions with action=APPLY"
        actor: Registrar
        preconditions:
          - "rejected_operation_count == 0, else the batch takes the VALIDATED -> FAILED branch instead"
          - "batch_seq == term.sis_sync_epoch + 1, else ERR_SYNC_EPOCH_OUT_OF_ORDER"
          - "every operation's shell is still in provisioning_state IN {PROVISIONED, PUBLISHED}, else the batch takes the VALIDATED -> FAILED branch instead"
        side_effects:
          - "operations are executed in array order; ADD creates an Enrollment (ACTIVE when the shell has a free seat under waitlist_promotion_capacity, otherwise WAITLISTED) with batch_id set to this batch; DROP transitions the matching ACTIVE Enrollment to DROPPED"
          - "applied_add_count and applied_drop_count set"
          - "each DROP's freed seat cascades WAITLISTED -> ACTIVE promotions exactly as the Enrollment ACTIVE -> DROPPED transition specifies; promoted_from_waitlist_count records how many fired"
          - "term.sis_sync_epoch incremented by 1"
          - "increments EnrollmentSyncBatch.version by 1"
      - from: VALIDATED
        to: FAILED
        trigger: "POST /enrollment-sync-batches/{id}/transitions with action=APPLY when the batch is unapplicable"
        actor: Registrar
        preconditions:
          - "rejected_operation_count > 0, or at least one operation's shell has left {PROVISIONED, PUBLISHED} since validation"
        side_effects:
          - "failure_reason set; no Enrollment row is created or mutated (all-or-nothing)"
          - "term.sis_sync_epoch left unchanged"
          - "increments EnrollmentSyncBatch.version by 1"
        note: "Divergent branch of the APPLY fork: same trigger as VALIDATED -> APPLIED, opposite side-effect set, and the response is 200 with the FAILED batch rather than an error envelope."

  - entity: MergeRequest
    state_field: merge_state
    initial_state: DRAFT
    terminal_states: [DECLINED, REVERSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /merge-requests/{id}/transitions with action=SUBMIT"
        actor: LmsAdmin
        preconditions:
          - "parent_shell.provisioning_state IN {PROVISIONED, PUBLISHED} and child_shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["increments MergeRequest.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /merge-requests/{id}/transitions with action=APPROVE"
        actor: LmsAdmin
        preconditions:
          - "the acting X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "child_shell.merged_into_shell_id IS NULL, else ERR_SHELL_ALREADY_MERGED"
          - "parent_shell.term_id == child_shell.term_id, else ERR_CROSS_TERM_MERGE"
          - "child_shell.absorbed_child_count == 0, else ERR_MERGE_CHAIN_FORBIDDEN"
        side_effects:
          - "decided_by_user_id set to the acting X-User-ID"
          - "increments MergeRequest.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /merge-requests/{id}/transitions with action=DECLINE"
        actor: LmsAdmin
        preconditions:
          - "the acting X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "decided_by_user_id set to the acting X-User-ID"
          - "no shell or enrollment is touched"
          - "increments MergeRequest.version by 1"
        note: "Divergent branch of the decision fork: APPROVE arms the APPLY step, DECLINE is terminal and leaves both shells untouched."
      - from: APPROVED
        to: APPLIED
        trigger: "POST /merge-requests/{id}/transitions with action=APPLY"
        actor: LmsAdmin
        preconditions:
          - "child_shell.merged_into_shell_id IS NULL, else ERR_SHELL_ALREADY_MERGED"
        side_effects:
          - "seat_ledger_before set to the term's total_active_enrollments read immediately before any mutation"
          - "every Enrollment of the child shell with enrollment_state == ACTIVE is relocated in created_at ASC order: shell_id set to parent_shell_id and merged_from_shell_id set to child_shell_id; moved_enrollment_count records how many"
          - "child shell transitions PROVISIONED -> MERGED (or PUBLISHED -> MERGED)"
          - "parent_shell.active_enrollment_count / seat_utilization_pct / overflow_flag recomputed; parent_shell.absorbed_child_count incremented by 1"
          - "NO waitlist promotion is triggered on the parent by this transition; an over-cap parent simply sets overflow_flag true"
          - "seat_ledger_after set to the term's total_active_enrollments after the relocation; enrollment_seat_ledger requires seat_ledger_after == seat_ledger_before"
          - "increments MergeRequest.version by 1"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /merge-requests/{id}/transitions with action=REVERSE"
        actor: LmsAdmin
        preconditions:
          - "parent_shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "every Enrollment with shell_id == parent_shell_id and merged_from_shell_id == child_shell_id is returned in created_at ASC order: shell_id set back to child_shell_id and merged_from_shell_id set to null; reversed_enrollment_count records how many"
          - "child shell transitions MERGED -> PROVISIONED"
          - "parent_shell.absorbed_child_count decremented by 1; both shells' active_enrollment_count / seat_utilization_pct / overflow_flag recomputed"
          - "AcademicTerm.total_active_enrollments is left at its pre-APPLY value; enrollment_seat_ledger must hold with zero drift"
          - "increments MergeRequest.version by 1"
        note: "Compensating transition for APPLY; the conserved quantity is the term's active STUDENT headcount."

  - entity: RolloverJob
    state_field: job_state
    initial_state: DRAFT
    terminal_states: [COMPLETED, COMPENSATED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /rollover-jobs/{id}/transitions with action=VALIDATE"
        actor: LmsAdmin
        preconditions:
          - "source_shell.provisioning_state IN {CONCLUDED, ARCHIVED}, else ERR_ROLLOVER_SOURCE_INELIGIBLE"
          - "target_shell.provisioning_state == PROVISIONED, else ERR_INVALID_STATE_TRANSITION"
          - "target_shell.content_item_count == 0, else ERR_ROLLOVER_TARGET_NOT_EMPTY"
          - "target_term_id == target_shell.term_id, else ERR_INVALID_REQUEST"
        side_effects:
          - "eligible_item_count set to the count of the source shell's ContentItem rows with copy_state != SKIPPED"
          - "increments RolloverJob.version by 1"
      - from: VALIDATED
        to: COPYING
        trigger: "POST /rollover-jobs/{id}/transitions with action=EXECUTE"
        actor: LmsAdmin
        preconditions:
          - "job_state == VALIDATED"
          - "target_shell.provisioning_state == PROVISIONED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "for each source ContentItem with copy_state != SKIPPED, in created_at ASC order: when strip_submissions is false and has_submissions is true the item is skipped and skipped_item_count incremented; otherwise a copy is created in the target shell with copy_state COPIED, source_item_id set to the source item's id, submission_count 0 and has_submissions false when strip_submissions is true"
          - "when strip_dates is true the copy's due_at is set to null and date_stripped true and date_stripped_count incremented; when strip_dates is false the copy's due_at is set by rollover_due_date_projection under date_shift_mode and date_shifted_count incremented"
          - "copied_item_count and copied_storage_mb accumulated; target_shell.storage_mb, content_item_count and total_points_possible recomputed"
          - "when strip_grades is true no Enrollment grade record is copied; when false each source enrollment's earned_points_total is copied onto the matching (person_id, target shell) Enrollment when one exists"
          - "increments RolloverJob.version by 1"
      - from: COPYING
        to: COMPLETED
        trigger: "system: automatic, in the same request, once copied_item_count + skipped_item_count == eligible_item_count and the target shell is within its storage quota"
        actor: system
        preconditions:
          - "for target_shell.shell_type IN {SANDBOX, DEV}: target_shell.storage_mb <= SANDBOX_STORAGE_QUOTA_MB (500)"
        side_effects:
          - "target_term.rollover_completion_pct recomputed by term_rollover_completion_pct"
          - "increments RolloverJob.version by 1"
      - from: COPYING
        to: FAILED
        trigger: "system: automatic, in the same request, when the copy pushed a SANDBOX or DEV target above SANDBOX_STORAGE_QUOTA_MB"
        actor: system
        preconditions:
          - "target_shell.shell_type IN {SANDBOX, DEV} and target_shell.storage_mb > SANDBOX_STORAGE_QUOTA_MB (500)"
        side_effects:
          - "failure_reason set to 'sandbox storage quota exceeded'"
          - "the copies remain in place until COMPENSATE runs, so target_shell.storage_mb stays above quota and target_shell is observable in its over-quota state"
          - "target_term.rollover_completion_pct is NOT advanced"
          - "increments RolloverJob.version by 1"
        note: "Divergent branch of the EXECUTE fork; the COMPLETED branch advances the term's rollover progress, the FAILED branch does not and arms compensation."
      - from: FAILED
        to: COMPENSATED
        trigger: "POST /rollover-jobs/{id}/transitions with action=COMPENSATE"
        actor: LmsAdmin
        preconditions: ["job_state == FAILED"]
        side_effects:
          - "every ContentItem with shell_id == target_shell_id and copy_state == COPIED and source_item_id pointing at a ContentItem of the source shell has copy_state set to SKIPPED and storage_mb set to 0.00"
          - "target_shell.storage_mb reduced by copied_storage_mb, restoring its pre-EXECUTE value exactly; content_item_count and total_points_possible recomputed"
          - "source_shell.storage_mb is left untouched, so the storage megabytes conserved across the source/target pair return to their pre-EXECUTE sum"
          - "copied_item_count / date_stripped_count / date_shifted_count left as the audit record of what was undone"
          - "increments RolloverJob.version by 1"
        note: "Compensating transition for EXECUTE; the conserved quantity is total stored megabytes across the source/target shell pair."

  - entity: ToolIntegration
    state_field: privacy_review_state
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /tool-reviews with dimension=PRIVACY and decision=CLEAR"
        actor: PrivacyReviewer
        preconditions:
          - "tool.approval_state == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "no ToolReview already exists for this tool with dimension == PRIVACY, else ERR_REVIEW_DIMENSION_CONFLICT"
          - "the acting X-User-ID is not the reviewer_user_id of this tool's ACCESSIBILITY ToolReview, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["increments ToolIntegration.version by 1"]
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /tool-reviews with dimension=PRIVACY and decision=CONDITIONS"
        actor: PrivacyReviewer
        preconditions:
          - "tool.approval_state == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "conditions_note is present and non-empty, else ERR_INVALID_REQUEST"
          - "no ToolReview already exists for this tool with dimension == PRIVACY, else ERR_REVIEW_DIMENSION_CONFLICT"
          - "the acting X-User-ID is not the reviewer_user_id of this tool's ACCESSIBILITY ToolReview, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["increments ToolIntegration.version by 1"]
      - from: PENDING
        to: BLOCKED
        trigger: "POST /tool-reviews with dimension=PRIVACY and decision=BLOCK"
        actor: PrivacyReviewer
        preconditions:
          - "tool.approval_state == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "no ToolReview already exists for this tool with dimension == PRIVACY, else ERR_REVIEW_DIMENSION_CONFLICT"
          - "the acting X-User-ID is not the reviewer_user_id of this tool's ACCESSIBILITY ToolReview, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "increments ToolIntegration.version by 1"
        note: "A BLOCK on either dimension is an absolute veto at FINALIZE_REVIEW regardless of risk_score."
      - from: CLEARED
        to: PENDING
        trigger: "system: ToolIntegration SUSPENDED -> UNDER_REVIEW (action=REOPEN_REVIEW)"
        actor: system
        preconditions: ["tool.approval_state == SUSPENDED"]
        side_effects: ["the tool's existing ToolReview rows are retained as history but no longer decide the dimension"]
      - from: CONDITIONAL
        to: PENDING
        trigger: "system: ToolIntegration SUSPENDED -> UNDER_REVIEW (action=REOPEN_REVIEW)"
        actor: system
        preconditions: ["tool.approval_state == SUSPENDED"]
        side_effects: ["the tool's existing ToolReview rows are retained as history but no longer decide the dimension"]

  - entity: ToolIntegration
    state_field: accessibility_review_state
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /tool-reviews with dimension=ACCESSIBILITY and decision=CLEAR"
        actor: AccessibilityReviewer
        preconditions:
          - "tool.approval_state == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "no ToolReview already exists for this tool with dimension == ACCESSIBILITY, else ERR_REVIEW_DIMENSION_CONFLICT"
          - "the acting X-User-ID is not the reviewer_user_id of this tool's PRIVACY ToolReview, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["increments ToolIntegration.version by 1"]
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /tool-reviews with dimension=ACCESSIBILITY and decision=CONDITIONS"
        actor: AccessibilityReviewer
        preconditions:
          - "tool.approval_state == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "conditions_note is present and non-empty, else ERR_INVALID_REQUEST"
          - "no ToolReview already exists for this tool with dimension == ACCESSIBILITY, else ERR_REVIEW_DIMENSION_CONFLICT"
          - "the acting X-User-ID is not the reviewer_user_id of this tool's PRIVACY ToolReview, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["increments ToolIntegration.version by 1"]
      - from: PENDING
        to: BLOCKED
        trigger: "POST /tool-reviews with dimension=ACCESSIBILITY and decision=BLOCK"
        actor: AccessibilityReviewer
        preconditions:
          - "tool.approval_state == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "no ToolReview already exists for this tool with dimension == ACCESSIBILITY, else ERR_REVIEW_DIMENSION_CONFLICT"
          - "the acting X-User-ID is not the reviewer_user_id of this tool's PRIVACY ToolReview, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["increments ToolIntegration.version by 1"]
      - from: CLEARED
        to: PENDING
        trigger: "system: ToolIntegration SUSPENDED -> UNDER_REVIEW (action=REOPEN_REVIEW)"
        actor: system
        preconditions: ["tool.approval_state == SUSPENDED"]
        side_effects: ["the tool's existing ToolReview rows are retained as history but no longer decide the dimension"]
      - from: CONDITIONAL
        to: PENDING
        trigger: "system: ToolIntegration SUSPENDED -> UNDER_REVIEW (action=REOPEN_REVIEW)"
        actor: system
        preconditions: ["tool.approval_state == SUSPENDED"]
        side_effects: ["the tool's existing ToolReview rows are retained as history but no longer decide the dimension"]

  - entity: ToolIntegration
    state_field: approval_state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /tool-integrations/{id}/transitions with action=OPEN_REVIEW"
        actor: LmsAdmin
        preconditions:
          - "privacy_review_state == PENDING and accessibility_review_state == PENDING"
        side_effects: ["increments ToolIntegration.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tool-integrations/{id}/transitions with action=FINALIZE_REVIEW"
        actor: LmsAdmin
        preconditions:
          - "privacy_review_state != PENDING and accessibility_review_state != PENDING, else ERR_REVIEW_INCOMPLETE"
          - "neither dimension is BLOCKED"
          - "both dimensions are CLEARED and the freshly computed risk_score < RISK_CONDITIONAL_THRESHOLD (40.00)"
        side_effects:
          - "risk_score computed by tool_approval_risk_score and persisted"
          - "approved_version set to the current tool_version"
          - "increments ToolIntegration.version by 1"
      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "POST /tool-integrations/{id}/transitions with action=FINALIZE_REVIEW"
        actor: LmsAdmin
        preconditions:
          - "privacy_review_state != PENDING and accessibility_review_state != PENDING, else ERR_REVIEW_INCOMPLETE"
          - "neither dimension is BLOCKED"
          - "at least one dimension is CONDITIONAL, or the freshly computed risk_score is in [RISK_CONDITIONAL_THRESHOLD (40.00), RISK_REJECT_THRESHOLD (70.00))"
        side_effects:
          - "risk_score computed by tool_approval_risk_score and persisted"
          - "approved_version set to the current tool_version"
          - "increments ToolIntegration.version by 1"
        note: "Middle branch of the three-way FINALIZE_REVIEW fork; CONDITIONAL tools may still be placed, unlike REJECTED ones."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /tool-integrations/{id}/transitions with action=FINALIZE_REVIEW"
        actor: LmsAdmin
        preconditions:
          - "privacy_review_state != PENDING and accessibility_review_state != PENDING, else ERR_REVIEW_INCOMPLETE"
          - "either dimension is BLOCKED, or the freshly computed risk_score >= RISK_REJECT_THRESHOLD (70.00)"
        side_effects:
          - "risk_score computed by tool_approval_risk_score and persisted"
          - "approved_version left null"
          - "every ToolPlacement of this tool with placement_state IN {REQUESTED, ACTIVE} transitions to BLOCKED, in ToolPlacement.created_at ASC order, with blocked_reason 'tool rejected'"
          - "increments ToolIntegration.version by 1"
        note: "Third branch of the FINALIZE_REVIEW fork; only this branch cascades into placements."
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /tool-integrations/{id}/transitions with action=SUSPEND"
        actor: LmsAdmin
        preconditions: ["approval_state IN {APPROVED, CONDITIONAL}"]
        side_effects:
          - "suspension_reason set from the request body reason (default 'privacy incident')"
          - "cascade hop 1: every ToolPlacement of this tool with placement_state IN {REQUESTED, ACTIVE} transitions to BLOCKED, in ToolPlacement.created_at ASC order"
          - "cascade hop 2: each of those BLOCKED transitions increments its CourseShell.blocked_placement_count and sets that shell's publish_readiness to false"
          - "cascade hop 3: each shell whose publish_readiness just became false and whose provisioning_state == PUBLISHED transitions PUBLISHED -> PROVISIONED with unpublish_reason 'tool placement blocked'"
          - "cascade hop 4: each of those unpublish transitions decrements AcademicTerm.published_shell_count by 1"
          - "active_placement_count set to 0 and risk_score recomputed"
          - "increments ToolIntegration.version by 1"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /tool-integrations/{id}/transitions with action=SUSPEND"
        actor: LmsAdmin
        preconditions: ["approval_state IN {APPROVED, CONDITIONAL}"]
        side_effects:
          - "identical cascade to the APPROVED -> SUSPENDED transition"
          - "increments ToolIntegration.version by 1"
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "POST /tool-integrations/{id}/transitions with action=REOPEN_REVIEW"
        actor: LmsAdmin
        preconditions: ["approval_state == SUSPENDED"]
        side_effects:
          - "privacy_review_state and accessibility_review_state both reset to PENDING"
          - "approved_version set to null; suspension_reason left as history"
          - "increments ToolIntegration.version by 1"
        note: "Closes the UNDER_REVIEW -> APPROVED -> SUSPENDED -> UNDER_REVIEW cycle; a re-review requires two fresh ToolReview rows."

  - entity: ToolPlacement
    state_field: placement_state
    initial_state: REQUESTED
    terminal_states: [REMOVED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /tool-placements/{id}/transitions with action=ACTIVATE"
        actor: Instructor | LmsAdmin
        preconditions:
          - "tool.approval_state IN {APPROVED, CONDITIONAL}, else ERR_TOOL_NOT_APPROVED"
          - "tool.approved_version == tool.tool_version, else ERR_TOOL_VERSION_DRIFT"
          - "shell.provisioning_state IN {PROVISIONED, PUBLISHED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
          - "when tool.data_sharing_scope != NONE: no Enrollment of the shell with enrollment_state IN {ACTIVE, WAITLISTED} belongs to a Person with ferpa_block == true, else ERR_FERPA_BLOCK_ACTIVE"
        side_effects:
          - "pinned_tool_version set to tool.approved_version"
          - "tool.active_placement_count incremented by 1 and tool.risk_score recomputed by tool_approval_risk_score"
          - "shell.publish_readiness recomputed"
          - "increments ToolPlacement.version by 1"
      - from: REQUESTED
        to: BLOCKED
        trigger: "system: ToolIntegration FINALIZE_REVIEW -> REJECTED, or SUSPEND"
        actor: system
        preconditions: ["placement_state == REQUESTED"]
        side_effects:
          - "blocked_reason set; shell.blocked_placement_count incremented by 1; shell.publish_readiness set to false"
          - "increments ToolPlacement.version by 1"
      - from: ACTIVE
        to: BLOCKED
        trigger: "system: ToolIntegration FINALIZE_REVIEW -> REJECTED, or SUSPEND"
        actor: system
        preconditions: ["placement_state == ACTIVE"]
        side_effects:
          - "blocked_reason set; shell.blocked_placement_count incremented by 1; shell.publish_readiness set to false"
          - "tool.active_placement_count decremented by 1"
          - "increments ToolPlacement.version by 1"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /tool-placements/{id}/transitions with action=REMOVE, or system cascade from CourseShell CONCLUDED -> ARCHIVED"
        actor: Instructor | LmsAdmin | system
        preconditions: ["placement_state == ACTIVE"]
        side_effects:
          - "tool.active_placement_count decremented by 1 and tool.risk_score recomputed"
          - "shell.publish_readiness recomputed"
          - "increments ToolPlacement.version by 1"
      - from: BLOCKED
        to: REMOVED
        trigger: "POST /tool-placements/{id}/transitions with action=REMOVE, or system cascade from CourseShell CONCLUDED -> ARCHIVED"
        actor: Instructor | LmsAdmin | system
        preconditions: ["placement_state == BLOCKED"]
        side_effects:
          - "shell.blocked_placement_count decremented by 1 and shell.publish_readiness recomputed"
          - "increments ToolPlacement.version by 1"
      - from: REQUESTED
        to: REMOVED
        trigger: "POST /tool-placements/{id}/transitions with action=REMOVE, or system cascade from CourseShell CONCLUDED -> ARCHIVED"
        actor: Instructor | LmsAdmin | system
        preconditions: ["placement_state == REQUESTED"]
        side_effects:
          - "shell.publish_readiness recomputed"
          - "increments ToolPlacement.version by 1"

  - entity: GradePassback
    state_field: passback_state
    initial_state: STAGED
    terminal_states: []
    transitions:
      - from: null
        to: STAGED
        trigger: "POST /grade-passbacks"
        actor: Instructor
        preconditions:
          - "shell.provisioning_state IN {PUBLISHED, CONCLUDED}, else ERR_SHELL_STATE_BLOCKS_ENROLLMENT"
          - "the shell's AcademicTerm.lifecycle_state IN {FINALS, GRADING}, else ERR_INVALID_STATE_TRANSITION"
          - "no other GradePassback exists for this shell_id, else ERR_DUPLICATE_PASSBACK"
        side_effects:
          - "term_id copied from the shell"
          - "staged_enrollment_count set to the count of the shell's Enrollment rows with role == STUDENT and enrollment_state IN {ACTIVE, COMPLETED}"
          - "each staged Enrollment.provisional_grade_pct computed by final_grade_percentage variant PROVISIONAL"
          - "variant_applied set to PROVISIONAL"
      - from: STAGED
        to: SUBMITTED
        trigger: "POST /grade-passbacks/{id}/transitions with action=SUBMIT"
        actor: Instructor
        preconditions:
          - "the shell's AcademicTerm.continuity_posture != CONTINUITY_MODE, else ERR_TERM_POSTURE_FROZEN"
          - "no staged Enrollment belongs to a Person with ferpa_block == true, else ERR_FERPA_BLOCK_ACTIVE"
          - "at least one staged Enrollment has graded_points_possible > 0, else ERR_NO_GRADES_STAGED"
        side_effects:
          - "variant_applied set to FINAL"
          - "each staged Enrollment.final_grade_pct computed by final_grade_percentage variant FINAL"
          - "submitted_points_total set to the sum of the staged Enrollment rows' earned_points_total; accepted_points_total set to 0.00; disputed_points_held set to 0.00"
          - "increments GradePassback.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grade-passbacks/{id}/registrar-decisions with decision=ACCEPT"
        actor: Registrar
        preconditions: ["passback_state == SUBMITTED"]
        side_effects:
          - "accepted_points_total set to submitted_points_total (passback_points_ledger invariant holds with disputed_points_held 0.00)"
          - "registrar_note set from the request body note when present"
          - "increments GradePassback.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /grade-passbacks/{id}/registrar-decisions with decision=RETURN"
        actor: Registrar
        preconditions: ["passback_state == SUBMITTED"]
        side_effects:
          - "accepted_points_total left at 0.00; registrar_note set"
          - "increments GradePassback.version by 1"
        note: "Divergent branch of the registrar decision fork; RETURN sends the passback back into the authoring cycle instead of the dispute cycle."
      - from: RETURNED
        to: STAGED
        trigger: "POST /grade-passbacks/{id}/transitions with action=RESTAGE"
        actor: Instructor
        preconditions: ["passback_state == RETURNED"]
        side_effects:
          - "variant_applied set back to PROVISIONAL; each staged Enrollment.provisional_grade_pct recomputed and final_grade_pct set to null"
          - "submitted_points_total set to 0.00"
          - "increments GradePassback.version by 1"
        note: "Closes the STAGED -> SUBMITTED -> RETURNED -> STAGED cycle."
      - from: ACCEPTED
        to: DISPUTED
        trigger: "system: first GradeDispute filed against this passback (POST /grade-disputes)"
        actor: system
        preconditions: ["passback_state == ACCEPTED"]
        side_effects:
          - "open_dispute_count incremented by 1"
          - "accepted_points_total decremented by the dispute's held_points and disputed_points_held incremented by the same amount (passback_points_ledger invariant preserved)"
          - "AcademicTerm.open_amendment_count incremented by 1"
          - "increments GradePassback.version by 1"
      - from: DISPUTED
        to: ACCEPTED
        trigger: "system: the last OPEN GradeDispute of this passback resolves and every resolution was RESOLVED_UPHELD"
        actor: system
        preconditions: ["open_dispute_count reaches 0 with zero RESOLVED_CHANGED resolutions in this dispute round"]
        side_effects:
          - "AcademicTerm.open_amendment_count decremented by 1"
          - "increments GradePassback.version by 1"
        note: "Closes the ACCEPTED -> DISPUTED -> ACCEPTED cycle with zero ledger drift."
      - from: DISPUTED
        to: AMENDED
        trigger: "system: the last OPEN GradeDispute of this passback resolves and at least one resolution was RESOLVED_CHANGED"
        actor: system
        preconditions: ["open_dispute_count reaches 0 with at least one RESOLVED_CHANGED resolution in this dispute round"]
        side_effects:
          - "amendment_round incremented by 1"
          - "AcademicTerm.open_amendment_count left incremented, which blocks AcademicTerm GRADING -> CLOSED with ERR_OPEN_DISPUTES_BLOCK_CLOSE"
          - "increments GradePassback.version by 1"
      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /grade-passbacks/{id}/transitions with action=SUBMIT"
        actor: Instructor
        preconditions:
          - "the shell's AcademicTerm.continuity_posture != CONTINUITY_MODE, else ERR_TERM_POSTURE_FROZEN"
          - "open_dispute_count == 0, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "each staged Enrollment.final_grade_pct recomputed by final_grade_percentage variant FINAL"
          - "AcademicTerm.open_amendment_count decremented by 1"
          - "increments GradePassback.version by 1"
        note: "Second cycle on this entity: AMENDED -> SUBMITTED -> ACCEPTED -> DISPUTED -> AMENDED."

  - entity: GradeDispute
    state_field: dispute_state
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_CHANGED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /grade-disputes"
        actor: Student
        preconditions:
          - "passback.passback_state IN {ACCEPTED, DISPUTED}, else ERR_INVALID_STATE_TRANSITION"
          - "the acting X-User-ID equals the Person.id referenced by the enrollment's person_id, else ERR_NOT_RESOURCE_OWNER"
          - "logical clock now <= the term's student_access_end_at, else ERR_STUDENT_ACCESS_EXPIRED"
          - "the referenced ContentItem.shell_id == the enrollment's shell_id, else ERR_INVALID_REQUEST"
          - "no other GradeDispute with dispute_state == OPEN exists for this enrollment_id, else ERR_ROLE_CONFLICT"
        side_effects:
          - "held_points set to the enrollment's current earned_points_total; the enrollment's disputed_points_held set to the same value"
          - "filed_by_user_id set to the acting X-User-ID"
          - "the passback takes its ACCEPTED -> DISPUTED transition on the first dispute, or increments open_dispute_count on a subsequent one"
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /grade-disputes/{id}/resolve with outcome=UPHELD"
        actor: Instructor
        preconditions:
          - "dispute_state == OPEN"
          - "the acting X-User-ID equals the shell's owner_person_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "resolved_at set to the logical clock now; adjusted_earned_points left null"
          - "enrollment.earned_points_total unchanged; enrollment.disputed_points_held set to 0.00"
          - "passback.disputed_points_held decremented by held_points and passback.accepted_points_total incremented by held_points, restoring accepted_points_total to its pre-filing value with zero drift"
          - "passback.open_dispute_count decremented by 1, then the passback takes DISPUTED -> ACCEPTED if this was the last open dispute of the round"
      - from: OPEN
        to: RESOLVED_CHANGED
        trigger: "POST /grade-disputes/{id}/resolve with outcome=CHANGED"
        actor: Instructor
        preconditions:
          - "dispute_state == OPEN"
          - "the acting X-User-ID equals the shell's owner_person_id, else ERR_NOT_RESOURCE_OWNER"
          - "adjusted_earned_points is present and >= 0, else ERR_INVALID_REQUEST"
        side_effects:
          - "cascade hop 1: resolved_at and adjusted_earned_points recorded; enrollment.earned_points_total set to adjusted_earned_points and enrollment.disputed_points_held set to 0.00"
          - "cascade hop 2: that new earned_points_total re-runs final_grade_percentage variant FINAL, rewriting enrollment.final_grade_pct"
          - "cascade hop 3: the passback ledger absorbs the delta — disputed_points_held decremented by held_points, accepted_points_total incremented by adjusted_earned_points, submitted_points_total incremented by (adjusted_earned_points - held_points) so accepted_points_total + disputed_points_held == submitted_points_total still holds — and the passback takes DISPUTED -> AMENDED, which increments AcademicTerm.open_amendment_count's blocking effect on GRADING -> CLOSED"
        note: "Divergent branch of the resolution fork; UPHELD is ledger-neutral, CHANGED rewrites the enrollment grade and forces a term-level amendment."

  - entity: ContinuityWindow
    state_field: window_state
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /continuity-windows"
        actor: LmsAdmin
        preconditions:
          - "term.lifecycle_state IN {IN_SESSION, FINALS, GRADING}, else ERR_INVALID_STATE_TRANSITION"
          - "window_end strictly after window_start, else ERR_INVALID_REQUEST"
          - "expected_term_version matches AcademicTerm.version, else ERR_STALE_VERSION"
          - "shell-scoped overlap rule when shell_id is present: no other ContinuityWindow with the same shell_id, the same kind and window_state == OPEN half-open-intersects [window_start, window_end), else ERR_WINDOW_OVERLAP"
          - "term-wide aggregate rule when kind == OUTAGE: counting the new window itself, no more than MAX_CONCURRENT_OUTAGE_WINDOWS (2) OPEN OUTAGE windows of this term may share an instant, i.e. AT MOST ONE existing OPEN OUTAGE window may closed-interval-intersect the new [window_start, window_end] (touching endpoints do intersect), else ERR_CONTINUITY_CAP_EXCEEDED"
        side_effects:
          - "affected_enrollment_count set to shell.active_enrollment_count for shell-scoped windows, or to term.total_active_enrollments for term-wide windows"
          - "extension_days_granted set to ceil((window_end - window_start) / 86400 seconds) for kind == EXTENSION, else 0"
          - "increments AcademicTerm.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /continuity-windows/{id}/transitions with action=CLOSE"
        actor: LmsAdmin
        preconditions: ["window_state == OPEN"]
        side_effects:
          - "closed_at set to the logical clock now"
          - "increments ContinuityWindow.version by 1"
        note: "Closing the last OPEN OUTAGE window does not itself change the term's posture; the posture dimension must be walked back explicitly, and CONTINUITY_MODE -> ELEVATED is gated on there being no OPEN OUTAGE window left."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /continuity-windows/{id}/transitions with action=CANCEL"
        actor: LmsAdmin
        preconditions:
          - "logical clock now < window_start, else ERR_WINDOW_ALREADY_STARTED"
        side_effects:
          - "affected_enrollment_count set to 0 and extension_days_granted set to 0"
          - "increments ContinuityWindow.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================

concurrency_rules:
  - rule_id: merge-request-create-stale-parent-shell
    parent_entity: CourseShell
    write_endpoint: "POST /merge-requests"
    occ_field: "expected_parent_shell_version"
    description: |
      Creating a MergeRequest against a parent shell whose version has advanced
      since the client last observed it is rejected. Cross-listing is a
      supersede-style create: a newly created request legitimately targets the
      same parent as an existing one, so a stale view of the parent shell must
      be caught by the version guard rather than by a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rollover-job-create-stale-target-shell
    parent_entity: CourseShell
    write_endpoint: "POST /rollover-jobs"
    occ_field: "expected_target_shell_version"
    description: |
      Creating a RolloverJob against a target shell whose version has advanced
      since the client last observed it is rejected. A second rollover job
      legitimately supersedes an earlier one for the same target shell, so the
      stale-view case is only detectable through the target shell's version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: continuity-window-create-stale-term
    parent_entity: AcademicTerm
    write_endpoint: "POST /continuity-windows"
    occ_field: "expected_term_version"
    description: |
      Creating a ContinuityWindow against a term whose version has advanced
      since the client last observed it is rejected. Continuity windows are
      created against a posture and enrollment picture the operator has just
      read; a superseding window is legitimate, so only the term's version can
      tell the operator that the picture moved underneath them.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Two dual-variant rules live in different entity domains: due-date projection
# operates on ContentItem calendars, grade percentage on Enrollment gradebooks.
# Combinatorial complexity is exercised along three different axes:
#   (a) non-linear multi-input formula  -> tool_approval_risk_score
#   (b) pinned rounding order           -> sandbox_storage_chargeback
#   (c) pinned evaluation order over a  -> waitlist_promotion_capacity
#       circular-looking dependency
# =============================================================================

calculations:

  - name: rollover_due_date_projection
    trigger: |
      During RolloverJob VALIDATED -> COPYING, for every source ContentItem
      being copied whose due_at is non-null, when the job's strip_dates is
      false. When strip_dates is true the copy's due_at is set to null and this
      calculation does not run.
    algorithm: projection
    formula: |
      source_term  = AcademicTerm of the RolloverJob's source_shell_id
      target_term  = AcademicTerm identified by the RolloverJob's target_term_id

      source_span_s = epoch_seconds(source_term.term_end_at) - epoch_seconds(source_term.term_start_at)
      target_span_s = epoch_seconds(target_term.term_end_at) - epoch_seconds(target_term.term_start_at)
      offset_s      = epoch_seconds(item.due_at) - epoch_seconds(source_term.term_start_at)

      # ---- variant ANCHOR_PROPORTIONAL -------------------------------------
      raw_ratio     = offset_s / source_span_s          # source_span_s is always > 0
      ratio         = min(1.0, max(0.0, raw_ratio))     # clamped BEFORE scaling
      projected_s   = round_half_up(ratio * target_span_s, 0)      # whole seconds
      projected_at  = epoch_seconds(target_term.term_start_at) + projected_s

      # ---- variant FIXED_OFFSET --------------------------------------------
      delta_s       = epoch_seconds(target_term.term_start_at) - epoch_seconds(source_term.term_start_at)
      whole_weeks   = floor(delta_s / 604800)           # 604800 = 7 days in seconds
      shifted_at    = epoch_seconds(item.due_at) + whole_weeks * 604800
      projected_at  = min(epoch_seconds(target_term.term_end_at),
                          max(epoch_seconds(target_term.term_start_at), shifted_at))

      copy.due_at        = iso8601_utc(projected_at)
      copy.date_stripped = false
      job.date_shifted_count += 1
    input_set: |
      Source ContentItem rows of source_shell_id with copy_state != SKIPPED and
      due_at != null. Items with due_at == null (PAGE, FILE) are copied with
      due_at null and counted in neither date_shifted_count nor
      date_stripped_count.
    constants:
      SECONDS_PER_WEEK: 604800
      RATIO_FLOOR: 0.0
      RATIO_CEILING: 1.0
    precision: |
      Whole seconds, round_half_up on the ANCHOR_PROPORTIONAL product; ratio is
      carried at full precision and MUST NOT be pre-rounded. Truncation instead
      of round_half_up is observable: a source offset of 2,591,940 s against a
      100-day source term and a 109-day target term yields
      2,591,940 x 1.09 = 2,825,214.6 s, which round_half_up resolves to
      2,825,215 s and truncation would resolve to 2,825,214 s — a one-second
      difference in the copied due_at.
    variants:
      - name: ANCHOR_PROPORTIONAL
        when: "RolloverJob.date_shift_mode == ANCHOR_PROPORTIONAL (the default)"
        difference: |
          Preserves the item's FRACTIONAL position inside the instructional
          span, so the projected instant stretches or compresses with the
          target term's length. Worked literals with source term
          2026-01-12T00:00:00Z .. 2026-04-22T00:00:00Z (100 days) and target
          term 2026-08-24T00:00:00Z .. 2026-12-11T00:00:00Z (109 days):
          a source due_at of 2026-03-03T00:00:00Z (offset 50 days, ratio 0.50)
          projects to 2026-10-17T12:00:00Z.
      - name: FIXED_OFFSET
        when: "RolloverJob.date_shift_mode == FIXED_OFFSET"
        difference: |
          Preserves the DAY OF WEEK by shifting every date by the same whole
          number of weeks between the two term starts, then clamps into the
          target term. With the same two terms the shift is
          floor(224 days / 7) = 32 weeks = 224 days, so the same source due_at
          of 2026-03-03T00:00:00Z projects to 2026-10-13T00:00:00Z — a
          four-day, twelve-hour divergence from ANCHOR_PROPORTIONAL on
          identical input data.

  - name: final_grade_percentage
    trigger: |
      Variant PROVISIONAL runs on POST /grade-passbacks (staging), on
      GradePassback RETURNED -> STAGED, and on every /_grade-records write.
      Variant FINAL runs on GradePassback STAGED -> SUBMITTED, on
      AMENDED -> SUBMITTED, and on GradeDispute OPEN -> RESOLVED_CHANGED.
    algorithm: aggregation
    formula: |
      # denominator selection is the whole point of the two variants
      if variant == PROVISIONAL:
          denominator = enrollment.graded_points_possible
      else:                                  # FINAL
          denominator = shell.total_points_possible

      if denominator == 0:
          pct = 0.00
      else:
          pct = round_half_up(enrollment.earned_points_total / denominator * 100, 2)

      PROVISIONAL writes enrollment.provisional_grade_pct
      FINAL       writes enrollment.final_grade_pct
    input_set: |
      Enrollment rows of the passback's shell with role == STUDENT and
      enrollment_state IN {ACTIVE, COMPLETED}. WAITLISTED and DROPPED rows are
      excluded from staging entirely and keep provisional_grade_pct 0.00.
      graded_points_possible accumulates only the ContentItem.points_possible
      of items that already carry a grade record for this enrollment;
      shell.total_points_possible sums points_possible over every
      ASSIGNMENT/QUIZ item of the shell with copy_state != SKIPPED, graded or
      not, so ungraded work counts as zero under FINAL.
    constants:
      PERCENT_SCALE: 100
      ZERO_DENOMINATOR_RESULT: 0.00
    precision: "2 decimal places, round_half_up; division carried at full precision and rounded once at the end"
    variants:
      - name: PROVISIONAL
        when: "GradePassback.variant_applied == PROVISIONAL (staging and re-staging)"
        difference: |
          Divides by work graded so far, which flatters incomplete gradebooks.
          Worked literals: earned_points_total 50.00 against
          graded_points_possible 60.00 gives 83.33 (50/60 = 83.3333... ->
          83.33).
      - name: FINAL
        when: "GradePassback.variant_applied == FINAL (submit to the registrar)"
        difference: |
          Divides by every gradable point in the shell, so missing work drags
          the percentage down. Same data as above with
          shell.total_points_possible 80.00 gives 62.50 — a 20.83 point
          divergence on identical stored grades, and the delta the registrar
          sees between the staged and submitted figures.

  - name: sandbox_storage_chargeback
    trigger: |
      Recomputed on the owner Person whenever a ContentItem is created or
      deleted in a SANDBOX or DEV shell, whenever such a shell's storage_mb
      changes (rollover copy, rollover compensation), and on CourseShell
      ARCHIVED -> PURGED.
    algorithm: tiered_pricing
    formula: |
      # -------- pinned rounding order: ROUND PER SHELL, THEN SUM ------------
      charge_total = 0.00
      for shell in billable_shells(person):                 # created_at ASC
          billable_mb = max(0.00, shell.storage_mb - FREE_TIER_MB)
          multiplier  = 1.00 if shell.shell_type == SANDBOX else 0.50   # DEV
          per_shell   = round_half_up(billable_mb * RATE_PER_MB_USD * multiplier, 2)
          charge_total = charge_total + per_shell            # already-rounded cents

      person.sandbox_storage_charge_usd = charge_total
    input_set: |
      billable_shells(person) = CourseShell rows with owner_person_id ==
      person.id, shell_type IN {SANDBOX, DEV} and provisioning_state NOT IN
      {REJECTED, PURGED}. OFFICIAL shells are never charged. Iteration order is
      CourseShell.created_at ASC (never id), which keeps the accumulated sum
      reproducible.
    constants:
      FREE_TIER_MB: 100.00
      RATE_PER_MB_USD: 0.0150
      SANDBOX_MULTIPLIER: 1.00
      DEV_MULTIPLIER: 0.50
      SANDBOX_STORAGE_QUOTA_MB: 500.00   # hard ceiling; a rollover copy that pushes a SANDBOX/DEV target above it drives RolloverJob COPYING -> FAILED
      MAX_SANDBOX_SHELLS_PER_PERSON: 3
    precision: |
      2 decimal places, round_half_up, applied PER SHELL and never to the sum.
      The order is pinned and observable. Worked literals for one owner with
      three billable shells — SANDBOX 210.00 MB, DEV 175.00 MB, SANDBOX
      187.50 MB:
        round-then-sum (REQUIRED): 1.65 + 0.56 + 1.31 = 3.52
        sum-then-round (FORBIDDEN): 1.65 + 0.5625 + 1.3125 = 3.525 -> 3.53
      The implementation MUST produce 3.52.

  - name: waitlist_promotion_capacity
    trigger: |
      On POST /enrollments, on Enrollment ACTIVE -> DROPPED (freed seat), on
      EnrollmentSyncBatch VALIDATED -> APPLIED (per operation, in array order),
      on MergeRequest APPROVED -> APPLIED / APPLIED -> REVERSED, and whenever
      the shell's AcademicTerm.continuity_posture changes.
    algorithm: constraint_propagation
    formula: |
      # -------- pinned evaluation order (the dependency only LOOKS circular) -
      # step 1: allowance depends on the TERM's posture, never on overflow_flag
      posture = shell.term.continuity_posture
      overflow_ratio = 0.00 if posture == NORMAL
                       else 0.10 if posture == ELEVATED
                       else 0.20                          # CONTINUITY_MODE
      overflow_allowance = floor(shell.base_seat_cap * overflow_ratio)

      # step 2: cap is frozen from PRE-promotion state for this whole run
      effective_seat_cap = shell.base_seat_cap + overflow_allowance

      # step 3: open seats and promotable head count
      open_seats      = max(0, effective_seat_cap - shell.active_enrollment_count)
      promotable_count = min(open_seats, shell.waitlisted_enrollment_count)

      # step 4: promote promotable_count rows, waitlist_position ASC then
      #         created_at ASC; renumber the surviving queue from 1
      # step 5: ONLY NOW recompute the derived observables
      seat_utilization_pct = round_half_up(shell.active_enrollment_count
                                           / shell.base_seat_cap * 100, 2)
      overflow_flag        = shell.active_enrollment_count > shell.base_seat_cap
    input_set: |
      Enrollment rows of the shell with role == STUDENT; only enrollment_state
      == ACTIVE feeds active_enrollment_count and only WAITLISTED feeds
      waitlisted_enrollment_count. TEACHER, TA, DESIGNER and OBSERVER rows
      never consume a seat and never appear on a waitlist.
    constants:
      OVERFLOW_RATIO_NORMAL: 0.00
      OVERFLOW_RATIO_ELEVATED: 0.10
      OVERFLOW_RATIO_CONTINUITY_MODE: 0.20
      UTILIZATION_DENOMINATOR: "base_seat_cap (never effective_seat_cap)"
    precision: |
      overflow_allowance uses floor, so the allowance is 0 until base_seat_cap
      is large enough to buy a whole seat: under ELEVATED, base_seat_cap 9
      gives floor(0.90) = 0 and effective_seat_cap 9, while base_seat_cap 10
      gives floor(1.00) = 1 and effective_seat_cap 11. seat_utilization_pct is
      2 decimal places round_half_up against base_seat_cap, so an overflowing
      shell legitimately reports above 100.00 (11 active over base 10 -> 110.00
      with overflow_flag true).
      Evaluation order is pinned: overflow_flag is an OUTPUT of step 5 and MUST
      NOT feed back into overflow_ratio in step 1; effective_seat_cap MUST NOT
      be recomputed between individual promotions inside one step-4 run.

  - name: tool_approval_risk_score
    trigger: |
      Recomputed and persisted on ToolIntegration UNDER_REVIEW -> {APPROVED,
      CONDITIONAL, REJECTED} (where its value selects the branch), on
      ToolPlacement REQUESTED -> ACTIVE and ACTIVE -> REMOVED (placement
      exposure changed), and on APPROVED/CONDITIONAL -> SUSPENDED.
    algorithm: weighted_scoring
    formula: |
      pii_points    = tool.pii_tier * PII_TIER_POINTS                 # 0..30
      scope_points  = 0  if data_sharing_scope == NONE
                      10 if data_sharing_scope == ROSTER_ONLY
                      25 if data_sharing_scope == ROSTER_AND_GRADES
                      40 if data_sharing_scope == FULL_PROFILE
      vpat_points   = (100 - tool.vpat_score) * VPAT_WEIGHT
      wcag_points   = 20 if wcag_level == NONE
                      10 if wcag_level == A
                      0  if wcag_level == AA
                      -5 if wcag_level == AAA                         # credit
      exposure_pts  = min(EXPOSURE_CAP, tool.active_placement_count * EXPOSURE_PER_PLACEMENT)

      raw   = pii_points + scope_points + vpat_points + wcag_points + exposure_pts
      score = round_half_up(min(SCORE_CEILING, max(SCORE_FLOOR, raw)), 2)

      # branch selection at FINALIZE_REVIEW (a BLOCK on either dimension
      # vetoes regardless of score):
      #   score <  40.00                      -> APPROVED   (both dims CLEARED)
      #   40.00 <= score < 70.00              -> CONDITIONAL
      #   score >= 70.00                      -> REJECTED
    input_set: |
      Fields of the single ToolIntegration row plus its live
      active_placement_count (ToolPlacement rows with placement_state ==
      ACTIVE). ToolReview rows do not enter the arithmetic — a BLOCK decision
      vetoes the branch outside the score, and CONDITIONS forces at least
      CONDITIONAL without changing the number.
    constants:
      PII_TIER_POINTS: 10
      VPAT_WEIGHT: 0.30
      EXPOSURE_PER_PLACEMENT: 3
      EXPOSURE_CAP: 15
      SCORE_FLOOR: 0.00
      SCORE_CEILING: 100.00
      RISK_CONDITIONAL_THRESHOLD: 40.00
      RISK_REJECT_THRESHOLD: 70.00
    precision: |
      2 decimal places, round_half_up, applied ONCE after clamping — never per
      term. Both clamps are reachable and both thresholds are inclusive on the
      lower side. Worked literals:
        pii_tier 0, ROSTER_AND_GRADES, vpat_score 50.00, AA, 0 placements
          -> 0 + 25 + 15.00 + 0 + 0 = 40.00 -> exactly at the CONDITIONAL
             threshold -> CONDITIONAL, not APPROVED
        pii_tier 0, ROSTER_AND_GRADES, vpat_score 51.00, AA, 0 placements
          -> 39.70 -> APPROVED
        pii_tier 3, ROSTER_AND_GRADES, vpat_score 50.00, AA, 0 placements
          -> 30 + 25 + 15.00 = 70.00 -> exactly at the REJECT threshold
             -> REJECTED
        pii_tier 3, FULL_PROFILE, vpat_score 0.00, NONE, 5 placements
          -> 30 + 40 + 30.00 + 20 + 15 = 135.00 -> clamped to 100.00
        pii_tier 0, NONE, vpat_score 100.00, AAA, 0 placements
          -> -5.00 -> clamped to 0.00

  - name: term_rollover_completion_pct
    trigger: |
      Recomputed on RolloverJob COPYING -> COMPLETED, on RolloverJob
      FAILED -> COMPENSATED, on CourseShell creation/rejection/merge inside the
      term, and as the first step of AcademicTerm PLANNING ->
      REGISTRATION_OPEN (where it gates the transition).
    algorithm: aggregation
    formula: |
      eligible = CourseShell rows with term_id == term.id
                 and shell_type == OFFICIAL
                 and provisioning_state NOT IN {REJECTED, MERGED, PURGED}
      completed = eligible shells that are the target_shell_id of at least one
                  RolloverJob with job_state == COMPLETED

      if count(eligible) == 0:
          rollover_completion_pct = 100.00        # empty-set convention
      else:
          rollover_completion_pct = round_half_up(count(completed)
                                                  / count(eligible) * 100, 2)
    input_set: |
      OFFICIAL shells only; SANDBOX and DEV shells are governance artifacts and
      never enter the denominator. A shell absorbed by a merge leaves the
      denominator (provisioning_state MERGED), which can move the percentage
      without any rollover activity.
    constants:
      ROLLOVER_READINESS_PCT: 100.00
      EMPTY_SET_RESULT: 100.00
    precision: |
      2 decimal places, round_half_up. The empty-set case is the boundary that
      matters: a freshly created term has zero eligible shells and therefore
      reads 100.00, which is exactly what lets PLANNING ->
      REGISTRATION_OPEN succeed before any shell exists. With 3 eligible and 2
      completed the value is 66.67 (66.666... -> 66.67) and the gate fails with
      ERR_ROLLOVER_INCOMPLETE.

  - name: passback_points_ledger
    trigger: |
      Every GradePassback bucket write: STAGED -> SUBMITTED, the registrar
      ACCEPT / RETURN decisions, ACCEPTED -> DISPUTED (dispute filed),
      GradeDispute OPEN -> RESOLVED_UPHELD, OPEN -> RESOLVED_CHANGED, and
      AMENDED -> SUBMITTED.
    algorithm: projection
    formula: |
      # invariant (MUST hold after every event once the passback has been
      # submitted at least once):
      #   accepted_points_total + disputed_points_held == submitted_points_total
      #
      # event replay, applied in the order the events occur (created_at ASC on
      # the GradeDispute rows when several resolve in one request):
      #
      # E1 SUBMIT      : submitted = sum(staged enrollment.earned_points_total)
      #                  accepted  = 0.00 ; disputed = 0.00
      #                  (invariant intentionally not asserted between SUBMIT
      #                   and the registrar decision: submitted is in flight)
      # E2 ACCEPT      : accepted  = submitted ; disputed = 0.00
      # E3 RETURN      : accepted  = 0.00 ; disputed = 0.00 ; submitted = 0.00
      # E4 DISPUTE     : accepted -= dispute.held_points
      #                  disputed += dispute.held_points
      # E5 UPHELD      : disputed -= dispute.held_points
      #                  accepted += dispute.held_points
      # E6 CHANGED     : disputed -= dispute.held_points
      #                  accepted += dispute.adjusted_earned_points
      #                  submitted += (dispute.adjusted_earned_points
      #                                - dispute.held_points)
      #
      # E4 followed by E5 is the compensating pair: it MUST restore all three
      # buckets to their pre-E4 values with zero drift.
    input_set: |
      The passback's own GradeDispute rows plus the earned_points_total of the
      staged Enrollment rows. Disputes in state RESOLVED_UPHELD or
      RESOLVED_CHANGED no longer contribute to disputed_points_held.
    constants:
      LEDGER_INVARIANT: "accepted_points_total + disputed_points_held == submitted_points_total"
      INITIAL_BUCKET_VALUE: 0.00
    precision: |
      2 decimal places, round_half_up on every bucket write; the buckets store
      already-rounded values so the invariant is exact, not approximate.
      Worked literals: submitted 250.00 -> ACCEPT gives accepted 250.00 /
      disputed 0.00; a dispute holding 90.00 gives accepted 160.00 / disputed
      90.00 / submitted 250.00; UPHELD returns accepted 250.00 / disputed 0.00
      / submitted 250.00 (zero drift); CHANGED with adjusted 120.00 instead
      gives accepted 280.00 / disputed 0.00 / submitted 280.00.

  - name: enrollment_seat_ledger
    trigger: |
      Every Enrollment create or state change, every applied
      EnrollmentSyncBatch operation, MergeRequest APPROVED -> APPLIED and
      APPLIED -> REVERSED, CourseShell PUBLISHED -> CONCLUDED, and CourseShell
      PROVISIONED -> REJECTED.
    algorithm: aggregation
    formula: |
      # named conserved quantity:
      #   term.total_active_enrollments
      #     == sum over CourseShell rows of that term with provisioning_state
      #        NOT IN {REJECTED, PURGED} of shell.active_enrollment_count
      #
      # per-event deltas:
      #   Enrollment created ACTIVE   with role STUDENT : +1 shell, +1 term
      #   Enrollment created WAITLISTED                : +0 shell, +0 term
      #   ACTIVE -> DROPPED                            : -1 shell, -1 term
      #   WAITLISTED -> ACTIVE (promotion)             : +1 shell, +1 term
      #   DROPPED -> ACTIVE (reinstatement)            : +1 shell, +1 term
      #   ACTIVE -> COMPLETED (shell CONCLUDED)        : -1 shell, -1 term
      #   MergeRequest APPLY relocates N rows          : -N child, +N parent,
      #                                                   0 term  (conserved)
      #   MergeRequest REVERSE relocates the same N    : +N child, -N parent,
      #                                                   0 term  (conserved)
      #
      # A drop that immediately frees a seat consumed by a waitlist promotion
      # nets to zero at the term level: -1 for the drop, +1 for the promotion.
    input_set: |
      Enrollment rows with role == STUDENT only. Shells in provisioning_state
      REJECTED or PURGED leave the sum entirely, and their transitions zero
      their own active_enrollment_count and decrement the term by the same
      amount in the same request, so the identity is never left broken.
    constants:
      SEAT_LEDGER_INVARIANT: "term.total_active_enrollments == SUM(shell.active_enrollment_count)"
      MERGE_DELTA: 0
    precision: |
      Integer headcounts; no rounding. The merge pair is the compensating
      instance: parent 8 active and child 5 active with term total 13 becomes
      parent 13 / child 0 / term 13 after APPLY (MergeRequest.seat_ledger_after
      == seat_ledger_before == 13), and REVERSE restores parent 8 / child 5 /
      term 13 exactly. Zero is a live boundary — a shell whose only ACTIVE row
      drops reads active_enrollment_count 0, seat_utilization_pct 0.00 and
      overflow_flag false, and the term decrements by exactly 1.

  - name: retention_purge_schedule
    trigger: |
      Computed on POST /academic-terms, recomputed on PATCH
      /academic-terms/{id} when access_grace_days or retention_class changes,
      and read as a precondition by CourseShell ARCHIVED -> PURGED and by every
      Student read of a concluded term.
    algorithm: threshold
    formula: |
      # step 1: post-term student read access, snapped to end of day
      access_day        = date_of(term.term_end_at + term.access_grace_days days)
      student_access_end_at = iso8601_utc(access_day at 23:59:59)

      # step 2: retention horizon, keyed on retention_class
      retention_days = 365   if retention_class == STANDARD
                       1825  if retention_class == EXTENDED
                       null  if retention_class == LEGAL_HOLD

      if retention_days == null:
          retention_purge_at = null      # PURGE blocked by ERR_RETENTION_HOLD_ACTIVE
      else:
          retention_purge_at = student_access_end_at + retention_days days
    input_set: |
      The single AcademicTerm row. access_grace_days 0 is legal and collapses
      student_access_end_at onto the term_end_at calendar day at 23:59:59.
    constants:
      RETENTION_DAYS_STANDARD: 365
      RETENTION_DAYS_EXTENDED: 1825
      RETENTION_DAYS_LEGAL_HOLD: null
      ACCESS_END_TIME_OF_DAY: "23:59:59"
    precision: |
      Whole days added to the calendar date, then a fixed 23:59:59 wall time;
      no sub-second component. Worked literals for term_end_at
      2026-12-11T00:00:00Z with access_grace_days 30:
        student_access_end_at = 2027-01-10T23:59:59Z
        STANDARD  -> retention_purge_at = 2028-01-10T23:59:59Z
        EXTENDED  -> retention_purge_at = 2032-01-09T23:59:59Z
                     (1825 days spans the leap day 2028-02-29, which is why
                      the day-of-month lands on the 9th, not the 10th)
        LEGAL_HOLD -> retention_purge_at = null
      With access_grace_days 0 the same term reads
      student_access_end_at = 2026-12-11T23:59:59Z, and a Student read at
      2026-12-11T23:59:59Z is still permitted while 2026-12-12T00:00:00Z
      returns ERR_STUDENT_ACCESS_EXPIRED.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
# Domain priority inside the business band: compliance and student-privacy
# safety first (FERPA, post-term access, unapproved tools), then segregation of
# duties, then referential/linkage integrity, then temporal windows, then
# cross-entity state dependencies, then aggregate ceilings, and finally fiscal
# capacity (seat caps and sandbox quotas) last.
# =============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7 and that role appears in the target endpoint's roles list; additionally, on POST /tool-reviews the body's dimension must match the acting reviewer role (PrivacyReviewer may post only dimension PRIVACY, AccessibilityReviewer only dimension ACCESSIBILITY), because the two reviewer roles are peers with disjoint duties"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: |
      For entity_backed roles acting on a resource they must own: an Instructor's
      X-User-ID equals the CourseShell.owner_person_id (shell, content item,
      placement, passback, dispute resolution); a Student's X-User-ID equals the
      Enrollment.person_id (dispute filing, own enrollment read).
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /content-items, PATCH /content-items/{id}, DELETE /content-items/{id}, POST /tool-placements, POST /tool-placements/{id}/transitions, POST /grade-passbacks, POST /grade-passbacks/{id}/transitions, POST /grade-disputes, POST /grade-disputes/{id}/resolve, GET /enrollments"

  - priority: 4
    category: existence
    check: |
      Every id embedded in the path exists, validated left to right. Returns the
      entity-specific code from §1.6: ERR_TERM_NOT_FOUND, ERR_PERSON_NOT_FOUND,
      ERR_SHELL_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_BATCH_NOT_FOUND,
      ERR_MERGE_REQUEST_NOT_FOUND, ERR_CONTENT_ITEM_NOT_FOUND,
      ERR_ROLLOVER_JOB_NOT_FOUND, ERR_TOOL_NOT_FOUND, ERR_REVIEW_NOT_FOUND,
      ERR_PLACEMENT_NOT_FOUND, ERR_PASSBACK_NOT_FOUND, ERR_DISPUTE_NOT_FOUND,
      ERR_WINDOW_NOT_FOUND.
    error_id: ERR_SHELL_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 5
    category: existence
    check: |
      Every foreign key supplied in the request body resolves to an existing
      row, validated in the field order declared by the endpoint's input list.
      Returns the same entity-specific *_NOT_FOUND codes as priority 4.
    error_id: ERR_PERSON_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints carrying FK fields"

  - priority: 6
    category: business_constraint
    check: |
      Request shape: every required input field is present; every enum value is
      a declared member; numbers respect their declared ranges; datetimes parse
      as ISO 8601 UTC; window_end is strictly after window_start; term_end_at is
      strictly after term_start_at; finals_window_end_at does not exceed
      term_end_at; MergeRequest.child_shell_id differs from parent_shell_id;
      ContentItem.points_possible is 0 for PAGE and FILE; ToolReview
      conditions_note is present when decision is CONDITIONS;
      GradeDispute.adjusted_earned_points is present and >= 0 when the outcome
      is CHANGED. Unknown fields are ignored, not rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_referential
    check: "AcademicTerm.term_code is unique across all terms"
    error_id: ERR_DUPLICATE_TERM_CODE
    http_status: 409
    applies_to: "POST /academic-terms"

  - priority: 8
    category: business_referential
    check: "sis_section_code is unique per (term_id, sis_section_code) among CourseShell rows with shell_type == OFFICIAL and provisioning_state NOT IN {REJECTED, PURGED}; SANDBOX and DEV shells are exempt"
    error_id: ERR_DUPLICATE_SECTION_CODE
    http_status: 409
    applies_to: "POST /course-shells"

  - priority: 9
    category: business_referential
    check: "(vendor_name, tool_name) is unique across ToolIntegration rows"
    error_id: ERR_DUPLICATE_TOOL
    http_status: 409
    applies_to: "POST /tool-integrations"

  - priority: 10
    category: business_referential
    check: "at most one GradePassback exists per shell_id"
    error_id: ERR_DUPLICATE_PASSBACK
    http_status: 409
    applies_to: "POST /grade-passbacks"

  - priority: 11
    category: state
    check: |
      The target resource's own state field permits the requested transition or
      mutation, per the §1.2 transition table for that entity (including the
      action enum on every /transitions endpoint, terminal-state lockdown, and
      idempotent re-issue of an already-taken transition).
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all /transitions, /lifecycle-transitions, /posture-changes, /provisioning-decisions, /publish and /unpublish endpoints, POST /tool-reviews, POST /grade-passbacks/{id}/registrar-decisions, POST /grade-disputes, POST /grade-disputes/{id}/resolve, PATCH endpoints"

  - priority: 12
    category: state
    check: "expected_parent_shell_version / expected_target_shell_version / expected_term_version matches the referenced parent's current version field (§1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /merge-requests, POST /rollover-jobs, POST /continuity-windows"

  - priority: 13
    category: business_safety
    check: "no Person with ferpa_block == true is exposed by the operation: no FERPA-blocked student is among the shell's ACTIVE/WAITLISTED enrollments when a data-sharing tool placement is activated, and none is among the staged enrollments when a passback is submitted"
    error_id: ERR_FERPA_BLOCK_ACTIVE
    http_status: 403
    applies_to: "POST /tool-placements/{id}/transitions (action=ACTIVATE), POST /grade-passbacks/{id}/transitions (action=SUBMIT)"

  - priority: 14
    category: business_safety
    check: "a Student read or dispute filing occurs at or before the term's student_access_end_at, and the acting Person.access_revoked_at is null or in the future"
    error_id: ERR_STUDENT_ACCESS_EXPIRED
    http_status: 403
    applies_to: "GET /enrollments, GET /course-shells/{id}, POST /grade-disputes"

  - priority: 15
    category: business_safety
    check: "the ToolIntegration behind a placement being activated has approval_state IN {APPROVED, CONDITIONAL}"
    error_id: ERR_TOOL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /tool-placements/{id}/transitions (action=ACTIVATE)"

  - priority: 16
    category: business_safety
    check: "the ToolIntegration's approved_version still equals its tool_version, so an approved review has not been invalidated by a vendor upgrade"
    error_id: ERR_TOOL_VERSION_DRIFT
    http_status: 409
    applies_to: "POST /tool-placements/{id}/transitions (action=ACTIVATE)"

  - priority: 17
    category: business_safety
    check: |
      Segregation of duties on X-User-ID: the LmsAdmin approving or declining a
      MergeRequest is not its submitted_by_user_id; the reviewer deciding one
      ToolReview dimension has no ToolReview on the other dimension of the same
      tool; the Registrar deciding a passback is not the Instructor that
      submitted it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /merge-requests/{id}/transitions (action=APPROVE|DECLINE), POST /tool-reviews, POST /grade-passbacks/{id}/registrar-decisions"

  - priority: 18
    category: business_referential
    check: "a ToolIntegration has at most one ToolReview per dimension while it is under one review round"
    error_id: ERR_REVIEW_DIMENSION_CONFLICT
    http_status: 409
    applies_to: "POST /tool-reviews"

  - priority: 19
    category: business_referential
    check: "FINALIZE_REVIEW requires both privacy_review_state and accessibility_review_state to have left PENDING"
    error_id: ERR_REVIEW_INCOMPLETE
    http_status: 422
    applies_to: "POST /tool-integrations/{id}/transitions (action=FINALIZE_REVIEW)"

  - priority: 20
    category: business_referential
    check: "the child shell of a merge is not already absorbed (merged_into_shell_id is null and provisioning_state != MERGED)"
    error_id: ERR_SHELL_ALREADY_MERGED
    http_status: 409
    applies_to: "POST /merge-requests, POST /merge-requests/{id}/transitions (action=APPLY)"

  - priority: 21
    category: business_referential
    check: "parent and child shells of a merge belong to the same term_id and are both shell_type OFFICIAL"
    error_id: ERR_CROSS_TERM_MERGE
    http_status: 422
    applies_to: "POST /merge-requests"

  - priority: 22
    category: business_referential
    check: "the parent shell of a merge is not itself absorbed into a third shell (no merge chains: parent.merged_into_shell_id must be null) and the child has absorbed_child_count == 0"
    error_id: ERR_MERGE_CHAIN_FORBIDDEN
    http_status: 422
    applies_to: "POST /merge-requests"

  - priority: 23
    category: business_temporal
    check: "reinstating a DROPPED Enrollment happens at or before the term's add_drop_deadline_at"
    error_id: ERR_ADD_DROP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /enrollments/{id}/transitions (action=REINSTATE)"

  - priority: 24
    category: business_temporal
    check: "half-open interval rule for shell-scoped windows: [window_start, window_end) must not intersect another OPEN ContinuityWindow of the same shell_id and same kind; abutting windows (previous.window_end == new.window_start) are permitted"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /continuity-windows"

  - priority: 25
    category: business_temporal
    check: "cancelling a ContinuityWindow requires the logical clock to be strictly before window_start"
    error_id: ERR_WINDOW_ALREADY_STARTED
    http_status: 409
    applies_to: "POST /continuity-windows/{id}/transitions (action=CANCEL)"

  - priority: 26
    category: business_temporal
    check: "a SANDBOX or DEV shell may not receive content or placements after its sandbox_expires_at"
    error_id: ERR_SANDBOX_EXPIRED
    http_status: 409
    applies_to: "POST /content-items, POST /tool-placements, POST /rollover-jobs"

  - priority: 27
    category: business_safety
    check: "retention_class == LEGAL_HOLD forbids purge entirely, regardless of elapsed time; this outranks ERR_PURGE_NOT_DUE, so a LEGAL_HOLD shell (whose retention_purge_at is null) reports the hold rather than an unmet horizon"
    error_id: ERR_RETENTION_HOLD_ACTIVE
    http_status: 403
    applies_to: "POST /course-shells/{id}/lifecycle-transitions (target_state=PURGED)"

  - priority: 28
    category: business_temporal
    check: "purging an ARCHIVED shell whose term is not under LEGAL_HOLD requires retention_purge_at to be non-null and at or before the logical clock"
    error_id: ERR_PURGE_NOT_DUE
    http_status: 409
    applies_to: "POST /course-shells/{id}/lifecycle-transitions (target_state=PURGED)"

  - priority: 29
    category: business_temporal
    check: "while the shell's term has continuity_posture == CONTINUITY_MODE, grade passback submission and term lifecycle advancement out of FINALS are frozen"
    error_id: ERR_TERM_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /grade-passbacks/{id}/transitions (action=SUBMIT), POST /academic-terms/{id}/lifecycle-transitions"

  - priority: 30
    category: business_constraint
    check: "publishing a shell requires publish_readiness == true (no BLOCKED and no REQUESTED ToolPlacement rows)"
    error_id: ERR_SHELL_NOT_PUBLISH_READY
    http_status: 422
    applies_to: "POST /course-shells/{id}/publish"

  - priority: 31
    category: business_constraint
    check: "enrolling, placing tools in, or passing back grades for a shell requires the shell's provisioning_state to permit it (PROVISIONED or PUBLISHED for enrollment and placement, PUBLISHED or CONCLUDED for passback); REQUESTED, REJECTED, MERGED, ARCHIVED and PURGED shells reject the operation"
    error_id: ERR_SHELL_STATE_BLOCKS_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments, POST /tool-placements, POST /grade-passbacks"

  - priority: 32
    category: business_constraint
    check: "shell_type SANDBOX and DEV shells can never be published and can never carry an Enrollment with role STUDENT; they remain legal rollover targets, which is how the sandbox storage quota is reachable"
    error_id: ERR_SANDBOX_NOT_PUBLISHABLE
    http_status: 422
    applies_to: "POST /course-shells/{id}/publish, POST /enrollments"

  - priority: 33
    category: business_constraint
    check: "a RolloverJob's source shell has provisioning_state IN {CONCLUDED, ARCHIVED} and belongs to a term other than the target term"
    error_id: ERR_ROLLOVER_SOURCE_INELIGIBLE
    http_status: 422
    applies_to: "POST /rollover-jobs, POST /rollover-jobs/{id}/transitions (action=VALIDATE)"

  - priority: 34
    category: business_constraint
    check: "a RolloverJob's target shell has provisioning_state == REQUESTED or PROVISIONED, content_item_count == 0 and no Enrollment rows"
    error_id: ERR_ROLLOVER_TARGET_NOT_EMPTY
    http_status: 422
    applies_to: "POST /rollover-jobs, POST /rollover-jobs/{id}/transitions (action=VALIDATE)"

  - priority: 35
    category: business_constraint
    check: "role assignment integrity: a Person holds at most one Enrollment per shell with enrollment_state IN {ACTIVE, WAITLISTED, DROPPED} (a DROPPED row must be reinstated rather than re-created; only a COMPLETED row frees the pair), a STUDENT role may not coexist with a TEACHER role for the same person and shell, the shell's owner_person_id may not hold a STUDENT enrollment in that shell, and a Student may hold at most one OPEN GradeDispute per enrollment"
    error_id: ERR_ROLE_CONFLICT
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollment-sync-batches/{id}/transitions, POST /grade-disputes"

  - priority: 36
    category: business_constraint
    check: "an EnrollmentSyncBatch may only be applied when its batch_seq equals the term's sis_sync_epoch + 1"
    error_id: ERR_SYNC_EPOCH_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /enrollment-sync-batches/{id}/transitions (action=APPLY)"

  - priority: 37
    category: business_constraint
    check: "submitting a passback requires at least one staged Enrollment with graded_points_possible > 0"
    error_id: ERR_NO_GRADES_STAGED
    http_status: 422
    applies_to: "POST /grade-passbacks/{id}/transitions (action=SUBMIT)"

  - priority: 38
    category: business_constraint
    check: "closing a term (GRADING -> CLOSED) requires open_amendment_count == 0, i.e. no GradePassback of the term is DISPUTED or AMENDED"
    error_id: ERR_OPEN_DISPUTES_BLOCK_CLOSE
    http_status: 422
    applies_to: "POST /academic-terms/{id}/lifecycle-transitions (target_state=CLOSED)"

  - priority: 39
    category: business_constraint
    check: "aggregate readiness: PLANNING -> REGISTRATION_OPEN requires the freshly recomputed rollover_completion_pct to be >= ROLLOVER_READINESS_PCT (100.00)"
    error_id: ERR_ROLLOVER_INCOMPLETE
    http_status: 422
    applies_to: "POST /academic-terms/{id}/lifecycle-transitions (target_state=REGISTRATION_OPEN)"

  - priority: 40
    category: business_constraint
    check: "aggregate closed-interval capacity: at most MAX_CONCURRENT_OUTAGE_WINDOWS (2) OPEN OUTAGE windows of one term may cover any instant, i.e. the new [window_start, window_end] may be stabbed together with at most one existing OPEN OUTAGE window; each window is individually legal, only the collective is not"
    error_id: ERR_CONTINUITY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /continuity-windows"

  - priority: 41
    category: business_constraint
    check: "a ContentItem with has_submissions == true may not be deleted; the submissions must be preserved for the gradebook"
    error_id: ERR_ITEM_HAS_SUBMISSIONS
    http_status: 409
    applies_to: "DELETE /content-items/{id}"

  - priority: 42
    category: business_fiscal
    check: "a Person may own at most MAX_SANDBOX_SHELLS_PER_PERSON (3) CourseShell rows with shell_type IN {SANDBOX, DEV} and provisioning_state NOT IN {REJECTED, PURGED}"
    error_id: ERR_SANDBOX_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /course-shells"

  - priority: 43
    category: business_fiscal
    check: |
      A STUDENT enrollment may only occupy a seat while
      waitlist_promotion_capacity reports open_seats >= 1. POST /enrollments
      with requested_state ACTIVE (or omitted) against a shell whose
      active_enrollment_count has reached effective_seat_cap is rejected — a
      caller that wants a queue slot must ask for requested_state=WAITLISTED
      explicitly. PROMOTE with promotable_count == 0 and REINSTATE with no free
      seat are rejected for the same reason. Only an EnrollmentSyncBatch ADD
      operation degrades gracefully to WAITLISTED instead of erroring, because a
      batch applies as a whole.
    error_id: ERR_SEAT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/transitions (action=PROMOTE|REINSTATE)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Flat topology: every collection sits at the server root and all relationships
# travel in request bodies. Each entity exposes a single-resource GET plus, for
# every entity that owns a foreign key, a filtered-list GET that accepts each FK
# field as an optional query parameter (reverse reachability).
# =============================================================================

endpoints:

  # ---- AcademicTerm --------------------------------------------------------
  - method: POST
    path: "/academic-terms"
    description: "Register a term from the registrar calendar. Computes the retention schedule immediately."
    roles: [Registrar]
    code: 201
    input: [term_code, term_start_at, term_end_at, "add_drop_deadline_at?", "finals_window_start_at?", "finals_window_end_at?", "access_grace_days?", "retention_class?"]
    output: AcademicTerm
    side_effects:
      - "lifecycle_state initialised to PLANNING and continuity_posture to NORMAL"
      - "add_drop_deadline_at defaults to term_start_at + 14 days; finals_window_start_at to term_end_at - 7 days; finals_window_end_at to term_end_at"
      - "retention_purge_schedule computes student_access_end_at and retention_purge_at"
      - "rollover_completion_pct set to 100.00 by the empty-set convention of term_rollover_completion_pct"

  - method: GET
    path: "/academic-terms"
    description: "List terms, newest calendar first (term_start_at DESC, created_at ASC as tie-break)."
    roles: [Registrar, LmsAdmin, Instructor]
    code: 200
    input: ["limit?", "offset?", "lifecycle_state?", "continuity_posture?", "retention_class?"]
    output: AcademicTerm[]
    side_effects: []

  - method: GET
    path: "/academic-terms/{id}"
    description: "Read one term including its computed retention and rollover figures."
    roles: [Registrar, LmsAdmin, Instructor, Student]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: []

  - method: PATCH
    path: "/academic-terms/{id}"
    description: "Adjust retention posture and add/drop deadline while the term has not closed."
    roles: [Registrar]
    code: 200
    input: ["access_grace_days?", "retention_class?", "add_drop_deadline_at?"]
    output: AcademicTerm
    side_effects:
      - "retention_purge_schedule recomputes student_access_end_at and retention_purge_at"
      - "increments AcademicTerm.version by 1"

  - method: POST
    path: "/academic-terms/{id}/lifecycle-transitions"
    description: "Advance the term's lifecycle_state dimension (PLANNING, REGISTRATION_OPEN, IN_SESSION, FINALS, GRADING, CLOSED, ARCHIVED)."
    roles: [Registrar]
    code: 200
    input: [target_state, "reason?"]
    output: AcademicTerm
    side_effects:
      - "term_rollover_completion_pct recomputed and gates PLANNING -> REGISTRATION_OPEN"
      - "GRADING -> CLOSED cascades PUBLISHED shells to CONCLUDED and their ACTIVE enrollments to COMPLETED, adjusting enrollment_seat_ledger"
      - "CLOSED -> ARCHIVED cascades CONCLUDED shells to ARCHIVED"
      - "increments AcademicTerm.version by 1"

  - method: POST
    path: "/academic-terms/{id}/posture-changes"
    description: "Move the term's independent continuity_posture dimension (NORMAL, ELEVATED, CONTINUITY_MODE) during an outage or finals disruption."
    roles: [LmsAdmin]
    code: 200
    input: [target_posture, "reason?"]
    output: AcademicTerm
    side_effects:
      - "waitlist_promotion_capacity re-derives every shell's effective_seat_cap under the new overflow ratio"
      - "CONTINUITY_MODE freezes grade passback submission and lifecycle advancement out of FINALS"
      - "increments AcademicTerm.version by 1"

