            - call: "POST /material-orders"
              payload: { job_id: "${job_id}" }
              as: ProductionManager
              captures: { mo_id: $.data.id }
            - call: "POST /material-orders/${mo_id}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /permits"
              payload: { job_id: "${job_id}", municipality: "Dallas" }
              as: ProductionManager
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: { permit_number: "P-6010" }
              as: ProductionManager
            - call: "POST /jobs/${job_id}/start-production"
              payload: {}
              as: ProductionManager
              captures: { jv1: $.data.version }
            - call: "POST /draws"
              payload: { job_id: "${job_id}", cumulative_pct: 0.4, expected_job_version: "${jv1}" }
              as: ProductionManager
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ProductionManager
              captures: { jv2: $.data.version }
          trigger:
            - call: "POST /draws"
              payload: { job_id: "${job_id}", cumulative_pct: 0.7, expected_job_version: "${jv2}" }
              as: ProductionManager
              captures: { draw_id: $.data.id }
          assert:
            - "response status == 201"
            - "Draw.${draw_id}.status == DISBURSED"
            - "Job.${job_id}.billed_pct == 0.7"

      - name: change_order_apply_cascade_material_resize
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - calculations.material_order_sizing
          - entities.MaterialOrder.fields.bundles
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_apply_cascade_depth3
          rationale: "The depth-3 cascade including the material order re-size (bundles 35 -> 104) is asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: contract_value_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Job.ESTIMATED_to_CONTRACTED
          - entities.Job.fields.contract_value_cents
        distinguishing_aspect: "Immediate consistency: the contract response already shows contract_value_cents=110000 (bound FIELD estimate total) in the same response, no re-read needed."
        test_recipe:
          setup:
            - "An ESTIMATED job with a FINALIZED FIELD estimate (single SHINGLE 10sq@10000 -> 110000)."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
              captures: { cv: $.data.contract_value_cents }
          assert:
            - "response status == 200"
            - "Job.${job_id}.contract_value_cents == 110000"
            - "Job.${job_id}.bound_estimate_id == ${est_doc_id}"
