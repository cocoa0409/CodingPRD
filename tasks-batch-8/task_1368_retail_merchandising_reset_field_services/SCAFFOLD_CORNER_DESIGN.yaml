        grounds: [state_machines.StoreVisit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already-VERIFIED visit fails with ERR_INVALID_STATE; the terminal state's lockdown is enforced."
        test_recipe:
