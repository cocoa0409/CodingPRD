        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.order-create-stale-nomination
          - validations[priority 17].ERR_STALE_NOMINATION_VERSION
        distinguishing_aspect: "Creating the first order advances Nomination.version, so replaying the same expected_nomination_version is 412 ERR_STALE_NOMINATION_VERSION and no slot is taken; refetching the version and retrying succeeds and only then does the supersede side effect cancel the first order - the guard exists precisely because the retry would otherwise silently discard a slot the caller never saw."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; one ECA port, one grade with a 705.00 quote, one customer, one 3000.000 mt barge"
            - "One nomination confirmed (version captured as nom_v3) and one delivery order already SCHEDULED on slot 06:00-12:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
