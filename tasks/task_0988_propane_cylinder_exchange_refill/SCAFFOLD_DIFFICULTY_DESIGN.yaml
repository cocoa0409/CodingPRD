# =============================================================================
# Task 988: Propane Cylinder Exchange & Refill — Scaffold Difficulty Design (§1.8)
# Test Targeting Index: 22 instances across the nine Difficulty Rules.
# Common fixtures used below: policy P = {swap 2499, deposit 3500, tax 825bps,
# refill tiers 349/299 with 15.00 lbs breakpoint, effective 2026-05-01};
# standard cylinder WC=47.60, TW=17.00. Default logical clock 2026-05-01.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: reconciliation_opening_baseline_book_vs_physical
        grounds:
          - calculations.reconciliation_expected_cash
          - entities.HostSite.fields.recon_basis
          - state_machines.ReconciliationSession.OPEN_to_BALANCED
          - state_machines.ReconciliationSession.OPEN_to_VARIANCE_FLAGGED
        distinguishing_aspect: |
          Entity domain = ReconciliationSession cash ledger. Two sites with
          IDENTICAL floats, sales, and counts but different recon_basis produce
          different day-2 outcomes: PHYSICAL carries the prior day's +295 counted
          overage into the baseline (variance 0, BALANCED) while BOOK re-bases on
          the declared float (variance +3000, VARIANCE_FLAGGED).
        test_recipe:
          setup:
            - "Site B (recon_basis BOOK) and site P (recon_basis PHYSICAL), each with opening_float_cents=20000, an active policy, 1 FULL fleet cylinder, 1 EMPTY customer cylinder"
            - "Day 2026-05-01 on both sites: one swap-with-return completed (total 2705); session created and counted with counted_cash_cents=23000 (variance +295 < 500 -> BALANCED on both)"
            - "Clock advanced to 2026-05-02; no sales on day 2"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Book Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { sb_id: $.data.id, sb_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${sb_id}", expected_site_version: "${sb_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FB-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${sb_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CB-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { ccb_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${sb_id}", returned_cylinder_id: "${ccb_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { ob_id: $.data.id }
            - call: "POST /exchange-orders/${ob_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${sb_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rsb1_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rsb1_id}/count"
              payload: { counted_cash_cents: 23000, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /sites"
              payload: { name: "Physical Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000, recon_basis: PHYSICAL }
              as: PlatformAdmin
              captures: { sp_id: $.data.id, sp_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${sp_id}", expected_site_version: "${sp_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FP-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CP-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { ccp_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${sp_id}", returned_cylinder_id: "${ccp_id}" }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { op_id: $.data.id }
            - call: "POST /exchange-orders/${op_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-2"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${sp_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { rsp1_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rsp1_id}/count"
              payload: { counted_cash_cents: 23000, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${sb_id}", business_date: "2026-05-02" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rsb2_id: $.data.id }
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${sp_id}", business_date: "2026-05-02" }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { rsp2_id: $.data.id }
          trigger:
            - call: "POST /reconciliation-sessions/${rsb2_id}/count"
              payload: { counted_cash_cents: 23000, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions/${rsp2_id}/count"
              payload: { counted_cash_cents: 23000, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { rsp2_status: $.data.status }
          assert:
            - "ReconciliationSession.${rsb2_id}.opening_baseline_cents == 20000 (BOOK: declared float)"
            - "ReconciliationSession.${rsb2_id}.expected_cash_cents == 20000"
            - "ReconciliationSession.${rsb2_id}.cash_variance_cents == 3000"
            - "ReconciliationSession.${rsb2_id}.status == VARIANCE_FLAGGED"
            - "ReconciliationSession.${rsp2_id}.opening_baseline_cents == 23000 (PHYSICAL: prior day counted close carried)"
            - "ReconciliationSession.${rsp2_id}.expected_cash_cents == 23000"
            - "ReconciliationSession.${rsp2_id}.cash_variance_cents == 0"
            - "ReconciliationSession.${rsp2_id}.status == BALANCED"

      - name: commission_base_gross_vs_net
        grounds:
          - calculations.commission_settlement
          - entities.HostSite.fields.commission_basis
          - state_machines.CommissionStatement.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Entity domain = CommissionStatement settlement. Two sites with
          IDENTICAL sales and one identical same-day refund differ only in
          commission_basis: GROSS keeps the refunded 6494 sale in the
          commissioned set (commission 962, including a marginal tier straddle),
          NET excludes it (commission 271).
        test_recipe:
          setup:
            - "Site G (commission_basis GROSS) and site N (commission_basis NET); both: commission_rate_bps=1000, commission_tier_threshold_cents=5000, commission_tier2_bonus_bps=100, active policy, 2 FULL fleet cylinders, 1 EMPTY customer cylinder"
            - "On 2026-05-01 at both sites: order1 swap-with-return completed (2705); order2 swap-without-return completed (6494) then refunded same day"
            - "Both sites: reconciliation session for 2026-05-01 counted to BALANCED (cash 22705, full 0, empty 1); clock advanced to 2026-05-02"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Gross Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000, commission_tier_threshold_cents: 5000 }
              as: PlatformAdmin
              captures: { sg_id: $.data.id, sg_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${sg_id}", expected_site_version: "${sg_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FG-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${sg_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FG-002", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${sg_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CG-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { ccg_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${sg_id}", returned_cylinder_id: "${ccg_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { og1_id: $.data.id }
            - call: "POST /exchange-orders/${og1_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /exchange-orders"
              payload: { site_id: "${sg_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { og2_id: $.data.id }
            - call: "POST /exchange-orders/${og2_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /exchange-orders/${og2_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${sg_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rsg_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rsg_id}/count"
              payload: { counted_cash_cents: 22705, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /sites"
              payload: { name: "Net Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000, commission_tier_threshold_cents: 5000, commission_basis: NET }
              as: PlatformAdmin
              captures: { sn_id: $.data.id, sn_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${sn_id}", expected_site_version: "${sn_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FN-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${sn_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FN-002", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${sn_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CN-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { ccn_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${sn_id}", returned_cylinder_id: "${ccn_id}" }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { on1_id: $.data.id }
            - call: "POST /exchange-orders/${on1_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-2"
            - call: "POST /exchange-orders"
              payload: { site_id: "${sn_id}" }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { on2_id: $.data.id }
            - call: "POST /exchange-orders/${on2_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-2"
            - call: "POST /exchange-orders/${on2_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-2"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${sn_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { rsn_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rsn_id}/count"
              payload: { counted_cash_cents: 22705, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /commission-statements"
              payload: { site_id: "${sg_id}", period_start: "2026-05-01", period_end: "2026-05-01" }
              as: PlatformAdmin
              captures: { stg_id: $.data.id }
            - call: "POST /commission-statements/${stg_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /commission-statements"
              payload: { site_id: "${sn_id}", period_start: "2026-05-01", period_end: "2026-05-01" }
              as: PlatformAdmin
              captures: { stn_id: $.data.id }
            - call: "POST /commission-statements/${stn_id}/finalize"
              payload: {}
              as: PlatformAdmin
          assert:
            - "CommissionStatement.${stg_id}.basis_used == GROSS"
            - "CommissionStatement.${stg_id}.gross_sales_cents == 9199"
            - "CommissionStatement.${stg_id}.refunds_cents == 6494"
            - "CommissionStatement.${stg_id}.base_cents == 9199"
            - "CommissionStatement.${stg_id}.commission_cents == 962 (271 + 691; second sale straddles the 5000 tier: 2295 below + 4199 above)"
            - "CommissionStatement.${stg_id}.net_payable_cents == 962"
            - "CommissionStatement.${stn_id}.basis_used == NET"
            - "CommissionStatement.${stn_id}.gross_sales_cents == 9199"
            - "CommissionStatement.${stn_id}.base_cents == 2705"
            - "CommissionStatement.${stn_id}.commission_cents == 271"
            - "CommissionStatement.${stn_id}.net_payable_cents == 271"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: swap_charge_conditional_deposit_and_tax
        grounds:
          - calculations.swap_charge
          - entities.ExchangeOrder.fields.core_deposit_cents
          - entities.ExchangeOrder.fields.tax_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with conditional branch: subtotal depends on a
          conditional deposit (returned cylinder present or not), tax applies to
          the post-deposit subtotal, and rounding is half-up on the combined
          base, so the deposit changes the tax, not just the total.
        test_recipe:
          setup:
            - "Site S with active policy P (swap 2499, deposit 3500, tax 825bps), 2 FULL fleet cylinders, 1 EMPTY customer cylinder"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Swap Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FS-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FS-002", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CS-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o1_total: $.data.total_cents, o1_tax: $.data.tax_cents, o1_dep: $.data.core_deposit_cents }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o2_total: $.data.total_cents, o2_tax: $.data.tax_cents, o2_dep: $.data.core_deposit_cents }
          assert:
            - "with-return order: core_deposit_cents == 0, tax_cents == 206, total_cents == 2705"
            - "no-return order: core_deposit_cents == 3500, tax_cents == 495, total_cents == 6494"
            - "ExchangeOrder tax delta (495-206=289) != deposit 3500 alone: tax is computed on subtotal including deposit"

      - name: commission_per_sale_rounding_then_sum
        grounds:
          - calculations.commission_settlement
          - entities.CommissionStatement.fields.commission_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned: per-sale half-up rounding
          BEFORE summing yields 271+271=542 for two 2705 sales at 1000bps, while
          the forbidden sum-then-round order would yield 541; the scaffold pins
          per-sale rounding and the test asserts 542.
        test_recipe:
          setup:
            - "Site S (default commission_tier_threshold_cents=100000 so both sales are entirely in tier 1 at 1000bps), active policy, 2 FULL fleet, 2 EMPTY customer cylinders"
            - "On 2026-05-01: two swap-with-return orders completed (2705 each); session for 2026-05-01 counted BALANCED (cash 25410, full 0, empty 2); clock at 2026-05-02"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Round Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FR-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FR-002", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CR-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "CR-002", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc2_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc1_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o1_id: $.data.id }
            - call: "POST /exchange-orders/${o1_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc2_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o2_id: $.data.id }
            - call: "POST /exchange-orders/${o2_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 25410, counted_full_cylinders: 0, counted_empty_cylinders: 2 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /commission-statements"
              payload: { site_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-01" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /commission-statements/${st_id}/finalize"
              payload: {}
              as: PlatformAdmin
          assert:
            - "CommissionStatement.${st_id}.gross_sales_cents == 5410"
            - "CommissionStatement.${st_id}.commission_cents == 542 (per-sale round_half_up: 271 + 271; sum-then-round would give 541)"
            - "CommissionStatement.${st_id}.net_payable_cents == 542"

