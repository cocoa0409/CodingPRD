            - "WorkDayLog.${l2_id}.status == OPEN (adjacent day is not occupied)"
            - "WorkDayLog.${l2_id}.turnaround_violation == false (rest 960 min >= 720 min ULB threshold)"

      - name: force_majeure_half_open_interval_overlap
        grounds:
          - validations[priority=26]
          - errors[ERR_FM_OVERLAP]
          - entities.ForceMajeureEvent.fields.start_date
          - entities.ForceMajeureEvent.fields.end_date
        distinguishing_aspect: |
          Interval semantics: half-open date-RANGE overlap on the production resource
          (different semantics from day-point equality and a different resource):
          [2026-08-05, 2026-08-08) then [2026-08-08, 2026-08-10) touch but do not
          overlap (adjacency allowed), while [2026-08-09, 2026-08-12) overlaps the
          second event by one day and is rejected with ERR_FM_OVERLAP — even though
          that second event is already LIFTED (the historical interval still occupies).
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production IN_PRODUCTION; FM1 [2026-08-05, 2026-08-08) declared and lifted (clock 2026-08-08); FM2 [2026-08-08, 2026-08-10) declared (adjacency accepted) and lifted (clock 2026-08-10)"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Sumac Trail LLC", fein: "16-0000005" }, as: ProducerRep, captures: { co_id: $.data.id } }
