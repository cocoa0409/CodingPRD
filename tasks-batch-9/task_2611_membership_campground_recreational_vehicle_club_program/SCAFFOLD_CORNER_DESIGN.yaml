            - "park_class CLASS_B with limit 2 offset 2: one row, total_count 3, has_more false, and that row is the CLASS_B park absent from the first page — no row is repeated or skipped across the two pages"
            - "park_status OPEN alone: total_count 2 (one CLASS_B and one CLASS_C), both reporting park_status OPEN"
