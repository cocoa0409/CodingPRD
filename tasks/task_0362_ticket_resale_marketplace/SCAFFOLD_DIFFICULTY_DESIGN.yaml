              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "GET /sellers/${seller_id}"
              payload: {}
              as: PlatformAdmin
              captures: { escrow_after_charge: $.data.escrow_balance_cents }
            - call: "POST /orders/${order_id}/transfers"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /transfers/${tr_id}/fail"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /guarantee-claims"
              payload: { order_id: "${order_id}", reason: "NOT_DELIVERED" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /guarantee-claims/${claim_id}/investigate"
              payload: {}
              as: TrustSafety
          trigger:
            - call: "POST /guarantee-claims/${claim_id}/refund"
              payload: {}
              as: TrustSafety
            - call: "GET /sellers/${seller_id}"
              payload: {}
              as: PlatformAdmin
              captures: { escrow_after_clawback: $.data.escrow_balance_cents }
          assert:
            - "Seller.${seller_id}.escrow_balance_cents == 34000 after charge"
            - "Seller.${seller_id}.escrow_balance_cents == 0 after clawback (conserved to pre-charge value)"

      - name: buyer_wallet_credit_conserved_issue_then_redeem
        grounds:
          - calculations.event_credit_amount
          - state_machines.EventCredit.ISSUED_to_REDEEMED
          - entities.Buyer.fields.wallet_credit_cents
          - state_machines.Order.PENDING_to_CHARGED
        distinguishing_aspect: |
          DIFFERENT conserved quantity = buyer.wallet_credit_cents (sum of ISSUED EventCredits). An
          issued credit of 44800 raises the wallet to 44800; applying 44800 of it on a later charge
          redeems exactly that amount, returning wallet_credit_cents to 0 (no drift between issue and redeem).
        test_recipe:
          setup:
            - "Buyer earns a 44800 EventCredit from a cancelled event, then reserves+charges a new 44800 order applying the full credit."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${venue_id}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 2 }
              as: PlatformAdmin
              captures: { section_id: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "E1", doors_open_at: "2028-03-01T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event1: $.data.id }
            - call: "POST /events/${event1}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event1}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lid1: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid1}", row_label: "1", seat_number: 1, barcode_token: "W-1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid1}", row_label: "1", seat_number: 2, barcode_token: "W-2" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${lid1}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lv1: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid1}", buyer_id: "${buyer_id}", quantity: 2, expected_listing_version: "${lv1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order1: $.data.id }
            - call: "POST /orders/${order1}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /events/${event1}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /buyers/${buyer_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wallet_after_issue: $.data.wallet_credit_cents }
            # Second event/listing to spend the credit on
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "E2", doors_open_at: "2028-04-01T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event2: $.data.id }
            - call: "POST /events/${event2}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { event_id: "${event2}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lid2: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid2}", row_label: "1", seat_number: 1, barcode_token: "W2-1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid2}", row_label: "1", seat_number: 2, barcode_token: "W2-2" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${lid2}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lv2: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid2}", buyer_id: "${buyer_id}", quantity: 2, expected_listing_version: "${lv2}", applied_credit_cents: 44800 }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order2: $.data.id }
          trigger:
            - call: "POST /orders/${order2}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { total2: $.data.final_total_cents }
            - call: "GET /buyers/${buyer_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wallet_after_redeem: $.data.wallet_credit_cents }
          assert:
            - "Buyer.${buyer_id}.wallet_credit_cents == 44800 after issue"
            - "Order.${order2}.final_total_cents == 0 (full credit applied)"
            - "Buyer.${buyer_id}.wallet_credit_cents == 0 after redeem (conserved to pre-issue value)"
