# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Survey & Market-Research Panel — EXPERT
# Enumerative coverage of every testable claim in §1.1–§1.7 NOT already covered
# by the nine §0.5 Difficulty Rules. Sections + claim_types come verbatim from
# references/claim-extraction-guide.md. Per-instance contract identical to §1.8.
# `name` is unique across the UNION of this file and SCAFFOLD_DIFFICULTY_DESIGN.
# excluded_because stubs cite §1.8 instances by exact name and carry no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      # --- Creation happy-path (envelope + 201) ---
      - name: create_study_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Study
          - entities.Study.fields.status
          - entities.Study.fields.required_consent_version
        distinguishing_aspect: "POST /studies with all required fields returns 201, status==DRAFT, target_total_n==0, committed_total_n==0, required_consent_version defaults to 1 when omitted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studies"
              payload: { title: "S1", irb_protocol_number: "IRB-001", estimated_minutes: 12, base_incentive_points: 80, screener_min_age: 18 }
              as: ResearchManager
              captures: { sid: $.data.id, st: $.data.status, rcv: $.data.required_consent_version }
          assert:
            - "HTTP 201"
            - "data.status == DRAFT"
            - "data.target_total_n == 0 and data.committed_total_n == 0"
            - "data.required_consent_version == 1 (default applied)"

      - name: create_panelist_returns_201_active_zeroed
        claim_type: Creation
        grounds:
          - entities.Panelist
          - entities.Panelist.fields.status
          - entities.Panelist.fields.points_balance
          - entities.Panelist.fields.health_score
        distinguishing_aspect: "POST /panelists returns 201 with status==ACTIVE, points_balance==0, health_score==100, lifetime counters==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /panelists"
              payload: { email: "np@x.com", full_name: "New P", age: 25, segment_key: "SEG_NP" }
              as: PanelOps
              captures: { pid: $.data.id, st: $.data.status, pb: $.data.points_balance, hs: $.data.health_score }
          assert:
            - "HTTP 201"
            - "data.status == ACTIVE"
            - "data.points_balance == 0 and data.health_score == 100"
            - "data.lifetime_invited_n == 0 and data.lifetime_completed_n == 0"

      # --- Retrieval ---
      - name: get_study_recomputes_quota_totals
        claim_type: Retrieval
        grounds:
          - entities.Study.fields.target_total_n
          - entities.Study.fields.committed_total_n
          - calculations.quota_fill
        distinguishing_aspect: "GET /studies/{id} returns the stored study with target_total_n recomputed as sum of its QuotaCell.target_n (5 after one cell of target_n=5)."
        test_recipe:
          setup: ["A DRAFT study with one QuotaCell target_n=5."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "GS", irb_protocol_number: "IRB-GS", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_GS", target_n: 5 }
              as: ResearchManager
          trigger:
            - call: "GET /studies/${sid}"
              payload: {}
              as: ResearchManager
              captures: { tt: $.data.target_total_n }
          assert:
            - "HTTP 200"
            - "data.target_total_n == 5"
            - "data.committed_total_n == 0"

      # --- Listing + pagination envelope ---
      - name: list_panelists_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - entities.Panelist
        distinguishing_aspect: "GET /panelists returns a paginated array with response_type array and meta; total_count and has_more reflect 2 created panelists under default limit 10."
        test_recipe:
          setup: ["Two panelists registered."]
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "l1@x.com", full_name: "L1", age: 30, segment_key: "SEG_L" }
              as: PanelOps
            - call: "POST /panelists"
              payload: { email: "l2@x.com", full_name: "L2", age: 31, segment_key: "SEG_L" }
              as: PanelOps
          trigger:
            - call: "GET /panelists"
              payload: {}
              as: PanelOps
          assert:
            - "HTTP 200, response_type == array"
            - "meta.total_count == 2 and meta.has_more == false (default limit 10 >= 2)"

      # --- Not Found ---
      - name: get_panelist_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /panelists/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /panelists/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PanelOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND"

      # --- Required field ---
      - name: create_study_missing_irb_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Study.fields.irb_protocol_number
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /studies omitting the required irb_protocol_number field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studies"
              payload: { title: "NoIrb", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_VALIDATION (required field irb_protocol_number missing)"

      # --- Computed field input ignored ---
      - name: create_quota_cell_computed_counts_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.QuotaCell.fields.reserved_n
          - entities.QuotaCell.fields.committed_n
          - entities.QuotaCell.fields.available_n
          - entities.QuotaCell.fields.fill_status
        distinguishing_aspect: "POST /studies/{id}/quota-cells initializes computed fields server-side: reserved_n==0, committed_n==0, available_n==target_n(3), fill_status==OPEN — client cannot set them (input schema is only segment_key,target_n)."
        test_recipe:
          setup: ["A DRAFT study."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "QC", irb_protocol_number: "IRB-QC", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_QC", target_n: 3 }
              as: ResearchManager
              captures: { cid: $.data.id, av: $.data.available_n, fs: $.data.fill_status }
          assert:
            - "HTTP 201"
            - "data.reserved_n == 0 and data.committed_n == 0"
            - "data.available_n == 3 and data.fill_status == OPEN"

      # --- Type / enum constraint ---
      - name: create_consent_invalid_decision_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.Consent.fields.decision
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /consents with decision outside {ACCEPTED,DECLINED,WITHDRAWN} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A panelist and a study exist."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "EN", irb_protocol_number: "IRB-EN", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /panelists"
              payload: { email: "en@x.com", full_name: "EN", age: 30, segment_key: "SEG_EN" }
              as: PanelOps
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "MAYBE" }
              as: PanelOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_VALIDATION (invalid enum decision)"

      # --- Immutability of common_fields:false entity (Consent) ---
      - name: consent_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.Consent
          - entities.Consent.fields.recorded_at
        distinguishing_aspect: "Consent has common_fields:false (only id, created_at) — there is no PUT/PATCH/DELETE on /consents, only POST/GET; the record is append-only."
        test_recipe:
          setup: ["A consent record exists."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "IM", irb_protocol_number: "IRB-IM", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /panelists"
              payload: { email: "im@x.com", full_name: "IM", age: 30, segment_key: "SEG_IM" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /consents/${cid}"
              payload: {}
              as: PanelOps
              captures: { ra: $.data.recorded_at }
          assert:
            - "HTTP 200; data.recorded_at is server-stamped at the default clock 2026-03-01T00:00:00Z"
            - "No update endpoint exists for Consent in §1.5 (append-only, common_fields:false carries no version field)"

      # --- Parent relationship: quota-cell under wrong/nonexistent study ---
      - name: create_quota_cell_nonexistent_study_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.QuotaCell.fields.study_id
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /studies/{id}/quota-cells against a non-existent study id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studies/00000000-0000-4000-8000-000000000000/quota-cells"
              payload: { segment_key: "SEG_X", target_n: 2 }
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND"

      # --- flat topology FK integrity ---
      - name: create_participation_nonexistent_quota_cell_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Participation.fields.quota_cell_id
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /participations referencing a non-existent quota_cell_id returns ERR_NOT_FOUND (404) — flat-topology FK integrity validated."
        test_recipe:
          setup: ["A FIELDING study and a panelist exist, but the supplied quota_cell_id does not."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "FK", irb_protocol_number: "IRB-FK", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_FK", target_n: 2 }
              as: ResearchManager
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "fk@x.com", full_name: "FK", age: 30, segment_key: "SEG_FK" }
              as: PanelOps
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "00000000-0000-4000-8000-000000000000" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND (quota_cell_id does not resolve)"

  # ===========================================================================
  - section: state_machines
    instances:
      # --- Initial state ---
      - name: participation_initial_states_screening_notstarted
        claim_type: Initial State
        grounds:
          - entities.Participation.fields.screening_status
          - entities.Participation.fields.completion_status
        distinguishing_aspect: "A freshly created Participation starts screening_status==SCREENING and completion_status==NOT_STARTED (both parallel axes at their initial_state)."
        test_recipe:
          setup: ["A FIELDING study with a free quota cell and a panelist."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "IS", irb_protocol_number: "IRB-IS", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_IS", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "is@x.com", full_name: "IS", age: 30, segment_key: "SEG_IS" }
              as: PanelOps
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id, ss: $.data.screening_status, cs: $.data.completion_status }
          assert:
            - "HTTP 201"
            - "data.screening_status == SCREENING and data.completion_status == NOT_STARTED"
            - "data.rescreen_count == 0"

      # --- Invalid transition (terminal lockdown) ---
      - name: launch_already_fielding_study_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Study.DRAFT_to_FIELDING
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /studies/{id}/launch on a study already in FIELDING returns ERR_INVALID_STATE (409) — DRAFT->FIELDING is only defined from DRAFT."
        test_recipe:
          setup: ["A FIELDING study (launched once)."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "IL", irb_protocol_number: "IRB-IL", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_IL", target_n: 2 }
              as: ResearchManager
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
          trigger:
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_INVALID_STATE (already FIELDING)"

      # --- Terminal lockdown ---
      - name: cancel_already_cancelled_payout_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PayoutRequest.REQUESTED_to_CANCELLED
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /payout-requests/{id}/cancel on an already CANCELLED (terminal) request returns ERR_INVALID_STATE (409); no transition is defined from CANCELLED."
        test_recipe:
          setup: ["A panelist with a CANCELLED payout request."]
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "tc@x.com", full_name: "TC", age: 30, segment_key: "SEG_TC" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "GET /panelists/${pid}"
              payload: {}
              as: PanelOps
              captures: { v0: $.data.version }
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pid}", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v0}" }
              as: Panelist
              as_user_id: "${pid}"
              captures: { rid: $.data.id }
            - call: "POST /payout-requests/${rid}/cancel"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
          trigger:
            - call: "POST /payout-requests/${rid}/cancel"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_INVALID_STATE (CANCELLED is terminal)"

      # --- Valid transition + side effect (study pause freezes recruitment) ---
      - name: pause_study_then_create_participation_blocked
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Study.FIELDING_to_PAUSED
          - "errors[ERR_STUDY_NOT_FIELDING]"
        distinguishing_aspect: "After POST /studies/{id}/pause, creating a Participation is blocked because recruitment is frozen — POST /participations returns ERR_STUDY_NOT_FIELDING (409)."
        test_recipe:
          setup: ["A PAUSED study with a free quota cell and a panelist."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "PF", irb_protocol_number: "IRB-PF", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_PF", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /studies/${sid}/pause"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pf@x.com", full_name: "PF", age: 30, segment_key: "SEG_PF" }
              as: PanelOps
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_STUDY_NOT_FIELDING (recruitment frozen while PAUSED)"

      # --- Bubble-up: QUALIFIED flips fill_status OPEN->FILLED ---
      - name: qualify_flips_quota_cell_fill_status_filled
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Participation.SCREENED_IN_to_QUALIFIED
          - calculations.quota_fill
          - entities.QuotaCell.fields.fill_status
          - entities.QuotaCell.fields.committed_n
        distinguishing_aspect: "On the single QUALIFIED complete in a target_n=1 cell, quota_fill bubbles up committed_n to 1 and flips fill_status OPEN->FILLED."
        test_recipe:
          setup: ["A FIELDING study with QuotaCell target_n=1; a SCREENED_IN, started participation about to submit with PASS quality."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "FILL", irb_protocol_number: "IRB-FILL", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_FILL", target_n: 1 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "fill@x.com", full_name: "FILL", age: 30, segment_key: "SEG_FILL" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
          trigger:
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "GET /quota-cells/${cid}"
              payload: {}
              as: ResearchManager
              captures: { fs: $.data.fill_status, cn: $.data.committed_n }
          assert:
            - "Participation.${part_id}.screening_status == QUALIFIED"
            - "QuotaCell.${cid}.committed_n == 1 and fill_status == FILLED (committed_n >= target_n 1)"

      # --- Cascade down: focus-group cancel cascades bookings ---
      - name: cancel_focus_group_cascades_bookings_cancelled
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FocusGroup.SCHEDULED_to_CANCELLED
          - state_machines.FocusGroupBooking.CONFIRMED_to_CANCELLED
          - entities.FocusGroup.fields.booked_n
        distinguishing_aspect: "POST /focus-groups/{id}/cancel transitions the session to CANCELLED and cascades all CONFIRMED bookings to CANCELLED, recomputing booked_n down to 0."
        test_recipe:
          setup: ["A SCHEDULED focus group with one CONFIRMED booking."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "FGC", irb_protocol_number: "IRB-FGC", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /facilities"
              payload: { name: "FGC Room", capacity: 10 }
              as: FieldCoordinator
              captures: { fac: $.data.id }
            - call: "POST /focus-groups"
              payload: { study_id: "${sid}", facility_id: "${fac}", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T11:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { fg: $.data.id, fgv: $.data.version }
            - call: "POST /panelists"
              payload: { email: "fgc@x.com", full_name: "FGC", age: 30, segment_key: "SEG_FGC" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fg}", panelist_id: "${pid}", expected_focus_group_version: "${fgv}" }
              as: FieldCoordinator
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /focus-groups/${fg}/cancel"
              payload: {}
              as: FieldCoordinator
            - call: "GET /focus-group-bookings/${bk}"
              payload: {}
              as: FieldCoordinator
              captures: { bst: $.data.status }
          assert:
            - "FocusGroup.${fg}.status == CANCELLED"
            - "FocusGroupBooking.${bk}.status == CANCELLED (cascade down)"
            - "FocusGroup.${fg}.booked_n == 0 (recomputed after cascade)"

      # --- excluded: study close cascade already in §1.8 ---
      - name: study_close_voids_screening_participations
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Study.FIELDING_to_CLOSED
          - state_machines.Participation.SCREENING_to_VOIDED
        excluded_because:
          difficulty_instance: study_close_cascade_void_release_voidaccrual
          rationale: "The Study-close -> VOIDED -> seat release -> accrual VOID cascade is the depth-3 transitive_cascade §1.8 instance; covered there end-to-end."

      # --- excluded: panelist suspend cascade already in §1.8 ---
      - name: panelist_suspend_voids_open_participations
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Panelist.ACTIVE_to_SUSPENDED
          - state_machines.Participation.SCREENING_to_VOIDED
        excluded_because:
          difficulty_instance: panelist_suspend_cascade_void_release
          rationale: "The Panelist-suspend -> VOIDED -> seat release cascade is the depth-2 transitive_cascade §1.8 instance."

      # --- Idempotency: second screen on already-screened participation ---
      - name: screen_in_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Participation.SCREENING_to_SCREENED_IN
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Screening a participation IN a second time (it is now SCREENED_IN) returns ERR_INVALID_STATE (409); SCREENING->SCREENED_IN is only defined from SCREENING."
        test_recipe:
          setup: ["A SCREENED_IN participation."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "IDP", irb_protocol_number: "IRB-IDP", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_IDP", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "idp@x.com", full_name: "IDP", age: 30, segment_key: "SEG_IDP" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
          trigger:
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_INVALID_STATE (already SCREENED_IN)"

      # --- Guarded transition: deliver requires READY DataDelivery ---
      - name: deliver_without_ready_delivery_returns_delivery_not_ready
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Study.CLOSED_to_DELIVERED
          - "errors[ERR_DELIVERY_NOT_READY]"
        distinguishing_aspect: "POST /studies/{id}/deliver on a CLOSED study with no READY DataDelivery returns ERR_DELIVERY_NOT_READY (409)."
        test_recipe:
          setup: ["A CLOSED study with NO DataDelivery built to READY."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "DL", irb_protocol_number: "IRB-DL", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_DL", target_n: 2 }
              as: ResearchManager
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /studies/${sid}/close"
              payload: {}
              as: ResearchManager
          trigger:
            - call: "POST /studies/${sid}/deliver"
              payload: {}
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_DELIVERY_NOT_READY"

      # --- DataDelivery build requires CLOSED study ---
      - name: build_delivery_while_study_fielding_returns_not_closed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DataDelivery.BUILDING_to_READY
          - "errors[ERR_STUDY_NOT_CLOSED]"
        distinguishing_aspect: "POST /data-deliveries/{id}/build while the parent Study is still FIELDING returns ERR_STUDY_NOT_CLOSED (409)."
        test_recipe:
          setup: ["A FIELDING study with a BUILDING DataDelivery."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "BD", irb_protocol_number: "IRB-BD", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_BD", target_n: 2 }
              as: ResearchManager
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /data-deliveries"
              payload: { study_id: "${sid}", report_format: "CSV" }
              as: ResearchManager
              captures: { did: $.data.id }
          trigger:
            - call: "POST /data-deliveries/${did}/build"
              payload: {}
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_STUDY_NOT_CLOSED (parent study not CLOSED)"

      # --- abandon cross-axis cascade voids open screening ---
      - name: abandon_in_progress_voids_screening_axis
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Participation.IN_PROGRESS_to_ABANDONED
          - state_machines.Participation.SCREENING_to_VOIDED
          - entities.Participation.fields.screening_status
        distinguishing_aspect: "POST /participations/{id}/abandon while completion is IN_PROGRESS and screening is SCREENED_IN voids the screening axis (SCREENED_IN->VOIDED), releasing the seat — a cross-axis cascade on one entity."
        test_recipe:
          setup: ["A SCREENED_IN, started (IN_PROGRESS) participation."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "AB", irb_protocol_number: "IRB-AB", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_AB", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "ab@x.com", full_name: "AB", age: 30, segment_key: "SEG_AB" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
          trigger:
            - call: "POST /participations/${part_id}/abandon"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
              captures: { cs: $.data.completion_status, ss: $.data.screening_status }
          assert:
            - "Participation.${part_id}.completion_status == ABANDONED"
            - "Participation.${part_id}.screening_status == VOIDED (cross-axis cascade)"
            - "QuotaCell.${cid}.reserved_n == 0 and available_n == 2 (seat released)"

  # ===========================================================================
  - section: calculations
    instances:
      # --- cash_cents at request time ---
      - name: payout_cash_cents_computed_from_points
        claim_type: Correct Result
        grounds:
          - entities.PayoutRequest.fields.cash_cents
          - calculations.points_balance
        distinguishing_aspect: "POST /payout-requests sets cash_cents = points_requested * CENTS_PER_POINT(2); for points_requested=150, cash_cents==300."
        test_recipe:
          setup: ["A panelist with points_balance 150 (one QUALIFIED participation, finalized accrual 150)."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "CC", irb_protocol_number: "IRB-CC", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_CC2", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "cc@x.com", full_name: "CC", age: 30, segment_key: "SEG_CC2" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "GET /panelists/${pid}"
              payload: {}
              as: PanelOps
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pid}", payout_method: "CASH", points_requested: 150, expected_panelist_version: "${v0}" }
              as: Panelist
              as_user_id: "${pid}"
              captures: { cc: $.data.cash_cents }
          assert:
            - "HTTP 201"
            - "data.cash_cents == 300 (150 points * CENTS_PER_POINT 2)"

      # --- DataDelivery snapshot included_completes_n ---
      - name: build_delivery_snapshots_included_completes
        claim_type: Correct Result
        grounds:
          - state_machines.DataDelivery.BUILDING_to_READY
          - entities.DataDelivery.fields.included_completes_n
        distinguishing_aspect: "POST /data-deliveries/{id}/build snapshots included_completes_n = count of Participations with quality_status PASS and completion_status COMPLETED; with one PASS complete the snapshot is 1."
        test_recipe:
          setup: ["A study with one QUALIFIED (PASS+COMPLETED) participation, then CLOSED, with a BUILDING DataDelivery."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "SNP", irb_protocol_number: "IRB-SNP", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_SNP", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "snp@x.com", full_name: "SNP", age: 30, segment_key: "SEG_SNP" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /data-deliveries"
              payload: { study_id: "${sid}", report_format: "CSV" }
              as: ResearchManager
              captures: { did: $.data.id }
            - call: "POST /studies/${sid}/close"
              payload: {}
              as: ResearchManager
          trigger:
            - call: "POST /data-deliveries/${did}/build"
              payload: {}
              as: ResearchManager
              captures: { icn: $.data.included_completes_n, st: $.data.status }
          assert:
            - "HTTP 200"
            - "data.status == READY"
            - "data.included_completes_n == 1 (one PASS+COMPLETED participation; note its seat survives close because QUALIFIED is terminal, not SCREENING/SCREENED_IN)"

      # --- excluded: quality_score correctness covered by §1.8 ---
      - name: quality_score_weighted_correct
        claim_type: Correct Result
        grounds:
          - calculations.quality_score
        excluded_because:
          difficulty_instance: quality_score_three_input_nonlinear_weighting
          rationale: "Weighted quality_score correctness (and its tier derivation) is exercised by the combinatorial_formula mode-(a) §1.8 instance and the boundary instance."

      # --- excluded: incentive finalize covered by §1.8 ---
      - name: incentive_finalize_multiplier_applied
        claim_type: Variant Selection
        grounds:
          - calculations.incentive_accrual
        excluded_because:
          difficulty_instance: incentive_provisional_vs_finalized_diverge_on_points
          rationale: "Variant selection (provisional at SCREENED_IN, finalized at QUALIFIED) is the dual_variant_calc §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      # --- duplicate segment ---
      - name: duplicate_segment_key_in_study_returns_conflict
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_DUPLICATE_SEGMENT]"
        distinguishing_aspect: "POST /studies/{id}/quota-cells with a segment_key already used in that study returns ERR_DUPLICATE_SEGMENT (409)."
        test_recipe:
          setup: ["A study with one QuotaCell segment_key='DUP'."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "DUP", irb_protocol_number: "IRB-DUP", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "DUP", target_n: 2 }
              as: ResearchManager
          trigger:
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "DUP", target_n: 3 }
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_DUPLICATE_SEGMENT"

      # --- launch without quota cells ---
      - name: launch_without_quota_cells_returns_no_quota_cells
        claim_type: violation_to_error
        grounds:
          - state_machines.Study.DRAFT_to_FIELDING
          - "errors[ERR_NO_QUOTA_CELLS]"
        distinguishing_aspect: "POST /studies/{id}/launch on a DRAFT study with no QuotaCell (target_total_n<1) returns ERR_NO_QUOTA_CELLS (409)."
        test_recipe:
          setup: ["A DRAFT study with no quota cells."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "NQ", irb_protocol_number: "IRB-NQ", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_NO_QUOTA_CELLS"

      # --- launch with empty irb ---
      - name: launch_empty_irb_returns_irb_required
        claim_type: violation_to_error
        grounds:
          - state_machines.Study.DRAFT_to_FIELDING
          - "errors[ERR_IRB_PROTOCOL_REQUIRED]"
        distinguishing_aspect: "POST /studies/{id}/launch when irb_protocol_number is empty returns ERR_IRB_PROTOCOL_REQUIRED (422), even though a quota cell exists."
        test_recipe:
          setup: ["A DRAFT study created with an empty irb_protocol_number and one quota cell."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "EI", irb_protocol_number: "", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_EI", target_n: 2 }
              as: ResearchManager
          trigger:
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_IRB_PROTOCOL_REQUIRED"

      # --- payout below minimum ---
      - name: payout_below_minimum_returns_below_minimum
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_PAYOUT_BELOW_MINIMUM]"
        distinguishing_aspect: "POST /payout-requests with points_requested below MIN_PAYOUT_POINTS returns ERR_PAYOUT_BELOW_MINIMUM (422). Uses points_requested=1, the smallest value the field allows (>=1), which is below any positive MIN_PAYOUT_POINTS threshold."
        test_recipe:
          setup: ["A freshly registered panelist with points_balance 0 (the minimum-points check at priority 13 precedes the fiscal balance check at priority 14)."]
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "bm@x.com", full_name: "BM", age: 30, segment_key: "SEG_BM" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "GET /panelists/${pid}"
              payload: {}
              as: PanelOps
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pid}", payout_method: "CASH", points_requested: 1, expected_panelist_version: "${v0}" }
              as: Panelist
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_PAYOUT_BELOW_MINIMUM (points_requested 1 < MIN_PAYOUT_POINTS)"

      # --- seats exceed capacity ---
      - name: focus_group_seats_exceed_capacity_returns_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SEATS_EXCEED_CAPACITY]"
          - entities.FocusGroup.fields.seats
          - entities.Facility.fields.capacity
        distinguishing_aspect: "POST /focus-groups with seats(5) > facility.capacity(3) returns ERR_SEATS_EXCEED_CAPACITY (422)."
        test_recipe:
          setup: ["A facility with capacity 3."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "SE", irb_protocol_number: "IRB-SE", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Small Room", capacity: 3 }
              as: FieldCoordinator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /focus-groups"
              payload: { study_id: "${sid}", facility_id: "${fac}", starts_at: "2026-05-02T10:00:00Z", ends_at: "2026-05-02T11:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_SEATS_EXCEED_CAPACITY"

      # --- session full ---
      - name: booking_when_session_full_returns_session_full
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SESSION_FULL]"
          - entities.FocusGroup.fields.booked_n
          - entities.FocusGroup.fields.seats
        distinguishing_aspect: "A FocusGroup with seats=1 already has its single seat booked (booked_n>=seats); a second booking returns ERR_SESSION_FULL (409)."
        test_recipe:
          setup: ["A SCHEDULED focus group seats=1 with one CONFIRMED booking; a second distinct panelist attempts to book."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "SF", irb_protocol_number: "IRB-SF", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Solo Room", capacity: 5 }
              as: FieldCoordinator
              captures: { fac: $.data.id }
            - call: "POST /focus-groups"
              payload: { study_id: "${sid}", facility_id: "${fac}", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T11:00:00Z", seats: 1 }
              as: FieldCoordinator
              captures: { fg: $.data.id, fgv0: $.data.version }
            - call: "POST /panelists"
              payload: { email: "sf1@x.com", full_name: "SF1", age: 30, segment_key: "SEG_SF" }
              as: PanelOps
              captures: { pidA: $.data.id }
            - call: "POST /panelists"
              payload: { email: "sf2@x.com", full_name: "SF2", age: 30, segment_key: "SEG_SF" }
              as: PanelOps
              captures: { pidB: $.data.id }
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fg}", panelist_id: "${pidA}", expected_focus_group_version: "${fgv0}" }
              as: FieldCoordinator
              captures: { bkA: $.data.id }
            - call: "GET /focus-groups/${fg}"
              payload: {}
              as: FieldCoordinator
              captures: { fgv1: $.data.version }
          trigger:
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fg}", panelist_id: "${pidB}", expected_focus_group_version: "${fgv1}" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_SESSION_FULL (booked_n 1 >= seats 1)"

      # --- submit missing fields ---
      - name: submit_missing_fields_returns_submit_fields_missing
        claim_type: violation_to_error
        grounds:
          - state_machines.Participation.IN_PROGRESS_to_COMPLETED
          - "errors[ERR_SUBMIT_FIELDS_MISSING]"
          - entities.Participation.fields.completion_seconds
          - entities.Participation.fields.straightline_run
        distinguishing_aspect: "POST /participations/{id}/submit without completion_seconds/straightline_run returns ERR_SUBMIT_FIELDS_MISSING (422). Note both are required inputs of /submit."
        test_recipe:
          setup: ["A SCREENED_IN, started (IN_PROGRESS) participation."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "SM", irb_protocol_number: "IRB-SM", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_SM", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "sm@x.com", full_name: "SM", age: 30, segment_key: "SEG_SM" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
          trigger:
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600 }
              as: Panelist
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_SUBMIT_FIELDS_MISSING (straightline_run absent)"

      # --- rescreen limit (uses name-based negative bypass) ---
      - name: rescreen_over_limit_returns_rescreen_limit_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_RESCREEN_LIMIT]"
          - entities.Participation.fields.rescreen_count
          - state_machines.Participation.SCREENED_OUT_to_SCREENING
        distinguishing_aspect: "Once rescreen_count reaches MAX_RESCREENS, the next POST /participations/{id}/rescreen is rejected with ERR_RESCREEN_LIMIT (422). The setup screens OUT then rescreens repeatedly until the limit is hit; the trigger is the rescreen that exceeds MAX_RESCREENS."
        test_recipe:
          setup: ["A FIELDING study with a free quota cell and a participation that has been screened OUT and rescreened up to MAX_RESCREENS times, currently SCREENED_OUT with rescreen_count == MAX_RESCREENS."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "RL", irb_protocol_number: "IRB-RL", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_RL", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "rl@x.com", full_name: "RL", age: 30, segment_key: "SEG_RL" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "OUT" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/rescreen"
              payload: {}
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "OUT" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/rescreen"
              payload: {}
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "OUT" }
              as: FieldCoordinator
          trigger:
            - call: "POST /participations/${part_id}/rescreen"
              payload: {}
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Once rescreen_count has reached MAX_RESCREENS, this rescreen returns HTTP 422"
            - "data.error_id == ERR_RESCREEN_LIMIT (rescreen_count >= MAX_RESCREENS); if MAX_RESCREENS exceeds the 2 loops in setup, repeat the screen-OUT/rescreen pair until the limit is reached, then trigger one more"

      # --- excluded: priority conflicts covered by §1.8 ---
      - name: consent_required_violation_on_screen
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_CONSENT_REQUIRED]"
        excluded_because:
          difficulty_instance: consent_beats_age_on_screen
          rationale: "ERR_CONSENT_REQUIRED is asserted as the winning error of the business_safety-vs-business_constraint priority §1.8 instance."

      - name: screener_age_fail_violation_on_screen
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SCREENER_AGE_FAIL]"
        excluded_because:
          difficulty_instance: consent_beats_age_on_screen
          rationale: "The age-fail condition is co-triggered in the priority-conflict §1.8 instance; an isolated age-only failure shares the same trigger path with consent present."

      - name: insufficient_points_violation_on_approve
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_INSUFFICIENT_POINTS]"
        excluded_because:
          difficulty_instance: points_balance_pinned_order_requested_excluded
          rationale: "ERR_INSUFFICIENT_POINTS on approve is the failure path of the pinned-order points_balance combinatorial §1.8 instance (reqB approve)."

      - name: quota_cell_full_violation_on_screen
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_QUOTA_CELL_FULL]"
        excluded_because:
          difficulty_instance: quota_last_seat_boundary_one_vs_zero
          rationale: "ERR_QUOTA_CELL_FULL at available_n==0 is the boundary_precision_check §1.8 instance."

