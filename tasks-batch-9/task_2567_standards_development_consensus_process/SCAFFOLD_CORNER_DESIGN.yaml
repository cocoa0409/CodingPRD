      - name: appeal_standing_is_checked_before_anything_else_about_the_filing
        claim_type: violation_to_error
        grounds:
          - validations[priority=97]
          - errors[ERR_APPELLANT_NOT_INTERESTED_PARTY]
        distinguishing_aspect: "A participant with no seat, no comment and no proposal must be refused standing."
        excluded_because:
          difficulty_instance: appeal_standing_error_precedes_untimeliness_error
          rationale: "That §1.8 error_precedence instance files exactly this appeal from an unseated outsider well after the 30-day window and asserts ERR_APPELLANT_NOT_INTERESTED_PARTY with no Appeal row created, so the standing violation is already triggered there."

      - name: a_ballot_window_one_day_under_the_minimum_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=110]
          - errors[ERR_BALLOT_WINDOW_TOO_SHORT]
        distinguishing_aspect: "The whole-day span must reach MIN_BALLOT_DAYS for the effective kind, inclusive at the boundary."
        excluded_because:
          difficulty_instance: ballot_window_of_exactly_min_ballot_days_is_accepted_one_day_less_is_not
          rationale: "That §1.8 boundary instance submits a 13-day subcommittee window and asserts ERR_BALLOT_WINDOW_TOO_SHORT, then the 14-day window and asserts acceptance, covering both sides of priority 110 in one chain."

      - name: two_public_review_windows_inside_the_buffer_collide
        claim_type: temporal_validation
        grounds:
          - validations[priority=115]
          - errors[ERR_REVIEW_WINDOW_BUFFER_CONFLICT]
        distinguishing_aspect: "Two reviews on the same work item must stay REVIEW_BUFFER_DAYS apart once both windows are widened."
        excluded_because:
          difficulty_instance: work_item_public_review_buffer_rejects_a_window_starting_on_the_buffered_edge
          rationale: "That §1.8 boundary instance announces a second review starting exactly on the buffered edge 2026-09-29 and asserts ERR_REVIEW_WINDOW_BUFFER_CONFLICT, then the next day and asserts acceptance."

      - name: a_third_overlapping_ballot_exceeds_the_committee_slot_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority=106]
          - errors[ERR_BALLOT_CAPACITY_EXCEEDED]
          - calculations.ballot_window_capacity_check
        distinguishing_aspect: "Occupancy is an aggregate over overlapping OPEN and CLOSED ballot windows on the committee."
        excluded_because:
          difficulty_instance: committee_ballot_slots_allow_adjacent_windows_but_cap_overlapping_ones
          rationale: "That §1.8 aggregate-boundary instance holds two overlapping ballots against max_concurrent_ballots 2, asserts ERR_BALLOT_CAPACITY_EXCEEDED on the third overlapping window and then accepts an adjacent window that shares only its endpoint."

  # ===================================================================================
  # Guide section 5 — From Table 5 (Endpoints). 51 endpoints: standard CRUD, 20 action
  # endpoints, filtered collection reads, computed reads and the logical-clock hook.
  # ===================================================================================
  - section: endpoints
    instances:

      - name: one_clock_advance_promotes_every_scheduled_public_review_at_once
        claim_type: bulk_action
        grounds:
