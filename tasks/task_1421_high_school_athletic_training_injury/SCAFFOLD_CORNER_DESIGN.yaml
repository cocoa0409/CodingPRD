          - state_machines.PhysicianReferral.ADDENDUM_REQUESTED_to_COMPLETED
        distinguishing_aspect: "The addendum loop COMPLETED -> ADDENDUM_REQUESTED -> COMPLETED re-runs the physician completion and OVERWRITES the report fields with refreshed reported_at."
        test_recipe:
          setup: ["Trainer T1, physician MD, athlete A; SPRAIN/MODERATE injury; referral REQUESTED -> SCHEDULED"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Doc Em", role_type: PHYSICIAN }, as: SystemAdmin, captures: { md: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 12, sex: F, primary_sport: SOFTBALL, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9204", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: SHOULDER, injury_type: SPRAIN, severity: MODERATE, mechanism: "throwing", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md}", reason: "rotator eval", urgency: URGENT }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id, ref_due: $.data.due_by } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-02T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "strain grade 1", report_clearance: CLEARED_RESTRICTED }, as: Physician, as_user_id: "${md}", captures: { s1: $.data.status, d1: $.data.report_diagnosis, ra1: $.data.reported_at } }
            - { call: "POST /referrals/${ref}/request-addendum", payload: { question: "clarify contact restrictions" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s2: $.data.status } }
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "strain grade 1 - resolved", report_clearance: CLEARED_FULL }, as: Physician, as_user_id: "${md}", captures: { s3: $.data.status, d3: $.data.report_diagnosis, c3: $.data.report_clearance } }
          assert:
            - "ref_due == 2026-08-04T00:00:00Z (URGENT = created_at + 3 days at the 2026-08-01 default clock)"
            - "s1 == COMPLETED and d1 == strain grade 1"
            - "s2 == ADDENDUM_REQUESTED (cycle edge)"
            - "s3 == COMPLETED and d3 == strain grade 1 - resolved and c3 == CLEARED_FULL (report overwritten)"

      - name: notification_failed_retry_cycle_and_channel_selection
        claim_type: valid_transition
        grounds:
          - state_machines.GuardianNotification.QUEUED_to_FAILED
          - state_machines.GuardianNotification.FAILED_to_QUEUED
          - entities.GuardianNotification.fields.channel
        distinguishing_aspect: "Channel is chosen at creation (EMAIL when guardian_email exists, else PHONE); a PHONE send to 'UNREACHABLE' fails (attempts 1), retry loops FAILED -> QUEUED, and a second send fails again (attempts 2) — the retry cycle is repeatable."
        test_recipe:
          setup:
            - "Trainer T1; athlete P with guardian_phone 'UNREACHABLE' and NO email; athlete Q with email only"
            - "One INJURY_INITIAL notification per athlete (auto-created with the injuries)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete P", date_of_birth: "2009-05-01", grade: 10, sex: M, primary_sport: WRESTLING, team_level: VARSITY, guardian_name: "Guard P", guardian_user_id: "g-9205", guardian_phone: "UNREACHABLE" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { aP: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete Q", date_of_birth: "2009-06-01", grade: 9, sex: F, primary_sport: TENNIS, team_level: FRESHMAN, guardian_name: "Guard Q", guardian_user_id: "g-9206", guardian_email: "gq@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { aQ: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${aP}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "takedown", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries", payload: { athlete_id: "${aQ}", body_region: ARM_HAND, injury_type: STRAIN, severity: MINOR, mechanism: "swing", evaluated_at: "2026-07-31T11:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${aP}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { nP: "$.data[0].id", chP: "$.data[0].channel" } }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${aQ}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { chQ: "$.data[0].channel" } }
          trigger:
            - { call: "POST /guardian-notifications/${nP}/send", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s1: $.data.status, at1: $.data.attempts } }
            - { call: "POST /guardian-notifications/${nP}/retry", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s2: $.data.status } }
            - { call: "POST /guardian-notifications/${nP}/send", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s3: $.data.status, at3: $.data.attempts } }
          assert:
            - "chP == PHONE (no email on file) and chQ == EMAIL"
            - "s1 == FAILED and at1 == 1 (carrier failure on UNREACHABLE)"
            - "s2 == QUEUED (retry cycle edge)"
            - "s3 == FAILED and at3 == 2"

      - name: restock_invalid_transitions_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RestockOrder.DRAFT_to_SUBMITTED
          - state_machines.RestockOrder.SUBMITTED_to_APPROVED
          - state_machines.RestockOrder.APPROVED_to_RECEIVED
        distinguishing_aspect: "Approve from DRAFT, receive from SUBMITTED, and receive from CANCELLED are all rejected — out-of-order and terminal-state enforcement on the procurement machine."
        test_recipe:
          setup: ["Budget FY2026 (100000); item; order O in DRAFT"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 100000 }, as: SystemAdmin }
            - { call: "POST /supply-items", payload: { item_name: "Splints", category: FIRST_AID, unit: EACH, par_level: 20, reorder_threshold: 5, unit_cost_cents: 500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 4, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord: $.data.id, ord_s0: $.data.status } }
          trigger:
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { err1: $.data.error_id } }
            - { call: "POST /restock-orders/${ord}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /restock-orders/${ord}/receive", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err2: $.data.error_id } }
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { ord_s1: $.data.status } }
            - { call: "POST /restock-orders/${ord}/cancel", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord_s2: $.data.status } }
            - { call: "POST /restock-orders/${ord}/receive", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err3: $.data.error_id } }
          assert:
            - "ord_s0 == DRAFT"
            - "err1 == ERR_INVALID_STATE (approve requires SUBMITTED)"
            - "err2 == ERR_INVALID_STATE (receive requires APPROVED)"
            - "ord_s1 == APPROVED and ord_s2 == CANCELLED"
            - "err3 == ERR_INVALID_STATE (CANCELLED is terminal)"

      - name: coverage_ownership_and_decline_state_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CoverageAssignment.ASSIGNED_to_ACKNOWLEDGED
          - state_machines.CoverageAssignment.ASSIGNED_to_DECLINED
          - errors[ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "Acknowledge by a different trainer than the assignee fails ownership (403), and decline from ACKNOWLEDGED fails state (409) — the assignment machine separates who may act from when they may act."
        test_recipe:
          setup: ["Trainers T1, T2; director AD; venue; SOCCER PRACTICE event; assignment ca for T1 (ASSIGNED)"]
          setup_api_calls:
