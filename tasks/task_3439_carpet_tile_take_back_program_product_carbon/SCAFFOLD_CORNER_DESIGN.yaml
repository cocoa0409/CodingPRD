            - "PCFReport.${rep1}.status remains DRAFT"

  # ===========================================================================
  - section: validations
    instances:

      - name: claim_boundary_mismatch_at_create_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_BOUNDARY_MISMATCH]
        distinguishing_aspect: "A claim whose boundary (CRADLE_TO_GRAVE) differs from its report's boundary (CRADLE_TO_GATE) is rejected at creation with ERR_BOUNDARY_MISMATCH — the claim never reaches DRAFT."
        test_recipe:
          setup: ["Collection GAT; report REP-1 created DRAFT with boundary CRADLE_TO_GATE."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_rep_gate
          trigger:
            - call: "POST /carpetloop/carbon-claims"
              payload: { collection_id: "${col_id}", report_id: "${rep1}", claim_type: "CARBON_NEUTRAL", claimed_volume_m2: 10, boundary: "CRADLE_TO_GRAVE" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BOUNDARY_MISMATCH (422); no claim persisted"
            - "a following GET /carpetloop/carbon-claims?collection_id=${col_id} returns an empty list"

      - name: negative_claim_boundary_and_target_rules
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_NEGATIVE_REQUIRES_CRADLE_TO_GRAVE]
          - errors[ERR_TARGET_REQUIRED_FOR_NEGATIVE]
        distinguishing_aspect: "The two carbon-negative disclosure gates are isolated: a negative claim on a CRADLE_TO_GATE boundary (matching its report) fails ERR_NEGATIVE_REQUIRES_CRADLE_TO_GRAVE, and a negative claim on a proper CRADLE_TO_GRAVE boundary without manufacturing_target_id fails ERR_TARGET_REQUIRED_FOR_NEGATIVE."
        test_recipe:
          setup: ["Collection GAT; report RG-1 DRAFT CRADLE_TO_GATE; collection GRV; report RG-2 DRAFT CRADLE_TO_GRAVE."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_rep_gate
            - &c_col_grave_none
              call: "POST /carpetloop/collections"
              payload: { name: "Gravia", pattern_code: "GRV", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GRAVE", claim_intent: "NONE" }
              as: PlatformAdmin
              captures: { colG: $.data.id, colG_v: $.data.version }
            - &c_rep_grave
              call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${colG}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", boundary: "CRADLE_TO_GRAVE", expected_collection_version: "${colG_v}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { repG: $.data.id }
          trigger:
            - call: "POST /carpetloop/carbon-claims"
              payload: { collection_id: "${col_id}", report_id: "${rep1}", claim_type: "CARBON_NEGATIVE", claimed_volume_m2: 10, boundary: "CRADLE_TO_GATE" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/carbon-claims"
              payload: { collection_id: "${colG}", report_id: "${repG}", claim_type: "CARBON_NEGATIVE", claimed_volume_m2: 10, boundary: "CRADLE_TO_GRAVE" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_NEGATIVE_REQUIRES_CRADLE_TO_GRAVE (boundary matched the report but negative claims demand CRADLE_TO_GRAVE)"
            - "err2 == ERR_TARGET_REQUIRED_FOR_NEGATIVE (boundary legal; the emissions-target tie is missing)"

      - name: package_create_with_unpublished_claim_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_CLAIM_NOT_PUBLISHED]
          - endpoints."POST /carpetloop/spec-packages"
        distinguishing_aspect: "A package referencing a PUBLISHED report but a still-DRAFT claim fails with ERR_CLAIM_NOT_PUBLISHED — the claim gate is reachable only because the report gate already passed."
        test_recipe:
          setup: ["Collection GAT with REP-1 published (full chain); claim CL-1 created and left DRAFT."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
            - *c_clear1
            - *c_publish1
            - *c_claim_neutral
            - *c_get_col
          trigger:
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-A", collection_id: "${col_id}", report_id: "${rep1}", claim_id: "${cl1}", expected_collection_version: "${col_v2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_NOT_PUBLISHED (422); no package persisted"

      - name: package_create_with_unpublished_report_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_REPORT_NOT_PUBLISHED]
        distinguishing_aspect: "Symmetric gate on the report side of package issuance: a VERIFIED-but-unpublished report fails ERR_REPORT_NOT_PUBLISHED — publication, not verification, is the documentation threshold."
        test_recipe:
          setup: ["Collection GAT with REP-1 verified (CLEAR) but never published."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
            - *c_clear1
            - *c_get_col
          trigger:
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-A", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPORT_NOT_PUBLISHED (422) while REP-1 is VERIFIED"
            - "no SpecPackage is created for the pair"

      - name: allocate_requires_qc_passed_lot
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_LOT_NOT_QC_PASSED]
        distinguishing_aspect: "Allocating from a lot still RECEIVED (QC never run) fails ERR_LOT_NOT_QC_PASSED; the same call succeeds after a PASS decision."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 QUARANTINE; lot L of 400 kg @0.50 still RECEIVED."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_batch_b1
          trigger:
            - call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
            - *c_qc_lot1
            - call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          assert:
            - "first allocate: err == ERR_LOT_NOT_QC_PASSED (422)"
            - "after QC PASS the identical allocate succeeds: lot available_kg == 300, allocated_kg == 100"

      - name: allocate_over_available_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=12]
          - errors[ERR_INSUFFICIENT_LOT_KG]
        distinguishing_aspect: "Capacity guard at the kilogram level: allocating available + 0.5 kg fails ERR_INSUFFICIENT_LOT_KG while the lot is untouched."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 QUARANTINE; lot L 200 kg QC_PASSED (200 available)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_qc_lot1
            - *c_batch_b1
          trigger:
            - call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 200.5 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_LOT_KG (422)"
            - "FeedstockLot.${lot1}.available_kg == 200 and allocated_kg == 0 (no partial debit)"

      - name: mix_mass_mismatch_blocks_release_until_exact
        claim_type: Violation -> Error
        grounds:
          - validations[priority=11]
          - errors[ERR_MIX_MASS_MISMATCH]
          - calculations.batch_embodied_carbon
        distinguishing_aspect: "The release gate is an exact 2dp equality against produced_m2 x 4.0: 300 kg allocated against a 100 m2 batch fails ERR_MIX_MASS_MISMATCH; topping up to exactly 400 kg releases."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 (100 m2); lot L 400 kg @0.50 QC_PASSED with 300 kg allocated."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 400, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { lot1: $.data.id }
            - *c_qc_lot1
            - *c_batch_b1
            - call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 300 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          trigger:
            - call: "POST /carpetloop/batches/${b1}/release"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - *c_rel_b1
          assert:
            - "first release: err == ERR_MIX_MASS_MISMATCH (422); batch stays QUARANTINE"
            - "after allocating the missing 100 kg: release succeeds, status RELEASED"
            - "recycled_content_pct == 100.00 and embodied_carbon_kg_per_m2 == 3.200 ((400 x 0.50)/100 = 2.0000 + 1.2 intensity)"

      - name: dye_lot_conflict_scoped_per_collection
        claim_type: Violation -> Error
        grounds:
          - validations[priority=11]
          - errors[ERR_DYE_LOT_CONFLICT]
          - entities.TileBatch.fields.dye_lot_code
        distinguishing_aspect: "Dye-lot uniqueness is scoped to the collection: reusing DL-100 inside collection GAT fails ERR_DYE_LOT_CONFLICT, while the same code under collection GRV is accepted."
        test_recipe:
          setup: ["Collections GAT and GRV; batch DL-100 exists under GAT."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_col_grave_none
            - *c_batch_b1
          trigger:
            - call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-100", production_date: "2026-09-06T00:00:00Z", produced_m2: 10, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /carpetloop/collections/${colG}/batches"
              payload: { dye_lot_code: "DL-100", production_date: "2026-09-06T00:00:00Z", produced_m2: 10, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.1 }
              as: PlatformAdmin
              captures: { bG: $.data.id }
          assert:
