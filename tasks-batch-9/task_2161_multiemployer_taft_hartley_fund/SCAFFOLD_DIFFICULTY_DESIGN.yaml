            - "after the second demand, WithdrawalAssessment.${wl_id}.status == DEMANDED and demanded_on == '2026-04-01'"
            - "GET /withdrawal-assessments/${wl_id}/installments returns exactly 5 rows"
            - "Fund.${fund_id}.allocated_uvb_cents == 25000000 and unallocated_uvb_cents == 75000000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_period_closed_interval_intersection_on_employer
        grounds:
          - validations[priority=54]
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
          - entities.PayrollAudit.fields.period_start_month
          - entities.PayrollAudit.fields.period_end_month
          - entities.PayrollAudit.fields.employer_id
        distinguishing_aspect: |
          The resource is an Employer's audit calendar and the interval semantics are CLOSED
          month ranges compared by intersection with adjacency explicitly permitted: 2026-07..
          2026-12 is accepted immediately after 2026-01..2026-06 because the ranges abut, while
          2026-06..2026-09 is refused because it shares the single month 2026-06.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-01T00:00:00Z."
            - "One employer already under an IN_FIELDWORK audit covering the closed interval 2026-01 to 2026-06."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Audit Interval Fund", ein: "36-2300001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-audits"
              payload: { employer_id: "${emp_id}", period_start_month: "2026-01", period_end_month: "2026-06" }
              as: PayrollAuditor
              as_user_id: "auditor-001"
              captures: { aud_first_id: $.data.id }
          trigger:
            - call: "POST /payroll-audits"
              payload: { employer_id: "${emp_id}", period_start_month: "2026-07", period_end_month: "2026-12" }
              as: PayrollAuditor
              as_user_id: "auditor-002"
              captures: { aud_adjacent_id: $.data.id }
            - call: "POST /payroll-audits"
              payload: { employer_id: "${emp_id}", period_start_month: "2026-06", period_end_month: "2026-09" }
              as: PayrollAuditor
              as_user_id: "auditor-002"
              captures: { overlap_err: $.data.error_id }
          assert:
            - "the adjacent 2026-07..2026-12 audit is created with HTTP 201 and status IN_FIELDWORK"
            - "PayrollAudit.${aud_adjacent_id}.round_count == 1 and auditor_user_id == 'auditor-002'"
            - "${overlap_err} == 'ERR_AUDIT_PERIOD_OVERLAP' with HTTP 409"
            - "GET /payroll-audits?employer_id=${emp_id} returns exactly 2 rows, ${aud_first_id} and ${aud_adjacent_id}"

      - name: reciprocity_accept_rejected_by_coverage_horizon
        grounds:
          - validations[priority=54]
          - errors[ERR_COVERAGE_HORIZON_EXCEEDED]
          - state_machines.ReciprocityTransfer.PENDING_to_ACCEPTED
          - entities.Fund.fields.max_advance_coverage_months
          - calculations.participant_eligibility_replay
        distinguishing_aspect: |
          A different resource entity (Participant, not Employer) under different interval
          semantics: aggregate capacity over a rolling forward window rather than pairwise
          interval intersection. With 11 coverage months already outstanding beyond the 2026-05
