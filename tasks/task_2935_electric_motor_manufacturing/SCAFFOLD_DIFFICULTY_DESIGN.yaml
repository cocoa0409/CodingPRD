      - name: test_cell_aggregate_draw_over_half_open_windows_at_exact_capacity
        grounds:
          - calculations.test_cell_capacity_ledger
          - errors[ERR_TEST_CELL_CAPACITY_EXCEEDED]
          - endpoints[POST /performance-tests]
          - entities.TestCell.fields.peak_reserved_kw
          - state_machines.PerformanceTest.SCHEDULED_to_SUPERSEDED
        distinguishing_aspect: |
          A different overlap topology: instead of a pairwise buffered exclusion, the cell admits
          any number of concurrent tests as long as the SUM of their dyno draws over every instant
          stays at or below max_concurrent_kw. 12.0 kW is already reserved for 09:00-11:00Z, so a
          10:00-12:00Z request at 8.5 kW is refused at 20.5 while the same window at 8.0 kW is
          admitted at exactly 20.0. Re-scheduling the second work order to 11:00-13:00Z then
          exercises two subtleties at once: the earlier test is SUPERSEDED and releases its draw,
          and the new window shares the instant 11:00Z with the first test yet does not overlap it,
          because the intervals are half-open.
