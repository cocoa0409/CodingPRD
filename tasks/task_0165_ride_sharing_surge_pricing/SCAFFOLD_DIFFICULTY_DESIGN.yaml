scaffold_difficulty_design:

  # ============================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ride_quoted_vs_final_fare_divergence
        grounds:
          - calculations.quoted_fare_calculation
          - calculations.final_fare_calculation
          - entities.Ride.fields.quoted_fare_cents
          - entities.Ride.fields.final_fare_cents
          - entities.Ride.fields.pickup_multiplier_snapshot
          - state_machines.Ride.REQUESTED_to_ASSIGNED
          - state_machines.Ride.ON_TRIP_to_COMPLETED
        distinguishing_aspect: |
          Same Ride; quoted_fare_calculation is forward_looking on the Ride entity (uses
          GeoGrid.current_multiplier snapshotted at REQUESTED instant), while
          final_fare_calculation is chronological on the same Ride (re-reads
          GeoGrid.current_multiplier at COMPLETED instant) — producing different cents
          for identical Ride.base_fare_cents when surge changes mid-trip.
        test_recipe:
          setup:
            - "POST /grids creates G-001 (non-airport, rush_hour_eligible=false)."
            - "POST /drivers creates two drivers D1, D2; both go-online at G-001 → active_driver_count=2, current_multiplier=1.00."
            - "POST /riders creates R1."
            - "POST /rides (rider=R1, pickup=G-001, dropoff=G-001, distance_km=5.0) is REQUESTED while 1 demand vs 2 supply: ratio=0.5, multiplier still 1.00 → quoted_fare_cents=round_half_up(850*1.00)=850."
            - "POST /drivers/D2/go-offline so active_driver_count=1; multiplier still 1.00 (post-assignment active=0)."
          trigger:
            - "POST /rides/{ride_id}/assign assigns D1; ride.driver_id=D1; GeoGrid.active_driver_count→0; GeoGrid.open_demand_count→0; surge stays 1.00 (no demand)."
            - "POST /drivers (Dx) create+go-online at G-001 with 5 new requested rides (to make active=1, demand=5; ratio=5 > 4 → raw=3.00, capped at MULTIPLIER_CAP=3.00)."
            - "POST /rides/{ride_id}/start, then POST /rides/{ride_id}/complete."
          assert:
            - "Ride.base_fare_cents == 850."
            - "Ride.quoted_fare_cents == 850."
            - "Ride.pickup_multiplier_snapshot == 1.00."
            - "Ride.final_fare_cents == round_half_up(850 * 3.00) == 2550."
            - "Ride.final_fare_cents != Ride.quoted_fare_cents (the two algorithms diverge)."
            - "Ride.driver_earnings_cents == round_half_up(2550 * 0.80) == 2040."

      - name: driver_total_earnings_vs_quest_bonus_aggregation
        grounds:
          - calculations.quest_bonus_payout
          - calculations.final_fare_calculation
          - entities.Driver.fields.total_earnings_cents
          - entities.Driver.fields.quest_completed_rides
          - entities.QuestBonus.fields.bonus_amount_cents
          - state_machines.QuestBonus.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Driver.total_earnings_cents has two valid sources on the same Driver entity vs the
          QuestBonus entity: per-ride accrual (chronological, on each COMPLETED Ride) and
          quest-bonus aggregation payout (forward-looking sum at QuestBonus CLOSED). These
          live on different entity domains (Driver per-trip earnings vs Quest period bonus),
          and pinning whether a Ride.completed_at exactly equal to QuestBonus.window_end
          counts produces different totals.
        test_recipe:
          setup:
            - "POST /quest-bonuses creates Q1 with target_ride_count=2, bonus_amount_cents=5000, window_start=T0, window_end=T0+3600s."
            - "POST /drivers creates D1; PATCH /drivers/D1/quest enrolls in Q1."
            - "POST /_clock/advance to T0 → Q1.status=ACTIVE."
            - "Driver D1 completes 2 rides each earning 500 cents driver share (total_earnings_cents accumulates to 1000)."
          trigger:
            - "POST /_clock/advance to T0+3600s → Q1.status=CLOSED, quest_bonus_payout runs."
          assert:
            - "Q1.status == CLOSED."
            - "D1.quest_completed_rides == 2."
            - "D1.total_earnings_cents == 1000 + 5000 == 6000  # per-ride accrual + bonus payout differ in source domain."
            - "A second POST /_clock/advance past T0+3600s does NOT re-pay the bonus (idempotent payout flag)."

  # ============================================================
  # Rule 2: Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: surge_tiered_threshold_with_airport_then_cap
        grounds:
          - calculations.surge_multiplier
          - entities.GeoGrid.fields.current_multiplier
          - entities.GeoGrid.fields.is_airport
          - entities.GeoGrid.fields.active_driver_count
          - entities.GeoGrid.fields.open_demand_count
        distinguishing_aspect: |
          Mode (a): a single formula with >=3 inputs (active_driver_count, open_demand_count,
          is_airport) and non-linear interaction — tiered selection on ratio AND a conditional
          additive AIRPORT_SURCHARGE branch AND a min() cap at MULTIPLIER_CAP. The scaffold
          pins the order: tier-pick FIRST, additive surcharge SECOND, cap THIRD.
        test_recipe:
          setup:
            - "POST /grids creates AIRPORT (is_airport=true)."
            - "POST /drivers creates D1; D1 goes-online at AIRPORT → active_driver_count=1, open_demand_count=0 → raw=1.00, +0.50 (airport) = 1.50."
            - "POST /riders creates R1..R5."
            - "5 riders each POST /rides (pickup=AIRPORT, distance_km=1.0) → open_demand_count=5, active_driver_count=1 → ratio=5.0 > 4.0 → raw=MULTIPLIER_CAP=3.00; +0.50 airport surcharge attempted; cap=3.00 → 3.00."
          trigger:
            - "GET /grids/{AIRPORT_id} read current_multiplier."
          assert:
            - "GeoGrid(AIRPORT).current_multiplier == 3.00  # cap precedence over airport additive."
            - "GeoGrid(AIRPORT).active_driver_count == 1."
            - "GeoGrid(AIRPORT).open_demand_count == 5."

      - name: final_fare_two_step_rounding_order
        grounds:
          - calculations.final_fare_calculation
          - calculations.final_fare_calculation.constants.PLATFORM_FEE_RATE
          - entities.Ride.fields.final_fare_cents
          - entities.Ride.fields.driver_earnings_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins: (1) round
          base_fare*eff_mult to cents FIRST, (2) round fare*0.80 to cents SECOND. Reversing
          (computing driver earnings as base*eff*0.80 in one round) produces a 1-cent drift
          on inputs like base=833, eff=1.50 (833*1.50=1249.5 → 1250 → *0.80=1000; vs
          833*1.50*0.80=999.6 → 1000). Pin a case where order matters: base=831, eff=1.50.
        test_recipe:
          setup:
            - "POST /grids creates G-002; D1 online; ratio=0 → multiplier=1.00."
            - "POST /rides distance_km=4.842 → base_fare_cents = 250 + round_half_up(4.842*120) = 250 + round_half_up(581.04) = 250 + 581 = 831."
            - "Manipulate grid state so that at COMPLETED, multiplier==1.50: add 4 dummy REQUESTED rides + offline drivers to push ratio."
          trigger:
            - "POST /rides/{id}/assign, /start, /complete."
          assert:
            - "Ride.base_fare_cents == 831."
            - "Ride.final_fare_cents == round_half_up(831 * 1.50) == 1247  # (1246.5 → 1247 via round_half_up)."
            - "Ride.driver_earnings_cents == round_half_up(1247 * 0.80) == 998  # (997.6 → 998)."
            - "If implementation reversed the order (one-shot 831*1.50*0.80 = 997.2 → 997), assertion 998 catches it."

      - name: quoted_fare_with_rush_hour_and_surge_then_cap
        grounds:
          - calculations.quoted_fare_calculation
          - entities.Ride.fields.pickup_multiplier_snapshot
          - entities.Ride.fields.rush_hour_bonus_snapshot
          - entities.RushHourWindow.fields.additive_bonus
          - calculations.quoted_fare_calculation.constants.MULTIPLIER_CAP
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — quoted_fare depends on pickup_multiplier_snapshot
          (set at REQUESTED instant) AND rush_hour_bonus_snapshot (queried by minute_of_day at
          REQUESTED instant). The combined effective multiplier is then capped: eff_mult =
          min(pickup_multiplier_snapshot + rush_hour_bonus_snapshot, MULTIPLIER_CAP). The
          scaffold pins evaluation order: snapshot multiplier FIRST, add rush bonus SECOND,
          cap THIRD; then quoted_fare_cents = round_half_up(base * eff_mult).
        test_recipe:
          setup:
            - "POST /grids creates G-003 (rush_hour_eligible=true). D1 online; ratio=0; multiplier=1.00."
            - "POST /rush-hour-windows day_of_week=current, start=0, end=1440, additive_bonus=1.00."
            - "POST /_clock/advance to a minute inside the window."
            - "Force ratio so multiplier=2.50 (5 REQUESTED, 2 AVAILABLE)."
          trigger:
            - "POST /rides distance=5.0 → base=850."
          assert:
            - "Ride.pickup_multiplier_snapshot == 2.50."
            - "Ride.rush_hour_bonus_snapshot == 1.00."
            - "Effective multiplier capped: min(2.50+1.00, 3.00) == 3.00."
            - "Ride.quoted_fare_cents == round_half_up(850 * 3.00) == 2550."

  # ============================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ride_dispute_revert_cycle
        grounds:
          - state_machines.Ride.COMPLETED_to_DISPUTED
          - state_machines.Ride.DISPUTED_to_REFUNDED
          - state_machines.Ride.DISPUTED_to_COMPLETED
        distinguishing_aspect: |
          Ride entity exhibits branching with a revert: COMPLETED→DISPUTED→{REFUNDED | COMPLETED-revert}.
          The reject path returns to COMPLETED (cycle: COMPLETED→DISPUTED→COMPLETED), not a
          strict linear pipeline.
        test_recipe:
          setup:
            - "Create a fully COMPLETED Ride r1."
            - "POST /disputes (rider) → r1.status=DISPUTED."
          trigger:
            - "POST /disputes/{id}/reject."
          assert:
            - "r1.status == COMPLETED  # reverted from DISPUTED."
            - "Dispute.status == REJECTED."
            - "Rider.wallet_balance_cents unchanged (zero refund applied)."

      - name: driver_branching_airport_queue_dimension
        grounds:
          - state_machines.Driver.AVAILABLE_to_IN_AIRPORT_QUEUE
          - state_machines.Driver.IN_AIRPORT_QUEUE_to_AVAILABLE
          - state_machines.Driver.IN_AIRPORT_QUEUE_to_EN_ROUTE_PICKUP
          - state_machines.Driver.AVAILABLE_to_EN_ROUTE_PICKUP
        distinguishing_aspect: |
          Driver entity has a branching fork-join: from AVAILABLE the driver may go directly
          to EN_ROUTE_PICKUP (regular dispatch) OR detour through IN_AIRPORT_QUEUE before
          EN_ROUTE_PICKUP. The two branches have different side-effect sets — entering
          IN_AIRPORT_QUEUE decrements active_driver_count separately from a regular
          dispatch — so it is true branching with divergent side effects.
        test_recipe:
          setup:
            - "Create AIRPORT grid (is_airport=true); create G-002 (non-airport)."
            - "Create D1, D2. D1 goes-online at AIRPORT; D2 goes-online at G-002."
          trigger:
            - "POST /airport-queue/join (D1) → D1.status=IN_AIRPORT_QUEUE; AIRPORT.active_driver_count goes 1→0."
            - "Compare with: D2 stays AVAILABLE in G-002; G-002.active_driver_count stays 1."
          assert:
            - "D1.status == IN_AIRPORT_QUEUE."
            - "AirportQueue row exists for D1 with position=1."
            - "GeoGrid(AIRPORT).active_driver_count == 0  # queued driver removed from supply."
            - "GeoGrid(G-002).active_driver_count == 1."

  # ============================================================
  # Rule 4: Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: assign_cascade_three_hops
        grounds:
          - state_machines.Ride.REQUESTED_to_ASSIGNED
          - state_machines.Driver.AVAILABLE_to_EN_ROUTE_PICKUP
          - entities.GeoGrid.fields.active_driver_count
          - entities.GeoGrid.fields.open_demand_count
          - entities.GeoGrid.fields.current_multiplier
          - calculations.surge_multiplier
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (POST /rides/{id}/assign):
          (1) Ride.status REQUESTED→ASSIGNED mutates Ride;
          (2) THAT mutation triggers Driver.status AVAILABLE→EN_ROUTE_PICKUP (caused by hop 1, not by the original API call directly affecting Driver);
          (3) THAT Driver status change caused by hop 2 triggers GeoGrid.active_driver_count decrement and surge_multiplier recompute on the pickup grid.
          Each link is caused by the previous link, not by the API call directly.
        test_recipe:
          setup:
            - "Grid G-004; 1 driver D1 (AVAILABLE); 1 Rider R1; one REQUESTED Ride r1 in G-004 (open_demand=1, active_driver=1, multiplier=1.00 since ratio=1.0)."
          trigger:
            - "POST /rides/{r1}/assign."
          assert:
            - "Ride.r1.status == ASSIGNED  # hop 1."
            - "Driver.D1.status == EN_ROUTE_PICKUP  # hop 2, caused by hop 1's Ride.driver_id write."
            - "GeoGrid(G-004).active_driver_count == 0  # hop 3a, caused by hop 2's Driver status change."
            - "GeoGrid(G-004).open_demand_count == 0  # hop 3b, caused by hop 1's Ride status."
            - "GeoGrid(G-004).current_multiplier == 1.00  # hop 3c, surge recomputed from new counts (0 demand, 0 supply → 1.00)."

      - name: refund_cascade_two_hops
        grounds:
          - state_machines.Dispute.OPEN_to_APPROVED
          - state_machines.Ride.DISPUTED_to_REFUNDED
          - entities.Rider.fields.wallet_balance_cents
          - entities.Driver.fields.total_earnings_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /disputes/{id}/approve):
          (1) Dispute.status OPEN→APPROVED;
          (2) THAT mutation triggers Ride.status DISPUTED→REFUNDED + Rider.wallet_balance_cents increment + Driver.total_earnings_cents clawback;
          Each hop 2 effect is caused by hop 1's status change, not by approve directly mutating those fields.
        test_recipe:
          setup:
            - "Existing DISPUTED Ride r1 with final_fare_cents=1000, driver_earnings_cents=800, dispute d1 OPEN with requested_refund_cents=300."
            - "Rider.wallet_balance_cents=0; Driver.total_earnings_cents=800."
          trigger:
            - "POST /disputes/{d1}/approve."
          assert:
            - "Dispute.d1.status == APPROVED  # hop 1."
            - "Ride.r1.status == REFUNDED  # hop 2a, caused by hop 1."
            - "Rider.wallet_balance_cents == 300  # hop 2b."
            - "Driver.total_earnings_cents == 800 - round_half_up(300 * 0.80) == 800 - 240 == 560  # hop 2c."

  # ============================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_dispute_create
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE
          - errors.ERR_REFUND_EXCEEDS_FARE
        distinguishing_aspect: |
          On POST /disputes, a Ride.status != COMPLETED AND requested_refund_cents > final_fare_cents
          both fail simultaneously. Per priority order, ERR_INVALID_STATE (priority=7, state category)
          wins over ERR_REFUND_EXCEEDS_FARE (priority=13, business_fiscal category). Tests
          the state vs business_fiscal pair.
        test_recipe:
          setup:
            - "Create a Ride r1 still in ASSIGNED state (not COMPLETED) with quoted_fare_cents=500. final_fare_cents=null."
          trigger:
            - "POST /disputes with ride_id=r1, requested_refund_cents=9999 (would exceed any fare)."
          assert:
            - "HTTP status 409  # state error trumps fiscal."
            - "error_id == 'ERR_INVALID_STATE'  # priority 7 over 13."

      - name: business_referential_vs_business_constraint_airport_join
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors.ERR_NOT_AIRPORT_GRID
          - errors.ERR_DRIVER_NOT_IN_GRID
        distinguishing_aspect: |
          On POST /airport-queue/join, a non-airport grid AND driver-in-wrong-grid both fail
          simultaneously. Priority 9 (ERR_NOT_AIRPORT_GRID, business_constraint on grid
          property) wins over priority 10 (ERR_DRIVER_NOT_IN_GRID, business_constraint on
          driver location). This is a different category pair than instance 1.
        test_recipe:
          setup:
            - "Create G-005 (is_airport=false). Create driver D1; D1 goes-online at G-006 (different grid)."
          trigger:
            - "POST /airport-queue/join with grid_code=G-005."
          assert:
            - "HTTP status 422."
            - "error_id == 'ERR_NOT_AIRPORT_GRID'  # priority 9 wins; we never reach the driver-grid check."

  # ============================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: surge_ratio_exact_threshold_2_0
        grounds:
          - calculations.surge_multiplier
          - entities.GeoGrid.fields.current_multiplier
          - endpoints.POST_/rides
        distinguishing_aspect: |
          Numeric threshold: surge formula uses `ratio <= 2.0 → 1.50` vs `ratio <= 3.0 → 2.00`.
          At ratio == exactly 2.0 (demand=2, supply=1), the result must be 1.50 not 2.00.
          The boundary metric is the ratio scalar; reachable through POST /rides (creates
          demand).
        test_recipe:
          setup:
            - "Grid G-007; D1 online (supply=1)."
            - "POST /rides x2 (demand=2)."
          trigger:
            - "GET /grids/{G-007} read current_multiplier."
          assert:
            - "ratio == 2.0; current_multiplier == 1.50  # NOT 2.00 (uses '<=' not '<')."

      - name: rush_hour_minute_half_open_boundary
        grounds:
          - validations[priority=11]
          - calculations.quoted_fare_calculation
          - entities.RushHourWindow.fields.start_minute
          - entities.RushHourWindow.fields.end_minute
          - endpoints.POST_/rush-hour-windows
        distinguishing_aspect: |
          Empty/exclusive-boundary metric (different from the numeric ratio threshold above):
          RushHourWindow uses [start_minute, end_minute) half-open. A new window starting
          exactly at the prior window's end_minute is ALLOWED (no overlap error). Reachable
          through POST /rush-hour-windows (different endpoint from instance 1).
        test_recipe:
          setup:
            - "POST /rush-hour-windows day=MON, start_minute=480, end_minute=540 (08:00-09:00)."
          trigger:
            - "POST /rush-hour-windows day=MON, start_minute=540, end_minute=600 (09:00-10:00)."
          assert:
            - "HTTP status 201  # accepted — adjacency at 540 is allowed in half-open semantics."
            - "No ERR_RUSH_HOUR_OVERLAP error."

  # ============================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ride_assign_requires_driver_available_pair
        grounds:
          - state_machines.Ride.REQUESTED_to_ASSIGNED
          - state_machines.Driver
          - calculations.driver_selection
        distinguishing_aspect: |
          Ride.REQUESTED→ASSIGNED requires the candidate Driver entity to be in
          status ∈ {AVAILABLE, IN_AIRPORT_QUEUE-head}. If no Driver in those states
          exists in the pickup grid, the transition fails with ERR_NO_DRIVERS_AVAILABLE.
          Entity pair: Ride ↔ Driver.
        test_recipe:
          setup:
            - "Grid G-008. Driver D1 created but never goes-online (status=OFFLINE)."
            - "POST /rides creates r1 in G-008."
          trigger:
            - "POST /rides/{r1}/assign (no allow_neighbor_grid)."
          assert:
            - "HTTP status 409."
            - "error_id == 'ERR_NO_DRIVERS_AVAILABLE'  # Ride transition blocked by Driver.status."

      - name: dispute_create_requires_ride_completed_pair
        grounds:
          - state_machines.Ride.COMPLETED_to_DISPUTED
          - validations[priority=7]
          - validations[priority=8]
          - entities.Dispute.fields.ride_id
          - entities.Ride.fields.status
        distinguishing_aspect: |
          Dispute creation (OPEN initial state) requires Ride.status == COMPLETED. Entity
          pair: Dispute ↔ Ride (different pair than instance 1's Ride ↔ Driver). A
          Ride still in ON_TRIP cannot have a Dispute created.
        test_recipe:
          setup:
            - "Create r2 in ON_TRIP state."
          trigger:
            - "POST /disputes ride_id=r2 reason_code=OVERCHARGE requested_refund_cents=100."
          assert:
            - "HTTP status 409."
            - "error_id == 'ERR_INVALID_STATE'."
            - "No Dispute created  # Dispute creation blocked by Ride.status."

  # ============================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rush_hour_half_open_overlap
        grounds:
          - validations[priority=11]
          - errors.ERR_RUSH_HOUR_OVERLAP
          - entities.RushHourWindow
          - endpoints.POST_/rush-hour-windows
        distinguishing_aspect: |
          RushHourWindow uses [start_minute, end_minute) half-open per day_of_week. Two
          windows overlap iff the half-open intervals intersect on the same day. Resource
          entity = RushHourWindow.
        test_recipe:
          setup:
            - "POST /rush-hour-windows day=TUE, start_minute=480, end_minute=540."
          trigger:
            - "POST /rush-hour-windows day=TUE, start_minute=539, end_minute=600 (1-minute interior overlap)."
          assert:
            - "HTTP status 422."
            - "error_id == 'ERR_RUSH_HOUR_OVERLAP'."

      - name: quest_bonus_closed_overlap_with_buffer
        grounds:
          - validations[priority=12]
          - errors.ERR_QUEST_WINDOW_OVERLAP
          - entities.QuestBonus.fields.window_start
          - entities.QuestBonus.fields.window_end
          - endpoints.POST_/quest-bonuses
        distinguishing_aspect: |
          QuestBonus enrollment uses CLOSED-closed semantics on [window_start, window_end] for
          Driver enrollment overlap — adjacency at boundary instants IS overlap (in
          contrast to RushHourWindow's half-open). Resource entity = QuestBonus, with
          adjacency treated differently — this is a distinct interval semantic from
          instance 1.
        test_recipe:
          setup:
            - "POST /quest-bonuses Q1 window=[T0, T0+3600s], target=2, bonus=5000."
            - "POST /quest-bonuses Q2 window=[T0+3600s, T0+7200s] (Q2 starts exactly when Q1 ends)."
            - "POST /drivers D1; PATCH /drivers/D1/quest enrolls in Q1."
          trigger:
            - "PATCH /drivers/D1/quest enroll in Q2 (Q2.window_start == Q1.window_end exactly)."
          assert:
            - "HTTP status 422."
            - "error_id == 'ERR_QUEST_WINDOW_OVERLAP'  # closed-closed: boundary instant counts as overlap (different semantics from RushHourWindow)."

  # ============================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_money_conservation_invariant
        grounds:
          - state_machines.Ride.DISPUTED_to_REFUNDED
          - entities.Rider.fields.wallet_balance_cents
          - entities.Driver.fields.total_earnings_cents
          - entities.Ride.fields.final_fare_cents
          - calculations.final_fare_calculation
        distinguishing_aspect: |
          Conserved quantity #1 — system money flow. The named invariant: after refund,
          (Rider.wallet_balance_cents increase) + (Driver.total_earnings_cents decrease) +
          (implicit platform fee retention adjustment = approved_refund_cents * PLATFORM_FEE_RATE)
          MUST equal approved_refund_cents exactly. Pinned formula:
          delta_wallet + delta_driver + delta_platform_fee == approved_refund_cents.
        test_recipe:
          setup:
            - "Existing COMPLETED Ride r1 with final_fare_cents=1000, driver_earnings_cents=800. Rider.wallet=0, Driver.total_earnings=800."
            - "POST /disputes ride_id=r1 requested_refund_cents=500 → r1.status=DISPUTED."
          trigger:
            - "POST /disputes/{d1}/approve approved_refund_cents=500."
          assert:
            - "Rider.wallet_balance_cents == 500  # delta_wallet = +500."
            - "Driver.total_earnings_cents == 800 - round_half_up(500 * 0.80) == 800 - 400 == 400  # delta_driver = -400."
            - "delta_wallet + (-delta_driver) + (500 * 0.20)  == 500 + 400 + 100 == 1000  # NOT the invariant; the actual invariant is delta_wallet == approved_refund_cents AND |delta_driver| == round_half_up(500*0.80) (no drift in either ledger)."
            - "(500) + (400) + (100 implicit platform-fee clawback) == 1000  ## allocation matches Ride.final_fare_cents — no money created or destroyed."

      - name: airport_queue_position_count_conservation
        grounds:
          - state_machines.Driver.AVAILABLE_to_IN_AIRPORT_QUEUE
          - state_machines.Driver.IN_AIRPORT_QUEUE_to_AVAILABLE
          - entities.AirportQueue.fields.position
          - entities.GeoGrid.fields.active_driver_count
        distinguishing_aspect: |
          Conserved quantity #2 — physical headcount. Different conserved type (people, not
          money). The invariant: at any instant, (count of AirportQueue rows for grid g) +
          (count of Drivers with status=AVAILABLE and current_grid_code=g) +
          (count of Drivers with status=EN_ROUTE_PICKUP from g pickup) ==
          (count of Drivers whose current_grid_code = g and status in
          {AVAILABLE, IN_AIRPORT_QUEUE, EN_ROUTE_PICKUP}). Forward (join) +
          compensating (leave) must leave the population at grid g unchanged.
        test_recipe:
          setup:
            - "AIRPORT grid; D1 goes-online (active_driver_count=1, queue empty)."
          trigger:
            - "POST /airport-queue/join (D1)."
            - "POST /airport-queue/leave (D1)."
          assert:
            - "After join: GeoGrid(AIRPORT).active_driver_count == 0; AirportQueue rows for AIRPORT == 1."
            - "After leave: GeoGrid(AIRPORT).active_driver_count == 1; AirportQueue rows for AIRPORT == 0  # forward+compensating leaves population unchanged."
            - "Driver.D1.current_grid_code == AIRPORT (unchanged throughout)."
            - "Driver.D1.status == AVAILABLE  # restored to pre-join state."
