            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 60000, reason_code: DELIVERY, message: "g", idempotency_key: "xcut-an-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "LUXE", name: "Luxe", category: "MERCH", point_cost: 60000, cash_value_cents: 300000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "xcut-an-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "GET /api/abuse-flags?employee_id=${emp}&rule_code=REDEMPTION_ANOMALY", payload: {}, as: HRAdmin, captures: { f0: "$.data[0].status" } }
          assert:
            - "RedemptionOrder.${ord}.fulfillment_status == PENDING_SUBMISSION (order succeeds)"
            - "${f0} == OPEN"

      - name: anniversary_skipped_for_suspended_employee
        claim_type: conditional_validation
        grounds: [calculations.anniversary_milestone_selection, entities.AnniversaryEvent.fields.status]
        distinguishing_aspect: "A SUSPENDED employee whose anniversary matches the scan date gets a SKIPPED_INELIGIBLE AnniversaryEvent and no award."
        test_recipe:
          setup: ["employee hired 2021-08-20, suspended via confirmed flag; clock 2026-08-20; milestones [{5, 500}]"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, anniversary_milestones: [ { years: 5, points: 500 } ] }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Vet", department_id: "${dept}", hire_date: "2021-08-20", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/abuse-flags", payload: { employee_id: "${emp}", program_id: "${prog}", rule_code: MANUAL_REVIEW, details: { note: "x" } }, as: HRAdmin, captures: { flag: $.data.id } }
            - { call: "POST /api/abuse-flags/${flag}/confirm", payload: {}, as: HRAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /api/programs/${prog}/anniversary-scans", payload: {}, as: HRAdmin, captures: { ev0: "$.data[0].status" } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { avail: $.data.available_points } }
          assert:
            - "${ev0} == SKIPPED_INELIGIBLE"
            - "${avail} == 0"
            - "GET /api/awards?employee_id=${emp}&source=ANNIVERSARY returns 0 rows"

      - name: clock_cannot_move_backward
        claim_type: violation_to_error
        grounds: [endpoints."POST /api/_clock/set_current_utc", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Setting the logical clock to an earlier instant than the current logical time is rejected ERR_INVALID_REQUEST; the clock stays put."
        test_recipe:
          setup: ["clock advanced to 2026-08-10"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All mutations are visible in the SAME request's response and in an immediately-following GET: the approve response already shows status APPROVED and award_id set, and a follow-up GET of the budget shows committed_points updated — no eventual-consistency lag."
        test_recipe:
          setup: ["pending 250-point nomination"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 250, reason_code: DELIVERY, message: "g", idempotency_key: "cons-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin, captures: { st: $.data.status, aw: $.data.award_id } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { com: $.data.committed_points } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { avail: $.data.available_points } }
          assert:
            - "${st} == APPROVED and ${aw} is non-null (same-response visibility)"
            - "${com} == 250 and ${avail} == 250 (immediate read-after-write)"
