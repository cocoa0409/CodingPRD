        distinguishing_aspect: "On a QUOTED order (estimate 64.47), a 25.00 deposit then a 39.47 BALANCE brings amount_paid to 64.47 == estimate_total, moving payment_status to PAID_IN_FULL even before READY."
        test_recipe:
