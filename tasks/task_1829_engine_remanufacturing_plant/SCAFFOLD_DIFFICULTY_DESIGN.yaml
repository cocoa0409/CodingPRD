              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
