  - section: validations
    instances:
      - name: missing_headers_returns_401_before_any_other_check
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID to a non-existent client path returns 401 ERR_UNAUTHENTICATED — authentication (priority 1) preempts existence (priority 3), so the 404 is never evaluated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "401 ERR_UNAUTHENTICATED (not 404)"

      - name: grant_submit_dual_failure_covered_by_difficulty
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=22]"]
        excluded_because:
          difficulty_instance: submit_suspended_client_and_closed_fund_state_beats_fiscal
          rationale: "The §1.8 instance is exactly this priority conflict (state vs business_fiscal)."

      - name: stay_dual_failure_covered_by_difficulty
        claim_type: priority_ordering
        grounds: ["validations[priority=13]", "validations[priority=16]"]
        excluded_because:
          difficulty_instance: stay_create_temporal_window_beats_bed_overlap
