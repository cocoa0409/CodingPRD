      - name: flight_sortie_rounding_order
        claim_type: precision
        grounds: ["calculations.flight_sortie_billing"]
        excluded_because:
          difficulty_instance: flight_billing_per_sortie_then_sum_rounding
          rationale: "Per-sortie-then-sum rounding (540000 vs forbidden 510000) is asserted in that §1.8 instance."

      - name: crew_duty_variants_and_reload_sla
        claim_type: boundary_edge
        grounds: ["calculations.crew_duty_projection", "calculations.reload_turn_time"]
        excluded_because:
          difficulty_instance: crew_duty_projection_vs_chronological_actuals
          rationale: "Forward-looking vs chronological duty variants (85 vs 75) and the reload SLA 30.0 boundary are asserted in the §1.8 instances crew_duty_projection_vs_chronological_actuals and reload_sla_average_exactly_thirty."

  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /contracts", as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "when the test harness sends no X-User-Role / X-User-ID headers, error_id == ERR_UNAUTHENTICATED and HTTP status 401"

      - name: pilot_cannot_create_contract
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "An authenticated Pilot calling POST /contracts (a CarrierOps-only endpoint) is rejected 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["EU contract exists (so a pilot id can exist); pilot registered"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-777", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 100, flight_hour_rate_cents: 100, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 100, acceptance_window_minutes: 30 }, as: Pilot, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE and HTTP status 403"

      - name: availability_create_state_beats_constraint
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=9]", "errors[ERR_CONTRACT_NOT_ACTIVE]", "errors[ERR_AVAILABILITY_OVERLAP]"]
        distinguishing_aspect: "Priority pair (state, business_constraint) — distinct from the §1.8 pairs: creating a duplicate-date availability period while the contract is SUSPENDED returns ERR_CONTRACT_NOT_ACTIVE, not ERR_AVAILABILITY_OVERLAP."
        test_recipe:
          setup: ["EU contract with one CONFIRMED period on 2026-08-03; contract then SUSPENDED"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps }
            - { call: "POST /contracts/${c_id}/suspend", payload: {}, as: CarrierOps }
          trigger:
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T08:00:00Z", available_end: "2026-08-03T12:00:00Z" }, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTRACT_NOT_ACTIVE (state priority 7) even though the duplicate (aircraft, 2026-08-03) period also violates ERR_AVAILABILITY_OVERLAP (constraint priority 9)"

      - name: season_flight_cap_both_gates
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_SEASON_FLIGHT_CAP_EXCEEDED]", "entities.Contract.fields.season_flight_hours_tenths"]
        distinguishing_aspect: "Fiscal gate isolated on both endpoints: with cap 20 tenths and 15 flown, a 0.6 h log is rejected (15 + 6 > 20); with cap fully reached, a fresh dispatch order is rejected (season >= cap at placement)."
        test_recipe:
          setup: ["EU contract with season cap 20 tenths; carded aircraft+pilot; order1 qty 1 ACCEPTED; assignment ON_INCIDENT; 1.5 h already logged on 2026-08-02 (season 15)"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 0.0, hobbs_stop: 1.5 }, as: Pilot, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 1.5, hobbs_stop: 2.1 }, as: Pilot, as_user_id: "${p_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 1.5, hobbs_stop: 2.0 }, as: Pilot, as_user_id: "${p_id}", captures: { ok_tenths: $.data.flight_hours_tenths } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1002", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { err2: $.data.error_id } }
          assert:
            - "0.6 h log rejected with ERR_SEASON_FLIGHT_CAP_EXCEEDED (15 + 6 == 21 > 20)"
            - "0.5 h log accepted with flight_hours_tenths == 5 (15 + 5 == 20 <= cap; boundary inclusive)"
            - "after season reaches exactly 20, new dispatch order rejected with ERR_SEASON_FLIGHT_CAP_EXCEEDED (season >= cap gate at placement)"

      - name: invoice_submit_period_close_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_BILLING_PERIOD_NOT_CLOSED]", "state_machines.Invoice.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "Temporal boundary on submit: period_end equal to the clock date is still NOT closed (period_end < clock date required), so submit on 2026-08-03 for a period ending 2026-08-03 fails; the same submit succeeds once the clock reaches 2026-08-04."
        test_recipe:
          setup: ["EU contract ACTIVE; one CONFIRMED availability day 2026-08-03; DRAFT invoice 2026-08-03..2026-08-03; clock advanced to 2026-08-03T23:59:00Z"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-03", period_end: "2026-08-03", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T23:59:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: CarrierFinance, as_user_id: "cf_1", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: CarrierFinance, as_user_id: "cf_1", captures: { st: $.data.status } }
          assert:
            - "submit at clock date == period_end fails with ERR_BILLING_PERIOD_NOT_CLOSED (period not yet closed; comparison is strict)"
            - "submit at clock date 2026-08-04 succeeds: status == SUBMITTED"

      - name: invoice_period_overlap_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVOICE_PERIOD_OVERLAP]", "entities.Invoice.fields.period_start"]
        distinguishing_aspect: "A second non-VOID invoice for the same (contract_id, period_start) is rejected 409 even with a fresh OCC version."
        test_recipe:
          setup: ["EU contract ACTIVE; DRAFT invoice for period_start 2026-08-03 already exists"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v1: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-03", period_end: "2026-08-07", expected_contract_version: "${c_v1}" }, as: CarrierFinance, captures: { inv_id: $.data.id } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v2: $.data.version } }
          trigger:
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-03", period_end: "2026-08-10", expected_contract_version: "${c_v2}" }, as: CarrierFinance, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVOICE_PERIOD_OVERLAP (409): uniqueness keys on (contract_id, period_start) regardless of period_end"

      - name: availability_service_date_outside_season
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_SERVICE_DATE_OUTSIDE_SEASON]"]
        distinguishing_aspect: "Temporal boundary on the season window: service_date 2026-09-30 (== season_end_date, inclusive) is accepted; 2026-10-01 is rejected with ERR_SERVICE_DATE_OUTSIDE_SEASON."
