  - { method: GET, path: "/api/work-orders", description: "List work orders", roles: [ShopManager, Mechanic, Owner, PartsClerk], code: 200, input: ["limit?", "offset?", "aircraft_id?", "hangar_slot_id?", "opened_by_mechanic_id?", "status?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/api/work-orders/{id}", description: "Get work order", roles: [ShopManager, Mechanic, Owner, PartsClerk], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/api/work-orders/{id}/schedule", description: "DRAFT -> SCHEDULED", roles: [ShopManager], code: 200, input: [], output: WorkOrder, side_effects: ["WorkOrder.version += 1"] }
  - { method: POST, path: "/api/work-orders/{id}/start", description: "SCHEDULED -> IN_PROGRESS; occupies slot", roles: [Mechanic], code: 200, input: [], output: WorkOrder, side_effects: ["HangarSlot -> OCCUPIED", "WorkOrder.version += 1"] }
  - { method: POST, path: "/api/work-orders/{id}/checklist-items", description: "Add checklist item", roles: [Mechanic], code: 201, input: [item_code, description, flat_rate_cents], output: ChecklistItem, side_effects: [] }
  - { method: GET, path: "/api/work-orders/{id}/checklist-items", description: "List checklist items", roles: [ShopManager, Mechanic, Owner], code: 200, input: ["result?", "inspected_by_mechanic_id?"], output: "ChecklistItem[]", side_effects: [] }
