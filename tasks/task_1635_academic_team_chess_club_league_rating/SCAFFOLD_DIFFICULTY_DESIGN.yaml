            - "Club.${club_a}.account_balance_cents == 2204 (5000 - 3*932 = 2204), NOT 2205 (which sum-then-round round(3*931.5)=2795 would give) — got ${bal}"

      - name: season_invoice_credit_evaluation_order
        grounds:
