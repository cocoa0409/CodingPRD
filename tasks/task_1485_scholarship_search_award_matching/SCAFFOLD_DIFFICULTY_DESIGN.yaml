              as: ScholarshipCoordinator
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_id}", application_id: "${app_id}", academic_score: 90, essay_score: 90, need_score: 90 }
              as: CommitteeReviewer
              as_user_id: "rev_1"
              captures: { sc_id: $.data.id }
            - call: "POST /api/review-scores/${sc_id}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_1"
            - call: "POST /api/review-cycles/${c_id}/open-deliberation"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_id}/finalize"
              as: ScholarshipCoordinator
          trigger:
            - call: "POST /api/awards"
              payload: { application_id: "${app_id}", student_id: "${s_id}", amount_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { aw_id: $.data.id }
            - call: "GET /api/award-funds/${f_id}"
              as: ScholarshipCoordinator
              captures: { f_avail_mid: $.data.available_cents, f_reserved_mid: $.data.reserved_cents }
            - call: "POST /api/awards/${aw_id}/revoke"
              as: ScholarshipCoordinator
            - call: "GET /api/award-funds/${f_id}"
              as: ScholarshipCoordinator
              captures: { f_avail_end: $.data.available_cents, f_reserved_end: $.data.reserved_cents, f_disbursed_end: $.data.disbursed_cents, f_returned_end: $.data.returned_cents }
          assert:
            - "f_avail_0 == 5000000 and f_reserved_0 == 0 (baseline)"
            - "After offer: f_avail_mid == 4000000 and f_reserved_mid == 1000000 (forward action reserved the money)"
            - "After revoke (compensating action): f_avail_end == 5000000 == f_avail_0, f_reserved_end == 0, f_disbursed_end == 0, f_returned_end == 0 — no drift in the conserved money identity"

      - name: deliberation_reopen_application_count_conservation
