scenario: |
  2928. Field-Erected Storage Tank Construction (aboveground storage tank erector): tank design to industry standards with shell course thickness, roof type and foundation requirements, foundation coordination with the civil contractor including settlement monitoring requirements, plate procurement, rolling and shipment with field weld sequencing to control distortion, welder qualification and field nondestructive examination with radiography of shell seams, hydrostatic test planning with water sourcing, disposal and settlement measurement during filling, coating and lining application with surface preparation and holiday testing, appurtenance installation including nozzles, stairs and mixers, commissioning documentation and inspection scheduling for in-service intervals

domain_name: field-erected-storage-tank-construction
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: workflow orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # flat: every entity is its own top-level collection reachable at `/<collection>`;
  # relationships are expressed exclusively through FK fields in request bodies and
  # through filtered-list reads (`GET /<collection>?<fk_field>=`). No nested URL paths.

  state_machine_shape: parallel
  # Tank carries two independent state dimensions that evolve separately:
  #   construction_phase (DESIGN_REGISTERED..COMMISSIONED, with system-driven reverts)
  #   quality_posture    (OPEN/RESTRICTED/FROZEN, derived from open nonconformances)
  # WeldSeam and CoatingApplication are cyclic (repair / rework loops with a hard
  # cycle limit); FoundationPackage and CommissioningPackage are branching
  # (accept-vs-reject / accept-vs-return with divergent side-effect sets);
  # ShellCourse is compound (its status is derived from its WeldSeam children).

  relationship_patterns:
    - one_to_many        # Tank -> ShellCourse/PlateLot/CoatingApplication/Appurtenance
    - self_referential   # WeldSeam.predecessor_seam_id -> WeldSeam.id (weld sequence chain)
    - cross_aggregate    # WeldSeam.welder_id -> Welder; WaterWithdrawal.water_source_id -> WaterSource
    - polymorphic: false

  role_model: segregation_of_duties
  # Six peer roles own disjoint operation sets, and two operations additionally
  # forbid the acting X-User-ID from being the same operator who performed an
  # earlier dependent step (NDE result vs welder qualification issuance;
  # hydrotest completion vs hydrotest approval; commissioning review vs
  # commissioning submission).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tank
    parent: null
    common_fields: true
    fields:
      - name: tank_tag
        type: string
        source: input
        description: Owner's tank identifier stamped on the nameplate.
        constraints: "1-32 chars; unique across all Tank rows (ERR_DUPLICATE_IDENTIFIER)"
      - name: design_standard
        type: enum
        source: input
        description: Governing design standard for the shell calculation.
        default: API_650_BASIC
        constraints: "one of {API_650_BASIC, API_650_ANNEX_A, API_620}"
      - name: diameter_ft
        type: number
        source: input
        description: Nominal tank diameter in feet; drives minimum nominal plate thickness tier.
        constraints: "> 0"
      - name: shell_height_ft
        type: number
        source: input
        description: Total shell height in feet.
        constraints: "> 0"
      - name: design_liquid_level_ft
        type: number
        source: input
        description: Design liquid level in feet; the H term of the one-foot-method formula.
        constraints: "> 0 and <= shell_height_ft"
      - name: product_specific_gravity
        type: number
        source: input
        description: Stored product specific gravity; the G term of the design-condition formula.
        constraints: ">= 0.5 and <= 2.0"
      - name: joint_efficiency
        type: number
        source: input
        description: Weld joint efficiency E used in both thickness formulas.
        constraints: "one of {0.70, 0.85, 1.00}"
      - name: corrosion_allowance_in
        type: number
        source: input
        description: Corrosion allowance added to the design-condition thickness only.
        default: 0.0625
        constraints: ">= 0"
      - name: roof_type
        type: enum
        source: input
        description: Roof configuration; recorded for commissioning documentation.
        default: CONE_SUPPORTED
        constraints: "one of {CONE_SUPPORTED, CONE_SELF_SUPPORTING, DOME_SELF_SUPPORTING, EXTERNAL_FLOATING, INTERNAL_FLOATING}"
      - name: bottom_thickness_in
        type: number
        source: input
        description: As-built bottom plate thickness used for in-service interval calculation.
        constraints: "> 0"
      - name: bottom_minimum_thickness_in
        type: number
        source: input
        description: Retirement thickness of the bottom plate.
        constraints: "> 0 and < bottom_thickness_in"
      - name: assumed_corrosion_rate_ipy
        type: number
        source: input
        description: Assumed bottom corrosion rate in inches per year for interval calculation.
        constraints: "> 0"
      - name: min_nominal_thickness_in
        type: number
        source: computed
        description: Minimum nominal shell thickness tier selected from diameter_ft (see calculations.shell_course_required_thickness constants).
      - name: construction_phase
        type: enum
        source: computed
        description: First state dimension - physical build progress. Advanced by operator phase-transitions and by system cascades.
        default: DESIGN_REGISTERED
        constraints: "one of {DESIGN_REGISTERED, FOUNDATION_ACCEPTED, ERECTION_IN_PROGRESS, SHELL_COMPLETE, HYDROTEST_PASSED, COATED, COMMISSIONED}"
      - name: quality_posture
        type: enum
        source: computed
        description: Second state dimension - derived quality gate recomputed by calculations.tank_quality_posture after every mutation that can change open_nonconformance_count.
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: open_nonconformance_count
        type: integer
        source: computed
        description: Count of open nonconformances across NdeReport, CoatingApplication and SettlementSurvey (see calculations.tank_quality_posture).
        default: 0
      - name: weld_reject_rate
        type: number
        source: computed
        description: Rejected-over-examined ratio across this tank's reported NdeReport rows, 4 decimal places.
        default: 0.0
      - name: required_examination_pct
        type: number
        source: computed
        description: Currently mandated radiographic examination percentage, escalated from weld_reject_rate.
        default: 10.0
      - name: steel_received_lb
        type: number
        source: computed
        description: Conserved quantity - sum of received_weight_lb over this tank's PlateLot rows with status IN {RECEIVED, QUARANTINED, RELEASED}.
        default: 0.0
      - name: steel_allocated_lb
        type: number
        source: computed
        description: Sum of allocated_weight_lb over this tank's ShellCourse rows with allocation_status == ALLOCATED.
        default: 0.0
      - name: active_hydrotest_plan_id
        type: string
        source: computed
        description: Denormalized pointer to the id of the HydrotestPlan currently governing this tank; null when none. Reverse link is HydrotestPlan.tank_id.
        default: null

  - name: FoundationPackage
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; at most one FoundationPackage per Tank (ERR_SINGLETON_EXISTS)"
      - name: foundation_type
        type: enum
        source: input
        description: Civil contractor's foundation configuration.
        constraints: "one of {RINGWALL_CONCRETE, CRUSHED_STONE_RINGWALL, EARTHEN_PAD, SLAB}"
      - name: ringwall_top_elevation_ft
        type: number
        source: input
        description: Surveyed ringwall top elevation recorded for the civil handover.
        default: 0.0
      - name: settlement_evaluation_method
        type: enum
        source: input
        description: Selects which differential-settlement variant decides SettlementSurvey.verdict.
        constraints: "one of {COSINE_BEST_FIT, ADJACENT_PAIR}"
      - name: permitted_uniform_settlement_in
        type: number
        source: input
        description: Maximum allowed mean settlement across all monitoring points, in inches.
        constraints: "> 0"
      - name: permitted_differential_ratio
        type: number
        source: input
        description: Allowed differential settlement expressed as a fraction of the arc distance between adjacent monitoring points.
        constraints: "> 0 and <= 0.05"
      - name: monitoring_point_count
        type: integer
        source: input
        description: Number of equally spaced settlement monitoring points around the circumference.
        constraints: ">= 8, even"
      - name: point_spacing_in
        type: number
        source: computed
        description: Arc distance between adjacent monitoring points in inches (see calculations.settlement_tolerance_envelope).
      - name: allowable_differential_in
        type: number
        source: computed
        description: Allowable differential settlement in inches, 3 decimal places (see calculations.settlement_tolerance_envelope).
      - name: baseline_survey_id
        type: string
        source: computed
        description: Denormalized pointer to the id of the SettlementSurvey that established the baseline elevations; null until BASELINE_SET.
        default: null
      - name: status
        type: enum
        source: computed
        description: Branching lifecycle - see state_machines.FoundationPackage.
        default: PLANNED
        constraints: "one of {PLANNED, BASELINE_SET, ACCEPTED, REJECTED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectEngineer who accepted or rejected the package; null until decided.
        default: null
      - name: decided_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the acceptance decision; null until decided.
        default: null
      - name: decision_remarks
        type: string
        source: input
        description: Free-text remarks captured with the acceptance decision.
        default: null

  - name: SettlementSurvey
    parent: null
    common_fields: true
    fields:
      - name: foundation_package_id
        type: string
        source: input
        description: "FK -> FoundationPackage.id; the package whose monitoring grid this survey reads"
      - name: hydrotest_plan_id
        type: string
        source: input
        description: "FK -> HydrotestPlan.id; set for surveys taken during hydrostatic filling, null for pre-test surveys"
        default: null
      - name: survey_role
        type: enum
        source: computed
        description: BASELINE for the first survey on a package (fill_percent == 0), MONITORING for every later survey.
        constraints: "one of {BASELINE, MONITORING}"
      - name: fill_percent
        type: number
        source: input
        description: Tank fill level at the time of measurement, percent of design liquid level.
        constraints: ">= 0 and <= 100"
      - name: measured_at_utc
        type: datetime
        source: input
        description: Instant of measurement; defaults to the logical clock's current_utc when omitted.
        default: null
      - name: point_readings
        type: array
        source: input
        description: "Array of objects { point_index: integer >= 1, elevation_in: number }; exactly monitoring_point_count entries, point_index values 1..monitoring_point_count with no duplicates."
      - name: uniform_settlement_in
        type: number
        source: computed
        description: Mean settlement over all points, 3 decimal places; 0.000 on the baseline survey.
        default: 0.0
      - name: max_out_of_plane_in
        type: number
        source: computed
        description: Cosine-best-fit out-of-plane deviation variant result, 3 decimal places.
        default: 0.0
      - name: max_adjacent_differential_in
        type: number
        source: computed
        description: Adjacent-pair differential variant result, 3 decimal places.
        default: 0.0
      - name: governing_metric_in
        type: number
        source: computed
        description: Whichever of max_out_of_plane_in / max_adjacent_differential_in the package's settlement_evaluation_method selects.
        default: 0.0
      - name: verdict
        type: enum
        source: computed
        description: BASELINE for the baseline survey; otherwise WITHIN_TOLERANCE or OUT_OF_TOLERANCE per calculations.differential_settlement_evaluation.
        constraints: "one of {BASELINE, WITHIN_TOLERANCE, OUT_OF_TOLERANCE}"
      - name: nonconformance_state
        type: enum
        source: computed
        description: OPEN only while verdict == OUT_OF_TOLERANCE and no later survey on the same package has closed it; NOT_APPLICABLE otherwise.
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, OPEN, CLOSED_BY_SUPERSEDING_SURVEY}"
      - name: superseded_by_survey_id
        type: string
        source: computed
        description: Denormalized pointer to the id of the later SettlementSurvey that closed this survey's nonconformance; null when still OPEN or NOT_APPLICABLE.
        default: null

  - name: PlateLot
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; the tank this procurement lot is bought for"
      - name: mill_name
        type: string
        source: input
        description: Rolling mill that produced the plate.
      - name: heat_number
        type: string
        source: input
        description: Mill heat number carried on the material test report.
      - name: thickness_in
        type: number
        source: input
        description: As-rolled plate thickness of every plate in the lot.
        constraints: "> 0"
      - name: plate_count
        type: integer
        source: input
        description: Number of plates in the lot.
        constraints: ">= 1"
      - name: plate_weight_lb
        type: number
        source: input
        description: Weight of a single plate in pounds.
        constraints: "> 0"
      - name: unit_cost_usd_per_lb
        type: number
        source: input
        description: Contract price per pound; recorded for procurement records.
        constraints: "> 0"
      - name: mtr_number
        type: string
        source: input
        description: Material test report number; required to move the lot to RECEIVED and to release it from QUARANTINED.
        default: null
      - name: received_weight_lb
        type: number
        source: computed
        description: "plate_count * plate_weight_lb once status IN {RECEIVED, QUARANTINED, RELEASED}; 0.0 before receipt. Conserved quantity anchor for the steel ledger."
        default: 0.0
      - name: allocated_weight_lb
        type: number
        source: computed
        description: Sum of allocated_weight_lb over ShellCourse rows whose allocated_plate_lot_id equals this lot and whose allocation_status == ALLOCATED.
        default: 0.0
      - name: remaining_weight_lb
        type: number
        source: computed
        description: received_weight_lb - allocated_weight_lb; never negative (guarded by ERR_PLATE_WEIGHT_EXCEEDED).
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: Procurement / rolling / shipment lifecycle - see state_machines.PlateLot.
        default: ORDERED
        constraints: "one of {ORDERED, ROLLED, SHIPPED, RECEIVED, QUARANTINED, RELEASED}"
      - name: quarantine_reason
        type: string
        source: input
        description: Reason recorded when the lot is quarantined for an MTR discrepancy.
        default: null

  - name: ShellCourse
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; the tank this course belongs to"
      - name: course_number
        type: integer
        source: input
        description: 1 is the bottom course; courses are stacked in ascending order.
        constraints: ">= 1; unique per tank_id (ERR_DUPLICATE_IDENTIFIER)"
      - name: course_width_ft
        type: number
        source: input
        description: Vertical width of the course in feet.
        constraints: "> 0"
      - name: plate_thickness_in
        type: number
        source: input
        description: Ordered nominal plate thickness for this course.
        constraints: "> 0"
      - name: material_spec
        type: string
        source: input
        description: Plate material specification, e.g. A36 or A516-70.
      - name: allowable_stress_design_psi
        type: number
        source: input
        description: Allowable stress Sd for the design condition.
        constraints: "> 0"
      - name: allowable_stress_test_psi
        type: number
        source: input
        description: Allowable stress St for the hydrostatic test condition.
        constraints: "> 0"
      - name: course_bottom_elevation_ft
        type: number
        source: computed
        description: Sum of course_width_ft over same-tank courses with a lower course_number, ascending.
        default: 0.0
      - name: design_liquid_height_ft
        type: number
        source: computed
        description: Tank.design_liquid_level_ft - course_bottom_elevation_ft; the H term for this course.
      - name: required_thickness_design_in
        type: number
        source: computed
        description: Design-condition one-foot-method thickness, 3 decimal places.
      - name: required_thickness_test_in
        type: number
        source: computed
        description: Hydrostatic-test-condition one-foot-method thickness, 3 decimal places.
      - name: required_thickness_in
        type: number
        source: computed
        description: Maximum of the two rounded variant thicknesses and Tank.min_nominal_thickness_in.
      - name: governing_case
        type: enum
        source: computed
        description: Which of the three candidate thicknesses produced required_thickness_in; DESIGN wins ties against TEST, TEST wins ties against MIN_NOMINAL.
        constraints: "one of {DESIGN, TEST, MIN_NOMINAL}"
      - name: thickness_verdict
        type: enum
        source: computed
        description: ADEQUATE when plate_thickness_in >= required_thickness_in, else DEFICIENT.
        constraints: "one of {ADEQUATE, DEFICIENT}"
      - name: allocated_plate_lot_id
        type: string
        source: computed
        description: "FK -> PlateLot.id; set by POST /plate-lots/{plate_lot_id}/allocations, cleared by POST /shell-courses/{shell_course_id}/allocation-release"
        default: null
      - name: allocated_weight_lb
        type: number
        source: computed
        description: Steel weight charged to this course from allocated_plate_lot_id; 0.0 when unallocated.
        default: 0.0
      - name: allocation_status
        type: enum
        source: computed
        description: ALLOCATED once plate steel is charged to this course, UNALLOCATED after release.
        default: UNALLOCATED
        constraints: "one of {UNALLOCATED, ALLOCATED}"
      - name: status
        type: enum
        source: computed
        description: Compound status - SPECIFIED until fitup, then derived from this course's WeldSeam children (see state_machines.ShellCourse).
        default: SPECIFIED
        constraints: "one of {SPECIFIED, FITTED, WELDED, RT_ACCEPTED}"
      - name: fitup_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant the course was fitted up; null before fitup.
        default: null

  - name: Welder
    parent: null
    common_fields: true
    fields:
      - name: welder_stamp
        type: string
        source: input
        description: Stamp the welder marks on every seam.
        constraints: "unique across all Welder rows (ERR_DUPLICATE_IDENTIFIER)"
      - name: full_name
        type: string
        source: input
        description: Welder's legal name on the performance qualification record.
      - name: process
        type: enum
        source: input
        description: Welding process the performance qualification covers.
        constraints: "one of {SMAW, SAW, FCAW, GTAW}"
      - name: qualified_positions
        type: array
        source: input
        description: Array of position codes (strings) the welder is qualified for, e.g. ["3G", "4G"].
        constraints: "non-empty"
      - name: welder_qualified_thickness_max_in
        type: number
        source: input
        description: Maximum base-metal thickness the welder's performance qualification covers.
        constraints: "> 0"
      - name: wps_number
        type: string
        source: input
        description: Welding procedure specification the welder is qualified under.
      - name: wps_qualified_thickness_max_in
        type: number
        source: input
        description: Maximum base-metal thickness the referenced WPS itself is qualified for.
        constraints: "> 0"
      - name: qualification_date_utc
        type: datetime
        source: input
        description: Date the performance qualification test was witnessed.
      - name: continuity_limit_days
        type: integer
        source: input
        description: Days of continuity the qualification remains valid without requalification.
        default: 180
        constraints: ">= 1"
      - name: last_weld_date_utc
        type: datetime
        source: computed
        description: Most recent qualification, renewal or production weld instant; the base date the continuity window is measured from.
        default: null
      - name: continuity_expires_at_utc
        type: datetime
        source: computed
        description: last_weld_date_utc plus continuity_limit_days, to the second.
      - name: qualification_status
        type: enum
        source: computed
        description: REVOKED once revoked; otherwise LAPSED when the logical clock is strictly after continuity_expires_at_utc, else QUALIFIED. Re-evaluated on every read and on every weld-log attempt.
        default: QUALIFIED
        constraints: "one of {QUALIFIED, LAPSED, REVOKED}"
      - name: qualified_by_user_id
        type: string
        source: system
        description: X-User-ID of the QcInspector who recorded this qualification; drives the NDE-result segregation-of-duties rule.
      - name: revoked_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant the qualification was revoked; null when never revoked.
        default: null

  - name: WeldSeam
    parent: null
    common_fields: true
    fields:
      - name: shell_course_id
        type: string
        source: input
        description: "FK -> ShellCourse.id; the course this seam joins"
      - name: seam_type
        type: enum
        source: input
        description: VERTICAL seams are course butt joints, HORIZONTAL seams are course-to-course girth joints.
        constraints: "one of {VERTICAL, HORIZONTAL}"
      - name: seam_label
        type: string
        source: input
        description: Field mark for the seam.
        constraints: "unique per shell_course_id (ERR_DUPLICATE_IDENTIFIER)"
      - name: length_in
        type: number
        source: input
        description: Seam length in inches; drives radiographic film count expectations.
        constraints: "> 0"
      - name: sequence_index
        type: integer
        source: input
        description: Position of this seam in the distortion-control weld sequence for its course.
        constraints: ">= 1; unique per shell_course_id (ERR_DUPLICATE_IDENTIFIER)"
      - name: predecessor_seam_id
        type: string
        source: input
        description: "FK -> WeldSeam.id; self-referential sequencing link - this seam may not be welded until its predecessor reaches RT_ACCEPTED. Null for sequence heads."
        default: null
      - name: welder_id
        type: string
        source: input
        description: "FK -> Welder.id; recorded by the weld-log call, overwritten on each repair re-weld"
        default: null
      - name: status
        type: enum
        source: computed
        description: Cyclic lifecycle with a repair loop - see state_machines.WeldSeam.
        default: FIT_READY
        constraints: "one of {FIT_READY, WELDED, EXAM_SCHEDULED, RT_ACCEPTED, RT_REJECTED, REPAIR_IN_PROGRESS, REPLACEMENT_REQUIRED}"
      - name: repair_cycle_count
        type: integer
        source: computed
        description: Number of completed repair loops; a rejection recorded while this already equals MAX_REPAIR_CYCLES sends the seam to REPLACEMENT_REQUIRED.
        default: 0
      - name: welded_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent weld-log; null before first weld.
        default: null
      - name: filler_lot
        type: string
        source: input
        description: Consumable lot recorded with the weld log.
        default: null
      - name: last_nde_report_id
        type: string
        source: computed
        description: Denormalized pointer to the id of the most recently created NdeReport for this seam; null before any examination. Reverse link is NdeReport.weld_seam_id.
        default: null

  - name: NdeReport
    parent: null
    common_fields: true
    fields:
      - name: weld_seam_id
        type: string
        source: input
        description: "FK -> WeldSeam.id; the seam under examination"
      - name: method
        type: enum
        source: input
        description: Examination method; only RT occupies the tank's radiographic exclusion window.
        constraints: "one of {RT, UT, MT, PT, VT}"
      - name: window_start_utc
        type: datetime
        source: input
        description: Start of the scheduled examination window (closed interval).
      - name: window_end_utc
        type: datetime
        source: input
        description: End of the scheduled examination window (closed interval); must be strictly after window_start_utc.
      - name: coverage_pct
        type: number
        source: input
        description: Percentage of the seam length covered by this examination.
        constraints: "> 0 and <= 100"
      - name: technician_stamp
        type: string
        source: input
        description: Examination technician's stamp.
      - name: status
        type: enum
        source: computed
        description: SCHEDULED at creation, then one of the reported terminals or VOIDED - see state_machines.NdeReport.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, REPORTED_ACCEPT, REPORTED_REJECT, VOIDED}"
      - name: nonconformance_open
        type: boolean
        source: computed
        description: True while this report stands as an unresolved rejection; counted by calculations.tank_quality_posture.
        default: false
      - name: indication_count
        type: integer
        source: input
        description: Number of rejectable indications recorded with the result; 0 for an accepted film set.
        default: 0
      - name: film_count
        type: integer
        source: input
        description: Number of radiographs in the film set, recorded with the result.
        default: 0
      - name: defect_type
        type: enum
        source: input
        description: Dominant defect classification recorded with a REJECT result; null on ACCEPT.
        default: null
        constraints: "one of {POROSITY, SLAG_INCLUSION, INCOMPLETE_PENETRATION, CRACK, UNDERCUT}"
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the QcInspector who recorded the result; null while SCHEDULED.
        default: null
      - name: reported_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant the result was recorded; null while SCHEDULED.
        default: null
      - name: void_reason
        type: string
        source: input
        description: Reason the scheduled examination was voided; null unless status == VOIDED.
        default: null

  - name: WaterSource
    parent: null
    common_fields: true
    fields:
      - name: source_name
        type: string
        source: input
        description: Permitted water source used for hydrostatic testing.
      - name: source_type
        type: enum
        source: input
        description: Source category recorded on the withdrawal permit.
        constraints: "one of {MUNICIPAL, RIVER, WELL, RECLAIMED}"
      - name: permitted_volume_gal
        type: number
        source: input
        description: Total volume the withdrawal permit allows, in gallons. Conserved quantity anchor for the water ledger.
        constraints: "> 0"
      - name: max_concurrent_rate_gpm
        type: number
        source: input
        description: Maximum aggregate withdrawal rate allowed at any instant, gallons per minute.
        constraints: "> 0"
      - name: water_cost_usd_per_kgal
        type: number
        source: input
        description: Supply cost per thousand gallons.
        constraints: ">= 0"
      - name: disposal_cost_usd_per_kgal
        type: number
        source: input
        description: Base disposal cost per thousand gallons before the volume-tier factor.
        constraints: ">= 0"
      - name: permit_expiry_utc
        type: datetime
        source: input
        description: Instant the withdrawal permit lapses; a withdrawal window may not end after it.
      - name: reserved_volume_gal
        type: number
        source: computed
        description: Sum of reserved_volume_gal over this source's WaterWithdrawal rows with status == RESERVED.
        default: 0.0
      - name: consumed_volume_gal
        type: number
        source: computed
        description: Sum of reserved_volume_gal over this source's WaterWithdrawal rows with status == CONSUMED.
        default: 0.0
      - name: available_volume_gal
        type: number
        source: computed
        description: permitted_volume_gal - reserved_volume_gal - consumed_volume_gal; the ledger invariant keeps the three parts summing to permitted_volume_gal.
        default: 0.0

  - name: HydrotestPlan
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; the tank to be hydrostatically tested"
      - name: water_source_id
        type: string
        source: input
        description: "FK -> WaterSource.id; the only source this plan's withdrawals may draw from"
      - name: fill_volume_gal
        type: number
        source: input
        description: Water volume required to reach the design liquid level.
        constraints: "> 0"
      - name: disposal_method
        type: enum
        source: input
        description: Planned disposal route for the test water.
        constraints: "one of {DISCHARGE_TO_POTW, LAND_APPLICATION, HAUL_OFFSITE, REUSE_NEXT_TANK}"
      - name: hold_hours
        type: integer
        source: input
        description: Hold time at full level before the test may be signed off.
        constraints: ">= 24"
      - name: fill_percent_current
        type: number
        source: computed
        description: Fill level reached so far; advanced only by fill-advance calls.
        default: 0.0
      - name: settlement_survey_count
        type: integer
        source: computed
        description: Number of settlement surveys linked to this plan through fill-advance calls; the completion gate requires the four mandatory hold-point surveys.
        default: 0
      - name: hold_started_at_utc
        type: datetime
        source: computed
        description: Instant the tank reached 100 percent fill and the hold period began; preserved across suspension so the hold clock is never restarted.
        default: null
      - name: completed_at_utc
        type: datetime
        source: computed
        description: Instant the PASS or FAIL completion decision was recorded.
        default: null
      - name: water_cost_usd
        type: number
        source: computed
        description: Sum of per-withdrawal rounded costs (round-then-sum order is pinned by calculations.hydrotest_water_and_disposal_cost).
        default: 0.0
      - name: disposal_cost_usd
        type: number
        source: computed
        description: Tiered disposal charge for the disposed volume, 2 decimal places.
        default: 0.0
      - name: subtotal_usd
        type: number
        source: computed
        description: water_cost_usd + disposal_cost_usd; the tier selector for the permit surcharge.
        default: 0.0
      - name: permit_surcharge_pct
        type: number
        source: computed
        description: Surcharge fraction selected from the tier of subtotal_usd, never from total_cost_usd.
        default: 0.0
      - name: surcharge_usd
        type: number
        source: computed
        description: round_half_up(subtotal_usd * permit_surcharge_pct, 2).
        default: 0.0
      - name: total_cost_usd
        type: number
        source: computed
        description: subtotal_usd + surcharge_usd.
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: Lifecycle with supersede and posture-driven suspension - see state_machines.HydrotestPlan.
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, REJECTED, FILLING, FILL_HOLD, PASSED, FAILED, SUSPENDED, SUPERSEDED}"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorizedInspector who approved the plan; drives the completion segregation-of-duties rule.
        default: null
      - name: state_before_suspension
        type: enum
        source: computed
        description: Status held immediately before a posture-driven suspension, restored when the posture returns to OPEN.
        default: null
        constraints: "one of {APPROVED, FILLING, FILL_HOLD}"
      - name: suspension_reason
        type: string
        source: computed
        description: Reason text stamped when the plan is suspended; null when not suspended.
        default: null
      - name: previous_plan_id
        type: string
        source: computed
        description: Denormalized pointer to the id of the HydrotestPlan this plan superseded; null for the first plan on a tank.
        default: null

  - name: WaterWithdrawal
    parent: null
    common_fields: true
    fields:
      - name: hydrotest_plan_id
        type: string
        source: input
        description: "FK -> HydrotestPlan.id; the plan this reservation serves"
      - name: water_source_id
        type: string
        source: input
        description: "FK -> WaterSource.id; must equal the plan's water_source_id (ERR_CROSS_TANK_REFERENCE)"
      - name: window_start_utc
        type: datetime
        source: input
        description: Start of the withdrawal window (half-open interval - a window starting exactly at another's end does not overlap).
      - name: window_end_utc
        type: datetime
        source: input
        description: End of the withdrawal window (exclusive); must be strictly after window_start_utc.
      - name: rate_gpm
        type: number
        source: input
        description: Instantaneous withdrawal rate during the window; aggregated against WaterSource.max_concurrent_rate_gpm.
        constraints: "> 0"
      - name: reserved_volume_gal
        type: number
        source: input
        description: Volume reserved against the permit for this window.
        constraints: "> 0"
      - name: withdrawal_cost_usd
        type: number
        source: computed
        description: round_half_up(reserved_volume_gal / 1000 * WaterSource.water_cost_usd_per_kgal, 2) - rounded per withdrawal before any summation.
      - name: status
        type: enum
        source: computed
        description: RESERVED at creation, CONSUMED once the fill stage it funds completes, CANCELLED when released - see state_machines.WaterWithdrawal.
        default: RESERVED
        constraints: "one of {RESERVED, CONSUMED, CANCELLED}"
      - name: cancellation_reason
        type: string
        source: input
        description: Reason recorded when the reservation is released; also stamped by system suspension cascades.
        default: null

  - name: CoatingApplication
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; the tank being coated or lined"
      - name: scope
        type: enum
        source: input
        description: INTERNAL_LINING or EXTERNAL_COATING; the external coating verdict also selects the external inspection interval.
        constraints: "one of {INTERNAL_LINING, EXTERNAL_COATING}"
      - name: surface_area_sqft
        type: number
        source: input
        description: Coated area in square feet.
        constraints: "> 0"
      - name: specified_prep_standard
        type: enum
        source: input
        description: Surface preparation grade the specification demands.
        constraints: "one of {SSPC_SP5, SSPC_SP6, SSPC_SP10}"
      - name: specified_min_dft_mils
        type: number
        source: input
        description: Specified minimum dry film thickness in mils.
        constraints: "> 0"
      - name: dft_acceptance_method
        type: enum
        source: input
        description: Selects which dry-film-thickness variant decides dft_verdict.
        constraints: "one of {SPOT_AVERAGE_80_120, INDIVIDUAL_GAUGE_MIN}"
      - name: coating_system
        type: string
        source: input
        description: Generic coating system description, e.g. "epoxy/polyurethane 2-coat".
      - name: achieved_prep_standard
        type: enum
        source: input
        description: Prep grade actually achieved, recorded by the surface-prep call.
        default: null
        constraints: "one of {SSPC_SP5, SSPC_SP6, SSPC_SP10, SSPC_SP3}"
      - name: profile_mils
        type: number
        source: input
        description: Measured anchor profile in mils, recorded by the surface-prep call.
        default: null
      - name: dew_point_spread_f
        type: number
        source: input
        description: Surface-temperature-minus-dew-point spread in degrees F at prep time; must be at least MIN_DEW_POINT_SPREAD_F.
        default: null
      - name: spot_count
        type: integer
        source: computed
        description: Number of DFT spots recorded by the most recent dft-readings call.
        default: 0
      - name: computed_spot_average_min_mils
        type: number
        source: computed
        description: Lowest of the per-spot averages, 1 decimal place.
        default: 0.0
      - name: computed_spot_average_max_mils
        type: number
        source: computed
        description: Highest of the per-spot averages, 1 decimal place.
        default: 0.0
      - name: computed_overall_average_mils
        type: number
        source: computed
        description: Mean of the rounded per-spot averages, 1 decimal place.
        default: 0.0
      - name: computed_min_gauge_reading_mils
        type: number
        source: computed
        description: Lowest individual gauge reading across all spots, 1 decimal place.
        default: 0.0
      - name: dft_verdict
        type: enum
        source: computed
        description: PASS or FAIL per calculations.coating_dft_acceptance under the selected dft_acceptance_method; NOT_EVALUATED before any readings.
        default: NOT_EVALUATED
        constraints: "one of {NOT_EVALUATED, PASS, FAIL}"
      - name: holidays_found
        type: integer
        source: input
        description: Number of holidays detected by the low-voltage/high-voltage holiday test.
        default: null
        constraints: ">= 0"
      - name: holiday_test_voltage_v
        type: number
        source: input
        description: Test voltage applied during holiday detection.
        default: null
      - name: rework_cycle_count
        type: integer
        source: computed
        description: Number of times this application has been sent back for rework; capped by MAX_REWORK_CYCLES.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Cyclic lifecycle with a rework loop - see state_machines.CoatingApplication.
        default: SPEC_ISSUED
        constraints: "one of {SPEC_ISSUED, PREP_ACCEPTED, DFT_RECORDED, ACCEPTED, REWORK_REQUIRED}"

  - name: Appurtenance
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; the tank this appurtenance is mounted on"
      - name: host_shell_course_id
        type: string
        source: input
        description: "FK -> ShellCourse.id; the course the penetration or attachment lands on; must belong to tank_id (ERR_CROSS_TANK_REFERENCE)"
      - name: appurtenance_type
        type: enum
        source: input
        description: Kind of appurtenance being installed.
        constraints: "one of {NOZZLE, MANWAY, STAIRWAY, MIXER, ROOF_VENT}"
      - name: nominal_size_in
        type: number
        source: input
        description: Nominal size in inches; selects the required angular clearance tier.
        constraints: "> 0"
      - name: elevation_ft
        type: number
        source: input
        description: Centerline elevation above the tank bottom in feet.
        constraints: ">= 0"
      - name: azimuth_deg
        type: number
        source: input
        description: Circumferential position in degrees measured clockwise from north.
        constraints: ">= 0 and < 360"
      - name: reinforcement_required
        type: boolean
        source: input
        description: Whether a reinforcing pad is required by the design.
        default: false
      - name: required_clearance_deg
        type: number
        source: computed
        description: Minimum angular separation this appurtenance demands from any other on the same course, selected from nominal_size_in tiers.
      - name: status
        type: enum
        source: computed
        description: DESIGNED until installed - see state_machines.Appurtenance.
        default: DESIGNED
        constraints: "one of {DESIGNED, INSTALLED}"
      - name: installed_at_utc
        type: datetime
        source: input
        description: Installation instant; defaults to the logical clock's current_utc when omitted. Null while DESIGNED.
        default: null

  - name: CommissioningPackage
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; at most one CommissioningPackage per Tank (ERR_SINGLETON_EXISTS)"
      - name: required_document_types
        type: array
        source: computed
        description: Fixed list of the four document types every package must carry (see calculations.commissioning_document_completeness constants).
      - name: submitted_document_types
        type: array
        source: computed
        description: Document types recorded so far, in the order they were added.
      - name: missing_document_types
        type: array
        source: computed
        description: required_document_types minus submitted_document_types, preserving the required order.
      - name: document_count
        type: integer
        source: computed
        description: Number of document records attached.
        default: 0
      - name: deficiency_count
        type: integer
        source: computed
        description: Number of times the package has been returned for correction, by inspector review or by cascade.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Branching / cyclic review lifecycle - see state_machines.CommissioningPackage.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED_FOR_CORRECTION, ACCEPTED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectEngineer who submitted the package; null while DRAFT.
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorizedInspector who last reviewed the package; null before first review.
        default: null
      - name: bottom_remaining_life_years
        type: number
        source: computed
        description: Remaining bottom life in years, 2 decimal places; computed at acceptance only.
        default: null
      - name: internal_inspection_interval_years
        type: integer
        source: computed
        description: In-service internal inspection interval in whole years, capped at MAX_INTERNAL_INTERVAL_YEARS; computed at acceptance only.
        default: null
      - name: external_inspection_interval_years
        type: integer
        source: computed
        description: In-service external inspection interval in whole years; depends on whether an EXTERNAL_COATING application passed.
        default: null
      - name: next_internal_due_utc
        type: datetime
        source: computed
        description: accepted_at_utc plus internal_inspection_interval_years; cleared to null whenever the package leaves ACCEPTED or is returned.
        default: null
      - name: next_external_due_utc
        type: datetime
        source: computed
        description: accepted_at_utc plus external_inspection_interval_years; cleared to null whenever the package is returned.
        default: null
      - name: accepted_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant the package was accepted; null unless status == ACCEPTED.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Tank, dimension 1 of 2: physical build progress -----------------------
  - entity: Tank
    state_field: construction_phase
    initial_state: DESIGN_REGISTERED
    terminal_states: [COMMISSIONED]
    note: |
      Dimension 1 of Tank's two independent state dimensions. It advances only
      through foundation acceptance, operator phase-transitions, hydrotest
      completion and commissioning review, and it reverts on quality events.
      It is orthogonal to quality_posture: a tank can be SHELL_COMPLETE and
      FROZEN, or ERECTION_IN_PROGRESS and OPEN, in any combination.
    transitions:
      - from: DESIGN_REGISTERED
        to: FOUNDATION_ACCEPTED
        trigger: "POST /foundation-packages/{foundation_package_id}/acceptance with decision ACCEPT"
        actor: system
        preconditions:
          - "FoundationPackage.tank_id == this Tank.id"
          - "FoundationPackage.status == BASELINE_SET"
        side_effects:
          - "Tank.construction_phase = FOUNDATION_ACCEPTED"
          - "Tank.version += 1; Tank.updated_at refreshed"
      - from: FOUNDATION_ACCEPTED
        to: ERECTION_IN_PROGRESS
        trigger: "POST /shell-courses/{shell_course_id}/fitup (first successful fitup on any of this tank's courses)"
        actor: system
        preconditions:
          - "ShellCourse.tank_id == this Tank.id"
          - "ShellCourse.thickness_verdict == ADEQUATE"
        side_effects:
          - "Tank.construction_phase = ERECTION_IN_PROGRESS"
          - "Tank.version += 1"
      - from: ERECTION_IN_PROGRESS
        to: SHELL_COMPLETE
        trigger: "POST /tanks/{tank_id}/phase-transitions with target_phase SHELL_COMPLETE"
        actor: ProjectEngineer
        preconditions:
          - "count of ShellCourse rows with tank_id == Tank.id is >= 1"
          - "every ShellCourse row with tank_id == Tank.id has status == RT_ACCEPTED"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "Tank.construction_phase = SHELL_COMPLETE"
          - "Tank.version += 1"
      - from: SHELL_COMPLETE
        to: ERECTION_IN_PROGRESS
        trigger: "system revert - any ShellCourse of this tank leaves status RT_ACCEPTED (re-examination scheduled, or a seam rejected)"
        actor: system
        preconditions:
          - "Tank.construction_phase == SHELL_COMPLETE"
        side_effects:
          - "Tank.construction_phase = ERECTION_IN_PROGRESS"
          - "Tank.version += 1"
        note: "Hop 2 of the re-examination cascade; independent of the quality_posture hop."
      - from: SHELL_COMPLETE
        to: HYDROTEST_PASSED
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/completion with decision PASS"
        actor: system
        preconditions:
          - "HydrotestPlan.tank_id == this Tank.id and HydrotestPlan.status == FILL_HOLD"
        side_effects:
          - "Tank.construction_phase = HYDROTEST_PASSED"
          - "Tank.version += 1"
      - from: HYDROTEST_PASSED
        to: COATED
        trigger: "system - the last CoatingApplication of the tank reaches ACCEPTED on POST /coating-applications/{coating_application_id}/holiday-test with holidays_found 0"
        actor: system
        preconditions:
          - "count of CoatingApplication rows with tank_id == Tank.id is >= 1"
          - "every CoatingApplication row with tank_id == Tank.id has status == ACCEPTED"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "Tank.construction_phase = COATED"
          - "Tank.version += 1"
      - from: COATED
        to: HYDROTEST_PASSED
        trigger: "system revert - a CoatingApplication of this tank enters REWORK_REQUIRED"
        actor: system
        preconditions:
          - "Tank.construction_phase == COATED"
        side_effects:
          - "Tank.construction_phase = HYDROTEST_PASSED"
          - "Tank.version += 1"
        note: "Hop 2 of the coating-rework cascade."
      - from: COATED
        to: COMMISSIONED
        trigger: "POST /commissioning-packages/{commissioning_package_id}/review with decision ACCEPT"
        actor: system
        preconditions:
          - "CommissioningPackage.tank_id == this Tank.id and CommissioningPackage.status == SUBMITTED"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "Tank.construction_phase = COMMISSIONED (terminal)"
          - "Tank.version += 1"

  # --- Tank, dimension 2 of 2: derived quality posture ----------------------
  - entity: Tank
    state_field: quality_posture
    initial_state: OPEN
    terminal_states: []
    note: |
      Dimension 2 of Tank's two independent state dimensions. Never set by a
      request field: it is recomputed by calculations.tank_quality_posture at the
      end of every request that can change open_nonconformance_count, and it
      gates child operations regardless of construction_phase.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system - open_nonconformance_count recomputed into 1..2"
        actor: system
        preconditions:
          - "1 <= Tank.open_nonconformance_count <= 2"
        side_effects:
          - "Tank.quality_posture = RESTRICTED"
          - "every HydrotestPlan of this tank with status IN {APPROVED, FILLING, FILL_HOLD} records state_before_suspension and moves to SUSPENDED"
          - "Tank.version += 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system - open_nonconformance_count recomputed to >= 3"
        actor: system
        preconditions:
          - "Tank.open_nonconformance_count >= 3"
        side_effects:
          - "Tank.quality_posture = FROZEN"
          - "Tank.version += 1"
      - from: OPEN
        to: FROZEN
        trigger: "system - open_nonconformance_count jumps from 0 to >= 3 within one request"
        actor: system
        preconditions:
          - "Tank.open_nonconformance_count >= 3"
        side_effects:
          - "Tank.quality_posture = FROZEN"
          - "every HydrotestPlan of this tank with status IN {APPROVED, FILLING, FILL_HOLD} records state_before_suspension and moves to SUSPENDED"
          - "Tank.version += 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system - open_nonconformance_count recomputed back into 1..2"
        actor: system
        preconditions:
          - "1 <= Tank.open_nonconformance_count <= 2"
        side_effects:
          - "Tank.quality_posture = RESTRICTED"
          - "Tank.version += 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system - open_nonconformance_count recomputed to 0"
        actor: system
        preconditions:
          - "Tank.open_nonconformance_count == 0"
        side_effects:
          - "Tank.quality_posture = OPEN"
          - "every HydrotestPlan of this tank with status == SUSPENDED returns to its state_before_suspension, and state_before_suspension and suspension_reason are cleared to null"
          - "Tank.version += 1"
      - from: FROZEN
        to: OPEN
        trigger: "system - open_nonconformance_count recomputed to 0 in one step"
        actor: system
        preconditions:
          - "Tank.open_nonconformance_count == 0"
        side_effects:
          - "Tank.quality_posture = OPEN"
          - "every HydrotestPlan of this tank with status == SUSPENDED returns to its state_before_suspension, and state_before_suspension and suspension_reason are cleared to null"
          - "Tank.version += 1"

  # --- FoundationPackage: branching accept/reject with a rework loop --------
  - entity: FoundationPackage
    initial_state: PLANNED
    terminal_states: [ACCEPTED]
    transitions:
      - from: PLANNED
        to: BASELINE_SET
        trigger: "POST /settlement-surveys with fill_percent 0 for this package"
        actor: system
        preconditions:
          - "FoundationPackage.baseline_survey_id IS NULL"
          - "len(point_readings) == FoundationPackage.monitoring_point_count"
        side_effects:
          - "SettlementSurvey.survey_role = BASELINE and SettlementSurvey.verdict = BASELINE"
          - "FoundationPackage.baseline_survey_id = the new survey's id"
          - "FoundationPackage.status = BASELINE_SET"
      - from: BASELINE_SET
        to: ACCEPTED
        trigger: "POST /foundation-packages/{foundation_package_id}/acceptance with decision ACCEPT"
        actor: ProjectEngineer
        preconditions:
          - "FoundationPackage.status == BASELINE_SET"
          - "Tank.quality_posture != FROZEN"
        side_effects:
          - "FoundationPackage.status = ACCEPTED; decided_by_user_id and decided_at_utc stamped"
          - "Tank.construction_phase DESIGN_REGISTERED -> FOUNDATION_ACCEPTED"
        note: "ACCEPT branch: advances the tank phase. Divergent from the REJECT branch below."
      - from: BASELINE_SET
        to: REJECTED
        trigger: "POST /foundation-packages/{foundation_package_id}/acceptance with decision REJECT"
        actor: ProjectEngineer
        preconditions:
          - "FoundationPackage.status == BASELINE_SET"
          - "Tank.quality_posture != FROZEN"
        side_effects:
          - "FoundationPackage.status = REJECTED; decided_by_user_id, decided_at_utc and decision_remarks stamped"
          - "Tank.construction_phase unchanged (stays DESIGN_REGISTERED)"
          - "FoundationPackage.baseline_survey_id cleared to null so a fresh baseline can be shot"
        note: "REJECT branch: no phase advance and the baseline pointer is cleared - a strictly different side-effect set from ACCEPT."
      - from: REJECTED
        to: BASELINE_SET
        trigger: "POST /settlement-surveys with fill_percent 0 for this package (re-shot baseline after civil rework)"
        actor: system
        preconditions:
          - "FoundationPackage.status == REJECTED"
          - "FoundationPackage.baseline_survey_id IS NULL"
        side_effects:
          - "FoundationPackage.baseline_survey_id = the new survey's id"
          - "FoundationPackage.status = BASELINE_SET"
        note: "Revision loop back into the decision node."

  # --- PlateLot: procurement / rolling / shipment with a quarantine branch ---
  - entity: PlateLot
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: ROLLED
        trigger: "POST /plate-lots/{plate_lot_id}/status-transitions with target_status ROLLED"
        actor: ErectionSuperintendent
        preconditions: ["PlateLot.status == ORDERED"]
        side_effects: ["PlateLot.status = ROLLED"]
      - from: ROLLED
        to: SHIPPED
        trigger: "POST /plate-lots/{plate_lot_id}/status-transitions with target_status SHIPPED"
        actor: ErectionSuperintendent
        preconditions: ["PlateLot.status == ROLLED"]
        side_effects: ["PlateLot.status = SHIPPED"]
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /plate-lots/{plate_lot_id}/status-transitions with target_status RECEIVED and mtr_number present"
        actor: ErectionSuperintendent
        preconditions:
          - "PlateLot.status == SHIPPED"
          - "mtr_number is present in the request body"
        side_effects:
          - "PlateLot.mtr_number stored"
          - "PlateLot.received_weight_lb = plate_count * plate_weight_lb"
          - "PlateLot.remaining_weight_lb = received_weight_lb (allocated_weight_lb is still 0.0)"
          - "Tank.steel_received_lb recomputed by calculations.plate_steel_ledger"
          - "PlateLot.status = RECEIVED"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /plate-lots/{plate_lot_id}/status-transitions with target_status QUARANTINED and quarantine reason in remarks"
        actor: ErectionSuperintendent
        preconditions:
          - "PlateLot.status == RECEIVED"
          - "PlateLot.allocated_weight_lb == 0.0"
        side_effects:
          - "PlateLot.status = QUARANTINED; quarantine_reason stored from remarks"
        note: "Quarantine blocks allocations; received_weight_lb is NOT rolled back, so Tank.steel_received_lb is unchanged."
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /plate-lots/{plate_lot_id}/status-transitions with target_status RELEASED and mtr_number present"
        actor: ErectionSuperintendent
        preconditions:
          - "PlateLot.status == QUARANTINED"
          - "mtr_number is present in the request body"
        side_effects:
          - "PlateLot.mtr_number overwritten with the corrected report number"
          - "PlateLot.status = RELEASED"
      - from: RECEIVED
        to: RELEASED
        trigger: "POST /plate-lots/{plate_lot_id}/status-transitions with target_status RELEASED"
        actor: ErectionSuperintendent
        preconditions:
          - "PlateLot.status == RECEIVED"
          - "PlateLot.mtr_number IS NOT NULL"
        side_effects:
          - "PlateLot.status = RELEASED"

  # --- ShellCourse: compound status derived from its WeldSeam children ------
  - entity: ShellCourse
    initial_state: SPECIFIED
    terminal_states: []
    note: |
      Once fitted up, status is a pure function of the course's WeldSeam rows and
      is re-derived on every seam status change (bubble-up):
        RT_ACCEPTED  when the course has >= 1 seam and every seam is RT_ACCEPTED
        WELDED       when every seam is in {WELDED, EXAM_SCHEDULED, RT_ACCEPTED}
                     and at least one seam is not RT_ACCEPTED
        FITTED       otherwise (any seam in {FIT_READY, RT_REJECTED,
                     REPAIR_IN_PROGRESS, REPLACEMENT_REQUIRED}, or no seams yet)
    transitions:
      - from: SPECIFIED
        to: FITTED
        trigger: "POST /shell-courses/{shell_course_id}/fitup"
        actor: ErectionSuperintendent
        preconditions:
          - "ShellCourse.status == SPECIFIED"
          - "ShellCourse.thickness_verdict == ADEQUATE"
          - "Tank.construction_phase IN {FOUNDATION_ACCEPTED, ERECTION_IN_PROGRESS}"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "ShellCourse.status = FITTED; fitup_at_utc stamped from the logical clock"
          - "Tank.construction_phase FOUNDATION_ACCEPTED -> ERECTION_IN_PROGRESS on the first fitup"
      - from: FITTED
        to: WELDED
        trigger: "system re-derivation after POST /weld-seams/{weld_seam_id}/weld-log"
        actor: system
        preconditions:
          - "every WeldSeam of this course is in {WELDED, EXAM_SCHEDULED, RT_ACCEPTED} and at least one is not RT_ACCEPTED"
        side_effects: ["ShellCourse.status = WELDED"]
      - from: WELDED
        to: RT_ACCEPTED
        trigger: "system re-derivation after POST /nde-reports/{nde_report_id}/result with decision ACCEPT"
        actor: system
        preconditions:
          - "count of WeldSeam rows for this course >= 1"
          - "every WeldSeam of this course has status == RT_ACCEPTED"
        side_effects:
          - "ShellCourse.status = RT_ACCEPTED"
      - from: RT_ACCEPTED
        to: WELDED
        trigger: "system re-derivation after POST /nde-reports (re-examination scheduled on an already accepted seam)"
        actor: system
        preconditions:
          - "at least one WeldSeam of this course is EXAM_SCHEDULED and none is in {FIT_READY, RT_REJECTED, REPAIR_IN_PROGRESS, REPLACEMENT_REQUIRED}"
        side_effects:
          - "ShellCourse.status = WELDED"
          - "Tank.construction_phase SHELL_COMPLETE -> ERECTION_IN_PROGRESS if it was SHELL_COMPLETE"
        note: "Hop 2 of the re-examination cascade."
      - from: RT_ACCEPTED
        to: FITTED
        trigger: "system re-derivation after POST /nde-reports/{nde_report_id}/result with decision REJECT"
        actor: system
        preconditions:
          - "at least one WeldSeam of this course is in {RT_REJECTED, REPAIR_IN_PROGRESS, REPLACEMENT_REQUIRED}"
        side_effects:
          - "ShellCourse.status = FITTED"
          - "Tank.construction_phase SHELL_COMPLETE -> ERECTION_IN_PROGRESS if it was SHELL_COMPLETE"
      - from: WELDED
        to: FITTED
        trigger: "system re-derivation after POST /nde-reports/{nde_report_id}/result with decision REJECT"
        actor: system
        preconditions:
          - "at least one WeldSeam of this course is in {RT_REJECTED, REPAIR_IN_PROGRESS, REPLACEMENT_REQUIRED}"
        side_effects: ["ShellCourse.status = FITTED"]

  # --- WeldSeam: cyclic weld / examine / repair loop with a hard cycle cap ---
  - entity: WeldSeam
    initial_state: FIT_READY
    terminal_states: [REPLACEMENT_REQUIRED]
    transitions:
      - from: FIT_READY
        to: WELDED
        trigger: "POST /weld-seams/{weld_seam_id}/weld-log"
        actor: Welder
        preconditions:
          - "WeldSeam.status == FIT_READY"
          - "ShellCourse.status IN {FITTED, WELDED}"
          - "Welder.qualification_status == QUALIFIED (cross-entity gate)"
          - "ShellCourse.plate_thickness_in <= min(Welder.welder_qualified_thickness_max_in, Welder.wps_qualified_thickness_max_in)"
          - "WeldSeam.predecessor_seam_id IS NULL OR predecessor WeldSeam.status == RT_ACCEPTED"
          - "Tank.quality_posture != FROZEN"
        side_effects:
          - "WeldSeam.status = WELDED; welder_id and filler_lot recorded; welded_at_utc stamped from the logical clock"
          - "ShellCourse.status re-derived (FITTED -> WELDED when every sibling seam is welded or better)"
      - from: WELDED
        to: EXAM_SCHEDULED
        trigger: "POST /nde-reports for this seam"
        actor: system
        preconditions:
          - "WeldSeam.status IN {WELDED, RT_ACCEPTED}"
          - "no NdeReport for this seam has status == SCHEDULED"
        side_effects:
          - "WeldSeam.status = EXAM_SCHEDULED; last_nde_report_id = the new report's id"
      - from: RT_ACCEPTED
        to: EXAM_SCHEDULED
        trigger: "POST /nde-reports for this seam (additional examination mandated by an escalated required_examination_pct)"
        actor: system
        preconditions:
          - "WeldSeam.status == RT_ACCEPTED"
          - "no NdeReport for this seam has status == SCHEDULED"
        side_effects:
          - "WeldSeam.status = EXAM_SCHEDULED; last_nde_report_id = the new report's id"
          - "ShellCourse.status RT_ACCEPTED -> WELDED (hop 2), which reverts Tank.construction_phase SHELL_COMPLETE -> ERECTION_IN_PROGRESS (hop 3)"
        note: "Re-entry into the examination loop from an accepted seam."
      - from: EXAM_SCHEDULED
        to: RT_ACCEPTED
        trigger: "POST /nde-reports/{nde_report_id}/result with decision ACCEPT"
        actor: system
        preconditions:
          - "NdeReport.status == SCHEDULED and NdeReport.weld_seam_id == this seam"
        side_effects:
          - "WeldSeam.status = RT_ACCEPTED"
          - "ShellCourse.status re-derived (WELDED -> RT_ACCEPTED when every sibling seam is accepted)"
          - "Tank.weld_reject_rate and Tank.required_examination_pct recomputed by calculations.weld_reject_rate_escalation"
          - "Tank.open_nonconformance_count and quality_posture recomputed by calculations.tank_quality_posture"
      - from: EXAM_SCHEDULED
        to: RT_REJECTED
        trigger: "POST /nde-reports/{nde_report_id}/result with decision REJECT while WeldSeam.repair_cycle_count < MAX_REPAIR_CYCLES"
        actor: system
        preconditions:
          - "NdeReport.status == SCHEDULED and NdeReport.weld_seam_id == this seam"
          - "WeldSeam.repair_cycle_count < 2"
        side_effects:
          - "WeldSeam.status = RT_REJECTED (cascade link 1)"
          - "Tank.open_nonconformance_count += 1 for this newly open REPORTED_REJECT, so quality_posture is recomputed (cascade link 2)"
          - "a RESTRICTED or FROZEN posture suspends every HydrotestPlan of this tank in {APPROVED, FILLING, FILL_HOLD} (cascade link 3)"
          - "each suspended plan cancels its RESERVED WaterWithdrawal rows with cancellation_reason 'PLAN_SUSPENDED' (cascade link 4)"
          - "each cancelled withdrawal releases its reserved_volume_gal back into WaterSource.available_volume_gal (cascade link 5)"
          - "ShellCourse.status re-derived to FITTED; Tank.construction_phase reverts SHELL_COMPLETE -> ERECTION_IN_PROGRESS when it was SHELL_COMPLETE"
          - "Tank.weld_reject_rate and Tank.required_examination_pct recomputed"
      - from: EXAM_SCHEDULED
        to: REPLACEMENT_REQUIRED
        trigger: "POST /nde-reports/{nde_report_id}/result with decision REJECT while WeldSeam.repair_cycle_count == MAX_REPAIR_CYCLES"
        actor: system
        preconditions:
          - "NdeReport.status == SCHEDULED and NdeReport.weld_seam_id == this seam"
          - "WeldSeam.repair_cycle_count >= 2"
        side_effects:
          - "WeldSeam.status = REPLACEMENT_REQUIRED (terminal - the plate must be cut out and replaced)"
          - "the same posture / suspension / withdrawal-release cascade as the RT_REJECTED branch"
        note: "Termination condition of the repair cycle."
      - from: RT_REJECTED
        to: REPAIR_IN_PROGRESS
        trigger: "POST /weld-seams/{weld_seam_id}/repair-start"
        actor: ErectionSuperintendent
        preconditions:
          - "WeldSeam.status == RT_REJECTED"
        side_effects:
          - "WeldSeam.status = REPAIR_IN_PROGRESS"
      - from: REPAIR_IN_PROGRESS
        to: WELDED
        trigger: "POST /weld-seams/{weld_seam_id}/weld-log (re-weld after excavation)"
        actor: Welder
        preconditions:
          - "WeldSeam.status == REPAIR_IN_PROGRESS"
          - "Welder.qualification_status == QUALIFIED"
          - "ShellCourse.plate_thickness_in <= min(Welder.welder_qualified_thickness_max_in, Welder.wps_qualified_thickness_max_in)"
          - "Tank.quality_posture != FROZEN"
        side_effects:
          - "WeldSeam.status = WELDED; repair_cycle_count += 1; welder_id, filler_lot and welded_at_utc overwritten"
          - "the seam's open REPORTED_REJECT nonconformance stays open until a new examination is accepted"
        note: "Closes the cycle FIT_READY -> WELDED -> EXAM_SCHEDULED -> RT_REJECTED -> REPAIR_IN_PROGRESS -> WELDED."

  # --- NdeReport: radiography / examination record --------------------------
  - entity: NdeReport
    initial_state: SCHEDULED
    terminal_states: [REPORTED_ACCEPT, VOIDED]
    transitions:
      - from: SCHEDULED
        to: REPORTED_ACCEPT
        trigger: "POST /nde-reports/{nde_report_id}/result with decision ACCEPT"
        actor: QcInspector
        preconditions:
          - "NdeReport.status == SCHEDULED"
          - "the acting X-User-ID is NOT equal to Welder.qualified_by_user_id of the seam's welder (segregation of duties)"
          - "indication_count == 0 when decision is ACCEPT"
        side_effects:
          - "NdeReport.status = REPORTED_ACCEPT; reported_at_utc stamped from the logical clock"
          - "WeldSeam.status EXAM_SCHEDULED -> RT_ACCEPTED"
          - "any earlier open REPORTED_REJECT report for the same seam is closed (nonconformance_open = false)"
          - "Tank.weld_reject_rate, required_examination_pct, open_nonconformance_count and quality_posture recomputed"
      - from: SCHEDULED
        to: REPORTED_REJECT
        trigger: "POST /nde-reports/{nde_report_id}/result with decision REJECT"
        actor: QcInspector
        preconditions:
          - "NdeReport.status == SCHEDULED"
          - "the acting X-User-ID is NOT equal to Welder.qualified_by_user_id of the seam's welder"
          - "indication_count >= 1 when decision is REJECT"
        side_effects:
          - "NdeReport.status = REPORTED_REJECT; nonconformance_open = true; reported_at_utc stamped"
          - "WeldSeam.status -> RT_REJECTED, or -> REPLACEMENT_REQUIRED when repair_cycle_count is already at the cap"
          - "the full five-hop posture / suspension / withdrawal-release cascade fires"
      - from: REPORTED_REJECT
        to: VOIDED
        trigger: "POST /nde-reports/{nde_report_id}/void"
        actor: AuthorizedInspector
        preconditions:
          - "NdeReport.status == REPORTED_REJECT"
          - "NdeReport.nonconformance_open == true"
          - "WeldSeam.status == RT_REJECTED (a repair must not have started yet)"
        side_effects:
          - "NdeReport.status = VOIDED; nonconformance_open = false; void_reason stored"
          - "WeldSeam.status RT_REJECTED -> WELDED (the erroneous rejection is undone, repair_cycle_count is NOT incremented)"
          - "Tank.open_nonconformance_count decremented and quality_posture recomputed - a return to OPEN restores every SUSPENDED HydrotestPlan of the tank to APPROVED"
          - "Tank.weld_reject_rate and required_examination_pct recomputed with this report excluded from the examined population"
        note: "Compensating transition - every side effect of the REPORTED_REJECT hop is reversed with no drift."
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /nde-reports/{nde_report_id}/void"
        actor: AuthorizedInspector
        preconditions:
          - "NdeReport.status == SCHEDULED"
        side_effects:
          - "NdeReport.status = VOIDED; void_reason stored"
          - "WeldSeam.status EXAM_SCHEDULED -> WELDED (or -> RT_ACCEPTED when the seam had been accepted before this re-examination was scheduled)"
          - "ShellCourse.status re-derived"

  # --- Welder: qualification continuity, renewal and revocation ----------
  - entity: Welder
    initial_state: QUALIFIED
    terminal_states: [REVOKED]
    note: |
      A Welder row is created already QUALIFIED: POST /welders carries the witnessed
      qualification_date_utc, and the acting AuthorizedInspector is recorded in
      qualified_by_user_id (which later bars that same user from reporting NDE results
      on this welder's seams). last_weld_date_utc starts at qualification_date_utc and
      continuity_expires_at_utc = last_weld_date_utc + continuity_limit_days.
    transitions:
      - from: QUALIFIED
        to: LAPSED
        trigger: "system re-evaluation on any read or write that consults Welder.qualification_status, when the logical clock is strictly after continuity_expires_at_utc"
        actor: system
        preconditions:
          - "Welder.qualification_status == QUALIFIED"
          - "current_utc > Welder.continuity_expires_at_utc"
        side_effects:
          - "Welder.qualification_status = LAPSED"
        note: "Boundary: exactly AT continuity_expires_at_utc the welder is still QUALIFIED; one second later the status is LAPSED."
      - from: LAPSED
        to: QUALIFIED
        trigger: "POST /welders/{welder_id}/qualification-actions with action RENEW"
        actor: AuthorizedInspector
        preconditions:
          - "Welder.qualification_status == LAPSED"
        side_effects:
          - "Welder.qualification_status = QUALIFIED"
          - "Welder.last_weld_date_utc = effective_date_utc when supplied, otherwise the logical clock"
          - "Welder.continuity_expires_at_utc = last_weld_date_utc + Welder.continuity_limit_days"
          - "Welder.qualification_date_utc is NOT changed - the original performance-test date is preserved"
      - from: QUALIFIED
        to: QUALIFIED
        trigger: "POST /weld-seams/{weld_seam_id}/weld-log - production welding refreshes continuity"
        actor: system
        preconditions:
          - "Welder.qualification_status == QUALIFIED"
        side_effects:
          - "Welder.last_weld_date_utc = the seam's welded_at_utc"
          - "Welder.continuity_expires_at_utc = last_weld_date_utc + Welder.continuity_limit_days"
        note: "Decay reset: the continuity curve restarts from every accepted production weld."
      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /welders/{welder_id}/qualification-actions with action REVOKE"
        actor: AuthorizedInspector
        preconditions:
          - "Welder.qualification_status == QUALIFIED"
        side_effects:
          - "Welder.qualification_status = REVOKED (terminal); revoked_at_utc stamped from the logical clock"
          - "seams already welded by this welder keep their status - revocation is not retroactive"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /welders/{welder_id}/qualification-actions with action REVOKE"
        actor: AuthorizedInspector
        preconditions:
          - "Welder.qualification_status == LAPSED"
        side_effects:
          - "Welder.qualification_status = REVOKED (terminal); revoked_at_utc stamped from the logical clock"

  # --- HydrotestPlan: approval, staged filling, suspension, supersession ----
  - entity: HydrotestPlan
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/approval with decision APPROVE"
        actor: ProjectEngineer
        preconditions:
          - "HydrotestPlan.status == DRAFT"
          - "Tank.construction_phase == SHELL_COMPLETE"
          - "Tank.quality_posture == OPEN"
          - "WaterSource.permit_expiry_utc >= current_utc"
        side_effects:
          - "HydrotestPlan.status = APPROVED"
          - "HydrotestPlan.approved_by_user_id = the acting X-User-ID (this user is then barred from recording the completion decision)"
          - "Tank.active_hydrotest_plan_id = this plan's id"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/approval with decision REJECT"
        actor: ProjectEngineer
        preconditions:
          - "HydrotestPlan.status == DRAFT"
        side_effects:
          - "HydrotestPlan.status = REJECTED"
          - "every RESERVED WaterWithdrawal of this plan is cancelled with cancellation_reason 'PLAN_REJECTED' and its reserved volume is returned to the WaterSource"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /hydrotest-plans for the same tank with a matching expected_tank_version"
        actor: system
        preconditions:
          - "HydrotestPlan.status IN {DRAFT, REJECTED}"
        side_effects:
          - "the older plan's status = SUPERSEDED (terminal)"
          - "the new plan's previous_plan_id points at the superseded plan"
          - "Tank.version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /hydrotest-plans for the same tank with a matching expected_tank_version"
        actor: system
        preconditions:
          - "HydrotestPlan.status == DRAFT"
        side_effects:
          - "the older plan's status = SUPERSEDED (terminal); its RESERVED withdrawals are cancelled and their volume released"
          - "the new plan's previous_plan_id points at the superseded plan"
          - "Tank.version += 1"
      - from: APPROVED
        to: FILLING
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance with 0 < target_fill_percent < 100"
        actor: ErectionSuperintendent
        preconditions:
          - "HydrotestPlan.status == APPROVED"
          - "target_fill_percent > HydrotestPlan.fill_percent_current"
          - "Tank.quality_posture == OPEN"
          - "a settlement_survey_id is supplied whose fill_percent equals target_fill_percent and whose verdict is WITHIN_TOLERANCE, for every target_fill_percent that is a mandatory hold point (25, 50, 75, 100)"
        side_effects:
          - "HydrotestPlan.status = FILLING; fill_percent_current = target_fill_percent"
          - "HydrotestPlan.settlement_survey_count += 1 when a survey is supplied"
      - from: FILLING
        to: FILLING
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance with a strictly higher target_fill_percent below 100"
        actor: ErectionSuperintendent
        preconditions:
          - "HydrotestPlan.status == FILLING"
          - "target_fill_percent > HydrotestPlan.fill_percent_current"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "HydrotestPlan.fill_percent_current = target_fill_percent"
          - "HydrotestPlan.settlement_survey_count += 1 when a survey is supplied"
      - from: FILLING
        to: FILL_HOLD
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance with target_fill_percent 100"
        actor: ErectionSuperintendent
        preconditions:
          - "HydrotestPlan.status == FILLING"
          - "target_fill_percent == 100"
          - "a settlement_survey_id at fill_percent 100 with verdict WITHIN_TOLERANCE is supplied"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "HydrotestPlan.status = FILL_HOLD; fill_percent_current = 100; hold_started_at_utc stamped from the logical clock"
          - "HydrotestPlan.settlement_survey_count += 1"
      - from: FILL_HOLD
        to: PASSED
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/completion with decision PASS"
        actor: AuthorizedInspector
        preconditions:
          - "HydrotestPlan.status == FILL_HOLD"
          - "current_utc >= hold_started_at_utc + HydrotestPlan.hold_hours"
          - "the acting X-User-ID is NOT equal to HydrotestPlan.approved_by_user_id (segregation of duties)"
          - "HydrotestPlan.settlement_survey_count >= 4"
        side_effects:
          - "HydrotestPlan.status = PASSED (terminal); completed_at_utc stamped"
          - "Tank.construction_phase SHELL_COMPLETE -> HYDROTEST_PASSED"
          - "HydrotestPlan.water_cost_usd, disposal_cost_usd, subtotal_usd, permit_surcharge_pct, surcharge_usd and total_cost_usd are frozen from calculations.hydrotest_water_and_disposal_cost"
      - from: FILL_HOLD
        to: FAILED
        trigger: "POST /hydrotest-plans/{hydrotest_plan_id}/completion with decision FAIL"
        actor: AuthorizedInspector
        preconditions:
          - "HydrotestPlan.status == FILL_HOLD"
          - "the acting X-User-ID is NOT equal to HydrotestPlan.approved_by_user_id"
        side_effects:
          - "HydrotestPlan.status = FAILED (terminal); completed_at_utc stamped"
          - "Tank.quality_posture -> RESTRICTED (a failed hydrotest counts as one open nonconformance)"
          - "Tank.active_hydrotest_plan_id = null"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system reaction to Tank.quality_posture leaving OPEN"
        actor: system
        preconditions:
          - "HydrotestPlan.status IN {APPROVED, FILLING, FILL_HOLD}"
          - "Tank.quality_posture IN {RESTRICTED, FROZEN}"
        side_effects:
          - "HydrotestPlan.status = SUSPENDED; state_before_suspension records APPROVED / FILLING / FILL_HOLD"
          - "fill_percent_current and hold_started_at_utc are preserved"
          - "every RESERVED WaterWithdrawal of this plan is cancelled with cancellation_reason 'PLAN_SUSPENDED' and its reserved volume is returned to the WaterSource"
      - from: FILLING
        to: SUSPENDED
        trigger: "system reaction to Tank.quality_posture leaving OPEN"
        actor: system
        preconditions:
          - "HydrotestPlan.status == FILLING"
          - "Tank.quality_posture IN {RESTRICTED, FROZEN}"
        side_effects:
          - "HydrotestPlan.status = SUSPENDED; state_before_suspension = FILLING; fill_percent_current preserved"
          - "its RESERVED withdrawals are cancelled and their volume released"
      - from: FILL_HOLD
        to: SUSPENDED
        trigger: "system reaction to Tank.quality_posture leaving OPEN"
        actor: system
        preconditions:
          - "HydrotestPlan.status == FILL_HOLD"
          - "Tank.quality_posture IN {RESTRICTED, FROZEN}"
        side_effects:
          - "HydrotestPlan.status = SUSPENDED; state_before_suspension = FILL_HOLD; hold_started_at_utc preserved so the hold clock is not restarted"
          - "its RESERVED withdrawals are cancelled and their volume released"
      - from: SUSPENDED
        to: APPROVED
        trigger: "system reaction to Tank.quality_posture returning to OPEN"
        actor: system
        preconditions:
          - "HydrotestPlan.status == SUSPENDED"
          - "Tank.quality_posture == OPEN"
          - "HydrotestPlan.state_before_suspension == APPROVED"
        side_effects:
          - "HydrotestPlan.status = APPROVED; state_before_suspension = null"
          - "cancelled withdrawals are NOT re-created - they must be re-reserved explicitly"
        note: "Compensation is partial by design: the plan is restored but water reservations are not."
      - from: SUSPENDED
        to: FILLING
        trigger: "system reaction to Tank.quality_posture returning to OPEN"
        actor: system
        preconditions:
          - "HydrotestPlan.status == SUSPENDED"
          - "Tank.quality_posture == OPEN"
          - "HydrotestPlan.state_before_suspension == FILLING"
        side_effects:
          - "HydrotestPlan.status = FILLING; state_before_suspension = null; fill_percent_current unchanged"
      - from: SUSPENDED
        to: FILL_HOLD
        trigger: "system reaction to Tank.quality_posture returning to OPEN"
        actor: system
        preconditions:
          - "HydrotestPlan.status == SUSPENDED"
          - "Tank.quality_posture == OPEN"
          - "HydrotestPlan.state_before_suspension == FILL_HOLD"
        side_effects:
          - "HydrotestPlan.status = FILL_HOLD; state_before_suspension = null; hold_started_at_utc unchanged"

  # --- WaterWithdrawal: reservation against a permitted source -------------
  - entity: WaterWithdrawal
    initial_state: RESERVED
    terminal_states: [CANCELLED]
    transitions:
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /water-withdrawals/{water_withdrawal_id}/cancellation"
        actor: ErectionSuperintendent
        preconditions:
          - "WaterWithdrawal.status == RESERVED"
        side_effects:
          - "WaterWithdrawal.status = CANCELLED; cancellation_reason stored from reason"
          - "WaterSource.reserved_volume_gal -= reserved_volume_gal and available_volume_gal += reserved_volume_gal"
          - "the cancelled window no longer participates in rate-overlap or permitted-volume checks"
          - "the plan's cost fields are recomputed by calculations.hydrotest_water_and_disposal_cost with this withdrawal excluded"
      - from: RESERVED
        to: CANCELLED
        trigger: "system cascade when the owning HydrotestPlan becomes SUSPENDED, REJECTED or SUPERSEDED"
        actor: system
        preconditions:
          - "WaterWithdrawal.status == RESERVED"
        side_effects:
          - "WaterWithdrawal.status = CANCELLED; cancellation_reason = PLAN_SUSPENDED / PLAN_REJECTED / PLAN_SUPERSEDED"
          - "WaterSource volume ledger released exactly as in the manual cancellation"
        note: "Conditional cascade: only RESERVED withdrawals are touched; already CANCELLED rows are skipped."
      - from: RESERVED
        to: CONSUMED
        trigger: "system cascade when the owning HydrotestPlan reaches PASSED or FAILED"
        actor: system
        preconditions:
          - "WaterWithdrawal.status == RESERVED"
          - "HydrotestPlan.status IN {PASSED, FAILED}"
        side_effects:
          - "WaterWithdrawal.status = CONSUMED"
          - "WaterSource.reserved_volume_gal -= reserved_volume_gal and WaterSource.consumed_volume_gal += reserved_volume_gal"
          - "WaterSource.available_volume_gal is unchanged - consumption converts a reservation into a permanent draw against the permit"
        note: "Ledger sync: permitted_volume_gal = available_volume_gal + reserved_volume_gal + consumed_volume_gal must hold after every hop."

  # --- CoatingApplication: prep, DFT, holiday test, rework loop ------------
  - entity: CoatingApplication
    initial_state: SPEC_ISSUED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SPEC_ISSUED
        to: PREP_ACCEPTED
        trigger: "POST /coating-applications/{coating_application_id}/surface-prep"
        actor: QcInspector
        preconditions:
          - "CoatingApplication.status == SPEC_ISSUED"
          - "achieved_prep_standard is at least as clean as specified_prep_standard on the ordering SSPC_SP3 < SSPC_SP6 < SSPC_SP10 < SSPC_SP5"
          - "dew_point_spread_f >= 5.0"
          - "Tank.quality_posture != FROZEN"
        side_effects:
          - "CoatingApplication.status = PREP_ACCEPTED; achieved_prep_standard, profile_mils and dew_point_spread_f stored"
      - from: PREP_ACCEPTED
        to: DFT_RECORDED
        trigger: "POST /coating-applications/{coating_application_id}/dft-readings"
        actor: QcInspector
        preconditions:
          - "CoatingApplication.status == PREP_ACCEPTED"
          - "spot_readings contains at least one spot and every spot contains exactly three gauge readings"
        side_effects:
          - "spot_count, computed_spot_average_min_mils, computed_spot_average_max_mils, computed_overall_average_mils and computed_min_gauge_reading_mils are recomputed from scratch over the submitted spots"
          - "dft_verdict = PASS or FAIL per calculations.coating_dft_acceptance using this application's dft_acceptance_method"
          - "CoatingApplication.status = DFT_RECORDED"
        note: "Readings replace, not accumulate - a second call from DFT_RECORDED is rejected, so the only way to re-measure is through the rework loop."
      - from: DFT_RECORDED
        to: ACCEPTED
        trigger: "POST /coating-applications/{coating_application_id}/holiday-test with holidays_found 0"
        actor: QcInspector
        preconditions:
          - "CoatingApplication.status == DFT_RECORDED"
          - "CoatingApplication.dft_verdict == PASS"
          - "holidays_found == 0"
          - "test_voltage_v >= 67.5 * specified_min_dft_mils for an INTERNAL_LINING scope; no voltage floor for EXTERNAL_COATING"
        side_effects:
          - "CoatingApplication.status = ACCEPTED (terminal); holidays_found and holiday_test_voltage_v stored"
          - "Tank.construction_phase HYDROTEST_PASSED -> COATED once every CoatingApplication of the tank is ACCEPTED"
      - from: DFT_RECORDED
        to: REWORK_REQUIRED
        trigger: "POST /coating-applications/{coating_application_id}/holiday-test with holidays_found >= 1"
        actor: QcInspector
        preconditions:
          - "CoatingApplication.status == DFT_RECORDED"
        side_effects:
          - "CoatingApplication.status = REWORK_REQUIRED; holidays_found and holiday_test_voltage_v stored (cascade link 1)"
          - "Tank.quality_posture recomputed - an open coating rework counts as one nonconformance, so a previously OPEN tank becomes RESTRICTED (cascade link 2)"
          - "Tank.construction_phase COATED -> HYDROTEST_PASSED when the tank had already been marked COATED (cascade link 3)"
          - "any SUBMITTED CommissioningPackage of the tank is returned: status = RETURNED_FOR_CORRECTION, deficiency_count += 1, and next_internal_due_utc / next_external_due_utc are cleared (cascade link 4)"
      - from: REWORK_REQUIRED
        to: PREP_ACCEPTED
        trigger: "POST /coating-applications/{coating_application_id}/surface-prep (re-preparation of the reworked area)"
        actor: QcInspector
        preconditions:
          - "CoatingApplication.status == REWORK_REQUIRED"
          - "achieved_prep_standard is at least as clean as specified_prep_standard"
          - "dew_point_spread_f >= 5.0"
        side_effects:
          - "CoatingApplication.status = PREP_ACCEPTED; rework_cycle_count += 1"
          - "dft_verdict reset to NOT_EVALUATED and every computed DFT aggregate reset to 0.0 / spot_count to 0"
          - "holidays_found and holiday_test_voltage_v reset to null"
          - "Tank.quality_posture recomputed - the coating nonconformance closes as soon as the rework re-enters preparation"
        note: "Closes the cycle SPEC_ISSUED -> PREP_ACCEPTED -> DFT_RECORDED -> REWORK_REQUIRED -> PREP_ACCEPTED; rework_cycle_count is uncapped."

  # --- Appurtenance: nozzles, manways, stairs, mixers ---------------------
  - entity: Appurtenance
    initial_state: DESIGNED
    terminal_states: [INSTALLED]
    transitions:
      - from: DESIGNED
        to: INSTALLED
        trigger: "POST /appurtenances/{appurtenance_id}/installation"
        actor: ErectionSuperintendent
        preconditions:
          - "Appurtenance.status == DESIGNED"
          - "the host ShellCourse.status == RT_ACCEPTED"
          - "the host ShellCourse.tank_id == Appurtenance.tank_id"
          - "Tank.quality_posture != FROZEN"
          - "no other Appurtenance of the same tank is already INSTALLED within required_clearance_deg of this azimuth on the same course"
        side_effects:
          - "Appurtenance.status = INSTALLED; installed_at_utc = the supplied instant, otherwise the logical clock"
        note: "Guarded transition - the gate is the state of a different entity (the host shell course)."

  # --- CommissioningPackage: documentation, review, inspection scheduling --
  - entity: CommissioningPackage
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /commissioning-packages/{commissioning_package_id}/submission"
        actor: ProjectEngineer
        preconditions:
          - "CommissioningPackage.status == DRAFT"
          - "missing_document_types is empty"
          - "Tank.construction_phase == COATED"
          - "Tank.quality_posture == OPEN"
          - "every Appurtenance of the tank is INSTALLED"
        side_effects:
          - "CommissioningPackage.status = SUBMITTED; submitted_by_user_id = the acting X-User-ID"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /commissioning-packages/{commissioning_package_id}/review with decision ACCEPT"
        actor: AuthorizedInspector
        preconditions:
          - "CommissioningPackage.status == SUBMITTED"
          - "the acting X-User-ID is NOT equal to CommissioningPackage.submitted_by_user_id"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "CommissioningPackage.status = ACCEPTED (terminal); reviewed_by_user_id = the acting X-User-ID; accepted_at_utc stamped from the logical clock"
          - "bottom_remaining_life_years, internal_inspection_interval_years, external_inspection_interval_years, next_internal_due_utc and next_external_due_utc are all set by calculations.in_service_inspection_schedule"
          - "Tank.construction_phase COATED -> COMMISSIONED (terminal phase)"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /commissioning-packages/{commissioning_package_id}/review with decision RETURN"
        actor: AuthorizedInspector
        preconditions:
          - "CommissioningPackage.status == SUBMITTED"
          - "the acting X-User-ID is NOT equal to CommissioningPackage.submitted_by_user_id"
        side_effects:
          - "CommissioningPackage.status = RETURNED_FOR_CORRECTION; deficiency_count += 1; reviewed_by_user_id = the acting X-User-ID"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "system cascade when a holiday test on any CoatingApplication of the tank finds holidays"
        actor: system
        preconditions:
          - "CommissioningPackage.status == SUBMITTED"
        side_effects:
          - "CommissioningPackage.status = RETURNED_FOR_CORRECTION; deficiency_count += 1"
          - "next_internal_due_utc and next_external_due_utc cleared to null; reviewed_by_user_id is NOT set because no inspector acted"
        note: "Hop 4 of the coating-rework cascade."
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /commissioning-packages/{commissioning_package_id}/submission (re-submission after correction)"
        actor: ProjectEngineer
        preconditions:
          - "CommissioningPackage.status == RETURNED_FOR_CORRECTION"
          - "missing_document_types is empty"
          - "Tank.construction_phase == COATED"
          - "Tank.quality_posture == OPEN"
        side_effects:
          - "CommissioningPackage.status = SUBMITTED; submitted_by_user_id overwritten with the acting X-User-ID; deficiency_count is NOT reset"
        note: "Closes the review cycle DRAFT -> SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED."

  # --- SettlementSurvey: nonconformance dimension only --------------------
  - entity: SettlementSurvey
    state_field: nonconformance_state
    initial_state: NOT_APPLICABLE
    terminal_states: [CLOSED_BY_SUPERSEDING_SURVEY]
    note: |
      A survey row is immutable once created; only its nonconformance_state moves.
      A BASELINE survey and a WITHIN_TOLERANCE monitoring survey are NOT_APPLICABLE;
      an OUT_OF_TOLERANCE monitoring survey opens a nonconformance that counts toward
      Tank.open_nonconformance_count until a later survey at the same or higher
      fill_percent supersedes it.
    transitions:
      - from: NOT_APPLICABLE
        to: OPEN
        trigger: "POST /settlement-surveys whose computed verdict is OUT_OF_TOLERANCE"
        actor: system
        preconditions:
          - "SettlementSurvey.survey_role == MONITORING"
          - "SettlementSurvey.verdict == OUT_OF_TOLERANCE"
        side_effects:
          - "SettlementSurvey.nonconformance_state = OPEN"
          - "Tank.open_nonconformance_count += 1 and quality_posture recomputed, which suspends the tank's live HydrotestPlan and releases its water reservations"
      - from: OPEN
        to: CLOSED_BY_SUPERSEDING_SURVEY
        trigger: "POST /settlement-surveys for the same foundation package whose verdict is WITHIN_TOLERANCE and whose fill_percent >= the open survey's fill_percent"
        actor: system
        preconditions:
          - "the earlier SettlementSurvey.nonconformance_state == OPEN"
          - "the new survey's verdict == WITHIN_TOLERANCE"
          - "the new survey's fill_percent >= the earlier survey's fill_percent"
        side_effects:
          - "the earlier survey's nonconformance_state = CLOSED_BY_SUPERSEDING_SURVEY and superseded_by_survey_id = the new survey's id"
          - "Tank.open_nonconformance_count decremented and quality_posture recomputed - a return to OPEN restores every SUSPENDED HydrotestPlan to its state_before_suspension"
        note: "Compensation: the posture change and the plan suspension are both undone, but cancelled WaterWithdrawal rows are not resurrected."

# =============================================================================
# 1.2.1 CONCURRENCY RULES (OCC on the parent entity's version - nothing else)
# =============================================================================
concurrency_rules:
  - rule_id: hydrotest-plan-supersede-stale-tank
    parent_entity: Tank
    write_endpoint: "POST /hydrotest-plans"
    occ_field: "expected_tank_version"
    description: |
      Creating a HydrotestPlan for a Tank whose version has advanced past the
      value the client last observed is rejected with a stale-version error.
      A new plan legitimately supersedes the tank's prior DRAFT or REJECTED
      plan and re-points Tank.active_hydrotest_plan_id, so a writer working
      from an outdated view of the tank would silently discard a plan it never
      saw. The OCC check on Tank.version reduces that to a deterministic
      precondition: the create succeeds only when the submitted
      expected_tank_version equals the tank's current version, and every
      successful create advances Tank.version by 1 so any further create
      still carrying the old value fails.
    error_id: ERR_STALE_TANK_VERSION
    http_status: 412

  - rule_id: withdrawal-reserve-stale-water-source
    parent_entity: WaterSource
    write_endpoint: "POST /water-withdrawals"
    occ_field: "expected_water_source_version"
    description: |
      Reserving a withdrawal window against a WaterSource whose version has
      advanced past the value the client last observed is rejected with a
      stale-version error. Each reservation consumes part of the source's
      available_volume_gal and part of its max_concurrent_rate_gpm envelope,
      so a writer holding an outdated view of the source would size its
      reservation against capacity that has already been committed. The OCC
      check on WaterSource.version turns that into a deterministic
      precondition, and every accepted reservation advances
      WaterSource.version by 1.
    error_id: ERR_STALE_WATER_SOURCE_VERSION
    http_status: 412

# =============================================================================
# 1.3 CALCULATION RULES
# =============================================================================
calculations:
  - name: shell_course_required_thickness
    trigger: "On POST /shell-courses, and re-evaluated whenever the course's elevation stack changes because a lower course is added."
    algorithm: threshold
    formula: |
      # Course geometry: courses stack bottom-up in course_number order.
      course_bottom_elevation_ft = SUM(course_width_ft of every ShellCourse of the
                                       same tank with a lower course_number)
      design_liquid_height_ft    = Tank.design_liquid_level_ft - course_bottom_elevation_ft

      # One-foot method, evaluated one foot above the bottom of the course.
      H = design_liquid_height_ft
      D = Tank.diameter_ft
      required_thickness_design_in = 2.6 * (H - 1) * D * Tank.product_specific_gravity
                                     / (allowable_stress_design_psi * Tank.joint_efficiency)
                                     + Tank.corrosion_allowance_in
      required_thickness_test_in   = 2.6 * (H - 1) * D
                                     / (allowable_stress_test_psi * Tank.joint_efficiency)
      # NOTE: the corrosion allowance is added to the DESIGN case only, never to the TEST case.

      # Minimum nominal thickness floor, selected on shell diameter.
      min_nominal_thickness_in = MIN_NOMINAL_BY_DIAMETER(Tank.diameter_ft)

      required_thickness_in = MAX(required_thickness_design_in,
                                  required_thickness_test_in,
                                  min_nominal_thickness_in)
      governing_case = DESIGN      when required_thickness_in == required_thickness_design_in
                       TEST        when required_thickness_in == required_thickness_test_in
                       MIN_NOMINAL when required_thickness_in == min_nominal_thickness_in
      # Tie-break order is exactly DESIGN, then TEST, then MIN_NOMINAL.

      thickness_verdict = ADEQUATE  when plate_thickness_in >= required_thickness_in
                          DEFICIENT otherwise
    input_set: "The ShellCourse being created plus every existing ShellCourse of the same tank with a lower course_number (for the elevation stack). Courses of other tanks never contribute."
    constants:
      ONE_FOOT_METHOD_COEFFICIENT: 2.6
      MIN_NOMINAL_BY_DIAMETER: "diameter_ft < 50 -> 0.188; 50 <= diameter_ft < 120 -> 0.250; 120 <= diameter_ft < 200 -> 0.313; diameter_ft >= 200 -> 0.375"
    precision: "3 decimal places, round_half_up, applied to each of required_thickness_design_in, required_thickness_test_in and required_thickness_in independently before the MAX and the comparison"

  - name: settlement_tolerance_envelope
    trigger: "On POST /foundation-packages."
    algorithm: aggregation
    formula: |
      point_spacing_in       = PI * Tank.diameter_ft * 12 / monitoring_point_count
      allowable_differential_in = permitted_differential_ratio * point_spacing_in
    input_set: "The FoundationPackage being created and its parent Tank only."
    constants:
      PI: 3.141592653589793
      INCHES_PER_FOOT: 12
    precision: "point_spacing_in to 4 decimal places, allowable_differential_in to 3 decimal places, both round_half_up"

  - name: differential_settlement_evaluation
    trigger: "On POST /settlement-surveys, once per survey; the result is frozen on the survey row."
    algorithm: weighted_scoring
    formula: |
      # point_readings is an array of {point_index, elevation_in}; point_index runs
      # 1..monitoring_point_count clockwise around the tank and readings are always
      # processed in point_index order, never in submission order.
      # The reference elevations come from the FoundationPackage's baseline survey
      # (FoundationPackage.baseline_survey_id), matched point_index to point_index.
      i = point_index - 1                       # zero-based position around the shell
      settlement_i (inches) = baseline_survey.elevation_in[point_index]
                              - this_survey.elevation_in[point_index]
      # On the baseline survey itself every settlement_i is 0.000 by definition.

      uniform_settlement_in = MEAN(settlement_i)

      # Discrete one-term Fourier (cosine) best fit around the shell:
      theta_i = 2 * PI * point_index / N
      b = (2 / N) * SUM(settlement_i * COS(theta_i))
      c = (2 / N) * SUM(settlement_i * SIN(theta_i))
      predicted_i = uniform_settlement_in + b * COS(theta_i) + c * SIN(theta_i)
      max_out_of_plane_in = MAX(ABS(settlement_i - predicted_i))

      # Adjacent-pair metric, evaluated circularly so the last point is compared
      # against the first:
      max_adjacent_differential_in = MAX(ABS(settlement_i - settlement_((i+1) mod N)))

      governing_metric_in = the metric selected by the variant below

      survey_role = BASELINE   when FoundationPackage.baseline_survey_id IS NULL
                    MONITORING otherwise
      verdict = BASELINE           when survey_role == BASELINE
                WITHIN_TOLERANCE   when governing_metric_in <= allowable_differential_in
                                    AND uniform_settlement_in <= permitted_uniform_settlement_in
                OUT_OF_TOLERANCE   otherwise
      # Both comparisons are inclusive: exactly AT the allowable value is WITHIN_TOLERANCE.
    input_set: "The point_readings array of the survey being created, the elevations of the FoundationPackage's baseline survey, and the tolerance envelope of that FoundationPackage. No intermediate monitoring survey is consulted - every round is measured against the original baseline, never against the previous round."
    constants:
      PI: 3.141592653589793
      INCHES_PER_FOOT: 12
    precision: "all settlement metrics to 3 decimal places, round_half_up; rounding is applied to uniform_settlement_in, max_out_of_plane_in and max_adjacent_differential_in after the full-precision computation, and the rounded governing_metric_in is what is compared against allowable_differential_in"
    variants:
      - name: COSINE_BEST_FIT
        when: "FoundationPackage.settlement_evaluation_method == COSINE_BEST_FIT"
        difference: "governing_metric_in = max_out_of_plane_in. Smooth ovalling of the shell is treated as acceptable rigid-body distortion, so a settlement pattern that follows a cosine curve exactly scores 0.000 no matter how large the point-to-point steps are."
      - name: ADJACENT_PAIR
        when: "FoundationPackage.settlement_evaluation_method == ADJACENT_PAIR"
        difference: "governing_metric_in = max_adjacent_differential_in. Every point-to-point step is charged in full, so the same readings that a cosine fit accepts can exceed the envelope. Both metrics are always stored on the survey row; only the governing one drives the verdict."

  - name: coating_dft_acceptance
    trigger: "On POST /coating-applications/{coating_application_id}/dft-readings."
    algorithm: threshold
    formula: |
      # spot_readings is an array of spots, each spot an array of exactly
      # GAUGE_READINGS_PER_SPOT individual gauge readings in mils.
      spot_count = COUNT(spot_readings)
      spot_average_j = MEAN(gauge readings of spot j)
      computed_spot_average_min_mils = MIN(spot_average_j)
      computed_spot_average_max_mils = MAX(spot_average_j)
      computed_overall_average_mils  = MEAN(every individual gauge reading across every spot)
      computed_min_gauge_reading_mils = MIN(every individual gauge reading)
      dft_verdict = PASS or FAIL per the variant below
    input_set: "Only the spot_readings payload of this call. Readings from a previous cycle are discarded when the application re-enters PREP_ACCEPTED, so the aggregates are always a full recompute, never an incremental update."
    constants:
      GAUGE_READINGS_PER_SPOT: 3
      SPOT_LOWER_FACTOR: 0.80
      SPOT_UPPER_FACTOR: 1.20
    precision: "2 decimal places, round_half_up on each spot average and on the overall average; the rounded values are the ones compared against the factored limits"
    variants:
      - name: SPOT_AVERAGE_80_120
        when: "CoatingApplication.dft_acceptance_method == SPOT_AVERAGE_80_120"
        difference: |
          PASS requires ALL THREE of:
            every spot_average_j >= 0.80 * specified_min_dft_mils
            every spot_average_j <= 1.20 * specified_min_dft_mils
            computed_overall_average_mils >= specified_min_dft_mils
          Individual gauge readings below spec are tolerated as long as their spot
          average holds up. All comparisons are inclusive at the limit.
      - name: INDIVIDUAL_GAUGE_MIN
        when: "CoatingApplication.dft_acceptance_method == INDIVIDUAL_GAUGE_MIN"
        difference: |
          PASS requires BOTH of:
            computed_min_gauge_reading_mils >= specified_min_dft_mils
            computed_overall_average_mils   >= specified_min_dft_mils
          No individual reading may fall below spec, so identical readings can FAIL
          here and PASS under SPOT_AVERAGE_80_120. The 0.80 / 1.20 factors are not
          applied at all under this method.

  - name: hydrotest_water_and_disposal_cost
    trigger: "On every POST /water-withdrawals, on every POST /water-withdrawals/{water_withdrawal_id}/cancellation, and frozen onto the plan when the plan reaches PASSED."
    algorithm: tiered_pricing
    formula: |
      # Per-withdrawal water cost is rounded at the withdrawal, and the plan's
      # water_cost_usd is the SUM OF ROUNDED per-withdrawal costs - never the
      # rounding of a summed volume.
      FOR each WaterWithdrawal w of the plan with status IN {RESERVED, CONSUMED},
          processed in created_at order:
        w.withdrawal_cost_usd = ROUND(w.reserved_volume_gal / 1000
                                      * WaterSource.water_cost_usd_per_kgal, 2)
      water_cost_usd = SUM(w.withdrawal_cost_usd)

      # Disposal is priced once, on the plan's aggregate volume, against a
      # volume-tiered multiplier selected on total kgal.
      total_kgal = SUM(w.reserved_volume_gal of the same input set) / 1000
      disposal_multiplier = DISPOSAL_TIER(total_kgal)
      disposal_cost_usd = ROUND(total_kgal
                                * WaterSource.disposal_cost_usd_per_kgal
                                * disposal_multiplier, 2)

      subtotal_usd = water_cost_usd + disposal_cost_usd
    input_set: "Every WaterWithdrawal of this HydrotestPlan whose status is RESERVED or CONSUMED, in created_at order. CANCELLED withdrawals are excluded entirely, so a cancellation lowers both cost components and can move the disposal tier and the surcharge tier."
    constants:
      GALLONS_PER_KGAL: 1000
      DISPOSAL_TIER: "total_kgal <= 500 -> 1.00; 500 < total_kgal <= 2000 -> 0.85; total_kgal > 2000 -> 0.70"
    precision: "2 decimal places, round_half_up. Rounding order is load-bearing: each withdrawal is rounded first and the rounded amounts are summed, so the result can differ by cents from rounding a single summed volume."

  - name: hydrotest_permit_surcharge
    trigger: "Immediately after hydrotest_water_and_disposal_cost, on the same writes."
    algorithm: threshold
    formula: |
      permit_surcharge_pct = SURCHARGE_TIER(subtotal_usd)
      surcharge_usd  = ROUND(subtotal_usd * permit_surcharge_pct, 2)
      total_cost_usd = subtotal_usd + surcharge_usd
    input_set: "The plan's own subtotal_usd only. The tier is selected on the SUBTOTAL, never on total_cost_usd, so the surcharge is not compounded."
    constants:
      SURCHARGE_TIER: "subtotal_usd < 1000.00 -> 0.00; 1000.00 <= subtotal_usd < 2000.00 -> 0.03; subtotal_usd >= 2000.00 -> 0.05"
    precision: "2 decimal places, round_half_up; permit_surcharge_pct is stored exactly as the tier constant (2 decimal places)"

  - name: weld_reject_rate_escalation
    trigger: "On every POST /nde-reports/{nde_report_id}/result and on every POST /nde-reports/{nde_report_id}/void."
    algorithm: threshold
    formula: |
      examined_count = COUNT(NdeReport r WHERE r.method == RT
                                          AND r.status IN {REPORTED_ACCEPT, REPORTED_REJECT}
                                          AND r's seam belongs to this tank)
      reject_count   = COUNT(the same set WHERE r.status == REPORTED_REJECT)
      weld_reject_rate = 0.0 when examined_count == 0
                         else reject_count / examined_count
      required_examination_pct = EXAMINATION_TIER(weld_reject_rate)
    input_set: "Only RT reports that have actually been reported. SCHEDULED reports are not yet examined and VOIDED reports leave the population entirely, so voiding a rejection can pull the rate back below a tier boundary and de-escalate required_examination_pct."
    constants:
      EXAMINATION_TIER: "weld_reject_rate >= 0.50 -> 100.0; 0.25 <= weld_reject_rate < 0.50 -> 50.0; weld_reject_rate < 0.25 -> 10.0"
      BASE_EXAMINATION_PCT: 10.0
    precision: "weld_reject_rate to 4 decimal places, round_half_up; required_examination_pct to 1 decimal place. The rounded rate is what is compared against the tier boundaries, and the boundaries are inclusive from below (a rate of exactly 0.2500 escalates to 50.0)."

  - name: tank_quality_posture
    trigger: "After every write that can open or close a nonconformance: NDE result, NDE void, settlement survey creation, coating holiday test, coating re-preparation, and hydrotest completion."
    algorithm: constraint_propagation
    formula: |
      open_nonconformance_count =
          COUNT(NdeReport WHERE nonconformance_open == true AND its seam belongs to this tank)
        + COUNT(SettlementSurvey WHERE nonconformance_state == OPEN
                                  AND its FoundationPackage belongs to this tank)
        + COUNT(CoatingApplication WHERE tank_id == this tank AND status == REWORK_REQUIRED)
        + COUNT(HydrotestPlan WHERE tank_id == this tank AND status == FAILED)

      quality_posture = OPEN       when open_nonconformance_count == 0
                        RESTRICTED when 1 <= open_nonconformance_count <= 2
                        FROZEN     when open_nonconformance_count >= 3

      # The posture change then propagates, in this fixed order, until it reaches a
      # fixed point (the propagation is at most one pass - suspending a plan cannot
      # itself open or close a nonconformance):
      #   1. posture leaves OPEN  -> every HydrotestPlan of the tank in
      #      {APPROVED, FILLING, FILL_HOLD} becomes SUSPENDED, recording
      #      state_before_suspension
      #   2. each newly SUSPENDED plan cancels its RESERVED WaterWithdrawal rows in
      #      created_at order, each releasing reserved_volume_gal back to its WaterSource
      #   3. posture returns to OPEN -> every SUSPENDED HydrotestPlan of the tank is
      #      restored to its state_before_suspension; cancelled withdrawals stay cancelled
    input_set: "Every open nonconformance carrier of the tank, counted across four different entity types. A single write can change more than one carrier, and the count is always a full recompute, never an increment."
    constants:
      RESTRICTED_LOWER_BOUND: 1
      FROZEN_LOWER_BOUND: 3
    precision: "integer count; no rounding"

  - name: plate_steel_ledger
    trigger: "On POST /plate-lots/{plate_lot_id}/status-transitions reaching RECEIVED, on POST /plate-lots/{plate_lot_id}/allocations, and on POST /shell-courses/{shell_course_id}/allocation-release."
    algorithm: aggregation
    formula: |
      PlateLot.received_weight_lb  = plate_count * plate_weight_lb   (set once, at RECEIVED)
      PlateLot.allocated_weight_lb = SUM(allocated_weight_lb of every ShellCourse whose
                                         allocated_plate_lot_id == this lot
                                         AND allocation_status == ALLOCATED)
      PlateLot.remaining_weight_lb = received_weight_lb - allocated_weight_lb
      Tank.steel_received_lb  = SUM(received_weight_lb of every PlateLot of the tank
                                    with status IN {RECEIVED, RELEASED, QUARANTINED})
      Tank.steel_allocated_lb = SUM(allocated_weight_lb of every PlateLot of the tank)
      # Conservation invariant that must hold after every one of the three writes:
      #   Tank.steel_received_lb - Tank.steel_allocated_lb
      #     == SUM(remaining_weight_lb of every PlateLot of the tank)
    input_set: "Every PlateLot of the tank that has been received (including quarantined lots, whose steel is on site but unavailable), and every ShellCourse currently holding an allocation."
    constants:
      MIN_REMAINING_WEIGHT_LB: 0.0
    precision: "2 decimal places, round_half_up on every weight"

  - name: water_volume_ledger
    trigger: "On POST /water-withdrawals, on withdrawal cancellation (manual or cascaded), and on the CONSUMED cascade fired by plan completion."
    algorithm: aggregation
    formula: |
      WaterSource.reserved_volume_gal = SUM(reserved_volume_gal of every WaterWithdrawal
                                            against this source with status == RESERVED)
      WaterSource.consumed_volume_gal = SUM(reserved_volume_gal of every WaterWithdrawal
                                            against this source with status == CONSUMED)
      WaterSource.available_volume_gal = permitted_volume_gal
                                         - reserved_volume_gal
                                         - consumed_volume_gal
      # Conservation invariant after every hop:
      #   permitted_volume_gal == available_volume_gal + reserved_volume_gal
      #                                                + consumed_volume_gal
    input_set: "Every WaterWithdrawal against the source across ALL hydrotest plans and all tanks - the permit is a property of the source, not of one tank. CANCELLED withdrawals contribute to nothing."
    constants:
      MIN_AVAILABLE_VOLUME_GAL: 0.0
    precision: "2 decimal places, round_half_up"

  - name: commissioning_document_completeness
    trigger: "On POST /commissioning-packages, on POST /commissioning-packages/{commissioning_package_id}/documents, and re-evaluated at every submission attempt."
    algorithm: aggregation
    formula: |
      required_document_types  = REQUIRED_DOCUMENT_TYPES
      submitted_document_types = the DISTINCT document_type values recorded on this package,
                                 emitted in REQUIRED_DOCUMENT_TYPES order followed by any
                                 extra types in the order they were first recorded
      missing_document_types   = REQUIRED_DOCUMENT_TYPES minus submitted_document_types,
                                 preserving REQUIRED_DOCUMENT_TYPES order
      document_count           = total number of documents recorded (duplicates included)
    input_set: "Every document recorded against this package. A second document of a type already present raises document_count but never changes submitted_document_types or missing_document_types."
    constants:
      REQUIRED_DOCUMENT_TYPES: "[MILL_TEST_REPORTS, RT_FILM_LOG, HYDROTEST_RECORD, AS_BUILT_DRAWING]"
      OPTIONAL_DOCUMENT_TYPES: "[COATING_REPORT, SETTLEMENT_LOG]"
    precision: "integer counts; ordered arrays of enum values"

  - name: in_service_inspection_schedule
    trigger: "On POST /commissioning-packages/{commissioning_package_id}/review with decision ACCEPT."
    algorithm: decay_function
    formula: |
      bottom_remaining_life_years = (Tank.bottom_thickness_in
                                     - Tank.bottom_minimum_thickness_in)
                                    / Tank.assumed_corrosion_rate_ipy
      internal_inspection_interval_years = MIN(MAX_INTERNAL_INTERVAL_YEARS,
                                               FLOOR(bottom_remaining_life_years / 2))
      external_inspection_interval_years =
          EXTERNAL_INTERVAL_COATED_YEARS   when the tank has a CoatingApplication with
                                           scope == EXTERNAL_COATING and status == ACCEPTED
          EXTERNAL_INTERVAL_UNCOATED_YEARS otherwise
      next_internal_due_utc = accepted_at_utc + internal_inspection_interval_years years
      next_external_due_utc = accepted_at_utc + external_inspection_interval_years years
      # Calendar arithmetic is whole years on the same month and day-of-month.
    input_set: "The parent Tank's bottom-plate parameters plus the tank's CoatingApplication rows. Both due dates are anchored on accepted_at_utc, so re-acceptance after a returned package re-anchors the whole schedule."
    constants:
      MAX_INTERNAL_INTERVAL_YEARS: 20
      EXTERNAL_INTERVAL_COATED_YEARS: 5
      EXTERNAL_INTERVAL_UNCOATED_YEARS: 2
    precision: "bottom_remaining_life_years to 2 decimal places, round_half_up; both intervals are integers produced by FLOOR after that rounding"

  - name: appurtenance_clearance_envelope
    trigger: "On POST /appurtenances (to set required_clearance_deg) and re-checked on POST /appurtenances/{appurtenance_id}/installation."
    algorithm: interval_merge
    formula: |
      required_clearance_deg =
          MAX(NOZZLE_MIN_CLEARANCE_DEG, nominal_size_in * NOZZLE_CLEARANCE_FACTOR)
              when appurtenance_type IN {NOZZLE, MANWAY}
          STAIRWAY_CLEARANCE_DEG  when appurtenance_type == STAIRWAY
          MIXER_CLEARANCE_DEG     when appurtenance_type == MIXER
          ROOF_VENT_CLEARANCE_DEG when appurtenance_type == ROOF_VENT

      # Installation clash check, against every already INSTALLED appurtenance of the
      # same tank sharing the same host_shell_course_id:
      raw_gap_deg        = ABS(this.azimuth_deg - other.azimuth_deg)
      separation_deg     = MIN(raw_gap_deg, 360 - raw_gap_deg)
      required_deg       = MAX(this.required_clearance_deg, other.required_clearance_deg)
      clash when separation_deg < required_deg
      # Exactly AT required_deg the pair is acceptable - the envelope is closed.
    input_set: "Only appurtenances of the same tank AND the same host shell course whose status is already INSTALLED. DESIGNED neighbours never clash, so installation order decides which of two conflicting appurtenances is accepted."
    constants:
      NOZZLE_MIN_CLEARANCE_DEG: 8.0
      NOZZLE_CLEARANCE_FACTOR: 1.5
      STAIRWAY_CLEARANCE_DEG: 30.0
      MIXER_CLEARANCE_DEG: 20.0
      ROOF_VENT_CLEARANCE_DEG: 5.0
    precision: "1 decimal place, round_half_up on required_clearance_deg and separation_deg"

  - name: rt_examination_window_conflict
    trigger: "On POST /nde-reports."
    algorithm: interval_merge
    formula: |
      # Radiography excludes other trades from the shot area, so RT windows on one
      # tank may not overlap, and a fixed clearance buffer is applied on both sides.
      new_start  = window_start_utc - RT_BUFFER_MINUTES
      new_end    = window_end_utc + RT_BUFFER_MINUTES
      conflict when an existing NdeReport e of the SAME tank satisfies ALL of:
        e.method == RT AND new report's method == RT
        e.status IN {SCHEDULED, REPORTED_ACCEPT, REPORTED_REJECT}
        new_start <= e.window_end_utc AND e.window_start_utc <= new_end
      # Closed-interval comparison: buffered windows that merely touch DO conflict.
    input_set: "Every non-VOIDED RT report whose weld seam belongs to the same tank, across all shell courses. UT, MT, PT and VT reports never conflict with anything, and VOIDED reports free their window."
    constants:
      RT_BUFFER_MINUTES: 60
      RT_CONFLICTING_STATUSES: "[SCHEDULED, REPORTED_ACCEPT, REPORTED_REJECT]"
    precision: "whole minutes; instants are compared to the second"

  - name: withdrawal_rate_envelope
    trigger: "On POST /water-withdrawals."
    algorithm: interval_merge
    formula: |
      # Half-open windows: [window_start_utc, window_end_utc). A window that starts
      # exactly when another ends never overlaps.
      overlapping = every WaterWithdrawal w against the SAME WaterSource with
                    status == RESERVED and
                    w.window_start_utc < new.window_end_utc and
                    new.window_start_utc < w.window_end_utc
      peak_rate_gpm = new.rate_gpm + SUM(w.rate_gpm of overlapping)
      capacity conflict when peak_rate_gpm > WaterSource.max_concurrent_rate_gpm
      # Exactly AT max_concurrent_rate_gpm the reservation is accepted.
    input_set: "RESERVED withdrawals against the same water source only, spanning every hydrotest plan and every tank. CANCELLED and CONSUMED windows do not consume rate."
    constants:
      WINDOW_SEMANTICS: "half-open [start, end)"
    precision: "1 decimal place, round_half_up on peak_rate_gpm"

# =============================================================================
# 1.4 VALIDATION RULES (evaluated strictly in ascending priority order; the
#     FIRST rule whose condition is violated determines the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty. A blank string counts as absent."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND that role appears in the target endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When X-User-Role is Welder, the acting X-User-ID must equal the welder_id in the request body. A qualified welder may only log welds under their own stamp."
    error_id: ERR_WELDER_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /weld-seams/{weld_seam_id}/weld-log"

  - priority: 4
    category: existence
    check: |
      Every path parameter resolves to an existing row, validated left to right.
      Mapping from path segment to error: /tanks/{tank_id} -> ERR_TANK_NOT_FOUND;
      /foundation-packages/{foundation_package_id} -> ERR_FOUNDATION_PACKAGE_NOT_FOUND;
      /settlement-surveys/{settlement_survey_id} -> ERR_SETTLEMENT_SURVEY_NOT_FOUND;
      /plate-lots/{plate_lot_id} -> ERR_PLATE_LOT_NOT_FOUND;
      /shell-courses/{shell_course_id} -> ERR_SHELL_COURSE_NOT_FOUND;
      /welders/{welder_id} -> ERR_WELDER_NOT_FOUND;
      /weld-seams/{weld_seam_id} -> ERR_WELD_SEAM_NOT_FOUND;
      /nde-reports/{nde_report_id} -> ERR_NDE_REPORT_NOT_FOUND;
      /water-sources/{water_source_id} -> ERR_WATER_SOURCE_NOT_FOUND;
      /hydrotest-plans/{hydrotest_plan_id} -> ERR_HYDROTEST_PLAN_NOT_FOUND;
      /water-withdrawals/{water_withdrawal_id} -> ERR_WATER_WITHDRAWAL_NOT_FOUND;
      /coating-applications/{coating_application_id} -> ERR_COATING_APPLICATION_NOT_FOUND;
      /appurtenances/{appurtenance_id} -> ERR_APPURTENANCE_NOT_FOUND;
      /commissioning-packages/{commissioning_package_id} -> ERR_COMMISSIONING_PACKAGE_NOT_FOUND.
    error_id: ERR_TANK_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 5
    category: business_constraint
    check: |
      Request shape: every required input field is present; enum fields carry a declared
      value; numeric fields are numbers within their declared range (non-negative weights,
      volumes, rates and thicknesses; fill_percent in [0, 100]; coverage_pct in (0, 100];
      indication_count and film_count are non-negative integers); datetime fields parse as
      ISO-8601 UTC instants; array fields are non-empty (point_readings, spot_readings,
      qualified_positions) and every spot in spot_readings contains exactly three numeric
      gauge readings. Unknown fields are ignored.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to an existing row, validated in the field order declared by the endpoint's input list, using the same entity-to-error mapping as priority 4."
    error_id: ERR_TANK_NOT_FOUND
    http_status: 404
    applies_to: "every write endpoint whose input carries a foreign key"

  - priority: 7
    category: business_constraint
    check: "expected_tank_version equals the current Tank.version."
    error_id: ERR_STALE_TANK_VERSION
    http_status: 412
    applies_to: "POST /hydrotest-plans"

  - priority: 8
    category: business_constraint
    check: "expected_water_source_version equals the current WaterSource.version."
    error_id: ERR_STALE_WATER_SOURCE_VERSION
    http_status: 412
    applies_to: "POST /water-withdrawals"

  - priority: 9
    category: state
    check: "The requested Tank construction_phase transition is one of the operator-requestable rows of state_machines.Tank.construction_phase - in this domain only ERECTION_IN_PROGRESS -> SHELL_COMPLETE - it is declared from the tank's current phase, and its gate is satisfied (SHELL_COMPLETE requires at least one ShellCourse and every ShellCourse of the tank RT_ACCEPTED). Every system-driven target (FOUNDATION_ACCEPTED, ERECTION_IN_PROGRESS, HYDROTEST_PASSED, COATED, COMMISSIONED) and every undeclared enum-valid target is rejected with this id."
    error_id: ERR_PHASE_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /tanks/{tank_id}/phase-transitions"

  - priority: 10
    category: state
    check: "The FoundationPackage is in BASELINE_SET before an acceptance decision is recorded, and a baseline survey exists."
    error_id: ERR_FOUNDATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /foundation-packages/{foundation_package_id}/acceptance"

  - priority: 11
    category: state
    check: "The requested PlateLot target_status is reachable from the lot's current status per state_machines.PlateLot, and mtr_number is present for the RECEIVED and RELEASED transitions."
    error_id: ERR_PLATE_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /plate-lots/{plate_lot_id}/status-transitions"

  - priority: 12
    category: state
    check: "For an allocation, the PlateLot status is RECEIVED or RELEASED (a QUARANTINED lot may not be allocated) and the target ShellCourse allocation_status is UNALLOCATED. For a release, the ShellCourse allocation_status is ALLOCATED and the course status is still SPECIFIED."
    error_id: ERR_ALLOCATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /plate-lots/{plate_lot_id}/allocations, POST /shell-courses/{shell_course_id}/allocation-release"

  - priority: 13
    category: state
    check: "The ShellCourse status is SPECIFIED at fitup - a course already FITTED, WELDED or RT_ACCEPTED cannot be fitted up again."
    error_id: ERR_COURSE_STATE_INVALID
    http_status: 409
    applies_to: "POST /shell-courses/{shell_course_id}/fitup"

  - priority: 14
    category: state
    check: "The WeldSeam status is FIT_READY or REPAIR_IN_PROGRESS when a weld is logged, and the host ShellCourse status is FITTED or WELDED."
    error_id: ERR_SEAM_NOT_WELDABLE
    http_status: 409
    applies_to: "POST /weld-seams/{weld_seam_id}/weld-log"

  - priority: 15
    category: state
    check: "The WeldSeam status is RT_REJECTED when a repair is started."
    error_id: ERR_SEAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /weld-seams/{weld_seam_id}/repair-start"

  - priority: 16
    category: state
    check: "For a scheduled examination, the seam status is WELDED or RT_ACCEPTED and the seam has no other SCHEDULED report. For a result, the report status is SCHEDULED. For a void, the report status is SCHEDULED or REPORTED_REJECT with nonconformance_open true and the seam still RT_REJECTED."
    error_id: ERR_NDE_STATE_INVALID
    http_status: 409
    applies_to: "POST /nde-reports, POST /nde-reports/{nde_report_id}/result, POST /nde-reports/{nde_report_id}/void"

  - priority: 17
    category: state
    check: "The Welder qualification action is reachable from the current qualification_status: RENEW requires LAPSED, REVOKE requires QUALIFIED or LAPSED. A REVOKED welder is terminal."
    error_id: ERR_WELDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /welders/{welder_id}/qualification-actions"

  - priority: 18
    category: state
    check: "The HydrotestPlan is in the state the requested action expects: DRAFT for approval, APPROVED or FILLING for fill-advance, FILL_HOLD for completion. A SUSPENDED, SUPERSEDED, PASSED, FAILED or REJECTED plan accepts no further action. An approval additionally requires the parent Tank to be in construction_phase SHELL_COMPLETE; an approval requested at any other phase raises this same error (the tank-state gate and the plan-state gate share one error_id)."
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /hydrotest-plans/{hydrotest_plan_id}/approval, POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance, POST /hydrotest-plans/{hydrotest_plan_id}/completion"

  - priority: 19
    category: state
    check: "The WaterWithdrawal status is RESERVED when a cancellation is requested."
    error_id: ERR_WITHDRAWAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /water-withdrawals/{water_withdrawal_id}/cancellation"

  - priority: 20
    category: state
    check: "The CoatingApplication is in the state the requested step expects: SPEC_ISSUED or REWORK_REQUIRED for surface-prep, PREP_ACCEPTED for dft-readings, DFT_RECORDED for holiday-test. ACCEPTED is terminal."
    error_id: ERR_COATING_STEP_INVALID
    http_status: 409
    applies_to: "POST /coating-applications/{coating_application_id}/surface-prep, POST /coating-applications/{coating_application_id}/dft-readings, POST /coating-applications/{coating_application_id}/holiday-test"

  - priority: 21
    category: state
    check: "The Appurtenance status is DESIGNED when installation is recorded."
    error_id: ERR_APPURTENANCE_STATE_INVALID
    http_status: 409
    applies_to: "POST /appurtenances/{appurtenance_id}/installation"

  - priority: 22
    category: state
    check: "The CommissioningPackage is DRAFT or RETURNED_FOR_CORRECTION for a submission, and SUBMITTED for a review. Documents may only be recorded while the package is DRAFT or RETURNED_FOR_CORRECTION. A submission additionally requires the parent Tank to be in construction_phase COATED; a submission requested at any other phase raises this same error."
    error_id: ERR_PACKAGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /commissioning-packages/{commissioning_package_id}/documents, POST /commissioning-packages/{commissioning_package_id}/submission, POST /commissioning-packages/{commissioning_package_id}/review"

  - priority: 23
    category: business_safety
    check: "Tank.quality_posture is not FROZEN. A frozen tank accepts no production work at all: no fitup, no weld log, no allocation, no fill advance, no coating step, no appurtenance installation, no phase transition, no plan approval and no package submission. Only examination results, NDE voids, settlement surveys and welder qualification actions - the operations that can close a nonconformance - remain available."
    error_id: ERR_TANK_POSTURE_FROZEN
    http_status: 409
    applies_to: "every production write endpoint of a tank"

  - priority: 24
    category: business_safety
    check: "Tank.quality_posture is OPEN for operations that additionally require a clean tank: hydrotest plan approval, fill advance, commissioning submission and commissioning acceptance. RESTRICTED is sufficient for ordinary erection work but not for these."
    error_id: ERR_TANK_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /hydrotest-plans/{hydrotest_plan_id}/approval, POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance, POST /commissioning-packages/{commissioning_package_id}/submission, POST /commissioning-packages/{commissioning_package_id}/review"

  - priority: 25
    category: business_safety
    check: "The Welder logging the weld has qualification_status QUALIFIED after the continuity window is re-evaluated against the logical clock. A LAPSED or REVOKED welder may not weld."
    error_id: ERR_WELDER_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /weld-seams/{weld_seam_id}/weld-log"

  - priority: 26
    category: business_safety
    check: "The host ShellCourse plate_thickness_in is within BOTH the welder's welder_qualified_thickness_max_in and the procedure's wps_qualified_thickness_max_in. The binding limit is the smaller of the two, and the comparison is inclusive at the limit."
    error_id: ERR_THICKNESS_OUT_OF_QUALIFIED_RANGE
    http_status: 409
    applies_to: "POST /weld-seams/{weld_seam_id}/weld-log"

  - priority: 27
    category: business_safety
    check: "The achieved_prep_standard is at least as clean as specified_prep_standard on the ordering SSPC_SP3 < SSPC_SP6 < SSPC_SP10 < SSPC_SP5, inclusive at equality."
    error_id: ERR_SURFACE_PREP_DEFICIENT
    http_status: 409
    applies_to: "POST /coating-applications/{coating_application_id}/surface-prep"

  - priority: 28
    category: business_safety
    check: "dew_point_spread_f is at least 5.0 degrees Fahrenheit; exactly 5.0 is acceptable."
    error_id: ERR_DEW_POINT_SPREAD_INSUFFICIENT
    http_status: 409
    applies_to: "POST /coating-applications/{coating_application_id}/surface-prep"

  - priority: 29
    category: business_safety
    check: "For an INTERNAL_LINING scope, test_voltage_v is at least 67.5 * specified_min_dft_mils; exactly at the floor is acceptable. EXTERNAL_COATING has no voltage floor."
    error_id: ERR_HOLIDAY_TEST_VOLTAGE_LOW
    http_status: 409
    applies_to: "POST /coating-applications/{coating_application_id}/holiday-test"

  - priority: 30
    category: business_safety
    check: "A holiday test with holidays_found 0 may only be accepted when dft_verdict is PASS; a FAIL verdict must be reworked regardless of the holiday result."
    error_id: ERR_DFT_NOT_PASSED
    http_status: 409
    applies_to: "POST /coating-applications/{coating_application_id}/holiday-test"

  - priority: 31
    category: business_safety
    check: "The acting X-User-ID differs from the user recorded on the counterpart step: the NDE result reporter must not be the Welder's qualified_by_user_id, the hydrotest completion recorder must not be the plan's approved_by_user_id, and the commissioning reviewer must not be the package's submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nde-reports/{nde_report_id}/result, POST /hydrotest-plans/{hydrotest_plan_id}/completion, POST /commissioning-packages/{commissioning_package_id}/review"

  - priority: 32
    category: business_referential
    check: "Every entity referenced in one request belongs to the same Tank: a settlement survey's hydrotest_plan_id, an allocation's shell course, an appurtenance's host_shell_course_id, a weld seam's predecessor_seam_id and a hydrotest plan's tank must all agree with the tank the operation targets."
    error_id: ERR_CROSS_TANK_REFERENCE
    http_status: 409
    applies_to: "POST /settlement-surveys, POST /plate-lots/{plate_lot_id}/allocations, POST /appurtenances, POST /weld-seams"

  - priority: 33
    category: business_referential
    check: "The Tank has an ACCEPTED FoundationPackage before any shell course is fitted up or any weld is logged."
    error_id: ERR_FOUNDATION_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /shell-courses/{shell_course_id}/fitup, POST /weld-seams/{weld_seam_id}/weld-log"

  - priority: 34
    category: business_referential
    check: "The host ShellCourse status is RT_ACCEPTED before an appurtenance is installed on it."
    error_id: ERR_HOST_COURSE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /appurtenances/{appurtenance_id}/installation"

  - priority: 35
    category: business_referential
    check: "Every Appurtenance of the tank is INSTALLED before the commissioning package is submitted."
    error_id: ERR_APPURTENANCES_NOT_INSTALLED
    http_status: 409
    applies_to: "POST /commissioning-packages/{commissioning_package_id}/submission"

  - priority: 36
    category: business_constraint
    check: "The seam's predecessor_seam_id, when set, points at a seam whose status is RT_ACCEPTED before this seam may be welded. Distortion control requires the sequence to be honoured."
    error_id: ERR_WELD_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /weld-seams/{weld_seam_id}/weld-log"

  - priority: 37
    category: business_constraint
    check: "The predecessor chain of a new WeldSeam is acyclic - following predecessor_seam_id must terminate at a seam with no predecessor."
    error_id: ERR_SEAM_SEQUENCE_CYCLE
    http_status: 409
    applies_to: "POST /weld-seams"

  - priority: 38
    category: business_constraint
    check: "Identifiers unique in their scope: Tank.tank_tag globally, Welder.welder_stamp globally, ShellCourse.course_number within its tank, WeldSeam.seam_label within its shell course, WaterSource.source_name globally, and Appurtenance (appurtenance_type, azimuth_deg) within its host shell course."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /tanks, POST /welders, POST /shell-courses, POST /weld-seams, POST /water-sources, POST /appurtenances"

  - priority: 39
    category: business_constraint
    check: "At most one FoundationPackage per Tank and at most one CommissioningPackage per Tank."
    error_id: ERR_SINGLETON_EXISTS
    http_status: 409
    applies_to: "POST /foundation-packages, POST /commissioning-packages"

  - priority: 40
    category: business_constraint
    check: "point_readings contains exactly FoundationPackage.monitoring_point_count entries with point_index values 1..count, each appearing exactly once."
    error_id: ERR_INSUFFICIENT_SURVEY_POINTS
    http_status: 409
    applies_to: "POST /settlement-surveys"

  - priority: 41
    category: business_constraint
    check: "The angular separation from every already INSTALLED appurtenance on the same host shell course is at least the larger of the two required_clearance_deg values; exactly at the limit is acceptable."
    error_id: ERR_APPURTENANCE_CLEARANCE_VIOLATION
    http_status: 409
    applies_to: "POST /appurtenances/{appurtenance_id}/installation"

  - priority: 42
    category: business_constraint
    check: "missing_document_types is empty at submission time."
    error_id: ERR_MISSING_COMMISSIONING_DOCUMENTS
    http_status: 409
    applies_to: "POST /commissioning-packages/{commissioning_package_id}/submission"

  - priority: 43
    category: business_constraint
    check: "target_fill_percent is strictly greater than the plan's fill_percent_current; refilling to the same level or draining is not an advance."
    error_id: ERR_FILL_PERCENT_NOT_ADVANCING
    http_status: 409
    applies_to: "POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance"

  - priority: 44
    category: business_constraint
    check: "A mandatory hold point (target_fill_percent of 25, 50, 75 or 100) carries a settlement_survey_id whose survey belongs to the tank's foundation package, whose fill_percent equals target_fill_percent and whose verdict is WITHIN_TOLERANCE; and the completion decision requires settlement_survey_count of at least 4."
    error_id: ERR_SETTLEMENT_HOLD_POINT_MISSING
    http_status: 409
    applies_to: "POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance, POST /hydrotest-plans/{hydrotest_plan_id}/completion"

  - priority: 45
    category: business_constraint
    check: "A WeldSeam whose repair_cycle_count has reached MAX_REPAIR_CYCLES (2) and whose status is REPLACEMENT_REQUIRED accepts no further weld log or repair start."
    error_id: ERR_REPAIR_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /weld-seams/{weld_seam_id}/weld-log, POST /weld-seams/{weld_seam_id}/repair-start"

  - priority: 46
    category: business_temporal
    check: "window_end_utc is strictly after window_start_utc for an NDE examination window and for a water withdrawal window."
    error_id: ERR_INVALID_WINDOW
    http_status: 409
    applies_to: "POST /nde-reports, POST /water-withdrawals"

  - priority: 47
    category: business_temporal
    check: "The buffered RT window does not overlap any non-VOIDED RT window on the same tank, per calculations.rt_examination_window_conflict."
    error_id: ERR_EXAM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /nde-reports"

  - priority: 48
    category: business_temporal
    check: "The WaterSource permit_expiry_utc is at or after the logical clock when a plan is approved, and at or after window_end_utc when a withdrawal is reserved."
    error_id: ERR_WATER_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /hydrotest-plans/{hydrotest_plan_id}/approval, POST /water-withdrawals"

  - priority: 49
    category: business_temporal
    check: "The hold period has elapsed: current_utc is at or after hold_started_at_utc plus HydrotestPlan.hold_hours before a PASS decision. A FAIL decision may be recorded at any time during the hold."
    error_id: ERR_HOLD_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /hydrotest-plans/{hydrotest_plan_id}/completion"

  - priority: 50
    category: business_temporal
    check: "The aggregate rate of the new window plus every overlapping RESERVED window against the same water source does not exceed WaterSource.max_concurrent_rate_gpm, per calculations.withdrawal_rate_envelope."
    error_id: ERR_WITHDRAWAL_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /water-withdrawals"

  - priority: 51
    category: business_fiscal
    check: "reserved_volume_gal does not exceed WaterSource.available_volume_gal; the permitted volume of the withdrawal permit may not be oversubscribed. Exactly equal to the available volume is accepted."
    error_id: ERR_PERMITTED_VOLUME_EXCEEDED
    http_status: 409
    applies_to: "POST /water-withdrawals"

  - priority: 52
    category: business_fiscal
    check: "allocated_weight_lb does not exceed PlateLot.remaining_weight_lb; steel may not be over-allocated. Exactly equal to the remaining weight is accepted."
    error_id: ERR_PLATE_WEIGHT_EXCEEDED
    http_status: 409
    applies_to: "POST /plate-lots/{plate_lot_id}/allocations"

  - priority: 53
    category: business_constraint
    check: "The result decision agrees with the film evidence: decision ACCEPT requires indication_count 0, decision REJECT requires indication_count of at least 1 and a defect_type."
    error_id: ERR_INDICATION_COUNT_INCONSISTENT
    http_status: 409
    applies_to: "POST /nde-reports/{nde_report_id}/result"

  - priority: 54
    category: business_safety
    check: "The ShellCourse thickness_verdict is ADEQUATE - a course whose plate_thickness_in is below the governing required_thickness_in may never be erected. Evaluated after the status gate, so a repeat fitup on an already fitted course still reports the state error."
    error_id: ERR_COURSE_THICKNESS_DEFICIENT
    http_status: 409
    applies_to: "POST /shell-courses/{shell_course_id}/fitup"

# =============================================================================
# 1.5 API ENDPOINT TABLE
#   api_prefix is "/" - every collection is a flat top-level resource.
#   Every list endpoint accepts limit? and offset? with the §1.0 pagination
#   defaults { limit: 10, min: 1, max: 100, offset: 0 } and every list response
#   carries limit, offset, total_count and has_more. All list endpoints are
#   readable by all six roles; writes are role-restricted.
# =============================================================================
endpoints:
  # --- test-driving endpoint (outside the business surface) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock, which every deadline, expiry, continuity
      window and hold-period rule reads. Before any call to this endpoint the
      logical clock reads exactly 2026-08-01T00:00:00Z - the mandatory startup
      default - and never falls back to real wall-clock time. Returns the new
      current_utc.
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "sets the logical clock to to_iso8601 for every subsequent request"
      - "re-evaluates Welder.qualification_status lazily on the next read or weld-log attempt"

  # --- Tank ---------------------------------------------------------------
  - method: POST
    path: "/tanks"
    description: "Registers a tank design. min_nominal_thickness_in is derived from the diameter tier; the tank starts at construction_phase DESIGN_REGISTERED and quality_posture OPEN."
    roles: [ProjectEngineer]
    code: 201
    input: [tank_tag, "design_standard?", diameter_ft, shell_height_ft, design_liquid_level_ft, product_specific_gravity, joint_efficiency, "corrosion_allowance_in?", "roof_type?", bottom_thickness_in, bottom_minimum_thickness_in, assumed_corrosion_rate_ipy]
    output: Tank
    side_effects:
      - "sets min_nominal_thickness_in from the MIN_NOMINAL_BY_DIAMETER tier"
      - "initialises construction_phase DESIGN_REGISTERED, quality_posture OPEN, version 1"

  - method: GET
    path: "/tanks"
    description: "Lists tanks with optional filtering on either state dimension."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_tag?", "construction_phase?", "quality_posture?", "limit?", "offset?"]
    output: Tank[]
    side_effects: []

  - method: GET
    path: "/tanks/{tank_id}"
    description: "Reads one tank, including its live derived fields (posture, nonconformance count, reject rate, required examination percentage, steel ledger)."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: Tank
    side_effects: []

  - method: GET
    path: "/tanks/{tank_id}/summary"
    description: |
      Computed read returning a flat object of derived progress data for the tank:
      { tank_id, construction_phase, quality_posture, open_nonconformance_count,
        course_count, rt_accepted_course_count, seam_count, welded_seam_count,
        rt_accepted_seam_count, weld_reject_rate, required_examination_pct,
        steel_received_lb, steel_allocated_lb, steel_remaining_lb,
        active_hydrotest_plan_id, total_hydrotest_cost_usd,
        installed_appurtenance_count, designed_appurtenance_count }.
      designed_appurtenance_count is the size of the tank's whole design set - every
      Appurtenance row of the tank whatever its status - and
      installed_appurtenance_count is the subset already INSTALLED, so the two are
      equal exactly when the appurtenance scope is complete.
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/tanks/{tank_id}/phase-transitions"
    description: "Records an operator-driven construction_phase transition. Only the transitions declared in state_machines.Tank.construction_phase with a ProjectEngineer actor are accepted; system reverts are never requestable."
    roles: [ProjectEngineer]
    code: 200
    input: [target_phase, "remarks?"]
    output: Tank
    side_effects:
      - "advances Tank.construction_phase to target_phase"
      - "increments Tank.version by 1"

  # --- FoundationPackage --------------------------------------------------
  - method: POST
    path: "/foundation-packages"
    description: "Creates the single foundation package for a tank and freezes its settlement tolerance envelope."
    roles: [CivilContractor]
    code: 201
    input: [tank_id, foundation_type, "ringwall_top_elevation_ft?", settlement_evaluation_method, permitted_uniform_settlement_in, permitted_differential_ratio, monitoring_point_count]
    output: FoundationPackage
    side_effects:
      - "runs calculations.settlement_tolerance_envelope to set point_spacing_in and allowable_differential_in"
      - "initialises status PLANNED"

  - method: GET
    path: "/foundation-packages"
    description: "Lists foundation packages; filter by tank to reach a tank's package."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "status?", "foundation_type?", "limit?", "offset?"]
    output: FoundationPackage[]
    side_effects: []

  - method: GET
    path: "/foundation-packages/{foundation_package_id}"
    description: "Reads one foundation package with its tolerance envelope and baseline pointer."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: FoundationPackage
    side_effects: []

  - method: POST
    path: "/foundation-packages/{foundation_package_id}/acceptance"
    description: "Records the project engineer's accept-or-reject decision on the surveyed foundation. The two branches have deliberately different side-effect sets."
    roles: [ProjectEngineer]
    code: 200
    input: [decision, "decision_remarks?"]
    output: FoundationPackage
    side_effects:
      - "ACCEPT: status = ACCEPTED, decided_by_user_id and decided_at_utc stamped, Tank.construction_phase DESIGN_REGISTERED -> FOUNDATION_ACCEPTED"
      - "REJECT: status = REJECTED, decided_by_user_id and decided_at_utc stamped, baseline_survey_id cleared, Tank.construction_phase untouched"

  # --- SettlementSurvey ---------------------------------------------------
  - method: POST
    path: "/settlement-surveys"
    description: "Records a settlement survey round. The first survey of a package is its BASELINE; later rounds are MONITORING and are evaluated against the package's tolerance envelope using the package's configured method."
    roles: [CivilContractor]
    code: 201
    input: [foundation_package_id, "hydrotest_plan_id?", fill_percent, "measured_at_utc?", point_readings]
    output: SettlementSurvey
    side_effects:
      - "runs calculations.differential_settlement_evaluation to set uniform_settlement_in, max_out_of_plane_in, max_adjacent_differential_in, governing_metric_in and verdict"
      - "a BASELINE survey sets FoundationPackage.baseline_survey_id and moves the package PLANNED -> BASELINE_SET"
      - "an OUT_OF_TOLERANCE monitoring survey opens a nonconformance and recomputes Tank.quality_posture, which suspends live hydrotest plans and releases their water reservations"
      - "a WITHIN_TOLERANCE monitoring survey at or above an open survey's fill_percent closes that survey and can restore a suspended plan"

  - method: GET
    path: "/settlement-surveys"
    description: "Lists settlement surveys; filter by foundation package or by hydrotest plan."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["foundation_package_id?", "hydrotest_plan_id?", "survey_role?", "verdict?", "nonconformance_state?", "limit?", "offset?"]
    output: SettlementSurvey[]
    side_effects: []

  - method: GET
    path: "/settlement-surveys/{settlement_survey_id}"
    description: "Reads one settlement survey with both settlement metrics and its nonconformance state."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: SettlementSurvey
    side_effects: []

  # --- PlateLot -----------------------------------------------------------
  - method: POST
    path: "/plate-lots"
    description: "Registers a mill plate lot ordered for a tank."
    roles: [ErectionSuperintendent]
    code: 201
    input: [tank_id, mill_name, heat_number, thickness_in, plate_count, plate_weight_lb, unit_cost_usd_per_lb, "mtr_number?"]
    output: PlateLot
    side_effects:
      - "initialises status ORDERED with all weights at 0.0"

  - method: GET
    path: "/plate-lots"
    description: "Lists plate lots; filter by tank."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "status?", "heat_number?", "limit?", "offset?"]
    output: PlateLot[]
    side_effects: []

  - method: GET
    path: "/plate-lots/{plate_lot_id}"
    description: "Reads one plate lot with its received / allocated / remaining weight ledger."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: PlateLot
    side_effects: []

  - method: POST
    path: "/plate-lots/{plate_lot_id}/status-transitions"
    description: "Advances a plate lot through rolling, shipment, receipt, quarantine and release. RECEIVED and RELEASED require an mtr_number."
    roles: [ErectionSuperintendent]
    code: 200
    input: [target_status, "mtr_number?", "quarantine_reason?", "remarks?"]
    output: PlateLot
    side_effects:
      - "RECEIVED: received_weight_lb = plate_count * plate_weight_lb, remaining_weight_lb set, Tank.steel_received_lb recomputed by calculations.plate_steel_ledger"
      - "QUARANTINED: quarantine_reason stored; the lot becomes unallocatable but its received weight stays on the tank ledger"
      - "RELEASED: mtr_number overwritten with the corrected report number"

  - method: POST
    path: "/plate-lots/{plate_lot_id}/allocations"
    description: "Allocates plate weight from this lot to one shell course. Returns the updated shell course."
    roles: [ErectionSuperintendent]
    code: 200
    input: [shell_course_id, allocated_weight_lb]
    output: ShellCourse
    side_effects:
      - "ShellCourse.allocated_plate_lot_id and allocated_weight_lb set, allocation_status = ALLOCATED"
      - "runs calculations.plate_steel_ledger: PlateLot.allocated_weight_lb and remaining_weight_lb, Tank.steel_allocated_lb"

  # --- ShellCourse --------------------------------------------------------
  - method: POST
    path: "/shell-courses"
    description: "Specifies a shell course and computes its required thickness by the one-foot method against both the design and hydrostatic-test cases plus the minimum nominal floor."
    roles: [ProjectEngineer]
    code: 201
    input: [tank_id, course_number, course_width_ft, plate_thickness_in, material_spec, allowable_stress_design_psi, allowable_stress_test_psi]
    output: ShellCourse
    side_effects:
      - "runs calculations.shell_course_required_thickness to set course_bottom_elevation_ft, design_liquid_height_ft, required_thickness_design_in, required_thickness_test_in, required_thickness_in, governing_case and thickness_verdict"
      - "initialises status SPECIFIED and allocation_status UNALLOCATED"

  - method: GET
    path: "/shell-courses"
    description: "Lists shell courses; filter by tank or by the plate lot that supplied them."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "allocated_plate_lot_id?", "status?", "allocation_status?", "thickness_verdict?", "limit?", "offset?"]
    output: ShellCourse[]
    side_effects: []

  - method: GET
    path: "/shell-courses/{shell_course_id}"
    description: "Reads one shell course with its thickness computation and its compound status."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: ShellCourse
    side_effects: []

  - method: POST
    path: "/shell-courses/{shell_course_id}/allocation-release"
    description: "Releases the plate allocation held by a course so the steel returns to its lot."
    roles: [ErectionSuperintendent]
    code: 200
    input: [reason]
    output: ShellCourse
    side_effects:
      - "clears allocated_plate_lot_id and allocated_weight_lb, allocation_status = UNALLOCATED"
      - "runs calculations.plate_steel_ledger so PlateLot.remaining_weight_lb and Tank.steel_allocated_lb reconcile exactly to their pre-allocation values"

  - method: POST
    path: "/shell-courses/{shell_course_id}/fitup"
    description: "Records fit-up of the course in the field. The first fitup on a tank also advances the tank into erection."
    roles: [ErectionSuperintendent]
    code: 200
    input: []
    output: ShellCourse
    side_effects:
      - "status SPECIFIED -> FITTED, fitup_at_utc stamped from the logical clock"
      - "Tank.construction_phase FOUNDATION_ACCEPTED -> ERECTION_IN_PROGRESS on the first fitup"

  # --- Welder -------------------------------------------------------------
  - method: POST
    path: "/welders"
    description: "Registers a welder whose performance qualification has just been witnessed. The welder is created QUALIFIED and the acting inspector is recorded as the qualifier."
    roles: [AuthorizedInspector]
    code: 201
    input: [welder_stamp, full_name, process, qualified_positions, welder_qualified_thickness_max_in, wps_number, wps_qualified_thickness_max_in, qualification_date_utc, "continuity_limit_days?"]
    output: Welder
    side_effects:
      - "qualification_status = QUALIFIED, last_weld_date_utc = qualification_date_utc"
      - "continuity_expires_at_utc = last_weld_date_utc + continuity_limit_days"
      - "qualified_by_user_id = the acting X-User-ID, which bars that user from reporting NDE results on this welder's seams"

  - method: GET
    path: "/welders"
    description: "Lists welders with their live qualification status, re-evaluated against the logical clock."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["welder_stamp?", "process?", "qualification_status?", "limit?", "offset?"]
    output: Welder[]
    side_effects:
      - "lapses any QUALIFIED welder whose continuity_expires_at_utc is strictly before the logical clock"

  - method: GET
    path: "/welders/{welder_id}"
    description: "Reads one welder, re-evaluating the continuity window against the logical clock before responding."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: Welder
    side_effects:
      - "lapses the welder when continuity_expires_at_utc is strictly before the logical clock"

  - method: POST
    path: "/welders/{welder_id}/qualification-actions"
    description: "Renews a lapsed qualification or revokes a qualification. action is RENEW or REVOKE."
    roles: [AuthorizedInspector]
    code: 200
    input: [action, "effective_date_utc?", "remarks?"]
    output: Welder
    side_effects:
      - "RENEW: qualification_status = QUALIFIED, last_weld_date_utc reset, continuity_expires_at_utc recomputed, qualification_date_utc preserved"
      - "REVOKE: qualification_status = REVOKED, revoked_at_utc stamped; previously welded seams are untouched"

  # --- WeldSeam -----------------------------------------------------------
  - method: POST
    path: "/weld-seams"
    description: "Declares a field weld seam on a shell course, optionally chained behind a predecessor seam to enforce the distortion-control sequence."
    roles: [ErectionSuperintendent]
    code: 201
    input: [shell_course_id, seam_type, seam_label, length_in, sequence_index, "predecessor_seam_id?"]
    output: WeldSeam
    side_effects:
      - "initialises status FIT_READY and repair_cycle_count 0"
      - "rejects a predecessor chain that would form a cycle"

  - method: GET
    path: "/weld-seams"
    description: "Lists weld seams; filter by shell course, by welder, or by predecessor to walk the sequence chain."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["shell_course_id?", "welder_id?", "predecessor_seam_id?", "status?", "seam_type?", "limit?", "offset?"]
    output: WeldSeam[]
    side_effects: []

  - method: GET
    path: "/weld-seams/{weld_seam_id}"
    description: "Reads one weld seam with its repair cycle count and its last examination pointer."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: WeldSeam
    side_effects: []

  - method: POST
    path: "/weld-seams/{weld_seam_id}/weld-log"
    description: "Logs a completed field weld. Only the Welder role may call this, and the acting X-User-ID must equal the welder_id in the body."
    roles: [Welder]
    code: 200
    input: [welder_id, "filler_lot?", "completed_at_utc?"]
    output: WeldSeam
    side_effects:
      - "status FIT_READY -> WELDED, or REPAIR_IN_PROGRESS -> WELDED with repair_cycle_count += 1"
      - "welder_id, filler_lot and welded_at_utc recorded"
      - "refreshes Welder.last_weld_date_utc and continuity_expires_at_utc"
      - "re-derives ShellCourse.status from the course's seams"

  - method: POST
    path: "/weld-seams/{weld_seam_id}/repair-start"
    description: "Opens a repair on a rejected seam so the defect can be excavated and re-welded."
    roles: [ErectionSuperintendent]
    code: 200
    input: [defect_disposition, "remarks?"]
    output: WeldSeam
    side_effects:
      - "status RT_REJECTED -> REPAIR_IN_PROGRESS; the seam's open nonconformance stays open"

  # --- NdeReport ----------------------------------------------------------
  - method: POST
    path: "/nde-reports"
    description: "Schedules a nondestructive examination on a welded seam. RT windows are exclusive per tank with a 60-minute clearance buffer on each side."
    roles: [QcInspector]
    code: 201
    input: [weld_seam_id, method, window_start_utc, window_end_utc, coverage_pct, technician_stamp]
    output: NdeReport
    side_effects:
      - "runs calculations.rt_examination_window_conflict against every non-VOIDED RT window on the tank"
      - "initialises status SCHEDULED, nonconformance_open false"
      - "WeldSeam.status -> EXAM_SCHEDULED and last_nde_report_id set; re-scheduling on an RT_ACCEPTED seam reverts ShellCourse.status and can revert Tank.construction_phase"

  - method: GET
    path: "/nde-reports"
    description: "Lists examination reports; filter by weld seam."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["weld_seam_id?", "status?", "method?", "nonconformance_open?", "limit?", "offset?"]
    output: NdeReport[]
    side_effects: []

  - method: GET
    path: "/nde-reports/{nde_report_id}"
    description: "Reads one examination report."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: NdeReport
    side_effects: []

  - method: POST
    path: "/nde-reports/{nde_report_id}/result"
    description: "Reports the radiographic result. The acting inspector must not be the user who qualified the welder that made the seam."
    roles: [QcInspector]
    code: 200
    input: [decision, indication_count, film_count, "defect_type?"]
    output: NdeReport
    side_effects:
      - "ACCEPT: status = REPORTED_ACCEPT, seam -> RT_ACCEPTED, any earlier open rejection on the seam is closed"
      - "REJECT: status = REPORTED_REJECT with nonconformance_open true, seam -> RT_REJECTED or REPLACEMENT_REQUIRED at the repair cap, and the five-hop posture / plan-suspension / withdrawal-release cascade fires"
      - "runs calculations.weld_reject_rate_escalation and calculations.tank_quality_posture"

  - method: POST
    path: "/nde-reports/{nde_report_id}/void"
    description: "Voids an examination report - either an unshot scheduled window or an erroneous rejection - reversing every side effect the report caused."
    roles: [AuthorizedInspector]
    code: 200
    input: [void_reason]
    output: NdeReport
    side_effects:
      - "status = VOIDED, nonconformance_open false"
      - "seam returns to WELDED (or to RT_ACCEPTED when it had been accepted before this window was scheduled) without incrementing repair_cycle_count"
      - "Tank.open_nonconformance_count and quality_posture recomputed; a return to OPEN restores every SUSPENDED plan to its state_before_suspension"
      - "runs calculations.weld_reject_rate_escalation with the voided report removed from the examined population"

  # --- WaterSource --------------------------------------------------------
  - method: POST
    path: "/water-sources"
    description: "Registers a permitted water source with its volume permit, concurrent-rate envelope and unit costs."
    roles: [ProjectEngineer]
    code: 201
    input: [source_name, source_type, permitted_volume_gal, max_concurrent_rate_gpm, water_cost_usd_per_kgal, disposal_cost_usd_per_kgal, permit_expiry_utc]
    output: WaterSource
    side_effects:
      - "initialises reserved_volume_gal 0.0, consumed_volume_gal 0.0, available_volume_gal = permitted_volume_gal, version 1"

  - method: GET
    path: "/water-sources"
    description: "Lists water sources with their live volume ledgers."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["source_name?", "source_type?", "limit?", "offset?"]
    output: WaterSource[]
    side_effects: []

  - method: GET
    path: "/water-sources/{water_source_id}"
    description: "Reads one water source, including the version an OCC reservation must quote."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: WaterSource
    side_effects: []

  # --- HydrotestPlan ------------------------------------------------------
  - method: POST
    path: "/hydrotest-plans"
    description: "Creates a hydrostatic test plan for a tank, superseding the tank's prior DRAFT or REJECTED plan. Requires expected_tank_version to match the tank's current version."
    roles: [ProjectEngineer]
    code: 201
    input: [tank_id, water_source_id, fill_volume_gal, disposal_method, hold_hours, expected_tank_version]
    output: HydrotestPlan
    side_effects:
      - "rejects the create with ERR_STALE_TANK_VERSION (412) when expected_tank_version does not equal Tank.version"
      - "increments Tank.version by 1"
      - "supersedes the tank's existing DRAFT or REJECTED plan, setting previous_plan_id, and cancels that plan's RESERVED withdrawals"
      - "initialises status DRAFT with fill_percent_current 0.0 and all cost fields 0.0"

  - method: GET
    path: "/hydrotest-plans"
    description: "Lists hydrotest plans; filter by tank or by water source."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "water_source_id?", "status?", "limit?", "offset?"]
    output: HydrotestPlan[]
    side_effects: []

  - method: GET
    path: "/hydrotest-plans/{hydrotest_plan_id}"
    description: "Reads one hydrotest plan with its fill progress, suspension memory and full cost breakdown."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: HydrotestPlan
    side_effects: []

  - method: POST
    path: "/hydrotest-plans/{hydrotest_plan_id}/approval"
    description: "Approves or rejects a draft hydrotest plan. Approval records the approver, who is then barred from recording the completion decision."
    roles: [ProjectEngineer]
    code: 200
    input: [decision, "remarks?"]
    output: HydrotestPlan
    side_effects:
      - "APPROVE: status = APPROVED, approved_by_user_id = the acting X-User-ID, Tank.active_hydrotest_plan_id set"
      - "REJECT: status = REJECTED and every RESERVED withdrawal of the plan is cancelled, releasing its volume"

  - method: POST
    path: "/hydrotest-plans/{hydrotest_plan_id}/fill-advance"
    description: "Advances the fill level. Mandatory hold points at 25, 50, 75 and 100 percent each require a WITHIN_TOLERANCE settlement survey taken at that level."
    roles: [ErectionSuperintendent]
    code: 200
    input: [target_fill_percent, "settlement_survey_id?"]
    output: HydrotestPlan
    side_effects:
      - "fill_percent_current = target_fill_percent; settlement_survey_count += 1 when a survey is supplied"
      - "status APPROVED -> FILLING, and FILLING -> FILL_HOLD with hold_started_at_utc stamped when the target is 100"

  - method: POST
    path: "/hydrotest-plans/{hydrotest_plan_id}/completion"
    description: "Records the authorized inspector's pass-or-fail decision after the hold period. The acting inspector must not be the plan's approver."
    roles: [AuthorizedInspector]
    code: 200
    input: [decision, "remarks?"]
    output: HydrotestPlan
    side_effects:
      - "PASS: status = PASSED, completed_at_utc stamped, Tank.construction_phase SHELL_COMPLETE -> HYDROTEST_PASSED, cost fields frozen by calculations.hydrotest_water_and_disposal_cost and calculations.hydrotest_permit_surcharge"
      - "FAIL: status = FAILED, Tank.active_hydrotest_plan_id cleared, and the failure counts as an open nonconformance so quality_posture is recomputed"
      - "either decision converts the plan's RESERVED withdrawals to CONSUMED, moving their volume from reserved to consumed on the WaterSource"

  # --- WaterWithdrawal ----------------------------------------------------
  - method: POST
    path: "/water-withdrawals"
    description: "Reserves a withdrawal window against a water source for a hydrotest plan. Requires expected_water_source_version to match the source's current version."
    roles: [ErectionSuperintendent]
    code: 201
    input: [hydrotest_plan_id, water_source_id, window_start_utc, window_end_utc, rate_gpm, reserved_volume_gal, expected_water_source_version]
    output: WaterWithdrawal
    side_effects:
      - "rejects the create with ERR_STALE_WATER_SOURCE_VERSION (412) when expected_water_source_version does not equal WaterSource.version"
      - "increments WaterSource.version by 1"
      - "runs calculations.withdrawal_rate_envelope over overlapping RESERVED windows on the same source"
      - "runs calculations.water_volume_ledger, then calculations.hydrotest_water_and_disposal_cost and calculations.hydrotest_permit_surcharge on the owning plan"

  - method: GET
    path: "/water-withdrawals"
    description: "Lists withdrawal windows; filter by hydrotest plan or by water source."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["hydrotest_plan_id?", "water_source_id?", "status?", "limit?", "offset?"]
    output: WaterWithdrawal[]
    side_effects: []

  - method: GET
    path: "/water-withdrawals/{water_withdrawal_id}"
    description: "Reads one withdrawal window with its rounded per-withdrawal water cost."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: WaterWithdrawal
    side_effects: []

  - method: POST
    path: "/water-withdrawals/{water_withdrawal_id}/cancellation"
    description: "Cancels a reserved withdrawal window, returning its volume and its share of the rate envelope to the source."
    roles: [ErectionSuperintendent]
    code: 200
    input: [cancellation_reason]
    output: WaterWithdrawal
    side_effects:
      - "status = CANCELLED and the volume is released by calculations.water_volume_ledger"
      - "the owning plan's cost fields are recomputed with this withdrawal excluded, which can move both the disposal tier and the surcharge tier"

  # --- CoatingApplication -------------------------------------------------
  - method: POST
    path: "/coating-applications"
    description: "Issues a coating or lining specification for a tank, fixing the required preparation standard, the minimum dry film thickness and which acceptance method applies."
    roles: [ProjectEngineer]
    code: 201
    input: [tank_id, scope, surface_area_sqft, specified_prep_standard, specified_min_dft_mils, dft_acceptance_method, coating_system]
    output: CoatingApplication
    side_effects:
      - "initialises status SPEC_ISSUED, dft_verdict NOT_EVALUATED, rework_cycle_count 0"

  - method: GET
    path: "/coating-applications"
    description: "Lists coating applications; filter by tank."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "scope?", "status?", "dft_verdict?", "limit?", "offset?"]
    output: CoatingApplication[]
    side_effects: []

  - method: GET
    path: "/coating-applications/{coating_application_id}"
    description: "Reads one coating application with every DFT aggregate and its holiday-test record."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: CoatingApplication
    side_effects: []

  - method: POST
    path: "/coating-applications/{coating_application_id}/surface-prep"
    description: "Records the achieved surface preparation. Also the re-entry point after a failed holiday test, which resets every measurement of the previous cycle."
    roles: [QcInspector]
    code: 200
    input: [achieved_prep_standard, profile_mils, dew_point_spread_f]
    output: CoatingApplication
    side_effects:
      - "status -> PREP_ACCEPTED with the achieved standard, profile and dew point spread stored"
      - "from REWORK_REQUIRED: rework_cycle_count += 1, dft_verdict reset to NOT_EVALUATED, every DFT aggregate reset to 0.0, spot_count 0, holiday fields cleared, and the coating nonconformance closes so Tank.quality_posture is recomputed"

  - method: POST
    path: "/coating-applications/{coating_application_id}/dft-readings"
    description: "Records dry film thickness spot readings and evaluates them under the application's configured acceptance method."
    roles: [QcInspector]
    code: 200
    input: [spot_readings]
    output: CoatingApplication
    side_effects:
      - "runs calculations.coating_dft_acceptance to set spot_count, the four aggregates and dft_verdict"
      - "status PREP_ACCEPTED -> DFT_RECORDED"

  - method: POST
    path: "/coating-applications/{coating_application_id}/holiday-test"
    description: "Records the holiday (pinhole) test. Any holiday found sends the application into rework and cascades through the tank's posture, phase and commissioning package."
    roles: [QcInspector]
    code: 200
    input: [holidays_found, test_voltage_v]
    output: CoatingApplication
    side_effects:
      - "0 holidays with dft_verdict PASS: status = ACCEPTED, and Tank.construction_phase HYDROTEST_PASSED -> COATED once every application of the tank is ACCEPTED"
      - "1 or more holidays: status = REWORK_REQUIRED, Tank.quality_posture recomputed, Tank.construction_phase COATED -> HYDROTEST_PASSED, and any SUBMITTED commissioning package returned with deficiency_count += 1 and both due dates cleared"

  # --- Appurtenance -------------------------------------------------------
  - method: POST
    path: "/appurtenances"
    description: "Designs an appurtenance - nozzle, manway, stairway, mixer or roof vent - onto a host shell course at a given azimuth, computing its required angular clearance."
    roles: [ProjectEngineer]
    code: 201
    input: [tank_id, host_shell_course_id, appurtenance_type, nominal_size_in, elevation_ft, azimuth_deg, "reinforcement_required?"]
    output: Appurtenance
    side_effects:
      - "runs calculations.appurtenance_clearance_envelope to set required_clearance_deg"
      - "initialises status DESIGNED"

  - method: GET
    path: "/appurtenances"
    description: "Lists appurtenances; filter by tank or by host shell course."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "host_shell_course_id?", "appurtenance_type?", "status?", "limit?", "offset?"]
    output: Appurtenance[]
    side_effects: []

  - method: GET
    path: "/appurtenances/{appurtenance_id}"
    description: "Reads one appurtenance with its computed clearance requirement."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: Appurtenance
    side_effects: []

  - method: POST
    path: "/appurtenances/{appurtenance_id}/installation"
    description: "Records installation of the appurtenance. Only allowed once the host shell course is RT_ACCEPTED and the clearance envelope to every already installed neighbour holds."
    roles: [ErectionSuperintendent]
    code: 200
    input: ["installed_at_utc?"]
    output: Appurtenance
    side_effects:
      - "status DESIGNED -> INSTALLED with installed_at_utc set from the payload or the logical clock"
      - "re-runs the clash check in calculations.appurtenance_clearance_envelope against every INSTALLED appurtenance on the same host course"

  # --- CommissioningPackage -----------------------------------------------
  - method: POST
    path: "/commissioning-packages"
    description: "Opens the single commissioning documentation package for a tank and fixes its required document set."
    roles: [ProjectEngineer]
    code: 201
    input: [tank_id]
    output: CommissioningPackage
    side_effects:
      - "runs calculations.commissioning_document_completeness so required_document_types and missing_document_types are populated and submitted_document_types is empty"
      - "initialises status DRAFT with deficiency_count 0"

  - method: GET
    path: "/commissioning-packages"
    description: "Lists commissioning packages; filter by tank."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: ["tank_id?", "status?", "limit?", "offset?"]
    output: CommissioningPackage[]
    side_effects: []

  - method: GET
    path: "/commissioning-packages/{commissioning_package_id}"
    description: "Reads one commissioning package with its document ledger and, once accepted, its in-service inspection schedule."
    roles: [ProjectEngineer, CivilContractor, ErectionSuperintendent, Welder, QcInspector, AuthorizedInspector]
    code: 200
    input: []
    output: CommissioningPackage
    side_effects: []

  - method: POST
    path: "/commissioning-packages/{commissioning_package_id}/documents"
    description: "Records one commissioning document against the package."
    roles: [ProjectEngineer]
    code: 200
    input: [document_type, reference_number]
    output: CommissioningPackage
    side_effects:
      - "runs calculations.commissioning_document_completeness: document_count always rises, submitted_document_types and missing_document_types only change for a type not already present"

  - method: POST
    path: "/commissioning-packages/{commissioning_package_id}/submission"
    description: "Submits the package for the authorized inspector's review; also the re-submission path after a correction."
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: CommissioningPackage
    side_effects:
      - "status -> SUBMITTED and submitted_by_user_id = the acting X-User-ID, which bars that user from reviewing it"
      - "deficiency_count is never reset on re-submission"

  - method: POST
    path: "/commissioning-packages/{commissioning_package_id}/review"
    description: "Records the authorized inspector's accept-or-return decision and, on acceptance, computes the in-service inspection schedule."
    roles: [AuthorizedInspector]
    code: 200
    input: [decision, "remarks?"]
    output: CommissioningPackage
    side_effects:
      - "ACCEPT: status = ACCEPTED, accepted_at_utc stamped, calculations.in_service_inspection_schedule sets the remaining-life, both intervals and both due dates, and Tank.construction_phase COATED -> COMMISSIONED"
      - "RETURN: status = RETURNED_FOR_CORRECTION with deficiency_count += 1 and no schedule computed"

# =============================================================================
# 1.6 ERROR CODE CATALOG
# =============================================================================
errors:
  # --- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or blank."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not a declared role, or the role is not listed for the target endpoint."
  - id: ERR_WELDER_IDENTITY_MISMATCH
    http: 403
    condition: "Role Welder logging a weld under a welder_id other than the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same operator who performed the counterpart step: welder qualification vs NDE result, hydrotest approval vs completion, or commissioning submission vs review."

  # --- existence ----------------------------------------------------------
  - id: ERR_TANK_NOT_FOUND
    http: 404
    condition: "tank_id in the path or body does not resolve."
  - id: ERR_FOUNDATION_PACKAGE_NOT_FOUND
    http: 404
    condition: "foundation_package_id in the path or body does not resolve."
  - id: ERR_SETTLEMENT_SURVEY_NOT_FOUND
    http: 404
    condition: "settlement_survey_id in the path or body does not resolve."
  - id: ERR_PLATE_LOT_NOT_FOUND
    http: 404
    condition: "plate_lot_id in the path does not resolve."
  - id: ERR_SHELL_COURSE_NOT_FOUND
    http: 404
    condition: "shell_course_id or host_shell_course_id does not resolve."
  - id: ERR_WELDER_NOT_FOUND
    http: 404
    condition: "welder_id in the path or body does not resolve."
  - id: ERR_WELD_SEAM_NOT_FOUND
    http: 404
    condition: "weld_seam_id or predecessor_seam_id does not resolve."
  - id: ERR_NDE_REPORT_NOT_FOUND
    http: 404
    condition: "nde_report_id in the path does not resolve."
  - id: ERR_WATER_SOURCE_NOT_FOUND
    http: 404
    condition: "water_source_id in the path or body does not resolve."
  - id: ERR_HYDROTEST_PLAN_NOT_FOUND
    http: 404
    condition: "hydrotest_plan_id in the path or body does not resolve."
  - id: ERR_WATER_WITHDRAWAL_NOT_FOUND
    http: 404
    condition: "water_withdrawal_id in the path does not resolve."
  - id: ERR_COATING_APPLICATION_NOT_FOUND
    http: 404
    condition: "coating_application_id in the path does not resolve."
  - id: ERR_APPURTENANCE_NOT_FOUND
    http: 404
    condition: "appurtenance_id in the path does not resolve."
  - id: ERR_COMMISSIONING_PACKAGE_NOT_FOUND
    http: 404
    condition: "commissioning_package_id in the path does not resolve."

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, undeclared enum value, non-numeric or out-of-range number, unparseable instant, empty required array, or a DFT spot that does not carry exactly three gauge readings."

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_TANK_VERSION
    http: 412
    condition: "expected_tank_version does not equal the tank's current version when a hydrotest plan is created."
  - id: ERR_STALE_WATER_SOURCE_VERSION
    http: 412
    condition: "expected_water_source_version does not equal the water source's current version when a withdrawal window is reserved."

  # --- state --------------------------------------------------------------
  - id: ERR_PHASE_TRANSITION_INVALID
    http: 409
    condition: "The requested construction_phase target is not the operator-requestable SHELL_COMPLETE, is not declared from the tank's current phase, or its gate (every ShellCourse of the tank RT_ACCEPTED) is unmet."
  - id: ERR_FOUNDATION_STATE_INVALID
    http: 409
    condition: "Acceptance decision recorded on a foundation package that is not BASELINE_SET, or a monitoring survey submitted before a baseline exists."
  - id: ERR_PLATE_LOT_STATE_INVALID
    http: 409
    condition: "Plate lot target_status not reachable from the current status, or mtr_number missing for RECEIVED or RELEASED."
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "Allocation from a lot that is not RECEIVED or RELEASED, allocation onto a course that already holds one, or release of an allocation that does not exist or whose course has already been fitted up."
  - id: ERR_COURSE_STATE_INVALID
    http: 409
    condition: "Fitup requested on a course that is not SPECIFIED."
  - id: ERR_SEAM_NOT_WELDABLE
    http: 409
    condition: "Weld logged on a seam that is not FIT_READY or REPAIR_IN_PROGRESS, or whose host course is not FITTED or WELDED."
  - id: ERR_SEAM_STATE_INVALID
    http: 409
    condition: "Repair started on a seam that is not RT_REJECTED."
  - id: ERR_NDE_STATE_INVALID
    http: 409
    condition: "Examination scheduled on a seam that is not WELDED or RT_ACCEPTED or that already has a SCHEDULED report; result reported on a report that is not SCHEDULED; void attempted on a report that is neither SCHEDULED nor an open REPORTED_REJECT with the seam still RT_REJECTED."
  - id: ERR_WELDER_STATE_INVALID
    http: 409
    condition: "RENEW on a welder who is not LAPSED, or any action on a REVOKED welder."
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "Hydrotest plan action requested from a state that does not permit it, including any action on a SUSPENDED, SUPERSEDED, PASSED, FAILED or REJECTED plan."
  - id: ERR_WITHDRAWAL_STATE_INVALID
    http: 409
    condition: "Cancellation requested on a withdrawal that is not RESERVED."
  - id: ERR_COATING_STEP_INVALID
    http: 409
    condition: "Coating step out of order: prep on an application that is not SPEC_ISSUED or REWORK_REQUIRED, DFT readings on one that is not PREP_ACCEPTED, or a holiday test on one that is not DFT_RECORDED."
  - id: ERR_APPURTENANCE_STATE_INVALID
    http: 409
    condition: "Installation recorded on an appurtenance that is not DESIGNED."
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "Commissioning package action from a state that does not permit it: submission from SUBMITTED or ACCEPTED, review from anything other than SUBMITTED, or a document recorded on a SUBMITTED or ACCEPTED package."

  # --- safety / compliance -----------------------------------------------
  - id: ERR_TANK_POSTURE_FROZEN
    http: 409
    condition: "Production write attempted on a tank whose quality_posture is FROZEN (three or more open nonconformances)."
  - id: ERR_TANK_POSTURE_RESTRICTED
    http: 409
    condition: "Hydrotest approval, fill advance, commissioning submission or commissioning acceptance attempted while quality_posture is RESTRICTED."
  - id: ERR_WELDER_NOT_QUALIFIED
    http: 409
    condition: "Weld logged by a welder whose qualification_status is LAPSED or REVOKED after the continuity window is re-evaluated against the logical clock."
  - id: ERR_THICKNESS_OUT_OF_QUALIFIED_RANGE
    http: 409
    condition: "The host course plate_thickness_in exceeds the welder's qualified thickness limit or the procedure's qualified thickness limit, whichever is smaller."
  - id: ERR_COURSE_THICKNESS_DEFICIENT
    http: 409
    condition: "Fitup attempted on a course whose thickness_verdict is DEFICIENT."
  - id: ERR_SURFACE_PREP_DEFICIENT
    http: 409
    condition: "achieved_prep_standard is less clean than specified_prep_standard."
  - id: ERR_DEW_POINT_SPREAD_INSUFFICIENT
    http: 409
    condition: "dew_point_spread_f is below 5.0 degrees Fahrenheit at coating time."
  - id: ERR_HOLIDAY_TEST_VOLTAGE_LOW
    http: 409
    condition: "Holiday test on an INTERNAL_LINING scope performed below 67.5 volts per mil of specified dry film thickness."
  - id: ERR_DFT_NOT_PASSED
    http: 409
    condition: "Holiday test reporting zero holidays on an application whose dft_verdict is FAIL."

  # --- referential integrity ---------------------------------------------
  - id: ERR_CROSS_TANK_REFERENCE
    http: 409
    condition: "Two entities referenced in one request belong to different tanks."
  - id: ERR_FOUNDATION_NOT_ACCEPTED
    http: 409
    condition: "Fitup or weld logging attempted before the tank's foundation package is ACCEPTED."
  - id: ERR_HOST_COURSE_NOT_ACCEPTED
    http: 409
    condition: "Appurtenance installation attempted on a host shell course that is not RT_ACCEPTED."
  - id: ERR_APPURTENANCES_NOT_INSTALLED
    http: 409
    condition: "Commissioning submission attempted while at least one appurtenance of the tank is still DESIGNED."

  # --- constraint satisfaction -------------------------------------------
  - id: ERR_WELD_SEQUENCE_VIOLATION
    http: 409
    condition: "Weld logged on a seam whose predecessor seam is not yet RT_ACCEPTED."
  - id: ERR_SEAM_SEQUENCE_CYCLE
    http: 409
    condition: "The predecessor_seam_id chain of a new seam would form a cycle."
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "Duplicate tank_tag, welder_stamp, source_name, course_number within a tank, seam_label within a course, or appurtenance type and azimuth pair within a host course."
  - id: ERR_SINGLETON_EXISTS
    http: 409
    condition: "A second foundation package or a second commissioning package created for the same tank."
  - id: ERR_INSUFFICIENT_SURVEY_POINTS
    http: 409
    condition: "point_readings does not contain exactly monitoring_point_count entries with distinct point_index values 1..count."
  - id: ERR_APPURTENANCE_CLEARANCE_VIOLATION
    http: 409
    condition: "Angular separation from an already installed appurtenance on the same host course is smaller than the larger of the two required clearances."
  - id: ERR_MISSING_COMMISSIONING_DOCUMENTS
    http: 409
    condition: "Submission attempted while missing_document_types is non-empty."
  - id: ERR_FILL_PERCENT_NOT_ADVANCING
    http: 409
    condition: "target_fill_percent is not strictly greater than the plan's fill_percent_current."
  - id: ERR_SETTLEMENT_HOLD_POINT_MISSING
    http: 409
    condition: "A mandatory hold point advanced without a matching WITHIN_TOLERANCE settlement survey at that fill level, or a PASS decision recorded with fewer than four hold-point surveys."
  - id: ERR_REPAIR_LIMIT_EXCEEDED
    http: 409
    condition: "Weld log or repair start attempted on a seam that has exhausted its two repair cycles and is REPLACEMENT_REQUIRED."
  - id: ERR_INDICATION_COUNT_INCONSISTENT
    http: 409
    condition: "decision ACCEPT with a non-zero indication_count, or decision REJECT with indication_count 0 or without a defect_type."

  # --- temporal -----------------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 409
    condition: "window_end_utc is not strictly after window_start_utc."
  - id: ERR_EXAM_WINDOW_CONFLICT
    http: 409
    condition: "The buffered RT window overlaps another non-VOIDED RT window on the same tank."
  - id: ERR_WATER_PERMIT_EXPIRED
    http: 409
    condition: "The water source permit expires before the logical clock at plan approval, or before window_end_utc at reservation."
  - id: ERR_HOLD_PERIOD_NOT_ELAPSED
    http: 409
    condition: "PASS decision recorded before hold_started_at_utc plus hold_hours."
  - id: ERR_WITHDRAWAL_CAPACITY_CONFLICT
    http: 409
    condition: "Aggregate rate of overlapping reserved windows exceeds the source's max_concurrent_rate_gpm."

  # --- fiscal / quota ----------------------------------------------------
  - id: ERR_PERMITTED_VOLUME_EXCEEDED
    http: 409
    condition: "reserved_volume_gal exceeds the water source's available_volume_gal."
  - id: ERR_PLATE_WEIGHT_EXCEEDED
    http: 409
    condition: "allocated_weight_lb exceeds the plate lot's remaining_weight_lb."

# =============================================================================
# 1.7 RBAC MATRIX (segregation of duties over six peer roles)
# =============================================================================
roles:
  - name: ProjectEngineer
    description: "Owns tank design, shell course specification, water sourcing, hydrotest planning and approval, coating specification, appurtenance design and commissioning documentation."
    identity: "opaque"
    exclusive_operations:
      - "POST /tanks"
      - "POST /tanks/{tank_id}/phase-transitions"
      - "POST /shell-courses"
      - "POST /water-sources"
      - "POST /hydrotest-plans"
      - "POST /hydrotest-plans/{hydrotest_plan_id}/approval"
      - "POST /coating-applications"
      - "POST /appurtenances"
      - "POST /commissioning-packages"
      - "POST /commissioning-packages/{commissioning_package_id}/documents"
      - "POST /commissioning-packages/{commissioning_package_id}/submission"
      - "POST /foundation-packages/{foundation_package_id}/acceptance"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: CivilContractor
    description: "The civil contractor responsible for the foundation: registers the foundation package and performs every settlement survey round, but never decides whether the foundation is acceptable."
    identity: "opaque"
    exclusive_operations:
      - "POST /foundation-packages"
      - "POST /settlement-surveys"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ErectionSuperintendent
    description: "Runs field erection: plate procurement and receipt, plate allocation, fit-up, seam declaration, repair initiation, water withdrawal reservation, fill advance and appurtenance installation."
    identity: "opaque"
    exclusive_operations:
      - "POST /plate-lots"
      - "POST /plate-lots/{plate_lot_id}/status-transitions"
      - "POST /plate-lots/{plate_lot_id}/allocations"
      - "POST /shell-courses/{shell_course_id}/allocation-release"
      - "POST /shell-courses/{shell_course_id}/fitup"
      - "POST /weld-seams"
      - "POST /weld-seams/{weld_seam_id}/repair-start"
      - "POST /water-withdrawals"
      - "POST /water-withdrawals/{water_withdrawal_id}/cancellation"
      - "POST /hydrotest-plans/{hydrotest_plan_id}/fill-advance"
      - "POST /appurtenances/{appurtenance_id}/installation"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: Welder
    description: "A qualified field welder. X-User-ID is the id of the Welder row the person acts as, and the only write available is logging their own welds."
    identity: "entity_backed:Welder"
    exclusive_operations:
      - "POST /weld-seams/{weld_seam_id}/weld-log"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: QcInspector
    description: "Quality control: schedules and reports nondestructive examinations and performs every coating quality step (surface preparation, dry film thickness, holiday test)."
    identity: "opaque"
    exclusive_operations:
      - "POST /nde-reports"
      - "POST /nde-reports/{nde_report_id}/result"
      - "POST /coating-applications/{coating_application_id}/surface-prep"
      - "POST /coating-applications/{coating_application_id}/dft-readings"
      - "POST /coating-applications/{coating_application_id}/holiday-test"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: AuthorizedInspector
    description: "The independent authorized inspector: qualifies and revokes welders, voids erroneous examination reports, decides hydrotest completion and reviews the commissioning package."
    identity: "opaque"
    exclusive_operations:
      - "POST /welders"
      - "POST /welders/{welder_id}/qualification-actions"
      - "POST /nde-reports/{nde_report_id}/void"
      - "POST /hydrotest-plans/{hydrotest_plan_id}/completion"
      - "POST /commissioning-packages/{commissioning_package_id}/review"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

segregation_of_duties_rules:
  - rule: "The QcInspector who reports an NDE result must not be the AuthorizedInspector user recorded in Welder.qualified_by_user_id for the seam's welder."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "The AuthorizedInspector who records a hydrotest completion decision must not be the user recorded in HydrotestPlan.approved_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "The AuthorizedInspector who reviews a commissioning package must not be the user recorded in CommissioningPackage.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
