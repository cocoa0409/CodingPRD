    instances:
      - name: state_vs_business_safety_on_application_award
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair state-vs-business_safety: awarding an application whose cycle
          is still FORMULA_LOCKED (state violation, priority 4) AND whose
          review_score was recorded by the same GrantOfficer user attempting
          the award (segregation violation, priority 5) returns
          ERR_INVALID_STATE because state precedes business_safety.
