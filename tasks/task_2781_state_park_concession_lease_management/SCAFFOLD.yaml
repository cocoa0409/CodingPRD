    code: 200
    input: []
    output: Lease
    side_effects: ["contract_status ACTIVE|HOLDOVER -> EXPIRED", "each COMPLETED improvement gets unamortized_value_cents from calculations.unamortized_improvement_value then becomes VESTED_IN_AGENCY or COMPENSABLE", "each PROPOSED/RETURNED/APPROVED improvement becomes WITHDRAWN, decrementing Park.open_closure_window_count per formerly APPROVED row", "each SUBMITTED/RETURNED/APPROVED operating plan becomes SUPERSEDED", "possessory_interest_value_cents set", "increments Lease.version by 1"]
  - method: POST
    path: "/leases/{id}/close-out"
    description: "Closes out an expired lease: computes the possessory-interest transfer settlement, optionally records the successor lease, and releases the bond when nothing is owed."
    roles: [ContractingOfficer]
    code: 200
    input: ["successor_lease_id?"]
    output: Lease
    side_effects: ["contract_status EXPIRED -> CLOSED_OUT", "transfer_settlement_net_cents and transfer_settlement_deficiency_cents set by calculations.successor_transfer_settlement", "when successor_lease_id is supplied, that lease's predecessor_lease_id is set to this lease", "the PerformanceBond transitions ACTIVE -> RELEASED only when outstanding_fee_balance_cents == 0", "increments Lease.version by 1"]
  - method: GET
