# =============================================================================
# PRD Benchmark Scaffold — Frozen Prepared Food Manufacturing (task_1286)
# =============================================================================

scenario: |
  Frozen Prepared Food Manufacturing (frozen entree manufacturer): recipe
  scale-up & component sub-assembly, blast freezing capacity & throughput,
  tray/pouch line scheduling & film supply, metal detection/X-ray critical
  control, cold storage inventory & lot release, retail vs foodservice pack
  differences, shelf-life & freezer-burn complaint, co-pack customer changeover

domain_name: frozen-prepared-food-manufacturing
api_prefix: /plant

complexity_profile:
  primary_archetype: compliance_audit        # HACCP CCP verification, lot release gating, segregation of duties
  secondary_archetype: quota_allocation      # blast freezer cells, packaging line windows, film meters, storage cases
  complexity_layers:
    - dual_variant_calculation               # provisional vs final shelf-life expiry; PER_CASE vs PER_KG co-pack billing
    - cascading_side_effects                 # CCP FAIL -> batch hold -> run cancel -> film release; complaint -> lot quarantine -> order releasable recompute
    - rate_threshold_triggers                # lot valid-complaint count >= 3; recipe complaint rate >= 0.005
    - optimistic_concurrency                 # OCC on ProductionOrder.version and ProductionBatch.version
  entity_topology: graph                     # self-referential BOM (RecipeComponent.parent_component_id) + flat FK web
  state_machine_shape: cyclic                # batch rework loop, lot reject/rework loop, film quarantine loop
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties          # CCP performer cannot release; complaint reporter cannot resolve
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Recipe name" }
      - { name: product_style, type: enum, source: input, description: "ENTREE | BOWL | SKILLET" }
      - { name: base_batch_yield_units, type: integer, source: input, description: "Units produced by one base batch; scale-up denominator", constraints: "> 0" }
      - { name: portion_weight_g, type: number, source: input, description: "Net weight per unit in grams", constraints: "> 0" }
      - { name: shelf_life_days, type: integer, source: input, description: "Frozen shelf life in days; lots of recipes with shelf_life_days > 545 require DEEP temperature-class storage", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED | RETIRED" }

  - name: RecipeComponent
    parent: Recipe
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: system, description: "FK -> Recipe.id; owning recipe" }
      - { name: parent_component_id, type: string, source: input, description: "FK -> RecipeComponent.id; null for top-level lines, set for sub-assembly children", constraints: "nullable; must reference a component of the same recipe; graph must stay acyclic at recipe approval" }
      - { name: component_name, type: string, source: input, description: "Component name" }
      - { name: component_type, type: enum, source: input, description: "RAW_INGREDIENT | SUB_ASSEMBLY | PACKAGING" }
      - { name: quantity_per_base_batch, type: number, source: input, description: "Quantity consumed per base batch", constraints: "> 0" }
      - { name: unit_of_measure, type: enum, source: input, description: "KG | L | EACH | M" }
      - { name: scale_exponent, type: number, source: input, default: 1.0, description: "Non-linear scale-up exponent; forced to 1.0 for PACKAGING lines at calculation time", constraints: "0 < x <= 1.5" }
      - { name: allergen_tag, type: string, source: input, description: "Allergen marker (e.g. MILK, SOY); null when allergen-free", constraints: "nullable" }

  - name: CoPackCustomer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: billing_method, type: enum, source: input, description: "PER_CASE | PER_KG — selects the copack_billing variant" }
      - { name: case_rate_cents, type: integer, source: input, description: "Billing rate per case; required iff billing_method == PER_CASE", constraints: ">= 0; null otherwise" }
      - { name: kg_rate_cents, type: integer, source: input, description: "Billing rate per net kg; required iff billing_method == PER_KG", constraints: ">= 0; null otherwise" }
      - { name: requires_allergen_changeover, type: boolean, source: input, default: false, description: "When true, line runs following an allergen-tagged recipe need a 120-minute changeover gap" }
      - { name: base_changeover_minutes, type: integer, source: input, default: 45, description: "Changeover gap in minutes when switching from a different customer's run", constraints: ">= 0" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; recipe must be APPROVED at creation" }
      - { name: copack_customer_id, type: string, source: input, description: "FK -> CoPackCustomer.id; null for house-brand orders", constraints: "nullable" }
      - { name: pack_format, type: enum, source: input, description: "RETAIL | FOODSERVICE — drives line mapping, film meters per unit, and case pack (RETAIL=12/case, FOODSERVICE=6/case)" }
      - { name: units_planned, type: integer, source: input, description: "Total units ordered", constraints: "> 0" }
      - { name: due_at, type: datetime, source: input, description: "Customer due timestamp", constraints: "nullable" }
      - { name: units_packed_total, type: integer, source: computed, default: 0, description: "Sum of units_packed across COMPLETED line runs of all batches of this order" }
      - { name: releasable_cases, type: integer, source: computed, default: 0, description: "Sum of cases_on_hand over lots of this order whose release_status == RELEASED" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "copack_billing output; null when copack_customer_id is null" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: ProductionBatch
    parent: ProductionOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ProductionOrder.id; owning order" }
      - { name: units_planned, type: integer, source: input, description: "Units this batch will produce", constraints: "> 0" }
      - { name: cooked_mass_kg, type: number, source: input, description: "Actual cooked mass recorded at cook step; null until COOKED", constraints: "> 0 when present" }
      - { name: units_packed_total, type: integer, source: computed, default: 0, description: "Sum of units_packed across COMPLETED line runs of this batch" }
      - { name: yield_pct, type: number, source: computed, description: "pack_out_math: round_half_up(units_packed_total / units_planned * 100, 2); null until first completed run" }
      - { name: status, type: enum, source: system, default: CREATED, description: "CREATED | KITTED | COOKED | FROZEN | PACKED | COMPLETED | ON_HOLD | REWORK | CANCELLED" }
      - { name: hold_origin_state, type: enum, source: system, description: "State the batch occupied when it entered ON_HOLD; resume returns here", constraints: "nullable" }
      - { name: hold_reason, type: string, source: system, description: "Manual reason, or CCP_FAIL:<check_type> when auto-held by a failed CCP check", constraints: "nullable" }

  - name: BlastFreezerCell
    parent: null
    common_fields: true
    fields:
      - { name: cell_code, type: string, source: input, description: "Unique cell identifier", constraints: "unique" }
      - { name: capacity_kg, type: integer, source: input, description: "Maximum load per cycle", constraints: "> 0" }
      - { name: min_load_kg, type: integer, source: input, description: "Minimum economic load per cycle", constraints: "> 0 and <= capacity_kg" }
      - { name: pull_down_kg_per_hour, type: integer, source: input, description: "Freezing throughput rate", constraints: "> 0" }
      - { name: sanitation_minutes, type: integer, source: input, description: "Mandatory gap after a cycle's planned_end before the next cycle may start on this cell", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, default: IDLE, description: "IDLE | IN_USE — IN_USE while a cycle is RESERVED or IN_PROGRESS on this cell" }

  - name: FreezingCycle
    parent: ProductionBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> ProductionBatch.id; batch being frozen" }
      - { name: cell_id, type: string, source: input, description: "FK -> BlastFreezerCell.id; when omitted, cell_auto_select picks the cell" }
      - { name: load_kg, type: integer, source: input, description: "Load booked into the cell", constraints: "> 0" }
      - { name: entry_temp_c, type: number, source: input, description: "Product temperature at load-in; > 0 triggers the 1.25x thermal factor" }
      - { name: planned_start, type: datetime, source: input, description: "Window start (half-open interval semantics)" }
      - { name: required_hours, type: integer, source: computed, description: "freezer_cycle_duration output" }
      - { name: planned_end, type: datetime, source: computed, description: "planned_start + required_hours" }
      - { name: actual_end, type: datetime, source: input, description: "Recorded at complete; null until then", constraints: "nullable" }
      - { name: final_core_temp_c, type: number, source: input, description: "Core temperature at complete; VERIFIED requires <= -18", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | IN_PROGRESS | VERIFIED | FAILED | VOIDED" }

  - name: PackagingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line identifier", constraints: "unique" }
      - { name: line_type, type: enum, source: input, description: "TRAY | POUCH — RETAIL orders require TRAY, FOODSERVICE require POUCH" }
      - { name: rate_units_per_minute, type: integer, source: input, description: "Line speed", constraints: "> 0" }
      - { name: supported_film_type, type: enum, source: input, description: "TRAY_FILM | POUCH_FILM" }

  - name: LineRun
    parent: PackagingLine
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> PackagingLine.id; line booked" }
      - { name: batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch being packed" }
      - { name: film_lot_id, type: string, source: input, description: "FK -> FilmSupplyLot.id; film consumed by this run" }
      - { name: planned_start, type: datetime, source: input, description: "Window start (half-open)" }
      - { name: units_planned, type: integer, source: input, description: "Units to pack in this run", constraints: "> 0" }
      - { name: duration_minutes, type: integer, source: computed, description: "ceil(units_planned / line.rate_units_per_minute)" }
      - { name: planned_end, type: datetime, source: computed, description: "planned_start + duration_minutes" }
      - { name: reserved_film_m, type: integer, source: computed, description: "film_reservation output: round per run to whole meters" }
      - { name: units_packed, type: integer, source: input, description: "Actual packed units; set at complete", constraints: "nullable, > 0 when present" }
      - { name: film_meters_consumed, type: integer, source: input, description: "Actual film consumed; set at complete", constraints: "nullable, > 0 when present" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: FilmSupplyLot
    parent: null
    common_fields: true
    fields:
      - { name: film_type, type: enum, source: input, description: "TRAY_FILM | POUCH_FILM" }
      - { name: rolls_received, type: integer, source: input, description: "Rolls received into stock", constraints: "> 0" }
      - { name: meters_per_roll, type: integer, source: input, description: "Length per roll", constraints: "> 0" }
      - { name: meters_received, type: integer, source: computed, description: "rolls_received * meters_per_roll (conserved quantity)" }
      - { name: meters_reserved, type: integer, source: computed, default: 0, description: "Sum of reserved_film_m over SCHEDULED/IN_PROGRESS runs on this lot" }
      - { name: meters_consumed, type: integer, source: computed, default: 0, description: "Sum of film_meters_consumed over COMPLETED runs on this lot" }
      - { name: meters_available, type: integer, source: computed, description: "meters_received - meters_reserved - meters_consumed" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED" }

  - name: CCPCheck
    parent: ProductionBatch
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> ProductionBatch.id; batch verified" }
      - { name: check_type, type: enum, source: input, description: "METAL_DETECTOR | XRAY" }
      - { name: test_piece_detected, type: boolean, source: input, description: "Whether the challenge test piece was detected" }
      - { name: measured_size_mm, type: number, source: input, description: "Smallest detected size", constraints: "nullable" }
      - { name: result, type: enum, source: computed, description: "PASS when test_piece_detected is true, else FAIL" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the recording QATechnician (segregation-of-duties reference)" }
      - { name: performed_at, type: datetime, source: system, description: "Logical clock at creation" }

  - name: StorageSlot
    parent: null
    common_fields: true
    fields:
      - { name: slot_code, type: string, source: input, description: "Unique slot identifier", constraints: "unique" }
      - { name: zone, type: enum, source: input, description: "FREEZER_A | FREEZER_B | DEEP_FREEZE" }
      - { name: temperature_class, type: enum, source: input, description: "STANDARD | DEEP" }
      - { name: capacity_cases, type: integer, source: input, description: "Case capacity", constraints: "> 0" }
      - { name: occupied_cases, type: integer, source: computed, default: 0, description: "Sum of stored_cases over lots with slot_id == this slot" }

  - name: FinishedGoodsLot
    parent: ProductionBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> ProductionBatch.id; producing batch" }
      - { name: slot_id, type: string, source: system, description: "FK -> StorageSlot.id; set by first put-away, immutable afterwards", constraints: "nullable" }
      - { name: pack_format, type: enum, source: system, description: "RETAIL | FOODSERVICE — denormalized from the order at creation" }
      - { name: cases_produced, type: integer, source: computed, description: "ceil(units_packed / CASE_UNITS[pack_format]); CASE_UNITS: RETAIL=12, FOODSERVICE=6" }
      - { name: net_weight_kg, type: number, source: computed, description: "round_half_up(units_packed * portion_weight_g / 1000, 3)" }
      - { name: stored_cases, type: integer, source: computed, default: 0, description: "Cases currently put away in slot_id" }
      - { name: cases_on_hand, type: integer, source: computed, description: "cases_produced - cases withdrawn" }
      - { name: cases_shipped, type: integer, source: computed, default: 0, description: "Cases withdrawn with purpose SHIPMENT" }
      - { name: provisional_expiry_date, type: string, source: computed, description: "date(verified cycle.planned_start) + recipe.shelf_life_days (planning variant)" }
      - { name: final_expiry_date, type: string, source: computed, description: "date(verified cycle.actual_end) + recipe.shelf_life_days (release/complaint variant)" }
      - { name: valid_complaint_count, type: integer, source: computed, default: 0, description: "Complaints of this lot resolved VALID" }
      - { name: release_status, type: enum, source: system, default: QA_PENDING, description: "QA_PENDING | RELEASED | REJECTED | QUARANTINED | RECALLED | DEPLETED" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> FinishedGoodsLot.id; complained lot" }
      - { name: complaint_type, type: enum, source: input, description: "FREEZER_BURN | TEXTURE | FOREIGN_MATERIAL | OFF_ODOR" }
      - { name: units_affected, type: integer, source: input, description: "Affected cases", constraints: "> 0 and <= lot.cases_produced" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (segregation-of-duties reference)" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: days_before_expiry, type: integer, source: computed, description: "final_expiry_date - date(reported_at), in whole days; negative when reported after expiry" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_INVESTIGATION | RESOLVED_VALID | RESOLVED_INVALID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /plant/recipes/{recipeId}/approve"
        actor: PlantManager
        preconditions:
          - "recipe has >= 1 component (else ERR_RECIPE_NO_COMPONENTS)"
          - "component graph over parent_component_id is acyclic (else ERR_RECIPE_COMPONENT_CYCLE)"
        side_effects: ["status := APPROVED", "increments Recipe.version by 1"]
      - from: APPROVED
        to: DRAFT
        trigger: "POST /plant/recipes/{recipeId}/revise"
        actor: PlantManager
        preconditions:
          - "no batch of any order of this recipe is in a non-terminal state (else ERR_RECIPE_BUSY)"
        side_effects: ["status := DRAFT", "increments Recipe.version by 1"]
      - from: APPROVED
        to: RETIRED
        trigger: "POST /plant/recipes/{recipeId}/retire"
        actor: PlantManager
        preconditions:
          - "no batch of any order of this recipe is in a non-terminal state (else ERR_RECIPE_BUSY)"
        side_effects: ["status := RETIRED", "increments Recipe.version by 1"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /plant/recipes/{recipeId}/retire"
        actor: PlantManager
        preconditions: []
        side_effects: ["status := RETIRED", "increments Recipe.version by 1"]

  - entity: ProductionOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "system (automatic when the first batch is created under the order)"
        actor: system
        preconditions: []
        side_effects: ["status := IN_PROGRESS", "increments ProductionOrder.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when every batch of the order is in {COMPLETED, CANCELLED} and at least one is COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["status := COMPLETED", "increments ProductionOrder.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /plant/production-orders/{orderId}/cancel"
        actor: ProductionPlanner
        preconditions: ["every batch is in {CREATED, CANCELLED} (else ERR_ORDER_NOT_OPEN)"]
        side_effects:
          - "status := CANCELLED"
          - "every CREATED batch cascades to CANCELLED"
          - "increments ProductionOrder.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /plant/production-orders/{orderId}/cancel"
        actor: ProductionPlanner
        preconditions: ["every batch is in {CREATED, CANCELLED} (else ERR_ORDER_NOT_OPEN)"]
        side_effects:
          - "status := CANCELLED"
          - "every CREATED batch cascades to CANCELLED"
          - "increments ProductionOrder.version by 1"

  - entity: ProductionBatch
    initial_state: CREATED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: CREATED
        to: KITTED
        trigger: "POST /plant/production-batches/{batchId}/kit"
        actor: LineOperator
        preconditions:
          - "order.status IN {PLANNED, IN_PROGRESS} (else ERR_ORDER_NOT_OPEN)"
          - "recipe of the order is APPROVED (else ERR_RECIPE_NOT_APPROVED)"
        side_effects: ["status := KITTED", "increments ProductionBatch.version by 1"]
      - from: REWORK
        to: KITTED
        trigger: "POST /plant/production-batches/{batchId}/kit"
        actor: LineOperator
        preconditions: ["order.status == IN_PROGRESS (else ERR_ORDER_NOT_OPEN)"]
        side_effects: ["status := KITTED (rework loop)", "increments ProductionBatch.version by 1"]
      - from: KITTED
        to: COOKED
        trigger: "POST /plant/production-batches/{batchId}/cook"
        actor: LineOperator
        preconditions: []
        side_effects: ["cooked_mass_kg := input", "status := COOKED", "increments ProductionBatch.version by 1"]
      - from: COOKED
        to: FROZEN
        trigger: "system (automatic when a FreezingCycle of this batch transitions to VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["status := FROZEN", "increments ProductionBatch.version by 1"]
      - from: FROZEN
        to: PACKED
        trigger: "system (automatic when a LineRun of this batch transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["status := PACKED", "increments ProductionBatch.version by 1"]
      - from: PACKED
        to: COMPLETED
        trigger: "POST /plant/production-batches/{batchId}/complete"
        actor: LineOperator
        preconditions: ["at least one FinishedGoodsLot exists for this batch (else ERR_BATCH_STATE)"]
        side_effects:
          - "status := COMPLETED"
          - "order auto-transition check (IN_PROGRESS -> COMPLETED)"
          - "increments ProductionBatch.version by 1"
      - from: KITTED
        to: ON_HOLD
        trigger: "POST /plant/production-batches/{batchId}/hold"
        actor: QATechnician
        preconditions: []
        side_effects: ["hold_origin_state := KITTED", "hold_reason := input.reason", "status := ON_HOLD", "increments ProductionBatch.version by 1"]
      - from: COOKED
        to: ON_HOLD
        trigger: "POST /plant/production-batches/{batchId}/hold"
        actor: QATechnician
        preconditions: []
        side_effects: ["hold_origin_state := COOKED", "hold_reason := input.reason", "status := ON_HOLD", "increments ProductionBatch.version by 1"]
      - from: FROZEN
        to: ON_HOLD
        trigger: "POST /plant/production-batches/{batchId}/hold"
        actor: QATechnician
        preconditions: []
        side_effects: ["hold_origin_state := FROZEN", "hold_reason := input.reason", "status := ON_HOLD", "increments ProductionBatch.version by 1"]
      - from: PACKED
        to: ON_HOLD
        trigger: "POST /plant/production-batches/{batchId}/hold"
        actor: QATechnician
        preconditions: []
        side_effects: ["hold_origin_state := PACKED", "hold_reason := input.reason", "status := ON_HOLD", "increments ProductionBatch.version by 1"]
      - from: FROZEN
        to: ON_HOLD
        trigger: "system (automatic when a CCPCheck with result FAIL is recorded for this batch)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_origin_state := FROZEN; hold_reason := 'CCP_FAIL:<check_type>'; status := ON_HOLD"
          - "every SCHEDULED LineRun of this batch transitions to CANCELLED"
          - "each cancelled run releases its film reservation: film_lot.meters_reserved -= run.reserved_film_m (hop 3 of the CCP cascade)"
          - "increments ProductionBatch.version by 1"
      - from: PACKED
        to: ON_HOLD
        trigger: "system (automatic when a CCPCheck with result FAIL is recorded for this batch)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_origin_state := PACKED; hold_reason := 'CCP_FAIL:<check_type>'; status := ON_HOLD"
          - "every SCHEDULED LineRun of this batch transitions to CANCELLED with film reservation release"
          - "increments ProductionBatch.version by 1"
      - from: ON_HOLD
        to: KITTED
        trigger: "POST /plant/production-batches/{batchId}/resume"
        actor: QATechnician
        preconditions:
          - "hold_origin_state == KITTED (resume returns to hold_origin_state)"
          - "if hold_reason starts with 'CCP_FAIL:<type>', the latest CCPCheck of that type on this batch must be PASS (else ERR_BATCH_STATE)"
        side_effects: ["status := hold_origin_state", "hold_origin_state := null", "hold_reason := null", "increments ProductionBatch.version by 1"]
      - from: ON_HOLD
        to: COOKED
        trigger: "POST /plant/production-batches/{batchId}/resume"
        actor: QATechnician
        preconditions: ["hold_origin_state == COOKED", "CCP_FAIL holds require a newer PASS of the same check_type"]
        side_effects: ["status := COOKED", "hold fields cleared", "increments ProductionBatch.version by 1"]
      - from: ON_HOLD
        to: FROZEN
        trigger: "POST /plant/production-batches/{batchId}/resume"
        actor: QATechnician
        preconditions: ["hold_origin_state == FROZEN", "CCP_FAIL holds require a newer PASS of the same check_type"]
        side_effects: ["status := FROZEN", "hold fields cleared", "increments ProductionBatch.version by 1"]
      - from: ON_HOLD
        to: PACKED
        trigger: "POST /plant/production-batches/{batchId}/resume"
        actor: QATechnician
        preconditions: ["hold_origin_state == PACKED", "CCP_FAIL holds require a newer PASS of the same check_type"]
        side_effects: ["status := PACKED", "hold fields cleared", "increments ProductionBatch.version by 1"]
      - from: ON_HOLD
        to: REWORK
        trigger: "POST /plant/production-batches/{batchId}/rework"
        actor: QAManager
        preconditions: []
        side_effects: ["status := REWORK", "hold fields cleared", "increments ProductionBatch.version by 1"]
      - from: CREATED
        to: CANCELLED
        trigger: "POST /plant/production-batches/{batchId}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["status := CANCELLED", "increments ProductionBatch.version by 1"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /plant/production-batches/{batchId}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "status := CANCELLED"
          - "RESERVED FreezingCycles of this batch -> VOIDED"
          - "SCHEDULED LineRuns of this batch -> CANCELLED with film reservation release"
          - "increments ProductionBatch.version by 1"

  - entity: FreezingCycle
    initial_state: RESERVED
    terminal_states: [VERIFIED, FAILED, VOIDED]
    transitions:
      - from: RESERVED
        to: IN_PROGRESS
        trigger: "POST /plant/freezing-cycles/{cycleId}/start"
        actor: LineOperator
        preconditions: ["batch.status == COOKED (else ERR_BATCH_STATE)"]
        side_effects: ["status := IN_PROGRESS", "increments FreezingCycle.version by 1"]
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /plant/freezing-cycles/{cycleId}/complete"
        actor: LineOperator
        preconditions: ["computed: final_core_temp_c <= -18 AND (actual_end - planned_start) <= required_hours + 2 hours"]
        side_effects:
          - "status := VERIFIED; actual_end and final_core_temp_c recorded"
          - "batch COOKED -> FROZEN (auto)"
          - "increments FreezingCycle.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /plant/freezing-cycles/{cycleId}/complete"
        actor: LineOperator
        preconditions: ["computed: final_core_temp_c > -18 OR (actual_end - planned_start) > required_hours + 2 hours"]
        side_effects:
          - "status := FAILED"
          - "batch remains COOKED (planner may book a replacement cycle)"
          - "increments FreezingCycle.version by 1"
      - from: RESERVED
        to: VOIDED
        trigger: "POST /plant/freezing-cycles/{cycleId}/void"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["status := VOIDED", "increments FreezingCycle.version by 1"]
      - from: RESERVED
        to: VOIDED
        trigger: "system (automatic when a new FreezingCycle is created for the same batch — the new reservation supersedes this one)"
        actor: system
        preconditions: []
        side_effects: ["status := VOIDED", "increments FreezingCycle.version by 1"]

  - entity: LineRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /plant/line-runs/{runId}/start"
        actor: LineOperator
        preconditions:
          - "batch.status == FROZEN (else ERR_BATCH_STATE)"
          - "film lot status == AVAILABLE (else ERR_FILM_LOT_QUARANTINED)"
        side_effects: ["status := IN_PROGRESS", "increments LineRun.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /plant/line-runs/{runId}/complete"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "status := COMPLETED; units_packed and film_meters_consumed recorded"
          - "film lot: meters_reserved -= reserved_film_m; meters_consumed += film_meters_consumed"
          - "creates FinishedGoodsLot (release_status QA_PENDING, pack_out_math computes cases_produced / net_weight_kg / expiry fields)"
          - "batch.units_packed_total += units_packed; batch.yield_pct recomputed; batch FROZEN -> PACKED (auto)"
          - "order.units_packed_total += units_packed"
          - "increments LineRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/line-runs/{runId}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "status := CANCELLED"
          - "film lot: meters_reserved -= reserved_film_m (reservation released)"
          - "increments LineRun.version by 1"

  - entity: FilmSupplyLot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /plant/film-lots/{lotId}/quarantine"
        actor: QATechnician
        preconditions: []
        side_effects: ["status := QUARANTINED", "increments FilmSupplyLot.version by 1"]
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /plant/film-lots/{lotId}/release-quarantine"
        actor: QAManager
        preconditions: []
        side_effects: ["status := AVAILABLE", "increments FilmSupplyLot.version by 1"]

  - entity: FinishedGoodsLot
    initial_state: QA_PENDING
    terminal_states: [RECALLED, DEPLETED]
    transitions:
      - from: QA_PENDING
        to: RELEASED
        trigger: "POST /plant/lots/{lotId}/release"
        actor: QAManager
        preconditions:
          - "batch.status == COMPLETED (else ERR_BATCH_STATE)"
          - "for each check_type IN {METAL_DETECTOR, XRAY}: the latest CCPCheck of that type on the batch exists and is PASS (else ERR_CCP_NOT_CURRENT)"
          - "current logical date <= final_expiry_date (else ERR_LOT_EXPIRED)"
          - "segregation: releaser X-User-ID != performed_by_user_id of every CCPCheck on the batch (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "release_status := RELEASED; final_expiry_date recomputed per shelf_life_expiry final variant"
          - "order.releasable_cases += cases_on_hand; order.billed_amount_cents recomputed per copack_billing variant"
          - "increments FinishedGoodsLot.version by 1"
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /plant/lots/{lotId}/release"
        actor: QAManager
        preconditions: ["same CCP / expiry / segregation preconditions as QA_PENDING -> RELEASED"]
        side_effects: ["release_status := RELEASED", "order.releasable_cases += cases_on_hand", "increments FinishedGoodsLot.version by 1"]
      - from: QA_PENDING
        to: REJECTED
        trigger: "POST /plant/lots/{lotId}/reject"
        actor: QAManager
        preconditions: []
        side_effects: ["release_status := REJECTED", "increments FinishedGoodsLot.version by 1"]
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /plant/lots/{lotId}/reject"
        actor: QAManager
        preconditions: []
        side_effects: ["release_status := REJECTED", "increments FinishedGoodsLot.version by 1"]
      - from: REJECTED
        to: QA_PENDING
        trigger: "POST /plant/lots/{lotId}/rework"
        actor: QAManager
        preconditions: []
        side_effects: ["release_status := QA_PENDING (rework loop)", "increments FinishedGoodsLot.version by 1"]
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /plant/lots/{lotId}/quarantine (manual) OR system (complaint_contagion: valid_complaint_count >= 3, or recipe complaint rate >= 0.005)"
        actor: QATechnician | system
        preconditions: []
        side_effects:
          - "release_status := QUARANTINED"
          - "order.releasable_cases -= cases_on_hand (ledger sync hop of the complaint cascade)"
          - "increments FinishedGoodsLot.version by 1"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /plant/lots/{lotId}/recall"
        actor: QAManager
        preconditions: []
        side_effects: ["release_status := RECALLED", "order.releasable_cases -= cases_on_hand", "increments FinishedGoodsLot.version by 1"]
      - from: QUARANTINED
        to: RECALLED
        trigger: "POST /plant/lots/{lotId}/recall"
        actor: QAManager
        preconditions: []
        side_effects: ["release_status := RECALLED", "increments FinishedGoodsLot.version by 1"]
      - from: RELEASED
        to: DEPLETED
        trigger: "system (automatic when cases_on_hand reaches 0 after a withdraw)"
        actor: system
        preconditions: []
        side_effects: ["release_status := DEPLETED", "increments FinishedGoodsLot.version by 1"]

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED_VALID, RESOLVED_INVALID]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /plant/complaints/{complaintId}/investigate"
        actor: QATechnician
        preconditions: []
        side_effects: ["status := UNDER_INVESTIGATION", "increments Complaint.version by 1"]
      - from: UNDER_INVESTIGATION
        to: RESOLVED_VALID
        trigger: "POST /plant/complaints/{complaintId}/resolve with verdict VALID"
        actor: QAManager
        preconditions: ["segregation: resolver X-User-ID != complaint.reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "status := RESOLVED_VALID"
          - "lot.valid_complaint_count += 1 (hop 1)"
          - "if lot.valid_complaint_count >= 3 and lot RELEASED: lot -> QUARANTINED and order.releasable_cases recomputed (hop 2)"
          - "recipe complaint rate recomputed; if >= 0.005 every RELEASED lot of the recipe -> QUARANTINED with its own order.releasable_cases recompute (hop 3)"
          - "increments Complaint.version by 1"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_INVALID
        trigger: "POST /plant/complaints/{complaintId}/resolve with verdict INVALID"
        actor: QAManager
        preconditions: ["segregation: resolver X-User-ID != complaint.reported_by_user_id"]
        side_effects: ["status := RESOLVED_INVALID", "increments Complaint.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: batch-create-stale-order
    parent_entity: ProductionOrder
    write_endpoint: "POST /plant/production-orders/{orderId}/batches"
    occ_field: expected_order_version
    description: |
      Creating a ProductionBatch against a ProductionOrder whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just added a batch (legitimately advancing the order), so the
      current writer's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cycle-create-stale-batch
    parent_entity: ProductionBatch
    write_endpoint: "POST /plant/production-batches/{batchId}/freezing-cycles"
    occ_field: expected_batch_version
    description: |
      Creating a FreezingCycle against a ProductionBatch whose version has
      advanced since the client last observed it is rejected. A newly created
      cycle legitimately supersedes any prior RESERVED cycle of the batch, so
      the current writer's view of the batch is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: recipe_scale_up
    trigger: "GET /plant/recipes/{recipeId}/scale-preview"
    algorithm: topological
    formula: |
      scale_factor_raw = target_units / recipe.base_batch_yield_units
      scale_factor = min(max(scale_factor_raw, SCALE_MIN), SCALE_MAX)
      Components are traversed in topological order over parent_component_id.
      effective_exponent(c) = product of scale_exponent along the ancestor
        chain from the root down to and including c; for PACKAGING components
        the component's own scale_exponent is forced to 1.0 (ancestors still
        contribute).
      scaled_qty(c) = round_half_up(c.quantity_per_base_batch
                                    * scale_factor ^ effective_exponent(c), 3)
    input_set: "all RecipeComponents of the recipe, regardless of recipe status"
    constants:
      SCALE_MIN: 0.25
      SCALE_MAX: 8.0
    precision: "3 decimal places, round_half_up"

  - name: film_reservation
    trigger: "LineRun creation (reserve), cancellation (release), completion (consume)"
    algorithm: aggregation
    formula: |
      meters_per_unit = METERS_PER_UNIT[order.pack_format]   # RETAIL 0.42, FOODSERVICE 0.35
      run.reserved_film_m = round_half_up(run.units_planned * meters_per_unit * (1 + WASTE_PCT), 0)
      # ROUNDING ORDER IS PINNED: round each run to whole meters FIRST,
      # then sum per-run values into the lot-level reservation.
      # (Summing raw values and rounding once produces different totals.)
      film_lot.meters_reserved = sum(reserved_film_m over runs of this lot with status IN {SCHEDULED, IN_PROGRESS})
      film_lot.meters_consumed = sum(film_meters_consumed over COMPLETED runs of this lot)
      film_lot.meters_available = meters_received - meters_reserved - meters_consumed
      At creation require meters_available >= run.reserved_film_m (>= is inclusive: equality is allowed).
    input_set: "LineRuns of the FilmSupplyLot in states {SCHEDULED, IN_PROGRESS, COMPLETED}"
    constants:
      WASTE_PCT: 0.06
      RETAIL_METERS_PER_UNIT: 0.42
      FOODSERVICE_METERS_PER_UNIT: 0.35
    precision: "whole meters per run, round_half_up"

  - name: freezer_cycle_duration
    trigger: "FreezingCycle creation"
    algorithm: threshold
    formula: |
      base_hours = ceil(load_kg / cell.pull_down_kg_per_hour)
      if entry_temp_c > 0: base_hours = ceil(base_hours * HIGH_TEMP_FACTOR)
      required_hours = max(MIN_DWELL_HOURS, base_hours)
      planned_end = planned_start + required_hours hours
      Verification at complete: VERIFIED iff final_core_temp_c <= CORE_TARGET_C
      AND (actual_end - planned_start) <= required_hours + VERIFY_GRACE_HOURS hours; else FAILED.
    input_set: "the new cycle and its cell"
    constants:
      MIN_DWELL_HOURS: 4
      HIGH_TEMP_FACTOR: 1.25
      CORE_TARGET_C: -18
      VERIFY_GRACE_HOURS: 2
    precision: "integer hours"

  - name: shelf_life_expiry
    trigger: "FinishedGoodsLot creation (both variants), lot release (final recomputed)"
    algorithm: forward_looking
    formula: |
      Let cyc = the VERIFIED FreezingCycle of the lot's batch (latest by created_at if several).
      provisional_expiry_date = date(cyc.planned_start) + recipe.shelf_life_days
      final_expiry_date       = date(cyc.actual_end)    + recipe.shelf_life_days
    input_set: "the lot's batch's VERIFIED FreezingCycle and the order's recipe"
    precision: "whole days (ISO date)"
    variants:
      - name: provisional
        when: "planning, labels, and pre-verification projections"
        difference: "anchored to the PLANNED freeze start; diverges from final whenever the cycle verifies on a different calendar date than planned"
      - name: final
        when: "lot release gating, withdrawal gating, and complaint days_before_expiry"
        difference: "anchored to the ACTUAL verified cycle end; recomputed at release"

  - name: copack_billing
    trigger: "lot release (order.billed_amount_cents recompute)"
    algorithm: aggregation
    formula: |
      Let R = all lots of the order with release_status == RELEASED.
      PER_CASE variant: billed_amount_cents = sum(lot.cases_produced for R) * customer.case_rate_cents
      PER_KG   variant: billed_amount_cents = round_half_up(sum(lot.net_weight_kg for R) * customer.kg_rate_cents, 0)
      House orders (copack_customer_id null): billed_amount_cents = null.
    input_set: "RELEASED lots of the order"
    precision: "integer cents; PER_KG rounds once on the aggregate"
    variants:
      - name: per_case
        when: "customer.billing_method == PER_CASE"
        difference: "bills on case count — two valid algorithms produce different totals for identical physical output"
      - name: per_kg
        when: "customer.billing_method == PER_KG"
        difference: "bills on net weight; rounds once on the aggregate (never per lot)"

  - name: complaint_contagion
    trigger: "complaint resolved VALID"
    algorithm: threshold
    formula: |
      lot.valid_complaint_count += 1
      if lot.valid_complaint_count >= LOT_QUARANTINE_THRESHOLD and lot.release_status == RELEASED:
          lot -> QUARANTINED (order.releasable_cases -= lot.cases_on_hand)
      shipped = sum(cases withdrawn with purpose SHIPMENT in the trailing 90 days, window (clock-90d, clock],
                    over all lots of the same recipe)
      affected = sum(units_affected over RESOLVED_VALID complaints created in the trailing 90 days,
                     over all lots of the same recipe)
      if shipped > 0 and affected / shipped >= RECIPE_RATE_THRESHOLD:
          every lot of the recipe with release_status == RELEASED -> QUARANTINED
          (each quarantine recomputes its own order.releasable_cases)
      Boundary precision: exactly LOT_QUARANTINE_THRESHOLD triggers; exactly RECIPE_RATE_THRESHOLD triggers (>=, not >).
    input_set: "lots of the recipe; complaints RESOLVED_VALID; withdrawals with purpose SHIPMENT"
    constants:
      LOT_QUARANTINE_THRESHOLD: 3
      RECIPE_RATE_THRESHOLD: 0.005
      WINDOW_DAYS: 90
    precision: "rate compared in exact rational arithmetic (affected/shipped), no float rounding"

  - name: cell_auto_select
    trigger: "FreezingCycle creation with cell_id omitted"
    algorithm: weighted_scoring
    formula: |
      candidates = cells where capacity_kg >= load_kg >= min_load_kg
                   AND no cycle of that cell with status IN {RESERVED, IN_PROGRESS}
                   violates the sanitation-buffer window rule
      rank: capacity_kg ASC (best fit); tie-break: created_at ASC, then cell_code ASC
      empty candidate set -> ERR_NO_CELL_AVAILABLE
    input_set: "all BlastFreezerCells"
    precision: "n/a (selector)"

  - name: pack_out_math
    trigger: "LineRun completion"
    algorithm: aggregation
    formula: |
      cases_produced = ceil(units_packed / CASE_UNITS[pack_format])   # RETAIL 12, FOODSERVICE 6
      net_weight_kg = round_half_up(units_packed * recipe.portion_weight_g / 1000, 3)
      batch.units_packed_total += units_packed
      batch.yield_pct = round_half_up(batch.units_packed_total / batch.units_planned * 100, 2)
    input_set: "the completing run, its batch, the order's recipe"
    constants:
      RETAIL_CASE_UNITS: 12
      FOODSERVICE_CASE_UNITS: 6
    precision: "cases integer (ceil); kg 3 decimals round_half_up; yield 2 decimals round_half_up"

  - name: storage_occupancy
    trigger: "lot put-away and withdraw"
    algorithm: aggregation
    formula: |
      slot.occupied_cases = sum(lot.stored_cases over lots with slot_id == slot.id)
      put-away: require slot.occupied_cases + cases <= slot.capacity_cases (<= is inclusive: exact fill allowed)
      withdraw: require cases <= lot.stored_cases
      Invariant: occupied_cases + free_cases == capacity_cases at all times.
    input_set: "lots stored in the slot"
    precision: "integer cases"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted for the endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "segregation of duties: lot release user differs from every CCP performer on the batch; complaint resolver differs from the complaint reporter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /plant/lots/{lotId}/release; POST /plant/complaints/{complaintId}/resolve" }
  - { priority: 4, category: auth, check: "CoPackCustomer scope: X-User-ID must equal the copack_customer_id of the order chain being read or complained about", error_id: ERR_CROSS_CUSTOMER_ACCESS, http_status: 403, applies_to: "CoPackCustomer-role calls on orders, lots, complaints" }
  - { priority: 5, category: business_constraint, check: "request shape: required fields present, types correct, enum members valid, numeric ranges respected (e.g. units > 0, scale_exponent in (0, 1.5])", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: existence, check: "path ids exist left-to-right, then body foreign keys exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 7, category: state, check: "OCC: expected_order_version / expected_batch_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /plant/production-orders/{orderId}/batches; POST /plant/production-batches/{batchId}/freezing-cycles" }
  - { priority: 8, category: state, check: "state preconditions: transition from-state valid; recipe APPROVED for order/batch use; order open for batch creation; batch COOKED for cycle start; batch FROZEN for run start; lot in a complainable status {RELEASED, QUARANTINED, DEPLETED}; recipe mutable (DRAFT) for component edits", error_id: "ERR_BATCH_STATE | ERR_CYCLE_STATE | ERR_RUN_STATE | ERR_LOT_STATE | ERR_COMPLAINT_STATE | ERR_RECIPE_STATE | ERR_RECIPE_NOT_APPROVED | ERR_ORDER_NOT_OPEN | ERR_RECIPE_BUSY", http_status: 409, applies_to: "all transition and state-dependent endpoints" }
  - { priority: 9, category: business_safety, check: "critical-control safety: latest CCPCheck of each type is PASS before lot release; film lot not QUARANTINED at run creation and run start", error_id: "ERR_CCP_NOT_CURRENT | ERR_FILM_LOT_QUARANTINED", http_status: 409, applies_to: "lot release; line-run create/start" }
  - { priority: 10, category: business_temporal, check: "temporal windows: freezer cell window + sanitation buffer conflict; packaging line window + changeover-buffer conflict; lot not expired for release / SHIPMENT withdrawal (current date <= final_expiry_date)", error_id: "ERR_CELL_WINDOW_CONFLICT | ERR_LINE_WINDOW_CONFLICT | ERR_LOT_EXPIRED", http_status: 409, applies_to: "cycle create; run create; lot release; lot withdraw" }
  - { priority: 11, category: business_constraint, check: "capacity/constraint: freezer load within [min_load_kg, capacity_kg]; cell auto-select pool non-empty; line_type matches pack_format (RETAIL->TRAY, FOODSERVICE->POUCH); film_type matches line; film meters sufficient; slot capacity and temperature class (shelf_life_days > 545 requires DEEP); withdrawal within stored cases; recipe approval requires >= 1 component and an acyclic component graph", error_id: "ERR_CAPACITY_EXCEEDED | ERR_BELOW_MIN_LOAD | ERR_NO_CELL_AVAILABLE | ERR_LINE_FORMAT_MISMATCH | ERR_FILM_TYPE_MISMATCH | ERR_FILM_INSUFFICIENT | ERR_STORAGE_CAPACITY_EXCEEDED | ERR_TEMPERATURE_CLASS_MISMATCH | ERR_INSUFFICIENT_CASES | ERR_RECIPE_NO_COMPONENTS | ERR_RECIPE_COMPONENT_CYCLE", http_status: 409, applies_to: "cycle create; run create; put-away; withdraw; recipe approve" }
  - { priority: 12, category: business_fiscal, check: "aggregate/fiscal: complaint units_affected <= lot.cases_produced", error_id: ERR_COMPLAINT_UNITS_INVALID, http_status: 422, applies_to: "POST /plant/complaints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/plant/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Recipe ---
  - method: POST
    path: "/plant/recipes"
    description: "Create a recipe (status DRAFT)"
    roles: [PlantManager]
    code: 201
    input: [name, product_style, base_batch_yield_units, portion_weight_g, shelf_life_days]
    output: Recipe
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/plant/recipes"
    description: "List recipes"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Recipe[]
    side_effects: []
  - method: GET
    path: "/plant/recipes/{recipeId}"
    description: "Get a recipe"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: []
    output: Recipe
    side_effects: []
  - method: POST
    path: "/plant/recipes/{recipeId}/components"
    description: "Add a BOM component line (recipe must be DRAFT)"
    roles: [PlantManager]
    code: 201
    input: [component_name, component_type, quantity_per_base_batch, unit_of_measure, "parent_component_id?", "scale_exponent?", "allergen_tag?"]
    output: RecipeComponent
