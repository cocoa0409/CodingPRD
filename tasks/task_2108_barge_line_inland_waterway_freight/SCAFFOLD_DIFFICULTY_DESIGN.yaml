              as: WaterwayAdmin
            - call: "POST /shippers"
              payload: { name: "Delta Grain Co", credit_limit_cents: 900000000 }
              as: ContractManager
              captures: { sh_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-1001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-1002", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: WaterwayAdmin
            - call: "POST /freight-contracts"
              payload: { shipper_id: "${sh_id}", commodity_id: "${corn_id}", contracted_tons: 3400, origin_mile: 600, destination_mile: 200, laytime_hours: 12, declared_value_cents_per_ton: 22000 }
              as: ContractManager
