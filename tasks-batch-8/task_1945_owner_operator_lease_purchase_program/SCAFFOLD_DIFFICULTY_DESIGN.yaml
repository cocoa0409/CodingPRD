            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-10", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st2: $.data.id } }
