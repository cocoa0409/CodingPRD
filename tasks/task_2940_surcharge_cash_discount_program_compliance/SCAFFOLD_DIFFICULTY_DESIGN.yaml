# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2940 - Surcharge & Cash Discount Program Compliance
#
# Fixture conventions shared by every instance below (each instance still drives
# empty-DB -> its own precondition state with its own explicit call chain):
#   logical clock starts at 2026-08-01T00:00:00Z
#   jurisdictions   AZ  surcharge yes cap 4.0  | cash yes | posting no  | signage no  | receipt no  | PERMISSIVE
#                   NY  surcharge yes cap 4.0  | cash yes | posting yes | signage yes | receipt yes | MONITORED
#                   TX  surcharge yes cap 2.0  | cash yes | posting no  | signage no  | receipt no  | PERMISSIVE
#                   CT  surcharge NO  cap null | cash yes | posting yes | signage yes | receipt no  | RESTRICTIVE
#                   MA  surcharge yes cap 3.5  | cash NO  | posting no  | signage no  | receipt no  | PERMISSIVE
#   cost docs       docA 1.85 / 0.14 / 10c  -> average_ticket 5000 -> documented_cost_pct 2.1900
#                   docB 2.55 / 0.20 / 15c  -> average_ticket 5000 -> documented_cost_pct 3.0500
#                   docC 1.85 / 0.14 / 10c  -> average_ticket 5308 -> documented_cost_pct 2.1784
#   user ids        admin-1 (PlatformAdmin), officer-1 / officer-2 (ComplianceOfficer),
#                   auditor-1 (NetworkAuditor), regulator-1 (StateRegulator),
#                   MerchantOperator authenticates as the Merchant id, TerminalAgent as the Terminal id
#   NOTICE_PERIOD_DAYS = 30, so a registration submitted at 2026-08-01T00:00:00Z
#   may be effectuated from 2026-08-31T00:00:00Z inclusive.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: price_resolution_surcharge_addon_vs_cash_discount_deduct
        grounds:
          - calculations.transaction_price_resolution
          - calculations.effective_surcharge_cap
          - entities.Transaction.fields.total_amount_cents
          - entities.Transaction.fields.cash_price_cents
          - entities.Transaction.fields.outcome
          - entities.Merchant.fields.gross_surcharge_collected_cents
        distinguishing_aspect: |
          This instance's two variants live in the Transaction MONEY domain: identical base_amount_cents 10000
          and identical applied_rate_pct 2.0 yield total_amount_cents 10200 under surcharge_add_on and 10000
          under cash_discount_deduct, and only the surcharge arm moves Merchant.gross_surcharge_collected_cents.
        test_recipe:
          setup:
            - "Jurisdiction TX (surcharge permitted, statutory cap 2.0, cash discount permitted, no posting/signage/receipt mandates)."
            - "One merchant with cost documentation docA (documented_cost_pct 2.1900), so the TX statutory cap 2.0 binds the SURCHARGE program."
            - "Two ACTIVE programs of that merchant sharing docA: a SURCHARGE program and a CASH_DISCOUNT program, each with a VISA/ALL rate rule at 2.0 percent effective 2026-08-01 through 2026-12-31."
            - "One ENFORCING terminal bound to each program; logical clock at 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", surcharge_permitted: true, surcharge_cap_pct: 2.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_tx_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_tx_id}", legal_name: "Lone Star Goods LLC", mcc: "5999" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/tx/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_tx_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_s_id: $.data.id, prog_s_v0: $.data.version }
            - call: "POST /surcharge-programs/${prog_s_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_s_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_s_id}/network-registrations"
              payload: { network: "VISA", registration_ref: "VS-2940-TX-001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { reg_s_id: $.data.id }
            - call: "POST /network-registrations/${reg_s_id}/decision"
              payload: { decision: "ACKNOWLEDGE", decision_note: "registration accepted" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_tx_id}", cost_documentation_id: "${doc_a_id}", program_type: "CASH_DISCOUNT", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_c_id: $.data.id, prog_c_v0: $.data.version }
            - call: "POST /surcharge-programs/${prog_c_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_c_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_c_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /network-registrations/${reg_s_id}/effectuate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_s_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /merchants/${merch_id}/terminals"
              payload: { serial_number: "T-S-001" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
              captures: { term_s_id: $.data.id }
            - call: "POST /terminals/${term_s_id}/configure"
              payload: { program_id: "${prog_s_id}", debit_exclusion_enabled: true, bin_table_version: "BIN-2026.08" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
            - call: "POST /terminals/${term_s_id}/state-actions"
              payload: { action: "ENFORCE" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/terminals"
              payload: { serial_number: "T-C-001" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
              captures: { term_c_id: $.data.id }
            - call: "POST /terminals/${term_c_id}/configure"
              payload: { program_id: "${prog_c_id}", debit_exclusion_enabled: true, bin_table_version: "BIN-2026.08" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
            - call: "POST /terminals/${term_c_id}/state-actions"
              payload: { action: "ENFORCE" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
          trigger:
            - call: "POST /transactions"
              payload: { terminal_id: "${term_s_id}", program_id: "${prog_s_id}", card_brand: "VISA", card_funding: "CREDIT", product_tier: "CONSUMER_CREDIT", base_amount_cents: 10000, requested_surcharge_cents: 200, receipt_line_present: true }
              as: TerminalAgent
              as_user_id: "${term_s_id}"
              captures: { txn_s_id: $.data.id }
            - call: "POST /transactions"
              payload: { terminal_id: "${term_c_id}", program_id: "${prog_c_id}", card_brand: "VISA", card_funding: "CREDIT", product_tier: "CONSUMER_CREDIT", base_amount_cents: 10000, requested_surcharge_cents: 0, receipt_line_present: false }
              as: TerminalAgent
              as_user_id: "${term_c_id}"
              captures: { txn_c_id: $.data.id }
          assert:
            - "SurchargeProgram.${prog_s_id}.effective_cap_pct == 2.0"
            - "SurchargeProgram.${prog_c_id}.effective_cap_pct == 10.0"
            - "Transaction.${txn_s_id}.applied_rate_pct == 2.0"
            - "Transaction.${txn_s_id}.surcharge_amount_cents == 200"
            - "Transaction.${txn_s_id}.cash_discount_amount_cents == 0"
            - "Transaction.${txn_s_id}.cash_price_cents == 10000"
            - "Transaction.${txn_s_id}.total_amount_cents == 10200"
            - "Transaction.${txn_s_id}.outcome == APPROVED_WITH_SURCHARGE"
            - "Transaction.${txn_c_id}.applied_rate_pct == 2.0"
            - "Transaction.${txn_c_id}.surcharge_amount_cents == 0"
            - "Transaction.${txn_c_id}.cash_discount_amount_cents == 200"
            - "Transaction.${txn_c_id}.cash_price_cents == 9800"
            - "Transaction.${txn_c_id}.total_amount_cents == 10000"
            - "Transaction.${txn_c_id}.outcome == APPROVED_CASH_DISCOUNT"
            - "Transaction.${txn_s_id}.total_amount_cents - Transaction.${txn_c_id}.total_amount_cents == 200"
            - "Merchant.${merch_id}.gross_surcharge_collected_cents == 200"
            - "Merchant.${merch_id}.net_surcharge_collected_cents == 200"

      - name: exposure_score_network_method_vs_ag_method
        grounds:
          - calculations.compliance_exposure_score
          - entities.SurchargeProgram.fields.network_exposure_score
          - entities.SurchargeProgram.fields.ag_exposure_score
          - entities.Jurisdiction.fields.ag_enforcement_posture
          - endpoints[GET /surcharge-programs/{id}/exposure-summary]
        distinguishing_aspect: |
          This instance's two variants live in the SurchargeProgram COMPLIANCE-RISK domain, not the money
          domain: the same two-case data set scores 30.00 under network_method (substantiated only, source
          multiplier 1.5) and 28.00 under ag_method (unresolved cases counted at 8 points, source ignored,
          MONITORED posture multiplier 1.0).
        test_recipe:
          setup:
            - "Jurisdiction NY with ag_enforcement_posture MONITORED (POSTURE_MULTIPLIER 1.0)."
            - "One merchant with docA and one DRAFT SURCHARGE program (no activation needed: complaint filing does not depend on program status, and the ACTIVE -> REMEDIATION cascade cannot fire from DRAFT)."
            - "Two complaint cases on that program: a NETWORK case moved to investigation_state SUBSTANTIATED, and an ATTORNEY_GENERAL case left OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "NY", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: true, disclosure_signage_required: true, receipt_line_item_required: true, ag_enforcement_posture: "MONITORED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_ny_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_ny_id}", legal_name: "Hudson Goods Inc", mcc: "5999" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/ny/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_ny_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /complaint-cases"
              payload: { program_id: "${prog_id}", source: "NETWORK", allegation_type: "CAP_EXCEEDED", narrative: "Visa compliance: surcharge above documented cost." }
              as: NetworkAuditor
              as_user_id: "auditor-1"
              captures: { case_net_id: $.data.id }
            - call: "POST /complaint-cases/${case_net_id}/investigation-actions"
              payload: { action: "SUBSTANTIATE", note: "cap breach confirmed" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
            - call: "POST /complaint-cases"
              payload: { program_id: "${prog_id}", source: "ATTORNEY_GENERAL", allegation_type: "UNDISCLOSED_SURCHARGE", narrative: "AG inquiry: signage not posted at entry." }
              as: StateRegulator
              as_user_id: "regulator-1"
              captures: { case_ag_id: $.data.id }
          trigger:
            - call: "GET /surcharge-programs/${prog_id}/exposure-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response.data.network_exposure_score == 30.00"
            - "response.data.ag_exposure_score == 28.00"
            - "response.data.substantiated_case_count == 1"
            - "response.data.unresolved_case_count == 1"
            - "response.data.posture_multiplier == 1.0"
            - "response.data.remediation_threshold == 30"
            - "SurchargeProgram.${prog_id}.network_exposure_score == 30.00"
            - "SurchargeProgram.${prog_id}.ag_exposure_score == 28.00"
            - "SurchargeProgram.${prog_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_rounding_order_per_line_then_sum_vs_pooled
        grounds:
          - calculations.program_settlement_reconciliation
          - calculations.transaction_price_resolution
          - endpoints[GET /surcharge-programs/{id}/settlement-summary]
          - entities.Transaction.fields.surcharge_amount_cents
        distinguishing_aspect: |
          Mode (b) - ROUNDING ORDER: three sales of 1234, 5678 and 9012 cents at 2.19 percent round per line to
          27 + 124 + 197 = 348 cents, while the pooled computation over the 15924-cent base rounds to 349 cents,
          so rounding_divergence_cents is exactly -1 and the settled figure is the per-line one.
        test_recipe:
          setup:
            - "Jurisdiction AZ (surcharge permitted, statutory cap 4.0, no signage/receipt/posting mandates so the required artifact set is empty)."
            - "One merchant with docA, so documented_cost_pct 2.1900 binds effective_cap_pct at 2.19."
            - "One ACTIVE SURCHARGE program with a VISA/ALL rate rule at exactly 2.19 percent, an EFFECTIVE VISA registration and one ENFORCING terminal."
            - "Three captured sales of 1234, 5678 and 9012 cents, all APPROVED_WITH_SURCHARGE at the clock 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/network-registrations"
              payload: { network: "VISA", registration_ref: "VS-2940-AZ-001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { reg_id: $.data.id }
            - call: "POST /network-registrations/${reg_id}/decision"
              payload: { decision: "ACKNOWLEDGE", decision_note: "accepted" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /network-registrations/${reg_id}/effectuate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /merchants/${merch_id}/terminals"
              payload: { serial_number: "T-AZ-001" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/configure"
              payload: { program_id: "${prog_id}", debit_exclusion_enabled: true, bin_table_version: "BIN-2026.08" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
            - call: "POST /terminals/${term_id}/state-actions"
              payload: { action: "ENFORCE" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
            - call: "POST /transactions"
              payload: { terminal_id: "${term_id}", program_id: "${prog_id}", card_brand: "VISA", card_funding: "CREDIT", product_tier: "CONSUMER_CREDIT", base_amount_cents: 1234, requested_surcharge_cents: 27, receipt_line_present: true }
              as: TerminalAgent
              as_user_id: "${term_id}"
              captures: { txn1_id: $.data.id }
            - call: "POST /transactions"
              payload: { terminal_id: "${term_id}", program_id: "${prog_id}", card_brand: "VISA", card_funding: "CREDIT", product_tier: "CONSUMER_CREDIT", base_amount_cents: 5678, requested_surcharge_cents: 124, receipt_line_present: true }
              as: TerminalAgent
              as_user_id: "${term_id}"
              captures: { txn2_id: $.data.id }
            - call: "POST /transactions"
              payload: { terminal_id: "${term_id}", program_id: "${prog_id}", card_brand: "VISA", card_funding: "CREDIT", product_tier: "CONSUMER_CREDIT", base_amount_cents: 9012, requested_surcharge_cents: 197, receipt_line_present: true }
              as: TerminalAgent
              as_user_id: "${term_id}"
              captures: { txn3_id: $.data.id }
          trigger:
            - call: "GET /surcharge-programs/${prog_id}/settlement-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "Transaction.${txn1_id}.surcharge_amount_cents == 27"
            - "Transaction.${txn2_id}.surcharge_amount_cents == 124"
            - "Transaction.${txn3_id}.surcharge_amount_cents == 197"
            - "response.data.transaction_count == 3"
            - "response.data.base_amount_total_cents == 15924"
            - "response.data.per_line_rounded_surcharge_cents == 348"
            - "response.data.pooled_rounding_reference_cents == 349"
            - "response.data.rounding_divergence_cents == -1"
            - "response.data.refunded_surcharge_cents == 0"
            - "response.data.net_surcharge_cents == 348"
            - "Merchant.${merch_id}.gross_surcharge_collected_cents == 348"

      - name: average_ticket_cost_cap_pinned_four_step_chain
        grounds:
          - calculations.average_ticket_snapshot
          - calculations.cost_documentation_evaluation
          - calculations.effective_surcharge_cap
          - entities.CostDocumentation.fields.average_ticket_cents
          - entities.CostDocumentation.fields.documented_cost_pct
          - entities.CostDocumentation.fields.state
          - validations[priority=110]
        distinguishing_aspect: |
          Mode (c) - APPARENT CIRCULARITY: the cap depends on documented_cost_pct, which depends on the average
          ticket of transactions that were themselves priced by the capped rate. Filing a second cost document
          after three sales freezes average_ticket_cents 5308 and documented_cost_pct 2.1784, and re-pinning it
          lowers effective_cap_pct from 2.1900 to 2.1784 WITHOUT retroactively invalidating the 2.19 percent rule
          already on file, while a NEW 2.19 percent rule is now rejected.
        test_recipe:
          setup:
            - "The complete AZ fixture of the previous instance: ACTIVE SURCHARGE program on docA (documented_cost_pct 2.1900, effective_cap_pct 2.1900) with a VISA/ALL rule at 2.19 percent and three captured sales of 1234, 5678 and 9012 cents."
            - "Logical clock at 2026-08-31T00:00:00Z; the merchant's only CostDocumentation docA is ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
