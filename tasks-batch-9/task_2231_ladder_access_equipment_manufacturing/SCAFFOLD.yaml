    output: LoadTest
    side_effects:
      - "derives outcome and failure_reason_code per §1.3 load_test_outcome"
      - "recomputes campaign.load_test_count and campaign.failed_test_count"
    errors: [ERR_TEST_CAMPAIGN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_CAMPAIGN_STATE_INVALID]

  - method: GET
    path: /ladder-ops/test-campaigns/{id}/load-tests
    roles: [TestLabTechnician, DesignEngineer, DesignApprover, ComplianceOfficer, CertificationBody, SafetyDirector]
    input: ["outcome?", "test_code?", "limit?", "offset?"]
