scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: device_due_date_from_install_vs_from_last_pass
    grounds:
    - calculations.device_next_test_due_date
    - entities.BackflowDevice.fields.next_test_due_date
    - entities.BackflowDevice.fields.last_pass_date
    distinguishing_aspect: On BackflowDevice, next_test_due_date is install_date+12mo (from_install=2026-03-01) before any pass and switches to last_pass_date+12mo (from_last_pass=2027-02-15) after an accepted PASS — two variants, different dates for the same device.
    test_recipe:
      setup:
      - Connection + one RP device installed 2025-03-01 (from_install due = 2026-03-01).
      - A PASS report dated 2026-02-15 is submitted and accepted, setting last_pass_date and switching the due-date variant.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0001
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0001
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2025-03-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0001
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      trigger:
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-15T00:00:00Z'
          relief_valve_differential_psid: 2.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      assert:
      - BackflowDevice.${dev_id}.last_pass_date == 2026-02-15T00:00:00Z
      - BackflowDevice.${dev_id}.next_test_due_date == 2027-02-15T00:00:00Z (from_last_pass; was 2026-03-01 from_install before the accepted PASS)
  - name: risk_tier_assessed_low_vs_effective_high
    grounds:
    - calculations.connection_risk_tier
    - entities.HazardSurvey.fields.assessed_risk_tier
    - entities.HazardSurvey.fields.effective_risk_tier
    - entities.ServiceConnection.fields.risk_tier
    distinguishing_aspect: For the same finalized survey, assessed_risk_tier == LOW (questionnaire only) but effective_risk_tier == HIGH because a HIGH-rated device raises the device floor — the two variants diverge on the HazardSurvey/ServiceConnection domain.
    test_recipe:
      setup:
      - Connection with one HIGH-rated device.
      - A draft survey scored premise=20, chemical=30, auxiliary=10 (weighted 21 -> LOW, no questionnaire floor).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0002
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0002
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /hazard-surveys
        payload:
          service_connection_id: ${conn_id}
          premise_use_score: 20
          chemical_exposure_score: 30
          auxiliary_supply_score: 10
        as: UtilityAdmin
        captures:
          survey_id: $.data.id
      - call: GET /service-connections/${conn_id}
        as: UtilityAdmin
        captures:
          conn_ver_live: $.data.version
      trigger:
      - call: POST /hazard-surveys/${survey_id}/finalize
        payload:
          expected_service_connection_version: ${conn_ver_live}
        as: UtilityAdmin
      assert:
      - HazardSurvey.${survey_id}.assessed_risk_tier == LOW
      - HazardSurvey.${survey_id}.effective_risk_tier == HIGH
      - ServiceConnection.${conn_id}.risk_tier == HIGH
- rule_id: combinatorial_formula
  instances:
  - name: risk_score_weighted_with_chemical_high_floor
    grounds:
    - calculations.connection_risk_tier
    - entities.HazardSurvey.fields.assessed_risk_tier
    distinguishing_aspect: 'assessed_risk_tier = max(weighted-score tier, conditional floor): weighted 23 alone is LOW, but chemical_exposure_score 35 >= 35 forces a HIGH floor, so the result is HIGH — mode (a) three-input non-linear branch interaction.'
    test_recipe:
      setup:
      - Connection with no devices.
      - Draft survey scored premise=20, chemical=35, auxiliary=10 (weighted = 6+14+3 = 23 -> LOW base; chemical 35 triggers HIGH floor).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0003
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /hazard-surveys
        payload:
          service_connection_id: ${conn_id}
          premise_use_score: 20
          chemical_exposure_score: 35
          auxiliary_supply_score: 10
        as: UtilityAdmin
        captures:
          survey_id: $.data.id
      - call: GET /service-connections/${conn_id}
        as: UtilityAdmin
        captures:
          conn_ver_live: $.data.version
      trigger:
      - call: POST /hazard-surveys/${survey_id}/finalize
        payload:
          expected_service_connection_version: ${conn_ver_live}
        as: UtilityAdmin
      assert:
      - HazardSurvey.${survey_id}.assessed_risk_tier == HIGH (chemical>=35 HIGH floor overrides the LOW weighted tier)
      - ServiceConnection.${conn_id}.risk_tier == HIGH
  - name: penalty_round_per_device_then_sum
    grounds:
    - calculations.non_compliance_penalty
    - entities.ServiceConnection.fields.total_penalty_cents
    - entities.ServiceConnection.fields.overdue_device_count
    distinguishing_aspect: With MODERATE risk (mult 1.5) each of two devices 1 day overdue has raw 499.5c rounded to 500c BEFORE summing (total 1000), not sum-then-round (999) — mode (b) pinned per-device rounding order.
    test_recipe:
      setup:
      - Connection set to MODERATE risk_tier via a finalized survey (auxiliary=30 floor).
      - Two LOW-hazard devices, both due 2026-03-01; clock advanced to 2026-03-02 so each is exactly 1 day overdue.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0004
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0004A
          device_type: RP
          hazard_rating: LOW
          test_interval_months: 12
          install_date: '2025-03-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev1: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0004B
          device_type: RP
          hazard_rating: LOW
          test_interval_months: 12
          install_date: '2025-03-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev2: $.data.id
      - call: POST /hazard-surveys
        payload:
          service_connection_id: ${conn_id}
          premise_use_score: 10
          chemical_exposure_score: 10
          auxiliary_supply_score: 30
        as: UtilityAdmin
        captures:
          survey_id: $.data.id
      - call: GET /service-connections/${conn_id}
        as: UtilityAdmin
        captures:
          conn_ver_live: $.data.version
      - call: POST /hazard-surveys/${survey_id}/finalize
        payload:
          expected_service_connection_version: ${conn_ver_live}
        as: UtilityAdmin
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-02T00:00:00Z'
        as: UtilityAdmin
      trigger:
      - call: GET /service-connections/${conn_id}
        as: UtilityAdmin
        captures:
          pen: $.data.total_penalty_cents
      assert:
      - ServiceConnection.${conn_id}.overdue_device_count == 2
      - ServiceConnection.${conn_id}.risk_tier == MODERATE
      - ServiceConnection.${conn_id}.total_penalty_cents == 1000 (round(499.5)=500 per device, then summed; sum-then-round would give 999)
- rule_id: non_linear_state_machine
  instances:
  - name: device_cycle_active_needs_repair_active
    grounds:
    - state_machines.BackflowDevice.ACTIVE_to_NEEDS_REPAIR
    - state_machines.BackflowDevice.NEEDS_REPAIR_to_ACTIVE
    distinguishing_aspect: BackflowDevice returns to ACTIVE after a NEEDS_REPAIR detour (FAIL accept then REPAIR completion) — a cycle (revision loop) on the device entity, not a linear pipeline.
    test_recipe:
      setup:
      - Connection + RP device installed 2026-01-01 + tester.
      - A FAIL report is accepted (device -> NEEDS_REPAIR), then a REPAIR order is opened.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0005
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0005
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0005
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 1.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      - call: POST /repair-orders
        payload:
          device_id: ${dev_id}
          order_type: REPAIR
          description: reseat first check valve
        as: UtilityAdmin
        captures:
          order_id: $.data.id
      trigger:
      - call: POST /repair-orders/${order_id}/complete
        payload: {}
        as: UtilityAdmin
      assert:
      - BackflowDevice.${dev_id}.status == ACTIVE (cycled ACTIVE -> NEEDS_REPAIR -> ACTIVE)
  - name: test_report_branch_accept_vs_reject
    grounds:
    - state_machines.TestReport.SUBMITTED_to_ACCEPTED
    - state_machines.TestReport.SUBMITTED_to_REJECTED
    - entities.TestReport.fields.rejection_reason
    distinguishing_aspect: TestReport forks SUBMITTED -> {ACCEPTED, REJECTED}; the REJECTED branch leaves the device untouched (last_pass_date stays null) whereas ACCEPTED would set it — branching on a different entity than the device cycle.
    test_recipe:
      setup:
      - Connection + RP device + tester.
      - A PASS-quality report is submitted but the reviewer rejects it.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0006
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0006
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0006
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 2.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      trigger:
      - call: POST /test-reports/${report_id}/reject
        payload:
          rejection_reason: gauge reading illegible
        as: UtilityAdmin
      assert:
      - TestReport.${report_id}.status == REJECTED
      - TestReport.${report_id}.rejection_reason == gauge reading illegible
      - BackflowDevice.${dev_id}.last_pass_date == null (REJECTED branch fires no device side effect, unlike ACCEPTED)
- rule_id: transitive_cascade
  instances:
  - name: fail_accept_cascade_device_posture_notice
    grounds:
    - state_machines.TestReport.SUBMITTED_to_ACCEPTED
    - state_machines.BackflowDevice.ACTIVE_to_NEEDS_REPAIR
    - state_machines.ServiceConnection.COMPLIANT_to_NON_COMPLIANT
    - entities.ShutoffNotice.fields.status
    distinguishing_aspect: 'Accepting a FAIL report chains device ACTIVE->NEEDS_REPAIR (link1) -> connection posture NON_COMPLIANT (link2) -> auto-issued FAILED_TEST ShutoffNotice (link3): a depth-3 cascade whose links each cause the next, triggered by the accept.'
    test_recipe:
      setup:
      - Connection + RP device installed 2026-01-01 + tester.
      - A FAIL report is submitted (relief 1.5 < 2.0).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0007
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0007
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0007
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 1.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      trigger:
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      - call: GET /shutoff-notices
        as: UtilityAdmin
        captures:
          n_reason: $.data[0].reason
          n_status: $.data[0].status
      assert:
      - BackflowDevice.${dev_id}.status == NEEDS_REPAIR (link1)
      - ServiceConnection.${conn_id}.compliance_posture == NON_COMPLIANT (link2)
      - ServiceConnection.${conn_id}.open_notice_count == 1 (link3 auto-issued notice)
      - the ShutoffNotice for ${conn_id} has reason == FAILED_TEST and status == ISSUED
  - name: repair_complete_cascade_device_posture_rescind
    grounds:
    - state_machines.RepairOrder.OPEN_to_COMPLETED
    - state_machines.BackflowDevice.NEEDS_REPAIR_to_ACTIVE
    - state_machines.ServiceConnection.NON_COMPLIANT_to_COMPLIANT
    - state_machines.ShutoffNotice.ISSUED_to_RESCINDED
    distinguishing_aspect: 'Completing a REPAIR order chains device NEEDS_REPAIR->ACTIVE (link1) -> posture clears to COMPLIANT (link2) -> outstanding FAILED_TEST notice auto-RESCINDED (link3): a depth-3 cascade from a different trigger than the FAIL-accept cascade.'
    test_recipe:
      setup:
      - Connection + RP device installed 2026-01-01 + tester.
      - A FAIL report is accepted (device NEEDS_REPAIR, FAILED_TEST notice ISSUED), then a REPAIR order is opened.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0008
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0008
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0008
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 1.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      - call: GET /shutoff-notices
        as: UtilityAdmin
        captures:
          notice_id: $.data[0].id
      - call: POST /repair-orders
        payload:
          device_id: ${dev_id}
          order_type: REPAIR
          description: reseat check valve
        as: UtilityAdmin
        captures:
          order_id: $.data.id
      trigger:
      - call: POST /repair-orders/${order_id}/complete
        payload: {}
        as: UtilityAdmin
      assert:
      - BackflowDevice.${dev_id}.status == ACTIVE (link1)
      - ServiceConnection.${conn_id}.compliance_posture == COMPLIANT (link2; device due 2027-01-01, not in the 30-day window)
      - ShutoffNotice.${notice_id}.status == RESCINDED (link3 auto-rescind)
      - ServiceConnection.${conn_id}.open_notice_count == 0
- rule_id: priority_pair_validation_conflict
  instances:
  - name: removed_device_expired_tester_state_beats_safety
    grounds:
    - validations[priority=4]
    - validations[priority=5]
    - errors[ERR_DEVICE_NOT_TESTABLE]
    - errors[ERR_TESTER_NOT_CERTIFIED]
    distinguishing_aspect: A report for a REMOVED device (state, pri 4) submitted by an EXPIRED tester (business_safety, pri 5) returns ERR_DEVICE_NOT_TESTABLE — the state error wins over the safety error (category pair state vs business_safety).
    test_recipe:
      setup:
      - Device created then REMOVED.
      - Tester whose certification expired 2026-02-01; clock advanced to 2026-06-01 so the tester is EXPIRED.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0009
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0009
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /devices/${dev_id}/remove
        payload: {}
        as: UtilityAdmin
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0009
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2026-02-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T00:00:00Z'
        as: UtilityAdmin
      trigger:
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-06-01T00:00:00Z'
          relief_valve_differential_psid: 2.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_DEVICE_NOT_TESTABLE (pri 4 state beats pri 5 business_safety)
      - HTTP status == 409
  - name: enforce_rescinded_notice_before_due_state_beats_temporal
    grounds:
    - validations[priority=4]
    - validations[priority=8]
    - errors[ERR_NOTICE_NOT_ISSUED]
    - errors[ERR_ENFORCEMENT_NOT_DUE]
    distinguishing_aspect: Enforcing a RESCINDED notice (state, pri 4) before its enforcement_due_date (business_temporal, pri 8) returns ERR_NOTICE_NOT_ISSUED — state wins (category pair state vs business_temporal, distinct from the state/safety pair).
    test_recipe:
      setup:
      - Connection with no devices, LOW risk (grace 30 days).
      - A notice is manually issued (issued 2026-03-01, enforcement_due 2026-03-31) then rescinded; clock stays 2026-03-01 (before due).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0010
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /shutoff-notices
        payload:
          service_connection_id: ${conn_id}
          reason: OVERDUE_TEST
        as: UtilityAdmin
        captures:
          notice_id: $.data.id
      - call: POST /shutoff-notices/${notice_id}/rescind
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /shutoff-notices/${notice_id}/enforce
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_NOTICE_NOT_ISSUED (pri 4 state beats pri 8 business_temporal)
      - HTTP status == 409
- rule_id: boundary_precision_check
  instances:
  - name: relief_differential_exactly_at_threshold_passes
    grounds:
    - calculations.test_report_result
    - entities.TestReport.fields.result
    distinguishing_aspect: An RP report with relief_valve_differential_psid exactly 2.0 (== MIN_RELIEF_DIFFERENTIAL_PSID) and check_valve_1_psid exactly 1.0 yields result PASS (>= boundary); 1.99 would FAIL — pressure-metric boundary on POST /test-reports.
    test_recipe:
      setup:
      - Connection + RP device installed 2026-01-01 + tester.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0011
          address: 1 Main St
          owner_user_id: owner-1
