              as: AgencyCoordinator
              as_user_id: "${ag1}"
          trigger:
            - call: "POST /efap/commodity-orders/${ord1}/approve"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-2"
          assert:
            - "OrderLine.${ln1}.line_pounds == 243.75 and OrderLine.${ln1}.line_pallets == 1"
            - "OrderLine.${ln2}.line_pounds == 365.63 and OrderLine.${ln2}.line_pallets == 1"
            - "OrderLine.${ln3}.line_pounds == 692.88 and OrderLine.${ln3}.line_pallets == 1"
            - "CommodityOrder.${ord1}.total_pounds == 1302.26 (NOT 1302.25)"
            - "CommodityOrder.${ord1}.total_pallets == 3 (NOT 2)"
            - "CommodityOrder.${ord1}.total_cases_approved == 48 and status == APPROVED"
            - "AgencyAllocation.${al1}.cases_committed == 48 and cases_remaining == 953"

