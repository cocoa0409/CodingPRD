scaffold_corner_design:
- section: entities
  instances:
  - name: rodeo_create_defaults_and_system_fields
    claim_type: creation
    grounds:
    - entities.Rodeo
    distinguishing_aspect: POST /api/rodeos with only the three required inputs returns 201 with server-stamped id, posture DRAFT, unclaimed_purse_cents 0, and version 1.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/rodeos
        payload:
          name: Albuquerque Rodeo
          city: Albuquerque
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      assert:
      - response_type == object; data.id is a UUID; data.posture == DRAFT; data.unclaimed_purse_cents == 0; data.version == 1; created_at has three fractional digits
  - name: rodeo_event_discipline_computed_from_code
    claim_type: computed_fields
    grounds:
    - entities.RodeoEvent.fields.discipline
    distinguishing_aspect: 'discipline is derived from event_code: BULL_RIDING yields ROUGH_STOCK and BARREL_RACING yields TIMED; any client-supplied discipline value is ignored.'
    test_recipe:
      setup:
      - Rodeo exists
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Amarillo Rodeo
          city: Amarillo
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      trigger:
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BULL_RIDING
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          ev_rough: $.data.id
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BARREL_RACING
          go_rounds: 2
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 2
        as: CommitteeAdmin
        captures:
          ev_timed: $.data.id
      assert:
      - RodeoEvent ${ev_rough}.discipline == ROUGH_STOCK
      - RodeoEvent ${ev_timed}.discipline == TIMED
  - name: rodeo_event_invalid_event_code_rejected
    claim_type: type_constraints
    grounds:
    - entities.RodeoEvent.fields.event_code
    - errors[ERR_VALIDATION]
    distinguishing_aspect: An event_code outside the declared enum is rejected with ERR_VALIDATION (400) and no event is persisted.
    test_recipe:
      setup:
      - Rodeo exists
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Amarillo Rodeo
          city: Amarillo
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      trigger:
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: MUTTON_BUSTIN
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION, http 400; GET /api/rodeo-events?rodeo_id afterwards returns an empty list
  - name: entry_get_nonexistent_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints.GET_/api/entries/{entry_id}
    distinguishing_aspect: GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404) with the standard error envelope.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /api/entries/00000000-0000-0000-0000-000000000000
        payload: {}
        as: CommitteeAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND, http 404, response_type == error
  - name: contestant_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints.GET_/api/contestants
    distinguishing_aspect: With 2 contestants stored, GET /api/contestants?limit=1 returns exactly 1 item with total_count == 2 and has_more == true; offset=1 returns the second item with has_more == false.
    test_recipe:
      setup:
      - Two contestants registered
      setup_api_calls:
      - call: POST /api/contestants
        payload:
          card_number: PRCA-201
          full_name: Rider One
        as: EntryOffice
      - call: POST /api/contestants
        payload:
          card_number: PRCA-202
          full_name: Rider Two
        as: EntryOffice
      trigger:
      - call: GET /api/contestants
        payload:
          limit: 1
          offset: 0
        as: CommitteeAdmin
      - call: GET /api/contestants
        payload:
          limit: 1
          offset: 1
        as: CommitteeAdmin
      assert:
      - 'First page: 1 item, total_count == 2, has_more == true'
      - 'Second page: 1 item, total_count == 2, has_more == false'
  - name: vet_report_immutable_common_fields_absent
    claim_type: immutability
    grounds:
    - entities.VetReport
    distinguishing_aspect: 'VetReport is append-only (common_fields: false): responses carry id and created_at but no version or updated_at keys, and no update/transition endpoint exists for it.'
    test_recipe:
      setup:
      - A contestant exists to reference
      setup_api_calls:
      - call: POST /api/contestants
        payload:
          card_number: PRCA-210
          full_name: Rider Ten
        as: EntryOffice
        captures:
          c_id: $.data.id
      trigger:
      - call: POST /api/vet-reports
        payload:
          subject_type: CONTESTANT
          contestant_id: ${c_id}
          findings: Concussion protocol
          disposition: INJURED_TURNOUT
          veterinarian_name: Dr. Ellis
        as: Veterinarian
        captures:
          vr_id: $.data.id
      - call: GET /api/vet-reports/${vr_id}
        payload: {}
        as: Veterinarian
      assert:
      - Create response data has id and created_at but no version key and no updated_at key
      - GET response likewise omits version/updated_at
- section: state_machines
  instances:
  - name: rodeo_terminal_cancelled_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Rodeo
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: From CANCELLED every further posture action is rejected with ERR_INVALID_STATE, including otherwise-valid OPEN_ENTRIES.
    test_recipe:
      setup:
      - Rodeo in DRAFT (no events needed for cancel)
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Rained Out Rodeo
          city: Nowhere
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: CANCEL_RODEO
        as: CommitteeAdmin
      trigger:
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: OPEN_ENTRIES
        as: CommitteeAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (409); Rodeo.posture remains CANCELLED
  - name: turnout_from_entered_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Entry.DRAWN_to_TURNED_OUT
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: TURN_OUT is only declared from DRAWN; an ENTERED (not yet drawn) entry rejects it with ERR_INVALID_STATE and no refund fields change.
    test_recipe:
      setup:
      - Rodeo ENTRIES_OPEN with event + performance; one entry ENTERED
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Baker City
          city: Baker City
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BAREBACK
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          ev_id: $.data.id
      - call: POST /api/performances
        payload:
          rodeo_id: ${r_id}
          label: Fri
          arena: Main
          starts_at: '2026-08-14T19:00:00Z'
          ends_at: '2026-08-14T22:00:00Z'
          arena_capacity: 100
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: OPEN_ENTRIES
        as: CommitteeAdmin
      - call: POST /api/contestants
        payload:
          card_number: PRCA-220
          full_name: Rider X
        as: EntryOffice
        captures:
          c_x: $.data.id
      - call: POST /api/entries
        payload:
          contestant_id: ${c_x}
          rodeo_event_id: ${ev_id}
        as: EntryOffice
        captures:
          e_x: $.data.id
      trigger:
      - call: POST /api/entries/${e_x}/transition
        payload:
          action: TURN_OUT
          reason: VOLUNTARY
        as: EntryOffice
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE; Entry.status stays ENTERED with refunded_cents == 0
  - name: unlock_draw_wipes_pending_assignments
    claim_type: side_effect_execution
    grounds:
    - state_machines.Rodeo.DRAW_LOCKED_to_ENTRIES_OPEN
    - entities.RodeoEvent.fields.drawn_rounds
    distinguishing_aspect: UNLOCK_DRAW releases every PENDING assignment, returns their animals to AVAILABLE, moves DRAWN and WAITLISTED entries back to ENTERED, and empties drawn_rounds.
    test_recipe:
      setup:
      - Rodeo DRAW_LOCKED; go-round 1 drawn for one BULL_RIDING event with 2 entries and 2 animals
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Waco Rodeo
          city: Waco
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BULL_RIDING
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      - call: POST /api/performances
        payload:
          rodeo_id: ${r_id}
          label: Fri
          arena: Main
          starts_at: '2026-08-14T19:00:00Z'
          ends_at: '2026-08-14T22:00:00Z'
          arena_capacity: 100
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: OPEN_ENTRIES
        as: CommitteeAdmin
      - call: POST /api/contestants
        payload:
          card_number: PRCA-230
          full_name: Rider Y
        as: EntryOffice
        captures:
          c_y: $.data.id
      - call: POST /api/contestants
        payload:
          card_number: PRCA-231
          full_name: Rider Z
        as: EntryOffice
        captures:
          c_z: $.data.id
      - call: POST /api/entries
        payload:
          contestant_id: ${c_y}
          rodeo_event_id: ${ev_id}
        as: EntryOffice
        captures:
          e_y: $.data.id
      - call: POST /api/entries
        payload:
          contestant_id: ${c_z}
          rodeo_event_id: ${ev_id}
        as: EntryOffice
        captures:
          e_z: $.data.id
      - call: POST /api/stock-contracts
        payload:
          rodeo_id: ${r_id}
          contractor_name: Bar None
          day_rate_cents: 10000
          per_out_fee_cents: 2000
        as: CommitteeAdmin
        captures:
          k_id: $.data.id
      - call: POST /api/stock-contracts/${k_id}/transition
        payload:
          action: ACTIVATE
        as: CommitteeAdmin
      - call: POST /api/stock-animals
        payload:
          contract_id: ${k_id}
          tag_number: A100
          event_code: BULL_RIDING
        as: CommitteeAdmin
      - call: POST /api/stock-animals
        payload:
          contract_id: ${k_id}
          tag_number: A200
          event_code: BULL_RIDING
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: LOCK_DRAW
        as: CommitteeAdmin
      - call: POST /api/rodeo-events/${ev_id}/draws
        payload:
          go_round_number: 1
          expected_rodeo_event_version: ${ev_v}
        as: CommitteeAdmin
      trigger:
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: UNLOCK_DRAW
        as: CommitteeAdmin
      - call: GET /api/draw-assignments
        payload:
          rodeo_event_id: ${ev_id}
        as: CommitteeAdmin
      - call: GET /api/rodeo-events/${ev_id}
        payload: {}
        as: CommitteeAdmin
      - call: GET /api/entries/${e_y}
        payload: {}
        as: CommitteeAdmin
      - call: GET /api/stock-animals
        payload:
          contract_id: ${k_id}
        as: CommitteeAdmin
      assert:
      - Both DrawAssignments have status == RELEASED
      - RodeoEvent.drawn_rounds == [] and Rodeo.posture == ENTRIES_OPEN
      - Entry ${e_y}.status == ENTERED; both StockAnimals status == AVAILABLE
  - name: suspension_skips_competed_entries
    claim_type: side_effect_execution
    grounds:
    - state_machines.Contestant.GOOD_STANDING_to_SUSPENDED
    - state_machines.Entry.DRAWN_to_DRAWN_OUT
    distinguishing_aspect: 'The suspension cascade is conditional: the contestant''s COMPETED entry in event E1 is untouched while their DRAWN entry in event E2 is drawn out with a full refund.'
    test_recipe:
      setup:
      - Rodeo IN_PROGRESS with two BULL_RIDING events E1 (fee 2000) and E2 (fee 2000), one performance, one ACTIVE contract with two animals
      - Contestant C entered in both; E1 result VERIFIED so entry E1 is COMPETED; E2 entry still DRAWN
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Abilene Rodeo
          city: Abilene
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BULL_RIDING
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          e1v: $.data.id
          e1v_v: $.data.version
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BAREBACK
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          e2v: $.data.id
          e2v_v: $.data.version
      - call: POST /api/performances
        payload:
          rodeo_id: ${r_id}
          label: Fri
          arena: Main
          starts_at: '2026-08-14T19:00:00Z'
          ends_at: '2026-08-14T22:00:00Z'
          arena_capacity: 100
        as: CommitteeAdmin
        captures:
          p_id: $.data.id
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: OPEN_ENTRIES
        as: CommitteeAdmin
      - call: POST /api/contestants
        payload:
          card_number: PRCA-240
          full_name: Rider Multi
        as: EntryOffice
        captures:
          c_m: $.data.id
      - call: POST /api/entries
        payload:
          contestant_id: ${c_m}
          rodeo_event_id: ${e1v}
        as: EntryOffice
        captures:
          en1: $.data.id
      - call: POST /api/entries
        payload:
          contestant_id: ${c_m}
          rodeo_event_id: ${e2v}
        as: EntryOffice
        captures:
          en2: $.data.id
      - call: POST /api/stock-contracts
        payload:
          rodeo_id: ${r_id}
          contractor_name: Bar None
          day_rate_cents: 10000
          per_out_fee_cents: 2000
        as: CommitteeAdmin
        captures:
          k_id: $.data.id
      - call: POST /api/stock-contracts/${k_id}/transition
        payload:
          action: ACTIVATE
        as: CommitteeAdmin
      - call: POST /api/stock-animals
        payload:
          contract_id: ${k_id}
          tag_number: A100
          event_code: BULL_RIDING
        as: CommitteeAdmin
        captures:
          a1: $.data.id
      - call: POST /api/stock-animals
        payload:
          contract_id: ${k_id}
          tag_number: A200
          event_code: BAREBACK
        as: CommitteeAdmin
        captures:
          a2: $.data.id
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: LOCK_DRAW
        as: CommitteeAdmin
      - call: POST /api/rodeo-events/${e1v}/draws
        payload:
          go_round_number: 1
          expected_rodeo_event_version: ${e1v_v}
        as: CommitteeAdmin
      - call: POST /api/rodeo-events/${e2v}/draws
        payload:
          go_round_number: 1
          expected_rodeo_event_version: ${e2v_v}
        as: CommitteeAdmin
      - call: POST /api/judges
        payload:
          card_number: J-24
          full_name: Judge Multi
          certification: PRCA_CARD
        as: CommitteeAdmin
        captures:
          j_id: $.data.id
      - call: POST /api/judge-assignments
        payload:
          judge_id: ${j_id}
          performance_id: ${p_id}
          position: ARENA_1
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: START_RODEO
        as: CommitteeAdmin
      - call: GET /api/draw-assignments
        payload:
          entry_id: ${en1}
        as: CommitteeAdmin
        captures:
          da1: $.data[0].id
      - call: POST /api/run-results
        payload:
          draw_assignment_id: ${da1}
          judge_1_score: 40
          judge_2_score: 40
          qualified_flag: true
        as: Judge
        as_user_id: ${j_id}
        captures:
          rr1: $.data.id
      - call: POST /api/run-results/${rr1}/transition
        payload:
          action: VERIFY
        as: CommitteeAdmin
      trigger:
      - call: PATCH /api/contestants/${c_m}
        payload:
          status: SUSPENDED
        as: CommitteeAdmin
      - call: GET /api/entries/${en1}
        payload: {}
        as: CommitteeAdmin
      - call: GET /api/entries/${en2}
        payload: {}
        as: CommitteeAdmin
      - call: GET /api/stock-animals/${a2}
        payload: {}
        as: CommitteeAdmin
      assert:
      - 'Entry ${en1} (COMPETED) is untouched: status stays COMPETED, refunded_cents == 0'
      - 'Entry ${en2}: status == DRAWN_OUT with refunded_cents == 2000 and refunded_contribution_cents == 1160'
      - Animal ${a2} returns to AVAILABLE; ${a1} unaffected (COMPETED cycle continues)
  - name: entry_auto_competes_bubble_up_stub
    claim_type: side_effect_execution
    grounds:
    - state_machines.Entry.DRAWN_to_COMPETED
    excluded_because:
      difficulty_instance: non_linear_state_machine / stock_animal_compete_release_cycle_across_go_rounds
      rationale: That instance's final assert verifies Entry.status == COMPETED after the second go-round VERIFY (bubble-up).
  - name: voided_result_cannot_be_verified
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.RunResult
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'A VOIDED RunResult is terminal: VERIFY on it returns ERR_INVALID_STATE and the assignment stays PENDING.'
    test_recipe:
      setup:
      - Rodeo IN_PROGRESS; one DRAWN entry with PENDING assignment; one RECORDED result, then VOIDED
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Lubbock Rodeo
          city: Lubbock
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BULL_RIDING
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 5
          payout_places: 1
        as: CommitteeAdmin
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      - call: POST /api/performances
        payload:
          rodeo_id: ${r_id}
          label: Fri
          arena: Main
          starts_at: '2026-08-14T19:00:00Z'
          ends_at: '2026-08-14T22:00:00Z'
          arena_capacity: 100
        as: CommitteeAdmin
        captures:
          p_id: $.data.id
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: OPEN_ENTRIES
        as: CommitteeAdmin
      - call: POST /api/contestants
        payload:
          card_number: PRCA-250
          full_name: Rider V2
        as: EntryOffice
        captures:
          c_v: $.data.id
      - call: POST /api/entries
        payload:
          contestant_id: ${c_v}
          rodeo_event_id: ${ev_id}
        as: EntryOffice
        captures:
          e_v: $.data.id
      - call: POST /api/stock-contracts
        payload:
          rodeo_id: ${r_id}
          contractor_name: Bar None
          day_rate_cents: 10000
          per_out_fee_cents: 2000
        as: CommitteeAdmin
        captures:
          k_id: $.data.id
      - call: POST /api/stock-contracts/${k_id}/transition
        payload:
          action: ACTIVATE
        as: CommitteeAdmin
      - call: POST /api/stock-animals
        payload:
          contract_id: ${k_id}
          tag_number: A100
          event_code: BULL_RIDING
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: LOCK_DRAW
        as: CommitteeAdmin
      - call: POST /api/rodeo-events/${ev_id}/draws
        payload:
          go_round_number: 1
          expected_rodeo_event_version: ${ev_v}
        as: CommitteeAdmin
      - call: POST /api/judges
        payload:
          card_number: J-25
          full_name: Judge V
          certification: PRCA_CARD
        as: CommitteeAdmin
        captures:
          j_id: $.data.id
      - call: POST /api/judge-assignments
        payload:
          judge_id: ${j_id}
          performance_id: ${p_id}
          position: ARENA_1
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: START_RODEO
        as: CommitteeAdmin
      - call: GET /api/draw-assignments
        payload:
          entry_id: ${e_v}
        as: CommitteeAdmin
        captures:
          da_v: $.data[0].id
      - call: POST /api/run-results
        payload:
          draw_assignment_id: ${da_v}
          judge_1_score: 30
          judge_2_score: 30
          qualified_flag: true
        as: Judge
        as_user_id: ${j_id}
        captures:
          rr_v: $.data.id
      - call: POST /api/run-results/${rr_v}/transition
        payload:
          action: VOID
        as: CommitteeAdmin
      trigger:
      - call: POST /api/run-results/${rr_v}/transition
        payload:
          action: VERIFY
        as: CommitteeAdmin
        captures:
