  # ---- ProductPlatform ----
  - method: POST
    path: "/plant/product-platforms"
    description: "Creates a product platform in DRAFT against an ACTIVE refrigerant program, optionally naming the platform it supersedes."
    roles: [DesignEngineer]
    code: 201
    input: ["model_code", "efficiency_tier", "refrigerant_program_id", "rated_capacity_btuh", "rated_eer", "rated_seer2", "compressor_part_number", "control_board_part_number", "max_charge_grams?", "supersedes_platform_id?"]
    output: ProductPlatform
    side_effects: ["status = DRAFT; revision_round = 0; warranty_posture = OK; blocked_region_codes = []; salable_region_count = 0", "RefrigerantProgram.affected_platform_count recomputed"]
  - method: GET
    path: "/plant/product-platforms"
    description: "Lists product platforms, filterable by program, by the platform they supersede, by tier, status, and warranty posture."
    roles: [PlantAdmin, DesignEngineer, ReliabilityEngineer, CertificationEngineer, RegulatoryAuditor, SupplyPlanner, ProductionPlanner, WarrantyAnalyst, DistributorRep]
    code: 200
    input: ["refrigerant_program_id?", "supersedes_platform_id?", "efficiency_tier?", "status?", "warranty_posture?", "limit?", "offset?"]
    output: ProductPlatform[]
    side_effects: []
  - method: GET
    path: "/plant/product-platforms/{id}"
    description: "Reads one platform including blocked_region_codes, salable_region_count, rolling_claim_rate_pct, and warranty_posture."
    roles: [PlantAdmin, DesignEngineer, ReliabilityEngineer, CertificationEngineer, RegulatoryAuditor, SupplyPlanner, ProductionPlanner, QualityTechnician, ProductionTechnician, WarrantyAnalyst, DistributorRep]
    code: 200
    input: []
    output: ProductPlatform
    side_effects: []
  - method: PATCH
    path: "/plant/product-platforms/{id}"
    description: "Edits the design record of a DRAFT platform - ratings, part numbers, and the A2L charge limit."
    roles: [DesignEngineer]
    code: 200
    input: ["rated_capacity_btuh?", "rated_eer?", "rated_seer2?", "compressor_part_number?", "control_board_part_number?", "max_charge_grams?"]
    output: ProductPlatform
    side_effects: ["Rejected with ERR_INVALID_PLATFORM_STATE unless status == DRAFT", "increments ProductPlatform.version by 1"]
  - method: POST
    path: "/plant/product-platforms/{id}/submit-engineering-review"
    description: "Submits a DRAFT platform for engineering review; an A2L platform must carry a charge limit first."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: ProductPlatform
    side_effects: ["state_machines.ProductPlatform.DRAFT_to_ENG_REVIEW; revision_round += 1; submitted_by_user_id = X-User-ID", "increments ProductPlatform.version by 1"]
  - method: POST
    path: "/plant/product-platforms/{id}/return-to-draft"
    description: "Sends a platform under review back to DRAFT for redesign; the reviewer may not be the submitter."
    roles: [ReliabilityEngineer]
    code: 200
    input: ["revision_notes"]
    output: ProductPlatform
    side_effects: ["state_machines.ProductPlatform.ENG_REVIEW_to_DRAFT; last_revision_notes stored", "increments ProductPlatform.version by 1"]
  - method: POST
    path: "/plant/product-platforms/{id}/release"
    description: "Releases a reviewed platform for production; the releaser may not be the submitter."
    roles: [ReliabilityEngineer]
    code: 200
    input: []
    output: ProductPlatform
    side_effects: ["state_machines.ProductPlatform.ENG_REVIEW_to_RELEASED; released_at stamped", "calculations.platform_regional_salability recomputes blocked_region_codes and salable_region_count", "increments ProductPlatform.version by 1"]
  - method: POST
    path: "/plant/product-platforms/{id}/retire"
    description: "Retires a released or restricted platform, withdrawing its certifications and unwinding its open builds and orders."
    roles: [PlantAdmin]
    code: 200
    input: ["reason?"]
    output: ProductPlatform
    side_effects: ["state_machines.ProductPlatform.RESTRICTED_to_RETIRED with all four cascade hops", "increments ProductPlatform.version by 1 and the version of every certification, build order, reservation, warehouse, order, and supply the cascade touches"]
  - method: GET
    path: "/plant/product-platforms/{id}/certification-records"
    description: "Lists the certification records filed for this platform, newest first."
    roles: [PlantAdmin, DesignEngineer, ReliabilityEngineer, CertificationEngineer, RegulatoryAuditor, SupplyPlanner]
    code: 200
    input: ["region_code?", "status?"]
    output: CertificationRecord[]
    side_effects: []
  - method: GET
    path: "/plant/product-platforms/{id}/warranty-claims"
    description: "Lists the warranty claims filed against this platform."
    roles: [PlantAdmin, ReliabilityEngineer, WarrantyAnalyst, DesignEngineer]
    code: 200
    input: ["status?", "component_type?", "supplier_lot_code?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/plant/product-platforms/{id}/warranty-analysis"
    description: "Computed read of the platform's warranty claim rate under either denominator basis, with the posture the stored basis produces."
    roles: [PlantAdmin, ReliabilityEngineer, WarrantyAnalyst, DesignEngineer]
    code: 200
    input: ["basis?"]
    output: { platform_id: uuid, basis: string, counted_claim_count: integer, denominator_units: integer, rolling_claim_rate_pct: decimal, warranty_posture: string }
    side_effects: ["calculations.platform_warranty_claim_rate under the requested basis and calculations.platform_warranty_posture under BUILT_BASIS; no stored row changes"]

  # ---- CertificationRecord ----
  - method: POST
