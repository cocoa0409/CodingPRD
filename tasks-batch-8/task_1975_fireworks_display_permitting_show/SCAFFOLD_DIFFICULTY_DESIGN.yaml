            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T22:45:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /pyro/sweeps/${sw}/verify", payload: { verdict: "VERIFIED" }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { final_fee: $.data.final_standby_fee_cents } }
            - { call: "GET /pyro/permit-applications/${app}", payload: {}, as: Operator, as_user_id: "${op}", captures: { prov_fee: $.data.provisional_standby_fee_cents } }
          assert:
            - "PermitApplication.${app}.provisional_standby_fee_cents == 128500 (25000 + 3 x 14500 + 2 x 30000)"
            - "DisplayEvent.${ev}.final_standby_fee_cents == 137683 (25000 + round_half_up(218 x 14500 / 60) + 60000)"
            - "final != 148000 (the forbidden ceil(218/60)=4 h ordering is rejected)"

      - name: allocation_rsd_circular_gate
        grounds:
          - calculations.c_allocation_rsd_gate
          - entities.ProductBatch.fields.qty_at_show
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — the
          candidate CHECK_OUT mutates the allocated set whose max diameter produces the RSD
          that gates the allocation. With boundary 300 ft: allocating a 4 in batch yields
          candidate RSD 280 <= 300 (accepted); a subsequent 5 in candidate raises the max to
          5 -> 350 > 300 (rejected), and after the rejection a further 4 in allocation still
          passes because the gate must be evaluated against the REJECTED-then-unchanged set.
        test_recipe:
          setup:
            - "Event declared 4 in, boundary 300 ft, permit APPROVED; magazine holds batch4 (4 in) and batch5 (5 in)"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-C", venue_name: "Depot Lot", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L4" }, as: Operator, as_user_id: "${op}", captures: { b4: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 5in", un_number: "UN0335", shell_diameter_in: 5, quantity_units: 20, new_per_unit_lbs: 0.75, lot_number: "L5" }, as: Operator, as_user_id: "${op}", captures: { b5: $.data.id } }
          trigger:
            - { call: "POST /pyro/batches/${b4}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/batches/${b5}/movements", payload: { movement_type: "CHECK_OUT", quantity: 5, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { err5: $.data.error_id } }
            - { call: "POST /pyro/batches/${b4}/movements", payload: { movement_type: "CHECK_OUT", quantity: 5, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "GET /pyro/batches/${b5}", payload: {}, as: Operator, as_user_id: "${op}", captures: { b5_show: $.data.qty_at_show } }
            - { call: "GET /pyro/batches/${b4}", payload: {}, as: Operator, as_user_id: "${op}", captures: { b4_show: $.data.qty_at_show } }
          assert:
            - "First 4in CHECK_OUT succeeds (candidate max 4 -> 280 <= 300)"
            - "5in CHECK_OUT rejected: err5 == ERR_FALLOUT_EXCEEDS_BOUNDARY (candidate max 5 -> 350 > 300)"
            - "ProductBatch.${b5}.qty_at_show == 0 (rejected allocation left the gating set unchanged)"
            - "Second 4in CHECK_OUT succeeds; ProductBatch.${b4}.qty_at_show == 15"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_application_info_request_cycle
        grounds:
          - state_machines.PermitApplication.INFO_REQUESTED_to_SUBMITTED
          - state_machines.DisplayEvent.REVISION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic revision loop on PermitApplication (SUBMITTED -> INFO_REQUESTED ->
          SUBMITTED) mirrored by the DisplayEvent cycle (SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED); after one full loop revision_count == 1 and the loop closes with a
          successful approve — a cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "Event DRAFT with CURRENT plan sp1; application submitted; marshal requests info; operator supersedes with plan sp2 and resubmits"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-D", venue_name: "Expo Grounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp1: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp1}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/request-info", payload: { decision_note: "move boundary" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_v2: $.data.version, ev_status: $.data.status } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D2", launch_area_width_ft: 220, launch_area_length_ft: 220, spectator_boundary_ft: 320, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v2}" }, as: Operator, as_user_id: "${op}", captures: { sp2: $.data.id } }
          trigger:
            - { call: "POST /pyro/permit-applications/${app}/resubmit", payload: { site_plan_id: "${sp2}" }, as: Operator, as_user_id: "${op}", captures: { rev_count: $.data.revision_count, app_status: $.data.status } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok now" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "GET /pyro/displays/${ev}/site-plans", payload: {}, as: Operator, as_user_id: "${op}", captures: { sp1_status: "$.data[0].status" } }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_final: $.data.status } }
          assert:
            - "resubmit response: PermitApplication.${app}.status == SUBMITTED and revision_count == 1"
            - "after approve: PermitApplication.${app}.status == APPROVED; DisplayEvent.${ev}.status == APPROVED"
            - "GET site-plans: sp1 (created first, data[0]) status == SUPERSEDED; sp2 status == CURRENT"
            - "mid-cycle DisplayEvent status observed as REVISION_REQUESTED (captured ev_status)"

      - name: product_batch_checkout_return_loop
        grounds:
          - state_machines.ProductBatch.CHECKED_OUT_to_IN_MAGAZINE
          - calculations.c_batch_quantities
        distinguishing_aspect: |
          Cyclic machine on ProductBatch (IN_MAGAZINE -> CHECKED_OUT -> IN_MAGAZINE via
          CHECK_OUT then full RETURN) on a different entity than
          permit_application_info_request_cycle; the loop restores every derived quantity
          (qty_at_show back to 0, quantity_remaining unchanged at 50).
        test_recipe:
          setup:
            - "Event APPROVED; batch of 50 units (0.50 lbs each) in MAG-1"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-E", venue_name: "Riverfront", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "GET /pyro/batches/${b1}", payload: {}, as: Operator, as_user_id: "${op}", captures: { mid_status: $.data.status, mid_show: $.data.qty_at_show, mid_mag: $.data.qty_at_magazine } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "RETURN", quantity: 10, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "GET /pyro/batches/${b1}", payload: {}, as: Operator, as_user_id: "${op}", captures: { end_status: $.data.status, end_show: $.data.qty_at_show, end_mag: $.data.qty_at_magazine, end_rem: $.data.quantity_remaining } }
          assert:
            - "after CHECK_OUT 10: status == CHECKED_OUT, qty_at_show == 10, qty_at_magazine == 40"
            - "after RETURN 10: status == IN_MAGAZINE, qty_at_show == 0, qty_at_magazine == 50, quantity_remaining == 50"
            - "the cycle closed with zero drift in batch quantities"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: operator_suspend_cascade
        grounds:
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - state_machines.DisplayEvent.transitions
          - state_machines.PermitApplication.transitions
          - calculations.c_magazine_mass
        distinguishing_aspect: |
          Depth-3 cascade from POST /pyro/operators/{id}/suspend: Operator ->
          SUSPENDED mutates each non-terminal DisplayEvent to CANCELLED (link 1); each
          cancellation auto-creates RETURN InventoryMovements for checked-out product
          (link 2, caused by the cancellation, not the suspend); each RETURN recomputes
          the Magazine.current_new_lbs aggregate (link 3, caused by the movement write).
          Also flips SUBMITTED applications to WITHDRAWN and posts to RELEASED.
        test_recipe:
          setup:
            - "Operator owns E1 (STANDBY_CONFIRMED, 20 units checked out of batch b1, one SECURED post) and E2 (SUBMITTED with a pending application)"
            - "Magazine current_new_lbs == 15.00 after the CHECK_OUT (50 x 0.50 in - 20 x 0.50 out)"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-F1", venue_name: "North", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { e1: $.data.id, e1_v: $.data.version } }
