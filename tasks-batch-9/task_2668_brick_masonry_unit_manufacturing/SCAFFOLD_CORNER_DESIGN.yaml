              payload: { order_code: "O1", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 9600, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o1: "$.data.id" }
            - call: "POST /orders/${o1}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { est_total: "$.data.estimated_freight_cents" }
            - call: "POST /orders/${o1}/blends"
              payload: { blend_code: "B1", target_color_index_min: 48.00, target_color_index_max: 54.00, requested_units: 9600 }
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { b1: "$.data.id", b1v1: "$.data.version" }
            - call: "POST /blends/${b1}/components"
              payload: { fired_lot_id: "${l1}", units: 9600, expected_blend_version: "${b1v1}" }
              as: BlendTechnician
              as_user_id: "blend-001"
            - call: "POST /blends/${b1}/compose"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
            - call: "POST /blends/${b1}/certify"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
              captures: { b1_status: "$.data.status" }
          trigger:
            - call: "POST /orders/${o1}/package"
              payload: { pallet_count: 20, band_count: 19 }
              as: LogisticsCoordinator
              as_user_id: "logi-001"
              captures: { e_band: "$.data.error_id" }
            - call: "GET /orders/${o1}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logi-001"
              captures: { mid_status: "$.data.fulfillment_status", mid_pallets: "$.data.pallet_count", mid_final: "$.data.final_freight_cents" }
            - call: "POST /orders/${o1}/package"
              payload: { pallet_count: 20, band_count: 20 }
              as: LogisticsCoordinator
              as_user_id: "logi-001"
              captures: { status_2: "$.data.fulfillment_status", tons: "$.data.final_billable_tons", base: "$.data.final_base_freight_cents", sur: "$.data.final_fuel_surcharge_cents", tot: "$.data.final_freight_cents", var: "$.data.freight_variance_cents" }
          assert:
            - "${b1_status} == CERTIFIED and ${est_total} == 56881 from the ESTIMATED variant at assignment"
            - "${e_band} == ERR_BAND_COUNT_INSUFFICIENT with HTTP 422 - 19 bands cannot secure 20 pallets, while 20 * 500 == 10000 >= 9600 keeps priority 46 satisfied"
            - "${mid_status} == IN_BLENDING with ${mid_pallets} == null and ${mid_final} == null - the rejected packaging wrote nothing"
            - "${status_2} == PACKAGED once band_count equals pallet_count, so the comparison is inclusive"
            - "${tons} == 22.23 == round((20 * 60 + 20 * 3.0 + 9600 * 4.5) / 2000, 2) == round(44460 / 2000, 2)"
            - "${base} == 56020 == round_half_up(60 * 42 * 22.23) and ${sur} == 2521 == round_half_up(56020 * 4.5 / 100)"
            - "${tot} == 58541 and ${var} == 1660 == 58541 - 56881"

      - name: blend_not_composed_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BLEND_NOT_COMPOSED]
        excluded_because:
          difficulty_instance: certify_on_draft_blend_returns_blend_not_composed_masking_panel_not_approved
          rationale: "That instance certifies a DRAFT blend on a panel-required order and asserts the 409 arrives instead of the panel error, which triggers this code in its most interesting position."

      - name: panel_approval_expired_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PANEL_APPROVAL_EXPIRED]
        excluded_because:
          difficulty_instance: blend_certify_blocked_by_expired_panel_approval_despite_approved_status
          rationale: "The clock is advanced past the panel's 180-day window there, so the code is triggered together with the boundary at expires_at itself."

      - name: formulation_not_qualified_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FORMULATION_NOT_QUALIFIED]
        excluded_because:
          difficulty_instance: production_run_and_kiln_run_creation_require_qualified_formulation
          rationale: "Both endpoints that consume a formulation are attacked in the DRAFT state there, before and after qualification, which is a strictly stronger check than a single trigger."

      - name: blend_not_certified_and_pallet_shortfall_codes_are_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BLEND_NOT_CERTIFIED]
          - errors[ERR_PALLET_COUNT_INSUFFICIENT]
        excluded_because:
          difficulty_instance: package_with_uncertified_blend_returns_blend_not_certified_masking_pallet_shortfall
          rationale: "The masking pair triggers both codes in one instance: the 409 first, then the 422 once the blend is certified and only the pallet count is wrong."

      - name: panel_revision_limit_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PANEL_REVISION_LIMIT]
        excluded_because:
          difficulty_instance: sample_panel_revision_cycle_capped_at_three_rounds
          rationale: "The cycle is walked three times there and the fourth request-revision is rejected with this code, which also fixes the boundary at revision_round 3."

      - name: kiln_window_conflict_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_KILN_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: kiln_firing_window_closed_interval_with_cooldown_buffer_collides_on_touch
          rationale: "The buffer-inflated closed interval is probed at exact adjacency and one hour beyond it there, so the code is triggered at its boundary rather than deep inside an overlap."

      - name: kiln_car_occupied_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_KILN_CAR_OCCUPIED]
        excluded_because:
          difficulty_instance: kiln_car_occupancy_half_open_interval_allows_exact_adjacency
          rationale: "The car's half-open window is overlapped by one hour there to trigger the code, and touched exactly to prove the adjacent booking is legal."

      - name: no_plant_in_market_radius_code_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_PLANT_IN_MARKET_RADIUS]
        excluded_because:
          difficulty_instance: market_radius_inclusive_at_sixty_miles_and_rejects_sixty_one
          rationale: "The jobsite is moved one mile beyond the radius there, which triggers the code at the exact boundary where an inclusive comparison stops being satisfied."

  # =======================================================================
  # SECTION 7 - RBAC
  # =======================================================================
  - section: rbac
    instances:
      - name: plant_admin_exclusive_writes_are_refused_to_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.PlantAdmin
          - validations[priority=3]
        distinguishing_aspect: "Each of the four PlantAdmin-only endpoints is probed by a different unauthorised role and then repeated by PlantAdmin, so a role table that leaks one endpoint is caught without the test depending on any resource state."
        test_recipe:
          setup:
            - "One ACTIVE plant P1 and no other rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /plants"
              payload: { plant_code: "P9", name: "Rogue Brick", grid_x: 5, grid_y: 5, market_radius_miles: 100, freight_rate_cents_per_ton_mile: 40, base_capacity_green_units_per_day: 10000, unloading_equipment_available: ["CRANE"] }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_plants: "$.data.error_id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-X", material_type: "CLAY", proven_reserve_tons: 100.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { e_pits: "$.data.error_id" }
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K9", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { e_kilns: "$.data.error_id" }
            - call: "POST /plants/${p1}/idle"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
              captures: { e_idle: "$.data.error_id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { k1: "$.data.id" }
            - call: "POST /plants/${p1}/idle"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1_status: "$.data.status" }
          assert:
            - "${e_plants}, ${e_pits}, ${e_kilns} and ${e_idle} are all ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "The PlantOperator rejection matters most: it owns the plant named by its X-User-ID and still cannot create a kiln, so plant ownership is not authorisation"
            - "${pit_a} and ${k1} are created with HTTP 201 by PlantAdmin, and ${p1_status} == IDLED"
            - "GET /plants returns total_count == 1 - the rogue plant creation never landed"

      - name: kiln_car_creation_is_shared_but_the_operator_is_pinned_to_its_own_plant
        claim_type: shared_operations
        grounds:
          - roles.PlantAdmin
          - roles.PlantOperator
          - validations[priority=5]
        distinguishing_aspect: "The only endpoint two roles share is exercised by both, which forces the role table to model shared operations separately from exclusive ones, and the entity-backed operator is then pointed at the wrong plant to separate the 403 for scope from the 403 for role."
        test_recipe:
          setup:
            - "Two ACTIVE plants P1 and P2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants"
              payload: { plant_code: "P2", name: "Sandhill Brick", grid_x: 200, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 40, base_capacity_green_units_per_day: 30000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p2: "$.data.id" }
          trigger:
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1: "$.data.id", c1_status: "$.data.status" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C2", capacity_green_units: 8000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { c2: "$.data.id" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C3", capacity_green_units: 8000 }
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_scope: "$.data.error_id" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C4", capacity_green_units: 8000 }
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { e_role: "$.data.error_id" }
          assert:
            - "Both the PlantAdmin and the PlantOperator creations return HTTP 201 with ${c1_status} == IDLE, and ${c1} != ${c2}"
            - "${e_scope} == ERR_PLANT_SCOPE_VIOLATION with HTTP 403 - the operator identity ${p2} may not add a car to ${p1}"
            - "${e_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 - BlendTechnician is not on the endpoint's role list at all"
            - "GET /plants/${p1}/kiln-cars returns total_count == 2 and GET /plants/${p2}/kiln-cars returns total_count == 0"

      - name: operator_scope_is_enforced_on_every_production_endpoint_and_role_check_comes_first
        claim_type: exclusive_operations
        grounds:
          - roles.PlantOperator
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: "All six PlantOperator-only endpoints are walked twice - once with the neighbouring plant's identity and once correctly - so the scope check has to be resolved transitively through ProductionRun.plant_id and Kiln.plant_id rather than only on the direct URL parent."
        test_recipe:
          setup:
            - "Plant P1 with QUALIFIED formulation F1, kiln K1 and car C1; plant P2 exists but owns nothing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants"
              payload: { plant_code: "P2", name: "Sandhill Brick", grid_x: 200, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 40, base_capacity_green_units_per_day: 30000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p2: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { k1: "$.data.id" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_run_scope: "$.data.error_id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e_run_role: "$.data.error_id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /production-runs/${r1}/close-green"
              payload: { green_loss_units: 400 }
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_close_scope: "$.data.error_id" }
            - call: "POST /production-runs/${r1}/close-green"
              payload: { green_loss_units: 400 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1_status: "$.data.status" }
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR1", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_kr_scope: "$.data.error_id" }
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR1", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1: "$.data.id", kr1v1: "$.data.version" }
            - call: "POST /kiln-runs/${kr1}/load"
              payload: { production_run_id: "${r1}", kiln_position: 3, expected_kiln_run_version: "${kr1v1}" }
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_load_scope: "$.data.error_id" }
            - call: "POST /kiln-runs/${kr1}/load"
              payload: { production_run_id: "${r1}", kiln_position: 3, expected_kiln_run_version: "${kr1v1}" }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { loaded: "$.data.loaded_units" }
            - call: "POST /kiln-runs/${kr1}/start"
              payload: {}
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_start_scope: "$.data.error_id" }
            - call: "POST /kiln-runs/${kr1}/start"
              payload: {}
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1_status: "$.data.status" }
            - call: "POST /kiln-runs/${kr1}/grade"
              payload: { actual_peak_temp_c: 1040, actual_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p2}"
              captures: { e_grade_scope: "$.data.error_id" }
            - call: "POST /kiln-runs/${kr1}/grade"
              payload: { actual_peak_temp_c: 1040, actual_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1_final: "$.data.status", graded_by: "$.data.graded_by_user_id" }
          assert:
            - "${e_run_scope}, ${e_close_scope}, ${e_kr_scope}, ${e_load_scope}, ${e_start_scope} and ${e_grade_scope} are all ERR_PLANT_SCOPE_VIOLATION with HTTP 403"
            - "${e_run_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 - PlantAdmin creates the plant and its equipment but never a production run, and the role check at priority 3 answers before the scope check at priority 5"
            - "The correctly scoped repeats all succeed: ${r1_status} == SET, ${loaded} == 9600, ${kr1_status} == FIRING and ${kr1_final} == GRADED"
            - "${graded_by} == ${p1} - the operator's X-User-ID is a Plant id, which is what makes the scope check possible"
            - "The close-green, load and grade rejections show the scope resolving transitively: the URL names a run or a kiln run, and the plant is reached through ProductionRun.plant_id and Kiln.plant_id"

      - name: workflow_roles_cannot_reach_into_each_other_s_exclusive_steps
        claim_type: exclusive_operations
        grounds:
          - roles.BodyEngineer
          - roles.BlendTechnician
          - roles.QualityManager
          - roles.ArchitectReviewer
          - roles.SalesRep
          - roles.LogisticsCoordinator
          - validations[priority=3]
        distinguishing_aspect: "Because the role check sits at priority 3 and the path 404 at priority 4, every probe can use a syntactically valid but non-existent id: a 403 rather than a 404 proves authorisation is decided before any row is fetched."
        test_recipe:
          setup:
            - "Empty database; the ids below deliberately resolve to nothing"
            - "Only the clock call is made, so no row can influence the outcome"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /orders"
              payload: { order_code: "O9", jobsite_grid_x: 1, jobsite_grid_y: 1, requested_units: 1000, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "CRANE", banding_type: "STEEL" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_orders: "$.data.error_id" }
            - call: "POST /blends/00000000-0000-4000-8000-0000000000a1/certify"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { e_certify: "$.data.error_id" }
            - call: "POST /blends/00000000-0000-4000-8000-0000000000a2/compose"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
              captures: { e_compose: "$.data.error_id" }
            - call: "POST /sample-panels/00000000-0000-4000-8000-0000000000a3/submit"
              payload: {}
              as: ArchitectReviewer
              as_user_id: "arch-001"
              captures: { e_submit: "$.data.error_id" }
            - call: "POST /sample-panels/00000000-0000-4000-8000-0000000000a4/approve"
              payload: {}
