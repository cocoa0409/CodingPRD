              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == ERR_ACCOMMODATION_DATE_IN_PAST"
            - "Complaint.${cmp_id}.state == NEW"
            - "Complaint.${cmp_id}.route is null"
            - "Complaint.${cmp_id}.needed_by_date is null"

      - name: corner_priority_ordering_between_two_violated_rules
        claim_type: priority_ordering
        grounds:
          - validations[priority=32]
          - validations[priority=68]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / publish_report_state_error_precedes_missing_in_scope_components
          rationale: "That instance violates the state rule at priority 32 and the referential rule at priority 68 in one call and asserts the lower-priority error wins."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_recompute_posture_refreshes_after_clock_move
        claim_type: computed_read
        grounds:
          - calculations.product_publication_posture
          - entities.Product.fields.overdue_committed_blocker_count
        distinguishing_aspect: "Moving the clock past a published BLOCKER's public_target_date writes nothing on its own; only POST /products/{id}/recompute-posture turns OPEN into FROZEN and sets overdue_committed_blocker_count to 1."
        test_recipe:
          setup:
            - "Standard WCAG_2_2 whose only criterion is at level AAA, so nothing is in scope for a target_level AA product and publication has no coverage precondition to satisfy"
            - "One in-scope component with design_review_state REVIEWED_PASS"
            - "One BLOCKER issue with publish_intent INCLUDED and target_remediation_date 2026-08-15, COMMITTED to train 2026.08 (window 2026-08-05..2026-08-20, freeze_days 2)"
            - "One report PUBLISHED at 2026-08-01, so the issue is PUBLISHED_COMMITTED with public_target_date 2026-08-15 and the posture is OPEN"
            - "The logical clock is then moved to 2026-08-16T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.4.6", title: "Contrast Enhanced", level: "AAA", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/design-review"
              payload: { review_decision: "PASS", review_note: "Acceptance criteria include the AT matrix" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "POST /release-trains"
              payload: { name: "Train 2026.08", window_start: "2026-08-05", window_end: "2026-08-20", freeze_days: 2, effort_capacity_points: 10, remediation_budget_cents: 0 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "BLOCKER", summary: "Primary navigation is unreachable by keyboard", effort_points: 2, target_remediation_date: "2026-08-15", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_id: $.data.id }
            - call: "POST /known-issues/${iss_id}/triage"
              payload: { triage_note: "Reproduced on NVDA and on keyboard only" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v1: $.data.version }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v1}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id }
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Ready for reviewer sign-off" }
              as: ProductOwner
              as_user_id: "${prod_id}"
            - call: "POST /conformance-reports/${rep_id}/approve"
              payload: { approval_note: "Approved with no in-scope criteria pinned" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { posture_before: $.data.publication_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: AccessibilityLead
          trigger:
            - call: "POST /products/${prod_id}/recompute-posture"
              payload: { reason: "Nightly overdue sweep after the clock passed the public target date" }
              as: AccessibilityLead
              captures: { posture_after: $.data.publication_posture, overdue: $.data.overdue_committed_blocker_count }
          assert:
            - "${posture_before} == OPEN"
            - "HTTP 200"
            - "${posture_after} == FROZEN"
            - "${overdue} == 1"
            - "KnownIssue.${iss_id}.state == PUBLISHED_COMMITTED"
            - "KnownIssue.${iss_id}.public_target_date == 2026-08-15"

      - name: corner_link_issue_associates_complaint_and_issue
        claim_type: cross_reference_link
        grounds:
          - state_machines.Complaint.TRIAGED_to_LINKED
          - entities.KnownIssue.fields.linked_complaint_count
        distinguishing_aspect: "A successful link writes both sides in one request: the complaint becomes LINKED with linked_issue_id set and the issue's linked_complaint_count rises from 0 to 1 while its INTAKE_ESTIMATE risk_score is left unamplified."
        test_recipe:
          setup:
            - "One product with one in-scope component of user_reach_pct 60 and criterion 1.1.1 tagged VISION only"
            - "One OPEN SERIOUS issue on that component with risk_variant INTAKE_ESTIMATE and risk_score 25 * 1 * 0.80 = 20.00"
            - "One complaint on the same product, TRIAGED with route REMEDIATION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 2, target_remediation_date: "2026-12-01", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_id: $.data.id, score_before: $.data.risk_score }
            - call: "POST /complaints"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", channel: "EMAIL", description: "Images in the report viewer have no alternative text", disability_category: "VISION" }
              as: CustomerLiaison
              captures: { cmp_id: $.data.id }
            - call: "POST /complaints/${cmp_id}/triage"
              payload: { route: "REMEDIATION" }
              as: AccessibilityLead
          trigger:
            - call: "POST /complaints/${cmp_id}/link-issue"
              payload: { known_issue_id: "${iss_id}" }
              as: AccessibilityLead
              captures: { state: $.data.state, linked: $.data.linked_issue_id }
          assert:
            - "${score_before} == 20.00"
            - "HTTP 200"
            - "${state} == LINKED"
            - "${linked} == ${iss_id}"
            - "KnownIssue.${iss_id}.linked_complaint_count == 1"
            - "KnownIssue.${iss_id}.risk_score == 20.00 (still the INTAKE_ESTIMATE variant, no complaint amplification)"

      - name: corner_clock_endpoint_advances_time_without_writing
        claim_type: action_endpoint
        grounds:
          - entities.Product.fields.publication_posture
          - calculations.product_publication_posture
        distinguishing_aspect: "POST /_clock/set_current_utc only moves the logical clock: a 65-day jump leaves Product.version and publication_posture exactly as they were, so nothing is recomputed until an API write or an explicit recompute."
        test_recipe:
          setup:
            - "One product with one in-scope component and no assessments, so posture is OPEN and version is 2 after the component create"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { v_before: $.data.version, posture_before: $.data.publication_posture, updated_before: $.data.updated_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: AccessibilityLead
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { v_after: $.data.version, posture_after: $.data.publication_posture, updated_after: $.data.updated_at }
          assert:
            - "HTTP 200 on the clock call"
            - "${posture_before} == OPEN and ${posture_after} == OPEN"
            - "${v_after} == ${v_before}"
            - "${updated_after} == ${updated_before}"

      - name: corner_deallocate_budget_without_allocation_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=40]
          - entities.ReleaseTrain.fields.allocation_state
        distinguishing_aspect: "deallocate-budget is only legal on an ALLOCATED train: against a fresh UNALLOCATED train it returns ERR_TRAIN_BUDGET_NOT_ALLOCATED 409 and unallocated_cents is untouched."
        test_recipe:
          setup:
            - "One product and one release train with remediation_budget_cents 60327 in allocation_state UNALLOCATED and no committed issues"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "Train 2026.09", window_start: "2026-09-05", window_end: "2026-09-27", freeze_days: 2, effort_capacity_points: 10, remediation_budget_cents: 60327 }
              as: AccessibilityLead
              captures: { train_id: $.data.id, alloc_state: $.data.allocation_state }
          trigger:
            - call: "POST /release-trains/${train_id}/deallocate-budget"
              payload: { product_id: "${prod_id}", reason: "Rolling back an allocation that never happened" }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "${alloc_state} == UNALLOCATED"
            - "HTTP 409"
            - "${err} == ERR_TRAIN_BUDGET_NOT_ALLOCATED"
            - "ReleaseTrain.${train_id}.unallocated_cents == 60327"
            - "ReleaseTrain.${train_id}.allocation_state == UNALLOCATED"

      - name: corner_allocate_budget_action_endpoint
        claim_type: action_endpoint
        grounds:
          - calculations.remediation_budget_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / budget_waterfall_rounds_per_issue_before_allocating
          rationale: "That instance drives POST /release-trains/{id}/allocate-budget end to end and asserts the resulting per-issue funded_cents, funding_state and unallocated_cents."

      - name: corner_criterion_assessment_attest_action_endpoint
        claim_type: action_endpoint
        grounds:
          - state_machines.CriterionAssessment.DRAFT_to_ATTESTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / attest_requires_component_complete
          rationale: "Both the successful attest and its cross-entity precondition failure are asserted there."

