          trigger: "POST /night-audit/settlement-batches with business_date_id ${bd1_id}, outlet_id ${lounge_id}, tender_type CASH, shift_start_at 2026-08-01T22:00:00.000Z, shift_end_at 2026-08-01T14:00:00.000Z and declared_amount 100.00 as OutletManager (X-User-ID ${lounge_id})."
          assert:
            - "HTTP 422 with data.error_id == \"ERR_SHIFT_WINDOW_INVALID\"."
            - "The same request with shift_start_at equal to shift_end_at (both 2026-08-01T14:00:00.000Z) also fails 422 ERR_SHIFT_WINDOW_INVALID, because the declared rule is strictly before."
            - "POST /night-audit/authorization-documents with doc_type COMP_ROOM, folio_id ${folio_id}, valid_from_date 2026-08-05 and valid_to_date 2026-08-01 fails 422 ERR_SHIFT_WINDOW_INVALID - the same rule, a different entity."
            - "The same document with valid_from_date and valid_to_date both 2026-08-01 returns 201, because that rule is at-or-before rather than strictly before."
            - "GET /night-audit/settlement-batches?business_date_id=${bd1_id} returns 0 rows, so neither rejected window created anything."
            - "A batch with shift_start_at 2026-08-01T14:00:00.000Z and shift_end_at 2026-08-01T22:00:00.000Z returns 201, proving only the ordering was at fault."

