      - name: an_unknown_or_absent_role_header_cannot_act
        claim_type: unknown_role_rejected
        grounds:
          - validations.priority_2
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "A syntactically fine request whose X-Role is a plausible but undeclared role (BillingClerk) is refused with ERR_UNAUTHORIZED, and so is a request with no X-Role at all - the check is a whitelist over the five declared roles, not a blacklist, and it applies to reads as well as writes."
        test_recipe:
          setup:
            - "A clean system at the default clock 2026-08-01T00:00:00Z with one period created by the ComplianceOfficer."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
          trigger:
            - call: "GET /ltch/cost-reporting-periods/${period_id}"
              payload: {}
              as: BillingClerk
              captures: { e_unknown_read: $.data.error_id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-532", full_name: "Ivy Ghost", birth_date: "1984-05-16", primary_payer: "MEDICARE_FFS" }
              as: BillingClerk
              captures: { e_unknown_write: $.data.error_id }
          assert:
            - "e_unknown_read == e_unknown_write == ERR_UNAUTHORIZED with HTTP 403 - X-Role: BillingClerk is not one of the five declared roles"
            - "The same two calls with the X-Role header omitted entirely also return ERR_UNAUTHORIZED with HTTP 403"
            - "An empty X-Role (\"\") behaves identically"
            - "No Patient row was created: GET /ltch/patients/{id} for any id returns ERR_PATIENT_NOT_FOUND and the write left no trace"
            - "The refusal is not ERR_VALIDATION even though the payload was well-formed"

