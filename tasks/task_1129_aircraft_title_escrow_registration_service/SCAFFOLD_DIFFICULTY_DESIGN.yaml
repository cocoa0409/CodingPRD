  - rule_id: resource_temporal_overlap
    instances:
      - name: t1_aircraft_escrow_occupation
        grounds: ["validations[priority=13]", state_machines.EscrowFile, entities.EscrowFile.fields.status]
        distinguishing_aspect: |
          Interval semantics: unbounded-until-terminal occupation — an EscrowFile occupies its Aircraft
          from creation until a terminal state (CANCELLED/VERIFIED); a second file is rejected while the
          first is non-terminal and accepted once the first is CANCELLED. Resource entity: Aircraft.
        test_recipe:
          setup: ["aircraft with buyer/seller parties; one OPENED escrow file"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N900T1", serial_number: "S-900", make_model: "Diamond DA62", year: 2019 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 11000000, annual_registration_fee_cents: 0, proration_method: "MONTHLY", expected_close_date: "2026-07-31" }, as: EscrowOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /api/escrow-files/${f1}/cancel", payload: {}, as: EscrowOfficer }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 11000000, annual_registration_fee_cents: 0, proration_method: "MONTHLY", expected_close_date: "2026-07-31" }, as: EscrowOfficer, captures: { f2: $.data.id, f2_st: $.data.status } }
          assert:
            - "second create while file1 non-terminal: rejected ERR_AIRCRAFT_UNDER_CONTRACT (409)"
            - "after file1 CANCELLED (occupation interval closed): create succeeds, file2 status OPENED"
      - name: t2_lien_quote_window
        grounds: ["validations[priority=15]", state_machines.LienRelease.QUOTED_to_QUOTE_EXPIRED, state_machines.Lien.RELEASE_PENDING_to_DISCOVERED]
        distinguishing_aspect: |
          Interval semantics: bounded half-open-with-inclusive-end window [quote_date, good_through_date]
          on a different resource entity (Lien): a second release request is rejected on 2026-06-10 AND on
          2026-06-30 itself (good_through is inclusive), but allowed on 2026-07-01 after the clock sweep
          expires the quote and the lien compensates back to DISCOVERED.
        test_recipe:
          setup: ["lien L1 (500000) with release r1 QUOTED FLAT good_through 2026-06-30; quote made at clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N910T2", serial_number: "S-910", make_model: "Piper Archer", year: 2013 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [ { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 500000, lien_type: "FAA_RECORDED", filed_at: "2025-03-01" } ] }, as: EscrowOfficer }
            - { call: "GET /api/liens", payload: { escrow_file_id: "${f}" }, as: EscrowOfficer, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { r1: $.data.id } }
            - { call: "POST /api/releases/${r1}/quote", payload: { payoff_basis: "FLAT", quoted_payoff_cents: 500000, good_through_date: "2026-06-30" }, as: LenderRep, as_user_id: "${ln}" }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { err_mid: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T12:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { err_edge: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: EscrowManager }
            - { call: "GET /api/liens/${l1}", payload: {}, as: EscrowOfficer, captures: { lien_st: $.data.status } }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { r2: $.data.id, r2_st: $.data.status } }
          assert:
            - "2026-06-10 (inside window): new release rejected ERR_QUOTE_WINDOW_OPEN"
            - "2026-06-30 (== good_through_date): still rejected ERR_QUOTE_WINDOW_OPEN — window end is INCLUSIVE"
            - "2026-07-01: sweep flipped r1 to QUOTE_EXPIRED and lien back to DISCOVERED (compensation)"
            - "second release then created (status REQUESTED) — window freed exactly one day after good_through"

  - rule_id: compensating_invariant
    instances:
      - name: i1_deposit_return_conserves_escrow_cash
        grounds: [calculations.closing_statement_totals, state_machines.Deposit.RECEIVED_to_RETURNED, entities.EscrowFile.fields.escrow_balance_cents]
        distinguishing_aspect: |
          Conserved quantity: escrow cash in cents. Invariant: escrow_balance_cents ==
          sum(RECEIVED deposits) - sum(RELEASED disbursements). Forward action (deposit 5000000) paired
          with its compensating action (return the same deposit) restores balance and total_funded to the
          exact pre-action values (0), with no drift.
        test_recipe:
          setup: ["CLEARED file, due 10150000, zero deposits"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N920C1", serial_number: "S-920", make_model: "Cessna TTx", year: 2016 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v1: $.data.version, bal0: $.data.escrow_balance_cents, fund0: $.data.total_funded_cents } }
          trigger:
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 5000000, purpose: "EARNEST_MONEY", expected_escrow_file_version: "${v1}" }, as: EscrowOfficer, captures: { dep: $.data.id } }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { bal1: $.data.escrow_balance_cents, fund1: $.data.total_funded_cents } }
            - { call: "POST /api/deposits/${dep}/return", payload: {}, as: EscrowOfficer, captures: { dep_st: $.data.status } }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { bal2: $.data.escrow_balance_cents, fund2: $.data.total_funded_cents } }
          assert:
            - "pre-action: escrow_balance_cents == 0 and total_funded_cents == 0"
            - "after deposit: escrow_balance_cents == 5000000 and total_funded_cents == 5000000"
            - "after compensating return: escrow_balance_cents == 0 and total_funded_cents == 0 exactly (no drift); Deposit.status == RETURNED"
      - name: i2_cancel_conserves_aircraft_availability
        grounds: ["validations[priority=13]", state_machines.EscrowFile, entities.EscrowFile.fields.aircraft_id]
        distinguishing_aspect: |
          Conserved quantity: aircraft availability count (0 or 1 non-terminal EscrowFile per Aircraft) —
          a different conserved quantity than cash. Forward action (open file) paired with its compensating
          action (cancel file) restores the availability count: 0 -> 1 -> 0, and a subsequent open succeeds.
        test_recipe:
          setup: ["aircraft with no escrow files (availability count 0)"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N930C2", serial_number: "S-930", make_model: "Bonanza G36", year: 2015 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 9000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f1: $.data.id } }
            - { call: "POST /api/escrow-files/${f1}/cancel", payload: {}, as: EscrowOfficer, captures: { f1_st: $.data.status } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 9500000, annual_registration_fee_cents: 0, proration_method: "MONTHLY", expected_close_date: "2026-08-31" }, as: EscrowOfficer, captures: { f2: $.data.id, f2_st: $.data.status } }
          assert:
            - "availability count path: 0 -> 1 (open) -> 0 (cancel) — the open/cancel pair conserves the count"
            - "EscrowFile.${f1}.status == CANCELLED"
            - "re-open succeeds: EscrowFile.${f2}.status == OPENED (count 0 -> 1 again), proving the compensation fully released the aircraft"
