        distinguishing_aspect: |
          A different contended resource (StorageTank) and deliberately different interval semantics: a
          HALF-OPEN window [maintenance_window_start, maintenance_window_end) with no buffer at all, tested
          at both endpoints of the interval. Adjudication: the logical clock is held at 2026-08-11T00:00:00Z
          and the nightly run is never invoked, so the tank stays ONLINE and validations[priority 28]
