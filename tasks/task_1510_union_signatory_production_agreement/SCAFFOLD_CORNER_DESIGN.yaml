          assert:
            - "Production.${prod_id}.budget_cents == 10000000"
            - "Production.${prod_id}.agreement_tier == MODIFIED_LOW_BUDGET (no downgrade)"
            - "Bond.${bond_id}.amount_required_cents == 5000000 and status == UNDERFUNDED (unchanged by the decrease)"

      - name: min_staffing_minimum_boundary_inclusive
        claim_type: threshold_boundary
        grounds:
          - "calculations.min_staffing_check"
          - "validations[priority=19]"
          - "errors[ERR_MIN_STAFF_UNMET]"
        distinguishing_aspect: "Staffing minimum is INCLUSIVE: ULB with CAMERA 1 / GRIP_ELECTRIC 0 / SOUND 1 fails with ERR_MIN_STAFF_UNMET (count == min - 1 in GRIP_ELECTRIC); adding the missing grip (exactly the minimum everywhere) passes and flips IN_PRODUCTION."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING (bond posted); crew: CAMERA W-CAM-1 and SOUND W-SND-1 only"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Dittany LLC", fein: "20-0000029" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "NEW_MEDIA", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
