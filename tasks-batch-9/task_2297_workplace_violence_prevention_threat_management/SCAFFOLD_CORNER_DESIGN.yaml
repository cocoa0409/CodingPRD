      - name: return_for_revision_clears_the_submitter_stamp
        claim_type: side_effect_execution
        grounds:
          - state_machines.PreventionPlan.IN_REVIEW_to_DRAFT
          - entities.PreventionPlan.fields.submitted_by_employee_id
          - entities.PreventionPlan.fields.compliance_posture
          - endpoints[POST /prevention-plans/{plan_id}/return-for-revision]
          - endpoints[POST /prevention-plans/{plan_id}/submit]
          - validations[priority=26]
        distinguishing_aspect: |
          return-for-revision is the only transition whose side effect is a field clear rather than a
          field write: submitted_by_employee_id goes back to null, which resets the segregation-of-duties
          state so that the original submitter could later activate a plan re-submitted by someone else.
