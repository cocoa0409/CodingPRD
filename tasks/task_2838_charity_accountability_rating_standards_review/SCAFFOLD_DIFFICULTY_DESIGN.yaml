              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
          assert:
            - "GET /rating-cycles/${c1}/score-breakdown returns fundraising_efficiency == 0.1867"
            - "fundraising_efficiency is NOT 0.1824, the value produced by pooling all three years' contributions and fundraising expense before dividing"
            - "GET /rating-cycles/${c1}/score-breakdown returns program_expense_ratio == 0.7500 and months_of_reserve == 7.20"
            - "The FINANCIAL_HEALTH DimensionScore of ${c1} has raw_points == 29 (15 ratio + 9 efficiency + 5 reserve) and max_points == 40"
            - "The FINANCIAL_HEALTH DimensionScore of ${c1} has normalized_score == 72.50 and data_completeness_pct == 100.00"

      - name: composite_penalty_rate_keyed_on_pre_penalty_band
        grounds:
          - calculations.composite_score_with_penalty
          - calculations.standards_evaluation
          - entities.RatingCycle.fields.failed_standard_count
          - entities.RatingCycle.fields.standards_penalty_points
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/dimension-overrides
        distinguishing_aspect: |
          Mode (c): a conditional branch table keyed on an INTERMEDIATE result.
          The per-failed-standard penalty rate is looked up from the PRE-penalty
          band, so the identical single failed standard costs 1.50 points on a
          band-B cycle and only 1.00 on the same cycle once an override drops it
          into band C. A flat rate, or a rate keyed on the post-penalty score,
          gives the wrong composite in one of the two halves.
        test_recipe:
          setup:
            - "Methodology M1 adopted and effective, logical clock at 2026-09-01T00:00:00Z"
            - "A fully documented FY2025 cycle whose GovernanceProfile has exactly one NOT_MET standard (CEO_COMP_REVIEW), so failed_standard_count == 1 throughout"
            - "The cycle has been scored once, landing in band B"
