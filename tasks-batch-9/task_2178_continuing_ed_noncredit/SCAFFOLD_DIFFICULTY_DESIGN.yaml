  - rule_id: boundary_precision_check
    instances:

      - name: fee_tier_breakpoint_is_inclusive_at_exactly_25000
        grounds:
          - calculations.registration_price_resolution
          - entities.Registration.fields.processing_fee_cents
          - endpoints.POST /offerings/{id}/registrations
        distinguishing_aspect: |
          Boundary on the MONETARY fee-tier breakpoint, reached through POST
          /offerings/{id}/registrations. FEE_TIER_BREAKPOINTS_CENTS is compared with
          >= , so a subtotal of exactly 25000 selects the 4% tier (fee 1000, total
          26000) while 24999 falls back to the 6% tier (fee 1500, total 26499). One
          cent of subtotal moves the fee by 500 cents.
        test_recipe:
          setup:
            - "Two overlapping TERM offerings on EXT-050 (ceu_units 0.5): one with tuition_cents 25000, one with tuition_cents 24999; both OPEN, min_enrollment 1, max_enrollment 10."
            - "Each offering is staffed by a different SENIOR instructor because their teaching windows intersect."
            - "One NEW learner (loyalty_discount_cents 0, so subtotal equals tuition) with combined CEU load 1.0, well under MAX_CONCURRENT_CEU."
