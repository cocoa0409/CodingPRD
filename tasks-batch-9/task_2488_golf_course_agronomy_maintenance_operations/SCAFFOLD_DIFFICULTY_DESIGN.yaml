      - name: maintenance_window_defer_reschedule_cycle_caps_at_two
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_DEFERRED
          - state_machines.MaintenanceWindow.DEFERRED_to_SCHEDULED
          - entities.MaintenanceWindow.fields.deferral_count
          - validations[priority=46]
          - calculations.course_play_posture
        distinguishing_aspect: |
          MaintenanceWindow is the cyclic case, a different entity from the
          Application parallel-dimension instance: SCHEDULED -> DEFERRED ->
          SCHEDULED is a genuine loop back to an already-visited state, and the
          loop is bounded by a monotone counter rather than by the state graph,
          so the third pass through the same edge is refused even though the
          window's status is the same DEFERRED it was on the second pass.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One course, one green, one SCHEDULED MOWING window on 2026-08-01 from 05:00Z to 06:00Z with a crew of 4 and no required unit type."
