            - { call: "GET /festival/travel-packages", payload: { submission_id: "${filmB}" }, as: TRAVEL_COORDINATOR, captures: { pkgB: "$.data[0].id" } }
            - { call: "POST /festival/travel-packages/${pkgA}/submit", payload: { delegate_count: 1, origin_country_code: "US", hotel_nights_requested: 6 }, as: FILMMAKER, as_user_id: "${submA}" }
            - { call: "POST /festival/travel-packages/${pkgB}/submit", payload: { delegate_count: 1, origin_country_code: "US", hotel_nights_requested: 5 }, as: FILMMAKER, as_user_id: "${submB}" }
