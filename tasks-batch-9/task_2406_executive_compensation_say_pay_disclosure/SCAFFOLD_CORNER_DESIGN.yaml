      - name: the_size_adjustment_factor_is_clamped_at_both_declared_bounds
        claim_type: constants_applied
        grounds:
          - calculations.benchmark_target_tdc
          - calculations.benchmark_target_tdc.constants
          - entities.PeerGroup.fields.benchmark_target_tdc_adjusted_usd
        distinguishing_aspect: |
          Both clamp constants bite in the same peer set: FOXT's raw ratio 10e9/4e9 = 2.5 is clamped DOWN to 2.0000
          and GOLF's 10e9/25e9 = 0.4 is clamped UP to 0.5000, so the adjusted candidates are 10,000,000.00 and
          15,000,000.00 and the nearest-rank pick is 10,000,000.00. Without the clamp the candidates would be
          12,500,000.00 and 12,000,000.00 and the answer would be 12,000,000.00.
        test_recipe:
          setup:
            - "ACME issuer (revenue 10,000,000,000)."
            - "DRAFT SIZE_ADJUSTED peer group with FOXT (rev 4e9, tdc 5,000,000) admitted as BUSINESS_MODEL_ANALOG and GOLF (rev 25e9, tdc 30,000,000) admitted as TALENT_COMPETITOR — both size-band waivers."
