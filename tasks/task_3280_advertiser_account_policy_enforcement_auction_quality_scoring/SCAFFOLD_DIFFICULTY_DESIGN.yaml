              as: PlatformAdmin
              captures: { win: $.data.winner_ad_id, chg: $.data.charged_cents }
            - call: "POST /auctions"
              payload: { query_text: "sandals", clicked: true }
              as: PlatformAdmin
              captures: { chg2: $.data.charged_cents }
          assert:
            - "win == ${ad_w} (146000 > 145000)"
            - "chg == 199 (floor(145000/730) = 198 then + 1; round-half-up-first would give 200)"
            - "chg2 == 5 (no runner-up: min(200, RESERVE_CPC_CENTS 5))"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ad_review_disapprove_edit_approve_cycle
        grounds:
          - state_machines.Ad
          - state_machines.PolicyReview
        distinguishing_aspect: |
          Cyclic machine on Ad: UNDER_REVIEW -> DISAPPROVED -> (edit) DRAFT ->
          UNDER_REVIEW -> ELIGIBLE completes a full review loop with review_round
          incrementing per cycle — not a one-way pipeline.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign. Ad A in ad group AG: category ALCOHOL with certification, submitted and flagged NEEDS_HUMAN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Cycle Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Cycle Corp LLC", registration_number: "RN-5", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CC", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
            - call: "POST /ad-groups/${ag}/ads"
              payload: { headline: "Wine Sale", final_url: "https://c.example/wine", category: "ALCOHOL", restricted_category_certified: true, quality_ectr_score: 5, quality_relevance_score: 5, quality_lp_score: 5 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad: $.data.id }
            - call: "POST /ads/${ad}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { rev1: $.data.id, out1: $.data.outcome }
          trigger:
            - call: "POST /policy-reviews/${rev1}/decide"
              payload: { outcome: "HUMAN_VIOLATION", reviewer_note: "implies discount abuse" }
              as: PolicyReviewer
            - call: "PUT /ads/${ad}"
              payload: { headline: "Fine Wine Selection" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { rev2: $.data.id, round2: $.data.round }
            - call: "POST /policy-reviews/${rev2}/decide"
              payload: { outcome: "HUMAN_APPROVED", reviewer_note: "compliant copy" }
              as: PolicyReviewer
            - call: "GET /ads/${ad}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { st: $.data.status, rr: $.data.review_round, snap: $.data.quality_score_snapshot_centi }
          assert:
            - "out1 == NEEDS_HUMAN (restricted category always escalates even when certified)"
            - "after HUMAN_VIOLATION the ad was DISAPPROVED; PUT moved it back to DRAFT"
            - "round2 == 2 (second submission is a new review round on the same ad)"
            - "st == ELIGIBLE after HUMAN_APPROVED (cycle completed)"
            - "snap == 500 (snapshot written at this approval: 50*5+30*5+20*5)"

      - name: account_suspend_appeal_overturn_resuspend_upheld_final_branch
        grounds:
          - state_machines.AdvertiserAccount
          - state_machines.Appeal
        distinguishing_aspect: |
          Branching fork-join on AdvertiserAccount (different entity than Ad):
          SUSPENDED -> APPEAL_PENDING forks to ACTIVE (OVERTURNED) or back to
          SUSPENDED (UPHELD), with a second UPHELD reaching SUSPENDED_FINAL —
          the join target depends on the decided branch and on upheld_appeal_count.
        test_recipe:
          setup:
