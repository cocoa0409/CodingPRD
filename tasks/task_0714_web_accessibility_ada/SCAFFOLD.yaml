scenario: "Web-Accessibility & ADA Compliance Service (accessiBe/audit style): site scan & WCAG audit, issue inventory & severity, remediation tasking & re-test, VPAT/conformance report, monitoring & subscription, legal-demand/lawsuit response, training, certification/badge"
domain_name: web-accessibility-ada
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys (Organization, Site, Scan, AuditFinding,
  # RemediationTask, RetestRun, VpatReport, LegalDemand, Subscription,
  # MonitoringCheck, TrainingEnrollment, Certification). No nesting in URL paths;
  # all relationships expressed via FK fields and filtered-list / sub-resource GETs.

  state_machine_shape: cyclic
  # AuditFinding remediation loops (OPEN -> IN_REMEDIATION -> RETEST_PENDING ->
  # (RESOLVED | REOPENED -> IN_REMEDIATION ...)); RemediationTask revision cycles;
  # plus parallel dimensions on Site (audit_posture is derived/compound while
  # Subscription.status evolves on an independent axis).

  relationship_patterns:
    - one_to_many        # Organization -> Sites; Scan -> AuditFindings; Site -> Scans
    - cross_aggregate    # LegalDemand references a Site across the audit aggregate
    - self_referential   # RemediationTask.supersedes_task_id references a prior RemediationTask

  role_model: peer_roles
  # AuditEngineer owns scans/findings/retests; RemediationVendor owns remediation
  # tasks; ComplianceManager owns VPAT/legal/certification; OrgAdmin owns the
  # organization/subscription/sites; PlatformAdmin is the operational superuser.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the customer organization.
      - name: contact_email
        type: string
        source: input
        description: Primary compliance contact email.
      - name: account_credit_cents
        type: integer
        source: computed
        description: >-
          Running account credit balance in cents, granted by VPAT certification
          remediation credits and debited by nothing in this scaffold. Starts at 0;
          recomputed as a side effect of VPAT issuance.
        default: 0
      - name: open_legal_demand_count
        type: integer
        source: computed
        description: >-
          Count of LegalDemand rows linked to this org's sites whose status IN
          {RECEIVED, RESPONDING, ESCALATED}. Recomputed on every LegalDemand transition.
        default: 0

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: FK -> Organization.id; the subscribing organization. One active subscription per organization.
      - name: tier
        type: enum
        source: input
        description: "Service tier. Constraints: tier IN {SCAN, MONITOR, MANAGED}."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status. Constraints: status IN {TRIAL, ACTIVE, PAST_DUE, SUSPENDED, CANCELLED}."
        default: TRIAL
      - name: monthly_invoice_cents
        type: integer
        source: computed
        description: >-
          Most recently computed monthly invoice total in cents, summed across the
          org's sites per the subscription_invoice calculation. Recomputed on
          activation and on each site add/remove. 0 until first computed.
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: FK -> Organization.id; the owning organization.
      - name: url
        type: string
        source: input
        description: "Root URL of the site under audit. Constraints: unique per organization_id."
      - name: audited_page_count
        type: integer
        source: input
        description: "Number of pages in scope for auditing. Constraints: integer >= 1."
      - name: audit_posture
        type: enum
        source: computed
        description: >-
          Derived compound posture gating remediation operations. Constraints:
          audit_posture IN {UNSCANNED, CLEAN, AT_RISK, BLOCKED}. UNSCANNED until a
          scan completes; CLEAN when no OPEN/IN_REMEDIATION/RETEST_PENDING findings
          remain and no active legal demand; AT_RISK when open findings exist but no
          active legal demand; BLOCKED when an active LegalDemand (status IN
          {RECEIVED, RESPONDING, ESCALATED}) is linked. Recomputed on every finding
          transition and every legal-demand transition.
        default: UNSCANNED
      - name: risk_exposure_score
        type: number
        source: computed
        description: >-
          Current risk exposure score (0-100) per the risk_exposure calculation,
          CURRENT variant. Recomputed on every finding transition and legal-demand
          transition. 0.0 until first scan completes.
        default: 0.0

  - name: Scan
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the site this scan targets.
      - name: wcag_target_level
        type: enum
        source: input
        description: "Target WCAG conformance level. Constraints: wcag_target_level IN {A, AA, AAA}."
      - name: status
        type: enum
        source: system
        description: "Constraints: status IN {QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED}."
        default: QUEUED
      - name: started_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the scan moved QUEUED -> RUNNING; null until started.
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the scan moved RUNNING -> COMPLETED; null otherwise.
      - name: provisional_conformance_score
        type: number
        source: computed
        description: >-
          Conformance score (0-100), PROVISIONAL variant, frozen at scan completion
          over the findings emitted by this scan. null until COMPLETED.
      - name: finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows emitted by this scan. Set at completion.
        default: 0

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - name: scan_id
        type: string
        source: input
        description: FK -> Scan.id; the scan that emitted this finding.
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; denormalized owning site (copied from the scan at emission).
      - name: wcag_criterion
        type: string
        source: input
        description: "WCAG success criterion reference, e.g. '1.4.3'."
      - name: severity
        type: enum
        source: input
        description: "Constraints: severity IN {CRITICAL, SERIOUS, MODERATE, MINOR}."
      - name: status
        type: enum
        source: system
        description: >-
          Remediation lifecycle. Constraints: status IN {OPEN, IN_REMEDIATION,
          RETEST_PENDING, RESOLVED, REOPENED, WONT_FIX_ACCEPTED}.
        default: OPEN
      - name: sla_due_at
        type: datetime
        source: computed
        description: >-
          Deadline by which the finding must be resolved, = scan.completed_at +
          SLA hours for its severity (see remediation_sla calculation). Frozen at emission.
      - name: is_overdue
        type: boolean
        source: computed
        description: >-
          True when logical clock now > sla_due_at AND status NOT IN {RESOLVED,
          WONT_FIX_ACCEPTED} (strict greater-than). Recomputed on read and on transition.
        default: false

  - name: RemediationTask
    parent: null
    common_fields: true
    fields:
      - name: finding_id
        type: string
        source: input
        description: FK -> AuditFinding.id; the finding this task remediates.
      - name: assigned_vendor_id
        type: string
        source: input
        description: "Opaque RemediationVendor operator id assigned to the task."
      - name: supersedes_task_id
        type: string
        source: input
        description: >-
          FK -> RemediationTask.id; when a finding is REOPENED a new task supersedes the
          prior one. null for the first task on a finding.
      - name: status
        type: enum
        source: system
        description: "Constraints: status IN {ASSIGNED, IN_PROGRESS, SUBMITTED, ACCEPTED, REJECTED, SUPERSEDED}."
        default: ASSIGNED
      - name: estimated_effort_hours
        type: number
        source: input
        description: "Vendor effort estimate in hours. Constraints: number > 0."

  - name: RetestRun
    parent: null
    common_fields: false
    fields:
      - name: finding_id
        type: string
        source: input
        description: FK -> AuditFinding.id; the finding being re-tested.
      - name: remediation_task_id
        type: string
        source: input
        description: FK -> RemediationTask.id; the submitted task triggering this re-test.
      - name: outcome
        type: enum
        source: input
        description: "Constraints: outcome IN {PASS, FAIL}."
      - name: tested_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the re-test was recorded.

  - name: VpatReport
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the site this conformance report covers.
      - name: source_scan_id
        type: string
        source: input
        description: FK -> Scan.id; the COMPLETED scan whose findings the report certifies (version-pinned).
      - name: pinned_scan_version
        type: integer
        source: system
        description: Snapshot of source scan's version at issuance, for stale-reference detection.
      - name: status
        type: enum
        source: system
        description: "Constraints: status IN {DRAFT, ISSUED, REVOKED}."
        default: DRAFT
      - name: certified_conformance_score
        type: number
        source: computed
        description: Conformance score (0-100), CERTIFIED variant, frozen at ISSUED. null until ISSUED.
      - name: conformance_level
        type: enum
        source: computed
        description: >-
          Label derived from certified_conformance_score tier. Constraints:
          conformance_level IN {WCAG_AA_FULL, WCAG_AA_PARTIAL, WCAG_A, NON_CONFORMANT}.
          null until ISSUED.

  - name: LegalDemand
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the site named in the demand letter / lawsuit.
      - name: claimant_name
        type: string
        source: input
        description: Name of the demanding party / plaintiff.
      - name: status
        type: enum
        source: system
        description: "Constraints: status IN {RECEIVED, RESPONDING, ESCALATED, RESOLVED, DISMISSED}."
        default: RECEIVED
      - name: response_due_at
        type: datetime
        source: input
        description: Statutory deadline for the org's response.

  - name: MonitoringCheck
    parent: null
    common_fields: false
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the monitored site.
      - name: regressions_found
        type: integer
        source: input
        description: "Number of new accessibility regressions detected this check. Constraints: integer >= 0."
      - name: checked_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the monitoring sweep.

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: FK -> Organization.id; the enrolling organization.
      - name: learner_email
        type: string
        source: input
        description: Email of the enrolled learner.
      - name: status
        type: enum
        source: system
        description: "Constraints: status IN {ENROLLED, IN_PROGRESS, COMPLETED, EXPIRED}."
        default: ENROLLED
      - name: score_pct
        type: number
        source: input
        description: "Final assessment score percentage. Constraints: number 0-100; required only on completion."

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the certified site.
      - name: vpat_report_id
        type: string
        source: input
        description: FK -> VpatReport.id; the ISSUED report backing this certification.
      - name: status
        type: enum
        source: system
        description: "Constraints: status IN {GRANTED, REVOKED, EXPIRED}."
        default: GRANTED
      - name: badge_token
        type: string
        source: system
        description: Server-minted opaque badge token embedded on the certified site.
      - name: expires_at
        type: datetime
        source: computed
        description: Logical-clock granting time + 365 days; certification lapses after this.

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Scan
    initial_state: QUEUED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /scans/{id}/start"
        actor: AuditEngineer
        preconditions:
          - "scan.status == QUEUED"
          - "the parent Site's owning Subscription.status IN {TRIAL, ACTIVE}"
        side_effects:
          - "sets started_at = logical clock now"
          - "increments Scan.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /scans/{id}/complete"
        actor: AuditEngineer
        preconditions:
          - "scan.status == RUNNING"
          - "the findings[] payload has >= 1 entry"
        side_effects:
          - "sets completed_at = logical clock now"
          - "emits one AuditFinding per findings[] entry, each OPEN, with site_id copied from scan.site_id"
          - "sets each emitted AuditFinding.sla_due_at = completed_at + remediation_sla hours for its severity"
          - "computes and freezes provisional_conformance_score (PROVISIONAL variant) over the emitted findings"
          - "sets finding_count"
          - "CASCADE: Site.audit_posture recomputed (UNSCANNED -> AT_RISK or CLEAN)"
          - "CASCADE: Site.risk_exposure_score recomputed (CURRENT variant)"
          - "increments Scan.version by 1"
        note: >-
          Depth-3 cascade A: complete scan -> emits findings -> Site.audit_posture
          recomputed from those findings -> Site.risk_exposure_score recomputed from
          those findings.
      - from: RUNNING
        to: FAILED
        trigger: "POST /scans/{id}/fail"
        actor: AuditEngineer
        preconditions:
          - "scan.status == RUNNING"
        side_effects:
          - "increments Scan.version by 1"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /scans/{id}/cancel"
        actor: AuditEngineer
        preconditions:
          - "scan.status == QUEUED"
        side_effects:
          - "increments Scan.version by 1"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [RESOLVED, WONT_FIX_ACCEPTED]
    transitions:
      - from: OPEN
        to: IN_REMEDIATION
        trigger: "POST /remediation-tasks (creates first task on the finding)"
        actor: RemediationVendor
        preconditions:
          - "finding.status == OPEN"
          - "the parent Site.audit_posture != BLOCKED"
        side_effects:
          - "creates a RemediationTask in ASSIGNED on this finding"
          - "increments AuditFinding.version by 1"
        note: >-
          Cross-entity dependency: a finding may only enter remediation when its
          Site is not BLOCKED by an active LegalDemand.
      - from: IN_REMEDIATION
        to: RETEST_PENDING
        trigger: "POST /remediation-tasks/{id}/submit"
        actor: RemediationVendor
        preconditions:
          - "the linked RemediationTask.status == IN_PROGRESS"
          - "finding.status == IN_REMEDIATION"
        side_effects:
          - "RemediationTask moves IN_PROGRESS -> SUBMITTED"
          - "increments AuditFinding.version by 1"
      - from: RETEST_PENDING
        to: RESOLVED
        trigger: "POST /retest-runs (outcome=PASS)"
        actor: AuditEngineer
        preconditions:
          - "finding.status == RETEST_PENDING"
          - "the referenced RemediationTask.status == SUBMITTED"
          - "retest outcome == PASS"
        side_effects:
          - "RemediationTask moves SUBMITTED -> ACCEPTED"
          - "CASCADE: Site.audit_posture recomputed; if this was the last open finding and no active legal demand, Site.audit_posture -> CLEAN"
          - "CASCADE: Site.risk_exposure_score recomputed (CURRENT variant)"
          - "increments AuditFinding.version by 1"
        note: "Compensating pair with REOPENED; conformance weight conserved (see compensating_invariant)."
      - from: RETEST_PENDING
        to: REOPENED
        trigger: "POST /retest-runs (outcome=FAIL)"
        actor: AuditEngineer
        preconditions:
          - "finding.status == RETEST_PENDING"
          - "the referenced RemediationTask.status == SUBMITTED"
          - "retest outcome == FAIL"
        side_effects:
          - "RemediationTask moves SUBMITTED -> REJECTED"
          - "increments AuditFinding.version by 1"
        note: "Cyclic: REOPENED returns to IN_REMEDIATION on the next task creation."
      - from: REOPENED
        to: IN_REMEDIATION
        trigger: "POST /remediation-tasks (supersedes the rejected task)"
        actor: RemediationVendor
        preconditions:
          - "finding.status == REOPENED"
          - "the supersedes_task_id RemediationTask.status == REJECTED"
          - "the parent Site.audit_posture != BLOCKED"
        side_effects:
          - "creates a new RemediationTask in ASSIGNED with supersedes_task_id set"
          - "the superseded RemediationTask moves REJECTED -> SUPERSEDED"
          - "increments AuditFinding.version by 1"
        note: "Closes the revision cycle OPEN/REOPENED -> IN_REMEDIATION -> RETEST_PENDING -> REOPENED."
      - from: OPEN
        to: WONT_FIX_ACCEPTED
        trigger: "POST /findings/{id}/accept-risk"
        actor: ComplianceManager
        preconditions:
          - "finding.status == OPEN"
          - "the parent Site.audit_posture != BLOCKED"
        side_effects:
          - "CASCADE: Site.audit_posture recomputed"
          - "CASCADE: Site.risk_exposure_score recomputed (CURRENT variant)"
          - "increments AuditFinding.version by 1"
        note: "Accepted-risk findings count as conformant for CERTIFIED scoring but not PROVISIONAL."

  - entity: RemediationTask
    initial_state: ASSIGNED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /remediation-tasks/{id}/begin"
        actor: RemediationVendor
        preconditions:
          - "task.status == ASSIGNED"
        side_effects:
          - "increments RemediationTask.version by 1"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /remediation-tasks/{id}/submit"
        actor: RemediationVendor
        preconditions:
          - "task.status == IN_PROGRESS"
          - "the linked AuditFinding.status == IN_REMEDIATION"
        side_effects:
          - "the linked AuditFinding moves IN_REMEDIATION -> RETEST_PENDING"
          - "increments RemediationTask.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /retest-runs (outcome=PASS) — system transition"
        actor: system
        preconditions:
          - "task.status == SUBMITTED"
        side_effects:
          - "increments RemediationTask.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retest-runs (outcome=FAIL) — system transition"
        actor: system
        preconditions:
          - "task.status == SUBMITTED"
        side_effects:
          - "increments RemediationTask.version by 1"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /remediation-tasks (new task supersedes this one) — system transition"
        actor: system
        preconditions:
          - "task.status == REJECTED"
        side_effects:
          - "increments RemediationTask.version by 1"

  - entity: VpatReport
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /vpat-reports/{id}/issue"
        actor: ComplianceManager
        preconditions:
          - "report.status == DRAFT"
          - "the source Scan.status == COMPLETED"
          - "report.pinned_scan_version == source Scan.version (stale-reference guard)"
          - "the source Site.audit_posture != BLOCKED"
        side_effects:
          - "computes and freezes certified_conformance_score (CERTIFIED variant)"
          - "derives conformance_level from the certified score tier"
          - "CASCADE: grants Organization.account_credit_cents += remediation_credit(conformance_level); recomputes Organization.account_credit_cents"
          - "increments VpatReport.version by 1"
        note: >-
          Depth-2 cascade B: issue VPAT -> compute certified score & level ->
          Organization.account_credit_cents recomputed via remediation_credit keyed
          on the just-derived level.
      - from: ISSUED
        to: REVOKED
        trigger: "POST /vpat-reports/{id}/revoke"
        actor: ComplianceManager
        preconditions:
          - "report.status == ISSUED"
        side_effects:
          - "CASCADE: any Certification whose vpat_report_id == this report and status == GRANTED moves GRANTED -> REVOKED"
          - "increments VpatReport.version by 1"
        note: "Cross-entity cascade into Certification."

  - entity: LegalDemand
    initial_state: RECEIVED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: RESPONDING
        trigger: "POST /legal-demands/{id}/respond"
        actor: ComplianceManager
        preconditions:
          - "demand.status == RECEIVED"
        side_effects:
          - "increments LegalDemand.version by 1"
      - from: RESPONDING
        to: ESCALATED
        trigger: "POST /legal-demands/{id}/escalate"
        actor: ComplianceManager
        preconditions:
          - "demand.status == RESPONDING"
        side_effects:
          - "increments LegalDemand.version by 1"
      - from: RESPONDING
        to: RESOLVED
        trigger: "POST /legal-demands/{id}/resolve"
        actor: ComplianceManager
        preconditions:
          - "demand.status IN {RESPONDING, ESCALATED}"
        side_effects:
          - "CASCADE: Site.open_legal_demand bookkeeping — Organization.open_legal_demand_count recomputed"
          - "CASCADE: Site.audit_posture recomputed (BLOCKED -> AT_RISK or CLEAN once no active demand remains)"
          - "CASCADE: Site.risk_exposure_score recomputed (CURRENT variant, legal_bump drops to 0)"
          - "increments LegalDemand.version by 1"
        note: >-
          Depth-3 cascade C: resolve demand -> Organization.open_legal_demand_count
          recomputed -> Site.audit_posture unblocks -> Site.risk_exposure_score
          recomputed (legal bump removed). Compensating pair with the RECEIVED entry
          side-effect that blocked the site.
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /legal-demands/{id}/resolve"
        actor: ComplianceManager
        preconditions:
          - "demand.status == ESCALATED"
        side_effects:
          - "CASCADE: Organization.open_legal_demand_count recomputed"
          - "CASCADE: Site.audit_posture recomputed"
          - "CASCADE: Site.risk_exposure_score recomputed"
          - "increments LegalDemand.version by 1"
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /legal-demands/{id}/dismiss"
        actor: ComplianceManager
        preconditions:
          - "demand.status == RECEIVED"
        side_effects:
          - "CASCADE: Organization.open_legal_demand_count recomputed"
          - "CASCADE: Site.audit_posture recomputed"
          - "CASCADE: Site.risk_exposure_score recomputed"
          - "increments LegalDemand.version by 1"
    note_initial: >-
      On CREATE (POST /legal-demands), the demand enters RECEIVED and immediately
      CASCADES: Organization.open_legal_demand_count recomputed -> Site.audit_posture
      -> BLOCKED -> Site.risk_exposure_score recomputed (legal_bump=25 added).

  - entity: Subscription
    initial_state: TRIAL
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: OrgAdmin
        preconditions:
          - "subscription.status == TRIAL"
        side_effects:
          - "computes and stores monthly_invoice_cents via subscription_invoice over the org's sites"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/mark-past-due"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == ACTIVE"
        side_effects:
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: OrgAdmin
        preconditions:
          - "subscription.status == PAST_DUE"
        side_effects:
          - "recomputes monthly_invoice_cents"
          - "increments Subscription.version by 1"
        note: "Cyclic: PAST_DUE can return to ACTIVE."
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "POST /subscriptions/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == PAST_DUE"
        side_effects:
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: OrgAdmin
        preconditions:
          - "subscription.status == SUSPENDED"
        side_effects:
          - "increments Subscription.version by 1"
      - from: TRIAL
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: OrgAdmin
        preconditions:
          - "subscription.status == TRIAL"
        side_effects:
          - "increments Subscription.version by 1"

  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ENROLLED
        to: IN_PROGRESS
        trigger: "POST /training-enrollments/{id}/start"
        actor: OrgAdmin
        preconditions:
          - "enrollment.status == ENROLLED"
        side_effects:
          - "increments TrainingEnrollment.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /training-enrollments/{id}/complete"
        actor: OrgAdmin
        preconditions:
          - "enrollment.status == IN_PROGRESS"
          - "score_pct >= 80 (pass threshold)"
        side_effects:
          - "stores score_pct"
          - "increments TrainingEnrollment.version by 1"
      - from: ENROLLED
        to: EXPIRED
        trigger: "POST /training-enrollments/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "enrollment.status == ENROLLED"
        side_effects:
          - "increments TrainingEnrollment.version by 1"

  - entity: Certification
    initial_state: GRANTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /certifications/{id}/revoke OR cascade from VpatReport revoke"
        actor: ComplianceManager
        preconditions:
          - "certification.status == GRANTED"
        side_effects:
          - "increments Certification.version by 1"
      - from: GRANTED
        to: EXPIRED
        trigger: "POST /certifications/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "certification.status == GRANTED"
          - "logical clock now > expires_at"
        side_effects:
          - "increments Certification.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: vpat-issue-stale-scan
    parent_entity: Scan
    write_endpoint: "POST /vpat-reports/{id}/issue"
    occ_field: "expected_scan_version"
    description: |
      Issuing a VpatReport whose pinned source Scan has advanced in version since
      the client last observed it is rejected. The certified score is frozen against
      the scan's findings; if another writer has mutated the scan (e.g. re-completed
      or appended findings) the client's view is stale and certification on a moved
      target is refused.
    error_id: ERR_STALE_SCAN_VERSION
    http_status: 412

  - rule_id: subscription-activate-stale
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/activate"
    occ_field: "expected_subscription_version"
    description: |
      Activating a Subscription whose version has advanced since the client last
      read it is rejected. The invoice is computed against the org's site roster at
      activation; if the subscription has since transitioned (e.g. another activate
      after a past-due cycle bumped the version) the client's view is stale.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: conformance_score
    trigger: "Scan RUNNING->COMPLETED freezes PROVISIONAL; VpatReport DRAFT->ISSUED freezes CERTIFIED"
    algorithm: weighted_scoring
    formula: |
      W = {CRITICAL:10, SERIOUS:5, MODERATE:2, MINOR:1}
      total_weight = sum(W[f.severity] for f in findings_of_scan)
      passed_weight = sum(W[f.severity] for f in findings_of_scan if f.status in REMEDIATED_SET)
      if total_weight == 0: score = 100.00
      else: score = round(100.0 * passed_weight / total_weight, 2)  # round_half_up, 2dp
    input_set: "All AuditFinding rows whose scan_id == scan.id (all severities, regardless of status; status filter applies only to the REMEDIATED_SET membership test)."
    constants:
      W_CRITICAL: 10
      W_SERIOUS: 5
      W_MODERATE: 2
      W_MINOR: 1
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Frozen at scan completion onto Scan.provisional_conformance_score"
        difference: "REMEDIATED_SET = {RESOLVED} only. WONT_FIX_ACCEPTED does NOT count as passed."
      - name: certified
        when: "Frozen at VPAT issuance onto VpatReport.certified_conformance_score"
        difference: "REMEDIATED_SET = {RESOLVED, WONT_FIX_ACCEPTED}. Accepted-risk findings count as conformant."

  - name: risk_exposure
    trigger: "Recomputed on every AuditFinding transition and every LegalDemand transition; stored on Site.risk_exposure_score (CURRENT)."
    algorithm: weighted_scoring
    formula: |
      # C, S, D computed over the site's findings per the variant's status filter:
      C = count(findings where status in OPEN_SET and severity == CRITICAL)
      S = count(findings where status in OPEN_SET and severity == SERIOUS)
      L = 1 if site has any LegalDemand with status in {RECEIVED,RESPONDING,ESCALATED} else 0
      D = max(0, max over (findings where status in OPEN_SET and is_overdue) of
              floor((clock_now - sla_due_at) / 86400 seconds)); 0 if none overdue
      base = min(100, 8*C + 3*S)
      overdue_factor = 1 + min(1.0, 0.02 * D)
      raw = base * overdue_factor + (25 if L==1 else 0)
      risk = min(100.0, round(raw, 2))   # round_half_up, 2dp
    input_set: "AuditFinding rows for the site; legal demands linked to the site."
    constants:
      CRIT_WEIGHT: 8
      SERIOUS_WEIGHT: 3
      OVERDUE_PER_DAY: 0.02
      OVERDUE_CAP: 1.0
      LEGAL_BUMP: 25
      SCORE_CAP: 100
    precision: "2 decimal places, round_half_up; D is whole days via floor"
    variants:
      - name: current
        when: "Stored on Site.risk_exposure_score on every recompute"
        difference: "OPEN_SET = {OPEN, IN_REMEDIATION, RETEST_PENDING, REOPENED}. Counts every non-terminal finding."
      - name: projected
        when: "Returned by GET /sites/{id}/risk-projection (what-if), not persisted"
        difference: >-
          OPEN_SET excludes findings that currently have a RemediationTask in
          {IN_PROGRESS, SUBMITTED} (assumed to close), so C and S drop and D is taken
          only over the remaining overdue findings. Diverges from CURRENT for the same
          site data.

  - name: subscription_invoice
    trigger: "Subscription TRIAL->ACTIVE and PAST_DUE->ACTIVE; stored on Subscription.monthly_invoice_cents"
    algorithm: tiered_pricing
    formula: |
      TIER_FEE = {SCAN:9900, MONITOR:24900, MANAGED:49900}   # cents
      PER_PAGE = {SCAN:0, MONITOR:5, MANAGED:12}              # cents per audited page
      n = count of Site rows where Site.organization_id == subscription.organization_id
      def discount(n): return 0.15 if n>=10 else (0.10 if n>=5 else 0.0)
      # PINNED EVALUATION ORDER (round-per-site, THEN sum):
      per_site_fee_cents(site) =
          round_half_up( (TIER_FEE[tier] + PER_PAGE[tier]*site.audited_page_count)
                         * (1 - discount(n)) )   # rounded to whole cents PER SITE
      monthly_invoice_cents = sum over sites of per_site_fee_cents(site)
    input_set: "All Site rows of the subscription's organization; tier from the subscription."
    constants:
      TIER_FEE_SCAN: 9900
      TIER_FEE_MONITOR: 24900
      TIER_FEE_MANAGED: 49900
      PER_PAGE_SCAN: 0
      PER_PAGE_MONITOR: 5
      PER_PAGE_MANAGED: 12
      DISCOUNT_5: 0.10
      DISCOUNT_10: 0.15
    precision: "Whole cents; round_half_up applied PER SITE before summing (round-per-line then sum)."

  - name: remediation_sla
    trigger: "AuditFinding emission at scan completion; sets sla_due_at"
    algorithm: threshold
    formula: |
      SLA_HOURS = {CRITICAL:72, SERIOUS:168, MODERATE:720, MINOR:2160}
      sla_due_at = scan.completed_at + SLA_HOURS[severity] hours
      is_overdue = (clock_now > sla_due_at) and (status not in {RESOLVED, WONT_FIX_ACCEPTED})
      # boundary: at clock_now == sla_due_at, is_overdue == False (strict >)
    input_set: "Single finding; its severity and the parent scan's completed_at."
    constants:
      SLA_HOURS_CRITICAL: 72
      SLA_HOURS_SERIOUS: 168
      SLA_HOURS_MODERATE: 720
      SLA_HOURS_MINOR: 2160
    precision: "Whole-hour offsets; comparison is strict greater-than on the logical clock."

  - name: remediation_credit
    trigger: "VpatReport DRAFT->ISSUED, after certified_conformance_score and conformance_level are derived"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER PINNED (resolves the circular-looking dependency):
      #   step 1: certified_conformance_score = conformance_score(CERTIFIED)
      #   step 2: conformance_level = tier(certified_conformance_score)
      #   step 3: credit_cents = CREDIT[conformance_level]
      # The credit does NOT feed back into the score; order is 1->2->3.
      def tier(s):
        if s >= 95: return WCAG_AA_FULL
        if s >= 80: return WCAG_AA_PARTIAL
        if s >= 50: return WCAG_A
        return NON_CONFORMANT
      CREDIT = {WCAG_AA_FULL:0, WCAG_AA_PARTIAL:2500, WCAG_A:5000, NON_CONFORMANT:10000}  # cents
      Organization.account_credit_cents += CREDIT[conformance_level]
    input_set: "The certified score of the report; the org owning the report's site."
    constants:
      TIER_FULL_MIN: 95
      TIER_PARTIAL_MIN: 80
      TIER_A_MIN: 50
      CREDIT_AA_FULL: 0
      CREDIT_AA_PARTIAL: 2500
      CREDIT_A: 5000
      CREDIT_NON_CONFORMANT: 10000
    precision: "Whole cents; tier boundaries are inclusive >= (95, 80, 50)."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET /_clock/now"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Body FK targets exist and are mutually consistent (e.g. RemediationTask.finding_id resolves; RetestRun.remediation_task_id.finding_id == RetestRun.finding_id)"
    error_id: ERR_FK_MISMATCH
    http_status: 409
    applies_to: "POST /remediation-tasks, POST /retest-runs, POST /vpat-reports, POST /certifications"
  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "VPAT issue: pinned_scan_version still equals the live source Scan.version (OCC stale-reference)"
    error_id: ERR_STALE_SCAN_VERSION
    http_status: 412
    applies_to: "POST /vpat-reports/{id}/issue"
  - priority: 7
    category: state
    check: "Subscription activate: expected_subscription_version equals the live Subscription.version (OCC)"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/activate"
  - priority: 8
    category: business_safety
    check: "A finding's parent Site must not be BLOCKED by an active LegalDemand when entering/continuing remediation or accepting risk"
    error_id: ERR_SITE_BLOCKED_BY_LEGAL
    http_status: 409
    applies_to: "POST /remediation-tasks, POST /findings/{id}/accept-risk, POST /vpat-reports/{id}/issue"
  - priority: 9
    category: business_referential
    check: "VPAT create requires the source Scan.status == COMPLETED"
    error_id: ERR_SCAN_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /vpat-reports"
  - priority: 10
    category: business_referential
    check: "Certification requires its VpatReport.status == ISSUED"
    error_id: ERR_VPAT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /certifications"
  - priority: 11
    category: business_constraint
    check: "Scan start requires the parent Site's Subscription.status IN {TRIAL, ACTIVE}"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /scans/{id}/start"
  - priority: 12
    category: business_constraint
    check: "Scan complete requires the findings[] payload to be non-empty"
    error_id: ERR_EMPTY_FINDINGS
    http_status: 422
    applies_to: "POST /scans/{id}/complete"
  - priority: 13
    category: business_constraint
    check: "Training completion requires score_pct >= 80"
    error_id: ERR_SCORE_BELOW_PASS
    http_status: 422
    applies_to: "POST /training-enrollments/{id}/complete"
  - priority: 14
    category: business_constraint
    check: "Site.url must be unique within its organization_id"
    error_id: ERR_DUPLICATE_SITE_URL
    http_status: 409
    applies_to: "POST /sites"
  - priority: 15
    category: business_constraint
    check: "An organization may hold at most one Subscription"
    error_id: ERR_SUBSCRIPTION_EXISTS
    http_status: 409
    applies_to: "POST /subscriptions"
  - priority: 16
    category: business_temporal
    check: "Certification expire requires logical clock now > expires_at"
    error_id: ERR_NOT_YET_EXPIRED
    http_status: 409
    applies_to: "POST /certifications/{id}/expire"
  - priority: 16.5
    category: state
    check: "On remediation-task create with supersedes_task_id set, the referenced task's status == REJECTED"
    error_id: ERR_SUPERSEDE_TARGET_NOT_REJECTED
    http_status: 409
    applies_to: "POST /remediation-tasks"
  - priority: 16.7
    category: business_constraint
    check: "to_iso8601 and response_due_at parse as valid ISO 8601 UTC instants"
    error_id: ERR_INVALID_DATETIME
    http_status: 422
    applies_to: "POST /_clock/set_current_utc, POST /legal-demands"
  - priority: 17
    category: business_constraint
    check: "Enum/type/range conformance of body fields (bad enum, page_count < 1, effort_hours <= 0, score_pct out of 0-100, regressions_found < 0)"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: all
  - priority: 18
    category: business_constraint
    check: "Required body fields present"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: all
  - priority: 19
    category: business_constraint
    check: "Pagination params within bounds (limit 1-100, offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Organizations ----
  - method: POST
    path: "/compliance/organizations"
    description: "Create an organization."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, contact_email]
    output: Organization
    side_effects: []
  - method: GET
    path: "/compliance/organizations/{id}"
    description: "Fetch an organization (includes computed account_credit_cents, open_legal_demand_count)."
    roles: [PlatformAdmin, OrgAdmin, ComplianceManager]
    code: 200
    input: []
    output: Organization
    side_effects: []
  - method: GET
    path: "/compliance/organizations"
    description: "List organizations."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Organization[]
    side_effects: []

  # ---- Subscriptions ----
  - method: POST
    path: "/compliance/subscriptions"
    description: "Create a TRIAL subscription for an organization (at most one per org)."
    roles: [OrgAdmin, PlatformAdmin]
    code: 201
    input: [organization_id, tier]
    output: Subscription
    side_effects: ["validates one-per-org uniqueness"]
  - method: GET
    path: "/compliance/subscriptions/{id}"
    description: "Fetch a subscription."
    roles: [OrgAdmin, PlatformAdmin, ComplianceManager]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/compliance/subscriptions"
    description: "List subscriptions, optionally filtered by organization_id."
    roles: [OrgAdmin, PlatformAdmin]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/compliance/subscriptions/{id}/activate"
    description: "Activate (TRIAL->ACTIVE or PAST_DUE->ACTIVE); OCC-guarded; computes monthly_invoice_cents."
    roles: [OrgAdmin]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["computes subscription_invoice", "increments Subscription.version by 1"]
  - method: POST
    path: "/compliance/subscriptions/{id}/mark-past-due"
    description: "ACTIVE->PAST_DUE."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]
  - method: POST
    path: "/compliance/subscriptions/{id}/suspend"
    description: "PAST_DUE->SUSPENDED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]
  - method: POST
    path: "/compliance/subscriptions/{id}/cancel"
    description: "TRIAL/SUSPENDED -> CANCELLED."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]

  # ---- Sites ----
  - method: POST
    path: "/compliance/sites"
    description: "Register a site under an organization (url unique per org)."
    roles: [OrgAdmin, PlatformAdmin]
    code: 201
    input: [organization_id, url, audited_page_count]
    output: Site
    side_effects: []
  - method: GET
    path: "/compliance/sites/{id}"
    description: "Fetch a site (includes computed audit_posture, risk_exposure_score)."
    roles: [OrgAdmin, PlatformAdmin, ComplianceManager, AuditEngineer]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/compliance/sites"
    description: "List sites, optionally filtered by organization_id."
    roles: [OrgAdmin, PlatformAdmin, ComplianceManager, AuditEngineer]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/compliance/sites/{id}/risk-projection"
    description: "Computed read: PROJECTED risk_exposure variant (what-if if in-flight remediations close). Not persisted."
    roles: [ComplianceManager, AuditEngineer, OrgAdmin]
    code: 200
    input: []
    output: "{ projected_risk_exposure_score: number, current_risk_exposure_score: number }"
    side_effects: []

  # ---- Scans ----
  - method: POST
    path: "/compliance/scans"
    description: "Queue a scan for a site."
    roles: [AuditEngineer]
    code: 201
    input: [site_id, wcag_target_level]
    output: Scan
    side_effects: []
  - method: GET
    path: "/compliance/scans/{id}"
    description: "Fetch a scan."
    roles: [AuditEngineer, ComplianceManager, OrgAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Scan
    side_effects: []
  - method: GET
    path: "/compliance/scans"
    description: "List scans, optionally filtered by site_id."
    roles: [AuditEngineer, ComplianceManager, OrgAdmin, PlatformAdmin]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: Scan[]
    side_effects: []
  - method: POST
    path: "/compliance/scans/{id}/start"
    description: "QUEUED->RUNNING (requires active subscription)."
    roles: [AuditEngineer]
    code: 200
    input: []
    output: Scan
    side_effects: ["sets started_at", "increments Scan.version by 1"]
  - method: POST
    path: "/compliance/scans/{id}/complete"
    description: "RUNNING->COMPLETED; emits findings; freezes provisional score; cascades to Site."
    roles: [AuditEngineer]
    code: 200
    input: [findings]
    output: Scan
    side_effects:
      - "emits AuditFinding per findings[] entry"
      - "computes provisional_conformance_score"
      - "computes remediation_sla per finding"
      - "cascades Site.audit_posture and Site.risk_exposure_score"
      - "increments Scan.version by 1"
  - method: POST
    path: "/compliance/scans/{id}/fail"
    description: "RUNNING->FAILED."
    roles: [AuditEngineer]
    code: 200
    input: []
    output: Scan
    side_effects: ["increments Scan.version by 1"]
  - method: POST
    path: "/compliance/scans/{id}/cancel"
    description: "QUEUED->CANCELLED."
    roles: [AuditEngineer]
    code: 200
    input: []
    output: Scan
    side_effects: ["increments Scan.version by 1"]

  # ---- Findings ----
  - method: GET
    path: "/compliance/findings/{id}"
    description: "Fetch a finding (includes computed is_overdue, sla_due_at)."
    roles: [AuditEngineer, RemediationVendor, ComplianceManager, OrgAdmin, PlatformAdmin]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: GET
    path: "/compliance/findings"
    description: "List findings, filterable by scan_id and/or site_id."
    roles: [AuditEngineer, RemediationVendor, ComplianceManager, OrgAdmin, PlatformAdmin]
    code: 200
    input: ["scan_id?", "site_id?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: POST
    path: "/compliance/findings/{id}/accept-risk"
    description: "OPEN->WONT_FIX_ACCEPTED (accepted risk); cascades posture/risk."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["cascades Site.audit_posture and risk_exposure_score", "increments AuditFinding.version by 1"]

  # ---- Remediation tasks ----
  - method: POST
    path: "/compliance/remediation-tasks"
    description: "Create a remediation task on a finding (OPEN->IN_REMEDIATION, or REOPENED->IN_REMEDIATION when supersedes_task_id set)."
    roles: [RemediationVendor]
    code: 201
    input: [finding_id, assigned_vendor_id, estimated_effort_hours, "supersedes_task_id?"]
    output: RemediationTask
    side_effects:
      - "transitions finding OPEN->IN_REMEDIATION or REOPENED->IN_REMEDIATION"
      - "supersedes prior task when supersedes_task_id set (REJECTED->SUPERSEDED)"
      - "increments AuditFinding.version by 1"
  - method: GET
    path: "/compliance/remediation-tasks/{id}"
    description: "Fetch a remediation task."
    roles: [RemediationVendor, AuditEngineer, ComplianceManager, PlatformAdmin]
    code: 200
    input: []
    output: RemediationTask
    side_effects: []
  - method: GET
    path: "/compliance/remediation-tasks"
    description: "List remediation tasks, filterable by finding_id and/or supersedes_task_id."
    roles: [RemediationVendor, AuditEngineer, ComplianceManager, PlatformAdmin]
    code: 200
    input: ["finding_id?", "supersedes_task_id?", "limit?", "offset?"]
    output: RemediationTask[]
    side_effects: []
  - method: POST
    path: "/compliance/remediation-tasks/{id}/begin"
    description: "ASSIGNED->IN_PROGRESS."
    roles: [RemediationVendor]
    code: 200
    input: []
    output: RemediationTask
    side_effects: ["increments RemediationTask.version by 1"]
  - method: POST
    path: "/compliance/remediation-tasks/{id}/submit"
    description: "IN_PROGRESS->SUBMITTED; cascades finding IN_REMEDIATION->RETEST_PENDING."
    roles: [RemediationVendor]
    code: 200
    input: []
    output: RemediationTask
    side_effects: ["cascades finding to RETEST_PENDING", "increments RemediationTask.version by 1", "increments AuditFinding.version by 1"]

  # ---- Retest runs ----
  - method: POST
    path: "/compliance/retest-runs"
    description: "Record a re-test (PASS->finding RESOLVED & task ACCEPTED; FAIL->finding REOPENED & task REJECTED). Cascades site posture/risk on PASS."
    roles: [AuditEngineer]
    code: 201
    input: [finding_id, remediation_task_id, outcome]
    output: RetestRun
    side_effects:
      - "finding RETEST_PENDING->RESOLVED|REOPENED; task SUBMITTED->ACCEPTED|REJECTED"
      - "on PASS cascades Site.audit_posture and risk_exposure_score"
      - "increments AuditFinding.version and RemediationTask.version by 1"
  - method: GET
    path: "/compliance/retest-runs/{id}"
    description: "Fetch a single re-test run."
    roles: [AuditEngineer, ComplianceManager, RemediationVendor, PlatformAdmin]
    code: 200
    input: []
    output: RetestRun
    side_effects: []
  - method: GET
    path: "/compliance/retest-runs"
    description: "List re-test runs, filterable by finding_id and/or remediation_task_id."
    roles: [AuditEngineer, ComplianceManager, RemediationVendor, PlatformAdmin]
    code: 200
    input: ["finding_id?", "remediation_task_id?", "limit?", "offset?"]
    output: RetestRun[]
    side_effects: []

  # ---- VPAT reports ----
  - method: POST
    path: "/compliance/vpat-reports"
    description: "Create a DRAFT VPAT report pinned to a COMPLETED scan (snapshots pinned_scan_version)."
    roles: [ComplianceManager]
    code: 201
    input: [site_id, source_scan_id]
    output: VpatReport
    side_effects: ["snapshots pinned_scan_version from source scan"]
  - method: GET
    path: "/compliance/vpat-reports/{id}"
    description: "Fetch a VPAT report."
    roles: [ComplianceManager, OrgAdmin, PlatformAdmin, AuditEngineer]
    code: 200
    input: []
    output: VpatReport
    side_effects: []
  - method: GET
    path: "/compliance/vpat-reports"
    description: "List VPAT reports, filterable by site_id and/or source_scan_id."
    roles: [ComplianceManager, OrgAdmin, PlatformAdmin, AuditEngineer]
    code: 200
    input: ["site_id?", "source_scan_id?", "limit?", "offset?"]
    output: VpatReport[]
    side_effects: []
  - method: POST
    path: "/compliance/vpat-reports/{id}/issue"
    description: "DRAFT->ISSUED; OCC-guarded on scan version; freezes certified score & level; grants org credit."
    roles: [ComplianceManager]
    code: 200
    input: [expected_scan_version]
    output: VpatReport
    side_effects:
      - "computes certified_conformance_score and conformance_level"
      - "grants Organization.account_credit_cents via remediation_credit"
      - "increments VpatReport.version by 1"
  - method: POST
    path: "/compliance/vpat-reports/{id}/revoke"
    description: "ISSUED->REVOKED; cascades GRANTED certifications to REVOKED."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: VpatReport
    side_effects: ["cascades Certification GRANTED->REVOKED", "increments VpatReport.version by 1"]

  # ---- Legal demands ----
  - method: POST
    path: "/compliance/legal-demands"
    description: "Record a legal demand against a site (enters RECEIVED; cascades site BLOCKED, risk legal_bump, org count)."
    roles: [ComplianceManager]
    code: 201
    input: [site_id, claimant_name, response_due_at]
    output: LegalDemand
    side_effects:
      - "Site.audit_posture -> BLOCKED"
      - "Organization.open_legal_demand_count recomputed"
      - "Site.risk_exposure_score recomputed (legal_bump=25)"
  - method: GET
    path: "/compliance/legal-demands/{id}"
    description: "Fetch a legal demand."
    roles: [ComplianceManager, OrgAdmin, PlatformAdmin]
    code: 200
    input: []
    output: LegalDemand
    side_effects: []
  - method: GET
    path: "/compliance/legal-demands"
    description: "List legal demands, filterable by site_id."
    roles: [ComplianceManager, OrgAdmin, PlatformAdmin]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: LegalDemand[]
    side_effects: []
  - method: POST
    path: "/compliance/legal-demands/{id}/respond"
    description: "RECEIVED->RESPONDING."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: LegalDemand
    side_effects: ["increments LegalDemand.version by 1"]
  - method: POST
    path: "/compliance/legal-demands/{id}/escalate"
    description: "RESPONDING->ESCALATED."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: LegalDemand
    side_effects: ["increments LegalDemand.version by 1"]
  - method: POST
    path: "/compliance/legal-demands/{id}/resolve"
    description: "RESPONDING/ESCALATED->RESOLVED; cascades site unblock, org count, risk."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: LegalDemand
    side_effects:
      - "Organization.open_legal_demand_count recomputed"
      - "Site.audit_posture recomputed (unblock)"
      - "Site.risk_exposure_score recomputed"
      - "increments LegalDemand.version by 1"
  - method: POST
    path: "/compliance/legal-demands/{id}/dismiss"
    description: "RECEIVED->DISMISSED; cascades site unblock, org count, risk."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: LegalDemand
    side_effects:
      - "Organization.open_legal_demand_count recomputed"
      - "Site.audit_posture recomputed (unblock)"
      - "Site.risk_exposure_score recomputed"
      - "increments LegalDemand.version by 1"

  # ---- Monitoring ----
  - method: POST
    path: "/compliance/monitoring-checks"
    description: "Record a monitoring sweep result for a site."
    roles: [PlatformAdmin, AuditEngineer]
    code: 201
    input: [site_id, regressions_found]
    output: MonitoringCheck
    side_effects: ["sets checked_at"]
  - method: GET
    path: "/compliance/monitoring-checks/{id}"
    description: "Fetch a single monitoring check."
    roles: [PlatformAdmin, AuditEngineer, ComplianceManager, OrgAdmin]
    code: 200
    input: []
    output: MonitoringCheck
    side_effects: []
  - method: GET
    path: "/compliance/monitoring-checks"
    description: "List monitoring checks, filterable by site_id."
    roles: [PlatformAdmin, AuditEngineer, ComplianceManager, OrgAdmin]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: MonitoringCheck[]
    side_effects: []

  # ---- Training ----
  - method: POST
    path: "/compliance/training-enrollments"
    description: "Enroll a learner under an organization."
    roles: [OrgAdmin]
    code: 201
    input: [organization_id, learner_email]
    output: TrainingEnrollment
    side_effects: []
  - method: GET
    path: "/compliance/training-enrollments/{id}"
    description: "Fetch a training enrollment."
    roles: [OrgAdmin, PlatformAdmin]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []
  - method: GET
    path: "/compliance/training-enrollments"
    description: "List training enrollments, filterable by organization_id."
    roles: [OrgAdmin, PlatformAdmin]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: TrainingEnrollment[]
    side_effects: []
  - method: POST
    path: "/compliance/training-enrollments/{id}/start"
    description: "ENROLLED->IN_PROGRESS."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: ["increments TrainingEnrollment.version by 1"]
  - method: POST
    path: "/compliance/training-enrollments/{id}/complete"
    description: "IN_PROGRESS->COMPLETED (requires score_pct >= 80)."
    roles: [OrgAdmin]
    code: 200
    input: [score_pct]
    output: TrainingEnrollment
    side_effects: ["stores score_pct", "increments TrainingEnrollment.version by 1"]
  - method: POST
    path: "/compliance/training-enrollments/{id}/expire"
    description: "ENROLLED->EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: ["increments TrainingEnrollment.version by 1"]

  # ---- Certifications / badges ----
  - method: POST
    path: "/compliance/certifications"
    description: "Grant a certification/badge backed by an ISSUED VPAT (mints badge_token, sets expires_at = now+365d)."
    roles: [ComplianceManager]
    code: 201
    input: [site_id, vpat_report_id]
    output: Certification
    side_effects: ["mints badge_token", "sets expires_at"]
  - method: GET
    path: "/compliance/certifications/{id}"
    description: "Fetch a certification."
    roles: [ComplianceManager, OrgAdmin, PlatformAdmin, AuditEngineer]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/compliance/certifications"
    description: "List certifications, filterable by site_id and/or vpat_report_id."
    roles: [ComplianceManager, OrgAdmin, PlatformAdmin, AuditEngineer]
    code: 200
    input: ["site_id?", "vpat_report_id?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: POST
    path: "/compliance/certifications/{id}/revoke"
    description: "GRANTED->REVOKED."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: Certification
    side_effects: ["increments Certification.version by 1"]
  - method: POST
    path: "/compliance/certifications/{id}/expire"
    description: "GRANTED->EXPIRED (requires now > expires_at)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["increments Certification.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Test-driving: set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets logical clock"]
  - method: GET
    path: "/compliance/_clock/now"
    description: "Test-driving: read the logical clock (default 2026-03-01T00:00:00Z)."
    roles: [PlatformAdmin, OrgAdmin, ComplianceManager, AuditEngineer, RemediationVendor]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for the operation."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path/body referenced resource does not exist."
  - id: ERR_FK_MISMATCH
    http: 409
    condition: "Body foreign keys reference inconsistent resources (e.g. retest task.finding_id != body finding_id)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for the requested transition."
  - id: ERR_STALE_SCAN_VERSION
    http: 412
    condition: "VPAT issue: expected_scan_version != live source Scan.version."
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "Subscription activate: expected_subscription_version != live Subscription.version."
  - id: ERR_SITE_BLOCKED_BY_LEGAL
    http: 409
    condition: "Operation blocked because the site's audit_posture is BLOCKED by an active LegalDemand."
  - id: ERR_SCAN_NOT_COMPLETED
    http: 409
    condition: "VPAT issue requires source Scan.status == COMPLETED."
  - id: ERR_VPAT_NOT_ISSUED
    http: 409
    condition: "Certification requires its VpatReport.status == ISSUED."
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "Scan start requires the site's Subscription.status IN {TRIAL, ACTIVE}."
  - id: ERR_EMPTY_FINDINGS
    http: 422
    condition: "Scan complete called with an empty findings[] payload."
  - id: ERR_SCORE_BELOW_PASS
    http: 422
    condition: "Training completion with score_pct < 80."
  - id: ERR_DUPLICATE_SITE_URL
    http: 409
    condition: "Site.url already exists within the organization."
  - id: ERR_SUBSCRIPTION_EXISTS
    http: 409
    condition: "Organization already has a subscription."
  - id: ERR_NOT_YET_EXPIRED
    http: 409
    condition: "Certification expire before logical clock now > expires_at."
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "Bad enum, out-of-range numeric, or malformed field value."
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "A required body field is absent."
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1-100 or offset < 0."
  - id: ERR_INVALID_DATETIME
    http: 422
    condition: "to_iso8601 / response_due_at not a valid ISO 8601 UTC instant."
  - id: ERR_SUPERSEDE_TARGET_NOT_REJECTED
    http: 409
    condition: "supersedes_task_id references a task whose status != REJECTED."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser: org creation, subscription lifecycle ops, monitoring, expiry sweeps, clock control."
    identity: opaque
    exclusive_operations:
      - "POST /organizations"
      - "POST /subscriptions/{id}/mark-past-due"
      - "POST /subscriptions/{id}/suspend"
      - "POST /training-enrollments/{id}/expire"
      - "POST /certifications/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /subscriptions"
      - "POST /sites"
      - "POST /monitoring-checks"
      - "all GET reads"

  - name: OrgAdmin
    description: "Customer admin: manages the organization's subscription activation/cancel, sites, training."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/cancel"
      - "POST /training-enrollments"
      - "POST /training-enrollments/{id}/start"
      - "POST /training-enrollments/{id}/complete"
    shared_operations:
      - "POST /subscriptions"
      - "POST /sites"
      - "site/scan/finding/vpat/certification/legal GET reads"

  - name: AuditEngineer
    description: "Owns scans, findings emission, and re-tests."
    identity: opaque
    exclusive_operations:
      - "POST /scans"
      - "POST /scans/{id}/start"
      - "POST /scans/{id}/complete"
      - "POST /scans/{id}/fail"
      - "POST /scans/{id}/cancel"
      - "POST /retest-runs"
    shared_operations:
      - "POST /monitoring-checks"
      - "scan/finding/retest GET reads"

  - name: RemediationVendor
    description: "Owns remediation tasks and their lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /remediation-tasks"
      - "POST /remediation-tasks/{id}/begin"
      - "POST /remediation-tasks/{id}/submit"
    shared_operations:
      - "finding/remediation-task/retest GET reads"

  - name: ComplianceManager
    description: "Owns VPAT reports, legal-demand response, accept-risk, and certifications/badges."
    identity: opaque
    exclusive_operations:
      - "POST /findings/{id}/accept-risk"
      - "POST /vpat-reports"
      - "POST /vpat-reports/{id}/issue"
      - "POST /vpat-reports/{id}/revoke"
      - "POST /legal-demands"
      - "POST /legal-demands/{id}/respond"
      - "POST /legal-demands/{id}/escalate"
      - "POST /legal-demands/{id}/resolve"
      - "POST /legal-demands/{id}/dismiss"
      - "POST /certifications"
      - "POST /certifications/{id}/revoke"
    shared_operations:
      - "org/site/scan/finding/vpat/legal/certification GET reads"
