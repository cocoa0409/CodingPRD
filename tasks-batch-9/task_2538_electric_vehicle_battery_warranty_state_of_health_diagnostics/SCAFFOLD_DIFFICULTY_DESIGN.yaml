              as: ProgramAdmin
              captures: { veh_c_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0001", pack_type: "NEW", nominal_capacity_kwh: 80.000, module_count: 16, gross_weight_kg: 483.296, stock_region_code: "US-WEST", installed_vehicle_id: "${veh_a_id}" }
              as: ProgramAdmin
              captures: { pack_a_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
