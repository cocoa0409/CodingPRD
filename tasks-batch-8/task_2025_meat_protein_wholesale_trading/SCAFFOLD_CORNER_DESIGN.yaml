            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${chk_id}", expected_yield_pct: 50.0, min_yield_pct: 45.0, max_yield_pct: 55.0 }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-Z", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 900, weekly_supply_lbs: 50000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-Z", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-06" }, as: Trader, captures: { po_id: "$.data.id" } }
