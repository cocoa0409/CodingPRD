            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Penumbra", artist: "S. Lind", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { a2_id: $.data.id }
            - call: "POST /condition-reports"
