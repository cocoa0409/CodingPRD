            - "Talent with CONFIRMED booking on engagement 2026-08-10..2026-08-12; a second PENDING booking on engagement 2026-08-12..2026-08-14 (overlaps on 08-12) and a third on 2026-08-13..2026-08-14 (adjacent? no — first ends 08-12, so 08-13 start is disjoint)"
