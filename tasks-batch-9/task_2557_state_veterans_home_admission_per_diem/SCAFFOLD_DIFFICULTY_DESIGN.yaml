  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resident_state_beats_no_available_bed_on_transfer
        grounds:
          - validations[priority=60,ERR_RESIDENT_STATE_INVALID]
          - validations[priority=90,ERR_NO_AVAILABLE_BED]
          - errors.ERR_RESIDENT_STATE_INVALID
          - errors.ERR_NO_AVAILABLE_BED
          - calculations.care_unit_bed_availability
        distinguishing_aspect: |
          The single transfer request violates BOTH the priority-60 occupancy-state rule (the
          resident is HOSPITALIZED, and only ADMITTED may transfer) and the priority-90 capacity
          rule (the target unit's available_bed_count is 0). The response must be
          ERR_RESIDENT_STATE_INVALID with HTTP 409; returning ERR_NO_AVAILABLE_BED means the
          capacity check ran before the state check. The control call at the end readmits the
          resident and reissues the identical transfer, which must then surface
          ERR_NO_AVAILABLE_BED — proving the lower-priority rule really was violated all along.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with two CERTIFIED NURSING CareUnits: unit A licensed_bed_count 2 / out_of_service_bed_count 0, and unit B licensed_bed_count 1 / out_of_service_bed_count 1 so B's available_bed_count is 0 and its posture is RESTRICTED (transfers in are allowed by posture)."
            - "One Resident admitted 2026-08-01 into unit A with an ACTIVE CarePlan whose care_level is NURSING, so neither ERR_NO_ACTIVE_CARE_PLAN nor ERR_CARE_LEVEL_MISMATCH applies."
            - "The resident is hospitalized on 2026-08-05, so occupancy_status is HOSPITALIZED."
