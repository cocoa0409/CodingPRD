      - name: credential_window_capacity_aggregates_only_overlapping_approved_requests
        grounds:
          - calculations.credential_window_overlap_capacity
          - validations[priority=31]
          - errors.ERR_ZONE_CREDENTIAL_WINDOW_CAPACITY
          - entities.AccessZone.fields.credential_capacity
          - entities.CredentialRequest.fields.valid_from
          - entities.CredentialRequest.fields.valid_until
          - calculations.credential_forgone_revenue
        distinguishing_aspect: |
          The capacity check is an AGGREGATE over the half-open windows
          [valid_from, valid_until) of the zone's APPROVED credential requests. Against
          credential_capacity 4: CR1 (qty 3, 18:00-20:00) approves; CR2 (qty 2,
          19:00-21:00) overlaps CR1 and 3 + 2 == 5 > 4 so it is refused; CR3 (qty 4,
          20:00-22:00) merely TOUCHES CR1 at 20:00 and therefore overlaps nothing, so
          4 <= 4 approves. Counting all approved requests regardless of window, or treating
          touching windows as overlapping, refuses CR3 and fails.
