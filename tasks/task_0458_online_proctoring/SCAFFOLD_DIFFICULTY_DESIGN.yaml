# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Online Proctoring & Remote Exam — Expert band
# 9 rule_id blocks × 2 instances = 18 difficulty instances
# Clock default: 2026-01-01T00:00:00Z. Exam windows live in 2026-07-01.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: integrity_score_live_vs_record_review_diverge
        grounds:
          - calculations.session_integrity_score
          - state_machines.ProctoringSession.ACTIVE_to_ACTIVE        # flag raise path (POST /sessions/{id}/flags)
          - entities.ProctoringSession.fields.integrity_score
          - entities.Exam.fields.monitoring_mode
        distinguishing_aspect: |
          Identical flag set (1 MINOR + 1 MAJOR) yields integrity_score 80.00 on a LIVE
          session but 82.50 on a RECORD_REVIEW session because RECORD_REVIEW halves MINOR
          weight only — the two variants live on the ProctoringSession entity domain.
        test_recipe:
          setup:
            - "Institution + proctor(cap 4) + candidate + two exams (one LIVE, one RECORD_REVIEW) in the 2026-07-01 window, lockdown off."
            - "Two appointments checked in, each producing an ACTIVE session; one MINOR + one MAJOR flag raised on each."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst A" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Pat Proctor", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Casey Cand", email: "casey@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Live Exam", base_duration_minutes: 120, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_live_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Review Exam", base_duration_minutes: 120, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "RECORD_REVIEW", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_rev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_live_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_live_id: $.data.id }
            - call: "POST /appointments/${appt_live_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_live_id: $.data.id }
            - call: "POST /sessions/${sess_live_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_live_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /appointments"
              payload: { exam_id: "${exam_rev_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T13:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_rev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T13:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments/${appt_rev_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_rev_id: $.data.id }
            - call: "POST /sessions/${sess_rev_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_rev_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
          trigger:
            - call: "GET /sessions/${sess_live_id}"
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { live_score: $.data.integrity_score }
            - call: "GET /sessions/${sess_rev_id}"
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { rev_score: $.data.integrity_score }
          assert:
            - "ProctoringSession.${sess_live_id}.integrity_score == 80.00"
            - "ProctoringSession.${sess_rev_id}.integrity_score == 82.50"
            - "ProctoringSession.${sess_live_id}.integrity_score != ProctoringSession.${sess_rev_id}.integrity_score"

      - name: proctor_load_factor_admission_vs_snapshot_diverge
        grounds:
          - calculations.proctor_load_factor
          - entities.Proctor.fields.load_factor
          - entities.Proctor.fields.active_session_count
          - state_machines.ProctoringSession.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          The Proctor entity's risk score (load_factor) is a SECOND dual-variant calculation on a
          DIFFERENT entity domain than session_integrity_score: the admission-check variant counts the
          prospective session (LIVE weight 1.0) while the reporting-snapshot variant excludes a just-completed
          session, so the same proctor reads load_factor 0.5000 with 2 sessions and 0.2500 after one completes.
        test_recipe:
          setup:
            - "Institution + proctor(cap 4) + candidate + LIVE exam (lockdown off)."
            - "Two appointments checked in -> two ACTIVE LIVE sessions (weighted 2.0 / cap 4 = 0.5000)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst B" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Lee Load", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cam One", email: "cam1@x.com" }
              as: SchedulingCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cam Two", email: "cam2@x.com" }
              as: SchedulingCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Load Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c1_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${c1_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c2_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments/${appt2_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${c2_id}"
              captures: { sess2_id: $.data.id }
          trigger:
            - call: "GET /proctors/${proc_id}"
              as: SchedulingCoordinator
              captures: { load_before: $.data.load_factor, count_before: $.data.active_session_count }
            - call: "POST /sessions/${sess1_id}/complete"
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "GET /proctors/${proc_id}"
              as: SchedulingCoordinator
              captures: { load_after: $.data.load_factor, count_after: $.data.active_session_count }
          assert:
            - "Proctor.${proc_id}.load_factor == 0.5000 before completing sess1 (active_session_count == 2)"
            - "Proctor.${proc_id}.load_factor == 0.2500 after completing sess1 (active_session_count == 1)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: effective_window_ceil_before_setup_add_mode_a
        grounds:
          - calculations.appointment_effective_window
          - entities.Appointment.fields.effective_duration_minutes
          - entities.Accommodation.fields.extra_time_pct
          - entities.Exam.fields.base_duration_minutes
        distinguishing_aspect: |
          Mode (a) non-linear: 3 inputs (base 90, extra 25%, SETUP 10) with a ceil that must be applied to
          the accommodated core BEFORE adding setup: ceil(90*1.25)=ceil(112.5)=113, +10 = 123 minutes — not
          ceil(90*1.25+10)=ceil(122.5)=123 by coincidence-avoidance the order is pinned and tested at a
          fractional core.
        test_recipe:
          setup:
            - "Institution + candidate + exam(base 90) + approved accommodation extra_time_pct=25 for that candidate+exam."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst C" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc C", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand C", email: "candc@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Acc Exam", base_duration_minutes: 90, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /accommodations"
              payload: { candidate_id: "${cand_id}", exam_id: "${exam_id}", extra_time_pct: 25 }
              as: SchedulingCoordinator
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", accommodation_id: "${acc_id}", scheduled_start_utc: "2026-07-01T10:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.effective_duration_minutes == 123"
            - "Appointment.${appt_id}.effective_end_utc == 2026-07-01T12:03:00Z"

      - name: report_aggregate_per_session_round_before_mean_mode_b
        grounds:
          - calculations.report_aggregate_score
          - entities.IntegrityReport.fields.aggregate_score
          - state_machines.IntegrityReport.DRAFT_to_DELIVERED
          - entities.IntegrityReport.fields.session_ids
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: scores [80.0, 82.5, 60.0] give 74.33 under the pinned
          PER_SESSION_ROUND order ([80,83,60] mean) but 74.17 under round-after-mean (222.5/3); the scaffold
          pins PER_SESSION_ROUND so the delivered aggregate_score is exactly 74.33.
        test_recipe:
          setup:
            - "Three terminal sessions for one candidate (across a LIVE and a RECORD_REVIEW exam) with integrity scores 80.00 (LIVE 1min+1maj), 82.50 (RECORD_REVIEW 1min+1maj), 60.00 (LIVE 1 CRITICAL)."
            - "A DRAFT IntegrityReport bundling all three sessions; institution report_threshold_score set to 80 so 74.33 < 80 escalates."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst D", report_threshold_score: 80 }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc D", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand D", email: "candd@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Live Rpt", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_live_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Review Rpt", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "RECORD_REVIEW", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_rev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_live_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_a_id: $.data.id }
            - call: "POST /appointments/${appt_a_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_a_id: $.data.id }
            - call: "POST /sessions/${sess_a_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_a_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_a_id}/complete"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /appointments"
              payload: { exam_id: "${exam_rev_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments/${appt_b_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_b_id: $.data.id }
            - call: "POST /sessions/${sess_b_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_b_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_b_id}/complete"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /appointments"
              payload: { exam_id: "${exam_live_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T13:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T13:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments/${appt_c_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_c_id: $.data.id }
            - call: "POST /sessions/${sess_c_id}/flags"
              payload: { kind: "PROHIBITED_MATERIAL", severity: "CRITICAL" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /sessions/${sess_c_id}/complete"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /integrity-reports"
              payload: { institution_id: "${inst_id}", candidate_id: "${cand_id}", exam_id: "${exam_live_id}", session_ids: ["${sess_a_id}", "${sess_b_id}", "${sess_c_id}"] }
              as: SchedulingCoordinator
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /integrity-reports/${report_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
              captures: { agg: $.data.aggregate_score, disp: $.data.disposition }
          assert:
            - "IntegrityReport.${report_id}.aggregate_score == 74.33"
            - "IntegrityReport.${report_id}.disposition == ESCALATED_TO_INSTITUTION"
            - "IntegrityReport.${report_id}.status == DELIVERED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: escalation_fork_join_uphold_vs_dismiss_divergent_side_effects
        grounds:
          - state_machines.Escalation.UNDER_REVIEW_to_UPHELD
          - state_machines.Escalation.UNDER_REVIEW_to_DISMISSED
          - state_machines.ProctoringSession.REVIEW_HELD_to_VOIDED
          - state_machines.ProctoringSession.REVIEW_HELD_to_ACTIVE
        distinguishing_aspect: |
          Escalation is a branching fork-join on the Escalation entity: UNDER_REVIEW forks to UPHELD (session
          -> VOIDED, void_reason=ESCALATION_UPHELD, appointment -> CONSUMED) versus DISMISSED (session
          REVIEW_HELD -> ACTIVE, flag RESOLVED) — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two sessions each held under an UNDER_REVIEW escalation claimed by a separate review officer."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst E" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Opener", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { opener_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Officer", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand E1", email: "e1@x.com" }
              as: SchedulingCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand E2", email: "e2@x.com" }
              as: SchedulingCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Esc Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c1_id}", proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${c1_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /sessions/${sess1_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { flag1_id: $.data.id }
            - call: "POST /escalations"
              payload: { session_id: "${sess1_id}", incident_flag_id: "${flag1_id}" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { esc1_id: $.data.id }
            - call: "POST /escalations/${esc1_id}/claim"
              payload: {}
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { esc1_v: $.data.version }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c2_id}", proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments/${appt2_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${c2_id}"
              captures: { sess2_id: $.data.id }
            - call: "POST /sessions/${sess2_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { flag2_id: $.data.id }
            - call: "POST /escalations"
              payload: { session_id: "${sess2_id}", incident_flag_id: "${flag2_id}" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { esc2_id: $.data.id }
            - call: "POST /escalations/${esc2_id}/claim"
              payload: {}
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { esc2_v: $.data.version }
          trigger:
            - call: "POST /escalations/${esc1_id}/decide"
              payload: { verdict: "UPHELD", expected_escalation_version: "${esc1_v}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
            - call: "POST /escalations/${esc2_id}/decide"
              payload: { verdict: "DISMISSED", expected_escalation_version: "${esc2_v}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
          assert:
            - "ProctoringSession.${sess1_id}.status == VOIDED"
            - "ProctoringSession.${sess1_id}.void_reason == ESCALATION_UPHELD"
            - "Appointment.${appt1_id}.status == CONSUMED"
            - "ProctoringSession.${sess2_id}.status == ACTIVE"
            - "Escalation.${esc2_id}.status == DISMISSED"

      - name: session_paused_resume_cycle_then_review_held_return
        grounds:
          - state_machines.ProctoringSession.ACTIVE_to_PAUSED
          - state_machines.ProctoringSession.PAUSED_to_ACTIVE
          - state_machines.ProctoringSession.REVIEW_HELD_to_ACTIVE
          - entities.ProctoringSession.fields.status
        distinguishing_aspect: |
          ProctoringSession is a different entity than Escalation and carries a cycle: ACTIVE -> PAUSED -> ACTIVE
          (network-drop loop) and REVIEW_HELD -> ACTIVE (dismissed escalation), proving the session row revisits
          ACTIVE multiple times rather than progressing linearly.
        test_recipe:
          setup:
            - "One ACTIVE session; pause and resume it once; then open+dismiss an escalation so it returns to ACTIVE again."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst F" }
