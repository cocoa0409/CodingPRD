            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg2_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/delay"
              payload: { delay_minutes: 300 }
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg2_id}/rebook"
              payload: { scheduled_depart_utc: "2026-12-26T01:00:00Z", scheduled_arrive_utc: "2026-12-26T02:00:00Z" }
              as: TravelCoordinator
              captures: { err: $.data.error_id }
          assert:
