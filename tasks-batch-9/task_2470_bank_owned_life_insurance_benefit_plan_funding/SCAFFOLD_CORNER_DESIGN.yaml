            - "after trigger call 1: PolicyPurchaseRequest.${pr_jakes_id}.status == DILIGENCE_CLEARED and reserved_premium_usd == 0.00"
            - "trigger call 2 returns HTTP 200 with PolicyPurchaseRequest.${pr_jakes_id}.status == CAPACITY_RESERVED"
