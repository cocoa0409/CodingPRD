            - "the probe one second before the deadline is accepted: ${early_attempt_id} == 1 and Claim.${claim_id}.claim_status == REPROCESSING"
            - "the probe exactly at the deadline returns status 422 and ${error_id_late} == ERR_TIMELY_FILING_EXPIRED"
