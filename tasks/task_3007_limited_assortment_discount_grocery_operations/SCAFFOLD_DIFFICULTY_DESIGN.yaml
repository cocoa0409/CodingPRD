            - "Product.${prod2}.primary_supplier_id == Supplier.${sup_c}.id and secondary_supplier_id == Supplier.${sup_d}.id"
            - "Category.${cat}.active_sku_count == 2 (hop B->C)"
            - "Category.${cat}.status == LOCKED (hop C->D, count reached cap)"

      - name: sell_cascades_buy_soldout_store_sellthrough
        grounds:
          - state_machines.FindsAllocation.ON_SALE_to_SOLD_OUT
          - state_machines.FindsBuy.ON_SALE_to_SOLD_OUT
          - entities.Store.fields.finds_sell_through_pct
        distinguishing_aspect: |
          Depth-3 cascade from a sell (different trigger than award): sell of
          the last unit (A) flips the allocation ON_SALE->SOLD_OUT (B); that
          recomputes FindsBuy.remaining_quantity to 0 and flips the buy
          ON_SALE->SOLD_OUT (C); that recomputes Store.finds_sell_through_pct
          to 100.0 (D).
