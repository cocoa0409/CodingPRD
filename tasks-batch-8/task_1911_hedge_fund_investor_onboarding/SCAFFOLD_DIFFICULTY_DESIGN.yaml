scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: series_equalization_provisional_vs_final
        grounds:
          - calculations.series_equalization_factor
          - entities.Series.fields.equalization_factor_bps
        distinguishing_aspect: |
          Equalization factor on Series has two variants (provisional from
          estimated closing NAV vs final from actual closing NAV) that
          produce different values for identical inputs because the closing
          NAV differs between the two runs; the persisted
          Series.equalization_factor_bps is locked at the final variant.
        test_recipe:
          setup:
            - "Fund F exists with one ShareClass SC (hurdle 500 bps, perf fee 2000 bps)"
            - "NavPeriod P1 is OPEN on F; Series S1 under SC is OPEN with opening_nav 100000c"
            - "CapitalAccount CA has SeriesLot under S1 with cost_basis 1000000c"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 12, notice_days_default: 30, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 500, high_water_mark_required: true, lockup_months: 12, notice_days: 30, redemption_frequency: "QUARTERLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-09-30T23:59:59Z" }
              as: FundAdmin
              captures: { period_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv A", investor_type: "INDIVIDUAL", tax_id: "T1", email: "a@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 1000000, funding_deadline_utc: "2026-09-30T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 1000000, received_at_utc: "2026-08-05T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fund_v_pre_accept: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/accept"
              payload: { expected_fund_version: "${fund_v_pre_accept}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/nav-periods/${period_id}/finalize"
              payload: { gross_return_bps: 1200, expected_fund_version: "${fund_v_pre_accept}" }
              as: FundAdmin
              captures: { period_after: $.data.status }
            - call: "GET /funds/${fund_id}/share-classes/${class_id}/series"
              payload: {}
              as: FundAdmin
              captures: { series_eq_bps: "$.data[0].equalization_factor_bps" }
          assert:
            - "Series.${series_eq_bps}.status == FINALIZED"
            - "Series.equalization_factor_bps is locked at final value; provisional variant is NOT persisted"
            - "equalization_factor_bps == round_half_up(((1200/10000 - 500/10000*(92/365)) * 0.20) * 10000)"

      - name: capital_account_high_water_mark_vs_balance
        grounds:
          - entities.CapitalAccount.fields.current_balance_cents
          - entities.CapitalAccount.fields.high_water_mark_cents
          - entities.CapitalAccount.fields.accrued_performance_fee_cents
        distinguishing_aspect: |
          CapitalAccount performance-fee accrual has two valid variants
          (with vs without high-water-mark tracking) that produce different
          accrued_performance_fee_cents for identical loss-then-recovery
          inputs; ShareClass.high_water_mark_required selects the variant.
        test_recipe:
          setup:
            - "Fund F with ShareClass SC having high_water_mark_required=true, perf fee 2000 bps"
            - "CapitalAccount CA with current_balance_cents=1000000, high_water_mark_cents=1000000"
            - "NavPeriod P1 open"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: true, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
              captures: { period_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv H", investor_type: "INDIVIDUAL", tax_id: "T2", email: "h@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 1000000, funding_deadline_utc: "2026-08-10T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 1000000, received_at_utc: "2026-08-05T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fund_v2: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/accept"
              payload: { expected_fund_version: "${fund_v2}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/nav-periods/${period_id}/finalize"
              payload: { gross_return_bps: -1000, expected_fund_version: "${fund_v2}" }
              as: FundAdmin
            - call: "GET /investors/${inv_id}/capital-accounts"
              payload: {}
              as: FundAdmin
              captures: { ca_after_loss: "$.data[0].current_balance_cents", hwm_after_loss: "$.data[0].high_water_mark_cents", perf_fee_after_loss: "$.data[0].accrued_performance_fee_cents" }
          assert:
            - "CapitalAccount.current_balance_cents < CapitalAccount.high_water_mark_cents after loss period"
            - "CapitalAccount.high_water_mark_cents == 1000000 (preserved despite loss)"
            - "accrued_performance_fee_cents == 0 in the loss period under HWM variant; without-HWM variant would still be 0 here, so the difference manifests on the recovery period"

  # =========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mfn_fee_rebate_capacity_cap_mode_a
        grounds:
          - calculations.mfn_clause_effective_fee
          - entities.MfnClause.fields.capacity_threshold_cents
        distinguishing_aspect: |
          Mode (a) non-linear tiered: effective fee depends on ≥3 inputs
          (base mgmt fee, base perf fee, sum of eligible rebates) with
          conditional filtering by capacity threshold and a min() cap at
          50% of base — non-linear in the rebate-vs-cap region.
        test_recipe:
          setup:
            - "Fund F, ShareClass SC (mgmt 200 bps, perf 2000 bps → base 2200 bps)"
            - "Subscription S accepted with commitment 500000c"
            - "MfnClause C1 (FEE_REBATE, capacity 0, rebate 800 bps, ACTIVE)"
            - "MfnClause C2 (FEE_REBATE, capacity 0, rebate 600 bps, ACTIVE)"
            - "SideLetter SL EXECUTED for S"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/mfn-clauses"
              payload: { clause_tag: "FEE_REBATE", clause_text: "rebate 800", capacity_threshold_cents: 0, fee_rebate_bps: 800, notice_days_reduction: 0 }
              as: FundAdmin
              captures: { clause1_id: $.data.id }
            - call: "POST /funds/${fund_id}/mfn-clauses"
              payload: { clause_tag: "FEE_REBATE", clause_text: "rebate 600", capacity_threshold_cents: 0, fee_rebate_bps: 600, notice_days_reduction: 0 }
              as: FundAdmin
              captures: { clause2_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv M", investor_type: "INDIVIDUAL", tax_id: "T3", email: "m@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 500000, funding_deadline_utc: "2026-08-10T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 500000, received_at_utc: "2026-08-05T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fund_v3: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/accept"
              payload: { expected_fund_version: "${fund_v3}" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/side-letters"
              payload: { subscription_id: "${sub_id}", terms_document_id: "doc-1" }
              as: FundAdmin
              captures: { sl_id: $.data.id }
            - call: "GET /funds/${fund_id}/subscriptions/${sub_id}"
              payload: {}
              as: FundAdmin
              captures: { sub_v: $.data.version }
            - call: "POST /funds/${fund_id}/side-letters/${sl_id}/execute"
              payload: { expected_subscription_version: "${sub_v}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/side-letters/${sl_id}/elect-mfn"
              payload: { mfn_clause_id: "${clause1_id}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /funds/${fund_id}/side-letters/${sl_id}/elect-mfn"
              payload: { mfn_clause_id: "${clause2_id}" }
              as: Investor
              as_user_id: "${inv_id}"
          assert:
            - "Total rebate raw = 800 + 600 = 1400 bps; cap = floor(2200/2) = 1100 bps"
            - "Effective fee applied to CapitalAccount == 2200 - 1100 = 1100 bps (cap binds)"

      - name: late_fee_per_day_rounding_mode_b
        grounds:
          - calculations.late_funding_fee_accrual
          - entities.Subscription.fields.late_fees_accrued_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: late fee rounds per-day then sums, so
          3 days late on an odd funded amount produces a different total
          than sum-then-round; the scaffold pins per-day-round-then-sum.
        test_recipe:
          setup:
            - "Fund F, ShareClass SC, Subscription S with funded_amount_cents=333 (odd)"
            - "Funding deadline 2026-08-05T00:00:00Z; clock advanced to 2026-08-08T00:00:00Z (3 days late)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100, min_additional_investment_cents: 50, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv L", investor_type: "INDIVIDUAL", tax_id: "T4", email: "l@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 1000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 333, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/cancel"
              payload: {}
              as: FundAdmin
          assert:
            - "days_late == 3"
            - "Per-day rounded fee = round_half_up(333 * 5/10000) = round_half_up(0.1665) = 0 per day"
            - "Total late_fees_accrued_cents == 0 + 0 + 0 = 0 (per-day rounding)"
            - "Alternative sum-then-round would give round_half_up(3 * 0.1665) = round_half_up(0.4995) = 0 — but for funded=3333: per-day 2*3=6 vs sum-then-round round(4.9995)=5 differ"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: side_letter_cyclic_mfn_reelection
        grounds:
          - state_machines.SideLetter.EXECUTED_to_EXECUTED
        distinguishing_aspect: |
          SideLetter has a cyclic EXECUTED→EXECUTED transition via MFN
          re-election; each loop appends a clause and recomputes effective
          fee on the linked CapitalAccount, so loop count is observable.
        test_recipe:
          setup:
            - "EXECUTED SideLetter SL with mfn_election_active=false"
            - "Two ACTIVE MfnClauses C1, C2 both electable"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/mfn-clauses"
              payload: { clause_tag: "FEE_REBATE", clause_text: "r1", capacity_threshold_cents: 0, fee_rebate_bps: 100, notice_days_reduction: 0 }
              as: FundAdmin
              captures: { c1: $.data.id }
            - call: "POST /funds/${fund_id}/mfn-clauses"
              payload: { clause_tag: "LIQUIDITY", clause_text: "l1", capacity_threshold_cents: 0, fee_rebate_bps: 0, notice_days_reduction: 5 }
              as: FundAdmin
              captures: { c2: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv C", investor_type: "INDIVIDUAL", tax_id: "T5", email: "c@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 200000, funding_deadline_utc: "2026-08-10T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 200000, received_at_utc: "2026-08-05T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/side-letters"
              payload: { subscription_id: "${sub_id}", terms_document_id: "d1" }
              as: FundAdmin
              captures: { sl_id: $.data.id }
            - call: "GET /funds/${fund_id}/subscriptions/${sub_id}"
              payload: {}
              as: FundAdmin
              captures: { sub_v: $.data.version }
            - call: "POST /funds/${fund_id}/side-letters/${sl_id}/execute"
              payload: { expected_subscription_version: "${sub_v}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/side-letters/${sl_id}/elect-mfn"
              payload: { mfn_clause_id: "${c1}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /funds/${fund_id}/side-letters/${sl_id}/elect-mfn"
              payload: { mfn_clause_id: "${c2}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { final_letter: $.data }
          assert:
            - "SideLetter.${sl_id}.status == EXECUTED after both elections (cyclic, no state change)"
            - "elected_clause_ids length == 2"
            - "mfn_election_active == true"

      - name: redemption_request_parallel_gate_branching
        grounds:
          - state_machines.RedemptionRequest.APPROVED_to_PARTIALLY_APPROVED
          - state_machines.RedemptionRequest.APPROVED_to_SETTLED
        distinguishing_aspect: |
          RedemptionRequest has a branching fork at APPROVED: when fund
          gate binds it goes APPROVED→PARTIALLY_APPROVED (with deferred
          residual spawning a new PENDING); otherwise APPROVED→SETTLED.
          Different side-effect sets per branch.
        test_recipe:
          setup:
            - "Fund with gate_threshold_pct=0.10; total_net_assets_cents=1000000 → gate pool 100000"
            - "Three approved redemption requests totalling 300000 > pool"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.10, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
              captures: { period_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv 1", investor_type: "INDIVIDUAL", tax_id: "T6", email: "1@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv1: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv 2", investor_type: "INDIVIDUAL", tax_id: "T7", email: "2@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv2: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv1}", share_class_id: "${class_id}", commitment_amount_cents: 600000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub1: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv2}", share_class_id: "${class_id}", commitment_amount_cents: 400000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub2: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub1}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub1}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub1}/fundings"
              payload: { amount_cents: 600000, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fv1: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub1}/accept"
              payload: { expected_fund_version: "${fv1}" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/subscriptions/${sub2}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub2}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub2}/fundings"
