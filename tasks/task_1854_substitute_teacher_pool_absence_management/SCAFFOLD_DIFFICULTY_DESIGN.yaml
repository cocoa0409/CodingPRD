          assert:
            - "Assignment.${asg1}: status == CANCELLED with cancel_reason == SUB_CANCEL"
            - "Substitute.${subA}: reliability_trailing_score == 55 (70 - 15 late cancel) and status == SUSPENDED (55 < 60 with min completions 0)"
            - "Assignment.${asg2}: status == CANCELLED with cancel_reason == SUSPENSION_CANCEL (link 4 caused by the suspension, not by the original cancel)"
            - "Absence.${abs1}.fill_status == DISPATCHING and Absence.${abs2}.fill_status == DISPATCHING (both reopened)"
            - "New OFFERED assignment on absence ${abs2} has substitute_id == ${subB} with offer_sequence == 2 (link 5); no new offer exists on absence ${abs1} (B is not MATH-qualified and A is SUSPENDED)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_offer_state_beats_clearance_safety
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_ASSIGNMENT_INVALID_STATE]
          - errors[ERR_CLEARANCE_INVALID]
        distinguishing_aspect: |
          Category pair state x business_safety: the accept violates both (offer expired ->
          EXPIRED, and the background-check clearance expired while the clock advanced), and
          the state-layer error ERR_ASSIGNMENT_INVALID_STATE (priority 8) must win over
          ERR_CLEARANCE_INVALID (priority 10).
        test_recipe:
          setup:
            - "District defaults (offer window 120 min); school NONE budget 1000000; teacher MATH/HIGH"
            - "Sub A qualified, BACKGROUND_CHECK expires 2026-08-05 (VERIFIED), TEACHING_CREDENTIAL expires 2027-12-31, ACTIVE"
            - "Absence Tue 2026-08-04..Wed 2026-08-05; manual offer created at 2026-08-03T09:00:00Z (expires 11:00)"
            - "Clock advanced to 2026-08-21T00:00:00Z: offer long expired AND background check expired (2026-08-21 > 2026-08-05)"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2026-08-05" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-04", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}", captures: { err: $.data.error_id } }
            - { call: "GET /assignments/${asg1}", payload: {}, as: DistrictAdmin, captures: { asg_status: $.data.status } }
            - { call: "GET /substitutes/${subA}/clearances", payload: {}, as: DistrictAdmin, captures: { clr_status: "$.data[0].status" } }
          assert:
            - "error_id == ERR_ASSIGNMENT_INVALID_STATE (the expired offer is auto-EXPIRED and the state-layer error wins)"
            - "error_id != ERR_CLEARANCE_INVALID even though the background check is also expired"
            - "Assignment.${asg1}.status == EXPIRED after the lazy expiry applied by the respond attempt"
            - "Clearance ${clr1}.status == EXPIRED after the lazy expiry applied on read"

      - name: assignment_overlap_temporal_beats_budget_fiscal
        grounds:
          - validations[priority=14]
          - validations[priority=19]
          - errors[ERR_ASSIGNMENT_DATE_OVERLAP]
          - errors[ERR_COVERAGE_BUDGET_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair business_temporal x business_fiscal: the accept fails both the
          substitute's day-overlap rule (already ACCEPTED on overlapping dates) and the broke
          school's budget rule; ERR_ASSIGNMENT_DATE_OVERLAP (priority 14) must win over
          ERR_COVERAGE_BUDGET_INSUFFICIENT (priority 19).
        test_recipe:
          setup:
            - "District defaults; school S1 budget 1 (insufficient for any provisional), school S2 budget 1000000"
            - "Sub X qualified both MATH/HIGH and SCIENCE/HIGH, ACTIVE"
            - "Absence1 at S1 Mon 2026-08-03..Wed 2026-08-05 (MATH), offered to X; absence2 at S2 Tue 2026-08-04..Thu 2026-08-06 (SCIENCE), offered to X; X accepts absence2 first"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1 }, as: DistrictAdmin, captures: { sch1: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S2", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch1}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch2}", full_name: "Teach Two", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub X", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subX: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subX}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /qualifications", payload: { substitute_id: "${subX}", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subX}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subX}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subX}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-04", end_date: "2026-08-06", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t2}", captures: { abs2: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subX}" }, as: DistrictAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs2}", substitute_id: "${subX}" }, as: DistrictAdmin, captures: { asg2: $.data.id } }
            - { call: "POST /assignments/${asg2}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subX}" }
          trigger:
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subX}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_DATE_OVERLAP (temporal layer, priority 14)"
            - "error_id != ERR_COVERAGE_BUDGET_INSUFFICIENT even though school S1 available budget (1 cent) is below any provisional"
            - "Assignment.${asg1}.status == OFFERED still (failed accept leaves the offer live)"

  - rule_id: boundary_precision_check
    instances:
      - name: long_term_conversion_threshold_9_vs_10_days
        grounds:
          - calculations.final_payout
          - entities.Assignment.fields.long_term_converted
        distinguishing_aspect: |
          Numeric threshold metric via timesheet/verify endpoints: a 9-workday streak never
          converts (streak_index 9 < 10, all days at premium rate, final 180000) while a
          10-workday streak converts exactly at the 10th day (streak_index 10 >= 10, day-10 pay
          jumps 20000 -> 23000, final 203000) — the >= boundary is exercised one day apart.
