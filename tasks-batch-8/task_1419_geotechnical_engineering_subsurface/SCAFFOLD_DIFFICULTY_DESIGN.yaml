            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: FirmAdmin }
          trigger:
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE (priority-5 state failure reported, not the priority-6 safety failure ERR_CLEARANCE_EXPIRED)"
      - name: suspended_sub_beats_inverted_window
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_STANDING_SUSPENDED]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: |
          Category pair (business_constraint, business_temporal) — distinct from instance 1's
          (state, business_safety): the rig-assignment create has a SUSPENDED subcontractor AND
          an inverted window; the priority-7 constraint error ERR_STANDING_SUSPENDED wins over
          ERR_INVALID_WINDOW.
        test_recipe:
          setup:
            - "Project SCOPED with APPROVED plan and boring B-1 PLANNED; subcontractor suspended"
          setup_api_calls:
