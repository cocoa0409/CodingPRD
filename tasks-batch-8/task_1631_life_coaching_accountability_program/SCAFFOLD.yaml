# =============================================================================
# PRD Benchmark Seed Tables — task_1631_life_coaching_accountability_program
# Life Coaching & Accountability Program (ICF-credentialed coaching practice)
# =============================================================================

scenario: |
  Life Coaching & Accountability Program (ICF-credentialed coaching practice): discovery call & fit assessment, program tier (single/package/membership) & payment plan, session scheduling & rescheduling rules, goal tracking & habit accountability between sessions, group cohort programming & community access, testimonial/outcome capture with consent, refund & pause policy, coach credentialing & ethics boundaries

domain_name: life-coaching-accountability
api_prefix: /coaching

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat            # peer entities linked by foreign keys; no nested URL ownership
  state_machine_shape: parallel    # Enrollment carries lifecycle_status x payment_status; Session & DiscoveryCall are cyclic; Cohort is branching
  relationship_patterns:
    - one_to_many
    - many_to_many                 # CohortMembership junction between Cohort and Client/Enrollment
    - cross_aggregate              # Session references Enrollment and Coach across aggregates
  role_model: hierarchical_override # PlatformAdmin superset + PracticeManager operations; segregation_of_duties on credential verification
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Coach full name" }
      - { name: email, type: string, source: input, description: "Coach email; unique across coaches" }
      - { name: credential_level, type: enum, source: input, description: "ICF credential level: ACC | PCC | MCC", constraints: "enum {ACC, PCC, MCC}" }
      - { name: credential_expires_on, type: string, source: input, description: "ICF credential expiry date, ISO 8601 date (YYYY-MM-DD); credential is CURRENT on days strictly before this date" }
      - { name: credential_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | EXPIRED | REVOKED; initial PENDING_VERIFICATION" }
      - { name: ethics_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE. SUSPENDED blocks all coaching delivery" }
      - { name: max_concurrent_clients, type: integer, source: input, description: "Maximum concurrently ACTIVE enrollments this coach will accept; must be >= 1" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full name" }
      - { name: email, type: string, source: input, description: "Client email; unique across clients" }
      - { name: timezone, type: string, source: input, description: "IANA timezone used to render policy deadlines for this client" }
      - { name: client_status, type: enum, source: system, description: "ACTIVE only (no archival flow in this surface); initial ACTIVE", constraints: "enum {ACTIVE}" }
      - { name: engagement_score, type: integer, source: computed, description: "0..100 engagement score from calc client_engagement_score; recomputed on every HabitCheckIn or Session terminal transition" }

  - name: ProgramTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: string, source: input, description: "Unique tier code (e.g. PKG-8)" }
      - { name: tier_type, type: enum, source: input, description: "SINGLE | PACKAGE | MEMBERSHIP", constraints: "enum {SINGLE, PACKAGE, MEMBERSHIP}" }
      - { name: session_count, type: integer, source: input, description: "Total sessions the tier grants; must be >= 1" }
      - { name: price_cents, type: integer, source: input, description: "Full program price in cents; must be >= 0" }
      - { name: duration_days, type: integer, source: input, description: "Program validity window in days from enrollment activation; must be >= 1" }
      - { name: installment_count_allowed, type: integer, source: input, description: "Maximum installments a payment plan may split into for this tier; 1 means pay-in-full only; must be >= 1" }
      - { name: reschedule_cap, type: integer, source: input, description: "Maximum counted (late) reschedules per enrollment under this tier; must be >= 0" }
      - { name: tier_status, type: enum, source: system, description: "ACTIVE | RETIRED; initial ACTIVE. RETIRED tiers cannot accept new enrollments" }

  - name: DiscoveryCall
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the prospective client" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; the coach taking the discovery call" }
      - { name: scheduled_start, type: datetime, source: input, description: "Call start, ISO 8601 UTC" }
      - { name: duration_minutes, type: integer, source: input, description: "Call length in minutes; must be >= 15" }
      - { name: call_status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED; initial SCHEDULED" }

  - name: FitAssessment
    parent: null
    common_fields: false
    fields:
      - { name: discovery_call_id, type: string, source: input, description: "FK -> DiscoveryCall.id; exactly one FitAssessment per DiscoveryCall" }
      - { name: scope_fit, type: enum, source: input, description: "WITHIN_SCOPE | OUTSIDE_SCOPE — ICF ethics screen: coaching vs therapy/clinical referral", constraints: "enum {WITHIN_SCOPE, OUTSIDE_SCOPE}" }
      - { name: commitment_score, type: integer, source: input, description: "Assessor-rated commitment 0..100" }
      - { name: outcome, type: enum, source: computed, description: "PROCEED | REFER_OUT; computed at creation: OUTSIDE_SCOPE forces REFER_OUT, WITHIN_SCOPE forces PROCEED" }
      - { name: assessor_coach_id, type: string, source: system, description: "FK -> Coach.id; set to acting coach; MUST differ from DiscoveryCall.coach_id (segregation of duties: the selling coach does not grade fit)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; coach of record for the whole enrollment" }
      - { name: program_tier_id, type: string, source: input, description: "FK -> ProgramTier.id" }
      - { name: discovery_call_id, type: string, source: input, description: "FK -> DiscoveryCall.id; that call's FitAssessment.outcome must be PROCEED" }
      - { name: lifecycle_status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | PAUSED | COMPLETED | CANCELLED | REFUNDED; initial PENDING_PAYMENT" }
      - { name: payment_status, type: enum, source: system, description: "Parallel dimension to lifecycle_status: CURRENT | DELINQUENT | DEFAULTED; initial CURRENT. DELINQUENT <-> CURRENT cycle allowed; DEFAULTED blocks scheduling" }
      - { name: activated_at, type: datetime, source: system, description: "Set when lifecycle becomes ACTIVE; null until then; program window = [activated_at, activated_at + duration_days)" }
      - { name: sessions_total, type: integer, source: system, description: "Copied from ProgramTier.session_count at creation" }
      - { name: sessions_total_price_basis, type: integer, source: system, description: "Copied from ProgramTier.price_cents at creation; the list-price basis used by refund PRO_RATA and installment_schedule (immune to later tier price edits)" }
      - { name: sessions_consumed, type: integer, source: computed, description: "Count of Sessions in COMPLETED or NO_SHOW for this enrollment" }
      - { name: sessions_remaining, type: integer, source: computed, description: "sessions_total - sessions_consumed - count(Sessions in SCHEDULED) - count(Sessions in FORFEITED) for this enrollment; CANCELLED sessions return their credit" }
      - { name: late_reschedules_used, type: integer, source: system, description: "Count of reschedules that violated the free window; compared against tier reschedule_cap" }
      - { name: pauses_used, type: integer, source: system, description: "Count of completed ACTIVE->PAUSED transitions" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of Installment.amount_cents for this enrollment with status PAID" }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of RefundRequest.amount_cents with status APPROVED for this enrollment" }

  - name: Installment
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: sequence_no, type: integer, source: system, description: "1-based position in the payment plan" }
      - { name: amount_cents, type: integer, source: computed, description: "From calc installment_schedule: equal split, remainder onto LAST installment" }
      - { name: due_on, type: string, source: computed, description: "ISO date; installment k due activated_at + (k-1)*30 days" }
      - { name: installment_status, type: enum, source: system, description: "PENDING | PAID | LATE; initial PENDING" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: coach_id, type: string, source: computed, description: "FK -> Coach.id; copied from Enrollment.coach_id at booking" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start, ISO 8601 UTC" }
      - { name: duration_minutes, type: integer, source: input, description: "Session length; 30..120 inclusive" }
      - { name: buffer_minutes, type: integer, source: system, description: "Post-session buffer for overlap detection, fixed constant BUFFER_MINUTES=15" }
      - { name: session_status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED | FORFEITED; initial SCHEDULED. A reschedule is expressed as the old session CANCELLED with successor_session_id pointing at the new SCHEDULED session" }
      - { name: successor_session_id, type: string, source: system, description: "FK -> Session.id; set on the old session when a reschedule creates its replacement; null otherwise" }
      - { name: is_late_reschedule, type: boolean, source: system, description: "True when this session was created by a reschedule inside the 24h free window" }
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; null for 1:1 sessions", constraints: "nullable" }

  - name: Goal
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: title, type: string, source: input, description: "Goal title" }
      - { name: target_count, type: integer, source: input, description: "Target number of habit check-ins; must be >= 1" }
      - { name: goal_status, type: enum, source: system, description: "OPEN | ACHIEVED | ABANDONED; initial OPEN" }
      - { name: achieved_count, type: integer, source: computed, description: "Count of HabitCheckIn rows for this goal with completed=true" }

  - name: HabitCheckIn
    parent: null
    common_fields: false
    fields:
      - { name: goal_id, type: string, source: input, description: "FK -> Goal.id" }
      - { name: check_in_date, type: string, source: input, description: "ISO date this check-in attests to; at most one check-in per (goal_id, check_in_date)" }
      - { name: completed, type: boolean, source: input, description: "Whether the habit was completed that day" }

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; facilitating coach" }
      - { name: title, type: string, source: input, description: "Cohort title" }
      - { name: capacity, type: integer, source: input, description: "Max CohortMembership rows with member_status=ACTIVE; must be >= 2" }
      - { name: window_start, type: string, source: input, description: "ISO date; cohort programming window start (closed)" }
      - { name: window_end, type: string, source: input, description: "ISO date; cohort window end (closed, inclusive)" }
      - { name: cohort_status, type: enum, source: system, description: "DRAFT | OPEN | IN_PROGRESS | COMPLETED | CANCELLED; initial DRAFT" }

  - name: CohortMembership
    parent: null
    common_fields: false
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment must be lifecycle ACTIVE" }
      - { name: member_status, type: enum, source: system, description: "ACTIVE | WAITLISTED | REMOVED; initial ACTIVE if capacity available else WAITLISTED" }
      - { name: joined_at, type: datetime, source: system, description: "Server timestamp of membership creation; used as waitlist promotion order (created_at ASC)" }

  - name: Testimonial
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; at most one Testimonial per enrollment" }
      - { name: outcome_rating, type: integer, source: input, description: "Outcome rating 1..5" }
      - { name: body_text, type: string, source: input, description: "Testimonial text" }
      - { name: consent_status, type: enum, source: system, description: "PENDING | CONSENTED | DECLINED | REVOKED; initial PENDING" }
      - { name: publish_status, type: enum, source: system, description: "HIDDEN | PUBLISHED; initial HIDDEN; PUBLISHED requires consent_status=CONSENTED" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: requested_by_role, type: string, source: system, description: "Role that filed the request (Client or PracticeManager)" }
      - { name: basis, type: enum, source: computed, description: "COOLING_OFF | PRO_RATA; chosen by calc refund_amount from days elapsed since activated_at" }
      - { name: amount_cents, type: integer, source: computed, description: "From calc refund_amount; 2 variants produce different values for identical inputs" }
      - { name: refund_status, type: enum, source: system, description: "PENDING | APPROVED | DENIED; initial PENDING" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Coach
    initial_state: PENDING_VERIFICATION
    terminal_states: []                       # REVOKED is terminal for credential but the row remains queryable
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /coaching/coaches/{id}/verify-credential"
        actor: PracticeManager
        preconditions:
          - "Coach.credential_status == PENDING_VERIFICATION"
          - "Acting PracticeManager's X-User-ID != any Coach id (opaque role; segregation of duties is structural)"
          - "Coach.credential_expires_on > current UTC date"
        side_effects:
          - "Coach.credential_status := VERIFIED; Coach.version += 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system date-advance: current UTC date >= Coach.credential_expires_on"
        actor: system
        preconditions:
          - "Coach.credential_status == VERIFIED"
        side_effects:
          - "Coach.credential_status := EXPIRED; Coach.version += 1"
          - "No session cascade: already-COMPLETED sessions unaffected; future SCHEDULED sessions remain but cannot be completed until re-verification (gated at completion time)"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /coaching/coaches/{id}/revoke-credential"
        actor: PracticeManager
        preconditions:
          - "Coach.credential_status == VERIFIED"
        side_effects:
          - "Coach.credential_status := REVOKED; Coach.version += 1"
          - "CASCADE (depth 1): every Session with coach_id=Coach.id and session_status=SCHEDULED -> CANCELLED (each Session.version += 1)"
          - "CASCADE (depth 2): for each cancelled Session, its Enrollment.sessions_consumed/sessions_remaining recomputed; Enrollment.version += 1"
          - "CASCADE (depth 3): each such Client.engagement_score recomputed via calc client_engagement_score (session terminal-count changed)"
      - from: ACTIVE_ETHICS
        to: SUSPENDED_ETHICS
        trigger: "POST /coaching/coaches/{id}/suspend-ethics"
        actor: PracticeManager
        preconditions:
          - "Coach.ethics_status == ACTIVE"
        side_effects:
          - "Coach.ethics_status := SUSPENDED; Coach.version += 1"
          - "CASCADE (depth 1): every Session with coach_id=Coach.id and session_status=SCHEDULED -> CANCELLED"
          - "CASCADE (depth 2): each affected Enrollment's sessions_remaining recomputed; Enrollment.version += 1"
          - "CASCADE (depth 3): every Cohort with coach_id=Coach.id and cohort_status IN {OPEN, IN_PROGRESS} -> CANCELLED; each Cohort's CohortMembership rows with member_status=ACTIVE or WAITLISTED -> REMOVED"
        note: "ethics_status is a second small parallel dimension on Coach (ACTIVE|SUSPENDED) orthogonal to credential_status"

  - entity: DiscoveryCall
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /coaching/discovery-calls/{id}/complete"
        actor: Coach
        preconditions:
          - "DiscoveryCall.call_status == SCHEDULED"
          - "Acting coach id == DiscoveryCall.coach_id"
          - "current UTC >= DiscoveryCall.scheduled_start"
        side_effects:
          - "DiscoveryCall.version += 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /coaching/discovery-calls/{id}/mark-no-show"
        actor: Coach
        preconditions:
          - "DiscoveryCall.call_status == SCHEDULED"
          - "current UTC >= DiscoveryCall.scheduled_start + duration_minutes"
        side_effects:
          - "DiscoveryCall.version += 1"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /coaching/discovery-calls/{id} (PUT reschedule)"
        actor: Client
        preconditions:
          - "DiscoveryCall.call_status == NO_SHOW"
          - "new scheduled_start > current UTC"
        side_effects:
          - "DiscoveryCall.scheduled_start := new value; DiscoveryCall.version += 1"
        note: "cyclic edge SCHEDULED->NO_SHOW->SCHEDULED makes this machine non-linear"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /coaching/discovery-calls/{id}/cancel"
        actor: Client
        preconditions:
          - "DiscoveryCall.call_status == SCHEDULED"
        side_effects:
          - "DiscoveryCall.version += 1"

  - entity: Enrollment
    initial_state: PENDING_PAYMENT
    terminal_states: [COMPLETED, CANCELLED, REFUNDED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /coaching/_payments/simulate with outcome=SUCCEEDED covering Installment sequence_no=1 (or full price when installment plan is pay-in-full)"
        actor: system
        preconditions:
          - "Enrollment.lifecycle_status == PENDING_PAYMENT"
          - "Coach.credential_status == VERIFIED and Coach.ethics_status == ACTIVE"
          - "count of Enrollments with coach_id=Enrollment.coach_id and lifecycle_status=ACTIVE < Coach.max_concurrent_clients"
        side_effects:
          - "Enrollment.lifecycle_status := ACTIVE; Enrollment.activated_at := current UTC; Enrollment.version += 1"
          - "Installment sequence_no=1 -> PAID; Enrollment.paid_cents recomputed"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /coaching/enrollments/{id}/pause"
        actor: Client
        preconditions:
          - "Enrollment.lifecycle_status == ACTIVE"
          - "expected_enrollment_version == Enrollment.version (OCC)"
          - "Enrollment.pauses_used < PAUSE_LIMIT (2)"
          - "Acting client id == Enrollment.client_id"
        side_effects:
          - "Enrollment.lifecycle_status := PAUSED; Enrollment.pauses_used += 1; Enrollment.version += 1"
          - "CASCADE (depth 1): every Session of this enrollment with session_status=SCHEDULED -> CANCELLED"
          - "CASCADE (depth 2): Enrollment.sessions_consumed/sessions_remaining recomputed"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /coaching/enrollments/{id}/resume"
        actor: Client
        preconditions:
          - "Enrollment.lifecycle_status == PAUSED"
          - "expected_enrollment_version == Enrollment.version (OCC)"
          - "Enrollment.payment_status == CURRENT"
          - "Coach.credential_status == VERIFIED and Coach.ethics_status == ACTIVE"
        side_effects:
          - "Enrollment.lifecycle_status := ACTIVE; Enrollment.version += 1"
          - "Program window is NOT extended: [activated_at, activated_at + duration_days) unchanged"
        note: "cyclic edge ACTIVE->PAUSED->ACTIVE (bounded by PAUSE_LIMIT)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: sessions_consumed == sessions_total (checked on every Session terminal transition)"
        actor: system
        preconditions:
          - "Enrollment.lifecycle_status == ACTIVE"
          - "Enrollment.sessions_consumed == Enrollment.sessions_total"
        side_effects:
          - "Enrollment.lifecycle_status := COMPLETED; Enrollment.version += 1"
          - "Bubble-up: every Goal of this enrollment with goal_status=OPEN remains OPEN (no auto-achieve); community access: CohortMembership rows for this enrollment with member_status=ACTIVE -> REMOVED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /coaching/enrollments/{id}/cancel"
        actor: Client
        preconditions:
          - "Enrollment.lifecycle_status IN {ACTIVE, PAUSED}"
          - "expected_enrollment_version == Enrollment.version (OCC)"
        side_effects:
          - "Enrollment.lifecycle_status := CANCELLED; Enrollment.version += 1"
          - "CASCADE (depth 1): every Session with session_status=SCHEDULED -> CANCELLED"
          - "CASCADE (depth 2): CohortMembership rows with member_status=ACTIVE -> REMOVED; waitlist promotion fires on affected Cohorts (see Cohort machine)"
          - "CASCADE (depth 2b): Enrollment.sessions_consumed/sessions_remaining recomputed"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /coaching/refund-requests/{id}/approve"
        actor: PracticeManager
        preconditions:
          - "RefundRequest.refund_status == PENDING"
          - "Enrollment.lifecycle_status IN {ACTIVE, PAUSED}"
        side_effects:
          - "RefundRequest.refund_status := APPROVED; RefundRequest.version += 1"
          - "CASCADE (depth 1): Enrollment.lifecycle_status := REFUNDED; Enrollment.refunded_cents recomputed; Enrollment.version += 1"
          - "CASCADE (depth 2): every Session with session_status=SCHEDULED -> CANCELLED"
          - "CASCADE (depth 3): CohortMembership rows for this enrollment -> REMOVED, and for each affected Cohort the earliest-WAITLISTED member (joined_at ASC tie-break created_at ASC) promotes to ACTIVE if capacity permits"
      - from: CURRENT_PAY
        to: DELINQUENT
        trigger: "system date-advance: any Installment with installment_status=PENDING has due_on < current UTC date"
        actor: system
        preconditions:
          - "Enrollment.payment_status == CURRENT"
        side_effects:
          - "Enrollment.payment_status := DELINQUENT; overdue Installments -> LATE; Enrollment.version += 1"
      - from: DELINQUENT
        to: CURRENT_PAY
        trigger: "POST /coaching/_payments/simulate paying all LATE installments (outcome=SUCCEEDED)"
        actor: system
        preconditions:
          - "Enrollment.payment_status == DELINQUENT"
        side_effects:
          - "All LATE Installments -> PAID; Enrollment.payment_status := CURRENT; Enrollment.paid_cents recomputed; Enrollment.version += 1"
        note: "payment_status dimension is a parallel cycle CURRENT<->DELINQUENT"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system date-advance: payment_status=DELINQUENT for >= GRACE_DAYS (14) consecutive days"
        actor: system
        preconditions:
          - "Enrollment.payment_status == DELINQUENT"
        side_effects:
          - "Enrollment.payment_status := DEFAULTED; Enrollment.version += 1"
          - "Session booking and completion are blocked while DEFAULTED"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, FORFEITED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /coaching/sessions/{id}/complete"
        actor: Coach
        preconditions:
          - "Session.session_status == SCHEDULED"
          - "Acting coach id == Session.coach_id"
          - "Coach.credential_status == VERIFIED and Coach.ethics_status == ACTIVE"
          - "Enrollment.lifecycle_status == ACTIVE and Enrollment.payment_status != DEFAULTED"
          - "current UTC >= Session.scheduled_start"
        side_effects:
          - "Session.session_status := COMPLETED; Session.version += 1"
          - "Enrollment.sessions_consumed recomputed; Enrollment.version += 1"
          - "Client.engagement_score recomputed via calc client_engagement_score"
          - "If Enrollment.sessions_consumed == Enrollment.sessions_total: Enrollment lifecycle -> COMPLETED (bubble-up)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /coaching/sessions/{id}/mark-no-show"
        actor: Coach
        preconditions:
          - "Session.session_status == SCHEDULED"
          - "current UTC >= Session.scheduled_start + duration_minutes"
        side_effects:
          - "Session.session_status := NO_SHOW (consumes a session credit); Session.version += 1"
          - "Enrollment.sessions_consumed recomputed; Enrollment.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /coaching/sessions/{id}/cancel"
        actor: Client
        preconditions:
          - "Session.session_status == SCHEDULED"
        side_effects:
          - "Session.session_status := CANCELLED (does NOT consume a credit); Session.version += 1"
          - "Enrollment.sessions_remaining recomputed; Enrollment.version += 1"
      - from: SCHEDULED
        to: RESCHEDULE_CYCLE
        trigger: "POST /coaching/sessions/{id}/reschedule"
        actor: Client
        preconditions:
          - "Session.session_status == SCHEDULED"
          - "Enrollment.lifecycle_status == ACTIVE"
          - "If current UTC < Session.scheduled_start - RESCHEDULE_FREE_HOURS (24h): free; else counted and Enrollment.late_reschedules_used < tier.reschedule_cap"
          - "New start must satisfy coach overlap rule (no colliding SCHEDULED session under [start, end+buffer) semantics)"
        side_effects:
          - "Old Session -> CANCELLED with successor_session_id := new Session.id"
          - "New Session created SCHEDULED; is_late_reschedule := (inside 24h window)"
          - "If late: Enrollment.late_reschedules_used += 1; Enrollment.version += 1"
        note: "SCHEDULED -> CANCELLED(successor) -> new SCHEDULED is the cyclic reschedule loop; the cycle is bounded by reschedule_cap for late moves"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "system date-advance: current UTC >= Enrollment.activated_at + duration_days while session still SCHEDULED"
        actor: system
        preconditions:
          - "Session.session_status == SCHEDULED"
          - "current UTC >= Enrollment.activated_at + duration_days (program window closed with the session undelivered)"
        side_effects:
          - "Session.session_status := FORFEITED; Session.version += 1"
          - "Enrollment.sessions_remaining recomputed per its pinned definition (FORFEITED sessions reduce remaining without counting as consumed)"

  - entity: Cohort
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /coaching/cohorts/{id}/open"
        actor: Coach
        preconditions:
          - "Cohort.cohort_status == DRAFT"
          - "Acting coach id == Cohort.coach_id"
        side_effects:
          - "Cohort.version += 1"
      - from: OPEN
        to: IN_PROGRESS
        trigger: "system date-advance: current UTC date >= Cohort.window_start"
        actor: system
        preconditions:
          - "Cohort.cohort_status == OPEN"
        side_effects:
          - "Cohort.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system date-advance: current UTC date > Cohort.window_end"
        actor: system
        preconditions:
          - "Cohort.cohort_status == IN_PROGRESS"
        side_effects:
          - "Cohort.version += 1"
          - "CohortMembership rows with member_status=WAITLISTED -> REMOVED (program over)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /coaching/cohorts/{id}/cancel"
        actor: Coach
        preconditions:
          - "Cohort.cohort_status IN {OPEN, IN_PROGRESS}"
        side_effects:
          - "Cohort.version += 1"
          - "CASCADE: all CohortMembership rows with member_status IN {ACTIVE, WAITLISTED} -> REMOVED"
          - "CASCADE: all Session rows with cohort_id=Cohort.id and session_status=SCHEDULED -> CANCELLED"

  - entity: CohortMembership
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: NONE
        to: ACTIVE_OR_WAITLISTED
        trigger: "POST /coaching/cohorts/{id}/members"
        actor: Coach
        preconditions:
          - "Cohort.cohort_status IN {OPEN, IN_PROGRESS}"
          - "Enrollment.lifecycle_status == ACTIVE"
          - "No existing CohortMembership for (cohort_id, enrollment_id) with member_status != REMOVED"
        side_effects:
          - "If count(member_status=ACTIVE) < Cohort.capacity: new member ACTIVE; else WAITLISTED"
      - from: WAITLISTED
        to: ACTIVE
        trigger: "system promotion: an ACTIVE member leaves (REMOVED) and count(ACTIVE) < capacity"
        actor: system
        preconditions:
          - "Cohort.cohort_status IN {OPEN, IN_PROGRESS}"
        side_effects:
          - "Promote exactly one WAITLISTED member: lowest joined_at ASC, tie-break created_at ASC"
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /coaching/cohorts/{id}/members/{membership_id} or cascades (enrollment cancel/refund, cohort cancel)"
        actor: Coach
        preconditions:
          - "CohortMembership.member_status == ACTIVE"
        side_effects:
          - "member_status := REMOVED"
          - "If count(ACTIVE) < capacity and WAITLISTED non-empty: promote per WAITLISTED->ACTIVE rule"

  - entity: Testimonial
    initial_state: PENDING
    terminal_states: []                       # REVOKED consent still allows re-consent cycle
    transitions:
      - from: PENDING
        to: CONSENTED
        trigger: "POST /coaching/testimonials/{id}/consent"
        actor: Client
        preconditions:
          - "Testimonial.consent_status == PENDING"
          - "Acting client id == Enrollment.client_id of linked enrollment"
        side_effects:
          - "Testimonial.version += 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /coaching/testimonials/{id}/decline"
        actor: Client
        preconditions:
          - "Testimonial.consent_status == PENDING"
        side_effects:
          - "Testimonial.version += 1"
      - from: CONSENTED
        to: PUBLISHED_DIM
        trigger: "POST /coaching/testimonials/{id}/publish"
        actor: PracticeManager
        preconditions:
          - "Testimonial.consent_status == CONSENTED"
          - "Testimonial.publish_status == HIDDEN"
          - "Enrollment.lifecycle_status IN {COMPLETED, ACTIVE} (REFUNDED/CANCELLED enrollments may not be published)"
        side_effects:
          - "publish_status := PUBLISHED; Testimonial.version += 1"
        note: "publish operates on the parallel publish_status dimension, not consent_status"
      - from: CONSENTED
        to: REVOKED
        trigger: "POST /coaching/testimonials/{id}/revoke-consent"
        actor: Client
        preconditions:
          - "Testimonial.consent_status == CONSENTED"
        side_effects:
          - "consent_status := REVOKED; publish_status := HIDDEN (compensation: unpublish); Testimonial.version += 1"
      - from: REVOKED
        to: CONSENTED
        trigger: "POST /coaching/testimonials/{id}/consent"
        actor: Client
        preconditions:
          - "Testimonial.consent_status == REVOKED"
        side_effects:
          - "consent_status := CONSENTED (publish_status stays HIDDEN; must re-publish explicitly)"
        note: "cyclic consent edge CONSENTED->REVOKED->CONSENTED"

  - entity: Goal
    initial_state: OPEN
    terminal_states: [ACHIEVED, ABANDONED]
    transitions:
      - from: OPEN
        to: ACHIEVED
        trigger: "system: achieved_count >= target_count evaluated on each HabitCheckIn creation"
        actor: system
        preconditions:
          - "Goal.goal_status == OPEN"
          - "Goal.achieved_count >= Goal.target_count (inclusive boundary)"
        side_effects:
          - "Goal.version += 1"
      - from: OPEN
        to: ABANDONED
        trigger: "POST /coaching/goals/{id}/abandon"
        actor: Client
        preconditions:
          - "Goal.goal_status == OPEN"
          - "Acting client owns the goal's enrollment"
        side_effects:
          - "Goal.version += 1"

  - entity: ProgramTier
    initial_state: ACTIVE
    terminal_states: []                        # RETIRED is absorbing for new enrollments but the row remains queryable
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /coaching/program-tiers/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "ProgramTier.tier_status == ACTIVE"
        side_effects:
          - "ProgramTier.version += 1"
          - "Existing enrollments on this tier are untouched; only new enrollment creation is blocked"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-pause-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /coaching/enrollments/{id}/pause"
    occ_field: "expected_enrollment_version"
    description: |
      Pausing an Enrollment whose version has advanced since the client last
      observed it is rejected. The client's view of pauses_used / lifecycle is
      stale; the request must be re-issued against a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enrollment-cancel-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /coaching/enrollments/{id}/cancel"
    occ_field: "expected_enrollment_version"
    description: |
      Cancelling an Enrollment whose version has advanced since the client last
      observed it is rejected; side effects such as session cascades may have
      already mutated the enrollment the caller believes it is cancelling.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: refund_amount
    trigger: "POST /coaching/refund-requests (compute basis + amount at filing time; snapshot stored on RefundRequest)"
    algorithm: threshold
    formula: |
      days_elapsed = (current_utc_date - Enrollment.activated_at.date()).days   # floor to whole days; activated_at required
      if days_elapsed <= COOLING_OFF_DAYS:          # variant COOLING_OFF
          amount = Enrollment.paid_cents - sessions_consumed * PER_SESSION_COOLING_OFF_CENTS
          # full refund of what was paid, less a flat per-session fee for sessions already consumed
      else:                                          # variant PRO_RATA
          gross_quote = pro_rata_session_value(Enrollment)   # delegation: tiered branch calc
          amount = min(gross_quote, Enrollment.paid_cents) - ADMIN_FEE_CENTS
          amount = max(amount, 0)
      # boundary: days_elapsed == COOLING_OFF_DAYS exactly => COOLING_OFF (<=, not <)
    input_set: "RefundRequest.enrollment; Enrollment must be lifecycle ACTIVE or PAUSED and activated_at non-null; Installments PAID feed paid_cents"
    constants:
      COOLING_OFF_DAYS: 14
      PER_SESSION_COOLING_OFF_CENTS: 7500
      ADMIN_FEE_CENTS: 5000
    precision: "integer cents; no rounding beyond the floor() in per_session_cents"
    variants:
      - name: COOLING_OFF
        when: "days_elapsed <= 14"
        difference: "Refunds what was actually PAID minus a flat per-consumed-session fee; ignores tier list price"
      - name: PRO_RATA
        when: "days_elapsed >= 15"
        difference: "Refunds unused-session value computed from tier list price (floor per-session), capped at paid_cents, minus flat admin fee; a partially-paid enrollment can receive less than COOLING_OFF would imply even with zero sessions consumed"

  - name: client_engagement_score
    trigger: "On every Session terminal transition (COMPLETED/NO_SHOW) and every HabitCheckIn creation, for the owning Client"
    algorithm: weighted_scoring
    formula: |
      # FINAL variant (stored on Client.engagement_score):
      #   window: trailing 28 days ending on current UTC date, inclusive both ends: [today-27, today]
      #   sessions_completed = count(Session s where s's enrollment.client_id == Client.id
      #                        and s.session_status == COMPLETED
      #                        and s.scheduled_start.date() in [today-27, today])
      #   habits_completed   = count(HabitCheckIn h join Goal g on h.goal_id == g.id
      #                        where g's enrollment.client_id == Client.id
      #                        and h.completed == true
      #                        and h.check_in_date in [today-27, today])
      final:       score = round_half_up(100 * (0.6 * sessions_completed / SESSIONS_EXPECTED_28
                                               + 0.4 * habits_completed  / 28))
      # PROVISIONAL variant (returned by GET /coaching/clients/{id}?score_variant=provisional):
      #   window: [anchor, today] where anchor = activated_at.date() of the client's most recently
      #   ACTIVATED enrollment (by activated_at DESC, tie-break created_at DESC); if days since
      #   anchor >= 28, the provisional window equals the final window and both variants agree.
      #   days_elapsed = min(28, (today - anchor).days + 1)
      #   counts recomputed over [today - days_elapsed + 1, today] with same status filters
      #   sessions_expected_elapsed = max(1, floor(SESSIONS_EXPECTED_28 * days_elapsed / 28))
      provisional: score = round_half_up(100 * (0.6 * sessions_completed / sessions_expected_elapsed
                                               + 0.4 * habits_completed  / days_elapsed))
      score = clamp(score, 0, 100)
    input_set: "Sessions in COMPLETED only (NO_SHOW excluded); HabitCheckIns with completed=true only; window [today-27, today] inclusive"
    constants:
      WINDOW_DAYS: 28
      W_SESSIONS: 0.6
      W_HABITS: 0.4
      SESSIONS_EXPECTED_28: 8
    precision: "integer 0..100, round_half_up"
    variants:
      - name: provisional
        when: "Computed for in-progress windows (today < window_close); denominator is days elapsed in window"
        difference: "Same raw counts, smaller denominator -> higher score early in the window than final"
      - name: final
        when: "Computed when the 28-day window has fully closed (monthly snapshot)"
        difference: "Denominator fixed at 28 -> identical counts yield a lower (or equal) score than provisional"

  - name: installment_schedule
    trigger: "POST /coaching/enrollments (creation with payment plan installment_count > 1)"
    algorithm: waterfall_allocation
    formula: |
      # Mode (b) nested rounding: per-installment floor, remainder allocated to the LAST installment.
      # Pin the order: compute base first, then distribute remainder; never round the total.
      base = floor(price_cents / installment_count)
      remainder = price_cents - base * installment_count
      for k in 1..installment_count-1: amount[k] = base
      amount[installment_count] = base + remainder
      due[k] = activated_date + (k-1)*30 days   # activated_date resolved at activation; schedule is stored as PENDING with due_on computed on activation
    input_set: "ProgramTier.price_cents and requested installment_count; requires installment_count <= ProgramTier.installment_count_allowed and installment_count >= 1"
    constants:
      INSTALLMENT_INTERVAL_DAYS: 30
    precision: "integer cents; floor division; remainder to LAST installment (not first)"

  - name: pro_rata_session_value
    trigger: "Used by refund_amount PRO_RATA variant and by ERR reporting on cancellation quotes"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction: tier_type branch x elapsed fraction x consumed fraction
      if ProgramTier.tier_type == SINGLE:
          value_per_remaining = 0                              # single sessions are consumed or nothing remains refundable
      elif ProgramTier.tier_type == PACKAGE:
          value_per_remaining = floor(price_cents / session_count)
      else:  # MEMBERSHIP
          days_total = duration_days
          days_left = max(0, (activated_at + duration_days) - current_utc).days
          value_per_remaining = floor(price_cents * days_left / days_total / max(1, session_count - sessions_consumed))
      quote = min(value_per_remaining * (session_count - sessions_consumed), paid_cents)
    input_set: "Enrollment + its ProgramTier; excludes sessions in FORFEITED from 'remaining'"
    constants: {}
    precision: "integer cents; floor at each division; order: prorate by time first, then divide by remaining sessions"

  - name: reschedule_policy_gate
    trigger: "POST /coaching/sessions/{id}/reschedule"
    algorithm: threshold
    formula: |
      seconds_before_start = Session.scheduled_start - current_utc
      is_late = seconds_before_start < RESCHEDULE_FREE_HOURS * 3600     # strictly less than 24h => counted
      # boundary: exactly 24*3600 seconds before start => FREE (uses < not <=)
      if is_late: require Enrollment.late_reschedules_used < ProgramTier.reschedule_cap
    input_set: "The one Session being rescheduled, its Enrollment, that tier's reschedule_cap"
    constants:
      RESCHEDULE_FREE_HOURS: 24
    precision: "second precision on the 24h boundary"

  - name: habit_streak_freeze
    trigger: "POST /coaching/goals/{id}/check-ins (duplicate or out-of-order dates)"
    algorithm: chronological
    formula: |
      # At most one check-in per (goal_id, check_in_date). A check-in for a date EARLIER than
      # the goal's max existing check_in_date is accepted only if it does not change achieved_count
      # ordering: process all check-ins for streak math in check_in_date ASC order, tie impossible (unique per date).
      # Goal -> ACHIEVED when achieved_count >= target_count (>= boundary; exactly target_count achieves).
      pass
    input_set: "HabitCheckIn rows for the goal, any completed value, ordered by check_in_date ASC"
    constants: {}
    precision: "date granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list; for entity_backed roles, X-User-ID must reference an existing row of that entity"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right (path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a lifecycle state that permits this operation (per §1.2 from-states and preconditions); booking a Session additionally requires the parent Enrollment lifecycle_status == ACTIVE; a HabitCheckIn requires its Goal goal_status == OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coaching/enrollments/{id}/pause, POST /coaching/enrollments/{id}/cancel"

  - priority: 6
    category: business_safety
    check: "ICF ethics & credentialing: coach.credential_status == VERIFIED and coach.ethics_status == ACTIVE before any delivery-side action (session complete, enrollment activation, resume, cohort open)"
    error_id: ERR_COACH_NOT_CREDENTIALED
    http_status: 422
    applies_to: "POST /coaching/sessions/{id}/complete, POST /coaching/_payments/simulate, POST /coaching/enrollments/{id}/resume, POST /coaching/cohorts/{id}/open"

  - priority: 7
    category: business_safety
    check: "Fit gate: Enrollment creation requires the referenced DiscoveryCall's FitAssessment.outcome == PROCEED; OUTSIDE_SCOPE (REFER_OUT) permanently blocks enrollment from that call"
    error_id: ERR_FIT_NOT_ESTABLISHED
    http_status: 422
    applies_to: "POST /coaching/enrollments"

  - priority: 8
    category: business_temporal
    check: "Temporal overlap (sessions): new/rescheduled Session for a coach is rejected when [new_start, new_start + duration + BUFFER_MINUTES) intersects any other SCHEDULED session's [start, start + duration + BUFFER_MINUTES) for the same coach; touching intervals (end == start) do NOT intersect (half-open, buffer-inclusive)"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /coaching/enrollments/{id}/sessions, POST /coaching/sessions/{id}/reschedule"

  - priority: 9
    category: business_temporal
    check: "Temporal overlap (discovery calls): a new DiscoveryCall for a coach is rejected when [new_start, new_start + duration] CLOSED interval intersects any other DiscoveryCall with call_status=SCHEDULED for the same coach under closed-interval semantics (touching endpoints DO intersect: end == start collides) and NO buffer is applied — deliberately different interval semantics from session overlap"
    error_id: ERR_DISCOVERY_CALL_OVERLAP
    http_status: 409
    applies_to: "POST /coaching/discovery-calls, PUT /coaching/discovery-calls/{id}"

  - priority: 10
    category: business_temporal
    check: "Program window: Session.scheduled_start must lie inside [Enrollment.activated_at, activated_at + duration_days)"
    error_id: ERR_OUTSIDE_PROGRAM_WINDOW
    http_status: 422
    applies_to: "POST /coaching/enrollments/{id}/sessions, POST /coaching/sessions/{id}/reschedule"

  - priority: 11
    category: business_temporal
    check: "Reschedule policy: late reschedule (inside 24h, per calc reschedule_policy_gate) requires late_reschedules_used < tier.reschedule_cap"
    error_id: ERR_RESCHEDULE_CAP_REACHED
    http_status: 422
    applies_to: "POST /coaching/sessions/{id}/reschedule"

  - priority: 12
    category: business_constraint
    check: "Session credit availability: Enrollment.sessions_remaining >= 1 before booking (boundary: booking is allowed when sessions_remaining == 1, rejected at 0)"
    error_id: ERR_NO_SESSIONS_REMAINING
    http_status: 422
    applies_to: "POST /coaching/enrollments/{id}/sessions"

  - priority: 13
    category: business_constraint
    check: "Coach capacity: count of ACTIVE enrollments for the coach < max_concurrent_clients before activation"
    error_id: ERR_COACH_CAPACITY_FULL
    http_status: 422
    applies_to: "POST /coaching/_payments/simulate (activation path), POST /coaching/enrollments"

  - priority: 14
    category: business_constraint
    check: "Cohort capacity: join when count(ACTIVE members) == capacity produces WAITLISTED, not an error; joins against cohort_status not in {OPEN, IN_PROGRESS} are rejected"
    error_id: ERR_COHORT_NOT_JOINABLE
    http_status: 409
    applies_to: "POST /coaching/cohorts/{id}/members"

  - priority: 15
    category: business_referential
    check: "Uniqueness: at most one FitAssessment per DiscoveryCall; at most one Testimonial per Enrollment; at most one HabitCheckIn per (goal_id, check_in_date); Client.email and Coach.email unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /coaching/discovery-calls/{id}/fit-assessment, POST /coaching/testimonials, POST /coaching/goals/{id}/check-ins, POST /coaching/clients, POST /coaching/coaches"

  - priority: 16
    category: business_referential
    check: "Segregation of duties: FitAssessment.assessor must differ from DiscoveryCall.coach_id (the selling coach may not grade fit); PracticeManager verifies credentials, never the coach themself"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /coaching/discovery-calls/{id}/fit-assessment, POST /coaching/coaches/{id}/verify-credential"

  - priority: 17
    category: business_referential
    check: "Tier joinability: ProgramTier.tier_status must be ACTIVE at enrollment creation; RETIRED tiers are referentially closed to new enrollments"
    error_id: ERR_TIER_RETIRED
    http_status: 422
    applies_to: "POST /coaching/enrollments"

  - priority: 18
    category: business_fiscal
    check: "Payment plan shape: requested installment_count between 1 and ProgramTier.installment_count_allowed inclusive"
    error_id: ERR_PAYMENT_PLAN_INVALID
    http_status: 422
    applies_to: "POST /coaching/enrollments"

  - priority: 19
    category: business_fiscal
    check: "Refund precondition: enrollment.lifecycle_status IN {ACTIVE, PAUSED} AND activated_at non-null AND paid_cents > 0 AND no prior RefundRequest with refund_status=APPROVED for the same enrollment"
    error_id: ERR_REFUND_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /coaching/refund-requests"

  - priority: 20
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, integer ranges honored (duration_minutes 30..120, outcome_rating 1..5, capacity >= 2, target_count >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving infrastructure ----
  - method: POST
    path: /coaching/_clock/set_current_utc
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date-advance system transitions evaluate against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["re-evaluate all date-advance transitions (Coach EXPIRED, Enrollment delinquency/default, Cohort OPEN->IN_PROGRESS->COMPLETED, Session FORFEITED)"]

  - method: POST
    path: /coaching/_payments/simulate
    description: "Simulate a payment event against an Enrollment: pays the next due Installment (or all LATE installments when settling delinquency). outcome=SUCCEEDED applies payment side effects including activation; outcome=FAILED leaves state unchanged."
    roles: [PlatformAdmin, PracticeManager]
    code: 200
    input: [enrollment_id, outcome]
    output: Enrollment
    side_effects: ["Installment transitions PENDING->PAID or LATE->PAID; Enrollment activation or payment_status recovery; Enrollment.version += 1 on any mutation"]

  # ---- Coach ----
  - method: POST
    path: /coaching/coaches
