  - section: endpoints
    instances:
      - name: ops_run_envelope_reports_each_sweep_counter_independently
        claim_type: bulk_action
        grounds:
          - endpoints[POST /rewards/ops-runs]
          - state_machines.EarningCategoryRotation.SCHEDULED_to_ACTIVE
          - state_machines.TransferBonusEvent.SCHEDULED_to_RUNNING
          - state_machines.TransferBonusEvent.RUNNING_to_CLOSED
        distinguishing_aspect: "The ops-run response is a per-machine counter envelope, not a single total: a run with nothing due returns every counter 0 with clock_utc echoing the clock, the run at 2026-09-01T00:00:00Z reports rotations_activated 1 and bonus_events_opened 1 in the same envelope while every other counter stays 0, and the run at 2026-09-11T00:00:00Z reports bonus_events_closed 1 with rotations_expired still 0 because the rotation window runs to 2026-10-01."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, one SCHEDULED rotation over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), and one SCHEDULED bonus event over the closed window [2026-09-01T00:00:00Z, 2026-09-10T00:00:00Z] on an ACTIVE agreement."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "SEPT-GROCERY", bonus_multiplier: 2.0, capped_spend_cents: 50000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rot_id: $.data.id }
            - call: "POST /rewards/rotations/${rot_id}/publish"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Skyward Miles", partner_program_code: "SKYW", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 48, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/bonus-events"
              payload: { partner_agreement_id: "${pa_id}", event_code: "SEPT-BOOST", bonus_bps: 3000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", cap_points_per_account: 50000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the first ops-run returns rotations_activated 0, rotations_expired 0, bonus_events_opened 0, bonus_events_closed 0, notices_made_effective 0, grandfather_windows_matured 0, transfers_completed 0, entitlements_expired 0 and clock_utc 2026-08-01T00:00:00Z"
            - "the second ops-run returns rotations_activated 1, bonus_events_opened 1 and clock_utc 2026-09-01T00:00:00Z with every other counter 0"
            - "EarningCategoryRotation.${rot_id}.status == ACTIVE and activated_at == 2026-09-01T00:00:00Z"
            - "TransferBonusEvent.${ev_id}.status == RUNNING and opened_at == 2026-09-01T00:00:00Z"
            - "the third ops-run returns bonus_events_closed 1, bonus_events_opened 0, rotations_expired 0 and clock_utc 2026-09-11T00:00:00Z"
            - "TransferBonusEvent.${ev_id}.status == CLOSED and closed_at == 2026-09-11T00:00:00Z"
            - "EarningCategoryRotation.${rot_id}.status == ACTIVE and expired_at == null"

      - name: clock_read_returns_the_mandatory_default_before_any_set
        claim_type: computed_read
        grounds:
          - endpoints[GET /rewards/_clock]
          - endpoints[POST /rewards/_clock/set_current_utc]
        distinguishing_aspect: "On a fresh database GET /rewards/_clock returns exactly 2026-08-01T00:00:00Z without any set call, every role may read it, and a set call moves it so the next read reports the new instant."
        test_recipe:
          setup:
            - "Empty database; no clock call has been made."
          setup_api_calls: []
          trigger:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/_clock"
              as: Cardholder
              as_user_id: "cardholder-unknown-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-12-25T06:30:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/_clock"
              as: FraudAnalyst
              as_user_id: "fraud-1"
          assert:
            - "the first read returns 200 with current_utc 2026-08-01T00:00:00Z"
            - "the Cardholder read returns 200 with current_utc 2026-08-01T00:00:00Z"
            - "the set call returns 200 with current_utc 2026-12-25T06:30:00Z"
            - "the FraudAnalyst read returns 200 with current_utc 2026-12-25T06:30:00Z"

      - name: reinstating_a_cascade_suspended_offer_under_a_suspended_agency_rejected
        claim_type: conditional_action
        grounds:
          - state_machines.PortalInventoryOffer.SUSPENDED_to_OPEN
          - validations[priority=45]
          - errors.ERR_AGENCY_SUSPENDED
        distinguishing_aspect: "reinstate is guarded by the parent agency's state, so an offer that was suspended only as a cascade of its agency's suspension cannot be revived while that agency is still SUSPENDED: the call returns 409 ERR_AGENCY_SUSPENDED and suspension_reason stays AGENCY_SUSPENDED."
        test_recipe:
          setup:
            - "One agency with two OPEN offers, then suspended, which cascades both offers to SUSPENDED with suspension_reason AGENCY_SUSPENDED."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Northwind Travel", contracted_markup_bps: 2000, parity_tolerance_bps: 1000, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "LAX-NRT-33", depart_at: "2026-11-11T11:00:00Z", return_at: "2026-11-25T21:00:00Z", net_rate_cents: 40000, agency_public_price_cents: 50000, agency_public_seats: 3, portal_seats: 2, tax_cents: 4000 }
              as: AgencySupplier
