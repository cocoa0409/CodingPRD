            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Dittany Hill", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "${err} == ERR_MIN_STAFF_UNMET"
            - "after hiring the grip: Production.${prod_id}.status == IN_PRODUCTION (exactly-minimum staffing passes)"

  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /union-compliance/producer-companies"
              payload: { legal_name: "No Auth LLC", fein: "20-0000030" }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: missing_auth_on_unknown_resource_returns_unauthenticated
        claim_type: priority_ordering
        grounds:
          - "validations[priority=1]"
          - "validations[priority=5]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "Dual failure (no auth headers AND non-existent production id) resolves to the priority-1 error ERR_UNAUTHENTICATED, not ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /union-compliance/productions/00000000-0000-0000-0000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: cross_company_bond_post_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "roles.ProducerRep"
        distinguishing_aspect: "ProducerRep acting with company B's id cannot post the bond of company A's production: ERR_NOT_RESOURCE_OWNER (entity-backed ownership check)."
        test_recipe:
          setup: ["company A SIGNATORY with ULB production REGISTERED (bond PENDING); company B exists (PENDING)"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Eglantine A LLC", fein: "20-0000031" }, as: ProducerRep, captures: { co_a: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_a}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_a}", captures: { app_a: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_a}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_a}" }
            - { call: "POST /union-compliance/signatory-applications/${app_a}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_a}", title: "Eglantine A1", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_a}", captures: { prod_a: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_a}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_a}", captures: { bond_a: "$.data[0].id" } }
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Eglantine B LLC", fein: "20-0000032" }, as: ProducerRep, captures: { co_b: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/bonds/${bond_a}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_b}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER"
            - "Bond.${bond_a}.status == PENDING (unchanged)"

      - name: same_unionrep_propose_after_intake_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=27]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.Grievance.INVESTIGATING_to_PROPOSED_SETTLEMENT"
        distinguishing_aspect: "Segregation of duties: the UnionRep user who accepted intake (ur_1) cannot propose the settlement — ERR_SEGREGATION_OF_DUTIES (403), while a different UnionRep (ur_2) succeeds."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING; grievance INVESTIGATING with intake_user_id == ur_1"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Fumitory LLC", fein: "20-0000033" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Fume Story", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_id}", category: "PAY", incident_date: "2026-07-20", description: "Missing meal penalties" }, as: UnionRep, as_user_id: "ur_1", captures: { grv_id: $.data.id } }
            - { call: "POST /union-compliance/grievances/${grv_id}/accept-intake", payload: {}, as: UnionRep, as_user_id: "ur_1", captures: { grv_v: $.data.version } }
          trigger:
            - { call: "POST /union-compliance/grievances/${grv_id}/propose-settlement", payload: { proposal_amount_cents: 50000, expected_grievance_version: "${grv_v}" }, as: UnionRep, as_user_id: "ur_1", captures: { err: $.data.error_id } }
            - { call: "POST /union-compliance/grievances/${grv_id}/propose-settlement", payload: { proposal_amount_cents: 50000, expected_grievance_version: "${grv_v}" }, as: UnionRep, as_user_id: "ur_2" }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "after ur_2's proposal: Grievance.${grv_id}.status == PROPOSED_SETTLEMENT and proposal_amount_cents == 50000"

      - name: audit_close_by_opening_trustee_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=27]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.Audit.FINDINGS_ISSUED_to_CLOSED"
        distinguishing_aspect: "Segregation of duties on the audit side: the FundTrustee who opened the audit (ft_1) cannot close it — ERR_SEGREGATION_OF_DUTIES; a different trustee (ft_2) succeeds."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING; audit opened by ft_1 (scope [1])"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Gromwell LLC", fein: "20-0000034" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "TELEVISION", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Gromwell Field", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/audits", payload: { production_id: "${prod_id}", scope_period_indices: [ 1 ] }, as: FundTrustee, as_user_id: "ft_1", captures: { audit_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/audits/${audit_id}/close", payload: {}, as: FundTrustee, as_user_id: "ft_1", captures: { err: $.data.error_id } }
            - { call: "POST /union-compliance/audits/${audit_id}/close", payload: {}, as: FundTrustee, as_user_id: "ft_2" }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "after ft_2's close: Audit.${audit_id}.status == CLOSED and closed_by_user_id == ft_2"

      - name: duplicate_report_period_rejected_then_freed_by_rejection
        claim_type: violation_to_error
        grounds:
          - "validations[priority=25]"
          - "errors[ERR_DUPLICATE_REPORT_PERIOD]"
          - "state_machines.ContributionReport.SUBMITTED_to_REJECTED"
        distinguishing_aspect: "A second report for (production, period 1) collides with the existing DRAFT (ERR_DUPLICATE_REPORT_PERIOD); after the first is submitted and REJECTED, the same period AND the same log can be reused in a replacement report."
        test_recipe:
