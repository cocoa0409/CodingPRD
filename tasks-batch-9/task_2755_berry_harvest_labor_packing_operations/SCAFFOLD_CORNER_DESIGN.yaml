            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-04T18:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 300.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 60, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T09:00:00Z", field_pulp_temp_f: 68.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot_a: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "B", clamshell_count: 40, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T10:00:00Z", field_pulp_temp_f: 68.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
