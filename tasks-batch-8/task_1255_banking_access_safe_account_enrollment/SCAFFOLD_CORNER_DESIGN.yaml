            - { call: "POST /api/participants", payload: { full_name: "Dana Whitfield", date_of_birth: "1982-02-19", contact_zip: "90003", prior_banking_record: "FLAGGED", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Ben Okafor", date_of_birth: "1985-11-02", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2: $.data.id } }
