          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "Enrollment ACTIVE with an ACTIVE care plan on a care manager with capacity_points 20.0."
            - "One SCHEDULED touch occupies 2026-08-10T09:00:00Z to 2026-08-10T09:30:00Z."
