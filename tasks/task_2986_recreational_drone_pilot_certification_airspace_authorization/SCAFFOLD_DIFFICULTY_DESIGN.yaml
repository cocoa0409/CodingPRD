            - call: "GET /drone-ops/pilots/${pid}/flight-summary"
              payload: { window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: ComplianceOfficer
              captures: { count_exclusive: $.data.completed_flight_count, avg_exclusive: $.data.average_duration_minutes, max_exclusive: $.data.max_altitude_reached_ft }
          assert:
            - "${count_inclusive} == 1 - the lower bound is inclusive, so actual_end == window_start is inside the window - with total_logged_minutes 60, max_altitude_reached_ft 385, incident_flight_count 0, exceedance_flight_count 0"
            - "${avg_inclusive} == 60.0"
            - "${count_exclusive} == 0 - the upper bound is exclusive, so the same flight with actual_end == window_end is outside"
            - "${avg_exclusive} == 0.0 and ${max_exclusive} == 0, both present in the body and neither null"
            - "on the empty window total_logged_minutes, incident_flight_count and exceedance_flight_count are all 0, and the response echoes window_start \"2026-08-09T00:00:00Z\" and window_end \"2026-08-10T10:00:00Z\""
            - "Flight.${fid}.logged_minutes == 60 and Flight.${fid}.altitude_exceedance == false (385 <= BASE_CEILING_FT 400)"
            - "an implementation that makes both bounds inclusive returns 1 for the second window; one that divides by a zero count crashes instead of returning 0.0"

