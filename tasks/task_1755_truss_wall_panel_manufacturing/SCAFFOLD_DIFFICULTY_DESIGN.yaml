  - rule_id: non_linear_state_machine
    instances:
      - name: design_seal_rejection_cycle
        grounds:
          - state_machines.ComponentDesign.DRAFT_to_SEAL_REQUESTED
          - state_machines.ComponentDesign.SEAL_REQUESTED_to_DRAFT
          - state_machines.ComponentDesign.SEAL_REQUESTED_to_SEALED
        distinguishing_aspect: |
          ComponentDesign is cyclic: SEAL_REQUESTED -> DRAFT rejection loop resets
          submitted_by_engineer_id, and the re-submission may flip the submitter so
          the FIRST engineer can seal the second's submission (segregation enforced
          per round, not per component).
        test_recipe:
          setup:
            - "Job confirmed; design TR-CYC created by eng1"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 100000000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Cycle Job", jobsite_address: "4 Birch Way", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-CYC", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
          trigger:
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "DRAFT" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "GET /plant/designs/${dsg}", as: PlantManager }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng1}" }
          assert:
            - "after reject: ComponentDesign.${dsg}.status == DRAFT and submitted_by_engineer_id == null (loop reset)"
            - "after resubmit by eng2: submitted_by_engineer_id == ${eng2}"
            - "final: ComponentDesign.${dsg}.status == SEALED and sealed_by_engineer_id == ${eng1} and revision_no == 1"
            - "Job.${job}.posture == GREEN (no SEAL_REQUESTED outstanding after final seal)"

