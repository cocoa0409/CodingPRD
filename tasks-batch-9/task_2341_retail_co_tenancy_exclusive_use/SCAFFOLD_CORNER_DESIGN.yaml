# Scaffold Corner Design (SKILL.md §1.9) for task_2341_retail_co_tenancy_exclusive_use
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# excluded_because stubs cite §1.8 instances in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
scaffold_corner_design:
- section: entities
  instances:
  - name: center_creation_returns_all_declared_fields
    claim_type: creation
    grounds:
    - entities.ShoppingCenter
    - endpoints[POST /centers]
    - calculations.center_posture_derivation
    distinguishing_aspect: A center created with no leases at all is COMPLIANT, not FROZEN, because center_posture_derivation gates both occupancy rungs on the `assessable` predicate; every computed counter
      starts at zero.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      trigger:
      - call: POST /centers
        payload:
          name: Northgate Crossing
          total_gla_sqft: 300000
          occupancy_grace_days: 30
        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr: $.data.id
      assert:
      - response.http_status == 201
      - response.response_type == object
      - ShoppingCenter.${ctr}.name == Northgate Crossing
      - ShoppingCenter.${ctr}.total_gla_sqft == 300000
      - ShoppingCenter.${ctr}.occupancy_grace_days == 30
      - ShoppingCenter.${ctr}.occupied_gla_sqft == 0
      - ShoppingCenter.${ctr}.open_occupancy_pct == 0.00
      - ShoppingCenter.${ctr}.operating_store_count == 0
      - ShoppingCenter.${ctr}.open_anchor_count == 0
      - ShoppingCenter.${ctr}.protected_exclusive_count == 0
      - ShoppingCenter.${ctr}.aggregate_effective_rent_cents == 0
      - ShoppingCenter.${ctr}.open_violation_count == 0
      - ShoppingCenter.${ctr}.compliance_posture == COMPLIANT
      - ShoppingCenter.${ctr}.redevelopment_status == NONE
      - ShoppingCenter.${ctr}.last_sweep_at == null
      - ShoppingCenter.${ctr}.version == 1
  - name: center_omitted_occupancy_grace_days_defaults_to_ninety
    claim_type: defaults
    grounds:
    - entities.ShoppingCenter.fields.occupancy_grace_days
    - endpoints[POST /centers]
    distinguishing_aspect: Omitting the optional occupancy_grace_days input yields the §1.1 default 90, not 0 and not the 30 used by the other fixtures.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      trigger:
      - call: POST /centers
        payload:
          name: Riverbend Commons
          total_gla_sqft: 250000
        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr2: $.data.id
      assert:
      - ShoppingCenter.${ctr2}.occupancy_grace_days == 90
      - ShoppingCenter.${ctr2}.total_gla_sqft == 250000
      - ShoppingCenter.${ctr2}.compliance_posture == COMPLIANT
  - name: tenant_omitted_optionals_default_to_active_and_not_national
    claim_type: defaults
    grounds:
    - entities.Tenant.fields.status
    - entities.Tenant.fields.is_national_chain
    - endpoints[POST /tenants]
    distinguishing_aspect: A Tenant created without status or is_national_chain lands on status ACTIVE and is_national_chain false, which matters because SNAPSHOT_STRICT counts only ACTIVE tenants.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      trigger:
      - call: POST /tenants
        payload:
          legal_name: Halcyon Optical LLC
          notice_email: legal@halcyonoptical.example
          primary_use_code: OPTICAL
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_x: $.data.id
      assert:
      - response.http_status == 201
      - Tenant.${t_x}.status == ACTIVE
      - Tenant.${t_x}.is_national_chain == false
      - Tenant.${t_x}.primary_use_code == OPTICAL
      - Tenant.${t_x}.version == 1
  - name: lease_missing_required_gla_sqft_returns_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=3]
    - errors[ERR_INVALID_REQUEST]
    - entities.Lease.fields.gla_sqft
    distinguishing_aspect: 'gla_sqft carries source: input with no §1.1 default, so omitting it is a schema violation caught at priority 3 with HTTP 400 and no Lease row is created.'
    test_recipe:
      setup:
      - A center and one tenant exist
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      - call: POST /centers
        payload:
          name: Northgate Crossing
          total_gla_sqft: 300000
          occupancy_grace_days: 30
        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Halcyon Optical LLC
          notice_email: legal@halcyonoptical.example
          primary_use_code: OPTICAL
          is_national_chain: false
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_x: $.data.id
      trigger:
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_x}
          suite_code: I9
          parcel_kind: INLINE
          primary_use_code: OPTICAL
          base_rent_monthly_cents: 500000
          commencement_date: '2026-09-01'
          expiration_date: '2036-08-31'
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          err: $.data.error_id
      assert:
      - response.http_status == 400
      - response.data.error_id == ERR_INVALID_REQUEST
      - GET /leases with center_id ${ctr} returns total_count == 0
      - ShoppingCenter.${ctr}.occupied_gla_sqft == 0
  - name: lease_is_anchor_computed_from_parcel_kind
    claim_type: computed_fields
    grounds:
    - entities.Lease.fields.is_anchor
    - entities.Lease.fields.parcel_kind
    - entities.Lease.fields.effective_rent_monthly_cents
    distinguishing_aspect: 'is_anchor is derived purely from parcel_kind: ANCHOR_BOX yields true while PAD yields false, and effective_rent_monthly_cents initialises to base_rent_monthly_cents with total_abated_cents
      0.'
    test_recipe:
      setup:
      - A center and two tenants exist
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      - call: POST /centers
        payload:
          name: Northgate Crossing
          total_gla_sqft: 300000
          occupancy_grace_days: 30
        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Boxmart Retail Inc
          notice_email: legal@boxmart.example
          primary_use_code: DISCOUNT_DEPT
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_box: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Fuelstop Pads LLC
          notice_email: legal@fuelstop.example
          primary_use_code: FUEL
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_pad: $.data.id
      trigger:
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_box}
          suite_code: A1
          gla_sqft: 120000
          parcel_kind: ANCHOR_BOX
          primary_use_code: DISCOUNT_DEPT
          base_rent_monthly_cents: 6000000
          commencement_date: '2026-01-01'
          expiration_date: '2036-12-31'
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          l_box: $.data.id
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_pad}
          suite_code: P1
          gla_sqft: 4000
          parcel_kind: PAD
          primary_use_code: FUEL
          base_rent_monthly_cents: 900000
          commencement_date: '2026-01-01'
          expiration_date: '2036-12-31'
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          l_pad: $.data.id
      assert:
      - Lease.${l_box}.is_anchor == true
      - Lease.${l_pad}.is_anchor == false
      - Lease.${l_box}.premises_status == DRAFT
      - Lease.${l_box}.remedy_status == NONE
      - Lease.${l_box}.use_compliance_status == CLEAR
      - Lease.${l_box}.effective_rent_monthly_cents == 6000000
      - Lease.${l_box}.total_abated_cents == 0
      - Lease.${l_pad}.effective_rent_monthly_cents == 900000
      - ShoppingCenter.${ctr}.occupied_gla_sqft == 0
      - ShoppingCenter.${ctr}.open_occupancy_pct == 0.00
  - name: lease_system_fields_generated_and_client_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Lease.fields.premises_status
    - endpoints[POST /centers/{id}/leases]
    - response_envelope
    distinguishing_aspect: 'id, created_at, updated_at, version and every computed field are minted by the server: a request that also carries id, version and premises_status keys has those keys ignored,
      and the stored lease is DRAFT at version 1.'
    test_recipe:
      setup:
      - A center and one tenant exist
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
