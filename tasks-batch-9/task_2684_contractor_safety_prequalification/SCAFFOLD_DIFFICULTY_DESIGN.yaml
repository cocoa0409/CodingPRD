            - call: "POST /improvement-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          assert:
            - "pre-state: Contractor.${con_id}.open_deficiency_count == 0"
            - "after grading: Prequalification.${pq_id}.status == CONDITIONAL, final_composite_score == 77.89, grade == B, deficiency_codes == [\"EMR\"], conditional_expires_at == 2026-10-30T00:00:00Z"
            - "after grading: Contractor.${con_id}.open_deficiency_count == 1 (raised by exactly len(deficiency_codes))"
            - "the plan snapshot: ImprovementPlan.${plan_id}.deficiency_codes == [\"EMR\"] and its creation incremented Prequalification.${pq_id}.version by 1"
            - "after ACCEPT: ImprovementPlan.${plan_id}.status == ACCEPTED with closed_at == 2026-08-01T00:00:00Z"
            - "after ACCEPT: Prequalification.${pq_id}.status == UNDER_REVIEW with deficiency_codes == [], grade null, final_composite_score null, effective_thresholds null and conditional_expires_at null"
            - "after ACCEPT: Contractor.${con_id}.open_deficiency_count == 0 - exactly the pre-grading value, zero drift"
            - "reconciliation: GET /prequalifications?contractor_id=${con_id}&status=CONDITIONAL returns 0 rows, matching the counter definition"
