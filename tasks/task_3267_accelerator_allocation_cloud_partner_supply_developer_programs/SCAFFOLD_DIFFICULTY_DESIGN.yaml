- rule_id: compensating_invariant
  instances:
  - name: entitlement_ledger_compensation_is_termination_not_reclaim
    grounds:
    - calculations.entitlement_state_transition
    - calculations.entitlement_pool_release
    - state_machines.EnterpriseSubscription.ACTIVE_to_RECLAIMED
    - state_machines.HardwareDeployment.ACTIVATED_to_TERMINATED
    distinguishing_aspect: 'The conserved quantity is PartnerAccount.entitlement_units_held: the

      compensating partner of the confirmation is the deployment termination,

      not the subscription reclaim, so the ledger reads 250 after a reclaim

      and only returns to its pre-confirmation value of 0 once the deployment

      is terminated.

      '
    test_recipe:
      setup:
