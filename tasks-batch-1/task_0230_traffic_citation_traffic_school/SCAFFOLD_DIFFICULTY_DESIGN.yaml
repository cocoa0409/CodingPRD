      - name: late_penalty_hold_then_payment_conserves_open_hold_count
        grounds:
          - state_machines.Citation.ASSESSED_to_ASSESSED
          - state_machines.Citation.PARTIALLY_PAID_to_PAID
          - state_machines.LicenseHold.OPEN_to_RELEASED
          - calculations.license_status
        distinguishing_aspect: |
          Conserved quantity = count of OPEN LicenseHold rows for the driver (a
          DIFFERENT conserved quantity than point_balance). Forward action (late
          penalty) opens exactly one NONPAYMENT_HOLD (count 0 -> 1, license HELD); the
          compensating action (full payment) releases exactly that hold (count 1 -> 0,
          license back to VALID). Invariant: open-hold count returns to baseline 0.
        test_recipe:
          setup:
            - "Jurisdiction A; driver D19 with one assessed citation (29000); clock past appear_by; late penalty applied -> 1 OPEN NONPAYMENT_HOLD, license HELD, balance 32000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
