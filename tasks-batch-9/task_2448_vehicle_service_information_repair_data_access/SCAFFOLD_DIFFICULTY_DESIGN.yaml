            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "REPAIR_PROCEDURE" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_id: $.data.id, pub_v1: $.data.version }
            - call: "POST /publications/${pub_id}/versions"
              payload: { source_tsb_ref: "TSB-0001", expected_publication_version: "${pub_v1}" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pv1_id: $.data.id }
            - call: "POST /publication-versions/${pv1_id}/validate"
              payload: { reviewer_notes: "checked" }
              as: ContentPublisher
              as_user_id: "cp_1"
            - call: "POST /publication-versions/${pv1_id}/publish"
              payload: {}
              as: ContentPublisher
              as_user_id: "cp_2"
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}/coverage-map"
              payload: { basis: "EFFECTIVE" }
              as: ShopManager
              as_user_id: "${shop_id}"
          assert:
            - "response status == 200"
            - "data.total_cells == 0"
            - "data.covered_cells == 0 and data.degraded_cells == 0 and data.gap_cells == 0"
            - "data.completeness_pct == 0.00"
            - "data.gaps == [] (empty array, not null)"
            - "Shop.${shop_id}.coverage_completeness_pct == 0.00"
            - "ShopEntitlement.${ent_id}.status == PENDING"

