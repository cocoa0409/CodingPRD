  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lapsed_appropriation_state_error_beats_zero_capacity_fiscal_error
        grounds:
          - validations[priority=12]
          - validations[priority=38]
          - state_machines.Appropriation.AUTHORITY_PENDING_to_AUTHORITY_LAPSED
          - state_machines.Allotment.DRAFT_to_PREPARED
        distinguishing_aspect: |
          Category pair state (priority 12, ERR_APPROPRIATION_NOT_ENACTED) versus
          business_fiscal (priority 38, ERR_NO_RELEASE_CAPACITY): a STRIKEd line is LAPSED
          with enacted_amount_cents 0, so both rules fire on the same prepare call and the
          response MUST be ERR_APPROPRIATION_NOT_ENACTED with HTTP 409.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 introduced at 1000000000, STRIKEd by a HOUSE committee action so committee_balance_cents == 0, then enacted into authority_status LAPSED with enacted_amount_cents 0"
            - "One DRAFT Allotment on that lapsed line for quarter 1 with requested_cents 100000000 and allow_partial false"
          setup_api_calls:
