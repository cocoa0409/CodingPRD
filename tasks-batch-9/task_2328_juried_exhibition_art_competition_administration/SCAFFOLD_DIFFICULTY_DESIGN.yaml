scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: artwork_round_mean_provisional_versus_quorum_certified
        grounds:
          - calculations.artwork_round_mean
          - entities.Artwork.fields.provisional_mean_score
          - entities.Artwork.fields.certified_mean_score
          - state_machines.Artwork.SUBMITTED_to_DECLINED
          - state_machines.JuryRound.OPEN_to_SCORING_COMPLETE
        distinguishing_aspect: |
          The two variants live in the jury domain on entity Artwork: PROVISIONAL averages every
          valid score (7.54) while QUORUM_CERTIFIED averages only the earliest quorum_required
          scores by created_at ASC (6.72), and against the 7.00 threshold the same four scores
          therefore select opposite branches — DECLINED, not SHORTLISTED.
        test_recipe:
          setup:
            - "Exhibition OPEN_FOR_ENTRIES then JURYING, advance_score_threshold 7.0, weights 0.40/0.35/0.25."
            - "One MEMBER artist from CA with one SUBMITTED PAINTING artwork carrying a PRIMARY image."
            - "Four CONFIRMED jurors all credentialed in PAINTING, booked into round 1 (quorum_required 3, window 2026-10-05 .. 2026-10-12)."
            - "Round 1 OPEN at clock 2026-10-06T10:00:00Z with four scores cast in this created_at order: 7.15, 7.00, 6.00, 10.00."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 3, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000, for_sale: true, list_price_cents: 250000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw1_id: $.data.id } }
            - { call: "POST /artworks/${aw1_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "aa01" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}", captures: { e1_fee: $.data.entry_fee_cents } }
            - { call: "POST /entries/${e1_id}/fee-payment", payload: { amount_cents: 3713 }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "JURYING" }, as: CallManager }
            - { call: "POST /jurors", payload: { display_name: "Iris Vega", email: "iris@example.org", expertise_categories: ["PAINTING", "PHOTOGRAPHY"], honorarium_cents: 50000 }, as: JuryChair, captures: { j1_id: $.data.id } }
            - { call: "POST /jurors/${j1_id}/confirm", payload: {}, as: Juror, as_user_id: "${j1_id}" }
            - { call: "POST /jurors", payload: { display_name: "Omar Diaz", email: "omar@example.org", expertise_categories: ["PAINTING", "PHOTOGRAPHY"], honorarium_cents: 50000 }, as: JuryChair, captures: { j2_id: $.data.id } }
            - { call: "POST /jurors/${j2_id}/confirm", payload: {}, as: Juror, as_user_id: "${j2_id}" }
            - { call: "POST /jurors", payload: { display_name: "Lena Park", email: "lena@example.org", expertise_categories: ["PAINTING", "PHOTOGRAPHY"], honorarium_cents: 50000 }, as: JuryChair, captures: { j3_id: $.data.id } }
            - { call: "POST /jurors/${j3_id}/confirm", payload: {}, as: Juror, as_user_id: "${j3_id}" }
            - { call: "POST /jurors", payload: { display_name: "Tomas Reyes", email: "tomas@example.org", expertise_categories: ["PAINTING", "PHOTOGRAPHY"], honorarium_cents: 50000 }, as: JuryChair, captures: { j4_id: $.data.id } }
            - { call: "POST /jurors/${j4_id}/confirm", payload: {}, as: Juror, as_user_id: "${j4_id}" }
            - { call: "POST /jury-rounds", payload: { exhibition_id: "${ex_id}", round_number: 1, round_type: "BLIND_SCORING", opens_at: "2026-10-05T00:00:00Z", closes_at: "2026-10-12T00:00:00Z", quorum_required: 3 }, as: JuryChair, captures: { r1_id: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j1_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v1}" }, as: JuryChair }
            - { call: "GET /jury-rounds/${r1_id}", payload: {}, as: JuryChair, captures: { r1_v2: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j2_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v2}" }, as: JuryChair }
            - { call: "GET /jury-rounds/${r1_id}", payload: {}, as: JuryChair, captures: { r1_v3: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j3_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v3}" }, as: JuryChair }
            - { call: "GET /jury-rounds/${r1_id}", payload: {}, as: JuryChair, captures: { r1_v4: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j4_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v4}" }, as: JuryChair }
            - { call: "POST /jury-rounds/${r1_id}/status", payload: { target_status: "OPEN" }, as: JuryChair }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-06T10:00:00Z" }, as: CallManager }
            - { call: "POST /jury-rounds/${r1_id}/scores", payload: { artwork_id: "${aw1_id}", technique: 8, originality: 7, relevance: 6 }, as: Juror, as_user_id: "${j1_id}" }
            - { call: "POST /jury-rounds/${r1_id}/scores", payload: { artwork_id: "${aw1_id}", technique: 7, originality: 7, relevance: 7 }, as: Juror, as_user_id: "${j2_id}" }
            - { call: "POST /jury-rounds/${r1_id}/scores", payload: { artwork_id: "${aw1_id}", technique: 6, originality: 6, relevance: 6 }, as: Juror, as_user_id: "${j3_id}" }
            - { call: "POST /jury-rounds/${r1_id}/scores", payload: { artwork_id: "${aw1_id}", technique: 10, originality: 10, relevance: 10 }, as: Juror, as_user_id: "${j4_id}" }
          trigger:
            - { call: "GET /artworks/${aw1_id}", payload: {}, as: JuryChair, captures: { prov_before: $.data.provisional_mean_score } }
            - { call: "POST /jury-rounds/${r1_id}/status", payload: { target_status: "SCORING_COMPLETE" }, as: JuryChair }
          assert:
            - "Artwork.${aw1_id}.valid_score_count == 4"
            - "Artwork.${aw1_id}.provisional_mean_score == 7.54"
            - "Artwork.${aw1_id}.certified_mean_score == 6.72"
            - "Artwork.${aw1_id}.status == DECLINED"
            - "Exhibition.${ex_id}.shortlisted_count == 0"
            - "provisional 7.54 >= advance_score_threshold 7.0 while certified 6.72 < 7.0 — the two variants disagree on the branch for identical score data"

      - name: sale_split_tax_inclusive_versus_purchase_award_tax_additional
        grounds:
          - calculations.sale_settlement_split
          - entities.Sale.fields.taxable_base_cents
          - entities.Sale.fields.artist_payable_cents
          - state_machines.Award.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          The two variants live in the money domain on entity Sale: TAX_INCLUSIVE_LIST divides the
          250000 gallery price by 1.0875 (base 229885, artist 149425) while TAX_ADDITIONAL treats
          the identical 250000 purchase-award figure as the base (artist 225000) — a 75575-cent
