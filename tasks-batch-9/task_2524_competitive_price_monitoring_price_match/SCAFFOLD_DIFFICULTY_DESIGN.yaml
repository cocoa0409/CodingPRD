            - "ACTIVE PRIMARY price-match-eligible competitor C-ALPHA with a CONFIRMED link at confidence_bp 10000."
            - "ACTIVE policy: eligible tiers [PRIMARY], daily_override_budget_cents 100000, max_match_discount_pct 0.25 so the cap is round_half_up(12999 * 0.25) == 3250, claim_window_hours 168."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
