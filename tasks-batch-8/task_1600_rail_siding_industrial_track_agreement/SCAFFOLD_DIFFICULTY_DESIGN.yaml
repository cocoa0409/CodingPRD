      - name: inspection_fail_cascade_suspends_segment
        grounds:
          - state_machines.SafetyInspection.SCHEDULED_to_COMPLETED_FAIL
          - state_machines.DerailDevice.INSTALLED_to_NON_COMPLIANT
          - entities.TrackSegment.fields.safety_suspended
          - calculations.inspection_cadence_scheduling
        distinguishing_aspect: |
          Depth-2 chain from record-result FAIL (a different trigger than abandonment):
          inspection COMPLETED_FAIL -> cited DerailDevice INSTALLED -> NON_COMPLIANT
          (link 1) -> that mutation flips segment.safety_suspended to true (link 2), which
          gates subsequent service-order creation with ERR_SEGMENT_SAFETY_SUSPENDED.
        test_recipe:
          setup:
            - "ACTIVE agreement A; segment 'Siding A' IN_SERVICE, not suspended"
            - "DerailDevice on the segment advanced PROPOSED -> APPROVED -> INSTALLED"
            - "SafetyInspection scheduled 2026-08-01 (SCHEDULED)"
