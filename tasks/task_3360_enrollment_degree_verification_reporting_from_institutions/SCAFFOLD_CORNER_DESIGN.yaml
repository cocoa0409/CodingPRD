            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 10000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { r1: "$.data.id" } }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "INSURANCE" }, as: Requester, as_user_id: "${rq_id}", captures: { r2: "$.data.id" } }
