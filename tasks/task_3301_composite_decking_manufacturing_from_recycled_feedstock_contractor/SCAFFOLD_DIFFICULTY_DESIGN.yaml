          - endpoints.POST_/decking/stocking-commitments/{id}/close-season
        distinguishing_aspect: |
          Numeric threshold on the fill-rate metric: fill_rate_bp == 9000
          exactly lands IN the grace band (>= semantics) with penalty 0, while
          fill_rate_bp == 8999 falls into the mid band at 50 cents/lf. Two
          commitments at 1000 lf committed with 900 and 899 lf fulfilled pin
          the boundary on the close-season endpoint.
        test_recipe:
          setup:
            - "Two dealers D1/D2, each with an OPEN commitment 1000 lf season 2026 for the same line."
            - "D1 fulfilled exactly 900 lf (fill_rate 9000 bp); D2 fulfilled 899 lf (8990 bp)."
