        claim_type: Variant Selection
        grounds:
          - calculations.athlete_age_group_assignment.variants
          - entities.GamesEdition.fields.age_basis
        excluded_because:
          difficulty_instance: age_basis_variant_flips_athlete_age_group_band
          rationale: "Selection of the reference-date versus first-competition-day basis, and the band flip it produces for the same date_of_birth, are asserted there against two editions."

