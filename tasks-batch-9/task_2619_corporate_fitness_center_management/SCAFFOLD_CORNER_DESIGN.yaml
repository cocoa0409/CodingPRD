      - name: incident_return_restarts_the_review_loop
        claim_type: cyclic
        grounds:
          - state_machines.IncidentReport.UNDER_REVIEW_to_REPORTED
          - endpoints[POST /incident-reports/{id}/return]
          - entities.IncidentReport.fields.return_count
        distinguishing_aspect: |
          IncidentReport is cyclic between REPORTED and UNDER_REVIEW, and each lap
          is counted: return clears reviewed_by_user_id and increments
          return_count, a second review re-stamps the reviewer, and a second
          return leaves return_count at 2. Returning is NOT a terminal decision,
          so file-claim and close stay reachable afterwards, and the returns never
          undo cascade effects.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain; one MINOR / SLIP_FALL incident filed by the site manager and moved to UNDER_REVIEW by the compliance auditor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
