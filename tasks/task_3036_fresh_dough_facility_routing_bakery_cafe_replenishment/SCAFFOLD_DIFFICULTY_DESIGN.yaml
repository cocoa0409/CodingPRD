  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: demand_adjustment_supersede_cycle
        grounds:
          - state_machines.DemandAdjustment.ACTIVE_to_SUPERSEDED
          - state_machines.DemandAdjustment.ACTIVE_to_RESCINDED
          - calculations.effective_units
        distinguishing_aspect: |
          DemandAdjustment has a cyclic lifecycle: create A1 (ACTIVE) -> create
          A2 (A1 SUPERSEDED) -> rescind A2 -> create A3. Each pass rewrites
          adjusted_quantity on every live order; the entity loops through ACTIVE
          multiple times instead of walking a linear pipeline.
        test_recipe:
          setup:
            - "F1, CXL, C1 (FRANCHISE 90000) exist; clock 2026-09-09T10:00Z"
            - "C1 has a SUBMITTED CXL order qty 100 for 2026-09-10 (provisional 44800 <= 90000)"
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
