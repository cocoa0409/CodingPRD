            - call: "POST /inspection/pathogen-samples/${s7}/record-result"
              payload: { result: "NEGATIVE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/pathogen-samples/${s8}/record-result"
              payload: { result: "NEGATIVE" }
              as: Inspector
              as_user_id: "${insp_id}"
