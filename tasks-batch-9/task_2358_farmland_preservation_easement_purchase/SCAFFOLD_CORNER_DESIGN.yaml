      - name: five_lifecycle_conflict_codes_fire_on_a_second_attempt_at_a_completed_transition
        claim_type: Error triggerable
        grounds:
          - validations[priority=12]
          - errors[ERR_INVALID_CLOSING_STATE]
          - errors[ERR_INVALID_VISIT_STATE]
          - errors[ERR_INVALID_AMENDMENT_STATE]
          - errors[ERR_INVALID_VIOLATION_STATE]
          - errors[ERR_INVALID_SOURCE_STATE]
          - state_machines.Application.closing_status
          - state_machines.MonitoringVisit
          - state_machines.Amendment
          - state_machines.Violation
          - state_machines.FundingSource
        distinguishing_aspect: "Priority 12 is one rule with ten codes; this instance triggers the five that no other test reaches, each on its own entity family and each from a state the machine really occupies: closing while closing_status == PENDING_REQUIREMENTS (ERR_INVALID_CLOSING_STATE), cancelling an already-CANCELLED visit (ERR_INVALID_VISIT_STATE), reinstating an UNDER_REVIEW amendment (ERR_INVALID_AMENDMENT_STATE), filing a second cure plan on a CURE_PLAN_ACCEPTED violation (ERR_INVALID_VIOLATION_STATE) and suspending an already-SUSPENDED source (ERR_INVALID_SOURCE_STATE). The order is forced: the amendment must reach UNDER_REVIEW before the violation opens, because an open violation sets stewardship_hold and suspends it."
        test_recipe:
          setup:
            - "Program P1, three funding sources, round R1 OPEN, landowner LO-A, parcel PA1, application AP1 ranked, appraised and CERTIFIED, offered, funded and accepted at clock 2026-10-12."
            - "The three closing requirements exist and their ids have been read."
