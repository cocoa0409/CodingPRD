# =============================================================================
# task_2330 — Production Music Library Licensing
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the nine claim-extraction-guide sections.
# Logical clock starts at 2026-08-01T00:00:00Z and only POST /_clock/set_current_utc moves it.
# Every numeric assert is a literal pre-computed against the §1.3 formulas.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: composer_creation_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Composer.fields.pro_affiliation
          - entities.Composer.fields.payee_country
          - entities.Composer.fields.tax_withholding_pct
          - entities.Composer.fields.accrued_unpaid_cents
          - endpoints["POST /music-library/composers"]
        distinguishing_aspect: |
          Only instance that asserts Composer's whole default vector plus the common-field trio on a
          payload that supplies nothing but display_name; falsified if any default differs from
          NONE / "US" / 0.30 / 0 or if created_at is not the clock origin.
        test_recipe:
          setup:
            - "Empty database; logical clock at its origin 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
          assert:
            - "201; response_type is an object and meta.api_request_id / meta.api_request_timestamp are present"
            - "Composer.${c1}.pro_affiliation == \"NONE\""
            - "Composer.${c1}.payee_country == \"US\""
            - "Composer.${c1}.tax_withholding_pct == 0.30"
            - "Composer.${c1}.accrued_unpaid_cents == 0 and Composer.${c1}.outstanding_advance_cents == 0 and Composer.${c1}.lifetime_paid_cents == 0"
            - "Composer.${c1}.latest_statement_period_end == null"
            - "Composer.${c1}.version == 1 and Composer.${c1}.created_at == \"2026-08-01T00:00:00.000Z\" and Composer.${c1}.updated_at == \"2026-08-01T00:00:00.000Z\""

      - name: license_tier_defaults_applied_then_out_of_range_values_rejected
        claim_type: type_constraints
        grounds:
          - entities.LicenseTier.fields.min_term_months
          - entities.LicenseTier.fields.max_term_months
          - entities.LicenseTier.fields.per_use_eligible
          - entities.LicenseTier.fields.blanket_eligible
          - validations[priority=1].schema_and_type_validation
        distinguishing_aspect: |
          Pairs LicenseTier's default vector with two priority-1 schema rejections on the same
          endpoint (unknown media_type member, base_rate_cents 0 against the "> 0" constraint);
          falsified if either rejection surfaces a business error id instead of ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /music-library/license-tiers"
              payload: { code: "FILM-STD", media_type: "FILM", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 600000 }
              as: CatalogAdmin
              captures: { t1: $.data.id }
            - call: "POST /music-library/license-tiers"
              payload: { code: "POD-STD", media_type: "PODCAST", allowed_scales: ["NATIONAL"], base_rate_cents: 100000 }
              as: CatalogAdmin
            - call: "POST /music-library/license-tiers"
              payload: { code: "ZERO-STD", media_type: "GAME", allowed_scales: ["LOCAL"], base_rate_cents: 0 }
              as: CatalogAdmin
          assert:
            - "Call 1 → 201; LicenseTier.${t1}.min_term_months == 1 and LicenseTier.${t1}.max_term_months == 120"
            - "LicenseTier.${t1}.per_use_eligible == true and LicenseTier.${t1}.blanket_eligible == false and LicenseTier.${t1}.version == 1"
            - "Call 2 → 422 with data.error_id == \"ERR_VALIDATION\" (PODCAST is not a member of the media_type set)"
            - "Call 3 → 422 with data.error_id == \"ERR_VALIDATION\" (base_rate_cents must be > 0)"

      - name: composition_system_and_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Composition.fields.catalog_status
          - entities.Composition.fields.availability_status
          - entities.Composition.fields.active_license_count
          - entities.Composition.fields.relevance_score
          - endpoints["POST /music-library/compositions"]
        distinguishing_aspect: |
          The create payload carries client-supplied values for every system and computed field of
          Composition; the row must come back with the declared server values instead. Falsified if
          any client value survives, or if the request is rejected rather than the extras ignored.
        test_recipe:
          setup:
            - "One composer and one DRAFT ROYALTY_SPLIT agreement (creation does not require an ACTIVE agreement)."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
          trigger:
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC", "DARK"], instrumentation: ["STRINGS", "BRASS"], catalog_status: "CATALOGED", availability_status: "RESTRICTED", active_license_count: 7, relevance_score: 99.99, version: 42 }
              as: CatalogAdmin
              captures: { compA: $.data.id }
          assert:
            - "201; Composition.${compA}.catalog_status == \"INGESTED\" (client value CATALOGED ignored)"
            - "Composition.${compA}.availability_status == \"AVAILABLE\" (client value RESTRICTED ignored)"
            - "Composition.${compA}.active_license_count == 0 and Composition.${compA}.open_claim_count == 0"
            - "Composition.${compA}.exclusive_block_until == null and Composition.${compA}.lifetime_performance_credits == 0.00"
            - "Composition.${compA}.relevance_score == null (populated only by the search endpoint)"
            - "Composition.${compA}.version == 1 (client value 42 ignored)"

      - name: composition_retrieval_round_trip_carries_null_relevance_score
        claim_type: retrieval
        grounds:
          - endpoints["GET /music-library/compositions/{composition_id}"]
          - entities.Composition.fields.relevance_score
          - state_machines.Composition.catalog_status.INGESTED_to_CATALOGED
        distinguishing_aspect: |
          Reads a CATALOGED work through the single-resource GET and asserts every stored facet plus
          version 2 (create then catalog) and relevance_score null; falsified if the read endpoint
          scores the row or if cataloging fails to bump version.
        test_recipe:
          setup:
            - "One composer with an ACTIVE ROYALTY_SPLIT agreement and one CATALOGED composition."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC", "DARK"], instrumentation: ["STRINGS", "BRASS"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "GET /music-library/compositions/${compA}"
              payload: {}
              as: LicensingAgent
          assert:
            - "200; Composition.${compA}.title == \"Harbour Lights\" and Composition.${compA}.duration_sec == 180 and Composition.${compA}.tempo_bpm == 130"
            - "Composition.${compA}.genre == \"CINEMATIC\" and Composition.${compA}.mood_tags == [\"EPIC\", \"DARK\"] and Composition.${compA}.instrumentation == [\"STRINGS\", \"BRASS\"]"
            - "Composition.${compA}.catalog_status == \"CATALOGED\" and Composition.${compA}.availability_status == \"AVAILABLE\""
            - "Composition.${compA}.relevance_score == null"
            - "Composition.${compA}.version == 2 (1 at create, 2 after catalog)"

      - name: composition_listing_pagination_envelope_and_status_filter
        claim_type: listing
        grounds:
          - endpoints["GET /music-library/compositions"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three works, two CATALOGED, exercised through limit/offset and the catalog_status filter in
          the same instance; falsified if total_count reports the page size instead of the filtered
          set size, or if has_more stays true on the last page.
        test_recipe:
          setup:
            - "One composer with an ACTIVE agreement and three compositions A, B, C created in that order; A and B are CATALOGED, C stays INGESTED."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC"], instrumentation: ["STRINGS"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Slate Horizon", duration_sec: 200, tempo_bpm: 118, genre: "CINEMATIC", mood_tags: ["HOPEFUL"], instrumentation: ["PIANO"] }
              as: CatalogAdmin
              captures: { compB: $.data.id }
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Night Ferry", duration_sec: 150, tempo_bpm: 92, genre: "JAZZ", mood_tags: ["CALM"], instrumentation: ["PIANO"] }
              as: CatalogAdmin
              captures: { compC: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/compositions/${compB}/catalog"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "GET /music-library/compositions?limit=2&offset=0"
              payload: { limit: 2, offset: 0 }
              as: CatalogAdmin
            - call: "GET /music-library/compositions?limit=2&offset=2"
              payload: { limit: 2, offset: 2 }
              as: CatalogAdmin
            - call: "GET /music-library/compositions?catalog_status=CATALOGED"
              payload: { catalog_status: "CATALOGED" }
              as: CatalogAdmin
            - call: "GET /music-library/compositions?composer_id=${c1}&catalog_status=INGESTED"
              payload: { composer_id: "${c1}", catalog_status: "INGESTED" }
              as: CatalogAdmin
          assert:
            - "Call 1 → 200 with limit 2, offset 0, total_count 3, has_more true and exactly 2 rows"
            - "Call 2 → 200 with limit 2, offset 2, total_count 3, has_more false and exactly 1 row"
            - "Call 3 → 200 with total_count 2, has_more false, and the returned ids are exactly ${compA} and ${compB}"
            - "Call 4 → 200 with total_count 1 and the single row id == ${compC}"

      - name: reference_ids_that_do_not_exist_return_the_declared_404_not_found
        claim_type: not_found
        grounds:
          - validations[priority=2].path_entity_exists
          - validations[priority=3].body_reference_exists
          - errors[ERR_COMPOSER_NOT_FOUND]
          - errors[ERR_COMPOSER_AGREEMENT_NOT_FOUND]
          - errors[ERR_COMPOSITION_NOT_FOUND]
          - errors[ERR_LICENSE_TIER_NOT_FOUND]
        distinguishing_aspect: |
          Path-parameter existence (priority 2) and body-foreign-key existence (priority 3) are
          asserted side by side against an empty-ish database, each mapped to its own entity-specific
          404 id; falsified if any of them collapses into a generic ERR_VALIDATION.
        test_recipe:
          setup:
            - "One composer and one DRAFT agreement exist so the body-FK probe can vary exactly one reference at a time."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
          trigger:
            - call: "GET /music-library/composers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RightsManager
            - call: "GET /music-library/composer-agreements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RightsManager
            - call: "GET /music-library/compositions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CatalogAdmin
            - call: "GET /music-library/license-tiers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/compositions"
              payload: { composer_id: "00000000-0000-0000-0000-000000000000", agreement_id: "${ag1}", title: "Ghost Work", duration_sec: 120, tempo_bpm: 100, genre: "FOLK", mood_tags: ["CALM"], instrumentation: ["GUITAR"] }
              as: CatalogAdmin
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "00000000-0000-0000-0000-000000000000", title: "Ghost Work", duration_sec: 120, tempo_bpm: 100, genre: "FOLK", mood_tags: ["CALM"], instrumentation: ["GUITAR"] }
              as: CatalogAdmin
          assert:
            - "Call 1 → 404 with data.error_id == \"ERR_COMPOSER_NOT_FOUND\""
            - "Call 2 → 404 with data.error_id == \"ERR_COMPOSER_AGREEMENT_NOT_FOUND\""
            - "Call 3 → 404 with data.error_id == \"ERR_COMPOSITION_NOT_FOUND\""
            - "Call 4 → 404 with data.error_id == \"ERR_LICENSE_TIER_NOT_FOUND\""
            - "Call 5 → 404 with data.error_id == \"ERR_COMPOSER_NOT_FOUND\" and no Composition row is created"
            - "Call 6 → 404 with data.error_id == \"ERR_COMPOSER_AGREEMENT_NOT_FOUND\" and no Composition row is created"

      - name: sync_request_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - endpoints["POST /music-library/sync-requests"]
          - entities.SyncRequest.fields.tier_id
          - entities.SyncRequest.fields.requested_term_months
          - validations[priority=1].schema_and_type_validation
        distinguishing_aspect: |
          Isolates the non-defaultable subset of the SyncRequest create input (tier_id,
          requested_term_months) and asserts each omission is a priority-1 ERR_VALIDATION while the
          defaultable flags may all be omitted successfully; falsified if an omitted required field
          silently defaults.
        test_recipe:
          setup:
            - "One composer with an ACTIVE agreement, one CATALOGED composition, one FILM tier quotable at every scale, one licensee."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC"], instrumentation: ["STRINGS"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/license-tiers"
              payload: { code: "FILM-STD", media_type: "FILM", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 600000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { t1: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Northwind Pictures", licensee_type: "PRODUCTION_COMPANY", credit_limit_cents: 10000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
          trigger:
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 24 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${t1}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z" }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${t1}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 24 }
              as: LicensingAgent
              captures: { sr1: $.data.id }
          assert:
            - "Call 1 → 422 with data.error_id == \"ERR_VALIDATION\" (tier_id absent)"
            - "Call 2 → 422 with data.error_id == \"ERR_VALIDATION\" (requested_term_months absent)"
            - "Call 3 → 201; SyncRequest.${sr1}.status == \"SUBMITTED\", revision_round == 0, quoted_fee_cents == null, quote_expires_at == null, license_id == null"
            - "SyncRequest.${sr1}.exclusive_requested == false and custom_edit_requested == false and stems_requested == false and rush_requested == false and alternate_lengths_sec == []"
            - "SyncRequest.${sr1}.brief_note == null"

      - name: fingerprint_match_and_ledger_entry_are_immutable_without_version
        claim_type: immutability
        grounds:
          - entities.FingerprintMatch.common_fields
          - entities.RoyaltyLedgerEntry.common_fields
          - endpoints["POST /music-library/fingerprint-matches"]
          - endpoints["POST /music-library/royalty-ledger-entries"]
        distinguishing_aspect: |
          The scaffold's only two `common_fields: false` entities are asserted together: both carry
          id and created_at but neither version nor updated_at, and neither has any update endpoint.
          Falsified if either response exposes a version field.
        test_recipe:
          setup:
            - "One composer with an ACTIVE agreement and one CATALOGED composition to hang the detection event on."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC"], instrumentation: ["STRINGS"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "POST /music-library/fingerprint-matches"
              payload: { composition_id: "${compA}", source_platform: "UGC_VIDEO", source_reference: "vid-88121", matched_seconds: 120, confidence_pct: 96.0 }
              as: CatalogAdmin
              captures: { fp1: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 5000, memo: "goodwill adjustment" }
              as: RoyaltyAccountant
              captures: { le1: $.data.id }
            - call: "GET /music-library/fingerprint-matches/${fp1}"
              payload: {}
              as: RightsManager
            - call: "GET /music-library/royalty-ledger-entries/${le1}"
              payload: {}
              as: RoyaltyAccountant
          assert:
            - "FingerprintMatch.${fp1} response carries id and created_at and detected_at == \"2026-08-01T00:00:00.000Z\"; it carries no version and no updated_at field"
            - "FingerprintMatch.${fp1}.matched_seconds == 120 and confidence_pct == 96.0"
            - "RoyaltyLedgerEntry.${le1} response carries id and created_at; it carries no version and no updated_at field"
            - "RoyaltyLedgerEntry.${le1}.statement_id == null, source_ref_id == null, amount_cents == 5000, accrual_recognized_at == cash_recognized_at == \"2026-08-01T00:00:00.000Z\""
            - "§1.5 declares no PATCH or PUT on /music-library/fingerprint-matches/{match_id} or /music-library/royalty-ledger-entries/{entry_id}"

      - name: usage_report_parent_must_exist_else_blanket_not_found
        claim_type: parent_relationships
        grounds:
          - entities.UsageReport.parent
          - endpoints["POST /music-library/usage-reports"]
          - errors[ERR_BLANKET_AGREEMENT_NOT_FOUND]
          - endpoints["POST /music-library/usage-reports"].side_effects
        distinguishing_aspect: |
          UsageReport is the one entity with a declared `parent:` in §1.1; the instance proves the FK
          is enforced (404 on an unknown blanket) and that a valid parent yields DUE with all four
          pool figures at their zero state. Falsified if a report can exist without a blanket parent.
        test_recipe:
          setup:
            - "One licensee and one DRAFT MONTHLY blanket agreement covering [2026-08-01, 2027-08-01)."
          setup_api_calls:
            - call: "POST /music-library/licensees"
