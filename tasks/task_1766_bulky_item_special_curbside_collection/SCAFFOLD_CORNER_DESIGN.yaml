            - "item1 fee == 4883 (refrigerant 4500 + surcharge round_half_up(4500*0.085)=383; over-allowance fee waived by amnesty)"
            - "item2 fee == 0 (all fees waived under amnesty for a plain item)"
            - "provisional_total_cents == 4883"
            - "HouseholdAllowance(2026).over_allowance_items == 2 (amnesty waives the FEE, not the ledger accounting)"

