  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: version_increments_on_every_mutation_including_cascades
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Domain.fields.lock_status
          - entities.Account.fields.risk_score
          - concurrency_rules[renew-domain-stale-version]
        distinguishing_aspect: "Every mutation — including a settings PATCH that only touches the lock dimension — bumps Domain.version by exactly 1 and refreshes updated_at, which is precisely why a renew's expected_domain_version captured before the PATCH goes stale."
        test_recipe:
          setup: ["ACTIVE example.com whose version the client captured immediately after activation, at clock 2026-07-15 (past the 60-day lock)."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "ver@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_v: $.data.version }
          trigger:
            - call: "PATCH /registrar/domains/${dom_id}/settings"
              payload: { locked: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains/${dom_id}/renew"
              payload: { term_years: 1, expected_domain_version: "${dom_v}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "after the PATCH: Domain.${dom_id}.version == ${dom_v} + 1 and lock_status == 'UNLOCKED'"
            - "the renew with the pre-PATCH version: HTTP status == 412 and error_id == 'ERR_STALE_DOMAIN_VERSION'"
            - "Domain.${dom_id}.expires_at == '2027-05-01T00:00:00.000Z' (the stale renew changed nothing)"

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: cascade_is_visible_in_the_same_request_response
        claim_type: immediate_consistency
        grounds: ["state_machines.AbuseReport.UNDER_REVIEW_to_UPHELD"]
        excluded_because:
          difficulty_instance: transitive_cascade / abuse_uphold_cascades_domain_addons_account_subscription
          rationale: "That instance asserts the full five-level cascade is already observable on reads issued immediately after the single uphold call, which is exactly the immediate-consistency claim."

