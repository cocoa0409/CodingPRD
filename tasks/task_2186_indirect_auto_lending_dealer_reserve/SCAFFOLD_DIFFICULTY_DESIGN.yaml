  - rule_id: compensating_invariant
    instances:

      - name: fund_then_immediate_chargeback_conserves_reserve_balance
        grounds:
          - calculations.dealer_reserve_amount
          - calculations.reserve_chargeback_amount
          - entities.Dealer.fields.reserve_balance_cents
          - entities.ReserveEntry.fields.amount_cents
          - state_machines.RetailContract.ACCRUED_to_CHARGED_BACK
