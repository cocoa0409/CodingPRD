# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Crawlspace Encapsulation & Basement Waterproofing
#
# Reusable setup chain (empty-DB -> a SOLD Job with an accepted Quote A):
#   Quote A = footprint 1000 sqft, vapor+sump+drain(50ft)+backup, SPRING10
#     subtotal 925000, discount 92500, tax 58275, total 890775 cents.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_pricing_vs_assessment_severity_distinct_domains
        grounds:
          - calculations.quote_pricing
          - calculations.assessment_severity
          - entities.Quote.fields.total_cents
          - entities.Inspection.fields.severity
        distinguishing_aspect: "Two dual-variant calcs operate on different entity domains: quote_pricing's quoted_estimate-vs-install_final_reconciliation variants act on Quote/InstallOrder cost (890775 vs reconciled total), while assessment_severity's base-vs-override variants act on Inspection severity (LOW vs MODERATE)."
        test_recipe:
          setup:
            - "One Job (1000 sqft) with a DRAFT Quote priced to total_cents=890775, and a separate Job with a DRAFT Inspection (moisture 50, 1 structural finding, standing_water true)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Ann Owner", email: "ann@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "1 Main St", structure_type: "CRAWLSPACE", footprint_sqft: 1000 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_vapor_barrier: true, includes_sump: true, includes_drain: true, includes_battery_backup: true, drain_linear_ft: 50, discount_code: "SPRING10" }
              as: Estimator
              captures: { quote_id: $.data.id, q_total: $.data.total_cents }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 50, structural_findings_count: 1, standing_water: true }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
              captures: { insp_severity: $.data.severity }
          assert:
            - "Quote.${quote_id}.total_cents == 890775"
            - "Quote.${quote_id}.subtotal_cents == 925000"
            - "Inspection.${insp_id}.severity == MODERATE"

      - name: install_reconciliation_variance_vs_quoted_estimate
        grounds:
          - calculations.quote_pricing
          - calculations.install_reconciliation
          - entities.InstallOrder.fields.final_total_cents
          - entities.InstallOrder.fields.variance_cents
        distinguishing_aspect: "Same accepted Quote scope, two algorithm variants on the InstallOrder cost domain: quoted_estimate used drain_linear_ft=50 (total 890775), install_final_reconciliation uses actual_drain_linear_ft=80 (final 1020780, variance +130005)."
        test_recipe:
          setup:
            - "Job in SCHEDULED with accepted Quote A (total 890775) and an InstallOrder that has reached PASSED, financed by CASH."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Bob Owner", email: "bob@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "2 Main St", structure_type: "BASEMENT", footprint_sqft: 1000 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 70, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_vapor_barrier: true, includes_sump: true, includes_drain: true, includes_battery_backup: true, drain_linear_ft: 50, discount_code: "SPRING10" }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /jobs/${job_id}/pay-cash"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { jv: $.data.version }
            - call: "POST /jobs/${job_id}/install-orders"
              payload: { scheduled_start: "2026-05-01T08:00:00Z", scheduled_end: "2026-05-01T17:00:00Z", expected_job_version: "${jv}" }
              as: Scheduler
              captures: { io_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Alpha", home_region: "NORTH", daily_capacity: 2 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io_id}", window_start: "2026-05-01T08:00:00Z", window_end: "2026-05-01T17:00:00Z" }
              as: Scheduler
              captures: { cb_id: $.data.id }
            - call: "POST /crew-bookings/${cb_id}/confirm"
              payload: {}
              as: Scheduler
            - call: "POST /install-orders/${io_id}/dispatch"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: Scheduler
            - call: "POST /install-orders/${io_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /install-orders/${io_id}/inspect-pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /install-orders/${io_id}/complete"
              payload: { actual_drain_linear_ft: 80 }
              as: Scheduler
              captures: { final_total: $.data.final_total_cents, variance: $.data.variance_cents }
          assert:
            - "InstallOrder.${io_id}.final_total_cents == 1020780"
            - "InstallOrder.${io_id}.variance_cents == 130005"
            - "Quote.${quote_id}.total_cents == 890775"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: financing_amortization_2d_tier_nonlinear
        grounds:
          - calculations.financing_amortization
          - entities.FinancingApplication.fields.apr_bps
          - entities.FinancingApplication.fields.monthly_payment_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction — credit_band x term_bucket selects apr_bps from a 2-D table, then the amortization formula combines apr_bps, term_months and principal non-linearly; PRIME/term36 yields apr 799bps and monthly_payment 12404 on principal 395900."
        test_recipe:
          setup:
            - "A SOLD Job (PRIME homeowner) with accepted Quote B priced total_cents=395900 (600 sqft, sump only, no discount)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Cara Owner", email: "cara@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "3 Main St", structure_type: "CRAWLSPACE", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true, discount_code: "NONE" }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /financing-applications"
              payload: { job_id: "${job_id}", quote_id: "${quote_id}", term_months: 36 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id, apr: $.data.apr_bps, monthly: $.data.monthly_payment_cents }
          assert:
            - "FinancingApplication.${app_id}.amount_financed_cents == 395900"
            - "FinancingApplication.${app_id}.apr_bps == 799"
            - "FinancingApplication.${app_id}.monthly_payment_cents == 12404"

      - name: quote_pricing_nested_rounding_order_discount_then_tax
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.discount_cents
          - entities.Quote.fields.tax_cents
          - entities.Quote.fields.total_cents
        distinguishing_aspect: "Mode (b): nested rounding where order matters — the formula pins discount-on-subtotal (round_half_up) FIRST, then tax-on-discounted-subtotal (round_half_up); for SENIOR15 on a 2000-sqft vapor+dehu quote (subtotal 1125000) this yields discount 168750, tax 66938 (on 956250), total 1023188, which differs from taxing the pre-discount subtotal."
        test_recipe:
          setup:
            - "A Job with footprint 2000 sqft and a DRAFT Quote with vapor+dehumidifier and discount_code SENIOR15."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Dan Owner", email: "dan@x.com", credit_band: "NEAR_PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "4 Main St", structure_type: "COMBINED", footprint_sqft: 2000 }
              as: Estimator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_vapor_barrier: true, includes_dehumidifier: true, discount_code: "SENIOR15" }
              as: Estimator
              captures: { quote_id: $.data.id, subt: $.data.subtotal_cents, disc: $.data.discount_cents, tax: $.data.tax_cents, total: $.data.total_cents }
          assert:
            - "Quote.${quote_id}.subtotal_cents == 1125000"
            - "Quote.${quote_id}.discount_cents == 168750"
            - "Quote.${quote_id}.tax_cents == 66938"
            - "Quote.${quote_id}.total_cents == 1023188"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_cyclic_send_revise_loop
        grounds:
          - state_machines.Quote.SENT_to_REVISED
          - state_machines.Quote.DRAFT_to_SENT
          - entities.Quote.fields.revision
        distinguishing_aspect: "Cycle on Quote: SENT -> REVISED spawns a new DRAFT (revision 2) which loops DRAFT -> SENT again, distinct from the Claim cycle entity; the second quote carries revision==2."
        test_recipe:
          setup:
            - "A Job in QUOTED with Quote revision 1 in SENT status."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Eve Owner", email: "eve@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "5 Main St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/send"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /quotes/${q1_id}/revise"
              payload: { includes_sump: true, includes_dehumidifier: true }
              as: Estimator
              captures: { q2_id: $.data.id, q2_rev: $.data.revision, q2_status: $.data.status }
            - call: "POST /quotes/${q2_id}/send"
              payload: {}
              as: Estimator
              captures: { q2_status_after: $.data.status }
          assert:
            - "Quote.${q1_id}.status == REVISED"
            - "Quote.${q2_id}.revision == 2"
            - "Quote.${q2_id}.status == SENT"

      - name: claim_cyclic_resolved_reopen_loop
        grounds:
          - state_machines.Claim.RESOLVED_to_REOPENED
          - state_machines.Claim.REOPENED_to_IN_PROGRESS
          - entities.Claim.fields.reopen_count
        distinguishing_aspect: "Cycle on Claim (a different entity than Quote): RESOLVED -> REOPENED -> IN_PROGRESS lets a resolved claim loop back into work; reopen_count increments to 1 on the loop."
        test_recipe:
          setup:
            - "A WARRANTED Job with an ACTIVE Warranty and a Claim (WATER_INTRUSION) that has been triaged IN_PROGRESS then RESOLVED via a completed CLAIM_REPAIR visit."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Fin Owner", email: "fin@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/warranted-job"
              payload: { homeowner_id: "${ho_id}" }
              as: WarrantyAdmin
              captures: { job_id: $.data.job_id, warranty_id: $.data.warranty_id }
            - call: "POST /claims"
              payload: { job_id: "${job_id}", warranty_id: "${warranty_id}", category: "WATER_INTRUSION", description: "seepage" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/triage"
              payload: { accept: true }
              as: WarrantyAdmin
            - call: "POST /warranties/${warranty_id}/service-visits"
              payload: { visit_type: "CLAIM_REPAIR", scheduled_for: "2026-04-10T10:00:00Z", claim_id: "${claim_id}" }
              as: WarrantyAdmin
              captures: { sv_id: $.data.id }
            - call: "POST /service-visits/${sv_id}/complete"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "POST /claims/${claim_id}/reopen"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { reopen_status: $.data.status, rc: $.data.reopen_count }
            - call: "POST /claims/${claim_id}/triage"
              payload: { accept: true }
              as: WarrantyAdmin
              captures: { status_after: $.data.status }
          assert:
            - "Claim.${claim_id}.reopen_count == 1"
            - "Claim.${claim_id}.status == IN_PROGRESS"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: install_complete_cascade_depth3
        grounds:
          - state_machines.InstallOrder.PASSED_to_COMPLETED
          - state_machines.Job.SCHEDULED_to_INSTALLED
          - state_machines.CrewBooking.CONFIRMED_to_RELEASED
          - calculations.install_reconciliation
        distinguishing_aspect: "Depth-3 cascade triggered by install complete: complete mutates InstallOrder (PASSED->COMPLETED, computes final_total_cents); that mutation drives Job (SCHEDULED->INSTALLED); the Job's install-completion in turn releases the CONFIRMED CrewBooking (CONFIRMED->RELEASED). Each link is caused by the prior link."
        test_recipe:
          setup:
            - "Job SCHEDULED with InstallOrder in PASSED and a CONFIRMED CrewBooking, financed CASH (Quote B, total 395900)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Gus Owner", email: "gus@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "6 Main St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /jobs/${job_id}/pay-cash"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { jv: $.data.version }
            - call: "POST /jobs/${job_id}/install-orders"
              payload: { scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T17:00:00Z", expected_job_version: "${jv}" }
              as: Scheduler
              captures: { io_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Bravo", home_region: "SOUTH", daily_capacity: 2 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io_id}", window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T17:00:00Z" }
              as: Scheduler
              captures: { cb_id: $.data.id }
            - call: "POST /crew-bookings/${cb_id}/confirm"
              payload: {}
              as: Scheduler
            - call: "POST /install-orders/${io_id}/dispatch"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00Z" }
              as: Scheduler
            - call: "POST /install-orders/${io_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /install-orders/${io_id}/inspect-pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /install-orders/${io_id}/complete"
              payload: {}
              as: Scheduler
              captures: { io_status: $.data.status }
          assert:
            - "InstallOrder.${io_id}.status == COMPLETED"
            - "Job.${job_id}.lifecycle_status == INSTALLED"
            - "CrewBooking.${cb_id}.status == RELEASED"

      - name: warranty_void_cascade_depth2
        grounds:
          - state_machines.Warranty.ACTIVE_to_VOID
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Depth-2 cascade from a different trigger (warranty void, not install complete): voiding the Warranty (ACTIVE->VOID) cascades to its SCHEDULED ServiceVisit (SCHEDULED->CANCELLED). Distinct propagation pattern and origin transition from the install-complete cascade."
        test_recipe:
          setup:
            - "A WARRANTED Job with an ACTIVE Warranty carrying one SCHEDULED ANNUAL ServiceVisit."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Hal Owner", email: "hal@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/warranted-job"
              payload: { homeowner_id: "${ho_id}" }
              as: WarrantyAdmin
              captures: { job_id: $.data.job_id, warranty_id: $.data.warranty_id }
            - call: "POST /warranties/${warranty_id}/service-visits"
              payload: { visit_type: "ANNUAL", scheduled_for: "2026-09-01T10:00:00Z" }
              as: WarrantyAdmin
              captures: { sv_id: $.data.id }
          trigger:
            - call: "POST /warranties/${warranty_id}/void"
              payload: {}
              as: WarrantyAdmin
              captures: { w_status: $.data.status }
          assert:
            - "Warranty.${warranty_id}.status == VOID"
            - "ServiceVisit.${sv_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_finance_limit_on_decide
        grounds:
          - validations[priority=6]
          - validations[priority=13]
        distinguishing_aspect: "Pair category state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 13, ERR_FINANCE_LIMIT_EXCEEDED): deciding an already-APPROVED application that also exceeds the finance ceiling returns ERR_INVALID_STATE because the state check ranks above the fiscal ceiling check."
        test_recipe:
          setup:
            - "A SUBPRIME homeowner's financing application against a quote totaling 1813650 (>1.5M subprime ceiling) that has already been DECLINED (so re-deciding is an invalid state)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Ivy Owner", email: "ivy@x.com", credit_band: "SUBPRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "7 Main St", structure_type: "COMBINED", footprint_sqft: 2000 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 85, structural_findings_count: 2 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_vapor_barrier: true, includes_sump: true, includes_dehumidifier: true, includes_drain: true, includes_battery_backup: true, drain_linear_ft: 100, discount_code: "NONE" }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /financing-applications"
              payload: { job_id: "${job_id}", quote_id: "${quote_id}", term_months: 12 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /financing-applications/${app_id}/decide"
              payload: { decision: "DECLINE" }
              as: FinancePartner
          trigger:
            - call: "POST /financing-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: FinancePartner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "FinancingApplication.${app_id}.status == DECLINED"

      - name: existence_before_referral_eligibility_on_send
        grounds:
          - validations[priority=3]
          - validations[priority=10]
        distinguishing_aspect: "Pair category existence (priority 3, ERR_NOT_FOUND) vs business_safety (priority 10, ERR_REFERRAL_NOT_ELIGIBLE): sending a non-existent referral id returns ERR_NOT_FOUND (existence outranks the eligibility check), a different category pair than the state-vs-fiscal conflict above."
        test_recipe:
          setup:
            - "A Job exists but no FoundationReferral with the queried id exists."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Jo Owner", email: "jo@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "8 Main St", structure_type: "CRAWLSPACE", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /foundation-referrals/00000000-0000-4000-8000-000000000000/send"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: footprint_tier_boundary_800_vs_801
        grounds:
          - calculations.quote_pricing
          - entities.Job.fields.footprint_sqft
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: "Boundary on the footprint-tier metric reached via POST /jobs/{job_id}/quotes: footprint 800 selects TIER_1 base 250000 (<= boundary) while 801 selects TIER_2 base 400000, a >=-style tier breakpoint."
        test_recipe:
          setup:
            - "Two jobs, footprint 800 and 801 respectively, each with a sump-only DRAFT quote."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Kim Owner", email: "kim@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "9 Main St", structure_type: "CRAWLSPACE", footprint_sqft: 800 }
              as: Estimator
              captures: { job800: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "10 Main St", structure_type: "CRAWLSPACE", footprint_sqft: 801 }
              as: Estimator
              captures: { job801: $.data.id }
            - call: "POST /jobs/${job800}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { q800: $.data.id, sub800: $.data.subtotal_cents }
          trigger:
            - call: "POST /jobs/${job801}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { q801: $.data.id, sub801: $.data.subtotal_cents }
          assert:
            - "Quote.${q800}.subtotal_cents == 370000"
            - "Quote.${q801}.subtotal_cents == 520000"

      - name: crew_daily_capacity_zero_remaining_boundary
        grounds:
          - validations[priority=15]
          - state_machines.CrewBooking.RESERVED_to_CONFIRMED
          - entities.Crew.fields.daily_capacity
        distinguishing_aspect: "Empty-remaining-capacity boundary on a different metric and endpoint (POST /crew-bookings/{id}/confirm): a crew with daily_capacity=1 that already has 1 CONFIRMED booking that day has zero remaining slots, so confirming a second same-day booking crosses the >= ceiling and is rejected. Distinct from the numeric footprint tier boundary."
        test_recipe:
          setup:
            - "A crew with daily_capacity=1 and one already-CONFIRMED booking on 2026-05-05; a second RESERVED booking on the same day for a different install order."
          setup_api_calls:
            - call: "POST /crews"
              payload: { name: "Charlie", home_region: "NORTH", daily_capacity: 1 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /homeowners"
              payload: { full_name: "Lee Owner", email: "lee@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/scheduled-job"
              payload: { homeowner_id: "${ho_id}" }
              as: Scheduler
              captures: { io1: $.data.install_order_id }
            - call: "POST /_seed/scheduled-job"
              payload: { homeowner_id: "${ho_id}" }
              as: Scheduler
              captures: { io2: $.data.install_order_id }
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io1}", window_start: "2026-05-05T08:00:00Z", window_end: "2026-05-05T12:00:00Z" }
              as: Scheduler
              captures: { cb1: $.data.id }
            - call: "POST /crew-bookings/${cb1}/confirm"
              payload: {}
              as: Scheduler
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io2}", window_start: "2026-05-05T13:00:00Z", window_end: "2026-05-05T17:00:00Z" }
              as: Scheduler
              captures: { cb2: $.data.id }
          trigger:
            - call: "POST /crew-bookings/${cb2}/confirm"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CREW_CAPACITY_EXCEEDED"
            - "CrewBooking.${cb2}.status == RESERVED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: install_order_requires_job_financing_resolved
        grounds:
          - state_machines.Job.SOLD_to_SCHEDULED
          - validations[priority=12]
          - entities.Job.fields.financing_status
        distinguishing_aspect: "Cross-entity pair InstallOrder<-Job.financing_status: creating an InstallOrder (Job lifecycle SOLD->SCHEDULED) requires Job.financing_status IN {CASH, APPROVED}; with financing_status NONE the create is rejected ERR_FINANCING_UNRESOLVED."
        test_recipe:
          setup:
            - "A SOLD Job (Quote B accepted) whose financing_status is still NONE (no pay-cash, no approved financing)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Mae Owner", email: "mae@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "11 Main St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { jv: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/install-orders"
              payload: { scheduled_start: "2026-05-06T08:00:00Z", scheduled_end: "2026-05-06T17:00:00Z", expected_job_version: "${jv}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FINANCING_UNRESOLVED"
            - "Job.${job_id}.lifecycle_status == SOLD"
            - "Job.${job_id}.financing_status == NONE"

      - name: claim_triage_requires_warranty_active
        grounds:
          - state_machines.Claim.OPEN_to_IN_PROGRESS
          - state_machines.Warranty.ACTIVE_to_VOID
          - entities.Warranty.fields.status
        distinguishing_aspect: "A different cross-entity pair Claim<-Warranty.status: triaging a claim to IN_PROGRESS requires Warranty.status==ACTIVE; once the warranty is VOID the triage is rejected ERR_INVALID_STATE. Distinct entity pair from InstallOrder<-Job."
        test_recipe:
          setup:
            - "A WARRANTED Job with an OPEN WATER_INTRUSION Claim, where the Warranty has since been VOIDED."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Ned Owner", email: "ned@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/warranted-job"
              payload: { homeowner_id: "${ho_id}" }
              as: WarrantyAdmin
              captures: { job_id: $.data.job_id, warranty_id: $.data.warranty_id }
            - call: "POST /claims"
              payload: { job_id: "${job_id}", warranty_id: "${warranty_id}", category: "WATER_INTRUSION", description: "wet" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /warranties/${warranty_id}/void"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "POST /claims/${claim_id}/triage"
              payload: { accept: true }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_booking_half_open_interval_overlap
        grounds:
          - validations[priority=14]
          - state_machines.CrewBooking.RESERVED_to_CONFIRMED
          - entities.CrewBooking.fields.window_start
          - entities.CrewBooking.fields.window_end
        distinguishing_aspect: "Half-open interval geometric overlap on the Crew resource: confirming a booking [10:00,14:00) on a crew that already has a CONFIRMED [12:00,16:00) on the same crew collides (intervals share (12:00,14:00)); a touching [16:00,18:00) would NOT collide under [start,end) semantics."
        test_recipe:
          setup:
            - "A crew with daily_capacity=5 holding one CONFIRMED booking 12:00-16:00 on 2026-05-07, and a second RESERVED booking 10:00-14:00 on the same crew/day."
          setup_api_calls:
            - call: "POST /crews"
              payload: { name: "Delta", home_region: "NORTH", daily_capacity: 5 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /homeowners"
              payload: { full_name: "Ola Owner", email: "ola@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/scheduled-job"
              payload: { homeowner_id: "${ho_id}" }
              as: Scheduler
              captures: { io1: $.data.install_order_id }
            - call: "POST /_seed/scheduled-job"
              payload: { homeowner_id: "${ho_id}" }
              as: Scheduler
              captures: { io2: $.data.install_order_id }
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io1}", window_start: "2026-05-07T12:00:00Z", window_end: "2026-05-07T16:00:00Z" }
              as: Scheduler
              captures: { cb1: $.data.id }
            - call: "POST /crew-bookings/${cb1}/confirm"
              payload: {}
              as: Scheduler
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io2}", window_start: "2026-05-07T10:00:00Z", window_end: "2026-05-07T14:00:00Z" }
              as: Scheduler
              captures: { cb2: $.data.id }
          trigger:
            - call: "POST /crew-bookings/${cb2}/confirm"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CREW_DOUBLE_BOOKED"
            - "CrewBooking.${cb2}.status == RESERVED"

      - name: service_visit_min_gap_buffer_overlap
        grounds:
          - validations[priority=19]
          - entities.ServiceVisit.fields.scheduled_for
          - entities.Warranty.fields.id
        distinguishing_aspect: "Point-with-min-gap buffer semantics on the Warranty resource (different from CrewBooking's geometric interval): two SCHEDULED visits must be >= 7 calendar days apart; a second visit 3 days after a SCHEDULED one collides with ERR_VISIT_TOO_CLOSE even though, as zero-length points, they do not geometrically overlap."
        test_recipe:
          setup:
            - "A WARRANTED Job with an ACTIVE Warranty carrying one SCHEDULED ANNUAL visit on 2026-09-01."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Owner", email: "pat@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/warranted-job"
              payload: { homeowner_id: "${ho_id}" }
              as: WarrantyAdmin
              captures: { job_id: $.data.job_id, warranty_id: $.data.warranty_id }
            - call: "POST /warranties/${warranty_id}/service-visits"
              payload: { visit_type: "ANNUAL", scheduled_for: "2026-09-01T10:00:00Z" }
              as: WarrantyAdmin
              captures: { sv1: $.data.id }
          trigger:
            - call: "POST /warranties/${warranty_id}/service-visits"
              payload: { visit_type: "ANNUAL", scheduled_for: "2026-09-04T10:00:00Z" }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VISIT_TOO_CLOSE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_claim_count_conserved_file_then_deny
        grounds:
          - state_machines.Claim.OPEN_to_DENIED
          - entities.Job.fields.open_claim_count
          - endpoints
        distinguishing_aspect: "Conserved quantity Job.open_claim_count == count(Claims on Job with status IN {OPEN, IN_PROGRESS}): filing a claim raises it from 0 to 1, triage-deny (forward + compensating) lowers it back to 0, leaving the invariant equal to its pre-file value."
        test_recipe:
          setup:
            - "A WARRANTED Job with an ACTIVE Warranty and open_claim_count == 0."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Que Owner", email: "que@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/warranted-job"
              payload: { homeowner_id: "${ho_id}" }
              as: WarrantyAdmin
              captures: { job_id: $.data.job_id, warranty_id: $.data.warranty_id }
            - call: "POST /claims"
              payload: { job_id: "${job_id}", warranty_id: "${warranty_id}", category: "PUMP_FAILURE", description: "dead pump" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/triage"
              payload: { accept: false }
              as: WarrantyAdmin
              captures: { c_status: $.data.status }
          assert:
            - "Claim.${claim_id}.status == DENIED"
            - "Job.${job_id}.open_claim_count == 0"

      - name: schedule_link_conserved_install_create_then_cancel
        grounds:
          - state_machines.Job.SOLD_to_SCHEDULED
          - state_machines.InstallOrder.PLANNED_to_CANCELLED
          - entities.Job.fields.install_order_id
          - entities.Job.fields.lifecycle_status
        distinguishing_aspect: "A different conserved quantity (the Job scheduling link, not a claim count): creating an InstallOrder sets Job.install_order_id and moves lifecycle SOLD->SCHEDULED; cancelling it (compensating action) nulls install_order_id and reverts SCHEDULED->SOLD, so the (lifecycle_status==SOLD AND install_order_id==null) invariant is restored exactly."
        test_recipe:
          setup:
            - "A SOLD Job financed CASH (Quote B) with a freshly created PLANNED InstallOrder (lifecycle SCHEDULED, install_order_id set)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Rae Owner", email: "rae@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "12 Main St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /jobs/${job_id}/pay-cash"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { jv: $.data.version }
            - call: "POST /jobs/${job_id}/install-orders"
              payload: { scheduled_start: "2026-05-08T08:00:00Z", scheduled_end: "2026-05-08T17:00:00Z", expected_job_version: "${jv}" }
              as: Scheduler
              captures: { io_id: $.data.id }
          trigger:
            - call: "POST /install-orders/${io_id}/cancel"
              payload: {}
              as: Scheduler
              captures: { io_status: $.data.status }
          assert:
            - "InstallOrder.${io_id}.status == CANCELLED"
            - "Job.${job_id}.lifecycle_status == SOLD"
            - "Job.${job_id}.install_order_id == null"
