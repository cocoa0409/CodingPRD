        claim_type: violation_to_error
        grounds: [entities.AttestationCycle.fields.due_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Create-time shape rule: open_date < due_date < outreach_close_date is enforced with 400 ERR_INVALID_REQUEST before any state or overlap logic."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
