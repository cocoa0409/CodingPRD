  # ===========================================================================
  - section: rbac
    instances:
      - name: owner_and_contractor_cannot_use_each_others_exclusive_endpoints
        claim_type: exclusive_operation_denied
        grounds:
          - roles[PropertyOwner].exclusive_operations
          - roles[Contractor].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          PropertyOwner and Contractor are peers with disjoint exclusive surfaces, and the denial must be
          403 on the ROLE before any ownership or state check runs: the parcel owner cannot file the
          completion certificate for her own application, the contractor cannot open the application, and
          an unknown role string is 403 rather than 401. The reads they share (GET on the application)
          stay open to both.
        test_recipe:
          setup:
            - "Clock 2026-08-12; enrolled contractor C1 and parcel P1 with a DRAFT application A1 carrying one solar measure, so the target rows for every attempt exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
