        grounds:
          - state_machines.WorkParty.PLANNED_to_CANCELLED
          - state_machines.VolunteerShift.REGISTERED_to_WITHDRAWN
          - state_machines.ConditionReport.TRIAGED_to_SCHEDULED
          - entities.WorkParty.fields.linked_report_count
        distinguishing_aspect: |
          Cancelling a PLANNED party fires a two-target conditional cascade: REGISTERED shifts are
          withdrawn (and the volunteer's active_registration_count drops) while every ConditionReport
          whose linked_work_party_id is this party falls back from SCHEDULED to TRIAGED with the link
          cleared.
