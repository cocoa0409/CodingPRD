      - name: version_submit_gated_on_sibling_deliverables_pending_change_order
        grounds:
          - validations[priority=39]
          - entities.Project.fields.review_gate
          - calculations.change_order_amount
          - state_machines.ChangeOrder.PENDING_APPROVAL_to_APPROVED
          - endpoints[POST /deliverables]
        distinguishing_aspect: |
          Deliverable A's own row is impeccable — PENDING, entitlement 2, consumed 0, QC_PASSED cut in
          DRAFT — yet its submit is refused because a change order raised by a DIFFERENT deliverable
          (B, added after scope lock) has put Project.review_gate in CHANGE_ORDER_PENDING. The gate is a
          project-level state derived from a sibling's child, not any state on A or on the cut itself.
        test_recipe:
          setup:
            - "A project with contracted_revision_rounds 2, scope-locked and budget-approved so it is IN_PRODUCTION, carrying deliverable A"
            - "A QC_PASSED first cut of deliverable A sitting in review_status DRAFT"
            - "Deliverable B created AFTER scope lock, which raised a DELIVERABLE_ADDED_AFTER_SCOPE_LOCK change order of 713000 cents in PENDING_APPROVAL (labor 620000, 122 days to air so rush 0, subtotal 620000 in the 15% band, fee 93000)"
