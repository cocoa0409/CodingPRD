      - name: corner_candidate_two_state_dimensions_independent
        claim_type: parallel
        grounds:
          - state_machines.Candidate.UNSCREENED_to_RF_QUALIFIED
          - state_machines.Candidate.PROSPECTING_to_OUTREACH_SENT
        excluded_because:
          difficulty_instance: non_linear_state_machine / candidate_parallel_dimensions_advance_independently
          rationale: "That instance already asserts each dimension advancing without disturbing the other."

      - name: corner_zoning_incompleteness_loop_repeatable
        claim_type: cyclic
        grounds:
          - state_machines.ZoningApplication.UNDER_REVIEW_to_INCOMPLETE
          - state_machines.ZoningApplication.INCOMPLETE_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / zoning_tolling_cycle_repeats_and_accrues_days
          rationale: "That instance drives the loop twice and pins the per-cure tolling accrual."

      - name: corner_environmental_join_requires_both_branches
        claim_type: branching
        grounds:
          - state_machines.EnvironmentalReview.SCREENING_to_IN_CONSULTATION
          - state_machines.EnvironmentalReview.IN_CONSULTATION_to_CLEARED
        excluded_because:
          difficulty_instance: non_linear_state_machine / environmental_fork_join_requires_both_branches_complete
          rationale: "That instance asserts the fork, the single-branch join gap and the final join."

      - name: corner_structural_fail_cascades_down
        claim_type: cascade_down
        grounds:
          - state_machines.StructuralAnalysis.IN_PROGRESS_to_COMPLETED
          - state_machines.Candidate.STRUCTURAL_HOLD_to_DISQUALIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / structural_fail_cascades_to_backhaul_cancellation_and_crew_ledger
          rationale: "That instance verifies all four cascade links end to end, including the provider ledger."

      - name: corner_landlord_blacklist_ledger_sync
        claim_type: ledger_sync
        grounds:
          - state_machines.LeaseAgreement.EXECUTED_to_TERMINATED
          - calculations.landlord_executed_lease_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / landlord_blacklist_cascades_to_ring_unselection
          rationale: "That instance asserts the landlord ledger and the ring unselection produced by the blacklist cascade."

