        excluded_because:
          difficulty_instance: cross_entity_state_dependency / monitor_approval_requires_effective_method_designation
          rationale: "The cross-entity guard on Monitor approval - the method's designation_status and effective_from against the clock - is the subject of the named difficulty instance."

