          - state_machines.ExamRequirement.PASSED_to_EXPIRED
          - calculations.exam_credit_window
        distinguishing_aspect: |
          ExamRequirement (different entity from RegistrationRequest) runs the
          cycle SCHEDULED -> REQUIRED on FAIL, re-schedules, passes, then the
          one-way PASSED -> EXPIRED system flip fires at exactly
          credit_expiry_at while the parent request is still DRAFT — two
