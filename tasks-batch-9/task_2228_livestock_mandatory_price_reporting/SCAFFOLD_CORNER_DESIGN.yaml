      - name: species_threshold_constants_swine_and_lamb
        claim_type: constants_applied
        grounds:
          - calculations.reporter_threshold_determination.constants.THRESHOLD_HEAD_BY_SPECIES
        distinguishing_aspect: |
          The two non-cattle rows of THRESHOLD_HEAD_BY_SPECIES, each pinned one
          head off its own floor in the opposite direction: SWINE measured 99999
          against 100000 is EXEMPT, LAMB measured 40000 against 35000 is
          MANDATORY. Proves the constant is looked up per species rather than
          hard-coded to the cattle floor of 125000.
        test_recipe:
          setup:
            - "Two firms: Swine Co (SWINE) with plant history 99999 in each of the five lookback years, and Lamb Co (LAMB) with plant history 40000 in each of the five lookback years."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Swine Co", entity_type: "PACKER", species_scope: "SWINE" }
