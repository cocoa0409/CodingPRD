  - rule_id: resource_temporal_overlap
    instances:

      - name: unit_tract_allocation_half_open_intervals_allow_adjacency_reject_overlap
        grounds:
          - validations[priority=66]
          - errors[ERR_ALLOCATION_INTERVAL_OVERLAP]
          - entities.UnitTractAllocation.fields.effective_from
          - entities.UnitTractAllocation.fields.effective_to
          - endpoints[POST /unit-tract-allocations]
        overlap_semantics:
          resource_entity: Unit
          interval_kind: half_open
          endpoints_touch_allowed: true
        distinguishing_aspect: |
          The contended resource is the (unit_id, tract_id) occupancy slot on a Unit and the
          interval is half-open [effective_from, effective_to), so a new allocation starting
          exactly on the incumbent's effective_to is accepted while one starting a single day
          earlier is rejected with ERR_ALLOCATION_INTERVAL_OVERLAP. Both attempts are well
          inside the unit's acreage capacity, so the temporal rule is isolated from the
          capacity rule.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "a CERTIFIED tract and a Unit with unit_gross_acres 1280.0000 owned by op-user-001"
            - "one ACTIVE allocation of that tract for [2026-01-01, 2028-01-01) holding 320.0000 acres"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t15: $.data.id }
            - call: "POST /tracts/${t15}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
