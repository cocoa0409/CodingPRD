            - "the 2027-02-13 create returns 409 and err_buf == ERR_OCCUPANCY_CONFLICT  (gap 13 < 14)"
            - "the strictly-inside create returns 409 and err_inside == ERR_OCCUPANCY_CONFLICT"
            - "the failed creates did not advance the line review version (the second 409 reused ${lr_v4} successfully)"
            - "GET /planogram-slots?line_review_id=${lr_id} returns exactly 2 rows (S1 and the 02-14 slot)"

