              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Adeyemi, Tunde", passenger_ref: "PNR9K3L", itinerary_type: "DOMESTIC", weight_lb: 40, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_low: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f2}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 40, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_high: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f3}", passenger_name: "Okafor, Ben", passenger_ref: "PNR4M1T", itinerary_type: "DOMESTIC", weight_lb: 40, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_edge: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f2}", passenger_name: "Nakamura, Yui", passenger_ref: "PNR2W8H", itinerary_type: "DOMESTIC", weight_lb: 40, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_over: $.data.id }
          trigger:
            - call: "POST /baggage/bags/${b_low}/weigh"
              payload: { scale_weight_lb: 50.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${b_high}/weigh"
              payload: { scale_weight_lb: 54.4 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${b_edge}/weigh"
              payload: { scale_weight_lb: 55.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${b_over}/weigh"
              payload: { scale_weight_lb: 55.1 }
              as: AcceptanceAgent
          assert:
            - "Bag.${b_low}.excess_weight_fee_cents == 0 (scale reading 50.0 is exactly the threshold, and the test is <=, not <)"
            - "Bag.${b_high}.excess_weight_fee_cents == 7500 (4.4 lb over is one group, because ceil(4.4/5) == 1)"
            - "Bag.${b_edge}.excess_weight_fee_cents == 7500 (5.0 lb over is still ceil(5.0/5) == 1 group, because the boundary is > not >=)"
            - "Bag.${b_over}.excess_weight_fee_cents == 15000 (ceil(5.1/5) == 2 groups) — the crossing sits strictly between 55.0 and 55.1"
            - "the scale reading is rounded to a whole pound BEFORE the ceiling is taken, so a reading of 54.6 lb also yields 7500 rather than 15000"

