# =============================================================================
# 988 Crisis Line & Mobile Crisis Dispatch — Scaffold (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: "988 Crisis Line & Mobile Crisis Dispatch: multi-channel intake & risk screening, de-escalation & safety plan, warm transfer & mobile-crisis dispatch, crisis-receiving-center/bed referral, follow-up & wellness check, 911 coordination, repeat-caller registry, reporting"

domain_name: crisis-line-dispatch
api_prefix: ""   # flat topology: every entity is its own top-level collection; no shared non-trivial prefix

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat          # peer entities linked by foreign keys; no nested URL paths
  state_machine_shape: branching # Contact forks at SCREENED and cycles DISPATCH_PENDING<->REFERRAL_PENDING
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override  # ClinicalSupervisor is a superset of CrisisCounselor + CrisisDispatcher
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: {limit: 10, min: 1, max: 100, offset: 0}

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contact
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: channel, type: enum, source: input, description: "Intake channel", constraints: "one of PHONE, CHAT, TEXT" }
      - { name: caller_key, type: string, source: input, description: "Stable hashed caller identifier; links to RepeatCaller.caller_key (unique) by equality, NOT a foreign key" }
      - { name: caller_phone, type: string, source: input, description: "Optional caller phone number" }
      - { name: caller_name, type: string, source: input, description: "Optional caller name" }
      - { name: presenting_concern, type: string, source: input, description: "Optional free-text presenting concern" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of INTAKE, SCREENED, DE_ESCALATION, DISPATCH_PENDING, REFERRAL_PENDING, EMERGENCY_911, RESOLVED, CLOSED" }
      - { name: risk_score, type: integer, source: computed, description: "Risk score copied from the latest RiskScreening (null until first screening)" }
      - { name: risk_band, type: enum, source: computed, description: "Band copied from the latest RiskScreening", constraints: "one of LOW, MODERATE, HIGH, IMMINENT or null" }
      - { name: latest_screening_id, type: string, source: computed, description: "Id of the RiskScreening for this contact with the greatest created_at (ties: greatest id lexical only as a display convenience, never a decision input); null until first screening" }
      - { name: disposition, type: enum, source: computed, description: "Disposition chosen when leaving SCREENED", constraints: "one of DE_ESCALATION, MOBILE_DISPATCH, EMERGENCY or null" }
      - { name: disposition_at, type: datetime, source: computed, description: "Logical-clock timestamp when disposition was set (contact left SCREENED)" }
      - { name: has_active_safety_plan, type: boolean, source: computed, description: "True iff a SafetyPlan for this contact is in status ACTIVE", default: false }
      - { name: emergency_status, type: enum, source: computed, description: "911 coordination status", constraints: "one of NONE, INITIATED", default: "NONE" }
      - { name: repeat_caller_flag, type: boolean, source: computed, description: "Snapshot of RepeatCaller.high_risk_flag captured at intake", default: false }

  - name: RiskScreening
    parent: null
    common_fields: true
    fields:
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id" }
      - { name: screening_type, type: enum, source: input, description: "Which scoring variant to apply", constraints: "one of PROVISIONAL, COMPREHENSIVE" }
      - { name: suicidal_ideation, type: integer, source: input, description: "Ideation severity 0-3", constraints: "0..3" }
      - { name: plan_specificity, type: integer, source: input, description: "Plan specificity 0-3", constraints: "0..3" }
      - { name: means_access, type: boolean, source: input, description: "Whether caller has access to lethal means" }
      - { name: prior_attempts, type: integer, source: input, description: "Count of prior attempts (raw, capped in formula)", constraints: ">= 0" }
      - { name: protective_factors, type: integer, source: input, description: "Count of protective factors (raw, capped in formula)", default: 0, constraints: ">= 0" }
      - { name: risk_score, type: integer, source: computed, description: "Computed by risk_screening_score; floored at 0" }
      - { name: risk_band, type: enum, source: computed, description: "Band from risk_score thresholds", constraints: "one of LOW, MODERATE, HIGH, IMMINENT" }

  - name: SafetyPlan
    parent: null
    common_fields: true
    fields:
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id" }
      - { name: coping_strategies, type: array, source: input, description: "List of coping strategies" }
      - { name: warning_signs, type: array, source: input, description: "List of personal warning signs" }
      - { name: support_contacts, type: array, source: input, description: "Optional list of support contacts" }
      - { name: lethal_means_counseling, type: boolean, source: input, description: "Whether means-restriction counseling was delivered", default: false }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of DRAFT, ACTIVE, ARCHIVED" }

  - name: MobileCrisisTeam
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team display name" }
      - { name: coverage_zone, type: string, source: input, description: "Geographic coverage zone code" }
      - { name: capacity, type: integer, source: input, description: "Max concurrent active dispatches", default: 1, constraints: ">= 1" }
      - { name: shift_start, type: datetime, source: input, description: "Shift window start (inclusive)" }
      - { name: shift_end, type: datetime, source: input, description: "Shift window end (exclusive)" }
      - { name: status, type: enum, source: input, description: "Availability set at creation", constraints: "one of ON_SHIFT, OFF_SHIFT", default: "ON_SHIFT" }
      - { name: active_dispatch_count, type: integer, source: computed, description: "Count of MobileDispatch rows for this team in status REQUESTED, EN_ROUTE, or ON_SCENE", default: 0 }

  - name: MobileDispatch
    parent: null
    common_fields: true
    fields:
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id" }
      - { name: team_id, type: string, source: input, description: "FK -> MobileCrisisTeam.id" }
      - { name: window_start, type: datetime, source: input, description: "Requested on-scene window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Requested on-scene window end (exclusive)" }
      - { name: requested_acuity, type: enum, source: input, description: "Acuity at request time", constraints: "one of LOW, MODERATE, HIGH, IMMINENT" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of REQUESTED, EN_ROUTE, ON_SCENE, COMPLETED, CANCELLED" }
      - { name: on_scene_acuity, type: enum, source: computed, description: "Acuity reported on arrival (from on_scene_acuity input on the ON_SCENE transition); null until ON_SCENE", constraints: "one of LOW, MODERATE, HIGH, IMMINENT or null" }
      - { name: priority_score_estimated, type: integer, source: computed, description: "dispatch_priority_score ESTIMATED variant, pinned at creation" }
      - { name: priority_score_reassessed, type: integer, source: computed, description: "dispatch_priority_score REASSESSED variant, pinned at ON_SCENE; null before ON_SCENE" }

  - name: CrisisCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Receiving-center display name" }
      - { name: bed_capacity, type: integer, source: input, description: "Total crisis beds", constraints: ">= 1" }
      - { name: accepted_acuities, type: array, source: input, description: "Acuity bands this center accepts", constraints: "subset of {LOW, MODERATE, HIGH, IMMINENT}" }
      - { name: status, type: enum, source: system, description: "Availability", constraints: "one of ONLINE, DIVERTED", default: "ONLINE" }
      - { name: held_beds, type: integer, source: computed, description: "Count of BedReferral rows for this center in status HELD", default: 0 }
      - { name: occupied_beds, type: integer, source: computed, description: "Count of BedReferral rows for this center in status ADMITTED", default: 0 }
      - { name: available_beds, type: integer, source: computed, description: "= bed_capacity - held_beds - occupied_beds" }

  - name: BedReferral
    parent: null
    common_fields: true
    fields:
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id" }
      - { name: crisis_center_id, type: string, source: input, description: "FK -> CrisisCenter.id" }
      - { name: mobile_dispatch_id, type: string, source: input, description: "FK -> MobileDispatch.id; optional, set when the referral originates from an on-scene team" }
      - { name: acuity, type: enum, source: input, description: "Acuity of the referral", constraints: "one of LOW, MODERATE, HIGH, IMMINENT" }
      - { name: window_start, type: datetime, source: input, description: "Bed-hold window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Bed-hold window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of HELD, ADMITTED, DISCHARGED, VOIDED" }

  - name: FollowUpTask
    parent: null
    common_fields: true
    fields:
      - { name: contact_id, type: string, source: system, description: "FK -> Contact.id" }
      - { name: scheduled_at, type: datetime, source: computed, description: "Logical-clock time the outreach is due; set on creation and reset on RESCHEDULED" }
      - { name: channel, type: enum, source: computed, description: "Outreach channel mirrored from the Contact", constraints: "one of PHONE, CHAT, TEXT" }
      - { name: outcome, type: enum, source: computed, description: "Latest attempt outcome", constraints: "one of REACHED, NO_ANSWER or null" }
      - { name: attempt_count, type: integer, source: computed, description: "Number of outreach attempts made", default: 0 }
      - { name: max_attempts, type: integer, source: system, description: "Attempts allowed before ABANDONED", default: 3 }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of SCHEDULED, ATTEMPTED, RESCHEDULED, COMPLETED, ABANDONED" }

  - name: EmergencyCoordination
    parent: null
    common_fields: false   # append-only 911 handoff record: only id + created_at
    fields:
      - { name: contact_id, type: string, source: system, description: "FK -> Contact.id" }
      - { name: psap_reference, type: string, source: system, description: "Reference token for the PSAP (911 center) handoff" }
      - { name: risk_band_at_escalation, type: enum, source: system, description: "Contact risk_band captured at escalation", constraints: "one of LOW, MODERATE, HIGH, IMMINENT" }
      - { name: initiated_by_role, type: string, source: system, description: "Role that triggered the 911 handoff" }

  - name: RepeatCaller
    parent: null
    common_fields: true
    fields:
      - { name: caller_key, type: string, source: system, description: "Unique caller identifier; upserted from Contact.caller_key" }
      - { name: contact_count, type: integer, source: computed, description: "Number of Contact rows with this caller_key", default: 0 }
      - { name: last_risk_band, type: enum, source: computed, description: "risk_band of the most recent screened Contact for this caller_key", constraints: "one of LOW, MODERATE, HIGH, IMMINENT or null" }
      - { name: high_risk_flag, type: boolean, source: computed, description: "= (contact_count >= REPEAT_FLAG_THRESHOLD) OR (last_risk_band == IMMINENT)", default: false }
      - { name: registry_status, type: enum, source: system, description: "Registry lifecycle", constraints: "one of ACTIVE", default: "ACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contact
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: SCREENED
        trigger: "POST /risk-screenings (first screening for this contact)"
        actor: CrisisCounselor
        preconditions:
          - "contact.status == INTAKE"
        side_effects:
          - "Set contact.risk_score and contact.risk_band from the new RiskScreening"
          - "Set contact.latest_screening_id to the new screening id"
          - "Upsert RepeatCaller for caller_key: set last_risk_band and recompute high_risk_flag (repeat_caller_high_risk)"

      - from: SCREENED
        to: DE_ESCALATION
        trigger: "POST /contacts/{contactId}/state {to_status: DE_ESCALATION}"
        actor: CrisisCounselor
        preconditions:
          - "contact.status == SCREENED"
          - "contact.risk_band IN {LOW, MODERATE} else ERR_DISPOSITION_NOT_ALLOWED"
        side_effects:
          - "Set disposition = DE_ESCALATION, disposition_at = logical clock now"

      - from: SCREENED
        to: DISPATCH_PENDING
        trigger: "POST /contacts/{contactId}/state {to_status: DISPATCH_PENDING}"
        actor: CrisisDispatcher
        preconditions:
          - "contact.status == SCREENED"
          - "contact.risk_band == HIGH else ERR_DISPOSITION_NOT_ALLOWED"
        side_effects:
          - "Set disposition = MOBILE_DISPATCH, disposition_at = logical clock now"

      - from: SCREENED
        to: EMERGENCY_911
        trigger: "POST /contacts/{contactId}/state {to_status: EMERGENCY_911}"
        actor: CrisisDispatcher
        preconditions:
          - "contact.status == SCREENED"
          - "contact.risk_band == IMMINENT else ERR_DISPOSITION_NOT_ALLOWED"
        side_effects:
          - "Set disposition = EMERGENCY, disposition_at = now, emergency_status = INITIATED"
          - "Create EmergencyCoordination {contact_id, risk_band_at_escalation = risk_band, initiated_by_role = acting role}"

      - from: DE_ESCALATION
        to: RESOLVED
        trigger: "POST /contacts/{contactId}/state {to_status: RESOLVED}"
        actor: CrisisCounselor
        preconditions:
          - "contact.status == DE_ESCALATION"
          - "contact.has_active_safety_plan == true else ERR_NO_ACTIVE_SAFETY_PLAN"
        side_effects:
          - "Create FollowUpTask {contact_id, status = SCHEDULED, attempt_count = 0, channel = contact.channel, scheduled_at = now + FOLLOWUP_DELAY_MINUTES (FOLLOWUP_DELAY_MINUTES = 1440)}"

      - from: DISPATCH_PENDING
        to: REFERRAL_PENDING
        trigger: "POST /bed-referrals (referral created for this contact)"
        actor: CrisisDispatcher
        preconditions:
          - "contact.status == DISPATCH_PENDING"
        side_effects:
          - "A BedReferral is created in status HELD (see BedReferral machine)"
        note: "This edge plus REFERRAL_PENDING->DISPATCH_PENDING forms the DISPATCH_PENDING<->REFERRAL_PENDING revision cycle."

      - from: REFERRAL_PENDING
        to: DISPATCH_PENDING
        trigger: "System: a HELD BedReferral for this contact transitions to VOIDED"
        actor: system
        preconditions:
          - "contact.status == REFERRAL_PENDING"
        side_effects: []
        note: "Fires from BedReferral HELD->VOIDED whether triggered manually or by the CrisisCenter DIVERT cascade."

      - from: REFERRAL_PENDING
        to: RESOLVED
        trigger: "System: the contact's BedReferral transitions HELD->ADMITTED"
        actor: system
        preconditions:
          - "contact.status == REFERRAL_PENDING"
        side_effects:
          - "Create FollowUpTask {contact_id, status = SCHEDULED, attempt_count = 0, channel = contact.channel, scheduled_at = now + FOLLOWUP_DELAY_MINUTES (FOLLOWUP_DELAY_MINUTES = 1440)}"

      - from: DISPATCH_PENDING
        to: RESOLVED
        trigger: "System: the contact's MobileDispatch transitions ON_SCENE->COMPLETED"
        actor: system
        preconditions:
          - "contact.status == DISPATCH_PENDING"
        side_effects:
          - "Create FollowUpTask {contact_id, status = SCHEDULED, attempt_count = 0, channel = contact.channel, scheduled_at = now + FOLLOWUP_DELAY_MINUTES (FOLLOWUP_DELAY_MINUTES = 1440)}"

      - from: DISPATCH_PENDING
        to: EMERGENCY_911
        trigger: "POST /contacts/{contactId}/state {to_status: EMERGENCY_911}"
        actor: CrisisDispatcher
        preconditions:
          - "contact.status == DISPATCH_PENDING"
        side_effects:
          - "Cancel the contact's active MobileDispatch (status in REQUESTED, EN_ROUTE, ON_SCENE) -> CANCELLED, if any"
          - "Set emergency_status = INITIATED; Create EmergencyCoordination {contact_id, risk_band_at_escalation = risk_band, initiated_by_role = acting role}"

      - from: REFERRAL_PENDING
        to: EMERGENCY_911
        trigger: "POST /contacts/{contactId}/state {to_status: EMERGENCY_911}"
        actor: CrisisDispatcher
        preconditions:
          - "contact.status == REFERRAL_PENDING"
        side_effects:
          - "Cancel the contact's active MobileDispatch (status in REQUESTED, EN_ROUTE, ON_SCENE) -> CANCELLED, if any (this begins the escalate cascade: dispatch CANCELLED voids the linked HELD BedReferral, whose VOIDED decrements CrisisCenter.held_beds)"
          - "Set emergency_status = INITIATED; Create EmergencyCoordination {contact_id, risk_band_at_escalation = risk_band, initiated_by_role = acting role}"

      - from: DE_ESCALATION
        to: EMERGENCY_911
        trigger: "POST /contacts/{contactId}/state {to_status: EMERGENCY_911}"
        actor: CrisisCounselor
        preconditions:
          - "contact.status == DE_ESCALATION"
        side_effects:
          - "Set emergency_status = INITIATED; Create EmergencyCoordination {contact_id, risk_band_at_escalation = risk_band, initiated_by_role = acting role}"

      - from: EMERGENCY_911
        to: RESOLVED
        trigger: "POST /contacts/{contactId}/state {to_status: RESOLVED}"
        actor: CrisisDispatcher
        preconditions:
          - "contact.status == EMERGENCY_911"
        side_effects:
          - "Create FollowUpTask {contact_id, status = SCHEDULED, attempt_count = 0, channel = contact.channel, scheduled_at = now + FOLLOWUP_DELAY_MINUTES (FOLLOWUP_DELAY_MINUTES = 1440)}"

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /contacts/{contactId}/state {to_status: CLOSED}"
        actor: ClinicalSupervisor
        preconditions:
          - "contact.status == RESOLVED"
        side_effects: []

  - entity: SafetyPlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /safety-plans/{safetyPlanId}/state {to_status: ACTIVE}"
        actor: CrisisCounselor
        preconditions:
          - "safety_plan.status == DRAFT"
        side_effects:
          - "Any other SafetyPlan for the same contact currently ACTIVE -> ARCHIVED"
          - "Set contact.has_active_safety_plan = true"

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /safety-plans/{safetyPlanId}/state {to_status: ARCHIVED}"
        actor: CrisisCounselor
        preconditions:
          - "safety_plan.status == ACTIVE"
        side_effects:
          - "If no remaining ACTIVE SafetyPlan for the contact, set contact.has_active_safety_plan = false"

      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /safety-plans/{safetyPlanId}/state {to_status: ARCHIVED}"
        actor: CrisisCounselor
        preconditions:
          - "safety_plan.status == DRAFT"
        side_effects: []

  - entity: MobileDispatch
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: EN_ROUTE
        trigger: "POST /mobile-dispatches/{dispatchId}/state {to_status: EN_ROUTE}"
        actor: CrisisDispatcher
        preconditions:
          - "dispatch.status == REQUESTED"
        side_effects: []

      - from: EN_ROUTE
        to: ON_SCENE
        trigger: "POST /mobile-dispatches/{dispatchId}/state {to_status: ON_SCENE, on_scene_acuity}"
        actor: CrisisDispatcher
        preconditions:
          - "dispatch.status == EN_ROUTE"
        side_effects:
          - "Set on_scene_acuity from request"
          - "Recompute priority_score_reassessed via dispatch_priority_score REASSESSED variant"

      - from: ON_SCENE
        to: COMPLETED
        trigger: "POST /mobile-dispatches/{dispatchId}/state {to_status: COMPLETED}"
        actor: CrisisDispatcher
        preconditions:
          - "dispatch.status == ON_SCENE"
        side_effects:
          - "Decrement MobileCrisisTeam.active_dispatch_count by 1; increment MobileCrisisTeam.version by 1"
          - "If linked contact.status == DISPATCH_PENDING, transition contact DISPATCH_PENDING->RESOLVED (schedules FollowUpTask)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /mobile-dispatches/{dispatchId}/state {to_status: CANCELLED}"
        actor: CrisisDispatcher
        preconditions:
          - "dispatch.status == REQUESTED"
        side_effects:
          - "Decrement MobileCrisisTeam.active_dispatch_count by 1; increment MobileCrisisTeam.version by 1"
          - "Void any linked HELD BedReferral (BedReferral.mobile_dispatch_id == this dispatch) -> VOIDED (cascade continues into CrisisCenter.held_beds)"

      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /mobile-dispatches/{dispatchId}/state {to_status: CANCELLED}"
        actor: CrisisDispatcher
        preconditions:
          - "dispatch.status == EN_ROUTE"
        side_effects:
          - "Decrement MobileCrisisTeam.active_dispatch_count by 1; increment MobileCrisisTeam.version by 1"
          - "Void any linked HELD BedReferral -> VOIDED (cascade continues into CrisisCenter.held_beds)"

      - from: ON_SCENE
        to: CANCELLED
        trigger: "POST /mobile-dispatches/{dispatchId}/state {to_status: CANCELLED}"
        actor: CrisisDispatcher
        preconditions:
          - "dispatch.status == ON_SCENE"
        side_effects:
          - "Decrement MobileCrisisTeam.active_dispatch_count by 1; increment MobileCrisisTeam.version by 1"
          - "Void any linked HELD BedReferral -> VOIDED (cascade continues into CrisisCenter.held_beds)"

  - entity: CrisisCenter
    initial_state: ONLINE
    terminal_states: []
    transitions:
      - from: ONLINE
        to: DIVERTED
        trigger: "POST /crisis-centers/{centerId}/state {to_status: DIVERTED}"
        actor: CrisisDispatcher
        preconditions:
          - "center.status == ONLINE"
        side_effects:
          - "For every BedReferral for this center in status HELD: transition HELD->VOIDED (each VOIDED decrements held_beds and reverts its contact REFERRAL_PENDING->DISPATCH_PENDING)"
          - "Increment CrisisCenter.version by 1"

      - from: DIVERTED
        to: ONLINE
        trigger: "POST /crisis-centers/{centerId}/state {to_status: ONLINE}"
        actor: CrisisDispatcher
        preconditions:
          - "center.status == DIVERTED"
        side_effects:
          - "Increment CrisisCenter.version by 1"

  - entity: BedReferral
    initial_state: HELD
    terminal_states: [DISCHARGED, VOIDED]
    transitions:
      - from: HELD
        to: ADMITTED
        trigger: "POST /bed-referrals/{referralId}/state {to_status: ADMITTED}"
        actor: CrisisDispatcher
        preconditions:
          - "referral.status == HELD"
          - "CrisisCenter.status == ONLINE else ERR_CENTER_OFFLINE"
        side_effects:
          - "Decrement CrisisCenter.held_beds by 1; increment CrisisCenter.occupied_beds by 1"
          - "If linked contact.status == REFERRAL_PENDING, transition contact REFERRAL_PENDING->RESOLVED (schedules FollowUpTask)"

      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /bed-referrals/{referralId}/state {to_status: DISCHARGED}"
        actor: CrisisDispatcher
        preconditions:
          - "referral.status == ADMITTED"
        side_effects:
          - "Decrement CrisisCenter.occupied_beds by 1"

      - from: HELD
        to: VOIDED
        trigger: "POST /bed-referrals/{referralId}/state {to_status: VOIDED}; or system cascade from dispatch cancel / center divert"
        actor: CrisisDispatcher
        preconditions:
          - "referral.status == HELD"
        side_effects:
          - "Decrement CrisisCenter.held_beds by 1"
          - "If linked contact.status == REFERRAL_PENDING (and the contact is not being escalated to EMERGENCY_911 in the same request), transition contact REFERRAL_PENDING->DISPATCH_PENDING"

  - entity: FollowUpTask
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: ATTEMPTED
        trigger: "POST /follow-up-tasks/{taskId}/attempt {outcome, next_scheduled_at?}"
        actor: CrisisCounselor
        preconditions:
          - "task.status == SCHEDULED"
        side_effects:
          - "Increment attempt_count by 1; set outcome from request"
          - "If outcome == REACHED -> COMPLETED"
          - "If outcome == NO_ANSWER and attempt_count >= max_attempts -> ABANDONED, else -> RESCHEDULED (set scheduled_at = next_scheduled_at)"
        note: "The to-state (ATTEMPTED is transient) resolves in the same request to COMPLETED, ABANDONED, or RESCHEDULED per outcome and the attempt_count >= max_attempts boundary."

      - from: RESCHEDULED
        to: ATTEMPTED
        trigger: "POST /follow-up-tasks/{taskId}/attempt {outcome, next_scheduled_at?}"
        actor: CrisisCounselor
        preconditions:
          - "task.status == RESCHEDULED"
        side_effects:
          - "Increment attempt_count by 1; set outcome from request"
          - "If outcome == REACHED -> COMPLETED"
          - "If outcome == NO_ANSWER and attempt_count >= max_attempts -> ABANDONED, else -> RESCHEDULED (set scheduled_at = next_scheduled_at)"
        note: "RESCHEDULED->ATTEMPTED->RESCHEDULED is the wellness-check retry cycle."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: bed-referral-create-stale-center
    parent_entity: CrisisCenter
    write_endpoint: "POST /bed-referrals"
    occ_field: "expected_crisis_center_version"
    description: |
      Creating a BedReferral against a CrisisCenter whose version has advanced
      since the client last observed it is rejected. Another writer has just
      created (or voided) a bed hold on the same center, so the current writer's
      view of the center's bed availability is stale. Stated as a stale-version
      check, not in terms of overlapping requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-create-stale-team
    parent_entity: MobileCrisisTeam
    write_endpoint: "POST /mobile-dispatches"
    occ_field: "expected_team_version"
    description: |
      Creating a MobileDispatch against a MobileCrisisTeam whose version has
      advanced since the client last observed it is rejected. Another writer has
      just reserved (or released) a slot on the same team, so the current
      writer's view of the team's remaining capacity is stale. Stated as a
      stale-version check, not in terms of overlapping requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_screening_score
    trigger: "POST /risk-screenings"
    algorithm: weighted_scoring
    formula: |
      raw = min(suicidal_ideation, 3) * IDEATION_WEIGHT
          + min(plan_specificity, 3) * PLAN_WEIGHT
          + (means_access ? MEANS_POINTS : 0)
          + min(prior_attempts, PRIOR_CAP) * PRIOR_WEIGHT
          - protective_term
      risk_score = max(raw, 0)         # floor at 0
      # Banding thresholds (evaluate top-down):
      risk_band = IMMINENT if risk_score >= IMMINENT_THRESHOLD
                = HIGH     if risk_score >= HIGH_THRESHOLD
                = MODERATE if risk_score >= MODERATE_THRESHOLD
                = LOW      otherwise
    input_set: "Fields of the single RiskScreening being created; no cross-row aggregation."
    constants:
      IDEATION_WEIGHT: 3
      PLAN_WEIGHT: 4
      MEANS_POINTS: 5
      PRIOR_WEIGHT: 2
      PRIOR_CAP: 3
      PROTECTIVE_WEIGHT: 2
      PROTECTIVE_CAP: 3
      IMMINENT_THRESHOLD: 20
      HIGH_THRESHOLD: 12
      MODERATE_THRESHOLD: 6
    precision: "integer arithmetic; no rounding"
    variants:
      - name: PROVISIONAL
        when: "screening_type == PROVISIONAL (rapid intake triage before protective factors are assessed)"
        difference: "protective_term = 0 (protective_factors ignored), yielding a higher score for identical inputs"
      - name: COMPREHENSIVE
        when: "screening_type == COMPREHENSIVE (full assessment)"
        difference: "protective_term = min(protective_factors, PROTECTIVE_CAP) * PROTECTIVE_WEIGHT (protective factors reduce the score), yielding a lower score and possibly a lower band for identical inputs"

  - name: dispatch_priority_score
    trigger: "POST /mobile-dispatches (ESTIMATED) and MobileDispatch EN_ROUTE->ON_SCENE (REASSESSED)"
    algorithm: weighted_scoring
    formula: |
      band_weight = BAND_WEIGHT[band]                       # IMMINENT=100, HIGH=60, MODERATE=30, LOW=10
      wait_minutes = floor((clock_now - contact.created_at) / 60000)   # ms -> whole minutes
      wait_penalty = min(floor(wait_minutes / WAIT_STEP_MINUTES), WAIT_STEP_CAP) * WAIT_STEP_POINTS
      repeat_bonus = (RepeatCaller.high_risk_flag for contact.caller_key) ? REPEAT_BONUS : 0
      priority = band_weight + wait_penalty + repeat_bonus
    input_set: "One MobileDispatch, its Contact, and the RepeatCaller row keyed by contact.caller_key."
    constants:
      BAND_WEIGHT: {IMMINENT: 100, HIGH: 60, MODERATE: 30, LOW: 10}
      WAIT_STEP_MINUTES: 10
      WAIT_STEP_POINTS: 4
      WAIT_STEP_CAP: 5
      REPEAT_BONUS: 15
    precision: "integer arithmetic; wait_minutes floored"
    variants:
      - name: ESTIMATED
        when: "computed at dispatch creation, stored in priority_score_estimated"
        difference: "band = contact.risk_band (the disposition-time band); wait_minutes measured at the creation clock"
      - name: REASSESSED
        when: "computed at EN_ROUTE->ON_SCENE, stored in priority_score_reassessed"
        difference: "band = on_scene_acuity supplied on the ON_SCENE transition; wait_minutes measured at the (later) ON_SCENE clock — both inputs can differ from ESTIMATED, so the two scores diverge for the same dispatch"

  - name: avg_time_to_disposition
    trigger: "GET /reports/operations"
    algorithm: aggregation
    formula: |
      # Population: Contacts with disposition_at != null whose disposition_at is within [window_start, window_end)
      # (inclusive start, exclusive end); if the window params are omitted, all such contacts.
      for each contact c in population:
        c_minutes = round_half_up((c.disposition_at - c.created_at) / 60000)   # PER-CONTACT round FIRST, to integer minutes
      if population is empty: avg_time_to_disposition_minutes = 0.0            # empty-set boundary
      else:
        avg_time_to_disposition_minutes = round_half_up(sum(c_minutes) / count(population), 1)
    input_set: "Contacts with a non-null disposition_at inside the report window."
    constants: {}
    precision: "PINNED ORDER: round each contact's minutes to an integer (round_half_up) BEFORE summing; then divide; then round the mean to 1 decimal (round_half_up). Sum-then-round is explicitly NOT used."

  - name: center_bed_ledger
    trigger: "any BedReferral status change or CrisisCenter creation"
    algorithm: aggregation
    formula: |
      held_beds     = count(BedReferral where crisis_center_id == center.id and status == HELD)
      occupied_beds = count(BedReferral where crisis_center_id == center.id and status == ADMITTED)
      available_beds = bed_capacity - held_beds - occupied_beds
      # Conserved invariant: available_beds + held_beds + occupied_beds == bed_capacity at all times.
    input_set: "All BedReferral rows for the center."
    constants: {}
    precision: "integer counts"

  - name: team_slot_ledger
    trigger: "any MobileDispatch status change or MobileCrisisTeam creation"
    algorithm: aggregation
    formula: |
      active_dispatch_count = count(MobileDispatch where team_id == team.id and status in {REQUESTED, EN_ROUTE, ON_SCENE})
      available_slots = capacity - active_dispatch_count
      # Conserved invariant: available_slots + active_dispatch_count == capacity at all times.
    input_set: "All MobileDispatch rows for the team."
    constants: {}
    precision: "integer counts"

  - name: repeat_caller_high_risk
    trigger: "POST /contacts (upsert) and POST /risk-screenings (band update)"
    algorithm: aggregation
    formula: |
      contact_count = count(Contact where caller_key == this.caller_key)
      last_risk_band = risk_band of the Contact for this caller_key with the greatest created_at
                       (tie-break: greatest disposition_at; final tie-break: earliest created_at is impossible since created_at is the key — use the Contact with the lexically greatest id ONLY as an inert display tie and never as a decision that changes high_risk_flag)
      high_risk_flag = (contact_count >= REPEAT_FLAG_THRESHOLD) OR (last_risk_band == IMMINENT)
    input_set: "All Contact rows sharing caller_key."
    constants:
      REPEAT_FLAG_THRESHOLD: 3
    precision: "integer counts; boolean flag"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id and every FK in the body resolves to an existing row (validated left-to-right)"
    error_id: "ERR_CONTACT_NOT_FOUND / ERR_SCREENING_NOT_FOUND / ERR_SAFETY_PLAN_NOT_FOUND / ERR_TEAM_NOT_FOUND / ERR_DISPATCH_NOT_FOUND / ERR_CENTER_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_FOLLOWUP_NOT_FOUND / ERR_EMERGENCY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id or body FK"

  - priority: 4
    category: business_constraint
    check: "Body field validation: required fields present, enums valid, and window_end > window_start on any dated window"
    error_id: "ERR_VALIDATION / ERR_INVALID_ENUM / ERR_WINDOW_INVALID"
    http_status: 422
    applies_to: "all create and transition endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a legal from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /state and /attempt transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bed-referrals, POST /mobile-dispatches"

  - priority: 7
    category: business_safety
    check: "Disposition matches risk band; resolving a DE_ESCALATION contact requires an ACTIVE safety plan"
    error_id: "ERR_DISPOSITION_NOT_ALLOWED / ERR_NO_ACTIVE_SAFETY_PLAN"
    http_status: 409
    applies_to: "POST /contacts/{contactId}/state"

  - priority: 8
    category: business_referential
    check: "Cross-entity preconditions: contact must be DISPATCH_PENDING for dispatch/referral creation; center must be ONLINE; center must accept the referral acuity"
    error_id: "ERR_CONTACT_NOT_DISPATCH_PENDING / ERR_CENTER_OFFLINE / ERR_ACUITY_NOT_ACCEPTED"
    http_status: 409
    applies_to: "POST /mobile-dispatches, POST /bed-referrals, POST /bed-referrals/{referralId}/state"

  - priority: 9
    category: business_temporal
    check: |
      Resource temporal-overlap, two distinct interval semantics:
      (Team) reject if the new dispatch window collides with any other dispatch
        for the same team (status in REQUESTED, EN_ROUTE, ON_SCENE, COMPLETED)
        under a TEAM_TURNAROUND_MINUTES = 15 buffer, i.e. reject when
        new.window_start < other.window_end + 15min AND
        other.window_start < new.window_end + 15min. Single-capacity, buffer-separated.
      (Center) reject if adding the new bed-hold window would make the count of
        BedReferrals (status in HELD, ADMITTED) for the center whose [window_start,
        window_end) half-open interval overlaps the new interval reach or exceed
        bed_capacity. Aggregate-capacity, half-open (adjacency end==start is allowed),
        no buffer.
    error_id: "ERR_TEAM_WINDOW_CONFLICT / ERR_BED_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /mobile-dispatches, POST /bed-referrals"

  - priority: 10
    category: business_constraint
    check: "Team availability: team must be ON_SHIFT with the window inside its shift and a free concurrent slot"
    error_id: "ERR_TEAM_OFF_SHIFT / ERR_TEAM_AT_CAPACITY"
    http_status: 409
    applies_to: "POST /mobile-dispatches"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Contact ----
  - method: POST
    path: "/contacts"
    description: "Create a crisis Contact (intake). Upserts the RepeatCaller registry for caller_key."
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 201
    input: [channel, caller_key, "caller_phone?", "caller_name?", "presenting_concern?"]
    output: Contact
    side_effects:
      - "status = INTAKE"
      - "Upsert RepeatCaller for caller_key: contact_count += 1, recompute high_risk_flag"
      - "Set repeat_caller_flag = RepeatCaller.high_risk_flag snapshot"

  - method: GET
    path: "/contacts/{contactId}"
    description: "Get one Contact"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: Contact
    side_effects: []

  - method: GET
    path: "/contacts"
    description: "List Contacts"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["status?", "channel?", "caller_key?", "limit?", "offset?"]
    output: Contact[]
    side_effects: []

  - method: POST
    path: "/contacts/{contactId}/state"
    description: "Drive Contact disposition / escalation / resolution / close per the Contact state machine"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: [to_status]
    output: Contact
    side_effects:
      - "Applies the matching Contact transition, including the escalate-911 cancel cascade and follow-up scheduling"

  # ---- RiskScreening ----
  - method: POST
    path: "/risk-screenings"
    description: "Submit a risk screening for a Contact; computes score/band and (first screening) moves the Contact INTAKE->SCREENED"
    roles: [CrisisCounselor, ClinicalSupervisor]
    code: 201
    input: [contact_id, screening_type, suicidal_ideation, plan_specificity, means_access, prior_attempts, "protective_factors?"]
    output: RiskScreening
    side_effects:
      - "Compute risk_score and risk_band per risk_screening_score variant"
      - "Copy risk_score/risk_band/latest_screening_id onto the Contact; INTAKE->SCREENED if first screening"
      - "Update RepeatCaller.last_risk_band and recompute high_risk_flag"

  - method: GET
    path: "/risk-screenings/{screeningId}"
    description: "Get one RiskScreening"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: RiskScreening
    side_effects: []

  - method: GET
    path: "/risk-screenings"
    description: "List RiskScreenings (reverse lookup by contact)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["contact_id?", "screening_type?", "limit?", "offset?"]
    output: RiskScreening[]
    side_effects: []

  # ---- SafetyPlan ----
  - method: POST
    path: "/safety-plans"
    description: "Create a SafetyPlan (DRAFT) for a Contact"
    roles: [CrisisCounselor, ClinicalSupervisor]
    code: 201
    input: [contact_id, coping_strategies, warning_signs, "support_contacts?", "lethal_means_counseling?"]
    output: SafetyPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/safety-plans/{safetyPlanId}"
    description: "Get one SafetyPlan"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: []

  - method: GET
    path: "/safety-plans"
    description: "List SafetyPlans (reverse lookup by contact)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["contact_id?", "status?", "limit?", "offset?"]
    output: SafetyPlan[]
    side_effects: []

  - method: POST
    path: "/safety-plans/{safetyPlanId}/state"
    description: "Transition a SafetyPlan (activate / archive)"
    roles: [CrisisCounselor, ClinicalSupervisor]
    code: 200
    input: [to_status]
    output: SafetyPlan
    side_effects: ["Per SafetyPlan machine, including superseding a prior ACTIVE plan and toggling contact.has_active_safety_plan"]

  # ---- MobileCrisisTeam ----
  - method: POST
    path: "/mobile-crisis-teams"
    description: "Create a MobileCrisisTeam (config)"
    roles: [ClinicalSupervisor]
    code: 201
    input: [name, coverage_zone, "capacity?", shift_start, shift_end, "status?"]
    output: MobileCrisisTeam
    side_effects: ["active_dispatch_count = 0", "version = 1"]

  - method: GET
    path: "/mobile-crisis-teams/{teamId}"
    description: "Get one MobileCrisisTeam"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: MobileCrisisTeam
    side_effects: []

  # ---- MobileDispatch ----
  - method: POST
    path: "/mobile-dispatches"
    description: "Dispatch a team to a DISPATCH_PENDING contact (OCC on team.version)"
    roles: [CrisisDispatcher, ClinicalSupervisor]
    code: 201
    input: [contact_id, team_id, window_start, window_end, requested_acuity, expected_team_version]
    output: MobileDispatch
    side_effects:
      - "status = REQUESTED"
      - "Increment MobileCrisisTeam.active_dispatch_count by 1; increment MobileCrisisTeam.version by 1"
      - "Compute priority_score_estimated via dispatch_priority_score ESTIMATED variant"

  - method: GET
    path: "/mobile-dispatches/{dispatchId}"
    description: "Get one MobileDispatch"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: MobileDispatch
    side_effects: []

  - method: GET
    path: "/mobile-dispatches"
    description: "List MobileDispatches (reverse lookup by contact or team)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["contact_id?", "team_id?", "status?", "limit?", "offset?"]
    output: MobileDispatch[]
    side_effects: []

  - method: POST
    path: "/mobile-dispatches/{dispatchId}/state"
    description: "Advance or cancel a MobileDispatch"
    roles: [CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: [to_status, "on_scene_acuity?"]
    output: MobileDispatch
    side_effects: ["Per MobileDispatch machine, including team slot release, reassessed priority, contact resolution, and cancel cascade"]

  # ---- CrisisCenter ----
  - method: POST
    path: "/crisis-centers"
    description: "Create a CrisisCenter (config)"
    roles: [ClinicalSupervisor]
    code: 201
    input: [name, bed_capacity, accepted_acuities, "status?"]
    output: CrisisCenter
    side_effects: ["status = ONLINE", "held_beds = 0", "occupied_beds = 0", "version = 1"]

  - method: GET
    path: "/crisis-centers/{centerId}"
    description: "Get one CrisisCenter"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: CrisisCenter
    side_effects: []

  - method: POST
    path: "/crisis-centers/{centerId}/state"
    description: "Set a CrisisCenter ONLINE or DIVERTED (DIVERTED cascades HELD referral voids)"
    roles: [CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: [to_status]
    output: CrisisCenter
    side_effects: ["Per CrisisCenter machine; DIVERTED voids all HELD referrals and reverts their contacts"]

  # ---- BedReferral ----
  - method: POST
    path: "/bed-referrals"
    description: "Hold a crisis bed for a DISPATCH_PENDING contact (OCC on center.version)"
    roles: [CrisisDispatcher, ClinicalSupervisor]
    code: 201
    input: [contact_id, crisis_center_id, "mobile_dispatch_id?", acuity, window_start, window_end, expected_crisis_center_version]
    output: BedReferral
    side_effects:
      - "status = HELD"
      - "Increment CrisisCenter.held_beds by 1; increment CrisisCenter.version by 1"
      - "Transition contact DISPATCH_PENDING->REFERRAL_PENDING"

  - method: GET
    path: "/bed-referrals/{referralId}"
    description: "Get one BedReferral"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: BedReferral
    side_effects: []

  - method: GET
    path: "/bed-referrals"
    description: "List BedReferrals (reverse lookup by contact, center, or dispatch)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["contact_id?", "crisis_center_id?", "mobile_dispatch_id?", "status?", "limit?", "offset?"]
    output: BedReferral[]
    side_effects: []

  - method: POST
    path: "/bed-referrals/{referralId}/state"
    description: "Admit / discharge / void a BedReferral"
    roles: [CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: [to_status]
    output: BedReferral
    side_effects: ["Per BedReferral machine, including center bed ledger and contact resolution/revert"]

  # ---- FollowUpTask ----
  - method: GET
    path: "/follow-up-tasks/{taskId}"
    description: "Get one FollowUpTask"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: FollowUpTask
    side_effects: []

  - method: GET
    path: "/follow-up-tasks"
    description: "List FollowUpTasks (reverse lookup by contact)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["contact_id?", "status?", "limit?", "offset?"]
    output: FollowUpTask[]
    side_effects: []

  - method: POST
    path: "/follow-up-tasks/{taskId}/attempt"
    description: "Record a wellness-check outreach attempt (drives the retry cycle and the max-attempts boundary)"
    roles: [CrisisCounselor, ClinicalSupervisor]
    code: 200
    input: [outcome, "next_scheduled_at?"]
    output: FollowUpTask
    side_effects: ["Increment attempt_count; resolve to COMPLETED / RESCHEDULED / ABANDONED per outcome and max_attempts"]

  # ---- EmergencyCoordination ----
  - method: GET
    path: "/emergency-coordinations/{coordId}"
    description: "Get one EmergencyCoordination (911 handoff) record"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: []
    output: EmergencyCoordination
    side_effects: []

  - method: GET
    path: "/emergency-coordinations"
    description: "List EmergencyCoordination records (reverse lookup by contact)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["contact_id?", "limit?", "offset?"]
    output: EmergencyCoordination[]
    side_effects: []

  # ---- RepeatCaller ----
  - method: GET
    path: "/repeat-callers"
    description: "List the repeat-caller registry (lookup by caller_key or high_risk_flag)"
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
    input: ["caller_key?", "high_risk_flag?", "limit?", "offset?"]
    output: RepeatCaller[]
    side_effects: []

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CrisisCounselor, CrisisDispatcher, ClinicalSupervisor]
    code: 200
