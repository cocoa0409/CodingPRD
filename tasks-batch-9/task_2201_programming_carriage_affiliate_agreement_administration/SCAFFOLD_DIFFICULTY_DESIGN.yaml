                performance_deadline: "2026-12-31T00:00:00Z"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                coop1_id: "id"
            - call: "POST /carriage/marketing-commitments/${coop1_id}/earn"
              payload:
                earned_cents: 500000
                proof_reference: "COOP-Q2-2026-INSERTION-ORDER"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a4_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${a4_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep4_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep4_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "GET /carriage/distributors/${d4_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
