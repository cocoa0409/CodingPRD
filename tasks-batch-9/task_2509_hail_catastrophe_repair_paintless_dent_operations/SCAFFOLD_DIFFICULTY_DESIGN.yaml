  - rule_id: boundary_precision_check
    instances:

      - name: targeting_floor_boundary_score_59_rejected_60_accepted
        grounds:
          - calculations.storm_targeting_score
          - validations[priority=36]
          - errors[ERR_TARGETING_SCORE_BELOW_FLOOR]
          - state_machines.StormEvent.EVALUATING_to_TARGETED
        distinguishing_aspect: |
          Off-by-one on TARGETING_SCORE_FLOOR 60 with a >= comparison: a MODELED event with
          125000 vehicles scores exactly 59 and its TARGET decision is rejected with
          ERR_TARGETING_SCORE_BELOW_FLOOR, while the same event with 130000 vehicles scores exactly
          60 and is TARGETED - the two inputs differ only in the density term (25 vs 26 points).
        test_recipe:
          setup:
            - "Clock at 2026-08-05T08:00:00Z."
            - "Two candidate events with identical shape: MODELED confidence, 50mm hail, 300 km2 swath (below the 400 km2 bonus threshold), 4 competitors; only vehicle_population_estimate differs (125000 -> score 59, 130000 -> score 60)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CatastropheDirector
            - call: "POST /hail-ops/storm-events"
