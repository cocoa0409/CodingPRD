            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-NO-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "NO-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Ines Novak", household_size: 2, gross_annual_income_cents: 5000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "GET /iz-compliance/affordable-units/${u_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u_v: $.data.version } }
          trigger:
