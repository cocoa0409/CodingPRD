- section: errors
  instances:
  - name: unknown_negotiation_and_trunk_ids_return_their_own_not_found_ids
    claim_type: error_triggerable
    grounds:
    - errors[ERR_OFFER_NOT_FOUND]
    - errors[ERR_TRUNK_GROUP_NOT_FOUND]
    - errors[ERR_AUGMENT_ORDER_NOT_FOUND]
    distinguishing_aspect: |
      Triggerability claim for the priority-3 path-resolution family on the network side: each resource type answers with its own 404 id rather than a shared generic not-found, and it does so from a live database whose only row is an unrelated carrier.
    test_recipe:
      setup:
      - One registered carrier, so the database is live but holds no agreement, no offer, no trunk group and no augment order.
      - The id 00000000-0000-4000-8000-000000000000 resolves to nothing of any type.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      trigger:
      - call: GET /interconnection/negotiation-offers/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PlatformAdmin
        captures:
          e1: $.data.error_id
      - call: GET /interconnection/trunk-groups/00000000-0000-4000-8000-000000000000
        payload: {}
        as: NetworkPlanner
        captures:
          e2: $.data.error_id
      - call: GET /interconnection/trunk-augment-orders/00000000-0000-4000-8000-000000000000
        payload: {}
        as: NetworkPlanner
        captures:
          e3: $.data.error_id
      assert:
      - The negotiation-offer read returns 404 with error_id ERR_OFFER_NOT_FOUND
      - The trunk-group read returns 404 with error_id ERR_TRUNK_GROUP_NOT_FOUND
      - The augment-order read returns 404 with error_id ERR_AUGMENT_ORDER_NOT_FOUND
      - Every response body carries the error envelope shape (error_id and message) and no data payload
  - name: unknown_filing_and_batch_ids_return_their_own_not_found_ids
    claim_type: error_triggerable
    grounds:
    - errors[ERR_TARIFF_FILING_NOT_FOUND]
    - errors[ERR_FACTOR_FILING_NOT_FOUND]
    - errors[ERR_USAGE_BATCH_NOT_FOUND]
    distinguishing_aspect: |
      Triggerability claim for the priority-3 path-resolution family on the regulatory and usage side: the tariff filing, the traffic factor filing and the usage batch each answer with a distinct 404 id, which is what lets a caller tell which leg of a rating chain is broken.
