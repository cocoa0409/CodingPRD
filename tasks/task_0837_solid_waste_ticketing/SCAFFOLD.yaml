# =============================================================================
# Solid-Waste & Landfill Scale/Ticketing — seed tables (Expert)
# =============================================================================

scenario: |
  837. Solid-Waste & Landfill Scale/Ticketing: gate scale & inbound
  classification, tipping-fee by material/weight, hauler account & manifest,
  special-waste (asbestos/tire) approval, load inspection & reject, cell/airspace
  tracking, diversion & gas monitoring, billing/settlement

domain_name: solid-waste-ticketing
api_prefix: /landfill

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Landfill facility name" }
      - { name: total_airspace_cubic_yards, type: number, source: input, description: "Permitted total airspace of the facility, in cubic yards" }
      - { name: consumed_airspace_cubic_yards, type: number, source: computed, default: 0, description: "= sum of consumed_cubic_yards over all cells of this facility" }
      - { name: remaining_airspace_cubic_yards, type: number, source: computed, description: "= total_airspace_cubic_yards - consumed_airspace_cubic_yards" }
      - { name: latest_methane_ppm, type: integer, source: computed, default: 0, description: "methane_ppm of the most recent GasReading (reading_at DESC, created_at DESC tie-break); 0 when no readings" }
      - { name: gas_status, type: enum, source: computed, description: "NORMAL | ELEVATED | EXCEEDANCE — derived from latest_methane_ppm (see calc gas_status)" }
      - { name: acceptance_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | CLOSED — derived from gas_status and remaining_airspace_cubic_yards (see calc acceptance_posture)" }
      - { name: diversion_rate_provisional, type: number, source: computed, default: 0, description: "Forward-looking diversion rate including INSPECTED and POSTED tickets (see calc diversion_rate)" }
      - { name: diversion_rate_final, type: number, source: computed, default: 0, description: "Actual diversion rate including POSTED tickets only (see calc diversion_rate)" }

  - name: Cell
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "Cell / lift identifier" }
      - { name: capacity_cubic_yards, type: number, source: input, description: "Airspace capacity of this cell, in cubic yards" }
      - { name: consumed_cubic_yards, type: number, source: computed, default: 0, description: "Airspace consumed by POSTED tickets assigned to this cell" }
      - { name: remaining_cubic_yards, type: number, source: computed, description: "= capacity_cubic_yards - consumed_cubic_yards" }
      - { name: fill_sequence, type: integer, source: system, description: "Monotone counter within the facility assigned at creation; defines fill order (lowest fills first)" }
      - { name: status, type: enum, source: system, description: "OPEN <-> FULL (FULL when consumed >= capacity; reopened to OPEN on ticket void)" }

  - name: HaulerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hauler company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding balance allowed for this hauler, in cents" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Outstanding tipping charges owed (increased on ticket post, decreased on void and on invoice payment)" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> SUSPENDED (auto-suspended when balance_cents >= credit_limit_cents; auto-reactivated when balance_cents < credit_limit_cents)" }

  - name: Manifest
    parent: null
    common_fields: true
    fields:
      - { name: hauler_account_id, type: string, source: input, description: "FK -> HaulerAccount.id" }
      - { name: declared_material, type: enum, source: input, description: "MSW | CONSTRUCTION_DEBRIS | GREEN_WASTE | CLEAN_WOOD | TIRE | ASBESTOS" }
      - { name: declared_weight_tons, type: number, source: input, description: "Hauler-declared inbound weight in US tons (used for the provisional fee estimate)" }
      - { name: is_special_waste, type: boolean, source: computed, description: "true when declared_material in {TIRE, ASBESTOS}" }
      - { name: special_waste_cleared, type: boolean, source: computed, default: false, description: "true once a SpecialWasteApproval on this manifest reaches APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> CONSUMED" }

  - name: SpecialWasteApproval
    parent: Manifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "FK -> Manifest.id" }
      - { name: waste_type, type: enum, source: input, description: "TIRE | ASBESTOS" }
      - { name: profile_ref, type: string, source: input, description: "Waste-profile document reference" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED / DENIED" }
      - { name: decided_by, type: string, source: system, default: null, description: "Opaque EnvironmentalOfficer user id that decided the approval" }
      - { name: decision_note, type: string, source: system, default: null, description: "Free-text note captured at decision time" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: hauler_account_id, type: string, source: input, description: "FK -> HaulerAccount.id" }
      - { name: manifest_id, type: string, source: input, default: null, description: "FK -> Manifest.id (required for special-waste materials, optional otherwise)" }
      - { name: cell_id, type: string, source: system, default: null, description: "FK -> Cell.id (server-selected fill cell, assigned at post)" }
      - { name: invoice_id, type: string, source: system, default: null, description: "FK -> Invoice.id (set when this ticket is included on a settlement invoice)" }
      - { name: material, type: enum, source: input, description: "Gate-classified material: MSW | CONSTRUCTION_DEBRIS | GREEN_WASTE | CLEAN_WOOD | TIRE | ASBESTOS" }
      - { name: gross_weight_tons, type: number, source: input, description: "Scale-in gross weight in US tons" }
      - { name: tare_weight_tons, type: number, source: input, default: null, description: "Scale-out tare weight in US tons" }
      - { name: net_weight_tons, type: number, source: computed, default: null, description: "= gross_weight_tons - tare_weight_tons (set at weigh-out)" }
      - { name: is_diverted, type: boolean, source: computed, description: "true when material in {GREEN_WASTE, CLEAN_WOOD} (recycled, consumes no airspace)" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Provisional tipping fee computed at creation from declared weight (see calc tipping_fee variant provisional)" }
      - { name: tipping_fee_cents, type: integer, source: computed, default: null, description: "Final tipping fee computed at weigh-out from net weight (see calc tipping_fee variant final)" }
      - { name: posted_airspace_cy, type: number, source: computed, default: null, description: "Airspace consumed by this ticket at post = round(net_weight_tons * 1.5, 2) for landfilled materials, 0 for diverted" }
      - { name: inspected_by, type: string, source: system, default: null, description: "Opaque GateOperator user id that performed the load inspection" }
      - { name: status, type: enum, source: system, description: "CREATED -> WEIGHED -> INSPECTED -> POSTED; WEIGHED -> REJECTED; POSTED/CREATED -> VOIDED" }

  - name: GasReading
    parent: Facility
    common_fields: false   # append-only event: id, created_at only
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: methane_ppm, type: integer, source: input, description: "Measured surface methane concentration in ppm" }
      - { name: reading_at, type: datetime, source: input, description: "ISO-8601 timestamp when the reading was taken" }
      - { name: resulting_gas_status, type: enum, source: computed, description: "NORMAL | ELEVATED | EXCEEDANCE classification of this reading" }

  - name: DisposalWindow
    parent: Cell
    common_fields: true
    fields:
      - { name: cell_id, type: string, source: system, description: "FK -> Cell.id" }
      - { name: waste_type, type: enum, source: input, description: "TIRE | ASBESTOS" }
      - { name: window_start, type: datetime, source: input, description: "ISO-8601 start of the scheduled special-waste placement window (closed boundary)" }
      - { name: window_end, type: datetime, source: input, description: "ISO-8601 end of the scheduled placement window (closed boundary)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED (set at creation)" }

  - name: ScaleReservation
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: lane_number, type: integer, source: input, description: "Gate scale lane number reserved" }
      - { name: truck_ref, type: string, source: input, description: "Hauler truck / plate reference" }
      - { name: window_start, type: datetime, source: input, description: "ISO-8601 start of the reserved weigh window (half-open interval start, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO-8601 end of the reserved weigh window (half-open interval end, exclusive)" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED (set at creation)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: hauler_account_id, type: string, source: input, description: "FK -> HaulerAccount.id" }
      - { name: line_ticket_ids, type: array, source: computed, description: "Ids of POSTED, un-invoiced tickets of this hauler swept onto this invoice" }
      - { name: line_count, type: integer, source: computed, description: "Number of ticket lines on the invoice" }
      - { name: tipping_subtotal_cents, type: integer, source: computed, description: "= sum of tipping_fee_cents over line tickets (the amount released from hauler balance when paid)" }
      - { name: total_cents, type: integer, source: computed, description: "Billed total with host fee, rounded per line then summed (see calc invoice_total)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over Payments of this invoice" }
      - { name: status, type: enum, source: system, description: "ISSUED -> PAID" }

  - name: Payment
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents" }
      - { name: method, type: enum, source: input, description: "ACH | CARD | CHECK" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Ticket
    initial_state: CREATED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: CREATED
        to: WEIGHED
        trigger: "POST /landfill/tickets/{id}/weigh-out"
        actor: GateOperator
        preconditions:
          - "tare_weight_tons <= gross_weight_tons (else ERR_INVALID_WEIGHT)"
          - "net_weight_tons = gross_weight_tons - tare_weight_tons must be > 0 (else ERR_EMPTY_LOAD)"
        side_effects:
          - "net_weight_tons = gross_weight_tons - tare_weight_tons"
          - "is_diverted recomputed from material"
          - "tipping_fee_cents computed via calc tipping_fee variant final (net weight, live facility gas_status)"

      - from: WEIGHED
        to: INSPECTED
        trigger: "POST /landfill/tickets/{id}/inspect with result=PASS"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "inspected_by = X-User-ID of the inspecting GateOperator"

      - from: WEIGHED
        to: REJECTED
        trigger: "POST /landfill/tickets/{id}/inspect with result=REJECT"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "reject_reason recorded in decision (load turned away)"
          - "no airspace consumed, no hauler charge, manifest (if any) left in SUBMITTED"
        note: "Divergent branch from WEIGHED: REJECT consumes nothing and terminates; PASS advances to INSPECTED."

      - from: INSPECTED
        to: POSTED
        trigger: "POST /landfill/tickets/{id}/post"
        actor: GateOperator
        preconditions:
          - "X-User-ID != inspected_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_facility_version must equal Facility.version (else ERR_STALE_FACILITY_VERSION)"
          - "Facility.acceptance_posture != CLOSED (else ERR_FACILITY_CLOSED)"
          - "if material in {TIRE, ASBESTOS}: manifest_id present and its Manifest.special_waste_cleared == true (else ERR_SPECIAL_WASTE_NOT_APPROVED)"
          - "if manifest_id present: Manifest.hauler_account_id == Ticket.hauler_account_id (else ERR_MANIFEST_MISMATCH)"
          - "for landfilled material: at least one OPEN cell with remaining_cubic_yards >= posted_airspace_cy (else ERR_NO_AIRSPACE)"
          - "HaulerAccount.balance_cents + tipping_fee_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "posted_airspace_cy = round(net_weight_tons * 1.5, 2) for landfilled material, else 0"
          - "cell_id = selected fill cell (calc cell_selection); Cell.consumed_cubic_yards += posted_airspace_cy"
          - "if Cell.consumed_cubic_yards >= Cell.capacity_cubic_yards: Cell.status -> FULL (cascade)"
          - "if the newly FULL cell leaves the facility with no OPEN cell holding remaining airspace: Facility.acceptance_posture recomputed to CLOSED (cascade)"
          - "Facility.consumed_airspace_cubic_yards recomputed; Facility.version incremented by 1"
          - "HaulerAccount.balance_cents += tipping_fee_cents"
          - "if HaulerAccount.balance_cents >= credit_limit_cents: HaulerAccount.status -> SUSPENDED"
          - "if manifest_id present: Manifest.status -> CONSUMED"

      - from: CREATED
        to: VOIDED
        trigger: "POST /landfill/tickets/{id}/void"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "ticket abandoned before weighing; no compensations required"

      - from: POSTED
        to: VOIDED
        trigger: "POST /landfill/tickets/{id}/void"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "Cell.consumed_cubic_yards -= posted_airspace_cy (compensation; conserves total airspace)"
          - "if Cell.status was FULL and now remaining_cubic_yards > 0: Cell.status -> OPEN"
          - "Facility.consumed_airspace_cubic_yards recomputed; Facility.acceptance_posture recomputed; Facility.version incremented by 1"
          - "HaulerAccount.balance_cents -= tipping_fee_cents (compensation; conserves balance)"
          - "if HaulerAccount.balance_cents < credit_limit_cents and status == SUSPENDED: HaulerAccount.status -> ACTIVE"

  - entity: SpecialWasteApproval
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /landfill/special-waste-approvals/{id}/decide with decision=APPROVE"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "decided_by = X-User-ID; parent Manifest.special_waste_cleared -> true"
        note: "Divergent branch: APPROVE clears the manifest for special-waste posting."

      - from: PENDING
        to: DENIED
        trigger: "POST /landfill/special-waste-approvals/{id}/decide with decision=DENY"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "decided_by = X-User-ID; parent Manifest.special_waste_cleared stays false (special-waste tickets on this manifest can never post)"
        note: "Divergent branch: DENY leaves the manifest blocked for special waste."

  - entity: Manifest
    initial_state: DRAFT
    terminal_states: [CONSUMED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /landfill/manifests/{id}/submit"
        actor: Hauler
        preconditions:
          - "HaulerAccount(hauler_account_id).status == ACTIVE (else ERR_HAULER_SUSPENDED)"
        side_effects: []
        note: "Cross-entity guard: manifest may only be submitted while its hauler account is ACTIVE."

      - from: SUBMITTED
        to: CONSUMED
        trigger: "system — a Ticket referencing this manifest reaches POSTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HaulerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — ticket post raises balance_cents to >= credit_limit_cents"
        actor: system
        preconditions: []
        side_effects: ["outstanding SUBMITTED manifests remain but cannot back new submits"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — invoice payment or ticket void lowers balance_cents below credit_limit_cents"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "system — cumulative Payment amount_cents reaches total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "for each line ticket: HaulerAccount.balance_cents -= ticket.tipping_fee_cents (cascade)"
          - "if HaulerAccount.balance_cents < credit_limit_cents and status == SUSPENDED: HaulerAccount.status -> ACTIVE (cascade)"

  - entity: Cell
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system — ticket post drives consumed_cubic_yards >= capacity_cubic_yards"
        actor: system
        preconditions: []
        side_effects: ["Facility.acceptance_posture recomputed"]

      - from: FULL
        to: OPEN
        trigger: "system — ticket void frees airspace so remaining_cubic_yards > 0"
        actor: system
        preconditions: []
        side_effects: ["Facility.acceptance_posture recomputed"]

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: ticket-post-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /landfill/tickets/{id}/post"
    occ_field: "expected_facility_version"
    description: |
      Posting a ticket consumes shared facility airspace and advances
      Facility.version. A post whose expected_facility_version is older than the
      facility's current version is rejected as stale: another post has already
      consumed airspace against the version the caller last observed, so this
      caller's view of remaining airspace and posture is out of date.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: tipping_fee
    trigger: "provisional at ticket creation; final at weigh-out (CREATED -> WEIGHED)"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered weight fee (cents), material-dependent:
      def weight_fee_cents(material, tons):
          tiers = RATE_TIERS[material]           # list of (lo, hi, cents_per_ton)
          raw = 0.0
          for (lo, hi, rate) in tiers:
              if tons > lo:
                  span = min(tons, hi) - lo
                  raw += span * rate
          return round_half_up(raw)              # -> whole cents FIRST

      # Pinned evaluation order (no ambiguity):
      wf         = weight_fee_cents(material, weight_tons)
      gas_mult   = 1.10 if (variant == 'final' and facility.gas_status == 'ELEVATED') else 1.00
      gas_fee    = round_half_up(wf * gas_mult)            # round AFTER multiplier
      surcharge  = SPECIAL_SURCHARGE_CENTS.get(material, 0)
      rebate     = round_half_up(wf * 0.12) if material in DIVERTED_MATERIALS else 0
      subtotal   = gas_fee + surcharge - rebate
      fee_cents  = max(subtotal, MINIMUM_FEE_CENTS)        # nested max LAST
    input_set: "single ticket; weight_tons = manifest.declared_weight_tons (or gross_weight_tons if no manifest) for provisional, net_weight_tons for final"
    constants:
      RATE_TIERS: "{ MSW: [[0,5,4500],[5,inf,3800]], CONSTRUCTION_DEBRIS: [[0,inf,5200]], GREEN_WASTE: [[0,inf,2000]], CLEAN_WOOD: [[0,inf,1800]], TIRE: [[0,inf,9000]], ASBESTOS: [[0,inf,15000]] }"
      SPECIAL_SURCHARGE_CENTS: "{ TIRE: 5000, ASBESTOS: 20000 }"
      DIVERTED_MATERIALS: "{ GREEN_WASTE, CLEAN_WOOD }"
      MINIMUM_FEE_CENTS: 2500
      GAS_SURCHARGE_MULT: 1.10
    precision: "whole cents, round_half_up; each rounding step pinned above"
    variants:
      - name: provisional
        when: "computed at ticket creation into estimated_fee_cents"
        difference: "uses manifest.declared_weight_tons (or gross_weight_tons) and gas_mult fixed at 1.00 (gas ignored at estimate time)"
      - name: final
        when: "computed at weigh-out into tipping_fee_cents"
        difference: "uses net_weight_tons and the live facility.gas_status for gas_mult"

  - name: cell_selection
    trigger: "ticket post (INSPECTED -> POSTED) for landfilled material"
    algorithm: selector_policy
    formula: |
      candidates = [c for c in cells(facility)
                    if c.status == 'OPEN'
                    and c.remaining_cubic_yards >= ticket.posted_airspace_cy]
      if not candidates: reject ERR_NO_AIRSPACE
      selected = min(candidates, key=lambda c: c.fill_sequence)   # lowest fill_sequence
    input_set: "OPEN cells of the ticket's facility with sufficient remaining airspace"
    precision: "n/a"
    variants:
      - name: eligibility
        when: "candidate set"
        difference: "status == OPEN AND remaining_cubic_yards >= posted_airspace_cy"
      - name: ranking_and_tiebreak
        when: "selection"
        difference: "rank by fill_sequence ASC; fill_sequence is a monotone per-facility counter so it never ties; empty candidate set -> ERR_NO_AIRSPACE"

  - name: invoice_total
    trigger: "invoice creation (POST /landfill/invoices)"
    algorithm: aggregation
    formula: |
      lines = [t for t in tickets
               if t.hauler_account_id == invoice.hauler_account_id
               and t.status == 'POSTED'
               and t.invoice_id is null]        # ordered by created_at ASC for line_ticket_ids
      tipping_subtotal_cents = sum(t.tipping_fee_cents for t in lines)
      # Pinned rounding order: round EACH line's host-fee-inclusive charge to the
      # cent, THEN sum. (Sum-then-round is explicitly NOT used.)
      total_cents = sum(round_half_up(t.tipping_fee_cents * (1 + HOST_FEE_PCT)) for t in lines)
    input_set: "POSTED, un-invoiced tickets of the invoice's hauler; empty set -> ERR_NO_BILLABLE_TICKETS"
    constants:
      HOST_FEE_PCT: 0.0875
    precision: "whole cents, round_half_up; round per line BEFORE summing"

  - name: gas_status
    trigger: "gas reading creation; read on any Facility fetch"
    algorithm: threshold
    formula: |
      ppm = facility.latest_methane_ppm           # from most recent GasReading
      if ppm >= 500:   gas_status = 'EXCEEDANCE'
      elif ppm >= 200: gas_status = 'ELEVATED'
      else:            gas_status = 'NORMAL'
    input_set: "latest GasReading of the facility (reading_at DESC, created_at DESC tie-break); none -> ppm 0 -> NORMAL"
    constants:
      ELEVATED_PPM: 200
      EXCEEDANCE_PPM: 500
    precision: "integer ppm; boundary is inclusive (>=)"

  - name: acceptance_posture
    trigger: "read on any Facility fetch; recomputed after post/void/gas-reading"
    algorithm: threshold
    formula: |
      if facility.gas_status == 'EXCEEDANCE':                              posture = 'CLOSED'
      elif facility.remaining_airspace_cubic_yards <= 0:                   posture = 'CLOSED'
      elif facility.remaining_airspace_cubic_yards <= total_airspace_cubic_yards * 0.10: posture = 'RESTRICTED'
      else:                                                               posture = 'OPEN'
    input_set: "the facility's own gas_status and airspace fields"
    constants:
      RESTRICTED_RATIO: 0.10
    precision: "n/a; RESTRICTED threshold boundary inclusive (<=)"

  - name: diversion_rate
    trigger: "read on any Facility fetch"
    algorithm: aggregation
    formula: |
      def rate(statuses):
          tickets = [t for t in tickets(facility) if t.status in statuses and t.net_weight_tons is not null]
          total   = sum(t.net_weight_tons for t in tickets)
          diverted= sum(t.net_weight_tons for t in tickets if t.is_diverted)
          return round_half_up(diverted / total, 4) if total > 0 else 0
      diversion_rate_provisional = rate({'INSPECTED','POSTED'})   # forward-looking
      diversion_rate_final       = rate({'POSTED'})               # actual
    input_set: "facility tickets; provisional includes INSPECTED+POSTED, final includes POSTED only"
    precision: "4 decimal places, round_half_up; 0 when denominator is 0"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "required body fields present; enums valid; weights and cents non-negative; window_end > window_start"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints with a body"

  - priority: 4
    category: existence
    check: "path and FK-referenced resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: auth
    check: "entity_backed Hauler acts only on its own account/manifest/invoice (X-User-ID == resource.hauler_account_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Hauler-owned endpoints (manifest create/submit, payment create)"

  - priority: 6
    category: state
    check: "target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: business_constraint
    check: "expected_facility_version matches Facility.version on ticket post"
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /landfill/tickets/{id}/post"

  - priority: 8
    category: business_safety
    check: "posting GateOperator (X-User-ID) differs from inspected_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /landfill/tickets/{id}/post"

  - priority: 9
    category: business_safety
    check: "facility posture not CLOSED (for post and scale-reservation); special-waste manifest cleared; hauler not SUSPENDED for manifest submit"
    error_id: "ERR_FACILITY_CLOSED / ERR_SPECIAL_WASTE_NOT_APPROVED / ERR_HAULER_SUSPENDED"
    http_status: 409
    applies_to: "POST /landfill/tickets/{id}/post, POST /landfill/manifests/{id}/submit, POST /landfill/facilities/{id}/scale-reservations"

  - priority: 10
    category: business_referential
    check: "ticket manifest belongs to the same hauler as the ticket"
    error_id: ERR_MANIFEST_MISMATCH
    http_status: 409
    applies_to: "POST /landfill/tickets/{id}/post"

  - priority: 11
    category: business_temporal
    check: "reserved weigh window does not overlap another RESERVED window on the same facility+lane; special-waste window respects the buffer from other windows on the same cell"
    error_id: "ERR_LANE_OCCUPIED / ERR_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /landfill/facilities/{id}/scale-reservations, POST /landfill/cells/{id}/disposal-windows"

  - priority: 12
    category: business_constraint
    check: "weigh-out net weight positive (not empty) and tare <= gross; at least one OPEN cell with sufficient airspace on post"
    error_id: "ERR_EMPTY_LOAD / ERR_INVALID_WEIGHT / ERR_NO_AIRSPACE"
    http_status: 409
    applies_to: "POST /landfill/tickets/{id}/weigh-out, POST /landfill/tickets/{id}/post"

  - priority: 13
    category: business_fiscal
    check: "hauler balance_cents + tipping_fee_cents does not exceed credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /landfill/tickets/{id}/post"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Facility ----
  - method: POST
    path: "/landfill/facilities"
    description: "Create a landfill facility"
    roles: [FacilityAdmin]
    code: 201
    input: ["name", "total_airspace_cubic_yards"]
    output: Facility
    side_effects: ["consumed_airspace_cubic_yards=0, gas_status=NORMAL, acceptance_posture=OPEN, version=1"]

  - method: GET
    path: "/landfill/facilities/{id}"
    description: "Get a facility with computed posture, gas_status and diversion rates"
    roles: [FacilityAdmin, GateOperator, EnvironmentalOfficer, BillingClerk, Hauler]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ---- Cell ----
  - method: POST
    path: "/landfill/facilities/{id}/cells"
    description: "Create a cell under a facility"
    roles: [FacilityAdmin]
    code: 201
    input: ["name", "capacity_cubic_yards"]
    output: Cell
    side_effects: ["consumed_cubic_yards=0, status=OPEN, fill_sequence assigned (monotone per facility)"]

  - method: GET
    path: "/landfill/facilities/{id}/cells"
    description: "List cells of a facility (reverse-reachability for Cell.facility_id)"
    roles: [FacilityAdmin, GateOperator, EnvironmentalOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Cell[]
    side_effects: []

  - method: GET
    path: "/landfill/cells/{id}"
    description: "Get a cell"
    roles: [FacilityAdmin, GateOperator, EnvironmentalOfficer]
    code: 200
    input: []
    output: Cell
    side_effects: []

  # ---- HaulerAccount ----
  - method: POST
    path: "/landfill/hauler-accounts"
    description: "Create a hauler account"
    roles: [FacilityAdmin]
    code: 201
    input: ["name", "credit_limit_cents"]
    output: HaulerAccount
    side_effects: ["balance_cents=0, status=ACTIVE"]

  - method: GET
    path: "/landfill/hauler-accounts/{id}"
    description: "Get a hauler account with running balance"
    roles: [FacilityAdmin, BillingClerk, Hauler]
    code: 200
    input: []
    output: HaulerAccount
    side_effects: []

  # ---- Manifest ----
  - method: POST
    path: "/landfill/manifests"
    description: "Create an inbound manifest (DRAFT)"
    roles: [Hauler]
    code: 201
    input: ["hauler_account_id", "declared_material", "declared_weight_tons"]
    output: Manifest
    side_effects: ["status=DRAFT, is_special_waste derived, special_waste_cleared=false"]

  - method: GET
    path: "/landfill/manifests/{id}"
    description: "Get a manifest"
    roles: [Hauler, GateOperator, EnvironmentalOfficer]
    code: 200
    input: []
    output: Manifest
    side_effects: []

  - method: GET
    path: "/landfill/manifests"
    description: "List manifests, optionally filtered by hauler (reverse-reachability for Manifest.hauler_account_id)"
    roles: [Hauler, GateOperator, EnvironmentalOfficer]
    code: 200
    input: ["hauler_account_id?", "limit?", "offset?"]
    output: Manifest[]
    side_effects: []

  - method: POST
    path: "/landfill/manifests/{id}/submit"
    description: "Submit a manifest for acceptance"
    roles: [Hauler]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> SUBMITTED (requires hauler ACTIVE)"]

  # ---- SpecialWasteApproval ----
  - method: POST
    path: "/landfill/manifests/{id}/special-waste-approvals"
    description: "Open a special-waste (tire/asbestos) approval request on a manifest"
    roles: [Hauler, EnvironmentalOfficer]
    code: 201
    input: ["waste_type", "profile_ref"]
    output: SpecialWasteApproval
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/landfill/manifests/{id}/special-waste-approvals"
    description: "List special-waste approvals of a manifest (reverse-reachability for SpecialWasteApproval.manifest_id)"
    roles: [Hauler, EnvironmentalOfficer, GateOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: SpecialWasteApproval[]
    side_effects: []

  - method: POST
    path: "/landfill/special-waste-approvals/{id}/decide"
    description: "Approve or deny a special-waste request"
    roles: [EnvironmentalOfficer]
    code: 200
    input: ["decision", "decision_note?"]
    output: SpecialWasteApproval
    side_effects: ["status -> APPROVED or DENIED; on APPROVE parent Manifest.special_waste_cleared -> true"]

  # ---- Ticket ----
  - method: POST
    path: "/landfill/tickets"
    description: "Scale-in: create a ticket with gross weight (provisional fee estimated)"
    roles: [GateOperator]
    code: 201
    input: ["facility_id", "hauler_account_id", "material", "gross_weight_tons", "manifest_id?"]
    output: Ticket
    side_effects: ["status=CREATED, estimated_fee_cents computed (provisional variant)"]

  - method: GET
    path: "/landfill/tickets/{id}"
    description: "Get a ticket"
    roles: [GateOperator, EnvironmentalOfficer, BillingClerk, Hauler]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/landfill/tickets"
    description: "List tickets with FK filters (reverse-reachability for Ticket facility/hauler/manifest/cell/invoice FKs)"
    roles: [GateOperator, EnvironmentalOfficer, BillingClerk, Hauler]
    code: 200
    input: ["facility_id?", "hauler_account_id?", "manifest_id?", "cell_id?", "invoice_id?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/landfill/tickets/{id}/weigh-out"
    description: "Scale-out: record tare, compute net weight and final tipping fee"
    roles: [GateOperator]
    code: 200
    input: ["tare_weight_tons"]
    output: Ticket
    side_effects: ["status -> WEIGHED, net_weight_tons computed, tipping_fee_cents computed (final variant)"]

  - method: POST
    path: "/landfill/tickets/{id}/inspect"
    description: "Load inspection: PASS advances to INSPECTED, REJECT terminates"
    roles: [GateOperator]
    code: 200
    input: ["result", "reject_reason?"]
    output: Ticket
    side_effects: ["status -> INSPECTED (PASS, inspected_by set) or REJECTED (REJECT)"]

  - method: POST
    path: "/landfill/tickets/{id}/post"
    description: "Post the load: select cell, consume airspace, charge hauler"
    roles: [GateOperator]
    code: 200
    input: ["expected_facility_version"]
    output: Ticket
    side_effects:
      - "status -> POSTED; cell_id selected; Cell.consumed_cubic_yards += posted_airspace_cy"
      - "cascade: Cell may become FULL; Facility posture may become CLOSED; Facility.version incremented by 1"
      - "HaulerAccount.balance_cents += tipping_fee_cents; may auto-SUSPEND; manifest -> CONSUMED"

  - method: POST
    path: "/landfill/tickets/{id}/void"
    description: "Void a ticket (compensating reversal of airspace and hauler charge)"
    roles: [GateOperator]
    code: 200
    input: []
    output: Ticket
    side_effects:
      - "status -> VOIDED; if POSTED: Cell.consumed_cubic_yards -= posted_airspace_cy; cell may reopen"
      - "Facility posture recomputed; Facility.version incremented by 1; HaulerAccount.balance_cents -= tipping_fee_cents; may auto-reactivate"

  # ---- GasReading ----
  - method: POST
    path: "/landfill/facilities/{id}/gas-readings"
    description: "Record a methane reading (updates facility gas_status and posture)"
    roles: [EnvironmentalOfficer]
    code: 201
    input: ["methane_ppm", "reading_at"]
    output: GasReading
    side_effects: ["resulting_gas_status classified; facility latest_methane_ppm, gas_status, acceptance_posture recomputed"]

  - method: GET
    path: "/landfill/facilities/{id}/gas-readings"
    description: "List gas readings of a facility (reverse-reachability for GasReading.facility_id)"
    roles: [EnvironmentalOfficer, FacilityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: GasReading[]
    side_effects: []

  # ---- DisposalWindow ----
  - method: POST
    path: "/landfill/cells/{id}/disposal-windows"
    description: "Schedule a special-waste disposal window on a cell (closed interval + buffer)"
    roles: [EnvironmentalOfficer]
    code: 201
    input: ["waste_type", "window_start", "window_end"]
    output: DisposalWindow
    side_effects: ["status=SCHEDULED (rejected if within buffer of another window on the cell)"]

  - method: GET
    path: "/landfill/cells/{id}/disposal-windows"
    description: "List disposal windows of a cell (reverse-reachability for DisposalWindow.cell_id)"
    roles: [EnvironmentalOfficer, FacilityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DisposalWindow[]
    side_effects: []

  # ---- ScaleReservation ----
  - method: POST
    path: "/landfill/facilities/{id}/scale-reservations"
    description: "Reserve a gate scale lane window (half-open interval, adjacency allowed)"
    roles: [Hauler, GateOperator]
    code: 201
    input: ["lane_number", "truck_ref", "window_start", "window_end"]
    output: ScaleReservation
    side_effects: ["status=RESERVED (rejected with ERR_FACILITY_CLOSED if facility posture == CLOSED; rejected with ERR_LANE_OCCUPIED if it overlaps another RESERVED window on the same facility+lane)"]

  - method: GET
    path: "/landfill/facilities/{id}/scale-reservations"
    description: "List scale reservations of a facility (reverse-reachability for ScaleReservation.facility_id)"
    roles: [Hauler, GateOperator, FacilityAdmin]
    code: 200
    input: ["lane_number?", "limit?", "offset?"]
    output: ScaleReservation[]
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/landfill/invoices"
    description: "Generate a settlement invoice sweeping the hauler's POSTED un-invoiced tickets"
    roles: [BillingClerk]
    code: 201
    input: ["hauler_account_id"]
    output: Invoice
    side_effects: ["status=ISSUED; line tickets swept and marked invoiced; total_cents computed (invoice_total)"]

  - method: GET
    path: "/landfill/invoices/{id}"
    description: "Get an invoice"
    roles: [BillingClerk, Hauler]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/landfill/invoices"
    description: "List invoices, optionally filtered by hauler (reverse-reachability for Invoice.hauler_account_id)"
    roles: [BillingClerk, Hauler]
    code: 200
    input: ["hauler_account_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/landfill/invoices/{id}/payments"
    description: "Record a payment against an invoice (may settle it and release hauler balance)"
    roles: [BillingClerk, Hauler]
    code: 201
    input: ["amount_cents", "method"]
    output: Payment
    side_effects: ["amount_paid_cents recomputed; if >= total_cents: Invoice -> PAID, cascade hauler balance release and possible reactivation"]

  - method: GET
    path: "/landfill/invoices/{id}/payments"
    description: "List payments of an invoice (reverse-reachability for Payment.invoice_id)"
    roles: [BillingClerk, Hauler]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Hauler acting on an account/manifest/invoice it does not own" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, invalid enum, negative amount, or window_end <= window_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_FACILITY_VERSION, http: 412, condition: "expected_facility_version does not match Facility.version on post" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Posting GateOperator is the same user that inspected the ticket" }
  - { id: ERR_FACILITY_CLOSED, http: 409, condition: "Facility acceptance_posture is CLOSED (gas exceedance or no airspace)" }
  - { id: ERR_SPECIAL_WASTE_NOT_APPROVED, http: 409, condition: "Special-waste ticket whose manifest is not cleared (no APPROVED approval)" }
  - { id: ERR_HAULER_SUSPENDED, http: 409, condition: "Manifest submit attempted while hauler account is SUSPENDED" }
  - { id: ERR_MANIFEST_MISMATCH, http: 409, condition: "Ticket manifest belongs to a different hauler than the ticket" }
  - { id: ERR_LANE_OCCUPIED, http: 409, condition: "Scale reservation window overlaps another RESERVED window on the same facility+lane" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "Disposal window falls within the buffer of another window on the same cell" }
  - { id: ERR_EMPTY_LOAD, http: 409, condition: "Weigh-out net weight is zero (gross equals tare)" }
  - { id: ERR_INVALID_WEIGHT, http: 409, condition: "Weigh-out tare weight exceeds gross weight" }
  - { id: ERR_NO_AIRSPACE, http: 409, condition: "No OPEN cell with sufficient remaining airspace for the load" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Ticket post would push hauler balance beyond credit limit" }
  - { id: ERR_NO_BILLABLE_TICKETS, http: 409, condition: "Invoice generation found no POSTED un-invoiced tickets for the hauler" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "Configures facilities, cells and hauler accounts"
    identity: opaque
    exclusive_operations:
      - "POST /landfill/facilities"
      - "POST /landfill/facilities/{id}/cells"
      - "POST /landfill/hauler-accounts"
    shared_operations:
      - "GET facility / cell / hauler / gas-reading / disposal-window / scale-reservation reads"

  - name: GateOperator
    description: "Runs the gate scale: weigh-in, weigh-out, inspection, posting, voids"
    identity: opaque
    exclusive_operations:
      - "POST /landfill/tickets"
      - "POST /landfill/tickets/{id}/weigh-out"
      - "POST /landfill/tickets/{id}/inspect"
      - "POST /landfill/tickets/{id}/post"
      - "POST /landfill/tickets/{id}/void"
    shared_operations:
      - "POST /landfill/facilities/{id}/scale-reservations"
      - "GET ticket / manifest / cell / facility reads"

  - name: EnvironmentalOfficer
    description: "Special-waste decisions, gas monitoring and disposal-window scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /landfill/special-waste-approvals/{id}/decide"
      - "POST /landfill/facilities/{id}/gas-readings"
      - "POST /landfill/cells/{id}/disposal-windows"
    shared_operations:
      - "POST /landfill/manifests/{id}/special-waste-approvals"
      - "GET manifest / approval / ticket / facility reads"

  - name: BillingClerk
    description: "Generates settlement invoices and records payments"
    identity: opaque
    exclusive_operations:
      - "POST /landfill/invoices"
    shared_operations:
      - "POST /landfill/invoices/{id}/payments"
      - "GET invoice / payment / hauler / ticket reads"

  - name: Hauler
    description: "A hauler company acting for its own account; declares manifests, reserves lanes, pays invoices"
    identity: "entity_backed:HaulerAccount"
    exclusive_operations:
      - "POST /landfill/manifests"
      - "POST /landfill/manifests/{id}/submit"
    shared_operations:
      - "POST /landfill/manifests/{id}/special-waste-approvals"
      - "POST /landfill/facilities/{id}/scale-reservations"
      - "POST /landfill/invoices/{id}/payments"
      - "GET own manifest / ticket / invoice / hauler reads"
